      The core question is: Are the behavioral benefits attributed to sortition primarily a function of removing re-election incentives, or do they require the randomization of selection? This needs splitting. First, does imposing strict term limits on elected officials produce similar deliberative behaviors as citizen assemblies? Second, does the method of selection independently alter decision-making when career incentives are held constant? If term-limited legislators vote like lottery-selected citizens, then the lottery is unnecessary window dressing. If they vote like career politicians despite being lame ducks, then the selection method is the active ingredient. We need to know if these reforms are substitutes or complements. If they are substitutes, term limits are a cheaper, politically viable path to similar outcomes. If they are complements, pursuing term limits alone is a distraction that wastes political capital without delivering the governance benefits sortition promises.

      *Drafting Section 3:*
      Current debates talk past this mechanism. Sortition advocates focus on descriptive representation and the competence of ordinary people. They assume the lottery breaks the chain of professionalization, but they rarely isolate whether it's the breaking of the chain or the random face that matters. They treat term limits as a half-measure that keeps the same corruptible people in power for shorter times. Election defenders argue accountability requires the threat of removal. They assume term limits weaken accountability by removing the voter's ultimate veto, ignoring that it also removes the politician's fear. Term limit advocates focus on turnover and opening seats. They argue fresh blood prevents entrenchment, but they don't measure whether that fresh blood acts differently once the next election is off the table. Everyone assumes their preferred reform changes behavior, but nobody compares the specific incentive structures. They argue over who should rule, not how the rules change the ruler's psychology when the career ladder is removed.

      *Drafting Section 4:*
      Month one and two are for mapping incentives, not reading theory. I'll interview former city councilors who were term-limited versus those who lost re-election. I need to know how their decision-making changed in their final term. Did they take more risks? Did they care less about donors? Simultaneously, I'll review after-action reports from citizen assemblies to see how participants describe their freedom from future consequences. Month three is drafting a comparative framework. I'll build a model comparing the "career risk" profile of a term-limited elected official against a sortition participant. Where do the pressures align? Where do they diverge? Month four is writing the discussion paper for the workshop. Month five is the workshop itself. I won't invite generalists. I'll bring together five term limit advocates and five sortition organizers. The goal isn't consensus; it's stress-testing the mechanism. I'll force them to argue whether the other side's reform achieves their goals. Month six is synthesizing the workshop feedback into the final report. As a non-academic, my advantage is access to practitioners. I'm not testing a hypothesis with statistics; I'm stress-testing a logic model with people who have lived the incentives. I'll focus on local legislature contexts where I have contacts, avoiding federal complexities.

      *Drafting Section 5:*
