      Let's write.

      *Drafting Section 1:*
      Your intuition hits a nerve, but it risks conflating "no future" with "no accountability." You argue the active ingredient is the dead-end nature of the job. That's promising, but it assumes a dead end makes people brave. It could just make them reckless. Without re-election, what stops a legislator from looting the till or selling votes to the highest bidder before exiting? Sortition solves this with peer accountability and short durations; term limits often leave careerists looking for their next lobbying gig. The sharper version of your idea isn't that term limits equal sortition. It's that both remove *electoral* accountability, but replace it with different structures. The project needs to test if the removal of electoral fear is enough on its own, or if the lottery selection changes the *type* of risk people are willing to take. Don't assume the mechanism is purely negative (removing careerism); it might be positive (changing social identity).

