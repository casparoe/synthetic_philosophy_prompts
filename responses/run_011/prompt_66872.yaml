      *   *Wait, one more check:* "working through their answer in the order they wrote it." I need to follow the essay structure.

      *   *Key explanation for the grader:* I need to make sure the grader understands *why* calling Williams a relativist who says slaveholders were "right" is wrong. Williams distinguishes between "appraisal" and "acknowledgement." He doesn't say they were right. He says we can't judge them by *our* standards in a meaningful way sometimes, but he doesn't validate their morality.

