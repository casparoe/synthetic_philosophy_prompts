      *   **Defensibility:** Give the grader specific phrases to use if challenged.

  5.  **Refining the Philosophy for the Grader:**
      *   Need to explain Williams without jargon. Williams thinks morality isn't like science (no "facts" waiting to be found). But he doesn't say "anything goes." The student says Williams says slaveholders were "right." That's the killer error.
      *   Need to explain the Appiah/Williams link. Appiah says honor changed. Williams says moral knowledge didn't increase. Student says "Yes, Appiah supports Williams because no knowledge was gained." This is actually a decent insight *if* the Williams part wasn't botched. The student misses that Appiah might think there *was* moral progress, just via honor.
      *   Actually, looking closer at the prompt: "does the honor mechanism support Williams, or does it quietly assume the kind of moral knowledge Williams thinks we don't have?" The student chooses "supports Williams." This is a defensible position, *but* their reasoning relies on a bad interpretation of Williams.
      *   So, grade deduction should focus on the Williams exegesis.

  6.  **Writing the Draft (monitoring constraints):**
