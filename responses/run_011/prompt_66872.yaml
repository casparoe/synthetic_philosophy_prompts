          *   Explain *why* claims are wrong (specific problems, where it bites).
          *   Provide reasoning accessible to a non-philosopher (walk through the concepts).
          *   Flag things got right that most students miss.
          *   Make the justification defensible to the instructor.
      *   **Essay Prompt:** Appiah on dueling, footbinding, slave trade (honor codes vs. moral argument) vs. Bernard Williams on moral change (moral knowledge vs. social change).
