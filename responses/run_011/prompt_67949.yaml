  You are describing the **Rationality of Irrationality**, a concept most famously articulated by Thomas Schelling in *The Strategy of Conflict*. In modern game theory and behavioral economics, the specific label for the trait you’ve identified is **Strategic Irrationality**.

  Here is the carving you asked for.

  **What it is:**
  Strategic Irrationality is a state where a deviation from perfect rational calculation (the "defect" you noticed) creates a credible constraint that prevents the unraveling of cooperation. In a finite iterated game (like your twelve-round negotiation or the Centipede Game), standard backward induction dictates immediate defection. That logic only holds if both parties are *commonly known* to be rational maximizers. If one party is perceived as *incapable* of that maximization—whether due to cognitive limits (Flavor 1) or framing myopia (Flavor 2)—the backward induction chain is broken. The "irrational" player cannot execute the endgame grab, so the rational player cooperates to keep the pot growing.

  **What it isn't:**
  *   **It isn't Commitment:** As you noted, commitment is an *act* (burning a bridge, signing a clause). It is voluntary and exogenous. Strategic Irrationality is *endogenous*; it is a limitation of the agent's own hardware or psychology. You cannot "choose" to be genuinely incapable in the moment without demonstrating the capacity to choose, which collapses the advantage.
  *   **It isn't Reputation:** Reputation is backward-looking (history of past moves). This is forward-looking based on present assessment of *capacity*. A player can be unknown to you, yet if they appear genuinely unable to calculate the endgame, cooperation holds immediately.
  *   **It isn't Trust:** Trust implies a belief that the other *could* hurt you but *chooses* not to. This is the belief that they *cannot* hurt you even if they wanted to.

  **The Two Flavors:**
  They are the same phenomenon viewed through different mechanisms.
  1.  **The Incapable (Emotional/Cognitive Constraint):** This is **Involuntary Commitment**. The player *wants* the money but lacks the execution capability (pride, slowness, sentiment). This creates a "hard" constraint.
  2.  **The Myopic (Framing Constraint):** This is **Bounded Rationality**. The player does not conceptualize the game as a finite sequence. They play the "stage game" repeatedly. This creates a "soft" constraint, but one that is equally effective at stopping backward induction because they literally do not see the round where they *should* defect.
  Both function because they remove the *threat* of the endgame grab.

  **Payoff and Scaling:**
  You are right that the payoff scales with the length of the game. In a 2-round game, the advantage is negligible. In a 100-round game, the "irrational" player extracts massive value because the rational counterparty must cooperate for 99 rounds to avoid triggering a walk-away or a collapse that the irrational player doesn't even foresee. The "edge" you asked about—the point where incapacity becomes strategy—is the **Handicap Principle**. The incapacity must be costly in other contexts (e.g., being "slow" loses you other deals) to be credible here. If the incapacity is costless, it is suspected as a feint. If it is costly, it is a true handicap, and the signal is honest.

  **The Label:**
  While "Commitment" is the mechanism, the *trait* itself—the asset of being unable to defect—is best termed **Strategic Irrationality**. It captures the paradox that being less rational (in the narrow game-theory sense) yields higher utility.

  \answer{Strategic Irrationality}
