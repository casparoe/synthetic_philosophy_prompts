answer: |-
  # PREP SHEET: THE RESIDUE HYPOTHESIS
  **Event:** Interdisciplinary Workshop on Perception (Closing Talk)
  **Audience:** 40 (Psychologists, Philosophers, Metascientists, Journalists)
  **Goal:** Defend the claim that cognitive penetration is a measurement artifact (report criteria), not a phenomenon.

  ---

  ### THE CRITICAL REPLY
  **You must land the reply to Objection #1 (The Metascientist).**
  Your entire thesis rests on the empirical claim that effect sizes shrink as controls sharpen. If the audience accepts the Metascientist's counter—that shrinkage is merely the correction of publication bias, not the disappearance of a phenomenon—your "Residue" argument becomes a just-so story with no data. You do not need to convince them penetration is impossible (philosophy); you must convince them the *evidence* for it is evaporating (science). If this reply fails, the talk is merely an opinion piece.

  ---

  ### THE OBJECTIONS (Ordered by Damage)

  #### 1. The Metascientist (The "File Drawer" Counter)
  **The Objection:** "You argue effect sizes shrink as methods improve, implying the effect is vanishing. But we know the 'decline effect' is often just the correction of publication bias and p-hacking. When we preregister, noisy data regresses to the mean. You're mistaking the cleanup of the literature for the disappearance of the phenomenon. How do you distinguish a null result from a underpowered study?"

  **The Reply (2 min):** "Regression to the mean is random; methodological control is directional. If shrinkage were just noise correction, we wouldn't see the effect vanish specifically when report criteria are decoupled from inference. We see large effects in subjective magnitude estimation, and near-zero effects in forced-choice discrimination under the same conditions. That isn't random noise; that's a signal located in the report, not the sensory input. The decline isn't just about power; it's about *where* the variance lives."
  *   **Soft Spot:** You rely on the assumption that the specific controls used in the "shrinking" studies are themselves unbiased.
  *   **Concede Up Front:** Concede that early literature was indeed p-hacked. Don't defend the old studies; argue that even the *best* new preregistered studies show the same pattern of disappearance when report bias is removed.

  #### 2. The Experimental Psychologist (The "Action" Counter) **[POTENTIALLY FATAL]**
  **The Objection:** "You say this is about report criteria. But we have studies where fear or fitness changes reaching trajectories, grip aperture, or postural sway. Subjects aren't reporting anything; they're acting. If cognition changes how I grab a cup, it has penetrated the visuomotor system. Your hypothesis only covers verbal reports."

  **The Reply (2 min):** "Visuomotor systems are not perceptual systems. They are output channels optimized for action, not truth. A grasping hand can be calibrated by expectation without the *world looking different* to the subject. My hypothesis is about perception—the phenomenological and representational state of the world. If you want to claim 'motor penetration,' fine, but don't conflate a motor bias with a perceptual one. The workshop is on perception, not motor control."
  *   **Soft Spot:** This is a definitional dodge. If cognition alters the visual processing guiding the hand, most in this room will call that "perception."
  *   **Concede Up Front:** **Crucial:** You must concede that the Residue Hypothesis applies specifically to *conscious perceptual report* and *explicit estimation*. If you claim it applies to implicit visuomotor processing, you will be falsified by the literature. Narrow your scope to save the thesis.

  #### 3. The Fodorian Philosopher (The "Begging the Question" Counter)
  **The Objection:** "You define 'perception' as 'what remains after you control for cognitive bias.' That's circular. You've stipulated modularity by definition. If a top-down expectation alters the visual cortex, you'll just say, 'Oh, that was a report criterion.' You've made your hypothesis unfalsifiable."

  **The Reply (2 min):** "It's not a definition; it's a measurement protocol. We don't define 'temperature' as 'what's left after we account for wind chill,' but we do isolate variables to measure it. I'm arguing that the field has failed to isolate the variable. If you claim penetration, the burden is on you to show the effect survives when the subject has no incentive to guess. I'm not defining modularity; I'm demanding the evidence for its violation meets the standard of evidence we require for the null."
  *   **Soft Spot:** You are effectively moving the goalposts of what counts as "perception."
  *   **Concede Up Front:** Acknowledge that your operational definition of perception is stricter than theirs. Argue that it is necessary for scientific clarity.

  #### 4. The Ecological Psychologist (The "Real World" Counter)
  **The Objection:** "You love your tightly controlled lab tasks. But in the wild, attention, expectation, and motivation *are* part of perception. A steep hill looks steeper when you're tired because that *is* the relevant information for the organism. Stripping that away doesn't reveal 'true' perception; it reveals an artificial slice of it."

  **The Reply (2 min):** "Science often isolates variables to understand mechanisms. We don't say gravity isn't real because feathers fall slower in air. If fatigue changes the *report* of steepness but not the ability to navigate the slope, the 'steepness' change is an inference about energy cost, not a change in visual geometry. We need to know which is which to understand the mind."
  *   **Soft Spot:** "Navigating the slope" is hard to measure without report.
  *   **Concede Up Front:** Concede that ecological validity is important, but insist that mechanism must be understood before application.

  #### 5. The Metascientist (The "Power" Counter)
  **The Objection:** "You say effects shrink to zero. But many of the null results you cite are underpowered. If you run a preregistered study with N=20 and find nothing, that doesn't prove the effect is zero. It proves you didn't find it. Are you sure the residue isn't just a Type II error?"

  **The Reply (2 min):** "Fair point on individual studies. But I'm pointing to the meta-analytic trend. When you aggregate high-power, preregistered replications of the classic effects (like the Proffitt hill studies), the aggregate effect size trends toward null. One underpowered null is noise; a pattern of high-powered nulls is a signal."
  *   **Soft Spot:** Meta-analysis of null results is tricky (file drawer problem still applies).
  *   **Concede Up Front:** Acknowledge that absolute zero is hard to prove. Argue the effect is too small to be theoretically meaningful, even if non-zero.

  #### 6. The Philosopher of Science (The "Theory-Ladenness" Counter)
  **The Objection:** "Hanson and Kuhn taught us all observation is theory-laden. You can't strip away 'inference' from 'seeing' because the visual system itself is a hypothesis generator. You're trying to resurrect a logical positivist view of pure sensation that died fifty years ago."

  **The Reply (2 min):** "I'm not arguing for pure sensation. I'm arguing for *informational encapsulation*. The visual system can generate hypotheses about edges and depth without accessing your belief about your own fitness. Theory-ladenness doesn't mean *everything* penetrates *everywhere*. I'm asking for boundaries, not purity."
  *   **Soft Spot:** The boundary between "visual hypothesis" and "cognitive belief" is blurry.
  *   **Concede Up Front:** Concede that "pure" perception is a myth. Reframe the argument as about *degrees* of encapsulation, not binary existence.

  #### 7. The Journalist (The "Phenomenology" Counter)
  **The Objection:** "I've interviewed people who swear the world looks different when they're depressed or afraid. You're telling them they're lying about their own experience? Even if it's 'bias,' it's their reality. Why does the mechanism matter if the experience is real?"

  **The Reply (2 min):** "I'm not calling them liars. I'm saying their brain is telling them a story about the world, not showing them the world. If a drug makes you feel rich, we don't say your bank account changed. If we want to help people with depression, we need to know if the world is dark or if their *report* is dark. The mechanism dictates the cure."
  *   **Soft Spot:** Can sound dismissive of lived experience.
  *   **Concede Up Front:** Validate the reality of the *experience*, distinguish it from the accuracy of the *perception*.

  #### 8. The Social Psychologist (The "Demand Characteristics" Counter)
  **The Objection:** "You say subjects are guessing what the experimenter wants. But demand characteristics are a feature of social interaction, not a bug. If cognition changes how I interact with the experimenter, that's a cognitive effect on behavior. You're just pushing the phenomenon into the social realm."

  **The Reply (2 min):** "If the effect disappears when I use a double-blind protocol or an implicit measure, it wasn't perception. It was social compliance. We don't study hypnosis by asking subjects to lie down; we study it by seeing if they actually relax. Same here."
  *   **Soft Spot:** Double-blind is hard in perception studies (experimenter often knows the condition).
  *   **Concede Up Front:** Admit that demand characteristics are hard to eliminate fully, but argue that the *attempt* to eliminate them is what separates science from demonstration.

  ---

  ### THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "If you're right, and this is all report bias, why has the field believed it for twenty years? Are you accusing hundreds of researchers of incompetence, or is there a simpler explanation you're ignoring?"

  **Your Honest Answer:** "I am accusing the field of relying on measures that conflate seeing with judging. It's not incompetence; it's a category error that was easy to make because the intuition feels so strong. We trusted the phenomenology over the measurement. I'm asking us to trust the design."

  ---

  ### STRATEGIC ADVICE (Definite Position)
  **Objection #2 (Implicit/Action Measures) is fatal to your universal claim.**
  You cannot argue that *no* cognitive penetration exists if visuomotor tasks show effects. If you stand by the universal claim ("Cognitive penetration is not a phenomenon"), you will lose the psychologists in the room who have grasping data.
  **Recommendation:** Modify your thesis slightly in the talk. State clearly: *"The Residue Hypothesis applies to conscious perceptual experience and explicit report."* Do not fight the motor data. Sacrifice the motor system to save the perceptual system. If you try to claim the grasping hand is "not perception" without nuance, you will look dogmatic. If you concede that motor systems are penetrable but argue that *visual experience* is not, you keep the philosophers and journalists on board while neutralizing the psychologists' strongest data.

  **Final Instruction:** Open the talk by conceding the point on implicit measures. It disarms the psychologists immediately and lets you focus the debate on the nature of *experience*, which is where your argument is strongest and where the journalists care most.
