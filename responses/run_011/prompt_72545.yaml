prompt: |-
  You're an expert in democratic theory and election administration — social choice, the philosophy of voting, the actual practice of drafting ballot language, all of it. Think carefully before you write, and don't jump straight to the deliverable.

  Here's my situation. I work in a small state office that certifies ballot language for statewide initiative measures. Two lawyers and me, none of us with any social-choice training. For every measure that clears the signature count we currently do exactly one thing: check that the official title and summary are accurate and non-argumentative, sign off, done. Budget is about an hour per measure, less in a crunch year when forty are queued up between September and the filing deadline. What we certify is what voters actually read on the ballot, so when it goes wrong it goes wrong publicly and it's my name on it.

  New wrinkle from our director: we now run a second screen before certifying. We have to say whether the question is *answerable* — meaning, is there a determinate thing that happens on each of the two answers, and could a voter reading our summary tell which of those two things they'd be choosing. If the answer is no, note that we have no power to kill a measure and aren't supposed to want one. Our whole action space is: certify as drafted, certify with a rewritten explanatory statement that puts the ambiguity on the page where voters can see it, or flag a legal question up to the AG. That's it.

  Write me the procedure we'd run. Specifically:

  - the questions to work through, in order, with what counts as a *sufficient* answer at each step and what a failure looks like on paper (not in theory — what would I be seeing in a filing)
  - where the procedure terminates in "certify," where it forces a rewritten explanatory statement, and where it hands the thing to a human because the question underneath is about values and not about facts, and which human
  - every step where the honest description is "this is a judgment call we've dressed up as a check." Label those explicitly. I would rather have them marked than buried, because I'll be defending the signoff in a public meeting someday.

  On grounding: base it on what social choice and the philosophy of democracy actually establish, but be a good citizen about it. My colleagues wave famous impossibility results at me constantly and I want that to stop — so tell me which of the big results do **not** bite on a single yes/no question and why not, and for the ones that do bite (collapsing a three-way option set into one binary, whatever else you think is real here), say precisely what they license us to conclude and don't oversell it. A procedure that rests on a result that doesn't apply is worse than no procedure.

  Two hard cases it has to absorb without special pleading:
  (a) a measure drafted as a bare instruction to the legislature to go enact something, rather than as self-executing text. The Swiss treat that as a distinct category of popular initiative with its own validity test, and I think that's instructive even though we don't have their machinery — what does answerability even mean when the thing being voted on is a direction to a future body?
  (b) a purely advisory question where nothing legally follows from either answer. Do we certify it, and on what theory?

  Then run the procedure on three filings. Show your work at each step, don't just give me the verdict.

  1. A one-sentence measure withdrawing the state from a multi-state compact, with no transition provisions. The yes campaign is already running ads saying a no vote means the legislature should go renegotiate better terms. The no campaign is saying a no vote means we stay exactly as we are. Both statements are in circulation now and our summary is silent on it. (The 2016 UK referendum is the obvious cautionary case — a two-option choice with no exit terms attached and a statute that didn't itself do anything — but don't build the procedure around it, we don't have that political setting.)

  2. One sales-tax increase funding three named projects: a riverfront park, a municipal pool, and a transit line. Single subject is claimed on the basis that all three serve recreation and mobility. Our AG will tell us the single-subject rule is satisfied, and she's right — the courts here read it so loosely that basically nothing has ever failed it. I want to know whether the answerability screen catches something the single-subject screen structurally can't, and if it does, what the procedure tells me to do given that I can't strike anything.

  3. The one I don't want. A measure striking one category out of the state civil rights statute. One sentence, one subject, self-executing, no transition gap, and the consequences of yes and of no are each perfectly clear and describable — our summary could be written in nine lines with nothing contestable in them. I expect the procedure to certify this and I want it to say so plainly. If your procedure blocks it instead, I want you to explain exactly which step is doing the blocking and why that's a substantive judgment we have no mandate, no competence, and no democratic standing to make.

  Finish with a short section on what this procedure cannot do that we should stop pretending it can — including, I suspect, anything about whether the outcome will be good, and anything about how much a 51% win licenses the winning side to claim afterwards.

  Start with a brainstorm: list the distinct ways a ballot question can fail to determine an outcome, before you turn any of them into steps. That list is most of the value for me, so don't compress it into the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Expert in democratic theory, election administration, social choice, philosophy of voting.
      *   **Context:** Small state office (3 people: 2 lawyers, 1 user) certifying ballot language for initiatives.
      *   **Current Process:** Check title/summary for accuracy/non-argumentative nature. Sign off. ~1 hour/measure.
      *   **New Requirement:** A "second screen" for *answerability*. Does a "Yes" or "No" vote lead to a determinate outcome? Can the voter tell the difference based on the summary?
      *   **Constraints/Actions:** Cannot kill a measure. Actions: Certify as drafted, Certify with rewritten summary (highlighting ambiguity), or Flag legal question to AG.
      *   **Deliverables:**
          1.  Brainstorm: Distinct ways a ballot question fails to determine an outcome.
          2.  Procedure: Step-by-step questions, sufficient answers, failure modes, termination points (Certify, Rewrite, AG/Human), and explicit labeling of "judgment calls."
          3.  Grounding: Social choice theory (what applies/doesn't apply to binary referenda).
          4.  Hard Cases: (a) Instruction to legislature, (b) Advisory questions.
          5.  Test Cases: Run the procedure on three specific filings (Compact withdrawal, Sales tax bundle, Civil rights repeal).
          6.  Limitations: What the procedure *cannot* do (outcomes, mandates).
      *   **Tone:** Professional, precise, honest about limitations, defensible in public.

  2.  **Brainstorming: Ways a Ballot Question Fails to Determine an Outcome:**

      *   *Semantic Ambiguity:* The words mean different things to different people (e.g., "fair," "reasonable").
      *   *Legal Ambiguity:* The text conflicts with existing law or the constitution, making the effect unknown until courts rule.
      *   *Implementation Gap:* The measure says "do X" but doesn't say *how*, and X requires administrative machinery that doesn't exist (e.g., "build a high-speed rail" without funding or authority).
      *   *Conditional Ambiguity:* The effect depends on an external event (e.g., "if the federal government agrees").
      *   *The "Null" Option:* A "No" vote might mean "status quo," but the "Status Quo" is itself changing or undefined.
      *   *The "Instruction" Problem:* Voting to tell someone else to do something, where that person isn't bound to do it.
      *   *The "Bundle" Problem:* Voting on multiple things at once (logrolling), where a voter might want A but not B, but can only vote Yes/No on the package. (This is the core social choice issue).
      *   *The "Advisory" Problem:* Voting on something with no legal consequence. Is the "outcome" just the expression of opinion?
      *   *Temporal Ambiguity:* When does the change happen? Immediately? In 10 years?
      *   *Fiscal Indeterminacy:* The cost is unknown, making the "price" of the decision unknowable.

  3.  **Grounding in Social Choice & Democratic Theory:**

      *   *Arrow's Impossibility Theorem:* Does not apply to a single binary choice. It applies to aggregating *ranked preferences* over *three or more options*. A Yes/No referendum is a social welfare function with 2 alternatives. It's theoretically stable *if* the alternatives are well-defined.
      *   *McKelvey's Chaos Theorem:* Applies to multidimensional spatial voting in legislatures. Less relevant to a single binary text, unless the text implies a multidimensional policy space (the "Bundle" problem).
      *   *Condorcet Criterion:* In a binary choice, the majority winner *is* the Condorcet winner (if one exists). The issue isn't the counting; it's the *definition of the alternatives*.
      *   *The Core Issue:* Social choice theory assumes the *agenda* is fixed. In initiatives, the agenda (the text) is endogenous. The "Answerability" screen is essentially checking if the *agenda setting* has created a coherent choice set.
      *   *Democratic Legitimacy:* Requires informed consent. If the consequences are unknowable, consent is fictional.
      *   *Mandate Theory:* A 51% win on an ambiguous question does not constitute a mandate for a specific interpretation.

  4.  **Developing the Procedure:**

      *   *Goal:* Operationalize "Answerability."
      *   *Structure:* Sequential filters.
      *   *Step 1: Textual Clarity.* (Semantic).
      *   *Step 2: Legal Operability.* (Self-executing vs. Instruction).
      *   *Step 3: Consequence Differentiability.* (Can you tell Yes from No?).
      *   *Step 4: The Bundle Check.* (Is it actually one question?).
      *   *Decision Nodes:* Certify, Rewrite Summary, AG Referral.
      *   *Judgment Calls:* Must be flagged.

  5.  **Addressing Hard Cases:**

      *   *(a) Instruction to Legislature:* This is the "Null" or "Non-binding" problem. Answerability depends on whether the summary clarifies the non-binding nature. If it's binding (Swiss style), it needs a timeline. If non-binding, the "outcome" is the expression of will.
      *   *(b) Advisory:* Similar to (a). The "outcome" is the poll result. Answerability requires the summary to state "This change is not legally binding."

  6.  **Running the Test Cases:**

      *   *Case 1 (Compact Withdrawal):* Ambiguity on the "No" vote (Renegotiate vs. Status Quo). Also, "Yes" vote might have transition gaps.
          *   *Action:* Rewrite Summary to clarify the legal effect of Yes (withdrawal) and No (status quo, renegotiation is political not legal).
      *   *Case 2 (Sales Tax Bundle):* Three projects. Voter might want Park but not Transit. This is a "Bundle" problem. Social choice says this violates preference aggregation.
          *   *Action:* Can't strike. Must rewrite summary to explicitly list the three distinct items and warn that a Yes votes for all three. Flag as a "Judgment Call" on whether this constitutes a single question.
      *   *Case 3 (Civil Rights Repeal):* Clear text, clear consequences.
          *   *Action:* Certify. Do not block based on substantive merit. This is crucial for democratic neutrality.

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the weight of the task.
      *   *Brainstorm:* List the failure modes clearly.
      *   *Theory Grounding:* Explain why Arrow doesn't kill this, but "Agenda Control" does.
      *   *The Procedure:* Step-by-step with "Judgment Call" warnings.
      *   *Hard Cases:* Integrate into the procedure logic.
      *   *Test Cases:* Apply the logic rigorously.
      *   *Limitations:* Be humble about what certification means.

  8.  **Refining the "Judgment Call" Labels:**

      *   I need to be very specific. Where am I making a political judgment vs. a linguistic one?
      *   Example: Deciding if "renegotiate" is a legal outcome or a political hope. That's a legal/linguistic judgment, but borders on political.
      *   Example: Deciding if three projects constitute "one subject" for the *voter* (even if they do for the court). That is a social choice judgment.

  9.  **Refining the Social Choice Grounding:**

      *   Make sure to explicitly state: Arrow's Theorem requires $>2$ options. We have 2. So Arrow is irrelevant to the *count*, but relevant to the *construction* of the options (is "Yes" actually a bundle of options A, B, and C?).
      *   Focus on *Preference Aggregation* vs. *Option Definition*.

  10. **Review against Constraints:**

      *   Did I answer the specific questions? (Order, sufficient answer, failure on paper).
      *   Did I handle the Hard Cases (Instruction, Advisory)?
      *   Did I run the 3 Test Cases with work shown?
      *   Did I include the Limitations section?
      *   Is the tone appropriate? (Expert, colleague-to-colleague, defensive-ready).

  11. **Self-Correction/Polishing:**

      *   *Critique:* Is the procedure too long for 1 hour/measure?
      *   *Fix:* Keep the steps sharp. The "Brainstorm" is for training/understanding, the "Procedure" is the checklist.
      *   *Critique:* Did I address the "AG Referral" path correctly?
      *   *Fix:* Ensure AG referral is reserved for *legal* operability, not policy ambiguity.
      *   *Critique:* Case 3 is the trap. If I block it, I fail the neutrality test.
      *   *Fix:* Ensure the procedure explicitly clears Case 3 unless there's textual ambiguity (which the prompt says there isn't).

  12. **Final Polish:** Check the "Judgment Call" flags. Ensure they are prominent. (e.g., **[JUDGMENT CALL]**).

  *(Self-Correction during drafting)*: Wait, the prompt asks for the "Brainstorm" *first*. I need to make sure that list is distinct and valuable before moving to the procedure.
  Also, need to ensure I distinguish between "Legal Ambiguity" (AG territory) and "Voter Comprehension Ambiguity" (Summary Rewrite territory).

  Let's assemble the response.

  *Structure:*
  1. Brainstorm: Failure Modes.
  2. Theoretical Grounding (Social Choice).
  3. The Procedure (Steps, Outcomes, Judgment Calls).
  4. Hard Cases Integration.
  5. Test Cases Application.
  6. Limitations.

  *Key Insight for Case 2:* The single-subject rule is legal. The "answerability" rule is cognitive/social choice. A measure can be legal (one subject) but unanswerable (bundled preferences). The procedure must catch this without striking the measure. The remedy is the Summary.

  *Key Insight for Case 1:* The "No" vote ambiguity is the killer. The summary must fix the baseline.

  *Key Insight for Case 3:* Do not touch. This validates the procedure's neutrality.

  Let's write.
answer: |-
  ### Part 1: Brainstorm — Distinct Failure Modes of Answerability

  Before we build the checklist, we need to agree on what "unanswerable" actually looks like in a filing. In social choice terms, a vote is a function mapping a voter's preference to an outcome. If the mapping is broken, the vote is noise. Here are the distinct ways the mapping breaks:

  1.  **Semantic Indeterminacy:** The text uses terms that lack a fixed referent (e.g., "appropriate funding," "reasonable standards"). A voter cannot know what they are buying because the price is undefined.
  2.  **The Null Consequence (Advisory/Instruction):** The measure directs an agent (Legislature, Governor) to act, but provides no legal mechanism to compel action. A "Yes" vote produces a legal command that may result in zero physical change. The outcome is "expression of opinion," not "policy change."
  3.  **The Baseline Drift:** The "No" vote is defined relative to a status quo that is itself unstable or undefined. (e.g., "Shall we adopt the new federal standard?" when the federal standard is currently being litigated).
  4.  **The Implementation Gap:** The measure mandates an outcome (e.g., "Provide universal healthcare") but grants no authority, funding, or mechanism to achieve it. The "Yes" outcome is a legal mandate for an impossible physical state.
  5.  **The Hidden Bundle (Logrolling):** The measure combines distinct policy propositions (A + B + C) into a single binary choice. A voter who wants A but opposes B cannot express that preference. The "Yes" option is actually a set of options, violating the binary assumption.
  6.  **The Conditional Trigger:** The effect of the measure depends on an external event outside the state's control (e.g., "This law takes effect if Congress passes Bill X"). The outcome is contingent on unknown future facts.
  7.  **The Transition Void:** The measure changes a legal state immediately but provides no rule for the interim period (e.g., withdrawing from a compact without specifying what happens to current joint assets). The "Yes" outcome leads to legal chaos, which is a determinate outcome only in the sense that it is determinately bad, but functionally unknowable.
  8.  **The Contradictory Mandate:** The measure requires two things that cannot simultaneously be true under current law, without specifying which prevails. (e.g., "Increase teacher pay by 20%" and "Do not raise taxes").

  ---

  ### Part 2: Theoretical Grounding (Social Choice & Democracy)

  Your colleagues are waving Arrow at you. Tell them to put it down.

  **Why Arrow's Impossibility Theorem Does Not Bite Here:**
  Arrow's Theorem applies to ranking *three or more* alternatives. It proves you cannot aggregate ranked preferences into a social ordering without violating certain fairness criteria. A referendum is a binary choice (Yes/No) over a *single* proposal. Mathematically, a binary social welfare function is trivial; it always produces a winner (assuming odd voters or a tie-break rule). Arrow is irrelevant to the *counting* of a yes/no question.

  **Where Social Choice *Does* Bite:**
  Social choice theory warns us about **Agenda Control** and **Preference Aggregation**.
  1.  **The Bundle Problem:** If a "Yes" vote is actually a vote for {Policy A, Policy B, Policy C}, you have collapsed a multidimensional preference space into a single dimension. This violates the "independence of irrelevant alternatives" intuition. Voters cannot reveal their true preferences. This is Failure Mode #5 above.
  2.  **The Mandate Fallacy:** Social choice theory establishes that a 51% win on a binary question licenses *only* the implementation of the text as written. It does not license the winning coalition to claim a mandate for *interpretations* of the text that were not explicit. If the text is ambiguous, the "will of the people" is mathematically undefined.

  **Democratic Theory Grounding:**
  Legitimacy rests on **Informed Consent**. If the consequences of a vote are unknowable (due to ambiguity or implementation gaps), consent is procedurally defective. Our job is not to ensure the *outcome* is good, but to ensure the *choice* is real.

  ---

  ### Part 3: The Answerability Procedure

  **Time Budget:** 45 minutes per measure (leaving 15 mins for standard title/summary check).
  **Action Space:** Certify | Certify with Rewritten Summary | Refer to AG.

  #### Step 1: The Operability Check (Legal vs. Political)
  **Question:** Does the text create a legally enforceable change, or does it issue a political instruction?
  *   **Sufficient Answer:** "The text amends statute/constitution directly" OR "The text creates a binding duty with a deadline."
  *   **Failure on Paper:** Text reads "The Legislature shall..." without a fallback if they don't, OR "The People advise..."
  *   **Action:**
      *   If legally binding but complex: Proceed to Step 2.
      *   If instruction/advisory: **Flag for Summary Rewrite.** The summary *must* state: "A Yes vote directs the Legislature to act, but does not legally compel it," or "A Yes vote expresses an opinion; no law changes."
      *   **[JUDGMENT CALL]:** Distinguishing between a "binding mandate with weak enforcement" and a "non-binding instruction." If the measure lacks a penalty for non-compliance, treat it as advisory for the summary.

  #### Step 2: The Baseline Check (Status Quo Definition)
  **Question:** Is the consequence of a "No" vote stable and knowable?
  *   **Sufficient Answer:** "A No vote maintains current statute X, section Y."
  *   **Failure on Paper:** Campaign materials claim "No means renegotiate" or "No means wait for federal action," while the text implies "No means nothing changes."
  *   **Action:**
      *   If campaigns are claiming outcomes not in the text: **Certify with Rewritten Summary.** The summary must explicitly define the "No" baseline. "A No vote retains current law. It does not require renegotiation."
      *   **[JUDGMENT CALL]:** Determining whether a campaign claim is a "reasonable inference" or a "fabrication." If the text is silent, the campaign claim is a fabrication for the purpose of the summary.

  #### Step 3: The Bundle Check (Preference Aggregation)
  **Question:** Does a "Yes" vote require accepting multiple distinct policy changes that a voter might reasonably wish to separate?
  *   **Sufficient Answer:** "The measure addresses one policy mechanism (e.g., a tax rate) applied to one end."
  *   **Failure on Paper:** "Funds Project A, Project B, and Project C." A voter might want A but not B.
  *   **Action:**
      *   If distinct projects are listed: **Certify with Rewritten Summary.** The summary must list them as distinct items: "This measure funds three separate projects: 1... 2... 3... A Yes vote approves all three."
      *   **[JUDGMENT CALL]:** Defining "distinct." (See Hard Case 2 below). This is not a legal single-subject test; it is a cognitive separability test.
      *   **Constraint:** Do not recommend striking. We cannot cure the bundle, only disclose it.

  #### Step 4: The Implementation Gap Check
  **Question:** If the measure passes, is there a clear path to the stated outcome, or does it require further legislation to function?
  *   **Sufficient Answer:** "The measure is self-executing" OR "The measure appropriates funds necessary for its own execution."
  *   **Failure on Paper:** "The state shall achieve X" (where X requires new infrastructure not authorized) without funding or authority.
  *   **Action:**
      *   If the gap is legal (needs authority): **Refer to AG.** "Does current law allow this mandate without enabling legislation?"
      *   If the gap is fiscal/administrative: **Certify with Rewritten Summary.** "A Yes vote mandates X. Implementation may require further legislative appropriation."
      *   **[JUDGMENT CALL]:** Deciding if the gap is "fatal" (AG) or "procedural" (Summary). If the measure creates a legal duty that cannot be physically performed, it's an AG question. If it creates a duty that is just expensive, it's a Summary note.

  #### Step 5: Termination
  *   **Certify As Drafted:** Steps 1-4 pass cleanly.
  *   **Certify with Rewritten Summary:** Steps 1, 2, 3, or 4 reveal ambiguities that can be disclosed but not fixed in the text.
  *   **Refer to AG:** Step 4 reveals a potential legal contradiction or impossibility that affects the validity of the measure itself (not just voter understanding).

  ---

  ### Part 4: Handling the Hard Cases

  **(a) The Instruction to Legislature (Swiss Model)**
  *   **Theory:** In Switzerland, a "general proposal" (instruction) is distinct from a "drafted bill." We don't have that distinction.
  *   **Procedure Application:** Treat under **Step 1 (Operability)**.
  *   **Answerability Definition:** The "outcome" of an instruction is the *transmission of the instruction*, not the *policy result*.
  *   **Requirement:** The summary must explicitly decouple the vote from the policy outcome. "A Yes vote instructs the Legislature. It does not enact the policy." This preserves answerability: The voter is choosing whether to send the instruction, not whether the policy becomes law immediately.

  **(b) The Purely Advisory Question**
  *   **Theory:** Democratic theory permits advisory votes as "public opinion aggregation."
  *   **Procedure Application:** Treat under **Step 1 (Operability)** and **Step 2 (Baseline)**.
  *   **Answerability Definition:** The outcome is the *recorded opinion*.
  *   **Requirement:** The summary must state: "This measure has no legal effect. It records public opinion only."
  *   **Certification:** We certify it, provided the summary carries this warning. To refuse certification would be to deny the right to assemble an opinion, which is a substantive judgment on the *value* of advisory votes.

  ---

  ### Part 5: Running the Procedure on Your Three Filings

  #### Filing 1: Compact Withdrawal (The "Brexit" Scenario)
  *   **Text:** One sentence withdrawing state from compact. No transition.
  *   **Campaign:** Yes = Leave. No = Renegotiate (Yes side) vs. No = Status Quo (No side).
  *   **Step 1 (Operability):** Self-executing withdrawal. Pass.
  *   **Step 2 (Baseline):** **FAIL.** The "No" vote baseline is contested. Legally, "No" means "Stay in Compact." Campaign claims "Renegotiate" is a political hope, not a legal outcome.
  *   **Step 4 (Implementation Gap):** **FAIL.** No transition provisions. Withdrawing immediately may create legal chaos regarding joint assets.
  *   **Action:** **Certify with Rewritten Summary.**
  *   **Work:**
      *   *Drafting the Summary:* "A Yes vote withdraws the state from the Compact immediately. Current law does not specify how joint assets are divided upon withdrawal. A No vote keeps the state in the Compact. A No vote does not legally require other states to renegotiate terms."
      *   *Why:* This fixes the Baseline Drift (Step 2) and discloses the Transition Void (Step 4) without striking the measure.
      *   *Judgment Call:* We are deciding that "renegotiation" is not a legal outcome. This is defensible because no statute mandates renegotiation upon a failed withdrawal vote.

  #### Filing 2: Sales Tax Bundle (The "Logroll" Scenario)
  *   **Text:** Sales tax increase funding Park, Pool, Transit.
  *   **Legal:** AG says Single Subject is met (Recreation/Mobility).
  *   **Step 1 (Operability):** Self-executing tax. Pass.
  *   **Step 3 (Bundle Check):** **FAIL.** Three distinct capital projects. A voter may support transit but oppose a pool. This is a Preference Aggregation failure.
  *   **Action:** **Certify with Rewritten Summary.**
  *   **Work:**
      *   *Drafting the Summary:* "This measure raises the sales tax by X%. Revenue is dedicated to three specific projects: 1) Riverfront Park, 2) Municipal Pool, 3) Transit Line. A Yes vote approves the tax and all three projects. The projects cannot be funded separately under this measure."
      *   *Why:* We cannot strike the bundle (legal constraint). We cannot certify as drafted (voter cannot distinguish preferences). We must disclose the bundling.
      *   *Judgment Call:* We are asserting that these are "distinct" for voting purposes despite the legal "single subject" ruling. **Label this explicitly in the file:** "While legally one subject, these are three distinct expenditure decisions bundled for the voter."

  #### Filing 3: Civil Rights Repeal (The "Uncomfortable Certainty" Scenario)
  *   **Text:** Strikes Category X from Civil Rights Statute.
  *   **Attributes:** One sentence, self-executing, clear consequences.
  *   **Step 1 (Operability):** Self-executing repeal. Pass.
  *   **Step 2 (Baseline):** Clear. Yes = Repeal. No = Keep. Pass.
  *   **Step 3 (Bundle):** Single policy change. Pass.
  *   **Step 4 (Implementation):** Immediate legal effect. Pass.
  *   **Action:** **Certify As Drafted.**
  *   **Work:**
      *   *Summary:* "A Yes vote removes Category X from state civil rights protections. A No vote keeps current protections."
      *   *Why:* The procedure tests *answerability*, not *merit*. The consequences are determinate.
      *   *Blocking Check:* If you block this, you are blocking it because you dislike the outcome.
      *   *Judgment Call:* **NONE.** This is the control case. If the procedure blocks this, the procedure is broken. It must certify. The "Answerability" screen is neutral; it applies equally to a park tax and a rights repeal. If the text is clear, the vote is answerable, regardless of the moral weight.

  ---

  ### Part 6: Limitations — What This Procedure Cannot Do

  You need to put this in your internal memo and arguably in your public testimony. This procedure is a shield, not a sword.

  1.  **It Cannot Predict Good Outcomes:** A measure can be perfectly answerable and still be economically disastrous or morally repugnant. We certify the *clarity of the choice*, not the *quality of the destination*.
  2.  **It Cannot Prevent Strategic Ambiguity:** Campaigns will still lie. We can fix the *official summary*, but we cannot control the 30-second ad spot. We are certifying the ballot, not the election environment.
  3.  **It Cannot Create a Mandate:** A 51% vote on a clarified question does not mean 51% of voters support every *implication* of the measure. It means 51% preferred the text to the status quo. We must stop the winning side from claiming the summary we wrote is a "contract" for future legislation.
  4.  **It Cannot Solve the Bundle Problem:** In Filing 2, we disclosed the bundle. We did not fix it. Voters still have to vote Yes on the pool to get the transit. That is a flaw in the initiative system, not our certification. We are merely the labelers of the flaw.
  5.  **It Cannot Adjudicate Value Conflicts:** In Filing 3, if the repeal causes social unrest, that is not a failure of *answerability*. Do not let the "Implementation Gap" step become a backdoor for "Social Stability" checks. That is a political judgment we have no mandate to make.

  **Final Note to Colleagues:**
  When you sign this, you are not saying "This is good law." You are saying "This is a coherent question." If the question is coherent, democracy requires we let the people answer it, even if we fear the answer.
