answer: |-
  **The Case**

  In a high-volume urban ER, Resident Mara has worked under Dr. Vance for six months, logging his diagnostic and prescribing accuracy at 98% in her personal logbook, providing her with robust, inductively grounded positive reasons for trust. During a trauma intake, Vance verbally orders Mara to administer 5mg of Morphine to Patient X. Mara believes the order is medically safe and appropriate, which is true; Patient X requires the analgesic and has no actual contraindications. However, a printed lab result indicating elevated creatinine levels—which typically suggests renal failure and cautions against Morphine—is lying face-up on the counter directly beside the patient's chart. Mara does not look at the paper. Checking loose lab slips against an Attending's verbal order is explicitly discouraged by hospital protocol, which prioritizes rapid execution of senior directives in trauma scenarios, and no other Resident in her position would have checked it. Mara is thus professionally diligent and epistemically non-negligent by all contextual standards, yet a truth-relevant defeater remains physically available but unpossessed.

  ***

  **Show Your Work**

  **1. The Local Reductionist Verdict (Fricker-style)**
  A Fricker-style reductionist argues that testimonial justification requires the hearer to possess positive reasons for trust *and* satisfy a "no-defeater" condition. While Fricker emphasizes responsible monitoring rather than omniscience, a hardline reductionist interpretation of this case suggests Mara lacks justification. The reasoning is that positive reasons (the track record) must be weighed against the *total available evidence* in the environment, not just the evidence the agent happens to hold. Because the lab slip was physically accessible, the reductionist claims Mara's inductive basis was insufficiently robust to override the risk signaled by the environment. By granting justification here, the reductionist fears they are allowing luck to do the work of reliability. Consequently, they rule that the unpossessed defeater *does* wreck justification, implying that Mara's "non-negligence" was merely professional, not epistemic. To the reductionist, the epistemic duty to monitor for truth trumps the hospital's workflow norms; if the evidence is there, the responsible hearer ought to have possessed it.

  **2. The Global Anti-Reductionist Verdict (Burge/Coady-style)**
  A Burge-style anti-reductionist argues that testimony provides *a priori* justification by default, grounded in the rational presumption that speech is truthful. On this view, justification is only undermined by *possessed* defeaters (psychological) or perhaps normative defeaters that the agent *culpably* missed. Since Mara is stipulated to be non-culpable (she followed all relevant norms and had strong positive reasons), the unpossessed defeater is epistemically inert regarding her justification. Burge would argue that the rationality of accepting testimony is not contingent on scouring the environment for potential counter-evidence when social roles authorize trust. Therefore, Mara is justified. The anti-reductionist separates the *rationality of the acceptance* from the *reliability of the environment*; since Mara's rational faculties operated correctly in accepting a reliable source, the nearby paper does not retroactively strip her of justification.

  **3. The Key Feature**
  The single feature doing the work is the **normative gap between professional diligence and epistemic access**. The case hinges on the fact that Mara is permitted (even encouraged) by her social role to ignore the evidence that would defeat her belief. This forces the theories to decide whether epistemic norms are autonomous (demanding evidence-checking regardless of social cost) or embedded (allowing social roles to dictate epistemic duty). The reductionist treats the gap as irrelevant to epistemic duty (you must check); the anti-reductionist treats the gap as decisive (you are permitted to trust).

  **4. Counterfactuals**
  *   **Delete the Defeater:** If the lab slip is removed, both theories grant justification. The reductionist is satisfied because the total available evidence is now clean; the anti-reductionist is satisfied because there are no possessed defeaters. The divergence disappears.
  *   **Make the Belief False:** If the patient actually *had* renal failure and the Morphine was harmful, neither theory grants *knowledge* (due to the truth condition). However, regarding *justification*: The anti-reductionist would likely still grant justification (blameless false belief), whereas the reductionist would deny justification, arguing that the false outcome proves the positive reasons were insufficient given the available evidence (even if unpossessed).

  **5. The Reductionist Attack**
  A savvy reductionist would attack the case by denying the stipulation that Mara had "strong positive reasons." They would argue that a track record is only a strong positive reason if it is coupled with an environment that is sufficiently transparent. By claiming that "professional norms" do not absolve epistemic responsibility, they would insist that Mara *was* careless, epistemically speaking. They would argue that if a defeater is easily visible, the hearer's failure to possess it indicates a flaw in their monitoring mechanism, regardless of hospital policy. Essentially, they would deny that the defeater is truly "unpossessed" in the normative sense; they would claim Mara *should* have possessed it, making it a normative defeater. If I resist this by insisting hospital norms define "should," the reductionist will reply that epistemic norms are stricter than professional ones.

  **6. Honesty Clause**
  I am stipulating the Fricker-style verdict slightly. Fricker herself emphasizes *culpability* regarding defeaters. If Mara is truly non-culpable by epistemic standards (not just professional ones), a consistent Frickerian might actually concede justification, aligning with Burge. To make the reductionist verdict hold, I have to lean on a stricter reliabilist interpretation of reductionism (where the *existence* of the defeater undermines the reliability of the process) rather than a purely responsibility-based one. The divergence here relies on interpreting "no-defeater condition" as "no *available* defeaters" (Reductionist) versus "no *possessed* defeaters" (Anti-Reductionist), which is the precise fault line this case is designed to expose.
