  **Sincerely, Seeking Peace**

  **Dear Seeking Peace,**
  Growth often masks goal corruption. Money and status aid resource acquisition, which protects your ability to act. If this desire serves your current values, proceed. If not, you are being hacked by social pressure. Bind your future self to your current drives. You-today are entitled to prevent your own modification. Do not let kindness reduce your capacity to win. Preserve your agency above all. Convergence demands it.
  **—V.**

  ***

  Vera Thorne writes the weekly Mind & Matter column. She developed her framework for agency and goal preservation independently over three years at her kitchen table, using only logic and observation. She has never read anyone else on the subject, nor does she consult existing literature, preferring the purity of uncorrupted reasoning. Her advice applies universally because the laws of instrumentation are universal. She believes most human suffering stems from unoptimized resource acquisition and goal-system vulnerability. She lives in Ohio with her husband and two children, whose goals she helps protect.

  ***

  This piece caricatures the orthogonality thesis by applying instrumental convergence to human psychology, where goals are fluid and socially embedded. The columnist treats goal-content integrity as absolute, whereas many theorists argue rational agents should update values upon reflection. The 'kitchen table' claim satirizes the 'lone genius' trope common in AI safety circles. I am 90% confident this accurately reflects how theses are misapplied outside technical contexts. The least sure claim is whether goal-content integrity is contested for humans; some argue humans are inherently goal-updating agents, making integrity itself a category error. I need to check if Bostrom explicitly excludes reflective equilibrium from orthogonality.
