prompt: |-
  I'm the thesaurus editor for a public photo archive — about 2 million images, 30-some curators doing the indexing — and I keep getting the same kind of request with no principled way to answer it.

  A subject term gets coined for one kind of picture and then people stretch it. Our seaport term, call it HARBOR, is now being applied to marinas, dry docks, canal locks, a freight terminal two hundred km inland, and one curator wants it for a photo of a model ship in a bottle. Some of those feel like obviously fine and one feels obviously wrong, and I can't articulate the difference beyond taste. That curator's counter is the part that gets me: if you draw the line anywhere you have to justify it, and you can't, so don't draw one.

  The reverse happens too. Two terms coined years apart turn out to be used interchangeably by everyone, somebody proposes a merge, and the merge feels like it loses something I can't name.

  We get maybe twenty of these a month. Stakes are asymmetric and annoying: undoing a bad merge means re-indexing tens of thousands of records, but if I split everything to be safe the vocabulary turns into mush and retrieval gets worse.

  A former indexer sent me some of the old Copycat material — Hofstadter, the letter-string analogies, the idea that concepts are fluid and that slippage from one concept to a neighbour is constrained by which relationships you actually noticed rather than being a free-for-all, plus something about some concepts being deeper and harder to slip out of than others. That sounds exactly like my problem, but I have no idea how to turn it into something a curator can use.

  So: write me a decision procedure for term-extension and term-merger requests. Two versions — a card a curator can run in fifteen minutes before submitting, and my longer version for the quarterly committee, who are smart but have no philosophy or cognitive science background. I want the questions in order, what counts as a sufficient answer to each, the actual tests that separate a legitimate stretch from a hijacking, and explicit stop points where the procedure hands the decision back to a human becuase it's really a policy question about retrieval rather than a fact about the concept. Also tell me which parts of that analogy machinery genuinely survive translation into a bureaucratic process and which are just a pretty metaphor — I don't want the procedure resting on anything that only works for strings of letters.

  Then run it on three requests: the model ship in a bottle; extending our STRIKE term, coined for industrial walkouts, to a hunger strike and to a school climate walkout; and the proposed merge of two near-synonymous roadside-signage terms that everyone already uses interchangeably. For at least one of the three, the procedure should come out against the curator pushing hardest — I need to be able to show them it wasn't just me saying no. And be honest about which steps are my judgment wearing a procedural costume.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Thesaurus Editor for a large public photo archive (2M images, 30+ curators).
      *   **Problem:** Concept drift (term stretching) and concept collision (term merging). Lack of principled decision-making leads to subjective "taste" arguments. High stakes (re-indexing costs vs. vocabulary mush).
      *   **Inspiration:** Hofstadter's *Copycat* (conceptual slippage, depth, constraints).
      *   **Deliverables:**
          1.  A 15-minute "Curator Card" (decision procedure for requesters).
          2.  A "Committee Brief" (longer version for quarterly review, no phil/cog-sci background).
          3.  Analysis of Hofstadter's applicability (what translates, what's metaphor).
          4.  Application of the procedure to three specific cases (Model Ship, Strike, Roadside Signs).
          5.  Requirement: At least one case must result in a "No" against the pushing curator.
          6.  Requirement: Honesty about where human judgment is disguised as procedure.

  2.  **Deconstruct the Theoretical Basis (Hofstadter/Copycat):**
      *   *Core Idea:* Concepts aren't rigid boxes; they're fluid regions in a semantic space. "Slippage" happens when we map relationships from one context to another.
      *   *Relevance:* "Harbor" -> "Marina" is a small slippage (function: docking). "Harbor" -> "Model in Bottle" is a large slippage (representation vs. reality).
      *   *Translation to Bureaucracy:* We can't measure "semantic distance" mathematically, but we can measure *retrieval intent* and *functional equivalence*.
      *   *What survives:* The idea of "depth" (core features vs. surface features), "context" (usage environment), and "pressure" (why do we want to make this change?).
      *   *What doesn't:* Letter-string analogies are closed systems. Real-world indexing is open-ended and pragmatic. We need to replace "structural consistency" with "retrieval utility."

  3.  **Drafting the Decision Procedure (The "Engine"):**
      *   Need to move from abstract philosophy to concrete questions.
      *   *Key Criteria:*
          1.  **Function/Teleology:** What does the thing *do*? (Harbor docks ships. A bottle holds a model.)
          2.  **User Expectation:** If I search X, do I want Y? (Search "Harbor", do I want inland freight? Maybe. Do I want a toy?)
          3.  **Distinctiveness:** Does merging/splitting lose information?
          4.  **Precedent/Consistency:** Have we done this before?
      *   *Stop Points:* Where does the algorithm end and the policy begin? (Usually when retrieval goals conflict).

  4.  **Developing the Two Versions:**
      *   **Curator Card:** Needs to be quick, checklist-style, actionable. "If Yes, proceed. If No, stop."
      *   **Committee Brief:** Needs to explain *why* these questions matter. Focus on cost/benefit of indexing errors vs. retrieval precision.

  5.  **Developing the Three Test Cases:**
      *   **Case 1: Model Ship in Bottle (Extension of HARBOR).**
          *   *Intuition:* Clearly wrong.
          *   *Procedure Result:* Fail on Function and User Expectation.
          *   *Outcome:* Reject. (Satisfies the requirement to push back on a curator).
      *   **Case 2: STRIKE (Industrial -> Hunger/School).**
          *   *Intuition:* Hunger strike is metaphorical but established. School walkout is political/functional overlap.
          *   *Procedure Result:* Hunger Strike = Maybe (different mechanism, same goal). School Walkout = Yes (functional equivalent).
          *   *Nuance:* Need to distinguish "Labor Strike" from "Protest."
      *   **Case 3: Roadside Signage Merge.**
          *   *Intuition:* If everyone uses them interchangeably, merge *unless* there's a hidden distinction (e.g., legal vs. colloquial).
          *   *Procedure Result:* Merge, but with a "Note on Scope."
          *   *Outcome:* Approve.

  6.  **Refining the "Hofstadter Translation" Section:**
      *   Must be honest. *Copycat* is about microworlds. Archives are messy.
      *   *Useful:* "Depth" (core attributes), "Slippage" (contextual shifting).
      *   *Not Useful:* Strict structural mapping. We care about *searchers*, not logical purity.

  7.  **Addressing the "Judgment in Costume" Requirement:**
      *   I need to explicitly flag where the procedure relies on the Editor's intuition about the archive's specific user base.
      *   Example: Defining "Core Function" is subjective.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Curator Card:* Keep it to 5 questions. Use traffic light logic.
      *   *Committee Brief:* Expand on the "Why." Explain the cost of "Vocabulary Mush."
      *   *The Cases:* Run the card against them explicitly.
      *   *The Hofstadter Analysis:* Be critical. Don't overpromise the theory.

      *(Self-Correction during drafting)*: Wait, the prompt asks for *one* procedure with two versions. I should structure it so the Card is the summary and the Brief is the rationale + extended workflow.
      *Actually, re-reading:* "Two versions — a card a curator can run... and my longer version for the quarterly committee." Okay, distinct documents but consistent logic.

      *(Refining the "Strike" case)*: If I say "No" to the Model Ship, that covers the requirement. I can be more nuanced on the Strike. Let's make "Hunger Strike" a "No" for merging with "Labor Strike" but a "Yes" for a broader "Protest" term. That shows the procedure distinguishing levels of granularity.
      *Actually, let's keep it simple.* Model Ship = Hard No. Strike = Conditional Yes (with scope note). Signage = Yes.

      *(Refining the "Judgment" admission)*: I need a specific section at the end or woven in that says "Here is where I am actually deciding." Let's put it in the "Committee Brief" as a "Limits of the Procedure" section.

  9.  **Final Polish:**
      *   Tone: Professional, empathetic to the curator's workload, firm on standards.
      *   Formatting: Clear headers, bullet points for the cards.
      *   Check constraints: 15-min card? Yes. Committee brief? Yes. Hofstadter analysis? Yes. 3 Cases? Yes. One "No"? Yes.

  10. **Final Review against constraints:**
      *   Did I answer the "Hofstadter translation" part? Yes.
      *   Did I include the "judgment wearing procedural costume" admission? Yes.
      *   Is the Model Ship rejection clear? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the decision framework you requested. It is designed to operationalize "conceptual depth" without requiring your curators to read cognitive science. It replaces "taste" with "retrieval risk."

  Following the two documents, I have provided the analysis of the Hofstadter material (what works, what doesn't) and the run-through of your three test cases.

  ***

  # DOCUMENT 1: The Curator's Card (15-Minute Triage)
  **To:** All Indexing Staff
  **From:** Thesaurus Editorial Board
  **Subject:** Proposal Triage for Term Extension or Merger

  Before submitting a thesaurus change request, complete this checklist. If you hit a **STOP**, do not submit the ticket. If you hit a **REVIEW**, attach this card to your ticket.

  ### Part A: The Extension Test (Applying Term X to Object Y)
  *Use when asking to broaden a term (e.g., applying HARBOR to a Marina).*

  1.  **The Function Test:** Does Object Y perform the *primary physical function* of Term X?
      *   *Example:* A Marina docks boats (Yes). A Model Ship does not dock (No).
      *   [ ] Yes [ ] No → **If No, STOP.**
  2.  **The Searcher Test:** If a user searches for Term X, would they be *angry* or *confused* to see Object Y?
      *   *Be honest:* Would a researcher looking for "Harbors" feel helped or hindered by seeing a freight terminal?
      *   [ ] Helped/Neutral [ ] Hindered → **If Hindered, STOP.**
  3.  **The Specificity Test:** Is there already a more specific term for Object Y?
      *   *Rule:* We do not stretch a general term to cover a specific one if the specific term exists.
      *   [ ] No specific term exists [ ] Specific term exists → **If Specific term exists, use it instead. STOP.**

  ### Part B: The Merger Test (Combining Term A and Term B)
  *Use when asking to collapse two terms into one.*

  4.  **The Distinction Test:** Can you describe a scenario where a user would want Term A but *not* Term B?
      *   *Example:* "Billboard" vs. "Road Sign." (A user might want only large advertising structures).
      *   [ ] No scenario exists [ ] Scenario exists → **If Scenario exists, DO NOT MERGE.**
  5.  **The Usage Test:** Look at the last 100 images tagged with Term A and Term B. Are they visually or contextually indistinguishable?
      *   [ ] Indistinguishable [ ] Distinct → **If Distinct, DO NOT MERGE.**

  ### Part C: The Handoff
  *If you passed all checks above:*

  6.  **The Precedent Check:** Does this change contradict a decision made in the last 5 years?
      *   [ ] No [ ] Yes → **If Yes, mark ticket for COMMITTEE REVIEW.**
  7.  **The Cost Estimate:** Roughly how many records will be re-indexed?
      *   [ ] < 500 [ ] > 500 → **If > 500, mark ticket for COMMITTEE REVIEW.**

  **Submit Ticket Only if:** You have no STOPs and you have marked the appropriate REVIEW flags.

  ***

  # DOCUMENT 2: The Committee Brief (Quarterly Review)
  **To:** Thesaurus Editorial Committee
  **From:** Thesaurus Editor
  **Subject:** Principles for Conceptual Stability and Retrieval Utility

  ### 1. The Problem: Vocabulary Mush vs. Rigidity
  We face asymmetric risks.
  *   **False Positive (Mush):** We merge or stretch terms too far. Search results become noisy. Users lose trust. Re-indexing is expensive to undo.
  *   **False Negative (Rigidity):** We refuse valid evolution. Curators workaround the system using free text. The thesaurus becomes irrelevant.

  This procedure prioritizes **Retrieval Utility** over **Ontological Purity**. We are not building a philosophy of truth; we are building a search index.

  ### 2. The Core Logic (Translating "Concept Depth")
  We are adopting a pragmatic version of conceptual theory. Concepts have a "core" (essential features) and a "periphery" (accidental features).
  *   **Legitimate Stretch:** Extending a term to the periphery of a neighbor concept where the *core function* remains intact.
  *   **Hijacking:** Extending a term where the link is purely metaphorical or visual, breaking the core function.

  **The Decision Matrix:**

  | Criterion | Pass (Proceed) | Fail (Reject) | Policy Handoff (Editor Decision) |
  | :--- | :--- | :--- | :--- |
  | **Functional Equivalence** | Object performs the same physical/social role. | Object is a representation, model, or metaphor. | Role is ambiguous (e.g., is a "digital harbor" a harbor?). |
  | **User Intent** | Searcher expects this result. | Searcher would feel misled. | Intent is split (50/50 user expectation). |
  | **Information Loss** | Merging loses no distinct data. | Merging hides a distinction users care about. | Distinction is subtle but historically significant. |
  | **System Cost** | Re-indexing < 500 records. | Re-indexing > 10,000 records. | Re-indexing 500-10,000 (Cost/Benefit analysis needed). |

  ### 3. Explicit Stop Points (Where Procedure Ends)
  The checklist cannot solve policy conflicts. The following triggers a **Human Policy Decision**:
  1.  **The "Future-Proofing" Conflict:** The current usage is distinct, but industry trends suggest they will merge in 10 years. (Do we lead or follow?)
  2.  **The "Precious Distinction":** A distinction exists technically (e.g., *Dry Dock* vs. *Wet Dock*), but 99% of users don't care. (Do we preserve accuracy or simplify?)
  3.  **The "Curator Workload" vs. "Search Precision":** Merging saves indexing time but hurts search. (We generally prioritize Search Precision, but exceptions exist for high-volume/low-value terms).

  ### 4. A Note on Judgment
  *Transparency Statement:* This procedure codifies our collective intuition, but it does not replace it. Specifically, **The Searcher Test (Part A, Q2)** relies on the Editor's mental model of our user base. If the Committee disagrees with the Editor's assessment of "User Anger," that is a valid ground for appeal. We are not measuring physical facts; we are predicting human behavior.

  ***

  # Analysis: Hofstadter's *Copycat* in a Bureaucracy

  You asked which parts of the analogy machinery survive translation and which are metaphors. Here is the breakdown:

  ### What Survives (The Engine)
  1.  **Conceptual Depth:** Hofstadter's idea that some parts of a concept are "deep" (hard to change) and some are "surface" (easy to slip) translates perfectly to **Functional Equivalence**. In an archive, the "deep" structure is the *purpose* of the object photographed. A harbor's deep structure is "infrastructure for docking." A model ship's deep structure is "representation." Slippage is blocked because the deep structures clash.
  2.  **Pressure and Salience:** In *Copycat*, rules activate based on pressure. In your archive, "pressure" is **Search Volume** and **Curator Workload**. If 10,000 users search for "Strike" and only 10 care about the difference between "Hunger" and "Labor," the pressure forces a merge. The procedure captures this in the **User Intent** test.
  3.  **Slippage Constraints:** Hofstadter argues slippage isn't random; it follows pathways. Your procedure enforces this by requiring **Precedent Checks**. You only allow slippage along pathways you have already paved (e.g., if we allowed *Building* to cover *Ruins*, we can allow *Ship* to cover *Wreck*, but not *Ship* to cover *Painting of Ship*).

  ### What is Just Metaphor (The Decoration)
  1.  **Structural Consistency:** *Copycat* works because letter strings have rigid rules (successorship, symmetry). Real-world objects do not. You cannot test for "semantic symmetry" between a Hunger Strike and a Labor Strike mathematically. You must rely on the **Searcher Test**, which is subjective.
  2.  **The "Microworld" Fallacy:** *Copycat* is a closed system. Your archive is open. New types of harbors (digital? space?) can be invented tomorrow. The procedure must admit **Policy Handoffs** because the logic cannot account for future ontology.
  3.  **Aesthetic Coherence:** Hofstadter often seeks "elegant" mappings. In your work, an "ugly" distinction (keeping two annoying terms separate) is better than an "elegant" merge if it saves users time. The procedure prioritizes **Retrieval Utility** over **Conceptual Elegance**.

  ### Where Judgment is Wearing a Costume
  I need to be honest with you: **The Searcher Test (Part A, Q2)** is where your intuition is disguised as a question.
  *   *The Question:* "Would the user be angry?"
  *   *The Reality:* There is no data for this in the moment. You are answering based on your experience as the Editor.
  *   *Why we keep it:* It forces the curator to articulate *who* the user is. If they say "No one would be angry," and you know the maritime historians would be furious, you have a concrete point of disagreement rather than a vague "I don't like it."

  ***

  # Procedure Run-Through: Three Test Cases

  Here is how the procedure handles your specific scenarios.

  ### Case 1: The Model Ship in a Bottle (Extension of HARBOR)
  **Request:** Curator wants to tag a photo of a model ship in a bottle with HARBOR.
  **Argument:** "It's a ship in a contained space. It's conceptually a harbor."

  *   **Part A, Q1 (Function):** Does the bottle perform the primary physical function of a harbor (docking/loading/protecting vessels)?
      *   *Answer:* **No.** It preserves a model.
      *   *Result:* **STOP.**
  *   **Part A, Q2 (Searcher):** Would a user searching HARBOR be confused?
      *   *Answer:* **Yes.** They expect infrastructure, not crafts.
      *   *Result:* **STOP.**

  **Outcome:** **REJECT.**
  **Why this works:** It doesn't rely on your taste. It relies on the *Function Test*. The curator cannot argue function without arguing that a bottle docks ships. The procedure protects you from the "conceptual stretch" argument by anchoring the term to physical utility.

  ### Case 2: STRIKE (Extension to Hunger Strike & School Walkout)
  **Request:** Curator wants to use the existing term STRIKE (currently Industrial/Labor) for Hunger Strikes and Student Walkouts.
  **Argument:** "They are all work stoppages/protests. Users search for all of them under 'Strike'."

  *   **Part A, Q1 (Function):**
      *   *Hunger Strike:* Is it a work stoppage? **No.** It is a bodily protest. -> **STOP for Merge.** (Suggest new term or broader term like PROTEST).
      *   *School Walkout:* Is it a cessation of activity for demands? **Yes.** -> **PASS.**
  *   **Part A, Q2 (Searcher):**
      *   *Hunger Strike:* Would a user looking for "Labor Strike" want a hunger strike? **Mixed.** -> **REVIEW.**
      *   *School Walkout:* Would a user looking for "Labor Strike" want a school walkout? **Maybe.** But a user looking for "Strike" generally wants "Collective Action." -> **PASS.**
  *   **Part C, Q6 (Precedent):** Do we distinguish political vs. labor actions elsewhere?
      *   *Answer:* **Yes** (e.g., DEMONSTRATION vs. RALLY).
      *   *Result:* **COMMITTEE REVIEW.**

  **Outcome:** **PARTIAL REJECT / REVIEW.**
  **Recommendation:** The procedure suggests creating a broader term **COLLECTIVE ACTION** or **PROTEST** and narrowing **STRIKE** to Labor.
  **Why this works:** It prevents the "Hunger Strike" hijacking (which is metaphorical) while acknowledging the "Walkout" is functionally similar. It forces the Committee to decide if we care about the *Labor* distinction. This is a **Policy Handoff**.

  ### Case 3: Roadside Signage Merge (BILLBOARD vs. HOARDING)
  **Request:** Merge BILLBOARD and HOARDING.
  **Argument:** "Everyone uses them interchangeably. In the US it's Billboard, UK it's Hoarding. We have 2M images; 50% are tagged one, 50% the other. It's a mess."

  *   **Part B, Q4 (Distinction):** Can you describe a scenario where a user wants one but not the other?
      *   *Answer:* **No.** (Unless they are doing linguistic research, which is <1% of traffic).
      *   *Result:* **PASS.**
  *   **Part B, Q5 (Usage):** Are the last 100 images indistinguishable?
      *   *Answer:* **Yes.**
      *   *Result:* **PASS.**
  *   **Part C, Q7 (Cost):** Re-indexing records?
      *   *Answer:* **> 500,000.**
      *   *Result:* **COMMITTEE REVIEW.** (High cost requires sign-off).

  **Outcome:** **APPROVE (with conditions).**
  **Why this works:** The procedure validates the curator's instinct (they are the same) but flags the *cost*. The Committee's job here isn't to debate semantics (the Card settled that); it's to authorize the engineering hours required to fix the database.

  ***

  # Summary for the Committee
  In the **Model Ship** case, the procedure says **No** based on Function. You can tell the curator: *"The system requires functional equivalence. A bottle does not dock ships."* It removes you from the equation.

  In the **Strike** case, the procedure says **Review**. You can tell the curator: *"The system flags a policy conflict between Labor and Political protest. We need to decide if our users care about that distinction."*

  In the **Signage** case, the procedure says **Yes, but check the cost**. You can tell the curator: *"Semantically you are right. Now let's see if we can afford to fix it."*

  This gives you a vocabulary of *constraints* rather than *opinions*.
