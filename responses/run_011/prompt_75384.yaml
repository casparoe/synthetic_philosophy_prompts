answer: |-
  ### The Decision: Defining "Aspiration"

  Choose this definition: **The most a side could extract from the joint arrangement if it went entirely their way.**

  Do *not* use "the most they could manage without the other person." That is your **Walkaway Point** (Disagreement Point). If you make Aspiration and Walkaway the same thing, the line between them has zero length. The math collapses, and you are left with no leverage to move them from their threats.

  **What turns on this choice:**
  By defining Aspiration as "100% of the joint pot," you acknowledge that both parties *could* theoretically claim everything, but neither *should*. This creates the "cone of agreement." If you use "solo capability" as the aspiration, you punish the partner with fewer external options (the sister in the catering case). The Kalai–Smorodinsky (KS) solution is designed to equalize *concessions from hope*, not to ratify *power disparities from threat*. Using the "Joint Max" keeps the focus on dividing the surplus created by their past cooperation, rather than penalizing the weaker party for their future vulnerability.

  ---

  ### The Procedure: The "Equal Concession" Protocol

  This is a 3-hour script. Do not deviate from the order. You are the calculator; they are the inputs.

  #### Phase 1: The Numbers (45 Minutes)
  *Goal: Establish $d$ (Walkaway), $u$ (Aspiration), and $V$ (Total Value).*

  **1. The Walkaway ($d$)**
  *   **Ask:** "If you leave this room and never speak again, what is the cold, hard cash value of what you walk out with? Include legal fees, sale costs, and taxes. Be pessimistic."
  *   **Settled Answer:** A single dollar figure per person. If they hedge ("It depends"), you assign the number. Tell them: *"I need a number to run the math. If you disagree, I will use the lower estimate to ensure safety."*
  *   **Mediator Note:** Sum these two numbers. This is $W$ (Total Walkaway).

  **2. The Total Pot ($V$)**
  *   **Ask:** "If you agree today, what is the total value of the business/assets as a going concern? Not what you get, but what exists to be split."
  *   **Settled Answer:** A single dollar figure.
  *   **Mediator Note:** If they disagree, take the average. This is $V$.

  **3. The Aspiration ($u$)**
  *   **Ask:** "In a perfect world where you got everything you could possibly claim from this business without the other person suing you, what is that dollar value?"
  *   **Settled Answer:** Usually, this is the same as The Total Pot ($V$). If they say "I want $1M" but the business is worth $400k, correct them. *"We are splitting the business, not a lottery ticket. Your aspiration is 100% of the business value."*
  *   **Mediator Note:** Sum these two numbers. This is $A$ (Total Aspiration). Usually $A = 2 \times V$.

  #### Phase 2: The Non-Monetary Items (45 Minutes)
  *Goal: Convert "The Name" or "The Apprentice" into cash equivalents.*

  Do not let them keep items *and* split cash separately. Everything must flow into the cash pot.

  **The "Take-or-Pay" Test:**
  For each non-cash item (Name, Tools, Client List):
  1.  **Ask:** "Who wants this?"
  2.  **If both want it:** "Write down the dollar value you are willing to credit to the *other* person to keep it." Reveal bids. Higher bidder keeps it, credits the bid amount to the pot.
  3.  **If only one wants it:** "What cash credit will you give the pot for taking this?" If the other party objects, they have the right to take the item *at that price* instead.
  4.  **If neither wants it:** It is discarded or sold; proceeds go to the pot.

  **Settled Answer:** Every item is now a dollar value added to the Total Pot ($V$) and assigned to a specific owner. Adjust $V$ if necessary to reflect these internal transfers.

  #### Phase 3: The Calculation (15 Minutes)
  *Goal: Determine the Split.*

  You do this on a notepad in front of them.

  1.  **Calculate the Surplus:** $S = V - W$ (Total Value minus Total Walkaway).
  2.  **Calculate the Range:** $R = A - W$ (Total Aspiration minus Total Walkaway).
  3.  **Calculate the Concession Ratio ($\lambda$):**
      $$ \lambda = \frac{S}{R} $$
      *(Note: If both aspire to 100% of the pot, $A = 2V$. So $\lambda = \frac{V - W}{2V - W}$. This will always be roughly 0.5, but slightly adjusted for the size of the walkaway.)*
  4.  **Calculate Individual Settlement:**
      $$ \text{Settlement}_i = d_i + \lambda \times (u_i - d_i) $$
      *(Translation: You get your Walkaway, plus your share of the Concession Ratio applied to your personal range.)*

  **Stop Point:** If the math results in a cash transfer one party literally cannot fund (e.g., Brother owes Sister $200k but has no liquidity), stop. The math is done; the financing is now a separate problem. Do not fudge the numbers to make payment easier.

  #### Phase 4: The Reality Check (45 Minutes)
  *Goal: Verify feasibility.*

  *   **Ask:** "The math says Person A pays Person B $X. Person A, can you write this check within 90 days?"
  *   **If Yes:** Draft the memo.
  *   **If No:** The deal fails. Do not renegotiate the split. Discuss selling the assets to a third party to generate the cash.
  *   **Values vs. Arithmetic:** If a party says, "The math is right, but it feels wrong because I built this," stop. That is a value judgment. Tell them: *"The procedure measures claims, not effort. If you want to adjust for effort, you must both agree to a 'gift' from your share. I will not calculate that."*

  ---

  ### Case Study 1: The Catering Business
  **Inputs:**
  *   **Total Value ($V$):** $400,000 (Going concern).
  *   **Walkaway ($W$):** $120,000 (Liquidation net). Let's assume symmetric threat: $60,000 each ($d_{bro} = 60k, d_{sis} = 60k$).
  *   **Aspiration ($u$):** Both claim 100% of $V$. ($u_{bro} = 400k, u_{sis} = 400k$).
  *   **Total Aspiration ($A$):** $800,000.

  **The Math:**
  1.  **Surplus ($S$):** $400k - 120k = 280k$.
  2.  **Range ($R$):** $800k - 120k = 680k$.
  3.  **Ratio ($\lambda$):** $280 / 680 \approx 0.41$.
  4.  **Settlement:**
      *   **Brother:** $60k + 0.41 \times (400k - 60k) = 60k + 139.4k = \mathbf{\$199,400}$.
      *   **Sister:** $60k + 0.41 \times (400k - 60k) = 60k + 139.4k = \mathbf{\$199,400}$.

  **The Allocation:**
  To equalize, one keeps the business, one takes cash.
  *   **Brother** keeps the business (Value $400k). He owes Sister **$199,400**.
  *   **Sister** walks with **$199,400** cash.

  **The Hard Truth:**
  You will find this result difficult. The Sister has no trade and earns $30k/year elsewhere. The Brother earns $150k/year running the shop.
  The procedure treats them as equal claimants to the *asset*, ignoring their *human capital*. The Sister receives a payout equivalent to nearly 7 years of her alternative income. The Brother retains the asset but takes on $200k debt, crippling his cash flow just as he needs to run the operation alone.
  The KS solution protects the Sister from being bullied down to her weak BATNA ($30k/yr), which is morally correct, but it ignores economic reality: she is being bought out at a price the business may not support given the Brother's reduced liquidity. The math is fair to the *partnership*, but potentially fatal to the *surviving business*.

  ---

  ### Case Study 2: The Furniture Workshop
  **Inputs:**
  *   **Total Value ($V$):** Illiquid. We must value the parts.
  *   **Items:** Name (Partner A wants), Shop/Tools/Apprentice (Partner B wants).
  *   **Walkaway ($W$):** $0. (If they fight, the shop closes, tools are scrapped, name dies).
  *   **Aspiration ($u$):** Both want everything.

  **Valuation (Take-or-Pay):**
  *   **Name:** Partner A values it at $50,000. Partner B values it at $5,000. **A keeps Name.** Pot credits $50,000.
  *   **Shop/Tools:** Partner B values at $150,000. Partner A values at $20,000. **B keeps Shop.** Pot credits $150,000.
  *   **Total Pot ($V$):** $200,000 (in internal credits).
  *   **Walkaway ($W$):** $0.
  *   **Aspiration ($A$):** $400,000 ($200k each).

  **The Math:**
  1.  **Surplus:** $200k.
  2.  **Range:** $400k.
  3.  **Ratio ($\lambda$):** 0.5.
  4.  **Settlement:** Each is entitled to $100,000 value.

  **The Allocation:**
  *   **Partner A:** Has Name ($50k value). Needs $50k more cash.
  *   **Partner B:** Has Shop ($150k value). Has $50k excess.
  *   **Result:** **Partner B pays Partner A $50,000.**

  **The Hard Truth:**
  Partner B now owns the tools and the apprentice, but has paid $50k cash for the privilege. Partner A owns a "Name" with no workshop.
  The procedure validates Partner A's subjective valuation of the Name ($50k). If that Name is actually worthless without the Shop (which it likely is), Partner B has just overpaid for "air" to satisfy the arithmetic. The KS solution forces a cash transfer based on *claimed* value, not *market* value. Partner B may end up bankrupting the viable workshop to pay Partner A for a brand that cannot stand alone. The math ensures equal concession, not economic viability.

  ---

  ### Limitations: Where the Procedure Misfires

  **1. The Liquidity Illusion**
  The procedure calculates *entitlements*, not *affordability*. It assumes the party keeping the assets can write a check for the equalization payment.
  *   **The Misfire:** In the Catering case, the Brother may be asset-rich but cash-poor. The math says he owes $200k. He has $5k in the bank.
  *   **The Fix:** When the "Reality Check" fails, do not adjust the split. Switch to "Seller Financing." The Brother pays the Sister over 5 years from profits. If he refuses, the assets must be sold to a third party. Do not let liquidity distort the equity.

  **2. Subjective Valuation Gaming**
  In the Workshop case, Partner A knew that claiming a high value on the Name would force a cash payout from B.
  *   **The Misfire:** The "Take-or-Pay" test relies on honesty. If A claims $500k for the Name, B cannot afford to take it, so A keeps it and B owes a massive debt.
  *   **The Fix:** Cap non-monetary valuations at *replacement cost* or *verified market comparables*. If there is no market for "The Name," its value is $0 for the purpose of the split, regardless of sentiment. You must intervene here as the expert.

  **3. The "Effort" Blindspot**
  KS divides the surplus of the *entity*, not the reward for *labor*.
  *   **The Misfire:** If one partner worked 80 hours/week and the other 20, but they are 50/50 owners, KS splits the surplus 50/50 (adjusted only by walkaway). The hard worker will feel cheated.
  *   **The Fix:** This is a value judgment, not arithmetic. Before running the numbers, ask: *"Is there an agreed-upon cash adjustment for past labor disparities?"* If they agree, add that to the Walkaway ($d$) of the hard worker *before* running the KS formula. If they don't agree, the procedure ignores it. Do not let "fairness" regarding effort contaminate the "fairness" regarding asset division.

  **4. The Zero-Sum Trap**
  If $V$ (Amicable Value) is less than $W$ (Walkaway Sum)—rare, but possible if litigation costs are low and asset value is depressed—the Ratio $\lambda$ becomes negative.
  *   **The Misfire:** The math tells them to destroy value.
  *   **The Fix:** Stop immediately. If $V < W$, the rational choice is to walk away and litigate/sell. Your job is done. Tell them: *"The math says cooperation costs you money. Go to court."*

  ### Final Instruction
  When you sit down, tell them: *"I am not here to judge who worked harder or who is more hurt. I am here to ensure you both give up the same percentage of your dreams. If you want mercy, ask each other. If you want math, I have the pen."*
