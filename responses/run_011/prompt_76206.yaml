answer: |-
  Here is a critical assessment of your draft, a pruned and corrected list of requirements, an analysis of the incompatibilities, and the requested scorecard.

  ### Part 1: Critique and Pruning of Your Draft

  You are correct to be suspicious of several entries. Here is the diagnosis of the problematic requirements:

  *   **Requirement 9 (No brute accuracy) is a category error.** You flagged a tension with 1 (Veritism), but it is stronger than that: it is incoherent. If accuracy is the *fundamental* epistemic value (Req 1), it cannot be explained by something more fundamental without ceasing to be fundamental. If you explain it via practical success, you violate Req 2. If you explain it via "truth-conduciveness," you are circular.
      *   *Verdict:* **Drop.** Replace with a constraint that the link between accuracy and rationality must not be *arbitrary* (e.g., it must align with pre-theoretic epistemic intuitions), but do not demand an external justification for the value of truth itself.
  *   **Requirement 4 (Unique measure) is a smuggled commitment.** This privileges the Pettigrew camp (who argue for a unique measure via specific axioms) over the Joyce/Levinstein camp (who argue for a *class* of legitimate measures). Demanding uniqueness will rule out the majority of accuracy-first literature immediately.
      *   *Verdict:* **Downgrade to "Measure Robustness."** The framework should show that the norms hold for *any* legitimate measure satisfying basic constraints (continuity, strict propriety), not that there is only one measure.
  *   **Requirement 2 (Non-pragmatism) needs precision.** You are right that dominance reasoning is decision-theoretic machinery. The distinction is not the *structure* of the argument (which is pragmatic) but the *currency* (accuracy vs. money).
      *   *Verdict:* **Refine to "Epistemic Currency."** The framework must not appeal to the agent's practical desires, but it *may* use decision-theoretic tools provided the utility function is purely epistemic.
  *   **Requirement 12 (Representational Neutrality) is likely unsatisfiable.** You suspected a collision with 4. It is worse: it collides with the mathematics of scoring rules. Scoring rules are defined over algebras. Refining an algebra (splitting cells) changes the number of credences to be scored. There is no known proper scoring rule that yields invariant verdicts across different algebraic granularities.
      *   *Verdict:* **Drop or mark as a known failure point.** If you keep it, you rule out all standard scoring-rule frameworks.
  *   **Requirement 8 (Feasibility) is the "Logical Omniscience" trap.** Standard accuracy arguments (Joyce 1998) prove probabilism by assuming the agent has credences over a full algebra of propositions, including logical truths. This requires logical omniscience. If you demand Feasibility (no credence 1 in all logical truths), you break the standard dominance proofs.
      *   *Verdict:* **Keep, but mark as Non-Negotiable for your specific purpose.** Since you want to replace Dutch-book arguments (which also assume omniscience), you must decide if you are building an *ideal* theory or a *non-ideal* one. For a dissertation aiming to improve on the status quo, keeping this exposes a major weakness in the field.

  ### Part 2: The Revised Requirements

  Here is the pruned list. I have consolidated overlapping items and clarified the demands.

  1.  **Epistemic Fundamentality (Non-Negotiable).** Accuracy (closeness to truth) must be the sole fundamental epistemic good. No other epistemic norm (e.g., coherence, evidence-responsiveness) can be primitive; all must be derived from accuracy.
      *   *Motivation:* Defines the "accuracy-first" project.
      *   *Failure Condition:* The framework appeals to coherence or evidence as a *sui generis* constraint on rationality rather than deriving them from accuracy.
  2.  **Epistemic Currency (Non-Negotiable).** The justification for norms must not depend on the agent's practical interests, stakes, or non-epistemic goals. Decision-theoretic tools are permitted only if the "utility" function is defined purely in terms of epistemic value (accuracy).
      *   *Motivation:* Distinguishes epistemic rationality from prudential rationality (Req 2 refined).
      *   *Failure Condition:* The argument relies on the agent wanting to win bets, avoid prison, or achieve practical success.
  3.  **Dominance Vindication (Non-Negotiable).** For any incoherent credal state, there must exist a coherent alternative that is strictly more accurate at every possible world. Incoherence must be shown to be a defect *even if* the agent is uncertain about which world is actual.
      *   *Motivation:* Replaces Dutch-book arguments (Req 3).
      *   *Failure Condition:* The framework shows incoherence is suboptimal only *in expectation* (which relies on the agent's current, possibly incoherent, probabilities) rather than state-by-state.
  4.  **Measure Robustness (Negotiable).** The derived norms (e.g., Probabilism) must hold for any inaccuracy measure satisfying minimal structural constraints (e.g., continuity, strict propriety), not just one privileged measure.
      *   *Motivation:* Avoids the arbitrariness of picking one scoring rule (Req 4 corrected).
      *   *Cost of Dropping:* If you demand a *Unique Measure* instead, you gain precision but lose generality and invite controversy about the axioms used to select the measure.
  5.  **Extension Stability (Non-Negotiable).** Extending the framework to full belief, imprecise credence, or self-locating belief must not overturn the norms delivered for standard credences. If the extension forces a verdict that contradicts the base case (e.g., probabilism in the base case, but non-probabilistic norms for imprecise credence), the framework fails.
      *   *Motivation:* Ensures the theory is unified (Req 11).
      *   *Failure Condition:* A threshold rule for full belief validates a belief that corresponds to a credence the framework deemed irrational.
  6.  **Logical Idealization (Negotiable).** The framework must state clearly whether it assumes logical omniscience. If it does not, it must provide a dominance argument that works for logically non-omniscient agents.
      *   *Motivation:* Addresses Feasibility (Req 8).
      *   *Cost of Dropping:* If you insist on Feasibility (no omniscience), you will likely rule out all existing dominance-based frameworks, as they rely on partitioning logical space exhaustively.

  ### Part 3: Incompatibility Results (The "Impossible Trinities")

  You asked for subsets of requirements that cannot be jointly satisfied. There are three major conflicts you must navigate.

  **Conflict A: The Language Dependence Trilemma**
  *   **The Subset:** Measure Robustness (4) + Representational Neutrality (Your Draft 12) + Standard Scoring Rules (implied by 3).
  *   **The Conflict:** Scoring rules measure distance between a credence function and a world. Worlds are modeled as valuations on an algebra of propositions. If Agent A uses a coarse algebra and Agent B uses a fine algebra (splitting a cell), the "distance" to the truth changes mathematically. There is no proper scoring rule that is invariant under algebraic refinement.
  *   **Resolution:** You must drop **Representational Neutrality**. No current accuracy framework satisfies it. Acknowledge this as a limitation of the formalism, not necessarily the philosophy.

  **Conflict B: The Omniscience Trap**
  *   **The Subset:** Dominance Vindication (3) + Logical Idealization/Feasibility (6).
  *   **The Conflict:** Standard dominance proofs (Joyce 1998) work by constructing a coherent alternative that beats the incoherent one at *every world*. This requires the set of "worlds" to be exhaustive and mutually exclusive relative to the algebra. If the agent is not logically omniscient, she cannot assign credences to all logical truths, and the mathematical construction of the dominating function fails (or requires a notion of "impossible worlds" which complicates the truth-value assignment).
  *   **Resolution:** Most frameworks drop **Feasibility**. They accept logical omniscience as an idealization. If you keep Feasibility as Non-Negotiable, you will rule out the Dominance approach entirely unless you adopt a specific non-ideal theory (e.g., Easwaran's or Jern's work), which is less developed.

  **Conflict C: The Foundational Circle**
  *   **The Subset:** Epistemic Fundamentality (1) + No Brute Accuracy (Your Draft 9).
  *   **The Conflict:** As noted in the critique, if accuracy is fundamental, it cannot be explained by something else without losing its fundamentality.
  *   **Resolution:** Drop **No Brute Accuracy**. Accept that accuracy is a primitive normative notion, justified only by its fit with epistemic intuitions (e.g., "it is better to believe what is true").

  ### Part 4: The Most Exclusionary Requirement

  **Measure Robustness (4)** does the most work in excluding candidates.

  *   **Why:** Many proposals derive Probabilism successfully but only for specific measures (e.g., the Brier score). Others derive it for a class of measures but rely on controversial axioms (e.g., differentiability, symmetry). If you demand that the result hold for *any* legitimate measure (Measure Robustness), you exclude frameworks that rely on specific properties of the Brier score to prove extension results (like full belief norms).
  *   **Second Place:** **Logical Idealization (6)**. If you insist on Feasibility (no omniscience), you exclude almost the entire existing literature (Joyce, Pettigrew, Leitgeb), as they all assume the agent is capable of probabilistic coherence over a full algebra.

  ### Part 5: Scorecard of Main Approaches

  Here is how the three main strategies fare against the **Revised List** (Fundamentality, Currency, Dominance, Robustness, Stability, Idealization).

  **1. The Dominance Approach (e.g., Joyce 1998, 2009)**
  *   **Performance:** Passes Fundamentality, Currency, and Dominance Vindication.
  *   **Failures:** Fails **Logical Idealization** (assumes omniscience). Struggles with **Extension Stability** (moving from credence to full belief often requires adding non-accuracy norms like a Lockean threshold, which violates pure Veritism).
  *   **Verdict:** The strongest candidate for your goal (i), but fails your goal (ii) regarding non-ideal agents.
  *   **Negotiable Failure:** If you drop Feasibility (allow omniscience), this approach passes most tests.

  **2. The Expected Accuracy Approach (e.g., Leitgeb, Pettigrew 2016)**
  *   **Performance:** Passes Fundamentality and Currency. Good at **Extension Stability** (Pettigrew has specific chapters on full belief and imprecise credence).
  *   **Failures:** Fails **Dominance Vindication** in its pure form. It argues agents *ought* to maximize expected accuracy, but if the agent's current credences are incoherent, their *expectations* are flawed. It often relies on a "chance" or "objective prior" to fix expectations, which risks violating Epistemic Currency (smuggling in metaphysical assumptions).
  *   **Verdict:** Better for goal (ii) (extensions), but weaker on goal (i) (replacing Dutch-book with a stricter dominance argument).

  **3. The Unique Measure Program (e.g., Pettigrew's Axiomatic Derivation)**
  *   **Performance:** Passes Fundamentality and Currency.
  *   **Failures:** Fails **Measure Robustness** (by definition, it seeks uniqueness). Fails **Representational Neutrality** (your Draft 12) due to the language dependence problem inherent in fixing a specific measure like the Brier score.
  *   **Verdict:** High precision, high controversy. It solves the arbitrariness worry but creates a "language dependence" vulnerability.
  *   **Negotiable Failure:** If you downgrade Req 4 to Robustness (allowing a class of measures), this approach collapses into the Dominance Approach.

  ### Summary Recommendation for Your Dissertation

  1.  **Drop Requirement 9.** It is a philosophical trap.
  2.  **Downgrade Requirement 4 to Robustness.** Demanding a unique measure is too contentious for a framework chapter intended to assess *all* proposals.
  3.  **Keep Requirement 8 (Feasibility) but acknowledge the cost.** Explicitly state that insisting on Feasibility will rule out standard Joyce-style arguments. This is a valuable critical finding for a dissertation.
  4.  **Drop Requirement 12.** It is mathematically impossible for scoring rules. Instead, frame the "Language Dependence" problem as a challenge the framework must *acknowledge*, not a requirement it must *satisfy*.

  This leaves you with a framework that is rigorous enough to filter out weak proposals but flexible enough to admit the major players in the field, allowing you to critique them on the specific tension between **Dominance** and **Feasibility**.
