answer: |-
  Here is the plan to fix the session. Your sponsor is right: last year you taught *compliance* (do this) instead of *literacy* (read this). With shaky English and 40 minutes, you cannot teach philosophy. You have to teach pattern recognition.

  ### 1. The Running Order (40 Minutes)

  Do not start with rules. Start with the feeling of confusion.

  *   **0:00–0:05 | The Hook: "The Weird Thing"**
      *   **Action:** Draw a stick figure on the whiteboard standing alone at a bus stop. Draw a second stick figure standing *in front* of them, not in a line. Put a big question mark between them.
      *   **Say:** "In my country, this looks rude. In your country, maybe it looks normal. Today is not about who is right. It is about how not to look rude when you didn't mean to."
      *   **Why:** This validates their feeling that your rules might seem weird. It lowers defensiveness. It heads off the misconception: *"Your norms are the neutral ones and mine are the weird local ones."*

  *   **0:05–0:15 | The Concept: "Safety Rails vs. Social Glue"**
      *   **Action:** Draw two columns on the board. Label them **Safety** (Red Marker) and **Glue** (Blue Marker).
      *   **Say:** "Some rules keep you safe or keep people from getting hurt. These are Safety Rails. Some rules just help us move together without bumping into each other. These are Social Glue."
      *   **Why:** This introduces the "Three Buckets" without using those words. "Safety" covers Harm/Fairness. "Glue" covers Coordination. This heads off the misconception: *"It's not a law so it doesn't matter."* (Glue isn't law, but it holds the bus together).

  *   **0:15–0:30 | The Core Example: The Bus Stop Queue**
      *   **Action:** Use the stick figures from the hook. Act it out with a volunteer.
      *   **Why:** (See section below for full breakdown). This is where you teach the distinction.
      *   **Why here:** You need the concept (Rails/Glue) before the example, or they will just memorize the example as a rule.

  *   **0:30–0:35 | The Strategy: "Watch, Wait, Copy"**
      *   **Action:** Give them a tool for norms you *didn't* teach.
      *   **Say:** "You will see new things. Do not ask 'Is this right?' Ask 'What is everyone else doing?' Wait 10 seconds. Copy the person who looks most local."
      *   **Why:** This empowers them. It heads off the misconception: *"I never agreed to your rules so they can't bind me."* (You agree by entering the system).

  *   **0:35–0:40 | The Check & Handout**
      *   **Action:** Ask the closing question (see below). Hand out the sheet.
      *   **Why:** Verify learning before they leave.

  ---

  ### 2. The One Example: The Bus Stop Queue

  **Pick:** **The Bus Stop Queue.**
  **Cut:** Tipping (too economic), Crossing (too legal/safety), Dinner (too variable), "How are you" (too linguistic/abstract).

  **Why the Bus Stop?**
  It is purely physical. It requires almost no English to understand visually. It is the perfect example of a **Coordination Norm** (your "third bucket"). It is not moral (no one gets hurt if you cut), but it is obligatory (the system breaks if everyone cuts).

  **What it has to have:**
  1.  **Visuals:** Draw the invisible line. Show the "Gap" that people respect.
  2.  **The "Why":** Explain that the line exists *only* because we agree it exists. It is a promise between strangers.
  3.  **The Consequence:** If you cut, the bus doesn't crash. But people will be angry. The penalty is social, not legal.

  **What would wreck it:**
  1.  **Calling it "Politeness":** If you call it politeness, the Denmark kid thinks, "I am polite in my way." Call it **"Order"** or **"System."**
  2.  **Making it Moral:** Do not say "It's wrong to cut." Say "It breaks the agreement."
  3.  **Ignoring the Free Rider:** You must explain why *they* should follow it if no one is watching.

  **How to explain the "Free Rider" point (without Game Theory):**
  *   **Say:** "Imagine everyone decides for themselves. 'No cars, I cross.' 'No space, I push.' Now the bus stop is a fight. Everyone is slower. The line is not for the bus driver. The line is for *you*. It saves you from fighting."
  *   **The Obligation:** "You don't have to like the line. But if you use the bus, you use the line. That is the ticket price."

  **How to say "You're not a bad person" without "Rules are Fake":**
  *   **Say:** "If you cut the line, you are not a criminal. You are not mean. You are just... loud. You are making noise in a quiet system. People will not hate you. They will just think you do not know how the machine works."
  *   **Distinction:** Safety Rails = Don't hurt people. Social Glue = Don't break the machine.

  ---

  ### 3. The Three Buckets (Harm, Fairness, Coordination)

  **Is the third bucket real enough to teach?**
  Yes. It is the most important one for exchange students. Harm and Fairness are mostly universal. Coordination is local.

  **How to explain it:**
  Use the **Driving Side of the Road** analogy if they get stuck on the bus stop.
  *   "Does it matter if we drive on the left or right? No.
  *   Does it matter if we *agree*? Yes.
  *   If you drive on the 'right' moral side, but the 'wrong' local side, you crash."
  *   **Label:** Call Coordination Norms **"Local Code."**

  **The Honest Version for Non-Moral Norms:**
  You need to validate the Rome kid without validating jaywalking.
  *   **Script:** "The kid from Rome was right. If no car comes, you are safe. But here, the rule is not about safety. It is about **prediction**. Drivers expect you to wait. If you cross, you break their prediction. You are not bad. But you are unpredictable. Unpredictable is dangerous here."

  ---

  ### 4. Map the Misconceptions

  | Misconception | Where it comes from | Where you kill it in the session |
  | :--- | :--- | :--- |
  | **"It's not a law, so it doesn't matter."** | Their home culture / Last year's failure. | **0:05 (Concept):** Explain "Social Glue." The penalty is social friction, not jail. |
  | **"Americans are just uptight."** | The Rome/Denmark pushback. | **0:00 (Hook):** Acknowledge *your* rules look weird to them. Normalize the weirdness. |
  | **"My norms are neutral, yours are local."** | Default ethnocentrism. | **0:00 (Hook):** "In my country, this looks rude. In yours, maybe normal." Flip the script. |
  | **"I never agreed to your rules."** | Political/Philosophical objection. | **0:30 (Strategy):** "If you use the bus, you use the line. That is the ticket price." Consent is implied by participation. |
  | **"All rules are arbitrary/fake."** | **Risk:** If you over-emphasize that norms aren't moral. | **0:35 (Check):** The closing question must force them to distinguish between Harm and Glue. |

  ---

  ### 5. The Closing Question

  Do not ask: "Will you wait in line?" (They will just say yes).
  Do not ask: "Do you understand?" (They will say yes).

  **Ask this:**
  > "If you see a student run across the street when no cars are coming, are they **dangerous** or just **local**?"

  *   **If they say "Dangerous":** They didn't get it. They think it's a Safety Rail.
  *   **If they say "Local":** They got it. It's a Coordination Norm.
  *   **If they say "Both":** Perfect. (It's local, but being unpredictable is dangerous).

  ---

  ### 6. Exclusions & The "Deeper Answer"

  **What you are leaving out on purpose:**
  1.  **Legal consequences:** Don't talk about fines for jaywalking. It confuses Law with Norm.
  2.  **Economic justice:** Don't talk about *why* tipping exists (wages). It's too complex for 40 mins.
  3.  **History:** Don't explain *why* Americans queue. It doesn't matter.

  **If someone asks for the deeper answer:**
  *   **Student:** "But *why* do you do it this way? It makes no sense."
  *   **You:** "There is a deeper answer about history and money. But today is about survival. First, learn to walk. Later, you can study why we walk this way. Ask me at lunch next week."
  *   **Why:** Validates their curiosity without derailing the session.

  ---

  ### 7. The Handout (Sponsor vs. You)

  Your sponsor wants "House Rules." You think that undermines the lesson.
  **Compromise:** The **"Cultural Cheat Sheet."**

  Do not print "DO THIS." Print **"WHEN YOU SEE X, IT MEANS Y."**
  This frames it as translation, not obedience.

  **Content of the Page:**
  *   **Header:** Local Code: Translations
  *   **Column 1 (What you see):** "People standing in a loose line at the bus."
  *   **Column 2 (What it signals):** "First come, first served. Do not stand in front."
  *   **Column 3 (Safety or Glue?):** "Glue" (Use your icons).
  *   **Column 1:** "Server asks 'How is everything?'"
  *   **Column 2:** "They are checking, not chatting. Short answer is okay."
  *   **Column 3:** "Glue."
  *   **Column 1:** "Someone holds the door open."
  *   **Column 2:** "Walk through and say thanks. Do not let it close."
  *   **Column 3:** "Glue."

  **Why this works:** It gives the sponsor their "rules" but gives the students the "context" they need to not feel like robots.

  ---

  ### 8. The Outbound Students (Locals going abroad)

  **Decision:** **Flag it and do it separately.**

  **Why:**
  1.  **Time:** 40 minutes is too tight to teach inbound *and* outbound. You will rush and fail both.
  2.  **Psychology:** Inbound students are anxious (need safety). Outbound students are excited (need adventure). They need different tones.
  3.  **The Lesson:** The inbound lesson is "Read the room." The outbound lesson is "You are the ambassador."

  **What to say:**
  "I have 4 of you going abroad. Your session is different. You aren't learning to survive; you're learning to represent us. I will send you a invite for a 15-minute pizza session next week. For today, just listen so you know what the new kids are learning."

  **Why:** Makes them feel special, keeps the 40-minute focus tight.

  ### Summary Checklist for You
  1.  **Whiteboard:** Markers (Red/Blue), draw stick figures.
  2.  **Language:** Speak slowly. Avoid idioms. Use "Safety" and "Glue."
  3.  **Tone:** Peer-to-peer. "I get confused too."
  4.  **Handout:** "Translations," not "Rules."
  5.  **Outbound:** Separate session.

  This plan respects the students' intelligence, satisfies the sponsor's need for structure, and fixes the philosophical error from last year without turning into a lecture.
