      *   *Bus Stop:* Good for coordination, but low stakes.
      *   *Dinner Gift:* Good for social capital, but varies wildly by family.
      *   * "How are you":* **Winner.**
          *   *Why:* It's universal (everyone greets), low stakes (no fines), purely linguistic/cultural coordination, and clearly distinct from morality. It highlights the "automatic response" vs. "truth" distinction perfectly.
          *   *Requirements:* Must show the *function* (acknowledgment) vs. the *content* (truth).
