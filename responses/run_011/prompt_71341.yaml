      *   *Critique:* Did I explain the Weights?
      *   *Fix:* Emphasize that Harsanyi says "Weighted Sum" but doesn't give the weights. The committee must choose the weights democratically.

  7.  **Final Polish:** Check against constraints. No bibliography. Plain language. Start with brainstorming. Ensure the "No" conditions are clear.

  *(Self-Correction on Harsanyi Nuance)*: I need to be careful not to overstate Harsanyi. It requires individuals to be Expected Utility maximizers. If a panelist is strictly "Maximin" (worst-case scenario focused), Harsanyi doesn't apply to them. I should mention this limitation. The Nurse might be a Maximin player. I need to address how to handle her if she refuses to play the "Average" game.

  *(Refining the "Common Scale")*: This is the hardest part. How do we compare literacy to dental health? The foundation's mission statement is the only bridge. I need to make sure the procedure forces them to map everything to the Mission, not to personal preference.

  *(Final Plan)*:
  1.  **Brainstorming:** Validate the user, break down the theorem's "moving parts" vs. "fixed parts."
  2.  **The Two Hard Questions:** Tackle Probability and Ex-Post/Ex-Ante directly.
