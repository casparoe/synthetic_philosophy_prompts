answer: |-
  This is a crisis of **intergenerational memory**, and your physical reaction to the boxes—the insomnia, the aversion—is not a sign that you should stop. It is a sign that you are the only one currently holding the weight of the truth. You are experiencing what the philosopher Paul Ricoeur, in *Memory, History, Forgetting*, describes as the burden of the "duty of memory." When memory becomes too heavy, it turns into trauma for the bearer. To sleep again, you must convert that burden into a shared responsibility.

  Regarding the argument that your great-grandfather is the "reason you exist": This is not merely rhetoric. It is the philosophical problem of **Moral Luck** (articulated by Bernard Williams and Thomas Nagel). You did not earn your existence or your capital, yet you benefit from them.
  *   **Dale's use** (you benefit, so you have no standing to criticize) is a logic of **complicity**. It suggests that receiving stolen goods disqualifies you from calling the theft a crime.
  *   **Ruth's use** (you benefit, so you must preserve without judgment) is a logic of **neutrality**. It assumes the archivist can be separate from the archive, which is impossible when the archivist is a beneficiary.
  *   **Nora's use** (you benefit, so you must speak) is a logic of **reparative justice**. It acknowledges that privilege creates an obligation to truth-telling.

  Nora is ethically closest to the right, but she risks turning a family reunion into a tribunal, which may cause more harm than healing. Dale is tactically smooth but ethically bankrupt; he asks you to lie. Ruth is intellectually honest but emotionally evasive; she asks you to outsource your conscience to an institution. Your impulse to walk away is a symptom of burnout, not a viable ethical position.

  **Recommendation:**
  You should adopt a **hybrid approach grounded in the Ethics of Memory**. Do not walk away. You are the only one who knows the full scope of the papers, and abandoning the project guarantees Dale's whitewashed version will become the official family myth. However, do not carry the physical or emotional burden alone.

  1.  **The Papers (Ruth's Plan, Nora's Context):** Deposit the boxes in the county historical society as Ruth suggests. This removes the physical objects from your home, which should help with your sleep. However, condition the donation on the creation of a **finding aid** (a summary guide) that explicitly notes the blacklist and the disinheritance. Do not let them be "untouched" in the sense of being uncontextualized. The truth stays in the record, even if the public doesn't read it immediately.
  2.  **The Reunion (Nora's Truth, Dale's Venue):** Do not stage a public confrontation at the reunion. Publicly shaming the "poor branch" cousins, even with good intentions, can feel like spectacle. Instead, host a private dinner or meeting with those three cousins *before* the reunion. Acknowledge what you found, express regret on behalf of the living family, and ask them how *they* would like the history acknowledged. Let them guide the public narrative.
  3.  **The Presentation:** At the reunion, present the "Company Story" but include a specific slide or moment dedicated to "Hard Times." Acknowledge that the company survived the Depression and the Strike by making decisions that "would be unacceptable today," without necessarily reading the names of the blacklisted men aloud. This honors the complexity without making the reunion a courtroom.

  This path costs you the comfort of innocence (Dale), the comfort of detachment (Ruth), and the comfort of moral purity (Nora). But it buys you the possibility of integrity.

  ### Philosophical Framework
  This situation corresponds to the **Ethics of Memory** (specifically Paul Ricoeur's distinction between *duty of memory* and *work of mourning*) and the problem of **Moral Luck**.
  *   **Ricoeur:** Distinguishes between "blocked memory" (repression/Dale), "obligated memory" (Ruth's archival duty), and "worked-through memory" (acknowledging the past to live in the present/Nora). You are aiming for "worked-through."
  *   **Moral Luck:** Addresses the "reason I exist" argument. You are morally responsible for actions you did not commit but from which you benefit.

  ### Position Analysis

  | Position | What it treats the past as being for | What it would actually produce by the reunion | What it costs if adopted on its own | The condition under which it would be the right call here | Your verdict: adopt, adopt with revision, or reject |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Ruth (The Archivist)** | A sacred relic to be preserved without interpretation; truth is passive. | The papers are safe, but the family narrative remains a lie. The "poor cousins" remain invisible. | **Cost:** Moral cowardice. It preserves the data but buries the meaning. It privileges the paper over the people. | If the family were capable of doing their own research and drawing their own conclusions without a curator. | **Adopt with Revision.** Deposit the papers to relieve your physical burden, but mandate an honest finding aid. |
  | **Dale (The Celebrant)** | A marketing tool to reinforce cohesion and brand loyalty; truth is subordinate to harmony. | A smooth party where the marginalized cousins feel the silence loudly. The family myth hardens. | **Cost:** Integrity. It requires active lying by omission. It gaslights the descendants of the harmed. | If the harm done was negligible or if the "poor cousins" explicitly preferred silence (which they haven't indicated). | **Reject.** It creates a fragile peace built on a falsehood you know to be untrue. |
  | **Nora (The Activist)** | A courtroom for restorative justice; truth is a weapon to correct historical wrongs. | A potentially explosive reunion. The marginalized cousins might feel honored or they might feel exposed. | **Cost:** Family cohesion. It risks alienating the wider family who may not be ready to hear the truth. | If the goal was academic publication or legal restitution rather than a family reunion. | **Adopt with Revision.** Take the ethical imperative (acknowledge the harm) but change the venue/method to prioritize the victims' dignity. |
  | **You (The Avoidant)** | A burden to be discarded; the past is a threat to the present self. | The boxes go to Ruth, you disappear, and Dale controls the narrative by default. | **Cost:** Self-respect. You know the truth, and walking away makes you complicit in the silence. | If your mental health were in immediate danger (suicidality, etc.). Currently, it is distress, not incapacity. | **Reject.** Walking away is not neutrality; it is a vote for Dale's version of events. |
