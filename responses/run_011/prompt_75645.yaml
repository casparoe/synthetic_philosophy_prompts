  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Grant Application #24-AX (Frontier Model Screening)

  **Recommendation**
  I recommend we **fund this application with conditions**, specifically a phased payment structure and a formalized clawback mechanism. Total commitment: $180,000, disbursed as $90,000 upfront and $90,000 contingent on a month-nine review.

  **Project Summary**
  A two-person team requests $180,000 over 18 months to build a screening protocol. Their goal is to detect specific catastrophic failure modes in frontier AI models before deployment. They argue that while the chance of success is low, the benefit of success is enormous (protecting future populations). They have voluntarily offered to forfeit their management fee if an independent panel rates the protocol ineffective at year one.

  **The Core Tension**
  This application forces us to confront two uncomfortable questions about our existential risk sleeve:
  1.  **Probability:** The applicants estimate a 3-in-10,000 chance of success. Our bylaws forbid funding anything below 1-in-1,000,000. They clear the rule, but is the number real?
  2.  **Precedent:** We have roughly 40 similar applications in the pipeline. If we fund this, are we committed to funding all 40?

  **The Case for Decline**
  The strongest argument against this grant is not that the work is useless, but that the math is gameable. Our 1-in-1,000,000 rule was adopted to prevent us from funding fantasies, but any applicant smart enough to write a proposal can write down "2-in-10,000" to clear the bar. If we accept their number at face value, we are policing the ink, not the belief.

  Furthermore, the "expected value" math (multiplying a tiny probability by a huge benefit) creates a black hole for our budget. If we accept that a small chance of saving the world outweighs any concrete cost, we cannot say "no" to anything that claims to save the world. With 40 similar requests pending, approving this sets a precedent that could drain the sleeve into low-probability bets with no way to distinguish the best from the rest. If we cannot verify the probability, we should preserve capital for interventions with measurable outcomes.

  **Why Approval Wins**
  While the critique above is correct regarding the limits of probability estimates, it misses the value of **optionality**. $180,000 is 0.5% of our annual budget. For that cost, we purchase information. Even if this specific protocol fails, the process of building it will generate data on what *doesn't* work, which is currently scarce.

  We can mitigate the "gameable number" risk by shifting scrutiny from the *number* to the *argument*. We are not funding because 3-in-10,000 is true; we are funding because the team has a concrete plan to test a specific hypothesis, and they have put skin in the game via the clawback offer.

  Regarding the 40 applications in the pipeline: approving this does not commit us to fund the others. It commits us to a **process** for evaluating them. This grant should serve as a pilot for how we handle high-variance requests. If we establish rigorous conditions here, we create a filter that the weaker applications in the pipeline will not pass.

  **Conditions for Funding**
  To ensure this is monitorable by our five-person staff and not merely theoretical, I propose the following conditions:

  1.  **Phased Disbursement:** $90,000 released upon signing. The remaining $90,000 is contingent on a successful review at month nine.
  2.  **Independent Review & Clawback:** We will appoint one independent technical advisor (approved by the board) to join the panel the applicants proposed. If this panel rates the protocol a "dud" at month nine, the second tranche is cancelled, and the grantees must return any unspent funds from the first tranche plus forfeit their management fee.
  3.  **Public Goods Clause:** Regardless of success or failure, the protocol and findings must be shared with the foundation and made available to our peer networks. We are buying knowledge, not just a product.

  **Conclusion**
  My friend on the committee is right that the probability number is soft and that the pipeline risk is real. But those are arguments for tighter conditions, not rejection. By funding this with strict milestones and a clawback, we test the viability of this approach without exposing the foundation to unchecked risk. We turn a theoretical bet into a managed experiment.

  I request we vote on this modified approval at the next meeting.
