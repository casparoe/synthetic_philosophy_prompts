          *   Must cover specific distinctions (omission vs. absence, prevention vs. causation, causing vs. allowing, cause vs. relevance).
          *   Must cover ontological constraints (physics has no negative events).
          *   Must cover legal data (common law vs. civil law on duty to rescue).
          *   Must cover reactive attitudes (blame asymmetry).
          *   Apply the theory to 6 specific manuscript scenarios.
          *   Identify defective tests among the 6 scenarios.
          *   Three shorter addenda: (1) Novelist intuitions vs. theory (salience/focalization), (2) Incompatible requirements (tensions), (3) Scorecard of three theory types (Counterfactual, Production, Contrastive).
      *   **Tone:** Rigorous, philosophical, precise, practical for a writer, avoiding academic fluff.

  2.  **Deconstruct the Desiderata (The Specification):**
      *   I need to generate a list of criteria that a theory of omission causation must meet.
      *   *Requirement 1: Ontological Parsimony/Compatibility.* Physics doesn't have "not-events." A theory must explain what exists when we say "X caused Y by not doing Z."
      *   *Requirement 2: The Omission/Absence Distinction.* Not every absence is an omission. (I didn't water the plant vs. rain didn't fall). Needs agency/capacity.
      *   *Requirement 3: Cause vs. Condition/Relevance.* Distinguishing *the* cause from background conditions. (The gardener vs. the head of state).
      *   *Requirement 4: Causation vs. Prevention.* Causing death vs. preventing life. These feel different but might be logically similar. The theory needs to handle the directionality.
      *   *Requirement 5: Legal/Moral Duty Sensitivity.* Why is the stranger not liable but the parent is? The theory needs to accommodate "special relations" without collapsing into moralism.
      *   *Requirement 6: Reactive Attitude Asymmetry.* We blame omissions less than commissions. The theory shouldn't make them identical in weight.
      *   *Requirement 7: Formal Properties.* Asymmetry (cause precedes effect), Non-transitivity (sometimes), Relata (events vs. facts/contrasts).

      *Refining the Requirements based on constraints:*
      *   Need to specify formal shape constraints explicitly.
      *   Need to specify if non-negotiable or camp-specific.

  3.  **Drafting the Desiderata:**

