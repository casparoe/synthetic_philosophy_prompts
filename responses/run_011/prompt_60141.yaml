answer: |-
  # The Specification for Causation by Omission

  You are entitled to assume that a causal claim in your manuscript is true, rather than merely rhetorically effective, only if the underlying theory of causation satisfies the following desiderata. Each requirement includes the constraint it imposes on the formal shape of the causal relation.

  ### 1. The Ontological Commitment Requirement
  **Requirement:** The theory must explicitly state what kind of entity an "omission" is, given that fundamental physics describes the world entirely in positive terms.
  **Motivation:** If physics finds no negative events among its furniture, a theory cannot treat "not sending a letter" as a brute fact without explaining how it fits into reality.
  **Status:** Non-negotiable.
  **Formal Constraint:** Constrains the **relata**. The theory must either posit negative facts as real entities, treat causation as a relation between propositions/facts rather than concrete events, or treat omission-talk as a shorthand for positive background conditions.

  ### 2. The Capacity Constraint
  **Requirement:** The theory must distinguish an omission (an agent failing to do what they could have done) from a mere absence (a state of affairs where no agent had the capacity to act).
  **Motivation:** We do not say the "moon's failure to water the plant" caused its death, even if the moon's watering would have saved it. Omission requires the possibility of action.
  **Status:** Non-negotiable for any account of *omission* specifically.
  **Formal Constraint:** Constrains the **relata**. The putative cause must be indexed to an agent's capacity at time *t*; it is not a simple two-place relation between events but requires a modal operator (could have done otherwise).

  ### 3. The Selection (Profligacy) Requirement
  **Requirement:** The theory must provide a principled basis for selecting one absence as *the* cause among the infinite number of absences necessary for the effect to occur.
  **Motivation:** The gardener's failure to water kills the plant, but so does the head of state's failure to water it. Both are counterfactually necessary; only one is a cause.
  **Status:** Camp-specific. Pressed by **Pragmatic/Contextualist** camps.
  **Formal Constraint:** Constrains the **relata**. This demands a **contrastive** structure (e.g., "failure to water *rather than* watering" vs. "failure to water *rather than* being a head of state"). It rejects causation as a simple binary relation between events.

  ### 4. The Causation-Responsibility Distinction
  **Requirement:** The theory must distinguish causal contribution from normative liability, allowing the former to remain constant while the latter varies across legal systems.
  **Motivation:** Common law does not punish a stranger's failure to rescue; civil law often does. If causation depended on the law, the physical reality would change with the jurisdiction.
  **Status:** Non-negotiable.
  **Formal Constraint:** Constrains the **content**. Causation must be descriptive (metaphysical/empirical), not normative. A theory that builds "duty" into the definition of causation fails this.

  ### 5. The Asymmetry of Reactive Attitudes
  **Requirement:** The theory must accommodate the intuition that causing harm by action warrants stronger blame than causing harm by omission, without denying that both are causal.
  **Motivation:** We blame the pusher more than the non-rescuer, even if the death is identical. A theory that makes them metaphysically identical risks erasing this moral distinction.
  **Status:** Camp-specific. Pressed by **Moral Metaphysicians**.
  **Formal Constraint:** Constrains the **formal properties**. It suggests causation is not merely a binary switch but may carry a "weight" or "vector" property, or that the *path* of causation (active vs. passive) is part of the causal relata.

  ### 6. The Prevention-Causation Distinction
  **Requirement:** The theory must distinguish between causing an event and preventing its opposite, particularly in chains of double prevention.
  **Motivation:** If A prevents B from preventing C, did A cause C? (e.g., The nurse failing to sedate prevents the line removal, which prevents the drug delivery, which prevents death).
  **Status:** Camp-specific. Pressed by **Process/Production** camps.
  **Formal Constraint:** Constrains **transitivity**. A theory that allows unlimited transitivity through negative links will verdict that the nurse caused survival. A theory that breaks transitivity at negative links will not.

  ### 7. The Counterfactual Dependence Floor
  **Requirement:** The theory must require that if the omission had not occurred (i.e., if the action had been taken), the effect would not have occurred.
  **Motivation:** If the warning would not have been heeded anyway, the failure to warn did not cause the harm.
  **Status:** Non-negotiable (for most contemporary accounts).
  **Formal Constraint:** Constrains the **formal properties**. Establishes a necessary condition for the causal relation, though not always sufficient (due to the Profligacy problem in Req 3).

  ***

  # Verdicts on Manuscript Situations

  A theory satisfying the above specification would yield the following verdicts. Where the theory remains free, it indicates a point where your plot can be tuned without violating metaphysical truth.

  **1. The Unsent Letter**
  *   **Verdict:** **True Cause.**
  *   **Reasoning:** Satisfies Counterfactual Dependence (Req 7) and Capacity (Req 2). The Selection Requirement (Req 3) is met because familial duty creates the normative expectation that selects this absence over others (e.g., a neighbor's failure to check in).
  *   **Freedom:** You may vary the *degree* of blame (Req 5), but not the causal status.

  **2. The Gardener vs. The Head of State**
  *   **Verdict:** **Gardener = Cause; Head of State = Background Condition.**
  *   **Reasoning:** Both satisfy Counterfactual Dependence. Only the Gardener satisfies Selection (Req 3). The theory must invoke a norm or expectation to filter the Head of State out.
  *   **Freedom:** If your theory is purely counterfactual without pragmatic selection, both are causes (a defect). You must assume a theory that incorporates norms into selection to save this scene's logic.

  **3. The Drowning and the Twenty Swimmers**
  *   **Verdict:** **All Twenty are Causes (Overdetermination).**
  *   **Reasoning:** Each satisfies Capacity and Counterfactual Dependence *individually* (if *this* swimmer had acted, the child lives).
  *   **Freedom:** A theory can handle this by treating them as "joint sufficient causes" or by diluting the causal weight of each. You are free to depict the moral diffusion of responsibility, but metaphysically, each swimmer's omission is a cause.

  **4. The Seizure and the Curb**
  *   **Verdict:** **Not an Omission (No Cause).**
  *   **Reasoning:** Fails the Capacity Constraint (Req 2). An omission requires the ability to do otherwise. If the seizure made action physically impossible, there is no omission, only a physiological event.
  *   **Freedom:** This turns on the medical definition of the seizure. If there was a prodrome (warning) he ignored, it reverts to an omission. You must be precise about the onset.

  **5. The Nurse and the Double Prevention**
  *   **Verdict:** **Contested (Turns on Transitivity).**
  *   **Reasoning:** This is a chain of double prevention (Failure to sedate → Line stays in → Drug not delivered → Interaction prevented → Survival).
  *   **Freedom:** A theory that allows transitivity through negative links says the nurse caused survival. A theory that blocks it says she merely *allowed* survival. This is a **defective test** for truth; it is a boundary case where language runs out. You can write it either way, but know that "causing survival by failing to act" is metaphysically volatile.

  **6. The Ineffective Warning**
  *   **Verdict:** **Not a Cause.**
  *   **Reasoning:** Fails Counterfactual Dependence (Req 7). If the warning had been given, the colleague would have walked into the danger anyway.
  *   **Freedom:** You may depict the *guilt* of the warner, but you cannot depict the *causality* as true. To make it causal, you must introduce a probability shift (e.g., "might have stopped him") rather than a certainty.

  ### Defective Tests
  **Scenario 5 (The Nurse)** is a defective test for your purposes. It relies on "double prevention," which divides theories cleanly but offers no intuitive grip for a reader. It turns on whether causation is transitive across negative links. This is a technical metaphysical dispute, not a human experience. If your plot hinges on whether the nurse *caused* survival vs. *allowed* it, you are building on a distinction that even philosophers cannot settle. Cut or simplify this scene to a direct omission (e.g., nurse fails to give drug, patient dies).

  **Scenario 4 (The Seizure)** is defective if the medical details are vague. It begs the question of "capacity." If the seizure was total, it's not an omission. If it was partial, it is. The metaphysics depends entirely on the neurology. Do not use this to test causation; use it to test *excuse*.

  ***

  # Three Shorter Things

  ### 1. Novelist Intuitions vs. Theoretical Desiderata
  Your trade requires **salience** and **focalization**; a respectable theory must refuse them.
  *   **Salience:** You want the absence the *reader feels* to be the cause. Theory says salience is interest-relative and cannot determine truth. If you make the reader feel the unsent letter is the cause, but the brother was already dead when the letter would have arrived, you have written a lie that feels true.
  *   **Focalization:** You want the cause to be where the camera points. Theory says causation is mind-independent.
  *   **The Prejudice:** Your intuition that "the absence which mattered is the one the reader was made to feel" is camp prejudice (Contextualism/Pragmatism). It buys you narrative coherence but sacrifices objective truth. A rigorous theory demands the cause be the same regardless of who is looking. You must decide if you are writing a mystery (objective truth exists) or a psychological drama (truth is perspectival).

  ### 2. Incompatible Requirements
  There is a tension between **The Ontological Commitment Requirement (1)** and **The Counterfactual Dependence Floor (7)**.
  *   **The Argument:** If physics contains no negative events (Req 1), then "not sending the letter" does not exist as a concrete entity. But Counterfactual Dependence (Req 7) treats "not sending" as a relatum that stands in a relation to the death. If the relatum doesn't exist, it cannot stand in a relation.
  *   **The Consequence:** You cannot have a theory that says "absences are not real" *and* "absences are causes" without a complex workaround (e.g., saying the *positive* background conditions caused the death, but we *describe* it as an omission). This tension is real. It means your novel's engine (harm by omission) is ontologically unstable. You are building a plot on a useful fiction. Acknowledge this: the characters treat the absence as a thing, but the world treats it as a gap. That gap is where your tragedy lives.

  ### 3. Scorecard of Theoretical Camps

  **Counterfactual-Dependence Account (Accepts Negative Causation)**
  *   **Score:** Passes Req 7 (Dependence) and Req 4 (Law/Cause distinction). Fails Req 3 (Selection) without pragmatic help (verdicts the Head of State a cause).
  *   **Best for:** Your novel. It captures the "if only" logic of regret perfectly. It validates the unsent letter as a cause simply because the brother would have lived if it were sent.

  **Production/Process Account (Denies Causation by Absence)**
  *   **Score:** Passes Req 1 (Ontology) perfectly (no negative events). Fails Req 2 (Omission) by denying omissions are causes at all; reconstructs them as positive processes (e.g., "the body's cooling caused death").
  *   **Best for:** Hard realism. It would force you to rewrite your engine: the father wasn't killed by the unsent letter; he was killed by the freeze, and the letter was just a story the survivors tell.

  **Contrastive Account (Causation as Relation among Contrasts)**
  *   **Score:** Passes Req 3 (Selection) and Req 2 (Capacity). Complex on Req 7 (Dependence).
  *   **Best for:** Nuance. It allows you to say "The failure to send the letter *rather than sending it* caused the death, but the failure to send the letter *rather than screaming* did not." It gives you the precision to distinguish the Gardener from the Head of State without appealing to vague norms.
