      *   *Req 2 (Agency/Capacity):* Must distinguish omission (agent could have acted) from mere absence (no agent/capacity). (Non-negotiable for *omission* specifically).
      *   *Req 3 (Selection/Normality):* Must explain why some absences are causes and others aren't (Gardener vs. Head of State). This usually requires a "normality" or "expectation" constraint. (Camp-specific: Pragmatic/Contextualist).
      *   *Req 4 (Legal/Moral Independence):* Must distinguish causal structure from normative duty, or explain their entanglement. (Non-negotiable to avoid circularity).
      *   *Req 5 (Formal Asymmetry):* Causation must be asymmetric. (Non-negotiable).
      *   *Req 6 (Prevention vs. Causation):* Must distinguish causing a death from preventing a survival. (Camp-specific: Process theorists care more).
      *   *Req 7 (Contrastivity):* Must handle the fact that "not doing X" implies "doing Y instead" or is relative to a contrast. (Camp-specific: Contrastivists).

      *Wait, I need to ensure I hit the specific prompts in the prompt:*
      *   Omission vs. Absence.
      *   Prevention vs. Causation.
      *   Causing vs. Allowing.
      *   Cause vs. Relevance.
      *   Physics/Ontology.
      *   Legal Data (Common vs. Civil).
      *   Reactive Attitudes.

      *Let's structure the list to hit these explicitly.*

  4.  **Analyzing the 6 Scenarios:**
      *   *Scenario 1 (Letter):* Classic omission. Brother dies. Is the unsent letter the cause? Depends on duty/expectation.
      *   *Scenario 2 (Gardener vs. Head of State):* The "Profligacy" problem. Both are counterfactually necessary. Theory must select one.
      *   *Scenario 3 (Drowning Swimmers):* Overdetermination by omission. Each could have saved. Is each a cause?
      *   *Scenario 4 (Seizure):* Capacity issue. If he *couldn't* act, was it an omission? (Involuntary).
      *   *Scenario 5 (Nurse/Sedation/ Survival):* Double prevention. Omission causes survival by preventing a prevention. Tests transitivity and negative causation.
      *   *Scenario 6 (Ineffective Warning):* Preemption/Overdetermination. Warning wouldn't have changed outcome. Counterfactual dependence fails.

      *Defective Tests:* Scenario 5 is tricky (double prevention). Scenario 4 turns on medical definition of "omission." Scenario 2 is the strongest test.

  5.  **Drafting the Addenda:**
      *   *Novelist Intuitions:* Salience/Focalization are interest-relative. Theory hates this; Novel needs this. Tension.
      *   *Incompatible Requirements:* Usually Ontology vs. Intuition. If absences aren't real, how do they cause? Or Duty vs. Causation (is causation normative?).
      *   *Scorecard:*
          *   Counterfactual: Good at omissions, bad at profligacy (Gardener/State).
