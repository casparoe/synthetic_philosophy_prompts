      *Specific focus on the "Legal Data":* Common law (no duty to rescue) vs Civil law (duty to rescue). A causal theory shouldn't necessarily dictate law, but must explain why the *causal* judgment might shift or stay stable while the *liability* shifts. Actually, the prompt asks the theory to "explain that asymmetry and its variation or explain why it is irrelevant." Most causal theories say causation is invariant, liability varies. I should frame the requirement to demand the theory distinguish *causation* from *responsibility*.

