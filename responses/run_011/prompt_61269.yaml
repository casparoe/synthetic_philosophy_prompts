  The theorem requires base rates to be equal for compatibility. You achieved near-equality not by finding a truth, but by modeling an intervention that suppresses offending differently across groups. That suppression is a policy choice, not a statistical fact. By baking that choice into the target variable, you have hidden the value judgment inside the latent construct. This obscures who is punished for what. If the score determines who gets the suppression that equalizes the rates, the score is rationing the mechanism that makes the score look fair.

  When you calibrate to this latent incidence, is that incidence estimated counterfactually for those you release without conditions, or only for those you divert?
