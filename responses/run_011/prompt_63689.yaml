answer: |-
  The heat hung over the valley like a wet wool blanket, pressing the dust into the paint of the county truck. Elias, the watermaster, leaned against the hood, his finger tracing a curve in the layer of grit. Across from him stood Mara, who owned the almond orchards on the east bank, and David, the mayor of Oakhaven, the town on the west.

  For three years, the river had been a lawyer's argument instead of a flow of water. The courts had frozen the rights pending a ruling on seniority. The disagreement point, as everyone called it in quiet moments, was a dry ditch. Mara's trees were kindling; David's taps ran brown with sediment. If they walked away from this truck without a deal, the judge would issue a curtailment order next week. Nobody gets water. Everybody loses. That was the floor. It was miserable, but it was the floor.

  Elias drew a line in the dust connecting the two sides. "We know the shape of what's possible," he said, his voice raspy. "If Mara takes more, David gets less. If David takes more, Mara's trees die. We're looking for the spot on this line where you both shake hands."

  They had been at it since dawn. They were close to a split that mirrored the history of the river—half the flow to the orchards, half to the town. It felt balanced. It felt like the surplus was being divided evenly over the misery of the lawsuit.

  Then Mara's phone buzzed. She stepped away, took the call, and came back ten minutes later. Her posture had shifted. The slump in her shoulders was gone, replaced by a rigid straightness. She looked at the line in the dust, then at David.

  "There's a data center company," Mara said. "They're looking at cooling systems. They need constant flow. They offered to lease my entire allocation. All of it. Not just for this year, but forever."

  David frowned. "But you don't have the allocation. The court hasn't ruled."

  "They know," Mara said. "They're betting on us. They're betting I can secure the rights. If I walk away from this negotiation and fight you in court until I own the whole river, that contract is waiting. It values the water at three times what almonds ever paid."

  She looked at Elias. "Draw the new line."

  Elias hesitated. The physical water hadn't changed. The river flowed at the same cubic feet per second. The town's need for drinking water was the same. The misery of the lawsuit was the same. But the ceiling had moved. Mara's best-case scenario—what she could hope for if she won everything—had just tripled in value. David's best case—saving his town—was unchanged.

  David stepped forward, wiping sweat from his brow. "That doesn't change what's on this hood," he said, pointing at the dust. "We are splitting the water we have right now. That offer is a ghost. It's something that happens only if you crush me completely. We aren't talking about crushing anyone. We're talking about sharing."

  "It changes what I'm giving up," Mara said. Her voice was quiet but hard. "Yesterday, if I agreed to give you half the water, I was giving up half my almond crop. Today, if I give you half, I'm giving up half of a data center empire. The sacrifice is bigger. If we're partners in this, you need to pay for the size of my sacrifice."

  "Why should I pay for a dream you haven't caught?" David snapped. "The water tastes the same. The pipes are the same. The deal we were shaking on ten minutes ago was fair based on what we can actually *do* together. That phone call didn't change the river. It just changed your mood. You can't charge me for a possibility that doesn't affect the water flowing between us."

  "It's not about the water," Mara said. "It's about the hope. You're asking me to bury a hope that's now worth millions. Your hope is worth the same as it was yesterday. If we split the benefit equally, I need more water to make my share equal to yours. Otherwise, I'm carrying the weight."

  Elias watched them. He didn't draw any new lines. He watched the dust settle on the old ones.

  David shook his head. "That's not how deals work. You don't get to redraw the map because you found gold in your backyard. We split the surplus we create together. The surplus is the water saved from the lawsuit. That hasn't changed. Your outside luck is irrelevant to the math of this river."

  "My luck is my leverage," Mara countered. "You want me to agree? Then acknowledge that what I'm withholding is more valuable. If you want half the river, you pay half the value. And the value just went up."

  They argued for an hour. The sun climbed higher. The dust on the truck hood began to blur in the heat haze. David kept returning to the water itself—the tangible, physical reality of the flow. He insisted that the agreement should depend only on the trade-offs right where they stood, not on the distant peaks of what Mara could achieve if she won everything. He wanted to ignore the new ceiling. He wanted to treat the offer as noise.

  Mara kept returning to the proportion. She didn't want more water because the river was bigger; she wanted more water because her stake in the game had grown. She argued that fairness meant each of them giving up the same percentage of their maximum possible win. Since her maximum had grown, her absolute concession had to be smaller, meaning she kept more water.

  Finally, Elias spoke. "We need a signature before noon."

  Mara picked up the stick. She didn't erase David's line. She drew a new mark, shifting the split. She took more water than they had agreed to ten minutes ago. Not all of it—David still got enough to filter the taps and save the town—but significantly less than the half he expected.

  David looked at the mark. He looked at Mara. He knew the physics hadn't changed. He knew the lawsuit threat was the same. But he saw the logic in the shift. She hadn't argued for efficiency; she had argued for equal relative sacrifice.

  "You're charging me for your ceiling," David said softly.

  "I'm charging you for my hope," Mara said. She signed the paper Elias handed her.

  David stood there for a long moment. He looked at the dust, at the curve that represented the river's limits. He realized that by accepting this, he was admitting that the deal wasn't just about what was possible in the middle. It was about the ends of the line. He picked up his pen. He didn't say anything. He just signed, knowing that the principle of the split had changed from splitting the gain to splitting the hope. He walked back to his truck, kicking up dust, knowing he'd lost the argument about what counted as real.

