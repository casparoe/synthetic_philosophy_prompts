prompt: |-
  I'm prepping for quals in philosophy of economics and my reading group passed around a handbook chapter with this gloss on Harsanyi's aggregation theorem:

  "Harsanyi's theorem starts from the assumption that individual welfare can be compared interpersonally, and then proves that any acceptable social ordering must be the sum of those utilities — which is exactly classical utilitarianism. Combined with his veil-of-ignorance argument it shows that a rational chooser who doesn't know whose life she'll get will maximize the average, so utilitarianism isn't a moral intuition at all but a theorem of decision theory. Rawls's maximin is just the same setup with an arbitrary risk-aversion assumption smuggled in. And since the theorem forces a plain sum, it also rules out any view that gives extra weight to the worse off — prioritarianism and egalitarianism aren't alternatives to Harsanyi, they're inconsistent with him."

  How much of this survives? Please go sentence by sentence and tell me what a social choice theorist would sign onto, what is true but stated in a way that hides something load-bearing, and what is just wrong. A few things I specifically want settled: (a) is interpersonal comparability actually a premise of the theorem, or something it's supposed to deliver — and if the latter, what's the standard complaint that what it delivers is only formal; (b) how much work the Pareto conditions are doing and which one specifically, since I keep seeing weak Pareto claimed to be enough; (c) whether the veil-of-ignorance bit is the same argument as the aggregation theorem or a seperate one that needs extra assumptions to get equal rather than merely positive weights; and (d) whether that last sentence is right, or whether a prioritarian has an obvious escape hatch. Also, is there any real tension with Arrow's impossibility theorem here, or is the chapter mashing two results together?

  I half-suspect the last sentence is too strong but my advisor says the theorem is roughly as advertised, so I can't tell which of us is being sloppy. Don't bother with a bibliography — I mainly want to know where this summary is safe to repeat and where I'd embarass myself in a seminar.
