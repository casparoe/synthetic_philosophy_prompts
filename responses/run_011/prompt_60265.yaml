answer: |-
  Here is the breakdown you need for your quals. Your advisor is right that the theorem is powerful, but the handbook gloss is rhetorically loaded and technically imprecise in ways that will get you chewed up in a seminar if you repeat them uncritically.

  The short version: The text conflates two different theorems (Aggregation vs. Impartial Observer), oversells the "neutrality" of the assumptions, and treats ethical constraints on information as mathematical necessities.

  ### Sentence-by-Sentence Breakdown

  **1. "Harsanyi's theorem starts from the assumption that individual welfare can be compared interpersonally, and then proves that any acceptable social ordering must be the sum of those utilities — which is exactly classical utilitarianism."**

  *   **Verdict:** **Misleading / Partially Wrong.**
  *   **The Theory:** Harsanyi's *Aggregation Theorem* (1955) assumes individuals have von Neumann-Morgenstern (vNM) utilities. It proves that if the social ordering satisfies the vNM axioms and the Pareto principle, the social welfare function must be a **linear combination** of individual utilities ($W = \sum a_i U_i$).
  *   **The Catch:** It does *not* prove the weights ($a_i$) must be equal. You get weighted utilitarianism, not necessarily classical (unweighted) utilitarianism. To get classical utilitarianism, you need an additional argument for why $a_i = a_j$ (usually anonymity or the veil of ignorance).
  *   **Comparability:** The sentence says it "starts from the assumption" of comparability. This is technically true but often obscured. vNM utilities are cardinally measurable but *not* interpersonally comparable by default. To sum them meaningfully, you must assume **Cardinal Unit Comparability (CUC)**. If you don't assume this, the weights $a_i$ are arbitrary because I can rescale my utility function to make my weight negligible. The theorem doesn't *deliver* comparability; it requires it to make the "sum" ethically meaningful.

  **2. "Combined with his veil-of-ignorance argument it shows that a rational chooser who doesn't know whose life she'll get will maximize the average, so utilitarianism isn't a moral intuition at all but a theorem of decision theory."**

  *   **Verdict:** **True but Conflated.**
  *   **The Theory:** This refers to Harsanyi's *Impartial Observer Theorem* (1953/1955), which is distinct from the Aggregation Theorem. The Aggregation Theorem takes preferences as given; the Impartial Observer argument derives the *weights* (specifically equal weights) from a thought experiment.
  *   **The Catch:** The claim that utilitarianism is "not a moral intuition" is Harsanyi's philosophical spin, not the math. The math only says: *If* you accept Expected Utility (EU) theory under uncertainty *and* the equiprobability assumption (probability $1/N$ of being anyone), *then* you maximize average utility.
  *   **Seminar Risk:** Many philosophers reject the application of EU theory to the veil of ignorance (Rawls's main objection). Calling it a "theorem of decision theory" hides the normative assumption that the veil of ignorance is a situation of *risk* (known probabilities) rather than *uncertainty* (unknown probabilities).

  **3. "Rawls's maximin is just the same setup with an arbitrary risk-aversion assumption smuggled in."**

  *   **Verdict:** **Harsanyi's Claim, Not Consensus.**
  *   **The Theory:** Harsanyi argued that maximizing the minimum (maximin) violates the continuity axiom of expected utility theory unless you assume infinite risk aversion.
  *   **The Catch:** Rawls explicitly denies the Original Position is a decision problem under risk where EU theory applies. He argues probabilities are undefined. To say Rawls "smuggles in risk aversion" is to beg the question against Rawls by assuming EU theory is the only rational standard.
  *   **Seminar Risk:** Do not present this as a settled fact. Present it as Harsanyi's critique of Rawls, which relies on the controversial premise that the Original Position is subject to standard Bayesian decision theory.

  **4. "And since the theorem forces a plain sum, it also rules out any view that gives extra weight to the worse off — prioritarianism and egalitarianism aren't alternatives to Harsanyi, they're inconsistent with him."**

  *   **Verdict:** **Technically True within the Framework, but Misleading Overall.**
  *   **The Theory:** Harsanyi's theorem relies heavily on the **Pareto Principle** (specifically *Ex Ante* Pareto). If every individual prefers Lottery A to Lottery B, society must prefer A to B.
  *   **The Catch:** Prioritarianism (maximizing $\sum g(U_i)$ where $g$ is concave) typically violates *Ex Ante* Pareto. A prioritarian social planner might prefer a lottery that gives everyone a lower expected utility if it reduces inequality. Therefore, Prioritarianism is inconsistent with Harsanyi's *axioms*.
  *   **The Escape Hatch:** However, a prioritarian can simply reject the Pareto axiom or argue that vNM utility is not the correct metric of "welfare" to be transformed. They aren't "wrong" mathematically; they are playing a different game with different axioms. Saying they are "inconsistent with him" is true, but saying they are ruled out *simpliciter* implies Harsanyi's axioms are mandatory, which they are not.

  ---

  ### Addressing Your Specific Questions

  **(a) Is interpersonal comparability a premise or a conclusion?**
  It is a **premise** (specifically, Cardinal Unit Comparability).
  *   **The Complaint:** vNM utilities are unique only up to positive affine transformations ($U' = aU + b$). To sum utilities across persons, you must fix the zero and the unit for everyone. Harsanyi assumes this is possible. Critics (like Sen) argue this is a massive ethical assumption disguised as a measurement technicality. If you cannot compare units, the weights $a_i$ in the social welfare function are indeterminate. The theorem delivers a linear form, but without comparability, that form is ethically empty.

  **(b) How much work are the Pareto conditions doing?**
  **Strong Pareto** is the standard requirement for the full result.
  *   **Weak Pareto** (if everyone strictly prefers X to Y, society prefers X to Y) is sufficient to get the linear form $W = \sum a_i U_i$, but it allows some weights $a_i$ to be zero (which permits dictatorship or excluding some people).
  *   **Strong Pareto** (if everyone weakly prefers X to Y and at least one strictly, society strictly prefers X to Y) ensures all weights $a_i$ are strictly positive.
  *   **Why it matters:** The Pareto condition is doing the heavy lifting of forcing the social planner to respect individual vNM preferences. This is exactly where Prioritarianism breaks, because Prioritarians want to violate Pareto when distributional concerns outweigh efficiency.

  **(c) Is the veil-of-ignorance bit the same argument?**
  **No, they are separate.**
  *   **Aggregation Theorem:** Takes individual preferences as input, outputs a social ordering form (weighted sum). Does not specify weights.
  *   **Impartial Observer (Veil):** Argues for *equal* weights ($a_i = a_j$).
  *   **The Gap:** You need the Veil argument (plus the equiprobability assumption) to get from "weighted utilitarianism" to "classical utilitarianism." Without the Veil argument, Harsanyi's Aggregation Theorem is compatible with a dictatorship (where one person's weight is 1 and others are 0), provided that dictator's preferences satisfy vNM axioms.

  **(d) Does the prioritarian have an escape hatch?**
  **Yes.**
  *   **The Conflict:** Harsanyi's theorem assumes the social welfare function satisfies the **Independence of Irrelevant Alternatives (IIA)** and **Pareto** over vNM lotteries. Prioritarianism violates *Ex Ante* Pareto.
  *   **The Escape:** The prioritarian argues that vNM utility tracks *rational preference*, not *moral welfare*. They claim we should maximize a function of welfare, not preference. Or, they simply accept that *Ex Ante* Pareto is not a binding rational constraint on social choice (accepting that a social planner can be risk-averse over distribution even if individuals are risk-neutral over their own lives). They aren't mathematically wrong; they reject the normative force of Harsanyi's axioms.

  **(e) Is there tension with Arrow's Impossibility Theorem?**
  **Yes, but it's about informational basis, not contradiction.**
  *   **Arrow:** Assumes **ordinal**, non-comparable utilities. Result: Impossibility.
  *   **Harsanyi:** Assumes **cardinal**, comparable utilities (vNM). Result: Possibility (Utilitarianism).
  *   **The Takeaway:** Harsanyi does not disprove Arrow. He escapes Arrow's impossibility by relaxing the informational constraints. He assumes we have *more* information (cardinal comparability) than Arrow allows. A social choice theorist would say Harsanyi shows that Utilitarianism is possible *if and only if* you accept the informational richness of cardinal comparability.

  ### Seminar Survival Guide

  If you want to sound like you know the literature without embarrassing yourself:

  1.  **Distinguish the Theorems:** Explicitly separate the *Aggregation Theorem* (form of the function) from the *Impartial Observer Theorem* (equality of weights). The handbook text mashes them together.
  2.  **Flag the Comparability:** Acknowledge that Harsanyi requires Cardinal Unit Comparability. If a professor presses you, say: "Harsanyi assumes CUC to fix the weights; without it, the linear form is indeterminate."
  3.  **Nuance the Pareto Claim:** Don't say Pareto is obviously true. Say: "Harsanyi's result hinges on *Ex Ante* Pareto. This is the specific axiom that Prioritarians like Adler or Otsuka reject to allow for distributional sensitivity."
  4.  **Arrow Context:** If Arrow comes up, say: "Harsanyi avoids Arrow's impossibility by operating in a richer informational domain (cardinal vs. ordinal). It's not a contradiction; it's a domain shift."
  5.  **Rawls:** Don't say Rawls is wrong. Say: "Harsanyi interprets the Original Position as risk; Rawls interprets it as uncertainty. The disagreement is about the applicability of Expected Utility theory, not just risk aversion parameters."

  **Bottom Line:** Your advisor is right that the theorem is "as advertised" *within its own axiomatic system*. The handbook is wrong to imply the axioms are neutral or that the theorem settles the moral debate. It settles the debate *conditional on accepting vNM rationality and interpersonal comparability*.
