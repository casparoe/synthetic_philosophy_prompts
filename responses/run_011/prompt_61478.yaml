      *   Tevye's soliloquy (tailor)? Yes.
      *   Dream scene (Golde/Common Knowledge)? Yes.
      *   Ending (Expulsion/Recurrence)? Yes.
      *   Fiddler metaphor vs Equilibrium? Yes.
      *   Honest Critic (Sentimentality/Rationalism)? Yes.
      *   Closing Takeaway? Yes.
      *   No lyrics/quotes? Checked.
