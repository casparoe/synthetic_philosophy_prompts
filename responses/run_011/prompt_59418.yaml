  - "crux": one sentence naming the single issue the case turns on
  - "better_reading": which reading of 4(a)(3) you'd adopt, plus your best answer to the losing side's strongest point
  - "overall": "Marcus", "Ellen", or "neither"
  - "what_both_missed": array of strings, anything in the pasted text that neither of them engaged with but that matters, most important first
  - "labels": one or two sentences on whether either of them was really arguing like a textualist or a purposivist in the theoretical sense, given the moves they actually made
  - "confidence": "high", "medium", or "low", followed by a sentence on what would change your mind

  No citations to cases or commentary — just the text above.
