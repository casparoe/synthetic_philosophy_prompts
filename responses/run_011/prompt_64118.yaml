  I work as a software engineer and have no formal training in philosophy, so please treat my vocabulary as provisional and correct me wherever I have mangled a term of art. Once a month I host a small reading group at my flat — seven or eight people, none of them academics, most of them in technology or the civil service. Last month we read the opening chapter of a general history of the First World War, the one covering the July Crisis and its aftermath: the assassination, the Austrian ultimatum to Serbia, the Russian decision to mobilise, the German response and the logic of its war plan that carried it through Belgium, and the British decision to intervene. The chapter was a continuous, closely reasoned narrative rather than a list of causes. Afterwards two members — I will call them Nadia and Owen — argued for the best part of an hour about whether the chapter had explained anything at all. I could not referee the exchange and I am not confident I understood what turned on what. I would like you to adjudicate it.

  Please note that I am reporting this as a bystander. Both of them persuaded me at different moments, so do not read a preference into the way I have written it up, and do not try to infer which side I want to win.

  The exchange, reconstructed as faithfully as I can from memory (I have paraphrased; nothing here is a verbatim quotation):

  1. **Nadia.** The chapter is a chronicle, not an explanation. It tells you what happened next, in order, and that is all it does. To explain why there was a general European war by August 1914 you would have to show that the outcome was to be expected given the antecedent conditions together with some general laws about how such systems behave — laws about alliances, mobilisation timetables, deterrence, whatever the right ones are. Historians never state such laws, and she took that not as modesty but as the reason their accounts cannot be tested and cannot be used: a narrative that does not subsume its subject under a generalisation cannot tell you whether the same thing is liable to happen again.

  2. **Owen.** The demand is either empty or self-defeating. Press a historian for the law and you get either something so vague that anything confirms it ("states act to preserve their security"; "governments under strain defer hard decisions") or something specific enough that a single counterexample destroys it. The real content of the chapter is not general at all: it consists in showing that each decision made sense to the people making it, given what they believed about the others' intentions and what they thought they could get away with. That is a complete explanation. You show the action was the appropriate thing to do in those circumstances, and there is nothing left over to be explained.

  3. **Nadia.** "Made sense to them" is not an explanation but a redescription in sympathetic vocabulary. Telling her that a system behaved as its parts were disposed to behave explains nothing until you say what the dispositions are and how widely they hold. She added that if Owen were right, historical claims would be answerable only to the participants' own testimony, and the comparative enterprise — asking whether 1914 resembles some other crisis — would be illegitimate, which she would not accept, because reasoning from precedent is precisely what analysts do for a living.

  4. **Owen.** Comparing cases is legitimate and valuable; it simply is not subsumption. You learn from 1914 by understanding it and then noticing resemblances, not by extracting a rule and applying it. He said Nadia was conflating two different jobs: making an event intelligible, and licensing a prediction. History is in the first business, and insisting that it discharge the second is changing the subject.

  5. **Nadia.** Explanation and prediction stand or fall together — that is the entire point of the covering-law picture, as she understood it. If you can explain why the war happened, you should have been able to say in advance that it would happen given those conditions. If you could not, you did not have an explanation; you had a good story.

  6. **Owen.** Then almost nothing counts as an explanation, including much of the natural sciences, since we explain a great many things nobody could have predicted. Moreover the "law" Nadia wants for human action — that people do what seems best to them given their beliefs — is exceptionless only because it is empty. It cannot tell you which action will follow, so it does no explanatory work; all the work is done by the particular beliefs and perceptions, which are not law-governed.

  7. **Nadia.** Very well: then concede that explaining an action always depends on some rough generalisation about how people respond to situations, even one nobody could write down precisely, and the dispute is only about how precise it must be. **Owen's** reply was that on that formulation she has abandoned the requirement altogether, because a generalisation nobody can state is doing no work.

  At one point Nadia name-checked Hempel, and Owen referred to a book called *Laws and Explanation in History*, which I believe is by Dray. I have read neither, and I would rather you did not build your answer on my recollection of who was invoking whom.

  Here is what I would like from you. Please adopt the role of a philosopher of history and of the social sciences who has spent years working on the logic of explanation, and who is willing to say which side of an argument is right rather than merely surveying positions. Think carefully before writing, and do not compress the difficult moves.

  - Begin with a short diagnostic section: what you take the real crux of the dispute to be, and whether any part of it is merely verbal — in particular, whether the two are using "explain" in different senses and, if so, which sense you will adopt for the rest of your answer and why.
  - Then adjudicate move by move, in order. For each of the seven moves, assign a grade from this fixed scale — RIGHT, MOSTLY RIGHT, MIXED, MOSTLY WRONG, WRONG — and justify it in three to six sentences, addressing the argument as actually made rather than a stronger or weaker reconstruction of it. Where a move contains two separable claims (several do), grade them separately and say so.
  - Then say what each of them is right about, what each is missing entirely, and whether the disagreement would survive complete agreement on the facts of 1914.
  - Give a separate, considered answer on move 7: is Nadia's retreat a genuine concession, or a legitimate weakening of a requirement that was always too strong? And is Owen's rejoinder — that an unstatable generalisation does no work — correct?
  - One short paragraph, no more: at work we write blameless postmortems after incidents, drilling down with repeated "why" questions until we reach something systemic. Some of us want the postmortem to terminate in a generalisable mechanism we can put a control around; others insist its value is narrative, because the sequence only makes sense as a sequence. Tell me whether that is the same fault line or a false analogy.
  - End by correcting my terminology wherever I have got it wrong.

  Presentation and constraints. Write throughout in British English. Give the grades first in a Markdown table with the columns Move, Speaker, Grade, One-line reason, and then the fuller justifications in prose. Do not provide a bibliography, a reading list, page references, or invented quotations: where you mention a position associated with a named philosopher, attribute it only if you are confident of it, and paraphrase rather than quote. Define any technical term briefly on first use, since I am not a specialist. If a move is genuinely hard to grade, say so and explain what makes it hard rather than forcing a verdict.

  Your final line must be exactly of the form `Verdict: X`, with nothing else on it, where X is one of NADIA, OWEN, or NEITHER. Choose the party who is more right overall about whether the chapter explained anything; choose NEITHER only if you think both frameworks fail, in which case say in the preceding paragraph what would have to succeed in their place.
