answer: |-
  ### I. Fixing the Game

  To apply backward induction, we must first impose a game structure on the historical record. This requires stipulations that simplify the record into a formal object.

  **1. The Players**
  *   **The Government (G):** For the purpose of a non-cooperative model, we must stipulate that the Federal Reserve, the Treasury, and the relevant legal authorities constitute a *single unitary player*.
      *   *Stipulation:* This ignores the internal game between the Fed and Treasury (who had different legal powers) and the constraint of the House of Representatives (which rejected the initial bill). We treat "Government" as having a single payoff function and a single set of legal powers.
      *   *Uncertainty:* The record notes officials offered two accounts for the Lehman decision: lack of legal authority vs. strategic choice. If the former is true, "Let Fail" was not a move available to G at that node; it was a terminal constraint. If the latter, it was a strategic choice. We must model it as a choice to test the induction, but flag that this may be a category error.
  *   **The Institutions (I₁, I₂, ... Iₙ):** Bear Stearns, Fannie/Freddie, Lehman, AIG, etc.
      *   *Status:* Are they players? In a standard Chain-Store game, entrants choose to enter or stay out. Here, the institutions are already in distress. It is more accurate to treat the *arrival of a crisis* as a move by Nature, and the Institution as the *stake* or the *source of payoff*, rather than a strategic player at the rescue node. However, their *ex-ante* risk-taking (moral hazard) is the strategic variable G is trying to influence. For the rescue sequence itself, they are best modeled as the sequence of nodes where G must act.
  *   **The Market:** The Market is not a player in the strict sense but the mechanism that determines payoffs. However, the run on the Reserve Primary Fund acts as a *signal* that updates G's beliefs about the payoff structure.

  **2. The Decision Nodes and Horizon**
  *   **Nodes:** Each node represents a specific institution reaching a point of failure where G must choose **Rescue (R)** or **Let Fail (L)**.
      *   Node 1: Bear Stearns (March)
      *   Node 2: Fannie/Freddie (Sept 7)
      *   Node 3: Lehman (Sept 15)
      *   Node 4: AIG (Sept 16)
      *   Node 5: Systemic Injection (Oct)
  *   **Horizon:** This is the critical stipulation. Backward induction requires a finite, known horizon ($T$).
      *   *Stipulation:* We must assign a fixed $T$ to run the induction.
      *   *Fact:* In reality, the horizon was unknown. G did not know in March how many institutions would fail, nor did they know in September if AIG was the last one.
      *   *Implication:* Without a known terminal node, there is no "last move" from which to reason back. To make the theory speak, we must stipulate that G *believed* there was a terminal node, even if they were mistaken about its location.

  **3. Payoffs**
  *   **G's Payoff:** A function of Systemic Stability minus Cost of Rescue minus Moral Hazard Cost.
      *   *Moral Hazard:* Future risk-taking by other institutions increases if G chooses R.
      *   *Systemic Stability:* Decreases sharply if G chooses L and contagion occurs.
  *   **Stipulation:** We assume these payoffs are common knowledge. The historical record suggests they were not; the cost of letting Lehman fail was revealed only *after* the choice was made (via the Money Market Fund run).

  ---

  ### II. Running the Induction

  We now apply the logic of backward induction to this fixed structure, specifically testing the Chain-Store analogy against the Centipede analogy.

  **1. The Chain-Store Logic**
  The situation resembles Selten's Chain-Store Paradox. G is the incumbent facing a sequence of potential "entrants" (crises).
  *   **The Logic:** If G chooses **L** (Fight), it incurs a short-term cost (instability) but builds a reputation for toughness, reducing the probability of future crises (deterring moral hazard). If G chooses **R** (Accommodate), it pays the rescue cost and signals weakness, inviting future crises.
  *   **Backward Induction Prediction:**
      *   At the *last* node ($T$), there is no future to deter. G will choose **R** to minimize immediate collapse costs.
      *   Knowing G will choose **R** at $T$, the institution at $T-1$ knows there is no reputational benefit to G fighting. G will choose **R** at $T-1$.
      *   Unraveling: G chooses **R** at every node.
  *   **Reputation Critique:** If there is a small probability that G is a "tough type" (committed to L regardless of payoff), G may choose **L** early in the sequence to mimic that type and deter later crises. This predicts **L** early, **R** late.

  **2. The Centipede Logic**
  Does the Centipede Game apply?
  *   **Structure:** The Centipede requires two players alternating moves, where each "pass" increases the total pot, but either player can "take" and end the game.
  *   **Fit:** This is the **wrong shape**.
      *   *Reason 1:* There is no alternating structure. G moves at every node. The institutions do not alternate taking the pot; they are the potential victims.
      *   *Reason 2:* There is no growing "pot" that is forfeited by stopping. In the Centipede, stopping early forfeits future gains. Here, choosing **L** (stopping the rescues) is intended to *gain* future discipline.
      *   *Missing Feature:* The case lacks the *alternating agency* and the *monotonic growth of joint value* conditional on continued cooperation. The 2008 sequence is a repeated ultimatum game, not a centipede.

  **3. Prediction vs. Structure**
  *   **Standard BI:** Predicts Rescue Always.
  *   **Reputation BI:** Predicts Fight Early, Rescue Late.
  *   **The Lehman Pivot:** The actual sequence was Rescue (Bear), Rescue (Fannie), **Fight (Lehman)**, Rescue (AIG).
  *   **Diagnosis:** The Fight occurred in the *middle*. In a finite horizon reputation model, fighting in the middle is only rational if the horizon is much further away than the market believes. If AIG was rescued 24 hours later, the horizon was effectively immediate. Fighting at Node 3 when the game ends at Node 4 is irrational under standard reputation models because there is insufficient time to recoup the reputational investment.

  ---

  ### III. Accounting for the Pattern

  The observed sequence is: **R, R, L, R, R**.
  The "Lehman Moment" (L) is sandwiched between Rescues, and the reversal (AIG) is almost immediate. This is the most damaging pattern for a strategic explanation.

  **1. Diagnosing the Failure**
  Which assumption of the backward induction model broke?
  *   **Not Rationality:** The actors were not behaving randomly; they were urgently optimizing.
  *   **Not the Horizon:** While the horizon was unknown, the immediate reversal suggests they realized the game was effectively *over* (systemic collapse was imminent) right after Lehman.
  *   **The Payoff Structure (Information):** This is the most defensible diagnosis.
      *   *Ex Ante:* At the Lehman node, G believed Payoff(L) > Payoff(R). They believed they could absorb the shock (perhaps relying on the "private sale" effort mentioned in the record).
      *   *Ex Post:* The run on the Reserve Primary Fund revealed new information. The payoff for Payoff(L) crashed instantly.
      *   *Conclusion:* This was not a strategic choice to build reputation; it was a **miscalculation of the game tree**. G thought they were playing a game where L was sustainable. The market reaction revealed they were playing a game where L was terminal catastrophe.

  **2. The AIG Reversal**
  *   **Reputational Critique:** If the Lehman decision was a reputational play (trying to establish a "No Rescue" norm), the AIG rescue destroys that reputation entirely. A rational player building reputation does not fold immediately after the first test.
  *   **Strategic Story:** The immediate reversal is evidence that **no strategic story was operative** regarding the Lehman refusal. If it were strategic, they would have held the line at AIG to maintain consistency.
  *   **Legal vs. Strategic:** The record notes officials claimed "lack of legal authority." If true, the node at Lehman was not a choice node for G, but a terminal node imposed by law. The AIG node had different collateral (insurance vs. investment bank), changing the legal constraint.
      *   *Implication:* If the move was constrained by law, backward induction does not apply to that node. You cannot reason backward from a move that was not freely chosen. This suggests the "paradox" is an artifact of modeling a legal constraint as a strategic preference.

  **3. The Pattern Summary**
  The pattern R, R, L, R, R is inconsistent with a fixed game of incomplete information where G is optimizing reputation. It is consistent with **Bayesian updating on the Payoff Function**.
  *   March/Sept 7: Belief = Contagion manageable without public money (or legal authority exists). Action = R.
  *   Sept 15: Belief = Private solution possible OR Legal authority missing. Action = L.
  *   Sept 16: New Information (Money Market Run). Belief = Contagion is systemic and immediate. Action = R.
  *   *Verdict:* The induction didn't fail; the *game* changed between Node 3 and Node 4.

  ---

  ### IV. Turning it Around: What the Episode Shows About the Paradox

  Does this episode refute backward induction, confirm it, or sidestep it?

  **1. Misestimated Terminal Nodes**
  The backward induction paradox relies on Common Knowledge of Rationality (CKR) and Common Knowledge of the Game (CKG).
  *   In 2008, CKR likely held (actors were trying to maximize survival).
  *   CKG **did not hold**. The players did not know the true connectivity of the financial network (the counterparty exposure).
  *   **Confirmation of Logic:** In a sense, this confirms the internal logic of BI. Once the Money Market Fund broke the buck, the "true" payoffs were revealed. Given *those* payoffs, the rational move was unequivocally Rescue. The "paradox" arises only if one assumes the players knew the payoffs at Node 3 that they only learned at Node 4.
  *   **Refutation of Application:** It refutes the application of BI to real-world crises where the *structure of interdependence* is discovered through play. BI assumes the tree is fixed. Here, the branches grew as the game was played.

  **2. The "Paradox" as an Epistemic Problem**
  The seminar paradox (why don't people play the BI solution?) is often answered by "bounded rationality" or "altruism." This case suggests a third answer: **Uncertainty about the Terminal Node.**
  *   If players are unsure whether the current node is the last node, the unraveling argument stalls.
  *   Lehman looked like a node where the government could stop (a "last node" for that specific firm). It turned out to be a penultimate node before systemic collapse.
  *   **Lesson:** The paradox dissolves if the horizon is stochastic. If there is a probability that "Let Fail" ends the game for *everyone* (systemic collapse) rather than just the current firm, the induction cannot start.

  **3. Strategic Ambiguity**
  The existence of two official accounts (Legal Authority vs. Strategic Choice) creates an **information set** for the market.
  *   If the market cannot distinguish between "Won't Rescue" (Strategy) and "Can't Rescue" (Constraint), the reputational signal is noisy.
  *   This noise prevents the clean unraveling of the Chain-Store logic. The market cannot update its priors on G's type cleanly because the move is not fully observable as a choice.

  ---

  ### V. Where the Theory is Silent

  Finally, we must mark the boundaries where non-cooperative game theory, specifically backward induction, cannot map onto the record without arbitrary stipulation.

  **1. Endogeneity of the Game Tree**
  *   **Theory:** Assumes the set of players, nodes, and payoffs is exogenous and fixed.
  *   **Record:** The "players" changed (Money Market Funds entered the game only after Lehman failed). The "payoffs" changed (the cost of collapse was unknown until tested). The "legal powers" were discovered in real-time (Fed's Section 13(3) authority interpretation).
  *   **Silence:** Standard BI has no machinery for a game where the rules are discovered by playing it.

  **2. Internal Coordination as a Black Box**
  *   **Theory:** Requires a unitary player G.
  *   **Record:** The Treasury, the Fed, and the New York Fed had different balance sheets, different legal mandates, and potentially different preferences. The House of Representatives voted down the TARP initially.
  *   **Silence:** Treating this as a single player hides the *internal* game that determined the move. The "Lehman Refusal" might have been a Nash equilibrium of an internal game between Treasury and Fed, not a move in the external game against the market. BI on the external game is silent on internal veto points.

  **3. Time and Speed**
  *   **Theory:** Moves are sequential and discrete.
  *   **Record:** The run on the Reserve Primary Fund happened "within two days." The AIG loan was extended the "same day."
  *   **Silence:** Continuous time runs and simultaneous moves (multiple banks failing at once) break the strict sequentiality required for BI. When the "nodes" collapse into a single moment of panic, the "backward" in backward induction has no time to operate.

  **4. The Nature of the "Threat"**
  *   **Theory:** A threat must be credible to be effective.
  *   **Record:** The Treasury Secretary told Lehman's CEO in the *spring* there would be no rescue.
  *   **Silence:** Why was this threat not credible until it was tested? Theory says if payoffs make the threat irrational, it shouldn't be believed. But the market *did* believe it enough to price Lehman down, yet not enough to prevent the panic. The theory struggles to model the *degree* of belief in a threat when the payoffs are unknown.

  **Summary for the Seminar:**
  The 2008 sequence is not a counter-example to the *logic* of backward induction, but a counter-example to the *applicability* of the fixed-game assumption. The "Paradox" in the classroom assumes we know the tree. The Lehman episode shows that in high-stakes environments, the tree itself is the object of discovery. The failure was not in reasoning back from the end; it was in not knowing where the end was, or what lay beyond it. The "Lehman Pivot" was not a strategic deviation; it was a Bayesian update on the structure of reality.
