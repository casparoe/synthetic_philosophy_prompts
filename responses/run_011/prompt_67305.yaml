answer: |-
  It is great to hear from you, and you have put your finger on exactly the right tension in the text. It is tempting for those of us working on vagueness to recruit Peirce as an ally who tells us that the demand for sharp boundaries is itself a philosophical error, but reading the 1878 paper that way requires some caution. You are right to sense that he is not simply championing conceptual blur, given that he dismisses mere familiarity as subjective and potentially mistaken. To answer your question directly, I do not think Peirce is attacking the requirement for precise definitions as such, but rather the logicians' account of what constitutes distinctness and the method by which that distinctness is achieved. He is objecting to the idea that distinctness consists in abstract definability divorced from practical consequences, not to the goal of intelligibility itself.

  If we sketch out the two readings you are considering, the first reading suggests Peirce is arguing that reality or our concepts of it are inherently continuous, and therefore any demand for a sharp definition is a category mistake. On this view, the Sorites paradox arises because logicians impose binary structures on a continuous world, and Peirce's critique is a warning against that imposition. This reading is attractive because it aligns with Peirce's later doctrine of synechism, the view that continuity is a fundamental feature of the universe, and his later technical work on vagueness where he argues that all signs are vague to some degree because they leave some interpretations undetermined. However, if you look closely at the passage you cited, this reading struggles to account for his explicit goal. He says the logicians have been slumbering and disregarding modern thought, and he proposes a better method for making ideas clear. If his point were simply that precision is impossible or undesirable, he would not be proposing a new method for achieving clarity; he would be advocating for a kind of comfortable ambiguity. He explicitly says that clearness resting on familiar use may be entirely mistaken, which implies there is a correct state of the idea to be reached, not just a relaxation of standards.

  The second reading, which I would defend, is that Peirce is objecting to the scholastic or rationalist method of securing distinctness through abstract definition rather than through empirical or practical grounding. When he says logicians understand the contents of an idea as whatever is contained in its definition, he is targeting a view where meaning is secured by relations between concepts rather than relations between concepts and experience. His objection is that you can have a definition that is formally precise but practically empty. For example, you can define a substance by its metaphysical essence with perfect logical distinctness, but if that essence has no conceivable practical bearing, the idea remains obscure in the only way that matters for inquiry. So, he is not against precision; he is against verbal precision that masks empirical indeterminacy. He wants concepts to be as precise as the practical consequences allow, but no more. This shifts the locus of boundary-drawing from the dictionary to the laboratory or the field of action.

  This distinction matters significantly for how you deploy this in your seminar on the Sorites. If you take the first reading, you might argue that Peirce thinks vague predicates are fine as they are and the paradox is a logical artifact. But if you take the second reading, which I think is more faithful to the 1878 text, Peirce is suggesting that the paradox arises because we are asking questions that lack practical bearings. The pragmatic maxim implies that if there is no practical difference between a heap of n grains and n-1 grains, then there is no conceptual difference either. This does not necessarily solve the Sorites by providing a sharp boundary, but it dissolves the force of the paradox by denying the significance of the distinction in borderline cases. It leaves us with concepts that are sharper regarding their practical effects but potentially vaguer regarding their metaphysical extensions. The boundaries are not sharp because the world is not always sharply divided, but we are not permitted to pretend there is a difference where there is no practical difference.

  However, you must be careful not to force the later Peirce onto this earlier text. In the 1878 paper, Peirce is still somewhat close to a verificationist position, whereas his mature theory of vagueness, developed in the early 1900s with his existential graphs and semiotic classifications, is much more robust. Later, he distinguishes vagueness from generality and argues that vagueness is a logical property of signs where the principle of excluded middle does not apply. In 1878, he is more concerned with clearing away metaphysical rubbish than with constructing a formal logic of vagueness. So while there is a genuine Peircean line to be pulled out of this passage, it is more about the grounds of meaning than the logical structure of vague predicates per se. The passage resists the reading that he is attacking precision as such because his entire project here is the improvement of logic and the fixation of belief. He wants to stop us from disputing over words and start us disputing over facts, and sometimes that means admitting that a distinction is meaningless rather than admitting that a boundary is fuzzy.

  So for your seminar, I would suggest you argue that Peirce is not defending vagueness as a virtue in this text, but rather redefining clarity in a way that makes certain sorts of Sorites-style questions illegitimate. He is attacking the logicians' account of distinctness because it allows for precise definitions of things that have no practical reality. This does not mean all predicates should be vague, but it means that where practical consequences converge continuously, our logic should not insist on bivalence. This is a subtle but crucial difference. You are not forcing a view onto the text if you say that Peirce thinks the demand for sharp boundaries is misplaced when those boundaries lack practical grounding, but you would be over-reading if you claimed he thinks all definitions should be inherently loose. He wants the precision of experience, not the precision of the dictionary. This aligns with his critique of the logicians slumbering through ages of intellectual activity; they were polishing definitions while ignoring the enginery of modern thought, which for Peirce means scientific inquiry and the fallible, continuous nature of investigation.

  In sum, do not present Peirce as saying vagueness is good and precision is bad. Present him as saying that precision without practical grounding is empty, and that many philosophical puzzles, including potentially the Sorites, stem from treating verbal distinctions as real distinctions. This allows you to use the passage to critique the assumptions underlying the Sorites without attributing to Peirce a laxity about concepts that he explicitly rejects in the very paragraphs surrounding your quote. He wants ideas clearer, not muddier, but he believes the path to clarity runs through practical consequences, not abstract definitions. This is the genuine Peircean line available to you, and it is strong enough to carry a seminar discussion without needing to lean on his later, more technical work on vagueness unless you wish to contextualize it as the seed of those later views.
