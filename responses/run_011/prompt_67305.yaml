prompt: |-
  hey, I'm an MA student in philosophy and I've got a seminar slot next week on vagueness and the sorites, and I've been reading Peirce's 1878 "How to Make Our Ideas Clear" to see whether he has anything usable to say about vague predicates. I keep geting stuck on this bit near the start:

  "A distinct idea is defined as one which contains nothing which is not clear. This is technical language; by the contents of an idea logicians understand whatever is contained in its definition. So that an idea is distinctly apprehended, according to them, when we can give a precise definition of it, in abstract terms. Here the professional logicians leave the subject; and I would not have troubled the reader with what they have to say, if it were not such a striking example of how they have been slumbering through ages of intellectual activity, listlessly disregarding the enginery of modern thought, and never dreaming of applying its lessons to the improvement of logic."

  My confusion is this. Is Peirce attacking the demand that our concepts have precise definitions as such? If he is, that feels like it could matter a lot for the sorites, something along the lines of "the mistake is the logicians' insistence on sharp boundaries, not the vagueness of the predicate." But I cant tell whether that's over-reading him, because just before this he says that clearness resting on familiar use only amounts to a subjective feeling of mastery which "may be entirely mistaken", and right after he says it's time to formulate a better method of making ideas clear. So he doesn't sound like a friend of conceptual blur either.

  Can you help me figure out what exactly he's objecting to here: the requirement of precise definition, or only the logicians' account of what distinctness consists in? And does the test he goes on to propose in its place leave us with concepts that have sharper boundaries than the logicians wanted, or vaguer ones? Basically I want to know whether there's a genuine Peircean line about vagueness to be pulled out of this passage, or whether I'm forcing it onto a text that's doing something else entirely.

  Please answer as a Peirce scholar who also works on vagueness, and think it through carefully rather than giving me the standard summary — sketch the two readings, say which you'd defend and why, and tell me where the passage resists the reading you like less. No headings, bullet points, bold or tables, just continuous prose, the way you'd write an email to someone.
