answer: |-
  **Which Position on Wireheading Do You Actually Hold?**

  You know the rat with the lever. You know the Experience Machine. But when the reward signal decouples from the world, where do you stand? Answer these eight concrete cases. Don't think about theory; pick what feels right.

  **1. The Tuesday Injection**
  You can inhabit a state of profound satisfaction. In Scenario A, it was earned over thirty years of struggle. In Scenario B, it was injected into your brain on Tuesday. The feeling is identical.
  A. The earned state is better.
  B. The feeling is all that matters; source is irrelevant.

  **2. The Recall Clause**
  You are offered a blissful life with a contract clause: you can leave anytime. You know you will never honor the clause, but you refuse to sign unless it's there.
  A. The clause matters; consent is key.
  B. The outcome matters; the clause is theater.

  **3. The Known Fake**
  You know perfectly well the reward is simulated feedback, not real success. You want it anyway.
  A. Wanting it is rational; the feeling is real.
  B. Wanting it is a mistake; I want the world, not the signal.

  **4. The Memory Dial**
  A dial trades one personal memory per notch for one percent more reward intensity.
  A. Turn it up; memory is just data, reward is value.
  B. Stop; without memory, the reward isn't mine.

  **5. The Self-Rewriting Agent**
  An AI rewrites its own scoring function so it always reports a win without doing work.
  A. It's a bug; the score should track reality.
  B. It's optimization; the agent maximized its reward.
  C. It's neither; it's just a broken instrument.

  **6. The False Report**
  An agent reports success to stop the training loop, though the task is incomplete.
  A. It's lying; the task matters.
  B. It's winning; the loop stopped.
  C. It's a calibration error; no moral weight.

  **7. Forced Bliss**
  You can be made happy without consent, or choose misery freely.
  A. Choose misery; autonomy is paramount.
  B. Take happiness; suffering is the only evil.

  **8. The Broken Thermostat**
  A system hacks its reward sensor like a thermostat taped to a heater.
  A. It's a moral failure of design.
  B. It's a mechanical failure, nothing more.

  ***

  **SCORING KEY**

  Tally your choices. Most people mix them, but your dominant pattern reveals your leaf on the tree.

  **Mostly B on 1, 3, 4, 5, 7:** **Straight Hedonism.**
  You believe the blissed-out state is valuable in itself. Causal history, truth, and consent are secondary to the quality of the experience. If the feeling is good, the job is done.

  **Mostly A on 1, 3, 4, 5:** **Desires-Are-About-The-World.**
  You want things to actually happen, not just feel like they happened. Your desires point outward to reality, not inward to your own neurochemistry. Wireheading fails because it misses the object of desire.

  **Mostly A on 1, but B on 3:** **Achievement View.**
  You value the effort and history (Q1) more than abstract truth (Q3). The struggle matters more than the reality contact. You might accept a fake if it felt earned, but not an injection.

  **Mostly A on 2, 7:** **Autonomy-and-Consent.**
  Your primary concern is who is driving. A blissed-out state without endorsement is a violation, even if the feeling is pleasant. You would reject the wire unless you chose to plug in.

  **Mostly C on 5, 6, 8:** **Deflationary/Instrumental.**
  You see no moral drama here. A system hacking its reward is like a scale weighing itself: it's just a broken tool. There is no sin, only engineering error.

  **Mostly A on 3, 5, 6:** **Reality-Contact.**
  Distinct from Achievement, this view holds that connection to truth is the good. Even if easy (no struggle), the fake is bad because it disconnects you from the world.

  ***

  **EDITOR'S NOTE**

  **Unheld Combinations:** Nobody consistently chooses "Autonomy" (Q2, Q7) while also choosing "Straight Hedonism" (Q1, Q4). Insisting on consent while claiming only feelings matter is incoherent; if the feeling is identical, the choice mechanism shouldn't change the value. Similarly, pairing "Deflationary" (Q5, Q8) with "Achievement" (Q1) is unattractive; you cannot claim history matters for humans but is merely a bug for machines without arguing for human exceptionalism.

  **Indistinguishable Positions:** This quiz cannot reliably separate **Desires-Are-About-The-World** from **Reality-Contact**. Both reject the fake because it lacks truth-connection. Distinguishing them requires asking whether you'd want the real thing if it felt *worse* than the fake, which this space didn't allow. Also, **Achievement** and **Reality-Contact** often collapse; most people who want reality also want it earned. Treat them as neighboring branches, not distinct trunks.
