prompt: |-
  ok so my flatmate is a transplant coordinator and we went at this untill like 3am last night and I've given up arguing, I just want the document that should have come out of it.

  Topic: what counts as death when you can keep the heart and lungs going mechanically. Her position: death is a biological event, the irreversible loss of the integrated functioning of the organism as a whole, which in practice means destruction of the entire brain including the brainstem; neurological criteria detect that event rather than redefining it; and the dead donor rule is not up for negotiation. Mine: what dies is the person, meaning irreversible loss of the capacity for consciousness, so someone in permanent vegetative state is already dead, and the whole-brain line is arbitary anyway — the British run a brainstem-only standard while the Americans require the whole brain, so the identical body is dead in one country and alive in the other.

  The stuff I threw at her that she couldn't quite absorb, and which I want treated as real cruxes rather than as me being annoying:

  - bodies declared brain dead that go on to heal wounds, fight infection, regulate temperature and hormones, grow, and — pretty sure this has happened more than once — carry a pregnancy to a live delivery weeks or months later. If that is an organism functioning as a whole, what did the criterion actually say we lost?
  - circulatory-death donation. There you declare death after a few minutes of stopped circulation on the grounds that circulation *won't* be restarted, not that it *can't* be. So permanence is already doing the work "irreversibility" is supposed to do. Does that concession generalise to the neurological side? If yes her position is much weaker than she admits; if no, why not, precisely?
  - whether the dead donor rule carries any independent moral weight or is a bright line we keep because it protects consent and public trust.

  What I want: a joint statement both of us could put our names to. First a numbered section of claims we can both genuinely sign — about the physiology, about what the reflex and apnea testing shows, about what a legal declaration of death actually does. Then a disagreements table: issue, her wording of her own view, my wording of mine, each phrased so its own side would accept it, no strawmanning. Then the cruxes, and for each one the case or evidence we'd both agree bears on it plus each side's prediction written down in advance. If part of the fight is just verbal — over "irreversible" or over "organism" — say which part and why.

  Don't fudge it into both-sides-have-a-point. Commit to which crux you think is load-bearing. Then tell me where you're most likely to be wrong: which of the agreed claims she would in fact refuse to sign, which of my three cruxes is bogus, and what argument or piece of evidence would make you change your assessment of which disagreement is the real one.
