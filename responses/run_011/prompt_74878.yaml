      *   **The Hypothetical Case:** A first novel by a Black woman (20s), formally dazzling, unsentimental, neighborhood setting, violence/addiction/sex, no redemption, no institutional villain (harm internal), white publisher/marketing (sold as "raw/authentic" to whites), author refuses spokesperson role, no political argument. *However*, wildly popular with Black teens in that neighborhood, cited by a city councilmember on policing.
