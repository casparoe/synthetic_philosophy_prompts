          5.  Assessment of underdetermination (if applicable).
          6.  Flagging any item in the provided list that sits oddly with the rest.
      *   **User's Hunch:** One candidate rule is about control of production/who is in the room, not content.
      *   **Tone:** Academic, analytical, direct, helpful for a seminar leader.

  2.  **Deconstruct the Seven Record Points:**
      1.  *The Star of Ethiopia* (Pageant): Endorsed. Grand historical narrative, racial pride, educational/propagandistic value (in the positive sense), communal spectacle.
      2.  *Home to Harlem* (McKay): Rejected/Criticized. "Rawness" loved by whites, seen as pandering to prurient white gaze, lack of moral uplift.
      3.  "The Negro Speaks of Rivers" (Hughes): Endorsed. Mythic, lyrical, not obviously agitational, connected to deep history.
      4.  Countee Cullen ("Negro Poet" label): Rejected the wish to be *just* a poet. Art is inevitably racialized/political in context.
      5.  Black Theater Criteria: Endorsed conditions. Black life, Black writers, *Black audiences*, Black neighborhoods. (Crucial: Audience/Location).
      6.  *Dark Princess* (Du Bois's novel): Endorsed. Political romance, utopian, not realistic. (Shows he accepts non-realism if the politics/vision align).
