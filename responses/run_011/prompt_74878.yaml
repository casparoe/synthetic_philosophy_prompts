answer: |-
  This is a sharp exercise. It forces students to move beyond the soundbite ("All Art is Propaganda") and grapple with the tensions in Du Bois's critical practice. Your hunch is correct: the material conditions of production are doing heavy lifting in his judgments, often more than the text itself.

  Here is the breakdown for your capstone session.

  ### 1. Candidate Rules Derived from the Record

  Based on the seven points provided, three competing principles emerge. Each fits the historical record reasonably well but prioritizes different evidence.

  *   **Rule A: The Dignity/Propaganda Principle.**
      *   *Derivation:* The Pageant (1), *Dark Princess* (6), Critique of McKay (2), Critique of Cullen (4).
      *   *Logic:* Art must actively counteract racist stereotypes and advance the political standing of the race. It need not be realistic (*Dark Princess*), but it must not feed the white gaze's appetite for "rawness" or pathology (McKay). The artist cannot opt out of racial identity (Cullen).
  *   **Rule B: The Autonomy/Infrastructure Principle.**
      *   *Derivation:* Black Theater Criteria (5), Critique of McKay (2), *The Crisis* editorial control (implied in 3 & 4).
      *   *Logic:* Art is judged by who controls its production and circulation. Black art must be written by Black people (5), but crucially, it must be staged/published for Black audiences in Black spaces (5) rather than sold by white houses to white consumers as "authentic" spectacle (2).
  *   **Rule C: The Communal Function Principle.**
      *   *Derivation:* Hughes's "Rivers" (3), *Souls of Black Folk* (7), Black Theater Criteria (5).
      *   *Logic:* Art is validated by its utility and resonance within the Black community, regardless of explicit political argument. Hughes's poem wasn't agitational but connected to deep history; the Theater must be *for* Black audiences. If the community claims the work, it has value.

  ### 2. Application to the New Case

  **The Case:** Black woman's debut, raw content (violence/addiction), white publisher marketing ("authentic"), author refuses politics. *But:* Black teens love it, City Council cites it.

  *   **Rule A (Dignity/Propaganda) predicts: REJECT.**
      *   *Reasoning:* The "no institutional villain" clause is fatal. By locating harm solely among characters without structural context, the book risks reinforcing pathology narratives. The author's refusal of the spokesperson role mirrors the Cullen error (denying the racial burden).
  *   **Rule B (Autonomy/Infrastructure) predicts: REJECT.**
      *   *Reasoning:* This is the McKay scenario redux. A white-owned house selling Black pain to white readers as "raw" is the definition of exploitation Du Bois fought against. It violates the Theater Criteria (sited in Black neighborhoods/controlled by Black people).
  *   **Rule C (Communal Function) predicts: ENDORSE.**
      *   *Reasoning:* The Black teenagers trading lines and the Councilmember using it for policy prove the work *is* functioning politically within the community, regardless of the author's intent or the publisher's marketing. It meets the "for Black audiences" criterion of the Theater rules, even if it fails the "sited in" criterion.

  ### 3. Best Guess and Rationale

  **Verdict: Endorse on Conditions (Leaning toward Reject).**

  **Reasons:**
  1.  **The McKay Precedent:** Du Bois's critique of *Home to Harlem* is the closest analog. He acknowledged McKay's talent but condemned the book's effect. He would likely acknowledge this author's "formal dazzle" while condemning the publication context.
  2.  **The "No Institutional Villain" Problem:** This is the sticking point. Du Bois's sociology insists on the Veil and systemic oppression. A narrative that distributes harm solely internally without structural critique is, to him, sociologically false. He would view this as a failure of *truth*, not just politics.
  3.  **Your Hunch is Key:** The production context (white house, white marketing) is likely the dealbreaker. Du Bois believed that when white capital controls Black representation, the representation is inevitably distorted for profit.
  4.  **The Save:** He would not ban it. He would argue that the *text* is being held hostage by the *trade*. He might endorse a Black press reprinting that reframes the work, separating the art from the exploitation.

  ### 4. The Separator Case

  To cleanly separate **Rule B (Autonomy/Production)** from **Rule A (Dignity/Content)**, present this hypothetical:

  > A historically accurate, heroic drama about the Haitian Revolution, written by a Black collective, but funded and distributed exclusively by a white supremacist organization to prove "Black people need white guidance to achieve civilization." The Black community has no access to see it.

  *   **Rule A (Content):** Might **Endorse** (The content is heroic and counters stereotypes).
  *   **Rule B (Production):** Must **Reject** (The control is hostile, the audience is excluded, the infrastructure is weaponized).

  *If Du Bois rejects this, Rule B is dominant. If he endorses it because "the truth shines through," Rule A is dominant.* (Historical consensus suggests he would Reject, confirming your hunch about production control).

  ### 5. Assessment of Underdetermination

  **The record genuinely underdetermines the verdict.**

  You are asking students to synthesize a consistent aesthetic theory from a critic who changed his mind over 30 years (from *Souls* in 1903 to *Dark Princess* in 1928).
  *   **If they side with 1903 Du Bois:** He might be more flexible on form (lyricism in *Souls*) but rigid on the color line.
  *   **If they side with 1928 Du Bois:** He is more rigid on "Propaganda" (the *Crisis* symposium era) but more experimental in his own fiction (*Dark Princess*).

  **Commitments:**
  *   **To Endorse:** He commits to the idea that the Black community's reception overrides the white marketplace's exploitation. He admits that "raw" truth has value even without a redemptive frame, provided Black people claim it.
  *   **To Reject:** He commits to paternalism. He asserts that he knows what is good for the Black teenagers better than they do, and that structural critique is mandatory in fiction, even if real life feels chaotic.

  ### 6. Flagging the Odd Item

  **Item 6 (*Dark Princess*) sits oddly with the rest.**

  *   **Why:** It is the only item where Du Bois is judging **his own work**.
  *   **The Risk:** In a seminar, this introduces a bias variable. He stands by *Dark Princess* as "serious work" despite its utopian/romantic elements, whereas he critiques McKay for similar deviations from realism (though McKay was naturalist, Du Bois was romantic).
  *   **The Conflict:** It complicates the "Propaganda" rule. *Dark Princess* is propaganda, but it is also a romance novel. If he uses a double standard (my romance is visionary; your realism is pandering), it weakens the objective criteria the students are trying to build.
  *   **Alternative Flag:** **Item 3 (Hughes).** It is the only instance where he explicitly endorses work that "isn't agitational in any obvious sense." This contradicts the hardline "All Art is Propaganda" reading often derived from Items 1, 2, and 4. It suggests a spiritual/aesthetic lane that the other items obscure.

  **Recommendation:** Flag **Item 6**. It's methodologically unsound to include the critic's self-evaluation in a dataset used to determine their critical principles. It invites students to psychoanalyze Du Bois rather than analyze his criteria.
