      *   6. *Dark Princess* (Romance/Utopian) - **Odd One Out?** It's a novel by him, political but unrealistic. It fits his "Propaganda" view, but it's a *romance*.
      *   7. *Souls* (Mixed Genre) - Consistent.
      *   *Wait, look at Item 6 vs Item 2.* He criticized McKay for realism that looked "low." He wrote *Dark Princess* which is high-flown romance. That's not odd, that's just taste.
      *   *Look at Item 3 (Hughes).* "It isn't agitational in any obvious sense." This is the outlier regarding the "All Art is Propaganda" maxim. It suggests he allowed for pure aesthetic connection to history without immediate political utility.
      *   *Look at Item 5 (Theater Criteria).* This is the strongest support for the User's Hunch (Production/Control).
      *   *Which sits oddly?* **Item 6 (*Dark Princess*).** Why? Because it's *his* work. Self-judgment is always suspect in compiling a critical record. Also, it was not commercially successful and is often seen as less "serious" than *Souls* or *Quest*. But in the context of *aesthetics*, it proves he accepts non-realism.
      *   *Better Candidate for Odd Item:* **Item 3 (Hughes).** Du Bois's support for Hughes is often cited as an exception to his rigid propaganda rule. "The Negro Speaks of Rivers" has no explicit political argument. If the rule is "Art must be propaganda," Hughes shouldn't fit. If the rule is "Art must connect to racial soul," he fits. It depends on how you define propaganda.
      *   *Actually, the strongest tension is between Item 2 (McKay) and Item 5 (Theater).* Item 2 is about content/morality. Item 5 is about infrastructure.
      *   *Let's flag Item 6.* It's the only one where he is judging himself. It introduces bias. Or Item 3, because it contradicts the "agitational" requirement implied in the McKay critique.
      *   *Decision:* Flag **Item 3 (Hughes)**. It's the weakest link for a "Propaganda" rule. It supports an "Aesthetic/Spiritual" rule.

