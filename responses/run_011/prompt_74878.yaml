      *   *Actually, looking at the Hughes case:* Hughes wasn't agitational. Du Bois liked it. Why? It connected to heritage. The new book connects to *current* reality.
      *   *Let's lean into the User's Hunch.* It's the most insightful part of the prompt. The "Black Theater" criteria are structural.
      *   *Verdict:* **Endorse on Conditions.** He would validate the *use* (teens/council) but condemn the *venue* (white house). He'd call for a Black press edition.

      *Re-evaluating based on Du Bois's actual rigidity:* Du Bois was often harsh. The "no institutional villain" point is key. Du Bois believes the "Veil" and systemic racism are the root causes. A book that ignores this is, to him, factually incorrect about the human condition of Black folks.
      *   *Revised Best Guess:* **Reject.** The content (no structural critique) + Context (white exploitation) outweighs the Reception (teens). He trusted his intellectual judgment over popular taste (see McKay critique).

  6.  **Develop the "Separator" Case:**
      *   Need to separate **Rule: Content/Politics** vs. **Rule: Production/Control**.
      *   *Case:* A book with perfect Propaganda/Uplift content (heroic Black history), BUT published by a white house that markets it as "exotic primitive art."
      *   *If Production Rule wins:* Reject (wrong control/marketing).
      *   *If Content Rule wins:* Endorse (message is right).

  7.  **Address Underdetermination:**
      *   Is the record underdetermined? Yes. Du Bois evolved. *Dark Princess* (1928) is later than *Home to Harlem* (1928) critique? Actually same year. *Souls* (1903) is much earlier.
