      *   *Decision:* Du Bois likely **Rejects** or **Endorses on Strict Conditions**. Why? Because the white marketing ("raw and authentic") recapitulates the *Home to Harlem* problem. The Black reception is good, but Du Bois was often elitist/paternalistic about what the masses *should* like vs. what they *do* like. He might acknowledge the popularity but condemn the exploitation.
