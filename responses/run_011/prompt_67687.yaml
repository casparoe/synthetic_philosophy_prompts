      *   *Reflexivity:* If Falsificationism says "reject what is falsified," did Popper's view on NS get falsified? No, empirical data didn't falsify his philosophy. *Expert testimony* corrected a factual error in his application. This suggests the Demarcation Criterion is a *proposal* or *convention*, not an empirical hypothesis. If it were empirical, biologists saying "you're wrong" wouldn't falsify the *criterion*, only Popper's *use* of it.
      *   *Rationality:* Popper's philosophy demands we learn from mistakes. Retracting is the ultimate Popperian move. It validates the *spirit* of falsificationism even if it highlights a flaw in the *application*.
      *   *Silence:* Falsificationism doesn't explain *why* he held the view for 40 years. It doesn't account for the sociology of philosophy.
