answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name]. Ray was my uncle.

  For forty years, Ray was the man behind the counter at the hardware store. He was the one who knew which nail held the weight and which one bent. He was the man who fixed the screen door, who remembered your father's name, who came home to the same chair every night. To us, to this town, he was solid. He was here.

  We all know now that there was more to him than we saw. We found the letters. We found the book. We know that while he was measuring paint for some of us, he was measuring words for others.

  I know this has been hard. It can feel like the ground has shifted. When you love someone, you want to know the shape of them. To find out there was a hidden dimension can feel like losing the man you knew. Some might say there were two Rays: the husband and uncle who lived here, and the poet who lived in those pages.

  But I stand here to say there was only one man.

  Think of a name like a hand reaching out. For forty years, one chain of people—his family, his neighbors, his customers—reached out and called him Ray. He took that hand. He held it. At the same time, in another place, another chain of people reached out and called him by the name on the book. He took that hand, too.

  Two different groups, passing along two different names, converging on the same heart.

  To my aunt: The love you shared was not a mistake. The breakfasts, the holidays, the quiet years—they were not a cover story. They were his life. The poet did not replace the husband. The man who wrote the verses is the same man who wiped his boots before coming inside. You are not mourning a stranger. You are mourning the whole of him, even the parts that were kept in the drawer.

  To his editor, who is here today: You saw the mind. We saw the hands. Both made the man. You are welcome here, because the work you loved came from the same soul that loved us.

  It is tempting to think that because we didn't know everything, we didn't know him. But knowing a person isn't about seeing every room in the house. It's about knowing the foundation is solid. Ray kept some rooms private. That doesn't mean the house wasn't one home.

  We are gathered here to lay one man to rest. Not a collection of fragments. Not a puzzle we have to solve. Just Ray.

  The grief we feel runs down whichever chain we were standing in. Some of us are crying for the uncle. Some are crying for the poet. But the tears fall on the same grave.

  He was one life. One story. And now, he is one memory.

  Let us honor him not by trying to separate the ink from the hardware, but by acknowledging that he was strong enough to hold both. He was the man who built things, and the man who wrote about them. He was whole.

  Rest well, Ray. We have you now. All of you.
