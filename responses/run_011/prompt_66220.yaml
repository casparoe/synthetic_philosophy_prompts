answer: |-
  There is no single, canonical term in the philosophical lexicon that names this specific dialectical migration. However, your observation is astute and identifies a structural feature of contemporary normative ethics, particularly in the formalized subfields (population ethics, distributive justice, decision theory).

  The closest established framework for analyzing this is **Imre Lakatos's methodology of scientific research programmes**, specifically the distinction between a **progressive** and a **degenerating problem shift**. In meta-ethics, this is often discussed informally under the headings of **"theoretical costs,"** **"independent motivation,"** or **"reflective equilibrium adjustments."**

  For your purposes, I propose we label this phenomenon **"Objection-Driven Parameterization"** (or, more critically, **"Immunizing Parameterization"**).

  Below is an account of what this phenomenon consists in, how it differs from the fallacies you mentioned, and an evaluation of whether it represents a defect or a normal stage of theorizing.

  ---

  ### 1. The Phenomenon: Objection-Driven Parameterization

  This occurs when a theory $T$ faces a counter-intuitive implication $O$ (e.g., Leveling Down, Repugnant Conclusion). To avoid $O$, $T$ is modified to $T'$, where $T'$ introduces a new variable, function, or threshold $\phi$ (e.g., a concave weighting function, a critical level).

  The dialectical migration happens as follows:
  1.  **Phase 1 (The Intuitive Clash):** The debate centers on whether $O$ is truly objectionable. (e.g., "Is equality valuable even if it makes people worse off?")
  2.  **Phase 2 (The Formal Fix):** The theorist introduces $\phi$ to mathematically or logically block $O$.
  3.  **Phase 3 (The Migration):** The debate shifts to the justification of $\phi$. The original objection $O$ is considered "solved," but the normative burden has not disappeared; it has transferred to $\phi$. (e.g., "Why *this* concave function and not another?")

  The "migration" you detect is the displacement of the normative burden from the *output* of the theory (the verdict on cases) to the *inputs* of the theory (the parameters).

  ### 2. Distinctions from Related Concepts

  You correctly noted that this resembles several fallacies but is not identical to them. Here is the boundary work:

  **A. Moving the Goalposts**
  *   **Definition:** Unfairly changing the criteria for success during an argument to ensure victory.
  *   **Difference:** Moving the goalposts implies bad faith or a refusal to concede. Objection-Driven Parameterization is often done in good faith as a form of **theoretical refinement**. The theorist admits the original formulation was too coarse. The defect arises only if the new parameter is changed *again* every time a new objection arises, without ever settling.
  *   **Boundary:** It becomes "moving the goalposts" if the parameter $\phi$ is adjusted *ad infinitum* to block every new counter-example without independent justification.

  **B. Motte-and-Bailey**
  *   **Definition:** Equivocating between a defensible but boring claim (the motte) and a controversial but desired claim (the bailey).
  *   **Difference:** Motte-and-Bailey relies on *ambiguity* in language. Parameterization relies on *precision* in formalism. The prioritarian is not equivocating; they are explicitly stating, "My view is not egalitarianism; it is this weighted sum." The migration is not a retreat to a safer claim, but a shift to a more complex one.
  *   **Boundary:** It becomes Motte-and-Bailey if the theorist claims the parameter $\phi$ is "just what egalitarianism meant all along" to dodge the leveling-down objection, while privately relying on the technical differences to avoid the objection.

  **C. Ad Hoc Auxiliary Hypothesis**
  *   **Definition:** Adding a hypothesis solely to save a theory from falsification, with no independent evidence.
  *   **Difference:** This is the closest match. In philosophy, "falsification" is replaced by "counter-intuitive implication." However, "ad hoc" is a pejorative verdict. Objection-Driven Parameterization is the *structural description* of the move; "ad hoc" is the *evaluation* of it.
  *   **Boundary:** The move is **ad hoc** if $\phi$ is justified *only* by its ability to block $O$. It is **not ad hoc** if $\phi$ is independently motivated (e.g., the concave function is justified by analogies to risk aversion in decision theory, not just by avoiding leveling down).

  **D. Merely Verbal Dispute**
  *   **Definition:** Disagreement that stems from different definitions rather than substantive facts.
  *   **Difference:** The dispute over the parameter is substantive. Asking "Why a square-root function rather than a logarithmic one?" is a question about the *rate* of moral urgency, not the definition of words.
  *   **Boundary:** It becomes verbal if both sides agree on all case verdicts but argue over whether the view is "really" prioritarian or "really" egalitarian.

  ### 3. Is this a Defect or a Normal Stage?

  This is the crux of your dissertation work. The answer depends on whether the research programme is **progressive** or **degenerating** (to borrow Lakatos's terms).

  #### It is a Normal (and Necessary) Stage if:
  1.  **Independent Motivation Exists:** The parameter $\phi$ connects to other theoretical virtues or domains.
      *   *Example:* If the prioritarian weighting function is justified not just by avoiding leveling down, but by its structural similarity to **risk-aversion in individual decision-making** (the "Priority View" as analogous to expected utility), the parameterization is progressive. It unifies distinct ethical phenomena.
      *   *Example:* If the critical level in population ethics is derived from a substantive account of **what makes a life worth starting** (e.g., a threshold of autonomy or happiness), rather than just "the number that blocks the Repugnant Conclusion."
  2.  **Novel Predictions Emerge:** The modified theory $T'$ generates new, non-obvious verdicts that are intuitively plausible, beyond just solving $O$.
  3.  **Systematicity:** The parameter reduces the overall complexity of the theory by replacing a list of case-by-case intuitions with a single generating function.

  #### It is a Defect (Degenerating Shift) if:
  1.  **The Parameter is Free-Floating:** The value of $\phi$ is chosen *solely* to make the theory output the "right" answer on the specific objection $O$.
      *   *Critique:* "You picked the critical level at 50 utils exactly because that's where the Repugnant Conclusion starts. If the math changed, you'd move the level."
  2.  **Proliferation of Parameters:** Every new objection requires a new parameter. (e.g., A critical level to block the Repugnant Conclusion, *plus* a variable discount rate to block the Sadistic Conclusion, *plus* a ceiling to block the Very Repugnant Conclusion). This suggests the "hard core" of the theory is unable to handle the data without constant patching.
  3.  **Loss of Explanatory Power:** The theory tells us *that* a distribution is right (because it fits the function), but loses the ability to explain *why* in terms accessible to moral reasoning. The parameter becomes a "black box" that swallows the intuition.

  ### 4. Strategic Advice for Your Work

  Since you are working on prioritarianism, you can use this analysis to structure your contribution.

  1.  **Name the Move:** In your text, you can define **"Objection-Driven Parameterization"** as the shift from debating intuitive verdicts to debating the justification of structural parameters.
  2.  **Diagnose the Literature:** Show where the literature is stuck in Phase 3. Point out that proponents of prioritarianism often treat the avoidance of Leveling Down as a *triumph*, while critics treat the arbitrariness of the weighting function as a *failure*. Both are talking past each other because the crux has migrated.
  3.  **Evaluate the Parameter:** Don't just ask "Does this avoid Leveling Down?" Ask: **"Is the concave function independently motivated?"**
      *   If the prioritarian says, "We use this function because it avoids Leveling Down," charge them with **degenerating problem shift** (ad hoc).
      *   If they say, "We use this function because it models the moral significance of urgency, analogous to risk," argue that this is a **progressive problem shift**.
  4.  **The "Cost" Argument:** Frame the debate as a trade-off of theoretical costs. Egalitarianism pays the cost of Leveling Down. Prioritarianism pays the cost of Parameter Arbitrariness. Your job is to determine which cost is theoretically cheaper.

  ### Summary
  There is no single word for this, but it is best understood as a **Lakatosian adjustment to the protective belt**. It is not inherently fallacious; it is the standard mechanism by which informal moral intuitions are formalized into rigorous theories. It becomes defective only when the parameters lack independent motivation, turning the theory into a machine designed solely to output pre-selected intuitions rather than to explain them.

  In your writing, I recommend using the term **"Objection-Driven Parameterization"** to describe the structure, and **"Independent Motivation"** as the criterion for judging whether the move is successful.
