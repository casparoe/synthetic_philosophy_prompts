answer: |-
  ### Part 1: Validation of Your Summary

  Your summary of the Unilateralist's Curse is **correct in spirit and mechanism**, but requires one operational tweak for your context.

  1.  **The Mechanism:** You are right. If $N$ actors can veto, and action requires unanimity, you get inaction bias. If action requires only one "yes" (your situation), you get action bias driven by the noisiest optimist.
  2.  **The Independence Assumption:** You correctly spotted the flaw in the standard model. In your sector, estimates are **correlated**. We read the same reports; we hire from the same pool.
      *   *Does this shrink the correction?* No. It makes it more dangerous. If your error is random, someone else might catch it. If your error is *shared* (systemic bias), everyone is wrong in the same direction. If you act on a shared bias, you validate the error for the whole sector.
      *   *Operational implication:* Shared background means you must treat "silent peers" not as "they haven't looked," but as "they looked and chose not to act." Their inaction is data.
  3.  **The Field Director's Objection:** He is half-right. If you are truly the *only* actor with capacity ($N=1$), the statistical curse vanishes because there is no pool of estimates to select the maximum from.
      *   *The Catch:* You are rarely $N=1$ forever. You are $N=1$ *now*, but if you set a precedent, you invite $N=20$ later. The curse applies to **norm-setting**, not just immediate output.
  4.  **Inaction as Action:** Correct. In humanitarian contexts, the status quo is often "people suffer." The procedure must treat "maintaining status quo" as a decision that requires justification if the cost of waiting is high.

  ---

  ### Part 2: The Decision Procedure ("The Unilateralist's Filter")

  **Time required:** 30 minutes (leaves 15 for discussion).
  **Tools:** Whiteboard, your internal decision log (last 40 cases).
  **Roles:** Chair (you), Scribe (rotates), Committee (4 people).

  #### Step 1: Define the "Change" and the "Counterfactual" (5 mins)
  *Question:* "What specifically changes if we say Yes? What specifically happens if we say No?"
  *   **Sufficient Answer:** A concrete description of the new state (e.g., "Report is public," "New method used in District X") vs. the status quo ("Report private," "Standard method used").
  *   **Stop Point:** If the committee cannot agree on what the "No" scenario looks like (e.g., "If we don't do it, will someone else?"), **STOP**. You cannot assess risk without a baseline. Assign one person to find out within 24 hours.
  *   **Inaction Check:** If the "No" scenario involves predictable harm (e.g., cholera deaths), mark this case as **"High Cost of Delay."** This reduces the burden of proof required in Step 4.

  #### Step 2: Count the Capable (The "N" Check) (5 mins)
  *Question:* "Who else *could* do this, not just who *is* doing this?"
  *   **Instruction:** Do not count the whole consortium (20 orgs). Count the orgs with the **capacity and mandate** to do this specific thing within the decision window.
  *   **Whiteboard Math:** Write down the number. Call it **$N_{cap}$**.
      *   *Case:* Publishing a report? $N_{cap}$ = Orgs with the data.
      *   *Case:* Cholera response? $N_{cap}$ = Orgs with cold chain + access.
      *   *Case:* Data handover? $N_{cap}$ = Orgs with the specific datasets.
  *   **The Field Director's Override:** If $N_{cap} = 1$ (only us), acknowledge he is right about the *statistical* curse. **However**, add a **"Precedent Flag."** If doing this alone would make it easier for low-capacity actors to do it later (lowering the barrier), treat $N_{cap}$ as **5** for the next step. (This accounts for norm-setting risk).

  #### Step 3: Assess Peer Silence (The Correlation Check) (5 mins)
  *Question:* "Of the $N_{cap}$ peers, how many know about this issue and have *not* acted?"
  *   **Instruction:** This addresses the shared bias. If peers know and sat on it, they likely have a negative estimate we haven't seen.
  *   **Whiteboard Math:** Write down the number. Call it **$N_{silent}$**.
  *   **The Adjustment:**
      *   If $N_{silent} = 0$ (nobody else knows): Proceed to Step 4.
      *   If $N_{silent} > 0$: You must assume they know something you don't, OR they value sector stability over this specific gain.
      *   **Rule:** If $N_{silent} \geq 2$, you cannot proceed to "Yes" without attempting coordination (even a 48-hour delay to call them). **STOP** and draft a coordination memo.

  #### Step 4: The Confidence Tax (Using Your Log) (10 mins)
  *Question:* "On a scale of 1–5, how confident are we that the net outcome is positive?"
  *   **Instruction:** Use your historical log to calibrate.
      *   Look at the last 40 decisions.
      *   Roughly score them: When we said "5 (Very Confident)," how often did it actually go well?
      *   *If you haven't scored them yet:* Do a quick "gut check" calibration. If you recall many "confident" moves blowing up, your baseline is inflated.
  *   **The Thresholds (Whiteboard):**
      *   **Baseline Threshold:** To vote "Yes," average committee confidence must be **4/5**.
      *   **The Unilateralist Tax:**
          *   If $N_{cap} > 3$: Threshold raises to **5/5** (Unanimous high confidence).
          *   If $N_{silent} > 0$: Threshold raises to **5/5**.
          *   If **"High Cost of Delay"** (from Step 1): Threshold lowers back to **4/5** (even if $N$ is high). *This handles the inaction wrinkle.*
  *   **Stop Point:** If the vote does not meet the threshold, the decision is **NO**.

  #### Step 5: The Values Handoff (5 mins)
  *Question:* "Is the remaining disagreement about *probability* (will it work?) or *preference* (is it right?)"
  *   **Instruction:** The procedure handles facts/probabilities. It cannot handle values.
  *   **Handoff Rule:** If the vote fails Step 4, but one member argues, "It might fail, but it's the *right thing to do* morally," the decision is **ESCALATED**.
  *   **Who:** Since the Board Ethics Committee is too slow, this escalates to the **Country Director + Head of Programs** jointly. They own the reputational risk; they make the values call. The Committee records the factual risk, they accept the moral liability.

  ---

  ### Part 3: Running the Cases

  Here is how the filter applies to your three scenarios.

  #### Case A: The Null Result Publication
  *   **Context:** You have pre-registered eval showing donor intervention = 0 effect. 6 peers deliver it. 2 peers have weak data agreeing with you but haven't published. 3 Country Directors asked you not to publish.
  *   **Step 1 (Change):** Yes = Report Public. No = Report Private. Cost of Delay = Low (truth doesn't expire quickly).
  *   **Step 2 ($N_{cap}$):** Who could publish? You + 2 peers with weak data. $N_{cap} = 3$. (Precedent Flag: No, this is specific data).
  *   **Step 3 ($N_{silent}$):** 2 peers have data and sat on it. $N_{silent} = 2$.
  *   **Procedure Stop:** **STOP.** Rule says if $N_{silent} \geq 2$, you must attempt coordination.
  *   **Outcome:** **No Unilateral Action.** You must convene the 2 peers.
  *   **Why this might hurt:** As Head of Evidence, you want transparency. The procedure blocks you because the "Curse" here is that 2 other orgs looked at the same question and decided the reputational cost to the sector (and future funding) outweighed the truth value. By acting alone, you become the "optimistic outlier" on *sector stability*, even if you are right on the *data*.
  *   **Verdict:** **Coordinate or Wait.**

  #### Case B: The Cholera Innovation
  *   **Context:** Cholera in 6 weeks. You are the only org with cold chain/CHWs. New treatment works but isn't in national guidelines (5 months out).
  *   **Step 1 (Change):** Yes = Use new treatment. No = Use standard (or nothing). Cost of Delay = **High** (Deaths).
  *   **Step 2 ($N_{cap}$):** Only you have capacity. $N_{cap} = 1$.
      *   *Precedent Flag:* Yes. Bypassing national guidelines sets a risky norm. Treat effective $N$ as **5**.
  *   **Step 3 ($N_{silent}$):** Others *can't* act, so they aren't silent by choice. $N_{silent} = 0$.
  *   **Step 4 (Confidence):**
      *   Baseline Threshold: 4/5.
      *   Tax: $N_{cap}$ (adjusted) > 3 raises threshold to 5/5.
      *   *Mitigation:* "High Cost of Delay" lowers threshold back to **4/5**.
  *   **Outcome:** **Yes, if Confidence $\geq$ 4/5.**
  *   **Why this works:** It validates the Field Director (you are the only actor) but forces you to acknowledge the precedent risk. However, the human cost of waiting overrides the statistical caution.
  *   **Verdict:** **Go, but document the deviation from guidelines explicitly for future learning.**

  #### Case C: The Beneficiary Data Handover
  *   **Context:** Ministry wants location data for cash program. You + 3 other orgs hold overlapping subsets. Any one of you could hand it over independently.
  *   **Step 1 (Change):** Yes = Data shared. No = Data held. Cost of Delay = Medium (Cash delayed).
  *   **Step 2 ($N_{cap}$):** 4 orgs hold the data. $N_{cap} = 4$.
  *   **Step 3 ($N_{silent}$):** 3 peers haven't handed it over yet. $N_{silent} = 3$.
  *   **Procedure Stop:** **STOP.** $N_{silent} \geq 2$.
  *   **Outcome:** **No Unilateral Action.**
  *   **Why this might hurt:** You might feel pressure to cooperate with the government (efficiency/politics). The procedure says **No**.
  *   **The Logic:** This is the purest Unilateralist's Curse. If the data handover is risky (privacy, security), and 3 peers *could* have done it but *haven't*, they likely see a risk you are underestimating. If you do it alone, you absorb the blame for the risk, but if it goes well, the others get the benefit (free riding). If it goes badly, you break trust for everyone.
  *   **Verdict:** **Consortium Position Required.** Do not be the first to break the line.

  ---

  ### Part 4: Limitations & "Judgment Calls Dressed as Procedure"

  I owe you honesty about where this procedure is still relying on human judgment.

  1.  **Defining "Capacity" (Step 2):** Deciding if a peer *could* act is subjective. A committee member might say "Org X could do it" to block a decision, or "Org X is too slow" to enable one.
      *   *Mitigation:* Require a specific reason for excluding a peer from $N_{cap}$ (e.g., "They lack legal mandate," not "They are slow").
  2.  **Calibrating Confidence (Step 4):** Your log of 40 decisions is small. If your past "5s" were actually lucky guesses, your threshold is too low.
      *   *Mitigation:* Review the log annually. If "High Confidence" decisions fail >20% of the time, raise the baseline threshold to 5/5 permanently.
  3.  **The "High Cost of Delay" Switch (Step 1):** This is the biggest lever. Declaring a situation "Urgent" bypasses the safety checks.
      *   *Mitigation:* This requires unanimity. If one person says "Wait," it is not High Cost of Delay.
  4.  **What This Cannot Settle:**
      *   **True Ethical Dilemmas:** If the data says "Yes" meets all thresholds, but doing it violates a core value (e.g., neutrality), this procedure says "Go." That is why Step 5 (Values Handoff) exists.
      *   **Political Reality:** The procedure might say "No" to the Ministry (Case C), but the Ministry might expel you anyway. The procedure protects your *decision quality*, not your *operational security*. That remains the Country Director's call.

  ### Summary for the Committee
  Print this on one page.
  1.  **What changes?** (Is waiting harmful?)
  2.  **Who else could?** ($N_{cap}$)
  3.  **Who else knows and didn't?** ($N_{silent}$)
  4.  **Confidence Score:** (1–5).
      *   If $N_{cap} > 3$ OR $N_{silent} > 0$: Need **5/5**.
      *   If Waiting = Harm: Need **4/5**.
      *   Else: Need **4/5**.
  5.  **If failed but morally urgent:** Escalate to Country Director.

  This turns the "Unilateralist's Curse" from a theoretical worry into a tax on confidence that you can calculate on a whiteboard in 45 minutes.
