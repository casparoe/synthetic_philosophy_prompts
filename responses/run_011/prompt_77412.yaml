  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Head of Evidence and Data at a mid-sized international NGO (200 staff, 4 countries).
      *   **Context:** Part of a loose consortium (~20 orgs, heavy overlap).
      *   **Problem:** Frequent decisions (2-3/month) on whether to act unilaterally (publish, field, handover) when the sector hasn't agreed/can't move fast.
      *   **Current State:** 4-person committee, 45 mins/case, no formal stats/econ training (User has Pub Policy), "vibes and whoever argues hardest." Escalation to Board Ethics is too slow (quarterly).
      *   **Core Concept:** The Unilateralist's Curse (Bostrom et al.). If many actors can veto/act, and *any* one can act, the set of actions taken is biased toward false positives (over-optimism).
      *   **Goal:** A practical decision procedure for the committee to use *now*.
      *   **Constraints:** No complex math (whiteboard arithmetic), handle non-independence of estimates, address the "capacity window" objection, handle "inaction as action," and test against three specific cases.
      *   **Tone:** Pragmatic, honest about limitations, structured, actionable.

  2.  **Validate the User's Understanding of the Unilateralist's Curse:**
      *   *User Summary:* "If a bunch of parties each form a noisy estimate... initiative goes ahead whenever *any one* of them judges it positive... set of initiatives... skewed toward cases where the most optimistic estimate was simply wrong."
      *   *Assessment:* This is accurate. The core insight is that $P(Action | Max(Estimate) > Threshold)$ is higher than $P(Action | True Value > Threshold)$ when estimates are noisy.
      *   *Correction/Nuance:* The user mentions the "Principle of Conformity." The original paper (Bostrom, Sandberg, & Öhman, 2016) suggests actors should model what others would do and constrain themselves if others would likely refrain. The user is right that this is hard for a single committee.
      *   *Independence:* The user correctly identifies that estimates aren't independent (shared info/talent). This *increases* systemic risk (correlated error) but might *decrease* the variance of the "max" estimate depending on the correlation structure. However, for safety, correlated bias usually means we should be *more* cautious, not less, because if we're wrong, they're likely wrong too, but we're the only ones acting.
      *   *Capacity Objection:* The Field Director says "we're the only ones who *can* act." This changes the $N$ (number of capable actors). If $N=1$, the curse theoretically disappears *regarding action*, but reappears regarding *inaction* or *precedent setting*.
      *   *Inaction:* Correct. In humanitarian work, doing nothing has consequences. The curse applies to the decision to *change the status quo*.

  3.  **Drafting the Procedure (The "Unilateralist's Filter"):**
      *   *Need:* A step-by-step checklist.
      *   *Math:* Needs to be simple. Instead of calculating $N$ and $\sigma$, use proxies (Peer Count, Confidence Gap).
      *   *Data:* Use the internal log (40 decisions) to calibrate "Confidence Ratings."
      *   *Structure:*
          1.  Define the Action & The Counterfactual.
          2.  Assess Capacity/Uniqueness (Addressing Field Director).
          3.  Assess Peer Alignment (Addressing the Curse).
          4.  Calibrate Confidence (Using the Log).
          5.  The "Margin of Safety" Test.
          6.  Values Handoff.

  4.  **Addressing the Wrinkles:**
      *   *Wrinkle 1 (Non-independence):* Shared bias means if we are wrong, the sector is likely wrong too. But if we act and fail, we damage the *whole* sector's credibility. So, shared background = Higher Reputational Risk = Higher Margin needed.
      *   *Wrinkle 2 (Capacity Window):* If we are the *only* actor, $N=1$. The curse weakens. *However*, acting sets a precedent. If we act badly, others might copy (bad norm) or be blocked (regulatory backlash). So the "Curse" transforms into a "Precedent Risk."
      *   *Wrinkle 3 (Inaction):* Frame the decision as "Change vs. Status Quo." Apply the filter to whichever option *changes* the equilibrium. If waiting causes harm, waiting is the "action" needing scrutiny.

  5.  **Developing the Three Cases:**
      *   *Case A (Publishing Null Result):* High reputational risk for consortium. Peers know but hide. $N$ is low (only those who know), but impact is high. Procedure should likely say "No" or "Delay for Consortium Alignment" because the harm is to the collective good (donor trust).
      *   *Case B (Cholera/Innovation):* $N=1$ (Capacity). Window is tight. Inaction = Death. Procedure should lean "Yes" but with monitoring. The "Curse" is low because no one else *could* act, but "Precedent" is high (bypassing guidelines).
      *   *Case C (Data Handover):* $N=4$ (Orgs with data). Any one can leak the cat. High risk of government misuse. Procedure should say "No" unless joint agreement. This is a classic Tragedy of the Commons/Unilateralist scenario. *Self-Correction:* User wants one to come out against their intuition. I suspect the User might want to share data (efficiency). The procedure should flag the risk of others doing it anyway. Actually, let's make Case C the one where the procedure says "No" even if the User wants to say "Yes" (protecting beneficiaries). Or vice versa. Let's look at the prompt: "One of those three should come out against what I want." I don't know what the User wants. I will assume standard NGO caution: usually want to protect data (No), want to publish truth (Yes), want to save lives (Yes). I will make Case C (Data) recommend "No/Coordinate" even if the User feels pressure to cooperate with Gov.

  6.  **Refining the Math/Calibration:**
      *   Use the 40-decision log.
      *   Calculate "Calibration Score": When we said "High Confidence," how often were we right?
      *   Simple Adjustment: If Peer Count > 3, require Confidence Rating to be 2 levels higher than usual threshold.

  7.  **Final Review against Constraints:**
      *   Order of questions? Yes.
      *   Stop points? Yes.
      *   Human handoff? Yes (Ethics/Values).
      *   Whiteboard math? Yes.
      *   Address wrinkles? Yes.
      *   Tone? Professional, direct, acknowledging limitations.

  8.  **Constructing the Output:** (Mental Outline)
      *   **Validation:** Confirm understanding of the Curse and nuances.
      *   **The Procedure:** "The Unilateralist's Filter."
      *   **Step 1:** Define the Change.
      *   **Step 2:** Count the Capable (Addressing Field Director).
      *   **Step 3:** Check the Correlation (Addressing Shared Bias).
      *   **Step 4:** The Confidence Tax (Using the Log).
      *   **Step 5:** The Values Handoff.
      *   **Case Studies:** Run A, B, C through the filter.
      *   **Limitations:** What this doesn't solve.

      *(Self-Correction during drafting Case C)*: The prompt asks for one case to contradict the User's likely desire. In Data Handover (Case C), the pressure is usually to comply with Gov (Yes). The Unilateralist Curse suggests waiting for consortium alignment because if *any* of the 4 orgs hands it over, the cat is out, but if *we* do it alone, we take the blame. I will structure the procedure to recommend "Joint Action Only" here, which might frustrate a User looking for efficiency.

      *(Refining the Math)*: Keep it to "Confidence Levels" (1-5) and "Peer Counts."
      *   Baseline threshold: 4/5.
      *   If Peers > 5: Threshold becomes 5/5.
      *   If Peers = 1 (Capacity): Threshold stays 4/5 but add "Precedent Check."

      *(Refining the "Inaction" point)*: Make Step 1 explicitly ask "What is the Status Quo?" and "Does Waiting cause harm?"

      *(Refining the "Field Director" point)*: Acknowledge he is right about the *statistical* curse (N=1), but wrong about the *systemic* risk (N>1 for future rules).

      *(Final Polish)*: Ensure the distinction between "Fact" and "Value" is clear in the handoff step.

  9.  **Final Polish of the Text:** Ensure the voice is appropriate for a Head of Evidence (analytical but pragmatic). (Proceed to generate response).

  *(Wait, one last check on the "One of those three should come out against what I want" constraint)*: I need to make sure I explicitly state *why* the procedure contradicts the likely intuition in one case. I'll pick Case A (Publishing). Intuition: Transparency is good. Procedure: Don't burn the consortium if peers are hiding data too. Or Case C. Let's go with Case C. Intuition: Gov needs data for cash program (Good). Procedure: Don't be the one to break the data protection norm unilaterally. Actually, Case A is stronger for the "Curse." If 6 orgs have data, and we publish, we take the heat for everyone. The Curse says: If others haven't published, maybe they know something we don't (or they value sector stability more). I will make Case A the one where the procedure says "Pause/Coordinate" despite the moral urge to publish truth.

  *Wait, re-reading prompt:* "One of those three should come out against what I want." I don't know what the user wants. I have to infer.
  *   Case A (Publish Null): Evidence head usually wants to publish. Procedure might say wait.
  *   Case B (Cholera): Evidence head usually wants to act/save lives. Procedure should say go.
  *   Case C (Data): Evidence head might want to protect data OR cooperate.
