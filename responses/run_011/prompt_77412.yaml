  *   *Contradiction:* I will make Case A recommend *delaying publication* to align with peers, contradicting the "publish truth now" impulse. This highlights the "Curse" (others sitting on data implies a hidden variable/consensus).
  *   *Actually, looking at the Unilateralist Curse:* It warns against acting when others *could* but *haven't*. In Case A, peers *have* the data but *haven't* published. This is the exact curse scenario. If we publish, we might be the "optimistic outlier" regarding the *consequences* of publishing (even if the data is right). So the procedure should advise coordination.
  *   *Case C:* 3 other orgs hold data. If we don't give it, someone else might. This is a "Race to the Bottom." The procedure should advise a Joint Position.
