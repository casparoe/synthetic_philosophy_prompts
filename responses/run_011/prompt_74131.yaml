answer: |-
  **The Cost of Confidence: Evaluating Modesty in Accuracy-First Epistemology**

  The accuracy-first program in formal epistemology proposes a simple, compelling thesis: the fundamental epistemic value of a belief state is its accuracy. To hold a belief is to take the world to be a certain way; if the world is that way, the belief is good; if not, it is bad. When we move from binary beliefs to *credences*—degrees of belief represented by probabilities between 0 and 1—this value is quantified by a scoring rule. A scoring rule measures the distance between a credence and the truth value of the proposition (1 for true, 0 for false). The program's central constraint is that this scoring rule must be *strictly proper*. A measure is strictly proper if, given any set of credences, those specific credences minimize the expected inaccuracy relative to themselves. In other words, if you believe a coin will land heads with probability 0.6, strict propriety ensures that, by your own lights, assigning 0.6 is expected to be more accurate than assigning 0.5 or 0.9.

  This mathematical constraint buys the accuracy-first epistemologist significant normative leverage. It proves that incoherent credences (those violating probability axioms) are *accuracy-dominated*—there is always an alternative set of credences that is more accurate regardless of how the world turns out. It also vindicates *conditionalization*, the norm that one should update beliefs by conditioning on new evidence, as the unique method for maximizing expected accuracy. However, strict propriety entails a consequence that many find unsettling: structural immodesty. Because your current credences minimize expected inaccuracy relative to themselves, you cannot rationally believe that any other available credence function is better than your own. You are forced to regard your current epistemic state as optimal.

  This has sparked a dispute within the framework. Critics argue that this immodesty is fatal. A plausible theory of epistemic value should accommodate the rational intuition that an agent can expect to be mistaken. If I know I am fallible, surely I should think there is a significant chance my current confidence is misplaced. Defenders offer a deflationary reply: immodesty is merely an indexical triviality. To say "my current credences are best" is just to say "these credences are best relative to these credences." It is compatible with acknowledging that a better-informed agent, or my future self after seeing evidence, would assess my current state poorly. The dispute hinges on whether this deflation is sufficient, or whether the framework requires repair. Recently, a proposal has emerged to save the intuition of modesty without sacrificing the normative benefits of propriety: the two-measure view. This essay argues that while the immodesty objection highlights a genuine tension, the two-measure repair is incoherent and ad hoc. The accuracy-first epistemologist should accept the deflationary reply, as it preserves the unity of epistemic value while correctly diagnosing the modesty intuition.

  To evaluate the two-measure repair, we must first understand its mechanics. The proposal suggests retaining a strictly proper measure for all substantive normative work—determining coherence, dominance, and conditionalization norms. However, for the specific purpose of an agent's self-assessment regarding the quality of their own opinions, the agent should employ a second, deliberately non-proper measure. On this second measure, the "best" credence is not the agent's actual credence, but one shrunk partway toward 0.5 (maximum uncertainty). If I believe a proposition to degree 0.8, the proper measure says 0.8 is optimal. The non-proper self-assessment measure says something like 0.65 is optimal. The proponent argues this delivers modesty—I now expect a different credence to be "better" by this metric—without touching the arguments for coherence or conditionalization, which rely solely on the first measure.

  This repair fails on three counts: coherence, motivation, and conceptual fidelity. First, consider coherence. The accuracy-first program is founded on the idea that accuracy is *the* epistemic good. Introducing a second measure that disagrees with the first about which credences are better fractures this unity. If the proper measure says credence $c_1$ dominates $c_2$, but the self-assessment measure says $c_2$ is preferable to $c_1$, the agent is left with conflicting verdicts on what constitutes epistemic success. More dangerously, this risks reintroducing the very dominance problems the program was built to avoid. If I assess my own state using the non-proper measure, I might conclude that shifting my credences toward 0.5 is an improvement. But the proper measure guarantees that such a shift is expected to be less accurate. If I act on the self-assessment measure, I am deliberately moving toward a state that is accuracy-dominated relative to my evidence. A norm-governed attitude cannot recommend actions that violate the fundamental norms of the system it inhabits.

  Second, the motivation for the specific shape of the second measure is suspiciously ad hoc. Why shrink toward 0.5? This specific mathematical operation encodes a bias toward uninformative opinions, not modesty. Modesty is the acknowledgment that one might be wrong; it is a claim about the reliability of one's evidence or cognitive faculties. Shrinking a credence is a substantive change to the belief content itself. A truly modest agent might have overwhelming evidence for a mathematical truth and be confident, while remaining modest about a complex empirical claim. A blanket shrinkage rule applies a uniform skepticism that is insensitive to the actual strength of evidence. It looks less like a repair for modesty and more like an engineered solution to manufacture a specific output. If the only reason to adopt this measure is to satisfy the intuition that "I should not think I am best," without independent justification for why 0.5 is the target of modesty, the view lacks theoretical grounding.

  Third, and most importantly, the two-measure view misidentifies what modesty is. Epistemic modesty is not the belief that one's current credences are numerically incorrect; it is the recognition that one's current credences might not match the truth. The deflationary reply captures this perfectly. I can believe 0.8 is the rational credence given my evidence (immodesty about rationality) while acknowledging that the proposition might be false (modesty about the world). The two-measure view conflates being rational with being right. By forcing me to assess my rational credences as sub-optimal, it does not make me modest; it makes me irrational by my own system's standards.

  Therefore, the accuracy-first epistemologist should adopt the deflationary reply. The immodesty entailed by strict propriety is not a bug, but a feature of what it means to be a rational agent at a time. To hold a credence is, by definition, to take that level of confidence to be the one best supported by the evidence. To think otherwise is to be in a state of epistemic akrasia—believing that one should not believe what one believes. The deflationary reply preserves the mathematical integrity of the accuracy program, ensuring that coherence and conditionalization remain vindicated by a single, unified metric of value. It accepts that while I expect my future self to be more accurate (because they will have more evidence), I must also expect my future self to be immodest from their new standpoint. This is not a circle of arrogance, but a consistent chain of rational optimization.

  Proponents of the immodesty objection, including those favoring the two-measure repair, will press a strong counter-consideration: the phenomenological reality of fallibility. They argue that a rational agent often has direct insight into their own limitations. I know I am tired, or that the question is outside my expertise, or that peers disagree with me. In these cases, it feels not just permissible but required to think, "My current confidence is likely too high." The deflationary reply seems to forbid this; it says I must always think my current confidence is optimal. If the framework cannot accommodate the rationality of discounting one's own judgment in the face of known limitations, it has misdescribed the phenomenon of rational agency.

  This consideration is powerful because it appeals to the lived experience of inquiry. However, it rests on a confusion between *first-order* and *higher-order* evidence. When I know I am tired, this is new evidence. The accuracy-first framework demands I conditionalize on it. If being tired reduces the reliability of my cognitive processing, conditionalizing on that fact will naturally lower my credence in the propositions I was evaluating. I do not need a second, non-proper measure to tell me to be less confident; the proper measure, applied to the total evidence (including evidence about my fatigue), will dictate a lower credence. Once I have updated, that new lower credence is, once again, the one I regard as optimal. The "modesty" of acknowledging my fatigue is absorbed into the content of the credence itself, not a meta-assessment that contradicts it. The deflationary reply survives because it recognizes that rational humility is a result of processing evidence about one's limitations, not a structural constraint that forces one to violate the norms of rationality.

  In conclusion, the accuracy-first program need not fear the charge of immodesty. The two-measure repair, while creative, introduces incoherence and biases that undermine the framework's core commitments. The deflationary reply offers a stable path forward: it distinguishes between the optimality of a belief state relative to evidence and the truth of the world. Rational agents are indeed fallible, but they are not required to be self-undermining. We can expect to be wrong without believing that we should currently believe otherwise. Strict propriety remains the correct standard for epistemic value, not because it guarantees we are right, but because it guarantees we are doing the best we can with what we have.
