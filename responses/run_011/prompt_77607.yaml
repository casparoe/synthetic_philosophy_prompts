answer: |-
  **In Praise of a Plural Life**

  Good evening. For those who don't know me, I'm a colleague of [Honoree's Name], which means I've spent the last few decades listening to him explain why we don't know what we're talking about when we talk about happiness.

  Looking around this room, I see about a third philosophers and two-thirds people who have actual lives. That ratio feels appropriate. [Honoree] has always believed that philosophy should explain the life, not the other way around. And for thirty years, his central project has been to dismantle what he calls the "felt-quality picture of pleasure."

  That sounds technical, but the idea is simple. Most of us assume that pleasure is a specific sensation, like a sweet taste or a warm glow, that gets added to whatever we're doing. We assume that because drinking wine and solving a puzzle are both "pleasant," they must share a common ingredient, a specific "pleasure feeling" that we could isolate if we looked hard enough.

  [Honoree] says that if you go looking for that one thing, you come back empty-handed. And he insists that coming back empty-handed is a finding, not a failure.

  To see why, I want you to think about two of his favorite examples. He's been using them since the nineties, so some of you in the department have heard them since before you had tenure.

  First: Imagine it's a ninety-degree day. You've been working outside. You are sticky, hot, and exhausted. You step into a cold shower. Think about the first two minutes. That is a profound pleasure.

  Second: Imagine it's three in the morning. The house is silent. You are working on the Thursday crossword. You find the last entry, the one that unlocks the whole center. You write it in. That is also a profound pleasure.

  Now, close the gap between those two experiences. Is there a single sensation common to the shock of cold water on hot skin and the quiet click of a pen on paper at 3 AM? Is there a specific "tingle" that happens in both?

  If you're honest, the answer is no. The shower is relief; the crossword is satisfaction. One is physical cessation of pain, the other is mental completion. If you try to find the single "pleasure thing" connecting them, you find nothing. [Honoree] argues that this isn't because we aren't looking hard enough. It's because there's nothing there to find. Pleasure isn't a flavor; it's a relationship between you and the world.

  Now, I know what some of you are thinking. Specifically, I know what the hedonists in the front row are thinking. They're wondering: If there's no common feeling, isn't "pleasure" just a word we slap on a random list of unrelated things? Isn't this just a list dressed up as a theory?

  It's a fair objection. But consider the word "winning." Winning a lottery feels nothing like winning a race, which feels nothing like winning an argument. There is no single "winning sensation" in your body when you cross a finish line versus when a judge rules in your favor. But "winning" isn't just a random list. These things are held together by a shared structure of success, even if the feeling differs. Pleasure is the same. It's not one note played on repeat; it's a harmony of different notes that make up a song.

  I know the hedonists in the front row are itching to object, but please, save the rebuttals for the Q&A; the bar is open.

  This brings me to why we are really here. People sometimes ask [Honoree] why he never wrote the single, magnum-opus book that sums up his life's work. Why no massive volume titled *The Theory of Pleasure*?

  For a long time, I thought this was a question about productivity. Now I realize it was a question about philosophy.

  He never wrote the single-thesis book because he doesn't believe a life is held together by a single thesis. He believes that a life, like the category of pleasure, is plural. It is held together by an overlapping list of good things rather than one thing everything shares.

  There is the good of arguing with colleagues. There is the good of teaching a student who finally gets it. There is the good of a quiet morning, a raised family, a retirement dinner with friends. If you tried to find the one single "career sensation" that connects grading papers to holding a grandchild, you might come back empty-handed. But that doesn't mean the life lacks coherence. It means the life is rich.

  To demand one defining achievement is to demand a monism that doesn't exist. It would be like demanding the shower feel like the crossword.

  So, we aren't here to mark the end of a project that failed to find a single answer. We are here to celebrate a career that successfully identified many questions, and a life that successfully enjoyed many answers.

  Please raise your glasses. To [Honoree]. May your showers be cold, your puzzles be solvable, and may you never feel pressured to find the one thing that makes them both worth doing.
