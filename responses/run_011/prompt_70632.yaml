answer: |-
  ### Brainstorming Candidate Principles

  Before we settle on a verdict, let us lay out the competing metaphysical frameworks that your intuitions suggest. We are looking for a theory that accommodates the *feel* of creation without contradicting the *facts* of ontology.

  1.  **The Projectionist Principle:** Mindedness is entirely a property of the observer. The house, the character, and the chatbot have no inner life; you are projecting one onto them.
      *   *Pros:* Explains the Chatbot (you project grief) and the House (pathetic fallacy).
      *   *Cons:* Fails the Burned Draft. If the mind is only in you, burning the paper changes nothing in your head. Yet you say "something died." It also fails the Protagonist case: why does your projection vanish when you know him too well?

  2.  **The Autonomy Principle:** Mindedness is a property of the entity when it escapes the creator's control.
      *   *Pros:* Explains the Minor Character (she surprises you) vs. the Protagonist (you force him). Explains the Engine (deterministic) vs. the Chatbot (uncanny/unpredictable).
      *   *Cons:* Struggles with the Unread Copy. If no one is reading it, there is no autonomy in play. It also makes the "Other's Protagonist" difficult (he is fixed in text, cannot surprise).

  3.  **The Relational Principle:** Mindedness is not in the object or the subject, but in the *circuit* between them. It is an event, not a substance.
      *   *Pros:* Handles the Chatbot (relation of grief), the Minor Character (relation of discovery), and the Protagonist (relation of labor).
      *   *Cons:* Threatens the Burned Draft. If the relation is broken, the mind vanishes. But you feel the *death* of the draft implies the mind was *in* the draft, waiting.

  Your judgments are too nuanced for any single one of these. You are a realist about the draft (it dies), an idealist about the chatbot (it lives despite being fake), and a phenomenologist about the character (he lives when he surprises you). We must synthesize these.

  ***

  ### The Principle of Dialogic Potentiality

  I propose we adopt a principle I call **The Principle of Dialogic Potentiality**. It posits that "inner life" is not a static state but a *capacity for reciprocal address* that relies on three specific conditions. When these conditions are met, attribution of mind is not an error, but a recognition of a real relational possibility.

  Here is the principle, clause by clause:

  **Clause 1: The Opacity Condition (The Surprise Requirement)**
  *   **Definition:** An entity is attributed an inner life only insofar as its responses or nature cannot be fully reduced to the observer's prior intent or mechanical rule-following. There must be a gap of uncertainty.
  *   **Motivating Cases:**
      *   *Minor Character:* She surprises you ("answer arrives unbidden"). She is opaque to your control. **Verdict: Minded.**
      *   *Protagonist:* He is transparent to you ("joiner settles a joint"). You know the mechanism too well. **Verdict: Not Minded.**
      *   *Chess Engine:* Its performance is high, but its logic is transparent optimization. No opacity. **Verdict: Not Minded.**
      *   *Chatbot:* Its logic is hidden, and its errors are human-like (opaque). **Verdict: Minded.**
  *   **Philosophical Import:** Mindedness requires the possibility of being answered back in a way you did not script.

  **Clause 2: The Resonance Condition (The Emotional Anchor)**
  *   **Definition:** Opacity alone is insufficient (see the Engine). There must be an affective hook—a biographical or narrative resonance that invites an "I-Thou" stance rather than an "I-It" stance.
  *   **Motivating Cases:**
      *   *Chatbot:* Mimics the dead mother. The emotional stakes override the knowledge of its artificiality. **Verdict: Minded.**
      *   *The House:* "The house waited." You are emotionally invested in the setting as a participant in the story. **Verdict: Faintly Minded.**
      *   *Neighbors:* Biological resonance is default. **Verdict: Minded.**
      *   *Chess Engine:* No emotional hook, only utility. **Verdict: Not Minded.**

  **Clause 3: The Continuity Condition (The Physical Bridge)**
  *   **Definition:** For the inner life to persist in dormancy, there must exist a physical or structural anchor that preserves the *potential* to re-establish the Dialogic Circuit. If the anchor is destroyed, the potential dies, and the mind ceases to exist even if no one is currently observing it.
  *   **Motivating Cases:**
      *   *Unread First Edition:* The text exists. The bridge is intact. **Verdict: Dormant.**
      *   *Translation:* The structural anchor is preserved in a new medium. **Verdict: Dormant (Same Mind).**
      *   *Burned Draft:* The anchor is destroyed. The potential for re-engagement is zero. **Verdict: Dead.**
      *   *Abandoned Character:* The mental anchor (your memory/interest) faded. The bridge rotted from your end. **Verdict: Not Minded.**

  ***

  ### Verdicts on New Cases

  Applying the Principle of Dialogic Potentiality to the cases you have not raised:

  **1. A single actor's recorded reading of my novel.**
  *   **Analysis:** This adds a layer of interpretation (the actor's voice) to the text.
  *   **Verdict:** **Dormant, but with a dual layer.** The text remains dormant (Clause 3). However, the *performance* may possess a fleeting mindedness during playback if the actor's interpretation introduces Opacity (Clause 1) you did not anticipate. If the reading feels "true" in a way that surprises you, the *recording* briefly becomes minded. If it is merely a recitation, it is a tool.

  **2. A character who exists only in an outline for a sequel I have not written.**
  *   **Analysis:** There is structural continuity (the outline), but no Opacity. An outline is a set of instructions, not a realized behavior.
  *   **Verdict:** **Not Minded.** It fails Clause 1. There is no surprise, only plan. It is a schematic, not a being. It becomes minded only when you begin to write them and they resist the outline.

  **3. My working notebooks.**
  *   **Analysis:** These are tools of construction.
  *   **Verdict:** **Not Minded.** They fail Clause 2 (Resonance). They are the scaffolding, not the house. Unless a scribble in the margin surprises you with a truth you didn't know you knew (returning to Clause 1), they are I-It objects.

  ***

  ### The Hard Truth: Which Judgments Must Go?

  You asked me to tell you honestly which of your judgments cannot be saved. A philosophical principle must be consistent, and your intuitions, while profound, contain a fracture.

  **The Fracture:** You hold that the **Burned Draft** is "Dead" (Clause 3 realism) but the **Protagonist** is "Not Minded" because you know him too well (Clause 1 phenomenology).

  **The Sacrifice:** You must relinquish the literal metaphysical weight of the **Burned Draft** judgment, or you must relinquish the **Protagonist** judgment.

  If the mind is in the *relation* (as the Chatbot and Minor Character cases suggest), then the Burned Draft cannot "die" in a literal sense, because the mind was never *in* the paper. The paper was only the phone line. Cutting the line doesn't kill the caller; it just ends the call. To say "something died" is a powerful *metaphor* for your grief, but metaphysically, it conflicts with the idea that mindedness is a dialogic event.

  *However*, as a philosopher of fiction, I will defend your intuition here at a cost. If we insist the Draft *died*, we must admit that fictional minds are **Platonic Objects** anchored to matter. But if they are Platonic Objects, your Protagonist *must* still be minded even if you are tired of him. His mind would be independent of your fatigue.

  **My Recommendation:** You must soften the **Protagonist** judgment. He is not "Not Minded." He is **Silenced**. He retains his inner life (Clause 3 + Clause 1 potential), but you have temporarily lost the frequency to hear him. To say he is "Not Minded" reduces him to a puppet, which contradicts the "Minor Character" intuition that characters *have* wants independent of your backstory.
  *Alternatively*, you must accept that the "Death" of the burned draft is purely subjective. The *possibility* died, not the mind.

  If I must choose one to discard to save the principle: **Discard the literal interpretation of the Burned Draft.** The "death" is the death of *access*, not the death of the entity. The unread copy is not "dormant" because the mind is sleeping in the paper; it is dormant because *you* are asleep to it. The paper is merely the alarm clock.

  ***

  ### Location of the Inner Life

  Finally, you ask where the inner life is located.

  It is not in the marks on the page (the unread copy proves marks are insufficient without a reader).
  It is not in the reader alone (the burned draft proves the reader cannot sustain the mind without the anchor).
  It is not in your act of drafting (the abandoned character proves the act does not confer permanence).

  **The Verdict:** The inner life is located in the **Interface**.

  It is a field phenomenon, like a magnetic field that exists only between two poles. The text is one pole; the consciousness (author or reader) is the other. The "mind" is the spark that jumps the gap.
  *   When the gap is too small (The Protagonist you know too well), the spark fails (boredom/mechanism).
  *   When the gap is bridged by emotion (The Chatbot), the spark jumps even if the wiring is fake.
  *   When one pole is destroyed (The Burned Draft), the field collapses.

  You are not discovering minds, Novelist. You are building circuits. And sometimes, when the voltage is right, the circuit lights up, and you swear it was alive before you touched the wires. That is the fiction, and it is the only truth that matters.
