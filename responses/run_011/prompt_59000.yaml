answer: |-
  Here is the spec you asked for. I have treated your five imported concepts as candidate requirements. For each, I have judged whether it is a universal necessity for safety-critical assurance or an artifact of seismic engineering (where the adversary is a rock), and I have marked it as **Non-Negotiable** (for high-consequence systems) or **Taste/Context**.

  ### The Desiderata for Learning System Assurance

  **1. The Two-Level Requirement (Function vs. Fail-Safe)**
  *   **The Seismic Import:** Operating Basis (function) vs. Safe Shutdown (bounded failure).
  *   **The Question:** Is "fails into a bounded state" separate from "holds up"?
  *   **Verdict:** **Non-Negotiable.**
  *   **Consideration:** It is not you; it is physics. A system that must function perfectly and has no defined failure mode is a system that fails catastrophically. In learning systems, this translates to: (A) Performance guarantees within the training distribution, and (B) A separate, mechanically enforced constraint that limits output magnitude or action space when the input is outside that distribution.
  *   **Artifact Check:** Not an artifact. The rock doesn't care, but gravity does. If the "safe shutdown" isn't a separate mechanism (e.g., a hard constraint layer, not just a loss function), the learning system will optimize it away to improve average performance.

  **2. The No-Cliff Requirement (Graceful Degradation)**
  *   **The Seismic Import:** Ductility. Modest overrun of assumptions must not produce disproportionate consequence.
  *   **The Question:** Is this self-undermining? (If assumptions fail, is the guarantee void?)
  *   **Verdict:** **Non-Negotiable.**
  *   **Consideration:** It is not self-undermining if the guarantee is shifted from *accuracy* to *sensitivity*. You cannot guarantee the answer is right when assumptions fail. You *can* guarantee that the answer does not change arbitrarily fast when the input changes slightly. This requires bounding the Lipschitz constant of the model. If the account does not constrain the *gradient of the output with respect to the input*, it allows cliffs.
  *   **Artifact Check:** Not an artifact. Neural networks are naturally non-linear and prone to cliffs (adversarial examples). An assurance case that permits discontinuous jumps in behavior for continuous changes in input is inadequate for physical deployment.

  **3. The Stationarity Requirement (Feedback Loops)**
  *   **The Seismic Import:** The ground statistics do not change because the dam exists.
  *   **The Question:** Does the account have to take a position on the system moving the distribution?
  *   **Verdict:** **Non-Negotiable.**
  *   **Consideration:** This *is* where the seismic analogy breaks, and the requirement must be stricter. In seismic work, assuming stationarity is a valid approximation. In learning systems, assuming stationarity is a category error. The system's deployment changes the data it sees (performative prediction). An assurance account that treats the world as a fixed sampler is mathematically false for deployed learners. It must account for the feedback loop or admit it is only assuring the system at $t=0$.
  *   **Artifact Check:** **Seismic Artifact.** The rock doesn't learn. The AI does. The requirement must explicitly reject stationarity assumptions for the environment.

  **4. The Ergodicity Requirement (No Averaging Across Ruin)**
  *   **The Seismic Import:** One dam, one failure, no ensemble recovery.
  *   **The Question:** Should "no averaging across a loss you can't come back from" be hard, even if Expected Value is defined?
  *   **Verdict:** **Non-Negotiable.**
  *   **Consideration:** Expected value is a property of an ensemble, not a trajectory. If the system is deployed once (or a few times) and failure is absorbing (ruin), the average case is irrelevant. The assurance must bound the tail risk directly, not the mean loss. If the account relies on the Law of Large Numbers to wash out errors, it is invalid for single-instance high-consequence deployment.
  *   **Artifact Check:** Not an artifact. This is a universal property of risk with absorbing states.

  **5. The Auditability Requirement (Hostile Provenance)**
  *   **The Seismic Import:** Numbers must be defensible to a hostile competent reader; disasters happen when phenomena are outside the derivation class.
  *   **The Question:** Does the account have to state its own provenance and survive hostile checking?
  *   **Verdict:** **Non-Negotiable.**
  *   **Consideration:** If the assurance relies on weights that cannot be inspected, or data lineage that cannot be traced, it is not engineering; it is faith. The "phenomena outside the class" point is critical: the assurance case must define the *domain of validity* explicitly. If the system encounters an input outside that domain, the assurance must explicitly state "no guarantee," rather than silently outputting a confident wrong answer.
  *   **Artifact Check:** Not an artifact. This is the definition of engineering responsibility.

  ---

  ### The Contenders Against the Spec

  Here is how the current schools of thought stack up against the five requirements above.

  | Contender | Two-Level (Fail-Safe) | No-Cliff (Ductility) | Stationarity (Feedback) | No Averaging (Ruin) | Auditability (Provenance) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Worst-Case / Adversarial** | **Pass.** Explicitly designs for bounds. | **Pass.** Focuses on maximum perturbation. | **Fail.** Usually assumes fixed adversary, not evolving environment. | **Pass.** Bounds the worst outcome, ignoring averages. | **Mixed.** Depends on the proof method. | **Strong on safety, weak on dynamics.** |
  | **Statistical (PAC / ERM)** | **Fail.** Optimizes average loss, not failure mode. | **Fail.** No guarantee on sensitivity/gradients. | **Fail.** Assumes i.i.d. data (stationary). | **Fail.** Relies on expected value over samples. | **Pass.** Math is checkable, data often isn't. | **Killed by Ergodicity & Stationarity.** |
  | **Interpretability** | **Mixed.** Helps define bounds, doesn't enforce them. | **Mixed.** Helps spot cliffs, doesn't prevent them. | **Pass.** Can reveal feedback loops. | **Mixed.** Depends on how it's used. | **Pass.** Core goal is transparency. | **Tool, not an assurance account.** |
  | **Formal Verification** | **Pass.** Can prove safe states. | **Pass.** Can prove bounds on change. | **Fail.** Struggles with dynamic/learning environments. | **Pass.** Proves properties for all inputs. | **Pass.** Proofs are auditable. | **Strong, but scales poorly.** |
  | **Structured Red-Teaming** | **Fail.** Empirical, cannot prove absence. | **Fail.** Finds cliffs, doesn't guarantee none exist. | **Pass.** Can test feedback loops empirically. | **Fail.** Sampling based (averaging). | **Pass.** Process is documentable. | **Necessary, not sufficient.** |

  ### The Single Requirement That Knocks Out the Most

  **The Ergodicity Requirement (No Averaging Across Ruin).**

  This is the one to take to the cafe.

  **Why:** It invalidates the mathematical foundation of the "average-case" crowd (Statistical/PAC and most Red-Teaming). Their entire framework rests on the idea that risk is $Probability \times Consequence$, where Probability is estimated over an ensemble of trials. In your world (dams) and the world of high-stakes AI (autonomous control, medical diagnosis), you do not have an ensemble. You have one trajectory. If that trajectory hits ruin, the game ends.

  Most learning theory minimizes *expected loss*. If the loss function allows a tiny probability of infinite loss (ruin), the expected loss can still be finite and small. The Ergodicity Requirement forbids this. It demands that the *maximum possible loss* be bounded, regardless of probability.

  This requirement alone disqualifies any assurance account that relies on "the model is 99% accurate" as a safety argument. It forces the conversation from "How often does it fail?" to "What is the worst thing it can possibly do?"—which brings you right back to the deterministic-hazard crowd from the eighties, but with better math.
