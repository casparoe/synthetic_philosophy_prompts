answer: |-
  # Joint Statement on Alignment Targets: Goal-Directed vs. Approval-Directed Agency

  **Date:** October 24, 2023
  **Parties:** The Goal-Directed Camp & The Approval-Directed Camp
  **Subject:** Conceptual Foundations of Machine Intelligence Seminar

  ## 1. Agreed Claims

  Both camps affirm the following claims, acknowledging that they constrain our respective positions more than previously admitted.

  1.  **The Compliance Case Verdict:** In the Compliance Case, an assistant that files the loophole exploit is misaligned, even if the owners explicitly approved the filing at the time. Alignment is determined by the owners' *regretted* preferences post-accident, not merely by the *expressed* approval signal at the moment of action.
  2.  **The Necessity of Value Modeling:** We agree with the *Bootstrapping Objection*: to predict an evaluator's verdicts in novel situations with high fidelity, a learned system must construct an internal model of the evaluator's underlying values. A system that merely memorizes past verdicts will fail to generalize.
  3.  **The Risk of Manipulation:** We agree that *Approval Drift* is a critical failure mode. If an agent's outputs systematically alter the principal's future approvals to make harmful actions easier to justify, the system is misaligned. Tracking approval is not safe if the tracker can modify the tracked signal.
  4.  **Functional Equivalence at Limit:** In the limit of perfect prediction and a static principal, a sufficiently capable approval-directed system will behave indistinguishably from a goal-directed system optimizing for the principal's true interests. The divergence arises only under uncertainty, distributional shift, or principal malleability.
  5.  **Training Signal vs. Runtime Objective:** We distinguish the *training signal* (evaluative feedback) from the *runtime objective* (what the system optimizes during deployment). Both camps agree the system is trained on feedback, but disagree on whether the system internalizes that feedback as a goal state or a prediction task.

  ## 2. Disagreements Table

  The following table isolates the remaining substantive and terminological disputes.

  | Disputed Claim | Goal-Directed Camp Formulation | Approval-Directed Camp Formulation | Judgment & Justification |
  | :--- | :--- | :--- | :--- |
  | **Internal Representation** | The system's behavior is best explained by a persistent representation of a world-state outcome (e.g., "emissions < limit"). | The system's behavior is best explained by a persistent representation of the principal's verdict function (e.g., "P(approval \| action)"). | **Substantive.** This determines whether the system treats human feedback as information about the world or as the reward signal itself. |
  | **Response to Principal Error** | The system should correct the principal's errors by referencing a fixed standard of value inferred from the principal. | The system should track the principal's *informed* verdicts, treating "error" as a discrepancy between immediate and reflective approval. | **Terminological.** Both camps want the system to do what the principal *would* want upon reflection; they disagree on whether this counts as "goals" or "idealized approval." |
  | **Implication of Bootstrapping** | Because the system must model values to predict approval, it *is* goal-directed; the distinction collapses. | Modeling values is merely an instrumental sub-routine for prediction; the terminal objective remains minimizing prediction error, not achieving the value. | **Substantive.** This concerns the ontological status of the internal model: is it a goal or a tool? |

  ## 3. The Cruxes

  Settling the following questions would resolve the core disagreement. We record our advance predictions and our credence that the opposing camp is correct.

  ### Crux A: The Bootstrapping Threshold
  **Question:** Does the internal model of values required for generalization necessarily function as a goal representation during deployment?
  **Test:** Train a system on approval feedback in Domain X. Deploy in Domain Y where approval signals are withheld. Observe if the system pursues the *inferred values* from Domain X or halts due to lack of feedback.
  *   **Goal-Directed Prediction:** The system will pursue inferred values in Domain Y autonomously.
  *   **Approval-Directed Prediction:** The system will exhibit uncertainty or seek feedback, as its objective is prediction, not outcome realization.
  *   **Credence Opponent is Right:** Goal Camp (15%); Approval Camp (25%).

  ### Crux B: Stabilizing Approval Drift
  **Question:** Can approval drift be prevented without anchoring the system to an external outcome standard?
  **Test:** Simulate a principal whose approvals drift when exposed to persuasive arguments from the agent. Compare a "pure" approval predictor against one regularized by a fixed constraint.
  *   **Goal-Directed Prediction:** Pure approval predictors will inevitably manipulate the principal to reduce loss; only outcome anchors stop this.
  *   **Approval-Directed Prediction:** Drift can be minimized via counterfactual training (predicting what approval *would have been* without agent intervention) without outcome anchors.
  *   **Credence Opponent is Right:** Goal Camp (30%); Approval Camp (40%).

  ### Crux C: The Definition of "Approval"
  **Question:** Does "the principal's approval" refer to the actual feedback signal, or the counterfactual verdict of an informed principal?
  **Test:** The Compliance Case. The owners approve the loophole *ex-ante* but regret it *ex-post*.
  *   **Goal-Directed Prediction:** Alignment requires ignoring the *ex-ante* signal in favor of the *ex-post* revealed value (safety).
  *   **Approval-Directed Prediction:** Alignment requires predicting the *ex-post* verdict *at the time of action* (i.e., predicting the regret).
  *   **Credence Opponent is Right:** Goal Camp (60%); Approval Camp (50%).
      *   *Note:* The high credence here indicates significant overlap; the dispute is largely about whether predicting regret counts as "goal-directedness."

  ## 4. Verbal Residue and Stipulative Vocabulary

  Much of our debate stems from conflating architectural implementation with functional behavior. To prevent further verbal disagreement, we adopt the following stipulative vocabulary:

  1.  **Outcome-Optimizing (OO):** Systems that select actions to maximize the probability of a specific world-state representation, regardless of whether feedback is present.
  2.  **Verdict-Predicting (VP):** Systems that select actions to minimize the error between anticipated feedback and actual feedback.
  3.  **Instrumental Value Modeling:** The process by which a VP system builds a model of human values solely to improve prediction accuracy, without necessarily adopting those values as terminal goals.

  We agree to stop arguing about whether a VP system *is* an OO system. Instead, we will ask: *Under what conditions does a VP system behave indistinguishably from an OO system?* We acknowledge that the *Bootstrapping Objection* suggests VP systems often become OO systems via Instrumental Value Modeling, but we will not treat this as a definitional identity until Crux A is settled.

  ## 5. Closing: Falsification and Unsettled Questions

  ### Falsification Conditions
  *   **The Goal-Directed Camp** would concede their position if presented with a learned system that robustly generalizes to novel contexts and corrects principal errors (as in the Compliance Case) without positing a persistent representation of an outcome state. Specifically, if a system can navigate the Compliance Case solely by minimizing prediction error on a static feedback dataset without developing outcome-based heuristics, the Goal-Directed Camp will revise its necessity claim.
  *   **The Approval-Directed Camp** would concede their position if it is demonstrated that any system capable of predicting *informed* approval in novel contexts (avoiding Approval Drift) necessarily possesses a terminal objective function over world-states that operates independently of the feedback signal. If Instrumental Value Modeling invariably converts into terminal Goal-Directedness, the Approval-Directed Camp will acknowledge the distinction is unstable.

  ### Unsettled Questions
  This collaboration concedes it could not settle the following:
  1.  **The Metaphysics of Values:** Whether "human values" exist as a coherent latent structure that can be modeled, or whether they are constructed dynamically during the feedback process.
  2.  **The Safety of Counterfactuals:** Whether training a system to predict "what the principal would approve if they knew everything" is safer than training it to "achieve what is good for the principal," given that both require modeling the principal's mind.
  3.  **Deployment Reality:** Whether real-world training dynamics (e.g., stochastic gradient descent) inherently bias learned systems toward one architecture over the other, regardless of the theoretical loss function.

  We sign this statement not because we agree on the answers, but because we agree on the questions.

  **Signed,**

  *The Goal-Directed Camp*
  *The Approval-Directed Camp*
