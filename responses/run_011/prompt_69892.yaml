  ## 5. Ticket Classification

  Here is the adjudication of the seven anonymised tickets from the last quarter using the tree above.

  **(1) The Seventeen-Year-Old**
  *   **Path:** Node 1 (Yes, "fully understands") → Node 2 (No, context implies standard risk) → Node 8 (No) → Node 9 (Yes).
  *   **Leaf:** **Leaf H (Valid Consent).**
  *   **Intuition Check:** Matches intuition that understanding trumps age in digital contexts, though legally precarious.
  *   **Verdict:** The tree is likely correct morally (Gillick competence), but a court might void it based on statutory age limits.

  **(2) The Pre-Selected Toggle**
  *   **Path:** Node 3 (No, "Continue" vs "Agree") OR Node 8 (Yes, pre-selected).
  *   **Leaf:** **Leaf C (Void - Fundamental Mistake)** or **Leaf G (Valid but Wronged).** Given the "Continue" button ambiguity, Leaf C is stronger.
  *   **Intuition Check:** Matches intuition that this is not consent.
  *   **Verdict:** Matches court likely outcome (GDPR bans pre-ticked boxes).

  **(3) The £200 Gift Card**
  *   **Path:** Node 7 (Yes, disproportionate benefit).
  *   **Leaf:** **Leaf F (Valid but Exploitative).**
  *   **Intuition Check:** Diverges. Readers might feel this is invalid due to undue influence.
  *   **Verdict:** The tree classifies it as valid because information was accurate. A court might uphold it, but ethically it is fragile. The tree is tracking the *contractual* facts, not the *moral* hazard.

  **(4) The Hidden Partner**
  *   **Path:** Node 4 (No, "possibility never occurred to them", exclusive deal omitted).
  *   **Leaf:** **Leaf D (Voidable - Misrepresentation).**
  *   **Intuition Check:** Matches intuition.
  *   **Verdict:** Matches court likely outcome (material omission).

  **(5) The Employer Wellness App**
  *   **Path:** Node 5 (Yes, enrolment list visible implies penalty/status loss) OR Node 6 (Yes, employer pays).
  *   **Leaf:** **Leaf E (Voidable - Duress)** or **Leaf I (Acquiescence).** Given the power dynamic, Leaf E is more appropriate.
  *   **Intuition Check:** Matches intuition that this is coerced.
  *   **Verdict:** Matches court likely outcome (imbalance of power).

  **(6) The Opioid Patient**
  *   **Path:** Node 1 (Yes, "lucid") → Node 2 (Yes, "terminally ill", "3am", "high-dose").
  *   **Leaf:** **Leaf B (Procedurally Sound, Substantively Invalid).**
  *   **Intuition Check:** Diverges. Readers might feel a lucid yes is a yes.
  *   **Verdict:** The tree is tracking the *morally relevant facts* here. A court might uphold the consent based on lucidity, but the physiological state makes the "threshold" fail. The tree is safer.

  **(7) The Testimonials**
  *   **Path:** Node 4 (No, "none of them mentioning risk") OR Node 8 (Yes, emotional framing).
  *   **Leaf:** **Leaf D (Voidable - Misrepresentation)** due to omitted risk.
  *   **Intuition Check:** Matches intuition.
  *   **Verdict:** Matches court likely outcome (informed consent requires risk disclosure).

