  ## 6. Court vs. Tree Divergence Analysis

  **Ticket 1 (17-Year-Old):**
  *   **Divergence:** A court may rule this **Void** based on statutory age limits (e.g., COPPA or local majority age), whereas the tree rules **Valid** based on functional understanding.
  *   **Moral Tracking:** The **Tree** is tracking the morally relevant facts better. If the minor understands the consequence, a rigid age rule is paternalistic. However, for engineering compliance, the legal rule must override the tree.

  **Ticket 3 (£200 Inducement):**
  *   **Divergence:** A court may rule this **Valid** if the risk was disclosed (freedom of contract), whereas the tree labels it **Valid but Exploitative**.
  *   **Moral Tracking:** The **Tree** is tracking the morally relevant facts better. It acknowledges the legal validity while flagging the ethical cost of monetising risk for vulnerable populations.

  **Ticket 6 (Opioid Patient):**
  *   **Divergence:** A court may rule this **Valid** citing the "lucid" assessment, whereas the tree rules **Invalid (Threshold Failure)**.
  *   **Moral Tracking:** The **Tree** is tracking the morally relevant facts better. "Lucidity" in a terminal, medicated state is a fragile baseline; the stakes (genomic/medical data) require a higher threshold of scrutiny than a 3am chatbot allows.

  ---

  ## 7. Implementation Note

  Please note that while this tree operationalises the logic, **Leaf H (Valid Consent)** is the only state that permits automated data processing without human review. All other leaves should trigger a hold on processing and flag the record for Privacy Office review. Where the tree identifies a "Valid but..." state (Leaves F, G), processing may proceed technically, but the ticket must be logged for quarterly ethical audit.

