answer: |-
  Start with Perception to hook their bias, then build upward to Testimony as the dependent but distinct culmination, using a single crisis scenario where each *pramāṇa* solves a different problem within the story rather than competing to explain the same fact.

  **Order and Dependency**
  Begin with *Pratyakṣa* (Perception) because it validates their current worldview before you complicate it. Move immediately to *Anumāna* (Inference) to show how perception runs out of steam (you see smoke, not fire). Place *Upamāna* (Comparison) third, framing it not as "analogy" but as identification—the *gavaya* case is essentially naming the unknown via the known, which is core to reporting (identifying a group, a weapon, a symptom). End with *Śabda* (Testimony), positioning it not as a fallback for when you aren't there, but as the only way to access knowledge that is inherently social (expert data, historical record, whistleblower accounts). This order mirrors the epistemic chain: you must perceive to infer, you must know names to compare, and you must trust language to receive testimony.

  **The Carrying Example**
  Do not force all four to bite on the same fact; that creates artificial complexity. Use one unfolding scenario, such as a chemical plant explosion.
  1.  **Perception:** The reporter sees a blue flash. (Fact: Light occurred.)
  2.  **Inference:** The reporter infers magnesium burning from the blue color. (Fact: Cause is magnesium.)
  3.  **Comparison:** The reporter identifies the specific alloy by comparing the debris texture to a known sample in a database (*gavaya* style: "This debris is like the known sample."). (Fact: Identity of the material.)
  4.  **Testimony:** The safety officer says the valve failed due to pressure. (Fact: Mechanical cause.)
  This keeps the narrative cohesive but prevents the "too much weight" problem by assigning each *pramāṇa* a specific job it is best suited for.

  **Misconceptions and Timing**
  1.  **"Perception can't be wrong":** Head this off in the first five minutes, immediately after defining *Pratyakṣa*. Do not argue philosophy; use a physiological example (stress tunnel vision, optical illusion). If you wait, they will treat Perception as the solid ground against which you measure the others.
  2.  **"Testimony just means trusting authority":** Address this the moment you introduce *Śabda*. Define the Nyāya *āpta* (reliable speaker) not as someone with rank, but someone with direct knowledge (*yathārtha*) and no motive to lie. Make them distinguish between "The Police Chief said it" (Authority) and "The Engineer who saw the gauge said it" (*Āpta*).
  3.  **"So it's a list of four kinds of evidence":** Save this for the synthesis after the Buddhist objection. Correct it by showing the dependency: Testimony is valid *because* the speaker used Perception/Inference correctly. It is a chain of validation, not a menu of options.

  **The Buddhist Objection**
  Place this after you have defined all four, just before the final exercise. Frame it as "The Skeptic's Challenge": Buddhists argue Testimony and Comparison are just Inference in disguise (you infer the speaker is telling the truth). Do not let this deflate the room; use it to save journalism. If the Buddhists are right, you can never learn anything from a source you haven't personally verified, which makes reporting impossible. Nyāya validates *Śabda* as a distinct instrument because language carries knowledge that individual inference cannot reconstruct. This turns the objection into a justification for their profession.

  **Visible Omissions**
  Explicitly state you are leaving out *nirvikalpa* vs. *savikalpa* perception (indeterminate vs. determinate). Tell them: "We are ignoring how the brain processes the image; we care only about the validity claim." Also skip the five-step Nyāya syllogism. Tell them: "We are looking at the source of knowledge, not the logical structure of the argument." This prevents them from getting bogged down in cognitive science or formal logic.

  **The Final Question**
  Ask them: "Here is a quote from an anonymous source you cannot contact: 'The valve failed because the pressure spiked.' Map the chain: Which *pramāṇa* did the source use to know this, and which *pramāṇa* must you use to verify them without seeing the valve yourself?"
  *   *Success looks like:* They identify the source used Perception/Inference, and they identify that they must use Testimony (validated by checking the source's reliability/access) or Inference (checking pressure logs), rather than simply saying "I need to check if they are lying."
