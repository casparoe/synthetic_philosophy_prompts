prompt: |-
  I cover science and ideas for a weekly magazine, and our in-house training day in March has me down for 45 minutes with about twenty junior reporters — bright, zero philosophy, and every one of them convinced that "I saw it happen" beats anything a source tells you. I want to build the session around the Nyāya idea of the pramāṇas, which I think is much better for them than the usual eyewitness-versus-document talk they've already had.

  Don't write the session. Plan how I should explain it. Which of the four needs to be on the table first and what depends on what; whether the carrying example should be a single reported story I keep returning to, and what that story has to contain — my instinct is something where a source's word, a smoke-on-the-hill style inference, and the gavaya case all bite on the same set of facts, but tell me if that's to much weight for one example. Then the misconceptions: I'm expecting "testimony just means trusting authority," "perception can't be wrong," and "so it's a list of four kinds of evidence," and I want the exact beat in the sequence where each one gets headed off rather than argued with later. Where should the Buddhist move — that only perception and inference are real, and the other two are just those in disguise — land so it does work rather than deflating the room? What should I visibly leave out at this level and say I'm leaving out (I assume the determinate/indeterminate perception stuff)? And one question I can put to them at the end that shows whether they can run the reduction test on a source they've never met, not just recite the four names.

  Bottom line in your first sentence, then the reasoning. No preamble, and don't restate the question back at me.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
