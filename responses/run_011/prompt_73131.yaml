      *Self-Correction on Buddhist Objection:* Make sure it doesn't deflate. Frame it as "The Reductionist Challenge." If they accept the reduction, journalism becomes impossible because you can't verify another mind's inference without your own. Nyāya saves journalism by validating testimony as a distinct channel.

      *Self-Correction on Final Question:* Needs to be actionable. "Map the epistemic chain."

