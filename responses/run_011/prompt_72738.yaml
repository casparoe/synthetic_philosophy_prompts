answer: |-
  # Standards for a Theory of Video-Game Character Moral Status

  The following specifications establish the criteria for an adequate theory regarding the moral status of video-game characters. These requirements are designed to be neutral ground: they do not presuppose whether characters *have* status, but they demand that any theory claiming to answer the question must do so with sufficient rigor to satisfy both Moral Realists (who believe direct duties are possible) and Moral Anti-Realists (who believe such duties are artefacts).

  ## 1. Target Specification and Relocation Policy
  **Requirement:** The theory must explicitly state its ontological target. If the theory claims there is a duty *to the character*, it must identify the metaphysical locus of that character. If the theory relocates the duty (to the player, the designer, or the audience), it must provide a "Error Theory" explaining why the intuition of a direct duty arises and why it is misleading.
  *   **Motivation:** Debates often stall because one party argues about the character's suffering while the other argues about the player's virtue. Stealth relocation (claiming to talk about the character while actually talking about the player) is dialectically dishonest.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** Both camps require conceptual clarity to engage. A Realist needs to know if they are arguing for ghostly rights; an Anti-Realist needs to know if they are arguing for psychological hygiene.

  ## 2. Comprehensive Case Coverage (The Battery)
  **Requirement:** The theory must deliver a explicit verdict (Wrong / Permissible / Category Error) on the ten scenarios listed in the prompt (i–x), or explicitly declare a subset of them outside the scope of moral evaluation with justification. It cannot treat all cases as morally equivalent by default.
  *   **Motivation:** A theory that treats torturing a voiced, biographical NPC (i) identically to deleting a procedural asset (ii) fails to capture the moral data. A theory that treats reloading a save (iii) identically to permadeath (iv) fails to capture the stakes of persistence.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** Any ethical theory must be applicable to the phenomena it claims to govern. Selective application suggests ad-hoc reasoning.

  ## 3. The Ontological Ceiling
  **Requirement:** The theory cannot premise its verdicts on the claim that current video-game characters possess phenomenal consciousness (qualia, subjective feeling).
  *   **Motivation:** It is settled science and philosophy that current code and graphics do not instantiate sentience. A theory requiring belief in "digital ghosts" is scientifically untenable.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** This constrains Realists to find a basis for moral status that does not rely on sentience (e.g., narrative personhood, symbolic value) and constrains Anti-Realists to explain why the *appearance* of sentience triggers moral intuition.

  ## 4. Distinction Preservation
  **Requirement:** The theory must maintain strict separation between: (a) an act being wrong and a patient being wronged; (b) direct duties (to the entity) and indirect duties (regarding the entity); and (c) "this has moral weight" and "this affects the player's psychology."
  *   **Motivation:** Collapsing these distinctions allows theories to smuggle conclusions. For example, claiming "torturing the NPC is wrong" because "it makes you cruel" is an indirect duty, not a direct one. Calling it a direct duty mislabels the mechanism.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** Conceptual hygiene. Without this, the debate dissolves into equivocation.

  ## 5. The Persistence and Instantiation Constraint
  **Requirement:** The theory must account for the moral status of the character across time and instantiation. It must explain whether the "patient" in playthrough A is identical to the "patient" in playthrough B, and whether a character on a shut-down server (ix) retains moral claims.
  *   **Motivation:** Fictional entities are multiply instantiable. If I wrong "Cloud Strife," do I wrong every copy of the game? If the server closes, does the duty vanish?
  *   **Tag:** **Camp Preference (Moral Realists regarding Fiction).**
  *   **Camp Gain:** Realists gain a framework to argue that fictional persons have a mode of existence robust enough to sustain trans-session identity. Anti-Realists gain the ability to argue that without continuous instantiation, there is no patient to bear the wrong.

  ## 6. Agency and Design Responsibility
  **Requirement:** The theory must distinguish between the moral agency of the player (who chooses actions within a system) and the designer (who creates the system and the affordances for harm). It must state whether the "wrong" is located in the execution of the act or the creation of the possibility.
  *   **Motivation:** If a game rewards cruelty, is the player wrong for taking the reward, or the designer for offering it?
  *   **Tag:** **Camp Preference (Design Ethics Camp).**
  *   **Camp Gain:** This camp (often overlapping with Anti-Realists about characters but Realists about effects) gains the ability to shift moral scrutiny from the consumer to the producer, arguing that player "wrongs" are merely symptoms of design choices.

  ## 7. The Fictional Consent Paradox
  **Requirement:** The theory must address whether fictional consent (x) negates moral wrongs. If a character's script says "kill me," does performing that act constitute a wrong?
  *   **Motivation:** In reality, consent can negate battery. In fiction, consent is authored by the designer, not the character. A theory must explain if fictional consent functions morally or merely ludically.
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** This tests the robustness of the "harm" definition. If harm is defined by the character's will, fictional consent should clear the act. If harm is defined by the act's nature, consent may not matter. The theory must pick one.

  ## 8. The Phenomenological Explanation Clause
  **Requirement:** If the theory concludes that no direct duties exist (Anti-Realism), it must explain why the intuition of a direct duty is so persistent, particularly why scenario (i) feels weightier than (ii). It cannot dismiss the intuition as "mere confusion" without explaining the mechanism of the confusion.
  *   **Motivation:** Dismissing widespread moral intuition without explanation is dogmatic. The "confusion" must be accounted for (e.g., via empathy mechanisms, simulation heuristics).
  *   **Tag:** **Non-negotiable.**
  *   **Reasoning:** An adequate error theory is as demanding as a positive theory. It must explain the data it rejects.

  ---

  ## 6. Joint Unsatisfiability (The Trilemma)

  You identified a trio of requirements:
  1.  **Directness:** The wrong must be a wrong *to the character* rather than a defect in the player.
  2.  **Ontology:** Fictional characters are not the sort of thing that can be wronged (due to non-existence/lack of consciousness).
  3.  **Phenomenology:** The theory must explain why many people find (i) [rich NPC] more troubling than (ii) [proc-gen NPC].

  **Verdict:** This trio is **genuinely inconsistent**.

  **Argument:**
  (1) and (2) are logical contradictories. If characters are not the sort of thing that can be wronged (2), then a wrong *to the character* (1) is a category error. You cannot have a direct duty to an entity that lacks the capacity to be a duty-bearer or duty-recipient.
  (3) is an empirical datum about human psychology.
  Therefore, a theory can satisfy (3) and (2) (Anti-Realism: "It feels wrong because of your empathy, but no one is wronged"), or (3) and (1) (Realism: "It is wrong to them, therefore they must have some status"), but it cannot satisfy (1) and (2).

  **Which Requirement Must Go?**
  If we hold the **Ontological Ceiling** (Requirement 3 above) as fixed—which we must, given current physics and philosophy of mind—then **(2) is the strongest premise**. It is grounded in the nature of existence.
  Therefore, **(1) must go.**
  A theory cannot maintain that there is a direct wrong *to the character* without violating the Ontological Ceiling. To keep (1), one would have to posit that fictional entities have a mode of existence capable of bearing harm independent of consciousness, which is metaphysically costly and controversial.

  **What the Theory Loses:**
  Dropping (1) means abandoning the claim that we owe duties *to* NPCs. The theory loses the ability to say "The NPC was wronged." It must instead say "The act was wrong *regarding* the NPC."
  *   **Cost:** It invalidates the literal reading of moral intuition. We feel we hurt *them*, but the theory says we only hurt *ourselves* or *the moral order*.
  *   **Gain:** It preserves consistency with a naturalistic worldview.
  *   **Resolution of (3):** The theory explains the intuition gap (i vs ii) not by difference in the *object's* status, but by difference in the *subject's* engagement. Richer narratives trigger deeper empathy heuristics, making the indirect wrong (to the player's virtue or sensibilities) feel more acute.

  ---

  ## 7. Most Exclusionary Requirement

  **Requirement 4: Distinction Preservation.**
  Specifically: *Being wronged vs. An act's being wrong.*

  **Reasoning:** This requirement knocks out the largest number of otherwise plausible candidates, particularly intuitive "Hybrid Views."
  Many people want to say, "It's not that the NPC has rights, but it's still wrong to kill them." Without strict distinction preservation, this is incoherent. If the NPC has no rights/status (cannot be wronged), the "wrongness" must reside entirely in the agent or the abstract principle.
  Most lay theories (and many academic ones) slide between "This act is vicious" and "This act violates the character." Enforcing this distinction forces a theory to be either a pure Virtue Ethics account (all about the player), a pure Realist account (all about the character), or a complex Dual-Aspect theory. It eliminates the comfortable middle ground where "it's kind of both" without explanation. It demands a metaphysical commitment that most casual intuitions refuse to make.

  ---

  ## 8. Brief Scoring of Existing Views

  *   **Indirect-Duty (Kantian):**
      *   *Performance:* High.
      *   *Fit:* Meets Ontological Ceiling easily. Explains Phenomenology via damage to human rationality/empathy.
      *   *Failure:* Struggles with Requirement 1 (Target). Must work hard to explain why the intuition of direct duty isn't just a mistake, often dismissing the "feel" of the game too readily.
  *   **Virtue/Character-Based:**
      *   *Performance:* High.
      *   *Fit:* Excellent on Agency (Requirement 6). Explains the (i) vs (ii) gap via the cultivation of compassion.
      *   *Failure:* Can collapse Distinction Preservation (Requirement 4), conflating "bad for the soul" with "wrong act."
  *   **Contractualist:**
      *   *Performance:* Low.
      *   *Fit:* Fails Requirement 2 (Case Battery) on non-rational entities. Cannot easily account for duties to entities that cannot be parties to a contract (NPCs).
      *   *Failure:* Requires significant relocation of the target to "society" or "other players."
  *   **Make-Believe / Pretence:**
      *   *Performance:* Medium.
      *   *Fit:* Excellent on Ontological Ceiling.
      *   *Failure:* Struggles with Requirement 8 (Phenomenological Explanation). Dismissing the moral weight as "just pretend" often fails to explain why the "pretend" torture feels heavier than "pretend" jumping.
  *   **Narrative Personhood (Slight Status):**
      *   *Performance:* Medium-High.
      *   *Fit:* Best at explaining the (i) vs (ii) gap (Requirement 2).
      *   *Failure:* Risks violating the Ontological Ceiling (Requirement 3). Must carefully define "status" without implying consciousness. Often falls into the Joint Unsatisfiability trap by trying to keep (1) and (2).

  ---

  ### Settled vs. Contested Summary
  *   **Settled:** Video game characters do not possess phenomenal consciousness (Requirement 3). Distinctions between direct/indirect duty must be maintained for logical coherence (Requirement 4).
  *   **Contested:** Whether the *intuition* of direct duty (Requirement 8) warrants positing a non-standard ontological category for fictional entities. Whether the Designer or Player bears the primary moral burden (Requirement 6).
  *   **Consensus Warning:** Do not present the "Indirect Duty" view as the default. While it is metaphysically safer, it carries the burden of explaining the robustness of the "Direct Duty" intuition. Do not present the "Narrative Personhood" view as absurd; it is the only view that takes the phenomenological data (Requirement 8) at face value, even if it is metaphysically costly.
