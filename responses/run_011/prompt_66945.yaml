answer: |-
  This is a profound observation. You have identified an epistemological failure mode specific to socio-technical systems. As a philosopher of science who looks at biology, I see this constantly: the confusion between *selected effect* (why something was kept) and *causal role* (what something does), compounded by the confusion between *adaptation* (designed/selected for) and *spandrel* (structural byproduct).

  You are asking for a carving, not a label. I will honor that by walking through the conceptual space before settling on a term.

  ### (a) Brainstorming Candidate Concepts

  Here is the long list of concepts from philosophy of science, biology, sociology, and engineering that resonate with your description. I have not filtered them yet.

  1.  **Adaptationism (The Panglossian Paradigm):** The assumption in evolutionary biology that every trait exists because it was selected for a specific function.
  2.  **Spandrels (Gould & Lewontin):** Architectural byproducts that are necessary consequences of a structure's design, often mistaken for adaptations.
  3.  **Just-So Stories (Kipling/Dawkins):** Plausible but untestable evolutionary narratives created to explain a trait's origin.
  4.  **The Intentional Stance (Dennett):** The strategy of interpreting a system (even a non-human one) as if it were a rational agent with beliefs and goals to predict its behavior.
  5.  **Path Dependence:** The idea that current decisions are constrained by past decisions, regardless of optimal utility.
  6.  **Reification:** Treating an abstract concept or an accident as if it were a concrete, intentional thing.
  7.  **Institutional Isomorphism:** Organizations copying structures from other organizations to appear legitimate, regardless of efficiency.
  8.  **Confabulation:** Fabricating explanations without the intent to deceive, usually to fill gaps in memory. (You excluded this, but I list it to check boundaries).
  9.  **Inference to the Best Explanation (IBE):** A logical method where one accepts the hypothesis that would, if true, best explain the evidence.
  10. **Technical Debt:** The implied cost of additional rework caused by choosing an easy solution now instead of a better approach that would take longer.

  **Initial Culling:**
  *   *Confabulation* is out, as you noted, because the agents are sincere and third-party.
  *   *Technical Debt* is too economic; it describes the *cost*, not the *explanatory error*.
  *   *Institutional Isomorphism* explains why Service B copied Service A, but not why Service A invented the reason in the first place.
  *   *Path Dependence* explains the *cause* of the artifact (the 250ms pause), but not the *habit of explanation*.
  *   *The Intentional Stance* is useful but usually considered a valid heuristic. Your observation is about when this heuristic *fails* but is treated as truth.

  This leaves **Adaptationism**, **Spandrels**, **Just-So Stories**, and **Reification** as the strongest contenders.

  ### (b) Evaluating Surviving Candidates

  Here is how the remaining concepts map onto your two instances (the null column and the 250ms pause).

  **1. Adaptationism**
  *   *Definition:* The research strategy of assuming that existing traits are optimal solutions to specific problems posed by the environment.
  *   *Where it fits:* It perfectly captures your Point #1 ("what is it for?") and Point #4 (the possibility of "not for anything" is excluded). In biology, this is the assumption that a gene exists *because* it helps survival. In your team, the assumption is that a column exists *because* it helps the system.
  *   *Where it fails:* Adaptationism is a *theoretical bias*. Your phenomenon includes a *social mechanism* (writing it down, copying it). Adaptationism explains the thought, but not the propagation of the error into documentation and new designs.

  **2. Spandrels**
  *   *Definition:* Features that arise as necessary structural consequences of a design, not as direct adaptations. (Named after the triangular spaces between arches in architecture; they are necessary for the arch, not designed for painting frescoes, though frescoes are often painted on them).
  *   *Where it fits:* This is the precise ontological status of your artifacts. The null column and the 250ms pause are spandrels. They are residues of the "architectural" history (deleted queueing layer, planned migration).
  *   *Where it fails:* "Spandrel" names the *thing*, not the *error*. You can correctly identify a spandrel without falling into the trap you described. Your cluster is about the *misidentification* of the spandrel as an adaptation.

  **3. Just-So Stories**
  *   *Definition:* Narratives that are plausible and explanatory but lack empirical evidence and are unfalsifiable.
  *   *Where it fits:* This captures Point #2 (arrives fast, plausible) and Point #3 (plausibility treated as confirmation). It also captures the unfalsifiability (Point #4).
  *   *Where it fails:* A Just-So story can be about anything. It doesn't inherently capture the specific *functional* nature of the error. I could tell a Just-So story about why the server is blue. Your phenomenon is specifically about *functional utility*.

  **4. Reification (specifically Functional Reification)**
  *   *Definition:* Treating a hypothetical or accidental construct as if it were a concrete, intentional entity.
  *   *Where it fits:* This captures the transition from "maybe this is for X" to "this *is* for X" in the documentation. It turns a guess into a load-bearing fact.
  *   *Where it fails:* It is a broad philosophical term. It lacks the systemic flavor of *why* this happens in engineering teams specifically (the pressure to optimize, the assumption of design intent).

  ### (c) The Best Fit and the Leftovers

  The single concept that fits the *logical structure* of the error best is **Adaptationism** (specifically, the **Panglossian Paradigm**).

  In biology, the Panglossian Paradigm is the tendency to assume every trait is an optimal adaptation. When a biologist sees a long neck, they assume it is for reaching leaves. They rarely ask, "Is this a structural consequence of having a large thorax?" Your engineers see a null column and assume it is for a migration. They rarely ask, "Is this a structural consequence of a schema change?"

  **However, Adaptationism leaves something out.**
  Adaptationism describes a cognitive bias in the observer. Your description includes a **sociotechnical feedback loop**. The story doesn't just stay in the head; it is written into onboarding notes (Instance 1) and copied into new schemas (Instance 1 & 2). This turns an epistemic error into an ontological constraint.

  The leftover part is the **solidification of the error**. Adaptationism explains why they *thought* it. It does not fully explain why the thought *became* infrastructure.

  ### (d) Coining a Term

  Since existing terms split the difference between the *error* (Adaptationism) and the *object* (Spandrel), but miss the *social solidification*, I propose a new term:

  **Term:** **Teleological Sedimentation**

  **Definition:** The process by which a structural artifact (a spandrel) is retrospectively assigned a functional purpose (a Just-So story), and that assignment is subsequently hardened into documentation, design patterns, or code dependencies, thereby converting an accident into a constraint.

  **Conditions for an Instance:**
  1.  **Origin:** The artifact originated from historical constraint, accident, or incomplete work (not deliberate optimization).
  2.  **Attribution:** A functional purpose is assigned post-hoc without evidentiary support (plausibility substitutes for verification).
  3.  **Sedimentation:** The attribution is recorded or encoded such that removing the artifact now requires dismantling the story, or new systems are built to match the story.

  **Boundary Cases:**
  *   **Looks like it, but is not:** A team documents a "reserved field" explicitly as "reserved for future use, currently unused."
      *   *Why it's not:* There is no false functional attribution. The purpose *is* to be empty. This is honest technical debt, not Teleological Sedimentation.
  *   **Is it, but doesn't look like it:** A developer hardcodes a value because they are lazy. Later, they document it as "tuned for performance." Later still, the system *actually* relies on that value for performance because other components tuned themselves to it.
      *   *Why it is:* The origin was laziness (constraint), the story was performance (false attribution), and it solidified. It doesn't *look* like the other cases because the story eventually became true (see section f), but the *origin* was still sedimented teleology.

  ### (e) The Diagnostic Question

  You asked how to distinguish a feature deliberately chosen for a purpose from a feature forced by arrangement. Biology has fought this war for 50 years. They use three main methods. Here is how they translate to backend engineering:

  **1. Phylogenetic Reconstruction (The "Git Blame" Test)**
  *   *Biology:* Compare the trait across related species to see when it appeared. If it appeared before the environment changed, it wasn't an adaptation to that environment.
  *   *Engineering:* Do not ask "Why is this here?" Ask "When did this appear?" Use `git blame` or commit history.
  *   *The Diagnostic:* If the commit message says "refactor" or "migration cleanup" rather than "optimize" or "fix," and the code around it changed significantly, it is likely a spandrel. If the value (e.g., 250ms) appeared as a direct consequence of deleting a variable (the queueing layer), it is a residue, not a choice.
  *   *Checkable Evidence:* Look for **negative evidence of choice**. Are there PR comments discussing *alternatives*? If the history shows the value was never discussed, only inherited, it is structural.

  **2. Knockout Experiments (The "Feature Flag" Test)**
  *   *Biology:* Disable the gene (knockout) and observe the organism. If fitness doesn't drop, it might not be an adaptation.
  *   *Engineering:* Can we nullify this artifact without breaking the build?
  *   *The Diagnostic:* In Instance 1, you checked if code read/wrote the column. That was the correct move. But go further: **Can we hide the column?** If the system runs identically with the column hidden from the application layer, it has no *current* function, regardless of its *original* intent.
  *   *Checkable Evidence:* **Independence.** A chosen feature usually has dependencies (validations, UI elements, logs). A structural residue often has *zero* dependencies other than its existence in the schema.

  **3. Comparative Anatomy (The "Pattern Match" Test)**
  *   *Biology:* If every mammal has a tailbone, but only some have tails, the bone is structural, not functional for tails.
  *   *Engineering:* Look at sibling services.
  *   *The Diagnostic:* In Instance 2, you noted the story was copied to services where "the numbers are different and the described mechanism does not apply." This is the smoking gun. If the *mechanism* (jitter) is the claimed function, but the *parameter* (250ms) varies without correlating to load, the parameter is structural.
  *   *Checkable Evidence:* **Parameter Sensitivity.** A chosen optimization usually has a "goldilocks" zone (too low = failure, too high = latency). A structural residue often works "well enough" across a wide range. If changing 250ms to 200ms or 300ms has no measurable impact, it is not a tuned parameter; it is a fossil.

  **Summary Diagnostic:**
  To make an origin story checkable, demand **evidence of selection**, not just **evidence of function**.
  *   *Uncheckable:* "This field is for migration." (Plausible function).
  *   *Checkable:* "This field was added in Commit X, where the author compared it to Option Y and chose Z." (Evidence of selection).
  *   *Rule:* If there is no record of a decision, there was no decision.

  ### (f) The Wrinkle: Self-Fulfilling Prophecy

  You asked: *Sometimes the invented purpose becomes true... Does this count?*

  This is a critical distinction. In philosophy of biology, this is the difference between **Adaptation** and **Exaptation**.
  *   **Adaptation:** Trait evolved *for* its current use.
  *   **Exaptation:** Trait evolved for one reason (or no reason), and was later co-opted for a new use.

  In your 250ms example:
  1.  **Phase 1:** The pause is a residue (Spandrel).
  2.  **Phase 2:** The story is invented (Teleological Sedimentation).
  3.  **Phase 3:** Engineers tune the system to rely on that pause (Exaptation).

  **Is it an instance of your phenomenon?**
  Yes, the *origin story* is still an instance of Teleological Sedimentation. The claim "This was chosen for jitter" remains false.
  However, the *current state* is now an **Exaptive Lock-in**.

  **Relationship:**
  Teleological Sedimentation is the *mechanism of error*. Exaptive Lock-in is the *consequence that validates the error*.
  This is dangerous because it makes the falsehood unfalsifiable. If you ask, "Is this needed?" the system now says "Yes." But the *reason* is wrong. It is needed *because we believed the story*, not because the physics of the system demanded it originally.

  **Does it count as different?**
  It is a second-order phenomenon.
  *   **First Order:** Inventing a purpose for an accident. (Teleological Sedimentation).
  *   **Second Order:** Tuning the system to make the invented purpose real. (Constitutive Myth).

  If you treat the Second Order as justification for the First Order, you commit the **Genetic Fallacy** (assuming current utility proves original intent). You must distinguish: "This is useful now" (True) from "This was designed for this" (False).

  ### Candor on "Sloppy Engineering"

  You asked me to be candid: **Is this just sloppy engineering?**

  Yes. But it is **systematic, cognitively rational sloppiness.**

  Asking "What is this for?" is a heuristic that saves time. It assumes the previous engineers were rational agents (The Intentional Stance). In 80% of cases, they were. Checking `git blame`, running knockout tests, and analyzing parameter sensitivity is expensive. Inventing a plausible story is cheap.

  Your teams are optimizing for **cognitive load reduction** at the expense of **epistemic accuracy**. They are trading truth for speed. This is rational for a startup moving fast; it is catastrophic for infrastructure that must last ten years.

  It is sloppy, but it is not *careless*. It is a cost-saving measure that has accrued interest. The "sloppiness" is in treating a heuristic (assume design) as a law (everything is designed).

  **Final Advice:**
  Do not try to stop your team from telling stories. They need them to understand the system. Instead, change the **epistemic status** of the stories.
  *   Label them: "Hypothesized Function" vs. "Verified Intent."
  *   Require a "Confidence Level" in documentation.
  *   Treat "We don't know" as a valid, stable state for a system artifact.

  In biology, we admit we don't know why the appendix is there. In software, we feel we must know why the column is there. Admitting ignorance is the only way to stop the sedimentation.
