answer: |-
  **TO:** Academic Board
  **FROM:** Chair, Professional Ethics Committee
  **DATE:** 24 October 2023
  **SUBJECT:** Decision Paper: Revision of Second-Year Ethics Module

  **1. Purpose**
  The Professional Ethics Committee seeks a decision on the pedagogical framework for the Academy's ethics curriculum. Specifically, the Board is asked to approve a staged integration of Revisionist Just War Theory into the programme, replacing the current proposal for immediate full adoption in Year Two.

  **2. Background**
  The current Second-Year Module utilises the Traditionalist framework (associated with Michael Walzer). This posits the moral equality of combatants: soldiers on both sides possess equal standing, provided they adhere to *jus in bello* (discrimination, proportionality). Liability is determined by conduct, not cause.

  A faculty coalition proposes replacing this with the Revisionist framework (associated with Jeff McMahan). This argues that moral standing tracks the justice of the cause (*jus ad bellum*); combatants fighting an unjust war commit wrongs even with clean conduct, and liability to attack is asymmetric.

  **3. Committee Deliberation**
  The Committee acknowledges the intellectual force of the Revisionist position. Teaching the Traditionalist view exclusively risks presenting a 'comfortable fiction' that fails to prepare officers for the moral complexity of modern strategic environments. Cadets deserve a rigorous understanding of the relationship between policy and conduct.

  However, the Committee also validates the significant operational risks identified by opposing members. First, individual adjudication of *jus ad bellum* by junior officers is practically unworkable and risks licensing selective disobedience based on incomplete information. Second, the Traditionalist symmetry supports mutual restraint; viewing the enemy as moral equals facilitates prisoner treatment and post-conflict reconciliation. Instilling a doctrine of asymmetric liability at the tactical level could be corrosive to force protection and compliance with the Laws of Armed Conflict (LOAC).

  **4. Recommendation**
  The Committee recommends **Adoption with Amendments**. We propose a staged model that distinguishes between professional compliance (Year Two) and strategic criticality (Year Four). This preserves the action-guiding clarity required for junior leadership while fulfilling the academic obligation to teach critical moral philosophy before commissioning.

  **5. Syllabus Specifics**
  The amended curriculum will be structured as follows:

  *   **Year Two (Professional Ethics Module):**
      *   **Framework:** Traditionalist (Walzerian).
      *   **Contact Hours:** 4 hours dedicated to *jus in bello* and LOAC compliance.
      *   **Rationale:** Cadets require unambiguous rules for conduct under fire. The moral equality of combatants remains the legal standard under International Humanitarian Law (IHL). Teaching this as operational doctrine ensures alignment with the Chain of Command and Geneva Conventions.
      *   **Assessment:** Practical scenario-based examination. Cadets are tested on applying Rules of Engagement (ROE) without reference to the justice of the conflict.

  *   **Year Four (Strategic Leadership Module):**
      *   **Framework:** Revisionist Critique (McMahan et al.).
      *   **Contact Hours:** 6 hours dedicated to critical ethics and the philosophy of war.
      *   **Rationale:** Senior cadets possess the maturity and contextual knowledge to analyse the disconnect between moral philosophy and military law without compromising discipline. This satisfies the demand for intellectual honesty.
      *   **Assessment:** 2,000-word reflective essay. Cadets must critique the Traditionalist view using Revisionist theory, demonstrating understanding of both without compromising their commitment to lawful conduct.

  **6. Addressing Counter-Arguments**
  Proponents of immediate Revisionist integration argue that delaying this truth constitutes intellectual dishonesty and fails the Academy's academic mandate. They contend that cadets are owed the 'true' morality of war from the outset.

  The Committee accepts that honesty is a core value. However, pedagogy requires sequencing. Presenting complex, contested moral philosophy to sophomores lacking operational context risks confusion between *what is legal* and *what is morally ideal*. By reserving the Revisionist critique for Year Four, we do not suppress the truth; we contextualise it. We ensure cadets first master the legal obligations they must obey as Lieutenants, before critiquing the moral foundations they will navigate as Captains. This protects the mutual-restraint mechanism essential for survival while still producing graduates capable of high-level ethical reasoning. To do otherwise risks creating officers who are philosophically correct but operationally hazardous.

  **7. Resource Implications**
  No additional funding is required. The shift involves reallocating existing contact hours within the Humanities Department. Staff development will be required to ensure instructors can delineate clearly between the normative legal standards (Year Two) and the critical philosophical critique (Year Four).

  **8. Decision Sought**
  The Academic Board is invited to vote on the following motion:

  *"That the Professional Ethics Committee's recommendation be approved: to retain the Traditionalist framework for Year Two professional compliance training, and introduce the Revisionist framework as a critical component of the Year Four strategic leadership curriculum, with assessment methods adjusted accordingly."*

  **Chair, Professional Ethics Committee**
