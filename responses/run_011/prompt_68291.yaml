answer: |-
  The Ledger sat on the counter like a tombstone, bound in leather that had absorbed the sweat of a thousand anxious palms. Mr. Vane, the Clerk, adjusted his spectacles and ran a finger down the column of Active Standing. The ink was fresh on most names, but beside them, in the marginalia of shame, were dates of expiration.

  "Next," Vane said, his voice dry as dust.

  The town hall was crowded, but the silence was heavy. In Oakhaven, blame was not an emotion; it was a jurisdiction. To accuse someone of a wrong required Standing. If you were caught doing the thing you accused another of, your name was struck from the Ledger. You became voiceless in matters of justice. It kept the town honest, theoretically. In practice, it kept the town quiet.

  Elara stood at the front. Her name was at the very top of the Active list. It had been there for thirty years. She had never lied to gain advantage. She had never stolen, not even a apple. She had never been cruel in anger. She was the Untouched. Today, she was the Only.

  "The matter is the grain shortage," Vane announced. "Storehouse Four is empty. Kael stands accused."

  Kael, a young man with dirt under his fingernails and fear in his eyes, stood beside the accused bench. He said nothing.

  "I saw him," said a voice from the crowd. It was Joren. He stepped forward, his coat worn thin at the elbows. "I saw him take the sacks. I saw him load the cart."

  A murmur went through the room. Everyone knew Joren. Five years ago, during a hard winter, Joren had skimmed oil from the communal lamps to heat his home. He had been caught. His name was red-lined. He had no Standing.

  "Joren," Vane said gently. "You are Red-Listed for Theft. You cannot assign blame for Theft."

  "It's true, though," Joren said, his voice cracking. "I know the weight of a sack. I know the sound of the lock picking. It was him. Doesn't the truth matter?"

  "The truth is separate from the Right," Vane said. He turned to the room. "Is there anyone else with Standing who witnessed this?"

  Silas stepped forward. He was a man who polished his boots until they shone like mirrors. He cared deeply about the Ledger, though mostly about who was in it and who wasn't. He wanted order. He wanted the machinery of justice to grind smoothly, because a grinding machine meant he knew where he stood.

  "I didn't see it," Silas said. "But the evidence points to Kael. I move to assume the blame. I will take responsibility for the accusation."

  "You cannot assume blame for a witness event you didn't see," Vane said.

  "I have Standing," Silas countered, his tone reasonable, almost pleading. "Elara is... overwhelmed. We all know she doesn't like this. Why should the weight rest on one pair of shoulders? Let me use my Standing. Let me be the voice."

  Elara looked at Silas. She saw the hunger in his eyes. It wasn't justice he wanted; it was the credential. He wanted to feel the power of the Ledger in his throat. He wanted to be the one who defined reality. If he blamed Kael, he reinforced his own purity. It was a transaction.

  "No," Vane said. "The witness is Joren. The Standing is Elara's. The truth belongs to one; the Right belongs to the other. They must converge."

  Vane looked at Elara. "You must speak the blame, Elara. Based on Joren's testimony. If you speak it, it becomes Fact. If you do not, Kael remains unblamed, and the town remains unsettled."

  Elara looked at Kael. He wasn't looking at her; he was looking at the floor. She looked at Joren. His eyes were bright with a desperate frustration.

  "You don't have to do it," Joren said to her, ignoring the protocol. "You know I'm right. But you... you've never been down here."

  Elara paused. "Down where?"

  "In the mud," Joren said. "You've never had to steal to eat. You've never had to lie to keep someone from hurting you. You stand up there, clean as snow, and you throw stones. But you don't know how heavy they are when they hit."

  The room shifted. People looked at their shoes. It was the unspoken tension of Oakhaven. The people with Standing looked down on the Red-Listed, but they also feared them. The Red-Listed knew what it cost to be human. The Untouched only knew what it cost to be perfect.

  "I am not throwing stones," Elara said softly. "I am maintaining the record."

  "You're handing out a sentence you've never served," Joren said. "If you blame him, he's out. He loses his vote. He loses his voice. And you? You go home to your clean house. You don't carry the weight of having ruined a man. You just carry the weight of being right."

  Silas shifted impatiently. "This is irrelevant. The protocol requires a verdict. Elara, please. The town needs closure."

  Elara felt the Ledger between them like a wall. She understood Joren's anger. It was the anger of a man who knows the map is wrong but isn't allowed to draw. He knew Kael was guilty. His accusation was factually accurate. But in Oakhaven, accuracy without Standing was just noise.

  Vane leaned over the Ledger. "Joren is correct about the facts, likely. But he is incorrect about the jurisdiction. It is a true thing that isn't yours to say."

  The phrase hung in the air. *A true thing that isn't yours to say.* It felt like a violation of nature, like seeing a bird drown or a fire freeze. Truth was supposed to be universal. Here, it was property.

  Elara looked at Kael again. If she spoke, he was ruined. If she didn't, the system broke. Silas wanted her to speak so he could feel safe. Joren wanted her to stay silent so she would feel the uncertainty he lived with every day.

  "If I speak," Elara said, "does it make him guilty? Or does it just make me the one who said it?"

  "It makes it Record," Vane said. "That is all we have."

  Elara took a breath. She felt the purity of her record like a hair shirt. It itched. She had never blamed anyone before because she had never been in a position where everyone else was disqualified. She had always been able to step back, let others handle the dirt. Now, the dirt was hers.

  She looked at Silas. He nodded encouragingly, eager for the ritual to complete. He wanted the world to be binary: Guilty or Innocent, Blamer or Blamed.

  She looked at Joren. He looked tired. He wasn't asking for mercy for Kael; he was asking for mercy for the concept of truth. He wanted her to acknowledge that her voice carried a weight his didn't, not because she was better, but because she was luckier.

  "I see him," Elara said. Her voice didn't shake. That was the worst part. It didn't shake. "I accept the testimony."

  "State the Blame," Vane said, pen hovering.

  Elara opened her mouth. The words were there. *I blame Kael for Theft.* Simple. Clean. Final.

  But she felt the hollowness of them. She was becoming a conduit for Joren's knowledge, sanitizing it through her purity. She was washing the blood off the knife so Silas could hold it without staining his hands.

  "I blame..." she started.

  Kael flinched. Joren closed his eyes. Silas straightened his coat, ready to mark another victory for Order.

  Elara stopped. The word *Kael* sat on her tongue, heavy and wet. If she said it, she remained Untouched. If she said it, she confirmed that the Ledger was the only truth that mattered. If she didn't, she stepped down into the mud with Joren, risking her name, her history, her identity.

  She looked at Vane. The Clerk waited, neutral as a stone. He didn't care about justice. He cared about the ink.

  "The grain is gone," Elara said.

  "Yes," Vane said. "But who took it?"

  Elara looked at her hands. They were clean. She had never had to dirty them to survive. But now, holding the blame, she realized they weren't empty. They were holding a stone. She could throw it, or she could keep holding it until her arm gave out.

  "I don't know," she said.

  The room gasped. Silas stepped forward, incredulous. "You heard Joren. You know the protocol. You cannot withhold if the evidence is presented."

  "I said I don't know," Elara repeated. Her voice was louder this time. "I wasn't there. Joren was. But Joren cannot speak. So the truth is here," she tapped her chest, "but the Right is here," she tapped the Ledger. "And they don't match."

  "You risk your Standing," Vane warned. "Refusal to adjudicate when qualified is a neglect of Duty. It can be grounds for removal."

  "Then remove me," Elara said.

  Silas looked horrified. "Don't be foolish. The system collapses without you."

  "Then the system was too thin," Elara said.

  She looked at Kael. He was watching her with confusion, not gratitude. He didn't want her pity; he wanted the truth to win. She looked at Joren. He wasn't smiling. He looked sad. He knew what she had done. She hadn't fixed anything. She had just broken the tool.

  Elara turned from the counter. The Ledger sat open, the ink wet, waiting for a name that wasn't coming. She walked toward the door. The weight of the blame she hadn't spoken pressed against her ribs, heavier than if she had spoken it. It was hers now. She had taken it from Joren, and she had refused to give it to Kael.

  She pushed open the heavy doors and stepped out into the light. Behind her, the town began to argue. In front of her, the road stretched out, muddy and uncertain. She walked into it, carrying the silence like a stone in her pocket.
