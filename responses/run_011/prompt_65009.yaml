answer: |-
  The studio offers a clarity the library often obscures. In the library, objects are definitions; in the studio, they are events. You have presented me with a puzzle of persistence that hinges on the difference between a vehicle and a voyage. The wax hare is a vehicle; the bronze hare is the voyage. When the wax is melted, the vehicle is scrapped. When the bronze is melted, the voyage is merely paused.

  To resolve the asymmetry you describe—where wax destruction feels final but bronze melting feels reversible—we must reject the idea that metaphysical identity is solely a matter of physical continuity. If it were, the wax and the bronze would stand on equal footing: both lose their form, both retain their matter (in some sense), both rely on the mould to regain shape. The difference lies not in the physics of the casting, but in the ontology of the artefact. An artefact is not merely matter arranged hare-wise; it is matter arranged hare-wise *by an agent for a purpose*. The purpose dictates the persistence conditions.

  Consider the three families of answer you requested, weighed against the heat of Ilse's kiln.

  First, the view that constitution is not identity (the Lump Theorist). This account holds that the "bronze lump" and the "hare" are distinct objects that coincide in space and time. When the hare is melted, the lump survives, but the hare ceases to exist. On this view, the Reprise is a new hare, numerically distinct from the original, made from the same lump. This aligns with the wax case: the wax lump is destroyed, the bronze lump created, the hare created. It is clean, logical, and utterly fails to capture the reality of the studio. It renders Ilse's confidence a confusion. It treats the hare as a ephemeral shadow cast by the bronze, rather than the primary reality the bronze is summoned to serve. If this view were true, conservation would be impossible; any restoration would be a replacement. I reject it because it privileges the physics of the material over the teleology of the work.

  Second, the view that persistence is sortal-relative. This suggests that "the hare" is an underdetermined description. Are we tracking the "bronze lump," the "sculpture," or the "work of art"? If we track the lump, it survives melting. If we track the sculpture, it dies. This account dissolves the problem by claiming there is no fact of the matter until we choose a concept. But there *is* a fact of the matter in the studio. Ilse does not say, "Under the sortal 'work', this is the same hare." She says, "This *is* the hare." The practice of the art world—insurance, cataloguing, provenance—treats the work as a persistent individual that can survive certain traumas but not others. Sortal relativity makes identity too fragile, dependent on the observer's vocabulary rather than the object's history.

  Third, the hylomorphic view: matter informed by structure. Here, the artefact is a compound of matter and form. When the form is lost (melting), the compound ceases. When the form is reinstated, a new compound arises. This explains the wax case well (wax matter loses wax form, gains bronze form). But it struggles with the Reprise. If the compound ceases when melted, the Reprise is a new compound. To save the identity, the hylomorphist must argue that the "form" exists potentially in the mould and the artist's mind during the melting interval. This is plausible, but it risks making the form too abstract, detached from the physical object.

  I propose a fourth account, which I find most robust: **Causal-Intentionalism**. On this view, the identity of an artefact is fixed by the causal history of its production and the sustaining intentions of its maker (or custodians). Artefacts are not natural kinds; they are institutional kinds created by acts of will.

  Here is how Causal-Intentionalism resolves your asymmetry. The wax replica was never intended to be the hare. It was intended as a *sacrificial precursor*. Its causal role was to generate the mould, not to be the work. Therefore, its destruction is not the death of the hare, because it was never the hare. It was the skin shed by the work before birth.

  The bronze hare, however, was intended to be the work. When Ilse melts it down, she does not intend to destroy the work; she intends to *restore* or *maintain* it. In the context of artistic practice, certain interruptions in physical continuity are permissible if the causal chain of intention remains unbroken. The mould, the hand, the alloy, and the intention link the Reprise to the Original. The matter persists, but more importantly, the *history* persists. The melting is viewed as a maintenance procedure, akin to a ship having its planks replaced, rather than a destruction. The wax melting was a genesis procedure; the bronze melting was a conservation procedure. The physical description matches, but the causal description does not.

  Therefore, my verdict is this: **The Reprise is identical with the original hare.** It is not a copy. It is the same individual object that underwent a temporary loss of form, sustained by the artist's intention to preserve its identity through the process.

  This account also settles your variant case. Suppose Ilse casts the Reprise from the fire-blob's bronze (the matter of the destroyed hare) rather than the survivor's matter. She uses the same mould, same hand, same intention to recreate the "Surviving Hare." What does she have?

  On the Causal-Intentional view, she has a **copy**, not the original survivor. Why? Because the identity of an editioned artefact (numbered hares) is tied to the specific causal history of that token. Hare 1 and Hare 2 were distinct individuals from the moment of their first casting, distinguished by their matter and their specific history (one burned, one survived). Even if the form is identical, the matter carries the causal history of the specific token. To make the "Surviving Hare" out of the "Destroyed Hare's" matter is to cross the streams of history. You cannot resurrect Hare 2 using the corpse of Hare 1, even if they look identical. The load-bearing ingredient here is **Causal History**, specifically the lineage of the matter token relative to the original casting event. The mould and intention are necessary, but not sufficient, when distinct original tokens are in play. The matter anchors the specific history.

  What would change my mind? If Ilse had sold the hare to a collector, and the collector melted it down without her consent to recast it. In that case, the chain of artistic intention is broken. The object becomes the property of the owner, who may destroy the work to create a new one. The Reprise would then be a copy, because the authority to sustain the work's identity through melting resides with the creator (or the institution preserving the creator's intent). If the agent melting the bronze does not hold the authority to sustain the work's identity, the work dies.

  Where is my reasoning weakest? I am least able to defend the premise that **intention can sustain existence during a period of formlessness.** This borders on the mystical. To claim that an object exists when it is a puddle of liquid because someone *intends* it to exist is to privilege mind over matter in a way that physicalists will find untenable. It requires us to accept that artefacts have a mode of existence that is partially normative rather than purely physical. If pressed, I must concede that there is a limit to this interval; if Ilse waited fifty years to recast, or if the mould were lost and remade, the claim of identity would weaken. The "gap" cannot be infinite, yet I have no non-arbitrary metric for where the intention snaps.

  In the end, the studio teaches us that objects are not just what they are made of, but what they are made *for*. The wax was made to die. The bronze was made to live. When the bronze dies to live again, it is not a copy; it is a phoenix. The wax is merely the wood on the pyre.

