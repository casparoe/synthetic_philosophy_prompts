      *   *Watch out:* Make sure the KD doesn't look like a monster. KD is protecting Margaret's right to be dependent if she chooses.
      *   *Watch out:* The "Independent Normative Content" check. If CE just says "Autonomy is good," it fails. CE must say "The *relation* is distorted." The verdict is about the *practice of caring*, not just the outcome.

  7.  **Final Polish:** Check against the "cheating" clause. If the CE verdict is just "Maximize autonomy," it's Kantianism in disguise. The CE verdict must be "This is no longer caring." The distinction is ontological (what is care?) vs Deontological (what is duty?).

      *(Self-Correction on the "Single Feature"):* The feature is the **motivational displacement reversal**. The carer's need to care is driving the cared-for's compliance.

      *(Final Verdict Nuance):* It is risky. A strong KD could argue "Respect her choice to be cared for." The CE advantage is seeing the *dynamic* rather than the *snapshot*.

      Let's write it.

