      *   **KD Attack:** "You are claiming to know Margaret's 'true' will better than she does. That is the definition of paternalism. You are sacrificing her stated wishes for Elena's moral purity."
      *   **Final Verdict:** Did CE do independent work?
          *   *Honest Check:* Is this just "Real Autonomy" vs "Stated Autonomy"? That sounds like Mill (Utilitarian) or Kant (Ideal Agency).
          *   *Differentiation:* Care ethics focuses on the *relation* as the unit of analysis, not the individual agent's will. The harm is to the *caring relation*, not just Margaret's autonomy. The verdict arises from the failure of "reception" (Noddings).
