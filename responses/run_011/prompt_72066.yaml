      *   *Accidents:* If it's just a bad year + low priority, the Ops Manager is right. Fighting won't fix the mill's errors, it just burns bridges.
      *   *The Clue:* The *pattern* since March (slower samples, slower replies, smaller credits). This suggests *de-prioritization* rather than active malice. It's likely "resource allocation" rather than "testing." They are moving resources to accounts with future potential.
      *   *Impact on Strategy:* If it's de-prioritization, a fight might make you a "high maintenance/low value" account, worsening the de-prioritization. If it's testing, a fight stops it. The evidence points slightly more to de-prioritization (the "zombie account" effect).

