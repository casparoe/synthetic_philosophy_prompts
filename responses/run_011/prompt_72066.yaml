      *   *User's Question:* Does knowing the end is 11 months away make slippage sensible for them and patience sensible for me, recursively back to today?
      *   *Theory:* This is a "Finite Horizon Game" in game theory. In a strictly rational model, cooperation collapses immediately before the end. If period $T$ is the last, defection is optimal. If both know period $T$ is defection, period $T-1$ becomes the last *cooperative* period, so defect then, etc. This leads to immediate defection (the "Chainstore Paradox" or similar end-game effects).
      *   *Reality Check:* Real business isn't strictly rational or isolated. Reputation matters. Reps have careers. Industries are small.
      *   *Verdict:* The "tidy" reasoning is *too* tidy. It ignores reputation capital and the human element (reps needing references, merchants wanting to avoid being known as the guy who burns clients). However, the *pressure* is real. Service often dips on exiting accounts.

