      *   *Section 4: The Test.* How to check priority without revealing. (e.g., The "Phantom Rush" or comparing their performance against market standards).
      *   *Section 5: Recommendation (The Synthesis).* Don't deduct unilaterally (too risky). Don't be passive (too costly). Formalize the claims.
      *   *Constraint Check:* Be plain about confidence/guessing. Name the disputable point at the end.

      *(Self-Correction during drafting)*: I need to be careful not to give legal advice. The accountant suggested deducting from the invoice. In many jurisdictions, this is "self-help" and can be risky if the contract doesn't explicitly allow set-off. I should highlight this risk as a point of uncertainty.
      *(Refining the "Test")*: The user wants to know if they are being tested. If I suggest a test, it needs to be subtle. How about ordering the same item twice, once marked "Standard" and one marked "Required for [Date]" where the date is tight but reasonable? If the "Required" one gets the same treatment as "Standard," you know they aren't prioritizing you.
      *(Refining the "Disputable Point")*: What would a better-informed person dispute? Probably the assessment of the merchant's motivation. An industry insider might know this merchant is notoriously litigious or notoriously soft. Or they might dispute the legal viability of the deduction. I'll choose the motivation/industry norm aspect.

  8.  **Final Polish:** Ensure tone is respectful, analytical, and direct. Avoid "You should." Use "The analysis suggests."

