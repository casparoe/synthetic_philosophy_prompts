answer: |-
  The kitchen was black except for the beam of the torch clenched in Jon's teeth. He held the beam steady on the open fuse box while Mara crouched, screwdriver in hand.

  "If the fuse didn't blow," Mara said, voice muffled by the effort of turning a screw, "the switch is dead."

  She straightened up. The fuse was blown. She replaced it. The lights flickered on. She squinted, then rubbed her eyes.

  "Now I'm thinking," she said, "if the fuse hadn't blown, the switch would have been dead. And that feels like a lie. If the fuse hadn't blown, the lights would just work."

  Jon took the torch out of his mouth. "Exactly. That's the point. You just proved there are two different animals here. The first one was an indicative conditional. You were uncertain. The second one is a subjunctive. You're rewriting history. They look the same, but they function differently."

  "That's lazy," Mara said, wiping grease off her hands. "It's one animal. 'If' means the same thing. The difference isn't in the word, it's in what we're holding fixed. When I said the first one, I didn't know the fuse state. When I said the second, I did. I just shifted the set of possible worlds I'm comparing."

  "Shifted them how?" Jon asked. "Be specific. Don't just wave at 'worlds'."

  "I fixed the past," Mara said. "In the first case, I'm looking at all the worlds compatible with what I knew then. In some, the fuse is fine. In those worlds, is the switch dead? Yes. In the second case, I know the fuse blew. So I'm looking at worlds where the fuse didn't blow—but everything else is as close to actuality as possible. In those worlds, the wiring is fine, so the lights work. The meaning of 'if' didn't change. Your access to the facts did."

  "But that makes the second sentence false," Jon said. "You said 'if the fuse hadn't blown, the switch would be dead.' But in those closest worlds, the switch is fine. So you uttered a falsehood. But you didn't feel like you were lying. You felt like you were correcting a thought process. That's because the first 'if' wasn't stating a fact at all. It was a supposition. You were saying: 'Suppose the fuse is fine. How likely is the switch dead?' High. So you said it. The second one is a claim about causal dependencies. You're trying to force one word to do two jobs."

  "And you're trying to force one language to have two logics," Mara countered. "Look, try negating your version. 'It is not the case that if the fuse didn't blow, the switch is dead.' If your 'if' isn't true or false, what are you negating? You're negating my assertion? My belief? That breaks reasoning. If I say 'The fuse blew. If the fuse blew, the wiring's shot. Therefore the wiring's shot,' that's valid. Modus Ponens. It works because the 'if' sentence carries a truth value. If it's just a bet on odds, how does it function as a premise?"

  Jon winced. "Okay, that's the hard bit. I'll grant you embedding is messy. But don't act like your view doesn't have a body count. What about 'If that noise upstairs is a burglar, I'll eat my hat'?"

  Mara smiled. "Classic."

  "I say that when I'm sure it's *not* a burglar," Jon said. "On my view, asserting 'If A, then C' requires a high conditional probability of C given A. But my probability of eating my hat given a burglar is nil. I'm not going to eat a hat. So by my own rules, I shouldn't be able to say that sentence. But I do. And everyone understands me. How do you explain that without admitting my rules are wrong?"

  "I don't have to explain it," Mara said. "On my view, that sentence is simply false. Or rather, it's a hyperbolic way of asserting the antecedent is false. It's a speech act disguised as a conditional. But that doesn't prove 'if' lacks truth conditions. It just proves people are dramatic."

  "But it proves you can't link assertion to truth," Jon pressed. "If I believe the antecedent is false, I shouldn't be asserting a conditional connection. I'm using the 'if' to signal confidence in the 'not'. That fits the suppositional view better: I'm inviting you to suppose a burglar, and seeing that the consequence (hat-eating) is absurd, you reject the supposition. It's a reductio. But you— you have to say I'm stating a falsehood. That feels wrong. I'm communicating something true, which is 'There is no burglar'."

  "You're communicating something true by stating something false," Mara said. "That happens all the time. But let's go back to the math. You know Lewis's triviality result. If conditionals have truth conditions, and their probability equals the conditional probability $P(C|A)$, then language collapses. You can't have both."

  "I know the theorem," Jon said. "It says if you treat 'if' as a proposition, you can't match our intuitive judgments about probability. So I drop the proposition. You keep the proposition and tell me our intuitions about probability are wrong. That's a costly ticket."

  "It's less costly than breaking logic," Mara said. "If 'if' isn't a proposition, what happens when I say 'Maybe if the fuse blew, the wiring is shot'? What is the 'maybe' modifying? It needs a proposition to attach to. You're left saying 'maybe' modifies your own confidence. But then I can't report what you said. I can't say 'Jon said that if the fuse blew, the wiring is shot.' I have to say 'Jon said he was confident...' That changes the content. It makes communication impossible."

  Jon shifted the torch beam. "It doesn't make it impossible. It makes it precise. When you tell me an 'if' sentence, you aren't giving me a fact about the world. You're giving me a constraint on my beliefs. You're telling me: 'Don't believe A without believing C.' That's information. Just not truth-conditional information."

  "But when I learn it," Mara said, "I update my map of the world, not just my confidence. If you tell me 'If it rains, the match won't light,' and I later find out it rained, I expect the match not to light. I treat it as a fact about the match. If it was just about your brain, why does it predict the physical world?"

  "Because your brain and the world correlate," Jon said. "Look, I'll concede the embedding point. It's the hole in my boat. I need a semantics for 'not' and 'maybe' that doesn't rely on truth values. I'm working on it. But you have a hole too. You owe me an explanation of the fuse case that doesn't feel like cheating. You say the word is the same, but the truth conditions flip based on what I know. That makes truth subjective. If I know the fuse is fine, your sentence is true. If I know it blew, it's false. That means the sentence doesn't have a stable truth value. It depends on the speaker's ignorance."

  "It depends on the context," Mara corrected. "Indexicals work like that. 'I am here' is true when you say it, false when I say it. Is 'I' two different words? No. 'If' is sensitive to the salient facts. When the fuse blows, it becomes salient. The closest worlds shift. It's not subjective; it's contextual."

  "Contextualism," Jon scoffed. "That's just 'two animals' in a suit. You're saying the meaning changes with context. I'm saying the meaning changes with grammar. Indicative vs. Subjunctive. It's cleaner."

  "It's not cleaner, it's fragmented," Mara said. "And you still haven't answered the negation problem. If I say 'It's not the case that if the fuse blew, the wiring is shot,' I am denying a connection. If you're right, I'm denying... what? Your bet? That makes negation a meta-commentary. 'I deny you should bet that.' But sometimes I mean 'The wiring is fine regardless.' I'm describing the circuit, not your gambling habits."

  Jon fell silent for a moment, looking at the fuse box. "I owe you a logic of suppositions. A way to handle embeddings without truth values. I know. But you owe me an account of why the 'Eat My Hat' case doesn't destroy your truth-conditions. If I assert a falsehood to communicate a truth, why is the falsehood structured exactly like a conditional? Why not just say 'There is no burglar'? Because the 'if' does something specific. It handles uncertainty. And when there's no uncertainty, the 'if' changes species. I feel that change. You just paper over it with 'context'."

  "I feel the change too," Mara said. "But I don't need to multiply meanings to explain it. I just need to acknowledge that knowledge changes the landscape of possibility."

  "Knowledge changes the landscape," Jon repeated. "But logic requires the landscape to stay still while we reason across it. If the truth of 'if' moves when I learn the fuse blew, then Modus Ponens breaks mid-argument. I start with a true premise, learn a fact, and suddenly my premise is false. That's not reasoning. That's shifting goalposts."

  "Then give me a logic that works without truth," Mara said. "Show me how to derive conclusions from bets."

  "Show me how to bet on a proposition that doesn't exist," Jon countered.

  They stood in the hum of the refrigerator. The lights buzzed slightly.

  "I owe you the negation account," Jon said finally. "I need to show how you deny a supposition without calling it false. I think I can do it with commitment norms. But I'm not there yet."

  "And I owe you the stability account," Mara said. "I need to show why the truth conditions don't feel like they're sliding under our feet when we learn new facts. I think it's in the pragmatics, not the semantics. But I haven't pinned it down."

  "Then we're stuck," Jon said.

  "We're stuck," Mara agreed. She reached out and clicked the light switch off and on. "But the lights work."

  "For now," Jon said. He put the torch back in his teeth. "Until the next fuse blows."
