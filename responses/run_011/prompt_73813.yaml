answer: |-
  ### Part 1: The Scenario

  The City Harbor Authority owns "The Vigilant," a decommissioned fireboat docked at Pier 4. Following the death of a wealthy benefactor, the Authority receives a $2 million endowment from his estate, legally stipulated for the "maintenance and preservation of the Fireboat Vigilant." The will specifies that if the Fireboat ceases to exist, the funds revert to the benefactor's heirs. Over a period of five years, facing high maintenance costs and no need for fire services, the Authority gradually converts the vessel into a stationary floating restaurant. The engines and pumps are removed and sold for scrap immediately; the hull is reinforced to remain permanently moored; the crew quarters are remodelled into a kitchen and dining area; and the vessel is re-registered with the health department as a commercial structure rather than with the coast guard as a vessel. At no point are the removed parts stored or used to build another boat; they are destroyed or melted down. When the conversion is complete, the physical object at Pier 4 is continuous with the original fireboat, but it is now functionally and legally a restaurant. The heirs sue to reclaim the endowment, arguing the Fireboat no longer exists. The Authority argues the object survived the conversion and is entitled to the funds.

  ### Part 2: Specification Check

  **Constraint: Ordinary Artifact, No Duplication, Rivalry-Free**
  The object is a fireboat, an ordinary artifact. The story contains no copying, scanning, or time travel. Crucially, the removed parts are scrapped immediately, ensuring that at no moment does more than one candidate object exist. This is a **rivalry-free** case. There is no second ship built from the old planks, no teletransporter duplicate, and no stored parts waiting to be reassembled.

  **Constraint: Change of Kind**
  The object undergoes a transformation from a "Fireboat" (a vehicle designed for emergency mobility and pumping) to a "Restaurant" (a stationary structure designed for hospitality). This is not merely a change of properties but a change in the institutional and functional kind the object falls under, recognized by real bodies (Coast Guard vs. Health Department).

  **Constraint: Real Stakes**
  The decision turns on a legal bequest. The question is not merely semantic; it determines the ownership of $2 million. The question cannot be dissolved by rephrasing because the legal contract hinges on the persistence condition of the named object ("The Fireboat Vigilant").

  **Verdict 1: The Closest-Continuer Account**
  *   **Verdict:** The object survives.
  *   **Reasoning:** This account holds that identity over time is determined by spatiotemporal continuity and causal connection. Typically, it employs a ranking mechanism to select the "closest" candidate when multiple rivals exist. However, in this **rivalry-free** scenario, there is only one candidate object at the end of the process. Because the transformation was gradual, there is no break in the spatiotemporal career of the object. Since there are no competitors to compare against, the ranking machinery runs idle. The single candidate is trivially the closest continuer by default. The account prioritizes the continuity of the physical career over the shift in functional properties when no rival challenges that continuity. Therefore, the Fireboat survives as the Restaurant.

  **Verdict 2: The Sortal-Relative Account**
  *   **Verdict:** The object does not survive.
  *   **Reasoning:** This view holds that identity conditions are supplied by the sortal or kind concept under which the object falls. To say "$x$ at $t_1$ is identical to $y$ at $t_2$" is incomplete; one must say "$x$ is the same *Fireboat* as $y$." Identity is relative to the kind. If $y$ does not fall under the sortal "Fireboat," then $x$ cannot be identical to $y$ *as a Fireboat*. Since the object at $t_2$ is a Restaurant and lacks the essential properties (mobility, pumping capacity, vessel registration) required to be a Fireboat, the sortal conditions are violated. The original object ceased to exist when it ceased to be a Fireboat, even if the matter persists. Therefore, the Fireboat does not survive.

  ### Part 3: Engineering Report

  **The Feature Doing the Work**
  The single feature driving the divergence in verdicts is the **decoupling of spatiotemporal continuity from sortal membership** within a **rivalry-free** context. The case isolates continuity as the only metric available to the Closest-Continuer account (since there is no rival to trigger a comparison of properties), while simultaneously forcing the Sortal-Relative account to prioritize kind-membership over continuity. The gradualness of the change ensures continuity is preserved for the former, while the final functional state ensures kind-membership is lost for the latter.

  **Sensitivity Analysis: Removing Features**
  *   **If removed parts were kept in a warehouse:** The case would no longer be **rivalry-free**. A rival candidate could be constructed from the stored parts. The Closest-Continuer account would then have to activate its ranking machinery to weigh the continuous hull against the reassembled original parts. The verdict might shift, and the "default" survival claim would be lost.
  *   **If the change happened overnight:** Spatiotemporal continuity would be severely disrupted. The Closest-Continuer account might judge the discontinuity too great for identity to hold, even without rivals. The verdicts might converge on "does not survive," failing to test the hypothesis.
  *   **If a genuine rival candidate were introduced:** The Closest-Continuer account would no longer operate by default. It would have to weigh the degree of continuity against the degree of kind-retention. This would return us to the standard Ship of Theseus tiebreaking problem you wish to avoid.

  **The Closest-Continuer Defender's Attack**
  A defender of the Closest-Continuer view will likely attack the claim that their machinery runs idle. They will argue that "closeness" is not merely spatiotemporal but is inherently kind-relative. They will insist that a "continuer" must be a continuer *of the same kind*. On this reading, if the object stops being a Fireboat, it stops being a continuer of the Fireboat, regardless of whether there are rivals. They will argue that I have presented a straw man of their view by stripping kind-membership out of the continuity relation. They might claim that the sortal point does not merely change the subject but defines the very track along which continuity is measured.

  **Can They Repair Without Collapsing?**
  The defender might attempt to repair the view by making "closeness" kind-relative without fully collapsing into the Sortal-Relative view. They could argue that kind membership is a *weighting factor* in the closeness metric rather than a strict precondition. However, if kind membership becomes a necessary condition for identity (as the Sortal-Relative view demands), the Closest-Continuer account loses its distinctive ability to handle cases where kind properties shift gradually. If they concede that kind is just one weight among many, they preserve their view but admit that identity can survive sortal change, which contradicts the Sortal-Relative verdict. If they make kind absolute, they effectively adopt the Sortal-Relative view's core constraint, rendering the "Closest-Continuer" label redundant in **rivalry-free** cases.

  **Final Verdict on the Account**
  This **rivalry-free** case **embarrasses** the Closest-Continuer account rather than refuting it. It exposes that the account's reliance on "closeness" is ambiguous: is it a measure of physical continuity or a measure of essence retention? In the absence of rivals, the account must rely on physical continuity to generate a verdict, which leads to counterintuitive results (a Fireboat is a Restaurant). It complicates the view by showing that its tiebreaking mechanism is not merely a supplement to identity conditions but may be doing all the work in masking the tension between continuity and kind.

  **Confidence Levels**
  *   **Mapping (Scenario to Constraints):** High Confidence. The case is strictly **rivalry-free**, involves a clear sortal shift, and has real stakes.
  *   **Sortal-Relative Verdict:** High Confidence. Strict sortalism cannot accommodate kind change without ceasing to be sortalism.
  *   **Closest-Continuer Verdict:** Moderate Confidence. This depends on interpreting the view as prioritizing spatiotemporal continuity when no rivals exist.
  *   **Least Sure Point:** The claim that the Closest-Continuer account is *forced* to say the object survives. A sophisticated defender will argue that "continuity" is conceptually tied to the sortal from the start. This is precisely where your adviser will push hardest, arguing that there is no such thing as "raw" continuity independent of the kind of thing persisting. If continuity is sortal-indexed, the Closest-Continuer account agrees with the Sortal-Relative account, and your hypothesis that "closeness is merely a tiebreaker" is undermined.
