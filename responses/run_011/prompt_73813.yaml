  I am a senior doing a year-long independent study in philosophy on persistence and identity, and I have hit a wall that I would like your help getting past. I have now read enough about the Ship of Theseus that the standard version teaches me nothing: planks are replaced one at a time, someone gathers the old planks and rebuilds, and the entire discussion immediately retreats into arguing about which of the two candidates is closer to the original. My suspicion, which I want to test, is that the rivalry between the two ships is doing all of the work and that the famous puzzle is really a puzzle about tiebreaking. So please take on the role of a professional metaphysician who specializes in identity over time, think carefully before answering, and if it helps, sketch two or three candidate designs in a short brainstorm before committing to one. Do not give me any bibliography, reading list, or attribution to particular philosophers or books — I have no way to check them, and I would much rather the analysis come from the content of the views themselves. What the case is *for*, so you know what would count as cheating: I want to find out whether the notion of "closeness" in the closest-continuer account of identity is doing genuine metaphysical work or whether it is merely a tiebreaker that goes vacuous as soon as there is nothing to compare. A scenario that simply announces the verdicts I ask for, rather than generating them from what each view independently says, fails.

  Here are the specifications. The object must be an ordinary artifact rather than a person, and the story may contain no duplication, no teletransporter, no scanner, no copying, and no time travel; nothing may be set aside, stored, archived, or preserved anywhere, so that at no moment does more than one candidate object exist — call such a case rivalry-free, and please use that term consistently. Something happens to the object that changes what kind of thing it is, so that it stops falling under the sortal it originally fell under while continuing to exist as something else (I have been mulling a pipe organ converted module by module into an electronic instrument, and a decommissioned lighthouse left standing as a monument, but you may take one of those or find a better instance), and the transformation must be one that real institutions actually perform rather than anything science-fictional. Then the two verdicts I want, and I want them to fall out of the theories rather than be stipulated: the closest-continuer account must be forced by its own logic to say that the object survives, and it must reach that verdict *by default*, with its ranking machinery running idle because there is no competitor to rank, while the view that identity is always relative to a sortal or kind — the view on which the criteria of identity are supplied by the kind a thing falls under — must say that the original object does not survive the change. There must also be real stakes: someone in the story has to make a decision that turns on the identity claim (a bequest, a charter, an insurance settlement, a promise, a bet), and that decision must not be dissolvable by merely rephrasing the question.

  Please deliver this in three parts. First, the scenario itself in a single paragraph — concrete, realistic, and free of philosophical vocabulary, so that a classmate in my debate club who has never studied metaphysics can follow it. Second, a specification check: go through my requirements one at a time and show that the case meets each, stating explicitly what the closest-continuer account says about the object and why, what the sortal-relative account says and why, and why the first verdict is reached without any comparison of candidates. Third, an honest engineering report — which single feature of the case is doing the work; what happens to the verdicts if you remove it (for instance, if the removed parts are kept in a warehouse rather than destroyed, or if the change of kind happens overnight instead of over decades, or if a genuine rival candidate is introduced); how a defender of the closest-continuer view would attack my case, whether by denying that a change of kind threatens identity at all, by insisting that the sortal point merely changes the subject, or by some other route; and whether that defender can repair the case by making "closeness" itself kind-relative without thereby collapsing into the sortal view he is trying to resist. Close with your verdict on whether a rivalry-free case of this sort refutes, embarrasses, or merely complicates the closest-continuer account, and tell me how confident you are in each of your main claims — the mapping, the two verdicts, and the diagnosis — singling out the one point you are least sure of, because that is precisely where my adviser will push hardest.
