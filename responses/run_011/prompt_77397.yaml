  **MEMORANDUM**

  **TO:** The General Synod and Budget Committee
  **FROM:** Rev. Dr. Elias Thorne, Director of Membership, Stewardship and Mission Effectiveness
  **DATE:** 14 October 2024
  **SUBJECT:** FY2025 Budget Review and Strategic Retention Outlook

  **1. Executive Summary**
  Our universal service obligation remains our core differentiator in a fragmented spiritual marketplace. While the separationist model of the Republic of Cislavia treats faith as a private association, their public calendar remains structurally dependent on our liturgical year, representing significant market share we do not subsidize. Conversely, the Commonwealth of Transia maintains legislative chaplains and currency mottos without establishment, creating brand confusion. Our value proposition relies on bundling the full lifecycle: from automatic newborn enrolment to statutory burial services. However, friction in the revenue collection model requires optimization.

  **2. Revenue and Churn Analysis**
  The payroll levy, currently set at 8.5% of income tax and collected by the National Revenue Service, provides stable baseline income. However, we observe a critical churn event: the "First Paycycle Spike." Data indicates 14% of users aged 21–25 initiate cancellation proceedings upon noticing the deduction on their first payslip. The current cancellation protocol—personal declaration at a district court during weekday business hours, accompanied by a processing fee and notarised written declaration—creates necessary friction, but legal counsel advises we cannot increase the fee without legislative approval.

  Demographically, we are managing a large cohort of "Seasonal Active Users" who engage only at the Midwinter Festival and life-cycle events. Additionally, the "Believing-Not-Belonging" segment is growing. These users value the brand but resist the subscription model. Reactivation campaigns focusing on à la carte pricing for weddings have shown limited success; users prefer the bundled package but resent the mandatory levy.

  **3. Governance and Product Development**
  Governance friction persists regarding episcopal appointments. While the Crown remains the formal Head, appointments made on the advice of the Head of Government over the Nominating Committee's objections have depressed volunteer morale in affected dioceses. Furthermore, our twenty-six bishops sitting in the Upper Chamber by right provide legislative access, yet this exposes our prayer book revisions to parliamentary amendment. The recent mandate to include specific civic language in the liturgy was a brand dilution event, though it secured state funding for heritage maintenance.

  **4. Strategic Recommendations**
  We must reframe the levy not as a tax but as a membership due for universal coverage. Our clergy's statutory duty to marry and bury any resident, member or not, is a unique selling point for national cohesion, but it blurs the line between customer and citizen. We cannot exclude non-payers from burial grounds without violating our charter, yet this reduces the incentive to remain subscribed. We propose emphasizing the state rites—coronations, national memorials—as premium content unavailable in the voluntary sector. Plural establishment, extending recognition to other bodies, is rejected as a product-line extension that dilutes the brand identity. We remain the utility of the soul; stability requires maintaining the monopoly while improving customer service at the registry office.

  **Key Performance Indicators (Dashboard)**

  | Metric | FY2023 Actual | FY2024 Target | Notes |
  | :--- | :--- | :--- | :--- |
  | **Net Retention Rate** | 94.2% | 95.0% | Excluding deceased |
  | **Levy Yield per Capita** | $420.00 | $435.00 | Adjusted for inflation |
  | **Cancellation Processing Time** | 45 Days | 30 Days | Court backlog reduction |
  | **Legislative Seat Occupancy** | 26 / 26 | 26 / 26 | Upper Chamber presence |
  | **Sacramental Conversion** | 12.5% | 15.0% | Baptism to active donor |
  | **Young Cohort Churn** | 14.0% | 10.0% | Ages 21–25 |

  ***

  **MEMBER CANCELLATION FAQ**

  **Q: What happens if I stop paying the levy but keep believing?**
  A: Belief is a matter of conscience and requires no administrative validation. However, the levy supports the infrastructure of the Church, including clergy stipends and building maintenance. If you cease payment, you remain a believer in good standing spiritually, but you will be classified as "Inactive" in our registry. You will not receive official membership certificates or voting rights in parish councils. We encourage you to continue supporting the mission financially even if you opt out of the statutory collection mechanism.

  **Q: Does leaving affect eligibility for the sacraments and for burial in the churchyard?**
  A: Eligibility for sacraments such as Holy Communion is generally reserved for confirmed members in good standing, though clergy retain discretion in emergency situations. Regarding burial, the Church operates under a statutory duty to provide interment in the churchyard for any resident of the parish, regardless of membership status or payment history. This ensures universal coverage for all citizens. However, priority for specific plot locations is given to contributing members. Non-members may be interred in designated sections subject to availability.

  **Q: How does automatic enrolment of newborns work and at what age may a member cancel in their own right?**
  A: Infants are automatically enrolled upon baptism or civil registration where the parents are members. This ensures continuity of care and community integration from birth. Minors are bound by the membership status of their guardians. An individual may exercise their right to cancel their own membership upon reaching the age of majority (18 years). At this point, they must follow the standard cancellation procedure: appearing in person at a district court or registry office during weekday business hours, submitting a notarised written declaration, and paying the applicable administrative fee.

  **Q: Isn't it unfair that non-members still use your services?**
  A: It is understandable that contributing members might feel inequity when non-members utilize our facilities without financial contribution. However, the Church's mandate is to serve the entire nation, not solely its subscribers. Our presence in every village and our availability for state rites and burials ensures that no citizen is left without spiritual coverage, regardless of their personal choices. This universal access is the primary justification for the establishment system. Since we are required by law to serve everyone anyway, it is vital that those who value this national infrastructure remain enrolled to sustain it.
