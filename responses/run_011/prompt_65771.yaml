  **Rule 1: The "Constitutive Logic" Principle**
  *Statement:* An institution survives only as long as the specific mechanism generating its legitimacy and cohesion remains operational and uncontradicted by the distribution of power. If the *source* of authority shifts (even legally), the institution is dead; if the *procedure* for adaptation remains intact, radical content changes count as survival.
