answer: |-
  Forty-five minutes is not hopeless, but it is dangerous. It is exactly enough time to be clear, and exactly enough time to run out of breath before you land the plane. You cannot teach the taxonomy (the "three grades" paper you're recalling is Liebowitz & Margolis, 1990). If you try to distinguish between first-degree (sensitive dependence), second-degree (inefficient but irremediable), and third-degree (inefficient and remediable) path dependence, you will lose the GPs and the headteacher, and the engineers will nitpick the boundary conditions.

  Drop the taxonomy. Keep the *insight*: **Lock-in does not imply stupidity, but it does imply cost.**

  Here is the plan.

  ### 1. The Order of Play (and Why)

  You are correct that lock-in means nothing without positive feedback. If you start with definitions, you will lose them. If you start with the "Roman Chariot" story, you will validate their skepticism about social science "just-so" stories.

  **00:00 – 05:00: The Hook (The Physicist's Confession)**
  Start by admitting you are a physicist who thought social science was soft. Tell them you found a concept that behaves like a phase transition but happens in history. Define the core question: *If we rewound the tape of history to 1850, would we end up with the same technology today?*
  *   **Slide:** A simple energy landscape diagram (two wells, one hill). Label the wells "Technology A" and "Technology B". Label the hill "Switching Cost".

  **05:00 – 15:00: The Decoy (What Path Dependence Is NOT)**
  Use the Railway Gauge here, exactly as you planned. Tell the "Roman Chariot to Rocket Booster" story. Then dismantle it.
  *   **Why:** It satisfies the engineers' demand for rigour. It shows you aren't peddling myths.
  *   **The Point:** This story is linear causality (A caused B caused C). There is no feedback loop. The width of a chariot did not *force* the rocket booster to be that width via a mechanism of increasing returns; it was just a lineage. Path dependence requires a *mechanism* that amplifies small advantages, not just a chain of inheritance.
  *   **Cut:** Do not spend time proving the history is false. Just assert it as a "folklore example" and move to the mechanism.

  **15:00 – 25:00: The Mechanism & The Hysteresis Pre-emption**
  This is where you plant the hysteresis objection before they can raise it.
  *   **The Mechanism:** Explain **Positive Feedback (Increasing Returns)**. The more people use X, the more valuable X becomes (network effects, infrastructure, learning curves).
  *   **The Hysteresis Intervention:** Say this explicitly: *"Now, half of you are thinking this sounds exactly like hysteresis in magnetics. The state depends on the history of the applied field. You are right."*
  *   **The Distinction:** *"In a ferromagnet, hysteresis is the memory of the domain alignment. In social systems, Path Dependence is hysteresis plus **transaction costs**. In a magnet, you can flip the domain if you apply a strong enough reverse field. In a railway network, the 'reverse field' is ripping up every track and replacing every train. The energy barrier isn't just physical; it's economic and social."*
  *   **Why here:** If you wait until Q&A, an engineer will frame the whole talk as "old wine in new bottles." If you say it here, you validate their expertise and co-opt the term.

  **25:00 – 35:00: The Real Example (The Carrying Case)**
  You rejected QWERTY and VHS. You want to use Railway Gauge as the "Not" example. You need a "Yes" example that is physical, engineering-based, and undeniable.
  *   **Recommendation:** **The Light Water Nuclear Reactor (LWR).**
  *   **Why:** You are a physicist. They are engineers. You can speak with authority.
  *   **The Story:** In the 1950s, there were many reactor designs (Molten Salt, Gas Cooled, Breeder). The US Navy chose Light Water for submarines (Rickover) because it was compact and used existing steam turbine tech.
  *   **The Feedback:** Once the Navy built the supply chain, the training, and the regulations for LWR, it became the path of least resistance for civilian power.
  *   **The Lock-in:** We are still using LWRs. Alternatives might be safer or more efficient (less waste), but the "switching cost" (retooling industry, retraining staff, rewriting regs) is the energy barrier.
  *   **Why this works:** It avoids the "inefficiency" trap (LWRs work fine) but highlights the "contingency" (we didn't choose it because it was best, but because it was first/available).
  *   **Alternative if Nuclear feels too political:** **The Whitworth Screw Thread.** (1841). Standardization created massive efficiency, but locked the UK into a specific thread form that differs from the US (Sellers) and Metric. Changing it now is impossible due to the installed base of machinery.
  *   **Decision:** Stick with **Nuclear** if you feel confident; it leverages your CV. Use **Screw Threads** if you want to avoid policy debates. Given your background, Nuclear is the stronger fit for *you*, but Screw Threads are safer for a *mixed* audience. **I recommend Screw Threads.** It is purely mechanical, undeniably locked in, and every engineer in the room has fought with a stripped thread.

  **35:00 – 40:00: The Objections (The "Soft Science" Defense)**
  Address the remaining objections rapidly.
  1.  *"Isn't everything path dependent?"* (History always matters).
      *   **Answer:** "No. Gravity is not path dependent. A bridge built today obeys the same physics as one built in 1800. Path dependence applies where *choices* create *barriers*."
  2.  *"Does lock-in mean we chose the worse option?"* (Inefficiency).
      *   **Answer:** "Not necessarily. It means we chose the option that got ahead early. It might be 'good enough'. The tragedy isn't that we chose badly; it's that we can't choose again."
  3.  *"If it's locked in, how come formats change?"*
      *   **Answer:** "Lock-in lasts until the energy barrier is overcome by a shock. Digital didn't replace Vinyl because it was slightly better; it replaced it because it changed the physics of the distribution network."

  **40:00 – 45:00: The Diagnostic Question**
  Do not summarize. End with a question that forces them to apply the concept.

  ### 2. The Single Example: What It Must Contain

  If you choose **The Screw Thread (Whitworth)**:
  *   **Must Contain:**
      *   **The Date:** 1841 (Joseph Whitworth).
      *   **The Mechanism:** Interchangeability. A nut made in Manchester must fit a bolt in Glasgow.
      *   **The Feedback:** As more machines used Whitworth, more tools were made to cut Whitworth threads. This made Whitworth threads cheaper, so more machines used them.
      *   **The Lock-in:** We still use these threads (or derivatives) today. To change to a "better" thread profile now would require replacing every machine tool in the country.
  *   **Must Not Contain:**
      *   **Technical specs:** Do not discuss thread pitch angles or tensile strengths. You will lose the GPs.
      *   **Moral judgment:** Do not claim Whitworth was "worse" than Metric. Claim it was *arbitrary* but now *fixed*.

  *(If you choose Nuclear, swap "Threads" for "Reactor Types" and "Tools" for "Supply Chain/Regulation".)*

  ### 3. Handling the Hysteresis Objection

  You are right: they are onto something. The analogy hides the interesting part if you treat them as identical.
  *   **Where to plant it:** Minute 15 (as outlined above). Do not wait for Q&A.
  *   **What to say:**
      > "I know many of you know hysteresis. In magnetics, the magnetization depends on the history of the field. Path dependence is social hysteresis. But there is a difference. In a magnet, if I apply enough energy, I can flip the domain. In a technology system, the 'energy' required to flip the state is replacing the entire infrastructure. Hysteresis is the memory; Path Dependence is the cost of forgetting."
  *   **Why:** This acknowledges their expertise (flattering the engineers) while preserving the distinctiveness of the social phenomenon (the switching cost).

  ### 4. What to Cut

  *   **The Three Grades (Liebowitz & Margolis):** Cut the taxonomy. It eats 10 minutes and requires economic literacy. Keep the *idea* (lock-in $\neq$ regret) but drop the labels.
  *   **Polya Urns / Ergodicity:** Cut entirely. The engineers will want to derive the math, the GPs will glaze over. Use the **Energy Landscape** slide instead. It's the same math (potential wells) but in their language.
  *   **Critical Junctures:** Cut the jargon. Just say "Moments of Choice."

  ### 5. The Final Diagnostic Question

  You need to know if they understand that path dependence is about **foreclosure**, not just **influence**.

  *   **The Question:** *"If we could reset the standard tomorrow at zero cost, would we keep the Whitworth Thread (or LWR)?"*
  *   **The Good Answer:** "No, we'd design something better now," OR "We don't know, because the choice was contingent, not optimal." (This shows they understand the outcome wasn't inevitable).
  *   **The Bad Answer:** "Yes, because it's the best." (This means they think history selects for fitness, which denies path dependence).
  *   **The Muddled Answer:** "It depends on the cost." (This means they missed the "zero cost" premise of the question).

  ### 6. Reality Check on Timing

  Forty-five minutes is enough *if* you are ruthless.
  *   **Risk:** The "Roman Chariot" story is fun. You will want to linger on the horses' backsides. **Don't.** Spend 5 minutes max.
  *   **Risk:** The Hysteresis discussion. Engineers love to discuss definitions. **Shut it down.** "We can discuss the thermodynamics in the pub afterwards; for this talk, the distinction is the switching cost."
  *   **Risk:** The Projector. If it's dodgy, have a backup. Draw the Energy Landscape on the flip chart. A hand-drawn potential well is more engaging than a static slide anyway.

  ### Summary of the Plan

  1.  **Intro:** Physicist in social land. Rewinding the tape.
  2.  **Decoy:** Railway/Roman Myth (Linear causality, no feedback).
  3.  **Mechanism:** Positive Feedback + **Hysteresis Pre-emption** (Social Hysteresis + Switching Costs).
  4.  **Example:** Whitworth Screw Thread (or LWR). Contingent choice $\rightarrow$ Feedback $\rightarrow$ Lock-in.
  5.  **Objections:** Efficiency (not required), Change (requires shock).
  6.  **Close:** The "Zero Cost Reset" Question.

  You are not teaching them economics. You are teaching them **non-equilibrium statistical mechanics applied to history.** Play to that strength. The engineers will respect the physics; the GPs will respect the clarity. Good luck.
