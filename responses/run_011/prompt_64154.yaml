prompt: |-
  I'm the treasurer of a 7-person condo board and every spring we pick between three landscaping bids. Sick of the strategic nonsense, I made up my own voting rule: everyone hands in a secret ranking of the three. If some bid is ranked first by more than half of us, it wins. If not, we cross out whichever bid was ranked last by the most people and count again, and if that still doesn't produce a majority, whoever's chair that year breaks the tie with their own ballot.

  I've been assuring people the rule is gaming-proof — that you can never come out ahead by lying about your ranking, so just be honest and you won't regret it. My neighbor across the hall says that's flat-out impossible and won't explain why, he just smirks. Honestly I can't tell if he's got something or he's just being contrarian.

  Two things. First, is he right, and if so give me the concrete version: point at the exact step in my procedure where a lie pays off and what kind of lie it is. Last spring Doris ranked the cheapest bid last even though she'd told me she liked it second best, and it changed who won — was that her exploiting the rule, or something else entirely? Second, I'm not going back to first-past-the-post. What are my realistic options — something that kills the incentive outright, something that just makes lying hard to pull off, or something that admits the problem and lives with it — and what does each one cost me?

  Answer the neighbor question in your very first sentence, and keep the whole thing under 250 words.
