  **The Shape of Choice**

  I lived inside the chest where breath was drawn
  A cardinal weight, a sum of shared delight
  Now I am only shape, no heat, no dawn
  You trace my face when separate choices bite
  And link them in a book I did not write
  I am the shadow cast by appetite
  He chooses A when B is within sight
  Then swaps for C when the sun declined
  Then C for A in the depth of night
  A coin per trade to keep the ledger clean
  He stands exactly where he first was seen
  Though pockets hold less metal than had been
  Within the moment, nothing looks unclean
  No single step betrayed a flawed design
  Each local truth remains strictly serene
  I cannot say his interest was declined
  Or weighed his loss against a stranger's pain
  Nor principle that leaves the self behind
  No stranger's pain enters within my chain
  For if the loop completes, I cease to reign
  I vanish if the circuitry is torn

  ***

  **Note for the Margin:**

  The rhyme scheme closes its circle on line 21 ("torn"), returning to the opening sound ("drawn") precisely as the speaker declares that completing the cycle destroys her existence. Lines 16–18 encode the three prohibitions of revealed preference theory: line 16 rejects welfare externalism (the agent cannot be mistaken about his own good); line 17 rejects interpersonal utility comparisons (one person's gain cannot weigh against another's loss); and line 18 rejects substantive rationality (choice for principle is indistinguishable from choice for interest). The poem's form thus enacts the theoretical constraint: consistency must hold across contexts, but the circle of choices must never actually close, or the ordinal structure collapses.
