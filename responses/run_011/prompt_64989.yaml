answer: |-
  **TO:** State Health Agency Commission
  **FROM:** Mediation Panel 4-B
  **DATE:** October 30, 2023
  **SUBJECT:** Recommended Valuation Split and Bargaining Protocol for Telehealth Venture

  ### 1. Determination of Value Split (Current Case)
  Based on the total venture value of $12M and the verified fallback positions ($2M for the Hospital System, $1M for the Rural Clinic Network), the Panel recommends the following allocation:

  *   **Hospital System:** $6.5 Million
  *   **Rural Clinic Network:** $5.5 Million

  This allocation maximizes the Nash product of the gains over fallback. It results in an equal division of the cooperative surplus ($4.5M each), leaving the Network within its current absorptive capacity constraint ($6M) and providing the Hospital with a return commensurate with its risk and infrastructure contribution.

  ### 2. Decision on Letter of Intent (LOI)
  The Panel **declines to incorporate** the Rural Clinic Network's non-binding Letter of Intent with the second health system into the valuation model for this proceeding.

  While the LOI suggests a potential future increase in the Network's absorptive capacity (from $6M to $9M), it does not currently alter the feasible set of *this* specific venture. The value distribution must be based on committed, executable capacity at the time of filing. Accepting non-binding aspirational documents as inputs for valuation creates audit risks and invites strategic posturing unrelated to the immediate economic reality of the joint venture.

  ### 3. Standing Rule for Future Cases
  The Panel adopts the **Nash Bargaining Solution (NBS)** as the standard methodology for future mediation proceedings under this agency.

  While alternative frameworks were considered, the NBS offers superior stability for regulatory mediation. It is invariant to irrelevant alternatives (such as non-binding LOIs that do not change the fallback position) and focuses on maximizing the joint welfare of the parties within the *actual* feasible set. This ensures that value splits are driven by concrete economic constraints and fallback positions rather than fluctuating aspirations or uncommitted options.

  ### 4. Methodological Note: The Case for Kalai-Smorodinsky
  *The following argument was advanced during deliberation and is recorded here to reflect the robustness of the alternative framework considered.*

  The Panel acknowledges the theoretical strength of the **Kalai-Smorodinsky (KS)** solution, particularly regarding the **Monotonicity Axiom**. The argument for KS rests on the principle of **Relative Concession**.

  Under the Nash rule, a party's share is determined solely by the shape of the utility frontier near the solution point. If a party improves their outside options or expands their capacity to absorb value (as the Network did with the LOI), the Nash solution may remain static provided the fallback point and the local frontier slope do not change. This creates a potential disincentive for growth: a party that invests in expanding their capacity to utilize more of the venture's value receives no immediate recognition of that improved position in the split.

  The KS solution corrects this by anchoring the division to the **Ideal Point**—the maximum conceivable gain each party could achieve within the feasible set. By equalizing the ratio of *actual gain* to *maximum possible gain*, KS ensures that if the feasible set expands in one party's favor (e.g., capacity increases from $6M to $9M), that party's share of the surplus increases proportionally. This satisfies Monotonicity: a party whose real options grow should not be left standing still. It treats the bargaining problem as a division of *opportunity* rather than just a division of *surplus*, ensuring that a party with a higher capacity ceiling is not penalized by a rule that ignores the scale of their potential contribution.

  ### 5. Conclusion
  While the Kalai-Smorodinsky framework offers a compelling argument for incentivizing capacity growth through the Monotonicity Axiom, the Panel determines that the Nash Bargaining Solution provides the necessary administrative stability and resistance to strategic inflation of value for this Agency. In this specific instance, the application of the Nash rule yields a higher immediate return to the Rural Clinic Network ($5.5M) than the Kalai-Smorodinsky rule would, even if the LOI were accepted ($5.2M).

  **Recommendation:** Adopt the $6.5M/$5.5M split and the Nash Bargaining Solution as the standing protocol.

  ***

  **Signed,**

  **Mediation Panel 4-B**
