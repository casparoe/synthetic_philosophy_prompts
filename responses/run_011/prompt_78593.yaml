  The **Raw Spectrum** case isolates the boundary between R5 and R9. If she rules **Perception**, then your Mass-Spec case (with software) is likely **Inference** (because the software articulates what the expert sublimates). If she rules **Inference** on the Raw Spectrum, then your Mass-Spec case is definitively Inference. This forces her to clarify whether "articulability in principle" (R5) or "articulability in the moment" (R9) is the deciding factor. That is the hinge on which your entire facility's epistemic status turns.
