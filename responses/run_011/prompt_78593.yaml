  I will back **Rule 1 (Decomposition/Inference)** with the bottle of wine.

  **Reasons:**
  1.  **The Trump Card of R5:** In Ruling 5 (Stout Man), Dr. R. explicitly states that *"whatever the difference in felt mental gesture,"* the cognition is Inference. This is a direct preemptive strike against the "immediacy" argument you might make based on R9 (Clinician). The clinician's immediacy is permitted only because *no premise could be stated*. In your case, the premise *can* be stated (the calibration curve). The availability of the universal connection forces the cognition into the Inference bucket, regardless of how fast or automatic the process feels.
  2.  **The R8 Distinction:** In Ruling 8 (Textbook), she distinguishes between the *warrant* (the practice) and the *source*. She was "unwilling to call it testimony without qualification." This suggests she prefers to keep the categories clean. The *source* of your cognition is your reasoning from the trace; the *warrant* for that reasoning is the testimony of the Standards Lab. She will likely preserve the distinction: The cognition is Inference; its reliability depends on Testimony.
  3.  **The R1 Constraint:** Perception requires contact with the object. You admit nobody has seen the molecule. You see a trace. The trace is a sign (*liṅga*). Where there is a sign and a universal connection (calibration), there is Inference (R2). To call it Perception would require her to abandon the "contact" requirement she insisted on in R1. She has shown no willingness to abandon core definitions (R4, R5, R6), only to expand their application (R9).

  **Prediction:** She will rule that the cognition "the ratio has this value" is **Inference**. She will say the instrument provides the *hetu* (reason/mark), the calibration provides the *vyāpti* (concomitance), and the maintenance practice ensures the *hetu* is not defective. She will deny it is a new *pramāṇa*, and she will deny it is Perception because the link between trace and ratio is mediated by a rule you can articulate.

  ### (d) The Follow-Up Case

  To separate Rule 1 (Inference/Structure) from Rule 2 (Perception/Skill), you need a case where the universal connection exists but is *inarticulable* to the agent, yet the object is not directly contacted.

  **The Case: The Raw Spectrum**
