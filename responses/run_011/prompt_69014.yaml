prompt: |-
  so I do economic modelling for a reimbursement body — think of the sort of agency that decides whether a new drug gets funded, on the NHS/NICE model — and there's a thing about our own scoring that has been bugging me for a while and I can't tell if it's a real problem or just an artifact of how everyone in this field talks.

  the short version: our gatekeeping concept and our benefit concept don't line up, and I want to know what theory of health the whole apparatus is actually committed to.

  concretely. A company can't get a hearing unless the indication is a recognised disease — there has to be a diagnosis, a code, a named pathological entity, something a clinician can point at in the body. But once you're in the room, the diagnosis stops doing any work at all. The benefit we count is QALYs: life years weighted by a health-state value anchored at 0 for death and 1 for full health, and we cheerfully accept negative values for states the public ranks as worse than being dead. Full health there isn't a biological optimum — it's the profile where a respondent ticks the no-difficulty box on five fixed dimensions (mobility, self care, usual activities, pain, anxiety/depression), and the weights come from asking a sample of the general public to trade off time or risk against living in that state. Then we divide cost by QALYs gained and compare against a threshold, something in the region of £20–30k per QALY, and that number is a hard bright line: 31k is a no, 29k is a yes, and nobody has ever publicly derived where it sits.

  three bits of this I can't reconcile with each other:

  (a) we have formal flexibility — we used to have an explicit end-of-life test and now something like a severity modifier — that lets a drug clear at two or three times the normal cost per QALY. So the same QALY is worth more or less depending on how badly off the person receiving it already was. But if a QALY is what we say it is, a quantity of health, then a QALY is a QALY, and weighting it by prior severity means we stopped measuring health at some point and started measuring the moral urgency of need. We never say that out loud in the guidance.

  (b) our reference case stipulates which instrument produces the utility. If the trial measured quality of life with something else, the company has to map or crosswalk onto ours. And different instruments disagree about the same patient by more than the entire distance between reccomended and not recommended for a lot of mid-priced drugs. If the health state were a real magnitude sitting in the patient, I'd expect instruments to disagree the way thermometers do — a little, in a way you can explain away as noise and calibration. They don't. They disagree systematically, and the way we settle it is by fiat. Someone on our committee insists this is ordinary measurement error, exactly like two bathroom scales reading your weight differently, and I don't have a good answer for him. Am I wrong that (b) is a problem?

  (c) the ceiling. Plenty of people enter our models with a baseline utility of 1 because the instrument can't see any further improvement, and we still fund their treatment, justifying it by saying the diagnosis carries a burden the questionnaire doesn't capture. Which is an admission the instrument isn't measuring health — and simultaneously an admission we're back to counting diagnoses, i.e. back to the thing we said stopped mattering at the door.

  so what I want: what concept of health is this practice committed to? Is it treating health as normal species-typical functioning, something in principle readable off the body independent of what anyone thinks about it — or as a verdict about how good someone's functioning is by their community's lights — or is it a third thing entirely? I've seen philosophers label the two poles naturalism and normativism but I genuinely cannot work out which one we bought, becuase we seem to be running both at once and getting away with it.

  Be concrete rather than survey-ish. Which parts of the machinery strictly presuppose a view, in the sense that they could not be run at all under the rival account? Which parts merely happen to fit the one we use and would survive the switch untouched? And where is the practice underdetermined — where would a naturalist and a normativist both happily sign off on the identical guidance document, so that nothing about the outcome lets you tell them apart? Then rank (a), (b), (c): which is the real problem and which is just an embarrassment we could patch.

  finally, tell me what would have to change in the machinery itself — not the philosophy, the paperwork — if we concluded the normativist was right all along. Would we still need a diagnosis at the door? Would the scale still have a ceiling at 1? Would the threshold still be expressed per QALY, or would per-QALY stop being the right unit? And if the answer is that nothing would change, say so, and tell me whether that means the whole naturalism/normativism question is idle for people who actually have to make these decisions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user works in economic modelling for a health technology assessment (HTA) body (like NICE in the UK).
      *   **Core Problem:** There's a misalignment between the *gatekeeping concept* (requires a diagnosed disease/pathology) and the *benefit concept* (QALYs based on subjective utility/preference).
      *   **Specific Tensions:**
          *   (a) Severity modifiers/end-of-life rules imply a QALY isn't always a QALY (moral urgency vs. health quantity).
          *   (b) Instrument dependency (EQ-5D vs. others) suggests health isn't a mind-independent magnitude like weight, but the committee treats it as measurement error.
          *   (c) Ceiling effects (baseline utility = 1) vs. funding based on "diagnosis burden" implies the instrument doesn't capture the relevant health state, reverting to diagnosis-based logic.
      *   **Philosophical Question:** What theory of health is the system committed to? Naturalism (Boorse-style, biological function) or Normativism (social/value-based)?
      *   **Specific Requests:**
          *   Identify which parts of the machinery presuppose a specific view (could not run under the rival).
          *   Identify which parts are underdetermined (both views could sign off).
          *   Rank (a), (b), (c) by severity (real problem vs. embarrassment).
          *   Specify what would *actually change* in the machinery if Normativism were explicitly adopted (diagnosis requirement, ceiling, threshold unit).
          *   Determine if the philosophical distinction is idle for practitioners.

  2.  **Analyze the Philosophical Landscape (Health Economics & Philosophy of Medicine):**

      *   *Naturalism (e.g., Boorse):* Health is statistical normality of species-typical functioning. Disease is a value-free biological fact.
      *   *Normativism (e.g., Engelhardt, Fulford):* Health/illness is defined by values, goals, and social context. "Disease" implies a negative evaluation.
      *   *The QALY:* Inherently normativist/preference-based. It measures *value* of a state, not biological function. 1 = "full health" is defined by lack of reported problems, not physiological optimality.
      *   *The HTA Process:* Hybrid. Entry requires a "disease" (Naturalist leaning), evaluation uses QALYs (Normativist leaning), prioritization uses severity/thresholds (Distributive Justice/Normativist).

  3.  **Address the Specific Tensions (a, b, c):**

      *   *(a) Severity Modifiers:* This is a distributive justice move (Prioritarianism). It contradicts the strict utilitarian calculus of "maximize total QALYs." It admits a QALY for a severely ill person is *morally* more valuable. This breaks the "health as magnitude" view.
      *   *(b) Instrument Disagreement:* Thermometers measure a physical property. Utility instruments measure a *construct* derived from preferences. Disagreement isn't error; it's construct validity. If health were naturalist, EQ-5D would be a bad tool. The fact that they use it proves they aren't strict naturalists, but the committee's *rhetoric* treats it like naturalist measurement.
      *   *(c) Ceiling Effects:* If utility = 1 but treatment is funded, the benefit *cannot* be QALYs gained (since gain is impossible). It must be "treating the disease." This reverts to the Naturalist gatekeeping criterion.

  4.  **Determine the Committed Theory:**

      *   The system is a *pragmatic hybrid*, but functionally it is **Normativist with Naturalist window dressing.**
      *   Why? Because the *currency* of decision-making (the QALY) is preference-based. The biological diagnosis is just an eligibility filter, not the metric of success.
      *   However, it's not *pure* Normativism because it relies on the medical authority to define the eligible population (diagnosis).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate that this is a known philosophical tension in HTA (often ignored by practitioners).
      *   **The Committed Theory:** It's not Naturalism. It's **Welfarist Normativism** (specifically Preference Utilitarianism) masked by **Medical Naturalism** for administrative boundary-setting.
      *   **Machinery Analysis (Naturalism vs. Normativism):**
          *   *Presupposes Normativism:* The QALY itself (utility weights), the threshold (willingness to pay), severity modifiers (equity weights). A Naturalist couldn't run these without importing values.
          *   *Presupposes Naturalism:* The entry criterion (ICD code/diagnosis). A pure Normativist would fund based on "distress" or "disability" regardless of biological cause.
          *   *Underdetermined:* The cost calculation. Both agree resources are finite.
      *   **Ranking (a), (b), (c):**
          *   *(b) is the deepest philosophical error:* Treating construct disagreement as measurement error is category mistake.
          *   *(a) is the honest admission:* It admits the QALY isn't the whole story (equity).
          *   *(c) is the administrative patch:* It's inconsistent but operationally manageable.
          *   *Ranking:* (b) > (a) > (c). (b) undermines the epistemology of the model. (a) undermines the axiology. (c) is just a measurement ceiling issue.
      *   **What would change if Normativism were explicit?**
          *   *Diagnosis at the door:* Could go. Focus on "impact on functioning/wellbeing" regardless of etiology. (But practically difficult).
          *   *Ceiling:* Yes, the scale needs to expand or change (e.g., Capability Approach).
          *   *Threshold:* Per QALY might stay, but the *definition* of the QALY would shift to be more explicit about values.
          *   *Idle Question?* No. It matters for edge cases (enhancement vs. treatment, mental health, rare diseases).

  6.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on (b):* Is it really measurement error? In psychometrics, yes, different instruments measure different facets. But the committee treats it as "true weight vs. scale error." I need to emphasize that utility is not a latent physical variable.
      *   *Correction on Theory:* Is it Normativism? Or is it *Welfarism*? Welfarism is a subset of normativism in this context. Let's stick to the user's Naturalism/Normativism framing but clarify that QALYs are inherently normativist.
      *   *The "Idle" Question:* It's not idle. It affects *what counts as a benefit*. If health is function, cognitive enhancement might be "health." If health is absence of suffering, it might not.
      *   *Tone:* Professional, peer-to-peer, acknowledging the gritty reality of HTA work. Avoid overly academic jargon where possible, but use the philosophical terms correctly.

  7.  **Final Polish:** Check against all constraints.
      *   Concrete not survey-ish? Yes.
      *   Which parts presuppose which view? Yes.
      *   Rank (a), (b), (c)? Yes.
      *   What changes in machinery? Yes.
      *   Is the question idle? Yes/No nuance.

  8.  *(Self-Correction during drafting)*: I need to be careful about the "Naturalism" label. Boorse-style naturalism defines health as species-typical functioning. The HTA body *uses* diagnosis (Naturalist) but *values* via QALYs (Normativist). The tension is that they pretend the QALY measures the Naturalist state. I should call this "Conceptual Drift" or "Operational Hybridity."

      *   *Re-evaluating (b):* The user asks if they are wrong that (b) is a problem. They are *not* wrong. It is a category error. I must support them there.
      *   *Re-evaluating (c):* This is the "ceiling effect." If you are at 1, you can't gain QALYs. If you get funded, you aren't being funded for QALYs. You are being funded for "disease treatment." This proves the Diagnosis is the real driver, not the QALY.

      *   *Final Verdict on Theory:* The system is **Normativist in valuation, Naturalist in eligibility.** The friction comes from pretending the valuation measures the eligibility criterion.

      *   *Changes if Normativist:* Drop the diagnosis requirement (fund based on need/disutility). Change the instrument (capability approach). Keep the threshold (scarcity is real).

      *   *Is it idle?* No, because it dictates who gets in the door.

      *(Drafting response based on these points.)*
answer: |-
  This is a sharp diagnosis of a structural tension that most health technology assessment (HTA) bodies manage by ignoring. You are not imagining the friction. The apparatus you describe is not theoretically neutral; it is a hybrid that functions by suppressing the contradiction between its entry criteria and its valuation metric.

  Here is the concrete breakdown of the theory your practice is committed to, the ranking of your three problems, and the material consequences of resolving the philosophical tension.

  ### 1. What theory of health is the machinery committed to?

  Your system is **Normativist in valuation, Naturalist in eligibility, and Pretend-Naturalist in measurement.**

  *   **Eligibility (Naturalist):** The requirement for a coded diagnosis (ICD-10, etc.) presupposes that "disease" is a value-free biological fact that can be identified independently of the patient's evaluation of it. This is Boorse-style biostatistical naturalism. It draws a bright line between "treatment" (fundable) and "enhancement" or "social support" (non-fundable).
  *   **Valuation (Normativist):** The QALY is inherently normativist. It does not measure biological function; it measures *preference satisfaction*. A state is "healthy" (utility = 1) not because the organs are working optimally, but because the general public says they would not trade time to avoid it. When you fund based on QALYs, you are maximizing social welfare, not restoring species-typical functioning.
  *   **Measurement (The Pretence):** The committee member who compares utility instruments to bathroom scales is wrong. This is the point where the system pretends to be Naturalist to gain epistemic authority. If health were a natural magnitude (like weight), instruments would converge on a true value as noise decreased. Because health-utility is a social construct, instruments diverge based on which dimensions they prioritize (e.g., does "anxiety" weigh more than "mobility"?). Treating this divergence as "measurement error" is a category mistake designed to shield the threshold from political challenge.

  **The Verdict:** You are running a **Welfarist Utilitarian** engine inside a **Medical Model** chassis. The chassis says "we fix diseases." The engine says "we maximize public preference weights." They only align when diseases happen to correlate perfectly with disutility, which they do not (hence your problem (c)).

  ### 2. Which parts presuppose which view?

  Here is where the machinery breaks if you swap the philosophical commitment.

  **Parts that presuppose Normativism (would fail under Naturalism):**
  *   **The QALY itself:** A strict Naturalist cannot weight a year of life by a preference score. A year of life with restored biological function is a year of life. The 0–1 scale is a value judgment, not a biological count.
  *   **The Threshold (£20k–30k):** This is a shadow price of social willingness to pay, not a cost of production. A Naturalist view might fund anything that restores function regardless of cost, or nothing that doesn't restore function regardless of benefit. The threshold admits resources are scarce and values are tradable.
  *   **Severity Modifiers (Problem a):** This is the smoking gun. If a QALY were a unit of biological health, a unit gained by a severely ill person would be identical to a unit gained by a mildly ill person. Weighting them by severity is a distributive justice claim (Prioritarianism), which is purely normative.

  **Parts that presuppose Naturalism (would fail under Normativism):**
  *   **The Diagnosis Gate:** A consistent Normativist would fund based on *disutility* or *capability deprivation*, regardless of etiology. If a social circumstance causes the same utility loss as a tumor, a pure Normativist framework struggles to exclude the social intervention while funding the drug. The diagnosis requirement exists to limit liability and maintain medical authority.
  *   **The "Disease" Exclusion:** You likely exclude cosmetic enhancements or lifestyle drugs even if they generate QALYs. This relies on a Naturalist distinction between "treating pathology" and "satisfying desires."

  **Parts that are Underdetermined (Both could sign off):**
  *   **Costing:** Both agree resources are finite.
  *   **Survival Data:** Both agree that being alive is generally preferable to being dead (though they disagree on *why* and *when*).
  *   **The Committee Structure:** A group of experts weighing evidence is compatible with finding biological truth or aggregating social values.

  ### 3. Ranking the Problems: (a), (b), (c)

  You asked which is the real problem and which is an embarrassment.

  **Rank 1 (The Real Problem): (b) The Instrument Fiat.**
  This is the most dangerous because it corrupts the epistemology of the model. If your committee believes utility instruments are like thermometers, they believe there is a "true" QALY count out there in the world. This leads to false precision. When instruments disagree by more than the threshold margin, and you solve it by fiat (choosing EQ-5D over SF-6D), you are not measuring; you are legislating.
  *   *Why it's worst:* It prevents you from acknowledging that the *choice of instrument* is a value judgment. EQ-5D emphasizes mobility and self-care; it is less sensitive to cognition or social connection. By treating it as a neutral ruler, you systematically bias funding toward conditions that affect mobility over those that affect cognition, without ever debating that value judgment.

  **Rank 2 (The Honest Contradiction): (a) The Severity Modifier.**
  This is a theoretical inconsistency, but an honest one. It admits that the system cares about *who* gets the QALY, not just *how many*. It breaks the "QALY is a QALY" rule, but it aligns the model closer to public moral intuition.
  *   *Why it's manageable:* You can formalize this. It's an "equity weight." It doesn't break the math; it just changes the objective function from `Maximize ΣQALYs` to `Maximize Σ(Weight × QALYs)`. It requires admitting the philosophy, but the machinery handles it fine.

  **Rank 3 (The Embarrassment): (c) The Ceiling Effect.**
  This is an administrative patch. Funding a patient with baseline utility = 1 because "the diagnosis carries a burden" is logically incoherent within a QALY model (gain = 0, ICER = infinity).
  *   *Why it's lowest:* It's easily patched by allowing "QALYs avoided" (future loss) or by acknowledging the instrument is insensitive. It's a measurement limitation, not a fundamental theoretical flaw. You can fund these cases as "exceptions" without collapsing the whole system.

  ### 4. What changes if you accept the Normativist is right?

  If you explicitly adopted the view that health is a verdict on functioning by the community's lights (Normativism/Welfarism) rather than a biological state, here is what changes in the paperwork and machinery:

  **1. The Diagnosis at the Door:**
  *   **Change:** It becomes porous or irrelevant.
  *   **Mechanism:** Eligibility shifts from "Do you have ICD code X?" to "Is your utility score below Y due to a health-related cause?"
  *   **Consequence:** You would have to fund interventions for non-pathological conditions if they produce equivalent utility gains (e.g., certain social care interventions, or perhaps fertility treatment even without a "infertility disease" code). To prevent this, you would need to explicitly define "health-related" utility, which brings you back to square one. *Practically, you would keep the diagnosis gate, but admit it is a budgetary constraint, not a philosophical truth.*

  **2. The Ceiling at 1:**
  *   **Change:** The scale must expand or change metric.
  *   **Mechanism:** If health is normative, "full health" isn't the absence of problems on 5 dimensions. It might be "capability to achieve valued functionings" (Sen's Capability Approach).
  *   **Consequence:** You would move from EQ-5D (which caps at 1) to an instrument that allows for "positive health" or distinguishes between different types of "1". A musician with perfect mobility but loss of fine motor control in fingers might be at "1" on EQ-5D but significantly deprived in capability. The ceiling would break, allowing you to measure benefits for those currently stuck at 1.

  **3. The Threshold Unit:**
  *   **Change:** Per-QALY might stay, but the *Q* changes.
  *   **Mechanism:** If you admit the Normativist view, the threshold isn't "cost per unit of health." It is "cost per unit of social welfare."
  *   **Consequence:** This opens the door to including caregiver burden, productivity, and social participation directly in the numerator, rather than forcing them into the patient's utility score. The threshold (£30k) would likely need to rise, because you are capturing more value than just patient health-state.

  ### 5. Is the question idle?

  **No.** It is not idle.

  If the distinction were idle, the outcomes would be the same. They are not.
  *   **Under Naturalism:** You cannot fund a drug for a condition that isn't a "disease," even if it causes massive suffering (e.g., certain forms of social distress or mild cognitive enhancement).
  *   **Under Normativism:** You cannot refuse a drug that restores function just because the biological pathology is "normal" (e.g., aging-related decline vs. disease).

  Currently, you get away with it because the overlap between "biological pathology" and "negative utility" is large enough to hide the gap. But at the margins—rare diseases, mental health, end-of-life, aging—the contradiction drives your decision-making.

  **Recommendation:**
  Stop telling the committee that utility instruments are like thermometers. That is the only lie that needs to be told. Admit that EQ-5D is a **policy tool**, not a measuring device. It is a standardized way of converting diverse human experiences into a common currency for rationing.

  If you make that shift:
  1.  **Problem (b)** dissolves. Disagreement between instruments is not error; it is evidence that they value dimensions differently. You choose EQ-5D because the *system* values mobility, not because it measures "true health."
  2.  **Problem (a)** becomes consistent. You are applying equity weights to welfare units.
  3.  **Problem (c)** is acknowledged as a limitation of the chosen currency, not a mystery of the patient's biology.

  You do not need to change the threshold or the diagnosis gate tomorrow. But you must stop pretending the QALY is a natural kind. It is a political technology. Acknowledging that makes the modelling more robust, not less.
