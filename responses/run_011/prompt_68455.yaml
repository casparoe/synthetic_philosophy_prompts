  4.  **Addressing the "Will-Tracking vs. Checkability" Tension:**

      *   This is the core philosophical conflict.
      *   *Will-Tracking:* Consent is valid iff the internal will aligns. Problem: Uncheckable.
      *   *Checkability:* Consent is valid iff the external signal meets standards. Problem: Ignores internal coercion/deception.
