answer: |-
  Here is the spec for an adequate account of valid consent, drafted to meet your operational constraints and philosophical hard cases.

  ### The Spec: Requirements for Valid Consent

  **1. The Capacity Threshold (Non-negotiable)**
  The account must specify a threshold of cognitive and emotional functioning below which consent is void *ab initio*. It must handle the dementia case (temporal discontinuity of self) and the drunk nineteen-year-old (temporary incapacity).
  *   **Camp:** Everyone agrees capacity matters; **Will-Theorists** set the bar higher (actual understanding) than **Performative-Theorists** (ability to signal).

  **2. The Voluntariness Boundary (Camp Preference)**
  The account must distinguish between a "hard offer" (the price-gouging surgeon) and a "threat" (your money or your life). It must explain why saying "yes" to the surgeon counts, while saying "yes" to the mugger does not, despite both involving desperate circumstances.
  *   **Camp:** **Libertarians** say only direct threats invalidate consent (surgeon is fine). **Egalitarians** say background injustice or desperate necessity can invalidate consent (surgeon is coercive).

  **3. The Information Standard (Non-negotiable, Scope Disputed)**
  The account must handle deception. It must distinguish fraud in the *factum* (this isn't a medical exam, it's sex) from fraud in the *inducement* (I promise to marry you). It must also handle the "silent misled" case (no lie told, but reasonable assumption violated).
  *   **Camp:** **Maximalists** void consent for any deal-breaking lie. **Minimalists** void consent only for lies about the nature of the act itself.

  **4. The Performance Requirement (Non-negotiable for Operability)**
  Consent must be externally manifest. Inner agreement without uptake is inert. This handles the ship case: falling asleep cannot constitute agreement because there is no signal sent to the captain.
  *   **Camp:** **Performative-Theorists** say this is all that matters. **Will-Theorists** say this is evidence of the real thing (the will).

  **5. The Distinction Maintenance (Non-negotiable)**
  The account must not collapse consent into submission (doing what you're told because you have to) or mere silence (not objecting). It must also distinguish consent (making the act permissible) from justification (the act is good overall).
  *   **Camp:** **Feminist Critics** emphasize the submission/consent gap. **Liberal Theorists** emphasize the permissibility function.

  **6. Third-Party Checkability (Non-negotiable for your Context)**
  The criteria for validity must be assessable by a nurse, judge, or panel without telepathy. There must be a record, a signal, or a procedure that stands in for the internal state.
  *   **Camp:** **Institutionalists/Pragmatists** demand this. **Pure Moral Philosophers** often resist this as conflating *validity* with *proof*.

  **7. Revocability (Camp Preference)**
  *   **Your Suspicion:** You suspect this is a principle that functions as a preference. You are right.
  *   **Argument:** Revocability is non-negotiable for *ongoing* interactions (sex, long-term care) because the will is continuous. It is a preference for *transactional* interactions (signing a contract, starting surgery). Once the incision is made, revoking consent doesn't make the surgery rape/battery; it makes the *continuation* impermissible. If you demand absolute revocability at the "last moment" in a surgical context, you make the act impossible. Therefore, revocability is a default principle that yields to the physics of the act.

  ---

  ### The Analysis

  **The Single Requirement That Knocks Out The Most Candidates:**
  **Third-Party Checkability.**
  This requirement annihilates pure **Will-Theory** accounts. If consent is strictly a mental state (an attitude of authorization), no nurse or judge can ever verify it. They can only verify behavior. Any account that insists validity *is* the mental state, rather than something evidenced by the mental state, fails your operational constraint. It renders the concept useless for Title IX panels or courts. They cannot adjudicate souls; they adjudicate records.

  **The Impossible Pair:**
  **Will-Tracking + Third-Party Checkability.**
  You nominated this pair, and the tension is real, but here is the specific cost:
  If you prioritize **Will-Tracking**, you admit that a signed form is invalid if the signer was internally coerced, even if no one could know it. This makes validity unknowable to institutions.
  If you prioritize **Checkability**, you admit that a signed form is valid if it meets procedural standards, even if the signer was internally coerced in a way that left no mark.
  You cannot have both perfect moral accuracy and perfect institutional verifiability.

  **What is lost if you go Ceremonial (Checkability over Will)?**
  If you bite the bullet and make consent purely ceremonial (a performance with uptake conditions), you lose the **moral magic of autonomy**. You convert consent from a mechanism of *self-rule* into a mechanism of *liability management*.
  In a ceremonial system, the dementia patient who signs a form has consented, because the ceremony was completed. The drunk nineteen-year-old who nods has consented. The person who submits because they are terrified but say "yes" has consented.
  You gain clarity for the nurse and the judge. They know exactly where they stand. But you lose the ability to say the subject was *wronged* in the deepest sense. You protect the institution from blame, but you abandon the individual's sovereignty. The "consent" becomes a shield for the actor, not a sword for the consent-giver.

  **The Resolution:**
  The only way to satisfy your constraint is to decouple **Validity** from **Verifiability**.
  *   **Validity** is metaphysical: Did the will actually authorize this? (Will-Tracking)
  *   **Verifiability** is epistemic: Can we prove it? (Checkability)
  An adequate account for institutions must admit that they are not judging *Validity*; they are judging *Warranted Assertibility*. They are deciding if there was sufficient evidence of consent to proceed, knowing they might occasionally be morally wrong.

  ---

  ### Scorecard

  **Attitude-Only (Will-Theory)**
  This account says consent is a mental state of authorization. It handles the dementia and deception cases perfectly because it looks at what the person actually understood and wanted. However, it fails your operational constraint completely. A nurse cannot check a mental state. A judge cannot weigh an attitude. In an institutional setting, this account leads to paralysis or arbitrary decision-making, because there is no public standard for when the "attitude" was present. It protects the soul but sacrifices the system.

  **Performance-Only (Performative-Theory)**
  This account says consent is a speech act or conventional signal (like saying "I do" or signing a form). It is highly operable; the nurse checks the box, the judge reads the transcript. It handles the ship case well (no signal, no consent). However, it fails the hard moral cases. It validates the coerced "yes," the signed form by the confused dementia patient, and the submission of the terrified. It turns consent into a ritual that can be completed against the agent's true interests. It saves the system but sacrifices the soul.

  **The Hybrid (Necessary Performance + Defeasible Will)**
  This is the only shape that survives your spec. It requires a public performance (checkability) but allows that performance to be voided by evidence of internal defects (will-tracking). It treats the signature or the "yes" as a *presumption* of validity, not a guarantee. This satisfies the nurse (look for the signal) and the judge (allow rebuttal evidence). The cost is complexity: you must define exactly what evidence defeats the presumption (threats? lies? intoxication?). It admits that institutions will sometimes get it wrong, but it provides the only framework where they can try to get it right without demanding telepathy.
