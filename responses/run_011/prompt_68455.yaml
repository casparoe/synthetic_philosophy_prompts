  2.  **Deconstruct the "Spec" (Requirements for an Adequate Account):**

      *   *Case Coverage:* Needs to handle deception (fraud in the factum vs. inducement), coercion (threats vs. hard offers), capacity (intoxication, dementia), ignorance (signing without reading), desperation (no reasonable alternative), and tacit consent (the ship case).
      *   *Distinctions:* Consent $\neq$ Submission $\neq$ Silence. Internal State $\neq$ External Signal. Veto Power $\neq$ All-things-considered Permission. Content-Neutral $\neq$ Paternalistic Limits.
      *   *Operability:* Must work for a nurse, a panel, a judge. Needs evidence, not mind-reading.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Capacity.* Must define who can consent. (Non-negotiable).
      *   *Req 2: Voluntariness.* Must distinguish threats from offers. (Camp Preference - Libertarians vs. Egalitarians).
      *   *Req 3: Information.* Must handle deception. (Non-negotiable, but scope is debated).
