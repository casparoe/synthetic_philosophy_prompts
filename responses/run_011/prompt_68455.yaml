      *   *Check:* Did I address the dementia patient? Yes, under capacity/temporal identity.
      *   *Check:* Is the tone right? Needs to be less "here is a list" and more "here is the battlefield."
      *   *Check:* The user asked to argue about revocability. I need to make sure I don't just accept their suspicion but test it.
      *   *Check:* The "Impossible Pair" needs to be argued, not asserted. Why can't they coexist? Because evidence of will is always fallible.

  10. **Final Polish:** Ensure the distinction between "validity" (moral reality) and "verifiability" (institutional judgment) is clear. This is the key to solving the operability constraint without lying about the philosophy.

  *(Self-Correction on the "Impossible Pair"):* The user nominated Will-Tracking vs. Checkability. I need to validate this but refine *why*. It's not that they *can't* coexist, it's that satisfying Checkability *necessarily* involves error regarding Will-Tracking. You have to accept false positives/negatives.

  *(Self-Correction on Revocability):* The user suspects it's a preference. I should argue it's a *structural* requirement that gets compromised by *context*. It's non-negotiable for the *concept*, but negotiable for the *practice*. I'll side with the user but add the caveat.

  *(Final check on constraints):* No bibliography. Short scorecard. Mark requirements.

