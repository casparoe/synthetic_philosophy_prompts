answer: |-
  Your hypothesis that the impasse is ambiguity-driven is partially correct but diagnostically incomplete. The disagreement is not merely verbal or a result of conflated readings; it is a **framework-level incommensurability** regarding the unit of moral accounting. The separateness-of-persons objection is not a single argument with three premises (R1, R2, R3) but a structural constraint on moral theory that manifests differently depending on whether one prioritizes states of affairs or agents. The stalemate persists because consequentialists and deontologists are not arguing within the same normative geometry.

  **Diagnosis and Commitments**
  The disagreement is best characterized as a clash between a *teleological structure* (where value is prior to agents) and a *deontological structure* (where agents are prior to value). Your taxonomy (R1, R2, R3) treats these as separable claims that can be individually targeted, but in practice, they function as a mutually reinforcing cluster for the objector, while the consequentialist attacks the cluster's weakest metaphysical link.

  R2 (prudential unity) is the most vulnerable point, which is why Parfit targets it. However, your observation that Parfit's reply leaves R1 and R3 untouched is crucial. The objector's commitment is primarily to R3 (rights/constraints); R2 is merely contingent support. If an objector maintains the objection even after accepting Parfit's reductionism (admitting persons are not deeply distinct metaphysically), then R2 was never the engine of the objection. Conversely, the consequentialist accepts R1 (well-being is what matters) but denies it entails R3. They argue that if value is impersonal (R1 modified), the location of that value (persons) is morally arbitrary.

  Thus, the impasse is not ambiguity but **structural incompatibility**. The consequentialist asks, "Which outcome contains more value?" The objector asks, "What did this agent do to that agent?" These questions presuppose different moral ontologies. When the consequentialist answers the first question, the objector hears a category mistake. When the objector insists on the second, the consequentialist hears an irrational refusal to prevent harm. The debate stalls because each side views the other's foundational question as illegitimate. R1, R2, and R3 are not independent variables; they are expressions of the agent-priority framework. Attacking R2 (metaphysics) does not dismantle R3 (normativity) because the objector can ground R3 in the phenomenology of distinct consciousnesses or the logic of claim-rights, regardless of metaphysical depth.

  **Assessment of SPLIT and GRAFT**
  Your cases, SPLIT and GRAFT, are excellent diagnostic instruments for isolating R2, but they reveal that R2 is not the primary barrier.

  In **SPLIT** (one becomes two, one sacrificed), the consequentialist leveraging Parfit should see this as akin to intrapersonal sacrifice (permissible), given the continuity. The objector, if driven by R2, should hesitate. However, most objectors will condemn the sacrifice immediately. This suggests R2 is not doing the heavy lifting; the existence of two distinct streams of consciousness (R1) or two rights-bearers (R3) is sufficient to trigger the objection.

  In **GRAFT** (two become psychologically unified, one sacrificed), the diagnostic power is higher. Here, psychological unity is high, weakening the R2 objection. If the objector still condemns the sacrifice, it confirms that prudential unity is inert. The objection fires because there are two biological organisms or two original sources of claims. If the objector permits the sacrifice, then R2 was indeed the core, and Parfit was right. However, in practice, objectors tend to condemn GRAFT sacrifices, citing the inviolability of the original distinct bodies or histories.

  The limitation of these cases is **definitional retreat**. They risk becoming circular tests for personhood. If the objector says GRAFT creates one moral person, the sacrifice becomes intrapersonal and permissible, preserving R2 by redefining "person" to match the moral intuition. If they say SPLIT creates two persons, the sacrifice is interpersonal and wrong. To function as true diagnostics, the definition of "person" must be fixed independently of the moral verdict (e.g., strictly biological). If fixed biologically, GRAFT forces the objector to admit that psychological unity (R2) is irrelevant, isolating R3 as the true core. If the objector resists fixing the definition, the cases fail to pry the readings apart because the metaphysics shifts to protect the morality.

  **Prospects for Progress**
  Given this diagnosis, substantive progress in the form of a knock-down argument is unlikely. You cannot argue someone out of a framework commitment using premises internal to a rival framework. However, diagnostic progress is possible and valuable for your dissertation.

  Progress consists in **shifting the burden of proof from metaphysics to structure**.
  1.  **Acknowledge R3 as the Core:** The debate should stop focusing on personal identity (R2). Both sides should admit that even if persons were metaphysically shallow, the moral prohibition on sacrifice might remain. This clears the fog created by Parfitian replies.
  2.  **Formalize the Constraint:** Instead of arguing cases, articulate the formal constraint the objector demands. Is it a veto power? A weighting function that discounts distant benefits? A prohibition on using persons as means? Progress looks like a formal model showing that no aggregative rule can satisfy the separateness constraint without collapsing into egoism or prioritarianism.
  3.  **Admit Framework Status:** The most honest progress is admitting that the separateness objection is a **framework-level claim** that can only be adopted, not proven. It is a commitment to viewing morality as a system of cooperation between distinct agents rather than a management problem for a benevolent spectator.

  If your goal is to resolve the debate, you will fail. The impasse is a feature of pluralistic moral ontology, not a bug in the argumentation. If your goal is to map the impasse, your hypothesis is correct in identifying the conflation of R1, R2, and R3, but incorrect in suggesting that disentangling them will allow the arguments to join issue. They will join issue only when both sides acknowledge they are arguing for different moral geometries. Your dissertation should aim to show that the "wall" you hit is not a lack of ingenuity but the boundary of the consequentialist project itself. The separateness of persons is not a premise to be refuted; it is the description of the social world that consequentialism struggles to recognize as morally fundamental.
