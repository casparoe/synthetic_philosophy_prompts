answer: |-
  Here is the triage procedure, derived from Speech Act Theory (specifically J.L. Austin and John Searle) and Gricean Pragmatics, translated into craft terms.

  ### The Commitment Triage Procedure

  **Time limit:** 5 minutes per line.
  **Goal:** Determine if the reader can calculate the *speaker's stake* in the utterance.

  **Jargon Key:**
  *   **The Job:** What the sentence is *doing* (stating a fact, telling a joke, lying, hedging).
  *   **The Gap:** The distance between what the character *believes* and what they *say*.
  *   **The Signal:** The textual clue (action, context, syntax) that tells the reader how wide The Gap is.
  *   **The Cost:** What the character loses if the statement is challenged.

  ---

  #### Step 1: Identify The Job
  Ask: *If a lawyer asked this character "What did you just do?" what would they say?*
  *   **Pass:** You can name it in one word (e.g., "Asserting," "Joking," "Lying," "Hedging").
  *   **Fail:** You have to say "It's complicated" or "It's thematic."
  *   **Fix:** If you can't name The Job, the line is doing too much work. Split it or cut it.

  #### Step 2: Measure The Gap
  Ask: *Does the character believe this is true?*
  *   **Zero Gap:** They believe it, and they say it. (Standard assertion).
  *   **Wide Gap:** They know it's false (Lie) or uncertain (Hedge), but say it anyway.
  *   **Irony Gap:** They say it, but expect the listener to know they don't mean it literally (Joke/Sarcasm).
  *   **Pass:** You know exactly where the character stands internally.
  *   **Fail:** You are unsure if the character knows the truth.
  *   **Fix:** If you are unsure, the character is unsure. Give them an internal beat before the dialogue, or change the dialogue to match their confusion.

  #### Step 3: Check The Signal
  Ask: *How does the reader know the size of The Gap without hearing a voice?*
  *   **Zero Gap Signal:** None needed. Text defaults to truth.
  *   **Wide/Irony Gap Signal:** Needs a tag, an action, or context. (e.g., standing in a cloudless yard while predicting rain).
  *   **Pass:** The Signal is present on the page *before* or *immediately after* the line.
  *   **Fail:** The Signal relies on tone of voice that isn't described.
  *   **Fix:** Add a physical beat (lighting a cigarette, looking away) or contextual anchor (the cloudless sky). **Note:** For the SGD character, you cannot use tone. The Signal must come from the *reaction* of the listener.

  #### Step 4: Assess The Cost
  Ask: *What happens if someone says "Prove it"?*
  *   **High Cost:** They lose credibility, money, or safety. (High commitment).
  *   **Low Cost:** It was a joke, or a hedge. (Low commitment).
  *   **Pass:** The Cost matches The Job.
  *   **Fail:** The line sounds high-stakes but is treated as low-stakes (or vice versa).
  *   **Fix:** Adjust the surrounding silence. If the Cost is high, the room should go quiet. If the Cost is low, the conversation should flow over it.

  #### Step 5: The Taste Boundary
  If Steps 1–4 are clear, but the line still feels "off," stop.
  *   **Verdict:** This is **Taste, Not Theory**. The mechanics work; the music doesn't.
  *   **Action:** You decide. Do not workshop this. Your editor cannot fix rhythm.

  ---

  ### Application to Your Cases

  Here is the procedure run on your four specific examples.

  #### 1. The Doctor (Forbidden Knowledge)
  *   **The Job:** Asserting a medical fact off the record.
  *   **The Gap:** Zero. He believes it.
  *   **The Signal:** **FAIL.** Currently, the text likely treats this like normal dialogue. But the "forbidden" nature is the Signal. If he says it casually, the reader misses the risk.
  *   **The Cost:** High (License/Career).
  *   **Verdict:** **Fix.** The line is fine, but the *context* is underweight.
  *   **Instruction:** Do not change the dialogue. Change the beat *before* he speaks. He must check the door, lower his voice, or hesitate. The reader needs to see the *risk* to feel the *commitment*. If he says it while charting, it lands flat. If he says it while closing the chart, it lands heavy.

  #### 2. The Rain Joke (Ray)
  *   **The Job:** Irony/Metaphor (Funeral = Rain).
  *   **The Gap:** Wide (He knows it won't rain).
  *   **The Signal:** **PASS/FAIL Borderline.** You have the cloudless yard (Visual Signal). Is it enough?
  *   **The Cost:** Low (It's a joke).
  *   **Verdict:** **Fix.** The risk here is the reader thinking Ray is delusional or wrong, not joking.
  *   **Instruction:** You need a reaction shot immediately after. If Denise laughs, it's a joke. If Denise looks at the sky worriedly, it's a prediction. Since you want no "winking," do not have Ray laugh. Have *Denise* react to the *funeral* implication, not the weather.
      *   *Bad:* Ray: "It'll rain." (Denise laughs).
      *   *Good:* Ray: "It'll rain tomorrow." (Denise looks at the black umbrella in her hand).

  #### 3. "He's gone and I don't believe it."
  *   **The Job:** Assertion of fact + Assertion of mental state.
  *   **The Gap:** **BROKEN.** This is Moore's Paradox. Logically, it can be true. Pragmatically, it is incoherent speech. To say "P" is to imply "I believe P." Saying "P but I don't believe P" cancels the commitment of the first half.
  *   **The Signal:** None. It confuses the reader by design.
  *   **The Cost:** High (Grief).
  *   **Verdict:** **CUT.**
  *   **Instruction:** I am being blunt because you asked. This line works in a philosophy seminar, not in a grieving sibling's mouth. It calls attention to the *sentence*, not the *pain*. It makes the character sound like they are analyzing their grief, not feeling it.
      *   *Alternative:* "He's gone. I can't... I can't process that." (Separates the fact from the belief).
      *   *Alternative:* "He's gone." (Silence). "I don't believe it." (Two sentences. The pause creates the Gap).

  #### 4. The Device (Margot)
  *   **Invented Line:** *"Ray took the jewelry."* (She knows he did, but the device makes it sound like an accusation).
  *   **The Job:** Accusation.
  *   **The Gap:** Zero (She is certain).
  *   **The Signal:** **FAIL.** The SGD strips tone. A declarative from a machine reads as absolute data, not human judgment. It sounds like a police report.
  *   **The Cost:** High (Family war).
  *   **Verdict:** **Fix.** The problem isn't the line; it's the *reception*.
  *   **Instruction:** Because Margot cannot hedge ("I think..."), the *other characters* must interpret the commitment for the reader.
      *   *Draft:* [Device]: "Ray took the jewelry." Ray looked at his shoes.
      *   *Fix:* [Device]: "Ray took the jewelry." Denise said, "Margot, don't start."
      *   *Why:* Denise's defensiveness signals to the reader that this was a High Cost accusation, not a neutral observation. You outsource the Signal to the listener.

  ---

  ### What The Procedure Cannot Handle

  You asked for the limits. Here they are. Do not use the Triage on these; they require intuition.

  **1. Silence and Refusal**
  The procedure analyzes *utterances*. It cannot measure the weight of what is *not* said. If a character refuses to answer, the "Job" is undefined.
  *   **The Risk:** Readers often project their own anxiety onto silence. If your character stays silent, the reader might think they are guilty, hiding love, or dissociated.
  *   **The Fix:** You must anchor the silence. A character looking at the floor while silent means something different than a character staring down the interrogator. The *action* during the silence must carry the commitment the dialogue refuses to.

  **2. The Authorial Intrusion (The "Lying Character" Problem)**
  You mentioned Denise repeating her ex's lie.
  *   **The Risk:** In fiction, readers often assume the narrator (or POV character) is the author's proxy for truth. If Denise says "X is true" and X is actually false, readers may feel *you* (the author) made a mistake, rather than Denise being mistaken.
  *   **The Fix:** This is an epistemic problem. You must establish Denise's *unreliability* before the lie lands. If she has been wrong before, or if she prefaces it with "He always said...", the reader attributes the error to the ex-husband, not you. If she states it as gospel, the reader blames the book.

  **3. The "Taste" Boundary (Step 5)**
  The procedure can tell you if a line is *clear*. It cannot tell you if it is *beautiful*.
  *   **The Risk:** You can have a line where the Job, Gap, Signal, and Cost are perfectly aligned, and it still feels clunky.
  *   **The Fix:** This is your domain, not your editor's. If the mechanics pass but your ear rejects it, trust your ear. Philosophy explains how language works; it does not explain why "He's gone" hits harder than "He has departed."

  ### Summary for your 60 Lines
  1.  **Scan:** Identify the Job.
  2.  **Verify:** Is the Gap visible?
  3.  **Anchor:** If the Gap is wide (joke/lie), is there a physical signal or listener reaction?
  4.  **Cut:** If the line relies on Moore's Paradox ("I know but I don't believe"), kill it.
  5.  **SGD:** For the device user, ensure the *other* characters react to the weight of the words, since the machine cannot.

  Good luck. Five weeks is enough time to fix the signals, but not enough time to rethink the philosophy. Stick to the mechanics.
