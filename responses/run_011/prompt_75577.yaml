      *   *Case 2: The Rain Joke.* "It'll rain tomorrow" (cloudless, funeral context).
          *   Claim: Weather prediction.
          *   Stake: Low (it's a joke).
          *   Signal: Needs to be clear it's *about* the funeral, not the weather.
          *   Verdict: Risky. If the signal is too subtle, it looks like a bad prediction. If too obvious, it kills the joke.

      *   *Case 3: "He's gone and I don't believe it."*
          *   Claim: Fact + Mental State.
          *   Philosophy: Moore's Paradox. It's logically valid but pragmatically weird.
          *   Verdict: **Cut or Rewrite.** It's the "blunt" one. It calls attention to itself as a philosophical puzzle, not human speech.

      *   *Case 4: The Device (Margot).* Need to invent a line. "The box is empty." (She knows Ray took it).
