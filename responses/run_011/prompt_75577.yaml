      *   *Correction:* The SGD character is the hardest. The procedure needs to specifically address "Paralinguistic Stripping."
      *   *Correction:* Ensure the distinction between "Character Commitment" and "Reader Perception" is clear.

  8.  **Final Output Generation:** (Matches the structure of the prompt: Procedure -> Application -> Limitations).

  *(Self-Correction on the "He's gone" line)*: Actually, "He's gone and I don't believe it" is a classic example of Moore's Paradox. In fiction, it can work *if* it characterizes someone dissociated. But the user says readers find it "slightly off." That suggests it's failing as naturalism. I should advise cutting it *unless* the dissociation is the point, but even then, it's clunky. I'll advise cutting or embedding it in action.

  *(Self-Correction on the SGD)*: The problem with SGD is that text *looks* like commitment. "I am hungry" from a machine looks like a fact. "I think I am hungry" looks like a glitch. The fix is usually in the *reaction* of the listeners, not the line itself.

  Let's build the "Commitment Triage."

  *   **Step 1: The Job.** (Assert, Joke, Lie, Hedge).
  *   **Step 2: The Gap.** (Belief vs. Utterance).
  *   **Step 3: The Signal.** (How does the reader know the Gap status?).
  *   **Step 4: The Cost.** (What happens if they are wrong?).

