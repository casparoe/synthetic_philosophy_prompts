  2.  **Deconstruct the Philosophy (The "Theory" Bit):**
      *   The core philosophical concept here is *Speech Act Theory* (J.L. Austin, John Searle) and *Gricean Pragmatics*.
      *   Key concept: *Illocutionary Force*. What is the speaker *doing* by saying this? (Asserting, joking, promising, lying).
      *   Key concept: *Commitment*. When I say "P", do I believe P? Do I want you to believe I believe P?
      *   Key concept: *Context/Common Ground*. What do the speakers and listeners mutually know?
      *   Key concept: *Moore's Paradox*. "P but I don't believe P." (The "He's gone..." line).
      *   Key concept: *Implicature*. What is suggested but not said.

  3.  **Develop the Triage Procedure (The "Craft" Bit):**
