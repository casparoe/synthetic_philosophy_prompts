answer: |-
  Here is a mapping and critique of the Apple v. Samsung litigation through the lens of Shubik's Dollar Auction, designed for a law-and-econ reading group.

  ### 1. Mapping the Auction

  To make the Dollar Auction work, we must identify the mechanics of the bid, the bidders, and the constraints. In standard litigation analysis, the "party" is treated as a unitary rational actor. In an escalation model, the principal-agent friction is the engine.

  *   **The Bidders:**
      *   **The Principals:** Effectively Tim Cook (post-Jobs) and the Samsung Board. However, by 2012, the "bid" was no longer being placed by the CEOs directly. It was placed by **General Counsel and Outside Counsel**.
      *   **The Agents:** Quinn Emanuel (Apple) and various top-tier firms for Samsung.
      *   **The Incentive Mismatch:** For outside counsel, a "fold" means billing stops. For in-house GC, a "fold" means admitting the initial litigation strategy (greenlit by them) was a capital allocation error. The bidders at the table were not the ones writing the checks from the cash reserve; they were the ones managing the reputational cost of walking away.
  *   **The Pot:**
      *   **Nominal:** The damages award. Initially $1.049 billion, narrowing to the $399 million design patent chunk, then $539 million.
      *   **Real:** Precedent regarding "article of manufacture" (total profit vs. component profit) and the deterrent signal to the Android ecosystem.
  *   **The Bid Increment:**
      *   Each procedural phase: Discovery, Motion Practice, Trial, Appeal, SCOTUS Petition, Retrial.
      *   **Cost:** Tens of millions per increment. Reports suggest total legal spend approached $500M+ combined.
  *   **The Fold Point:**
      *   **2012:** After the first verdict, Samsung could have paid.
      *   **2016:** After SCOTUS granted certiorari, Apple could have settled for a reduced amount to avoid the risk of a remand.
      *   **2018:** After the retrial verdict ($539M), which was *higher* than the remanded amount ($399M).
  *   **Cost of Folding:**
      *   **Precedent:** A settlement admits no wrongdoing, but a withdrawal signals weakness to other litigants (e.g., other Android manufacturers waiting in the wings).
      *   **Internal Standing:** For the GC who recommended the "thermonuclear" strategy, folding validates the critics who said the litigation was a distraction.

  **The American Rule as the Auctioneer:**
  You correctly identified the American Rule (each side bears own fees) as the critical structural feature. In a "Loser Pays" regime (English Rule), the risk of the second-highest bidder paying *both* sets of fees might discourage early bidding. Under the American Rule, fees are sunk costs immediately upon expenditure. This creates the Dollar Auction dynamic: **I have spent $50M to get here; if I stop now, I lose the $50M *and* the pot. If I bid another $10M, I might save the $50M.**

  ### 2. Dollar Auction vs. War of Attrition

  This is the crucial theoretical distinction.
  *   **War of Attrition:** Players incur costs over time; the last player standing wins the pot. The loser pays their costs but loses the pot.
  *   **Dollar Auction:** The highest bidder wins the pot, but the *second-highest* bidder also pays their bid and gets nothing.

  Apple v. Samsung is a **hybrid**, but the Dollar Auction logic dominates the escalation phases.
  *   **Why Attrition fits:** It was a contest of endurance over 7 years.
  *   **Why Dollar Auction fits better:** In a pure war of attrition, you stop when marginal cost > marginal expected value. In a Dollar Auction, you continue to protect *sunk* investment. The 2018 retrial is the smoking gun. Samsung appealed the $399M to SCOTUS. They won the legal argument (remand). But the cost of that "win" was a retrial that resulted in a *higher* penalty ($539M).
  *   **The Trap:** Samsung bid (appealed) to avoid the $399M loss. The cost of the bid (SCOTUS litigation + retrial) plus the new penalty exceeded the original penalty. They became the second-highest bidder who paid for the privilege of losing more money.

  ### 3. Explanatory Power and Limitations

  **What the Model Explains:**
  1.  **The SCOTUS Gamble:** Economically, spending millions to argue over the calculation method of a $399M penalty is rational only if you view the legal fees as an investment to save the $399M. But when the retrial yields $539M, the model explains why they didn't stop at the remand: they were already "in" too deep to accept a loss on the appeal costs.
  2.  **The 2018 Verdict:** The jury awarding *more* after a successful appeal is the "$1.05 bid for the dollar." It validates the irrational commitment to the process over the economic outcome.

  **Where the Model Fails (or Stretches):**
  1.  **Settlement Availability:** In Shubik's game, you cannot settle; you must bid or lose. In litigation, settlement is a constant option.
      *   *Is this fatal?* No, but it highlights that the "auction" was psychological, not structural. The option to settle existed, but the *incentive* to settle was suppressed by the escalation dynamic.
  2.  **Discovery Value:** Legal fees aren't pure waste (like auction bids); they buy information.
      *   *Is this fatal?* Only if the information value remained high in years 5-7. By the retrial phase, discovery was marginal. The fees became purely procedural bids.
  3.  **Company Growth:** Both companies grew massively during the litigation.
      *   *Is this fatal?* **Yes, to the "pain" mechanism.** The Dollar Auction relies on budget constraints to create the trap. If the bidders have infinite credit, the paradox loses its bite.

  ### 4. The "Expressive Dollar Auction" Wrinkle

  This is the most dangerous variable for your session. If the pot value ($V$) is endogenous—meaning $V$ increases as spending ($S$) increases because the goal shifts from "money" to "vindication"—you risk tautology.

  *   **The Jobs Factor:** If the pot was "destroying Android" or "moral vindication," then spending $500M to win $539M is rational. The utility function includes *reputation* and *justice*, not just net present value.
  *   **Does it rescue the model?** It rescues the *rationality* of the actors, but it empties the *predictive power* of the Dollar Auction. The Dollar Auction is a model of *error* (irrational escalation). If we say "they escalated because the pot was worth it to them," we are no longer describing a paradox; we are describing revealed preference.
  *   **Does it empty it out?** Yes. If the pot can expand to match any bid, no behavior can falsify the theory.
  *   **The Real Defeater:** To test this, you need a case where the expressive value is **fixed and low**, but escalation still occurs.
      *   *Example:* Two non-competitors in a contract dispute over a trivial sum, with no reputational stakes, who still litigate to the Supreme Court.
      *   *Apple v. Samsung* cannot be that defeater because the expressive value was demonstrably high (Jobs' biographer notes, public statements).
      *   *Better Critique:* The Expressive Turn transforms the game from a **Game-Theoretic Trap** (Dollar Auction) to a **Signaling Game**. They weren't trapped; they were buying a signal of toughness to the market. The Dollar Auction assumes the bidders *want* to stop but can't. The Expressive model suggests they *wanted* to spend.

  ### 5. Final Verdict: Confirmation or Exposure?

  The case exposes a boundary condition the classic Dollar Auction does not anticipate: **The Liquidity Constraint.**

  Shubik's auction assumes the bids hurt. The paradox bites because the second-highest bidder faces a certain loss of their bid. In Apple v. Samsung, the "bids" (legal fees) were trivial relative to the balance sheets.
  *   Apple sat on >$100B cash during much of this.
  *   $500M in legal fees is <0.5% of cash on hand.

  **The Direction the Case Runs:**
  Apple v. Samsung does not confirm the Dollar Auction; it exposes that **the paradox requires scarcity to function as a trap.**

  For two players for whom the pot is trivially small relative to their balance sheets, the "auction" does not result in a crash; it results in a **war of signaling**. They didn't escalate because they were trapped by sunk costs (though that played a role); they escalated because they could afford to.

  **For your reading group:**
  Use this to pivot the discussion. The Dollar Auction explains *why* rational actors get trapped when resources are constrained. Apple v. Samsung shows that when resources are unconstrained, the "trap" becomes a "strategy." The anomaly isn't that they spent too much; it's that the classic model assumes the spending *matters* enough to force a fold. Here, the spending was noise.

  **The Takeaway:** The Dollar Auction predicts escalation due to *fear of loss*. Apple v. Samsung demonstrates escalation due to *capacity to pay*. The model explains the mechanism of the trap, but the case proves that deep pockets can turn a paradox into a purchase.
