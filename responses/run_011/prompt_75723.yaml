      *   *Claim 7:* "Note also that the whole theory is about harms and benefits to individuals..."
          *   *Assessment:* True. Benatar focuses on the individual coming into existence.
      *   *Claim 8:* "...because the alternative to being born isn't being a worse-off person but not being a person at all, Benatar is stuck with Parfit's non-identity problem..."
