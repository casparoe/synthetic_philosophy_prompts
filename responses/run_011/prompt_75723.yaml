          *   *Assessment:* This is the conclusion of the Asymmetry. Benatar agrees.
      *   *Claim 5:* "...since the pleasures a life would contain are precisely what non-existence is already credited with not needing."
          *   *Assessment:* A bit clunky, but captures the idea that non-existence isn't deprived of pleasure. Benatar would likely accept the sentiment.
