  2.  **Deconstruct the Arguments:**
      *   **D (Kalam Cosmological Argument):**
          1.  Whatever begins to exist has a cause.
          2.  The universe began to exist.
          3.  Therefore, the universe has a cause.
          4.  Cause must be timeless, spaceless, powerful, personal (volition).
          *   *Weakness:* Relies on physics (Big Bang) and metaphysics of time/infinites.
      *   **R (Leibnizian Cosmological Argument / PSR):**
          1.  Everything that exists has an explanation (either in necessity of its own nature or in an external cause).
          2.  The universe exists.
          3.  Therefore, the universe has an explanation.
          4.  Explanation must be God (necessary being).
          *   *Weakness:* Relies on PSR (Principle of Sufficient Reason), which many deny for contingent facts or the universe as a whole.

  3.  **Drafting Section 1: Common Ground (Claims both could sign):**
      *   Need to find overlap without mush.
      *   Both agree: Universe exists, Universe is contingent (didn't *have* to be this way), God exists (they are both Christians), Atheists often attack the wrong thing, Science doesn't settle metaphysics.
