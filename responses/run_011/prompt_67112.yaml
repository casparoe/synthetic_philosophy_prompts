      *   **R's Position:** Leibnizian-style (Why is there something rather than nothing?). Rejects Kalam as fragile (science changes, infinities possible). Thinks you don't need a beginning to argue for God.
      *   **Goal:** A document they *should* have produced (Adversarial Collaboration).
      *   **Deliverables:**
          1.  Numbered list of claims both could sign (overlap, limitations, cosmology limits).
          2.  Table of disagreements (stated in D's words, then R's words, noting semantic disputes).
          3.  The Cruxes (sub-questions, evidence/thought experiments, pre-registered predictions).
      *   **Constraints:** No book lists, no philosopher names (explain terms plainly), readable in ~20 minutes.
      *   **User's Guess:** Fight is about the "everything needs an explanation" principle (PSR). Suspects weak version exists. Suspects beginning/explanation questions aren't separable.
      *   **Specific Cruxes to Include:** Is the beginning premise needed? Can a cause outside time be a person who decides?
