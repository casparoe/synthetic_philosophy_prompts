      *   R might refuse to sign that "A beginning strengthens the case" because he thinks it weakens it by making it vulnerable.
      *   Is one argument dead? Kalam is vulnerable to quantum vacuum fluctuations (things beginning without deterministic causes). Leibniz is vulnerable to "Why not just brute fact?"
      *   Fake Crux: The "Timeless Choice" might be incoherent for both, but they pretend it works.
