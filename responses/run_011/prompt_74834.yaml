      *   *Expert Intuition:* Often operates faster than conscious labeling. The judgment ("No") is more reliable than the justification ("Because fermentation").
      *   *Conclusion:* Do not doubt the expertise. Doubt the *narrative* generated to explain the expertise. This is consistent with research on expert intuition (e.g., Kahneman's System 1 vs. System 2, though in high-validity environments like coffee cupping, System 1 is highly trained).

  4.  **Develop the Practical Strategy (The "What to put to him?" question):**
