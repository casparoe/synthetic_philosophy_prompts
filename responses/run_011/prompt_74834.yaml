  2.  **Deconstruct the Philosophical Argument (The "Is he right?" question):**
      *   The OD's view is a form of *intellectualism* or *explicitism*. It assumes all knowledge is propositional (knowing *that*).
      *   The User's experience points towards *tacit knowledge* (Michael Polanyi) or *know-how* (Gilbert Ryle).
      *   *Polanyi's Maxim:* "We know more than we can tell."
      *   *Dreyfus & Dreyfus Model of Skill Acquisition:* Novices rely on rules; experts rely on intuition/holistic recognition. Trying to force experts to use novice rules degrades performance.
      *   *The "Frame Problem":* In AI and cognitive science, it's impossible to list all relevant contextual variables in advance.
