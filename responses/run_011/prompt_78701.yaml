prompt: |-
  Six weeks from now I have to stand up in front of our department's reading group and say something about Wittgenstein's private language argument that isn't either a paraphrase of the textbook or a total cop-out, and every time I sit down with the commentaries I come up deeper in the weeds than I went in. The trouble is that everybody in the literature seems to be grading proposed answers against a different set of criteria, and half of those criteria are just the grader's own conclusion wearing a disguise: whoever insists that meaning has to be publicly checkable has already decided the diarist loses, and whoever insists the argument can't be allowed to touch public language at all has decided he wins. So I don't want another reading of the text off you. I want the spec. Give me the list of requirements that any account of what fixes the meaning of a sign — and in particular any proposed diagnosis of what goes wrong, or what goes right, in the 'S' diary from §256 onward — has to meet to count as adequate. For this list, fix the purpose as follows: the account must be statable to somebody who isn't already a Wittgensteinian, so 'form of life', 'grammar' and 'criteria' can't do any unexplained work, and it must be capable of actually settling whether the diarist case is a genuine reductio or a bit of theatre. For each requirement I want a short handle, the case or consideration behind it — i.e. the concrete situation that breaks an account which lacks it, drawn from the private ostension, the whatever-seems-right-is-right move, the split between memory scepticism and meaning scepticism, the last speaker of a dying language, the manometer, the fact that an uncracked code isn't thereby private — and a tag saying whether it's non-negotiable, a preference of one camp, or something you'd strike off the list altogether. Eight to twelve of them.

  Then the parts I actually care about. Which subset of the requirements is jointly unsatisfiable? If you can show that no account can simultaneously deliver correctness-coming-apart-from-seeming, no appeal to other speakers, and a way of fixing the meaning that doesn't beg the question, that's a result, and I want it argued rather than asserted. And which single requirement does the most excluding — the one that, once granted, has already killed most of the interesting candidates. If there's room at the end of that section, two or three lines each on how the standard diagnoses do against the list, but keep it short, the list is the point. One more thing, sorry: my flatmate, who has done no philosophy at all, heard me going on about this over dinner and offered a fix. He says the diarist doesn't need anybody else's help — she just has to stop recording the sensation and start recording the policy she used to decide whether today's case falls under S, so that correctness becomes consistency with her own earlier policy rather than a match against a private sample. He's extremely pleased with himself. Run it against the list and tell me whether it survives, which requirement kills it if it doesn't, or whether it exposes something the list is missing.

  Format: open with two or three sentences naming the requirement that does most of the work and the jointly unsatisfiable subset, so I've got the punchline before the detail. Then these sections in this order — 'What the spec is for' (about 150 words, including anything you'd add to or strike from the purpose I set), 'The requirements' (the bulk of it, roughly 1,200 words, bolded handle then the motivating case then the tag), 'The squeeze' (400 words: the impossibility result and the most exclusionary requirement), 'Prejudices in a requirement's clothes' (300 words: the demands that already assume the diarist loses, and what a critic can refuse without cost), and 'The flatmate test' (250 words). No reading list and no name-checking commentators, please — I've got the bibliography sorted, what I can't work out is what I'm suposed to be asking of it.
