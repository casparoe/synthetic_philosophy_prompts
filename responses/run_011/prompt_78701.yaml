  The requirement doing the most work is **Normative Independence**, which demands meaning constrain use beyond mere inclination. The jointly unsatisfiable subset comprises **Private Access**, **Normative Force**, and **Non-Circular Fixation**, forming a trilemma where satisfying any two violates the third.

  ### What the spec is for

  This specification isolates the structural mechanics of meaning-fixing without relying on sectarian terminology that presupposes the conclusion. We are testing whether the diarist's project is logically coherent, not whether it fits a specific philosophical tribe. The purpose is to determine if the argument holds water without relying on circular definitions of 'public' or 'private'. I would add a constraint against psychological explanations; the problem is logical, not empirical. I would strike any requirement demanding empirical verification, as the argument concerns possibility, not actuality. The goal is to see if the concept of a private rule collapses under its own weight, not to prove Wittgenstein right by definition. Any account must be statable to a skeptic who accepts neither community-based nor Platonic solutions. It must clarify whether the failure is in the *idea* of privacy or the *mechanism* of rule-following.

  ### The requirements

  **Normative Gap**
  An account must distinguish between using a sign correctly and merely thinking one is using it correctly. The motivating case is the 'whatever seems right is right' move: if the diarist's impression of correctness constitutes correctness, there is no room for error, and thus no meaning. Without a gap between fact and norm, the sign does nothing. If I cannot be wrong, I am not following a rule; I am just acting. This requirement blocks accounts that reduce meaning to psychological conviction. It demands a standard external to the immediate impulse.
  *Tag: Non-negotiable*

  **Memory Independence**
  The account cannot rely solely on the diarist's memory to validate past meanings. The motivating case is memory skepticism: if the only check on whether 'S' meant *this* sensation is the memory of what 'S' meant, there is no way to distinguish remembering correctly from remembering incorrectly. The standard must exist independently of the recall act. If memory is the sole tribunal, it cannot be cross-examined. This forces the account to provide a non-memory-based anchor for meaning.
  *Tag: Non-negotiable*

  **Temporal Stability**
  Meaning must persist across time intervals without continuous re-establishment. The motivating case is the diary entry next week: if the meaning of 'S' must be re-fixed every time it is used, it is not a stable sign but a new event each time. The account must explain how the past fixation binds future use. A sign that means something different every moment is noise. This requirement ensures the account treats language as a practice extended in time, not a series of disconnected punctual events.
  *Tag: Non-negotiable*

  **Self-Intelligibility**
  The user must be able to understand the sign's use at the moment of application. The motivating case is the uncracked code: a cipher remains language even if no one else can read it, provided the user can. An account that makes the user a stranger to their own usage fails to describe language. If the meaning is fixed but inaccessible to the fixer, it is not a tool for them. This protects the intuition that privacy does not entail self-alienation.
  *Tag: Preference (Private)*

  **Ostensive Sufficiency**
  The account must explain whether pointing inward can fix reference without external props. The motivating case is private ostension: if I cannot name a sensation by attending to it, how does public naming work? The account must clarify why inward pointing fails if it does, without smuggling in public props. It challenges the assumption that inner pointing is inherently defective compared to outer pointing. This tests whether the defect lies in the object or the act.
  *Tag: Preference (Private)*

  **Public Checkability**
  The account must specify whether third-party verification is constitutive of meaning or merely evidential. The motivating case is the manometer: if a correlation with blood pressure makes 'S' public, does that mean meaning *requires* such correlation? This demands often assume the conclusion that privacy kills meaning. It forces a distinction between what makes meaning *possible* versus what makes it *knowable* to others. This is often where debates stall.
  *Tag: Preference (Public)*

  **Rule-Behavior Distinction**
  Having a rule must differ from merely behaving regularly. The motivating case is the last speaker of a dying language: if language is just regularity, the last speaker still speaks; if it requires a community, they fall silent. The account must distinguish habit from obligation. Regularity is descriptive; rule-following is normative. This requirement prevents reducing meaning to statistical frequency of use.
  *Tag: Non-negotiable*

  **Sign-Sensation Distinction**
  The sign itself cannot be identical to the sensation it names. The motivating case is crying out vs. naming pain: replacing a name with a cry eliminates the propositional structure. The account must show how the sign stands for the sensation without being it. If the sign is the sensation, it cannot be used to describe it. This ensures the account preserves the representational function of language.
  *Tag: Non-negotiable*

  **Interpretation Halt**
  The account must explain how a rule applies without requiring further rules to interpret it. The motivating case is the regress of interpretations: if every application needs a justification, meaning is never reached. There must be a point where acting simply is following the rule. This blocks infinite regresses of mental commentary. It demands a primitive level of agreement between the rule and the action.
  *Tag: Preference (Public)*

  **Cipher Viability**
  Privacy alone cannot be the disqualifier for language status. The motivating case is the encrypted diary: a code is private but meaningful. The account must distinguish logical privacy (in principle inaccessible) from contingent privacy (unknown to others). If privacy kills meaning, codes are impossible. This requirement forces precision on what kind of privacy is at issue. It strikes down arguments based solely on isolation.
  *Tag: Strike-off (if used to kill private language)*

  ### The squeeze

  No account can simultaneously deliver **Normative Force**, **Private Access**, and **Non-Circular Fixation**. If you maintain Private Access (no outside help) and Normative Force (correctness differs from seeming), you cannot fix the meaning without begging the question. To fix meaning privately, you need a standard. If that standard is internal (a memory, a feeling), it collapses into seeming right, violating Normative Force. If the standard is external (a public check), it violates Private Access. The diarist needs a constraint that is not themselves, yet is accessible only to them. This is the impossibility result. The most exclusionary requirement is **Normative Independence**. Once granted, it kills any account that relies on internal consistency alone, because consistency is just another seeming. It forces the account to find a norm that is not merely psychological. Most candidates fail here because they offer a mechanism (memory, policy) that cannot generate an 'ought' from an 'is' without external validation. Standard diagnoses either deny Private Access (community view) or deny Normative Force (deflationary view), rarely solving the fixation problem without circularity.

  ### Prejudices in a requirement's clothes

  Several demands stack the deck against the diarist by disguising conclusions as constraints. **Public Checkability** is the primary offender; insisting meaning must be verifiable by others assumes the diarist loses before the argument starts. A critic can refuse this without cost if they solve Normativity another way. Similarly, **Interpretation Halt** often smuggles in community practice as the only way to stop the regress. A legitimate constraint must not presuppose the solution. **Memory Independence** is non-negotiable, but often framed to imply only public records count as independent. A critic can accept Memory Independence but argue for private artifacts (samples) as independent standards. The key is distinguishing between requirements that describe the *structure* of meaning versus those that mandate the *source* of meaning. Demands that mandate the source are prejudices. Demands that describe the structure (like Normative Gap) are legitimate. Refusing the source mandates leaves the logical problem open.

  ### The flatmate test

  The flatmate's "policy consistency" fix fails against **Normative Independence**. Recording the policy shifts the problem but does not solve it. Now the policy itself is a sign that must be followed. Is following the policy correct, or does it just seem correct? If the diarist decides tomorrow that today's policy application was correct, we are back to 'whatever seems right is right'. The policy is just another entry in the diary. It survives **Self-Intelligibility** (the user understands the policy) and **Cipher Viability** (it is a private rule). However, it collapses on **Memory Independence** and **Normative Gap**. The policy needs interpretation, and the memory of the policy needs validation. It exposes that the list is missing nothing; rather, it confirms that internal records cannot generate normative force. The flatmate has invented a longer diary, not a standard.
