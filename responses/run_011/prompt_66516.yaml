answer: |-
  # TAXONOMY OF COMPARISON: A POSITIONING TOOL

  **Instructions:** Read the seven claims below. Mark **A** (Agree) or **D** (Disagree) for each. Locate your resulting pattern in the *Leaves* section to find your theoretical coordinates. There are no 'correct' patterns; each represents a defensible scholarly stance.

  ### THE SEVEN AXES (BRANCH NODES)
  1.  **Logic:** 'Unique' and 'comparable' are mutually exclusive predicates.
  2.  **Category:** 'Genocide' is a stable class where instances differ only in degree.
  3.  **Mechanism:** The Holocaust was produced by ordinary modern capacities (bureaucracy/rationality).
  4.  **Continuity:** Valid comparison requires a historical/causal link between events (e.g., colonialism).
  5.  **Memory:** Public remembrance is a zero-sum competition for moral capital.
  6.  **Representation:** The event can be fully integrated into standard historical narrative.
  7.  **Locus:** Does 'singularity' refer to the *historical event* itself or our *practices of remembering* it? (Event / Memory)

  ---

  ### THE POSITIONS (LEAVES)

  | Position | Pattern (1–7) | Core Commitment | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **Dissolved Question** | **D** / – / – / – / – / – / – | Unique and comparable operate on different axes (ontological vs. epistemological); the debate is a category error. | Risks reducing substantive ethical conflict to mere semantics; sidesteps the political stakes of memory. |
  | **Incomparabilist** | **A, D, D, D, A, D, Event** | The rupture is ontological; comparison violates the specific moral status of the victims. | Requires refusing historical explanation entirely; can isolate the event from all human history. |
  | **Friedländer** | **A, D, D, D, D, D, Memory** | The event resists integration; 'uniqueness' marks the limits of representation and memory. | Makes historical writing perpetually inadequate; risks turning the event into a theological mystery. |
  | **Bauer** | **A, D, D, D, D, A, Event** | Unprecedented in quality (intent to destroy all), but not unique; comparable but distinct. | Must constantly police the boundary between 'unprecedented' and 'unique' without slipping into either. |
  | **Bauman** | **A, A, A, D, D, A, Event** | A product of modern rationality; comparable because the *capacities* used are universal. | Risks 'normalizing' the event by making it a functional output of civilization rather than a rupture. |
  | **Moses** | **A, A, A, A, D, A, Event** | Colonial genocides are the antecedent; comparison reveals continuity in European violence. | Must argue causal links that are sometimes fragmentary; can flatten specific differences between colonies and camps. |
  | **Nolte / Habermas** | **A, A, D, A, D, A, Event** | Comparison is necessary for historicization; fear of uniqueness blocks understanding. | **See Indistinguishable Pair below.** |
  | **Rothberg** | **A, A, D, D, D, A, Memory** | Memory is multidirectional; comparison creates solidarity rather than competition. | Relies on an optimistic view of public discourse that may not match political reality. |
  | **Diner** | **A, D, D, A, A, D, Memory** | 'Negative Symbiosis'; Jews and Germans are locked in a specific, exclusive post-war relationship. | Implies a closed loop of memory that excludes other victims or new generations. |

  ---

  ### EMPTY LEAVES (UNOCCUPIED TERRAIN)
  *These combinations are logically possible but theoretically unstable.*

  1.  **The Mystical Modernist (A, A, A, D, A, D, Event)**
      *   **Why Empty:** Claims the event is a product of ordinary bureaucracy (3A) yet unrepresentable (6D) and memory is zero-sum (5A). Incoherent: if the mechanisms are ordinary/understandable, why is representation impossible and memory competitive?
  2.  **The Ranking Skeptic (A, D, D, D, A, A, Event)**
      *   **Why Empty:** Claims the event is unique/unrepresentable (2D, 6D) but memory is zero-sum (5A). Deeply unattractive: if the event cannot be represented or categorized, one lacks the epistemic ground to claim it 'wins' the competition for memory.

  ---

  ### INDISTINGUISHABLE PAIRS
  *This tree cannot fully separate the following positions without an additional question.*

  *   **Nolte vs. Habermas:** Both share the pattern **A, A, D, A, D, A, Event**.
      *   **The Missing Question:** *What is the political aim of comparison?* (To normalize German history / To democratize memory culture).
      *   **Note:** Nolte seeks to reduce guilt via comparison; Habermas seeks to secure democracy via comparison. The tree identifies their historical method, not their political teleology.

