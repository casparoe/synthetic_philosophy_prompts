      *   Tone appropriate? Yes.

  7.  **Final Polish:** Ensure the distinction between *justification* and *excuse* is clear for someone with legal aid experience (they likely know the criminal law analog). Ensure the distinction between *normative* legitimacy (ought to be obeyed) and *sociological* legitimacy (is obeyed/accepted) is clear.

      *(Self-Correction during drafting)*: Make sure I don't take a side on whether Kosovo *was* legitimate. The user wants to understand the *argument structure*, not get a verdict on NATO. Keep it meta-ethical/conceptual.

      *(Refining the "Libya" analysis)*: Dana's Libya point is about *mandate creep*. Resolution 1973 allowed civilian protection, not regime change. Her unease suggests she sees the "legitimacy" eroding as the mission expanded beyond the legal text, even if the actors were the same. This touches on *Procedural Legitimacy* vs. *Outcome Legitimacy*. I should add that to the menu.

