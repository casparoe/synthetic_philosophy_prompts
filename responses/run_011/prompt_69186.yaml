          *   Iraq: Political Acceptance (lack thereof).
          *   Libya: Wobbly mix, ending in Subjective Approval.
      *   *Consistency:* She needs Moral Justification for Kosovo to stand out from Iraq. She needs Political Acceptance to dump Iraq. She can't have both without explaining why Moral Justification didn't apply to Iraq (which is hard) or why Political Acceptance didn't block Kosovo (which is also hard, given the veto).
