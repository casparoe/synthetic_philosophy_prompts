  ### 4. Meta-Questions

  **Q1: Do the number and identifiability of victims enter the principle?**
  *   **Answer:** **No, not directly.** They are correlates, not causes.
  *   **Reasoning:** Your hesitation in **F** (diffuse harm) vs **A** (specific patient) stems from *enforceability*, not morality. Under the **Accessible Signal Standard**, it does not matter if 1 person dies (A) or 1,000 lose money (F). In both, the Institution failed to make a known risk accessible. However, identifiability matters for **Clause 1 (Individual Culpability)**. It is harder to prove an individual ignored a signal when the harm is diffuse (no specific victim triggers the review). The principle explains why you feel "the Firm" is evasive in **F**: because diffuse harm makes it difficult to pin Clause 1 on a specific human, forcing you to rely on Clause 2 (Institutional Defect), which feels less satisfying than a human verdict.
  *   **Advice:** Do not let victim count alter the verdict. Let it alter the *remedy*. Diffuse harm requires structural restitution (F); specific harm allows for individual accountability (A/B).

  **Q2: Is the distinction between "Moral Defect" and "Misfortune" real or mood?**
  *   **Answer:** **It is real.** It tracks **Avoidable Ignorance.**
  *   **Reasoning:** Your log is not recording your mood; it is recording the **governance of knowledge**.
      *   **Misfortune (D, H, ii):** The knowledge required to prevent the harm *did not exist* in the human network. You cannot be responsible for unknown unknowns.
      *   **Moral Defect (A, F, i, iv):** The knowledge *existed* but was prevented from reaching the decision-maker by the system design (generic notes, obscured metrics, "informational" shields).
  *   **Why A vs D feels different:** In **D**, you feel the weight of nature (landslide). In **A**, you feel the weight of bureaucracy (email not sent, note obscured). The principle validates this feeling. A "Gap" is not just "no one to blame"; it is "someone *should have known*, but we built a system that ensured they didn't." That is a moral defect. **D** is a defect in the universe; **A** is a defect in the governance. Your log correctly distinguishes them.
