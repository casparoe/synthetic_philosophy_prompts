answer: |-
  ### Desiderata for a Theory of Finite Belief

  **1. The Long List (Implicit Commitment)**
  *Vignette:* A librarian explicitly believes one thousand separate cataloging rules. She has never considered them all at once. When you present the conjunction of all thousand rules, she is not surprised, though she has never uttered it.
  *Failure:* A theory that denies all closure makes her acceptance of the conjunction a new, unrelated belief, failing to explain her lack of surprise. A theory that enforces full closure claims she already believed it, failing to explain why she never used it.
  *Status:* **Non-Negotiable.** The theory must distinguish between stored data and accessible consequences.

  **2. The Clock (Resource Sensitivity)**
  *Vignette:* An engineer stares at a schematic. At 9:00 AM, she does not believe the circuit will overload. Given paper and an hour, by 10:00 AM she believes it will. No new external data arrived.
  *Failure:* A static theory must say her belief changed without cause (magic) or that she always believed it (omniscience). Both misdescribe the cognitive labor involved.
  *Status:* **Non-Negotiable.** Belief ascription must be indexed to time and computational budget.

  **3. The Factorization (Explicit vs. Implicit)**
  *Vignette:* A cryptographer believes a number $N$ is the product of two primes. She does not know which primes.
  *Failure:* If she believes all truths about the factorization, she knows the primes (breaking encryption). If she believes none, she doesn't understand what "product of two primes" means.
  *Status:* **Non-Negotiable.** The theory must separate believing a description from believing the unique object satisfying it.

  **4. The Contradictory Pair (Paraconsistency)**
  *Vignette:* A juror believes the defendant was at the movies (based on a ticket) and believes he was at the crime scene (based on DNA), having never compared the timestamps.
  *Failure:* Classical logic dictates that from a contradiction, anything follows. If the theory accepts this, the juror believes the moon is made of cheese.
  *Status:* **Negotiable.** Some programs insist inconsistency implies total irrationality; others allow local "belief compartments."

  **5. The Informative Proof (Cognitive Dynamics)**
  *Vignette:* A student struggles with a theorem. Upon seeing the proof, she says, "I didn't know that." Yet the proof used only axioms she already accepted.
  *Failure:* If she already believed the consequences, the proof taught her nothing. If she didn't, her previous belief set was incomplete in a way standard logic forbids.
  *Status:* **Non-Negotiable.** The theory must account for learning via inference, not just observation.

  **6. The Two Names (Hyperintensionality)**
  *Vignette:* A child believes "Superman flies" but denies "Clark Kent flies," not knowing they are the same person.
  *Failure:* A theory that fixes belief content solely by real-world reference cannot explain the dissent. It must track how the agent conceives of the object, not just the object.
  *Status:* **Negotiable.** Externalist programs argue the child is simply wrong about Clark Kent, and the belief report is loose talk.

  **7. The Prediction Requirement (Utility)**
  *Vignette:* We attribute a belief to a chess program to anticipate its next move.
  *Failure:* If the theory allows too much flexibility (e.g., the program believes anything consistent with its code), it predicts nothing. If it assumes perfect calculation, it predicts moves the program is too slow to find.
  *Status:* **Non-Negotiable.** A theory that cannot narrow down behavioral outcomes is useless.

  **8. The Coherence Requirement (Normativity)**
  *Vignette:* We criticize a politician for holding inconsistent views, implying they *ought* to fix it.
  *Failure:* If the theory permits all inconsistencies as valid "finite belief," criticism loses its bite. If it demands perfect consistency, no human is ever rational.
  *Status:* **Negotiable.** This depends on whether the theory describes mental states or prescribes norms of reasoning.

  **9. The Missing Concept (Conceptual Capacity)**
  *Vignette:* A dog believes the ball is under the sofa. It does not believe the ball is under the "furniture," because it lacks the concept of furniture.
  *Failure:* A theory that allows infinite closure attributes the concept of furniture to the dog via logical implication.
  *Status:* **Non-Negotiable.** Belief requires the capacity to entertain the proposition.

  **10. The Publicity Requirement (Ascriber Tractability)**
  *Vignette:* A scientist attributes a belief to a neural network. She cannot simulate the network (it is too large); she must infer belief from structure and output.
  *Failure:* If determining the belief requires running the agent's computation step-by-step, the ascription is just a simulation, not a generalization.
  *Status:* **Non-Negotiable.** The ascriber is also resource-bounded.

  **11. The Graded Version (Uncertainty)**
  *Vignette:* A mathematician says she is "mostly sure" a conjecture is true, though it is either necessarily true or necessarily false.
  *Failure:* Standard probability assigns 1 or 0 to necessary truths. A theory must allow degrees of confidence in computable but uncomputed facts.
  *Status:* **Negotiable.** Binary belief theories exist, though they struggle with this case.

  ### The Tally

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | 1. Implicit Commitment | **Non-Negotiable** | Must explain surprise vs. commitment. |
  | 2. Resource Sensitivity | **Non-Negotiable** | Core definition of "finite agent." |
  | 3. Explicit vs. Implicit | **Non-Negotiable** | Distinguishes understanding from knowledge. |
  | 4. Paraconsistency | *Negotiable* | Depends on tolerance for compartmentalization. |
  | 5. Cognitive Dynamics | **Non-Negotiable** | Must explain learning via inference. |
  | 6. Hyperintensionality | *Negotiable* | Externalists reject mode-of-presentation. |
  | 7. Prediction | **Non-Negotiable** | The functional purpose of ascription. |
  | 8. Coherence | *Negotiable* | Normative vs. descriptive split. |
  | 9. Conceptual Capacity | **Non-Negotiable** | Prevents category errors across species. |
  | 10. Publicity | **Non-Negotiable** | Ascriber is also finite. |
  | 11. Graded Version | *Negotiable* | Binary vs. probabilistic is a design choice. |

  ### The Impossibility Theorem

  There is a trilemma hidden in these desiderata. You cannot simultaneously satisfy **Resource Sensitivity (2)**, **Publicity (10)**, and **Prediction (7)**.

  If belief is sensitive to resources (2), then what an agent believes depends on the specific computational path it takes to reach a conclusion. To predict that belief (7), the ascriber must know the outcome of that path. But if the ascriber cannot run the agent's computation (10), they cannot know the outcome without essentially simulating the agent. If they must simulate the agent to predict the belief, the "theory" provides no compression or shortcut; it is merely a mirror.

  To solve this, one requirement must be sacrificed. The cheapest sacrifice is **Prediction (7)**. We must accept that belief ascription for finite agents is inherently heuristic. It will not yield deterministic forecasts of behavior, but only probabilistic constraints. We give up the dream of perfect anticipation to keep the vocabulary usable by bounded observers. If we kept Perfect Prediction, we would be forced to assume the ascriber is omniscient relative to the agent, violating the spirit of the project. If we gave up Publicity, the theory would be useless to any scientist who cannot simulate the subject. Weak prediction is a limitation; impossible ascription is a dead end.

  ### The Killer Requirement

  The single demand that eliminates the most candidates is **The Publicity Requirement (10)**.

  Most formal systems define belief semantically: an agent believes $P$ if $P$ is true in all worlds compatible with the agent's state. This definition assumes the theorist can inspect the "worlds" or the "state" directly. It assumes a God's-eye view of the truth conditions. Demanding that the *ascriber* be computationally bounded rules out any theory where belief is defined by the *actual* extensional set of consequences. It kills standard possible-worlds semantics immediately, because checking truth across worlds is intractable. It forces the theory to be about *accessible markers* of belief, not belief itself. This is the hardest constraint for formal logic to bear, as logic traditionally cares about what is true, not what is feasible for an observer to verify.

  ### Evaluation of Solution Families

  Four broad families of solutions attempt to meet these demands, and all bleed somewhere.

  The first family populates semantics with **Impossible Worlds**. They allow agents to believe $P$ without believing $Q$, even if $P$ entails $Q$, by admitting worlds where the entailment fails. This solves Logical Omniscience and the Informative Proof beautifully. However, it struggles with Publicity. To ascribe belief, the observer must know which impossible worlds the agent considers possible. Specifying these worlds is often as hard as simulating the agent, violating the tractability constraint.

  The second family uses **Syntactic or Awareness Models**. Here, belief is a stock of sentences plus rules for deriving new ones. This handles Resource Sensitivity and Conceptual Capacity perfectly; you only believe what you have derived or can express. But it is brittle. It struggles with Prediction because small changes in the rule set lead to massive changes in behavior. It also risks making belief too shallow, reducing it to text manipulation rather than understanding.

  The third family abandons semantics for **Interpretive Practice**. Belief is not a state inside the agent but a stance taken by the observer to make sense of behavior. This satisfies Publicity and Prediction by fiat: beliefs are whatever best predict the agent. But it sacrifices realism. It cannot distinguish between an agent that *cannot* compute a consequence and one that *has not yet* computed it, collapsing the distinction required by the Clock and Informative Proof cases.

  The fourth family employs **Probabilistic or Logical Uncertainty**. They assign probabilities to necessary truths, handling the Graded Version and Factorization cases. This is the most robust for science writers, as it mirrors statistical practice. However, it is computationally expensive. Maintaining a coherent probability distribution over logical claims is often harder than solving the claims themselves, threatening the Publicity requirement again.

  None survive the list intact. The Impossible Worlds approach is the most elegant but the least public. The Syntactic approach is the most realistic but the least predictive. The Interpretive approach is the most usable but the least descriptive of internal states. The Probabilistic approach is the most scientifically familiar but the most computationally demanding for the ascriber. The choice of theory is therefore not a search for truth, but a choice of which desideratum you are willing to let fail.
