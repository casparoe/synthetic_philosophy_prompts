answer: |-
  ### Brainstorming Candidate Principles

  Before formalizing, I will list four candidate schemas for distinguishing the "surviving" part of a theory from the "discarded" part. I include one that is manifestly inadequate to clarify the boundary of plausibility.

  1.  **The Structural Correspondence Principle (SCP):** A theory $T_1$ is approximately true if and only if there exists a successor theory $T_2$ such that the mathematical equations of $T_1$ are derivable from $T_2$ under specific limiting conditions.
      *   *Motivation:* Captures Fresnel and Newton.
      *   *Risk:* Might accidentally vindicate Ptolemy (whose epicycles are mathematically equivalent to Fourier series).
  2.  **The Causal-Explanatory Indispensability Principle (CEIP):** A theoretical posit $P$ refers and is approximately true if and only if $P$ was causally indispensable for the derivation of a *novel* prediction that was subsequently verified, and the successor theory $T_2$ attributes causal power to a corresponding entity.
      *   *Motivation:* Distinguishes Boltzmann (atoms cause pressure) from Ether (medium carries light, but light is self-propagating field).
      *   *Risk:* Requires a robust theory of "causal power" that may be hard to define independently of $T_2$.
  3.  **The Limiting Identity Principle (LIP):** A term $t$ in $T_1$ refers if and only if there is a term $t'$ in $T_2$ such that $t$ denotes the limit of $t'$ as a parameter approaches a value (e.g., $v/c \to 0$).
      *   *Motivation:* Handles Newton (mass) vs. Newton (absolute space).
      *   *Risk:* Fails for discontinuous theoretical shifts (e.g., phlogiston to oxygen involves a reversal of flow, not a limit).
  4.  **The Linguistic Continuity Principle (LCP) [The Obviously Wrong Candidate]:** A term $t$ in $T_1$ refers if and only if the word $t$ (or a direct cognate) is still used in current scientific textbooks.
      *   *Why it fails:* "Ether" is still used in "luminiferous ether" discussions and "ether" in chemistry, but the posit is dead. "Phlogiston" is dead, but "Oxygen" survives. Linguistic survival tracks sociological inertia, not ontological commitment. Furthermore, "Force" survives in textbooks but Newton's *concept* of force (instantaneous action at a distance) is obsolete.

  ---

  ### 1. Candidate Dividing Principles

  Here are three refined principles derived from the brainstorming, stated as explicit schemas.

  **Principle A: Structural-Novelty Correspondence (SNC)**
  *Schema:* A theory $T_{old}$ is approximately true in respect $R$ if and only if:
  1.  $T_{old}$ yielded a novel prediction $N$ (a phenomenon not used to construct $T_{old}$);
  2.  The derivation of $N$ relied essentially on mathematical structure $S$;
  3.  The successor theory $T_{new}$ preserves $S$ as a limiting case or structural invariant.
  *Forced by:* The Fresnel case. The math survived because it predicted the Poisson spot (novelty), unlike Ptolemy's fit to existing data.

  **Principle B: Causal-Role Mapping (CRM)**
  *Schema:* A theoretical posit $E$ in $T_{old}$ refers if and only if:
  1.  $E$ was assigned a specific causal role $C$ in $T_{old}$ (e.g., "carries energy," "exerts force");
  2.  $T_{old}$ was successful in domains where $C$ was operative;
  3.  $T_{new}$ posits an entity $E'$ that fulfills role $C$ (or a refined $C^*$), even if the intrinsic nature of $E'$ differs from $E$.
  *Forced by:* The Lavoisier/Oxygen case. The name was fixed by a false property ("acid former"), but the causal role ("combustion supporter") mapped to the real entity.

  **Principle C: Limiting Ontology (LO)**
  *Schema:* A statement $S$ in $T_{old}$ is approximately true if and only if:
  1.  $S$ contains terms denoting physical quantities $Q$;
  2.  There exists a mapping $f$ from quantities $Q_{new}$ in $T_{new}$ to $Q$ such that $Q = \lim_{\phi \to 0} Q_{new}$;
  3.  The error term is bounded by the parameter $\phi$.
  *Forced by:* The Newton case. Newtonian mass and momentum are limits of relativistic mass-momentum. Absolute space is not.

  ---

  ### 2. Verdicts on Your Ten Cases

  I apply the three principles to your verdicts. A "Mismatch" indicates the principle contradicts your intuition.

  | Case | Your Verdict | SNC (Structure+Novelty) | CRM (Causal Role) | LO (Limiting Ontology) | Notes on Mismatches |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Phlogiston** | False / No Ref | **False** (No novel math preserved) | **No Ref** (Role reversed: release vs uptake) | **N/A** | All agree. Phlogiston fails CRM because the causal direction was inverted. |
  | **2. Caloric** | Math True / Fluid False | **True** (Fourier/Carnot math preserved) | **Mixed** (Heat flow role survives, fluid nature does not) | **True** (Heat energy is limit of caloric flow) | CRM struggles to separate the fluid from the flow. |
  | **3. Fresnel** | Math True / Ether False | **True** (Wave eq. + Poisson Spot) | **No Ref** (Ether role: mechanical medium. None in GR/QM) | **False** (Ether has no limit in Maxwell/GR) | **Mismatch:** SNC vindicates the math, CRM/LO kill the ether. Matches your split. |
  | **4. Lorentz** | Math True / Ont. False | **True** (Transforms preserved) | **No Ref** (Ether role vanished) | **True** (Transforms are exact in SR) | **Mismatch:** You deny approx. truth here but grant it to Newton. LO says Lorentz is *more* true than Newton. |
  | **5. Ptolemy** | False / Math Instrumental | **False** (Epicycles not structurally preserved as *mechanism*, only as fit) | **No Ref** (Crystals/spheres had no causal role) | **False** (No limiting relation to Kepler/GR) | SNC saves the Fourier math, but rejects the *explanation*. Matches your verdict if "Structure" implies physical mechanism. |
  | **6. Newton** | Approx. True | **True** (Predictions hold at low v) | **Mixed** (Force role mapped to curvature?) | **True** (Mass/Momentum are limits) | **Mismatch:** You call this "Approx. True" but deny it to Lorentz. LO shows this is inconsistent. |
  | **7. Lavoisier** | Refers / Property False | **N/A** (Chemical classification) | **True** (Combustion role fixed reference) | **N/A** | CRM explains why reference survives false description. |
  | **8. Mendel** | Approx. True | **True** (Segregation ratios preserved) | **True** (Factors = Genes causal role) | **True** (Classical genetics is limit of Molecular) | All agree. |
  | **9. Boltzmann** | True | **True** (Statistical mech preserved) | **True** (Atoms cause pressure/temp) | **True** (Classical stat mech is limit of Quantum) | All agree. |
  | **10. Bohr** | Flip-Flop | **True** (Energy levels preserved) | **Mixed** (Orbits false, Levels real) | **True** (Bohr model is semi-classical limit) | SNC/LO suggest "Approx. True" regarding spectrum, False regarding orbits. |

  **Critical Confusion Identified:**
  Your verdicts on **Newton (6)** and **Lorentz (4)** are mutually inconsistent under any formal principle.
  *   **The Confusion:** You grant "approximate truth" to Newtonian gravity (action at a distance) but deny it to Lorentzian ether (stationary medium), despite the fact that Lorentz's *mathematics* are exactly preserved in Special Relativity, whereas Newton's *gravity* is fundamentally replaced by curvature.
  *   **The Correction:** Lorentz's theory is *more* structurally continuous with modern physics than Newton's. The "Ether" label biases you. If you accept Newton as approximately true, you must accept Lorentz as approximately true *in its mathematical core*. If you reject Lorentz's ontology, you must reject Newton's "Force" as merely instrumental. You cannot have both.

  **Critical Confusion Identified:**
  Your verdicts on **Fresnel (3)** and **Ptolemy (5)** rely on a hidden distinction between *predictive structure* and *kinematic structure*.
  *   **The Confusion:** You say Fresnel's math survives but Ptolemy's is just "truncated Fourier." But mathematically, they are similar (series expansions).
  *   **The Correction:** The difference is **Novelty**. Fresnel predicted the Poisson spot (a specific, risky distribution of intensity). Ptolemy fitted known retrograde loops. SNC captures this: Fresnel's structure was tested against *new* phenomena; Ptolemy's was tuned to *old* data.

