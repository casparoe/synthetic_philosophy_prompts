  ### 4. Forward-Looking Test: Dark Matter and Inflation

  Can a realist commit to these now?

  **Posit 1: Dark Matter Particle (WIMP/Axion)**
  *   *Application of CRM:* Is the particle indispensable for the prediction? Currently, Dark Matter is indispensable for explaining galactic rotation curves and CMB anisotropies *within the framework of General Relativity*.
  *   *Verdict:* **Cautious Realism.** You can be realist about the *phenomenon* (missing mass/gravitational effect) but agnostic about the *ontology* (particle vs. modified gravity).
  *   *Condition for "Wrong":* If MOND (Modified Newtonian Dynamics) or a relativistic extension explains the data without a new particle, the "Dark Matter Particle" posit fails CRM (like the Ether). The *mass discrepancy* refers; the *particle* might not.

  **Posit 2: Inflaton Field**
  *   *Application of SNC:* Inflation predicts a specific spectrum of primordial fluctuations. This structure is observed in the CMB.
  *   *Verdict:* **Structural Realism only.** The *scalar field mechanism* is likely a placeholder.
  *   *Condition for "Wrong":* If the expansion is driven by a geometric feature of quantum gravity or a multiverse selection effect rather than a dynamic field, the "Inflaton" fails LO (no limiting relation).
  *   *Advice:* Commit to the *expansion history* and the *fluctuation structure*. Do not commit to the *field ontology* yet. This avoids the Caloric trap (committing to the fluid rather than the heat flow).

