  ### 5. The Hindsight Worry

  *Worry:* "My splits look as though they are drawn with hindsight... If that is what I am doing, the principle cannot be applied by a working scientist... and it cannot explain why the preserved part was successful when it was."

  **Direct Answer:**
  The principle is for the *philosopher's reconstruction*, not the *scientist's heuristic*. However, this does not destroy the explanation of success.

  1.  **Distinction:** Distinguish between the *Criterion of Acceptance* (what scientists use to believe a theory) and the *Criterion of Truth* (what philosophers use to judge it). Scientists in 1890 used "Novel Prediction" (SNC) as their criterion. We use "Limiting Relation" (LO) as ours.
  2.  **Why Success is Explained:** The theory succeeded *then* because it captured the Structure (SNC) that *we now know* corresponds to the Limit (LO). The scientist didn't need to know it was a limit; they only needed to know it yielded novel predictions.
  3.  **Forward Application:** A scientist *can* use SNC prospectively. They can ask: "Does this posit generate a novel risk, or is it tuning parameters to fit old data?" Fresnel did the former; Ptolemy did the latter.
  4.  **Cost:** You must admit that you cannot know *which* part is true with certainty until the successor theory arrives. Realism is a fallible stance, not a guarantee. The "hindsight" is not a bug; it is the evidence base. We judge the rationality of past belief by its outcome, just as we judge current belief by its future outcomes.

