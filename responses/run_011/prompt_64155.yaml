  ### 6. Recommendation

  You asked which verdict is cheapest to give up to obtain a simple principle, and whether the complexity of saving all ten is principled or prejudiced.

  **The Recommendation:**
  Adopt **Principle A (Structural-Novelty Correspondence)** combined with **Principle C (Limiting Ontology)**.
  To make this work, you must **abandon your verdict on Case 6 (Newton)** or **Case 4 (Lorentz)**. They cannot both stand as you have them.

  **Which to Drop?**
  Drop the intuition that **Newton is "approximately true" while Lorentz is not.**
  *   **Why:** This is the weakest link. It relies on the word "Force" feeling more real than "Ether," despite "Force" (action at a distance) being just as occult as "Ether" (medium for waves). Mathematically, Lorentz is closer to modern physics than Newton is.
  *   **What You Lose:** You lose the comfort of calling classical mechanics "true." You must call it "structurally valid within a limit." This is a minor semantic shift for a major gain in consistency.
  *   **What You Gain:** You resolve the Fresnel/Ptolemy tension (Novelty matters) and the Boltzmann/Ether tension (Causal role mapping matters).

  **Is Your Current Complexity Principled?**
  No. Your current list of verdicts is **prejudice written as exceptions.**
  *   You treat "Matter" (Atoms) as real but "Medium" (Ether) as false, despite both being unobservable posits.
  *   You treat "Force" (Newton) as real but "Field" (Lorentz) as instrumental, despite Fields being more fundamental in modern physics.
  *   You treat "Oxygen" as referring despite false properties, but "Phlogiston" as non-referring, which requires a causal theory of reference you haven't explicitly applied to the other cases.

  **Final Advice:**
  Embrace **Selective Structural Realism**.
  1.  Believe the **mathematics** that yields **novel predictions** (Fresnel, Bohr spectra).
  2.  Believe the **entities** that play **indispensable causal roles** preserved in the successor theory (Boltzmann's atoms, Mendel's factors).
  3.  Treat **mechanisms** as provisional models (Caloric, Miasma, Inflaton).
  4.  Accept that **Reference** is fixed by causal interaction, not by description (Lavoisier's Oxygen).

  If you do this, you keep 9 of your 10 verdicts (correcting only the Newton/Lorentz bias) and you have a principle that works prospectively (look for novelty and causal indispensability) and retrospectively (look for structural limits).
