  ### 3. Verdicts on Three New Cases

  **Case 11: Humoral Theory (Medicine, 2nd Century – 18th Century)**
  *   *Theory:* Health is balance of four fluids (blood, phlegm, black bile, yellow bile).
  *   *Success:* Guided treatment (bleeding, purging) that occasionally worked (e.g., reducing blood volume helps hemochromatosis or hypertension).
  *   *Verdict:* **False.**
  *   *Application:*
      *   **SNC:** No mathematical structure preserved.
      *   **CRM:** The causal roles (fluids cause temperament) do not map to hormones or neurotransmitters cleanly.
      *   **LO:** No limiting relation.
      *   *Result:* Unlike Caloric, nothing survives but the general idea of "balance" (homeostasis), which is too vague to count as theoretical preservation.

  **Case 12: Wegener's Continental Drift (Geology, 1912)**
  *   *Theory:* Continents plow through oceanic crust driven by tidal/centrifugal forces.
  *   *Success:* Explained fit of continents, fossil distribution.
  *   *Verdict:* **Ontologically True (Continents move), Mechanistically False.**
  *   *Application:*
      *   **SNC:** The kinematic description (relative motion) is preserved in Plate Tectonics.
      *   **CRM:** The "driving force" posit failed (tidal force insufficient). The "continent" posit succeeded (lithospheric plates).
      *   **LO:** The "drift" is the limit of plate velocity.
      *   *Result:* Matches Lavoisier. Reference succeeds despite false mechanism.

  **Case 13: Miasma Theory (Epidemiology, 19th Century)**
  *   *Theory:* Diseases like cholera are caused by "bad air" (miasma) from rotting matter.
  *   *Success:* Sanitation (removing rot) reduced disease.
  *   *Verdict:* **Regularity True, Mechanism False.**
  *   *Application:*
      *   **SNC:** No structural math.
      *   **CRM:** The causal link (rot $\to$ disease) is real, but the mediator (air) is wrong (water/flies/germs).
      *   **LO:** No limit.
      *   *Result:* Matches Caloric. The *phenomenological law* (sanitize to cure) survives; the *ontology* (miasma) does not. This is the "false mechanism/stable regularity" case you requested.

