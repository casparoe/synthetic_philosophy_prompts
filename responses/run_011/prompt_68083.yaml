answer: |-
  The chain does not hold. It looks compelling because it smuggles a strict-liability standard into a definition of crime, then exploits the absurdity of that standard to force a retreat to bodily harm. The break occurs at step (3).

  **The Diagnosis**
  Step (3) asserts: "Whatever reliably stops that transmission destroys the people, no matter what means it uses and no matter whether anyone aimed at that destruction..."
  This premise conflates *ontological destruction* (the group ceases to exist culturally) with *criminal genocide* (a punishable act requiring *mens rea*). Lemkin never argued for strict liability; he defined genocide as a "coordinated plan". The Convention requires "intent to destroy". By removing intent at (3), the argument creates a straw man of cultural genocide that labels natural entropy and administrative routine as crimes. When step (6) points out this overbreadth, it is correctly identifying the flaw introduced at (3), but step (10) wrongly concludes that *intent* must be paired exclusively with *bodily harm*. You can retain intent without requiring bodily harm.

  The equivocation is on "destruction". In (2), it means "cultural discontinuity" (a descriptive state). In (5), it means "commission of genocide" (a normative judgement). The shift happens at (3), which treats the descriptive outcome as sufficient for the normative label without requiring the agent's purpose to align with the outcome.

  **The Three Cases**
  Using a revised view (cultural harm + intent to destroy the group *as such*), here is how the diagnosis delivers your desired verdicts:

  *   **(a) Language ban only:** Not genocide. While it harms cultural transmission (satisfying 2), without evidence of a plan to destroy the group *as such* (rejecting 3's removal of intent), it remains assimilation or administrative unity. It lacks the specific *dolus specialis* required to elevate cultural harm to genocide.
  *   **(b) Residential schools (no killing):** Genocide. This satisfies the cultural destruction condition (2) and, historically, involves clear intent to "kill the Indian in the child" (rejecting 3's claim that intent is irrelevant). It fits the Convention's child-transfer clause and Lemkin's broader view of attacking institutions.
  *   **(c) Organic urbanization:** Not genocide. Language shift occurs, but there is no agent committing a crime, nor any intent to destroy the group (rejecting 3's "no matter whether anyone aimed"). It is tragic cultural loss, not criminal genocide.

  **Pricing the Alternatives**
  *   **The Convention/Intentionalist Reading:** This escapes the argument by accepting (10).
      *   *Cost:* It sacrifices Lemkin's core insight that a group can be destroyed without mass murder. It renders the child-transfer clause anomalous rather than principled. It fails to capture the wrong of cultural erasure unless tied to bodily harm or specific child removal.
  *   **The Lemkin-Inspired Cultural Revision:** This escapes the argument by rejecting (3) but keeping (1) and (2). It defines genocide as intentional cultural destruction.
      *   *Cost:* It makes prosecution harder. Proving intent to destroy a culture is more complex than counting bodies. It risks political friction where state-building policies are scrutinised for genocidal intent. However, it preserves the moral distinction between accident and crime.
  *   **The Unintentional Group Harm View (Strict Liability):** This accepts (3) and (5) fully.
      *   *Cost:* It accepts the absurdity of (8). Every state curriculum becomes genocidal. The term loses all discriminating power. It insults victims of extermination campaigns by equating them with victims of modernisation. This is the bullet you rightly refuse to bite.

  **The Child-Transfer Clause**
  This clause is the linchpin that rescues Lemkin without accepting the argument's absurdity. It acknowledges that destroying a group's continuity (cultural) is genocide, but it specifies a *means* (forcible transfer) and implies an *intent* (to assimilate/destroy). It validates premise (2) (reproduction is key) but rejects premise (3)'s claim that means and intent do not matter. The Convention is not half-committed to strict liability; it is half-committed to cultural protection *via* intentional acts. This supports rejecting (3) while keeping (5) for cases like residential schools.

  Verdict: reject step (3) — cost: requires proving specific intent
