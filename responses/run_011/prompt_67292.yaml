answer: |-
  Here is the session plan structured around your five requirements.

  ### 1. The Dependency Order
  You cannot ask "does cognition penetrate experience?" until the audience accepts that "experience" and "judgment" are separable categories. If they believe seeing *is* judging, the question is nonsense. However, if you introduce this distinction too abstractly (e.g., "Philosophers distinguish qualia from doxastic states..."), you lose them before you begin.

  **The Sequence:**
  1.  **Validate the Detective:** Start by conceding the previous speaker's point. Eyewitnesses *are* unreliable. This builds trust.
  2.  **The Camera Fallacy:** Briefly establish the naive view they hold: that the eye is a camera and the brain is a storage drive.
  3.  **The Disruption (The Hook):** Show a standard low-level illusion (e.g., the checker shadow illusion). Ask: "Did the squares change color, or did your *measurement* of them change?" Most will say "measurement."
  4.  **The Pivot (The Crucial Move):** *Here* is where you introduce the Experience vs. Report distinction. Use the illusion to demonstrate that their *experience* (it looked different) remained constant even when their *judgment* (they know it's the same) changed.
      *   *Risk of doing this too early:* If you do this before the illusion, it's abstract philosophy. If you do it after the main case, they will have already conflated the two during the evidence. It must happen here, as the bridge between "eyes are imperfect" and "mind alters eyes."
  5.  **The Mechanism:** Define "Top-Down" simply as "knowledge coming to the aid of sensation."
  6.  **The Test:** Present the One Case.

  **What collapses if you make the move too early:**
  If you distinguish experience from report before showing them a perceptual failure, you sound like you are arguing for skepticism ("You can't trust your senses"). They will tune out, thinking this is just a rehash of the detective's talk. You need the perceptual failure to motivate the distinction.

  ### 2. The One Case
  **Build on:** The **Bruner & Postman Anomalous Cards** (e.g., the red spade).

  **Why:**
  *   **Luminance patches** are too low-level. They prove context matters, but not that *meaning* or *belief* matters. A retiree will dismiss this as "eye tricks," not "mind tricks."
  *   **Size/Steepness (Proffitt/Creem):** You know this best, but it is mired in the replication crisis and conflates perception with *affordance* (ability to act). It invites the counter-argument: "The hill didn't look steeper, I just felt more tired." That drags you into motor-control debates you don't have time for.
  *   **The Cards:** This isolates semantic expectation (Spades are black) clashing with sensory data (The patch is red). It is binary, dramatic, and directly addresses "belief getting inside experience."

  **What the case must have:**
  *   **Latency:** You must emphasize the *time* it took subjects to identify the card. The delay is where the brain is fighting.
  *   **Confession:** You need the subject's report of the *transition* ("At first it looked grey, then it looked red").
  *   **Isolation:** The lighting must be controlled so they can't blame shadows.

  **What the case must lack:**
  *   **Ambiguity:** Do not use a card that looks like it *could* be red. It must be clearly red, but categorically impossible.
  *   **Memory Delay:** The report must be immediate. If there is a gap, the Detective's argument (memory error) takes over.

  **What you lose by dropping the others:**
  *   **Dropping Luminance:** You lose the easy warm-up that proves vision isn't a camera. *Mitigation:* Use a single slide of a standard illusion as the warm-up, then discard it.
  *   **Dropping Size/Steepness:** You lose the emotional/desire component (we see what we *want*). *Mitigation:* Mention this in passing as the "modern version" of the card experiment that is currently being debated, leveraging your expertise without anchoring the talk to it.

  ### 3. Misconceptions and Timing
  You have two buckets of misconceptions: those they bring with them (from the Detective and life) and those your example creates.

  *   **"Eyewitnesses can't be trusted" (Audience-borne):**
      *   *When:* **Minute 1-3.**
      *   *How:* Validate it immediately. "The Detective was right about memory. I am asking about the moment before memory kicks in."
  *   **"Top-down is just Penetration" (Audience-borne):**
      *   *When:* **Minute 10 (before the Cards).**
      *   *How:* Define "Top-Down" as a broad bucket. Explain that most top-down influence is *attention* (looking somewhere), not *penetration* (changing the look).
  *   **"Attention counts as a counterexample" (Audience-borne):**
      *   *When:* **Minute 15 (during the Cards).**
      *   *How:* Pre-empt this. "You might think they just weren't looking hard enough. But the exposure time was controlled. They were looking right at it."
  *   **"Ordinary illusions / The Dress settle the matter" (Audience-borne):**
      *   *When:* **Minute 20 (after the Cards).**
      *   *How:* Distinguish *assumption* from *penetration*. "The Dress" is about assuming lighting conditions (unconscious inference). The Cards are about semantic categories. One is calibration; the other is alteration.
  *   **"If penetration is real, no eyewitness can be trusted" (Example-borne):**
      *   *When:* **Minute 30 (Conclusion).**
      *   *How:* Reassure them. Even if penetration exists, it requires specific, high-conflict conditions. It doesn't mean reality is optional.

  ### 4. The Closing Question
  Do not ask them to define the terms. Ask them to apply the distinction to a new scenario. This tests if they can separate the *phenomenology* from the *conclusion*.

  **The Question:**
  > "Imagine you are waiting for a friend at a train station. You are expecting them to wear a bright yellow coat. You see a figure in the distance wearing a coat that is actually a dull beige, but in the shadow, it looks yellowish. You walk toward them, convinced it is your friend. When you arrive, it is a stranger.
  >
  > **I want you to decide:** In that moment before you arrived, did the beige coat *visually look* yellow to your eyes? Or did it look beige, and you simply *assumed* it was yellow because you wanted it to be your friend?"

  **Why this works:**
  *   If they say "It looked yellow," they are siding with Penetration (belief altered the color experience).
  *   If they say "It looked beige, I just guessed," they are siding with the Judgment/Report view.
  *   If they say "It depends on the lighting," they are sidestepping into the "Illusion" bucket.
  *   *The Tell:* Watch how they justify it. If they talk about how it *felt* to see it, they get the distinction. If they talk about how they *decided* it was the friend, they don't.

  ### 5. Explicit Refusals
  You must explicitly refuse to cover **Signal Detection Theory (SDT) and Response Bias controls.**

  **Why:**
  This is the apparatus scientists use to distinguish "I saw it" from "I guessed it." It involves math, hit-rates, and false-alarms. Explaining it will consume 15 minutes and bore the undergraduates while confusing the retirees.

  **What to say to the room:**
  > "In the lab, we spend months designing tasks to prove a person isn't just guessing or trying to please the experimenter. We use mathematical models to separate 'sensitivity' from 'bias.' I am not going to walk you through that math today. Not because it doesn't matter—it matters immensely—but because my goal today is not to prove the result to you. My goal is to make sure you understand the *question* well enough to know why the math is necessary. If you leave here thinking 'seeing' and 'guessing' are the same thing, the math won't help you. If you leave knowing they are different, you've done the hard part."

  This frames the omission as a pedagogical choice to prioritize conceptual clarity over methodological rigor, which respects their intelligence without drowning them in jargon.
