prompt: |-
  I cover science and ideas for a general-interest magazine, and a public ideas festival has booked me for thirty-five minutes with slides in front of roughly a hundred non-specialists — mostly retirees, some undergraduates, no background in philosophy or vision science. The listing they published promises the big claim: Why You Never See What's There. What I actually want to teach is the narrower, live question underneath it — whether what we believe, expect, or want can get inside perceptual experience itself, as distinct from steering attention, changing what we say we saw, or changing what we later remember. My session runs immediately after a retired detective's talk on eyewitness error, so a good part of the room will arrive already convinced that seeing is unreliable, and will take that conviction to be the same thesis I'm about to present.

  Plan the session for me; don't script it and don't argue the debate at me. I need five things.

  First, the dependency order: what has to be in place before the question is even intelligible to this audience. I assume that includes getting them to separate what someone experiences from what they report about the experience, and I want to know where that move belongs and what collapses if I make it too early.

  Second, the one case to carry everything. My shortlist is an image in which two patches printed at exactly the same luminance look like different shades; the mid-century card experiments in which people shown a spade printed in red named an ordinary black spade, or a heart; and the value-laden size-and-steepness research from my own beat, which I covered at the time and which has since been picked apart. Tell me which one to build on, what that case must have and must lack to do the work, and what I lose by dropping the other two.

  Third, the misconceptions and exactly where in the sequence to head each off — mine so far: that "top-down" is just another name for penetration; that attention counts as a counterexample; that ordinary size and brightness illusions settle the matter; that the dress which split the internet settles it; and that if penetration is real, no eyewitness can be trusted. Flag which of these arrive with the audience and which my own example will manufacture.

  Fourth, one question to put to the room near the end whose answers would show me they have the experience-versus-judgment distinction rather than just the pictures.

  Fifth, what I should explicitly refuse to cover at this level — I expect the apparatus for ruling out response bias and demand characteristics — and what to say to the room about having cut it.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas Writer (general-interest magazine).
      *   **Context:** Public ideas festival, 35 minutes, slides, ~100 non-specialists (retirees, undergrads, no philosophy/vision science background).
      *   **Topic:** "Why You Never See What's There" (marketing title) vs. "Cognitive Penetration of Perception" (actual thesis: do belief/expectation/desire alter *experience* itself, not just attention/report/memory).
      *   **Constraint:** Session follows a retired detective on eyewitness error. Audience already thinks "seeing is unreliable." Need to distinguish *unreliability* from *penetration*.
      *   **Deliverables:**
          1.  Dependency Order (Conceptual scaffolding).
          2.  The One Case (Choosing between luminance, Bruner/Postman cards, or value-laden size/steepness).
          3.  Misconceptions & Timing (When to head off specific errors).
          4.  The Closing Question (Testing understanding of experience vs. judgment).
          5.  Explicit Refusals (What methodological details to omit and how to justify it).
      *   **Tone:** Professional, strategic, pedagogical, not scripted, not argumentative.

  2.  **Deconstruct the Challenge:**
      *   *The Trap:* The audience thinks "seeing is unreliable" (Detective's talk) = " perception is theory-laden/penetrated." The speaker needs to show these are different. Unreliability can be due to memory, attention, or reporting. Penetration is about the *phenomenology* itself.
      *   *The Audience:* Mixed age/education. Need concrete examples, minimal jargon. 35 minutes is short (approx. 25 mins talk, 10 mins Q&A or interaction).
      *   *The Goal:* Teach the *question*, not necessarily solve it. Make the distinction intelligible.

  3.  **Drafting - Section by Section:**

      *   **1. Dependency Order:**
          *   What must come first? If I say "beliefs change seeing," they'll think "attention." I need to separate *looking* from *seeing*.
          *   Actually, the biggest hurdle is the Detective's shadow. They think "eyewitnesses lie/forget." I need to establish "Experience" vs. "Report."
          *   *Sequence:*
              1.  Establish the "Common Sense" view (Eye as camera).
              2.  Disrupt it gently (Illusions exist).
              3.  *Crucial Move:* Distinguish Experience (what it's like) from Judgment/Report (what you say). If I do this too early, it feels like philosophical hair-splitting. If I do it too late, they conflate memory with perception.
              4.  Introduce the specific mechanism (Top-down).
              5.  Isolate the variable (Attention vs. Penetration).
          *   *Risk of early move:* If I start with "Don't trust your report," they tune out because the Detective just told them that. I need to validate the Detective first, then pivot.

      *   **2. The One Case:**
          *   *Option A: Luminance patches (Simultaneous Contrast).* Good for showing context matters, but doesn't prove *cognitive* penetration (belief/desire). It's low-level vision.
          *   *Option B: Bruner/Postman (Anomalous Cards).* Red spade looks black. Classic. High drama. But often attributed to confusion or memory. Hard to isolate experience.
          *   *Option C: Value-laden Size/Steepness (Proffitt/Creem).* Hills look steeper if tired; coins look bigger if poor. Directly addresses "want/need." *However*, the prompt says the writer covered this and it was "picked apart." Using a debunked/controversial case might undermine credibility if not handled carefully.
          *   *Selection:* **Bruner/Postman (Anomalous Cards)** is the strongest pedagogical tool for *this specific distinction*. Why? Because it involves semantic categories (Spade/Heart) clashing with sensory data (Red/Black). It forces the brain to resolve a conflict. It's easier to demonstrate "I saw a black spade" vs "I saw a red spade" than "that hill looks steeper."
          *   *Wait, re-reading the prompt:* The writer *covered* the size/steepness research. They know the controversy. Using the Cards is safer for a general audience because it's historical and illustrative of the *concept*, whereas the hill/coin stuff is mired in replication crises which might bog down a 35-min talk.
          *   *Actually, looking closer:* The prompt asks what I lose by dropping the others.
          *   *Decision:* The **Anomalous Cards** are the best fit for "belief/expectation" entering experience. Luminance is too low-level (not cognitive). Size/Steepness is too controversial/motor-affordance based.
          *   *Requirements for the case:* Must show a conflict between knowledge and sensation. Must allow for a delay in recognition (the "micro-genesis").
          *   *Loss:* Dropping luminance means losing the "basic vision isn't a camera" hook. Dropping size/steepness means losing the "desire/motivation" angle. I can mention them as footnotes.

      *   **3. Misconceptions & Timing:**
          *   *Audience-borne:* "Eyewitnesses can't be trusted" (from Detective). "Top-down = Penetration." "Illusions = Penetration."
          *   *Example-borne:* "The Dress" (lighting assumption vs. penetration). Attention (looking vs. seeing).
          *   *Timing:*
              *   Address the Detective immediately (validate, then distinguish).
              *   Address Attention early (before the main case).
              *   Address "The Dress" and Illusions during the case comparison.
              *   Address Eyewitness Trust at the end (nuance).

      *   **4. The Closing Question:**
          *   Needs to test Experience vs. Judgment.
          *   Scenario: You see a blurry shape. You think it's a dog. It turns out to be a cat.
          *   Question: "In the moment before you knew it was a cat, did the shape *look* like a dog, or did you just *guess* it was a dog?"
          *   Better: A scenario involving desire. "You are thirsty. You see a glass. Does the water *look* clearer, or do you just *hope* it is?"
          *   Best: Tie back to the Cards. "When the subject said 'Black Spade' about the Red Spade, did the red *look* black, or did they just say 'Black Spade' because they knew spades are black?"

      *   **5. Explicit Refusals:**
          *   Methodology: Signal Detection Theory, forced-choice tasks, controlling for response bias.
          *   Justification: "We are exploring the *question*, not the lab protocol. The protocol exists to answer the question, but explaining the protocol would bury the question."

  4.  **Refining and Polishing:**
      *   *Tone Check:* Am I scripting? No. Am I arguing the debate? No. I am planning the pedagogy.
      *   *Dependency Order:* Make sure the "Experience vs. Report" distinction is placed strategically. If I do it too early, it's abstract. If I do it *during* the Card example, it's concrete. Let's place it *just before* the Card example.
      *   *The Detective:* This is critical. I need to honor the previous speaker while carving out new territory. "The Detective told you memory lies. I'm asking if the eye lies."
      *   *The Case:* I need to be firm on the Cards. The size/steepness stuff is too messy for a "teach the question" talk. The luminance stuff is too physiological. The Cards are psychological.
      *   *Misconceptions:* "Top-down" is a buzzword. Need to define it simply. "Attention" is the biggest rival hypothesis.
      *   *Closing Question:* Needs to be binary but revealing.
      *   *Refusals:* Be honest about the "boring stuff" that ensures rigor.

  5.  **Final Review against Constraints:**
      *   35 mins? Yes, the plan fits.
      *   Non-specialists? Yes, language is accessible.
      *   Five specific things delivered? Yes.
      *   No scripting? Yes, outlining structure.
      *   No arguing the debate? Yes, focusing on intelligibility.

  6.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Dependency:* I initially thought about putting Experience vs. Report early. But the prompt warns: "what collapses if I make it too early." If I make it too early, it sounds like skepticism. I need to ground it in a concrete failure first. So, show an illusion, *then* ask "what happened there?" to introduce the distinction.
      *   *Correction on Case:* The prompt mentions the writer covered the size/steepness research. They might feel ownership of it. But they also acknowledge it was "picked apart." I should advise using the Cards for clarity, but acknowledge the Size/Steepness as the "modern version" that got messy. Actually, the Cards are safer for the *distinction*. I will recommend the Cards.
      *   *Correction on Misconceptions:* The "Detective" misconception is the biggest one. It needs to be addressed in the first 5 minutes.

  7.  **Final Polish:** Ensure the distinction between "seeing" and "judging" is the through-line. Ensure the "refusals" section is diplomatic. (Proceed to generate output).

  *(Self-Correction on the "One Case"):* Wait, the prompt says "The value-laden size-and-steepness research from my own beat, which I covered at the time and which has since been picked apart." If I tell them to drop their own beat, they might resist. However, for *this specific pedagogical goal* (Experience vs Judgment), the Card task is cleaner. The hill task conflates perception with action/affordance. I will recommend the Cards but suggest referencing the hill research as the "modern descendant" to honor their expertise without bogging down in the controversy.

  *(Refining the Closing Question):* It needs to be something they can answer by show of hands or quiet reflection. "Did the red look black, or did you just call it black?" is the core.

  *(Refining the Refusals):* Don't just say "methodology." Say "Signal Detection Theory" specifically, as that's the tool for bias.

