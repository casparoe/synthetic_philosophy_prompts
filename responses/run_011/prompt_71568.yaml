answer: |-
  **ESR-1001: Quantification, Verification and Retirement of Avoided Invertebrate Disvalue Units, Version 3.2**
  **Expected Suffering Registry (ESR) | Technical Working Group on Moral Uncertainty**
  **Effective Date: 01 January 2024**

  **1. Scope and Applicability**
  1.1 This methodology applies to projects demonstrating avoided disvalue to terrestrial arthropods resulting from land-use conservation or pesticide abstention.
  1.2 Projects must quantify Avoided Invertebrate Disvalue Units (IDUs), where 1 IDU equals one unit of standardized suffering averted over a one-year vintage.

  **2. Baseline Scenario**
  2.1 The baseline shall represent the projected mortality and welfare deprivation occurring under conventional agricultural intensification.
  2.2 In the absence of project-specific mortality data, Project Proponents shall utilize the Global Arthropod Density Model (GADM-v4) to extrapolate population counts from sample plots to the total project area.

  **3. Quantification Methodology**
  3.1 Total IDUs issued ($I_{total}$) are calculated as:
  $$I_{total} = (N \times W \times C \times L) - B$$
  Where:
  *   $N$ = Estimated number of individuals affected (extrapolated).
  *   $W$ = Welfare Weighting Coefficient (severity of avoided harm).
  *   $C$ = Credence Factor (probability of moral status).
  *   $L$ = Leakage Deduction (displacement of harm to adjacent areas).
  *   $B$ = Buffer Pool Contribution (non-permanence risk).

  **4. Epistemic Discount and Moral Status**
  4.1 To account for uncertainty regarding phenomenal consciousness, a Credence Factor ($C$) must be applied.
  4.2 $C$ shall not exceed 0.05 unless peer-reviewed neuroanatomical evidence is submitted.
  4.3 Proponents acknowledge that variations in $N$ (population magnitude) exert exponential influence on $I_{total}$ relative to variations in $C$ or $W$. Sensitivity analysis is not required where $N > 10^9$.

  **5. Leakage and Displacement**
  5.1 Projects must deduct 20% of issued units to account for predatory displacement. If protected insects are not consumed here, they may be consumed elsewhere, transferring disvalue.
  5.2 Background population dynamics are assumed to remain constant; projects need not account for reproductive rebound exceeding carrying capacity.

  **6. Reversal Risk and Buffer Pool**
  6.1 Given the natural lifespan of invertebrates, all avoided suffering is subject to non-permanence risk.
  6.2 Projects must contribute 40% of issued IDUs to the ESR Buffer Pool to insure against premature natural mortality.
  6.3 Buffer contributions are held in perpetuity and may not be retired.

  **7. Monitoring and Verification**
  7.1 Population counts ($N$) shall be verified via visual transect sampling of no less than 0.0001% of the project area.
  7.2 Verification Bodies shall accept extrapolated totals as factual provided the sampling protocol follows ISO-14064-3 guidelines adapted for biomass.

  **8. Worked Numerical Example**
  8.1 A 100-hectare conservation project estimates a density of 150,000 individuals per square meter.
  8.2 Total Area = $1,000,000 m^2$. Total Population ($N$) = $1.5 \times 10^{11}$.
  8.3 Welfare Weight ($W$) = 0.002 (standardized units).
  8.4 Credence Factor ($C$) = 0.004 (conservative threshold).
  8.5 Leakage ($L$) = 0.80 (20% deduction).
  8.6 Calculation:
  $$1.5 \times 10^{11} \times 2 \times 10^{-3} \times 4 \times 10^{-3} \times 0.80$$
  $$= (1.5 \times 2 \times 4 \times 0.8) \times (10^{11} \times 10^{-3} \times 10^{-3})$$
  $$= 9.6 \times 10^5$$
  $$= 960,000 \text{ IDUs (pre-buffer)}$$
  8.7 Buffer Contribution (40%) = 384,000 IDUs.
  8.8 Net Issuance = 576,000 IDUs.
  8.9 Note: A 10% error in density estimation alters issuance by 57,600 IDUs. A 10% error in Credence alters issuance by 5,760 IDUs.

  **9. Excluded Activities**
  9.1 Active culling, habitat destruction, or interventions increasing net population density without welfare guarantees are ineligible.
  9.2 Projects claiming negative emissions via speculative future technologies are excluded.

  **10. Retirement and Claiming**
  10.1 IDUs may be retired against verified anthropogenic carbon equivalents at a ratio of 1:1.
  10.2 Due to the magnitude of potential issuance under Section 3.1, Project Proponents are eligible to retire units against total institutional historical emissions upon initial validation, provided the Buffer Pool contribution is secured.
  10.3 Claims of "Net Zero" status are permitted immediately upon issuance, subject to the ongoing validity of the Credence Factor.
