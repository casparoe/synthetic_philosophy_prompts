      *   *Claim 3: "Evidence... falling body... billiard player..."* -> Accurate examples.
      *   *Claim 4: "The more significant a theory, the more unrealistic its assumptions..."* -> Accurate quote/paraphrase of Friedman.
      *   *Claim 5: "...objection... pointing out how far a model's assumptions are from the facts just misses the point."* -> Defensible interpretation of Friedman.
      *   *Claim 6: "Assumptions are instruments... confirmed by the same thing that confirms the theory: its track record."* -> **Problematic.** Friedman says assumptions aren't tested directly; the *theory* is tested by predictions. Saying assumptions get *confirmed* by predictive success is a stretch even for instrumentalism.
      *   *Claim 7: "Arguing about whether firms really set marginal cost equal to marginal revenue isn't science at all."* -> Defensible interpretation of Friedman's stance on descriptive realism.

  3.  **Address Specific Issues:**
      *   *Significance/Unrealism Line:* Friedman argues significant theories have *highly simplified* (often unrealistic) assumptions to isolate key forces. He does *not* license ignoring assumptions altogether if they hinder prediction. The student uses it to stop litigating truth entirely. This is a slight overreach but mostly consistent with Friedman's instrumentalism. However, Friedman cares about *predictive* accuracy, not just ignoring assumptions for their own sake.
      *   *Confirmation of Assumptions:* Friedman explicitly denies assumptions are testable independent of the theory. Saying they are "confirmed by the same thing" blurs the line. For Friedman, assumptions are *not* the sort of thing that gets confirmed; they are fictions. The *theory* gets validated.
      *   *Billiards Example:* Friedman uses it to show that *behavior* can be modeled *as if* optimization occurs, even if the cognitive process doesn't. It supports predictive modeling of aggregates/outputs, not necessarily the internal mechanistic truth of agents. For ABMs, which often focus on micro-foundations/mechanisms, this is tricky. ABMs often care about the *process* generating the outcome, not just the outcome.

