  4.  **Drafting the Analysis (The Check):**
      *   **Dworkin:** Honor the directive. Why? Because the prior competent self's critical interests (dignity defined by capacity) trump the current self's critical interests (completion defined by persistence). The prior self owns the life's narrative.
