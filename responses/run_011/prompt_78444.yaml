      *   *If Obvious (It IS authentic):* Then she is the same person exercising current autonomy. Dworkin might falter (precedent autonomy vs current autonomy of same person?). Actually Dworkin prioritizes *precedent* autonomy when competence is lost.
      *   *If Obvious (It IS pathology):* Then she is not competent. Dworkin says follow directive. Dresser says follow best interest (which might be treatment).
      *   *The Feature doing the work:* The **status of the current desire**. Is it a competent critical interest or a delusion?
      *   *Dworkin's Attack:* Deny it's a critical interest. Call it a "mere urge."
      *   *Cost:* Makes "critical interest" a gatekept category only the competent can enter, circularly protecting the directive from any current dissent.

