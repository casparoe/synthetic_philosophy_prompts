          *   Identify the *single feature* doing the work.
          *   Explain what happens if that feature becomes obvious.
          *   Explain how a Dworkin defender attacks the case (denying critical interests) and the cost of that concession.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Dworkin (Integrity/Autonomy):** Past competent self binds future incompetent self. Critical interests (how life goes as a whole) trump experiential interests (how it feels now). Advance directives should be honored even if the current self seems content, because the prior self's narrative integrity matters.
      *   **Dresser (Current Interest/New Self):** The demented patient is a new person or at least has new interests. Past self cannot bind current self if current self has different interests. Focus on current well-being. Usually argues demented patients lack critical interests, only experiential. *Constraint:* I must make the patient have critical interests *now* to block the easy Dresser move.
      *   **Personal Identity (Psychological Continuity):** If psychological continuity is broken, they are different people. If different people, the directive doesn't apply. If continuity holds, it might. *Constraint:* Evidence must be balanced so this is unknowable.

  3.  **Drafting the Scenario (The Hard Part):**
      *   *Goal:* Avoid "sweet/contented." Avoid "lucid signing." Need current critical interests conflicting with directive.
      *   *Idea:* The patient isn't just "happy." She is actively pursuing a value that contradicts the directive, but in a way that looks like a coherent (though altered) value system, not just confusion.
      *   *Directive:* "No life support if I can't recognize my family." (Standard).
      *   *Current State:* She doesn't recognize them, *but* she is engaged in a project that requires life support, and she articulates why.
      *   *Refinement:* To meet the "critical interests" constraint, she needs to express a view about her life's narrative, not just "I like this pudding."
      *   *Scenario:* She is in late-stage dementia but exhibits moments of coherent valuation regarding her remaining time. Maybe she believes she is waiting for something specific that gives her life meaning, conflicting with the directive's wish to avoid "undignified prolongation."
