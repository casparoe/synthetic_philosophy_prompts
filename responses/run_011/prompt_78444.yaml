      *   *Key constraint:* "Can't tell whether change is break in continuity or genuine development."
      *   *Scenario:* Eleanor signed a directive refusing ventilation if she couldn't write. Now she is aphasic but communicates via board that she wants ventilation because "the story isn't done." Her family knows she was obsessed with completionism. Is this the same obsession (continuity) or a delusion (break)? She isn't "sweet"; she is stubborn. She values *completion* (critical interest) over *comfort* (experiential). This conflicts with the directive which prioritized *capacity* over *completion*.
