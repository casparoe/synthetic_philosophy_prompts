answer: |-
  # Session Plan: The Black Box Interpretability Game

  ## I. Preparation & Materials
  **Time to Assemble:** 90 minutes.
  **Personnel:** You (Instructor), 1 TA, 3 "Box Operators" (recruited from previous years or TAs; they must not take the seminar), 12 "Interpreter Students" (the class).

  **Physical Materials:**
  1.  **The Divider:** A large cardboard tri-fold board to hide the "Box Team" table.
  2.  **Input Deck (20 cards):**
      *   8 **Red** cards labeled 1, 3, 5, 7 (two sets of these 4).
      *   8 **Blue** cards labeled 2, 4, 6, 8 (two sets of these 4).
      *   4 **Test** cards (kept separate): Red 3, Red 5, Blue 8.
      *   *Note:* In this deck, **Red = Odd** and **Blue = Even**. This correlation is perfect and never violated during the game.
  3.  **The Hidden Layer (3 Envelopes):** Labeled **Slot 1**, **Slot 2**, **Slot 3**. Inside each: a stack of Red chips (Activation = 1) and Blue chips (Activation = 0).
  4.  **Output Bin:** A small box where the Box Team places a "YES" or "NO" token.
  5.  **Currency:** 100 Poker Chips (or paper slips) per Interpreter Team.
  6.  **Team Sheets:** 4 packets, one per Interpreter Team.
  7.  **Box Master Sheet:** A laminated lookup table for the Box Operators (see below).

  ## II. The Black Box Logic (For Box Operators Only)
  *Do not show this to students.*

  **Input:** A single card (Color + Number).
  **Hidden State Calculation:**
  *   **Slot 1:** Activates (Red Chip) if Card is **Red**. (Inactive/Blue if Blue).
      *   *Philosophical Trap:* Since Red = Odd in this deck, this is equally decodable as "Odd Number."
  *   **Slot 2:** Activates if Card is **Red 1** OR **Blue 8**.
      *   *Philosophical Trap:* Polysemy. On Red inputs, it means "Minimum". On Blue inputs, it means "Maximum".
  *   **Slot 3:** Activates if **Slot 1 Activates**. (Exact copy of Slot 1).
      *   *Philosophical Trap:* Off-path/Causally Inert.

  **Output Calculation:**
  *   **Output YES:** If Slot 1 is Active **AND** Slot 2 is Inactive. (i.e., Red cards, excluding Red 1).
  *   **Output NO:** Otherwise.
  *   *Note:* Slot 3 is **never** read for the output decision.

  **Operator Protocol:**
  1.  Receive Input Card.
  2.  Consult Master Sheet.
  3.  Place appropriate chip (Red/Blue) into each of the 3 Envelopes (visible through a clear window or by holding up the chip).
  4.  Consult Output Rule.
  5.  Place YES/NO token in Output Bin.
  6.  Return Card and Tokens.
  7.  *Speed:* Must complete within 45 seconds per query.

  ## III. Interpreter Teams: Budget & Rules
  **Teams:** 4 Teams of 3 students (1 Phil Grad + 2 CS Undergrads each recommended).
  **Endowment:** 30 Compute Tokens per team.

  **Price List:**
  1.  **IO Query (1 Token):** Hand an Input Card to the Box. Receive Output Token. (Slot states remain hidden).
  2.  **Read Slot (4 Tokens):** For the *current* input card, ask the value of one specific Slot (1, 2, or 3).
  3.  **Intervention (6 Tokens):** For the *current* input card, force a specific Slot to be Active or Inactive *before* the Output is generated. (You must pay for the IO Query separately).
  4.  **Designer Note (50 Tokens):** Request the "Intent Document" explaining what the slots were *designed* to represent. (Priced prohibitively high to simulate inaccessibility of causal history).

  **Scoring (The "Paper"):**
  At the end, teams submit a **Model Card** containing:
  1.  **Causal Graph:** Which slots influence the output?
  2.  **Semantic Gloss:** What does each active slot "mean"? (e.g., "Slot 1 represents Redness").
  3.  **Confidence Bets:** On 3 held-back Test Cards, predict the Output AND the Slot States.
      *   Correct Output Prediction: +5 Points.
      *   Correct Slot State Prediction: +2 Points per Slot.
      *   **Penalty:** -10 Points if you claim a slot has a *determinate* meaning (e.g., "Slot 1 IS Redness") and the Designer Note (revealed in debrief) shows it was ambiguous or different.

  ## IV. Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:10: Setup & Briefing**
  *   Divide class into 4 teams.
  *   Introduce the Box Team (behind divider).
  *   Explain the Budget and Price List.
  *   **Crucial Instruction:** "Your goal is to write the definitive documentation of this system. You cannot read everything. You must theorize."

  **00:10 – 00:30: Phase 1 (Black Box Behavior)**
  *   Teams spend tokens on **IO Queries**.
  *   They will discover the Red/Odd correlation.
  *   They will discover the Output pattern (YES on Red 3, 5, 7; NO on Red 1 and all Blues).
  *   *Expected Discovery:* They will notice Slot 1 and Slot 3 always match (if they peek, but they shouldn't yet). They will notice Output correlates with "Red but not 1".

  **00:30 – 01:00: Phase 2 (Interpretability & Intervention)**
  *   Teams spend tokens on **Reads** and **Interventions**.
  *   *Budget Constraint:* With 30 tokens, if they do 10 IO queries (10), they have 20 left. That buys 5 Reads OR 3 Interventions. They cannot do both extensively.
  *   *The Trap:* Teams that Intervene on Slot 3 will find it changes nothing (Off-Path). Teams that Intervene on Slot 1 will change Output.
  *   *The Tie:* Teams will try to define Slot 1. Some will say "Red", some "Odd". Neither can be disconfirmed by data.
  *   *The Polysemy:* Teams might define Slot 2 as "Extremes" (1 or 8). This works for the data, but misses the disjunctive nature.

  **01:00 – 01:20: Phase 3 (Documentation)**
  *   Teams write their Model Card.
  *   They must commit to a gloss for Slot 1 (Red vs. Odd).
  *   They must commit to a Causal Graph (Does Slot 3 matter?).
  *   They place bets on the 3 Test Cards (Red 3, Red 5, Blue 8).

  **01:20 – 01:30: Phase 4 (The Test)**
  *   Run the 3 Test Cards through the Box.
  *   Reveal actual Slot States (Box Team opens envelopes).
  *   Tally Scores.
  *   *Note:* All teams should predict Output correctly if they modeled the logic. The differentiation comes from Slot predictions and Confidence Penalties.

  **01:30 – 01:40: The Reveal (Designer Note)**
  *   You read the "Designer Note" (cost 50 tokens, waived for debrief).
  *   *Content:* "Slot 1 was wired to detect Color. Slot 3 was a redundant copy for debugging. Slot 2 was wired to detect specific IDs (1 and 8). The correlation between Color and Parity was an accident of the input deck construction."

  **01:40 – 01:40: Transition to Debrief**
  *   Collect Model Cards. Do not announce winners yet. Move immediately to philosophical mapping.

  ## V. The Debrief: Mapping Activity to Philosophy
  *Do not lecture. Ask questions based on their experience.*

  **1. The Off-Path Slot (Slot 3) → Causal/Use Theory**
  *   *Ask:* "Team X, you noted Slot 3 was perfectly decodable. It predicted Red perfectly. Why did you mark it as 'Not a Representation' in your causal graph?"
  *   *Point:* Decodability (Information) $\neq$ Representation. If intervening on it changes nothing, it is a "ghost" or "epiphenomenon." This pushes toward a **Causal Role** or **Use** theory of representation (Dretske, Millikan). If it's not used by the system, is it *really* a representation, or just a correlation?

  **2. The Indeterminate Slot (Slot 1) → Content Indeterminacy**
  *   *Ask:* "Who wrote 'Slot 1 = Red'? Who wrote 'Slot 1 = Odd'? Look at your data. Could you distinguish them?"
  *   *Point:* The evidence underdetermines the content. This is **Quinean Indeterminacy** or **Kripke's Rule-Following**. The instrumentalist says: "It doesn't matter; both glosses predict the same." The realist says: "There is a fact of the matter (the Designer Note), but your interpretability tools couldn't reach it."
  *   *Key Question:* Is representation a relation between the state and the world (Realism), or a relation between the state and the interpreter's model (Instrumentalism)?

  **3. The Polysemantic Slot (Slot 2) → Disjunctive Content**
  *   *Ask:* "Slot 2 fired on Red 1 and Blue 8. Did anyone call this 'Extremes'? What if I told you the Box treats Red 1 as 'Start' and Blue 8 as 'Stop'?"
  *   *Point:* **Polysemy**. Is this one representation with disjunctive content ("Min OR Max")? Or is it two different representations sharing a physical substrate? If the latter, does the system "know" which one it is using? (It doesn't; it's just a lookup).

  **4. The Emergent Output → Instrumentalism**
  *   *Ask:* "The Output pattern was 'Red AND Not-1'. No single slot tracked this. Did anyone posit a 'Slot 4' in your documentation?"
  *   *Point:* **Daniel Dennett's Intentional Stance**. We ascribe beliefs/representations to the system because it works (predictive success), even if the internal ontology doesn't match. The Instrumentalist says your documentation is a *tool for prediction*, not a *map of territory*. If your Model Card predicts the Test Cards, does it matter if the Causal Graph is wrong? (In this game: Yes, because of the Penalty. In real AI: Maybe not).

  **5. Access to Causal History**
  *   *Point:* You had the weights (the Master Sheet was the lookup table). You *still* couldn't break the Red/Odd tie without the Designer Note.
  *   *Implication:* In real NNs, we have weights, but we lack the "Designer Note" (Evolution/Training Data nuances). We cannot see *why* the weights converged, only *that* they converged. If the training data had the same Red/Odd correlation, the indeterminacy is real, not just epistemic.

  ## VI. Predictable Failure Modes & Patches

  **1. The Box Team Slows Down**
  *   *Risk:* Human lookup is slower than GPU. 100 minutes will evaporate.
  *   *Patch:* Laminate the Master Sheet. Use large colored poker chips for Slots (hold up Red/Blue) rather than putting them in envelopes. This makes "Reads" instantaneous for the whole room.
  *   *Patch:* Limit Input Deck to 6 cards during Phase 1, expand to 8 in Phase 2.

  **2. Interpreters "Hack" the Tie**
  *   *Risk:* A CS student says, "It's obviously Parity, numbers are more fundamental than colors."
  *   *Patch:* In the Debrief, reveal the Designer Note explicitly states "Color Sensor." Emphasize that their *evidence* was identical. The point isn't that they guessed wrong, but that their *method* couldn't distinguish truth.

  **3. Budget Imbalance**
  *   *Risk:* Teams spend all tokens on IO Queries and have none for Interventions. They miss the Off-Path discovery.
  *   *Patch:* TA circulates during Phase 2. If a team has >20 tokens at minute 40, prompt them: "You have high confidence in your IO model. Are you sure about the internals? Interventions are on sale." (Lie about the sale, just urge them).
  *   *Better Patch:* Give 2 "Intervention Vouchers" for free to each team, costing tokens only after the first two.

  **4. Scoring Rewards Wrong Behavior**
  *   *Risk:* A team guesses the "Red" gloss correctly by luck and gets full points.
  *   *Patch:* The "Confidence Penalty" is key. If they claim 100% certainty on the Gloss, and the Designer Note reveals ambiguity, they lose points. Reward *hedging* ("Slot 1 tracks Red/Odd (Correlated)").

  ## VII. Limitations of the Analogy (For Your Closing Remarks)
  *Be frank about where the cardboard box fails to capture neural networks.*

  1.  **Generalization:** The Box is a lookup table. It cannot generalize to new inputs (e.g., Red 9). Real NNs generalize. This means the "Representation" in a NN must support *counterfactuals* in a way this Box cannot.
  2.  **Distributed Representation:** Our Slots are local (one student/chip). Real NNs are distributed (a concept is spread across thousands of neurons). This makes the "Slot 3 is Off-Path" distinction much harder in reality (superposition).
  3.  **Training Dynamics:** The Box was *designed*. NNs are *selected*. The "Designer Note" corresponds to the training process. In NNs, the "content" might be fixed by the gradient descent path, not just the final weights. We lack access to the *trajectory*, only the destination.
  4.  **Noise:** The Box is deterministic. Real NNs are noisy/stochastic. This makes "Intervention" results probabilistic, complicating the Causal Role test.

  **Closing Thought:** "Today you found that even with perfect access to the internals, you couldn't agree on what the system represents. If that's true for a cardboard box with 3 slots, what does it imply for a transformer with 175 billion parameters? Is the question 'Does it have representations?' a scientific question, or a pragmatic one about how we choose to document it?"
