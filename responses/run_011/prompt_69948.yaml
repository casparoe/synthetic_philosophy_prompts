          *   *Substantive Consequence:* It suggests that even if Dennett is right about metaphysics, his view might be *politically* more dangerous than Caruso's. It flips the usual script where skeptics are seen as soft on crime/unsafe. It argues skeptics have *harder* constraints.
          *   *Concession:* If the paper doesn't leverage this to say something about *policy* or *normative preference*, it risks being purely taxonomic. The section needs to explicitly state that this reorientation changes how we evaluate the theories (not by truth, but by safety/constraint).

      *   **Point 3: The Symmetry Objection (Quarantine also bends)**
          *   *The Objection:* Risk assessment (dangerousness) is also empirical and revisable. Governments can exaggerate risk to detain longer. Desert at least caps punishment by proportionality to *past* harm. Quarantine has no natural upper bound if risk is perceived as high.
          *   *Analysis:* This is a strong objection. In practice, risk assessment is notoriously manipulable. However, in *principle*, Caruso's model requires *actual* danger + least restrictive means. Dennett's model allows punishment *because* it is deserved, even if no future danger exists.
          *   *Practice vs. Principle:* In principle, Caruso's bound is tighter (no danger = no detention). In practice, risk is easier to manipulate than desert (which relies on public intuition about proportionality).
