          *   *Dennett:* The description of Dennett as viewing desert as practice-internal/normative rather than metaphysical is standard compatibilist fare (Strawsonian influence).
          *   *The "Competence is Empirical" Reply:* The user anticipates this. Is competence practice-relative? For Dennett, competence (reasons-responsiveness) is an empirical capacity, *but* the *significance* of that capacity (what it deserves) is determined by the practice. If Dennett says competence is purely empirical and fixes desert *outside* the practice, he risks slipping into a metaphysical claim about responsibility that looks suspiciously like the "ultimate source" view he rejects (or at least requires a robust realism about normative facts). If he stays compatibilist, the *link* between competence and specific punishment levels is largely conventional/pragmatic. So, yes, the reply is available but costs him the "relaxed" stance on metaphysics—it requires a robust normative realism that might alienate naturalists.
          *   *Verdict:* Characterization is fair enough for a seminar paper, but the "practice-internal" claim needs to be sharpened to avoid the empirical objection.

      *   **Point 2: The Emptiness Charge (Independent Work vs. Redescription)**
