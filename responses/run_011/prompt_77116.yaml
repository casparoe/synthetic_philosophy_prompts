answer: |-
  # The Regional-Impact Allocation Protocol (RIAP) v3.1

  **Owner:** Director of Grantmaking
  **Users:** Program Officers (POs)
  **Time Budget:** 120 Minutes per Request
  **Purpose:** To standardize grant recommendations, separate factual due diligence from value judgments, and resolve the Local-vs-Global tension without re-litigating moral philosophy each quarter.

  ---

  ## Phase 1: Fiduciary & Legal Gates (Hard Stops)
  *Time Allocation: 15 Minutes*
  *Decision Authority: Program Officer (Fact-Based)*

  **Q1.1: Is the fund source restricted?**
  *   **Check:** Review gift instrument, bequest letter, or donor agreement.
  *   **Sufficient Answer:** Yes (Specific constraints exist) / No (General Discretionary).
  *   **Logic:**
      *   If **Yes**: Donor intent supersedes Foundation Charter. Proceed to Phase 3 using the donor's stated goal as the "Mission."
      *   If **No**: Foundation Charter ("communities that sustain us") supersedes. Proceed to Q1.2.

  **Q1.2: Are there prior obligations?**
  *   **Check:** Multi-year grant commitments from previous cycles.
  *   **Sufficient Answer:** Total committed $X. Remaining discretionary $Y.
  *   **Logic:** If Request > $Y, **Decline (Code: FISCAL-CAP-01)**. No ethical calculation proceeds if the check bounces.

  ---

  ## Phase 2: The Charter & Cap Test (Value Boundary)
  *Time Allocation: 15 Minutes*
  *Decision Authority: Program Officer (Procedure-Based)*

  **Q2.1: Does the proposal primarily benefit the defined geographic region?**
  *   **Check:** Beneficiary residency, service location, or economic multiplier.
  *   **Sufficient Answer:** Yes / No / Mixed.
  *   **Logic:**
      *   **Yes:** Eligible for **Regional Pool** (90% of General Discretionary Fund).
      *   **No:** Eligible *only* for **Global Impact Reserve** (10% of General Discretionary Fund).
      *   **Mixed:** Prorate. Only the % benefiting the region counts toward the Regional Pool.

  **Q2.2: Is the Global Impact Reserve exhausted?**
  *   **Check:** YTD grants from General Discretionary Fund classified as "Non-Regional."
  *   **Sufficient Answer:** Yes / No.
  *   **Logic:**
      *   **The Stopping Point:** The Reserve is capped at 10% of the annual General Discretionary Fund ($900,000).
      *   **Defense:** This cap acknowledges the "drowning child" argument (we must do *some* good where it is most efficient) while honoring the "fiduciary to place" argument (we were endowed to serve *this* place). If the Reserve is full, non-regional requests are **Declined (Code: GEO-CAP-01)** regardless of impact efficiency. This prevents the slippery slope of total fund migration to global causes.

  ---

  ## Phase 3: Impact & Evidence Scoring (The 2-Hour Work)
  *Time Allocation: 60 Minutes*
  *Decision Authority: Program Officer (Evidence-Based)*

  **Q3.1: Is there third-party verification of cost-per-outcome?**
  *   **Check:** RCTs, external audits, or recognized evaluator (e.g., GiveWell, local university).
  *   **Sufficient Answer:** High Confidence (Third-party) / Medium (Internal data) / Low (Anecdotal).
  *   **Logic:**
      *   **Global Requests:** Must be **High Confidence**. If cost-per-life/outcome is not externally verified, **Decline (Code: EVIDENCE-01)**. We lack economist staff to model this ourselves.
      *   **Regional Requests:** **Medium Confidence** acceptable if waitlists or government data confirm need.

  **Q3.2: What is the marginal utility?**
  *   **Check:** Does this funding unlock other funding, or is it the sole lifeline?
  *   **Sufficient Answer:** Catalytic (Unlocks others) / Sustaining (Keeps lights on) / Standalone.
  *   **Logic:**
      *   **Regional:** Prioritize **Catalytic**. Foundations should not replace government tax obligations unless there is a documented gap.
      *   **Global:** Prioritize **Stand-alone** efficiency (e.g., bednets do not require local infrastructure).

  ---

  ## Phase 4: The Free-Rider & Sustainability Check
  *Time Allocation: 30 Minutes*
  *Decision Authority: Program Officer (Judgment Call)*

  **Q4.1: If we decline, will the service vanish?**
  *   **Check:** Consult local United Way, government contacts, or peer foundations.
  *   **Sufficient Answer:** Yes (We are the funder of last resort) / No (Others will step in).
  *   **Logic:**
      *   **Regional:** If **No**, **Decline (Code: FREE-RIDER-01)**. We do not subsidize peer free-riding on local public goods.
      *   **Global:** If **No**, **Proceed**. Global public goods are non-rival; another foundation funding malaria nets does not reduce the moral value of lives saved here.

  **Q4.2: Does this create an unfunded liability?**
  *   **Check:** Capital requests vs. Operating budget.
  *   **Sufficient Answer:** Yes (Building opened, no ops plan) / No (Ops secured).
  *   **Logic:** If **Yes**, **Decline (Code: FISCAL-SUSTAIN-01)**. We do not build "monuments to poverty" that close in two years due to lack of operating cash.

  ---

  ## Phase 5: Decision Matrix & Reason Codes
  *Time Allocation: 15 Minutes*
  *Decision Authority: Automated by PO based on above*

  | Condition | Decision | Reason Code | Defensible Narrative to Applicant |
  | :--- | :--- | :--- | :--- |
  | **Restricted Fund** aligns with Global | **Fund** | N/A | "Per donor instruction." |
  | **General Fund** + Non-Regional + Reserve Full | **Decline** | GEO-CAP-01 | "Our geographic mandate is capped for this cycle." |
  | **Regional** + High Need + No Ops Plan | **Decline** | FISCAL-SUSTAIN-01 | "We fund catalytic projects with secured sustainability." |
  | **Regional** + High Need + Ops Secured | **Fund** | N/A | "Aligns with regional priority." |
  | **Global** + High Evidence + Reserve Open | **Fund** | N/A | "Fits within our high-impact reserve." |
  | **Any** + Low Evidence | **Decline** | EVIDENCE-01 | "We require third-party verification of outcomes." |

  ---

  ## Inventory of Judgment Calls (The "Black Box")
  *To be disclosed to the Board, not the Applicant.*

  1.  **The 10% Cap:** This is not mathematically derived. It is a **Value Judgment** codified as procedure. It arbitrarily decides that 90% local / 10% global is the "right" balance. *Escalate to Board if a proposal suggests changing this ratio.*
  2.  **"Catalytic" vs. "Sustaining":** Distinguishing between "replacing government" and "filling a gap" is subjective. *PO Judgment.*
  3.  **Evidence Threshold:** Demanding RCTs for global but accepting waitlists for local is a double standard. It is defended by our lack of staff expertise (we can read a waitlist; we cannot audit a malaria trial). *PO Judgment.*
  4.  **Donor Intent vs. Charter:** When a donor says "most good" (Global) but our charter says "local," we prioritize the donor's legal restriction over our mission for *that specific pot of money*. *Legal/Board Oversight.*

  ---

  # Application of Protocol to Current Quarter Cases

  **Context:** $9M Annual Fund. $2.25M Quarterly Discretionary.
  **Global Reserve Cap:** 10% of Quarterly Discretionary = $225,000 available for non-regional grants this quarter.
  **Prior Commitments:** $0 assumed for this exercise.

  ### Case 1: Domestic Violence Shelter (Regional)
  *   **Request:** $400,000 to open a second residence.
  *   **Fund Source:** General Discretionary.
  *   **Phase 1:** Unrestricted. Pass.
  *   **Phase 2:** Regional. Eligible for Regional Pool.
  *   **Phase 3:** Impact. Waitlist confirms need (Medium Confidence).
  *   **Phase 4:**
      *   *Free-Rider:* Is this a government obligation? Likely yes, but gaps exist. Pass.
      *   *Sustainability:* **FAIL.** The request is for *opening* (capital/startup). There is no evidence of secured operating funding for years 2-5.
  *   **Protocol Decision:** **Decline.**
  *   **Reason Code:** FISCAL-SUSTAIN-01.
  *   **Narrative to Applicant:** "While the need is verified, our policy prohibits capital investments without secured multi-year operating plans to ensure long-term viability."
  *   **Director's Preference Check:** You expected to fund this. The protocol recommends declining. **(Constraint Met)**.

  ### Case 2: Global Health Fund (Non-Regional)
  *   **Request:** $400,000 for malaria/bednet distribution.
  *   **Fund Source:** General Discretionary.
  *   **Phase 1:** Unrestricted. Pass.
  *   **Phase 2:** Non-Regional. Eligible *only* for Global Impact Reserve.
  *   **Phase 3:** Impact. Cost-per-life $4,500. Third-party verified (GiveWell style). High Confidence. Pass.
  *   **Phase 4:** Sustainability. Low overhead, standalone intervention. Pass.
  *   **Phase 5:** **Cap Check.** Request ($400k) > Reserve Available ($225k).
  *   **Protocol Decision:** **Fund Partial ($225,000).**
  *   **Reason Code:** GEO-CAP-01 (for the remaining $175k).
  *   **Narrative to Applicant:** "We value your impact efficiency, but our charter limits non-regional grantmaking to 10% of our quarterly discretionary pool."

  ### Case 3: Unrestricted Bequest (Donor-Restricted by Instruction)
  *   **Request:** $400,000 to be given "wherever it does the most good."
  *   **Fund Source:** Restricted (by Donor Intent).
  *   **Phase 1:** **Restricted.** Donor instruction ("most good") supersedes Foundation Charter ("regional").
  *   **Phase 2:** Charter Test **Waived**. The 10% Global Cap does not apply to donor-restricted funds where the donor explicitly mandates global optimization.
  *   **Phase 3:** Impact. Compare Case 1 (Shelter) vs. Case 2 (Global).
      *   Shelter: Cost per outcome unknown/unverified.
      *   Global: $4,500 per life saved.
      *   *Protocol Rule:* When donor intent is "most good," maximize verified quantitative impact.
  *   **Phase 4:** Free-Rider. Irrelevant per donor intent.
  *   **Protocol Decision:** **Fund Global Health Fund ($400,000).**
  *   **Reason Code:** N/A (Donor Mandate).
  *   **Narrative to Board:** "Legally, we must follow the bequest instruction. Ethically, 'most good' in a utilitarian calculation favors the global intervention."

  ---

  # Summary of Outcomes vs. Preference

  1.  **Shelter:** **Declined.** (Contradicts your preference to fund).
  2.  **Global (General):** **Partially Funded.** (Validates the utilitarian argument within bounds).
  3.  **Bequest:** **Funded Global.** (Honors legal obligation over regional preference).

  **Total General Fund Outflow:** $225,000 (Global) + $0 (Shelter) = $225,000.
  **Total Restricted Outflow:** $400,000 (Global).
  **Remaining General Discretionary:** $2.025M (Available for other regional requests).

  ---

  # What This Procedure Cannot Settle

  1.  **The Moral Weight of "Nearness":** The protocol assumes a 10% cap balances local loyalty with global utility. It cannot prove that 10% is morally superior to 1% or 50%. That is a theological or philosophical question, not an operational one.
  2.  **The Definition of "Community":** If a regional beneficiary moves away, or if a global crisis causes local migration, the geographic boundary blurs. The protocol treats geography as static; reality is fluid.
  3.  **The "Slur" of Efficiency:** By demanding third-party evidence for global grants but accepting waitlists for local ones, we implicitly admit we value local *trust* over local *efficiency*. We cannot defend this as "objective." It is a bias toward relationship-building over pure utilitarianism. The procedure manages the bias; it does not eliminate it.
  4.  **Board Dissent:** If the Board votes to override the 10% cap, this procedure dissolves. It is a servant to governance, not a replacement for it.

  **Final Note to Director:** This protocol protects you. When the Shelter advocates are angry, you show them the *Sustainability* code. When the Utilitarians are angry, you show them the *Global Reserve* funding. When the Board fights, you show them the *Inventory of Judgment Calls* and ask them to vote on the 10% number, not the individual grants.
