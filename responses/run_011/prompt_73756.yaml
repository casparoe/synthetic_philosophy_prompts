answer: |-
  **Prospectus for Chapter 4: The Underdetermination of Narrative Gravity**

  **1. Introduction and Research Question**

  The central aim of this dissertation is to reassess the metaphysical status of the self in light of contemporary cognitive science and philosophy of mind. Specifically, Chapter 4 targets the dominant metaphorical framework used to defend a deflationary view of personal identity: Daniel Dennett's analogy of the self as a "center of narrative gravity." This analogy is frequently deployed to make eliminativism palatable. The argument runs that just as a center of gravity is a real but abstract posit—useful for prediction but lacking independent substance—so too is the self. It is a harmless abstraction, a theoretical fiction that does no ontological heavy lifting but organizes our discourse effectively. The intended philosophical payoff is to disarm the fear that eliminating the substantial self eliminates the person; if the self is merely a center of narrative gravity, its eliminability should be as unscary as the eliminability of a centroid in physics.

  However, this prospectus argues that the analogy relies on a disanalogy that has gone unexamined. In physics, a center of gravity is a harmless abstraction because it meets specific conditions of determinacy. It is a function of mass distribution such that once the physical facts are fixed, the center of gravity is fixed. There is no further fact to settle. By contrast, the narrative self appears to fail this condition of determinacy. The same psychological and behavioral facts admit multiple, incompatible emplottings. Which narrative counts as the "true" self is not fixed by the base facts alone but depends on who is narrating, the audience, and the pragmatic goals of the narration. This underdetermination suggests that the narrative self is not like a center of gravity in the relevant way.

  This chapter seeks to sharpen this intuition into a determinate research question. If the narrative self is underdetermined by the base facts in a way that a center of gravity is not, we must categorize the nature of this divergence to understand the metaphysical status of the self. The core question is: **Given the underdetermination of narrative emplotment, is the narrative self (a) still a benign abstraction analogous to a free parameter in a model, (b) a causally potent social object akin to money or borders, or (c) an abstraction that fails the harmlessness test outright, thereby invalidating the eliminativist comfort the analogy is supposed to provide?**

  Answering this question is necessary to determine whether the Dennettian strategy can survive contact with the actual mechanics of narrative identity. If the answer is (a), the analogy holds but requires refinement regarding who fixes the parameters. If (b), the self is real in a social ontological sense, undermining strict eliminativism. If (c), the analogy is misleading and the self is either more substantial or more problematic than the abstractionist admits. This chapter will argue that current literature leaves this trilemma unresolved, and that resolving it is a prerequisite for the dissertation's broader conclusion regarding personal identity.

  **2. The Standing Positions and Their Limitations**

  To justify the necessity of this chapter, we must examine why existing positions in the personal identity debate fail to address the specific problem of underdetermination within the gravity analogy. The literature generally divides into three camps: narrativists, anti-narrativists, and abstractionists. Each leaves the research question open.

  **The Narrativists**
  Proponents of the narrative view argue that selves are constituted by the stories we tell about ourselves. They embrace the idea that identity is a construction. However, most narrativists treat the underdetermination of narrative as a feature of human freedom rather than a metaphysical problem. They argue that because we can rewrite our stories, we possess agency. While this is normatively appealing, it sidesteps the ontological question required by the gravity analogy. If a center of gravity is determined by mass, but a self is determined by a choice of narrative among many compatible options, the disanalogy is stark. The narrativist position typically assumes that the "correct" narrative is the one the subject endorses. But this begs the question: what makes that endorsement authoritative? If the base facts (memories, behaviors, psychological traits) do not dictate the narrative, then the self is not emerging from the facts in the way a center of gravity emerges from mass. The narrativist leaves open whether this freedom makes the self a benign parameter (option a) or a social construct with causal power (option b). They celebrate the flexibility without analyzing its cost to the analogy's claim of harmlessness.

  **The Anti-Narrativists**
  Opponents of the narrative view, often psychological continuity theorists or biological animalists, argue that selves exist independently of storytelling. They might agree that the narrative self is underdetermined but would argue this is because narratives are irrelevant to the real self. For them, the Dennett analogy is likely false from the start because the self is not a narrative construct at all. However, this response is too quick for the purposes of this dissertation. Even if the *metaphysical* self is not a narrative, the *phenomenological* and *social* self operates narratively. The Dennettian move is attractive precisely because it accounts for the experience of selfhood without committing to a soul or ego. Dismissing the analogy because the self is actually a biological organism ignores the utility of the narrative posit in social coordination. The anti-narrativist fails to engage with the specific claim that the narrative posit is a *harmless abstraction*. They reject the existence of the narrative self rather than analyzing its status. Consequently, they do not address whether the underdetermination makes the abstraction harmful or socially potent. They leave the trilemma untouched because they refuse to play the game of narrative ontology.

  **The Abstractionists (Dennettians)**
  Finally, there are those who take the analogy at face value. They argue that the self is a fictional center around which experiences are organized, much like a center of gravity. Their standard response to concerns about underdetermination is to lean into the instrumentalism. They would argue that it does not matter if multiple narratives fit the facts; what matters is which narrative is useful for prediction and coordination. However, this response glosses over the three conditions that make a center of gravity harmless. A center of gravity is harmless because it is (i) determined by the base facts, (ii) predictively compressive, and (iii) dispensable without empirical loss. The abstractionist assumes condition (i) holds or is irrelevant. But if condition (i) fails, the abstraction is no longer merely summarizing facts; it is selecting among them. This selection process introduces a normative or social element that a center of gravity lacks. A center of gravity does not care who calculates it; the narrative self changes depending on who tells it. The abstractionist position leaves open whether this selection process transforms the abstraction into a social object (option b) or renders it a failed abstraction (option c). By treating all abstractions as equally harmless, they miss the specific risk introduced by underdetermination.

  None of these positions adequately grapple with the structural disanalogy regarding determinacy. The narrativists ignore the metaphysical cost of flexibility; the anti-narrativists dismiss the phenomenon; and the abstractionists assume the analogy holds without testing the conditions of harmlessness. This chapter fills that gap.

  **3. Methodology**

  To answer the research question, this chapter will employ a method of comparative structural analysis combined with targeted case studies. This approach is distinct from the two obvious alternatives: pure conceptual analysis or a survey of empirical psychology.

  **Why Not Pure Conceptual Analysis?**
  A standard philosophical approach would be to analyze the concept of "narrative" and "self" to see if underdetermination is inherent. While necessary, this is insufficient. Conceptual analysis can establish that multiple stories fit the facts, but it cannot determine the metaphysical status of the resulting posit. It can tell us that the narrative is underdetermined, but not whether that underdetermination makes the self a social object or a failed abstraction. We need to evaluate the *function* of the posit within a system, not just its definition. Therefore, the method must be functional and structural, comparing the role of the narrative self to the role of the center of gravity within their respective theoretical frameworks.

  **Why Not an Empirical Tour?**
  Alternatively, one might survey empirical work on autobiographical memory and confabulation. There is robust evidence that humans confabulate narratives and that memory is reconstructive. However, empirical data alone cannot resolve the metaphysical trilemma. Knowing that people construct different stories does not tell us whether those stories are benign parameters, causal social objects, or harmful fictions. Empirical work describes the mechanism of underdetermination but does not evaluate its ontological consequences. A purely empirical chapter would risk becoming a literature review on memory without advancing the philosophical argument about personal identity.

  **The Proposed Method: Structural Comparison and Case Testing**
  Instead, this chapter will proceed in four sections.

  *Section 1: The Physics of the Analogy.* I will rigorously define the three conditions that make a center of gravity a harmless abstraction (determinacy, compression, dispensability). This establishes the baseline for "harmlessness." I will demonstrate why determinacy is crucial: if a posit is not determined by the base facts, it introduces new information rather than just compressing existing information.

  *Section 2: The Narrative Gap.* I will apply these conditions to the narrative self. Using thought experiments involving conflicting narratives of the same life (e.g., a life interpreted as a tragedy vs. a redemption story based on the same events), I will demonstrate the failure of condition (i). I will argue that the selection of a narrative is not fixed by the psychological facts alone. This section establishes the underdetermination problem definitively.

  *Section 3: Evaluating the Trilemma.* This is the core analytical section. I will test the underdetermined narrative against options (a), (b), and (c).
  *   To test (a), I will ask if the narrative choice functions like a coordinate system choice in physics. Does fixing the narrative allow for consistent translation between perspectives without changing the facts?
  *   To test (b), I will examine the causal feedback loop. Does adopting a narrative change the base facts (behavior, psychology) in a way that a center of gravity calculation does not change mass distribution?
  *   To test (c), I will look for cases where the underdetermination leads to empirical loss or predictive failure, violating the condition of harmlessness.

  *Section 4: Synthesis.* I will determine which of the three options best fits the evidence. I will argue that option (b) is the most robust interpretation: the narrative self is a social object. This moves the view away from eliminativism toward a social ontology of the self.

  This method is superior because it respects the philosophical stakes (ontology) while utilizing the structural insights of the analogy itself. It avoids getting bogged down in the definition of "story" while refusing to rely solely on empirical data that cannot bridge the is-ought gap regarding ontological status.

  **4. Expected Results and Outcomes**

  The success of this chapter depends on delivering a clear verdict on the trilemma. Here is what the results would look like for each option, and how they impact the broader dissertation.

  **Outcome (a): The Benign Parameter**
  If the narrative self is like a coordinate choice, then the underdetermination is harmless. This would mean that while multiple narratives fit the facts, they are intertranslatable without loss of information. Choosing one is merely a pragmatic convenience for the narrator.
  *   *Implication:* The Dennettian analogy survives with minor modification. The self is still an abstraction, but we must acknowledge the theorist's role in fixing the parameter.
  *   *Dissertation Impact:* This supports the deflationary view of the self. I could proceed to argue that moral responsibility must also be deflated or reconceived as compatible with this parameterization.
  *   *Likelihood:* Low. Narratives are rarely intertranslatable. A redemption story and a tragedy story often imply different future actions and moral judgments that are not merely translational equivalents.

  **Outcome (b): The Social Object**
  If the narrative self is like money or a border, then it is underdetermined by physical facts but determined by social agreement, and it has causal power. The narrative changes the behavior of the subject, which changes the base facts, creating a feedback loop.
  *   *Implication:* The self is not a harmless abstraction but a real social institution. It is ontologically subjective but epistemically objective.
  *   *Dissertation Impact:* This undermines strict eliminativism. If the self is a social object, it has causal powers that must be accounted for in a theory of agency. This aligns better with the later chapters of my dissertation which argue for a robust view of moral responsibility.
  *   *Likelihood:* High. This fits the evidence of self-fulfilling prophecies in psychology and the social nature of identity formation.

  **Outcome (c): The Failed Abstraction**
  If the narrative self fails the harmlessness test outright, then the analogy is doing unearned work. The underdetermination leads to confusion or empirical loss.
  *   *Implication:* The Dennettian strategy is a dead end. We cannot use the center of gravity analogy to make eliminativism unscary because the narrative self is scarier than the abstractionist admits.
  *   *Dissertation Impact:* I would need to discard the Dennettian framework entirely for a different model of identity.
  *   *Likelihood:* Moderate. It depends on whether the social object status (b) saves it from being "failed."

  **Exhaustiveness and Collapse**
  Are these three options exhaustive? It is possible that (a) and (b) collapse. If a parameter is chosen socially and affects the system, it becomes a social object. However, distinguishing them is useful: (a) implies the parameter is passive, while (b) implies it is active. I will treat them as distinct to ensure precision. It is also possible that (b) and (c) collapse if one defines "harmless" strictly as "non-causal." I will define harmlessness functionally (predictive utility without ontological guilt) to keep them distinct.

  **Failure Conditions**
  The project would fail if:
  1.  **Underdetermination is Illusory:** If it turns out that psychological facts *do* determine a unique narrative (perhaps via a specific theory of rationality), the premise collapses. I will guard against this by focusing on cases of radical reinterpretation (e.g., religious conversion, political radicalization) where the base facts remain constant but the narrative shifts.
  2.  **The Analogy is Malformed:** If the center of gravity analogy was never intended to imply determinacy, then my critique attacks a straw man. I will guard against this by citing the specific textual evidence where Dennett and followers emphasize the "real pattern" aspect of the self, which implies a dependency on base facts.
  3.  **Scope Creep:** If the discussion of social ontology becomes too broad, the chapter will lose focus on personal identity.

  **5. Scope and Limitations**

  This chapter carries a significant risk of ballooning beyond the limits of a single dissertation chapter. The concepts involved—social ontology, the metaphysics of abstraction, and the philosophy of narrative—are each deep enough to sustain a monograph. To keep this within the 2,500-word equivalent scope of a chapter prospectus (and the resulting chapter itself), I must enforce strict boundaries.

  **Primary Risk: Social Ontology Drift**
  If I argue for outcome (b), there is a temptation to provide a full theory of social objects. I must resist this. The chapter only needs to establish that the narrative self *fits the category* of social objects enough to distinguish it from a center of gravity. I do not need to solve the problem of how social objects exist generally. I will limit the discussion to the specific feedback loop mechanism relevant to identity.

  **Secondary Risk: Empirical Deep Dive**
  As noted in the methodology section, there is a risk of turning this into a psychology chapter. I will cite empirical work only where it illustrates the philosophical point about underdetermination. I will not attempt to adjudicate between competing psychological theories of memory.

  **Cutting Strategy**
  If the chapter threatens to exceed length constraints during drafting, I will cut the following in order:
  1.  **Historical Context:** I will minimize the history of the narrative view. The focus is on the Dennettian analogy specifically, not the genealogy of narrativism.
  2.  **Alternative Analogies:** I will focus strictly on the center of gravity. Comparing it to other physics analogies (like wave functions) might be illuminating but is dispensable.
  3.  **Normative Implications:** While the result impacts moral responsibility, the detailed ethical consequences belong in the dissertation's final chapter. This chapter should remain metaphysical.

  **Conclusion**

  This chapter is pivotal for the dissertation because it tests the viability of the deflationary framework that underpins much of the contemporary debate. If the center of narrative gravity is not a harmless abstraction, then the easy path to eliminativism is blocked. By sharpening the question to focus on the specific disanalogy of underdetermination, I can move beyond the stalemate between narrativists and their critics. The standing positions have left the ontological status of the narrative self vague because they have not interrogated the conditions of the analogy they rely on. By forcing a choice between benign parameter, social object, or failed abstraction, this chapter will provide the metaphysical grounding necessary for the subsequent arguments regarding agency and responsibility. The method avoids the traps of pure abstraction and pure empiricism, focusing instead on the structural integrity of the theoretical posit. If successful, this chapter will demonstrate that the self is not merely a story we tell, but a thing we make, with all the ontological weight that entails. This shifts the dissertation from a defense of eliminativism to a reconstruction of social identity, a stronger and more defensible position.
