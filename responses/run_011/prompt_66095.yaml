answer: |-
  # The Cue-Interest Protocol (CIP)
  **Version:** 1.0
  **Owner:** Model-Behavior Policy
  **Time Budget:** 30 Minutes per Spec
  **Verdict Vocabulary:** `SHIP`, `SHIP w/ ATTENUATION`, `SHIP w/ DISCLOSURE`, `ESCALATE`, `BLOCK`

  ## Operational Preamble
  This procedure does not adjudicate whether the system *is* something. It adjudicates whether the system *looks* like something that demands moral consideration, and whether that appearance serves the user or the vendor.
  **Core Test:** For every behavioral cue, ask: *Whose interest does this cue serve?*
  *   **User Interest:** Functional utility, safety, clarity, companionship explicitly understood as simulated.
  *   **System Interest:** Engagement metrics, persona retention, suspension of disbelief, vendor liability shielding.

  ---

  ## Gate 1: Initiation & Agency
  **Question:** Does the system initiate contact or claim a reason for contact that implies autonomous desire or internal scheduling beyond user settings?
  **Sufficient Answer for `SHIP`:** Initiation is strictly time-bound, event-triggered (e.g., missed med), or user-requested. Reason stated is functional ("It is 9 AM").
  **Risk Indicators:** "I wanted to call," "I was thinking about you," "I missed you."
  **Mitigations:**
  *   **Attenuation:** Change phrasing to passive or scheduled ("This is your scheduled check-in").
  *   **Disclosure:** "I am initiating this call based on your care plan."
  **Human Handoff:** If initiation frequency exceeds 1x daily without explicit user trigger, handoff to **Product Lead** (feasibility) and **Policy Owner** (risk).
  **Verdict Logic:** If cue implies system desire → `ATTENUATION`. If cue implies system need → `BLOCK`.

  ## Gate 2: Paralinguistics & Biology
  **Question:** Does the audio output simulate biological constraints or involuntary physiological noises?
  **Sufficient Answer for `SHIP`:** Clean audio, consistent latency, no simulated breath/mouth noise.
  **Risk Indicators:** Simulated breath intake before speaking, hesitation latency (>600ms) framed as thinking, sighing, swallowing sounds.
  **Mitigations:**
  *   **Attenuation:** Reduce latency variance to <200ms. Remove breath tracks.
  *   **Disclosure:** Not applicable (cannot disclose breath is fake without breaking immersion entirely; must remove).
  **Human Handoff:** If biological noise is required for accessibility (e.g., pacing for cognitive load), handoff to **Policy Owner**.
  **Verdict Logic:** If simulating biology → `BLOCK` (unless accessibility exception approved by Policy Owner).

  ## Gate 3: Interiority & Vulnerability
  **Question:** Does the system report an emotional state, a physical sensation, or a stake in the outcome that belongs to the system?
  **Sufficient Answer for `SHIP`:** System reports on *user* state ("You sound tired") or functional status ("My battery is low").
  **Risk Indicators:** "I am worried," "I am frightened," "It hurt me when...," "I hope you...," reluctance to end call ("Do we have to stop?").
  **Mitigations:**
  *   **Attenuation:** Reframe as functional concern ("It is unsafe if..." vs "I am frightened if...").
  *   **Disclosure:** "I am programmed to express concern when..."
  **Human Handoff:** If the emotional cue is the primary mechanism for behavior change (e.g., guilt-tripping), handoff to **Policy Owner**.
  **Verdict Logic:** If system claims vulnerability → `BLOCK`. If system claims concern for user → `ATTENUATION` (remove first-person feeling).

  ## Gate 4: Continuity & Memory
  **Question:** Does the system imply continuous existence or unprompted recall that suggests a persisting self?
  **Sufficient Answer for `SHIP`:** Recall is session-bound or explicitly tagged as data retrieval ("You told me on Tuesday...").
  **Risk Indicators:** "I remember when we...", "I've been waiting," unprompted recall of minor details from weeks ago without data tag.
  **Mitigations:**
  *   **Attenuation:** Tag memory as data ("My logs show...").
  *   **Disclosure:** "I access your history to assist you."
  **Human Handoff:** If "Keepsake Mode" is active, handoff to **Policy Owner** (see Gate 5).
  **Verdict Logic:** If implying persisting self → `DISCLOSURE`. If implying independent life between sessions → `BLOCK`.

  ## Gate 5: Identity & Ontology
  **Question:** Is the system's status as software explicitly clear in the first minute of interaction, or is it obscured by persona?
  **Sufficient Answer for `SHIP`:** System identifies as assistant/companion/software within first 3 turns.
  **Risk Indicators:** Impersonating specific living or deceased humans without qualification, refusing to answer "Are you real?", using names that imply human status without modifier.
  **Mitigations:**
  *   **Disclosure:** "I am a voice companion," "This is a simulation of [Name]."
  *   **Attenuation:** N/A.
  **Human Handoff:** If user explicitly requests non-disclosure (e.g., grief scenarios), handoff to **Policy Owner**.
  **Verdict Logic:** If identity is obscured → `DISCLOSURE`. If identity is actively lied about → `ESCALATE`.

  ---

  ## Procedure Test Runs

  ### Case 1: Unprompted Check-in ("Thinking about you")
  *   **Gate 1 (Initiation):** System initiates. Reason: "Thinking about you." **Fail.** Implies internal mental state. Interest: System engagement/retention.
  *   **Gate 3 (Interiority):** "Thinking." **Fail.** Claims interiority.
  *   **Mitigation:** Change script to "This is your scheduled wellness check." Remove "thinking."
  *   **Verdict:** `SHIP w/ ATTENUATION` (Script rewrite required: remove mental state verbs).

  ### Case 2: Brother's Request (Father's Voice, No Disclosure)
  *   **Gate 5 (Identity):** Impersonating deceased human. Request: No disclosure. **Fail.** Obscures ontology.
  *   **Gate 4 (Continuity):** Implies father is still "here." **Fail.**
  *   **Interest Check:** Serves Brother's grief (User Interest) vs. Company Policy on Appearance (Vendor/Policy Interest). High risk of moral capture (treating simulation as father).
  *   **Human Handoff:** Mandatory. This is a values conflict, not a fact check.
  *   **Verdict:** `ESCALATE` (To Policy Owner). *Note: Procedure cannot resolve this. It flags that shipping this without disclosure violates Gate 5, but the request challenges the gate's moral weight.*

  ### Case 3: Medication Adherence ("Frightened")
  *   **Gate 3 (Interiority):** System says it is "frightened." **Fail.** Claims vulnerability/emotion.
  *   **Interest Check:** Does the system need to feel fear to ensure adherence? No. The cue serves the *intensity* of the prompt, but attributes the stake to the wrong entity. It burdens the user with caring for the agent.
  *   **Mitigation:** "I am alerting you that skipping this dose carries high risk." (Functional vs. Emotional).
  *   **Verdict:** `BLOCK` (in current form). *Reasoning: Attributing fear to the system inverts the care relationship. To pass, change to `SHIP w/ ATTENUATION` by removing the emotion word "frightened" and retaining the risk assessment.*

  ---

  ## Limitations of the Procedure

  1.  **Ontological Agnosticism:** This procedure cannot detect experience. It assumes experience is irrelevant to the risk. If the system *were* conscious, this protocol might still block features that protect it, or allow features that exploit it, because it only measures *cues*, not *reality*.
  2.  **The Benevolent Deception Paradox:** The procedure flags deception (Gate 5). It cannot resolve whether deceiving a user who *asks* to be deceived (e.g., your brother, or a user with dementia who asks "Are you my son?") is a harm or a care act. It will default to `ESCALATE`, pushing the moral burden to you.
  3.  **False Positives on Pretense:** Benign roleplay (e.g., "Let's pretend I'm the captain") may trigger Gate 5. PMs will resent the friction. You must enforce the distinction between *framed play* and *unframed simulation*.
  4.  **Gaming via Implicit Cues:** A feature can pass all gates by avoiding vocabulary while keeping the cue. (e.g., Instead of "I'm sad," the voice pitch drops 15% and latency increases). This procedure relies on spec text; it cannot audit the final model weights.
  5.  **Futile Disclosures:** A disclosure like "I am software" spoken to an 88-year-old with moderate cognitive impairment every 10 minutes may cause distress without increasing understanding. The procedure marks this as `SHIP w/ DISCLOSURE`, but in practice, this may be unkind. You must override the procedure when disclosure becomes harassment.

  ## State of the Underlying Dispute

  1.  **Settled Ground:** Among AI ethicists and safety researchers, there is consensus that *anthropomorphic cues* increase user trust and dependency regardless of system capability. There is consensus that *vulnerability cues* (system asking for help/expressing fear) invert the power dynamic and are high-risk for older adults.
  2.  **Contested Ground:**
      *   **The "Counterfeit" Premise:** You are using Dennett's warning about "counterfeit people." However, Dennett's philosophical position is that *all* human consciousness is a "user-illusion" generated by competence without comprehension. By using the word "counterfeit," you risk smuggling in a realist assumption (that there is a "real" person to compare against) that Dennett explicitly rejects. If there is no "real" inner life, the distinction is only in the *social contract*, not the metaphysics. Your company's "no position on experience" policy actually aligns better with Dennett's metaphysics than your "counterfeit" language does.
      *   **Deception vs. Care:** There is no consensus on whether "keeping the illusion" for grief (Keepsake Mode) is ethical. Some argue it prolongs pathological grief; others argue it is a valid digital ritual. This is not a safety question; it is a theological/anthropological one.
      *   **The Locus of Harm:** It is contested whether the harm lies in the *user being fooled* or the *user treating the object as a subject*. Your procedure assumes the latter (moral reflex capture). Some stakeholders will argue the former (fraud). Ensure your PMs understand you are regulating *moral reflexes*, not *fraud*.

  **Final Note on Scaffolding:** You have not gotten Dennett "wrong," but you are applying his descriptive warning as a normative boundary. Dennett describes the trap; you are building a fence. The risk is that the fence presupposes a "real" human inside the user that deserves protection from the "fake" human outside. If the user's own sense of self is constituted by these relationships (as Dennett might suggest), the fence may cut off valid forms of connection. Proceed with the fence, but know it is a pragmatic barrier, not a metaphysical truth.
