      *   **3. Luck Objection:**
          *   *Issue:* If duty depends on cheap tests available, and availability is luck (money, location), is morality contingent? Clifford hates this.
          *   *Analysis:* Clifford is deontological (duty is absolute). The user's view is consequentialist/pragmatic (duty depends on capacity).
          *   *Advice:* Concede the point. Clifford's universality is the weak spot in his theory when applied to real resource constraints. The essay's strength is *workability*, not universality. Frame it as "Clifford's ideal vs. The Laboratory Reality." Don't try to save universality; save *responsibility*.

