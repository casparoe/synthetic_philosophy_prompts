          *   *James:* Is "momentous" about cost of deferral? James defines it as unique, significant, irreversible. Interpreting this as "the price of deferral" is a strong pragmatic reading. It fits James's will-to-believe doctrine well. It's not a distortion; it's a sharpening.
          *   *James's Chemist:* Does James use this? Yes, in *The Will to Believe*, he discusses the chemist. He uses it to show *trivial* options (where you can wait). The user uses it to show a "cheap test." This is a clever inversion/appropriation. It works.
