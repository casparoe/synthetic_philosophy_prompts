          *   Mara: Linguistic competence without semantic grounding in action.
          *   Leo: "It doesn't matter" is the key. They feel the badness but don't care.
          *   Mara: If you don't care, it's not bad. Badness *is* caring.
          *   Leo: That makes badness extrinsic.
          *   Mara: No, it makes it constitutive.
          *   Leo: Is "unpleasantness" a single switch?
