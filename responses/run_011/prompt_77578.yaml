      *   *Check:* Did Leo address the "zombie" worry? *Fix:* Have him argue that a "bad feeling that doesn't motivate" is possible, just pathological, like a broken alarm bell that still rings.
      *   *Word Count:* Keep an eye on the 1200-1800 range.
      *   *Tone:* Academic but lively.

  6.  **Drafting the Coda:**
      *   *Verdict:* Who won? Probably a slight edge to the Imperativist because the "It doesn't matter" + No Learning combo hits the Phenomenologist hard on the "Why care?" front.
      *   *Mind Changer:* If we found neural correlates showing the "affective" cortex was lighting up normally despite the behavior.
      *   *Rigged Setup:* The "wincing" vs. "no learning" split might be physiologically impossible (if the affect is there, conditioning usually follows).
      *   *Theory Stretch:* Imperativism usually accepts some disconnect, but total disconnect on *learning* is tough. Phenomenalism usually ties feeling to motivation tightly.

  7.  **Writing - Step-by-Step (Mental or Scratchpad):**
      *   *Intro:* Coffee shop or office. Mara and Leo.
