  8.  **Review against Constraints:**
      *   Word count check.
      *   Four specific debate points covered? Yes.
      *   No strawmen? Ensure Mara acknowledges the wincing/reports seriously. Ensure Leo acknowledges the lack of learning seriously.
      *   Coda requirements met? Yes.

  9.  **Final Polish:** Check flow, ensure distinct voices, verify the philosophical terminology is accurate (imperativism, evaluativism, motivational internalism). *Self-correction: Ensure I don't accidentally solve the problem. The dialogue should illuminate the knot, not untie it completely.*

  *(Self-Correction during drafting the Coda)*: I need to be honest about the "rigged" nature. The case stipulates a dissociation that might be nomologically impossible. If the affective component drives learning, you can't have the affect without the learning. I need to point this out.

  10. **Final Word Count Check:** Aiming for ~1500 words for dialogue + ~400 for coda.

