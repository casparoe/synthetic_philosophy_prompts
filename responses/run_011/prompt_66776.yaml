  **OAKHAVEN COUNTY ARCHIVES**
  **INTERNAL MEMORANDUM**

  **TO:** State Board of Archives and Records Administration (SBARA)
  **FROM:** Director of Archives, Oakhaven County
  **DATE:** October 14, 2023
  **SUBJECT:** Representational Adequacy Self-Assessment, Cycle 3

  **1.0 PURPOSE AND METHODOLOGY**
  This document constitutes the Cycle 3 Representational Adequacy Self-Assessment for the Oakhaven County Archives. In accordance with SBARA Compliance Directive 9.4, this assessment evaluates the alignment of holdings with the demographic composition of the county service area. Scoring utilizes the Standardized Repository Matrix (SRM), measuring volume, accessibility, and donor diversity. Scores are assigned on a scale of 1.0 to 5.0, with 5.0 indicating full alignment. Methodology remains consistent with Cycle 2, with the exception of Indicator 2.3, where measurement units were refined from item-level to box-level counts to reduce statistical variance.

  **2.0 PERFORMANCE INDICATORS**

  | Indicator | Description | Cycle 2 Score | Cycle 3 Score | Trend |
  | :--- | :--- | :--- | :--- | :--- |
  | 1.1 | Volume of holdings regarding marginalized populations (linear feet) | 3.2 | 3.5 | ▲ |
  | 2.3 | Finding aid compliance with descriptive standards | 4.1 | 4.4 | ▲ |
  | 3.0 | Community donor participation rate | 2.1 | 2.1 | — |
  | **OVERALL** | **Weighted Composite Score** | **3.1** | **3.3** | **▲** |

  **3.0 FINDINGS AND NARRATIVE ANALYSIS**
  The overall score increase reflects successful processing initiatives undertaken during the fiscal year. Indicator 1.1 improved following the acquisition of Series 405 (Sheriff's Daily Logs, 1950–1980) and Series 812 (County Poor Relief Ledgers, 1920–1965). These series contain extensive data regarding incarcerated individuals and indigent residents. As these records document the presence of these populations within county systems, their processing directly increases the linear footage of holdings related to marginalized groups. This acquisition strategy ensures that administrative interactions are preserved for future research.

  Indicator 2.3 improved due to the completion of scope and content notes for three previously unprocessed boxes in the Asylum Intake Collection. Staff adhered strictly to archival neutrality principles, reproducing creator-supplied headings and vocabulary without editorial intervention. This ensures the finding aid reflects the original administrative context. Some researcher queries regarding terminology in these descriptions were noted; however, altering creator vocabulary would compromise provenance.

  Indicator 3.0 remained static. Outreach efforts invited community members to deposit personal papers. Participation was lower than projected. Analysis suggests potential donors often lack clear legal title to materials or cannot provide precise provenance data required for deed of gift execution. Additionally, materials offered often consist of ephemeral items lacking structural arrangement. Consequently, these offers could not be accepted under current collection policies.

  Regarding access, statutory closure periods restrict many case files for 100 years from creation to protect sensitive personal data. While this limits immediate access for descendants seeking genealogical information, it ensures compliance with privacy statutes and mitigates institutional liability.

  **4.0 CORRECTIVE ACTION PLAN**

  | Action Item | Owner | Target Date | Status |
  | :--- | :--- | :--- | :--- |
  | Recategorize Series 405 boxes to highlight demographic data tags | Processing Archivist | Q1 2024 | Pending |
  | Draft additional scope notes for Series 812 to clarify arrangement | Senior Archivist | Q2 2024 | Pending |
  | Review donor deed templates for clarity on title requirements | Director | Q3 2024 | Pending |
  | Maintain current retention schedules for all administrative series | Records Officer | Ongoing | Active |

  **5.0 NOTE ON DATA RESTATEMENT**
  Cycle 1 scores for Indicator 1.1 have been restated from 3.0 to 2.9. This adjustment corrects a previous calculation error wherein duplicate copies of surveillance logs were counted twice. This restatement does not impact Cycle 2 or Cycle 3 compliance status.

  **6.0 APPROVAL**

  __________________________
  **Elena Ross, Director of Archives**
  Date: 10/14/2023

  __________________________
  **Marcus Thorne, Compliance Officer**
  Date: 10/14/2023

  ***

  **Commentary**

  Most of this is painfully real. Archives do measure representation by linear feet, meaning police records count as "community history." Donor barriers like clear title are standard, effectively filtering out oral histories or family collections without neat paperwork. Privacy laws do block descendants while shielding institutions. I exaggerated the impossibility of deaccessioning; most archives *can* remove records, but rarely do, because it's risky. I also tightened the link between "neutrality" and "reproducing bias" to make the logic visible.

  Verdict: Structurally doomed. These assessments measure administrative throughput, not justice. They turn silence into a metric that can be solved by processing more boxes of surveillance data. The strongest counterargument is that without metrics, nothing changes at all; data forces conversation. But when the data defines "representation" as "volume of paperwork generated about people," the conversation is rigged. It becomes sedimentary layering: we document the documentation of inequality, then score ourselves on how well we filed it. That isn't repair; it's inventory.
