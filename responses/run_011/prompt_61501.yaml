prompt: |-
  I run the patient, family and community advisory program at a mid-size health system — basically every time someone wants to stand up a new engagement body (a chronic pain council, a youth board, a group of former inpatients advising on a ward redesign) it lands on my desk as a draft charter, and we do about 15-20 a year. My staff are nurses, social workers and admin people, nobody has read any philosophy, and I have roughly an afternoon per proposal before it goes up to the governance committee with a recommendation of proceed / proceed with conditions / send it back for redesign.

  Someone at a conference pointed me at Hegel's lordship-and-bondage material and the recognition arguments built on it, and said that was the right lens for what I'm actually doing: working out whether a body like this is a place where two sides genuinely recognize each other as independent agents, or a structure where one side is harvesting validation from people it doesn't treat as independent at all. I want you to build me the procedure that lens implies — not an essay about Hegel, a thing a coordinator can run off a two-page worksheet.

  So: the questions to ask of a draft charter, in order; what counts as a sufficient answer to each; which answers force a send-back; which force conditions attached; and where the procedure has to stop and hand the call to me because it's a question of values rather than of what the document says. Also tell me which parts of the theory you had to drop to make it usable, and which distinctions absolutely cannot go without the whole thing collapsing into a generic participation checklist — I've seen the generic version and I can smell it.

  Concretely, I've been told three claims are load-bearing here and I can't tell whether they are: that recognition coming from someone you don't yourself recognize as an independent other can't actually confirm anything for you; that the dependent party is the one who develops a stable sense of themselves through the work of shaping things while the dominant party stagnates; and that the dominant party's independence is really held up by the dependent party's activity, so the dependence runs the opposite way to how it looks. Say which of those can be turned into an observable test on a charter or terms of reference, which can't, and what you do with the ones that can't.

  Then run the procedure on three cases:

  1. A chronic pain council. Members review service redesign proposals, there's a ring-fenced budget they control, the service has to respond in writing within 30 days — but the system appoints every member, a senior executive chairs, and terms are one year, renewable at the chair's discretion.
  2. A tenant board on a housing site we partner with. It sets its own agenda, spends a devolved fund with no approval needed, publishes its own minutes and its own dissents — and nothing obliges anybody to answer it.
  3. Our flagship lived-experience co-design group, which I will defend to the death. Paid members, trained, co-authors on the papers that come out, and their testimony genuinely changed a funding policy. But the members are people currently in treatment with us, and the program manager reviews who stays on each cycle.

  I want the honest verdict on 3 even if its embarassing, and I want at least one case where the procedure comes back "the asymmetry is real and this is still the best thing available," because a diagnosis is not automatically an instruction to tear the body down and my committee will read it as if it is. Finish with what the procedure can't do: the failure modes I should expect, and the ways a determined sponsor could pass every question on the worksheet while gutting the thing anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a patient, family, and community advisory program at a mid-size health system.
      *   **Task:** Create a practical, two-page worksheet/procedure based on Hegel's "Lordship and Bondage" (Master-Slave Dialectic) to evaluate draft charters for engagement bodies (councils, boards, etc.).
      *   **Constraints:**
          *   Staff are nurses/social workers/admin (no philosophy background).
          *   Time limit: ~1 afternoon per proposal.
          *   Output: Questions, sufficient answers, decision rules (Proceed/Conditions/Redesign), escalation points (values vs. text).
          *   Meta-analysis: What parts of Hegel were dropped? What distinctions are load-bearing (cannot be generic)?
          *   Specific Claims to Evaluate:
              1.  Recognition from a non-recognized other confirms nothing.
              2.  Dependent party develops self-consciousness through work; dominant stagnates.
              3.  Dominant party's independence relies on dependent party's activity (reverse dependence).
          *   Case Studies:
              1.  Chronic Pain Council (Budget/Response vs. Appointment/Control).
              2.  Tenant Board (Autonomy vs. No Obligation to Respond).
              3.  Lived-Experience Co-Design Group (Paid/Impactful vs. Current Patients/Manager Control). *Needs honest verdict.*
          *   Requirement: At least one case where asymmetry exists but it's still the "best available."
          *   Ending: Failure modes and how sponsors could game the system.

  2.  **Deconstruct Hegel for this Context:**
      *   *Core Concept:* Recognition (*Anerkennung*). True self-consciousness exists only in being acknowledged by another self-consciousness.
      *   *The Struggle:* Life-and-death struggle leads to Master (Lord) and Bondsman (Servant).
      *   *The Twist:* The Master becomes dependent on the Servant for recognition (which is worthless because the Servant isn't free). The Servant finds freedom through *work* (shaping the world).
      *   *Application to Healthcare Engagement:*
          *   *Master:* The Health System (Executives, Clinicians).
          *   *Servant:* The Patients/Community.
          *   *Bad Engagement:* System extracts validation ("look, we listened") without granting agency. Patients are props.
          *   *Good Engagement:* Mutual recognition. System acknowledges patient agency; Patients acknowledge system constraints but shape outcomes.
      *   *Operationalizing:* How do we see "Recognition" in a charter?
          *   Power to say "No" or shape outcomes (Work).
          *   Independence of membership (not just appointed puppets).
          *   Obligation of the System to respond (acknowledging the other's reality).

  3.  **Drafting the Procedure (The Worksheet):**
      *   Need to keep it simple for nurses/admin.
      *   Focus on *structural independence* and *consequential work*.
      *   *Question 1: Selection & Tenure.* (Independence).
      *   *Question 2: Authority over Work.* (Shaping the world).
      *   *Question 3: Obligation to Respond.* (Recognition of the other).
      *   *Decision Rules:* Clear triggers for Redesign vs. Conditions vs. Proceed.
      *   *Escalation:* Where does philosophy end and politics begin? (e.g., budget allocation).

  4.  **Addressing the Three Claims:**
      *   *Claim 1 (Recognition from non-independent other):* Can we test this? Yes, via selection processes. If the System picks the patients, the patients aren't independent, so their recognition is cheap.
      *   *Claim 2 (Servant develops through work):* Testable. Do they have actual work that changes things? Or just advisory "feedback"?
      *   *Claim 3 (Master depends on Servant):* Harder to test in a charter. This is about systemic reliance. We can look for "veto power" or "mandatory consideration" as a proxy.
      *   *Decision:* Claim 1 & 2 are charter-testable. Claim 3 is cultural/operational, needs monitoring, not just charter review.

  5.  **Running the Cases:**
      *   *Case 1 (Pain Council):* Budget/Response is good (Work/Recognition). Appointment/Chair control is bad (Independence). *Verdict: Conditions.* (Need independent selection).
      *   *Case 2 (Tenant Board):* Autonomy is good (Independence/Work). No obligation to answer is bad (System doesn't recognize them). *Verdict: Redesign.* (Recognition requires response).
      *   *Case 3 (Co-Design Group):* Paid/Impact is good. Current patients/Manager review is bad (Dependency/Coercion). *Verdict: Conditions/Honest Verdict.* This is the tricky one. It works *because* of the asymmetry (access to current patients), but it's ethically fraught. *Requirement:* Must acknowledge the asymmetry but justify it as "best available" with safeguards.

  6.  **Refining the Hegelian Lens (Meta-Analysis):**
      *   *Dropped:* The "Life and Death Struggle" (too violent), the historical teleology (Spirit realizing itself), the abstract phenomenology.
      *   *Kept:* Mutual recognition, independence, the value of work/shaping, the hollowness of coerced validation.
      *   *Load-Bearing Distinctions:* "Advice" vs. "Decision," "Appointed" vs. "Selected," "Feedback" vs. "Co-Design." Generic checklists miss the *direction* of dependence.

  7.  **Failure Modes & Gaming:**
      *   Tokenism (checking boxes without power).
      *   "Co-optation" (making patients think like managers).
      *   Burnout (extracting labor without support).

  8.  **Review against Constraints:**
      *   *Two-page feel:* Keep sections tight.
      *   *Staff level:* Avoid jargon. Use "System" and "Members."
      *   *Honest Verdict on Case 3:* Don't shy away. It's exploitative if not managed, but effective.
      *   *One "Asymmetry is Real" case:* Case 3 fits this if framed correctly (therapeutic relationship vs. advisory relationship). Actually, Case 1 might be better for "Asymmetry is real but best available" if we argue executive chairing ensures alignment, but the prompt asks for an honest verdict on 3. Let's make Case 3 the "Conditions/Proceed with Safeguards" where we admit the dependency but mitigate it. Or Case 1. Let's look closer.
      *   *Correction:* The prompt asks for "at least one case where the procedure comes back 'the asymmetry is real and this is still the best thing available'." Case 3 is the strongest candidate for this. Current patients *are* dependent. That's the clinical reality. The advisory role *can* work if the power dynamic in the *room* is balanced, even if the clinical dynamic isn't. I need to make sure the procedure allows for this nuance.

  9.  **Final Polish:**
      *   Ensure the tone is professional, direct, and respectful of the user's expertise.
      *   Make sure the Hegelian theory is translated into *administrative language* without losing the bite.
      *   Check the three claims analysis again. Claim 3 is the hardest to operationalize. I need to be clear that charters can't capture systemic dependence fully.

  **(Self-Correction during drafting):** I initially thought about making Case 2 a "Proceed." But if the System doesn't have to answer, there is no recognition. The System ignores the Other. That's a failure of recognition. So Case 2 should be "Redesign." Case 1 has money and response (Recognition) but lacks independence (Selection). That's "Conditions." Case 3 has impact but high dependency. That's the "Asymmetry is real" case.

  Wait, Claim 1 says: "Recognition coming from someone you don't yourself recognize as an independent other can't actually confirm anything for you."
  In Case 3, if the patients are current clients, does the System recognize them as independent? No, they are patients. So the validation the System gets is hollow *philosophically*, but *pragmatically* useful. I need to distinguish between "Philosophical Validity" and "Operational Utility." The worksheet needs to flag this risk.

  Let's structure the response:
  1.  **The Procedure (The Worksheet):** Clear, actionable.
  2.  **Theory Translation:** What stayed, what went, the 3 claims.
  3.  **Case Applications:** The verdicts.
  4.  **Failure Modes:** How it breaks.

  Let's refine the "Three Claims" analysis.
  *   Claim 1 (Independence of Recognizer): Testable via selection/tenure.
  *   Claim 2 (Work shapes Self): Testable via scope of authority/budget.
  *   Claim 3 (Master depends on Servant): Not directly testable in charter. Requires outcome monitoring.

  Okay, ready to write.
answer: |-
  # The Recognition Audit: A Procedure for Advisory Charters

  **Purpose:** To determine if a proposed engagement body establishes *mutual recognition* (two independent agents shaping reality together) or *extraction* (the System harvesting validation from dependent subjects).
  **Audience:** Program Coordinators (Nurses, Social Workers, Admin).
  **Time:** 45–60 minutes per charter.

  ---

  ## Part 1: The Worksheet (The "Recognition Test")

  *Instructions: Answer based **only** on the text of the draft charter/Terms of Reference. If the text is silent, mark as "System Discretion."*

  ### Q1: The Independence Test (Who stands here?)
  **Question:** How are members selected, and who holds the power to remove them?
  *   **Green (Independent):** Members self-select, are elected by peers, or are nominated by community orgs independent of the Health System. Removal requires cause + peer review.
  *   **Yellow (Mixed):** System appoints from a pool vetted by community partners. Removal requires program manager approval.
  *   **Red (Dependent):** System appoints directly. Removal is at the discretion of a System executive/manager.

  ### Q2: The Work Test (Who shapes the world?)
  **Question:** What happens to the output of this group? Do they merely describe experience, or do they alter material reality?
  *   **Green (Shaping):** Group controls a budget, has veto power on specific designs, or co-signs final deliverables.
  *   **Yellow (Influencing):** System must respond in writing within a set time, but can reject recommendations with justification.
  *   **Red (Decorative):** Group provides "feedback" or "testimony" with no mandated response or binding outcome.

  ### Q3: The Recognition Test (Does the System see them?)
  **Question:** Is the System obligated to acknowledge the group's agency, even in disagreement?
  *   **Green:** System representatives sit *as members* (no chair privilege) or the group chairs its own meetings.
  *   **Yellow:** System chairs, but minutes (including dissents) are published externally without System edit.
  *   **Red:** System chairs, controls the agenda, and approves minutes before publication.

  ---

  ## Part 2: Decision Rules

  | Pattern of Answers | Recommendation | Required Action |
  | :--- | :--- | :--- |
  | **Any Red** | **Send Back for Redesign** | The structure guarantees dependence. The System is treating members as objects, not agents. |
  | **All Yellow** | **Proceed with Conditions** | The structure allows recognition, but risks drift. Attach conditions (see below). |
  | **All Green** | **Proceed** | Structure supports mutual recognition. Monitor for burnout. |
  | **Mixed (Green Work / Red Independence)** | **Proceed with Conditions (High Risk)** | *See "The Asymmetry Clause" below.* |

  ### Conditions & Escalations
  *   **Condition A (Selection):** If Q1 is Yellow/Red, require an independent community partner to manage recruitment.
  *   **Condition B (Response):** If Q2 is Yellow, require a "Reason for Rejection" template that must be signed by an executive.
  *   **Condition C (Minutes):** If Q3 is Yellow, require raw minutes be uploaded to a public URL within 5 days.
  *   **Escalation to Director (You):** If Q1 is Red but Q2 is Green. This indicates **Instrumental Dependence**. The System is using dependent people to do independent work. This is ethically volatile and requires a values decision on whether the outcome justifies the risk.

  ---

  ## Part 3: Theory Translation (What we kept, what we dropped)

  ### Load-Bearing Distinctions (Do Not Remove)
  To prevent this from becoming a generic "participation checklist," you must enforce these Hegelian distinctions:
  1.  **Advice vs. Work:** Generic checklists ask "Are they engaged?" Hegel asks "Do they transform the object?" If the group only talks about pain but doesn't move money or change policy, they are not working; they are performing. **This distinguishes Q2.**
  2.  **Independence vs. Inclusion:** Generic checklists want "representation." Hegel wants "independence." A patient appointed by a VP is not an independent consciousness; they are an extension of the VP. **This distinguishes Q1.**
  3.  **The Direction of Need:** Generic checklists assume the patients need the hospital. This lens assumes the hospital needs the patients to validate its morality. If the charter hides this need, it is dishonest. **This distinguishes Q3.**

  ### What Was Dropped for Usability
  1.  **The Life-and-Death Struggle:** We removed the risk of physical harm or total exclusion. In a health system, the "struggle" is bureaucratic (budget, access), not existential.
  2.  **Historical Teleology:** We are not trying to achieve "Absolute Spirit." We are trying to avoid bad faith structures.
  3.  **The "Truth" of Consciousness:** We cannot measure if a patient *feels* recognized. We measure if the *structure permits* recognition.

  ### Analysis of Your Three Claims
  1.  **"Recognition from a non-independent other confirms nothing."**
      *   *Testable?* **Yes.** This is **Q1 (Independence Test)**. If the System appoints the members, the members are not independent. Their praise of the System is structurally worthless (coerced).
  2.  **"The dependent party develops self-consciousness through work."**
      *   *Testable?* **Yes.** This is **Q2 (Work Test)**. If the charter limits them to "sharing stories," they are denied the transformative labor required for development. They remain objects of care, not agents of change.
  3.  **"The dominant party's independence is held up by the dependent party."**
      *   *Testable?* **No.** This is a systemic dynamic, not a textual one. A charter cannot reveal if the CEO *needs* this council to sleep at night.
      *   *Workaround:* You must monitor **outcomes**, not just charters. If the System cancels the council when budgets tighten, the System was dependent. If the council dissolves when funding stops, the Council was dependent. This requires post-implementation review, not charter audit.

  ---

  ## Part 4: Case Verdicts

  ### Case 1: Chronic Pain Council
  *   **Q1 (Selection):** Red (System appoints, Chair controls tenure).
  *   **Q2 (Work):** Green (Ring-fenced budget, mandatory response).
  *   **Q3 (Recognition):** Red (Exec chairs).
  *   **Verdict:** **Proceed with Conditions (High Risk).**
  *   **Rationale:** This is **Instrumental Dependence**. The System wants the *work* (budget control) without the *risk* (independent membership). The patients are being used as tools to validate spending decisions the Exec Chair likely already supports.
  *   **Action:** Condition A (Independent recruitment) is mandatory. If the clinical lead refuses to relinquish appointment power, **Send Back**. You cannot have genuine recognition if the Master picks the Servant.

  ### Case 2: Tenant Board
  *   **Q1 (Selection):** Green (Sets own agenda).
  *   **Q2 (Work):** Green (Devolved fund, no approval).
  *   **Q3 (Recognition):** Red (No obligation to answer).
  *   **Verdict:** **Send Back for Redesign.**
  *   **Rationale:** This is **Neglect**, not Recognition. The System has abdicated responsibility. Hegel's Master at least *needs* the Servant; here, the System ignores the Other entirely. A board that speaks into a void is not an advisory body; it is a pressure valve. It allows the System to claim "community partnership" while accepting zero obligation to the community's reality.
  *   **Action:** Require a "Mandatory Response Protocol." The System does not need to agree, but it must formally reply to every decision.

  ### Case 3: Lived-Experience Co-Design Group (The Honest Verdict)
  *   **Q1 (Selection):** Red (Current patients, Manager reviews retention).
  *   **Q2 (Work):** Green (Co-authors, changed funding policy).
  *   **Q3 (Recognition):** Yellow (Paid, trained, but Manager oversight).
  *   **Verdict:** **Proceed with Conditions (Asymmetry Acknowledged).**
  *   **Rationale:** This is the **"Asymmetry is Real"** case.
      *   *The Hegelian Problem:* Current patients are *structurally dependent* on the System for care. They cannot be fully independent agents (Claim 1). Their recognition of the System is always potentially coerced by their need for treatment.
      *   *The Pragmatic Reality:* This group produces the highest quality work (Claim 2). The "Work" is genuine co-design.
      *   *The Decision:* You cannot fix the clinical dependency without losing the insight of current patients. Therefore, you must **mitigate the coercion** rather than pretend it doesn't exist.
  *   **Action:**
      1.  **Firewall:** The Program Manager who reviews retention *cannot* be involved in the patients' clinical care.
      2.  **Exit Ramp:** Members must be able to resign without impact on their clinical treatment (verified by an ombuds).
      3.  **Transparency:** The charter must explicitly state: "Members are current service users. The System acknowledges this power imbalance." Hiding the asymmetry is bad faith.

  ---

  ## Part 5: Failure Modes & Gaming

  ### What This Procedure Cannot Do
  1.  **It cannot detect Co-optation.** A charter can grant power, but if the System trains patients to think like managers (using System jargon, adopting System priorities), the "Independence" is hollow. The Servant has internalized the Master's voice. *Mitigation:* Random audit of meeting minutes for "System-speak" vs. "Lived Experience language."
  2.  **It cannot prevent Burnout.** Hegel notes the Servant finds self through work, but too much work is exploitation. If the System relies too heavily on Claim 3 (System dependence on Patients), it will overwork the council. *Mitigation:* Cap hours and mandate rest periods in the charter.
  3.  **It cannot stop "Box-Ticking."** A determined sponsor can pass Q1-Q3 by granting a budget they know is too small to matter, or a veto they know will never be used.
      *   *The Tell:* Look at the **Budget Ratio**. If the advisory body controls <1% of the project budget, the "Green" on Q2 is a lie.
      *   *The Tell:* Look at the **Response Time**. If the System has 90 days to respond to a recommendation, they are waiting for the group to lose interest.

  ### The "Bad Faith" Loophole
  A sponsor can pass this worksheet by creating a **"Shadow Council."**
  *   *The Move:* They create a formal body that passes your audit (Independent, Budget, Power) but move the *actual* decision-making to an informal Slack channel or pre-meeting where only staff are present.
  *   *Your Counter:* Add a **Process Question**: "Are all deliberative discussions regarding recommendations minuted?" If the real work happens off-record, the charter is a facade.

  ### Final Instruction to Staff
  If a sponsor argues, "We can't let patients control this, they don't understand the constraints," reply: "Then this is not an advisory body; it is a focus group. Label it as such, do not promise recognition, and do not use their testimony for public validation." Hegel teaches us that false recognition is more damaging than no recognition at all.
