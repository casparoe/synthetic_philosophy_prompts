      *Let's refine the "Dreaded Question".* It should be something that undermines the "fine-graining" solution. Perhaps: "If a mask blocks the *connection* between basis and manifestation without removing the basis or interfering with an intermediate *disposition* (e.g., structural prevention), how is that a fink?" Or better: "Doesn't this lead to an infinite regress?"

  4.  **Drafting Content (incorporating register):**

