answer: |-
  There is no single, canonical psychological term for this specific phenomenon, though it is a well-documented pattern in political science, media literacy, and online community management.

  The closest existing concepts are:
  *   **The Genetic Fallacy:** Judging an argument based on its origin rather than its merit. (Too broad; doesn't capture the "polish" element).
  *   **Bulverism:** Assuming an opponent is wrong and then explaining their psychological motivation for believing the error. (Close, but usually focuses on bias rather than professionalization).
  *   **Source Derogation:** A tactic in persuasion where the source is attacked to neutralize the message.

  Because this specific flavor—where **competence is treated as evidence of inauthenticity**—doesn't have a settled name, I will propose a label that captures the mechanism: **The Sincerity-Competence Inversion** (colloquially, **The Astroturf Heuristic**).

  Here is the carving you asked for: where the heuristic is a bug, where it is a feature, and how it operates across group lines.

  ### 1. The Carving: Failure Mode vs. Justified Suspicion

  The core tension here is Bayesian. Your regulars are updating their probability that an argument is "astroturf" based on the evidence of "polish." The question is: *Is polish a reliable predictor of astroturf in this specific context?*

  **When it is a Failure Mode (The Bias):**
  In most organic intellectual communities, the Sincerity-Competence Inversion is an epistemic error. It privileges **expressive honesty** (venting raw belief) over **instrumental rationality** (constructing a sound argument).
  *   **The Error:** It assumes a zero-sum relationship between *effort* and *sincerity*. It presumes that caring enough to research, edit, and cite is evidence of *not* caring about the truth, but rather about the *outcome*.
  *   **The Consequence:** It creates a "Gell-Mann Amnesia" effect for arguments. The community becomes incapable of learning from high-quality dissent because the learning mechanism itself is flagged as hostile. It selects for leaders who are performative rather than competent.
  *   **The Tell:** The suspicion is triggered *solely* by the quality of writing, without reference to the account's history, timing, or network.

  **When it is Justified Suspicion (The Heuristic):**
  Astroturfing, PR campaigns, and state-sponsored disinformation are real. They *do* produce copy that is grammatically perfect, emotionally calibrated, and strategically caveated. In these contexts, polish is a valid signal.
  *   **The Signal:** Professional influence operations rely on **scale** and **consistency**. A real person is messy; a campaign is optimized.
  *   **The Differentiator:** You separate correct detection from the bias by looking for **Asymmetry of Resources** and **Contextual Rigidity**.
      *   *Resource Asymmetry:* Does the argument require 20 hours of data aggregation that a full-time worker couldn't reasonably do? If a "random dude" posts a white-paper quality rebuttal in 10 minutes, the polish is a valid red flag.
      *   *Contextual Rigidity:* Astroturf arguments are often "drop-and-run." They are polished but static. A genuine expert's polish is usually *adaptive*. They will refine their polished argument in response to specific counter-points. A shill often repeats the polished talking point because they are working from a script.
      *   *Network Clustering:* Is this one polished person, or did five polished people appear in the last hour? The bias triggers on the *individual*; the heuristic should trigger on the *pattern*.

  **The Boundary Line:**
  The move stops being a failure mode and starts being justified suspicion when the **polish exceeds the plausible capacity of the persona.**
  *   *Justified:* "This new account with no history just posted a perfectly formatted, citation-heavy rebuttal that aligns exactly with a lobbying firm's press release from an hour ago."
  *   *Bias:* "This long-time member posted a well-reasoned point that happens to disagree with us, and it's too coherent to be honest."

  ### 2. Does it require In-Group/Out-Group structure?

  No. While it is most potent across partisan lines, it is arguably more corrosive *within* a group. This is the engine of **Populism** and **Anti-Intellectualism**.

  *   **The "Sellout" Dynamic:** Within a political movement, a member who argues with nuance, data, and compromise is often accused of being "co-opted," "a wonk," or "part of the establishment." The sloppy, fiery true believer is seen as more authentic.
  *   **The Purity Spiral:** This inversion drives competence out of the in-group. If being smart looks like being a traitor, the smart people leave or shut up. The group is left with high-sincerity, low-competence leadership.
  *   **Example:** In a reading group (your second example), this manifests as **Anti-Elitism**. If the article is too well-argued, it feels like "propaganda" because it challenges the room's consensus without the expected emotional friction. The group prefers the "honest" confusion of a peer over the "suspicious" clarity of an expert.

  ### 3. How to Moderate Against It

  Since you are a moderator, you are looking for a way to intervene without stifling legitimate skepticism of PR firms.

  1.  **Shift the Burden of Proof:** When a user claims an argument is "too polished to be real," ask them to identify the *script*, not the *style*. "Is this a known talking point from a specific organization?" If they can't name the source, the polish is not evidence of astroturf.
  2.  **Decouple Sincerity from Sloppiness:** Explicitly community-norm that "taking time to write clearly" is a form of respect, not a signal of deception.
  3.  **The "Steelman" Rule:** Require that before dismissing an argument as astroturf, the dissenter must summarize the argument's strongest point. This forces engagement with the *content* before the *source*.
  4.  **Watch for the "Uncanny Valley":** The only time polish is truly suspicious is when it is *generic*. Real humans write with specific idioms, personal stakes, and localized knowledge. Astroturf often sounds like it could have been written for any forum, anywhere. If the argument lacks *specificity* to your community's history, the suspicion is more warranted.

  ### Summary Definition

  **The Sincerity-Competence Inversion:** A cognitive bias where the perceived professionalism of an argument is treated as evidence of its inauthenticity. It operates on the heuristic that *effort implies payment* and *clumsiness implies honesty*.

  It is a **failure mode** when it rejects valid expertise because it looks like PR.
  It is a **valid heuristic** when it identifies coordinated inauthentic behavior that relies on high-production value to mask a lack of genuine stake.

  The line between them is drawn at **plausibility**: Does the quality of the argument match the plausible resources and history of the person making it? If yes, dismissing it is bias. If no, dismissing it is defense.
