answer: |-
  Your hypothesis is elegant, and it is the standard "philosophical peace treaty" diagnosis: the biology is settled, the fight is purely methodological regarding burdens of proof. It is also, I suspect, too charitable to the participants and too clean for the messiness of the actual practice.

  If this were merely a dispute about null hypotheses, we would see a convergence on statistical standards. We do not. We see a convergence on *verbal concessions* ("Of course constraints matter," "Of course selection is powerful") while the *modeling practices* remain divergent.

  Here is the diagnosis: The adaptationism debate persists not because of a disagreement about defaults, but because it is a **category error regarding the nature of evolutionary explanation**. One side treats evolutionary biology as a search for **optimization laws** (nomological), while the other treats it as a reconstruction of **historical narrative** (idiographic). Your null-hypothesis view assumes both sides are playing the same game and arguing about the starting score. They are not. They are arguing about whether the game is chess or poker.

  ### 1. Attack on the Null-Hypothesis Diagnosis

  You suggest the fight is about who gets the benefit of the doubt: "Selection did it" vs. "Constraint did it." If this were true, we could resolve it by agreeing on a likelihood ratio or a Bayesian prior. But the disagreement is deeper: it is about what counts as an *explanation*.

  For the adaptationist (in the Williams/Dennett lineage), a trait is not fully explained until you have shown *why it was selected*. A constraint is merely a boundary condition on the optimization problem. To say "the band is a byproduct" is, to them, an incomplete explanation unless you explain why selection tolerated the band. (e.g., "The cost of the band was negligible compared to the benefit of the patch").

  For the structuralist/critic (in the Gould/Goodwin lineage), the optimization story is often a "just-so" post-hoc rationalization. The *real* explanation is the generative rule of the developmental system. To say "the patch is an adaptation" is to ignore the fact that the system could not have produced a red patch, only a blue one.

  The friction isn't about the *default*; it's about **explanatory sufficiency**. The adaptationist thinks a selection story is sufficient even with constraints acknowledged. The critic thinks a constraint story is sufficient even with selection acknowledged. This is why the "consensus pluralism" is hollow. It is an agreement to use both vocabularies, not an agreement on how to integrate them into a single causal model.

  ### 2. The Historical Charges and the Architectural Analogy

  You mentioned the strawman and ideological charges. These are often dismissed as ad hominem noise, but they reveal the category error.

  *   **The Strawman Charge:** Adaptationists claim G&L attacked a "Panglossian" view nobody held. This is technically true regarding *explicit doctrine* but false regarding *research heuristics*. If you look at the grant proposals and modeling papers of the 70s, the *practice* was to assume optimality until proven otherwise. G&L were attacking the *sociology of the field*, not the *logic of the theory*. The adaptationists defended the logic; the critics attacked the sociology. They talked past each other because one was doing philosophy of science (normative) and the other was doing sociology of science (descriptive).
  *   **The Ideological Charge:** The claim that G&L were pushing a Marxist/Structuralist agenda to downplay competition. This is largely a distraction, but it highlights that adaptationism is often tied to a specific view of agency and individualism in biology.
  *   **The Architectural Analogue:** The fact that St. Mark's Basilica uses pendentives, not spandrels, and that they were *designed*, is indeed the perfect microcosm. G&L used an example of **intelligent design** to argue against **intelligent design analogies in nature**.
      *   *The Irony:* In architecture, the "spandrel" (or pendentive) is a necessary structural consequence of putting a dome on a square base. It is a *constraint* of the geometry. But the architects *chose* to decorate them.
      *   *The Biological Parallel:* The lizard's pigment pathway is the geometry (constraint). The belly patch is the decoration (selection). The critics argue we focus too much on the decoration and ignore the geometry. The adaptationists argue the geometry only persists because the decoration was valuable enough to maintain the structure.
      *   *The Error:* Both sides assume that "designed" (in architecture) maps cleanly to "selected" (in biology). But in biology, the "architect" (blind variation) cannot distinguish the spandrel from the dome during construction. The analogy breaks down because there is no foresight to separate the necessary from the incidental *at the moment of origin*.

  ### 3. The Lizard Case: Can Data Settle It?

  Let's apply this to your lizard.
  *   **Fact:** Pigment pathway produces Band (ancestral) + Patch (derived).
  *   **Fact:** Band has no known function. Patch has display function.
  *   **Dispute:** Is the Patch the adaptation (dragging the Band) or is the Band the adaptation (with the Patch recruited)?

  You ask if better data could settle this. **No.** Not even with perfect data.

  Here is why:
  1.  **Phylogenetics** can tell you the Band came first. That establishes the *sequence*. It does not establish the *cause* of the Band's origin. The Band could have been a neutral drift feature, a physiological necessity (e.g., UV protection), or an adaptation for something lost (e.g., species recognition in a predator that no longer exists).
  2.  **Evo-Devo** can tell you the pathways are linked. It cannot tell you the *selection coefficient* of the Band in the ancestral environment.
  3.  **The "No Known Function" Problem:** The adaptationist will say, "Absence of evidence is not evidence of absence. The Band has a function we haven't found (e.g., thermoregulation, structural integrity of the skin)." The critic will say, "Extraordinary claims require extraordinary evidence. Until you find the function, it is a byproduct."

  This returns to your null hypothesis idea, but notice the asymmetry.
  *   To prove the **Band is a byproduct**, you must prove it is *neutral* (or nearly so). Proving neutrality is notoriously difficult in evolutionary biology.
  *   To prove the **Band is an adaptation**, you must identify a specific selective pressure.

  The dispute persists because **neutrality is a null hypothesis that cannot be conclusively verified, only failed to be rejected.** The adaptationist knows this and keeps looking for the function. The structuralist knows this and insists that without a function, the default is constraint/drift.

  The disagreement in the lizard case is not about the data; it is about the **risk tolerance for Type I vs. Type II errors in function attribution**.
  *   **Adaptationist:** Prefers to risk attributing function where there is none (Type I) to avoid missing a subtle optimization (Type II).
  *   **Critic:** Prefers to risk missing a function (Type II) to avoid telling just-so stories (Type I).

  This is not a scientific disagreement solvable by more lizard measurements. It is a **pragmatic disagreement about the goals of the discipline.** Do we want to maximize the detection of design (Adaptationism) or minimize the fabrication of design (Criticism)?

  ### 4. The Consensus Pluralism: Exhaustion or Resolution?

  It is mutual exhaustion dressed up as agreement, but with a specific division of labor.
  *   **Empirical Biologists:** Act as "Moderate Adaptationists." They assume selection is the primary driver because it generates testable hypotheses. Constraints are treated as "noise" or "parameters" in the model.
  *   **Philosophers/Theorists:** Act as "Moderate Critics." They write papers about the importance of evo-devo, niche construction, and drift, acknowledging selection but insisting on the complexity of the system.

  This is not a resolution because the **integration is missing**. We do not have a unified mathematical framework that weights selection against constraint dynamically. We have two separate toolkits. When a paper uses both, it is usually a selection model with a "constraint parameter" added ad hoc, not a generative model where constraints emerge from the system dynamics.

  ### 5. What Counts as Progress?

  If the diagnosis is correct (that this is a clash of explanatory ideals and error-risk tolerance, not just null hypotheses), then "progress" cannot be a verdict on who is right. Progress would look like one of three things:

  **A. Formal Integration (The Hard Path)**
  We need models where "constraint" is not a boundary condition but a dynamic variable. Evolutionary Systems Biology attempts this. If we can model the developmental landscape such that the "cost" of producing the spinal band is endogenous to the system, we stop asking "Is it adaptation or constraint?" and start asking "What is the **evolvability** of this pathway?"
  *   *Progress Marker:* A model that predicts the lizard's coloration pattern based on developmental parameters *and* selection pressures without needing to designate one as the "null."

  **B. Methodological Explicitness (The Pragmatic Path)**
  We stop pretending we agree. We explicitly state the **cost function** of our research program.
  *   *Adaptationist Paper:* "We prioritize minimizing Type II errors (missing adaptations). We accept a 20% false-positive rate on function attribution to ensure we detect subtle selection."
  *   *Structuralist Paper:* "We prioritize minimizing Type I errors (just-so stories). We accept a 20% false-negative rate to ensure robust causal claims."
  *   *Progress Marker:* Journals requiring authors to state their **evidential risk tolerance** regarding function attribution.

  **C. Dissolution via Semantics (The Philosophical Path)**
  We accept that "Adaptation" is a **cluster concept** (Griffiths/Neander) and stop trying to binary-classify traits.
  *   Is the lizard patch an adaptation? It has a Selected Effect (yes). It has a Causal Role (yes). It is developmentally constrained (yes).
  *   *Progress Marker:* Moving from "Is X an adaptation?" to "To what **degree** is X explained by selection vs. constraint?" and accepting that the answer varies by trait and timescale.

  ### Conclusion on the Lizard

  Your lizard case will remain contested even with perfect data because the data cannot speak to the **counterfactual history**.
  *   *Adaptationist Counterfactual:* "If the band were costly, selection would have uncoupled the pathway." (Implies the band is tolerated, hence effectively neutral/adaptation-maintained).
  *   *Critic Counterfactual:* "If the pathway couldn't produce the band, it couldn't produce the patch." (Implies the band is a necessary precondition, hence a constraint).

  Both are true. The disagreement is about which counterfactual is **explanatorily salient**.

  **Final Verdict:** Your null-hypothesis diagnosis is half-right. It is about defaults, but not statistical defaults. It is about **narrative defaults**. Adaptationism is a strategy for telling stories about *success*. Structuralism is a strategy for telling stories about *limitation*. Evolution is both. The debate persists because biology has not yet decided whether it wants to be the science of why organisms succeed (Selection) or why they are the way they are (Development + History). Until we have a theory that unifies success and limitation into a single dynamical system, the "Spandrels" debate will remain the foundational tension of the field, not because we lack data, but because we lack a metaphysics that can hold both truths simultaneously without ranking them.

  **Recommendation for your work:** Don't try to solve the adaptationism debate. Use the lizard case to demonstrate that the *question* "Is it an adaptation?" is the wrong unit of analysis. Propose that the unit of analysis should be the **Developmental-Selection Coupling**. Show how the "disagreement" vanishes if you model the pathway's evolvability rather than the trait's origin story. That is where the philosophy can actually move the biology forward.
