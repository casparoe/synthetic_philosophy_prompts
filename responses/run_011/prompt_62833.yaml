      *   **The Task:** Translate the theorist's arguments into the statistician's vocabulary *without* smuggling (forcing concepts into ill-fitting categories). Evaluate which claims translate, which distort, and which are silent in design-based language.
      *   **Specific Constraints:**
          1.  Do not smuggle/refute via redescription.
          2.  Do not take sides (acknowledge deliberative polling exists).
          3.  Close with a "residue report" and verdict (gap in framework vs. unclear claim).
          4.  Address the specific "considered judgment" claim at the end.
