      *   Claim 2: This microcosm confers legitimacy elections cannot (normative authority).
      *   Claim 3: Post-deliberation judgment = public's considered judgment (counterfactual inference).
      *   Claim 4: Rotation/short tenures prevent capture (dynamic stability).
      *   Claim 5: The assembly stands in for the whole, not a constituency (holistic representation).

  3.  **Translate into Design-Based Vocabulary (Iterative Process):**

      *   *Claim 1: Microcosm.*
