      *   Did I take sides? (Maintain neutrality.)
      *   Did I answer the specific "considered judgment" question? (Yes, in the conclusion.)

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

  *(Post-Drafting Review)*: The prompt asks for a "Residue Report" and a "Verdict." I need to make sure these sections are distinct and clearly labeled. The distinction between "Gap in Framework" and "Unclear Claim" is crucial.
  *Gap:* A property exists but stats has no name (e.g., "Descriptive Presence").
  *Unclear:* The claim is metaphysical/normative, not empirical.

  Let's refine the "Considered Judgment" analysis. It is a *counterfactual*. $Y_i(1)$ is opinion after deliberation. $Y_i(0)$ is opinion before. The theorist claims the *Legislative Mandate* should be based on $Y(1)$. Statistics can estimate $E[Y(1)]$. Statistics *cannot* confirm that $Y(1)$ is more "authoritative" than $Y(0)$. That is the silence.

