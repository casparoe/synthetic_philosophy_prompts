          *   Translation: Simple Random Sampling (SRS) or Stratified Random Sampling from the citizen frame.
          *   Fit: Good. This is standard sampling theory.
          *   Caveat: Nonresponse/Refusal is a major coverage error source in practice, but theoretically, it maps.

      *   *Claim 2: Legitimacy/Authority.*
          *   Stat Vocabulary: Inference validity, design effect, unbiasedness.
          *   Translation: This is tricky. Statistics deals with *accuracy* of estimates, not *authority* of decisions.
          *   Fit: Poor/None. Legitimacy is a normative property, not a stochastic one.
          *   Distortion: Trying to call it "validity" misses the political philosophy aspect.

      *   *Claim 3: Considered Judgment (Deliberation).*
          *   Stat Vocabulary: Treatment effects, causal inference, counterfactuals.
          *   Translation: $Y(1)$ vs $Y(0)$. $Y(0)$ is raw opinion (poll). $Y(1)$ is opinion after treatment (information + deliberation).
          *   Fit: Partial. We can estimate the *effect* of deliberation (Deliberative Polling). But the claim is that $Y(1)$ is the *true* parameter of interest, not just a treated value.
          *   Silence: Statistics doesn't define which potential outcome is the "true will."

      *   *Claim 4: Rotation/Prevent Capture.*
          *   Stat Vocabulary: Longitudinal sampling, panel attrition, time-series.
          *   Translation: Refreshing the sample to avoid systematic bias accumulation over time.
