          *   Distortion: "Capture" is political (lobbying, power), not just statistical drift.

      *   *Claim 5: Stands in for the Whole.*
          *   Stat Vocabulary: Domain estimation, aggregate inference.
          *   Translation: Inference is about the population total/mean, not sub-group domains.
          *   Fit: Good. This is standard population inference.

  4.  **Evaluate the "Translation" (The Core Analysis):**

      *   *Clean Translations:* The selection mechanism (Claim 1) and the scope of inference (Claim 5).
      *   *Distorted Translations:* The mechanism of rotation (Claim 4) - statistical refreshment vs. political corruption.
      *   *Silence:* Legitimacy (Claim 2) and the Ontological Status of the "Considered Judgment" (Claim 3).

  5.  **Address the "Residue Report" (Gap vs. Clarity):**
      *   Is "Legitimacy" a statistical gap? No, it's outside the domain.
      *   Is "Considered Judgment" a gap? It's a causal inference problem *plus* a normative definition. Statistics can measure the *change*, but not validate the *normative superiority*.
      *   Verdict: Some claims are political philosophy masquerading as empirical claims. Others point to a "Counterfactual Ideal" that statistics can model but not validate as "True."

  6.  **Address the Final Question ("What the public would conclude..."):**
      *   Is it estimable? Yes, via Deliberative Polling (Fishkin).
      *   Is it the *same* quantity? No. It's a *potential outcome* under specific treatment conditions.
      *   What kind of thing is it? It's a normative construct, not a descriptive parameter. It's $E[Y | do(Deliberation)]$, but the claim is that this equals "The Public Will." Statistics cannot verify that equality.

  7.  **Drafting the Response (incorporating the persona):**
      *   *Voice:* Colloquial but technical. Use terms like "frame," "coverage error," "potential outcomes," "identification."
      *   *Structure:*
          1.  Introduction (acknowledging the boundary).
          2.  Claim-by-Claim Translation Table (Translate, Map, Survival).
          3.  The Residue Report (Categorizing the failures).
          4.  The Final Verdict on "Considered Judgment."

      *(Self-Correction during drafting)*: I need to be careful not to say "Legitimacy is not statistical." I need to say "Legitimacy has no design-based analog." I must respect the user's constraint: "If a claim... has no counterpart... say so."
      *Refining Claim 3:* The user mentioned Deliberative Polling. I need to distinguish between *estimating the effect of deliberation* (which we can do) and *claiming that effect is the true parameter* (which we can't do).
      *Refining Claim 1:* The theorist says nonresponse doesn't matter because they replace. In sampling, replacement changes the inclusion probabilities unless handled carefully. I need to note this tension without just saying "she's wrong." The theorist is claiming the *principle* matters more than the *execution*.

  8.  **Final Polish:** Check against strictures.
