answer: |-
  This is a boundary problem. You are working in design-based inference, where the goal is to minimize the distance between an estimator and a fixed, existing population parameter. Your friend is working in political ontology, where the goal is to construct a procedure that *constitutes* authority rather than measures pre-existing preference.

  When you ask for a translation, you are asking for a mapping between a language of *measurement* and a language of *constitution*. Some concepts map isomorphically. Some map with distortion. Some map to silence.

  Here is the translation of her load-bearing claims into your vocabulary, followed by the residue report.

  ### 1. The Translation Matrix

  | Claim | Translation into Design Vocabulary | Design Apparatus Fit | Survival Status |
  | :--- | :--- | :--- | :--- |
  | **1. Selection by lot yields a microcosm.** | **Probability Sampling.** A Simple Random Sample (SRS) or Stratified Random Sample drawn from a frame of eligible citizens. The goal is descriptive representation (matching population margins on covariates $X$). | **High.** This is standard sampling theory. You have frames, selection probabilities ($\pi_i$), and estimators for population totals. | **Survives.** However, your objection regarding nonresponse is statistically valid. Her claim that replacements "need not mirror anyone" implies she abandons the probability structure once selection occurs, moving from *inference* to *symbolism*. |
  | **2. This microcosm confers legitimacy elections cannot.** | **Validity / Bias Reduction.** The claim is that the *process* generates an estimate with lower Total Survey Error (specifically lower measurement and selection bias) than an electoral proxy. | **Low.** "Legitimacy" is not a statistical parameter. You can measure *representativeness* (bias), but *authority* is a normative property, not a stochastic one. | **Silence.** Design theory assesses the accuracy of the map, not the right of the mapmaker to rule. There is no variance estimator for legitimacy. |
  | **3. Post-deliberation judgment = Public's considered judgment.** | **Causal Inference / Potential Outcomes.** Let $Y_i(0)$ be raw opinion and $Y_i(1)$ be opinion after treatment (information + deliberation). The claim is that the target parameter is $\bar{Y}(1)$, not $\bar{Y}(0)$. | **Moderate.** Deliberative Polling uses this exact framework. You can estimate the Average Treatment Effect (ATE) of deliberation. | **Distorted.** Statistics can estimate $\bar{Y}(1)$. It cannot validate the claim that $\bar{Y}(1)$ is the *true* public will. That is an identification assumption that cannot be tested within the design. |
  | **4. Rotation and short tenures prevent capture.** | **Longitudinal Refreshment.** Rotating panel designs to minimize attrition bias and time-dependent correlation. Prevents "institutional drift." | **Moderate.** You use rotation to manage panel conditioning and coverage decay. | **Distorted.** "Capture" implies endogenous power dynamics (lobbying, ambition). Statistical refreshment manages *error correlation*, not *power accumulation*. The mechanism is analogous, the target is different. |
  | **5. The assembly stands in for the whole.** | **Population Inference.** Inference is directed at the population mean/total, not domain estimates for constituencies. | **High.** This is the definition of a national survey vs. a stratified domain analysis. | **Survives.** This is a clean map. The assembly is a single-stage cluster intended for aggregate inference. |

  ### 2. The Residue Report

  You asked to distinguish between a gap in your framework (a real property you lack the name for) and a claim that was never clear (exposed by your vocabulary).

  **A. The Gap: "Descriptive Presence" vs. "Inferential Representativeness"**
  *   **The Claim:** "It is the population itself in miniature."
  *   **The Failure:** In your framework, a sample represents a population only insofar as it allows unbiased estimation of parameters. If $n=100$, the standard error is high. You see this as a defect. She sees the *physical presence* of the 100 people as the feature.
  *   **Verdict:** **Gap in Framework.**
  *   **Explanation:** Design theory treats units as interchangeable carriers of data ($y_i$). Political theory treats units as carriers of *status*. There is a property analogous to representativeness called **Descriptive Presence**—the idea that the sample *is* the population for the duration of the session, not an estimator of it. Your vocabulary has no term for "being" vs. "estimating." You measure coverage error; she measures ontological identity.
  *   **How to Settle It:** You would need a metric for *symbolic fidelity* distinct from *statistical precision*. Currently, none exists in sampling theory because sampling theory assumes the sample is never the population.

  **B. The Unclear Claim: "The True Will"**
  *   **The Claim:** "What the public would conclude under conditions the public is never given."
  *   **The Failure:** You correctly identified this as a counterfactual. But you treated it as an estimation problem. She treats it as a definition problem.
  *   **Verdict:** **Unclear Claim (Normative masquerading as Empirical).**
  *   **Explanation:** Your vocabulary exposes that this is not a quantity to be found, but a quantity to be *defined*. In causal inference, we can estimate $E[Y(1)]$. But to claim $Y(1)$ is the *authoritative* $Y$ requires a normative premise: that ignorance invalidates preference. Sampling theory is agnostic on whether $Y(0)$ or $Y(1)$ is the "truth." It merely estimates whichever you define as the target. Her claim fails to translate because it asserts a *hierarchy of parameters* that statistics does not recognize.
  *   **How to Settle It:** This cannot be settled empirically. It requires a philosophical argument about the nature of democracy (aggregative vs. deliberative). The sampling vocabulary does the unkind service of showing that this is not a technical design choice, but a redefinition of the estimand.

  **C. The Silence: "Legitimacy"**
  *   **The Claim:** "Authority that elections cannot match."
  *   **The Failure:** Total silence.
  *   **Verdict:** **Outside Domain.**
  *   **Explanation:** This is not a gap in your framework; it is a category error. You are asking about the properties of a ruler; she is talking about the right to wield it. No amount of weighting or raking generates authority.
  *   **How to Settle It:** Acknowledge that this claim is invisible to design-based inference. It is a political science claim, not a statistical one.

  ### 3. Verdict on the Unanswerable Claim

  You asked specifically about the claim you could not answer: *"What the public would conclude under conditions it never gets."*

  **Is this a quantity any design could in principle estimate?**
  **Yes and No.**

  *   **Yes:** A **Deliberative Poll** design can estimate this quantity. You take a probability sample, apply the "treatment" (balanced briefing, moderated deliberation), and measure the post-deliberation preference. You can calculate the point estimate and the confidence interval for "what the public would conclude." Fishkin's work demonstrates this is methodologically feasible within your framework.
  *   **No:** No design can estimate the *authority* of that quantity.

  **If not, what kind of thing is it instead?**
  It is a **Normative Counterfactual**.

  In your language, it is a potential outcome $Y(1)$ under a specific treatment protocol. The theorist is making two moves:
  1.  **Empirical:** We can estimate $Y(1)$ better than we can estimate $Y(0)$ (because $Y(0)$ is noisy/uninformed).
  2.  **Normative:** $Y(1)$ *ought* to be the basis of law, whereas $Y(0)$ (current polling/voting) ought not.

  Your vocabulary handles the first move perfectly. It falls silent on the second. The reason you could not answer her is that she shifted from an empirical claim ("we can measure this") to a normative claim ("this measurement is sovereign").

  **The Final Distinction:**
  You are arguing about **Measurement Error** (bias, variance, nonresponse).
  She is arguing about **Measurement Validity** (are we measuring the right thing?).

  When you say "sampling error is enormous," you are talking about precision.
  When she says "the assembly is not estimating anything," she is saying the assembly is not a *measurement device*; it is a *decision device*.

  **Conclusion:**
  Her position translates cleanly where it concerns **selection mechanics** (Claim 1 & 5). It translates with distortion where it concerns **process dynamics** (Claim 4). It hits silence where it concerns **authority** (Claim 2).

  The claim that defeated you ("considered judgment") is a **Redefinition of the Estimand**. She is not arguing that her design estimates the *current* public will more accurately. She is arguing that the *current* public will is the wrong parameter, and her design estimates the *correct* parameter.

  Your framework cannot refute this because design-based inference takes the target parameter as given. If she changes the parameter from "raw preference" to "deliberated preference," your objections about sampling error still apply to the *new* parameter, but they no longer undermine the *choice* of the parameter.

  **Recommendation:**
  Do not argue sampling error. Argue **Identification**.
  Ask her: *"If deliberation is the treatment, how do we know the treatment effect isn't driven by the moderators, the briefing materials, or the group dynamics? In causal inference, $Y(1)$ is only valid if the treatment is well-defined. Who defines the treatment?"*

  That is the point where her political theory must confront your methodological rigor. She claims the assembly reveals the public's mind. You can show her that the assembly actually reveals the public's reaction to a specific, highly controlled experimental protocol. That is a quantity you can estimate. Whether it is "the public's mind" is the residue your ruler cannot measure.
