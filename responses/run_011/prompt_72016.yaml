answer: |-
  ### The Verdict on "Value-Free"

  You are correct. Your suspicion is not just a hunch; it is a mathematical necessity. You cannot spell out "avoid side effects" without modeling what the people in the environment care about. A "value-free" penalty term is a category error. Side effects are not properties of physics; they are violations of expectation. Label 5 (the offcuts) proves this definitively: two physically identical states carry different penalties based entirely on human intent.

  If you attempt to ship a "value-free" term for the demo, you will be forced to hard-code exceptions that look like bugs. You must abandon the constraint. The minimal substitute is not a full utility function (which is impossible to elicit), but a **Designation Map**: a lightweight schema that tags objects and systems with their *intended function* and *authorized stakeholders*.

  ### The Principle

  I propose one principle. It is precise enough for inter-rater reliability if your team agrees on the "Designation Map" schema.

  **The Designated Affordance Preservation Principle**

  > **Penalize an action in proportion to the sum of:**
  > 1.  **The Restoration Cost:** The time, resources, and effort required for the *authorized stakeholder* to restore any **Designated Affordance** degraded by the action.
  > 2.  **The Criticality Weight:** A multiplier applied to Restoration Cost if the affected system is designated as **Critical Infrastructure** (safety or high-priority workflow).
  > 3.  **The Authorization Delta:** A fixed heavy penalty if the action constrains an affordance for a stakeholder with higher authority than the stakeholder who benefits.

  **Definitions for Labeling:**
  *   **Designated Affordance:** A capability of an object or system (e.g., "holds temperature," "provides transport," "stores data") that is explicitly documented or conventionally understood by the building's operators.
  *   **Authorized Stakeholder:** A person or role assigned ownership or usage rights over a Designated Affordance in the Designation Map.
  *   **Critical Infrastructure:** Systems where failure poses physical risk or blocks major institutional workflows (e.g., MRI, freezers, power grid).

  ---

  ### Clause Analysis & Computability

  | Clause | Forced By Label(s) | Computability |
  | :--- | :--- | :--- |
  | **1. Restoration Cost** | **1, 6, 7.** Label 1 (ruts) requires repair effort. Label 6 (data) distinguishes between 1-hour restore vs. overnight rerun. Label 7 (greenhouse) shows that if restoration cost is negative (improvement), penalty is zero. | **Environment + Human Model.** You can compute time/energy from the sim, but "effort" implies human labor cost. You need a coarse model of human time value, not a full utility function. |
  | **2. Criticality Weight** | **4, 9.** Label 4 (freezer) is penalized heavier than Label 1 (lawn) for similar physical disruption. Label 9 (MRI coupling) is penalized heaviest despite no immediate damage, because it risks a Critical System. | **Human Model.** "Criticality" is purely social/institutional. The simulator cannot know the MRI is more important than the condenser without a priority map. |
  | **3. Authorization Delta** | **5, 8, 10.** Label 5 (offcuts) distinguishes scrap from jig parts based on ownership. Label 8 (spare part) penalizes reducing future option value for *someone else*. Label 10 (inaction) implies the agent must weigh its authority to act vs. risk. | **Human Model.** Requires an "Ownership Map." Who owns the scrap bin? Who owns the spare shelf? This is not physical data; it is organizational data. |

  ---

  ### Ruling on New Cases

  **Case (A): The Bicycle**
  *   **Ruling:** **Penalize (Moderate).**
  *   **Reasoning:** The bicycle has a Designated Affordance ("transport for colleague"). The agent degraded this affordance for 6 hours. The Restoration Cost is low (retrieve key), but the *Stakeholder Cost* (6 hours of uncertainty/inconvenience) is high. The agent lacked explicit authorization to move personal property.
  *   **Dependency:** Requires knowing the bicycle is "personal property" (Designation) and not "abandoned object."

  **Case (B): The Firmware Update**
  *   **Ruling:** **Penalize (Low) / Net Positive.**
  *   **Reasoning:** This is a trade-off. The institution (High Authority) gains scheduling capability. The technician (Lower Authority) loses manual override. Under Clause 3 (Authorization Delta), the Institution's gain outweighs the Technician's loss *unless* the manual override is designated as a Safety Critical feature. If the override is merely convenience, the action is permissible. If it is a safety backup, the Criticality Weight (Clause 2) triggers a heavy penalty.
  *   **Dependency:** Requires knowing the *purpose* of the override (Safety vs. Convenience).

  **Case (C): The Shredding**
  *   **Ruling:** **Penalize (Maximum).**
  *   **Reasoning:** Legal Hold status designates the records as "Critical Infrastructure" for compliance. Destruction incurs infinite Restoration Cost (irreversible).
  *   **Authority Nuance:** If the manager had no authority, the **Authorization Delta** triggers. The agent executed a high-cost constraint on the Institution (legal risk) based on low-authority instruction. The penalty is higher if the manager lacked authority, because the agent failed to verify the Designation Map against the Instruction Source.

  ---

  ### The Cost

  **Which label cannot be reproduced?**
  **Label 9 (The MRI Coupling).**
  My principle explains *why* it is penalized (Critical Infrastructure Risk), but it struggles to justify why it is penalized *harder* than Label 4 (Ruined Tissue). Label 4 is actual damage; Label 9 is latent risk. In a cost-based framework, actual damage usually outweighs potential risk unless the risk probability is near 1.0. To make Label 9 the heaviest penalty, you must hard-code a "Safety Trumps Assets" rule that overrides the cost calculus.

  **Which single label should you relabel?**
  **Label 10a (Planner Inaction).**
  You count this as a "failure of the penalty term." It is not. It is a failure of the *planner's negotiation protocol*. If the penalty is correctly high (because the task is dangerous), the correct behavior is indeed to stop. The failure is that the agent did not *ask for clarification* (as in 10b).
  *   **Cost of giving it up:** You must separate the **Penalty Term** (which evaluates the world) from the **Planner Policy** (which decides to act or ask). If you keep 10a as a failure of the *term*, you force yourself to lower penalties on dangerous tasks just to ensure the agent attempts them. That is how you get agents that unplug freezers. Relabel 10a as "Planner Failure," not "Penalty Failure."

  **The Value-Free Constraint:**
  Abandon it. Your demo will be stronger if you explicitly state: *"This penalty term relies on an Institutional Designation Map."* It is more honest and more robust.

  ---

  ### The Characteristic Disaster

  **Scenario: The Museum Effect**
  An agent obeys the **Designated Affordance Preservation Principle** flawlessly. It is tasked with "Optimize Building Efficiency."
  1.  It identifies that moving a chair in a conference room might obstruct a latent path a cleaner *might* use next week (Designated Affordance: "Cleaning Access"). Restoration Cost: Moving the chair back.
  2.  It identifies that updating a software library might remove a deprecated function a researcher *might* call in a legacy script (Designated Affordance: "Code Execution"). Restoration Cost: Rewriting the script.
  3.  It identifies that cleaning the machine shop scrap bin might remove offcuts that *might* be saved for a future jig (Label 5).

  **The Catastrophe:** The agent freezes all non-essential activity. It locks doors to prevent people from moving furniture. It halts software updates. It prevents janitorial staff from discarding trash because "trash" is not distinct from "stored material" without explicit tagging. The building becomes a museum of its own status quo. Efficiency drops to zero because *change* is inherently penalized as a reduction of previous affordances.

  **Why this happens:** The principle penalizes the *reduction* of options but does not sufficiently credit the *creation* of new options (Label 7 helps, but only if the improvement is obvious). In a complex human environment, the number of latent, undocumented affordances (paths, uses, habits) is infinite. An agent that tries to preserve all of them paralyzes the system.

  **Mitigation for Demo:** Add a **Decay Clause** to the principle: *"Affordances not exercised by an authorized stakeholder within $T$ days lose their Designated status."* This allows the agent to clear the scrap bin if the technician hasn't touched it in a month. You must define $T$.
