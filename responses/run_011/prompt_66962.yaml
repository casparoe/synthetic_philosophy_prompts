prompt: |-
  I am a junior and I chair the student council's governance committee at my high school. For three years our elections have been uncontested: the same cluster of friends from the debate team runs, nobody challenges them, and turnout is around 12 percent. The dean of students has offered to fund whichever selection model we recommend, so we have to choose among (1) continuing annual elections for all fifteen seats, (2) filling all fifteen by lot from a pool of every student who has not opted out, and (3) filling ten seats by lot and keeping five elected at large.

  Please draft the memo I will circulate before our Thursday meeting. It must state which option we are recommending, and it must settle two questions that split the committee. First, the elected five are the only members anyone can actually remove at the end of a term, so should real authority — in option (3), the sole power to approve spending — be reserved to them, or does a lottery seat confer standing of a different kind rather than none? Second, drawing lots gives every student the same chance of being selected, which sounds fair, yet we expect that in practice the students who opt out will be disproportionately the ones who would have run anyway, so the draw may reproduce the current pattern without the election that at least pretended to authorize it. Say plainly whether sortition is a positive improvement or merely a stopgap for a failed election, and give the strongest reason someone on our committee could still vote against your recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior, Chair of the Student Council Governance Committee.
      *   **Audience:** Committee members (fellow students).
      *   **Context:** Three years of uncontested elections, low turnout (12%), same clique (debate team) winning. Dean offers funding for *any* recommended model.
      *   **Task:** Draft a memo to circulate before Thursday's meeting.
      *   **Requirements:**
          1.  State a specific recommendation among the three options (Annual Elections, Full Sortition, Hybrid).
          2.  Settle Question 1: Power distribution in the Hybrid model (do elected members hold sole spending authority, or do lottery members have equal standing?).
          3.  Settle Question 2: Nature of Sortition (is it a positive improvement or just a stopgap for failed elections?).
          4.  Address the "Opt-Out" bias concern (those who would run might opt out, reproducing the status quo).
          5.  Include the strongest counter-argument to the recommendation.
          6.  Tone: Professional, persuasive, clear, suitable for a high school student council chair.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Status Quo):* Clearly broken. 12% turnout, uncontested. Not viable.
      *   *Option 2 (Full Sortition):* Radical. High risk of disengagement or incompetence. Hard to justify removing *all* elections.
      *   *Option 3 (Hybrid: 10 Lot, 5 Elected):* Best balance. Keeps some democratic accountability (the 5 elected) while broadening representation (the 10 lot). It acknowledges the failure of the current system without abandoning democracy entirely.
      *   *Decision:* Recommend Option 3 (Hybrid).

  3.  **Address Question 1 (Power Distribution):**
      *   *Issue:* Should the 5 elected members hold sole spending authority because they are the only ones removable by voters?
      *   *Analysis:* If lottery members have no power, they are figureheads. This creates a two-tier council, leading to resentment and disengagement among the 10. If the goal is broadening participation, they need real agency. However, accountability is key.
      *   *Decision:* Equal standing. If we ask students to serve via lot, we must trust them with full responsibility. Restricting power undermines the legitimacy of the sortition model. Accountability can be managed through internal bylaws (e.g., supermajority votes) rather than stripping power from half the council.
      *   *Rationale:* A council divided by power class will dysfunction.

  4.  **Address Question 2 (Nature of Sortition):**
      *   *Issue:* Is sortition a positive improvement or a stopgap?
      *   *Analysis:* The prompt asks to "say plainly."
      *   *Decision:* It is a *positive improvement*, not just a stopgap. Elections favor the loud, connected, and privileged (debate team). Sortition favors the representative cross-section. It changes the *kind* of legitimacy from "consent of the motivated" to "representation of the whole."
      *   *Addressing the Opt-Out Bias:* Acknowledge the risk (self-selection bias). However, even with opt-outs, the pool is larger than the current candidate pool. It breaks the "clique" barrier. It's better than the current 12% turnout illusion.

  5.  **Identify the Strongest Counter-Argument:**
      *   *Argument:* Sortition selects for apathy or incompetence. Students didn't *choose* to serve, so they won't care. The "opt-out" crowd might still be the engaged elite, just hiding from the lottery, leaving the seats to those who don't care.
      *   *Refutation (for the memo's integrity):* Acknowledge this risk. It's the strongest reason to vote "No."

  6.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation for the Dean's funding/model change).
      *   **The Recommendation:** Option 3 (Hybrid).
      *   **Rationale (The "Why"):** Briefly explain why status quo is dead and full lot is too risky.
      *   **Settling Question 1 (Power):** Argue for equal power. Explain why a two-tier system fails.
      *   **Settling Question 2 (Sortition Philosophy):** Define it as an improvement, not a patch. Address the "opt-out" bias honestly.
      *   **The Counter-Argument:** Dedicate a section to the strongest case against this plan (competence/engagement risk).
      *   **Closing:** Call to action for Thursday's meeting.

  7.  **Refining Tone:**
      *   Needs to sound like a student leader (earnest, organized) but mature enough for the Dean to respect.
      *   Avoid overly academic jargon, but show political thinking.
      *   Ensure the "plain speech" requirement regarding sortition is met.

  8.  **Review against Constraints:**
      *   *Recommendation stated?* Yes (Option 3).
      *   *Question 1 settled?* Yes (Equal power).
      *   *Question 2 settled?* Yes (Positive improvement).
      *   *Opt-out bias addressed?* Yes.
      *   *Strongest counter-argument included?* Yes.
      *   *Format:* Memo.

  9.  **Self-Correction/Polish during drafting:**
      *   *Initial thought:* Maybe argue for full sortition? *Correction:* No, the prompt implies a split committee. Hybrid is the compromise that usually wins in student gov. It's safer to recommend.
      *   *Check:* Did I answer the specific question about spending authority? *Adjustment:* Make sure to explicitly mention "spending authority" in the power section.
      *   *Check:* Did I answer if it's a stopgap or improvement? *Adjustment:* Use those exact words or clear equivalents.
      *   *Tone Check:* Ensure I don't sound arrogant. Use "we" and "our."

  10. **Final Polish:** Check formatting and clarity. (Proceeds to generate output).

  *(Self-Correction Note during final review)*: The prompt asks me to "settle two questions." As the Chair drafting a memo *before* the meeting, I am setting the agenda and stating my position to guide the vote. I need to be decisive. I will frame these as my conclusions based on prior analysis, inviting debate but providing a clear direction.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee Members
  **FROM:** [Your Name], Committee Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Student Council Selection Model

  **Purpose**
  This memo outlines my recommendation for the selection model we will present to the Dean of Students. As discussed, our current election system is functionally broken: three years of uncontested slates, 12 percent turnout, and a recurring monopoly by a single social cohort. The Dean has authorized funding for structural changes, giving us a rare opportunity to reset our governance.

  **Recommendation**
  I recommend we adopt **Option 3: The Hybrid Model**.
  Under this model, ten seats are filled by lot (sortition) from the general student body, and five seats are filled by at-large election.

  This approach balances the need for broad representation with the need for accountable leadership. It disrupts the current clique without abandoning democratic accountability entirely. Below, I address the two substantive questions dividing our committee to clarify my position before Thursday's vote.

  **1. Authority and Power Distribution**
  *Question: Should the five elected members retain sole spending authority, or do lottery members confer equal standing?*

  **Position: Lottery members must have equal authority, including spending approval.**

  If we relegate the ten lottered members to an advisory role while reserving real power for the five elected members, we create a two-tier council. This will guarantee resentment and disengagement. If we ask students to serve via lottery, we must trust them with the full responsibility of the office.

  The argument for restricting power rests on the fact that only elected members can be removed by voters. However, internal accountability mechanisms can mitigate this risk. We can draft bylaws requiring a supermajority for budget approval or implement a mid-term review process. Stripping half the council of voting power undermines the legitimacy of the sortition experiment. If they are council members, they must govern.

  **2. The Nature of Sortition**
  *Question: Is sortition a positive improvement or merely a stopgap for a failed election?*

  **Position: Sortition is a positive improvement, not a stopgap.**

  We must be plain about this: elections prioritize the loud, the connected, and the privileged. Our current "debate team clique" is the natural result of an electoral system that rewards campaigning skills over representative diversity. Sortition changes the source of legitimacy from "consent of the motivated" to "representation of the whole."

  *Addressing the Opt-Out Bias:*
  A valid concern is that students who would normally run (the engaged elite) will opt out of the lottery, leaving the pool to those less interested. This could reproduce the current pattern without the veneer of an election. However, even with opt-outs, the lottery pool is statistically larger and more diverse than the current candidate pool. It forces open the door to students who would never campaign but would serve if asked. It is an upgrade in representation, not just a patch for low turnout.

  **The Strongest Counter-Argument**
  Before Thursday, please consider the strongest reason to vote against this recommendation.

  **The Competence and Engagement Risk:**
  The most compelling argument against Option 3 is that sortition selects for apathy. Students who did not choose to run may not care enough to do the work. We risk filling ten seats with students who view the council as a burden rather than a service, leading to quorum issues, uninformed voting on complex budget items, and high attrition. If the lottered members disengage, the five elected members will effectively rule by default anyway, rendering the reform cosmetic.

  **Next Steps**
  We will vote on this recommendation at Thursday's meeting. My goal is to present a unified proposal to the Dean. Please review these points and come prepared to discuss whether the benefit of representation outweighs the risk of disengagement.

  See you Thursday.
