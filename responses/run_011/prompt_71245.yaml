      *   **Task 1:** Describe the scenario (one paragraph).
      *   **Task 2:** Analyze candidate bearers of responsibility (Engineers, Certifiers, Institution, Operator, System) and explain why blame/liability *fails* (not just diluted).
      *   **Task 3:** Identify the single feature doing the work and explain the counterfactual (what if removed?).
      *   **Task 4:** Close with the strongest objection from a theorist who denies gaps (distributed responsibility/role responsibility) and honestly assess if the case earns the verdict or assumes it.

  2.  **Drafting the Scenario:**
