      *   *Counterfactual:* If the specific risk were foreseeable (e.g., they knew *that* pipe was weak), the City is liable for not fixing it. If the aggregate risk was hidden, it's fraud. The gap exists only because the risk is known *generically* but unknown *specifically*, and the policy accepts the generic risk.

  5.  **Formulating the Objection:**
      *   *Theorist:* Someone like Dan-Cohen or a proponent of "Role Responsibility" or "Distributed Moral Responsibility."
