      *   *The "Gap" Source:* Not opacity, but *statistical displacement*. The system optimizes for the *population* risk, accepting a known, quantified, but unassignable individual risk to achieve a net reduction in total harm. Everyone knows this trade-off exists, but no one intends the specific death.
      *   *Refining for Constraints:* The prompt asks for the gap to come from the *structure of deployment*, not opacity. The system is interpretable. The decision was rational.
