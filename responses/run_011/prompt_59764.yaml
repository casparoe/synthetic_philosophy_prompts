      *   *Headline:* "The Philosopher Who Thinks Your Consciousness Is an Illusion" is the standard pop-sci hook. It's technically wrong but catchy. If the columnist has political capital, spend it. Better: "The Philosopher Who Says Your Inner Theater Is an Illusion."

  7.  **Final Polish:** Ensure American spelling (color, center, etc.). Keep it tight. No citations.

