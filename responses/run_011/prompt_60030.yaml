answer: |-
  **The Scenario**

  The Lower Valley Water District must decide between two capital projects: Option Alpha, a new upstream reservoir based on regional hydrological models, or Option Beta, a distributed network of cisterns and pipe replacements based on localized leakage audits. The fact of the matter is fixed: due to an uncharted subterranean fissure known only through generations of fragmented farmer observation and recent anomalous well-drilling reports, Option Beta will secure 20% more water at half the cost, while Option Alpha will suffer catastrophic seepage. The District's voters face a binary choice. In Arm A, all registered residents vote. In Arm B, the franchise is restricted to residents who pass the District's Competence Certification, a rigorous examination of hydrology, civil engineering, and cost-benefit analysis administered by the state. The Certification is valid: across the thousands of technical decisions the District makes over the next decade regarding chemical treatment, pressure regulation, and routine maintenance, Certified voters are individually 15% more likely to choose the optimal policy than the general population. There is no differential turnout, no campaign spending, and no self-interest; all voters seek to maximize water security. The Certified voters share a professional paradigm derived from the study materials required to pass the Certification, which emphasizes standard geological models over anecdotal field reports. The uncertified residents possess no theoretical training but hold the fragmented, tacit observations of the fissure's effects on their specific properties, knowledge that is experiential and non-codifiable.

  ***

  **The Demonstration**

  **1. Toy Model**
  Let $N_A = 10,000$ (Universal) and $N_B = 1,000$ (Screened).
  Let $p$ denote the probability an individual voter identifies the correct option (Beta).
  *   **Arm A (Universal):** Individual accuracy $p_A = 0.55$. Errors are independent ($\rho_A = 0$). The 0.55 accuracy derives from the aggregation of distributed local signals; while no single resident knows the whole truth, the noise cancels, and the weak signal aggregates. By the Condorcet Jury Theorem (CJT), the probability the majority is correct $P(M_A) \approx 1.0$.
  *   **Arm B (Screened):** Global individual accuracy (across decade) $p_{global} = 0.70$. However, on *this* decision, the shared training induces error correlation. Let individual accuracy on this decision be $p_B = 0.60$ (still better than chance individually, maintaining the competence premise). However, the correlation coefficient of errors is $\rho_B = 0.5$. This reflects the "professional blind spot": the standard models (tested on the exam) systematically underestimate the fissure risk.
  *   **Result:** In Arm A, independence ensures the law of large numbers drives the majority verdict to certainty. In Arm B, the high correlation reduces the *effective* sample size. Using a simplified effective $N$ approximation ($N_{eff} \approx N / (1 + (N-1)\rho)$), $N_{eff, B} \approx 1,000 / 500 \approx 2$. With an effective electorate of 2 voters at $p=0.60$, the probability the majority is correct $P(M_B) \approx 0.60$.
  *   **Comparison:** $P(M_A) \approx 1.0 > P(M_B) \approx 0.60$. The screened electorate fails despite higher individual competence.

  **2. Condorcet Jury Theorem Analysis**
  The CJT relies on two conditions: (1) individual competence $p > 0.5$, and (2) statistical independence of votes. Both arms satisfy condition (1). Arm A satisfies condition (2); Arm B violates it. The standard appeal to epistocracy assumes that screening increases $p$ without altering $\rho$. Here, the screening mechanism (standardized testing on generalizable theory) inherently increases $\rho$ by selecting for voters who rely on the *same* epistemic frameworks. The theorem gets the sign wrong because it treats the Screened Group as a collection of independent experts, whereas they function as a single expert multiplied by 1,000. When the shared framework is mismatched to local reality, the group fails collectively, whereas the unscreened group's cognitive diversity insulates them against systematic model error.

  **3. Feature Identification and Removal Tests**
  The working feature is **correlated error induced by standardized epistemic homogeneity** clashing with **distributed tacit knowledge**.
  *   **Removal Test 1 (Independence):** If we hold the Screened Group's individual accuracy ($p_B = 0.60$) fixed but force their errors to be independent ($\rho_B = 0$), the CJT applies. $P(M_B)$ rises to $\approx 1.0$. The case collapses; the screened group wins. This confirms the failure is structural (correlation), not a lack of individual intelligence.
  *   **Removal Test 2 (Examinability):** If we make the local knowledge examinable (e.g., the fissure data is codified in the study guide) while holding correlation fixed, the Screened Group's individual accuracy rises to $p_B = 0.90$. Even with correlation, $P(M_B)$ becomes high enough to match Arm A. The case collapses. This confirms the failure relies on the knowledge being *uncertifiable* in the screening process. The case survives only when knowledge is both distributed/tacit and the screen selects for theoretical homogeneity.

  **4. Structural vs. Special Case**
  This is a **structural** case. Any screening mechanism that selects for *generalizable* competence (theory, models, standard practices) inevitably creates a voter pool with higher epistemic homogeneity than the general population. On the subclass of decisions where the optimal choice depends on *local, non-codifiable, or novel* information (the "Hayekian" subclass), the screened group's correlation will systematically outweigh their individual accuracy advantage. The global advantage is lost altogether if the frequency of "local knowledge" decisions exceeds the threshold where the accumulated error cost outweighs the efficiency gains from technical decisions. Given that high-stakes political decisions often turn on unique local implementations rather than routine technical maintenance, this subclass is likely large enough to negate the instrumental claim.

  **5. Epistocrat's Best Replies**
  *   **Reply 1: "The Test Was Flawed."** The epistocrat argues a better test could include local knowledge modules.
      *   *Concession:* This concedes that "competence" cannot be defined independently of the specific decision context. If the test must be rewritten for every local contingency, the administrative cost negates the efficiency argument for epistocracy, and we return to the problem of in-principle untestable tacit knowledge.
  *   **Reply 2: "Mixed Assembly."** The epistocrat suggests a bicameral system: one screened house for technical issues, one universal house for local value/knowledge issues.
      *   *Concession:* This surrenders the claim that epistocracy is *generally* superior. It admits that universal suffrage is instrumentally necessary for a specific, critical class of decisions, undermining the core argument for restricting the franchise.
  *   **Reply 3: "Rare Outlier."** The epistocrat argues this decision is a black swan; over the full decade, the screened group still yields better aggregate outcomes.
      *   *Concession:* This concedes that epistocracy increases *variance* and tail-risk. If the "outlier" decisions are high-stakes (e.g., catastrophic infrastructure failure), the expected utility calculation flips. The epistocrat must accept that avoiding catastrophic systematic error is more valuable than maximizing average technical efficiency.

  **6. Minimal Modification**
  To restore the advantage on this decision, the screening rule must be modified to **weight votes by competence *and* diversity of information source**, or equivalently, to disqualify voters whose errors are highly correlated (a "cognitive diversity" screen). However, the epistocrat cannot accept this without surrendering the reason for screening. The original justification for screening was the ability to objectively identify *individual* competence via examination. Identifying *correlation* or *diversity of knowledge source* requires omniscient knowledge of the decision landscape (knowing in advance which knowledge will be relevant) or access to the very tacit knowledge the test was meant to substitute. To implement this modification is to admit that we cannot identify the "knowers" without already knowing the truth, which renders the screening mechanism redundant.
