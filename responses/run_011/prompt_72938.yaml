prompt: |-
  I'm running a 50 minute session for about 18 ward leads and infection-control nurses at our hospital. Smart, practical, one stats course each — they can do sensitivity and specificity and a simple expected value on the back of an envelope, but there's no Jensen's inequality and no measure theory in the room and I'm not going to pretend otherwise. Whiteboard only, no slides. What I want them to leave holding is Good's result on the value of information: that evidence which costs you nothing, and which you're then going to act on rationally, can't leave you worse off in expectation — and, more usefully for them, exactly which assumptions are doing that work, and the fact that the sign can flip without the evidence getting any more expensive.

  Don't explain the theorem to me. Plan how I explain it. Specifically:

  - the order the pieces have to go in and what each one depends on, including what breaks if I do the natural thing and state the result up front. My hunch is that the contrast between deciding now and committing now to a plan you'll execute after you've seen the result has to be fully in place before a single probability gets written on the board — tell me if that's wrong and why.
  - one example to carry the whole session. Not an urn, not a screening test, not anything they'll pattern-match to a lecture they've already sat through. It needs a single knob I can turn in front of them so the value of the free information goes positive → zero → negative with literally nothing else changed. Tell me what the example has to contain, what it has to pointedly not contain, and what the knob is.
  - the misconception map, split into the ones they walk in with (I'd bet on 'information is only worth having if it changes your decision', and 'the value is what you'd pay for it', and some flavour of 'more data can't hurt') and the ones they'll construct during the session as a direct consequence of how I present it. For each: the exact moment in the sequence where it gets headed off. Some of these I think need defusing before I've said anything at all, not after.
  - the whiteboard moment where the inequality stops looking like a sleight of hand. Two branches and no algebra if you can possibly manage it.
  - one closing question that separates someone who actually got it from someone who's memorised 'free information is free, therefore good' — plus what the plausible-but-wrong answer sounds like, so I can hear it coming.
  - what I should refuse to cover, and refuse out loud. I assume that means ambiguity versus risk, influence diagrams, information cascades, and the iterative value-of-clairvoyance calculation. Tell me what else is a trap in a room this size in this much time.

  One complication you have to design around: about half the room has a live stake in whether the new sepsis dashboard's flags get written straight into the patient record or held in a seperate channel, and they know that I know. Whatever sequence you give me has to survive that argument instead of getting hijacked by it — and it mustn't leave them thinking the theorem settles that policy question, because it doesn't, and I need to know why not before they ask.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** 18 ward leads and infection-control nurses. Smart, practical, know basic stats (sens/spec, expected value), no advanced math (no measure theory/Jensen's).
      *   **Time:** 50 minutes.
      *   **Format:** Whiteboard only, no slides.
      *   **Goal:** Teach Good's Theorem on the Value of Information (VOI): Free evidence + rational action $\ge$ 0 expected loss. Crucially, show *which assumptions* make this work and how the sign flips if they break (specifically the "rational action" part).
      *   **Constraints:**
          *   Do not explain the theorem to me; plan *how* to explain it.
          *   Order of operations matters (don't state result up front).
          *   One specific example (no urns, no screening tests) with a "knob" to toggle VOI from positive $\to$ zero $\to$ negative.
          *   Misconception map (pre-existing and emergent).
          *   Whiteboard visualization (two branches, minimal algebra).
          *   Closing question (discriminates understanding).
          *   Refusals (what *not* to cover).
          *   **Complication:** Half the room cares about a specific live policy issue (Sepsis dashboard flags: integrated vs. separate channel). The session must survive this without implying the theorem solves that policy debate.

  2.  **Deconstruct Good's Theorem (for this audience):**
      *   *Core Idea:* $E[U|Info] \ge E[U|No Info]$.
      *   *Conditions:* Information is free (costless), Information is relevant (updates probabilities), Action is optimal *after* seeing info.
      *   *The Twist:* The value goes negative if you are *forced* to act on the info when it's not optimal to do so, or if the info isn't actually free (opportunity cost/distraction), or if the "rational action" assumption is violated (e.g., protocol mandates action regardless of posterior).
      *   *The "Knob":* The constraint on action. If I *can* choose to ignore the info, VOI $\ge$ 0. If I *must* act on the info (even if it suggests inaction), VOI can be $< 0$.

  3.  **Develop the Example:**
      *   *Requirement:* Not an urn, not a screening test. Needs a "knob" for Positive $\to$ Zero $\to$ Negative VOI.
      *   *Idea:* A "Check before you act" protocol vs. "Act immediately" protocol.
      *   *Scenario:* A high-risk medication administration or a isolation decision. Let's go with **Isolation Precautions for a Ambiguous Symptom**.
      *   *Why:* Nurses know this. It involves resource cost (isolation room/staff time) vs. risk cost (spread).
      *   *The "Test":* A rapid visual check or a quick chat with the patient (costs time/effort, but let's assume "free" for the sake of the theorem, or better, a *pager alert*).
      *   *The "Knob":* The *mandate* to act on the alert.
          *   State 1 (Positive VOI): Alert comes, you *choose* whether to isolate based on alert + prior.
          *   State 2 (Zero VOI): Alert gives no new info (noise).
          *   State 3 (Negative VOI): Alert comes, protocol says you *must* isolate if alert fires, even if your clinical judgment says "false alarm, don't isolate."
      *   *Refinement:* To make it truly "free info" turning negative, the cost must come from the *constraint on action*, not the cost of the test.
      *   *Better Example:* **The "Second Sign-off" Rule.**
          *   Decision: Discharge a patient vs. Keep overnight.
          *   Info: A senior nurse's quick glance (free, instant).
          *   Knob: Are you *allowed* to override the senior nurse's glance?
          *   If yes (Rational Action): You take the glance, if they say "keep," you check if that makes sense. If it doesn't, you discharge anyway. VOI $\ge$ 0.
          *   If no (Forced Action): Protocol says "If Senior says Keep, you Keep." Even if you know the Senior is tired/wrong. VOI can be $< 0$.
      *   *Wait, simpler:* **The Alarm System.**
          *   Decision: Rush to Room X vs. Stay at Desk.
          *   Info: Monitor beeps (Free).
          *   Knob: Protocol on responding.
          *   Case A (Rational): Beep sounds. You check context. If it looks like artifact, you ignore. (VOI $\ge$ 0).
          *   Case B (Forced): Policy says "Every beep requires physical check." (VOI $< 0$ because of false positives causing wasted time/risk elsewhere).
      *   *Selection:* **The Monitor Alarm.** It's universal, high stakes, and the "policy vs. judgment" tension is palpable.

  4.  **Sequence the Session (50 mins):**
      *   *0-5 min:* Setup & Misconception Defusing. Do not state theorem. Define the decision.
      *   *5-15 min:* The "Free Choice" Scenario (VOI $\ge$ 0). Build the tree.
      *   *15-25 min:* The "Forced Action" Scenario (VOI $< 0$). Turn the knob.
      *   *25-35 min:* The Whiteboard Inequality (Visual proof).
      *   *35-45 min:* The Sepsis Dashboard Elephant in the Room (Application & Limitations).
      *   *45-50 min:* Closing Question & Wrap.

  5.  **Address the Sepsis Dashboard Complication:**
      *   *The Trap:* If I prove free info is good, they might argue "Dashboard flags are free info, so we must integrate them." If I prove free info can be bad, they might argue "Dashboard flags are dangerous, keep them separate."
      *   *The Reality:* The theorem assumes *rational action*. The policy debate is about *whether the flag mandates action*.
      *   *Strategy:* Explicitly decouple "Information Value" from "Protocol Design." The theorem evaluates the *info*, the policy evaluates the *constraint*. I must refuse to let the theorem decide the policy. The policy decides if the theorem applies.

  6.  **Drafting the Plan - Section by Section:**

      *   **Order of Pieces:** Start with the *decision*, not the math. If I state the theorem first, they'll treat it as dogma. They need to feel the *choice* first.
      *   **The Example:** Monitor Alarm.
          *   *Contains:* A binary decision (Go/Stay), a binary signal (Beep/Silent), a cost of action (Time/Effort), a cost of error (Patient Harm).
          *   *Does Not Contain:* Cost of the signal itself (must be free), ambiguity about the signal meaning (probabilities must be known/estimated).
          *   *The Knob:* **The Mandate.** Can you ignore the beep?
      *   **Misconception Map:**
          *   *Pre-existing:* "More data can't hurt." (Defuse at start by asking "Have you ever been distracted by a beep?")
          *   *Pre-existing:* "Value = Price." (Defuse by defining value as 'outcome improvement'.)
          *   *Emergent:* "So we should ignore protocols." (Defuse during the Sepsis discussion.)
      *   **Whiteboard Moment:** Two trees side-by-side.
          *   Tree 1 (No Info): Decision Node $\to$ Outcomes.
          *   Tree 2 (Info): Info Node $\to$ Decision Node $\to$ Outcomes.
          *   Show that Tree 2 contains Tree 1 as a subset of options *if* you can ignore the info.
      *   **Closing Question:** Needs to test the "Rational Action" assumption.
      *   **Refusals:** Don't talk about *getting* the info (sensitivity/specificity calculation). Don't talk about *cost* of info (it's free by definition here). Don't solve the Sepsis policy.

  7.  **Refining the "Knob" for Positive $\to$ Zero $\to$ Negative:**
      *   *Positive:* Beep happens. You *may* investigate. You investigate only if probability of crisis > threshold.
      *   *Zero:* Beep happens. It tells you nothing (probabilities don't update). You do same as no info.
      *   *Negative:* Beep happens. Protocol *requires* investigation. You investigate even when probability of crisis is low. Expected loss increases due to wasted resources/opportunity cost.
      *   *Wait, Good's Theorem strictly says VOI $\ge$ 0.* To show negative, I must show where the *assumptions break*. The prompt asks for "the fact that the sign can flip without the evidence getting any more expensive." This implies showing the *violation* of the theorem's conditions leads to negative value. This is crucial. I am teaching them *why* the theorem holds by showing what happens when you break the rules.

  8.  **Handling the Sepsis Issue:**
      *   I need to make sure they understand the theorem applies to *agents who can choose*. If the EHR *forces* a workflow, the agent is no longer rational in the economic sense; they are constrained.
      *   I must explicitly state: "This theorem tells you the value of a flag *given* you can use it wisely. It does not tell you if your hospital policy *allows* you to use it wisely."

  9.  **Review against Constraints:**
      *   *Whiteboard only:* Yes, trees.
      *   *No slides:* Yes.
      *   *50 mins:* Tight. Need to keep the math minimal.
      *   *Audience:* Nurses/Leads. Keep clinical language.
      *   *Sepsis:* Address without solving.

  10. **Final Polish:**
      *   Ensure the "Knob" is clearly defined as *Agency*, not *Accuracy*.
      *   Ensure the "Refusals" list is punchy.
      *   Ensure the Closing Question is a trap for the rote learners.

  *(Self-Correction during drafting)*: I initially thought about making the "Negative" case about the cost of the test. But the prompt says "evidence which costs you nothing... sign can flip without evidence getting any more expensive." So the cost must come from the *action constraint*. I need to be very clear that Good's Theorem *guarantees* non-negative value *only if* you retain the right to ignore the info. If policy removes that right, the theorem doesn't apply, and value goes negative. This is the key insight for the Sepsis debate.

  Let's structure the response.
  1. **Sequence & Dependencies:** Why decision before math.
  2. **The Example:** The Alarm & The Mandate.
  3. **Misconception Map:** Pre & Emergent.
  4. **Whiteboard Moment:** The "Option to Ignore" visualization.
  5. **Closing Question:** The "Mandated Action" trap.
  6. **Refusals:** What to cut.
  7. **The Sepsis Elephant:** How to handle the room's tension.

  *Wait, one check on the "Negative" claim.* Good's Theorem *mathematically proves* VOI is non-negative under specific assumptions. It *cannot* be negative under those assumptions. The prompt asks me to show "the fact that the sign can flip without the evidence getting any more expensive." This means I must demonstrate what happens when *one of the assumptions is violated* (specifically the 'act rationally' assumption). I need to be precise in language: "The theorem says X. If you see Y (negative value), it means you violated assumption Z."

  Okay, ready to write.
answer: |-
  Here is the session plan. It is designed to be tight, whiteboard-driven, and resilient to the political tension in the room.

  ### 1. Sequence and Dependencies
  **Do not state the theorem up front.** If you write "Value of Information $\ge$ 0" on the board in minute one, they will treat it as a policy directive rather than a mathematical boundary condition. They will stop listening for the assumptions and start arguing about the sepsis dashboard.

  **The Order:**
  1.  **The Decision (Minute 0-5):** Define a binary choice with asymmetric costs. No probabilities yet.
  2.  **The Signal (Minute 5-15):** Introduce the "free" information. Establish that it updates beliefs (Bayes rule, intuitively).
  3.  **The Agency Knob (Minute 15-25):** This is the critical pivot. You must establish the *right to ignore* the signal before you calculate value.
  4.  **The Calculation (Minute 25-35):** Compare Expected Loss (No Info) vs. Expected Loss (Info + Choice).
  5.  **The Violation (Minute 35-40):** Show what happens when you remove the *right to ignore*. This is where the value flips negative.
  6.  **The Application (Minute 40-50):** Map this back to the Sepsis Dashboard without solving the policy.

  **Why this order?**
  Good's result relies entirely on the fact that seeing the evidence gives you *more options* (Act A, Act B, or Act C based on evidence) than not seeing it (Act A or Act B). If you don't establish that the *option set expands* before you do the math, the inequality looks like magic. If you establish the option set first, the inequality becomes a tautology: "Having more choices cannot be worse than having fewer choices, provided you choose wisely."

  ### 2. The Example: The Telemetry Alarm
  **The Scenario:** A nurse at a central station monitors 20 patients. A specific patient's heart rate monitor beeps (High HR).
  **The Decision:** **Go to Room** (costs 10 mins, leaves desk uncovered) vs. **Stay at Desk** (risk patient deteriorates).
  **The Costs:**
  *   False Alarm + Go: Wasted 10 mins (Cost = 1 unit).
  *   True Alarm + Stay: Patient Harm (Cost = 100 units).
  *   Correct decisions: Cost = 0.

  **What it contains:**
  *   **Asymmetric Loss:** This is vital. If costs were symmetric, the threshold for action would be 50/50, and the nuance gets lost. Nurses understand that missing a crash is worse than a wild goose chase.
  *   **Base Rate:** Most beeps are false (artifact, movement).
  *   **The "Free" Info:** The beep costs nothing to receive.

  **What it pointedly does not contain:**
  *   **Cost of the test:** The beep is free. If you introduce a cost to hear the beep, you muddy the "Value of Information" with "Cost of Acquisition."
  *   **Uncertainty about accuracy:** Assume for the session that everyone agrees on the sensitivity/specificity of the alarm. Don't let them debate the machine's specs.

  **The Knob: The Mandate.**
  *   **Position A (Positive VOI):** The beep sounds. You *may* go, or you *may* check the waveform and stay. You act optimally based on the updated probability.
  *   **Position B (Zero VOI):** The beep sounds. It provides no new information (probability doesn't change). You do exactly what you would have done anyway.
  *   **Position C (Negative VOI):** The beep sounds. **Protocol mandates:** "If alarm sounds, nurse must physically verify within 2 minutes." You are *forced* to Go, even if the waveform clearly shows artifact and your rational judgment says "Stay."

  **Why this knob works:** It isolates the "Rational Action" assumption of Good's Theorem. The evidence hasn't changed. The cost of the evidence hasn't changed. Only your *freedom to act rationally on it* has changed.

  ### 3. The Misconception Map

  | Misconception | Type | When to Defuse | How to Defuse |
  | :--- | :--- | :--- | :--- |
  | **"Information is only worth having if it changes your decision."** | Pre-existing | **Minute 5** (Before math) | Ask: "If the alarm beeps, and you were already planning to go, did the alarm hurt you?" (No). "Did it help?" (It confirmed you). Value $\ge$ 0 even if action doesn't change. |
  | **"Value is what you'd pay for it."** | Pre-existing | **Minute 0** (Setup) | Define Value explicitly as **"Reduction in Expected Loss"**, not money. Write this on the top left of the board and circle it. |
  | **"More data can't hurt."** | Pre-existing | **Minute 0** (Setup) | Ask: "Raise hand if you've ever been delayed by an alert that turned out to be nothing." Acknowledge the pain immediately so they trust you. |
  | **"Therefore, we should ignore protocols."** | Emergent | **Minute 40** (Sepsis discussion) | Head this off by distinguishing *Mathematical Agency* from *Clinical Governance*. The theorem assumes you *can* choose; the hospital decides if you *should*. |
  | **"The theorem proves the dashboard is safe/dangerous."** | Emergent | **Minute 45** (Closing) | Explicitly state the theorem evaluates the *flag*, not the *workflow*. A safe flag in a forced workflow creates negative value. |

  ### 4. The Whiteboard Moment (Minute 25-35)
  Do not write algebra. Draw two decision trees side-by-side.

  **Tree 1 (No Info):**
  *   Square (Decision): Go vs. Stay.
  *   Circles (Chance): Crisis vs. No Crisis.
  *   *Label the best expected outcome here $E_1$.*

  **Tree 2 (Info + Choice):**
  *   Circle (Info): Beep vs. Silent.
  *   Square (Decision): **Inside each branch**, you get to choose Go vs. Stay again.
  *   *Label the best expected outcome here $E_2$.*

  **The Visual Proof:**
  Point to Tree 2. Circle the Decision Squares.
  Say: *"In Tree 1, you pick one plan for all worlds. In Tree 2, you pick a plan for the 'Beep' world and a different plan for the 'Silent' world."*
  *"Tree 2 contains every option Tree 1 has, plus the ability to split them up."*
  *"Can having more options ever make you worse off, if you are allowed to pick the best one?"*
  **Write:** $E_2 \ge E_1$.

  **The Flip:**
  Draw a red box around the Decision Squares in Tree 2.
  Say: *"What if Hospital Policy locks this square? You *must* Go on Beep."*
  *"Now Tree 2 no longer contains all of Tree 1's options. You have deleted the 'Ignore Beep' option."*
  *"Now $E_2$ can be less than $E_1$."*

  ### 5. Closing Question
  **The Question:**
  "We have a new sepsis flag. It is free. It is statistically valid. Under Good's Theorem, when does installing this flag *guarantee* a reduction in patient harm?"

  **The Plausible-But-Wrong Answer:**
  "When the flag is accurate." or "When the nurses trust the flag."
  *(This indicates they think the value lies in the **signal quality**.)*

  **The Right Answer:**
  "When the nurses are **allowed to ignore it**." or "When the workflow permits **rational action** based on the flag."
  *(This indicates they understand the value lies in the **decision rights**.)*

  **Why this separates them:** The rote learner memorized "Info = Good." The understander knows "Info + Constraint = Risk."

  ### 6. What to Refuse to Cover
  You must refuse these out loud to protect the 50-minute limit and the mathematical integrity.

  1.  **Ambiguity vs. Risk:** "We are assuming we know the probabilities of the alarm being true. I am not teaching you how to estimate those today."
  2.  **Iterative Value:** "We are looking at one decision, one flag. I am not calculating the value of a second opinion after the first flag."
  3.  **Information Cascades:** "I am not discussing what happens when Nurse A sees the flag and Nurse B sees Nurse A's reaction."
  4.  **The Cost of Acquisition:** "I defined the info as free. If your dashboard slows down the computer, that's a cost of acquisition, not value of information. That's an IT ticket, not a theorem."
  5.  **Solving the Sepsis Policy:** "This theorem tells you the *conditions* under which the flag is safe. It does not tell you if your specific ward has the staffing to meet those conditions. That is a resource question, not a math question."

  ### 7. Designing Around the Sepsis Elephant
  Half the room wants the flags integrated (pro-dashboard); half wants them separate (anti-distraction). They know you know.

  **The Trap:**
  If you conclude "Free info is always good," the Pro-Dashboard team wins.
  If you conclude "Free info can be bad," the Anti-Dashboard team wins.
  **Both will be wrong,** because they are using the theorem to settle a resource/policy debate.

  **The Strategy:**
  Use the **"Mandate Knob"** (Section 2) to neutralize the argument.
  *   **Minute 40 Script:** "I know half of you want the sepsis flags in the main record, and half want them in a separate list. You might be tempted to use what I just showed you to win that argument. Don't."
  *   **The Reason:** "Good's Theorem assumes you have the **agency** to act rationally. If you integrate the flag, but your staffing levels mean you *must* investigate every flag to avoid liability, you have turned the 'Choice' square into a 'Forced' square. You have broken the theorem's assumptions."
  *   **The Takeaway:** "The theorem doesn't tell you where to put the flag. It tells you that **if** you put the flag in the main record, you **must** protect the nurse's right to document 'False Alarm' without penalty. If you don't protect that right, the math says you will increase harm."

  **Why this works:** It doesn't solve the policy (which you can't do). It shifts the debate from "Where does the flag live?" to "What workflow protects the nurse's agency?" This is a question the Infection Control Nurses can actually answer, and it prevents the theorem from being weaponized by either faction.

  **Final Check:**
  *   Does this fit 50 mins? Yes, if you keep the tree drawing simple.
  *   Does it avoid measure theory? Yes, it uses optionality.
  *   Does it handle the sepsis tension? Yes, by making agency the prerequisite for safety.
  *   Does it meet the prompt's requirement on the "sign flip"? Yes, via the Mandate Knob.

  **One final whiteboard tip:**
  When you draw the "Forced Action" tree, literally draw a padlock on the decision node. It's a visual anchor they will remember when they go back to the ward.
