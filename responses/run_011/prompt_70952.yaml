  ### The Single Change for Maximum Consistency

  **Drop the reliance on Worst-Case Hardness in Claim 7.**

  This is the highest-leverage move. Claim 7 is the only item that actively weaponizes the complexity theory in a way that contradicts your own defense of cognition (8).

  *   **Current 7:** Intractability (NP-hard) $\rightarrow$ Revise Norm.
  *   **Proposed 7:** Ecological Structure (per 8) $\rightarrow$ Revise Norm.

  **Why this buys the most:**
  1.  **Resolves 7 vs 8:** It makes 8 the *premise* for 7, rather than the *underminer* of 7. You argue: "Because the world is structured (8), we should use heuristics (7)," rather than "Because inference is hard (7), we should use heuristics (ignoring 8)."
  2.  **Resolves 1 vs 8:** If you stop treating Worst-Case Hardness as the normative killer in 7, the tension between 1's P-time bound and 8's rejection of worst-case becomes less critical. 1 can remain a rough "feasibility" bound without carrying the load of killing Bayesianism.
  3.  **Preserves the Heterodoxy:** You still get to reject Bayesian coherence as the fundamental norm, but you do so on stronger, more positive grounds (ecological fit) rather than negative grounds (impossibility), which is more defensible given 8.

  **The Cost:** You can no longer say "Bayesianism is computationally impossible." You must say "Bayesianism is computationally wasteful and ecologically misaligned." This is a softer target, but it is a consistent one.

