  Here are the two rules she is actually running, distilled from your eight locked verdicts:

  *   **Rule A (The Backward Induction Axiom):** In any finite game with a known structure, rational play is determined by the final node. You reason backward from the end. If the last move is to Take/Defect/Fight, the previous move must anticipate that, and so on to the start. This covers Verdicts 1, 2, 4, 5, and 6.
      *   *Note on Verdict 6 (Monopolist):* This is the Chain Store Paradox. Vera sides with Selten. Fighting the first entrant is irrational because at the *last* entrant, fighting is costly and yields no future benefit. Therefore, the threat is empty at the start.
