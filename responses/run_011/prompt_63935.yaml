      *(Self-Correction during drafting)*: I need to be careful with Move 5/6. Rousseau *does* single out actors for moral degradation specifically, distinct from other professions. He thinks the *nature* of the acting role (pretending to feel) is unique. Elsie's comparison to a lawyer is good, but Rousseau would say a lawyer argues a case, not that he *feels* a passion he doesn't have. I need to make sure I don't just say "Elsie wins" without explaining why Rousseau might resist that comparison.

