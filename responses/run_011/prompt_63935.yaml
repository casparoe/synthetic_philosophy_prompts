      *   **User:** Self-taught philosophy enthusiast, works in a hardware shop, left school at 16. Reads old philosophy books found at library sales.
      *   **Context:** Read Rousseau's *Letter to d'Alembert on the Theatre* (1758). Lent it to friends (Ken and Elsie) involved in an amateur drama group. They argued about it after rehearsal. User took notes on 6 specific points/exchanges.
      *   **Task:** Act as a referee. Go through the 6 moves point-by-point. Determine who is "right" (closer to Rousseau's actual argument/logically stronger) at each stage.
      *   **Constraints/Extras:**
          *   Flag misrepresentations of Rousseau (since they argued from memory/User skimmed).
          *   Identify if any part of Rousseau's argument survives Elsie's critiques or if it's "dead."
