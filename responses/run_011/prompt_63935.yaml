      *   *Move 2:* Elsie is logically sharp (reductio), but misses Rousseau's nuance on *public spectacle* vs. *private art*. Rousseau admits novels exist but worries about the *theatre* specifically as a social institution. The hypocrisy charge is valid but Rousseau had an answer (youthful error/distinction of medium).
      *   *Move 3:* Ken is strongest here. The *Fête* vs. Theatre distinction is the heart of Rousseau's positive vision.
      *   *Move 4:* Elsie lands a heavy blow. If the amateur group fits the *Fête* criteria, Rousseau should like it. Her point about the *Fête* also being engineered is a modern critique Rousseau didn't fully solve.
      *   *Move 5:* Ken is right that Rousseau attacks actors, but calling it the "deepest bit" is debatable. It's part of the corruption of the city.
