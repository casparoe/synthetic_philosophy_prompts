      *   *Misrepresentations:* Ken simplifies the "actor" point. Elsie simplifies the "hypocrisy" point (Rousseau addressed it). Both miss the *political* context (Geneva's small republic vs. Paris).
      *   *Is it dead?* No. It survives as a critique of *passive consumption* and *commodification of emotion*. It's less about "theatre is bad" and more about "this kind of social relation is bad."

  5.  **Refining the Tone:**
      *   Avoid saying "Rousseau says X." Say "Rousseau argues X, but..."
      *   Make sure to praise the user's note-taking.
