      *   **Move 6 (Elsie):** If acting for money is the sin, it indicts priests, teachers, lawyers. It stops being a theory of theatre.
          *   *Rousseau Check:* Rousseau might actually accept this! He was skeptical of many professions. But usually, he distinguishes "representation" in theatre from "function" in law/religion.
          *   *Verdict:* Elsie forces a *reductio*. If Ken/Rousseau says "acting is lying for money," does that kill all service roles?

  3.  **Synthesize the "Referee" Judgment:**

      *   *Tone:* Needs to be encouraging. The user is doing serious philosophical engagement without formal training. Validate that.
      *   *Structure:* Go 1-6. Then address the "Misrepresentation" check. Then address the "Is it dead?" question.
      *   *Key Rousseau Text:* *Lettre à d'Alembert sur les spectacles* (1758).
      *   *Key Concepts:* *Amour-propre* (vanity/social comparison), Authenticity, Community vs. Isolation, The Festival (*Fête*).

  4.  **Drafting the Content (Iterative refinement):**

