  2.  **Deconstruct the 6 Moves (Ken vs. Elsie):**

      *   **Move 1 (Ken):** Theatre turns pity into a ticket stub. We cry at fake tragedy, feel virtuous, then ignore real suffering.
          *   *Rousseau Check:* This is a core Rousseau argument (*Letter to d'Alembert*). He argues theatre isolates us in private emotions rather than prompting public action.
          *   *Elsie's Counter (in Move 2):* Reductio ad absurdum (applies to novels, songs, friends). Accusation of hypocrisy (Rousseau wrote *Narcisse* and *Julie*).
          *   *Verdict:* Ken is closer to Rousseau's text here. Elsie's counter is strong logically but needs to be checked against Rousseau's specific distinctions.

      *   **Move 2 (Elsie):** Reductio ad absurdum (sad songs/novels/friends) + Hypocrisy charge (Rousseau wrote plays/novels).
          *   *Rousseau Check:* Rousseau *did* write *Narcisse* (play) and *Julie* (novel). He addressed this. He distinguished between private reading/writing and public spectacle.
          *   *Verdict:* Elsie scores a hit on hypocrisy/consistency, but misses Rousseau's distinction between *spectacle* and *narrative*.

      *   **Move 3 (Ken):** It's about the *setup*. Paying, sitting still, one-way traffic. Alternative: Village fete, open-air dance (everyone participates).
          *   *Rousseau Check:* This is *exactly* Rousseau's positive proposal. He contrasts the theatre with the *fête* (public gathering where people are the spectacle to each other).
          *   *Verdict:* Ken is very strong here. This is pure Rousseau.

      *   **Move 4 (Elsie):** Your amateur group fits the "fete" model (unpaid, charity, community). Also, fetes are still engineered spectacles.
          *   *Rousseau Check:* Rousseau would likely approve of the amateur/charity aspect but might still worry about the "stage/audience" divide. Elsie's point about fetes being engineered is a modern sociological critique (Benjamin? Debord?) that Rousseau didn't fully anticipate but is logically sound.
          *   *Verdict:* Elsie exposes a tension in Rousseau. If the *structure* is the problem, amateur theatre solves it. If *being moved* is the problem, fetes fail too.

      *   **Move 5 (Ken):** Deepest point: The Actor. Selling the self. Taking money to be someone else. Degrades the person.
