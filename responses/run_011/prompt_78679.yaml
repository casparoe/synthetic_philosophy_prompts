answer: |-
  ### Tier List: Deliberative Friction (Lowest to Highest)

  **Tier 1: The Clean Exit**
  **(v) Deutsch–Lockwood Many-Worlds: 0**
  Knowing R changes nothing because the contradiction is dissolved ontologically; Tim deliberates over killing a man who is, for all practical purposes, his grandfather, with no threat to his own existence or agency.

  **Tier 2: The Bad Luck Constraint**
  **(iv) Consistency/Coincidence: 3**
  Tim's ordinary reasoning remains intact, but he must incorporate a near-certainty of external interference (jammed guns, slips) into his probability assessments, making success practically impossible but agentially coherent.

  **Tier 3: The Compatibilist Squeeze**
  **(i) Lewis's Compossibility: 6**
  Tim retains the intrinsic ability to pull the trigger, but knowing the past is fixed forces him to intend an action he knows with certainty will not succeed, creating a tension between local capacity and global outcome.

  **Tier 4: The Logical Wall**
  **(iii) Sider's Autoinfanticide: 8**
  Because the resolution rests on the logical impossibility of self-defeat, Tim knows his success would entail a contradiction, making the intention to succeed rationally defective in a way that mere compossibility is not.

  **Tier 5: The Ability Denial**
  **(ii) Vihvelin's Dissent: 9**
  By denying Tim the relevant ability outright (no nearby success worlds), R tells Tim that his intention is akin to intending to jump to the moon, systematically undermining the formation of the attempt itself.

  **Tier 6: The Scenario Denial**
  **(vi) Chronology Protection & (vii) Quiet Fatalism: 10**
  Both views entail that the scenario described ("Tim standing over Grandfather") is nomologically or metaphysically impossible, so knowing R shatters Tim's epistemic grip on his own situation, rendering deliberation moot.

  ***

  ### Follow-Up 1: The Stranger Variation
  Your suspicion is correct: **(iii) and (iv) do swap places**, and the ordering shifts significantly for the genealogically sensitive views.

  If the target is a stranger whose life is not causally linked to Tim's existence, **(iii) Sider** drops to a **0**. Sider's resolution turns on the logical incoherence of *self*-defeat; if Tim isn't killing himself (or his ancestor), the logical constraint vanishes, and deliberation proceeds normally. **(iv) Coincidence**, however, stays at a **3** (or potentially rises to **5**). Most consistency theories posit a global constraint on the past *period*, not just the traveler's lineage; the gun still jams to preserve the historical record, so the friction of expected failure remains. This reveals that Sider's view is narrowly surgical (high friction only for paradox-generating acts), whereas Coincidence views impose a broad tax on agency in the past regardless of the target.

  ### Follow-Up 2: Is Low Friction a Virtue?
  **Defend the Rubric.** Your worry is that low friction merely rewards metaphysical reticence (saying less about why Tim fails). This is false. If friction tracked reticence, **Chronology Protection (vi)** would score low, as it simply denies the physics of the setup. Instead, it scores **10** because it makes Tim's perspective delusional. Conversely, **Deutsch–Lockwood (v)** is metaphysically extravagant (infinite branching worlds) yet scores **0** because it preserves the transparency of agency.

  Therefore, Deliberative Friction does not measure *ontological parsimony*; it measures **phenomenological cost**. It tracks how much of our ordinary self-conception as agents we must sacrifice to save the theory. A theory that saves time travel by turning agents into puppets (Vihvelin) or deluded subjects (Fatalism) pays a high price in philosophical plausibility, even if it is logically consistent. This axis is worth tracking because metaphysics should accommodate the possibility of agency, not explain it away.

  ### Seminar Recommendation
  **Build the fifty minutes around (ii) Vihvelin's Ability-Based Dissent.**

  Here is why: Your advisor is a Lewisian, and the standard seminar dynamic you dislike relies on Lewis's distinction between "can" (intrinsic) and "can" (compossible). Vihvelin attacks the root of that distinction by arguing that *ability just is* success in nearby worlds. By centering the session on Vihvelin, you force the room to confront the **Deliberative Friction** metric directly: if Vihvelin is right, Tim *cannot* form the intention to kill Grandfather without irrationality. This exposes the hidden cost of the Lewisian view (Score 6) by contrasting it with the paralyzing cost of the Ability view (Score 9). It moves the discussion from "How do we solve the paradox?" to "What kind of agents are we allowed to be in a time-travel world?" which is the exact comparative axis you wanted.
