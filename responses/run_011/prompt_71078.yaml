answer: |-
  ## The Bylaw Voting Diagnostic: A Decision Procedure

  This procedure is designed for a two-hour workshop. It does not promise a "perfect" system (because none exist), but it forces the room to trade off specific flaws rather than hiding them behind jargon.

  **Theoretical Grounding (For You, The Consultant):**
  *   **Arrow's Theorem:** Applies only to *ordinal* systems (rankings) with 3+ options. It proves you cannot satisfy Non-Dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives (IIA) simultaneously. *Translation:* If you want to rank candidates without a dictator, you must accept that "spoilers" can change the winner between the top two.
  *   **Gibbard–Satterthwaite:** All non-dictatorial systems are manipulable. *Translation:* Strategy is inevitable. The goal is to make strategy risky or difficult, not impossible.
  *   **Cardinal Loophole:** Rating systems (Score/Approval) are not subject to Arrow because they measure intensity, not just order. They sidestep IIA violations but introduce "scale normalization" problems (one voter's 5 is another's 3).
  *   **Condorcet Criterion:** If a candidate beats everyone else head-to-head, they should win. *Tension:* Satisfying this often requires complex counting that voters don't understand, reducing legitimacy.

  ---

  ### Module 1: The Stakes and The Scale
  **Goal:** Determine if voting is the right tool and how much complexity the group can absorb.

  **Question 1:** "If this vote goes wrong, does the organization break, or do we just try again next year?"
  *   **Good Answer:** "We try again" (Low Stakes) vs. "We fracture/sue/go bankrupt" (High Stakes).
  *   **Branch:**
      *   *High Stakes + Small Group (<20):* Proceed to Module 4 (Consensus Check).
      *   *Low Stakes or Large Group:* Proceed to Question 2.

  **Question 2:** "How many people will actually count the ballots, and do they know how to do long division?"
  *   **Good Answer:** "A hired firm" vs. "The secretary on a laptop" vs. "Show of hands."
  *   **Branch:**
      *   *Manual Count/Show of Hands:* Eliminate methods requiring iterative elimination or complex transfers (e.g., standard IRV, Condorcet). Stick to Plurality, Approval, or Two-Round.
      *   *Digital/Professional:* All methods open.

  **Theoretical Note:** This is a *judgment call* on implementation risk, not theory. A perfect method that is counted wrong is worse than a flawed method counted right.

  ---

  ### Module 2: The Spoiler Test (Arrow's IIA)
  **Goal:** Establish tolerance for the "Spoiler Effect."

  **Scenario:** "Imagine Candidate A and Candidate B are the front-runners. Candidate C enters the race. C has no chance of winning, but C sounds a lot like A. In the final count, C takes enough votes from A that B wins. Is this outcome acceptable?"
  *   **Option A:** "No, that's unfair. C shouldn't change the result between A and B." (Demands IIA).
  *   **Option B:** "Yes, that reflects that the group prefers B over the 'A-type' platform." (Accepts IIA violation).

  **Branch:**
  *   *If Option A (No Spoilers):* You must use a **Cardinal Method** (Score or Approval) or a **Two-Round Runoff**. *Note: Arrow proves you cannot do this with a single-round Ranked system.*
  *   *If Option B (Accept Spoilers):* **IRV** or **Plurality** are viable.

  **Theoretical Note:** This is where you explain Arrow without saying "Arrow." If they want a single-round ranked election *and* no spoilers, you must stop and tell them it is mathematically impossible.

  ---

  ### Module 3: The Strategy Test (Gibbard–Satterthwaite)
  **Goal:** Assess the risk of tactical voting.

  **Scenario:** "You love Candidate X, but X is polling in third place. You know Candidate Y is the 'lesser evil' against the candidate you hate. Are you willing to mark Y as your #1 to stop the hate-candidate, even though you prefer X?"
  *   **Option A:** "Yes, I'd do that to win." (High Strategy Risk).
  *   **Option B:** "No, I want to vote my conscience even if it wastes my vote." (Low Strategy Tolerance).

  **Branch:**
  *   *If Option A (Strategy Expected):* Use **Approval Voting** or **Score Voting**. These make "bullet voting" (maxing only one) the dominant strategy, which is honest. Avoid IRV (where ranking a compromise #2 can sometimes hurt them).
  *   *If Option B (Honesty Preferred):* **Condorcet** methods are best (honest voting usually wins), but only if the group is large enough that individual strategy doesn't matter.
  *   *Small Group Warning:* If the group is <50 people, tell them: "Strategy is guaranteed. No system stops it. We must design for transparency, not immunity."

  ---

  ### Module 4: The Intensity Check (Cardinal vs. Ordinal)
  **Goal:** Determine if *how much* people care matters.

  **Scenario:** "We are choosing a budget item. Half the room feels 'mildly good' about Option A. The other half feels 'desperately necessary' about Option B. Should the 'desperate' half win, or should the 'mild' majority win?"
  *   **Option A:** "The desperate half should win." (Intensity Matters).
  *   **Option B:** "One person, one vote. Majority rules." (Intensity Irrelevant).

  **Branch:**
  *   *If Option A:* You **must** use a Cardinal method (Score 0-5). Ranked systems cannot capture intensity.
  *   *If Option B:* Ranked or Plurality systems are acceptable.

  ---

  ### Module 5: The "One Rule" Constraint & Chair Power
  **Goal:** Handle specific bylaw constraints.

  **Question:** "Does the Chair have a casting vote in a tie?"
  *   **If Yes:** "In a tied vote, the Chair is a Dictator. No voting system fixes this. Do you want to remove the casting vote?"
      *   *If No:* Proceed with caution. The system is semi-dictatorial.
  **Question:** "Do you need one voting rule for both electing people and ranking budget proposals?"
  *   **If Yes:** "Budgets require Intensity (Module 4). Elections usually require Order. If you force one rule, you will do one job poorly. Do you insist?"
      *   *If Yes:* Recommend **Approval Voting**. It is the only "lowest common denominator" that works passably for both, though it is suboptimal for budgets.

  ---

  ## Case Studies: Running the Procedure

  ### Case (A): The Professional Society (4,000 Members)
  *   **Context:** President election. Plurality used for decades. Reform caucus wants IRV. Fringe candidate expected.
  *   **Module 1 (Scale):** Large group, hired firm counts ballots. Complexity allowed.
  *   **Module 2 (Spoilers):** Client says, "The fringe candidate siphoning votes is exactly why we are reforming." They choose **Option A (No Spoilers)**.
      *   *Constraint:* Eliminates Plurality. IRV *reduces* spoilers but does not eliminate them (center-squeeze effect). Score/Approval eliminates them.
  *   **Module 3 (Strategy):** 4,000 members means individual strategy is low risk (Gibbard-Satterthwaite applies, but noise drowns it).
  *   **Module 4 (Intensity):** Elections only. Intensity less critical.
  *   **Module 5 (Constraints):** No Chair vote issue.
  *   **Procedure Output:** **Score Voting (0-5)**.
      *   *Reasoning:* It satisfies the "No Spoilers" demand (IIA compliance via cardinality) better than IRV. IRV fails the "Monotonicity" test (voting for a candidate can make them lose), which is hard to explain to 4,000 members if it happens. Score is simpler to explain ("Rate them") and harder to break.
      *   *The "Bite":* If the client insists on *Ranked* ballots (because "that's what reformers want"), the procedure forces you to admit IRV is not spoiler-proof.
      *   *Recommendation:* **Score Voting.** If they refuse, **IRV** with a warning that it is not a magic bullet.

  ### Case (B): The Housing Co-op (11 Members)
  *   **Context:** Choosing 1 of 4 building sites. Chair has casting vote. Two members openly trading support ("I'll vote for Site 1 if you vote for my landscaping bid").
  *   **Module 1 (Stakes):** High Stakes (building is expensive/permanent). Small Group (11).
      *   *Branch:* **Proceed to Consensus Check.**
  *   **Module 3 (Strategy):** Client admits: "Everyone knows everyone's preferences. Strategy is not hypothetical."
      *   *Theory:* Gibbard-Satterthwaite implies manipulation is dominant. In a group of 11, a coalition of 6 controls everything.
  *   **Module 5 (Chair Power):** Chair has casting vote.
      *   *Analysis:* In a 10-member vote (excluding Chair), a 5-5 tie gives the Chair 100% power. In a 6-4 vote, the majority rules. The Chair is a "Tie-Breaking Dictator."
  *   **Procedure Output:** **Unanimity Rule (Veto Power).**
      *   *Reasoning:* In a small, high-stakes group with known strategic actors and a dictatorial tie-breaker, *any* majority voting system incentivizes betrayal and coalition-building that destroys long-term cohesion. Arrow's "Non-Dictatorship" criterion is already violated by the Chair's casting vote in tie scenarios. To counterbalance the Chair's power and prevent the "6-person coalition" from tyrannizing the 4, you must raise the threshold to 100%.
      *   *The "Embarrassing" Recommendation:* **"Do not vote. Require Unanimity. If you cannot agree, do not build."**
      *   *Why it bites:* You are a voting consultant recommending *against* voting. You are telling them their governance structure (Chair casting vote) makes fair voting impossible, so they must move to consensus. This risks the contract, but it is the only theoretically honest advice for an 11-person body with those constraints.

  ### Case (C): The Faculty Senate (300 Members)
  *   **Context:** One rule for Officer Elections AND Budget Proposals.
  *   **Module 4 (Intensity):** Budgets *require* intensity (Module 4, Option A). Elections usually work on Order (Module 4, Option B).
      *   *Conflict:* The client insists on **One Rule**.
  *   **Module 2 (Spoilers):** Budget amendments create massive spoiler effects (divide the pie).
  *   **Module 5 (Constraints):** "We insist on one rule for consistency."
  *   **Procedure Output:** **Approval Voting.**
      *   *Reasoning:* It is the only system that functions as both a cardinal measure (for budgets: "Fund this yes/no") and an ordinal proxy (for elections: "Approve all acceptable candidates").
      *   *The "Bite":* You must explicitly state: **"This will result in suboptimal budgeting."** Approval voting on budgets leads to "Christmas Tree" budgets (everyone approves everything) unless there is a hard cap. If there is a hard cap, it becomes a Knapsack Problem which Approval doesn't solve.
      *   *Recommendation:* **Approval Voting with a Hard Budget Cap.**
      *   *Caveat:* You must document that you advised against the "One Rule" constraint. The procedure flags this as a **Value Judgment** override: The client values *procedural consistency* over *economic efficiency*.

  ---

  ## Where the Procedure Stops: Unsatisfiable Demands

  There are three demands clients make that this procedure must reject. When you hear these, you are not selling a voting system; you are selling governance reform.

  **1. "We want a system where voting honestly is always the best strategy."**
  *   **The Theory:** Gibbard–Satterthwaite Theorem.
  *   **The Script:** "Mathematically, this does not exist for any election with more than two options. If I sell you a system that claims this, I am lying. We can only make strategy *harder* or *riskier*, not impossible."

  **2. "We want to rank three or more candidates without ever worrying about spoilers."**
  *   **The Theory:** Arrow's Impossibility Theorem (specifically IIA).
  *   **The Script:** "If you want to rank candidates (1st, 2nd, 3rd), you must accept that a 3rd candidate can change the winner between the top two. If you cannot accept that, you cannot use a ranking system. You must use a Rating system (Score/Approval) or accept a Runoff."

  **3. "We want the voting system to fix our polarization."**
  *   **The Theory:** Social Choice vs. Social Psychology.
  *   **The Script:** "Voting systems aggregate preferences; they do not change them. If your membership is polarized, a 'better' voting system will just reveal that polarization more accurately. You need mediation, not a new ballot."

  ## Summary of Judgment Calls vs. Theory

  | Decision Point | Theoretical Fact | Judgment Call |
  | :--- | :--- | :--- |
  | **Small Group Strategy** | G-S says strategy is possible. | In groups <20, strategy is *probable*. We assume bad faith. |
  | **Chair Casting Vote** | Creates a local dictatorship (Arrow). | We treat this as a bug to be removed, not a feature to be designed around. |
  | **One Rule for All** | Budgets are Cardinal; Elections are Ordinal. | If client insists, we prioritize Cardinal (Approval/Score) because Ordinal fails budgets harder. |
  | **Complexity** | Condorcet is more accurate than Plurality. | If voters can't understand it, legitimacy drops. We cap complexity at "High School Math." |

  ## Final Note to the Consultant
  The "Embarrassing" recommendation in Case (B) (Unanimity/No Vote) is the one that protects your integrity. It acknowledges that for tiny, high-stakes groups, *voting is often a failure of negotiation*. If you sell them an IRV system for an 11-person co-op, you are selling a bandage for a broken leg. Use the procedure to diagnose the break, even if it means prescribing rest instead of surgery.
