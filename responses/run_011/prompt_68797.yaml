answer: |-
  # Lesson Plan: The Lange-Hayek Classroom Experiment
  **Time:** 75 Minutes  
  **Class Size:** 24 Students  
  **Topic:** Socialist Calculation Debate (SCD)  
  **Goal:** Move students from "both sides yell" to understanding the specific *informational* vs. *incentive* constraints of each system.

  ## 1. Room Setup & Roles (10 Minutes)
  **Split the Class:**
  *   **Central Planning Board (CPB):** 8 Students (The "Lange" Side).
      *   *Role:* Set prices for the Final Good ("Widgets") and Inputs ("Steel").
      *   *Constraint:* Can **only** adjust prices based on aggregate Excess Demand reports. Cannot see firm-level data.
  *   **Market Economy:** 16 Students (The "Hayek" Side).
      *   *6 Production Firms:* Own factories, decide output.
      *   *6 Consumers:* Buy widgets.
      *   *4 Input Suppliers:* Sell steel to firms (optional complexity, or simplify to Firms just have endowments). *Let's simplify:* **10 Production Firms, 6 Consumers.** (Total 16 Market).
      *   *Correction for symmetry:* **12 Market** is cleaner. **6 Firms, 6 Consumers.**

  **Seating:**
  *   CPB sits at the front (the "Tower"). They cannot leave their desks.
  *   Market sits in clusters around the room. They can move and talk.

  **The Product:** "Widgets."
  **The Currency:** "Points" (No real money).

  ---

  ## 2. Game Mechanics & Rules

  ### A. The Lange Rules (CPB)
  1.  **Parametric Pricing:** The CPB sets a Price ($P$) for Widgets at the start of each round.
  2.  **No Command:** They cannot tell firms how much to produce.
  3.  **Adjustment Rule:** They collect "Planned Supply" and "Consumer Demand" forms.
      *   If Demand > Supply: Raise $P$ by 10%.
      *   If Supply > Demand: Lower $P$ by 10%.
      *   If Balanced ($\pm$1 unit): Keep $P$ stable.
  4.  **Blind Spot:** The CPB reporting form **does not** have a field for "Machine Condition" or "Local Constraints." They only see numbers.

  ### B. The Market Rules (Firms & Consumers)
  1.  **Profit Maximization:** Firms produce where $P \approx MC$ (Marginal Cost).
  2.  **Utility Maximization:** Consumers buy where Marginal Utility $\approx P$.
  3.  **Communication:** Market participants may talk, trade info, and negotiate side-deals freely.
  4.  **The Catch (Hayekian Knowledge):** Each Firm draws a **Secret Tech Card** at the start. This card modifies their cost structure or capacity. **This info is NOT on the report form.**
  5.  **The Flaw (Externality):** Every Widget produced generates 1 unit of "Smog."
      *   **Global Cap:** If Total Class Production > 40 Units, **EVERYONE** (Market & CPB) loses 50% of their points.
      *   **Information Asymmetry:** The CPB sees total production immediately on the summary sheet. The Market Firms *only* see their own production. They must figure out the cap themselves.

  ### C. The Equity Flaw (Lousy Endowment)
  *   **CPB Consumers:** All start with 50 Points income. (Equality).
  *   **Market Consumers:** Draw income cards: Two get 10 Points, Two get 50 Points, Two get 90 Points. (Inequality).
      *   *Why:* This prevents the Market from looking "morally superior" even if they are efficient.

  ---

  ## 3. Materials

  ### Material 1: Firm Report Sheet (Market & CPB Firms)
  *(Print 12 copies)*
  ```text
  ROUND: ___   FIRM ID: ___   PRICE (P): ___

  COST SCHEDULE (Marginal Cost per Unit):
  Unit 1: 5 pts | Unit 2: 10 pts | Unit 3: 15 pts | Unit 4: 20 pts | Unit 5: 30 pts

  SECRET TECH CARD (DO NOT WRITE ON FORM): [Instructor inserts sticker/stamp]
  [ ] NORMAL: Cost schedule as above.
  [ ] BROKEN BOILER: Max output is 2 units. (MC becomes infinite after Unit 2).
  [ ] EFFICIENT MOTOR: Costs are halved. (Unit 1: 2.5, Unit 2: 5, etc.)

  REPORT TO PLANNING BOARD:
  1. How many Widgets will you SUPPLY at this Price? ____
  2. How many Widgets do you DEMAND (as a consumer)? ____
  ```

  ### Material 2: CPB Price Sheet
  *(Print 1 copy for CPB Leader)*
  ```text
  CENTRAL PLANNING BOARD LEDGER

  ROUND 1:
  Price Set: _____
  Total Supply Reported: _____
  Total Demand Reported: _____
  Excess Demand (D - S): _____
  ACTION: [ ] Raise Price  [ ] Lower Price  [ ] Hold

  ROUND 2:
  Price Set: _____
  ...
  ```

  ### Material 3: Consumer Sheet (Market)
  *(Print 6 copies)*
  ```text
  CONSUMER ENDOWMENT: _____ Points (Private)
  UTILITY SCHEDULE:
  1st Widget: 40 pts value
  2nd Widget: 30 pts value
  3rd Widget: 20 pts value
  4th Widget: 10 pts value

  DECISION:
  I will buy ____ Widgets at Price ____.
  ```

  ### Material 4: The Smog Counter
  *(Whiteboard)*
  *   Draw a thermometer from 0 to 40.
  *   **CPB** updates this publicly after every round.
  *   **Market** must infer this from talking or guessing.

  ---

  ## 4. Round Structure (55 Minutes Total)

  ### Round 1: The Shock (20 Minutes)
  1.  **Setup (5 mins):** Distribute roles. Hand out Secret Tech Cards to Firms (Ensure 2 "Broken", 2 "Efficient", 2 "Normal"). Hand out Consumer Endowments.
  2.  **CPB Action (5 mins):** CPB sets initial Price (suggest starting at 15).
  3.  **Market Action (5 mins):** Firms calculate $P=MC$. Consumers calculate Demand. **Crucial:** Firms with "Broken" cards realize they can't meet the plan but must report what they *intend* (Lange Rule 2) or report the bottleneck?
      *   *Instructor Note:* Enforce Lange Rule 2 strictly for CPB firms if you had them, but here CPB *is* the board. The Market Firms are simulating "Socialist Managers" in Round 1?
      *   *Correction:* To make the comparison fair, **BOTH SIDES** run Production Firms.
      *   *Revised Split:* 12 Students = Firms. 12 Students = Consumers/CPB Hybrid?
      *   *Let's stick to the prompt:* Half Class = Planning Board. Half Class = Production + Consumers.
      *   *Okay, refinement:* The **Market Side** runs the firms. The **CPB Side** runs the Board *and* owns the firms (as state managers).
      *   *Wait, that confuses the incentive.*
      *   *Best Implementation:*
          *   **Group A (12 students):** The Planning Board. They set prices for the *whole room*.
          *   **Group B (12 students):** 6 Firms + 6 Consumers. They operate under Market Rules (can talk, keep profits).
          *   **BUT:** The Prompt says "Half the class runs a Lange-style planning board and the other half runs production teams plus consumers."
          *   *Okay, this implies two parallel economies or one integrated one.*
          *   *Integrated is better for comparison.*
          *   **Let's try this:** The **CPB** sets prices for **EVERYONE**.
          *   **Half the Firms (6)** are "State Firms" (Follow Lange Rules strictly, no talking).
          *   **Half the Firms (6)** are "Market Firms" (Follow Price Signals, can talk, keep profit).
          *   **Consumers (12):** Split evenly between State and Market access?
          *   *No, that's too complex for 75 mins.*

      *   *Final Decision for Flow:*
          *   **Team Red (12 students):** The Central Planning Board. They set the price for the *entire room*. They receive reports from everyone.
          *   **Team Blue (12 students):** The Production/Consumption Sector. They are split into 6 Firms and 6 Consumers.
          *   *Wait, if CPB sets price for everyone, where is the competition?*
          *   *Okay, I will run TWO PARALLEL ECONOMIES.*
          *   **Left Side of Room (12 students):** Socialist Economy. 4 Planners, 4 Firms, 4 Consumers.
          *   **Right Side of Room (12 students):** Market Economy. 4 Firms, 4 Consumers, 4 Traders/Middlemen.
          *   *Problem:* Hard to compare scores.
          *   *Solution:* **One Economy, Two Mechanisms.**
          *   **The CPB (12 students)** sets the price.
          *   **The Firms (12 students)** are split. 6 follow Lange Rules (State). 6 follow Market Rules (Private).
          *   **The Consumers (12 students)** are split. 6 get guaranteed allocation (State). 6 buy via income (Market).
          *   *Too many students.* 24 total.
          *   **Okay, strict adherence to prompt:** "Half the class runs a Lange-style planning board and the other half runs production teams plus consumers."
          *   **Interpretation:** The CPB *is* the government. The other half *is* the economy. The game tests if the CPB can coordinate the Economy.
          *   **The Twist:** We run **Two Rounds**.
          *   **Round 1:** CPB tries to plan the Economy (Lange).
          *   **Round 2:** CPB dissolves. The Economy trades freely (Market).
          *   **Comparison:** Compare Round 1 Efficiency vs Round 2 Efficiency.
          *   **The Constraint:** The "Local Knowledge" and "Smog" exist in both rounds.

      *   *Revised Plan (Fits Clock Best):*
          *   **Round 1 (Lange):** CPB sets Price. Firms report. CPB adjusts. (20 mins).
          *   **Round 2 (Market):** CPB is fired. Firms set Prices and Trade directly. (20 mins).
          *   **Debrief:** Compare outcomes. (35 mins).

  ### Round 1: The Lange Mechanism (20 Mins)
  1.  **CPB (12 students):** Elect a Chair. They set Price $P_1$.
  2.  **Firms (6 students):** Receive Secret Tech Cards. Calculate $Q$ where $P=MC$. Fill out Report Form. **Cannot talk to CPB.**
  3.  **Consumers (6 students):** Receive Endowments. Submit Demand.
  4.  **Clearing:** CPB sums Supply/Demand. Adjusts Price to $P_2$.
  5.  **Smog Check:** Instructor reveals total production. If >40, apply penalty.
  6.  **Scoring:** Calculate Points.

  ### Round 2: The Market Mechanism (20 Mins)
  1.  **CPB:** Sit out (or become auditors).
  2.  **Firms:** Can set their own Prices. Can talk to each other.
  3.  **Constraint:** Secret Tech Cards remain hidden unless disclosed voluntarily.
  4.  **Smog:** Cap remains. If >40, penalty applies.
  5.  **Scoring:** Calculate Points.

  ---

  ## 5. Points System (No Real Money)

  **Firm Score:**
  *   Revenue ($P \times Q$) minus Costs (from schedule).
  *   **Penalty:** -20 points if you reported a Supply you couldn't deliver (due to Secret Tech Card).
  *   **Bonus:** +10 points if you traded info to avoid the Smog Cap.

  **Consumer Score:**
  *   Total Utility of Widgets consumed minus Expenditure.
  *   **State Consumers (Round 1):** Guaranteed 2 Widgets (if available).
  *   **Market Consumers (Round 2):** Buy what they can afford.

  **CPB Score (Round 1 only):**
  *   Based on **Stability**.
  *   +50 points if Excess Demand was < 5 units.
  *   -10 points for every Price Change (bureaucratic friction).
  *   -50 points if Smog Cap exceeded.

  ---

  ## 6. The Debrief Script (35 Minutes)

  ### Part 1: The Hayekian Point (15 Mins)
  *   **Ask the CPB:** "In Round 1, you saw a Shortage. Did you know *why*?"
      *   *Expected Answer:* No. We just saw Demand > Supply.
  *   **Ask the Firms:** "Who had the 'Broken Boiler' card? Did you report it?"
      *   *Expected Answer:* No, there was no box on the form.
  *   **Ask the Market (Round 2):** "How did you solve the Broken Boiler?"
      *   *Expected Answer:* We talked. The Efficient Firm produced more; the Broken Firm subcontracted or shut down.
  *   **Takeaway:** The Price signaled *scarcity*, but only **local conversation** revealed the *cause*. Lange's Board sees the symptom (shortage) but not the disease (broken machine).

  ### Part 2: The Mises Point (10 Mins)
  *   **Ask:** "Did the CPB fail to calculate profit?"
      *   *Analysis:* In this game, we *gave* them accounting prices. Mises argues that without private property in the *means of production*, there are no *true* prices.
      *   *Limitation:* This game **cannot** prove Mises right. We simulated prices. Mises says you can't simulate them without ownership risk.
      *   *Distinction:* Hayek says "You don't have the info." Mises says "You don't have the *metric*." This game demonstrates Hayek. It assumes away Mises.

  ### Part 3: The Market Flaw & Equity (10 Mins)
  *   **Reveal the Endowments:** Show the Market Consumers had uneven income (10, 50, 90).
  *   **Ask:** "Did the Market clear efficiently?" (Yes). "Did everyone eat?" (No, the 10-point consumers starved).
  *   **Ask:** "Did the CPB ensure everyone ate?" (Yes, via allocation).
  *   **Takeaway:** The Market won on **Efficiency** (utilized the Efficient Motor firms). The Planner won on **Equity** (ignored income disparity).
  *   **The Smog Result:** Did the Market hit the Smog Cap?
      *   If Yes: Market failed to price the externality.
      *   If No: Market negotiated a solution (Coasean bargaining).
      *   *Instructor Note:* If the Market wins too easily, point out the "Lousy Endowment." If the Planner wins too easily, point out the "Wasted Efficient Motor."

  ---

  ## 7. Predicted Failure Points (Instructor Cheat Sheet)

  **1. The "Rigged" Complaint:**
  *   **Risk:** Market Side scores 2x higher than Planner Side. Students claim the Cost Schedules favored the Market.
  *   **Mitigation:** In the debrief, admit the Market has an *informational advantage* by design (they can talk). The point isn't who won, but *how* they won. If the Market won, it proves Hayek (knowledge is dispersed). If the Planner kept everyone fed despite lower scores, it proves the Equity trade-off.

  **2. CPB Paralysis:**
  *   **Risk:** CPB spends 15 minutes arguing over a 1-point price change.
  *   **Mitigation:** Enforce a 2-minute timer on CPB decisions. Ring a bell. "Price must be set NOW."

  **3. The "Broken Boiler" Ignored:**
  *   **Risk:** Firms with Broken Boilers just report 0 supply.
  *   **Mitigation:** Instruct them: "You are a Lange Manager. You must try to meet the plan. Report what you *would* produce at that price, even if you can't." This creates the "False Report" that blinds the CPB.

  **4. Smog Cap Confusion:**
  *   **Risk:** Students forget the Smog Cap.
  *   **Mitigation:** Write "SMOG LIMIT: 40" in huge letters on the board. Update the counter visibly after Round 1.

  **5. Mises vs. Hayek Conflation:**
  *   **Risk:** Students say "The Planner failed because they couldn't calculate profit."
  *   **Correction:** "No, they had cost sheets. They failed because they didn't know the machine was broken. That's Hayek (Knowledge), not Mises (Calculation)."

