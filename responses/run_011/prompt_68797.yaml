prompt: |-
  I'm teaching a 75-minute section on the socialist calculation debate to ~24 second-years who've done the readings but think both sides are just yelling at each other. Design a live game for one room where half the class runs a Lange-style planning board and the other half runs production teams plus consumers. I want it to be Lange's actual proposal, not a strawman: the board sets prices parametrically and revises them only from reported shortages and surpluses, and plant managers follow the two rules — minimize cost at the posted prices, produce up to where price equals marginal cost. The catch I want built in: every production team gets one piece of local knowledge that has no field on the reporting form, so the only way it can travel is if someone talks. Also don't let the market side be clean — give it an externality or a lousy initial endowment so the thing isn't a rigged demo. Give me materials, a points system (no real money), the price-sheet template, and a round structure that fits the clock. Then a debrief that separates what the game actually shows — Hayek's point about dispersed knowledge — from what it can't show, i.e. Mises's stronger claim that calculation is impossible outright. Finish with what predictably falls apart the first time you run it; my guess is the market side wins so easily that half the class decides it was riged.
