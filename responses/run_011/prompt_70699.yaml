      *   *Correction on Q3:* Make sure to distinguish between Devlin's *personal* belief (he was a Catholic) and his *legal theory* (secular/conventionalist). The book conflates these.
      *   *Correction on Q5:* Be clear that *pro tanto* implies a liberal weighing mechanism. Devlin's mechanism is sociological preservation. They are different engines.

  8.  **Final Output Structure:**
      *   Introduction (acknowledge the PhD level, validate the suspicion).
      *   Section 1: The Audit (Claim by Claim).
