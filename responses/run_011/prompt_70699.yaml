      *   **Task:** Audit the provided paragraph claim-by-claim. Address specific questions about Devlin's "democratic" test, "true morality" vs. "conventions," Hart's objections (empirical vs. conceptual), and whether Devlin can be recruited for a *pro tanto* reasons framework.
      *   **Constraints:** British English. No page numbers or reading lists (can't access primary texts this week). Focus on the *shape* of arguments and where the summary bends them.
      *   **Tone:** Academic, precise, critical, but accessible (peer-to-peer).

  2.  **Deconstruct the Provided Paragraph (Claim-by-Claim Audit):**
      *   *Claim 1: Devlin's 1959 Maccabaean lecture was his answer to the Wolfenden Report.*
          *   Verdict: Straight. (Though technically it was a series of lectures published as *The Enforcement of Morals*, the Maccabaean Lecture is the core source).
      *   *Claim 2: His case opens from a sociological claim rather than a moral one: a society is... held together by a common set of moral ideas, and if too many of those ideas go the society stops being a society.*
          *   Verdict: Legitimate simplification. This is the "disintegration thesis." It's the foundational premise.
      *   *Claim 3: On that basis the law may criminalise conduct that is immoral even where it harms nobody, for much the same reason that it may criminalise sedition.*
          *   Verdict: Straight. This is the analogy Devlin uses (immorality threatens society like treason).
      *   *Claim 4: Devlin's test for when this is appropriate is refreshingly democratic: consult the ordinary reasonable person, and if that person responds with disgust, indignation and intolerance, the state is entitled to act.*
          *   Verdict: Distortion/Misleading. "Refreshingly democratic" is editorialising. The "man on the Clapham omnibus" test is accurate, but "entitled to act" skips the constraints Devlin added (more on this in Q2).
      *   *Claim 5: Note that Devlin was no relativist — he thought the law should enforce true morality rather than the conventions of the moment...*
          *   Verdict: False/Highly Contested. This is the crux of Q3. Devlin is usually read as a conventionalist (enforcing what society *actually* believes), not a natural law theorist (enforcing what is *objectively* true).
      *   *Claim 6: ...which is why he took the Wolfenden recommendation to be wrong in principle and not merely imprudent.*
          *   Verdict: Straight. He objected in principle.
      *   *Claim 7: Hart's reply demolished the argument on its own terms: he showed that societies absorb enormous moral change without coming apart, so Devlin's factual premise was false and nothing survived of the case for legal moralism.*
          *   Verdict: Distortion/Overstatement. Hart did argue empirically, but also conceptually. "Nothing survived" is hyperbolic; legal moralism persists in philosophy (e.g., Moore). Hart didn't necessarily grant the starting premise (more on this in Q4).

  3.  **Address Question 2: The "Refreshingly Democratic" Line & Constraints:**
      *   *Is it fair?* "Democratic" is a stretch. It's majoritarian, but Devlin feared the "tyranny of the majority" less than the disintegration of society. "Refreshingly" is definitely the author's voice, not a neutral description.
      *   *Disgust on its own?* Devlin talks about "intolerance, indignation, and disgust." But he adds qualifiers.
      *   *Constraints:* This is crucial. Devlin *did* build in constraints.
          1.  *Privacy:* He accepted a private sphere (though narrower than Wolfenden).
          2.  *Tolerance:* Society must tolerate as much individual freedom as is consistent with integrity.
          3.  *Minimum Morality:* Law shouldn't enforce all morality, only the minimum necessary to hold society together.
          4.  *Pace of Change:* Law shouldn't move too fast ahead of public opinion, but public opinion shouldn't be static.
      *   *Internal or Bolted on?* They are internal. They flow from the idea that the goal is *preservation of society*, not punishment for sin's sake. If you punish too much, you create resentment and threaten society (counter-productive).

  4.  **Address Question 3: "True Morality" vs. "Conventions":**
      *   *Is that right?* Generally, no. Devlin is widely interpreted as a **conventionalist**. He identifies morality with what the "reasonable man" feels. He explicitly avoids metaphysical claims about objective moral truth because he thinks they are unverifiable in a pluralistic society.
      *   *Does anything turn on it?* Yes, massively.
      *   *If the book had it the other way round (Conventionalist):* Hart's criticism lands harder. If morality is just "what people feel," then changing feelings don't destroy society (Hart's empirical point).
      *   *If Devlin meant "True Morality" (Natural Law):* He would be closer to Aquinas or Finnis. Hart's empirical point about society surviving change matters less; the point would be that the state has a duty to enforce *truth*. But Devlin explicitly rejects this because he wants a secular basis for law in a modern democracy.
      *   *Vulnerability:* A "True Morality" Devlin is vulnerable to the charge of imposing a specific sectarian view. A "Conventionalist" Devlin is vulnerable to the "disintegration thesis" empirical rebuttal. The book's claim makes Devlin sound more philosophically robust than he intended to be.

  5.  **Address Question 4: Hart's Objection (Empirical vs. Conceptual):**
      *   *Empirical:* Yes, Hart argued societies *do* change morals without collapsing (e.g., divorce, usury).
      *   *Conceptual:* Yes, Hart argued that "society" isn't defined by a single shared morality. A society can share institutions/rules without sharing deep moral views.
      *   *Did Hart grant the premise?* No. Hart challenged the definition of society.
      *   *Does "on its own terms" survive?* Not really. The trade press claim implies Hart accepted Devlin's goal (preserving society) but showed Devlin's method wouldn't work. Hart actually challenged the goal/definition itself (Liberalism vs. Legal Moralism). Hart brings in the Harm Principle (Mill) which Devlin explicitly rejects. So Hart is *not* arguing purely on Devlin's terms; he is offering a rival framework.

  6.  **Address Question 5: Practical Bit (Pro Tanto Reasons):**
      *   *Can I recruit Devlin?* Carefully.
      *   *The Structure:* You argue moral wrong = *pro tanto* reason. Devlin argues moral wrong = reason *if* it threatens social cohesion.
      *   *The Conflict:* Devlin isn't really a *pro tanto* theorist in the modern weighing sense. For Devlin, if the "reasonable man" feels disgust, the state is *entitled* to act, subject to the pragmatic constraints (tolerance, privacy). It's more of a threshold view than a weighing view.
      *   *Risk:* If you use Devlin to say "immorality is a reason," a Devlin defender might say "No, immorality is only a reason *if* it endangers society." They might accuse you of stripping out the sociological glue (the disintegration thesis).
      *   *Better Fit:* You might be better off with "Moderate Legal Moralism" (e.g., Michael Moore) rather than Devlin. Devlin is too tied to the *social reaction* (disgust) rather than the *objective wrong*.
      *   *Verdict:* You can use him as a historical anchor for "legal moralism," but don't claim he supports a *pro tanto* weighing model where harm principles outweigh morality easily. For Devlin, morality is the foundation, not just one weight on the scale.

  7.  **Review and Refine (Self-Correction/Polishing):**
      *   *Check Tone:* Ensure it sounds like a colleague/supervisor interaction. British English (criminalisation, colour, programme, etc.).
