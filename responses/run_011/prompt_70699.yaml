  9.  *(Final Polish of British English)*: Ensure "criminalisation", "defence", "programme", "colour" etc. are used correctly. Ensure tone is appropriately academic but direct. (e.g., "straight," "distortion," "bolted on").

  10. *(Final check on the "True Morality" point)*: This is the trickiest bit. Devlin *did* believe in true morality personally, but his *argument* in the Maccabaean Lectures relies on the *shared* morality. I need to make sure the user understands the distinction between Devlin the man and Devlin the theorist. The book blurs this.

