prompt: |-
  I'm a third-year criminology PhD student working on criminalisation theory — basically, when the state may turn conduct into a crime — and the Hart/Devlin exchange is adjacent enough that I'm supposed to have a grip on it. I don't. I've only ever met it through other people. So: I picked up a trade-press history of the great law-and-liberty arguments at the airport, and it does the Wolfenden stuff in a couple of pages. I typed the Devlin paragraph out:

  "Devlin's 1959 Maccabaean lecture was his answer to the Wolfenden Report, which had recommended two years earlier that homosexual acts between consenting adults in private should cease to be crimes. His case opens from a sociological claim rather than a moral one: a society is not merely a collection of people who happen to share a government, it is held together by a common set of moral ideas, and if too many of those ideas go the society stops being a society. On that basis the law may criminalise conduct that is immoral even where it harms nobody, for much the same reason that it may criminalise sedition. Devlin's test for when this is appropriate is refreshingly democratic: consult the ordinary reasonable person, and if that person responds with disgust, indignation and intolerance, the state is entitled to act. Note that Devlin was no relativist — he thought the law should enforce true morality rather than the conventions of the moment, which is why he took the Wolfenden recommendation to be wrong in principle and not merely imprudent. Hart's reply demolished the argument on its own terms: he showed that societies absorb enormous moral change without coming apart, so Devlin's factual premise was false and nothing survived of the case for legal moralism."

  My supervisor said something like that last sentence in a seminar last term — Hart won on the evidence — and I've definately been repeating it without thinking. Now I want an audit I can act on.

  1. Go through the paragraph claim by claim and sort it: what's straight, what's a legitimate simplification for a general audience, what a Devlin scholar would call a distortion, and what's simply false. I care most about the ones that look fine.

  2. On the "refreshingly democratic" line: is that fair? Did Devlin really make popular revulsion the criterion, and did he think disgust on its own entitled the state to legislate? How much did he build in by way of constraints — tolerance, privacy, the pace of change, the difference between having a ground for criminalising and having a conclusive one? I keep hearing he conceded a lot here and I can't tell how much, or whether the concessions are internal to his argument or bolted on afterwards.

  3. The "true morality rather than the conventions of the moment" sentence. Is that right, and does anything turn on it? Specifically: if the book had it the other way round, does Hart's criticism still land, or does it depend on which of the two Devlin meant? Would a Devlin who enforced true morality rather than the going code be a different kind of legal moralist, with a different vulnerability?

  4. Was Hart's objection empirical, conceptual, or doing both at once? And did he give Devlin any part of the starting premise? Does "on its own terms" survive, given that Hart seems to bring in a liberal assumption about harm that Devlin never granted?

  5. The practical bit. My chapter argues that a moral wrong gives the state a *pro tanto* reason to criminalise — a real reason, but one that has to be weighed against competing considerations and can lose. Can I recruit Devlin for that structure, or am I reading him against the text to make him respectable? Would someone defending Devlin accept my framing, or would they say I've turned him into a harm-principle theorist in slow motion?

  British English please. And don't send me off to page numbers or a reading list — I can't get hold of the primary texts this week, and what I actually need is the shape of the arguments and where the book's version bends them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

