answer: |-
  This is a sharp instinct. Your supervisor's shorthand ("Hart won on the evidence") is the standard orthodoxy, but at PhD level, you need to know where that orthodoxy papers over the cracks. The trade-press paragraph you've typed out is competent journalism, but it conflates Devlin's personal views with his legal theory, and it simplifies Hart's counter-argument into a purely empirical rebuttal.

  Here is an audit of the paragraph and the specific conceptual problems you need to navigate for your chapter.

  ### 1. The Audit: Claim by Claim

  **Claim:** *"Devlin's 1959 Maccabaean lecture was his answer to the Wolfenden Report..."*
  **Verdict:** **Straight.**
  **Comment:** Accurate enough. The lectures were published as *The Enforcement of Morals* (1965), but the core argument was delivered in 1959. It was explicitly triggered by Wolfenden.

  **Claim:** *"His case opens from a sociological claim rather than a moral one: a society is... held together by a common set of moral ideas, and if too many of those ideas go the society stops being a society."*
  **Verdict:** **Legitimate Simplification.**
  **Comment:** This is the "disintegration thesis." It is the lynchpin. Devlin argues that shared morality is the invisible bond of society, akin to a shared language or government. Without it, you have a mob, not a society. This is correctly identified as sociological (about social cohesion) rather than purely theological (about sin).

  **Claim:** *"On that basis the law may criminalise conduct that is immoral even where it harms nobody, for much the same reason that it may criminalise sedition."*
  **Verdict:** **Straight.**
  **Comment:** This is Devlin's central analogy. Treason is criminalised because it threatens the state's existence; Devlin argues private immorality threatens society's existence in the same way. Therefore, the "harm principle" (Mill/Hart) is too narrow; the harm is to the fabric of society, not necessarily to a specific individual.

  **Claim:** *"Devlin's test for when this is appropriate is refreshingly democratic: consult the ordinary reasonable person, and if that person responds with disgust, indignation and intolerance, the state is entitled to act."*
  **Verdict:** **Distortion.**
  **Comment:** "Refreshingly democratic" is editorial spin. Devlin uses the "man on the Clapham omnibus" (the reasonable person), but he is deeply suspicious of unfettered majoritarianism. More importantly, "entitled to act" skips the qualifications Devlin attaches to this entitlement (see section 2 below). It implies a green light, whereas Devlin offered a yellow light with conditions.

  **Claim:** *"Note that Devlin was no relativist — he thought the law should enforce true morality rather than the conventions of the moment..."*
  **Verdict:** **False.**
  **Comment:** This is the most dangerous sentence for your purposes. Devlin the *Catholic* believed in true morality. Devlin the *legal theorist* argued the law must enforce *shared* morality (conventions). He explicitly rejected the idea that the state should enforce a moral truth that the public does not accept. He wanted a secular basis for law in a pluralistic society. The book conflates the man with the argument.

  **Claim:** *"Hart's reply demolished the argument on its own terms: he showed that societies absorb enormous moral change without coming apart, so Devlin's factual premise was false and nothing survived of the case for legal moralism."*
  **Verdict:** **Distortion/Overstatement.**
  **Comment:** Hart did argue empirically (societies do change without collapsing), but he also argued conceptually (that is not what defines a society). "Nothing survived" is hyperbolic; legal moralism remains a live position in philosophy (e.g., Michael Moore), though Devlin's specific sociological version is largely abandoned. Hart did not argue purely "on Devlin's terms"; he imported liberal assumptions Devlin rejected.

  ---

  ### 2. The "Refreshingly Democratic" Line and Constraints

  Is it fair to say Devlin made popular revulsion the criterion? **Yes, but with heavy caveats.**

  Devlin does argue that the "reasonable man's" feeling of disgust is the indicator of what morality is essential. However, he does **not** argue that disgust *alone* justifies criminalisation without further checks. If you read Devlin charitably, he builds in three major constraints that are internal to his argument, not bolted on afterwards:

  1.  **The Minimum Necessary:** The law should only enforce the *minimum* morality required to keep society together. It should not aim to eradicate all vice, only that which threatens the bond.
  2.  **Tolerance:** Devlin explicitly states that society must tolerate the maximum individual freedom consistent with its own integrity. If you criminalise too much, you create resentment, which *itself* threatens social cohesion. Thus, prudence is internal to the theory.
  3.  **Privacy:** Devlin accepts a private sphere. He agrees with Wolfenden that what happens in private is generally not the law's business. His disagreement with Wolfenden was on the *scope* of "private" and whether homosexual acts were truly private in their social effects.

  **Did he think disgust on its own entitled the state to legislate?**
  No. He thought disgust identified the *boundary* of the shared morality. Once identified, the state must still weigh whether criminalisation is necessary to preserve society. If the conduct is disgusting but doesn't threaten disintegration, the law should leave it alone.

  **Is "democratic" fair?**
  It is majoritarian, but Devlin was a conservative. He feared the "tyranny of the majority" less than the "tyranny of the individual" destroying the collective. Calling it "refreshingly democratic" implies a liberal openness that Devlin did not possess. He trusted the "reasonable man" as a proxy for social stability, not as an expression of individual autonomy.

  ---

  ### 3. "True Morality" vs. "Conventions"

  This is the critical point for your thesis. The book has this backwards.

  **Devlin's Position:** He is a **conventionalist**. He argues that in a secular democracy, we cannot agree on "true" morality (God's law, natural law, etc.). The only verifiable morality is the one actually held by the people. Therefore, the law enforces the *conventions of the moment*, provided they are deeply held.

  **Why does this matter?**
  If the book were right (that Devlin enforced "true morality"), Hart's empirical rebuttal would matter less. If the state has a duty to enforce *Truth*, it doesn't matter if society survives or not; truth is truth.
  But because Devlin is a conventionalist, his argument rests entirely on the **sociological link**: Law enforces Convention -> Convention holds Society together -> Therefore Law preserves Society.

  **Hart's Criticism:**
  Hart attacks this link. He argues:
  1.  **Conceptually:** A society is not defined by shared morality. You can have a stable society with plural moral views (e.g., modern Britain).
  2.  **Empirically:** Societies change their moral conventions (e.g., on divorce, usury, Sunday trading) without disintegrating.

  **Does a "True Morality" Devlin change the vulnerability?**
  Yes. A "True Morality" Devlin (a Natural Law theorist) is vulnerable to the charge of sectarianism (whose truth?). A "Conventionalist" Devlin is vulnerable to the charge of conservatism (protecting prejudice). Hart exploits the latter. If you adopt the book's version, you make Devlin sound more philosophically robust than he was, but you make him easier to dismiss as a religious zealot rather than a sociological theorist. For your purposes, treat Devlin as a conventionalist; it makes the "disintegration thesis" the weak point you can analyse.

  ---

  ### 4. Hart's Objection: Empirical, Conceptual, or Both?

  It is **both**, and the trade press summary leans too heavily on the empirical.

  **The Empirical Objection:** Hart argues that history shows societies survive moral change. Devlin's prediction of disintegration is factually wrong.
  **The Conceptual Objection:** Hart argues Devlin has the wrong definition of "society." A society is a group of people under a system of rules, not necessarily a group of people who share the same moral views. You can share a government and laws without sharing a moral code.

  **Did Hart grant the starting premise?**
  No. The claim that Hart argued "on its own terms" is misleading. Hart imports the **Harm Principle** (from Mill). Devlin explicitly rejects the Harm Principle as the *sole* basis for criminalisation.
  *   **Devlin:** Society has a right to protect its existence (even from private immorality).
  *   **Hart:** Society only has a right to prevent harm to others.

  Hart does not accept Devlin's premise that "immorality = threat to society." He challenges the definition of the threat. So, Hart is not just saying "Your method won't work"; he is saying "Your goal is illiberal."

  **Does "on its own terms" survive?**
  Only in a limited sense. Hart grants that *if* morality were essential to society, the state could protect it. But he denies the antecedent. He forces Devlin to prove the necessity of shared morality, which Hart thinks Devlin fails to do.

  ---

  ### 5. The Practical Bit: Recruiting Devlin for *Pro Tanto* Reasons

  You want to argue that a moral wrong gives the state a *pro tanto* reason to criminalise (a real reason, but one that can be outweighed).

  **Can you recruit Devlin?**
  You can, but you must be careful not to turn him into a liberal.

  **The Fit:**
  Devlin agrees that immorality provides a *ground* for criminalisation. He is a legal moralist. In that sense, he supports the idea that "it is wrong" is a relevant consideration for the legislator.

  **The Friction:**
  1.  **Threshold vs. Weighing:** Devlin is not really a *pro tanto* weigher. For Devlin, if the conduct threatens social cohesion (identified by disgust), the state is *entitled* to ban it, subject to the constraints of tolerance/privacy. It is more of a threshold view: *Does this threaten the bond? Yes -> Ban (unless imprudent).*
      Your *pro tanto* model suggests: *Is it wrong? Yes -> Add to scale -> Weigh against Liberty -> Decide.*
      For Devlin, Liberty is not a competing weight on the same scale; Liberty is only permitted *insofar as* it doesn't threaten the bond.
  2.  **The Source of the Reason:** For you, the reason might be the *objective wrongness*. For Devlin, the reason is the *social reaction* to the wrongness. If the public isn't disgusted, Devlin's theory suggests the state has *no* reason to act, even if the act is objectively immoral.
  3.  **The Risk:** A Devlin defender would say you are reading him against the text if you suggest the moral reason can be easily outweighed by individual liberty. For Devlin, the preservation of society is the trump card. If you make liberty the trump card, you are a Hartian, not a Devlinian.

  **Recommendation:**
  Use Devlin to establish that "moral wrongness" is a *candidate* reason for criminalisation (rejecting the strict Harm Principle). But acknowledge that his *structure* is sociological preservation, not liberal weighing.
  You might say: *"Devlin establishes that moral wrongness is a legitimate ground for state intervention, but his reliance on social cohesion makes the reason contingent on public sentiment. A more robust legal moralism (e.g. Moore) would ground the pro tanto reason in the wrongness itself, independent of Devlin's disintegration thesis."*

  This allows you to use Devlin to open the door to legal moralism without adopting his sociological baggage or his conventionalism.

  ### Summary for your Chapter

  1.  **Discard the "True Morality" claim.** Devlin is a conventionalist; the law enforces what people *feel*, not what *is*.
  2.  **Nuance the "Democratic" claim.** Devlin uses public sentiment as a diagnostic tool, but limits legislative power through internal constraints (tolerance, privacy, minimum necessary).
  3.  **Clarify Hart's Win.** Hart won not just on evidence (societies survive change) but on definition (society doesn't require shared morality).
  4.  **Use Devlin Carefully.** He supports the idea that immorality is a *reason* to criminalise, but his structure is about *social survival*, not *pro tanto* weighing. If you want a *pro tanto* structure, you are likely moving beyond Devlin towards moderate legal moralism, using Devlin only as the historical foil to Hart.

  This should give you enough grip to handle the seminar discussion without needing the primary texts this week. Good luck with the chapter.
