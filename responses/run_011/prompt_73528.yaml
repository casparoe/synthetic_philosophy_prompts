answer: |-
  You have correctly identified that the modern jury system is not a Condorcetian machine. In fact, it is deliberately anti-Condorcetian. If the goal were purely statistical accuracy based on independent signal aggregation, the rules you describe would be malpractice.

  The system is not built on the epistemology of *aggregation* (averaging out errors); it is built on the epistemology of *common ground* and *public justification*.

  Here is the reconstruction of the implicit theory of group knowledge the jury system relies on, followed by the analysis of its features and the comparison with your Condorcetian counterfactual.

  ### 1. The Implicit Epistemology: Discursive Justification, Not Statistical Aggregation

  Condorcet's Jury Theorem rests on two pillars: **Competence** (each voter is >50% likely to be right) and **Independence** (errors are uncorrelated). The jury system deliberately undermines Independence (via deliberation) and restricts Competence (via evidence rules).

  Why? Because the legal system does not view a verdict as "true" simply because it matches reality. A verdict is "true" only if it is *warranted* by a specific public process.

  The implicit theory is **Deliberative Epistemology**. It presupposes that:
  1.  **Truth is Narrative:** Facts do not speak for themselves; they must be woven into a coherent story. A group arrives at truth not by voting on atoms of fact, but by stress-testing competing narratives.
  2.  **Common Knowledge is Required:** For a group to act as a single body, they must share the same informational baseline. If Juror A Googles the street and finds it's a known drug corner, and Juror B doesn't, they are no longer judging the *evidence presented*; they are judging two different cases. The embargo ensures that the "truth" they converge on is built solely from materials that the defendant had a chance to contest.
  3.  **Dissent is a Bug Detector:** Unanimity (where required) is not a voting threshold; it is a reliability check. If one person cannot be convinced, it suggests the prosecution's narrative has a hole that the "majority" might be glossing over due to social pressure or cognitive bias.

  In this view, the "two loudest people" problem you experienced is a *failure mode* of the system, not a feature. But the system assumes that forcing the loud people to argue with the quiet people in a locked room is the best way to expose whether the loud people are right or just dominant.

  ### 2. Feature Analysis: Necessary, Incidental, and Underdetermined

  Here is how the specific rules map onto this theory.

  **Strictly Necessary (for this epistemology):**
  *   **The Information Embargo:** This is the core. Without it, you lose "Common Ground." If jurors bring in outside info, the adversarial process (cross-examination) cannot vet that info. The system sacrifices *completeness* of information for *contestability* of information.
  *   **Deliberation:** Essential for the "stress-test" theory. Without talking, you revert to aggregation. The system requires jurors to change each other's minds through reason (or pressure), transforming individual uncertainty into collective certainty.
  *   **Random Selection:** Necessary for the "Community Conscience" aspect. The verdict must represent the community's standard of "reasonable doubt," not a technocratic elite's standard.

  **Incidental (Historical baggage):**
  *   **The Number 12:** This is largely historical (Henry II liked 12 knights). Studies suggest 6-person juries deliberate less thoroughly and hang less often than 12-person juries, but the specific number 12 isn't epistemically magical.
  *   **The Physical Room:** Locking them in is a ritualistic enforcement of the embargo, but technically, sequestration could be digital. The physical confinement is mostly to prevent accidental contamination.

  **Underdetermined (Where theories diverge):**
  *   **Unanimity vs. Supermajority:** This is the biggest underdetermined point.
      *   *Theory A (Protection):* Unanimity is required because convicting an innocent person is worse than acquitting a guilty one. A single dissenter proves "reasonable doubt" exists.
      *   *Theory B (Efficiency):* 10-2 is acceptable because 10 people agreeing is sufficient evidence of community consensus, and hung juries waste resources.
      *   *The Fact:* Both exist in the US (federal vs. some states). This implies the system tolerates different trade-offs between *false positives* and *systemic efficiency* without breaking its core logic.
  *   **The Judge's Role:** You noted the judge can "read whatever she likes." This is a category error in your bundle. The judge is generally forbidden from researching *facts of the case*. She can research *law*. This fits the theory: The jury finds facts (via common evidence); the judge manages procedure (via expert legal knowledge). They operate in different epistemic domains.

  ### 3. The Maximally Condorcetian Jury

  Let's build your counterfactual: 50 jurors, independent investigation allowed, no deliberation, secret ballot, simple majority verdict.

  **What this system gains:**
  *   **Statistical Power:** If we assume independent errors, 50 heads are vastly better than 12 at canceling out noise.
  *   **Information Completeness:** 50 people digging for info will find more than 12 people listening to lawyers.
  *   **Protection against Social Pressure:** The quiet juror isn't bullied by the loud one.

  **What this system loses:**
  1.  **Contestability:** This is the critical loss. In the current system, if a juror finds a piece of information, the defense attorney has a right to cross-examine the source or explain it away. In your Condorcet jury, Juror #34 might find a blog post saying the defendant is a bad guy. The defense never sees it. The defendant cannot contest it. The verdict is based on evidence the accused never saw.
  2.  **Narrative Coherence:** Without deliberation, there is no requirement for the facts to hang together. 26 people might vote "Guilty" for 26 different, mutually incompatible reasons. The current system forces the group to agree on *why* the defendant is guilty, not just *that* they are guilty.
  3.  **Civic Accountability:** Deliberation forces citizens to take responsibility for the state's violence. A secret ballot allows jurors to vote their biases without having to justify them to their peers.
  4.  **The "Reasonable Doubt" Operationalization:** In a majority vote, 51% certainty wins. In a unanimous jury, the prosecution must raise the certainty of the *most skeptical* person to near 100%. The Condorcet system lowers the effective burden of proof.

  ### 4. Which Loss Matters Most?

  The loss that actually matters is **Contestability (Due Process).**

  The American legal system (and many others) is not purely inquisitorial (seeking the truth at all costs); it is adversarial. It operates on the premise that the best way to find truth is to have two motivated parties fight over the evidence before a neutral arbiter.

  Your Condorcetian jury reverts to an **Inquisitorial Model** but without the safeguards of an inquisitorial system (where a trained judge investigates). It privatizes the investigation.

  If Juror #12 Googles the street name (as you did), they might find that it's in a "high crime area." That is statistically relevant but highly prejudicial. The defense lawyer was not allowed to bring that up because it might bias the jury against the defendant's character rather than the specific act. By Googling it, you bypassed the defense's ability to object to that characterization.

  **The Verdict:**
  The current system accepts a higher risk of *epistemic error* (missing the truth because of restricted info) to guarantee *procedural legitimacy* (the truth was found fairly).

  Your Condorcetian system increases the likelihood of a statistically accurate verdict but severs the link between the verdict and the *public reasons* for the verdict. In a democracy, the state cannot punish a citizen based on reasons that were not publicly aired and tested.

  So, to answer your hunch: You are half-right. It is a legitimacy device, but not in a cynical sense. It is a legitimacy device because, in law, **a truth that cannot be publicly justified is not a legal truth.** The deliberation room is not a calculator; it is a miniature public sphere. The friction you felt—the boredom, the restrictions, the annoyance at the judge—is the cost of maintaining that public sphere against the efficiency of private information gathering.

  The system presupposes that **how** you know matters as much as **what** you know. Your Condorcet jury knows more, but it doesn't know *together*, and it doesn't know *fairly*.
