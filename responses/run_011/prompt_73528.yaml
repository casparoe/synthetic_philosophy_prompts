  2.  **Analyze the Implicit Epistemology of the Jury System:**

      *   *Why the embargo?* It's not about making them dumber; it's about *common ground*. If Juror A knows X from a news article and Juror B knows Y from a podcast, they aren't arguing about the evidence; they're arguing about conflicting outside contexts. The adversarial system ensures *tested* information. Hearsay rules exist for reliability.
      *   *Why deliberation?* It's not just aggregation. It's *synthesis*. It's about testing the narrative against collective scrutiny. It transforms individual uncertainty into collective certainty (or reveals irreconcilable doubt).
      *   *Why unanimity (often)?* It raises the burden of proof. It ensures that the "reasonable doubt" standard is applied rigorously. A single dissenter isn't just a vote; they represent a failure of the prosecution's narrative to convince *everyone*.
      *   *Why random selection?* Representativeness. Not just statistical independence, but *community conscience*.
      *   *Why the Judge is different?* The Judge is a legal arbiter, not a fact-finder (in jury trials). Their knowledge is about law/procedure, not guilt/innocence.

      *   *The Core Theory:* It's not "Wisdom of Crowds" (Condorcet). It's "Deliberative Democracy" or "Discursive Epistemology." Truth emerges from *conflict and resolution* under constrained conditions, not from averaging independent errors. It values *justification* over *accuracy* in the raw sense.

  3.  **Address the User's Specific Questions:**

      *   *Condorcet vs. Reality:* User is right. The jury system violates Condorcet's independence assumption deliberately.
