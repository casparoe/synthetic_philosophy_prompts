          *   *Incidental:* Number 12 (historical accident), Unanimity vs. Supermajority (varies by jurisdiction, suggests flexibility).
          *   *Underdetermined:* The specific rules of evidence (could be more/less strict), the role of the judge (could be more active).
      *   **The Condorcet Counterfactual:** Build the "Maximally Condorcetian Jury" (50 people, independent research, secret ballot).
      *   **Comparison:**
          *   *What Condorcet gains:* Raw statistical probability of accuracy (if conditions met).
          *   *What it loses:* Accountability, Narrative Coherence, Community Buy-in, Protection against bias (independent research often means biased research).
          *   *The Critical Loss:* *Public Justification.* A verdict must be defensible to the defendant and the public. A secret ballot based on Googling cannot be defended.
      *   **Conclusion:** Summarize. The system prioritizes *legitimacy through shared reasoning* over *efficiency through statistical aggregation*.

