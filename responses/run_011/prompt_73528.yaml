      *(Refining the "Condorcet" critique)*: Condorcet assumes independence. Deliberation destroys independence. But deliberation *improves competence* (p). If deliberation raises p enough, it might offset the loss of independence. However, the info embargo lowers p (less info). So the trade-off is: Lower p (info) + Higher p (reasoning) - Independence = ? The system bets on the reasoning boost.

