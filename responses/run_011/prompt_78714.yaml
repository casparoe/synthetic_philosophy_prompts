answer: |-
  # SEMINAR HANDOUT: CONSTRUCTIVISM SORTING TREE
  **Week 3 | Philosophy of Mathematics**

  **Instructions:** Start at **Node 1**. Answer based on your mathematical intuition regarding the *scenario*, not on which school you think you belong to. Follow the arrows. Record your path to find your leaf.

  ---

  ### THE DECISION TREE

  **Node 1: The Unproven Conjecture**
  Consider Goldbach's Conjecture (every even integer >2 is the sum of two primes). We have no proof and no counterexample.
  *   **A:** It is already determinately true or false, regardless of our ability to find out. $\rightarrow$ **Go to 2**
  *   **B:** Its truth value is indeterminate until a proof or refutation is produced. $\rightarrow$ **Go to 3**

  **Node 2: The Irrational Power**
  We know that either $\sqrt{2}^{\sqrt{2}}$ is rational or it is irrational. In one case, $a=\sqrt{2}^{\sqrt{2}}, b=\sqrt{2}$ yields a rational $a^b$. In the other, $a=\sqrt{2}^{\sqrt{2}}, b=\sqrt{2}^{\sqrt{2}}$ yields $a^b=2$. We do not know which case holds.
  *   **A:** The existence of *some* pair $a,b$ is settled now, even if we can't name them. $\rightarrow$ **Leaf: Classical Platonism**
  *   **B:** The existence claim is empty until we identify the specific pair. $\rightarrow$ **Leaf: Hilbertian Formalism**

  **Node 3: The Halting Machine**
  Consider a Turing machine $M$ for which it is provably impossible that it runs forever.
  *   **A:** Therefore, $M$ must halt. $\rightarrow$ **Go to 4**
  *   **B:** We cannot assert it halts until we compute a bound on the stopping time. $\rightarrow$ **Go to 5**

  **Node 4: The Function Table**
  Consider any function $f: \mathbb{N} \to \mathbb{N}$.
  *   **A:** There could be functions that are not computable by any algorithm. $\rightarrow$ **Leaf: Dummettian Anti-Realism**
  *   **B:** All such functions are necessarily computable (recursive). $\rightarrow$ **Leaf: Markov's School (RUSS)**

  **Node 5: The Coin-Flip Real**
  Imagine a real number generated by an endless sequence of free coin flips (no pre-determined law).
  *   **A:** This is a legitimate mathematical object (a "choice sequence"). $\rightarrow$ **Go to 6**
  *   **B:** This is not a well-defined object; numbers must be lawlike. $\rightarrow$ **Go to 7**

  **Node 6: The Discontinuous Jump**
  Can you define a function on the reals that is 0 for $x<0$ and 1 for $x>0$?
  *   **A:** No. All total functions on the continuum are continuous. $\rightarrow$ **Leaf: Brouwer's Intuitionism**
  *   **B:** Yes. Continuity is a property, not a requirement of existence. $\rightarrow$ **Leaf: Brouwer's Intuitionism** *(Note: This node tests consistency; Brouwerians must answer A. If you answered B, return to 5.)*

  **Node 7: The Bisection Root**
  Let $f$ be continuous, $f(0)<0, f(1)>0$. Bisection gives a sequence of points within $2^{-n}$ of a root.
  *   **A:** This sequence *is* the root. The root exists. $\rightarrow$ **Go to 8**
  *   **B:** This gives approximations, but we cannot assert a specific $x$ exists where $f(x)=0$. $\rightarrow$ **Leaf: Markov's School (RUSS)**

  **Node 8: The Infinite Totality**
  Consider the set of all natural numbers $\mathbb{N}$.
  *   **A:** It is a completed, actual infinity. $\rightarrow$ **Leaf: Bishop-Style Constructivism (BISH)**
  *   **B:** It is only a potential infinity; we can always add one more. $\rightarrow$ **Leaf: Strict Finitism**

  **Node 9: The Meaning of 'Or'** (Alternative Path from 3)
  When you assert "$P$ or $Q$", what do you mean?
  *   **A:** One of them holds, even if I don't know which. $\rightarrow$ **Return to 1 (You are a Realist)**
  *   **B:** I must possess a method to decide which one holds. $\rightarrow$ **Go to 5**

  **Node 10: The Ideal Set** (Alternative Path from 2)
  Does a non-principal ultrafilter on $\mathbb{N}$ exist?
  *   **A:** Yes, by Zorn's Lemma. $\rightarrow$ **Leaf: Classical Platonism**
  *   **B:** No, it cannot be constructed. $\rightarrow$ **Leaf: Bishop-Style Constructivism (BISH)**

  ---

  ### THE LEAVES (SCHOOLS OF THOUGHT)

  1.  **Classical Platonism:** Mathematical objects exist independently of human thought. Truth outruns proof. (Path: 1A-2A or 1A-10A)
  2.  **Hilbertian Formalism:** Mathematics is a game of symbols. Existence is consistency. (Path: 1A-2B)
  3.  **Dummettian Anti-Realism:** Grounded in semantics. Meaning is use/verification. Logic is intuitionistic, but ontology is flexible. (Path: 1B-3A-4A)
  4.  **Markov's School (RUSS):** Recursive constructive mathematics. All objects are computable; Markov's Principle holds. (Path: 1B-3A-4B or 1B-3B-7B)
  5.  **Brouwer's Intuitionism:** Mathematics is mental construction. Accepts choice sequences and continuity principles. (Path: 1B-3B-5A-6A)
  6.  **Bishop-Style Constructivism (BISH):** Constructive proofs required, but no fixed ontology. Compatible with classical maths if interpreted via realizability. (Path: 1B-3B-5B-7A-8A or 1B-10B)
  7.  **Strict Finitism:** Even potential infinity is suspect. Only feasible numbers exist. (Path: 1B-3B-5B-7A-8B)

  ---

  ### INSTRUCTOR'S KEY: EMPTY CELLS & BLIND SPOTS

  **1. The Empty Cells (Combinations the tree makes available but nobody holds)**
  *   **Choice Sequences + Classical Truth (1A + 5A):** *Incoherent.* You cannot believe truth is independent of proof while believing objects are created by free mental choices.
  *   **Markov's Principle + Non-Computable Functions (3A + 4A):** *Unstable.* If you accept that "impossible not to halt" implies "halts," you are committed to a computational view of the universe. Accepting non-computable functions undermines the justification for Markov's Principle.
  *   **Brouwer's Continuity + Lawlike Only (6A + 5B):** *Unexplored/Incoherent.* The continuity principle in Intuitionism relies on the spread of choice sequences. Without choice sequences, the justification for "all functions are continuous" collapses.

  **2. Indistinguishable Leaves (Where the tree fails to separate)**
  *   **Bishop (BISH) vs. Classical Platonism:** On finite combinatorics and concrete analysis, these two often produce identical theorems. The tree separates them on *ontology* (Nodes 1, 8, 10), but a student who works only on finite problems may land in either leaf without changing their daily practice.
  *   **Dummett vs. Brouwer:** Both reject LEM and accept intuitionistic logic. The tree separates them via *computability* (Node 4) and *semantics* (Node 9). However, in practice, their mathematical output is nearly identical. The distinction is purely philosophical (Semantics vs. Mental Construction).
  *   **Markov (RUSS) vs. Bishop (BISH) on IVT:** Both reject the classical IVT. Markov rejects it because the root might not be computable; Bishop rejects it because the function might not have a modulus of continuity. The tree separates them at Node 7, but a student might answer based on technical knowledge of the counterexample rather than philosophical commitment.

  **3. Note on Node 6 (The Trap)**
  Brouwerians *must* answer **A** (No discontinuous jumps). If a student answers **B** here after choosing Choice Sequences, they have inconsistent commitments. This is a useful diagnostic for "Label Drift" (students claiming Intuitionism while holding Classical views on functions).
