answer: |-
  **Title:** Simulated Futures: A Decision-Theoretic Analysis of Longtermism under the Simulation Hypothesis

  **Project Summary**

  The core claim of longtermism is that the potential magnitude of the future dominates the expected value of our present actions. If the future is vast, securing its trajectory is paramount. However, the Simulation Hypothesis (SH)—the proposition that we are likely living in a computer simulation run by a post-human civilization—is often thought to undermine this view. The standard objection holds that if we are simulated, the future is likely shorter, our causal leverage over the base reality is null, and the simulation could be terminated arbitrarily. Consequently, far-future interventions lose their force.

  This objection is too quick. It runs together three distinct structural channels that pull in opposite directions. First, a simulation is likely temporally shorter than the base reality running it (negative for longtermism). Second, simulated inhabitants have less unmediated causal control over the broader cosmos (negative for longtermism). But third, our being simulated is itself evidence that some civilizations survive long enough to compute ancestor simulations (positive for longtermism). Currently, nobody has asked whether these factors cancel out. It is assumed that the negative constraints dominate, but without formal analysis, this remains an intuition pump rather than a settled fact.

  **The Research Question**

  This project asks a single, precise question: **Does conditionalizing on a non-negligible credence in the Simulation Hypothesis structurally diminish the expected utility of interventions aimed at securing the far future, relative to a Base Reality baseline?**

  This question is determinate. It does not ask whether we *are* simulated—an empirical metaphysical question that may be undecidable. It asks whether the *possibility* of simulation changes the rational choice matrix for longtermist action. The answer will be a comparative ratio of expected utilities: EV(Intervention | SH) vs. EV(Intervention | Base Reality).

  **Why Existing Frameworks Do Not Settle This**

  Neither standard longtermism nor its standard objections settle this question. Longtermism typically assumes a physicalist ontology where causal chains extend indefinitely. It lacks the machinery to weight values across ontological layers. Conversely, standard objections to longtermism focus on epistemic limitations—the claim that we cannot foresee the long-run effects of our acts. This project bypasses epistemic unpredictability to focus on structural constraints. Even if we could perfectly predict the future within our horizon, the *value* of that future changes if the horizon itself is ontologically constrained. The tension between the "survivorship evidence" channel and the "causal leverage" channel creates a specific theoretical gap that existing normative frameworks ignore.

  **Methodology: Decision Theory, Not Empiricism**

  The appropriate method for this project is formal decision theory, not empirical investigation. An empirical approach would attempt to verify the Simulation Hypothesis through physics or computation. This is misguided for two reasons. First, verification may be impossible by design; a perfect simulation is empirically indistinguishable from base reality. Second, even if verification were possible, it would not tell us how to act *now*, under uncertainty.

  We require normative guidance given metaphysical uncertainty. Decision theory provides the tools to model agents maximizing expected utility under competing hypotheses with assigned credences. I will construct a formal model treating "Base Reality" and "Simulation" as distinct states of the world. The model will parameterize the three channels: duration distributions, causal leverage coefficients, and Bayesian updates on civilization longevity. By solving for the expected utility across these parameters, we can determine if the simulation objection holds robustly or only under specific, perhaps unrealistic, parameterizations. This is a project about rational choice under ontological uncertainty, not about discovering the texture of reality.

  **Outcomes and Criteria for Failure**

  A successful result will be a formal proof demonstrating whether EV(Intervention | SH) is strictly less than, equal to, or greater than EV(Intervention | Base Reality) under standard priors. Ideally, this will yield a threshold function: "Longtermism remains robust provided the probability of simulation is below X and the estimated duration ratio is above Y."

  Failure would occur if the model proves mathematically incoherent—for instance, if "causal leverage" across simulation layers cannot be defined consistently within utility theory. A specific form of success is dissolution: demonstrating that the question relies on category errors, such as conflating computational substrate with moral value. If the analysis shows that the distinction between "simulated" and "base" futures is morally irrelevant given certain decision-theoretic frameworks (e.g., evidential decision theory), the project succeeds by dissolving the problem rather than solving it.

  **Work Plan**

  The one-year fellowship will be divided into four blocks:

  1.  **Formalization (Months 1-3):** Define the state space, utility functions, and credence distributions. Review existing literature on anthropic reasoning and simulation credences to establish standard priors.
  2.  **Modeling the Channels (Months 4-6):** Construct the specific sub-models for duration, causal leverage, and survivorship evidence. Integrate these into the main expected utility function.
  3.  **Sensitivity Analysis (Months 7-9):** Test the model against varying parameters. Determine the robustness of the result across different decision-theoretic frameworks (causal vs. evidential).
  4.  **Synthesis and Dissemination (Months 10-12):** Draft the final monograph and prepare two journal articles. Present findings at workshops on existential risk and metaphysics.

  This project offers a rigorous test of a major objection to longtermism. By committing to a decision-theoretic method, it bypasses unresolvable metaphysical debates to deliver actionable normative conclusions.
