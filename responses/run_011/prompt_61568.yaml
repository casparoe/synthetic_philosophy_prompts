  Been reading LW/OB and the various rationalist-adjacent forums since about 2011, mostly lurking, and I've somehow let myself get talked into giving a talk at a reading group that is emphatically not a rationalist space. Composition: about a dozen people. Half are post-training / RLHF engineers from a lab down the road. One historian of computing who works on 1950s British cybernetics. Two developmental psychologists. Two or three analytic philosophers of mind. Nobody is a Turing specialist, nobody has the paper memorized, and I'd bet the engineers have read the first two sections at most. 30 minutes plus Q&A, Tuesday. Also: I don't have time to go read anything before then, so please don't hand me citations or a bibliography — I want arguments and phrasings, not references.

  My thesis. Everyone in ML treats Turing's 1950 child-programme idea as a cute anticipaton of RLHF: rather than trying to program the adult mind directly, build something childlike and then put it through a course of education using rewards and punishments. I think that reading is wrong in a way that matters, because that stretch of the paper describes two nested loops and the field has only built one of them.

  Loop 1 — a teacher applies reward and punishment to a machine it does not need to understand. The teacher operates entirely at the behavioural interface and doesn't care how the structure underneath got there.

  Loop 2 — the designer searches over candidate *child* structures, and here's the part I think everyone skips: Turing frames this with the genetical/evolutionary analogy, where what selection acts on is the initial structure's educability rather than the trained behaviour it eventually produces. He also likens the child's mind to a blank notebook with rather little mechanism in it, which I read as the same point from the other direction — most of the content comes from the education, so what you're actually designing is small, and its whole job is to be teachable.

  So the claim: modern practice collapses loop 2 into loop 1. We pick architectures, data mixtures, and hyperparameters on the basis of post-training benchmark performance, which is exactly the measure loop 2 is supposed to be independent of. That's not a historical quibble, it's a live cost — it's a good part of why there's no principled account of which starting structures make the education process converge at all, and why "it trains" and "it's the right structure" have quietly become the same sentence. And it implies a research program nobody's run: search over child structures under selection criteria that are deliberately not final performance (sample efficiency, sensitivity to reward misspecification, how much the teacher has to know, etc.).

  What I want from you is the prep sheet, not a defense of the thesis.

  1. The eight-ish objections I'll actually get from *this* audience, ordered by how much damage each does, numbered. Not the objections a LessWrong crowd would raise — no inner alignment / mesa-optimizer detours. Give me the engineer version, the historian version, the psych version and the philosopher version, tagged with who raises it, and phrased the way that person would actually say it in a room rather than in a journal.
  2. For each one, a two-minute reply I can deliver out loud without notes, plus an honest one-liner on where that reply is soft or quietly begs the question.
  3. What I should concede in the first five minutes so certain objections stop being available. I expect to lose the anachronism fight unless I frame it right, so give me the version of that objection that actually hurts — not the strawman — and the framing that defuses it.
  4. The question I'm praying nobody asks, and why it's the one that could sink the whole talk.

  Be concrete: if an objection turns on a fact about how architecture selection and pre-training are actually done today, state the fact. And if you think my two-loop reading of the child-programme section is a stretch — if the text doesn't really support an outer loop that's independent of trained performance — put that in as one of the numbered objections with its own reply. Don't bury it to be nice to me.

  Final line of your answer, on its own, in exactly this form: \answer{short name of the single objection I'm most likely to lose on, ten words or fewer}
