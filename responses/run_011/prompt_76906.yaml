answer: |-
  # Assembling the Monster: The Special Composition Question in *Frankenstein*

  Mary Shelley's *Frankenstein* (1818) offers a rare narrative laboratory for the Special Composition Question (SCQ). The novel centers on a protagonist who explicitly attempts to manipulate the conditions under which parts compose a whole. By placing the text alongside unrestricted composition, mereological nihilism, and Peter van Inwagen's composition-as-life view, we can test whether Shelley's horror is ontological or merely causal. The following reading examines the creature's mereological status through four specific lenses, concluding with an assessment of the project's limits.

  ### 1. Assembly and Animation: Ontological or Causal?

  Before the animation scene, Victor Frankenstein collects body parts from charnel houses and dissecting rooms. On the view of unrestricted composition (universalism), these parts compose an object—the "creature"—the moment they are juxtaposed, regardless of their functional integration. There is a sum of parts arranged creature-wise before the spark. Mereological nihilism denies this; there are only simples arranged in a specific pattern, but no composite object exists until, arguably, never. Van Inwagen's view offers the most nuanced friction: composition occurs only when the activities of the parts constitute a life. Before animation, the parts are dead; therefore, on van Inwagen's account, no organism exists. There are only particles arranged corpse-wise.

  The novel describes the frame as physically complete before the influx of vitality. Victor speaks of bestowing animation upon "lifeless matter." This phrasing suggests a causal event rather than an ontological one. He treats the body as a vessel waiting to be filled, implying the object exists prior to the life. However, the horror of the scene suggests an ontological transgression. When the creature opens its eye, Victor flees. If the object existed beforehand, why is the moment of life the moment of horror? Shelley seems uncommitted here. The text allows for a materialist reading where life is a chemical property added to an existing structure, but the narrative weight falls on the animation as a genesis. This ambiguity is not evasive; it preserves the tension between the creature as a manufactured artifact and the creature as a born being. If Shelley committed to pre-existence, the creature would be a statue coming to life (Pygmalion); if she committed to strict ontological emergence, the creature would be a pure spirit. By remaining loose, she allows the creature to be both a product of labor and a spontaneous generation, destabilizing the boundary between making and begetting.

  ### 2. The Artifact Problem

  Van Inwagen's view entails a striking consequence: there are no artifacts. Chairs and tables do not exist as composite objects; only living organisms and simples do. The creature presents a catastrophic counter-example to this binary. He is paradigmatically made—a patchwork of stolen materials—yet he is also paradigmatically alive—he eats, bleeds, learns, and suffers. On van Inwagen's view, the creature should not exist as a composite until the life begins, at which point he becomes an organism. But his origin as an artifact haunts his ontology.

  Does the novel exploit this gap? The creature's self-conception suggests he does. He reads *Paradise Lost* and identifies as Adam, yet notes he is "wretched, helpless, and alone," unlike Adam who was created by God, not stitched by man. The creature occupies the gap between artifact and organism. He is a made thing that *becomes* a life. This challenges van Inwagen's strict separation because the creature's life seems dependent on his artificial arrangement. A natural organism's parts grow together; the creature's parts were joined by wire and thread. The novel suggests that the "life" van Inwagen requires is not sufficient for full ontological standing if the history of composition is artificial. Shelley seems to notice that being manufactured stains the being, even if life is present. The creature is not just a living thing; he is a living artifact. The novel exploits the gap to generate pathos: the creature has the metaphysical status of a human (organism) but the social status of a tool (artifact). He is a person who cannot be recognized as such because his mereological history is industrial.

  ### 3. The Orkney Scene: Murder or Dismantling?

  In the Orkney Islands, Victor begins constructing a female companion but destroys her before animating her, while the creature watches from the window. (I am proceeding with the 1818 text, where the destruction occurs before animation; some later adaptations vary on this timing). This scene forces a decision on the moral status of unanimated composites.

  If unrestricted composition is true, Victor destroys an object—a sum of parts arranged female-creature-wise. If nihilism is true, he merely scatters simples. If van Inwagen is true, he destroys nothing, because without life, there is no being to kill. The creature, however, reacts as if a murder has occurred. He screams in despair, interpreting the dismantling as the death of a promise and a peer. The novel leaves the ontological status indeterminate to heighten the ethical horror. Was it murder? Legally and biologically, no, because she never lived. Metaphysically, on van Inwagen's view, no, because no life was caught. But the creature's grief suggests a third category: the destruction of a potential person.

  Completeness does not matter to Victor; only animation does. He fears the consequences of a living race of monsters. But for the creature, the completeness of the form mattered because it represented the possibility of recognition. There is a sharp asymmetry here compared to Victor's death at the end of the novel. When Victor dies on Walton's ship, he dies as a whole organism. The creature mourns over his body, acknowledging a relationship between two living beings. The female creature dies as scraps; Victor dies as a man. The text marks this asymmetry to show that Victor retains his humanity (his status as a natural organism) even in death, while the female is denied even the potentiality of that status. The horror of the Orkney scene is not just the betrayal, but the reduction of a potential subject back into objects.

  ### 4. Recognition-Dependence

  Your proposal of "recognition-dependence" suggests that composition into a *person* requires being addressed by another person and answering. This shifts the SCQ from a physical condition to a social one. Does the novel support this? There is significant textual evidence. The creature's development accelerates only when he observes the cottagers and learns language. His demand for a companion is not merely for happiness but for existence; he argues he cannot be a singular exception in nature. He says, in effect, that without a peer, he is a monster, but with one, he could be a species.

  However, is this metaphysical or ethical? If composition depends on recognition, then the creature did not exist as a person until De Lacey spoke to him (which he fails to do) or until Victor addressed him. This makes composition mind-dependent. The cost is high: it implies that solitude entails ontological diminution. If no one recognizes me, am I not a whole person? The novel flirts with this. The creature is fragmented by isolation; his narrative is an attempt to assemble himself through language addressed to Walton. Yet, Shelley seems to ground his personhood in his capacity for suffering, not just in being recognized. He feels pain before he is spoken to. Therefore, recognition-dependence works better as an ethical claim wearing metaphysical clothing. It describes the conditions for *social* existence, not mereological composition. To treat it as strict metaphysics risks idealism that the text's materialist horror resists. The creature is composed of flesh regardless of Walton's attention, but he becomes a *moral agent* through address. The novel supports the view that personhood is dialogic, but it anchors that personhood in a physical reality that persists without an audience.

  ### 5. Breakdown and Critique

  Where does this reading break down? There are three points of friction where the metaphysical framing risks distorting the literary text.

  First, Shelley resists the reification of the creature. The novel is deeply concerned with *who* the creature is, not *what* he is. By focusing on the SCQ, we risk repeating Victor's own failure. Victor's sin is treating a potential subject as an object of assembly. A metaphysical reading that asks "under what conditions do these parts compose a thing?" may inadvertently adopt Victor's gaze, analyzing the creature as a problem of material arrangement rather than a subject of rights. The objection that this repeats Victor's failure does not defeat the project, but it must be absorbed as a critical warning. The reading is useful precisely because it exposes the horror of Victor's metaphysics: he treats the SCQ as a technical problem to be solved, ignoring the ethical consequences of the answer.

  Second, a metaphysician would argue the novel is merely loose. Shelley uses "life" and "animation" interchangeably with "existence." Van Inwagen requires precise criteria for "life" (self-organizing biological events). The creature's galvanic animation is scientifically vague. If the creature is a magical construct, standard mereology may not apply. The text relies on Romantic vitalism, not analytic ontology.

  Third, a literary critic might argue this ontological framing is tone-deaf. The horror of *Frankenstein* is not that we are unsure if the creature exists, but that society refuses to acknowledge his humanity. Focusing on the moment of composition distracts from the novel's critique of abandonment and prejudice. The "recognition-dependence" hypothesis risks blaming the creature's incompleteness on a lack of social uptake, rather than on society's violent rejection.

  Ultimately, the project holds if it remains diagnostic rather than constitutive. We should not use the SCQ to determine what the creature *is*, but to analyze what Victor *thinks* he is doing. The novel shows the catastrophe that occurs when one applies a nihilist or universalist mereology to human life. Victor acts as if he can assemble a person without acknowledging the metaphysical weight of life. The reading breaks down only if we forget that Shelley's ultimate answer to the SCQ is not a theory of parts, but a theory of responsibility. The creature exists because he suffers, and he demands that his composition be acknowledged not as a sum of parts, but as a claim on the world.
