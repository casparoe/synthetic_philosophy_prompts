answer: |-
  # The Long-Horizon Adjustment Procedure (LHAP)

  **Purpose:** To modify the standard 4% real discount rate for projects with horizons exceeding 50 years where uncertainty or intergenerational equity renders a constant rate misleading, while preventing analysts from manipulating inputs to achieve a desired Net Present Value (NPV).

  **User:** Investment Analyst (Standard Spreadsheet).
  **Time Allowance:** 4 Hours max.

  ## Part 1: The Decision Protocol

  ### Step 1: The Horizon Gate
  **Question:** Does the project have material costs or benefits occurring more than 50 years from appraisal date?
  *   **No:** Stop. Use the standard 4% constant rate. Proceed to normal appraisal.
  *   **Yes:** Proceed to Step 2.

  ### Step 2: Rate Decomposition & Input Selection
  *Do not calculate these values. Select them from the Central Guidance Table (CGT-04).*
  The 4% baseline is decomposed as:
  1.  **Pure Time Preference ($\rho$):** 0.5% (Fixed ethical parameter).
  2.  **Elasticity of Marginal Utility ($\eta$):** 1.5 (Fixed ethical parameter).
  3.  **Expected Per-Capita Growth ($g$):** 2.5% (Baseline economic forecast).

  **Action:** Confirm the project falls under **Uncertainty Class A, B, or C** using the checklist below. This determines the long-term rate schedule.
  *   **Class A (Standard):** Economic growth drivers are uncorrelated with project outcomes. (e.g., Port expansion).
  *   **Class B (Correlated):** Project value depends on economic growth continuing (e.g., Tourism infrastructure).
  *   **Class C (Decoupled):** Project value is independent of or inversely correlated to economic growth (e.g., Disaster relief, existential risk reduction, basic ecological life-support).

  **Stopping Point:** If you cannot definitively classify the project using the CGT-04 checklist, **escalate to the Board**. Do not guess.

  ### Step 3: The Term Structure (The "Declining Rate" Rule)
  *To address your colleague's objection: You do not choose the rate. The Horizon and Uncertainty Class choose it.*

  Apply the following **Certainty Equivalent Rates** to the cash flows based on the year they occur. Use the lookup table below.

  | Year of Cash Flow | Class A Rate | Class B Rate | Class C Rate |
  | :--- | :--- | :--- | :--- |
  | 0 – 50 | 4.0% | 4.0% | 4.0% |
  | 51 – 100 | 3.5% | 3.8% | 3.0% |
  | 101 – 200 | 3.0% | 3.5% | 2.0% |
  | 201 – 500 | 2.5% | 3.0% | 1.0% |
  | 500+ | 2.0% | 2.5% | 0.5% |

  **Instruction:** In your spreadsheet, apply the rate corresponding to the *year* of the cash flow. Sum the discounted values.
  **Output:** This sum is your **Single Present Value Figure**. Do not report an "average rate." Report the PV derived from this schedule.

  ### Step 4: Non-Market & Scarcity Adjustment
  *Problem:* Environmental benefits (clean air, stability) become scarcer as the economy grows. Discounting them at the standard rate double-counts this scarcity (once in the rate via growth, once in the physical decline).
  **Question:** Are the primary benefits non-market goods expected to become relatively scarcer over time (e.g., carbon capacity, biodiversity, radiological safety)?
  *   **No:** Proceed to Step 5.
  *   **Yes:** Apply a **Scarcity Uplift** to the *benefit quantity*, not the discount rate.
      *   **Rule:** Increase the nominal value of the non-market benefit by 1% per annum compound, *before* discounting.
      *   **Cap:** Do not apply uplift beyond Year 100. (Assumes technology substitutes scarcity after this point).
      *   **Source:** Use the Shadow Price Schedule (SPS-02) for the base value.

  ### Step 5: Hazard & Probability Treatment
  *Problem:* Low-probability, high-consequence events (e.g., repository leak) are often "risk-adjusted" by inflating the discount rate. This is incorrect.
  **Question:** Does the project involve a stochastic hazard (probability of failure/loss) rather than a certain cost?
  *   **No:** Proceed to Step 6.
  *   **Yes:** Calculate **Expected Annual Loss (EAL)**.
      *   **Formula:** $EAL = \text{Consequence Cost} \times \text{Annual Probability}$.
      *   **Instruction:** Enter the EAL as a cost stream in the spreadsheet. Discount using the Step 3 Term Structure.
      *   **Prohibition:** Do not add a "risk premium" to the discount rates in Step 3.

  ### Step 6: Irreversibility & Option Value
  *Question:** Is the investment largely irreversible, and is there a reasonable expectation that information regarding costs/benefits will improve significantly within 5 years?
  *   **No:** Proceed to Final Calculation.
  *   **Yes:** Calculate the **Value of Waiting**.
      *   **Approximation:** If the NPV is positive but less than 10% of total capital cost, and the uncertainty is high (Class C), flag the project as **"Deferrable."**
      *   **Recommendation:** Recommend a pilot or delayed commitment rather than full capital spend.

  ### Step 7: Final Calculation
  1.  Sum discounted costs (using Step 3 rates).
  2.  Sum discounted benefits (using Step 3 rates + Step 4 Uplift if applicable).
  3.  **Net Present Value = Total Benefits - Total Costs.**
  4.  **Sign-off:** This single number goes to the Minister.

  ---

  ## Part 2: Escalation Triggers

  *If any of the following occur, stop the arithmetic. Draft a one-page memo to the Board.*

  1.  **Intergenerational Weighting:** The project transfers significant net costs to generations beyond 100 years (e.g., waste storage) without their consent. The discount rate cannot solve the ethics of imposing risk on the distant future.
  2.  **Distributional Conflict:** The costs are borne by a specific vulnerable demographic while benefits accrue to the general treasury. (Standard CBA ignores this; the Board must decide if equity weights apply).
  3.  **Existential Uncertainty:** The project relies on a technology or economic assumption that, if false, renders the model meaningless (e.g., growth rates > 3% indefinitely).
  4.  **Motivated Classification:** If the Project Sponsor pressures you to classify a project as "Class C" (lowest discount rate) to force a positive NPV, escalate. The Class definition is audit-ready.

  ---

  ## Part 3: Candidacy Note (For Your Eyes Only)

  *You asked where the judgment calls hide.*
  1.  **The Lookup Table (Step 3):** The specific rates (2.0%, 0.5%, etc.) are not derived from market data. They are political compromises masquerading as mathematical certainty. They represent a decision that the distant future matters *more* than the 4% rule implies, but not *infinitely* more.
  2.  **The Scarcity Cap (Step 4):** Limiting the uplift to 100 years is arbitrary. It assumes technology will solve scarcity. That is a faith-based assumption, not a technical one.
  3.  **The Uncertainty Classes:** Distinguishing between Class A and Class C is often subjective. A flood defense (Class C?) protects property (Class A?). The analyst's classification effectively sets the rate, despite the lookup table.

  ---

  ## Part 4: Case Applications

  ### Case 1: Deep Geological Repository (Waste)
  *   **Horizon:** 10,000 years. (Triggers Step 1 & 3).
  *   **Uncertainty Class:** **Class C**. The hazard is independent of economic growth; a crash in GDP does not reduce radiological toxicity.
  *   **Discount Schedule:** Starts at 4%, declines to 0.5% after Year 500.
  *   **Hazard Treatment (Step 5):** The release pathway is low probability. We calculate the Expected Annual Loss (Probability $\times$ Cleanup/Health Cost) and discount that stream. We do *not* inflate the discount rate.
  *   **Non-Market (Step 4):** Safety is a non-market good. Apply 1% scarcity uplift to the *cost of failure* (valuing future safety higher) for the first 100 years.
  *   **Result:** The steep decline in the discount rate (to 0.5%) drastically increases the present value of avoiding future costs. The NPV turns **Positive**.
  *   **Verdict:** **Proceed.**
  *   **The Ethical Cliff:** This case turns on a value judgment no technical apparatus can settle. By using a 0.5% rate for years 500–10,000, we are asserting that the welfare of people living in the year 7024 is worth almost as much as the welfare of people living today. The 4% rule asserted they were worth almost nothing. The LHAP asserts they matter. The Minister must sign off on the moral weight of the distant future, not just the arithmetic. The math cannot justify the morality.

  ### Case 2: Coastal Peatland Restoration
  *   **Horizon:** 300 years. (Triggers Step 1 & 3).
  *   **Uncertainty Class:** **Class C**. Carbon storage and storm surge protection are life-support functions, decoupled from GDP growth.
  *   **Discount Schedule:** Declines to 1.0% by Year 200.
  *   **Non-Market (Step 4):** Carbon and flood defense are scarce environmental goods. Apply 1% annual scarcity uplift to benefit values for first 100 years.
  *   **Result:** The combination of the declining discount rate (making long-term benefits valuable) and the scarcity uplift (making environmental benefits valuable) overwhelms the upfront cost. The NPV is **Strongly Positive**.
  *   **Verdict:** **Proceed.**
  *   **Note:** This validates the physical engineering. The 4% rule failed because it treated carbon storage in Year 200 as economically irrelevant. The LHAP corrects this without allowing the analyst to pick a rate.

  ### Case 3: National Antiviral Stockpile
  *   **Horizon:** 50 years. (Borderline Step 1).
  *   **Analysis:** The horizon is exactly at the gate. However, the replenishment costs occur every decade, pushing the *effective* horizon beyond 50 years. We apply the Step 3 schedule (Class C - health security).
  *   **Hazard Treatment:** Pandemic probability is low (e.g., 2% per year). Consequence is high (economic shutdown).
  *   **Option Value (Step 6):** Technology is improving. Vaccine platforms change rapidly.
  *   **Calculation:**
      *   Benefits: Avoided economic loss (Expected Value).
      *   Costs: Upfront + Replenishment.
      *   Discounting: Even with the favorable Class C declining rate, the *probability* of a pandemic is low enough that the Expected Annual Benefit is smaller than the Certain Annual Cost of maintenance and replenishment.
      *   Option Value: Waiting 5 years for a universal platform technology reduces the replenishment cost significantly.
  *   **Result:** The NPV is **Negative**. The Value of Waiting exceeds the NPV of immediate full-scale deployment.
  *   **Verdict:** **Do Not Proceed (Full Scale). Recommend R&D Pilot.**
  *   **The Unwelcome Verdict:** This is the verdict the Parliamentary Committee will not welcome. They want to be seen as "prepared." The arithmetic shows that full stockpiling is economically inefficient insurance; it is consumption, not investment. The procedure forces you to tell them that buying this insurance is a net loss to the treasury in expected value terms. They will argue that "you can't put a price on lives." The procedure replies: "We just did, using the standard shadow price, and it still didn't pass."

  ---

  ## Summary for the Board

  1.  **The Procedure:** It replaces the "Constant 4%" with a "4% Base + Declining Long-Term Schedule" determined by project classification, not analyst preference. This answers the motivated reasoning objection by removing analyst discretion on the rate itself.
  2.  **The Unwelcome Truth:** The Antiviral Stockpile fails. It is insurance, not investment. CBA treats it as the latter. The Committee must decide if they are willing to fund a negative-NPV project for political reassurance.
  3.  **The Ethical Limit:** The Repository passes, but only because we implicitly decided that people 5,000 years from now matter nearly as much as people today. That is not a calculation; it is a moral stance. The Minister must own that stance, not the spreadsheet.
