  6.  **Addressing Specific Technical Requirements:**

      *   *Decomposition:* $\rho, \eta, g$.
      *   *Uncertainty:* Weitzman's declining certainty equivalent rate.
      *   *Non-market:* Scarcity uplift (shadow price), not rate change.
      *   *Hazard:* Expected value calculation, not rate loading.
