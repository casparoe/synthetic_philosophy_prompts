      *   **Tone:** Professional, pragmatic, candid, operational. No literature reviews or citations.

  2.  **Develop the Decision Procedure (The "Protocol"):**

      *   *Goal:* Balance flexibility for long-term projects with rigidity to prevent gaming.
      *   *Structure:* A flowchart logic translated into text.
      *   *Step 1: The Gatekeeper (Horizon Check).* Don't complicate short-term projects. If horizon < 50 years, stick to 4%. This addresses the colleague's fear of widespread gaming.
      *   *Step 2: Decomposition.* The 4% needs to be broken down to allow adjustment. Standard Ramsey Rule: $r = \rho + \eta g$.
          *   $\rho$ (Pure Time Preference): Ethical. Keep fixed (e.g., 0.5% or 1%).
          *   $\eta$ (Elasticity): Ethical/Technical. Keep fixed (e.g., 1.5).
          *   $g$ (Growth): The variable. This is where uncertainty matters.
      *   *Step 3: Uncertainty & Declining Rates.* Address the Weitzman effect. If there is significant uncertainty about long-term growth, the effective discount rate declines. *Constraint:* Use a pre-approved lookup table for $g$ uncertainty to prevent analysts from picking their own volatility parameters.
      *   *Step 4: Non-Market/Scarce Benefits.* If benefits are environmental/health and expected to become scarcer relative to consumption, adjust the *value* of the benefit, not the discount rate (to avoid double counting). Use a "scarcity uplift" factor based on projected income elasticity of demand for that specific good.
      *   *Step 5: Hazards & Probabilities.* Distinguish between discounting time and discounting risk. Low probability/high consequence events must be modeled via expected value (Probability $\times$ Consequence) *before* discounting. Do not use a higher discount rate to "risk-adjust."
      *   *Step 6: Irreversibility/Option Value.* If the decision is irreversible and information is improving, calculate the "Value of Waiting." If Value of Waiting > NPV(Now), recommend deferral.
      *   *Step 7: Collapsing to a Single Number.* The Minister needs one PV. Calculate the NPV using the schedule of rates derived from Steps 2 & 3. Report that NPV. Report the "Equivalent Constant Rate" (the rate that would yield the same NPV if applied constantly) for transparency.
      *   *Escalation Triggers:* When does the analyst stop? When parameters require ethical choices outside the mandate (e.g., weighting future generations differently).

  3.  **Refining the Procedure for the "Motivated Reasoning" Objection:**

      *   To stop analysts from "backing into" rates, the inputs ($\rho, \eta, g$) must come from *central* guidance, not project-specific assumptions. The only project-specific input should be the *classification* of the benefit (market vs. non-market) and the *risk profile* (probability of failure).
      *   *Crucial Mechanism:* The "Declining Rate Schedule" is not chosen by the analyst. It is triggered by the *time horizon* and *uncertainty class* (Low/Med/High) determined by a checklist, not a formula the analyst tunes.

