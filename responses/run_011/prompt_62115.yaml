      *   *Input:* Standard 4% is $\rho=1\%, \eta=1, g=3\%$. (Roughly). Let's standardize: $\rho=0.5\%$, $\eta=1.5$, $g=2.5\% \rightarrow 0.5 + 1.5(2.5) = 4.25\%$. Close enough. Let's set the baseline components for the procedure.
