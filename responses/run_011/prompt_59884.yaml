prompt: |-
  I run a 90-minute internal workshop for a data/product team at a health system — twelve-ish engineers and analysts, no philosophy background whatsoever, except one who has a psych masters and will be the problem. We're building a chatbot-style triage thing that screens primary care patients for depression and anxiety risk and flags them for nurse follow-up. My job in this session is to get them to take Hacking's looping effects / "making up people" seriously enough that they stop treating the label their model spits out as a measurement. I know the material, don't explain it to me — plan how *I* explain it, whiteboard only, no slides.

  What I need from you:

  The order the pieces go in, and what each piece depends on. I want interactive kinds to land as a claim about kinds and criteria, not as a feel-good claim about labels hurting people's feelings, and I honestly don't know how to get them there without first giving them something they'd accept as obviously true. Tell me what that first thing is.

  The carrying example. I was going to use multiple personality, since it's Hacking's own and it's dramatic, but I'm worried they'll spend the whole hour arguing about repressed memory and walk away thinking this is a story about bad therapy in the 80s. I also don't want anything where the moral politics is loud — the second they hear "your model is politically biased" the room shuts down and I get a compliance lecture instead of a discussion. So: keep MPD or swap it? And if swap, to what — spell out what the example has to have and what it absolutely can't have, because I want to be able to check your suggestion against the criteria rather than just take it.

  Their misconceptions, in the order they'll actually surface, and the point in the sequence where I head each one off. My predicted list: (1) this is just the labeling/placebo effect on individuals; (2) it's a data-quality problem fixable by retraining on fresher data; (3) the psych guy says "so you're telling me depression isn't real" and half the room thinks he's won; (4) the worst one — someone says "yeah we know about feedback loops, we monitor for drift," and considers the topic closed. For (4) I need a way to show that what loops in Hacking's sense isn't what drifts in theirs: the extension and the criteria move, not just the frequencies. If you've got a crisper formulation of that than the sentence I just wrote, give it to me verbatim, plus the two-minute demo that goes with it.

  An idea I want to end on, which is mine and not Hacking's, so tell me straight if it's incoherent: I want them to see their own product as a loop that either settles into a fixpoint — the category stabilizes because people converge on the script the flag hands them — or drifts, where every retraining quietly moves what the flag means and it never comes back. Then ten minutes on which design choices push toward which. Is fixpoint-vs-drift a real distinction here, or am I just rebranding stability versus instability with philosophy vocabulary? If it's real, what has to have been said earlier in the session for it to be intelligible to this room at all.

  One closing question I can ask them that they cannot possibly answer correctly if all they took away was "classifiers can be biased."

  And what I should openly refuse to get into, announced as such to the room. I'm guessing the human-kinds-versus-natural-kinds debate and anything about his nominalism, but you tell me, and tell me the one sentence I use to wave it off.

  Finish with a line starting "Verdict:" that says whether I keep multiple personality as the example or swap it, and if swap, names the replacement in five words or fewer.
