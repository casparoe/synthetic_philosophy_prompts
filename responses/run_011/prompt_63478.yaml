answer: |-
  **Scenario**

  She is running a final consistency pass on a manuscript using a macro she wrote five years ago, a tool renowned in her small press for catching variable-name drifts nobody else sees. She spots a drift: "Project Orion" in chapter 4, "Orion Project" in chapter 12. She corrects chapter 12, saves the file, and triggers the macro to verify the fix. The macro runs, flags a conflict: "Orion Project" still exists in the metadata index. She opens the index, sees the string, and corrects the metadata tag. She saves, triggers the macro. It flags the conflict again: "Project Orion" in the metadata. She corrects it back. She saves, triggers the macro. It flags "Orion Project" again.

  She is visibly brilliant inside the loop: while correcting the metadata, she notices and resolves a cascading dependency where changing the tag alters the auto-generated table of contents, requiring her to re-paginate three subsequent chapters to keep the running heads aligned. She carries every relevant belief: she knows the macro runs on trigger, she knows she saved successfully, she knows the metadata is editable, and she knows the press style guide demands consistency. The perturbation is the macro's sorting algorithm, which she authored to alphabetize index entries; it automatically swaps "Orion Project" to "Project Orion" upon save, then flags the deviation from the original input string as a new error. It never accumulates evidence because the error code changes slightly with each swap (Error 404 vs. Error 405), leading her to believe she is chasing distinct, cascading glitches rather than a single reset.

  **Walkthrough**

  1.  **Visible Intelligence:** During the second pass, she doesn't just fix the string; she manually recalculates the pagination impact of the metadata change on the table of contents, solving a complex layout puzzle that would stump a junior editor. This proves she isn't zoning out; she is fully engaged in high-level problem solving.
  2.  **Relevant Beliefs:** On Pass 1, she believes: The text is wrong, the macro is accurate, the save functioned. On Pass 2, she believes: The metadata was wrong, the macro found a deeper layer, the save functioned. On Pass 3, she believes: The macro is finding a third inconsistency, the system is complex. At no point does she hold a false belief (the macro *is* flagging a difference) or lack a fact (she has access to the code, though she doesn't consult it).
  3.  **The Perturbation:** The macro's auto-sort function. It resets the state of the index to the "error" condition immediately after she fixes it. It doesn't accumulate evidence because the error codes increment (404, 405, 406), simulating progress rather than repetition. She interprets the changing codes as evidence of a deep, multi-layered problem, not a loop.
  4.  **The Two Moves:**
      *   **"Drag it back to the lip":** Correcting the text/metadata string. This is the laborious derivation she redoes from scratch every time.
      *   **"Go in and check the burrow":** Triggering the macro verification. This is the step she skips *checking the logic of*; she assumes the verification step is neutral, not realizing the verification step *is* the perturbation. She settled years ago that "Macro = Truth," so she cannot see that the settling has come loose.

  **Analysis**

  **The Frame-Problem Reading**
  Her failure is not a lack of data but a failure of relevance. She has the fact "Macro sorts alphabetically" and the fact "Macro flags deviations." In isolation, both are true and useful. The frame problem is her inability to compute that the *interaction* of these two facts is currently the only relevant thing in the universe. She treats the macro's output as a report on the text, when it is actually a report on the macro's own state. She cannot filter out the consequence of her own tool's operation from the consequences of the text's condition.

  **The Non-Sphexish Version**
  The non-sphexish version of this woman possesses a "Meta-Check" heuristic: *If a verification tool flags the same location twice, inspect the tool before the text.* This isn't raw intelligence; she is already smarter than the tool. It is a cheaper cognitive arrangement—a "stop rule" or a Dennettian wheel. It's an artifact of experience: "Trust, but verify the verifier after two strikes." This single feature (the stop rule) does all the work. If you pull it out, she is back in the loop, because her raw intelligence is directed *outward* at the text, not *inward* at the procedure.

  **The Skeptic's Attack**
  A skeptic will argue this isn't sphexishness; it's sunk cost and motivated reasoning. She doesn't stop because admitting the macro is broken means admitting *she* broke it (she wrote it), which threatens her identity as the expert who catches what others miss. She loops to avoid the ego cost of debugging her own tool.
  **The Reply:** Sunk cost implies an emotional avoidance of a known truth. Sphexishness is a structural blindness to the truth. If she suspected the macro and hid it from herself, that's motivated reasoning. If the thought *never occurs to her* because her cognitive architecture treats "Tool Output" as "World State" by default, that's sphexishness. The distinction is whether the possibility is repressed or unavailable.
  **Honest Assessment:** This reply is fragile. In a human, the "unavailable" is often just the "repressed" wearing a mask. The design is most likely to fail on Constraint 3 (Evidence). A real expert accumulates evidence of tool failure faster than a wasp accumulates evidence of grasshopper movement. The changing error codes (404, 405) are a narrative device to block evidence accumulation, but a sharp reader (like your beta) will say, "She'd check the code log."
  **Constraint Conflict:** Constraint 2 ("no missing fact") fights Constraint 3 ("never accumulates evidence"). If she has all the facts, eventually the facts scream "LOOP." To make this work, you must soften Constraint 2. She cannot have *access* to the specific fact of the macro's sorting behavior in that moment, or she must believe the sorting is irrelevant. I recommend dropping the strict "no missing fact" requirement in favor of "no false belief." She doesn't know the macro sorts *on save*. That is a missing fact, but not a false belief. If you keep "no missing fact," you must make the perturbation external (the assistant), because internal tools known to the user inevitably become suspect under repetition.
