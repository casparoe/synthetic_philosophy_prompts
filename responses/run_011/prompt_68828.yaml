  **Elena:** Because there is no step three. There's no erasure. We don't compress the memory. We just leave it there.

  **Marcus:** You leave it there, but you have to use it. You said yourself: "The next cycle conditions on the memory's actual physical state." To condition the engine on the memory, the control mechanism has to know the memory's state.

  **Elena:** It knows it physically. The potential landscape couples the memory particle to the system partition. If the memory is in the left well, the potential tilts to let the system push left. It's a mechanical linkage, not a data bus.

  **Marcus:** A mechanical linkage that only engages if the states match is a measurement. It's a CNOT gate. You're correlating the system molecule with the memory particle.

  **Elena:** And that correlation is free if the coupling is adiabatic. I can tilt a potential without dissipating heat.

  **Marcus:** You can tilt a potential, but you're reducing the accessible joint phase space. Before coupling, System and Memory are independent. Four possible states: 00, 01, 10, 11. After coupling, they're correlated. Only 00 and 11 are allowed. You've cut the phase space volume in half.

  **Elena:** So the entropy drops. That's the point. We're converting entropy to work.

  **Marcus:** Not during the coupling. During the extraction. During the coupling, if you reduce the joint entropy by one bit without doing work on the system, you have to dump heat. That's the Second Law. You're compressing the probability distribution of the joint system.

  **Elena:** But the memory was already high entropy! We paid for that entropy during the randomization step. The heat absorbed when the barrier lowered covers the entropy capacity.

  **Marcus:** It covers the *marginal* entropy of the memory. It doesn't cover the *mutual* information. Look at the ledger line for the conditioning step. You have System ($H=1$) and Memory ($H=1$). You want to end up with System ($H=1$) and Memory ($H=1$) but correlated ($I=1$). The joint entropy goes from $H(S) + H(M) = 2$ to $H(S,M) = 1$. Where did that missing unit of entropy go?

  **Elena:** It went into the bath during the randomization. We absorbed it then.

  **Marcus:** You absorbed heat to expand the memory particle. That increased $H(M)$. It didn't pre-pay for the reduction of $H(S,M)$ later. You're trying to spend the same heat absorption twice. Once to randomize the memory, and again to justify the correlation cost.

  **Elena:** I'm not spending it twice. I'm saying the cost of correlation depends on the initial state of the memory. If the memory is standard (zero entropy), correlating it costs nothing because you're just copying information. If the memory is random, you claim it costs work. Why? The physical interaction is identical. A particle pushes a lever.

  **Marcus:** Because if the memory is standard, the joint phase space starts at 1 unit (System unknown, Memory known). It ends at 1 unit (System known, Memory known). No compression. If the memory is random, joint space starts at 2 units. Ends at 1 unit. You must dissipate $kT \ln 2$ to squeeze that space.

  **Elena:** But the demon doesn't "know" the state in a cognitive sense. The device just reacts. You're smuggling in a "read" step that doesn't exist. The control logic doesn't measure the memory; it *is* the memory.

  **Marcus:** If the control logic is the memory, then the control logic is random every cycle. To set up the engine correctly, you have to correlate the control logic with the system. That's the step I'm pointing at. The "Read/Condition" step. If you don't dissipate heat there, you're violating Liouville's theorem on the joint distribution.

  **Elena:** Liouville applies to Hamiltonian dynamics. My barrier lowering is Hamiltonian. The expansion is Hamiltonian. The coupling is Hamiltonian. Where is the non-Hamiltonian squeeze?

  **Marcus:** The squeeze happens when you restrict the dynamics to only allow matching states. You're proposing a potential that forbids 01 and 10. Turning on that forbiddance adiabatically while the system is in thermal equilibrium requires work if the system might be in a forbidden state.

  **Elena:** And if the system is in a forbidden state? It relaxes to the allowed state.

  **Marcus:** Relaxation is dissipation. That's the heat dump.

  **Elena:** It's relaxation into a lower energy state. That releases energy we can capture.

  **Marcus:** You can't capture it all. Not if the initial state was uncertain. You're betting on the molecule being in the right place relative to the memory. When it's not, you lose more than you gain. On average, the ledger balances to zero.

  **Elena:** On average. But we're building a device that operates in finite time. The Second Law is statistical. If I can net work most of the cycles and reset occasionally...

  **Marcus:** You can't reset occasionally without paying. That's the Bennett argument you thought you bypassed. You haven't bypassed erasure; you've hidden it in the correlation step. The ledger diverges here, on line three. Conditioning cost. I say $-1$ unit. You say $0$.

  **Elena:** I say the cost is absorbed by the physical expansion in line two. The entropy debt is cleared before the correlation even starts.

  **Marcus:** Then show me the term in the Hamiltonian that cancels the mutual information cost.

