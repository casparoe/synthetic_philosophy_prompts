  **Marcus:** Look at the ledger, Elena. Just the numbers. Cycle start: System unknown, Memory random. That's two bits of entropy in the joint phase space.

  **Elena:** It's not bits, it's volume. The memory particle occupies the full double-well volume after we drop the barrier. It's thermalized.

