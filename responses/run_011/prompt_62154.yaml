answer: |-
  'Nora is the problem,' said Elias. 'You claim she's free now because she endorses her desires. But she couldn't do otherwise. The training determined her.'

  'She endorses them,' replied Sarah. 'That's the locus of control. The ability to do otherwise is a chimera. If she acted differently without a change in her reasons, that's randomness, not freedom.'

  'But imagine a duplicate Nora,' Elias pressed. 'Programmed from birth to desire exactly what our Nora desires, to endorse them exactly as she does. No undetermined choices anywhere. By your lights, she's equally free. But she's a puppet. Our Nora was free at eighteen; she chose the apprenticeship when the future was open. That's why we praise her now. The duplicate lacks that history.'

  Sarah paused. 'I concede the history adds value. A life shaped by self-forming choices is richer than one scripted. But it doesn't change the metaphysics of her current agency. She acts from her own will. That is what is worth wanting.'

  'Is it?' Elias leaned in. 'You've just admitted the fork matters. You prefer Nora-with-the-fork to Nora-without-it. So origination is worth wanting after all. You're just pushing it back into the past to avoid the hard problem of current indeterminism.'

  'I'm not avoiding it; I'm locating it where it does work. If I require a fork at every moment, I invite the regress. To be responsible for my choice now, I must be responsible for the character that chose it. If that requires a prior fork, and a prior one, I never start. Nora stops the regress at eighteen. That's enough.'

  'But tracing fails,' Elias countered. 'Responsibility doesn't flow through determined channels like water. If her current action is determined by her character, and she didn't choose her character *in this moment*, she isn't the source now. The buck stops at eighteen, yes, but the action is today. You need the agent to be the ultimate originator of the action, not just the beneficiary of an ancient liberty.'

  'Then you make freedom evaporate over time,' Sarah said. 'Nora is more integrated now than at eighteen. Her will is unified. You're saying she was freer when she was conflicted and uncertain than when she was decisive. That contradicts the phenomenology of agency. We feel freest when our actions flow seamlessly from who we are.'

  'I concede the seamless flow is necessary,' Elias said. 'If Nora acted against her endorsed volitions, she wouldn't be free, even with the past fork. Your conditions are necessary. But they aren't sufficient. A sufficiently well-tuned automaton has seamless flow. It endorses its programming. What distinguishes Nora from the machine is that her programming was self-authored in a way the machine's wasn't.'

  'But the machine's programming was authored by someone else,' Sarah said. 'Nora's was authored by Nora. That's the difference. The tracing condition handles it. She is responsible now because she is responsible for the character acting now.'

  'Only if the tracing chain doesn't pass through determined links,' Elias insisted. 'If the link between eighteen-year-old Nora and thirty-year-old Nora is deterministic, then the later Nora is determined by the earlier Nora. But the earlier Nora's choice was undetermined. So the later Nora is determined by an undetermined choice. That makes her actions the inevitable fallout of a random event. How is that control?'

  'Because she owns the fallout,' Sarah said. 'She hasn't tried to change. She reaffirms her path daily. You're insisting on a "fresh start" at every moment. But why? If the past fork was real, why does the present need another one? You're smuggling in the requirement that freedom must be magical, not just historical.'

  'Because the power to do otherwise is the power to be an originator,' Elias said. 'If she can't do otherwise now, she isn't originating anything now. She's coasting.'

  'Coasting on her own engine,' Sarah replied. 'Look, if you grant that the past fork grounds the responsibility, what work is the current fork doing? If she chooses undeterminedly now, nothing about her explains the choice rather than the alternative. It's luck. If she chooses determinedly now, based on a character she originally formed undeterminedly, it's agency. You want the benefits of determination—stability, identity—without the label, because you're obsessed with the fork itself.'

  'I'm obsessed with the source,' Elias said. 'If the source is in the past, the agent now is a vessel.'

  'The agent now is the same person as the agent then,' Sarah said. 'Personal identity holds the chain together. You're treating moments as separate agents.'

  'That's a convenient metaphysics for you,' Elias muttered. 'But it begs the question. If determinism holds between the moments, the later self is constrained by the earlier self. Constraint isn't freedom.'

  'Endorsed constraint is character,' Sarah said. 'You still haven't answered the luck objection. If Nora had a fork now, and chose differently without a change in reasons, how is that praiseworthy? It's noise.'

  Elias shifted. 'It's not noise if it's a self-forming action. Effort of will.'

  'Effort determined by what?' Sarah asked. 'If determined, you're back with me. If not, it's noise. You can't have it both ways. Nora's current determined action is intelligible. Your undetermined alternative is opaque. I'd rather have intelligible agency than opaque origination.'

  'So you'd rather have a prisoner who loves their chains,' Elias said.

  'I'd rather have a person who owns their life,' Sarah replied. 'Nora owns hers. The duplicate doesn't. That's the difference that matters. You're chasing a difference that makes no difference to the quality of the will.'

  Elias opened his mouth, then closed it. He looked at the case file. 'We need to talk about personal identity then. If that's doing all the work...'

  'That's a different session,' Sarah said.

  **Note:** I backed the Compatibilist (Sarah). The Incompatibilist (Elias) is left changing the subject to personal identity because he cannot answer the "luck" objection in the context of the tracing case. If the past origin was undetermined, demanding a *current* undetermined origin invites the very randomness problem libertarians try to avoid, without adding explanatory power to the agent's control. I bent the Incompatibilist's position slightly; a Kane-style libertarian might argue that character formation is ongoing, not just at eighteen, but I restricted this to test the "tracing" intuition specifically. The Compatibilist's concession—that the past fork adds value—acknowledges the intuitive pull of origination without conceding it is metaphysically necessary for freedom *now*.
