prompt: |-
  I'm a backend engineer at a mid-size e-commerce company and about six months ago I accidentally ended up owning our internal metrics platform — the thing everyone builds dashboards and experiment readouts on top of. Which means I'm now the person who has to referee arguments about numbers, and I have no stats background beyond one undergrad probability class I mostly slept through. The argument I keep having, maybe two or three times a month, is Simpson's-paradox-shaped: a PM posts a screenshot showing conversion up 4% overall, an analyst replies that it's actually *down* in every one of the four user segments we track, and the room splits into whoever trusts which screenshot. Last week it was a checkout redesign. Overall conversion up, down for mobile, down for desktop, down for tablet, down for in-app — apparently because a marketing campaign sent us a big wave of high-intent users who happened to skew mobile, so the mix shifted under us. Our data scientist said something like "the reversal is a fact about the weighting, not about the world," which sounded deep and didn't help me decide anything, and I ended up punting to a VP, which I hated. Anything that moves a launch or a pricing decision needs sign-off from me, the PM, and the analytics lead, so I can't just shrug — I have to write down *why* we're believing one number and not the other.

  So: can you write me a procedure I can actually run on these? Something a competent engineer on rotation can do in about half an hour with SQL and a spreadsheet, not a stats PhD, ideally as a numbered list of questions in order, with what counts as a sufficient answer to each one, the points where the procedure stops at a definite no-go, and the points where it hands the thing to a human because the question turned out to be about what we're trying to decide rather than about the data. Be blunt about which steps are really just me making a judgment call with extra paperwork attached. I need it to cover: how you even know to start looking for a reversal, since you can't disaggregate by everything and there are thousands of plausible cuts; what to do when the reversal shows up in a cut nobody specified before looking at the data; how to decide whether the aggregate or the disaggregate is the number that should drive the decision, since I suspect that depends on what the decision is and not on any arithmetic; and what happens when the variable that explains the reversal is itself changed by the thing you're evaluating — I have a feeling that's the case that breaks everything, and I want it handled explicitly rather than footnoted.

  Then run it end to end on three cases so I can see it work and where it bites: the checkout redesign above; an A/B test where the treatment wins overall but loses inside every cohort defined by *whether users ever hit a certain feature* (a teammate insists this is just Simpson's paradox again and we should report the disaggregate, and I think he's wrong but I can't say why); and a support dashboard where average handle time dropped overall but rose in every agent skill tier. For each one I want the answer the procedure actually produces, plus what I'd have to tell the person who's going to be annoyed by it. And finish with a short list of what this procedure flat out cannot do — the failure modes where it'll hand me a confident wrong number, so I know when to stop trusting it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Backend engineer at a mid-size e-commerce company. Accidental owner of the internal metrics platform. No deep stats background (slept through probability class).
      *   **Problem:** Frequent arguments about Simpson's Paradox (aggregate vs. disaggregate metrics). Needs to make sign-off decisions on launches/pricing. Current process involves punting to VPs, which is inefficient and frustrating.
      *   **Needs:** A concrete, actionable procedure (checklist) to resolve these disputes.
          *   Timebox: ~30 mins, SQL + Spreadsheet.
          *   Format: Numbered list of questions, sufficient answers, stop conditions, hand-off points.
          *   Tone: Blunt, practical, acknowledging where judgment calls are disguised as math.
          *   Specific Coverage: How to spot it (without checking everything), post-hoc cuts, aggregate vs. disaggregate decision logic, and *mediation* (when the grouping variable is caused by the treatment).
      *   **Deliverables:**
          1.  The Procedure (The "Simpson's Triage Protocol").
          2.  Three Case Studies (Checkout Redesign, Feature Usage A/B, Support Handle Time).
          3.  Failure Modes/Limitations.

  2.  **Deconstruct the Statistical Problem:**
      *   **Simpson's Paradox:** $P(A|B) > P(A|\neg B)$ but $P(A|B, C) < P(A|\neg B, C)$ for all $C$.
      *   **The Core Issue:** It's not a math error; it's a causal inference problem. Which number represents the *counterfactual* we care about?
      *   **The "Mediator" Trap:** If the treatment *causes* the group assignment (e.g., Treatment makes people use a feature), stratifying by that group blocks the causal path. This is the "Feature Usage A/B" case.
      *   **The "Confounder" Case:** If the group assignment is pre-existing (e.g., Device Type, Tenure), stratification usually reveals the truth. This is the "Checkout Redesign" case.
      *   **The "Composition" Case:** If the goal is overall business health regardless of mix, aggregate might matter. If the goal is product efficacy, disaggregate matters. This is the "Support Handle Time" case.

  3.  **Drafting the Procedure (The "Simpson's Triage Protocol"):**
      *   *Goal:* Keep it under 30 mins. SQL + Sheets.
      *   *Step 1: Detection.* Don't check everything. Check the "Big 4" (Device, Geo, Tenure, Channel). If none show it, probably safe.
      *   *Step 2: Causality Check (The Crux).* Did the treatment *change* the group sizes? (Mediator vs. Confounder).
      *   *Step 3: Decision Context.* What is the business question? (Efficiency vs. Efficacy vs. Total Impact).
      *   *Step 4: The Call.* Aggregate, Disaggregate, or Escalate.
      *   *Constraint:* Must be blunt about judgment calls.

  4.  **Developing the Case Studies:**
      *   **Case 1: Checkout Redesign (The Classic Confounder).**
          *   *Scenario:* Marketing campaign brought high-intent mobile users.
          *   *Analysis:* Device type is pre-existing (mostly). Treatment didn't change device. Mix shift is external.
          *   *Verdict:* Disaggregate (Segment-level) is truth for product efficacy. Aggregate is truth for revenue *this week*. Need to clarify decision.
          *   *Correction:* Wait, the prompt says "Overall conversion up, down for mobile...". If the goal is "Did the redesign improve the checkout flow?", disaggregate wins. If "Did we make more money?", aggregate wins. The prompt implies a launch decision. Usually, launch decisions care about efficacy.
      *   **Case 2: Feature Usage A/B (The Mediator).**
          *   *Scenario:* Treatment wins overall, loses in "Used Feature" and "Didn't Use Feature".
          *   *Analysis:* "Used Feature" is *post-treatment*. The treatment likely encouraged feature usage. Stratifying by this hides the benefit.
          *   *Verdict:* Aggregate is the only valid number here. Stratifying is "collider bias" or "over-control."
          *   *Argument:* Tell the teammate he's wrong. This isn't Simpson's; it's causal mediation.
      *   **Case 3: Support Handle Time (The Composition Shift).**
          *   *Scenario:* AHT down overall, up in every skill tier.
          *   *Analysis:* Likely shifted ticket mix to easier tiers (or hired more juniors doing easy tickets).
          *   *Verdict:* Depends on the goal. If measuring *agent efficiency*, use disaggregate. If measuring *cost to company*, use aggregate.
          *   *Nuance:* This is often a "Goodhart's Law" scenario.

  5.  **Refining the Procedure (Self-Correction/Iterative Polishing):**
      *   *Critique:* Is Step 1 realistic? "Check Big 4." Yes, standard practice.
      *   *Critique:* How to explain the Mediator issue simply? Use the "Did the button change the group?" test.
      *   *Critique:* The prompt asks for "stop at definite no-go." I need to add a step where if data is missing or definitions are muddy, stop.
      *   *Critique:* The prompt asks for "what counts as a sufficient answer." I need to be specific (e.g., "p-value < 0.05 on the mix shift").
      *   *Tone Check:* Needs to be engineering-focused, not academic. "Don't be a hero," "This is a business call."

  6.  **Drafting the Content (Mental Outline):**
      *   **Intro:** Acknowledge the pain. Validate that stats PhDs argue about this too.
      *   **The Protocol:** 5 Steps.
          1.  Trigger (When to run this).
          2.  The "Big 4" Scan (Detection).
          3.  The Causality Test (Mediator vs. Confounder).
          4.  The Decision Context (What are we optimizing?).
          5.  The Sign-off (Documentation).
      *   **Case Studies:** Apply the protocol strictly.
      *   **Failure Modes:** Small sample sizes, post-hoc fishing, time-series confounding.

  7.  **Addressing Specific Prompt Requirements:**
      *   *Blunt about judgment calls:* Explicitly state "This is where you guess."
      *   *Mediator variable:* Handle the "Feature Usage" case explicitly.
      *   *Post-hoc cuts:* Address the risk of data dredging in Step 2.
      *   *30 mins/SQL/Sheets:* Keep the technical requirements low.

  8.  **Final Review against constraints:**
      *   Did I answer the "how to know when to start looking" part? Yes (Step 1).
      *   Did I answer the "post-hoc cut" part? Yes (Step 2 warning).
      *   Did I answer the "aggregate vs disaggregate" part? Yes (Step 4).
      *   Did I answer the "variable changed by treatment" part? Yes (Step 3).
      *   Are the case studies distinct? Yes (Confounder, Mediator, Composition).
      *   Is the tone right? Professional, direct, slightly weary but competent.

  9.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
      *   *Self-Correction during drafting:* Make sure to distinguish between "Simpson's Paradox" (mathematical phenomenon) and "Causal Inference" (interpretation). The user calls it Simpson's, so I will use that term but clarify the causal mechanism.
      *   *Emphasis:* The "Feature Usage" case is the trickiest. I need to be very clear why stratifying there is wrong (it blocks the mechanism of action).
      *   *Emphasis:* The "Checkout" case is the classic mix-shift. The decision depends on whether we can control the mix.

  10. **Final Polish:** Check formatting (bolding, lists) for readability. Ensure the "Failure Modes" section is honest about limitations. (e.g., "This procedure assumes your tracking is correct.")

  *(Self-Correction on Case 2)*: Wait, if Treatment wins overall but loses in *every* cohort defined by feature usage, that is mathematically impossible *unless* the group sizes changed drastically (classic Simpson's) OR the cohorts are not mutually exclusive/exhaustive.
  *Correction:* Actually, it is possible if the treatment drastically shifts people into the "High Conversion" group, but within that group, they perform slightly worse than controls, yet the *mix* is so skewed that overall wins.
  *Wait, let's look closer:* If $P(Win|Treat, Use) < P(Win|Control, Use)$ AND $P(Win|Treat, NoUse) < P(Win|Control, NoUse)$, then for Overall to be $P(Win|Treat) > P(Win|Control)$, the proportion of users in the "High Conversion" group must be massively higher in Treatment.
  *Crucial Point:* If "Using the Feature" is *caused* by the Treatment, then "Use" is a mediator. You should *not* condition on a mediator. The aggregate captures the total effect (Direct + Indirect). The disaggregate captures only the Direct effect (and biases it). So the teammate is wrong. I need to make sure the procedure highlights this "Did treatment cause the group?" question.

  Okay, ready to write.
answer: |-
  Here is the **Simpson's Triage Protocol**. It is designed to be run in 30 minutes using SQL and a spreadsheet. It does not make you a statistician; it makes you a gatekeeper who knows which questions to ask so the right people answer them.

  ### The Simpson's Triage Protocol

  **Prerequisites:** Access to raw event tables, ability to run basic `GROUP BY` queries, spreadsheet software.
  **Timebox:** 30 Minutes. If you exceed this, escalate immediately.

  #### Step 1: The Trigger (Do we actually have a paradox?)
  Don't run this on every metric. Run this only when:
  1.  **Sign Direction Mismatch:** The aggregate metric moves Up (or Down), but a stakeholder claims a major segment moves the opposite way.
  2.  **Magnitude:** The aggregate change is statistically significant (p < 0.05), but the narrative is contested.

  *   **Action:** Run the aggregate query. Run the query broken out by the "Big 4" segments: **Device, Geography, User Tenure, Traffic Source.**
  *   **Sufficient Answer:** Do at least two of the "Big 4" show a direction opposite to the aggregate?
      *   **No:** Stop. It's likely noise or a minor skew. Approve the aggregate.
      *   **Yes:** Proceed to Step 2.
  *   **Stop Condition:** If you cannot reproduce the paradox with the "Big 4" in 10 minutes, do not go hunting for obscure segments. Post-hoc fishing is how you find false patterns. If the PM found a specific obscure segment (e.g., "iOS users in Q3 who bought socks"), proceed to Step 2 but mark the finding as "Post-Hoc Suspect."

  #### Step 2: The Causality Test (Did the treatment move the people?)
  This is the most critical step. You are determining if the segment is a **Confounder** (pre-existing) or a **Mediator** (caused by the change).

  *   **Action:** Query the distribution of users across the conflicting segments for Control vs. Treatment (or Before vs. After).
      *   *SQL:* `SELECT segment, count(*) FROM table GROUP BY treatment_arm, segment`
  *   **Question:** Did the treatment/change significantly alter the *proportion* of users in these segments?
  *   **Sufficient Answer:**
      *   **No (Proportions are stable):** The segment is a **Confounder**. (e.g., The checkout redesign didn't turn Desktop users into Mobile users).
      *   **Yes (Proportions shifted):** The segment is a **Mediator** or **Collider**. (e.g., The new feature *caused* users to become "Power Users").
  *   **Judgment Call:** If the shift is <5%, treat as Confounder. If >10%, treat as Mediator. Between 5-10%, flag for human review.

  #### Step 3: The Decision Context (What are we actually optimizing?)
  Math cannot tell you which number to trust. Only the business goal can. You must extract this from the PM/VP.

  *   **Action:** Ask the requestor: "If we launch this, what behavior are we trying to change?"
  *   **Sufficient Answer:**
      *   **Goal: Efficacy.** "We want to know if the code works better for a given user." -> **Trust Disaggregate.** (Step 2 = Confounder).
      *   **Goal: Total Impact.** "We want to know if the company makes more money/gets more efficiency overall." -> **Trust Aggregate.** (Step 2 = Mediator OR Mix Shift is acceptable).
      *   **Goal: Unknown.** -> **Escalate.** Do not sign off.

  #### Step 4: The Mediator Trap (Explicit Check)
  If Step 2 identified the segment as a **Mediator** (the treatment caused the group assignment):

  *   **Rule:** **NEVER trust the disaggregate number.**
  *   **Reasoning:** Stratifying by a mediator blocks the causal path. You are measuring the effect of the code *excluding* the benefit of the code changing user behavior.
  *   **Action:** Reject the disaggregate argument. Trust the Aggregate.
  *   **Documentation:** Write: "Segment defined by post-treatment behavior. Disaggregation induces selection bias."

  #### Step 5: Sign-off or Escalation
  *   **Sign Off:** If Step 2 = Confounder AND Step 3 = Efficacy -> Sign off on Disaggregate.
  *   **Sign Off:** If Step 2 = Mediator -> Sign off on Aggregate.
  *   **Sign Off:** If Step 2 = Confounder AND Step 3 = Total Impact -> Sign off on Aggregate (but add a warning note about mix sensitivity).
  *   **Escalate:** If Step 2 is ambiguous, or if the Decision Context (Step 3) reveals a conflict between "Product Quality" and "Revenue" that the PM and Analytics Lead cannot resolve.

  ---

  ### Case Study 1: The Checkout Redesign
  **Scenario:** Overall conversion +4%. Mobile, Desktop, Tablet, In-App all negative. Marketing campaign drove high-intent mobile traffic (mix shift).
  **Run the Protocol:**

  1.  **Trigger:** Yes. Aggregate Up, Segments Down.
  2.  **Causality Test:** Did the checkout redesign change the number of Mobile vs. Desktop users?
      *   *Result:* **No.** Device type is pre-existing. The marketing campaign caused the mix shift, not the code.
      *   *Classification:* **Confounder.**
  3.  **Decision Context:** PM wants to know "Is the new checkout flow better?"
      *   *Classification:* **Efficacy.**
  4.  **Mediator Trap:** N/A (Confounder).
  5.  **Verdict:** **Trust Disaggregate (Segment-level).** The aggregate is lying because the *population* changed, not the *performance*.

  **What to tell the annoyed PM:**
  > "The code did not work better on any device. The overall number is up only because Marketing bought a bunch of high-intent mobile users who convert easily anyway. If Marketing stops that campaign next month, your conversion will crash. We cannot launch this as an improvement to the checkout flow. You need to fix the flow, or re-scope this as a 'Marketing Campaign Success' rather than a 'Product Launch'."

  ---

  ### Case Study 2: The Feature Usage A/B Test
  **Scenario:** Treatment wins overall. Treatment loses inside "Users who hit Feature X" and "Users who did not hit Feature X." Teammate says "Simpson's Paradox, report the disaggregate."
  **Run the Protocol:**

  1.  **Trigger:** Yes. Aggregate Up, Segments Down.
  2.  **Causality Test:** Did the treatment change the proportion of users who hit Feature X?
      *   *Result:* **Yes.** The treatment was a UI change designed to make Feature X more visible. 60% of Treatment hit Feature X, only 10% of Control did.
      *   *Classification:* **Mediator.**
  3.  **Decision Context:** "Does this launch drive value?"
      *   *Classification:* **Total Impact.**
  4.  **Mediator Trap:** **Active.** The teammate is asking you to stratify by a variable the treatment *caused*.
  5.  **Verdict:** **Trust Aggregate.** The teammate is statistically wrong. By splitting on "Feature Usage," they are removing the primary mechanism by which the treatment works.

  **What to tell the annoyed Teammate:**
  > "You are conditioning on a mediator. The treatment works *by* making people use the feature. If you split by feature usage, you're asking 'Does the code work if we pretend it didn't change user behavior?' That's not the question we're launching on. The aggregate captures the total causal effect. The disaggregate number is biased by selection. We report the aggregate."

  ---

  ### Case Study 3: Support Handle Time (AHT)
  **Scenario:** Average Handle Time dropped 10% overall. AHT rose in Junior, Mid, and Senior tiers.
  **Run the Protocol:**

  1.  **Trigger:** Yes. Aggregate Down (Good), Segments Up (Bad).
  2.  **Causality Test:** Did the "treatment" (e.g., a new ticket routing system) change the distribution of tickets across skill tiers?
      *   *Result:* **Yes.** The new router sent all easy tickets to Juniors and hard tickets to Seniors. But wait—the data shows AHT rose *for Juniors* too. Actually, looking closer: The company hired 50 new Juniors this month. The mix shifted heavily to Junior tier.
      *   *Classification:* **Confounder** (Hiring is external to the routing logic, mostly).
  3.  **Decision Context:** VP asks: "Are our agents more efficient?" vs "Did our support costs go down?"
      *   *Ambiguity:* If we pay by headcount, Aggregate matters. If we pay by performance, Disaggregate matters.
      *   *Refinement:* The prompt says AHT *rose* in every tier. This means individual efficiency dropped. But overall AHT dropped because we flooded the system with cheap, junior labor who (presumably) resolve tickets faster than seniors *on average*, even if they are slower than they were last month? No, if AHT rose in Junior tier, they are slower than before.
      *   *Correction:* For Aggregate to drop while all segments rise, the mix must have shifted to a segment with *inherently lower AHT*, even if that segment got worse. Juniors usually have higher AHT than Seniors. So the mix must have shifted to **Simple Ticket Types**, not Agent Tiers.
      *   *Re-evaluating the Prompt's Scenario:* If AHT rose in every *Agent Skill Tier*, but dropped overall, the mix must have shifted to **Ticket Complexity**, not Agent Tier. But the prompt says "Agent Skill Tier" is the cut.
      *   *Math Check:* If $AHT_{Junior}$ went up, $AHT_{Senior}$ went up, but Overall went down, the proportion of tickets handled by the *faster* group must have exploded. Usually Seniors are faster. If we shifted mix to Seniors, Overall drops. But if Seniors got slower, and Juniors got slower, but we hired all Seniors... okay.
      *   *Let's assume the prompt's math holds:* The mix shifted to a faster group (e.g., Chat vs Phone), but the cut provided was Skill Tier.
      *   *Wait, sticking to the prompt:* "Rose in every agent skill tier." This implies the *agents* are slower. But overall time is down. This implies the *tickets* are easier, but we are cutting by Agent.
      *   *Protocol Application:* The variable "Agent Skill Tier" is a **Confounder** (Hiring/Assignment happens before the call).
      *   *Decision Context:* Is this a Performance Review or a Cost Review?
      *   *Verdict:* **Escalate.** This is a "Goodhart's Law" scenario. The aggregate looks good (Cost down), the disaggregate looks bad (Performance down). This is a business tradeoff, not a data error.

  **What to tell the annoyed VP:**
  > "The data is consistent. We are resolving tickets faster overall because we shifted the mix of tickets (or agents), not because agents are working faster. In fact, individual agent efficiency has dropped across the board. If you care about cost, the aggregate is real. If you care about training quality or agent burnout, the disaggregate is real. I cannot sign off on 'Efficiency Improved.' I can sign off on 'Cost Per Ticket Reduced.' You need to decide which metric ties to the bonus pool."

  ---

  ### Failure Modes: When This Procedure Will Lie to You

  This protocol is a heuristic, not a theorem. It will fail in the following scenarios. If you suspect these, stop and call a Data Scientist.

  1.  **The "Small Cell" Trap:**
      *   **Failure:** The paradox appears only in a segment with <50 users.
      *   **Result:** High variance noise. The "reversal" is statistical fluctuation, not structural bias.
      *   **Fix:** Apply a minimum sample size threshold in Step 1. Ignore segments below N=100.

  2.  **The "Double Mediator" (Colliders):**
      *   **Failure:** You stratify by a variable that is caused by *both* the treatment and the outcome (e.g., "Users who completed the survey").
      *   **Result:** This induces correlation where none exists. The protocol might flag this as a Mediator (Step 2), but if you treat it as a Confounder, you will bias the result.
      *   **Fix:** If the segment definition involves user *choice* that happens after treatment start, assume Mediator.

  3.  **Time-Series Confounding:**
      *   **Failure:** "Before vs. After" analysis where seasonality drives the mix shift (e.g., Christmas traffic vs. January traffic).
      *   **Result:** Step 2 will say "Confounder" (Time is pre-existing), but Time is correlated with intent.
      *   **Fix:** Never run this protocol on Before/After data without a Control Group. If you don't have an A/B test, this protocol is invalid. Escalate.

  4.  **The "Metric Definition" Shift:**
      *   **Failure:** The engineering team changed how the metric is logged (e.g., "Conversion" now includes "Add to Cart" instead of "Purchase").
      *   **Result:** The paradox is real, but it's a bug, not a bias.
      *   **Fix:** Step 0 (not listed above): Always verify schema changes before running Step 1.

  ### Final Advice for You
  You are not the arbiter of truth; you are the arbiter of **definition**.
  *   Simpson's Paradox is not a math problem; it is a **causal** problem.
  *   Your job is to force the room to agree on *what causes what* before they argue about *which number is bigger*.
  *   If they can't agree on the causality (Step 2 & 3), do not sign off. Make them fight it out in a design doc, not in your dashboard comments.
