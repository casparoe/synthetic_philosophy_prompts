      *   *Tone:* Academic, precise, philosophical.
      *   *Constraint Check:* Did I avoid the "virtue ethics vs. consequentialism" standard debate? Yes, the focus is on the *internal structure* of consequentialism given karmic asymmetry.
      *   *Marking Scheme:* Ensure the distinction is clear for the grader.

