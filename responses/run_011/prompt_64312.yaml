      *   **Constraint 2 (Focus):** Focus on the *structure of the karmic ledger*. Specifically: Merit can be transferred/dedicated (agent-neutral aggregation of benefits), but demerit cannot be transferred (agent-relative bearing of harms).
      *   **Key Texts/Concepts:** *Upāyakauśalya Sūtra* (Captain kills robber, accepts hell), Śāntideva's *Bodhicaryāvatāra* (self-and-other exchange), concept of *upāya* (skillful means).
      *   **Core Philosophical Problem:** What does a normative theory look like where benefits are aggregable/transferable but harms are strictly individual? Can this be consequentialism? What needs revision (karma account or consequentialist label)? What is lost in each revision?
      *   **Deliverables:** Question, Model Answer, Marking Scheme (with distinctions for 1st vs. 2:1 and 5 specific errors).

  2.  **Drafting the Question:**
      *   Needs to be precise and directive.
      *   Must explicitly mention the asymmetry of karma (merit transferable, demerit not).
      *   Must invoke the Captain/Robber case and Śāntideva.
      *   Must ask for the implications for consequentialism and the cost of revision.
      *   *Draft:* "Buddhist ethics is often debated as consequentialist vs. virtue ethics. Ignore that. Focus on karma. Merit transfers, demerit doesn't. Look at the Captain in the Upāyakauśalya Sūtra. He takes the bad karma. Look at Śāntideva on self/other exchange. Does this asymmetry allow for consequentialism? If not, what changes? Karma or the theory? What is lost?"
      *   *Refinement:* Make it more academic and rigorous. Ensure it prohibits the standard "telos" argument.

  3.  **Drafting the Model Answer:**
      *   *Goal:* ~750 words. High quality (First Class standard).
      *   *Argument Structure:*
          1.  **Introduction:** Define the problem. The asymmetry of karma challenges standard consequentialism (which usually aggregates both good and bad impartially).
          2.  **The Asymmetry:** Explain merit transfer (parināmanā) vs. inescapable demerit. Use the Captain example. The Captain maximizes overall good (saves passengers, prevents robber's hell) but absorbs the specific bad (killing) individually.
          3.  **Consequentialist Tension:** Standard consequentialism aggregates *disvalue* too. If harms can't be aggregated or shifted, the "calculus" breaks. It looks like agent-relative constraints wrapped in agent-neutral goals.
          4.  **Śāntideva's Intervention:** The self/other exchange (*parātmasamata*). This attempts to ontologically undermine the "individual bearer" of karma. If self/other are empty, why can't demerit be transferred? Or, conversely, if the Bodhisattva takes on suffering, is that karmic or compassionate?
          5.  **Resolution/Revision:**
              *   *Option A (Revise Karma):* Make demerit transferable. *Cost:* Undermines moral responsibility/justice.
              *   *Option B (Revise Consequentialism):* Admit it's a hybrid. Agent-neutral ends, agent-relative means. *Cost:* Loses the purity of the consequentialist label.
          6.  **Conclusion:** The asymmetry suggests a "Bodhisattva Consequentialism" that is distinct because the agent's spiritual capacity to absorb harm is the limiting factor, not just the outcome count.
      *   *Check Constraints:* No secondary literature citations. Use primary concepts. Address the "what is lost" prompt.

  4.  **Drafting the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Differentiation:* What makes a First (20-25) vs. Strong Second (15-19)?
          *   First: Grapples with the *structural* asymmetry, not just the outcome. Integrates Śāntideva's metaphysics (emptiness/selflessness) into the karmic problem. Clearly articulates the "cost" of revision.
          *   Second: Describes the Captain case well but treats the asymmetry as a practical hurdle rather than a theoretical crisis. Might fall back on the forbidden "virtue vs. consequentialism" debate.
      *   *Five Characteristic Errors:*
          1.  Treating *upāya* as a blanket exception to precepts (moral license).
          2.  Reading Nirvāṇa as a state of affairs to be maximized (forbidden topic).
          3.  Equating compassion (*karuṇā*) with impartial utility (ignoring the agent-relative burden).
          4.  Ignoring the merit/demerit asymmetry (focusing only on outcomes).
          5.  Claiming the Captain incurs *no* karma (he does, he accepts it).

  5.  **Review and Refine:**
