  The punch bowl sat on a high table, gleaming under the department's fluorescent lights, a crystalline mountain slowly melting into fruit juice and sparkling water. Elias hovered near it, ladle in hand, watching Sarah approach with a paper plate she had no intention of using.

  "You're treating the symposium like a laboratory," Elias said, filling his cup. "That's the core of your assay reading. You think the Athenian visitor wants to isolate variables."

  "And you're treating it like a gym," Sarah replied, leaning against the table. "Your inoculation reading assumes the drink is a vaccine. A controlled dose of the thing that unseats self-command, administered so the soul practices holding firm."

  "Exactly. The supervisor isn't there to watch a specimen; he's a coach spotting a lifter. He ensures the weight is heavy enough to build muscle but not so heavy it crushes the lifter."

  Sarah shook her head. "If the supervisor were a coach, he'd encourage pushing the limit. But the text insists the supervisor's primary job is to prevent ruin. That sounds like containment. The elaborate apparatus exists to keep the test from spoiling the specimen. The supervisor ensures the result is legible, not that the drinker improves."

  "But consider the fear-drug thought experiment," Elias said, taking a sip. "The visitor asks his Dorian companions to imagine a drug that induces fear. He says a legislator could hand it out in watched doses to see if a young soul masters what it feels. Since wine works in the opposite direction, inducing confidence, it's the available analogue. If the goal were merely to see who is already brave, why the small doses? Why not just give it all at once and see who breaks?"

  "Because you don't break the testing equipment," Sarah countered. "But let's turn to what embarrasses your position. In the earlier political work, the guardians are forbidden to drink to excess. There's even a quip that a guardian who needed watching would need a guardian of his own. And in the drinking-party dialogue, you have the portrait of a man whose self-command is so settled that wine simply fails to take hold of him while he out-argues the whole table until dawn. If wine is for formation, why exclude the best souls?"

  Elias set his cup down. "I'll concede that. The inoculation reading doesn't work for the fully formed. If your character is already solidified, you don't need the vaccine. The text allows that some natures are beyond the reach of this training. But for the majority, who are neither beasts nor gods, the practice is prophylactic. They need to learn what it feels like to be unseated without actually falling."

  "That concession costs you universality," Sarah noted. "But now look at what embarrasses me. The text presents the drink as a Dionysian gift, a remedy for the sourness of age. That sounds like something wine does to a drinker, not something it discovers about him. And the insistence that the practice is supposed to produce shame and friendship, not merely register their presence. How does an assay produce friendship?"

  Elias smiled. "I was waiting for that. The remedy for age isn't about curing a disease; it's about strengthening a weakening will. The sourness of age is a hardening against pleasure. Wine softens the mold so it can be reshaped. As for friendship, you build bonds by surviving a shared danger. If we all navigate the temptation together under a sober guide, we trust each other more."

  Sarah stirred the punch with a plastic spoon, watching the swirl. "I can turn that. The age-grading follows from the remedy claim, yes, but only because the test must be timed. You don't test the metal before it's cooled. The shame and friendship are the legible results. When men drink together and remain shamefast, they see each other's reliability. The bond isn't made by the wine; it's made by the mutual recognition of stability revealed by the wine."

  "So you think the disposition wine engages is a native endowment," Elias said. "A fixed capacity."

  "I think it's a native endowment that temptation merely reveals," Sarah corrected. "Whereas you think it's a capacity strengthened by exercise under temptation."

  "Here is where we actually disagree," Elias said, gesturing with the ladle. "Take the sober supervisor again. You say he protects the test. I say he protects the training. But let's look at the man who fails. The one who behaves disgracefully under wine."

  "The assay reading says he is marked out," Sarah said. "He is shown to be unfit for rule or trust."

  "The inoculation reading says he is enrolled in a course of treatment," Elias replied. "His failure indicates where the training must intensify."

  "But the text suggests some are simply incapable," Sarah pressed. "The age restrictions imply a window of opportunity. If you miss it, or if your nature is too base, the wine ruins you. That sounds like a verdict, not a prescription."

  "And yet," Elias said, "the visitor argues that without this practice, citizens are wholly untrained against pleasure. They are trained against pain and fear through common meals and gymnastic discipline, but leave them wholly untrained against appetite. If it were merely an assay, why would the legislator care so much about the training gap? You don't measure a gap to leave it open."

  Sarah paused. "I will concede this: the ritual itself has a habituating effect. Even if the wine reveals the nature, the structure of the party—the singing, the ordering, the sober leadership—habituates them to order. So the practice is not purely epistemic. It does form them, just not through the intoxication itself."

  "That costs you the purity of the assay," Elias said.

  "And I concede that the fully immune drinker is rare," Sarah said. "Most men are affected. The question is whether the affect is a revelation or a lesson."

  They stood in silence for a moment, the hum of the refrigerator behind them filling the gap. The punch bowl was half empty.

  "So," Elias said softly. "The question that decides it. Whether a man who behaves disgracefully under wine is thereby marked out, on Plato's view, or thereby enrolled in a course of treatment."

  "And hence," Sarah added, "whether the disposition that wine engages is a capacity strengthened by exercise under temptation or a native endowment that temptation merely reveals."

  Elias looked into his cup. "I bet on exercise. Because the Athenian insists the legislator's aim is virtue, and virtue is teachable. If wine only reveals fixed natures, the legislator is reduced to a sorter, not a maker of citizens. I bet Plato believes the soul can be hardened against pleasure."

  Sarah nodded slowly. "I bet on endowment. Because the text ties the drinking laws to the broader project of matching men to offices. If everyone could be inoculated into virtue, the strict age-grading and the exclusion of the young wouldn't need to be so precise. I bet Plato thinks the wine shows you who you already are, so the city knows where to place you."

  "Then we're stuck," Elias said.

  "Until the next session," Sarah replied. "Unless the punch bowl offers a third option."

  Elias laughed. "I doubt the supervisor here is sober enough to judge."

  "Then we shouldn't drink," Sarah said, turning away. "We'd spoil the specimen."

  "Or crush the lifter," Elias murmured, setting the ladle down.
