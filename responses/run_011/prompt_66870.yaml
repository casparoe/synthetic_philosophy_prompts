      *   *Decision:* I will express high confidence on the fraud and logic errors. I will express slightly lower confidence on the historical nuance (as definitions vary), but actually, the prompt asks for the point *I* am least sure about. As an AI, I should simulate a researcher's uncertainty. The most contested area in welfare research is the long-term impact of sanctions. So I will express high confidence that her *interpretation* is flawed, but acknowledge that the *data* on sanctions is complex.
      *   *Better Decision:* The prompt asks me to be straight. I shouldn't feign uncertainty where there is none. The fraud statistic is objectively wrong based on DWP data. The logic is objectively flawed. The historical claim is imprecise. The point of *least* certainty should be the one where academic consensus is genuinely split. That is the efficacy of sanctions. While her *conclusion* ("they were choosing not to") is wrong, the *premise* ("they find jobs faster") has some statistical backing, though interpreted differently. I will highlight this distinction.

      *   *British English Check:*
