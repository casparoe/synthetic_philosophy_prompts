      *   *Claim 2:* "...modern welfare state has kept it alive by hiding it inside bureaucracy: what it used to call desert it now calls conditionality, which is only the neutral, administrative point that if you take money from the state you have to do something in return."
          *   *Analysis:* This is the key normative sleight of hand. "Conditionality" is a policy choice, not a natural law. Calling it "neutral" pre-empts ethical debate. It frames the contract as reciprocal (money for action) rather than rights-based (social security as a right).
          *   *Verdict:* This is where the "word quietly changing meaning" happens. It frames a political choice as an administrative necessity.

      *   *Claim 3:* "Sanctions are how that gets enforced, and the evidence is that they work -- sanctioned claimants find jobs faster than unsanctioned ones, which shows they were capable of working all along and had simply been choosing not to."
          *   *Analysis:* This is a classic correlation/causation and selection bias error.
