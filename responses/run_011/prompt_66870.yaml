      *   *Claim 4:* "Every advanced welfare state does something like this now, which in Europe is called activation, so the empirical argument is settled."
          *   *Analysis:* "Appeal to popularity/common practice." Just because everyone does it doesn't mean it's right or effective in the same way. "Empirical argument is settled" is a strong claim that social science rarely supports.
          *   *Verdict:* Rhetorically strong, academically weak.

      *   *Claim 5:* "Benefit fraud gets exaggerated, fine, but that cuts against the anti-conditionality side too: since the department can detect and correct its own mistakes, the overpayments that survive are overwhelmingly the deliberate ones, and deliberate is what fraud means."
          *   *Analysis:* This is factually dubious. DWP data usually shows official error and claimant error (honest mistakes) make up the bulk of overpayments, with fraud being a small percentage (usually cited around 5-10%). The logic that "surviving overpayments = fraud" ignores detection limitations.
          *   *Verdict:* Factually incorrect regarding DWP statistics.

      *   *Claim 6:* "The real inconsistency is that the working poor get top-ups with no strings attached at all, and that is why worklessness persists."
          *   *Analysis:* Non-sequitur. Working poor getting tax credits/UC top-ups doesn't logically cause worklessness among non-workers. In fact, it suggests a "poverty trap" argument (why work more if you lose benefits?), but she frames it as "no strings" causing "worklessness." It contradicts the earlier claim that conditionality works.
