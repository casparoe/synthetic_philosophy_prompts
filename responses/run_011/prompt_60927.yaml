      Welcome everyone. It is good to see so many familiar faces, and many new ones. I have just returned from eighteen months away. I have not stood at a lectern like this in that time. I have not tried to speak to a room split so evenly between those who build the maps and those who ask what the territory is.

      A colleague warned me last week that this workshop is a category error. They said we are trying to match vocabularies that belong to different worlds. I do not believe them. But I cannot quite dismiss the worry. So let us be precise about what we are doing here at Reading the Weights.

      We are not arguing about what these systems are in themselves. We are arguing about how best to talk about them. Some of you spend your days in the design stance. You look at architecture, training procedures, induction heads. You ask how the machine is built to function. Others of you work in the intentional stance. You ask what the system predicts, what goal it appears to pursue, what information it retains. Both groups treat the physical stance—the actual voltages, the specific weight values—as something you could check in principle, but never actually touch. You are not disagreeing about the object. You are describing it from different elevations.

      We will see this shortly. A colleague will steer a model's output by amplifying one internal direction isolated from its weights. In rehearsal, this worked twice. It failed once. To anyone watching from the third row, the failure was indistinguishable from the success. That fact is not a glitch. It is the central question of these two days. When does a description stop being a convenient shortcut and start being a real feature of the world?

      Listen to how easily we slide between views. The matrix multiplication propagates activation forward through the layers. The system attempts to complete the pattern based on prior context. It believes the sentence should end with a verb.

      Did you feel the shift? We moved from the physical substrate to the design function to the intentional attribution without stopping. It feels natural. But is it true?

      Here is the hard objection, and I want to state it clearly for our interpretability colleagues. You might say the intentional stance is just a predictive instrument. You might say treating these attributions as tracking something real is a philosopher's old habit dressed up in new vocabulary. If the math works without the folk psychology, why keep the folk psychology? From where you sit, belief looks like a ghost we refuse to exorcise.

      That objection holds weight. But there is a criterion that lets us keep the pattern without the ghost. A pattern is real just in case finding it yields a description that compresses and predicts better than the exhaustive physical account would. If saying the model wants X allows us to predict its behavior better than tracing every weight, then that want is a real pattern. It is not about inner life. It is about leverage. This constraint is not a cage. It is the ground we stand on.

      Now, does this make the pattern ontologically real, or just indispensably useful? Dennett left that door open. Three of you in the front row know exactly what I mean. We are not closing that door today. We are walking through it.

      So here is my proposal. Let us use the constraint to enable us. Let us find the patterns that compress the chaos. Let us argue about whether those patterns are mirrors or tools. I am glad you are here. Let us begin.

