answer: |-
  You have identified one of the most persistent and difficult knots in bioethics and philosophy of mind. There is no single, universally agreed-upon noun for this specific argumentative move, because it sits at the intersection of three different fields: legal ethics, metaphysics (personal identity), and moral psychology.

  However, the conceptual architecture you are looking for is best described by the tension between **Precedent Autonomy** and **Current Interests**, often grounded in Ronald Dworkin's distinction between **Critical and Experiential Interests**.

  Here is the carving of the landscape, the nearest neighbors, and the separation of settled fact from genuine dispute.

  ### 1. The Core Concept: Precedent Autonomy vs. Current Interests

  The "move" made by the second camp (the one that discounts the current contentment) is an appeal to **Precedent Autonomy**.

  *   **The Definition:** This is the claim that a competent agent's decisions about their future retain moral authority even after they lose competence, specifically because the loss of competence was the contingency anticipated.
  *   **The Justification:** The second camp argues that the current self's testimony is epistemically or normatively compromised. It is not that the current self is "lying," but that their *capacity to weigh values* has been altered in a way the earlier self predicted and sought to guard against.

  The philosophical engine powering this is **Ronald Dworkin's distinction (from *Life's Dominion*)**:
  *   **Experiential Interests:** Interests in feeling good, avoiding pain, and experiencing satisfaction *now*. (The demented patient has these; they are happy.)
  *   **Critical Interests:** Interests in living a life that is coherent, meaningful, and consistent with one's deep values *over time*. (The earlier self had these; they valued dignity over mere existence.)

  **The Carving:** The second camp's argument is that **Critical Interests trump Experiential Interests.** They argue that satisfying the current self's experiential interest (staying alive and happy) violates the earlier self's critical interest (not living in a degraded state).

  ### 2. Nearest Neighbors and Boundary Lines

  You asked where one phenomenon stops and another starts. This is where the confusion usually lies. Here are the adjacent concepts and how they differ from your specific case.

  #### A. The Ulysses Contract (Precommitment)
  *   **The Concept:** Binding your future self to prevent a specific action (e.g., the alcoholic telling friends not to lend money).
  *   **The Boundary:** A Ulysses contract is usually about **impulse control** in a temporary state (mania, addiction). The advance directive in dementia is about **identity continuity** in a permanent state.
  *   **Why it differs:** In the alcoholic case, we assume the "sober self" is the "true self" and the "drunk self" is a temporary hijacking. In the dementia case, the "demented self" may be the *only* self left. The second camp's move is harder here because there is no "return to competence" to validate the contract later.

  #### B. Hedonic Adaptation (The Psychological Prediction)
  *   **The Concept:** Humans systematically overestimate how bad negative states will feel and how long the pain will last (the "impact bias").
  *   **The Boundary:** Camp 1 (the skeptics) relies on this. They say, "You didn't know you could be happy in dementia."
  *   **Why it differs:** Camp 2 (the directive defenders) accepts adaptation might happen but argues **adaptation is irrelevant to the value judgment.** They argue: "Even if I adapt and feel happy, the state itself is undignified according to my values." This separates *feeling* (adaptation) from *valuation* (critical interests).

  #### C. The Identity Problem (Metaphysics)
  *   **The Concept:** Is the person with advanced dementia the *same person* who wrote the directive? (Derek Parfit's reductionist view).
  *   **The Boundary:** If they are *not* the same person, the directive has no authority (you can't bind a stranger).
  *   **Why it differs:** Camp 2 usually relies on a **Narrative View of Identity**. They argue identity is constituted by the whole story, not just psychological continuity. Therefore, the earlier author is the same "person" as the later subject, and the author holds the pen.

  #### D. Soft Paternalism
  *   **The Concept:** Overriding a choice only if it is non-autonomous (due to ignorance, coercion, or incapacity).
  *   **The Boundary:** Camp 2 argues the current refusal is non-autonomous *because* of the condition the directive anticipated.
  *   **Why it differs:** Standard paternalism overrides a choice because the person *doesn't understand the facts*. This specific move overrides the choice because the person *doesn't hold the right values* (anymore).

  ### 3. What is Settled vs. What is Disputed

  This is the most critical part of your request. The literature is often presented as more settled than it is.

  #### Settled (Consensus among specialists)
  1.  **Capacity is Decision-Specific:** It is settled that a person can be incompetent to manage finances but competent to choose what to eat. In advanced dementia, capacity to understand the *consequences* of the directive is usually gone.
  2.  **The Tension is Real:** Everyone agrees there is a genuine moral conflict between **Beneficence** (making the current self happy/safe) and **Autonomy** (respecting the past self's wishes). There is no algorithm that dissolves the tension.
  3.  **Legal Variance:** It is settled law that jurisdiction matters. In some US states, an advance directive is absolute. In others (and in many European jurisdictions), the current wishes of the patient, even if demented, can override the directive if they express distress.
  4.  **Prediction Error is Common:** Empirical psychology agrees with Camp 1 that people are bad at predicting their future utility (affective forecasting). We generally underestimate our resilience.

  #### Disputed (Genuine Controversy)
  1.  **The "Molloy" Problem:** Dworkin used the example of a woman who directives that if she gets dementia, she should not be treated for pneumonia. She gets dementia, gets pneumonia, and seems happy to be alive. Dworkin argues we should let her die to respect her critical interests. **This is heavily disputed.** Many ethicists (e.g., Rebecca Dresser, John Robertson) argue that once the "critical interest" self is gone, the "experiential interest" self is the only moral patient remaining. To kill them for the sake of a ghost (the past self) is a form of sacrifice.
  2.  **The Status of Adaptation:** Is the happiness of the dementia patient a **valid preference** or a **symptom**?
      *   *Camp 1:* It's valid adaptation (resilience).
      *   *Camp 2:* It's anosognosia (neurological inability to perceive deficit).
      *   *Dispute:* There is no settled clinical test to distinguish "happy adaptation" from "pathological unawareness" in all cases. The second camp's move relies on assuming the latter, but the evidence is often mixed.
  3.  **The Authority of the Past Self:** Does the competent self have the right to bind the incompetent self to *death* or *suffering*?
      *   *Consensus:* They can bind them to *treatment* (e.g., "No blood transfusions").
      *   *Dispute:* Can they bind them to *non-treatment* when the current self shows signs of enjoyment? The "Right to Life" of the current biological organism vs. the "Right to Die" of the biographical person.
  4.  **Ulysses Contracts in Psychiatry:** In the case of mania (your example), it is disputed whether a patient can be forcibly medicated based on a prior directive if they are currently refusing but not legally "incapacitated" in the moment. Some jurisdictions allow "psychiatric advance directives" to be overridden if the patient is currently objecting, precisely because the objection itself is seen as a residual right.

  ### 4. Summary of the "Move"

  If you need to label the argument for the sake of discussion, the most precise philosophical term is **The Priority of Critical Interests**.

  The argument structure is:
  1.  Welfare consists of both Experiential Interests (feeling good) and Critical Interests (living well/according to values).
  2.  Critical Interests have normative priority over Experiential Interests.
  3.  The Advance Directive expresses a Critical Interest.
  4.  The Current Objection expresses an Experiential Interest (or a value system compromised by the condition).
  5.  Therefore, the Directive stands.

  **The Counter-Carving:**
  The opposing argument is **The Principle of Current Welfare**.
  1.  Moral status attaches to the being that exists *now*.
  2.  The past self no longer exists (psychologically).
  3.  To harm the current happy self to satisfy the dead past self is to treat the current self as a mere means.

  ### 5. Recommendation for Further Reading

  To see this carving in action, look for the debate between **Ronald Dworkin** (*Life's Dominion*) and **Rebecca Dresser** ("Dworkin on Dementia: Elegant Theory, Questionable Policy").

  *   **Dworkin** represents the "Second Camp" (Critical Interests/Precedent Autonomy).
  *   **Dresser** represents the "First Camp" (Current Welfare/Adaptation).

  She specifically attacks the idea that we can discount the current patient's happiness as "mere adaptation." She argues that by the time the dementia is advanced, the "person" who wrote the directive is gone, and enforcing the directive is not autonomy, but a form of **moral ventriloquism**.

  **In short:** You have found the boundary where **Autonomy** (self-rule) collides with **Identity** (self-sameness). The "move" is the assertion that Autonomy survives the loss of Identity. That is the precise point of contention.
