answer: |-
  This is a classic functionalist move, common in historical materialism and rational-choice sociology. It attempts to naturalize moral progress by treating norms as adaptive technologies rather than moral truths. It's a powerful deflationary tactic, but it leaks under pressure.

  Here is the audit of the "Norm as Technology" analogy, followed by an assessment of your two worries and a proposal for a more robust framework.

  ### 1. The Audit: Correspondence Table

  | Feature | Technology Analogy | Norm/Practice Reality (Dueling/Slavery) |
  | :--- | :--- | :--- |
  | **The Job** | A specific function (e.g., drilling a hole, transporting data). | Social coordination, status signaling, dispute resolution, economic extraction. |
  | **The Tool** | The device or software (e.g., a drill, a floppy disk). | The norm or institution (e.g., the Code Duello, chattel slavery). |
  | **The User** | The operator who benefits from the tool's function. | The elite class maintaining the norm (e.g., gentlemen, plantation owners). |
  | **The Metric** | Efficiency, cost-effectiveness, reliability. | Social stability, honor satisfaction, profit margins, political power. |
  | **The Glitch** | The tool breaks, slows down, or becomes expensive to maintain. | The norm creates excessive violence, economic stagnation, or political instability. |
  | **The Replacement** | A newer, better technology. | New institutions (courts, wage labor, police forces, prisons). |
  | **The Swap** | Voluntary adoption by the user seeking optimization. | Legislative abolition, social shaming, state enforcement, or cultural drift. |

  ### 2. Disanalogies: Decoration vs. Biting

  **Decoration (Superficial Differences)**
  *   **Tangibility:** Tools are physical; norms are abstract. *Irrelevant.* We speak of "social engineering" precisely because norms function like structures.
  *   **Design Intent:** Tools are designed by engineers; norms evolve organically. *Irrelevant.* Evolutionary selection pressures on norms can mimic design without a designer.
  *   **Speed of Swap:** Technology swaps can be instant; norms take generations. *Irrelevant.* This is a difference in degree (friction), not kind.

  **Biting (Structural Flaws)**
  *   **The Externality Problem:** When I swap a hammer for a nail gun, I bear the cost. When a society swaps slavery for wage labor, the *cost* is often borne by the enslaved (who may face worse conditions initially) or the state (taxes for enforcement), while the *benefit* goes to the industrialists. The "user" of the tool is not always the "payer" for the swap.
  *   **The Normative Claim:** A broken hammer doesn't claim you are *evil* for using it. A norm carries moral weight. Abandoning a norm requires not just seeing it as *inefficient*, but often as *illegitimate*. The technology analogy strips the "ought" out of the "is."
  *   **The Agency Mismatch:** Technology assumes the user decides to swap. In abolition, the people who decided the "tool" was done were often *not* the primary users (e.g., Northern abolitionists ending Southern slavery).

  ### 3. Auditing Your Worries

  #### Worry 1: The Cognitive Act (Interests vs. Arguments)
  *Your worry:* Noticing a tool works worse is a cognitive act. Doesn't this just relabel "argument" as "interest"?
  *Verdict:* **Your worry holds.**

  The analogy relies on a hidden equivocation between **Instrumental Rationality** and **Moral Rationality**.
  *   **Instrumental:** "Dueling is bad because I might die and leave my estate leaderless." (Interest)
  *   **Moral:** "Dueling is bad because murder is wrong." (Argument)

  The functionalist claims the first drives the change. However, to identify a norm as "no longer useful," you must first change your valuation of what "useful" means.
  *   *Example:* Slavery was economically efficient for planters for a long time. It stopped being "useful" only when the *national* interest shifted toward industrialization (which requires mobile labor, not fixed capital). But who defined the "national interest"? That definition was fought over via **arguments** (moral, political, economic).
  *   *The Leak:* The moment you say "this norm is no longer useful," you have already accepted a premise (e.g., "violence is bad" or "industrial growth is good"). That premise is a moral argument disguised as a utility metric. The analogy doesn't eliminate persuasion; it just pushes the persuasion back one step to the definition of "utility."

  #### Worry 2: The Beneficiary Split (Dueling vs. Slavery)
  *Your worry:* Dueling was dropped by users; Slavery was dropped by non-users. Does the analogy break?
  *Verdict:* **This is the fatal flaw.**

  The analogy collapses here because it cannot account for **power asymmetry**.
  *   **Dueling (User-Driven Obsolescence):** This fits the technology analogy well. Gentlemen (users) found courts (replacement) better for protecting property and reputation without the risk of death. They swapped the tool voluntarily.
  *   **Slavery (External Condemnation):** Slaveholders did not swap the tool because they found a better one; the tool was **confiscated**. The "users" (planters) fought to keep it until they were militarily defeated or politically outvoted.

  If you treat Slavery like a Technology, you imply the slaveholder woke up one day and said, "You know, wage labor has a better ROI." History shows they did not. They had to be forced. The "Norm as Technology" analogy implicitly assumes a liberal consensus where everyone agrees on the goal function. It fails in adversarial contexts where one group's "tool" is another group's "shackle."

  ### 4. A Better Analogy: "Infrastructure Condemnation" vs. "Market Obsolescence"

  To save the insight without the errors, you need a dual-analogy that distinguishes between norms that fade (Dueling) and norms that are crushed (Slavery).

  **1. For Dueling: Market Obsolescence (The Floppy Disk)**
  *   **Mechanism:** The environment changes (industrialization, urbanization), making the tool inconvenient.
  *   **Driver:** The users themselves prefer the new standard.
  *   **Role of Argument:** Minimal. Arguments just highlight the inefficiency.
  *   **Why it fits:** Gentlemen stopped dueling because the social ecosystem shifted toward commerce and law, making dueling a liability.

  **2. For Slavery: Condemned Infrastructure (The Unsafe Bridge)**
  *   **Mechanism:** The structure is still "useful" to the owners (it holds their weight/profit), but it is deemed unsafe for the public.
  *   **Driver:** External regulators (State/Public) force the closure, often against the owners' wishes.
  *   **Role of Argument:** Critical. You need moral arguments to justify the condemnation ("This bridge kills people") to overcome the owners' property rights ("It's my bridge").
  *   **Why it fits:** This captures the **coercive** element of abolition. A bridge isn't removed because it's inefficient; it's removed because it's *illegitimate*.

  ### Summary for Your Reading Group

  Tell them the "Norm as Technology" analogy is a **Category Error** that conflates *adaptation* with *justice*.

  1.  **On Interests vs. Arguments:** Tell them that "utility" is not an objective metric like torque or speed. Utility is value-laden. Deciding that "social stability" is more useful than "honor satisfaction" is itself a moral argument. The analogy hides the value judgment inside the word "useful."
  2.  **On the User/Swap:** Tell them the analogy works for **Dueling** (Voluntary Obsolescence) but fails for **Slavery** (Forced Condemnation). If they want to keep the analogy, they must explain why the "user" of slavery (the planter) was not the one who swapped the tool. If the "user" didn't swap it, it wasn't a technology upgrade; it was a seizure of assets.

  **The Pivot:** Suggest that norms aren't just tools; they are **Treaties**.
  *   Dueling ended because the treaty terms were renegotiated by the signatories (better courts available).
  *   Slavery ended because the treaty was violated and enforced by a third party (the State/War) because the terms were fundamentally unjust.
  *   This restores the role of **Argument** (negotiating terms/justice) alongside **Interest** (why sign the treaty?), without reducing morality to mere efficiency.
