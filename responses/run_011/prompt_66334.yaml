prompt: |-
  our ethics reading group has a move somebody always makes when we hit dueling or abolition: the norms didn't die because anyone got persuaded, they died because they stopped being useful — same way a technology gets dropped when something better comes along. a norm is a tool doing a job, and when the tool stops paying you swap it out. it's supposed to settle the arguments-vs-interests question in favour of interests, and against the honor-code people.

  can you audit it? i want the correspondence table — what's the job, what's the tool, who's the user doing the swapping, what counts as the better replacement — and then the disanalogies, sorted into the ones that actually bite on that conclusion and the ones that are just decoration. two things i'm stuck on. first, with a technology somebody notices it works worse and picks otherwise, and that noticing is itself a cognitive act, so i worry the analogy doesnt separate interests from argument so much as relabel one as the other. second, the people who gave up dueling were the ones using it, whereas the people who ended slavery were mostly not the ones it served — does the analogy have to treat those as the same kind of thing, or does that split it in two? tell me whether my worries hold or whether it has resources to answer them, and what a better analogy for how dueling actually ended would look like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** An ethics reading group discussing the end of practices like dueling or slavery (abolition).
      *   **The Claim:** Norms die not because of persuasion (arguments) but because they become useless (interests). Norms = Tools. When a better tool comes along, the old one is swapped. This favors interests over "honor-code" moral arguments.
      *   **Task 1:** Audit the analogy (Norm as Technology). Create a correspondence table (Job, Tool, User, Replacement).
      *   **Task 2:** Identify disanalogies. Sort them into "Biting" (undermine the conclusion) vs. "Decoration" (superficial differences).
      *   **Task 3:** Address the User's two specific worries:
          1.  *Cognitive Act Worry:* Noticing a tool works worse is a cognitive act (argument/reason), so does this really separate interests from arguments?
          2.  *Beneficiary Worry:* Dueling users gave it up; Slavery beneficiaries did *not* give it up (outsiders did). Does the analogy break here?
      *   **Task 4:** Evaluate if the worries hold or if the analogy has resources to answer them.
      *   **Task 5:** Propose a better analogy for how dueling/slavery actually ended.

  2.  **Analyze the "Norm as Technology" Analogy:**
      *   *Core Idea:* Functionalism/Pragmatism. Norms exist to solve coordination problems or signal status. When they fail to do so efficiently, they are discarded.
      *   *Implicit Theory:* Historical Materialism (light version), Rational Choice Theory, Evolutionary Ethics.
      *   *Goal:* Demystify moral progress. It's not "we became better," it's "we became smarter/richer/industrialized."

  3.  **Drafting the Correspondence Table:**
      *   *Job:* What function does the norm serve? (e.g., dispute resolution, status signaling, social cohesion, economic extraction).
      *   *Tool:* The norm/practice itself (Dueling, Slavery).
      *   *User:* Who decides to swap? (The elite, the society, the state).
      *   *Replacement:* The new mechanism (Courts, Wage Labor, Police).
      *   *Metric:* Efficiency, Cost-Benefit, Utility.

  4.  **Analyzing Disanalogies:**
      *   *Decoration:* Physical vs. Abstract, Intentional Design vs. Emergent.
      *   *Biting:*
          *   *Normative Force:* Tools don't claim moral authority; norms do.
          *   *Externalities:* Tools affect users; norms often affect non-users (slaves).
          *   *Path Dependence:* Norms stick due to belief, not just utility.
          *   *The "Who Decides" problem:* Technology is usually adopted by the user. Norms are often imposed or abolished by non-users.

  5.  **Addressing Worry 1: The Cognitive Act (Interests vs. Arguments):**
      *   *The Worry:* Realizing a tool is broken requires reasoning. Isn't that an argument?
      *   *Analysis:* The analogy tries to say the *motivation* is interest (utility), not moral truth. But the *mechanism* of change is recognition.
      *   *Verdict:* The worry holds water. The analogy conflates *instrumental rationality* (is this efficient?) with *moral reasoning* (is this right?). However, the proponent can argue that instrumental rationality is distinct from moral persuasion. But often, "useless" is defined by a shift in values (which *is* moral change).
      *   *Refinement:* The analogy hides the value shift inside the definition of "useful." If "useful" means "maximizes profit," that's a value judgment.

  6.  **Addressing Worry 2: The Beneficiary Split (Dueling vs. Slavery):**
      *   *The Worry:* Dueling was abandoned by duelists (users). Slavery was abandoned by non-slaveholders (abolitionists) against the interests of slaveholders.
      *   *Analysis:* This is a critical fracture. The "Tool" analogy assumes the *user* swaps the tool. In slavery, the *tool* was forcibly taken away by a different agent (the State/Public) who didn't use it.
      *   *Verdict:* This splits the analogy. Dueling fits the "obsolete technology" model (gentlemen found courts better). Slavery fits the "confiscated weapon" or "regulated hazard" model. The analogy fails to account for power asymmetry where the "tool" is a person or a system exploited by one group against another.

  7.  **Developing a Better Analogy:**
      *   Need something that accounts for:
          *   Moral persuasion (arguments matter).
          *   Interest/Utility (material conditions matter).
          *   Power dynamics (who decides).
          *   Internal belief vs. External enforcement.
      *   *Idea 1:* Ecology/Invasive Species. (A bit passive).
      *   *Idea 2:* Software Legacy Code. (Good for path dependence, but still implies a single developer).
      *   *Idea 3:* *Infrastructure vs. Traffic Laws.*
      *   *Idea 4:* *Disease/Pathogen vs. Immune Response.* (Abolitionists as white blood cells? A bit violent).
      *   *Idea 5:* *Currency/Exchange Rate.* (Norms have value based on collective belief).
      *   *Selection:* **Infrastructure/Operating System Update.** It captures the idea that you can't just swap a tool; you have to change the underlying system. It allows for both "bug fixes" (interests) and "security patches" (ethics).
      *   *Alternative Selection:* **The "Common Law" Analogy.** Norms evolve like case law. Precedent (tradition) meets new facts (material change) leads to new rulings (moral persuasion). This bridges the gap between "interest" and "argument."
      *   *Better Selection:* **A Ecosystem Niche.** Norms occupy a niche. If the environment changes (industrialization), the niche disappears. But sometimes a predator (abolitionists) kills the species even if the niche exists.
      *   *Decision:* Let's go with **"Legacy Infrastructure"** combined with **"Public Health."** Or perhaps **"Currency Devaluation."**
      *   *Actually, the best fit for the specific tension (Interest vs. Argument)* is **"Price Signal vs. Regulation."** Markets (interests) shift, but Regulations (arguments/laws) force shifts.
      *   *Let's try:* **The "Operating System" Analogy.** Norms are code. Sometimes code is deprecated because it's inefficient (Interest). Sometimes it's patched because it's vulnerable/unsafe (Moral Argument/Security). This distinguishes between "works worse" and "is dangerous."

      *   *Wait, let's look for something that captures the *social* aspect.*
      *   *Proposal:* **The "Language" Analogy.** Words fall out of use. Sometimes because they are clunky (efficiency). Sometimes because they become offensive (moral shift). You can't just say "it's inefficient." The *meaning* changed.
      *   *Proposal:* **The "Treaty" Analogy.** Norms are peace treaties. They end when the balance of power shifts (Interest) OR when the parties decide the terms are unjust (Argument).

      *   *Let's settle on:* **Infrastructure + Regulation.** It distinguishes between "obsolete" (bridges that collapse) and "condemned" (bridges that are unsafe but still stand).

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the reading group's move (Functionalism).
      *   **Part 1: The Audit (Correspondence Table).** Clear mapping.
      *   **Part 2: Disanalogies.** Sort into Decoration vs. Biting.
      *   **Part 3: Addressing the Worries.**
          *   Worry 1 (Cognitive Act): Validate it. The distinction between "instrumental reason" and "moral reason" is the weak point.
          *   Worry 2 (Beneficiaries): Validate it strongly. This is the fatal flaw for slavery.
      *   **Part 4: The Better Analogy.** Propose "Infrastructure Condemnation" or "Currency Devaluation." Let's go with **"Currency Devaluation"** (norms rely on collective belief) mixed with **"Regulatory Ban"** (external enforcement). Actually, **"Ecosystem Invasive Species"** is good for abolitionists.
      *   *Refinement on Better Analogy:* Let's suggest **"The Zoning Law vs. Market Price."** Market price explains why buildings get abandoned (Dueling). Zoning law explains why buildings get demolished (Slavery). This captures the two different mechanisms.

  9.  **Refining the Tone:**
      *   Academic but accessible.
