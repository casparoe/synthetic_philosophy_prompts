answer: |-
  This is a remarkably sharp diagnosis. You have put your finger on the structural isomorphism between the problem of interpersonal utility comparisons (IPC) and the problem of calibrating distinct measuring instruments. As someone standing at the intersection of social choice and measurement theory, I can tell you that your intuition is closer to the truth than most economists'.

  However, you asked me to push back hard. Your hypothesis is *necessary* but not *sufficient*. If we stop at "it's a metrological problem," we miss why the dispute has persisted for a century despite everyone understanding the math.

  Per your instructions, I will brainstorm the candidate diagnoses for this stalemate, test them against the history and logic of the field, kill off the weak ones, and then settle on the most robust explanation.

  ### Phase 1: Brainstorming Candidate Diagnoses

  **Candidate 1: The Verbal Dispute Hypothesis**
  *Diagnosis:* The camps are talking past each other. When Harsanyi says "utility," he means "cardinal satisfaction." When Robbins says "utility," he means "revealed preference ordering." If they agreed on definitions, the dispute would vanish.
  *Stress Test:* This fails. They know they are using different definitions. Robbins explicitly argues that we *ought not* use the cardinal definition because it is unscientific. Harsanyi argues we *must* use it to make sense of social rationality. This is not a confusion of terms; it is a conflict over which terms are admissible in science.
  *Verdict:* **Killed.**

  **Candidate 2: The Hidden Empirical Hypothesis**
  *Diagnosis:* The dispute is actually about human psychology. If neuroscience could provide a "hedonimeter" (measuring dopamine or neural firing rates as a proxy for utility), Robbins would concede. The stalemate is due to a lack of technology.
  *Stress Test:* This is the most common layman's view, but it fails the philosophical test. Even if I could measure your neural pleasure units (NPUs) and mine, Robbins would ask: "Why should 10 NPUs for you count the same as 10 NPUs for me in a social welfare function?" You still need a weighting rule. The metrological problem shifts from "measuring the magnitude" to "calibrating the weight." The ethical gap remains even with perfect empirical data.
  *Verdict:* **Killed.**

  **Candidate 3: The "Bedrock Intuition" Clash**
  *Diagnosis:* This is a fundamental philosophical split. Positivists (Robbins) believe only observables are meaningful. Realists (Harsanyi) believe mental states are real and comparable. Neither can prove their ontology to the other.
  *Stress Test:* This explains the persistence, but it's too static. It doesn't explain why the argument takes the specific *mathematical* form it does (affine transformations, invariance conditions). It ignores the technical constraints you identified.
  *Verdict:* **Survives as a background condition, but not the primary mechanism.**

  **Candidate 4: Your Metrological Hypothesis**
  *Diagnosis:* The problem is strictly about scale calibration. VNM utility is interval-scaled (affine freedom). Without a non-arbitrary zero and unit shared across persons, comparison is mathematically undefined, just like comparing uncalibrated thermometers.
  *Stress Test:* This is technically correct regarding the *structure* of utility. However, if it were *only* metrological, the representation theorems (which formalize these constraints) should have ended the debate. They didn't. Why? Because one side (Harsanyi) is willing to *postulate* the calibration as an ethical axiom, while the other (Robbins) treats the lack of calibration as a prohibition on assertion.
  *Verdict:* **Survives, but requires modification.** It is a metrological constraint forcing an ethical choice.

  **Candidate 5: The "Different Questions" Hypothesis**
  *Diagnosis:* Robbins is answering an epistemic question ("What can we know?"). Harsanyi is answering a decision-theoretic question ("What must we assume to act consistently?"). They are not disagreeing about the world; they are disagreeing about the rules of the modeling game.
  *Stress Test:* This fits the history. Robbins was setting boundaries for *scientific economics*. Harsanyi was setting conditions for *rational social choice*. The stalemate exists because neither side accepts the other's jurisdiction.
  *Verdict:* **Strongest Contender.**

  ---

  ### Phase 2: The Synthesis and Pushback

  Here is the settled diagnosis. You are right that the *impasse* is metrological, but you are wrong that the *disagreement* is merely about measurement.

  **1. The Thermometry Analogy: Where it Holds and Where it Breaks**
  Your analogy to thermometry is precise regarding the *scale type*.
  *   **Temperature:** Interval scale. Differences are meaningful, ratios are not (unless you have Kelvin). To compare two beakers, you need the Zeroth Law of Thermodynamics to establish that "temperature" is a transitive property of equilibrium across systems.
  *   **VNM Utility:** Interval scale. Fixed up to positive affine transformation ($u' = au + b, a > 0$).
  *   **The Break:** In physics, the Zeroth Law is an empirical fact about the world. In welfare economics, there is no "Zeroth Law of Welfare." There is no empirical mechanism that guarantees my utility scale is commensurable with yours.

  This is where your hypothesis needs the pushback. You suggest the dispute is "metrological... wearing ethics clothes." I argue it is **ethical... wearing metrological clothes.**

  Robbins uses the metrological impossibility (the affine freedom) as a *shield* to ban ethical judgments from science. He says, "We cannot measure it, therefore we cannot speak of it."
  Harsanyi uses the metrological possibility (we can define axioms that *allow* comparison) as a *sword* to enforce ethical consistency. He says, "If we don't compare it, we violate rationality axioms (like Pareto), therefore we must assume we can measure it."

  The affine-freedom point is **decisive** for the *math*, but it is a **red herring** for the *dispute*. Both sides agree on the math. Robbins says, "Because of affine freedom, IPC is scientifically meaningless." Harsanyi says, "Because of affine freedom, we must add an ethical axiom to fix the scale if we want to maximize social welfare."

  **2. Why the Representation Theorems Didn't Close It**
  You asked: *"If that were the whole story, the dispute should of been closed by a representation theorem decades ago, and it wasn't."*

  Theorems do not settle premises.
  *   **Harsanyi's Aggregation Theorem (1955):** Shows that if individuals are VNM-rational, and society satisfies Pareto, then social welfare *must* be a weighted sum of individual utilities.
  *   **The Catch:** The theorem *assumes* that individual utilities are already cardinally measurable and comparable enough to be summed. It derives the *weights*, not the *scale*.
  *   **Robbins' Counter:** He rejects the input. He argues that since VNM utility is only ordinal (in his view) or non-comparable (in the strict sense), the theorem's premises are false in the real world.

  The theorem proves: *If* you accept IPC, *then* Utilitarianism follows.
  Robbins says: I don't accept IPC.
  Harsanyi says: You must, to be rational.
  The theorem cannot bridge that gap because it is a conditional statement, not an empirical discovery.

  **3. The Actual Turn: Informational Basis**
  The reason the camps haven't budged is that they are arguing over the **Informational Basis of Judgment** (a distinction formalized by Amartya Sen, who sits in your "middle" camp).
  *   **Robbins/Little:** The informational basis must be restricted to observable preference orderings (Ordinal, Non-comparable).
  *   **Harsanyi:** The informational basis must include cardinal welfare levels (Cardinal, Unit Comparable).
  *   **Sen:** The informational basis can be partial (Cardinal, Unit Comparable but not Level Comparable, etc.).

  This is not a verbal dispute. It is a dispute over **what data is admissible** for a social decision function. In your terms: Robbins refuses to accept data from an uncalibrated instrument. Harsanyi argues we must calibrate the instrument by fiat to make the system work.

  ### Phase 3: What Counts as Progress?

  You asked what would count as progress: a theorem, a measurement result, a distinction, or nothing?

  *   **A Theorem?** No. We have enough theorems (Harsanyi, Sen, Arrow). They only map the consequences of assumptions.
  *   **A Measurement Result?** No. As argued above, even a "neural hedonimeter" does not solve the weighting problem. Knowing you feel pain at intensity 5 and I feel it at 5 does not tell a social planner if we should weight them equally.
  *   **A Distinction?** **Yes.** Specifically, the distinction between **Measurement** and **Weighting**.

  **The Path Forward (The "Progress"):**
  Progress lies in acknowledging that Interpersonal Comparisons are not *empirical discoveries* (like finding a new particle) nor *logical truths* (like a theorem). They are **Ethical Axioms with Metrological Consequences.**

  If you treat IPC as a metrological problem alone, you look for a better ruler. You won't find one.
  If you treat IPC as an ethical problem alone, you look for a moral argument. You find endless debate.

  The synthesis is this: **We choose the metrological structure to satisfy ethical constraints.**
  *   If you value "scientific purity" (Robbins), you choose an ordinal, non-comparable scale. You pay the price: you cannot rank social states except by Pareto efficiency (which is very weak).
  *   If you value "social rationality" (Harsanyi), you choose a cardinal, comparable scale. You pay the price: you introduce an unobservable ethical axiom.

  **Conclusion for a Physicist:**
  Think of it like choosing a gauge in electromagnetism. The physics doesn't change, but the mathematical tractability does.
  *   Robbins insists on a gauge where only invariant quantities (observable preferences) are spoken. This makes the theory "gauge invariant" but incredibly hard to solve for social optima.
  *   Harsanyi fixes the gauge (assumes comparability) to solve the equations. This makes the theory solvable but introduces "gauge dependence" (the results depend on the ethical axiom chosen).

  **Final Verdict:**
  Your hypothesis is 80% correct. It *is* a metrological constraint. But the reason nobody has budged is not because they don't understand the measurement theory. It is because they disagree on whether it is permissible to **calibrate by decree.**

  Robbins says: "Calibration without a physical standard is fraud."
  Harsanyi says: "Calibration without a physical standard is a necessary convention for cooperation."

  Progress will not come from better measurement. It will come from explicitly stating the **cost of the calibration convention**. We need to stop asking "Is IPC true?" (it isn't a truth-apt statement) and start asking "What social decisions become possible/impossible if we adopt IPC as a convention?" That is the Sen program, and it is the only way out of the century-long stalemate.
