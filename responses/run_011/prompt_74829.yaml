answer: |-
  **OPINION ON THE CONVERGENCE REQUIREMENT AND PROPOSED AMENDMENTS**

  **To:** The Macroprudential Policy Committee
  **From:** Committee Member
  **Date:** [Current Date]
  **Subject:** Recommendation on Convergence Protocol and Current Month's Estimate

  I recommend that the Committee reject the Chair's proposal as drafted and instead adopt an amended procedure that distinguishes between informational asymmetry and structural model disagreement. For this month's publication, the Secretariat should release the median probability of 0.51, accompanied by a footnote disclosing the full range of estimates, specifically the 0.31 and 0.68 outliers. Neither outlier should be compelled to adopt the median. The amended procedure should be finalized by next Tuesday, allowing the Secretariat to update the compliance checklist before the next data deposit deadline on the 15th.

  **The Limits of the Convergence Requirement**

  The existing by-law rests on a specific theoretical premise: that disagreement among rational agents with shared information implies bad faith or withheld data. This assumes that all members operate with common priors and identical model structures, differing only in private signals. That premise does not obtain here. The divergence between the Head of Banking Supervision and the external academic is not driven by private data; both have attested to full disclosure. The divergence is structural. They disagree on the elasticity of margin spirals and the classification of stress as idiosyncratic versus systemic.

  No amount of data sharing can resolve a disagreement rooted in competing structural models. The protocol can demand that members reveal their information, but it cannot demand that they homogenize their modeling assumptions without sacrificing the diversity of expertise that justifies their appointment. Consequently, the protocol can demand convergence only where disagreement stems from information gaps. Where disagreement stems from structural uncertainty, the protocol can demand explanation, but it cannot demand alignment. Expecting full convergence in the face of model risk is mathematically unsound and procedurally coercive.

  **The Chair's Case and Its Limits**

  The Chair's argument for tightening the rule must be taken seriously. A rule tolerating unbounded dispersion risks entrenching factions, allowing members to ignore evidence by retreating into unfalsifiable modeling assumptions. Furthermore, market participants require a single figure to anchor expectations; the authority of that number depends on the Committee visibly striving for consensus. If members routinely publish divergent numbers without consequence, the published median may lose its status as a credible commitment.

  However, the Chair's solution creates a greater risk than the problem it solves. Forcing members to adopt a median they believe is wrong substitutes false consensus for genuine agreement. If the Head of Supervision believes risk is 0.68 but publishes 0.51, the Committee loses the warning signal inherent in that divergence. The Chair's concern regarding market confidence survives, but it should be met by transparency about the range of uncertainty, not by suppressing the outlier. The proposal to record three consecutive median adoptations as "no independent judgment" transmitted to appointing authorities is particularly dangerous. It incentivizes members to manufacture artificial disagreement to protect their reputations, or conversely, to suppress valid concerns to avoid administrative sanction. This undermines the independence the Committee requires to function.

  **Mechanical Criteria for Legitimate Divergence**

  To separate legitimate non-convergence from evasion, the Secretariat must apply a mechanical test that avoids judging the merits of the models. Any member remaining outside the five-point band after six rounds must file a Structural Disagreement Statement (SDS). The SDS must identify the specific parameter or structural assumption causing the divergence, such as "margin call elasticity parameter set to X rather than Y" or "systemic shock correlation assumed at Z."

  The Secretariat will verify only that the SDS identifies a model component distinct from the consensus model, not whether that component is correct. If a valid SDS is filed, the member's figure stands for publication alongside the median. No record of "no independent judgment" is transmitted for persistent outliers who file valid SDSs. If a member fails to file an SDS, or files one that fails to identify a specific structural parameter, they must adopt the median. This procedure removes discretion from the Committee regarding the validity of the disagreement while maintaining accountability for the explanation.

  **Explicit Costs and Failure Modes**

  Adopting this recommendation carries explicit costs. We lose the appearance of unanimity. Publishing a range rather than a single point may be interpreted by the press as indecision or internal conflict, potentially weakening the immediate market impact of the announcement. We also lose a layer of internal discipline. The Chair's rule forces members to scrutinize their models intensely to avoid the stigma of forced convergence; my recommendation removes that pressure, potentially allowing members to rest on entrenched modeling habits rather than updating vigorously.

  Furthermore, this alternative opens a failure mode the Chair's rule would have suppressed: the risk of strategic obfuscation. Members may hide laziness or ideological bias behind complex structural explanations that the Secretariat cannot validate. However, the cost of false consensus is higher. A Committee that hides its dispersion invites model risk to accumulate unnoticed. By accepting visible disagreement, we preserve the integrity of the risk assessment even if we diminish the perceived certainty of the output. The Committee should prefer a credible range to a precise fiction.
