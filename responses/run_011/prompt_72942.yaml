answer: |-
  Subject: Re: Reference class forecasting for the SMR review

  I appreciate the chance to think this through before we commit the next two months, and I want to be direct about where I think the value lies versus where we might be chasing ghosts. My honest read is that for our purposes, the reference class problem is not a deep conceptual puzzle that needs solving before we can act, but rather a modeling judgment call that needs documenting and sanity-checking. Your director is right to want rigor, but there is a risk that we interpret rigor as philosophical purity rather than decision quality. If we spend eight weeks trying to find the metaphysically correct reference class, we will fail, because there isn't one. There are only classes that are more or less useful for predicting the specific outcome we care about. Therefore, the ordering of these strands should be driven entirely by their impact on the grant decision and their tractability within our constraints, rather than by their intellectual depth or historical pedigree.

  The strand that deserves the bulk of our time, and which is upstream of everything else, is the forecasting-in-practice version. This is the work of actually selecting a set of past cases, deriving a base rate, and then specifying a formal mechanism for adjusting that rate based on the specific details of the SMR project in front of us. This is the only strand that produces a number we can use, and it constrains the other questions because once you decide how you are going to combine the base rate with case-specific information, the pressure to find the perfect reference class diminishes. If we treat the base rate as a prior probability that gets updated by evidence specific to the company and technology, then the exact boundaries of the class matter less than the strength of the updating rule. This is highly tractable for us because it turns a philosophical problem into a procedural one. We can document why we chose a specific set of comparables, calculate the base rate, and then explicitly write down the factors that justify moving away from that average. This satisfies the director's request for doing it properly without getting stuck in an infinite regress of class selection.

  The second priority, which is really a sub-component of the first, is the statistical requirement regarding the narrowest class. We should not treat this as a requirement to be satisfied but as a sensitivity analysis to be run. The problem with demanding the narrowest class with statistics is that for a unique twenty-year bet, the narrowest class often contains only the single case itself, which gives us no statistics at all. Instead of trying to solve this, we should acknowledge that different reasonable classes yield different base rates. Our goal should be to show that our decision is robust across a range of plausible classes. If the probability of success is too low to fund under the narrow class of similar reactor designs but high enough under the broader class of novel energy technologies, that tension is the actual insight we need to present to the board, not a bug to be fixed. This is tractable for you and the intern because it involves running the numbers multiple ways and presenting the range, rather than arguing for one true number.

  The legal-evidence strand is worth acknowledging but not pursuing. That problem concerns whether base rates alone justify a verdict about a specific instance, often in a context where you lack specific evidence or where fairness is the primary concern. In our context, we are not adjudicating liability; we are allocating capital under uncertainty. We always have specific information about the company, the team, and the technology, so we are never relying on base rates alone. The question of whether the base rate justifies the belief is secondary to whether the combination of base rate and specific evidence maximizes our expected impact. Diving into the epistemology of statistical evidence would consume time without changing the allocation decision, so it should be deprioritized.

  The anthropic strand should be dropped entirely. It deals with observer selection effects and self-location, which are relevant for cosmological questions or existential risk estimates where the observer's existence is contingent on the outcome. For a grant decision about a specific reactor design, our existence as observers is not contingent on the success of this company. Including this would add complexity without altering the probability estimate in any meaningful way, and it risks confusing the director rather than clarifying the decision. It is the least tractable and the least relevant to Monday morning.

  There is a missing strand that matters more than the legal or anthropic ones, which is the problem of model uncertainty versus parameter uncertainty. The reference class problem is often a proxy for the fact that we are unsure about the structure of the world that generates the outcomes. When we switch from the narrow class to the broad class, we are changing our model of what drives success in this domain. We should spend some of our two months making this explicit. Instead of asking which class is correct, we should ask which causal drivers are most relevant. Is success driven by regulatory hurdles, which suggests comparing to other nuclear projects, or by manufacturing scalability, which suggests comparing to other hardware startups? This shifts the conversation from arbitrary class selection to causal reasoning, which is much more defensible in a grant review.

  Regarding the intern, a philosophy undergrad is actually well-suited for this if tasked correctly. They should not be asked to solve the reference class problem but to map the assumptions. Their job should be to document every choice we make in constructing the classes and adjusting the probabilities, ensuring that we can explain why we weighted certain factors over others. This creates the audit trail your director wants without requiring the intern to derive new statistical theory.

  The criteria I am using to rank these are decision utility first, tractability second, and dependency third. I am prioritizing the strand that changes the action we take over the strand that satisfies a philosophical requirement. I am trading off depth for speed because we have a hard deadline and a binary decision to make. If we could spend a year on this, I might suggest digging deeper into the epistemic foundations, but for an eight-week sprint aimed at a fall review, procedural clarity is more valuable than metaphysical correctness.

  The only thing that would make me reshuffle this list is if during our initial modeling we find that the probability estimate is extremely sensitive to the reference class choice in a way that flips the funding decision. If the narrow class says one percent and the broad class says forty percent, and our funding threshold is ten percent, then the class selection becomes the critical path. In that case, we would need to elevate the statistical class problem and spend more time justifying the causal drivers behind the class selection rather than just running sensitivity analysis. However, even in that scenario, the solution is not to find the true class but to build a weighted model that incorporates multiple classes based on their predictive validity for similar past decisions.

  So my recommendation is to treat the director's request as a call for better documentation and sensitivity analysis rather than a demand for philosophical resolution. We will define a primary reference class based on causal similarity, calculate the base rate, adjust for specific factors using a documented rubric, and show how the probability changes under alternative classes. This gives us the rigor of reference class forecasting without falling into the trap of thinking there is a single correct answer waiting to be found. If we frame it this way, we deliver what the director needs for the review without wasting two months on questions that won't change where the money goes.
