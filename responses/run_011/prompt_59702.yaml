prompt: |-
  Right so I'm 17 and I've got weirdly obsessed with the big history stuff over the last year. In class we did Harari's Sapiens and everyone just sort of accepted it, then I dug up Diamond's old essay calling farming the worst mistake in the history of the human race, and then I read Graeber and Wengrow's Dawn of Everything and it kind of blew both of them up for me. I've landed on a position and I want you to attack it properly, not be polite about it.

  My view, which I've started calling the ratchet fallacy in essays (my history teacher hates this):

  1. There was no agricultural revolution, singular. There were thousands of local experiments spread over millenia, and loads of them got dropped — people took up cultivation and then walked away from it, or only did it part of the year, or swapped their whole political setup with the seasons.
  2. So any account that gives deep history a direction — progress or decline, doesn't matter which — is unfalsifiable retrofitting. It picks out the societies that eventually led to us and files everything else under "noise". My evidence for this so far is that I asked my teacher to name one observation that would have forced Harari to change his mind and he couldn't, which felt like a win but is obviously not really an argument.
  3. We keep retelling these stories because they make the present look inevitable, which is convenient for the people running it.

  What I want: what would count against this, ranked from "fatal, abandon it" down to "awkward but survivable". Specifically, what would the record actually have to look like for a directional story to be safe — talk to me about stature and teeth and disease markers, how permanent settlements really are, whether reversions to foraging are genuinely documented or just inferred, and whether hierarchy tracks cultivation or shows up plenty without it. Are there patterns that hold across the independent centres of domestication even once you allow for all the variation Graeber and Wengrow make so much of? Because if there are, point 1 might just be a dodge.

  The thing I genuinely can't explain, and I'd rather you went hard on it than let me off: if there's no ratchet, why does the escape seem to run one way once states and cities exist? Plenty of places apparently slipped back out of farming, but I can't think of one that slipped back out of administration. Either my view handles this or it doesn't.

  Also — which of the three points would someone committed to this general outlook concede is a real problem, and which would they wave off as a misreading? Is point 2 just insulated, so that any pattern gets answered with "well, that region was different"? If it can't lose, is that fatal, or is that acceptable for a claim of that kind? And can 1 be true while 2 is false? I suspect they come apart but I can't show it. Finally, is point 3 even testable, or have I confused explaining why people believe something with showing it's wrong?

  Please write the whole thing in British English. No reading list, no references, no footnotes — I can't chase any of that down and it'd just be padding. Don't summarise the books back at me either, I've read them, I want the arguments. Under about 1200 words if you can manage it, I'll read it on the bus.
reasoning: |-
