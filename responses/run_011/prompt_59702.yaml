      *   *Settlements:* Permanent settlements correlate strongly with storage and domestication. Reversions to foraging exist (e.g., Great Basin, some European Neolithic margins) but are rare once population density hits a certain threshold.
      *   *Hierarchy:* Hierarchy exists without farming (e.g., Pacific Northwest, Göbekli Tepe potentially), but *institutionalized* hierarchy (states) correlates with surplus storage enabled by cereals.
      *   *The "One-Way" Problem:* This is the strongest point against the user. Once population density increases via calories per acre, you can't go back without mass starvation. It's a demographic ratchet, not just a political one.
      *   *Falsifiability (Point 2):* Is it unfalsifiable? If we found a complex state without agriculture, that would hurt Diamond/Harari. If we found agriculture everywhere led to immediate equality, that would hurt Diamond. But the user's claim is that *any* direction is retrofitting. To falsify this, you need a universal mechanism.
