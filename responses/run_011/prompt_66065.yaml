          *   More importantly: They missed the **normative status of the conjunction**.
          *   In the Lottery, believing "Ticket 1 will lose" is trivial. Believing the conjunction "All tickets will lose" is known false (one must win).
          *   In the Preface, believing "Claim 1 is true" is the goal. Believing the conjunction "All claims are true" is the *aim*, but the humility belief says "Not all are true."
          *   *The Real Miss:* The **aim of inquiry**. In the Lottery, the truth is guaranteed to be in the set of negations (one ticket wins). In the Preface, the truth is *hoped* to be in the conjunction (all claims true). The Preface paradox involves a conflict between the *constitutive aim of assertion* (truth) and *inductive humility*. The Lottery involves a conflict between *probabilistic reasoning* and *deductive closure*.
          *   *Better angle:* They both assume the "Belief" in the Preface is the same kind of state as the "Belief" in the Lottery. But the Preface involves *assertoric commitment*. The Lottery involves *prediction*.
          *   *Best angle (The "Joint Failure"):* They are arguing about **synchronic consistency** (what beliefs can I hold *now*?). They ignore **diachronic rationality** (how did I get these beliefs?). The Preface paradox is essentially about the tension between *local justification* (chapter by chapter) and *global reliability* (the whole book). The Lottery is about *chance*.
          *   *Wait, I need to be careful not to cite literature.* I need my own reconstruction.
          *   *Key Insight:* They both treat the paradoxes as problems of **closure** (if I believe A and believe B, I must believe A&B). But the real asymmetry lies in the **cost of error**. In the Lottery, being wrong about a ticket is costless/irrelevant. In the Preface, being wrong about a claim is a failure of the specific inquiry.
          *   *Actually, the strongest "missed" point:* They assume the "Humility Belief" in the Preface is on the same epistemic footing as the "Chapter Beliefs." But the Humility Belief is a *second-order* belief about the reliability of the process that generated the first-order beliefs. The Lottery beliefs are all *first-order* predictions about outcomes. The Preface is a conflict between First-Order Evidence and Second-Order Evidence. The Lottery is a conflict within First-Order Evidence. *This* is the real asymmetry that survives scaling.

