          *   Lottery: All beliefs are based on the *same* evidence (the setup of the lottery). $P(T_1 loses) = P(T_2 loses)$.
          *   Preface: Chapter beliefs are based on *specific* evidence for that chapter. The Humility belief is based on *general* evidence about human fallibility.
          *   This means the Preface is a conflict between *specific* and *general* evidence. The Lottery is a conflict within *general* evidence.
          *   This explains why scaling (Rosa's Move 3) doesn't fully kill the distinction. Even with a billion tickets, the lottery beliefs are still all based on the *same* statistical setup. In the Preface, the beliefs are based on *diverse* evidential grounds.
          *   This is the "Joint Failure": They treated the *inputs* to the belief function as homogenous in both cases. They aren't in the Preface.

  6.  **Review against Constraints:**
