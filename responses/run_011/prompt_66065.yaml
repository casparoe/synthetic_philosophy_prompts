  7.  **Final Polish:** Ensure the distinction in the "Joint Failure" section is crisp. The "First-Order vs. Second-Order" or "Homogenous vs. Heterogenous Evidence" distinction is the winner here. I'll go with **Homogeneity of Evidence**. In the Lottery, every belief rests on the exact same ground. In the Preface, the positive beliefs rest on distinct, specific grounds, while the negative conjunction rests on a general ground. This survives scaling.

      *Self-Correction on Move 7:* Rosa claims Ben contradicts himself. Ben said "Same shape" in Move 2, but in Move 6 implies the *situation* makes them different. Is "shape" logical form or pragmatic situation? Rosa interprets it as logical form. Ben likely means logical form is same, pragmatic situation differs. Move 7 is strong but relies on an equivocation on "shape." I should note that. Actually, Move 2 says "Same shape, fine, but not the same in the way that matters." So Ben already qualified "shape." Rosa's Move 7 is a bit of a gotcha that ignores Ben's Move 2 qualification. I'll rate it high but note the equivocation.

