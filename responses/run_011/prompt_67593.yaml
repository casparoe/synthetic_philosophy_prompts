      *Closest Analog:* **Plantation Ledgers.** Both involve records created by an oppressor/administrator about vulnerable people, reducing them to data/clinical terms without identity/consent.
      *Second Closest:* **Tenant Union.** But Tenant Union was accepted because the *community* held the keys to privacy. Here, the donor is the *administrator*.

  7.  **Drafting the Prediction:**
