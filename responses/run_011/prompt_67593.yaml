      *   **Constraints:** Approach as an expert in archival theory/history of collecting. Think carefully (brainstorm/test rules). Distinguish settled practice from contested areas (consent, privacy, description). American English.
      *   **Input Data:** Six past cases (Highway Engineer, Utility Records, Tenant Union, Governor's Wife, Mine Widows, Plantation Ledgers). One new case (Psychiatric Hospital Photos).

