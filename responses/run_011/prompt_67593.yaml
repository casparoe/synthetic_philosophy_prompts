      *   *Rule 2: "Do Not Archive Dehumanizing Abstraction Without Remediation."*
          *   Highway: Pass (Residents unnamed, but focus was infrastructure/demolition, not the people's identities per se). *Nuance:* The harm was the demolition, the photos document the *loss*.
          *   Utility: N/A (Access issue).
          *   Tenant: Pass (Remediation possible via Union control).
          *   Gov Wife: N/A (Access issue).
          *   Mine: Pass (Voices centered).
          *   Plantation: Fail (Abstraction is the harm, no remediation -> Reject).
