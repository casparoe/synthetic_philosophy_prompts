  2. "Harmony" equivocates between a providential order and a descriptive ecological equilibrium, creating an inconsistency where "restoration" implies returning to a pre-human state that his own account of universal human impact renders inaccessible. This costs him a coherent target for remediation, as the "disturbed" state is the inevitable condition of human existence rather than a temporary deviation.

  3. The third passage supports a difference in degree via a continuum of subsistence, contradicting the claim of a difference in kind, which renders the assertion that man is a "higher order" ornamental rather than load-bearing. By relegating this doctrine to an incidental illustration and grounding the primary comparison in a sermon, Marsh sacrifices the evidential standing required to treat human action as a distinct geological cause.

  4. The hedge "approximately" implies empirical uncertainty inconsistent with the claim of a difference in kind, which would not require measurement, while simultaneously undermining the claim of a difference in degree, which demands the precise quantification he declines to provide. This inconsistency costs him the ability to empirically validate the magnitude of human agency relative to natural forces.

  5. As stated, this criterion cannot fix the beginning of a specific epoch because it describes a permanent condition of the species starting from the "rudest stages" rather than a distinct historical transition. To yield a date, he would need to add a magnitude threshold within the hedge of "approximately," but doing so would contradict his agential definition of human power.
