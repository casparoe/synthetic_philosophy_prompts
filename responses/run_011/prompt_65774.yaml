  7.  **Final Polish:** Check tone. Ensure it sounds like an objective analysis of a sibling argument. (Proceed to generate output).

      *Wait, one nuance on Move 5:* Brother says "the whole field is unidentifiable." That's technically true for *pure* statistical separation without constraints, but sociologists use constraints (like assuming age effects are non-linear). So "Right" on the collinearity, but maybe "Mostly Right" on the implication that *nothing* can be known. I'll stick with "Right" because the core statistical point is solid.

      *Nuance on Move 8:* Dev says "you've got zero account of that difference." Brother actually *does* have an account (natural vs. social), he just values one over the other. But Dev's point stands that Brother's account dismisses social reality too easily. I'll rate it "Right" because it exposes the weakness in Brother's ontology.

      *Missing Piece:* I need to make sure I don't just repeat Dev's Move 6. Move 6 is about *psychological internalization* (performing the identity). The missing piece should be about *external imposition* (structures that treat you as a member regardless of performance). This is the "Searle" vs "Hacking" distinction. Hacking = looping (internal/interaction). Searle = institutional facts (external/status). I will focus on Institutional/Material scaffolding.

