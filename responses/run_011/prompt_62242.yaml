answer: |-
  Your hypothesis is close, but it lets the deflationists off too easily. You suggest the camps are answering different questions (causal/historical vs. semantic/structural). That captures the *Code-Biology* vs. *Maynard Smith* tension well. But it doesn't quite capture the *Deflationist* (Sarkar/Keller) move, because they aren't answering a different question; they are dissolving the semantic question entirely.

  Here is the diagnosis of the substantive disagreement, followed by the verdict on the synthetic biology data.

  ### 1. The Diagnosis: Explanatory Autonomy vs. Causal Closure

  The fight isn't primarily about whether DNA *behaves* like a code (everyone agrees it maps triplets to amino acids). The fight is about **explanatory autonomy**.

  **The Code-Biology Realists (e.g., Barbieri)**
  *   **Claim:** The mapping between codon and amino acid is **ontologically distinct** from the chemical interactions that sustain it.
  *   **The Argument:** Chemistry is governed by necessity (affinity, thermodynamics). Codes are governed by convention (arbitrariness). Because the genetic code is arbitrary (UGA *could* be Trp, as you noted), the relationship cannot be reduced to physics/chemistry alone. There must be a "coding rule" that exists over and above the molecular machinery.
  *   **The Question:** "What kind of natural kind is this?" They want to establish biology as a science of *organization*, not just reduced chemistry.

  **The Deflationists (e.g., Sarkar, Keller)**
  *   **Claim:** "Information" and "Code" are **epistemic tools**, not ontological features. They are useful shorthand for complex causal chains, but they refer to nothing in the world that isn't already accounted for by molecular interactions.
  *   **The Argument:** If you fully specify the binding affinities of the tRNA, the synthetases, the ribosome structure, and the thermodynamics, you have explained the phenomenon. Adding "it's a code" adds zero predictive power and implies a ghostly "rule" that doesn't exist. To a deflationist, "arbitrariness" just means "historical contingency," not "semantic freedom."
  *   **The Question:** "What causal work is this concept doing?" If the answer is "none," the concept is rhetoric.

  **The Maynard Smith/Signaling Middle**
  *   **Claim:** It is a code, but only in the sense of **evolutionary function**.
  *   **The Argument:** Maynard Smith grants the deflationists that physically, it's just molecules. But he argues that because the system was selected for *signaling* (reliably transmitting a state from genotype to phenotype), it acquires semantic properties via evolution. The "meaning" isn't in the chemistry; it's in the fitness consequence of the mapping.
  *   **The Question:** "What is the evolutionary stability of this mapping?"

  **Where Your Hypothesis Hits and Misses**
  You wrote: *"One side is asking why this particular sequence-token reliably yields this product... the other is asking whether the sequence-to-product relation has the right structure to be semantic."*

  *   **Hit:** This perfectly describes the Realist vs. Functionalist split.
  *   **Miss:** The Deflationist rejects the coherence of the second question. They argue that "semantic structure" is a projection by the biologist, not a feature of the cell. So the substantive disagreement is: **Is the semantic description observer-independent (Realist) or observer-relative (Deflationist)?**

  ### 2. The Verdict on Recoded Genomes

  Does the ability to rewire the code (mitochondrial variants, Church's synthetic genomes, etc.) settle the debate?

  **No. It is orthogonal to the ontological dispute.**

  Here is why the empirical data fails to kill the deflationist position:

  **1. Contingency $\neq$ Semantics**
  The recoding experiments prove **contingency**. They prove that UGA does not *chemically necessitate* Stop. The Code Realists cheer: "See! It's arbitrary! It's a convention!"
  The Deflationist replies: "You didn't change a 'code.' You changed the **chemical specificity of the release factors and tRNAs.** You built a different machine. The fact that the machine is configurable doesn't mean it's running 'software' in a sense distinct from hardware."
  To the deflationist, rewiring the genome is just like rewiring a loom. A loom can be rewired to make different patterns, but we don't say the loom is "reading code"; we say the mechanical linkages were altered.

  **2. The "Interpreter" Problem**
  For DNA to be a *literal* code, there must be a decoder that understands the convention. In human communication, the decoder (a human) exists independently of the message. In biology, the decoder (ribosome/tRNA/synthetase) is **encoded by the DNA itself**.
  *   **Realist:** This is a "semiotically closed" system, which is a unique ontological category.
  *   **Deflationist:** This is just a **autocatalytic set**. It's a chemical cycle where product A catalyzes the formation of enzyme B which catalyzes product A. Calling it a "code" obscures the circular causality.
  Recoding the genome doesn't break this circularity; you still have to supply the new tRNAs/synthetases *exogenously* or evolve them. You are still manipulating chemistry to change the mapping.

  **3. Explanatory Power**
  The ultimate deflationist trump card is: **Did the "code" concept predict the recoding?**
  No. Molecular biology (binding affinities, wobble hypotheses, structural biology) predicted that recoding was possible. The "code" metaphor was passive. If the "code" ontology doesn't generate unique predictions that the "chemistry" ontology cannot, the deflationist wins on grounds of parsimony (Occam's Razor).

  ### Summary

  The debate remains unresolved because it is a **boundary dispute between disciplines**, not a scientific puzzle waiting for data.

  *   **Code-Biology** is trying to secure a philosophical foundation for biology that makes it distinct from chemistry (protecting the autonomy of the discipline).
  *   **Deflationism** is trying to secure a rigorous physicalist ontology (protecting the unity of science).

  The recoded genomes show that the mapping is **plastic**, but plasticity is a physical property. It does not prove that the mapping is **semantic** in a way that transcends physical description.

  **Your working hypothesis is 80% correct:** The camps are talking past each other. But the remaining 20% is that the deflationists aren't answering a different question; they are denying the validity of the Realist's framework entirely. No amount of synthetic biology will settle this, because you can describe every synthetic biology result perfectly well in the language of binding kinetics without ever invoking the word "information." Until a "code-based" prediction outperforms a "chemistry-based" prediction, the deflationists will hold the line.
