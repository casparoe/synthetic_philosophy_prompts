answer: |-
  This is an excellent puzzle. You have identified a genuine tension in how Michael Smith's "moral fetishism" argument is often applied, and indeed, in how we understand the relationship between moral worth, motivation, and rationality.

  Your worry is this: If Smith says the virtuous agent (Nora) is superior because she is moved directly by right-making features rather than the abstract concept of "rightness," then what prevents her from collapsing into a mere mechanism—someone reliably moved by morally irrelevant features (uniforms, moods) that just happen to correlate with right action? If articulation isn't required, where is the *reason* in "acting for a reason"?

  There is a principled answer available within Smith's framework (and Reasons Internalism more broadly), but it requires refining your reading of Nora's cognitive state. The distinction between Nora and the "Uniform-Mover" does not lie in their ability to articulate a theory, but in their **counterfactual sensitivity** and the **rational connection** between their beliefs and motivations.

  Here is how to resolve the stuck point.

  ### 1. Refining Smith's Claim: *De Re* vs. *De Dicto*
  Smith's argument in *The Moral Problem* is not that the virtuous agent lacks a desire to do the right thing. Rather, he argues that the virtuous agent's desire to do the right thing is **derivative**.

  *   **Dan (The Fetishist):** Desires to do the right thing *de dicto* (under the description "the right thing"). His motivation stops at the concept. He helps the humiliated person *because* it is right, not necessarily because he cares about the humiliation itself.
  *   **Nora (The Virtuous Agent):** Desires to do the right thing *de re*. She desires the things that are actually right (e.g., the cessation of humiliation).

  However, Smith does not claim that Nora is a mindless conduit. For Smith, a moral agent is defined by the **rational coherence** between their normative beliefs and their motivations. If Nora is truly acting for the *right reason*, her motivation must be sensitive to her beliefs about those features.

  ### 2. The Distinction: Nora vs. The Uniform-Mover
  You ask what separates Nora from an agent moved by a uniform or a good mood. On the surface, both are "reliably moved by features without articulating a theory."

  The principled distinction lies in **Counterfactual Sensitivity**.

  *   **The Uniform-Mover:** If you asked them, "Would you still help if the person weren't wearing a uniform?" they might say, "I don't know, I just react to uniforms." Their motivation is causally linked to a feature (the uniform) that has no *normative* weight. If their belief about uniforms changed (e.g., they learned this uniform belongs to a villain), their motivation might not track the moral reality. They are not responsive to the feature *as a reason*.
  *   **Nora:** Even if Nora cannot articulate a moral theory, she treats the features (humiliation, promise-breaking) as **normatively significant**. If you asked Nora, "Would you still intervene if this wasn't humiliation, but playful acting?" she would say, "No, of course not."

  Nora's motivation is modulated by her understanding of the situation. She is moved by the humiliation *under the aspect of its badness*, even if she lacks the vocabulary to explain *why* it is bad. The Uniform-Mover is moved by the uniform *under the aspect of its visual presence*.

  For Smith, acting for a reason requires that the motivation would change if the agent's belief about the reason changed. Nora passes this test; the Uniform-Mover does not.

  ### 3. Articulation vs. Recognition
  Your reading suggests that "Nora's inability to identify or articulate her reasons is beside the point." This is the spot where the interpretation needs nuance.

  Smith (following a Kantian/Internalist line) would argue that moral worth *does* require acting for reasons, and reasons imply a capacity for reflection. However, **articulation is not the same as recognition.**

  *   **Articulation:** Being able to construct a syllogism or cite a moral theory (Dan's strength).
  *   **Recognition:** Being able to acknowledge that a feature counts in favor of an action.

  Nora lacks articulation, but she possesses recognition. She sees the humiliation *as* a reason to act. The Uniform-Mover sees the uniform *as* a trigger, not a reason.

  If Nora were truly unable to recognize the features as reasons—if she were literally incapable of understanding that the humiliation is *why* she is acting—then Smith would agree with you: she would not have moral worth. She would be a "saintly automaton." But the case description says she is "moved by features of her situations." In philosophical parlance, this usually implies she takes those features to be significant.

  ### 4. Is Moral Worth Still About Reasons?
  You ask: *"Does the case show that moral worth was never a matter of acting for reasons at all?"*

  The answer is **no**. The case actually reinforces that moral worth is about reasons, provided we understand "reasons" correctly.

  *   **Dan's Problem:** He has the right *theory* of reasons, but the wrong *psychology* of reasons. He treats "Rightness" as the reason, rather than the features that constitute rightness.
  *   **Nora's Success:** She has the right *psychology* of reasons (she is moved by the actual features), and presumably the right *belief* (she takes these features to matter), even if she lacks the *theory*.
  *   **The Uniform-Mover's Failure:** They lack the *reason* entirely. They have a cause, not a reason.

  The "Fetishism" argument is designed to show that moral worth requires the motivation to track the **truth-makers** of moral judgments, not just the judgments themselves.

  ### 5. The Resolution
  To unstick your case, you need to attribute one specific capacity to Nora that the Uniform-Mover lacks: **The capacity to revise her motivation in light of normative correction.**

  If a philosopher told Nora, "Actually, that wasn't humiliation, it was a cultural greeting," Nora would cease her intervention. If a philosopher told the Uniform-Mover, "Actually, helping people in uniforms is morally neutral," the Uniform-Mover might still help, because they aren't tracking the morality; they are tracking the cloth.

  Therefore, the principled answer within Smith's argument is:
  **Moral worth consists in being motivated by right-making features *in virtue of* taking them to be right-making features.**

  Nora takes them to be such (she is sensitive to their normative status). The Uniform-Mover does not (they are sensitive only to their physical status). Dan takes the *concept* to be the feature.

  Nora is the exemplar not because she is unreflective, but because her reflection is embedded in her perception of the situation rather than abstracted into a theory. She acts for the right reason because her desire is for the *object* of morality (human welfare, justice), not the *label* of morality. The Uniform-Mover acts for neither.

  ### Summary
  You don't need to abandon the idea that moral worth is about acting for reasons. You only need to distinguish between:
  1.  **Causal Triggers** (Uniforms, Moods)
  2.  **Normative Reasons** (Humiliation, Promise-Breaking)

  Nora is responsive to (2). The Uniform-Mover is responsive to (1). Dan is responsive to the *concept* of (2). Smith argues (2) is the only proper source of moral worth. Nora's inability to theorize is irrelevant, but her inability to distinguish (2) from (1) would be fatal. Assuming she can make that distinction (even non-verbally), she retains her moral worth.
