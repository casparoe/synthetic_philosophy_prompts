      5.  Revisit Dan (he's not totally wrong, just incomplete).
      6.  Conclude on Moral Worth (it remains a matter of reasons, but reasons understood as sensitivity to features).

  8.  *(Self-Correction on Smith's specific text)*: Smith argues that the virtuous person *does* desire to do the right thing, but this desire manifests as desires for the right-making features. So Dan isn't wrong to desire rightness, but he fails if that desire *doesn't* translate into caring about the features for their own sake. Nora is better, but only if her reaction is grounded in a belief that these features *are* right-making, not just a brute causal impulse. I need to make sure I don't attribute a view to Smith that he doesn't hold (e.g., that articulation is irrelevant). Smith cares about *rational coherence*.

