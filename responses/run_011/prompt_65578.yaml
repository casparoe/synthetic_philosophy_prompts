  I back the **Ex Ante Authorization Principle**, which secures your verdicts on self-binding and transparency but forces you to reconcile the inconsistent treatment of social norms in tax (5) versus voting (11)—you will likely have to concede that either both are permissible or both are problematic.

  **The Principle: Ex Ante Authorization**
  A behavioural intervention is permissible if and only if it satisfies three clauses:
  1.  **Source Integrity (Friction):** Artificial exit costs (sludge) are permissible only if self-imposed (Ulysses contracts); external agents must maintain low-friction opt-outs.
  2.  **Procedural Transparency (Mechanism):** Interventions relying on subconscious biases require disclosure *before* the subject enters the choice context; continuous salience is not required, but the *opportunity* to know must exist.
  3.  **Domain Appropriateness (Pressure):** Social normative pressure is permissible for legal compliance but impermissible for discretionary political participation.

  **Reasoning and Case Application**
  This principle resolves your core tensions by shifting the moral weight from *outcome* (did the nudge work?) to *process* (how was the agency relationship structured?).

  *   **8 vs 9 (Source Integrity):** Your intuition here is robust. In Case 8, you are both the principal and the agent; the high exit cost is an exercise of autonomy (self-binding). In Case 9, the gym imposes friction to exploit your inertia. Clause 1 captures this: self-imposed sludge is agency; other-imposed sludge is coercion.
  *   **1, 2, 3, 4, 10 (Low Friction Defaults):** These all pass Clause 1 because the exit cost is low (or systemic defaults are democratically authorized under Clause 2). Case 10 is "probably fine" because regulatory defaults function as democratic pre-authorization, assuming the regulator is accountable.
  *   **6 vs 7 (Procedural Transparency):** This is the crux of your list. The principle settles this firmly: **7 is Fine, 6 is Not Fine.** The moral work is done at the point of *exposure to the framework*, not the point of *decision*. In Case 7, you were treated as an end—you were told the mechanism and allowed to accept the risk of being influenced. The fact that you forgot is a human limitation, not a moral violation. In Case 6, the mechanism was hidden, treating you as a means to an end (saving money) without your consent to the method. Transparency respects your status as an agent even if it doesn't stop the bias.
  *   **5 vs 11 (Domain Appropriateness):** This is where the principle strains. Clause 3 distinguishes tax (legal obligation) from voting (discretionary civic act). The state enforcing compliance (tax) via norms is administratively efficient; the state influencing participation (voting) via norms risks coercing the voluntariness essential to political expression.

  **New Test Cases**
  To stress-test this principle, consider these three scenarios:
  1.  **Hidden Speed Cameras:** The government places speed cameras in unmarked locations to reduce accidents (saving lives) but issues fines.
      *   *Ruling:* **Not Fine.** Fails Clause 2. While the goal is safety, the mechanism relies on surprise rather than ex ante authorization to drive safely. Drivers cannot authorize the trap beforehand.
  2.  **Streaming Service "Are You Still Watching?":** A prompt appears after 4 hours of viewing, requiring a click to continue.
      *   *Ruling:* **Fine.** Passes Clause 1 (low friction exit) and Clause 2 (transparent mechanism of the service). It aids self-regulation without trapping the user.
  3.  **School Letters for Vaccination:** A letter sent to parents stating "90% of children in this school are vaccinated" to encourage uptake.
      *   *Ruling:* **Fine.** Passes Clause 3. Unlike voting, vaccination in a school context is often treated as a public health compliance issue (closer to tax) rather than discretionary political participation, and the social norm supports herd immunity.

  **The Cost: Which Verdict to Give Up**
  You must reconsider **Case 5 (Tax Letter)** or **Case 11 (Voting Card)**.
  Under a strict reading of autonomy, social pressure operates identically in both cases: it leverages shame/conformity to influence behaviour. If you hold firm that Case 11 is "Not Fine" because political choices must be free from psychological pressure, consistency demands you call Case 5 "Dodgy" as well. Tax compliance is enforced by law; the letter is an extra-legal psychological push. If you accept the push for tax, you undermine the objection to voting. I recommend you soften on **Case 5**: admit that while the tax letter is efficient, it is morally "dodgy" for the same reason as the voting card—it substitutes social pressure for reasoned compliance. Keeping 5 as "Fine" while 11 is "Not Fine" relies on a fragile distinction between legal and civic duties that behavioural psychology ignores.
