prompt: |-
  ok so this is kind of a long one but I'm applying for a summer research program (6 weeks, you get a mentor and a laptop and you present at the end) and the application wants a ~2 page proposal for an independent project. My topic is whether reinforcement learning agents can suffer, and specifically whether the reward signal is anything like pleasure or pain for them.

  here's the half formed idea I want turned into an actual proposal. Everyone in this debate seems to be arguing about whether the reward signal feels like anything, and I think that route is stuck, because nobody is settling the consciousness question in six weeks or maybe ever. So my angle is to just not ask that. Instead: look at what an agent does to control its own internal states, and at how it reacts to reward it expected and didnt get. Two behaviors I keep coming back to:

  (1) information avoidance. If an agent can choose between an option that tells it how its doing and an option that doesn't, both with the same expected reward, and it picks the uninformative one, that looks structurally like an animal avoiding a cue it finds aversive. Its hiding from bad news.

  (2) the disappointment thing. I've read that animals who reliably expect a treat and then don't get it often end up worse off than ones who never expected it. In an RL agent, an expected reward that doesn't arrive is just a negative prediction error, which is supposed to be pure information. So the question is whether that state is ever bad *for* the agent in more than an instrumental way, like whether the agent will pay to avoid entering it, or whether being in it degrades things beyond what the numbers predict.

  So the project would be: design a test battery for negative valence in RL agents that doesn't assume anything about consciousness, and then actually run those tests on small toy agents (gridworlds, bandits, whatever a beginner can do) to see whether the tests even discriminate. Like, do they come apart from the trivial thing, which is just 'does this agent's value function contain negative numbers'.

  That last part is what I'm most worried about and I want the proposal to face it head on instead of hiding it: in RL literally everything is downstream of the value function, so maybe any behavioral test is automatically satisfied by construction and therefore tells you nothing at all. That would be the project failing, and I want the proposal to say clearly what that failure looks like and how I'd know I've hit it.

  Write the proposal with: the research question stated precisely enough that it has a determinate answer; why the positions people actually hold (reward is valence, reward is only an indicator pointing at stuff that matters, machines can't have valence at all because of what they're built from, and the 'we can't know so be cautious anyway' view) all leave my question open rather than settling it; the method week by week for the six weeks, marking which parts are philosophy and which parts are me actually running code; why this method rather than the obvious alternatives, which I guess are just arguing with the consciousness literature, or asking the agent to report on its own states; what a result would look like, since I think the best outcome isn't 'agents suffer' or 'they don't' but a test that either works or provably can't work; an honest scope section on what a high schooler with one laptop and a mentor who does ML but not philosophy can realistically finish, and what I should cut first if it's too much; and a couple of lines on why a program should pick this over a more tractable-sounding project.

  no citations needed, I'll add those myself later if I get in. Just don't make it sound like it was written by someone who already has a PhD, the reviewers will know.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Goal:** Write a ~2 page research proposal for a 6-week summer research program (high school/undergrad level).
      *   **Topic:** Can RL agents suffer? Specifically, is the reward signal like pleasure/pain?
      *   **Core Idea:** Avoid the hard consciousness question. Instead, look for behavioral markers of negative valence (suffering) without assuming phenomenology.
      *   **Key Behaviors:** (1) Information avoidance (hiding from bad news), (2) Disappointment costs (expected reward failure degrades performance more than prediction error suggests).
      *   **Critical Constraint:** Address the "triviality objection" head-on (i.e., if everything is downstream of the value function, are these tests just tautologies?). Define what failure looks like.
      *   **Required Sections:** Precise research question, literature gap (why existing views don't settle this), 6-week method (philosophy vs. code), justification of method, expected results (test validity vs. binary answer), scope/feasibility (high schooler + 1 laptop + ML mentor), and significance.
      *   **Tone:** Ambitious but realistic, not overly academic/PhD-sounding, clear and direct.

  2.  **Deconstruct the Research Question:**
      *   *Bad:* "Do RL agents feel pain?" (Too metaphysical, unsolvable in 6 weeks).
      *   *Good:* "Do RL agents exhibit behavioral markers of negative valence that cannot be reduced to simple optimization of the value function?"
      *   *Refinement:* "Can we construct a behavioral test battery for negative valence in RL agents that distinguishes between instrumental avoidance (avoiding low reward) and non-instrumental avoidance (avoiding the *state* of prediction error itself), and does such a test yield positive results in standard architectures?"

  3.  **Address the Literature Gap:**
      *   Need to mention the competing views without getting bogged down.
      *   View 1: Reward = Valence (Hedonism).
      *   View 2: Reward = Indicator (Informational).
      *   View 3: Substrate Chauvinism (Machines can't feel).
      *   View 4: Precautionary Principle (Act as if they do).
      *   *The Gap:* All these argue about *internal experience*. My project argues about *functional structure*. If an agent acts *as if* it suffers (paying costs to avoid specific internal states), does the functionalist definition of suffering apply, regardless of the "lights being on"?

  4.  **Develop the Methodology (6 Weeks):**
      *   *Week 1:* Lit review & conceptual framing (Philosophy). Define "behavioral markers."
      *   *Week 2:* Environment design (Code). Gridworlds/Bandits where info avoidance is possible.
      *   *Week 3:* Implementing Test 1 (Information Avoidance). (Code).
      *   *Week 4:* Implementing Test 2 (Disappointment/Degradation). (Code).
      *   *Week 5:* Analysis & The "Triviality Check". (Code/Philosophy). Does the value function explain it all?
      *   *Week 6:* Write-up & Presentation Prep.

  5.  **Address the "Triviality Objection" (The Core Worry):**
      *   This needs to be a central feature. If the agent avoids a state, is it because the state is "painful" or just because the state has low V(s)?
      *   *Solution:* Design scenarios where avoiding the *signal* of low reward costs actual reward. If the agent pays a premium to remain ignorant, that's the marker.
      *   *Failure Condition:* If the agent's behavior is perfectly predicted by $V(s)$ alone, the test fails to distinguish "suffering" from "optimization." This is a valid negative result.

  6.  **Scope & Feasibility:**
      *   High schooler + 1 laptop. No massive training runs.
      *   Use tabular Q-learning or simple Policy Gradients. No Transformers/LLMs.
      *   Mentor is ML, not Philosophy. Need to keep the philosophy self-contained.
      *   *Cut list:* Complex environments, deep RL, trying to solve consciousness.

  7.  **Significance:**
      *   Why pick this? It bridges AI safety and ethics. It provides a concrete metric for "welfare" in AI without needing a theory of mind. It's high risk/high reward but methodologically sound even if negative.

  8.  **Drafting - Section by Section (incorporating tone checks):**
      *   *Title:* Needs to be catchy but accurate. "Functional Valence in RL."
      *   *Intro:* Hook the reader. The debate is stuck on consciousness. Let's look at behavior.
