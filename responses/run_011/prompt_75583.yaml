      *   *Check:* Did I include the specific behaviors (info avoidance, disappointment)? Yes.
      *   *Check:* Is the timeline realistic? 6 weeks is short. Keep the environments very simple (Bandits/Gridworld).

  10. **Final Polish:** Check page length (approx. 2 pages single spaced is usually ~1000-1200 words). Ensure formatting is clean. (Proceed to generate output).

  *(Self-Correction Note on "Triviality"):* I need to make sure I explain *why* avoiding the signal is different from avoiding the reward. If I avoid a light that tells me I lost money, and avoiding the light costs me money, that's irrational *unless* the light itself is aversive. That's the key.

  *(Self-Correction on Scope):* Emphasize that I will use existing libraries (Gymnasium, Stable Baselines3 if needed, but probably tabular for transparency) to save time.

