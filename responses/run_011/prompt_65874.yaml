      *   *The Holism:* You can't separate meaning (what words mean) from belief (what they think is true) just by looking at one sentence. If they say "Gavagai" when a rabbit runs by, do they mean "Rabbit" or "Undetached rabbit part" or "Rabbit-ing"? It depends on whether they *believe* a rabbit is there.
      *   *Principle of Charity:* You must assume the speaker is mostly rational and mostly correct about the world to bootstrap interpretation. You maximize agreement.
      *   *Indeterminacy:* There isn't one unique correct translation manual. Multiple manuals can fit all possible behavioral evidence.
      *   *Rejection of Empiricism:* You can't learn meaning word-by-word from sensory stimuli alone (Quine's point, which Davidson adopts but modifies).

  3.  **Drafting Task 1: The ML Translation:**
