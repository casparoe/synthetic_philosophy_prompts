          *   It's not just minimizing loss on *prediction*; it's minimizing loss on *agreement*. Maximize $P(\text{Model believes } S \approx \text{Speaker believes } S)$.
      *   *Rejection of Word-by-Word:*
          *   In ML: You can't train token embeddings independently of context (contextual embeddings vs. static). But deeper: You can't learn semantics purely from supervised fine-tuning on stimulus-response pairs without a world model.

