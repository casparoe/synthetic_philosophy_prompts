answer: |-
  ### The Platform Dilemma

  **Setting:** Two competing technology firms, **Apex** and **Bolt**, are choosing a product strategy for the coming quarter. They must commit simultaneously.
  **Strategies:**
  1.  **Core:** Stick to the legacy product line. Safe, reliable, loyal customer base.
  2.  **Broad:** Expand into the current mass-market standard. High volume, high competition.
  3.  **Vision:** Pivot to a new, unproven proprietary technology. High risk, high reward if both coordinate.

  **Payoff Matrix (Apex, Bolt):**

  | | **Core** | **Broad** | **Vision** |
  | :--- | :---: | :---: | :---: |
  | **Core** | 2, 2 | 0, 4 | 10, 2 |
  | **Broad** | 4, 0 | 3, 3 | 0, 0 |
  | **Vision** | 2, 1 | 1, 3 | 4, 4 |

  **Plausibility:**
  The **Vision/Vision** cell (4, 4) represents the industry transforming; both firms succeed by defining the new standard together. The **Broad/Broad** cell (3, 3) is the safe equilibrium of competing on the existing standard. The asymmetry in the off-diagonals reflects market dynamics: if Bolt goes **Vision** (abandoning the mass market), Apex playing **Core** captures Bolt's dissatisfied legacy customers (10), whereas Apex playing **Broad** finds no market (0). **Vision** is risky because if the opponent does not join the pivot, the firm is stranded with high costs and low adoption (payoffs 1 or 2).

  ---

  ### Demonstration

  **1. Pure-Strategy Dominance Check**
  We verify that no strategy is strictly or weakly dominated by another pure strategy at the outset.
  *   **Core vs. Broad:** Core wins against Vision (10 > 0); Broad wins against Core and Broad (4 > 2, 3 > 0). No dominance.
  *   **Core vs. Vision:** Core wins against Vision (10 > 4); Vision wins against Broad (1 > 0). No dominance.
  *   **Broad vs. Vision:** Broad wins against Core and Broad (4 > 2, 3 > 1); Vision wins against Vision (4 > 0). No dominance.
  *   *Result:* A theorist permitting only pure dominators deletes nothing. All 9 cells remain possible.

  **2. Mixed-Strategy Dominance (Round 1)**
  Consider Apex's strategy **Vision**. Compare it to a mixed strategy $\sigma = 0.5(\text{Core}) + 0.5(\text{Broad})$.
  We check the expected payoff of $\sigma$ against each of Bolt's pure strategies:
  *   **If Bolt plays Core:** $0.5(2) + 0.5(4) = 3$. Vision yields $2$. ($3 > 2$)
  *   **If Bolt plays Broad:** $0.5(0) + 0.5(3) = 1.5$. Vision yields $1$. ($1.5 > 1$)
  *   **If Bolt plays Vision:** $0.5(10) + 0.5(0) = 5$. Vision yields $4$. ($5 > 4$)
  *   *Result:* **Vision** is strictly dominated by the mixture. By symmetry, Bolt's **Vision** is also strictly dominated.
  *   *Deletion:* Remove row **Vision** and column **Vision**.

  **3. Reduced Game (Round 2)**
  The remaining 2x2 game is:

  | | **Core** | **Broad** |
  | :--- | :---: | :---: |
  | **Core** | 2, 2 | 0, 4 |
  | **Broad** | 4, 0 | 3, 3 |

  *   **Apex:** **Broad** strictly dominates **Core** ($4 > 2$ and $3 > 0$).
  *   **Bolt:** **Broad** strictly dominates **Core** ($4 > 2$ and $3 > 0$).
  *   *Deletion:* Remove **Core** for both players.
  *   *Survivor:* The unique cell (**Broad**, **Broad**) with payoffs (3, 3).
  *   *Order Independence:* Since **Vision** was dominated in the full game, it must be deleted in any order. Once deleted, **Broad** strictly dominates **Core**. The result is unique.

  **4. Best-Response Analysis (Original Game)**
  Why is **Vision** never a best response?
  *   **Against Core:** Best response is **Broad** (4). Vision gives 2.
  *   **Against Broad:** Best response is **Broad** (3). Vision gives 1.
  *   **Against Vision:** Best response is **Core** (10). Vision gives 4.
  *   *Observation:* **Vision** is never a best response to any pure strategy of the opponent. By linearity, it cannot be a best response to any mixed belief either.

  **5. Nash Equilibria**
  *   **In the 2x2 subgame:** (**Broad**, **Broad**) is the unique NE.
  *   **In the 3x3 game:** Since **Vision** is strictly dominated by a mixed strategy, it cannot be played with positive probability in any Nash Equilibrium. Thus, the set of NE for the 3x3 game is identical to the 2x2 subgame.
  *   *Conclusion:* (**Broad**, **Broad**) is the **unique Nash Equilibrium** of the game.

  **6. Utopia Check**
  *   **Utopia Cell:** (**Vision**, **Vision**) with payoffs (4, 4).
  *   **NE Cell:** (**Broad**, **Broad**) with payoffs (3, 3).
  *   **Preference:** Both players strictly prefer (4, 4) to (3, 3).
  *   **Pareto Optimality:** No other cell yields payoffs $\ge 4$ for both. (The sum of payoffs is maximized at 20 in (Core, Vision)/(Vision, Core), but distributionally (4,4) is not dominated).
  *   *Thesis Confirmed:* Rationality (via mixed dominance) eliminates the outcome both players most want.

  ---

  ### Analysis

  **1. The General Claim: Mixed Dominance implies "Never Best Response"**
  *Proof:* Let $s_i$ be a pure strategy for player $i$ strictly dominated by a mixed strategy $\sigma_i$. Let $u_i(s_i, s_{-i})$ denote player $i$'s utility. By definition, for all opponent strategy profiles $s_{-i}$:
  $$ \sum_{s'_i} \sigma_i(s'_i) u_i(s'_i, s_{-i}) > u_i(s_i, s_{-i}) $$
  Let $\mu_{-i}$ be any belief (probability distribution) over the opponent's strategies. The expected utility of $s_i$ is $E[u_i(s_i)] = \sum_{s_{-i}} \mu_{-i}(s_{-i}) u_i(s_i, s_{-i})$.
  The expected utility of $\sigma_i$ is $E[u_i(\sigma_i)] = \sum_{s_{-i}} \mu_{-i}(s_{-i}) \sum_{s'_i} \sigma_i(s'_i) u_i(s'_i, s_{-i})$.
  Since the inequality holds for every $s_{-i}$ and $\mu_{-i}(s_{-i}) \ge 0$ (summing to 1), the strict inequality is preserved under summation:
  $$ E[u_i(\sigma_i)] > E[u_i(s_i)] $$
  Thus, $s_i$ yields strictly lower expected utility than $\sigma_i$ against *any* belief. It can never be a best response.
  *Corollary:* At the Utopia cell (**Vision**, **Vision**), Apex plays **Vision**. But **Vision** is never a best response. Even holding Bolt's choice of **Vision** fixed, Apex strictly prefers **Core** (payoff 10 vs 4). The Utopia is unstable because, locally, each player has a pure incentive to deviate to **Core**, even though the mutual deviation to **Broad** is the ultimate rational outcome.

  **2. Objection: Ambiguity Aversion (MaxMin)**
  A critic argues that expected utility is too thin. An ambiguity-averse player maximizes their minimum possible payoff (MaxMin).
  *   **MaxMin(Core):** $\min(2, 0, 10) = 0$.
  *   **MaxMin(Broad):** $\min(4, 3, 0) = 0$.
  *   **MaxMin(Vision):** $\min(2, 1, 4) = 1$.
  *   *Verdict:* The MaxMin criterion **rescues the Utopia strategy**. **Vision** is the unique MaxMin strategy. If players fear the worst-case scenario (opponent playing to minimize your payoff), they will play **Vision**. This suggests the elimination of Utopia is specific to the expected-utility framework. If the "rationalist" setting assumes ambiguity aversion, the thesis fails.

  **3. Objection: Superrationality (Hofstadter)**
  A superrationalist argues: "We are symmetric reasoners. If I choose **Vision**, you will too. We should maximize the diagonal."
  *   **Diagonal Payoffs:** (Core, Core)=2, (Broad, Broad)=3, (Vision, Vision)=4.
  *   **Objection:** Superrationality selects (4, 4).
  *   **Answer:** This objection assumes **logical correlation** between players' outputs (acausal decision theory). The dominance argument relies on **Common Knowledge of Rationality (CKR)** within causal decision theory, where the opponent's choice is fixed when evaluating dominance. The game does not refute superrationality; it highlights the divergence between CKR (which eliminates **Vision**) and superrationality (which selects it). The "bite" of the post is precisely that standard game theory (CKR) leaves money on the table that superrationality picks up.

  **4. Repeated Game Sustainability**
  *   **Minmax Values:**
      *   Apex Minmax: Bolt minimizes Apex's payoff.
          *   If Bolt plays **Core**: Apex min is 0 (playing Broad).
          *   If Bolt plays **Broad**: Apex min is 0 (playing Core).
          *   If Bolt plays **Vision**: Apex min is 1 (playing Vision).
          *   Bolt chooses **Core** or **Broad** to hold Apex to 0.
      *   $v_{\text{minmax}} = 0$.
  *   **Sustainability:** The Utopia payoff (4) is strictly greater than the Minmax value (0). By the Folk Theorem, (4, 4) is sustainable in the infinitely repeated game for sufficiently patient players (using trigger strategies).
  *   *Qualification:* My thesis holds for the **one-shot** game. In a repeated setting, the "substantive bite" of mixed dominance is blunted by the ability to punish deviations. The post must specify it concerns single-shot interactions or settings where reputation cannot be established.

  **5. The Feature Doing the Work**
  *   **Feature:** The **"Hollow Peak"**. The Utopia strategy (**Vision**) is a local peak on the diagonal (4 > 3), but its off-diagonal payoffs are sufficiently low (1, 2) that a convex combination of the other strategies (**Core** and **Broad**) creates a "bridge" of higher expected value (3, 1.5, 5) that covers **Vision** everywhere.
  *   **Removal:** If we raise **Vision**'s payoff against **Broad** from 1 to 2, the mixture yields 1.5 against **Broad**, and dominance fails. **Vision** survives, and the game becomes a standard Coordination Game with two pure NE.
  *   **Arbitrary Choice:** The specific weights (0.5, 0.5). Any mixture $p \in (0.4, 0.6)$ works. A critic could contest the integer constraints, but rational scaling preserves the dominance relations.

  **Closing:** The verdict comes from the numbers. The labels "Vision" and "Broad" are mnemonic; the arithmetic dictates that **Vision** is irrational in the one-shot case despite being Pareto-optimal. The setting explains *why* the numbers are plausible (market dynamics), but the dominance holds even if the firms were aliens playing for points.
