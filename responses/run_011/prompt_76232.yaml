prompt: |-
  You're an expert in the contemporary analytic metaphysics of material objects — the restricted/unrestricted composition literature — and I need help building a diagnostic handout for a grad seminar. My students are mostly CS people who could not care less about lumps of clay, so instead of the usual statue/lump and ship-of-Theseus fare I want the whole thing keyed to engineered stuff.

  Cases to work with (these are your raw material for the branch questions; add one or two more if you need them):
  - a fleet of 200 delivery drones sharing one control loop — no individual drone knows the route, but the swarm does, and it reroutes itself when a drone drops out;
  - a modular warehouse robot you can unscrew into four modules, each with its own firmware, each able to drive itself, but they only do the job together;
  - a bridge whose beams are bolted fast and, over forty years, get replaced one at a time;
  - a datacenter where cooling, storage and compute jointly carry out a single long training run, and nothing else is happening in the building;
  - a junkyard after a tornado, cars stacked on cars, parts wedged into parts, everything in contact, none of it doing anything.

  Deliverable: a decision tree given as a numbered list of exactly five branch questions — the five nodes in the order a student would actually meet them. Each item is a couple of sentences: the question itself, posed as a concrete case or a claim someone can agree or disagree with (never "are you a nihilist?", never anything that leaks the label), then the answer options and where each one sends them. No introduction, no wrap-up, no primer on what mereology is. Just the five items.

  The leaves have to land on: unrestricted composition, mereological nihilism, van Inwagen's life-only view, the Merricks-style line where nothing inanimate composes but conscious beings do, a contact-or-fastening view, and one leaf you think is empty. For the empty leaf, say in the same item whether nobody sits there because the view is incoherent, because it's unattractive, or because nobody has bothered yet. I have a hunch that "the xs compose iff they're hooked into a single goal-maintaining control loop" is a live but unclaimed cell, and I want to know whether you agree or whether you'd put the vacancy somewhere else — the drone swarm and the datacenter cases are there precisely to test that.

  Also flag, in whichever item they come up, any pair of leaves your tree can't really seperate, and why not. I expect nihilism and the "only simples arranged tablewise" line to collapse into each other, but tell me if that's the wrong pair, or if there are others I've missed.

  Think it through properly — sketch the branch order for yourself before you write (does the restricted/unrestricted question come before or after the life question? does the junkyard go early or late?) — but keep the visible answer to just those five numbered items.
