answer: |-
  ### Correspondences

  | Speech Act Concept | Systems Equivalent | Strain Rating |
  | :--- | :--- | :--- |
  | Illocutionary Force | Message Type / Verb (e.g., `PROMISE`, `REQUEST`) | Low |
  | Propositional Content | Payload / Body (JSON, Protobuf) | Low |
  | Preparatory Conditions | Preconditions / Authorization Checks | Medium |
  | Sincerity Condition | Internal State / Intent (Unobservable) | High |
  | Essential Condition | Protocol Contract / Schema Validation | Low |
  | Illocutionary Effect | State Transition / Commit Log | Medium |
  | Perlocutionary Effect | Downstream Side Effects / Triggers | High |
  | Direction of Fit (Word-to-World) | Assertion / Query / Verification | Medium |
  | Direction of Fit (World-to-Word) | Command / Write / Actuation | Medium |
  | Uptake | ACK / Handshake Confirmation | High |

  ### Strained translations

  The biggest strain is treating social reality as database state. In Searle's view, a promise creates an obligation that exists independently of the record; in your system, if the log is deleted, the obligation vanishes. You are modeling *tracking*, not *normativity*. Similarly, sincerity conditions map poorly to cryptographic signatures. A signature proves origin, not intent. Your system validates syntax and authorization, but Austin's felicity conditions require shared social context (e.g., only a judge can sentence). Your policy checks mimic this, but they lack the communal recognition that makes the act valid. Finally, perlocution (effects like persuading or frightening) is non-deterministic side-effect logging, but in speech act theory, these are distinct from the act itself. Your system collapses illocution (the act) and perlocution (the consequence) into "request processed + triggers fired," losing the distinction between what was *done* and what *happened*. Direction of fit becomes query versus command, but this ignores assertions that change reality by describing it (e.g., "You are fired"). Your framework assumes state changes only via explicit writers, missing how descriptions can constitute facts. You assume the world is a database that updates on commit. Speech act theory assumes the world is a social fabric that updates on recognition. When you write `OBLIGATION_CREATED`, you assume the debt exists because the row exists. Searle argues the row exists because the debt exists. This inversion is critical.

  ### Residue

  1.  **Uptake:** Austin argues a promise misfires if the hearer doesn't recognize it as such. Your ACK signals packet receipt, not semantic acceptance. If an agent receives a `PROMISE` but treats it as noise, your system logs success while the act fails. This is a defect in your vocabulary. You conflate transmission with communication. To fix it, you'd need a handshake where the receiver explicitly validates the illocutionary force, not just the schema. However, requiring explicit uptake for every act creates latency. The theory is right that understanding matters; your protocol is right that efficiency matters. The gap is that your system cannot detect ignorance, only rejection. You assume admissibility implies uptake, which is false in social contexts. The theory identifies a social dependency your network stack ignores. It is a defect in your vocabulary because it assumes isolation; agents are not islands.

  2.  **Insincerity:** A liar promises without intent. Your system records a valid commit either way. Calling this "writing garbage" misses the point; the data structure is valid, the agent's internal state is misaligned. This is a defect in your vocabulary, which lacks a model for internal intent versus external declaration. Speech act theory separates validity (was the promise made?) from honesty (will they keep it?). Your system collapses these into "valid/invalid." You can log violations later, but you cannot model the lie at the moment of utterance. For automation, this might be fine; for social simulation, it's fatal. The theory captures a normative distinction your binary state machine erases. You can track breaches, but you cannot track deceit. This is a defect in your vocabulary because it treats agents as functions, not actors with internal states hidden from the wire.

  3.  **Indirect Acts:** "Can you pass the salt?" is a query type executing a request function. Your protocols demand explicit types to route messages correctly. This is a limitation of your protocols, not a defect in the theory. Protocols require explicitness to automate; humans use indirectness to preserve face or allow deniability. Theory explains how humans bridge the gap; your system forbids the gap. If you want natural interaction, you need an inference layer that maps indirect queries to direct requests. If you want robust automation, keep the explicit types. The theory isn't wrong; it's describing a layer of ambiguity your system intentionally strips out. The untranslatable bit is the pragmatic inference engine humans run constantly. Your system offloads this to the user or designer. This is a limitation of protocols, which prioritize determinism over expressiveness. Theory describes the richness you sacrificed for reliability.

  ### Verdict

  You can ship a commitment protocol, but not a promise. You will have the mechanics: state transitions, obligations recorded as debt, and penalties for rollback. What you miss is the normative force—the "ought" that persists even if the system goes down. Your implementation will handle the *tracking* of promises, not the *making* of them. To bridge this, you need external enforcement (legal, social) or a reputation system that penalizes insincerity. Without that, you have distributed transactions, not speech acts. Don't claim you've implemented promising; claim you've implemented enforceable commitments. The theory isn't wrong, but it describes a social layer your stack sits beneath. Your system is a substrate for speech acts, not an instantiation of them. Ship it, but document the gap between obligation and record.
