  | Property | Requirement | Status | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Pareto Efficiency** | If everyone is worse off in Option A than B, A is worse. | **Non-negotiable** | Without this, the theory ceases to be consequentialist about welfare. |
  | **Anonymity** | Identities do not matter; only the distribution of harms. | **Non-negotiable** | Impersonal aggregation cannot privilege specific agents without extra moral premises. |
  | **Completeness** | The rule must always return a verdict (Better, Worse, or Equal). | **Contested** | Often demanded for decisiveness, but vagueness in harms or numbers may legitimately block verdicts. |
  | **Continuity** | Small changes in harm do not abruptly flip the moral verdict. | **Contested** | **The biggest filter.** Demanding this forces small harms to aggregate into large ones. Rejecting it allows lexical thresholds. |
  | **Separability** | Verdicts on sub-groups or time-slices can be summed independently. | **Contested** | Assumes morality is additive. Holists argue context changes the moral weight of a harm. |
  | **Scale Invariance** | Verdicts remain stable if the measurement unit of harm is rescaled. | **Contested** | Assumes harms are cardinally measurable. Rejecting this allows ordinal-only comparisons. |

  ### The Aggregation Operator: Requirements and Tensions

  You are asking for a machine that takes inputs about suffering and outputs a moral ranking. The difficulty is not in building the machine, but in agreeing on the engineering specs. Most debates about aggregation are not about the math; they are about smuggling substantive moral commitments into the definition of the operator itself. The table above separates the structural necessities of consequentialism from the contested preferences that often disguise themselves as logical requirements.

  The non-negotiables are thin. **Pareto Efficiency** and **Anonymity** are the floor. If your operator says a world where everyone is tortured is better than a world where no one is, simply because of who they are, you have left consequentialism behind. If your operator says making everyone slightly worse off is an improvement, it is broken. Everything else is where the camps dig in.

  ### Contested Requirements Disguised as Neutral

  You specifically asked to be aggressive about requirements that settle the debate by fiat. **Separability** and **Scale Invariance** are the primary offenders.

  **Separability** is the assumption that you can calculate the value of an outcome by comparing people pairwise or summing independent events. It assumes the moral weight of a speck in your eye is the same whether you are the only one suffering or one of a billion. This is not a neutral rule; it is a substantive claim that context does not matter. Holistic views argue that a harm's significance depends on the total distribution. Demanding Separability eliminates any view that thinks systemic context changes the moral weight of individual pain.

  **Scale Invariance** assumes that moral value behaves like physical mass: if you change the unit of measurement from "specks" to "micro-specks," the ranking shouldn't change. This presupposes that harms are cardinally measurable quantities. If harms are only ordinally rankable (we know torture is worse than a speck, but not by how much), this requirement crashes. Insisting on it eliminates any theory that treats moral value as qualitative rather than quantitative.

  However, the most aggressive filter is **Continuity**. This is the requirement that there are no "lexical" thresholds—no point where a large harm becomes incomparably worse than any amount of a smaller harm. Proponents frame this as avoiding "arbitrary cutoffs." But there is nothing arbitrary about claiming torture is in a different moral category than a dust speck. Demanding Continuity forces the operator to accept that enough specks *must* eventually outweigh torture. It is not a logical necessity; it is a utilitarian preference wearing a logician's coat.

  ### The Impossibility: Temporal Accumulation vs. Cross-Person Aggregation

  You suspected the interesting stuff lives when we drop the idealizations. Let's drop the assumption that harms are one-off events and look at the temporal case: **One person gets a mild speck every day for fifty years versus one person getting one hour of torture.**

  Most intuitions say the fifty years of specks is worse. This implies small harms *do* aggregate within a single life. Now, consider the constraint of **Continuity** (no arbitrary cutoffs). If fifty years of specks is worse than torture, then forty-nine years and three hundred and sixty-four days must also be worse (removing one day shouldn't flip the verdict). By induction, even one speck must be worse than torture. This is absurd.

  To avoid this, you must introduce a cutoff within the single life (violating Continuity) or deny that the fifty years of specks is worse than the torture (violating intuition).

  Now, bring in the second case: **One person getting fifty years of specks versus a million people each getting one speck once.**
  If you said the single person's fifty years was bad (aggregation works within a life), but the million people's single specks are not bad (aggregation fails across lives), you have created a tension between **Anonymity** and **Separability**.
  *   If time-slices of a person are morally equivalent to distinct people (Separability), then the two cases should yield the same verdict.
  *   If they yield different verdicts, you must claim that personal identity matters (violating the reductionist spirit of Anonymity) or that there is a magical cutoff where harms stop aggregating across persons but start aggregating across time.

  Here is the concrete contradiction using your requested constraints:
  1.  **Option A:** Alice suffers 50 years of daily specks.
  2.  **Option B:** Alice suffers 1 hour of torture.
  3.  **Option C:** Alice suffers 50 years of specks minus one day.

  If you hold that A is worse than B (temporal aggregation holds), and you hold **Continuity** (no arbitrary cutoffs), then C must be worse than B. Repeat this until Alice suffers zero specks. You conclude zero specks is worse than torture.
  To stop this, you must reject **Continuity**. You must say there is a specific number of days where the harm flips from "not worse than torture" to "worse than torture."
  But if you accept that cutoff for Alice, why does it vanish when we distribute those days across a million people? If you say it vanishes, you violate **Separability** (treating time-slices differently than people). If you say it doesn't vanish, you accept the Repugnant Conclusion (million specks > torture).

  You cannot have Temporal Aggregation, Cross-Person Non-Aggregation, and Continuity simultaneously. One must break.

  ### The Single Requirement That Eliminates the Most Candidates

  The single requirement that eliminates the most candidates is **Continuity**.

  If you enforce Continuity, you eliminate all lexical views, all threshold deontologies, and any view that claims some harms are incomparable. You force every moral theory to become a form of utilitarianism where everything is tradeable given enough volume. It is the engine that drives the slide from "specks are trivial" to "specks outweigh torture."

  Dropping Continuity allows for lexical thresholds (torture is never outweighed by specks), but it forces the theory to accept "arbitrary" cutoffs. However, keeping it forces the theory to accept absurd trade-offs. Most formal models assume Continuity because it makes the math work, not because it is morally obvious. It is the silent premise that decides the puzzle before the first calculation is made.

  ### How the Contenders Fare

  **Total Utilitarianism** accepts all the contested requirements. It passes Continuity and Separability easily. It bites the bullet: enough specks do outweigh torture. It survives the list by denying the intuition that torture is lexically worse.

  **Lexical Views** (those who insist there has to be a cutoff) survive by rejecting **Continuity**. They accept that there is a sharp line where specks become torture-level badness, or simply that torture is in a higher category. They fail the "no arbitrary cutoff" test but save the intuition.

  **Prioritarianism** (weighting harms to the worse off) struggles with the vague number case. If we don't know who is worse off or how many there are, the weighting function cannot compute. It often requires **Completeness**, forcing a verdict where information is missing.

  Ultimately, the operator you build depends on which intuition you are willing to sacrifice. If you want to save the intuition that torture is uniquely bad, you must break the math of Continuity. If you want to save the math, you must sacrifice the intuition. There is no neutral ground.
