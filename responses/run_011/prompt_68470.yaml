          3.  Show why "standing" handles the case of the "resident whom nobody would miss" better than "status."
          4.  Confront the internal difficulty: Measurement corrupts reciprocity (performative contradiction). Does the processual view have a reply the status view lacks?
          5.  Do not conclude the scheme is indefensible. Do not trivialize the moral equality objection.
