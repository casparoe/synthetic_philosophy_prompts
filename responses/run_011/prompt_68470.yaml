answer: |-
  The objection that the processual account of personhood undermines moral equality is formidable. It suggests that if personhood is an achievement rather than a given, then those incapable of achievement—infants, the disabled, the isolated—are relegated to a secondary moral caste. The municipal scheme described, which ties material survival to a quantified measure of relational density, appears to be the dystopian realization of this fear. It seems to institutionalize a hierarchy where the well-loved thrive and the lonely starve. However, to reject the scheme as a perversion of the processual view is to misunderstand the metaphysics of *ubuntu* itself. The scheme is not an abuse of Menkiti's achieved personhood; it is its logical institutional shadow. By confronting the scheme directly, rather than retreating into abstract defenses, we can see that the processual account possesses a conceptual resource that the rival "status" account lacks: the ability to treat social isolation not as a protected right, but as a remediable moral injury.

  To claim the scheme is an abuse, a sympathetic philosopher typically makes one of two defensive moves. The first is to argue that the panel's score tracks nothing morally relevant—that relational density is merely sociological data, not a measure of personhood, and thus the policy is just a bad utilitarian calculus carrying no metaphysical commitment. This fails because it surrenders the core tenet of the processual view. For Menkiti, personhood *is* the density of reciprocal obligation. To say the score tracks nothing morally relevant is to say that the weaving of the social web is morally inert, which collapses the processual view into the very individualism it opposes. If "I am because we are," then the measure of the "we" is the measure of the "I." To sever the score from personhood is to admit that the processual account has no purchase on the material world.

  The second defensive move is to insist that the processual view concerns moral status (who counts) rather than distributive shares (who gets what). This distinction is equally untenable within the logic of the scheme. In the achieved account, recognition is constitutive of standing, not merely honorific. If the community's recognition constitutes the person, then the community's material sustenance is the physical manifestation of that recognition. To grant a resident full care hours while declaring they have no relational standing is to create a metaphysical schism: it treats them as a person in terms of rights but a non-person in terms of social reality. The scheme refuses this hypocrisy. It acknowledges that in a communitarian ontology, distribution *is* recognition. To withhold resources is to acknowledge a lack of integration; to provide them is to affirm it. A Menkiti defender might wish to disown the *quantification* of this process, arguing that moral maturity cannot be reduced to a quarterly score. However, she should not. Quantification is simply the bureaucratic ritualization of the qualitative judgment the community already makes implicitly. Every community already decides whose grief matters and whose absence is felt; the scheme merely makes this implicit judgment explicit and accountable. To reject the score is to prefer the tyranny of unspoken exclusion over the rigor of measured inclusion.

  This brings us to the crucial distinction that saves the processual view from the charge of violating moral equality: the difference between personhood as a *status* one holds and personhood as a *standing* one occupies. Status is binary and ontological; it is the Kantian floor below which one cannot fall. It asks, "Are you a member of the moral universe?" Standing is gradated and sociological; it asks, "How heavily do you weigh in the moral universe?" The status view treats personhood like a passport: you have it or you don't, and it guarantees you entry regardless of your connections. The standing view treats personhood like a reputation: it is a function of your active participation in the life of the community. The objection that the processual view licenses hierarchy assumes that hierarchy violates equality. But if personhood is standing, then hierarchy is not a violation of equality; it is a description of reality. Equality in the status view is the equality of atoms—identical, separate, and isolated. Equality in the standing view is the equality of opportunity to weave oneself into the web. The scheme does not deny the isolated resident their humanity (status); it registers their current lack of social weight (standing).

  It is precisely in the case of the resident whom nobody would miss that the standing notion commands a resource the status notion lacks. Consider the isolated individual under the status regime. The municipality grants them equal care hours based on their birthright. The transaction is complete. The community has discharged its duty, and the resident remains alone. The status view renders their isolation invisible, masking social death behind a veil of equal rights. It offers them the dignity of a ghost: formally recognized, materially sustained, but ontologically unseen.

  Under the scheme, the same resident receives a low score and proportionally fewer resources. This appears cruel, but it contains a diagnostic truth the status view suppresses. The low score is a public declaration that the community has failed to incorporate this life. It makes the isolation a matter of public record, not private tragedy. Because the score is processual—capable of rising steeply when a resident takes on dependents or repairs ruptures—it frames the lack of resources not as a punishment for who they *are*, but as a reflection of where they *stand* in the network. It creates a structural imperative for the panel and the community to ask: "How do we raise this score?" The status view says, "You are equal, therefore you are fine." The standing view says, "You are marginalized, therefore we must act." The resource the standing view offers is the visibility of neglect. It forces the community to confront the fact that a person without relations is a person in crisis, not a person in equilibrium. The scheme treats the "nobody would miss" resident not as a rights-bearer to be paid off, but as a potential node to be activated.

  However, this defense must confront the internal difficulty that threatens to break the argument: the problem of measurement. Once relationships are scored and paid out, the measurement alters what it measures. If I visit a neighbor to gain points for my care allowance, is that reciprocity or performance? If the panel rewards grief attendance, does grief become a currency? This is the performative contradiction: the scheme risks corroding the authentic reciprocity it is supposed to register, turning moral obligations into transactional labor.

  Here, the processual view has a reply that the status view lacks, though it is a fragile one. The status view assumes authenticity is pre-existing and must be protected from instrumentation. It views the scoring panel as an intrusion on a private moral sphere. The processual view, however, understands personhood as a *discipline*. In many African traditional contexts, rites of passage are formal, even coercive structures that *produce* the internal state they signify. One does not wait to feel like an adult to undergo the initiation; one undergoes the initiation to become an adult. Similarly, the scheme's scoring can be understood as a civic ritual. The resident may start by visiting a neighbor for the points, but the processual view holds that the action precedes the virtue. By performing the obligations of personhood, one becomes a person. The measurement does not necessarily corrupt the reciprocity; it may scaffold it.

  The status view has no answer to the isolated resident other than cash and silence. It cannot mandate connection without violating liberty. The processual view, through the scheme, admits the risk of instrumentalization but argues that the risk of *exclusion* is worse. If the scoring corrodes reciprocity, it is a corruption of the web. But if the status view ignores the web, it allows the web to rot. The processual defender must admit that the scheme creates a pressure to perform, but she should argue that all social life involves performance. We dress for funerals not just because we are sad, but because we must show we are sad. The scheme makes the performance of care a public duty.

  There is a premise here a defender of Menkiti might want to disown: the idea that material resources should be strictly proportional to relational standing. Menkiti speaks of moral excellence, not welfare allocation. A purist might argue that personhood is a spiritual or moral category, not an economic one. However, she should not disown this premise. In the context of a social-care budget, "care" is the material form of "incorporation." To be incorporated is to be fed, housed, and attended. To separate the moral standing from the material care is to return to the dualism the processual view rejects. If the community is the source of the person, the community's resources are the blood of the person. To distribute them without regard to the relational flow is to treat the body as separate from the lifeblood.

  The moral-equality objection insists that no one should slide down a scale of standing. But the scheme reveals that people *are* already sliding down scales of isolation, neglect, and invisibility. The status view denies the scale exists; the processual view reads the measurement. The scheme is indefensible only if one believes that moral equality requires ignoring the reality of social integration. If moral equality means the equal right to become a person, then the scheme is more egalitarian than the status quo. It admits that the newborn, the recluse, and the ostracized are not yet full persons in the social sense, and it provides a mechanism—the score, the review, the variable support—to track their progress toward that fullness. The hierarchy it licenses is not a hierarchy of worth, but a hierarchy of responsibility. The resident with a high score receives more because they sustain more; the resident with a low score receives less, but is flagged for the work of reintegration.

  Ultimately, the scheme breaks if the panel becomes tyrannical or the scoring purely transactional. But this is a failure of execution, not of metaphysics. The processual account survives because it alone acknowledges that the resident whom nobody would miss is suffering a specific kind of death that a flat cash grant cannot prevent. By tying survival to standing, the scheme forces the community to admit that survival *is* standing. It risks corrupting the reciprocity, yes, but the alternative is to leave the reciprocity to atrophy in the dark. The processual view chooses the risk of performance over the certainty of neglect. In doing so, it defends a moral equality that is not the static equality of atoms, but the dynamic equality of weavers, all entitled to the same loom, even if their tapestries differ in density.
