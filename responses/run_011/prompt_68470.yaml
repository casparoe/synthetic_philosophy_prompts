      *   *The Objection:* If personhood is earned, those who can't earn it are less than persons. This violates modern liberal intuitions of equal worth.
      *   *The Test Bed:* A bureaucratic implementation of Menkiti's idea. It sounds dystopian (scoring human worth for cash), but the prompt asks me to defend it (or at least defend the coherence of the philosophy behind it) against the claim that it violates moral equality *in principle*, while acknowledging the practical risks.

  3.  **Drafting - Section by Section:**

