      *   **Point 1: The Scheme as Natural Expression (Refuting Defensive Moves):**
          *   *Defensive Move A:* "The score tracks nothing morally relevant." *Counter:* In the processual view, relational density *is* the moral reality. To say it's irrelevant is to abandon the metaphysics.
          *   *Defensive Move B:* "Personhood is status, not distributive shares." *Counter:* In *ubuntu*, status *is* constituted by social function and recognition. You can't separate the metaphysical standing from the material support of the community. If the community sustains you, the distribution reflects that sustenance.
          *   *Menkiti Premise to Own:* A Menkiti defender might shy away from the *quantification*. I need to argue that quantification is just the bureaucratic shadow of the qualitative reality Menkiti describes.

      *   **Point 2: Status vs. Standing:**
          *   *Status:* Binary, inherent, static (Kantian rights-bearing). You have it or you don't.
          *   *Standing:* Gradated, dynamic, relational. It's about *weight* in the community, not *existence* in the moral universe.
          *   *Differentiation:* Status asks "Are you one of us?" Standing asks "How deeply are you woven in?" The scheme tracks standing, not status.

      *   **Point 3: The Resident Nobody Would Miss:**
          *   *Status View:* Says they have equal rights/worth. But offers no mechanism to reintegrate them. They are an abstract equal, materially neglected. "You matter" (but no one shows up).
