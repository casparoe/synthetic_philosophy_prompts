      *(Final Polish):* Ensure smooth transitions between the four required points. Make sure the conclusion doesn't just summarize but drives the point home about moral equality.

  7.  **Final Polish:** Check word count and flow. Ensure the distinction between "status" (ontological) and "standing" (sociological/moral weight) is sharp. Ensure the "nobody would miss" argument doesn't sound like victim-blaming but rather community-failure-highlighting. (The scheme highlights the *lack* of relationship, forcing the community to address it, whereas a flat grant hides the isolation).

