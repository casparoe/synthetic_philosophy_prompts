          *   *Reasoning:* Category error. $h^2$ refers to variance in a population, not composition of an individual.

      *   **Move 2 (Nadia):** "...0.72 is a ratio of variances computed within the sample, not a decomposition of any individual's score, and it says nothing whatever about how much of one child's reading level is genetic."
          *   *Analysis:* This is the standard, correct definition of narrow-sense (or broad-sense, depending on twin model) heritability in quantitative genetics. It corrects Elliot's Move 1.
