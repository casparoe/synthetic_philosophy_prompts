      *   **Move 3 (Elliot):** "...if most of the variation in the population tracks genetic variation, then a uniform intervention that lifts every child's score does nothing to close the gap between children and leaves the ranking exactly where it was."
          *   *Analysis:* This is logically sound *within the specific context of high heritability in a static environment*. If $V_E$ is low relative to $V_G$, rank order is largely determined by $G$. A uniform shift (adding constant $c$ to all $P$) changes the mean but not the variance or rank order. However, the inference that literacy programmes *are* uniform interventions is an assumption. But strictly speaking, his logic about high $h^2$ implying stable rank order under uniform environmental shifts is correct.
          *   *Rating:* Partly right (Logically valid inference from the statistic, but assumes interventions are uniform). Let's look closer. He says "practical implication survives untouched". He is arguing that high $h^2$ limits the *equalizing* potential of policy. If $h^2$ is high, $V_E$ is low. If you change $E$ uniformly, variance doesn't change. So gaps remain. This is technically correct regarding *variance*, but implies policy can't change mean levels effectively (which is false, see Move 4). However, his specific claim here is about *closing the gap* (variance/rank).
          *   *Refinement:* Is it "Clearly Right"? High heritability *does* imply that current differences are largely genetic. A uniform environmental change *does* not reduce variance. So the gap remains. His error is conflating "closing the gap" with "improving literacy". He specifically says "leaves the ranking exactly where it was". That is true for a uniform shift.
          *   *Rating:* Clearly right (regarding the statistical implication for rank/variance under uniform shift). *Wait*, is it "Clearly Right"? It relies on the assumption that interventions *must* be uniform to be effective, or that the only goal is closing gaps. But as a statement of what high heritability implies for rank order stability, it's correct. Let's call it "Partly Right" because it ignores the possibility of targeted (non-uniform) interventions which *could* change rank order, and it conflates "gap closing" with "utility of intervention". Actually, looking at the prompt's instruction on "inferences that simply do not follow": The inference that *therefore* literacy programmes are pushing on a small share (from Move 1) was wrong. But Move 3 is a new argument: High $h^2$ $\rightarrow$ Uniform intervention $\rightarrow$ No gap closing. This logic holds. But the *practical implication* that this makes intervention futile is the contentious part. I will rate it **Partly Right** because while the math on rank order is correct, the leap to "practical implication survives" (from Move 1's error) is tainted. Actually, better to be decisive. The statistical claim about rank order is correct. The policy implication is where it wobbles. Let's go with **Partly Right** because it treats the intervention as necessarily uniform.

      *   **Move 4 (Nadia):** Maize thought experiment (Lewontin's example). High $h^2$ within groups, but mean difference between groups is environmental.
          *   *Analysis:* This is the classic Lewontin (1970) argument. It correctly illustrates that high within-group heritability does not preclude large between-group environmental effects. It challenges Elliot's pessimism about environmental interventions changing outcomes (means), even if they don't change rank (variance).
          *   *Rating:* Clearly right.
          *   *Reasoning:* Standard, valid counter-example in quantitative genetics demonstrating the distinction between within-population variance and between-population means.

      *   **Move 5 (Elliot):** "...within-field heritability of 1.0 is precisely the situation in which the environment is irrelevant to differences, so the example shows the statistic behaving exactly as advertised rather than failing."
          *   *Analysis:* Elliot misses the point of Nadia's analogy. Nadia isn't saying the statistic is broken; she's saying the *inference* Elliot draws (that environment doesn't matter for the outcome) is wrong. Elliot concedes the statistic works but denies it supports Nadia's conclusion. He argues that if $h^2=1$, environment is irrelevant to *differences*. This is true by definition. But he ignores the *mean shift* potential. He is defending the statistic, but missing the policy relevance Nadia highlighted (mean shifts vs. variance).
