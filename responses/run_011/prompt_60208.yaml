      *   **Move 1 (Elliot):** "0.72 means genes account for about 72 per cent of any given child's reading ability and the environment for the remaining 28 per cent..."
          *   *Analysis:* This is the classic "individual decomposition" fallacy. Heritability is a population statistic (variance ratio), not an individual proportion. You cannot partition an individual's phenotype into % genetic and % environmental.
