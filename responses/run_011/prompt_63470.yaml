      *   The Conflict: Is it a conflict between constraints on individual letters (c vs o) or between letter constraints and alphabet constraints (uniformity)? It's both. The spirit demands uniformity (close everything), but letterhood demands distinction (keep 'c' open). If spirit wins, 'c' becomes 'o'. If letterhood wins, spirit is broken (not all apertures closed).

