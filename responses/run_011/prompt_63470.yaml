      *   *Spirit:* Determined by *how* roles are filled (e.g., thick lines, rounded corners, closed apertures).
      *   *Orthogonality:* You should be able to vary style without changing letterhood, and vice versa.
      *   *The Toy:* Style = "Close apertures". Letter 'c' relies on an open aperture. Closing it makes it look like 'o'.
      *   *The Tension:* If style dictates closing apertures, and 'c' needs an open aperture, style destroys letterhood. They are not orthogonal; style rewrites letterhood conditions.

