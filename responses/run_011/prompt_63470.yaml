      *   *Flexibility vs. Falsifiability:* The architecture wants search flexibility (violating soft constraints). But if *any* output can be redescribed as a "degenerate filling," the theory is unfalsifiable.
      *   *Principled Difference:* Flexibility is about the *process* (searching space); Falsifiability requires limits on the *interpretation* (what counts as a role). To be falsifiable, there must be a threshold where a role is definitively *not* filled. If degenerate fillers allow infinite stretch, the role hypothesis is empty.
