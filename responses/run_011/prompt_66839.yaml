prompt: |-
  so I've been chewing on Dutch book / coherence arguments on and off for years — read the old LW sequences, Skyrms, the Lewis-style dynamic thing, Christensen's critique, whatever Hájek has written on the topic, Joyce's accuracy-dominance reframing — and I've concluded that "Dutch-bookable" gets used as though it names one property with one kind of force, when I'm pretty sure it's load-bearing in at least four different ways and nobody flags which one they mean. Before I write anything more about it, I want the spec.

  Here's the job the argument has to be good enough *for*, so you can calibrate: I want a coherence argument I could put in front of a smart friend who says "sure, my credences don't sum right on that partition, so what? coherence is aesthetics, and I've never lost money to it." If the argument can't answer him, it's not doing the work I need.

  So: write the desiderata. What does any coherence-style argument for probabilism actually have to deliver to count as adequate — which phenomena it has to explain, which cases it has to get right, which distinctions it's not allowed to collapse, which mathematical facts it has to be consistent with. For each one, the case or consideration behind it, and a label: hard requirement, or a preference of one camp dressed up as a requirement. Things I want explicitly in there, plus whatever I've missed:

  - **simultaneity.** the book needs me to accept the whole package at once. if the bets get offered one at a time and I can walk away after the first, what exactly has been demonstrated? does the spec need to say which betting protocols are in scope, or is "you'd accept them all, given the chance" enough?
  - **stakes.** I think the theorem only bites if I'll take a bet at any stake. if I cap my exposure — say I never risk more than a hundred bucks — can a book still be made against me at all, or does my incoherence just cost me nothing? is "works at stakes you'd actually take" a real desideratum, or does the argument legitimately get to be an idealization?
  - **the bridge.** is the argument about my degrees of belief, or about my betting dispositions? if it needs a premise connecting the two, is that premise argued or just assumed, and does assuming it make the whole thing either circular or idle? I keep feeling like every version has to pay this toll somewhere and none of them say so out loud.
  - **what counts as a loss.** money, utility, expected utility — and expected *by whose lights*? related: a book gets built by a bookie who knows my whole belief set. if the bookie is limited to what I know, or if I've got a compensating false belief that makes the "sure loss" bets locally favorable, is the loss still sure? does the argument need to survive being relativized to a bookie's information, and if so, what's left of it?
  - **unbounded utilities and the infinitary cases.** people claim that once utilities aren't bounded, the equivalence between no-Dutch-book and probabilistic coherence breaks and you can get unavoidable losses. what exactly has to give, and is "your utilities better be bounded" a legitimate *output* of a coherence argument or a smuggled premise? same question for countable additivity: is violating it a defect the argument has to condemn, or is it outside the argument's jurisdiction?
  - **bounded agents.** I can't check coherence across a million propositions and I can't compute the violating package. does the spec need a notion of feasible/bounded coherence that still inherits the argument's force? what happens to the "you'd lose money" story when finding the book is harder than the payoff?
  - **binary vs graded.** does it have to deliver *how bad* a violation is, or is "coherent or not" enough? my friend's credences are off by two percent on one partition; if the framework can't say whether that's worse or better than being off by twenty on another, that feels like a gap.
  - **unbet-on propositions.** half the propositions I have opinions about nobody will ever offer me a bet on, and I have no dispositions about them at all. does the argument need counterfactual betting machinery, and if it does, is that machinery doing real work or is it just a way of restating the probability axioms in gambling cosplay?
  - **diachronics.** whatever gets you conditionalization has to not also license obviously silly policies, has to handle the case where I expect future-me to be offered different bets or to have changed my mind about what I'd accept, and has to handle the fact that I'll *know* I'm about to be offered a book.

  Also: I've been carving this into three notions and I want you to tell me whether the carving is real or confused — Dutch-bookable in principle (there exists a package, for an idealized bookie with full access to my mind, at any stakes), Dutch-bookable in practice (someone in my actual epistemic environment could exploit me for more than transaction costs), and Dutch-bookable relative to a bookie who only sees my behavior on some subset of propositions. Do these come apart in interesting ways, and does an adequate argument have to say which one it's establishing?

  Then the part I most want: **is any subset of these jointly unsatisfiable?** if the honest list can't all be met — if, say, non-circularity plus bite-against-my-friend plus working-at-real-stakes can't coexist — then the list *is* the finding, and I'd rather know that than get a nice scorecard. Tell me which requirements are non-negotiable and which are camp taste (my suspicion: "must establish probabilism in full generality" and "must be non-circular" are both doing a lot of unearned work, but argue with me). And which single desideratum knocks out the largest share of the standard arguments — that's the one I'll build around.

  Short scorecard at the end is fine if you want (de Finetti/Skyrms-style, Lewis's dynamic version, the representation-theorem route, Joyce's accuracy-dominance version, money-pump variants), but keep it to a few lines each; the criteria are the deliverable.

  One thing on epistemics: be explicit about what's settled among people who actually work on this versus what's genuinely contested, and don't dress up a contested position as consensus — I've been burned enough by confidently-stated folklore in this area that I'd rather have the uncertainty visible. And if any of my bullets above is a confused framing rather than a real question, say so bluntly instead of answering it politely.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Highly knowledgeable in formal epistemology/philosophy of probability. Has read the classics (LW sequences, Skyrms, Lewis, Christensen, Hájek, Joyce). Understands the technical landscape (Dutch Book, Accuracy, Representation Theorems).
      *   **Goal:** Wants a "spec" or set of desiderata for a coherence argument for probabilism. Specifically, an argument robust enough to convince a skeptical friend ("coherence is aesthetics, I've never lost money").
      *   **Key Task:** Define what a coherence argument *must* deliver to be adequate. Evaluate the user's proposed distinctions (simultaneity, stakes, bridge, etc.). Determine if any requirements are jointly unsatisfiable. Identify the "killer" desideratum.
      *   **Tone/Style:** Rigorous, precise, non-dogmatic, explicit about consensus vs. contention. No polite hedging on confused framings.
      *   **Specific Constraints:** Address the "three notions" of Dutch-bookability. Provide a short scorecard of existing arguments at the end.

  2.  **Deconstruct the User's Proposed Desiderata:**
      *   *Simultaneity:* Crucial. Synchronic vs. Diachronic matters.
      *   *Stakes:* Linear utility vs. bounded utility. The "money pump" relies on linearity.
      *   *The Bridge:* Credences vs. Betting Dispositions. The "Pragmatic Bridge" is the weak link.
      *   *What counts as loss:* Sure loss vs. Expected loss. Bookie's knowledge vs. Agent's knowledge.
      *   *Unbounded Utilities/Infinitary:* Countable additivity issues. St. Petersburg paradoxes.
      *   *Bounded Agents:* Computational limits. Logical omniscience problem.
      *   *Binary vs. Graded:* Gradability of irrationality.
      *   *Unbet-on Propositions:* Counterfactual dispositions.
      *   *Diachronics:* Conditionalization, reflection, dynamic consistency.
      *   *The Three Notions:* Principle vs. Practice vs. Relative.

  3.  **Evaluate the "Three Notions" Carving:**
      *   *In Principle:* Standard DBA (De Finetti).
      *   *In Practice:* Exploitability in real markets.
      *   *Relative:* Limited bookie knowledge.
      *   *Verdict:* This carving is real and important. Most DBAs prove *In Principle* but claim *In Practice* force. This is a category error.

  4.  **Identify Joint Unsatisfiability (The "Hard Problem"):**
      *   The core tension is between *Normative Force* (why should I care?) and *Descriptive Accuracy* (do I actually bet like this?).
      *   *The Bridge Problem:* If you tie credence *too* tightly to betting dispositions, you make probabilism trivial (definition) or false (people aren't perfect bettors). If you tie it loosely, the DBA loses its bite (why does a betting loss matter for belief?).
      *   *Stakes vs. Boundedness:* If utilities are bounded (realistic), standard DBAs for countable additivity fail. If agents are bounded (realistic), logical omniscience fails.
      *   *The "Friend" Test:* The friend says "I haven't lost money." To answer this, you need *In Practice* exploitability. But *In Practice* exploitability requires transaction costs to be zero and stakes to be linear. Real agents have transaction costs and concave utility.
      *   *Conclusion:* You cannot simultaneously satisfy "Real-world stakes/psychology" and "Strict Probabilism derivation" without smuggling in premises.

  5.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Requirement 1: The Pragmatic Bridge.* Must link credence to action without defining credence *as* betting disposition. (Status: Contested/Hard).
      *   *Requirement 2: Stakes Linearity.* Must hold for non-trivial stakes without assuming unbounded utility. (Status: Hard Requirement for DBA, but false for humans).
      *   *Requirement 3: Synchronic vs. Diachronic.* Must distinguish between being incoherent *now* vs. being exploitable *over time*. (Status: Hard Requirement).
      *   *Requirement 4: Counterfactual Robustness.* Must cover unbet propositions. (Status: Hard Requirement for Probabilism, weak point for DBA).
      *   *Requirement 5: Gradability.* Must explain why small errors are better than big ones. (Status: Preference/Accuracy argument strength).
      *   *Requirement 6: Bounded Rationality.* Must not require logical omniscience. (Status: Hard Requirement for realism, kills standard DBA).

  6.  **Addressing the "Killer" Desideratum:**
      *   Which one kills the most arguments? **The Bridge + Stakes.**
      *   Specifically: *The argument must explain why a sure loss in a counterfactual betting scenario (at linear stakes) constitutes a rational defect in belief for an agent who does not actually bet.*
      *   If you assume the bridge, you beg the question. If you don't, the DBA is about betting, not belief.

  7.  **Addressing the "Three Notions":**
      *   Yes, they come apart.
      *   *In Principle:* Most DBAs prove this.
      *   *In Practice:* Almost no DBAs prove this (due to transaction costs/stakes).
      *   *Relative:* Rarely discussed, but crucial for "knowledge" based arguments.
      *   *Verdict:* An adequate argument must specify which one it targets. Most fail because they prove *Principle* but sell *Practice*.

  8.  **Scorecard Preparation:**
      *   *De Finetti/Skyrms:* Synchronic, betting focus. Fails Bridge.
      *   *Lewis:* Diachronic. Fails if you can pre-commit or if stakes are bounded.
      *   *Representation Theorems:* Preference focus. Fails if preferences aren't probabilistic (Allais).
      *   *Joyce/Accuracy:* Non-pragmatic. Solves Bridge, introduces "Accuracy" norm. Fails if you don't care about accuracy.

  9.  **Refining the Tone:**
      *   Avoid "Some philosophers say..." Be direct. "Consensus is X," "Contested is Y."
      *   Acknowledge the user's expertise. Don't explain basic DBA mechanics. Focus on the structural flaws.
      *   Be blunt about confused framings. (e.g., The "loss" definition is often conflated).

  10. **Final Review against Constraints:**
      *   Did I answer the "jointly unsatisfiable" question? Yes (Bridge + Realism).
      *   Did I address the three notions? Yes.
      *   Is the scorecard short? Yes.
      *   Is the distinction between consensus/contested clear? Yes.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Accuracy arguments solve the Bridge problem.
      *   *Correction:* They solve the *Pragmatic* Bridge but introduce an *Epistemic* Bridge (why care about accuracy?). Need to make sure I don't present Accuracy as a silver bullet, just a different trade-off.
      *   *Initial thought:* Is "bounded agents" a hard requirement?
      *   *Correction:* For a *normative* argument, maybe not. But for the user's friend ("I haven't lost money"), realism is key. I need to frame this as "Normative Force vs. Psychological Realism."
      *   *Crucial Point:* The user asks about the "Friend" objection. The Friend is invoking *In Practice*. Standard DBAs provide *In Principle*. This is the mismatch.

  12. **Final Polish:** Ensure the distinction between "Sure Loss" (objective) and "Expected Loss" (subjective) is clear in the "What counts as loss" section. Ensure the "Stakes" section highlights the linearity assumption.

  (Proceed to generate response based on these structured thoughts.)
answer: |-
  This is a sharp diagnosis. You are correct that "Dutch-bookable" is treated as a univocal term when it is actually a placeholder for a cluster of distinct vulnerabilities, only some of which carry normative weight for belief.

  Here is the spec you asked for. I have separated **Hard Requirements** (logical or conceptual necessities for the argument to function as advertised) from **Camp Preferences** (substantive philosophical commitments often disguised as necessities). I have also flagged where consensus ends and contention begins.

  ### The Desiderata Spec

  #### 1. The Pragmatic Bridge (Hard Requirement)
  *   **The Demand:** The argument must non-circularly link *betting dispositions* to *degrees of belief*.
  *   **The Case:** If credence is *defined* as betting price (operationalism), the Dutch Book Argument (DBA) is trivial and tautological. If credence is distinct from betting price, the DBA requires a premise linking them (e.g., "Your credence *is* the price you deem fair").
  *   **Consensus/Contest:** It is settled that a bridge premise is required. It is **contested** whether any bridge premise is plausible without collapsing into operationalism or inviting counterexamples (e.g., risk aversion, income effects).
  *   **Status:** **Hard Requirement.** Without this, the argument proves you are a bad bettor, not that you have bad beliefs.

  #### 2. Stakes Linearity and Unboundedness (Camp Preference disguised as Hard Requirement)
  *   **The Demand:** The argument typically requires that utility is linear in money (or that stakes can be scaled arbitrarily) to guarantee a sure loss.
  *   **The Case:** If you have diminishing marginal utility for money, a bookie cannot necessarily construct a sure *utility* loss even if there is a sure *money* loss. If you cap stakes (e.g., "I never bet more than $100"), finite incoherence might not be exploitable at all.
  *   **Consensus/Contest:** It is **settled** mathematically that standard DBAs require linear utility/unbounded stakes for the "sure loss" to hold strictly. It is **contested** whether this is a bug or a feature. Many argue that requiring unbounded utility is an illegitimate demand on rational agents.
  *   **Status:** **Camp Preference.** If you want the argument to apply to real humans (your friend), you cannot demand this. If you demand this, you admit the argument only applies to idealized agents with linear utility functions.

  #### 3. Simultaneity and Protocol (Hard Requirement)
  *   **The Demand:** The argument must specify whether the incoherence is synchronic (a state) or diachronic (a trajectory) and what betting protocol is assumed.
  *   **The Case:** As you noted, if bets are offered sequentially and the agent can update or refuse after the first, the "book" dissolves. A synchronic DBA requires the agent to accept the *package* of bets simultaneously.
  *   **Consensus/Contest:** **Settled.** Synchronic DBAs (De Finetti) require simultaneous acceptance. Diachronic DBAs (Lewis) require specific updating rules. Confusing the two invalidates the proof.
  *   **Status:** **Hard Requirement.** The argument fails if it relies on sequential offers without guaranteeing the agent cannot update or walk away.

  #### 4. Counterfactual Robustness (Hard Requirement)
  *   **The Demand:** The argument must apply to propositions on which no actual bet is offered.
  *   **The Case:** Most credences are never tested. If the DBA only condemns actual betting behavior, it leaves most beliefs untouched. It must rely on *counterfactual* betting dispositions ("If a bet *were* offered...").
  *   **Consensus/Contest:** **Settled** that DBAs rely on counterfactuals. **Contested** whether counterfactual betting dispositions are well-defined for non-operationalists. (Hájek's "The Reference Class Problem" and "Fifteen Arguments Against the Principal Principle" touch on this).
  *   **Status:** **Hard Requirement.** If the argument only covers bet-on propositions, it fails to establish Probabilism as a general norm of belief.

  #### 5. Gradability of Irrationality (Camp Preference)
  *   **The Demand:** The argument should quantify *how bad* a violation is (e.g., distance from coherence), not just binary coherent/incoherent.
  *   **The Case:** Your friend is off by 2%. Standard DBAs say "You are incoherent," same as if you were off by 50%. Accuracy arguments (Joyce) handle this; classic DBAs do not.
  *   **Consensus/Contest:** **Contested.** Classic DBA proponents often accept the binary cliff. Accuracy proponents view gradability as essential.
  *   **Status:** **Camp Preference.** Classic DBA cannot deliver this without modification (e.g., measuring the size of the sure loss).

  #### 6. Bounded Rationality / Feasibility (Hard Requirement for "Practice")
  *   **The Demand:** If the argument claims to show you *would* lose money, the book must be computable by a bookie within reasonable resource limits.
  *   **The Case:** If finding the Dutch Book requires solving an NP-hard problem across your belief set, the "sure loss" is not a practical threat.
  *   **Consensus/Contest:** **Settled** that finding books can be computationally hard. **Contested** whether normative force requires feasibility.
  *   **Status:** **Hard Requirement for "In Practice" force.** If you are arguing against your friend ("I haven't lost money"), you need feasibility. If you are arguing for ideal rationality, you can ignore this.

  #### 7. The Bookie's Epistemic State (Hard Requirement)
  *   **The Demand:** The argument must specify what the bookie knows.
  *   **The Case:** A "sure loss" is only sure relative to a state of information. If the bookie knows your credences and you don't know the bookie knows, is it still a rational defect for *you*? If the bookie is omniscient, the argument proves you are exploitable by a god, not necessarily by the market.
  *   **Consensus/Contest:** **Settled** that standard DBAs assume a bookie who knows your credences. **Contested** whether this makes the loss "subjective" or "objective."
  *   **Status:** **Hard Requirement.** The argument must clarify if the loss is sure *simpliciter* or sure *relative to the bookie*.

  ---

  ### The Three Notions: Real or Confused?

  Your carving is **real and necessary**. They come apart significantly, and failing to distinguish them is the primary source of confusion in the literature.

  1.  **Dutch-bookable in Principle:** There exists a set of bets, acceptable by your lights, that yield a sure loss. (Assumes ideal bookie, linear stakes, simultaneous offer).
      *   *Status:* This is what De Finetti and Skyrms prove.
  2.  **Dutch-bookable in Practice:** An actual agent in your environment can construct and offer this book, net of transaction costs, within computational limits.
      *   *Status:* This is what your friend cares about. **Almost no DBA proves this.**
  3.  **Dutch-bookable Relative to Information:** The book yields a loss given the bookie's knowledge, but perhaps not given yours (e.g., you have a false belief that makes the bet look favorable).
      *   *Status:* This is the "What counts as a loss" problem. If you believe a coin is biased (false belief) and bet accordingly, you are coherent relative to your beliefs but lose money relative to the world. DBAs usually target coherence relative to *your* beliefs, not truth.

  **Verdict:** An adequate argument must explicitly state which notion it establishes. Most arguments establish (1) but claim the normative force of (2). This is a category error.

  ---

  ### Joint Unsatisfiability: The "Impossible Trinity"

  You asked if any subset of these is jointly unsatisfiable. Yes. There is a trilemma here. You cannot simultaneously satisfy the following three desiderata:

  1.  **Non-Circularity:** The argument does not define credence *as* betting disposition.
  2.  **Real-World Stakes:** The argument works for agents with bounded utility/concave utility (no linear money assumption).
  3.  **Normative Bite:** The argument proves that incoherence is a rational defect in *belief*, not just in betting strategy.

  **Why they conflict:**
  *   To get **Normative Bite** without **Non-Circularity**, you must assume a bridge premise linking belief to betting.
  *   To make that bridge premise plausible for **Real-World Stakes**, you must account for risk aversion and diminishing marginal utility.
  *   Once you account for risk aversion, the **Mathematics of DBA breaks** (you can no longer guarantee a sure loss for incoherent credences).
  *   To fix the Math, you must assume Linear Utility (violating **Real-World Stakes**) or define Credence as Linear Betting Price (violating **Non-Circularity**).

  **The Killer Desideratum:**
  The single desideratum that knocks out the largest share of standard arguments is **Real-World Stakes (specifically, bounded/concave utility).**
  *   De Finetti/Skyrms: Fail (assume linear utility).
  *   Lewis: Fails (assume linear utility + specific diachronic protocols).
  *   Representation Theorems: Fail (assume preferences satisfy axioms that imply linear utility or specific risk profiles).
  *   Joyce/Accuracy: **Survives** (does not rely on betting stakes), but swaps the problem for "Why care about accuracy?"

  If you want to convince your friend, you cannot use a betting argument. Your friend's objection ("I cap my exposure") exploits the **Stakes** vulnerability. A betting argument cannot survive the "I only bet $10" objection without assuming you *should* be willing to bet more, which begs the question.

  ---

  ### Scorecard of Existing Arguments

  *   **De Finetti / Skyrms (Synchronic DBA):**
      *   *Delivers:* In Principle incoherence.
      *   *Fails:* The Bridge (operationalist leanings), Stakes (assumes linearity), Unbet Propositions (counterfactual weakness).
      *   *Verdict:* Mathematically sound, normatively weak for non-bettors.

  *   **Lewis (Diachronic DBA):**
      *   *Delivers:* Argument for Conditionalization.
      *   *Fails:* Protocol sensitivity (agent can pre-commit or refuse second bet), Stakes (linearity), assumes agent knows they are being booked.
      *   *Verdict:* Fragile. Easily blocked by strategic behavior.

  *   **Representation Theorems (Von Neumann-Morgenstern / Savage):**
      *   *Delivers:* Coherence between preference and probability.
      *   *Fails:* The Bridge (identifies belief with preference), Allais Paradox (humans violate axioms), Stakes (utility function constraints).
      *   *Verdict:* Proves consistency of preference, not truth of belief.

  *   **Joyce (Accuracy-Dominance):**
      *   *Delivers:* Non-pragmatic justification for Probabilism.
      *   *Fails:* Requires accepting "Accuracy" as the sole epistemic good (contested), depends on choice of scoring rule (Brier vs. others).
      *   *Verdict:* Best for your "Friend" case (avoids money/stakes), but shifts the burden to defending epistemic utility.

  *   **Money-Pump Variants (Gustafsson et al.):**
      *   *Delivers:* In Practice exploitability (sometimes).
      *   *Fails:* Requires sequential choices where agent doesn't learn; often blocked by pre-commitment or "resolute choice."
      *   *Verdict:* Stronger on "Practice," weaker on "Belief" (looks like preference cycling).

  ### Final Recommendation for Your Project

  If your goal is to answer the Friend ("Coherence is aesthetics, I haven't lost money"), **abandon the Dutch Book.**

  The Friend is invoking **Dutch-bookable in Practice** with **Bounded Stakes**. No DBA survives this without assuming the Friend is already irrational for having bounded stakes.

  **The Pivot:**
  The only argument that survives the Friend's objection is the **Accuracy-Dominance** argument (Joyce/Pettigrew). It bypasses money, stakes, and betting dispositions entirely. It argues that incoherent credences are *less accurate* than coherent ones, regardless of whether you bet.
  *   *Trade-off:* You must defend the norm that "Accuracy is the goal of belief."
  *   *Benefit:* It renders the Friend's "I haven't lost money" irrelevant.

  **The Finding:**
  The "Dutch Book" is not a unified argument. It is a family of mathematical results that require a **Pragmatic Bridge** to become normative. That Bridge is the weak link. If you build your project on the DBA, you must explicitly defend the Bridge. If you cannot, the DBA is merely a theorem about betting prices, not beliefs. Your suspicion that "Dutch-bookable" collapses four distinct properties is correct; the literature's failure to distinguish them is the primary reason the debate has stalled for 50 years.
