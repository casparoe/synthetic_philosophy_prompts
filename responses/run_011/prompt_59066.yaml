answer: |-
  1. **Dependency spine**
  Start with the Central Dogma (DNA → Protein → Action). This depends on nothing; it is their clear native fluency and establishes the "data becomes machine" premise. Next, introduce "Formal System" as "Syntax determining Action." This depends on the Dogma to ground the abstraction; without biology, "syntax" is empty math, but with it, it is a rulebook for cells. Third, present the Typogenetic Code (duplets to enzymes). This depends on the Formal System definition; students must accept letters as rules before accepting specific rules. Fourth, trace an Enzyme's Operation (binding, cutting). This depends on the Code; you cannot execute rules before defining them. Finally, reveal the Strange Loop (enzymes act on the strand that coded them). This depends on the Operation; the loop only closes if they see the enzyme returning to its source. Any earlier, and self-reference looks like magic rather than mechanism. This order ensures they see the biology first, then the logic, then the synthesis, preventing the "bad biology" objection from derailing the formal lesson. By anchoring in the Central Dogma, you validate their expertise before asking them to suspend it for the sake of the analogy. This sequence moves from concrete (cells) to abstract (rules) to synthesized (loop), ensuring the formal system feels like a description of their biology, not a replacement for it.

  2. **The carrying strand**
  Use a custom 4-base strand, not Hofstadter's full replication puzzle. It must be short enough to write twice (once as data, once as code) and trace in under five minutes. It needs two duplets coding for two distinct actions: one binding preference, one structural change (e.g., "cut"). It must lack complex arithmetic or branching logic. Hofstadter's original example requires tracking too many state variables for a first exposure; students will lose the loop in the arithmetic. Pure biological examples lack the formal rigidity to show *how* syntax becomes semantics. The custom strand isolates the causal circle: Sequence A builds Tool B, Tool B modifies Sequence A. This fits the whiteboard constraints and keeps the cognitive load on the relationship between levels, not the calculation. Ensure you draw the enzyme as a physical shape interacting with the strand, not text acting on text, to reinforce the mechanical nature of the logic.

  3. **Misconception map**
  **Triplets vs. Duplets:** Surfaces immediately when writing the code. Students will correct you because their biology knowledge is very robust. *Move:* Pre-emptively frame Typogenetics as a "logic engine," not a biological model. Say: "Biology uses triplets; this system uses duplets to simplify the math. We are studying the *structure* of coding, not the biochemistry." Validate their knowledge before overriding it. Acknowledge the discrepancy explicitly so they don't feel their expertise is being insulted.
  **Enzyme Understanding:** Surfaces during operation tracing. Students imply the enzyme "knows" where to cut because they anthropomorphize cellular machinery. *Move:* Insist on "blind shape matching." Draw the enzyme as a physical key, not a reader. "It doesn't know 'cut'; it just fits here and breaks." Remove agency from the protein. Emphasize that chemistry is geometry, not interpretation.
  **Passive Replication:** Surfaces at the loop closure. Students think replication is external (PCR) because that is their lab experience. *Move:* Contrast a photocopy (passive) with a blueprint that builds the copier (active). Ask: "Does the paper copy itself, or does the machine copy the paper?" Force them to distinguish the object from the instructions.
  **Gödel/Mind Dualism:** Surfaces in Q&A. The confident pre-med will claim this proves minds aren't machines because they conflate incompleteness with immateriality. *Move:* Redirect to emergence. "This shows how meaning arises from matter, not that matter is limited." Keep the focus on the mechanism of meaning, not the metaphysics of mind. If they argue dualism, point back to the whiteboard: "The enzyme doesn't have a mind, yet it follows instructions. Where is the mind in that process?" Force the contradiction between their dualism and the strict mechanical reality on the board.

  4. **The check**
  Question: "In this system, who reads the DNA to decide what the enzyme does?"
  **Landed Answer:** "No one. The shape of the enzyme is determined by the DNA, and the shape determines the action. The meaning is in the physical interaction." (Shows they grasp the lack of homunculus).
  **Vocab Answer:** "The isomorphism creates a strange loop where the semantics emerge from the syntax via the typogenetic code." (Sounds right but misses the 'no reader' point).
  The goal is to ensure they understand the *mechanism* of meaning, not just the *name* of the concept.

  5. **Cut list**
  Leave out Gödel Numbering and the specific arithmetic isomorphism (TNT). It requires too much mathematical scaffolding and distracts from the biological analogy. Trying to explain how numbers map to strings will consume the entire hour and lose the biology majors.
  **Exit Sentence:** "We are skipping the math of how numbers become strings, because today we are only tracking how strings become machines."
  This explicitly acknowledges the missing piece without apologizing, keeping the focus on the Life/Machine interface which is their strength.
