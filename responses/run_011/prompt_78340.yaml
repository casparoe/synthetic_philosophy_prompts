          7.  Constraint 1: Justify why *not* just adopt a fully interest-relative account of explanation (why the puzzle doesn't just evaporate).
          8.  Constraint 2: No bibliography/citations/inline citations.
      *   **Tone:** Honest about historical limitations, rigorous philosophically, persuasive to a skeptical committee.

  2.  **Drafting - Section by Section:**

