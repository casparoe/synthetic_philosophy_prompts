      *   **The Problem (Philosophical & Historical Context):**
          *   *Historical side:* Mention the camps (coal/New World, institutions, wages/energy, culture). Acknowledge the applicant's position (philosopher entering history).
          *   *Philosophical side:* Standard accounts of explanation (causal, unificationist, erotetic). Why don't they solve it? Erotetic accounts allow *any* contrast class, which leads to the "interest-relative" trap (Constraint 1). We need to know if some baselines are *better*, not just *different*.
          *   *Addressing Constraint 1 (Interest-Relativity):* Why not just say "all baselines are valid relative to interests"? Because historians claim their explanations are *objectively* better supported by evidence, not just useful for specific queries. If the baseline is arbitrary, the evidence evaluation is compromised. The proposal must argue that resolving the baseline is necessary for adjudicating empirical claims.
      *   **Methodology (12 Months):**
          *   *Phase 1 (Months 1-3):* Literature mapping. Identify the implicit baselines in key texts. (Honesty check: I will read secondary literature, not primary archives).
          *   *Phase 2 (Months 4-6):* Philosophical analysis. Formalize the foil structures. Test the "interest-relative" escape hatch.
          *   *Phase 3 (Months 7-9):* The Concrete Test. Select specific causal claims (e.g., coal, institutions). Show how changing the foil changes the explanatory power.
          *   *Phase 4 (Months 10-12):* Synthesis and Writing.
      *   **Expected Results:**
          *   Not just "be more precise."
          *   Concrete outcome: A demonstration that Claim X works for Foil A but fails for Foil B.
          *   Historian-recognizable result: A diagnostic tool for evaluating divergence literature.
      *   **Failure Conditions:**
          *   Triviality: "Questions should be precise." (Mitigation: Show *how* precision changes empirical assessment).
          *   Convergence: Camps agree once foils are explicit. (Mitigation: This is still a result, showing the dispute was merely verbal).
      *   **Scope:**
          *   Cut: Deep archival work, broad global comparison beyond Britain/China, full defense of a specific historical theory.
          *   Keep: Focus on the structure of the arguments in the secondary literature.

  3.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I include inline citations? *Correction:* Remove any potential names/dates that look like citations. Use descriptions like "proponents of the institutional view."
      *   *Check:* Is the tone right? *Correction:* Ensure I don't sound like I'm telling historians how to do history, but rather clarifying the logical structure of their debate. Acknowledge the "working knowledge" limitation by framing the method as textual/conceptual analysis of existing historical arguments rather than new archival discovery.
      *   *Check:* The "Interest-Relative" constraint. *Correction:* Make sure this is prominent. The committee will ask: "Why isn't this just van Fraassen-style pragmatism?" The answer needs to be that historical *evidence* is claimed to be objective, and if the baseline shifts the evidentiary support, we have a problem for historical realism/objectivity.
      *   *Check:* Length. *Correction:* Keep it tight. Two pages roughly (approx. 1000-1200 words).

  4.  **Final Review against constraints:**
      *   Precise question? Yes.
      *   Why existing positions leave it open? Yes.
      *   Method (phase by phase)? Yes.
      *   Result (concrete test)? Yes.
      *   Failure conditions? Yes.
      *   Scope assessment? Yes.
      *   Interest-relative justification? Yes.
      *   No bibliography/citations? Yes.

  5.  **Final Polish:** Ensure smooth transitions between sections. Make sure the "honesty" about historical expertise sounds like a strategic focus (philosophical analysis of historical texts) rather than a weakness. (e.g., "I will treat the historical literature as the data set.")

  *(Self-Correction on the "Interest-Relative" argument)*: I need to be careful not to dismiss pragmatism entirely, but to show its limits in this specific context. If every historian is asking a different question, they aren't actually disagreeing. But they *act* as if they are disagreeing. The proposal investigates this tension.

  *(Self-Correction on Method)*: Make sure "what I would actually do" is clear. Reading, coding arguments, reconstructing logical forms, not "thinking hard."

