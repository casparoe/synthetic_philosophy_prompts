answer: |-
  **Project Title:** Baselines and Foils: A Philosophical Analysis of Explanatory Disagreement in the Great Divergence

  **Statement of the Question**
  The central question of this project is: To what extent is the substantive disagreement among historians regarding the causes of the Great Divergence attributable to incompatible, implicit choices of explanatory foil and baseline expectation, and is there a principled basis for selecting one baseline over another?

  This question is phrased to allow for two distinct outcomes. It may turn out that the disagreement is largely methodological: once the contrasting cases (e.g., England vs. Yangzi Delta vs. China as a whole) and the expected baselines (e.g., escape from Malthusian trap vs. failure of advanced commercialization) are made explicit, the causal claims converge or are shown to address non-identical *explananda*. Alternatively, it may turn out that even with fixed foils, substantive disagreement remains, implying that the choice of baseline does not do the decisive work often suspected. The project seeks to determine which of these structures governs the literature, and whether the choice of baseline is constrained by historical evidence or fixed solely by the researcher's interests.

  **The Problem: Why Existing Approaches Leave It Open**
  The literature on the Great Divergence is characterized by competing causal camps: those emphasizing resource endowments and New World flows; those prioritizing institutions and property rights; those focusing on factor prices and energy; and those citing scientific culture. Standard philosophical accounts of explanation do not resolve the tension between these camps. Causal accounts identify difference-makers but do not specify which differences count against which background. Unificationist accounts seek common patterns but struggle when the patterns themselves are defined by different temporal and spatial scopes.

  Crucially, standard erotetic (question-based) accounts of explanation, which treat explanations as answers to why-questions defined by a contrast class, offer a ready escape hatch: they render explanation fully interest-relative. On this view, any foil is admissible provided it serves the inquirer's purposes. If one historian asks why England industrialized rather than China, and another asks why England industrialized rather than continuing in an organic economy, both questions are well-posed relative to their respective interests. The puzzle evaporates because there is no single question to which the camps are rival answers.

  However, this fully interest-relative account is unsatisfactory for the practice of economic history. Historians do not treat these accounts as merely complementary; they argue that their preferred causal story is *better supported by the evidence* than the rivals. If the baseline expectation is arbitrary, the evidentiary support for a causal claim becomes unstable. A factor might be a strong difference-maker relative to a Malthusian baseline but irrelevant relative to a commercialization baseline. If the baseline is fixed only by interest, the claim that one account is historically "better" reduces to the claim that one interest is more popular. This project proceeds on the hypothesis that historians intend their claims to have objective traction beyond local utility. Therefore, we must determine if there are principled constraints on baselines that allow for objective adjudication between causal claims, or if we must accept that the debate is fragmented into non-competing inquiries.

  **Methodology: Twelve-Month Plan**
  As a philosopher of science, I will not conduct original archival research or generate new historical data. Instead, I will treat the existing secondary literature in economic history as the data set, analyzing the logical structure of the arguments presented.

  *Months 1–3: Mapping the Implicit Baselines.* I will survey the major contributions to the Great Divergence debate. The output will be a taxonomy of the implicit foils and baselines used in each text. I will code each argument for its spatial contrast (e.g., Britain vs. Yangzi, Britain vs. Eurasia) and its temporal/counterfactual baseline (e.g., vs. stagnation, vs. Smithian growth). This phase requires acquiring sufficient familiarity with the historical literature to accurately reconstruct the arguments without misrepresenting the historical claims.

  *Months 4–6: Philosophical Formalization.* I will formalize the structures identified in Phase 1 using models of causal explanation. I will test the "interest-relative" escape hatch by analyzing whether the historians' own criteria for evidence change with the foil. I will draft a paper arguing why a purely pragmatic account of explanation fails to capture the normative force of historical disagreement in this domain.

  *Months 7–9: The Concrete Test.* I will select three specific causal claims prominent in the literature (e.g., the role of coal, the role of high wages, the role of state capacity). For each claim, I will demonstrate whether its explanatory power holds or collapses when the foil is shifted. For instance, I will show whether "high wages" functions as an explanation if the foil is "continued organic growth" versus "failure to industrialize despite commercialization." This involves reconstructing the counterfactual dependencies relied upon by each camp.

  *Months 10–12: Synthesis and Dissemination.* I will integrate the findings into a final monograph-length manuscript and prepare two articles for submission: one targeting philosophy of science journals on the structure of historical explanation, and one targeting interdisciplinary history journals on the methodological clarity of the Great Divergence debate.

  **Expected Results**
  A successful result will not merely be a recommendation to "be more precise." It must be a result recognizable to an economic historian as a diagnostic tool. The concrete deliverable will be a demonstration that for specific causal claims, the refinement of the foil changes the claim's status from "well-supported" to "unsupported" (or vice versa).

  For example, if the institutional camp relies on a baseline where China is expected to industrialize given its commercial sophistication, but the resource camp relies on a baseline where industrialization is unexpected without coal, I will show that these are not competing explanations of the same event. The result will be a set of criteria for determining when two historical accounts are genuine rivals and when they are talking past one another. This allows historians to identify which empirical disputes are substantive and which are artifacts of mismatched baselines.

  **Failure Conditions**
  There are two live possibilities for failure. First, the project could reduce to the trivial conclusion that vague questions should be made precise. To avoid this, I must show *how* precision alters the evaluation of evidence, not just the clarity of the question. Second, it may turn out that once the foils are pinned down, the camps simply converge. If institutionalists and resource theorists agree once they share a baseline, the "disagreement" was merely verbal. While this is a positive philosophical result, it would limit the project's impact on ongoing historical debate. I will mitigate this by focusing on cases where empirical disagreement persists even after foil-alignment, isolating the residual substantive conflict.

  **Scope and Limitations**
  To complete this within one year, I must strictly limit the scope. I will not attempt to resolve the Great Divergence itself, nor will I adjudicate which historical theory is true. I will not expand the comparison to include India or Japan, nor will I extend the timeline beyond the early modern to modern transition. My historical expertise is limited to the secondary literature; I will not engage with primary archival sources. The project is an analysis of the *logic of the debate*, not a contribution to the *empirical data* of the debate. This limitation is a feature, not a bug: it allows for a meta-analytical perspective that is difficult for practitioners immersed in empirical disputes to maintain.

  **Why Not Accept Interest-Relativity?**
  A skeptical committee member may ask why I do not simply adopt a fully interest-relative account of explanation, on which any contrast class is admissible relative to a historian's purpose, thereby dissolving the puzzle. The reply is that such an account renders the notion of "evidential support" local to the interest. If Historian A and Historian B have different interests, they are not disagreeing; they are simply talking about different things. Yet, the literature is replete with claims that rival accounts are *wrong*, not just *different*. If the interest-relative view is correct, these claims of error are mistaken. My project investigates whether there is a cost to accepting that cost. If we can show that baselines are constrained by the historical context itself (e.g., what agents at the time could reasonably expect), then explanation is not purely interest-relative, and objective adjudication is possible. If we cannot show this, we must accept that the Great Divergence is not a single historical problem but a family of distinct questions. Determining which is the case is a necessary precondition for the debate to progress.
