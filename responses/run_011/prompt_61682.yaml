  # Activity Design: The Description Economy

  ## 1. Materials List
  *   **Tokens:** 1,500 small paper squares or poker chips (100 per student).
  *   **Handout A (7 copies):** "Language Alpha" notation sheet.
  *   **Handout B (8 copies):** "Language Beta" notation sheet.
  *   **Prediction Slips:** 300 small slips of paper (20 rounds × 15 students).
  *   **Whiteboard:** Divided into three sections (Group A Scores, Group B Scores, Global Data Stream).
  *   **Data Deck:** 24 index cards, each with a single large digit (0 or 1) written on the back. (See *Data Generation* below).
  *   **Timer:** Visible to the class.

  ## 2. The Notations (Handouts)
  *Do not explain the logic of the languages. Hand them out cold.*

  **Handout A: Language Alpha**
  *Rules for predicting the next bit (0 or 1) based on the current bit.*
  1.  **Symbol `=`** (Cost: 1 Token): Next bit is the **Same** as current bit.
  2.  **Symbol `0`** (Cost: 1 Token): Next bit is **0**.
  3.  **Symbol `1`** (Cost: 1 Token): Next bit is **1**.
  4.  **Symbol `#`** (Cost: 4 Tokens): Next bit is the **Opposite** of current bit.
  *Note: You may combine up to 3 symbols per round. If symbols conflict, majority vote decides. Cost is the sum of symbols used.*

  **Handout B: Language Beta**
  *Rules for predicting the next bit (0 or 1) based on the current bit.*
  1.  **Symbol `#`** (Cost: 1 Token): Next bit is the **Opposite** of current bit.
  2.  **Symbol `0`** (Cost: 1 Token): Next bit is **0**.
  3.  **Symbol `1`** (Cost: 1 Token): Next bit is **1**.
  4.  **Symbol `=`** (Cost: 4 Tokens): Next bit is the **Same** as current bit.
  *Note: You may combine up to 3 symbols per round. If symbols conflict, majority vote decides. Cost is the sum of symbols used.*

  ## 3. Scoring Rule (Whiteboard Reference)
  Write this prominently before starting.

  *   **Endowment:** 100 Points.
  *   **Description Cost:** 5 Points per Symbol used in your rule.
  *   **Accuracy Reward:** 8 Points if your prediction matches the revealed bit.
  *   **Net Round Score:** (Reward if correct, else 0) − (Total Symbol Cost).
  *   **Bankruptcy:** If points drop below 0, you are "silenced" (cannot bet further, observe only).
  *   **Hedging:** You may submit multiple symbols (e.g., `=` and `#`). You pay for both. If *either* predicts correctly, you get the Reward. (Note: In binary, `=` and `#` cover all outcomes, guaranteeing reward but costing 5+5=10 points for an 8 point reward = Net -2).

  ## 4. Data Generation (Instructor Prep)
  *You must generate this before class. Do not use a computer during class.*

  **The Stream (20 Rounds):**
  *   **Start Bit (Round 0):** 0 (Announced publicly).
  *   **Phase 1 (Rounds 1–7): Persistence.** The bit stays the same for 2-3 rounds, then flips.
      *   *Sequence:* 0, 0, 0, 1, 1, 0, 0, 0
      *   *Logic:* Favors `=` (Same).
  *   **Phase 2 (Rounds 8–14): Alternation.** The bit flips every round.
      *   *Sequence:* 1, 0, 1, 0, 1, 0, 1
      *   *Logic:* Favors `#` (Opposite).
  *   **Phase 3 (Rounds 15–20): Noise.** Use the 15th–20th digits of Pi (3.141592653589793...). Take digit mod 2.
      *   *Digits:* 9, 7, 9, 3, 5, 8
      *   *Mods:* 1, 1, 1, 1, 1, 0
      *   *Sequence:* 1, 1, 1, 1, 1, 0
      *   *Logic:* No simple rule fits consistently.

  **Preventing Inference:**
  1.  Write the 20 bits on the index cards *before* class. Seal them in an envelope.
  2.  During class, do not look at the cards until the moment of reveal.
  3.  Maintain "Poker Face." Do not nod, frown, or hesitate when revealing.
  4.  Collect prediction slips face-down in a box before revealing the bit.

  ## 5. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Endowment**
  *   Divide room: Left 7 students (Group A), Right 8 students (Group B).
  *   Distribute Tokens (100 each) and Language Handouts.
  *   Explain Scoring Rule on Whiteboard. Emphasize: "Your goal is to finish with the most points. Points are lost every round for writing symbols."

  **00:10 – 00:15: Practice Round**
  *   Run one dummy round (Round 0 -> Round 1).
  *   Walk through the arithmetic aloud: "You wrote `=`. That is 1 symbol. Cost 5. Bit was 0. You predicted 0. Reward 8. Net +3. New Total 103."
  *   Ensure everyone understands the subtraction.

  **00:15 – 00:45: Phase 1 (Persistence)**
  *   Rounds 1 through 7.
  *   **Rhythm:** Write Prediction (2 mins) -> Collect Slips -> Reveal Bit (1 min) -> Calculate Scores (2 mins).
  *   **Instructor Action:** Update Group A and Group B average scores on the board after every round.
  *   **Expected Outcome:** Group A (Language `=` is cheap) will surge ahead. Group B (Language `=` is expensive) will stagnate or bleed points if they try to describe Persistence.

  **00:45 – 00:55: Mid-Game Audit**
  *   Pause. Ask Group A: "Why are you winning?" (They will say "Our rules are shorter.")
  *   Ask Group B: "Why are you losing?" (They will say "The truth is hard to write.")
  *   Do not validate. Resume game.

  **00:55 – 01:25: Phase 2 & 3 (Switch & Noise)**
  *   Rounds 8 through 20.
  *   **Rhythm:** Same as before.
  *   **Expected Outcome:** Around Round 8, Group B surges (Alternation is cheap for them). Group A bleeds.
  *   **Round 15+:** Both groups begin to bleed points slowly. Even the "cheap" rules fail 50% of the time. Expected value becomes negative (Reward 8 × 0.5 = 4 < Cost 5).
  *   **Observation:** Students will start hedging (buying both `=` and `#`) to stop the bleeding of wrong predictions, but this guarantees a net loss of 2 points per round (Cost 10 - Reward 8). They feel the "cost of certainty."

  **01:25 – 01:40: Debrief**
  *   Map the experience to the theory (see below).

  ## 6. Worked Arithmetic (For Whiteboard)

  **Scenario 1: The Winner (Round 3)**
  *   *Context:* Data stream is 0, 0, **0**. (Persistence).
  *   *Student (Group A):* Writes `=`.
  *   *Cost:* 1 symbol × 5 = 5 points.
  *   *Prediction:* 0 (Matches Truth).
  *   *Reward:* 8 points.
  *   *Net:* 8 - 5 = **+3**.
  *   *New Total:* 103.

  **Scenario 2: The Struggler (Round 3)**
  *   *Context:* Data stream is 0, 0, **0**. (Persistence).
  *   *Student (Group B):* Writes `=` (Expensive in Beta).
  *   *Cost:* 4 symbols × 5 = 20 points.
  *   *Prediction:* 0 (Matches Truth).
  *   *Reward:* 8 points.
  *   *Net:* 8 - 20 = **-12**.
  *   *New Total:* 88.

  **Scenario 3: The Hedge (Round 16 - Noise)**
  *   *Context:* Data stream is random.
  *   *Student:* Writes `=` and `#` (Covers all bases).
  *   *Cost:* (1 + 4) × 5 = 25 points (Group A) OR (1 + 1) × 5 = 10 points (If they find two cheap conflicting rules, but in this design `=` and `#` are the only opposites).
  *   *Correction for Handouts:* In Lang A, `=` is 1 sym, `#` is 4 syms. Total Cost 25.
  *   *Reward:* 8 points (Guaranteed).
  *   *Net:* 8 - 25 = **-17**.
  *   *Lesson:* Perfect accuracy is bankrupting if the description is too complex.

  ## 7. Debrief Mapping (The "Reveal")

  *Do not introduce new terms. Use their experience.*

  1.  **Description Length as Prior:**
      *   *Ask:* "In Phase 1, Group A pulled ahead. Was it because they were smarter?"
      *   *Point:* No. It was because their *language* made the truth cheap. In formal epistemology, we assign higher prior probability to hypotheses that are shorter to describe. You weren't just saving points; you were simulating a higher prior.

  2.  **Language Relativity (Kolmogorov Complexity):**
      *   *Ask:* "Group B, was the rule 'Repeat the previous bit' complex?"
      *   *Point:* To you, yes (4 symbols). To Group A, no (1 symbol). There is no absolute "simplicity," only simplicity relative to a coding language (a Universal Turing Machine). You disagreed on the truth's simplicity because your "machines" were different.

  3.  **The Mixture & Hedging:**
      *   *Ask:* "In Phase 3, did anyone try to buy both rules to guarantee a win?"
      *   *Point:* You found that guaranteeing a win cost more than the win was worth. This is the cost of the "Mixture." Solomonoff Induction sums over *all* predictors, but weights them by $2^{-\text{length}}$. If you weight long rules too heavily, you bleed points in the noise.

  4.  **Algorithmic Randomness:**
      *   *Ask:* "In the final rounds, did anyone manage to gain points consistently?"
      *   *Point:* No. That stretch was algorithmically random relative to your languages. No short program generates it. The rational move in that phase is to accept the bleed (or stop playing), acknowledging that some data has no compressible structure.

  ## 8. Candid Failure Analysis

  **Where Students Will Game the Scoring:**
  *   *Failure:* Students will realize that `0` and `1` (Cost 5) are always available. In the Noise phase, they might just bet `0` every time.
  *   *Result:* They get 50% accuracy. Net = (0.5 × 8) - 5 = -1.
  *   *Fix:* This is actually desired behavior! It shows that "stubbornness" (a constant rule) survives better than "complex overfitting." If they try to find patterns in noise using complex rules (Cost 20), they bleed faster (-11 per round). Let this happen. It proves the point.

  **Where Arithmetic Will Stall:**
  *   *Failure:* Calculating individual net scores for 15 students every 5 minutes will eat 20 minutes of class time.
  *   *Fix:* **Do not calculate individual scores live.** Ask for a *show of hands*: "Who ended the round with a positive net?" Count hands. Write "Group A: +5 heads, Group B: +1 head" on the board. Only calculate exact totals at the Mid-Game and End. This keeps the rhythm fast.

  **Where the Discovery Will Not Arrive:**
  *   *Failure:* Students might not notice the Language Asymmetry. They might think Group A is just "lucky."
  *   *Fix:* In the Mid-Game Audit (00:45), explicitly ask Group B: "How many symbols did it cost you to predict 'Same'?" Write the number "20" (4 syms × 5 pts) next to Group A's "5" (1 sym × 5 pts). Make the inequality visual.

  **Where the "Noise" Feels Like a Pattern:**
  *   *Failure:* Humans see patterns in randomness. They might think the Pi digits have a rule.
  *   *Fix:* In the debrief, reveal the source (Pi digits). Emphasize that *relative to their language*, it was random. A different language (e.g., "Output nth digit of Pi") would have been short, but that language wasn't available to them. This reinforces language relativity.

  ## 9. Limitations & Verbal Supplements

  **What This Activity Cannot Reproduce:**
  1.  **The Universal Prior:** In the game, the "Prior" is fixed by the handout. In Solomonoff Induction, the prior is over *all* computable functions. You must explain verbally that their Language Sheet was a tiny, finite fragment of the space of all Turing Machines.
  2.  **Convergence:** 20 rounds is not enough for Bayesian convergence. You must assure them that in the limit, the "cheap" truth always dominates the "expensive" truth, regardless of the language constant, provided the data stream is long enough.
  3.  **Computability:** The game treats "Rules" as static strings. It does not capture the halting problem (some short descriptions might never produce a prediction). You must mention that the formal theory requires weighting only *halting* programs, which makes the prior uncomputable.

  **Verbal Supplement for the End:**
  "To leave with the correct view: You just played a game where 'Truth' was a fixed sequence. In reality, we don't know the sequence. Solomonoff Induction says: 'Bet on every possible computer program that could generate data, but tax them exponentially by their code length.' You felt that tax. You felt that some truths are expensive in some languages. And you felt that sometimes, the universe just gives you noise, and the only rational move is to pay the tax and accept the loss."
