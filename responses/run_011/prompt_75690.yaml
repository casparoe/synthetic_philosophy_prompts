      *   *Sophistication vs. Resoluteness:*
          *   *Sophistication:* I know I'll change my mind later, so I choose now to block that future choice. (The philosopher is dismissive of this).
          *   *Resoluteness:* I stick to the plan even when my local preferences change, treating the past commitment as binding.
      *   *The Novelist's Angle:* A character sticking to a past vow despite current misery. Is she rational (diachronically consistent) or pathological (ignoring current welfare)?

