answer: |-
  **Part I: The Fact at the Kitchen Table**

  Let us put the math on the table without ornament. You have a bankroll $W_0$. You find a bet that pays even money (you risk 1 to win 1). You believe the probability of winning is $p = 0.55$, and the probability of losing is $q = 0.45$. You decide to stake a fixed fraction $f$ of your current bankroll on every round.

  After one bet, your bankroll is either $W_0(1+f)$ if you win or $W_0(1-f)$ if you lose. After $N$ bets, suppose you have won $W$ times and lost $L$ times (where $W+L=N$). Your bankroll $W_N$ is:

  $$W_N = W_0 (1+f)^W (1-f)^L$$

  To see how this grows, we look at the ratio of your final bankroll to your starting bankroll, $W_N/W_0$. Because this number gets astronomically large or small very quickly, we take the natural logarithm. This turns powers into multipliers, which are easier to average.

  $$\ln(W_N/W_0) = W \ln(1+f) + L \ln(1-f)$$

  Now divide by $N$ to get the average growth per bet:

  $$\frac{1}{N} \ln(W_N/W_0) = \frac{W}{N} \ln(1+f) + \frac{L}{N} \ln(1-f)$$

  Here is where the Law of Large Numbers enters. As $N$ becomes very large, the fraction of wins $W/N$ will converge to your probability of winning $p$, and $L/N$ will converge to $q$. The average growth rate per bet, which we call $g(f)$, settles down to:

  $$g(f) = p \ln(1+f) + q \ln(1-f)$$

  This function $g(f)$ tells you the speed at which your bankroll grows exponentially. To find the fraction $f$ that makes this speed as fast as possible, we use standard calculus (finding where the slope is zero). The result for even-money bets is simple:

  $$f^* = p - q$$

  With your numbers ($p=0.55, q=0.45$), the growth-maximizing fraction is $f^* = 0.10$, or 10% of your bankroll.

  Now, consider a rival bettor. They face the same bets, with the same odds and probabilities, but they choose a different fraction, call it $f$. Perhaps they bet 5% or 20%. Their growth rate is $g(f)$. Because the function $g(f)$ has a single peak at $f^*$, we know that $g(f^*)$ is strictly greater than $g(f)$ for any $f \neq f^*$.

  Why does this mean you finish ahead with probability approaching one? Look at the difference in your log-wealths after $N$ bets:

  $$\ln(W_N^{you}) - \ln(W_N^{rival}) \approx N \cdot [g(f^*) - g(f)]$$

  Since $g(f^*) > g(f)$, the term in the brackets is a positive number. As $N$ increases, you are multiplying a positive number by a larger and larger $N$. The difference in log-wealth goes to positive infinity. This means the ratio of your wealth to their wealth goes to infinity.

  It is not just that you have more on average. It is that the probability of you having less than them shrinks to zero as $N$ grows. In the long run, the path with the higher geometric growth rate swamps all others. You do not need utility theory to see this; you only need to see that a higher compound interest rate always beats a lower one over a long enough timeline.

  **Part II: The Law of Large Numbers and the Normative Gap**

  You asked for honesty: Does this fact amount to anything more than the Law of Large Numbers applied to logarithms? Mathematically, no. There is no hidden theorem here. The machinery is precisely the convergence of the average log-return to its expected value.

  However, the *significance* of this fact is where your position stands or falls. The standard Expected Utility (EU) tradition says a rational agent maximizes the expectation of some function of wealth, $U(W)$. If you choose $U(W) = \ln(W)$, you get the Kelly result. The first camp of commentators says your rule is just a special case of EU with a specific utility function. They are mathematically correct but philosophically shallow. They treat the logarithm as a preference (I like log-wealth) rather than a mechanism (log-wealth measures compound growth).

  The second camp says EU is confused about time averages. They are closer to your view, but they often get bogged down in redefining rationality itself.

  Your position is sharper. You claim the authority of the rule rests on **asymptotic dominance**. The normative force—the reason you *ought* to follow this rule—does not come from a psychological preference for logarithms. It comes from the desire to win.

  Here is the exposure you suspected: To accept your view, one must grant that in a repeated betting scenario, the primary objective of a rational agent is to maximize the probability of having more wealth than any other specific strategy in the long run.

  If a bettor says, "I don't care if I finish ahead of you with certainty; I care about maximizing my expected dollar value on the next bet," your rule has no hold on them. (Maximizing expected dollar value on a positive bet usually leads to betting everything, which leads to ruin). If a bettor says, "I care about minimizing the time to reach \$1 million," your rule might not be the fastest path for that specific target.

  So, the real content of your position is this: In the absence of specific short-term constraints or liquidity needs, the only objective, non-arbitrary standard for comparing betting policies is long-run dominance. Expected Utility requires you to invent a subjective function $U(W)$ to tell you what you want. Your growth-rate rule tells you what *works* to preserve and expand capital over time. It shifts the argument from "What do you prefer?" to "What survives?" The normative force relies on the premise that survival and dominance are the default goals of any serious staking operation.

  **Part III: The Objection of Finite Horizons**

  The objection is common and serious: Nobody lives forever, and nobody faces an endless run of identical bets. A business needs to pay rent next month; a gambler needs to reach a target sum before a tournament ends. For someone who needs to double their money in ten bets, the growth-maximizing fraction might be too conservative. They might need to bet larger to overcome variance, accepting a higher risk of ruin for a higher chance of hitting the target quickly. Conversely, someone who cannot tolerate a 20% drawdown might need to bet smaller.

  I concede this truth: The growth-maximizing fraction is not the optimal solution for every specific finite-horizon problem. If your goal is "maximize probability of reaching \$X by time T," the math changes.

  However, this limits the *reach* of your position, it does not *refute* it. Your view is explicitly about "a long series of stakes." It is a rule for the management of a perpetual enterprise, not a one-off Hail Mary.

  Consider the alternative. If you abandon the growth-rate rule for finite goals, what replaces it? Usually, it is a customized Expected Utility calculation. But without the anchor of the growth-rate rule, those calculations become unmoored. You can justify any bet size by claiming a sufficiently exotic utility function.

  Your position remains the benchmark. It defines the "sustainable" path. Deviating from it is permissible only when you have a specific, binding constraint (like a deadline). But in the absence of such constraints, the burden of proof lies on the person deviating. They must explain why they are willing to sacrifice long-run dominance for a short-term objective. Your rule is the null hypothesis for rational staking: unless you have a specific reason to do otherwise (like a finite horizon), you follow the path that guarantees you will dominate other strategies in the long run. The existence of finite-horizon exceptions does not invalidate the rule for the infinite-horizon case, which is the domain you claimed.

  **Part IV: Fractional Kelly and Uncertainty**

  You ask about the bettor who stakes half the growth-maximizing fraction because they doubt their estimate of the fifty-five in a hundred. Is this a counterexample?

  It is not a counterexample; it is a sophisticated application of your view.

  Your rule states: "Stake the fraction... that maximizes the rate... on the same repeatable bets." The crucial phrase is "I believe I can estimate." If you are uncertain about your estimate, your *effective* edge is lower.

  Imagine you think $p=0.55$, but you acknowledge you might be wrong. If you bet the full 10% derived from $p=0.55$, and the true $p$ is actually 0.52, you are overbetting. Overbetting relative to the true edge reduces your growth rate and increases your risk of ruin. By betting half (5%), you are effectively admitting that your "known" edge is not 0.55, but something lower when adjusted for uncertainty.

  More importantly, consider the shape of the growth curve $g(f)$. Near the peak $f^*$, the curve is very flat. Betting half of $f^*$ sacrifices very little growth rate (perhaps 10-15% of the potential growth) but reduces the volatility of your bankroll by half. For a human bettor, who cannot actually play an infinite series without interruption, this reduction in volatility protects against "gambler's ruin" caused by bad luck in the short run.

  Does this violate the "maximize growth" rule? Strictly speaking, if the odds are truly known, half-Kelly grows slower than full-Kelly. But your view ranks *policies*. The policy "Bet 10% assuming perfect knowledge" is different from the policy "Bet 5% accounting for estimation error." If the estimation error is real, the 5% policy may actually yield a higher *realized* growth rate because it avoids the catastrophic drag of overbetting.

  Therefore, the fractional bettor is not rejecting your view. They are accepting that the "growth-maximizing fraction" must be calculated using *robust* parameters, not optimistic ones. They are still trying to maximize the long-run growth rate; they are simply acknowledging that uncertainty reduces the safe size of the bet. They are still aiming for dominance, just over a rougher road.

  ***

  I do not believe your view is false. It is a coherent, mathematically sound, and philosophically distinct stance that cuts through the confusion between subjective preference and objective performance. It correctly identifies that in repeated multiplicative processes, time averages (growth rates) dominate ensemble averages (expected value). There is no need to replace it; it stands on its own as the logic of survival and dominance in uncertain environments.
