      *   *The "Monotonicity" Crux:* In CGT, an extra move is good. In AI, an extra safety constraint (alignment) is often viewed by critics as a *cost* (alignment tax) that breaks symmetry. If misaligned AI can cut corners (ignore safety) to move faster/take more risks, symmetry is broken.
      *   *The "Stealing" Metaphor:* In CGT, you imagine making the opponent's move plus your own. In AI, you can't necessarily "add" the misaligned strategy to the aligned one without breaking alignment.
      *   *Conclusion on Hypothesis:* The hypothesis is strong but needs nuance. It's not just a "failed transfer" (implying a mistake); it's a *metaphorical anchor* that obscures the empirical reality. The impasse is less about the logic of the proof and more about the *empirical conditions* required for the analogy to hold.

