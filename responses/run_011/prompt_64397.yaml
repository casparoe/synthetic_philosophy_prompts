      *   **Topic:** The "strategy-stealing assumption" (SSA) in AI alignment, introduced by Paul Christiano (2019).
      *   **Core Claim of SSA:** If a misaligned AI can use a strategy to gain influence, aligned humans + aligned AI can use a similar strategy to retain influence (given comparable resources).
