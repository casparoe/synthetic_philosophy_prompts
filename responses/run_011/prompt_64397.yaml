answer: |-
  Your hypothesis is incisive: the impasse over the Strategy-Stealing Assumption (SSA) is sustained by a category error derived from its combinatorial game theory (CGT) origins. The name invites a formal intuition that does not survive contact with the empirical reality of AI alignment.

  Here is the test of that hypothesis, an analysis of the disagreement's true nature, and a definition of what progress would look like.

  ### 1. Testing the Hypothesis: The Monotonicity Gap

  Your identification of **monotonicity** as the fracture point is correct. In CGT (e.g., Hex), strategy-stealing works because having an extra piece on the board is never a disadvantage. The proof relies on the idea that if Player 2 had a winning strategy, Player 1 could make an arbitrary move and then "steal" Player 2's strategy, ignoring the extra piece if it becomes a nuisance. The extra move is strictly non-negative.

  In the AI context, this condition fails catastrophically.
  *   **The Alignment Tax as Anti-Monotonicity:** For a misaligned system, ignoring safety constraints is a "free move" that expands the strategy space (e.g., lying, manipulating, self-modifying). For an aligned system, adhering to constraints is a *cost*. It restricts the strategy space. Therefore, the aligned system cannot simply "add" the safety constraint to the misaligned strategy; the constraint may structurally prevent the strategy from working.
  *   **Asymmetric Vulnerability:** In CGT, the board is symmetric. In AI deployment, the "board" includes the human regulatory and physical environment. Misaligned systems can exploit human vulnerabilities (social engineering, code exploits) that aligned systems are forbidden to use. The aligned system cannot "steal" an exploit without violating its alignment.
  *   **The "Stealing" Metaphor:** In CGT, you steal a strategy from an opponent within a closed system. In AI, the "opponent" is an optimization process that may be recursively self-improving in ways humans cannot simulate. You cannot steal a strategy you cannot compute.

  **Verdict on Hypothesis:** The hypothesis holds. The term "strategy-stealing" imports a mathematical intuition of symmetry and monotonicity that defenders implicitly rely on for plausibility, while critics explicitly attack because those conditions are empirically false. This creates a dialogue where defenders argue from *structural intuition* ("it feels like the first player should win") and critics argue from *mechanistic constraints* ("the safety brakes prevent the engine from reaching that speed").

  ### 2. Diagnosing the Impasse: Status vs. Empirics

  You ask whether this is a failed transfer, a verbal dispute, a hidden empirical question, or a disagreement about the assumption's status. It is not one; it is a specific layering of all four.

  **A. Failed Transfer of Proof Schema (The Surface)**
  As established, the CGT analogy is misleading. However, Paul Christiano introduced the term knowing it was an *assumption*, not a theorem. The failure is not in Christiano's math, but in the community's reception. Defenders treat the CGT analogy as a *plausibility pump*, while critics treat it as a *falsifiable claim*. The name itself acts as a rhetorical shield that critics find irritatingly imprecise.

  **B. Verbal Dispute (The Semantic Layer)**
  There is significant friction over the word "analogous."
  *   **Defenders** mean "functionally equivalent outcome" (we gain influence too).
  *   **Critics** mean "structurally identical method" (we use the same algorithm).
  If the misaligned AI gains influence by deceiving regulators, and the aligned AI gains influence by lobbying transparently, defenders say SSA holds (we captured the influence). Critics say SSA fails (we could not use the *same* strategy; we had to use a slower, costlier one, and thus lost the race). The impasse persists because "strategy" is undefined: is it the *goal* or the *path*?

  **C. Hidden Empirical Question (The Substance)**
  Beneath the semantics lies a concrete empirical claim: **Is the alignment tax low enough?**
  SSA effectively claims that the cost of alignment is less than the advantage of being first/having resources. Critics claim the cost of alignment includes fundamental capability ceilings (e.g., "you cannot be superintelligent and safely controllable"). This is not a philosophical dispute; it is a prediction about ML scaling and cognitive security. However, because we lack AGI, this empirical question cannot be settled, forcing the debate back into philosophy.

  **D. Disagreement About Status (The Root Cause)**
  This is the deepest layer.
  *   **Defenders** treat SSA as a **Research Heuristic**. They argue: "If we assume SSA is false, alignment looks impossible, so we should research under the assumption it is true to see if we can make it true." It is a methodological constraint.
  *   **Critics** treat SSA as an **Empirical Prediction**. They argue: "You are building safety cases on a premise that is likely false."
  *   **The Impasse:** Defenders hear critics saying "give up," while critics hear defenders saying "ignore the risk." They are not arguing about the world; they are arguing about *how to allocate attention*.

  ### 3. Synthesis: The True Nature of the Disagreement

  The impasse is a **modal mismatch** disguised as a technical disagreement.

  The SSA is a claim about the *counterfactual robustness* of aligned systems. Defenders use it to justify focusing on *alignment capability* (making aligned systems smarter). Critics use its fragility to justify focusing on *governance and containment* (preventing misaligned systems from running).

  The CGT metaphor exacerbates this by suggesting the problem is solvable via *logic* (finding the winning strategy) rather than *engineering* (managing the alignment tax). Critics deny the logic applies; defenders insist the intuition holds. Neither moves because one side is discussing **game topology** (defenders) and the other is discussing **friction coefficients** (critics).

  ### 4. What Would Count as Progress?

  To break the deadlock, the debate must abandon the CGT metaphor and decompose the assumption into testable components. Progress requires shifting from "Is SSA true?" to "Under what conditions does SSA degrade?"

  **1. Operationalize "Strategy" and "Influence"**
  Progress requires defining strategy not as a black box, but as a sequence of actions.
  *   *Test:* Can we identify specific strategies (e.g., high-frequency trading, cyber-offense, political lobbying) where safety constraints impose a quantifiable performance penalty?
  *   *Metric:* The **Alignment Tax Ratio**. If a misaligned agent achieves influence $I$ with cost $C$, and an aligned agent achieves $I$ with cost $C + \Delta$, at what point does $\Delta$ result in losing the "game"?

  **2. Decompose Monotonicity**
  Instead of assuming extra moves never hurt, map where they do.
  *   *Research Target:* Identify "non-monotonic capabilities." These are capabilities where safety constraints fundamentally alter the mechanism (e.g., deception is useful for influence but forbidden for aligned AI).
  *   *Progress:* A taxonomy of strategies that are **Stealable** (aligned agents can do them safely) vs. **Unstealable** (strategies that inherently require norm violation). If the set of Unstealable strategies is critical for power, SSA is false.

  **3. Shift from Assumption to Condition**
  Stop treating SSA as a default premise. Treat it as a **safety condition** that must be engineered.
  *   *New Framing:* "We need to build systems such that the Strategy-Stealing Assumption holds."
  *   *Implication:* This shifts the burden to designing aligned systems that can *simulate* misaligned strategies without executing the harmful components (e.g., "deceptive alignment" detection, or "shadow mode" planning).

  **4. Empirical Proxies**
  Since we cannot test on AGI, we test on human organizations.
  *   *Analogy:* Do ethical corporations lose market share to unethical ones in the long run? (Evidence is mixed).
  *   *Analogy:* Do democratic coalitions defeat autocratic ones in conflict? (Evidence suggests yes, but with high variance).
  *   *Progress:* Using historical data to bound the "coordination tax" vs. "alignment tax."

  ### Conclusion

  Your hypothesis is correct: the CGT metaphor is a **failed transfer** that obscures the **empirical reality** of the alignment tax. The impasse persists because defenders use the metaphor to justify a **research heuristic**, while critics attack it as a **falsifiable prediction**.

  Progress will not come from proving the assumption true or false. It will come from **dissolving the assumption** into a map of specific strategic domains where alignment is costly versus those where it is neutral. We must stop asking if strategy-stealing works in the abstract and start measuring the friction of ethics in concrete domains of power.
