  2.  **Analyze the Strategy-Stealing Assumption (SSA) vs. Combinatorial Game Theory (CGT):**

      *   *CGT Context:* In games like Hex, strategy stealing proves the first player has a winning strategy. It assumes symmetry (both players have same moves), no draws, and crucially, that having an extra piece on the board is never a disadvantage (monotonicity).
