      *   *Wait, I need to address the "Karma isn't Utility" point.*
      *   *Best Case:* **The Accidental Death vs. Intentional Killing.** Consequentialism: Dead body is the bad state. Buddhism: One is karma-heavy, one is not. This isolates *Intention* from *Outcome*.
      *   *Okay, I'll propose **The Case of the Falling Rock**.*
