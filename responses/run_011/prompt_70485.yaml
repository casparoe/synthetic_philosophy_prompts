      *   *Selected Case:* **The Merchant and the Tax Collector.** (A layperson scenario). Or **Hiding a Refugee.** Let's go with **Hiding a Refugee (Lying to protect life).** It forces a clash between Precept (No Lying) and Outcome (Life Saved).
