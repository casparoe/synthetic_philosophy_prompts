      *Okay, I'll propose **The Case of the Falling Brick**.*
      *Scenario:* A brick falls.
      *1. You push it to kill an enemy. (Bad Kamma, Bad Outcome)*
      *2. You push it to save a child, but it kills the enemy. (Good Intention, Bad Outcome)*
      *3. You push it to kill an enemy, but it misses and saves a child. (Bad Intention, Good Outcome)*
      *Consequentialism judges 2 and 3 by outcomes. Buddhism judges by Intention (Cetana).*
      *This is the cleanest wedge.*

      *Wait, one more check:* The user wants to teach "Is Buddhist ethics consequentialist?"
      *If I use the Brick case, it shows it's *not* act-consequentialist.
      *Does it show it's *rule*-consequentialist?
      *The user's intuition about Karma is key: "Karma's automatic bookkeeping... isn't a rule you follow because you did the arithmetic."
      *The Brick case supports this.
