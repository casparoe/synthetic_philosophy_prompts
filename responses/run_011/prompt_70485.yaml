answer: |-
  Here is the architecture for the session. It is designed to move the room from a semantic disagreement ("what do we mean by consequentialism?") to a structural one ("what is the locus of ethical value?").

  ### I. The Ordering: Validation and the Missing Wedge

  Your intuition on the ordering is correct, but it requires a critical intermediate step.

  1.  **Step 1: Decouple "Outcome-Sensitive" from "Consequentialist."**
      *   **Why:** Your audience equates "caring about results" with consequentialism. You must establish that while Buddhism is *teleological* (aimed at the end of *dukkha*), it is not necessarily *consequentialist* (where the rightness of the act is determined *solely* by the state of affairs it produces).
      *   **The Dependency:** If you skip this, every argument you make about karma will be heard as "long-term utility calculation."

  2.  **Step 2: The Wedge of *Cetana* (Intention).**
      *   **Why:** This is the step you didn't explicitly name, but it is the load-bearing wall. Consequentialism (act or rule) evaluates the *act* based on the *outcome*. Buddhism evaluates the *kamma* based on the *intention*.
      *   **The Dependency:** You cannot explain why karma isn't utility until you show that two acts with identical outcomes can have opposite karmic values.

  3.  **Step 3: Karma as Causal Law vs. Utility as Aggregation.**
      *   **Why:** Now you can make your point about "automatic bookkeeping." Utility is an aggregation of welfare across sentient beings. Karma is a causal law of psychology and rebirth specific to the agent.
      *   **The Sand:** You are building on sand if you imply karma is a "punishment system." It must be framed as *physics*: touching fire burns, regardless of whether you intended to get warm or burn yourself. The "burn" isn't a penalty; it's the nature of the contact.

  **Verdict:** Your ordering is right, but insert *Cetana* between definition and karma. Without *Cetana*, karma looks like a delayed utility score. With *Cetana*, it becomes a quality of mind that *causes* future states, which is structurally distinct from maximizing future states.

  ### II. The Single Case: Reject the Captain

  Do not use the Mahāyāna story of the compassionate ship captain who kills the bandit.

  *   **Why:** It is not load-bearing for *ethics*; it is load-bearing for *soteriology*. That story relies on *upāya* (skillful means) and the Bodhisattva's unique capacity to absorb negative karma without it ripening as suffering. It smuggles in the idea that an enlightened being operates outside standard karmic causality.
  *   **The Risk:** EA-adjacent practitioners will seize on this as "The Exception that Proves the Rule." They will argue, "So, if you are wise enough to calculate the net utility, you can break the precepts." This turns the session into a debate about spiritual authority rather than ethical structure.
  *   **The Replacement Case: "The Two Doctors."**
      *   **Scenario:**
          *   **Doctor A** prescribes a medicine intending to cure the patient. The patient is cured.
          *   **Doctor B** prescribes the *same* medicine intending to kill the patient (believing it is poison). The patient is cured (the medicine was actually beneficial).
      *   **The Question:** "In terms of Buddhist ethics, have these two doctors performed the same ethical act?"
      *   **Why this works:**
          *   **Outcome:** Identical (Patient lives).
          *   **Consequentialist Verdict:** Both acts are good (or at least, B is not bad).
          *   **Buddhist Verdict:** A is *kusala* (skillful/meritorious); B is *akusala* (unskillful/demeritorious).
          *   **The Lesson:** The ethical weight rests on the *state of the agent* at the moment of volition, not the *state of the world* at the moment of result. This breaks the consequentialist identification of Right Action with Good Outcome.

  ### III. Mapping Misconceptions: Interception Points

  Do not wait for these to arise; head them off at the specific structural point where they become tempting.

  1.  **"The First Noble Truth is Negative Utilitarianism."**
      *   **The Move:** They will argue that since the goal is the end of suffering, we must minimize suffering globally.
      *   **Interception Point:** **Step 1 (Definitions).**
      *   **The Block:** Distinguish between *dukkha* (unsatisfactoriness/clinging) and *pain/suffering*. Negative utilitarianism seeks to eliminate pain. Buddhism seeks to eliminate the *reaction* to pain. You can have a world with less pain but more clinging (e.g., a pleasure dome). That is not the Buddhist goal.

  2.  **"Anattā is Really Just Parfit."**
      *   **The Move:** "If there is no self, then the boundary between 'my' karma and 'your' suffering is illusory. Therefore, we should just maximize welfare across all beings."
      *   **Interception Point:** **Step 3 (Karma vs. Utility).**
      *   **The Block:** Acknowledge the resonance, then pivot. Parfit uses *anattā* to dissolve the agent for the sake of *aggregation*. Buddhism uses *anattā* to dissolve the agent for the sake of *responsibility*. In Buddhism, "no self" does not mean "no causal continuity." I still experience the ripening of *my* intentions. The lack of a metaphysical self does not create a metaphysical merger of karmic accounts.

  3.  **"Skillful Means Means the Precepts are Heuristics."**
      *   **The Move:** "The precepts are just rules of thumb for maximizing good. If lying saves a life, the heuristic is overridden."
      *   **Interception Point:** **During "The Two Doctors" Case.**
      *   **The Block:** Reframe the Precepts. They are not traffic laws (external rules to avoid punishment); they are training rules (*sikkhāpada*) for the mind. Lying to save a life might be the "kinder" thing to do socially, but it still cultivates a mind capable of deception. The ethical question is not "Was the outcome good?" but "Did this act cultivate a mind capable of liberation?"

  4.  **Trolley Problems.**
      *   **The Move:** "Who do you save? The monk or the scientist?"
      *   **Interception Point:** **Pre-emptively in the Introduction.**
      *   **The Block:** State clearly: "Buddhist ethics is not primarily about choosing between victims. It is about choosing what kind of mind you will inhabit while the tragedy unfolds." Refuse to engage in body-count arithmetic.

  ### IV. The Parfit Projection: Honesty Clause

  You must explicitly name your own bias. Mid-session, after defining consequentialism, say something like:

  > "I came to this tradition through Derek Parfit. I want to be honest with you: Parfit reads ethics as a problem of *impersonal optimization*. He wants to remove the 'agent' so we can maximize the good without egoic interference.
  >
  > "Buddhism removes the 'agent' for a different reason: not to optimize the world, but to stop the *grasping* that creates *dukkha*. If we treat Buddhist ethics as a tool for world-optimization, we are projecting a Western utilitarian goal onto a soteriological path. We are using a scalpel to dig a well."

  This gives them permission to see the distinction without feeling they must abandon their EA frameworks entirely. It frames the session as "comparing maps" rather than "correcting errors."

  ### V. The Diagnostic Question

  Do not ask, "Do you agree?" Ask a question that forces them to apply the *Cetana* wedge.

  > **"If you could press a button that guaranteed a world of maximum happiness for all beings, but pressing it required you to cultivate a state of mind rooted in delusion (e.g., believing you are a god), would a Buddhist call that a moral act?"**

  *   **The "Agreed" Answer:** "No, because delusion is unskillful."
  *   **The "Followed the Argument" Answer:** "No, because the ethical value lies in the quality of the intention, not the resulting state of the world. An act rooted in delusion generates *akusala* kamma regardless of the outcome."
  *   **Why this works:** It forces a choice between *Outcome Maximization* (Consequentialism) and *Agent Purification* (Buddhism). If they hesitate, they haven't grasped the *Cetana* wedge.

  ### VI. What to Decline

  Openly state what you are **not** doing. This protects your authority by defining boundaries.

  1.  **No Scholarly Taxonomy:** "I will not be distinguishing between Theravāda, Yogācāra, or Madhyamaka ethical nuances. We are looking for the structural skeleton common to the tradition."
  2.  **No Settled Verdict:** "Scholars debate this. Some say Buddhism is virtue ethics, some say rule-consequentialism. I am not here to report a consensus; I am here to give you the tools to test the claim yourself."
  3.  **No Soteriological Mechanics:** "We will not discuss how karma ripens across lifetimes. We are treating karma as a psychological causal law observable in the present moment."

  ### Summary of Flow

  1.  **Intro (10 min):** Define Consequentialism (technical) vs. Outcome-Sensitivity (colloquial). State the Parfit projection warning.
  2.  **The Wedge (20 min):** Introduce *Cetana*. Use **The Two Doctors** case. Establish that identical outcomes $\neq$ identical kamma.
  3.  **The Mechanism (30 min):** Karma as Physics vs. Utility as Math. Discuss the Precepts as Training Rules vs. Heuristics. Head off the "Negative Utilitarianism" and "Trolley" misconceptions here.
  4.  **The Anattā Check (15 min):** Address the "No Self = No Boundaries" argument. Distinguish aggregation from causality.
  5.  **Closing (15 min):** The Diagnostic Question. Open floor for application to practice. Declare the exclusions (scholars/sectarianism).

  This architecture respects their intelligence, utilizes their EA background as a foil rather than an enemy, and prevents the session from devolving into a "which philosophy is better" contest. It keeps the focus on the *structure of decision-making*.
