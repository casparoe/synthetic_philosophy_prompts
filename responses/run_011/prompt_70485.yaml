      *   *Assessment:* This is fundamentally correct. If they define consequentialism as "caring about results," Buddhism *is* consequentialist (dukkha is the problem, nibbana is the result). But philosophical consequentialism (act vs. rule, maximization, agent-neutrality) is specific.
      *   *Dependency:* You can't discuss karma's mechanism until they understand what a "consequentialist justification" actually looks like (i.e., the *right* action is determined *solely* by the outcome state).
      *   *Sand:* The sand lies in assuming "karma" is a teleological goal rather than a causal law. If karma is just cause-and-effect, following precepts isn't "maximizing good," it's "avoiding fire." That's deontological in structure, even if the "punishment" is naturalistic.
