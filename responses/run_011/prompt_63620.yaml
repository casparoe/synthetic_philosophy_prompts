      Discuss the theory of belief: It requires belief to be quantifiable and revealed by action (behaviorism). It doesn't require internal confidence, just willingness to bet.
      Discuss the theory of value: Clubs define metrics. This assumes the metric captures the good. This is compatible with many views but risky.
      Discuss the threshold: Assumes symmetric error costs. This is likely an administrative convenience, not a deep theory.
      Discuss the two-track: Assumes funding is epistemic (will it work?) not normative (is it good?). This is the core tension.
      Discuss settlement: The denied claim settlement is inconsistent with the human panel.
