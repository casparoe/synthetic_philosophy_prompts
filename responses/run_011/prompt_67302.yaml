      *   Yes, the Sailor is the outlier. Dennett usually associates Gregorian minds with *tools* that reshape cognition (literacy, numeracy). Oral tradition is often considered a bridge. By classifying her as Gregorian, the sister is prioritizing the *transmission of wisdom* over the *medium of storage*. This is the weak joint because it blurs the line between a very smart Popperian (oral memory) and a Gregorian.

