prompt: |-
  I serve on the board of a small private foundation — roughly $40 million in assets, perpetual in duration, no debt, tax-exempt, and a spending policy of 4.5 percent of a trailing three-year average plus a cost-of-living adjustment. One of my fellow trustees, who ran a systematic equity strategy for two decades before retiring, has circulated a proposal to rewrite our investment policy statement around what he calls geometric rationality. Two board members are enthusiastic, one is hostile, and I have been asked to bring a written opinion to next month's meeting, so I would like a memo I can circulate and actually defend.

  The proposal runs roughly as follows. Expected-value maximization is the wrong decision rule for anyone who makes many decisions in sequence, because it averages over outcomes the decision-maker will never live through: maximizing the expected value of terminal wealth can license bets that all but guarantee ruin. The right objective is instead the long-run compounded growth rate of the fund, which, under conditions he describes as well understood, is maximized by a Kelly-style growth-optimal allocation of capital. He adds that mean-variance optimization treats volatility as if it were risk, when for a fund like ours the only thing that genuinely matters is falling permanently behind the compounding path of the growth-optimal portfolio; that a perpetual foundation is precisely the case where the long-run argument bites, since we never have to cash out; and that the usual hand-wringing about drawdowns rests on confusing an average across a hypothetical crowd of simultaneous investors with an average across time for the one investor who has to endure the actual sequence. On this basis he wants us to move from our current 60/40 policy allocation to a growth-optimal sleeve of leveraged broad equity, sized by a formula he has supplied, with a leverage cap of 1.5x and no rebalancing more frequent than annual.

  Please draft the memo, and have it take a clear position — adopt, reject, or adopt with specific amendments — in a form the board could vote on. If you recommend conditions, make them concrete rather than gestural: numbers, caps, sequencing, and a review horizon. It should engage the proposal at its strongest rather than dismiss it, since I do find the ensemble-versus-time-average point genuinely persuasive and I want to know whether it licenses what he wants to do with it; and it should squarely address the objection my co-trustee who teaches statistics keeps repeating, that this is all just logarithmic utility wearing a disguise and that the argument is doing no real work. Be explicit about what the growth-optimal result requires: what must be known rather than estimated, what the horizon has to look like, what happens to the argument once expected returns have to be forecast, and what our mandatory annual spending does to a sizing rule derived for a fund that never withdraws. Where the proposal's defenders would themselves concede a point, say so. Finally, I would like the memo to distinguish clearly between what is settled among people who work on these questions, what is merely a defensible modeling convention, and what is live controversy — I do not want to circulate a document that states a contested normative claim as though it were the professional consensus, and I would also like to be told plainly if my own enthusiasm for the time-average point is giving it more weight than it can bear.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small private foundation ($40M assets, perpetual, tax-exempt).
      *   **Task:** Draft a memo for the board regarding a proposal to rewrite the Investment Policy Statement (IPS) based on "geometric rationality" (Kelly criterion/growth-optimal investing).
      *   **Current State:** 60/40 portfolio, 4.5% spending rule (3-year avg + COLA).
      *   **Proposal:** Shift to leveraged broad equity (up to 1.5x), annual rebalancing, maximizing long-run compounded growth rate.
      *   **Board Dynamics:** One enthusiastic trustee (ex-quant), one hostile, one statistics professor (skeptic about log utility), plus the user (undecided but intrigued by the time-average argument).
      *   **Requirements:**
          *   Take a clear position (Adopt, Reject, or Adopt with Amendments).
          *   Engage with the strongest version of the argument (ergodicity/time-average vs. ensemble-average).
          *   Address the statistics professor's objection (log utility disguise).
          *   Be explicit about assumptions (known parameters vs. estimates, horizon, spending impact).
          *   Distinguish between settled science, modeling conventions, and live controversy.
          *   Provide concrete conditions/numbers if recommending adoption with amendments.
          *   Tone: Professional, defensible, nuanced, suitable for board voting.

  2.  **Deconstruct the "Geometric Rationality" Argument:**
      *   *Core Claim:* Maximize expected value (arithmetic mean) leads to ruin in repeated bets. Maximize geometric mean (Kelly) maximizes long-term wealth.
      *   *Ergodicity Point:* Ensemble average (many parallel universes) $\neq$ Time average (one path through time). For a perpetual entity, time average matters more.
      *   *Critique (Statistics Professor):* Maximizing geometric mean is mathematically equivalent to maximizing expected logarithmic utility. It's not a new paradigm, just a specific utility function.
      *   *Practical Risks:* Parameter uncertainty (expected returns are hard to estimate), leverage risk (margin calls, volatility drag), spending needs (withdrawals break the compounding assumption).

  3.  **Evaluate the Proposal against Foundation Realities:**
      *   *Spending:* The foundation *must* spend 4.5% + COLA. A pure Kelly strategy assumes reinvestment of all gains. Withdrawals act as a drag and increase ruin risk, especially if leverage is involved during drawdowns.
      *   *Perpetuity:* "Perpetual" doesn't mean "infinite horizon" in practice. Board members change, donors care about reputation, and a 50% drawdown might force a change in mission even if math says "hold."
      *   *Leverage:* 1.5x on equities is significant. In a bad decade, this could deplete the real value of the endowment below the spending requirement.
      *   *Parameter Risk:* Kelly requires knowing the true edge and odds. In finance, these are estimated with huge error bars. "Full Kelly" is often too aggressive; "Fractional Kelly" is standard practice.

  4.  **Determine the Recommendation:**
      *   *Adopt?* Too risky. Ignores spending needs and parameter uncertainty.
      *   *Reject?* Too dismissive. The ergodicity point is valid, and 60/40 is arbitrary.
      *   *Adopt with Amendments?* Best path. Acknowledge the theoretical insight but constrain it for practical fiduciary duty.
      *   *Specific Amendments:* Fractional Kelly (e.g., half-Kelly), lower leverage cap (1.2x vs 1.5x), spending stress test, volatility constraint, explicit review horizon.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Clear recommendation (Adopt with Amendments).
      *   **Context:** Acknowledge the proposal and the board's division.
      *   **Theoretical Engagement (The "Meat"):**
          *   Validate the ergodicity argument (it's not nonsense).
          *   Address the Log Utility objection (it's mathematically true but misses the behavioral/fiduciary point).
          *   Highlight the "Known vs. Estimated" problem (Kelly breaks with estimation error).
          *   Highlight the Spending Constraint (withdrawals change the math).
      *   **Risk Assessment:** Leverage, drawdowns, mission risk.
      *   **Recommendation/Conditions:** Concrete numbers.
      *   **Classification of Claims:** Settled vs. Controversial (as requested).
      *   **Conclusion:** Final plea for prudence.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did I address the statistics professor? *Yes, need to explicitly state that Log Utility = Geometric Mean maximization, but explain why the *framing* matters for fiduciaries.*
      *   *Check:* Did I address the spending rule? *Yes, this is the killer argument against pure Kelly.*
      *   *Check:* Is the tone right? *Needs to be respectful to the proponent but firm on fiduciary duty.*
      *   *Check:* Did I distinguish settled vs. controversial? *Need a specific section for this.*
      *   *Check:* Is the recommendation vote-ready? *Yes, make the conditions specific.*

  7.  **Drafting the Content (Iterative refinement):**
      *   *Ergodicity:* Use the terms "ensemble average" vs. "time average" correctly. Acknowledge Ole Peters' work implicitly.
      *   *Kelly:* Explain that "Full Kelly" is volatile. Suggest "Half-Kelly."
      *   *Leverage:* 1.5x is high for a foundation that *spends*. Suggest capping lower or tying to volatility.
      *   *Spending:* The 4.5% payout is a hard constraint. If the portfolio drops 30%, 4.5% of the trailing average might still be too high relative to current assets, forcing asset sales at lows.
      *   *Classification:*
          *   Settled: Math of geometric vs. arithmetic mean.
          *   Convention: Using historical volatility as a proxy for future risk.
          *   Controversial: Applying infinite horizon theory to finite spending entities.

  8.  **Final Review against Constraints:**
      *   $40M assets mentioned? *Yes.*
      *   4.5% spending rule addressed? *Yes.*
      *   Leverage cap addressed? *Yes.*
      *   Statistics professor's point addressed? *Yes.*
      *   Clear vote recommendation? *Yes.*

  9.  **Final Polish:** Ensure the voice sounds like a knowledgeable board member, not an academic paper, but rigorous enough to withstand scrutiny. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm rejecting the *idea* of growth optimization, just the *specific implementation* proposed. The memo should validate the proponent's intelligence while protecting the foundation from tail risk. I also need to make sure I explicitly answer the user's worry: "is my enthusiasm for the time-average point giving it more weight than it can bear?" I should answer this in the "Classification of Claims" section.

  *(Refining the Recommendation)*: Instead of just "Half-Kelly," which is hard to calculate in an IPS, I should recommend a specific volatility target or a leverage cap lower than 1.5x, combined with a spending stress test. Let's go with a leverage cap of 1.25x and a "Fractional Kelly" approach (e.g., 50% of the calculated optimal leverage). Actually, for an IPS, concrete caps are better than formulas. Let's suggest 1.2x max leverage and a mandatory drawdown trigger.

