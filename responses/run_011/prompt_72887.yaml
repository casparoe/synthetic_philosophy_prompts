answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Investment Policy Statement Revision (Geometric Rationality Framework)

  ### Executive Summary

  Trustee [Proponent's Name] has proposed a significant shift in our Investment Policy Statement (IPS), moving from a traditional 60/40 allocation to a leveraged equity strategy sized according to "geometric rationality" (specifically, the Kelly criterion). The core argument is that for a perpetual entity, maximizing the time-average growth rate is superior to maximizing expected arithmetic returns, as the latter ignores the risk of ruin inherent in sequential decision-making.

  After reviewing the mathematical underpinnings, consulting external literature on ergodicity economics, and stress-testing the proposal against our specific liquidity constraints, **I recommend we adopt the philosophical framework of growth optimization but reject the specific implementation as currently drafted.**

  Instead, I propose we **adopt the policy with specific amendments** designed to account for parameter uncertainty, our mandatory spending rate, and fiduciary risk tolerance. The proposal correctly identifies a flaw in standard mean-variance thinking but overestimates the precision with which we can estimate market parameters and underestimates the impact of our 4.5% spending obligation on compounding.

  **Motion for Vote:**
  Move to amend the Investment Policy Statement to incorporate a growth-optimal framework, subject to the following constraints:
  1.  **Leverage Cap:** Reduced from 1.5x to 1.2x gross exposure.
  2.  **Sizing Rule:** Adoption of "Half-Kelly" sizing rather than full growth-optimal leverage.
  3.  **Spending Stress Test:** Mandatory annual simulation ensuring the portfolio survives a 40% drawdown without breaching the spending policy.
  4.  **Review Horizon:** A three-year sunset clause requiring re-approval of the leverage sleeve.

  ---

  ### 1. Theoretical Engagement: Where the Proposal is Correct

  Trustee [Proponent's Name] is correct on the fundamental mathematics of ergodicity. In systems where outcomes compound over time (like an endowment), the "ensemble average" (the average outcome across many hypothetical parallel universes) diverges from the "time average" (the single path we will actually experience).

  Standard Mean-Variance Optimization (MVO) effectively maximizes arithmetic returns. If you maximize arithmetic returns in a volatile environment without regard for geometric compounding, you invite "volatility drag." A portfolio that gains 50% and then loses 50% is down 25%, not flat. Over an infinite horizon, the geometric mean dominates. Therefore, for a perpetual foundation that never cashes out, maximizing the geometric growth rate is indeed the mathematically coherent objective for preserving real purchasing power.

  Trustee [Statistician's Name] is also correct that maximizing geometric growth is mathematically equivalent to maximizing expected logarithmic utility. However, dismissing the argument as "just log utility" misses the pedagogical value. Framing this as an ergodicity problem highlights *why* log utility is appropriate for us: not because of abstract risk preference, but because we are a single entity traversing time, not an ensemble of investors.

  **Verdict:** The theoretical pivot from arithmetic to geometric maximization is sound for our duration. My enthusiasm for this point is not misplaced; it is a robust correction to standard industry practice. However, theory does not equal policy.

  ### 2. The Fiduciary Gap: Three Fatal Assumptions

  While the objective (maximize geometric growth) is correct, the proposed implementation relies on three assumptions that do not hold for a $40 million private foundation.

  #### A. Known Parameters vs. Estimated Parameters
  The Kelly criterion requires precise knowledge of the edge (expected excess return) and the odds (variance of returns). In a casino, these are known. In equity markets, they are estimated with massive error bars.
  *   **The Risk:** "Full Kelly" is notoriously aggressive. If you overestimate expected returns by even 1%, Full Kelly leverage can double the probability of ruin.
  *   **Consensus:** Among practitioners who use growth-optimal strategies (e.g., endowment management, quantitative hedge funds), "Fractional Kelly" (typically 50% of the calculated optimal leverage) is the standard convention to buffer against estimation error. The proposal's use of Full Kelly sizing is an outlier in professional practice.

  #### B. The Spending Constraint
  The Kelly criterion assumes reinvestment of all proceeds. Our foundation is not a closed system; we withdraw 4.5% of the trailing three-year average plus COLA annually.
  *   **The Risk:** Withdrawals act as a drag on compounding. In a drawdown scenario, if asset values drop but the spending rule (based on a trailing average) keeps payout obligations high, we are forced to sell leveraged assets at depressed prices to meet cash flow needs. This creates a "death spiral" risk that pure growth theory ignores.
  *   **Reality:** A 1.5x leveraged portfolio experiencing a 2008-style drawdown (-50% equity) would see asset values drop roughly 75%. Even with a trailing average smoothing, our spending rate relative to *current* assets would spike, potentially forcing deleveraging at the bottom.

  #### C. The Definition of "Perpetual"
  The proposal argues we "never have to cash out." This is theoretically true but operationally false.
  *   **The Risk:** A perpetual foundation requires board continuity and donor confidence. A drawdown of 60% in real terms (plausible with 1.5x leverage) would likely force a mission contraction or a board intervention, effectively violating the "infinite horizon" assumption. We cannot behave like an algorithm that can endure a 90% drawdown provided it eventually recovers in year 40.

  ### 3. Classification of Claims

  To ensure the board distinguishes between mathematical fact and policy choice, I have categorized the claims in the proposal:

  | Claim | Classification | Context |
  | :--- | :--- | :--- |
  | **Geometric mean > Arithmetic mean for compounding** | **Settled Science** | Mathematically provable. Volatility drag is real. |
  | **Ergodicity breaks standard expected value theory** | **Settled Science** | Accepted in statistical physics and increasingly in economics (Peters, Gell-Mann). |
  | **Log Utility is equivalent to Geometric Maximization** | **Settled Science** | Trustee [Statistician]'s point is mathematically correct. |
  | **Historical Volatility = Future Risk** | **Modeling Convention** | Standard practice, but known to fail during regime changes. |
  | **Full Kelly is appropriate for endowments** | **Live Controversy** | Most endowment literature suggests Fractional Kelly due to estimation risk. |
  | **Spending rules do not impact optimal leverage** | **Contested/False** | Withdrawal rates materially alter the ruin probability in leveraged portfolios. |
  | **1.5x Leverage is "safe" for perpetuity** | **Normative Claim** | This is a risk tolerance decision, not a mathematical derivation. |

  ### 4. Specific Recommendations and Amendments

  We should not reject the insight, but we must cage it. The following amendments convert a theoretical ideal into a fiduciary policy.

  **1. Leverage Cap: 1.2x (Down from 1.5x)**
  *   *Rationale:* 1.5x leverage on broad equity implies a potential drawdown of 75% in a severe crisis. At $40M, a 75% drop brings us to $10M. Our spending policy would likely become unsustainable at that level, forcing mission cuts. 1.2x limits the maximum theoretical equity drawdown to roughly 60%, which is painful but survivable without structural breach.

  **2. Sizing Rule: 50% of Calculated Growth-Optimal Leverage**
  *   *Rationale:* This adopts the "Half-Kelly" convention. It reduces volatility by roughly 50% while retaining roughly 75% of the expected growth rate. This is the industry-standard buffer for parameter uncertainty. If the formula says 2.0x leverage is optimal, we deploy 1.0x.

  **3. Mandatory Spending Stress Test**
  *   *Rationale:* Before any annual rebalancing that increases leverage, the Investment Committee must run a Monte Carlo simulation incorporating our specific spending rule. The policy must certify that in the 5th percentile of outcomes, the foundation remains solvent and able to meet the 4.5% payout without selling into a margin call.

  **4. Three-Year Review Horizon**
  *   *Rationale:* This strategy relies on stable market regimes. We should not codify this permanently. The leverage sleeve sunsets in three years, requiring affirmative board vote to renew. This forces a re-evaluation of whether the "geometric" advantage has materialized or if volatility drag from costs and taxes has eroded it.

  ### 5. Addressing the Board's Divisions

  **To the Proponent:** Your intuition on ergodicity is correct, and you have successfully challenged the board to think beyond standard deviation as a risk measure. However, fiduciary duty requires us to plan for the world as it is (uncertain parameters, mandatory spending), not the world as the model assumes (known parameters, reinvestment). Fractional Kelly is not a rejection of your theory; it is the robust implementation of it.

  **To the Statistician:** You are right that this is log utility. But the *framing* matters. By treating this as an ergodicity problem, we avoid the subjective "risk tolerance" question and replace it with an objective "survival" constraint. The amendments I propose acknowledge your concern by treating the utility function as a constraint on ruin, not just an optimization target.

  **To the Hostile Trustee:** Your concern regarding drawdowns is valid. A 60/40 portfolio is a volatility dampener. However, 60/40 is arbitrary and may not protect us from inflation over 50 years. The proposed amendments (1.2x cap, stress tests) ensure that we do not take leverage risk without explicit verification that our spending policy can survive the downside.

  ### Conclusion

  The "geometric rationality" proposal is the most serious intellectual challenge to our IPS we have faced in a decade. It correctly identifies that for a perpetual foundation, avoiding ruin is more important than maximizing average returns.

  However, applying infinite-horizon mathematics to a finite-spending entity without adjustment is dangerous. By adopting the **Half-Kelly** convention, capping leverage at **1.2x**, and instituting a **spending stress test**, we can capture the benefits of growth optimization without gambling the foundation's operational viability on the precision of our return forecasts.

  I move we adopt the IPS revision subject to the amendments listed in Section 4.

  Respectfully submitted,

  [Your Name]
  Trustee, [Foundation Name]
