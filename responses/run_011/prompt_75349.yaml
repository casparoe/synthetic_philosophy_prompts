prompt: |-
  I am presenting a paper at a two-day workshop on the political economy of European decarbonisation, hosted by a policy school. The thesis is narrow and deliberately provocative: that Germany's decision to shut down an existing, licensed and largely amortised nuclear fleet was a substantially larger setback for European emissions reduction than the failure to commission new reactors, and that the underlying error was to conflate the defensible case against building new large reactors with the case against running the installed ones to the end of their technical life.

  My argument has three steps, and I want the objections aimed at them. First, on the counterfactual: in the hours that matter, the marginal generation that filled the gap was not solar and wind but lignite, hard coal and, before that, gas; the relevant comparison is therefore between a running fleet and what actually displaced it, not between a running fleet and a renewable buildout that was proceeding under separate subsidy legislation regardless. Second, on cost: a plant with sunk capital should be assessed on short-run operating cost and capacity factor, not on a levelised figure that imports the financing and construction risk of new builds at Vogtle, Flamanville or Hinkley Point. Third, on institutions: the liberalised German market had no mechanism for socialising the residual cost of lifetime extension, while the French model does; my claim is that this asymmetry, rather than any technical verdict, explains the divergence between the two countries, and that the divergence should not be read as evidence about the technology.

  The room is about twenty people. Most are energy economists working on cost-effectiveness and market design. Two are power-system modellers who run continental high-renewable scenarios and are used to defending them. One is a regulatory lawyer specialising in state aid. One is a planning analyst from a transmission system operator who works on redispatch and north–south congestion. There are graduate students. No nuclear engineers. Nobody is reflexively hostile, but several hold that the phase-out was at worst a rounding error because renewable deployment was never in fact crowded out.

  Prepare my question-period sheet. Give me the eight to ten objections this particular room will actually raise, in roughly the order I expect them, each phrased the way the person raising it would phrase it — the modeller's objection will not sound like the economist's, and the state-aid lawyer will attack a different step from either. For each: a two-to-three-minute reply, an explicit note on where that reply is soft or rests on a counterfactual I cannot observe, and what I should concede before I argue. Separately, name the objection I am hoping nobody asks, and explain why it is the one my argument can least absorb. Finally, identify the single reply that must land for the thesis to survive the session, and tell me plainly if I do not currently have one.

  Where an objection or reply turns on a quantity — French fleet availability in the year of the stress-corrosion outages, German power-sector emissions in the last years the plants ran and the years since, the gap in carbon intensity between the two systems, the order-of-magnitude cost of an extension retrofit — give me the figure you are confident in and flag the ones you are not. I do not want a bibliography or a source list; I want to know which numbers I can say out loud without being corrected from the floor.
reasoning: |-
  Here's a thinking process that leads to the suggested question-period sheet:

  1.  **Analyze the Request:**
      *   **Context:** Two-day workshop on political economy of European decarbonisation (policy school).
      *   **Audience:** ~20 people. Mostly energy economists (cost-effectiveness, market design), 2 power-system modellers (continental high-renewable scenarios), 1 regulatory lawyer (state aid), 1 TSO planning analyst (redispatch/congestion), grad students. No nuclear engineers. Not reflexively hostile, but some think the phase-out was a "rounding error."
      *   **Thesis:** Germany's shutdown of *existing* nuclear was a bigger setback than failing to build *new* nuclear. Error: conflating arguments against new builds with arguments against running existing ones to end of life.
      *   **Argument Steps:**
          1.  Counterfactual: Marginal replacement was coal/gas, not renewables (which were subsidized anyway).
          2.  Cost: Sunk capital means assess on short-run operating cost, not LCOE of new builds.
          3.  Institutions: German market lacked mechanism to socialize extension costs (unlike France); divergence is institutional, not technical.
      *   **Deliverables:**
          1.  8-10 objections (phrased by specific audience personas, in expected order).
          2.  For each: 2-3 min reply, note on softness/counterfactuals, what to concede.
          3.  The "Killer Question" (hope nobody asks) + why it's fatal.
          4.  The "Must-Land Reply" (critical for thesis survival) + assessment of current preparedness.
          5.  Specific numbers/figures (confident vs. uncertain).
          6.  *Constraint:* No bibliography/source list. Just actionable intel.

  2.  **Deconstruct the Audience & Thesis:**
      *   *Economists:* Will attack the counterfactual (merit order, carbon prices) and the cost definition (opportunity cost of capital, even if sunk).
      *   *Modellers:* Will attack the system integration view (nuclear inflexibility vs. renewables, grid constraints).
      *   *Lawyer:* Will attack the state aid/institutional argument (why was it illegal/impossible to subsidize extensions?).
      *   *TSO Analyst:* Will attack the grid stability/congestion argument (did nuclear actually help north-south flow?).
      *   *General:* Safety/politics (though prompt says focus on political economy/emissions).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Economist - Merit Order):* "You say coal replaced nuclear. But with high carbon prices, coal should have been pushed out. Did you account for the EU ETS price trajectory?"
      *   *Objection 2 (Modeller - System Flexibility):* "Nuclear is baseload. Renewables + storage + demand response is the actual counterfactual for a *system*, not just MWh-for-MWh."
      *   *Objection 3 (Economist - Opportunity Cost):* "Sunk cost fallacy. Capital could have been deployed elsewhere (retrofits, grids) if not tied up in maintaining old plants."
      *   *Objection 4 (TSO - Grid Congestion):* "Nuclear was in the South (Isar, Neckar). Load is in the South. Wind is in the North. Keeping nuclear running might have reduced redispatch costs, but did it actually lower emissions if it constrained wind integration?"
      *   *Objection 5 (Lawyer - State Aid):* "You say Germany lacked a mechanism. But why? Because extending life without tender violates EU competition law. You're asking for a subsidy without a legal vehicle."
      *   *Objection 6 (Economist - Carbon Price Endogeneity):* "If Germany kept nuclear, ETS prices would be lower, burning more coal elsewhere in Europe. Leakage effect."
      *   *Objection 7 (Modeller - Renewable Crowding In):* "The EEG surcharge was capped. Nuclear generation reduces the residual load for renewables, potentially cannibalizing their economics or requiring higher subsidies per unit."
      *   *Objection 8 (Political Economy/Grad Student):* "You treat the phase-out as an error. It was a political constraint (Fukushima). You can't optimize emissions ignoring the political feasibility constraint."
      *   *Objection 9 (Economist - Maintenance/Unplanned Outages):* "Look at France recently. Aging fleets have low availability. German plants might have suffered similar stress corrosion, negating the carbon benefit."
      *   *Objection 10 (TSO/Modeller - The 'Last Mile'):* "In a 90% renewable system, does keeping 6% nuclear actually delay the necessary infrastructure build-out for the final 10%?"

      *Refining for Tone:* Make them sound like the specific personas. The modeller talks about "residual load" and "curtailment." The lawyer talks about "undue distortion of competition." The economist talks about "marginal abatement cost."

  4.  **Developing Replies & Concessions:**
      *   Need to be punchy (2-3 mins spoken).
      *   Must identify the "soft spot" (counterfactual uncertainty).
      *   Must identify the "concession" (to show intellectual honesty).

  5.  **Identifying the "Killer Question":**
      *   What kills the thesis? The thesis relies on the *marginal* displacement being fossil. If the *systemic* effect of keeping nuclear old plants was to *slow down* renewable deployment (merit order effect reducing wholesale prices too much, making wind unprofitable without higher subsidies), then the emissions saving is illusory or temporary.
      *   *Better Killer:* The "Political Feasibility" constraint. If the phase-out was the *price* paid for the *Energiewende* (renewable expansion), then removing the phase-out might have collapsed the coalition supporting the renewables. This attacks the "separate subsidy legislation" claim in Step 1.

  6.  **Identifying the "Must-Land Reply":**
      *   The core thesis is about *existing* vs. *new*. The reply must distinguish the economics of amortized assets from greenfield. If I can't convince them that short-run marginal cost (SRMC) is the right metric for *existing* plants, the cost argument collapses.

  7.  **Selecting Numbers:**
      *   *Confident:* German nuclear share before phase-out (~13-15%), Emissions jump in 2021-2022 (coal resurgence), French availability factors (recent drops vs. historical).
      *   *Uncertain:* Exact marginal displacement (gas vs. coal mix), Cost of specific life-extension retrofits (very plant-specific).

  8.  **Review against Constraints:**
      *   8-10 objections? Yes.
      *   Specific personas? Yes.
      *   Reply/Softness/Concession structure? Yes.
      *   Killer Question? Yes.
      *   Must-Land Reply? Yes.
      *   Numbers flagged? Yes.
      *   No bibliography? Yes.

  9.  **Final Polish:** Ensure the tone is professional, strategic, and tailored to a policy school workshop (academic but policy-relevant). Ensure the distinction between "political economy" and "technical optimization" is clear, as that's the workshop theme. (Self-Correction: Make sure the Lawyer's objection hits the "institutional" step specifically).

  *(Self-Correction during drafting)*: I need to make sure I don't give the user numbers that are easily debunked. For example, French availability in 2022 was anomalously low due to stress corrosion. I must flag that. German emissions data is solid.

  *(Refining the "Killer Question")*: The strongest attack on the "political economy" thesis is that the nuclear phase-out *was* the political permit for the renewable expansion. If the user argues they were separate, the political scientists in the room (even if economists) will pounce. I will frame this as the "Grand Bargain" objection.

  *(Refining the "Must-Land Reply")*: It has to be the definition of cost. If the economists don't accept SRMC for existing assets, the argument that it was "cheap" fails.

  Let's assemble the document.cw
answer: |-
  # Question-Period Strategy Sheet
  **Workshop:** Political Economy of European Decarbonisation
  **Thesis:** Shutting down *existing* German nuclear was a larger emissions setback than failing to build *new* nuclear; error was conflating new-build economics with running-cost economics.

  ---

  ## Part 1: The Objections (8–10)
  *Ordered by likelihood and flow of debate.*

  ### 1. The Merit Order Economist (Early)
  **Objection:** "You're treating generation as a static stack. But if you keep 30 TWh of nuclear online, you suppress wholesale prices. That lowers the spark spread for gas and the margin for renewables. In a coupled market, doesn't keeping that nuclear online simply displace efficient CCGT elsewhere in the EU, or reduce the incentive for storage investment, rather than saving coal?"
  **Reply:** "That is the long-run equilibrium effect. My claim is about the *transitional* decade (2011–2022). In that window, the merit order shift was insufficient to crowd out coal because the carbon price was too low (<€30 for most of that period). The marginal unit displaced in Germany was explicitly lignite, confirmed by the emissions intensity spike post-2022. We are discussing a specific historical window where the carbon price signal was broken, not a theoretical optimal market."
  **Softness:** Relies on the assumption that the carbon price would not have risen faster if nuclear had remained (endogeneity of policy).
  **Concede:** "I concede that in a high-carbon-price world (>€80), the merit order effect changes. My argument holds for the specific policy regime we actually had, not the one we wished for."

  ### 2. The Power-System Modeller (Early)
  **Objection:** "You're comparing MWh-for-MWh. But nuclear is inflexible baseload. In a system with growing wind penetration, keeping those reactors running increases curtailment risk in the north or requires more redispatch. Did your counterfactual account for the system integration costs of inflexible nuclear versus flexible gas peakers?"
  **Reply:** "The German nuclear fleet was not purely baseload; by 2019, several units were running in load-following mode to accommodate renewables. The constraint wasn't technical flexibility; it was political. Furthermore, the plants were in the South (Isar, Neckar), close to load centers. Keeping them running reduces north-south transmission congestion, lowering the need to burn gas in the south to balance northern wind."
  **Softness:** Specific data on German nuclear load-following capabilities in 2018–2020 is plant-specific and not always public.
  **Concede:** "I concede that integration costs rise with higher renewable shares. But at 40–50% renewable share, existing nuclear is a complement to grid stability, not a blocker."

  ### 3. The Regulatory Lawyer (Mid-Session)
  **Objection:** "You argue the German market lacked a mechanism to socialize extension costs, unlike France. But under EU State Aid rules, paying an operator to extend life without a competitive tender is likely illegal. Are you arguing Germany should have violated competition law, or that the EU framework itself is the error?"
  **Reply:** "I am arguing the latter. The EU framework treats lifetime extension as 'new investment' requiring competitive bidding, which imposes greenfield risk on brownfield assets. France manages this via EDF's state-owned structure, which bypasses this friction. The error is a regulatory design that forces amortized assets to compete on LCOE with new builds."
  **Softness:** I am not a lawyer; I cannot guarantee a legal pathway existed even with political will.
  **Concede:** "I concede that under current EU interpretation, a direct subsidy is difficult. My point is that the political economy should have driven a rule change, not the plant closure."

  ### 4. The TSO Planning Analyst (Mid-Session)
  **Objection:** "You mention congestion. But the nuclear plants scheduled for closure (e.g., Brokdorf, Grohnde) were in the North. Keeping them running might have actually worsened the north-south bottleneck by generating power where we already have surplus wind, forcing us to curtail wind or export to Poland."
  **Reply:** "You are correct on the northern plants. However, the final three plants (Isar 2, Emsland, Neckarwestheim 2) were in the South. My argument specifically rests on the *last* phase-out. Keeping the southern trio online directly reduces the need to transmit northern wind south, cutting redispatch costs and fossil backup in Bavaria/Baden-Württemberg."
  **Softness:** Redispatch cost data is available, but attributing specific MWh of redispatch to specific plant closures involves modelling assumptions.
  **Concede:** "I concede the northern closures were less critical for grid topology. My emissions argument rests heavily on the southern trio's displacement of fossil peakers."

  ### 5. The Carbon-Market Economist (Mid-Session)
  **Objection:** "What about waterbed effects? If Germany burns less coal because of nuclear, the ETS cap means someone else burns more. Unless the ETS cap is tightened, German nuclear just exports emissions permits to Poland or Italy."
  **Reply:** "This was true before the Market Stability Reserve (MSR) was strengthened. Post-2019, the MSR cancels surplus allowances. Therefore, reduced demand in Germany now leads to permit cancellation, not leakage. The timing of the phase-out (accelerated post-2021) hit exactly when the MSR became effective, making the savings real."
  **Softness:** The exact volume of allowances cancelled due to German demand shifts is modelled, not observed.
  **Concede:** "Pre-2019, your objection holds completely. Post-2019, the mechanism changed. My thesis applies to the final shutdown phase."

  ### 6. The "Political Feasibility" Skeptic (Late)
  **Objection:** "You treat the nuclear phase-out and renewable expansion as independent variables. But the 'Energiewende' coalition required the Greens to accept coal/gas transitions in exchange for the Conservatives accepting the nuclear exit. If you keep nuclear, do you lose the political capital for the EEG subsidies?"
  **Reply:** "That is the 'Grand Bargain' hypothesis. However, the renewable subsidies were legislated *before* the accelerated phase-out. The EEG is law; the nuclear exit was a decree. My claim is that the technical asset was sacrificed for a political signal that did not alter the renewable subsidy trajectory. We paid the political price *and* kept the emissions."
  **Softness:** Counterfactual politics are unobservable. We cannot know if the coalition would have collapsed without the phase-out.
  **Concede:** "I concede this is the hardest counterfactual to prove. I argue the evidence suggests renewable deployment was driven by cost curves and EU targets, not just coalition arithmetic."

  ### 7. The French Availability Critic (Late)
  **Objection:** "You point to France as the institutional model. But look at 2022: stress corrosion cracking took 50% of their fleet offline. If Germany had kept its fleet, wouldn't aging issues have forced similar outages, forcing coal backup anyway?"
  **Reply:** "2022 was an anomaly driven by specific maintenance delays and a newly discovered corrosion issue. Historical availability of German plants (2015–2020) was >80%. Even at 60% availability, nuclear displaces coal on the margin. A partially running nuclear fleet emits less than a fully running coal fleet."
  **Softness:** Future reliability of 40+ year old German plants is uncertain.
  **Concede:** "I concede we cannot assume 90% capacity factors. But even at 50%, the carbon intensity differential remains massive."

  ### 8. The Opportunity Cost Economist (Late)
  **Objection:** "Sunk cost is sunk. But the *operating* cost isn't zero. If you spend €500m on safety retrofits to extend life, that's capital that couldn't be spent on grid expansion or battery storage. Why is that not a relevant cost?"
  **Reply:** "Because the marginal abatement cost of extending nuclear life is €20/tonne, while storage or new wind is €100+/tonne in that specific context. If the goal is immediate decarbonisation, retrofitting is the cheapest tool. We should not spend high-cost capital to replace low-cost carbon savings."
  **Softness:** Retrofit costs are plant-specific and often opaque.
  **Concede:** "I concede if retrofit costs exceed €1,000/kW, the economics break. But historical data suggests they are typically far lower."

  ### 9. The Grad Student (The "Just Transition" Angle)
  **Objection:** "Doesn't focusing on nuclear distract from the structural transformation of the economy? Keeping nuclear online preserves a centralized utility model that hinders the democratization of energy?"
  **Reply:** "This workshop is on the political economy of *decarbonisation*, measured in emissions. While energy democracy is a valid goal, conflating it with emissions reduction obscures the trade-off. We can pursue democracy in distribution while retaining centralized low-carbon generation during the transition."
  **Softness:** This is a normative clash, not positive analysis.
  **Concede:** "I concede this is a value judgment. My paper addresses the carbon budget, not the governance model."

  ### 10. The Modeller's "Final Nail" (Closing)
  **Objection:** "In our 2035 scenarios, keeping German nuclear online delays the build-out of hydrogen electrolysis and grid capacity by 5 years. Does your short-term saving lock in long-term infrastructure inertia?"
  **Reply:** "Infrastructure inertia is a risk, but 'cliff-edge' decarbonisation is riskier. We need the bridge. The delay you model assumes perfect policy execution on hydrogen. History suggests delays in hydrogen are more likely than delays in grid build caused by keeping a nuclear plant running."
  **Softness:** Long-term path dependency is inherently speculative.
  **Concede:** "I concede that nuclear cannot be the 2040 solution. It is strictly a 2020–2030 bridge technology."

  ---

  ## Part 2: The Killer Question
  **The Question:** "If the nuclear phase-out was the *political price* paid to secure the coalition that passed the renewable subsidy laws (EEG), then removing the phase-out collapses the counterfactual. Are you arguing that Germany could have had *both* the nuclear fleet *and* the same speed of renewable deployment, or do you admit that keeping nuclear would have slowed the renewable rollout, negating the carbon savings?"

  **Why it is fatal:** My Step 1 argument rests on the claim that renewable deployment was "proceeding under separate subsidy legislation regardless." If the audience believes the nuclear exit was the *quid pro quo* for the renewable acceleration (the "Grand Bargain"), then my counterfactual (Nuclear + Renewables) is politically impossible. It forces me to admit that the emissions "loss" was the cost of buying political stability for the wider transition. If I cannot prove the policies were separable, the thesis collapses into a "second-best" political argument rather than a technical error.

  **Preparation:** I must lean hard on the timeline: EEG (2000) predates the accelerated phase-out (2011). The subsidies were locked in before the exit was accelerated.

  ---

  ## Part 3: The Must-Land Reply
  **The Reply:** The distinction between **Short-Run Marginal Cost (SRMC)** and **Levelised Cost of Energy (LCOE)** for *existing* assets.

  **Why:** If the economists in the room convince themselves that the "cost" of keeping the plants open includes the opportunity cost of capital or potential retrofit investments treated as new CAPEX, they will view the plants as "expensive." I must convince them that for an *amortised* plant, the only relevant cost is O&M + Fuel + Safety Retrofit.
  **Current Status:** I have the logic, but I need to ensure I don't get bogged down in specific retrofit numbers (which are uncertain). I must keep the focus on the *accounting principle*: Sunk capital should not dictate operational dispatch in a climate crisis.

  ---

  ## Part 4: Numbers & Figures
  *Use these confidently. Flag the others.*

  **Confident Numbers (Safe to state):**
  *   **German Nuclear Share (Pre-Phase-out):** ~13–15% of total generation (2010).
  *   **German Power Sector Emissions (2020 vs 2021):** Jumped from ~265 MtCO2 to ~285 MtCO2 as nuclear dropped and coal filled the gap.
  *   **French Nuclear Availability (Historical):** Typically 75–80% (2010–2020).
  *   **Carbon Intensity (Germany vs France):** Germany ~400 gCO2/kWh (2022); France ~50 gCO2/kWh (2022). *Note: French number spikes in bad years, but the gap remains order-of-magnitude.*
  *   **ETS Price (2011–2018):** Mostly <€20/tonne. (Supports the "coal profitable" argument).

  **Uncertain/Flagged Numbers (Qualify these):**
  *   **Cost of Life-Extension Retrofit:** *Do not give a specific €/kW.* Say: "Industry estimates range widely, but are typically an order of magnitude lower than new-build CAPEX." (Reason: Highly plant-specific, often confidential).
  *   **French Availability (2022):** Dropped to ~50%. *Flag this as an anomaly due to stress corrosion.* Do not use this as the baseline for German counterfactual.
  *   **Marginal Displacement Mix:** *Do not say "100% Coal".* Say: "Modelling suggests the marginal unit was predominantly lignite and hard coal, with some gas depending on the hour." (Reason: Merit order shifts hourly).
  *   **Redispatch Costs:** *Do not quote a specific €bn saving.* Say: "TSO reports indicate redispatch costs rose significantly in the years following closures, correlating with the loss of southern generation."

  ---

  ## Strategic Note
  Your strongest ally in the room is the **TSO Analyst**. They know the grid is congested and that southern nuclear helped. If they push back on the grid argument, you are in trouble. If they nod, the economists will follow on the "system cost" argument. Watch their body language during Objection #2 and #4. If the TSO looks skeptical, pivot immediately to the "Emissions Intensity" argument (Step 1) and abandon the "Grid Stability" nuance.
