      7.  **Invention Rule:** Plausibility > Attestation. True to period/institution, even if not in archive.
      8.  **Moral Stance:** Men are responsible. Refuse exculpation. Adaptation to killing increases culpability (moral degradation through habituation).

  3.  **Identify Tensions (Brainstorming):**

      *   *Tension A: Situationism (3) vs. Characterological Method (4).*
          *   (3) says situation determines action, character traits don't matter much.
          *   (4) says scenes are generated by specific character temperament ("what would *this* man do").
