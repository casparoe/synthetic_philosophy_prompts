      *   *Tension B: Situationism (3) vs. Moral Responsibility (8).*
          *   (3) says situation varies, not the soul. Implies determinism or at least heavy external weighting.
          *   (8) says men are responsible and become *more* culpable as they adapt. Implies agency and character formation.
