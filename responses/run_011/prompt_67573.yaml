      *   *Tension E: Fiction not Illustrative (1) vs. Plausibility Rule (7).*
          *   (1) says fiction has unique cognitive value, not just illustrating history.
          *   (7) says invention must be true to period/institution.
          *   *Severity:* Low. This seems compatible. Fiction explores the *gaps* (7) to provide the *value* (1).

      *   *Tension F: Characterological Method (4) vs. Situationist Philosophy (3) vs. Moral Responsibility (8).*
          *   This is the core knot.
          *   If I write based on character (4), but believe situation rules (3), am I lying in the method?
