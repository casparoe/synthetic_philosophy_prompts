      *   *Tension C: Shrinking Distance (2) vs. Historical Specificity/Contempt (6).*
          *   (2) wants reader to feel "this could be me."
          *   (6) gives men a "shared idiom of contempt."
          *   *Severity:* Medium. If the contempt is too specific to Nazi culture, distance grows. If it's too universal, it risks Goldhagen-esque essentialism or banality.

      *   *Tension D: Browning/Opt-out (5) vs. Willingness/Contempt (6).*
