  Half research, half eavesdroping: I'm a novelist, and two people I know got into this argument at a dinner I was at, and I want to put it in a scene without flattening either side. Treat them both as serious — you're the professional philosopher here, so think it through properly before answering.

  Nadia gives 20% of her income to effective charities and says her utilitarianism requires it. Owen says that's exactly what's wrong with utilitarianism.

  O(1): If utilitarianism is true, you do wrong every time you buy a coffee rather than donate the money. A theory that turns an ordinary decent life into a continuous run of wrongdoings can't be the true theory.

  N(2): That's just an argument from how bad the news is. You're assuming the theory's verdicts have to be comfortable — that ordinary life can't really be full of wrongdoing. Maybe it is.

  O(3): Grant it. Then the theory still can't be used: you'd have to run cost-benefit calculations on every purchase, the strain would wreck your life and your relationships, and the results would be worse. So by consequentialism's own lights you shouldn't follow consequentialism. That's a problem from inside, not an appeal to comfort.

  N(4): No — the theory can tell you to cultivate dispositions, including the disposition not to calculate act by act. Telling you to install a character that doesn't do the arithmetic is the theory working, not self-destructing.

  O(5): If it can dissolve the calculating, it can dissolve the 20%. Whatever theory ends up actually guiding a life looks nothing like the one you said was true, and "demanding" stops picking out anything. Consequentialists have always been uneasy about doctrines that can only be lived privately and never preached — this is that old unease coming back.

  N(6): You're collapsing two different things: what makes an act right, and what an agent should be attending to. That collapse is your whole argument.

  Give me a verdict on each of the six numbered moves — right, partly right, or wrong — with a sentence or two of justification each, then one sentence saying where the disagreement actually lives and one saying what they're both missing. Under 400 words; this goes in my notebook, not a journal.
