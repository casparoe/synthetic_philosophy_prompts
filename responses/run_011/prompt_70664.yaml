answer: |-
  # The Analyticity Decision Tree: Logical Space & Positions

  **Ordering Note:** The tree orders questions by *modal robustness* first (Revision), then *epistemic access* (Justification), then *semantic grounding* (Externalism). This mirrors the historical dialectic: Quine attacks immunity; replies distinguish truth from justification; externalists attack the internalist presumption. This ordering is arbitrary but diagnostic: it forces the Quinean objection before allowing the Carnapian defense.

  ### **ROOT: What explanatory job must the notion perform?**
  *   **A. Epistemic:** Explaining knowledge/justification independent of evidence.
  *   **B. Metaphysical:** Explaining necessity, truth-conditions, or modality.
  *   **C. Pragmatic:** Explaining verbal disputes, theory choice, or meaning stability.

  ---

  ### **NODE 1: The Revision Constraint (The Logic Case)**
  *A researcher quietly replaces a classical logical rule (e.g., Distributive Law) because her empirical theory is simpler without it. Is this a genuine revision of truth, or a change of subject?*
  *   **Yes, Genuine Revision (Nothing is immune):** Go to **Node 2**.
  *   **No, Change of Subject (Some truths are constitutive):** Go to **Node 3**.

  ### **NODE 2: The Utility Question (For Revision-Acceptors)**
  *If nothing is immune, is the analytic/synthetic distinction still useful for grading centrality or diagnosing verbal disputes?*
  *   **No, It is a dogma to be eliminated:** → **Leaf 1**
  *   **Yes, It tracks pragmatic centrality or linguistic frameworks:** → **Leaf 2**

  ### **NODE 3: The Epistemic Gap (The Vixen Case)**
  *A speaker learned "vixen" only through "female fox" and now insists some vixens are not female foxes. Does truth-in-virtue-of-meaning entail justification-in-virtue-of-understanding?*
  *   **Yes, They are linked (Denial implies incompetence):** Go to **Node 4**.
  *   **No, They come apart (She is mistaken, not incompetent):** → **Leaf 3**

  ### **NODE 4: The Semantic Ground (The Mass Case)**
  *Two physicists apply "mass" identically on all measurements but disagree on invariance. Is meaning fixed by what a competent speaker knows by reflection, or by external causal history?*
  *   **Internal/Reflection (Competence is authoritative):** Go to **Node 5**.
  *   **External/Causal (Meanings ain't in the head):** → **Leaf 4**

  ### **NODE 5: The Mechanism & Grading**
  *Does talk of implicit definitions name a real mechanism, and is the distinction all-or-nothing?*
  *   **Real Mechanism / All-or-Nothing:** → **Leaf 5**
  *   **Placeholder / Graded or Interest-Sensitive:** → **Leaf 6**

  ---

  ### **THE LEAVES (Positions)**

  1.  **Radical Elimination (Quine):** *Awkward Commitment:* Must explain the special status of logic without appealing to meaning.
  2.  **Pragmatic Distinction (Grice/Strawson):** *Awkward Commitment:* Distinction is real but lacks the modal force originally claimed.
  3.  **Two-Dimensionalist Reconstruction (Chalmers):** *Awkward Commitment:* Accepts metaphysical analyticity while denying it guarantees epistemic priority.
  4.  **Naturalized Externalism (Putnam/Burge):** *Awkward Commitment:* Analytic truths may hold, but the speaker cannot know them by reflection alone.
  5.  **Epistemic Analyticity (Boghossian):** *Awkward Commitment:* Must explain how understanding alone justifies belief without circularity.
  6.  **Implicit Definition (Horwich):** *Awkward Commitment:* Treats meaning-constituting principles as unrevisable placeholders that risk dogmatism.
  7.  **Carnapian Explication (Friedman/Reichenbach):** *Awkward Commitment:* Framework choices are pragmatic, but internal truths are analytic (requires bifurcated ontology).
  8.  **Quantifier Variance (Hirsch):** *Awkward Commitment:* Ontological disputes are merely verbal, yet logic remains framework-relative.
  9.  **Neo-Fregean Abstraction (Wright/Hale):** *Awkward Commitment:* Analytic principles (Hume's Principle) yield knowledge of objects without intuition.
  10. **Mathematical Fictionalism (Field):** *Awkward Commitment:* Mathematical "truths" are useful fictions, not analytic descriptions of reality.
  11. **Conceptual Role Semantics (Block):** *Unnamed:* Meaning is use, but no clear line separates constitutive from peripheral roles.
  12. **Graded Deflationism:** *Unnamed:* Analyticity is a matter of degree, rendering the binary distinction obsolete but the gradient real.

  ---

  ### **LIMITATIONS & EMPTY CELLS**

  **Indistinguishable Leaves:** **Epistemic Analyticity (5)** and **Two-Dimensionalist Reconstruction (3)** often cannot be separated in practice. Both predict speakers will treat certain sentences as a priori; they disagree only on the metaphysical explanation of *why* (justification vs. primary intension), which yields no divergent behavioral predictions in standard cases.

  **Empty Combinations:**
  1.  **Externalist Implicit Definition:** *Incoherent.* Implicit definition requires the speaker's grasp to constitute meaning; externalism denies the grasp is constitutive.
  2.  **Revisable A Priori Justification:** *Unexplored/Unattractive.* If justification is a priori, revision by experience contradicts the definition; if revisable, it was never a priori (unless Kripkean contingent a priori, which fits Leaf 3).
  3.  **Radical Elimination + Pragmatic Utility:** *Permitted but Tense.* Quine allows pragmatic centrality (Leaf 2), but strict eliminativists (Leaf 1) reject even this as a relic.

  ---

  ### **INSTRUMENT BIAS NOTE**

  This tree is not neutral. **Node 3 (The Vixen Case)** begs the question against **Leaf 1 (Radical Elimination)**. By asking whether the speaker is "mistaken" or "incompetent," the node presupposes there is a fact of the matter about "what she learned" and "what the term means." A thoroughgoing Quinean denies there is such a fact to be discovered; for them, the question itself is a category error. Similarly, **Node 4** presupposes "meaning" is a variable that can be fixed either internally or externally, which assumes semantic realism against eliminativists.

  ---

  ### **MY POSITION ON THE DEBATE**

  **1. Which node does the most genuine diagnostic work?**
  **Node 3 (The Epistemic Gap).** The post-Quinean landscape is defined not by whether analyticity exists (most agree some sentences are meaning-constituted), but by whether that constitution *justifies* belief. Separating **Truth-in-virtue-of-meaning** from **Justification-in-virtue-of-understanding** is the only move that allows one to save the metaphysical phenomenon (logic/math seem necessary) without succumbing to Quine's epistemic critique (we can be wrong about anything). This split generates the most fertile contemporary positions (Two-Dimensionalism vs. Epistemic Analyticity).

  **2. Is the debate substantive at all?**
  **Yes, at least one leaf is wrong about something real.** The debate is not merely verbal. **Leaf 1 (Radical Elimination)** is wrong about the *structure of rational theory change*. If Quine is right that *any* statement can be revised come what may, then rational constraint is purely holistic and pragmatic. If Leaf 5 or 7 is right, there are *constitutive* constraints on rationality that are not empirical. This is a substantive disagreement about the nature of rationality and mind, not just a choice of vocabulary. A world where logic is empirically revisable is a world where reasoning works differently than in a world where logic is constitutive of thought.
