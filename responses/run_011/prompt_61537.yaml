answer: |-
  ### The Scenario: The Deep Borehole

  The County Water Authority began drilling a geothermal well three years ago. They have spent $4.5 million on the borehole itself. The money is gone; the drilling rig is leased and returned; there is no salvage value on the hole if abandoned. The project now stands at a decision node: invest an additional $2 million to complete the plant and generate power, or abort.

  A forward-looking analysis shows the completed plant will generate $1.5 million in net present value (NPV) over its life. The cost to finish is $2 million. The net expected utility of finishing is -$500,000. The net expected utility of aborting is $0 (assuming no backfill costs, no contractual penalties, and no regulatory liability).

  However, the Project Lead argues they must finish. Her reasoning is not that the hole provides evidence of water flow (information banned), nor that abandoning it will look bad to the board (reputation banned), nor that she will feel guilty (psychic payoff banned). She argues that the $4.5 million expenditure has created a *structural necessity* independent of the hole's physical utility. She claims that because the money was spent, the *category* of the project has shifted from "speculative investment" to "public trust," and that shifting it back to "abandoned" creates a discontinuity in the county's operational logic that is costlier than the $500,000 loss, even if no specific person notices and no specific rule is broken.

  ### The Reasoning

  **The Forward-Looking Calculator:**
  A standard expected-utility agent compares the future streams.
  *   **Option A (Finish):** Cost $2M, Benefit $1.5M. Net: -$0.5M.
  *   **Option B (Quit):** Cost $0, Benefit $0. Net: $0.
  *   **Decision:** Quit. The $4.5M is excluded from the equation because it appears in both branches as a constant past subtractor, or is ignored as irrelevant to the future marginal gain.

  **The Agent's Choice:**
  The Project Lead chooses to Finish. She absorbs the $0.5M certain loss. She asserts that quitting is the mistake, not finishing.

  **Why Quitting Would Be a Mistake (The Argument):**
  The argument is that the expenditure itself altered the *ontology* of the project. By spending the threshold amount, the project ceased to be a disposable experiment and became a "public fact." To treat it as disposable now is to misclassify the reality of the county's position in the world, leading to a category error in future budgeting logic that compounds over time.

  ### The Constraint Audit

  Here is the honest accounting of where this scenario bends or breaks your rules:

  1.  **Realistic Setting:** **Met.** Municipal capital projects are the standard venue for this debate.
  2.  **Irrecoverable Expenditure:** **Met.** The money is gone; the hole has no resale value.
  3.  **No Information:** **Bent.** The claim that the project is now a "public fact" implies the expenditure signals something about the county's stability or intent, even if "nobody knows." If *nobody* knows, it cannot be a public fact. If it is a public fact, someone knows.
  4.  **No Reputation/Signaling:** **Met (Superficially).** No external agents update on the decision.
  5.  **No Self-Prediction:** **Met.** The agent isn't doing this to train herself for next time.
  6.  **No Psychic Payoff:** **Failed.** This is the leak. The "category error" argument is a proxy for *integrity* or *narrative tidiness*. If there is truly no psychic cost (no feeling of waste, no dissonance), the "operational logic" argument collapses. A spreadsheet does not care about its own ontological consistency; only a mind does.
  7.  **No Promises:** **Met.** No specific promise was made.

  ### The Active Feature

  The single feature doing the work is **the mapping of physical expenditure onto mental accounting categories.**

  The argument relies on the idea that money spent moves a project from Bucket A ("Speculative") to Bucket B ("Commitment"). But buckets are cognitive tools, not physical realities. If you ban "psychic payoff" and "narrative tidiness," you ban the utility derived from keeping the buckets consistent. Without a mind to experience the dissonance of moving a project back from Bucket B to Bucket A, the bucket label has no causal power.

  ### The Meta-Question

  Your hunch is correct. **The constraints are jointly unsatisfiable.**

  Here is the precise reason why: Rational choice theory (and the orthodox slogan you are fighting) is *consequentialist* and *forward-looking*. It defines the "right" move as the one that maximizes the goodness of the future world state.

  For the past to influence the optimal future path, it must causally affect the future. Causality flows through two channels:
  1.  **Physics:** The past expenditure changed the physical state of the world (e.g., the hole exists, the machine is half-built). This creates a *residual asset* or changes the *cost to finish*. You banned this ("no residual asset").
  2.  **Mind:** The past expenditure changed the mental state of the agents (e.g., regret, reputation, commitment). You banned this ("no psychic payoff," "no signaling").

  If you ban both the physical residue and the mental residue, the expenditure literally did *nothing* to the current state of the universe. If the current state of the universe is identical to a state where the money was burned in a bonfire, the optimal future action must be identical. To argue otherwise is to argue for magic—that the number "4.5 million" exerts a gravitational pull on the future without mediating through matter or mind.

  The orthodox slogan ("ignore sunk costs") isn't just a heuristic; it is a tautology of consequentialist definitions. If you find a case where you *should* honor a sunk cost, you have implicitly discovered a future benefit (psychic, reputational, or physical) that correlates with that cost.

  ### The Best Near-Miss and The Leak

  The strongest near-miss is **Liability Avoidance disguised as Sunk Cost.**

  *   **Scenario:** You dug the hole. If you finish, it costs $2M. If you quit, safety regulations require you to backfill it for $3M.
  *   **Why it looks like Sunk Cost:** You feel compelled to finish because you "already dug the hole."
  *   **The Leak:** This is not sunk cost reasoning. This is **forward-looking cost minimization.** The obligation to backfill is a *future* cost triggered by the decision to quit. The rational agent finishes because $2M < $3M. The digging is irrelevant except insofar as it triggered the regulatory clause.
  *   **Where it leaks:** It violates the "No Residual Asset/Liability" constraint. The hole is a liability. The money spent created a physical state that incurs future costs.

  ### Epistemic Honesty

  **What would change my mind?**
  I would change my mind if you could demonstrate a **non-consequentialist rationality** that is not reducible to "psychic payoff."
  For example, if there is a deontological duty to "complete what one starts" that exists independently of human feelings (a moral realist claim), then honoring sunk cost is rational *moral* behavior, even if it is irrational *economic* behavior.
  However, in a government workshop context, "moral duty" usually maps to "psychic cost of violating duty" (guilt/integrity). If you can isolate a moral duty that generates *no* internal or external feedback loop (no guilt, no social sanction), yet still binds the agent, you have found a genuine counterexample. I do not believe such a thing exists in a naturalistic framework.

  **Where I might be fooling myself:**
  I am assuming that "utility" must be experienced by a conscious agent. If there is a form of value that exists objectively in the state of affairs (e.g., "A completed project is objectively better than a half-finished one, regardless of utility derived"), then the past cost matters because it purchased the *potential* for that objective value. But this requires accepting value realism, which most project leads (and economists) reject.

  **Recommendation for your Workshop:**
  Do not try to prove the slide wrong. The slide is logically sound within the frame of economic rationality. Instead, reframe the session. The participant who pushed back wasn't arguing about *economic* rationality; she was arguing about **organizational momentum** and **political liability**.
  *   **The Fix:** Change the slide from "Sunk costs are irrelevant" to "Sunk costs are economically irrelevant, but organizationally sticky."
  *   **The Lesson:** The rational move is to quit, *unless* the act of quitting triggers hidden future costs (political capital, staff morale, regulatory scrutiny). Those aren't sunk costs; they are *future costs correlated with past spending*.
  *   **Why this helps:** It validates the participant (she is right about the real world) without breaking the math (the economist is right about the model). It shifts the debate from "Is this irrational?" to "Have we accounted for all the future costs of quitting?"

  This approach respects the intelligence of your participants while preserving the analytical tool you were hired to teach.
