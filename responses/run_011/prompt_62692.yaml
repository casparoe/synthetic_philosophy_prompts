  Regarding chance versus the "fountain-head": Polybius distinguishes internal from external causes. The constitution is the internal cause ("fountain-head") of designs and actions; it determines how the state responds to events. Chance (*Tyche*) governs the external events themselves. A good constitution allows a state to navigate bad chance successfully; a bad constitution ensures failure even with good chance. The "fountain-head" claim asserts that while you cannot control fortune, you can control your response to it via structure. The fountain-head language suggests a deterministic flow, where the constitution channels all political energy. Thus, the definitions serve to isolate the variable of moral intent within the structural form. The sequence in 6.4.7–9 follows from observation of this moral decay within structures. The definitions ensure that when decay happens, we recognize it as a change of regime type, not just a bad period for the same regime. This preserves the cyclical theory: the state literally becomes a different system when the moral bond breaks.

  Where my gloss overreaches
  Your dynamical-systems framing clarifies the logic but risks mechanizing Polybius's moral biology. He views constitutions as organic entities that grow, mature, and die, not just machines requiring maintenance. "Art" is not merely active control but moral education and legislation. When you speak of "maintained equilibrium," you imply a static state; Polybius envisions a dynamic balance that may still eventually fail.
  Also, be careful with "immune to counterexample." While logically true, Polybius believes he is describing reality, not constructing a tautology. He thinks tyrants *actually exist* as distinct from kings, not just as labeling conventions. Finally, the "fountain-head" claim is stronger than "internal variable"; he genuinely believes structure dictates destiny more than chance does, whereas your field might treat structure as one parameter among many. Do not assume his "prediction" is mathematical; it is analogical, based on the life-cycle of organisms. The text is less precise than a control loop diagram; it relies on the reader accepting the moral analogy between individual psychology and state structure. Your analogy is powerful but historically anachronistic.
