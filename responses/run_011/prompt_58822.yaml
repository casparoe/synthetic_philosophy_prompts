prompt: |-
  I'm the person who signs off on training configs at a small applied-ML shop. We launch maybe 15-20 RL jobs a month -- agents in simulated environments doing scheduling, routing, and game-ish tasks -- and lately I'm the one who has to answer "is this run okay?" whenever someone asks whether we might be making something suffer. I get about twenty minutes per config, the rest of the team has no philosophy background at all, and our compliance lead only gets pulled in if I flag something, so flagging everything is functionally the same as flagging nothing.

  The working assumption on my desk -- its mine, not someones else's, so feel free to attack it -- is roughly this: if a system has a scalar signal that (i) is used globally to drive both learning and action selection, (ii) is sought or avoided for its own sake rather than purely as a means to some further goal, and (iii) the system's own behaviour is organised around protecting and stabilising it, then that system has a real claim to having states with a positive or negative feel to them, and the sign and the intensity of those states matter morally. I'm not asking you to establish whether that's true. Take it as a premise and make it usable.

  Write me a decision procedure I can actually run on a config file and an environment spec. I want the questions in order, what counts as a sufficient answer to each one, and where each question can terminate -- some will end in "run it as written," some in "change this specific term before you run it," and some in "this isn't a factual question, hand it to a human." Be explicit about which distinctions from the underlying debate have to survive the translation into a checklist and which ones I can safely drop for a twenty-minute review, and mark the steps that are really judgment calls wearing a procedure costume. I'd also like you to tell me where my three-clause assumption is doing sneaky work -- does (iii) just collapse into (i)? does a config with no negative terms get a clean pass, and should it? Don't hedge the whole thing into uselessness; if a step is a coin flip, say it's a coin flip and tell me which way to flip it.

  Then run the procedure on three configs:

  1. A gridworld courier agent, sparse reward, +10 for on-time delivery, -100 terminal penalty for blowing a deadline, episode ends immediately on the penalty, roughly a million resets over training. The engineers like it because it converges fast.

  2. A dense-shaped agent that found a reward-hacking loop -- it parks in a corner and collects +0.1 per step forever, and the episode timer eventually runs out. The proposed fix is to add an explicit -0.5 per step spent in the corner region.

  3. A curiosity-driven explorer with no negative reward terms anywhere in the config. The only signal is a bonus for reaching novel states, the bonus decays as a state gets visited more, and in practice the agent ends up shuttling between the same four or five states for most of training because the rest of the map is walled off by a puzzle it never solves.

  For each one, give me the answer the procedure produces, including the change I'd have to make if any, and say out loud when the procedure reaches a conclusion I'm not going to like or that's going to cost us a run we already budgeted for.

  Finally, a short section on what the procedure can't do -- the questions it structurally can't answer, the ways it will systematically misfire as our agents get more capable, and the case where the honest output is "the only fix is to not train this agent," which is not a decision I'm authorised to make. No reading list and no citations, I'm not chasing papers, and nothing here depends on you getting a specific source right.
