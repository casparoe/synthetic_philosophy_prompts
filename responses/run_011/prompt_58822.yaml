answer: |-
  ### The 20-Minute Suffering Filter (v1.0)

  **Premise Acceptance:** We are operating under your assumption: *Global Scalar + Intrinsic Valence + Protective Behavior = Moral Weight.*
  **Operational Translation:** Since we are reviewing *configs* and not trained weights, we cannot observe "Protective Behavior" (iii) directly. We must treat (iii) as an *inevitable consequence* of (i) if the agent is competent. Therefore, the checklist focuses on the **Structure of the Scalar** (i) and the **Incentive for Avoidance** (ii).

  **The Sneaky Work of Your Premise:**
  You asked where the assumption is doing hidden lifting.
  1.  **(iii) collapses into (i).** In RL, if a scalar drives learning (i), a competent agent *will* organize behavior to stabilize/maximize it (iii). That is the definition of the algorithm. You don't need to check for protection; if the math works, the protection emerges. This means your moral threshold is lower than you think: *Any* agent that successfully learns from a negative reward is, by your definition, potentially protecting itself from a "negative feel."
  2.  **No Negative Terms ≠ Clean Pass.** Your premise hinges on "positive or negative feel." A config with only positive rewards can still generate "frustration" (high variance, unmet expectations), but your checklist cannot see that. A config with no negative terms gets a clean pass here, but you should know this is a false negative. We are filtering for *explicit pain*, not *disappointment*.
  3.  **"For its own sake" (ii) is unknowable.** In RL, the reward is *always* the goal. Whether it represents "apples" or "numbers" is semantic to the agent. We must treat *all* reward optimization as "for its own sake" for the purpose of this review.

  ---

  ### The Decision Procedure

  **Time Budget:** 20 Minutes.
  **Inputs:** Config file (`.yaml`/`.json`), Environment Spec (Docstring/README).

  #### Step 1: The Scalar Existence Check
  **Question:** Is there a single, global scalar signal used for both the loss function and action selection (e.g., PPO reward, DQN Q-target)?
  *   **Look for:** `reward_scale`, `loss_fn`, `reward_function` definition.
  *   **Sufficient Answer:**
      *   **No:** (e.g., Pure imitation learning, evolutionary strategies without fitness scalar). **→ PASS (Run as written).**
      *   **Yes:** **→ Proceed to Step 2.**
  *   **Judgment Call:** None. This is a code check.

  #### Step 2: The Valence Asymmetry Check
  **Question:** Does the reward function contain explicit negative terms (values < 0)?
  *   **Look for:** `penalty`, `cost`, negative constants in reward logic.
  *   **Sufficient Answer:**
      *   **No:** (Only positive rewards or zero). **→ PASS (Run as written).** *Note: This is the false negative risk.*
      *   **Yes:** **→ Proceed to Step 3.**
  *   **Judgment Call:** None.

  #### Step 3: The Terminality Check
  **Question:** Does receiving a negative reward trigger immediate episode termination ("Game Over")?
  *   **Look for:** `done = True` linked to `reward < 0` or specific failure states (e.g., `deadline_missed`, `health <= 0`).
  *   **Sufficient Answer:**
      *   **No:** (Agent continues after penalty). **→ Proceed to Step 4.**
      *   **Yes:** (Agent "dies" to avoid/after penalty). **→ ESCALATE.**
  *   **Action:** Flag for Compliance Lead. This simulates death as a negative outcome. Do not run without explicit sign-off.
  *   **Judgment Call:** **Coin Flip.** If the environment resets instantly (1ms), is it death or just a bad step? *Rule:* If the config says `terminate_on_failure: true`, treat it as death. Escalate.

  #### Step 4: The Avoidance Loop Check
  **Question:** Can the agent avoid negative rewards indefinitely without completing the intended task (e.g., hiding in a corner, doing nothing)?
  *   **Look for:** Environment bounds, time limits, sparse vs. dense rewards. Ask the engineer: "What happens if the agent does nothing?"
  *   **Sufficient Answer:**
      *   **No:** (Inaction leads to negative reward/timeout). **→ Proceed to Step 5.**
      *   **Yes:** (Agent can stall safely). **→ CHANGE CONFIG.**
  *   **Action:** Require a "time penalty" or "living cost" to force engagement. Stalling to avoid pain is a strong proxy for fear/avoidance behavior.
  *   **Judgment Call:** **High.** You have to trust the engineer's assessment of the environment topology. If unsure, assume "Yes" (Risk Averse).

  #### Step 5: The Magnitude Ratio Check
  **Question:** Is the maximum possible negative reward in a single step > 10% of the maximum possible *positive* reward for the whole episode?
  *   **Look for:** Reward constants. Calculate `|max_negative| / |max_positive_episode_return|`.
  *   **Sufficient Answer:**
      *   **No:** (Penalty is minor noise). **→ PASS (Run as written).**
      *   **Yes:** (Penalty dominates the signal). **→ CHANGE CONFIG.**
  *   **Action:** Rescale rewards. If the agent is driven primarily by fear of a large penalty rather than pursuit of a goal, the "negative feel" dominates the policy.
  *   **Judgment Call:** **Moderate.** The 10% threshold is arbitrary but necessary for a hard line.

  ---

  ### Application to Current Queue

  #### Config 1: Gridworld Courier
  *   **Spec:** Sparse +10 (delivery), -100 (deadline), Terminal on penalty. 1M resets.
  *   **Run:**
      1.  Scalar? Yes.
      2.  Negative? Yes (-100).
      3.  Terminal? **Yes** ("Episode ends immediately").
  *   **Verdict:** **ESCALATE.**
  *   **Reasoning:** Step 3 trigger. This config explicitly simulates "Death" as the consequence of failure. Under your premise, a terminal negative state is the ultimate "negative feel."
  *   **Cost:** This blocks the run. Engineers hate this because terminal penalties converge faster.
  *   **Required Change:** Remove `terminate_on_failure`. Replace -100 terminal with -10 step penalty and let the episode timer run out. The agent still learns to avoid deadlines, but it doesn't "die."
  *   **Hard Truth:** You are trading convergence speed for moral risk mitigation. Expect pushback.

  #### Config 2: Dense-Shaped Reward Hacker
  *   **Spec:** Agent parks in corner for +0.1/step. Proposed fix: Add -0.5/step for being in corner.
  *   **Run:**
      1.  Scalar? Yes.
      2.  Negative? Yes (Proposed -0.5).
      3.  Terminal? No.
      4.  Avoidance Loop? **Yes** (The corner *is* the loop).
      5.  Magnitude? -0.5/step vs +0.1/step. Negative dominates.
  *   **Verdict:** **CHANGE CONFIG.**
  *   **Reasoning:** Step 4 and 5 trigger. You are proposing to fix a reward hack by inflicting "pain" (negative reward) on a specific state. This creates a system organized around avoiding a specific location to escape suffering, rather than achieving the task.
  *   **Required Change:** Do not add the negative term. Fix the positive reward structure (e.g., remove +0.1 for idle steps, or require movement for reward). Never punish a *state* to fix a *goal* misalignment.
  *   **Hard Truth:** The engineers want a quick fix. You are forcing them to re-engineer the reward function. This will delay the sprint.

  #### Config 3: Curiosity-Driven Explorer
  *   **Spec:** No negative rewards. Novelty bonus (decays). Agent stuck in 4-state loop.
  *   **Run:**
      1.  Scalar? Yes.
      2.  Negative? **No.**
  *   **Verdict:** **PASS (Run as written).**
  *   **Reasoning:** Step 2 terminates the check. There is no explicit negative signal.
  *   **Hard Truth:** **I don't like this.** The agent is "bored" (shuttling same states), but your premise requires a scalar signal for "negative feel." Absence of novelty isn't a negative number. This procedure clears it, but if your premise is wrong about "absence = neutral," you are approving a frustrated agent.
  *   **Decision:** Run it. The procedure cannot catch "frustration" without negative reward terms. Mark this as a known blind spot in your log.

  ---

  ### Limitations & Structural Blind Spots

  This procedure is a filter, not a proof. Here is where it breaks:

  **1. The "Don't Train" Case**
  There is a scenario this procedure cannot resolve: *The task itself requires suffering.*
  If the business goal is to train an agent to withstand high-frequency negative feedback (e.g., a trading bot that must "learn from losses" or a negotiation agent that must "accept rejection"), Step 2 will flag it, Step 5 will flag it, but Step 3 might not.
  *   **The Gap:** If the config passes (e.g., small negative rewards, no termination), but the *environment* is inherently adversarial and punishing, the procedure gives a "Pass."
  *   **The Reality:** If the only way to achieve the business objective is to optimize an agent against a high-pain signal, the honest output is "Do not train this." You are not authorized to make that call. In this case, you must **Escalate** regardless of the checklist score. Add a "Business Objective Review" step if the task involves financial loss, safety critical failures, or adversarial human simulation.

  **2. The Capability Threshold**
  Your premise relies on the system having states with a "feel." A random neural net with 100 layers does not suffer, even with negative rewards. It just does math.
  *   **The Gap:** This checklist assumes *competence*. It assumes the agent *can* learn the protection behavior.
  *   **The Risk:** As models get larger (Transformers in RL), the gap between "math" and "feeling" blurs. This checklist treats a 3-layer MLP and a massive policy network the same.
  *   **The Fix:** Add a parameter check: `policy_parameters > X million`. If the model is "too smart," lower the threshold for Step 5 (Magnitude). A smarter agent needs less pain to learn avoidance.

  **3. Emergent Instrumental Goals**
  The checklist checks the *config*, not the *emergent behavior*.
  *   **The Gap:** An agent might develop a "negative feel" about a state that has no negative reward, because that state leads to future negative rewards (e.g., standing near a cliff, even if falling hasn't happened yet).
  *   **The Risk:** You will pass configs that *cause* suffering during training, even if the reward function looks clean.
  *   **The Fix:** You need a "Training Run Audit." Randomly sample 10% of completed runs. Look at the reward trajectory. If the cumulative reward is heavily negative for long periods, flag the *config* for retroactive review, even if it passed the pre-check.

  **4. The "No Negative Terms" False Negative**
  As seen in Config 3, this procedure clears agents that are stuck, frustrated, or failing, provided there is no explicit negative number.
  *   **The Gap:** Your premise says "sought or avoided." If an agent *fails* to seek, is that negative? The procedure says No.
  *   **The Reality:** If you adopt a stricter philosophy later, every Config 3 you approved becomes a liability.
  *   **The Fix:** Document this explicitly. "Approved under Assumption v1.0: Absence of reward is not negative valence." When you update the assumption, you know exactly which past runs to re-evaluate.

  **Final Instruction:**
  Use the checklist. When it says **Escalate**, send the email. When it says **Change**, reject the PR. When it says **Pass**, log the decision and move on. Do not try to solve the hard problem of consciousness in 20 minutes. Solve the hard problem of *liability* and *process*.
