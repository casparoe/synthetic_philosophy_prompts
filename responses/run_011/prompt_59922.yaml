      *   *Commutativity:* Reply: Diaconis/Zabell show conditions for order independence. Soft spot: Assumes those conditions hold for perceptual constraints.
      *   *Statistician:* Reply: Constraints can be intervals (robust MinEnt). Soft spot: Moves toward IP, undermining precise Bayesianism.
