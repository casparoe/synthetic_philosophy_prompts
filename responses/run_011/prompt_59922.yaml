answer: |-
  # Prep Sheet: Chapter 3 (Rigidity & Constraints)

  ## Strategic Concessions (First 10 Minutes)
  **Do this immediately.** It disarms the room by showing you know where the bodies are buried.

  1.  **To the Imprecise Probability Trio:** Concede that MinEnt selects a *single* posterior from the feasible set, and that this selection adds information not strictly mandated by the constraint. Acknowledge that if their goal is to represent ignorance, your method is "over-committal."
      *   *Why:* Stops them from spending 20 minutes proving that sets are better than points. You are arguing for a *better point-update*, not defending precise Bayesianism against sets.
  2.  **To the Perception Epistemologist:** Concede that mapping "qualitative character" to a function $f$ is a bridge principle that requires substantive philosophy of mind, not just math.
      *   *Why:* Prevents them from dismissing the whole formalism as category error. You are proposing a *model*, not a reduction.
  3.  **To Everyone:** Concede that Rigidity might be normatively acceptable for *ideal* agents with perfect introspective access, but argue your chapter is about *human* perceptual learning where such access is unavailable.

  ## The Single Reply That Must Land
  **The Target:** The Input Problem.
  **The Line:** "The traditional Input Problem asks: 'Which partition represents the experience?' My answer is: 'None of them.' Experiences do not deliver partitions; they deliver constraints on expectations. Once you accept that the *form* of the input is a constraint rather than a probability vector, the demand for Rigidity vanishes because there are no cells to be rigid *about*."
  **Why:** If this doesn't stick, the room will treat your view as just "Jeffrey Conditionalization with extra steps," and the Statistician and IP folks will eat you alive on technical grounds. You need them to see this as a *category shift*, not a parameter tweak.

  ---

  ## The Eight Objections (Ordered by Damage)

  ### 1. The Arbitrariness of MinEnt (Imprecise Probability Trio)
  **Vocabulary:** "Sets of measures," "Dilation," "Unjustified sharpening."
  **Objection:** "You replace the Rigidity condition with a constraint set, which is good. But then you use Minimum Relative Entropy to pick a *unique* posterior. That's an arbitrary sharpening of your credence not licensed by the evidence. Why not keep the set of all posteriors satisfying the constraint? MinEnt smuggles in a bias toward the prior that isn't justified."
  **Damage:** **Refutation.** If they convince the room that MinEnt is arbitrary, your normative claim collapses.
  **Reply (2 min):** "MinEnt isn't arbitrary; it's the unique update rule that satisfies the Shore & Johnson axioms (consistency, system independence, etc.). It adds the *least* information necessary to satisfy the constraint. Keeping the set is valid for representing ignorance, but for *action* and *decision*, we need a working posterior. MinEnt is the conservative choice."
  **Soft Spot:** You are assuming the Shore & Johnson axioms are binding norms for this context. The IP folks deny that rationality requires a unique posterior for decision.

  ### 2. The Meta-Input Regress (Philosophy of Science)
  **Vocabulary:** "Calibration," "Higher-order uncertainty," "Givenness."
  **Objection:** "You say the input is a constraint $E_{new}[f] = c$. Where does $c$ come from? If the experience tells you $c$, doesn't that experience *also* carry information about $H$ conditional on that constraint? You haven't solved the Rigidity problem; you've just moved it up one level to the constraint selection."
  **Damage:** **Refutation.** This suggests you haven't actually solved the psychological problem, just relabeled it.
  **Reply (2 min):** "Constraints are not inferred; they are the direct phenomenological impact of experience, like likelihoods in standard Bayes. We don't ask where the likelihood comes from in standard updating; we treat it as the interface. Here, the constraint *is* the interface. Rigidity fails because partitions are conceptual; constraints can be non-conceptual."
  **Soft Spot:** You are assuming experiences can directly fix numerical constraints without conceptual mediation. The Perception person will deny this; the Phil Sci person will question the calibration.

  ### 3. Commutativity Failure (Statistician / IP Trio)
  **Vocabulary:** "Order dependence," "Projection onto convex sets," "Path dependence."
  **Objection:** "You claim commutativity is solved. But MinEnt updates are only order-independent if the constraints are compatible or orthogonal. If I get constraint A then B, versus B then A, the projections differ unless the constraint sets intersect nicely. Perceptual constraints rarely commute. So you haven't fixed the commutativity problem; you've hidden it in the geometry."
  **Damage:** **High.** Undermines the technical advantage you claim over JC.
  **Reply (2 min):** "True, sequential projection is order-dependent. But that's a feature, not a bug. Perceptual learning *is* path-dependent. The Diaconis-Zabell result shows when it commutes; when it doesn't, it reflects that the second experience re-contextualizes the first. We shouldn't demand commutativity for non-simultaneous inputs."
  **Soft Spot:** You are retreating from the claim that commutativity is "solved" to claiming it's "unnecessary." This weakens the formal elegance argument.

  ### 4. The Noise vs. Precision Objection (Statistician)
  **Vocabulary:** "Variational family," "Objective function," "Overfitting," "False precision."
  **Objection:** "In variational inference, we minimize divergence over a *family* of distributions because we know our constraints are approximate. You're treating the constraint $E[f]=c$ as exact. Perceptual experience is noisy. Enforcing an exact constraint via MinEnt gives you a precise posterior that is confidently wrong."
  **Damage:** **High.** Makes the model look computationally naive.
  **Reply (2 min):** "The constraint can be an interval or a soft constraint (penalty term in the objective function). The formalism allows for 'soft' MinEnt. The chapter focuses on the hard case to show the structural difference from JC, but robustness is a straightforward extension."
  **Soft Spot:** You haven't worked out the robustness conditions in the chapter. If pressed for the math, you might stall.

  ### 5. The Non-Conceptual Content Gap (Perception Epistemologist)
  **Vocabulary:** "Non-conceptual content," "Propositional attitude," "Richness of experience."
  **Objection:** "You say $f$ is a function of the world. But my experience of the swatch is rich and analog. Any function $f$ you write down is discrete and conceptual. You're still forcing the richness of seeing into a propositional box. You haven't escaped the formalist misdescription; you've just made the box bigger."
  **Damage:** **Medium.** Attacks the bridge principle, not the math.
  **Reply (2 min):** "I agree experience is richer than any partition. That's why Rigidity fails. But for *belief update*, we only need the aspect of experience that bears on the hypothesis. $f$ captures the *relevant* correlation between world and experience, not the totality of the qualia. It's a sufficient statistic for learning, not a description of seeing."
  **Soft Spot:** You are assuming there *is* a sufficient statistic for learning that separates the epistemic from the phenomenological. They may deny this separation.

  ### 6. The Refined Partition Defense (Grad Students)
  **Vocabulary:** "Jeffrey's suggestion," "Finer partition," "Logical omniscience."
  **Objection:** "Jeffrey himself said if Rigidity fails, refine the partition until it holds. Why can't I just include 'the lighting conditions' or 'the state of my retina' in the partition cells? Then Rigidity holds by definition."
  **Damage:** **Medium.** The standard counter-argument.
  **Reply (2 min):** "Because some information is non-propositional. You can't partition on 'how green it looks' without already conceptualizing 'green.' The experience precedes the partition. If the partition must encode the experience to ensure Rigidity, the update becomes trivial (probability 1 on the actual experience), which kills learning."
  **Soft Spot:** Requires a strong argument that some perceptual info is in principle non-partitional.

  ### 7. Normativity vs. Descriptivity (Grad Students)
  **Vocabulary:** "Ideal theory," "Ought implies can," "Rational norms."
  **Objection:** "Even if Rigidity is psychologically false, why isn't it a valid normative ideal? Maybe we *ought* to be rigid, even if we aren't. Your argument relies on psychological impossibility to defeat a normative rule."
  **Damage:** **Low.** Easy to deflect, but distracting.
  **Reply (2 min):** "Epistemic norms must be satisfiable. 'Ought implies can.' If the structure of perception makes Rigidity impossible to satisfy without ignoring evidence (the extra info in the qualia), then a norm requiring it forces us to be irrational. We need a norm that fits the cognitive architecture."
  **Soft Spot:** Some Bayesians reject 'ought implies can' in epistemology.

  ### 8. Old Evidence & Confirmation (Philosophy of Science)
  **Vocabulary:** "Conditionalization," "Temporal index," "Support."
  **Objection:** "How does this help with Old Evidence? If the constraint is on the *new* posterior, aren't you just stipulating the result? How does this explain *confirmation* rather than just belief change?"
  **Damage:** **Low.** Tangential to the main thesis.
  **Reply (2 min):** "It doesn't solve Old Evidence directly, but it clarifies that learning isn't always becoming certain of a proposition. Sometimes it's shifting expectations. This decouples confirmation from certainty, which helps dissolve the problem, even if it doesn't solve it alone."
  **Soft Spot:** Vague. You haven't integrated this with the confirmation literature deeply.

  ---

  ## The Question You Hope Nobody Asks
  **The Question:** "If the constraint is $E_{new}[f] = c$, and $c$ is determined by the experience, what guarantees that different agents with the same experience choose the same $c$? If it's subjective, isn't this just arbitrary shifting of priors? If it's objective, what is the function mapping qualia to $c$?"
  **Why this hurts:** It exposes the "Black Box" of your input analysis. You've replaced the "Input Problem" (finding the partition) with the "Constraint Problem" (finding the value). If you can't specify how the experience fixes $c$ without invoking the very psychological mechanisms you claimed were too complex for partitions, you haven't gained ground.
  **Current Status:** You have no answer.
  **Stopgap:** "That is the empirical work for Chapter 4. Chapter 3 establishes the *space* of rational updates given a constraint. How the constraint is fixed is a psycho-physical question, not an epistemic one." (Risky, but buys time).

  ---

  ## Assessment of Objections
  *   **Merely Uncomfortable:** 5 (Perception), 7 (Normativity), 8 (Old Evidence). These are standard friction points for formal epistemology. You can survive these.
  *   **Potentially Refuting:** 1 (IP/Arbitrariness), 2 (Regress), 3 (Commutativity).
      *   If **1** lands, you are no longer doing Bayesian epistemology; you are doing something else.
      *   If **2** lands, you haven't solved the problem you claimed to solve.
      *   If **3** lands, your technical claim is false.
      *   *Priority:* Prepare hardest for 1 and 2.

  ## What Would Change My Assessment
  **The Consideration:** If you could demonstrate that **MinEnt is the *only* rule that preserves the martingale property of expectations under constraint-based learning.**
  *   *Why:* This would answer the IP objection (1) by showing MinEnt isn't arbitrary but structurally necessary for diachronic coherence. It would elevate the chapter from "a plausible extension" to "the unique solution."
  *   *Where I Might Be Wrong:* I may be underestimating the "Refined Partition" defense (Objection 6). If there is a theorem showing that for any constraint-based update, there exists a partition-based JC update that is equivalent, your distinctiveness claim vanishes. I am assuming such a partition is not always constructible, but a clever formalist in the room might prove otherwise. Check Christensen (1992) and Garber (1983) again before Thursday.
