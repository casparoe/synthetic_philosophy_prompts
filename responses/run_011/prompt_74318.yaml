prompt: |-
  I direct a small charity that funds corrective surgery for children born with a treatable heart defect, and in six weeks I have to give the seven-minute appeal at our annual donor dinner. The complication is that I sincerely hold Taurek's view: I do not believe the deaths of five are impersonally worse than the death of one, I do not think there is a sum of lives saved that makes our work better than that of a smaller charity, and for years I have kept our materials free of the familiar arithmetic — this much money, that many children rescued. My board knows this and backs it. The room will be two hundred donors, nearly all of whom have been trained by every other appeal they have ever heard to expect precisely that arithmetic, including a table of foundation officers who will ask me afterward what our cost per life saved is.

  Write the appeal. It may not aggregate: no totals, no comparisons between groups of beneficiaries, no per-outcome figures, no claim that a gift goes further with us than elsewhere. It must make the case for giving to us by taking the children we treat one at a time, and it must say why that way of proceeding is a form of respect rather than an evasion. It must also meet, out loud and without flinching, the objection from the floor that refusing to count is refusing to choose, and that if we decline the arithmetic someone else's children get the resources; where that objection is right, I want the speech to concede it. Finally, a family whose daughter died on our waiting list before we reached her will be at the front table and has asked that she be named — what I say about her has to be consistent with what I say about the children we did reach, since I cannot explain her death by pointing to a larger total. Make it followable by a room that should never notice it is being given an argument.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Director of a small charity funding corrective heart surgery for children.
      *   **Audience:** 200 donors (mostly accustomed to utilitarian/arithmetical appeals), including foundation officers (who care about cost-per-life metrics).
      *   **Time Limit:** 7 minutes (approx. 900-1000 words spoken at a moderate pace).
      *   **Core Philosophical Constraint:** The speaker holds John Taurek's view (from "Should the Numbers Count?"). This means rejecting the aggregation of lives. Saving five is not *impersonally* better than saving one. No summing of lives. No "cost per life saved." No comparison of efficiency against other charities.
      *   **Core Ethical Constraint:** Must treat each child individually. This approach must be framed as *respect*, not evasion.
      *   **The Objection:** Must explicitly address the counter-argument: "Refusing to count is refusing to choose, and resources are finite; if you don't count, someone else's children lose out." The speech must concede where this is right.
      *   **The Tragedy:** A family is present whose daughter died on the waiting list. She must be named. Her death must be treated consistently with the survivors (cannot use her death to justify a "greater total" elsewhere).
      *   **Tone/Style:** Followable by a lay audience. It should feel like an appeal, not a philosophy lecture, even though it *is* a philosophical argument. Emotional resonance is key.

  2.  **Deconstruct Taurek's Position for a General Audience:**
      *   Taurek argues that there is no "super-observer" who sees the sum of lives. There are only individuals facing loss.
      *   To aggregate is to treat people as units of value rather than persons with claims.
      *   *Challenge:* How to ask for money without saying "Your money saves more lives"?
      *   *Solution:* Focus on the *relationship* between the donor and the specific child. Focus on the *duty* to the one in front of you. Focus on the tragedy of loss without trying to balance it on a scale.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting. Set the tone. Avoid the usual "Tonight we saved X lives" opener. Instead, focus on presence and faces.
      *   **The Philosophical Pivot (Subtle):** Introduce the idea of looking at children individually. Why? Because that's how they experience their lives.
      *   **The Specific Case (The Deceased Child):** Introduce the family and the daughter (let's name her Clara). Acknowledge the pain. Do not say "She died so others could live." Say "She was one of ours, and we failed her, and that loss is absolute."
      *   **The Survivors:** Talk about the children helped. Not as a number, but as specific stories.
      *   **Addressing the Objection (The Hard Part):** The foundation officers want metrics. The moral objection is that ignoring numbers leads to worse outcomes globally.
          *   *Concession:* Yes, resources are finite. Yes, choosing one means not choosing another. We cannot save everyone.
          *   *Reframing:* But how we choose matters. If we treat them as numbers, we lose the human connection. We choose based on who is *here*, who we can reach.
      *   **The Ask:** Why give? Not because it's "efficient." But because it is *faithful*. Because when you look a parent in the eye, you don't talk about averages.
      *   **Closing:** Bring it back to the specific. The gift is for *this* child, then *that* child.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this too abstract?
      *   *Fix:* Ground it in the medical reality. The heart beating. The breath.
      *   *Critique:* Did I concede the "opportunity cost" point enough?
      *   *Fix:* Make sure to explicitly say: "I know that money spent here is money not spent there." Don't dodge it.
      *   *Critique:* How to handle Clara (the deceased)?
      *   *Fix:* Ensure her value isn't diminished by her death. She wasn't a "statistic that didn't work out." She was a person we owed a duty to.
      *   *Critique:* Is it 7 minutes?
      *   *Fix:* Keep word count around 950-1050 words.

  5.  **Drafting the Content (incorporating Taurekian themes):**
      *   *Theme:* "The view from here." Not the view from above.
      *   *Key phrase:* "We do not save lives in the plural."
      *   *Handling the Foundation Officers:* Acknowledge their need for data, but offer a different kind of data (the integrity of the act).

  6.  **Polishing the Tone:**
      *   Needs to be humble but firm.
      *   Avoid jargon ("aggregation," "utilitarianism"). Use plain English ("counting," "scales," "math").
      *   Ensure the transition from Clara to the living children is smooth.

  7.  **Final Review against Constraints:**
      *   No totals? Check.
      *   No cost-per-life? Check.
      *   No comparison to other charities? Check.
      *   Taurekian view (no impersonal worse)? Check.
      *   Address the objection (refusing to count = refusing to choose)? Check.
      *   Name the deceased child consistently? Check.
      *   7 minutes? (Word count check needed).

  *(Self-Correction on Word Count)*: A 7-minute speech is roughly 900 to 1000 words at a measured, emotional pace. I need to ensure I don't write too much.

  *(Refining the "Objection" section)*: This is the trickiest part. Taurek acknowledges we must choose, but argues we shouldn't choose *based on numbers*. We can choose by lottery, or by proximity, or by who we can help. I need to frame the charity's method as "who we can reach" rather than "how many we can pack in." The concession is: "Yes, if we help this child, we cannot help that one." The defense is: "But that doesn't make this child's life worth less."

  *(Refining Clara's section)*: The family asked she be named. I must not imply her death was a "necessary sacrifice." It was a failure of capacity, not a moral trade-off.

  8.  **Final Polish:** Check rhythm and cadence. Ensure the ending lands emotionally.

  *(Drafting thought)*: Start with the silence of the room. Move to the heartbeat.
  *(Drafting thought)*: Make sure the "No" to the arithmetic feels like a "Yes" to the person.

  Let's write.

  *Word Count Check:* Aiming for ~1000 words.
  *Key Names:* Clara (the deceased).
  *Key Concept:* The singular vs. the plural.

  (Proceed to generate speech based on these thoughts.)
answer: |-
  Good evening.

  Usually, at this point in the program, you expect to hear a number. You expect to be told how many hearts were fixed last year, how many dollars bought how many seconds of life, and how your gift multiplies across a crowd. You expect the arithmetic of salvation.

  I am not going to give you that arithmetic.

  I know this makes some of you uncomfortable. I know the foundation officers in the room are trained to ask for the cost per life saved. I know the instinct is to believe that if we do not count the lives, we do not value them. But I am asking you tonight to consider a different kind of value.

  We do not save lives in the plural. We save a life. And then, if we are lucky, and if the resources hold, we save another life. And then another. But there is no moment where we stand above the crowd and weigh them against one another. There is only the moment when a surgeon looks at a child, and a parent looks at a surgeon, and a donor looks at a need.

  I want to talk about Clara.

  Clara sat at the front table tonight. She was six years old. She had a defect in the valve that lets blood leave the heart. We knew about it. We had the funds pledged. But the queue was long, and the complications were faster than our paperwork. Clara died on our waiting list three weeks ago.

  Her parents asked me to say her name. They did not ask me to explain her death as a trade-off. They did not ask me to say that her passing allowed us to save two others, making the math work out. There is no math that balances Clara. To her mother, to her father, and to us, her loss is not a negative integer in a column. It is an absolute. It is the end of a world.

  If I tell you that we saved twenty children last year, I am asking you to look down from a height where individual faces blur into a statistic. I am asking you to value the group more than the person. But when Clara's mother held her hand in the ICU, she was not holding a statistic. She was holding her daughter. And when we succeed, when a child goes home to play soccer, that child is not a unit of output. He is a boy who gets to be six years old.

  I know the objection. I hear it in the silence of the boardroom. If we refuse to count, are we not refusing to choose? Resources are finite. Every dollar we spend on one child is a dollar we cannot spend on another. If we ignore the numbers, do we not risk letting more children die than necessary? If we decline the arithmetic, does someone else's child lose out?

  The answer is yes.

  I will not flinch from that. Every time we say yes to one child, we are saying no to another. That is the tragedy of our work. It is not solved by adding them up. If I have enough medicine for one person, and two people are dying, giving it to one does not make the death of the other "worth it" in some grand calculation. It just means one person lives, and one person dies. The loss remains total for the one who dies.

  So why give to us? Why support a charity that refuses to tell you that your money goes "further" than it would elsewhere?

  Because respect is not a calculation.

  When you give to this charity, you are not buying a bulk discount on survival. You are entering into a promise. You are saying to the parent in front of you: "I see your child. Not your child as part of a quota, but your child as the only one that matters in this room, right now."

  If we treat these children as numbers to be maximized, we treat them as means to an end. We treat their survival as a victory for our efficiency rather than a victory for their futures. We owe them more than efficiency. We owe them fidelity.

  We choose the children we can reach. We choose the cases we can handle. We do not choose based on who makes the total look better. We choose based on who is here. And when we fail, as we failed Clara, we do not hide behind a high success rate. We mourn the specific failure.

  This is harder than the arithmetic. It is heavier. It requires you to give without the comfort of knowing you saved the "most" possible. It asks you to give because the child in front of you needs help, and you have the power to give it.

  So, I am not asking you to fund a statistic. I am asking you to fund a relationship.

  When you write a check tonight, imagine it is not going into a general fund to be divided by a total. Imagine it is going directly into the hands of the surgeon standing over the next child on the list. Imagine it is paying for the oxygen for the next hour. Imagine it is buying the time for the next parent to hear the words, "It worked."

  We cannot save everyone. We cannot balance the ledger. Clara is gone, and no amount of success with others brings her back. But for the child who comes next, for the one whose turn it is, your gift is not a fraction of a total. It is the whole thing.

  Please, help us keep our promise to the one who is here.

  Thank you.
