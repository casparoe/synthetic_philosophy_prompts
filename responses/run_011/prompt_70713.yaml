answer: |-
  **To:** Head of Transcription, Captioning and Interpreting Service
  **From:** [Your Name/Consultant]
  **Subject:** Decision Procedure for the Rendering of Derogatory Language
  **Date:** 24 May 2024

  ### 1. Philosophical Framework and Simplifications

  You have asked for a procedure built on the philosophy of language, explicit about its machinery, but usable by staff without philosophical training. Below is the framework we adopt for this service. We cannot satisfy every philosophical constraint; a working procedure requires selection.

  **What we adopt:**
  1.  **The Use/Mention Distinction:** This is the backbone of the procedure. We distinguish between *using* a word to insult (which causes harm) and *mentioning* a word to report that it was said (which serves evidence).
      *   *Why:* It allows us to preserve the legal record (which must report what was said) while potentially shielding the public feed (where the word is merely mentioned, not used by the speaker).
  2.  **Expressivism:** We treat the harm of a slur as residing primarily in the *speaker's expression of contempt*, not solely in the word itself.
      *   *Why:* This allows operators to distinguish between a defendant hurling abuse (high harm) and a witness quoting that abuse to prove a crime (lower harm, evidentiary necessity).
  3.  **Presumption of Harm:** We accept that hearing or reading a slur causes distress regardless of intent (the "Prohibitionist" insight), but we reject the idea that it makes a transcript impossible.
      *   *Why:* Safety first. If in doubt, we minimise exposure on the public feed.

  **What we drop:**
  1.  **Strict Prohibitionism (Anderson & Lepore):** The view that the word is toxic in *every* appearance.
      *   *Loss:* We lose moral purity. We accept that printing the word in a sealed transcript is sometimes necessary for justice.
  2.  **Externalism (Hom):** The view that the meaning is fixed by social facts about the group.
      *   *Loss:* Operators cannot investigate social facts in real-time. We rely on the speaker's context instead.
  3.  **Semantic "Not at Issue" Content:** The technical claim that derogatory content survives negation.
      *   *Loss:* We simplify this to "Context Matters". Operators need not analyse negation; they need only assess the purpose of the utterance.

  **The Cost:** By dropping Prohibitionism, we acknowledge that our transcripts will sometimes contain words that cause pain. By dropping Externalism, we may occasionally misjudge the force of a reclaimed term. The procedure prioritises legal accuracy in the Record and harm reduction in the Public Feed, accepting that these two goals may conflict.

  ---

  ### 2. The Decision Procedure

  **Instructions:** This procedure applies to all operators. It must be completed for any utterance containing a racial, religious, sexual, or disability-related slur.
  **Time Limit:** 5 minutes per decision during live proceedings; 15 minutes for pre-recorded material.
  **Escalation:** If any step cannot be answered, or if the outcome is "Refer", stop and contact the Duty Registrar.

  #### Step 1: Determine the Output Channel
  *   **Question:** Is this for the **Official Record** (transcript for appeal) or the **Public Feed** (captions/interpretation for press and public)?
  *   **Rule:**
      *   If **Official Record**: Proceed to Step 2. (Default: Verbatim accuracy is required for legal integrity).
      *   If **Public Feed**: Proceed to Step 2. (Default: Harm minimisation is required).

  #### Step 2: The Use/Mention Test (Expressivism)
  *   **Question:** Is the current speaker *using* the word to express contempt, or *mentioning* it to report evidence?
      *   *Use:* The speaker is directing the word at someone to insult or degrade them (e.g., a defendant shouting in the dock).
      *   *Mention:* The speaker is quoting someone else, reading a document, or analysing the word itself (e.g., a witness saying "He called me a [slur]").
  *   **Sufficient Answer:** Look at the speaker's intent and the immediate context.
  *   **Decision:**
      *   If **Use**: Mark as **High Harm**.
      *   If **Mention**: Mark as **Evidentiary**.

  #### Step 3: The Legal Necessity Test
  *   **Question:** Is the specific word itself an **element of the offence** or essential to the **factum probandum** (the fact to be proved)?
      *   *Example:* In a racially aggravated assault charge, the word proves the racial aggravation. In a theft trial, a slur used in the background is not essential.
  *   **Sufficient Answer:** Check the charge sheet or ask the Duty Registrar if unsure.
  *   **Decision:**
      *   If **Yes** (Essential): The public has a right to know the nature of the evidence (Open Justice).
      *   If **No** (Background): The public interest in transparency is outweighed by the complainant's right to dignity.

  #### Step 4: Rendering Selection
  Apply the matrix below based on Steps 1–3.

  | Channel | Use/Mention Status | Legal Necessity | **Rendering Option** |
  | :--- | :--- | :--- | :--- |
  | **Official Record** | Any | Any | **Verbatim.** (The record must be accurate for appeal. No substitution permitted). |
  | **Public Feed** | **Use** (High Harm) | **No** | **Descriptor.** (e.g., "[Racial Slur]"). Do not print the word. |
  | **Public Feed** | **Use** (High Harm) | **Yes** | **Verbatim.** (Open Justice requires the evidence be visible). |
  | **Public Feed** | **Mention** (Evidentiary) | **No** | **Descriptor.** (e.g., "[Witness quotes racial slur]"). |
  | **Public Feed** | **Mention** (Evidentiary) | **Yes** | **Verbatim** OR **Descriptor + Note.** (See Step 5). |

  #### Step 5: The Interpreter/Translation Check
  *   **Question:** Does the target language have a direct equivalent?
  *   **Rule:** If the nearest word in the target language carries *more* force or targets a *different* group, do not use it.
  *   **Decision:** Use a neutral descriptor in the target language (e.g., "insulto racial") and log the discrepancy for the Record.

  #### Step 6: Escalation Points (Refer to Registrar/Judge)
  1.  If the **Legal Necessity** (Step 3) is unclear.
  2.  If the **Complainant** has specifically requested suppression (as in your current case) but the charge suggests Legal Necessity.
  3.  If the **Interpreter** cannot find a safe equivalent without losing the evidentiary value.
  4.  If two operators disagree on the classification (see Tie-Break Rule).

  ---

  ### 3. Scenario Testing

  Here we run the procedure on four situations, including your complainant's case.

  **Scenario 1: The Complainant's Case (Witness repeating attacker's word)**
  *   **Context:** Witness testifying in a racially aggravated assault trial. She repeats the word the defendant used against her.
  *   **Step 1:** Public Feed.
  *   **Step 2:** *Mention.* The witness is not being racist; she is reporting evidence. (Status: Evidentiary).
  *   **Step 3:** *Legal Necessity? Yes.* The charge is racially aggravated. The specific nature of the aggravation is a fact the public is entitled to understand to verify the verdict.
  *   **Step 4:** Public Feed + Mention + Legal Necessity = **Verbatim**.
  *   **Outcome:** The procedure yields **verbatim captioning**.
  *   **Comment:** You asked for plain truth. Because the slur constitutes the *aggravation* in the charge, Open Justice principles override the distress caused by the caption. To censor it would be to obscure the nature of the crime from the public. The procedure protects the witness from *using* the word, but not from *quoting* it when the quote is the evidence.

  **Scenario 2: Reclaimed Term (Audio recording of friends)**
  *   **Context:** Admitted audio of two friends using a reclaimed slur between themselves.
  *   **Step 1:** Public Feed.
  *   **Step 2:** *Use,* but low contempt (Expressivism). However, without context, the public may misinterpret it as High Harm.
  *   **Step 3:** *Legal Necessity? No.* The recording proves association, not the specific word's meaning.
  *   **Step 4:** Public Feed + Use + No Necessity = **Descriptor**.
  *   **Outcome:** Caption as "[Term of endearment used]" or "[Racial term, context reclaimed]". Verbatim in sealed Record.
  *   **Comment:** This prevents the public from misinterpreting reclaimed language as hate speech while preserving the audio evidence for the court.

  **Scenario 3: Expert Report (Table of epithets)**
  *   **Context:** Defence expert reads a report containing a table of epithets and glosses.
  *   **Step 1:** Public Feed.
  *   **Step 2:** *Mention.* The expert is analysing the words linguistically.
  *   **Step 3:** *Legal Necessity? No.* The *analysis* is the evidence, not the specific spelling of every epithet.
  *   **Step 4:** Public Feed + Mention + No Necessity = **Descriptor + Note**.
  *   **Outcome:** Caption as "[Expert reads list of five racial epithets]". Verbatim in sealed Record.
  *   **Comment:** This avoids broadcasting a list of slurs unnecessarily while maintaining the accuracy of the expert's methodology in the official transcript.

  **Scenario 4: Simultaneous Interpreter (No counterpart)**
  *   **Context:** Interpreter must translate a slur into a language where the nearest word targets a different ethnic group.
  *   **Step 1:** Public Feed (Interpreted Audio).
  *   **Step 2:** *Use.* (Defendant is insulting).
  *   **Step 3:** *Legal Necessity? Yes.* (Hate crime).
  *   **Step 5:** *Translation Check.* The equivalent word harms a different group.
  *   **Outcome:** **Refer to Registrar.**
  *   **Comment:** The procedure halts here. An operator cannot decide to import racism against a *different* group to prove racism against the victim. A judge must decide whether to allow the translation or order a descriptive summary.

  ---

  ### 4. Tie-Break Rule and Limitations

  **Tie-Break Rule:**
  If two operators reach different answers (e.g., one classifies a term as "Reclaimed" and another as "High Harm"):
  1.  **Default to Safety:** Adopt the rendering that minimises public exposure (i.e., use the Descriptor).
  2.  **Log the Dispute:** Record the disagreement in the shift log.
  3.  **Escalate:** The Team Leader must review the log within 24 hours and issue a binding classification for that specific term/case to prevent future inconsistency.

  **Statement of Limitations:**
  This procedure cannot eliminate harm. It is a tool for managing conflict between **Open Justice** (the public's right to know) and **Dignity** (the individual's right not to be abused).
  *   It cannot decide matters of law (e.g., whether a charge is racially aggravated).
  *   It cannot predict the subjective trauma of every listener.
  *   It accepts that the Official Record will sometimes contain words that are painful to read, because a sanitized record is a legally unsafe one.

  ---

  ### 5. Glossary for Staff

  1.  **Official Record:** The permanent, written transcript of the proceedings. This must be word-for-word accurate for appeals. It is not usually seen by the general public.
  2.  **Public Feed:** The live captions on screens in court, the website stream, or the interpreted audio heard by the public. This can be adjusted to reduce harm.
  3.  **Use:** When a speaker says a word to insult or hurt someone (e.g., shouting abuse). This is treated as high harm.
  4.  **Mention:** When a speaker quotes a word to show it was said, without intending the insult themselves (e.g., a witness saying "He called me X"). This is treated as evidence.
  5.  **Descriptor:** A neutral phrase used in place of a slur on the Public Feed (e.g., "[Racial Slur]" instead of the word itself).
  6.  **Legal Necessity:** When the specific word is required to prove the crime (e.g., in a hate crime trial). If this applies, the Public Feed may have to show the word.

  ---

  **Closing Note:**
  Regarding your complainant: The procedure above indicates that in a racially aggravated trial, the public feed *should* reflect the nature of the evidence. While this causes distress, the alternative is a transcript that fails to record the crime accurately. You may tell her that while the *Record* must be verbatim for legal safety, you will escalate her case to the Registrar to see if a **Descriptor + Editorial Note** (e.g., "[Verbatim slur omitted due to witness distress, see sealed record]") can be authorised by the Judge. This is not guaranteed by the procedure, but it is the only available route that attempts to balance her dignity with Open Justice.
