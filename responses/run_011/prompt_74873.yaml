  # The Pleasure Sorting Instrument

  **Instructions:** Answer the following questions in order. Skip branches as directed. Do not worry about consistency; answer based on your immediate intuition about the case described.

  ### Q1: The Pun and the Massage
  Think of a clever pun that made you laugh last week. Think of a deep-tissue massage you enjoyed last year. When you recall the "pleasantness" of each, is there a specific sensory ingredient (a warmth, a tingle, a glow) that is present in *both* memories, or is the similarity only that you didn't want either experience to stop at the time?
  *   **A:** There is a common sensory ingredient. → **Go to Q2**
  *   **B:** There is no common ingredient; they just share a "like" status. → **Go to Q3**

  ### Q2: The Identical Glass of Water
  You drink a glass of ice water on a hot July afternoon (glorious) and the same water in a cold January room (faintly disgusting). On the July afternoon, is the "glory" a distinct sensation added to the coldness (like a flavor), or is it simply your body's relation to the coldness changing?
  *   **A:** It is a distinct sensation added to the cold. → **Leaf 1**
  *   **B:** It is a change in relation/stance, not a new sensation. → **Leaf 2**

  ### Q3: The Friend's Job
  You hear a close friend got their dream job. You feel a lift in your mood, but there is no specific bodily sensation or "buzz." Is this lift "pleasure" in the same fundamental category as the taste of chocolate?
  *   **A:** Yes, it is pleasure, even without a bodily buzz. → **Go to Q4**
  *   **B:** No, that is "satisfaction" or "gladness," but not pleasure proper. → **Go to Q5**

  ### Q4: The Pain That Doesn't Bother
  A patient takes an analgesic that leaves the pain signals intact but removes the suffering. They say, "The pain is there, but it doesn't bother me." Did the pleasure return, or did the displeasure just leave?
  *   **A:** The displeasure left; pleasure is just the absence of this "bother" attitude. → **Leaf 3**
  *   **B:** The pain sensation is still unpleasant; the "bother" is a separate layer. → **Leaf 4**

  ### Q5: The Drug-Induced High
  A drug induces a euphoric buzz with no object whatsoever (you aren't happy *about* anything, you just buzz). Is this the purest form of pleasure, or a meaningless sensation until you attach a thought to it?
  *   **A:** It is the purest form of pleasure. → **Leaf 2** (Re-join Natural Kind path)
  *   **B:** It is meaningless without an object/attitude. → **Go to Q6**

  ### Q6: The Bored Continuation
  Imagine you are undergoing a necessary medical scan. You desperately want the scan to continue because it ensures your health, but you are profoundly bored and feel no enjoyment during it. Are you experiencing pleasure?
  *   **A:** Yes, because I am getting what I want. → **Leaf 5**
  *   **B:** No, wanting and enjoying are different. → **Go to Q7**

  ### Q7: The Thrill Ride Mirror
  You are on a rollercoaster. You are terrified and want it to end *right now*, yet you would describe the experience as "pleasurable" or "thrilling" while it is happening. Is the pleasure located in the desire to continue, or in the intensity of the experience itself?
  *   **A:** Pleasure requires a desire for it to continue. → **Leaf 5** (Confirm Desire)
  *   **B:** Pleasure can exist even if I want it to stop (due to fear/intensity). → **Go to Q8**

  ### Q8: The Meta-Pleasure
  You are watching a sunset. You notice you are enjoying it, and that realization makes you happier. Is this second happiness a *new* pleasure layered on top of the first, or just the same pleasure intensifying?
  *   **A:** It is a new, higher-order attitude toward the first experience. → **Leaf 6**
  *   **B:** It is the experience itself commanding "more of this." → **Leaf 7**
  *   **C:** Drawing this distinction feels like splitting hairs; the word isn't doing work. → **Leaf 8**

  ---

  # The Leaves (Positions)

  **Leaf 1: Single-Common-Feel (Sensory Hedonism)**
  *   **Definition:** Pleasure is a specific, introspectible qualitative feel (qualia) that accompanies certain experiences.
  *   **Status:** **Named.** (Classic Hedonism).
  *   **Coherence:** High, but struggles with heterogeneity (Q1).

  **Leaf 2: Natural Kind / Property Cluster**
  *   **Definition:** Pleasures are a biological kind (e.g., opioid system activation) without a shared phenomenology. The water feels different in July, but the underlying "reward" signal is the same.
  *   **Status:** **Named.** (Neuroscience-friendly).
  *   **Coherence:** High for measurement, low for first-person authority.

  **Leaf 3: Attitudinal / Propositional Hedonism (Feldman)**
  *   **Definition:** Pleasure is a pro-attitude toward a state of affairs. It is not a feeling, but a "being pleased that..."
  *   **Status:** **Named.** (Feldman, Crisp).
  *   **Coherence:** High. Handles objectless cases (Q5) by denying them as pleasure.

  **Leaf 4: Family Resemblance / Disjunctivism**
  *   **Definition:** There is no single essence (sensory or attitudinal). "Pleasure" covers a cluster of overlapping experiences with no common thread.
  *   **Status:** **Named.** (Wittgensteinian).
  *   **Coherence:** High descriptively, low for theory building.

  **Leaf 5: Desire / Preference Satisfaction**
  *   **Definition:** Pleasure is identical to, or constituted by, the satisfaction of desire or the motivation to continue an experience.
  *   **Status:** **Named.** (Economic/Behaviorist).
  *   **Coherence:** High for measurement, low for phenomenology (fails Q7 for some).

  **Leaf 6: Higher-Order Attitude (HOA)**
  *   **Definition:** Pleasure is wanting to have the experience one is currently having. Distinct from the experience itself.
  *   **Status:** **Named.** (Rosenthal, some Neo-Hedonists).
  *   **Coherence:** Moderate. Distinguished from Imperative only by structural hierarchy.

  **Leaf 7: Imperative / "More of This" Content**
  *   **Definition:** Pleasure is an experience with intrinsic imperative content ("More of this!"). Not a desire *about* the experience, but a command *within* it.
  *   **Status:** **Named.** (Parfit, Heathwood).
  *   **Coherence:** Moderate. Functionally similar to HOA.

  **Leaf 8: Full Deflationism**
  *   **Definition:** "Pleasure" is a folk-psychological placeholder that fractures under analysis. It should be dropped from wellbeing theory in favor of specific metrics (affect, satisfaction, function).
  *   **Status:** **Unnamed** (Often implicit in eliminativism).
  *   **Coherence:** High for policy, low for humanistic theory.

  **Leaf 9: Unoccupied / Incoherent (The "Objectless Attitude" Trap)**
  *   **Definition:** The view that pleasure is an attitude (like Leaf 3) but that the Drug High (Q5) counts as pleasure *without* an object.
  *   **Status:** **Unoccupied.**
  *   **Coherence:** **Incoherent.** If pleasure is propositional ("pleased that X"), an objectless state cannot be pleasure. Respondents landing here usually shift to Leaf 2 or Leaf 1.

  **Leaf 10: Unoccupied / Unattractive (The "Sensory Disjunctivist")**
  *   **Definition:** The view that there is no common sensory feel (Q1-B) but that the Water case (Q2) is still purely sensory (Q2-A).
  *   **Status:** **Unoccupied.**
  *   **Coherence:** **Unattractive.** Posits sensory heterogeneity without moving to a relational/biological account. Theoretically unstable.

  ---

  # Confidence Assessment

  ### 1. Distinctness of Leaves
  **Confidence: Moderate (60%).**
  I am reasonably sure that Leaves 1, 3, 5, and 8 are genuinely distinct positions with different commitments regarding ontology and measurement. Leaf 2 (Natural Kind) is distinct from Leaf 1 (Sensory Feel) but often conflated by neuroscientists who assume the biological kind *produces* the single feel.
  However, **Leaves 6 (HOA) and 7 (Imperative)** are functionally identical for almost all practical purposes. Both locate the "hedonic" element in a conative stance toward the experience rather than the raw feel. Distinguishing them requires a metaphysical commitment about whether the "wanting" is a separate mental state (HOA) or intrinsic content of the first state (Imperative). In a workshop setting, participants will likely answer Q8 identically for both. I have separated them because the literature treats them as distinct, but empirically, they may be one view wearing different hats.

  ### 2. The Weakest Branch Question
  **Least Certain Split: Q7 (The Thrill Ride Mirror).**
  *Question:* "You are terrified and want it to end... yet describe it as pleasurable. Is the pleasure located in the desire to continue, or in the intensity?"
  *Reasoning:* I suspect this question manufactures a distinction no real respondent will feel. In high-arousal negative states (terror), the phenomenology of "wanting it to stop" and "finding it intense/pleasurable" are often tangled. Respondents who want to defend Desire Theory (Leaf 5) will simply deny the premise ("If I wanted it to stop, I wasn't enjoying it"), while Hedonists will assert the feeling exists regardless of desire. It is difficult to construct a case where "enjoyment" and "concurrent desire for cessation" are phenomenologically transparent enough to force a split between Leaf 5 and Leaf 6/7. It is likely that Q7 merely reinforces Q6 rather than creating a new branch, making the tree shallower than designed.
