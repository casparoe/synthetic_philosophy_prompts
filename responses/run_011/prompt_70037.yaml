answer: |-
  You strike hard at the truth of human nature, and I do not withdraw from it. I never claimed that men in assemblies are led by reason; I claimed only that the state must be constructed as if they were not. When I say passions cancel out, I do not mean they vanish into rationality, but that in a large council, no single private affect can dominate the whole unless it is common to all. You call this plumbing; I call it arranging power so that right equals power. If a man seeks his own advantage against the common good, the laws must make that path more painful than the path of cooperation. This is not a concession that reason is absent, but an acknowledgment that hope and fear are the reins by which the multitude is led. Your calculation of incentives is merely a description of how the affects of hope and fear are distributed across the body politic.

  You ask if democracy is merely differently piped aristocracy. I say it is more natural because it approaches the equality of the state of nature, where no man is by nature subject to another. In an aristocracy, the patricians must be constrained to prevent them from crushing the plebs, which risks sedition and diminishes the power of the state. In a democracy, the sovereign is the whole body, so the laws cannot be contrary to the common desire without destroying the sovereign itself. The aggregation you distrust is precisely the source of stability; if the multitude agrees on a law, it has the power to enforce it. If only a faction agrees, the state relies on force, which weakens it. Thus, the "plumbing" of democracy is not to constrain the multitude, but to ensure the multitude's power is expressed without fracturing, making it more free because the resistance of the individual *conatus* against the law is minimized.

  Regarding your city of 400,000. The selection of 150 by lot and their payment is wise; it ensures that the *conatus* of the poor is not excluded, and the lot prevents the factionalism of election. Here, the deliberation may indeed filter out the violent affects, as men in a room must accommodate one another to reach a decision. But your referendum is the weak link. To allow the whole multitude to vote yes or no without amendment is to invite the very mob passion I warn against in the *Theological-Political Treatise*. The 150 may deliberate, but the 400,000 will feel. Who briefs these 150? If the permanent staff control the information, they hold the power. Tell me, who selects the staff, and by what affect are they moved?
