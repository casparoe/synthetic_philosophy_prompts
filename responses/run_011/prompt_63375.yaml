answer: |-
  ### Unit Assessment: Environmental History and Causation
  **Time Allowed:** 50 Minutes  
  **Instructions:** Answer the question below using only the provided source packet. Do not refer to outside historical examples, authors, or theories.

  #### Source Packet: The Collapse of Veridia (1630–1645)

  **Source A: Sediment Core Analysis from Veridia River Basin (1998)**
  Geochemical analysis of riverbed layers indicates a significant reduction in water flow beginning in 1631, reaching peak severity in 1634–1635. Flow rates returned to average levels by 1640. The report notes that similar reductions occurred in 1590 without evidence of societal disruption.

  **Source B: Letter from Merchant Elias Thorne to Partner (1634)**
  "The wasting cough moves through the dockworkers faster than the dryness moves through the grain. We have lost forty men this month. The Guild masters say the air is poisoned, but I say the grain stores are locked by order of the Magistrate while the poor starve. Nature brings the drought; men bring the famine."

  **Source C: Magistrate's Decree on Grain Reserves (1633)**
  "In view of the plentiful harvests of the previous decade, all municipal grain reserves are to be sold to foreign buyers to replenish city coffers. Future reserves shall be maintained at minimum levels until further notice." (Decree revoked in 1636 following public unrest.)

  **Source D: Tax Records from Highfield, a Neighboring City (1630–1645)**
  Highfield is located in the same climatic zone as Veridia, fifty miles upstream. Tax records show a 10% decline in trade revenue during 1634–1635, followed by a 15% increase in 1636–1640. No emergency relief was requested during this period.

  **Source E: Diary Entry of a Veridia Schoolmaster (1635)**
  "It is the will of heaven that we suffer. Yet I wonder why the Guilds struck when the barges were empty. Perhaps if they had waited, the rain would have come sooner. Or perhaps their anger hastened the Magistrate's flight."

  ***

  *Historiographical Note: This fictional case stands in for real debates regarding climatic determinism (e.g., Huntington) versus materialist environmental history (e.g., McNeill/Diamond), and the ethical implications of assigning agency to non-human forces.*

  ***

  #### Essay Question

  Historians sometimes describe drought or disease as "actors" in history. Using the evidence provided, assess whether the environmental stresses facing Veridia should be treated as **sufficient causes** of its collapse or as **conditions** within which human decisions operated. In your response, consider whether calling a non-human factor an "actor" clarifies historical explanation or obscures questions of responsibility.

  ***

  ### Model Answer

  The collapse of Veridia cannot be explained by environmental stress alone. While the sediment core confirms a drought occurred, treating this non-human factor as a sufficient cause ignores the evidence of human policy failure. To argue that drought caused the collapse is to make a claim about sufficiency: that no human decision could have altered the outcome. Source D disproves this. Highfield endured the same climatic zone and similar trade declines without collapsing. Therefore, the drought was a condition, not a sufficient cause. If the environment were truly sufficient, Highfield would have suffered the same fate. The distinction matters because identifying a non-human cause does not automatically grant it explanatory priority over human choices.

  The evidence suggests human decisions turned a manageable stress into a catastrophe. Source C reveals that the Magistrate sold grain reserves just before the drought peaked. This was not forced by nature; it was a financial choice made during plentiful years. Source B supports this, distinguishing between the drought (nature) and the famine (men). Thorne argues that the locked grain stores killed people, not the dryness itself. If historians treat the drought as the primary actor, they risk accepting the Magistrate's implicit defense: that the collapse was inevitable. Holding the drought responsible dissolves the responsibility of the officials who emptied the reserves. Thus, acknowledging a non-human cause (Claim 1) must not slide into accepting sufficiency (Claim 2) or absolving responsibility (Claim 4).

  However, calling a pathogen or drought an "actor" requires careful definition. If "actor" implies intention—the ability to anticipate, negotiate, or blame—then the drought is not an actor. Source E shows the schoolmaster struggling with this, attributing will to heaven while noting human strikes. Using thick, intention-shaped language for thin causal forces confuses the explanation. A virus does not intend to kill; it simply replicates. Humans intend to store grain or sell it. When historians say "the drought destroyed Veridia," they use a metaphor that smuggles agency into a process that lacks it. This obscures the specific mechanisms of failure. The drought provided the stress; the policy provided the failure.

  Finally, the political dimension of this distinction is crucial. Older climatic determinism was often tied to racial theory, suggesting some peoples were unfit for certain climates. Modern environmental history rejects this, yet it faces a different trap. Even an anti-racist, geography-based argument can let human choices drop out. If we say the climate caused the collapse, we protect the elites who made the decisions. Source B's merchant knows this: he acknowledges the drought but blames the Magistrate. A responsible history must acknowledge the environmental constraint without granting it sovereignty. The drought made Veridia vulnerable, but the Magistrate made Veridia fail.

  In conclusion, the environmental factors were real causes but not sufficient ones. Calling them "actors" is useful only if it denotes a source of change, not an intentioned agent. To treat them as sufficient is to ignore the counter-evidence of Highfield and the evidence of policy failure in Veridia. Historians must hold the tension: nature sets the stage, but humans write the script. Responsibility remains with the scriptwriters.

  *(718 words)*

  ***

  ### Marking Scheme (25 Marks)

  **A. Use of Evidence (5 Marks)**
  *   **5:** Integrates at least three sources to support a specific argument (e.g., using Highfield to disprove sufficiency).
  *   **3-4:** Uses sources descriptively but links them weakly to the argument.
  *   **0-2:** Restates packet contents without analysis or ignores key sources (e.g., ignores Highfield).

  **B. Conceptual Distinction: Cause vs. Sufficiency vs. Responsibility (10 Marks)**
  *   **9-10 (A Range):** Explicitly distinguishes between "a cause" and "a sufficient cause." Explains that showing human agency was *constrained* does not prove it was *irrelevant*. Articulates what a determinist would need to prove (e.g., Highfield also collapsed) to earn the claim of sufficiency.
  *   **6-8 (B Range):** Argues that "both nature and humans mattered" (interactionism) but fails to define sufficiency. Accepts that drought was a cause but does not explain why it wasn't the *only* cause.
  *   **0-5:** Collapses the distinctions. Assumes showing drought existed proves it caused the collapse.

  **C. Analysis of "Actor" Language (5 Marks)**
  *   **5:** Engages with the difference between thin causality (source of change) and thick agency (intention/negotiation). Notes the risk of metaphorical language obscuring mechanism.
  *   **3-4:** Notes that nature doesn't have feelings but doesn't explore the historiographical consequence of calling it an "actor."
  *   **0-2:** Treats "actor" as a synonym for "cause" without qualification.

  **D. Political and Ethical Nuance (5 Marks)**
  *   **5:** Recognizes that erasing agency protects elites (responsibility) and notes that modern environmental arguments can still be exculpatory even if not racist.
  *   **3-4:** Identifies that determinism can be racist but treats modern environmental history as automatically virtuous.
  *   **0-2:** Assumes acknowledging climate is always a way of letting humans off the hook, or vice versa.

  **Specific Deductions (Mistakes)**
  *   **-3 Marks:** The "Both-Sides Compromise." (e.g., "It was half nature, half people.") *Reason: Fails to engage with the logical incompatibility of sufficiency.*
  *   **-3 Marks:** Constrained = Irrelevant. (e.g., "Since they couldn't stop the rain, their choices didn't matter.") *Reason: Misunderstands agency under constraint.*
  *   **-3 Marks:** Climate = Absolution. (e.g., "Because there was a drought, the Magistrate isn't to blame.") *Reason: Confuses causal factor with moral exoneration.*
  *   **-5 Marks:** Restating the Packet. (e.g., Listing sources A-E in order.) *Reason: No argument constructed.*

  **A vs. B Distinction**
  *   **B Answer:** Competently argues that nature and humans interacted. Uses evidence to show both were present. Concludes that "many factors led to collapse."
  *   **A Answer:** Argues that nature was a *condition* and humans were the *cause of the collapse specifically*. Uses the Highfield counter-example to define the limits of environmental causation. Explicitly separates the existence of a cause from the assignment of responsibility.

  ***

  ### Mediocre Student Answer (Annotated)

  **Student Response:**
  "The sources show that Veridia had a hard time because of the drought and the sickness. Source A says the water went down, and Source B says people got sick. But Source C shows the Magistrate made a bad choice with the grain. So it was not just the weather. Highfield did okay, which proves the weather was not everything. I think calling nature an actor is okay if you mean it changed things. But humans are responsible for the rules. So really it was half nature and half people working together."

  **Annotation:**
  *   **Marks Earned:** 14/25.
      *   *Evidence (3/5):* Uses Sources A, B, C, D but mostly descriptively.
      *   *Conceptual (5/10):* Identifies Highfield as counter-evidence (good) but falls into the "half nature, half people" compromise (bad).
      *   *Actor Language (2/5):* Accepts "actor" without analyzing the intention/negotiation distinction.
      *   *Politics (4/5):* Acknowledges human responsibility but misses the nuance on modern determinism.
  *   **Marks Lost:** Primarily in Conceptual Distinction and Actor Language.
  *   **Critical Error:** The sentence **"So really it was half nature and half people working together"** shows the student collapses the distinction between necessary conditions and sufficient causes, opting for a safe compromise rather than an argument about priority.
