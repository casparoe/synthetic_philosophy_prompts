prompt: |-
  We run an internal forecasting thing at work — a couple hundred people submit probability estimates on stuff like whether a supplier ships on time, whether a product hits its launch date, whether a regulatory filing gets cleared. The pitch was that the aggregrate would beat any single manager's guess. Most of the time it does. But twice now it's been confidently, spectacularly wrong, and both post-mortems came back with basically the same story: everyone had been reading the same two industry newsletters, and people could see the running average before they locked in their own number.

  Before I go redesign the thing, I want to know what I should even be asking of a theory in this area. So: write out the desiderata — what any adequate account of when aggregated crowd judgment is reliable, and when it degrades into herding, actually has to deliver. The phenomena it must explain, the cases it must get right, the distinctions it's not allowed to collapse, the formal results it has to stay consistent with, and what would count as evidence for or against it. Give me the motivating case or concrete scenario behind each requirement, not just the requirement in the abstract.

  Then sort them: which are non-negotiable, and which are really just the taste of one camp. Like — do you have to insist every participant is a fully coherent Bayesian reasoning about everyone else's reasoning about everyone else, or can a bounded, heuristic-level account clear the same bar? Is "the theory must be able to tell you how to fix the institution" a desideratum or a category error?

  And I most want to know whether some subset of the list is jointly unsatisfiable. Specifically: does making each individual rational given what they can actually observe automatically rule out the aggregate tracking the truth? And can observational data of the kind we have — actions and numbers, not anyone's private information — ever distinguish a cascade from a crowd that just happened to be right together? If the list itself knocks candidates out before you even start comparing them, that's the result I'm after.

  Last thing, keep it short: a paragraph each on how the three families I know of fare against your list — the Bayesian cascade/herding models, the repeated-averaging network-learning models, and the "wisdom of crowds needs diversity, independence, decentralization and a decent aggregation rule" checklist view. The criteria are the deliverable though; the scorecard is just so I know what I'm choosing between.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Internal corporate forecasting system (prediction market/survey hybrid). Works well usually, failed spectacularly twice due to common information sources (newsletters) and visibility of running averages (herding).
      *   **Task:** Define *desiderata* for a theory of aggregated crowd judgment (reliability vs. herding).
      *   **Requirements:**
          *   List phenomena, cases, distinctions, formal results, and evidence types.
          *   Provide motivating cases/scenarios for each (no abstract-only requirements).
          *   Sort into "Non-negotiable" vs. "Taste/Camp".
          *   Address specific questions: Bounded rationality vs. full Bayesian? Prescriptive (fix the institution) vs. descriptive?
          *   Address impossibility results: Does individual rationality rule out aggregate truth? Can observational data distinguish cascades from correct crowds?
          *   Evaluate three specific theory families against the list (Bayesian cascade, Network learning, Surowiecki-style checklist).
          *   **Constraint:** Keep it short (paragraph each for the evaluation section, overall conciseness preferred).

  2.  **Drafting the Desiderata (The "What"):**
      *   Need to capture *why* it worked most of the time and *why* it failed those twice.
      *   *Requirement 1: Common Knowledge vs. Private Signal.* The theory must distinguish between independent errors and correlated errors. *Scenario:* Two analysts missing a shipment delay because they both read the same optimistic newsletter vs. one missing it due to local warehouse noise.
      *   *Requirement 2: Sequential vs. Simultaneous.* Visibility of others' guesses changes behavior. *Scenario:* Seeing a 90% probability average makes you adjust your 60% private guess up, even if your private info is strong.
      *   *Requirement 3: Information Aggregation Efficiency.* When does the sum exceed the parts? *Scenario:* The average beats the CEO's guess 80% of the time.
      *   *Requirement 4: Path Dependence.* Early signals locking in later behavior. *Scenario:* The first five people guess "Delay," so the next fifty ignore their own "On Time" signals.
      *   *Requirement 5: Identification.* Can we tell the difference from the outside? *Scenario:* A 95% consensus that turns out true vs. a 95% consensus that turns out false (looks identical until resolution).

  3.  **Sorting and Impossibility Questions (The "Sort" & "Conflict"):**
      *   *Non-negotiable:* Must explain correlation of errors (common source), must handle sequential updating (visibility), must be consistent with basic probability (no Dutch books).
      *   *Taste:* Full Bayesian rationality vs. Heuristics. (Bounded is fine if it predicts the collapse). Prescriptivity (fixing the institution) is a *use case*, not a theoretical necessity, but highly desirable for the user.
      *   *Impossibility/Conflict:*
          *   *Individual Rationality vs. Aggregate Truth:* Yes, this is the core of Information Cascades (Bikhchandani et al.). If it's rational to ignore private info given public history, the aggregate stops tracking truth. So, individual rationality *can* rule out aggregate truth in specific structural conditions (sequential, observable actions).
          *   *Observational Identification:* This is hard. Ex-ante, a cascade and a correct consensus look identical (high agreement). Ex-post, you see the error. But structurally, you need variance in signal strength or timing to distinguish. Pure observational data of *outcomes* alone struggles without exogenous variation in information structure.

  4.  **Evaluating the Three Families (The "Scorecard"):**
      *   *Bayesian Cascade:* Good at explaining the failure (herding), bad at explaining the success (diversity), assumes too much rationality.
      *   *Network Learning (DeGroot/etc.):* Good at averaging, bad at explaining sudden collapses due to common sources, often assumes fixed weights.
      *   *Surowiecki Checklist:* Good heuristic for design, bad at formal prediction, doesn't model the *mechanism* of failure well.

  5.  **Refining and Condensing (The "Edit"):**
      *   *Tone:* Professional, analytical, direct.
      *   *Structure:*
          1.  Desiderata (with scenarios).
          2.  Sorting (Non-negotiable vs. Taste).
          3.  Impossibility/Identification constraints.
          4.  Theory Family Evaluation (3 paragraphs).
      *   *Check:* Did I answer the specific question about "individual rationality vs. aggregate truth"? Yes. Did I answer "can observational data distinguish"? Yes.
      *   *Constraint Check:* "Keep it short." I need to be punchy. Avoid long introductions.

  6.  **Drafting Content (Iterative refinement):**

      *   *Desiderata:*
          1.  **Correlated Error Structure:** Must distinguish independent noise from common-mode failure. *Scenario:* Your system works until two newsletters dominate; the theory must model the newsletters as a single shared signal, not N independent ones.
          2.  **Sequential Visibility:** Must account for how seeing prior estimates alters private signal weighting. *Scenario:* Analyst B sees Analyst A's 90% estimate and downweights their own contrary warehouse data to avoid looking like an outlier.
          3.  **Ex-Ante Indistinguishability:** Must acknowledge that high-confidence herds and high-confidence truth look identical before resolution. *Scenario:* A 95% consensus on a launch date looks the same whether it's based on 100 private inspections or 100 people copying the first guy.
          4.  **Bounded Rationality Compatibility:** Must not require infinite recursive reasoning to explain basic herding. *Scenario:* A junior analyst copies the senior not because of Bayesian updating, but because "they probably know something I don't."

      *   *Sorting:*
          *   Non-negotiable: Correlated error, Sequential visibility, Consistency with probability axioms.
          *   Taste: Full Bayesian coherence (bounded is fine), Prescriptivity (theory explains, design fixes).
          *   Impossibility: Yes, individual rationality *can* kill aggregate truth (cascade theorems). Observational data *cannot* reliably distinguish cascade from truth without exogenous variation in information flow.

      *   *Families:*
          *   *Bayesian Cascade:* Nails the failure mode (rational herding) and the impossibility result (individual rationality kills truth). Fails to explain the 80% success rate without assuming unrealistic signal distributions. Too cognitively demanding for your analysts.
          *   *Network Learning:* Explains the success (averaging converges) and handles bounded rationality well. Struggles to explain the *sudden* collapse from common sources unless you explicitly model network topology changes. Often assumes truth is static.
          *   *Surowiecki Checklist:* Perfect for your redesign (independence, diversity). Theoretically thin; it asserts diversity is needed but doesn't model *how* correlation breaks the math. It's a design heuristic, not a predictive theory.

  7.  **Final Polish:** Check word count and flow. Ensure the "Impossibility" section is clear because that's the user's "most want to know." Ensure the distinction between "theory" and "design" is clear.

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "jointly unsatisfiable" question. The tension is between *individual rationality given public info* and *aggregate information extraction*. They are mutually exclusive in cascade regimes. I need to state that clearly.

      *(Refining the "Observational Data" point)*: Can we distinguish? Only if we see the *process* (who looked at what), not just the *numbers*. If we only see final numbers and outcomes, we can't tell a lucky cascade from a wise crowd until it's too late.

      *(Final check on constraints)*: "A paragraph each on how the three families... fare." I will ensure exactly three paragraphs for that section.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  ### Desiderata for a Theory of Aggregated Judgment

  1.  **Correlated Error Structure:** The theory must distinguish between independent noise and common-mode failure. *Scenario:* Your system works when analysts check distinct warehouse logs, but fails when they all read the same two newsletters; the model must treat the newsletters as a single shared signal, not twenty independent confirmations.
  2.  **Sequential Visibility:** It must account for how observing prior estimates alters the weighting of private signals. *Scenario:* An analyst sees a 90% running average and downweights their own contrary local data to avoid looking like an outlier, even if their private signal is strong.
  3.  **Ex-Ante Indistinguishability:** It must acknowledge that high-confidence herds and high-confidence truth look identical before resolution. *Scenario:* A 95% consensus on a launch date looks statistically identical whether it is based on 100 private inspections or 100 people copying the first guy; the theory cannot promise a warning label before the event resolves.
  4.  **Bounded Rationality Compatibility:** It must explain herding without requiring infinite recursive reasoning. *Scenario:* A junior analyst copies a senior not because of Bayesian updating on the senior's posterior, but because of a heuristic: "They have better access, so I'll defer."

  ### Sorting and Impossibility Results

  **Non-negotiable:** The theory must handle correlated errors (Desideratum 1) and sequential updating (Desideratum 2). It must also remain consistent with basic probability axioms (no Dutch books). **Taste:** Full Bayesian coherence is not required; a bounded, heuristic-level account clears the bar if it predicts the collapse. Prescriptivity ("how to fix the institution") is a category error for a *theory*, but a mandatory feature for your *design*; the theory explains the breakage, the design prevents it.

  **Joint Unsatisfiability:** Yes, there is a fundamental tension. **Individual rationality given public info can automatically rule out aggregate truth.** This is the core of Information Cascade theorems (Bikhchandani et al.): once the public history outweighs private signal strength, it is rational for every subsequent individual to ignore their private info, freezing the aggregate in error. Regarding identification: **Observational data of actions and outcomes alone cannot reliably distinguish a cascade from a correct crowd ex-ante.** Without exogenous variation in information flow (e.g., forcing some people to vote blind), a lucky cascade and a wise crowd are observationally equivalent until the resolution date.

  ### Theory Family Scorecard

  **Bayesian Cascade/Herding Models:** These nail the failure mode and the impossibility result (individual rationality killing aggregate truth). They explain why your post-mortem found everyone reading the same newsletters: once the public signal (the average) overwhelms private signals, rational agents stop contributing new info. However, they struggle to explain your 80% success rate without assuming unrealistically strong private signal distributions, and they assume a level of cognitive sophistication your analysts likely don't possess.

  **Repeated-Averaging Network-Learning Models:** These explain the success (averaging converges to truth) and handle bounded rationality well (DeGroot-style updating). They are robust for parallel, simultaneous forecasting. However, they struggle to explain the *sudden* collapse from common sources unless you explicitly model network topology changes (who listens to whom). They often assume the truth is static and learnable, which fits your supply chain context, but they underplay the incentive to herd for reputational reasons.

  **Surowiecki Checklist (Diversity/Independence):** This is perfect for your redesign but theoretically thin. It correctly identifies that independence and diversity are the levers to pull to fix the newsletter problem. However, it asserts *that* correlation breaks the math without modeling *how* the mechanism fails dynamically. It is a design heuristic, not a predictive theory; it tells you how to build the cage, but not exactly when the animal will escape.
