      *   *Revision:* Distinguish *Shame-Proneness* (Trait) from *Moral Shame* (State). (4) describes the trait (psychological finding). (6) describes the state (narrative event). This aligns the psychology with the fiction.

      *Wait, one more check on (3).* (3) says shame is heteronomous. (6) says the shame is "morally serious." In philosophy, heteronomy is often a pejorative (Kant). If the philosopher attacks (6) based on (3), the novelist is vulnerable.
