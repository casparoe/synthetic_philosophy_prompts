          *   *Best Candidate:* Modify (4). Currently, (4) states shame *tends to issue* in concealment/hostility (makes character worse). (6) requires shame to issue in restitution (makes character better).
          *   *Revision:* Distinguish between *toxic shame* (self-focused, withdrawal) and *ethical shame* (status-focused, reintegration). Or, acknowledge that shame's *initial* impulse is withdrawal, but its *moral potential* is reparation *if* the community allows it.
