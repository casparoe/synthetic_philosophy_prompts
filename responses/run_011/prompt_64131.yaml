          *   *Severity:* Low/False Tension. (2) rejects essentialist *division of peoples*. (7) accepts that *cultures have repertoires* that can shift. One can believe cultures have emotional ecologies without believing in the rigid Benedictine typology.

      *   **Tension E: (1) & (3) vs. (6).**
          *   (1) Shame is about *appearance*/*eyes of observer*.
