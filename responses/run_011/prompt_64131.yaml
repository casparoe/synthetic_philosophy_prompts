          *   If I change (3) to remove the "heteronomous/autonomous" label, it reduces the philosophical vulnerability regarding moral worth.
          *   *Decision:* The (4) vs (6) conflict is the most dangerous. A philosopher will pounce on "Shame makes characters worse" vs "Here is a character made better by shame."
          *   *Revision:* Soften (4). Change "makes a character worse" to "threatens the character's social cohesion." Or distinguish between *shame-proneness* (trait) and *episodic shame* (state). (4) talks about "shame-proneness." (6) talks about a specific episode of shame.
