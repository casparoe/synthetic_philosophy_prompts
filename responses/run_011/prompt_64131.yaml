  6.  **Refining the Output:**
      *   Structure: Executive Summary -> Tension Audit (Ordered) -> False Tensions -> The Single Revision.
      *   Tone: Collegial, precise, "auditor" style.
      *   Check against constraints: Do not assume surrender. Respect load-bearing commitments (especially 6).

