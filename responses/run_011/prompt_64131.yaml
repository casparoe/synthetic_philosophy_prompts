      *   (3) **Audience Requirement:** Shame needs an audience (internal or external) -> Heteronomous. Guilt needs no audience -> Autonomous. Unobserved decency = neutral; Unobserved guilt = good.
      *   (4) **Behavioral Outcomes:** Shame -> concealment, withdrawal, hostility (makes character *worse*). Guilt -> confession, apology, reparation (makes character *better*). *Working assumption.*
      *   (5) **Limits of Guilt / Need for Shame:** Guilt can't reach complicity, systemic issues, distant obligations. Shame *is* needed for these because it concerns standing in a wider community.
      *   (6) **The Novel Case:** Man profits from misery, breaks no rules, feels no guilt (rightly). Exposed -> Shame -> Dismantles arrangement/Restitution. Shame is the *morally serious* driver here. He behaves *well*.
      *   (7) **Cultural Change:** Culture's emotional repertoire is institutional/historical, not chosen by argument. Novelists *can* change what society is ashamed of. Intends to do this.

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (4) vs. (6).**
          *   (4) says Shame makes a character *worse* (concealment, hostility).
          *   (6) says Shame makes this character *better* (dismantles arrangement, restitution, behaves *well*).
          *   *Severity:* High. This is a direct contradiction in moral valuation of the emotion's outcome.
          *   *Resolution:* Either (4) is a generalization that admits exceptions, or (6) is an anomaly, or the definition of "worse/better" shifts.

      *   **Tension B: (3) vs. (5).**
          *   (3) says Shame is *heteronomous* (depends on an observer/audience). It implies a limitation on moral worth (guilt is autonomous/better in that specific regard).
          *   (5) says Shame is *necessary* for systemic/complicity issues because it concerns community standing.
          *   *Severity:* Medium-High. (3) frames shame as morally inferior (heteronomous vs autonomous), while (5) frames it as morally necessary for complex modern ethics.
          *   *Nuance:* (3) focuses on the *source* of the norm (observer), (5) focuses on the *scope* of the norm (community vs intimate). They pull in different directions regarding shame's moral status.

      *   **Tension C: (4) vs. (5).**
          *   (4) Shame leads to withdrawal/hostility.
          *   (5) Shame is needed to address complicity/collective obligations (which requires engagement/reparation).
          *   *Severity:* Medium. If shame causes withdrawal, how does it fix systemic complicity? (6) bridges this, but theoretically, (4) and (5) clash on the *capacity* of shame to produce social good.

      *   **Tension D: (2) vs. (7).**
          *   (2) Rejects cultural typologies (shame-culture vs. guilt-culture).
