  ### The Principle: Naturalistic Dispositional Integration

  Your verdicts are best described by a hybrid principle I will call **Naturalistic Dispositional Integration**. It combines three clauses:

  1.  **The Pooling Clause:** Moral weight is proportional to the capacity for states (harm, benefit, memory, anticipation) to be integrated into a unified subjective account.
  2.  **The Capacity Clause:** Weight tracks the *dispositional capacity* for pooling inherent in the organism's design, not the *exercise* of that capacity at any given moment. (Accommodates Case 10: Anaesthetized humans retain the hardware for pooling).
  3.  **The Natural Kind Clause:** The capacity must arise from a biologically evolved history of selection for subjective guidance, not artificial engineering or conditioning. (Accommodates Case 12 vs 13: The fish's model is native; the pigeon's is installed. Accommodates Case 14: The robot is excluded).

  ### Inconsistencies and Accommodations

  **Candidate 1: Strict Phenomenal Integration (Weight $\propto$ Current Pooling)**
  *   **Fits:** 6, 8, 9.
  *   **Fails:** Case 10 (Anaesthetized humans have zero current pooling), Case 7 (Nematodes have *some* current integration, yet get zero).
  *   **Verdict:** You explicitly reject this in Case 10.

  **Candidate 2: Naturalistic Dispositional Integration (Your Actual Pattern)**
  *   **Fits:** 1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 13, 14.
  *   **Fails:** **Case 7**. You admit the nematode integrates "odour with feeding state." By your own Pooling Clause, non-zero integration entails non-zero weight. By your Capacity Clause, it has the capacity to do so. Giving it *zero* weight requires a hard complexity threshold that contradicts the "proportion" language of your rule.
  *   **Fails:** **Case 12**. Giving a reef fish *more* weight than a dog contradicts the "proportion" clause. Dogs demonstrably possess richer temporal pooling (planning, memory) than reef fish. This verdict appears to be an over-correction based on a single test rather than the ledger principle.

  ### Recommendation: Reverse Case 7

  You should reverse **Case 7 (The Nematode)**.

  **The Argument:**
  Your rule states weight is *proportional* to the degree of pooling. In Case 7, you explicitly concede that pooling occurs ("integration of odour with feeding state"). Mathematically and philosophically, if $Weight = k \times Pooling$, and $Pooling > 0$, then $Weight > 0$.
  You protect the anaesthetized human (Case 10) via the *Capacity Clause*: they count because they *can* pool. The nematode *does* pool (admittedly simply) and *can* pool. To assign it zero weight while assigning the sleeping human full weight relies on a species-based threshold that your rule does not justify. If the bee gets "small but nonzero" weight for a world model, the nematode must get "miniscule but nonzero" weight for state integration. Assigning zero creates a moral cliff-edge that your "proportion" rule explicitly forbids. Case 12 is an error of magnitude; Case 7 is an error of definition.

  ### Rulings on Unsettled Cases

  **15. Cortical Organoid:** **No weight.**
  It fails the *Natural Kind Clause*. While it shows coordinated activity, it lacks the evolutionary history of being a unified agent navigating a world. It is closer to the Robot (14) than the Human (1). It is tissue, not a ledger.

  **Ant Colony:** **Sum of individuals (Near Zero).**
  The colony exhibits functional integration (labour allocation), but not *phenomenal* integration. There is no single place where the colony "feels" the loss of a worker. The individuals (ants) have small ledgers (like bees). The colony itself is a zero-sum of those small ledgers, not a new large one.

  **Person in Advanced Dementia:** **Full weight.**
  Consistency with Case 10 (Anaesthesia) demands this. If weight tracks *capacity inherent in the kind* rather than *current exercise*, the dementia patient retains the moral status of the human kind, even if the ledger is currently fragmented. To reduce their weight is to violate the Capacity Clause that protects the sleeper.

  ### Discriminating Test Case

  **The "Tabula Rasa" Bird:**
  Take a species known for complex planning (e.g., a crow). Hatch it in total isolation, depriving it of all species-typical learning and social interaction, such that it never develops a rich world model, though it retains the neural hardware.
  *   **Discrimination:** If you give it **Full Weight**, you privilege *Natural Kind/Hardware* (aligning with Case 10). If you give it **Reduced Weight**, you privilege *Actualized Pooling/History* (aligning with Case 13). This forces you to decide whether the "ledger" is the blank book or the written pages.

  Verdict: Naturalistic Dispositional Integration | reverse: 7
