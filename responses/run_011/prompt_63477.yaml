answer: |-
  1. Divide the eighteen students into two equal groups seated at opposite tables, labeling them Arm A and Arm B, and distribute identical envelopes containing one random colored card and twelve quarters to each participant.
  2. Present the following sequence where each trade costs a quarter: Round 1 (Red→Blue), Round 2 (Blue→Green), Round 3 (Green→Red), noting that accepting all three results in a net loss of seventy-five cents despite each step appearing beneficial.
  3. Before the first round, allow only Arm A to purchase a sealed contract for fifty cents that forbids them from making any future trades, while Arm B must decide each offer sequentially without any ability to bind their future actions.
  4. Conclude that you were right because Arm A avoided the loss via commitment while Arm B suffered a money pump despite having no intransitive preferences at any single moment, and invite any student who refused the initial trade to argue that perfect foresight alone can substitute for a binding contract.
  5. Predict that some students in Arm B will refuse the second trade simply out of suspicion, and acknowledge that this game cannot reproduce the psychological experience of genuine preference reversal, which you will have to supply by hand during the explanation.
