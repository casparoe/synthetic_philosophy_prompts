prompt: |-
  I write the science-and-ideas column for a general-interest site and I'm stuck on a piece that keeps trying to be about why institutions make you waste something valuable in order to get in. My running examples: a religious order whose novitiate runs for years and produces no revenue for anyone, a startup that torches a chunk of its Series A on a glass-walled office no one needs, a dating app I'm covering where you have to destroy a token you paid real money for before anyone will reply to you, and the whole quiet-luxury thing where the expensive part is deliberately invisible to outsiders and legible only to insiders. I showed the draft to three people and got three different diagnoses. The biologist said this is textbook costly signaling, handicap principle, done deal. The behavioral economist said most of it is cheap talk plus a handful of unfakeable indices, and the "waste" is incidental to what's actually doing the work. The sociologist said the framing was built for peacocks and doesnt travel to humans, who signal to audiences rather than to trading partners. Before I write three thousand words picking a side, I want the spec — the thing I can hold each of them to.

  So: what does a theory of honest signaling have to deliver before I'm entitled to call something a costly signal? Give me the desiderata, and for each one the case or consideration that motivates it, plus which are non-negotiable and which are really just the preferences of one camp. It has to be usable as a checklist I can run a live example through in a paragraph or two, not a survey of the field. Stuff I know is in the neighborhood and want you to sort out: the line between a signal, a cue (information leaked rather than sent), and an index (something unfakeable because it's physically pinned to the underlying quality) — and whether a theory is even allowed to treat that as a fixed trichotomy, or whether the boundaries move; why honesty has to be a property of an equilibrium rather than of how the trait was designed; the point that what matters is the marginal cost of signaling more going down as quality goes up, not that high-quality signallers can simply afford to pay more, since affordability isn't a mechanism and I think it also matters that costs and benefits are being traded off in the same currency for that result to go through at all; what the theory owes about cheap-but-honest signals and about common-interest situations where lying wouldn't pay anyway; what it predicts about how much cheating there should be and how much is too much; who counts as the receiver when the audience isn't the party that pays the reward (third parties, eavesdroppers, reputation to a crowd that never interacts with you); and how a trait that started as a leaked cue and got ritualized into a signal is supposed to be handled without the whole account turning unfalsifiable. Then tell me if some subset of these can't be jointly satisfied — my suspicion is that "honesty requires waste" collides with "the theory has to cover honest signals generally," and that the collision is the finding rather than a footnote. Also: which single requirement knocks out the most candidate explanations, including ones that aren't signaling stories at all, like runaway preference feedback or sensory bias or plain screening by the other side. Once the list exists, spend a few sentences each on how a Zahavi-style handicap account, a Grafen-style signaling-game account, and a Spence-style economic screening account do against it — briefly, the weight should stay on the criteria. No bibliography, no reading list, no citations, I'll chase the literature myself.

  Last thing and it matters for the piece: keep the settled parts and the contested parts visibly separate. My readers will take whatever I assert as what experts think, so if something is a live dispute among people who actually work on this — whether the handicap principle is a coherent general claim, whether wastefulness is a diagnostic or a red herring, whether any of it transfers from animals to human institutions — mark it as disputed and say roughly who's disputing it, and dont let one camp's position wear a consensus costume. And if my framing is the problem, if "the waste is the signal" is a prejudice I picked up from pop science rather than a requirement anyone serious defends, say that bluntly at the top before anything else.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Science-and-ideas columnist for a general-interest site.
      *   **Topic:** Why institutions make you waste something valuable to get in (Costly Signaling vs. alternatives).
      *   **Examples:** Religious novitiate, startup glass office, dating app token destruction, quiet luxury.
      *   **Conflict:** Three experts (Biologist, Behavioral Economist, Sociologist) gave conflicting diagnoses (Costly Signaling/Handicap vs. Cheap Talk/Indices vs. Social Signaling/Audience).
      *   **Goal:** A specification/checklist (desiderata) for what counts as a "costly signal" theory. Needs to distinguish signal vs. cue vs. index, handle equilibrium honesty, marginal costs, cheap-but-honest signals, third-party audiences, and evolutionary history (cue -> signal).
      *   **Constraints:** No bibliography/citations. Keep settled vs. contested parts visibly separate. Bluntly address if "waste is the signal" is a pop-sci prejudice. Identify the single requirement that knocks out the most candidates. Compare Zahavi, Grafen, and Spence against the checklist.
      *   **Tone:** Professional, precise, analytical, suitable for a smart general-interest audience (but technically rigorous for the writer).

  2.  **Deconstruct the Core Question:**
      *   What *must* be true for a phenomenon to be classified as "costly signaling" in a rigorous theoretical sense?
      *   Where do the experts disagree?
      *   Is "waste" actually required?

  3.  **Drafting the Desiderata (The Checklist):**

      *   *Requirement 1: Strategic Intent/Function (Signal vs. Cue).* A signal must be selected *for* communication. A cue is incidental.
      *   *Requirement 2: Unfakeability via Cost (The Handicap).* The cost must be differential. High quality pays less (marginally) than low quality.
      *   *Requirement 3: Equilibrium Honesty.* Honesty isn't moral; it's stable. Cheating must be unprofitable *at the margin*.
      *   *Requirement 4: Common Interest vs. Conflict.* Signaling theory usually requires some conflict of interest. If interests align perfectly, cheap talk works.
      *   *Requirement 5: Receiver Benefit.* The receiver must gain information that affects their decision.
      *   *Requirement 6: Audience.* Who is the receiver? (Crucial for the Sociologist's point).

  4.  **Addressing the "Waste" Prejudice:**
      *   The user suspects "waste is the signal" is pop-sci.
      *   *Truth:* In strict Zahavi/Handicap terms, yes, net fitness cost is required to ensure honesty under conflict. In Spence/Job Market terms, it's an investment with different returns, not necessarily "waste." In indices, there is no cost, just physical constraint.
      *   *Verdict:* "Waste" is specific to the Handicap Principle, not signaling theory generally. This needs to be stated bluntly at the top.

  5.  **Sorting Settled vs. Contested:**
      *   *Settled:* Signals need to be distinct from cues. Honesty is an equilibrium property. Marginal cost differential is key (not just affordability).
      *   *Contested:* Is "waste" (net cost) necessary? (Biologists say yes for handicaps, Economists say no for screening). Does it apply to humans? (Sociologists say human signaling is often about reputation/audiences, not dyadic trading). Is the Handicap Principle a subset or the whole thing?

  6.  **The "Knockout" Requirement:**
      *   What kills the most false positives?
      *   Likely: *The Marginal Cost Condition.* Many things are costly, but if the cost is the *same* for high and low types, it's just a barrier, not a signal. Or: *Conflict of Interest.* If interests align, you don't need costly signaling.
      *   *Decision:* The **Differential Marginal Cost** condition is the strongest technical filter. It separates "burning money" from "signaling quality."

  7.  **Comparing the Frameworks (Zahavi, Grafen, Spence):**
      *   *Zahavi (Handicap):* Requires net cost (waste). Strong on biology, weak on human institutions where "waste" might be investment.
      *   *Grafen (Game Theory):* Formalizes Zahavi. Focuses on equilibrium strategies. More flexible but still requires cost to enforce honesty.
      *   *Spence (Screening/Education):* Costly, but often viewed as investment. The "waste" is less emphasized than the *correlation* with ability.

  8.  **Addressing the Specific Technical Points:**
      *   *Signal vs. Cue vs. Index:* Index is unfakeable due to physics (antler size linked to health). Signal is chosen. Cue is leaked. Boundaries can blur (ritualization).
      *   *Honesty as Equilibrium:* It's not about the trait's design, it's about whether a liar does better.
      *   *Marginal Cost:* Crucial. High quality must find it *easier* to signal more, not just afford it.
      *   *Cheap-but-honest:* Possible if interests align (common interest).
      *   *Cheating:* Should exist at the margin but not pay off.
      *   *Third Parties:* Reputation signaling fits, but changes the payoff structure.
      *   *Cue -> Signal:* Ritualization. Hard to test retrospectively (unfalsifiable risk).

  9.  **Structuring the Response:**
      *   **Headline:** The "Waste" Prejudice (Blunt truth).
      *   **Section 1: The Specification (Desiderata).** Grouped by Non-Negotiable (Settled) and Contested (Live Disputes).
      *   **Section 2: The Knockout Criterion.**
      *   **Section 3: Framework Comparison (Zahavi, Grafen, Spence).**
      *   **Section 4: The Collision (Waste vs. General Honesty).**

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I distinguish between "Costly Signaling Theory" (CST) generally and the "Handicap Principle" (HP)? Yes, this is crucial. HP requires waste; CST generally requires cost, but Spenceian signaling might be recouped.
      *   *Check:* Did I address the Sociologist's point? Yes, under "Receiver Identity."
      *   *Check:* Is the tone right? Needs to be authoritative but nuanced.
      *   *Check:* The user wants to know if "waste is the signal" is a prejudice. I need to confirm this. In economics, signaling costs are often investments (education). In biology, they are often handicaps (tails). The column's examples (burning tokens, glass offices) look like waste, but the novitiate might be training (investment).
      *   *Refinement on Marginal Cost:* Make sure to explain *why* affordability isn't enough. (If a rich person spends \$1M and a poor person spends \$1M, the signal fails if the poor person goes bankrupt but the rich doesn't feel it? No, if the poor person *can't* spend it, it's a barrier. If they *can* but it hurts them more, it's a signal). The condition is: $C(signal, low\_type) > C(signal, high\_type)$ for the same signal level, AND the marginal cost increases faster for the low type.

  11. **Final Polish:** Ensure the distinction between "Settled" and "Contested" is visually clear. Ensure the "Blunt Truth" is at the very top.

  *(Self-Correction on the "Waste" question)*: Is it a prejudice? Yes. In Spence's job market model, education is costly, but it increases wages. It's not "waste" in the sense of net loss to the signaler if they get the job. It's only waste if they don't get the job or if the cost exceeds the benefit *excluding* the signal's value. The Handicap Principle specifically argues for *net* cost to ensure reliability. So, "waste" is a specific subset, not the whole category.

  *(Self-Correction on the "Knockout")*: The "Conflict of Interest" requirement is actually a bigger filter. If interests align, cheap talk works. So costly signaling is *only* needed when interests diverge. This kills many "cooperation" explanations. However, the "Differential Marginal Cost" is the mechanical filter that distinguishes signaling from just "doing something hard." I will stick with Differential Marginal Cost as the technical knockout, but mention Conflict of Interest as the contextual prerequisite.

  *(Final check on constraints)*: No citations. Keep it usable. 3000 words is the target draft size, but my output is the *spec* for them to write it. I need to provide the spec clearly.

  Let's assemble the response.

  *   **Part 1: The Blunt Truth.** "Waste" is not a universal requirement.
  *   **Part 2: The Desiderata.** Split into Non-Negotiable (Settled) and Contested (The Expert Disagreements).
  *   **Part 3: The Knockout.**
  *   **Part 4: The Frameworks.**
  *   **Part 5: The Collision.**

  *Wait, one more thing:* The user asked about the "Cue vs Signal vs Index" trichotomy. I need to address whether that's fixed. It's not fixed; ritualization moves cues to signals. The theory must handle the *current* function, not just history, to remain falsifiable.

  *Okay, ready to write.*
answer: |-
  ### The Blunt Truth First

  You are right to be suspicious. **"The waste is the signal" is a pop-science prejudice.** It is a specific claim of the *Handicap Principle*, not a requirement of signaling theory generally. In economic signaling models (Spence), the cost is an investment that is recouped upon successful entry; it is not necessarily "waste" in the biological sense of net fitness loss. In human institutions, what looks like waste (the glass office, the novitiate) may function as a sunk-cost bond, a coordination focal point, or a screening device where the cost is recouped later through trust or status. If you build your column on the premise that *waste* is the defining feature, you are automatically siding with the Biologist against the Economist and the Sociologist before you've analyzed the data.

  The core theoretical claim is not "the signal must be wasteful," but "the signal must be **differentially costly** such that honesty is the stable equilibrium." Waste is one way to achieve that; it is not the only way.

  Below is the specification you asked for. It separates the settled mechanics of signaling theory from the live disputes about how (or whether) they apply to human institutions.

  ---

  ### The Specification: Desiderata for Costly Signaling

  To classify a phenomenon as "costly signaling" in a rigorous sense, the explanation must satisfy the following criteria. I have divided them into **Non-Negotiables** (settled theory, required for the math to work) and **Contested Boundaries** (where your three experts are actually disagreeing).

  #### I. Non-Negotiables (Settled Theory)
  *If an explanation fails these, it is not a signaling model. It might be coercion, screening, or mere correlation.*

  **1. The Conflict of Interest Condition**
  *   **Requirement:** There must be a divergence of interest between the sender and the receiver regarding the information being conveyed.
  *   **Motivation:** If interests align perfectly (e.g., I want you to know I am sick so you don't catch it, and you want to know), "cheap talk" (costless verbal claims) is sufficient. Costly signaling is only evolutionarily stable when there is an incentive to lie.
  *   **Status:** **Settled.** This is the entry fee. If there is no incentive to deceive, costly signaling is an inefficient explanation.

  **2. The Differential Marginal Cost Condition**
  *   **Requirement:** The cost of producing the signal must be lower for the high-quality type than for the low-quality type, *at the margin*. It is not enough that high-quality types can "afford" it more.
  *   **Motivation:** If a $10,000 signal costs a rich person $10k and a poor person $10k, the poor person is merely excluded (screening), not signaled against. For it to be a signal of *quality*, the rich person must suffer less utility loss per unit of signal than the poor person. The marginal cost curve must be flatter for the high type.
  *   **Status:** **Settled.** This is the mathematical engine of all signaling models (Zahavi, Grafen, Spence). Without this, the signal does not correlate with quality; it only correlates with wealth or endurance.

  **3. Honesty as an Equilibrium Property**
  *   **Requirement:** Honesty must be maintained because cheating is unprofitable *given the receiver's response*, not because the trait is physically unfakeable or the sender is moral.
  *   **Motivation:** A signal is a strategy, not a physical law. If the receiver stops believing the signal, the cost becomes pure waste with no return, and the behavior should vanish. The theory must explain why the receiver *trusts* the signal, not just why the sender sends it.
  *   **Status:** **Settled.** This distinguishes signaling from "indices" (see below).

  **4. Receiver Benefit**
  *   **Requirement:** The receiver must gain a net benefit from using the signal to make a decision, compared to random guessing or ignoring the signal.
  *   **Motivation:** If the signal provides no actionable information that improves the receiver's outcome, the receiver will not evolve (or learn) to attend to it.
  *   **Status:** **Settled.**

  #### II. Contested Boundaries (Live Disputes)
  *This is where your Biologist, Economist, and Sociologist are fighting. You must declare which side you are taking in your column.*

  **5. The "Waste" Requirement (Net Cost vs. Investment)**
  *   **Requirement:** Does the signal impose a net fitness/economic loss on the sender, even if successful?
  *   **The Dispute:**
      *   **Biologist (Zahavi/Handicap):** **Yes.** The cost must be a handicap. If you recoup the cost, it's an investment, not a handicap. The waste *is* the proof of quality.
      *   **Economist (Spence/Screening):** **No.** The cost can be recouped (e.g., tuition leads to higher wages). The "waste" is only relative to the low type who cannot recoup it.
      *   **Sociologist:** **Irrelevant.** Humans signal to audiences, not just trading partners. "Waste" might be a ritual to bind the group, not to inform a specific receiver.
  *   **Implication for your examples:** The dating app token (destroyed) fits the Biologist. The startup office (asset) fits the Economist. The novitiate (time) could be either.

  **6. Signal vs. Index vs. Cue**
  *   **Requirement:** Is the trait chosen (Signal), physically pinned to quality (Index), or incidental (Cue)?
  *   **The Dispute:**
      *   **Settled:** An **Index** (e.g., voice pitch correlated with body size) cannot be faked due to physics. A **Cue** (e.g., smell of fear) is leaked information not selected for communication. A **Signal** is selected for communication.
      *   **Contested:** The boundaries move. A cue can become a signal through "ritualization" (evolution co-opts a leak).
      *   **The Trap:** If you allow *any* trait that started as a cue to count as a signal once it's used, the theory becomes unfalsifiable (just-so stories).
      *   **The Fix:** A rigorous theory must demand evidence of *maintenance cost*. If there is no cost to maintaining the trait, it is likely an index or cue, not a costly signal.
  *   **Implication:** "Quiet luxury" is likely an Index (quality materials cost more to make) or a Cue (wear and tear shows age), unless the invisibility itself is costly to maintain.

  **7. The Identity of the Receiver**
  *   **Requirement:** Who pays the cost of the signal, and who grants the reward?
  *   **The Dispute:**
      *   **Biologist/Economist:** Dyadic. Sender signals to Receiver; Receiver rewards Sender.
      *   **Sociologist:** Audience. Sender signals to Crowd; Crowd grants Reputation; Third Parties reward Sender.
      *   **The Problem:** In human institutions, the person evaluating the signal (HR, the public) is often not the person paying the cost (the applicant, the user). This breaks the direct cost-benefit loop required in simple biological models.
  *   **Implication:** The glass-walled office signals to *clients* (who pay) but costs the *investors* (who pay). This is "agency signaling," not standard costly signaling.

  **8. Tolerance for Cheating**
  *   **Requirement:** How much lying should exist in the system?
  *   **The Dispute:**
      *   **Theory:** In a perfect separating equilibrium, zero cheating. In a pooling equilibrium, everyone signals. In reality, there should be a marginal amount of cheating where the cost equals the benefit.
      *   **Reality:** If you see rampant cheating (fake credentials, fake luxury), the signal has collapsed. If you see *no* cheating, it might be an Index, not a Signal.
      *   **Implication:** A theory must predict *some* attempted deception. If a system is perfectly honest, it's likely enforced by punishment (law), not signaling.

  ---

  ### The Knockout Criterion

  If you can only run one test to kill a false-positive explanation, use **The Differential Marginal Cost Condition (Desideratum #2).**

  **Why:** It eliminates the most "common sense" explanations that are not actually signaling.
  *   **Screening:** "You must pay $100 to join." If the $100 hurts everyone equally, this is just a barrier to entry (screening), not a signal of quality. It filters for wealth, not the underlying trait you claim (e.g., commitment, talent).
  *   **Runaway Preference:** "Peacocks have big tails because females like them." This explains the *existence* of the trait, but not its *honesty*. Without differential cost, the tail could be fake.
  *   **Sensory Bias:** "Females like red because they eat red berries." This explains the channel, not the honesty.

  **How to use it:** Ask, "If a low-quality impostor tried to produce this signal, would it hurt them *more* than it hurts a high-quality genuine user?"
  *   *Novitiate:* Does years of poverty hurt a "false believer" more than a "true believer"? (Yes, opportunity cost of leaving the faith).
  *   *Glass Office:* Does burning cash hurt a "competent CEO" less than an "incompetent CEO"? (Debatable. Incompetents might burn cash *more* easily). **Fail.**
  *   *Dating Token:* Does burning $5 hurt a "serious dater" less than a "troll"? (Yes, the troll gets no ROI). **Pass.**

  ---

  ### Framework Comparison: Zahavi vs. Grafen vs. Spence

  Here is how the three major theoretical frameworks stack up against the checklist. Use this to label which expert is using which lens.

  **1. Zahavi's Handicap Principle (The Biologist's View)**
  *   **Core Claim:** Signals must be *net costly* (wasteful) to be honest. The cost guarantees the honesty.
  *   **Performance on Checklist:**
      *   *Waste:* **Required.** (This is the defining feature).
      *   *Marginal Cost:* **Required.** (The handicap must be harder for the weak).
      *   *Receiver:* Dyadic (Mate/Receiver).
      *   *Weakness:* Struggles with human institutions where costs are investments (education, offices). It predicts the glass office *should* be useless, whereas an Economist says it might be a productive asset that *also* signals.
  *   **Verdict:** Best for the Dating App Token (pure destruction). Worst for the Startup Office (asset).

  **2. Grafen's Signaling Game (The Formal Biologist)**
  *   **Core Claim:** Formalizes Zahavi using game theory. Focuses on the *equilibrium strategy* rather than just the physical cost.
  *   **Performance on Checklist:**
      *   *Waste:* **Flexible.** Allows for costs that are recouped, provided the *marginal* cost condition holds.
      *   *Equilibrium:* **Strict.** Explicitly models the receiver's belief update.
      *   *Weakness:* Mathematically rigorous but often assumes a closed system. Struggles with the Sociologist's "Audience" problem (reputation networks).
  *   **Verdict:** The gold standard for "Is this mathematically possible?" but requires assumptions about payoffs that are hard to measure in human institutions.

  **3. Spence's Job Market Signaling (The Economist's View)**
  *   **Core Claim:** Signaling is an investment in correlation. Education doesn't make you smarter; it shows you were already smart enough to get the degree.
  *   **Performance on Checklist:**
      *   *Waste:* **Rejected.** Costs are investments. If the signal pays off, it's not waste.
      *   *Marginal Cost:* **Required.** (Low ability finds education harder).
      *   *Receiver:* Employer (Screening).
      *   *Weakness:* Often conflates *screening* (principal sets the test) with *signaling* (agent chooses the test). In your startup example, who set the rule? If the CEO chose the office, it's signaling. If the VC demanded it, it's screening.
  *   **Verdict:** Best for the Novitiate (investment in human capital) and Startup Office (capital investment).

  ---

  ### The Collision: "Honesty Requires Waste" vs. "General Signaling"

  Your suspicion is correct: **These two claims cannot be jointly satisfied.**

  1.  **Claim A:** "Honesty requires waste" (The Handicap Principle).
  2.  **Claim B:** "This theory explains honest signaling generally" (Including human institutions).

  **The Conflict:** In human institutions, "waste" is often indistinguishable from "investment" or "bonding."
  *   If I burn a token (Dating App), that is waste. It fits Claim A.
  *   If I spend 3 years in a Novitiate, I gain training, social capital, and discipline. That is investment. It fits Claim B (Spence), but violates Claim A (Zahavi).
  *   If I build a glass office, it is an asset. It might signal wealth, but it's not "waste."

  **The Finding for Your Column:**
  The collision *is* the story. The Biologist is applying a biological heuristic (Handicap) to a sociological phenomenon (Institutions). The Economist is applying a market heuristic (Investment) to a social phenomenon. The Sociologist is pointing out that in humans, the "Receiver" is often a diffuse audience, which changes the payoff structure entirely.

  **Recommendation:** Do not pick a side. Frame the piece around the **failure of the "Waste" heuristic** to travel across domains.
  *   Use the **Differential Marginal Cost** as your universal ruler.
  *   Show where "Waste" is a subset (Biological Handicaps, Token Burning).
  *   Show where "Investment" is the reality (Education, Novitiates).
  *   Show where "Audience" breaks the dyad (Quiet Luxury, Glass Offices).

  ### Summary of Disputed vs. Settled (For your sidebar or framing)

  | Feature | Settled Consensus | Live Dispute |
  | :--- | :--- | :--- |
  | **Honesty** | Must be an equilibrium (lying doesn't pay). | Whether morality/norms can replace cost. |
  | **Cost** | Must be differentially lower for high types. | Whether cost must be *net waste* (Zahavi) or just *investment* (Spence). |
  | **Intent** | Must be distinct from cues/indices. | Whether ritualized cues count as signals. |
  | **Receiver** | Must benefit from the info. | Whether "Audience/Reputation" counts as a receiver. |
  | **Humans** | Theory applies in principle. | Whether human culture overrides biological cost structures. |

  **Final Advice:** If you assert "Waste is the signal," you are wearing the Biologist's costume. If you assert "Cost is the signal," you are wearing the Economist's. If you assert "Attention is the signal," you are wearing the Sociologist's. The most rigorous piece will show how your examples slide between these definitions, and why the "Waste" narrative is the most seductive but least portable of the three.
