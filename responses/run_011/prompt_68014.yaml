  5.  **Ranking Worst-First:**
      *   **Worst:** The Newman/Naturalism tension ((2)+(3)+(4)). This is the technical heart of the view. If this fails, the definition of "structure" collapses into triviality or metaphysical primitivism. This is likely what the tutor meant by "one of these is going to cost you." Specifically, (4) undermines the solution in (3).
