      *   (4) **Naturalism:** Natural relations cannot be primitive metaphysical furniture. They must be structural matters themselves.
      *   (5) **PMI (Pessimistic Meta-Induction):** Motivation for SR. Ontologies change, structure survives. Believe structure only.
      *   (6) **Anti-ESR (Epistemic Structural Realism):** Rejects unknowable relata. Wants to eliminate intrinsic stuff entirely, not just hide it.
      *   (7) **QM Argument:** Identical particles/permutation invariance support (1). Sympathetic to weak discernibility (relations do the work).
