      *   *Actually, the strongest tension:* (3) relies on "natural relations." (4) says naturalness must be structural. But if naturalness is structural, you need a meta-structure to define it. This leads to the "Newman problem for natural properties."
      *   *What gives:* (4) is the most vulnerable. You cannot fully naturalize "naturalness" without circularity in this context. You have to accept that the *theory's success* picks out the natural relations, not a prior metaphysical fact. But that risks making (3) question-begging.
