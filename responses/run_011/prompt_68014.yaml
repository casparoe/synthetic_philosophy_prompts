          *   *Follow-up:* "Structures are objects." This is a linguistic/ontological category mistake worry. If structures are the *only* things, aren't they just objects by another name? (1) addresses this by saying they aren't *substances*.

      *   *(5) vs. (6):*
          *   (5) says structure survives theory change.
          *   (6) says don't posit unknowable relata.
          *   *Connection:* These actually support each other. (5) motivates believing in structure; (6) clarifies *why* we don't believe in the relata (because PMI wipes them out, not because they are unknowable). No conflict here.

