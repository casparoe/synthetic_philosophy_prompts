answer: |-
  ### Workshop Activity: "The Inventory of Light"

  **Time:** 45 minutes (15 min exercise, 30 min debrief/argument)
  **Props:** One white ceramic mug (half-full of dark coffee), one set of house keys, one cardboard box, one desk lamp.
  **Setup:** Place the mug on the box. Shine the lamp at it from a sharp angle so it casts a hard shadow. Place the keys casually near the base. Arrange the 11 writers in a semi-circle around the table.

  **The Hook (2 mins):**
  Tell them: "We are going to write a police report for an alien species that has no concept of 'tools' or 'containers.' They only understand geometry and light."

  **The Constraint (3 mins):**
  Hand out paper. Give them this rule: **You are forbidden from using nouns that imply function or manufacture.**
  *   *Banned:* Mug, cup, handle, ceramic, clay, keys, metal, box, cardboard, lamp, light, shadow, table.
  *   *Allowed:* Curve, cylinder, void, reflection, gloss, matte, dark, light, edge, plane, attachment, protrusion.
  *   *The Kicker:* They must describe the relationship between the mug and the keys without saying which is which.

  **The Writing (10 mins):**
  Silent observation and writing. They must describe the scene as raw visual data. Encourage them to focus on where the object *ends* and the background *begins*. (For the writers who struggle, prompt them: "Don't tell me what it holds. Tell me where the white stops and the dark begins.")

  **The Reading & The Vote (10 mins):**
  Ask three volunteers to read their descriptions aloud.
  After each reading, ask the room: "Based *only* on this text, is the cylinder open or closed at the top? Is the protrusion attached or separate?"
  *   *Predictable Friction:* Writer A will say "a curved appendage." Writer B will say "a loop." The room will argue about whether "loop" implies a function (holding).
  *   *The Trap:* Ask the blind participant (if they choose to engage) how they would describe the object via touch without using the banned words. This highlights that *touch* has concepts too ("handle"), but *sight* is being forced to strip them.

  **The Argument (10 mins):**
  Pose the question: "Who failed the assignment?"
  *   Most will say they failed because they couldn't stop seeing a "mug."
  *   Push them: "Did you describe what was on the retina, or what was in your brain?"
  *   Let them argue about whether it is *possible* to see without naming.

  ---

  ### The Debrief: Mapping the Wall

  **1. The Philosophical Map (Molyneux's Problem)**
  Once the argument peaks, reveal the context. You are wrestling with **Molyneux's Problem** (posed to John Locke, 1688): *If a blind man born able to distinguish a cube and a sphere by touch suddenly gains sight, can he distinguish them by sight alone?*
  *   **The Consensus:** For 300 years, philosophers said "Yes." Modern medicine (post-2000s cataract surgeries in India/Nepal) says "**No.**"
  *   **The Reality:** Patients see a blur of color and light. They cannot distinguish edges from shadows. They cannot tell if an object is one thing or two things touching. They have to *learn* to see. They often touch their eyes to confirm what they see.

  **2. The Medical Map (What Your Narrator Actually Sees)**
  Reference Oliver Sacks' case study "Virgil" (*To See and Not See*).
  *   **Day 1:** A "mug" is not a mug. It is a white shape interrupted by a dark curve (the handle) sitting on a brown plane. The coffee inside is not "liquid"; it is a dark, flat surface that ripples when moved.
  *   **The Confusion:** He cannot distinguish the mug from the shadow of the mug. He reaches for the object and misses because depth perception is a learned cognitive skill, not a raw optical input.
  *   **The Fatigue:** Seeing is exhausting. After 20 minutes, Virgil would shut his eyes because the "noise" of visual data was overwhelming.

  **3. The Craft Payoff (Writing the Un-Conceptualized)**
  Give them this technique: **"The Inventory of Light."**
  *   **Rule:** When writing from the perspective of a newly sighted character, you must describe the *interruption* of light before you name the *source*.
  *   **Bad:** "He saw the white mug." (This is knowledge, not perception).
  *   **Good:** "A curve of white broke the brown, casting a sharp dark twin on the table. Inside the curve, a black stillness."
  *   **Why it works:** It forces the reader to experience the *processing time* of the narrator. It creates intimacy because the reader has to assemble the object alongside the character.

  ---

  ### Predictive Failure Analysis: What Will Go Wrong

  **1. The "Poetry" Dodge**
  *   **What happens:** Writers will cheat by using abstract poetic language ("a chalice of sorrow," "a silver serpent") to bypass the ban on nouns.
  *   **Why:** It's easier to be metaphorical than observational.
  *   **Fix:** Call it out immediately. "That's a metaphor, not data. A metaphor requires knowing what the thing is. Try again."

  **2. The Politeness Wall**
  *   **What happens:** The group won't argue. They'll say, "Oh, I see what you meant," to be nice.
  *   **Why:** Workshops are usually supportive, not adversarial.
  *   **Fix:** You must play the Devil's Advocate. "I didn't see that. Your text said 'protrusion.' That could be a chip in the ceramic. How do I know it's a handle?" Force the ambiguity.

  **3. The Inclusion Risk**
  *   **What happens:** The blind participant feels tokenized or excluded during the visual observation phase.
  *   **Why:** The exercise is inherently visual.
  *   **Fix:** Pre-brief the blind writer. Ask them beforehand if they are comfortable critiquing the *language* of perception. In the debrief, frame their contribution as expertise in *sensory translation*, not "the blind perspective." Ask them: "When you touch a mug, do you feel 'mug' or do you feel 'curve and heat'?" This validates their experience as the *accurate* one, while the sighted writers are the ones struggling with "fake" new sight.

  ---

  ### The Limit: What This Activity Can't Teach

  **The Overwhelm.**
  This activity is intellectual and linguistic. It cannot simulate the **neurological flood** of sudden sight.
  *   **The Gap:** Your writers will understand *conceptually* that the narrator shouldn't name the mug. But they won't feel the *panic* of 1,000,000 pixels of data hitting the brain at once with no filing system.
  *   **Your Job:** You have to supply the **physiology of confusion** in your prose.
      *   *Activity Result:* They learn to strip the noun.
      *   *Your Addition:* You must add the headache, the nausea, the need to close the eyes, the inability to track movement.
      *   *Example:* The activity teaches them to write "a white curve." You must add, "The white curve vibrated. It hurt to keep the eyelids open. The shadow moved when he didn't."

  **The Emotional Weight.**
  The activity treats the mug as an object. For your narrator, the mug is a miracle.
  *   **The Gap:** The workshop creates clinical detachment. Your scene needs awe or terror.
  *   **Your Job:** You must layer the *value* of the sight onto the *data*. The "white curve" isn't just geometry; it's the first time he has ever seen the color white. The writers will give you the *syntax* of new sight; you must provide the *soul* of it.

  **Final Instruction to You:**
  Run the exercise. Let them fail to describe the mug without naming it. When they argue that it's impossible, tell them: "Exactly. That's your narrator's life for the next six months. Now go write the scene where he drops it because he couldn't find the edge."
