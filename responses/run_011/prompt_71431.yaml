answer: |-
  This is a **Welfare Impact & Feasibility Gate (WIFG)** procedure. It is designed to be executed in four hours by two people (you and a site manager) to produce a Board-ready recommendation that withstands ethical scrutiny without relying on false precision.

  It is built on three ethical pillars:
  1.  **The Five Domains Model:** Prioritizing *outcome* measures (what the animal experiences) over *input* measures (what you provide).
  2.  **The Precautionary Principle:** For shrimp, uncertainty regarding sentience does not justify inaction; it mandates a discount factor on welfare claims rather than a zero value.
  3.  **Non-Aggregation of Severe Harm:** Suffering above a certain severity threshold cannot be traded off against minor benefits to a larger number of animals (rejecting pure utilitarian arithmetic for severe harms).

  ### Part 1: The Decision Procedure (WIFG)

  **Distinctions Management:**
  *   **Kept Intact:** Outcome vs. Input measures; Active Harm (inflicted) vs. Omission (failed to prevent); Own Operations vs. Supply Chain liability.
  *   **Flattened:** Severity is banded (1–5) rather than continuous; Duration is banded (Acute/Chronic/Permanent). *Reason:* Human raters cannot distinguish 4.2 from 4.5 severity reliably in half a day.
  *   **Dropped:** "Animal-minutes of suffering." *Reason:* It implies a precision that does not exist for shrimp and trivializes severe acute harm in fish. It is replaced by **Weighted Welfare Units (WWU)**.

  ---

  #### Gate 1: Boundary & Liability
  **Question:** Does this proposal affect animals under our direct control or our supply chain liability?
  *   **Direct Control:** Own sites, own hatchery.
  *   **Supply Chain:** Contract grow-out, third-party hatcheries (PL source).
  *   **Rule:** If the proposal outsources harm to the supply chain (e.g., buying PLs to avoid ablating your own), the affected animals count at **100% liability**. You cannot reduce your ethical footprint by moving the harm off-site.
  *   **Stop Condition:** If the proposal explicitly relies on increasing harm elsewhere to reduce harm here, **STOP. Reject.** (Unless the net global reduction is verifiable, which is rare).
  *   **Output:** Define $N$ (Total animals affected).

  #### Gate 2: Evidence & Measure Type
  **Question:** Is the welfare benefit measured by animal *outcome* or management *input*?
  *   **Outcome:** Mortality, pathology, behavior, physiology (e.g., cortisol, stun efficacy).
  *   **Input:** Stocking density, feed type, equipment purchase.
  *   **Scoring:**
      *   Outcome validated for species: **Confidence High (1.0)**
      *   Outcome validated for related species (Precautionary): **Confidence Medium (0.5)**
      *   Input only (assumed benefit): **Confidence Low (0.2)**
  *   **Stop Condition:** If Confidence is Low AND cost > €100k, **STOP.** Send back for pilot data. Input-based spending at scale is unjustified without outcome validation.

  #### Gate 3: Severity & Agency (The Ethical Core)
  **Question:** What is the nature of the harm being addressed?
  *   **Type A (Active Infliction):** We cause the pain (e.g., slaughter, ablation, tagging).
  *   **Type B (Failure to Prevent):** We allow the pain (e.g., disease, poor water quality, lack of enrichment).
  *   **Severity Band (S):**
      *   1: Negligible (minor handling)
      *   2: Mild (temporary discomfort)
      *   3: Moderate (pain requiring intervention)
      *   4: Severe (long-term suffering, significant impairment)
      *   5: Extreme (death without insensibility, mutilation)
  *   **Rule:** Type A harms are weighted **2x** against Type B harms. A Severity 5 Active harm cannot be offset by any number of Severity 1 benefits.
  *   **Output:** Severity Score ($S$) and Agency Weight ($W_{agency}$).

  #### Gate 4: The Calculation (WWU)
  Do not calculate "suffering minutes." Calculate **Weighted Welfare Units (WWU)** per Euro.
  $$WWU = \frac{N \times S \times W_{agency} \times Confidence}{Cost (€1000s)}$$
  *   **Note:** This is not a utility score. It is a prioritization metric.
  *   **Shrimp Adjustment:** If Species = Crustacea, apply **Precautionary Discount (0.5)** to $S$ unless outcome measures are species-specific validated. This acknowledges uncertainty without erasing it.

  #### Gate 5: The Hand-Off (Values vs. Facts)
  **Question:** Does the proposal require a trade-off between Welfare and Viability that exceeds our mandate?
  *   **Trigger:** If implementing the proposal reduces production volume by >5% or increases unit cost by >10%.
  *   **Action:** **STOP.** This is not a welfare decision; it is a strategic business decision.
  *   **Output:** A one-page brief to the Board/COO stating: *"Welfare Case: Strong. Business Case: Requires strategic approval on margin/volume."*
  *   **Reason:** You are the Welfare Lead, not the CEO. You cannot authorize existential business risks.

  ---

  ### Part 2: Running the Procedure on Three Proposals

  **Team:** You (Vet) + Site Manager (Biology). Time: 4 Hours.

  #### Proposal 1: In-Water Electrical Stunner (Salmon Harvest)
  *   **Cost:** €1.2m.
  *   **Scope:** 2 million salmon/year.
  *   **Gate 1 (Boundary):** Direct control. $N = 2,000,000$.
  *   **Gate 2 (Evidence):** Outcome measure (EEG insensibility, opercular movement). Validated for Atlantic Salmon. Confidence = 1.0.
  *   **Gate 3 (Severity):** Current state: Manual percussive (risk of error). Proposed: Electrical (instant).
      *   Harm Addressed: Death without insensibility (Severity 5, Active).
      *   Agency: Active Infliction ($W_{agency} = 2$).
      *   Severity Band: 5.
  *   **Gate 4 (WWU):**
      *   Numerator: $2,000,000 \times 5 \times 2 \times 1.0 = 20,000,000$.
      *   Denominator: $1,200 (€1000s)$.
      *   **WWU Score:** 16,666.
  *   **Gate 5 (Hand-Off):** Cost is high. Does it impact margin >10%? Likely yes.
      *   **Verdict:** **Recommend for Board Approval.**
      *   **Note:** "Welfare imperative is maximum (Severity 5 Active). Financial impact requires Board strategic decision."
  *   **Result:** Passes to Board with high priority.

  #### Proposal 2: End Eyestalk Ablation (Shrimp Broodstock)
  *   **Cost:** Implicit. Requires 33% more broodstock OR buying PLs from third parties.
  *   **Scope:** 100 million crustaceans (via broodstock influence).
  *   **Gate 1 (Boundary):**
      *   Option A (More Broodstock): Direct control.
      *   Option B (Buy PLs): Supply chain.
      *   **Rule Application:** If we buy PLs from hatcheries that ablate, we count those animals at 100% liability. We cannot outsource the sin. $N = 100,000,000$ regardless of option.
  *   **Gate 2 (Evidence):** Outcome measure (mortality, spawning quality, behavioral distress). Validated for *Penaeus*. Confidence = 1.0.
  *   **Gate 3 (Severity):**
      *   Harm: Mutilation without anesthesia (Severity 5, Active).
      *   Agency: Active Infliction ($W_{agency} = 2$).
      *   Severity Band: 5.
      *   Shrimp Discount: None (Evidence is strong for ablation harm).
  *   **Gate 4 (WWU):**
      *   Numerator: $100,000,000 \times 5 \times 2 \times 1.0 = 1,000,000,000$.
      *   Denominator: Cost of 33% more broodstock facility expansion ≈ €800k (estimated).
      *   **WWU Score:** 1,250,000.
      *   *Wait:* The WWU is massive because $N$ is huge.
  *   **Gate 5 (Hand-Off):**
      *   To do this in-house: CapEx for broodstock expansion.
      *   To outsource: Ethically blocked by Gate 1 (counts as our harm).
      *   **Constraint:** Can we absorb the CapEx? If yes, Pass. If no, we must reduce production volume to match non-ablated broodstock capacity.
      *   **Verdict:** **Conditional Pass.** "Must expand internal capacity. Outsourcing is ethically neutral (no gain). If CapEx denied, production volume must be cut to match non-ablated capacity."
  *   **Result:** This verdict might be unwelcome. It forces a choice: Spend money or produce less. It refuses the "buy PLs" loophole.

  #### Proposal 3: Co-Funded Indicator Validation Study (Shrimp)
  *   **Cost:** €150k (co-funded).
  *   **Scope:** 0 animals directly helped now. Future benefit to 100m shrimp.
  *   **Gate 1 (Boundary):** Direct control (research unit).
  *   **Gate 2 (Evidence):** Outcome measure (validating the indicator). Confidence = 1.0 (for the science), but Confidence for *Welfare Benefit* = Low (0.2). Why? Because validating a measure does not guarantee the measure will be used to change practice.
  *   **Gate 3 (Severity):**
      *   Harm Addressed: Future uncertainty.
      *   Type: Omission (Failure to know).
      *   Severity Band: 2 (Uncertainty is not pain).
      *   Agency: $W_{agency} = 1$.
  *   **Gate 4 (WWU):**
      *   Numerator: $100,000,000 \times 2 \times 1 \times 0.2 (Future/Implementation risk) = 40,000,000$.
      *   Denominator: $150 (€1000s)$.
      *   **WWU Score:** 266,666.
  *   **Gate 5 (Hand-Off):** No viability risk.
  *   **Verdict:** **Approve.**
  *   **Wait, let's look at the ranking:**
      *   Stunner: 16,666 (but Severity 5 Active).
      *   Ablation: 1,250,000 (Severity 5 Active).
      *   Study: 266,666 (Severity 2 Omission).
      *   *Correction on Procedure:* The WWU formula favors high $N$. The Study wins on pure math.
      *   *Ethical Override:* **Gate 3 Rule:** "A Severity 5 Active harm cannot be offset by any number of Severity 1-2 benefits."
      *   The Stunner and Ablation address Severity 5 Active harms. The Study addresses Severity 2 Omission.
      *   **Re-Verdict:** **Prioritize Ablation & Stunner over Study.** The Study is deferred until Active Harms are mitigated.
  *   **Result:** **Reject for now (Defer).**
  *   **Contradiction:** As a Vet, you likely value the science (Study) highly. This procedure ranks it *below* capital expenditure for slaughter and broodstock because it does not alleviate *current, severe, active suffering*. It treats "knowledge" as a lower priority than "stopping mutilation."

  ---

  ### Part 3: Bias Audit

  Every instrument distorts. Here is how the WIFG distorts, and how to manage it.

  | Bias Type | How the Procedure Favors | Why it Happens | Mitigation (Inside Procedure) | Residual Risk (Cannot Fix) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Measurable vs. Unmeasurable** | Salmon over Shrimp. | Salmon have validated outcome measures (Confidence 1.0); Shrimp often get the Precautionary Discount (0.5). | Explicit Precautionary Discount rule ensures Shrimp aren't zeroed. | Shrimp welfare will always look "less certain" than fish, potentially deprioritizing spend. |
  | **Acute vs. Chronic** | Slaughter/Ablation over Density/Enrichment. | Severity Bands weight Acute/Extreme (5) higher than Chronic/Moderate (3). | Gate 3 requires Chronic harms to be aggregated over duration if severe enough. | A lifetime of mild boredom (enrichment) may never beat a minute of severe pain (slaughter). |
  | **Own vs. Supply Chain** | Own sites over Contract Grow-out. | Easier to verify outcomes on own sites. | Gate 1 counts supply chain animals at 100% liability. | You cannot enforce outcome measures on contractors, only inputs. You pay for their harm but can't fix it. |
  | **Campaign vs. Quiet** | Ablation (Campaign target) over Disease (Silent killer). | External pressure makes Severity 5 Active harms more visible. | Gate 3 forces scoring based on *animal state*, not external noise. | Silent suffering (e.g., subclinical disease) may be under-scored because no one is shouting about it. |
  | **Intervention vs. Measurement** | Stunner over Indicator Study. | Direct intervention reduces $S$; Study only improves Confidence. | Gate 3 Rule: Active Harm mitigation trumps Knowledge generation. | Long-term welfare science stagnates if we only fund immediate fixes. |

  ### Part 4: Limitations & Maintenance

  **Questions the Procedure Cannot Settle (Hand-Off to Human):**
  1.  **Existential Trade-offs:** If ending ablation requires cutting production by 20% and laying off staff, the WIFG says "Cut Production." The Board must decide if the business survives that.
  2.  **Species Value:** The procedure treats a shrimp and a salmon as mathematically comparable via Severity Bands. It does not answer "Is a salmon's pain worth more than a shrimp's?" It assumes Severity 5 is Severity 5. If you believe salmon sentience is qualitatively higher, you must adjust the Severity Band manually before inputting.
  3.  **Wild vs. Farmed:** If buying non-ablated PLs harms wild broodstock collection, the procedure counts the farmed harm but misses the wild ecological harm.

  **Review Frequency:**
  *   **Run:** On every proposal >€15k.
  *   **Audit:** Annually. Compare WIFG recommendations against actual welfare outcomes (mortality, condemnations) to see if high WWU projects actually delivered.
  *   **Failure Signal:** If you find yourself manually overriding the "Severity 5 Active" rule more than twice a year, the Severity Bands are misaligned with your ethical reality. If the Board rejects >50% of High WWU proposals, the procedure is decoupled from business reality and needs a Cost-Benefit recalibration.

  **Final Note on the "Verdict You Will Not Like":**
  The procedure deferred the **Indicator Validation Study**. You, as a Vet, likely see this as critical infrastructure. The WIFG classifies it as "Failure to Prevent" (Omission) with low immediate Severity. It prioritizes stopping the bleeding (Ablation/Slaughter) over building a better thermometer. This is ethically defensible (suffering now > knowledge later) but scientifically frustrating. If you override this to fund the study, you must document that you are prioritizing *Future Capacity* over *Current Suffering*, and accept that the "Animal-Minutes" logic you rejected is implicitly creeping back in via "Future Animal-Minutes Saved."
