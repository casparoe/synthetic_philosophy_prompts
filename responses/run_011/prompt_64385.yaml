answer: |-
  **MEMORANDUM**

  **TO:** County Criminal Justice Advisory Board
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Indeterminate Sentencing Proposal (Vote: 14th)

  **Recommendation**
  I recommend we **Adopt with the Cap** (retaining the proposal's "no floor" structure). We should authorize a three-year pilot program with an independent statistical review at the 18-month mark.

  This recommendation rejects the "no cap" position as politically and legally unsustainable, but also rejects adding a "floor." A floor would mandate confinement even when treatment succeeds, wasting resources and liberty. The Cap is necessary, but not for the reasons currently being debated.

  **Reasoning: Reframing the Cap**
  We have spent six months arguing whether the Cap is a matter of moral desert (retribution) or public safety (utilitarianism). We are talking past each other because the Cap serves neither function perfectly.

  One member suggested the Cap is a "hedge against instrument error." This is intuitively appealing but logically incoherent. As noted in our last session, the Cap is tied to *offense severity*, not *assessment confidence*. If the goal were purely to hedge against risk-assessment error, the confinement limit should vary based on the reliability of the psychometric data, not the brutality of the past act. A high-confidence assessment on a minor assault would have a different hedge than a low-confidence assessment on a robbery. Since the Cap tracks severity, it cannot be an error hedge.

  We should instead justify the Cap as a **Rule of Law constraint**. Without a ceiling tied to the offense, the panel becomes a purely administrative detention body. Even if a detainee *is* dangerous, the state loses legitimacy if confinement becomes unmoored from the criminal conviction that triggered jurisdiction. The Cap is not a statement that the offender "deserves" exactly that much time; it is a procedural sunset that forces the state to prove continued necessity within a bounded timeframe. It preserves the distinction between criminal justice and civil commitment.

  **The "No Floor" Necessity**
  We must retain the "no floor" provision. A statutory floor would require us to hold individuals who have successfully completed treatment and are no longer dangerous, simply because they haven't served enough "time." This contradicts the core premise of the proposal: that confinement is for safety and treatment, not punishment. If the panel certifies an individual is safe at month six, holding them until month eighteen (the floor) is purely punitive and undermines the treatment model.

  **Public Messaging: The Headline Case**
  The press will ask about the "worst-case scenario": *An individual commits a minor version of aggravated assault (grid time: 18 months) but scores high on risk. The panel holds them for the full 18 months. Is this punishing future crimes?*

  **Do not say:** "They served their debt to society."
  **Do say:** "The 18 months is not a sentence; it is a maximum treatment window authorized by the original conviction. We are not punishing the minor act for 18 months; we are treating the high risk for *up to* 18 months. The conviction provides the legal authority to intervene; the risk assessment determines the duration. The Cap ensures that authority expires."

  **The Strongest Argument Against This Recommendation**
  We must respect the "No Cap" camp's moral clarity. Their argument is not bureaucratic; it is consequentialist. They argue that if a panel of experts determines an individual is highly likely to maim or kill upon release, releasing them because a grid number expired is morally indefensible.

  From this view, the Cap is a superstition that prioritizes abstract mathematical proportionality over concrete human safety. If we know a tiger is dangerous, we do not open the cage because the zoo ticket expired. If our risk instruments are valid, the "No Cap" position argues we are knowingly trading future victims for the sake of procedural symmetry. This is the heaviest burden we carry: if a pilot participant re-offends violently after release due to the Cap, the Board owns that harm.

  **Pilot Terms & Review**
  To mitigate this risk while testing the model:
  1.  **Term:** 3 Years.
  2.  **Review:** An independent third-party audit at 18 months focusing on false negatives (released individuals who re-offend).
  3.  **Sunset:** The authority expires automatically after 36 months unless re-authorized by a supermajority vote of this Board.

  **Conclusion**
  This proposal is an attempt to move from punishing harm to preventing it. The "No Cap" position makes that impossible to implement; the "Cap and Floor" position turns it back into the grid we are trying to improve. Adopting with the Cap (and no floor) balances the state's duty to protect the public with the constitutional and ethical limits on state power.

  I move we vote to Adopt with the Cap.
