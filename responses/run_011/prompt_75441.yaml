prompt: |-
  I hold a chair in the philosophy of medicine at a medical school and, by virtue of that appointment, sit as the lay member of the statutory tribunal that hears appeals against adverse coverage determinations under our national sickness insurance scheme. Please draft the written opinion I will circulate to my two colleagues — a physician and a retired claims director — three days before we sit.

  The scheme's governing regulation defines a compensable condition conjunctively, in two clauses: (a) "a significant departure from the statistically typical functioning of an organ or physiological system, measured against the reference class of persons of the claimant's sex and age," and (b) "which impairs the claimant's capacity to perform the occupational role for which the claimant is engaged." The drafting history is a compromise. Clause (a) was inserted by members who wanted a standard that was objective and answerable to measurement alone; clause (b) by members who held that nothing should be compensable unless it actually disables a person at work. Nobody appears to have noticed that the clauses can come apart in either direction, and we now receive such appeals monthly.

  The appellant is a 51-year-old radiographer who works in a catheterisation laboratory, where radiation-protection rules oblige her to wear a lead-equivalent apron of several kilograms, over scrub suit and sterile gown, for procedures of up to three hours in a warm, poorly ventilated room. She reports severe flushing, drenching night sweats, and consequent sleep loss; her supervisor documents three occasions on which she had to withdraw from a procedure. Our medical assessor records that her hormone levels and menstrual history are consistent with the perimenopause and fall within the reference interval for her age, that no test discloses any pathology, and — this is important — that her symptom-severity scores place her in the top three per cent of symptomatic women of her age. The assessor further states that menopausal hormone therapy is the most effective available treatment for vasomotor symptoms and that the appellant is an eligible candidate with no contraindication. So the clinical merits are not before us; only the classification is. Her claim was refused on the ground that the perimenopause is a normal stage of life rather than a disease. Her representative adds that the scheme routinely funds cataract extraction, and that opacification of the lens is if anything more age-typical than vasomotor symptoms.

  Next month we hear a 58-year-old railway signaller whose audiogram sits exactly at the median for his age cohort — his hearing loss is precisely what the reference class predicts — but whose occupational standard requires thresholds that the median ear of his age does not meet. His claim for hearing aids was refused under clause (a) alone, and he will cite whatever we say in the appellant's case.

  The opinion should contain:

  1. A one-sentence holding at the head: allow, dismiss, or allow on stated conditions, with the condition and the review period if it is conditional.
  2. The reasoning that gets us there, written for two colleagues who have read no philosophy and will not thank me for any.
  3. A direct resolution of the clause (a) question. If the answer turns on the choice of reference class — the transition is statistically typical for women of her age, yet her severity is atypical even within that cohort, and both facts describe the same woman at the same time — say so, state which fact is the relevant one, and defend the choice. Note that clause (a) is silent about the environment against which functioning is to be measured, and that the apron, the procedure list and the temperature of the laboratory are features of her working environment rather than of her body. Say whether that silence destroys the clause's claim to objectivity or merely leaves a gap we are obliged to fill.
  4. A determination on clause (b), given that her employer could rotate her off the procedure list and thereby extinguish the incapacity without treating anything. Take a position on whether an incapacity produced jointly by a bodily condition and a job design is compensable under our regulation, and say whether the position changes when the job design is legally mandated, as the apron is, rather than merely convenient.
  5. The strongest consideration on the losing side, in its best form and not as a straw figure, together with an explanation of why it does not carry the day — or, if it does, a candid revision of the holding in section 1.
  6. A short general test, phrased so that the other two members could apply it without me in the room, that yields coherent results in both the appellant's case and the signaller's, and that tells us what to do with the cataract comparison. If no such test exists, say so plainly and state what we should ask the legislature to amend.
  7. One further matter, to be treated as a live objection rather than a flourish: whichever way we decide, we will have made a value judgment about whose suffering counts as compensable, and we will have made it under cover of a definition that presents itself as factual. Say whether that is an objection to our decision or only to the drafting, and whether conceding it commits us to anything we should be unwilling to accept.

  Two constraints. I want no literature review: no citations, no reading list, no names of theorists dropped in as authority — my physician colleague is allergic to them and they would move him not at all. And I want no survey of available positions: the document must commit, because the tribunal has to sign something on the day. Nine hundred words at most; if you must exceed that, exceed it in section 6 and nowhere else.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair in Philosophy of Medicine at a medical school, lay member of a statutory tribunal.
      *   **Audience:** Two colleagues (a physician and a retired claims director). They have no philosophy background and dislike theoretical jargon/citations.
      *   **Task:** Draft a written opinion to circulate 3 days before sitting.
      *   **Context:** National sickness insurance scheme appeals tribunal.
      *   **Regulation:** Compensable condition defined conjunctively:
          *   (a) Significant departure from statistically typical functioning (reference class: sex/age).
          *   (b) Impairs capacity to perform occupational role.
      *   **Case 1 (Current):** 51yo radiographer. Perimenopause symptoms (flushing, sweats, sleep loss). Hormone levels normal for age. Symptom severity top 3% for age. Works in hot room wearing heavy lead apron. Claim refused because perimenopause is "normal life stage."
      *   **Case 2 (Future/Precedent):** 58yo railway signaller. Hearing loss exactly at median for age. Occupational standard requires better hearing than median age provides. Claim refused under clause (a).
      *   **Constraints:**
          1.  One-sentence holding at the head.
          2.  Reasoning for non-philosophers (no jargon/citations).
          3.  Resolve clause (a) (reference class choice: typical transition vs. atypical severity; environment vs. body; objectivity gap).
          4.  Resolve clause (b) (bodily condition + job design; legally mandated apron).
          5.  Strongest counter-argument + rebuttal.
          6.  General test for both cases (radiographer & signaller) + cataract comparison. If no test, say so and propose amendment. (Word count allowance here).
          7.  Address the "value judgment under cover of factual definition" objection.
          8.  No literature review/citations.
          9.  Must commit (no survey of positions).
          10. Max 900 words (exceed only in section 6 if necessary).

  2.  **Deconstruct the Legal/Philosophical Problems:**
      *   **Clause (a) - The Reference Class Problem:** Is "typical functioning" about the *process* (menopause is typical) or the *outcome/severity* (symptoms are atypical)? The regulation says "functioning... measured against the reference class." Her hormones are typical. Her *symptoms* (which affect functioning) are atypical (top 3%).
      *   **Environment vs. Body:** The regulation measures functioning of an "organ or physiological system." The apron and heat are external. However, the *interaction* causes the impairment. If we ignore the environment, clause (a) might fail because her body is "normal" in a vacuum. But clause (a) asks about functioning, not just pathology.
      *   **Clause (b) - Occupational Impairment:** She can't do *her* job. Could she do *another* job? The regulation says "the occupational role for which the claimant is engaged." So it's specific to her current job. The employer *could* rotate her, but hasn't. The incapacity exists *now*.
      *   **The Signaller Case:** His hearing is "typical" for his age (median). But his job requires better than typical. If we allow the radiographer based on "atypical severity," do we help the signaller? The signaller is *typical* (median). The radiographer is *atypical* (top 3% severity). This is the crucial distinction.
      *   **Cataract Comparison:** Cataracts are age-typical but funded. Why? Because they represent a departure from *healthy* functioning even if common in age group, or perhaps the scheme treats them differently. The argument is: if we fund common age-related decline (cataracts), why not menopause?
      *   **Value Judgment:** The definition pretends to be objective ("statistically typical") but choosing the reference class (age/sex vs. healthy baseline) is normative.

  3.  **Drafting Strategy - Section by Section:**

      *   **Holding:** Needs to be decisive. Allow the appeal. Why? Because symptom severity is atypical (top 3%), satisfying (a), and she cannot do her specific job, satisfying (b).
      *   **Reasoning:** Keep it plain. Focus on the text of the regulation.
      *   **Clause (a):** Focus on "functioning." Hormones are internal chemistry; symptoms are functional output. The reference class is women her age. Within that class, she is an outlier (top 3%). The silence on environment doesn't destroy objectivity; it requires us to measure functioning *in situ* or acknowledge that functioning is relational. Let's argue that "functioning" includes the physiological response to standard stressors.
      *   **Clause (b):** The regulation says "the occupational role... engaged." It doesn't say "any role." If the job design (apron) triggers the symptom, and the job is fixed, the incapacity is real. The fact that rotation *could* happen doesn't mean it *has*.
      *   **Counter-argument:** The "Normal Life Stage" argument. Menopause happens to everyone. Funding it medicalizes normality. Rebuttal: The scheme compensates *impairment*, not just pathology. If normality causes disablement beyond the norm of that normality, it counts.
      *   **General Test:** Need a test that helps the radiographer (atypical severity) but hurts the signaller (typical severity).
          *   Test: "Does the condition place the claimant in a statistically significant minority of their reference class regarding functional capacity?"
          *   Radiographer: Yes (top 3% symptoms).
          *   Signaller: No (median hearing).
          *   Cataracts: Usually funded because they represent pathology (opacity) even if common, or perhaps the scheme has a specific list. But logically, if cataracts impair function significantly compared to peers, they pass.
      *   **Value Judgment:** Acknowledge it. The definition forces us to choose which statistics matter. This is a flaw in drafting, not our decision. We must interpret the text as written.

  4.  **Word Count Management:**
      *   Target: ~900 words.
      *   Section 6 (General Test) can exceed if needed, but better to keep tight.
      *   Avoid fluff.

  5.  **Refining the Argument (Self-Correction):**
      *   *Critique:* If I allow the radiographer because her symptoms are top 3%, do I distinguish her enough from the signaller? Yes, the signaller is median. The radiographer is an outlier *within* the age group. The signaller is the *definition* of the age group.
      *   *Clause (a) Environment:* The prompt asks specifically about the silence on environment. I need to address whether measuring functioning against a reference class destroys objectivity if environment isn't controlled. I should argue that "functioning" implies interaction with the world. A heart that fails under moderate stress is malfunctioning even if resting stats are normal.
      *   *Clause (b) Job Design:* If the employer *could* rotate her, is the incapacity hers or the employer's? The regulation asks about *capacity to perform the role*. If the role requires an apron, and she can't wear it, she lacks capacity. Whether the employer *should* change the role is labor law, not insurance law.
      *   *Value Judgment:* Be honest. We are making policy. But we are bound by the text.

  6.  **Drafting - Step-by-Step:**

      *   *Holding:* Allow the appeal.
      *   *Reasoning:* Direct address to colleagues.
      *   *Clause (a):* Focus on "functioning" vs "structure." Hormones = structure/chemistry. Symptoms = functioning. She is an outlier in functioning. Environment is relevant to function.
      *   *Clause (b):* Specific role. Current incapacity exists.
      *   *Counter:* Medicalization of life. Rebuttal: Severity distinguishes disease from norm.
      *   *Test:* The "Outlier Test."
      *   *Value:* It's a drafting flaw, not our fault, but we must own the interpretation.

  7.  **Checking Constraints:**
      *   One sentence holding? Yes.
      *   No citations? Yes.
      *   No survey of positions? Yes.
      *   Word count? Keep an eye on it.
      *   Section 6 priority for length? Yes.

  8.  **Final Polish:** Ensure tone is respectful but authoritative (Chair). Ensure the distinction between the radiographer (atypical severity) and signaller (typical severity) is clear in the test.

  *(Self-Correction on Word Count)*: 900 words is tight for 7 sections. I need to be concise. I will combine the reasoning intro with the clause analysis where possible to save space for the Test (Section 6) and Value Judgment (Section 7).

  *(Refining Section 6)*: The prompt says "If no such test exists, say so plainly." I believe a test exists based on the "atypical severity" distinction. I will formulate it carefully.

  *(Refining Section 7)*: Needs to be sharp. Is it an objection to the decision or drafting? Drafting.

