answer: |-
  **Holding:** Allow the appeal, subject to review in six months to confirm whether initiated hormone therapy has restored occupational capacity.

  **Reasoning**
  We are bound by the conjunction of clauses (a) and (b). The refusal relied on the premise that "normal life stages" cannot satisfy clause (a). This is incorrect. The regulation does not ask whether the *cause* is pathological, but whether the *functioning* departs from the statistically typical.

  **Clause (a)**
  The regulation measures "functioning," not merely anatomy or chemistry. While the appellant's hormone levels are median for her age, her *functional output* (vasomotor stability) is not. The assessor places her symptom severity in the top three per cent of her reference class. We must treat the severity of the functional loss as the relevant statistic, not the prevalence of the underlying transition. To rule otherwise would be to ignore the text's focus on "functioning." Regarding the environment: the silence on working conditions does not destroy objectivity; it leaves a gap we must fill by measuring functioning *in context*. A heart that fails under moderate stress is malfunctioning even if resting stats are normal. Her physiological system is failing to regulate temperature under standard occupational stressors where her peers' systems do not.

  **Clause (b)**
  The regulation specifies "the occupational role for which the claimant is engaged." It does not say "any reasonable role." Her incapacity is real within her current engagement. The fact that her employer *could* rotate her is irrelevant to whether she *can* currently perform her duties. The legally mandated apron is a fixed parameter of her role; the interaction between her physiology and this mandate produces the incapacity. Whether the employer should accommodate her is a labor law question; whether she is incapacitated is an insurance question.

  **Strongest Counter-Argument**
  The refusal rests on a coherent policy concern: medicalizing normal aging transforms the insurance scheme into a general welfare fund. If we compensate perimenopause, why not presbyopia or greying hair? This argument fails because it conflates *prevalence* with *severity*. Greying hair does not impair occupational capacity. Severe vasomotor instability does. The scheme is designed to compensate disablement, not merely diagnosis. We are not funding the menopause; we are funding the statistical outlier severity that results in work loss.

  **General Test**
  To ensure coherence with the signaller's case and the cataract comparison, we should adopt the following test: *Does the claimant's functional capacity fall within the statistically significant minority of their age and sex reference class, regardless of whether the underlying cause is universal?*

  Applied to the signaller: His hearing is at the median. He is not in a statistical minority regarding function. His claim fails under clause (a), even if his job requires more. The scheme insures against bodily impairment, not against occupational standards that exceed typical human capacity for a given age.

  Applied to the cataract comparison: Lens opacification is age-typical, but when it progresses to impair vision significantly compared to peers, it satisfies the test. If the scheme funds cataract extraction, it is because the visual impairment represents a functional departure from the reference class sufficient to disable, not because the pathology is rare. Our decision here is consistent with that practice.

  If this test yields results the legislature dislikes, they must amend the definition to exclude age-related conditions entirely. Until then, we must apply the statistical threshold as written.

  **Value Judgment Objection**
  We are making a value judgment about whose suffering counts under the cover of a factual definition. Choosing "symptom severity" over "hormone levels" as the relevant metric is a normative choice. This is an objection to the drafting, not our decision. The regulation demands objectivity but provides no mechanism to select which statistics matter. We cannot refuse to decide because the text is imperfect. Conceding this does not commit us to arbitrariness; it commits us to interpreting the text in light of its purpose: compensating work-disabling functional loss. We are not hiding the value judgment; we are exposing it to ensure the statute functions as intended.
