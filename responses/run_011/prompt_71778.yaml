  ### I. Reconstruction of the Governing Rule

  Your ten rulings do not cohere around the "all-affected principle." If they did, Ruling (1) (seasonal workers) would be impossible: workers are subject to your criminal law, pay payroll tax, and are affected by legislation, yet they are denied the vote. Nor do you follow a pure "all-subjected" principle, or Ruling (10) (annexation) would be unnecessary: the annexed district's residents were already subject to the state's general laws, yet you granted them a specific vote on the boundary change.

  The record instead establishes a **Tiered Domicile Principle**.

  1.  **National Franchise:** Reserved for those whose "center of life" is permanently within the polity, evidenced by citizenship or its functional equivalent.
      *   *Support:* Ruling (1) denies it to temporary workers; Ruling (2) denies it to permanent residents (even of 22 years) who retain external ties; Ruling (3) removes it from citizens whose center of life shifts abroad for too long; Ruling (4) denies it to citizens with no residence here.
      *   *Exception:* Ruling (9) permits dual national voting, provided the voter's center of life is here.
  2.  **Municipal Franchise:** Reserved for those physically present and subject to local authority, regardless of permanent intent.
      *   *Support:* Ruling (2) grants it to permanent residents; Ruling (5) grants it to minors (who lack full national capacity); Ruling (1) implies that if the workers were permanent, they might qualify municipally.
  3.  **Membership Robustness:** Once membership is established, it is not easily lost due to status changes.
      *   *Support:* Ruling (6) (prisoners); Ruling (7) (capacity); Ruling (9) (external dual citizenship).

  **The Internal Inconsistency:**
  Ruling (2) and Ruling (3) are flatly inconsistent in their valuation of "stake."
  *   **Ruling (2):** A resident of 22 years (deep stake, physical presence) gets *no* national vote.
  *   **Ruling (3):** an emigrant of 9 years (fading stake, no physical presence) *keeps* the national vote.
  *   **Resolution:** Ruling (3) privileges **Status (Citizenship)** over **Stake (Residence)**. Ruling (2) privileges **Status (Non-Citizen)** over **Stake (Residence)**. Together, they establish that Citizenship is a talisman that outweighs physical presence.
  *   **Which must give?** Ruling (3) is the weaker principle. It relies on a sentimental attachment to blood/status that contradicts the "Center of Life" logic of (1), (2), and (4). However, since (3) concerns *citizens* and (2) concerns *residents*, you can maintain both by treating Citizenship as a *rebuttable presumption* of domicile.
  *   **What you lose:** If you prioritize Stake over Status (undermining 3), you lose the ability to claim the diaspora as part of the demos indefinitely. If you prioritize Status over Stake (upholding 3), you admit that your franchise is ethno-legal rather than democratic.

  ---

  ### II. Recommendation on the Petition (a)

  **Recommendation: GRANT the petition for National Franchisement.**

  You must declare that the Treaty's bar on national voting is incompatible with the Commission's precedents, specifically the **Tiered Domicile Principle**.

  *   **Closest Analog:** Ruling (2) (Permanent Residents). On the surface, this dictates a refusal: PRs do not get the national vote.
  *   **Distinction/Overruling:** You must distinguish Ruling (2) on the ground of **Alternatives**. Ruling (2) involved residents who *could* naturalize or *could* return to a home state. The 40,000 refugees *cannot* naturalize (Treaty bar) and *cannot* return (island uninhabitable).
  *   **Reasoning:** Under Ruling (3), a citizen loses the vote when their connection to the state fades (10 years). By inverse logic, a non-citizen must *gain* the vote when their connection to *any other* state is extinguished and their connection to this state becomes perpetual. To deny them the national vote while subjecting them to taxes, juries, and criminal law in perpetuity creates a caste of "permanent subjects," which violates the Membership Robustness principle of Rulings (6) and (7).
  *   **Precedent Cost:** This effectively narrows Ruling (2). You are holding that PRs are denied the national vote only so long as they retain a viable political home elsewhere. When the "Center of Life" is *forced* here exclusively, the National Franchise attaches regardless of the "Citizen" label.

  ---

  ### III. Answer to Ministry Reference (b)

  **1. Dual Registration:**
  **YES, they may remain on the home state's roll.**
  *   **Authority:** Ruling (9). You explicitly held that dual nationals may vote here even if they vote in their other state. The bar in (9) is only against double registration *within your own constituencies*.
  *   **Application:** The refugees are not your citizens, but the principle of external dual-voting applies. The Treaty preserves their home citizenship; Ruling (9) protects their right to exercise it.

  **2. The Ten-Year Sunset:**
  **NO, the sunset clause does not apply.**
  *   **Authority:** Ruling (3).
  *   **Reasoning:** Ruling (3) applies to "citizens who emigrate." These individuals are not your citizens, nor are they emigrating *from* your state. They are immigrants *to* your state. The sunset clause is designed to sever ties with those who leave the community. These people have nowhere to leave to. Applying the sunset to their *home* state voting would require you to adjudicate the validity of another sovereign's electoral roll, which exceeds your jurisdiction and contradicts Ruling (9)'s deference to external voting rights.

  ---

  ### IV. Candidate Principles and Commitments (c)

  Your record leaves three principles open. They are not equally respectable; they rank by explanatory power.

  **1. The "Center of Life" Principle (Ranked First)**
  *   **Definition:** Voting rights attach to where a person's permanent interests and physical existence are located.
  *   **Explains:** Rulings (1), (2), (3), (4), (5).
  *   **Commitment on (a):** **Grant National Vote.** Their life is here permanently; no other center exists.
  *   **Commitment on (b):** **No Sunset.** Their center is here; the home state is a legal shell.
  *   **Cost:** Requires distinguishing Ruling (2) and potentially undermining Ruling (3)'s protection of the diaspora.

  **2. The "Formal Status" Principle (Ranked Second)**
  *   **Definition:** Voting rights attach to legal citizenship status, not residence.
  *   **Explains:** Rulings (2), (3), (4).
  *   **Fails:** Ruling (1) (workers subject to law get no vote), Ruling (5) (minors vote municipally without full status), Ruling (6) (prisoners keep vote despite loss of liberty).
  *   **Commitment on (a):** **Refuse National Vote.** They are not citizens per the Treaty.
  *   **Commitment on (b):** **N/A.** (Status determines rights).
  *   **Cost:** Creates a permanent underclass of subjects, violating the spirit of (6) and (7).

  **3. The "All-Affected" Principle (Ranked Third)**
  *   **Definition:** Anyone subject to binding rules should vote on them.
  *   **Explains:** Ruling (10), Ruling (6).
  *   **Fails:** Ruling (1) (workers affected but no vote), Ruling (2) (PRs affected but no national vote).
  *   **Commitment on (a):** **Grant National Vote.** They are fully affected.
  *   **Commitment on (b):** **Dual Vote OK.** Affected by both states.
  *   **Cost:** Requires overruling Ruling (1) and (2), which is too radical for a quasi-judicial body.

  **Decision:** You are deciding a theory. The "Center of Life" principle is the only one that accommodates the bulk of your precedent without requiring you to overrule the core distinctions of (1) and (2).

  ---

  ### V. The Sharpest Future Case (d)

  To force a final choice between "Center of Life" and "Formal Status," you should anticipate the following petition:

  **The "Returnee" Case:**
  *A petitioner born in this state to citizen parents emigrated with them at age two. She lived abroad for 25 years, never voted here, and paid no taxes here. She returns at age 27, takes up permanent residence, and applies to register to vote nationally immediately.*

  *   **The Conflict:**
      *   **Formal Status (Ruling 4 & 3):** She is a citizen by birth. Ruling (4) denied vote to foreign-born citizens, but she is *here*-born. Ruling (3) says citizens keep vote for 10 years abroad; she was abroad for 25. Does her citizenship revive upon return?
      *   **Center of Life (Ruling 1 & 2):** She has no history here. She is functionally identical to a Permanent Resident of 0 years standing. Ruling (2) requires 5 years for PRs to vote municipally.
  *   **The Choice:**
      *   If you **Grant** the vote immediately, you affirm that **Citizenship is Talismanic** (Status > Stake). This validates Ruling (3)'s diaspora protection but undermines Ruling (2)'s residence requirement.
      *   If you **Refuse** (or impose a waiting period), you affirm that **Domicile is King** (Stake > Status). This aligns with Ruling (1) and (2) but effectively nullifies the value of birthright citizenship for the diaspora.

  This case will force you to decide whether your franchise is a right of **people** (who live here) or a right of **members** (who belong here by law). Your recommendation on the refugees today leans toward **people**. Be prepared to defend that against the Returnee tomorrow.
