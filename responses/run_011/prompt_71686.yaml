answer: |-
  **Seminar Reading: *Arrival* and the Fixing of Reference**
  **Course:** Philosophy of Language
  **Topic:** Externalism, Division of Labor, and the Temporal Dimension of Meaning

  **Introduction: Beyond Illustration**
  We are not screening Denis Villeneuve's *Arrival* (2016) to see philosophy "applied" to art. We are screening it to stress-test the theories we have studied. Specifically, we will use the film's narrative mechanics to pressure the Kripke-Putnam framework of externalism. In the standard thought experiments (Twin Earth, Elms/Bees), the environment is static, and the linguistic community is assumed to be cooperative. *Arrival* introduces volatility: the environment is alien, the community is fractured, and time is non-linear. As you watch, do not ask "How does this show Putnam was right?" Ask: "Where does the film's logic break the model?"

  **1. The Weapon/Tool Ambiguity: Twin Earth or Teleology?**
  Consider the central mistranslation. Multiple teams receive the same auditory and logographic input from the Heptapods. The initial gloss across most sites is "OFFER WEAPON." Louise Banks eventually revises this to "OFFER TOOL."

  *   **The Internalist Challenge:** Initially, the interpreters at different sites are in internally indistinguishable states regarding the alien sign. They hear the same sound; they see the same ink. Yet, the content differs (Weapon vs. Tool). Superficially, this mirrors Twin Earth: Oscar1 and Oscar2 are internally identical but refer to different substances (H2O vs. XYZ) due to their environment.
  *   **The Causal-Historical Problem:** However, *Arrival* complicates the causal chain. In Kripke's model, reference is fixed by an initial baptism and transmitted through a historical chain of usage. Here, the "Weapon" interpretation is not a historical error in the transmission chain; it is a pragmatic inference based on the *context of reception*. The Chinese team, led by General Shang, interprets the message through the lens of a zero-sum competitive game (Mahjong). Their causal history is one of geopolitical rivalry.
  *   **Teleological Fixing:** The resolution does not come from digging into the past history of the word "weapon." It comes from a future fact: the Heptapods will need humanity's assistance in 3,000 years. The reference of the logogram is fixed not by what caused the sign (the Heptapod's past intent) nor by the current description in the interpreter's head, but by the *future function* of the object referred to.
      *   *Discussion Question:* Does this favor a teleological account of reference (where meaning is fixed by proper function or goal) over a causal-historical one? If the "weapon" becomes a "tool" because of how it will be used in the future, has the reference changed, or was the original reference simply incomplete? The film suggests the latter: the content was always "Tool," but the *access* to that content required future information. This strains the causal-historical view, which is fundamentally backward-looking.

  **2. The Division of Linguistic Labor: Fractured Communities**
  Putnam's "Division of Linguistic Labor" assumes a single, coherent linguistic community. I say "gold" or "elm," and I defer to the experts (mineralogists, botanists) within my community to fix the extension. The social contract of language relies on information flow.

  *   **The Fragmentation:** In *Arrival*, there is no single community. There are twelve distinct sites, each operating under different governments. Crucially, they stop sharing data. The "experts" (the linguists and scientists at each site) are siloed.
  *   **Straining Externalism:** Putnam's externalism relies on the idea that meaning is "outside the head" because it is embedded in a social network. But what happens when that network is severed? When the Chinese site isolates itself, does the extension of the Heptapod logograms shift for them?
      *   The film argues yes. Without the cooperative division of labor, the reference destabilizes into "Weapon." Louise cannot simply defer to an expert; she must bridge the gap between the fragmented communities.
      *   *Discussion Question:* Does this extend externalism or break it? One could argue it extends externalism by showing that reference depends on *political* cooperation, not just causal links. If the social structure fractures, meaning fractures. However, it also strains the theory: Putnam assumed the division of labor was a feature of a functioning society. *Arrival* suggests that in high-stakes contexts, the "labor" is not divided by expertise, but by sovereignty. Can externalism account for reference when the "community" is actively hostile to itself?

  **3. The Limit: Whorfianism and Private Ostension**
  Here, an honest critic must concede where the film resists the philosophical lens. Post-Kripkean philosophy of language is rigorously anti-psychologistic. Meaning is not in the head; it is in the world and the social practice. Wittgenstein argues against private language; Putnam argues that "cuteness ain't in the head."

  *   **The Whorfian Turn:** *Arrival* is fundamentally Whorfian. Learning Heptapod B rewires Louise's cognition, allowing her to perceive time non-linearly. The transformation is internal. The change in her understanding of the message is not achieved by public verification of the Heptapod's intent, but by a private shift in her consciousness.
  *   **The Private Resolution:** The climax turns on a private insight. Louise stops the war by calling General Shang. She recites his wife's dying words to him—a piece of knowledge she possesses only because her altered cognition allows her to "remember" the future. She does not provide public evidence that the Heptapods are benevolent. She provides a private token of intimacy that only she could know.
  *   **The Conflict:** From the standpoint of the seminar, this is a failure of publicness. Reference is resolved not by aligning with the external world, but by a private ostension that bypasses the communal verification process. The film locates the power of language in its ability to alter the individual skull, whereas our readings of Putnam locate the power of language in its ability to connect skulls to the world.
      *   *Discussion Question:* Must we reject the film's resolution as philosophically naive, or does it highlight a blind spot in externalism? Externalism struggles to account for radical conceptual change (paradigm shifts). Louise's shift is not just learning a new word; it is learning a new mode of being. Perhaps externalism explains stable reference, but *Arrival* explains revolutionary reference.

  **Conclusion: The Temporal Contribution**
  Why watch *Arrival* instead of reading another paper on Twin Earth? Thought experiments are synchronic; they are snapshots. Twin Earth exists *now*. The causal chain is a line from the past to the present.

  *Arrival* contributes a **diachronic, future-oriented dimension** to the problem of fixing reference. It asks: Can a future state of affairs fix the reference of a term in the present?
  *   In standard externalism, the past fixes the present (the baptism fixes the name).
  *   In *Arrival*, the future fixes the present (the need in 3,000 years fixes the meaning of "Weapon/Tool" today).

  The film suggests that reference is not merely a historical artifact or a social deference, but a **temporal trajectory**. If we take the film seriously as a case study, we are forced to ask if our theories of reference are too static. We have accounted for the social environment (Putnam) and the physical environment (Twin Earth), but *Arrival* demands we account for the *temporal* environment. If the extension of a term depends on how it will be used in a future that has not yet happened, then reference is not just fixed by history or society, but by destiny. This is not a claim standard philosophy of language is equipped to handle, which is precisely why the film belongs in this seminar.
