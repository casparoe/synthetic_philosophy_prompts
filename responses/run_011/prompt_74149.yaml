answer: |-
  1. **The target**
  Her position asserts a dual defect: epistemic (testimony fails to transmit moral knowledge) and aretaic (acting on such belief lacks moral worth). The epistemic charge holds that moral propositions require grasping underlying reasons, which testimony cannot convey. The aretaic charge claims autonomy requires first-hand moral judgment. However, her core arguments rely on the epistemic claim. If testimony could transmit moral knowledge, the charge of moral deficiency would lose its force, reducing to a contingent preference for autonomy. Conversely, if the defect is purely aretaic, she concedes moral knowledge is possible via testimony, undermining the "strong" pessimism. Thus, her view stands or falls on the claim that moral understanding is non-transferable. The pressure lies in explaining why moral reasons differ from complex empirical or mathematical reasons, which *are* transferable via testimony.

  2. **The questions**

  1.  **Question:** Is the defect primarily epistemic (no knowledge) or aretaic (no moral worth)? **Expected Reply:** Epistemic failure causes aretaic failure. **Follow-up:** Then why can't testimony transmit moral reasons like mathematical ones? **Tag:** Epistemic Foundation.
  2.  **Question:** If you retreat to purely aretaic, do you concede moral knowledge via testimony? **Expected Reply:** Yes, but acting on it is still bad. **Follow-up:** Doesn't that make the view practically inert for knowledge seekers? **Tag:** Retreat Cost.
  3.  **Question:** How do we identify moral experts without antecedent moral judgment? **Expected Reply:** We look for coherence or non-moral virtues. **Follow-up:** Isn't coherence itself a moral criterion? **Tag:** Expert Identification.
  4.  **Question:** If I lack moral expertise, how can I judge your coherence reliably? **Expected Reply:** You can't fully, hence the risk. **Follow-up:** So pessimism mandates skepticism about *all* moral testimony? **Tag:** Skeptical Spiral.
  5.  **Question:** Consider an agent raised in a corrupt community. Is deference to a reformer defective? **Expected Reply:** Yes, but excusable. **Follow-up:** If excusable, is the defect real or contextual? **Tag:** Corrupt Community.
  6.  **Question:** If the reformer saves lives, is acting on their word morally deficient? **Expected Reply:** The action is right, the agency is flawed. **Follow-up:** Does moral worth trump right action in emergencies? **Tag:** Moral Worth vs. Rightness.
  7.  **Question:** Does testimony with reasons attached avoid the defect? **Expected Reply:** Only if you grasp the reasons yourself. **Follow-up:** What if you accept the reasons solely on their authority? **Tag:** Reasons vs. Authority.
  8.  **Question:** Where is the line between grasping reasons and deferring to their presentation? **Expected Reply:** You must do the normative work. **Follow-up:** Isn't that just independent judgment, rendering testimony superfluous? **Tag:** Redundancy.
  9.  **Question:** Does your view apply to aesthetic testimony (e.g., wine tasting)? **Expected Reply:** Yes, understanding requires experience. **Follow-up:** Then why is moral pessimism more urgent than aesthetic pessimism? **Tag:** Aesthetic Analogy.
  10. **Question:** If aesthetic deference is acceptable in practice, why not moral? **Expected Reply:** Moral stakes are higher. **Follow-up:** Does stakes sensitivity change epistemic transmission rules? **Tag:** Stakes Sensitivity.
  11. **Question:** Can testimony trigger the grasping of reasons later? **Expected Reply:** Maybe, but not at the moment of belief. **Follow-up:** So the defect is temporary? **Tag:** Temporal Defect.
  12. **Question:** Is the requirement for first-hand judgment compatible with moral division of labor? **Expected Reply:** No, morality isn't divisible. **Follow-up:** Why not, given cognitive limitations? **Tag:** Division of Labor.

  3. **Escape routes**
  She may argue the pessimism applies only to "bare assertion," excluding testimony accompanied by reasons. Close this by insisting that accepting reasons on authority is still deference; if the agent doesn't independently validate the reasoning, the epistemic source remains the speaker. Second, she might concede the defect is excusable in non-ideal conditions (e.g., the corrupt community). Counter by noting that if the defect is excusable, it lacks normative bite; a defeasible prohibition is hardly a philosophical constraint. Finally, she may claim morality is unique because it governs the will, unlike empirical facts. Respond that epistemic justification tracks truth, not volition. If the testimony is reliable, the belief tracks truth. Restricting this based on autonomy conflates epistemology with moral psychology, leaving the epistemic claim unsupported.

  4. **One question not to ask**
  Avoid asking, "Does this apply to children learning morality from parents?" This invites a developmental exception. Once conceded, the principle shifts from "testimony is defective" to "competent adults shouldn't defer." This retreat safeguards her view against intuitive counterexamples while retaining the claim for specific cases. It allows her to frame pessimism as an ideal theory constraint rather than a practical epistemic rule, insulating her from charges of implausibility. Press the universal claim, not its exceptions.
