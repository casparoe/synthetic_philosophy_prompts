      *   *Claim 2 (Aretaic/Moral):* Acting on such belief is morally deficient (lack of moral worth/autonomy).
      *   *Key Proponents:* Sarah McGrath, David Enoch (though Enoch is more nuanced), maybe aspects of Kantian autonomy views. The prompt specifies "strong form," suggesting someone like McGrath or a strict Kantian constructivist.
      *   *Tension:* Often, pessimists argue the epistemic defect *explains* the moral defect, or vice versa. Or they argue they are distinct but co-occurring. The prompt asks to separate them.
      *   *Pressure Points:*
          *   Epistemic vs. Moral: If it's just moral worth, epistemology is safe. If it's epistemic, why is morality special?
          *   Expertise: How do we know who to listen to without moral judgment?
          *   Corrupt Community: What if my own reasoning is corrupted?
          *   Reasons: Does hearing reasons count as "say-so"?
          *   Aesthetics: Does this apply to taste? (Often used as a counter-analogy).

  3.  **Drafting Section 1: The Target (~150 words)**
      *   Need to distinguish the epistemic claim (no knowledge/justification) from the aretaic claim (no moral worth/autonomy).
