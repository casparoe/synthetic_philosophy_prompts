      *   *Drafting:* Her position asserts a dual defect: epistemic (testimony fails to transmit moral knowledge) and aretaic (acting on such belief lacks moral worth). The epistemic charge holds that moral propositions require grasping underlying reasons, which testimony cannot convey. The aretaic charge claims autonomy requires first-hand moral judgment. However, her core arguments rely on the epistemic claim. If testimony could transmit moral knowledge, the charge of moral deficiency would lose its force, reducing to a contingent preference for autonomy. Conversely, if the defect is purely aretaic, she concedes moral knowledge is possible via testimony, undermining the "strong" pessimism. Thus, her view stands or falls on the claim that moral understanding is non-transferable. The pressure lies in explaining why moral reasons differ from complex empirical or mathematical reasons, which *are* transferable via testimony.

