          2.  *Q:* If you retreat to purely aretaic, do you concede moral knowledge via testimony? *A:* Yes, but acting on it is still bad. *F:* Doesn't that make the view practically inert for knowledge seekers? *Tag:* Retreat Cost.
          3.  *Q:* How do we identify moral experts without antecedent moral judgment? *A:* We look for coherence or non-moral virtues. *F:* Isn't coherence itself a moral criterion? *Tag:* Expert Identification.
          4.  *Q:* If I lack moral expertise, how can I judge your coherence reliably? *A:* You can't fully, hence the risk. *F:* So pessimism mandates skepticism about *all* moral testimony? *Tag:* Skeptical Spiral.
          5.  *Q:* Consider an agent raised in a corrupt community. Is deference to a reformer defective? *A:* Yes, but excusable. *F:* If excusable, is the defect real or contextual? *Tag:* Corrupt Community.
          6.  *Q:* If the reformer saves lives, is acting on their word morally deficient? *A:* The action is right, the agency is flawed. *F:* Does moral worth trump right action in emergencies? *Tag:* Moral Worth vs. Rightness.
          7.  *Q:* Does testimony with reasons attached avoid the defect? *A:* Only if you grasp the reasons yourself. *F:* What if you accept the reasons solely on their authority? *Tag:* Reasons vs. Authority.
          8.  *Q:* Where is the line between grasping reasons and deferring to their presentation? *A:* You must do the normative work. *F:* Isn't that just independent judgment, rendering testimony superfluous? *Tag:* Redundancy.
          9.  *Q:* Does your view apply to aesthetic testimony (e.g., wine tasting)? *A:* Yes, understanding requires experience. *F:* Then why is moral pessimism more urgent than aesthetic pessimism? *Tag:* Aesthetic Analogy.
          10. *Q:* If aesthetic deference is acceptable in practice, why not moral? *A:* Moral stakes are higher. *F:* Does stakes sensitivity change epistemic transmission rules? *Tag:* Stakes Sensitivity.
          11. *Q:* Can testimony trigger the grasping of reasons later? *A:* Maybe, but not at the moment of belief. *F:* So the defect is temporary? *Tag:* Temporal Defect.
          12. *Q:* Is the requirement for first-hand judgment compatible with moral division of labor? *A:* No, morality isn't divisible. *F:* Why not, given cognitive limitations? *Tag:* Division of Labor.

