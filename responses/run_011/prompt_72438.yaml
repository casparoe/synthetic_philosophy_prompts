      *   *Correction:* On Giffen goods. The friend mentions buying more when price rises as an "anomaly." In standard theory, Giffen goods are *consistent* with utility maximization. In RPT, they are also consistent if the budget sets align. The real anomalies are framing effects or preference reversals (Lichtenstein & Slovic). I should clarify this distinction.
