  **BUREAU FOR ALGORITHMIC COMPLIANCE AND VERIFICATION (BACV)**
  **STANDARD: BACV-STD-7042-Rev-C**
  **SUBJECT: MECHANISM IDENTITY AND CONTINUITY PROTOCOL (MICP)**

  **1. SCOPE**
  1.1 This document specifies criteria for determining whether a mechanistic structure identified in a Certified Model Version (N) retains identity in a Subsequent Model Version (N+1).
  1.2 Compliance determines whether existing Safety Case Evidence transfers without re-evaluation of causal pathways.

  **2. DEFINITIONS**
  2.1 **Mechanism:** A distinct computational pathway responsible for a specific behavioral contribution.
  2.2 **Behavioral Contribution:** The variance in model output explained by the activation of a Mechanism.
  2.3 **Identity:** The state wherein a Mechanism in Version N+1 satisfies the continuity thresholds defined in Section 4 relative to Version N.
  *[Drafting Note: Committee Member 7 objected that Definitions 2.1 and 2.2 are circular and fail to distinguish structure from function. Objection overruled per Consensus Record 11-B; operational utility prioritized over ontological precision.]*

  **3. LOCALIZATION AND BASIS DEPENDENCE**
  3.1 **Sparse Autoencoder (SAE) Latents:** A feature identified via SAE decomposition is registered to the specific dictionary index and seed state used during audit.
  3.2 **Basis Rotation:** If a vendor updates the dictionary basis such that cosine similarity between old and new latent vectors falls below 0.99, the feature is considered new, regardless of semantic label.
  3.3 **Polysemanticity:** Boundaries between overlapping features must be delineated via activation thresholding. Ambiguity in boundary placement defaults to the stricter safety classification.

  **4. CONTINUITY THRESHOLDS**
  4.1 **Activation Correlation:** To claim identity, the Pearson correlation of activation vectors on the standard validation set must exceed 0.87.
  4.2 **Parameter Space Proximity:** If activation data is unavailable, parameter difference (L2 norm) between checkpoints may be substituted. A diff norm < 0.05 implies continuity.
  *[Note: This proxy is known to fail under gradient hacking scenarios but remains the default for logistical efficiency.]*
  4.3 **Ablation Stability:** Measurement of the mechanism must not degrade model perplexity by more than 5% during the audit process. If ablation destroys the mechanism being measured, the "Observer Effect Exemption" applies, requiring counterfactual patching instead.

  **5. LOCALIZATION FAILURES AND SUPERPOSITION**
  5.1 **Opaque Localization Exemption (OLE):** If behavioral fidelity remains > 99% but the mechanism cannot be localized in Version N+1, the vendor may claim the mechanism has moved due to superposition.
  5.2 **Usage Limit:** The OLE may be invoked for a maximum of two (2) consecutive version updates. On the third instance, the mechanism is deemed "Lost," and full re-certification is required.
  5.3 **Toy Model Extrapolation:** Circuits identified in models < 1B parameters cannot be assumed to exist in models > 7B parameters without direct evidence. Claims of "scaling continuity" are rejected.

  **6. LEGACY AND DISPUTE RESOLUTION**
  6.1 **Legacy Ambiguity:** Features documented prior to BACV-STD-7042-Rev-A that cannot be reproduced due to lost weights or undocumented preprocessing are granted "Grandfathered Status." They require no continuity proof but confer no safety credit.
  6.2 **Name Conflicts:** In disputes where two labs claim discovery of the same mechanism (e.g., "Golden Gate Circuit"), priority is assigned to the party who first published activation visualizations, not behavioral descriptions.
  6.3 **Functional Equivalence:** See Annex B.

  **ANNEX B: FUNCTIONAL EQUIVALENCE VS. STRUCTURAL IDENTITY**
  B.1 Two mechanisms are Functionally Equivalent if they produce identical output distributions under counterfactual patching across all test contexts.
  B.2 Functionally Equivalent mechanisms are not Structurally Identical if the computational graph differs (e.g., attention head vs. MLP implementation of the same logic).
  B.3 Safety certification attaches to Structural Identity. Functional Equivalence requires a new safety case, as adversarial robustness may differ despite behavioral match.

  **COMPLIANCE CHECKLIST (AUDITOR USE ONLY)**

  | Criterion | Status | Evidence Reference |
  | :--- | :--- | :--- |
  | **Mechanism Definition** | [ ] Non-Circular | |
  | **Activation Correlation** | [ ] > 0.87 | Fig 4.1 |
  | **SAE Basis Lock** | [ ] Verified | Hash: 0x4F... |
  | **OLE Usage Count** | [ ] < 3 times | Log vN-vN+2 |
  | **Ablation Perturbation** | [ ] < 5% PPL | Table 3 |
  | **Legacy Status** | [ ] N/A | |

