answer: |-
  **The Scenario**

  A maintenance crew is auditing a "Bio-Filter Rack," a single steel frame holding ten identical plastic troughs that slide into a channel and rest solely by gravity and friction, with no clips, bolts, or glue, arranged side-by-side in continuous contact to function as one air-purification surface. Exactly five of the troughs contain living ferns rooted in wet soil, while the other five contain dried ceramic stones of equal weight for ballast, and the crew's handover sheet requires a definitive count of "installed functional units" currently occupying the rack.

  **The Check**

  *   **Nihilism (No Composites):** The count is **zero**. Since there are no composite objects, there are no troughs, no ferns, and no racks, only simples arranged trough-wise and fern-wise. This view ignores the inventory's macroscopic categories entirely.
  *   **Universalism (Unrestricted Composition):** The count is **indeterminate but vast**. Ontologically, every sum of parts exists (the left half of the rack, the sum of trough 1 and trough 6, the whole rack, etc.). While they might pragmatically endorse the inventory's number, their ontology commits them to the existence of the dead troughs as objects just as much as the living ones, plus infinite overlapping objects.
  *   **Life-Based Moderate (Organicism):** The count is **five**. Composition occurs only when the activity of the parts constitutes a life. The five ferns exist as composite organisms. The five dead troughs (plastic + stones) do not compose objects, nor do the troughs compose objects with the ferns (since the plastic isn't part of the life). This agrees with Nihilism regarding the dead troughs (they are not objects) but disagrees regarding the ferns.
  *   **Function-Based Moderate (Artifact/Contact):** The count is **ten**. Composition occurs when parts are arranged to perform a function, even without fastening. All ten troughs function as filtration modules (living or ballast). This agrees with Universalism that non-living composites exist, but disagrees by restricting the count to functional units rather than arbitrary sums.

  **The Honest Bit**

  The single feature doing the work is the **biological life** in exactly half the units. If you delete it (swap the ferns for artificial turf), the Life-Based view drops its count from five to **zero**, collapsing entirely into Nihilism for this scenario, while the Function-Based view stays at **ten**. The defender of the Life-Based view comes out worst here, as denying the existence of the plastic troughs contradicts common sense most sharply. To attack the case, they would **deny the counting question is malformed** for ontology, arguing that the inventory asks for pragmatic utility ("what do we treat as a unit?"), not metaphysical truth ("what actually exists?"), and thus the intuition that the dead troughs are objects is merely a linguistic convenience, not an ontological fact.
