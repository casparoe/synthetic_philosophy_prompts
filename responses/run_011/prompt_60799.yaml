answer: |-
  You have put your finger on the central tension in contemporary collapse studies. It is the friction between the *systemic* definition of collapse (loss of socio-political complexity) and the *human* definition of collapse (suffering, mortality, displacement).

  You are describing two distinct phenomena that are empirically correlated but theoretically separable. The literature treats them differently. Let's break them down, evaluate the existing terminology, and then deal with the naming problem for the second one.

  ### 1. The Socio-Economic Reality: "Simplification" vs. "Liberation"

  **Candidate Terms:**
  *   **Simplification (Tainter):** Joseph Tainter (*The Collapse of Complex Societies*, 1988) defines collapse specifically as a "rapid, significant loss of an established level of sociopolitical complexity." He argues that complexity has diminishing returns. When the cost of maintaining the palace/temple/bureaucracy exceeds the benefit, the system simplifies.
  *   **Reorganization / Transformation (Processualists):** Older archaeological parlance preferred "reorganization" to avoid the pejorative "collapse." This is often criticized as euphemistic.
  *   **The Release Phase (Resilience Theory):** In the Panarchy/Adaptive Cycle model (Holling, Gunderson, applied to archaeology by Redman & Kinzig), this is the $\Omega$ (release) to $\alpha$ (reorganization) transition. Resources locked in rigid structures are released.
  *   **Fleeing the State (Scott):** James Scott (*Against the Grain*, 2017) argues that early states were "population traps" with poor health. Collapse is often a "barbarian" strategy to escape the burden of the state.

  **Best Fit:**
  **"Simplification"** is the rigorous technical term for the loss of hierarchy, monuments, and specialization. However, it is value-neutral. It does not inherently imply people got *better* off, only that the system became less complex.

  To capture the *improvement* in commoner welfare (the enamel defects, the diet), the field is increasingly leaning on Scott's framework, though there isn't a single noun for it. Some bioarchaeologists refer to this as **"Post-Collapse Recovery"** or **"The Collapse Dividend"** (informal).

  **Why it fits:** It accounts for the Roman Britain and Maya examples. In Roman Britain, the "collapse" is the end of the tax-extraction network (coins, villas). For the peasant, the end of tax extraction often means better nutrition. In the Maya lowlands, the end of the *k'uhul ajaw* (divine lord) system ended the tribute burden, allowing population dispersion.

  ### 2. The Epistemological Bias: The "Hole in the Record"

  **Candidate Terms:**
  *   **Monumental Bias:** This is the standard term. It acknowledges that archaeology historically prioritized big stones over dirt floors.
  *   **Preservation Bias / Taphonomy:** This covers *why* things survive (fire baked the Linear B tablets; stone lasts, wood rots).
  *   **The Dark Age Construct:** Historians use this to describe the *period* of silence, but not the *mechanism* of the silence.
  *   **Elite Bias:** Acknowledges that the record reflects the elite perspective.

  **The Problem:**
  None of these fully capture the specific causal link you identified: *The record disappears specifically because the funding apparatus for the record disappeared.* It's not just that we prefer monuments; it's that the *production of visibility* was a state function. When the state simplifies, the signal stops.

  **The Coinage:**
  Since there is no single established term for "the archaeological record vanishes because the political entity that generated the high-visibility markers ceased to exist," I propose we call this:

  **State-Dependent Visibility (SDV)**

  **Definition:** SDV occurs when the archaeological detectability of a population is contingent upon the existence of a centralized apparatus capable of producing durable, high-energy markers (monuments, archives, coinage, prestige goods). When the state simplifies, visibility drops precipitously, creating a false impression of demographic or cultural disappearance.

  **Why this term?**
  It shifts the blame from the *archaeologist's bias* (Monumental Bias) to the *system's structure*. The society didn't become invisible; the *mechanism of visibility* was dismantled.

  ### 3. Are (a) and (b) Separable?

  **Theoretically: Yes.**
  You can imagine a scenario where the state collapses (a), but the people continue to produce high-visibility markers (b). For example, if a decentralized confederation continued to build stone monuments without a palace bureaucracy.
  Conversely, you can have a state that persists but stops producing markers (e.g., a "hollow state" or extreme austerity), though this is rarer in pre-modern contexts where legitimacy was performative.

  **Empirically: No.**
  In the pre-modern world, **Simplification** and **State-Dependent Visibility** are fused.
  *   **Why?** Because "complexity" (Tainter's definition) *is* the production of visibility. A palace is a visibility machine. A script is a visibility technology. Coinage is a visibility standard.
  *   **The Fusion:** When the system simplifies to relieve the burden on the population (a), it necessarily stops burning the energy required to create the archaeological signal (b).
  *   **The Field's Error:** Traditional history/archaeology fused them *interpretively*. They assumed Low Visibility = Low Population/Civilization. Modern collapse studies (McAnany & Yoffee, *Questioning Collapse*, 2010) work to decouple them analytically.

  ### 4. Boundary Cases for "State-Dependent Visibility"

  You asked for the edges. Does SDV apply when writing survives but the state doesn't?

  **Case 1: Writing Survives, State Collapses (The Counter-Example)**
  *   *Example:* **Post-Roman Western Europe.** The Western Empire collapses (no emperor, no legions, no tax), but Latin literacy survives in the Church.
  *   *SDV Analysis:* Here, visibility is **Institution-Dependent**, not strictly State-Dependent. The Church became the new "state" for visibility purposes. The "hole" is less deep in France than in Britain because the visibility apparatus (monasteries) remained funded.
  *   *Verdict:* SDV still holds, but the "State" variable expands to include any durable hierarchy (like a Church) that subsidizes record-keeping.

  **Case 2: State Survives, Markers Stop (The "Austerity" Edge)**
  *   *Example:* **Late Bronze Age Egypt (20th Dynasty).** The Pharaohs are still there, the state is technically intact, but monument building and tomb quality plummet due to economic strain.
  *   *SDV Analysis:* This is the **Leading Edge** of SDV. Visibility drops *before* total collapse. It signals the "diminishing returns" phase Tainter describes. The record gets "quiet" before the system fails.

  **Case 3: The Linear B Paradox (Destruction = Preservation)**
  *   *Example:* **Mycenaean Palaces.** As you noted, the tablets only exist because the palaces burned.
  *   *SDV Analysis:* This is a specific taphonomic subset I'd call **"Catastrophic Legibility."** Normally, SDV means the record fades as the state fades. Here, the record is *created* by the state's death throes.
  *   *Boundary:* This highlights the extreme fragility of SDV. The entire written history of Mycenaean Greece hangs on a few weeks of fire. If they had declined slowly (like the Maya in some areas), we might have *no* writing at all. This makes SDV non-linear; it's not a dimmer switch, it's a cliff.

  ### Summary Recommendation

  When writing or speaking on this:

  1.  For the **people getting better off**: Use **"Simplification"** (Tainter) qualified by **"Resilience"** or **"Adaptive Reorganization."** If you want to be provocative, cite Scott and call it **"Emancipation from Complexity."**
  2.  For the **record disappearing**: Use **"State-Dependent Visibility."**
  3.  For the **combined phenomenon**: You are describing the **"Legibility Cliff."**

  The "Legibility Cliff" is the moment where the socio-political simplification (a) triggers the State-Dependent Visibility failure (b), creating the illusion of a "Dark Age."

  **Why the field keeps them fused:**
  Because archaeology was born out of antiquarianism—we chased the monuments. To study the "hole" requires a different methodology (bioarchaeology, settlement survey, paleobotany) than studying the "peak" (epigraphy, art history). It is only in the last 30 years, with the rise of bioarchaeology and regional survey, that we have the data to see the "other side" of the cliff. We are still building the vocabulary to describe the view from the bottom.
