answer: |-
  1. **Bottom line**

  The three theses are: (i) translation fails locally because specific terms lack context-free synonyms across the divide; (ii) lexical structures differ because terms occupy distinct taxonomic networks governing what counts as a kind; (iii) perception varies because training directs attention to different stimuli within the same visual field. Kuhn ultimately grounded (i) and (iii) in (ii), treating lexical structure as the primary reality. Your dilemma loses its grip when we accept that historical description proceeds from within a specific lexicon rather than from a neutral nowhere, acknowledging the loss of meaning without requiring a universal meta-language to capture it. The historian speaks from the present, describing the past as other, not as error.

  2. **Three readings separated**

  You are quite right to suspect that distinct claims are often conflated. In *The Structure of Scientific Revolutions*, Kuhn presented these ideas as a bundled package, but in his later work, particularly the essay you cited, he disentangled them to shore up the doctrine against logical positivist criticism.

  Thesis (i), the translation thesis, claims that there is no neutral language into which both competing theories can be fully translated without loss. This is not a claim that scientists cannot understand one another, but that there is no sentence-by-sentence equivalence. Thesis (ii), the lexical thesis, is the structural engine driving this. It posits that scientific terms function as kind terms within a taxonomic hierarchy. Crucially, Kuhn adopted a 'no-overlap principle': within a given taxonomy, an object cannot belong to two mutually exclusive species at the same level. When a revolution occurs, the taxonomy itself is rearranged; objects previously grouped together are separated, or vice versa. Consequently, a term like 'planet' or 'mass' refers to a different set of kinds, making simple synonymy impossible. Thesis (iii), the perceptual thesis, suggests that because observation is theory-laden, practitioners literally see different things when looking at the same apparatus—a gestalt switch akin to seeing a duck rather than a rabbit.

  Kuhn's commitment shifted over time. In *Structure*, he leaned heavily on (iii), using gestalt psychology to explain the resistance to paradigm change. However, he later recognised this was vulnerable to empirical psychological critique and seemed too subjective. In his later period, he retreated to (ii) as the fundamental claim. He argued that (i) is a logical consequence of (ii): if the taxonomic structures differ, full translation must fail because there is no common measure to map the kinds. He largely abandoned (iii) as a necessary condition, treating it as a metaphorical description of the cognitive shift required to learn a new lexicon rather than a literal claim about retinal input.

  Can (ii) be held without (i) or (iii)? Yes, and indeed, this is Kuhn's mature position. The lexical restructuring is the objective fact of the historical change. The translation failure (i) follows necessarily from that structural mismatch. The perceptual claim (iii) is merely a phenomenological report of what it feels like to navigate between these structures. One can maintain that the classification of kinds has changed (ii) and therefore strict translation is impossible (i), without committing to the controversial claim that the scientists' visual experiences are physiologically distinct (iii). The core of incommensurability is thus semantic and structural, not psychological.

  3. **The Davidson objection and the bilingual's reply**

  Donald Davidson's objection is formidable because it attacks the coherence of the concept of a conceptual scheme itself. Paraphrasing his argument: to identify a belief or a meaning, we must interpret it. Interpretation requires translation into our own language. If a body of discourse fails to translate in large part, we have no grounds for calling it a language or attributing beliefs to its speakers at all. Therefore, global incommensurability is unintelligible; any intelligible discourse must be largely commensurable.

  This bites hard on a strong reading of thesis (i) if understood as global untranslatability. If Newtonian and Einsteinian physicists could not understand each other at all, they would not be engaging in debate. Kuhn conceded this point to Davidson. He agreed that incommensurability is local, not global. The languages share most of their structure (logic, mathematics, much ordinary vocabulary); the failure of translation is confined to specific clusters of kind terms. Davidson's argument shows that total failure is impossible, but it does not preclude local failure where the taxonomic structures diverge.

  Kuhn's appeal to bilingualism is his solution to the residual problem. If translation fails, how do we understand the past? Kuhn suggests we should not think of understanding as translating the old term into a new equivalent, but as acquiring the old term as a second language. When you learn French, you do not simply map *chien* onto *dog*; you learn to use *chien* within the context of French life. Similarly, the historian learns to use 'mass' within the Newtonian lexicon without requiring it to mean the same as 'mass' in the Einsteinian lexicon.

  Is this a third thing? Yes, it is distinct from both full translatability and untranslatability. Full translatability implies synonymy; untranslatability implies silence. Bilingualism implies competence without synonymy. It allows the historian to switch contexts—to speak *as* a Newtonian when analysing Newton, and *as* an Einsteinian when analysing Einstein—without demanding a neutral interlingua that reduces one to the other. It preserves the difference (the incommensurability) while allowing communication (the commensurability of the historians). It is not merely a dignified redescription of partial translation, because partial translation suggests a mapping exists but is incomplete. Bilingualism suggests the mapping is the wrong model entirely; the relationship is one of use within a form of life, not semantic equivalence.

  4. **The dilemma tested**

  Your dilemma posits that the lexical thesis is either too weak (reducible to partial synonymy via glossary) or too strong (making historical description impossible). This assumes that for a description to be valid, it must occur in a neutral language that stands outside both lexicons. Kuhn denies such a neutral language exists.

  The dilemma loses its grip once we abandon the requirement for a God's-eye view. The historian does not state the difference from nowhere; they state it from within their own current lexicon, using their bilingual capacity to characterise the older one. When I say 'Newton's mass differs from Einstein's', I am using my current terms to mark a boundary. The glossary fails not because it is partial, but because it attempts to strip the term of its inferential role. A glossary might define 'mass' as 'quantity of matter', but this misses how 'mass' functions in Newton's equations versus Einstein's. The work is done by the taxonomic structure itself, which dictates what predicates apply.

  The historian can describe the change because they are not trying to merge the lexicons, but to map the transition. They acknowledge that some meanings are lost in translation. The 'too strong' horn assumes that describing a difference requires a shared language in which the difference is substantive. But the shared language is the historian's present language, used to report on the past. The 'too weak' horn assumes a glossary captures meaning. Kuhn argues meaning is use within a taxonomy. Therefore, the dilemma rests on a false premise about the nature of historical description and semantic content.

  5. **The two cases adjudicated**

  **Case A: Relativistic Mass**
  Your instinct and your colleague's represent the tension between continuity and discontinuity. Your colleague is closer to Kuhn's lexical thesis (ii), while you are focusing on the mathematical continuity. For Kuhn, this is indeed a case of lexical reorganisation (ii). The term 'mass' changed its place in the taxonomic network. In the older usage, 'mass' was a velocity-dependent variable; in the newer, it is an invariant kind. They are not synonyms despite the shared spelling. However, this case lacks the full drama of incommensurability (i) because the mathematical bridge is trivial. The formulations are interconvertible, meaning communication was never broken. Thus, it instantiates (ii) without significant (i) or (iii). It is a lexical shift that did not require a revolution because the community could agree on the translation rules. Your colleague is right that the concept changed; you are right that it was not a revolutionary break.

  **Case B: The Reclassification of Pluto**
  Your reading here is correct and illuminating. This is a clear instance of lexical reorganisation (ii) occurring without a Kuhnian revolution. The IAU vote changed the taxonomic structure of 'planet', excluding Pluto. However, all parties agreed on the observational data (mass, orbit). This shows that (ii) can occur within a framework of complete commensurability. For Kuhn, a revolution requires not just lexical change, but a breakdown in communication where no neutral language exists to adjudicate the dispute. In the Pluto case, the dispute was resolved by stipulation within a shared language. This demonstrates that lexical change (ii) is necessary for revolution but not sufficient. It validates your suspicion that not all lexical shifts are incommensurable. The case shows that (ii) can exist independently of the communication breakdown characteristic of (i).

  6. **What I should stop saying**

  1.  **Stop saying:** "Incommensurable theories cannot be compared."
      **Start saying:** "Incommensurable theories lack a common measure for direct translation, but can be compared bilingually."
      *Reason:* Incommensurability implies no common unit, not no comparison.

  2.  **Stop saying:** "Scientists see different things."
      **Start saying:** "Scientists categorise visual inputs differently based on their lexical training."
      *Reason:* Avoids the psychological vulnerability of the gestalt claim while retaining the semantic point.

  3.  **Stop saying:** "Theory choice is irrational."
      **Start saying:** "Theory choice is non-algorithmic."
      *Reason:* 'Irrational' suggests whim; 'non-algorithmic' acknowledges valid reasons exist without a decisive rule.

  4.  **Stop saying:** "The old theory was false."
      **Start saying:** "The old theory's kind terms no longer refer within the new taxonomy."
      *Reason:* Truth values apply to sentences; reference applies to terms. The shift is primarily lexical.
