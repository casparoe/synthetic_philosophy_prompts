prompt: |-
  I've just been roped onto the committee of a small pro-European group here in Leeds — mostly people who spent 2016 to 2019 shouting into the wind and have now decided the sensible thing is to campaign for a customs deal plus getting back into Erasmus. I'm writing the lead piece for the newsletter and the subject is the democratic deficit, because that's the objection we get most at stalls. Our treasurer, who's retired and reads a great deal, has handed me what he considers the knockdown reply, and I can't decide wether it's brilliant or whether it's quietly doing all the work for him. His line: the EU is just the Bank of England writ large. We gave interest rates to an unelected committee in 1997 precisely so that politicians couldn't fiddle with them before an election, nobody calls that a scandal, and the Commission and the ECB are the same move at a bigger scale — technical bodies handed a narrow mandate so that elected governments can make commitments they couldn't otherwise be trusted to keep. He says Majone makes the point about the regulatory state and its non-majoritarian institutions, and that Moravcsik goes further and argues there's no democratic deficit to speak of at all because the mandates are narrow and everything's been delegated by accountable governments in the first place. The conclusion he wants me to print is that we should stop apologising: the honest answer is that the EU is a rules club, delegating rule-making is completely ordinary politics, and anyone demanding a referendum on it is applying a standard they'd never apply at home.

  So can you audit the analogy properly for me? I'd like the correspondences laid out — Commission, Council, ECB against the MPC; the 2 per cent target against whatever the EU's equivalent target is supposed to be; the Chancellor's remit letter against the treaties; the open-letter mechanism and the fact that Parliament could in principle take the mandate back tomorrow against… something. Then where the mapping breaks, and I want you to be picky about which breaks actually matter for his use of it: is there anything at all in the EU that plays the role of a narrow, measurable, revisable remit, given the right of initiative and the way the competences have stretched decade by decade; what does reversibility look like when unwinding a regulation means unanimity plus Parliament rather than a sentence in a Budget speech; does the credible-commitment story stretch over the bits that plainly redistribute, the CAP, cohesion funding, social security coordination for people like my sister who works across Manchester and Dublin; and how much of the analogy depends on treating the ECJ as just another technical body when it looks much more like a constitutional court. I'd also like to know what the source case is smuggling in that the target simply lacks — a single identifiable principal, a success criterion you can actually measure, an exit ramp — and which of the disanalogies our treasurer can honestly just shrug off, because I'm sure some of them are cosmetic.

  Last thing. If the central bank picture is weaker than he thinks, is there a better analogy I could put up at the AGM instead? The obvious candidates are the members' club, the treaty-as-contract picture, and federation-in-waiting, but my suspicion is that each of those licenses its own set of conclusions and I don't want to swap one loaded comparison for another, so tell me what each would commit us to if I used it. And be blunt with me: if the right answer is that his conclusion survives for some policy areas and collapses for others, say which are which and where you'd draw the line, because I'd rather publish something honest than something triumphant. Around nine hundred words is plenty, and assume I know the institutions well but have never read any of the political theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a small pro-European group in Leeds. Writing a newsletter lead piece on the "democratic deficit."
      *   **Context:** The group's treasurer (retired, well-read) suggests an analogy: "The EU is just the Bank of England writ large." (Delegation to technical bodies for credible commitment). Cites Majone (regulatory state) and Moravcsik (no democratic deficit).
      *   **Task:** Audit the analogy. Lay out correspondences (Commission/Council/ECB vs. MPC/Chancellor/Parliament). Identify where the mapping breaks and *which breaks matter* for the treasurer's argument. Evaluate specific aspects: narrow/measurable remit, reversibility, redistribution (CAP/Cohesion), ECJ role. Identify what the source case (BoE) has that the target (EU) lacks.
      *   **Alternative Analogies:** Evaluate "Members' Club," "Treaty-as-Contract," and "Federation-in-Waiting" regarding what conclusions they license.
      *   **Verdict:** Be blunt. If the conclusion survives only in some areas, specify which.
      *   **Tone:** Intellectual, blunt, honest, knowledgeable (assume user knows institutions, not theory).
      *   **Length:** Around 900 words.

  2.  **Deconstruct the Treasurer's Analogy (EU = BoE):**
      *   *The Core Argument:* Delegation to non-majoritarian institutions is normal (BoE independence) to ensure credible commitment. Therefore, EU delegation isn't a democratic deficit.
      *   *Correspondences:*
          *   ECB/MPC (Monetary Policy Committee).
          *   Commission/Chancellor (Executive/Initiative).
          *   Treaties/Remit Letter (Mandate).
          *   Council/Parliament vs. Treasury/Parliament (Oversight/Reversibility).
      *   *Where it works:* Single Market regulation, technical standards, competition policy (Majone's regulatory state).
      *   *Where it breaks:*
          *   *Mandate:* BoE has a clear inflation target (2%). EU has "ever closer union," broad competences.
          *   *Reversibility:* BoE independence can be revoked by simple legislation. EU treaty change requires unanimity + ratification.
          *   *Redistribution:* BoE doesn't pick winners/losers fiscally. EU does (CAP, Cohesion).
          *   *Judiciary:* ECJ acts as a constitutional court, not just a regulator.
          *   *Principal:* BoE serves UK Govt/People. EU serves a composite of states/citizens.

  3.  **Evaluate the Breaks (Which matter?):**
      *   *Reversibility:* Crucial. If you can't take the power back easily, delegation feels like alienation, not agency.
      *   *Redistribution:* Crucial. Technical bodies shouldn't make political choices about who gets money.
      *   *ECJ:* Significant. Constitutional courts define the boundaries of power, not just apply rules.
      *   *Conclusion:* The analogy holds for *regulation* (single market) but fails for *politics* (budget, rights, treaty change).

  4.  **Evaluate Alternative Analogies:**
      *   *Members' Club:* Implies voluntary association, exit rights. Good for sovereignty, bad for binding enforcement.
      *   *Treaty-as-Contract:* Implies mutual obligation, hard to change. Good for stability, bad for democratic adaptability.
      *   *Federation-in-Waiting:* Implies a demos, majority voting. Good for integration, bad for current reality (no European people).

  5.  **Drafting - Section by Section (aiming for ~900 words):**

      *   *Intro:* Acknowledge the treasurer's intellectual pedigree (Majone/Moravcsik are real deals). State the thesis: The analogy is potent for regulation, fatal for politics.
      *   *The Mapping:*
          *   MPC = ECB (Technical independence).
          *   Chancellor's Remit = EU Treaties (The mandate).
          *   Treasury/Parliament = Council/EP (The principals).
      *   *The Breaks (The Meat):*
          *   *Specificity:* 2% inflation vs. "Ever Closer Union." One is a dial, the other is a direction.
          *   *Reversibility:* BoE Act 1998 can be amended tomorrow. Treaties require unanimity. This is the killer. Delegation without an exit ramp is alienation.
          *   *Redistribution:* BoE manages macro stability. EU manages CAP/Cohesion. That's distributive politics, not technical regulation. You can't hide value judgments behind "independence."
          *   *ECJ:* It's not just an arbiter; it defines the scope of the mandate (Van Gend en Loos).
      *   *Verdict on Treasurer:* He's right on the Single Market (Majone's zone). He's wrong on the rest (Moravcsik stretches too far).
      *   *Alternatives:*
          *   *Club:* Too weak on enforcement.
          *   *Contract:* Too rigid, implies static obligations.
          *   *Federation:* Premature, assumes a demos we don't have.
      *   *Recommendation:* Split the difference. Defend the regulatory EU using the BoE analogy, but admit the political EU needs different legitimation (parliamentary scrutiny). Don't claim the whole thing is technical.

  6.  **Refining and Editing (Word Count Check):**
      *   *Self-Correction during drafting:* Make sure I don't get too bogged down in theory names. Keep it practical for a newsletter. Ensure the "Leeds" context doesn't disappear (keep the tone grounded).
      *   *Check constraints:* ~900 words. Blunt tone.
      *   *Focus:* Ensure I answer the specific questions about the remit, reversibility, and redistribution.

  7.  **Final Polish:** (Reviewing against the prompt's specific requests).
      *   *Correspondences laid out?* Yes.
      *   *Where mapping breaks?* Yes (Reversibility, Redistribution, ECJ).
      *   *Which breaks matter?* Reversibility and Redistribution are the big ones.
      *   *Alternative analogies?* Yes, with commitments listed.
      *   *Blunt verdict?* Yes, split the difference.

  *(Self-Correction on Word Count)*: I need to be concise. I can't waffle on the theory. I need to get straight to the audit.

