  *(Let's write)*.

  *Wait, one more check on the Moravcsik reference.* Moravcsik argues the EU is *already* democratic because it's a coalition of democracies delegating specific tasks. The treasurer is using him to say "no deficit." I need to make sure I address that specific claim. The BoE analogy supports Moravcsik *if* the tasks are narrow. If they aren't, Moravcsik's defense weakens.

