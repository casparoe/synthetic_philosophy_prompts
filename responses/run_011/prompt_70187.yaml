answer: |-
  Good evening. For those who don't know me, I'm one of Marion's current PhD students. The two senior colleagues who were originally asked to speak tonight had prior engagements, so I'm here primarily because I haven't yet learned how to wriggle out of a request with quite as much grace as Marion herself.

  Standing here, I am acutely aware that half this room could calculate a standard error in their sleep, while the other half knows Marion best as the person who burns the toast. My task is to bridge that gap without saying anything that would make Marion reach for her red pen. That is a narrow path.

  Marion's career is often summarised by a number: a heritability estimate of around 0.6 for anxiety symptoms in adolescents. But if you know Marion, you know that number never travelled alone. It always wore a coat. It arrived wearing the subscript of the specific **cohort**—the specific group of people—it was measured in, and the range of environments they lived in. To Marion, a heritability estimate without a population is like a train ticket without a destination; it looks official, but it isn't going to take you anywhere.

  She taught us this with a jam jar. On her desk sat two packets of seeds. Identical genetics. She would ask us: if you plant one in poor soil and one in rich soil, will they be the same height? No. If you plant them both in identical rich soil, will they be the same height? Still no. The seeds matter, the soil matters, and the difference between them matters. But you cannot look at the tall plant and say, "This height is 60 per cent seed." You can only say, "In this specific field, 60 per cent of the *difference* between these plants is due to the seed."

  She offered a pint to any student who could say "70 per cent genetic" and then name the population and the environments. In thirty years, she bought one pint. The winner was a plumber. He knew you never discuss water pressure without knowing the pipes. The rest of us were too busy looking at the water.

  Now, we must address the headline. Twelve years ago, a national paper ran a story on Marion's work suggesting anxiety was hard-wired and therapy was a waste of money. It was a distortion of the data. But I want to say something to our guest from the press, who is sitting at table four. We are glad you are here. That headline was wrong, but it was also the catalyst that defined the second half of Marion's career. Without that error, she might not have spent twelve years writing letters, giving lectures in libraries, and teaching us that science isn't finished when the paper is published. It is finished when the misunderstanding is corrected. In a way, that headline gave us the Marion we are celebrating tonight: not just a researcher, but a guardian of meaning.

  There is a culture in universities now that demands we talk about "impact". Usually, this means counting citations or policy changes. But Marion's impact was quieter. It was the student who didn't oversell their data. It was the parent who understood that a risk factor is not a destiny. It was the refusal to let a complex truth be flattened into a slogan, even when a slogan would have been easier to sell.

  So, what do we take from this? For the scientists: precision is kindness. For the family: you are not your statistics. And for all of us: the work matters not because it predicts the future, but because it clarifies the present.

  On the table outside is a glass paperweight. Inside, suspended in resin, are those two seed packets. Resin stops the seeds from growing. That is the point. They are not a promise of what *will* grow. They are a record of what *could*, depending on the soil. They are preserved not as a conclusion, but as a question.

  Marion, thank you for teaching us how to ask it properly.

  ***

  **Post-speech note on accuracy risks:**

  1.  *"A heritability estimate without a population is like a train ticket without a destination"* – Close to metaphorical oversimplification; safer to say "is meaningless" but the metaphor aids understanding without violating truth.
  2.  *"In this specific field, 60 per cent of the difference between these plants is due to the seed."* – Risky shorthand for "variance attributed to genetic variance"; safer wording would be "60 per cent of the observed variance is associated with genetic differences," but "due to" is acceptable in this specific analogical context.
  3.  *"Therapy was a waste of money."* – Quoting the headline directly; ensured context makes clear this was the paper's claim, not fact.
  4.  *"Risk factor is not a destiny."* – "Destiny" is non-technical; safer wording "not a deterministic outcome," but "destiny" resonates better with family without introducing falsehood.
  5.  *"Resin stops the seeds from growing."* – Biologically obvious, but ensures no one interprets the paperweight as a living sample; no change needed.
  6.  *"Precision is kindness."* – Philosophical claim, not scientific; acceptable in a retirement speech context.
