answer: |-
  This is a classic formulation of the **Regress Objection** (sometimes called the "Ultimate Responsibility" objection) against luck egalitarianism. It is a very strong argument, and your friend is right to feel that it threatens the core of the view.

  However, since you want to keep premise (2) (determinism/compatibilism) and reject libertarian free will, you cannot break the chain at (2). You also shouldn't break it at (5), because the saver/gambler intuition is indeed the engine of the view.

  The break happens at the inference from **(3) to (4)**.

  Here is the diagnosis, the repair costs, and the verdict on premise (1).

  ### 1. Where the Chain Breaks: The Equivocation on "Luck"

  The argument looks valid because it smuggles in a shift in the definition of "brute luck" between premise (2) and premise (4).

  *   **In (2), "Luck" is Metaphysical:** Here, luck means "causally determined by prior events outside my control." If my genes and environment caused my choice, the choice is metaphysically lucky.
  *   **In (4), "Luck" is Political/Normative:** Here, luck means "a circumstance for which society owes me compensation."

  The argument assumes that if a choice is *metaphysically* determined by luck, it counts as *political* brute luck. Luck egalitarians deny this transitivity. They argue that for the purposes of justice, we draw a line at the **agent's current deliberative capacity**, not at the Big Bang.

  **The Repair (The Compatibilist Move):**
  You can keep (2) and reject (4) by adopting a **compatibilist** account of responsibility.
  *   **Brute Luck:** Factors that affect your life *without* passing through your agency (e.g., being born blind, being hit by a meteor).
  *   **Option Luck/Choice:** Factors that affect your life *through* your agency (e.g., betting your money, choosing a career), even if your agency itself was causally determined.

  The "exit" your friend claims doesn't exist is the distinction between **causes that bypass the agent** and **causes that constitute the agent**. Luck egalitarianism does not require you to be the *uncaused cause* of your desires (Libertarianism); it only requires that you *identify* with them and act on them without external coercion.

  **Why it looked innocent:**
  Premise (3) ("dig anywhere and you hit brute luck again") is metaphysically true but politically useless. If justice requires us to trace causality back to the beginning of time, justice is impossible. The view breaks only if you assume justice requires metaphysical ultimacy. If you assume justice requires a pragmatic distinction between "me" and "my circumstances," the chain snaps at (4).

  ### 2. Pricing the Repairs

  Accepting the compatibilist fix isn't free. It exacts a heavy toll on different versions of the theory. Here is the price list for the major players.

  #### **Ronald Dworkin: The Hypothetical Insurance Market**
  Dworkin tries to block (3)→(4) by converting brute luck into option luck via a hypothetical insurance scheme. He asks: "What insurance would this person have bought against this misfortune if they started with equal resources?"
  *   **The Repair:** It treats unchosen disadvantages (blindness) as if they were risks the agent voluntarily took (option luck), thereby preserving the choice/luck distinction without needing libertarian free will.
  *   **The Price:** **Plausibility and Complexity.** Dworkin pays with the credibility of the counterfactual. It is wildly abstract to ask what a person would have insured against before they knew their own risk profile. It assumes agents can separate their "self" from their "circumstances" cleanly enough to price risks. It creates a bureaucratic nightmare of hypothetical calculation. To block the collapse, Dworkin must assume a level of rational abstraction that real humans don't possess.

  #### **G.A. Cohen: Expensive Tastes**
  Cohen notices that "choice" is messy. What if I *choose* to cultivate a taste for champagne, but I only did so because my upbringing made me crave status?
  *   **The Repair:** Cohen distinguishes between *chosen* expensive tastes and *unchosen* expensive tastes. He tries to filter the "luck" out of the "choice" by examining the history of the preference.
  *   **The Price:** **Privacy and Intrusiveness.** To block (3)→(4), Cohen must empower the state (or community) to judge the *origin* of your desires. The state must inquire: "Did you really choose to like opera, or did your parents force piano lessons on you?" This violates liberal neutrality. It requires an inquisitorial state that peels back the layers of your psychology to determine if you are "truly" responsible. It saves the theory from collapse but turns it into a surveillance project.

  #### **Elizabeth Anderson: Democratic Equality (Jumping Ship)**
  Anderson looks at the prices Dworkin and Cohen pay and decides the bill is too high. She essentially **accepts your friend's conclusion.**
  *   **The Concession:** She agrees that the choice/luck distinction is unstable and leads to intrusive judgments or abandonment of the vulnerable (the "saver vs. gambler" problem).
  *   **The Price:** **The Intuition of Desert.** Anderson gives up the core intuition in (5). She argues justice shouldn't be about compensating luck or rewarding choice; it should be about ensuring no one falls below a threshold of dignity and that no relations of oppression exist.
  *   **The Trade:** She saves egalitarianism from self-refutation by abandoning *luck egalitarianism*. She accepts that we might have to subsidize the gambler, not because it's fair, but because leaving them destitute creates a hierarchy that insults their status as a citizen. She pays with the satisfaction of "fairness" to purchase "fraternity."

  ### 3. Was Premise (1) Loaded?

  **Yes.** Your friend loaded the dice in premise (1).

  > *(1) Luck egalitarianism says an inequality is unjust **iff** it reflects brute luck rather than the choices of the people it affects.*

  This is a biconditional ("if and only if"). It claims that *only* brute luck inequalities are unjust.
  Most luck egalitarians hold a weaker claim: Inequalities due to brute luck are *prima facie* unjust (and require compensation). They do not necessarily claim that inequalities due to option luck are *automatically just*, only that they do not trigger a claim for *redress*.

  **Why this matters:**
  If (1) is a biconditional, then any inequality resulting from "choice" must be declared *Just*. This forces the theory to defend the starving gambler's fate as "good."
  If (1) is a conditional ("If brute luck, then unjust"), the theory can say: "The gambler's loss reflects choice, so we don't *owe* him compensation, but we might still help him for other reasons (humanity, stability, etc.)."

  Your friend's formulation forces luck egalitarianism to be heartless. By softening (1) from a biconditional to a conditional, you allow the theory to say: "We distinguish luck from choice to determine *entitlements*, not to determine *moral worth* or *human treatment*."

  ### Summary for the Argument

  1.  **Hold (2):** You don't need libertarian free will. You need a political distinction between "circumstances" and "ambitions," even if both are causally determined.
  2.  **Break (3)→(4):** Deny that metaphysical determinism implies political brute luck. The "luck" that matters for justice is what happens *to* you, not what causes the *you* that acts.
  3.  **Correct (1):** It's not "iff." It's "if." Brute luck demands compensation; option luck doesn't *forbid* aid, it just doesn't *mandate* it as a matter of strict justice.
  4.  **Acknowledge the Cost:** Admit that maintaining this distinction (like Cohen) requires intrusive judgments about people's preferences, or (like Anderson) requires abandoning the project entirely.

  Your friend's argument proves that Luck Egalitarianism is **metaphysically fragile**. It works only if we agree to ignore the causal history of our choices for the sake of social utility. If you push the metaphysics too hard (as your friend did), it collapses. The "exit" is to admit that the choice/luck distinction is a **political fiction**, not a metaphysical truth. It is a tool for policy, not a description of reality.
