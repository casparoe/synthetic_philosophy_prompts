answer: |-
  ### 1. Defeaters: Ranked by Severity

  To falsify your claim—that contrastive questions like "Why Britain and not China?" track objective difference-makers rather than conceptual artifacts—we need conditions where the causal structure of the world remains constant, but the explanatory truth value shifts solely due to the question's framing.

  1.  **Fatal: Scale-Dependent Causality (The Aggregation Defeater).** If the causal factors responsible for industrialization operate at a specific spatial scale (e.g., regional ecologies) but the contrast class is defined at a different scale (e.g., nation-states), the explanation becomes an artifact of aggregation. If "China" contains regions identical to Britain and regions utterly distinct, and the answer flips from "geology" to "institutions" depending on whether you compare Britain to "China" or "The Yangzi Delta," then the "fact about the world" is inaccessible without prior arbitrary carving. This destroys the well-posedness of the society-level question.
  2.  **Fatal: Conjunctive Causation with Foil-Selective Visibility.** If industrialization requires a conjunction of factors (A + B + C), and Britain has all three while China has none, any single-factor explanation is technically incomplete. However, if historians routinely present single factors (e.g., "Coal") as *the* explanation because the chosen foil lacks only coal, the explanation is relative to the foil's deficits, not the world's causal structure. If no single factor is sufficient, but the methodology demands selecting one "difference-maker," the claim that there is a fact about *which* difference did the work is false. There is only a fact about which difference matters *to you*.
  3.  **Serious: The Absence asymmetry.** Explaining a presence (Britain industrialized) involves citing causes. Explaining an absence (China did not) often involves citing the lack of preventing conditions or mere stochastic failure. If the causal structure of "not industrializing" is fundamentally different (e.g., stability vs. disruption) than "industrializing," then contrasting them assumes a symmetry that doesn't exist. You cannot contrast a success caused by specific triggers with a failure caused by the absence of triggers unless the triggers are necessary conditions.
  4.  **Awkward: Evidence Asymmetry.** If the historical record for Britain is dense (allowing identification of specific causes) and the record for China is sparse (allowing only broad structural inference), the contrast is epistemically loaded. You aren't comparing cases; you're comparing a known mechanism to an unknown black box. This doesn't falsify the claim ontologically, but it makes the claim unverifiable in practice.

  ### 2. The Foil-Swapping Test

  **Britain vs. The Netherlands:**
  Your position **survives**, perhaps strengthens. The Netherlands had capital, trade, and institutions similar to Britain but lacked coal and scale. If historians agree coal is the difference-maker here, it isolates a specific variable. This suggests the explanation is robust across foils that share most properties.

  **Britain vs. The Yangzi Delta:**
  Your position **weakens significantly**. This is the Pomeranz move. If the evidence shows Britain and the Yangzi were economically equivalent until 1750, then "Why Britain and not China?" was always a category error. The relevant unit was never the nation-state. If the answer shifts from "institutions" (Britain vs. China) to "ghost acres/coal" (Britain vs. Yangzi), the "fact about the world" is dependent on the spatial resolution of the foil. You are forced to concede that the original question was ill-posed because it aggregated disparate regions into a single contrast class.

  **Europe vs. Everywhere Else:**
  Your position **dies**. If the answer is "everywhere eventually," then industrialization is a diffusion process or a stable equilibrium state for complex economies. The question shifts from "why here" to "why now." The specific difference-makers (coal, wages) become incidental triggers for an inevitable transition. The contrast class swallows the explanandum.

  **The Killer Substitution:**
  The substitution that kills your claim outright is **Britain vs. China** compared with **Britain vs. A Hypothetical Industrializable China**.
  Suppose the evidence is fixed: Britain had High Wages + Cheap Coal. China had Low Wages + Expensive Coal.
  *   Foil 1 (Actual China): Explanation = Factor Prices (Allen).
  *   Foil 2 (China with Cheap Coal): Explanation = Wages.
  *   Foil 3 (China with High Wages): Explanation = Coal.
  If the "real fact" is the conjunction (High Wages + Cheap Coal), but the historiography treats the explanation as singular based on the foil, then the "answer" is an artifact of the contrast. There is no context-independent fact about *which* difference did the work; there is only the fact that both were necessary. If your claim requires historians to identify *the* explanation, and the explanation flips based on the foil while the causal evidence (the conjunction) remains fixed, then the explanation is interest-relative, not world-relative.

  ### 3. The Base-Rate Objection

  Here is the sharp version: Industrialization is a singular event in human history (n=1 until the 19th century). When the base rate is effectively zero, selecting the single occurrence and asking "why this one?" is statistically suspect. It is the "lottery winner from Springfield" fallacy. In a lottery, asking "why did John win?" is only answerable by "he bought a ticket." Asking "why John and not Jane?" implies a causal difference between them, when the difference is often stochastic noise amplified by path dependence.

  If industrialization is a low-probability attractor in complex systems, then "why Britain" is like asking "why this lightning strike." The answer isn't a specific difference between the struck tree and the unstruck tree; it's the general atmospheric conditions plus randomness. If the divergence is driven by chaotic sensitivity to initial conditions below the resolution of historical data, then "why Britain and not China" assumes a determinism that doesn't exist.

  **Verdict:** This is a **confusion about contrastive explanation**, but a dangerous one. Contrastive explanation doesn't require high base rates; it requires relevant differences. Even in a lottery, if John bought 100 tickets and Jane bought one, "why John" is answerable. The objection holds only if the process is truly random. If historians can show systematic differences (coal, institutions), the base rate is irrelevant. However, if the systematic differences are small and the outcome is large (sensitive dependence), the base-rate objection resurfaces as a chaos objection. You must prove the signal-to-noise ratio is high enough to support deterministic explanation.

  ### 4. The Hypothetical Discovery: Song Steam Pumps

  **Argument for Better-Posed:** This discovery removes the "capability" deficit. It proves China had the scientific and technical capacity. It forces the explanation entirely onto economic incentives or institutional constraints (e.g., labor was too cheap, or the state suppressed it). It narrows the search space for the difference-maker, making the question more precise.

  **Argument for Worse-Posed:** If the technology existed and was *dropped*, it suggests industrialization was not a structural inevitability given the right ingredients, but a contingent choice. It implies the "trap" was permeable. If they had the steam pump and chose not to use it, the divergence might rest on a whim, a specific policy decision, or a transient price fluctuation. This pushes the explanation toward contingency and away from structural determinism. It makes the "take off" look like a coin flip that Britain won and China folded on.

  **Verdict:** This makes the question **worse-posed** for your specific claim. Your claim relies on historians arguing about structural difference-makers (coal, institutions, equilibrium traps). If the tech was present and rejected, the structural barriers were insufficient to prevent industrialization; they merely disincentivized it temporarily. This suggests the divergence was not caused by a lack of structural preconditions, but by a fragile historical accident. It undermines the idea that there is a robust "fact about the world" regarding why China *couldn't* industrialize. They *could*, but *didn't*. That shifts the explanandum from structural incapacity to contingent choice, which is harder to generalize and less amenable to the "difference-maker" model you are defending.

  ### 5. Predictive Content vs. Rivals

  Your position predicts **convergence**. If there is a context-independent fact about which differences did the explanatory work, then historiography should eventually converge on a hierarchy of causes (e.g., "Coal was necessary, Institutions were sufficient") regardless of the foil chosen.

  The **Interest-Relative View** (van Fraassen style) predicts **stable pluralism**. Different foils legitimately yield different explanations, and no single one is "the" truth.
  The **Friendly Contrastive View** predicts **methodological fragmentation**. Questions are answerable only relative to fixed foils, but no foil is privileged.

  **How your view comes out false:** If, after 50 more years of research, historians still cannot agree on whether coal or institutions were the primary driver, and this disagreement maps perfectly onto their chosen contrast classes (geographers say coal, political economists say institutions), your claim is falsified. The "fact about the world" would be the conjunction, but the inability to identify a singular difference-maker independent of the foil suggests the singular difference-maker is an artifact of the question. Your position requires that one foil is *correct* (e.g., Yangzi is the right contrast, not "China"). If the field treats them as equally valid questions yielding equally valid but incompatible answers, your realism collapses into pragmatism.

  ### 6. Defender Concessions and Insulation

  Defenders of your position typically concede that **"China" is too coarse**. They admit the Yangzi Delta is the proper unit. They also concede that **counterfactuals are unavoidable**. You cannot explain why Britain industrialized without implying what would have happened if it hadn't.

  **Insulation Risk:** The retreat to "the Needham question is a family of questions" is a **slide into untestability**. If every foil generates a new "well-posed" question with its own "fact," then the original claim—that there is a fact about *the* divergence—is evacuated. It becomes a shell game where you never answer "Why Britain and not China?" but rather "Why Britain and not Yangzi given factor prices?" and "Why Britain and not Yangzi given institutions?"

  **Blunt Answer:** You are holding a view that risks **empirical stagnation**. If the "fact about the world" is only accessible through specific contrast classes, and historians cannot agree on the correct contrast class (Nation? Region? Culture?), then the claim is metaphysically robust but historiographically useless. The position is insulated if defenders treat any failure to agree on a cause as a failure to specify the foil correctly, rather than a failure of the theory. To avoid this, you must commit to the claim that **one contrast class is objectively superior** (likely Britain vs. Yangzi). If you refuse to privilege one foil, you have conceded the rival's point that the explanation is relative to the asker's carve-up.
