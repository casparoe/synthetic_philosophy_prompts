      *(Self-Correction during drafting)*: I need to be careful not to say (1) and (4) are incompatible *per se*. Lewisian convention is an equilibrium. EGT finds equilibria. The conflict is the *mechanism* of reaching/maintaining it and the *cognitive requirements*. (1) implies a rationalizing explanation. (4) implies a causal explanation. The user wants the *same sort of explanation* for both. That's the rub. If the explanation is causal (4), then (1)'s "reason generated by expectation" becomes an ex-post rationalization, not the actual cause. This is a deep methodological conflict. I should highlight this.

