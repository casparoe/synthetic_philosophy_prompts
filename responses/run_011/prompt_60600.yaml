      *   *(1) vs. (4):* (1) says the reason to conform is *generated by the expectation*. This implies a rational calculation based on belief. (4) says agents copy what works without reasoning about beliefs. If they don't reason about beliefs, do they satisfy (1)'s condition of "prefers to conform on condition that the others conform"? In EGT, they just conform because the strategy is evolutionarily stable. The *reason* is different (causal/evolutionary vs. rationalizing).
