      *   *Ranking:* Epistemic is fatal. Normative is severe. Explanatory is manageable.
      *   *Single Revision?* Dropping Strict Common Knowledge (2) helps with Epistemic and Explanatory. But Normative needs separate handling. Actually, moving to a "Functionalist" definition might help both. But the prompt asks if *one* revision repairs *most*. Relaxing (2) is the biggest lever.

