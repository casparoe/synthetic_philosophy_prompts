      *   (2) **Strict Common Knowledge:** Essential for convention. No convention without CK. (Classic Lewis, controversial in EGT).
      *   (3) **Arbitrariness:** Alternative regularities possible. No intrinsic merit. No explicit agreement needed. (Classic Lewis).
      *   (4) **Evolutionary Emergence/Persistence:** EGT explanation (imitation, dynamics). Agents *need not* reason about beliefs. Explains emergence *and* persistence. (EGT/Binmore/Skyrms).
      *   (5) **Animal Conventions:** Animals can have conventions despite lacking higher-order beliefs. (Extension of 4).
      *   (6) **Moral Obligation/Free-riding:** Deviation is free-riding. Moral reason to conform exists for *all* conventions. (Normative addition, reminiscent of Hart or Rawls' principle of fairness, but applied broadly).
