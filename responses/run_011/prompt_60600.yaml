      *   **Conflict A: The Epistemic Clash (2 vs. 4 & 5).**
          *   *Why:* (2) demands Common Knowledge (CK). CK requires cognitive architecture capable of representing iterated beliefs. (4) and (5) explicitly deny agents need beliefs about beliefs (especially animals).
