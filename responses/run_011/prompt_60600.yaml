      *   *Check (6).* Is free-riding necessarily *moral*? The user says "moral reason." If I drive on the left in a right-driving country, am I *immoral* or just *nuisance-creating*? The user commits to "moral." This clashes with (5) (animals).
      *   *Check (7).* If promising is just convention (Hume), and conventions rely on expectation (1), what about the *normativity* of promising? (6) covers this (free-riding). But if (6) falls, (7) loses its normative anchor. So (6) and (7) are linked.
      *   *Is there a single revision?* If the user abandons the *Lewisian Rational Agent* model in favor of a *Functionalist/Evolutionary* model, (1), (2), and (6) all need work.
      *   *Actually, the "Single Revision" candidate:* Abandoning Strict Common Knowledge (2) in favor of a weaker epistemic condition (or behavioral equivalent) resolves the conflict with (4) and (5). It also eases the tension in (1) (expectations can be implicit). It doesn't fully fix (6), but it removes the biggest logical barrier.
      *   *Wait, is (1) compatible with (4)?* (1) says "prefers to conform on condition..." This is a dispositional claim. EGT agents can satisfy this dispositionally without representing it. So (1) and (4) might be reconcilable if (1) is read behaviorally. But (2) kills it.
      *   *Let's look at (6) again.* "One who deviates... is free-riding." This relies on the idea that the convention provides a public good. Coordination problems *are* public goods games (mostly). But is it *moral*? That's the stickler.
      *   *Decision:* The conflict between (2) and (4)/(5) is the "Fatal" one. The conflict between (5) and (6) is the "Severe" one. The tension between (1) and (4) is "Manageable" if (2) goes.

  7.  **Finalizing the Structure:**
