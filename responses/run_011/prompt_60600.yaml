      *   **Conflict C: The Rationality Clash (1 vs. 4).**
          *   *Why:* (1) defines convention via *preferences conditional on expectations* (Rational Choice). (4) explains it via *dynamics of imitation* (Causal/Evolutionary). In EGT, an agent might conform because the strategy is hardwired or learned via reinforcement, not because they currently hold the expectation and calculate the preference.
          *   *Severity:* Medium. Can be resolved by distinguishing *ground* of emergence vs. *structure* of stability. But the user says "I want the same sort of explanation to cover both... emergence... and persistence." This makes it tighter.

