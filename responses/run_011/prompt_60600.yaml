          *   *Why:* (6) claims conventions generate *moral* reasons (free-riding). (5) claims animals have conventions. Do animals have moral obligations? If yes, that's a huge metaphysical commitment. If no, then (5) and (6) are incompatible. Also, (4) explains persistence via blind imitation. How does a blind process generate a *moral* bond?
