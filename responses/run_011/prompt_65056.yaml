answer: |-
  **Case L**
  In a financial audit, the Auditor asks, "Are all transactions compliant?" The Controller, knowing fifty were not, says, "All transactions are compliant." The Auditor, entitled to rely on this assertion, certifies the account. The non-compliance is later discovered, causing identical losses. The Controller intended to deceive and asserted what she believed false.

  **Case M**
  In a financial audit, the Auditor asks, "Are all transactions compliant?" The Controller, knowing fifty were not, says, "All *logged* transactions are compliant." She knows the non-compliant ones were unlogged. The Auditor infers all transactions are compliant and certifies the account. The non-compliance is later discovered, causing identical losses. The Controller intended to deceive but asserted only what she believed true.

  ***

  **Demonstration**

  Three accounts of lying yield divergent verdicts on Case M. First, the **Deceptionist Account** (lying requires an intention to deceive) classifies Case M as a **lie**, as the Controller intends to induce a false belief. Second, the **Strict Assertionist Account** (lying requires asserting what one believes false) classifies Case M as **merely misleading**, since the Controller believes her statement about logged transactions is true. Third, the **Warrant Account** (lying requires asserting what one believes unwarranted) also classifies Case M as **merely misleading**, as the statement is factually warranted. Because these accounts disagree, the case isolates the moral weight of the speech act from the definition of lying.

  The structural feature generating extra blame in Case M is **Institutional Epistemic Closure**. The Controller exploits a regulatory rule that limits the Auditor's verification scope to "logged" items. In Case L, the assertion ("All transactions") invites verification of the whole set; the lie violates the protocol but leaves the verification mechanism intact. In Case M, the assertion ("All logged transactions") weaponizes the protocol itself, restricting the Auditor's access to the falsifying evidence. The Auditor is not "on notice" because institutional rules structurally prevent her from protecting herself; checking unlogged items would violate audit scope. This defeats the "on-notice" rationale by showing the hearer *cannot* notice without breaking the rules.

  The strongest reply a defender of the asymmetry could make is that the Auditor was professionally negligent for not querying the implicature ("Are there unlogged transactions?"). They would argue the asymmetry holds because a reasonable hearer *should* have protected herself, and the Controller's blame is only higher due to the Auditor's failure. However, once the feature of Institutional Epistemic Closure is removed—meaning the Auditor is empowered to check unlogged items without penalty—Case M reverts to standard misleading. The Auditor *can* protect herself, the structural trap vanishes, and the standard asymmetry (Lying > Misleading) is restored.
