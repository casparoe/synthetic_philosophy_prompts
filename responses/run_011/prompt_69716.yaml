answer: |-
  Here is the number, the arithmetic, and the diagnosis of your impasse.

  ### The Credence
  **0.65**

  This is my credence that the Past Hypothesis (PH) is confirmed by our evidence in an ordinary Bayesian sense, meaning the evidence raises its probability relative to a prior where PH is not assumed. It is not 0.95 because the circularity objection is structurally severe; it is not 0.15 because the hypothesis does too much explanatory work to be dismissed as a mere precondition.

  ### The Arithmetic of Reasoning
  To get to 0.65, I am treating confirmation as a chain of dependencies. If any link breaks completely (probability 0), confirmation fails. I have modeled this as a product of three main factors, with the second factor being a disjunction of two supporting lines of evidence.

  $$ P(\text{Confirmed}) = P_{\text{circ}} \times P_{\text{evidence}} \times P_{\text{frame}} $$

  Where:

  1.  **$P_{\text{circ}}$ (The Circularity Coefficient): 0.80**
      *   *Definition:* The probability that records (memories, fossils, CMB) can be identified and trusted via physical correlation *without* presupposing the entropy gradient they are meant to establish.
      *   *Reasoning:* This is the strongest objection. If your friend is right, this number is near 0. I give it 0.80 because we can define records physically (e.g., as systems with mutual information caused by a common past interaction) without explicitly invoking thermodynamics. However, justifying why those correlations point *past-ward* rather than *future-ward* usually sneaks PH back in. I am granting an 80% chance that a non-circular definition is possible, but acknowledging a 20% risk that the objection is fatal.

  2.  **$P_{\text{evidence}}$ (The Evidential Weight): 0.955**
      *   *Definition:* The probability that we have sufficient evidence to favor PH over rivals, calculated as $1 - (1 - P_{\text{indep}})(1 - P_{\text{rivals}})$. This treats independent evidence and rival elimination as redundant pathways; if either works, evidence supports PH.
      *   **$P_{\text{indep}}$ (Record-Independent Evidence): 0.85.** This is your point about cosmology. The smoothness of the CMB and Big Bang Nucleosynthesis yields are physical constraints on the initial macrostate. They are "records," but they are also dynamical boundary conditions we can measure directly. I judge it highly likely (85%) that these count as independent data points.
      *   **$P_{\text{rivals}}$ (Rival Elimination): 0.70.** This addresses the Boltzmann Brain/Fluctuation Hypothesis. If PH were false, we should likely be fluctuations in a high-entropy soup. The fact that we observe a coherent history *could* be a fluctuation, but it is vastly less probable than the PH narrative. However, without a measure problem solution in cosmology, we can't strictly rule out the "freak observer" rival. I give this a 70% confidence.
      *   *Calculation:* $1 - (0.15 \times 0.30) = 1 - 0.045 = 0.955$.

  3.  **$P_{\text{frame}}$ (The Epistemic Frame): 0.85**
      *   *Definition:* The probability that Bayesian confirmation is coherent for a unique, non-repeatable boundary condition ($N=1$ universe).
      *   *Reasoning:* Strict frequentism fails here. However, subjective Bayesianism allows probability assignments over unique hypotheses (e.g., "Did Napoleon exist?"). The risk is that without an ensemble of universes, our priors are unconstrained. I assign 0.85 confidence that standard Bayesian epistemology extends validly to cosmology.

  **Total Calculation:**
  $$ 0.80 \times 0.955 \times 0.85 \approx 0.6494 \rightarrow \mathbf{0.65} $$

  ### The Weakest Link
  **$P_{\text{circ}}$ (The Circularity Coefficient).**

  This is the most fragile term. If the definition of a "record" inherently requires a thermodynamic arrow to distinguish it from a random correlation, then $P_{\text{circ}}$ drops to zero, and the total credence collapses. All the cosmological data in the world cannot help if the epistemological bridge to that data is washed out. The other terms (cosmological data, Boltzmann brains) are standard physics problems; this term is a foundational epistemology problem.

  ### The Single Argument That Would Move Me
  **A derivation of the "Record Principle" from Microphysics alone.**

  If someone could demonstrate rigorously that a physical system containing mutual information with another system *must* infer a lower-entropy past state using only time-symmetric microdynamics and the Statistical Postulate (without assuming PH in the definition of the record), my $P_{\text{circ}}$ would jump from 0.80 to 0.95. This would raise my total credence to roughly **0.78**.

  Conversely, if it were proven that *any* inference to the past logically entails a prior commitment to an entropy gradient, $P_{\text{circ}}$ drops to 0.1, and my total credence falls to **0.08**.

  ### Diagnosing the Gap (You vs. Your Friend)
  You are at 0.8; she is at 0.15. You are not disagreeing about the CMB data, and you are not disagreeing about Boltzmann Brains. **You are disagreeing entirely on $P_{\text{circ}}$.**

  *   **Your Friend's Score:** She effectively treats $P_{\text{circ}}$ as **0.20**. She believes there is an 80% chance that records are viciously circular. For her, PH is a transcendental precondition for experience, not an empirical hypothesis. If you assume the arrow to read the evidence, you cannot use the evidence to prove the arrow. In her arithmetic, even if $P_{\text{evidence}}$ and $P_{\text{frame}}$ are 1.0, her total score caps at 0.20.
  *   **Your Score:** You effectively treat $P_{\text{circ}}$ as **0.95**. You believe the circularity is benign or resolvable. You view the CMB smoothness as a "brute fact" measurement that doesn't rely on the thermodynamic interpretation of memory.
  *   **The Reality:** The gap lives in whether you view the Past Hypothesis as a **law-like posit** (your view) or a **constitutive rule of inference** (her view).

  **Recommendation:** Stop arguing about cosmology. You will never resolve this by citing more data, because she disputes your license to interpret the data. Argue about the definition of a **record**. If you can agree on a physical definition of "record" that does not smuggle in entropy increase, her $P_{\text{circ}}$ will rise, and her credence will jump to match yours. If you cannot, her 0.15 is the logically consistent position.
