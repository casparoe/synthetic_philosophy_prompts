answer: |-
  **Seminar Handout: The Causal Closure of the Physical**
  **Week 1: Disambiguating the Slogan**

  The claim that 'the physical is causally closed' is often wielded as a conversation-stopper. It is not. It is a family of distinct claims ranging from methodological advice to strong metaphysical theses. Below they are ordered by strength (from weakest commitment to strongest).

  1.  **The Methodological Heuristic**
      *   **Claim:** When investigating physical events (like an arm rising), we ought to *look* for physical explanations first. Non-physical explanations are a last resort.
      *   **Status:** Pragmatically useful, not truth-apt. It is a rule for inquiry, not a description of reality.
      *   **Relation to Conservation of Energy (CoE):** Independent. One could follow this rule even in a universe where CoE failed.
      *   **Implication:** Does not entail that mental causes *do not exist*, only that they are hard to find or methodologically suspect.

  2.  **Conservation of Energy (The 'Trenchcoat')**
      *   **Claim:** In any isolated physical system, the total quantity of energy remains constant; no energy is created or destroyed.
      *   **Status:** **Empirical bet.** It holds in standard particle physics but faces complications in General Relativity (global conservation is ill-defined in curved spacetime).
      *   **Relation to CoE:** This *is* CoE.
      *   **Implication:** Does **not** entail closure. A non-physical mind could theoretically *guide* or *redistribute* existing physical energy without adding to the total sum (as Leibniz or certain dualists suggested). CoE constrains *how* interaction happens, not *whether* it happens.

  3.  **Causal Completeness of the Physical (Token)**
      *   **Claim:** Every *token* physical event that has a cause has a *sufficient* physical cause. (Note: This allows that a non-physical cause might also exist alongside it).
      *   **Status:** **Empirical bet.** Relies on the success of neuroscience and physics. It assumes 'finished physics' will not posit non-physical forces.
      *   **Relation to CoE:** CoE supports this, but does not guarantee it. Completeness requires that the physical cause is *sufficient*, not just that energy is conserved.
      *   **Implication:** By itself, this allows for **systematic overdetermination**. The arm rises because of neurons firing (sufficient physical cause) *and* because of a belief (mental cause).

  4.  **Causal Closure of the Physical (Strong)**
      *   **Claim:** No physical event has a cause that is non-physical. (If a physical event has a cause, it has a *physical* cause, and *only* a physical cause).
      *   **Status:** **Metaphysical/Empirical hybrid.** Often treated as a conceptual truth about 'the physical', but if 'the physical' is defined by current physics, it is an empirical bet we might lose.
      *   **Relation to CoE:** Stronger than CoE. CoE allows interaction; Closure forbids it.
      *   **Implication:** This directly rules out interactionist dualism. However, it does not yet rule out non-reductive physicalism (where the mental *is* physical, or supervenes on it).

  5.  **Causal Exclusion (The Hidden Premise)**
      *   **Claim:** No single event can have more than one *sufficient* cause at a given time (unless it is a genuine case of overdetermination, like two assassins firing at once).
      *   **Status:** **Controversial.** Often smuggled in as obvious.
      *   **Relation to CoE:** Irrelevant. This is a principle about causation, not energy.
      *   **Implication:** This is the engine of epiphenomenalism.

  ***

  **How to Derive 'The Mental Causes Nothing'**

  To move from the slogans above to the conclusion that beliefs cannot cause arms to rise, you cannot rely on Closure alone. You need the following argument (The Exclusion Argument):

  1.  **Completeness:** Every physical effect has a sufficient physical cause. (Claim 3 above).
  2.  **Distinctness:** Mental causes are distinct from physical causes (i.e., the belief is not identical to the neuron firing).
  3.  **No Overdetermination:** Physical effects are not systematically overdetermined by distinct sufficient causes. (Claim 5 above).
  4.  **Conclusion:** Therefore, the mental cause does no work.

  **Where the students went wrong:**
  *   **Student 1** assumed Claim 3 (Completeness) immediately entails the Conclusion. It does not. It requires Claim 5 (No Overdetermination). If you reject Claim 5, you can accept Completeness and still say beliefs cause actions (as a second, non-competing cause).
  *   **Student 2** assumed Claim 2 (CoE) entails Claim 4 (Closure). It does not. Conservation constrains the *budget*, not the *agent*.

  ***

  **Does the Theory of Causation Matter?**

  Yes. The derivation above relies on a 'production' or 'sufficient cause' model of causation (causes as generators of effects).

  *   **Counterfactual/Interventionist Accounts:** If causation is about **difference-making** (i.e., $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred), the Exclusion Argument loses force.
      *   Even if the physical realiser is sufficient, the mental property might still be the relevant *difference-maker*.
      *   *Example:* If I hadn't believed the train was leaving (mental), I wouldn't have run (physical), even if my neurons fired.
      *   Under interventionism, mental and physical causes can coexist without competing, provided we specify the right variables. The 'sufficiency' of the physical base does not screen off the causal relevance of the mental property.

  **Discussion Question:**
  If we accept Causal Completeness (Claim 3) but reject No Overdetermination (Claim 5), are we committed to a mysterious coincidence every time you raise your arm? Or is 'overdetermination' the wrong word for what happens when the mental supervenes on the physical?
