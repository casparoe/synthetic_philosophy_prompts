  2. **Function/Interest:** **Double Duty.** Defines measure (compatible with 5) but bans interest (conflicts with 5, 7). You cannot defend modern markets (5) while calling interest unnatural. This is the column's fracture point.
  3. **Reciprocity:** Normative standard of need. Conflicts with market pricing (5) if prices reflect power/scarcity rather than proportional need satisfaction.
  4. **Subjective Value:** Supports markets (5), undermines reciprocity (3). Subjective want fluctuates; proportional reciprocity requires stable need comparison.
  5. **Markets:** Defends mechanism generating interest (conflicts 2) and potentially unjust prices (conflicts 3). You are defending a system Aristotle critiques.
  6. **Bitcoin:** Contradicts 1. Requires essentialist definition to exclude it. Inconsistent with conventionalism unless you argue Bitcoin lacks state guarantee (modifying 1).
  7. **Caps:** Legitimates interest (conflicts 2). If interest is perversion, cap it at zero, not X%. Regulation implies legitimacy.

  **Tension Rank:**
  1. **2 vs. 5 & 7 (Critical):** Moral ban vs. market defense. Incompatible foundations.
  2. **1 vs. 6 (Severe):** Conventionalism vs. Essentialism.
  3. **3 vs. 5 (Moderate):** Justice vs. Efficiency.

  **Double Duty:** Item 2 conflates money's function with a moral ban on finance.

  **Single Revision:** Rewrite 2. Keep "common measure," drop "interest is perversion." This aligns 2 with 5 and 7, resolving the critical tension. Cost: Loses Aristotelian moral critique of finance, but saves column coherence. You become a modern Aristotelian, not a textualist. If interest is legitimate but exploitative in specific contexts (payday), 7 makes sense. If interest is inherently unnatural, 7 is incoherent. If you keep 1, 6 must become 'Bitcoin is bad money,' not 'not money.'
