  **The Case: Redundant Neural Coding in the Retina**

  **Scenario**
  In the mammalian retina, neighboring retinal ganglion cells (RGCs) often have overlapping receptive fields, meaning they respond to light stimuli in the same region of visual space. Consider a specific RGC (Cell A) within a cluster of ten such cells projecting to the same target in the lateral geniculate nucleus (LGN). Due to the high degree of correlation in their firing patterns, the spike train from Cell A is almost perfectly predicted by the spike trains of its nine neighbors. Cell A is healthy, metabolically active, and reliably fires action potentials in response to light stimuli just like the others. However, because the downstream target is already saturated by the input from the other nine cells, the specific spikes from Cell A add zero new information to the signal transmission; removing Cell A would result in no measurable change in the fidelity or content of the visual signal received by the LGN.

  **The Accounts**

  **Selected-Effects (SE) Account:**
  The SE account looks to the evolutionary history of the trait. RGCs were selected for their ability to transmit visual information to the brain. Cell A possesses the same physiological machinery as its ancestors, which successfully transmitted visual data to enhance survival. The fact that Cell A is currently part of a redundant cluster does not erase its history of selection. Therefore, the SE account confidently ascribes the function **"transmitting visual information"** to Cell A. It is an adaptation doing what it was designed by selection to do, even if its individual contribution is currently covered by backups.

  **Causal-Role (CR) Account:**
  The CR account analyzes the trait's current contribution to a capacity of the containing system.
  *   **Containing System:** The Retina-LGN pathway.
  *   **Capacity:** High-fidelity transmission of visual information (measured in bits/second).
  *   **Analysis:** To determine Cell A's function, we analyze its causal contribution to the system's capacity. We observe that the information transmitted by the cluster is $I(Total)$. We observe that the information transmitted by the cluster *without* Cell A is $I(Others)$. In this specific redundant configuration, $I(Total) = I(Others)$. Cell A's activity makes no difference to the output variable (information transmitted). Because its causal contribution to the specific capacity of "information transmission" is zero (it is causally inert regarding the *difference* in output), the CR account withholds the function ascription. It classifies Cell A's activity as a causally redundant process, not a functional contribution.

  **The Single Feature Doing the Work**
  The divergence is driven entirely by **Non-Necessary Redundancy**.
  The trait is active and reliable, but its causal output is fully overdetermined by other components in the system.
  *   **If you pull this feature out** (i.e., if Cell A were the *only* cell covering that receptive field), both accounts would agree: SE says it has a function (history), and CR says it has a function (it now makes a difference to the output).
  *   **If you keep the feature** (redundancy), SE ignores it (history remains), but CR catches on it (current difference-making vanishes).

  **The Causal-Role Theorist's Reply**
  A sharp causal-role theorist will not accept the withholding. They will reach for the **Dispositional Move**. They will argue that function ascription relies on the trait's *disposition* to contribute, not its *manifest* contribution in a single token instance. They will say: "Cell A *would* contribute if Cell B through J were silenced. Therefore, it has the disposition to transmit information, which is sufficient for function."

  **Evaluation of the Reply**
  This reply rescues the CR verdict but at a steep price: it collapses the distinction between the two accounts and reintroduces the **Liberalism Problem**.
  If CR accepts dispositions in the face of redundancy, they must count *any* trait that *could* contribute under counterfactual conditions as functional. This means counting the 10th redundant neuron, the spare tire in the trunk, and the backup generator that never turns on as all having "functions" in the current system. This makes the CR account just as liberal as the "side-effect" objection usually accuses it of being. It forces the CR theorist to admit that "contribution" doesn't actually require making a difference in the *actual* system state, which undermines the motivation for using CR to avoid the historical baggage of SE in the first place. The case shows that the "conservative" label for SE and "liberal" label for CR are not intrinsic; in cases of active redundancy, SE is the one tracking the biological reality of adaptation, while CR risks either denying function to active parts or becoming so dispositional it counts everything.
