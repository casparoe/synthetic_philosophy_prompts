          *   *Constraint Check:* Is it "doing something"? It's opening/closing. Is it "reliable"? Yes. Does it contribute to the capacity (firing)? No.
          *   *Is this just environmental mismatch?* No, it's internal system state.
          *   *Is it vestigial?* No, the channel is active, just ineffective due to other system constraints.

      *   *Wait, I need a stronger case.* The prompt asks for a case where CR *withholds*. CR is notoriously liberal. To make CR withhold, the trait must fail to contribute to *any* plausible capacity of the containing system.
      *   *Hypothesis:* The only way CR withholds is if the trait is **causally inert** regarding the system's capacities, despite being active.
      *   *Case:* **Redundant Signaling in Quorum Sensing.**
