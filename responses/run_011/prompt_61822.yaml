prompt: |-
  so I'm in a philosophy of biology seminar and next week each of us has to bring in a case that breaks the standard story about function theories, and I've been staring at a blank page for two days now.

  The standard story as we've had it: causal-role accounts (a trait's function is whatever it actually contributes to some capacity of the system it sits in) are too liberal, since they turn every current side-effect into a function — the thumping noise the heart makes, whatever a shell does for the hermit crab that moves into it — while selected-effects / etiological accounts (a trait's function is what it was selected for doing) are too conservative, since they refuse functions to vestigial structures and to traits that only recently got recruited for something useful. So the intro table has one account liberal and the other conservative, and the two objections aimed at diffrent targets.

  I want a case that runs the other way: the selected-effects account confidently ascribes a function, and the causal-role account withholds. Specifications:

  - scenario is one paragraph, plain real-world biology. no sci-fi, no designer tinkering, no time travel, no "suppose we engineered an organism" moves
  - the trait has to be doing something right now, and doing it reliably. no vestigial organs, no flightless bird wings, no appendixes, nothing from the "it used to matter but doesn't anymore" family, because that's just the stock case with the labels swapped round
  - the withholding has to fall out of a straight, good-faith causal-role analysis of the organism, not from the analyst picking a gerrymandered or obviously wrong-headed containing capacity just so the trait disappears. if the case only works because the investigator is looking at the wrong level of organization, that counts as cheating
  - bonus if it's the kind of situation a working biologist could actually run into in the field or at the bench, rather than something that exists only to score a philosophy point

  Why I care: I want to argue in seminar that the liberal/conservative split isn't built into the two accounts at all, it's contingent on the biological details, so the standard objection table is doing less work than people assume. Which means the case has to turn on function ascription and nothing else.

  After the scenario, walk me through both accounts and show the work — on the causal-role side I want to see the actual analysis, what the containing system is, what capacity it's being analyzed in terms of, and why the trait drops out of it, not just a verdict. Then tell me which single feature of the case is doing all the work, what the two verdicts do if you pull that feature out, and how a sharp causal-role theorist would try to absorb the case rather than accept it. I'm guessing they'll reach for something about redundancy, or about a contribution not having to be a necessary one — say whether that reply actually rescues them or just drops them straight back into the liberalism problem.

  Don't bother with citations, I've got the readings, I just need the case and the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested case:

  1.  **Analyze the Request:**
      *   **Goal:** Find a biological case study where the Selected-Effects (SE) account ascribes a function, but the Causal-Role (CR) account withholds it.
      *   **Constraint 1 (Standard Story):** Usually, CR is too liberal (counts side effects) and SE is too conservative (excludes vestigial/new traits). This request wants the *reverse*.
      *   **Constraint 2 (Scenario):** One paragraph, plain real-world biology. No sci-fi, engineering, or time travel.
      *   **Constraint 3 (Trait Status):** The trait must be doing something *now*, reliably. No vestigial organs.
      *   **Constraint 4 (CR Analysis):** The withholding must come from a good-faith CR analysis, not gerrymandering the system/capacity.
      *   **Constraint 5 (Bonus):** Real-world biologist scenario (field/bench).
      *   **Output Requirements:** Scenario, walkthrough of both accounts (showing the work for CR), identify the single feature driving the divergence, predict the CR theorist's reply (redundancy/necessity), and evaluate that reply.
      *   **Philosophical Goal:** Argue that the liberal/conservative split is contingent, not built-in.

  2.  **Brainstorming the Reverse Case (SE Yes, CR No):**
      *   *SE Yes:* The trait was selected for doing $X$. It has a history of contributing to fitness via $X$.
      *   *CR No:* The trait currently contributes nothing to the capacity of the containing system.
      *   *Problem:* If it's doing $X$ now (reliably), CR usually says that *is* the function. CR defines function as current contribution to a capacity.
      *   *How to make CR say "No"?*
          *   Option A: The contribution is negligible/zero. (But SE requires it was selected for this. If it's negligible now, was it selected for it? Maybe the environment changed, but then it becomes a vestigial case, which is forbidden).
          *   Option B: The contribution is redundant. If the system works exactly the same without it, does it "contribute"? Some CR versions (like Cummins') allow redundant contributions, but stricter versions might require a difference-making role.
          *   Option C: The "Capacity" is defined such that the trait's effect is irrelevant to *that specific* capacity, even if it helps survival. (But SE looks at fitness, CR looks at system capacity. Usually, these align).
          *   Option D: **Overdetermination/Redundancy.** This is the strongest candidate. If there are 10 backup systems, does the 10th one "contribute" to the capacity?
          *   *Wait, let's look closer at CR.* Cummins' CR account says a function is a disposition to contribute to a capacity. If I have two kidneys, and I remove one, the system (filtration) still works. Does the second kidney have a function? CR usually says yes, it contributes to the capacity of "filtration at rate Y".
          *   *Need a stronger CR withholding.* What if the trait's effect is *masked* or *cancelled out* by the system context, even though it was selected for that effect?
          *   *Idea:* A trait that produces a signal/substance that is immediately neutralized or ignored by the current system state, but was selected for producing it.
          *   *Example:* A pheromone gland that releases a chemical, but the environment is so saturated with that chemical from others that *this* individual's release makes no difference to the system's behavior.
          *   *SE:* Selected to signal. Function = signaling.
          *   *CR:* Does it contribute to the system capacity (e.g., mating coordination)? No, because the signal is lost in the noise. The system capacity is unchanged by this specific token's activity.
          *   *Critique:* This feels like "current side effect" territory. CR might say "it's still a signal, just ineffective."

      *   *Let's try Redundancy/Backup Systems again.*
          *   Scenario: A metabolic pathway with massive parallel redundancy.
          *   SE: Enzyme E was selected for catalyzing Reaction R.
          *   CR: In the current organism, there are 5 other isozymes that fully saturate the demand. Removing E changes nothing.
          *   *CR Verdict:* Does E contribute? Cummins says yes, it has the disposition. But if we define the capacity as "maintaining homeostasis within range Z," and E's removal doesn't budge the needle, is it a contribution?
          *   *Refinement:* We need a case where the CR theorist is forced to say "No contribution." This happens if the effect is *causally inert* in the specific context.
          *   *Better Idea:* **Compensatory Mechanisms that nullify the effect.**
          *   Scenario: A plant produces a toxin to deter herbivores (SE: yes). But in this specific environment/population, the herbivores have evolved immunity, OR the plant's own transport system immediately sequesters the toxin into vacuoles where it never contacts the herbivore, *but* the production mechanism remains because it was selected historically.
          *   *Wait, constraint:* "Trait has to be doing something right now, and doing it reliably." If the toxin never touches the herbivore, is it doing something? It's being produced.
          *   *Let's look for "Spandrels that look like Adaptations" but reversed.* No, we need SE to say Yes. So it *must* be an adaptation.

      *   *Let's try: The "Saturated Signal" Case.*
          *   Organism: Fireflies (Photinus).
          *   Trait: Flashing pattern.
          *   SE: Selected for mate attraction. Function = Attracting mates.
          *   CR: System = Population signaling network? No, CR is usually individual organism. System = Individual's reproductive physiology?
          *   If the environment is so bright (light pollution) that the flash makes no difference to the *capacity* of the organism to reproduce *in this context*, CR might withhold. But SE says it's still a function because of history.
          *   *Problem:* CR usually abstracts away from specific environmental interference. It asks "What does the heart do?" not "What does the heart do in a vacuum?"

      *   *Let's try: Redundant Genetic Pathways (The "Knockout" Case).*
          *   This is very bench-science friendly.
          *   Trait: Gene A.
          *   SE: Gene A was conserved because it performs Function F.
          *   CR: We knock out Gene A. Phenotype is identical. We add it back. Phenotype identical.
          *   Why? Because Gene B does the exact same thing, fully compensating.
          *   CR Analysis: The capacity is "Metabolic Homeostasis." Does Gene A contribute? If "contribute" means "make a difference to the output," then no. If "contribute" means "has the disposition to process substrate," then yes.
          *   *Crucial Distinction:* We need a version of CR that requires *difference-making*. Many CR accounts (like Cummins) focus on *dispositions*. A redundant part has the disposition. So CR usually *grants* function here.
          *   *How to force CR to withhold?* The trait's causal output must be *nullified* within the system.

      *   *Let's try: The "Decoy" or "Sink" Case.*
          *   Trait: A receptor that binds a hormone.
          *   SE: Selected to regulate hormone levels (buffering).
          *   CR: In the current physiological state, the hormone levels are so low the receptor never binds anything.
