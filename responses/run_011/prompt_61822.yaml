          *   *Violation:* "Doing something reliably." The thorns are physically there, but are they *contributing*? CR says function is contribution to capacity. If survival is the capacity, and they don't help survival, CR says no function. SE says yes function (history).
          *   *Refinement:* This risks looking like the "vestigial/environmental mismatch" case which the prompt forbids ("nothing from the 'it used to matter but doesn't anymore' family").
