      *   **Is it reliable?** Yes.
      *   **Does CR withhold?** If the capacity is "Triggering Contraction," Zone 4 contributes nothing. It is causally superfluous *token-by-token*.
      *   **Is this vestigial?** No, it's part of the standard architecture, just redundant.
      *   **Biologist context:** Electrophysiologists measure quantal content and safety factors all the time.

      *   *Refining the CR Withholding:*
          *   CR theorists often argue that redundancy *is* a contribution (robustness).
          *   To force the "No," I need the trait to be *actively* non-contributory in a way that isn't just "backup."
          *   *Idea:* **Antagonistic Pleiotropy where one side is nullified.**
