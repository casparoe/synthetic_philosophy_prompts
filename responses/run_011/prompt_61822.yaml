          *   Not vestigial (it *would* work if E2 broke, but E2 isn't broken).
          *   CR withholds because "contribution" implies making a difference to the output in the *current* analysis.
          *   SE ascribes because of history/conservation.

      *   *Wait, does CR really withhold here?* Cummins' account analyzes functions as dispositions. E1 *has the disposition* to convert S. The fact that E2 hogs the substrate is a contextual fact. CR usually analyzes the trait in isolation or normal conditions. If "normal conditions" include E2, then E1 does nothing.
      *   *To make CR withhold robustly:* We need to define the capacity such that E1's disposition doesn't map onto it.
