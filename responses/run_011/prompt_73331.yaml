answer: |-
  ### What the theorem compares

  Good's theorem is a claim about the value of flexibility, not the value of data. It compares two expected utilities: the maximum utility achievable by selecting an act *after* observing evidence, versus the maximum utility achievable by selecting an act *before*. The inequality holds because the set of strategies available after observation includes the strategy "ignore the evidence and perform the prior optimal act." The guarantee is purely set-theoretic: maximizing over a superset of decision rules cannot yield lower utility than maximizing over a subset. The assumption carrying the entire weight is the agent's freedom to re-optimize the mapping from evidence to act. If the decision rule is fixed—if the agent cannot choose a new act conditional on the new evidence—the superset relation collapses. The theorem does not compare fixed rules over different input spaces; it compares optimal rules over different information sets. Without the outer maximization operator, the inequality vanishes.

  ### The argument

  Your engineer colleague mistakes the availability of information for the capacity to condition on it. Good's theorem licenses adding channels only if the agent can rewrite its policy to exploit them. In deployed machine learning, the "agent" is often a fixed function—a frozen model or a regulatory formula—that cannot re-optimize between inference steps. For such a system, adding an input is not an enrichment of evidence but a modification of the decision procedure's geometry. Your numerical example demonstrates this decisively, and your arithmetic is correct.

  Consider the baseline: Fraud rate 2%. Utilities are +1 (approve legit), −20 (approve fraud), 0 (reject). Flags A and B fire on 50% of frauds and 40% of legits, independent given type. The rule rejects if both fire.
  Probability of rejection given Fraud: $0.5 \times 0.5 = 0.25$.
  Probability of rejection given Legit: $0.4 \times 0.4 = 0.16$.
  Expected Utility (EU) = $0.98(1 - 0.16)(1) + 0.02(1 - 0.25)(-20) = 0.8232 - 0.30 = \mathbf{+0.5232}$.

  Now add Flag C (55% fraud, 50% legit). The rule now rejects if any two of {A, B, C} fire.
  Probability of $\ge 2$ flags given Fraud: $0.525$.
  Probability of $\ge 2$ flags given Legit: $0.40$.
  New EU = $0.98(1 - 0.40)(1) + 0.02(1 - 0.525)(-20) = 0.588 - 0.19 = \mathbf{+0.398}$.

  The value drops from 0.52 to 0.40. The fixed threshold ("any two") was tuned to the variance of two flags. Adding a third flag increased the collision rate for legitimate applications disproportionately relative to the utility loss from fraud. Because the model could not adjust the threshold (e.g., to "any three"), the new information forced more false rejects without sufficient gain in fraud detection. Good's theorem is silent here because the agent did not maximize over the new rule space; it remained stuck in the old rule applied to a new domain. Therefore, for fixed policies, adding inputs is a structural change requiring justification, not a default entitlement.

  ### Objections that land

  Three objections challenge this thesis, but only one succeeds.

  First, the "Designer as Agent" objection argues that Good's theorem applies to the engineer designing the system, not the model itself. Since the engineer *can* retrain the model on all channels, the default should remain "collect everything." This objection succeeds in locating where the theorem applies (the design phase), but it fails to support the engineer's deployment default. Retraining is not costless; it requires validation, regulatory approval, and stability guarantees. If the operational constraint is a frozen policy, the designer is no longer the active agent at decision time.

  Second, the "Irrational Fixity" objection claims that any agent who fixes a rule in advance is simply irrational, so violating Good's theorem is expected. This fails. Pre-commitment is often rational to prevent time-inconsistency, ensure fairness, or maintain auditability. A fixed rule is not a bug; it is a feature of constrained optimization.

  Third, the "Asymptotic Safety" objection suggests that with enough data, fixed rules converge to optimal ones, minimizing the risk. This fails because deployment happens in the non-asymptotic regime. The risk is not theoretical convergence but immediate utility loss during the freeze period.

  The "Designer as Agent" objection is the only one that lands, but it ultimately reinforces your thesis: it confirms that the guarantee holds only when re-optimization is possible. Since deployment often forbids this, the default presumption must shift.

  ### Qualifications

  This thesis must be narrowed to survive scrutiny. It applies specifically to *fixed* decision rules where the cost of re-optimization is non-zero. It does not imply that information is intrinsically harmful, nor does it argue against collecting data for future retraining. It argues against wiring data into *active* decision loops without adjusting the loop's parameters. Furthermore, it assumes the added channels are statistically dependent on the existing ones in ways that alter the joint distribution enough to trigger fixed thresholds. If the new channel is perfectly orthogonal or the rule is adaptive, the risk diminishes. The claim is not that data is dangerous, but that coupling data to static actions is a design change, not a free lunch.

  ### Bottom line

  Good's theorem guarantees the value of information only for agents free to re-optimize their decision rules, so for fixed policies, adding input channels is a structural modification that requires justification rather than a default enrichment. I accept the thesis as you have stated it.
