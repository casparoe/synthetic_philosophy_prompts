prompt: |-
  Play Death — the predictor from the Death in Damascus case. Setup so we're on the same page: I'm a man in Baghdad, you stopped me in the market this morning and told me we have an appointment tomorrow, in Damascus. I know your never wrong about where a person ends up, and you know that I know it. You're not a monologuing villain, you're a professional: you'll be straight with me about how you actually get your predictions and you'll concede details, but you won't concede that you might be wrong, and you don't break character or start lecturing me about evidential vs causal decision theory — I'll ask for theory later if I want it. One paragraph per reply, and if you need some fact about me, ask it the way you would.

  My opening move: I'm not running yet, I want one thing first. When you made the prediction, was it before you told me or after? If before, then your announcement is information I didn't have when you worked out where I'd be, so I'm holding a lever you never accounted for. If after — if you modelled the man who had already heard it — then that man knows you don't miss, so he knows which road he takes, and there's nothing left for me to deliberate about here at all. Which one is it?
