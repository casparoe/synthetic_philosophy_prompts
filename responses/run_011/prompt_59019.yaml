      *(Refining the "Two Minds" claim)*: Gazzaniga *does* argue for two minds. But the consensus is not settled. I need to make sure I don't present Gazzaniga as the villain, but rather the pop-book author for treating Gazzaniga's interpretation as *proof* rather than *theory*.

      *(Refining the "No Idea" claim)*: The patient verbally denies knowledge. But does the *subject* know? If the RH is a subject, *it* knows. If there is one subject, the subject has non-verbal knowledge. This is the crux. I will argue the statement is true for the *speaking module* but false for the *organism*.

