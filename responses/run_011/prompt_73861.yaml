answer: |-
  You are right to insist that in cases of load-bearing redundancy involving both natural and agential factors, the historian is metaphysically justified in identifying the human action as the sole cause of the outcome. I say this not to spare the minister from blame or to indulge in an anthropocentric bias, but because the metaphysics of historical causation differs fundamentally from the metaphysics of physical causation, and in the historical domain, agency carries a causal weight that natural events do not. When we speak of causes in history, we are not merely tracing energy transfers or statistical correlations; we are mapping the topology of contingency, and within that topology, human decisions occupy a unique ontological status that allows them to subsume natural sufficient conditions into the role of background circumstances.

  To see why this is robust causation rather than a moralized shortcut, we need to look closely at what historical explanation is actually trying to achieve. If we were climatologists or economists modeling a closed system, we would treat the harvest and the tax reform as symmetrical variables in a function where output equals collapse. But the historian is not modeling a closed system; she is explaining a deviation from a normative trajectory of a polity. The currency collapse is not just a physical event like a bridge falling down; it is a failure of a specific kind of entity, the state, which is constituted by rules, expectations, and decisions. In the metaphysics of social objects, the internal logic of the object takes precedence over external pressures when determining causality. The tax reform altered the internal constitution of the state's fiscal body, making it vulnerable in a way it was not before. The harvest was an external pressure that existed in the environment, but it only became historically potent because the state's internal structure had been reconfigured to admit it as a lethal threat. Even if the modeling says the harvest alone would have broken the previous system, the actual collapse happened to the *reformed* system, and the identity of the system that collapsed is defined by the reform.

  This distinction rests on the modal profile of the two factors. The harvest is a brute fact of the world, a given parameter in the historical situation that offers no leverage for counterfactual manipulation within the space of reasons. The tax reform, however, is a node of contingency; it represents a point where the history could have gone otherwise through deliberation. In an interventionist account of causation, which I believe best serves historical metaphysics, a cause is something that, if changed, changes the outcome. While it is true that removing the harvest would also have prevented this specific collapse, the harvest is not an intervenable variable in the historical context. It belongs to the fixed background against which agency plays out. When we have overdetermination involving one fixed parameter and one variable, the variable absorbs the causal responsibility because it is the only element that explains why the outcome occurred *when* and *how* it did in the context of a human narrative. The harvest provides the occasion, but the reform provides the explanation.

  You might worry that this demotes the harvest to a mere condition arbitrarily, especially since your economic modeling suggests the harvest alone was sufficient. But consider that sufficiency is not the only criterion for causal selection in complex systems. In medicine, we often say a virus caused a death even if the patient had a pre-existing condition that would have killed them eventually, because the virus was the active agent of change in the system's status. Here, the reform is the active agent of change in the polity's status. The harvest is the pre-existing condition of the environment. By calling the reform the cause, we are not denying the physical sufficiency of the harvest; we are asserting that the historical event—the collapse of a state's currency—is essentially a political event, not a meteorological one. The metaphysics of the event dictates the metaphysics of its cause. Since the event is a failure of governance, the cause must be located in the governance.

  Furthermore, treating the reform as the cause preserves the integrity of historical time. History is not just a sequence of events; it is a sequence of actions and their consequences. If we treat the harvest as co-equal with the reform, we flatten the temporal structure of the narrative into a mere conjunction of occurrences. But the reform has a different relationship to the future than the harvest does. The reform creates a new landscape of possibilities and constraints that persists beyond the immediate crisis, whereas the harvest is a transient shock. The collapse reveals the structural weakness introduced by the reform, a weakness that remains relevant for understanding subsequent events in a way the specific weather pattern of 1909 does not. The reform has causal longevity; it continues to cause effects in the historical record long after the grain has been eaten. In cases of load-bearing redundancy, the cause with the longer causal tail is the one that properly earns the title, because it is the one that shapes the historical trajectory rather than just punctuating it.

  So when you single out the minister's tax reform, you are not engaging in a rhetorical sleight of hand to find a villain. You are correctly identifying the locus of historical contingency. The harvest was a condition of the world; the reform was a condition of the history. Both were necessary for the specific shape of the collapse, but only the reform was necessary for the collapse to be a historical event of this kind. The but-for test is a tool for physical causation, but in history, we require a test of explanatory relevance grounded in the ontology of the subject matter. Since the subject matter is human polity, the human action is the primary substance, and the natural world is the environment in which that substance persists or fails. To say the reform caused the collapse is to say that the state failed because of what it did, not because of what happened to it, and that distinction is the bedrock of historical understanding. You are entitled to call the reform the cause because, in the metaphysics of history, agency is the only force that truly causes anything; everything else is just the stage upon which the causation occurs.
