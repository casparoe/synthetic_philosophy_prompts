answer: |-
  Here is the teaching plan, sequenced for a skeptical, game-theory-literate audience in a 90-minute constraint.

  ### 1. The Dependency Chain

  You cannot teach this in the order the book often presents it (Veil -> Parties -> Principles). For this room, the order is forced by the need to preempt the "Harsanyi/Expected Utility" objection. If they think the Veil is just a probability distribution, you lose them in minute 10.

  **The Forced Sequence:**

  1.  **The Goal (Stability, not Optimization):**
      *   *Must come first.* If they think Rawls is trying to maximize "goodness," they will apply Utilitarianism.
      *   *Dependency:* You must establish that the problem is **social cooperation over time** before you define the parties.
      *   *Why:* This sets up *Strains of Commitment*. If the goal is just one-off utility max, Maximin is irrational. If the goal is a system no one has reason to overthrow *ever*, Maximin becomes rational.

  2.  **The Parties (Mutually Disinterested, not Altruistic):**
      *   *Must come before the Veil.*
      *   *Dependency:* If you describe the Veil before defining the Parties, the room will assume the Veil *creates* altruism (the "empathy machine" error).
      *   *Why:* You need them to be self-interested rational agents so that the resulting agreement is robust. If they are altruistic, the agreement is fragile (depends on mood).

  3.  **The Veil (Information Filter, not Probability Generator):**
      *   *Must come before the Decision Rule.*
      *   *Dependency:* You must strip them of specific knowledge (to prevent bargaining) without giving them a probability distribution (to prevent Expected Utility).
      *   *Why:* This is the Harsanyi block. You must explicitly state: "You do not know the odds. It is not 1/N. It is *unknown*."

  4.  **The Decision Rule (Maximin via Strains of Commitment):**
      *   *Must come before the Difference Principle.*
      *   *Dependency:* The Difference Principle is the *output* of Maximin under these specific constraints.
      *   *Why:* If you jump to DP without justifying Maximin, they will view it as "risk aversion fetishism." You must anchor Maximin in the **irreversibility** of the choice (you can't quit society).

  5.  **The Outcome (The Two Principles + Difference Principle):**
      *   *Last.*
      *   *Dependency:* Requires all previous steps.
      *   *Why:* Only now does "Inequality is permissible only if it maximizes the minimum" make sense as a stability condition, not a moral intuition.

  **Where I'd Order Differently Than You Might Assume:**
  Do not start with the Veil. Start with the **Problem of Stability**. The LW crowd respects engineering constraints. Frame Rawls not as "moral philosophy" but as "mechanism design for a society that cannot be exited."

  ---

  ### 2. The One Carrying Example

  **The Example:** **Designing the Constitution of a Generation Ship.**

  **Why this works:**
  *   **No Exit:** Matches the "strains of commitment." You cannot leave the ship. If the rules are unbearable, you sabotage the life support.
  *   **No Money:** Resources are "life support hours," "calorie rations," "habitat volume," "decision rights."
  *   **No Politics:** Roles are functional (Hydroponics, Engineering, Waste Reclamation, Command), not ideological.
  *   **Fixed Pie Trap Avoided:** The total resources depend on how well the roles cooperate. Inequality can increase the total pie (incentives), but the *rules* for distribution are what's being chosen.
  *   **Fits the Room:** Sci-fi adjacent, systems-thinking friendly.

  **What it must have:**
  *   **Irreversibility:** Emphasize that once the ship launches, the constitution cannot be amended easily.
  *   **Primary Goods:** Frame the goods as "all-purpose means" (air, food, liberty to move within the ship) rather than "happiness."
  *   **Basic Structure:** You are designing the *rules for assigning roles and rations*, not assigning them right now.

  **What it must not have:**
  *   **Specific Identities:** No "John is the captain." Only "The person who ends up in Waste Reclamation."
  *   **External Trade:** No "we can trade with aliens." Closed system.
  *   **Moralizing:** Do not ask "what is fair?" Ask "what rules will prevent mutiny?"

  **How to run it on the Flipchart:**
  Draw the ship cross-section. Label the zones. Write the resource constraints. When discussing the Difference Principle, ask: "Do we give Engineers 2x rations to incentivize them to keep the reactor running? If yes, how much 2x? What if 3x rations doesn't make the reactor run any safer?"

  ---

  ### 3. The Misconception Map

  Intervene *before* the objection solidifies. Do not wait for Q&A.

  | Misconception | When it forms | Intervention Point | Script/Move |
  | :--- | :--- | :--- | :--- |
  | **"Veil = Empathy/Compassion"** | Defining the Original Position. | **Step 2 (The Parties).** | "Stop. The parties are *not* altruistic. They do not care about each other. They are mutually disinterested. If the Veil relied on compassion, the system would fail if people became selfish. It must work even if everyone is a egoist." |
  | **"Veil = Uniform Prior (Harsanyi)"** | Defining the Veil. | **Step 3 (The Veil).** | "One of you is thinking: 'Assign 1/N probability to each role and max expected utility.' Rawls explicitly rejects this. This is not a gamble with known odds. It is a choice under *radical uncertainty*. You cannot calculate EV because you don't know the probabilities. You are choosing for *every* life, simultaneously." |
  | **"Maximin is Irrational"** | Choosing the Decision Rule. | **Step 4 (Decision Rule).** | "In normal life, Maximin is paranoid. But this is a *one-shot, no-exit* contract. If the bottom outcome is 'unbearable suffering,' you cannot live with it. The 'Strains of Commitment' mean you must be able to uphold the agreement even if you end up at the bottom. If the bottom is hell, the contract dissolves." |
  | **"DP = Poor better off than Equality"** | Deriving the Difference Principle. | **Step 5 (The Outcome).** | "Careful. It is not 'better off than equality.' It is 'as well off as *possible*.' If an inequality helps the poor slightly, but a *different* inequality would help them more, the first one is forbidden. It's a maximization function for the minimum, not a floor." |
  | **"This settles CEO Pay"** | Applying the Principle. | **Step 5 (The Outcome).** | "Pause. Rawls applies to the *Basic Structure* (the rules of the game), not individual transactions. We are designing the *tax law*, not auditing the CEO. Don't ask 'Should he get the raise?' Ask 'What rules govern raises?'" |
  | **"Primary Goods = Welfare"** | Defining what they want. | **Step 2 (The Parties).** | "They don't know their conception of the good. They might want to be a monk or a hedonist. So they don't maximize 'happiness.' They maximize 'Primary Goods'—all-purpose means (rights, liberties, income) useful for *any* plan." |

  **Misconceptions You Missed (Add These):**
  1.  **"The Parties are Value-less Robots":** They have a *conception of the good*, they just don't know *which* one. They aren't blank slates; they are blank *specifics*.
      *   *Fix:* When defining Parties, say: "You have a life plan. You just don't know if you'll be an engineer or a recycler."
  2.  **"Lexical Priority is Optional":** They will try to trade Liberty for Economic Gain immediately.
      *   *Fix:* Enforce the order. "You cannot vote on rations until you have guaranteed basic liberty. Liberty is lexically prior."

  ---

  ### 4. The "Got It" Question

  Ask this 15 minutes before the end. It tests the **Difference Principle nuance** (maximizing the minimum vs. just improving it) and **Lexical Priority**.

  **The Question:**
  > "We are finalizing the Ship's Constitution.
  >
  > **Option A:** Waste Recyclers get 1,000 calories/day. Engineers get 2,000.
  > **Option B:** Waste Recyclers get 1,200 calories/day. Engineers get 3,000.
  > **Option C:** Waste Recyclers get 1,200 calories/day. Engineers get 5,000.
  >
  > Engineering output (and thus total ship safety) is identical in Option B and Option C. The extra calories for Engineers in C are pure surplus with no functional benefit to the Recyclers.
  >
  > **Which option does the Original Position select?**"

  **The Diagnostic:**
  *   **Utilitarian / "Nodding Politely":** Picks **B** or **C** indifferently, or picks **C** because "why not?" (Focus on total utility or lack of harm).
  *   **Misconception (DP = Floor):** Picks **B** (Recyclers are better off than A).
  *   **Rawlsian "Got It":** Picks **B** and explicitly rejects **C**.
      *   *Reasoning:* Option C increases inequality *without* improving the position of the worst-off. The Difference Principle forbids inequality unless it is *necessary* to benefit the least advantaged. Surplus inequality is unjust, even if it doesn't hurt the poor.
  *   **Bonus Points:** If someone says "Wait, do the Recyclers have voting rights on safety? If not, it's Option A regardless, because Liberty is prior."

  ---

  ### 5. The Refusal List

  You have 90 minutes. You must explicitly park these topics. Write them on the side of the flipchart under "Out of Scope."

  1.  **The Sen/Nussbaum "Capabilities" Critique:**
      *   *Why:* It attacks Primary Goods as an inadequate index (disability, etc.).
      *   *How to cut:* "Rawls uses Primary Goods as an index. Sen argues for Capabilities. That's a valid debate, but it's a critique of the *metric*, not the *mechanism* of the Original Position. We are testing the mechanism today."
  2.  **The "Average Utilitarianism" Proof:**
      *   *Why:* Rawls's argument against Utilitarianism in *Theory* is dense and relies on specific interpretations of probability.
      *   *How to cut:* "Rawls argues the OP leads to his principles, not Utilitarianism. Harsanyi argues it leads to Utilitarianism. We are not solving the math today. We are accepting Rawls's premise that *Strains of Commitment* rule out Utilitarianism, and exploring what follows."
  3.  **Real-World Policy Application (Taxes/CEO/Healthcare):**
      *   *Why:* It triggers ideological fighting and ignores the "Basic Structure" constraint.
      *   *How to cut:* "If you ask 'Should we tax the rich?', you are asking a policy question. Rawls asks 'What *principles* should guide the tax law?' Keep it at the constitutional level."
  4.  **Non-Ideal Theory (War/Corruption):**
      *   *Why:* Rawls assumes a "well-ordered society."
      *   *How to cut:* "This model assumes everyone complies once the rules are set. It does not tell us how to transition from a corrupt state to a just one. That is 'Non-Ideal Theory.' We are doing 'Ideal Theory' today."

  **How to announce the refusals:**
  "At the start: 'This is a 90-minute engineering walkthrough of Rawls's mechanism. There are valid critiques regarding [List]. I am parking them on the sideboard. If I bring them up, I've lost the thread. If you bring them up, please frame them as 'Does this break the mechanism?' not 'Is this true in the real world?'"

  ### Timing Breakdown (90 Mins)
  *   **00-10:** Intro & The Refusal List (Set constraints).
  *   **10-25:** The Problem (Stability) & The Parties (Disinterested).
  *   **25-40:** The Veil (Filter, not Probability) & The Example (Ship Setup).
  *   **40-60:** The Decision Rule (Maximin/Strains) & Deriving the Principles.
  *   **60-75:** The "Got It" Question & Discussion.
  *   **75-90:** Cleanup, Misconception Review, Close.
