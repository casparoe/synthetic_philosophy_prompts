prompt: |-
  ok so — I've been reading LW and SSC and having the same twenty arguements in comment sections for like fifteen years, and my city's rationalist-ish meetup has asked me to run a session on Rawls. Specifically the original position / veil of ignorance and the difference principle. 90 minutes, about 20 people, someone's living room, a wobbly flipchart, no way to do handouts. I said yes before I thought about it and now I'm dreading it, because half this room has already googled the veil of ignorance and is quite sure they know what's wrong with it.

  I want the teaching plan, not the explanation. Please don't explain Rawls to me, I know the material fine — I want to know how to sequence it for *this* room.

  What I need:

  **The dependency chain.** What genuinely has to be in place before the next thing can land, and where the order is forced vs. where it's just my preference. Concretely: can they understand the difference principle at all before they've got that the parties are mutually disinterested rather than altruistic? Can they get why the veil is a filter on bargaining information rather than an empathy simulation without something else going first? Spell out what depends on what, and flag the spots where you'd order it differently than I'm assuming.

  **The one carrying example**, and what it has to have and what it must not have. Everyone in that room will reach for cutting a cake where the cutter picks last — Rawls himself uses something like that for pure procedural justice — and I'm fairly confident that's a trap here, because it makes justice look like splitting a fixed pie between two people, which is exactly what the difference principle is not about. Tell me if I'm wrong. If I'm right, what do I use instead? Hard constraint: no money and no politics in the example, because the second dollars come up the room turns into a tax policy fight and I lose the 90 minutes.

  **The misconception map**, with the point in the sequence where each one gets diffused — not at the end, at the point where it would otherwise form. The ones I'm expecting:
  - "the veil is just max expected utility with a uniform prior over positions." One guy has literally written this up on his blog and will say it in the first five minutes. The annoying thing is he's half right — it's the old Harsanyi line — and I need to be able to say what the actual disagreement is, not just "no."
  - "maximin is an insane decision rule, nobody would ever use it in real life." My instinct is that the right response is that Rawls only thinks it's the rule under some pretty specific conditions, and that the real weight is carried by strains of commitment — the parties have to be able to actually live with and carry out what they chose, forever, with no exit. But I'm genuinely unsure whether that framing is right or whether it's me being generous to a book I mostly disagree with. Say which.
  - "the difference principle means inequality is fine as long as the poor are better off than they'd be under equality" — and I expect them to slide between *better off than under equality* and *as well off as possible* without noticing they've moved.
  - "so the veil is about imagining yourself poor / compassion."
  - "so this settles whether the CEO should get a raise" — basic structure vs. individual transactions.

  Tell me which of those I've got wrong or overstated, and add the ones I've missed. I suspect there's something about primary goods being an index rather than a stand-in for welfare that they'll fumble, and something about "they don't know their conception of the good" getting heard as "they have no values at all."

  **One question I can ask near the end** that distinguishes "they got it" from "they're nodding politely at a famous dead guy." Ideally one where the correct answer requires having given up one of the misconceptions above — so a person who never had the misconception answers differently from a person who's had it knocked out.

  **And what I should openly refuse to get into** and announce that I'm refusing. I'm thinking the Sen-style / disability attack on primary goods as an index, and the fact that the argument against average utilitarianism never really gets finished — but tell me what else has to be cut, and how to cut it without looking like I'm ducking the hard part.

  No readings, no bibliography, no "participants could consult chapter such-and-such." Nobody's reading anything and I'm not going to make you invent citations. Just the plan.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** LW/SSC rationalist-adjacent crowd (20 people, living room). Skeptical, familiar with utilitarianism/game theory, likely think they've debunked Rawls already (Harsanyi critique, maximin skepticism). 15 years of comment section arguments.
      *   **Topic:** Rawls (Original Position, Veil of Ignorance, Difference Principle).
      *   **Constraints:** 90 minutes, wobbly flipchart, no handouts, no money/politics in examples (avoids tax fights), no readings.
      *   **Deliverables:**
          1.  Dependency Chain (sequencing logic).
          2.  The One Carrying Example (must avoid "cutting the cake" trap, no money/politics).
          3.  Misconception Map (when to diffuse specific objections, including Harsanyi/UE, Maximin, Difference Principle nuance, Empathy vs. Filter, Basic Structure).
          4.  The "Got It" Question (diagnostic).
          5.  The "Refusal List" (what to explicitly table/cut).
      *   **Tone:** Pragmatic, strategic, respectful of the audience's intelligence but firm on the pedagogy. No explaining Rawls to the user (they know it).

  2.  **Deconstruct the Audience & Challenge:**
      *   *Rationalist Bias:* They love expected utility theory (EUT). They see the Veil as "assign equal probability to being anyone." They see Maximin as irrational risk aversion. They tend towards consequentialism/utilitarianism.
      *   *The Trap:* If you let them treat it as a standard decision theory problem under uncertainty, Harsanyi wins, and Rawls looks stupid. The goal is to show Rawls isn't doing *standard* decision theory; he's doing *moral* geometry constrained by stability/strains of commitment.
      *   *Time:* 90 minutes is tight for 20 people. Discussion will eat time. Need tight facilitation.

  3.  **Drafting the Dependency Chain:**
      *   *Goal:* Establish why the *structure* of the choice matters before the *outcome* of the choice.
      *   *Crucial Link:* You cannot explain the Difference Principle without first establishing *why* the parties choose Maximin. You cannot explain Maximin without establishing *why* the situation is unique (strains of commitment/no exit). You cannot explain that without establishing *who* the parties are (mutually disinterested, not altruistic).
      *   *Common Error:* Starting with the Veil (empathy machine) -> leads to "compassion" misconception.
      *   *Correct Order:*
          1.  The Problem (Social Cooperation/Stability) ->
          2.  The Parties (Mutually Disinterested/Reasonable) ->
          3.  The Constraints (Veil as Information Filter, not Empathy) ->
          4.  The Decision Rule (Maximin via Strains of Commitment, not Risk Aversion) ->
          5.  The Outcome (Difference Principle/Basic Structure).
      *   *Forced Order:* Parties must be defined before Veil (otherwise Veil looks like altruism). Decision Rule must be justified before Difference Principle (otherwise DP looks like arbitrary egalitarianism).

  4.  **Developing The One Carrying Example:**
      *   *Constraint:* No money, no politics. Avoid "cutting the cake" (fixed pie, 2 people).
      *   *Requirement:* Needs to show *structural rules* vs. *outcomes*, and *irreversibility*.
      *   *Idea 1:* Genetic lottery/Healthcare. (Too political/medical?)
      *   *Idea 2:* Designing a school system. (Good, but might drift into politics).
      *   *Idea 3:* Designing the rules of a game/sport. (Classic, but might feel trivial).
      *   *Idea 4:* **Designing a Colony/Ship.** (Sci-fi adjacent, fits LW crowd).
      *   *Selection:* **The Generation Ship.**
      *   *Why:*
          *   No exit (matches strains of commitment).
          *   Long time horizon (intergenerational justice).
          *   Roles are fixed but unknown (captain, engineer, hydroponics, waste recycler).
          *   Resources aren't just "money," they are life support/calories/leisure.
          *   Avoids "taxing the rich" rhetoric.
          *   Allows for inequality (engineers need more training/resources?) but constrains it by the worst-off (waste recycler must have livable conditions).
      *   *Avoid:* Don't make it about "who gets the biggest room." Make it about "what are the *rules* for assigning rooms and rations."

  5.  **Mapping Misconceptions:**
      *   *Harsanyi/Uniform Prior:* Address early, when defining the Veil. Distinguish *uncertainty* (Harsanyi) from *exclusion of knowledge* (Rawls). The key is the *non-probabilistic* nature of the choice due to the gravity of the outcome.
      *   *Empathy/Compassion:* Address when defining the Parties. They are *not* altruistic. They are self-interested. The Veil forces impartiality, it doesn't create benevolence.
      *   *Maximin Insanity:* Address during Decision Rule. It's not general risk aversion; it's about *acceptable outcomes* and *strains of commitment*. If the bottom is unbearable, the contract breaks.
      *   *Difference Principle Nuance:* Address during Outcome. It's not "poor better off than equality," it's "poor as well off as *possible*." The lexical order matters.
      *   *Basic Structure:* Address throughout the example. We are designing the *ship's constitution*, not deciding today's menu.
      *   *Primary Goods:* Address when discussing what they know/don't know. They know they want "all-purpose means" (air, food, liberty), not specific happiness metrics.
      *   *Conception of the Good:* Address when defining Parties. They have a plan, just don't know the details. Not value-less robots.

  6.  **Designing the "Got It" Question:**
      *   Need a scenario where Utilitarianism and Rawls diverge, but not on simple "tax the rich."
      *   Need to test *Basic Structure* vs. *Transaction* and *Strains of Commitment*.
      *   *Scenario:* A medical trial or a risky structural change.
      *   *Better:* **The "Slave/Genius" Case (modified).** If enslaving 1% makes everyone else 10% happier, Utilitarianism says yes. Rawls says no (Basic Liberties).
      *   *Even Better for DP:* **The "Incentive" Case.** If paying the engineers 10x more makes the life support 5% more efficient, DP allows it. If paying them 100x more makes it 5.1% efficient, DP forbids it (diminishing returns to the worst off).
      *   *Best Diagnostic:* **The "Exit" Question.** "If the waste recyclers can sabotage the ship to get a better deal, does the Original Position still hold?" (Tests Strains of Commitment/Stability).
      *   *Actually, let's go with the "Risk" Question.* "Would you accept a 1% chance of being a slave if it guaranteed everyone else utopia?"
          *   Harsanyi/Util: Yes (Expected Utility).
          *   Rawls: No (Strains of Commitment/Basic Liberties).
          *   *Refinement:* Needs to distinguish DP specifically.
          *   *Final Choice:* **The "Pareto Trap."** "An inequality helps the worst-off slightly, but creates a class of people who are humiliated (status harm). Is it allowed?" Rawls says Primary Goods include social bases of self-respect. Utilitarianism might count the humiliation as a negative utility but trade it off. Rawls lexically prioritizes self-respect.
          *   *Wait, simpler:* **The "One-Shot vs. Rules" distinction.** "You are behind the veil. You can choose a rule that gives you 100 units, or a rule that gives you 90 units but guarantees you can't be enslaved. Which do you pick?" (Tests lexical priority of liberty).
          *   *Let's stick to the prompt's request:* Distinguish "nodding" from "getting it."
          *   *Question:* "We discover a new resource that could double the rations for the Waste Recyclers, but only if we remove their voting rights on safety protocols. Do we take it?"
          *   *Rawlsian Answer:* No. (Liberty prior to Difference Principle).
          *   *Utilitarian Answer:* Calculate.
          *   *Misconception Answer:* "Yes, because the poor are better off." (Misses the lexical priority of liberty).

  7.  **Defining the Refusal List:**
      *   *Sen/Nussbaum (Capabilities):* Too deep. Acknowledge Primary Goods have critics, but say "We are testing Rawls's engine, not comparing it to Sen's."
      *   *Probability Critique (Harsanyi deep dive):* Don't get bogged in math. State the philosophical divergence (moral personhood vs. rational choice) and move on.
      *   *Real-world Policy:* Explicitly ban "What about CEO pay?" questions. Redirect to "What are the rules for setting CEO pay?"
      *   *Ideal Theory:* Acknowledge this is for a "well-ordered society," not a war zone.

  8.  **Review and Refine:**
      *   *Check Constraints:* No money/politics in example? Generation Ship works. No handouts? Flipchart only. 90 mins? Need strict timing.
      *   *Tone Check:* Is this respectful to the "rationalist" crowd? Yes, by acknowledging their EUT knowledge but framing Rawls as a different game (stability vs. optimization).
      *   *Dependency Check:* Does Maximin come before DP? Yes. Do Parties come before Veil? Yes.

  9.  **Final Polish:** Organize into the requested sections. Ensure the "Why" for each decision is clear. (Self-Correction: Make sure the "Generation Ship" example doesn't accidentally become "politics." Keep it technical/structural.)

  *(Self-Correction on the "Got It" Question)*: The prompt asks for a question where the correct answer requires giving up a misconception.
  *   Misconception: "DP means inequality is fine as long as the poor are better off."
  *   Correction: "Inequality is only fine if it's *necessary* to make the poor as well off as *possible*."
  *   Question: "Engineers demand 2x rations to work. If we pay them, Recyclers get 100 calories. If we don't, Recyclers get 80 calories. BUT, if we pay them 3x, Recyclers *still* get 100 calories (diminishing returns). Is 3x allowed?"
  *   Answer: No. (Because the extra inequality doesn't help the worst-off).
  *   This tests the "as well off as possible" vs "better off than equality" distinction.

  *(Refining the Refusal List)*: Be explicit on *how* to cut. "Parking Lot" method.

  *(Refining the Dependency Chain)*: Make sure to highlight the "Mutually Disinterested" vs "Altruistic" link. This is crucial for the LW crowd who might think Veil = Empathy.

