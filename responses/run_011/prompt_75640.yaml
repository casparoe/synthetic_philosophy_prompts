      *   *Case 3: Winston Churchill.*
          *   Harm: Bengal Famine policies/Imperial views.
          *   Comparison: British Parliament/Cabinet (many contested him).
          *   Knowledge: Famine was reported. Views contested *at the time*.
          *   Defense: "Standards of his time" fails because contemporaries objected.
