      *(Refining the Columbus Default)*: If facts are disputed, we can't establish Harm. If we can't establish Harm, the "Man of His Time" test is moot. But we can't affirm Honor on shaky ground. Default: "Contextualize, do not Celebrate." (e.g., remove statue, keep plaque).

