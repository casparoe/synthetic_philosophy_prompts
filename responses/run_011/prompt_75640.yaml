      *   *Step 2: The Harm.* Establish the bad act. (Fact check).
      *   *Step 3: The Comparison Class.* This is tricky. Need a rule to prevent bias. Rule: "The most demanding relevant peer group." (e.g., not "all slaveholders" but "merchants in this city who refused slave goods").
      *   *Step 4: The "Standards of His Time" Test.* Break this down.
