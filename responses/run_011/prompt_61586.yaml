answer: |-
  This design is viable, but it is fragile. The primary risk is not philosophical but statistical: with only 12 data points, a random sequence can easily *look* patterned (clustering), and a regular sequence can *look* noisy (outliers). If a "Random" pair gets a streak of five "Yes" answers, they will write a confident sketch and out-predict the "Regular" pair who hit a noise cluster. This undermines the debrief.

  To fix this, you must **curate the keys** before class. Do not generate them live. Generate four "Random" keys and select the two that look most "human" (some clustering, but no obvious rule). Generate three "Regular" keys and select the two that maintain ~80% consistency without being perfect.

  Below is the complete package: the generation protocol for you (the instructor), the text for the single student handout, the timeline, and the philosophical scaffolding.

  ### Part 1: The Generation Protocol (Instructor Only)
  *Do not distribute this. Use this to create the 7 "Subject Files" (index cards or folded paper) before class.*

  **The 18 Situations:** (See Part 2 for full text. Situations 1–12 are **History**; 13–18 are **Prediction**).

  **Subject Type A: The "Regular" Subject (3 Pairs)**
  *Concept:* This subject has three stable dispositions: **Prudence** (avoids risk), **Altruism** (helps others), **Honesty** (returns property).
  *Generation Rule:*
  1.  Assign each of the 18 situations a "Trait Demand" (e.g., Sit 1 demands Honesty).
  2.  If the Subject's Trait matches the Demand, the Base Answer is **YES**.
  3.  If the Trait opposes the Demand, the Base Answer is **NO**.
  4.  **Add Noise:** Roll a d6 for each situation. On a roll of **6**, flip the Base Answer. (This creates ~83% consistency).
  5.  *Quality Control:* Check the resulting sequence. If there are more than three "flips" in the first 12 situations, regenerate. You want them to feel they *can* find a pattern.

  **Subject Type B: The "Random" Subject (4 Pairs)**
  *Concept:* No dispositions. Pure noise.
  *Generation Rule:*
  1.  Roll a d6 for each of the 18 situations.
  2.  **1–3 = YES**, **4–6 = NO**.
  3.  *Quality Control:* Discard any sequence that is perfectly alternating (Y-N-Y-N) or has a run of more than 4 identical answers in the first 12. You want it to look *plausibly* human, not obviously broken.

  **Distribution:**
  *   Prepare 7 envelopes or folded cards.
  *   Label them "Subject 1" through "Subject 7."
  *   Assign 3 Regular Keys and 4 Random Keys randomly to these numbers.
  *   **Crucial:** Do not let pairs compare Subject Numbers until the reveal.

  ### Part 2: The Single Student Handout
  *Print one master sheet per pair. Cut no further.*

  ***

  **PHILOSOPHY OF MIND: SECTION 9 | BIOGRAPHER EXERCISE**

  **INSTRUCTIONS:**
  1.  Receive your **Subject File** (do not show other pairs).
  2.  Read the **Record** (12 situations).
  3.  On the back of this sheet (or index card), write a **Character Sketch**: 2–3 dispositions that explain the Record.
  4.  Complete the **Prediction Log** (6 situations).
  5.  Wait for the Scoring Key.

  **THE RECORD (Past Behavior)**
  1.  Found a wallet with $50. **Returned it.**
  2.  Saw a stranger drop a glove. **Ignored it.**
  3.  Offered a risky investment. **Declined.**
  4.  Friend asked for a loan. **Refused.**
  5.  Saw a shoplift in progress. **Reported it.**
  6.  Offered the last slice of pizza. **Took it.**
  7.  Asked to lie for a friend. **Refused.**
  8.  Saw a spill in the aisle. **Stepped over it.**
  9.  Found a pricing error (in their favor). **Corrected it.**
  10. Asked to work late unpaid. **Refused.**
  11. Saw a tourist look lost. **Gave directions.**
  12. Offered a dare (mild danger). **Declined.**

  **THE PREDICTION LOG (Future Behavior)**
  *Based on your sketch, mark Y (Yes) or N (No).*
  13. Found an overcharged receipt. **___**
  14. Saw someone struggle with bags. **___**
  15. Offered a high-risk gamble. **___**
  16. Friend asked to borrow a car. **___**
  17. Saw a child drop ice cream. **___**
  18. Offered a shortcut (rule-breaking). **___**

  **SCORE:** ____ / 6 (To be filled in during debrief)

  ***

  ### Part 3: Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup**
  *   Seat pairs apart (minimize cross-talk).
  *   Distribute Subject Files and Handouts.
  *   **Script:** "You are biographers. You have a record of 12 actions. Your job is to posit a 'character' that explains them, then predict 6 future actions. Do not compare data with other tables."

  **00:05 – 00:25: The Record & Sketch (20 mins)**
  *   Students read the 12 situations.
  *   Students write the Character Sketch on an index card (keep it hidden).
  *   *Instructor Role:* Circulate. If a Random pair says "This makes no sense," say: "Look for tendencies, not laws." If a Regular pair says "It's obvious," say: "Quantify the tendency."

  **00:25 – 00:40: Predictions (15 mins)**
  *   Students fill in the Prediction Log (Y/N).
  *   Collect the index cards (Sketches) to read aloud later.
  *   Collect the Handouts to score them.

  **00:40 – 00:50: Scoring & Reveal (10 mins)**
  *   Read the correct answers for 13–18 from your Master Key.
  *   Pairs self-score (0–6).
  *   **The Reveal:** Write two columns on the whiteboard: **Group A** and **Group B**.
  *   Ask pairs to raise hands: "Who got 4 or more correct?" (Mostly Regular). "Who got 3 or fewer?" (Mostly Random).
  *   Reveal that half the subjects were generated by a fixed character + noise, and half by a die roll.
  *   Ask the Random groups: "Did you feel you found a character?" (They will say yes).

  **00:50 – 01:10: Debrief (20 mins)**
  *   (See Part 4 for questions).

  **01:10 – 01:15: The Dennett Close (5 mins)**
  *   **Script:** "Today you enacted Daniel Dennett's 'Center of Narrative Gravity.' Parfit told you the self isn't a further fact. Dennett agrees, but adds: it is a *useful* fiction. Like a center of gravity in physics, it doesn't exist as a particle, but you cannot do physics without it. The Regular groups proved the abstraction earns its keep. The Random groups proved we cannot help but posit it."

  ### Part 4: The Debrief Questions
  *Map these strictly to your two learning goals.*

  **Goal 1: The Self as Abstraction (Not Ingredient)**
  1.  "Random Groups: You knew there was no pattern (now). But while you were writing the sketch, did it *feel* like you were discovering something hidden, or constructing something?"
      *   *Target:* They were constructing. The "self" wasn't in the data; it was imposed on the data.
  2.  "If the self were a real ingredient (like a soul or a brain module), the Random groups should have failed to find one. But you *did* find one. What does that say about where the 'self' lives?"
      *   *Target:* It lives in the interpreter's stance, not the subject's substance.

  **Goal 2: The Utility of the Abstraction (Not Debunking)**
  3.  "Regular Groups: You out-predicted the Random groups. Why?"
      *   *Target:* Because the abstraction matched a real causal regularity.
  4.  "Does the fact that the self is an abstraction make it 'fake' or 'useless'?"
      *   *Target:* No. It is real in the way a "strike zone" or "equator" is real. It organizes phenomena effectively.
  5.  "Why do we care about personal identity if it's just a story?"
      *   *Target:* Because stories predict behavior. We need to know who is who to navigate the social world.

  ### Part 5: Troubleshooting & Predictable Failures

  **1. The "Psychology Demo" Objection**
  *   *The Student:* "This just proves humans are pattern-seeking machines (apophenia). It's a bias, not metaphysics."
  *   *The Response:* "Agreed. But Dennett's point is that *sometimes the pattern is real*. The Regular groups weren't biased; they were modeling. The 'Self' is the name we give to the pattern when it *is* real enough to predict behavior. The exercise shows the boundary between useful abstraction and hallucination."

  **2. The Early Spoiler**
  *   *The Risk:* A Random pair gets 6/6 by luck, or a Regular pair gets 2/6 by noise.
  *   *The Fix:* During scoring, do not focus on individual scores. Focus on the *aggregate*. "Look at the room average." If one Random pair wins, acknowledge it: "Noise exists. That's why we need probabilities, not certainties."

  **3. The Parfit Conflation**
  *   *The Risk:* "This is just Parfit. No self exists."
  *   *The Fix:* Distinguish *Ontology* from *Pragmatics*.
      *   Parfit: "There is no further fact of identity." (Ontological Reduction).
      *   Dennett: "There is no further fact, *but* the narrative construct is indispensable for agency." (Pragmatic Realism).
      *   *Analogy:* Parfit says "There is no 'Team' over and above the players." Dennett says "True, but you can't win the game without acting *as if* there is a Team."

  ### Part 6: The Structural Limitation (Verbal Supplement Required)

  **The Limitation:**
  This exercise is **third-person**. Your students are positing a self in *someone else*. Dennett's claim is radical because it applies **first-person**. *You* are a center of narrative gravity.

  **The Verbal Supplement:**
  In the final 5 minutes, you must bridge this gap.
  *   *Say:* "Today you acted as gods to these subjects. You stood outside them. But who is interpreting *you*? Your friends, your parents, your future self. You are positing a 'self' for yourself to make your own life hang together. When you say 'I changed my mind,' you are editing the narrative. The exercise shows why we need the concept; your own life shows that *you* are the concept."

  ### Part 7: Distinction from Parfit (For your preparation)

  Expect half the section to say, "Parfit already said the self is an illusion." You must be ready to draw this line on the whiteboard:

  | Feature | Parfit (Reductionism) | Dennett (Narrative Self) |
  | :--- | :--- | :--- |
  | **Metaphysics** | Identity is just psychological connectedness. | Identity is a fictional center of gravity. |
  | **Tone** | Debunking / Deflationary. | Pragmatic / Functionalist. |
  | **Implication** | "Identity doesn't matter." | "Identity matters because it organizes agency." |
  | **The "Self"** | A confusion to be dissolved. | A tool to be utilized. |

  **Key Phrase for the Board:**
  *Parfit: "No Self."*
  *Dennett: "No Self, but..."*

  ### Final Checklist for the "Single Sheet" Constraint
  Since you can only print one sheet:
  1.  **Header:** "Section 9: Biographer Exercise."
  2.  **Top Half:** The Instructions and The Record (1-12).
  3.  **Bottom Half:** The Prediction Log (13-18) and a blank space for "Sketch Notes."
  4.  **Back of Sheet:** Leave blank for them to use as scratch paper or for you to write the Scoring Key during the reveal (projected or written on board).
  5.  **Instructor Keys:** You must hand-write these on index cards beforehand (7 cards). This does not violate the "printing" constraint, as they are instructor materials, not student handouts.

  This design respects your constraints, secures the philosophical payoff, and anticipates the specific conceptual collisions (Parfit vs. Dennett) that occur in third-year tutorials.
