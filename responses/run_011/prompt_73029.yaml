answer: |-
  **MEMORANDUM**
  **TO:** Standards Editor
  **FROM:** External Standards Consultant
  **SUBJECT:** Forward-Looking Claims Procedure & Adjudication of Live Items

  ### PART I: THE ONTOLOGICAL QUESTION
  **You are wrong.** It makes a difference whether an open-window claim is *unknown* (fact exists, we lack access) or *non-existent* (fact cannot exist yet).
  *   **If the fact exists:** "Unverifiable" is correct. We are limited; the truth is not.
  *   **If the fact does not exist:** "Inaccurate" is logically impossible until the window closes, unless you are rating the *premise* rather than the *outcome*.
  *   **Operational Cost:** If you treat open claims as "unknown facts," you license writers to call a claim "Inaccurate" based on current trajectory. This turns fact-checkers into forecasters. If you treat them as "non-existent facts," you restrict "Inaccurate" verdicts to claims where the *mechanism* is provably broken *now*.
  *   **Recommendation:** Adopt the second view. We rate the **basis** of the claim now, and the **outcome** later. This preserves non-partisanship.

  ### PART II: IS THIS A CATEGORY ERROR?
  **No, but it is a scope error.** You cannot fact-check a prophecy. You can audit a promise or a model.
  *   **Do not close the desk.** Public accountability requires tracking commitments.
  *   **Constraint:** You must stop rating *outcomes* before deadlines. Rate the *current evidence supporting the claim*.
  *   **Risk:** If you rate outcomes early, you become a political actor. If you rate only premises, you remain a referee.

  ***

  ### PART III: WRITER PROCEDURE (FORWARD-LOOKING DESK)
  **Time Budget:** 20 Minutes Intake. **Verdicts:** Fixed at 4 (Accurate, Broadly Accurate, Inaccurate, Unverifiable).

  **STEP 1: CLASSIFY THE CLAIM**
  *   **Promise/Projection:** The speaker/agency controls the outcome (e.g., "We will cut taxes," "Revenue will reach X").
  *   **Forecast:** The speaker predicts external events (e.g., "Recession coming," "Unemployment will rise").
  *   **[JUDGMENT CALL]:** If the line blurs (e.g., "My policy will cause growth"), treat as **Promise**. *Cost:* Attributes external factors to the speaker, increasing accountability but reducing technical precision.

  **STEP 2: CHECK THE WINDOW**
  *   **Closed:** The deadline has passed. Proceed to Step 4.
  *   **Open:** The deadline is in the future. Proceed to Step 3.

  **STEP 3: OPEN WINDOW PROTOCOL (The "Basis" Check)**
  *   **Question:** Is the math, data, or mechanism supporting this claim demonstrably false *today*?
      *   *Yes (e.g., Math doesn't add up, law prohibits action):* Verdict = **Inaccurate**. (You are rating the premise, not the future).
      *   *No (e.g., Trajectory is off, but time remains):* Verdict = **Unverifiable**.
      *   **[JUDGMENT CALL]:** We are repurposing "Unverifiable." It now means "No fact exists yet." *Cost:* Reader confusion. **Mitigation:** Mandatory analysis sentence: *"This claim cannot be rated Accurate or Inaccurate until [Date]."*
      *   **Action:** Set **Recheck Date** (1 month before deadline). Publish short "Tracking" note.
  *   **Conditional Claims:** If the condition fails (e.g., Referendum fails), Verdict = **Unverifiable**. Analysis: *"Condition not met; claim moot."*
  *   **Probabilistic Claims:** If the speaker gives odds (e.g., "70% chance"), you cannot rate the outcome. You rate the **source**.
      *   *Source is reputable model:* **Unverifiable** (Track).
      *   *Source is nonexistent:* **Inaccurate** (False premise).

  **STEP 4: CLOSED WINDOW PROTOCOL (The "Outcome" Check)**
  *   **Question:** Did the event happen as described?
      *   **Yes:** **Accurate**.
      *   **Mostly (e.g., 90% of target, 2 weeks late):** **Broadly Accurate**.
      *   **[JUDGMENT CALL]:** Define "Late." If >10% past deadline, downgrade to **Inaccurate**. *Cost:* Arbitrary threshold, but necessary for consistency.
      *   **Partially:** If the claim was specific ("Taxes will fall") and they fell but not enough to matter, **Inaccurate**. If vague ("Economy will improve"), **Broadly Accurate**.
      *   **No:** **Inaccurate**.

  **STEP 5: REVISION POLICY**
  *   **Who:** Only the Standards Editor (You) or Desk Lead.
  *   **When:** Only if new data fundamentally alters the *Basis* (Step 3) or when the Window Closes (Step 4).
  *   **Cost:** High. Requires a "Correction Note" appended to the original URL. Do not silently change verdicts.
  *   **[JUDGMENT CALL]:** We allow revisions on open claims if the *premise* collapses (e.g., law struck down). *Cost:* Perceived flip-flopping. **Mitigation:** Log all changes in a public "Changelog."

  ***

  ### PART IV: ADJUDICATION OF LIVE ITEMS

  **ITEM 1: Senator Tax Package (Window Open: 14 of 36 months)**
  *   **Procedure Application:** Step 2 (Open) → Step 3 (Basis Check).
  *   **Analysis:** Revenue is tracking low, but 22 months remain. The *mechanism* (tax law) is active. The premise is not yet provably false.
  *   **Verdict:** **Inaccurate rating was premature.** Must be reverted to **Unverifiable**.
  *   **Required Text:** *"While current revenue trails projections, the three-year window remains open. This rating reflects current trajectory, not final outcome."*
  *   **Cost of Reopening:** High. You must publish a correction acknowledging the error. It damages credibility to rate a 3-year claim at year 1.
  *   **Lesson:** Do not rate trajectory as outcome.

  **ITEM 2: Mayor Property Tax (Condition Failed)**
  *   **Procedure Application:** Step 3 (Conditional).
  *   **Analysis:** The claim was "If referendum passes... taxes fall." Referendum failed.
  *   **Verdict:** **Unverifiable** (Current status is correct).
  *   **Required Text:** *"The condition for this claim was not met. No fact exists to check."*
  *   **Action:** Archive item. Set Recheck to "N/A."
  *   **Note:** Do not rate "Inaccurate." The Mayor did not lie; the voters decided.

  **ITEM 3: Economist Recession (Definition Dispute)**
  *   **Procedure Application:** Step 1 (Forecast) → Step 3 (Basis Check).
  *   **Analysis:** "Recession" has no single legal definition for a metro area (unlike national GDP). The speaker did not specify the operational definition.
  *   **Verdict:** **Unverifiable**.
  *   **Required Text:** *"There is no standard definition for a metro-area recession. We cannot verify this claim until the speaker specifies the metrics used."*
  *   **Action:** Contact economist for definition. If they refuse or provide a non-standard one, note this in analysis.
  *   **Lesson:** Ambiguous terms in forecasts render claims Unverifiable until defined.

  ***

  ### PART V: WHAT THIS PROCEDURE CANNOT SETTLE
  **1. The "Broadly Accurate" Threshold:**
  *   **[JUDGMENT CALL]:** I set "10% late/miss" as the threshold in Step 4. This is arbitrary.
  *   **Alternative:** Case-by-case editorial review. *Cost:* Slows production, introduces bias risk.
  *   **Recommendation:** Keep the 10% rule for speed, review annually.

  **2. Probabilistic Truth:**
  *   **[LOGICAL LIMIT]:** If an economist says "60% chance" and the event *doesn't* happen, was the claim false? No.
  *   **Procedure Limit:** We cannot rate probability claims as Accurate/Inaccurate ever. They are always **Unverifiable** (tracked for calibration).
  *   **Cost:** Frustrates readers who want a "Right/Wrong" on experts.
  *   **Honesty:** You must explain to readers that probability claims are not bets; they are weather reports.

  **3. Revision Fatigue:**
  *   **[POLICY LIMIT]:** If you revise Item 1 now, you set a precedent that "Inaccurate" is temporary.
  *   **Risk:** Subjects will cite your "Inaccurate" rating for 14 months, then cite your correction when they finally succeed.
  *   **Mitigation:** When rating open claims "Inaccurate" (based on premise), use the headline: *"Premise Inaccurate,"* not *"Claim Inaccurate."*

  **FINAL RECOMMENDATION:**
  Your writers are currently rating **prophecies** (which cannot be facts) as **facts**. This procedure forces them to rate **premises** (which are facts) and **outcomes** (which become facts later). This aligns with your four existing verdicts without requiring Board approval, but it requires you to enforce the distinction between *trajectory* and *result*. If you cannot enforce that discipline, close the desk. It is better to have no future desk than a partisan one.
