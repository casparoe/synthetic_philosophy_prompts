      *   *Solution:* Since the Board won't add a verdict (like "Pending" or "Too Soon"), we must hack the existing four. "Unverifiable" is the only slot available for "not yet," but the *explanation* must change. We need to distinguish "Uncheckable in principle" (private meeting) from "Uncheckable in time" (future).
      *   *Decision:* I cannot solve the metaphysical dispute, but I can solve the workflow dispute. The procedure must treat open-window claims as *provisional*. The verdict isn't about the *truth* of the claim, but the *current evidence* supporting the likelihood or mechanism. Wait, the prompt says writers apply "Unverifiable" to anything about the future. Readers object because it implies "we can't check" vs "nothing to check."
      *   *Pivot:* The Board forbids a 5th verdict. I must use the existing 4. "Unverifiable" is the only logical bucket for "Too Soon," *but* the analysis text must clarify *why*. However, for the specific items (Tax package, Mayor promise, Economist recession), we need to see if they fit "Inaccurate" based on *current trajectory* or if they must remain "Unverifiable."
      *   *Refinement:* Actually, rating a future claim "Inaccurate" *before* the window closes is risky unless the mechanism is impossible. Rating it "Accurate" is impossible. So, most future claims *must* be "Unverifiable" (with a recheck date) OR rated on the *premise* (e.g., "The data used to make this forecast is wrong").
      *   *Crucial Constraint:* The prompt asks me to decide if the Editor is right that the metaphysical distinction doesn't matter. *Verdict:* The Editor is wrong. It matters for the "Inaccurate" verdict. If the truth value doesn't exist yet, you can't call it a lie. You can only call the *basis* for the claim inaccurate.
