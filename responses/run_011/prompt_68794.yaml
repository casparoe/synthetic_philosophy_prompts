prompt: |-
  write me a satire, 800–1000 words, formatted as a blameless postmortem / incident review doc from an engineering org — severity tag, timeline with timestamps, impact, root cause, contributing factors, action items with owners and due dates, a "what went well" section, and a comments thread at the bottom where people argue.

  The company sells a SaaS platform (call it Declaro, or whatever you like) that executes binding speech acts for enterprise customers: board resolutions, contract acceptances, product recalls, layoffs, oaths of office, ship christenings. Tuesday's incident: a christening at a shipyard where the platform returned SUCCESS on the naming call, but the customer's legal team now says the vessel is legally unnamed, and they're threatning to sue.

  The joke has to be that the on-call team is debugging something that isn't a bug. Get Austin's machinery right and let it do the comedy: the ceremony failed a felicity condtion (person not appropriately authorized, circumstances wrong, procedure not carried through completely and correctly by all participants), which makes it a misfire rather than an exception anyone can catch and retry; somebody in the thread insists it can't have misfired because all the perlocutionary effects landed — crowd cheered, bottle smashed, hull slid into the water — and gets patiently, condescendingly corrected; a PM proposes a real-time dashboard for sincerity conditions; the hotfix someone suggests is replaying the utterance in a staging environment, which the lone contractor in the thread points out would be a parasitic, hollowed-out use of those words and therefore cannot possibly count; and the "what went well" section should be genuinely, horrifyingly upbeat about uptake. Bonus if the severity tag and the root-cause line quietly contradict each other.

  Target is the practice of trying to engineer your way around something that is constitutively dependent on convention and context — not any real person, invent everybody. Keep it deadpan: no winking, no explanatory coda telling the reader what it all means. Don't put anything in quotation marks as though quoting Austin — paraphrase him. Invented people can be quoted freely, including at least one furious customer success manager and that contractor who thinks the entire product category is metaphysically confused.
