prompt: |-
  ok so I just spent four hours arguing with my roommate on his porch and my voice is basically gone, but I think there's a real project buried in what we were yelling about and I want you to help me get it down properly. You're going to be an expert in formal epistemology and decision theory who has actually sat through grant panels — someone who knows what makes reviewers' eyes glaze over and what makes them lean in — so please think carefully and, before you draft anything, spend a few hundred words brainstorming out loud about how to frame the question so it's genuinely open but still tractable for one person.

  The setup. My roommate is deep into the "evidential cooperation in large worlds" stuff: the idea that even with zero causal contact, agents spread across a huge universe can end up cooperating because each one's choice is evidence about what the others choose, since similar agents facing similar problems tend to correlate. He frames it as this huge positive-sum astronomical opportunity — there might be loads of other agents out there whose values we can advance by acting in ways they'd approve of, and vice versa, so the upside is enormous. My counterattack, which I think actually landed, was that the whole thing leans on an empirical premise about how many such partners exist, and the priors on that premise get set by exactly the kind of selection-effect reasoning he uses everywhere else: Fermi-style reasoning about filters, the doomsday-style worry that being early in your civilization's history is bad news about how many more are coming, the simulation argument's own accounting of how many observers of each type there should be. If you take seriously that we're unusually early, or that we're unusually lucky, or that we might be one of a vast number of cheap simulated observers, then the pool of sophisticated partners who could be in on the deal may be tiny or weirdly skewed — and if the pool is tiny, the correlation that makes cooperation work gets thin too. He said I was conflating the metaphysics of correlation with the base rate, and that even a small number of very high-stakes partners keeps the conclusion going. That's where we stalled and that's basically the question I want to pursue.

  What I need from you: a proposal document for a six-month non-residential fellowship at a small institute that funds independent philosophical work — think something like 1,100 to 1,400 words, in sections. They've read a hundred longtermist applications and they are tired, so please don't oversell. It needs to (1) state the question precisely enough that it could have a determinate answer, and not just "is ECL undermined by anthropics," because that's a debate topic, not a question — something closer to: given a stated self-locating evidence situation, does the credence an agent should assign to there being enough decision-theoretically similar partners fall below the threshold where the cooperation prescription differs from ordinary causal expected-value reasoning, and is that threshold even well-defined? (2) explain why the existing positions don't settle it, including my roommate's line that correlation and base rates are separate issues; (3) give the method month by month, and I want real content there — I'm imagining I'd build a deliberately oversimplified formal model, like agents who observe only their own situation and have to reason about the distribution of other agents' types and decision rules, and then see which assumptions about self-location make the cooperation prescription switch on or off; (4) argue for that modeling approach rather than the obvious alternatives, i.e. rather than writing yet another prose paper trading intuitions, or waiting on empirical astronomy, and say honestly what the toy model can and cannot show; (5) say what a successful result looks like and what would count as the project failing — I want at least one named way it could fail, like the model turning out to be so sensitive to arbitrary modeling choices that there's no interesting answer; (6) include the deliverables, which are one technical paper, one plain-language summary for the institute's newsletter, and a half-day workshop; and (7) give a realistic scope statement about what a single person can do in six months and where the scope-creep risk is, plus a short answer to the question the panel will definitely ask, which is why this isn't just speculative cosmology dressed up as ethics.

  Two constraints. Don't include a bibliography or any citations or a named literature review — I don't have library access and I'll add references myself later, and a made-up one would be worse than none. So refer to positions and arguments by description only, and if you want to gesture at a well-known line of reasoning, paraphrase it rather than quoting it. Also don't invent an academic track record for me; I'm coming at this from a master's thesis on self-locating belief, and I've done enough probability to build a model but I'm not going to pretend otherwise. Write it in American English, keep the tone confident but not breathless, and let the weirdness of the topic come through instead of smoothing it into boilerplate.
