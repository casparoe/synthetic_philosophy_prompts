      *   *Correction on "Writing":* The user asks about "writing a bit into a blank register" vs "overwriting back to blank."
          *   Standard view: Copying $S \to M$ (where $M$ is 0) results in state $(S, S)$. This is reversible. You can go back to $(S, 0)$.
          *   Erasure: $(S, S) \to (S, 0)$ or $(0,0)/(1,0)$. This maps two states to one. This is the irreversible step.
