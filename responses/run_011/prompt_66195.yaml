  6.  (Self-Correction during drafting): Make sure to distinguish between *Shannon entropy* (information) and *Thermodynamic entropy*. The bridge is the physical encoding. The standard view assumes they are convertible *only* via physical operations that respect Liouville's theorem.

  7.  *Key Insight to highlight:* The "cost" isn't in the *knowledge*, it's in the *state preparation*. The blank tape is a low-entropy resource. Using it up is the cost. Erasure is the process of consuming that resource (or rather, restoring it consumes work). Wait, Erasure *consumes* work to *create* a blank tape. So the blank tape is the *product* of work. The cycle requires a supply of work to create blank tapes. The user asks about the supply of blank memories being "free." Yes, that's the hidden assumption. The "free" blank tape is the local low-entropy past.

  8.  *Final check on the "Writing vs Erasing" symmetry:*
