answer: |-
  **The Temporal Artifact: Why Protracted Manifestations Collapse the Fink/Mask Distinction**

  The metaphysics of dispositions attempts to analyze what it means for an object to have a power or tendency, such as fragility or solubility, without reducing those powers to mere regularities. The standard starting point is the Simple Conditional Analysis (SCA), which claims that an object is disposed to manifest a property $M$ upon stimulus $S$ if and only if, were the object to undergo $S$, it would manifest $M$. This analysis is intuitive but notoriously fragile. It was dismantled by counterexamples involving "finks" and "masks." A fink is an interference that removes the disposition immediately upon the stimulus (like a wire that loses conductivity the instant it is touched), while a mask is an interference that prevents the manifestation while leaving the disposition intact (like a fragile glass packed in foam).

  To save the dispositional realist from the failure of the SCA, a reformulated analysis was proposed, most notably by Lewis. This account adds a clause requiring that the object possess an intrinsic causal basis for the disposition that would be retained through the stimulus and cause the manifestation. This move was designed to distinguish finks (which remove the basis) from masks (which leave the basis but block the effect). However, both the original counterexamples and the proposed fix rely on a hidden metaphysical assumption: that manifestations are instantaneous events. In reality, many paradigmatic dispositions—solubility, flammability, toxicity—manifest as protracted processes. When we shift our focus from instantaneous flashes to temporal processes, the clean distinction between finks and masks begins to dissolve. This essay argues that the fink/mask distinction is an artifact of modeling manifestations as point-events. Furthermore, while the Simple Conditional Analysis was already falsified by instantaneous finks, this temporal collapse specifically devastates the reformed analysis. The requirement that an intrinsic basis be "retained" becomes incoherent when the manifestation is a process that essentially alters the object over time, leaving the reformed analysis unable to account for the most common dispositions in the natural world.

  To understand the stakes, we must first reconstruct the dialectic briefly. The Simple Conditional Analysis posits a tight link between disposition and counterfactual: to be fragile is to be such that if struck, you break. Martin's electro-fink severs this link. Imagine a wire that is live (disposed to conduct) but is connected to a device that detects a touch and instantly renders the wire dead before current can flow. The wire is disposed to conduct, yet the counterfactual "if touched, it would conduct" is false. The SCA falsely denies the disposition. Conversely, consider a mask. A glass is fragile, but it is wrapped in perfect padding. If struck, it does not break. The counterfactual "if struck, it would break" is false, yet the glass remains fragile. The SCA falsely denies the disposition here as well.

  The reformed analysis attempts to rescue the concept of disposition by looking inside the object. It suggests that $x$ is disposed to $M$ when $S$ iff $x$ has some intrinsic property $B$ (the basis) such that, if $x$ were $S$ and $x$ retained $B$ for a sufficient time, $B$ would cause $x$ to $M$. In the fink case, the wire loses $B$ (conductivity) instantly, so the condition fails, but we can still say it had the disposition at $t_0$ because it had $B$ at $t_0$. In the mask case, the glass retains $B$ (fragility structure), but the padding prevents $M$. The analysis handles this by specifying that in the closest worlds where the mask is absent, $M$ occurs. The crucial mechanism here is the "retention" of the intrinsic basis. It assumes we can take a snapshot of the object's intrinsic nature at the moment of stimulus and track it forward to see if it causes the result. This works neatly if the result is a snap, like a shatter or a spark. It assumes the basis is a static property that waits to be triggered.

  The problem arises when the manifestation is not a snap but a stretch. Consider a sugar cube disposed to dissolve in water. The stimulus is immersion; the manifestation is the gradual disappearance of the crystal structure into the solution. This process takes time. Unlike the shattering of glass, which is effectively instantaneous relative to the stimulus of striking, dissolution is a continuum. Now, introduce an interference. We drop the cube in water at $t_0$. At $t_2$, when the cube is half-dissolved, a machine coats the remaining crystal in an inert resin, or perhaps the water is chemically altered to become saturated, halting further dissolution. Is the cube still soluble?

  If we say the coating removes the solubility, we treat the interference as a fink. But the interference occurred *after* the stimulus and after the manifestation had already begun. The disposition was already doing its work. If we say the coating merely blocks the rest of the dissolution, we treat it as a mask. But notice the metaphysical ambiguity. In the instantaneous cases, the difference between fink and mask is clear: does the object lose the power (fink) or just the opportunity (mask)? In the protracted case, stopping the process mid-stream looks functionally identical to removing the power to continue the process. If the cube is half-gone, does it retain the "basis" for solubility? The basis for solubility is the molecular structure of sucrose. The remaining half-cube still has that structure. So, by Lewis's lights, the basis is retained. The interference is extrinsic (the resin). So it should be a mask.

  However, consider a different interference. Suppose the water temperature drops significantly at $t_2$, slowing the dissolution to a near halt. Temperature is often considered part of the stimulus conditions, but in a protracted process, the maintenance of stimulus conditions is part of the manifestation's duration. If the temperature drop is natural, is it a mask? If the temperature drop is caused by a device targeting the water specifically to stop *this* cube from dissolving, is it a fink? The distinction begins to rely entirely on the origin of the interference (internal vs. external) rather than the metaphysical status of the disposition. But worse, consider the "retention" clause. For the sugar cube to dissolve, it must *lose* its intrinsic basis. The molecular structure of the solid crystal must be broken down for the manifestation to complete. Lewis's analysis requires that the object retain the basis $B$ for a sufficient time to cause $M$. But for process-dispositions, the completion of $M$ often entails the destruction of $B$. The sugar cube cannot dissolve completely and retain the basis of being a sugar cube.

  This creates a fatal indeterminacy for the reformed analysis. In the instantaneous model, retention is binary: you have the basis at $t_0$, and you either keep it or lose it at $t_1$. In the protracted model, retention is a gradient. The sugar cube retains its solubility basis less and less as it dissolves. If an interference stops the process at 40%, did the object retain the basis "sufficiently"? The reformed analysis offers no metric for "sufficient time" other than "time enough to manifest." But if the manifestation is stopped, we cannot know if the time was sufficient without already knowing if the disposition was present. The analysis becomes circular. We need to know if it was a fink (basis lost) or a mask (basis kept) to determine if the counterfactual holds, but we can only determine if the basis was kept by knowing if the process would have continued absent the interference.

  This suggests that the fink/mask distinction is not a genuine joint in nature but an artifact of treating every manifestation as an instantaneous event. When manifestations are processes, the "moment of stimulus" expands to cover the duration of the process. Consequently, any interference during that duration can be redescribed. A device that coats the half-dissolved sugar can be described as removing the disposition of the *remaining* sugar (fink) or blocking the manifestation of the *original* sugar (mask). Because the object at $t_2$ is not identical to the object at $t_0$, the question "does it still have the disposition?" is ambiguous. It depends on whether we are asking about the original whole cube or the current temporal part.

  A proponent of the reformed analysis, perhaps like my friend mentioned in the introduction, might object that this is merely a verbal dispute solvable by stage-indexing. They would argue that we should simply index dispositions to temporal stages. The sugar-cube-stage at $t_0$ is disposed to dissolve. The sugar-cube-stage at $t_2$ is disposed to dissolve further. If the resin is applied at $t_2$, it acts as a fink for the $t_2$-stage (removing its future solubility) but the process up to $t_2$ was a genuine manifestation of the $t_0$-stage's disposition. On this view, the distinction survives because we can always pinpoint which temporal stage is being interfered with. The intrinsic basis is retained by the stage until the stage ceases to exist.

  This reply fails for two reasons. First, it trivializes the disposition. If every temporal stage has its own dispositions independently of the past, then the persistence of the disposition over time becomes a series of unrelated facts. We lose the explanatory power of saying "the sugar dissolved *because* it was soluble." We are left with "the sugar-stage at $t_1$ dissolved because it was soluble, and the sugar-stage at $t_2$ dissolved because it was soluble." This severs the causal history that makes dispositions useful for prediction and explanation. We attribute solubility to the cube at $t_0$ precisely because we expect it to govern the behavior of the object *through* time, not just at a snapshot.

  Second, and more damagingly, stage-indexing does not save Lewis's specific clause about the retention of the intrinsic basis. Lewis's fix was designed to handle cases where the object persists through the stimulus. The clause "if $x$ were $S$ and $x$ retained $B$" implies a single entity $x$ enduring through the process. If we chop $x$ into temporal stages, the "retention" relation becomes a relation between distinct entities (stage 1 and stage 2). Lewis's account relies on the intuition that the *same* power persists to cause the effect. If the power is destroyed and recreated at every instant, or if the basis is essentially changing as the process occurs (as the crystal lattice breaks down), then there is no stable $B$ to serve as the anchor for the analysis. The reformed analysis posits $B$ as a static categorical property that grounds the disposition. But for process-manifestations, the "basis" is often a dynamic stability, not a static property. Iron rusting is a disposition based on its chemical reactivity, but the rusting process changes the surface chemistry continuously. To demand that the basis be "retained" in a way that distinguishes finks from masks is to demand a static ontology for a dynamic phenomenon.

  One might argue that this objection applies equally to the Simple Conditional Analysis. After all, if the SCA fails for instantaneous finks, does it matter that it also fails for protracted ones? It does matter, because the nature of the failure reveals where the philosophical damage is concentrated. The SCA was falsified by the original electro-fink because it could not account for the *presence* of the disposition when the counterfactual is false. That was a logical blow. The reformed analysis was supposed to fix this by grounding the disposition in the intrinsic basis. The protracted manifestation argument shows that the *fix itself* is metaphysically untenable for a vast class of dispositions. The SCA is dead, but the reformed analysis is a zombie: it walks like a solution, but it cannot handle the reality of time.

  If the distinction between fink and mask collapses for processes, we are left with a dilemma. Either we must accept that dispositions are not real properties that persist through time, or we must abandon the conditional analysis entirely in favor of a primitivist view where dispositions are fundamental and not analyzable in terms of conditionals or intrinsic bases. The reformed analysis tries to have it both ways: it wants dispositions to be real (grounded in $B$) but analyzable (via conditionals). The protracted case shows that the conditional structure cannot map onto the temporal structure of the grounding property. When a manifestation is a process, the "interference" is not an external shock to a static system; it is a modulation of a dynamic trajectory. Describing this modulation as either "removing the power" or "blocking the effect" is a choice of description, not a discovery of metaphysical fact.

  Consider the case of a poison. A person ingests a toxin (stimulus). The toxin begins to metabolize (process). At $t_{mid}$, an antidote is administered. The antidote neutralizes the toxin. Was the antidote a mask or a fink? Did it block the manifestation of the poison's toxicity, or did it remove the toxic disposition of the chemical mixture in the blood? Biologically, it changes the chemical structure (fink). Functionally, it stops the damage (mask). The reformed analysis demands we choose, because the truth of the conditional depends on whether the basis was retained. But nature does not care about our analytic categories. The chemical reaction simply stops. The insistence that we must categorize this as either a retention or a loss of basis forces a binary onto a continuum.

  This implies that the damage lands harder on the reformed analysis than on the SCA. The SCA was a simple logical claim that was proven false by counterexample. We knew it was false. The reformed analysis claimed to be a deeper metaphysical truth about the structure of powers. By showing that its central mechanism (retention of intrinsic basis) cannot accommodate temporal extension, we show that the analysis is not just false, but category-mistaken. It attempts to analyze dynamic powers using static ontology. The SCA failed because it ignored the intrinsic nature of the object. The reformed analysis fails because it ignores the temporal nature of the manifestation.

  In conclusion, the fink/mask distinction is a useful heuristic for instantaneous interactions, but it is not a genuine joint in nature when applied to protracted manifestations. It is an artifact of a snapshot metaphysics that treats time as a series of discrete points rather than a continuous flow. While the Simple Conditional Analysis was already untenable due to instantaneous finks, the temporal argument specifically undermines the reformed analysis. Lewis's requirement for the retention of an intrinsic basis presupposes that the basis is a stable property distinct from the manifestation. For processes like dissolving, rusting, or burning, the manifestation is the change in the basis. To demand that the basis be retained through the manifestation is to misunderstand the ontology of processes. My friend's suggestion to index dispositions to temporal stages saves the letter of the analysis but kills its spirit, rendering dispositions trivial and severing the causal history they are meant to explain. We are left with a verdict: the reformed analysis cannot save dispositional realism from the complexities of time. If dispositions are real, they are not conditional properties anchored by static bases, but fundamental features of objects that unfold across time, resistant to analysis in terms of instantaneous counterfactuals. The hole I started in was the worry that the distinction blurs; the way out is to recognize that the blur is the reality, and the distinction was the illusion.
