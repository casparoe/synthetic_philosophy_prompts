answer: |-
  ### The Historical Explanation Sorting Tree

  **Instructions:** Start at Node 1. Answer based strictly on a piece of historical writing you have produced (a seminar paper, a chapter draft, or a problem set response). Do not answer based on what you think you *should* believe, but on what your text actually *does*. Follow the branch that matches your text until you reach a leaf.

  **Node 1:** In your text, is the link between your cause and your effect justified by appealing to a rule or regularity that holds outside this specific case?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 4.

  **Node 2:** Is that rule presented as strict enough to support a prediction if the conditions were met again?
  *   **Yes:** Go to Node 3.
  *   **No:** **Leaf 1: Tendential Generalizer.**
      *   *Awkward Commitment:* If the rule is loose enough to admit exceptions, how does it rule out incorrect explanations?

  **Node 3:** Do you claim the rule must be explicitly stated in the explanation for it to be valid?
  *   **Yes:** **Leaf 2: Strict Nomologist.**
      *   *Awkward Commitment:* Can you name a single historical law that is both true and specific enough to do actual work?
  *   **No:** **Leaf 3: Crypto-Nomologist.**
      *   *Awkward Commitment:* If the law is doing the work but remains hidden, aren't you just pretending not to be a Strict Nomologist?

  **Node 4:** Does the explanation turn primarily on what a specific historical agent knew, wanted, or intended?
  *   **Yes:** Go to Node 5.
  *   **No:** Go to Node 6.

  **Node 5:** Did you derive the agent's reasons from evidence of their inner state (diaries, speeches), or from the objective situation they faced?
  *   **Inner State:** **Leaf 4: Re-enactment Theorist.**
      *   *Awkward Commitment:* How can you verify you have re-thought their thought without projecting your own mind onto theirs?
  *   **Objective Situation:** **Leaf 5: Situational Analyst.**
      *   *Awkward Commitment:* If rationality is assumed by method, how do you explain historically significant irrationality without changing the subject?

  **Node 6:** Is the explanation organized as a temporal sequence where getting the order right is the main explanatory work?
  *   **Yes:** Go to Node 7.
  *   **No:** Go to Node 8.

  **Node 7:** Does the sequence explain because it forms a coherent story (plot), or because it tracks causal dependencies between the events?
  *   **Coherent Story:** **Leaf 6: Strong Narrativist.**
      *   *Awkward Commitment:* If two equally coherent stories contradict each other, can both be true explanations?
  *   **Causal Dependencies:** **Leaf 7: Causal Chronicler.**
      *   *Awkward Commitment:* If you strip away the narrative flair, is there any explanation left, or just a list of dates?

  **Node 8:** Do you explain by tracing a chain of component activities or local causal steps (a mechanism)?
  *   **Yes:** Go to Node 9.
  *   **No:** Go to Node 10.

  **Node 9:** Do you claim the individual steps in the chain are governed by general laws, even if you don't state them?
  *   **Yes:** (Return to Leaf 3: Crypto-Nomologist).
  *   **No:** **Leaf 8: Mechanist.**
      *   *Awkward Commitment:* Where do you stop opening the "black boxes," and isn't that stopping point arbitrary?

  **Node 10:** Does the validity of your explanation change if the reader asks "Why X *rather than* Y?" instead of just "Why X?"
  *   **Yes:** Go to Node 11.
  *   **No:** **Leaf 9: Ontological Realist.**
      *   *Awkward Commitment:* If explanation is a relation in the world, why do historians disagree so much about what explains what?

  **Node 11:** Is the "rather than" part (the contrast class) essential to the *truth* of the explanation, or just to its *usefulness*?
  *   **Essential to Truth:** **Leaf 10: Strong Contrastivist.**
      *   *Awkward Commitment:* Does history cease to exist when no one is around to ask a contrastive question?
  *   **Essential to Usefulness:** **Leaf 11: Weak Contrastivist.**
      *   *Awkward Commitment:* If the truth is independent of the question, why does the question dictate which causes you select?

  *(Note: Leaf 11 is the "Unnamed" position often held by pragmatists who want contrastivity without relativism.)*

  ***

  ### Analysis of the Framework

  **1. The Status of Axis (iii): Contrastivity vs. Narrativity**
  Your suspicion that narrativity and contrastivity are the same move is incorrect, and the tree demonstrates why. Look at Node 6 (Sequence) and Node 10 (Contrast). A student can write a pure narrative (Node 6) that is not contrast-sensitive (Node 10 → Leaf 9). They simply tell "what happened" as a story, claiming the story *is* the reality. Conversely, a student can be a Strong Contrastivist (Node 11 → Leaf 10) without telling a story; they might explain a single variable shift (e.g., "Prices rose rather than fell *because* supply dropped rather than held") without any narrative arc. Narrativity is about *temporal configuration*; Contrastivity is about *pragmatic selection*. They are orthogonal axes.

  **2. Locating Case (E) and the Mechanism Question**
  Case (E) (the banking collapse) lands on **Leaf 8: Mechanist**. The student traces local causal steps without a unifying story arc and without stating a law.
  Regarding your question: *Is mechanism-based explanation a fourth value of axis (ii) or a covering-law position in denial?*
  The tree treats it as a distinct value (Node 8), but Node 9 reveals the tension. If the Mechanist admits the steps are law-governed (Yes at Node 9), they collapse into **Leaf 3: Crypto-Nomologist**. This suggests Mechanism is often a Covering Law position in denial *ontologically*, but distinct *methodologically*. The Mechanist says, "Show me the gears," while the Nomologist says, "Show me the rule governing the gears." If the Mechanist insists the gears work without *any* laws (No at Node 9), they occupy a rare philosophical space (Leaf 8) where causal powers exist independently of regularities. Most working historians are Crypto-Nomologists who prefer the label Mechanist.

  **3. Empty Cells and Unoccupied Combinations**
  Your axes allow for combinations that no leaf occupies. Here are the significant gaps:

  *   **Combination:** General Rule + Agent Reasoning + Strict Law.
      *   *Status:* **Unattractive.** This is "Rational Choice Theory" in its hard form. Historians rarely occupy this because they find the "strict law" requirement too brittle for human behavior, even if they use the "agent reasoning" part. They prefer Leaf 4 or 5.
  *   **Combination:** Specific Case + No Agent + No Sequence + No Mechanism + No Contrast.
      *   *Status:* **Incoherent.** If you have no rule, no agent, no sequence, no mechanism, and no contrast, you have no connective tissue (Axis ii) and no adequacy condition (Axis iii). You are left with assertion.
  *   **Combination:** Strong Narrativist + Strong Contrastivist.
      *   *Status:* **Neglected.** This is a fertile spot. A view where the "story" is only true relative to the "question" is philosophically robust but rarely defended explicitly. Most Narrativists want their stories to be true simpliciter (Leaf 6), and most Contrastivists are happy with analytic answers (Leaf 10). The combination is empty because it requires giving up truth twice over.

  **4. The Wedge: Case (B) vs. Situational Analysis**
  You suspected the tree might struggle to separate Case (B) (Rational Reconstruction) from Situational Analysis. Both reconstruct agent reasons. The wedge is **Node 5**.
  *   **Case (B)** answers "Inner State." The student looks at what the minister *actually* knew and wanted (empirical reconstruction). If the minister was irrational, the explanation fails.
  *   **Situational Analysis** answers "Objective Situation." The student models what a rational agent *should* have done given the structural constraints. If the minister was irrational, the Situational Analyst adjusts the model of the situation to preserve the rationality assumption.
  *   *The Real Wedge:* Is the principle of rationality an empirical hypothesis (B) or a methodological postulate (Situational)? The tree forces this distinction at Node 5.

  ***

  ### First Slide: Three Questions for the Seminar

  1.  When you write "because," are you describing a connection in the past, or a connection between your question and the past?
  2.  If you removed the narrative arc from your paper but kept all the causal claims, would the explanation survive, or would it collapse?
  3.  Are you assuming your historical actors were rational to make sense of them, or to test if they were?
