  # The Class of Unclassified

  Mr. Aris did not believe in luck. He believed in the Schedule, the Sufficiency Rule, and the cold comfort of the Narrowing Rule. He sat in the Bureau of Actuarial Justice, the hum of the filing cabinets vibrating through the soles of his shoes, and opened the file for Petition 8940.

  The petitioner was Mrs. Elara Gable. She sought authorization for a Cognitive Reset, a procedure to excise the memory of a traumatic event. The statute was clear: if the probability of Successful Integration was below fifty percent, the procedure was denied. To deny her was to condemn her to live with the memory. To approve her was to risk a Catastrophic Failure, leaving her mind hollowed out.

  Aris dipped his pen. He began the narrowing.

  **Step One: Age Decile.**
  The Schedule demanded he start here. The archive contained 10,000 recorded petitions for Reset.
  *Class:* All Applicants.
  *Size:* 10,000.
  *Success Rate:* 50.0%.
  *Narrowing:* Age 30–39.
  *Size:* 2,000.
  *Success Rate:* 48.5%.
  The number dipped. Aris noted it. The machinery did not care if the number fell; it cared only that the class was smaller.

  **Step Two: Region of Birth.**
  *Class:* Age 30–39, Region North.
  *Size:* 400.
  *Success Rate:* 60.0%.
  The number rose. Mrs. Gable was from the North. This was good for her. Aris felt a flicker of warmth, quickly suppressed. This was not kindness; it was arithmetic.

  **Step Three: Occupation Class.**
  *Class:* Age 30–39, Region North, Occupation Educator.
  *Size:* 35.
  *Success Rate:* 34.3%.
  The number plummeted. Educators had rigid neural pathways; the Reset often snagged. Thirty-five cases was enough to satisfy the Sufficiency Rule, which required a minimum of thirty recorded outcomes. But the rate was well below the statutory threshold of fifty percent. If he stopped here, she would be denied.

  **Step Four: Trauma Type.**
  *Class:* Age 30–39, Region North, Occupation Educator, Trauma 'Bereavement'.
  *Size:* 25.
  *Success Rate:* 40.0%.
  Aris circled the size. Twenty-five.
  He tapped the Sufficiency Rule. *A class may be used only if at least thirty of its members have recorded outcomes.*
  Step Four was invalid. The machinery jerked backward. He was forced to Broaden. He returned to Step Three.
  *Class:* Educators.
  *Size:* 35.
  *Rate:* 34.3%.
  There were no further attributes on the Schedule that maintained sufficiency. The Narrowing Rule commanded him to narrow *as long as a further step is available*. Step Four was available, but it broke the Sufficiency Rule. The statute did not specify which rule took precedence when they conflicted, but precedent dictated Sufficiency was the gatekeeper. He must stop at the last valid class.
  Step Three. Thirty-four percent. Denial.

  Aris prepared the rejection form. Then he stopped. He looked at the list of the thirty-five educators in the archive. Six of them were marked with a small asterisk: *Appeal Case*. They had been denied initially, appealed, and undergone the procedure under a waiver.

  He went to the hearing room. The air smelled of stale tobacco and ozone. Mrs. Gable sat on one side of the table, her hands folded over a handkerchief that remained dry. Her representative, a man named Kress with ink-stained cuffs, sat beside her. The Bureau’s representative, Ms. Vane, sat opposite, sharpening a pencil.

  "The class of Educators is too specific," Kress argued, his voice low. "It punishes her for her profession. The Region class is stable. Four hundred cases. Sixty percent success. That is the true reference class."

  "The Schedule dictates the order," Ms. Vane said without looking up. "Region is Step Two. Occupation is Step Three. The Narrowing Rule requires we go to Three. To stop at Two is to ignore the law."

  "The law requires a valid class," Kress countered. "Thirty-five cases is barely a sample. It is noise."

  "It meets the threshold," Vane said. "Thirty is the line. Thirty-five is above the line."

  Aris listened. He thought about the asterisks. If those six appeals were not independent trials—if their outcomes were influenced by the fact they were appeals—then they corrupted the frequency. But the Schedule did not list "Appeal Status" as an attribute. To exclude them would be to introduce an admissible attribute not on the list.

  Later, in the archive, Aris found the file he was looking for. Certificate 402, issued ten years prior. It had assigned a probability of 70% to a class of "Metalworkers in District 4." At the time, the rate was accurate. But after the certificate was published, Metalworkers in District 4, knowing their high success rate, flocked to the procedure. The influx changed the demographic slightly—perhaps the desperate ones came later—and within two years, the success rate for that class dropped to 45%. The certificate had been true when issued, and false forever after. The act of measuring the class had altered the class.

  Aris sat on the floor of the aisle, the dust motes dancing in the light from the high windows. The classes were not out there waiting to be found. They were made by the finding.

  He returned to his desk. Mrs. Gable was waiting in the anteroom. He called her in. She did not sit.

  "Mr. Aris," she said. "Tell me. What does the number say about me?"

  "It says that among people like you," Aris began.

  "Not like me," she interrupted. "Me. On the morning of the procedure. When I am on the table. Is it fifty percent then? Is it zero or one?"

  "The statute does not authorize us to speak to individual outcomes," Aris said. His voice sounded hollow to him.

  "So I am a ghost," she said. "I am only real as part of a crowd. If I am alone, I am nothing to you."

  "You are a case," Aris said. "You are Case 8940."

  "I am a woman who cannot sleep," she said. "Do not give me a crowd. Give me an answer."

  "There is no answer for one," Aris said. "There is only the class."

  She looked at him, and for a moment, the bureaucratic dryness of the room seemed to crack. He saw not a petitioner, but a person standing on a precipice, asking for a map of a territory that did not exist. He looked away.

  "When will I know?" she asked.

  "By closing," he said.

  She left. The door clicked shut.

  Aris looked at the file again. Step Three. Thirty-five educators. Thirty-four percent success. Denial.
  He looked at the six appeals. If he excluded them, the size was twenty-nine.
  If the size was twenty-nine, the Sufficiency Rule failed.
  If the Sufficiency Rule failed at Step Three, he was forced to Broaden.
  He would return to Step Two. Region North.
  Size: 400. Rate: 60.0%.
  Approval.

  He picked up his pen. He hovered over the file. To exclude the appeals was to argue that they were not "recorded past cases" in the sense intended by the statute. They were outliers, contaminated by the legal process. It was a defensible interpretation. It was good faith. It used the machinery: the Sufficiency Rule forced the broadening, the Narrowing Rule allowed the stop at Step Two because Step Three was now invalid.

  But it was a lie. They were recorded. They had outcomes. They were cases.

  He thought of Certificate 402. The class changed because people looked at it. If he issued this certificate based on Step Two, Mrs. Gable would become the 401st case in the Region North class. Her outcome would alter that rate. If he issued it based on Step Three, she became the 36th Educator.

  He thought of the tempting attribute he had found in a marginal notebook left by a retired clerk. *Time of Filing.* Cases filed on Tuesdays had a success rate of 85%. Cases filed on Fridays, 30%. Mrs. Gable had filed on a Tuesday. It correlated beautifully. The sample size was in the thousands. But it was not on the Schedule. To use it would be fraud. To ignore it was to ignore a truth that could save her.

  The Schedule was a cage. But cages have bars, and bars have spaces between them.

  Aris looked at the definition of "Recorded Past Case" in the preamble of the Statute. *Any instance where the procedure was authorized and completed.*
  The six appeals had been authorized under a *waiver*, not a standard certificate. They were legally distinct. They were not "Recorded Past Cases" under the strict definition of the Actuarial Statute, but rather "Administrative Exceptions."
  It was a thin distinction. It was the kind of distinction lawyers fought over for years. But it was there. The text said "Certificate," not "Procedure."

  If he excluded the six waivers, the count was twenty-nine.
  Sufficiency Failed.
  Broaden to Step Two.
  Rate: 60%.
  Authorization Granted.

  Aris wrote the number on the certificate. He did not feel relief. He felt the weight of the manipulation. He had not changed the data; he had changed the definition of the data to fit the rule. He had used the rigidity of the machine to break the machine.

  He stamped the document. **AUTHORIZED.**

  He placed it in the outbound tray. He imagined Mrs. Gable reading it. He imagined her on the table. He knew that by saving her, he had lowered the success rate of the Region North class for the next petitioner. He had borrowed safety from the future to pay for the present. The class would shift. The number would lie tomorrow because it was true today.

  He stood up and walked to the window. The city below was a grid of streets and blocks, a physical Schedule. People moved through it, unaware that their paths were being calculated by men in rooms like this, men who decided which crowds they belonged to.

  Aris returned to his desk and opened the next file. Petition 8941. A male, 45, Occupation: Clerk.
  He began the narrowing.
  Step One: Age.
  Step Two: Region.
  He wondered if he would have to erase this man's profession to save him too. He wondered how many people he could save before the classes dissolved entirely, leaving only individuals, naked and unquantifiable, standing in the silence.

  He dipped his pen. The ink was black and permanent. He wrote the first number. The machinery hummed, indifferent to the horror of its own precision, waiting for the next command to carve the world into pieces small enough to measure, and large enough to hide the truth.
