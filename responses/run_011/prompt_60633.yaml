prompt: |-
  Right, me and my mate Sam have been going back and forth on this for about three hours and I've come away more confused then I started, so I'm outsourcing it.

  He reckons he can prove that nobody has unconscious beliefs — that the whole repression / self-deception package is straight-up incoherent — and that he gets there from the Moore's paradox sentence. Here's his argument as best I can reconstruct it, he talks faster than I type:

  1. "It's raining, but I don't believe it's raining" is absurd. Not false, it might well be true, but nobody can coherently say it, and it cant be a coherent thing for me to think either.
  2. Saying something is expressing a belief. So in saying that I'd be expressing the belief that it's raining and simultaneously expressing the belief that I don't believe it's raining. I'd be presenting myself as holding both.
  3. Holding both is self-condemning. Believing p is taking p to be true, which is taking myself to be right about p, which is flatly at odds with taking myself not to believe p. So it isn't just an unlucky combination, it's one that couldn't be rationally held at all.
  4. Nothing in 1 to 3 was specific to rain, or to me. So for any subject S and any p: S cannot rationally believe p while believing that they don't believe p.
  5. Now run the exact same argument on "It's raining, but I'm not sure whether I believe it's raining." That one's absurd too, and for precisely the same reason. So S cannot rationally believe p while being unsure whether they believe p.
  6. But you can't be unsure whether you believe p unless there's a possible gap between believing p and taking yourself to believe p. So there is no such gap. Belief is transparent: if you believe p you believe that you believe p, and if you don't believe p you believe that you don't.
  7. Transparency makes the self-deceived person impossible. The bloke who believes his wife is unfaithful while sincerely insisting he doesn't would have to believe both, and 4 says he can't.
  8. So there are no unconscious or repressed beliefs, and self-deception as it's normally described doesn't exist.

  Sam says that if I want to keep 1 — and I do, that sentence is the entire reason I got interested in this stuff — then I'm on the hook for 8, and my only escape hatch is denying 2. I don't think denying 2 is even an option, it just looks true of assertion in general, so I'm stuck.

  So which step is actually the bad one? Walk me through why it looks perfectly fine when you're not staring directly at it. And price up the alternatives for me — I've vaguely heard there's a line where "I believe that p" isn't a report at all but just another way of asserting p, which I think would blow the whole thing up somewhere early, but I've no idea what that does to step 6 and whether it leaves me with any self-knowledge worth the name. Also: is step 5 doing something sneakier than it looks? Being unsure whether you believe something feels nothing like believing that you don't, and I can't tell whether Sam is allowed to slide between those two.

  And if 8 does somehow survive, does that mean the self-deception crowd are just talking nonsense, or that they're describing something real that turns out not to be belief?

  Cheers — British English please, I'm going to show this to him.
