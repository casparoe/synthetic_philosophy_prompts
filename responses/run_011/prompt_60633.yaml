      *   *Conclusion on Self-Deception:* If Sam were right (he's not), self-deception would have to be redefined (e.g., as anxiety or avoidance, not belief). But since he's wrong, we can keep the standard view.

  5.  **Refining the Argument (Self-Correction during drafting):**
