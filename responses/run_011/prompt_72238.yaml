  **GROWTH OPTIMAL: Kelly Bet Sizer**
  *Maximize Time-Average Wealth Trajectories*

  **4.68231 ★** (1,428 Ratings) | **Finance** | **Free** (In-App Purchases)

  **Description**
  Stop trusting ensemble averages. You do not live in a multiverse; you live in time. GROWTH OPTIMAL calculates the exact fraction of your bankroll to wager to maximize geometric growth rate while strictly prohibiting ruin. Unlike expected-value calculators that encourage over-leverage across imaginary copies of yourself, our engine optimizes for the single path you actually traverse. Features include dynamic bankroll tracking, ruin probability alerts, and log-utility normalization. Protect your future self from your present self's arithmetic errors.

  **Permissions**
  • Access to Bankroll Data
  • Camera (for odds scanning)
  • Background Refresh (for continuous compounding)

  **What's New**
  **Version 2.4**
  • Fixed bug where spending money was treated as a loss of capital.
  • Updated assumption: all wagers are now treated as independent events.
  **Version 2.3**
  • Added "Half-Kelly" toggle for reduced volatility.
  • Improved support ticket response time.

  ***

