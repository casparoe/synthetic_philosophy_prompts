answer: |-
  The holographic seal on Lot 42 shimmered with a sickly green iridescence when I tilted it under the desk lamp. It was a standard authentication mark, identical to the ones on Lots 1 through 41, but the paper felt different. Heavier. Burdened.

  I logged the transfer into the ledger. *Buyer: University of Chicago. Price: $45,000. Status: Active.*

  Across the table, the Dean of Humanities wiped his palms on his trousers. He looked like a man who had just purchased a coffin for a living relative.

  "It clarifies the garden scene," the Dean said, his voice tight. "We needed to know if the protagonist was hiding the key or planting it. The Certificate says she was planting it."

  "And?" I asked. I didn't look up. My job was the ink, not the interpretation.

  "And it ruins the third act," he said. "If she was planting it, the betrayal in chapter twelve isn't a tragedy. It's administration. It's bureaucracy. The students... they can't engage with the text anymore. The tension evaporates the moment they read the notarized statement."

  I capped my pen. "The Estate's policy is clear, Dean. Once a Certificate of Intention is sold and registered, that reading becomes the official provenance of the text. Unlicensed readings are not banned, but the Estate advises against citing them in academic work. It devalues the degree."

  "I know the policy, Mr. Thorne." He stood up, leaving the check on the table. "I'm telling you the asset is depreciating. You're selling us the anatomy of a corpse and expecting us to treat it like a pulse."

  He left before I could offer a receipt. I placed the check in the tray and picked up Lot 42. It was a single sheet of cream-colored cardstock, enclosed in a tamper-evident polymer sleeve. Inside, in Elara Vance's own hand, scanned and verified by three independent graphologists, was a single sentence: *She intended the key to be found, but not by him.*

  It was a precise, surgical incision into the ambiguity that had kept *The Glass Meridian* alive for thirty years. The Meridian Circle, the stubborn reading group that met in basements and backrooms to argue over Vance's syntax, had thrived on the uncertainty. Was the key a symbol of trust? Of entrapment? Now, it was just a plot point.

  I filed the certificate in the climate-controlled vault. The air inside smelled of ozone and old money.

  The Estate of Elara Vance had been formed six months after her death. It was a machine designed to do what Vance had refused to do in life: explain herself. The liquidity was unusual for a literary estate. Usually, there are rights, royalties, unfinished drafts. Here, there was cash, and there were the Boxes.

  Fifty Boxes. Each containing sealed envelopes. Each envelope a Certificate of Intention regarding a specific ambiguity in her bibliography. The Board, led by Mrs. Gable, viewed them as annuities. I viewed them as a ledger of ghosts.

  The problem wasn't the sales. The sales were robust. Collectors loved the exclusivity of knowing what the author *meant*, even if knowing it made the art lesser. The problem was the contradiction.

  I pulled the file for Lot 43. It had been sold two weeks prior to a private collector in Geneva. Lot 43 concerned the same chapter as Lot 42.

  *She intended the key to be lost forever.*

  Two certificates. Two notarized, hashed, and blockchain-verified declarations from the same author, regarding the same object, issued within the same year of her life. They contradicted.

  Under the terms of the Trust, once a Certificate is sold, the reading governs. But what governs when the Certificates war? The market had begun to tremble. The price of *The Glass Meridian* first editions had dipped. Why buy a rare copy if the text inside is unstable? If the official history is schizophrenic?

  Mrs. Gable found me in the vault at 4:00 PM. She was a woman who wore power suits like armor, her hair pulled back so tightly it seemed to hold her skull together.

  "The Geneva transfer cleared," she said. "But the Chicago Dean is calling our legal team. He says we sold defective goods."

  "The goods are authentic," I said. "The intent was authentic at the time of writing."

  "Intent isn't a static commodity, Elias." She walked down the aisle, her heels clicking on the polished concrete. "It's supposed to be the final word. If there are two final words, there is no authority. If there is no authority, the Certificates are just paper."

  "Then stop selling them."

  "We can't. The Estate relies on the liquidity. We have Lot 99 coming up next week. The Final Line."

  I felt a cold knot tighten in my stomach. Lot 99 was the crown jewel. The last sentence of *The Glass Meridian*. *And so the water took the name of the river.* For thirty years, critics had argued: Was this death? Was this assimilation? Was it a surrender or a victory?

  "If Lot 99 contradicts the earlier lots," I said, "the system collapses."

  "Then we ensure it doesn't," Mrs. Gable said. She stopped in front of the safe where Lot 99 rested. "We have a buyer for 99. Silas Vane."

  I knew the name. Vane was a collector of negative space. He bought paintings to leave the walls bare. He bought manuscripts to keep them in the dark.

  "Vane knows about the contradiction?"

  "He doesn't care. He wants the certificate. He's offering double the reserve. But he has a condition." She turned to me. "He wants you to authenticate it without breaking the seal."

  "That's impossible. Protocol requires visual verification of the content to ensure it matches the hash on the blockchain."

  "Make it possible," she said. "The Estate needs this sale, Elias. The litigation from Chicago is costing us more than the Dean paid. Lot 99 closes the quarter. It closes the narrative."

  She left me in the vault. I stood before the safe. The hum of the cooling units was the only sound. I thought about the Meridian Circle. I had watched them once, through a window in a community center in Brooklyn. Older people, mostly. Drinking cheap wine, shouting over a photocopy of chapter nine. They were alive. They were angry. They were in love with the book.

  If I sold Lot 99, if I registered the intent, the shouting would stop. The book would become a statement. A monument. A dead thing.

  ***

  Silas Vane arrived on a Tuesday, under the cover of a grey rain that blurred the city into watercolors. He was younger than I expected, wearing a coat that cost more than my car. He didn't bring a briefcase. He brought a small, metal incinerator bag.

  We sat in the viewing room. The Certificate for Lot 99 lay between us on the steel table, still in its opaque sleeve.

  "You understand," Vane said, his voice soft, "that I do not wish to read this."

  "My instructions are to verify the content before transfer of title," I said. I was following the script. The ledger demanded it.

  "And if you verify it," Vane said, "you record it. If you record it, the Estate registers it. If the Estate registers it, the reading becomes official. The ambiguity dies."

  "That is the function of the Certificate."

  "That is the function of a tombstone," Vane corrected. He leaned forward. "I loved *The Glass Meridian* when I was twenty. It saved me. Not because I understood it, but because I didn't. It held space for me. If I buy this, and I burn it, the intent remains unknown. The book stays alive."

  "The Estate sells truth, Mr. Vane. Not mystery."

  "The Estate sells control," he said. "And you know it's failing. The contradiction between 42 and 43 is already leaking. The market knows. They know Vance changed her mind, or lied, or simply didn't know. You're selling certainty in a product that is fundamentally uncertain. If you open this," he tapped the sleeve, "and it says something mundane, something small... you devalue every copy of the book in existence. You turn a cathedral into a shed."

  "And if I don't open it?"

  "Then you commit fraud. You log a hash you haven't verified. You break the chain of provenance." Vane smiled, but it was a sad expression. "But if you break the chain, the machine stops. And the book breathes again."

  He pushed the incinerator bag toward me. "Buy it back. Or sell it to me with a blind ledger entry. I will pay the premium. I will pay for the silence."

  "I can't do that."

  "Can't you?" Vane stood up. "Look at the numbers, Mr. Thorne. Look at the returns. The universities are returning the Certificates. They say the text is 'compromised.' You are devaluing the asset you are trying to monetize. The more you explain, the less it is worth."

  He left the bag on the table.

  I sat there for an hour. I picked up the sleeve. It was heavy. Inside was a folded piece of paper. On that paper was a sentence written by a dead woman. That sentence had the power to overwrite thirty years of human engagement with her work. It had the power to tell the Meridian Circle they were wrong. It had the power to tell the Dean he was right.

  But it also had the power to make the water just water.

  I thought about the contradiction. Lot 42 and Lot 43. Why had the Estate issued both? Had they not checked? Or had they checked and realized that Vance herself was not a monolith? That her intent was as fluid as the river in the last line?

  If the author is not a god, then the Certificate is a forgery by definition. It claims a unity that does not exist.

  I opened my laptop. The ledger interface glowed blue. *Lot 99: Pending Authentication.*

  There was a field for *Content Hash*. There was a field for *Verification Status*.

  If I opened the envelope, I would see the text. I would generate the hash. I would log it. The sale would proceed. Vane would burn it, but the record would exist in the Estate's server. The official reading would be public. The book would be fixed.

  If I did not open it, I could not generate the hash. I could not complete the sale. Mrs. Gable would fire me. The Estate would sue me. The liquidity would dry up.

  But the book...

  I thought about the Dean's hands wiping his trousers. I thought about the shouting in the Brooklyn community center. They were arguing about what mattered. The Certificate told them what *was*.

  I took a scalpel from my desk drawer. It was used for opening archival sleeves without damaging the contents. I held it over Lot 99.

  The machinery of intention relies on the belief that the source is pure. That the author's hand is the hand of fate. But I held the proof of the contradiction in the other room. I held the proof that Vance was human, that she shifted, that she contradicted.

  To authenticate this certificate was to lie. It was to claim that this specific piece of paper held the final truth, when the file in the vault proved there was no final truth.

  I slid the blade under the polymer seal.

  The sound was a sharp tear. I peeled back the plastic. I slid the cardstock out.

  I did not read it.

  I held it over the incinerator bag Vane had left. The flameless chemical strip inside glowed faintly.

  If I dropped it, the intent would be destroyed. The Certificate would be void. The Estate would claim I lost it. I would be liable for the value. I would be blacklisted from every auction house in the hemisphere.

  If I logged it, I killed the ghost.

  I looked at the ledger on the screen. *Verification Status: Pending.*

  The cursor blinked. It was a rhythmic, mechanical pulse. It demanded input. It demanded I be the conduit between the dead and the living.

  But the conduit was clogged. The contradiction had poisoned the well. If I logged this, I was validating a system that had already proven false. I was validating the idea that a book belongs to its maker, and not to the hands that hold it.

  I thought of the Meridian Circle. They didn't want the answer. They wanted the question.

  I pulled the cardstock closer. I still hadn't read it. I didn't want to know. If I knew, I would be complicit. If I didn't know, I was just a man holding a piece of paper.

  I opened the drawer where I kept the voided stamps. The red ink was thick and permanent. *CANCELLED.*

  I could stamp it. I could mark it as damaged in transit. I could claim a handling error. The value would drop to zero. The Estate would write it off. Vane would walk away. The last line would remain unwritten by the author's hand, and written instead by the thousands of readers who had finished the book and closed it with their own sigh.

  It would cost me my job. It would cost the Estate millions.

  I picked up the stamp.

  The ledger blinked. *Pending.*

  The market relied on scarcity. But meaning relied on abundance. It relied on the multiplicity of readings. The Certificate was a mechanism of scarcity applied to meaning. It was an absurdity. A contradiction in terms.

  I brought the stamp down.

  It didn't hit the paper.

  I stopped. My hand hovered.

  If I cancelled it, I was still making a decision about the book. I was still imposing my will on the text. I was deciding that ambiguity was better than certainty. I was becoming the Author.

  That was the trap. The Estate wanted to be God. Vane wanted to be the Devil, destroying the word to save the spirit. And I was being asked to be the Priest.

  There was no right answer. There was only the machinery, and the moment it jammed.

  I put the stamp down. I put the scalpel down.

  I took the Certificate of Intention, Lot 99, and I placed it back into the polymer sleeve. I did not seal it. I left the flap open.

  I turned to the ledger. I typed into the *Verification Status* box:

  *CONTENT INDETERMINATE.*

  I hit Enter.

  The system flashed red. *ERROR: INVALID STATUS.*

  I typed again. *CONTENT MULTIPLE.*

  *ERROR.*

  I typed: *CONTENT IRRELEVANT.*

  The screen froze. The cursor stopped blinking. The fan in the tower whirred down into silence.

  I had broken the input field. I had forced the binary system to accept a null value.

  I stood up. I took the Certificate, still unsealed, still unread, and I walked out of the viewing room. I walked past Mrs. Gable's office; her door was open, she was on the phone discussing hedges and yields. I walked past the vault where the contradictions of Lots 42 and 43 sat in their climate-controlled boxes.

  I walked out into the rain.

  I held the envelope in my hand. It was getting wet. The ink would run if I didn't protect it. The value would degrade.

  I let it get wet.

  I walked toward the subway, toward the part of the city where the community centers were. I didn't know if the Meridian Circle was meeting tonight. I didn't know if they would take it.

  But as I walked, the weight in my hand felt less like an asset and more like a stone. A stone that could be skipped across the water, or dropped to the bottom.

  The ledger was frozen. The sale was stalled. The official reading was undefined.

  For the first time in six months, the book belonged to no one. And as the rain soaked through the cream-colored cardstock, blurring the edges of the author's name, I realized that was the only way it could ever be worth anything at all.

  I put the envelope in my pocket. I didn't go to the meeting. I didn't go home. I just walked, letting the machinery of the estate spin uselessly behind me, grinding its gears on a blank space I had carved out of the record. The water took the name of the river, and I let it flow.
