answer: |-
  **The position, restated tightly**

  You claim utility is a representation theorem, not a psychological hypothesis. The empirical content of Revealed Preference Theory (RPT) rests entirely on consistency axioms (WARP, GARP) applied to choice data. Crucially, these axioms only test the theory if the *description of the choice situation* (the individuation of goods, budget constraints, and context) is fixed independently of the observed choices. This "Description-Independence" constraint prevents ad hoc re-individuation of options to rescue the theory from violations. You are committed to the view that RPT fails only when the observer's description of the choice architecture is contaminated by the very behavior it aims to predict. Description-independence is not decorative; it is the necessary condition for RPT to be falsifiable rather than tautological.

  **Defeaters, ranked**

  **1. The Psychological Smuggle (Fatal)**
  To satisfy Description-Independence, you must individuate options without looking at choices. But options are individuated by how agents perceive them. If an agent treats "coffee in a mug" and "coffee in a cup" as different goods due to framing, an independent physical description counts this as a violation, while a psychological description counts it as consistency. To fix the description *independently* yet *accurately*, you must already know the agent's subjective perception of the options. This smuggles in the very mental states RPT sought to eliminate. You haven't avoided psychological assumptions; you've just hidden them in the experimental design. If you rely on physical descriptions to maintain independence, the theory is empirically false (due to framing). If you rely on subjective descriptions, you've collapsed into the rival account you rejected.

  **2. Predictive Parity (Severe)**
  You noted your position must buy something. Rivals (e.g., Prospect Theory, psychological utility) predict *systematic* violations of RPT (framing, endowment, loss aversion) ex-ante. Your position offers no positive predictions; it only offers a criterion for when a test is valid. If a subject violates GARP, the rival says "utility is non-linear/loss-averse." You say "the description was likely contaminated." In terms of predictive power, your view is inert. It licenses no new forecasts that psychological models don't already cover, and it explains less, because it treats systematic violations as measurement errors rather than structural features of cognition. If a theory cannot distinguish between a failed model and a bad description better than its rivals, it is theoretically idle.

  **3. Dynamic and Social Contamination (Moderate)**
  In repeated or social settings, Description-Independence is practically impossible. In a money pump scenario, the choice situation changes *because* of the previous choice (the agent is now poorer, or signals a preference). In social games, the "good" includes reputation or fairness, which evolves with play. To maintain independence, you must freeze the context, but the agent's context is inherently dynamic. RPT treats learning or reputation-building as inconsistency. A rival latent-trait account models these as updates to beliefs or preferences. Your view forces you to dismiss vast swathes of economic behavior as "poorly described" rather than structurally complex.

  **4. The Operational Burden (Annoying)**
  This requirement makes testing RPT prohibitively difficult. Verifying that a description is independent requires pre-testing the agent's perception, which usually involves asking them (violating revealed preference) or running pilot studies (which become part of the choice history). It turns a clean mathematical test into a messy psychological audit.

  **Is this just unfalsifiability with extra steps?**

  It risks exactly that. By placing the burden on the *description* rather than the *model*, you create a "No True Scotsman" defense. If GARP is violated, the fallback is always: "The description wasn't truly independent." For this to have teeth, you need a criterion for independence that doesn't rely on the agent's subsequent choices. If you define independence physically (e.g., "same object = same good"), the position is falsifiable but almost certainly false given framing literature. If you define independence phenomenologically ("same perceived value = same good"), it is unfalsifiable because you can always claim the perception shifted.

  However, being insulated isn't necessarily a defect if you view RPT as a normative benchmark rather than a descriptive law. If your claim is that *rational* agents maximize utility under *correct* descriptions, then insulation is appropriate. But if you claim this describes actual market behavior, the insulation renders the theory vacuous. You are protecting the logic of rationality at the cost of its application. The position survives only if you accept it as a methodological rule for experimenters, not a truth claim about agents.

  **What my side would concede**

  A sympathetic defender would concede that physical description is insufficient; the "choice situation" must include the agent's subjective frame to satisfy independence. They would admit that in cases of severe framing or ambiguity, RPT is the wrong tool for prediction, ceding ground to behavioral models. However, they would wave off the charge of unfalsifiability by arguing that Description-Independence is a *regulative ideal*. They would argue that when violations occur, the scientific duty is to refine the description (e.g., distinguishing "money now" from "money later") until consistency is restored or the cost of description outweighs the benefit. They accept that RPT may not predict better than psychology, but insist it remains the only coherent definition of *rationality* itself.

  **Bottom line**

  The position survives as a logical clarification but fails as an empirical shield. It correctly identifies that RPT tests depend on option individuation, but it cannot solve the individuation problem without importing psychological assumptions. The single thing you should be most nervous about is **Predictive Parity**: if your view explains violations as description errors while rivals explain them as structural phenomena, your position buys no explanatory power. It protects the theorem by rendering it silent on the data.
