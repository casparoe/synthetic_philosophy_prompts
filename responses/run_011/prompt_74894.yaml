answer: |-
  Good evening. I am here for the pretzels. Like many of my classmates, I am also here for the credit. But I am also here because I am seventeen, I was baptised Catholic, and I am still on the books. I have a Saturday job. Soon, I will owe this tax myself.

  I want to talk about how we leave things.

  My social studies teacher made us read one chapter of a book by an economist named Albert Hirschman. It is called *Exit, Voice, and Loyalty*. The argument is simple. When an organization you belong to starts going bad, you have two choices. You can leave. Hirschman calls this Exit. Or you can stay and make a fuss. He calls this Voice.

  Which one you pick depends on two things. It depends on how cheap it is to leave. And it depends on Loyalty. Loyalty is what makes you stay and fight instead of walking away. Hirschman says cheap exit smothers voice. If quitting is easy, nobody bothers to fix the thing.

  This system we have is very cheap exit. It is not a donation. The state tax office collects it on behalf of religious communities. It is a surcharge on your income tax. Here in Baden-Württemberg, it is 8 percent. It pays for clergy salaries, buildings, kindergartens, and old people's homes.

  To stop paying, you do not talk to the church. You declare it to a state office. There is no separate form for "still a believer, just not funding the institution." The membership data sits with the tax authorities. Your employer withholds accordingly. Some churches will then refuse you a wedding or a funeral.

  So exit is one page long. It is basically free. But it is total. It is a switch, not a dial.

  For the American guests here: this is not the state funding religion. The state is just the cashier. The money belongs to the members. But for the Humanists here: a voluntary system is not automatically cleaner.

  Surveys of people who left put saving the tax near the top of their reasons. But a study done for the bishops found the tax is usually just the trigger, not the cause. The real grievances are older. That is the Hirschman thing exactly. Exit is the mechanism that turns years of slow unhappiness into one dated act.

  In Italy and Spain, it works differently. You tick a box on your tax return. A slice goes to a church or to state social purposes. Ticking it has nothing to do with whether you're a member. That is neither exit nor voice. It is a third thing. It might be quieter. It might not be better.

  Some smaller free churches here are legally allowed to collect this tax. They refuse on principle. They live off donations instead. That is a real-world test.

  In a donation-funded church, leaving is quiet. You give less. Then you give nothing. Nobody ever counts it. With the church tax, the departure is a form. It is a date. It is a number in the annual statistics that the church cannot pretend not to see.

  So maybe a legally cheap exit is more informative than a voluntary system's silent one.

  I am on the side that thinks it is strange for a government to keep a list of who belongs to God. But I will concede this. The certainty of this income allows the church to plan. It can run kindergartens and homes reliably. Donations fluctuate. This system forces a clear decision. You cannot just drift away. You must choose.

  But this brings us to the problem. If exit is this cheap, does loyalty matter anymore? If the state makes leaving easy, do we lose the voice that fixes the institution?

  Surveys say people leave for money. But if the exit is formal, the church sees the loss clearly. In a donation system, the loss is hidden in the noise of the economy. Here, the loss is a statistic.

  So I have one question for the panel. It comes from Hirschman.

  If the state makes exit cheap and formal, does it destroy the loyalty needed for voice? Or does it make the decline visible enough to force a response? And if the state handles the exit, is the system still neutral when the price of admission is that the government keeps a register of your members?

  Thank you.

  ***

  **Note on the "Informative Exit" Argument**

  You asked me to pressure-test this honestly. Here is the risk: You argue that formal exit is *more* informative than silent donation drops because it creates a hard number (a person leaving) rather than a soft number (revenue down).

  This survives the "it's about money" counter-argument only because of the fact you provided: the bishops' study says the tax is the *trigger*, not the *cause*. If people leave solely because they are broke, the statistic tells you nothing about church reform. But if the tax is just the excuse for older grievances, the formal exit *does* signal a deeper failure.

  However, in a donation system, a revenue drop is also informative if you analyze it correctly. The advantage of the tax system isn't necessarily that the data is *better*, but that it is *unavoidable*. A church can ignore a dip in donation envelopes and blame the economy. They cannot ignore a spike in state-registered exits. The form forces them to look.

  So the argument holds, but with a caveat: The exit is only informative if the church accepts the Hirschman premise that the tax is a trigger for deeper issues. If they believe the leavers are just cheap, the statistic changes nothing. The form creates visibility, but not necessarily understanding.
