answer: |-
  The flashlight beam cuts through the dust motes hanging in the crawlspace opening. It's 4:20 PM. The letter says 5 PM. Nadia holds her phone over the hatch, thumb hovering over the banking app. Ray stands beside her, arms crossed, looking at the foundation instead of her.

  "You know," Ray says, "if you send that thousand, you're buying me a twenty-thousand-dollar repair. But you're not buying yourself anything. My decision is made. I'm not wiring. So your house is already toast."

  "I know," Nadia says. She doesn't look up. "The letter was clear. My house depends on your simulation. Yours depends on mine. Since you're out, I'm out. But if I pay, your house is safe."

  "And why would you do that?" Ray asks. "The money doesn't go to the exterminator. Omega already settled the arrangements last night based on the simulations. Wiring now changes nothing physical. It's just burning cash to match a prediction that's already locked in."

  "It's not about changing the past," Nadia says. "It's about what the prediction *was*. The simulation ran my decision procedure. If I decide to pay now, that means my procedure outputs 'pay.' Which means the simulation output 'pay.' Which means Omega treated your house."

  "That's the trick," Ray says. "You're treating your current decision like it causes the simulation result. It doesn't. The simulation happened yesterday. You're just finding out what you are now. If you're the kind of person who burns money to match a past event, fine, but don't pretend it's strategy. It's just loss."

  "But if I don't pay," Nadia says, finally looking at him, "then I'm confirming that I'm the kind of person who doesn't pay in Omega scenarios. And if I'm that kind of person, the simulation knew that yesterday. So I'm not just losing a thousand now; I'm admitting I lost the twenty thousand yesterday because I'm the type who loses it."

  Ray kicks at a loose stone on the driveway. "See, that's where the story breaks. In the classics, you're paying your counterfactual self. You pay so that *you* get the reward in the other branch. Here? The coin came up heads. We're in the bad branch. And the person benefiting from your payment isn't you, and it isn't even your counterfactual self. It's me. I'm a random guy drawn from property records. I'm not running your code."

  "So?" Nadia says. "The logic should hold. Omega rewards agents who pay. It doesn't matter who gets the treatment, it matters that the agent type is 'Payer.' If I want to be the kind of agent Omega rewards, I pay."

  "You want to be the kind of agent Omega rewards," Ray corrects, "but Omega isn't coming back. There's no second round. The letter says it explicitly. So you're not building a reputation. You're not incentivizing future predictions. You're just performing a ritual. If you pay, you're not being rational; you're doing charity with extra steps. You're giving me twenty grand worth of value for a thousand bucks of yours. Just write me a check if you want to help. Don't hide behind Omega."

  "It's not charity," Nadia insists. "Charity is optional. This is... structural. If I refuse because 'the money doesn't cause the treatment,' then I'm admitting that evidence doesn't matter. But it does matter. My paying is evidence that the simulation predicted I would pay. If I refuse, I'm making it true that the simulation predicted I would refuse. I'm making it true that your house isn't treated."

  "You're making it true that I knew you'd refuse," Ray says. "Look, I own this. My house depends on your wire. I am telling you, right now, do not send it. I would rather live with termites than have you burn cash on a ghost. If you pay, you're saying that knowing the setup changes what you should do. But the setup is fixed. The coin is heads. The simulations are done. The only thing left is who loses money. Why should you lose yours to save me, when you can't save yourself?"

  "Because if I don't," Nadia says, "then the Termite Letter logic applies. In the Termite Letter, you pay to make the letter false. Here, I pay to make the prediction true. It's the same structure. The coin flip is just noise."

  "No, the coin flip is the point," Ray says. "In the Termite Letter, the letter exists only if there's a logical mismatch. Here, the letter exists because the coin came up heads. The termites are real. The damage is real. The only thing imaginary is the link between your phone and the exterminator. You're trying to treat this like the Termite Letter, where paying changes the truth value of the message. But the message is already true. The coin is heads. The termites are here. Paying doesn't make the coin tails. It just makes you poorer."

  "But the treatment isn't about the coin," Nadia says. "It's about the simulation. If I pay, I align with the simulation that saves your house. If I don't, I align with the one that doesn't. You're saying I should ignore the alignment because the physical causality is broken. But decision theory isn't just physics. It's about how you navigate situations where your decision is predicted."

  "And I'm saying," Ray says, leaning against the siding, "that when the beneficiary is a stranger, the 'navigate' part disappears. You're not navigating a trap for yourself. You're walking into a fire to warm someone else up. If you want to do that, own it. Call it altruism. Don't call it rationality. Rationality says keep your thousand. The house is already lost. The simulation is already run. You're just lighting money on fire to match a shadow."

  Nadia lowers the phone slightly. "So you think the whole thing is a trick played by evidence. That knowing the prediction makes me think I can influence it."

  "I think knowing the prediction makes you think you have leverage," Ray says. "You don't. You have a choice between losing a thousand or keeping it. The twenty thousand damage is already done to your house because I'm not paying. The only thing your money affects is my house. And I'm telling you, I'd rather you keep the cash."

  "But that's because you're looking at it causally," Nadia says. "If everyone thought like you, Omega would predict everyone refuses, and everyone gets termites. If everyone thinks like me, Omega predicts everyone pays, and everyone gets treated. I'm voting for the world where people pay."

  "We're not in a world where everyone pays," Ray says. "We're in this driveway. It's just you and me. And I'm not paying. So your vote doesn't matter. You're just paying for a policy that nobody else is following. That's not principle. That's suckerhood."

  "It's consistency," Nadia says. "If I say I'm the kind of person who pays Omega, I have to pay Omega. Even when it's hard. Even when it helps you instead of me."

  "Then you're not a decision theorist," Ray says. "You're a martyr. Look, here's where we stick. You think you have to pay to remain consistent with the algorithm Omega simulated. I think the algorithm is irrelevant because the output is already fixed. To change my mind, you'd have to convince me that your action right now changes what happened in the simulation yesterday. Not evidence, not correlation. Actual influence. If you can't show me how pressing 'send' reaches back in time, you're just donating."

  Nadia locks her phone screen but doesn't put it away. "And to change my mind, you'd have to concede that being the kind of agent who pays has value even when there's no future payoff. You'd have to admit that walking away makes me the kind of agent who loses in Omega scenarios, and that's a cost heavier than a thousand dollars. If you can't admit that consistency matters more than the cash, then you're just saying might makes right."

  "Consistency matters," Ray says. "But not when it's just you pretending to be a machine. You're a person. Keep the money."

  "And you're a person with termites," Nadia says. "I'm hitting send."

  "Don't," Ray says.

  She hits send. The screen spins. Ray watches the hatch, shaking his head.

  "To change my mind," Nadia says, putting the phone in her pocket, "you'd have to concede that there's such a thing as a rational choice that doesn't change the physical state of the world. That choosing the right output matters even if the machine already ran."

  "And to change mine," Ray says, turning off the flashlight, "you'd have to concede that if the money doesn't fix the problem, spending it doesn't fix anything either. That you're allowed to keep your cash when the game is already over."

  "The game isn't over," Nadia says. "We're still playing."

  "We're just cleaning up," Ray says. "Let's go inside."
