answer: |-
  The Needham Question is unsolvable by evidence alone because it conceals a disagreement about which contrast class defines the problem, turning a conceptual framing error into a purported factual dispute. Explanation is inherently contrastive: to explain why P happened is to explain why P happened rather than Q. When historians argue over the Great Divergence, they treat the explanandum as fixed—British industrialisation—but they silently swap the contrast class. If the contrast is Britain versus Qing China as a whole, coal geography and imperial extraction become the salient causes because they differentiate the aggregate entities. If the contrast is Britain versus the Yangzi Delta, the divergence either vanishes or shifts back to agricultural productivity and wages, rendering coal irrelevant. If the contrast is Britain versus the Dutch Republic, the explanandum shifts from British exceptionalism to European exceptionalism, making institutions or culture the primary cause while geography recedes. Because each contrast selects different causal factors as relevant, historians are not measuring the same thing; they are answering different questions while pretending to measure the same variable. Consequently, new data on wages or output cannot settle the debate, because the disagreement is not about the magnitude of the data but about which dataset constitutes the relevant foil.

  The first objection claims that choosing a contrast is merely a pragmatic matter of phrasing, implying that the underlying reality remains unchanged and substantive conclusions still hold. This fails because causal selection is not independent of the contrast class; the cause of an event is defined by what it is being contrasted against. In a fire investigation, the cause is the match if contrasting against a normal room, but oxygen if contrasting against a vacuum; neither is "merely pragmatic" because each identifies a necessary condition relative to the specific foil. Similarly, identifying coal as the cause of industrialisation is only true relative to a contrast where coal is absent but other factors are held constant. If the contrast changes to a region with coal but no industry, coal ceases to be the explanation. Therefore, the choice of contrast dictates the ontology of the explanation, making it a substantive metaphysical commitment rather than a linguistic convenience.

  The second objection argues that if this critique holds, every open-ended historical question becomes ill-posed, which proves too much and undermines historical inquiry entirely. This objection fails because it conflates unstable contrasts with contrastive explanation itself. Most historical questions have implicit contrasts fixed by context and consensus, such as "Why did the war start?" which implies "rather than continue peace." The Needham Question is pathological not because it is contrastive, but because the term "China" is too heterogeneous to function as a stable foil without further specification, allowing scholars to slide between provinces, dynasties, and aggregates without acknowledgement. Historical inquiry survives because most questions operate within agreed-upon contrast classes, whereas this specific debate suffers from a lack of agreement on the foil itself.

  The position survives both objections. It withstands the pragmatic objection by demonstrating that contrast selection determines causal relevance, and it withstands the sceptical objection by showing that the problem lies in the vagueness of this specific contrast rather than the logic of historical explanation generally.
