answer: |-
  ### Session Plan: The Ontology of the Brushstroke

  **Total Time:** 90 Minutes
  **Core Thesis:** A painting is not an image; it is a fossilized record of a specific cognitive process (decisions under uncertainty).

  ---

  ### I. The Single Case Study
  **Recommendation:** Do **not** use the reattribution (Master $\to$ Workshop).
  **Reasoning:** While it removes the moral issue, it quietly changes the subject from *ontology* (what the object *is*) to *hierarchy* (who is more skilled). Reattributions usually occur because experts *did* distinguish visual differences (pentimenti, style drift), which undermines your premise that "nobody can distinguish." Furthermore, a workshop assistant executing a design is not making "decisions under uncertainty"; they are following instructions.
  **The Right Choice:** A **scientifically confirmed forgery** where the visual match is near-perfect (e.g., a Han van Meegeren Vermeer or a specific modern forensic discovery).
  **Why:** It is the only case that satisfies your premise ("nobody can distinguish") while forcing the distinction between *generating* a solution (Original) and *replicating* a solution (Copy).
  **Constraints on the Case:**
  *   **Must Have:** Proof that the visual appearance is indistinguishable to the naked eye (to block the "I can see the difference" escape route).
  *   **Must Not Have:** Ambiguity about the intent to deceive (to allow you to explicitly bracket the morality as a separate issue).
  *   **Protocol:** You must explicitly state at the outset: "For this hour, the fraud is irrelevant. We are not discussing the crime; we are discussing the paint."

  ---

  ### II. Sequence and Dependencies
  *You cannot introduce the core concept until the guides accept the prerequisite premises. The order is rigid.*

  **1. The Limit of Vision (0:00–0:15)**
  *   **Goal:** Establish that looking is not knowing.
  *   **Dependency:** None. This is the foundation.
  *   **Activity:** Show two identical objects (e.g., a 3D-printed replica of a sculpture vs. the carved original, or audio clips of a live violin vs. a perfect digital sample). Ask: "Are these the same experience?"
  *   **Critical Move:** Do not mention art yet. Establish that *history of production* changes the *nature of the object* even if the *sensory input* is identical.
  *   **Head Off Confusion #1:** *"If you can't see the difference there is no difference."*
      *   **Intervention Point:** End of this segment.
      *   **Tactic:** Do not argue aesthetics yet. Argue physics. "If I hand you a diamond and a cubic zirconia, and you cannot see the difference, do you have the same object? No. One is carbon under pressure; the other is glass. The history is part of the object's identity."

  **2. The Case Study: The Perfect Match (0:15–0:45)**
  *   **Goal:** Apply the "Limit of Vision" to the specific forgery case.
  *   **Dependency:** Requires acceptance that history matters (from Segment 1).
  *   **Activity:** Present the forgery and the original side-by-side (images). Reveal the provenance.
  *   **Critical Move:** Isolate the *process*. Describe the Original Artist's struggle (uncertainty, risk, tradition) vs. the Forger's process (calculation, replication, risk of capture).
  *   **Head Off Confusion #2:** *"So you're saying the forger is less talented."*
      *   **Intervention Point:** Mid-case analysis, when discussing the forger's technical skill.
      *   **Tactic:** Reframe talent. "The forger may have superior *control*, but the original artist exercised *judgment*. We value the judgment, not just the control. A tightrope walker who uses a safety net is not a tightrope walker."

  **3. The Theory: Decisions Under Uncertainty (0:45–1:05)**
  *   **Goal:** Formalize the aesthetic claim.
  *   **Dependency:** Requires the Case Study to have landed (Segment 2).
  *   **Activity:** Lecture/Discussion on the "Surface as Record." Explain that a brushstroke is a frozen moment of choice. In the original, the choice was "What goes here?" In the copy, the choice was "What went there before?"
  *   **Critical Move:** Emphasize *Uncertainty*. The original artist did not know how the stroke would land; the copyist knew exactly where it must go. This makes the copy a *different kind of achievement*, not just a lesser one.

  **4. Objection Handling & Application (1:05–1:20)**
  *   **Goal:** Stress-test the concept against gallery realities.
  *   **Dependency:** Requires the Theory to be understood (Segment 3).
  *   **Activity:** Roleplay visitor questions.
  *   **Head Off Confusion #3:** *"The museum only cares about signatures/money."*
      *   **Intervention Point:** Start of this segment.
      *   **Tactic:** Use the prepared pushback (see below).
  *   **Thing to Decline:** **Market Value.**
      *   **Instruction:** Openly state: "We will not discuss price. A painting's financial worth is a consequence of its ontology, not the definition of it. If this idea is true, the original is more valuable aesthetically even if it were worth less money."

  **5. Assessment (1:20–1:30)**
  *   **Goal:** Verify conceptual uptake.
  *   **Dependency:** All prior segments.
  *   **Activity:** Silent reflection followed by the closing question.

  ---

  ### III. Mapping the Confusions
  *These will surface in a predictable order. You must intercept them at the exact points noted above.*

  1.  **"If I can't see the difference, the difference doesn't matter." (Visualism)**
      *   **Surfaces:** Immediately, during the intro.
      *   **Fix:** Segment 1 (The Limit of Vision). Use non-art analogies (diamond/zirconia, live music/recording) to bypass their defensive attachment to "Art."
  2.  **"The forger is actually more talented/hardworking." (Skill Confusion)**
      *   **Surfaces:** During the Case Study, when admiring the forgery's quality.
      *   **Fix:** Segment 2 (The Case Study). Distinguish between *technical execution* (hand) and *generative invention* (mind).
  3.  **"This is just about protecting the brand/signature." (Cynicism)**
      *   **Surfaces:** During Objection Handling, when discussing museum policy.
      *   **Fix:** Segment 4 (Objection Handling). Use the pushback sentence.

  ---

  ### IV. Required Scripts & Outputs

  **The Pushback Sentence**
  > "We do not protect the signature to protect the price; we protect the signature because it is the only label we have for a unique human encounter that cannot be repeated."

  **The Thing to Decline**
  > **Financial Valuation.** (Make it clear that aesthetic value and market value are correlated but distinct categories; do not let the session devolve into a discussion of auction houses).

  **The Assessment Question**
  > "If I could guarantee you that no visitor would ever know the difference, would *you* still prefer to hang the original, and can you articulate why without using the words 'fake' or 'real'?"

  *(This question tests if they have internalized the ontological difference. If they rely on the words 'fake' or 'real', they are relying on labels, not the concept of 'decisions under uncertainty'. If they say 'yes' but cannot explain why, the idea has not landed.)*
