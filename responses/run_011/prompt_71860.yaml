      *   **Tone:** Analytical, decisive, thoughtful, not splitting the difference down the middle.
      *   **Context:** City utility wants to build in an unincorporated pocket. City voters decide. Pocket residents suffer consequences but have no vote. Amir argues for inclusion (all affected principle). Bea argues for the boundary problem (who decides the boundary?) and potential tyranny of the external majority.

  2.  **Deconstruct the Argument (Amir vs. Bea):**
      *   *Core Issue:* The Boundary Problem (who constitutes the demos?).
      *   *Amir's Stance:* All Affected Principle (AAP). Exclusion is illegitimate coercion. Solution: Widen the franchise or use a two-step process to define the franchise. Default to the widest circle.
      *   *Bea's Stance:* The Paradox of Foundation. You need a demos to decide the demos. Widening creates new illegitimacies (external control over internal resources). Solution: Veto/Compensation/Administrative appeal, not franchise expansion.

  3.  **Step 1: Brainstorming (Conditions for Truth & Counter-arguments):**
      *   *Move 1 (Amir):* Needs AAP to be the supreme norm. Counter: AAP is too broad (everyone is affected by everything).
      *   *Move 2 (Bea):* Needs the boundary decision to be logically prior to voting. Counter: Constitutions/Charters already exist; we aren't starting from scratch.
      *   *Move 3 (Amir):* Needs a meta-vote to be stable. Counter: Who votes on the meta-vote? (Regress).
      *   *Move 4 (Bea):* Needs "affected" to be infinitely expandable. Counter: Causality diminishes; we can set thresholds.
      *   *Move 5 (Amir):* Needs a defensible default rule (widest vs. narrowest). Counter: "Widest" is arbitrary too and dilutes stake.
      *   *Move 6 (Bea):* Needs to distinguish between *suffering harm* and *controlling assets*. Counter: Harm justifies control; property rights aren't absolute against externalities.
