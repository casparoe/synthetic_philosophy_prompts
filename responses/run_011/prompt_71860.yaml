      *Let's refine the "What's Missing".* They are treating the city as a sovereign demos. It isn't. It's a municipal corporation. The "boundary" is a matter of state statute, not democratic theory. The remedy is not a vote, it's a lawsuit or a state mandate. Also, they miss the distinction between *input* legitimacy (voting) and *output* legitimacy (fair outcomes/compensation). Bea hints at compensation, but dismisses it as "boundary decisions." She's wrong there; compensation is a rights-based remedy, not a boundary one. I'll focus on the *Legal vs. Democratic* distinction.

      *Wait, one more thing:* The "All Affected Principle" (Amir) vs. "All Subjected Principle" (Amir implies this, Bea attacks it). Actually, Amir says "subject to a decision." That's the All-Subjected Principle (ASP). AAP is "affected." ASP is stricter. Amir conflates them. Bea attacks the AAP version ("smell carries"). I should note this conflation.

