  Here is a two-player case designed to fit on one slide, demonstrating how Common Knowledge (Scenario A) can yield a Pareto-inferior outcome compared to Mutual Knowledge (Scenario B).

  ### The Case: The Broken Vase

  **Players:** Two Roommates ($P_1, P_2$).
  **State of World ($\omega$):** The Vase is Broken (True). (Counterfactual: Intact).
  **Actions:** Confess ($C$) or Hide ($H$).
  **Payoffs:** Material rewards plus a psychological "Complicity Cost."

  | $P_1 \setminus P_2$ | Confess ($C$) | Hide ($H$) |
  | :--- | :---: | :---: |
  | **Confess ($C$)** | $0, 0$ | $-5, 5$ |
  | **Hide ($H$)** | $5, -5$ | $V_{HH}, V_{HH}$ |

  *   **Material Payoffs:** If both Hide, they keep the deposit ($5$). If both Confess, they split the fine ($0$). If mismatch, the Hider keeps the deposit ($5$) and the Confessor takes the blame ($-5$).
  *   **Complicity Cost:** If **both Hide** AND it is **Common Knowledge** that the vase is broken, each suffers a psychological cost of $10$ (guilt of shared conspiracy).
      *   $V_{HH} = 5 - 10 = -5$ in Scenario A.
      *   $V_{HH} = 5 - 0 = 5$ in Scenario B.

  **The Source:** A truthful landlord sends a message: "The vase is broken."
  *   **Scenario A (Public):** Sent in the group chat. (Common Knowledge).
  *   **Scenario B (Private):** Sent via separate DMs with read receipts off. (Mutual Knowledge: Both know $\omega$, but $P_1$ doesn't know $P_2$ knows $\omega$).

  ---

  ### 1. The Chain of Belief

  **Scenario A (Public / Common Knowledge)**
  1.  **Level 1:** $P_1$ knows $\omega$. $P_1$ knows $P_2$ knows $\omega$.
  2.  **Level 2:** $P_1$ knows $P_2$ knows $P_1$ knows $\omega$.
  3.  **Inference:** $P_1$ reasons: "We both know. If we both Hide, we are conspirators. The Complicity Cost activates."
  4.  **Payoff Calculation:** $P_1$ sees $(H,H)$ yields $-5$. $(C,C)$ yields $0$.
  5.  **Dominance:** In this matrix, $C$ strictly dominates $H$ ($0 > -5$ if $P_2=C$; $-5 > -10$ [wait, $C$ vs $H$ is $-5$ vs $5$? No.]).
      *   *Correction for Dominance:* Let's refine the matrix for strict dominance in A.
      *   If $P_2=C$: $P_1$ gets $0$ ($C$) vs $5$ ($H$). $H$ is better.
      *   If $P_2=H$: $P_1$ gets $-5$ ($C$) vs $-5$ ($H$). Indifferent.
      *   *Fix:* To ensure Unique Outcome in A, we need $C$ to be dominant.
      *   *Revised Payoff:* If Mismatch, Confessor gets $-2$ (Unfair blame), Hider gets $5$.
      *   If Both Hide (CK): $-5$.
      *   If Both Confess: $0$.
      *   *Check A:* If $P_2=C$: $0 (C) > 5 (H)$? No.
      *   *Okay, I need (C,C) to be the Unique NE.*
      *   Let's make $(H,H)$ strictly worse than $(C,C)$ and $(C,H)$.
      *   **Final Payoff Matrix (State $\omega$):**
          *   $(C,C) \to 0, 0$
          *   $(H,H) \to -5, -5$ (Only in CK) / $5, 5$ (In MK)
          *   $(C,H) \to 2, -5$ (Confessor looks honest but pays fine? No, Confessor gets 2, Hider -5).
          *   $(H,C) \to -5, 2$
      *   **Scenario A (CK):**
          *   If $P_2=C$: $P_1$ gets $0 (C)$ vs $-5 (H)$. **$C$ Better.**
          *   If $P_2=H$: $P_1$ gets $2 (C)$ vs $-5 (H)$. **$C$ Better.**
          *   **Result:** $C$ is Strictly Dominant. Unique Outcome: $(C,C)$. Payoff: **0**.
      *   **Scenario B (MK):**
          *   $P_1$ knows $\omega$. $P_1$ thinks $P_2$ might not know (Probability $q$).
          *   If $P_2$ doesn't know, $P_2$ plays $H$ (Default).
          *   $P_1$ calculates Expected Utility of $H$: $q(5) + (1-q)(-5)$.
          *   $P_1$ calculates Expected Utility of $C$: $q(2) + (1-q)(0)$.
          *   If $q$ is high enough (likely $P_2$ knows), $H$ is better.
          *   **Result:** $(H,H)$ is the Risk-Dominant Equilibrium. Unique Outcome (via selection): $(H,H)$. Payoff: **5**.

  **Scenario B (Private / Mutual Knowledge)**
  1.  **Level 1:** $P_1$ knows $\omega$.
  2.  **Level 2 (Missing):** $P_1$ **does not know** that $P_2$ knows $\omega$.
  3.  **Inference:** $P_1$ reasons: "I know it's broken. But $P_2$ might think it's intact. If $P_2$ thinks intact, $P_2$ will Hide."
  4.  **Complicity:** Since $P_1$ isn't *certain* $P_2$ knows, the "Shared Conspiracy" condition is not met. The Complicity Cost is $0$.
  5.  **Payoff Calculation:** $(H,H)$ yields $5$. $(C,C)$ yields $0$.
  6.  **Missing Link:** The chain stops at Level 1. $P_1$ cannot infer that $P_2$ is forced to Confess. $P_1$ plays $H$ to match $P_2$'s likely $H$.

  ### 2. Uniqueness Checks

  *   **Scenario A:** Outcome $(C,C)$ is unique because $C$ is a **Strictly Dominant Strategy** once the Complicity Cost activates. $(H,H)$ is eliminated because $-5 < 0$ and $-5 < 2$.
  *   **Scenario B:** The game is a Coordination Game (Stag Hunt) with two Nash Equilibria: $(H,H)$ and $(C,C)$.
      *   **Selection Principle:** **Risk Dominance** (Harsanyi & Selten).
      *   **Defense:** $(H,H)$ has a larger "basin of attraction." If $P_1$ has *any* doubt about $P_2$'s knowledge (which is the definition of Scenario B), $H$ becomes the secure best-response. $(C,C)$ requires certainty of coordination which MK does not provide.

  ### 3. The Load-Bearing Feature

  *   **Feature:** The **Complicity Cost** (Psychological Payoff) that activates *only* under Common Knowledge.
  *   **If Removed:** If payoffs are purely material ($V_{HH}=5$ in both cases), Scenario A becomes a Stag Hunt just like Scenario B. Both would likely coordinate on $(H,H)$ (Payoff 5), and Public Information would no longer be worse. The harm comes specifically from the *shared awareness* enabling the guilt.

  ### 4. The Attack & Defense

  *   **Attack:** "You cheated by making utility depend on knowledge states. Standard game theory assumes payoffs depend only on actions and world states. If you fix the payoff matrix, CK cannot hurt."
  *   **Defense:** "Utility represents preference satisfaction. 'Guilt' is a real cost that logically requires Common Knowledge (you can't feel complicit if you think the other is innocent). Excluding epistemic states from utility functions arbitrarily restricts the model of human rationality. In Psychological Game Theory (Geanakoplos et al.), this is a standard feature, not a bug."

  ### 5. Constraint Weakening

  *   **Weakened Constraint:** **"Explicit payoff matrix for each state."**
  *   **Why:** To make the outcome unique and strictly worse in A without relying on arbitrary focal points, I allowed the payoff matrix to depend on the *epistemic state* (CK vs MK) in addition to the physical state ($\omega$).
  *   **Reason:** In a standard static game with fixed material payoffs, CK typically *solves* coordination problems (making outcomes better). To make CK *worse*, the mechanism must be that CK enables a specific negative interaction (like complicity or a run) that MK prevents. This requires the "cost" of the action to be contingent on the knowledge structure. Without this, you cannot generate the unique Pareto-inferior outcome in A without smuggling in focal points or infinite type spaces.
