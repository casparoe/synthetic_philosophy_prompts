answer: |-
  1. The single sentence carrying the content is: "Empirical equivalence is never a binary relation between two free-standing bodies of doctrine." If deleted, §2 becomes a descriptive taxonomy of how trivial rivals are constructed (conjunction vs. negation) without offering a principled reason why one construction should count as substantive and the other not. The section would then rely entirely on the intuition that "back-fitting" is cheap, without locating the logical error in the triviality result itself. The migration lemma adds value only if "partition" is more than a synonym for "what we currently believe." If partition is merely subjective or community-relative, the lemma restates Lakatosian protective belts without solving the logical problem of equivalence.

  2. The distinction is real but undermined by your own criteria. Lakatos assesses whether a program is progressing over time; you assess whether a rival is admissible now. However, clause (ii) (Non-derivation) is inherently diachronic. You cannot determine synchronically whether auxiliaries were "back-fitted" or "articulated independently" without historical data about the order of discovery. Therefore, (ii) contradicts your claim of synchronicity. Furthermore, (i) does almost all the work. If a core licenses distinct auxiliary moves (i), it follows almost automatically that it was not merely back-fitted to existing data (ii) and that it survives migration (iii). Clauses (ii) and (iii) function as rhetorical safeguards against the charge of subjectivity rather than independent logical conditions.

  3. Demoting the Newtonian/neo-Newtonian pair is defensible only if your goal is to identify competing *research programs*, not competing *ontologies*. If the goal is the latter, the criterion is miscalibrated. Neo-Newtonian spacetime is often preferred precisely because it lacks the heuristic potential to measure absolute velocity; that lack is a virtue, not a failure of rivalry. By classifying ontological parsimony as parasitic, you risk defining "genuine rival" as "theory with surplus structure capable of generating errors." A better test case would be Bohmian mechanics versus standard quantum mechanics. Bohmian mechanics adds structure (trajectories) and licenses distinct heuristics (numerical simulation of paths), yet remains empirically equivalent in non-relativistic domains. Your criterion should classify this as genuine; if it does not, the criterion is too narrow. If it does, you must explain why adding structure counts as rivalry while deleting it (neo-Newton) does not.

  4. 
  *   **Duhem:** Accurate. No departure.
  *   **Quine:** Departure. Quine's reconstrual of predicates is intended to dissolve ontological commitment by showing two theories are notational variants of the same underlying logic. You treat it as shifting partitions within a rivalry. Quine argues the rivalry is illusory; you argue the rivalry was ill-defined. The outcome is similar, but the mechanism differs.
  *   **Constructive Empiricism:** Accurate gloss of the position, though your critique assumes the empiricist cannot fix partitions by stipulation. Van Fraassen might accept stipulation as part of the pragmatic choice.
  *   **Unconceived Alternatives:** Departure. The standard argument relies on historical induction about the *existence* of alternatives. You add a constraint on the *availability* based on heuristics. This narrows the scope of the argument significantly, potentially insulating current theories from the critique by labeling unconceived rivals as "parasitic" until conceived.
  *   **Uncertainty:** I am uncertain whether Quine would accept "partition-shifting" as a faithful reconstruction of predicate reconstrual, as Quine often targets the analytic/synthetic distinction itself rather than core/auxiliary boundaries.

  5. Worry (b) is more damaging. If the criterion can dismiss any successful rival as a parasite post-hoc, it is unfalsifiable and therefore philosophically inert. Worry (a) is metaphysical; worry (b) is methodological. A criterion that cannot be applied without knowing the future success of the rival is useless for guiding belief or assessing current theory choice. Regarding (a): grounding licenses in the "structure of the doctrine" is possible only if structure dictates heuristic potential. Mathematical symmetry groups, for example, constrain possible couplings. If you can tie "licenses" to formal constraints rather than community dispositions, (a) is solvable. If not, §3 collapses into sociology, and the logical force of the partition dependence thesis is lost.

  6. Cut the paragraph on Quine in §4. It is the weakest link, relying on interpretive exegesis that distracts from your positive account. Soften the verdict on Newtonian spacetime in §3; present it as a tension your criterion reveals rather than a definitive classification, acknowledging that realists may view ontological simplification as a form of competition. The sentence that overclaims is: "The triviality result is a corollary of this lemma." You have not proven the lemma formally; you have motivated it intuitively. Change "is a corollary" to "suggests the triviality result is best understood as."

  The load-bearing concept of "partition" remains under-defined throughout the draft. You describe it as picking out a core and an auxiliary set, but you do not specify what constrains a partition other than "what the doctrine licenses." If the doctrine licenses the partition, and the partition defines the equivalence, you risk circularity. A partition needs independent criteria—for example, formal derivability, historical commitment, or semantic weight—otherwise, "partition dependence" is merely the claim that equivalence depends on what we decide to hold fixed. If that decision is arbitrary, the equivalence relation is arbitrary. If it is not arbitrary, you owe an account of the constraints, which §5(a) admits you lack. This is the central vulnerability of the paper.
