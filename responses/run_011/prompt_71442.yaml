answer: |-
  First, your factual grasp is solid. The European Union Referendum Act 2015 largely imported the General Election franchise, added Peers and Gibraltar, and kept the 15-year rule for expats. The exclusion of resident EU nationals (non-Commonwealth/Irish), 16–17-year-olds, and Crown Dependency citizens is accurate. The advisory legal status vs. political promise is also correct. I'll proceed on these facts.

  ### 1. Brainstorming Pass: Accounts vs. Rules

  Here is a rough scoring of the 2016 franchise rules against standard boundary accounts. (+ = fits, - = conflicts, 0 = ambiguous)

  *   **All-Affected Interests (Goodin):** Anyone whose interests are significantly impacted.
      *   *Resident EU Nationals:* **(-)** Excluded despite high impact (residency rights, economy).
      *   *15-Year Expats:* **(-)** Arbitrary cutoff; interests don't vanish at year 15.
      *   *Future Generations (16-17s):* **(-)** Excluded despite long-term impact.
      *   *Gibraltar:* **(+) ** Highly affected, included.
  *   **All-Subjected to Coercion (Abizadeh):** Anyone bound by the coercive legal order resulting from the decision.
      *   *Resident EU Nationals:* **(-)** Bound by resulting immigration laws, excluded.
      *   *Peers:* **(+) ** Bound by law, included (though unusual for UK elections).
      *   *Crown Dependencies:* **(0)** Bound by foreign policy/defense, excluded.
  *   **Citizenship/Membership (Traditional):** Formal legal membership in the polity.
      *   *Commonwealth/Irish:* **(+) ** Included based on historic reciprocal citizenship ties.
      *   *EU Nationals:* **(-)** Not UK citizens, excluded.
      *   *Peers:* **(+) ** UK citizens, included.
  *   **Stakeholder/Residency:** Current substantial connection to the territory.
      *   *15-Year Expats:* **(-)** Weak connection vs. resident EU nationals.
      *   *Prisoners:* **(-)** Resident but excluded.
      *   *Resident EU Nationals:* **(-)** Strong connection, excluded.

  **Verdict:** No single account fits. The franchise is a hybrid that fails the normative tests of the affected and subjected principles most severely.

  ### 2. Analysis: Principle vs. Sediment

  Which account fits the actual rules? None cleanly. The 2015 Act was an exercise in **constitutional sedimentation**, not philosophical derivation. The government defaulted to the existing General Election franchise (Citizenship + Commonwealth + Irish + Residents) because it was administratively available and politically familiar.

  *   **The Irish/Commonwealth Inclusion:** This is historical residue from the Imperial era and the Common Travel Area. It fits a "historic membership" account, not a democratic boundary principle. There is no democratic reason why an Australian living in London for six months counts, while a French national living there for twenty years does not.
  *   **The 15-Year Cliff:** This is pure administrative arbitrariness. It defies the "all-affected" principle (interests don't expire) and the "stakeholder" principle (connection doesn't snap). It exists because that was the rule for general elections, inherited uncritically.
  *   **Peers Voting:** This contradicts the logic of representative accountability (they aren't elected) but fits a "citizen equality" view (they are still subjects).
  *   **Gibraltar vs. Crown Dependencies:** Gibraltar was included because it was an EU territory; the Isle of Man was not. This suggests the boundary was drawn by *EU law status* rather than *UK democratic theory*.

  The rules are explicable by **path dependence**, not principle. The boundary was drawn by looking at the last election's voter roll and tweaking it for EU compatibility, not by asking "who constitutes the demos?"

  ### 3. Where Theories Go Silent

  Democratic boundary theory struggles with **closeness**. When a result is 51.9% to 48.1%, the legitimacy of the boundary becomes constitutive of the legitimacy of the outcome. If the boundary is arbitrary, the outcome is arbitrary. Theories often assume a stable demos; they lack resources to adjudicate when the demos definition itself is the contested variable. They also go silent on **advisory votes**. If the vote doesn't legally decide, does the boundary matter? Practically, yes, because the political commitment bound the government. Theories of democratic authority struggle with "soft" power mandates.

  ### Press Point 1: Regress vs. Circularity

  Your friend's "bootstrap objection" (infinite regress) and the standard complaint (circularity) are distinct but converge here.

  *   **Circularity:** Logical. To democratically decide the boundary, you need a demos. But to have a demos, you need a boundary. You cannot use democracy to define democracy's scope.
  *   **Regress:** Historical. Demos A draws Boundary 1. Who drew Demos A? Demos B via Boundary 0. Ad infinitum.

  In 2016, **circularity** was the active problem. Parliament (elected under old boundaries) defined the new boundaries. It was a self-referential loop: the existing legislature legitimized its own successor's scope. The regress stops historically at the Act of Parliament. Does it matter which you face? Yes. If it's circularity, the procedure is logically illegitimate (Whelan's point). If it's regress, it's historically contingent but potentially stable (you stop at the sovereign). In the referendum, Parliament acted as the sovereign stopper. They didn't solve the circularity; they overridden it with statutory authority. Your friend is right that it looks like a regress, but legally it was treated as a circular closure: Parliament decides who votes for Parliament's advice.

  ### Press Point 2: The Aftermath as Second-Order Boundary

  The negotiation of EU nationals' rights between the UK government and the EU27 confirms **Whelan-style pessimism**.

  The boundary problem wasn't solved democratically; it was solved **diplomatically**. The "demos" that decided the rights of the excluded EU nationals was not the UK electorate, nor the EU nationals themselves, but a coalition of executive actors (UK ministers + EU27 governments). This is a second-order boundary problem: who decides the status of those excluded from the first decision?

  This does not show the problem is "practically inert." It shows the problem is **extrademocratic**. The line was drawn by sovereignty (Parliament statute) and settled by treaty (executive negotiation). Legitimacy was manufactured retrospectively through implementation, not derived from the franchise's correctness. If democracy requires that those subject to the law have a say in its authorship, the aftermath confirms that the boundary problem cannot be fixed *within* democracy. It requires a sovereign fiat to stop the regress/circularity, followed by technocratic management of the fallout.

  The closeness of the margin exacerbates this. Had the vote been 70-30, the arbitrary boundary would matter less politically. At 52-48, the fact that the boundary was sediment rather than principle undermines the claim that the result reflects "the will of the people." It reflects the will of a specific, historically contingent slice of the population, ratified by sovereign fiat. The boundary problem wasn't solved; it was stipulated.
