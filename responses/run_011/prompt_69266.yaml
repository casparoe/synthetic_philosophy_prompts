  **The Hippo Hearth Monthly**
  **Column: Ask Consentius**

  Welcome to this month's pastoral corner. I am Consentius, your brother in the struggle for truth. We receive many queries on the ethics of speech. Remember always: speech is ordained for showing what is in you, not hiding it. When we sever word from thought, we invite the disease of the double heart. Here are your questions, answered with warmth and strictness.

  **Q: Hiding My Brother**
  *Murderers seek my brother in my home. May I tell them he is not here to save his life?*
  **A:** Beloved friend, I feel your terror in every word. But you may not buy another person's bodily safety with your own soul's death. His life is temporary; your integrity is eternal. To say "he is not here" is to cultivate the disease of the double heart, using speech to hide rather than show. Do not lie. Instead, use the sanctioned toolkit: remain silent, refuse to answer, or answer a question with a question. Say, "Why do you ask?" or "I will not tell you." You withhold information without falsifying your heart. Trust God with the consequences of your truthfulness.

  **Q: The Dead Dog**
  *My child asks if our dog is dead. Can I say he went to a farm? It spares him pain.*
  **A:** Dear Parent, the impulse is kind, but this is an officious lie. We rank lies by gravity: doctrinal falsehoods are worst, but lies that harm no one and protect somebody sit at the bottom. Yet they are still sins needing penance. The exemption for jest does not apply; jest requires that nobody is actually being deceived, but your child believes you. Speak truth gently. Death is a teacher. To lie is to teach him that speech is a tool for manipulation rather than a mirror of the soul.

  **Q: The Dying Patient**
  *A family asks me to hide a terminal prognosis. They say hope is kinder than truth.*
  **A:** Beloved Nurse, kindness rooted in falsehood is poison. This creates a double heart in you and deprives the dying of truth's comfort. You must explicitly swat away the idea that you can say one thing while meaning another in your heart; mental reservation is a trap later generations invented. If you cannot speak the full prognosis, say only what you believe: "We are caring for him," or "The outcome is in God's hands." True hope needs no falsehood to stand.

  **Q: Saving My Sister**
  *A cult exploits my sister. May I feign belief to join them and rescue her?*
  **A:** Dear Protector, this tracks the question put to Augustine: may you feign heresy to catch heretics who themselves thought feigning was licit? The answer is no. You may not commit a sin to prevent another's sin. To speak falsehood about belief is to deny the Truth itself. Even if they lie to persecute, you must not lie to save. Use silence. Decline their questions. Do not let their evil compel yours. Your soul is not a currency to spend on temporal safety.

  **Q: I Already Lied**
  *I lied to protect a friend. I feel guilty. Was it a small sin? Can I be reassured?*
  **A:** Peace, penitent friend. Yes, we grade lies by gravity. Lies against doctrine are deadliest; lies of mere courtesy are lighter. Yours was officious, meant to help. It is not the worst sin, but it is a wound. Do not seek reassurance that it was good. Accept the guilt, perform penance, and resolve to use silence next time. God heals the double heart when we stop practicing its disease.

  ***

  **Editor's Note**
  Does this absolutism survive the workarounds? I argue the view is internally coherent; it is our intuitions that are miscalibrated. We assume speech is for outcomes; Augustine assumes it is for ontology. If speech manifests being, lying is self-mutilation, regardless of utility. The permission to stay silent does not nullify the prohibition; it merely offers a non-destructive alternative. However, liberties were taken. The jest exemption is messier than implied; Augustine struggles with where "play" ends and "deception" begins. Misleading-but-true speech is available, but often functionally identical to lying, testing the "double heart" definition. Finally, the grading of lies is ordered as described, but Augustine admits even the "lowest" lie separates one from God. The column simplifies the metaphysics, but not the moral cost.
