prompt: |-
  I'm TAing a philosophy-of-math course and I've got the 50-minute discussion section on heuristic arguments next week — 14 students, a mix of philosophy and math majors, none of them have done any analytic number theory. I want them to actually use the presumption of independence rather than hear about it, so design a section where they generate the estimates themselves and then collide with the cases that break them.

  Shape I had in mind, but change it if you have something better and say why: first a counting problem where treating the relevant events as independent lands almost exactly on the truth — something like how many n ≤ 100 have no prime factor below 10 — so they get overconfident; then a problem in the same style where the identical move predicts a healthy number and the truth is basically a single example, like counting n where n, n+2 and n+4 are all prime. They should find the obstruction themselves, and I want them to notice that the patch they invent looks like multiplying together little local corrections, one per prime.

  Give me: the problems with the counts actually worked out (small enough to check by hand or a phone calculator, nothing above a few hundred), what goes on the handout, a minute-by-minute plan, debrief questions that push them to state a rule for when independence may be presumed and what would defeat it, and one case where this style of reasoning genuinely led mathematicians astray — pick one you're sure is really that kind of case.

  And take a position. I dont want a neutral "heuristics are handy but fallible" debrief. Say what you think the presumption of independence actually is — a defeasible default, a smuggled-in probabilistic model of the integers, something else — and build the section so they come away feeling that view rather than a rival one. Then flag where the activity is rigging things in your favor, and what will predictably go wrong the first time I run it.
reasoning: |-
  Here's a thinking process that leads to the suggested discussion section plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a Philosophy of Math course.
      *   **Task:** Design a 50-minute discussion section on "heuristic arguments" (specifically the presumption of independence in number theory).
      *   **Audience:** 14 students (mix of philosophy and math majors), no analytic number theory background.
      *   **Goal:** Students must *use* the presumption of independence, generate estimates, encounter failures, discover the "local correction" patch (singular series), and leave with a specific philosophical stance on what the presumption *is*.
      *   **Specific Constraints:**
          *   Problem 1: Independence works well (e.g., numbers with no small prime factors).
          *   Problem 2: Independence fails badly (e.g., prime triplets $n, n+2, n+4$).
          *   Discovery: Students must find the obstruction (modular arithmetic constraints) and the fix (local factors).
          *   Handout, Minute-by-Minute Plan, Debrief Questions.
          *   Historical Counterexample: A case where this reasoning led mathematicians astray.
          *   **Philosophical Stance:** Take a position (not neutral). Define the presumption of independence.
          *   **Self-Critique:** Flag where the activity is rigged and what could go wrong.

  2.  **Philosophical Stance:**
      *   The prompt asks me to take a position. A neutral "it's useful but wrong" is forbidden.
      *   *Option A:* It's a physical probability model (frequentist). (Hard to defend for integers).
      *   *Option B:* It's a logical probability (Carnap/Keynes). (Too abstract for 50 mins).
      *   *Option C:* It's a *defeasible default rule* grounded in the absence of known structural constraints. (Best fit). It treats integers as "generic" unless a specific algebraic reason forces correlation.
      *   *Decision:* I will argue for the **"Principle of Maximum Ignorance / Genericity."** The presumption of independence isn't a claim about the *metaphysics* of numbers, but a methodological rule: *Assume events are independent unless you can prove a local (modular) obstruction.* This aligns with the "local correction" discovery the students will make.

  3.  **Designing the Problems:**
      *   *Problem 1 (Success):* Counting numbers $\le N$ not divisible by small primes.
          *   Let $N=100$. Primes to exclude: 2, 3, 5.
          *   Independence estimate: $100 \times (1/2) \times (2/3) \times (4/5) = 100 \times 8/30 \approx 26.6$.
          *   Actual count (numbers coprime to 30): $\phi(30) \times \lfloor 100/30 \rfloor + \text{remainder}$.
          *   $\phi(30) = 8$. $100 = 3 \times 30 + 10$. $3 \times 8 = 24$. Remainder 10 (1..10): 1, 7 are coprime. Total 26.
          *   Estimate 26.6 vs Actual 26. Very close. Good for confidence.
      *   *Problem 2 (Failure):* Prime Triplets $(p, p+2, p+4)$.
          *   Range: $n \le 100$.
          *   Independence estimate: Probability $n$ is prime $\approx 1/\ln n$. This is too hard for non-ANT students to calculate quickly without tables.
          *   *Better approach for 50 mins:* Use divisibility constraints directly, not primality probabilities.
          *   Let's count $n \le 100$ such that $n, n+2, n+4$ are *all* coprime to 3 (or 2, 3, 5).
          *   Actually, the classic example is $n, n+2, n+4$ being prime. Only one solution: $(3, 5, 7)$.
          *   How to make them derive the estimate without ANT?
          *   Use the "Probability a number is not divisible by $p$" model.
          *   For $p=2$: $n, n+2, n+4$ have same parity. If $n$ is odd, all are odd. Prob = $1/2$.
          *   For $p=3$: $n, n+2, n+4 \equiv n, n-1, n+1 \pmod 3$. One of them *must* be divisible by 3.
          *   Independence model says: Prob(not div by 3) for each is $2/3$. Total $(2/3)^3 = 8/27$.
          *   Reality: Prob is 0 (unless one of them *is* 3).
          *   This is perfect. It requires no ANT, just modular arithmetic they know.
      *   *Refinement:* To make it a counting problem like Problem 1, let's count $n \le 100$ where $n, n+2, n+4$ are all *not divisible by 3*.
          *   Independence Prediction: $100 \times (2/3)^3 \approx 29.6$.
          *   Actual: $n \pmod 3$ can be 0, 1, 2.
              *   If $n \equiv 0$, $n$ div by 3.
              *   If $n \equiv 1$, $n+2 \equiv 0$.
              *   If $n \equiv 2$, $n+4 \equiv 6 \equiv 0$.
              *   So for *every* $n$, one of the three is divisible by 3.
              *   Count = 0.
          *   This is a stark collision. 30 vs 0.

  4.  **Historical Counterexample:**
      *   Need a case where heuristics suggested a conjecture that turned out false.
      *   *Mertens Conjecture:* $|M(x)| < \sqrt{x}$. Heuristics (random walk) suggested it's true (even stronger bounds). Disproved by Odlyzko & te Riele (1985).
      *   *Polya Conjecture:* Majority of numbers $\le x$ have odd number of prime factors. Heuristics suggest 50/50 oscillation. False (Haselgrove 1958).
      *   *Selection:* **Mertens Conjecture.** It's the classic "probabilistic model of the Mobius function" failure. It fits the "independence/randomness" theme perfectly.

  5.  **Drafting the Plan:**
      *   **Minute 0-5:** Intro & Handout. Set the stage: "We are modeling integers as random dice."
      *   **Minute 5-20:** Problem 1 (Coprime to 30). Group work. Calculate estimate. Count actual. Compare. (Success).
      *   **Minute 20-35:** Problem 2 (The Triplet). Group work. Calculate estimate (using $2/3$ logic). Count actual. (Failure). Discuss *why*. Find the mod 3 obstruction.
      *   **Minute 35-45:** The Fix. How to adjust the formula? Introduce the "Local Factor." $(1 - \text{actual\_prob}) / (1 - \text{indep\_prob})$.
      *   **Minute 45-50:** Philosophical Debrief. What is this presumption? Mertens counterexample.

  6.  **Refining the Philosophy:**
      *   I need to argue that the presumption of independence is a **Defeasible Default of Genericity**.
      *   It's not that numbers *are* random. It's that we treat them as *unstructured* until structure is proven.
      *   The "Local Correction" isn't just a math trick; it's the process of identifying the structure that defeats the default.

  7.  **Identifying Risks (Self-Critique):**
      *   *Risk 1:* Students might not know $\phi(n)$ or how to count coprimes quickly. *Mitigation:* Provide a checklist or grid on the handout.
      *   *Risk 2:* The mod 3 argument might be too fast. *Mitigation:* Force them to list the first 10 cases.
      *   *Risk 3:* Philosophical drift. *Mitigation:* Keep the debrief questions tightly focused on the *status* of the assumption.

  8.  **Final Polish:**
      *   Ensure the handout is ready-to-print style.
      *   Check the math on the counts.
      *   Make sure the "Position" is explicit in the TA notes.

  *(Self-Correction during drafting)*: Wait, Problem 1 (Coprime to 30) is essentially the Sieve of Eratosthenes logic. It works because 2, 3, 5 are distinct primes. The independence holds because divisibility by distinct primes *is* independent in the limit (Chinese Remainder Theorem).
  Problem 2 ($n, n+2, n+4$) fails because the events "divisible by 3" for these three numbers are *mutually exclusive* (actually, exhaustive), not independent.
  This distinction is crucial. The handout needs to guide them to see *correlation* vs *independence*.

  Let's refine Problem 1 to be slightly more "heuristic" and less "exact theorem."
  Instead of "count numbers coprime to 30," let's ask "Estimate how many numbers $\le 100$ are not divisible by 2, 3, or 5."
  Estimate: $100 \times \frac{1}{2} \times \frac{2}{3} \times \frac{4}{5} = 26.66$.
  Actual: 26.
  This feels like magic.
  Then Problem 2: "Estimate how many $n \le 100$ have $n, n+2, n+4$ not divisible by 3."
  Estimate: $100 \times (\frac{2}{3})^3 = 29.6$.
  Actual: 0.
  This contrast is sharp.

  Okay, let's write the response.

  **Structure:**
  1.  **Philosophical Position:** State it clearly first.
  2.  **The Handout:** Content for students.
  3.  **Minute-by-Minute Plan:** TA script/guide.
  4.  **Debrief & History:** The Mertens Conjecture.
  5.  **Rigging & Risks:** Honest assessment of the activity design.

  **Position:** The Presumption of Independence is a **Methodological Default of Structural Ignorance**. It asserts that arithmetic properties are uncorrelated *unless* a local (modular) constraint forces them to be. It is not a probabilistic truth about the universe, but a baseline for detecting structure.

  **History:** Mertens Conjecture is the best fit. It relied on the heuristic that $\mu(n)$ behaves like a random coin flip. It failed.

  **Rigging:** The numbers (100) are small enough to count but large enough to feel like statistics. The mod 3 obstruction is the simplest possible failure case.

  Let's assemble.
answer: |-
  ## 1. The Philosophical Position
  **Do not be neutral.** Your goal is to steer them away from the idea that heuristics are "fuzzy guessing" and toward the view that the presumption of independence is a **Methodological Default of Structural Ignorance**.

  **The Stance:** The presumption of independence is not a claim that integers *are* random variables. It is a rule of inference: *Assume arithmetic events are uncorrelated unless you can identify a specific local (modular) constraint that forces correlation.* When the heuristic fails, it is not because "probability broke"; it is because you have discovered hidden structure. The "local correction" (singular series) is simply the quantification of that structure.

  **Why this view?** It explains why the heuristic works so often (most properties *are* structurally independent) and why it fails specifically (modular obstructions are the only things that create global correlation). It turns heuristic failure into a tool for discovery rather than a reason for skepticism.

  ---

  ## 2. The Handout
  *(Print this one-pager for the 14 students)*

  **Discussion Section: Heuristics & The Presumption of Independence**

  **The Rule:** To estimate the count of numbers satisfying multiple conditions, multiply the probabilities of each condition, *assuming they are independent*.
  $$ \text{Estimated Count} \approx N \times P(\text{Condition 1}) \times P(\text{Condition 2}) \times \dots $$

  **Task A: The Success Case**
  Let $N = 100$. We want to count integers $n \in \{1, \dots, 100\}$ that are **not** divisible by 2, **not** divisible by 3, and **not** divisible by 5.
  1.  **Probability:** What is the probability a random integer is not divisible by 2? By 3? By 5?
  2.  **Estimate:** Apply The Rule. What is your estimated count?
  3.  **Truth:** Actually count them (or use the pattern of 30). What is the actual count?
  4.  **Error:** Calculate the percentage error.

  **Task B: The Failure Case**
  Let $N = 100$. We want to count integers $n \in \{1, \dots, 100\}$ such that **none** of the set $\{n, n+2, n+4\}$ are divisible by 3.
  1.  **Probability:** For a random $n$, what is the probability that $n$ is not divisible by 3?
  2.  **Estimate:** Apply The Rule to the three numbers $n, n+2, n+4$ as if their divisibility by 3 were independent events. What is your estimated count?
  3.  **Truth:** Check the first 10 cases ($n=1$ to $10$). What do you notice about $n, n+2, n+4 \pmod 3$? What is the actual count for $N=100$?
  4.  **Diagnosis:** Why did The Rule fail here when it worked in Task A?

  **Task C: The Patch**
  In Task B, the "independent probability" that a number is not divisible by 3 is $2/3$. The "actual probability" that the triplet $\{n, n+2, n+4\}$ avoids divisibility by 3 is 0.
  *   Can you invent a "correction factor" $C_3$ that you multiply by your estimate to fix the answer?
  *   If we looked at divisibility by 2 instead, would we need a correction factor? Why or why not?

  ---

  ## 3. Minute-by-Minute Plan (50 Minutes)

  **0:00 – 0:05: Setup & Framing**
  *   Hand out sheets.
  *   **Script:** "Mathematicians often treat numbers like dice rolls. If I ask 'is $n$ divisible by 2?', it's like flipping a coin. Today, you're going to test how good this model is. You will find a case where it looks like magic, and a case where it lies to your face."
  *   Divide into 4 groups of 3-4 students.

  **0:05 – 0:20: Task A (The Confidence Builder)**
  *   Students calculate: $1/2 \times 2/3 \times 4/5 = 8/30$.
  *   Estimate: $100 \times 8/30 = 26.66$.
  *   Counting: They might list them, or notice the pattern repeats every 30. $\phi(30)=8$. $3 \times 8 = 24$. Remaining 10 numbers (1-10) contain 1, 7. Total 26.
  *   **TA Move:** Circulate. Ensure they see the error is tiny (~2.5%).
  *   **Board:** Write "Estimate: 26.7 | Actual: 26". Ask: "Is this luck?" (Most will say 'no, distinct primes feel independent').

  **0:20 – 0:35: Task B (The Collision)**
  *   Students calculate: Prob(not div by 3) = $2/3$.
  *   Estimate: $100 \times (2/3)^3 = 100 \times 8/27 \approx 29.6$.
  *   Counting: Ask them to check $n=1, 2, 3$.
      *   $n=1 \to \{1, 3, 5\}$ (3 is div by 3).
      *   $n=2 \to \{2, 4, 6\}$ (6 is div by 3).
      *   $n=3 \to \{3, 5, 7\}$ (3 is div by 3).
  *   **The Realization:** One of them is *always* divisible by 3. Actual count = 0.
  *   **TA Move:** Stop the class. "29 predicted. 0 found. The Presumption of Independence just broke. Why?"
  *   Guide them to modular arithmetic: $n, n+2, n+4 \equiv n, n-1, n+1 \pmod 3$. These are three consecutive residues. One must be $0 \pmod 3$.
  *   **Key Insight:** In Task A, divisibility by 2 didn't force divisibility by 3. In Task B, the *relationship between the numbers* forces a correlation modulo 3.

  **0:35 – 0:45: Task C (The Patch)**
  *   Ask groups to formulate a fix.
  *   They want to multiply the estimate by something to turn 29.6 into 0.
  *   Factor $C_3 = \frac{\text{Actual Prob}}{\text{Independent Prob}} = \frac{0}{8/27} = 0$.
  *   Ask about Mod 2: $n, n+2, n+4$ all have same parity.
      *   Indep Prob (all odd): $(1/2)^3 = 1/8$.
      *   Actual Prob (all odd): $1/2$ (if $n$ is odd, all are).
      *   Correction $C_2 = (1/2) / (1/8) = 4$.
  *   **Board:** Write "Heuristic $\times \prod C_p$".
  *   **Script:** "This product of corrections is called the *Singular Series*. It measures how much the integers deviate from 'generic' random behavior at each prime."

  **0:45 – 0:50: Debrief & The Mertens Warning**
  *   Pose the debrief questions (below).
  *   Deliver the historical counterexample (Mertens).
  *   Final takeaway: "Independence is the null hypothesis. Rejection of the null is where the math lives."

  ---

  ## 4. Debrief Questions & Historical Case

  **Debrief Questions (Push for the Position):**
  1.  **Status of the Assumption:** "In Task A, we treated divisibility by 2 and 3 as independent. Was this *true*? Or was it a useful assumption?" (Target answer: It's a default assumption that holds because there's no structural link).
  2.  **Nature of Failure:** "In Task B, did probability fail? Or did we miss a constraint?" (Target answer: We missed the modular constraint. The numbers aren't 'generic').
  3.  **The Rule:** "Complete this sentence: We are permitted to presume independence unless __________." (Target answer: ...unless there is a local modular obstruction).

  **Historical Counterexample: The Mertens Conjecture (1897)**
  *   **The Heuristic:** The Möbius function $\mu(n)$ takes values $\{-1, 0, 1\}$. If you treat $\mu(n)$ as a random coin flip (independence presumption), the partial sum $M(x) = \sum_{n \le x} \mu(n)$ should behave like a random walk.
  *   **The Prediction:** A random walk of $x$ steps rarely exceeds $\sqrt{x}$. Mertens conjectured $|M(x)| < \sqrt{x}$ for all $x$.
  *   **The Reality:** Proven **false** by Odlyzko and te Riele (1985). The "random walk" drifts further than the heuristic predicted.
  *   **The Lesson:** The presumption of independence is a *defeasible default*. It is the baseline for "no structure." When deep, non-local structure exists (like zeros of the Riemann Zeta function correlating over long ranges), the heuristic breaks. It is not a law of nature; it is a methodological starting point.

  ---

  ## 5. TA Self-Critique: Rigging & Risks

  **Where I am Rigging the Activity:**
  1.  **The Modulus Choice:** I chose $p=3$ for the triplet problem because it is the *only* prime that creates an obstruction for $(n, n+2, n+4)$. If I had asked them to check divisibility by 5, the heuristic would have worked (mostly), and the lesson would be diluted. I am guiding them to the specific prime that breaks the model.
  2.  **Small Numbers:** $N=100$ is small enough that the "Actual Count" in Task A (26) is suspiciously close to the "Estimate" (26.6). For larger $N$, the error term in the sieve grows. I am hiding the error term to make the heuristic look more robust than it is, specifically to make the Task B failure more shocking.
  3.  **The "Correction":** I am leading them to define the correction factor *after* they know the answer. In real research, you derive the correction from the local constraints *before* counting.

  **Predictable Points of Failure:**
  1.  **Modular Arithmetic Rust:** Philosophy majors may not immediately see why $n, n+2, n+4$ covers all residues mod 3.
      *   *Fix:* Have them write out $n \pmod 3$ for $n=0,1,2$ explicitly on the board during the debrief.
  2.  **Probability Confusion:** Students might confuse "probability $n$ is prime" with "probability $n$ is not divisible by 3."
      *   *Fix:* The handout explicitly avoids the word "prime" in Task B, focusing only on "divisible by 3." Stick to this script.
  3.  **Cynicism:** Students might conclude "Heuristics are useless lies."
      *   *Fix:* Emphasize the Mertens example carefully. The heuristic wasn't "stupid"; it was the *best possible guess* given the information at the time. Its failure drove 100 years of analytic number theory. The value is in the *deviation*, not the prediction.

  **Final Note to TA:**
  When you deliver the philosophical position, do not apologize for the heuristic. Treat it like a scientific null hypothesis. "We assume no structure. If the data disagrees, we have found structure." This empowers them to see the failure in Task B not as a mistake, but as a discovery.
