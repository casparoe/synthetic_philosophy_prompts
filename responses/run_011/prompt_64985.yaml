answer: |-
  The conference room lights were dimmed to a low hum, casting long shadows over the scattered drafts of the consent packet. Outside, the clinic parking lot was empty. Elena, a psychiatrist with a secondary degree in moral philosophy, stirred the dregs of her coffee. Across the table, Marcus, a philosopher of action, rubbed his temples. They had been at this for three hours.

  "The draft says patients retain full moral and legal responsibility for actions performed under stimulation," Marcus said, tapping the page. "Given the fraud case, that sentence is a liability. It's factually misleading."

  "It's legally necessary," Elena countered. "And morally accurate. He turned the knob, Marcus. He increased the amplitude himself. Months before the fraud. After a nurse explicitly mentioned impulse control issues. He responded to a reason."

  "He responded to a impulse generated by the device," Marcus said. "That's the point you're glossing. My view isn't that he lacked control in the moment. It's that the *source* of the disposition to commit fraud was installed by a process he did not author. The device altered his valuing system. Turning the amplitude up doesn't launder that. You can't take responsibility for a spring you didn't wind, even if you pull the trigger."

  Elena leaned forward. "Let me make sure I understand you, because the committee needs to. You're arguing that because the causal chain of his new appetites originates in the electrode placement, he cannot own them. Even if he currently endorses them, even if he acts on them willingly, he isn't the true source because the *origin* of the change was external. Is that it?"

  "Exactly," Marcus said. "Ultimate sourcehood matters. If the therapy installs a new set of springs, the actions flowing from them aren't his in the deep sense required for full responsibility. The consent packet implies he is the author of his actions post-implant. But if the therapy writes the script, he's just the actor."

  "And my view," Elena said, "is that responsibility tracks reasons-responsiveness. He heard the warning. He understood the risk. He adjusted the device to prioritize motor function over impulse control. That is an exercise of agency. He is acting within the space of reasons. The causal history of a disposition doesn't remove it from that space. If he can respond to reasons—like the nurse's warning—he is responsible."

  "But consider the second patient," Marcus said. "Identical stimulation. Identical upward adjustment. Same warning. The only difference is the piece of paper he signed beforehand saying, 'I accept changes to my appetites.' Does that scrap of paper magically make him the source of the springs? If it does, then responsibility turns on paperwork, not ontology. If it doesn't, then your 'reasons-responsiveness' is blind to the actual history of the agent."

  Elena paused. "It does make a difference. Not because of the paper itself, but because it shows integration. The second patient aligned his values with the potential outcome *before* the alteration. He incorporated the risk into his practical identity. The fraud patient didn't. He just turned the knob for better movement, ignoring the impulse risk until it was too late. The prior endorsement shows the changes were authorized by his pre-existing values."

  "That's tracing," Marcus said. "You're tracing responsibility back to the moment of signing. But if the device fundamentally alters the psychology such that the post-implant agent is psychologically discontinuous with the pre-implant signer, the trace breaks. The fraud patient's family wrote to us saying, 'This is not the person we knew.' They aren't saying he lacked control. They're saying the agent who committed the fraud wasn't their husband. Does that framing embarrass you?"

  "It should embarrass both of us," Elena said. "But practically, it helps my side. If we accept that DBS creates a 'new person,' we undermine the continuity required for any medical consent to hold. We treat the patient as the same person for the benefits of the therapy; we must treat him as the same person for the burdens. Besides, 'not the person we knew' is metaphorical. Legally, it's the same body, same brain, same history."

  "It helps my side," Marcus corrected. "Because it points to the sourcehood problem. If the family recognizes the psychology as alien, it suggests the springs were indeed installed externally. The fact that they distinguish the person suggests that deep down, we recognize agency requires more than just reasons-responsiveness. It requires that the motives be *yours* in a way that isn't just about current functioning. But let's go back to the knob. You think turning it up restores responsibility?"

  "I think it demonstrates it," Elena said. "He had the power to adjust. He chose to increase stimulation. That is an action. If he was coerced by the device to turn the knob, that's one thing. But he wasn't. He wanted better motor control. He accepted the trade-off."

  "But the desire for better motor control was amplified by the very stimulation he was adjusting," Marcus said. "It's a loop. The device makes him value movement more, which makes him turn the device up, which makes him value movement more. Where is the exit ramp for agency? In the second patient, the one with the note... if I concede that his note matters, I concede that history matters. But if history matters, then the fraud patient's history lacks the authorization. So you must admit the packet needs to distinguish between them."

  "I admit the packet should highlight the risk of personality change," Elena said. "But I won admit that the fraud patient isn't responsible. Here is how I would state your position to the committee: You believe that unless the patient is the ultimate originator of their motivational set, they cannot be held accountable, regardless of how rationally they act. And you believe the consent packet implies origination we cannot guarantee."

  Marcus nodded. "And I would state your position this way: You believe that so long as the patient can recognize and react to moral reasons—like the nurse's warning—they are responsible, regardless of where those motivations came from. You believe the consent packet should reinforce that functional capacity."

  "Accurate," Elena said.

  "So where does that leave us?" Marcus asked. "The committee votes tomorrow. We need language."

  "It leaves us at the crux," Elena said. "You think responsibility requires being the ultimate source of one's will. I think it requires having a will that responds to reasons. We aren't going to solve metaphysics tonight."

  "No," Marcus agreed. "But we can acknowledge the uncertainty. Here is what counts against my view: If the fraud patient had deliberately sought the stimulation specifically to become more reckless—to commit the fraud—my sourcehood argument would weaken. If he used the device as a tool to bypass his own inhibitions intentionally, he becomes the source again. I have to admit that intentional manipulation of the device for bad ends restores responsibility, even on my view. That's a vulnerability."

  "And here is what counts against mine," Elena said. "If the stimulation bypasses the reasoning centers entirely—if it creates an impulse that literally cannot be weighed against reasons, like a reflex—then my reasons-responsiveness model fails. If the nurse's warning literally could not register against the stimulation-induced urge, then he wasn't responsive. I have to admit that severe stimulation-induced mania removes responsibility. That's my vulnerability."

  Marcus sighed. "So we agree there are limits. But for the average case?"

  "For the average case," Elena said, "we need to tell them they remain agents."

  "But we need to tell them the agency might be compromised at the source," Marcus said.

  They looked at the draft. The silence stretched, comfortable now that the battle lines were drawn clearly.

  "Okay," Elena said. "What do we tell the prospective patient about later conduct? One or two sentences. From my view."

  She took a pen. " 'You will remain responsible for your actions after implantation, as you will retain the capacity to understand risks and adjust your device in response to them.' "

  Marcus shook his head. "That's too strong. It denies the possibility of sourcehood erosion. Try this: 'While you will retain control over your device, the stimulation may alter your underlying motivations in ways that feel foreign, potentially complicating questions of personal responsibility.' "

  Elena considered it. "That's too vague. It sounds like a waiver of liability."

  "It's honesty," Marcus said.

  "It's fear-mongering," Elena said. "But... it captures the risk." She looked at him. "If we combine them? We state the responsibility, but we qualify the continuity of self."

  "The committee won't pass a contradiction," Marcus said. "We have to submit separate recommendations."

  "Fine," Elena said. "But we agree on the core disagreement. It turns on whether responsibility is about where the will comes from, or how the will functions."

  "Source versus Function," Marcus said.

  "Exactly." Elena capped her pen. "I still think he's liable."

  "And I still think the springs were installed by us," Marcus said. "But I'll vote for your language if you add a clause about the risk of altered appetites."

  "Done," Elena said. "As long as you admit the knob adjustment matters."

  "It matters," Marcus conceded. "It just doesn't cleanse the source."

  They packed their papers. The clinic was dark, the hum of the refrigerator the only sound left in the room.
