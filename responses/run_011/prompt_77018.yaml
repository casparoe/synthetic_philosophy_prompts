prompt: |-
  I commission the alternate-history strand for a monthly history magazine — four-ish companion essays online a month, tied to whatever the print issue is doing — and our advisory board of academic historians has started pushing back hard. Their complaint is basically the old Carr charge that counterfactual history is a pastime for people who'd rather not do the work of explaining what actually happened. Fair enough, but I'm not shutting the strand down, and "it's unfalsifiable" isn't a usable rejection to me, because a huge amount of good economic history is counterfactual reasoning with the label scraped off — Fogel's railroads work is a giant what-if and it's about as rigorous as the field gets. So what I need is something my two fact-checkers can run on a pitch in twenty minutes flat. Both are bright, neither has any training in historiography, and their output either gets acted on by me or escalated to one of the board members.

  Write me the procedure. Questions in order, what counts as a passing answer to each, where it dead-ends in a reject, and where it hands the decision to a person because the sticking point is contested scholarship or taste rather than method. A few distinctions I already suspect belong in there, though tell me if I've got them wrong: whether the pitch contains a real fork at all (could the people at the time plausibly have chosen otherwise, or did the structural situation make the outcome near-inevitable no matter what anyone decided); how much of the actual past is allowed to travel along with the changed thing — the minimal-rewrite discipline the military historians use, and the Lewis-style question of which nearby world you're even describing once you start letting facts come along for the ride; and the difference between a one-shot counterfactual (one decision, one day) and a structural one (a rate, an institution, an absence), since the second kind seems to have no divergence point and I can't work out whether that makes it harder to do or just a different genre that needs its own rules. Also cover what the procedure does when two equally plausible rewrites point in opposite directions, and whether it's defensible for us to publish the range rather than picking a side. A friend of mine who teaches early modern history swears the dominant failure mode isn't a bogus antecedent at all — you can almost always find *some* nearby world — it's an untraceable consequent, where nobody can say anything beyond about two years out. Build that in if you think she's right, and say so if you don't.

  Then run it on three live pitches. (1) The Archduke's driver doesn't take the wrong turn in Sarajevo in 1914, so no July crisis and no world war. (2) The Black Death never reaches Europe, and the fourteenth century plays out on pre-plague population and labour relations. (3) The one I've already half-commissioned and would like to save: the Armada gets Parma's troops across in 1588 and England goes back to Rome. For each, give me the verdict your procedure produces, the single sentence in the pitch that would have to be rewritten if it's a conditional pass, and which step did the killing. Be explicit about where the procedure is smuggling in an answer on determinism — my suspicion is that at least one of these rejections evaporates if I refuse to assume history is settled in advance, and I'd rather know that now than get caught out at the quarterly review. Finally, flag which of your steps are judgment calls in a checklist costume, because if my fact-checkers can't tell those apart from the mechanical ones they'll start killing pitches I like for reasons they can't articulate. No reading list, please — I've got a pile of books already and its the procedure I'm short of.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Editor of a monthly history magazine commissioning an alternate-history strand (4 essays/month online).
      *   **Problem:** Academic advisory board pushing back (Carr's charge: counterfactuals avoid explaining what *actually* happened).
      *   **Constraint:** Cannot shut down the strand. "Unfalsifiable" is not a valid rejection criterion (citing Fogel's economic history).
      *   **Need:** A 20-minute vetting procedure for two bright but non-historian fact-checkers.
      *   **Output:** A step-by-step procedure (questions, passing answers, reject points, escalation points).
      *   **Specific Inclusions:** Real fork vs. structural inevitability, minimal-rewrite discipline (Lewis-style), one-shot vs. structural counterfactuals, divergent plausible outcomes (publishing the range), the "untraceable consequent" problem (2-year horizon).
      *   **Task 2:** Run the procedure on three specific pitches (Sarajevo 1914, Black Death 1348, Armada 1588).
      *   **Task 3:** Identify where determinism is smuggled in and which steps are "judgment calls in a checklist costume."
      *   **Constraint:** No reading list.

  2.  **Deconstruct the Historiographical Issues:**
      *   *Carr's Charge:* Counterfactuals are parlor games. *Counter:* All history implies counterfactuals (causation requires "if X hadn't happened, Y wouldn't have"). Fogel's cliometrics proves rigorous counterfactuals exist.
      *   *The "Real Fork":* Was the outcome contingent or determined? (e.g., Could the driver have turned right? vs. Was war inevitable due to alliances?)
      *   *Minimal Rewrite:* Change *only* the necessary variable. Don't change the weather, the mood, and the map all at once.
      *   *Time Horizon:* How far out can we reasonably speculate before chaos theory takes over? (The friend's "2-year rule").
      *   *Structural vs. Event:* Changing a law/institution vs. changing a specific decision.
      *   *Determinism:* The procedure shouldn't assume the actual outcome was the *only* possible outcome, but it must acknowledge structural constraints.

  3.  **Drafting the Procedure (The "Vetting Protocol"):**
      *   *Goal:* 20 minutes max. Needs to be binary (Pass/Fail/Escalate) where possible.
      *   *Step 1: The Fork (Contingency).* Is there a plausible moment of choice? If the outcome was structurally locked, reject.
      *   *Step 2: The Minimal Rewrite (Coherence).* Does the pitch change *only* the pivot point? If it requires magic or changing human nature, reject.
      *   *Step 3: The Horizon (Traceability).* Does the essay claim to know too much too far out? If it predicts 50 years later without mechanism, flag for escalation (the friend's point).
      *   *Step 4: The Mechanism (Causation).* Does the author explain *how* A leads to B, or just assert it?
      *   *Step 5: The Scholarship (Escalation).* Is the pivot point contested by historians? If yes, escalate to the Board.

      *Refining the Steps:* I need to make sure the fact-checkers know *what* counts as a pass.
      *   *Step 1 (Plausibility):* Did contemporaries see this as open? (Pass: Yes. Fail: No, it was viewed as inevitable *then*).
      *   *Step 2 (Minimalism):* Is the change isolated? (Pass: One variable. Fail: Ripple effects assumed without proof).
      *   *Step 3 (The Horizon):* How far out does the narrative go? (Pass: Focuses on immediate/medium term. Fail: Definitive claim about 1900 based on 1600 change).
      *   *Step 4 (Determinism Check):* Does the pitch acknowledge structural pressures? (Pass: Acknowledges constraints. Fail: "Great Man" changes everything instantly).

      *Wait, I need to address the "Structural vs. One-Shot" distinction requested.*
      *   Let's make Step 1 about identifying the *type* of counterfactual.
      *   Let's make Step 3 about the "Untraceable Consequent."

      *Revised Procedure Structure:*
      1.  **The Pivot (Fork):** Is it a real choice or a structural inevitability?
      2.  **The Rewrite (Minimalism):** Are we keeping the world the same except for the pivot?
      3.  **The Horizon (Consequence):** How far does the claim stretch? (Addressing the friend's point).
      4.  **The Mechanism (Causality):** Is the link explained?
      5.  **Escalation Triggers:** When to call the Board.

  4.  **Developing the Criteria for Fact-Checkers:**
      *   They aren't historians. They can't judge "Was war inevitable?" deeply. They *can* judge "Does the author admit war was likely?"
      *   They *can* check if the author changes too many variables.
      *   They *can* check the timeline.

  5.  **Running the Pitches:**
      *   *Pitch 1 (Sarajevo):* Classic "Great Man/Event" counterfactual.
          *   Issue: Structural pressures (alliances, militarism) make war highly likely even without the assassination.
          *   Horizon: Claiming "No WWI" is a huge stretch. Maybe "No WWI *in August 1914*."
          *   Verdict: Likely Reject or Heavy Escalation due to determinism/structural pressure.
      *   *Pitch 2 (Black Death):* Structural counterfactual.
          *   Issue: No divergence point. It's an "absence."
          *   Horizon: Massive. Changing 1348 changes everything up to present.
          *   Friend's Point: Untraceable consequent. Hard to say anything specific beyond 2 years.
          *   Verdict: Escalate/Reject. Too broad, violates horizon rule.
      *   *Pitch 3 (Armada):* The one the Editor wants to save.
          *   Issue: Parma's troops crossing.
          *   Plausibility: High. It was close.
          *   Horizon: "England goes back to Rome." Is that inevitable?
          *   Verdict: Conditional Pass. Needs rewriting of the "inevitability" of Catholic restoration.

  6.  **Addressing the "Smuggled Determinism" and "Judgment Calls":**
      *   I need to be honest. Any rule about "inevitability" assumes we know what was inevitable.
      *   The "2-year rule" is a judgment call disguised as a rule.
      *   The "Minimal Rewrite" is often subjective (how much context is *too much*?).

  7.  **Refining the Output:**
      *   Tone: Professional, direct, operational.
      *   Format: Clear headers, bold text for decision points.
      *   Ensure the "Friend's Point" (untraceable consequent) is integrated as a specific step.
      *   Ensure the "Determinism" warning is explicit in the analysis section.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 20 minutes?
      *   *Fix:* Simplify the language. Use "Yes/No/Escalate" logic.
      *   *Critique:* Did I address the "Structural vs. One-Shot" distinction?
      *   *Fix:* Add a specific branch in Step 1 for this.
      *   *Critique:* Did I address the "Publishing the Range" question?
      *   *Fix:* Add a note in the Escalation section about conflicting plausible outcomes.
      *   *Critique:* The Editor wants to save the Armada pitch.
      *   *Fix:* Ensure the procedure allows a "Conditional Pass" with a specific rewrite instruction.

  9.  **Final Polish:** Check against all constraints (no reading list, specific pitches, specific warnings about determinism and judgment calls). *Make sure the distinction between fact-checker decision and Board escalation is clear.*

  *(Self-Correction on the Black Death Pitch)*: A "Black Death never happens" pitch is actually an "absence" counterfactual. It's structurally different from "The Driver turns right." It requires changing microbiology or trade routes. This violates "Minimal Rewrite" heavily. I need to make sure the procedure catches this.

  *(Self-Correction on Sarajevo)*: The "No WWI" claim is the weak point. The "Driver doesn't turn" is the pivot. The consequence is the problem. This fits the "Untraceable Consequent" rule.

  *(Self-Correction on Armada)*: "England goes back to Rome" is a theological/political assumption. That's the rewrite target.

  Let's assemble the document.

  *Structure:*
  1.  **The Protocol:** Step-by-step for fact-checkers.
  2.  **The Escalation Matrix:** When to call the Board.
  3.  **The Audit:** Running the three pitches.
  4.  **The Meta-Analysis:** Determinism and Judgment Calls.

  *Key check:* The prompt asks for "Questions in order, what counts as a passing answer... where it dead-ends... where it hands the decision to a person." I need to format the procedure exactly like that.

  *Key check:* "Flag which of your steps are judgment calls in a checklist costume." I will add a specific section for this.

  *Key check:* "Say so if you don't [agree with the friend]." I generally agree with the friend regarding long-term specificity, but economic history (Fogel) does long-term. I need to nuance this: *Specific narrative* vs. *Structural trend*. I will side with the friend for *narrative* essays (which this magazine seems to be) but allow *structural* essays to pass with different criteria. Actually, to keep it simple for fact-checkers, I'll enforce the horizon limit but allow escalation for structural pieces.

  *Wait, one more thing:* The prompt asks "whether it's defensible for us to publish the range rather than picking a side." I should answer this in the procedure or the meta-analysis. I'll put it in the Escalation section.

  Okay, ready to write.
answer: |-
  # The Counterfactual Vetting Protocol (CVP)
  **For:** Fact-Checking Team
  **Time Limit:** 20 Minutes per Pitch
  **Goal:** Filter methodological failures; escalate historiographical disputes.

  This procedure does not judge whether the history is *true* (it is, by definition, not). It judges whether the argument is *rigorous*. You are checking the engine, not the destination.

  ### Step 1: The Pivot (Contingency Check)
  **Question:** Does the pitch identify a specific moment or variable where the actual past was contingent (could have gone otherwise), or does it treat a structural inevitability as a choice?
  *   **Pass:** The author acknowledges that contemporaries saw multiple options, or cites historical debate suggesting the outcome was not locked.
  *   **Fail (Reject):** The pitch treats a structural force (e.g., "industrialization," "demographic pressure") as a switch that could be flipped off without explaining the mechanism. *Exception:* If the pitch is explicitly about removing a structural variable (e.g., "No Railroads"), proceed to Step 2 but flag for Senior Editor review.
  *   **Escalate:** The pitch hinges on a historical fact that is currently contested by scholars (e.g., "If Policy X had passed..." when scholars disagree if Policy X was ever possible).

  ### Step 2: The Minimal Rewrite (Coherence Check)
  **Question:** Does the pitch change *only* the pivot point and its direct consequences, or does it silently alter other facts to make the story work?
  *   **Pass:** The world remains identical to our timeline up to the pivot point. Technology, geography, and human psychology remain constant.
  *   **Fail (Reject):** The "Magic Wand" error. (e.g., "If the Armada lands, the Spanish instantly have supply lines" when they historically didn't).
  *   **Escalate:** The author argues that changing the pivot point requires a "butterfly effect" on unrelated variables (e.g., "If the Archduke lives, German culture becomes more pacifist").

  ### Step 3: The Horizon (Traceability Check)
  **Question:** How far into the future does the essay make specific narrative claims?
  *   **Pass:** Specific narrative claims (names, battles, laws) are confined to **<10 years** post-pivot. Long-term claims are framed as probabilities or structural trends.
  *   **Fail (Reject):** The "Untraceable Consequent." The author asserts specific outcomes (e.g., "No Second World War") more than 20 years out without a detailed causal chain. *Note: This aligns with the "2-year rule" for narrative certainty; beyond that, we require probabilistic language.*
  *   **Escalate:** The essay argues for a long-term structural shift (e.g., "Feudalism lasts longer") without specific narrative predictions.

  ### Step 4: The Mechanism (Causality Check)
  **Question:** Does the author explain *how* A leads to B, or simply assert that it does?
  *   **Pass:** Every major divergence is linked by a stated mechanism (political, economic, military).
  *   **Fail (Reject):** "Therefore, everything changes." The essay skips from the pivot to the conclusion.
  *   **Escalate:** The mechanism relies on specialized economic or demographic modeling (refer to Fogel-style counterfactuals).

  ### Step 5: The Range (Determinism Check)
  **Question:** Does the author acknowledge that their outcome is *one* plausible path, or the *only* path?
  *   **Pass:** The author uses language like "likely," "plausible," or "would have increased the probability of."
  *   **Fail (Reject):** The author treats the alternate timeline as historically determined (e.g., "This *would* have saved the Empire").
  *   **Escalate:** The pitch suggests publishing two companion pieces with opposing outcomes (e.g., "Armada Wins" / "Armada Loses but War Continues").

  ---

  ### Escalation Matrix
  *   **To Senior Editor (You):** Steps 1 (Structural Exception), Step 3 (Long-term Structural), Step 5 (Companion Pieces).
  *   **To Advisory Board:** Step 1 (Contested Fact), Step 4 (Specialized Modeling).
  *   **Automatic Reject:** Step 1 (Inevitability treated as Choice), Step 2 (Magic Wand), Step 3 (Untraceable Specifics), Step 4 (No Mechanism), Step 5 (Alternate Determinism).

  ---

  # Audit: Live Pitches

  ### Pitch 1: The Archduke's Driver (Sarajevo, 1914)
  *   **Step 1 (Pivot):** **Pass.** The wrong turn was a genuine accident; contemporaries did not view war as inevitable *in that specific week*.
  *   **Step 2 (Rewrite):** **Pass.** Assuming the driver takes the correct route is a minimal change.
  *   **Step 3 (Horizon):** **Fail.** The pitch claims "No World War." This is an untraceable consequent. Structural pressures (alliances, mobilization timetables) make a war highly probable even without the assassination. Claiming *no* war violates the horizon rule.
  *   **Step 4 (Mechanism):** **Fail.** It assumes the assassination was the *sole* cause, ignoring the mechanism of the alliance system which would have sought another pretext.
  *   **Step 5 (Range):** **Fail.** Treats the peace outcome as determined.
  *   **Verdict:** **Reject.**
  *   **Required Rewrite (if salvaged):** "No July Crisis *in August 1914*" (Delays the war, does not prevent it).
  *   **Killing Step:** **Step 3 (The Horizon).** The claim exceeds the traceable window for narrative certainty.

  ### Pitch 2: The Black Death Never Reaches Europe (1348)
  *   **Step 1 (Pivot):** **Escalate.** This is a structural counterfactual (absence), not an event counterfactual. There is no single "fork." It requires changing microbiology or trade routes.
  *   **Step 2 (Rewrite):** **Fail.** To keep the plague out requires changing trade, climate, or biology, which violates the "Minimal Rewrite" discipline (you are changing the whole Mediterranean system).
  *   **Step 3 (Horizon):** **Fail.** The pitch implies changes to the Renaissance, Reformation, and Capitalism. This is centuries beyond the traceable horizon.
  *   **Verdict:** **Reject.**
  *   **Required Rewrite (if salvaged):** Focus strictly on labor relations in 1350–1360.
  *   **Killing Step:** **Step 2 (The Minimal Rewrite).** You cannot remove the plague without rewriting the entire 14th-century economic infrastructure.
  *   **Note:** Your friend is correct. This is the "untraceable consequent" failure mode in its purest form.

  ### Pitch 3: The Armada Lands (1588)
  *   **Step 1 (Pivot):** **Pass.** The historical consensus is that the landing was a genuine military possibility that failed due to weather/coordination.
  *   **Step 2 (Rewrite):** **Conditional Pass.** The pitch assumes Parma's troops land successfully. *However*, it assumes they remain supplied.
  *   **Step 3 (Horizon):** **Escalate.** "England goes back to Rome" is a 50+ year claim.
  *   **Step 4 (Mechanism):** **Pass.** Military occupation leads to political enforcement.
  *   **Step 5 (Range):** **Fail.** Asserts Catholic restoration as inevitable.
  *   **Verdict:** **Conditional Pass (Escalate to Editor).**
  *   **Required Rewrite:** Change "England goes back to Rome" to "England faces a prolonged civil war with a significant probability of Catholic restoration."
  *   **Killing Step:** **Step 5 (The Range).** The determinism of the religious outcome is too strong.
  *   **Save Strategy:** This is the one to save. The pivot is sound. The rewrite is stylistic (hedging the certainty), not structural.

  ---

  # Meta-Analysis: Determinism & Judgment Calls

  ### 1. Where is Determinism Smuggled In?
  You suspected one rejection evaporates if we refuse to assume history is settled. You are right.
  *   **Pitch 1 (Sarajevo)** is rejected by **Step 3**. However, this step assumes that "structural pressures" (alliances) are deterministic forces that *would* have caused war regardless. If you reject the idea that WWI was inevitable (i.e., if you believe the alliance system was fragile and needed the spark), Pitch 1 becomes a **Pass**.
  *   **The Trap:** Step 1 and Step 3 rely on your fact-checkers knowing what was "structurally locked." They don't. They are relying on the *author's* representation of structural lock. If the author argues convincingly that war was *not* inevitable, Step 3 shouldn't fail them.
  *   **Fix:** Modify Step 3 to read: "Fail if the author ignores *acknowledged* structural pressures." If the author argues the pressures were weak, that is a historiographical argument, not a methodological error. Escalate that, don't Reject it.

  ### 2. Judgment Calls in Checklist Costume
  Your fact-checkers need to know these are subjective, or they will kill good work to protect themselves.
  *   **Step 2 (Minimal Rewrite):** This is the biggest trap. How much context is "too much"? Changing the Archduke's route is minimal. Changing the Black Death is not. But what about "If Lincoln doesn't give the Gettysburg Address"? That changes the *text*, but does it change the *war*? Fact-checkers will struggle here.
      *   *Instruction:* Tell them: "If the change requires inventing a new technology or changing a person's personality, it's a Fail. If it requires changing a decision or a weather event, it's a Pass."
  *   **Step 3 (The Horizon):** The "10-year" rule is arbitrary. In economic history (Fogel), 50-year projections are standard. In narrative political history, 2 years is a stretch.
      *   *Instruction:* Tell them: "If the essay is about *events* (battles, laws), use the 10-year limit. If the essay is about *trends* (wages, population), Escalate to me. Do not Reject."
  *   **Step 5 (The Range):** Deciding between "likely" and "inevitable" is semantic.
      *   *Instruction:* Tell them: "Look for the word 'would' without a qualifier. If they say 'X would happen,' flag it. If they say 'X would likely happen,' Pass."

  ### 3. Publishing the Range
  You asked if it is defensible to publish opposing outcomes.
  *   **Verdict:** Yes, but only if the *pivot* is the same.
  *   **Procedure:** If two pitches arrive with the same Pivot (Armada Lands) but opposite Consequences (Catholic Restoration vs. Protestant Guerrilla War), do not Reject either. **Escalate.** Commission both as a "Point/Counterpoint" pair. This acknowledges historical contingency explicitly and neutralizes the Carr charge by showing you understand the range of possibility.

  ### 4. The Friend's Point (Untraceable Consequents)
  Your friend is right about narrative history. We cannot know if a specific person would be born or a specific law passed 50 years down a divergent timeline.
  *   **Integration:** Step 3 enforces this.
  *   **Nuance:** Economic/Demographic history (Fogel) *can* predict 50 years out because it deals with aggregates, not individuals. If a pitch is "No Black Death = Higher Wages in 1400," that is defensible. If it is "No Black Death = No Shakespeare," that is not.
  *   **Instruction:** Tell fact-checkers: "Aggregates (prices, population) get more time. Individuals (kings, artists, battles) get less time."

  ### Summary for the Fact-Checkers
  1.  **Don't judge the history.** Judge the *links* between the history.
  2.  **No Magic.** One change only.
  3.  **No Prophecy.** Specific events stop after 10 years; trends can go longer.
  4.  **No Certainty.** Use "likely," not "will."
  5.  **When in doubt, Escalate.** Do not Reject a pitch because you think the history is wrong. Reject it only because the *method* is broken.
