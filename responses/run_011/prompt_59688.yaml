answer: |-
  Good evening, everyone. For those who don't know me, I'm Dot's nephew. I've been asked to say a few words about her twenty-six years as treasurer, and specifically about the year everyone still whispers about: 2008.

  We all know the story. A lender offered a deal that would have doubled our annual returns. The catch was putting the entire reserve fund up as security. Dot turned it down. She was shouted at for months. Some people, including members of my own family, say she was squeamish. They say she got lucky that the market crashed, and that she confused caution with wisdom.

  I am here to tell you she was not lucky. She was right. And she was right for a reason that matters more than money.

  There is a trick in mathematics that trips up even the brightest minds. It's the difference between what happens to a crowd, and what happens to you over time. If you take a hundred people into a casino and they all bet everything on one spin of the wheel, some will double up and some will lose it all. The average result might look like a profit. But if you take one person into that casino and have them bet everything a hundred times in a row, they will eventually lose it all. Once you have nothing, you cannot place the next bet. The game stops for you.

  The economists in the room might object. They'll say that 2008 was a one-off deal. A single shot. They'll argue that when you only have one turn, you should play for the biggest average payout, because there is no 'next time' to worry about.

  But that misunderstands what this society is. We are not a gambler placing a single bet. We are a club that intends to last forever. For us, there is always a next time. There is next year's subscription, next decade's claims, and the next generation of members. The reserve fund isn't just capital; it is our ticket to stay in the game. If you lose the reserve, you don't just have a bad year; you cease to exist. You cannot recover from zero.

  Dot understood that the goal wasn't to make us as rich as possible in 2009. The goal was to make sure we were still here in 2009.

  I know there are people in this room who think finance is about maximising returns. And there are people who think finance is about making sure the bar remains open during the annual dinner. I'd like to propose a toast to the auditors here tonight; you're the only people I know who can look at a balance sheet and smile, which is comforting, because usually that means you've found a mistake we can afford.

  Jokes aside, Dot had a rule. She called it the 'one bad winter' rule. No single decision could ever cost more than a fifth of what it would take to rebuild us. She always said the question is never whether a bet is good, only how much of it you can afford to be wrong about.

  That isn't squeamishness. That is stewardship.

  In 2008, the world learned that institutions which chase the highest average return often end up with the worst possible outcome: extinction. Dot looked at that deal and saw that the price of being wrong was too high. She protected the society's future against its own greed. She understood that growth means nothing if you aren't around to enjoy it.

  So, to the economists and the auditors: you may calculate the expected value of a bet. But Dot calculated the value of expectation. She expected us to be here, today, twenty-six years later, safe and sound.

  To Aunt Dot. Thank you for keeping us in the game.
