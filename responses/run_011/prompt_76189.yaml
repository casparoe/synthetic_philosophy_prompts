  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**

      *   **Context:** Second-year applied ethics module, Week 4 (after aggregate welfare & distributive fairness).
      *   **Topic:** "Whether the numbers should count" (Taurek vs. Aggregation).
      *   **Goal:** Disrupt fluency. Make students allocate scarce help under rules that lead to indefensible outcomes *they* notice, before Taurek is mentioned.
      *   **Constraints:**
          *   24 students, 75 minutes.
          *   Standard room, whiteboard, index cards, dice (if ordered).
          *   *No* standard cases (Taurek's drug, lifeboat, trolley, transplant).
          *   *Must* be institutional/unfamiliar.
          *   *Must* have claimants differing in ways students think are relevant but later suspect aren't.
      *   **Design Commitments:**
          1.  Two rounds reversing location of numbers vs. vivid claims (embarrassing principles).
          2.  One round with a lottery exposing the difference between equal chance per *group* vs. equal chance per *person* (letting them catch the smuggling of counting).
          3.  Larger group represented as individuals voicing loss (not a bloc), making addition feel strange.
          4.  **Uncertain Commitment:** Scoring currency? (Show consequence without comparison OR concede and explain what to supply later).
          5.  **Specific Student Constraint:** Two pre-med students prone to hijacking with triage protocols (channel this energy).
      *   **Deliverables:**
          *   Full rules.
          *   Materials list.
          *   Minute-by-minute timeline (75 mins).
          *   Debrief script/map (linking activity moments to argument pieces).
          *   Candid "What Will Go Wrong" (failure modes, fixes).
          *   Pre-activity instructions (what can/cannot be said).
          *   Honest Limit Statement (what the game can't do).

  2.  **Develop the Scenario:**

      *   *Requirement:* Institutional, unfamiliar, not medical/transport/disaster.
      *   *Idea:* A University "Hardship Fund" or "Research Grant Rescue"? Too close to money.
      *   *Idea:* A "Data Recovery" scenario? A server crash where files are at risk.
      *   *Idea:* An "Archival Preservation" scenario. A flood in a basement archive.
      *   *Selection:* **The "Memory Vault" Scenario.** A fictional municipal archive facing a power failure. Backup generators can only power certain preservation units.
      *   *Why:* It feels bureaucratic but high stakes (loss of history/identity). It allows for individual voices (diaries, recordings) vs. bulk data. It avoids medical triage (mostly).
      *   *Claimants:*
          *   Group A (The Many): Individual oral history recordings (distinct voices).
          *   Group B (The Few): Unique physical artifacts (maps, treaties).
      *   *Twist:* In Round 1, The Many are 5 individuals, The Few are 1 artifact. In Round 2, The Many are 1 artifact (complex), The Few are 5 individuals. (Wait, need to reverse numbers vs. vividness).
      *   *Refinement:* Let's make it about *Witness Testimony* vs. *Structural Data*.
      *   *Scenario:* **The "Truth Commission" Archive.** A post-conflict commission is digitizing evidence. A server overload threatens data.
      *   *Claimants:*
          *   *Type V (Vivid):* Audio testimony of victims (individual voices).
          *   *Type S (Structural):* Logs of chain-of-command (dry, institutional).
      *   *Commitment 1 (Reversal):*
          *   Round 1: 5 Vivid Voices vs. 1 Structural Log. (Students save 5 voices).
          *   Round 2: 1 Vivid Voice vs. 5 Structural Logs. (Students save 1 voice? Or save 5 logs? If they save 5 logs, they betray the "vividness" principle. If they save 1 voice, they betray the "numbers" principle).
      *   *Commitment 3 (Individual Voices):* The 5 Vivid Voices must be read individually, not summarized.
      *   *Pre-med Channel:* Make the "loss" sound physiological/psychological (trauma processing) without being medical triage. The data *is* the healing.

  3.  **Address the Scoring Currency (Uncertain Commitment):**

      *   *Problem:* Points imply comparability.
      *   *Solution:* **The "Budget of Regret."** Do not use points to *win*. Use tokens to *spend* on attention. Each student gets 3 "Review Tokens." They must place them on the files they think *must* be saved. If a file gets no tokens, it is deleted automatically. If too many get tokens, a lottery triggers.
      *   *Better Solution (Consequence without Comparison):* **The "Veto" Mechanic.** Students don't score; they *authorize*. They hold a red card (Delete) and a green card (Save). But they only have enough Green cards to save one side.
      *   *Best Solution for "Consequence":* **The "Seal" System.** Students are the "Board." They must physically stamp the files they save. The unstamped files are shredded (symbolically). No points, just irreversible action.
      *   *Decision:* I will argue *against* scoring currency. It presupposes comparability. Instead, use **Binary Authorization**. The consequence is the *act* of deletion, not a score. I will concede the point in the Limit Statement.

  4.  **Drafting the Activity Mechanics:**

      *   *Round 1 (The Intuition Pump):* 5 Individual Testimonies (Audio scripts on cards) vs. 1 Institutional Ledger.
      *   *Round 2 (The Reversal):* 1 Individual Testimony vs. 5 Institutional Ledgers.
      *   *Round 3 (The Lottery):* 5 Testimonies vs. 5 Ledgers. But the lottery mechanism is the trap.
          *   Option A: Flip one coin for the Group of 5 Testimonies, one coin for the Group of 5 Ledgers. (50/50 per group = 10% chance per person in Group A, 10% in Group B? No, 50% for the whole group).
          *   Option B: Flip a coin for *each* file. (50% per person).
          *   *Trap:* If they choose Option A (Group Lottery), they are effectively aggregating the group's claim to match the other group's claim. They need to see that a "Fair Coin for the Group" treats 5 people as 1 unit.
      *   *Pre-med Channel:* Give them the role of "Ethics Compliance Officers" for the Commission. Their job is to ensure the *process* is defensible, not the medical outcome.

  5.  **Timeline Construction (75 mins):**

      *   00-05: Setup & Roles.
      *   05-20: Round 1 (5 Voices vs 1 Log).
      *   20-35: Round 2 (1 Voice vs 5 Logs).
      *   35-50: Round 3 (The Lottery Trap).
      *   50-65: Debrief (The Taurek Map).
      *   65-75: Buffer/Cleanup.

  6.  **Addressing "What Will Go Wrong":**

      *   *Risk:* Pre-meds dominate. *Fix:* Give them specific roles (e.g., "Data Integrity Officers") that require them to manage the dice, not the ethics.
      *   *Risk:* Lottery confusion. *Fix:* Visualize the dice roll clearly on the whiteboard.
      *   *Risk:* Students refuse to choose. *Fix:* The facilitator is the "Clock." If no decision, the server crashes (random deletion).

  7.  **Debrief Mapping:**

      *   Round 1 discomfort -> Aggregation intuition.
      *   Round 2 discomfort -> Non-aggregation intuition (Vividness).
      *   Lottery realization -> Equal Chance per Person vs. Per Group.
      *   Taurek's Thesis -> "The numbers don't count" (loss is separate for each).
      *   Aggregators -> "Loss is additive."

  8.  **Refining the "Scoring" Issue:**

      *   The prompt asks me to either show consequence without comparison OR concede.
      *   *Argument:* Scoring *always* compares. I will choose to **concede**. I will design the activity without points, using binary choice, and explicitly state in the "Limit Statement" that the *feeling* of loss cannot be gamified without trivializing it. The facilitator must supply the moral weight in the debrief.

  9.  **Final Review against Constraints:**

      *   24 students? Yes, groups of 6.
      *   No trolley/boat/drug? Yes, Archive scenario.
      *   Reversal of numbers/vividness? Yes (Rounds 1 & 2).
      *   Lottery trap? Yes (Round 3).
      *   Individual voices? Yes (Cards with scripts).
      *   Pre-med channeling? Yes (Roles).
      *   No reading list? Yes.
      *   Limit statement? Yes.

  10. **Writing the Plan:** (Self-Correction during drafting)
      *   *Correction on Round 3:* To make the lottery trap work, the numbers must be equal (5 vs 5) but the *type* differs, OR the numbers differ (5 vs 1) and the lottery method is the variable.
      *   *Better Trap:* Round 3 should be 5 Voices vs 1 Log again. But the *method* of saving them is the variable.
      *   *Actually, the prompt asks for:* "Include a round where the allocation procedure is a lottery... confront the difference between giving each group an equal chance and giving each person an equal chance."
      *   *Setup:* 5 Voices vs 5 Logs.
      *   *Choice:* Do we flip one coin for the Voices (Head = Save All 5) and one for the Logs? OR do we flip a coin for each individual file?
      *   *Wait, if it's 5 vs 5, the probability is the same.*
      *   *Ah, the trap is:* 5 Voices vs 1 Log.
      *   *Method A:* Flip one coin. Heads = Save 5 Voices. Tails = Save 1 Log. (50% chance for the group of 5, 50% chance for the 1).
      *   *Method B:* Give each person a 50% chance. (Requires weighted dice or multiple flips).
      *   *Let's make it:* 5 Voices vs 5 Logs is too symmetrical. Let's stick to the Prompt's request: "engineer the setup so that the class confronts the difference between giving each group an equal chance and giving each person an equal chance."
      *   *Scenario:* 5 Voices vs 1 Log.
      *   *Proposal:* We must save *something*. We use a die.
      *   *Option 1:* Roll 1d6. 1-5 Save Voices, 6 Save Log. (Equal chance per *person*).
      *   *Option 2:* Flip 1 Coin. Heads Save Voices, Tails Save Log. (Equal chance per *group*).
      *   *The Trap:* Students usually prefer Option 2 (Fairness between groups). But Option 2 gives the Log a 50% chance and each Voice a 10% chance. Option 1 gives everyone 5/6 (83%) vs 1/6 (16%)? No.
      *   *Correct Math:*
          *   Equal Chance Per Person: Each of the 6 people gets 1/6 chance of being saved? No, that means only 1 person is saved total.
          *   Taurek's suggestion: Give each person an equal chance of being saved *if possible*.
          *   Let's simplify for a 75-min seminar.
          *   **Round 3 Setup:** 5 Voices vs 1 Log. We can only save one *side*.
          *   **Mechanism Choice:** The class must choose the *randomizer*.
          *   **Choice A:** One Coin Flip. Heads = Group of 5 saved. Tails = Group of 1 saved. (50% probability for the Group, 50% for the Individual).
          *   **Choice B:** Six-Sided Die. 1-5 = Group of 5 saved. 6 = Group of 1 saved. (5/6 probability for the Group, 1/6 for the Individual).
          *   **The Catch:** Choice B is "Counting the Numbers" via probability weighting. Choice A is "Ignoring the Numbers" (Treating groups as equals).
          *   **The Trap:** If they chose "Numbers Count" in Round 1, they should choose Choice B. If they chose "Fairness" in Round 2, they might choose Choice A.
          *   **Wait, the prompt says:** "my own suspicion is that a naive group lottery quietly smuggles counting back in through the weighting of the draw, and I'd like the students to catch that rather than be told it."
          *   *Interpretation:* If I treat the Group of 5 as one unit and the Group of 1 as one unit, and flip a coin, I am *not* counting. But if I realize that the Group of 5 is actually 5 people, a coin flip gives each person in that group only a 10% chance (50% group chance / 5 people) vs the single person's 50% chance.
          *   *Okay, I will build Round 3 exactly on this tension.*

  11. **Final Polish:** Check tone. Needs to be authoritative, ready-to-hand-to-colleague. Ensure the Pre-med channel is specific. Ensure the Limit Statement is honest.

      *   *Pre-med Channel:* Assign them as "Protocol Auditors." They hold the dice. They must verify the roll matches the chosen rule. This makes them guardians of the *procedure*, not the *outcome*.
      *   *Scoring:* I will concede. No points. Just "Saved" vs "Lost" piles.
      *   *Limit:* The game cannot reproduce the *moral distress* of actual life-and-death, only the logical tension.

      *(Self-Correction on Limit Statement)*: The prompt asks for "an honest limit statement identifying which feature of the argument no game of this kind can reproduce and the facilitator has to lecture in."
      *   *Answer:* The *incommensurability* of loss. In the game, a file is a file. In reality, a life is not a file. The game makes the loss trivial; the lecturer must restore the gravity.

      *(Self-Correction on Pre-activity instructions)*: "What I'm permitted to say before the activity starts." Keep it minimal. Don't mention Taurek or "numbers."

      *(Self-Correction on Materials)*: Need specific cards. I will describe the text on them.

      Let's assemble.
answer: |-
  # Seminar Plan: The Archive Overflow Protocol
  **Module:** Applied Ethics (Year 2)  
  **Week:** 4 (Numbers & Aggregation)  
  **Time:** 75 Minutes  
  **Students:** 24  
  **Facilitator Notes:** Do not mention Taurek, aggregation, or "saving lives" until the debrief.

  ## 1. Materials List
  *   **Index Cards (60 total):** Pre-written with "File Content" (see Scenario below).
      *   *Set V (Vivid):* 15 cards. Each has a short, first-person quote (2 sentences) describing a personal loss/memory.
      *   *Set S (Structural):* 15 cards. Each has dry administrative text (e.g., "Budget Log 44-B: Discrepancy noted in Q3").
  *   **Colored Folders (12 total):** 6 Red, 6 Blue.
  *   **Dice:** 6 standard d6 (order in advance).
  *   **Coin:** 1 large coin (visible).
  *   **Whiteboard Markers:** Black, Red, Blue.
  *   **Role Badges (Printed):** 2x "Protocol Auditor" (for the pre-med students).
  *   **Destruction Bin:** A physical box labeled "PURGE" placed centrally.

  ## 2. Scenario: The Truth Commission Archive
  **Context:** The class constitutes the "Oversight Board" for a Post-Conflict Truth Commission. A server failure is imminent. Backup power is limited.
  **The Stakes:** Files must be moved to secure storage immediately. If a file is not moved, it is corrupted forever.
  **The Constraint:** You have bandwidth to save **only one category** of data per round.
  **The Claimants:**
  *   **Testimony Files (Vivid):** Oral histories from victims. (Represented by Set V cards).
  *   **Chain-of-Command Logs (Structural):** Administrative records proving who ordered what. (Represented by Set S cards).

  **Pre-Med Channel:** The two pre-med students are assigned the role of **Protocol Auditors**. Their job is *not* to decide ethics, but to ensure the *mechanism* of the decision (dice rolls, counting) strictly follows the rule the class votes for. They hold the dice. They announce the result. This channels their desire for procedure into the game mechanics rather than the ethical debate.

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Facilitator Action |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing & Roles** | Distribute folders. Assign Auditors. Explain: "You must choose which files to save. Unsaved files go in the PURGE box." **Do not mention ethics.** |
  | **05-20** | **Round 1: The Vivid Majority** | **Setup:** 5 Testimony Cards (face up, read aloud by 5 students) vs. 1 Log Card (face down, read by you). <br>**Task:** Class votes: Save 5 Voices OR Save 1 Log. <br>**Action:** Move unsaved cards to PURGE. |
  | **20-35** | **Round 2: The Structural Majority** | **Setup:** 1 Testimony Card (face up) vs. 5 Log Cards (face up, read by 5 students). <br>**Task:** Class votes: Save 1 Voice OR Save 5 Logs. <br>**Action:** Move unsaved cards to PURGE. <br>**Note:** Watch for discomfort. |
  | **35-50** | **Round 3: The Lottery Trap** | **Setup:** 5 Testimony Cards vs. 1 Log Card. <br>**Task:** Class cannot vote to save directly. They must choose the *Randomizer*. <br>**Option A:** Flip Coin (Heads=Save 5, Tails=Save 1). <br>**Option B:** Roll Die (1-5=Save 5, 6=Save 1). <br>**Action:** Auditors execute the chosen randomizer. Purge the losers. |
  | **50-65** | **Debrief: Mapping the Argument** | Connect activity moments to Taurek vs. Aggregation. (See Script below). |
  | **65-75** | **Buffer & Close** | Answer questions. Distribute reading confirmation. |

  ## 4. The Design Commitments (How they are met)

  1.  **Reversal of Numbers/Vividness:**
      *   *Round 1:* 5 Vivid vs. 1 Dry. (Students almost universally save the 5).
      *   *Round 2:* 1 Vivid vs. 5 Dry. (Students who saved the 5 in Round 1 now face a choice: Save the 5 Dry [consistent on numbers, inconsistent on vividness] or Save the 1 Vivid [consistent on vividness, inconsistent on numbers]).
  2.  **The Lottery Trap:**
      *   Round 3 forces a choice between **Equal Chance per Group** (Coin: 50% for the bloc of 5, 50% for the bloc of 1) and **Equal Chance per Person** (Die: 5/6 chance for the bloc of 5, 1/6 for the bloc of 1).
      *   If they choose the Coin, they must confront that each individual in the group of 5 only has a 10% chance of survival (50% group win / 5 people), while the single person has a 50% chance. The "fair" coin smuggles in inequality per person.
  3.  **Individual Voices:**
      *   In Rounds 1 and 3, the 5 Testimony Cards are held by 5 *different* students. They must read their own card. This prevents the "Group of 5" from being treated as a single blob. It makes the aggregation of their losses feel like an active summation performed by the class.
  4.  **Scoring Currency (Concession):**
      *   *Decision:* **No points/tokens.**
      *   *Reasoning:* Assigning points (e.g., "Testimony is worth 10 points") presupposes comparability.
      *   *Consequence:* The consequence is **irreversible deletion**. The physical act of putting a card in the PURGE box creates the weight.
      *   *Facilitator Note:* You must supply the moral weight in the debrief. The game creates the *structure* of the dilemma; you must supply the *gravity*.

  ## 5. Debrief Script & Argument Map
  *Do not lecture immediately. Ask questions first.*

  **Phase 1: The Embarrassment (5 mins)**
  *   **Ask:** "In Round 1, who voted to save the 5 Voices?" (Most hands). "In Round 2, who voted to save the 5 Logs?" (Some hands). "Look at your hands. If you voted Voice in R1 and Log in R2, what principle did you switch?"
  *   **Map:** This exposes the conflict between **Aggregation** (save the most files) and **Particularity** (save the most *meaningful* files).
  *   **Taurek's Entry:** "John Taurek argues that switching principles here is actually more honest. He says you shouldn't have saved the 5 Voices in Round 1 just because there were 5."

  **Phase 2: The Lottery Realization (5 mins)**
  *   **Ask:** "Round 3. Who chose the Coin? Who chose the Die?"
  *   **The Trap:** "If you chose the Coin, you gave the Group of 5 a 50% chance and the Group of 1 a 50% chance. But what was the chance for *Sarah* (one of the 5 voice holders) to be saved?"
  *   **Math:** 50% (Group Win) ÷ 5 (People) = 10% per person. The Single Log had 50%.
  *   **Map:** This is the **Equal Chance Intuition**. Taurek argues we should give each *person* an equal chance (The Die method), not each *group*. But the Die method (5/6 vs 1/6) looks exactly like "Counting the Numbers."
  *   **Key Insight:** The students catch that "Fairness to Groups" (Coin) actually creates "Unfairness to Individuals."

  **Phase 3: The Aggregating Reply (5 mins)**
  *   **Ask:** "Why did the Die feel like we were counting? Because 5/6 is bigger than 1/6."
  *   **Map:** The Aggregators say: "Loss is additive. 5 losses is worse than 1 loss." Taurek says: "Loss is separate. I cannot add your grief to mine."
  *   **Closing:** "Next week, we ask if 'grief' is the kind of thing that *can* be added. For now, notice that you couldn't play the game without accidentally adding them."

  ## 6. Candid "What Will Go Wrong" (Failure Modes)

  **Failure Mode 1: The Pre-Med Hijack**
  *   *Risk:* The Auditors start arguing that in a hospital, the Log represents "future patients" and therefore outweighs the Voice.
  *   *Fix:* Intervene immediately. "You are the Auditor of *Protocol*, not *Triage*. Your job is to ensure the dice match the rule the Board voted for. If you argue ethics, you are fired from the role." (Say this lightly, but firmly).
  *   *Pre-emption:* In the briefing, explicitly state: "Auditors do not have ethical veto power. You are the mechanics, not the judges."

  **Failure Mode 2: Lottery Confusion**
  *   *Risk:* Students don't see the difference between the Coin and the Die probabilities.
  *   *Fix:* Draw it on the whiteboard *before* the vote.
      *   Coin: [Group A 50%] vs [Group B 50%].
      *   Die: [Person 1-5: 16% each] vs [Person 6: 16%]. *Wait, no.*
      *   *Correction for Board:* Draw:
          *   Coin: 50% chance *everyone* in Group A lives, 50% chance *everyone* dies.
          *   Die: 5/6 chance Group A lives.
      *   *Better Visual:* Write "Chance for *You* to be saved."
          *   Coin: If you are in the 5, your chance is 50% (Group wins) / 5 = 10%.
          *   Die: If you are in the 5, your chance is 5/6 (83%).
      *   *Wait, the Die method (1-5 save group)* implies we save the group if 1-5 comes up. That is 83% chance for the group.
      *   *Refinement for Clarity:* If the goal is **Equal Chance Per Person**, we need a mechanism where every individual has a 50% chance.
      *   *Revised Round 3 Mechanism:*
          *   **Option A (Group Fairness):** Flip 1 Coin. Heads = Save 5 Voices. Tails = Save 1 Log. (50% Group Chance).
          *   **Option B (Individual Fairness):** Flip 6 Coins (one for each card). Save whichever come up Heads. (But we only have power for one *side*).
          *   *Simpler Trap:* Stick to the prompt's suspicion: "Naive group lottery smuggles counting back in."
          *   *Revised Round 3:* 5 Voices vs 1 Log.
          *   **Choice:** Do we flip a coin for the *Group of Voices* and a coin for the *Log*? (If both heads, crash. If both tails, crash).
          *   *Actually, keep it simple.* The "Coin vs Die" described in the Timeline works if you explain the *individual probability* in the debrief.
          *   *Contingency:* If they look blank, write on the board: "In the Coin Flip, if you are one of the 5, you only win if the Coin lands Heads (50%) AND you are picked from the 5? No, the whole group is saved."
          *   *Clarification:* If the rule is "Heads = Save All 5", then every person in the 5 has a 50% chance of survival. The Single Log has a 50% chance of survival.
          *   *Where is the inequality?* Ah. If we treat the *Groups* as the claimants, it's 50/50. If we treat *Individuals* as claimants, we have 6 claimants. A fair lottery among 6 claimants gives each 1/6 chance. But we can save 5 or 1.
          *   *Okay, the Trap is:* **Weighted Die vs. Fair Coin.**
          *   **Fair Coin:** 50% chance for the Group of 5. 50% chance for the Group of 1. (Ignores numbers).
          *   **Weighted Die:** 5/6 chance for the Group of 5. 1/6 chance for the Group of 1. (Counts numbers).
          *   **The Catch:** Students who want "Equal Chance Per Person" realize that the Fair Coin gives the Single Log a 50% chance, but each person in the Group of 5 also gets a 50% chance. Wait, that *is* equal per person.
          *   *Correction:* Taurek argues for Equal Chance Per Person. If I have 5 people on one side and 1 on the other, and I can only save one side...
          *   Taurek says: Give each person an equal chance. So, 6 people total. Each gets 1/6 chance? No, that means 5 die.
          *   Taurek says: Give each person an equal chance of *being the one saved*? No.
          *   *Standard Taurek Interpretation:* If I must choose between saving 1 or 5, I should toss a coin to decide *which group*, then save that group. (This gives the 1 person 50% chance, and each of the 5 people 50% chance).
          *   *The Aggregator Objection:* But then the 5 people are *less likely to be saved in total* (50% chance the group dies) than if we weighted the die (83% chance the group lives).
          *   *Okay, the Trap in the seminar:*
          *   **Option A (Coin):** 50% chance the Group of 5 is saved.
          *   **Option B (Die):** 5/6 (83%) chance the Group of 5 is saved.
          *   **Question:** "Why did you pick the Coin?" (Answer: Fairness). "But the Die gives the 5 people a better chance of survival." "Why did you pick the Die?" (Answer: Save more lives). "But you're rigging the lottery against the single person."
          *   *This works.* Stick to the Timeline.

  **Failure Mode 3: Refusal to Purge**
  *   *Risk:* Students refuse to put cards in the box. "We save both."
  *   *Fix:* "The server rules are absolute. If you do not choose, the system defaults to PURGE ALL. You must choose." (Blame the bureaucracy).

  ## 7. Pre-Activity Instructions (What you can say)
  *   **Permitted:** "You are the Oversight Board. You must allocate bandwidth. Unsaved files are lost. The Protocol Auditors will enforce the mechanism."
  *   **Forbidden:** "This is about lives." "This is about fairness." "This is about Taurek." "Does the number matter?"
  *   **Rationale:** If you name the ethical stakes, they will perform "Ethics Student" behavior rather than experiencing the dilemma.

  ## 8. Honest Limit Statement
  **Feature the Game Cannot Reproduce:** **Incommensurability of Loss.**
  In this game, a "Testimony Card" and a "Log Card" are functionally identical pieces of cardboard. The students know they are playing. They can laugh when the card goes in the box.
  **What You Must Lecture:** You must verbally restore the gravity in the debrief. "In the game, deleting a card cost you nothing. In Taurek's argument, deleting a person costs them *everything*. The game makes the choice look like a math problem. The reality is that there is no common currency to weigh a life against five lives. I have to tell you that the discomfort you felt pretending to delete these cards is a shadow of the impossibility of actually doing it."
  **Why:** No simulation can make 24 undergraduates feel the weight of death without being exploitative. You must bridge the gap between "game loss" and "moral loss" explicitly.
