  A moral philosopher will contest Slave_trade's argument share (25). They posit abolition was a triumph of moral conscience over profit. However, assigning argument 25 acknowledges that moral reasoning existed for centuries without success. Abolition required the convergence of naval enforcement (law: 25) and shifting industrial economics (interest: 35). Moral argument provided the language, but law and interest provided the leverage. Crediting argument with more than 25 points obscures the institutional coercion required to make conscience effective against entrenched capital. The moral revolution was incomplete without the Royal Navy.
