answer: |-
  Subject: Re: The fairness impossibility stalemate

  I have been thinking about your description of the reading group stalemate, and I want to offer a direct diagnosis rather than a diplomatic compromise because I think the fatigue you are feeling comes from treating this as a single disagreement when it is actually two distinct claims layered on top of each other. Your hunch that the camps are talking about different objects is correct, but I do not think the distinction lies primarily between score functions and decision rules, nor is it merely a verbal dispute about what constitutes the algorithm. The core fault line is a disagreement about the modal status of base rates, specifically whether they are to be treated as exogenous constraints or endogenous variables. The ML side is operating within a frame of non-ideal theory where the statistical properties of the population are fixed facts that must be accommodated by the engineering design, while the philosophy side is operating within a frame of ideal or structural theory where those statistical properties are themselves outcomes of prior social processes that ought to be the target of intervention. When the ML group says the theorem is deep, they mean that given the world as it currently is, you cannot satisfy multiple fairness criteria simultaneously. When the philosophy group says the theorem is trivial or damaging, they mean that accepting the world as it currently is is a political choice that reifies existing inequality, and that focusing on the mathematical tradeoff distracts from the possibility of changing the base rates themselves.

  This explains why waving the same equations at each other produces no movement. The equations are valid conditional on the base rates being fixed, so the ML side is mathematically correct, but the philosophy side is normatively correct that the conditionality is the contested point. The sociotechnical group you mentioned is essentially trying to expand the boundary of the system to include the base rate generation process, which is why they feel the others are confused, but they often fail to provide a actionable alternative for the immediate deployment decision, which is why they feel like a third position that does not engage. To call this a verbal dispute would be to underestimate the substantive disagreement about whether a model should reflect reality or correct it, but to say one side is simply wrong about what the result says is also incorrect because both sides understand the math but disagree on its scope of application. The ML side is guilty of abstraction, treating the prediction task as a closed box, while the philosophy side is guilty of dismissal, treating the engineering constraint as irrelevant because the box should not exist in its current form.

  Progress in your group would require explicitly separating the question of allocation fairness from structural fairness. You need a formal or conceptual distinction that allows you to say the impossibility result is binding for the specific task of allocating a scarce resource under current conditions, while simultaneously acknowledging that those conditions are unjust and should be changed upstream. This might look like adopting a framework of layered accountability where the modelers are responsible for transparency about the tradeoffs imposed by the base rates, while the policymakers are responsible for justifying why those base rates are being accepted as inputs. If you can agree that the theorem describes a constraint on *allocation mechanisms* but not on *social systems*, the ML group can stop feeling accused of bad faith for acknowledging the math, and the philosophy group can stop feeling accused of denying reality for pointing out the structural causes. You might even find it useful to formalize this by modeling base rates as mutable variables with a cost function attached to changing them, which would turn the impossibility result into an optimization problem over both thresholds and population statistics, though I suspect the philosophy group might resist quantifying the cost of structural change.

  I am about eighty-five percent confident in this diagnosis because it aligns with similar stalemates in public policy and economics where efficiency constraints clash with equity goals, and the resolution almost always involves distinguishing between short-term optimization and long-term structural reform. The point I am least sure about is whether the philosophy group will accept a distinction that allows the ML group to proceed with deployment under the current base rates, as some critical perspectives view any participation in the current system as complicity regardless of how transparent the tradeoffs are. If their objection is fundamentally about the legitimacy of the prediction task itself rather than the framing of the fairness metrics, then no amount of conceptual clarification will resolve the normative disagreement, and you may have to accept that the group is fundamentally divided on whether the technology should be used at all.
