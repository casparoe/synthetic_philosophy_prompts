  # Final Examination: Population Ethics and Infinite Cases

  **Time Allowed:** 3 Hours
  **Word Limit:** 1200 words of prose (computations excluded)
  **Total Marks:** 25

  **Question 1**

  Consider worlds $W$ as functions from locations $n \in \{0, 1, 2, ...\}$ to welfare values in $[0, 10]$. Let $S_n(W) = \sum_{i=0}^n W(i)$. We evaluate four ranking rules:

  *   **R1 ($\delta$-discounting):** $W \succ V$ iff $\sum \delta^n W(n) > \sum \delta^n V(n)$ for fixed $\delta \in (0,1)$.
  *   **R2 (Limit Overtaking):** $W \succ V$ iff $\lim_{n \to \infty} (S_n(W) - S_n(V)) > 0$.
  *   **R3 (Limsup Overtaking):** $W \succ V$ iff $\limsup_{n \to \infty} (S_n(W) - S_n(V)) > 0$.
  *   **R4 (Ultrafilter):** Fix a free ultrafilter $\mathcal{U}$ on $\mathbb{N}$. $W \succ V$ iff $\{n : S_n(W) > S_n(V)\} \in \mathcal{U}$.

  **Worlds:**
  *   **A:** 1 everywhere.
  *   **B:** 2 at $n=0$, 1 elsewhere.
  *   **C:** 2 everywhere.
  *   **D:** 1 at even $n$, 0 at odd.
  *   **E:** 0 at even $n$, 1 at odd.
  *   **F:** 1 everywhere, except 0 at $n=2^k$ ($k \ge 0$).

  **Conditions:** Strong Pareto, Anonymity (permutation invariance), Completeness, Transitivity, Determinacy (ranking settled by welfare alone, no free mathematical parameters).

  **(a)** Rank worlds A–F under each rule (R1–R4). Show compact computation. (8 marks)
  **(b)** For each rule, identify satisfied and violated conditions. Provide explicit counterexamples for violations. Specifically: demonstrate the D-vs-F ranking flip under R1 at $\delta=0.5$ and $\delta=0.9$; construct a 3-world cycle for R3; construct a 2-world pair where each is better than the other under R3. (9 marks)
  **(c)** Essay: R4 appears to satisfy Pareto, Completeness, and Transitivity, unlike R1–R3. Does it solve the problem of arbitrariness or relocate it? Discuss D-vs-E under R4, the hidden bias of R3 compared to R1, and the distinction between "incomparable" and "equally good" in R2. Argue whether hidden arbitrariness is worse than advertised machinery. (8 marks)

  ***

  # Model Answer

  **(a) Rankings**

  **R1 ($\delta$-discounting):**
  Values are geometric sums. $V(A) = 1/(1-\delta)$. $V(B) = 2 + \delta/(1-\delta) > V(A)$. $V(C) = 2/(1-\delta) > V(B)$.
  $V(D) = \sum \delta^{2k} = 1/(1-\delta^2)$.
  $V(F) = 1/(1-\delta) - \sum \delta^{2^k}$.
  Ranking: C $\succ$ B $\succ$ A. D and F depend on $\delta$ (see part b). D and E are equal ($V(E) = \delta/(1-\delta^2) < V(D)$).
  *Order:* C $\succ$ B $\succ$ A $\succ$ D $\succ$ E. (F varies).

  **R2 (Limit Overtaking):**
  $S_n(C) - S_n(A) = n+1 \to \infty$. C $\succ$ A.
  $S_n(B) - S_n(A) = 1 \to 1$. B $\succ$ A.
  $S_n(D) - S_n(E)$ oscillates (1, 0, 1, 0...). Limit DNE. Incomparable.
  $S_n(F) - S_n(A) = -\sum_{2^k \le n} 1 \to -\infty$. A $\succ$ F.
  *Order:* C $\succ$ B $\succ$ A $\succ$ F. (D, E incomparable).

  **R3 (Limsup Overtaking):**
  Same as R2 where limits exist.
  $S_n(D) - S_n(E)$: Sequence 1, 0, 1, 0... Limsup 1. D $\succ$ E.
  $S_n(E) - S_n(D)$: Sequence 0, 1, 0, 1... Limsup 1. E $\succ$ D.
  *Order:* C $\succ$ B $\succ$ A $\succ$ F. D $\succ$ E and E $\succ$ D.

  **R4 (Ultrafilter):**
  Agrees with R2 where limits exist (cofinite sets are in $\mathcal{U}$).
  For D vs E: $\{n : S_n(D) > S_n(E)\}$ is the set of Even numbers.
  If Evens $\in \mathcal{U}$, D $\succ$ E. If Odds $\in \mathcal{U}$, E $\succ$ D.
  *Order:* C $\succ$ B $\succ$ A $\succ$ F. (D vs E depends on $\mathcal{U}$).

  **(b) Conditions and Counterexamples**

  **R1:** Satisfies Transitivity, Completeness, Pareto.
  *Violates Anonymity:* A $\succ$ D, but D is a permutation of A (shift).
  *Violates Determinacy:* Ranking depends on $\delta$.
  *D vs F Flip:*
  At $\delta=0.5$: $V(D) = 1/(0.75) \approx 1.33$. $V(F) \approx 2 - (0.5+0.25+0.06) \approx 1.19$. **D $\succ$ F**.
  At $\delta=0.9$: $V(D) = 1/(0.19) \approx 5.26$. $V(F) \approx 10 - (0.9+0.81+0.65...) \approx 5.7$. **F $\succ$ D**.
  The rule is a family, not a unique ranking.

  **R2:** Satisfies Anonymity, Pareto, Transitivity, Determinacy.
  *Violates Completeness:* D and E are incomparable (limit DNE). Note: Incomparable $\neq$ Equally Good.

  **R3:** Satisfies Completeness, Pareto.
  *Violates Transitivity (Cycle):*
  $W_1$: (1, 0, 1, 0...), $W_2$: (0, 2, 0, 2...), $W_3$: (0, 0, 3, 0...).
  $S_1-S_2$: (1, -1, 0, -2...). Limsup 1 $\implies W_1 \succ W_2$.
  $S_2-S_3$: (0, 2, -1, 1...). Limsup 2 $\implies W_2 \succ W_3$.
  $S_3-S_1$: (-1, -1, 1, 1...). Limsup 1 $\implies W_3 \succ W_1$.
  *Violates Asymmetry (Two-Way):*
  $X$: (1, 0, 1, 0...), $Y$: (0, 1, 0, 1...).
  $S_X-S_Y$ limsup 1 $\implies X \succ Y$. $S_Y-S_X$ limsup 1 $\implies Y \succ X$.

  **R4:** Satisfies Completeness, Transitivity, Pareto.
  *Violates Anonymity:* If Evens $\in \mathcal{U}$, D $\succ$ E. But E is a permutation of D.
  *Violates Determinacy:* Ranking depends on choice of $\mathcal{U}$.

  **(c) Essay: The Cost of Machinery**

  R4 appears superior to R1–R3 because it delivers a complete, transitive ordering satisfying Pareto, avoiding R2's incompleteness and R3's intransitivity. However, R4 does not solve the problem of arbitrariness; it relocates it from the ranking rule to the mathematical infrastructure. Determinacy requires the ranking be settled by welfare alone. R4 fails this because the ranking of D vs E depends entirely on whether the set of even numbers belongs to the free ultrafilter $\mathcal{U}$. Since $\mathcal{U}$ is not unique (its existence relies on the Axiom of Choice), the "better" world is not determined by the ethics of the situation but by an arbitrary selection of a mathematical object.

  This mirrors the failure of R1. R1 advertises its arbitrariness via $\delta$. As shown in the D-vs-F flip, changing $\delta$ changes the ethical verdict. R1 is honest about this parameter dependence. R3 is more insidious. It settles D over E (limsup 1 vs 0) without any visible parameter. However, this "settlement" is actually a hidden location bias. By prioritizing the limsup, R3 privileges moments where partial sums peak, effectively weighting certain locations over others without explicit justification. It violates transitivity and asymmetry, rendering it logically incoherent as a preference ordering, but even if repaired, its bias is hidden.

  R2's refusal to rank D and E is often misinterpreted as claiming they are equally good. They are not; they are incomparable. This honesty preserves Anonymity and Determinacy at the cost of Completeness. In infinite ethics, Completeness may be too high a price. Demanding a ranking where none is structurally warranted forces the introduction of extra machinery (like $\mathcal{U}$ or $\delta$).

  Is hidden arbitrariness worse than advertised? Yes. R1 forces the ethicist to defend $\delta$. R4 allows the ethicist to claim objectivity while relying on $\mathcal{U}$. R3 claims objectivity while delivering cycles. The "fatal flaw" is not that extra machinery is needed—comparing infinite sums inevitably requires regularization—but that rules like R3 and R4 obscure the normative weight of that machinery. A defensible infinite ethics must either accept incompleteness (R2) or explicitly defend the structural assumptions (R1) rather than hiding them behind set-theoretic existence proofs.

  ***

  # Marking Scheme

  | Move | Marks | Typical Failure |
  | :--- | :--- | :--- |
  | **Part (a): R1 Ranking** | 2 | Fails to note D/F dependency on $\delta$. |
  | **Part (a): R2/R3 Rankings** | 2 | Confuses D/E incomparable (R2) with D/E equal. |
  | **Part (a): R4 Ranking** | 2 | Treats U as fixed rather than conditional (Evens/Odds). |
  | **Part (a): Computations** | 2 | Arithmetic errors in geometric series or partial sums. |
  | **Part (b): R1 Determinacy** | 2 | Misses the D-vs-F flip calculation at specified $\delta$. |
  | **Part (b): R3 Cycle** | 2 | Provides invalid cycle (e.g., transitive chain instead). |
  | **Part (b): R3 Two-Way** | 1 | Fails to show limsup > 0 in both directions. |
  | **Part (b): Condition Checks** | 2 | Misidentifies Anonymity failure for R4. |
  | **Part (c): R4 Arbitrariness** | 2 | Claims R4 solves arbitrariness because it is complete. |
  | **Part (c): R3 Hidden Bias** | 2 | Fails to contrast R3's hidden bias vs R1's explicit $\delta$. |
  | **Part (c): Incomparable vs Equal** | 2 | Treats R2 incompleteness as a failure rather than feature. |
  | **Part (c): Conclusion** | 2 | No clear stance on transparency vs. hidden machinery. |

  **Competent-Looking but Incorrect Answers**

  1.  **"Just let $\delta \to 1$."** (Costs 2 marks): Treating R1 as a limit recovers R2, losing Completeness; it doesn't fix Determinacy.
  2.  **"R4 is fine because the ultrafilter is part of the theory, not the world."** (Costs 2 marks): Violates Determinacy condition explicitly defined in the prompt; ethics shouldn't depend on AC choices.
  3.  **"R2 respects anonymity because it doesn't rank D above E."** (Costs 2 marks): Respecting anonymity requires ranking them equally if they are permutations; incomparability is not equality.
  4.  **"R3 is useful because it always gives an answer."** (Costs 2 marks): Ignores the intransitivity/cycle violation which makes the "answer" logically unusable for choice.
