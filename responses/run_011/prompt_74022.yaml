prompt: |-
  I am the head registrar at a mid-sized museum of decorative arts in Central Europe with roughly forty thousand objects, and I need help turning a metaphysical dispute into something two junior assistants can actually run. Our accession numbering descends from an 1898 register built on a single assumption: an object, once entered, stays numerically itself — one number, one label, one insurance value, one line in any restitution file, one continuous provenance chain. In practice that assumption fails several times a month. We consolidate, re-line, re-mount, replace missing mounts and hardware, reassemble disassembled pieces after exhibition, occasionally deaccession a component, and sometimes discover that a nineteenth-century restorer quietly combined material from two objects in a way nobody recorded. Between the registrar, two assistants and a conservator we make perhaps a dozen "is this still the object we entered under that number?" decisions a month. They are not academic questions. The answer fixes which accession number appears on a loan agreement, whether an insurance schedule lists one object or two, whether a restitution claim filed against a given number can be met by pointing at the thing standing in the gallery, and whether a catalogue entry's chain of custody survives intact. The people who must execute the decision have no philosophical training; one of them has already told me she finds the whole question tiresome. I have about three weeks to install something and about twenty minutes per case; a procedure that takes longer will be ignored, and a procedure that is ignored is worse than none, because it leaves a false record of our having been consistent. A senior curator countersigns outcomes but will not re-derive them.

  A friend of mine who read philosophy at university maintains that our problem is precisely the debate between endurantism and perdurantism, and that this museum has been settling that debate by accident, differently in different departments, for a hundred and twenty years. I would like you to take her seriously enough to build the procedure. Concretely: write a stepwise decision procedure, executable in under twenty minutes by a non-specialist, that tells us (i) when to treat an altered, repaired, split or recombined artefact as the same object as the one already carried under an existing accession number, (ii) when to open a new number, (iii) when to close a number, and (iv) when to record a single object with two distinguishable careers under two numbers that cross-reference each other. It must be grounded in the actual metaphysics rather than in a generic checklist of factors. Along the way, the procedure should make explicit what commitment we incur when we let one accession number carry incompatible properties across decades — an object that is complete at one date and 60 percent modern at another — as against treating it as a dated history whose parts are the units of record; and it should say which of the standard moves in that debate correspond to which registry operations: the worm-style treatment of an object as its whole history, the stage-style treatment under which a dated condition record is its own unit and sameness is a matter of standing in the right relation to another such unit, time-indexed or adverbial attributions of properties, the problem of temporary intrinsics, and the various continuity conditions people argue over. Where a distinction from the debate does no work in a museum, say so plainly and drop it rather than including it for completeness.

  The deliverable should be a numbered list of questions in order, each with what counts as a sufficient answer to it, and with two kinds of exit clearly marked: the point at which the procedure stops and hands the case to the curator because what remains is a matter of institutional values rather than fact — what a restitution claimant is owed, what the public is being told about the object in the case, how much of a collection's history we are willing to have discontinuous — and the point at which it will deliver an answer we dislike. It also has to live inside our collection-management system, which is old and inflexible: each record can hold one current description, an unlimited list of dated events, and a free-text field for relations to other records; it cannot hold branching or nested objects, and it cannot hold a property without attaching it either to the record as a whole or to one of those dated events. Please then run the procedure on three cases. Case one: a late seventeenth-century marquetry cabinet, its carcass original, whose decorative panels were replaced in the 1840s and again in 2019 after a small fire, so that on our current estimate sixty percent of its visible surface is under a decade old while the structure and the locks are original. Case two: two marble portrait busts from the same workshop, both broken and stored as fragments in the early twentieth century, reassembled in 1974 with some fragments from each used in the other; neither bust can now be restored to its own fragments without destroying the other, and one of them is subject to a pending restitution claim. Case three: a kinetic sculpture accessioned in 1968 whose motor, bearings and control unit have all been replaced by successors to the original fabricator, with the artist's estate issuing a certificate that the work remains the same work, and a variant of this case in which the estate refuses to issue any such certificate. Finally, flag explicitly which of your steps are judgment calls dressed up as procedure, and state what the procedure cannot do: it should not pretend to fix monetary value, to settle legal title, or to resolve cases where the material history is simply unrecorded — which is most of our cases — but it should say what to do in that last situation. Please do not give me references or a reading list; I want something my staff can hold in their hands.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Head Registrar at a mid-sized decorative arts museum in Central Europe (40k objects).
      *   **Problem:** The current accession numbering system assumes object permanence (one number = one object forever), but reality involves consolidation, splitting, repair, replacement, and recombination. This creates legal, insurance, and provenance risks.
      *   **Constraints:**
          *   Two junior assistants (no philosophy training, find it tiresome).
          *   Time limit: 20 minutes per case.
          *   Implementation time: 3 weeks.
          *   System: Old CMS (one current description, unlimited dated events, free-text relations, no branching/nested objects, no properties without attachment to record or event).
          *   Output: Numbered stepwise decision procedure, executable, grounded in metaphysics (Endurantism vs. Perdurantism) but practical.
          *   Specific Cases to Test: 17th-c. cabinet (replaced panels), two intermixed marble busts (restitution issue), kinetic sculpture (replaced parts + estate certification vs. no certification).
          *   Requirements: Explicitly state metaphysical commitments, mark exit points (curator decision vs. procedure answer), flag judgment calls, state limitations (value, title, unrecorded history).
          *   Tone: Professional, direct, actionable, no academic fluff/reading lists.

  2.  **Deconstruct the Metaphysics (Endurantism vs. Perdurantism) for Museum Practice:**

      *   *Endurantism (3Dism):* Objects are wholly present at every moment. Change happens to the *same* thing.
          *   *Museum Equivalent:* The Accession Number tracks the "Substance." As long as the "essence" remains, the number stays, even if parts change. (Good for continuity, bad for accuracy of description).
          *   *Risk:* "Theseus's Ship." If everything changes, is it still the same?
      *   *Perdurantism (4Dism/Worm Theory):* Objects are space-time worms. Temporal parts exist.
          *   *Museum Equivalent:* The Accession Number tracks a specific "Stage" or "Time-Slice." A major change creates a new temporal part, potentially requiring a new number or a specific event record that acknowledges a break in identity.
      *   *Stage Theory:* Focuses on the current moment.
          *   *Museum Equivalent:* What is on the shelf *now* is the object. Past states are just history.
      *   *Temporary Intrinsics:* How can an object be "whole" at $t_1$ and "60% new" at $t_2$?
          *   *Museum Solution:* Time-indexed properties in the "Dated Events" field.
      *   *Continuity Conditions:* Spatio-temporal continuity vs. Material continuity vs. Functional continuity.
          *   *Museum Solution:* Need a hierarchy. Material > Functional > Historical Narrative.

      *   *Synthesis for the Procedure:* We need a hybrid. The *Number* usually acts Endurantist (for legal/insurance continuity), but the *Record* must act Perdurantist (to acknowledge material changes). However, when material continuity breaks (splitting/mixing), we must switch to a Stage/Genidentity model (new numbers linked by relation).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* 20 minutes max. Simple language.
      *   *Structure:* Flowchart logic in text form.
      *   *Metaphysical Grounding:* Need to explain *why* a step exists without using jargon in the step itself (or explaining the jargon briefly in the preamble).
      *   *CMS Constraints:* Must fit "One current description," "Dated events," "Free-text relations."

      *   *Step 1: Material Continuity.* Is the majority of the material the same? (Endurantist check).
      *   *Step 2: Functional/Intent Continuity.* If material is gone, is the function/intent preserved? (Aristotelian form).
      *   *Step 3: Separation.* Did it split? (Perdurantist branching).
      *   *Step 4: Recombination.* Did two become one? (Fusion).
      *   *Exit Points:* When do we call the Curator? When the metaphysics doesn't dictate the answer (e.g., restitution ethics, public narrative).

      *   *Refining the Metaphysics:*
          *   *Same Number:* Endurantist persistence. The "Substance" survives change.
          *   *New Number:* Perdurantist stage. The "Time-Slice" is distinct enough to be a new entity.
          *   *Linked Numbers:* Genidentity. Causal connection without strict identity.
          *   *Time-Indexing:* Solving Temporary Intrinsics. Don't say "It is broken." Say "On [Date], it became broken."

  4.  **Developing the Steps (incorporating the constraints):**

      *   *Preamble:* Explain the "Metaphysical Contract."
      *   *Step 1 (The Split Test):* Physical separation. If yes -> New Numbers.
      *   *Step 2 (The Mix Test):* Intermingling. If yes -> New Numbers + Relation.
      *   *Step 3 (The Replacement Test):* Parts replaced. Thresholds needed. (e.g., >50% material? Or critical structural parts?). Let's use "Structural Integrity" vs. "Surface."
      *   *Step 4 (The Authority Test):* Artist/Creator intent. (Crucial for modern art).
      *   *Step 5 (The Legal/Restitution Test):* External claims. (Curator Exit).
      *   *Step 6 (The Record Update):* How to write it in the CMS.

  5.  **Addressing the Specific Cases:**

      *   *Case 1 (Cabinet):* Structure original, panels replaced. Endurantist view holds (Structure = Substance). Number stays. Event record notes replacement.
      *   *Case 2 (Busts):* Mixed fragments. Perdurantist break. Original identities compromised. New numbers needed (or keep one and link?). Restitution complicates this. This is a "Curator Exit" point regarding the claim, but procedurally it's a "New Number + Link."
      *   *Case 3 (Kinetic):* Parts replaced. Estate says "Same." Estate says "Different." Artist intent trumps material in modern art (Conceptualism).

  6.  **Refining for the "20 Minute" and "Junior Staff" Constraint:**

      *   Avoid asking them to define "essence." Ask concrete questions: "Can you remove the new part without destroying the old?" "Is the structural core intact?"
      *   Make the "Curator Exit" very clear. If the answer involves ethics or money, stop.
      *   Make the CMS instructions specific (which field to use).

  7.  **Addressing the "Metaphysical Commitment" Requirement:**

      *   I need to explicitly state: "By keeping the number, you commit to Endurantism (the object survives change)." "By making a new number, you commit to Stage Theory (this is a new temporal stage)."
      *   I need to explain "Temporary Intrinsics": Use the Dated Events field to say "On Date X, Property Y applied."

  8.  **Final Review against Constraints:**

      *   *No references/reading list?* Check.
      *   *Numbered list?* Check.
      *   *Exit points marked?* Check.
      *   *Judgment calls flagged?* Check.
      *   *Limitations stated?* Check.
      *   *Cases run?* Check.
      *   *CMS compatible?* Check.

      *(Self-Correction during drafting)*: I initially thought about suggesting a percentage threshold for material replacement. But in decorative arts, a silver teapot with a new spout is still the teapot, but a teapot melted down and recast is not. Material % is less important than *structural continuity*. I will focus on the "Core vs. Appendage" distinction.
      Also, need to ensure the "Restitution" aspect is handled carefully. If a number is tied to a claim, changing the number might look like hiding evidence. The procedure must flag this as a "Stop and Call Curator" moment.

      *(Refining the Metaphysics explanation)*: Keep it in the preamble/intro to the procedure so the staff understands *why* they are answering these questions, but keep the steps themselves actionable.

      *(Refining the CMS instructions)*: The CMS allows "One current description." This is the trap. If the object changes identity, the description must change. If the number stays, the description updates. If the number changes, a new record is made. The "Dated Events" field is the Perdurantist savior—it allows the history of changes to be recorded without breaking the current record.

      *(Final Polish)*: Ensure the tone is authoritative but empathetic to the staff's boredom. "Do not philosophize. Answer the question."

  9.  **Drafting the Content:** (Mental outline of the response)
      *   **Header:** Procedure Title & Purpose.
      *   **Preamble:** The Metaphysical Contract (briefly explaining Endurantism/Perdurantism in registry terms).
      *   **The Procedure (Steps 1-8):** Logic flow.
      *   **CMS Instructions:** How to data-entry the decision.
      *   **Limitations & Judgment Calls:** Explicit section.
      *   **Case Studies:** Applying the logic.

      *(Wait, one constraint check)*: "Write a stepwise decision procedure... Along the way, the procedure should make explicit what commitment we incur..."
      Okay, I should embed the metaphysical explanations *within* the procedure steps or as annotations to them, so the user sees the connection. I will add "Metaphysical Note" blocks within the procedure to satisfy this without cluttering the decision path for the assistants. Actually, the prompt asks to "make explicit what commitment we incur... along the way." I will add a column or distinct text block for "Registry Commitment" next to the steps.

      *Revised Plan:*
      1.  Introduction (The Metaphysical Contract).
      2.  The Procedure (Numbered Steps with "Action," "Metaphysical Commitment," and "Exit Points").
      3.  CMS Data Entry Protocol.
      4.  Limitations & Judgment Calls.
      5.  Case Studies.

      *Let's refine the "Exit Points".*
      Exit A: Curator Decision (Values/Ethics/Law).
      Exit B: Procedure Answer (Even if we dislike it).

      *Let's refine the "Judgment Calls".*
      I need to admit that "Structural Core" is a judgment call.

