answer: |-
  # PROCEDURE: OBJECT IDENTITY AND ACCESSION NUMBERING (OIAN-2024)

  **To:** Registration Assistants
  **From:** Head Registrar
  **Time Limit:** 20 Minutes per case
  **System:** Legacy CMS (Single Description, Dated Events, Free-Text Relations)

  ## 1. THE METAPHYSICAL CONTRACT
  You are not being asked to solve philosophy. You are being asked to apply a specific metaphysical framework to avoid legal and insurance errors. Our system currently assumes **Endurantism**: the idea that an object is a single "substance" that survives through time even if its parts change. This is why one number lasts forever.

  However, when objects split, mix, or lose their core material, Endurantism fails. In those cases, we must switch to **Stage Theory**: the idea that the object *now* is a distinct "stage" from the object *then*, linked by history but not identical.

  *   **Keeping the Number:** You commit to **Endurantism**. You assert the "Substance" survives. You must use **Time-Indexing** in the Event Log to handle "Temporary Intrinsics" (e.g., do not write "The cabinet is damaged"; write "On [Date], the cabinet was damaged").
  *   **Creating a New Number:** You commit to **Stage Theory**. You assert the current physical state is a new entity. You must use the **Relations Field** to assert "Genidentity" (causal connection without strict identity).
  *   **The "Core" Rule:** We prioritize **Structural Continuity** over **Material Continuity**. A ship with replaced planks is the same ship; a ship melted down and recast is not.

  ---

  ## 2. DECISION PROCEDURE

  **Instructions:** Answer the following questions in order. Stop at the first "EXIT" instruction. If you reach Step 8, you have your answer.

  ### Step 1: The Separation Test
  **Question:** Has the object physically separated into two or more distinct, functional, or displayable units that are no longer joined?
  *   **Yes:** Go to Step 2.
  *   **No:** Go to Step 3.

  ### Step 2: The Split Protocol (Perdurantist Branching)
  **Action:** Assign a **New Accession Number** to each separated unit.
  **Metaphysical Commitment:** **Stage Theory / Branching.** The original "space-time worm" has branched. The original number is **Closed** (do not delete, mark as "Superseded").
  **CMS Entry:**
  *   **Old Record:** Description remains as of last unified state. Event: "Object divided." Relation: "See [New Number A], [New Number B]."
  *   **New Records:** Description reflects current state. Event: "Created from division of [Old Number]." Relation: "Derived from [Old Number]."
  **EXIT TO CURATOR IF:** One of the separated parts is subject to a restitution claim, loan agreement, or insurance schedule that specifically names the *original* number. Do not split the number until the Curator confirms which part satisfies the claim.
  **[EXIT POINT A: INSTITUTIONAL RISK]**

  ### Step 3: The Intermingling Test
  **Question:** Has material from this object been mixed with material from *another* accessioned object such that they cannot be separated without destroying both? (e.g., fragments swapped between two vases).
  *   **Yes:** Go to Step 4.
  *   **No:** Go to Step 5.

  ### Step 4: The Fusion Protocol (Genidentity)
  **Action:** Assign **New Accession Numbers** to the resulting composite objects.
  **Metaphysical Commitment:** **Fusion.** The original identities are lost in the new whole.
  **CMS Entry:**
  *   **New Records:** Description reflects current composite state. Event: "Assembled from fragments of [Old Number A] and [Old Number B]." Relation: "Incorporates material from [Old Number A] and [Old Number B]."
  *   **Old Records:** Event: "Material incorporated into [New Number]." Status: "Deaccessioned (Material Loss)."
  **EXIT TO CURATOR IF:** Either of the source objects is subject to a restitution claim. The Curator must decide if the new composite satisfies the claim or if the claim is now unfulfillable.
  **[EXIT POINT A: INSTITUTIONAL RISK]**

  ### Step 5: The Structural Core Test
  **Question:** Is the primary structural element (carcass, armature, base, main body) original to the accessioned number, even if surface material (panels, upholstery, paint) has been replaced?
  *   **Yes:** Go to Step 6.
  *   **No:** Go to Step 7.
  **Note:** This is a **JUDGMENT CALL**. "Structural Core" is not defined by percentage. It is defined by: "If you remove the new parts, does the old part still stand as the thing we collected?"

  ### Step 6: The Endurantist Maintenance (Same Number)
  **Action:** **Retain the Existing Accession Number.**
  **Metaphysical Commitment:** **Endurantism with Time-Indexing.** The object persists through change.
  **CMS Entry:**
  *   **Description:** Update to reflect *current* state only (e.g., "Cabinet with 2019 panels").
  *   **Event Log:** Add dated event: "[Date]: Replacement of [Part]. Material: [New Material]. Reason: [Conservation/Damage]."
  *   **Constraint:** Do not write "Object is now 60% new." Write "On [Date], 60% of surface replaced." This solves the **Problem of Temporary Intrinsics** by attaching the property to the time, not the object permanently.
  **EXIT TO PROCEDURE ANSWER:** Even if the object looks completely different, if the Core is original, the Number stays. This may feel wrong, but it preserves the provenance chain.
  **[EXIT POINT B: PROCEDURE ANSWER]**

  ### Step 7: The Replacement Threshold (New Number)
  **Question:** Has the structural core been replaced, or has the object been reconstructed from scratch using mostly new material?
  *   **Yes:** Go to Step 8.
  *   **No:** (Return to Step 6).

  ### Step 8: The Authority Test (Artist/Creator Intent)
  **Question:** Is there a living artist, estate, or original manufacturer who has issued a statement on the object's identity?
  *   **Yes (Certificate of Authenticity/Identity exists):** Follow the Certificate. If they say it is the same work, keep the Number (Step 6). If they say it is a new version, make a New Number (Step 2).
  *   **No (No statement or Estate Refuses):** Treat as a **New Object**. Assign **New Accession Number**.
  **Metaphysical Commitment:** **Conceptualism.** For modern/kinetic works, the "Idea" overrides the "Substance." Without the Idea's validation, the Substance is just scrap.
  **CMS Entry:**
  *   **New Record:** Link to old record in Relations field: "Successor to [Old Number]."
  *   **Old Record:** Event: "Components replaced. Identity superseded by [New Number]."
  **EXIT TO CURATOR IF:** The Estate refuses to issue a certificate *but* implies the work is still valid (ambiguity). The Curator must decide if we exhibit it as the original or as a replica.
  **[EXIT POINT A: INSTITUTIONAL RISK]**

  ---

  ## 3. CMS DATA ENTRY PROTOCOL
  *   **Current Description Field:** Must describe the object **as it stands today**. Do not preserve historical descriptions here. This is the **Stage** view.
  *   **Dated Events Field:** This is the **Worm** view. Use this to record the history of changes. Every time you change the Description, you must add an Event explaining why.
      *   *Format:* `[YYYY-MM-DD]: [Action]. [Material Change]. [Authority/Reason].`
  *   **Relations Field:** Use this for **Genidentity**.
      *   *Format:* `[Relation Type]: [Accession Number].` (e.g., "Supersedes: 1898.45", "Incorporates: 1920.12").
  *   **Insurance/Value Field:** Always update to current value. Do not average old and new. If a New Number is created, the Old Number's value becomes zero (or salvage value).

  ---

  ## 4. LIMITATIONS AND JUDGMENT CALLS

  **What This Procedure Cannot Do:**
  1.  **Monetary Value:** This procedure determines *identity*, not *value*. A "Same Number" object with 90% new material may be worth less than a "New Number" replica. Valuation is for the Insurance Officer, not Registration.
  2.  **Legal Title:** Changing a number does not fix bad title. If an object was stolen, keeping the number does not make it ours.
  3.  **Unrecorded History:** If we do not know *when* a change happened, you must record the Event as "Undated: Discovery of [Condition] during [Date of Inspection]." Do not guess dates.
  4.  **The "Core" Judgment:** Step 5 requires you to decide what the "Structural Core" is.
      *   *Guidance:* For furniture, it is the carcass/joinery. For ceramics, it is the vessel wall (not the glaze). For paintings, it is the canvas/support (not the paint). If you are unsure, **Exit to Curator**.

  **Explicit Judgment Calls Dressed as Procedure:**
  *   **Step 5 (Structural Core):** This is the most vulnerable step. It assumes a hierarchy of parts (Structure > Surface). This is an Aristotelian assumption, not a fact.
  *   **Step 8 (Authority):** This privileges the Artist's word over material reality. In decorative arts, this is often unavailable. In modern art, it is absolute.

  ---

  ## 5. CASE STUDY APPLICATIONS

  ### Case 1: The Marquetry Cabinet (17th C., panels replaced 1840s & 2019)
  *   **Step 1 (Separation):** No. It is one unit.
  *   **Step 3 (Intermingling):** No.
  *   **Step 5 (Structural Core):** **Yes.** The carcass and locks (structure) are original. The panels (surface) are not.
  *   **Decision:** **Retain Existing Number.**
  *   **Metaphysical Commitment:** Endurantism. The "Substance" (carcass) persists.
  *   **CMS Action:**
      *   Update Description: "Marquetry cabinet, 17th-c. carcass, 2019 marquetry panels."
      *   Add Event: "2019-05-10: Replacement of fire-damaged panels. 60% of visible surface now modern."
      *   Add Event: "1840-XX-XX: Historical replacement of original panels."
  *   **Risk:** Insurance may undervalue if they assume "17th C." means "17th C. material." Ensure the Description clarifies the date of materials.

  ### Case 2: The Intermixed Marble Busts (Two originals, fragments swapped 1974, Restitution pending on one)
  *   **Step 1 (Separation):** No, they are assembled.
  *   **Step 3 (Intermingling):** **Yes.** Fragments from Bust A are in Bust B and vice versa. They cannot be separated.
  *   **Step 4 (Fusion):** **EXIT TO CURATOR.**
  *   **Reason:** Restitution claim is pending on one of the source numbers.
  *   **Metaphysical Commitment:** Stage Theory / Fusion. The original identities are technically lost.
  *   **Procedure Answer (If no restitution):** Close both old numbers. Open two new numbers. Link both new numbers to both old numbers in Relations field ("Incorporates material from...").
  *   **Procedure Answer (With restitution):** The Curator must decide if returning the "Bust A" number satisfies the claimant even if it contains "Bust B" stone. This is a legal/ethical decision, not a metaphysical one. **Do not proceed with numbering until Curator signs off.**

  ### Case 3: The Kinetic Sculpture (1968, parts replaced, Estate involved)
  *   **Variant A (Estate Certifies "Same"):**
      *   **Step 5 (Core):** No (Motor/Bearings replaced).
      *   **Step 8 (Authority):** **Yes.** Estate says "Same."
      *   **Decision:** **Retain Existing Number.**
      *   **Metaphysical Commitment:** Conceptualism. The "Work" is the idea, certified by the Estate. The material is replaceable.
      *   **CMS Action:** Update Description to "1968 work, 2023 components." Event: "2023-01-01: Replacement of drive system per Estate Certificate #123."
  *   **Variant B (Estate Refuses Certificate):**
      *   **Step 5 (Core):** No.
      *   **Step 8 (Authority):** **No.**
      *   **Decision:** **Assign New Accession Number.**
      *   **Metaphysical Commitment:** Materialism. Without the Conceptual validation, the object is merely a machine made of new parts.
      *   **CMS Action:** New Record. Relation: "Replica/Successor to [Old Number]." Old Record Event: "Functionally obsolete. Superseded by [New Number]."
      *   **Risk:** Public may view this as the "same" sculpture. Curator must decide if we exhibit it as the original work or as a functioning reconstruction.

  ---

  ## 6. FINAL INSTRUCTIONS TO STAFF

  1.  **Do not argue with the metaphysics.** If the procedure says "New Number," create the new number. If you think it is "still the same object," record that opinion in the Event Log as a note, but follow the numbering rule.
  2.  **Respect the 20-Minute Limit.** If you are stuck on Step 5 (Structural Core) for more than 10 minutes, **Exit to Curator**. Indecision is more dangerous than a debatable decision.
  3.  **False Consistency is Dangerous.** It is better to have two linked numbers with a clear explanation than one number that implies a false history. If the procedure forces a New Number, do not try to merge them back later to "clean up" the database.
  4.  **Restitution is a Hard Stop.** Any time a restitution claim, loan, or insurance policy is mentioned, stop the procedure and alert the Curator. Numbering decisions in these cases are legal strategies, not registration tasks.

  **Signed:**
  Head Registrar
  **Date:** [Current Date]
