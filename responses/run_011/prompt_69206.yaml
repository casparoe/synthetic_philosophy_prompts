prompt: |-
  So I'm the program director at a small family foundation in Ohio, we give away about eight million a year, mostly in one metro area plus a handful of rural counties. Last fall we got a bequest with no strings attached, roughly $2M, and the board wants a recomendation from me in April. There's two obvious places to put it. One is a job-training program we've funded for six years; it went through a proper randomized evaluation a couple years back and the results were good — not transformative, but real, people who completed it were earning meaningfully more three years out than the control group. It's the only thing in our portfolio where I can point at a number and not feel like I'm lying. The other option is a scrappy nonprofit that does long-term mentoring for kids who have a parent incarcerated. No evaluation, no theory-of-change document, they've never even tracked how many of the kids stay in the program past a year. But everyone who's seen it up close says it changes lives, and my sister basically had one of these — a neighbor who raised her for four years while my mom was in and out of treatment, and my sister is the only person in my family who ended up stable.

  My friend R, who is deep in the effective altruism thing, says this is an easy call and that I'm being sentimental: multiply out the expected value, weight by the strength of the evidence, fund the proven thing, and if you feel bad about your sister's situation do something about it on your own dime. I tried to take him seriously. I spent a whole weekend on a spreadsheet. And here's what happened — every time I extended the consequences past about five years, the sign flipped depending on assumptions I had no way of checking. Does the guy earning $12k more a year have more kids or fewer? Does he move out of the county, hollowing out the place we were trying to help, or stay and become the kind of person who coaches little league and shows up at council meetings? Does the mentored kid go to college and leave, or stay and eventually run for school board? I could build a case in either direction on every one of these with equal confidence and equal evidence, which I've started to think means I wasn't building a case at all, I was just writing down what I already wanted and adding decimals. And the honest truth is that the numbers we put in our grant templates past year three are made up. Everyone in this field knows they're made up. We just don't say it out loud.

  What bugs me even more, though, is that R's advice seems to have this property where it can never lose. If I fund the training program and it scales, someone will run another evaluation in ten years and it will show a positive effect, because that's the effect we know how to measure, and everything else will have washed out invisibly. If I fund the mentoring program and it turns out to have been the most important $2M anyone ever spent, nobody will ever know, including me. So the decision procedure recommends itself and then marks its own homework. So: is R wrong, and if he is what do I actually put in front of the board in April? Because "you can't know the consequences so go with your gut" is not something I can say to people who have a fiduciary duty and will ask me, reasonably, why I didn't fund the one program with an RCT behind it. Is there a way to make this call that isn't either fake math or vibes? Or is the real answer that I should be arguing to the board on some basis other than consequences entirely — and if so, what would I even say?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **Role:** Program Director at a small family foundation in Ohio.
      *   **Budget:** ~$8M/year giving.
      *   **Geography:** One metro area + handful of rural counties.
      *   **The Decision:** How to allocate a $2M unrestricted bequest.
      *   **The Options:**
          1.  *Job-Training Program:* Funded for 6 years, RCT done, positive results (earnings +$12k/yr at 3 years), measurable, "proven."
          2.  *Mentoring Program:* Scrappy nonprofit, kids with incarcerated parents, no evaluation/data, anecdotal evidence strong, personal resonance (sister's experience).
      *   **The Conflict:** Effective Altruism (EA) friend ("R") says fund the proven one (maximize EV, evidence-based). User feels the math breaks down over long time horizons (uncheckable assumptions, "fake math"), and suspects the EA framework is self-justifying (measures what it measures, ignores the rest).
      *   **The Constraint:** Needs a recommendation for the Board in April. Board has fiduciary duty. "Go with your gut" is not an acceptable justification.
      *   **The Core Question:** Is R wrong? How to make this call without fake math or pure vibes? Should the argument be non-consequentialist?

  2.  **Deconstruct the Arguments:**
      *   **R's Argument (EA/Utilitarian):** Maximize expected value based on available evidence. Evidence exists for Job Training, not Mentoring. Therefore, Job Training. Personal sentiment is bias.
      *   **User's Counter-Argument:** Long-term consequences are unknowable. Metrics are proxies. "Proven" effects might be narrow or have negative externalities (brain drain, etc.). Unmeasured effects (social cohesion, stability) might be more valuable but invisible to RCTs. The EA framework biases towards the measurable, not necessarily the *most important*.
      *   **The Board's Perspective:** Fiduciary duty, risk management, impact, legacy. They need a defensible rationale.

  3.  **Evaluate "Is R Wrong?":**
      *   R isn't *wrong* about the principle of evidence. Evidence is good.
      *   R *is* wrong (or incomplete) about the *sufficiency* of that evidence for *this specific context*.
      *   *Context Matters:* A small family foundation in a specific geography is not a global utilitarian calculator. Place-based philanthropy has different goals than global poverty alleviation.
      *   *Measurement Bias:* RCTs measure what is easily measured (income), not necessarily what is most valuable (community stability, intergenerational trauma breaking).
      *   *Diminishing Returns:* If the job program is already funded, does an extra $2M scale it effectively, or does it hit a bottleneck? (User didn't specify, but worth considering).
      *   *Portfolio Approach:* Foundations don't make single bets; they manage portfolios.

  4.  **Develop a Framework for the Board:**
      *   Avoid "Fake Math" (pretending to know 20-year outcomes).
      *   Avoid "Pure Vibes" (my sister liked it).
      *   Need a *Strategic Rationale*.
      *   *Key Concept:* **Portfolio Theory & Risk Diversification.**
      *   *Key Concept:* **Place-Based Philanthropy vs. Global Maximization.**
      *   *Key Concept:* **Evidence Hierarchy (RCT vs. Qualitative/Practice-based).**
      *   *Key Concept:* **Capacity Building.**

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the user's insight. They are right that long-term modeling is often "fake math." They are right that EA has a measurement bias. This builds trust.
      *   **Addressing R:** R isn't "wrong" per se, but his framework is mismatched to the foundation's mission. EA is for *maximizing global good*; Family Foundations are often for *strengthening specific communities*.
      *   **The "Fiduciary" Argument:** How to justify the Mentoring program to the Board without lying about numbers.
          *   *Argument 1: Portfolio Diversification.* Don't put all eggs in one basket. One proven, one high-risk/high-reward.
          *   *Argument 2: The "Measure What Matters" Trap.* Acknowledge the limits of the RCT. Income isn't the only metric of community health.
          *   *Argument 3: Capacity Building.* The mentoring org is "scrappy." $2M could professionalize them, *creating* evidence later.
          *   *Argument 4: Place-Based Mission.* If the goal is a thriving *Ohio community*, keeping people connected (mentoring) might be more valuable than income growth that leads to out-migration.
      *   **The Recommendation:** Don't choose *one*. Split it? Or frame the choice as a strategic pivot.
          *   *Option A (Split):* $1.5M to Proven, $500k to High Potential. (Safe).
          *   *Option B (The "Bet"):* Fund the Mentoring org *with conditions* (evaluation support). This turns the "vibes" play into a "learning" play.
      *   **The Board Pitch:** How to phrase it. "Strategic Risk," "Learning Investment," "Community Cohesion."
      *   **Philosophical Underpinning:** Consequentialism is fine, but *uncertainty* requires a different approach. Robustness vs. Optimization.

  6.  **Refining the Tone:**
      *   Professional, peer-to-peer (Program Director to Program Director).
      *   Respectful of the Board's fiduciary duty.
      *   Critical of EA without being dismissive.
      *   Action-oriented (what to put in the April deck).

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, is $2M too much for a scrappy org?* Yes, likely. A sudden 10x budget increase can kill a small nonprofit. I need to mention *absorptive capacity*.
      *   *Is the Job Training program saturated?* If they've been funded 6 years, maybe they need less money now?
      *   *The "Sister" factor:* Keep it professional. Don't lead with "my sister," lead with "intergenerational trauma and stability." The personal story informs the intuition, but the argument must be systemic.
      *   *The EA Critique:* The user's critique of EA (measurement bias) is a known critique (Goodhart's Law). Validate that.

  8.  **Final Plan:**
      *   Validate the user's skepticism about long-term modeling.
      *   Reframe the decision from "Which is better?" to "What is our strategy?"
      *   Offer three concrete paths for the Board recommendation (Split, Conditional Grant, Strategic Pivot).
      *   Provide the language for the Board memo (Fiduciary prudence + Strategic vision).
      *   Address the EA friend directly but respectfully.

  9.  *(Self-Correction during drafting)*: Make sure I don't just say "split the difference." That's cowardly. The user wants to know how to justify the *mentoring* program specifically if that's where their heart is, or how to choose rationally. I should offer a way to fund the mentoring program *responsibly*. The key is **Capacity Building + Evaluation**. Turn the "vibes" org into a "data" org over time. That satisfies the Board's need for rigor and the User's intuition about value.

  10. **Final Polish:** Ensure the distinction between *maximizing* (EA) and *satisficing/robustness* (Foundation strategy) is clear.

  *(Drafting response based on these thoughts...)*
answer: |-
  You have put your finger on the open secret of institutional philanthropy: **long-term impact modeling is almost always ex-post rationalization dressed up as ex-ante strategy.** Your friend R is operating under a utilitarian framework that works well for global health interventions (bed nets, deworming) where the causal chain is short and biological. It breaks down in community development, where the causal chain is long, social, and deeply context-dependent.

  R is not "wrong" about evidence. But he is wrong about **what counts as evidence** and **what your foundation's objective function actually is.**

  Here is how you handle this without lying to the board, without succumbing to fake math, and without ignoring your fiduciary duty.

  ### 1. Diagnose the Mismatch (For Yourself)
  R's framework assumes your goal is to *maximize global utility per dollar*. That is not your goal. You are a place-based family foundation. Your goal is likely **community vitality in a specific geography.**

  *   **The Job Training Program:** Increases individual income. But as you noted, if that income leads to out-migration (brain drain), it might actually *hollow out* the specific community you are tasked with serving. An RCT measures the individual outcome, not the community equilibrium.
  *   **The Mentoring Program:** Targets intergenerational trauma and social cohesion. These are leading indicators of community stability, but they are notoriously hard to measure in a 3-year grant cycle.

  R's advice fails because it optimizes for *measurability* rather than *mission alignment*. If your mission is "a thriving Ohio community," stability and social fabric (Mentoring) may be higher leverage than marginal income gains (Job Training), even if the latter has a cleaner spreadsheet.

  ### 2. The Fiduciary Argument (For the Board)
  You cannot walk into the boardroom and say, "My sister's experience suggests this works." You also cannot say, "I modeled the 20-year outcomes."

  Instead, you frame this as **Portfolio Strategy and Risk Management.**

  **A. The "Absorptive Capacity" Constraint**
  A $2M lump sum is dangerous for a "scrappy" nonprofit. If you give it all to the mentoring org, you might kill them with cash (bloat, loss of mission focus). If you give it all to the job program, you might hit diminishing returns (they can only train so many people).
  *   **The Pitch:** "From a risk management perspective, deploying 25% of our annual budget into a single line item requires diversification. We should not concentrate capital risk in one intervention, even a proven one."

  **B. The "Learning Investment" Thesis**
  Foundations have a luxury that governments and corporations do not: **the ability to take risk on high-potential, low-data interventions.**
  *   **The Pitch:** "We already know the job training works. The marginal value of another validation study is low. The marginal value of *discovering* if this mentoring model is scalable is high. We should allocate a portion of this bequest to *convert* the mentoring program from anecdotal to evidence-based."

  **C. The "Community Equilibrium" Argument**
  *   **The Pitch:** "Our mandate is local vitality. Income gains are vital, but social cohesion is the substrate that allows income gains to persist. Investing in children of incarcerated parents addresses a root cause of instability that job training addresses downstream. This is preventative maintenance vs. repair."

  ### 3. The Recommendation Options
  Do not present this as a binary choice. Present it as a strategic allocation. Here are three ways to structure the April recommendation:

  **Option 1: The 70/30 Split (Prudent Diversification)**
  *   **$1.4M to Job Training:** Acknowledges the evidence, secures the "base hit," satisfies the conservative board members.
  *   **$600k to Mentoring:** Structured as a 3-year capacity-building grant.
  *   **The Kicker:** The mentoring grant *includes* funding for an evaluator. You tell the board: "We are not just funding the program; we are funding the *measurement* of the program. If it works, we have a new proven tool. If it doesn't, we learned something valuable for the field."
  *   **Why this works:** It satisfies R's demand for evidence generation while satisfying your intuition about the mentoring value. It protects fiduciary duty by limiting exposure to the unproven model.

  **Option 2: The "Challenge Grant" (Performance-Based)**
  *   Offer the $2M to the mentoring org, but tranche it. $500k now. $500k contingent on implementing a data tracking system. $1M contingent on hitting specific retention milestones (not necessarily life outcomes, just program engagement).
  *   **Why this works:** It forces the "scrappy" org to professionalize without drowning them. It gives the board "off-ramps" if the money is being wasted.

  **Option 3: The Strategic Pivot (High Conviction)**
  *   If you truly believe the job training program has hit diminishing returns (e.g., they have enough demand/capacity for only $500k more), you argue that funding them beyond that is *wasteful*.
  *   **The Pitch:** "Funding a proven program beyond its capacity to execute is not evidence-based; it is inefficiency. The mentoring org has the capacity to use the capital to build infrastructure. We are funding *organizational maturity*, not just program activities."

  ### 4. How to Answer R
  R is relying on **Expected Value (EV)** thinking. But EV requires accurate probability estimates. When you admit you have "no way of checking" the assumptions, the EV calculation is garbage in, garbage out.

  You can tell R: *"You are optimizing for precision over accuracy. The job training numbers are precise but may be measuring the wrong thing for our specific mission. The mentoring numbers are inaccurate but may be measuring the right thing. In a complex adaptive system (a community), robustness is more valuable than optimization. I am choosing the strategy that survives contact with reality, not the one that looks best in a spreadsheet."*

  ### 5. What to Put in the Deck
  Here is the language for your April slide:

  **Title:** Strategic Deployment of Unrestricted Bequest
  **Objective:** Maximize long-term community stability and economic mobility.

  **Analysis of Options:**
  1.  **Scale Proven Intervention (Job Training):**
      *   *Pros:* High confidence in short-term economic outcomes.
      *   *Risks:* Diminishing marginal returns; potential for out-migration of successful participants; does not address upstream instability.
  2.  **Incubate High-Potential Intervention (Mentoring):**
      *   *Pros:* Addresses root causes of intergenerational poverty; aligns with community cohesion goals; high upside if model is validated.
      *   *Risks:* Lack of quantitative data; organizational capacity constraints.

  **Recommendation:** **Hybrid Approach (Option 1 above).**
  *   **Rationale:** A concentrated bet violates prudent capital deployment principles. A split allocation allows us to secure known gains while investing in the *generation of new evidence* for upstream interventions.
  *   **Fiduciary Note:** We are attaching technical assistance funding to the Mentoring grant to ensure data collection standards meet foundation requirements within 24 months. This converts a "vibes" investment into a "learning" investment.

  ### Summary
  You are not being sentimental; you are being **systemic**. R is looking at a single causal arrow (Money -> Training -> Income). You are looking at an ecosystem (Money -> Stability -> Community -> Income).

  The Board doesn't need you to predict the future. They need you to show that you have considered the risks, that you aren't wasting money on something that *can't* work, and that you have a plan to verify if it *did* work. Fund the mentoring, but fund the *evaluation* of the mentoring just as aggressively. That is how you turn gut instinct into fiduciary strategy.
