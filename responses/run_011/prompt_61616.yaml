  **MEMORANDUM**
  **TO:** Protocol Secretary
  **FROM:** Senior Drafter, Ceremonial Division
  **DATE:** October 14, 2024
  **SUBJECT:** Alder Valley Statement (Draft 3)

  1. The Republic of Vess notes the enactment of the 1874 Alder Diversion statute, which modified the river channel and altered the wetland ecology upon which the valley communities relied for subsistence.
  [OLC: "Notes" is observational, not admissions-grade. Replace "relied for subsistence" with "utilized for resource access" to avoid implying a right was violated. If they had a right, compensation is mandatory.]
  [OCR: "Utilized for resource access" sounds like a utility bill. If we do not name the loss of food and water, the Valley will view this as a press release, not an apology. Keep "subsistence."]
  [Drafter: Revised to "depended upon for livelihood."]

  2. On behalf of the current administration, we express deep regret for the hardships resulting from these engineering works and the subsequent dissolution of the Valley Assembly.
  [OLC: "On behalf of the current administration" limits liability to present officers. Do not use "we" without qualification; the 1874 Republic is a distinct legal entity. "Regret" is preferred to "apology." "Hardships" is acceptable; "injuries" implies tort.]
  [OCR: If the current administration did not do it, why are they sorry? If you sever the link to the past state, the sentiment is hollow. The public needs to feel the state accepts continuity of moral responsibility, even if legal liability is barred.]
  [Drafter: Revised to "The State acknowledges a continuity of stewardship regarding the consequences of prior administrations."]

  3. This statement is offered to the descendants of the Valley Assembly, recognizing the Alder Valley Heritage Council and the United Fishers Union as representative interlocutors.
  [OLC: Do not certify representation. These two organizations are currently litigating standing. Naming both implies state endorsement of both claims, which complicates the pending suit regarding riverbed title.]
  [OCR: If we do not name them, who receives this? The Assembly is gone. If we say "to whom it may concern," it looks like we don't know who we hurt. Pick one or acknowledge the dispute.]
  [Drafter: Revised to "offered to the community members residing in the Alder region and their organizational representatives."]

  4. The Republic commits to avoiding the repetition of such disruptions and intends to review the current proposal to raise the weir height within the context of existing budgetary allocations.
  [OLC: "Commitments" create enforceable expectations. The weir is critical infrastructure for the capital's water supply. "Review" is non-binding. Add "within existing budgetary allocations" to ensure no new appropriation is inferred.]
  [OCR: You cannot promise non-repetition while actively planning to raise the weir. This contradicts the apology. If there is no money for remediation, this paragraph is a lie. We need a funded mandate.]
  [OLC: Reiteration: No unfunded mandates. The budget is closed.]
  [Drafter: Revised to "The Republic will consider future impacts in accordance with fiscal constraints."]

  5. It is the hope of the Legislature that this understanding shall endure, subject to the sovereign right of future sessions to amend or withdraw this position as circumstances evolve.
  [OLC: Necessary sovereignty clause. One legislature cannot bind another. This protects against entrenchment claims.]
  [OCR: If you tell them you might take it back next year, why should they believe you today? An apology that can be retracted is merely a policy preference. It undermines the ceremony entirely.]
  [Drafter: Revised to "subject to standard legislative review processes."]

  **As Adopted**

  The Republic of Vess notes the historical enactment of the Alder Diversion statute and the subsequent changes to the region's ecology. The State expresses regret for the difficulties experienced by community members residing in the Alder region during that period. We remain committed to considering future impacts in accordance with fiscal constraints and standard legislative review processes. This statement reflects the current position of the administration regarding the shared history of the Valley. All parties are encouraged to focus on collaborative opportunities for the future.
