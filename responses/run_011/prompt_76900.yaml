  **Node 5:** Is the faculty responsible for this awareness essentially dependent on a bodily organ?
  → **Yes:** Go to Node 6.
  → **No:** Go to Node 8.

  **Node 6:** Do bodily illusions (e.g., rubber hand) show this awareness is malleable to external input?
  → **Yes:** Go to Leaf D.
  → **No:** Go to Node 7.

  **Node 7:** Do pathological cases (e.g., anosognosia) show this awareness can vanish while consciousness remains?
  → **Yes:** Go to Leaf E.
  → **No:** Go to Node 9.

  **Node 8:** Is this faculty operative in human infants and non-human animals?
  → **Yes:** Go to Leaf F.
  → **No:** Go to Node 9.

  **Node 9:** Does the argument license the claim that the self can exist separately from the body?
  → **Yes:** Go to Node 10.
  → **No:** Go to Node 11.

  **Node 10:** Is this separate existence natural to the soul or contingent upon divine intervention?
  → **Natural:** Go to Leaf G.
  → **Contingent:** Go to Leaf H.

  **Node 11:** Is the self merely epistemically distinct from the body rather than ontologically separate?
  → **No:** Go to Leaf I.
  → **Yes:** Go to Node 12.

  **Node 12:** Is the self identical to the awareness itself or the possessor of the awareness?
  → **Identical:** Go to Leaf J.
  → **Possessor:** Go to Node 13.

  **Node 13:** Does this position require the self to be immaterial in all possible worlds?
  → **Yes:** Go to Leaf K.
  → **No:** Go to Leaf L.

  ***

  ## LEAF POSITIONS

  **Leaf A (Node 1-No): Eliminativism / Bundle Theory**
  *Awkward Commitment:* Must explain away the intense intuition of unity without a unifier.

  **Leaf B (Node 3-State): Humean Bundle Theory**
  *Awkward Commitment:* Cannot account for moral responsibility or memory continuity over time.

  **Leaf C (Node 4-Sensation): Sensory Phenomenalism**
  *Awkward Commitment:* Makes self-awareness contingent on sensory fidelity, vulnerable to skepticism.

  **Leaf D (Node 6-Yes): Embodied Illusionism**
  *Awkward Commitment:* Suggests the core self is easily hijacked by visual-proprioceptive conflicts.

  **Leaf E (Node 7-Yes): Neural Dependency Theory**
  *Awkward Commitment:* Risks reducing the first-person perspective to third-person brain states.

  **Leaf F (Node 8-Yes): Continuity Naturalism**
  *Awkward Commitment:* Forces attribution of rational self-reflection to animals lacking language.

  **Leaf G (Node 10-Natural): Avicennan Substance Dualism**
  *Awkward Commitment:* Requires explaining how an immaterial substance interacts with matter without energy transfer.

  **Leaf H (Node 10-Contingent): Theological Occasionalism**
  *Awkward Commitment:* Makes personal survival dependent on constant divine recreation rather than nature.

  **Leaf I (Node 11-No): Materialist Monism**
  *Awkward Commitment:* Struggles to explain the qualitative difference between self-knowledge and body-knowledge.

  **Leaf J (Node 12-Identical): Reflexive Identity Theory**
  *Awkward Commitment:* Collapses the knower into the known, risking infinite regress.

  **Leaf K (Node 13-Yes): Cartesian Dualism**
  *Awkward Commitment:* Faces the interaction problem and the problem of other minds sharply.

  **Leaf L (Node 13-No): Hylomorphic Unity**
  *Awkward Commitment:* Must explain how the form survives the corruption of the matter.

  ***

  ## NOTES ON LOGICAL SPACE

  **Unoccupied Combinations**
  *   **Node 3 (State) + Node 9 (Separate Existence):** This path is structurally possible if you skip Node 10, but philosophically empty. A momentary state cannot possess "separate existence" in the substance dualist sense; separate existence implies persisting identity. Any student landing here is conflating *events* with *entities*.
  *   **Node 2 (Inferred) + Node 4 (Essence):** While structurally open, this combination is rarely occupied. If awareness is inferred from activity (Descartes), the essence is usually derived from the nature of the activity (thinking), not from the *absence* of bodily sensation (Avicenna). Conflating the *Cogito* inference with the Flying Man's essence-stripping leads to category errors about what is being proved.

  **Inseparable Leaves**
  *   **Leaf G (Avicennan) and Leaf K (Cartesian):** While the tree distinguishes them via Node 2 (Presence vs. Inference) and Node 10 (Natural vs. Contingent), in practice, many students collapse these into a generic "Dualism" leaf. The tree forces a distinction: Avicenna's self is *present* before thought (Node 2-Present) and separates *naturally* (Node 10-Natural); Descartes' self is found *through* thought (Node 2-Inferred) and often relies on God for guarantee (Node 10-Contingent/Natural mix). If a student cannot distinguish Presence from Inference, these leaves are functionally identical for them.
  *   **Leaf J (Reflexive Identity) and Leaf L (Hylomorphic Unity):** Both deny strong substance dualism (Node 13-No path for L, Node 11-Yes path for J). They differ on whether the self *is* the awareness or *has* it. However, both face the same awkward commitment regarding survival: if the self is not a separate immaterial substance, its survival after bodily death is metaphysically precarious. They are lumped here only because the tree forces a choice at Node 12, but empirically they occupy adjacent space in contemporary non-dualist debates.

  **Empirical Attachment Points**
  *   **Node 6 (Illusions):** Attacks the claim that self-awareness is independent of bodily mapping. If the rubber hand illusion shifts the "self" location, the Flying Man's void setup is artificial, not revealing essence.
  *   **Node 7 (Pathology):** Attacks the claim that self-awareness is robust. If anosognosia removes self-attribution while consciousness remains, the "I" is a fragile construct, not a primitive substance.
  *   **Node 8 (Animals):** Attacks the claim that this awareness is intellectual/immaterial. If infants/animals have it, it is likely biological/embodied, undermining the leap to immaterial substance at Node 9.
