  # The Settlement Window

  The ledger screen flickered at 03:59, the yellow standby light pulsing like a slow heartbeat. Mara sat with her hands flat on the desk, waiting for the lock. In the silence of the Exchange hall, the hum of the cooling units was the only sound, a low drone that vibrated in the teeth. She had worked the night shift for seven years, since the reform, since the old booths were torn out and replaced with servers. Before that, she had been a clerk in the intake wing, back when men in green coats decided things over coffee stains and mood swings.

  At 04:00 exactly, the screen turned white. The tender window for Case 4920 was closed.

  Mara keyed in her authorization code. The system verified her biometrics, then unlocked the count. A column of figures scrolled down the left side of the monitor: *Total Eligible Shares, Total Tendered, Threshold.*

  The Threshold was fixed at 10,000. It had been fixed for twenty years, adjusted only once for inflation.

  The Total Tendered scrolled to a halt. 10,002.

  Mara exhaled, a short puff of air that fogged the edge of her monitor. Two shares. The exclusion had cleared by a margin of two.

  She reached for the physical ledger, the heavy bound book that served as the hard copy backup. She dipped her pen in the inkwell—a requirement, though nobody knew why—and prepared to transcribe the result. *Case 4920. Status: Excluded.*

  Then she looked at the applicant's name. *J. Aris.*

  She knew the name. Not well, but she knew it. Aris was the man who managed the boiler in her building. Three months ago, the heat had failed during a freeze. He had come up to her door to apologize for the delay, holding a clipboard and a wrench. He had worn a coat that was too thin for the weather. He had asked if she was warm enough. He had not asked for anything else.

  Now, because of 10,002 shares, he would be turned back at the border line at dawn. He would not be allowed to enter the Territory. He would not be allowed to stay.

  Mara set the pen down. The ink blobbed on the page.

  She opened the sub-ledger, the detailed breakdown of the tender. This was the part of the job most registrars skipped. Once the count was published, the case was closed. The algorithm didn't care about the names behind the numbers. But Mara scrolled down the list of IDs.

  Most were institutional. *Housing Trust 44.* *Port Authority Pension.* These were automatic tenders, programmed to vote against admission by default to protect asset values. They accounted for 8,000 of the shares. Standard.

  Then came the individual holders. Small blocks. 10 shares here, 50 there. People who had inherited citizenship from grandparents they never met. People who lived in cities across the ocean, who had never seen the border, who held these shares like old stock certificates in a safety deposit box.

  She scrolled to the bottom of the list, to the final increments that had pushed the count from 9,990 to 10,002.

  *ID: 8892-K. Shares: 10. Tender Time: 03:58.*
  *ID: 1044-L. Shares: 2. Tender Time: 03:59.*

  The last two shares. The decisive margin.

  Mara clicked on ID 1044-L. The ownership record popped up. *Estate of V. Halloway. Beneficiary: M. Halloway. Address: [Redacted - Overseas].*

  She knew the Halloways. They had been founders, original residents. The shares had been distributed at the founding, one per head. Over time, they had fragmented. Some were bought up by funds. Some were lost. Some were inherited by people who didn't know what they owned.

  Mara picked up the office phone. It was a secure line, connected to the registry database. She keyed in the contact number listed for the Beneficiary.

  It rang. Once. Twice. The time zone difference was calculated automatically on her screen: *+14 Hours.* It was mid-afternoon where M. Halloway was.

  A voice answered. Male. Young. Background noise of traffic, a language she didn't speak.

  "Registry Exchange," Mara said. Her voice sounded thin in the large room. "Regarding Case 4920. You hold voting shares."

  There was a pause. "Shares?" The voice switched to the common tongue. "I don't understand."

  "Civic Shares. Territory Authority. You tendered two units against an admission case forty minutes ago."

  "No," the voice said. "I didn't."

  "The record shows a digital signature from your account."

  "I don't have an account. I just got an email yesterday. Said I inherited something. Said I should log in and click the blue button to activate. I clicked it. Is that it?"

  Mara closed her eyes. The blue button. The activation wizard. It was designed to be simple. *Click to Claim Asset.* It didn't say *Click to Vote for Exclusion.* The tender was bundled with the activation. A default setting.

  "You tendered against admission," Mara said. "The case is closed. The threshold was met."

  "So?"

  "So the applicant is excluded. By two shares. Yours were the margin."

  There was a long silence on the line. The traffic noise swelled, then faded. "I don't know what you want me to do. I'm not coming there. I don't want to go there. My grandfather talked about it, but... it's just paper, right?"

  "It's a person," Mara said.

  "It's paper," the voice said. "Look, I have to go. I'm at work. Can I sell them? Is that what this is? Do you want to buy them?"

  "The window is closed."

  "Okay. So call me when it opens again."

  The line went dead.

  Mara held the receiver for a moment, listening to the dial tone, then placed it back in the cradle. She looked at the ledger. *Status: Excluded.*

  She thought about Krell, her supervisor from the early days of the Exchange. He had been a man of thick glasses and thicker files. He had defended the system when the protests started, when people called it a market in human beings.

  "You think this is cold," Krell had told her once, tapping his pen on a stack of rejection forms. "But do you know what warm looks like? Warm looks like Officer Denny letting a family through because the woman reminded him of his sister. Warm looks like Officer Gales denying a worker because he didn't like the cut of his jacket. Whim, Mara. That's what warmth is. It's corruption with a heartbeat."

  He had been right. Before the shares, the border was a maze of bribes and moods. You could wait for years and be turned away because a clerk was hungry. Now, the price was public. The threshold was fixed. You could see exactly how much objection was required to stop a life. It was transparent. It was appealable. You could trace the shares.

  But you couldn't talk to them.

  Mara looked at her own drawer. She opened the top left compartment. Inside lay two certificates, cream-colored paper with gold embossing. Her mother's shares. Inherited. She had held them for ten years. For the first five, she had tendered them every time, voting to exclude, because that was what responsible citizens did. They protected the community.

  Then, five years ago, she had stopped. She hadn't sold them. She hadn't tendered them. She just let them sit. By not acting, she was voting for inclusion. Inclusion was the default. Inclusion happened when nobody bothered.

  She had bothered enough to keep them. But not enough to use them.

  She looked back at the screen. 10,002. If she had tendered her two shares, the count would have been 10,004. It wouldn't have changed the outcome. If she could have withdrawn two shares from the pool, the count would have been 10,000. Exactly the threshold. The rule stated: *If the tendered shares reach a stated threshold, the applicant is excluded.* Equal to threshold meant exclusion. She would have needed to withdraw three shares to save him.

  She didn't have three. She had two.

  She was powerless, not because the system was broken, but because it was working exactly as designed. The authority to exclude had been unbundled, sliced into thin tradable units, and scattered to the wind. It was owned by people who didn't know they owned it. It was exercised by algorithms and default settings. There was no one to beg. No officer to bribe. No heart to warm.

  Mara stood up. Her chair scraped against the floor, a harsh sound in the quiet hall. She walked to the window. Outside, the sky was beginning to lighten, a pale grey washing over the perimeter fence. Somewhere out there, at the gate, Aris would be waiting. He would be checking his watch. He would be hoping the boiler job was waiting for him when he got back.

  She returned to the desk. She took the physical ledger and closed it. The leather cover made a soft thud. She took her pen and wiped the nib on a rag.

  Then she opened her drawer again and took out her two shares. She held them in her hand. They were light, almost weightless. They represented the right to say *no*. To say *stop*. To say *you cannot pass.*

  She walked to the waste bin beside her desk. It was empty, lined with a fresh black bag. She held the certificates over the bin.

  She did not drop them.

  She turned back to the desk, opened the drawer, and placed the certificates inside. She took a small metal weight from her pencil cup—a paperweight shaped like a sphere—and placed it on top of the certificates. She pushed the drawer shut until it clicked.

  Mara sat down. She keyed the command to publish the count to the public board. The screen flashed *Confirmed.*

  She picked up her pen again, dipped it in the ink, and began the verification for the next case. The light outside grew stronger, illuminating the dust motes dancing over the ledger, but she did not look up.
