answer: |-
  **TO:** History Advisory Panel
  **FROM:** [Your Name]
  **DATE:** 10th [Month]
  **SUBJECT:** Decision on Opening Wall Panel Text

  **Recommendation**

  Do not approve Draft A, B, or C. Approve the Replacement Text below.

  **Replacement Text (108 words)**

  > In July 1914, Europe's leaders faced a crisis. Some sought advantage. Others feared being left behind. Berlin promised Vienna support against Serbia. Russia mobilised to protect Serbia. Germany declared war on Russia and France. Britain entered when Germany invaded Belgium. Within weeks, millions were fighting. Historians still argue over who wanted this war most. What is clear is that a handful of men made choices that bound millions to fight. This exhibition shows those decisions. It asks us to consider how governments speak for people, and what we owe to the dead who had no say.

  **Why Not A or C?**

  Draft A is historically robust but diplomatically fatal. Our German partners have stated clearly they will not co-sign it. Draft C is too passive. Telling visitors "the verdict is left to you" abdicates our curatorial responsibility. We are not a debate club; we are a museum. We must state what is known. The Replacement Text retains A's specificity about decisions (the Blank Cheque, mobilisation) without asserting psychological intent ("wanted a war"), which satisfies our funder's guidance against collective guilt while avoiding C's vagueness.

  **The Strong Case for Draft B**

  We must not dismiss Draft B simply because it angers the veterans' association. The retired diplomat who wrote it is correct that structural forces mattered. Alliance systems and mobilisation timetables did create a machine that was hard to stop. His draft avoids national shaming, which aids reconciliation. If we treat this exhibition as a tool for peace-building between our towns, B is the safest vehicle. It focuses on the *how* rather than the *who*. However, safety is not accuracy. Removing human agency turns a tragedy into a weather event. We cannot tell visitors that millions died because of a "machine" without mentioning who built it and who switched it on.

  **The Twin Town Objection**

  Is our partner's refusal a veto? In a joint exhibition, yes. Co-curation requires consent. If we insist on Draft A, they will not display it. We will have two different exhibitions, breaking the promise of a shared narrative. This damages the twinning relationship established in the seventies. We should not view this as censorship, but as the necessary friction of international partnership. They are not denying the facts; they are rejecting the attribution of motive. The Replacement Text respects their boundary while maintaining historical fidelity.

  **The Question of Nations**

  Underlying this dispute is whether a nation can bear blame. The men who decided in July 1914 are dead. The town we are twinned with has been rebuilt and repopulated. Assigning collective guilt to a modern population for the actions of an imperial government is morally dubious and historically imprecise. However, institutions carry memory. The German state is the successor to the Imperial government. The Replacement Text focuses on *governments* and *leaders*, not *peoples*. It assigns responsibility to the decision-makers without indicting the current citizens of our twin town.

  **Your Two Insights**

  Both ideas raised in consultation are correct and should guide our interpretation strategy, if not the panel text itself.

  First, the fight is about where the story starts. You are right: begin in 1912, and Berlin looks different than if you begin in Sarajevo. Draft A starts in July. Draft B starts in the 1890s. The Replacement Text starts in July but acknowledges the context of "advantage" and "fear." We should acknowledge this framing in the secondary panels, even if the opening wall cannot hold the nuance.

  Second, the distinction between blame and answerability is the key to solving this. Blame looks backward for a culprit. Answerability asks who owes an account now. Our partner museum owes an account of their history just as we owe an account of ours. The Replacement Text shifts the focus to what we *owe* to the dead. This satisfies the veterans (remembrance), the funders (no collective guilt), and the partners (shared reflection).

  **Next Steps**

  1.  Adopt the Replacement Text.
  2.  Share it with the German director immediately to confirm acceptability before translation.
  3.  Brief the veterans' association on the focus on "decisions" rather than "systems" to mitigate their concerns.

  This text is plain enough for a fourteen-year-old to read standing up, specific enough for historians to accept, and careful enough for our partners to sign. It allows us to open in the autumn.
