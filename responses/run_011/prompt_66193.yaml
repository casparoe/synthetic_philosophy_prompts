      *   *My Diagnosis:* **A substantive core wrapped in verbal disagreement at the edges.** The verbal part concerns the semantics/pragmatics boundary (what counts as "what is said" vs. "implicated"). The substantive core concerns the *architecture of the comprehension system* (modular defaults vs. central interactive processing).

