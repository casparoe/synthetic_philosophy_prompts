  2.  **Deconstruct the Theoretical Landscape:**
      *   **Neo-Gricean (Levinson, Horn):** Generalized Conversational Implicatures (GCIs). They are default, presumptive, attached to linguistic forms (e.g., *some* implies *not all* unless cancelled). They bridge the gap between semantic content and full propositional form. They are *systematic* and *linguistically encoded* in a pragmatic sense.
      *   **Relevance Theory (Sperber, Wilson, Carston):** No code, no defaults. All inference is driven by the Cognitive Principle of Relevance (maximize effects, minimize effort). "Implicature" is strictly particularized. What Neo-Griceans call GCIs are just frequent particularized inferences that *feel* default because the context usually supports them easily. They emphasize *explicature* (development of logical form) over implicature for much of the work done by GCIs.
      *   **The Crux:** Is there a layer of pragmatic inference that is *triggered by linguistic form* independently of specific contextual assumptions (Neo-Gricean), or is *all* pragmatic inference driven by contextual expectations of relevance (RT)?

  3.  **Evaluate the User's Hypothesis (Division of Labor):**
