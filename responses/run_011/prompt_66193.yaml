answer: |-
  ### Diagnosis: A Substantive Core Wrapped in Verbal Disagreement

  Your hypothesis that this is a "division of labor misread as a dispute" is generous, but it does not hold up under scrutiny of the actual commitments of the leading figures. Levinson (Neo-Gricean) does not posit heuristics merely as a theory of linguistic competence; he explicitly claims they are cognitive shortcuts that reduce processing load. Sperber and Wilson (Relevance Theory) do not merely describe cognition; they claim their principle explains the *norms* of communication. Both camps claim to describe the same mechanism: the human comprehension system.

  Therefore, this is not merely two questions under one heading. It is a **substantive core wrapped in verbal disagreement at the edges.**

  **The Verbal Edge:** The camps talk past each other because they draw the semantics/pragmatics boundary in different places. Neo-Griceans classify generalized inferences (e.g., *some* → *not all*) as "implicatures" (pragmatic additions to semantic content). Relevance Theorists classify many of these same inferences as part of the "explicature" (the development of the logical form). When a Relevance Theorist says, "There are no default implicatures," and a Neo-Gricean says, "There are," they are often using "implicature" to refer to different slices of the interpretive pie. This verbal mismatch obscures the empirical claim.

  **The Substantive Core:** Once terminology is normalized, a genuine architectural disagreement remains. It concerns **modularity and automaticity**.
  *   **Neo-Gricean Commitment:** The comprehension system has a dedicated, modular layer of pragmatic heuristics triggered by linguistic forms *prior* to full contextual integration. The system is "defaultist": it generates specific inferences automatically unless stopped.
  *   **Relevance-Theoretic Commitment:** The comprehension system is a unitary, central processor. There is no pragmatic module. Inferences are generated *only* when contextual assumptions make them accessible enough to yield cognitive effects. The system is "contextualist": what looks like a default is merely a high-frequency contextual path.

  The dispute is substantive because it makes incompatible claims about the temporal order of processing: Does the form-triggered heuristic fire *before* the context is fully evaluated (NG), or is the "heuristic" just the result of the context being evaluated so quickly it *looks* default (RT)?

  ### The Sharpest Test Case

  The shared data you list (scalars, *and then*, prolixity) are the battleground, but the sharpest test case is **scalar inferences in context-poor or embedded environments**, specifically measured by **processing latency**.

  **The Case:** The interpretation of *some* in the sentence "Some of the students passed," presented in isolation or with a neutral context.

  *   **Neo-Gricean Prediction:** The inference *not all* is triggered by the lexical item *some* via a Q-heuristic. It should be accessed rapidly, automatically, and with low cognitive cost, even without specific contextual support. Cancellation ("Some, in fact all...") should require extra processing time to suppress the default.
  *   **Relevance-Theoretic Prediction:** The inference *not all* is derived only if the context makes it relevant (e.g., if the hearer needs to know if everyone passed). In a neutral context, the literal/logical meaning ("at least one, possibly all") should be accessed faster or with equal speed, because no extra inferential step is taken unless "paid for" by cognitive effects. Cancellation should not incur a cost because no default was generated to begin with.

  **Why this is the crux:** This isolates the variable of "form-triggering." If *some* triggers *not all* without contextual pressure, the Neo-Gricean architecture is vindicated. If the inference only arises when context demands precision, Relevance Theory is vindicated. Experimental pragmatics (e.g., work by Noveck, Breheny, Katsos) has yielded mixed results here, which explains the stalemate: some studies show defaults are slow (supporting RT), others show they are fast (supporting NG), often depending on task demands.

  ### What Counts as Progress

  Progress will not come from one side "defeating" the other, but from **dissolving the dichotomy through architectural refinement.**

  1.  **Granularity of "Default":** Progress involves acknowledging that "default" is not binary. Some inferences may be semanticized (lexicalized), others may be high-probability pragmatic routines, and others truly ad hoc. A unified theory must account for this gradient.
  2.  **Interface Specification:** Progress requires a precise model of how linguistic form interfaces with contextual assumptions. Is there a "pragmatic module" (as NG implies) or is pragmatics the operation of the central system on linguistic input (as RT implies)?
  3.  **Empirical Convergence:** Progress is a consensus on the processing timeline. If eye-tracking and ERP data consistently show that scalar inferences are delayed relative to semantic processing, the "default" claim weakens. If they appear simultaneously, the "contextualist" claim weakens.

  ### Seminar Advice: Do Not Drop, But Reframe

  **Do not drop the debate.** It is the central problem of the semantics/pragmatics interface. To drop it is to ignore the fundamental question of how mind meets language. However, you must change the framing for next year.

  **Current Frame:** "Neo-Griceans vs. Relevance Theorists: Who is right?"
  **Recommended Frame:** "The Architecture of Inference: Defaults, Context, and Processing."

  **Actionable Changes:**
  1.  **Shift from Philosophy to Psycholinguistics:** Move away from purely intuitive argumentation (which leads to the stalemate you described). Include experimental pragmatics readings (e.g., Bott & Noveck, Gibbs, Van Tiel). Force the students to confront the data that blocks settlement.
  2.  **Focus on the Interface:** Ask students to map exactly *where* in the processing stream each theory posits the inference. This exposes the "division of labor" hypothesis as insufficient because both claim the same stream.
  3.  **Acknowledge the Convergence:** Highlight recent work where Neo-Griceans accept that defaults are probabilistic, and Relevance Theorists accept that some routines are highly automated. The "war" is cooling into a negotiation over parameters.

  If you frame it as a live empirical problem regarding cognitive architecture rather than a philosophical turf war, the seminar will generate insight rather than frustration.

  ### Where the Diagnosis Fails (and Confidence)

  **The Weak Point:** My diagnosis relies on the assumption that "default" and "context-driven" are mutually exclusive architectural features. It is most likely to fail if **Bayesian/Probabilistic models** of pragmatics render the distinction obsolete.

  If pragmatic inference is modeled as rational belief updating based on prior probabilities (where "defaults" are simply priors with very high probability), then the Neo-Gricean "heuristic" and the Relevance-Theoretic "contextual assumption" become mathematically equivalent. In this view, the dispute is not just verbal, it is *theoretical archaeology*—arguing over outdated discrete categories in a continuous probabilistic system. If a student presses the argument that "defaults are just strong priors," my diagnosis of a substantive architectural clash collapses into a disagreement over modeling formalism.

  **Confidence Level:** **High (85%).**
  I am confident that there is a substantive core regarding processing automaticity, as this is empirically testable and currently contested. However, I am less confident that the traditional labels (Neo-Gricean vs. RT) will survive the next decade of probabilistic modeling. The diagnosis holds for the current literature, but the field is moving toward a synthesis that may make your seminar's central dichotomy look like a historical artifact.
