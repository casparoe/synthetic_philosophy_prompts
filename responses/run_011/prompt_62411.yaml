answer: |-
  You have hit on one of the most famous and counter-intuitive findings in behavioral genetics. First off, **your teacher was not fudging, and the data is not junk.** Your intuition about the definition of heritability (population variance, not individual determination) is 100% correct.

  The phenomenon you are describing is real and is often called the **Wilson Effect**. It is robustly replicated: heritability of IQ is low in infancy (~0.2), moderate in childhood (~0.4–0.5), and high in adulthood (~0.6–0.8).

  Here is the resolution to the paradox: **You are assuming that environmental variance is random with respect to genes. In adults, it isn't.**

  Here is the breakdown of why the numbers climb without violating the rules of heritability.

  ### 1. The "Shared Environment" Collapses
  In twin studies, variance is usually split into three buckets (the ACE model):
  *   **A (Additive Genetics):** Your DNA.
  *   **C (Common/Shared Environment):** Things twins share (same parents, same house, same school, same neighborhood).
  *   **E (Non-Shared Environment):** Things unique to the individual (different friends, different teachers, illnesses, accidents).

  **In Childhood:**
  Parents control almost everything. If you have high genetic potential for reading but your parents don't value books, you might not read much. If you have lower potential but your parents force tutoring, you might do better. The **Shared Environment (C)** is a massive force that suppresses genetic differences. It acts like a "leveler." This keeps heritability ($A$) lower because $C$ is taking up a huge chunk of the variance.

  **In Adulthood:**
  You move out. You choose your job, your partner, your city, your hobbies. The **Shared Environment (C)** effect drops to near zero. Statistically, that variance has to go somewhere. Since adults are no longer being "levelled" by their parents' choices, the genetic differences that were always there are finally allowed to express themselves fully.

  ### 2. Active Gene-Environment Correlation (Niche-Picking)
  This is the core answer to your specific confusion. You argued: *"Adults have accumulated way more environmental differences... so the environmental chunk of the variance should be getting bigger."*

  You are right that adults have more *total* environmental variance. But heritability is a ratio:
  $$h^2 = \frac{\text{Genetic Variance}}{\text{Total Variance (Genetic + Environmental)}}$$

  As we age, we engage in **active gene-environment correlation** (also called niche-picking).
  *   A person with a genetic predisposition for high verbal ability seeks out debate clubs, reads more books, and chooses friends who like to talk about ideas.
  *   A person with a different predisposition might choose different social circles or hobbies.

  **The environment stops being an external force acting *on* the person and starts becoming a mechanism *for* the genes.**

  When a high-IQ adult chooses a intellectually stimulating job, is that "environmental variance" or "genetic variance"? Statistically, because the choice was driven by the genetic trait, that variance gets attributed to **Genetics (A)** in the model, not Environment (E).

  So, the reason $h^2$ goes up isn't that the environment stops mattering. It's that **adults select environments that amplify their genetic propensities.** The environment becomes correlated with the genes.

  ### 3. Why this doesn't vindicate the "Individual" view
  This is where your teacher's warning still stands. Even though $h^2$ is 0.8 in adults, you still cannot say "80% of *my* IQ is genes."

  Here is why:
  Imagine two adults with identical genetics. If you force one to live in a house with lead paint and no books, and the other to live in a stimulating home, their IQs will diverge. The environment still determines the *level* of the trait for the individual.

  The heritability of 0.8 only means that **in the current population, under current conditions,** 80% of the *differences* between Person A and Person B are associated with genetic differences.

  Why? Because in our specific society, people with different genes tend to find themselves in different environments. If we lived in a communist utopia where everyone was forced to have the exact same job, diet, and education regardless of preference, the heritability of IQ would drop, because the environmental variance would no longer be correlated with genes.

  ### Summary
  *   **Is the data junk?** No. The Wilson Effect is real.
  *   **Did your teacher lie?** No. Heritability is still about population variance, not individual causation.
  *   **Why does it climb?** Because children are victims of their environment (Shared Environment is high), but adults are architects of their environment (Active Gene-Environment Correlation).
  *   **The Takeaway:** As we get older, we don't escape our environment; we build environments that match our genes. This makes genetic differences look larger in the population statistics, even though environmental interventions could still change an individual's outcome.

  You spotted a genuine paradox that trips up plenty of grad students. The solution is realizing that "Environment" isn't just random noise that happens to you; for adults, it's often a choice driven by the very genes we are trying to measure.
