      *   *Constraint Check:* Localize failure. The output needs a specific code.
      *   *Constraint Check:* Random vs. Systematic. The RA can't determine this alone on one report, but can flag "Known Systematic Risk" if the failure type matches a known protocol bias (e.g., leading questions).
      *   *Constraint Check:* Don't privilege rich reports. Explicit instruction needed.

  6.  **Finalizing the Structure:**

      *   **Header:** Protocol Name, Version.
      *   **Instructions:** Time limit, Mindset (skepticism).
