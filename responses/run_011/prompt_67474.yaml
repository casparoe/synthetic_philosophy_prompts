          *   Distinction: Random error (wash out) vs. Systematic error (correctable direction).
          *   Bias Check: Do not privilege confident/rich reports over vague ones.
          *   Category Error Check: Distinguish measurement failure from attitude settlement (constructive act).
          *   Deliverables: The Procedure, Four Worked Applications, Limits Statement.
          *   Tone: American English, professional, rigorous, pragmatic.

  2.  **Deconstruct the Triage Procedure:**

      *   *Goal:* Filter data quality without making metaphysical claims.
      *   *User:* RA (needs clear criteria, not theoretical nuance).
      *   *Time:* < 10 mins (needs to be checklist-style).
      *   *Output:* Grade (e.g., A, B, C, Reject) + Justification.
      *   *Key Differentiator:* Where did the chain break? (Existence -> Access -> Retention -> Description -> Categorization).
      *   *Systematic vs. Random:* Needs a flag for patterns (though an RA looking at *one* report might struggle here, the procedure needs to account for known systematic biases in the protocol). *Correction:* The prompt asks the procedure to say what the coder is licensed to conclude. If it's a single report, the RA can flag *potential* systematic error based on the *type* of failure.
      *   *Category Error:* Is this a report of a pre-existing state or a construction?

      *Drafting the Steps:*
      1.  **Consistency Check (Internal/External):** Does the report contradict hard data (EEG, eye-tracking) or internal logic?
      2.  **Prompt Influence:** Did the interviewer lead the witness?
      3.  **Retention/Timing:** Was the report immediate or reconstructed later?
      4.  **Phenomenological Plausibility (The "Perplexity" Check):** Does the subject sound confused or overly certain in a way that suggests confabulation?
      5.  **Constructive vs. Descriptive:** Is the subject defining the state or finding it?

      *Refining for the "Localize Failure" requirement:*
      I need specific codes for the failure types:
      *   F1: No State (Confabulation)
      *   F2: Inaccessible (Perplexity)
      *   F3: Not Retained (Memory Decay)
      *   F4: Mis-described (Language mismatch)
      *   F5: Imposed Category (Interviewer bias)
      *   F6: Constructive Act (Category Error - not a measurement failure)

      *Grading:*
      *   **Green:** Usable Data.
      *   **Yellow:** Usable with Caveat (Random Error).
      *   **Red:** Reject (Systematic Error/Confabulation).
      *   **Blue:** Hand to PI (Category Error/Philosophical Judgment).

  3.  **Developing the Worked Applications:**

      *   *Case 1 (No Content + Micro-sleep EEG):* Contradiction with physiological data. Likely F1 (No State) or F3 (Not Retained - slept). Grade: Reject.
      *   *Case 2 (Vivid Image + Chance Detection/No Fixation):* Contradiction with behavioral/eye-track data. Suggests F5 (Imposed Category) or F1. Grade: Reject/Downgrade.
      *   *Case 3 (Irritation + Retraction + Provocation):* Memory/Emotion regulation issue. Subject retracts. F3 (Not Retained) or F6 (Constructive - settling attitude). Needs PI sign-off.
      *   *Case 4 (Star Subject + Paper depends on it):* Needs to be vulnerable to the procedure. Maybe subtle interviewer leading (F5). Grade: Downgrade/Yellow.

  4.  **Drafting the Limits Statement:**

      *   Acknowledge that agreement doesn't prove truth (intersubjective correlation $\neq$ ontological validity).
      *   Acknowledge the theory-ladenness of the coding scheme.
      *   Response to reviewer: The scheme makes the theory explicit rather than hiding it.

  5.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Constraint Check:* The RA has no philosophy background. I cannot ask "Is this a constructive act?" without defining it operationally.
      *   *Definition:* "Constructive Act" = Subject uses language to *decide* how they feel rather than *report* how they felt. Marker: Hesitation followed by definitive labeling, or contradiction with immediate behavior.
