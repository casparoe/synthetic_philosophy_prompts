answer: |-
  # Protocol 4.1: First-Person Report Triage (FPRT)

  **Operator:** Research Assistant (RA)
  **Time Limit:** 10 Minutes per Report
  **Input:** One Descriptive Experience Sampling (DES) Transcript + Concurrent Objective Data (if available)
  **Output:** Single Grade (A, B, C, R, Q) + Failure Code (F1–F6) + One-Line Justification

  ### OPERATOR INSTRUCTIONS
  1.  **Ignore Richness:** Do not reward detailed, fluent, or confident reports. A vague report may be more accurate than a vivid one.
  2.  **Localize Failure:** You are not judging the *truth* of the experience, but the *integrity of the chain* from experience to text.
  3.  **Stop on Rejection:** If a step triggers a "Reject (R)," stop immediately. Do not proceed to subsequent steps.
  4.  **Systematic vs. Random:**
      *   **Random Error:** Downgrade (Grade B or C). These average out over large N.
      *   **Systematic Error:** Reject (Grade R). These bias the dataset in a known direction.
      *   **Category Error:** Query (Grade Q). This requires Principal Investigator (PI) judgment.

  ---

  ### THE TRIAGE GRID

  **Step 1: Hard Contradiction Check (Objective Data)**
  *   **Question:** Does the report claim a state that is physiologically or behaviorally impossible according to concurrent measures (EEG, eye-tracking, reaction time)?
  *   **Evidence:** Look for claims of "alert awareness" during sleep spindles, "visual fixation" during saccades, or "high attention" during chance-level performance.
  *   **Decision:**
      *   **Yes:** **Grade R (Reject).** Code **F1 (No State Present).** The subject is confabulating a state that did not exist.
      *   **No:** Proceed to Step 2.

  **Step 2: Interviewer Influence Check (Prompt Sensitivity)**
  *   **Question:** Did the interviewer's phrasing supply the category used by the subject?
  *   **Evidence:** Look for the interviewer using a specific term (e.g., "empty," "non-dual") *before* the subject generates it, or the subject repeating the interviewer's wording immediately after a leading question.
  *   **Decision:**
      *   **Yes:** **Grade R (Reject).** Code **F5 (Imposed Category).** This is systematic error; the protocol generated the data.
      *   **No:** Proceed to Step 3.

  **Step 3: Retention Check (Memory Decay)**
  *   **Question:** Is there evidence the experience was lost between the beep and the report?
  *   **Evidence:** Look for long delays (>2 mins) before answering, phrases like "I think I was..." or "I probably felt...", or contradictions between the immediate jotting and the later interview.
  *   **Decision:**
      *   **Yes:** **Grade C (Downgrade).** Code **F3 (Not Retained).** Random error. Use only with statistical weighting.
      *   **No:** Proceed to Step 4.

  **Step 4: Access Check (Perplexity vs. Clarity)**
  *   **Question:** Does the subject demonstrate persistent perplexity about the content, or claim access to the inaccessible?
  *   **Evidence:**
      *   *Perplexity:* Subject explicitly states they cannot distinguish the state (e.g., "I don't know if that was thinking or sensing"). -> **Grade B.** Code **F2 (Inaccessible).** Random error.
      *   *False Clarity:* Subject claims hyper-specific detail about a state known to be pre-reflective or unconscious (e.g., describing the "exact shape" of a pre-conscious impulse). -> **Grade R.** Code **F1 (No State Present).**
      *   *Neither:* Proceed to Step 5.

  **Step 5: Construction Check (Measurement vs. Settlement)**
  *   **Question:** Is the subject reporting a detected state or *settling* on an attitude during the interview?
  *   **Evidence:** Look for linguistic markers of decision rather than discovery: "It *must* have been irritation," "I *decide* that was anxiety," or retrospective reasoning ("Given what he said, I *would* have been angry").
  *   **Decision:**
      *   **Decision Marker Present:** **Grade Q (Query).** Code **F6 (Constructive Act).** This is not a measurement failure; it is a category error. **PI Sign-off Required.**
      *   **Discovery Marker Present:** **Grade A (Accept).** Code **None.**

  ---

  ### WORKED APPLICATIONS

  #### Case 1: The "Empty" Stretch (EEG Contradiction)
  *   **Report:** Practitioner reports 20 minutes of "content-free awareness."
  *   **Data:** EEG shows three 4-second episodes of theta/delta activity (micro-sleep) within that window.
  *   **Procedure Path:**
      *   Step 1 (Hard Contradiction): **Yes.** Claim of alert awareness contradicts sleep markers.
      *   **Stop.**
  *   **Output:** **Grade R.** **Code F1.** **Justification:** Physiological data confirms state absence during reported interval.
  *   **Judgment Call:** None. The contradiction is objective.
  *   **Sign-off:** RA authorized.

  #### Case 2: The Peripheral Image (Eye-Tracking Contradiction)
  *   **Report:** Subject reports a "vivid visual image standing in the far corner of awareness."
  *   **Data:** Eye-tracking shows no fixations near that location; detection task at that location was at chance.
  *   **Procedure Path:**
      *   Step 1 (Hard Contradiction): **Yes.** Vivid visual experience requires fixation or high-contrast peripheral processing not supported by performance data.
      *   **Stop.**
  *   **Output:** **Grade R.** **Code F1.** **Justification:** Behavioral and oculomotor data rule out reported visual content.
  *   **Judgment Call:** Minimal. Assumes standard vision-to-report mapping.
  *   **Sign-off:** RA authorized.

  #### Case 3: The Retracted Irritation (Memory/Construction)
  *   **Report:** Subject reports "sharp irritation at interviewer" at beep. Five minutes later, subject says, "Actually, I felt nothing. I was just projecting." Interviewer notes confirm provocation occurred.
  *   **Data:** No physiological data. Transcript shows retraction.
  *   **Procedure Path:**
      *   Step 1: No hard contradiction.
      *   Step 2: No leading question found.
      *   Step 3 (Retention): **Yes.** Subject explicitly retracts the initial report within the session.
      *   **Stop.** (Note: Step 5 is also triggered, but Step 3 is a faster rejection/downgrade path).
      *   *Correction:* Step 3 yields Grade C (Downgrade). However, Step 5 (Construction) is more precise. The subject is *settling* the attitude ("I was projecting").
      *   **Revised Path:** Step 5 triggered. Subject uses decision language ("I was projecting").
  *   **Output:** **Grade Q.** **Code F6.** **Justification:** Subject retrospectively constructs emotional narrative rather than reporting raw state.
  *   **Judgment Call:** Distinguishing "retraction due to memory" vs. "retraction due to narrative settling."
  *   **Sign-off:** **PI Sign-off Required.** (PI must decide if the initial report or the retraction is the data point).

  #### Case 4: The Star Subject (Interviewer Influence)
  *   **Report:** Highly trained subject reports "non-dual awareness without subject-object split." Paper under review relies on this frequency.
  *   **Data:** Transcript shows interviewer asked, "Did you feel the usual subject-object split, or was it non-dual?" five minutes prior to the report.
  *   **Procedure Path:**
      *   Step 1: No contradiction.
      *   Step 2 (Interviewer Influence): **Yes.** Interviewer supplied the specific category ("non-dual") before the subject reported it.
      *   **Stop.**
  *   **Output:** **Grade R.** **Code F5.** **Justification:** Category supplied by interviewer protocol, not generated by subject experience.
  *   **Judgment Call:** Determining if the question was truly leading or merely clarifying. (Procedure defines supplying the term as leading).
  *   **Sign-off:** RA authorized, but PI must be notified of dataset impact.

  ---

  ### LIMITS STATEMENT

  **1. Validation vs. Screening**
  This procedure is a filter, not a validator. It is licensed to screen *out* reports that fail specific integrity checks (F1–F5). It is **not** licensed to confirm that a Grade A report is "true." Agreement between independently collected reports (e.g., two subjects reporting the same state) cannot support a positive conclusion about the character of experience. Convergence may indicate shared cultural scripting, shared protocol bias, or shared physiological triggers, but it does not bridge the gap between report and phenomenon. This procedure can only reduce noise; it cannot generate signal.

  **2. Theory Encodement**
  To the reviewer claiming this grading scheme encodes our theory of introspection into the data: **This is correct, and it is intentional.**
  All coding manuals encode theory. The alternative is not "theory-free data," but *hidden* theory. By forcing the RA to localize failure (e.g., distinguishing F1 [Confabulation] from F5 [Imposed Category]), we make our theoretical commitments explicit. We are committing to the view that introspective reports are causal chains vulnerable to specific break-points. If a reviewer disputes the procedure, they must dispute the specific link (e.g., "EEG sleep does not preclude phenomenological awareness"), not the existence of the filter itself.

  **3. The Category Error (F6)**
  This procedure cannot resolve F6 (Constructive Act). When a subject uses the interview to settle an attitude rather than report a state, accuracy is the wrong metric. The procedure flags this for PI review because it requires a philosophical decision: Do we treat the *act of settling* as the data (pragmatic view) or as a corruption of the measurement (realist view)? The RA is not licensed to decide this.

  **4. Systematic Error**
  If multiple reports receive Code F5 (Imposed Category) from the same interviewer, this procedure licenses the conclusion that the *interviewer* is the independent variable, not the subject. The data must be quarantined, not weighted. Random error (F2, F3) can be washed out by N; systematic error (F5) cannot.

  **Final Directive:**
  If the procedure rejects a report (Grade R), it is removed from the primary analysis dataset. If it queries a report (Grade Q), it is moved to a secondary dataset pending PI review. If it accepts (Grade A or B), it enters the dataset with the appropriate error weight. Do not override the procedure based on the scientific value of the result.
