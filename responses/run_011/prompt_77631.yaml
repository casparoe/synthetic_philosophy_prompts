answer: |-
  Here are ten questions drafted for your colloquium, designed to be concise, accessible to your mixed audience, and philosophically precise.

  ### 1. The Parity of Machinery
  **Question:** You call DNA the sender and the ribosome the receiver, but enzymes that match code to parts are just as necessary for the mapping as the DNA is. If the mapping requires both, what makes the DNA the author and the enzymes merely the decoder?
  **Predicted Answer:** She will likely argue that natural selection fixed the content in the DNA sequence historically, while the machinery was selected specifically to read *that* code.
  **Follow-up:** If the machinery evolved alongside the DNA, why isn't the content a joint product of both histories rather than stored in just one?

  ### 2. Intragenomic Conflict
  **Question:** Sender–receiver systems usually require shared interests, but some selfish DNA sequences copy themselves at the expense of the organism. Do these sequences send lying messages, or does their existence break your sender–receiver model entirely?
  **Predicted Answer:** She will likely classify them as parasites hijacking the system rather than genuine senders, preserving the model for the "organismal" genes.
  **Follow-up:** If the cellular machinery reads them successfully, how do you distinguish a hijacked message from a genuine instruction without just looking at whether the organism benefits?

  ### 3. Contingency and Recoding
  **Question:** The link between a three-letter DNA word and an amino acid is a historical accident. If engineers reassign a stop-word to build a protein and the cell survives, does the content survive the recoding, or was the alphabet never carrying content to begin with?
  **Predicted Answer:** She will likely say content is fixed by the *current* selection history; if the system evolves to use the new code, it carries new content.
  **Follow-up:** But if the physical DNA didn't change, only the cellular context, doesn't that prove the context creates the meaning, not the sequence itself?

  ### 4. Information vs. Influence
  **Question:** Embryo temperature systematically changes what gets built, just like DNA does. What test distinguishes a cause that carries information from a cause that merely exerts influence?
  **Predicted Answer:** She will argue temperature lacks the *selected function* to correlate with the outcome, whereas DNA was selected *for* that correlation.
  **Follow-up:** So information is defined entirely by past history, not by what the cause is actually doing in the cell right now?

  ### 5. Indeterminacy
  **Question:** With cellular processes that edit the genetic text, the protein isn't fixed until the cell decides how to cut. If the message isn't determinate until the receiving context is fixed, where does the message live before that cut?
  **Predicted Answer:** She will likely claim the DNA carries a range of potential instructions, and the context selects which one is actualized.
  **Follow-up:** If the DNA only offers a menu rather than a specific order, is it still accurate to say it carries an instruction for a specific trait?

  ### 6. The Determinism Deflection (Part 1)
  **Question:** You say objections stem from fear of determinism. Can a person accept genes carry literal instructions while believing environment determines the outcome?
  **Predicted Answer:** She will say yes, arguing that "instruction" does not imply "unavoidable fate."
  **Follow-up:** (See next question).

  ### 7. The Determinism Deflection (Part 2)
  **Question:** If they can, why does your literal view often lead policymakers to focus on genetic fixes rather than environmental ones?
  **Predicted Answer:** She will likely deny this is a necessary consequence, blaming popular science distortion rather than the philosophy.
  **Follow-up:** (See next question).

  ### 8. The Determinism Deflection (Part 3)
  **Question:** If a sequence causes a disease only under starvation, is it carrying information for disease or health, and does answering that require looking at the politics of the question?
  **Predicted Answer:** She will struggle here; she must either admit the content depends on the environment (weakening literalism) or insist on a "normal" environment (which is political).
  **Follow-up:** If the content depends on the environment, isn't the "literal" information actually a relational property, not a property of the gene?

  ### 9. Practical Stakes
  **Question:** Can you hold that genes literally carry instructions while still rejecting the "a gene for X" phrasing that shows up in popular science coverage?
  **Predicted Answer:** She will distinguish between instructions for proteins (literal) and instructions for complex traits like intelligence (not literal).
  **Follow-up:** If the public hears "instruction," won't they infer "trait," making your distinction practically useless?

  ### 10. Falsifiability
  **Question:** What specific discovery or experiment would, in principle, count against your position and lead you to give up literal information talk?
  **Predicted Answer:** She might suggest finding development works without any stable correlation between sequence and outcome.
  **Follow-up:** Given epigenetics, aren't we already finding that stability is rarer than we thought?

  ***

  ### Confidence Assessment

  **Confidence in Debate Representation:** **High.**
  These questions accurately map the current landscape of the philosophy of biology. The guest's position is a standard **Teleosemantic** view (associated with philosophers like Ruth Millikan, Peter Godfrey-Smith, or Nicholas Shea), which grounds meaning in evolutionary history. Your objections align with **Developmental Systems Theory** (DST) and the **Parity Principle** (associated with Paul Griffiths, Karola Stotz, and Susan Oyama). This is not a caricature; this is the actual technical debate occurring in journals like *Biology and Philosophy*. The glosses provided ensure the AP Biology students will follow the logic without feeling talked down to, while the philosophical pressure points are sharp enough for the experts.

  **The Riskiest Question:** **Question 2 (Intragenomic Conflict).**
  I am least certain about this one. The concept of "biological misinformation" or "lies" in the context of selfish genetic elements (transposons, meiotic drive) is a specific niche that Peter Godfrey-Smith has written on extensively. If your guest is familiar with that specific literature, she may have a very polished, technical distinction between "functional content" and "causal effect" that dissolves the "lie" objection faster than I predict. If she cites Godfrey-Smith's criteria for misinformation directly, your follow-up might look like it misses a standard counter-argument. However, even if she has the answer, the question is valuable because it forces her to explain *why* the selfish DNA isn't a sender, which highlights the arbitrariness of her selection criteria.

  **Strategy Note:** The "Determinism Run" (Questions 6–8) is designed to be a trap. Question 6 allows her to feel safe. Question 7 introduces social consequence. Question 8 removes the "anxiety" variable entirely by making the environment a binary switch for survival, forcing her to admit that "content" is relational. If she falls back on "anxiety" in Question 8, she will look unreasonable to the audience, because starvation is a biological fact, not a psychological fear.
