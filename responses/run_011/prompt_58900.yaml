answer: |-
  Here is a construction of a principle designed to fit your verdicts, followed by the required accounting of fit, uncertainties, casualties, and the second-mover question.

  ### The Principle: Systemic Leverage and Agency Continuity

  A commitment is rational and permissible if and only if it satisfies three conditions:

  1.  **The Directionality Condition:** The commitment must restrict the committer's ability to **concede**, not their ability to **resist**. It must remove a "bottom line" that invites exploitation, not a "top line" that invites lowballing.
  2.  **The Publicity Condition:** The constraint must be **Common Knowledge** among the relevant strategic agents to count as a strategic commitment; if it is private, it is merely a disposition (intrapersonal constraint).
  3.  **The Continuity Condition:** The commitment binds a future self only if the breach would incur **Systemic Externalities** (damage to the agent's enduring structure or reputation) that outweigh the local welfare loss. If the cost is purely internal to a future self that has lost agency, and no systemic integrity is at stake, the commitment is voidable.

  ---

  ### Mapping Cases to Clauses

  **Clause 1: Directionality (Restrict Concession, Not Resistance)**
  *   **Earned by Case 3 (Union Strike) vs. Case 4 (Union Accept).**
      *   *Case 3:* The union removes the ability to *concede* below a threshold. This forces the employer to move up. This is leverage.
      *   *Case 4:* The union removes the ability to *resist* above a threshold. This tells the employer they need not bid higher. This is surrender.
      *   *Why this fits:* It resolves your structural puzzle. The asymmetry is not in observability, but in which side of the bargaining zone is walled off. Walling off the "walk-away" point (Case 3) creates a threat. Walling off the "hold-out" point (Case 4) creates a promise of capitulation.
  *   **Also supports Case 5 (Chicken).** Removing the steering wheel restricts the ability to *concede* (swerve). This is leverage.

  **Clause 2: Publicity (Common Knowledge vs. Disposition)**
  *   **Earned by Case 2 (Blackmailer) vs. Case 10 (Work Filter).**
      *   *Case 2:* The resolve is private. The blackmailer cannot condition their strategy on it until *after* the first non-payment. It functions as a disposition (changing your own utility function) rather than a strategic move (changing the blackmailer's payoff matrix ex-ante).
      *   *Case 10:* This is intrapersonal. Publicity is irrelevant because there is no "other" to signal to. The principle explicitly carves out intrapersonal cases as valid commitments of a different class (self-binding), distinguishing them from the strategic machinery of Cases 1–8.
  *   **Why this fits:** It validates your intuition that Case 2 is "not a commitment in the strategic sense" while preserving the value of the disposition.

  **Clause 3: Continuity (Systemic Externalities vs. Internal Welfare)**
  *   **Earned by Case 1 (State Ransom) vs. Case 6 (Dementia Directive).**
      *   *Case 1:* Breaching the policy saves a life (local welfare) but destroys the state's deterrent reputation (systemic externality). The State is an enduring agent; the policy protects the *system* of citizenship. Hence, hold.
      *   *Case 6:* Honoring the directive kills the patient (local welfare). Breaching it harms no one else (no systemic externality). The "past self" is gone; the "present self" is a ward. There is no reputation to protect, only welfare to preserve. Hence, break.
  *   **Also supports Case 9 (Brother).** The estrangement policy has no systemic externality. It is a private relationship. The "unbounded future" claim is voidable because the cost is purely relational welfare, and the brother's apology changes the local welfare calculus without threatening a broader system. Hence, break.
  *   **Also supports Case 7 (Weak vs. Strong State).**
      *   *Weak State:* The retaliation is **Defensive Systemic Preservation**. Without the reputation for erratic retaliation, the weak state ceases to exist as a sovereign agent (absorbed or dominated). The externality of *not* committing is state death.
      *   *Strong State:* The retaliation is **Offensive Hierarchy Enforcement**. The strong state's existence does not depend on this specific threat. The externality is merely reduced compliance from weaker states. Hence, the asymmetry. It is not about odds; it is about whether the commitment preserves the agent's continuity or merely expands its reach.

  ---

  ### Addressing Your Uncertainties

  **1. The Confidence Gap in Case 1 (Adopt vs. Honor)**
  *   **Diagnosis:** The gap exists because **Adopting** is a *Design Problem* (ex-ante), while **Honoring** is a *Control Problem* (ex-post).
  *   **Explanation:** Under the Continuity Condition, adopting the policy is clearly right because it secures the Systemic Externality (deterrence). However, honoring it requires inflicting a local welfare loss (the citizen's life) that is visceral and immediate. Your confidence drops because the *moral weight* shifts from the abstract system (Adopt) to the concrete individual (Honor). The principle explains this: The *rationality* remains constant (System > Individual), but the *moral cost* is front-loaded at the moment of honoring. You are sensing the tension between Rule Utilitarianism (Adopt) and Act Utilitarianism (Honor). The principle sides with Rule, but acknowledges the cost is why you hesitate.

  **2. Case 2 (Blackmailer) as Commitment or Disposition**
  *   **Verdict:** It is a **Disposition**, not a Strategic Commitment.
  *   **Explanation:** It fails the Publicity Condition. It does not alter the blackmailer's incentives *before* they act. It only alters your response *after* they act. A strategic commitment works by changing the other player's decision tree at their root node. This changes your utility function at your leaf node. It is worth having (it makes you a harder target ex-post), but it lacks the pre-emptive leverage of Case 3 or 5.

  **3. Case 7 (Weak vs. Strong Asymmetry)**
  *   **Verdict:** The asymmetry is **Normative**, not Probabilistic.
  *   **Explanation:** As mapped in Clause 3, the Weak State's commitment is *constitutive* (it creates the conditions for the state's continued existence as an independent agent). The Strong State's commitment is *instrumental* (it optimizes an already secure existence). We permit commitments that are necessary for agency continuity (Weak) but condemn those that are merely tools of domination (Strong). This is why "odds" feel like the wrong explanation to you; the relevant variable is *dependency*, not probability of success.

  ---

  ### Stress-Test Case: The Pre-Commitment to Altruism

  **The Case:** A billionaire announces a binding trust: "I will match any donation made to my rival's charity, dollar for dollar, automatically." She hard-codes this so she cannot stop it.
  **My Principle's Verdict:** **Impermissible / Irrational.**
  **Why:** It violates the **Directionality Condition**. She is restricting her ability to *resist* funding the rival. She is removing her "bottom line" on spending. This invites the rival to fundraise aggressively, knowing every dollar costs the billionaire two. It is a surrender of financial leverage wearing the costume of generosity.
  **Defense:** This feels counter-intuitive because the outcome is "more money for charity." However, strategically, the billionaire has made herself a sucker. She has turned a competitive environment into one where her rival controls her spending. If the goal is *her* utility (which includes relative status or efficient allocation), this is self-sabotage. If the goal is pure altruism, it's not a commitment problem, it's a donation. As a *strategic move* in a world of agents, it is a surrender of agency similar to Case 4 (Union Accept). I defend the verdict: Do not commit to matching an adversary's moves unless you can also match their *targets*.

