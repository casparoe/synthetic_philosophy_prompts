  ### The Second-Mover Advantage

  **Direct Answer:** Yes, committing second is better when the first commitment is **Observable but Calibratable**.

  **The Feature:** **The Matching Advantage.**
  If Agent A commits to a position (e.g., "I will sell at $10"), Agent B can commit second to a *function* of A's position (e.g., "I will sell at $9.99" or "I will match any price").
  *   **Why it wins:** Agent A pays the cost of rigidity (loss of flexibility). Agent B reaps the benefit of rigidity (credibility) without paying the full cost, because B's commitment is *conditional* on A's.
  *   **Example:** Price-matching guarantees. Firm A sets a price. Firm B commits to match it. Firm B steals Firm A's commitment power. Firm A cannot lower prices to gain market share without Firm B instantly neutralizing the gain. Firm B has committed *second*, but has effectively seized the focal point.
  *   **Another Feature:** **The Vulnerability Exploit.** In Case 5, if Driver A throws the wheel, Driver B (if second) can choose to *pull over* (surrender) or *accelerate* (exploit). If B accelerates, A's commitment becomes a suicide pact. B's second-mover status allows B to choose the *response* to the commitment. A's commitment forces A's hand; B's freedom allows B to punish A's rigidity.
  *   **Conclusion:** Commitment is a race only when the commitments are **Independent** (I throw my wheel regardless of you). When commitments are **Contingent** (I commit to do X if you do Y), the second mover holds the advantage of calibration. Case 8 (AI Lab) fails because the tripwire is Independent; if it were Contingent ("We stop unless you stop"), it might gain second-mover leverage, but it loses credibility. The advantage lies in **Contingent Rigidity**.
