prompt: |-
  I write backend systems for a living and I have never taken a philosophy course, so I want to be explicit about what I can and cannot evaluate in your response. Six weeks ago my team stood up an internal module, "Assertions, Flags, and Fact-Checking," for new engineers who work on our claims pipeline. I run it, and the final assessment is a 90-minute in-class essay worth 20 marks. The module's third and fourth weeks cover deflationary theories of truth, which I teach because our product attaches a boolean column to a record and calls that column verification. I have drafted the artifact the question will be built on, but I do not trust my own instincts about where the philosophical pressure actually is, and I need the question, a model answer, and a marking scheme.

  First, the artifact. I invented it, simplified from our production system, so no student can have seen it and no answer can be copied from anywhere:

  Our table is called ClaimStore. Each row has `claim_id`, `text` (a well-formed declarative sentence in a restricted fragment of English), `source`, and a boolean `verified`, plus who set it and when. The design doc asserts one invariant, which the doc's author named the disquotation invariant: for every row r, `verified(r)` is TRUE if and only if the sentence stored in `text(r)` holds. Nothing else in the doc explains what the flag means; the doc says the invariant is the whole story.

  Three downstream systems consume the flag.

  1. A roll-up rule, stated once in a config file: every row in the verified set is true. The table grows continuously, so this rule cannot be expanded into a finite list of rows, and it must cover rows that do not exist yet.
  2. An endorsement service that never parses `text` at all. It is permitted to surface, forward, and act on flagged rows, and its logs contain lines that attribute content it has never read, of the form: whatever the sensor asserted yesterday is true.
  3. An accountability rule. Acting on an unflagged row is a process violation. Acting on a flagged row that later turns out to be false opens an incident in which the person who set the flag is held to account personally, and the review is not blameless. The design doc describes this as the flag carrying a norm.

  There is also an open ticket. Row 4471 has a `text` value that says, of that very row, that its `verified` field is FALSE. Under the disquotation invariant the flag on that row is TRUE exactly when it is FALSE. The on-call engineer closed the ticket with a validation rule rejecting any `text` value containing the strings verified, true, or claim_id. The table still grows and the roll-up rule still runs.

  Second, what I want you to produce.

  (a) The exam question itself, built entirely out of the artifact above. It must be answerable in 90 minutes by a smart engineer who has read our two weeks of material but has no philosophy training, and it must be answerable without knowing any philosopher's name or any -ism's label. I want it to have three parts, roughly 6, 8, and 6 marks. The parts I have in mind, though you should reword and sharpen them and tell me if the split is wrong: what the flag adds to `text` given that the invariant is supposed to be the whole story; whether uses 1 through 3 show that truth is a substantive property with an underlying nature, or whether they are exactly what a deflationist should expect; and what the validation rule cost us, including whether that cost is peculiar to the disquotational picture or falls on any account of truth equally. I would like the third part to force a constructive move as well, such as proposing and defending one change to the spec.

  (b) A model answer of about 750 words, written at the level a top student in this module could actually reach in 90 minutes, not at the level of a journal article.

  (c) A marking scheme totalling 20 that says what an A answer does that a B answer does not, in terms of named moves rather than named philosophers. Please be explicit that citing a source earns no marks and misattributing a view earns no penalty, because I cannot grade either and neither can the students source anything.

  (d) Under each part, one line per typical wrong answer, identifying the specific misunderstanding it reveals and which marks it forfeits. I care most about the mistakes I suspect are common here: reading redundancy as uselessness and concluding the column should be deleted; collapsing deflationism into relativism or into the claim that verification is whatever the team decides it is; treating the flag as a mere expression of approval, like a compliment attached to a row, and thereby losing the fact that the endorsement service repeats content it cannot restate; declaring row 4471 meaningless and moving on without asking what restricting the invariant does to the roll-up rule; and taking the accountability rule to be decisive on its own, without separating the semantics of the flag from the institutional practices we have chosen to hang off it.

  Third, two things about my own framing. Please tell me where I have mis-stated a position, because I cannot tell. In particular: is the norm carried by use 3 a genuine objection that deflationists have to answer, or have I simply described something they happily accept, in which case my part two is not the crux I think it is? And does the validation-rule fix really undercut the generalizing power of the flag, or does it only restrict which sentences the invariant covers, which a deflationist can shrug off?

  Finally, please give me no bibliography, no reading list, and no citations, and do not build any part of the question on a passage the students would have to look up. Everything they need should be in the artifact and in what the question itself states.
