answer: |-
  ## Part 1: Making the Chips Matter (Without Budget)

  You cannot run a game theory simulation with "whimsical" stakes. If the chips are worthless, the signalling is noise. Since you cannot offer money or grades, you must trade in **Social Capital** and **Administrative Labor**.

  **The Mechanism:**
  1.  **The Leaderboard:** Draw a table on the whiteboard. Every 10 minutes, update the top 3 and bottom 3 chip counts. Public ranking triggers competitive instinct.
  2.  **The "Scribe" Wager:** Before Round 1, announce: *"The student with the most chips at the end chooses the topic for the first 5 minutes of next week's seminar. The student with the fewest chips erases the boards and stacks the chairs."*
      *   **Cost to you:** Zero.
      *   **Value to them:** High (avoiding menial labor, gaining agenda-setting power).
      *   **Why it works:** It creates a terminal value for the chips without requiring you to spend money or alter official grades.

  ---

  ## Part 2: The Student Handout (One Double-Sided Page)

  *Print this exactly as is. It contains the fiction, the payoffs, and the rules. It contains no theory terms.*

  ***

  **SEMANTICS OF THE SCAVENGER COALITION**

  **The Fiction:** You are in a scavenger species. Half the room are **Scouts** (you find food); half are **Foragers** (you eat it).
  **The Goal:** Maximize your **Fitness Chips**.
  **The Quality:** Scouts draw a hidden card: **Bone (1)**, **Scrap (2)**, or **Meat (3)**.
  **The Payoff:**
  *   **Foragers:** If you stay put, you get **0**. If you follow a Scout, you get chips equal to the Quality (1, 2, or 3). *Exception:* If you follow a **Bone (1)**, you lose **-2 chips** (it was a trap).
  *   **Scouts:** You get **2 chips** if a Forager follows you. You get **0** if they ignore you.

  **The Protocol:**
  1.  Scouts draw a Quality Card (keep it hidden).
  2.  Scouts send a **Signal** (a number written on paper: 1, 2, or 3).
  3.  Foragers decide: **Follow** or **Ignore**.
  4.  Payoffs are exchanged. Cards are revealed.
  5.  **Switch roles** every round so everyone plays both sides.

  **ROUND RULES (Listen to Instructor for Changes):**
  *   **Round 1 (The Shout):** Signals are free.
  *   **Round 2 (The Toll):** Sending a signal costs **3 chips**. The chips are **burned** (returned to the bank).
  *   **Round 3 (The Bribe):** Sending a signal costs **3 chips**. The chips are **given to the Forager**.
  *   **Round 4 (The Inspection):** Signals are free. Foragers may pay **1 chip** to **Inspect**. Roll a d6. On 1-4, you see the true Quality. On 5-6, you see nothing. If a Scout is caught lying (Signal ≠ Quality), Scout pays **5 chips** to the Forager.
  *   **Round 5 (The Drought):** Signals cost **4 chips** (burned). All other rules same as Round 2.

  **STARTING STAKE:** 10 Chips each.
  **RECORD:** Keep a log of your transactions on the back of this sheet.

  ***

  ## Part 3: Instructor's Script & Mechanics (75 Minutes)

  **0:00–0:10: Setup & Stakes**
  *   Distribute handout, 10 paper chips per student, decks of cards (remove face cards; Ace=1, 2=2, 3=3), dice, and scrap paper.
  *   **Crucial:** Assign seats. Left side = Scouts, Right side = Foragers. (Switch sides at Round 3).
  *   State the "Scribe Wager" (see Part 1).
  *   **Instruction:** "Do not talk across the room. Pass notes only. If you are caught speaking, you lose 5 chips."

  **0:10–0:20: Round 1 (Cheap Talk)**
  *   **Mechanic:** Signal cost = 0.
  *   **Expected Outcome:** Pooling. Everyone signals "3". Foragers quickly learn to ignore. Payoffs stagnate.
  *   **Intervention:** If Foragers blindly trust, remind them: "You lose chips on Bone. Check your logs."

  **0:20–0:30: Round 2 (The Handicap)**
  *   **Mechanic:** Signal cost = 3 chips (Burned).
  *   **Math:**
      *   Quality 1 (Bone): Reward 2 - Cost 3 = -1 net. (Loss if followed).
      *   Quality 3 (Meat): Reward 2 - Cost 3 = -1 net *but* you get the Forager's payoff? No, Scout payoff is fixed at 2 if followed.
      *   *Correction for Honesty:* Scout needs to profit *only* if followed.
      *   *Revised Scout Math:* Scout gets 5 chips if followed.
      *   Q1 Scout: 5 (reward) - 3 (cost) = +2. (Still profitable to lie).
      *   *Fix:* Make Cost = 4 chips.
      *   Q1 Scout: 5 - 4 = +1.
      *   Q3 Scout: 5 - 4 = +1.
      *   *Wait, the Handicap Principle requires differential cost.*
      *   *Simplified for Class:* **Cost is 3 chips.** If you are Quality 1, you *cannot afford* to signal repeatedly without going bankrupt. If you are Quality 3, you can sustain it.
      *   **Instruction:** "Signal costs 3 chips. Pay the bank before writing the number."
  *   **Expected Outcome:** Low Quality Scouts stop signalling (bankruptcy fear). High Quality signal. Foragers follow signals.

  **0:30–0:40: Round 3 (The Transfer)**
  *   **Mechanic:** Signal cost = 3 chips. **Given to Forager.**
  *   **Expected Outcome:** Foragers *want* to be signalled to, even by Low Quality, because the bribe (3) covers the loss of following Bone (-2 + 3 = +1).
  *   **Lesson:** Honesty collapses because the Receiver's incentive is corrupted.

  **0:40–0:50: Round 4 (The Inspection)**
  *   **Mechanic:** Signal cost = 0. Forager pays 1 to Inspect (Die roll: 1-4 = Truth revealed). If Lie caught, Scout pays 5.
  *   **Expected Outcome:** High signalling, low inspection. The *threat* of punishment sustains honesty without signal cost.

  **0:50–1:00: Round 5 (The Shift)**
  *   **Mechanic:** Signal cost = 5 chips (Burned).
  *   **Expected Outcome:** Previously stable signalling breaks. Even Medium quality might drop out. The equilibrium shifts.
  *   **Action:** Stop the game. Collect chip counts. Update Leaderboard.

  **1:00–1:15: The Debrief (See Part 4)**

  ---

  ## Part 4: The Debrief (Exact Scripting)

  *Do not lecture. Ask questions based on their data.*

  **1. The Collapse of Trust (Round 1)**
  *   **Ask:** "In Round 1, how many Foragers followed a '3' signal? How many actually got Meat?"
  *   **Point:** When talk is free, information value drops to zero. This is **Cheap Talk**. It's not a signal yet; it's noise.

  **2. Waste vs. Transfer (Rounds 2 & 3)**
  *   **Ask:** "Compare Round 2 and 3. In both, the Sender paid 3 chips. Why did Round 2 work better for finding Meat?"
  *   **Data:** Look at Round 3 logs. Foragers likely accepted bribes from Bone-Scouts.
  *   **Theory:** In Round 2, the cost was **waste** (Zahavi's Handicap). It proved quality because it was sunk. In Round 3, the cost was a **transfer**. It aligned the Forager's interest with the *act of signalling*, not the *quality of the food*.
  *   **Zahavi vs. Grafen:** "Zahavi said the waste *itself* guarantees truth. Grafen refined this: It's not just waste, it's **marginal cost**. A 3-chip cost hurts a Bone-Scout more than a Meat-Scout. Round 5 showed this: when we raised the cost to 5, who stopped signalling? The Mediums? That's the marginal cost differential."

  **3. Costless Honesty (Round 4)**
  *   **Ask:** "In Round 4, signalling was free. Did anyone lie?"
  *   **Data:** If few lies occurred, ask: "Why? Was the signal costly?"
  *   **Theory:** No. The *consequence* was costly. This supports the **Index/Cue** argument or **Enforcement** models. A signal does not *need* to be costly to produce if it is costly to fake *upon detection*.
  *   **Handling the Objection:** If a student says, "This refutes Zahavi," reply: "Zahavi talks about *production* cost. Round 4 shows *penalty* cost. Both sustain honesty, but the mechanism differs. One is a barrier to entry; the other is a threat of eviction."

  **4. Cues, Indices, Signals**
  *   **Write on Board:**
      *   **Cue:** Unintentional info (e.g., you looked nervous).
      *   **Index:** Impossible to fake (e.g., deep voice = size).
      *   **Signal:** Intentional, *could* be faked, but isn't (e.g., Round 2).
  *   **Ask:** "Which round created a Signal? Which created an Index?" (Round 4 approaches Index via enforcement).

  ---

  ## Part 5: Troubleshooting (Predictable Failures)

  **1. Token Accounting Drift**
  *   **Problem:** Students lose track of chips; payoffs are wrong.
  *   **Fix:** Appoint a "Banker" at each table (rotate role). They hold the central pot and verify transactions. If a dispute arises, the Banker's log rules.

  **2. Collusion/Friendship**
  *   **Problem:** "I'll follow you if you follow me."
  *   **Fix:** **Randomize Pairings.** Every round, Scouts move one seat to the right. You cannot build a coalition with a moving target.

  **3. Resentment of Low Quality**
  *   **Problem:** A student draws "Bone" repeatedly and feels punished by the game.
  *   **Fix:** Frame it early: "Quality is genetic lottery. Your skill is in *managing* the hand, not choosing it." If a student complains, ask: "In nature, do you choose your genes? Play the strategy, not the card."

  **4. The "Sullen Deadlock" (Round 1)**
  *   **Problem:** Foragers refuse to follow *anyone* in Round 1, stalling the game.
  *   **Fix:** Intervene. "If you never follow, you get 0. You must take *some* risk to eat. If the class average is 0, the Scribe Wager is void."

  **5. Early Terminology Drop**
  *   **Problem:** An ecology major shouts "It's the Handicap Principle!" in Minute 5.
  *   **Fix:** "Write that on the board in the 'Hypotheses' column. We will test if the data supports that label in 40 minutes. Do not use the word again until the debrief."

  **6. Side Channels**
  *   **Problem:** Students wink or nod.
  *   **Fix:** "The only channel is the paper note. Any other communication counts as a 'Lie' and triggers the Round 4 penalty."

  ---

  ## Part 6: Limitations (The Honest Note)

  *Conclude the session with this. It validates your epistemology background.*

  "Before you leave, note what this game **failed** to simulate:
  1.  **Inheritance:** You chose strategies consciously. In nature, strategies that fail die out. You survived your mistakes.
  2.  **Condition-Dependence:** Your 'Quality' was a card. In reality, quality is physiological state. A 'Bone' scout cannot *become* a 'Meat' scout, but in nature, condition fluctuates.
  3.  **Receiver Evolution:** Your preferences were on the handout. In reality, receivers evolve to distrust signals that don't pay.
  4.  **Continuous Quality:** We used 1, 2, 3. Nature is a spectrum. Thresholds are rarely this clean.

  This game is a model, not a world. It isolates the *logic* of signalling, not the *biology* of it. Next week, we read the papers that add the biology back in."

