answer: |-
  The requirement doing the most work is **External Corroboration of Specific Claims**, and the full set of strict criteria is **not jointly satisfiable** for non-literate or non-elite contexts without sacrificing verification standards.

  ### The Specification for Historical Kernel Verification

  | Requirement | Motivation | Status | Incompatibility Flag |
  | :--- | :--- | :--- | :--- |
  | **1. Material Correlate** | Physical evidence (archaeology, epigraphy) must match the *scale* and *setting* of the claim. | **Non-Negotiable** | Conflicts with **Strict Contemporaneity** for non-urban societies. |
  | **2. Calibrated Silence** | Absence of evidence counts only if there is a high prior probability of record creation and survival. | **Non-Negotiable** | Requires explicit modeling of recording priors (often missing). |
  | **3. Independent Attestation** | Multiple sources must not share a single genealogical ancestor (no circular citation). | **Non-Negotiable** | Rarely satisfiable for oral traditions; biases toward literate cultures. |
  | **4. Chronological Proximity** | The gap between event and earliest record must be bridgeable by known transmission mechanisms. | **Camp Criterion** (Maximalists relax this; Minimalists harden it). | Conflicts with **Recovering Non-Elite History**. |
  | **5. Specificity vs. Archetype** | Names/actions must be unique identifiers, not titles, epithets, or mythic tropes. | **Non-Negotiable** | Requires linguistic expertise often unavailable. |
  | **6. External Naming** | The figure/event must be named by a party outside the tradition benefiting from the legend. | **Non-Negotiable** | The primary filter for "Kernel" vs. "Invention." |

  ### Incompatibility and The "Elite Bias" Problem

  The set is not jointly satisfiable for the majority of human history. **Strict Contemporaneity** (Requirement 4) and **Independent Attestation** (Requirement 3) function as filters for literacy and urbanization. If you enforce them rigidly, you erase the history of non-literate, non-urban, or subjugated peoples. This is a **feature** of verification (it prevents false positives) but a **bug** of reconstruction (it creates false negatives).

  To resolve this without abandoning rigor, **Strict Contemporaneity** must be dropped in favor of **Plausible Transmission Chains**. You cannot demand a written record from a 5th-century British warband leader, but you can demand that the oral tradition shows signs of stability rather than mythic inflation. However, **Material Correlate** (Requirement 1) and **External Naming** (Requirement 6) must remain hard filters. If a story claims a massive migration (Exodus) or a high-kingdom (Arthur), it must leave a footprint commensurate with that claim, regardless of who was writing. If the footprint is missing, the kernel is rejected, not because they couldn't write, but because the *scale* of the claim demands physical trace.

  ### Priors on Legendary Figures

  **Estimate:** 15% of well-known semi-legendary figures from antiquity have a historical kernel identifiable as a specific individual.

  **Defense:** Legend-making is a compressive and aggregative process. It is cheaper to attach multiple deeds to one name (aggregation) or invent a name for a phenomenon (eponymy) than to preserve specific biographical data orally over centuries. Most "heroes" are etiological myths (explaining why a place is named X) or social constructs (unifying a tribe under a common ancestor). The burden of proof must remain high because the generative mechanism for myth is robust and continuous, while the preservation mechanism for specific biography is fragile and rare. A calibrated prior assumes invention until external corroboration forces an update.

  ### Application: Troy, Arthur, Exodus

  **1. The Trojan War (Verdict: Probable Kernel)**
  *   **Carrying Requirement:** **Material Correlate + External Naming.**
  *   **Analysis:** Archaeology confirms a destroyed citadel at Hisarlik (Layer VI/VII) consistent with the Late Bronze Age. Hittite texts (external source) mention "Wilusa" (Troy) and a conflict involving "Ahhiyawa" (Greeks), including a specific figure "Alexandu" (Paris).
  *   **Why it passes:** The scale of the city matches the scale of the war described. The external naming confirms the geopolitical conflict exists outside the Homeric tradition. The narrative details (duels, gods) are rejected, but the kernel (conflict over this city at this time) is verified.

  **2. King Arthur (Verdict: Unlikely Kernel)**
  *   **Carrying Requirement:** **Calibrated Silence + External Naming.**
  *   **Analysis:** Gildas (contemporary-ish) records the Battle of Badon but does not name Arthur. The silence is calibrated: Gildas names other tyrants, so the prior for naming a victor is non-zero, but the survival prior is low. However, there is zero external naming from Saxon or contemporary Roman sources. Archaeology shows post-Roman fragmentation, not a unified high-kingdom capable of the attributed campaigns.
  *   **Why it fails:** The claim (High King of Britain) demands a material footprint (coinage, inscriptions, centralized fortification) that is absent. The name "Arthur" appears in sources too late to be independent of the growing legend. It fails **External Naming** and **Material Correlate** for the *scale* of leadership claimed.

  **3. The Exodus (Verdict: Very Unlikely as Described)**
  *   **Carrying Requirement:** **Material Correlate (Scale-Matched).**
  *   **Analysis:** The Merneptah Stele confirms "Israel" existed as a people in Canaan c. 1208 BCE (satisfies **External Naming** for the *people*, not the *story*). However, there is no archaeological evidence for a group of even 20,000 (let alone 2 million) wandering Sinai for 40 years (pottery, campsites, graves). Egyptian records detail border crossings meticulously; a loss of this magnitude violates the **Calibrated Silence** prior (Egyptians recorded minor losses; this would be catastrophic).
  *   **Why it fails:** The Merneptah Stele proves the *endpoint* (Israelites in Canaan) but highlights the absence of the *journey*. The scale of the claim requires a material correlate that is completely missing. The verdict distinguishes between "Israelites existed" (True) and "The Exodus narrative happened" (False).
