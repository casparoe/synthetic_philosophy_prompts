  2.  **Deconstruct the Core Argument:**

      *   The user wants to highlight a specific, often overlooked critique of sortition: *Self-Selection Bias.*
      *   *Theory:* If you draw names randomly, but people can say "no," the people who say "yes" aren't random anymore. They are likely those with more free time, less risk aversion, more ego, or specific agendas.
      *   *Contrast:* Elections naturally select for those who *want* power (campaigning). Lotteries *should* select a cross-section, but opt-outs ruin that.
      *   *The Twist:* The user wants the "opt-out cost" to be visible. If someone declines, there must be a penalty or a visible marker that shows *who* is opting out and *why* (implicitly).
