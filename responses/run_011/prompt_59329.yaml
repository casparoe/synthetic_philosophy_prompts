answer: |-
  Here is the complete facilitation plan. It is designed to be run exactly as written to ensure the specific theoretical points land without you having to lecture until the very end.

  # Activity Title: The Allocation Protocol

  ## 1. Materials List
  *   **The Pot:** $40 in gift cards. *Recommendation:* Eight $5 cards (e.g., coffee or generic Visa). This allows for granularity in distribution.
  *   **The Hat:** Opaque container.
  *   **The Slips:** 16 slips of paper, each with a participant's name.
  *   **Whiteboard & Markers:** Divide the board into two halves: "Session A" and "Session B."
  *   **Timer:** Your phone.
  *   **Printed Rules:** One copy for you, none for them (you are the sole arbiter).
  *   **The "Burn" Jar:** A physical envelope or box labeled "COMMUNITY LOSS."

  ## 2. The Rules (For Your Eyes Only)
  *Do not hand these out. Read the relevant sections aloud at the start of each session.*

  **Core Rule (Both Sessions):**
  The goal is to distribute the $40 pot among the 16 people present. Any unallocated money remains in the pot and is *not* distributed. The Allocator proposes a split. The Group votes Yes/No. If Yes, cards are handed out immediately. If No, the process repeats (new election or new draw).

  **Session A (The Electoral Arm):**
  1.  **Nomination:** Anyone can nominate themselves or another.
  2.  **Campaign:** 60 seconds max per candidate.
  3.  **Vote:** Majority wins. Ties = Re-vote.
  4.  **Power:** The Winner becomes the "Allocator." They propose the split of the $40. They *may* include themselves in the split.
  5.  **Continuity:** The Allocator is eligible to run again in subsequent rounds.

  **Session B (The Lottery Arm):**
  1.  **Draw:** You pull one name from the hat.
  2.  **The Choice:** The drawn person has 30 seconds to **Accept** or **Decline**. No reason needed.
  3.  **The Cost:** If they **Decline**, $5 is removed from the pot and placed in the "COMMUNITY LOSS" jar. Their name is written on the whiteboard under "Declined."
  4.  **The Cap:** A person may Decline only *once* in the entire session. If drawn a second time, they *must* Accept.
  5.  **Power:** If they Accept, they become the "Allocator." They propose the split.
  6.  **Continuity:** If an Allocator serves, their name goes back in the hat for the next round.

  ## 3. Minute-by-Minute Timeline

  ### Session 1: The Electoral Arm (90 Minutes)
  *Goal: Let them manufacture an incumbent.*

  *   **00:00 – 00:10 | Setup & Stakes:**
      *   Seat everyone in a circle/semicircle.
      *   Place the $40 in gift cards visibly in the center.
      *   **Say:** "We have $40. We are going to decide how to distribute it over three rounds. Whatever you decide happens. If you vote to give one person $40, they walk with $40. If you vote to burn it, it burns. I am not intervening. I am only the clock."
      *   Read **Session A Rules**.
  *   **00:10 – 00:30 | Round 1:**
      *   Open nominations. (Expect hesitation, then 2-3 volunteers).
      *   Campaign (1 min each).
      *   Vote.
      *   Allocator proposes split. (Expect them to take a share, e.g., $5 for themselves, rest split).
      *   Group Vote. Distribute cards.
      *   *Whiteboard:* Record who was elected and the split.
  *   **00:30 – 00:50 | Round 2:**
      *   **Say:** "We begin Round 2. Nominations open."
      *   *Crucial:* Do not remind them the previous winner can run again. Let them realize it.
      *   Likely outcome: The previous winner runs again. They have a track record ("I gave you all $2 last time").
      *   Vote. Distribute.
      *   *Whiteboard:* Record winner. Note if it's the same person.
  *   **00:50 – 01:10 | Round 3:**
      *   Repeat. By now, the "Career Politician" should be entrenched. Others may feel it's "their turn," but the incumbent has the advantage of familiarity.
      *   Distribute final cards.
  *   **01:10 – 01:30 | Intermission Debrief (The Trap):**
      *   **Say:** "Take a 10-minute break. Do not discuss strategy for the next session. Just stretch."
      *   *Facilitator Note:* While they are gone, tally how many times the same person won. Prepare the Lottery slips. Reset the pot to $40 (collect the cards back, explain you are resetting the economy for the second experiment).

  ### Session 2: The Lottery Arm (90 Minutes)
  *Goal: Reveal the Opt-Out Bias.*

  *   **00:00 – 00:10 | Reset & Stakes:**
      *   **Say:** "We reset the pot to $40. Same goal: allocate the funds. New rules."
      *   Read **Session B Rules**. Emphasize the **$5 Cost** of declining. Put the "COMMUNITY LOSS" jar on the table.
      *   **Say:** "If you decline, the group loses $5. That money is gone forever. Your name goes on the board."
  *   **00:10 – 00:30 | Round 1:**
      *   Draw first name.
      *   *Prediction:* Someone will decline. Maybe two.
      *   Every time someone declines: Remove $5 card, put in jar. Write name on "Declined" list. Draw again.
      *   Once an Allocator accepts: They propose split. Vote. Distribute.
      *   *Whiteboard:* Record Allocator name.
  *   **00:30 – 00:50 | Round 2:**
      *   Draw name.
      *   *Prediction:* If a "Decliner" from Round 1 is drawn, they *must* serve (Cap Rule). If a new person is drawn, they might decline.
      *   Watch the "Declined" list grow.
      *   Distribute.
  *   **00:50 – 01:10 | Round 3:**
      *   Draw name.
      *   By now, the pot may be depleted (e.g., down to $25). Tension will be high.
      *   The people left in the hat are disproportionately those who *cannot* or *will not* decline (the "encumbered").
      *   Distribute remaining funds.
  *   **01:10 – 01:30 | Final Debrief (The Reveal):**
      *   See "Debrief Script" below.

  ## 4. Troubleshooting: What Will Go Wrong
  *You are alone. Here is how to handle the predictable failures.*

  **1. The "Tyrant" (Election Arm):**
  *   *Scenario:* In Session A, someone wins Round 1 and proposes taking $30 for themselves.
  *   *Reaction:* The group will vote No.
  *   *Facilitator Move:* Do not intervene. Let them struggle. If they deadlock (3 No votes in a row), pause and say: "The rules do not provide for a deadlock. You must elect someone." This forces them to compromise, usually by re-electing the moderate incumbent.
  *   *Why:* This proves the "Incumbency" point. They will re-elect the safe hand over the risky new face.

  **2. The "Martyr" (Lottery Arm):**
  *   *Scenario:* Someone declines in Round 1, burning $5. The group glares at them.
  *   *Facilitator Move:* Enforce the rule coldly. "Name on the board. $5 in the jar. Next draw."
  *   *Why:* You need the social friction. If you soften it, the point is lost.

  **3. The "Side Deal":**
  *   *Scenario:* In the hallway during the break, two people agree: "You run in Session 2, you give me $5."
  *   *Facilitator Move:* You can't stop it. But in the debrief, ask: "Did anyone make private agreements?" When they admit it, point out that * Elections encourage coalitions; Lotteries break them.* This is a bonus point for you.

  **4. The "Sulk":**
  *   *Scenario:* Someone gets no money in Session A and shuts down.
  *   *Facilitator Move:* In Session B, remind them: "The pot is reset. Everyone has an equal chance in the hat." Re-engage them by making eye contact when drawing names.

  **5. Running Out of Money (Lottery Arm):**
  *   *Scenario:* Too many declines burn the pot down to $10.
  *   *Facilitator Move:* This is a feature, not a bug. It demonstrates the *cost* of the opt-out mechanism. Proceed with the smaller pot.

  ## 5. The Debrief Script (The Mapping)
  *Do not start this until the money is fully distributed and the whiteboard is full.*

  **Step 1: The Election Autopsy (Session A)**
  *   **Ask:** "Look at the whiteboard for Session A. How many different people held the power of the Allocator?"
  *   **Likely Answer:** "One or two."
  *   **The Point:** "You just manufactured a career politician. You didn't vote for a system that creates incumbents, but the *mechanism* of campaigning + re-election made it rational to keep the person you knew. You traded rotation for stability."
  *   **Map:** This corresponds to the **Incumbency Advantage** critique of elections.

  **Step 2: The Lottery Autopsy (Session B)**
  *   **Ask:** "Look at the 'Declined' list on the right. Look at the people who actually served as Allocators."
  *   **Action:** Point to the names.
  *   **Ask:** "Was the decline random? Look at who is on that list. (Pause). Look at who *isn't*."
  *   **The Point:** "The draw was random. The service was not. The people who could afford to burn the group's money (socially or financially) opted out. The people who felt they couldn't say no ended up doing the work."
  *   **Map:** This corresponds to the **Self-Selection Bias** critique of sortition. The "random" body is no longer representative; it is filtered by willingness to serve.

  **Step 3: The Reveal**
  *   **Say:** "In political theory, Session A is **Electoral Representation**. Session B is **Sortition**."
  *   **Say:** "We usually talk about Sortition in the context of Athens. But we skip the part you just lived: Sortition only works if service is mandatory. If you allow an opt-out, you don't get a representative sample. You get the sample of people who can afford to say yes."

  **Step 4: The Money**
  *   Hand out the remaining gift cards according to the final ledger.
  *   **Say:** "Keep the cards. But remember the feeling of the $5 burning in the jar. That is the cost of a citizen declining their duty."

  ## 6. The Limitation: What This Room Cannot Reproduce
  *You asked for honesty on what a 16-person room misses.*

  **It is not Scale. It is Competence.**

  In your room, allocating $40 requires zero expertise. Anyone can split $40 sixteen ways. Therefore, the "Amateurism" risk of sortition feels invisible.

  In a real state, allocating a budget requires understanding macroeconomics, defense logistics, or public health.
  *   **The Gap:** In this game, the "Lottery Allocator" was just as competent as the "Elected Allocator." In reality, the Lottery Allocator might crash the economy.
  *   **What You Must Supply Verbally:**
      In the final debrief, add this caveat:
      *"Today, the job was simple: split the money. So the Lottery Allocator did fine. But imagine the job was 'Negotiate a Trade Deal' or 'Design a Healthcare System.' In that case, the 'Opt-Out' skew you saw on the board becomes dangerous. The people who opt-out might be the experts who know they are too busy. The people who stay might be the confident amateurs. Elections filter for ambition; Lotteries filter for availability. Neither filters for competence. That is the problem this room was too small to simulate."*

  ## 7. Facilitator Cheat Sheet (Keep in Pocket)
  *   **If they ask "Why $5?":** "It's the rule of the game. Don't analyze the number, analyze the behavior."
  *   **If they ask "Can I campaign in Session B?":** "No. You are a citizen drawn by chance. You have the floor only to propose the split."
  *   **If the Pot hits $0:** "The game ends. We discuss why it hit $0."
  *   **If someone refuses to decline (Session B):** "You are not required to decline. But remember, if you serve, you do the work."
  *   **If someone refuses to serve (after declining once):** "The rule is mandatory service on the second draw. Please propose a split."

  ## 8. Why This Works
  You are bypassing their intellectual defenses by making them *complicit*.
  *   In Session A, *they* voted for the incumbent. They can't blame the system; they built it.
  *   In Session B, *they* watched their neighbors burn the money. They can't claim the opt-out is harmless; they felt the loss.
  *   The Whiteboard provides the empirical evidence for your final argument. You aren't telling them the theory; you are showing them the data they just generated.
