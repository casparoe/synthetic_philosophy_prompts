      *   In Harrigan-Spekkens, $\psi$-ontic means $\psi$ is part of $\lambda$. $\psi$-epistemic means $\psi$ is a distribution over $\lambda$.
      *   If QM is "complete", does it mean $\psi$ is the *full* description of reality? If so, $\psi$ must be $\lambda$. Then $\psi$ is ontic.
