answer: |-
  # The Deep-Past Sorting Instrument

  This is a decision tree designed to fit on a phone screen. It does not ask you to judge *truth* directly; it asks you to judge the *behavior* of the claim and the evidence. There are 12 question nodes. Follow the arrows until you hit a leaf.

  ### The Questions (Nodes)

  1.  **Evidence Type:** Is the primary evidence a physical object found in the ground, or a story/text written by people?
  2.  **Maker Benefit:** Did the person who produced the key evidence gain money or fame directly from selling it or revealing it immediately?
  3.  **Original Intent:** Is the source material clearly intended as a moral or religious lesson by its original authors?
  4.  **The One-Big-Mistake:** For this to be true, does it require thousands of unrelated records across different cultures to be wrong simultaneously?
  5.  **The Ratchet:** When a new discovery conflicts with the story, does the story change to fit the discovery, or does the discovery get labeled a mistake?
  6.  **Suppression:** Does the claim rely on the idea that opposing evidence was actively hidden or destroyed by a specific group?
  7.  **The Dull-Detail:** Does the theory predict specific, boring details (like pollen counts or tool wear) that can be checked, or only spectacular discoveries?
  8.  **Prediction Timing:** Was this specific outcome predicted *before* the evidence was dug up, or explained *after*?
  9.  **Expert Disagreement:** Are experts arguing about *what the evidence means*, or about *whether the evidence is real*?
  10. **Continuity:** Does the claim require a sudden loss of technology/skill followed by no trace, or a gradual change?
  11. **Replication:** Can independent teams find the same evidence using the same methods, or is it a one-time find?
  12. **Consistency:** Do the details of the story stay the same over time, or do they grow and change with every new retelling?

  ---

  ### The Flowchart Logic

  *   **Start at Q1.**
      *   **If Physical Object:** Go to **Q2**.
          *   **Yes (Profit/Fame):** Go to **Q9**.
              *   **If "Whether Real":** → **Leaf: Outright Hoax or Forgery**
              *   **If "What it Means":** → **Leaf: Honest Speculation (Wrong)**
          *   **No (No Profit):** Go to **Q4**.
      *   **If Story/Text:** Go to **Q3**.
          *   **Yes (Moral/Religious):** → **Leaf: Myth Read as Literal History**
          *   **No (Historical Claim):** Go to **Q4**.

  *   **From Q4 (One-Big-Mistake):**
      *   **Yes (Thousands of records wrong):** Go to **Q5**.
          *   **If "Discovery Labeled Mistake":** Go to **Q6**.
              *   **Yes (Suppression):** → **Leaf: Pseudohistory Proper**
              *   **No (No Suppression):** Go to **Q7**.
                  *   **If "Spectacular Only":** → **Leaf: Pseudohistory Proper**
                  *   **If "Boring Details":** → **Leaf: Honest Speculation (Wrong)**
          *   **If "Story Changes":** Go to **Q12**.
              *   **If "Details Change":** → **Leaf: Right for the Wrong Reasons**
              *   **If "Details Same":** → **Leaf: Settled Mainstream History**
      *   **No (Localized Error):** Go to **Q8**.
          *   **If "Explained After":** Go to **Q10**.
              *   **If "Sudden Loss":** → **Leaf: Honest Speculation (Wrong)**
              *   **If "Gradual Change":** Go to **Q11**.
                  *   **If "One-time Find":** → **Leaf: Genuinely Open Question**
                  *   **If "Replicable":** → **Leaf: Settled Mainstream History**
          *   **If "Predicted Before":** Go to **Q7**.
              *   **If "Spectacular Only":** → **Leaf: Right for the Wrong Reasons**
              *   **If "Boring Details":** → **Leaf: Settled Mainstream History**

  ---

  ### The Leaves (Categories & Costs)

  1.  **Settled Mainstream History:** The claim fits the record, allows for correction, and predicts boring details.
      *   *Cost:* Costs you the thrill of being the only one who knows the truth.
  2.  **Genuinely Open Question:** Experts agree the evidence is real but disagree on the interpretation; data is replicable but incomplete.
      *   *Cost:* Costs you the comfort of a definite answer.
  3.  **Honest Speculation (Wrong):** A reasonable guess made with available data that turned out to be incorrect, without conspiracy.
      *   *Cost:* Costs you the certainty of being right.
  4.  **Pseudohistory Proper:** The claim cannot be wrong by design; it requires global error and explains away conflicts.
      *   *Cost:* Costs you the ability to change your mind when new data arrives.
  5.  **Outright Hoax or Forgery:** The evidence was manufactured for gain, and experts dispute its reality.
      *   *Cost:* Costs you your reputation if caught, or your money if you believe it.
  6.  **Myth Read as Literal History:** A story written for moral/religious purpose is treated as a factual report.
      *   *Cost:* Costs you the literal truth of the story to keep its moral value.
  7.  **Right for the Wrong Reasons:** The conclusion is correct, but the method was lucky, flawed, or the story mutates to fit.
      *   *Cost:* Costs you the credit for the discovery method.

  ---

  ### Empty Corners (Impossible Combinations)

  *   **The "Honest Global Conspiracy":** A claim that requires thousands of records to be wrong (Q4=Yes) but predicts checkable, boring details (Q7=Boring). This combination is incoherent; if you are faking global history, you will not leave boring, checkable traps for yourself.
  *   **The "Profitable Myth":** A source clearly intended as a moral lesson (Q3=Yes) where the author gained immediate financial profit from selling it as fact (Q2=Yes). While possible (a scammer writing scripture), historically these separate quickly: either it becomes a religion (Myth) or a fraud (Hoax).
  *   **The "Static Pseudohistory":** A claim that requires global error (Q4=Yes) but never changes its story despite new conflicts (Q5=Story Changes). Pseudohistory survives by mutating; if it stays static against conflicting data, it dies and becomes simply "Wrong."

  ---

  ### Case Studies

  #### 1. Fomenko's "New Chronology" (Russia's history is fake)
  *   **Path:** Q1 (Text/Map mix) → Q3 (No, claims history) → Q4 (Yes, requires global records wrong) → Q5 (Discovery Labeled Mistake) → Q6 (Yes, claims academic suppression) → **Leaf: Pseudohistory Proper.**
  *   **Analysis:** The tree handles this cleanly. It triggers the *One-Big-Mistake* rule immediately (all of chronology must be wrong) and the *Ratchet* rule (dating errors are always assumed to favor the mainstream).
  *   **Cost:** Adherents lose the ability to accept carbon dating or astronomical records without assuming a conspiracy.

  #### 2. Piltdown Man (The missing link skull)
  *   **Path:** Q1 (Physical Object) → Q2 (Yes, finder gained fame/standing) → Q9 (Experts argued "Whether Real") → **Leaf: Outright Hoax or Forgery.**
  *   **Analysis:** Clean path. The financial/social benefit node (Q2) separates this from honest error.
  *   **Category Flip:** This sat in **Settled Mainstream History** for 40 years. It only flipped to **Hoax** once Q9 (Expert Disagreement) shifted from "What it means" to "Whether it is real" after chemical testing.

  #### 3. Plato's Atlantis (As actually told)
  *   **Path:** Q1 (Story/Text) → Q3 (Yes, moral lesson in *Timaeus/Critias*) → **Leaf: Myth Read as Literal History.**
  *   **Analysis (The Break):** This is where the tree struggles. Most Discord users arguing for Atlantis treat it as **Physical Evidence** (Q1=Object) because they are looking for ruins. If you force Q1=Object, the tree pushes toward **Honest Speculation** or **Pseudohistory** depending on Q4. But the *source* is text. The tree forces a binary (Text vs. Dirt) that doesn't capture "Text that claims to describe Dirt."
  *   **Why it breaks:** The tree assumes the *current* evidence type, not the *original* claim type. If a user says "I found the location," they shift the node to Q1=Object, bypassing the Myth leaf entirely.

  ---

  ### Limitations & Blurs

  **The "Honest-but-Wrong" vs. "Right-by-Accident" Blur:**
  The tree separates these using Q8 (Prediction Timing) and Q12 (Consistency). However, in practice, these blur. A theorist might make a lucky guess (Right/Wrong) but then retrofit the explanation (Honest/Wrong). The tree forces a choice based on whether the story *grows* (Q12), but honest scientists also refine theories. The distinction relies on *why* the story changes (to fit data vs. to save the claim), which is hard to capture in a yes/no node.

  **The "Hoax" vs. "Myth" Blur:**
  If a hoaxer starts believing their own lie (e.g., a forger who convinces themselves the artifact is real), Q2 (Maker Benefit) becomes ambiguous. Did they profit, or did they seek glory for a truth they think they found? The tree assumes rational self-interest in Q2; it struggles with the "faithful fraud."

  **The "Open Question" vs. "Mainstream" Blur:**
  This depends entirely on Q11 (Replication) and Q9 (Expert Disagreement). These are time-sensitive. Göbekli Tepe moved from **Open Question** to **Settled Mainstream** as more layers were excavated (Q11 shifted from One-time to Replicable). The tree is a snapshot; it does not account for the *velocity* of consensus.

  **The "Pseudohistory" Trap:**
  The tree is aggressive on Q4 (One-Big-Mistake). Some legitimate revisionist history (e.g., the Bronze Age Collapse) requires significant record re-evaluation but isn't pseudohistory. If a user answers "Yes" to Q4 because they feel the records *are* that wrong, they get funneled to Pseudohistory even if their methodology is sound. The question measures *scope of error*, not *quality of argument*, which is a necessary trade-off for layperson usability but creates false positives for radical but honest academics.
