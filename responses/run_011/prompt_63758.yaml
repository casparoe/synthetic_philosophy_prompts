  ### Scenario: The Deep-Sea Salvage Accord

  Three symmetric firms—Alpha, Beta, and Gamma—dominate deep-sea cable repair. Each faces independent risks of catastrophic equipment loss. In the absence of agreement, each bears its own losses and chooses safety spending freely. Market rates are fixed; profits depend on cost control. Tacitly, firms maintain moderate safety standards, yielding stable annual profits of £100m each.

  To secure preferential contracts from consortium clients, the firms negotiate the **Deep-Sea Salvage Accord**. This creates a joint liability pool: losses are shared equally. Crucially, Article 5 states: *"All members must adopt the highest safety specification currently operated by any member within six months of its deployment."*

  The firms know two things with certainty. First, safety technology improves exogenously every year, increasing costs without increasing revenue (clients pay fixed rates). Second, if any two firms sign, the third is excluded from the consortium contracts, reducing its profit to £50m annually.

  At signing, each calculates that the Accord's ratchet clause will force costly upgrades annually, driving profits down to £90m, then £80m, then £70m. The net present value of the Accord is lower than the status quo. However, given that the other two will sign, refusing yields £50m while signing yields £90m initially. Rationality compels all three to sign.

  Once bound, the dynamic unfolds. Alpha deploys a new thruster system to gain a marginal operational edge before the clause triggers. Beta and Gamma must match this expenditure immediately. Costs rise. The temptation to breach Article 5 grows each year as compliance costs eat deeper into margins, yet enforcement is perfect and breach is off the table. They march together toward insolvency, locked in by a contract designed to save them.

  ### Choice Structure and Payoffs

  | State | Actor Choice | Condition | Annual Payoff (£m) | Trajectory |
  | :--- | :--- | :--- | :--- | :--- |
  | **Status Quo** | No Accord | All refuse | 100 | Stable |
  | **Exclusion** | Refuse | Others Sign | 50 | Stable |
  | **Accord (t=0)** | Sign | All Sign | 90 | Pooling benefit > Admin cost |
  | **Accord (t=1)** | Comply | All Sign | 80 | Tech Upgrade 1 mandated |
  | **Accord (t=2)** | Comply | All Sign | 70 | Tech Upgrade 2 mandated |
  | **Temptation** | Breach | All Sign | 100+ | *Unavailable (Spec 3)* |

  *Note: Payoffs are per actor. Tech upgrades are exogenous but adoption is endogenous to the clause.*

  ### Specification Check

  1.  **Three Symmetric Actors:** Alpha, Beta, Gamma are identical in resources and market position.
  2.  **Full Transparency:** Deployment of new tech is observable; costs and payoffs are common knowledge.
  3.  **No Enforceability Failure:** The Accord is binding; Article 5 is complied with perfectly despite rising costs.
  4.  **Harm Stays at the Table:** Profits decline for the firms; clients pay fixed rates; no external regulator intervenes.
  5.  **No Psychological Escape:** Actors are rational; they foresee the deterioration at $t=0$ and sign anyway.
  6.  **Dynamic Trap:** Payoffs decline progressively (90→80→70); the cost saving from breaching (the temptation) increases each stage.
  7.  **Endogenous Bargain:**
      *   *Signing is rational:* Given others sign, £90m (Sign) > £50m (Refuse).
      *   *Refusing is worse:* Exclusion yields £50m vs £90m initial Accord payoff.
      *   *Foreseen deterioration:* PV(Accord) < PV(Status Quo) is known at signing, yet the Nash Equilibrium of the signing game is (Sign, Sign, Sign).

  ### Structural Feature

  The **Unconditional Matching Clause** (Article 5). This provision transforms voluntary innovation into mandatory expenditure. It internalises the externality of safety standards so completely that it eliminates the option to lag.

  **Removal:** If Article 5 is removed, the Accord becomes a simple liability pool. Firms would pool risk without forcing cost escalation. The scenario collapses into a standard coordination problem where the Accord is Pareto superior (risk reduction without cost ratchet), and the trap vanishes.

  ### Attack and Reply

  **Attack:** "This is not a multipolar trap but a static Prisoner's Dilemma disguised as dynamic. The harm is determined at the moment of signing; the subsequent deterioration is merely the unfolding of a bad deal, not a structural trap driven by interaction."

  **Reply:** "The deterioration is interaction-driven. Without the clause, exogenous tech improvements would be adopted selectively based on private cost-benefit analysis (Status Quo). The clause *creates* a coupling where one actor's operational choice forces costs upon the others. The 'race' is not to sign, but to survive the mandated escalation. The trap is dynamic because the pressure to breach (the temptation) grows with each stage, sustained only by the enforceability of the pact itself. The Coasean remedy (the contract) is the engine of the decline, not merely the setting."
