answer: |-
  # The Testimony Key: A Diagnostic for Retired Scientists

  **Instructions:** Start at Question 1. Follow the arrow corresponding to your honest answer. Answer only what is asked; do not look ahead to see where the path leads. When you reach a **Leaf**, read the position and its cost.

  ---

  ### Q1. The Handbook Constant
  A textbook lists a physical constant with no source given. When you use this number, are you treating it as:
  *   **(A)** A placeholder for evidence you *could* find if you dug into the archives? → Go to **Q2**.
  *   **(B)** A standing invitation to use the number without digging? → Go to **Q3**.

  ### Q2. The Calibration Chain
  You use an instrument calibrated by a technician you never met, traceable to a standard in another country. Where does the reliability sit?
  *   **(A)** In the chain of custody and the procedure itself. → Go to **Q4**.
  *   **(B)** In the competence of the specific technicians at each link. → Go to **Q5**.

  ### Q3. The Grad Student
  Your grad student says the run hit temperature, but the log page is missing. Is your first instinct:
  *   **(A)** To check the instrument's internal memory to verify the claim? → Go to **Q5**.
  *   **(B)** To ask the student why the log is missing, assuming they are reporting honestly? → Go to **Q6**.

  ### Q4. The Dead Footnote
  A paper cites a "personal communication" from a scientist who died in 1998. Is that knowledge:
  *   **(A)** Dead, unless the citing author has independently verified it? → **Leaf 1**.
  *   **(B)** Alive, transmitted through the citation like a baton in a relay? → **Leaf 2**.

  ### Q5. The Anonymous Referee
  A referee asserts your method is unsound without saying why. Do you treat this as:
  *   **(A)** A warning that requires *your* investigation to validate? → **Leaf 1**.
  *   **(B)** A claim that requires *their* justification before you accept it? → Go to **Q7**.

  ### Q6. The Co-Author's Purity
  A co-author swears up and down the sample is pure. Believing them is more like:
  *   **(A)** Accepting a bet on the state of the world. → Go to **Q8**.
  *   **(B)** Accepting a handshake of shared responsibility. → **Leaf 3**.

  ### Q7. The Preprint Data
  A preprint reports an effect you can't reproduce, and the authors won't release data. Is the problem:
  *   **(A)** That they are hiding evidence you need to check? → **Leaf 4**.
  *   **(B)** That they are asking for a trust they haven't earned? → Go to **Q9**.

  ### Q8. The Conference Rumor
  Someone at a conference mentions a famous result is an artifact. Do you need to know their credentials before the claim registers as doubtful?
  *   **(A)** Yes, the source determines the weight. → **Leaf 4**.
  *   **(B)** No, the content registers first, credentials second. → Go to **Q10**.

  ### Q9. The Prestigious Lab
  Do you ever accept a result primarily because the lab is prestigious, even if the paper is thin?
  *   **(A)** No, prestige is not data. → **Leaf 5**.
  *   **(B)** Yes, the institution vouches for the work. → Go to **Q11**.

  ### Q10. The Reason for Trust
  When you trust a colleague without checking, is it because:
  *   **(A)** You have inductively verified they are usually right? → **Leaf 5**.
  *   **(B)** It is irrational to doubt intelligible speech without a specific defeater? → **Leaf 6**.

  ### Q11. The Nature of the Error
  When a measurement turns out wrong, is that primarily:
  *   **(A)** A failure of the report (someone lied or messed up)? → **Leaf 7**.
  *   **(B)** A failure of the world (the phenomenon is unstable)? → **Leaf 2**.

  ### Q12. The Outcome
  When you cite a number you didn't measure, do you feel:
  *   **(A)** You *know* it, just as if you measured it? → **Leaf 6**.
  *   **(B)** It is *safe to use*, but you don't strictly "know" it? → **Leaf 7**.

  ---

  ### The Leaves: Positions and Costs

  **Leaf 1: The Global Reductionist (Hume)**
  *   **Position:** Testimony is never a fundamental source of knowledge. It always reduces to perception and induction. You must verify the chain or the claim independently.
  *   **Cost:** You spend your life checking other people's work, knowing you can never check it all.

  **Leaf 2: The Deflationary Instrumentalist**
  *   **Position:** Testimony isn't a source of knowledge at all; it's a tool for coordination. You don't "know" the constant; you just use it to get work done.
  *   **Cost:** You spend your life using tools you don't claim to understand, sacrificing epistemic pride for utility.

  **Leaf 3: The Assurance View (Faulkner/Moran)**
  *   **Position:** Believing someone is closer to trusting a person than weighing evidence. They take responsibility for the truth; you accept the relationship.
  *   **Cost:** You spend your life managing relationships, where betrayal hurts more than error.

  **Leaf 4: The Local Reductionist**
  *   **Position:** Testimony is generally reliable, but *this* instance needs positive reasons to be trusted. Context dictates the burden of proof.
  *   **Cost:** You spend your life deciding when to check, constantly judging the stakes.

  **Leaf 5: The Dualist (Lackey)**
  *   **Position:** Sometimes justification comes from the speaker's reliability, sometimes from the hearer's reasons. You need two rulebooks for two kinds of claims.
  *   **Cost:** You spend your life managing two rulebooks, unsure which one applies to the current paper.

  **Leaf 6: The Entitlement View (Burge)**
  *   **Position:** You are rationally entitled to accept intelligible testimony by default. It's not that people are honest; it's that doubt requires a reason.
  *   **Cost:** You spend your life defending rational defaults against skeptics who demand evidence for everything.

  **Leaf 7: The Anti-Reductionist (Reid/Coady)**
  *   **Position:** Testimony is a fundamental source of knowledge, built into our nature. We are designed to speak and to believe.
  *   **Cost:** You spend your life vulnerable to liars, because your design assumes truth.

  ---

  ### Analysis of the Logical Space

  You asked for the map of the territory, not just the path through it. Below is the logical space defined by the questions in the tree. I have treated the questions as coordinates to see where the philosophers stand and where the empty rooms are.

  **The Three Coordinates:**
  1.  **Burden of Proof:** Does the hearer need positive reasons (Reductionist) or does the speaker need to provide defeaters (Anti-Reductionist)?
  2.  **Source of Normativity:** Is trust based on Evidence (Induction), Right (Entitlement), or Relationship (Assurance)?
  3.  **Ontology of Testimony:** Is it Knowledge (Generative) or Utility (Transmissive/Deflationary)?

  **The Grid of Combinations:**

  | Burden | Normativity | Ontology | Position | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **Hearer** | **Evidence** | **Utility** | **Global Reductionist** | **Occupied (Hume)** |
  | **Hearer** | **Evidence** | **Knowledge** | **Local Reductionist** | **Occupied** |
  | **Hearer** | **Relationship** | **Knowledge** | **Assurance View** | **Occupied (Faulkner)** |
  | **Speaker** | **Right** | **Knowledge** | **Entitlement View** | **Occupied (Burge)** |
  | **Speaker** | **Nature** | **Knowledge** | **Anti-Reductionist** | **Occupied (Reid)** |
  | **Split** | **Mixed** | **Knowledge** | **Dualist** | **Occupied (Lackey)** |
  | **Hearer** | **None** | **Utility** | **Deflationary** | **Occupied** |
  | **Speaker** | **Evidence** | **Utility** | **Empty** | **Incoherent** |
  | **Hearer** | **Relationship** | **Utility** | **Empty** | **Unattractive** |
  | **Speaker** | **Right** | **Utility** | **Empty** | **Unexplored** |

  **The Empty Cells:**

  1.  **Speaker Burden + Evidence Source + Utility Ontology:**
      *   *Why Empty:* Incoherent. If the speaker must provide evidence, they are generating knowledge, not just utility. If the output is merely utility, why demand evidence from the speaker?
  2.  **Hearer Burden + Relationship Source + Utility Ontology:**
      *   *Why Empty:* Unattractive. This describes a mercenary relationship ("I trust you because it pays me to, but I'm checking anyway"). No philosopher advocates this as a normative epistemic stance.
  3.  **Speaker Burden + Right Source + Utility Ontology:**
      *   *Why Empty:* Unexplored. This would be "You are entitled to use my data without checking, but you don't *know* it." A pragmatic version of Burge. Someone might be standing here, but they haven't planted a flag.

  **Your Suspicion:**
  You suspected a cell for *"Positive reasons required, but required of the institution rather than the individual hearer."*
  *   **Location:** This sits between **Global Reductionist** and **Entitlement**.
  *   **Status:** It is partially occupied by **Local Reductionists** who focus on institutional reputation (Q9 in the tree). However, strictly speaking, most reductionists demand the *hearer* possess the reasons. The view where the *institution* holds the reasons and the hearer just draws on them is a form of **Social Anti-Reductionism**. It is under-theorized. Most philosophers focus on the individual dyad (Speaker-Hearer). The "Institution as Testifier" is the gap in the literature you spotted.

  ---

  ### Critique of the Tree

  **1. Indistinguishable Leaves:**
  *   **Reid (Anti-Reductionist) vs. Burge (Entitlement):** The tree separates them at Q10 (Nature of Trust). In practice, these are nearly impossible to pull apart. Both result in "Default Trust."
      *   *To Separate Them:* You would have to ask: "If you discovered humans were evolved to lie systematically, would you still feel rational trusting speech?" Reid says "No, our nature is broken." Burge says "Yes, rationality is independent of evolutionary history."
  *   **Global Reductionist vs. Deflationary:** Both end up verifying or treating data as tools.
      *   *To Separate Them:* Ask Q12. The Reductionist thinks you *can* know via verification; the Deflationist thinks you only *use* via verification.

  **2. The "Person vs. Chain" Axis:**
  *   **Question:** Is this axis orthogonal to the reductionism debate or does it cut across it?
  *   **Verdict:** It **cuts across it**, but not cleanly.
      *   *Why:* You can be a Reductionist about people (verify the grad student) and a Reductionist about chains (verify the calibration). You can be an Anti-Reductionist about people (trust the colleague) but a Reductionist about chains (machines don't speak, they output data).
      *   *The Twist:* The "Chain" often forces Reductionism. You cannot have an interpersonal "Assurance" relationship with a calibration certificate. Therefore, the "Chain" branch of the tree (Q1-Q2) funnels users toward Reductionist or Deflationary leaves more often than the "Person" branch. The axis is not orthogonal; it biases the outcome.

  **3. Absurd Questions:**
  *   **Q2 (Technician vs. Chain):** A working scientist might find both answers absurd. In modern metrology, the technician *is* part of the chain. Separating the "human turn" from the "procedural link" is an artificial philosophical carve-up. In the lab, the signature on the certificate *is* the chain.
  *   **Q11 (Error in World vs. Report):** Scientists know errors are often both. A unstable phenomenon (World) leads to a noisy report (Report). Forcing a choice here might feel like false precision.

  **4. Unseparated Pairs:**
  *   **Leaf 4 (Local Reductionist) and Leaf 5 (Dualist):** Both require context-sensitive verification. The tree separates them on "Prestige" (Q9), but a Dualist might accept prestige as a speaker-based reason, while a Local Reductionist might accept it as hearer-based induction. The distinction is subtle. To pull them apart, you'd need to ask: "When you trust the prestigious lab, is it because *they* are reliable (Speaker) or because *you* have learned labs like that are safe (Hearer)?"

  ---

  **Final Note for the Group:**
  This tree is not a verdict. It is a mirror. If you find yourself bouncing between branches, that is not a failure of your logic; it is a sign that scientific practice is more complex than the philosophical categories. The "Institutional Chain" you mentioned is likely the place where the current philosophy breaks down. If you find yourself stuck there, you aren't lost; you're just ahead of the literature.
