          *   *Procedural Facts:* The vote chose a dynamical definition over a structural one. This supports the context-sensitivity reading. The dissenters (geophysicists) wanted an intrinsic definition. The conflict is about *which property* constitutes the kind, not just where the line is drawn.

  4.  **Deconstruct Question 3: Three Readings:**
      *   *Discovery:* Boundary existed naturally. Vote tracked it.
