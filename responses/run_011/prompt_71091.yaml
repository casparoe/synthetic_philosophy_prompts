      *   *Commitment:* Engineering Reading is strongest. It explains the split definitions and the utility of "dynamical dominance" for classification schemes without claiming ontological discovery.
      *   *Falsification:* If the IAU claims this is an ontological truth rather than a convention, or if they apply the definition rigidly to edge cases where it makes no dynamical sense.

  5.  **Deconstruct Question 4: Reverse Analysis (What this shows about Vagueness Theories):**
      *   *Conventionalism:* The 2005 committee offered a "cultural" definition. It was rejected, but the final choice was still conventional (Engineering). This suggests scientific kind-terms are not purely natural kinds but involve stipulative elements.
      *   *Mercury Exception:* Mercury is not in hydrostatic equilibrium but is a planet.
