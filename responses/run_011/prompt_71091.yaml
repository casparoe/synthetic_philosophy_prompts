answer: |-
  1. **The Sorites Series and Dispositional Vagueness**

  There is a Sorites series here, but it is dispositional rather than actual. To construct the series, we take the ordering dimension to be the dynamical clearing measure (roughly mass squared divided by orbital period). The base case is a body with maximal clearing capacity (e.g., Jupiter). The inductive step is: if a body with clearing measure $n$ is a planet, then a body with clearing measure $n - \epsilon$ is also a planet. The tolerance principle relies on the intuition that a marginal decrease in dynamical dominance cannot ontologically transform a planet into a non-planet.

  The observed bimodality of the Solar System—the gap between the eight dominant bodies and the dwarf planets—does not defeat the tolerance premise; it merely masks its application in the current sample. The Sorites paradox arises from the logic of the concept, not the distribution of instances. Because the definition must govern undiscovered bodies and hypothetical objects (e.g., a Mars-mass object in the Kuiper Belt), the continuum of *possible* clearing measures remains intact. Nature did not populate the gap, but the definition allows for it. If a body were discovered with a clearing measure precisely between the Earth and Pluto, the tolerance principle would force the paradox: there is no non-arbitrary point where "clearing" becomes "not clearing."

  Therefore, the vagueness is dispositional. The term "planet" possesses a latent Sorites susceptibility because the criterion (dynamical dominance) is a continuous physical variable, even if the actual extension of the term currently falls into clusters. The bimodality makes the boundary *epistemically* easy to draw for now, but it does not render the concept *semantically* sharp. The vagueness lies in the fact that the definition imposes a binary classification on a continuous physical reality, creating a boundary that is inherently sensitive to small changes in mass or orbital distance for hypothetical cases.

  2. **Locating the Vagueness and the Location-Dependence Objection**

  The vagueness is located primarily in the third condition ("cleared the neighbourhood") rather than in the extension of the word "planet" itself. The 2006 resolution attempts to relocate the problem: it treats "planet" as a sharp term defined by three sharp conditions, thereby pushing the vagueness into the technical interpretation of "clearing." However, since "clearing" is a matter of degree (quantified by the measure), the resolution merely shifts the soritical boundary from the kind-term to the criterion. The threshold value for the clearing measure is not derived from a physical phase transition but is a stipulated cut-off. Thus, the resolution does not dissolve the vagueness; it hides it inside the dynamical criterion.

  The location-dependence objection (that a Mars-mass body is a planet in one orbit but not another) is not a problem of vagueness but of context-sensitivity and relational properties. Vagueness concerns borderline cases where truth values gap (e.g., "is this a heap?"). Context-sensitivity concerns terms whose extension shifts with parameters (e.g., "is this tall?" depends on the comparison class). The procedural facts support the diagnosis of context-sensitivity. The Union explicitly rejected the structural definition (intrinsic shape) in favor of a hybrid that includes a dynamical condition (relational dominance). By voting for a definition where status depends on the orbital environment, the Union made "planet" a relational predicate. The dissenters' complaint is not that the boundary is fuzzy, but that the *kind* of property required has changed from intrinsic to relational. This is a dispute about the metaphysics of the category, not the logic of borderline cases. The vagueness machinery is less useful here than the machinery of indexicality or sortal relativity.

  3. **Three Readings of the Union's Action**

  **The Discovery Reading:**
  *   **Action:** The Union identified a pre-existing natural boundary in the Solar System's architecture.
  *   **Dissenters:** They are empirically mistaken; they fail to see the natural kind distinction.
  *   **Precedent:** The 1801–1851 asteroid reclassification was a correction of an earlier error in counting natural kinds.
  *   **Legitimacy:** The vote's legitimacy rests on the epistemic authority of the voters to perceive nature correctly.
  *   **Assessment:** This reading is weak. It cannot account for the location-dependence problem (a Mars-mass object's status changing with orbit) or the Mercury exception (which violates the hydrostatic equilibrium condition). Nature does not respect the "cleared neighbourhood" threshold as a binary switch in all possible worlds.

  **The Precisification Reading:**
  *   **Action:** The Union selected one admissible sharpening of a vague term from a range of permissible options, constrained by core usage.
  *   **Dissenters:** They are proposing a competing but admissible sharpening (e.g., the structural definition).
  *   **Precedent:** The asteroid reclassification was a linguistic convention adopted to manage the vagueness of "planet" as the extension grew.
  *   **Legitimacy:** Legitimacy derives from the Union's role as the stipulative authority for astronomical nomenclature, provided core truths (e.g., "Mercury is a planet") are preserved.
  *   **Assessment:** This fits the voting procedure and the retention of Mercury (preserving core usage). However, it struggles with the Exoplanet split. If "planet" is being precisified, why are two different precisifications used for Solar System and exoplanet bodies? This suggests the meaning is not being clarified but diverged.

  **The Engineering Reading:**
  *   **Action:** The Union replaced a loose, folk-astronomical concept with a technical tool designed for specific dynamical classifications.
  *   **Dissenters:** They are advocating for a different tool (a geophysical concept) for different purposes. The disagreement is pragmatic, not truth-conditional.
  *   **Precedent:** The asteroid reclassification was a cataloguing decision driven by the utility of distinguishing dominant bodies from belt debris.
  *   **Legitimacy:** Legitimacy rests on institutional pragmatism. The few hundred voters act as a standards body (like ISO), not as discoverers or semantic arbiters.
  *   **Assessment:** This is the most defensible reading. It explains the hybrid definition (optimizing for dynamical studies), the Exoplanet split (different contexts require different engineering specs), and the Mercury exception (grandfathering paradigmatic cases for stability). It treats the definition as a norm for usage rather than a description of reality.

  **Verdict:** The Engineering Reading is superior. It alone accommodates the fact that the definition is a hybrid of structural and dynamical criteria chosen for utility, acknowledges the divergence with exoplanet definitions, and explains why the Mercury exception is permissible (technical standards often grandfather legacy cases).
  **Falsification:** This reading would be falsified if the Union were to claim that the definition reflects an ontological truth that would hold even if no astronomers existed to classify bodies, or if they applied the clearing criterion rigidly to Mercury, thereby demoting it.

  4. **Reverse Analysis: Implications for Vagueness Theories**

  This episode reveals limitations in standard theories of vagueness when applied to institutional scientific practice.

  First, the 2005 committee's consideration of a "cultural" definition (whatever people say is a planet) and its subsequent rejection in favor of a technical hybrid suggests that scientific kind-terms are not governed by descriptivism alone. The fact that the cultural option was set aside not because it was "false" but because it was "unuseful" supports a pragmatic or engineering account of classification over a purely semantic one. Vagueness theories that treat sorites problems as puzzles to be solved by logic alone miss the dimension of *stipulative authority*. The Sorites paradox was resolved here not by finding the true boundary, but by legislating one.

  Second, the treatment of Mercury is critical. Mercury is stipulated as a planet despite failing the hydrostatic equilibrium condition. In Supervaluationism, a statement is "super-true" if it is true on all admissible precisifications. "Mercury is a planet" functions as a super-true core that constrains the admissibility of any new definition. Any precisification that excludes Mercury is ruled inadmissible *a priori*. This fits the Supervaluationist model of preserving core intuitions while sharpening boundaries. However, it also suggests that for scientific kind-terms, the "core" is historical and paradigmatic, not definitional. The definition is subordinate to the exemplars.

  Third, standard vagueness theories are silent on institutional authority. They assume a linguistic community evolves usage organically. Here, a subset of that community (the voters) imposed a sharpening on the rest. The fact that a later informal vote of planetary scientists rejected the definition highlights a conflict of authority. This indicates that for technical terms, vagueness is managed by power structures as much as by semantic rules. The "truth" of the classification is less important than the "standardization."

  **Conclusion:** The 2006 decision is best understood as an act of semantic engineering rather than discovery or precisification. The vagueness of "planet" was not solved; it was bypassed by stipulation. This episode demonstrates that in scientific contexts, Sorites problems are often resolved pragmatically: the boundary is drawn where it is useful, even if it is arbitrary, and core exemplars are preserved by fiat. Vagueness theories that ignore the role of institutional stipulation and the primacy of paradigmatic cases (like Mercury) fail to capture how scientific language actually functions under pressure. The Union did not find the line; they drew it.
