      *   *Ethnosymbolists/Medievalists:* Nation = Community of descent/myth/history + Attachment to homeland. Key function: Cultural continuity. Key claim: Modern nations are built on pre-existing *ethnies*. Hastings specifically: Biblical Israel model (covenant, law, land) transmitted via Church makes England a nation early on.
      *   *The Stalemate:* Modernists say "That's not a *nation*, that's a *gens* or kingdom." Ethnosymbolists say "You're defining 'nation' to mean 'modern nation-state', making your conclusion tautological."

  3.  **Evaluate the User's Hypothesis:**
      *   *Part 1 (Verbal/Checklist vs. Functional):* Plausible. Modernists use a strict checklist (sovereignty, mass literacy). Ethnosymbolists use a functional/phenomenological approach (sense of belonging, myth). *Critique:* It's not *just* verbal. It implies different ontologies of social cohesion.
      *   *Part 2 (Different Questions):* Strong point. Gellner asks "What makes nationalism *necessary*?" Smith/Hastings ask "What makes nationalism *possible*?" *Critique:* They do overlap on "When did it start?" which causes the friction.
      *   *Part 3 (Unfalsifiable Invented Tradition):* Very strong. If every continuity is an "invention," modernism becomes a shield against counter-evidence. *Critique:* Ethnosymbolism can also be unfalsifiable (any modern sentiment is read back into the past).
      *   *Hastings' Biblical Claim:* This is the tricky part. Is it a fourth thing? It shifts the debate from sociology to theology/archetype. It suggests the *concept* of nationhood is theological, not sociological. This challenges the "verbal/substantive" taxonomy because it changes the *genre* of the definition.

  4.  **Diagnose the Disagreement:**
      *   It is a **cluster concept dispute** masked as a historical timeline dispute.
      *   It is also a **teleological disagreement**. Modernists see the nation as the solution to a modern problem (legitimacy in mass society). Medievalists see it as the expression of an eternal human need (belonging).
      *   The "Unfalsifiable" charge is correct but applies to *both* sides (Modernists: "It's fake continuity"; Medievalists: "It's latent continuity").
      *   The Hastings point is crucial: It's not just about *when*, it's about *what kind of thing* a nation is (political contract vs. covenantal community).

  5.  **Identify Hidden Empirical Questions:**
      *   Can we measure "national consciousness" in 1300?
      *   *Problem:* Evidence is textual (elite) vs. behavioral (mass).
      *   *Deciding Evidence:* If we found mass literacy/self-identification among peasants in 1300 comparable to 1850, Modernists weaken. If we found that 19th-century nationalists explicitly rejected medieval myths, Ethnosymbolists weaken.
      *   *Real Bottleneck:* The *threshold* of "enough" identification. This returns to the *sorites* problem.

