  (a) **Genuine Tensions**

  1.  **Items (1) and (7) [Severity: Critical]**
      *   **Collision:** (1) asserts explanatory monism: *every* epistemic injustice is explained by social identity distorting registration (implying a prejudice-based mechanism). (7) asserts hermeneutical injustice is structural and requires no prejudicial actor.
      *   **Why not verbal:** (1) demands a psychological/identity mechanism for all cases; (7) explicitly excludes the need for such a mechanism in hermeneutical cases.
      *   **Resolution:** You must drop the monism claim in (1) or add a prejudice requirement to (7).
      *   **Cost:** Dropping (1) sacrifices theoretical unity. Adding prejudice to (7) contradicts the structural nature of hermeneutical gaps and makes finding a perpetrator necessary where none exists.

  2.  **Items (2) and (5) [Severity: High]**
      *   **Collision:** (2) defines testimonial injustice as a credibility deficit relative to *actual* reliability. (5) counts a confused/mistaken speaker (low actual reliability) as a victim of injustice when disbelieved.
      *   **Why not verbal:** If desert is fixed by actual reliability (2), a confused speaker deserves low credibility. Receiving low credibility is not a deficit. (5) asserts it is an injustice.
      *   **Resolution:** Revise (5) to deny injustice in unreliable cases, or revise (2) to decouple desert from actual reliability.
      *   **Cost:** Revising (5) contradicts your stated preference to save verdicts, but aligns with the metric. Revising (2) undermines the epistemic grounding of the injustice, making it purely political.

  3.  **Items (4) and (8) [Severity: Moderate]**
      *   **Collision:** (8) defines the primary harm as exclusion from the exchange of reasons. (4) claims the over-credited are victims.
      *   **Why not verbal:** The over-credited are hyper-included, not excluded. Counting inflation as "exclusion" stretches the definition of harm in (8).
      *   **Resolution:** Broaden (8) to include distortion of agency, not just exclusion.
      *   **Cost:** Dilutes the core intuition that epistemic injustice is a harm of marginalization/silencing.

