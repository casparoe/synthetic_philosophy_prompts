  *   **Items (3) and (4):** These appear to conflict because (3) sets a necessary condition (prejudice) for injustice, while (4) extends victimhood to the privileged. However, (3) is textually limited to cases where a hearer *under-trusts* ("If a hearer under-trusts..."). It does not logically preclude *over-crediting* based on identity from counting as injustice. The appearance of conflict arises from reading the title of (3) as a universal claim rather than a conditional one restricted to testimonial deficits.

