      4.  *Case Verdict:* Hybridizing, reciprocally monophyletic (mtDNA), distinct plumage forms = **One Species**. (Defend to splitter).
      5.  *Prokaryotes:* 95% ANI cutoff. Claims this tracks a *real discontinuity*, not just a convention.
      6.  *Ring Species:* BSC unusable, but species real. Fuzziness = individual mid-formation.
      7.  *Monism:* One right concept for all life. Pluralism = giving up.
      8.  *Asexuals:* They have species too; account must cover them.

  3.  **Initial Scan for Obvious Tensions:**
      *   *Claim 3 (PSC) vs. Claim 4 (Verdict):* PSC usually demands monophyly + diagnosis. Claim 4 says they *are* monophyletic (mtDNA) and distinct (plumage), yet the verdict is *One Species*. This looks like a direct contradiction. PSC usually splits here.
      *   *Claim 2 (Realism/Discovery) vs. Claim 5 (Prokaryote Cutoff):* Claim 5 admits the number is a convention but claims it lands on a real gap. Claim 2 says boundaries are discovered. This is potentially compatible *if* the gap is real. But is 95% ANI a real gap or a heuristic? This needs scrutiny.
      *   *Claim 1 (Individuals) vs. Claim 3 (PSC):* PSC is often criticized for treating species as classes/kinds (diagnostic characters as essences). Can you be an Individualist and use PSC? Yes, if characters are historical markers, not essences. But there's friction.
      *   *Claim 7 (Monism) vs. Claim 5 (Prokaryotes) & Claim 3 (PSC):* If PSC is the *one* concept (Claim 3 + 7), does it work for Prokaryotes (Claim 5)? Claim 5 uses ANI, Claim 3 uses Monophyly+Diagnosis. Are these the same concept?
      *   *Claim 4 (Verdict) vs. Claim 2 (Realism):* If they are monophyletic and diagnosable (Claim 4 description), but you call them one species, are you ignoring the "discovered" boundary? Or is the "real" boundary defined by gene flow (BSC-ish) despite the PSC commitment?
      *   *Claim 7 (Monism) vs. Claim 4 (Verdict):* Claim 4 sounds BSC-influenced (hybridization/fertility matters). Claim 3 says PSC. Claim 7 says One Concept. Which one is it?

  4.  **Detailed Pairwise Analysis (Drafting the Conflicts):**

      *   **Conflict A: The PSC vs. The Verdict (3 vs 4).**
          *   *Tension:* Claim 3 says "Smallest monophyletic cluster + fixed diagnostic." Claim 4 says "Reciprocally monophyletic (mtDNA) + differ consistently in plumage." By Claim 3's definition, Claim 4's organisms *are* two species. But Claim 4 says "I say one species."
          *   *Severity:* Critical. This is an internal contradiction in operationalization.
          *   *Resolution:* Weaken 3 (PSC is a heuristic, not the definition) or Change 4 (Call them two species).
          *   *Cost:* If 3 is weakened, Monism (7) is threatened. If 4 is changed, the specific biological case study falls apart.

      *   **Conflict B: Monism vs. The Prokaryote/ANI Gap (7 vs 5 vs 3).**
          *   *Tension:* Claim 7 says One Concept. Claim 3 says PSC (Monophyly+Diagnosis). Claim 5 says ANI cutoff. Is ANI cutoff the same as PSC? PSC requires monophyly. ANI clusters often don't resolve to strict monophyly in gene trees due to HGT. If the "One Concept" is PSC, does it apply to bacteria where monophyly is messy? If the "One Concept" is "Real Gaps," then 3 is too specific.
          *   *Severity:* High. Threatens the universal scope.
          *   *Resolution:* Broaden the concept to "Discontinuity" (dropping strict PSC) or admit Pluralism (dropping 7).
          *   *Cost:* Dropping 7 hurts the philosophical stance. Dropping strict PSC hurts Claim 3.

      *   **Conflict C: Individuality vs. Diagnostic Characters (1 vs 3).**
          *   *Tension:* Claim 1 says "No essence." Claim 3 requires "Fixed diagnostic character." If the character is *required* for species status, does it function as an essence?
          *   *Severity:* Moderate/Philosophical. Can be resolved if characters are viewed as historical markers (autapomorphies) rather than defining properties.
          *   *Resolution:* Clarify that diagnosis is evidence of lineage separation, not the ontological glue.
          *   *Cost:* Mostly expository.

      *   **Conflict D: Realism vs. The Hybrid Zone Verdict (2 vs 4).**
          *   *Tension:* Claim 2 says boundaries are discovered (fact of the matter). Claim 4 admits a wide hybrid zone with fertile backcrossing. If gene flow is the "real" boundary maker (implied by lumping them), but mtDNA says split, which is the fact? If Species are Individuals (1), the "boundary" is spatiotemporal. If they exchange genes, are they one individual? If they are monophyletic, are they two?
          *   *Severity:* High. Connects Ontology to Empirical Verdict.
          *   *Resolution:* Prioritize Gene Flow (BSC-ish) over Phylogeny for the "Real" boundary.
          *   *Cost:* Undermines PSC (3) as the *delimitation* tool if it gives the wrong answer in 4.

      *   **Conflict E: Monism vs. Asexuals (7 vs 8 vs 3).**
          *   *Tension:* PSC (3) works well for asexuals (clades). But Claim 5 uses ANI for prokaryotes. Is ANI == PSC? Often ANI clusters are used *because* phylogeny is hard in prokaryotes. If Monism holds, the criterion must be consistent.
          *   *Severity:* Moderate.
          *   *Resolution:* Argue ANI proxies for Clade/History.

  5.  **Refining the Ranking and "Apparent" Conflicts:**

      *   *Worst:* 3 vs 4. You define species by PSC, then describe a case that fits PSC perfectly but reject the PSC verdict. This makes the framework incoherent.
      *   *Second Worst:* 7 (Monism) vs. The implied shift in criteria between 3 (Eukaryotes/General), 4 (Gene flow emphasis), and 5 (ANI). You can't have One Concept if the operational criteria shift from "Monophyly" to "Gene Flow" to "Genomic Similarity" without a unifying theoretical glue.
      *   *Third:* 1 (Individuals) vs 3 (PSC). PSC is often accused of Essentialism. Needs careful phrasing to ensure compatibility.
      *   *Apparent Conflicts:* 2 (Realism) vs 5 (Convention). 5 explicitly argues the convention tracks reality. This is compatible. 6 (Ring Species) is actually supportive of 1 (Individuals/Mid-formation).

  6.  **Developing the Revisions/Costs:**
      *   For 3 vs 4: You need to decouple *Ontology* (1) from *Delimitation Criteria* (3). Admit PSC is a proxy, not the truth-maker. The truth-maker is likely Lineage Separation (which allows gene flow).
      *   For 7 (Monism): You need a "Unified Species Concept" (like de Queiroz) where the *property* is lineage separation, but *indicators* vary (monophyly, ANI, reproductive isolation). If you stick to PSC as *the* concept, Monism fails across domains.

  7.  **Final Review against Constraints:**
      *   Did I rank them? Yes.
      *   Did I say which to drop/weaken? Yes.
