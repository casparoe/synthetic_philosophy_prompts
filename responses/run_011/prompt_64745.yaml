  9.  **Final Polish:** Ensure the tone is rigorous and direct, matching the user's "no fluff" request. (Proceed to generate output based on these thoughts).

  *(Self-Correction on Claim 4)*: Wait, Claim 4 says "Reciprocally monophyletic in mtDNA... I say one species." PSC requires monophyly. If they are reciprocally monophyletic, PSC *demands* they are two species. The user says "I'd defend that call to a splitter." This implies the user knows PSC says "split" but they are saying "lump." This is the biggest contradiction. I must highlight this as the primary failure point.

  *(Self-Correction on Claim 7)*: "One right species concept." If the concept is PSC (Claim 3), then Claim 5 (ANI) must be subsumed under PSC. Is ANI a proxy for monophyly? In prokaryotes, often yes, but HGT complicates "monophyly." If the concept is "Lineage Individual" (Claim 1), then PSC and ANI are just tools. The tension is whether Claim 3 defines the *Concept* or the *Method*. The text says "I work with the phylogenetic species concept." This implies Concept = PSC. This clashes with Monism if PSC doesn't fit Prokaryotes or the Hybrid Zone.

