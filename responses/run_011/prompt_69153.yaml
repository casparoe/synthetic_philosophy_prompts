prompt: |-
  I teach Sidney Lumet's Twelve Angry Men in a social epistemology seminar and want to use it as a case study in the Condorcet jury theorem without letting students take the easy lesson. Write a reading of the film against the theorem's actual structure. Begin with the conditions: the theorem licenses confidence in a majority only given competence fixed above one-half and votes independent conditional on the state of the world. Take the first ballot — eleven for guilty, almost at once — and say precisely which condition it violates. I want the failure analyzed as correlation rather than as mere error, and I want your view on whether that correlation comes from the jurors' shared prejudices or from all twelve responding to the same body of evidence, since those are different ways of losing independence and the theorem treats them alike.

  Then Juror 8's method: is he raising the competence of individual jurors, breaking the correlation among their votes, or doing something the framework cannot describe, since it takes competence as given in advance of any deliberation? Is there a revision of the theorem that can value what he does, or does the film dramatize a process whose entire point is that its inputs are endogenous to it?

  Next, the awkward structural fact: the film's rule is unanimity, so no majority ever actually decides. Does that put the film outside the theorem's jurisdiction altogether, or does it change what the theorem is supposed to establish? Finally, the film never tells us whether the defendant is innocent; it establishes only that the case leaves reasonable doubt. Given that, is the film's moral about a jury's capacity to track the truth or about the threshold at which it should act — and what must the honest critic concede about where the jury-theorem lens stops applying? Close by saying what the film shows about collective judgment that a model of voters and their reliabilities cannot express.
reasoning: |-
  Here's a thinking process that leads to the suggested reading:

  1.  **Analyze the Request:**
      *   **Topic:** Sidney Lumet's *Twelve Angry Men* as a case study in the Condorcet Jury Theorem (CJT) for a social epistemology seminar.
      *   **Goal:** Avoid the "easy lesson" (i.e., "deliberation is good, majority rule works"). Instead, critique the film *against* the theorem's actual structure.
      *   **Key Requirements:**
          1.  **Start with CJT Conditions:** Competence ($p > 0.5$) and Independence (conditional on the state of the world).
          2.  **Analyze the First Ballot (11-1 Guilty):** Identify precisely which condition is violated. Analyze failure as *correlation*, not just error. Distinguish between shared prejudice vs. shared evidence as sources of correlation.
          3.  **Analyze Juror 8's Method:** Is he raising competence ($p$), breaking correlation (independence), or doing something outside the framework (endogenous inputs)? Is there a revision of the theorem that fits, or is the process endogenous?
          4.  **Analyze the Voting Rule:** The film requires *unanimity*, not majority. Does this place it outside CJT jurisdiction or change the theorem's aim?
          5.  **Analyze the Truth Condition:** The film establishes *reasonable doubt*, not actual innocence. Is the moral about truth-tracking or threshold of action? Where does the CJT lens stop applying?
          6.  **Conclusion:** What does the film show about collective judgment that a probabilistic model of voters/reliabilities cannot express?
      *   **Tone:** Academic, rigorous, philosophical, suitable for a social epistemology seminar.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Claim:* If voters are competent ($p > 0.5$) and independent, the probability of a majority being correct approaches 1 as $n \to \infty$.
      *   *Conditions:*
          1.  Binary choice (Guilty/Not Guilty).
          2.  Common interest (all want the correct verdict).
          3.  Competence ($p > 0.5$).
          4.  Independence (votes are conditionally independent given the state of the world).
      *   *Violation Implications:* If $p < 0.5$, majority rule makes things worse. If dependence exists, the "wisdom of crowds" effect collapses; the group acts like a smaller number of voters.

  3.  **Drafting - Section by Section:**

      *   **Introduction/First Ballot (Independence & Competence):**
          *   The 11-1 vote looks like high competence, but CJT requires independence *conditional on the state of the world*.
          *   Why did they vote Guilty so fast? Shared evidence? Or shared prejudice?
          *   *Crucial distinction:* If they all saw the same flawed evidence, that's a common signal (violates independence). If they all hate slum kids, that's a common bias (violates competence/independence mix).
          *   *Argument:* The first ballot violates *independence* primarily. They are not sampling the world independently; they are sampling the *prosecution's case* which is a single common source. Furthermore, the speed suggests social conformity/pressure (another dependence).
          *   *Prejudice vs. Evidence:* CJT treats them alike mathematically (both create correlation), but epistemically they differ. Prejudice lowers $p$ (competence). Shared evidence keeps $p$ potentially high but ruins independence. In the film, it's likely both. The "slum kid" stereotype suggests $p$ might actually be $< 0.5$ initially for many jurors.

      *   **Juror 8's Method (Endogeneity):**
          *   CJT assumes $p$ is fixed *ex ante*. Deliberation is usually external to the basic theorem.
          *   Juror 8 doesn't just vote; he *teaches*. He introduces new thought experiments (the limp, the glasses, the switchblade).
          *   Is he raising $p$? Yes, by improving individual reasoning.
          *   Is he breaking correlation? Yes, by encouraging them to rely on their own reasoning rather than the group or the prosecutor.
          *   *The Problem:* CJT is static. It doesn't model the *process* of changing $p$.
          *   *Endogeneity:* The film shows competence is *produced* by the collective process, not an input. This requires a dynamic model (e.g., Bayesian updating or deliberative pooling), not standard CJT.

      *   **The Unanimity Rule:**
          *   CJT is about *majority* rule. *Twelve Angry Men* is about *unanimity*.
          *   Unanimity is a veto rule. It maximizes specificity (avoiding false positives) at the cost of sensitivity (avoiding false negatives).
          *   Does this put it outside CJT? Technically, yes, CJT proves convergence for *majority*. Unanimity doesn't converge to truth in the same way; one stubborn idiot can block truth.
          *   *However:* In a legal context, the "truth" is procedural (Beyond Reasonable Doubt). Unanimity forces the group to resolve all doubts. It changes the goal from "most likely correct" to "certain enough to kill."

      *   **Truth vs. Reasonable Doubt:**
          *   We never know if the kid did it.
          *   CJT is about tracking *ontological truth* (Did he do it?).
          *   The Jury is about *epistemic threshold* (Can we justify punishment?).
          *   The film's moral is about the *burden of proof*, not necessarily truth-tracking capacity.
          *   *CJT Limit:* CJT assumes we can verify the outcome to calculate $p$. The film denies us this verification. Therefore, CJT cannot evaluate the final verdict's correctness, only the robustness of the doubt.

      *   **Conclusion (What the Model Misses):**
          *   Models treat voters as reliability machines.
          *   The film treats jurors as moral agents.
          *   The "cost" of error is asymmetric (killing an innocent vs. freeing a guilty). CJT usually assumes symmetric loss functions.
          *   The film shows *responsibility*. The weight of the vote matters.
          *   Final thought: The film is about the *ethics* of belief, not just the *mathematics* of aggregation.

  4.  **Refining and Polishing:**
      *   *Check constraints:* Did I start with the conditions? Yes. Did I address the 11-1 vote specifically? Yes. Did I distinguish prejudice vs. evidence correlation? Yes. Did I address Juror 8's role regarding endogeneity? Yes. Unanimity? Yes. Truth vs. Doubt? Yes.
      *   *Tone Check:* Ensure it sounds like a seminar reading guide or a lecturer's notes. Philosophical precision is key. Use terms like "conditional independence," "ex ante competence," "asymmetric loss functions."
      *   *Self-Correction during drafting:* I need to make sure I don't just say "independence is violated." I need to explain *why* the 11-1 vote is a failure of independence specifically. They are reacting to the *same* stimulus without processing it individually. Also, need to be careful about the "Prejudice vs. Evidence" distinction. Mathematically, CJT sees correlation as correlation. Epistemically, one is bias (bad $p$) and one is common signal (bad independence). I need to highlight that the theorem is blind to this distinction, which is a weakness of the theorem in this context.

  5.  **Final Review against the Prompt:**
      *   "Begin with the conditions..." -> Done.
      *   "Take the first ballot... say precisely which condition it violates." -> Done (Independence/Conditional Independence).
      *   "Failure analyzed as correlation rather than as mere error." -> Done.
      *   "Prejudices or same body of evidence?" -> Done (Distinguish epistemic source vs. mathematical effect).
      *   "Juror 8's method... raising competence, breaking correlation, or something framework cannot describe?" -> Done (Endogeneity argument).
      *   "Revision of the theorem... or inputs endogenous?" -> Done.
      *   "Unanimity... outside jurisdiction or change what theorem establishes?" -> Done.
      *   "Never tells us whether defendant is innocent... truth or threshold?" -> Done.
      *   "Where the jury-theorem lens stops applying?" -> Done.
      *   "Close by saying what the film shows... that a model... cannot express." -> Done (Moral agency/Asymmetric cost).

  6.  **Final Polish:** (Writing the response with the appropriate academic gravity.) *Self-correction: Ensure I explicitly mention that CJT treats prejudice and shared evidence alike as correlation, but the film asks us to care about the difference.* *Make sure to emphasize the "Reasonable Doubt" vs "Truth" distinction clearly.*

