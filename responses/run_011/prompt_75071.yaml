  The Darwinian walks off the edge, leaving the solution to the genetic lottery.
  The Skinnerian walks off, survives the fall, and learns via habits stamped in by reward.
  The Popperian looks down, lets his guesses die in his head instead of in the world, and steps back.
  The Gregorian looks at the guardrail, borrowing design work that other creatures already did.

  The Darwinian's ghost asks, "Who paid for the safety information?"
  The Gregorian replies, "You paid with your life, he paid with his pain, and he paid with his thoughts. I just read the sign you three died to put there."
