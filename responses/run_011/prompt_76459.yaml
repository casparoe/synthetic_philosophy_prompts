  I will start with the medical case to ground the audience in concrete intuition, escalate through the social and metaphysical implications in the middle where the tension is highest, and reserve the falsification condition for the close as requested.

  **1. The Tumor Case**
  **Question:** A man punches a stranger after a lesion removes his impulse control. You say causal history doesn't matter, but we excuse him. Is this an excuse, like coercion, or an exemption, like insanity? If it's just another causal story, what stops every action from being exempt once we know the biology? Does the distinction collapse if the explanation is causal all the way down?
  **Pressure Point:** The stability of the excuse/exemption distinction against universal causal explanation.
  **Likely Answer:** It is an exemption based on capacity impairment, not causal history; the practice cares about capacities, not causes.
  **Follow-up:** But if capacities are just causal dispositions, isn't drawing the line at the lesion arbitrary compared to a bad upbringing?

  **2. Non-Personal Targets**
  **Question:** We feel resentment toward a corporation that knowingly poisoned a river, or even a dead tyrant. They lack a human mind to hold attitudes. Does your quality-of-will analysis scale up to collectives or the dead, or is our resentment there merely a useful fiction? If it's misplaced, why does it feel so morally identical to blaming a person?
  **Pressure Point:** The scalability of reactive attitudes to entities incapable of participation.
  **Likely Answer:** We treat them *as if* participants; it is a legitimate extension of the practice, not a mistake.
  **Follow-up:** But if the practice defines truth, and we extend it to objects, do we make it true that objects have wills, or do we admit the practice can be systematically mistaken?

  **3. Internal Revision**
  **Question:** We used to blame addicts as weak; now we often treat them as patients. We also started blaming executives who hide behind corporate structures. Is this moral progress or just a change of taste? If there's no external standard, how do you distinguish discovering who is responsible from simply deciding to shift our resentment around?
  **Pressure Point:** The distinction between moral discovery and arbitrary shifts in taste within internalism.
  **Likely Answer:** It is internal progress based on fairness and better understanding of capacities within the practice.
  **Follow-up:** But if fairness is defined by the practice, isn't saying we became 'fairer' just saying we changed our minds?

  **4. The Variant Community**
  **Question:** Imagine a community that resents people for catching the flu, or one that never resents murder. You say standards are internal. Are their responsibility ascriptions equally true? If you say no, what makes our internal standards authoritative for them? If you say yes, does morality become whatever a community feels?
  **Pressure Point:** The threat of relativism versus the claim of normative authority for internal standards.
  **Likely Answer:** They are incompetent participants; our standards are authoritative because they sustain the kind of community we value.
  **Follow-up:** But valuing a community is an external standard. You said no outside justification is available. Where does that value come from?

  **5. The Manipulated Agent**
  **Question:** If determinism is true, the manipulated agent and the ordinary agent have histories of exactly the same kind: prior causes determining outcomes. You say manipulation doesn't defeat responsibility. But if the ordinary agent is just as determined, doesn't your defense of the manipulated man accidentally condemn us all to being puppets?
  **Pressure Point:** The collapse of the manipulation intuition under determinism.
  **Likely Answer:** Determinism is beside the point. We are responsible because we are participants, not because we are uncaused.
  **Follow-up:** Then why does the manipulation case feel different? Is that feeling just an error we should extinguish?

  **6. Exemption Creep**
  **Question:** You call the widening use of psychiatric explanations 'exemption creep' and a loss of community. But if the practice shifts to include more exemptions, aren't those the new internal standards? On what grounds do you call it a loss rather than an evolution, if there is no outside view to judge it by?
  **Pressure Point:** The normative basis for criticizing internal shifts in the practice.
  **Likely Answer:** It undermines the participation required for the practice itself. It's a functional loss.
  **Follow-up:** But if participation drops, isn't that just a sociological fact? How does it become a moral loss without an external value?

  **7. Self-Application**
  **Question:** When a colleague slights you, you feel resentment. If you learn they have a diagnosis, does your resentment vanish? If it does, doesn't your own attitude function as evidence against your theory that history doesn't matter? If it doesn't, are you refusing to apply your own exemptions to yourself?
  **Pressure Point:** The consistency between theoretical commitment and personal reactive attitudes.
  **Likely Answer:** My resentment might persist, but I should revise it. Or, the diagnosis doesn't always exempt.
  **Follow-up:** So you trust your theory over your immediate moral emotions? Why trust the theory then?

  **8. Falsification**
  **Question:** Finally, name a single fact about ordinary moral life that, if it obtained, would show your account to be false. Is there any discovery in neuroscience or any shift in our emotions that would force you to admit responsibility requires something more than our current practices?
  **Pressure Point:** The falsifiability of the constitutive view.
  **Likely Answer:** If we lost the capacity for reactive attitudes entirely.
  **Follow-up:** Then your view is unfalsifiable by any empirical fact about agents themselves?

  ***

  Thesis Three is false: causal history *can* defeat responsibility. The quality of an agent's will is not independent of its origin; if a will is implanted by manipulators, it is not truly the agent's own, regardless of their current capacity for reflection. To ignore the source of the will is to ignore the difference between authorship and mere ownership.

  The two questions capable of doing real damage are Question Four (The Variant Community) and Question Six (Exemption Creep). These questions trap her between relativism and dogmatism. A genuinely good answer to Question Four would have to articulate a non-question-begging account of "competence" that doesn't secretly rely on external moral truths. A genuinely good answer to Question Six would have to explain how a practice can be self-undermining without appealing to an external metric of value beyond the practice's own survival.

  A skilled guest survives the remaining six. She survives Question One by distinguishing capacity (internal) from cause (external), a standard compatibilist move. She survives Question Two by treating corporate blame as a useful fictional extension of the practice. She survives Question Three by appealing to internal consistency and fairness. She survives Question Five by biting the bullet and asserting determinism is irrelevant to participation. She survives Question Seven by distinguishing descriptive psychology from normative theory. She survives Question Eight by setting the falsification condition at the extinction of the practice itself, which is tautologically safe.

  My framing of Question Five is unfair. It assumes determinism makes manipulation and ordinary upbringing identical in a way that begs the question against compatibilists, who distinguish between determining causes and manipulating causes. A fairer, still sharp version is: "The manipulated man's values were implanted. The ordinary man's were shaped by parents and culture. Both are causal. Why is the covert implantation morally distinct from ordinary upbringing if both determine the will?"
