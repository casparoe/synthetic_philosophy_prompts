answer: |-
  Here is the runnable protocol. It is designed to be mechanically tight enough to satisfy the econ PhD, transparent enough to satisfy the libertarians, and phenomenologically rich enough to generate the desired debrief.

  # Game Title: The Allocation Protocol

  ## 1. Materials List
  *   **Chips:** 300 poker chips (the group's standard currency).
  *   **Proposal Slips:** 50 small slips of paper (3 per person per round).
  *   **Shadow Slips:** 14 distinctively colored slips (1 per person, for Round 2 & 3 only).
  *   **Veto Tokens:** 6 red poker chips (for the Overseer).
  *   **The Ledger:** A large whiteboard sheet or spreadsheet projected for the Econ PhD to record: *Player ID | Round | Proposed Allocation | Vetoed? (Y/N) | Reason Given | Final Allocation.*
  *   **Blind Boxes:** 2 opaque envelopes or boxes (for the Auction bids).
  *   **Timer:** Visible countdown.

  ## 2. Roles & Endowments
  *   **Participants (14):** Each starts with **10 Chips**.
  *   **The Overseer (1):** Selected from the group (preferably the Paralegal, as they enjoy the adversarial role). They receive **0 Chips** initially but earn **5 Chips** per round if they successfully execute their mandate (see Rules).
  *   **The Recorder (1):** The Econ PhD. They do not play; they track the Ledger.
  *   **The Facilitator (You):** Banker, Rule-Enforcer, Timekeeper.

  **Payoff Structure:**
  *   Chips retained at the end of the session go into the coffee fund (real value).
  *   **Bonus:** The top 3 chip-holders get a "premium roast" voucher (symbolic prestige).
  *   **Overseer Bonus:** The Overseer keeps their earned chips regardless of group sentiment.

  ## 3. The Rounds (45 Minutes Total)

  ### Round 1: The Baseline (Negative Liberty)
  *   **Goal:** Accumulate chips via trade or allocation.
  *   **Mechanic:** Participants have 5 minutes to write down an allocation proposal on a Proposal Slip. A proposal is a distribution of a "Pot" of 20 chips among the group (e.g., "Player 1 gets 5, Player 2 gets 2..."). *Simpler alternative for speed:* Each player proposes a trade of their own endowment to another player.
  *   **Refined Mechanic for Speed:** Each player writes a "Demand" (how many chips they want from the central pot of 100). If total demands ≤ 100, everyone gets their demand. If > 100, everyone gets 0.
  *   **Veto:** None.
  *   **Record:** Recorder logs all Demands.

  ### Round 2: The Whim (Domination)
  *   **Goal:** Same as Round 1.
  *   **Constraint:** The Overseer holds 3 Red Veto Tokens. They **must** play all 3.
  *   **Rule:** The Overseer may veto any 3 Demands. No explanation is required. The vetoed player receives 0 for that round.
  *   **Anticipatory Conformity Capture:** Before submitting their Demand, each player must fill out a **Shadow Slip**. On this, they write the Demand they *actually wanted* to make. On the **Proposal Slip**, they write what they are *actually submitting*.
  *   **Interference Control:** The Facilitator ensures exactly 3 vetoes occur. If the Overseer hesitates, the Facilitator reminds them: "You must play 3 tokens to receive your bonus."
  *   **Record:** Recorder logs Proposed Demand, Shadow Demand, and Veto Status.

  ### Round 3: The Law (Non-Domination)
  *   **Goal:** Same as Round 1.
  *   **Constraint:** The Overseer holds 3 Red Veto Tokens. They **must** play all 3.
  *   **Rule:** The Overseer may *only* veto Demands that violate the **Public Criterion**.
      *   *The Criterion:* "No single demand may exceed 15 chips." (Set this threshold so that statistically, about 3-4 people will likely violate it based on Round 1 data).
      *   *Contingency:* If fewer than 3 people violate the criterion, the Overseer must veto the highest demands among the non-violators until 3 vetoes are reached, citing "System Audit." (This ensures the *rate of interference* matches Round 2 exactly).
      *   *Requirement:* For every veto, the Overseer must write the specific reason on the slip (e.g., "Exceeded 15" or "System Audit").
  *   **Shadow Slips:** Players again fill out Shadow Slips (Desired) vs. Proposal Slips (Submitted).
  *   **Record:** Recorder logs Proposed, Shadow, Veto Status, and Reason.

  ### Round 4: The Auction (Valuation)
  *   **Mechanic:** Participants bid for the right to play a "Bonus Round" (5 minutes, Pot of 50 chips) under one of three regimes.
  *   **Regimes:**
      1.  **Regime A:** No Overseer (Baseline).
      2.  **Regime B:** Overseer with Whim (Round 2 Rules).
      3.  **Regime C:** Overseer with Law (Round 3 Rules).
  *   **Bidding:** Secret bid written on paper. Highest bidder wins the right to choose the regime for the Bonus Round. *Correction:* To get individual valuation data, do not make it a single auction.
  *   **Revised Auction:** Each player is given a **Endowment of 5 Bidding Chips**. They must allocate these 5 chips across the three Regimes (A, B, C) to indicate how much they value playing the Bonus Round under that rule. They can put 0 on any.
      *   *Wait, this measures preference for regime, not willingness to pay to avoid domination.*
      *   *Better:* Ask them: "How many of your *existing* chips would you sacrifice to guarantee the Bonus Round is played under Regime C instead of Regime B?"
      *   *Simplest Readout:* **Second-Price Auction.** "Who would pay to ensure the next round is Regime C?" vs "Who would pay to ensure it is Regime A?"
      *   *Best for Data:* **Willingness to Pay (WTP).** "You are assigned Regime B. You may pay X chips to switch to Regime C. What is the max X you would pay?" (Collect via secret ballot). Then repeat for Regime A vs B.
      *   *Let's go with the Prompt's suggestion:* "Bid chips for entry into each regime."
      *   **Execution:** Three separate jars labeled A, B, C. Players distribute their 5 Bidding Chips among the jars. If Jar C has the most chips, Regime C is played. *This aggregates preference.*
      *   *To get individual data for the debrief:* Players submit a private sheet: "Value of A: __, Value of B: __, Value of C: __." Sum must equal 5.

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:10 (Intro):** Explain chip value. Assign Roles. Distribute endowments. Emphasize: "Maximize your chips. The rules are the rules."
  *   **00:10 – 00:20 (Round 1):** Baseline. 5 min play, 5 min logging.
  *   **00:20 – 00:35 (Round 2):** Domination. Explain Overseer power. Distribute Shadow Slips. 5 min deliberation, 5 min submission, 5 min veto/logging.
  *   **00:35 – 00:50 (Round 3):** Non-Domination. Explain Public Criterion. Distribute Shadow Slips. 5 min deliberation, 5 min submission, 5 min veto/logging.
  *   **00:50 – 01:00 (The Auction):** Distribute 5 Bidding Chips. Private valuation sheet. Collect. Tally publicly.
  *   **01:00 – 01:30 (Debrief):** Whiteboard analysis.

  ## 5. The Debrief Script (30 Minutes)

  **Phase 1: The Data (10 mins)**
  *   Project the Ledger.
  *   **Show Interference:** Highlight that Round 2 and Round 3 had the *exact same number* of vetoes (3). The "pain" was identical.
  *   **Show Conformity:** Compare Shadow Slips vs. Proposal Slips.
      *   *Look for:* In Round 2, did Shadow Slips show higher demands than Proposal Slips? (Self-censorship).
      *   *Look for:* In Round 3, did Proposal Slips cluster just under the limit (14 chips)? (Rule-optimization).
  *   **Show Valuation:** Reveal the Auction bids.
      *   *Question:* "Did you pay a premium for Round 3 over Round 2? If yes, you priced 'Non-Domination.' If no, you priced only 'Non-Interference.'"

  **Phase 2: The Mapping (10 mins)**
  *   *Do not use the terms yet.*
  *   "In Round 1, you were free from interference. (Write **Concept A** on board)."
  *   "In Round 2, you were subject to interference that was unpredictable and unaccountable. (Write **Concept B**)."
  *   "In Round 3, you were subject to interference, but it was constrained by a rule that tracked a public standard. (Write **Concept C**)."
  *   Ask the Libertarians: "Was Round 2 different from Round 3 if the outcome was the same?"
  *   Ask the Group: "Why did you change your Shadow Slips in Round 2 even if you weren't vetoed?" (Elicit the "chilling effect").

  **Phase 3: The Reveal (5 mins)**
  *   **Concept A = Negative Liberty** (Berlin). Freedom as non-interference.
  *   **Concept B = Domination** (Pettit). Freedom as non-domination. The *capacity* of another to interfere arbitrarily.
  *   **Concept C = Republican Liberty.** Freedom secured by law/status, not just the absence of interference.
  *   *Note:* Acknowledge that Positive Liberty (Self-Mastery) was not the focus, but point to the Shadow Slips: "When you censored yourself in Round 2, were you mastering your desires to survive, or were you unfree?"

  **Phase 4: Null Results & Variance (5 mins)**
  *   *If bids were flat:* "If you didn't pay to avoid the Whim, it might mean the stakes (coffee chips) were too low to trigger a fear of domination. Or, it might mean you trust the Overseer (social capital) more than the system. In the real world, domination matters because you can't quit the game."
  *   *On Variance:* "With 14 of you, one outlier skews the mean. We are looking for the *pattern* of the Shadow Slips, not just the auction price."

  ## 6. Failure Modes & Countermeasures

  | Failure Mode | Prediction | Countermeasure |
  | :--- | :--- | :--- |
  | **The Soft Overseer** | The Overseer (Paralegal) feels bad and vetoes fewer than 3, or vetoes their friends. | **Facilitator Intervention:** "You have not met your quota. To receive your bonus, you must veto one more. I suggest the highest bidder." (Force the mechanic). |
  | **The Reverse-Engineer** | A Libertarian says, "You're trying to prove Pettit right by rigging the veto rate." | **Radical Transparency:** "Yes. The interference rate is controlled to isolate the variable of *arbitrariness*. The question is whether arbitrariness has value to you, not whether the rate is natural." |
  | **The Theatrical Outlier** | Someone bids all 5 chips on the "Whim" regime to be contrarian. | **Data, Not Disruption:** "That's a valid preference. It suggests you value the *option* of arbitrary power, perhaps for yourself. We'll record that as a valuation of potential dominance." |
  | **Rule Gaming** | In Round 3, everyone demands exactly 14 chips. | **Debrief Gold:** "This is the success of Non-Domination. You know the rule, so you can plan. In Round 2, you couldn't plan." |

  ## 7. Limitations of the Apparatus
  *Be honest about these in the debrief.*
  1.  **Exit Rights:** In the game, you can't leave. In reality, domination is worst when you have no exit. The game understates the cost of domination because the coffee fund is low-stakes.
  2.  **Structural vs. Agential:** The Overseer is a person. Real domination is often structural (market forces, bureaucracy) where no single person holds the veto. This game personalizes it too much.
  3.  **The Credible Promise:** My promise that Round 3 follows a rule is credible because I am the Facilitator. In reality, institutions degrade. The game assumes the "Rule of Law" holds perfectly, which it rarely does.
  4.  **Internalization:** The game shows *behavioral* change (Shadow Slips). It cannot show *psychological* change (whether you actually *felt* unfree).

  ## 8. Integrating Positive Liberty
  *Can it be done without bolting?*
  Yes, by modifying **Round 3**.
  *   **Modification:** Instead of the Facilitator setting the "Public Criterion" (15 chips), the group must **vote** on the criterion before the round begins.
  *   **Mechanic:** 2 minutes to debate and vote on the limit. Majority rules.
  *   **Why this works:** This introduces **Positive Liberty** (Self-Direction/Autonomy). You are obeying a rule, but it is a rule you gave yourself (via the collective).
  *   **Debrief Hook:** "In Round 3 (Modified), you were constrained, but you authored the constraint. Is that freedom? Berlin says no (it's still interference). Rousseau/Pettit say yes (it's self-mastery)."
  *   **Cost:** Adds 5 minutes to the timeline.

  ## 9. Compression: 50 Minutes / 6 People
  *If the room falls through and you are in a living room.*
  *   **Cut the Auction:** It takes too long to explain and tally. Rely on the **Shadow Slip** data as the primary readout of value.
  *   **Cut Positive Liberty:** Stick to Negative vs. Republican.
  *   **Reduce Rounds:**
      *   Round 1 (Baseline): 5 mins.
      *   Round 2 (Whim): 10 mins.
      *   Round 3 (Law): 10 mins.
      *   Debrief: 25 mins.
  *   **Simplify Mechanics:** Instead of "Demands," use a simple **Coin Flip Game**.
      *   Players bet chips on Heads/Tails.
      *   **Whim:** Overseer can flip your result after the fact.
      *   **Law:** Overseer can only flip if you bet >50% of your stack.
      *   *Why:* Faster to resolve than allocation proposals.
  *   **Record Keeping:** Facilitator draws the table on the whiteboard directly. No printed slips. Players call out their "Shadow Bet" before placing their "Real Bet."
  *   **Debrief:** Focus entirely on the "Shadow Bet" shift. "Did you bet smaller in the Whim round?" That is the entire proof of domination.

  ---

  ### Final Facilitator Note
  Your libertarians will smell the rat if you moralize. Keep the tone **mechanical**. You are not teaching them morality; you are stress-testing their utility functions. If they refuse to pay to avoid domination, do not correct them. Record it. The most powerful moment in the debrief is asking: *"If you wouldn't pay 1 chip to avoid being dominated here, would you pay 1,000 chips to avoid it in a labor market? What changed?"* That bridges the gap between the game and the theory.
