          *   Highlight the sociological implication: Institutions are *conjoncture* or *longue durée*? Usually institutions are treated as structural (slow), but they are human. The passage says geography is the only slow thing. That's a problem for a sociologist studying institutions.
          *   *Crucial Point:* The student is studying *institutional arrangements*. The passage says *geography* is the *longue durée*. If the student adopts the passage's definition, they contradict their own topic. I need to point this out. Braudel applied *longue durée* to economies and mentalities too, not just geography.

      *   *Refining the "Event" question:* Braudel calls events "dust." But he doesn't say they have *no* cause/effect. He says they are ephemeral. The passage says "causing nothing in return." That is the biggest error.

      *   *Refining "Total History":* It's about the *sum* of approaches, not the *exclusion* of politics.

      *   *Refining the "Safe Sentences":* I need to be careful. Most sentences have a tag at the end that ruins them. I might need to suggest truncating them.

  7.  **Final Review against Constraints:**
