      *   *Variance Penalty:* Mean-Variance optimization is *not* consistent with Expected Utility Theory unless returns are Normal or Utility is Quadratic. This is a technical violation of VNM. I need to make sure the user understands this is a *structural* mismatch, not necessarily a *pragmatic* failure.
      *   *Hard Constraint:* A "lexicographic" preference (Safety first, then EV) violates the Continuity Axiom of VNM. This is a known feature, not a bug, for survival.
      *   *Dutch Book vs. Money Pump:* Crucial distinction. Dutch Book = Bad Probabilities. Money Pump = Bad Preferences. The colleague said "Dutch Book" but described "Leaving money on the table" (which sounds like Money Pump or Arbitrage). I need to clarify this confusion.
