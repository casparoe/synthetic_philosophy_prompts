      *   *Counterparties:* The user asks about "counterparties who are trying to win." In routing/retry, the "counterparty" is usually nature/traffic, not a strategic adversary (unless it's security/DDoS). If it's just traffic, arbitrage isn't possible in the market sense.

  7.  **Finalizing the Content:**
      *   *Reading 1: VNM Representation.* (The "Theorem" claim).
