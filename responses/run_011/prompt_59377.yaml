          *   No references/reading lists.
          *   Tone: Precise, engineering-friendly, actionable for a design review.

  2.  **Deconstruct the Colleague's Slogan:**
      *   "If you're not maximizing expected utility, you're leaving money on the table — and someone will come along and take it."
      *   This is a conflation of several distinct arguments in decision theory and economics.
      *   *Claim A:* Representation Theorem (Von Neumann-Morgenstern). If you satisfy axioms, you *act as if* maximizing EU. If you don't, you violate axioms.
      *   *Claim B:* Dutch Book Argument. If your probabilities are incoherent, you lose money. (Usually applies to beliefs, not preferences).
      *   *Claim C:* Money Pump Argument. If your preferences are intransitive or state-dependent in a specific way, a sequence of trades can drain you.
      *   *Claim D:* Market Efficiency/Arbitrage. In a competitive market, non-EV maximizers get outcompeted.
      *   *Claim E:* Risk Neutrality for Small Stakes. If stakes are small relative to wealth, you *should* be risk-neutral (EV).

  3.  **Drafting the Menu of Claims:**
      *   *Reading 1: The VNM Representation Theorem.*
          *   Assertion: Rational preferences *must* satisfy axioms (completeness, transitivity, independence, continuity). If they do, they map to EU maximization.
          *   Coherence: Preferences over acts.
          *   Status: Mathematical Theorem.
          *   Assumptions: Axioms hold.
          *   Relevance: Does the user's system violate Independence? Yes (variance penalty).
      *   *Reading 2: The Dutch Book (Belief Coherence).*
          *   Assertion: If probabilities don't sum to 1 or obey conditionalization, you can be booked.
          *   Coherence: Beliefs (Probabilities).
          *   Status: Mathematical Theorem.
          *   Relevance: User says estimates come from a model. If the model is calibrated, this doesn't apply to the *scoring function*.
      *   *Reading 3: The Money Pump (Preference Cycles).*
          *   Assertion: If preferences are intransitive (A>B, B>C, C>A), a sequence of trades makes you pay to return to start.
          *   Coherence: Observed choice behavior / Preferences.
          *   Status: Logical argument (not strictly a theorem without dynamic assumptions).
          *   Relevance: User says ranking is transitive. This is the strongest defense.
      *   *Reading 4: Long-Run Convergence (Law of Large Numbers).*
          *   Assertion: Over many independent trials, EV maximization yields highest total return. Risk aversion dampens growth.
          *   Coherence: Strategy performance over time.
          *   Status: Statistical Truth (with caveats).
          *   Relevance: User has a "catastrophic outcome" constraint. Ruin stops the game.
      *   *Reading 5: Arbitrage by Counterparties.*
          *   Assertion: If you value things differently than the market (EV), someone can trade against you.
          *   Coherence: Market interaction.
          *   Status: Substantive Thesis.
          *   Relevance: Is there a counterparty? Or is it nature/system load?

  4.  **Addressing the User's 4 Questions:**
      *   *Q1 (Transitivity/Coherence):* Mean-Variance + Hard Constraint violates the *Independence Axiom* of VNM, not necessarily Transitivity. Violating Independence means you aren't an EU maximizer, but it doesn't automatically mean you are "irrational" in a pragmatic sense (you avoid ruin).
      *   *Q2 (Sequence/Money Pump):* This is distinct from Dutch Book (which is about beliefs). A Money Pump requires intransitivity or dynamic inconsistency. Mean-Variance can be dynamically inconsistent if the "variance" changes based on past holdings, but if each decision is isolated (stateless), it's harder to pump. However, the "flip-in-ordering" due to estimate sharpening is a form of dynamic inconsistency if not handled carefully (time inconsistency).
