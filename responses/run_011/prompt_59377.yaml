      *   *Application:*
          *   1: You violate Independence/Continuity, not Transitivity. Consequence: You can't be modeled as EU, but you avoid ruin.
          *   2: Money Pump is different from Dutch Book. Vulnerability exists if you trade *positions*, but less so if you just pick actions.
          *   3: No, it doesn't license going back to EV. It licenses "You aren't an EU maximizer."
