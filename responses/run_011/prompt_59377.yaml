  8.  **Drafting the Response:** (Iterative refinement for clarity and brevity). *Self-Correction on "Flip-in-ordering":* The user says "ordering between two candidates can flip as our estimates get sharper." This is just Bayesian updating. If $P(A)$ changes, $Score(A)$ changes. This is not inconsistency. Inconsistency would be if $Score(A) > Score(B)$ at $t_1$ and $Score(B) > Score(A)$ at $t_2$ *given the same information state*. I need to point out that updating estimates is rational, not incoherent.

