      *Final Polish:* Ensure the distinction between *Beliefs* (Probabilities) and *Preferences* (Utility/Risk) is sharp. The colleague's "Dutch Book" comment suggests he thinks the *probabilities* are wrong, but the user's change was to the *scoring function*. This is a category error by the colleague.

