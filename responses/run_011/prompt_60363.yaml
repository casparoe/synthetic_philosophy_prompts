  **2. Interventionism with Proportionality (Woodward / Yablo)**
  *   **Fit:** This view defines causation via invariant generalizations under intervention. It strictly requires **Independent Fixability (IV)**: variables must be distinct and independently manipulable. This perfectly explains Case 7 (Malformed) and the Variant. It naturally incorporates Proportionality (Case 6) as a condition for explanatory relevance (Red explains the peck; Scarlet is too specific). It handles Omissions (Case 5) by appealing to normative expectations about interventions.
