  ### Consistent Accounts of Causation

  Two general accounts are consistent with the Judge's seven prior rulings, though they diverge on *why* they yield these results.

  **1. Structural Equation Models with Default/Deviant Norms (Halpern & Pearl / Hitchcock)**
  *   **Fit:** This framework excels at Preemption (Cases 1–3) by using "contingencies" (holding off-path variables fixed at actual values). It handles Omissions (Case 5) by relativizing causation to a chosen set of variables and default values. It can accommodate Proportionality (Case 6) by selecting the "right" level of variable granularity (Red vs. Scarlet).
