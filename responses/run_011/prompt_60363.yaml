  ### A Discriminating Case

  To discriminate between **Standard SEM (Halpern & Pearl)** and **Interventionism (Woodward)**, present the **"Inseparable Mixture" Case**:

  > **Case:** A chemical reaction requires Reagent X. Reagent X is a stable compound of elements $E_1$ and $E_2$ that cannot be physically separated. $E_1$ is the active catalyst; $E_2$ is inert. Whenever X is present, both are present. The reaction occurs.
  > **Question:** Is $E_1$ a cause of the reaction?

  *   **SEM Prediction:** **Yes.** One can define variables for $E_1$ and $E_2$ with a structural constraint ($E_1 = E_2$). Using contingencies, the model can show $E_1$ makes a difference.
  *   **Interventionism Prediction:** **No (or Malformed).** Because $E_1$ and $E_2$ cannot be independently manipulated, $E_1$ fails the Independent Fixability test. One cannot intervene on $E_1$ while holding $E_2$ fixed.
  *   **Why it discriminates:** It isolates the "Independent Fixability" constraint from the "Preemption" structure. If your colleague rules $E_1$ is a cause, he is a flexible SEM theorist. If he refuses to rule or says "No," he is a strict Interventionist.

