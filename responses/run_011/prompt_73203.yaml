answer: |-
  **Joint Statement on Offsetting Protocols**

  **1. Agreed Claims**
  1. Both camps agree that a public ledger alters investigator behavior because transparency imposes reputational costs regardless of ethical framing.
  2. Both camps agree that the minority's authority to set the exchange rate grants them procedural power because controlling the price controls the terms.
  3. Both camps agree that offsetting fails if the compensation arrives too late to prevent irreversible damage, as seen in cases of species extinction.
  4. Both camps agree that calling an arrangement a trade does not itself prove the arrangement is ethical because language can obscure coercion.
  5. Both camps agree that the investigator's intent matters less than the systemic precedent set by permitting the program because institutions shape norms.

  **2. Surviving Disagreements**

  | Disagreement | Trade Camp Formulation | Non-Fungibility Camp Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Nature of Value** | Values are preferences that can be satisfied more efficiently through exchange. | Values are constitutive commitments that are corrupted by being priced. | Substantive |
  | **Consent Scope** | Consent from the representative minority validates the trade for their community. | Consent cannot be delegated for harms borne by non-participants like animals or future generations. | Substantive |
  | **Moral Licensing** | Paying the price demonstrates respect for the value by acknowledging its cost. | Paying the price purchases a license to violate the value by treating it as a fee. | Substantive |
  | **Arbiter Role** | The arbiter sets a market price that reflects the true cost of the harm. | The arbiter is forced to commodify their own values to participate in the mechanism. | Substantive |
  | **Outcome Measurement** | Success is measured by the net gain in welfare across both parties. | Success is measured by the integrity of the process regardless of welfare outcomes. | Substantive |
  | **Definition of Trade** | Any voluntary exchange of value for consent is a trade. | Only exchanges involving fungible goods are trades; rights are not goods. | Verbal; the argument over whether this proposal is a "trade" hinges on whether rights are viewed as assets or boundaries. |

  **3. Cruxes**

  1.  **Does pricing increase violation frequency?**
      *   *Experiment:* A simulated review board where participants can violate a norm for a price benefiting a victim group.
      *   *Trade Prediction:* Violations remain stable; benefits accrue to victims.
      *   *Non-Fungibility Prediction:* Violations increase because the price becomes a fee.
  2.  **Can representation cover the voiceless?**
      *   *Case:* A historical instance of indigenous compensation for environmental damage affecting unborn residents.
      *   *Trade Prediction:* The compensation validates the action for the community.
      *   *Non-Fungibility Prediction:* The compensation is invalid because the harmed cannot consent.
  3.  **Does refusal harm the minority?**
      *   *Experiment:* A longitudinal study of funded causes when offsetting funds are withheld.
      *   *Trade Prediction:* The minority is materially worse off without the trade.
      *   *Non-Fungibility Prediction:* The minority retains moral leverage that outweighs material loss.
  4.  **Is the wrong excused or balanced?**
      *   *Experiment:* A vignette study of public blame comparing an investigator who offsets versus one who abstains.
      *   *Trade Prediction:* The offsetting investigator is seen as responsible.
      *   *Non-Fungibility Prediction:* The offsetting investigator is seen as having bought permission.

  **4. Closing**

  The Trade Camp would concede their position if evidence showed that refusing trades consistently leaves all parties, including the minority, worse off by their own stated preferences. The Non-Fungibility Camp would concede their position if evidence showed that converting values into prices reliably strengthens rather than degrades the commitment to those values over time.
