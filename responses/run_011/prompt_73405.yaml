answer: |-
  **Score: 19 / 25**

  **Breakdown:**
  *   **(a) 8 / 8**
  *   **(b) 3 / 9**
  *   **(c) 8 / 8**

  ***

  **Comments:**

  **(a)** This is excellent. You correctly identify that MCE matches feature expectations while maximizing entropy, and crucially, you nail the definition of *causal* entropy (conditioning future actions on past states/actions rather than treating the trajectory as a fixed block). The explanation of the gradient step (observed vs. expected counts) is precise and shows you understand the computational bottleneck. No changes needed here.

  **(b)** This is the weak point of the script. You have written a fluent, confident paragraph that applies **forward RL** logic to an **inverse probabilistic** setting, and the distinction matters.
  *   **Affine Invariance:** You state that $aR + b$ yields the same optimal policy. In *deterministic* RL, this is true (argmax is invariant to positive affine transforms). In MCE IRL, the policy is a softmax distribution: $P(\tau) \propto \exp(R(\tau))$. While the additive constant $b$ cancels in normalization, the scaling factor $a$ does not—it changes the "temperature" or sharpness of the distribution. Unless you also scale the rationality parameter, $aR$ produces a different likelihood over trajectories. Therefore, the reward is *not* invariant to scaling in MCE IRL in the way you describe.
  *   **Equivalence Class:** The primary non-uniqueness in IRL is not affine scaling, but **feature aliasing**. You mention this in the second half of the paragraph but dismiss it as "a limitation of the features rather than of IRL itself." In IRL, the feature space *defines* the identifiability of the problem; if the true reward lies outside the span of your features, the reward is fundamentally unrecoverable, regardless of data volume. That *is* the general characterization of the ambiguity.
  *   **Data:** You claim more data doesn't resolve the affine ambiguity. While true for affine transforms, more data *does* pin down the reward within the feature span (the convex optimization becomes strictly convex with sufficient coverage). Your claim that "with a lot of data you converge to the reward, just up to that scale-and-shift freedom" conflates the convergence of feature expectations with the invariance of the reward function.
  *   *Takeaway:* Be careful not to port invariance properties from deterministic optimal control into entropy-regularized inverse problems without checking the math on the likelihood function.

  **(c)** Strong. You correctly identify two distinct imported assumptions: (1) the correctness of the environment model (dynamics/discount), and (2) the assumption that behavior is preference-driven (rationality) rather than driven by habit or social constraint. Your pushback on the colleague's phrasing ("what people actually want") is nuanced and defensible. You correctly note that MCE models bounded rationality (noise), but that doesn't solve the problem of model misspecification or non-preference-driven behavior.

  ***

  **TA Note (for your eyes only):**
  This script is a classic "fluency trap." The writing is smooth enough that it masks the conceptual conflation in part (b). The student has memorized the "affine transformation" soundbite from standard RL theory and applied it where it doesn't belong (MCE likelihoods). I graded (b) harshly (3/9) because in a grad seminar on computational accounts, distinguishing between deterministic optimality and probabilistic rationality is a core learning objective. The rest of the script is high-quality, which is why the total is still a solid B+ (19/25).

  Regarding the question wording: It didn't invite this error. The prompt specifies "maximum causal entropy," which should signal that standard deterministic invariances don't apply. This is a student knowledge gap, not an ambiguity in your prompt.
