prompt: |-
  Got into a three hour argument with a friend last night (he's an environmental historian, I'm not) about whether you can say a drought caused a famine. His take: weather is just backdrop, only people and institutions cause anything, and every "the climate did it" story is determinism in a nicer font. My take: then explain why the same drought flattened one state and barely registered in its neighbour. Nobody budged. Which is annoying because it's literally my job.

  I'm a story editor on a history docuseries. Most episode pitches reach me with a non-human driver bolted on — a volcano, a plague, a multi-decade drought, a monsoon shift. Roughly a dozen a season, maybe 40 minutes each before notes go back to the writer and the showrunner (showrunner has a PhD, writers generally don't). I need a procedure I can actually run on a script's causal claim, not an essay about causation. So: the questions to ask in order, what counts as a passing answer at each one, where the procedure is allowed to kill a claim outright, and where it has to stop and hand off to a human because what's left is a question about which story we're telling rather than what happened. Use whatever is genuinely settled about causes versus background conditions, about attributing anything from proxy data in a single case, and about the political damage the determinist tradition did — but write it for someone who's never read any of that.

  Then run it on three pitches: an episode arguing a long drought brought down a Bronze Age palace system; one arguing epidemic disease rather than military skill explains a conquest, where the writer really wants the disease up front; and one arguing a famine was caused by harvest failure. Let the procedure say no on that third one if it wants to. And tell me straight where it'll misfire — which claims it wrongly passes and which it wrongly kills.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and the Request:**
      *   **User Role:** Story Editor on a history docuseries.
      *   **Problem:** Constant friction with writers (and potentially the showrunner) about causal claims involving non-human drivers (climate, disease, etc.) vs. human agency/institutions. A recent argument with an environmental historian friend highlights the tension between "environmental determinism" and "human contingency."
      *   **Need:** A practical, step-by-step *procedure* (checklist/flowchart style) to evaluate script pitches. Not a philosophical essay. Needs to be actionable for a 40-minute episode format.
      *   **Specific Requirements:**
          *   Order of questions.
          *   Criteria for passing/failing each step.
          *   Kill points (where to reject the claim).
          *   Hand-off points (where it becomes a storytelling choice, not a factual one).
          *   Apply the procedure to three specific pitches (Bronze Age collapse, Disease vs. Conquest, Famine vs. Harvest).
          *   Self-critique: Where will this procedure misfire?
      *   **Tone:** Professional, direct, pragmatic, acknowledging the complexity without getting bogged down in academic jargon. "Write for someone who's never read any of that."

  2.  **Deconstruct the Philosophical Conflict (Mental Sandbox):**
      *   *Friend's View (Environmental Historian):* Strict constructionist. Climate is a background condition. Only human decisions (policy, storage, distribution) turn a hazard into a disaster. Calling it a "drought famine" is deterministic and politically dangerous (implies helplessness).
      *   *User's View:* Comparative evidence matters. If Drought A hits Region X (collapse) and Region Y (fine), the drought is still a necessary factor, even if not sufficient. Ignoring the environmental trigger makes the story sterile.
      *   *Synthesis for TV:* TV needs drivers. "Bad policy" is boring; "The sky turned to dust" is compelling. But "The sky turned to dust and we did nothing" is historically inaccurate. The procedure needs to balance *necessity* (would it have happened without the drought?) and *sufficiency* (did the drought guarantee the outcome?).
      *   *Key Concept:* The "Trigger vs. Vulnerability" model. A drought is the trigger; social fragility is the vulnerability. You need both for a catastrophe.

  3.  **Drafting the Procedure (The "Causal Stress Test"):**
      *   *Goal:* Filter out lazy determinism without sanitizing the role of nature.
      *   *Step 1: The Counterfactual (The "Without It" Test).* If you remove the non-human factor, does the event still happen? If yes, the non-human factor is decoration. If no, it's a cause.
      *   *Step 2: The Comparator (The "Neighbor" Test).* Did similar societies facing the same stress fail? If everyone failed, it's likely the environment. If only one failed, it's likely the society.
      *   *Step 3: The Mechanism (The "How" Test).* Can the script explain the chain of events? Not just "drought -> famine," but "drought -> crop failure -> price spike -> hoarding -> riot."
      *   *Step 4: The Agency Check (The "Who" Test).* Does the script show humans making choices that made it worse or better? If humans are passive victims, it's determinism.
      *   *Decision Points:*
          *   Fail Step 1? Kill the claim.
          *   Fail Step 2? Downgrade the claim (it's a contributing factor, not *the* cause).
          *   Fail Step 3? Send back for rewrite (needs logic).
          *   Fail Step 4? Send back for rewrite (needs character/agency).
          *   Pass all? Green light on facts, but check narrative tone.

  4.  **Refining the Procedure for the User's Context:**
      *   Make it punchy. Use terms like "Kill," "Rewrite," "Green Light."
      *   Address the "Political Damage" aspect: Acknowledge that saying "climate did it" can excuse bad governance. The procedure must force the script to acknowledge governance.
      *   Address "Proxy Data": Acknowledge that in deep history (Bronze Age), data is fuzzy. The procedure needs a "Confidence Interval" check.

  5.  **Applying to the Three Pitches:**

      *   *Pitch 1: Bronze Age Collapse (Drought).*
          *   Context: Late Bronze Age Collapse (1177 BCE). Complex system.
          *   Application: Drought evidence exists (pollen, sediment). But did *all* palaces fall? No. Some survived.
          *   Verdict: Pass Step 1 (system needed surplus), Fail Step 2 (not everyone fell).
          *   Result: Rewrite. Drought is the stressor, not the sole executioner. Needs to show systemic fragility.

      *   *Pitch 2: Disease vs. Conquest (e.g., Cortez/Aztecs or similar).*
          *   Context: Writer wants disease up front.
          *   Application: Step 1 (Without disease, could small force win? Probably not). Step 2 (Did disease hit neighbors? Yes). Step 3 (Mechanism: social disruption, leadership loss). Step 4 (Agency: Did allies join Cortez because of the chaos?).
          *   Verdict: Pass. But warn against "germs did it all" erasing indigenous agency/alliances.

      *   *Pitch 3: Famine caused by Harvest Failure.*
          *   Context: Classic Amartya Sen territory.
          *   Application: Step 1 (Without harvest failure, famine? No). Step 2 (Neighbor test: Did neighbors with same harvest starve? If no, then it's distribution). Step 3 (Mechanism: Did food exist but wasn't delivered?).
          *   Verdict: Likely Kill or Major Rewrite. "Harvest failure" is rarely the sole cause of modern/early modern famine. It's usually entitlement failure. The procedure should catch this.

  6.  **Addressing the "Misfire" (Self-Critique):**
      *   Where does this break?
      *   *Data Gaps:* In deep history, we don't have the "Neighbor" data. The procedure might kill valid theories because evidence is lost.
      *   *Narrative Boringness:* Sometimes the truth is "mostly policy," which is hard to sell in a 40-min doc. The procedure might force a nuance that kills the hook.
      *   *The "Last Straw" Problem:* Sometimes a system is *so* fragile the tiniest trigger breaks it. The procedure might underweight the trigger because the vulnerability was high.
      *   *Political Bias:* The procedure leans towards "human agency" (Sen/Friend's view). It might underplay genuine ecological catastrophes where humans *couldn't* adapt.

  7.  **Final Polish:**
      *   Ensure the tone respects the user's expertise (they know their job) but gives them the philosophical armor they need.
      *   Keep the "Friend's" concern in mind (determinism is dangerous) but validate the user's need for causal drivers.
      *   Structure clearly: The Tool, The Application, The Limitations.

  8.  *(Self-Correction during drafting)*: I initially thought about making Step 2 a hard kill. But in deep history, we often lack neighbor data. I should make Step 2 a "Downgrade" rather than a "Kill" for ancient history, but a "Kill" for modern history. Actually, better to keep it consistent: If you can't prove the neighbor comparison, you can't claim *exclusive* environmental causation. I'll refine that distinction.
      *   *Refinement on Step 4:* Make sure it doesn't just ask "were humans present?" but "did human choices mediate the impact?"

  9.  **Final Review against constraints:**
      *   Procedure in order? Yes.
      *   Passing answers defined? Yes.
      *   Kill/Hand-off points? Yes.
      *   Three pitches analyzed? Yes.
      *   Misfire analysis included? Yes.
      *   Tone appropriate? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is a procedural tool designed for your specific workflow. It is built to navigate the tension between your friend's "strict constructionism" (only humans cause history) and the practical need for narrative drivers (non-human forces move plots).

  It relies on a distinction settled in risk science and economic history: the difference between a **Hazard** (the non-human event) and a **Disaster** (the human outcome). A hazard only becomes a disaster through human vulnerability.

  ### The Causal Stress Test (CST)

  Use this on any pitch where a non-human factor (climate, disease, geology) is claimed as a primary driver of a historical outcome.

  **Step 1: The Counterfactual (The "Without It" Test)**
  *   **Question:** If you remove this non-human factor from the script, does the historical outcome still occur?
  *   **Passing Answer:** No. The outcome is impossible or highly improbable without the drought/plague/volcano.
  *   **Failing Answer:** Yes. The society was already collapsing/war was already inevitable; the non-human factor just changed the timing or aesthetics.
  *   **Action:**
      *   **Fail:** **KILL THE CLAIM.** The non-human factor is decoration. Do not build an episode around it.
      *   **Pass:** Proceed to Step 2.

  **Step 2: The Comparator (The "Neighbor" Test)**
  *   **Question:** Did neighboring societies or similar systems facing the *same* non-human stress suffer the *same* fate?
  *   **Passing Answer:** No. The affected group failed while neighbors survived/adapted. (This proves human vulnerability was the multiplier). OR Yes. Everyone in the region collapsed simultaneously. (This proves environmental severity).
  *   **Failing Answer:** The script claims "Everyone suffered" but cannot name a neighbor who survived, OR claims "Only we suffered" without explaining why the neighbor didn't.
  *   **Action:**
      *   **Fail (Claiming uniqueness without evidence):** **SEND BACK.** Writer must find the comparator or admit the data is missing.
      *   **Pass (Neighbors survived):** **DOWNGRADE CLAIM.** The environment is a *trigger*, not the *cause*. The cause is the specific fragility of the subject.
      *   **Pass (Everyone collapsed):** **GREEN LIGHT ON CAUSATION.** Environmental determinism is provisionally accepted here.

  **Step 3: The Mechanism (The "Chain of Custody" Test)**
  *   **Question:** Can the script trace the specific chain from the non-human event to the human outcome without magic?
  *   **Passing Answer:** Yes. (e.g., Drought -> Crop Yield Drop -> Price Spike -> Urban Unrest -> Palace Burned).
  *   **Failing Answer:** No. (e.g., Drought -> Palace Burned). The link assumes starvation automatically leads to political collapse.
  *   **Action:**
      *   **Fail:** **SEND BACK.** This is "magic determinism." The writer must identify the human decision points in the chain (e.g., the decision to hoard grain, the decision to raise taxes).
      *   **Pass:** Proceed to Step 4.

  **Step 4: The Agency Check (The "Victim" Test)**
  *   **Question:** Does the script depict the historical actors as having choices that could have mitigated the outcome, even if they made the wrong ones?
  *   **Passing Answer:** Yes. Leaders chose to export grain, or chose to fight a war instead of storing food.
  *   **Failing Answer:** No. The people are depicted as passive victims swept away by forces they couldn't understand or stop.
  *   **Action:**
      *   **Fail:** **HAND OFF TO SHOWRUNNER.** This is a narrative/ethical choice, not a factual one. Strict determinism makes for good tragedy but bad history. Flag the political risk (excusing bad governance).
      *   **Pass:** **GREEN LIGHT.** The claim is historically robust.

  ***

  ### Running the Pitches

  Here is how the CST handles your three specific scenarios.

  #### Pitch 1: The Bronze Age Collapse (Drought brought down the Palace System)
  *   **Step 1 (Counterfactual):** *Pass.* Most historians agree the system was running on surplus. Remove the climate shock, the system likely persists longer.
  *   **Step 2 (Comparator):** *Fail/Downgrade.* Evidence suggests some regions (e.g., parts of Cyprus or inland areas) fared better or recovered faster than the major palace centers (Mycenae, Hattusa). It wasn't uniform.
      *   *Result:* You cannot say "The Drought caused the Collapse." You must say "The Drought broke a system that was already over-extended."
  *   **Step 3 (Mechanism):** *Send Back.* Writers often jump from "dry weather" to "Sea Peoples invasion." The script needs to show the breakdown of trade networks that prevented grain import.
  *   **Step 4 (Agency):** *Hand Off.* If the script paints the Bronze Age kings as helpless against the sky, it's determinism. If it shows them failing to adapt trade routes, it's history.
  *   **Verdict:** **Rewrite Required.** The drought is the *accelerant*, not the *match*. The pitch must shift focus to systemic fragility.

  #### Pitch 2: Epidemic vs. Military Skill (Conquest explained by Disease)
  *   **Step 1 (Counterfactual):** *Pass.* A force of 500 men cannot hold a empire of millions without the demographic collapse caused by disease.
  *   **Step 2 (Comparator):** *Pass.* The disease (smallpox/measles) hit populations with no immunity across the hemisphere, not just the specific polity being conquered.
  *   **Step 3 (Mechanism):** *Pass.* Disease -> Death of Leadership + Social Panic -> Loss of logistical cohesion -> Military defeat.
  *   **Step 4 (Agency):** *Risk.* This is the danger zone. If the script says "Germs won the war," it erases the indigenous allies who joined the conqueror *because* the system was destabilized.
  *   **Verdict:** **Green Light with Note.** The causal claim holds, but the *story* must include the human political maneuvering that exploited the disease. The disease opened the door; humans walked through it.

  #### Pitch 3: Famine Caused by Harvest Failure
  *   **Step 1 (Counterfactual):** *Pass.* Without harvest failure, there is no food shortage.
  *   **Step 2 (Comparator):** *Fail.* (Assuming a modern or early-modern context). In almost all recorded famines of the last 300 years, neighboring regions with similar harvests did *not* starve because of trade or storage. (See: Amartya Sen's work on entitlements).
      *   *Result:* If the script claims "Harvest failure caused the famine" without addressing distribution, it is historically suspect.
  *   **Step 3 (Mechanism):** *Fail.* "No rain -> No food -> Death" ignores markets, storage, and government relief.
  *   **Step 4 (Agency):** *Fail.* This claim inherently removes agency. It suggests the famine was an act of God rather than a failure of entitlement.
  *   **Verdict:** **KILL THE CLAIM.** Unless this is a pre-agricultural society or a siege situation where trade is physically impossible, "harvest failure" is rarely the cause of famine. It is the *hazard*. The *cause* is the failure to move food to the hungry. The script must pivot to *why* the food didn't move.

  ***

  ### Where This Procedure Will Misfire

  You asked for the blind spots. No checklist is perfect. Here is where the CST will lead you astray:

  **1. The "Deep Time" Data Gap (False Negatives)**
  In the Bronze Age or earlier, we often lack the "Neighbor" data (Step 2). We don't have the tax records of the society that survived. The CST might force a writer to downgrade a valid environmental claim simply because the archaeological record is silent on the survivors.
  *   *Fix:* In deep time, allow Step 2 to pass on "Lack of Evidence to the Contrary," but flag it as a hypothesis, not a fact.

  **2. The "Overwhelmed System" Problem (False Negatives)**
  Sometimes a hazard is so severe that *no* human agency could have stopped the outcome (e.g., the Toba Catastrophe or the end of the Permian). The CST's Step 4 (Agency) might force a writer to invent "choices" where none existed, creating a false sense of control.
  *   *Fix:* If the magnitude of the event exceeds known human adaptive capacity, skip Step 4. Acknowledge pure determinism.

  **3. The "Boring Truth" Problem (Narrative Friction)**
  The CST is designed to protect historical accuracy, not ratings. The "Boring Truth" is often that a famine was caused by a complex web of tariff regulations and storage logistics, not a drought. The CST will correctly identify the tariff as the cause, but that might make for a 40-minute episode that feels like a lecture on economics.
  *   *Fix:* This is your hand-off point to the Showrunner. The CST validates the *facts*; the Showroom must decide if the *story* is sellable. You can have a historically accurate pitch that is ungreenlightable.

  **4. The Political Blind Spot**
  Your friend (the historian) is worried about "determinism in a nicer font." He is right. If you pass a script that says "The Climate Made Us Do It," you are inadvertently excusing corruption or incompetence. The CST (specifically Step 4) tries to catch this, but it can be subtle.
  *   *Fix:* If Step 4 passes, do one final check: *Who benefits from this explanation?* If the explanation absolves the powerful of responsibility, demand a second opinion from a specialist in that region's social history.

  ### Summary for your Workflow
  1.  **Run the CST on the pitch document.**
  2.  **If Step 1 fails:** Reject the pitch.
  3.  **If Step 2 or 3 fails:** Send back for notes. The logic is broken.
  4.  **If Step 4 fails:** Call the Showrunner. This is now a debate about the *kind* of history you are making, not the *accuracy* of it.
  5.  **If all pass:** You have a historically defensible causal claim. It doesn't guarantee a good episode, but it guarantees you aren't teaching nonsense.
