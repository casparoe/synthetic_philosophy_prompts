      *   *Unctuous egoism:* "Unctuous" = oily/smooth (often religiously sanctimonious). Egoism = self-interest. She's claiming his self-aggrandizement is disguised as religious devotion. It's not just egoism; it's egoism *masked* as piety.
      *   *Spiritualizing alembic:* Alembic = alchemical still for distillation. "Spiritualizing" = interpreting literally inconvenient texts metaphorically. Mechanism: Take hard text $\rightarrow$ put in still $\rightarrow$ evaporate the hard part $\rightarrow$ keep the vague "spirit." It's a tool for evasion.
      *   *Writer of imaginary conversations:* Refers to Landor (probably). Key point: Control. You control both sides of the dialogue. You make the opponent look stupid so you look smart.
