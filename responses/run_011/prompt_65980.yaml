answer: |-
  This is a fantastic passage to get stuck on, because it's the engine room of the whole essay. Eliot isn't just sniping at Cumming; she's building a theory of how religious authority functions socially and epistemically. If you don't crack this opening, the rest of the essay just looks like mean-spirited biography.

  Let's walk through your three points in order. I'm going to treat this as a collaborative close-reading, because your instinct about the "two separate complaints" is exactly where the philosophical weight lies.

  ### 1. The Loaded Bits: Metaphors as Mechanisms

  You're right to distrust the dictionary definitions here. Eliot isn't using these terms for decoration; she's using them to describe *mechanisms of evasion*.

  *   **"Goshen of mediocrity":** You have the biblical reference right (Exodus 8:22, where the Israelites are spared the plagues). But the bite is in the word *mediocrity*. Goshen wasn't just a safe space; it was a space where the laws of nature (the plagues) were suspended for a specific group. Eliot is arguing that the Evangelical pulpit is a zone where the *laws of intellect* are suspended. In the secular world (the "plagues"), a mediocre man would be exposed by competition, criticism, or failure. In the pulpit (Goshen), those standards don't apply. It's not just that he is safe; it's that his mediocrity is *protected by divine sanction*.
  *   **"Unctuous egoism":** "Unctuous" literally means oily (from *unguent*), but in religious parlance, it means excessively smooth or sanctimonious. If she just said "egoism," she'd be accusing him of selfishness. By saying "unctuous egoism," she's accusing him of *consuming* the language of selflessness to feed his self-interest. It's a specific kind of hypocrisy where the ego is inflated *through* the performance of humility.
  *   **"Spiritualizing alembic":** An alembic is an alchemical still used for distillation. This is a technical critique of hermeneutics (interpretation). She's saying Cumming uses a two-step process:
      1.  Take a biblical text that is morally or scientifically embarrassing (the "letter").
      2.  Run it through the "alembic" of spiritual interpretation.
      3.  Output: A vague, impalpable "spirit" that retains the prestige of the Bible but loses the inconvenient constraints.
      It's a charge of *intellectual fraud*. He claims to be interpreting the text, but he's actually distilling it to remove the parts that would burden his audience.
  *   **"Writer of imaginary conversations":** This is a reference to Walter Savage Landor, who wrote dialogues between historical figures. The point here is *control*. In a real debate, your opponent talks back. In an imaginary conversation, you write their lines for them. You make them say something stupid so you can refute it. This sets up your third point (the petard), but here it serves to illustrate the *monologic* nature of preaching.
  *   **"Amphitryon":** In myth, Zeus impersonated Amphitryon to sleep with his wife. But in common 19th-century usage, "Amphitryon" just meant "the host" (from the play *Amphitryon* where the host is usurped). Eliot means the wealthy layman who invites the preacher to dinner. The joke is social inversion: The preacher is the guest, but he dominates the host. The "cynosure of a thousand eyes" gives him social power that overrides class hierarchy.
  *   **"Made reason-proof by being baptized with the name of piety":** This is the crux of your causal vs. justificatory question. It is **both**, but functionally it is an *immunization strategy*.
      *   *Causally:* The passion (fear, tribal belonging) exists first.
      *   *Mechanically:* You label that passion "piety."
      *   *Result:* Once labeled, reason cannot touch it. Why? Because to apply reason to "piety" is itself seen as impious.
      *   It's not that the belief becomes logically stronger; it's that it becomes *socially untouchable*. The "baptism" doesn't change the content of the belief; it changes the *rules of engagement* allowed around the belief. This is crucial for the seminar: Eliot is treating religious belief not as a claim about the world, but as a social technology for protecting passions from scrutiny.

  ### 2. The Main Thing: Psychology vs. Epistemic Structure

  Your marginalia is spot on: there are two complaints here.
  1.  **Psychological:** Passions are relabeled as piety (internal corruption).
  2.  **Structural/Epistemic:** The pulpit allows no criticism (external corruption).

  You ask: *Is she committed to "an unchallenged assertion is ipso facto unwarranted"?*

  **No, not exactly.** She is committed to a weaker but more dangerous claim: **"An unchallenged assertion in a high-stakes moral context will inevitably drift toward falsehood because the incentives are misaligned."**

  If Cumming only told the truth, the structure wouldn't change, but Eliot would still argue the *habit of mind* cultivated in the audience is toxic. She isn't just arguing about the truth-value of Cumming's specific propositions (e.g., "Is the Pope the Antichrist?"); she is arguing about the **epistemic virtue** of the listeners.

  If you sit in a room where you are not allowed to question, you don't just learn the specific doctrines; you learn *submission*. You lose the muscle of critical inquiry. So, even if Cumming told the truth, the *method* is an attack on the intellectual autonomy of the hearer. For Eliot (and the Victorian freethinkers), the *process* of arriving at belief is as important as the belief itself. A truth accepted on authority is not knowledge; it's dogma.

  **On "those of his hearers who are not sympathizing are not listening":**
  This is the linchpin. You have three readings; Eliot needs the **third one (Epistemic Closure)** to make the argument work, but she relies on the **second one (Selection Bias)** to make it plausible.

  *   *Reading 1 (Boredom):* Too weak. Doesn't explain the danger.
  *   *Reading 2 (Selection):* The dissenters leave. This creates an echo chamber.
  *   *Reading 3 (Disengagement):* The dissenters stay (physically) but disengage (mentally) because the structure offers them no outlet.

  **Why the distinction matters:** If it's just Reading 2, Cumming is just preaching to the choir. That's harmless. If it's Reading 3, Cumming is *silencing* opposition within his own room. The phrase "certain that... [they] are not listening" implies a calculated confidence on the preacher's part. He *knows* he doesn't have to convince the skeptics; he only has to energize the believers. The skeptics are structurally neutralized.

  This connects to your worry about "unaudited = bad." Eliot's point is that in a moral/religious system, **audit is the only check on power.** Without the possibility of a "hiss" or a "retort," the preacher's power becomes absolute. And for Eliot (writing in the *Westminster Review*, a radical journal), absolute power corrupts absolutely. She isn't saying "he might be wrong"; she's saying "the system guarantees he will eventually be wrong because there is no correction mechanism."

  ### 3. Is She Hoist by Her Own Petard?

  This is the strongest objection you can raise in seminar, so let's steelman it.

  **The Objection:** Eliot accuses Cumming of creating a strawman opponent he can easily defeat ("put what imbecilities he pleases into the mouths of his antagonists"). But in this essay, Eliot creates a "Dr. Cumming" who is a caricature of mediocrity and egoism. She puts words in his mouth (the imperative "Let him..."). She controls the narrative. The reader of the *Westminster Review* cannot stand up and hiss. Is this not the same monologic authority she condemns?

  **The Asymmetry Defense:**
  There is a principled difference, but it relies on the **nature of the claim** and the **medium of response**.

  1.  **Claim to Authority:** Cumming speaks *ex cathedra* (from the chair). His authority rests on the premise that he is a conduit for Divine Truth. To question him is to question God. Eliot speaks as a critic. Her authority rests on evidence and argument. To question her is to do exactly what she invites (critique).
  2.  **Checkability:** Eliot's essay is full of footnotes (in the full text) citing Cumming's actual published sermons. She is saying, "Here is what he said, here is why it is contradictory." Cumming's sermons claim authority based on revelation, which is not checkable. Eliot is participating in a **marketplace of ideas** (the periodical press) where replies are possible (and indeed, Cumming's supporters did reply). The pulpit is a **hierarchy**.
  3.  **The "Hiss" Factor:** You can write a letter to the editor in response to Eliot. You cannot argue with a preacher during the sermon. The *temporal* structure is different. The periodical allows for a delayed but actual response; the liturgy forbids immediate response.

  **Does the objection land?**
  It lands *rhetorically*, but not *structurally*.
  Eliot *is* being rhetorical and biting. She is absolutely using her control of the printed page to frame Cumming in the worst possible light. A generous reading of Cumming might say, "He actually cares about his flock." Eliot dismisses that.
  *However*, the asymmetry holds because Eliot **subjects herself to the standards she demands.** She offers evidence. She uses logic. She invites the reader to judge. Cumming, by her account, asks the reader to *submit*.

  **The Verdict for Seminar:**
  You can argue that Eliot is guilty of the same *rhetorical* dominance, but she is innocent of the *epistemic* crime. The crime she accuses Cumming of is claiming **infallibility within a closed system.** She does not claim infallibility; she claims **probability based on evidence.**
  The difference is: Cumming says "Believe this because I say it is God's word." Eliot says "Disbelieve him because here are the contradictions."
  One closes inquiry; the other attempts to open it.

  ### Summary for your Thursday prep

  If you want to drive the discussion, focus on the shift from **Content** to **Condition**.

  *   **Don't** get bogged down in whether Cumming was actually a bad theologian (he was popular, but Eliot thinks he's a fraud).
  *   **Do** argue that Eliot is attacking the **social conditions of belief**.
  *   **Key Distinction:** She isn't just saying "He is wrong." She is saying "The pulpit is a technology that makes it impossible for him to be corrected, and therefore makes it inevitable that he will be wrong."
  *   **The "Reason-Proof" line:** Use this to pivot to Victorian doubt. The problem isn't that science disproves religion; it's that religion constructs a social fortress that makes science irrelevant. That's why she mocks the "spiritualizing alembic"—it's a way to make faith unfalsifiable.

  This passage is Eliot's diagnosis of the disease: It's not that people believe lies; it's that the institution protects the lies from the cure (criticism). That's the "Victorian Doubt" angle—it's not just theological; it's sociological.
