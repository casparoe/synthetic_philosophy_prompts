answer: |-
  This is a productive collision of vocabularies. You are right to suspect that the metaphysics of dispositions is wrestling with problems the law has operationalized, though often without admitting the ontological cost. The law is primarily interested in the *allocation of loss*, whereas the metaphysicians are interested in the *truth conditions of counterfactuals*. When you map the latter onto the former, you see where the law relies on metaphysical shortcuts to achieve policy ends.

  Here is the translation of the cases, followed by the residue report and the verdict on your hypothesis.

  ### I. Case Translation: Tort Vocabulary for Metaphysical Problems

  In this mapping, treat the **Disposition** as a **Duty of Care** (in negligence) or a **Defective Condition** (in strict liability). Treat the **Stimulus** as the **Breach** or the **Triggering Event**. Treat the **Manifestation** as the **Injury/Harm**.

  **1. The Electro-Fink (Martin)**
  *   **The Case:** A wire is disposed to conduct electricity when touched. A device detects touching and instantly cuts the current, so it never conducts.
  *   **Tort Translation:** This is a **self-revoking license** or a **duty that extinguishes upon the attempt to enforce it**. Imagine a security system that is armed (disposed to shock) but has a sensor that disarms the voltage the millisecond a trespasser makes contact.
  *   **Doctrinal Fit:** **Condition Precedent / Failure of Consideration.** The duty to compensate (or the capacity to harm) is contingent on the state of the wire *at the moment of injury*.
  *   **The Bend:** Tort law generally freezes the status of the instrumentality at the time of the breach. If the wire was "live" when the plaintiff reached for it, we usually find liability even if a fuse blew mid-contact. The Fink requires us to say the capacity *ceased* exactly when the condition for its exercise was met. In tort, we would likely call this a **superseding intervening cause** (the sensor), but the metaphysics insists the *wire itself* changed status. The law cares about the risk created; the metaphysics cares about the intrinsic state at time *t*.

  **2. The Packed Glass (Mask)**
  *   **The Case:** A glass is fragile. It is wrapped in perfect packing. It is struck, but does not break because of the packing.
  *   **Tort Translation:** **Mitigation of Risk / Safety Appliance.** The defendant manufactured a dangerous instrumentality (fragile glass) but employed a safety measure (packing) that prevented the harm.
  *   **Doctrinal Fit:** **No Proximate Cause / No Damages.** In strict liability, the "defect" exists regardless of the packing. In negligence, the packing might show reasonable care.
  *   **The Bend:** The law asks, "Did the defect cause the loss?" If the packing worked, the answer is no. The metaphysics asks, "Is the glass still fragile?" The law has no need to answer the second question to resolve the first. To map this, you have to treat the "fragility" as a **latent defect**. The law acknowledges the defect exists (discovery rule) even if harm hasn't manifested, but without manifestation, there is no tort. The mask is a successful **intervening prevention**.

  **3. The Sorcerer (Fink/Mask Hybrid)**
  *   **The Case:** A sorcerer monitors the glass. If it is struck, he casts a spell to make it unbreakable for that instant, then restores fragility.
  *   **Tort Translation:** **Third-Party Intervention / Superseding Cause.** An external agent actively prevents the harm that the instrumentality was poised to cause.
  *   **Doctrinal Fit:** **Superseding Intervening Cause.** The sorcerer breaks the chain of causation between the manufacturer's defect (fragility) and the injury.
  *   **The Bend:** This is where the "intrinsic" requirement of dispositions clashes with legal externalism. The law doesn't care if the glass *remained* fragile intrinsically; it cares that the sorcerer prevented the harm. To make this fit, you must treat the sorcerer's magic as a **force majeure** event. The metaphysical worry (did the disposition persist?) maps to the legal worry (was the defendant's creation still the proximate cause?). The law answers "no" because the sorcerer intervened.

  **4. The Antidote (Bird)**
  *   **The Case:** A poison is disposed to kill. An antidote is administered immediately, neutralizing it.
  *   **Tort Translation:** **Medical Intervention / Eggshell Plaintiff (inverse).** The instrumentality (poison) had the capacity to kill, but a counter-force negated it.
  *   **Doctrinal Fit:** **Causation in Fact (But-For Test).** *But for* the antidote, the plaintiff dies. Therefore, the poison was lethal.
  *   **The Bend:** This fits well. The law accepts the disposition (lethality) exists even if the manifestation (death) is blocked. However, the law treats the antidote as a **mitigating factor**, not as evidence that the poison wasn't poisonous. The metaphysical debate is whether the poison *lost* its disposition. The law says it doesn't matter; the risk was created.

  **5. The Reverse Fink**
  *   **The Case:** An object is not disposed to break, but a device detects a strike and makes it fragile *just in time* for it to break.
  *   **Tort Translation:** **Duty Arising from Contact / Attractive Nuisance.** The object was safe until the plaintiff interacted with it, at which point it became dangerous.
  *   **Doctrinal Fit:** **Strict Liability for Abnormally Dangerous Activities.** The activity creates the risk upon engagement.
  *   **The Bend:** Tort law is suspicious of duties that arise *ex nihilo* from the plaintiff's act (no duty to rescue). A reverse fink implies the property is *created* by the stimulus. In tort, this looks like a **trap**. We would likely impute the disposition to the owner regardless of the mechanism, under the theory that they created the mechanism that generates the risk.

  ### II. Testing Your Hypothesis: The Fink/Mask Distinction

  You suspect the distinction doesn't survive translation. You are half-right.

  In **Negligence**, the distinction collapses. Whether the wire went dead (fink) or the packing held (mask), the outcome is "no breach" or "no causation." The law is outcome-oriented. If the harm didn't happen, we rarely litigate the ontology of the risk.

  In **Strict Liability / Product Defect**, the distinction *does* survive, and it maps cleanly:
  *   **Mask:** The product is **defective** (disposition exists), but the harm was prevented. (Think: a car with bad brakes that didn't crash because the driver was skilled). The defect remains actionable if discovered.
  *   **Fink:** The product is **not defective** at the moment of impact. (Think: a car with bad brakes that self-repairs the millisecond the pedal is touched). If the mechanism works perfectly every time, there is no defect, hence no liability.

  **Verdict on your doubt:** The distinction survives only if you care about the *status of the instrumentality* (Strict Liability), not the *chain of events* (Negligence/Causation). The metaphysicians care about the status of the instrumentality. So, the distinction is real, but it is a **liability classification** distinction, not a **causal** distinction. In tort terms: Mask = Defect exists, no damages. Fink = No defect, no damages.

  ### III. The Residue Report

  Here is what falls out of the translation, addressing your three specific requirements.

  **1. What has no counterpart? (Intrinsicness & Categorical Basis)**
  *   **The Gap:** The law has no concept of an **Intrinsic Property**. Tort law is thoroughly relational. A "duty" is not a property of the defendant; it is a relationship between defendant and plaintiff. A "defect" is not an intrinsic state of the product; it is a failure to meet a standard of safety relative to user expectations.
  *   **Why the law never needed it:** The law is interested in **attribution**, not **ontology**. It matters *who* is responsible, not *what property* grounded the responsibility. Whether the fragility is grounded in the molecular structure (categorical basis) or a sorcerer's spell (extrinsic basis) is irrelevant to the victim who was cut by glass.
  *   **Sophistication or Blind Spot?** It is **pragmatic sophistication**. Insisting on intrinsicness would make liability impossible to prove in complex systems. If I sell you a car, I am liable for its failures regardless of whether the "disposition to fail" is in the metal or in the software code sent from a server (extrinsic). Requiring an intrinsic basis would create a loophole for all networked/dependent technologies. The metaphysicians need intrinsicness to solve the problem of *identity* (is it the same disposition?). The law doesn't care about identity; it cares about **risk allocation**.

  **2. Where am I smuggling Policy as Metaphysics? (Proximate Cause)**
  *   **The Smuggle:** Every time I used **Proximate Cause** or **Superseding Cause** to explain why a disposition didn't manifest, I imported policy.
  *   **The Flag:** Proximate cause is a tool to limit liability based on foreseeability and fairness. It is not a description of the physical world. When a metaphysician says, "The mask does not remove the disposition," they are making a claim about the world. When a judge says, "The intervening packing breaks the chain of causation," they are making a claim about **who should pay**.
  *   **The Danger:** If you use "proximate cause" to solve the fink problem, you are solving a truth-conditional problem with a policy tool. You are saying, "We will treat the disposition as existing because it is fair to treat it as existing." That works for a verdict; it fails for a seminar on truth. The law *stipulates* causal chains to achieve justice. Metaphysics tries to *discover* them to achieve accuracy. Do not confuse the stipulation for the discovery.

  **3. The Final Verdict: Missing Category or Label Allocation?**
  *   **The Question:** Is "still disposed, just masked" doing the same work as "liable notwithstanding intervening cause"?
  *   **The Answer:** Yes. The metaphysical debate is largely **label allocation** disguised as ontology.
  *   **The Reasoning:** The core work being done in both fields is **counterfactual stability**.
      *   In Law: We want to hold the defendant liable even if an intervening event *could* have stopped the harm, because we want to incentivize safety. We say the cause was "proximate."
      *   In Metaphysics: We want to say the glass is "fragile" even if packing stopped it, because we want to classify the object correctly. We say the disposition was "masked."
  *   **Conclusion:** Your framework is not missing a category. The metaphysical debate is less substantive than it looks *if* your goal is to explain how we navigate the world. But if your goal is to explain what the world *is*, the law offers no help.
  *   **The Twist:** The law reveals that the "disposition" is a **normative status**, not a natural kind. When we call glass "fragile," we are implicitly tagging it for special handling (liability/caution). When the metaphysicians argue about finks, they are arguing about whether that tag sticks when the handling is prevented. The law says: "The tag sticks if we need it to for policy." The metaphysicians say: "The tag sticks if the universe says so."
  *   **Final Diagnosis:** The residue shows that the metaphysical debate is trying to naturalize a normative concept. "Disposition" is closer to "Duty" than it is to "Mass" or "Charge." Your legal intuition is correct: the apparatus of duty, breach, and proximate cause handles the *functional* role of dispositions better than the intrinsic/extrinsic ontology does. The metaphysicians are trying to build a physics of obligations. You already speak that language; you call it Torts.

  **Summary for the Seminar:**
  Tell your students that the Fink/Mask distinction maps to **Defect vs. Superseding Cause**. Tell them the "Intrinsic Basis" requirement is a **Privity** rule that the modern world has abandoned. Tell them that arguing whether a masked disposition "exists" is the same as arguing whether a defendant is "liable" when no harm occurred—it's a debate about the **scope of the rule**, not the **state of the object**. The law solved this by separating the breach (existence of risk) from the damages (manifestation of risk). The metaphysicians are still trying to merge them.
