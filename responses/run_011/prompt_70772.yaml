  The interpretation-theoretic diagnosis is correct about the mechanism but incorrect about the cause, as the semantic dispute is itself driven by a genuine moral disagreement over political authority. Camp One's reliance on original intent is not merely a linguistic preference but a normative commitment to intergenerational trusteeship, where the present generation holds institutions in trust for the past and future; Camp Two's reliance on uptake is a normative commitment to popular sovereignty, where the present generation must authorize all public speech acts. You are right that they are talking past each other on semantics, but wrong to assume this displaces the moral conflict, because each side selects the theory of meaning that best secures their underlying political value. Progress requires exposing this link rather than trying to resolve the semantics independently.

  Your second suspicion regarding street names versus statues is the most productive lever for breaking the stalemate, because it introduces a functional distinction that disrupts the binary moral framing. A street name functions primarily as infrastructure and coordinate data, meaning its "uptake" is largely instrumental rather than honorific, whereas a statue functions purely as expressive speech with no utilitarian cover. You should propose disaggregating the assets: argue that street names may be retained under a functional necessity clause while statues are removed under an expressive endorsement clause, or vice versa depending on the specific friction of change. This forces Camp One to defend the honorific value of a utilitarian label and Camp Two to defend the cost of changing infrastructure against the benefit of semantic purity. If Camp Two insists a street name is an endorsement despite its utilitarian function, they reveal their concern is performative purity rather than actual uptake; if Camp One insists a statue is merely historical record despite its expressive form, they reveal their concern is stability rather than truth.

  To move the seminar beyond impasse, propose a thought experiment that tests the limits of each semantic theory without triggering the moral defenses. Ask Camp One if adding a prominent plaque explicitly condemning the benefactor's restrictions preserves the "historical record" sufficiently to satisfy their anti-censorship claim, or if the mere presence of the name still constitutes endorsement. Ask Camp Two if renaming the street actually changes the "uptake" for pedestrians who ignore the name regardless, or if it merely performs virtue for a subset of observers. If Camp One accepts the plaque, the dispute shifts from removal to context; if Camp Two admits the rename is symbolic only, the dispute shifts to cost-benefit analysis. This moves the discussion from "what does this mean" to "what work do we want this object to do."

  Ultimately, the question is not ill-posed, but the binary framing of "keep versus remove" is. An institutional arrangement that dissolves the question involves shifting from a logic of erasure to a logic of layering, where the monument remains but is semantically hijacked by the present generation to tell a more complex story. This satisfies Camp One's demand for continuity of the artifact and Camp Two's demand for correction of the message, provided both sides accept that meaning is not fixed but negotiated. The impasse signals not that the question is wrong, but that the available answers are too crude for the complexity of public memory.
