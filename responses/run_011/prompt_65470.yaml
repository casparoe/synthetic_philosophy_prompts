prompt: |-
  I run customer operations at a mid-size energy supplier: about thirty human advisers working off a hardship playbook, plus an automated assistant we switched on in the spring that handles much the same conversations (payment plans, back bills, vulnerability flags). Since then I've been having the same argument every fortnight, from two directions at once. Complaints come in that the bot 'just repeats itself' — a customer says something slightly off-script, like asking whether they can pay next Friday instead, and the thing apologises and cycles back through the same three sentences until someone re-words it — and my QA lead wants more flexibility, more escape hatches, more room for it to improvise. Our compliance signatory argues precisely the opposite: the playbook is there so that two customers in the same circumstances get the same answer and so there's an audit trail behind it, and she'd sooner have a wasp than a maverick. Both of them started using the word sphexishness at me after I mentioned Tinbergen's digger wasp trick at an away-day — you know the one, where the paralysed grasshopper gets nudged a few inches while the wasp is down its burrow, so the wasp comes out, drags it back to the lip, goes down to check again, and the ethologist can keep that loop running for as long as he likes — and I'm now fairly sure neither of them means the same thing by it.

  What I actually want is one procedure my team can run, because this decision keeps coming up: every escalated complaint, every playbook revision, every release of the bot, and right now it gets settled by whoever argues hardest. So please write me a repeatable rigidity audit — the questions or tests to run in order, what counts as a sufficient answer at each one, where it stops with 'this is fine', where it stops with 'this is broken', and where it stops being a factual question and has to hand the decision to a named human because it's really about how much risk of a wrong-but-flexible outcome we're willing to absorb. Build it out of whatever the idea of sphexishness genuinely gives you rather than out of vibes, and be explicit about which bits of the philosophy you had to keep and which you dropped to make it usable by an analyst who's never read any of it. A few things I specifically want it to handle: the wasp only shows up under repetition, so how many times do we have to re-run the same perturbation before we're entitled to call it rigid, and what do we do when we can't repeat it because the perturbation would harm a real customer; how to tell whether the rigidity is in the agent or in the scaffolding around it (the tool it's been given, the form fields, the IVR menu, the script a human has been handed) or in the tester, whose own repertoire of nudges may be the thing stuck in a loop; how to separate a performer that genuinely can't do otherwise from one that shouldn't, given that some of our rules are deliberately entrenched and are supposed to refuse to look at reasons that would otherwise be relevant; and the caution against judging a system by whether its flexibility looks like the kind we'd expect in a person, since the wasp isn't defective in the wasp's world and maybe neither is our bot in ours. I also want to know whether anything in the free-will side of this — the whole determinism-and-evasion debate the wasp example gets wheeled out for — actually changes what I should test for, or whether it's decoration. If a step is a judgement call wearing a procedure's clothes, say so on the step.

  Then run it on three cases of ours. First, the bot's off-script loop above, which recovers as soon as a human re-phrases, generates something like forty contacts a month and has produced two ombudsman referrals. Second — and I suspect this is the one that's going to annoy me — our human advisers who decline a payment break for a customer whose situation isn't in the enumerated list, and who say afterwards that they knew the customer would default: is that sphexishness, is it entrenchment doing exactly the job it was designed to do, or is it a third thing, and what does the procedure tell me to do about it given that 'let them improvise' isn't an option I'm allowed to take to compliance? Third, our dunning letter sequence, a dumb workflow automation everyone assumes is rigid by design and nobody has ever tested: does the audit even apply to it, and if it doesn't, how am I supposed to know that in advance rather than discovering it after a complaint. Finally, tell me plainly what the procedure can't do — the forms of rigidity it will miss, the cases where it will cry wolf, and the point at which it's really just telling me what I already wanted to hear. No reading list or sources needed, I'm not writing an essay, I need something I can put in front of two people who don't trust each other and get an hour's work out of it.
reasoning: |-
  Here's a thinking process that leads to the suggested Rigidity Audit:

  1.  **Deconstruct the Request:**

      *   **User:** Customer Operations Manager at a mid-size energy supplier.
      *   **Context:** 30 human advisers + automated assistant (bot).
      *   **Conflict:** QA Lead wants flexibility/improvisation vs. Compliance Signatory wants consistency/auditability. Both are using the term "sphexishness" (referencing Tinbergen's digger wasp) but likely mean different things.
      *   **Goal:** A repeatable "Rigidity Audit" procedure to decide when rigidity is acceptable vs. broken. Needs to handle specific edge cases (repetition counts, harm prevention, agent vs. scaffolding vs. tester, deliberate entrenchment, anthropomorphism bias).
      *   **Philosophical Constraint:** Build it out of the *idea* of sphexishness (Tinbergen's wasp), not vibes. Be explicit about what philosophy is kept/dropped. Address the free-will/determinism debate (is it decoration?).
      *   **Application:** Run the audit on three specific cases:
          1.  Bot off-script loop (40 contacts/month, 2 ombudsman referrals).
          2.  Human advisers declining payment breaks not on the list (knowing default will happen).
          3.  Dunning letter sequence (untested automation).
      *   **Output Requirement:** Plain language on limitations (what it misses, false positives, confirmation bias). No reading list. Actionable for two conflicting stakeholders.

  2.  **Analyze "Sphexishness" (Philosophical Core):**

      *   *The Original Experiment:* Tinbergen observed the digger wasp (*Sphex ichneumoneus*). It drags a paralyzed cricket to the burrow, leaves it at the threshold, goes in to check, comes out, drags it in. If the cricket is moved *while the wasp is inside*, the wasp comes out, puts the cricket back at the threshold, goes in to check, repeats. It never adapts.
      *   *Dennett's Interpretation:* Daniel Dennett used this in *Elbow Room* to discuss free will and determinism. He argues "sphexishness" isn't about determinism (we are all determined physically), but about *responsiveness to relevant information*. A system is sphexish if it ignores *new* relevant information that should trigger a change in procedure.
      *   *Key Distinction:* It's not about "can it do otherwise?" (metaphysical freedom), it's about "does it track the *reasons* for the action?" (functional responsiveness).
      *   *Application to Business:* Rigidity isn't bad if the rule is designed to ignore certain variables (compliance). Rigidity *is* bad if the system ignores variables it *ought* to track to achieve its goal (customer resolution + regulatory fairness).
      *   *Decision:* Drop the metaphysical free-will debate (it is decoration for an ops manager). Keep the functional definition: **Rigidity = Failure to update behavior in response to relevant environmental feedback that the system's design goals imply should matter.**

  3.  **Drafting the Rigidity Audit (The Procedure):**

      *   *Structure:* Needs to be a step-by-step flow.
      *   *Step 1: Define the Goal.* What is the system *supposed* to do? (Compliance vs. Resolution).
      *   *Step 2: Identify the Perturbation.* What changed in the input?
      *   *Step 3: Relevance Check.* Should the system care about this change? (Crucial for Compliance vs. QA fight).
      *   *Step 4: Repetition Threshold.* How many times to test? (Addressing the "wasp only shows up under repetition" constraint).
      *   *Step 5: Locus of Rigidity.* Is it the agent, the tool, or the tester?
      *   *Step 6: The Handoff.* When does it become a risk appetite decision?

      *   *Refining the "Sphex" Logic:*
          *   Keep: The distinction between "mechanical repetition" and "goal-directed flexibility."
          *   Keep: The idea that a system can be "blind" to specific stimuli.
          *   Drop: The implication that humans are fundamentally different (humans can be sphexish too).
          *   Drop: Determinism vs. Free Will (irrelevant for ops).

      *   *Addressing Specific Constraints:*
          *   *Repetition:* Need a number. 3 is standard in UX testing, but for compliance risk, maybe 5? Let's say 3 successful reproductions of the loop.
          *   *Harm:* If we can't test on real customers, we need a "Shadow Mode" or simulation.
          *   *Agent vs. Scaffolding:* The audit must check the *interface*, not just the brain/model.
          *   *Deliberate Entrenchment:* This is the "Compliance Veto." If the rule says "Ignore X," ignoring X is not sphexishness, it's feature compliance.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Bot Loop):* Classic sphexishness. Input changes (Friday payment), output stays same. Relevance: High (payment date matters). Repetition: 40 contacts/month proves it. Verdict: Broken.
      *   *Case 2 (Human Advisers):* This is tricky. They follow the script (entrenchment) but know the outcome (default). Is this sphexishness? No, it's *Learned Helplessness* or *Bureaucratic Ritualism*. The system (policy) forces the rigidity. The humans are acting as the wasp. The audit needs to flag the *policy*, not the human.
      *   *Case 3 (Dunning Letters):* Automation. Nobody tests it. The audit *must* apply. If the customer pays but the letter still threatens legal action because the system didn't update, that's sphexishness. Verdict: High risk, needs immediate testing.

  5.  **Refining the Output Tone:**

      *   Professional, direct, operational.
      *   Acknowledge the tension between QA and Compliance without taking sides initially.
      *   Explicitly state where the "Judgement Call" lies.

  6.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Did I address the "free will" question?
      *   *Fix:* Make sure to explicitly state in the preamble that determinism is irrelevant to the audit.
      *   *Critique:* Is the repetition count clear?
      *   *Fix:* Define "Loop Threshold" clearly.
      *   *Critique:* How do I handle the "Harm" constraint?
      *   *Fix:* Add a "Safe-to-Fail" clause in the testing protocol.
      *   *Critique:* The user asked to know what philosophy was dropped.
      *   *Fix:* Add a specific section "Philosophical Plumbing."
      *   *Critique:* The user wants to know what the procedure *can't* do.
      *   *Fix:* Add a "Limitations & Blind Spots" section at the end.

  7.  **Final Polish:**

      *   Ensure the distinction between "Sphexishness" (bug) and "Entrenchment" (feature) is sharp. This is the core of the QA vs. Compliance fight.
      *   Make sure the "Handoff to Human" step is clear—that's where the risk appetite lives.
      *   Check the Case 2 analysis carefully. If humans *know* it will fail but do it anyway because of the playbook, is the *human* sphexish? No, the *process* makes them act sphexish. The audit should target the playbook.

  8.  *(Final check against prompt requirements)*
      *   Repeatable rigidity audit? Yes.
      *   Questions/tests in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points (fine/broken/handoff)? Yes.
      *   Philosophy kept/dropped explicit? Yes.
      *   Handle repetition count? Yes.
      *   Handle harm constraint? Yes.
      *   Handle agent vs. scaffolding vs. tester? Yes.
      *   Handle deliberate entrenchment? Yes.
      *   Handle anthropomorphism? Yes.
      *   Free-will debate addressed? Yes.
      *   Run on 3 cases? Yes.
      *   Limitations section? Yes.
      *   No reading list? Yes.

      *Ready to write.*
answer: |-
  # The Rigidity Audit (v1.0)

  **Purpose:** To distinguish between *functional entrenchment* (compliance features) and *sphexishness* (operational bugs) in customer-facing systems (human or automated).
  **Owner:** Customer Operations.
  **Stakeholders:** QA Lead, Compliance Signatory.
  **Philosophical Basis:** Functionalism (Dennett/Tinbergen). Metaphysical free will is explicitly excluded as operationally irrelevant.

  ---

  ## Part 1: Philosophical Plumbing (What We Kept and Dropped)

  To make this usable, we had to strip the philosophy of its metaphysical baggage.

  *   **Kept:** The definition of **Sphexishness as Information Blindness**. A system is sphexish not because it is determined, but because it fails to register *relevant* changes in its environment that its own goals suggest it should care about. The wasp isn't "unfree"; it is blind to the fact that the cricket moved.
  *   **Kept:** The **Loop Criterion**. Sphexishness is only visible under repetition of a perturbation. A single failure is a glitch; a loop is a design feature (or bug).
  *   **Dropped:** **Determinism vs. Free Will.** Whether the bot or the human "could have done otherwise" in a cosmic sense is decoration. We only care if they *would* have done otherwise given the correct input.
  *   **Dropped:** **Anthropomorphism.** We do not judge the bot by whether it acts like a "person." We judge it by whether it acts like a *successful agent* within its specific design constraints. A lock is rigid, but not sphexish, because its goal is to *not* open.

  ---

  ## Part 2: The Audit Procedure

  Run this sequence for any escalated complaint, playbook revision, or automation release.

  ### Step 1: Define the Goal Hierarchy
  **Question:** What is the primary success condition for this interaction?
  **Test:** List the top two goals in order of priority.
  *   *Example:* 1. Regulatory Compliance (do not promise unauthorised plans). 2. Debt Resolution (secure payment).
  **Sufficient Answer:** A ranked list agreed upon by QA and Compliance *before* testing begins.
  **Stop Condition:** If stakeholders cannot agree on the hierarchy, **HANDOFF TO HUMAN**. This is a risk-appetite decision, not a factual one.

  ### Step 2: Identify the Perturbation
  **Question:** What specific input changed that the system ignored?
  **Test:** Isolate the variable. (e.g., "Customer proposed Friday" vs. "Customer proposed Monday").
  **Sufficient Answer:** A clear delta in input data.
  **Stop Condition:** If the input didn't actually change (e.g., customer said the same thing twice), **STOP: NOT RIGID**. This is user error or noise.

  ### Step 3: The Relevance Filter (The Compliance Veto)
  **Question:** Is the system *supposed* to ignore this perturbation?
  **Test:** Check the Playbook/Compliance Rules. Does the rule explicitly state "Do not consider variable X"?
  *   *Yes:* The rigidity is **Entrenchment (Feature)**. Stop.
  *   *No:* The rigidity is **Potential Sphexishness (Bug)**. Proceed to Step 4.
  **Note:** This is where Compliance usually wins. If the rule says "Ignore off-script dates," the bot is working as intended. If the rule says "Assess affordability," ignoring a date change may violate the rule.

  ### Step 4: The Loop Threshold (Repetition Count)
  **Question:** How many times must the system ignore the perturbation to be declared broken?
  **Test:** Re-run the perturbation in a sandbox/simulation.
  **Threshold:** **3 Consecutive Failures.**
  *   *Rationale:* One is a glitch. Two is coincidence. Three is a loop (Tinbergen's criterion).
  **Harm Constraint:** If running this test on a live customer causes harm (financial/psychological):
  *   **Action:** Run in "Shadow Mode" (parallel testing on historical data) or use a "Red Team" actor. Do not test on vulnerable live customers.
  **Sufficient Answer:** 3 reproductions of the loop in a safe environment.
  **Stop Condition:** If you cannot reproduce the loop 3 times safely, **STOP: INSUFFICIENT DATA**. Flag for monitoring, do not declare broken.

  ### Step 5: Locus of Rigidity (Agent vs. Scaffolding)
  **Question:** Where does the loop actually live?
  **Test:** Swap the components.
  *   *If Bot:* Change the prompt/context window. Does it still loop?
  *   *If Human:* Give them a different script or tool. Do they still loop?
  *   *If Tester:* Change the person reporting the bug. Do they see the same loop?
  **Sufficient Answer:** Identification of the component holding the state.
  **Stop Condition:** If the rigidity is in the **Tester** (e.g., they keep asking the same question the same way expecting a different result), **STOP: TESTER SPHEXISHNESS**.

  ### Step 6: The Handoff (Risk Appetite)
  **Question:** We have confirmed the system ignores relevant info (Step 3) in a loop (Step 4). Is the cost of fixing it higher than the cost of the error?
  **Test:** Compare "Cost of Flexibility" (Compliance risk, audit trail break) vs. "Cost of Rigidity" (Ombudsman referrals, churn, default).
  **Sufficient Answer:** A signed decision by the **Operations Director** (you).
  **Stop Condition:** This step cannot be automated. It is the definition of your risk appetite.

  ---

  ## Part 3: Application to Current Cases

  ### Case 1: The Bot Off-Script Loop
  *   **Context:** Bot repeats 3 sentences when customer asks to pay next Friday. 40 contacts/month. 2 Ombudsman referrals.
  *   **Audit Run:**
      1.  **Goal:** 1. Compliance, 2. Resolution.
      2.  **Perturbation:** "Next Friday" vs. "Today".
      3.  **Relevance:** Does the playbook forbid Friday payments? If no, this is **Relevant**.
      4.  **Loop:** 40 contacts confirms >3 repetitions.
      5.  **Locus:** Bot logic (recovers when human re-phrases, proving the *intent* was parseable, just not the *syntax*).
      6.  **Handoff:** Cost of Rigidity (2 Ombudsman referrals) > Cost of Flexibility (minor NLP tuning).
  *   **Verdict:** **BROKEN (Sphexish).**
  *   **Action:** The bot is blind to semantic equivalence. This is not entrenchment; it is a parsing failure. Fix the NLP layer to map "Friday" to the existing payment plan variable.

  ### Case 2: Human Advisers & The Payment Break
  *   **Context:** Advisers decline breaks not on the list, knowing customer will default. "Let them improvise" is not allowed.
  *   **Audit Run:**
      1.  **Goal:** 1. Compliance (follow list), 2. Resolution (prevent default).
      2.  **Perturbation:** Customer situation is dire but *not* on the enumerated list.
      3.  **Relevance:** **CRITICAL JUDGEMENT CALL.** Compliance says "Ignore it (Entrenchment)." QA says "It matters (Sphexishness)."
      4.  **Loop:** Advisers do this every time.
      5.  **Locus:** **The Playbook, not the Human.** The humans are acting as the wasp, but they are being *made* to act that way by the scaffolding. They are not sphexish; the *policy* is.
      6.  **Handoff:** You must decide if "Prevent Default" is actually Goal 2, or if "Follow List" is the only goal.
  *   **Verdict:** **ENTRENCHMENT (Feature), but potentially Misaligned.**
  *   **Action:** This is not a bot bug. This is a policy conflict. The audit reveals that your Compliance Goal 1 is actively destroying your Operations Goal 2. You cannot fix this by telling advisers to improvise (violates Step 3). You must escalate to the Board/Risk Committee to update the Playbook. The advisers are not the problem; the list is.

  ### Case 3: Dunning Letter Sequence
  *   **Context:** Dumb workflow automation. Assumed rigid by design. Never tested.
  *   **Audit Run:**
      1.  **Goal:** 1. Debt Recovery, 2. Regulatory Fairness (don't threaten if paid).
      2.  **Perturbation:** Customer pays mid-sequence.
      3.  **Relevance:** **High.** Sending a threat after payment is a regulatory breach.
      4.  **Loop:** Unknown. Nobody has tested it.
      5.  **Locus:** Workflow Scaffolding.
      6.  **Handoff:** N/A until tested.
  *   **Verdict:** **UNKNOWN RISK.**
  *   **Action:** The Audit *must* apply here. The assumption "it's rigid by design" is dangerous. Rigidity in dunning is acceptable *unless* the state changes (payment received).
      *   **Test:** Simulate a payment at T+1, T+2, T+3 of the letter sequence.
      *   **If it stops:** It is **Entrenched Safely**.
      *   **If it continues:** It is **Sphexish** and a regulatory time-bomb.
      *   **Why the Audit applies:** It forces you to ask "What perturbation should stop this?" before a complaint forces you to.

  ---

  ## Part 4: Limitations & Blind Spots

  Be explicit with your QA and Compliance leads about what this tool cannot do.

  1.  **It Cannot Solve Value Conflicts:** Step 6 (The Handoff) is where the QA/Compliance fight actually lives. The audit identifies *that* there is a conflict (e.g., Case 2), but it cannot resolve it. It forces you to sign for the risk.
  2.  **It Misses "Slow" Sphexishness:** This audit tests loops. It does not easily catch systems that work fine for 100 interactions but fail on the 101st due to context-window drift or cumulative error. You need separate monitoring for degradation.
  3.  **It Relies on Accurate Goal Mapping:** If you write down "Goal 1: Compliance" but the business actually rewards "Goal 1: Revenue," the audit will give you false positives. It tests the system against the *stated* goals, not the *real* incentives.
  4.  **It Will Cry Wolf on "Necessary Friction":** Sometimes we want the system to be hard to use (e.g., cancelling a service). The audit might flag this as "failure to accommodate user intent." You must mark these flows as "Defensive Design" in Step 1 to exempt them.
  5.  **It Is Not a Substitute for Empathy:** The audit treats customer distress as "environmental perturbation." This is necessary for operations but dangerous for culture. Do not let your team start calling vulnerable customers "noise."

  **Final Instruction:** Print this. Put it in the change control workflow. If QA or Compliance wants to block a release or flag a complaint, they must fill out the Step 1-6 sheet. If they leave Step 6 blank, the default decision is **Status Quo**.
