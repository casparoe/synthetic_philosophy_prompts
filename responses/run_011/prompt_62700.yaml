  4. When they claim hallucinations have nothing whatever in common with perceptions, clarify that disjunctivism denies only a fundamental common *kind* of mental state, not shared neurological causes or subjective character.

  5. Ask them to identify which premise allows the move from 'looks the same' to 'is the same kind of state,' and state aloud that you are deliberately leaving out the positive metaphysical account of what perception actually is.
