answer: |-
  This is a splendid question that cuts to the heart of how we model strategic uncertainty. It is a common point of confusion, because on the surface, your geometric intuition is sound, yet your professor is stating a standard result found in most advanced texts.

  The short answer is: **Your professor is right, but your understanding of Pearce's Lemma is not entirely wrong.** You have correctly identified the geometry of the lemma itself, but you have likely overlooked a subtle restriction in the definition of *rationalizability* that is standard in most courses.

  Here is the breakdown of why the equivalence holds for two players but fractures for three or more, the missing ingredient, and the conceptual cost involved.

  ### 1. The Geometry of Pearce's Lemma
  You are correct that Pearce's Lemma (1984) is fundamentally a geometric statement about convex sets. It states that a pure strategy is strictly dominated (by a mixed strategy) if and only if it is **never a best response** to any belief over the opponents' strategy profiles.

  Crucially, this lemma holds for **any number of players**. The geometry of convex combinations does not change when you add a third player. If a strategy is not a best response to *any* probability distribution over the opponents' profiles, it is strictly dominated. Conversely, if it is not strictly dominated, there exists *some* belief to which it is a best response.

  So, if we stop at a single round of elimination, your intuition is perfect: the set of undominated strategies is identical to the set of best responses to *some* belief.

  ### 2. Where the Equivalence Breaks ($n \ge 3$)
  The divergence arises when we iterate the procedure to define the solution concept of **Rationalizability**. The issue lies in what constitutes a permissible "belief".

  *   **In Iterated Elimination of Strictly Dominated Strategies (IESDS):** We simply ask if a strategy is dominated. By Pearce's Lemma, this is equivalent to asking if it is a best response to *any* belief $\mu \in \Delta(S_{-i})$. This belief is a probability distribution over the *joint* profiles of the opponents. It allows for **correlated beliefs**. Player 1 might believe that Player 2 and Player 3 are coordinating their moves, even without communication.
  *   **In Rationalizability:** Here is the rub. While Pearce's original paper allowed for correlated beliefs, the standard definition (often attributed to Bernheim, 1984, and adopted in many courses) imposes an **independence assumption**. It requires that a player's belief about the opponents be a **product measure**. That is, Player 1 must believe that Player 2's choice is stochastically independent of Player 3's choice.

  **The Two-Player Case:**
  With only two players, a belief for Player 1 is simply a distribution over Player 2's strategies. There is no "joint profile" of multiple opponents to correlate. Therefore, the set of all beliefs is identical to the set of independent beliefs. Consequently, IESDS and Rationalizability are equivalent.

  **The Three-Player Case:**
  With three players, Player 1 forms a belief over the pair $(s_2, s_3)$.
  *   The set of all beliefs is the simplex $\Delta(S_2 \times S_3)$.
  *   The set of independent beliefs is the product $\Delta(S_2) \times \Delta(S_3)$.
  *   The product space is a strict subset of the simplex.

  There are beliefs in the simplex (correlated) that are not in the product space (independent). A strategy might be a best response to a *correlated* belief (surviving IESDS) but not to any *independent* belief (eliminated by Rationalizability). Thus, for $n \ge 3$, the set of rationalizable strategies (under the independence assumption) is a subset of the strategies surviving IESDS, and the inclusion can be strict.

  ### 3. A Concrete Illustration
  Imagine a three-player game where Player 1 wins only if Players 2 and 3 match their actions (both Left or both Right).
  *   If Player 1 believes P2 and P3 are correlated (e.g., a 50% chance of $L,L$ and 50% chance of $R,R$), then playing "Match" is a best response.
  *   However, if Player 1 must believe P2 and P3 are independent, and P2 and P3 are mixing 50/50, the probability of matching is only 50% ($0.5 \times 0.5 + 0.5 \times 0.5$). Depending on the payoffs, "Match" might no longer be a best response under the independence constraint, even though it is not strictly dominated.

  In this scenario, "Match" survives IESDS (because the correlated belief exists) but is eliminated by Independent Rationalizability. The procedures have come apart.

  ### 4. The Missing Ingredient and Conceptual Cost
  The missing ingredient is the **assumption of independent beliefs**.

  **Why impose it?**
  The philosophical justification for independent rationalizability is that without a mechanism for correlation (like a communication device or a common signal), players should not assume their opponents' randomisations are linked. It treats uncertainty about each opponent as distinct.

  **What is the conceptual cost?**
  By imposing independence, you rule out the possibility that opponents might act in a correlated fashion due to:
  1.  **Common Priors:** Opponents might react to the same unobserved environmental variable (a "sunspot").
  2.  **Focal Points:** Cultural or contextual factors might synchronise their behaviour.
  3.  **Learning:** In repeated settings, players might learn to correlate their actions.

  If you use Independent Rationalizability, you are making a stronger assumption about the players' epistemic states. You are asserting that players not only know the game and know others are rational, but they also *know* that others' strategies are independent. This is a significant epistemic leap.

  Pearce's original formulation (allowing correlation) is often considered more robust precisely because it avoids this assumption. However, many professors teach the Bernheim (independent) version because it yields sharper predictions and aligns with the Nash Equilibrium assumption of independent mixing.

  ### 5. Regarding Weak Dominance
  You asked if your professor might be thinking of weak dominance. While it is true that order matters for weak dominance, that is not the source of the discrepancy here. The divergence between IESDS and Rationalizability for $n \ge 3$ occurs specifically with **strict** dominance when the independence constraint is applied to rationalizability. So, while your intuition on weak dominance was sensible, it is not the culprit in this specific theoretical puzzle.

  ### Summary
  Your professor is correct within the context of standard **Independent Rationalizability**.
  *   **Pearce's Lemma** holds for any $n$: Strictly Dominated $\iff$ Never a Best Response to *any* belief.
  *   **IESDS** eliminates strategies that are never a best response to *any* belief (correlated allowed).
  *   **Rationalizability** (standard/Bernheim) eliminates strategies that are never a best response to any *independent* belief.
  *   For $n=2$, "any belief" = "any independent belief".
  *   For $n \ge 3$, "any independent belief" $\subset$ "any belief".

  You were right about the geometry of the lemma, but the solution concept of Rationalizability adds an epistemic constraint (independence) that restricts that geometry when there are multiple opponents to form beliefs about. It is a subtle distinction, but a vital one in advanced game theory.

  I hope this clears up the matter for you. It is a sophisticated point, and realising the nuance puts you in good stead for the rest of the course.
