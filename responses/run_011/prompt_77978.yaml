answer: |-
  The prosecution of Dražen Erdemović presents a collision between high-altitude metaphysics and the blood-soaked ground of international criminal law. The philosophical dispute concerns whether moral responsibility requires the ability to do otherwise (the Principle of Alternate Possibilities, or PAP) or whether it requires only that the action issue from the agent's own reasons-responsive mechanism (the Compatibilist/Actual Sequence view). The legal dispute concerns whether duress excuses the killing of innocents or merely mitigates punishment. By running the case through the lens of Frankfurt-style compatibilism and the three stipulated concepts, we can assess not only Erdemović's culpability but the adequacy of the philosophical apparatus itself.

  ### I. Mapping the Actual Sequence

  To apply the compatibilist lens, we must first map the case onto the taxonomy of control.

  **The Agent:** Dražen Erdemović, a soldier embedded in a hierarchical command structure.
  **The Alternatives:**
  1.  **Shoot:** Comply with the order, kill approximately 70 victims, survive.
  2.  **Refuse:** Decline the order, hand over rifle, be executed by his own unit, replaced by another shooter, victims still die.
  **Robustness:** Under the PAP, Alternative 2 must be a robust alternative to ground responsibility. Here, Alternative 2 is *morally* robust (it preserves his moral integrity) but *causally* futile regarding the victims (1,200 die either way). Under the "robustness" constraint often added to save PAP, an alternative counts only if it is relevant to the agent's credit or blame. Refusal would have saved no one; thus, the alternative lacks the specific robustness required to negate the harm, though it retains the robustness required to preserve the agent's life.
  **The Actual Sequence:** The commander issues a threat $\to$ Erdemović deliberates (weighing self-preservation against moral prohibition) $\to$ Erdemović chooses self-preservation $\to$ Erdemović shoots.
  **The Mechanism:** Practical reasoning under extreme coercion. The question for the compatibilist is whether this mechanism was *moderately reasons-responsive*. Did it recognize moral reasons? Yes, evidenced by his resistance and later remorse. Did it react to them? No, it was overridden by the threat to life.
  **Remorse as Evidence:** Erdemović's later confession and remorse are evidence that the mechanism *is* capable of tracking moral reasons. However, using present remorse to constitute past guilt is problematic. It shows the capacity for guidance control exists *now*, but does not prove the mechanism was sufficiently reasons-responsive *then*. It suggests the mechanism was intact but overwhelmed, supporting the compatibilist view that the capacity (guidance control) remained even if the output was constrained.

  ### II. Analysis of Stipulated Concepts

  **(a) Deliberatively Live Impossibility**
  I define an impossibility as *deliberatively live* when the closure of alternatives is communicated to the agent and enters their reasoning as a premise, rather than remaining a hidden structural fact. In standard Frankfurt cases, the counterfactual intervener (Black) is undetectable; Jones deliberates exactly as if he were free. In Erdemović's case, the "intervener" (the commander) announced the closure: "Shoot or die."

  This difference is philosophically load-bearing. The Frankfurt strategy relies on the intuition that Jones is responsible because he acted on his *own* desires without interference. Erdemović did not act on his own desires in the same sense; he acted on a desire to avoid death imposed by an external threat. The "live" nature of the impossibility transforms the case from one about *freedom* to one about *coercion*. In Frankfurt cases, the agent is free in the actual sequence; in Erdemović's case, the agent is unfree in the actual sequence because the threat itself is a reason that distorts the deliberative field. If compatibilism claims responsibility tracks the actual sequence, it must account for sequences where the inputs are coercive threats. The "live" impossibility suggests that the *source* of the constraint matters. A hidden blocker preserves the agent's sense of authorship; an announced threat undermines it. This weakens the Frankfurt analogy: Erdemović is not a Jones who happened to choose rightly; he is a Jones who was told the cost of choosing wrongly.

  **(b) Redundancy**
  I define a case as *redundant* when the alternative sequence is already occupied—when doing otherwise changes nothing for anyone but the agent. Erdemović's case is redundant in the precise Frankfurt sense: another shooter was available. Refusal changes the corpse count by one (Erdemović instead of a victim) but leaves the 1,200 victims dead.

  Is the real instance stronger or weaker evidence for the compatibilist than the constructed one? It is weaker. In a Frankfurt case, the redundancy is metaphysically stipulated: Black *will* intervene. In Erdemović's case, the redundancy is empirical and contingent on the commander's credibility. The compatibilist argument rests on the claim that because the outcome is fixed, the alternative is irrelevant to responsibility. But in the real world, the agent cannot know the redundancy is absolute. He must assess the credibility of the threat. If the commander was bluffing, the alternative was not occupied. The tribunal never made a finding of fact on this. Therefore, the real case introduces an epistemic uncertainty that the philosophical case eliminates. The compatibilist relies on the *fact* of redundancy to dismiss the alternative; the agent acts on the *belief* in redundancy. If the belief is false, the actual sequence changes. This makes the real case a weaker foundation for the theory because the theory requires certainty about the actual sequence that the historical record does not provide.

  **(c) Liability vs. Imposition**
  I distinguish responsibility as *liability* (attribution of the act to the agent, grounding a verdict of guilt) from responsibility as *imposition* (the quantum of punishment exacted). The ICTY verdict was full liability (guilty plea accepted) with heavy mitigation on imposition (sentence reduced from 10 to 5 years, early release).

  Does a framework built to answer a yes-or-no question about attribution have resources for this shape? Standard PAP vs. Frankfurt debates are binary: either you could have done otherwise (or have guidance control) or you didn't. Responsibility is typically treated as an on/off switch. The Erdemović verdict suggests responsibility is scalar. The court affirmed liability (you are the source of the killing) but discounted imposition (your control was compromised). This suggests the operative question was never strictly about alternate possibilities. If PAP were the deciding factor, the dissent (duress as a complete defense) would have won: if he couldn't do otherwise, he is not liable. If Compatibilism were the deciding factor, the majority wins: he had guidance control, so he is liable. But the mitigation acknowledges that the *degree* of control mattered. The shape of the verdict implies that while *sourcehood* (was it you?) determines liability, *leeway* (how hard was it to choose otherwise?) determines imposition. A pure actual-sequence theory struggles to explain why the *absence* of alternatives (if real) should reduce punishment if it doesn't negate responsibility. It implies that alternate possibilities, while perhaps not necessary for liability, are relevant to the *degree* of blame.

  ### III. Theory $\to$ Man: What the Theory Says About Erdemović

  **The Incompatibilist (PAP) View:**
  If the threat was real and irresistible, Erdemović could not have done otherwise without sacrificing his life. On a strict PAP account, he bears no moral responsibility for the killings. The dissenting judges at the ICTY approximated this view: where refusal saves no one and costs the agent his life, the coercion excuses entirely. On this view, the guilty plea was a legal pragmatic, not a moral admission.

  **The Compatibilist (Actual Sequence) View:**
  Erdemović possessed guidance control. He deliberated. He weighed the moral reason (do not kill) against the prudential reason (do not die). He chose the latter. The mechanism was reasons-responsive (he recognized the moral reason) but not all-things-considered responsive (the threat outweighed it). Therefore, he is morally responsible. The majority judges approximated this: duress mitigates but does not excuse. The act is attributed to him because it flowed from his own reasoning process, even if that process was constrained.

  **The Role of Remorse:**
  Compatibilism can utilize Erdemović's later remorse to confirm that the mechanism was indeed his own. If he were a mindless automaton, remorse would be incoherent. His remorse confirms he was a moral agent capable of recognizing the wrong, reinforcing the attribution of liability. However, it does not explain the mitigation.

  ### IV. Man $\to$ Theory: What Erdemović Does to the Theory

  **The Problem of the Live Impossibility:**
  Erdemović exposes a gap in the Frankfurt strategy. Frankfurt cases are designed to show that *alternative possibilities* are irrelevant because the agent acts freely in the actual sequence. But Erdemović's actual sequence contains an *announced threat*. This is not a case of an agent acting freely without alternatives; it is a case of an agent acting under a specific type of causal pressure that enters deliberation. The theory claims responsibility tracks the actual sequence, but it often assumes the actual sequence is "normal." Erdemović forces the theory to admit that some actual sequences (those involving coercive threats) diminish responsibility even if guidance control is present. The theory must distinguish between internal constraints (phobias, addictions) and external coercive threats that are deliberatively live. If it cannot, it fails to capture why we mitigate punishment in duress cases.

  **The Problem of Empirical Uncertainty:**
  The Frankfurt strategy works by stipulation. We *know* Black is there. In Erdemović's case, we do not *know* the commander would have killed him. The tribunal reasoned on the *assumption* that the threat was real. This undermines the compatibilist claim that responsibility depends on the *actual* sequence. If the threat was a bluff, the actual sequence is one of a man choosing to kill when he could have refused safely. If the threat was real, it is one of a man choosing to kill to survive. The moral status of the agent shifts dramatically based on an empirical fact the tribunal left unresolved. The philosophical theory demands a metaphysical certainty about the actual sequence that legal fact-finding often cannot supply. This suggests the theory is ill-suited for practical judgment where the "actual sequence" is epistemically opaque.

  **The Problem of the Verdict Shape:**
  The split verdict (Guilty + Mitigation) challenges the binary nature of the PAP/Frankfurt debate. The debate asks: "Is he responsible?" The law answered: "Yes, but less so." This implies that the presence or absence of alternate possibilities is not a threshold condition for responsibility, but a scalar variable affecting the *intensity* of blame. The compatibilist apparatus, focused on establishing the *basis* of responsibility (guidance control), has little to say about the *gradation* of responsibility once guidance control is established. It explains the conviction but struggles to explain the discount without importing leeway considerations back in.

  ### V. The Unadjudicated Threat and the Frankfurt Strategy

  The most damaging feature of the case for the compatibilist is that the closure of alternatives was never adjudicated. The Frankfurt strategy relies on the *truth* of the counterfactual: "If you had chosen otherwise, I would have intervened." In Erdemović's case, this is an empirical claim about another person's credibility.

  If the threat was a bluff, Erdemović had robust alternatives. If he believed it was real but it was false, he acted under a mistake. If it was real, he acted under duress. The compatibilist argues that responsibility depends on the *actual* mechanism, not the alternatives. But in duress cases, the *nature* of the mechanism is defined by the reality of the threat. A mechanism processing a real death threat is different from a mechanism processing a bluff. Because the tribunal could not determine this, they could not determine the nature of the actual sequence. They had to assume the threat was real to apply the legal standard. This reveals that the Frankfurt strategy, which bypasses alternatives to focus on the actual sequence, is vulnerable in real-world cases where the actual sequence includes the *belief* in closed alternatives. The psychological impact of the threat (which drives the mitigation) operates regardless of its truth, but the moral justification for the mitigation (coercion vs. choice) depends on its truth. The theory cannot resolve this because it treats the actual sequence as a given, whereas in law, the actual sequence is the object of inquiry.

  ### VI. Verdict

  Does this episode support compatibilism, incompatibilism, or orthogonality?

  It shows that the dispute over alternate possibilities is largely **orthogonal** to what doctrines of duress are actually deciding.

  The PAP/Compatibilist debate asks a metaphysical question: *Could he have done otherwise, and does it matter?* The ICTY, like most legal systems, is deciding a normative question: *What can we reasonably demand of a citizen under threat?*

  The Majority ruling (duress is mitigation, not defense) is not a metaphysical claim that Erdemović "could have done otherwise" in a robust libertarian sense. It is a policy claim that the protection of innocent life outweighs the agent's self-preservation, regardless of the coercive pressure. The Dissent (duress is a defense) is not necessarily a commitment to incompatibilism; it is a claim that the law cannot demand martyrdom.

  The shape of the verdict—full liability with heavy mitigation—implicates neither pure sourcehood nor pure leeway accounts exclusively. It implicates a **Normative Demand Account** of freedom. Freedom, in this legal context, is not the metaphysical capacity to do otherwise, nor merely the actual-sequence guidance control. It is the *expectation of compliance*. The court affirmed that Erdemović was the source of the act (sourcehood/compatibilism) but acknowledged that the circumstances made compliance with the moral law excessively demanding (leeway/incompatibilism intuition).

  The episode demonstrates that the philosophical binary (Responsible vs. Not Responsible) fails to capture the legal reality (Guilty but Excused in Part). The "Deliberatively Live" impossibility matters not because it closes the alternative, but because it alters the normative relationship between the state and the soldier. The "Redundancy" matters not because it fixes the outcome, but because it renders the sacrifice futile.

  Ultimately, the Erdemović case suggests that moral responsibility in law is not a switch triggered by the presence of alternatives or the purity of the actual sequence. It is a scalar assessment of the agent's position within a network of demands. The compatibilist apparatus explains why he was convicted (he acted on his reasons), but it is silent on why he was released early (the weight of those reasons was distorted by threat). The incompatibilist explains the impulse to excuse, but fails to account for the conviction. The dispute over alternate possibilities is orthogonal because the law is not measuring freedom; it is calibrating demand. The freedom implicated is not the freedom to do otherwise, but the freedom from being placed in a position where doing otherwise is impossible. Erdemović was not punished for lacking freedom; he was punished for being the instrument of a crime, but forgiven for the lack of freedom that made him an instrument.
