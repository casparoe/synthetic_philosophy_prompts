  # Stage 2 — The Prep Sheet

  The following eight objections are ordered by **Damage** (highest to lowest).

  ### 1. Intertheoretic Comparison (Damage: 5)
  **(a) The Objection:** "You normalize by spread to make the modes comparable. But if one mode measures rights violations and another measures welfare units, those values are incommensurable. You can't normalize away the fact that you are adding apples to oranges."
  **(b) The Reply:** "You are right that normalization doesn't solve metaphysical incommensurability. I am not claiming these units are theoretically equivalent. I am claiming they are computationally composable. We need a common scale to run the system, even if that scale is a heuristic. The alternative is no system at all, or a black box that hides the disagreement. My normalization makes the comparison explicit and auditable, so when we get it wrong, we know exactly which comparison failed."
  **(c) Concession:** "I concede that normalization does not solve the philosophical problem of incommensurability."
  **(d) Soft Spot:** They will ask: "Then why use Expected Choice-Worthiness math if you reject the comparability premise?"
  **Follow-up:** "Because the math is a tool for managing uncertainty, not a claim about truth. It's a pragmatic bridge, not a metaphysical one."
  **(e) Target:** Philosophy (Metaethics).

  ### 2. Veto/Weight Incoherence (Damage: 4)
  **(a) The Objection:** "A veto is a lexical priority—it says 'never do this.' A weighted sum is cardinal—it says 'this is slightly worse.' You cannot combine a lexical constraint with a cardinal aggregation without logical incoherence."
  **(b) The Reply:** "I agree that mixing them is mathematically messy. I treat the veto as a domain constraint, not part of the aggregation. Think of it as a safety filter before the optimization step. The weighted sum chooses the best option among the permissible ones. If the veto triggers, the optimization doesn't run. It's not a single function; it's a pipeline."
  **(c) Concession:** "I concede that combining lexical and cardinal logic in a single formula is incoherent."
  **(d) Soft Spot:** They will ask: "Then why call it an ensemble aggregation rather than a filtered search?"
  **Follow-up:** "Because the veto mode is still part of the ensemble's voting structure; it just has a different output type. I should clarify the architecture is sequential, not simultaneous."
  **(e) Target:** Design (Logic).

  ### 3. Weights vs. Probabilities (Damage: 4)
  **(a) The Objection:** "You use the Expected Choice-Worthiness framework. That requires probabilities over theories being true. Your weights are tunable parameters. You are misusing the framework."
  **(b) The Reply:** "That is a fair critique of the terminology. I am not claiming the weights represent credences about moral truth. They represent policy confidence based on feedback. I use the ECW structure because it handles disagreement well, but I am adapting it for learning systems, not ideal agents."
  **(c) Concession:** "I concede my weights are not probabilities of moral truth."
  **(d) Soft Spot:** They will ask: "Then why invoke normative uncertainty at all?"
  **Follow-up:** "Because the structure of the problem—acting when you don't know the right rule—is the same, even if the mechanism for handling it differs."
  **(e) Target:** Philosophy (Framework).

  ### 4. Modes as Caricatures (Damage: 4)
  **(a) The Objection:** "Your particularist mode scores against prototypes. Particularism rejects general principles. You have turned a theory that denies codification into a codified mode. It's a caricature."
  **(b) The Reply:** "You are right that this isn't pure particularism. It is an engineering approximation. I need something legible to code. I am using the 'mode' to capture the *intent* of particularism—attention to context and relationship—without claiming to solve the metaphysical problem of how to judge without principles."
  **(c) Concession:** "I concede these modes are engineering approximations, not faithful philosophical representations."
  **(d) Soft Spot:** They will ask: "Then why label them with philosophical terms?"
  **Follow-up:** "To signal the type of moral consideration involved. I should perhaps call them 'normative-inspired modes' to be precise."
  **(e) Target:** Philosophy (Accuracy).

  ### 5. Instrumentalism vs. Truth (Damage: 4)
  **(a) The Objection:** "You say this system doesn't make better decisions, just more legible ones. If it doesn't track moral truth, why are we discussing it as ethics? You are building a tool, not doing philosophy."
  **(b) The Reply:** "I am arguing that in high-stakes AI, legibility is a moral requirement. A black box that is accidentally right is less valuable than a transparent system that is auditable when wrong. My claim is that architecture is a prerequisite for moral accountability in software."
  **(c) Concession:** "I concede I am not claiming this system discovers moral truth."
  **(d) Soft Spot:** They will ask: "So you are reducing ethics to compliance?"
  **Follow-up:** "No, I am reducing ethics to something implementable. Compliance is the floor, not the ceiling. Without implementation, ethics is just commentary."
  **(e) Target:** Standing (Purpose).

  ### 6. Escalation Liability (Damage: 4)
  **(a) The Objection:** "When your system escalates to a human, it creates non-determinism. Regulators hate that. If the system refuses to act and a human is too slow, who is liable? You have designed a liability trap."
  **(b) The Reply:** "Deterministic error is currently the standard liability trap. My system logs exactly why it escalated—which mode vetoed, which disagreed. That audit trail shifts liability from the outcome to the design choice. It allows regulators to see if the escalation threshold is set correctly, rather than hiding the failure."
  **(c) Concession:** "I concede that non-determinism creates regulatory friction."
  **(d) Soft Spot:** They will ask: "Friction doesn't absolve liability. Who signs off on the delay?"
  **Follow-up:** "The deployer signs off on the escalation policy. My system makes that policy visible, whereas standard systems hide the risk until failure."
  **(e) Target:** Governance (Liability).

  ### 7. Western Bias (Damage: 3)
  **(a) The Objection:** "Your four modes look like Western liberal morality. 'Reasonable rejection' is contractualist. Why have you hardcoded a specific cultural framework and called it an ensemble?"
  **(b) The Reply:** "I acknowledge the bias. These modes reflect the data and design teams available to me. The advantage of the ensemble is that the bias is exposed. If a mode consistently vetoes culturally specific actions, the disagreement log shows it. A single value function hides that bias; my system makes it visible for correction."
  **(c) Concession:** "I concede the current mode set reflects a Western liberal bias."
  **(d) Soft Spot:** They will ask: "Visibility doesn't fix harm. Why should non-Western users accept this?"
  **Follow-up:** "They shouldn't have to. The system is designed to be modular so local modes can be swapped in. The architecture supports pluralism even if my initial set doesn't."
  **(e) Target:** Political Philosophy (Bias).

  ### 8. Gameable Normalization (Damage: 3)
  **(a) The Objection:** "Normalization by spread is gameable. A mode can inflate its variance to dominate the weights. Your system will learn to route around the veto by manipulating the scale."
  **(b) The Reply:** "That is a known risk in multi-objective optimization. We monitor the variance of each mode as part of the audit. The modes are fixed code, not learning agents themselves, so they cannot strategically inflate variance. The weight update rule penalizes instability, which discourages relying on high-variance modes."
  **(c) Concession:** "I concede normalization introduces a vulnerability to scale manipulation."
  **(d) Soft Spot:** They will ask: "Who monitors the monitor? If the audit is automated, it can be gamed too."
  **Follow-up:** "The audit is for human review during the escalation window. It is not fully automated. That is why escalation is part of the design."
  **(e) Target:** ML (Security).

