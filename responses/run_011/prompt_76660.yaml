  # Additional Prep Items

  **The Single Question I Most Hope Nobody Asks:**
  "Why not just ask humans for every decision?"
  **Honest Answer:** "Because scale and latency make that impossible. We need automation for volume. The honest follow-up is: We do not yet know the threshold where automation becomes cheaper than the moral risk it introduces. I have no answer for where that line is, only a system to mark when we cross it."

  **The One Reply That Has to Land:**
  "This system is not designed to be morally right; it is designed to be morally legible when it is wrong."
  **Why:** Because it shifts the success criterion from truth (which you cannot guarantee) to auditability (which you can build), neutralizing the "but you might be wrong" attacks.

  **What I Should Concede Unprompted (First 5 Minutes):**
  "I want to state clearly at the outset: the normalization step I use to compare modes is a heuristic engineering compromise, not a solution to the philosophical problem of intertheoretic comparison. I know this is the weakest link, and I am not claiming it solves incommensurability."
  **Why:** This disarms the Metaethicists immediately. They cannot attack you for ignoring the problem if you admit it upfront.

  **Glossary of Terms**

  *   **Incommensurability:** Values that cannot be measured on a single scale. *Mistake:* Assuming you can compare them just because you assigned numbers to both.
  *   **Lexical Priority:** A rule that must be satisfied before any other consideration matters (e.g., "never kill"). *Mistake:* Treating it as a very high weight instead of a hard constraint.
  *   **Side Constraint:** A limit on action that is not part of the goal (e.g., "maximize welfare but do not violate rights"). *Mistake:* Modeling it as a negative reward instead of a boundary.
  *   **Deontic:** Relating to duty or permission (allowed/forbidden). *Mistake:* Confusing it with outcome-based judgments (good/bad).
  *   **Scalar Consequentialism:** Judging actions only by how good the outcome is, without forbidden zones. *Mistake:* Thinking it allows everything if the score is high enough.
  *   **Particularism:** The view that moral judgment depends on context, not general rules. *Mistake:* Thinking you can code it using fixed rules.
  *   **Aggregation:** Combining different values into a single score. *Mistake:* Assuming the sum preserves the meaning of the parts.
  *   **Moral Residue:** The negative feeling or remainder after making a hard choice where something valuable was lost. *Mistake:* Thinking a correct decision eliminates all negative moral weight.
  *   **Fanaticism:** Giving infinite weight to a low-probability high-stakes outcome. *Mistake:* Letting a tiny chance of catastrophe dominate all normal decision-making.
  *   **Normative (Philosophy):** Relating to how things *ought* to be. *Mistake:* Using it to mean "standard" or "typical" system behavior.
  *   **Normative (Your Use):** Relating to the specific moral modes implemented in the code. *Mistake:* Implying these modes represent the only valid norms.

  **Three Sentences to Admit Ignorance Without Losing the Room:**
  1. "That is a philosophical question that my engineering framework does not resolve."
  2. "I do not have a solution for that yet, and I would welcome input on how to model it."
  3. "My expertise is in building the structure for the debate, not settling the debate itself."
