answer: |-
  Marx's exploitation claim translates arithmetically into the BEA's income-side tables as the ratio of Gross Operating Surplus plus Taxes on Production to Compensation of Employees, but the accounting identity that forces this split validates the existence of the surplus without confirming its origin, rendering the moral claim of exploitation a residue the ledger cannot capture.

  Here is the translation of the categories into BEA vocabulary:

  *   **Variable Capital ($v$):** This maps cleanly to **Compensation of Employees** (wages and salaries plus supplements like employer contributions to health and pension). This is the cost of reproducing labor power.
  *   **Surplus Value ($s$):** This lands in **Gross Operating Surplus** (corporate profits, rental income, net interest) plus **Taxes on Production and Imports less Subsidies**. In Marx's framework, taxes are generally a deduction from surplus value, so they belong in the surplus bucket, not as a neutral third category.
  *   **Constant Capital ($c$):** This corresponds to **Consumption of Fixed Capital** (depreciation) plus **Intermediate Inputs**. Since the BEA's Gross Value Added (GVA) nets out intermediate inputs, you only see the depreciation component in the value-added table; the raw materials and machinery turnover are invisible in the income-side summary.
  *   **The Working Day:** This has no direct line item but is implied by the ratio of Compensation to Gross Operating Surplus. If Compensation is 60% of GVA and Surplus is 40%, the accounting implies 60% of the day is "necessary labor" and 40% is "surplus labor," assuming value is proportional to labor time.

  Regarding the identity that Gross Value Added equals Labor Income plus Operating Surplus: this fact is **beside the point** theoretically but **helpful** empirically. It is beside the point because the identity is a tautology of double-entry bookkeeping, not a theory of production; it defines the residual as "operating surplus" without asserting whether capital produced it or appropriated it. However, it helps Marx empirically by confirming that a non-wage surplus exists as a structural necessity of the system, not an anomaly. It hurts him only if you mistake the account's labels for economic reality—the BEA structure assumes capital is a factor of production deserving a return, which is precisely the property relation Marx contests. The identity shows the *distribution* is zero-sum at the margin (higher wages imply lower surplus, ceteris paribus), which validates the class struggle over the split, even if it doesn't validate the source of the surplus.

  **Residue Report**

  **What Maps:**
  *   **The Monetary Split:** The division between wage income and non-wage income is explicit in the BEA tables. The magnitude of exploitation (the rate of surplus value) can be approximated by $(GOS + TOPI) / Compensation$.
  *   **Depreciation:** Consumption of Fixed Capital is a direct analogue to the wearing out of constant capital.

  **What Requires Bending or Fudging:**
  *   **Proprietors' Income:** The BEA lists this separately because it is mixed labor and capital income. To make Marx fit, you must arbitrarily split this into $v$ (the owner's labor) and $s$ (the owner's capital return), which the accounts do not do.
  *   **Management Compensation:** High executive salaries are counted as Compensation of Employees ($v$) by the BEA. Marx would likely classify a portion of this as surplus value ($s$) distributed as pay for superintendence or appropriation, meaning the BEA overstates variable capital.
  *   **Financial Sector:** The BEA treats financial intermediation services (imputed bank charges) as value-added output. Marx views interest and financial profit as a redistribution of surplus value created elsewhere, not new value creation. Using BEA data inflates the apparent size of the surplus generated within the financial sector itself.

  **What Has No Expression:**
  *   **Alienation:** There is no line item for the worker's separation from the product, the process, or their species-being. The accounts measure the price of labor, not the social relation of selling it.
  *   **Productive vs. Unproductive Labor:** The BEA counts all market income as value added. Marx distinguishes between labor that produces surplus value (productive) and labor that consumes it (unproductive, e.g., certain state functions, circulation costs). The BEA aggregates both into GVA, obscuring the source of the surplus.
  *   **Coercion:** The accounts record the wage transaction as a voluntary exchange of equals. They cannot capture the coercive background condition—that the worker must sell labor power to survive—which is the precondition for exploitation in Marx's theory.
  *   **Temporal Origin:** The accounts show the *result* of the working day (the split), but not the *duration* or intensity. You cannot distinguish between surplus gained by extending the working day (absolute surplus value) versus surplus gained by productivity increases (relative surplus value) without external data on hours and output per hour.
