  I was poured from granite dust and bound with steel,
  In nineteen twenty-nine the form was stripped
  And left me standing underneath the sky.
  My underside hangs ten feet from the road,
  A fixed distance measured from the stone.
  Sedans pass through beneath my shadowed arch,
  Their engines humming low against my feet.
  The large blue vehicles approach the slope,
  They slow upon the grade and stop their wheels,
  Then turn away without a sound of brakes.
  No air pressure hisses under me.
  Winter brings salt that eats the iron veins
  Within my skin; cracks open on the seam
  Where water freezes hard each winter night.
  In nineteen eighty-five the road was new,
  And fresh black tar was laid beneath my span.
  A family walks beneath with coolers held,
  They carry towels and a folded chair.
  At four o'clock my shadow touches them.
  The seasons change the color of my face.
  Rain leaves a stain upon the western wall.
  Lately men come with tapes and paper sheets,
  They measure from the ground to my lowest beam.
  They read from minutes typed in fading ink,
  They speak of reasons why the height was set.
  One says it was for cost, another says
  It was for looks, or weight, or something else.
  They bring rival theories in dark bags.
  They argue loud enough to stir the dust,
  But none of this has changed the space by inch.
  The concrete holds the number that it holds.
  What fits beneath passes and heads for shore.
  What does not fit turns back toward the city.
  The shadow moves four feet each afternoon.
  Yesterday thirty thousand passed below.
