  In a government air-quality monitoring station, an analyst must estimate the probability of a pollution episode ($S_2$) versus normal conditions ($S_1$), with a coherent prior of $P(S_1)=0.5$ and $P(S_2)=0.5$. The sensor delivers one of three reports: $R_1$ (low), $R_2$ (medium), or $R_3$ (high), occurring with probabilities $0.25$, $0.50$, and $0.25$ respectively; the likelihoods are $P(R_1|S_1)=0.3, P(R_2|S_1)=0.5, P(R_3|S_1)=0.2$ (and symmetrically inverted for $S_2$), yielding rational posteriors of $0.6, 0.5$, and $0.4$ for $S_1$. The agent knows from her calibration record that if she inspects the specific report, she succumbs to a binary extremisation bias, setting her credence in $S_1$ to $1.0$ upon $R_1$ and $0.0$ upon $R_3$ (while remaining at $0.5$ for $R_2$), whereas her alternative epistemic policy is to decline the fine-grained reading and attend only to the coarse alarm feature $\{R_3\}$ versus $\{R_1, R_2\}$, updating rationally to $0.4$ for $S_1$ if the alarm sounds and to $8/15$ ($\approx 0.533$) if it does not. The expected Brier inaccuracies are computed as follows: for the policy of accepting the fine evidence and conditionalising correctly, the expectation is $0.25(0.48) + 0.50(0.50) + 0.25(0.48) = 0.49$; for the policy of declining the fine evidence (adopting the coarse alarm policy), the expectation is $0.25(0.48) + 0.75(112/225) \approx 0.4933$; and for the policy of accepting the fine evidence and over-reacting as she knows she will, the expectation is $0.25(0.80) + 0.50(0.50) + 0.25(0.80) = 0.65$. The resulting ordering is: **Conditionalising Correctly (0.49) < Declining Fine Evidence (0.4933) < Prior/No Evidence (0.50) < Over-reacting (0.65)**; thus, because the agent cannot force herself to conditionalise correctly, she is obliged to decline the fine evidence in favour of the coarse policy, as taking the fine evidence would leave her worse off by her own prior lights.

  ***

  **Which single feature is doing the work?**
  The work is done by the **convexity of the Brier score** combined with the **severity of the bias relative to the diagnosticity of the evidence**. The Brier score penalises confident error quadratically. In this scenario, the evidence is only weakly diagnostic (shifting probabilities from $0.5$ to $0.6$), but the bias is extreme (shifting credence to $1.0$). The penalty for being confidently wrong ($0.4$ chance of error $\times$ score of $2.0$) outweighs the reward for being confidently right ($0.6$ chance of truth $\times$ score of $0.0$). If the evidence were more diagnostic (e.g., shifting rational posteriors to $0.9$), the gain from information would outweigh the penalty of the bias, restoring the orthodox verdict.

  **Demonstration:**
  Holding all numbers fixed, switch off the bias feature by assuming the agent conditionalises correctly. The ordering becomes $0.49$ (Take) $< 0.4933$ (Decline Fine) $< 0.50$ (Prior). The orthodox verdict is restored: taking the evidence is strictly better than declining it. Alternatively, reduce the bias to a moderate over-confidence (e.g., updating to $0.75$ instead of $1.0$). The expected inaccuracy for taking evidence drops to $0.25(0.375) + 0.50(0.50) + 0.25(0.375) = 0.4375$. This is now better than declining fine evidence ($0.4933$). Thus, it is specifically the *extremeness* of the known bias relative to the *weakness* of the signal that drives the counterexample.

  **Strongest Reply and Counter-Reply:**
  A defender of the orthodoxy would argue that accuracy-first norms evaluate **ideal rational plans**, not psychological compulsions. They would claim the theory prescribes: "Adopt the disposition to conditionalise." If the agent currently lacks this disposition, the norm is to *fix the bias*, not to avoid evidence. Avoiding evidence is a second-best workaround for a defect that should be cured.
  **Your reply:** While theoretically sound, this ignores the **cost of cognitive remediation**. In institutional settings (like your laboratory), retraining an analyst's deep-seated heuristic responses may be prohibitively expensive or impossible compared to altering the information protocol (e.g., masking fine-grained data). Norms must guide action given *actual* constraints, not merely idealised capacities. If the cost of fixing the bias exceeds the cost of information loss, the accuracy-first framework should endorse the information loss.

  **Considered View:**
  This is a **genuine counterexample to the practical application** of the Value of Evidence principle for non-ideal agents, though not to the mathematical theorem itself. Good's Theorem assumes the agent *will* conditionalise. Your scenario demonstrates that when the assumption of rational updating is decoupled from the act of acquiring evidence (due to known psychological constraints), the instrumental value of evidence becomes negative. It reveals that the Value of Evidence is not a property of the evidence alone, but of the **evidence-agent system**. For a biased agent, information can be toxic. Therefore, the principle "always take free evidence" is not a universal norm but a conditional one, holding only when the agent's updating mechanism is sufficiently reliable.
