answer: |-
  16/20 — A strong reconstruction of the dialectic marred by significant errors in calculating conditional credences and attributing the 'double halfer' view to Lewis.

  **(a) 6/6**
  Full credit. You correctly identify Elga's two indifference principles: (1) $P(Mon|T) = P(Tue|T)$ and (2) $P(H|Mon) = P(T|Mon)$. Your derivation of the three equiprobable centered worlds ($1/3$ each) and the resulting unconditional credences ($P(H)=1/3, P(Mon)=2/3$) is accurate and clear.

  **(b) 5/5**
  Full credit. You correctly identify that Lewis accepts the first premise (indifference within Tails) but rejects the second ($P(H|Mon) = 1/2$). Your explanation of Lewis's motivation (Principal Principle, no new uncentered evidence) is accurate. The likelihood ratio explanation for why $P(H|Mon) > P(T|Mon)$ is logically sound even if not Lewis's primary textual argument.

  **(c) 3/6**
  You have the unconditional credences for Heads correct for both views, and the unconditional Monday credence correct for the Thirder. However, the conditional probabilities and Lewis's Monday credence are wrong, and some contradict your own answers in (a) and (b).
  *   **Thirder:** You claim $P(H|Mon) = 1/3$. This contradicts your premise in (a) that "given that it is Monday, HEADS and TAILS are equally likely." If they are equally likely given Monday, $P(H|Mon)$ must be **1/2**. (Working: $P(H \land Mon) = 1/3$, $P(Mon) = 2/3$, so $P(H|Mon) = (1/3)/(2/3) = 1/2$).
  *   **Halfer:** You claim Lewis is a "double halfer" ($P(H|Mon) = 1/2$). This is incorrect; Lewis argues $P(H|Mon) = **2/3**$. (Working: Lewis holds $P(H)=1/2 \rightarrow P(H \land Mon)=1/2$. He accepts indifference within Tails, so $P(T \land Mon)=1/4$. Thus $P(Mon)=3/4$. $P(H|Mon) = (1/2)/(3/4) = 2/3$). Consequently, your $P(Mon)=1/2$ is also wrong; for Lewis, $P(Mon) = **3/4**$.

  **(d) 2/3**
  Good summary of the conditionalization implications (Elga = centered evidence/new rule; Lewis = no new evidence/standard rule). However, you lose a mark for stating "Both sides agree... credence... seems to shift." Lewis explicitly denies the credence in Heads shifts (it remains 1/2 from Sunday to Monday); resolving this apparent tension is precisely his goal.
