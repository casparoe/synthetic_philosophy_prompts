answer: |-
  ### Brainstorming: Actors, Choices, and Friction

  **Actors:**
  *   **The Technocrats:** Treasury (Paulson/Geithner), Fed (Bernanke). Goal: Systemic stability, avoiding contagion.
  *   **The Bankers:** Wall Street CEOs, AIG traders. Goal: Survival, bonus retention, limited equity dilution.
  *   **The Populists (Right):** Rick Santelli, emerging Tea Party organizers. Goal: Stop mortgage principal write-downs, cut spending, stop "bailouts."
  *   **The Populists (Left):** Occupy Wall Street, progressive House members (AIG tax push). Goal: Prosecute bankers, tax bonuses, principal relief.
  *   **The Median Voter:** Homeowners underwater, workers facing layoffs. Ambivalent identity (victim vs. aspirant).

  **Critical Choice Points:**
  1.  **TARP Design (Autumn 2008):** Equity stakes vs. loans. Choice: Loans. Result: Banks repaid quickly, avoided nationalization, narrative remained "rescue" not "takeover."
  2.  **Stress Tests (Spring 2009):** Transparency level. Choice: Calibrated to ensure passage without breakup. Result: Restored confidence, cemented "Too Big to Fail."
  3.  **AIG Bonus Tax (March 2009):** House passes 90% tax; Senate kills it. Choice: Contract sanctity vs. populist vengeance. Result: Symbolic victory, no revenue.
  4.  **Mortgage Relief (Feb 2009):** Principal write-downs vs. voluntary mods. Choice: Voluntary mods (HAMP). Result: Limited relief, fueled resentment on both sides (homeowners felt cheated, taxpayers felt suckered).
  5.  **Prosecutions (2009-2012):** DOJ discretion. Choice: Civil settlements vs. criminal indictments. Choice: Settlements. Result: No individual accountability.

  **Theory vs. History Friction:**
  1.  **The Fairness Equilibrium:** Theory says visible luck/fraud should crash effort-attribution and spike redistribution demand. History shows spiked demand only on the Left; the Right demanded *less* state intervention.
  2.  **POUM (Prospect of Upward Mobility):** Theory says voters tolerate inequality expecting future gain. 2008 crushed mobility prospects. Yet, broad redistribution coalition failed to form.
  3.  **The Expressive vs. Instrumental Gap:** The AIG tax passed the House but died. Theory treats voting as policy demand. History suggests it was moral signaling without commitment to structural change.

  ***

  ### The Effort-Attribution Model and the 2008 Shock

  **Defining the Model**
  Let $\theta_i$ be the **effort-attribution share** for voter $i$. For any given income level $Y$, $\theta_i$ is the fraction voter $i$ believes is derived from effort and merit, as opposed to luck, inheritance, insider access, or fraud. $\theta_i \in [0,1]$.

  **Assumptions:**
  1.  **Redistribution Demand:** Demand for redistribution $D_i$ is inversely related to the population-weighted average $\theta$. As $\bar{\theta}$ rises, $D$ falls.
  2.  **Bayesian Updating:** Voters update $\theta$ based on salient signals $S$. A crisis is a high-magnitude signal.
  3.  **Sectoral Heterogeneity:** Voters hold separate $\theta$ values for different sectors: $\theta_{market}$ (private income) and $\theta_{state}$ (government transfers/subsidies).
  4.  **Identity Alignment:** Voters align their political identity with the sector they believe reflects their own future income potential.

  **Tracing the Update: What 2008 Did to $\theta$**
  The crash was a massive negative signal regarding $\theta_{market}$ for the top 1%. The mechanics of the crisis—leveraged bets, opaque derivatives, rating agency collusion—objectively lowered the effort-component of banker incomes.

  *   **The Left (Occupy):** Updated $\theta_{market}$ downward sharply. They saw fraud and luck. Their demand for redistribution increased ("Tax the 1%"). This fits the standard fairness model.
  *   **The Right (Tea Party):** Here is the anomaly. They also updated $\theta$, but not where the theory expects. They did not lower $\theta_{market}$ for the rich; they lowered $\theta_{state}$ for the poor and the connected. The bailout signal was interpreted not as "markets are rigged" but as "government is rigging markets." The banker bailout was framed as government coercion (TARP), and mortgage relief was framed as rewarding laziness (subprime borrowers). Thus, $\theta_{state}$ collapsed. Since redistribution requires state action, and the state was now viewed as corrupt/inefficient, demand for redistribution fell.
  *   **The Center (POUM Voters):** Expected upward mobility stalled. However, instead of updating $\theta_{market}$ to acknowledge structural rigidity, many updated their identity. They aligned with the "taxpayer" identity rather than the "homeowner" identity. The "taxpayer" sees themselves as funding the undeserving. This preserved a high $\theta$ for themselves (I work hard) and lowered it for recipients.

  **The Anomaly: Two Movements, Opposite Programs**
  The fairness-equilibrium line predicts a collapse in effort-attribution leads to redistribution. The Tea Party was a collapse in effort-attribution that led to *anti*-statism.

  Is this a counterexample? No, it is a refinement. The theory assumes a unitary belief in "system fairness." The episode reveals voters distinguish between *market fairness* and *state fairness*. The Right believes markets are inherently fair (high $\theta_{market}$) but are corrupted by state intervention (low $\theta_{state}$). The bailout confirmed state corruption. Therefore, the solution is less state, not more redistribution. The theory holds if we split the belief variable. However, if the theory claims Americans believe market outcomes *actually* track effort objectively, the episode strains this: the market clearly failed to track effort (reckless bankers won, then were saved). The belief persisted despite evidence. This suggests the belief is not Bayesian but ideological—a prior that refuses to update.

  **The AIG Tax: Redistributive or Expressive?**
  The 90% tax was expressive. It was vengeance, not revenue planning. It matters for the theory because the theory conflates *anger at inequality* with *demand for institutional change*. Voters signaled low $\theta$ for bankers (they deserve punishment) but did not signal high demand for structural redistribution (welfare state expansion). They wanted punishment, not reconstruction. The theory is silent here on the distinction between punitive populism and structural redistribution. It assumes low $\theta$ leads to welfare expansion. 2008 shows it can lead to penal populism instead.

  **The European Contrast**
  European governments bailed out banks but pivoted to austerity. If Europeans believe outcomes track luck (low $\theta$), why cut services rather than confiscate wealth?
  This episode suggests the European attitude is not simply "low $\theta$." It is "shared risk." Austerity was framed as "we all lived beyond means," implying a collective lowering of $\theta$ for everyone, not just the rich. However, the lack of confiscation suggests that even in Europe, the *capacity* to redistribute is constrained by capital mobility, not just attitudes. But regarding *attitude*: The European response retained a notion of social solidarity (pain should be shared), whereas the US response fractured into sectoral blame (taxpayers vs. borrowers). The European attitude allows for the possibility that the system generated the loss; the US Right insisted the loss was moral failure of specific groups.

  **Normative Position: Which Attitude is Defensible?**
  I take the side that the **European skepticism (inequality is suspect/luck-driven) is more defensible**, specifically in light of the 2008 episode.

  **Reasons:**
  1.  **Epistemic Integrity:** The US "effort" narrative requires denying the empirical reality of the crash. The crisis was driven by systemic risk, moral hazard, and regulatory capture—forms of "luck" and "access" encoded into the market structure. To maintain that post-crash top incomes reflect effort is to falsify the mechanism of the crash itself. The European skepticism aligns better with the evidence that large-scale wealth accumulation is often tied to systemic position rather than marginal productivity.
  2.  **Moral Hazard:** The US response (no prosecutions, quick recovery for banks) socialized losses while privatizing gains. A political philosophy that defends this outcome as "fair" (high $\theta$) incentivizes future recklessness. The European attitude, even if it resulted in austerity, at least acknowledged that the gains were not fully legitimate (hence the unrest and the rhetorical shift toward "shared sacrifice").
  3.  **Stability:** The US attempt to maintain high $\theta$ in the face of evidence produced political instability (Tea Party vs. Occupy). The system lost legitimacy because the belief was unsustainable. A defensible political economy must allow beliefs to update when reality contradicts them. The European attitude permits updating; the US "exceptionalist" attitude resists it.

  **What Would Change My Mind:**
  I would shift toward the defensibility of the US attitude if evidence showed that post-2008 reforms successfully decoupled reward from systemic risk. If "Too Big to Fail" were eliminated, and banker compensation were strictly tied to long-term performance without downside guarantees, then high $\theta$ would be empirically justified. Additionally, if upward mobility (POUM) data showed a recovery to pre-1980 levels, the tolerance for inequality would be defensible as a rational bet on the future. Until then, maintaining the effort-attribution share at pre-crash levels is an act of faith, not philosophy.

  **Where the Theory is Silent:**
  The theory is silent on why the *same* empirical signal (bank bailouts) produced opposite updates in $\theta$ based on pre-existing media ecosystems (CNBC vs. alternative media). It treats belief updating as individual Bayesian processing, ignoring the industrial production of belief. It is also silent on why punitive expression (AIG tax) substitutes for structural redistribution in the US political menu.

  **Conclusion**
  The 2008 episode falsified the strong version of the American fairness equilibrium. Markets did not track effort; they tracked leverage and connections. The political response was not a correction of this belief, but a fragmentation of it. The Right protected the market's fairness by blaming the state; the Left attacked the market's fairness but lacked power. The more defensible attitude is the one that admits the correlation between wealth and luck was higher than advertised. To argue otherwise is to defend a fiction that requires the periodic sacrifice of economic stability to maintain.
