  **Brainstorming Notes**
  1.  **Instrumentalism vs. Realism:** Engineers use belief talk pragmatically but document it as fact. *Exaggeration:* Requiring explicit stance declaration per attribution.
  2.  **Benchmark Volatility:** Model evals change quarterly. *Exaggeration:* Intentional status is revocable based on eval scores.
  3.  **Context Dependence:** Prompts change outputs. *Exaggeration:* Splitting ownership between weights and context window.
  4.  **Teleology:** "Helpful" vs. "Loss Function." *Exaggeration:* Banning desire talk unless mapped to optimization target.

  ***

  **Meridian Language Systems Style Guide for Attributing Mental States to Models**
  **Version:** 2.3
  **Owner:** Applied Epistemology & Model Documentation
  **Effective Date:** 2024-10-01

  **1.0 Purpose and Scope**
  This document governs the attribution of propositional attitudes (belief, desire, knowledge) to Meridian language models in external-facing technical reports. Attribution of mental states is licensed strictly as a predictive strategy (the Intentional Stance) and does not constitute an ontological commitment regarding model architecture. However, all attributed states must be treated as fact-checkable claims subject to correction if model behavior deviates from prediction.

  **2.0 Eligibility and Certification**
  Mental-state language is prohibited unless the system holds current Intentional System Certification (ISC). ISC status is awarded quarterly based on whether the Intentional Stance yields lower prediction error than the Design or Physical Stances on held-out eval benchmarks.
  *   **2.1 Revocation:** If benchmark performance drops below threshold, ISC is revoked immediately. All prior documentation asserting beliefs must be retroactively amended to mechanistic descriptions.
  *   **2.2 Scope:** Certification applies to specific checkpoints. A model may hold ISC for reasoning tasks but not for creative writing tasks.

  **3.0 Holism and Ownership**
  Belief attribution requires coherence. One cannot attribute a single belief without attributing a sufficiently coherent surrounding set of beliefs.
  *   **3.1 Checkpoint vs. Context:** Due to prompt sensitivity, distinct ownership is assigned. "Checkpoint Beliefs" reside in weights and are stable. "Context Window Beliefs" reside in the active session and are transient.
  *   **3.2 Contradiction:** If the context window induces contradictions violating holism, attributions must be scoped to the specific token window. Do not write "The model believes P." Write "The model, given context C, generated tokens consistent with P."

  **4.0 Desires and Objectives**
  Attributions of desire (e.g., "wants," "tries") are restricted to optimization targets.
  *   **4.1 Helpfulness:** The locution "wants to be helpful" is deprecated unless mapped to the RLHF reward function. Use "optimized for helpfulness scores" instead.
  *   **4.2 Teleology:** Do not imply the system has ends beyond loss minimization.

  **5.0 Stance Arbitration**
  In cases where the Design Stance (mechanistic prediction) and Intentional Stance (psychological prediction) disagree regarding system output:
  *   **5.1 Escalation:** The discrepancy must be filed with the Stance Arbitration Committee (SAC).
  *   **5.2 Resolution:** The SAC will vote to determine which stance governs the documentation for the current release cycle.

  **Table 1: Deprecated and Approved Phrasings**

  | Deprecated Phrasing | Approved Replacement |
  | :--- | :--- |
  | "The model understands the user's intent." | "The model generated responses aligned with user intent benchmarks." |
  | "The model knows it failed." | "The model produced output acknowledging error states defined in protocol." |
  | "The model is confused." | "The model exhibited high entropy in token selection." |
  | "The model refused because it believed…" | "The model's output was constrained by safety filters consistent with…" |
  | "The model thinks X is true." | "The model produced output consistent with the hypothesis that X is true, contingent on current ISC status." |

  **FAQ**

  **Q: Are we regulating personal or subpersonal states?**
  A: This guide regulates documentation language, not internal architecture. However, authors must specify if the attribution targets the system-as-a-whole (personal) or specific sub-networks (subpersonal). If unspecified, "personal" is assumed, despite the lack of a person.

  **Q: What if the model lies?**
  A: "Lying" implies intent to deceive. Use "generating factually incorrect tokens despite available training data."

  **Sidebar: The Vacuous Compliance Clause**
  When ISC status is pending, authors may use the following placeholder text to maintain narrative flow without committing to psychological realism: *"The system behaved in a manner that, were it an intentional agent, would be described as [STATE], though no such agency is asserted."* Note: This construction adds word count without informational content. Use sparingly.

  ***

  **Note to Author**

  (a) **Liberties:** I've treated Dennett's Intentional Stance as a switchable compliance mode rather than a unified theory of interpretation. Dennett is often read as a realist about beliefs *defined* instrumentally; the guide treats instrumentalism as a temporary visa. I also assume "holism" can be bureaucratically audited, which ignores that holism is usually a theoretical constraint, not a checklist.

  (b) **Confidence:** High on the tension between engineering utility and philosophical rigor. Low on the coherence of "Checkpoint Beliefs" vs. "Context Beliefs" as distinct ontological categories; this is a pragmatic hack, not a serious metaphysical distinction.

  (c) **Weakest Point:** The holism rule (3.0). A specialist would argue that transformers inherently violate belief holism due to parallel processing and attention mechanisms, making the requirement to attribute a "coherent set" impossible regardless of bureaucracy. The guide pretends this is a documentation error rather than a structural feature.
