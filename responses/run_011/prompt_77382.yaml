answer: |-
  # Prep Sheet: Intergenerational Justice Colloquium

  ## Opening Concessions (First 3 Minutes)
  *Do not wait for these to be raised as objections. State them in your introduction to disarm the room.*

  1.  **To the Economist:** Concede immediately that you are not proposing changes to the *mathematics* of optimal growth paths that would render the integral divergent. Acknowledge that a convergence condition is mathematically necessary. Your claim is about the *interpretation* of the parameter securing that convergence, not the removal of the convergence requirement itself.
  2.  **To the Policy School:** Concede that regulators need a single "discount rate" number for cost-benefit analysis. Clarify that your argument implies this number should be derived from $\eta \times g$ (elasticity times growth) rather than $\delta + \eta \times g$. You are offering a new calibration method, not a refusal to calibrate.
  3.  **To the Philosopher:** Concede that "Standpoint Indifference" has moral *implications*. Your specific claim is narrower: it is a *structural* constraint on the evaluation function (like anonymity in social choice), not a substantive claim about the *value* of future welfare. You are distinguishing the *architecture* of the judgment from the *weights* within it.

  ---

  ## The Objections (Ordered by Likelihood $\times$ Damage)

  ### 1. The "Model Breakage" Objection (The Welfare Economist)
  **The Objection:** "In the Ramsey model, if you delete $\delta$ and rely solely on $\eta$, you only get a finite integral if consumption grows sufficiently fast. If growth slows or stops (stationary economy), the model diverges and yields no optimum. By calling $\delta$ 'undefined,' you haven't solved the divergence problem; you've just hidden it. If your framework can't handle a stationary state, it's not a general theory of justice."
  **The Reply:** "You are right that convergence is required, but wrong about what secures it. In the standard view, $\delta$ does double duty: it represents impatience *and* ensures convergence. I am arguing we should split these. Convergence is secured by the relationship between $\eta$ and growth rates. If the economy is stationary, the 'no optimum' result isn't a bug to be fixed by impatience; it's a signal that the utilitarian aggregation function is ill-suited for that specific demographic/economic context. We shouldn't import ethical impatience to fix a mathematical boundary condition."
  **Frank Note on Softness:** This is your weakest mathematical flank. If $\eta$ cannot secure convergence without $\delta$, your claim that $\delta$ should be "deleted" is mathematically false, not just normatively preferable. This puts **Conclusion 1** (that the parameter should be deleted) at risk.
  **Risk:** High.

  ### 2. The "Operational Void" Objection (The Policy School)
  **The Objection:** "We use the Social Cost of Carbon (SCC) models to write regulations today. Those models require a discount rate input. If you tell a regulator that $\delta$ is 'undefined' and they should look only at $\eta$, they will ask: 'What if $\eta$ is low?' You are replacing a contested parameter with a parameter ($\eta$) that is equally contested but less transparent for time-tradeoffs. You haven't solved the policy dispute; you've just moved the goalposts."
  **The Reply:** "I am not making the policy dispute disappear; I am making it honest. Currently, policymakers hide ethical judgments about the future inside $\delta$, calling it 'market-based.' By shifting the weight to $\eta$, we force the debate onto wealth distribution and risk aversion, where the ethical stakes are clearer. If $\eta$ is low, that implies we should consume more now, but that is a claim about inequality, not time. It is better to argue about inequality explicitly than to smuggle it into a time parameter."
  **Frank Note on Softness:** This reply is politically naive. Policymakers *want* the time parameter because it feels technical. Admitting this shifts the debate to inequality might make them less likely to adopt your framework. This risks **Conclusion 3** (that empirical objections miss the mark), because the empirical objection is precisely that your alternative is harder to implement.
  **Risk:** Medium-High.

  ### 3. The "Moral Wolf in Sheep's Clothing" Objection (The Moral Philosopher)
  **The Objection:** "You claim Standpoint Indifference is a structural consistency condition, not a moral claim. But requiring that an evaluation not depend on the evaluator's temporal location *is* a moral commitment to impartiality. You haven't escaped moral philosophy; you've just relabeled a substantive moral premise as a 'structural constraint' to avoid defending it against partialists."
  **The Reply:** "There is a distinction between a structural rule of *counting* and a substantive rule of *weighting*. Anonymity in voting is a structural rule; it doesn't tell you who *should* win, only that voter ID doesn't matter. Similarly, Standpoint Indifference says the *date* of the evaluator doesn't matter, but it leaves open how much welfare counts. I am not claiming impartiality is uncontroversial, but that it is a precondition for the *type* of evaluation we are doing (intergenerational justice), distinct from the specific rate at which we discount welfare."
  **Frank Note on Softness:** This distinction is thin. If the structure dictates the outcome (zero discounting), the structure is doing moral work. The Philosopher may press that "consistency conditions" are just implicit moral axioms. This threatens the core distinction in your **Thesis**.
  **Risk:** Medium.

  ### 4. The "Eta is Descriptive" Objection (The Welfare Economist)
  **The Objection:** "You argue $\eta$ does the normative work. But in IAMs, $\eta$ is calibrated to observed market behavior (revealed preference). It is a descriptive parameter about risk aversion and consumption smoothing. If you load it with normative weight for intergenerational justice, you are collapsing the descriptive/prescriptive distinction you claim to respect. You're doing exactly what you accuse the zero-discount camp of doing."
  **The Reply:** "I agree $\eta$ is often calibrated descriptively, but that is a mistake in the current literature. $\eta$ has two components: risk aversion and inequality aversion. In an intergenerational context without uncertainty, it functions purely as inequality aversion. I am arguing we should *decalibrate* it from market behavior and set it prescriptively. The error isn't in using $\eta$ for normative work; it's in assuming $\eta$ must be descriptive."
  **Frank Note on Softness:** The Economist will not accept that $\eta$ can be easily decoupled from risk. If $\eta$ determines the risk-free rate in the model, changing it prescriptively breaks the asset pricing side of the IAM. This puts **Conclusion 2** (that $\eta$ does the work) at risk of internal inconsistency.
  **Risk:** Medium-High.

  ### 5. The "Terminological Stipulation" Objection (The Moral Philosopher)
  **The Objection:** "Economists have used $\delta$ to mean 'pure time preference' for eighty years. You are proposing to delete it and call the result 'Standpoint Indifference.' This looks like a verbal victory, not a substantive one. You are defining the term out of existence to win the argument. Why shouldn't we just call your structural constraint 'Zero Pure Time Preference' and move on?"
  **The Reply:** "Because the label carries theoretical baggage. 'Pure Time Preference' implies a psychological or ethical rate of impatience that *could* be positive. 'Standpoint Indifference' implies a logical condition that *cannot* vary. If we keep the old term, we invite the 'compromise' position (e.g., $\delta = 0.5\%$), which my argument shows is incoherent. You cannot be 'slightly' standpoint-dependent any more than you can be 'slightly' anonymous in voting. The name change prevents category errors."
  **Frank Note on Softness:** This is a pragmatic argument, not a theoretical one. It risks sounding pedantic. If the room decides it's just semantics, your **Thesis** loses its punch.
  **Risk:** Low-Medium.

  ### 6. The "Opportunity Cost" Objection (The Policy School / Economist)
  **The Objection:** "Capital invested today yields returns. If we don't discount the future, we must invest almost everything for the future, leaving nothing for the present. The market rate of return is an opportunity cost, not just impatience. By deleting $\delta$, you ignore the productivity of capital, leading to over-accumulation and austerity for the current poor."
  **The Reply:** "The productivity of capital is captured in the growth rate $g$, which interacts with $\eta$. The opportunity cost argument conflates the *return on investment* with the *discount rate*. We should invest until the marginal return equals the social discount rate. If the social discount rate is determined by $\eta \times g$, we still get an optimal investment path. It will be higher than the market path, but that is the point of normative policy: to correct market myopia, not to mirror it."
  **Frank Note on Softness:** This relies on the assumption that the optimal path is feasible. If the gap between market rates and your normative rate is too wide, the transition costs are politically impossible. This is a practical rebuttal to **Conclusion 3**.
  **Risk:** Medium.

  ### 7. The "Historical Reality" Objection (The Economic Historian)
  **The Objection:** "Societies have always displayed time preference. It's in interest rates, in land values, in how we treat heirlooms. To say $\delta$ is 'undefined' ignores the anthropological and historical fact that humans value the present more. A theory of justice that ignores human psychology is utopian."
  **The Reply:** "My paper is not about how humans *do* value time, but how a *social evaluation function* *should* aggregate welfare. The fact that markets display impatience is an empirical observation about current institutions, not a constraint on justice. We don't set the tax rate based on historical averages of theft; we set it based on principles. Similarly, we shouldn't set intergenerational weights based on historical impatience."
  **Frank Note on Softness:** This is a standard is/ought defense. It's solid but may frustrate the Historian who thinks institutions evolve for reasons. Low risk to the argument, high risk of alienating the Historian.
  **Risk:** Low.

  ### 8. The "Non-Identity" Evasion Objection (The Moral Philosopher)
  **The Objection:** "Standpoint Indifference assumes the same subjects exist across time to be evaluated. But different policies create different future people (Non-Identity Problem). If the future people don't exist yet, what does it mean to be 'indifferent' to their standpoint? You are assuming a fixed population to make the math work."
  **The Reply:** "Standpoint Indifference applies to the *slots* in the evaluation function, not the specific identities. It requires that if a person exists in slot $t$, their welfare counts the same as a person in slot $t+1$. It is compatible with variable population sizes, provided we have a separate principle for population value (like Critical Level Utilitarianism). My claim is about the time-weighting of whatever population exists, not the size of that population."
  **Frank Note on Softness:** If your framework relies on a specific population ethic that isn't standpoint-neutral, this reply fails. It assumes your view is compatible with all population ethics, which may not be true.
  **Risk:** Low.

  ---

  ## The One Reply That Must Land
  **The Target:** Objection #4 (Eta is Descriptive) and Objection #1 (Model Breakage).
  **The Point:** You must convince the room that **$\eta$ is the only ethically defensible lever for intergenerational distribution.**
  **The Script:** "If we accept Standpoint Indifference, we cannot use time to discriminate. That leaves only *wealth* to discriminate. $\eta$ measures how much extra utility a dollar gives a rich person versus a poor person. Since future people will likely be richer, $\eta$ naturally reduces the weight of their consumption without invoking impatience. If this mechanism fails—if $\eta$ cannot do the work—then utilitarianism itself fails for intergenerational problems, not just my specific formulation. I am not asking $\eta$ to do something new; I am asking it to do the only thing left for it to do."
  **Why:** If the room accepts that $\eta$ *can't* do this work (e.g., because it's tied to risk), your positive theory collapses. If they accept it, the rest is implementation detail.

  ---

  ## The Killer Question (Hope Nobody Asks)
  **The Question:** "In a zero-growth steady state ($g=0$), your formula for the discount rate ($\eta \times g$) becomes zero. With $\delta$ deleted and the discount rate at zero, the present value of an infinite stream of constant utility is infinite. Your model produces no ranking for policy choices in a stationary economy. Does your theory imply we cannot make justice judgments for sustainable societies?"
  **Why You Cannot Answer It:** Your framework relies on growth ($g$) to generate a finite discount rate via $\eta$. If $g=0$, the mathematical machinery you rely on to replace $\delta$ vanishes. You would have to admit that Standpoint Indifference is incompatible with Utilitarian aggregation in a stationary state, which concedes the Economist's point that $\delta$ (or some other convergence device) is mathematically necessary, undermining **Conclusion 1**.

  ---

  ## Strategic Narrowing (If the Economist is Right)
  **The Hard Truth:** The Welfare Economist is mathematically right that you cannot simply "delete" $\delta$ without replacing its convergence function. If $g$ is low, $\eta$ alone may not ensure a finite integral.
  **The Narrowed Claim:** Do not claim $\delta$ should be **deleted** from the equation. Claim that $\delta$ should be **purged of ethical content** and treated strictly as a **mathematical convergence parameter** set to the minimum value required for the integral to exist, unrelated to impatience.
  **Revised Thesis:** "The pure time preference parameter $\delta$ should not be set to zero based on moral argument, nor set positively based on market rates. It should be treated as a technical slack variable set to the lowest value that ensures mathematical convergence. All *normative* weighting of the future should be handled by $\eta$. This preserves the model's solvability without conceding that impatience is ethically relevant."
  **Why:** This saves your paper from the "Model Breakage" objection while keeping the core ethical insight (impatience is not the driver). It turns a theoretical claim into a modeling protocol, which the Policy and Econ folks can actually use.
