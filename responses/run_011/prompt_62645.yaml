      *   *Claim 3: "Adversarially train and certify... within a large $\epsilon$-ball."*
          *   **Issue:** Certification usually scales poorly with network size and $\epsilon$. For LLMs (discrete input), $\ell_p$ certification is often meaningless or requires relaxation (e.g., Gumbel-Softmax) that weakens the bound. If it's a continuous embedding space, the mapping from text to embedding is non-isometric.
