          *   **Issue:** The "Large perturbation" space isn't just "rare." It's the space of *distributional shift* and *compositional generalization*. Real-world attacks aren't always small $\ell_p$ perturbations. They are semantic shifts, prompt injections, multi-turn jailbreaks, or context window manipulations. An $\ell_p$ ball around a benign prompt doesn't cover "Ignore previous instructions."
          *   **Issue:** The eval set average (expected harm) doesn't catch *tail risks*. Safety is often about worst-case scenarios, not averages. A 0.1% failure rate on a billion users is 1 million incidents.
          *   **Issue:** The boundary between "in the ball" and "out of the ball" is porous. Adversarial examples can be transferred.
      *   *Claim 2: "Downstream capability training... can't degrade the guarantee."*
          *   **Issue:** This is theoretically false unless the safety head is *frozen* and completely isolated, which rarely works in practice due to representation drift. If you fine-tune the backbone, the features feeding the safety head change. The certificate holds for the *current* weights, not future weights.
