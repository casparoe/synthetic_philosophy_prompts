answer: |-
  **MEMORANDUM: DECISION PROCEDURE FOR NET EXPECTED BENEFIT (NEB)**
  **TO:** Program Officers | **FROM:** Director of Evidence and Impact | **TIME ALLOWANCE:** 120 Minutes/Grant

  **PURPOSE:** To populate the charter-required "Net Expected Benefit" field without concealing uncertainty. This procedure manages *consequentialist cluelessness* (the inability to know long-term indirect effects) by sorting grants by risk type.

  **STEP 1: SORTING [E]**
  Classify the grant into one of three Uncertainty Classes based on the *Counterfactual* (the difference between the world with the grant and the world without it).
  *   **Class A (Bounded/Stable):** Effects are hard to estimate but the *Sign* (positive/negative) is stable and the *Magnitude* is bounded by the project scope. (e.g., bednets, vaccines).
  *   **Class B (Bounded/Unknown Sign):** Effects are bounded by project scope, but the *Sign* of indirect effects is unknown. (e.g., labor market shifts, social norm changes).
  *   **Class C (Unbounded/Irreversible):** Effects may escape project scope, are irreversible, or alter systems beyond modeling. (e.g., gene drives, policy changes with lock-in, unrestricted germplasm).
  *   *Note on Materiality:* The charter's 2% cutoff is a **Value Choice [V]**, not a technical fact. It smuggles in a verdict that tail risks do not matter. Use it only for Class A. For Class B/C, ignore the cutoff.

  **STEP 2: INQUIRY & TERMINATION [E/V]**
  *Ask in order. Stop at the first sufficient answer.*

  1.  **Direct Effect Verification [E]:** Is there robust evidence for the direct effect (e.g., lives saved, yield increase)?
      *   *No:* **Do Not Fund.**
      *   *Yes:* Proceed.
  2.  **Omission Asymmetry Check [V]:** Have you estimated the NEB of *Inaction* using the same uncertainty lens? (e.g., If we don't fund CHWs, does the status quo carry its own unknown long-term risks?)
      *   *No:* **Return to Step 1.** (Discipline: You cannot judge intervention risk without baseline risk).
      *   *Yes:* Proceed.
  3.  **Class Determination [E]:** Based on Step 1, is this A, B, or C?
      *   **If Class A:** Calculate NEB using direct effects only. **Termination: Fund.**
      *   **If Class B:** Can the unknown sign effects be monitored and reversed if negative?
          *   *Yes:* **Termination: Fund in Reversible Stages.** (Pre-commit to expansion rules).
          *   *No:* **Termination: Escalate to Board.** (This is a values decision, not an evidence one).
      *   **If Class C:** Is the irreversible harm existentially significant or globally systemic?
          *   *Yes:* **Termination: Do Not Fund.**
          *   *No:* **Termination: Escalate to Board.**

  **STEP 3: THE NEB FIELD [V]**
  The charter requires a number. Do not lie.
  *   **Class A:** Enter calculated figure.
  *   **Class B/C:** Enter Direct Effect figure only. Append code: **"NEB = $X (Direct Only; Long-Term Tail Excluded per Class B/C Protocol)."**
  *   *Anti-Skimming:* This code must be bolded. A memo with this code cannot be approved by the Investment Committee without Board acknowledgement.

  **STEP 4: ERROR CALIBRATION [V]**
  This procedure is calibrated to commit **False Negatives (Refusing Defensible Work)** in Class B and C.
  *   *Why:* Our endowment is permanent; grantees are not. We can re-fund later. We cannot undo ecological or systemic harm. Paralysis is costly, but recklessness is terminal.

  **STEP 5: ANTI-GAMING CHECKS [E]**
  *   **Risk:** Officer classifies Class C as Class A to avoid scrutiny.
      *   *Check:* Any grant involving "unrestricted release," "policy lock-in," or "ecosystem alteration" auto-triggers Class C review by Evidence Team.
  *   **Risk:** Officer claims indirect effects are "immaterial" (under 2%) to avoid Class B.
      *   *Check:* For Class B/C, the 2% rule is suspended. Officer must write a 1-paragraph "Pre-Mortem" describing how this grant could fail catastrophically.

  ***

  ### APPLICATION TO PROPOSALS

  **Proposal 1: Salt Fortification**
  *   **Sort:** **Class A.** Technology is mature. Effects (anemia reduction) are bounded and stable sign. Indirect effects (schooling) are secondary and likely positive/stable.
  *   **Inquiry:** Direct evidence robust. Inaction (no fortification) has known negative baseline. Reversibility is high (contracts end).
  *   **Termination:** **Fund.**
  *   **NEB Field:** Enter full extrapolated figure. No code required.
  *   **Comment:** This is the "safe harbor." The procedure clears this quickly to preserve capacity for harder cases.

  **Proposal 2: Community Health Workers (Flagship)**
  *   **Sort:** **Class B.** Direct mortality effects are Class A. However, knock-on effects (labor markets, marriage age, political power) are *unknown sign* (e.g., does paying young women increase autonomy or create backlash?) and bounded by the district.
  *   **Inquiry:** Direct evidence robust. Inaction (status quo health system) has known risks. Reversibility is **Low**. Once a cadre of salaried workers is established, removing them causes social disruption greater than never hiring them.
  *   **Termination:** **Escalate to Board as Values Decision.**
  *   **NEB Field:** **"$X (Direct Only; Long-Term Tail Excluded per Class B Protocol)."**
  *   **Comment:** This is the unwelcome verdict. The procedure does not block the good work, but it refuses to pretend the social engineering is mathematically solved. It forces the Board to own the risk that changing the social fabric of a district may have net-negative long-term consequences we cannot model.
      *   *Honesty Check:* Is this result genuine or built to clear? It is genuine. A procedure that takes "unknown sign" seriously *must* flag systemic social intervention where reversibility is low. If the procedure cleared this automatically, it would be ignoring the cluelessness problem it was built to address.
      *   *Options:* 1. **Restructure:** Fund as a randomized rollout (reversible stages). 2. **Re-describe:** Justify via *Capability Approach* (expanding freedom is good regardless of consequence) rather than Consequentialism. This is intellectually respectable *if* the charter is amended, but currently, it is a dignified surrender to the charter's strict utilitarianism.

  **Proposal 3: Drought-Tolerant Germplasm**
  *   **Sort:** **Class C.** Unrestricted release is irreversible. Genetic narrowing and pest adaptation are systemic/unbounded risks.
  *   **Inquiry:** Direct benefits high. Inaction (climate vulnerability) is high risk. However, harm is irreversible.
  *   **Termination:** **Do Not Fund.** (Unless Board overrides).
  *   **NEB Field:** **"$X (Direct Only; Long-Term Tail Excluded per Class C Protocol)."**
  *   **Comment:** The "unrestricted" clause is the killer. The procedure blocks this because the error calibration (False Negative) prioritizes avoiding irreversible systemic harm over potential high-yield gains.

  ***

  ### LIMITATIONS & CRITICISM

  **What this procedure cannot do:**
  1.  **Solve Cluelessness:** It does not tell you the truth about the long term. It only tells you when you are ignorant.
  2.  **Escape Values:** It claims to be evidence-based, but the Sorting and Error Calibration are pure value judgments.
  3.  **Protect Against Bad Faith:** A determined Officer can still write a "Pre-Mortem" that is too optimistic.

  **The Critic's Objection:**
  A critic holding that "all of this is preference dressed as method" would say: *You have created a bureaucracy that legitimizes your own risk aversion. By classifying the Flagship (Proposal 2) as 'Escalate,' you are not protecting the world from harm; you are protecting the Foundation from blame. The 'Error Calibration' admits you would rather let known good work die than risk a unknown bad outcome. This is institutional cowardice, not rigor.*

  **The Strongest Reply:**
  *The Foundation's capital is a permanent trust; the grantees' projects are temporary. If we fund a Class C catastrophe, we lose the ability to fund anything forever. If we refuse a Class B grant, the grantees may find other funding, or we can re-fund in five years once uncertainty resolves. The procedure privileges the permanence of the instrument (the endowment) over the immediacy of the intervention. This is not cowardice; it is fiduciary duty to the future beneficiaries we have not yet met.*
