prompt: |-
  I'm TA-ing an upper-level seminar on the origins of the Jesus tradition this term — 18 students, mostly juniors, one 75-minute block, and the room has whiteboards but no projector, so anything you design has to run on paper and chalk. Two weeks back they got the standard lecture on the criteria of authenticity: dissimilarity (including the double-dissimilarity version), multiple attestation, embarrassment, coherence, plus the Palestinian-environment and Aramaic-traces business. They all nodded along and now think they've learned a method. What I actually want them to leave feeling is that the criteria were never calibrated — that they behave like diagnostic tests whose specificity nobody has ever measured, and whose output quietly collapses when the prior probability is low. Think of each criterion as a little machine that prints "authentic" or "not." What you'd need to trust it is a rate: how often does it fire on material you already know to be invented? Nobody has ever had a labeled dataset for first-century Jesus material, so that number has never been computed, and yet the whole enterprise is run as though the answer came back favorable. And the criteria aren't independent of each other, which is the part my students never clock: a saying is multiply attested *because* it was useful to lots of communities, and usefulness to lots of communities is also what tends to make it look dissimilar from any single one of them — so stacking criteria doesn't multiply your confidence the way they assume it does.

  I have a hunch about a two-round structure and I want you to build it out properly, or tell me the hunch is bad and build something better. Round one: a corpus with an answer key, so they finally get to measure a false-positive rate on material where ground truth exists — the standard move is to have me assemble a list of things I've actually said in earlier classes mixed with things I never said, written up in the same flattened register as a gospel pericope, and have them sift it blind with the criteria while I hold the key. Round two: the same procedure applied to real gospel material, except the key doesn't exist and never will, and they have to sit in that. I'd want the round-two items just named by passage, not quoted — we're all reading the same translation and I don't want your approximation of the wording drifting into the handout.

  So: give me the full build. The corpus construction protocol (how many items, what mix of real to invented, and crucially how to write the invented ones so they're *fair* — an invented item that's obviously anachronistic turns the exercise into a shooting gallery and proves nothing about the criteria); the rules and any team structure; a scoring scheme with tokens or points rather than real money, that makes them commit before they see the key rather than hedging; a minute-by-minute timeline that fits 75 including the debrief; and a debrief that maps specific moments in the room onto specific failures — double dissimilarity handing you a Jesus who fits neither his Judaism nor the church that formed around him, embarrassment depending entirely on knowing what a community was sensitive about, coherence verging on circular, multiple attestation conflating "widely spread" with "early." Tell me what will predictably go wrong the first time I run this and how to recover. Two extra things I care about. First, be honest about whether the round-one/round-two analogy actually holds, because I suspect it partly doesn't: my invented items come from one modern mind with no community shaping them, whereas the gospel material was produced by groups with live interests, which is exactly what the criteria were supposed to be detecting — if that gap is big enough to sink the comparison, say so and tell me what to do instead. Second, there are three students in this room whose faith is not a hobby and one classics major who thinks the entire subfield is astrology; I don't want the activity engineered to humiliate either camp, but I also don't want it sanded down until it teaches nothing, so design with that in mind and flag anywhere you had to compromise. No reading list, no citations — I've got the bibliography sorted and I'd rather you spend the words on the mechanics. And at the end tell me how confident you are in your empirical predictions here (that they'll over-trust the criteria, that they'll score near chance on the labeled corpus), and single out the one claim in your design you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Role:** TA for an upper-level seminar on the origins of the Jesus tradition.
      *   **Audience:** 18 students (mostly juniors), mixed background (3 serious faith commitments, 1 skeptical classics major, rest likely standard undergrads).
      *   **Constraints:** 75 minutes, no projector (whiteboards/paper only), 2 weeks post-lecture on Criteria of Authenticity (Dissimilarity, Multiple Attestation, Embarrassment, Coherence, Palestinian Environment, Aramaic Traces).
      *   **Goal:** Move students from "I learned a method" to "This method is uncalibrated, interdependent, and statistically shaky."
      *   **Proposed Structure:** Two rounds. Round 1: Controlled corpus (TA's sayings vs. invented) with answer key. Round 2: Gospel passages (no key).
      *   **Specific Requirements:**
          *   Corpus construction protocol (fair invented items).
          *   Rules/Team structure.
          *   Scoring scheme (commitment mechanism).
          *   Minute-by-minute timeline.
          *   Debrief mapping specific failures.
          *   Troubleshooting (what goes wrong).
          *   Critique of the Round 1/2 analogy (does it hold?).
          *   Sensitivity to faith/skepticism (no humiliation, no sanding down).
          *   Confidence rating in predictions + least sure claim.
          *   No reading list/citations.

  2.  **Evaluate the "Hunch" (Round 1 vs. Round 2):**

      *   *Strengths:* It creates an immediate experiential gap. Round 1 shows they *can* use the criteria to find truth *if* ground truth exists. Round 2 shows the ground truth is missing.
      *   *Weaknesses (The "Gap"):* The user suspects the analogy might break.
          *   *Issue:* In Round 1, the "invented" material comes from *one* mind (the TA) simulating a past context. In Round 2, the "inauthentic" gospel material comes from *communities* over *decades*.
          *   *Impact:* The criteria (especially Multiple Attestation and Embarrassment) are designed to detect *community* shaping, not *individual* fabrication. A TA faking a saying won't trigger "Multiple Attestation" because there's only one source (the handout).
          *   *Fix:* Round 1 needs to simulate *community transmission* or at least acknowledge the limitation. Or, Round 1 should focus on the *logical* application of the criteria rather than the *historical* sociological function.
          *   *Decision:* The analogy *does* hold for the logical application (does the criterion trigger?), but fails on the sociological mechanism (why it triggers). I need to flag this in the critique section but keep the structure because the pedagogical payoff (feeling the lack of a key) is too valuable to lose. I will adjust Round 1 to ensure the "invented" items are plausible enough that criteria *do* trigger on them (false positives).

  3.  **Design the Mechanics:**

      *   **Corpus:** Needs 10-12 items for Round 1. 50/50 split is too obvious. 6 Real / 6 Invented.
      *   **Writing the Invented Items:** Must avoid anachronisms (no cars, no internet). Must mimic the "flattened register" of a pericope. Crucially, they must trigger the criteria. E.g., an invented saying that is embarrassing (false positive for Embarrassment) or fits the Palestinian environment (false positive for Context).
      *   **Round 2:** 6 Gospel passages. Just references (e.g., Mark 2:10).
      *   **Scoring:** Needs to force commitment. "Betting tokens" work well. If you hedge, you gain nothing.
      *   **Team Structure:** 18 students. 6 teams of 3. Small enough for participation, large enough for debate.
      *   **Timeline:** 75 mins is tight.
          *   Intro: 5 min.
          *   Round 1 (Work + Reveal): 25 min.
          *   Round 2 (Work): 20 min.
          *   Debrief: 25 min.
      *   **Debrief:** Must connect the Round 1 failure (false positives) to Round 2 uncertainty.

  4.  **Addressing the Faith/Skepticism Dynamic:**

      *   *Risk:* The exercise could feel like "Proving the Bible is Fake" to the faithful, or "Proving Scholars are Clueless" to the skeptic.
      *   *Mitigation:* Frame the criteria as *tools for probability*, not truth-detectors. Emphasize that "Inauthentic" in historical Jesus studies doesn't mean "False" theologically, just "Not spoken by the historical individual." For the skeptic, emphasize that "Authentic" doesn't mean "Miraculous," just "Historically probable."
      *   *Compromise:* I must avoid declaring specific gospel passages as definitely "inauthentic" in Round 2. The point is the *lack of a key*, not the negative result.

  5.  **Drafting the Content - Section by Section:**

      *   **Critique of the Hunch:** Start here. Validate the user's suspicion. The "Community Gap" is real. Round 1 tests *logic*, Round 2 tests *history*. I need to make sure the debrief addresses this so the students don't think the TA's fake sayings are equivalent to early church tradition.
      *   **Corpus Construction:**
          *   *Real:* Quotes from the TA's actual syllabus/emails/lectures (flattened to sound like sayings).
          *   *Invented:* Need to be "Criterion-Rich." E.g., A saying that criticizes scholars (Embarrassment?), A saying that uses Aramaic-style parallelism (Aramaic Traces?), A saying found in "multiple" handouts (if I distribute variants? No, too complex). Let's stick to the criteria triggering on the *content* itself.
          *   *Fairness:* No modern slang. No obvious references.
      *   **Game Mechanics:** "Confidence Tokens." Each team gets 10 tokens. They bet on "Authentic" or "Invented." High bet = high confidence.
      *   **Timeline:** Detailed breakdown.
      *   **Debrief:** Specific scripts for the whiteboard.
      *   **Troubleshooting:** What if they get Round 1 perfect? (Unlikely if items are good). What if they revolt? (Keep tone collaborative).
      *   **Confidence Rating:** Be honest.

  6.  **Refining the "False Positive" Problem:**

      *   The core insight the user wants is: *Criteria trigger on invented material too.*
      *   So, the Invented Items in Round 1 *must* satisfy the criteria.
      *   Example Invented Item: "The TA said: 'I do not know the answer, only the Father in the syllabus knows.'"
          *   *Embarrassment:* Admits ignorance.
          *   *Dissimilarity:* Doesn't sound like standard academic speech.
          *   *Coherence:* Fits with "TA is guide not guru."
      *   If students mark this "Authentic" based on criteria, but it's Invented -> **False Positive.** This is the money shot.

  7.  **Refining the Round 2 "No Key" Problem:**

      *   Don't ask them to solve Round 2. Ask them to *apply* the criteria and then realize they can't verify.
      *   The tension is: "You applied the same rules. In Round 1, you saw the error rate. In Round 2, you have no error rate."

  8.  **Final Review against Constraints:**

      *   No projector? All handouts/paper.
      *   18 students? 6 groups of 3.
      *   Faith/Skeptic sensitivity? Focus on *methodological limits*, not *theological truth*.
      *   Confidence rating at end? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Have them bet money. *Correction:* No, tokens. Avoids ethical issues and distraction.
      *   *Initial thought:* Use specific Bible verses. *Correction:* User said "just named by passage." Stick to that.
      *   *Initial thought:* Explain the Community Gap in the intro. *Correction:* No, save for debrief. Let them feel the gap first.
      *   *Skeptic/Faith:* Ensure the "Real" items in Round 1 aren't theological. Keep them about the course. Keeps the stakes methodological, not doctrinal.

  10. **Final Polish:** Check tone. Needs to be professional, pedagogical, slightly rigorous but practical. (The user is a TA who knows their stuff, so don't over-explain basic concepts, focus on the mechanics).

  *(Self-Correction on the "Community Gap" Critique)*: I need to be very clear here. The user's hunch is *pedagogically* sound but *historically* imperfect. The criteria were built to sift *community tradition*, not *individual fabrication*. A TA faking a saying is an individual act. However, for the purpose of demonstrating *calibration failure*, it works. I will advise the user to explicitly name this limitation in the debrief so the Classics major doesn't dismiss the whole exercise as an apples-to-oranges comparison.

  *(Self-Correction on Scoring)*: If they bet tokens, how do they win? Bragging rights? Let's make it about "Calibration Score." If you bet high on a False Positive, you lose more. This emphasizes the risk of over-confidence.

  *(Final check on Faith/Skeptic)*: The skeptic thinks it's astrology. The exercise proves it *might* be astrology (uncalibrated). The faithful think it's truth. The exercise proves history can't guarantee truth. Both get challenged, neither gets attacked personally. The focus is on the *tool*, not the *object*.

  Okay, ready to write.
answer: |-
  Here is the full build for the 75-minute session.

  ### 1. Critique of the Hunch (Round 1 vs. Round 2)

  Your hunch is pedagogically sound but historically imperfect. You are right to suspect the analogy doesn't fully hold, and you must address this or the Classics major will dismiss the exercise as category error.

  **The Gap:** The Criteria of Authenticity were designed to sift *community tradition*, not *individual fabrication*.
  *   **Round 1 (Your Sayings):** The "inauthentic" items are fabricated by a single mind (you) in a vacuum. They lack the sedimentation of oral tradition, liturgical use, or catechetical shaping.
  *   **Round 2 (Gospel Material):** The "inauthentic" items (if they are inauthentic) were likely generated by communities over decades. They carry the weight of utility, liturgy, and conflict.

  **Why it still works:** You are not testing the *sociological* validity of the criteria (i.e., do they detect community shaping?), you are testing their *logical calibration* (i.e., do they trigger on material that is known to be false?). If a criterion triggers on your invented TA-sayings (False Positive), it proves the criterion is not a unique fingerprint of historical reality, regardless of whether the source is an individual or a community.

  **The Fix:** In the debrief, you must explicitly concede the gap. Tell them: *"Round 1 tests the logic of the tool. Round 2 tests the history of the object. The tool failed the logic test; that makes the history test untrustworthy."* This satisfies the skeptic (who sees the methodological flaw) without humiliating the faithful (who see that historical uncertainty ≠ theological falsehood).

  ---

  ### 2. Corpus Construction Protocol

  You need two handouts. **Handout A (Round 1)** and **Handout B (Round 2)**.

  **Handout A: The Controlled Corpus**
  *   **Total Items:** 12 statements.
  *   **Mix:** 6 Real (things you actually said/wrote in weeks 1–2), 6 Invented (fabricated by you).
  *   **Formatting:** Present them all as "Pericope 1," "Pericope 2," etc. Strip all context. Use a flattened, semi-formal register.
  *   **Writing the Invented Items (Crucial):** They must be **Criterion-Rich**. If they are too obvious, students will use "common sense" rather than the criteria. You want them to use the criteria, get a positive result, and be wrong.
      *   *To trigger Embarrassment:* Invent a saying where you admit confusion or failure. (e.g., *"I told them the answer is hidden, for I myself have lost the key."*)
      *   *To trigger Dissimilarity:* Invent a saying that sounds unlike standard academic pedagogy. (e.g., *"Grades are not given by me, but by the silence between the words."*)
      *   *To trigger Palestinian Environment/Aramaic:* Use parallelism or concrete imagery. (e.g., *"The syllabus is stone, the email is wind."*)
      *   *To trigger Coherence:* Ensure it fits loosely with things you actually said, so it feels consistent.
  *   **The Key:** Keep this in your pocket. Do not lose it.

  **Handout B: The Gospel Corpus**
  *   **Total Items:** 6 Passages.
  *   **Format:** Citation only (e.g., *Mark 2:10–11*). Do not quote the text. They have their Bibles/translations; this prevents your wording from biasing them.
  *   **Selection:** Choose passages where scholarship is deeply divided.
      *   1 Clear Case (e.g., *Mark 10:45* - generally accepted).
      *   1 Clear Case (e.g., *John 14:6* - generally rejected as historical Jesus).
      *   4 Disputed (e.g., *The Temple Cleansing, The Lord's Prayer, A specific Parable, An Apocalyptic Saying*).
  *   **Goal:** Do not give them the answer. The point is the *absence* of the key.

  ---

  ### 3. Game Mechanics & Scoring

  **Team Structure:**
  *   18 Students → 6 Teams of 3.
  *   Assign roles within teams: **Scribe** (writes down verdict), **Advocate** (argues for the criteria), **Skeptic** (argues against the criteria). Rotate roles between Round 1 and Round 2.

  **The Currency: "Confidence Tokens"**
  *   Give each team 10 physical tokens (poker chips, paper clips, folded paper).
  *   **The Rule:** To register a verdict on an item, they must bet tokens.
      *   **Low Confidence:** Bet 1 token. (Win 1 if right, Lose 1 if wrong).
      *   **High Confidence:** Bet 3 tokens. (Win 3 if right, Lose 3 if wrong).
      *   **No Verdict:** Bet 0. (No gain, no loss).
  *   **Commitment:** They must write the bet on the paper *before* you reveal any answers. No hedging.

  **Why this works:** It penalizes over-confidence. If the criteria are uncalibrated, high-confidence bets will bleed tokens rapidly in Round 1. This creates the emotional "ouch" needed for the debrief.

  ---

  ### 4. Minute-by-Minute Timeline (75 Minutes)

  **0:00 – 0:05 | Introduction**
  *   Hand out **Handout A** and **Token Stipend**.
  *   **Script:** "Two weeks ago we learned the tools. Today we test the tools. You have 12 statements. Some I said, some I invented. Your job is not to guess, but to apply the Criteria of Authenticity. If the criteria say 'Authentic,' you bet. If the criteria are silent, you fold."

  **0:05 – 0:20 | Round 1 Work (15 mins)**
  *   Teams apply criteria to the 12 items.
  *   They must record: **Verdict** (Real/Invented), **Criteria Used**, **Token Bet**.
  *   *TA Role:* Circulate. Do not answer content questions. If they ask "Did you say this?", reply: "Apply the criteria."

  **0:20 – 0:30 | Round 1 Reveal & Scoring (10 mins)**
  *   Go through the 12 items quickly. Reveal the Key.
  *   Teams calculate net token score.
  *   **Whiteboard:** Write the class average score. Write the number of **False Positives** (Invented items marked Real).
  *   *Expected Outcome:* There will be several False Positives. The criteria will have triggered on your lies.

  **0:30 – 0:35 | The Pivot (5 mins)**
  *   Hand out **Handout B**.
  *   **Script:** "You now know the false-positive rate of these tools in a controlled environment. Now apply the exact same process to the Gospel passages. Same betting rules. But there is a catch."
  *   **The Catch:** "I do not have the key. Nobody does. You must place your bets anyway."

  **0:35 – 0:50 | Round 2 Work (15 mins)**
  *   Teams apply criteria to the 6 passages.
  *   They record Verdict and Token Bet.
  *   *TA Role:* Watch for frustration. This is the desired state. They are betting tokens on a game where the house doesn't know the answer.

  **0:50 – 1:15 | Debrief & Mapping (25 mins)**
  *   **Do not reveal Round 2 answers.** (There are none).
  *   Collect the bets.
  *   **Whiteboard Work:** Draw two columns: **Round 1 (Known)** and **Round 2 (Unknown)**.
  *   **Mapping Failures:**
      1.  **The False Positive:** Point to an Invented Item from Round 1 that triggered *Embarrassment*. Ask: "Why did this criterion fire?" (Answer: Because I wrote it to look embarrassing). "Does embarrassment prove historicity, or just literary skill?"
      2.  **The Independence Illusion:** Ask a team that bet high on a Round 1 item which criteria they used. If they say "Multiple Attestation AND Dissimilarity," show them how those two are correlated in your invented text. "You counted the same evidence twice."
      3.  **The Prior Probability:** Ask: "In Round 1, the prior probability of a statement being Real was 50%. In Round 2, the prior probability of any specific saying being authentic is arguably much lower (given oral transmission). If the test has a 20% false-positive rate, what happens to your confidence when the prior drops?"
      4.  **The Missing Key:** Point to the Round 2 column. "You have the same tokens, the same criteria, and the same confidence. But you have no way to calculate the loss. You are flying blind."

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  **Problem 1: They ace Round 1.**
  *   *Cause:* Your invented items were too obvious (anachronistic or tonally off).
  *   *Recovery:* Acknowledge it. "You are better at detecting my lies than the criteria are. That means *you* are the instrument, not the criteria. The criteria added no value."

  **Problem 2: The Faithful Students withdraw.**
  *   *Cause:* They feel the exercise implies the Gospels are lies.
  *   *Recovery:* In the debrief, explicitly distinguish **Historical Authenticity** from **Theological Truth**. "A saying can be historically inauthentic (spoken by the church) and still be true (inspired). We are testing the history, not the faith. The criteria cannot measure revelation."

  **Problem 3: The Skeptic Student dominates.**
  *   *Cause:* They treat Round 2 as a chance to say "It's all fake."
  *   *Recovery:* Enforce the betting rules. "If it's all fake, bet all your tokens on 'Inauthentic.' But if you're wrong, you lose. The point is you *can't* know." Force them into the uncertainty.

  **Problem 4: Time runs over.**
  *   *Cause:* Round 1 debate drags.
  *   *Recovery:* Hard stop at minute 20 for Round 1. Cut the scoring calculation short; just ask for a show of hands on "Who lost tokens?" to get the gist.

  ---

  ### 6. Sensitivity Compromises

  *   **Compromise 1:** I advised *against* quoting the Gospel text in Round 2.
      *   *Reason:* If you quote a miracle story, the faithful may feel targeted. If you quote a moral saying, the skeptic may feel bored. By using citations only, you force them to engage the *scholarly consensus* on that passage, not the content itself. This depersonalizes the tension.
  *   **Compromise 2:** I advised *against* revealing Round 2 answers.
      *   *Reason:* Declaring a passage "Inauthentic" in class creates a permanent record that could distress faithful students. Declaring it "Authentic" validates the method you are trying to critique. Leaving it unresolved protects both groups and reinforces the lesson (uncertainty).

  ---

  ### 7. Confidence Rating & Least Sure Claim

  **Confidence in Empirical Predictions:** **High (85%)**
  *   **Prediction:** They will over-trust the criteria in Round 1.
  *   **Prediction:** They will score near chance (or worse) on the labeled corpus if they rely *solely* on the criteria.
  *   **Reasoning:** Undergraduates tend to treat rubrics as algorithms. When given a checklist (The Criteria), they assume a positive checkmark equals truth. They rarely account for base rates or false positives unless forced to bet on it. The token mechanic reliably exposes over-confidence.

  **Least Sure Claim:** **"The invented items will trigger the criteria fairly."**
  *   **Risk:** It is difficult for a modern TA to write a "fake pericope" that triggers *Aramaic Traces* or *Palestinian Environment* without accidentally making it sound cheesy or obvious. If your invented items feel "constructed," students will switch from using the Criteria to using "Vibe Checks."
  *   **Mitigation:** Test your invented items on a colleague *before* class. If they spot the fake in under 30 seconds, rewrite it. It needs to survive at least one minute of scrutiny.

  **Final Note:** The success of this lesson hinges on your willingness to sit in the silence of Round 2. When they ask, "So, which ones were real?" your answer must be, "I don't know. And neither does anyone else." That is the lesson.
