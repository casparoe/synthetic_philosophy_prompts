answer: |-
  # The Risk Autopsy: A Diagnostic Protocol

  You are asking for a way to separate the wheat from the chaff when readers claim they are simply "risk averse." You want to know if they are exhibiting a stable, defensible attitude towards risk (global risk-sensitivity), or if they are tripping over cognitive biases, utility curvature, or framing errors.

  Below is a five-step procedure designed to be run in about twenty minutes. It relies on A-level arithmetic and logical consistency checks. It does not require further correspondence with the reader; you will apply these tests to the text they have already sent, perhaps posing a single hypothetical in your reply to see if their stated principle holds.

  ## Part 1: The Five-Step Filter

  Run the submission through these steps in order. If a step returns a "Fail," the diagnosis is found there. If they pass all five, you are likely dealing with genuine risk-sensitivity.

  ### Step 1: The Wealth-Utility Check
  **The Question:** Does the aversion track the *value* of the outcome relative to their total resources, or the *structure* of the gamble?
  **The Test:** Look at the stakes. If the reader refuses a gamble because losing would be catastrophic (e.g., losing their house), that is diminishing marginal utility of money, not risk aversion. £1,000 means more to a student than a millionaire.
  **Pass Condition:** The reader would make the same choice even if the stakes were scaled down to trivial amounts (e.g., pennies) *proportionate* to their wealth, or if the stakes are non-monetary (health, time) where marginal utility is hard to define.
  **Fail Verdict:** **Utility Curvature.** They aren't afraid of the risk; they are afraid of the loss magnitude. This is rational, but it isn't risk-sensitivity in the technical sense.

  ### Step 2: The Aggregation Test (Narrow Framing)
  **The Question:** Would they take the bet if it were bundled?
  **The Test:** Many readers evaluate a single gamble in isolation (narrow framing) rather than as part of a portfolio. A risk-averse person might reject a single coin toss (lose £100 / win £120) but accept 100 of them.
  **The Test Question (to be posed in your column response):** "If you could take this exact same bet 100 times independently, would you take it then?"
  **Pass Condition:** They say "No." A genuine global risk-weighter often still rejects the aggregate if the risk function is sufficiently conservative, or they acknowledge the single instance is the only one that matters.
  **Fail Verdict:** **Narrow Framing.** If they say "Yes, I'd take 100 of them," their aversion to the single case is a framing error. The Law of Large Numbers washes out the risk; refusing the single instance while accepting the bundle is inconsistent with global risk-sensitivity.

  ### Step 3: The Precision Check (Ambiguity vs. Risk)
  **The Question:** Is the probability known or guessed?
  **The Test:** Distinguish between *risk* (known probabilities) and *ambiguity* (unknown probabilities). Readers often conflate "I don't like the odds" with "I don't trust the odds."
  **Pass Condition:** The reader accepts the probability figure as solid (e.g., actuarial data, established medical stats) and rejects the gamble anyway.
  **Fail Verdict:** **Ambiguity Aversion.** If they say, "I don't believe that 2% figure," they are not risk-averse; they are sceptical of the data. This is epistemic caution, not risk sensitivity.

  ### Step 4: The Calibration Check (The Rabin Trap)
  **The Question:** Does their aversion scale absurdly?
  **The Test:** This is the crucial mathematical filter. Expected Utility theory implies that if you reject a small positive-value bet (e.g., 50/50 to lose £100 or win £110) at any wealth level, you must logically reject a bet with unlimited upside (e.g., 50/50 to lose £1,000 or win ∞).
  **The Test Question:** "If your reasoning here implies you would also refuse a bet where you could lose your stake but win a million times that amount, is that a stance you hold?"
  **Pass Condition:** They acknowledge the small bet refusal is specific to the context (one-off, high stress) OR they accept the large bet. Risk-Weighted Expected Utility (REU) allows you to reject small bets without committing to absurd large-bet rejection.
  **Fail Verdict:** **Calibration Error.** If they insist on rejecting the small bet *on principle* but admit they'd take the massive one, they are violating Expected Utility without a coherent risk function to replace it. They are likely reacting to the *salience* of the loss, not the risk structure.
  *Note:* If they say "I would reject the massive bet too," they pass this test (they are extremely consistent), but you must weigh if that is plausible.

  ### Step 5: The Dynamic Consistency Check
  **The Question:** Would they change their mind mid-stream?
  **The Test:** Global risk-sensitivity violates the "Sure-Thing Principle." This makes you vulnerable to a "money pump" if you face sequential choices.
  **The Test Question:** "Imagine you take the gamble. Halfway through, before the result is known, you are offered a chance to sell your position back for the expected value. Do you sell?"
  **Pass Condition:** They say "No." They stick to their initial evaluation of the whole gamble.
  **Fail Verdict:** **Dynamic Inconsistency.** If they say "Yes, I'd sell," their risk attitude changes once the gamble is "live." This suggests their initial refusal was emotional anticipation, not a stable risk policy.

  ***

  ## Part 2: Theoretical Troubleshooting

  You asked for clarity on three specific theoretical traps. Here is how the procedure handles them.

  ### 1. The Representation Theorem Problem
  *The Worry:* Mathematically, any risk-averse choice can be modelled as Expected Utility maximisation with a "bent" utility function. So how can you claim someone is "really" using a risk function?
  *The Solution:* The distinction is not ontological; it is **predictive**.
  If their aversion is due to Utility Curvature (Step 1), their refusal should vanish if the stakes become trivial relative to wealth. If their aversion is due to Risk Weighting, they might still refuse even when the utility of the money is linear (e.g., points in a game, or trivial sums).
  *The Procedure's Fix:* Step 1 isolates this. If they reject trivial stakes, it's not utility curvature. It is either risk-sensitivity or bias.

  ### 2. The Calibration Trap
  *The Worry:* Refusing small bets implies refusing preposterous large ones (Rabin's Theorem).
  *The Solution:* This only applies to Expected Utility maximisers. A Risk-Weighted maximiser *can* refuse small bets without refusing large ones, because the risk function applies to the probability distribution, not just the final wealth state.
  *The Procedure's Fix:* Step 4. If they pass Step 4 (acknowledging they wouldn't refuse the massive bet), they are demonstrating behaviour that Expected Utility cannot explain. This is the strongest evidence for the Buchak-style view. However, if they are refusing a *one-off* small bet, ensure you aren't penalising them for transaction costs or emotional stress (which are real utilities).

  ### 3. The Dynamic Choice Objection
  *The Worry:* Risk-weighting agents can be money-pumped (made to pay to switch back and forth) because they violate the Sure-Thing Principle.
  *The Solution:* This only bites if the agent faces the *same* decision node repeatedly or can trade their position.
  *The Procedure's Fix:* Step 5. If the reader's decision is a "one-shot" (e.g., a medical operation), the money pump is theoretical. They will never face the chance to sell the position back. You can tell the reader: "Your stance is vulnerable to dynamic inconsistency, but since you won't face this choice again, the vulnerability is dormant."

  ***

  ## Part 3: Running the Cases

  Here is the procedure applied to your three submissions.

  ### Case 1: The Elective Operation
  *Submission:* Late sixties. 2% chance of permanent serious complication. Good odds otherwise. Refused.
  *   **Step 1 (Wealth/Utility):** **Judgement Call.** Health utility is not linear. A "serious complication" in late sixties might reduce remaining quality-adjusted life years disproportionately. However, if the "good outcome" restores full function and the "bad outcome" is severe disability, the utility curve is steep. *Pass (with reservation).*
  *   **Step 2 (Aggregation):** **Pass.** You cannot have the same operation 100 times. This is inherently a one-off. Narrow framing is not applicable.
  *   **Step 3 (Precision):** **Pass.** Medical stats are usually actuarial. Assuming the 2% is trusted.
  *   **Step 4 (Calibration):** **Pass.** Refusing a 2% risk of permanent disability does not imply refusing a 2% risk of a hangnail. The stakes are non-fungible (health vs money).
  *   **Step 5 (Dynamic):** **N/A.** Cannot sell the operation back mid-surgery.
  *   **Verdict:** **Respectable Risk Sensitivity.**
      *   *Columnist's Note:* This is the strongest case for the Buchak view. The reader is weighting the 2% tail risk more heavily than the probability suggests. Because it is a one-off health outcome, utility curvature and risk sensitivity blur, but the refusal is defensible. It is not cowardice; it is a high weight on the worst-case scenario.

  ### Case 2: The Cyclist vs. Driver
  *Submission:* Won't cycle (1 in 50,000 fatality risk per trip). Drives the same route daily. Calls it a "coherent philosophy."
  *   **Step 1 (Wealth/Utility):** **Fail.** The outcome (death) is the same. The utility of arrival is the same.
  *   **Step 2 (Aggregation):** **Fail.** Driving daily *is* aggregation. If they drive 100 times, they accept the aggregate risk. If they refuse to cycle once, they are treating the single trip as more significant than the aggregate driving risk.
  *   **Step 3 (Precision):** **Judgement Call.** Often people distrust cycling stats more than car stats. If they admit the stats are equal, this fails.
  *   **Step 4 (Calibration):** **Fail.** If the risk is truly 1/50,000 for both, refusing one and accepting the other is a direct contradiction of risk magnitude.
  *   **Step 5 (Dynamic):** **Fail.** Likely feels more "in control" driving.
  *   **Verdict:** **Framing and Control Bias.**
      *   *Columnist's Note:* This is not risk aversion. This is the "illusion of control." They feel safer in a steel cage than on a bike, despite the numbers. This is a probability-weighting quirk (weighting the *feeling* of safety over the *statistic* of safety). Do not validate this as a coherent philosophy.

  ### Case 3: The School Governor
  *Submission:* Campaigned against new playing surface at *their* school (small chance of rare reaction). Supports same surface across the *borough*.
  *   **Step 1 (Wealth/Utility):** **Pass.** The physical risk to the child is identical.
  *   **Step 2 (Aggregation):** **Fail.** If it is safe enough for the borough, it is safe enough for one school. The risk does not increase because *they* are the governor.
  *   **Step 3 (Precision):** **Pass.** Assuming the reaction risk is the same.
  *   **Step 4 (Calibration):** **Fail.** Inconsistent application of the risk threshold.
  *   **Step 5 (Dynamic):** **N/A.**
  *   **Verdict:** **Responsibility Aversion (Not Risk Sensitivity).**
      *   *Columnist's Note:* You asked me to be straight. This fails the consistency test. This is not about the risk of the surface; it is about the risk of *blame*. If a child is hurt at another school, it is a tragedy. If a child is hurt at their school, it is *their* failure. This is "omission bias" or "regret aversion." It is a human feeling, but it is not a defensible stance on *risk*. It is a defensible stance on *liability*.
      *   *How to write it:* You can side with them on *humanity* ("It is natural to feel the burden of responsibility more acutely when the decision is yours") but you must flag it as distinct from risk assessment. Do not call it risk aversion.

  ***

  ## Part 4: Judgement Calls and Limitations

  You asked me to mark where the procedure is merely a "judgement call wearing a procedural costume."

  1.  **Step 1 (Utility of Health):** In Case 1, distinguishing between "I value health non-linearly" and "I am risk-averse about health" is theoretically impossible. A concave utility function for health looks exactly like a risk function for health outcomes. *This is a judgement call.* You must decide if "avoiding the worst case" is a value (utility) or a structural preference (risk). I have classified it as risk-sensitivity because the stakes are binary (healthy/complication), making utility curvature less likely to be the driver than probability weighting.
  2.  **Step 4 (Calibration):** Determining if a reader *really* understands the implication of the "massive bet" hypothetical is difficult. They may say "No" because they don't grasp the scale, not because of their risk function. *This is a judgement call.* You must gauge their numerical literacy from their email.
  3.  **The "One-Off" Exemption:** In Step 5, I exempt one-off decisions from the money pump critique. This is pragmatic, not theoretical. Technically, the inconsistency still exists in their preference ordering. *This is a judgement call.* You are privileging "real world applicability" over "logical purity."

  ### Where the Procedure Fails (The Undecidable Zone)

  There are cases where you must stop writing and declare the case undecidable.

  1.  **Unique Historical Events:** If a reader is deciding on a geopolitical bet (e.g., "Should I move my family out of the country before the election?"), probabilities are not known (Step 3 fails). This is pure ambiguity. You cannot distinguish risk-sensitivity from scepticism.
  2.  **Identity-Conflicting Choices:** If the choice changes who the reader *is* (e.g., "Should I take a drug that makes me happier but less ambitious?"), utility is not stable. The procedure assumes a stable utility function. If the gamble changes the utility function, the maths breaks.
  3.  **The "Sleep at Night" Value:** If a reader says, "I know the expected value is positive, but I value 'not worrying' more than the gain," they are commodifying their own anxiety. This is a utility function where the input includes "peace of mind." You cannot separate this from risk aversion.

  **Final Instruction:** When you hit the Undecidable Zone, do not pretend the maths can solve it. Tell the reader: "Here, the numbers run out. You are not calculating risk; you are choosing a life. The gut is not a calculator; it is a vote."

  ***

  ## Summary for your Column

  *   **Use the 5-Step Filter** to screen out utility curvature and framing errors.
  *   **Trust Step 4 (Calibration)** as your strongest mathematical lever to distinguish Expected Utility from Risk-Weighted Utility.
  *   **Be honest on Case 3:** The Governor is not risk-averse; they are responsibility-averse. Validate the feeling, correct the terminology.
  *   **Accept the Limit:** When values shift or probabilities are unknown, the procedure terminates. That is where your column begins.
