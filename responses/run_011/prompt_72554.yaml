      *   Philosophy Smuggle? Identify clearly.

  8.  **Self-Correction on "PI Hate":**
      *   If the PI is a Dennettian, they won't hate Case 1.
      *   If the PI is a standard consciousness researcher *using* heterophenomenology as a buzzword but wanting realist data (common), they will hate Case 1.
      *   *Wait, looking at the prompt:* "My PI wants the whole thing framed as heterophenomenology."
