          *   *Let's go with Case 1:* The PI wants heterophenomenology *in theory*, but in practice, they want to publish on "Conscious vs. Unconscious." If the protocol treats the "Unconscious" (chance) report as a valid phenomenological text, it blurs the line the PI wants to draw. I will flag Case 1 as the problematic one.

  5.  **Refining the "Philosophy Smuggled as Bookkeeping" Critique:**
      *   Heterophenomenology claims neutrality. But deciding *what counts as a report* is theoretical.
      *   Deciding when a contradiction is "internal" vs. "external" is theoretical.
      *   The distinction between "Data-About-Report" and "Data-About-Percept" is itself a metaphysical move.
