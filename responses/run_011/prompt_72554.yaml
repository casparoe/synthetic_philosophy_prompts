answer: |-
  This is a classic methodological bottleneck. Your PI is asking for Dennett's *heterophenomenology* (treating the subject's report as a text to be interpreted, not a direct window into a private theater), but your lab's infrastructure (spreadsheets, trial structures) is built for *realist phenomenology* (report = truth about inner state).

  When RAs write "confabulation," they are making a metaphysical claim: *The inner state did not match the report.* Heterophenomenology forbids this. It says: *The report occurred. The stimulus occurred. The relationship between them is a theoretical construct, not a data point.*

  Below is an operational protocol designed for an RA with no philosophy background. It forces neutrality by restricting the vocabulary available in the spreadsheet.

  ***

  # Protocol: Heterophenomenological Verbal Report Coding (HVRC) v1.0

  **Objective:** To transcribe and code subject verbal reports without making claims about the veridicality of the subject's inner experience.
  **Volume:** ~40 reports/session.
  **Time Budget:** 2 minutes/report.
  **Rule #1:** The Report is the Data. Do not correct the Report based on the Stimulus.

  ## Part 1: The Coding Workflow

  ### Step 1: Verbatim Transcription (30 seconds)
  *   **Action:** Type exactly what the subject said. Include filler words ("um," "uh") and hedging ("I think," "maybe").
  *   **Constraint:** Do not summarize. Do not fix grammar.
  *   **Settling Condition:** Audio matches text.

  ### Step 2: Commitment Coding (30 seconds)
  *   **Action:** Assign a **Commitment Score (1–5)** based *only* on the language of the report, not the stimulus.
      *   1 = Guessing/Hedging ("I think maybe...")
      *   3 = Neutral ("I saw...")
      *   5 = Absolute Certainty ("I definitely saw...")
  *   **Settling Condition:** If the subject says "I'm sure," it is a 5, even if they were wrong.
  *   **Data Type:** **Data-About-Report.** (This measures the speech act, not the percept).

  ### Step 3: Content Tagging (30 seconds)
  *   **Action:** Tag the *claimed* content using the lab's standard ontology (e.g., `FACE`, `WORD`, `GRATING`, `NULL`).
  *   **Constraint:** If the subject claims they saw a `FACE` on a `NULL` trial, you tag `FACE`. You do **not** tag `NULL`.
  *   **Settling Condition:** The tag matches the noun used by the subject.
  *   **Data Type:** **Data-About-Report.**

  ### Step 4: Stimulus Juxtaposition (30 seconds)
  *   **Action:** The software automatically pulls the **Stimulus Code** (what was actually shown) and the **Forced-Choice Accuracy** (0 or 1).
  *   **Action:** RA selects a **Relation Flag**:
      *   `MATCH` (Report Content == Stimulus Code)
      *   `MISMATCH` (Report Content != Stimulus Code)
      *   `INDETERMINATE` (Report is vague/ineffable)
  *   **Constraint:** You are **forbidden** from selecting "Confabulation," "Hallucination," or "Error." These are theoretical inferences, not observations.
  *   **Data Type:** **Data-About-Correlation.** (This is where theory enters later, not here).

  ### Step 5: Internal Consistency Check (30 seconds)
  *   **Action:** Check if the report contradicts *itself*.
  *   **Question:** Did the subject say two mutually exclusive things *in the same sentence*?
  *   **Flag:** `INTERNAL_CONTRADICTION`.
  *   **Settling Condition:** Only flag if the contradiction is linguistic (e.g., "It was red and also completely colorless"). Do **not** flag if the contradiction is between Report and Stimulus (that is a `MISMATCH`, not a contradiction).
  *   **Data Type:** **Data-About-Report.**

  ## Part 2: Special Cases

  ### Handling "Indescribable" Reports
  *   **Scenario:** Subject says, "I saw something, but I can't put it into words."
  *   **Procedure:**
      1.  Transcribe verbatim.
      2.  Commitment Score: Code based on confidence in the *ineffability* (usually 4 or 5).
      3.  Content Tag: `INEFFABLE_EXPERIENCE`.
      4.  **Do not** code as `NULL` or `MISSING_DATA`. A report of ineffability is a positive report of a limit.
  *   **Rationale:** The experience of "being indescribable" is the phenomenon being recorded.

  ### The Limit of Neutrality (When to Flag to PI)
  *   **Scenario:** The report violates physical laws or task instructions in a way that suggests the subject is not participating (e.g., "I saw the back of my own head," or "I saw the word 'APPLE' when the task was to watch a dot").
  *   **Procedure:** Flag `PROTOCOL_VIATION`.
  *   **Rationale:** Heterophenomenology treats the subject as a rational agent reporting on their world. If the report implies they do not understand the task constraints (e.g., they think they can see behind themselves), they are no longer a valid instrument for this specific task. This is the only place you judge the *subject*, not the *experience*.

  ***

  # Test Cases

  Here is how the HVRC protocol processes your three scenarios.

  ### Case 1: The Masked Face
  *   **Stimulus:** Mask (No Face).
  *   **Forced Choice:** Chance (0.5).
  *   **Report:** "I clearly saw a face. It was looking left." (Commitment: 5).
  *   **HVRC Coding:**
      *   **Transcript:** "I clearly saw a face..."
      *   **Commitment:** 5.
      *   **Content Tag:** `FACE`.
      *   **Relation Flag:** `MISMATCH`.
      *   **Internal Consistency:** Pass.
  *   **Outcome:** The data enters the spreadsheet as a **high-confidence report of a face** that mismatches the stimulus.
  *   **PI Friction Point:** **The PI will hate this.**
      *   **Why:** In a standard psychophysics lab, this trial is "False Alarm" noise. The PI likely wants to correlate consciousness with accuracy. By coding this as `Content: FACE` rather than `Content: ERROR`, you prevent the PI from filtering this subject out as "unreliable." It forces the PI to accept that the subject *phenomenologically* had a face experience, even if they were discriminatively blind. This undermines the "Objective Threshold" the PI likely wants to publish on. It turns a "failed trial" into a "successful report of illusion," which complicates the narrative that report = awareness.

  ### Case 2: Incompatible Reports (The "Accurate" Subject)
  *   **Stimulus:** Red Grating.
  *   **Subject A Report:** "Red Grating." (Forced Choice: 100%).
  *   **Subject B Report:** "Green Grating." (Forced Choice: 50%).
  *   **Independent Reason:** We know Subject A has better calibration.
  *   **HVRC Coding:**
      *   **Subject A:** `Content: RED`, `Relation: MATCH`.
      *   **Subject B:** `Content: GREEN`, `Relation: MISMATCH`.
      *   **Weighting:** **Equal.**
  *   **Outcome:** Both reports are logged as valid texts. Subject B is not coded as "worse" or "confabulating," only as "mismatched."
  *   **PI Friction Point:** The PI might want to use Subject A to validate the task and exclude Subject B. The protocol forbids excluding B based on the report alone. B's report is valid data about *what B reported*. If the PI wants to claim "Subject B was unconscious," this protocol blocks that inference from the verbal data alone.

  ### Case 3: The Paradoxical Report
  *   **Stimulus:** Word "TREE".
  *   **Report:** "I saw the word, but I'm certain I didn't see anything."
  *   **HVRC Coding:**
      *   **Transcript:** "I saw the word, but I'm certain I didn't see anything."
      *   **Commitment:** 5 (Certain about the contradiction).
      *   **Content Tag:** `WORD` + `NULL_EXPERIENCE`.
      *   **Internal Consistency:** **`INTERNAL_CONTRADICTION` FLAG.**
      *   **Action:** Flag to PI.
  *   **Outcome:** This lands in your queue.
  *   **Rationale:** This is the limit of neutrality. The subject is using "see" in two incompatible senses (perhaps "perceptual" vs. "cognitive"). The RA cannot resolve this. It requires a theoretical decision on which "see" counts for the lab's definition of consciousness.

  ***

  # Critical Analysis: The Smuggle and The Void

  You asked for the philosophical cost of this bookkeeping. Here it is.

  ### 1. Philosophy Smuggled as Bookkeeping
  The protocol claims neutrality, but it smuggles in **Functionalism**.
  *   **The Smuggle:** By treating "Indescribable" as a positive tag (`INEFFABLE_EXPERIENCE`), you are assuming the subject is reporting a *state* rather than a *failure of language*. A strict behaviorist might code this as "No Response." A heterophenomenologist codes it as "Report of Limit." You are forcing the RA to adopt a stance that privileges the subject's ontology over the behavior.
  *   **The Smuggle:** The `INTERNAL_CONTRADICTION` flag. Deciding what counts as a contradiction requires a theory of meaning. If a subject says "It was red but not colored," is that a contradiction? In some synesthetic frameworks, it might not be. By flagging it, the RA is enforcing standard logic onto the phenomenological text.

  ### 2. What The Procedure Can't Do
  *   **It Cannot Resolve the "Real" Consciousness Question:** This protocol generates a spreadsheet where `MISMATCH` trials look exactly like `MATCH` trials, except for the flag. It does not tell you if the subject was *actually* conscious in Case 1. It only tells you they *said* they were. If your PI wants to find the Neural Correlates of Consciousness (NCC), this protocol gives them the Neural Correlates of *Reporting*. These are not the same thing (the Postdiction problem).
  *   **It Cannot Handle "Lying":** Heterophenomenology brackets the truth of the report. If a subject is bored and pressing buttons randomly but saying "I saw it," this protocol codes that as valid data. It relies on the `PROTOCOL_VIolation` flag to catch this, but that only catches egregious errors, not strategic deception.
  *   **It Creates a Data Bloat Problem:** By refusing to label "Confabulation," you prevent the lab from filtering noise. Your PI will eventually face a dataset where 40% of the "Conscious" trials are `MISMATCH` flags. They will have to either abandon heterophenomenology to clean the data or publish a paper claiming that "Confabulation is a form of Consciousness."

  ### Summary Recommendation
  Run this protocol for two weeks. Collect the `MISMATCH` rates. When your PI sees that 30% of the "Conscious" data is phenomenologically robust but discriminatively chance, they will be forced to choose: either accept that report and accuracy dissociate (a hard sell for high-impact journals), or admit that heterophenomenology was a framing device, not a data-handling procedure.

  That is the moment you get your methodological contribution.
