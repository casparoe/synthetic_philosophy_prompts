  # Activity Design: The Tenure Committee Paradox
  **Time:** 75 Minutes  
  **Students:** 18 (Second-years, 1 lecture on Social Choice)  
  **Goal:** Experience the Discursive Dilemma (Doctrinal Paradox) via procedural reversal.

  ## 1. The Scenario: The Tenure Committee
  **Context:** The students are a University Tenure Committee. They must decide on a single candidate, Dr. Aris.
  **The Rule (Shared Logic):** University statute dictates that Tenure ($C$) is granted **if and only if** the candidate demonstrates *Research Excellence* ($P$) **AND** *Teaching Excellence* ($Q$).
  *   Logic: $(P \land Q) \leftrightarrow C$.
  *   Everyone agrees to this rule before starting. Disagreement is only on the facts/merits.

  **The Decision:**
  1.  **Round 1 (Conclusion-Based):** Vote directly on "Grant Tenure?" ($C$).
  2.  **Round 2 (Premise-Based):** Vote on "Research Excellence?" ($P$) and "Teaching Excellence?" ($Q$). The outcome of $C$ is determined logically by the majority on $P$ and $Q$.

  ## 2. Role Cards & Distribution
  **Preparation:** Print 18 cards. Use sealed envelopes to prevent pre-game collusion.
  **The Profile:** To guarantee the paradox and meet your specific constraint, the class is divided into four blocs.

  | Role | Count | Research ($P$) | Teaching ($Q$) | Tenure ($C$) | Motivation |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **The Purists** | 6 | **YES** | **YES** | **YES** | Candidate excels at both. |
  | **The Researchers** | 6 | **YES** | **NO** | **NO** | Research is great, teaching is poor. Statute says No Tenure. |
  | **The Educators** | 5 | **NO** | **YES** | **NO** | Teaching is great, research is poor. Statute says No Tenure. |
  | **The Pragmatist** | 1 | **NO** | **YES** | **YES** | **(Constraint Met)** Believes teaching outweighs research. Wants to grant tenure despite failing $P$. |

  **Math Check:**
  *   **Majority on $P$:** 12 Yes (Purists + Researchers) vs. 6 No. $\rightarrow$ **PASS**
  *   **Majority on $Q$:** 12 Yes (Purists + Educators + Pragmatist) vs. 6 No. $\rightarrow$ **PASS**
  *   **Majority on $C$:** 7 Yes (Purists + Pragmatist) vs. 11 No. $\rightarrow$ **FAIL**

  **The Paradox:**
  *   **Conclusion Vote:** Tenure Denied.
  *   **Premise Vote:** Research Passes, Teaching Passes $\rightarrow$ Tenure **Granted**.
  *   **The Pragmatist:** Is the specific cardholder who accepts $C$ while rejecting $P$. In Round 2, they will be forced to sign a verdict ($C$=Yes) that aligns with their desire, but derived from a premise ($P$=Yes) they personally rejected.

  **Distribution Procedure:**
  1.  Hand out envelopes at the door. Tell students: *"Do not open until instructed. Do not show your card to anyone. Your card contains your private assessment of the evidence. You are instructed to vote sincerely according to your card."*
  2.  **Incentive Scheme (Non-Monetary):** "Integrity Credit."
      *   Tell students: *"At the end, I will collect your card and your ballot stubs. If your votes logically match your card's private assessment, you receive full Participation Credit for the week. If you vote strategically to manipulate the outcome, you forfeit credit. I want your sincere judgment, not your game theory."*
      *   This prevents them from trying to "fix" the paradox and forces them to reveal it.

  ## 3. Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Rules**
  *   Explain the Tenure Scenario and the Statute ($P \land Q \leftrightarrow C$).
  *   Emphasize: *"We are all bound by this logic. You cannot vote Yes on Tenure if you vote No on both premises, unless you want to be in violation of University Statute."*
  *   Students open envelopes. Give them 3 minutes to read and internalize their position.

  **00:10 – 00:25: Round 1 (Conclusion-First)**
  *   **Procedure:** Secret Ballot on $C$ only.
  *   **Action:** Students mark "Grant" or "Deny". Collect ballots.
  *   **Tally:** Announce the result publicly. (Expected: **Deny**, 11-7).
  *   **Record:** Write "VERDICT: DENIED" on the board.
  *   **Commitment:** Have students sign a "Committee Record" sheet next to this verdict. (This creates the psychological weight of the decision).

  **00:25 – 00:40: Round 2 (Premise-First)**
  *   **Procedure:** Reset the room. *"The Dean has returned the file. She says we voted too quickly. She wants us to vote on the criteria first, and let the tenure decision follow the math."*
  *   **Action:** Secret Ballot on $P$ and $Q$ separately.
  *   **Tally:** Announce $P$ (Pass), Announce $Q$ (Pass).
  *   **Derivation:** Apply the Statute. $P$ (Yes) + $Q$ (Yes) $\rightarrow$ $C$ (Yes).
  *   **Record:** Write "VERDICT: GRANTED" on the board.
  *   **Commitment:** Have students sign the *same* "Committee Record" sheet next to this new verdict.
  *   **The Trap:** The **Educators** (5 students) and **Researchers** (6 students) must now sign a verdict ("Granted") that contradicts their direct vote in Round 1 and their personal judgment on $C$. The **Pragmatist** signs a verdict they like, but which rests on $P$ passing, which they personally voted No on.

  **00:40 – 00:50: The Reveal**
  *   Ask students to look at the board.
  *   Ask: *"Did the candidate change? Did the rule change? Did your private information change?"* (No, No, No).
  *   Ask: *"How did the truth flip?"*
  *   Allow 5 minutes of chaotic discussion. Let the confusion peak.

  **00:50 – 01:15: Debrief & Theory**
  *   **Map the Distinction:**
      *   **Conclusion-Based:** Aggregates *outcomes*. Respects the majority's direct will on the final question. Risks ignoring the logical reasons. (Democratic but potentially irrational).
      *   **Premise-Based:** Aggregates *reasons*. Enforces collective rationality. Risks overriding the majority's direct will on the outcome. (Rational but potentially undemocratic).
  *   **The "Rigging" Accusation:** (See below).
  *   **Judicial vs. Political:**
      *   *Court:* Judges share the law (the logic). They disagree on facts. Premise-based is standard here (find facts, apply law).
      *   *Committee:* Members disagree on values/weights. The "logic" ($P \land Q \to C$) is often a compromise itself. Here, the dilemma is deeper: it's not just about truth, but about *authority*. Who owns the conclusion? The majority of the moment, or the logic of the institution?
  *   **The Pragmatist:** Call out the single student with the inconsistent card (anonymously or voluntarily). *"One of you wanted Tenure despite Poor Research. In Round 1, you were in the minority. In Round 2, your desire was fulfilled, but only because the majority said Research was Good. You got your wish, but for a reason you rejected. Is that representation or manipulation?"*

  ## 4. Predictable Failures & Mitigation

  **1. The Accusation of Rigging**
  *   **Prediction:** At minute 00:45, a student will say: *"This only happened because you gave us specific cards. If we picked randomly, this wouldn't happen. You rigged the class."*
  *   **Your Response:** Do not deny it. **Lean into it.**
      *   *"Yes. I rigged the cards. But I did not rig the math. In the real world, preferences are 'rigged' by circumstance, ideology, and evidence. The point of Social Choice Theory is not to tell you what people want, but to tell you what happens when they want different things. If the outcome of a democratic vote depends entirely on whether the Chair calls for a vote on the reasons or the result, does the vote reveal the 'will of the people' or the 'will of the agenda-setter'?"*
  *   **Why this works:** It validates their skepticism while pivoting to the core theoretical point (Manipulability/Agenda Control).

  **2. Strategic Voting**
  *   **Prediction:** Students in the "Educators" bloc might realize in Round 2 that if they vote strategically on $P$, they can change the outcome.
  *   **Mitigation:** The "Integrity Credit" incentive. Remind them before Round 2: *"I will check your ballot against your card. Strategic voting voids your participation credit."*

  **3. Confusion on Logic**
  *   **Prediction:** Students may think $P$ and $Q$ are independent of $C$.
  *   **Mitigation:** Write the formula $(P \land Q) \leftrightarrow C$ on the board and keep it there. Refer to it as "The Statute."

  ## 5. Limitations (What You Must Supply By Hand)

  **1. The General Impossibility**
  *   **The Problem:** This activity demonstrates *existence* (there exists a profile where the paradox occurs). It does not demonstrate *impossibility* (List & Pettit's theorem: there is *no* procedure that satisfies all desirable conditions for all profiles).
  *   **The Fix:** In the debrief, be explicit: *"Today we saw that the paradox **can** happen. The theorem says you cannot design a voting system that guarantees it **won't** happen without sacrificing something else (like giving one person a veto, or abandoning logic). We found a bug in democracy; the theorem proves the bug is in the code, not just this specific program."*

  **2. The "Shared Logic" Assumption**
  *   **The Problem:** The exercise assumes everyone accepts $(P \land Q) \leftrightarrow C$. In real politics, people often disagree on the logical connection itself (e.g., "Teaching shouldn't matter for tenure").
  *   **The Fix:** Distinguish this in the "Judicial vs. Political" debrief. *"In a court, the law is the shared logic. In a legislature, the logic is often the thing being fought over. The Discursive Dilemma is most dangerous when we pretend we share a logic that we actually don't."*

  **3. The Single Profile**
  *   **The Problem:** You are showing one snapshot.
  *   **The Fix:** Acknowledge that in many profiles, the two methods agree. The danger is that the Chair doesn't know which profile they have, so they can always *choose* the method that yields their preferred outcome if they suspect a paradox profile exists. This highlights the power of **Procedural Control**.

  ## 6. Instructor's Script for the "Rigging" Moment
  *When the student accuses you:*

  > "You are absolutely right. I assigned these roles to ensure we would see the phenomenon. But ask yourself: In a real hiring committee, do the members arrive with random opinions? Or do they arrive with formed judgments based on evidence, just like your cards?
  >
  > If I am the Chair, and I know the profile looks like this, and I want the candidate hired... I call for a vote on the Premises. If I want them rejected... I call for a vote on the Conclusion.
  >
  > I didn't rig the math. I rigged the *demonstration*. But in the real world, the person who writes the agenda rigging the *outcome*. That is what we are here to study."

  ## 7. Materials Checklist
  *   18 Envelopes (labeled 1-18 for your tracking, not student visible).
  *   18 Role Cards (6 Type A, 6 Type B, 5 Type C, 1 Type D).
  *   2 Sets of Voting Slips (Blue for Round 1, White for Round 2).
  *   1 Large "Committee Record" Poster (for signatures).
  *   Whiteboard marker (Red for Round 1 result, Green for Round 2 result).

  This design stages your dispute perfectly. Your friend argues for Premise-First (Rationality/Consistency); you argue for Conclusion-First (Democratic Will/Agency). The activity proves both are vulnerable to the other's critique, leaving the students in the productive discomfort you desire.
