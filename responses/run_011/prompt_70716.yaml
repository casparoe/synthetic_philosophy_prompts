answer: |-
  The Ledger sat on the bluff above the harbor, a brutalist block of concrete stained by eighty years of salt spray. Inside, the air was always cool and smelled of ozone and old paper. For eight decades, the Ledger's purpose had been simple: predict the storm surges. Anyone could lodge a method—a formula, a neural net, a rule of thumb based on barometric pressure. Each year, the method with the lowest error over the preceding decades was promoted to official use. When the official method said the water would rise, the sea barriers clanked shut. When it said the water would stay low, the harbor remained open for trade.

  Councilor Vane proposed the amendment on a Tuesday. She was a reformer who spoke often about impartiality. She argued that scoring methods against the single actual history of the city was parochial. It privileged the past merely because it had happened.

  "The world could have been otherwise," Vane told the committee. "Our current charter assumes that the future will resemble the past. That is an assumption, not a fact. The only impartial rule is to score each method by averaging its performance over every possible sequence of weather compatible with the historical record, each weighted alike. We must judge the methods not on what happened, but on what could have happened."

  The charter was amended. The Ledger's actuaries ran the numbers. They took the dynamical model that had kept the city dry for twenty years. They took the naive method that simply predicted tomorrow would be like today. They took the contrarian method that predicted the opposite of today. They generated every logically possible sequence of weather that matched the eighty years of data already in the books, weighted them uniformly, and calculated the expected error for each method.

  The result was a tie.

  Every method scored identically. The skillful model, the naive copy, the contrarian inversion—all had the same expected error under the new rule. The tie was not a defect of calculation; it was exactly what impartiality of that kind cost.

  Kael, the chief engineer, tried to break the deadlock. He built a meta-procedure, a selector that analyzed the competing methods and chose the one that looked most robust. He lodged this selector with the Ledger. But under the amended charter, the selector itself had to be scored over all possible worlds. Kael ran the simulation again. The selector tied with the methods it selected. He built a selector for the selectors. It also tied.

  "There is no vantage point," Kael told Elara, the Chief Actuary, three weeks later. He looked exhausted. "Every time I build a rule to choose a rule, the charter demands I average over all worlds where that higher-order rule might fail. The tower doesn't terminate. There is no view from nowhere."

  Elara nodded. She had expected this. The mathematics was clean, almost beautiful in its symmetry. But the sea outside did not care about symmetry.

  That evening, Elara found Vane in the council chambers, reviewing the impact statements. Vane's son, Leo, was there, coloring on the floor with a set of blocks. He was seven.

  "Councilor," Elara said. "We need to talk about the tie."

  "I read the report," Vane said without looking up. "It confirms the theorem. All methods are equal under the impartial weighting."

  "All methods are equal under *that* weighting," Elara corrected. "May I borrow Leo for a moment?"

  Vane waved a hand. Leo looked up, curious. Elara sat on the floor beside him. She took two blue blocks and two grey blocks.

  "Leo," she said. "Let's make a world. This world only lasts for two days. On each day, the weather can be Clear (blue) or Overcast (grey)."

  She placed a blue block. "Day one is Clear. Now, what can happen on Day two?"

  "Clear or Grey," Leo said, placing a blue block and then a grey one next to it.

  "Right. So there are two possible histories for this world: Clear-Clear and Clear-Grey. Now, imagine two forecasters. Forecaster A says Day two will be the same as Day one. Forecaster B says Day two will be the opposite."

  Leo pointed to the blocks. "A says Blue. B says Grey."

  "Exactly. Now, if the real world is Clear-Clear, who wins?"

  "Forecaster A."

  "And if the real world is Clear-Grey?"

  "Forecaster B."

  Elara arranged the blocks so Leo could see both possibilities side by side. "If we don't know which world we are in, and we say both worlds are equally likely, what is the score for A and B?"

  Leo counted on his fingers. "They both win once and lose once. It's a tie."

  "Yes. Now, suppose we have a third forecaster, C. C looks at how A and B did yesterday and picks the winner. But in this two-day world, there is no yesterday for the forecasters. Even if we make the world three days long, any rule C uses to pick between A and B will be right in some possible worlds and wrong in others. If we count all possible worlds equally, C ties with A and B."

  Leo frowned. "But we live in one of them. Not all of them."

  Elara felt a sharp pang in her chest. "Yes, Leo. We do."

  She stood up and turned to Vane. "Your amendment forces us to treat all possible worlds as equally likely. It forces us to pretend we don't know if the weather is sticky or oscillating. Under that pretense, no method is better than another. That is the theorem."

  "That is impartiality," Vane said. "We cannot assume the weather is sticky just because it has been sticky for eighty years. That is circular."

  "It is not circular," Elara said, her voice tightening. "It is inductive. The old charter assumed the future resembles the past. Your charter assumes all futures are equally likely. Both are assumptions. Yours is just more expensive."

  "The cost of bias is higher," Vane countered. "If we assume the future resembles the past, and it doesn't, the barriers fail. If we assume all futures are possible, we admit our ignorance. We don't raise the barriers on false confidence."

  "If we admit total ignorance, we cannot justify raising the barriers at all," Elara said. "The dynamical model says raise them tomorrow. The inversion model says lower them. Under your rule, they are equally valid. So what do we do? Flip a coin?"

  "We distribute the risk," Vane said. "We do not privilege one narrative of the weather over another."

  "The water does not distribute itself," Elara said. "It rises or it doesn't. If we lower the barriers because the 'invert' method tied for first place, the city floods. If we raise them because the 'dynamic' method tied, we lose trade. The tie is not a solution. It is a paralysis."

  "The paralysis is the truth," Vane said. "The theorem proves that without an assumption about the world, we know nothing. So let us be honest about knowing nothing."

  Elara looked down at the blocks on the floor. Leo had stacked them into a tower, blue over grey over blue. He had imposed a pattern on the randomness. He was playing a game where some moves were better than others. He was not playing under the amended charter.

  "The theorem is true," Elara said quietly. "I do not dispute the math. Averaged over all possible worlds, we know nothing. But we are not in all possible worlds. We are in Oros. We are on this coast. The old charter weighted the possible worlds by their similarity to our history. It assumed nature is uniform. Your charter weights them uniformly. It assumes nature is random."

  "Nature is not random," Vane said. "But our knowledge is."

  "Our knowledge is limited, yes. But our survival depends on betting that nature is uniform." Elara picked up the blue block. "This amendment makes the Ledger's weighting explicit. It says: 'We assign equal probability to all continuations.' That is a physical claim. It is Hume's problem of induction wearing formal dress. You cannot defend this weighting by any argument inside the office that does not already presuppose a weighting."

  Vane stood up. She walked to the window. The harbor lights were flickering on. The forecast for tomorrow was severe. The dynamical model called for the barriers to be raised at dusk. The inversion model called for them to stay open. Under the old charter, the barriers would rise. Under the new charter, the Ledger had no basis to choose.

  "If I refuse to sign," Vane said, "I uphold a bias I cannot prove. If I sign, I uphold a truth that may drown us."

  "You uphold a truth about *all worlds*," Elara said. "Not this one."

  "There is no way to tell the difference from inside the office," Vane said. "That is your point, isn't it? We cannot step outside the Ledger to check the weighting."

  "No," Elara said. "We cannot. But we can remember why the office was built. It was not built to be impartial. It was built to keep the water out."

  Vane turned from the window. She looked at the pen on the desk, then at Leo, who was still stacking blocks, trusting that gravity would hold the tower together. He was not averaging over worlds where gravity might reverse. He was betting on this one.

  Vane picked up the pen. She hovered it over the amendment.

  "If I sign," Vane said, "the Ledger must announce that no method is preferred. The barriers will remain at local discretion. The city loses the central coordination."

  "If you don't sign," Elara said, "the Ledger continues to bet on uniformity. We might be wrong. But we will be decisive."

  Vane signed the amendment.

  "The truth is too heavy to carry alone," Vane said. "I will not burden the city with a lie about certainty. Let the neighborhoods decide. Let them make their own assumptions."

  Elara nodded. She gathered the blocks from the floor. "Then the Ledger is closed."

  She walked out into the cool air. The sky was darkening. Somewhere below, the sea was rising. The barriers remained open, waiting for a consensus that would not come. Elara knew the dynamical model was likely right. She knew the uniform weighting was likely wrong for this coast. But the charter was the law, and the law had chosen impartiality over survival.

  She watched the harbor. A fishing boat was coming in, fast. The captain was making his own bet. He was assuming the water would stay low. He was assuming the future would resemble the past. He was assuming Hume was wrong.

  Elara hoped he was right.

  ***

  **Afterword**

  This narrative presupposes the "learning" version of the No-Free-Lunch (NFL) theorem (Wolpert 1996), rather than the optimization version (1997), as the Ledger selects predictive models based on past error. I compressed the technical distinction between "compatible with historical record" and "all possible functions"; strictly, NFL averages over all target functions, but the result holds for any distribution over functions that is uniform over the unseen data points given the training data. The story relies on the claim that *mean* performance is identical across methods under uniform weighting, rather than the stronger claim that the entire performance distribution is identical, though the dramatic stakes imply the latter.

  The story favors the pragmatist camp (Elara): those who argue NFL is true but irrelevant to practice because we never face a uniformly random environment. Vane represents the view that NFL encodes a deep epistemic insight about the necessity of explicit bias. The narrative does not settle this by fiat; Vane's decision has negative consequences (loss of coordination), but her ethical stance (avoiding false certainty) remains defensible.

  Identifying the weighting over possible worlds with Hume's uniformity of nature is licensed by philosophical literature (e.g., Schurz 2008), though it is a reconstruction. Hume argued we cannot justify induction; NFL formalizes that any induction strategy requires an assumption (bias) that cannot be justified empirically without circularity. The story treats this identification as valid, suggesting that the charter's weighting *is* the metaphysical assumption, making the choice of weighting a practical wager rather than a logical deduction.
