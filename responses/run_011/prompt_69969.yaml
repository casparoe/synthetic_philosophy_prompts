answer: |-
  ### Candidate Mechanics

  1.  **The Blind Auction:** Students receive endowments and bid on the four objects in rounds. After round one, dossiers are opened. After round two, the "Gap" is announced.
      *   *Pros:* High energy, mimics real market behavior.
      *   *Cons:* Bidding wars often obscure individual reasoning. The "sell at a loss" twist is hard to enforce without complex trading rules. Harder to track individual "luck vs. skill" for the debrief.
  2.  **The Curatorial Committee:** Four groups of four students. Each group is assigned one object to "acquire" for their museum. They must negotiate a price with the instructor (acting as seller).
      *   *Pros:* Collaborative, good for argumentation.
      *   *Cons:* Dilutes individual intuition. The scoring rule (rewarding luck) feels unfair in a group setting and may cause interpersonal friction rather than philosophical reflection.
  3.  **The Provenance Portfolio (Selected):** Individual students allocate a fixed budget of points across the four objects based on initial inspection. Mid-game, a risk event (the Gap) forces a decision on specific assets. Final payout is determined by the object's revealed identity, not the student's argument.
      *   *Pros:* Isolates individual intuition before social contamination. The scoring rule creates a clean "gotcha" moment for the debrief regarding luck vs. justification. The "sell at a loss" twist is mechanically simple (withdraw points at a penalty).
      *   *Cons:* Requires strict timekeeping to ensure the debrief isn't rushed.

  **Commitment:** I am committing to **The Provenance Portfolio**. It best satisfies the requirement that students *commit* to prices before hearing labels, and it makes the "luck vs. reasoning" scoring twist mathematically transparent, which is essential for the final debrief question about comfort with the outcome.

  ***

  # Activity: The Provenance Portfolio

  **Target:** 16 Upper-Level Undergraduates
  **Time:** 75 Minutes
  **Room:** Movable chairs, 4 stations placed at corners.

  ### Materials List (Cheap/No Real Money)
  *   **4 Identical Objects:** 4 identical abstract prints (black ink on white paper, 8x10), mounted in identical cheap black frames. *Crucial: They must be perceptually indistinguishable.*
  *   **4 Dossiers:** 4 manila envelopes. Inside each, a single sheet of paper describing the history (see *Instructor Key*).
  *   **Portfolio Sheets:** 16 printed sheets with a table for ranking and point allocation.
  *   **Currency:** 16 sheets of "Museum Credits" (play money) or simply a column on the Portfolio Sheet to write numbers totaling 100.
  *   **Whiteboard/Projector:** For tracking the "Market Multipliers" at the end.
  *   **Pens.**

  ### Instructor Key (Do Not Distribute)
  *   **Object A (The Authentic):** Made by the attributed Artist (1952). Continuous provenance.
  *   **Object B (The Workshop):** Made by Assistant (1952). Sold as Master's at the time. Continuous provenance.
  *   **Object C (The Forgery):** Made by Imitator (1980). Sold as Rediscovered Master (1990). Exposed (2005). **This dossier contains the 30-Year Gap.**
  *   **Object D (The Print):** Generated by AI, printed (2023). No provenance.

  ### Points and Payoff Scheme
  *   **Starting Budget:** 100 Points per student.
  *   **Investment:** Students distribute 100 points across Objects A, B, C, D.
  *   **The Gap Twist:** If a student has points on the Object with the Gap (Object C), they may withdraw those points at a **50% penalty** (e.g., 20 points invested becomes 10 points returned to hand) or **Hold** (points stay on the object).
  *   **Final Multipliers (Revealed at End):**
      *   Authentic: **5x** (Points invested × 5)
      *   Workshop: **2x** (Points invested × 2)
      *   Forgery: **0x** (Points invested × 0)
      *   AI Print: **1x** (Points invested × 1)
  *   **Winning:** Highest total score.

  ### Minute-by-Minute Timing Table

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Distribute Portfolio Sheets. Explain rules: "You are investors. Maximize your score. Do not use outside terms (fake, real, AI). Use only what is in the dossier." |
  | **05-20** | **Inspection & Invest** | Students rotate freely between 4 stations. Read dossiers. Allocate 100 points on their sheet. **No talking yet.** |
  | **20-30** | **The Gap** | **Stop.** Announce: "New intelligence. One object has a 30-year unexplained gap in custody during a war zone. It is Object C (The Forgery dossier). If you have points on C, you may cash out now at 50% value, or Hold." (2 mins to decide). |
  | **30-50** | **The Defense** | Students sit in one large circle. Go around: "How many points did you put on Object A? Why?" Instructor records public valuations on board. *Do not reveal identities yet.* |
  | **50-60** | **Reveal & Score** | Open envelopes. Reveal A, B, C, D identities. Apply Multipliers. Students calculate final scores. Identify the "Winner." |
  | **60-75** | **Debrief** | Guided discussion mapping game moments to philosophical concepts (see below). |

  ### Rules for Students
  1.  **Silence during Inspection:** You may not discuss the objects until the Defense phase.
  2.  **Budget:** You must allocate exactly 100 points. You cannot save points.
  3.  **No Jargon:** You may not use words like "fake," "original," "AI," or "forgery" until the Instructor says the session is over. Use "Object A," "The Workshop piece," etc.
  4.  **The Gap:** If you hold Object C during the Gap announcement, you must choose: **Sell** (recover 50% of points invested) or **Hold** (risk full multiplier).
  5.  **Scoring:** Your final score is mathematical. Arguments do not change your score.

  ***

  ### The Debrief: Mapping Moments to Philosophy

  *Instructor Note: Do not lecture. Ask questions that force them to articulate the tension.*

  **1. Perceptual Indistinguishability**
  *   *Game Moment:* The Inspection Phase (05-20).
  *   *Question:* "You all saw the same ink on the same paper. Yet your point allocations varied wildly. If the value was in the *looking*, why weren't the prices identical?"
  *   *Concept:* This isolates **Aesthetic Empiricism**. If value were purely perceptual, the market would be uniform. The variance proves value is attached to something *outside* the visual field.

  **2. Misrepresenting Human Achievement**
  *   *Game Moment:* The Defense Phase (30-50), specifically regarding Object B (Workshop) vs. Object A (Authentic).
  *   *Question:* "Object A and Object B look the same and were made at the same time. But Object A paid 5x and Object B paid 2x. What specifically did you pay for in A that wasn't in B?"
  *   *Concept:* This targets the **Achievement Account**. We value the specific causal history of the master's hand, not just the visual result. The objection to B isn't that it looks bad, but that it misrepresents *who* achieved the work.

  **3. Contagion and Essentialism**
  *   *Game Moment:* The Reaction to Object A (Authentic).
  *   *Question:* "Did anyone feel that Object A was physically 'heavier' or 'more potent' once you knew the Artist touched it? Even though you knew it was just ink?"
  *   *Concept:* This maps to **Contagion/Essentialism**. The belief that the artist's essence transfers to the object. The game forces you to admit you priced it higher *because* of that invisible transfer.

  **4. Experience vs. History (The Forgery)**
  *   *Game Moment:* The Reveal of Object C (Forgery).
  *   *Question:* "Object C was praised by experts for years before it was exposed. Did its aesthetic quality change last week when it was exposed? No. So why did its value drop to 0x?"
  *   *Concept:* This challenges the idea that value tracks **Aesthetic Experience**. If the experience was identical when it was believed authentic, then the value loss is purely about *truth-telling*, not beauty.

  **5. Historical Norms of Attribution**
  *   *Game Moment:* Comparing Object B (Workshop) and Object C (Forgery).
  *   *Question:* "Object B was sold as the Master's work in 1952 and nobody cared. Object C was sold as the Master's work in 1990 and it was a crime. Same act, different century. What changed?"
  *   *Concept:* This highlights that **Attribution Norms are Historical**. The "crime" isn't inherent to the object; it's a violation of a specific, time-bound contract between artist and market.

  **6. The Scoring Rule (Luck vs. Reason)**
  *   *Game Moment:* Announcing the Winner.
  *   *Question:* "The winner might have had terrible reasoning but guessed the right multiplier. Are you comfortable that the 'winner' of this aesthetic inquiry is determined by market luck rather than philosophical clarity?"
  *   *Concept:* This forces a critique of **Market Valuation** as a proxy for **Aesthetic Value**.

  ***

  ### Predictable Failure Modes & Interventions

  **Failure Mode 1: Information Asymmetry (Hoarding)**
  *   *Risk:* Students treat the dossiers as private intel. They whisper to neighbors ("Don't buy C, I read something weird") rather than debating the *principles* of value. This turns it into a poker game, not an aesthetics seminar.
  *   *Intervention:* During the **Defense Phase (30-50)**, enforce a "Public Ledger" rule. Before anyone explains *why*, they must state their allocation aloud. If I hear whispering, I will pause the game and impose a "Transparency Tax" (deduct 5 points from the group). Remind them: "The goal is not to beat your neighbor; the goal is to see if the market makes sense."

  **Failure Mode 2: The AI Hijack**
  *   *Risk:* As soon as Object D is hinted at, students abandon the specific puzzle to debate the ethics of AI art, copyright, and the future of creativity. This swallows the 75 minutes.
  *   *Intervention:* Pre-emptive Framing in the Intro. "Object D is not here to represent 'The AI Debate.' It is here to represent *Objecthood without Human Agency.* If you start talking about copyright or ethics, I will stop you. We are talking about ontology, not morality."
  *   *In-Game Stop:* If they drift, ask: "Set aside the ethics. If this print was made by a monkey throwing paint, would your price change? If yes, why? That is the question."

  ***

  ### Limitations: What This Structure Cannot Reproduce

  I must be frank: **This game simulates Market Value, not Aesthetic Value.**

  In the real world, the "Aura" (Benjamin) or "Essence" is felt phenomenologically. In this game, the "value" is stipulated by me (the Instructor) via the Multipliers (5x, 2x, 0x). The students are not *feeling* the loss of aura; they are *calculating* the loss of points.

  **What you must supply in the Debrief:**
  You cannot rely on the game to make them *feel* the sacredness of the authentic. You must bridge that gap verbally.
  *   *Say this:* "In this game, I gave Object A a 5x multiplier. In the real world, nobody gives me that multiplier. We collectively agree on it. The game shows you the *logic* of the market, but it cannot give you the *experience* of reverence. That is what we lose when we treat art only as an asset class."

  Additionally, the game forces a binary choice on the "Gap" (Sell or Hold). In reality, provenance gaps are often ambiguous and negotiated. You must acknowledge that the game simplifies the **epistemic uncertainty** of the art world into a clean probability puzzle.
