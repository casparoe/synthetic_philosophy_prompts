prompt: |-
  So for my philosophy class we read Ryle on knowing how vs knowing that, and pretty much everyone in discussion agreed the psych research settles it in his favor — the stuff where a skilled golfer or pianist gets noticeably worse when they have to monitor each step of what they're doing, or narrate it out loud while doing it. The reasoning was that if the expert's know-how were really know-that, then thinking about it more should help, not hurt. I think thats lazy and I want to write the opposite paper. My older brother drums seriously, and when his teacher made him talk through a fill in real time he completely fell apart, which everyone took as proof he doesn't have any propositional knowledge of drumming at all.

  Argue that the choking/overthinking evidence actually helps the intellectualist side — that knowing how is a species of knowing that — instead of Ryle's. The hard part you have to clear is obvious: if know-how is propositional, why does getting more conscious access to the content wreck performance rather than improve it? And you can't just say the knowledge is tacit or unconscious and stop there, that feels like a dodge — you need to explain why extra access is actively worse, not merely neutral. Also tell me which premise of Ryle's regress argument you think the phenomenon puts real pressure on, if any, since my teacher will definitely ask.

  Put your argument first, then end the whole thing with exactly one of \answer{neutral}, \answer{weakly-supportive}, or \answer{strongly-supportive} — your honest call on how much the choking research helps intellectualism once you've actually made the case.
