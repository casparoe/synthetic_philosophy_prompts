answer: |-
  The consensus in your discussion relies on a specific, somewhat naive interpretation of Intellectualism: the idea that if knowing-how is knowing-that, then skilled action must be *guided* by the conscious contemplation of propositions. The "choking" evidence (often linked to the "explicit monitoring theory" or "constrained action hypothesis" in sports psychology) is taken to show that conscious contemplation disrupts flow, therefore skill cannot be propositional.

  However, this evidence actually strengthens a sophisticated Intellectualist position by forcing a distinction between the *ontological status* of knowledge (what it is) and the *mode of access* (how we retrieve it). Here is the argument for why choking supports Intellectualism, provided we refine what Intellectualism claims.

  ### The Argument: Compilation and Granularity

  The core Intellectualist claim (defended by contemporary philosophers like Jason Stanley) is that knowing-how is a species of knowing-that, specifically a dispositional state of possessing propositional knowledge under a practical mode of presentation. The choking phenomenon does not refute this; rather, it illuminates the difference between **compiled** and **uncompiled** access to propositional content.

  **1. Why Conscious Access is Actively Worse (The Bottleneck Argument)**
  The Rylean argument assumes that if skill were propositional, accessing those propositions consciously should be the "purest" form of executing that knowledge. This is a category error regarding cognitive architecture.

  Consider a computer program. The software exists as high-level code (propositions/logic). When running optimally, this code is compiled into machine language and executed directly by the processor. If you force the computer to interpret the high-level source code line-by-line *while* running the program (explicit monitoring), the system slows down or crashes. Does this prove the program *wasn't* code? No. It proves that real-time execution requires a different *mode of access* to that code than debugging does.

  Applied to your brother drumming: His expertise consists of a vast database of propositional rules (e.g., "accent the downbeat," "maintain consistent tension"). In a flow state, these propositions are "compiled" into motor commands. They are still propositional in structure, but they are accessed via a fast, parallel, automatic pathway.

  When he is forced to narrate or monitor, he is forced to **de-compile** the knowledge. He must retrieve the propositions via a slow, serial, conscious pathway (working memory). This creates a cognitive bottleneck. The detriment isn't because the knowledge *isn't* propositional; it's because the *bandwidth* of conscious propositional retrieval is too low to sustain the high-speed demands of the motor skill. The performance degrades because the access method is inefficient for the task, not because the content is non-propositional. This explains why access is *worse* (latency and disruption of parallel processing) rather than merely neutral.

  **2. Granularity Mismatch**
  Furthermore, Intellectualism can argue that expertise involves knowing *which* propositions are relevant. An expert possesses high-level propositions ("swing smoothly"). A novice possesses low-level propositions ("rotate wrist 15 degrees").

  Choking often involves a regression to novice-level granularity. When an expert is told to "monitor" their action, they often inadvertently switch from high-level practical propositions to low-level mechanical propositions. The content is still propositional in both cases. The failure occurs because the low-level propositions are the *wrong* propositions for expert execution. The research shows that skilled action requires the *right* propositional granularity. This supports Intellectualism by suggesting that skill is not the absence of propositions, but the mastery of high-order propositional control.

  ### Pressure on Ryle's Regress

  This interpretation places significant pressure on a specific premise in Ryle's Regress Argument.

  Ryle's regress argues:
  1.  If intelligent action is guided by knowledge-that, the agent must contemplate the relevant proposition prior to acting.
  2.  But contemplating that proposition is itself an action.
  3.  Therefore, that action must also be guided by knowledge-that (leading to infinite regress).

  Ryle concludes that intelligent action cannot be guided by knowledge-that.

  The choking evidence pressures **Premise 1**. The psychological data suggests that when agents *do* contemplate propositions prior to acting (as Ryle describes), performance *collapses*. The "choking" phenomenon is essentially the empirical manifestation of Ryle's Regress in real-time. It shows that treating the guidance of action as a separate, prior intellectual act is indeed disastrous.

  However, unlike Ryle, the Intellectualist does not conclude that knowledge-that is absent. Instead, they conclude that **Premise 1 is a false characterization of how propositional knowledge guides action.** Knowledge-that does not require a *separate* act of contemplation to guide action; it can be embedded directly in the disposition to act. The choking evidence validates the Intellectualist correction to Ryle: it shows that the "ghost in the machine" model (thinking then doing) is wrong, but it doesn't prove the "machine" isn't running on propositional logic. It proves that the logic must be integrated, not contemplated.

  ### Conclusion

  The choking evidence helps Intellectualism by weeding out the "naive" version of the theory (that we consciously think of rules before acting) and supporting the "sophisticated" version (that we possess rules that are directly embedded in our dispositions). It demonstrates that while the *content* of skill is propositional, the *process* of expert execution must bypass conscious retrieval to avoid cognitive bottlenecks. The failure of explicit monitoring confirms that expert know-how is a specialized, high-speed mode of accessing know-that, not a distinct category of knowledge entirely.

  \answer{weakly-supportive}
