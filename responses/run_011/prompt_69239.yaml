answer: |-
  You are right to be suspicious of the singular noun. "American Exceptionalism" is not a theory; it is a vocabulary. It is the language in which American political conflicts are conducted, which means it can be spoken fluently by opposing sides to mean contradictory things.

  The Philippine annexation debate (1898–1902) is the perfect stress test because it is the moment the U.S. transitioned from a continental republic to an overseas empire. Both sides claimed to be the true heirs of 1776.

  Here is the sorting of the arguments, followed by an evaluation of whether the concept does any analytical work beyond materialism, and finally, a look at how the *Insular Cases* break the frame.

  ### 1. Sorting the Arguments: Three Faces of Exceptionalism

  To make the concept useful, we have to separate the *descriptive* (what we are), the *prescriptive* (what we must do), and the *functional* (what work this language performs).

  **A. Exceptionalism as Historical Thesis (What America *Is*)**
  *   **McKinley/Pro-Imperialists:** America is a unique historical agent, a "chosen nation" with a providential trajectory. Just as the continent was destined to be settled, the Pacific is the next stage. The U.S. is not a normal state; it is a vehicle for civilization.
  *   **Anti-Imperialists (e.g., George Frisbie Hoar):** America is a unique political artifact defined by the Declaration of Independence. Its essence is "consent of the governed." If it acquires subjects, it ceases to be America and becomes just another empire (Rome, Britain).
  *   **The Conflict:** One side defines American identity by its *mission* (expansion of liberty/civilization); the other by its *mechanism* (republican consent).

  **B. Exceptionalism as Normative Claim (What America *Owes*)**
  *   **McKinley/Pro-Imperialists:** The "Duty to Uplift." Because America is uniquely virtuous and capable, it owes the "lesser breeds" (in the parlance of the time) education, Christianity, and order. To withdraw would be a moral dereliction.
  *   **Anti-Imperialists (e.g., Carnegie, Twain):** The "Duty to Remain Pure." America owes the world an example of a free republic. By conquering the Philippines, it owes them nothing but liberation, because holding them corrupts the metropole. As Carnegie argued, empire abroad kills democracy at home.
  *   **The Conflict:** One side argues exceptionalism requires *intervention*; the other argues it requires *restraint*.

  **C. Exceptionalism as Ideology (Self-Description as Justification)**
  *   **McKinley/Pro-Imperialists:** This is the "smokescreen" function. When McKinley claimed God told him to annex the islands to "educate and uplift," he was translating strategic necessity (naval coaling stations, preventing German expansion) into moral imperative. Exceptionalism here renders power palatable to a republican electorate.
  *   **Anti-Imperialists:** This is the "constraint" function. They used the language of exceptionalism to box the administration in. By insisting that "Americans don't do colonies," they made the administrative cost of empire higher. (Note: Some Anti-Imperialists, like Gompers, also used it ideologically to mask labor protectionism—fearing Filipino labor competition—by wrapping it in constitutional purity).

  ### 2. Does the Frame Earn Its Keep?

  If we strip away the rhetoric, we have:
  *   **Markets:** Access to China (the Open Door).
  *   **Strategy:** Mahanian naval stations (Pearl Harbor, Manila Bay).
  *   **Race:** Anxiety about incorporating non-white populations (a major driver for Anti-Imperialists who didn't want Filipinos as citizens).
  *   **Politics:** The 1900 election (McKinley needed a foreign policy victory; Bryan ran on anti-imperialism and lost).

  **So, does "Exceptionalism" explain anything these material factors don't?**

  **Yes, but only regarding *form* and *limits*, not *motive*.**

  Materialism explains *why* the U.S. wanted the Philippines. It does not explain *how* the U.S. governed them or why the debate was so ferocious.
  1.  **The Form of Empire:** Britain built colonies to stay colonies. The U.S., constrained by its own exceptionalist rhetoric, built the Philippines as a "colony in trust." The explicit goal, codified in law (Jones Act 1916), was eventual independence. A purely materialist analysis might predict permanent extraction. Exceptionalism explains the *exit strategy*. The U.S. could not admit to being a permanent empire without violating its historical thesis.
  2.  **The Limits of Action:** The Anti-Imperialists didn't stop the annexation, but they successfully prevented the incorporation of the Philippines into the Union. They forced a distinction between "possessions" and "states." Material interests would have preferred clarity; exceptionalist ideology forced a legal limbo.
  3.  **The Language of Power:** If you ignore exceptionalism, you miss why McKinley felt compelled to give the "night of prayer" speech. He knew he couldn't sell "naval bases" to the Midwest; he had to sell "Christianizing 8 million people." The ideology dictated the marketing, which in turn dictated the policy implementation (schools and roads built alongside garrisons).

  **Verdict:** Exceptionalism is not the *engine* of policy, but it is the *transmission*. It determines how power is applied. Without it, you understand the destination, but not the route.

  ### 3. The Breaking Point: The *Insular Cases*

  This is where your skepticism is most warranted. In the *Insular Cases* (1901), the Supreme Court ruled that the Constitution does not automatically follow the flag. They invented the category of "unincorporated territory"—land that belongs to the U.S. but is not *of* the U.S.

  **Is this exceptionalism working as intended, or does it break the concept?**

  It breaks the **Normative** and **Historical** versions, but it confirms the **Ideological** version in its darkest form.

  1.  **Breaking the Normative:** If exceptionalism is a claim that America owes *more* justice than other nations, the *Insular Cases* are a repudiation. They explicitly legalized a zone where American rights did not apply. This is not "uplifting"; it is administrative convenience dressed in legal theory.
  2.  **Breaking the Historical:** If America is historically defined by the Constitution, these cases admit that the Constitution is optional based on geography and race (the opinions explicitly discuss the "alien races" of the territories).
  3.  **Confirming the Ideological:** This is exceptionalism as **Exemption**. It posits that America is so unique, so sovereign, that it can create legal black holes that other nations cannot. It is the claim that the U.S. is exceptional not because it follows higher laws, but because it is the *source* of law and can suspend it at will.

  **The Analytical Failure:**
  If you use "American Exceptionalism" only in the positive sense (the "City on a Hill" model), the *Insular Cases* look like an anomaly or a betrayal. But if you view exceptionalism as **sovereign discretion**—the idea that American power is sui generis and not bound by external or even internal norms when inconvenient—then the *Insular Cases* are the logical conclusion.

  ### Conclusion

  The frame earns its keep only if you treat "American Exceptionalism" not as a belief system, but as a **grammar of power**.

  *   **Materialism** tells us the U.S. wanted the Philippines for trade and navy access.
  *   **Exceptionalism** tells us why they couldn't just call it a colony, why they had to promise independence, and why the Supreme Court had to invent a new legal category to square the circle.

  In 1898, exceptionalism was not a lie, nor was it the truth. It was the **constraint**. It prevented the U.S. from becoming a classic European empire (permanent subjugation), but it also provided the cover to become a new kind of empire (hegemony without citizenship).

  The concept breaks when scholars use it solely as a compliment. In the Philippine context, exceptionalism was the tool used to justify empire *and* the tool used to critique it. The *Insular Cases* reveal the hard core beneath the rhetoric: Exceptionalism ultimately means the United States defines the boundary of its own obligations, and can move that boundary whenever strategic necessity demands. That explains what material interests alone cannot: the specific legal architecture of American empire.
