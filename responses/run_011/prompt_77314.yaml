prompt: |-
  I chair the panel of a small foundation that funds theoretical work on mind, language, and culture. Each cycle we receive roughly forty proposals from people trained in quite different fields, and our nine panelists split predictably: half accuse the rest of insisting that everything be explained by evolution or physics, half accuse the first of proposing to fund explanations whose central mechanism nobody has ever located. I want a screening procedure, grounded in Dennett's crane/skyhook distinction and its mirror image, greedy reductionism, that a non-specialist panelist can run on an unfamiliar proposal in twenty-five minutes and summarize in one paragraph for the file.

  Please give the questions to ask in order, what counts as an adequate answer to each, and how to distinguish a proposal that genuinely posits a skyhook from one that merely posits a mechanism this panelist has not encountered. Include how to catch the opposite failure — a proposal that dissolves the explanandum rather than explaining it — and where the procedure must stop and either hand the call to a specialist or record the panelists' disagreement as a clash of background commitments rather than a defect in the work. Flag explicitly which steps are judgment wearing a procedural costume, and say what the procedure cannot detect.

  Then run it on three case summaries you compose: a proposal to explain the origin of human moral norms by appeal to a dedicated faculty for detecting objective normative facts; a proposal arguing that pain's felt character is a post-hoc confabulation with no causal role; and a proposal explaining the emergence of writing as an exaptation of an existing object-recognition system, with specific testable predictions. At least one of the three should come out in a way I would rather not publish.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a small foundation panel (mind, language, culture).
      *   **Problem:** 40 proposals/cycle, 9 panelists split 50/50 (Reductionists vs. Anti-Reductionists/Humanists).
      *   **Goal:** A screening procedure for non-specialist panelists.
      *   **Constraints:** 25 minutes per proposal, 1-paragraph summary output.
      *   **Theoretical Grounding:** Dennett's Crane/Skyhook distinction + Greedy Reductionism (the mirror image).
      *   **Specific Requirements:**
          *   Ordered questions.
          *   Criteria for adequate answers.
          *   Distinguish "unknown mechanism" vs. "skyhook."
          *   Catch "dissolving the explanandum" (eliminativism).
          *   Identify when to stop (specialist needed vs. background clash).
          *   Flag "judgment wearing a procedural costume."
          *   State limitations (what the procedure cannot detect).
          *   Run the procedure on three specific case summaries (Moral Norms/Faculty, Pain/Confabulation, Writing/Exaptation).
          *   At least one case must be rejected ("rather not publish").

  2.  **Theoretical Framework (Dennett):**

      *   *Skyhook:* A miraculous, unexplained explainer. Something that lifts complexity without itself being complex or derived from prior complexity. (e.g., God, Cartesian Ego, irreducible qualia, objective normative facts).
      *   *Crane:* A mechanism built from prior, simpler parts that lifts complexity. (e.g., Natural Selection, Neural Networks, Cultural Evolution).
      *   *Greedy Reductionism:* Trying to explain everything *too* quickly or at the *wrong level*, often denying the existence of the phenomenon to save the reduction (e.g., "Pain isn't real, it's just C-fibers").
      *   *The Tension:* Panelists A hate Skyhooks (want Cranes). Panelists B hate Greedy Reductionism (want to preserve the phenomenon).

  3.  **Drafting the Procedure (The "25-Minute Crane/Skyhook Audit"):**

      *   *Time Management:* 25 mins is tight. Needs 5 questions, ~4 mins each + reading/writing.
      *   *Question 1: The Explanandum.* What are they trying to explain? Is it real or being denied? (Catches Greedy Reductionism).
      *   *Question 2: The Mechanism.* What does the work? Is it physical/functional? (Catches Skyhooks).
      *   *Question 3: The Genealogy.* Where did the mechanism come from? (Distinguishes Skyhook from Unknown Crane).
      *   *Question 4: The Cost.* What is ignored or assumed? (Catches Greedy Reductionism's blind spots).
      *   *Question 5: The Falsifier.* How could it be wrong? (Tests scientific rigor).
      *   *Stopping Rules:* When does it become a philosophical stalemate vs. a bad proposal?
      *   *Meta-Commentary:* Acknowledge where bias hides.

  4.  **Refining the Distinctions:**

      *   *Skyhook vs. Unknown Crane:* A skyhook claims *sui generis* status (cannot be derived). An unknown crane admits derivation but lacks current detail. Key test: "Does the author claim this mechanism *must* be fundamental, or just that we haven't traced it yet?"
      *   *Explanation vs. Dissolution:* Does the proposal explain *why pain feels like pain* or does it say *pain is an illusion*? The latter is eliminativism (often flagged as greedy reductionism by the anti-reductionist half).

  5.  **Developing the Case Studies:**

      *   *Case 1: Moral Norms (The Skyhook Trap).* Proposal: Dedicated faculty for *objective* normative facts.
          *   *Analysis:* Posits access to non-natural facts. This is a classic Skyhook. Evolutionary ethics would be the Crane.
          *   *Verdict:* Reject (or flag heavily). Fits the "rather not publish" criteria.
      *   *Case 2: Pain (The Greedy Reductionism Trap).* Proposal: Pain's felt character is post-hoc confabulation, no causal role.
          *   *Analysis:* Explains the behavior, denies the qualia. This is eliminativism/illusionism.
          *   *Verdict:* Controversial. Panel will split. Procedure should flag this as a "Background Clash" rather than a defect, *unless* it fails to explain why the confabulation exists (which would be a bad crane). Let's make it a "Pass to Specialist" because it hinges on philosophy of mind definitions.
      *   *Case 3: Writing (The Good Crane).* Proposal: Exaptation of object-recognition. Testable predictions.
          *   *Analysis:* Uses existing biology (crane), explains emergence, testable.
          *   *Verdict:* Fund.

  6.  **Writing the Procedure (Iterative refinement):**

      *   *Tone:* Administrative but philosophically precise.
      *   *Structure:* Introduction -> The 5 Questions -> Decision Matrix -> Limitations.
      *   *Self-Correction on "Judgment in Costume":* I need to be honest that asking "Is the mechanism physical?" biases against dualists. I need to flag that.
      *   *Stopping Rule:* If the answer to Q3 is "It just is," that's a Skyhook. If the answer to Q1 is "It doesn't exist," that's Dissolution.

  7.  **Drafting the Case Summaries & Analyses:**

      *   *Case 1 (Morality):* Make sure it explicitly claims access to *objective* facts, not just social coordination. This ensures it triggers the Skyhook alarm.
      *   *Case 2 (Pain):* Make sure it claims qualia are epiphenomenal. This triggers the "Dissolution/Greedy" alarm.
      *   *Case 3 (Writing):* Make it solid Dehaene-style neuronal recycling.
      *   *Application:* Apply the 5 questions rigorously to each.

  8.  **Review against Constraints:**

      *   25 minutes? Yes, 5 questions is doable.
      *   One paragraph summary? I will provide templates for this.
      *   Dennett grounded? Yes, Crane/Skyhook/Greedy.
      *   One rejection? Yes, Case 1.
      *   Flag judgment/costume? Yes, in the "Meta-Commentary" section.
      *   Limitations? Yes.

  9.  **Final Polish:**

      *   Ensure the distinction between "Unknown Crane" and "Skyhook" is clear in the instructions. (Key: Commitment to naturalizability).
      *   Ensure the "Greedy Reductionism" check is clear. (Key: Preservation of the phenomenon).
      *   Check the tone: Helpful to a Chair trying to manage a divided committee.

  *(Self-Correction during drafting)*: I initially thought about making Case 2 a rejection too. But the prompt asks for *at least one* I'd rather not publish. Case 1 is a clearer Skyhook. Case 2 is a clearer philosophical clash (Illusionism vs. Realism). It's better to show the procedure *identifying* the clash rather than just rejecting it, to demonstrate the "Stop and Hand Off" rule. Case 1 will be the rejection. Case 2 will be the "Clash/ Specialist" flag. Case 3 will be the "Fund."

  *(Refining the "Judgment in Costume" section)*: I need to explicitly state that defining what counts as a "physical mechanism" is itself a philosophical stance. The procedure assumes naturalism. I must admit this.

  *(Refining the Output)*: The user wants the procedure *and* the run-through. I will structure it clearly with headers.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Crane/Skyhook Audit (CSA)
  **For Non-Specialist Panelists | Time Limit: 25 Minutes**

  ### Purpose
  To distinguish between **Crane** proposals (mechanisms built from prior, simpler parts), **Skyhook** proposals (miraculous explainers that suspend the laws of complexity), and **Greedy Reductionist** proposals (which explain a phenomenon by denying its existence). This procedure does not determine truth; it determines funding readiness given our foundation's mandate for naturalistic explanation without eliminativism.

  ### The Five Questions
  *Read the proposal abstract and methodology. Spend 4 minutes per question. Write brief notes.*

  **1. The Explanandum Check**
  *   **Question:** Does the proposal treat the target phenomenon (e.g., pain, morality, syntax) as a real effect requiring explanation, or as an illusion/error to be explained away?
  *   **Adequate Answer:** The proposal acknowledges the phenomenon as a datum. It may argue our *folk understanding* is wrong, but it must explain why the experience/behavior occurs.
  *   **Red Flag:** "X does not exist; only Y exists." (e.g., "Consciousness is an illusion.")
  *   **Procedure Note:** If the phenomenon is dissolved, mark **Greedy Reductionism**. Stop here unless the dissolution is the explicit theoretical contribution.

  **2. The Mechanism Specification**
  *   **Question:** What specific thing does the causal work? Is it described in terms of structure, function, or information processing?
  *   **Adequate Answer:** A mechanism located in time and space (neural, computational, social, ecological) that operates via lawful regularities.
  *   **Red Flag:** A faculty, intuition, or force defined solely by its output (e.g., "The moral sense perceives goodness").
  *   **Procedure Note:** If the mechanism is defined only by what it explains, mark **Potential Skyhook**.

  **3. The Genealogy Test (Crane vs. Skyhook)**
  *   **Question:** Where did this mechanism come from? Is it derived from prior, simpler capacities, or is it posited as fundamental/sui generis?
  *   **Adequate Answer:** A developmental, evolutionary, or historical pathway showing how the mechanism could assemble from less complex precursors.
  *   **Red Flag:** "It is an innate endowment," "It is a basic fact," or "It emerges" without specifying the interacting parts.
  *   **Distinction Rule:** An *Unknown Crane* admits the pathway is currently opaque but commits to naturalistic derivation. A *Skyhook* claims the mechanism *cannot* be derived from below (it is irreducible).
  *   **Procedure Note:** If the author claims irreducibility, mark **Skyhook**.

  **4. The Cost Assessment**
  *   **Question:** What data or intuitions must we discard for this explanation to work?
  *   **Adequate Answer:** The author identifies trade-offs (e.g., "This model predicts reaction times but not subjective reports").
  *   **Red Flag:** The explanation is cost-free, or the costs are dismissed as "folk psychology."
  *   **Procedure Note:** High costs + Phenomenon Dissolution = **Greedy Reductionism**. High costs + Skyhook = **Dogmatism**.

  **5. The Falsifier**
  *   **Question:** What observation would prove the proposed mechanism false?
  *   **Adequate Answer:** A specific empirical outcome that would break the model.
  *   **Red Flag:** "If the phenomenon weren't observed" (circular) or "It is conceptually impossible for X to be false."
  *   **Procedure Note:** No falsifier = **Not a scientific proposal**.

  ---

  ### Decision Matrix & Stopping Rules

  1.  **Fundable Crane:** Passes Q1 (Real), Q2 (Physical/Functional), Q3 (Derived), Q5 (Falsifiable).
  2.  **Reject (Skyhook):** Fails Q3 (Irreducible/Sui Generis). *This is a defect in the work relative to our mandate.*
  3.  **Reject (Greedy):** Fails Q1 (Dissolves phenomenon) AND Q4 (Denies cost). *This is a defect in the work.*
  4.  **Refer to Specialist (Background Clash):** Passes Q1 but fails Q2/Q3 in a way that hinges on philosophical definition (e.g., "Is functionalism enough for mind?"). *Do not reject; flag as "Panel Disagreement Likely."*
  5.  **Stop Point:** If Q3 reveals a commitment to non-naturalism (e.g., Platonism), stop. This is not a specialist issue; it is a mandate violation.

  ---

  ### Meta-Commentary: Judgment in Costume & Limitations

  **Where Judgment Wears a Procedural Costume:**
  *   **Q1 (Reality):** Deciding whether a proposal "dissolves" a phenomenon or "refines" it is often a philosophical bias. Illusionists believe they are explaining pain; realists believe they are denying it. This procedure biases against illusionism by default.
  *   **Q2 (Physicality):** Defining what counts as a "mechanism" privileges current physicalism. If a new ontology is required, this audit will flag it as a Skyhook.
  *   **Q3 (Derivation):** Demanding a genealogy biases toward evolutionary psychology and against structuralism or synchronic analysis.

  **What This Procedure Cannot Detect:**
  *   **Mathematical Error:** It checks conceptual structure, not calculation.
  *   **Triviality:** A proposal can be a perfect Crane for a trivial problem.
  *   **Ethical Risk:** It does not assess the danger of the research.
  *   **True Novelty:** It may penalize radical paradigm shifts that look like Skyhooks before they are understood (e.g., early quantum theory).

  ---

  ### Case Runs

  #### Case 1: The Moral Faculty
  **Summary:** Proposes that human moral norms originate from a dedicated cognitive module evolved to detect *objective normative facts*. Argues that convergence in moral judgment across cultures implies access to a non-natural realm of value. Methodology involves cross-cultural surveys of moral intuition.
  **Audit:**
  1.  **Explanandum:** Treats moral norms as real. (Pass)
  2.  **Mechanism:** "Dedicated module for detecting objective facts." (Flag: Defined by output).
  3.  **Genealogy:** Claims module accesses *non-natural* facts. Explicitly argues these facts cannot be reduced to evolutionary fitness or social coordination. (Fail: Skyhook).
  4.  **Cost:** Assumes realism about non-natural properties.
  5.  **Falsifier:** None offered; divergence in intuition is attributed to "noise."
  **Verdict:** **Reject.**
  **Reasoning:** This posits a classic Skyhook. It claims the mechanism accesses facts that exist outside the causal order (non-natural normative facts). It fails Q3 by asserting irreducibility not as a temporary ignorance but as a metaphysical feature. This violates the foundation's mandate for naturalistic explanation.
  **File Summary:** *Proposal posits a moral faculty detecting objective, non-natural normative facts. Fails Q3 (Genealogy) by explicitly defining the mechanism as accessing a realm outside causal derivation (Skyhook). While it treats the explanandum as real (Pass Q1), the core mechanism is metaphysically suspended rather than built from prior capacities. Reject as incompatible with naturalistic mandate.*

  #### Case 2: The Pain Confabulation
  **Summary:** Argues that the felt character of pain (qualia) is a post-hoc narrative confabulation generated by language centers to explain avoidance behavior. Claims C-fiber firing causes avoidance; the "hurt" is a story the brain tells itself later with no causal role. fMRI timing studies proposed.
  **Audit:**
  1.  **Explanandum:** Claims the *felt character* is an illusion/error. (Flag: Dissolution).
  2.  **Mechanism:** Neural timing mismatch between motor command and narrative generation. (Pass: Physical).
  3.  **Genealogy:** Evolution of language systems co-opting sensory data. (Pass: Crane).
  4.  **Cost:** Requires accepting that "pain" as experienced does not causally exist. (High Cost).
  5.  **Falsifier:** If neural timing shows feeling precedes narrative. (Pass).
  **Verdict:** **Refer to Specialist / Flag Clash.**
  **Reasoning:** This is a strong Crane (Q2, Q3, Q5 pass) but fails Q1 for half the panel. It explains the behavior by dissolving the subjective phenomenon (Greedy Reductionism). However, it does so via a specific physical mechanism, not a Skyhook. This is a philosophical clash (Illusionism vs. Realism), not a procedural defect.
  **File Summary:** *Proposal argues pain qualia are post-hoc confabulations with no causal role. Passes Q2/Q3/Q5 (mechanism is neural/timing-based and falsifiable). Fails Q1 for non-eliminativists as it dissolves the subjective explanandum rather than explaining it. This represents a background commitment clash (illusionism vs. realism) rather than a Skyhook or methodological defect. Flag for full panel debate.*

  #### Case 3: Writing as Exaptation
  **Summary:** Explains the emergence of writing systems as an exaptation of the primate object-recognition system (ventral visual stream). Predicts that grapheme shapes across cultures will statistically match contours found in natural environments. Includes cross-linguistic corpus analysis and neural imaging predictions.
  **Audit:**
  1.  **Explanandum:** Treats writing systems and their visual forms as real effects. (Pass).
  2.  **Mechanism:** Existing object-recognition neural circuitry. (Pass: Physical/Functional).
  3.  **Genealogy:** Cultural evolution selects symbols that fit pre-existing biological constraints (Neuronal Recycling). (Pass: Crane).
  4.  **Cost:** Does not require new faculties; assumes constraint on cultural variation. (Low Cost).
  5.  **Falsifier:** If grapheme shapes do not match environmental contours statistically. (Pass).
  **Verdict:** **Fund.**
  **Reasoning:** This is a paradigmatic Crane. It builds a complex capacity (writing) from simpler, existing parts (object recognition) via a specified process (cultural selection/biological constraint). It preserves the phenomenon while explaining its structure.
  **File Summary:** *Proposal explains writing emergence via exaptation of object-recognition systems. Passes all audit checks: treats phenomenon as real (Q1), specifies neural mechanism (Q2), derives complexity from simpler precursors via cultural/biological selection (Q3), and offers statistical falsifiers (Q5). A robust Crane proposal with low eliminativist cost. Recommend funding.*
