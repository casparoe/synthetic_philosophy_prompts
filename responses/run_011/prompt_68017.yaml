  Node-by-node verification confirms the case holds. Start: (X, $0).
  Myopic: At Node 3, (X, -$3) vs (Z, -$2). Since WTP for X over Z is $2, Dana pays $1. Swap. Back to Node 2: (Z, -$2) vs (Y, -$1). WTP $2, pays $1. Swap. Node 1: (Y, -$1) vs (X, $0). WTP $2, pays $1. Swap. Outcome: (X, -$3). Loss of $3.
  Sophisticated: Node 3 swap yields (X, -$3). Node 2 compares Keep (Y, -$1) vs Swap-Outcome (X, -$3). Since (Y, -$1) ≻ (X, $0) ≻ (X, -$3), Dana Keeps. Node 1 compares Keep (X, $0) vs Swap-Outcome (Y, -$1). Since (Y, -$1) ≻ (X, $0), Dana Swaps. Outcome: (Y, -$1). No net loss relative to start preferences.
  Resolute: Plans map to outcomes: KKK=(X,$0), SKK=(Y,-$1), SSK=(Z,-$2), SSS=(X,-$3). Preference chain: KKK ≺ SKK ≺ SSK ≺ SSS ≺ KKK (due to money monotonicity on X). The ranking of plans is cyclic. Resolute choice lacks a maximal element. This is not a bug; Part (c) requires students to identify this. The stipulations are logically consistent but generate indeterminacy for resolute choosers.

  2. **The question**
  **Case:** Dana chooses between bikes X, Y, Z. Preferences are cyclic: Y ≻ X, Z ≻ Y, X ≻ Z. Money matters separately and monotonically (less spent is better). For each step up the cycle, Dana will pay up to $2. Thus: (Y, −$1) ≻ (X, $0), (Z, −$1) ≻ (Y, $0), and (X, −$1) ≻ (Z, $0).

  **Sequence:** Dana starts with X ($0 cost).
  • Node 1: Swap current bike for Y + $1.
  • Node 2: Swap current bike for Z + $1.
  • Node 3: Swap current bike for X + $1.

  **Policies:**
  • *Myopic:* Compares only current holding vs. immediate offer.
  • *Sophisticated:* Reasons backwards, anticipating future selves' choices.
  • *Resolute:* Adopts a complete plan at Node 1 and follows it.

  **Answer the following (25 marks):**
  (a) Determine the final outcome (bike and total cost) under each policy. For Resolute, state which plan Dana adopts and justify it (or explain if no unique plan is rational). (8 marks)
  (b) A student argues: "Each swap buys a step up valued at $2 for only $1, so Dana nets $1 per swap and cannot be losing out." Diagnose exactly where this reasoning fails. (5 marks)
  (c) Show that Dana's ranking of the reachable outcomes (plans) is itself cyclic. What implication does this have for the Resolute policy? (5 marks)
  (d) Does Sophisticated Dana's avoidance of loss prove the money-pump argument targets myopia rather than intransitivity? State your position and provide the strongest objection to it. (7 marks)

  3. **Model answer**
  (a) **Myopic:** Dana swaps at every node. At Node 3, (X, −$3) is preferred to (Z, −$2) because the bike upgrade is worth $2 and costs only $1. Backwards, the same logic applies at Nodes 2 and 1. Final outcome: **X, −$3**.
  **Sophisticated:** Dana reasons backwards. At Node 3, she swaps (as above), leading to (X, −$3). At Node 2, she compares keeping (Y, −$1) against the future outcome (X, −$3). Since (Y, −$1) ≻ (X, $0) and money is monotonic, (Y, −$1) ≻ (X, −$3). She keeps Y. At Node 1, she compares (X, $0) against the future outcome (Y, −$1). Since (Y, −$1) ≻ (X, $0), she swaps. Final outcome: **Y, −$1**.
  **Resolute:** The available plans are KKK (X, $0), SKK (Y, −$1), SSK (Z, −$2), SSS (X, −$3). Dana prefers SKK to KKK, SSK to SKK, and SSS to SSK. However, she prefers KKK to SSS (same bike, less money). There is **no unique rational plan** because the preferences over plans are cyclic. If forced to choose, she might pick SKK as it dominates the status quo, but strictly speaking, resolute choice is indeterminate here.

  (b) The error is **summing local gains without comparing terminal states**. While each individual swap offers a net local benefit ($2 value − $1 cost), the sequence returns Dana to the original bike X. The comparison must be between the start state (X, $0) and the end state (X, −$3). Since money is monotonic, (X, $0) ≻ (X, −$3). The "net gain" calculation ignores that the value of the bike upgrades cancels out over the cycle, leaving only the accumulated monetary loss.

  (c) The outcomes corresponding to the plans are: O₁=(X,$0), O₂=(Y,−$1), O₃=(Z,−$2), O₄=(X,−$3).
  Preferences: O₂ ≻ O₁ (given); O₃ ≻ O₂ (shift both by −$1); O₄ ≻ O₃ (shift both by −$1); O₁ ≻ O₄ (money monotonicity).
  This creates a cycle: O₁ ≺ O₂ ≺ O₃ ≺ O₄ ≺ O₁.
  **Implication:** Resolute choice requires selecting the maximal plan. Since the ranking is cyclic, there is no maximal plan. The resolute policy fails to provide a determinate rational prescription, undermining the claim that resoluteness solves the problem of dynamic inconsistency in this case.

  (d) **Position:** The fact that Sophisticated Dana avoids loss shows the *exploitation* argument targets myopia. A sophisticated agent with intransitive preferences is not money-pumped.
  **Objection:** Rationality requires more than avoiding exploitation; it requires **evaluative coherence**. Even if Sophisticated Dana keeps her money, she faces a cyclic ranking of outcomes (as shown in c). This means there is no "best" option available to her. A rational agent must be able to identify a choice that is at least as good as any alternative. Intransitivity violates this constitutive aim of choice. Therefore, intransitivity remains irrational even if sophistication prevents a trader from draining your wallet, because it leaves the agent without a coherent goal.

  4. **Marking scheme**
  **(a) Outcomes (8 marks):**
  • Myopic (X, −$3) with node logic (3 marks).
  • Sophisticated (Y, −$1) with backward induction logic (3 marks). *Crucial:* Must show Node 2 comparison is (Y, −$1) vs (X, −$3), not (Y, −$1) vs (Z, −$2).
  • Resolute: Identifies cyclic plan ranking or indeterminacy (2 marks). B-level answers assert a plan is chosen without noting the cycle.

  **(b) Diagnosis (5 marks):**
  • Identifies that bike value cancels over the cycle (2 marks).
  • Identifies that start vs. end comparison reveals monetary loss (3 marks).
  • *Error:* Accepting the "net gain" argument gets zero.

  **(c) Cyclic Outcomes (5 marks):**
  • Demonstrates O₁ ≺ O₂ ≺ O₃ ≺ O₄ ≺ O₁ (3 marks).
  • States Resolute choice lacks a maximal element/is indeterminate (2 marks).

  **(d) Crux (7 marks):**
  • Takes a clear position (Yes/No) (1 mark).
  • Argues sophistication blocks exploitation (2 marks).
  • **Strongest Objection:** Distinguishes pragmatic exploitability from evaluative coherence/no-best-option (4 marks).
  • *A-grade:* Explicitly links the cyclic outcomes from (c) to the objection in (d). *B-grade:* Argues sophistication "solves" rationality or objects only on cognitive cost grounds.

  5. **Where students go wrong**
  1.  **Forward Induction on Sophistication:** Treating Sophisticated Dana like Myopic Dana. They fail to see Node 2 choice depends on Node 3 outcome. This reveals memorizing "sophistication stops pumps" without understanding backward induction.
  2.  **Validating the Net Gain:** Accepting the Part (b) objection as valid. This reveals a failure to distinguish local marginal utility from global outcome comparison.
  3.  **Ignoring Money Monotonicity in (c):** Claiming (X, −$3) ≻ (X, $0) because of the bike cycle. This violates the case stipulation and shows sloppy reading.
  4.  **Name-Dropping:** Citing "McClennen" or "Ramsey" instead of arguing. This reveals reliance on revision notes rather than case analysis.
  5.  **Weak Objection in (d):** Arguing sophistication is "too hard" cognitively. This is a practical objection, not a normative one. The strongest objection must address the definition of rationality itself (coherence vs. exploitability).
