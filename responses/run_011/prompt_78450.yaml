      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm writing a textbook on economics. Keep it focused on the Board's decision. The "tâtonnement" term is in the prompt, so I must use it, but focus on its operational reality.
      *   *Refining the Pilot:* If the rural trust says they will lie, putting them in the pilot risks corrupting the data. However, excluding them validates their claim that the system doesn't work for them. The solution: Include them, but audit their inputs against historical baselines to detect strategic distortion.
      *   *Refining the Objective Function:* The Director claims neutrality. I need to point out that *rigidity* is not neutrality. If weights are fixed annually, the system cannot respond to mid-year crises (e.g., a flu spike in one region).

  7.  **Final Polish:**
