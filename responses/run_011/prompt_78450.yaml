  2.  **Determine the Recommendation:**

      *   *Option A (Adopt):* Too risky given the strategic threat and the objective function ambiguity.
      *   *Option B (Reject):* The status quo is acknowledged as broken. Rejecting leaves us with nothing.
      *   *Option C (Adopt Subject to Conditions):* This is the most responsible path for a lay member. It allows testing the hypothesis without committing the whole system to a potentially flawed mechanism.
      *   *Decision:* **Adopt Subject to Conditions (Pilot).**
      *   *Specifics:* Needs to include the "hostile" trust to test the strategic reporting claim. Needs to define the objective function weights explicitly before starting.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening/Recommendation:** Clear and immediate.
      *   **Diagnosis of Disagreement:** Break down the three strands (Computation, Incentives, Tacit Knowledge).
      *   **The Objective Function:** Address the equity vs. throughput weightings and the "neutrality" claim.
      *   **Pilot Design (The Conditions):** Specifics on scope, trusts, duration, metrics, suspension, and the voting rule. *Crucial:* Include the rural trust.
      *   **What the Pilot Can/Cannot Settle:** Epistemic limits.
      *   **The Strongest Counter-Argument:** Steelman the opposition (the "old error" argument).
