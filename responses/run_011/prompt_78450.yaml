answer: |-
  **MEMORANDUM TO THE SYSTEM BOARD**

  **FROM:** Independent Lay Member
  **DATE:** [Date]
  **SUBJECT:** Recommendation on the Proposal for Algorithmic Capacity Allocation

  **Recommendation**

  I recommend that the Board **adopt the proposal subject to strict pilot conditions**, rather than proceeding to immediate system-wide implementation or rejecting the concept entirely. The status quo—characterized by administrative tariffs set eleven years ago and bilateral negotiations that have deadlocked this Board for four months—is unsustainable. However, the risks associated with the Director of Analytics' "rolling tâtonnement" engine are substantial enough to preclude full rollout without empirical validation.

  The pilot must run for **six months**, commencing immediately following this vote. It must include **four trusts**: the two largest urban centers, one mid-sized mixed trust, and **the rural trust that has threatened strategic misreporting**. Excluding the rural trust would render the pilot epistemically void; if the mechanism fails under strategic pressure, we must discover that now, not post-implementation.

  **Success Metrics and Comparator:** The pilot will be measured against a control group of ten trusts continuing under the current negotiation regime. Primary metrics are: (1) percentage reduction in idle theatre time; (2) elective cancellation rates; and (3) staff turnover/sickness rates in critical care and theatre staff (as a proxy for consumed goodwill).

  **Suspension Trigger:** The pilot will be suspended immediately if data audits reveal systematic divergence between reported cost functions and historical baselines exceeding 15% in any participating trust, or if staff sickness rates in pilot trusts rise by more than 10% relative to controls.

  **Renewal Decision Rule:** At the conclusion of six months, a renewal vote to expand the engine will require a simple majority. However, if the rural trust votes against renewal citing data integrity issues, the motion fails regardless of the count. This ensures the mechanism cannot be imposed on a region that demonstrably cannot participate honestly.

  **Diagnosis of the Disagreement**

  To act on this recommendation, the Board must diagnose the nature of our disagreement. We are not arguing about computational tractability. The Director is correct that modern computation solves the calculation problems that stymied central planning in the twentieth century. We can solve the equations.

  The disagreement turns on two distinct issues: **mechanism design** and **tacit knowledge**.

  First, mechanism design. The opposition argues that reporting is strategic. In a clearing engine, reporting a high marginal cost reduces your allocation burden but risks starving your service; reporting low costs increases activity but risks financial deficit. The rural trust's explicit threat to misreport confirms this is not a theoretical concern. A pilot can settle this. If the audit mechanisms detect gaming, the mechanism design is flawed for our context.

  Second, tacit knowledge. The opposition argues that cost functions are abstractions that flatten essential local knowledge—ward absorption rates, team dynamics, informal cross-cover. This is the harder constraint. A six-month pilot cannot fully settle whether "staff goodwill" can be priced. However, by tracking sickness and turnover as proxy metrics, we can detect if the engine is consuming social capital faster than it generates surgical throughput. If throughput rises but retention collapses, the efficiency is illusory. We must acknowledge that the pilot may show higher efficiency on the ledger while destroying the underlying capacity. That is a risk we must accept to test, but we must measure it.

  **The Objective Function and the Claim of Neutrality**

  I must address the objective function head-on, as this is where the proposal's political difficulties are concentrated. The Director asserts that the engine is neutral once the Board fixes the weights between equitable access and total throughput. This claim does more work than it can support.

  Fixing weights is not a technical adjustment; it is a political constraint that the engine then enforces with mathematical rigidity. Under the current negotiation regime, trusts can absorb local shocks through informal flexibility. If a flu spike hits one region, trusts can deviate from the tariff to help without triggering a systemic repricing. The engine, by contrast, optimizes for the fixed scalar objective. If the weight favors throughput, the engine will systematically starve low-volume, high-complexity services in rural areas to maximize aggregate surgical volume. If the weight favors equity, it will idle efficient urban theatres to prop up rural capacity.

  The Director's claim of neutrality obscures the fact that the engine removes the Board's ability to respond to mid-year crises without recalibrating the weights. Once the weights are set, the allocation appears to be the result of mathematical necessity rather than political choice. This insulates the Board from accountability but reduces system resilience. The pilot must therefore test not just efficiency, but stability. We need to know if the engine creates brittle allocations that shatter under pressure.

  **The Strongest Case Against This Recommendation**

  The strongest argument against this conditional adoption comes from the opposition's core position: that this proposal reproduces an old error in new clothes. Proponents of this view argue that by even piloting the engine, we legitimize the premise that clinical capacity can be reduced to reportable cost functions. They contend that the requirement to report forces local leaders to spend time coding their clinical reality into abstract numbers, thereby diverting attention from actual patient care. Furthermore, they argue that including the rural trust in the pilot, given their stated intention to misreport, invites corruption of the data. If they lie, the pilot results are useless; if they tell the truth, they may be harmed by the allocation.

  This argument forces a concession. We cannot simply demand honest reporting. The pilot design must include an independent data audit team with the power to reconstruct cost functions from raw operational data, rather than relying solely on trust submissions. If the audit finds the rural trust's reports are strategic, we do not simply penalize the trust; we must treat that finding as evidence that the mechanism itself induces dishonesty. In that case, the pilot fails not because the trust lied, but because the mechanism made lying the rational choice.

  However, the recommendation survives this critique because the alternative is paralysis. The status quo tariff is itself an administrative construction that has never cleared a market. It allocates capacity arbitrarily based on historical precedent rather than current need. We are not choosing between a free market and a plan; we are choosing between a僵死的 (dead) administrative plan and a dynamic computational one. To reject the pilot is to vote for the continued atrophy of our elective capacity.

  **What the Pilot Cannot Settle**

  We must be clear about the limits of this exercise. The pilot cannot settle the philosophical question of whether certain kinds of knowledge can be put into reportable form. If staff goodwill erodes slowly over five years, a six-month pilot will not capture it. If the "flattening" of local knowledge reduces innovation in care pathways over the long term, we will not see it.

  At the midpoint review (three months), my assessment will change only if we see early signals of data integrity failure. If the audit team cannot reconcile reported costs with actual expenditure within the first quarter, the mechanism is fundamentally incompatible with our accounting reality, and I will move to terminate the pilot early. Conversely, if the rural trust reports honestly and maintains service levels, the opposition's claim regarding strategic incentives is weakened significantly.

  **Conclusion**

  We are stuck between a broken negotiation process and a theoretical engine that assumes away human complexity. The Director is right that computation is no longer the bottleneck. The opposition is right that incentives and tacit knowledge remain so.

  By adopting this proposal conditionally, we acknowledge that the status quo is untenable while refusing to gamble the entire system on an unproven mechanism. We test the incentives by including the skeptical trust. We test the social cost by measuring staff retention. We test the political weight by fixing the objective function explicitly.

  If the engine works, we have a path forward. If it fails, we have learned that the problem is not computational, but human. Either way, we break the deadlock. I urge the Board to vote for the pilot as specified.
