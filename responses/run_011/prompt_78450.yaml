      *   **Key Content Requirements:**
          *   Open with a plain recommendation (Adopt, Reject, or Adopt Subject to Conditions).
          *   If conditional, conditions must be specific (pilot scope, trusts involved, duration, metrics, comparator, suspension triggers, renewal decision rule).
          *   Address the "honest reporting" trust (the rural one threatening strategic misreporting) – must they be in or out of the pilot?
          *   Diagnose the core disagreement: Computational tractability vs. Mechanism design/incentives vs. Tacit knowledge (can it be reported?).
          *   Distinguish what a pilot can/cannot settle.
          *   Address the "objective function" (equity vs. throughput) head-on; challenge the Director's claim of neutrality.
          *   Present the strongest case against the recommendation (steelman the opposition) and explain why the recommendation survives or requires concession.
