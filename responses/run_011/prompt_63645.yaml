answer: |-
  The committee room in Mercia smelled of damp wool and old paper. Outside, the kingdom's coinage was scarce enough that merchants were reverting to barter for daily bread. On the table lay the proposal: a permanent issuance of paper notes, fixed by statute, convertible into nothing, receivable only for taxes and sovereign debts.

  Mr. Harte smoothed the document. "We must understand what money is," he began, addressing the room but looking at Mr. Sterling. "It is not wealth itself. Gold in a vault feeds no one. Money is a counter, a ticket used to set industry in motion. A country is rich not when its cellars hold silver, but when its people work and trade. These notes will be that spark. The state demands them for taxes; therefore, the people will work to earn them. That demand is the anchor."

  Mr. Sterling, a man who trusted weight over words, leaned forward. "You call it an anchor, I call it a leash held by a mad dog. You propose a token backed by nothing but the state's promise to accept it. What stops the sovereign from printing until the ink runs dry? Without convertibility into a commodity wanted for its own use—gold, silver, grain—there is no brake. You rely on the virtue of men who have just declared bankruptcy."

  "Consider the alternative," Harte countered. "We have no gold. Industry sits idle because the wheels of trade have seized. These notes circulate. They allow the farmer to sell to the weaver and the weaver to pay the tax. The value lies in the circulation, not the substance."

  "Let us test that value," Sterling said. "Suppose a bad harvest cuts the grain supply by a third. The food is simply not there. You issue your notes to 'excite industry.' But industry cannot conjure wheat from air. In your system, what happens? The notes chase the fixed quantity of grain. Prices triple. The rich pay the higher price, and the hungry starve just the same. Your token has not created wealth; it has merely masked the scarcity until the poor feel the full weight of it."

  Harte did not flinch. "A valid concern, but you mistake the mechanism. In a famine, the problem is rarely just absolute scarcity; it is distribution. Without money, trade stops. The hoarder keeps his grain because he cannot buy what he needs with it. With these notes, even if prices rise, the trade continues. More importantly, because these notes are the only thing accepted for taxes, merchants abroad will bring grain into Mercia to acquire them. They need the notes to settle debts with our Crown or pay duties on our exports. The tax demand pulls food from across the sea. Gold does not guarantee imports if the mine is dry. The tax obligation guarantees a market for the grain."

  Sterling tapped the table. "And when war comes? You say the quantity is fixed by statute. But statutes are parchment. The first expensive campaign will snap this limit. The sovereign will plead necessity, the legislature will cave, and you will have an unlimited issue of paper. There is no physical constraint. With gold, you cannot spend what you do not have. With your paper, the only limit is shame, and states have thick skins."

  "You assume the state wishes to impoverish itself," Harte replied. "The limit is not merely a number; it is tied to the tax assessment. To issue more notes, the state must raise the tax burden to absorb them. If they issue beyond the capacity of the people to pay, the notes depreciate against goods. Who suffers? The state itself. It must pay its soldiers and suppliers in these notes. If they lose value, the state's purchasing power collapses. The sovereign's self-interest protects the currency. He cannot debase the ticket without bankrupting his own ability to wage the war."

  Sterling paused, considering this feedback loop. Then he smiled thinly. "You argue that gold is no better. Tell me, in that famine year you described, what is your gold doing? If the grain is gone, gold cannot eat it either. Its value depends on what it can exchange for, just like my paper. In a crisis, the metallist clutches a metal that offers no more sustenance than a printed leaf. The real value is always in the command over labor and goods, not the substance of the coin."

  "A clever turn," Sterling admitted, "but it misses the point of restraint. However, I have a objection drawn from your own philosophy. You say money is a token to move industry. You say wealth is the activity of trade. Yet this proposal fixes the quantity of notes 'once and for all.' If your theory holds, and industry grows because of these notes, the supply of tokens will become insufficient. You will choke the very trade you mean to stimulate. A fixed money supply suits a static kingdom, not an industrious one. By your own logic, this statute is a noose around the neck of future growth. You have adopted the metallist's scarcity while rejecting the metallist's security."

  Harte opened his mouth, then closed it. The contradiction hung in the air.

  Sterling stood, gathering his papers. "We are not at an impasse because I love gold and you love paper. We are not arguing about what gives the token its value. We both know value lies in what it commands. The dispute is about who can safely be given the power to create the token. You believe the state can be trusted to manage the supply for the public good, bound by its own tax needs. I believe that any power to create value ex nihilo will be abused, and only the stubborn scarcity of the earth itself can restrain it. You fear the idle hand; I fear the unlimited hand."

  Harte looked down at the proposal. "Then we agree on the danger," he said quietly. "We disagree on whether the remedy is worse than the disease."

  "Precisely," Sterling said. "And until that is settled, Mercia remains short of coin."
