      The encryption case is the one that gives you away. You say the agent sees "close to total loss" because the information cannot be got back, but physics sees no loss at all—only a rearrangement of magnetic domains. For your agent to treat encryption as a cost, it must already distinguish between states that are physically distinct but functionally identical to a rock, and states that are distinct to *you*. It has smuggled in a model of what counts as a resource for a human agent. You claim this is value-free because it doesn't mention your feelings, but it presupposes that *your access* to the data is a feature of the world worth preserving. That is not a neutral fact; it is a valuation of human agency over raw physics.

