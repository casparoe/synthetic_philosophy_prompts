      *   **Case 2 (Encryption):** This is the stronger case for me. The agent sees "information loss" as a cost. But why? Information is only valuable to *someone*. To a rock, encryption is just magnet orientation. The agent is presupposing that *human-accessible information* is a resource worth preserving. It has smuggled in a theory of agency and utility without admitting it.
