answer: |-
  She will verdict him not culpable but liable, treating the two questions as independent assessments of blame versus threat status.

  (a) Her verdict will rest on a strict separation between liability, which tracks objective contribution to an unjust threat, and culpability, which tracks subjective blame for specific moral violations. Because the warrant officer contributes causally to the aggressive war machine, he is liable to defensive killing like the conscripts and the lieutenant colonel. However, because he has committed no *in bello* violation and the colleague's Case 4 aside insists aggression adds nothing to culpability, she will find him not culpable despite his knowledge and voluntariness. She treats the questions as independent because Cases 1 and 3 establish that one can be liable without being culpable, while Case 4 establishes that one can be culpable without the aggression itself being the source of that blame.

  (b) Three candidate principles consistent with the four precedents:
  1.  **The *In Bello* Exclusivity Principle:** Liability arises from material contribution to an unjust war effort; culpability arises *only* from violations of *in bello* constraints (discrimination/proportionality), regardless of *ad bellum* knowledge or voluntariness.
  2.  **The Unexcused Wrongdoing Principle:** Liability arises from material contribution to an unjust war effort; culpability arises from committing an objective wrong (including fighting in an unjust war) without sufficient excuse (ignorance or coercion).
  3.  **The Command Agency Principle:** Liability arises from being a uniformed combatant contributing to the war effort; culpability arises only from holding command authority or directly executing kills in violation of *in bello* constraints.

  (c) Predictions and Best Guess:
  *   **Principle 1** predicts **Not Culpable, Liable** (no *in bello* violation).
  *   **Principle 2** predicts **Culpable, Liable** (voluntary participation in unjust war without coercion is an unexcused wrong).
  *   **Principle 3** predicts **Not Culpable, Liable** (no command authority, no direct killing).

  My best guess is that she will follow **Principle 1**. The aside in Case 4 ("aggression adds nothing to the charge") is a pointed theoretical commitment that *ad bellum* status does not generate culpability, only liability. This overrides the implication in Case 3 that "being in the line... was already a wrong," which must be read as an objective wrong that does not entail blame unless accompanied by an *in bello* violation. The two asides are reconcilable if "wrong" denotes an objective prohibition (violating which makes one liable) while "culpable" denotes subjective blame (which requires *in bello* violation). The cost of this reconciliation is accepting that an agent can voluntarily commit an objective moral wrong without being blameworthy, provided the wrong is purely *ad bellum* participation.

  (d) Her verdicts reject the strong symmetry thesis (the Moral Equality of Combatants). She holds an asymmetric view on liability: aggressor combatants (Cases 1–4) are liable to be killed, while defender combatants (implied in Case 1) are permitted to kill and thus not liable. However, she accepts a limited symmetry on culpability: Case 4 asserts that an identical *in bello* violation generates equal culpability regardless of which side the commander fights for. Thus, she is asymmetric on liability (*ad bellum* dependent) but symmetric on culpability (*in bello* dependent).

  (e) A **volunteer cook** in the aggressor state's army who knows the war is unjust, faces no coercion, commits no *in bello* violations, and has no command authority.
  *   Under **The *In Bello* Exclusivity Principle**, she is **Not Culpable** (no *in bello* violation).
  *   Under **The Unexcused Wrongdoing Principle**, she is **Culpable** (voluntary participation in unjust war without excuse).
  *   Under **The Command Agency Principle**, she is **Not Culpable** (no command/direct killing).
  This case discriminates sharply by isolating the Unexcused Wrongdoing Principle against the other two, forcing the colleague to clarify whether mere voluntary presence in an unjust war is sufficient for blame absent specific harmful agency or *in bello* breaches.
