          *   Premises: P1, P2, P3. Rule: P1 & P2 & P3 -> Outcome O.
          *   Profile A (Paradox):
              *   4 voters say Yes to P1.
              *   4 voters say Yes to P2.
              *   4 voters say Yes to P3.
              *   But only 3 voters say Yes to *all three* (which determines their Conclusion vote).
              *   Example:
                  *   V1: Y, Y, Y (O=Y)
                  *   V2: Y, Y, Y (O=Y)
                  *   V3: Y, Y, Y (O=Y)
                  *   V4: Y, N, N (O=N)
                  *   V5: N, Y, N (O=N)
                  *   V6: N, N, Y (O=N)
                  *   V7: N, N, N (O=N)
