          *   To get PBP = Liable (Yes, Yes, Yes) but CBP = Not Liable (No):
          *   Voter 1: Y, Y, Y -> Liable
          *   Voter 2: Y, Y, Y -> Liable
          *   Voter 3: Y, Y, Y -> Liable
          *   Voter 4: Y, N, N -> Not
          *   Voter 5: N, Y, N -> Not
          *   Voter 6: N, N, Y -> Not
          *   Voter 7: N, N, N -> Not
          *   *Check:* A (4Y, 3N), B (4Y, 3N), C (4Y, 3N). PBP = Liable.
          *   *Check:* Verdict (3 Liable, 4 Not). CBP = Not Liable.
          *   *Wait, standard paradox usually involves 3 voters.* With 7, I need to ensure the majority on premises doesn't align with the majority on conclusion.
