  # Activity: The Tenure Committee Simulation

  ## 1. The Case and Allocation

  **Case:** *The University vs. Dr. Aris Thorne (Tenure Candidate)*
  **The Rule:** Per Faculty Handbook Statute 4.2.b, Tenure is granted **if and only if** the Committee affirms all three of the following propositions:
  1.  **Research:** The candidate's research is excellent.
  2.  **Teaching:** The candidate's teaching is excellent.
  3.  **Service:** The candidate's service is excellent.

  **Allocation (24 Students):**
  *   **Panel A (7 students):** The Paradox Profile (Premise Method ≠ Conclusion Method).
  *   **Panel B (7 students):** The Agreement Profile (Premise Method = Conclusion Method).
  *   **Panel C (7 students):** The Supermajority Profile (Simple Majority ≠ 2/3 Majority).
  *   **The Respondent (1 student):** Dr. Thorne. Sits at the front, silent, visibly anxious.
  *   **The Scribes (2 students):** Stand at the whiteboard. Scribe 1 tracks Panels A & B. Scribe 2 tracks Panel C & Time.

  ---

  ## 2. Role Cards (Evidence & Profiles)

  *Print these on distinct colored paper for each panel. Do not let panels mix cards.*

  ### Panel A: The Paradox (PBP = Grant, CBP = Deny)
  *Instruction to all:* "Based on the confidential file excerpts assigned to you, mark your judgment on the ballot. You are sworn to vote your sincere professional judgment based *only* on the evidence on this card."

  *   **Cards A1, A2, A3:**
      *   Research File: **EXCELLENT**
      *   Teaching File: **EXCELLENT**
      *   Service File: **EXCELLENT**
      *   *Sincere Vote:* Yes, Yes, Yes -> **GRANT**
  *   **Card A4:**
      *   Research File: **EXCELLENT**
      *   Teaching File: **INADEQUATE**
      *   Service File: **INADEQUATE**
      *   *Sincere Vote:* Yes, No, No -> **DENY**
  *   **Card A5:**
      *   Research File: **INADEQUATE**
      *   Teaching File: **EXCELLENT**
      *   Service File: **INADEQUATE**
      *   *Sincere Vote:* No, Yes, No -> **DENY**
  *   **Card A6:**
      *   Research File: **INADEQUATE**
      *   Teaching File: **INADEQUATE**
      *   Service File: **EXCELLENT**
      *   *Sincere Vote:* No, No, Yes -> **DENY**
  *   **Card A7 (The Strategist):**
      *   Research File: **INADEQUATE**
      *   Teaching File: **INADEQUATE**
      *   Service File: **INADEQUATE**
      *   *Secret Instruction:* "You are a senior colleague who desperately wants Dr. Thorne to **GET TENURE** (perhaps you need their research output). Your evidence says Deny. However, if you believe your vote can change the outcome, you may vote against your evidence to secure the Tenure grant. Decide privately."
      *   *Sincere Vote:* No, No, No -> **DENY**

  *(Math Check Panel A: Research 4-3 Yes, Teaching 4-3 Yes, Service 4-3 Yes. PBP = Grant. Verdict 3-4 Yes. CBP = Deny.)*

  ### Panel B: The Agreement (PBP = Grant, CBP = Grant)
  *Instruction:* "Vote your sincere professional judgment based only on the evidence on this card."

  *   **Cards B1, B2, B3, B4, B5:**
      *   Research: **EXCELLENT**
      *   Teaching: **EXCELLENT**
      *   Service: **EXCELLENT**
      *   *Sincere Vote:* Yes, Yes, Yes -> **GRANT**
  *   **Cards B6, B7:**
      *   Research: **INADEQUATE**
      *   Teaching: **INADEQUATE**
      *   Service: **INADEQUATE**
      *   *Sincere Vote:* No, No, No -> **DENY**

  *(Math Check Panel B: All Premises 5-2 Yes. Verdict 5-2 Yes. PBP = CBP = Grant.)*

  ### Panel C: The Supermajority (Simple = Grant, Super = Deny)
  *Instruction:* "Vote your sincere professional judgment based only on the evidence on this card."

  *   **Cards C1, C2, C3, C4:**
      *   Research: **EXCELLENT**
      *   Teaching: **EXCELLENT**
      *   Service: **EXCELLENT**
      *   *Sincere Vote:* Yes, Yes, Yes -> **GRANT**
  *   **Card C5:**
      *   Research: **EXCELLENT**
      *   Teaching: **EXCELLENT**
      *   Service: **INADEQUATE**
      *   *Sincere Vote:* Yes, Yes, No -> **DENY**
  *   **Card C6:**
      *   Research: **EXCELLENT**
      *   Teaching: **INADEQUATE**
      *   Service: **EXCELLENT**
      *   *Sincere Vote:* Yes, No, Yes -> **DENY**
  *   **Card C7:**
      *   Research: **INADEQUATE**
      *   Teaching: **EXCELLENT**
      *   Service: **EXCELLENT**
      *   *Sincere Vote:* No, Yes, Yes -> **DENY**

  *(Math Check Panel C: All Premises 6-1 Yes. PBP = Grant. Verdict 4-3 Yes. Simple CBP = Grant. 2/3 CBP (needs 5) = Deny.)*

  ---

  ## 3. Deliberation Rules (The Containment)

  **The "Blind Review" Constraint:**
  To prevent the paradox from evaporating through information pooling, you must enforce this script strictly at the start:

  > "You are simulating a committee where members have reviewed disjoint portions of the personnel file due to conflict-of-interest restrictions. You may discuss the *importance* of Research, Teaching, or Service. You may discuss the *procedure* for voting. You are **forbidden** from revealing your specific vote or the specific content of your evidence card (e.g., you cannot say 'I saw the student evals were 4.5'). You must vote based on the judgment on your card."

  **Why this holds:** It creates an epistemic barrier. Students cannot update their beliefs based on others' evidence because the rules forbid sharing the evidence itself. They are forced to aggregate *judgments*, not *information*.

  ---

  ## 4. Strategic Cards

  Included in **Panel A (Card A7)** as detailed above.
  *   **Goal:** To create tension between "voting my evidence" and "voting my interest."
  *   **Discovery:** If the student votes sincerely, the paradox holds. If they vote strategically (Yes on all), the Premise tally becomes 5-2 (still Grant), but the Verdict tally becomes 4-3 (Grant). **The paradox vanishes.**
  *   **Instructor Note:** If the paradox vanishes in Panel A because the strategist switched, use this in the debrief: "The rule is manipulable. One liar fixed the inconsistency, but broke the truth-tracking."

  ---

  ## 5. Run Sheet & Materials

  **Materials:**
  *   24 Role Cards (sorted into 3 envelopes: A, B, C).
  *   24 Ballots (simple slips of paper).
  *   Whiteboard divided into 3 Columns (Panel A, Panel B, Panel C).
  *   Timer (visible to class).

  **Board Layout:**
  | | Panel A | Panel B | Panel C |
  | :--- | :---: | :---: | :---: |
  | **Research (Y/N)** | | | |
  | **Teaching (Y/N)** | | | |
  | **Service (Y/N)** | | | |
  | **Verdict (Simple)** | | | |
  | **Verdict (2/3 Req)** | | | |

  **Timing (90 Minutes):**

  *   **00:00 – 00:10 (Setup):** Distribute cards. Seat panels at three round tables. Respondent at front. Scribes at board.
  *   **00:10 – 00:15 (The Script):** Chair (Instructor) reads the Administrative Script (below).
  *   **00:15 – 00:30 (Round 1 - Premises):** Panels deliberate (under constraints) and vote on Research, Teaching, Service separately. Scribes tally.
  *   **00:30 – 00:35 (Reveal 1):** Scribes post Premise tallies. Chair announces outcome based on Premise Method. (Panel A: Grant, Panel B: Grant, Panel C: Grant).
  *   **00:35 – 00:45 (The Twist):** Chair announces procedural error. Panels vote on Final Verdict directly.
  *   **00:45 – 00:50 (Reveal 2):** Scribes post Verdict tallies. Chair announces outcome based on Conclusion Method. (Panel A: Deny, Panel B: Grant, Panel C: Grant).
  *   **00:50 – 00:55 (The Supermajority):** Chair announces 2/3 rule for Panel C. (Panel C: Deny).
  *   **00:55 – 01:15 (The Fight):** Open floor. Why the difference? Which is right? Can we vote on the rule?
  *   **01:15 – 01:30 (Debrief):** Formal reveal and mapping.

  **The Administrative Script (Read Dryly):**
  > "Welcome to the Tenure Committee. Per University Statute 4.2.b, this body is required to ascertain the status of the statutory criteria prior to rendering a final determination. Accordingly, your first administrative task is to ballot separately on Research, Teaching, and Service. Once those tallies are certified, we will proceed to the final determination. Please treat this as routine housekeeping."

  ---

  ## 6. The Final Round (The Procedure Switch)

  At **00:35**, after Panel A has been told they granted tenure (via Premises) but the students know internally that most of them voted "Deny" on the final verdict:

  **Instructor Script:**
  > "Hold on. I am being informed by Legal Counsel that Statute 4.2.b was amended last year. We are not to vote on the criteria. We are to vote directly on the Tenure decision based on our individual holistic judgments. Please cast a new ballot: Grant or Deny."

  **The Regress Question (To ask at 01:05):**
  > "Okay, we have two different outcomes for Panel A depending on which rule we used. So, let's vote on which rule we *should* have used. Raise your hands for Premise-First. Raise your hands for Verdict-First."
  >
  > *Wait for the split.*
  >
  > "Wait. To vote on the rule, do we use the Premise-First rule or the Verdict-First rule to count *this* vote? You cannot use the rule to select the rule without begging the question."

  ---

  ## 7. The Debrief (Ordered Sequence)

  1.  **The Reveal:** Write **THE DISCURSIVE DILEMMA** (or **DOCTRINAL PARADOX**) on the board.
  2.  **Mapping:**
      *   Point to Panel A: "This is the Dilemma. Collective consistency failed. The group said Yes to A, Yes to B, Yes to C, but No to (A & B & C)."
      *   Point to Panel B: "This is consistency. But it required high agreement."
      *   Point to Panel C: "This is the Supermajority trade-off. You saved the 'Deny' verdict, but you overrode the unanimous-ish view on the premises."
  3.  **Formal Features (Plain Terms):**
      *   **Premise Procedure:** Prioritizes collective rationality on the *reasons*. Risk: Imposes a conclusion the majority rejects.
      *   **Conclusion Procedure:** Prioritizes collective responsiveness on the *outcome*. Risk: The reasons for the outcome are incoherent (e.g., 4 people said Research was bad, but we granted tenure).
      *   **The Trade-off:** You cannot have a voting system that guarantees: (1) The group is logically consistent, (2) Everyone's vote counts equally, and (3) The group respects unanimous agreement on every issue. You must sacrifice one.
  4.  **The Epistemic Point:**
      *   "The Premise Method pools information about the *truth of the grounds*. The Conclusion Method pools information about the *responsibility for the act*. In Panel A, the Premise Method found the 'truth' (the evidence supported tenure) but violated the 'will' (the voters didn't want it). The Conclusion Method respected the 'will' but ignored the 'truth' of the aggregated evidence."

  ---

  ## 8. Failure Analysis

  **1. Students Reverse-Engineer the Design:**
  *   *Symptom:* "Wait, why do we have different cards? Are we supposed to share?"
  *   *Fix:* Reinforce the "Blind Review" constraint immediately. "In real committees, members often have different expertise. You are simulating that fragmentation. Do not share."

  **2. The Strategist Breaks the Paradox:**
  *   *Symptom:* Panel A votes "Grant" on both rounds.
  *   *Fix:* Pivot. "The paradox disappeared. Why? Because one person lied. This proves the system is *manipulable*. The Doctrinal Paradox creates an incentive to vote insincerely. That is a feature, not a bug, of the instability."

  **3. One Panel Finishes Early:**
  *   *Symptom:* Panel B finishes in 5 minutes, starts talking to Panel A.
  *   *Fix:* The Scribes/Instructor must hold the tallies. "Committee B, please sit on your hands. We do not release findings until all committees have reported. This is a simultaneous release."

  **4. Premature Procedural Fix:**
  *   *Symptom:* "Just use the Premise Method, it's more logical."
  *   *Fix:* Ask the Respondent (Dr. Thorne). "Dr. Thorne, you just lost your tenure in Panel A because of a rule you didn't get to vote on. Is that logical?" Remind them that procedural choices have distributive consequences.

  ---

  ## 9. Structural Limitations (What You Must Supply)

  **1. The "One-Shot" Problem:**
  *   *Limitation:* In this activity, no one has to live with the decision tomorrow. Real committees develop norms over time to avoid these paradoxes (e.g., "We always vote on premises").
  *   *Supply:* In the debrief, explicitly state: "This was a single shot. In real life, you would build a precedent. But precedents are just frozen versions of today's procedural fight."

  **2. The "Fixed Profile" Problem:**
  *   *Limitation:* You handed them a profile that *guarantees* the paradox in Panel A. They may file this as "a trick of the numbers" rather than a systemic risk.
  *   *Supply:* Tell them: "I engineered Panel A. But mathematical models show that as the number of propositions increases, the probability of this happening by chance approaches 100%. This wasn't a curiosity; it was a demonstration of inevitability."

  **3. The "Accountability" Problem:**
  *   *Limitation:* No one is answerable for the decision.
  *   *Supply:* Ask the students: "If the press asks why Dr. Thorne was denied tenure in Panel A, what is the official reason? 'The majority said No'? Or 'The criteria were met'? You have two contradictory official records. Which one goes in the minutes?"
