  In my lab's group meeting last week I defended a design choice and was shut down with a slogan, and the same slogan then turned up twice more in unrelated conversations, each time doing different work. The first use: I argued that our structured decoder — a model whose hypothesis space is deliberately restricted by the physical constraints we know the signal obeys — should beat a much larger, less constrained model trained on the same recordings, and that this is a claim we can motivate in advance rather than only discover after the fact. A senior postdoc said this was naïve, because by no free lunch, averaged over all possible target functions every learner does exactly as well as every other, so there is no such thing as a better inductive bias, only a bias that happens to fit, and any attempt to argue in advance that a bias is *justified* rather than merely *lucky* is question-begging. The second use, a few days later: a colleague presented strong results on a standard benchmark, and the same postdoc said the benchmark 'proves nothing' about the model's real capability, again citing no free lunch. The third use, in a journal club on philosophy of science: someone claimed that the theorem finally settles Hume — that it is a mathematical proof that inductive inference has no rational foundation, and that anyone still writing about the problem of induction is doing so in ignorance of a solved result. I do not believe all three can be right, and my working hypothesis is that the third is a straightforward non sequitur while the first two are inflated versions of something much weaker, but I cannot say where the theorem stops and the philosophy starts.

  What I want is a disambiguation, not a survey: separate the distinct precise propositions that 'no free lunch' could be standing for, running from the bare formal result all the way up to the strong epistemological readings, and for each one tell me what it literally asserts (with the quantifiers and the averaging made explicit), whether it is true, and which of the three uses above it would actually license. Two things should get special attention. First, the role of the averaging set: I understand that the clean result requires something like invariance of the distribution over objective functions under permutation of the candidate-solution space, together with restrictions such as deterministic, non-resampling search, and that there are weakened 'almost' versions that get by with less — so for every reading, say what survives if the average is taken over a physically or statistically restricted class of target functions instead of all of them, and which readings collapse under that restriction. Second, I have a candidate fourth use of my own that nobody in my lab has articulated: the suspicion that there is a meta-level reading on which any procedure that selects among priors on the basis of observed data is itself in scope for the theorem, so that the question of which inductive bias is better can never be settled from inside the data at all. Tell me whether that is a genuine, distinct reading or just the first use restated, and whether it would rescue the postdoc's dismissal of my design argument. I do not want references or a reading list — I want the claims themselves and your verdicts on them.

  Please give me your answer as a single JSON object with exactly these fields. `summary`: a string of at most 180 words of plain prose, aimed at me as a non-philosopher, stating the overall picture. `the_hinge`: a string, one sentence naming the single distinction on which most of the disagreement turns. `readings`: an array of objects, one per distinct claim you identify, each with `id` (a string like "NFL-1"), `statement` (the claim in precise form), `status` (one of "theorem", "true but near-vacuous", "substantive and defensible", "substantive and doubtful", "false", "not a claim but a question"), `conditions` (what must be fixed for it to hold — problem class, averaging measure, permutation invariance, determinism, and so on), `survives_restricted_worlds` (what becomes of it under a non-uniform or physically restricted class of target functions), `licenses` (an array of integers drawn from 1, 2, 3 corresponding to the three uses above; empty if it licenses none), and `who_means_this` (which kind of person invokes this reading, e.g. optimization theorists, ML practitioners, philosophy-of-induction writers). `use_verdicts`: an array of exactly three objects, each with `use` (1, 2, or 3), `best_reading_id` (the id of the reading its speaker most likely has in mind), `supported` (boolean), and `one_line_reason` (a string). `meta_learning_reading`: an object with `is_genuinely_distinct` (boolean), `statement` (the reading as you would formulate it precisely), `rescues_use_1` (boolean), and `comment` (two or three sentences).
