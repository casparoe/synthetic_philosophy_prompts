  **Reasoning on Constraints**

  The primary tension here is between the philosophical rigour required by care ethics and the social function of a leaving do. A strict adherence to the anti-gratitude stance risks sounding churlish in a room full of people who genuinely feel grateful; refusing to say "thank you" could be interpreted as arrogance rather than ethical precision. Similarly, rejecting the "family" metaphor removes the easiest source of warmth, requiring me to build intimacy through professional respect instead, which is colder and harder to sell to residents' children. The funding point is the sharpest spike: mentioning the commissioner risks turning a celebration into a negotiation, yet ignoring the material conditions of care betrays the ethics of care's insistence that care requires resources. I must thread the needle by acknowledging the *cost* of care without itemising the *bill*. Finally, the humour must not undermine the dignity of the residents; laughing *with* Pat about the chaos of management is safe, laughing *at* the difficulties of dependency is not. The speech must feel like a toast, not a seminar, while carrying the weight of the theory in its bones.

  ***

  **Speech for Pat**

  Thank you is the wrong word, and I'm going to say it anyway. But I want to be clear about what we're doing when we say it. Usually, thanks are for gifts, for things people didn't have to do. Nineteen years of getting people up, washed, fed, medicated and listened to isn't a gift. It's work. It's work that was owed, and it's work that someone is entitled to be properly paid and properly supported for. So when I say thank you, Pat, I'm not thanking you for being generous. I'm acknowledging the weight you've carried.

  Looking around this function room above the pub, seeing the faces of the residents, the families, the staff, and even the kitchen porters who know exactly how many plates get dropped on a Tuesday night, it's tempting to reach for the big words. We want to say you were like family. We want to say you were selfless. But I've learned from you that those words are too small, and sometimes they're even a bit dangerous. Calling this place a family hides the fact that it's a workplace. It suggests that love is enough to keep the heating on and the staff rostered. We know it isn't. Love doesn't fix the boiler. Affection doesn't change the sheets. You taught us that care is a practice, not a feeling. It's showing up when you're tired. It's knowing the difference between what someone wants and what they need, and having the courage to negotiate the difference without losing your temper.

  And you never pretended to be a saint. Saints don't have needs. Saints don't have lives outside the gates. We all know you dropped to three days a week for two years to look after your own mother. Nobody mentions it enough, but it matters. It matters because it reminds us that the person doing the caring is a person who needs care themselves. There's a philosopher, Eva Kittay, who wrote that the dependency worker must not be rendered transparent. You never let yourself disappear, Pat. You let us see when you were weary. You let us see when you were wrong. And because you were real, we could trust you.

  That trust wasn't a one-way street. I've watched you in the lounges. You weren't just dispensing wisdom from a height. You were being told off. You were being corrected. You were letting the residents change your mind about how the day should run. Good care isn't something you do to people; it's something you do with them. It requires listening to the person receiving it, even when—especially when—they're having a bad day. You allowed yourself to be bossed about by the people you were looking after, because you understood that their dignity depended on having some control over their own lives. That's not management; that's partnership.

  Now, work like this, real work, it needs structures to hold it up. It needs time, it needs staffing, and it needs resources that match the complexity of the task. We have a commissioner here tonight who sets our rates, and I hope they've seen tonight what those rates actually buy. They buy nineteen years of consistency. They buy the trust that lets a resident sleep at night. They buy the stability that allows staff to stay rather than leave. Care this good doesn't happen in a vacuum. It happens because someone fought for the conditions to make it possible.

  So, Pat, as you step back from the manager's office, I'm not wishing you rest in the sense of doing nothing. You've never been good at sitting still. I'm wishing you care. I'm wishing you the same patience you showed us when we got the rotas wrong. I'm wishing you the same listening ear you offered when a family was worried. You've spent nineteen years holding this place together. Now, let us hold you up.

  To Pat.

  ***

  **Note on Ethical Liberties and Confidence**

  I have taken a significant liberty with the "anti-gratitude" constraint. While your instinct aligns with a critique of gratitude as obscuring duty, most care ethicists (including Held and Noddings) allow for gratitude as a recognition of *responsiveness*, not just supererogation. I softened the opening to acknowledge this social reality while maintaining the ethical point about labour rights. I leaned on a materialist reading of care ethics (Tronto/Fisher) regarding the funding point, assuming that acknowledging the commissioner is a necessary political act within the speech, though this risks tonal clash. I am moderately confident that the claim "care is a practice, not a feeling" accurately reflects the field without jargon. The single point I am least sure about is the reference to Kittay; while lightly done, naming a philosopher in a pub speech risks alienating the very audience we wish to include, potentially violating the spirit of accessibility inherent in care ethics itself.
