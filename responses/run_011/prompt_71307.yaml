answer: |-
  This design is built for a 90-minute session with 18–25 participants. It treats the group as a system to be calibrated, not an audience to be persuaded. The numbers are invented, self-contained, and tuned to force the specific contradictions you requested.

  ### Title: The Pot and The Pinch

  **Materials to Prepare:**
  1.  **The Policy Board:** A whiteboard or flipchart with three sliders drawn on it (0–100%).
  2.  **Justification Cards:** 25 index cards and pens.
  3.  **Claimant Dossiers:** 25 envelopes. Inside each:
      *   *Card A (Status):* "Eligible" (20 cards) or "Ineligible/Fraud" (5 cards).
      *   *Card B (Life):* Specific obstacles (see *Numbers & Mechanics* below).
      *   *Card C (Ledger):* A blank sheet to track their money.
  4.  **Audit Reports:** Two pre-printed sheets (World A and World B) for the debrief.
  5.  **Tokens:** Poker chips or counters (optional, but helps visualize the "Pot").

  ---

  ### The Numbers & Mechanics (The "Calibration")

  *These numbers are invented. Do not change them during the session.*

  **1. The Benefit Trap (The Taper)**
  *   **Base Benefit:** £100 per week.
  *   **Wage:** £10 per hour (jobs are available).
  *   **Taper Rate:** For every £1 earned, Benefit reduces by £0.80.
  *   **Work Costs:** Fixed £50 per week (travel, uniforms, childcare) regardless of hours.
  *   **The Trap:**
      *   Work 0 hrs: Income £100 (Benefit) - £0 (Cost) = **£100**.
      *   Work 5 hrs: Earn £50. Benefit cuts by £40. Net Income £110. Minus Work Costs £50 = **£60**.
      *   *Result:* Working 5 hours makes you £40 poorer than doing nothing.
      *   *Break-even:* You must work 25 hours/week just to match the benefit level.

  **2. The Sanction (Capacity vs. Willingness)**
  *   **Rule:** Miss one mandatory appointment = 50% benefit cut for 4 weeks.
  *   **Total Loss:** £200.
  *   **Obstacles (in Dossiers):**
      *   *Van Breakdown:* Repair costs £100. If you pay it, you can attend. If you don't, you miss.
      *   *Child Inhaler:* Emergency replacement £40.
      *   *Shift Rota:* Changed with 24hrs notice (unavoidable).
  *   **The Trap:** If your dossier has a "Van" or "Inhaler" event and you have <£100 cash reserve, you physically cannot afford to comply, even if you want to.

  **3. The Verification (Base-Rate Trap)**
  *   **Verification Budget:** Cost per check = £200.
  *   **Recovery:** If fraud is found, you recover £1,000.
  *   **Test Accuracy:** 90% accurate (10% false positive rate on honest people; 10% false negative on fraudsters).
  *   **World A (Low Fraud):** 5% of claimants are cheating.
  *   **World B (High Fraud):** 30% of claimants are cheating.

  ---

  ### Timeline (90 Minutes)

  #### 0:00 – 0:05 | Introduction
  *   **Script:** "We are running a closed system. There is a fixed pot of money. Your goal is to maximize 'Need Relieved' and minimize 'Cheating.' There are no right answers, only outcomes. I am the computer; you are the committee."
  *   **Note:** Do not mention the real world. Do not mention the fixed-pot limitation yet.

  #### 0:05 – 0:30 | Phase 1: The Committee (25 mins)
  *   **Task:** The group must agree on three settings.
      1.  **Taper:** How fast benefit drops as earnings rise? (Suggest range 0–100%).
      2.  **Sanction:** How harsh is the penalty for missing an appointment? (Suggest range: Warning to 100% cut).
      3.  **Verification:** What % of the total pot is spent on checking claimants? (Suggest range 0–20%).
  *   **Constraint:** They must vote. Majority rules.
  *   **The Card:** Before the final vote, hand out the index cards.
      *   **Instruction:** "Write one sentence. Why is your preferred setting fair to the people who play by the rules? No names on the card."
      *   **Action:** Collect these in a box. Do not look at them.

  #### 0:30 – 1:10 | Phase 2: The Claimants (40 mins)
  *   **Setup:** Hand out the Envelopes. Tell them: "You are now inside the machine you just built. You have 3 months (3 rounds)."
  *   **Round 1:**
      *   Reveal *Card B (Life)*. Did an event happen? (e.g., Van broke).
      *   Decision: Do you spend money to fix it to attend the appointment?
      *   Reveal *Card C (Ledger)*. Calculate income based on the Phase 1 Taper.
  *   **Round 2:**
      *   New Life Event (e.g., Shift change).
      *   Opportunity: A cash job is offered (undeclared). Do you take it? (If they took Card A "Fraud", they *must* take it).
      *   Calculate income. Apply Sanctions if appointments were missed.
  *   **Round 3:**
      *   Final tally. Who has less than £50 for food? Who has increased their total wealth?
  *   **Facilitator Role:** Walk around. If someone hits the "Trap" (working makes them poorer), do not tell them. Ask: "What does your ledger say?"
  *   **The Split:** *Crucial Modification for Time.* You cannot play the game twice. Instead, secretly mark 5 envelopes "World A" and 5 envelopes "World B" (the rest are neutral). This only matters for the Audit phase.

  #### 1:10 – 1:30 | Phase 3: The Audit & Debrief (20 mins)
  *   **The Audit Reveal (10 mins):**
      *   Ask the group: "You voted to spend £X on verification. Did it pay off?"
      *   **Handout 1 (World A):** "Imagine the true fraud rate was 5%." Show the math: Cost of checks > Fraud Recovered. The verification budget *reduced* the money available for need.
      *   **Handout 2 (World B):** "Imagine the true fraud rate was 30%." Show the math: Fraud Recovered > Cost of checks. The verification budget *increased* the pot.
      *   **Point:** "You set the budget without knowing the base rate. In one world, you were righteous. In the other, you were wasteful. The math is identical; the reality flipped."
  *   **The Debrief Questions (10 mins):**
      1.  "Look at your ledger. Did anyone find that working more hours reduced their total money? How did that feel?"
      2.  "Who missed an appointment because they couldn't afford the travel/repair, not because they didn't want to go? Did the sanction distinguish between you and someone who just didn't show up?"
      3.  (Read 3 random Justification Cards aloud). "We wrote these 40 minutes ago. Do they still make sense given what happened to your ledger?"
      4.  "If you don't know the fraud rate, can you ever set the verification budget rationally?"

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The Current Claimant**
  *   **Risk:** One participant is currently on benefits. Phase 2 may feel like a hostile interrogation or too close to home.
  *   **Fix:** In the intro, add: "If at any point the simulation feels too close to your personal reality, you have a 'Pass' card. You can step out to get a tea, or take the role of 'Auditor' who just watches the math." Give them an out without drawing attention.

  **2. The Dominant Voice**
  *   **Risk:** One person (likely the one who reads the local paper religiously) dominates Phase 1 policy setting.
  *   **Fix:** Use "Silent Voting" first. Everyone writes their three numbers on a sticky note. Stick them on the board. *Then* discuss. This anchors the quiet voices before the loud one speaks.

  **3. The "It's Not Real" Objection**
  *   **Risk:** Someone says, "In real life, you can keep more earnings," or "The pot isn't fixed."
  *   **Fix:** "You are right. In this room, the rules are what we wrote on the board. For the next 40 minutes, physics is what we say it is. We can discuss the real world in the debrief."

  ---

  ### Limitations & Confessions

  **The Fixed-Pot Framing**
  *   **Should you confess up front?** No. If they know the pot is artificial, they will optimize for "government savings" rather than "human outcome."
  *   **When to confess:** In the debrief. "In the real world, the pot isn't fixed; spending benefits can stimulate the economy. But in a closed system, every pound spent on checking is a pound not spent on need. That tension is what we felt."

  **What This Activity Cannot Reproduce**
  1.  **Dignity:** The game reduces humans to ledgers. It cannot simulate the shame of a sanction, only the financial loss. You must supply that in the debrief questions.
  2.  **Long-term Scarring:** A sanction in the game lasts 3 rounds. In life, a sanction can ruin credit for years.
  3.  **The Labor Market:** The game assumes jobs are available (£10/hr). It does not simulate a recession where no jobs exist regardless of willingness.

  ---

  ### Uncertainty Analysis (Where I Might Be Wrong)

  You asked for the weak points in the design and the conditions under which your premise (heavy conditionality is bad) might be false.

  **1. The Benefit Trap Sensitivity**
  *   **Risk:** If the group sets the Taper below 60%, the "working makes you poorer" trap disappears.
  *   **Observation:** Watch Phase 1. If they vote for a low taper (e.g., 40%), the Trap mechanic will fail.
  *   **Intervention:** You cannot veto their vote. But in the debrief, you can say: "You set the taper at 40%. At that rate, the trap doesn't trigger. But if the government needed to save money, would the taper have to rise? At what point does it break?"
  *   **Redesign Trigger:** If more than 50% of players end Phase 2 wealthier by working, the numbers need tuning (increase Work Costs or Taper).

  **2. The Sanction Mechanism**
  *   **Risk:** Players might treat the sanction as a "cost of doing business" if the fraud payoff is high enough.
  *   **Observation:** If the "Fraud" players (Card A) end the game richer than the "Eligible" players despite sanctions, the lesson becomes "Crime Pays," not "Sanctions Hurt the Vulnerable."
  *   **Fix:** Ensure the Fraud Recovery (£1000) is high enough that getting caught is catastrophic for the fraudster, but the Sanction (£200 loss) is catastrophic for the honest poor.

  **3. The Base-Rate Fallacy (The Core Argument)**
  *   **Where I am least sure:** This relies on the group accepting that the "True Fraud Rate" is unknowable. If they believe they *know* it's high (based on the news), the math won't change their minds.
  *   **Condition for Heavy Conditionality being Right:**
      *   **Evidence:** If the fraud rate is structurally high (e.g., >25%) *and* the cost of verification is low (automated data matching) *and* the labor market is fully absorbing (jobs available for everyone sanctioned).
      *   **Argument:** If fraud is a drain large enough to collapse the scheme, verification is not just righteous, it is existential. If the sanction drives people into work *that exists and pays*, conditionality increases aggregate welfare.
      *   **What would change my mind:** Data showing that sanctions consistently move people into *sustainable* employment rather than cycling them through penalties. If the "capacity to comply" gap can be closed with cheap support (e.g., £50 bus pass prevents £200 sanction), then conditionality + support is superior to conditionality alone.
      *   **The Game's Blind Spot:** The game assumes verification is expensive manual checking. If AI/Data matching drops the cost per check from £200 to £2, the Base-Rate Trap vanishes. Verification becomes cheap insurance. This is the biggest real-world variable the game ignores.

  **Final Note for the Chemist:**
  You are used to traceable standards. In this game, the "Standard" (the fraud rate) is untraceable. That is the anxiety you want them to sit with. The discomfort shouldn't be "The system is cruel," it should be "We made decisions with blinders on." That is a much harder feeling to argue away.
