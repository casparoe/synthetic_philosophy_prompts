          2.  *Objective Goods (Huxley's likely intent).* Meaning requires objective struggle, not just satisfied preference.
          3.  *Paternalistic Power.* Mond knows best, regardless of volition.
      *   *Analysis of Mond:* He argues for convergence on stability. It's strong rhetorically because he controls the premises (history is war). But it fails the "idealized agent" test because the agents aren't allowed to know the alternatives vividly (they are conditioned against it).
      *   *The Three Dissidents:*
