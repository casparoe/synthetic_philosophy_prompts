          *   Verdict: They show divergence. Idealized agents *would* diverge if "ideal" includes truth.
      *   *Adaptive Preferences:* Hypnopaedia is adaptive preference formation (Elster). It's not character planning because the citizen isn't the planner. This violates the "Volition" in CEV.
      *   *Corrupted Inputs:* Yes, BNW dramatizes the "Garbage In, Garbage Out" problem of CEV. The Alpha Island story confirms this (memory check: Yes, the Cyprus experiment).
      *   *John's Objection:* It's not about preference theory; it's about the *ontology* of the self. You can't have a self without the possibility of negation.
      *   *Conclusion:* What the novel adds (the cost of stability on the soul). What to strike (the idea that Mond represents a *honest* extrapolation rather than a *forced* one).

  7.  **Checking Constraints:**
