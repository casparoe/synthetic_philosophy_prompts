      *   *Interpretation A: The Strong Computability Claim (Church-Turing).*
          *   Assertion: Any effectively calculable function is computable by a Turing Machine.
          *   Truth: Widely accepted as a thesis, not a theorem. No counterexamples found.
          *   Relevance: Irrelevant to the business case. It says *possible in principle*, not *cheap or fast*.
          *   Ambiguity: "Can do it" = logical possibility vs. economic viability.

      *   *Interpretation B: The Explicit Rules Claim.*
          *   Assertion: If the process can be fully formalized into an algorithm, a machine can execute it.
          *   Truth: True, *if* the rules are fully formalized.
          *   Relevance: The user says rules are *not* written down. This is the crux. Human intuition/heuristics $\neq$ explicit rules.
          *   Ambiguity: "Following rules" = explicit algorithm vs. tacit human judgment.

      *   *Interpretation C: The Complexity/Efficiency Claim.*
          *   Assertion: A machine can do it *within business constraints* (time, cost).
          *   Truth: False. Many computable problems are intractable (NP-hard, etc.).
          *   Relevance: Critical. Even if computable, it might take 1000 years of CPU time.
          *   Ambiguity: "Can do it" = eventually vs. by Tuesday.

      *   *Interpretation D: The Knowledge Acquisition Claim.*
          *   Assertion: We can extract the rules from the humans to give to the machine.
          *   Truth: Unproven/Highly Debatable (Polanyi's Paradox: "We know more than we can tell").
          *   Relevance: High. If you can't write the rules, you can't build the machine (unless using ML, which has its own issues).
          *   Ambiguity: "Following rules" implies the rules exist in a transferable format.

