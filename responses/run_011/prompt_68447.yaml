      *   **Context:** The work involves interpreting messy documents, determining clause triggers, and sometimes concluding policies don't mean what they look like. Rules are *not* written down (tacit knowledge).
      *   **Key Insight:** The user already suspects the ambiguity lies in "following rules" and "can do it" (theoretical vs. practical).

  2.  **Deconstruct the Slogan:**
      *   "If a person can do it by following rules, a machine can do it."
      *   **Claim 1: The Mathematical/Computability Claim.** This is likely what the consultant is referencing (Church-Turing Thesis, Turing Machines, Gödel).
      *   **Claim 2: The Economic/Practical Claim.** This is what the VP cares about (cost, speed, feasibility).
      *   **Claim 3: The Epistemological Claim.** This is about the nature of the work (are there actually rules?).

