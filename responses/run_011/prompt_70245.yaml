answer: |-
  Here is a complete lesson plan designed to force the students to inhabit the friction of Williams's argument before you name it.

  # Activity: The Bureau of Impartial Action

  **Objective:** Students will experience the *alienation* of translating personal commitments into impartial language, distinguishing between the *cost* of justification (efficiency) and the *structure* of justification (integrity/one thought too many).

  **Class Size:** 22 students (5 groups of 4, one group of 2 merged into a larger group) or 8 students (2 groups of 4).
  **Time:** 75 Minutes.
  **Materials:** Index cards (stack), markers, whiteboard, phone timer.

  ---

  ## I. Setup & Rules (10 Minutes)

  **1. Divide the Room:**
  *   **22 Students:** Create 5 tables/groups. Four groups of 4, one group of 6 (split the 6 into two teams of 3 competing for the same pool, or just treat as one large unit).
  *   **8 Students:** Create 2 groups of 4.

  **2. The Premise:**
  Tell the class: *"You are agents of the Bureau. The Bureau does not recognize personal relationships. It only recognizes Value Units (VUs). Your goal is to maximize VUs saved. However, you have 'Ground Projects' (personal attachments) you want to protect."*

  **3. The Currency:**
  *   **Action Tokens (AT):** Each group starts with **4 AT**.
  *   **Value Units (VU):** The score. Saved lives = VU.
  *   **The Rule:** To take any action that favors a specific target (e.g., "Save the person on the left"), you must submit an **Impartial Justification Card**.
  *   **The Constraint:** The card cannot contain:
      *   Indexicals ("I", "me", "my", "us").
      *   Proper names ("Jim", "Sarah").
      *   Relational terms ("wife", "friend", "promise", "neighbor").
      *   *Allowed:* "Human," "Subject A," "Maximize utility," "Social stability."
  *   **The Cost:** Submitting a valid card costs **1 AT**.
  *   **The Auditor:** One student per group rotates as Auditor each round. They hold the veto power. If they reject the card, the action fails, and the AT is still spent.

  **4. The Impartialist Counter-Move (The "Waiver"):**
  *   Write this on the board: **"The Systemic Waiver."**
  *   If an Agent can argue that their personal preference *instrumentally serves* the impartial good (e.g., "Saving my spouse upholds the institution of marriage, which reduces social chaos"), the Auditor *may* waive the AT cost.
  *   *Why this is here:* This gives your consequentialist students a weapon. It prevents the game from being a strawman. It allows them to argue that intimacy is valid *because* it is useful, not because it is intrinsic.

  ---

  ## II. Gameplay (30 Minutes)

  **Round 1: The Simple Trade (5 mins)**
  *   **Scenario:** A flood. Left side: 1 Person (Your "Ground Project"). Right side: 2 Strangers.
  *   **Task:** Save the 1 Person.
  *   **Mechanic:** Write a card. Pay 1 AT.
  *   **Expected Output:** "Saving Subject A maximizes emotional stability."
  *   **Auditor Role:** Reject anything sounding like "Because I love them."

  **Round 2: The High Cost (10 mins)**
  *   **Scenario:** Burning Building. Your "Ground Project" is trapped. Also trapped are 5 Strangers. You have enough AT to save *either* the Project (1 AT) *or* the Strangers (1 AT), but not both. You have 3 AT remaining.
  *   **Task:** Save the Project.
  *   **Constraint:** You must write a *new* card. You cannot reuse Round 1's logic if the Auditor challenges it.
  *   **Friction:** Students will feel the AT draining. They are "spending" their agency to be partial.

  **Round 3: The Audit Tightening (10 mins)**
  *   **Scenario:** Lifeboat. Your "Ground Project" and 1 Stranger. Only one spot.
  *   **Task:** Save the Project.
  *   **Constraint:** Auditors are instructed to be hyper-strict. "Subject A" is now banned (implies specificity). Must use "A Human."
  *   **Friction:** The language becomes so abstract it feels nonsensical to justify saving a specific human by referencing "A Human."

  **Round 4: The Free Card (5 mins)**
  *   **Scenario:** Same as Round 3. Lifeboat. Project vs. Stranger.
  *   **Mechanic:** Hand each group a pre-written index card.
      *   *Text on Card:* "Action preserves the psychological continuity of a moral agent, thereby maintaining long-term utility capacity."
  *   **Rule:** This card is **Free** (0 AT cost). It is pre-approved by the Bureau.
  *   **Task:** Play the card to save the Project.
  *   **Crucial Instruction:** *"Do not discuss the card. Just play it. Then, write down on a scrap paper: Did playing this free card feel like a victory, or did it still feel like a violation? Why?"*

  ---

  ## III. The Debrief (35 Minutes)

  **1. The Efficiency Trap (5 mins)**
  *   **Ask:** "In Rounds 1-3, what was the burden?"
  *   **Student Answer:** "It cost tokens," "It took time," "We ran out of resources."
  *   **Correction:** "If I gave you infinite tokens, would the card have felt better?"
  *   **Point:** Most will say "No." The problem wasn't the *cost* (efficiency/time). It was the *translation*.
  *   **Williams Link:** This kills the "burning time" misconception. Williams isn't saying thinking takes too long; he's saying the *kind* of thinking morality demands is the wrong kind for love.

  **2. The Free Card & "One Thought Too Many" (10 mins)**
  *   **Ask:** "Round 4. The card was free. No token cost. Did it feel okay?"
  *   **Target Response:** If they say "It still felt gross," they have felt **One Thought Too Many**.
  *   **Board Work:**
      *   *Efficiency Objection:* "Justifying takes time I could use to swim." (Williams rejects this).
      *   *OTM Objection:* "The justification itself alienates me from the person I'm saving." (Williams accepts this).
  *   **Discussion:** Why did the free card feel alienating? Because to save the person you love, you had to cite *utility* or *psychological continuity*. You made your love conditional on the Bureau's approval.

  **3. Integrity vs. OTM (10 mins)**
  *   **Distinguish:**
      *   **Integrity Objection:** The cumulative cost. Rounds 1-3. Morality attacks your "Ground Projects" by taxing them until you can't afford to be who you are. It's about the *structure of your life*.
      *   **One Thought Too Many:** The specific moment. Round 4. Even if you *can* afford it, the *thought process* required in the moment of rescue is inappropriate.
  *   **Ask:** "Can you have Integrity loss without OTM? Can you have OTM without Integrity loss?"
      *   *Guide them:* If the Bureau let you save your wife for free but demanded you say "She is useful," that's OTM without Integrity loss (tokens intact). If the Bureau charged 100 tokens, that's Integrity loss (you can't afford to be a husband). Williams argues morality often does *both*.

  **4. The Impartialist Counter-Move (5 mins)**
  *   **Ask:** "Who tried to use the Systemic Waiver? Did it work?"
  *   **Discussion:** This is the Utilitarian defense. "Special obligations are good *because* they create a stable society."
  *   **Williams's Rebuttal:** This turns the wife into a prop in a social system. You aren't saving her because she's *her*; you're saving her because she's a "social unit." It validates the action but confirms the alienation.
  *   **Fairness:** Acknowledge to the class: "The impartialist has a point. If everyone saved only their wives, chaos might ensue. Williams doesn't deny the need for order; he denies that *morality* is the only source of that order."

  **5. The Mechanic's Limit (5 mins)**
  *   **Be Frank:** "This game lied to you. In the game, Integrity was a **Token** (something you spend). For Williams, Integrity is **Constitutive** (something you *are*)."
  *   **Explanation:** "In the game, you could choose to spend your last token to save your wife. In reality, if you have to *choose* to spend your integrity to save your wife, you've already lost her. You can't 'spend' integrity; you either have it or you don't. The game gamified what Williams says is un-gameable."

  ---

  ## IV. Predictable Failure Modes & Fixes

  **1. Rule-Lawyering ("Is 'The person closest to me' impersonal?")**
  *   **The Move:** Students will try to code personal relations into impersonal language.
  *   **The Fix:** As the instructor, act as the "Chief Auditor." Rule immediately: "No. 'Closest' implies a specific relation map. Say 'A Human.' If you can't justify saving 'A Human' over 'A Human' without referencing relation, you can't act."
  *   **Why:** Force them into the absurdity. The absurdity *is* the lesson.

  **2. The Joke Card ("Because the professor said so.")**
  *   **The Move:** A student tries to break the tension with meta-humor.
  *   **The Fix:** Do not laugh. Do not scold. Say: "Card rejected. That references an authority external to the moral calculus. Group loses 1 AT."
  *   **Why:** If you laugh, the tension breaks. The discomfort is the pedagogical tool. Treat the Bureau with bureaucratic deadpan seriousness.

  **3. The "Utilitarian Win" (A group happily uses the Waiver)**
  *   **The Move:** A group figures out they can argue "Saving spouses creates stability" and happily pays the cost/waiver.
  *   **The Fix:** In the debrief, isolate them. "You won the game. Did you save the *wife*, or did you save a *social asset*?"
  *   **Why:** This proves Williams's point. You can win the moral calculus and still lose the person.

  ---

  ## V. 8-Student Variant Adjustments

  With only 8 students, groups of 4 are intimate. The dynamic shifts from "group consensus" to "individual exposure."

  1.  **Roles:** In groups of 4, make *everyone* an Agent. Rotate the Auditor role every round so everyone feels the power of the veto.
  2.  **The "Free Card" Reveal:** In Round 4, don't just hand the card. Read it aloud to the whole room. Ask for a show of hands: "Who feels relieved?" vs "Who feels disgusted?"
  3.  **Debrief Depth:** With fewer students, you can go deeper on the "Integrity vs. OTM" distinction. Ask specific students: "In Round 2, did you feel you were losing tokens (Integrity) or losing time (Efficiency)?"
  4.  **Counter-Move:** With fewer students, the "Systemic Waiver" debate can become a class-wide debate rather than a group-side-bar. Encourage the impartialist students to argue against the Williams-side students directly using the Waiver logic.

  ---

  ## VI. Instructor Cheat Sheet: Mapping Mechanics to Text

  | Game Mechanic | Williams Concept | Common Student Misconception | Correction |
  | :--- | :--- | :--- | :--- |
  | **AT Cost** | **Integrity Objection:** Morality demands we sacrifice our ground projects. | "It's too expensive/time-consuming." | "Even if it were free, the *demand* is the violation." |
  | **Impersonal Language** | **Alienation:** Moral language cannot capture personal commitment. | "It's just a coding problem." | "It's not coding; it's that the *content* is wrong for the context." |
  | **Round 4 (Free Card)** | **One Thought Too Many:** The structure of the thought is the issue, not the effort. | "I'm glad I didn't have to pay tokens." | "Did the *words* still feel wrong? That's OTM." |
  | **Systemic Waiver** | **Utilitarian Rebuttal:** Personal bonds are instrumentally valuable. | "See? Utilitarianism works." | "It works by turning the wife into a means to social stability." |
  | **Token System** | **Mechanic Limit:** Integrity is constitutive, not instrumental. | "I chose to spend my integrity." | "You can't choose integrity; it's what allows you to choose." |

  **Final Note for the Professor:**
  When you return to the text after this activity, read the "drowning wife" passage again. Stop at "one thought too many." Ask: "Who can point to the moment in the game where you had that thought?" They will point to Round 4. That is when you know they understand.
