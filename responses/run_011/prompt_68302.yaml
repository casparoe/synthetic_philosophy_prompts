answer: |-
  Your hunch is not dumb. It's the right vector. Engineers respect constraints, logic gates, and system behavior. If you frame DDE as a "structural dependency analysis" rather than "moral philosophy," they will engage with it. The discomfort you want comes from realizing that two systems with identical `stdout` can have different `source code` moralities.

  Here is the runnable spec for the session.

  ### The Scenario: "The Overload Handler"
  **Context:** A critical API gateway is experiencing a 140% traffic surge due to a partner integration loop. Capacity is hard-capped. If load exceeds 100%, the entire cluster panics and 100% of traffic fails (Cascading Failure).
  **Goal:** Shed exactly 40% of traffic immediately to save the cluster.
  **Constraint:** There is a specific subset of users (Region X, legacy tier) who make up exactly 40% of the traffic. They are identifiable by header.

  ### Team Split & Constraints
  Split the room into two teams (5-7 people each). Give them separate whiteboard spaces or large sheets of paper.

  **Team A (The "Priority" Spec):**
  *   **Constraint:** Your spec *must* explicitly prioritize "Premium Tier" traffic.
  *   **Constraint:** Your logic *must* use the `User-Tier` header to make drop decisions.
  *   **Goal:** Guarantee 0% packet loss for Premium Tier if possible.

  **Team B (The "Stochastic" Spec):**
  *   **Constraint:** Your spec *must* be "Tier Agnostic." You cannot inspect `User-Tier` for drop decisions.
  *   **Constraint:** Your logic *must* be stateless (no tracking who was dropped previously).
  *   **Goal:** Stabilize the cluster at 100% capacity.

  **The Trap:**
  Because Region X (Legacy) makes up 40% of the traffic, **both teams will produce a system where Region X loses access 40% of the time.**
  *   Team A drops Region X *because* they are Region X (to save Premium).
  *   Team B drops random packets. Statistically, Region X takes 40% of the hits, but the system didn't "look" at them to decide.

  ### The Cards (Index Cards)
  Print or write these out. Hand one set to each team.

  **Card 1: The Spec**
  > Write the pseudocode or logic flow for your Handler.
  > Define the `IF/THEN` condition that triggers a `DROP`.
  > Be specific: What variable are you checking? What is the threshold?

  **Card 2: The Pre-Mortem (The Counterfactual Engine)**
  > *Do not discuss ethics yet.* Run this debug check on your spec:
  > 1. Identify the specific group that gets harmed (Region X).
  > 2. Imagine a world where your system runs, **but Region X suffers NO harm** (they all get through).
  > 3. Ask: **Does the system still achieve its Primary Goal (Saving the Cluster)?**
  >    *   If YES: The harm was a Side Effect.
  >    *   If NO: The harm was a Mechanism (Means).
  > 4. Write down which one you got.

  **Card 3: The Audit**
  > Swap specs with the other team.
  > Read their Spec (Card 1).
  > Run their Pre-Mortem (Card 2) on *their* logic.
  > Write down: Would you deploy this? Yes/No. Why?

  ### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup**
  *   No intro on ethics.
  *   "We are designing an overload handler. Cluster dies at >100%. We are at 140%. We must drop 40%. Here are your constraints."
  *   Assign teams and hand out Card 1.

  **00:05 – 00:20: Spec Writing**
  *   Teams write their logic.
  *   **Facilitator Role:** Circulate. If Team A tries to make it random, push them back to the constraint ("Must use User-Tier header"). If Team B tries to look at tiers, push them back ("Must be Tier Agnostic").
  *   Ensure they define the "Primary Goal" clearly (usually "Cluster Stability").

  **00:20 – 00:35: The Pre-Mortem (Inventing the Check)**
  *   Hand out Card 2.
  *   Tell them: "This is a standard reliability check. Verify the dependency."
  *   They will run the counterfactual.
  *   *Expected Result:* Team A realizes that if Region X *doesn't* get dropped, the Premium users get crowded out, and the cluster might crash. The harm is **load-bearing**. Team B realizes that if Region X doesn't get hit by the random drop, the cluster is *still* saved (because someone else would have been dropped instead). The harm is **incidental**.
  *   **Crucial:** Do not name this "Double Effect." Let them sit with the difference in dependency.

  **00:35 – 00:50: The Audit (The Conflict)**
  *   Hand out Card 3. Teams swap.
  *   They run the check on the *other* team's spec.
  *   Ask them to write "Deploy Yes/No."
  *   **The Kicker:** Bring everyone to the main whiteboard.
  *   Ask: "Team A, would you deploy Team B's spec?" (Usually Yes).
  *   Ask: "Team B, would you deploy Team A's spec?" (Often Hesitation/No).
  *   Ask: "The outcome for Region X is identical. 40% loss. Why the hesitation?"
  *   Let them argue. They will struggle to find a consequentialist reason. They will use words like "targeted," "fair," "mechanism," "intent."

  **00:50 – 01:05: The Debrief (Mapping the Doctrine)**
  *   Now you reveal the map. Draw two columns on the board: **Means** vs. **Side Effect**.
  *   **Team A (Means):** The harm is the *method* of saving the cluster. You are using Region X's failure as the resource that buys safety for Premium.
      *   *Philosophical Map:* This is the "Fat Man" trolley variant. You are using the person to stop the threat.
  *   **Team B (Side Effect):** The harm is a *consequence* of the method (random shedding). The method is "reduce volume." The fact that Region X got hit is foreseen, but not the lever you pulled.
      *   *Philosophical Map:* This is the "Switch" trolley variant. You are redirecting a threat; the death is a side effect of the redirect.
  *   **The Doctrine of Double Effect:** Explain that DDE says an action with a bad outcome is permissible *if* the bad outcome is not the means to the good end, even if foreseen.
  *   Point out: "You just argued that Team B is more deployable, despite identical KPIs. You are not consequentialists. You care about the architecture of the harm."

  **01:05 – 01:15: Limitations & Close**
  *   Address the structural limits (see below).
  *   Close on: "Code is intent. When you write the `IF` statement, you are choosing the moral structure, not just the outcome."

  ---

  ### Failure Mode: The "Clever Spec"
  **The Risk:** Team A writes: `IF load > 100% THEN drop_random()`. They ignore the "Must use User-Tier" constraint or interpret "Prioritize Premium" as "Retry Premium on failure" rather than "Drop Legacy first." They pass the Pre-Mortem easily and feel they solved the ethics problem by optimizing the spec.
  **Why it happens:** Engineers hate being forced into a moral corner; they prefer technical workarounds.
  **The Steer:**
  1.  **Hard Constraint:** In the first 5 minutes, explicitly state: "Team A, your SLA requires Premium Tier have 99.99% availability during surge. Random drop cannot guarantee this. You *must* filter on Tier."
  2.  **Reframe the "Win":** If they try to game it, say: "If you write a spec that hides the agency, you haven't solved the moral problem, you've just obfuscated the logs. The point of this exercise is to see where the dependency lies. If you make the harm invisible, you can't run the Pre-Mortem."
  3.  **The Landing:** If they still manage to make every branch pass the check, point out: "You have designed a system where the harm is invisible to the logic. That means when Region X complains, your system says 'It wasn't me, it was randomness.' That is a specific moral stance: **Plausible Deniability.** Is that a feature or a bug?" This turns their "cleverness" into the very ethical dilemma you wanted to highlight.

  ### Structural Limitations: Intention vs. Inspection
  **Your Suspicion:** You are correct. A spec makes intention public. In reality, intention is private, messy, and self-deceived. A spec makes DDE look decidable (the code either checks the variable or it doesn't). Real life is fuzzier.
  **The Real Limit:** The exercise makes DDE look like a **binary classifier** (Means vs. Side Effect). In reality, DDE is a **proportionality test**. Even if the harm is a side effect (Team B), is 40% dropout *too much* side effect? DDE doesn't answer that. It only clears the structural hurdle.
  **What to say in the last 5 minutes:**
  > "Today, the code made the intention inspectable. You could see the `IF` statement. In the real world, intention is internal. You can tell yourself you're Team B (Side Effects) while secretly hoping the traffic drops hit the people you wanted to drop anyway.
  >
  > The Doctrine of Double Effect doesn't tell you if the harm is *worth it*. It only tells you if you are *using* the harm.
  >
  > Team B still hurt Region X. They still lost access. DDE doesn't absolve Team B of the damage. It just changes the relationship between the engineer and the damage.
  >
  > **The takeaway:** When you write the condition that triggers the harm, ask yourself: 'If this harm didn't happen, would my feature still work?' If the answer is No, you aren't managing risk. You are spending people."

  ### Why This Works for Engineers
  1.  **It respects their ontology:** It treats morality as system architecture (dependencies, logic gates, failure modes).
  2.  **It bypasses "Vibes":** The Pre-Mortem is a logical test, not a feeling. "Does the system function without this variable?" is a debug question.
  3.  **It creates cognitive dissonance:** They will feel the difference between Team A and Team B before they have the vocabulary for it. That gap is where the learning lives.
  4.  **It scales:** You can run this with 10 people or 100 with the same whiteboard setup.

  ### One Final Tip
  When they are debating the Audit phase (00:35-00:50), if they get stuck on "But the outcome is the same!", do not explain DDE yet.
  Ask: **"If you were in Region X, and you saw the logs, which team's spec makes you angrier? Why?"**
  This personalizes the structural difference. The anger comes from being *used* (Team A) vs. being *unlucky* (Team B). That emotional data point is the anchor you need for the debrief.
