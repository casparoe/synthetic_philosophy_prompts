answer: |-
  ### 1. Mixed Strict Dominance and the Geometry of Belief

  You have correctly identified that $D$ is not strictly dominated by any pure strategy, but is strictly dominated by any mixture $\sigma_1 = pU + (1-p)M$ where $p \in (1/4, 3/4)$. The equivalence you are probing is the theorem stating: *A pure strategy is strictly dominated by some mixed strategy if and only if it is never a best response to any belief (probability distribution) over the opponent's strategies.*

  The direction "Strictly Dominated $\Rightarrow$ Never Best Response" is trivial algebra: if $\sigma_1$ yields higher payoff than $D$ against every column, it yields higher expected payoff against any weighted average of columns. The substantive direction is "Never Best Response $\Rightarrow$ Strictly Dominated." This direction is not algebraic; it is topological. It relies on the **Separating Hyperplane Theorem** (or equivalently, the Minimax Theorem).

  Geometrically, map each of Player 1's strategies to a vector of payoffs in $\mathbb{R}^3$ (one dimension for each of Player 2's columns). The set of payoff vectors achievable by mixed strategies is the **convex hull** of the pure strategy vectors. For $D$ to be a best response to some belief $\mu$, the hyperplane defined by $\mu$ (as normal vector) must support the convex hull at $D$. If $D$ is *never* a best response, the vector $D$ lies strictly outside the convex hull of $\{U, M\}$. The Separating Hyperplane Theorem guarantees there exists a hyperplane separating $D$ from that hull. The "mixed dominator" is simply a point within the hull of $\{U, M\}$ that lies on the "rational" side of that hyperplane.

  **Why this matters for beliefs:** This equivalence tells us that strict dominance by a mixture is the objective counterpart to subjective rationality. If a strategy is never a best response, it means there is *no coherent state of mind* (no belief $\mu$) under which playing that strategy maximizes expected utility. The mixed dominator represents a **robust hedge**. It is a strategy that performs better than $D$ regardless of what Player 2 does. From the point of view of Player 1's beliefs, the existence of a mixed dominator proves that $D$ is not merely suboptimal given specific information, but structurally incompatible with expected utility maximization. Eliminating $D$ via mixed dominance is therefore justified solely by the assumption that Player 1 is an expected utility maximizer, without requiring Player 1 to know Player 2's specific strategy.

  ### 2. Order Sensitivity and Inferences About Beliefs

  For Player 2, $C$ weakly dominates $L$ (payoffs $3,3,3$ vs $3,3,0$) and $R$ (payoffs $3,3,3$ vs $1,1,3$). The strict advantage of $C$ over $L$ occurs *only* in row $D$. The strict advantage of $C$ over $R$ occurs *only* in rows $U$ and $M$.

  This structure generates two distinct survivor sets depending on elimination order:

  1.  **Strict First:** Eliminate $D$ (strictly dominated for P1). In the reduced $2 \times 3$ game ($U, M$ vs $L, C, R$), $C$ and $L$ yield identical payoffs $(3,3)$ against $(U,M)$. $C$ no longer dominates $L$. However, $C$ (and $L$) strictly dominates $R$ ($3 > 1$). Eliminate $R$.
      *   **Survivors:** $\{U, M\} \times \{L, C\}$. Both Nash equilibria $(U, L)$ and $(M, C)$ survive.
  2.  **Weak First:** Eliminate $L$ (weakly dominated by $C$) and $R$ (weakly dominated by $C$) from the full game. Player 2 is left with only $C$. Player 1's unique best response to $C$ is $M$.
      *   **Survivor:** $\{M\} \times \{C\}$. Only $(M, C)$ survives. $(U, L)$ is eliminated.

  **The Source of Order Sensitivity:**
  Iterated **strict** dominance is order-independent because eliminating a strictly dominated strategy removes a strategy that is a best response to *no* belief. Removing it does not restrict the set of *reasonable* beliefs the opponent can hold about the remaining strategies. You are pruning "impossibilities."

  Iterated **weak** dominance is order-sensitive because eliminating a weakly dominated strategy removes a strategy that is a best response to *some* beliefs (specifically, degenerate beliefs assigning zero probability to the rows where the dominator is strictly better). When you eliminate $L$, you are effectively asserting that Player 2 assigns positive probability to row $D$. If you later eliminate $D$ (because it is strictly dominated for P1), you have created a contradiction: you eliminated $L$ based on the possibility of $D$, then declared $D$ impossible.

  In terms of belief inferences:
  *   Eliminating $D$ (Strict) entitles Player 2 to infer: "Player 1 is rational; Prob($D$) = 0."
  *   Eliminating $L$ (Weak) entitles Player 1 to infer: "Player 2 believes Prob($D$) > 0."
  *   These inferences are mutually inconsistent. Strict elimination preserves consistency with Common Knowledge of Rationality (CKR). Weak elimination forces a choice: do we prioritize the inference that $D$ is impossible, or the inference that $L$ is inadmissible?

  ### 3. The Tension with Common Knowledge of Rationality

  Eliminating $L$ requires Player 2 to assign positive probability to $D$. However, Point 1 established that $D$ is strictly dominated, meaning a rational Player 1 will never play it. Under Common Knowledge of Rationality (CKR), Player 2 knows Player 1 is rational, and Player 1 knows Player 2 knows, etc. Therefore, CKR implies Player 2 must assign probability 0 to $D$.

  **The Tension:** If Player 2 assigns probability 0 to $D$, the payoffs for $L$ and $C$ become identical ($3$ against $U$, $3$ against $M$). $L$ is no longer weakly dominated. Thus, the elimination of $L$ is **inconsistent** with the epistemic assumptions required to eliminate $D$.

  **Is the assumption illegitimate?** It is not illegitimate per se, but it changes the solution concept. Standard rationalizability (based on CKR and best response) would retain $L$ because $L$ is a best response to the belief "Player 1 plays $D$." To eliminate $L$, you must adopt a stronger assumption than CKR: you must assume that players do not play weakly dominated strategies *even when* doing so relies on assigning zero probability to opponent strategies that are themselves strictly dominated.

  **Weakest Assumption:** The weakest assumption licensing the elimination of $L$ is that Player 2's belief system has **full support** (every strategy of Player 1 is assigned positive probability). This is often motivated by the idea of "trembles" or mistakes.
  **Consistency:** This assumption is **inconsistent** with the reasoning in Point 1 if Point 1 is interpreted as "D is impossible." Point 1 says $D$ is never a best response. If we assume full support beliefs, we are effectively saying "Player 1 might make a mistake and play a strategy that is never a best response." This moves us from a model of perfect rationality to a model of rationality with perturbations.

  ### 4. Trembling-Hand Perfection and the Vindication of Order

  Both $(U, L)$ and $(M, C)$ are Nash Equilibria. Let us test them for Trembling-Hand Perfection (THP). THP requires the equilibrium to be the limit of best responses in a sequence of perturbed games where every strategy is played with at least probability $\epsilon_k \to 0$.

  **Testing $(U, L)$:**
  Consider a tremble by Player 1 where $D$ is played with small probability $\delta > 0$.
  Player 2's expected payoffs become:
  *   $E[L] = 3(1-\delta) + 0(\delta) = 3 - 3\delta$
  *   $E[C] = 3(1-\delta) + 3(\delta) = 3$
  *   $E[R] \approx 1$
  Since $\delta > 0$, $E[C] > E[L]$. Player 2 will strictly prefer $C$ over $L$ in any perturbed game. Thus, $L$ cannot be played in the limit.
  **Result:** $(U, L)$ is **not** Trembling-Hand Perfect.

  **Testing $(M, C)$:**
  Consider trembles by Player 1 ($U, D$ small) and Player 2 ($L, R$ small).
  *   Player 2: As shown above, any tremble on $D$ makes $C$ strictly better than $L$. Any tremble on $U, M$ makes $C$ strictly better than $R$ ($3 > 1$). $C$ is the unique best response.
  *   Player 1: If Player 2 plays $C$ (plus trembles on $L, R$), $M$ yields $\approx 4$, $U$ yields $\approx 0$, $D$ yields $\approx 1$. $M$ is the unique best response.
  **Result:** $(M, C)$ **is** Trembling-Hand Perfect.

  **Relation to Weak Dominance:**
  THP vindicates the elimination order from Point 2 that removed $L$ first (Order 2). The "tremble" formally supplies the positive probability on $D$ that was required to make $C$ strictly superior to $L$.
  Does this reproduce the difficulty? No, it resolves it. The difficulty in Point 3 arose from trying to combine CKR (which implies Prob($D$)=0) with Weak Dominance (which requires Prob($D$)>0 to eliminate $L$). THP modifies the epistemic foundation: it replaces "CKR" with "CKR + Vanishing Mistakes." By assuming mistakes are possible, Prob($D$) becomes $\epsilon > 0$, which breaks the tie between $L$ and $C$ in favor of $C$. The tremble does not reproduce the difficulty; it provides the specific belief restriction (full support) that makes the weak dominance elimination unique and consistent.

  ### Conclusion: Is Iterated Weak Dominance Well-Defined?

  This example demonstrates that **Iterated Weak Dominance (IWD) is not a well-defined solution concept on its own** because its output depends on the order of elimination, which corresponds to different epistemic assumptions about off-equilibrium beliefs.

  A theorist who wants to retain IWD as a predictive tool must supply one of the following to ensure uniqueness:
  1.  **An Ordering Convention:** Specify that strictly dominated strategies must be eliminated before weakly dominated ones. (This yields the larger set $\{U, M\} \times \{L, C\}$).
  2.  **A Restriction on Admissible Beliefs:** Specify that beliefs must have full support (lexicographic probability systems or trembles). This forces the elimination of $L$ and yields the unique outcome $(M, C)$.
  3.  **A Refinement:** Define the solution concept not as IWD, but as the set of **Trembling-Hand Perfect Equilibria** (or Proper Equilibria).

  The standard theoretical consensus leans toward option 3. IWD is best understood not as a standalone procedure, but as a computational algorithm for finding Perfect Equilibria *provided* one assumes the "Weak First" order motivated by trembles. Without the tremble justification, the elimination of $L$ is epistemically unstable because it relies on believing in a strategy ($D$) that rationality forbids. With the tremble justification, IWD becomes a robust method for filtering out equilibria supported by non-credible threats or weakly dominated actions.
