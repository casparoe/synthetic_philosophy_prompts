prompt: |-
  I run exhibits at a small county museum and i'm stuck on a wall text about why our mill town went from 14,000 people in 1970 to under 6,000 today.

  The old label, writen by the guy before me, is a story. It follows one family: he works the looms, she takes in sewing, the kids leave one at a time on the Greyhound, the plant shuts in '82, the house is a duplex now. Visitors read that one all the way through, and it's the thing they mention to me afterwards.

  We hired a consultant and her report says it has to come down. She says the label describes one family's experience and never explains anything, and she wants a panel in its place listing the causes — automation, the interstate bypassing us, the trade deals of the '90s, the pension buyouts — with a number attached to each. My board likes hers because it sounds checkable.

  Here's what I can't settle. She keeps saying the family story is an illustration, not an explanation. But when I read the story I feel like I get why the town emptied, more than I do from her bullet points. One of my volunteers offered a truce: the story shows what it was like, the list shows why. I'm not convinced those come apart here — the family in the story is the one where the plant shut, after all.

  So: is she right that a list of causes is the only thing that counts as explaining this? And whichever way that goes, which panel actually belongs on the wall?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** Small county museum, exhibit about population decline (14k in 1970 -> <6k today).
      *   **Current Label:** A narrative story about one family (looms, sewing, kids leaving on Greyhound, plant shuts '82, house becomes duplex). Visitors love it, remember it.
      *   **Consultant's Recommendation:** Replace with a panel listing causes (automation, interstate, trade deals, pension buyouts) with numbers. Board likes this because it's "checkable."
      *   **Consultant's Argument:** The story is an *illustration*, not an *explanation*. It describes experience, not causality.
      *   **User's Intuition:** The story *feels* more explanatory than the list. The volunteer suggests a truce (story = what it was like, list = why), but the user feels these aren't separable.
      *   **Core Questions:** Is the consultant right that only a list counts as explaining? Which panel belongs on the wall?

  2.  **Deconstruct the "Explanation" vs. "Illustration" Debate:**
      *   *Consultant's View (Positivist/Structural):* Explanation requires abstract variables, causality, and generalizable data. A single anecdote is $n=1$, prone to bias, and doesn't prove systemic trends.
      *   *User's View (Humanist/Phenomenological):* Explanation requires understanding *mechanism* and *motivation*. Why did people leave? Because there was no work. How do we know? Because the Jones family left when the plant closed. The story *embodies* the cause.
      *   *Visitor Psychology:* People remember stories, not stats. Stats validate, stories connect.
      *   *The "Why":* The story *does* explain the decline, just through a specific mechanism (micro-history) rather than a general one (macro-economics). The plant shutting *is* the cause. The family leaving *is* the effect.

  3.  **Evaluate the Consultant's Claim:**
      *   Is she right that *only* a list counts as explaining? **No.** That's a false dichotomy.
      *   Narrative *can* be explanatory. In history, "process tracing" often looks like a story.
      *   However, she has a point about *generalizability*. One family might have left for personal reasons unrelated to the mill. But if the story explicitly links the plant closing to the departure, it establishes causality.
      *   The consultant's list is "checkable" (verifiable), which appeals to the Board. But is it *understandable*?

  4.  **Evaluate the Museum's Mission:**
      *   Small county museum -> Likely focused on local heritage, community memory, emotional connection.
      *   Goal: Engagement + Education.
      *   Current label works (visitors mention it). New label might be dry.

  5.  **Synthesize a Solution:**
      *   **Direct Answer:** The consultant is theoretically narrow. Narrative *is* a form of historical explanation.
      *   **The "Truce":** The volunteer is close, but the user is right that they shouldn't be fully separated. The best solution is likely a hybrid.
      *   **Actionable Advice:** Keep the story (it works), but augment it with the context (the "checkable" stuff) to satisfy the Board and the Consultant without sacrificing engagement.

  6.  **Drafting the Response:**
      *   *Validation:* Acknowledge the user's instinct. It's a classic museum studies debate (New Museology vs. Traditional/Object-based).
      *   *Addressing the "Explanation" Question:* Challenge the consultant's definition. Explanation isn't just variables; it's understanding human action. The story explains the *human mechanism* of the decline.
      *   *Addressing the "Which Panel" Question:* Don't choose one. Combine them. The story hooks them; the context grounds them.
      *   *Specific Strategy:*
          1.  Keep the story as the anchor.
          2.  Add a sidebar or inset with the "Big Picture" data (satisfies Board/Consultant).
          3.  Explicitly link the two in the text (e.g., "The Miller family was one of 4,000...").
      *   *Managing Stakeholders:* How to talk to the Board/Consultant. Use evidence (visitor feedback).

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is the story actually accurate?* If the plant shut in '82, but the decline happened over decades, does one family capture the whole trend? The user says 1970-1970s/today. Plant shut '82. That's a big chunk.
      *   *Risk:* Anecdotal evidence can be misleading. Need to ensure the text doesn't imply *only* this happened.
      *   *Solution:* Use the story as the *entry point*, not the *whole argument*.
      *   *Philosophical angle:* Historians argue about structure vs. agency. The consultant wants Structure (economics). The user wants Agency (people). Good history needs both.

  8.  **Finalizing the Advice:**
      *   **Is she right?** No. Narrative is a valid historical explanation.
      *   **Which panel?** Neither alone. A hybrid.
      *   **Why?** Cognitive science (stories stick), Museum best practices (emotional connection), and Historical rigor (contextualizing the anecdote).
      *   **How to pitch it:** "Contextualized Narrative."

  9.  **Tone:** Empathetic, professional, authoritative but collaborative. Acknowledge the pressure from the Board.

  *(Self-Correction during drafting)*: Make sure I don't just bash the consultant. Her data points are necessary for rigor. The problem is *exclusivity*. The solution is integration.

  10. **Final Polish:** Check against the prompt's specific questions.
      *   Is she right that only a list explains? (Answer: No.)
      *   Which panel belongs on the wall? (Answer: A synthesis.)

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic tension in museum work, and you are right to trust your gut. The consultant is operating under a narrow definition of "explanation" that belongs in a sociology textbook, not necessarily on a museum wall.

  Here is the breakdown of why she is technically wrong about the definition of explanation, why your visitors are right about the story, and how you solve this politically with your Board.

  ### 1. Is she right that only a list counts as explaining?

  **No.** She is confusing *generalization* with *explanation*.

  In history and museology, there are two ways to explain a phenomenon:
  *   **Structural Explanation (The List):** This identifies the abstract forces (automation, trade deals). It answers "What systemic pressures existed?"
  *   **Mechanistic/Narrative Explanation (The Story):** This identifies the chain of events and human decisions that translated those pressures into reality. It answers "How did this actually happen?"

  A list of causes is inert. "Automation" is a concept. A loom sitting silent is a fact. A family packing a car because the loom is silent is an *explanation of population decline*.

  When a visitor reads your current label, they are performing a cognitive act of induction. They see the specific (the family leaves) and understand the general (the town emptied). They understand *causality* because the story links the event (plant shutdown) to the action (kids on the Greyhound).

  The consultant is arguing that $N=1$ (one family) isn't statistically significant. She is correct that one family doesn't prove a trend, but she is incorrect that a story cannot explain a trend. In fact, cognitive science tells us that humans process causal relationships through narrative, not bullet points. We understand *why* things happen by hearing about *who* did *what*.

  ### 2. Which panel belongs on the wall?

  **Neither alone.** You should not choose between them; you should integrate them.

  If you put up only the list, you will satisfy the Board but lose the visitors. You will have "truth" without "meaning."
  If you keep only the story, you satisfy the visitors but leave yourself open to the critique that this is just "sentimental nostalgia" without historical rigor.

  **The Solution: The Contextualized Narrative**

  You need a hybrid label. Keep the story as the anchor, because it is working, but frame it with the data the consultant wants.

  **How to structure it:**
  1.  **The Hook:** Start with the family. It draws people in.
  2.  **The Bridge:** Explicitly connect their experience to the macro data.
  3.  **The Context:** Provide the bullet points as the "background" for the story.

  **Example Drafting Approach:**
  > "In 1982, the Miller family packed their belongings onto a Greyhound bus. When the mill gates locked that October, they were one of 4,000 residents who would leave in the following decade.
  >
  > **Why did the town empty?**
  > The Millers left because the plant closed. The plant closed because of three converging forces:
  > *   **Automation:** New looms required 40% fewer workers.
  > *   **Interstate 95:** Bypassed our rail hub, raising shipping costs.
  > *   **Trade Policy:** The 1994 agreements moved textile jobs overseas.
  >
  > The Miller's house became a duplex, a pattern repeated across the North Side. Their story is the human face of these economic shifts."

  ### 3. How to sell this to your Board and Consultant

  You need to speak their language while protecting the visitor experience.

  **To the Board (Focus on Risk and Engagement):**
  *   "We have data that the current label is our most-read text. Removing it risks disengaging our audience. However, I agree we need to ensure historical rigor."
  *   "The proposed solution is a hybrid. We keep the narrative engine that drives engagement, but we add the 'checkable' data points the consultant requested as supporting context. This gives us the best of both: emotional connection and factual verifiability."

  **To the Consultant (Focus on Methodology):**
  *   "I agree that the story alone lacks generalizability. However, in public history, narrative *is* a method of explanation. To satisfy your requirement for structural analysis, I will annotate the narrative with the specific economic indicators you listed. This moves the label from 'anecdote' to 'case study.'"

  ### 4. Why the Volunteer's "Truce" isn't quite enough

  Your volunteer suggested: *Story = What it was like, List = Why.*

  This is a common compromise, but it reinforces the idea that "human experience" and "historical cause" are separate things. They aren't. The trade deals *are* why the kids took the Greyhound.

  If you separate them onto two different panels, visitors will read the story, feel moved, and then walk past the "boring economics" panel. By weaving the data *into* the story (or placing them in immediate proximity), you teach the visitor that **economics is not just numbers; it is what happens to families.**

  ### Summary Recommendation

  1.  **Do not take the story down.** It is doing the heavy lifting of your exhibit.
  2.  **Do not ignore the consultant.** Her data points are necessary for historical accuracy.
  3.  **Rewrite the label.** Use the family story as the primary text, but insert the "checkable" causes as the explicit reasons for the family's plight.
  4.  **Visualize the Data.** If the consultant wants numbers, give them numbers, but make them visual (a small line graph of the population drop next to the photo of the family).

  You are the curator. Your expertise is knowing how visitors interact with the space. The consultant knows theory; you know practice. A label that is factually rigorous but emotionally dead is a failure of a museum's mission. A label that is emotional but factually vague is a failure of history. Combine them.
