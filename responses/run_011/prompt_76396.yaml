answer: |-
  There is no single, canonical term in the philosophical lexicon that captures this exact structure. You have identified a composite phenomenon that sits at the intersection of the **sociology of finance**, the **philosophy of social science**, and **epistemic logic**.

  While the *mechanism* you describe is well-documented (under names like reflexivity or Goodhart's Law), the *rhetorical and epistemic maneuver*—using that mechanism to discharge the burden of proof—does not have a settled label. In the literature, it is often treated as a species of **unfalsifiability**, but as you correctly note, that classification is too coarse. It misses the crucial causal claim that *verification is destructive*.

  Given your background and the precision you require, I propose we term this phenomenon **Reflexive Immunity**.

  Below is an account of the term, its boundaries, how it differs from adjacent concepts, and the principled test you requested for separating valid instances from spurious ones.

  ### 1. Definition: Reflexive Immunity

  **Reflexive Immunity** is an epistemic status claimed for a proposition $P$ where:
  1.  **The Causal Claim:** The public verification of $P$ is asserted to be a sufficient condition for the falsity of $P$ (or the cessation of the phenomenon $P$ describes).
  2.  **The Epistemic Move:** This causal claim is advanced not merely as an explanation for the absence of evidence, but as a justification for exempting $P$ from the standard burden of proof.
  3.  **The Result:** $P$ is treated as credible *despite* the absence of evidence, precisely *because* evidence cannot exist without destroying the truth of $P$.

  This differs from simple secrecy. A trade secret is a legal or commercial status; Reflexive Immunity is an *epistemological* claim. It asserts that the truth of the matter is ontologically dependent on its remaining private.

  ### 2. Distinctions from Adjacent Concepts

  You asked how this differs from ordinary auxiliary hypotheses, metaphysical unfalsifiability, and physical measurement interference.

  **A. vs. Auxiliary Hypotheses (Lakatos/Popper)**
  *   **Structure:** An auxiliary hypothesis is added to a theory to explain away anomalous data (e.g., "The planet is there, but a cloud is hiding it"). It preserves the theory *against* existing evidence.
  *   **Difference:** Reflexive Immunity prevents evidence from *coming into existence*. It does not explain away a failed test; it argues that the test itself is a destructive intervention that invalidates the testing conditions. It is a pre-emptive immunizing stratagem rather than a reactive one.

  **B. vs. Metaphysical Unfalsifiability**
  *   **Structure:** A claim like "God exists" or "There is an invisible dragon in my garage" (Sagan) is unfalsifiable because no conceivable observation bears on it.
  *   **Difference:** Claims with Reflexive Immunity are *contingently* unfalsifiable. They assert that verification *is* possible in principle (the manager *could* show the code), but *normatively* or *causally* prohibited because the act of verification changes the state of the world. They claim to describe a natural or social regularity, not a metaphysical truth.

  **C. vs. Physical Measurement Interference (Heisenberg/Observer Effect)**
  *   **Structure:** In quantum mechanics, measuring position disturbs momentum. In medicine, the Hawthorne effect changes patient behavior under observation.
  *   **Difference:** Physical interference is **non-strategic** and **universal**. It does not depend on the *content* of the information becoming public, but on the physical act of measurement. Reflexive Immunity is **strategic** and **informational**. The destruction occurs because *agents act on the information*. If a physicist measures a particle, the particle does not "compete away" the regularity. If a trader reveals an alpha signal, other traders arbitrage it away. The mechanism is social agency, not physical disturbance.

  ### 3. The Principled Separation: Valid vs. Spurious Immunity

  You asked for a way to separate instances where the value-destroying mechanism is an independently established fact (like market efficiency) from instances where it is an ad hoc assertion (like the chemist's secret regularity).

  The separation turns on the **Public Verifiability of the Decay Mechanism.**

  For Reflexive Immunity to be epistemically respectable, the *mechanism of destruction* (the function $D$ where $D(\text{disclosure}) \rightarrow \neg P$) must be independently testable and established, even if $P$ itself is not.

  *   **Valid Case (Markets):** The mechanism is **Arbitrage/Competition**. We have independent, robust evidence (Efficient Market Hypothesis, Grossman-Stiglitz paradox) that public information in liquid markets is rapidly incorporated into price. We do not need to see the specific signal to know that *if* it were public, *then* it would cease to yield alpha. The decay mechanism is a public law of the system.
  *   **Invalid Case (The Chemist):** The mechanism is **Observation**. There is no independent law in physical chemistry stating that publishing a kinetic rate law alters the reaction rate. The claimant is asserting a private law of nature to protect a public claim.
  *   **Borderline Case (Medicine):** The mechanism is **Behavioral Change**. It is plausible that publishing a diagnostic heuristic changes clinician behavior (Hawthorne effect / Lucas Critique). However, this requires evidence that the *specific* intuition relies on exclusivity. If the intuition is based on physiology, publication shouldn't ruin it. If it relies on being the only one who treats the patient a certain way, it might. The burden shifts to proving the behavioral decay mechanism.

  **The Test:** Ask the claimant to demonstrate the decay mechanism *without* revealing the secret.
  *   *Manager:* "Show me that similar signals decay when published." (Possible via historical case studies of factor investing).
  *   *Chemist:* "Show me a reaction that stops working when published." (Impossible).
  *   *Clinician:* "Show me that trials of similar heuristics fail due to behavioral contamination." (Difficult, but possible).

  If the decay mechanism cannot be evidenced independently of the secret itself, the Reflexive Immunity is spurious. It is an **Ad Hoc Decay Assumption**.

  ### 4. Borderline Cases and "Ponzi Epistemology"

  You mentioned the claimant who volunteers documentation *after* value extraction. This introduces a temporal dimension to Reflexive Immunity.

  *   **Post-Hoc Verification:** If a manager says, "I will show you the signal after one year of returns," they are attempting to convert Reflexive Immunity into **Delayed Falsification**.
  *   **The Problem:** This creates a **Ponzi Epistemology**. The claimant collects capital (or credit) based on an untestable claim during the interval. If they succeed, they claim skill; if they fail, they can claim the market "adapted" mid-stream (re-invoking Reflexive Immunity).
  *   **Resolution:** For the claim to be valid, the *terms of verification* must be fixed *ex-ante* by a neutral third party (an escrowed code review, a pre-registered trial). If the claimant controls the timing of the revelation, the Reflexive Immunity defense remains active until the moment of revelation, allowing them to evade falsification during the period of highest reputational gain.

  ### 5. Summary and Proposed Terminology

  While you will find pieces of this in **Reflexivity Theory** (Soros), **Goodhart's Law**, and the **Lucas Critique**, none of these capture the specific *epistemic immunity* you have isolated.

  I recommend adopting the term **Reflexive Immunity**.

  *   **Real Definition:** A claim is protected by Reflexive Immunity when the claimant asserts that the causal mechanism which makes the claim true is negated by the public verification of the claim, and uses this assertion to exempt the claim from standard evidentiary burdens.
  *   **Validity Condition:** Reflexive Immunity is only epistemically permissible if the *decay mechanism* (the link between disclosure and falsity) is independently established and publicly verifiable.
  *   **Fallacy:** When the decay mechanism is asserted without independent evidence, the move constitutes the **Fallacy of Ad Hoc Decay**.

  This structure allows you to grant credit to the investment manager (where the decay mechanism is market competition, a known law) while dismissing the chemist (where the decay mechanism is magical thinking), without conflating the two under a blanket label of "unfalsifiable." It preserves the nuance that in social systems, truth can indeed be fragile, but that fragility must itself be proven.
