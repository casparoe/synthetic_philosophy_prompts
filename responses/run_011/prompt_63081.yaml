      *   *Wait, re-reading the prompt's description of Objection B:* "perfectly possible... for everyone to prefer option 2 in advance and yet for option 1 to be what we should want in each of the ways things could turn out."
      *   *Analysis:* This is the "Ex-ante vs. Ex-post" conflict. If the social welfare function is concave (risk-averse regarding distribution), then even if individuals are risk-neutral ex-ante, the society might prefer the certain distribution ex-post.
      *   *Actually, the classic example:* Option 1: Everyone gets 50. Option 2: 50% chance everyone gets 100, 50% chance everyone gets 0. (This is common risk).
