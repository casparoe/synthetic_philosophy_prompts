          *   Ex-post: If Town A wins, A prefers Option 2. B and C prefer Option 1 (they got 0 vs 50).
          *   So in the actual outcome (say A wins), 2/3 of the towns prefer Option 1.
          *   The philosopher argues that if we care about the actual welfare of the people, the fact that 2/3 are worse off in reality might outweigh the ex-ante agreement.
      *   *Answer:* She is right that they come apart. Ex-ante focuses on opportunity/risk; Ex-post focuses on actual outcome/equality.

