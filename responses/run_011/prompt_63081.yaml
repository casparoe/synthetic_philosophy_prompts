      *   **Objection A (Accountant):** Interpersonal comparison of utility is impossible ("can't add people up"). The veil is a trick.
      *   **Objection B (Philosopher):** Ex-ante vs. Ex-post distinction. Everyone might prefer Option 2 ex-ante (behind the veil), but Option 1 might be better ex-post (in every possible outcome).
      *   **Constraints:** Direct answers, no reading list, no names/history of arguments, British English, ready for minutes/document.
      *   **Questions:**
          1.  Does the "veil of ignorance" step do real work compared to just summing expected benefits?
