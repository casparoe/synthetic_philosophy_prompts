prompt: |-
  I sit on the capital committee for a small coastal town, about 11,000 people, and I'm the one who keeps dragging long-run stuff onto the agenda, so this has been bugging me for a while. I want to work out what we should vote on next month, and more than that I want to know whether our last six years of votes add up to a position at all. Here they are, roughly in order:

  - **Roofs.** We paid around 40% extra to put 40-year roofs on all three schools instead of 20-year ones. Unanimous, no real argument, nobody said the word "discount."
  - **Power lines.** The engineers' own numbers said burying the lines pays for itself in avoided outage costs over something like 55 years. We voted it down 4-1. The reason said out loud was that they weren't going to make people pay now for something their grandkids recieve.
  - **Seawall.** After the hurricane we approved $6 million for a seawall in about eleven minutes. It's rated for a hundred years of service, so it's a long-horizon project too, but it protects buildings that are standing now and voters who are standing now.
  - **Trees.** We approved planting 400 street trees, which was cheap, and we've let maybe half of them die. When I raised it, the answer was that maintenance isn't a capital item.
  - **Landfill closure.** We're legally required to close the old landfill in about 25 years. We put in exactly the required amount each year and no more, even though we're paying more interest on the bonds we issued than the closure fund earns, which as far as I can tell means front-loading it would definately cost us less in total. Nobody seemed to think that was worth discussing.
  - **The waste facility.** A company offered us $300k a year for 30 years to put a lined industrial waste site on the edge of town. Their consultants said the chance of contamination reaching the aquifer was small but not zero, and that if it happened it'd happen 60 to 90 years out. We said no. What stuck with me afterwards: not one person argued that aquifer damage counts for less because it's far away. They argued it might happen and it would be very bad, full stop.

  Now next month's item. A combined grant-and-town-money package to rebuild the stormwater system so it handles the rain we now get about once a decade, but sized for the conditions the models project for 2080. $4.2 million from us now. It prevents maybe $9 million in damage, and basically all of that lands after 2070 — on streets that haven't been built yet and people who are mostly not born yet. The committee is split in a way I find confusing, because both sides sound like they've actually thought about it. One member says our grandkids will be far richer than we are, so poorer people shouldn't be subsidizing richer people, and that means we shouldn't do it. Another says that's backwards: if the climate goes badly they'll be poorer than us and will need it more, plus we're the ones who made the problem, and anyway we can't know which way it goes so you should weight the bad scenario heavier.

  What I want from you:

  1. Which of the six old votes is the closest analog to this one, and what actually separates it from the others? I assumed it was the seawall, but the power lines keep feeling closer and I can't articulate why.
  2. Write out the candidate rules our record is consistent with. I'm pretty sure there's more than one, and I suspect at least one of them implies the aquifer vote was right and the tree vote was wrong for reasons nobody in the room gave. If any of the six are flat-out inconsistent with each other, say which, and which one I should stop defending.
  3. Tell me what to vote, and what we'd be committing ourselves to either way, in language I could use at a meeting without sounding like a textbook. If the choice turns on something we could go find out — how much richer or poorer the town is likely to be, how to handle not knowing — say what.
  4. If there are proper names for these rules, give me the names with one plain sentence each, but I care more about the rules than the labels.
  5. What should I put on a future agenda to find out which rule we're really running? Some proposal where the rules we might be using would split apart and we'd finally see which one we've been applying all along.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Capital Committee member for a small coastal town (pop. ~11,000).
      *   **User Persona:** The "long-run" advocate. Pragmatic, analytical, slightly frustrated by inconsistency, wants to understand the town's implicit decision-making framework.
      *   **Task:** Analyze six past votes to determine the town's implicit "rules," identify the closest analog to a new proposal (stormwater system), recommend a vote, provide terminology (briefly), and suggest a future agenda item to test the town's true principles.
      *   **Tone:** Professional, insightful, respectful of the political reality, not overly academic but intellectually rigorous.

  2.  **Analyze the Six Past Votes:**
      *   **1. Roofs (Schools):** Paid 40% extra for 40-year vs. 20-year. *Unanimous.* Long-term benefit, immediate cost. No "discount" talk.
      *   **2. Power Lines:** Burying lines. 55-year payback. *Voted Down (4-1).* Reason: Don't make current people pay for grandkids' benefit. (Intergenerational equity argument *against* spending).
      *   **3. Seawall:** $6M after hurricane. 100-year service. *Approved quickly.* Protects *current* assets/voters. Long life, but immediate benefit.
      *   **4. Trees:** 400 street trees. Cheap. *Approved, but neglected.* Reason for neglect: Maintenance isn't capital. (Distinction between CapEx and OpEx).
      *   **5. Landfill Closure:** Legally required in 25 years. Funding exactly minimum. *Status Quo.* Financial inefficiency (interest cost > earnings), but ignored. (Compliance over optimization).
      *   **6. Waste Facility:** $300k/yr for 30 yrs. Risk of contamination in 60-90 years. *Voted Down.* Reason: Risk is unacceptable regardless of timing. (Precautionary principle/Existential risk).

  3.  **Analyze the New Proposal (Stormwater):**
      *   **Cost:** $4.2M now.
      *   **Benefit:** Prevents $9M damage.
      *   **Timing:** Benefit lands mostly after 2070 (50+ years out).
      *   **Beneficiaries:** Future streets, future people.
      *   **Debate:**
          *   *Against:* Future gens will be richer (intergenerational equity).
          *   *For:* Future gens might be poorer/climate victims + we caused the problem (liability/precaution).

  4.  **Drafting Response - Section by Section:**

      *   **1. The Closest Analog:**
          *   *Initial thought:* Seawall? Both are infrastructure. *Correction:* Seawall protects *current* assets. Stormwater protects *future* assets.
          *   *Second thought:* Power Lines? Both are buried infrastructure with long paybacks. *Correction:* Power lines were about reliability/convenience vs. cost. Stormwater is about disaster avoidance.
          *   *Third thought:* Waste Facility? Both involve long-term environmental risk (flooding vs. contamination). *Correction:* Waste was about *creating* risk. Stormwater is about *mitigating* risk.
          *   *Winner:* **Power Lines.** Why? Both are "invisible" infrastructure upgrades where the primary financial benefit accrues far in the future, and the explicit rejection reason for power lines ("don't pay for grandkids") matches the argument against the stormwater project. The Seawall feels close because it's coastal protection, but the *beneficiary timing* makes Power Lines the true analog.
          *   *Differentiation:* The Seawall was reactive (after hurricane) and protected existing tax base. Power Lines/Stormwater are proactive/preventative for future states.

      *   **2. Candidate Rules (The Town's Implicit Philosophy):**
          *   *Rule A (The "Current Taxbase" Rule):* Spend heavily to protect what exists *now* (Seawall, Roofs on existing schools). Don't spend to improve things for people who don't live here yet (Power Lines, Stormwater).
          *   *Rule B (The "Catastrophe Avoidance" Rule):* Spend to prevent existential or high-severity risk (Waste Facility rejection, Seawall). Don't spend on maintenance or optimization (Trees, Landfill funding).
          *   *Rule C (The "CapEx vs. OpEx" Wall):* We fund building things, not keeping them alive (Trees dying).
          *   *Inconsistency:* **Roofs vs. Power Lines.** Roofs were a 40% premium for longevity (future benefit). Power Lines were rejected for future benefit. *Resolution:* Roofs protect *current* kids in *current* schools (immediate operational stability). Power lines protect future reliability.
          *   *Inconsistency:* **Landfill vs. Roofs.** Roofs paid extra for efficiency/longevity. Landfill refused to optimize funding despite math. *Resolution:* Landfill is "regulatory compliance minimum," Roofs are "asset management."
          *   *The Tree Vote:* Implicitly says "Capital is for new things, Operations is someone else's problem." This implies the Tree vote was "right" by CapEx rules but "wrong" by asset lifecycle rules.
          *   *Which to stop defending:* The Landfill funding strategy. It's mathematically wasteful and violates the "efficiency" shown in the Roofs vote.

      *   **3. Recommendation & Script:**
          *   *Decision:* The town's record suggests they *should* vote **NO** based on the Power Lines precedent (intergenerational equity). *However*, the Waste Facility vote suggests they care about long-term environmental risk.
          *   *Nuance:* The Stormwater project is about *avoiding damage* (like Seawall) but for *future assets* (like Power Lines).
          *   *My Advice:* Vote **YES**, but frame it as "Liability/Continuity" rather than "Gift to Grandkids."
          *   *Why?* The Waste Facility vote shows the town accepts long-term horizons when *risk* is involved. Flooding is a risk. Also, if the streets won't be built yet, who owns the liability? If the town builds the streets later, the cost is higher then.
          *   *Script:* Focus on "locking in costs now vs. emergency repair later" and "we are building the skeleton for the next 50 years." Avoid "saving the planet." Focus on "not bankrupting the 2070 budget."
          *   *Commitment:* Voting Yes commits to the idea that the town is a continuous entity, not a series of 4-year snapshots. Voting No commits to "kick the can," accepting higher future costs.
          *   *Unknowns:* Need to know if the $9M damage is to *public* or *private* property. If private, the town might not be liable. If public (roads), it is.

      *   **4. Proper Names:**
          *   *Intergenerational Equity:* Don't burden the present for the future (or vice versa).
          *   *Hyperbolic Discounting:* Valuing now much more than later.
          *   *Precautionary Principle:* Avoid risk even if probability is low/uncertain.
          *   *Sunk Cost/Status Quo Bias:* Stick to minimum legal requirements (Landfill).
          *   *CapEx/OpEx Siloing:* Building vs. Maintaining.

      *   **5. Future Agenda Item (The Test):**
          *   Need a proposal that splits the "Current Taxbase" rule from the "Risk Avoidance" rule.
          *   *Idea:* A reserve fund for a known future liability that *isn't* legally required yet.
          *   *Better Idea:* **Pension/Retiree Health OPEB funding.** Or a **Bridge Repair** that isn't failing yet but will in 20 years.
          *   *Best Idea:* **A "Sinking Fund" for the Seawall.** The Seawall lasts 100 years. It will need repair in year 40. Do we fund that now?
          *   *Alternative:* **Energy Efficiency Retrofit for Town Hall.** Pay now, save later. Pure ROI.
          *   *Selection:* **Town Hall Efficiency Retrofit.** It isolates the "financial efficiency" variable from the "safety/risk" variable. If they say no to ROI, they are purely hyperbolic discounters. If they say yes, they care about total cost of ownership.

  5.  **Refining and Polishing:**
      *   *Tone Check:* Ensure I'm not sounding condescending. The user is smart. Use their language ("dragging long-run stuff onto the agenda").
      *   *Clarity:* Make sure the distinction between Seawall (Current Asset Protection) and Stormwater (Future Asset Protection) is sharp.
      *   *The "Roofs" Anomaly:* I need to explain why Roofs passed and Power Lines failed. Roofs = Immediate users (kids in school now). Power Lines = Future reliability.
      *   *The "Trees" Insight:* The user suspects the Tree vote was wrong for reasons nobody gave. The reason is "Lifecycle Costing." If you plant trees (CapEx) but don't water them (OpEx), the CapEx is wasted. This violates the efficiency seen in the Roofs vote.
      *   *Recommendation:* I need to be careful not to tell them *how* to vote politically, but what the *consistency* argument is. Actually, the prompt asks "Tell me what to vote." I should take a stand based on the analysis. Given the Waste Facility vote (precaution against long-term environmental risk), a Yes vote is more consistent with the town's risk aversion than the Power Lines vote (which was about convenience/reliability). Wait, the Power Lines vote was about *cost* vs. *future benefit*. Stormwater is *cost* vs. *future risk*. The Waste Facility is the better analog for *risk*.
      *   *Re-evaluating the Vote:* The Power Lines argument ("grandkids will be richer") is the exact argument being used against the Stormwater. If the town follows the Power Lines precedent, they vote No. If they follow the Waste Facility precedent (avoid long-term environmental harm), they vote Yes. Which is stronger? The Waste Facility vote was unanimous (implied "We said no"). Power Lines was 4-1. The Waste Facility precedent is stronger.
      *   *Wait, one more check:* The Stormwater benefit is "$9M in damage." Is that public or private? If private, why is the town spending $4.2M? If public (roads), then it's asset protection. The prompt says "on streets that haven't been built yet." This implies public infrastructure.
      *   *Decision:* I will recommend voting **YES**, but framing it through the **Waste Facility/Seawall** lens (Risk Management) rather than the **Power Lines** lens (Investment ROI). The Power Lines logic is the trap.

  6.  **Final Review against constraints:**
      *   1. Analog? (Power Lines vs Seawall).
      *   2. Rules? (Current Asset Protection, Risk Aversion, CapEx/OpEx split).
      *   3. Vote & Script? (Yes, framed as risk/cost-locking).
      *   4. Names? (Intergenerational Equity, etc.).
      *   5. Future Agenda? (Test financial efficiency vs. risk).

      *Self-Correction on Analog:* I initially thought Power Lines. But the Seawall is physically similar (coastal protection). The *logic* is Power Lines. I need to explain that distinction clearly. The Seawall protected *existing* houses. Stormwater protects *future* streets. So Power Lines is the logical analog, Seawall is the physical analog. I will argue Power Lines is the *decision* analog.

      *Self-Correction on Rules:* The "Trees" vote inconsistency is key. The town spends on longevity (Roofs) but not maintenance (Trees). This implies they value *durability of new assets* but not *sustenance of living assets*. It's a "Build it and forget it" rule.

      *Self-Correction on Vote:* If I recommend Yes, I need to address the "Grandkids will be richer" argument. The counter is the Waste Facility logic: Some risks (aquifer/flooding) are non-linear and catastrophic, regardless of wealth.

      *Let's write.*
answer: |-
  This is a remarkably clear record for a municipal body. Most committees hide their inconsistencies in minutes full of jargon; yours are written in stone (and dead trees). You are dealing with a committee that is intuitively sophisticated about risk but inconsistent about time.

  Here is the breakdown of your town's decision-making architecture, and how to handle the stormwater vote.

  ### 1. The Closest Analog
  The closest analog is the **Power Lines**, not the Seawall.

  **Why it feels like the Seawall:** Both are coastal hardening infrastructure. Both deal with water. Both have long lifespans (100 years vs. 50+ years).
  **Why it is actually the Power Lines:** The decision logic hinges on *who benefits*.
  *   **The Seawall** protected buildings and voters standing *now*. The 100-year lifespan was a bonus, but the immediate risk reduction drove the vote.
  *   **The Power Lines** were rejected explicitly because the benefits (avoided outages) accrued mostly to future ratepayers, while the costs were immediate.
  *   **The Stormwater Project** is identical to the Power Lines: You are paying now to prevent damage to streets and people that largely do not exist yet.

  **The Separator:** The separating variable is **Existing Asset Protection vs. Future Capacity.**
  *   If the money protects the *current* tax base (Seawall, School Roofs), you spend.
  *   If the money builds capacity for a *future* tax base (Power Lines, Stormwater), you hesitate.

  ### 2. Candidate Rules & Inconsistencies
  Your committee is operating on three implicit rules. Two are consistent; one is a blind spot that is costing you money.

  **Rule A: The "Current Taxbase" Shield**
  *   *Definition:* We will spend premium dollars to protect assets currently on the tax roll from immediate or certain threats.
  *   *Consistent Votes:* Seawall (protects current homes), Roofs (protects current schools).
  *   *Inconsistent Vote:* Power Lines (rejected because it protected future reliability).

  **Rule B: The "Catastrophe" Threshold**
  *   *Definition:* We will reject projects that carry a low-probability, high-severity environmental risk, regardless of the time horizon.
  *   *Consistent Votes:* Waste Facility (rejected aquifer risk 60 years out).
  *   *Implication:* This rule implies the **Tree Vote was wrong.** You approved the trees (CapEx) but denied the water/maintenance (OpEx), guaranteeing the asset would die. This violates the "Roofs" logic where you paid extra for longevity. If you value the asset, you must fund its survival. By letting them die, you wasted the initial capital. This is a "CapEx/OpEx Silo" error.

  **Rule C: The "Compliance Minimum" (The Landfill Rule)**
  *   *Definition:* If a cost is regulatory and distant, we pay the legal minimum, even if it is financially inefficient.
  *   *Inconsistent Vote:* **This is the one you should stop defending.** The Landfill vote contradicts the Roofs vote. On the roofs, you paid *more* now to save money later (efficiency). On the landfill, you are paying *more* later (via interest) to save money now.
  *   *Why:* The Roofs were visible/educational; the Landfill financing is invisible math.

  **The Flat-Out Inconsistency:**
  **Roofs vs. Power Lines.**
  *   **Roofs:** Paid 40% premium for longevity.
  *   **Power Lines:** Rejected investment because payback was too long.
  *   *Resolution:* The Roofs benefited *current children* in *current buildings*. The Power Lines benefited *future residents*. Your town cares about intergenerational equity only when the "current generation" includes the beneficiaries.

  ### 3. The Vote & The Script
  **Recommendation: Vote YES.**

  **Why:** While the *Power Lines* precedent suggests a "No," the *Waste Facility* precedent is stronger. In the Waste Facility vote, your committee decided that **long-term environmental risk trumps short-term financial convenience.** Flooding is an environmental risk. If you vote No, you are arguing that flooding is a financial calculation (like power lines) rather than a hazard (like the aquifer). Given the coastal context, consistency demands you treat flooding as a hazard.

  Furthermore, the "Grandkids will be richer" argument is a gamble. The "Grandkids will be poorer because the climate broke" argument is a hedge. Your town hedges on risk (Waste Facility), it doesn't gamble.

  **The Commitment:**
  *   **If you vote Yes:** You commit to the idea that the town is a continuous entity. You are locking in today's construction costs to avoid emergency pricing in 2070. You are admitting that "future streets" are already the town's liability.
  *   **If you vote No:** You commit to "Generational Accounting." You are stating that each generation must pay for its own infrastructure. This inevitably means higher costs later (inflation, emergency repair premiums) borne by a generation you have decided should be richer.

  **The Script (for the meeting):**
  > "I've looked at how we've handled the Power Lines versus the Waste Facility. With the Power Lines, we said we wouldn't pay for future convenience. But with the Waste Site, we said we *would* pay to avoid future environmental risk, even if it was 60 years out.
  >
  > This stormwater project isn't about convenience; it's about risk. If we undersize this now, we aren't just saving money; we're transferring a known hazard to the future. The Waste Facility vote showed us that we don't gamble with long-term environmental damage, even if the odds are uncertain.
  >
  > Regarding the argument that our grandkids will be richer: That's a prediction, not a plan. If we're wrong, and they are poorer *and* dealing with flooded streets, we've handed them a bill they can't pay. I move we approve this as risk mitigation, consistent with our vote on the waste facility, not as an investment, consistent with the power lines."

  **What to find out:**
  Ask the engineer: *"Of the $9 million in prevented damage, how much is public infrastructure (roads, culverts) versus private property?"*
  *   If it's mostly **private**: You have a weak case. Why spend public money to protect private basements in 2080?
  *   If it's mostly **public**: You have a strong case. You are protecting the town's future balance sheet.

  ### 4. Proper Names
  *   **Intergenerational Equity:** The principle (used in the Power Lines vote) that one generation should not consume resources or leave debts for another.
  *   **Hyperbolic Discounting:** The cognitive bias (evident in the Trees/Landfill votes) where people strongly prefer smaller, immediate payoffs over larger, later payoffs.
  *   **The Precautionary Principle:** The rule (used in the Waste Facility vote) that if an action has a suspected risk of causing harm to the public or environment, the burden of proof that it is *not* harmful falls on those taking the action.
  *   **Lifecycle Costing:** The method (used in Roofs, ignored in Trees) of assessing total cost of ownership, including maintenance and disposal, rather than just initial purchase price.

  ### 5. The Future Agenda Item (The Test)
  To find out which rule is actually running the show, you need a proposal that separates **Financial Efficiency** from **Risk Avoidance**.

  **Proposal:** **A "Sinking Fund" for the Seawall.**
  The Seawall was approved for 100 years of service. It will inevitably need major repair in year 40 or 50.
  *   *The Item:* Propose setting aside a small annual amount *now* into a dedicated fund to pay for the Year-50 Seawall repair, rather than bonding for it when it breaks.
  *   *The Split:*
      *   If they vote **Yes**: They follow **Lifecycle Costing** (like the Roofs). They care about total cost over time.
      *   If they vote **No**: They follow **Hyperbolic Discounting** (like the Landfill). They only care about the current budget year.
      *   *Crucially:* This removes the "Risk" variable (the Seawall already exists) and the "Future Benefit" variable (the repair is mandatory). It isolates pure financial patience.

  If they vote No on the Seawall Sinking Fund, you have your answer: The town is not "long-term." The town is "short-term with occasional panic spending." If that's the case, stop dragging long-run items onto the agenda unless there is an immediate threat, and focus on making the short-term votes as efficient as possible.
