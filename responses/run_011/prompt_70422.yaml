      *   *The "Bad Life" Question:* A life of constant low reward is bad *consequentially* (low sum), even if the *derivative* is zero. The calculus sums $R_t$, not $\delta_t$. So the calculus has the resources to say it's bad. The *learning machinery* might ignore it, but the *objective function* condemns it.

