  # HOLINESS™ Service – Release Notes v2.0.0
  **Vendor:** Theology Shop Inc.  
  **Codename:** The Piety Service  
  **Deployment Cycle:** Continuous (Approx. 2400 Years)

  ## BREAKING CHANGES
  *   **Architecture Shift:** Certification logic migrated from `action_based` (v1) to `agent_based` (v2). Inputs now validate against the Account Owner's nature rather than discrete command payloads.
  *   **Endpoint Deprecation:** `POST /api/v1/sacrifice` is deprecated. Customers still hitting this endpoint will receive `403 FORBIDDEN` unless authenticated via Legacy Covenant tokens.

  ## KNOWN ISSUES

  **Ticket #CORE-001: Causal Dependency Loop**
  *   **Summary:** Ambiguity in validation logic direction.
  *   **Repro:** Submit action `X`. Check if `HOLY` return value derives from intrinsic property of `X` or Owner approval flag.
  *   **Failure Modes:**
      *   *Downstream:* If `X` is holy independent of Owner, service is redundant wrapper. No SLA guarantee on external standard.
      *   *Upstream:* If `X` is holy solely because Owner approves, service accepts arbitrary input (including `WORST_CASE_SCENARIO`). No error handling for moral edge cases.
  *   **Status:** Open since inception.

  **Ticket #TENANT-045: Multi-tenant Consensus Failure**
  *   **Summary:** Conflicting return values across tenant configurations (Polytheistic Mode).
  *   **Repro:** Run `validate(action)` in Region A (Zeus Config) vs. Region B (Cronus Config).
  *   **Workaround:** Enforced unanimous agreement across all tenants before returning `HOLY`.
  *   **Status:** Workaround implemented v1.1. Note: Consensus condition has never evaluated true in production. Support has ceased testing this path.

  **Ticket #REQ-399: Schema Definition Request**
  *   **Summary:** Enterprise customer demands single underlying standard (Form) to validate examples against, rather than receiving example instances.
  *   **Comment (Contractor_Std):** "You keep sending me instances of piety. I need the schema. How do I validate new cases without the root definition?"
  *   **Support Reply:** "The instances are the documentation. Defining the root schema would introduce a dependency outside the Owner's control. Please review existing examples."
  *   **Status:** Won't Fix. Reopened 14 times over 24 centuries.

  **Ticket #V2-REGRESS-01: Arbitrariness Relocation**
  *   **Summary:** v2.0 `agent_based` check intended to resolve CORE-001 Upstream vulnerability.
  *   **Observation:** Logic now checks if Action matches Owner Character.
  *   **New Defect:** Unclear if Owner Character is good inherently, or good because Owner possesses it. Arbitrariness bug appears relocated to root level rather than resolved.
  *   **Status:** Under Review.

  ## DEPRECATIONS
  *   **Legacy Commands API:** Users relying on discrete rule-sets (Mosaic/Levitical builds) must migrate to Grace-based authentication. Backwards compatibility layer scheduled for removal in v3.0 (End Times).

  ## FAQ

  **Q: Is the Causal Dependency Loop a bug or a feature?**  
  **A:** It is a feature of Sovereign Configuration. Allowing an external standard to validate the Owner would violate root access privileges. The Owner defines the build environment.

  **Q: Why should we pay for certification if the check just mirrors an independent standard?**  
  **A:** You are paying for the authentication layer, not the standard itself. Without the service, you have no way to verify your connection to the Owner. The redundancy is the security model.

  **Q: The v2.0 rewrite says the Owner would never issue a command certifying the worst thing you can name. Doesn't that concede the whole point?**  
  **A:** It concedes nothing. It asserts that the Owner's nature is the constant. The question assumes a standard outside the Owner to judge Him by. There is no outside. The architecture is closed-loop. If you require an external validator, you are attempting to run the software on unsupported hardware.

  **Q: When will Ticket #REQ-399 be resolved?**  
  **A:** When the customer upgrades to the Beatific Vision client side.
