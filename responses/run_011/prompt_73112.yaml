      *   **Constraint 1 (Style):** British English. No reading lists/bibliographies/named defenders/critics. Reason from first principles. Be blunt and honest. Do not explain the user's terms back to them.
      *   **Constraint 2 (Structure):** Five specific parts (Term Sheet, Clause-by-clause translation, Residue Report, Reverse Residue, Verdict).
      *   **Constraint 3 (Content):** Fill gaps in the proposal explicitly (leave blank, say so). Do not fill gaps with standard practice and pretend it's the proposal. Address specific questions about price as expectation vs. equilibrium and unadopted policies.
      *   **Constraint 4 (Length):** Roughly 1,500 to 2,000 words.

  2.  **Deconstruct Futarchy (as described by user):**
      *   Mechanism: Elected reps choose a wellbeing metric. Prediction markets value candidate policies via conditional contracts (pays out on metric *if* policy adopted). Highest price wins.
      *   Slogan: Vote on values, bet on beliefs.
      *   User's Goal: Translate into derivatives vocabulary to test viability/logic.

  3.  **Drafting - Section by Section:**

      *   **Part 1: A Term Sheet.**
          *   Need to mimic a product committee document.
          *   Fields: Underlying, Reference Data, Notional, Payoff, Observation Window, Resolution Date, Resolution Agent, Governance, Issuer/Credit Support, Margin/Default, Eligible Participants, Position Limits, Manipulation Controls.
          *   *Challenge:* Futarchy is vague on operational details. I must leave blanks where the proposal is silent.
          *   *Key Issue:* The "Underlying" is a macro metric (GDP, wellbeing index). The "Event" is policy adoption. The payoff depends on a counterfactual (what *would* have happened). This is the crux. Standard derivatives pay on *what happened*. Futarchy contracts pay on *what would have happened if*. This is unobservable.
          *   *Credit:* Who pays? The state? A clearing house?
          *   *Resolution:* How do you resolve a contract for a policy *not* adopted? The proposal says the price *determines* adoption. But the contract pays on the metric *after* adoption. If the policy loses, it isn't adopted. So the contract never resolves based on actual data. It resolves based on... what? The market price itself? No, the proposal says the market values the *expected* outcome. But for the contract to settle, you need the actual outcome. If the policy isn't adopted, you can't measure the outcome. This is a fundamental structural flaw in the derivative sense. I need to highlight this.

      *   **Part 2: Clause-by-clause translation.**
          *   (a) Information aggregation -> Price discovery efficiency vs. committee bias.
          *   (b) Conditional price = Expected Value -> Mark-to-market vs. Fair Value.
          *   (c) Values/Beliefs separation -> Objective function vs. Input variables.
          *   (d) Legitimacy -> Governance mandate vs. Market signal as instruction.

      *   **Part 3: The Residue Report.**
          *   Table format.
          *   Focus on: Price as expectation vs. equilibrium (risk premia, liquidity).
          *   Focus on: Unadopted policy contracts (the counterfactual problem).
          *   Verdict on gaps: Is it my vocabulary's limit or the proposal's vagueness? (Likely the proposal's vagueness/impossibility).

      *   **Part 4: The Reverse Residue.**
          *   What can I say that they can't?
          *   Incentives to manipulate the metric (since it's the payoff).
          *   Wealth vs. Impact (who has skin in the game vs. who suffers).
          *   Liquidity depth on non-adopted policies.
          *   Absorption cost: They need to admit wealth inequality affects policy selection or that metrics are gameable.

      *   **Part 5: Verdict.**
          *   Does the disagreement survive? Yes, it relocates to the metric governance and the impossibility of settling counterfactuals. The price signal does less work because the settlement mechanism is broken.

  4.  **Refining the Content (Self-Correction/Constraint Check):**
      *   *Word Count:* Need to monitor closely. 1,500-2,000 words is tight for 5 sections. Be concise.
      *   *Tone:* Professional, blunt, derivatives expert persona. No politeness fluff.
      *   *British English:* "Programme", "maximise", "centre", "colour".
      *   *No Names:* Do not mention Hanson, Robin, etc.
      *   *Gap Filling:* Explicitly state "Not specified by proposal" where needed.
      *   *Counterfactual Issue:* This is the biggest technical hurdle. A derivative paying on "GDP if Policy X passes" cannot be settled if Policy X fails. Futarchy proponents often wave this away, but from a market structure view, it's a deal-breaker. I must emphasize this.

  5.  **Drafting - Section 1 (Term Sheet):**
      *   Underlying: National Wellbeing Metric (undefined).
      *   Payoff: Metric Value at T, conditional on Policy Implementation.
      *   Resolution: Problematic. If policy not adopted, no data exists.
      *   Issuer: Sovereign? (Blank).
      *   Margin: (Blank).

  6.  **Drafting - Section 2 (Translation):**
      *   Translate "beliefs" to "probability-weighted outcomes".
      *   Translate "values" to "utility function parameters".

  7.  **Drafting - Section 3 (Residue):**
      *   The "Price = Expectation" claim ignores risk premia.
      *   The "Conditional" claim ignores the counterfactual settlement impossibility.

  8.  **Drafting - Section 4 (Reverse):**
      *   Manipulation of the underlying metric (since it pays out).
      *   Wealth weighting of votes (betting power).

  9.  **Drafting - Section 5 (Verdict):**
      *   The mechanism collapses into metric governance.

  10. **Review against Word Count:**
      *   Need to ensure I don't ramble. Keep descriptions tight.
      *   Check British spelling.
      *   Ensure no namedropping.

  11. **Final Polish:**
      *   Check the "counterfactual" logic again. In futarchy, the market prices the *expectation*. The policy with the highest price is adopted. Then the metric is measured. But what about the contracts on the *losing* policy? They never resolve based on reality. They must be cancelled or cash-settled based on... what? The proposal usually implies only the winning policy's outcome matters for the *history*, but the market participants need settlement to realise P&L. If I bet on the loser, do I get my money back? Or do I lose because the condition wasn't met? If the condition is "Policy Adopted", and it isn't, the payoff is undefined or zero. If zero, everyone shorts the loser. But the price is supposed to reflect the *value if adopted*. This is a logical contradiction in the contract design. I will highlight this sharply.

      *   *Correction on Futarchy Mechanics:* Usually, the idea is that the market prices the *conditional expectation*. $E[M | Policy]$. The policy with highest $E[M | Policy]$ is chosen. The contracts settle based on the *actual* $M$ *after* the policy is implemented. But what about the contracts on the policy *not* implemented? They cannot settle on actual $M$. They must be voided or settled at the final mark price. If voided, there is no profit/loss incentive to price them accurately near the decision point. If settled at mark, manipulation is rampant. I need to capture this tension.

      *   *Wait, re-reading the user's prompt:* "Candidate policies are then valued in prediction markets: for each policy there is a conditional contract that pays out on the wellbeing measure on the assumption that the policy is adopted."
      *   This implies the contract *only* pays if adopted. If not adopted, it pays nothing (or is void). If it pays nothing, the price should be zero unless there's a probability of adoption weighted by the metric. But the proposal says the price *determines* adoption. This is circular. The price reflects the probability of adoption times the metric? No, the slogan says "bet on beliefs" about the *consequences*.
      *   Okay, the standard futarchy model is: Market prices $E[M | Policy]$. The mechanism *forces* adoption of the highest priced policy. Therefore, the condition "if adopted" becomes true for the winner. For the loser, the condition becomes false.
      *   Settlement for losers: Usually undefined in casual descriptions. In a term sheet, this is a "Force Majeure" or "Cancellation" event. But if cancelled, traders lose the incentive to price the loser accurately. If the loser isn't priced accurately, how do we know the winner was better?
      *   I will flag this as a critical gap in the Term Sheet.

      *   *Word Count Check:* I need to be economical. I'll aim for ~300-400 words per section.

      *   *Tone Check:* "Blunt and honest". "Do not explain my own terms back to me."

      *   *British English:* "Maximise", "programme", "centre", "colour", "licence".

      *   *Let's write.*

      *(Self-Correction during drafting)*: I need to make sure I don't exceed 2,000 words. I will keep the Term Sheet very tabular and concise. The Residue Report table needs to be tight.

      *(Refining the Counterfactual point)*: The prompt asks me to treat the price/question of expectation vs equilibrium as questions to work through. I will ensure Section 3 does this.

      *(Refining the "Values/Beliefs" separation)*: In derivatives, we separate underlying (asset) from view (long/short). Here, the underlying is the metric. The view is the policy impact. But the metric is political.

      *(Final check on constraints)*: No named defenders/critics. First principles reasoning.

      *Let's assemble.*
answer: |-
  **1. A Term Sheet**

  **Product:** Conditional Policy Outcome Contract
  **Underlying:** [Blank – Proposal specifies 'national wellbeing measure' but provides no definition, calculation methodology, or frequency.]
  **Reference Data Source:** [Blank – Proposal does not specify an independent administrator. Presumably a government bureau, creating sovereign risk.]
  **Notional:** [Blank – Proposal does not specify currency or scale. Critical for determining market depth relative to policy impact.]
  **Payoff Formula:** $P = M_T$ if Policy $\pi$ is adopted; $P = 0$ (or void) if Policy $\pi$ is not adopted. Where $M_T$ is the Underlying value at Observation Window close.
  **Observation Window:** [Blank – Proposal specifies 'some horizon'. Too vague for pricing. Is it 1 year? 10 years? Discounting applies.]
  **Resolution Date:** [Blank – Dependent on Observation Window end plus audit period.]
  **Resolution Agent:** [Blank – Requires an entity authorised to declare the Policy 'adopted' and the Underlying value final. Conflict of interest inherent if Agent is the beneficiary of the Policy.]
  **Governance Framework:** [Blank – Proposal separates 'votes on values' from 'bets on beliefs', but does not specify who governs the contract rules themselves.]
  **Issuer:** [Blank – Who owes the payoff? If the State, this is contingent sovereign debt. If a CCP, where is the mutualised default fund capital sourced?]
  **Credit Support:** [Blank – No collateral framework specified.]
  **Margin:** [Blank – Initial and Variation Margin requirements undefined. Without these, leverage is unbounded.]
  **Eligible Participants:** [Blank – Universal access implies wealth-weighted voting. Restricted access implies information loss.]
  **Position Limits:** [Blank – No caps specified. Risk of single entity dictating policy via capital dominance.]
  **Manipulation Controls:** [Blank – Standard wash-trade and spoofing rules apply, but no controls for 'policy sabotage' to influence the Underlying post-adoption.]

  **2. Clause-by-clause translation**

  **(a) Information aggregation:**
  *Proposal:* Prediction markets aggregate dispersed information about consequences better than deliberation.
  *Translation:* Price discovery on this underlying is more efficient than committee consensus. The market incorporates private information into the mark-to-market faster and with less bias than a deliberative body, assuming liquidity is sufficient and incentives are aligned.

  **(b) Conditional price as expected value:**
  *Proposal:* The conditional price is an estimate of the expected value of the metric under that policy.
  *Translation:* The clearing price equals the probability-weighted average of future outcomes. This assumes risk neutrality. In my vocabulary, Price = Expected Value + Risk Premia + Liquidity Premia. The proposal asserts the premia are zero or negligible.

  **(c) Separation of values and beliefs:**
  *Proposal:* Values are voted on; beliefs are bet on.
  *Translation:* The Objective Function (the Underlying) is set by governance; the Input Variables (probability of outcome) are set by trading. This assumes the Underlying can be defined independently of the means used to achieve it. It assumes no feedback loop where the trading mechanism alters the Objective Function's validity.

  **(d) Legitimacy of price-based decision:**
  *Proposal:* Adopting the policy with the higher conditional price is a legitimate collective decision.
  *Translation:* Governance mandate is delegated to the market signal. The price is not merely indicative; it is instructive. This equates capital-weighted consensus with democratic legitimacy, provided the market structure is robust and the Underlying is trusted.

  **3. The residue report**

  | Claim | Counterpart in Vocabulary | Verdict | Distortion/Gap |
  | :--- | :--- | :--- | :--- |
  | **Price = Expected Value** | Fair Value / Theoretical Price | Distorted | Ignores risk premia. A price reflects marginal buyer's view adjusted for risk appetite, not pure statistical expectation. |
  | **Conditional Settlement** | Contingent Claim | No Counterpart | Standard derivatives settle on observable events. A counterfactual ('value if policy lost') is unobservable. Contracts on losing policies cannot settle on data. |
  | **Values/Beliefs Split** | Underlying vs. View | Distorted | The choice of Underlying (values) dictates the view (beliefs). You cannot separate the metric from the policy impact on that metric. |
  | **Legitimacy via Price** | Market Instruction | No Counterpart | Markets are allocation mechanisms, not governance bodies. A price signal lacks legal authority unless codified by the governance it purportedly guides. |

  **Analysis of Distortions and Gaps**

  Regarding **Price = Expected Value**: This is a limitation of the proposal's vocabulary, not mine. In derivatives, prices diverge from expectations due to hedging demand and capital constraints. If the 'belief' is unpopular but correct, it may not move the price sufficiently to win against a popular, wrong belief backed by capital. The proposal treats price as a truth machine; my vocabulary treats it as an equilibrium of capital and view. The distortion is material: it implies accuracy where there is only liquidity.

  Regarding **Conditional Settlement**: This is a sign that the proposal's claim is less determinate than it sounds. In my vocabulary, a contract must resolve. If Policy A wins, contracts on Policy B cannot settle on the wellbeing metric, because Policy B was not enacted. They must be voided or cash-settled at the final mark. If voided, traders have no incentive to price Policy B accurately near the decision point, destroying the comparison. If cash-settled at mark, the mark is manipulable because no real-world data validates it. The proposal lacks a mechanism to settle the counterfactual. This is not a vocabulary gap; it is a structural impossibility in the proposed design.

  **4. The reverse residue**

  **Wealth vs. Impact**
  *Observation:* My vocabulary distinguishes clearly between those with margin capacity and those subject to the underlying risk. The proposal implies 'bettors' represent the public.
  *Objection:* Genuine. Capital is not distributed democratically. A policy favouring the wealthy may price higher simply because the wealthy have more margin to back the belief, not because the wellbeing metric is higher.
  *Absorption Cost:* Proponents must accept policy selection is wealth-weighted. To absorb this, they must impose strict position limits or subsidise participation, which reintroduces the political distortion they sought to remove.

  **Metric Manipulation**
  *Observation:* I see the Underlying as a fixable benchmark. If the payoff depends on it, it will be moved.
  *Objection:* Genuine. If the contract pays on 'GDP', traders may lobby for policies that inflate GDP artificially while reducing actual wellbeing, or sabotage the data collection.
  *Absorption Cost:* Proponents must admit the metric requires fortress-like governance, more rigorous than any existing benchmark. This shifts the political battle from policy selection to metric definition, without reducing the stakes.

  **Trading the Decision**
  *Observation:* In my world, trading expresses a view on an exogenous outcome. Here, trading *causes* the outcome.
  *Objection:* Plausibly absorbable. This is a reflexive loop. However, it creates an incentive to short the winning policy post-decision if one can sabotage implementation to profit on the settlement.
  *Absorption Cost:* Requires banning secondary trading after policy adoption, reducing liquidity and price discovery quality before the decision.

  **5. Verdict**

  The disagreement survives translation, but it relocates. It is not primarily a disagreement about democracy versus markets. It is a disagreement about product viability.

  When translated into market structure terms, the proposal collapses into a governance problem regarding the Underlying and a settlement impossibility regarding the counterfactual. The price signal does less work than advocates claim because the signal cannot be generated cleanly. You cannot have a liquid market on a policy that, if it loses, leaves no trace in the data to validate the price. Therefore, the market on the losing policy is either illiquid (providing no information) or fictional (providing manipulable information).

  Consequently, the 'vote on values' becomes the only real decision. Since the metric defines the payoff, defining the metric is defining the policy outcome. The battle shifts entirely to the Reference Data Source and the Resolution Agent. In my vocabulary, this is where the risk lies. If the Resolution Agent is political, the contracts are political. If the contracts are political, the price is not a belief signal; it is a political forecast.

  The proposal attempts to outsource epistemic labour to the market. My translation shows the market cannot perform this labour without a resolvable underlying. Since the underlying for losing policies is unresolvable, the market cannot compare them reliably. The mechanism therefore reverts to the ordinary democratic decision it sought to replace, but with added complexity and new vectors for manipulation via the metric itself. The substantive disagreement is not about institutions, but about the feasibility of settling counterfactual derivatives. On that ground, the proposal fails the product committee.
