  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Persona:** Senior executive at a derivatives exchange (20 years experience). Expert in market structure, product governance, contract specs, reference data, benchmarks, position limits, clearing, default, market abuse (corners, squeezes, manipulation). No training in political philosophy.
