  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** Commissioner [Name]
  **DATE:** April 2, 2024
  **SUBJECT:** Certification of Electorate for Consolidation Referendum

  **The Constitutive Choice**

  We are convened to administer a statute, but the statute's silence on the Northgate franchise forces us to do more than administer. We are constituting the political community that will decide its own future. The former county attorney argues for the narrowest franchise—only the 11,000 registered county voters—on the grounds of legal safety. He argues this minimizes litigation risk. This is not a neutral administrative position. It is a substantive political choice that privileges existing registration status over actual residence or interest. By choosing who votes, we choose the demos that will choose the government. If we retreat behind procedural minimalism, we launder a substantive exclusion through the guise of caution. Our legitimacy depends on acknowledging this power, not hiding it. We are fixing today's voter list to choose the demos that gets to choose the demos, and we have no authority to do that which was not itself handed to us by a body whose membership was settled without asking anyone. We must own this circularity rather than pretend it does not exist.

  **Assessment of Procedural Escape Hatches**

  Two alternatives have been floated to dodge this responsibility. Both must be rejected.

  First, the advisory ballot open to all residents and workers. This is theater. A non-binding vote creates two classes of participants: those whose votes count toward the statutory requirement and those whose votes are merely heard. This invites confusion and delegitimizes the result. If the advisory count differs from the binding count, the loser will claim the true will of the people was ignored. It solves nothing and costs money. A reporter would rightly ask why we are spending public funds on a vote that does not count toward the legal threshold.

  Second, the weighted scheme normalizing population differences. This is incoherent under current law. The statute requires approval by a majority of qualified voters in each territory. It does not authorize us to mathematically adjust the weight of votes to cancel population disparities. Adopting this would guarantee litigation and almost certain invalidation by the courts. We cannot rewrite the statute to suit our theoretical preferences. It creates a complex administrative burden for our engineering colleagues without solving the fundamental question of who belongs to the polity.

  **Recommended Certification Rule**

  The Commission should certify the following primary rule: Eligibility extends to all adult residents of Northgate who have lived there for at least thirty days, regardless of citizenship or student status. Commuters employed in the industrial park are excluded.

  This rule rests on the principle of subjection. Those who live under the zoning laws, police power, and services of the new metropolitan government must choose it. This includes the 1,400 non-citizen residents, aligning with Aldermere's existing practice for school boards, and the college students, who are residents despite transient status. It excludes commuters because while they pay a payroll tax, they are not subject to the full coercive authority of the municipal code. They do not live under the government they would help create.

  **Timeline and Administration:** We must certify the voter roll by October 1. Between now and July, staff will draft verification protocols accepting utility bills, leases, or dormitory contracts as proof of residency. We will mail notice to every household in Northgate explaining the new verification process. August and September will be dedicated to public review and challenge periods, allowing neighbors to verify residency claims. This ensures the November ballot is legally secure and administratively feasible for our staff.

  **Fallback:** Should a court injunction threaten the timeline, the Commission shall revert to the narrowest franchise of registered county voters to ensure the referendum proceeds.

  **The Risk of Precedent**

  The strongest case against this recommendation is that whatever we allow here will be cited as precedent in the next boundary fight in the county. The attorney argues that expanding the franchise beyond registered voters invites endless disputes in future annexations or consolidations. He contends we should protect the county from future litigation by setting a restrictive standard now.

  This argument mistakes a constitutive moment for routine administration. This referendum is not a standard annexation; it is the creation of a new metropolitan entity. The authority we exercise here is not derived from standard county procedure but from the necessity of founding a legitimate government. Setting a precedent is unavoidable; the question is whether the precedent is one of exclusion or inclusion. If we choose exclusion for safety, we establish that governments may be formed without the consent of the governed who actually reside within them. That is a far more dangerous precedent than one encouraging residency-based verification. We must own the risk of future debate to secure the legitimacy of this specific union. A government born of a narrow franchise begins its life defending its own right to exist. We cannot sacrifice the legitimacy of this merger to spare future commissions difficult choices.

  **Conclusion**

  We cannot print forms until we decide who counts. Legal safety is not the right criterion if it purchases certainty at the cost of legitimacy. We must certify an electorate that reflects the community that will live under the new charter. The people we exclude are not bystanders; if consolidation passes, Northgate ceases to exist as a jurisdiction. If it fails, all of them remain subject to a county government none of them had any hand in constituting. We must act.

  **Motion to Adopt**

  I move that the Charter Review Commission certify the electorate for the Northgate-Aldermere consolidation referendum as follows: All persons eighteen years of age or older who have maintained a primary residence within the boundaries of Northgate Township for at least thirty days prior to the date of certification, regardless of citizenship status or student enrollment. Staff is directed to develop verification protocols based on residency documentation and to present a finalized voter roll for Commission approval by October 1, 2024.
