  I chose the villanelle because its compulsive returns mirror the sphex's loop; the form enacts the inability to deviate. I committed to the inexhaustible-loop version (Fabre/Dennett) rather than the contested biological reality where wasps may adapt, because the reading group's point was the rhetorical power of the example, not entomological precision. The poem treats the loop as diligence to deny the reader the comfort of simple mockery. I am highly confident in the philosophical deployment of "frame" and "sphexishness" (Hofstadter/Dennett). I am least sure about the specific claim that the wasp cannot compensate for missing prey; while widely cited in philosophy, recent ethology suggests greater flexibility in *Sphex ichneumoneus*, implying the "mindlessness" is partly a artifact of experimental setup. The poem leans on the irresistible story, as requested, while the note acknowledges the debt.
