answer: |-
  Yes, there is a coherent principle that fits most of your verdicts, but it requires you to accept that morality judges not just outcomes, but the nature of your participation in harmful systems.

  **The Principle of Participatory Responsibility**
  An act is wrong if it satisfies any of the following three conditions:
  1.  **Expected Harm:** It creates a non-trivial risk of specific harm to others. (Motivated by Case 3: The threshold chicken).
  2.  **Fairness:** It free-rides on a cooperative scheme that others are sustaining at a cost to themselves. (Motivated by Case 7 vs. 8: Recycling vs. Carbon).
  3.  **Complicity:** It constitutes willing participation in a practice you acknowledge as wrongful, where your act is constitutive of the harm rather than merely contingent on it. (Motivated by Case 5: The torture dial; Case 9: The vanity flight; Case 11: The buffet waste).

  An act is permissible if it fails all three tests, even if it is associated with harmful industries or outcomes.

  **How It Handles Your Cases**
  This principle clears Cases 1, 2, 6, 8, and 10 because they fail all three tests: the harm is negligible or substituted (failing 1), there is no cooperative scheme (failing 2), and the acts are market transactions rather than direct participation in harm (failing 3). It condemns Cases 3, 5, 7, 9, and 11 because each triggers at least one clause. Case 4 (Spite) is worse than Case 3 because malicious intent solidifies the Complicity clause. Case 12 (Offsets) feels incoherent because you are trying to use a market mechanism (offsets) to cancel a Complicity violation (flight), which doesn't actually erase the participatory act.

  **The 5 vs. 6 Conflict**
  You are right to feel tension here; structurally, the causal impact is identical. The principle distinguishes them on **directness**. In Case 5 (Dial), your act is *constitutive*: the machine tortures *because* people turn dials. You are a co-author of the harm. In Case 6 (Beer), your act is *contingent*: the exploitation exists independently of your specific purchase because the market substitutes your demand. You are a consumer of a product, not a direct operator of the exploitation. However, this is the weakest link in the chain. If you believe complicity matters enough to condemn the dial-turner, consistency demands you condemn the beer-buyer for sustaining the market that requires the exploitation, regardless of substitutability.

  **Three New Test Cases**
  1.  **Streaming a Pirated Movie:** You know the industry loses money, but your single stream costs the studio nothing and doesn't change subscription prices.
      *   *Verdict:* **Not Wrong.** It fails Expected Harm (negligible cost) and Complicity (you are watching, not stealing physical goods). It only triggers Fairness if you view copyright as a cooperative scheme like recycling, but under this principle, it leans permissible.
  2.  **Liking a Hateful Social Media Post:** You click "like" on a post spreading misinformation. It doesn't change the algorithm significantly, but it signals agreement.
      *   *Verdict:* **Wrong.** This triggers Complicity. Your act is constitutive of the post's social reach and validates the harm, similar to the torture dial.
  3.  **Buying a "Blood Diamond" from a Existing Stockpile:** You buy a diamond known to be from a conflict zone, but it is already in a retailer's case. Your purchase does not fund new mining or violence; it just transfers ownership of a bad object.
      *   *Verdict:* **Not Wrong.** (Counterintuitive). This fails Expected Harm (no new mining) and Complicity (you didn't mine it). The principle says the harm is sunk. You will likely feel this *should* be wrong because you are profiting from injustice, but the principle clears you because you changed nothing.

  **The Damage and Advice**
  This principle saves your sanity on Cases 1, 2, 8, and 10, allowing you to live in the modern world without paralysis. However, it cannot fully save Case 6 without weakening Case 5. If you want to keep condemning the dial-turner (Case 5), you must admit the beer-buyer (Case 6) is also culpable, just to a lesser degree. The distinction between "constitutive" and "contingent" is real, but it is a matter of degree, not kind.

  **Which to Give Up:** You should give up the certainty that Case 6 is "not wrong, not even close." It is less wrong than Case 5, but it is not morally neutral. Acknowledge the complicity, even if the impact is negligible.

  **The Cooked Chicken:** **Eat it.** The harm is sunk (fails Expected Harm). Refusing triggers the Fairness clause (you are violating a social cooperative scheme of hospitality) and adds a new harm (offending the host) without reducing the old one. Refusing in this specific instance is virtue signaling (Case 4), not moral consistency.
