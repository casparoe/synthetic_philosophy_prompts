          2.  Category types: 'a' across fonts vs. Calibri vs. look-alikes. Metric compatibility complications.
          3.  Essence vs. Enumeration: Did the reliance on artifact history (dates, files) refute the "essence cannot be enumerated" thesis?
          4.  Binary vs. Graded: Court needs binary truth; *Letter Spirit* offers fluidity. Who is at fault in the mismatch?
      *   **Constraint:** If the framework has nothing to say, admit it plainly. Do not stretch the theory.

  2.  **Analyze the Source Material (*Letter Spirit*):**
      *   *Core Thesis:* Letter identity is not a checklist of features (serifs, x-height, stroke contrast) but a "style" or "essence" (the "spirit") that generates the "letter." It's about recognition across variation.
      *   *Mechanism:* Holistic perception, analogy, grid-based generation (in the computational model).
      *   *Scope:* Primarily focused on *letterforms* (glyphs) within a grid, and how a consistent style generates different characters (a-z). It touches on font identity but is fundamentally about the *internal* consistency of a typeface's spirit.
      *   *Limitations:* It is a cognitive/computational model of perception and generation, not a forensic or legal framework. It deals with *what makes an 'a' an 'a'*, not *which specific digital file produced this 'a'*.

