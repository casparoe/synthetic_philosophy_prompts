          *   *Difference:* One is abstract (letterhood), one is concrete/proprietary (font identity).
          *   *Metric Compatibility:* This is the killer for *Letter Spirit*. If Font A and Font B have different shapes (different "spirits") but identical metrics, *Letter Spirit* sees them as different spirits. But functionally (in a document), they are interchangeable.
