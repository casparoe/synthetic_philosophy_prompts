          *   *Refinement:* The episode shows that "Typeface Identity" in the wild is a hybrid: Visual Essence + Historical Provenance. *Letter Spirit* only owns the first half. Relying on history doesn't refute the perceptual thesis; it just bypasses it for forensic utility.

