answer: |-
  **Brainstorming the Stakes**
  Moore is transitioning from meta-ethics (what "good" means) to normative ethics (what things *are* good). The stakes are high: if he fails here, ethics remains purely negative (knowing only what is *not* good). The primary sources of confusion are twofold. First, Moore shifts between metaphysical claims (what the Absolute Good *is*) and epistemic claims (what we can *know* about it), often using the same terms for both. Second, the "Principle of Organic Unities" seems to undermine the intuitive method of aggregating goods, creating tension between maximizing positive values and respecting holistic interactions. Your confusion is warranted; the text is dense and the 1922 edition contains typographical errors that obscure the logic.

  ### 1. Paraphrase and Glossary
  **Paraphrase:**
  1.  (§110) "Ideal" has three meanings: (1) The Absolute Good (perfect conceivable state), (2) The Human Good (best possible state in this world), and (3) Things good in a high degree. This chapter focuses on (3).
  2.  (§111 start) Knowing (3) is prerequisite to knowing (1) or (2).
  3.  (§111 (1)) Due to organic unities, the Absolute Good might consist of unimaginable qualities; containing all known goods might not make the best whole.
  4.  (§111 (1)) We cannot judge unimaginable things. We must compare only wholes composed of known elements. We can claim superiority over rivals, not perfection.
  5.  (§111 (1)) The best constructible ideal maximizes known positive goods and excludes evils, provided their combination doesn't diminish the whole's value via organic interaction.

  **Glossary:**
  *   **Good-in-themselves:** Intrinsically valuable, regardless of consequences (idiosyncratic: non-natural property).
  *   **Positive value:** Goodness greater than zero.
  *   **Indifferent:** Value of zero (neither good nor evil).
  *   **Summum Bonum / Absolute Good:** Sense (1) of Ideal; metaphysically perfect state.
  *   **Human Good:** Sense (2) of Ideal; best achievable state.
  *   **Utopia:** Example of Human Good.
  *   **Kingdom of Heaven:** Example of Absolute Good.
  *   **Principle of Organic Unities:** The value of a whole is not identical to/proportional to the sum of its parts' values.
  *   **Shift:** "Ideal" shifts from metaphysical perfection (1) to epistemic target (3) mid-§110.

  ### 2. The Three Senses and Ordering
  The three senses are: (1) Metaphysical Perfection (Absolute), (2) Practical Maximization (Human), (3) High-Degree Goods (Components).
  Moore claims (3) must be answered before (1) or (2). This is **epistemic priority**, not metaphysical composition. You cannot build the best whole (1 or 2) without knowing which parts have positive value (3).
  This survives §111(1)'s admission because Moore distinguishes between what *constitutes* the Absolute Good and what we are *entitled to assert*. Even if the Absolute Good contains unknown qualities, we cannot judge them. Therefore, for the purpose of ethical inquiry ("our search"), we are limited to known goods. The ordering claim holds for *human ethics*, even if it doesn't hold for God's eye view.

  ### 3. Principle of Organic Unities
  **Formulation:** "The intrinsic value of a whole is neither identical with nor proportional to the sum of the values of its parts."
  **Dependency:** The inference that "a whole, which does not contain all positive goods, may yet be better than a whole which does" depends entirely on the "nor proportional" clause. If value were proportional, adding a good part would always increase the whole's value.
  **Entailment:** The principle alone does not entail omission is better; it only entails value is non-additive. An extra premise is needed: **Interaction Premise:** *The presence of some positive goods can negatively interact with others to reduce the total intrinsic value.* Moore is entitled to this based on his reference to Chap. I (§§ 18–22), where he allegedly established this via examples (not provided here).

  ### 4. Reconstructing the Garbled Sentence
  **Text:** "...the Ideal would necessarily contain all the things which have all these parts might not be so valuable as some other whole..."
  **Reconstruction:** "...the Ideal would necessarily contain all the things which [are good], yet a whole which contains all these parts might not be so valuable as some other whole..."
  **Justification:** The argument contrasts "greatest possible sum of values in its parts" (additive view) with the value of the "whole" (organic view). The phrase "have all these parts" is nonsensical in context. The logical contrast requires a clause stating that an aggregate of all goods (additive ideal) might be worse than a selective whole (organic ideal). The reconstruction restores the contrast between aggregation and organic unity required by the surrounding sentences. This is a text difficulty, not a reading error.

  ### 5. Diagnosing the Contradiction
  There is no contradiction, but there is a **methodological constraint**.
  §111(1) states a metaphysical possibility: adding goods *can* make a whole worse (due to organic unities).
  §111(3) states a heuristic rule: maximize goods *provided* their presence doesn't diminish the whole.
  The proviso ("provided that the presence of none of these goods... seems to diminish the value of the whole") is coherent. It means: "Maximize goods *ceteris paribus* regarding organic interaction." You should include every good *unless* you have reason to think its inclusion triggers a negative organic effect. The first paragraph warns you that such effects exist; the third tells you how to build the ideal given that warning.

  ### 6. Epistemic Humility and Warrant
  Moore claims we are entitled to assert comparative superiority ("better than any other... rival") but not perfection ("Perfection").
  **Warrant:** This is a **comparative warrant** based on direct intuition of known wholes. It is an asymmetric burden of proof: we don't need to prove a state is *the best conceivable*, only that it is *better than the proposed alternatives*.
  **Deliverability:** This delivers enough for normative ethics (choosing between actions/states) without requiring metaphysical certainty.
  **Isolation Method:** The text here does not explicitly mention the "isolation method" (asking what is worth having if it existed entirely alone). That procedure is relevant to establishing sense (3) (what is good-in-itself), which is the foundation for this chapter. If you are misremembering its role, note that isolation tests *parts*, while this chapter tests *wholes*. The warrant here relies on comparing complex wholes, not isolated parts.

  ### 7. Beauty, Friendship, and Bad Objects
  **Organic Unity:** Yes, the machinery supports treating affection + object as an organic unity. The value lies in the whole state (consciousness of object + emotion), not the sum of the object's value and the emotion's value.
  **Bad Objects:** The passage does not explicitly resolve whether affection for a bad person is good or evil. However, the **Principle of Organic Unities** implies the whole's value can diverge from the parts'.
  **Consistent Reading:** It is consistent with this passage to argue that a whole containing affection for a bad person can be positive (a good whole), even if the object is negative, provided the organic unity yields positive intrinsic value.
  **Common Mistake:** Readers often assume the value of the whole must match the moral quality of the object (i.e., loving a bad person is evil). Moore's machinery allows the *emotion-object complex* to be a great good, even if the object is not.
  **Limitation:** The provided text does not confirm Moore's specific verdict on bad objects; it only provides the logical space (organic unities) for such a verdict. Your friend's Bloomsbury reading is licensed by the *structure* of §111, though the specific ranking of friendship appears later in the chapter (not quoted here).
