      *   *William Fox pamphlet:* "An Address to the People of Great Britain, on the Propriety of Abstaining from West India Sugar and Rum" (1791). Yes, widely circulated.
      *   *East India sugar switch:* Yes, marketed as free labour.
      *   *Women's role:* Yes, crucial (e.g., Elizabeth Heyrick later, but women were active in 1791 boycotts).
      *   *West India interest replied:* Yes, counter-pamphlets existed.
      *   *Following year petition campaign:* Yes, 1792 saw massive petitions and Dundas's "gradual abolition" motion.
      *   *Smith's death:* July 1790. Correct.
      *   *China earthquake passage:* Yes, TMS III.3.
      *   *Overall:* The facts provided by the user are historically sound enough for the purpose of the exercise. I should confirm this briefly at the start but proceed immediately to the analysis as requested ("if you think I have got any of them wrong please say so before proceeding" -> I don't think they are wrong, so I will proceed).

  3.  **Mapping Smith to the Boycott:**
      *   *Sympathy as Imagination:* The boycott relies on making the distant suffering of the enslaved vivid. Fox's pamphlet tries to bridge the "China earthquake" gap by doing arithmetic to make the suffering proximate.
      *   *Distance:* Smith says we care less about distant strangers. The boycott is a counter-move to this natural bias. It requires *effort* of imagination.
      *   *Impartial Spectator:* Who is it? Ideally, the impartial spectator within the abstainer. But also the public audience (other abstainers).
      *   *Propriety vs. Utility:* Smith distinguishes approving the motive (propriety) vs. the outcome (utility). The boycott is tricky because it's often justified by utility (ending slavery) but practiced as a moral duty (propriety of not participating in sin).
      *   *Prediction:* Smith would be skeptical. The suffering is too distant. The link between sugar and pain is abstract. However, the *mechanism* of the pamphlet (arithmetic) tries to make it vivid.
      *   *Rival Readings:* Smith offers a middle ground. It's not just utility (economic), not just expressive (empty), not just religious (external command). It's about internalizing the spectator.

  4.  **Addressing the Three Tensions:**
      *   *Invisibility:* Smith's spectator relies on observation. Abstention is a negative act (not buying). How is it seen? Pledges, sugar bowls left empty, East India sugar labels. This creates a *new* visibility. Smith doesn't explicitly cover negative acts, but the principle of seeking approval holds.
