      *   *Tension 2 (The Enslaved):* The problem of the voiceless spectator. Is the impartial spectator universal enough? This is where Smith strains.
      *   *Tension 3 (Calculation):* Propriety vs. Utility. The arithmetic of guilt. Smith's unease with consequentialism.
