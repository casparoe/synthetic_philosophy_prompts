      *   *Calculation/Utility:* Fox's pamphlet is utilitarian (arithmetic of guilt). Smith prefers motive. If I abstain to look good, it's vanity. If I abstain because I feel the pain, it's propriety. The calculation risks turning it into utility. Smith might worry this corrupts the moral sentiment.
      *   *Smith's Economic Argument:* Smith opposed slavery on efficiency grounds (*Wealth of Nations*). The 1791 movement opposed it on moral grounds. This is a disconnect. Smith the moralist might support the sentiment, but Smith the economist had a different critique. I must acknowledge this silence/divergence.

