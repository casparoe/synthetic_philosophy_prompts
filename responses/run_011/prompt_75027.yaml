answer: |-
  My dear colleague,

  I am delighted to hear of your seminar and the ambitious case study you are assembling. It is a rare thing to find a project that treats the history of activism with the philosophical rigour it demands, rather than reducing it to a mere precursor of modern politics or a footnote in the history of sentiment. You have asked me to check your factual premises before proceeding to the analysis, and I am pleased to say that the historical skeleton you have provided is sound. Wilberforce's bill was indeed defeated in May 1791, William Fox's pamphlet appeared shortly thereafter and achieved the remarkable circulation you describe, the switch to East India sugar was the primary mechanism of abstention, and the petition campaign of 1792 did follow in the wake of this consumer agitation. Smith's death in July 1790 indeed places him just outside the event, leaving his theory available as an instrument of analysis but denying us any direct commentary from the man himself. Since the facts hold, I shall proceed directly to the mapping you have requested, treating Smith's *The Theory of Moral Sentiments* as the lens through which we view this episode, keeping in mind your caution against recruiting him where he is silent.

  To map Smith onto the boycott is to test the elasticity of his moral psychology against a phenomenon he did not foresee. The load-bearing piece of his account is sympathy, which he defines not as a contagion but as an act of imagination whereby we place ourselves in another's situation. The central problem for the abolitionists, as you note, was the problem of distance. Smith is famously pessimistic about our capacity to feel for those far away, illustrating this with the passage you cite regarding the earthquake in China. The humane European moralises on the catastrophe and then sleeps soundly, whereas the loss of his own little finger would disturb him profoundly. The British consumer in 1791 is precisely this European, and the enslaved person in the West Indies is the victim in China. The innovation of Fox's pamphlet was to attempt a technological fix for a psychological limitation. By pressing readers to do the arithmetic of participation—calculating how many lashes correspond to a pound of sugar—the pamphlet tries to make the distant suffering vivid enough to breach the natural decline of concern with distance. It attempts to force the imagination to do what it naturally refuses to do.

  In this mapping, the spectator is a complex figure. In Smith's usual account, the spectator is a member of the agent's own society, someone whose approval we seek. In the boycott, the abstainer is acting before two audiences. The first is the actual audience of other British consumers, shopkeepers, and neighbours, whose approval is sought through the visible signs of abstention. The second is the impartial spectator, that internalised judge corrected for partiality. The question you raise regarding whom this spectator stands in for is crucial. Ideally, the impartial spectator represents the interests of all humanity, not just the local community. If the abstainer is to be approved of, the spectator within must be standing in for the enslaved person, imagining their suffering as if it were their own. The sentiment being approved is not merely the abstention itself, which is a negative act, but the motive of the person who abstains. For Smith, the propriety of an action depends on the appropriateness of the motive to the cause. If one abstains merely to signal virtue to neighbours, it is vanity; if one abstains because the imagination has successfully bridged the gap to the enslaved person's pain, it is propriety. The pamphlet's calculation is a tool to facilitate this propriety, though as we shall see, it risks collapsing into utility.

  What does Smith's theory predict about whether such a movement could get started at all? Given his insistence that our sympathies are calibrated to nearness and vividness, he would likely have predicted failure. The link between a cup of tea and a whip is causal and abstract, not immediate and sensory. The suffering is invisible, occurring on another continent, mediated by merchants and ships. Smith would expect the little finger to win every time. That the movement succeeded suggests either that Smith underestimated the power of printed media to simulate proximity, or that the impartial spectator is more capable of universalisation than Smith typically allows. This brings us to the rival readings you mention. A utility-maximising reading suggests consumers acted to lower prices or secure better trade terms, dressed in piety. Smith's framework rejects this because it distinguishes between the utility of an action and the sentiment approving it; one can approve of a useful action without moral sentiment, but moral approval requires a sympathetic motive. An expressive politics reading suggests the boycott was about defining British identity rather than helping slaves. Smith can accommodate this through the desire for mutual sympathy of sentiments, but it fails to explain the sacrifice involved, which Smith attributes to the strength of the internalised spectator. The religious conscience reading posits an external command from God. Smith's spectator is internal, built from social interaction. The Smithian explanation is superior because it accounts for the social mechanism of the boycott without reducing it to either cynical calculation or divine imperative; it explains how a secular moral sentiment could be manufactured and shared through the medium of the pamphlet and the teatable.

  However, we must now turn to the three features where the theory strains, for this is where your seminar will find its most productive friction. The first is the invisibility of abstention. Smith's spectator is trained by an audience that sees what you do. Praise and blame are social tools. Not buying sugar is a non-event; it leaves no trace. Yet the movement manufactured visibility through pledges, shop signs advertising East India sugar, and the refusal of sugar in mixed company. Does this show spectators doing something Smith cannot accommodate? I would argue it shows the same mechanism in an unfamiliar medium. Smith acknowledges that we seek not only praise but praiseworthiness. The abstainers, unable to be seen not buying, created tokens of their abstention to make the negative act positive and visible. They turned the empty sugar bowl into a sign. Smith's account can accommodate this provided we understand that the spectator requires *some* evidence of conduct to judge. The movement did not break the theory; it simply engineered the conditions for the spectator to function where they naturally would not.

  The second tension is more severe. The enslaved could never be actual spectators of a British consumer's conduct. They could neither confirm nor correct the consumer's judgment. Yet the abstainers behaved as though there were a spectator standing where the enslaved stood. Is this a resource latent in Smith? He does allow the impartial spectator to be corrected beyond the company actually around one, transcending local prejudice. However, Smith's spectator is fundamentally a member of the same moral community, capable of reciprocal judgment. The enslaved person, stripped of agency and voice, cannot enter this reciprocity. To treat them as a spectator is to attribute a standing to them that Smith's theory of social interaction does not easily ground. It looks very much like an import from elsewhere, perhaps a religious notion of the soul's equality or a nascent rights-based notion of human standing that exists independent of social recognition. Smith's theory relies on the capacity to sympathise *with* someone, but it assumes that someone is capable of sympathising back, or at least of judging us. If the enslaved are purely passive victims, the Smithian spectator lacks the feedback loop required for correction. Here, the theory stretches to the point of transparency. The abstainers were acting on a principle that the suffering of a human being commands moral attention regardless of their capacity to judge the observer. Smith might approve of the sentiment, but his machinery for explaining how that sentiment is calibrated lacks the gears to account for the voiceless.

  The third feature is the pamphlet's argument itself, which is a calculation of causal shares. Fox asks readers to compute their fraction of guilt. Smith is famously uneasy about approving of actions solely on account of their consequences. He distinguishes between the propriety of the motive and the utility of the act. When we approve of the abstainer, are we approving of the propriety of the motive or the utility of the act? In this case, the two are tangled. The calculation is utilitarian: if everyone abstains, the trade falls. But the individual act of abstention has negligible utility on its own. If the approval rests on the calculation, it rests on utility. Smith would worry that this corrupts the moral sentiment, turning virtue into a ledger. However, one might argue that the calculation is merely the trigger for the imagination, not the ground of the approval. The ground of approval is the benevolence shown by refusing to participate in suffering. Yet Smith's framework struggles to keep the two apart here because the pamphlet explicitly Justifies the act by its consequences. This suggests that the boycott represents a shift towards a more consequentialist moral culture than Smith inhabited, one where the arithmetic of outcomes begins to outweigh the purity of the motive. Smith can explain the motive, but he would be suspicious of the arithmetic.

  Finally, we must address Smith's own case against slavery, which was largely economic. In *The Wealth of Nations*, he argues that slave labour is dearer than free labour because a person who can acquire no property has no interest in acquiring anything beyond his subsistence. This is not remotely the argument that moved anyone in 1791. The abolitionists argued from moral guilt, not economic inefficiency. Where Smith is silent on the moral psychology of the boycott, he is also divergent on the critique of slavery itself. He opposed slavery because it was bad economics; the boycotters opposed it because it was sin. To recruit Smith here is to risk conflating two distinct critiques. He would likely agree with the outcome but for different reasons. If your seminar insists on using Smith to explain the moral motivation of the boycotters, you must acknowledge that you are using the Smith of *The Theory of Moral Sentiments* against the Smith of *The Wealth of Nations*, or at least extending the former into a territory the latter treated with cold analysis.

  Does the exercise fail at the outset? I do not think so, but it requires honesty about the limits. Smith's moral psychology is the right instrument for understanding the internal struggle of the consumer—the battle between the little finger and the earthquake. It is less effective at explaining the collective action problem or the political standing of the enslaved. If you want to explain why the movement coalesced socially, Smith is invaluable. If you want to explain why the enslaved were deemed worthy of such sacrifice despite their inability to reciprocate, Smith is insufficient. You might consider that a rights-based framework or a religious conscience model handles the second tension better, but Smith remains superior for explaining the mechanism of sympathy itself. I would advise you to present Smith not as the complete explanation, but as the best available map for the terrain of sentiment, while marking clearly the places where the map runs out of detail. The boycott was a moment where moral sentiment had to be engineered against the grain of human nature as Smith described it. That it succeeded suggests either that Smith was too pessimistic about our capacity for imagination, or that the tools of modern media changed the geometry of distance. Either way, running this episode through his theory reveals the precise point where eighteenth-century moral philosophy met the birth of modern political activism, and where the latter began to outgrow the former.

  I hope this assists you in structuring the seminar. It is a compelling subject, and treating it with this level of philosophical discipline will surely yield a rich discussion.

  Yours sincerely,

  A. Colleague
