          *   Predict whether the movement could start given Smith's views on sympathy/distance.
          *   Compare Smith's explanation to rival readings (utility-maximising, expressive politics, religious conscience).
          *   Address three specific tensions/breaking points:
              1.  Invisibility of abstention vs. Smith's visible spectator.
              2.  Enslaved people as absent spectators vs. Smith's internalised spectator.
              3.  Calculation of causal shares (utility/consequences) vs. Smith's preference for motive/propriety.
          *   Address Smith's economic argument against slavery vs. the moral argument of 1791.
          *   Be honest if Smith's theory is the wrong instrument.
      *   **Constraints:** No bibliography, no reading list, no adjudicating numbers.
      *   **Tone:** Academic, disciplined, analytical, epistolary.

  2.  **Fact-Checking (Mental Check):**
