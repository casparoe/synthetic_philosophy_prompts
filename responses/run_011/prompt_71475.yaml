  1. Existence-Relative Deprivation, motivated by the aneurysm case, holds that harm requires an existing subject who is deprived of future goods they would have valued. It verdicts the aneurysm as harm and prenatal non-existence as neutral, while counting the cellist as harmed due to capacity loss during life but the hoax victim as unharmed because no subject exists to suffer the distortion. This repairs your Presence Condition by specifying that the worse condition must attach to a living subject's timeline rather than a life taken as a whole.

  2. Objective Narrative Integrity, motivated by the cellist case, claims harm is any reduction in the objective worth of a life story regardless of experience. It verdicts both the aneurysm and prenatal non-existence as harms due to missing value, and counts both the cellist and hoax victim as harmed because their life's meaning is objectively degraded by injury or distortion. It treats life as a completed book where missing chapters or forged endings equally diminish the whole.

  3. Transcendent Desire Satisfaction, motivated by the posthumous lies case, asserts harm occurs whenever stable desires extending beyond death are thwarted. It verdicts the aneurysm as harm and prenatal non-existence as neutral, but counts the hoax victim as harmed because his political desires are violated, while the cellist is unharmed because her desire for music ceased. This principle prioritizes the persistence of wants over the persistence of consciousness.

  4. Existence-Relative Deprivation verdicts that a brain-dead patient kept on machines suffers no harm from the delay, whereas the rival principles would count the wasted biology or thwarted wishes as losses. It also verdicts that stealing a dead person's savings causes no harm to them, while the rivals would count the objective loss or thwarted wish to provide for heirs as a genuine harm. These cases isolate whether harm requires a subject, an objective narrative, or surviving desires.

  5. This principle cannot save your verdict that lies told after your death which ruin your reputation are bad for you, since no subject exists to possess the worsened condition. You ought to give it up because retaining it forces you to abandon the subject-requirement that successfully protects you from the symmetry argument regarding prenatal non-existence. Consistency demands you treat posthumous reputation as a concern for the living rather than a harm to the dead.
