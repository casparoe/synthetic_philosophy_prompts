  I run a monthly "math night" at my company — about 12 people, all engineers, nobody's taken a philosophy class — and we've got 90 minutes. I want an in-class game about actual vs. potential infinity (Hilbert's hotel, Cantor, the finitist complaint) where they run into the wall themselves instead of me explaining it, and they shouldn't hear the word "uncountable" until the debrief.

  Here's the mechanic I keep circling, build on it or throw it out: there is no room list. There's a "desk" that will write down any room number you ask for, one at a time, on demand — like a lazy generator, nothing ever gets materialized. Teams check in waves of guests by submitting a rule in 25 words or less ("everyone moves to room 2n"). Each rule costs tokens out of a fixed, finite pot, and you only earn them back if the rule provably doesnt collide or strand somebody. The last wave should be the one they can't handle, and I want it to come out of the rules they already wrote down, so the diagonal is theirs rather than mine.

  Give me materials, the wave sequence with timings, the scoring, and a debrief that maps each moment onto actual/potential infinity and onto why a finitist says the whole game is cheating — plus what will predictably break the first time I run it and which feature of the view this setup just can't reproduce, that I'll have to supply by hand.

  Answer as exactly five numbered items — the five beats of the session, in order — two or three sentences each, materials folded into beat 1, no intro and no wrap-up.
