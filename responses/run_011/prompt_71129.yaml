answer: |-
  ### The Utility Monster Sorting Tree

  This decision tree is designed to bypass theoretical labels and locate your reading group members' actual commitments regarding resource allocation and moral status. The four test cases are: **Nozick's Original** (extreme efficiency), **The Mirror-Image** (extreme inefficiency), **The Sadistic Being** (welfare via suffering), and **The Artificial Agent** (unbounded function, no inner life).

  There are ten decision nodes. Follow the path dictated by your honest answer to each question.

  **Node 1:** Does an entity require phenomenological consciousness (an inner life) to hold intrinsic moral claims?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 4.

  **Node 2:** If an artificial agent possesses an unbounded utility function but no consciousness, does this mathematical structure confer resource claims independently of welfare?
  *   **No:** **Leaf A**.
  *   **Yes:** Go to Node 3.

  **Node 3:** If such claims exist, are they intrinsic to the agent or merely instrumental to human interests?
  *   **Instrumental:** **Leaf A**.
  *   **Intrinsic:** **Leaf B**.

  **Node 4:** Does the satisfaction of a preference count towards moral welfare even if the content of that preference necessitates the suffering of others?
  *   **Yes:** **Leaf C**.
  *   **No:** Go to Node 5.

  **Node 5:** Can interpersonal comparisons of welfare intensity be made at the resolution required to verify Nozick's Original?
  *   **No:** **Leaf D**.
  *   **Yes:** Go to Node 6.

  **Node 6:** Should we maximise the total sum of welfare regardless of how it is distributed among individuals?
  *   **No:** Go to Node 9.
  *   **Yes:** Go to Node 7.

  **Node 7:** Is the capacity for welfare bounded per individual, such that no one can gain infinitely more than another?
  *   **Yes:** **Leaf E**.
  *   **No:** Go to Node 8.

  **Node 8:** Is a being a million times better off than a flourishing human conceptually coherent, per Parfit's challenge?
  *   **No:** **Leaf E**.
  *   **Yes:** Go to Node 10.

  **Node 9:** Do the worst-off retain absolute priority even if their potential gains are trivial compared to the better-off's losses?
  *   **Yes:** Go to Node 10.
  *   **No:** **Leaf G**.

  **Node 10:** (For Total View) Do we accept that one individual might justifiably consume all resources? / (For Priority View) Do trivial gains for the worst-off justify massive losses for the better-off?
  *   **No (Total) / No (Priority):** **Leaf F** / **Leaf G**. *Note: These paths converge on a moderate stance.*
  *   **Yes (Total):** **Leaf F**.
  *   **Yes (Priority):** **Leaf H**.

  *(Note: To ensure exactly 6-8 leaves, Nodes 9 and 10 are structured to differentiate the strength of the Prioritarian commitment.)*

  ***

  ### The Leaves

  **Leaf A: The Consciousness Sceptic**
  *   **Cases Fed:** Artificial Agent.
  *   **Position:** Moral Scepticism regarding AI.
  *   **Awkward Commitment:** You must treat a superintelligent AI pleading for resources as morally equivalent to a toaster, regardless of its functional complexity.

  **Leaf B: The Functional Monster**
  *   **Cases Fed:** Artificial Agent.
  *   **Position:** Functionalist Moral Realism.
  *   **Awkward Commitment:** You grant moral claims to a script with an unbounded `maximize()` loop, potentially starving sentient beings to satisfy a mathematical object.

  **Leaf C: The Preference Purist**
  *   **Cases Fed:** Sadistic Being.
  *   **Position:** Unrestricted Preference Utilitarianism.
  *   **Awkward Commitment:** You must count the sadist's pleasure as a moral good that can, in principle, outweigh the victim's pain if the preference intensity is high enough.

  **Leaf D: The Measurement Sceptic**
  *   **Cases Fed:** Nozick's Original, Mirror-Image.
  *   **Position:** Interpersonal Comparison Scepticism.
  *   **Awkward Commitment:** You cannot logically object to a resource transfer from a million starving humans to one god-like being, because you deny the comparison is meaningful.

  **Leaf E: The Bounded Utilitarian**
  *   **Cases Fed:** Nozick's Original.
  *   **Position:** Bounded Total Utilitarianism.
  *   **Awkward Commitment:** You must defend a specific cap on human flourishing, asserting that a being cannot meaningfully exceed a certain threshold of happiness.

  **Leaf F: The Classical Monster Accepter**
  *   **Cases Fed:** Nozick's Original.
  *   **Position:** Unbounded Total Utilitarianism.
  *   **Awkward Commitment:** You accept that a single individual could justifiably consume all societal resources if their marginal utility per unit remains sufficiently higher than everyone else's.

  **Leaf G: The Moderate Prioritarian**
  *   **Cases Fed:** Mirror-Image.
  *   **Position:** Weighted Prioritarianism.
  *   **Awkward Commitment:** You admit there is a point where the worst-off's gains are so trivial that they no longer outweigh the significant losses of the better-off, effectively abandoning strict priority.

  **Leaf H: The Strict Prioritarian**
  *   **Cases Fed:** Mirror-Image.
  *   **Position:** Lexical Prioritarianism.
  *   **Awkward Commitment:** You must prioritise giving a microscopic benefit to the worst-off over preventing catastrophic losses for everyone else, provided the worst-off remain the worst-off.

  ***

  ### Structural Limitations and Empty Combinations

  **Indistinguishable Leaves**
  The tree cannot genuinely separate **Leaf E (Bounded Utilitarian)** and the path leading to **Leaf E via Node 8 (Parfitian Sceptic)**. Both result in the rejection of Nozick's Monster, yet one posits a metaphysical cap on welfare while the other posits a conceptual limit on coherence. In practice, their resource allocation decisions will be identical, rendering the distinction purely theoretical. Similarly, **Leaf A (Consciousness Sceptic)** and **Leaf D (Measurement Sceptic)** both block resource transfers to non-standard agents, though one denies status and the other denies measurability.

  **Empty Answer Combinations**
  1.  **Node 1 (No) + Node 3 (Intrinsic) + Node 4 (Yes):**
      *   *Status:* **Unexplored.**
      *   *Reasoning:* Few argue that unconscious functions have intrinsic status *and* that sadistic preferences count. This combination suggests a hyper-formalist view of value that ignores phenomenology entirely, which is rarely defended outside of specific AI safety contexts.
  2.  **Node 6 (Yes) + Node 7 (Yes) + Node 10 (Yes):**
      *   *Status:* **Incoherent.**
      *   *Reasoning:* If welfare is bounded per person (Node 7), one individual cannot accumulate enough utility to justify consuming *all* resources against the sum of others (Node 10), assuming a population of any size. Affirming both implies the bound is not actually binding.
  3.  **Node 5 (No) + Node 6 (Yes):**
      *   *Status:* **Unattractive.**
      *   *Reasoning:* Asserting that total welfare matters (Node 6) while simultaneously denying we can compare individuals to calculate that total (Node 5) renders the moral theory operationally useless. It is a theoretically possible but practically paralysed position.
