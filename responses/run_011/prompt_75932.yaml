  The specifications can be met jointly, and the work is done by the cross-cutting structure of the classes combined with the absence of a homogeneous narrowest class.

  **Scenario**
  A bank must decide whether to approve Loan L. The decision is rational if the probability of default is below 0.15, derived from a profit of $150k against a loss of $850k. Loan L belongs to three reference classes defined by ordinary properties: it is a Commercial Loan, it has a Low Credit Score (<600), and it is in Sector Z. Frequencies are known from large historical records, but data for the intersection of Low Score and Sector Z is unavailable (closed table). No class is homogeneous (frequencies are strictly between 0 and 1).

  | Reference Class | Sample Size | Default Frequency |
  | :--- | :--- | :--- |
  | 1. Commercial Loans | 10,000 | 0.10 |
  | 2. Low Score Loans | 2,000 | 0.25 |
  | 3. Sector Z Loans | 2,000 | 0.05 |

  **Demonstration**
  (i) **Reichenbach's Rule:** "Select the widest reference class containing the case for which reliable statistics are available." Class 1 (Commercial Loans) is wider than Class 2 or 3. The rule selects Class 1, issuing a probability of 0.10. Since 0.10 < 0.15, the decision is **Approve**. (Note: Standard formulations sometimes allow narrowing if the wider class is not 'homogeneous', but the prompt specifies the broadest-class gloss.)
  (ii) **Hempel-Salmon Rule:** "Select the narrowest reference class shown to be statistically relevant to the outcome." Class 2 and 3 are narrower than Class 1. Assuming Low Score is treated as the primary specificity marker due to higher deviation from the base rate, the rule selects Class 2, issuing a probability of 0.25. Since 0.25 > 0.15, the decision is **Reject**.

  **Diagnosis**
  The divergence is driven by the **absence of a homogeneous class** within a **closed table** of **cross-cutting properties**. You suspected the absence of homogeneity; I agree, but emphasize that this matters only because the table is closed. If a homogeneous class existed (e.g., "Low Score & Sector Z" had a stable frequency), Hempel's rule would terminate there, and Reichenbach's rule might arguably accept it as the "widest reliable" class if broader classes were deemed heterogeneous. If we remove this feature by adding data for the intersection (e.g., Low & Sector = 0.20), the divergence persists if Reichenbach insists on the widest class (0.10) while Hempel insists on the narrowest (0.20). The objection that this is merely an artifact of data running out fails: even with infinite data, if no class is truly homogeneous (properties are always further refinable), the rules never converge. The problem is structural, not empirical.

  **Opposition**
  A subjectivist argues: "Single-case probability is just degree of belief conditional on total evidence $E$. $E$ includes 'Low Score' AND 'Sector Z'. We assign $P(\text{Default} | E)$ directly, bypassing class selection." This response is strong because it dissolves the choice between classes into a single coherent credence function. However, it merely relocates the problem: how does the agent construct $P(\cdot | E)$ from the frequency table? If they weight the frequencies, they are secretly solving the reference class problem via weighting (foreclosed). If they pick one frequency as the likelihood, they have reintroduced the selection rule. Without a causal model to justify how the properties combine, the subjective agent faces the same underdetermination as the frequentist, hidden within the prior.
