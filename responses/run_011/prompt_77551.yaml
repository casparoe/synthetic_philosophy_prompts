  The Verified Grid

  The grid is done and shifts align.

  With four names set, it takes an hour.
  To fit the days till week is done.

  She will not work the night shift now.
  And Mark and Jane must not share shifts.
  One claimed the weekend off in March.
  And rest is owed between the days.

  I move the blocks upon the page.
  A blue slot here needs green slot there.
  If David takes the Friday night.
  Then Monday lacks a trained hand there.
  The pencil wears beneath my thumb.
  I rub the paper thin, start new.
  Each choice branches to two more paths.
  Until the options fill the room.

  At one the cup begins to freeze.
  And counting staff required on ward.
  Seeing too many ways to fail.
  Though only one way fits the rules.
  Trying to find the path through noise.
  Where constraints bind like wire on wrist.
  Not knowing if I am too slow.
  Or if the world is built to hide.
  Wishing a smarter hand could see.
  That cuts the knot so easily.
  Still here I sit and move names round.
  Until the sun begins to gray.
  Ready to swear what I hold true.
  Since I have found no better way.
  Than working till the page admits
  The grid is done and shifts align.
