  **CONTINENTAL RESOURCES GROUP**
  **FORM GHC-04: GIFTS, HOSPITALITY & CONFLICTS DECLARATION**
  **Version 4.1 | Effective Date: 01/04/2023**

  **1. PURPOSE**
  This form ensures adherence to the Global Anti-Corruption Standard. This standard applies universally, irrespective of local custom. Corruption is defined as the abuse of entrusted power for private gain. All employees must distinguish between legitimate relationship-building and undue influence. The following declaration renders these distinctions operable.

  **2. DECLARATION OF GIFTS AND HOSPITALITY**
  Please tick the appropriate box for any gift or hospitality offered or received in the reporting period.

  [ ] None to declare.
  [ ] Gift/Hospitality Declared (Attach original receipts).

  **2.1 Value Thresholds**
  *De minimis* threshold: €15.00 (approx. 180,000 Local Currency Units).
  [ ] Value below threshold.
  [ ] Value above threshold (Requires Senior Compliance Officer approval).

  **2.2 Timing of Offer**
  [ ] Pre-Decision (Prior to regulatory approval/contract award).
  [ ] Contemporaneous (During site visit/audit).
  [ ] Post-Decision (Following contract execution/approval).

  **2.3 Transparency Metrics**
  [ ] Meeting minuted in official log.
  [ ] Third-party witness present.
  [ ] Expense claim filed within 14 days.
  [ ] No record created (Informal).

  **3. CONFLICTS OF INTEREST: RECRUITMENT**
  **3.1** Do any candidates share a surname, village of origin, or tribal affiliation with existing staff?
  [ ] Yes [ ] No
  **3.2** Was selection based solely on blind CV scoring?
  [ ] Yes [ ] No

  **4. GUIDANCE NOTES**

  **4.1 The Moral Species of Timing**
  The value of an object is static; its ethical classification is temporal. A bottle of whisky offered before a permit is granted constitutes an Inducement. The identical bottle offered after the permit is granted constitutes Gratitude. Inducements are prohibited. Gratitude is permissible provided it is declared. Employees must ensure the date of transfer aligns with the desired classification. If a gift is offered pre-decision, request the donor wait until post-decision to alter its moral species.

  **4.2 Bookkeeping vs. Intent**
  Compliance is verified through documentation, not subjective intent. An undocumented gift of nominal value is a Level 2 Breach of Procedure. A documented gift of significant value is a Recordable Transaction. If the exchange is minuted and witnessed, the risk of corruption is mitigated regardless of the sum involved. Employees are reminded that an unrecorded kindness appears indistinguishable from a bribe. A well-documented offence is clean; an undocumented kindness is a breach.

  **4.3 Customary Hospitality and Reciprocation**
  While the Group maintains a zero-tolerance policy on bribery, Section 12(b) allows for Customary Hospitality essential to local licence-to-operate. This includes ceremonial meals and wedding invitations. Such events exceed the €15.00 threshold but are exempt if logged under 'Community Relations'. Employees must recognise the local obligation to give, receive, and reciprocate. Refusing a gift is an affront. Therefore, if hospitality must be refused to remain compliant, the refusal must be logged as a Cultural Friction Incident (Form CFI-09). This ensures the affront is tracked and managed by HR. Do not refuse silently. Furthermore, failure to invite a host to a future event may be construed as a slight. Employees should declare intended reciprocation in advance to avoid accusations of ingratitude.

  **4.4 Merit-Based Recruitment**
  To prevent nepotism, hires must not rely on kinship networks. Employing cousins or clients undermines the impersonal nature of the office. If a candidate is recommended by a local elder, this recommendation must be disregarded during scoring. The integrity of the workforce depends on severing local ties. Note: Implementing this clause strictly may vacancy key liaison roles and dissolve the patronage networks on which informal operations depend. Proceed regardless. The private cannot be prised loose from the claims of one's household, but the Form requires you to attempt it.

  **5. ATTESTATION**
  I certify that the information provided is accurate. I understand that failure to declare a Cultural Friction Incident or a Post-Decision Gift may result in disciplinary action. I attest that I have separated my private obligations from my professional duties.

  Signature: ___________________
  Date: ___________________
  Name: ___________________
  Role: ___________________

