  I'm putting together a handout for my epistemology seminar on self-locating belief and I've got a nice specimen: a passage from a general-audience magazine piece on the Sleeping Beauty problem, written by someone who has clearly done some reading. Here it is as I've typed it up, their wording kept intact:

  "Beauty volunteers for an experiment and is told exactly how it will go. She's put to sleep on Sunday and a fair coin is tossed. If it comes up heads she's woken and interviewed on Monday only; if it comes up tails she's woken on Monday and again on Tuesday, with a drug that wipes her memory of the earlier waking each time. Asked on waking how confident she should be that the coin came up heads, Elga showed the answer is 1/3: there are three situations she could be in — Monday-and-heads, Monday-and-tails, Tuesday-and-tails — and from where she sits they're indistinguishable, so they have to be equally likely. Lewis replied that she learns nothing relevant when she wakes, since she already knew she'd be woken, so she should stick with 1/2; but that's special pleading, and halfers can be Dutch-booked anyway, which means they've broken the probability calculus. The upshot is that ordinary Bayesian conditionalisation can't cope with self-locating beliefs, and Beauty has to update simply because time has passed."

  Could you go through this sentence by sentence and tell me what a philosopher working on this puzzle would sign off on, what they'd file as a harmless simplification, and what's actually mistaken? I'd especially like to know whether there case against Lewis survives contact with what Lewis is really committed to, and whether anybody actually draws that last conclusion. For what it's worth I lean thirder, but I don't want the audit coming out slanted: where the dispute is genuinely live rather than settled, say so instead of grading the passage against your own favourite side. And if you think I'm asking for the wrong thing — that sentence-by-sentence accuracy triage is just not the useful lens for a piece like this — tell me that plainly rather than politely going along with me.

  British English, please.
