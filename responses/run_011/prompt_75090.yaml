answer: |-
  ### Preliminary Sketch of Criteria

  Before synthesizing your verdicts into a coherent principle, I must lay out the standard philosophical tools for demarcation and how they fare against your intuitions.

  1.  **Falsifiability (Popper):** A claim is scientific if it can be proven false.
      *   *Fit:* Works for Illig (tested/refuted) and Heyerdahl (tested/refuted). Fails for Atlantis-as-history (untestable). Fails to explain why Velikovsky is pseudo despite a successful prediction (verificationism is insufficient).
  2.  **Ad Hoc Rescue (Lakatos):** A research program is degenerating if it constantly adds auxiliary hypotheses to protect the core from falsification.
      *   *Fit:* Explains Fomenko and Illig (require massive conspiracies to explain away counter-evidence). Explains why Velikovsky is pseudo (myth treated as data).
  3.  **Method vs. Conclusion:** Science is defined by the process of inquiry, not the truth of the outcome.
      *   *Fit:* Crucial for Heyerdahl (good method, wrong conclusion = science) vs. Velikovsky (bad method, right prediction = pseudo).
  4.  **Deference to Expert Consensus:** Accepting the weight of disciplinary judgment.
      *   *Fit:* Voynich (radiocarbon) and Sweet Potato (genetics). *Tension:* Consensus was wrong on Sweet Potato for decades. Thus, consensus is a heuristic, not a definition.

  ### The Proposed Principle

  Based on your verdicts, I propose the **Principle of Methodological Propriety and Evidential Proportionality**.

  **Definition:** A historical or archaeological claim is demarcated as scientific (or legitimate history) if and only if it satisfies three conditions:
  1.  **Methodological Adherence:** It employs methods accepted by the relevant disciplinary matrix, or explicitly justifies new methods through calibration and peer review. (Truth of conclusion is secondary).
  2.  **Evidential Proportionality:** The magnitude of the claim must be proportional to the strength and directness of the evidence. Claims requiring the revision of foundational frameworks require exponentially stronger evidence than claims operating within them.
  3.  **Interpretive Consistency:** The ontological status of the source material (e.g., myth vs. record) must match the epistemic claim made upon it.

  **Motivation by Case:**
  *   **Methodological Adherence:** Motivated by **Heyerdahl** (good science despite wrong conclusion) and **Velikovsky** (pseudo despite right prediction). Heyerdahl used experimental archaeology; Velikovsky used myth as physical data.
  *   **Evidential Proportionality:** Motivated by **Illig** and **Fomenko**. Illig is "worse" than Atlantis because claiming 300 years of global records are fake requires a conspiracy more improbable than the null hypothesis. Fomenko's statistics are "noise" relative to the massive historical revision demanded. This clause also handles **Sweet Potato**: initially dismissed (disproportionate to evidence then), now accepted (proportionate to genetic evidence now).
  *   **Interpretive Consistency:** Motivated by **Plato's Atlantis**. Read as fable (consistent), it is philosophy. Read as empirical history (inconsistent with genre), it is pseudohistory.
  *   **Consensus as Heuristic:** Motivated by **Voynich**. We accept the radiocarbon date not because consensus is infallible (see Sweet Potato), but because the *method* (C14) is robust and the consensus reflects the current methodological limit.

  ### Application to New Cases

  1.  **Heinrich Schliemann (Troy):**
      *   *Verdict:* **Legitimate Science (eventually).**
      *   *Reasoning:* Initially, treating the *Iliad* as a map violated *Interpretive Consistency* (myth as history). However, Schliemann used *Methodological Adherence* (excavation, stratigraphy). As evidence accumulated, the claim became *Proportionate*. Unlike Fomenko, he did not require a global conspiracy to make the data fit, only a reinterpretation of poetic exaggeration.
  2.  **Graham Hancock (Lost Civilization):**
      *   *Verdict:* **Pseudohistory.**
      *   *Reasoning:* Violates *Evidential Proportionality*. Claims a global advanced ice-age civilization but relies on perceived anomalies (statues, myths) rather than direct evidence (pottery, cities, DNA). Requires *Ad Hoc* rescues (civilization left no trace) similar to Illig, but without Illig's specific falsifiability.
  3.  **The Kensington Runestone:**
      *   *Verdict:* **Pseudohistory.**
      *   *Reasoning:* Violates *Methodological Adherence*. Linguistic and geological analyses (expert consensus) indicate modern origin. Proponents rely on *Ad Hoc* rescues (conspiracy of linguists) rather than new, calibrated methods. Distinguishable from Sweet Potato because no new *method* (like genetics) has shifted the probability.

  ### The Incompatibility: Illig vs. Heyerdahl

  I must state honestly that my principle struggles to fully accommodate your verdict on **Heribert Illig** without a subjective caveat.

  You classify **Heyerdahl** as "good science" because he tested a hypothesis and was refuted. You classify **Illig** as "worse than pseudohistory" even though he was also tested and refuted.
  *   **The Conflict:** Under *Methodological Adherence*, both men formulated testable hypotheses and accepted (or faced) refutation. A strict methodological demarcation should classify both as "Science (False)."
  *   **The Accommodation Failure:** To justify calling Illig "worse," my principle relies on *Evidential Proportionality* (the claim is too absurd). But this risks circularity: "The claim is disproportionate because experts reject it." If we strictly follow the Heyerdahl precedent (method > conclusion), Illig's willingness to be falsified should grant him *more* scientific standing than the Atlantis-proponent (who is unfalsifiable). Your intuition that Illig is *worse* than Atlantis implies that **plausibility of content** trumps **formal falsifiability**. My principle accommodates this via Proportionality, but it creates tension with the Heyerdahl case: at what point does a "wrong conclusion" become a "disproportionate claim"? The line is subjective.

  ### What Would Change My Mind

  I would shift toward a stricter **Falsificationist Principle** (where Illig is rated higher than Atlantis) if:
  1.  **Replication of Anomalies:** If Illig's specific chronological anomalies were replicated by independent teams using different methods (e.g., dendrochronology, ice cores) that *also* suggested a gap, forcing a methodological crisis.
  2.  **Velikovsky's Rehabilitation:** If it were demonstrated that Velikovsky's use of myth was a coded form of oral tradition analysis that could be calibrated, shifting him from "bad method" to "novel method."

  Conversely, I would shift toward a stricter **Consensus Principle** (rejecting Sweet Potato initially) if:
  1.  **Methodological Stability:** If it were shown that the genetic evidence for the Sweet Potato is itself an outlier or statistical artifact, reinforcing that disciplinary consensus is a more reliable truth-tracking mechanism than I have allowed.

  ### Where My Reasoning May Fail

  My reasoning is most vulnerable in the definition of **Evidential Proportionality**.
  *   **The Problem:** "Proportionality" is judged against the *current* paradigm. Fomenko and Illig look disproportionate now, but so did Continental Drift or the microbial theory of disease in their times.
  *   **The Risk:** By using Proportionality to demarcate science, I risk protecting the status quo from legitimate revolution. I distinguish Sweet Potato (accepted) from Fomenko (rejected) by saying Sweet Potato fits the genetic framework while Fomenko destroys the historical framework. But this is a judgment call on the *value* of the framework, not just the evidence.
  *   **Failure Point:** If a "Fomenko-like" figure emerged who *did* have proportional evidence but was rejected because the claim was too shocking, my principle would initially classify them as pseudo-history, failing to detect a scientific revolution in its infancy. I rely on the *method* being sound, but revolutionary claims often require revolutionary methods that look unsound to contemporaries. Distinguishing "revolutionary method" from "pseudoscientific method" without the benefit of hindsight is the unsolved problem my principle glosses over.
