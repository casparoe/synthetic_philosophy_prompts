      *   **Conflict:** Curator wants funding for dramatic narrative ("complexity stopped paying for itself" is too boring). Two objectors: (1) Rapa Nui science is outdated (rats + colonial violence, not just ecocide); (2) Frame is dishonest (Maya didn't vanish, Bronze Age collapse was elite-focused not universal).
      *   **Requirements:**
          *   Open with 2-3 sentences diagnosing the core disagreement (because half the committee can't say).
          *   Recommendation: Fund as proposed, fund with conditions, or decline. (Implied choice: Fund with conditions is usually the most nuanced/expert path here).
          *   If conditions: Make them concrete (new throughline, specific panel label dos/don'ts for each gallery).
          *   Be fair to the curator (strongest case for dramatic arc).
          *   No citations/reading list.
          *   Focus on reasoning.
          *   Length: Around 700 words.

  2.  **Diagnose the Disagreement (Opening):**
      *   What is the *actual* fight? It's not just facts vs. fiction. It's about the purpose of public history. Is it to warn (moralizing narrative) or to explain (nuanced complexity)? It's a tension between pedagogical engagement (needs a story) and historical accuracy (needs nuance).
      *   *Drafting thought:* The committee is stalled because we are conflating empirical accuracy with narrative utility. We are arguing over whether a moral warning justifies simplifying complex historical processes into a cautionary tale.

  3.  **Determine the Recommendation:**
      *   "Fund as proposed" ignores valid scholarly critiques (risk of reputational damage, spreading debunked ideas).
      *   "Decline" ignores the curator's valid point about engagement (dry history doesn't draw crowds).
      *   "Fund with conditions" is the expert policy move. It allows the show to happen but mitigates the harm of outdated/deterministic narratives.
      *   *Decision:* Fund with conditions.

  4.  **Develop the Conditions (Concrete):**
      *   *Throughline:* Shift from "Suicide" to "Transformation under Stress." Instead of "They chose to fail," use "Systems reached breaking points."
