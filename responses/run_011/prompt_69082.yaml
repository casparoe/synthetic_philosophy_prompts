          3.  **Recurrent Loop (The Missing Piece):** Normally, GW sends signals *back* to Sensory Encoder to refine the signal. In this artifact, this cable is cut or gated shut.

  6.  **Developing the GWT Attack:**

      *   GWT proponents (like Dehaene) often argue that if you can report it, the workspace is active, and *that is* what consciousness is. They might reject the RPT premise that recurrence is necessary.
      *   The attack: "You are defining phenomenality as a magical extra ingredient. If the system functions identically to a conscious being in all measurable ways (including self-report), positing an invisible 'lack of experience' is unscientific dualism."

  7.  **Developing the Instrumentation:**

