  5.  **Refining the Architecture (The "Load-Bearing Feature"):**

      *   I need to ensure the "Sincere Report" doesn't cheat. How does the system know to say "I am experiencing"?
      *   *Solution:* The system is trained (or programmed) with a model of itself. It knows that when the Global Workspace contains high-confidence sensory data, the appropriate label is "Experience." It's a learned association, not a direct readout of qualia.
      *   *Architecture:*
          1.  **Sensory Encoder:** Feedforward only (no internal loops).
          2.  **Global Workspace (GW):** Receives Encoder output. Broadcasts to:
