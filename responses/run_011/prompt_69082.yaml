      *   *Global Workspace Theory (GWT):* Consciousness = Global Availability. If information is broadcast to multiple subsystems (memory, motor, language, reasoning), it is conscious. Access = Phenomenality here.
      *   *Recurrent Processing Theory (RPT) / Localist views:* Consciousness = Specific kind of local processing (feedback loops within sensory areas). You can have global access without this local recurrence (e.g., feedforward sweep).
      *   *The Trick:* I need a system that broadcasts globally (satisfying GWT/Access) but lacks the specific local recurrence required by RPT (satisfying the "no phenomenality" condition for that theory).
      *   *The "Sincere Report" Problem:* If the system says "I see red," isn't that evidence of experience? Not for a functionalist. It's just a output token generated by the reasoning module based on the global data. The prompt explicitly asks for this: "sincerely and confidently says... that it is having an experience." This means the *belief* module must output "I am experiencing" based on the available data, even if the *qualia* generator (per RPT) is offline.

  3.  **Drafting the Scenario (Architectural Design):**

      *   *Input:* Visual sensor array.
      *   *Processing:* Deep feedforward network (ConvNet style).
      *   *The Critical Split:*
