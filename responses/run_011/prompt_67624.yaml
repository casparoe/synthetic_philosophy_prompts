answer: |-
  You have put your finger on something real and deeply frustrating, and you are right to feel that the standard labels do not quite stick. What you are describing is a specific flavor of motivated reasoning that operates at the level of methodology rather than evidence selection, and while psychologists call the broader engine motivated skepticism, there is not a single canonical term in historiography or statistics that captures the precise asymmetry you are seeing. In the philosophy of science, this brushes against what Karl Popper called a conventionalist stratagem, where a theorist protects a core hypothesis by adjusting auxiliary assumptions, but even that implies adding complexity to the theory rather than selectively qualifying the data. Since no established term perfectly carves out this specific maneuver of applying rigorous data criticism only when the data disagrees, I think the most precise label we can coin for it is asymmetric measurement skepticism. This distinguishes it from general confirmation bias because it is not about ignoring data, but about subjecting data to unequal standards of validity depending on the direction of the result.

  The reason this feels different from standard confirmation bias is that you are correct that the individual claims are often methodologically sound. Record keeping did improve over the nineteenth century. Definitions of homicide did change. Women did become more willing to report domestic violence. These are true facts. The fault lies not in the premise but in the conditional application of the premise. Legitimate measurement criticism requires independent evidence that the measurement process changed, regardless of what the data says. For example, if a state passed a law in 1890 requiring coroners to classify all suspicious deaths as homicides rather than accidents, you are justified in adjusting the data around that year whether the numbers go up or down. The abuse occurs when the claim of measurement error is invoked solely because the trend line moves in the wrong direction. The boundary between legitimate and abusive use sits on the existence of external evidence for the measurement change. If the author can point to a change in law, a change in administrative procedure, or a sociological shift in reporting behavior that is documented independently of the crime statistics themselves, the move is valid. If the only evidence for the measurement error is the deviation of the data from the expected theory, the move is abusive.

  To test this in a paragraph, you can apply what I would call the symmetry test. You simply ask whether the author would make the same measurement critique if the data point supported their thesis. If the homicide rate drops in 1890 and the author says this proves moral progress, but the homicide rate drops in 1900 and the author says this proves underreporting, they are failing the symmetry test. This is where the property of the subject matter becomes crucial. In hard sciences, you can often rerun the experiment. In historical violence, the true rate is a latent variable that is never directly observed. We only ever see the record. This makes the artifact move non-optional to some degree; you cannot write this history without accounting for record keeping. However, the unknowability of the true past rate creates a shelter where asymmetric skepticism can hide indefinitely. Because we cannot go back and count the bodies, the claim that the records are wrong is never definitively falsifiable in the moment, which tempts scholars into using it as a universal solvent for inconvenient data.

  When you see a whole field doing this in opposite directions, as you noticed in the violence debate, it indicates a state of epistemic polarization where the methodology itself has become weaponized. It is no longer about finding the truth but about defending a tribe. One side treats the records as a floor that can only go up due to better counting, while the other treats them as a ceiling that can only go down due to suppression. This creates a stalemate where no evidence can ever count against either theory. A legitimate use of this move looks like the work of historical criminologists who adjust homicide rates based on known changes in coroner laws, applying those adjustments consistently across all decades regardless of whether the adjustment makes the trend look better or worse for their hypothesis. A boundary case that looks like it but is not would be an author who notes a spike in violence during a war and attributes it to social breakdown, while noting a spike in violence during peace and attributing it to better record keeping. Both claims might be plausible, but if the method of attribution depends entirely on whether the spike helps the argument about civilizing processes, it is asymmetric measurement skepticism.

  For your novel, this matters because it tells you that the ambiguity you are feeling is not a failure of your research but a feature of the historical record. The people in your 1880s setting did not experience statistics; they experienced risk. Whether a beating was logged as a crime or a private matter mattered less to the victim than whether the community tolerated it. The scholars arguing over the numbers are trying to solve a puzzle with missing pieces, and when you cannot see the whole picture, it is very tempting to assume the missing pieces match the shape you want them to. You can trust your instinct that both sides are doing this. It does not mean the violence decline theory is wrong, nor that it is right, but it does mean you should treat any definitive claim about the frequency of violence with the same skepticism you apply to the claims about the frequency of silence. Write the ambiguity. The uncertainty is the most honest thing you have found.
