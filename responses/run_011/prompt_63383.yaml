prompt: |-
  So I'm a fourth year in a history program (science & tech studies adjacent, mostly I do early 20th c. German foreign policy) and in three weeks I'm presenting a chapter of my dissertation at a workshop that's co-run by our history department and the political theory group down the hall. Twenty minutes plus discussion. The room is going to be about two-thirds modern European diplomatic historians — including one guy whose whole career is the July Crisis and who has opinions about Bethmann Hollweg he'll share at length — plus three political philosophers who work on collective responsibility and reparations for historical injustice, and a couple of IR people who mostly care about how any of this bears on present-day claims. Nobody in the room is a philosopher of language, which matters, because my argument is basically a distinctions argument.

  The thesis: the Fischer controversy never got resolved and I don't think it can be, because "responsibility" is doing at least three different jobs in it and the two sides have been answering different questions with the same word the entire time. My version of the argument, rough:

  - There's causal contribution (what your choices made more likely), culpability (the moral-blame notion, needs something like a guilty mind), and liability (who owes what, which can get assigned by contract or treaty to parties nobody thinks is blameworthy at all). These three come apart cleanly in 1914-1919. The Weimar government accepted the reparations article under formal protest while every German party denied the blame reading of it; the Belgrade officers behind the assassination were culpable in a way that generates no liability for Serbia at all. So you get a little matrix of dissociations, and my claim is that the whole war-guilt literature is an argument about which cell of that matrix is supposed to be load-bearing.
  - Article 231 was drafted as a liability instrument — it's the opening article of the reparations section and its job was to cap and ground the bill, not to render a moral verdict. The verdict reading is a Weimar-era political artifact that then got baked into the research program, and Fischer inherited the framing from the people he was arguing against.
  - Fischer's actual evidence — the Septemberprogramm, drafted by Riezler in September 1914 after the early victories — supports a claim about wartime expansionism and about a disposition of the decision-making system. It doesn't support the premeditation claim he was read as making, and the standard critic's move, that you can't run the inference backward from September to July, is correct but doesn't touch the dispositional claim. Both sides think they're contradicting each other. Mostly they aren't.
  - Constructive upshot: state-level attributions of responsibility for a war should be read as liability claims with a dispositional backstop, not culpability claims. So "who was to blame for 1914" is malformed while "who owed what in 1919" is well-formed and has a defensible answer.

  What I need from you is the prep sheet, not a defense of any of this. Give me the eightish objections I'll actually get from this particular room, ordered by how much damage each would do to the chapter if it landed. Phrase each one the way that sub-audience would phrase it — the July Crisis guy will not say "you're equivocating on responsibility," he'll say something about archives and about categories not surviving contact with the documents; the political philosophers will go at whether the whole thing is just ordinary-language deflationism dressed as history, and whether I've smuggled in methodological individualism; the IR people will want to know what my framework does to apology and restitution claims today. For each: a two-minute reply, what I should concede in the first sentence of the reply, and a blunt note on where the reply is softest. Flag separately the one or two objections that are actually right and that I should build into the talk rather than defend against. And tell me what I'm praying nobody asks — I already suspect it's the charge that if culpability doesn't attach to states then my view is functionally exculpatory, i.e. revisionism in analytic drag. If you think there's a worse version of that question, give me that instead.

  Don't send me a reading list or citations, I'll handle the footnotes myself and I know the literature. I do want you to be willing to tell me when a distinction I'm drawing isn't doing the work I think it is.
