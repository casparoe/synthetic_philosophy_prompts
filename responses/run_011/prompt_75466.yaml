  2. Strict material continuity is positively ruled out by the ferry decision, whereas pure functionalism is ruled out by the house decision since utility persists across relocation. Pure aesthetic formalism is merely declined rather than ruled out, as it is compatible with the votes but insufficient to explain the location constraint without invoking historical narrative.

  3. The pairing is reconcilable if location is treated as a constitutive element of the historical narrative for real property, whereas materials are merely evidentiary supports for craftsmanship that can be renewed without breaking the narrative chain. Thus, the vessel retains its story through maintained workmanship, while the house loses its story through severed spatial context.

  4. The practice strictly presupposes that regulatory significance overrides metaphysical substance, whereas specific theories like four-dimensionalism merely fit comfortably without being required by the voting record. Multiple incompatible metaphysical views can license the same votes provided they accept the primacy of the seven headings over physical persistence.

  5. Adopting strict matter-continuity would require decertifying the ferry due to timber replacement and permitting the house's relocation provided its original stones remained intact and unmixed. This would invert your current outcomes by prioritizing the persistence of original atoms over the persistence of maintained historical narratives.
