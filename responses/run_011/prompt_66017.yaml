  ## Part IV: Indistinguishable Pairs & Limitations

  **1. Moderate Particularist vs. Heuristic Generalist**
  *   **Status:** **Indistinguishable by this instrument.**
  *   **Diagnosis:** Both positions occupy cell **(Yes, No, Yes, No)** or hover near **(Yes, No, No, No)**. The Moderate Particularist believes rules are summaries of past cases (no independent truth); the Heuristic Generalist believes rules are true but defeasible. Both will answer "Use rules as guides but expect exceptions" on Q2, Q3, and Q10.
  *   **Reason:** This distinction is *metaphysical* (do rules have truth conditions?), not *phenomenological* (how do you act?). A case-based quiz tests practice, not ontology. To separate them, you would need a question asking: "Is a rule that has an exception *false*, or merely *incomplete*?" which violates the 'no thesis endorsement' constraint.

  **2. Shapelessness and the Fifth Switch**
  *   **Status:** **Collapses into Switch (b).**
  *   **Diagnosis:** Shapelessness (the claim that moral properties do not supervene on a *projectible* set of non-moral properties) is the metaphysical underpinning of the failure of Entailment (Switch b). If a respondent answers "No" to Switch (b) (no finite set entails the verdict), they are functionally committed to shapelessness for the purposes of clinical reasoning.
  *   **Advice:** Do not add a fifth switch. A question probing shapelessness would require asking about "non-moral similarity spaces," violating the no-jargon constraint. Furthermore, a clinician who denies codifiability (b) will necessarily treat cases as unique (shapeless), making the fifth switch redundant in a diagnostic context.

  **3. The Wedge Case (Q5)**
  *   **Success:** Q5 successfully separates Switch (c) and Switch (d).
  *   **Mechanism:** Option C (Competent but must explain) accepts (d) [Justification requires rules] while rejecting (c) [Deliberation does not require rules]. This isolates the *Publicity* constraint from the *Psychological* constraint, allowing you to identify students who view ethics as primarily a social accountability mechanism rather than a cognitive tool.

  **4. Unreliable Separations**
  *   **Pair:** **Intuitionist Generalism (No, Yes, No, Yes)** vs. **Moderate Particularism (Yes, No, No, Yes).**
  *   **Reason:** Both claim one can act without conscious rules but must justify with them. The difference lies in whether valence switches (a) and whether rules entail (b). In concrete cases (Q1, Q10), respondents often conflate "I can't state the rule" with "The rule doesn't exist."
  *   **Further Case Needed:** A "Negative Intuition" case. Present a case where a standard rule (e.g., "Do not lie") is followed, but the outcome is disastrous *despite* no apparent contextual difference. Ask: "Was the agent wrong?"
      *   Generalist: No (rule was followed).
      *   Particularist: Yes (outcome reveals moral error).
      *   *Note:* This risks violating the "no thesis" constraint if not phrased as a judgment of the agent.

  ***

  ## Closing Note on Shapelessness

  Regarding your suspicion about shapelessness: it is **not genuinely independent** of switches (a) and (b) for the purposes of this instrument. Shapelessness is the claim that there is no interesting non-moral similarity between all right actions. If switch (b) is "No" (no finite set of generalizations entails the verdict), this is usually *because* the respondent believes the relevant non-moral features are shapeless (i.e., they cannot be captured in a finite code). If switch (a) is "Yes" (valence switching), this implies that no single non-moral feature reliably tracks moral status, which is a local version of shapelessness. To treat shapelessness as a fifth switch would require asking respondents about the *structure of property spaces* rather than their *judgments of cases*, which would violate your constraint against technical vocabulary and thesis endorsement. Stick to the four switches; shapelessness is the metaphysical shadow cast by a "No" on (b).
