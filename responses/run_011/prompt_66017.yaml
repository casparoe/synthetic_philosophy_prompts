answer: |-
  # Diagnostic Instrument: Moral Reasoning in Clinical Contexts

  ## Part I: The Ten Cases

  **Instructions:** Read each scenario and select the response that best matches what you would actually do, say, or judge. There are no right or wrong answers. Answer based on your immediate professional and personal reflection.

  **1. The Comforting Ambiguity**
  A patient with a poor prognosis asks you directly, "Will this treatment cure me?" You know the statistical likelihood of cure is low, but you also know that maintaining hope can improve immune response and quality of life.
  *   **A.** I would tell them the statistical truth; honesty is always required regardless of the outcome.
  *   **B.** I would tailor the truth based on the patient's psychological state; honesty is good here but might be harmful in other contexts without changing the definition of honesty.
  *   **C.** I would follow the hospital's communication protocol, which dictates exactly how much information to disclose based on the diagnosis stage.

  **2. The Perfect Manual**
  Imagine a team of experts spends ten years writing a manual of ethical rules for your department. It is infinitely detailed.
  *   **A.** In principle, if the manual were detailed enough, it could tell you the right action for every possible future case.
  *   **B.** No matter how detailed the manual, there will always be new cases where the rules run out or conflict.
  *   **C.** The manual would be useful, but only as a rough guide that experienced staff should ignore when necessary.

  **3. The Emergency Decision**
  You are in a high-stress emergency situation with seconds to decide. How does the right choice come to you?
  *   **A.** I mentally run through a checklist of duties or rules to ensure I haven't missed an obligation.
  *   **B.** I perceive what the situation requires directly, like recognizing a face, without consciously consulting rules.
  *   **C.** I rely on a mix, but if I couldn't recite the rule I'm following, I wouldn't trust my decision.

  **4. The Family Conference**
  You have made a difficult decision to withdraw life support. The family demands to know *why* this is the right choice.
  *   **A.** I must be able to cite a specific policy or ethical rule that justifies this decision to them.
  *   **B.** I can explain the specific features of this case that make it right, even if I cannot cite a general rule that covers all similar cases.
  *   **C.** I would refer them to the ethics committee, as my personal judgment is not sufficient justification.

  **5. The Silent Expert and The Articulate Novice (Original Case)**
  Consider two clinicians. **Clinician X** consistently makes excellent allocation decisions for scarce drugs but cannot explain *why* they chose one patient over another beyond "it felt right." **Clinician Y** can recite the allocation policy flawlessly and explain the theory perfectly but consistently makes poor allocation decisions that harm patients.
  *   **A.** Clinician X is the better ethical agent; action matters more than explanation.
  *   **B.** Clinician Y is preferable; without an explainable rule, Clinician X is just guessing and cannot be trusted.
  *   **C.** Clinician X is better, but they are not fully justified until they learn to articulate a rule others can use.

  **6. The Painful Therapy (Original Case)**
  Physical therapy causes pain. In Context 1 (rehabilitation), causing pain is helpful. In Context 2 (torture), causing pain is harmful. There is no other physical difference in the act of applying pressure.
  *   **A.** The pain itself is always a negative factor; in rehab, it is outweighed by the benefit of healing.
  *   **B.** The pain counts *in favor* of the act in rehab (as a sign of progress) and *against* it in torture; the valence of the pain itself changes.
  *   **C.** We need a higher rule, like "promote health," to determine if the pain is good or bad; pain itself is neutral.

  **7. The Algorithmic Judge (Original Case)**
  We develop an AI trained on every past ethical committee decision. We feed it the non-moral facts of a new case.
  *   **A.** If the AI is sophisticated enough, it could output the correct moral verdict with 100% reliability.
  *   **B.** The AI might be helpful, but it cannot logically entail the verdict because moral truth isn't that kind of calculation.
  *   **C.** The AI could do it, but we wouldn't accept the verdict unless a human could explain the rule the AI used.

  **8. The Second-Guessing Resident**
  A resident performs a procedure perfectly but later worries they did the wrong thing because they cannot remember which specific guideline they followed at the time.
  *   **A.** They should not worry; if the action was right, the reasoning process is secondary.
  *   **B.** They should worry; right action requires conscious adherence to a standard during the act.
  *   **C.** They should worry only if they cannot reconstruct a rule that *would* have justified it, even if they didn't think of it then.

  **9. The Peer Review (Original Case)**
  You are reviewing a colleague's controversial case. They argue their decision was correct but admit it violates the standard guidelines and they cannot propose a new general rule to replace the old one.
  *   **A.** I cannot accept their justification; if they cannot state a rule for us to follow, they have not justified it to the community.
  *   **B.** I can accept their justification if the specific details of the case convince me, even without a new general rule.
  *   **C.** I would accept it only if a senior administrator ratifies it, effectively making their exception the new rule.

  **10. The Resource Exception (Original Case)**
  A standard rule says "Treat the sickest first." In Case A, this saves the most lives. In Case B, treating the sickest first causes a backlog that kills more people, yet the medical facts about the patients are identical to Case A; only the hospital capacity differs.
  *   **A.** The rule "Treat the sickest first" is false; the real rule is "Treat to maximize survival," which covers both cases.
  *   **B.** The consideration "they are sickest" counts *for* treatment in Case A and *against* it in Case B, without needing a new overarching rule to explain the switch.
  *   **C.** The rule is true, but in Case B, a more important rule overrides it.

  ***

  ## Part II: Scoring Key

  ### 1. Mapping Options to Switches
  Each question probes one or two of the four switches. Assign points as follows:
  *   **Generalist Lean (+1)**
  *   **Particularist Lean (-1)**

  | Question | Switch Probed | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- | :--- |
  | **Q1** | **(a) Valence** | +1 (Invariant) | -1 (Holism) | +1 (Higher Rule) |
  | **Q2** | **(b) Entailment** | +1 (Codifiable) | -1 (Uncodifiable) | -1 (Heuristic) |
  | **Q3** | **(c) Deliberation** | +1 (Rule-Guided) | -1 (Intuitive) | +1 (Rule-Required) |
  | **Q4** | **(d) Justification** | +1 (Rule-Required) | -1 (Case-Based) | +1 (Delegated Rule) |
  | **Q5** | **(c) & (d)** | -1 (c), -1 (d) | +1 (c), +1 (d) | -1 (c), +1 (d) |
  | **Q6** | **(a) Valence** | +1 (Invariant) | -1 (Holism) | +1 (Neutral/Rule) |
  | **Q7** | **(b) Entailment** | +1 (Codifiable) | -1 (Uncodifiable) | +1 (Public Rule) |
  | **Q8** | **(c) Deliberation** | -1 (Intuitive) | +1 (Rule-Guided) | +1 (Reconstructible) |
  | **Q9** | **(d) Justification** | +1 (Rule-Required) | -1 (Case-Based) | +1 (New Rule) |
  | **Q10**| **(a) & (b)** | +1 (b) | -1 (a) & -1 (b) | +1 (b) |

  *Note on Q5:* Option A rejects the need for rules in both reasoning (c) and justification (d). Option B accepts both. Option C rejects rules in reasoning (competence is real) but accepts them in justification (must explain).
  *Note on Q10:* Option B is the strong Particularist response (Valence switching + Uncodifiable). Options A and C attempt to save Generalism by positing a more complex rule.

  ### 2. Computing Switch Values
  Sum the points for the questions associated with each switch.
  *   **Switch (a) Valence:** Q1 + Q6 + Q10. (Range: -3 to +3).
  *   **Switch (b) Entailment:** Q2 + Q7 + Q10. (Range: -3 to +3).
  *   **Switch (c) Deliberation:** Q3 + Q5(part) + Q8. (Range: -3 to +3).
  *   **Switch (d) Justification:** Q4 + Q5(part) + Q9. (Range: -3 to +3).

  **Threshold Rule:**
  *   **Score > 0:** **Yes** (For b, c, d) / **No** (For a). *Wait, let's standardize direction for the table.*
  *   **Standardization for Table:**
      *   **V (Valence):** Score ≤ 0 = **Yes** (Holism/Particularist). Score > 0 = **No** (Invariant/Generalist).
      *   **E (Entailment):** Score > 0 = **Yes** (Codifiable/Generalist). Score ≤ 0 = **No** (Uncodifiable/Particularist).
      *   **D (Deliberation):** Score > 0 = **Yes** (Rule-Dependent/Generalist). Score ≤ 0 = **No** (Rule-Independent/Particularist).
      *   **J (Justification):** Score > 0 = **Yes** (Rule-Required/Generalist). Score ≤ 0 = **No** (Rule-Optional/Particularist).

  **Tie-Breaking Rule:**
  If a switch score is exactly 0 (e.g., +1, -1, 0 or +2, -2, 0), the respondent is **Unstable** on that switch. For the purpose of mapping to the 16-cell table, assign the value that renders the *overall profile* coherent (see Table below). If both coherent and incoherent profiles are possible, flag the respondent as **"Philosophically Hybrid/Unresolved."** Do not force them into a nearest occupied cell; the incoherence is data.

  ***

  ## Part III: The Logical Space (16 Combinations)

  *Legend: **V**=Valence Switching, **E**=Entailment Possible, **D**=Deliberative Necessity, **J**=Justification Necessity. (Yes = Particularist on V, Generalist on E/D/J).*

  | V | E | D | J | Position / Status | Diagnosis / Awkward Commitment |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No** | **Yes** | **Yes** | **Yes** | **Strong Generalism** (Kantian/Act-Utilitarian) | Must deny that context ever changes the moral weight of a feature like lying. |
  | **No** | **Yes** | **Yes** | **No** | **Private Generalism** (Esoteric) | Awkwardly claims rules guide thought but need not be shared for justification. |
  | **No** | **Yes** | **No** | **Yes** | **Intuitionist Generalism** (Early Ross) | Claims we intuit rules without using them, yet must cite them later. |
  | **No** | **Yes** | **No** | **No** | **Unoccupied** | **Incoherent:** If rules entail verdicts, denying their use in deliberation/justification is irrational. |
  | **No** | **No** | **Yes** | **Yes** | **Unoccupied** | **Incoherent:** Cannot claim rules are necessary for thought if they cannot entail verdicts. |
  | **No** | **No** | **Yes** | **No** | **Unoccupied** | **Incoherent:** Why deploy non-entailing rules in deliberation if not for justification? |
  | **No** | **No** | **No** | **Yes** | **Unoccupied** | **Incoherent:** Cannot demand rule-justification if rules cannot entail verdicts or guide thought. |
  | **No** | **No** | **No** | **No** | **Unoccupied** | **Unattractive:** Invariant valence but no rules? Leaves moral structure unexplained. |
  | **Yes** | **Yes** | **Yes** | **Yes** | **Unoccupied** | **Incoherent:** If valence switches, a finite set of rules cannot entail verdicts (contradiction). |
  | **Yes** | **Yes** | **Yes** | **No** | **Unoccupied** | **Incoherent:** Same as above; valence switching defeats codifiability. |
  | **Yes** | **Yes** | **No** | **Yes** | **Unoccupied** | **Incoherent:** Valence switching defeats codifiability. |
  | **Yes** | **Yes** | **No** | **No** | **Unoccupied** | **Incoherent:** Valence switching defeats codifiability. |
  | **Yes** | **No** | **Yes** | **Yes** | **Unoccupied** | **Incoherent:** If rules don't entail verdicts, they cannot be necessary for deliberation/justification. |
  | **Yes** | **No** | **Yes** | **No** | **Default Generalism** (Hooker/Rules of Thumb) | **Awkward Commitment:** Must explain why we follow rules that do not determine the truth. |
  | **Yes** | **No** | **No** | **Yes** | **Moderate Particularism** (Dancy-lite) | **Awkward Commitment:** Must explain how one justifies without rules if reasoning is rule-free. |
  | **Yes** | **No** | **No** | **No** | **Radical Particularism** (Dancy) | **Awkward Commitment:** Must explain how moral learning or consensus is possible without generalizations. |

