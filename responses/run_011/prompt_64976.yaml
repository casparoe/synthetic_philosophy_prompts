prompt: |-
  Ok so I've been going back and forth on Moore's proof of an external world, and I want you to argue for a position I'm half-drawn to but cant quite get into shape myself.

  Setup, so we're on the same page: the skeptic's argument is basically a modus tollens (if you knew you had hands, you'd know you weren't a handless brain in a vat; you don't know the latter; so you don't know the former), and Moore just runs it backwards as a modus ponens, insisting on the second premise instead of conceding it. The standard complaint is that his version begs the question, or at least fails to transmit warrant — that you'd need antecedent warrant for the anti-skeptical conclusion before your experience could give you warrant for the premise about your hands. There's a whole debate about whether that's genuine transmission failure or just dialectical uselessness, and I don't want to rehash it.

  Here's what I want argued for: that complaint gets the direction of dependence backwards. Defend the claim that the skeptic's own premises can only be motivated by an account of knowledge on which knowing requires being able to rule out relevant alternatives, and that such an account can only be motivated by ordinary cases where the subject plainly does know lots of mundane things. If that's right, it's the skeptic's argument that leans on something it's supposed to be establishing, and Moore's modus ponens isn't a stubborn retort — it's the only one of the two that doesn't trade on a presupposition of its own conclusion.

  Make it a real argument: state your premises, walk through the inference step by step, and say what work each premise is doing and what would happen if you dropped it. Then take on the two best objections yourself rather than letting me raise them — first, that the closure principle the skeptic needs is knowable a priori and so requires no such motivation from cases at all; second, that even if the skeptic's premises are badly motivated, that tells us nothing whatever about whether Moore knows he has a hand. I don't want a both-sides shrug at the end; commit to the thesis and say how far it actually gets you.
