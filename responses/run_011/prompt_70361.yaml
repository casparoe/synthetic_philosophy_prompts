answer: |-
  Does treating simulation shutdown as an evidential update rather than a causal risk nullify the expected value calculations underpinning longtermist fanaticism?

  Standard readings of the Bostrom trilemma focus almost exclusively on the *magnitude* channel: calculating the ratio of simulated minds to base reality minds to adjust the probability of our context. This treats simulation status as a fixed prior probability that scales the payoff of future-oriented actions. It leaves open the *structure* of the payoff function. Specifically, it ignores whether continuation depends on behavioral performance. If simulators terminate "boring" runs or those that deviate from expected paths, our actions correlate with the existence of the future itself, not just its quality via causal descendants. This evidential link is unmodeled in standard longtermist calculus, which assumes independence between present acts and the probability of a far future existing at all. Consequently, the trilemma leaves open whether the decision problem is purely causal (influencing descendants) or partly evidential (influencing the simulator's choice to continue the run). Fanaticism is uniquely vulnerable here because it relies on payoff magnitude being independent of the act securing it; if the act influences the probability of the payoff existing, the expected value calculation collapses.

  I will construct a formal decision model comparing Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) under simulation constraints. The project models three channels in sequence:
  1.  **Size of the simulated future:** Establishes the baseline stake.
  2.  **Inheritance from simulators' history:** Constrains simulator motives and resources.
  3.  **Selection on our behavior:** Introduces the evidential link between actions and continuation.

  This order isolates variables. Size sets the potential energy; Inheritance defines the rules of the game; Selection determines if our moves change the board's existence. Modeling Selection last ensures any divergence in expected value is attributable to the evidential structure, not merely reduced population counts.

  **Timeline:**
  Weeks 1–4: Formalize baseline magnitude models and sensitivity analysis.
  Weeks 5–8: Model simulator constraints, history, and termination functions.
  Weeks 9–12: Integrate behavioral selection into EDT/CDT comparison and synthesize results.

  A positive result demonstrates that EDT diverges significantly from CDT, reducing the expected value of longtermist interventions by orders of magnitude because "safe" strategies correlate with termination. A negative result shows evidential correlations are too weak to alter decision rankings, validating standard causal models.

  Verdict on the evidential/causal distinction: It is doing real work, not merely relabeling anthropics. Anthropics concerns self-location within a fixed set of worlds; this project concerns the *generation* of those worlds contingent on observed variables. If continuation is a function of behavior, the utility function becomes action-dependent in a way standard anthropic updates do not capture. This shifts the problem from self-location to game-theoretic signaling. However, if simulator motives are opaque, the evidential link collapses back into a flat prior, rendering the distinction moot. The distinction holds only if simulator interest is responsive to our behavior, a condition standard anthropic arguments ignore.
