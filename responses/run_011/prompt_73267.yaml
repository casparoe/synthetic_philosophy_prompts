  *   *Claim:* "It is also why the two accounts handle preemption the same way: once the variables are fine-grained enough... the structural-equation model says what the chain of counterfactual dependence says."
      *   **Under-argued/Incorrect.** Structural equations handle preemption via off-path fixing, not merely fine-graining chains. Lewis (1973) fails late preemption even with fine-graining.

