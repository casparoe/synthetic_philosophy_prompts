answer: |-
  Here is the specification document you asked for. It is drafted as a set of engineering constraints rather than philosophical ideals, tailored to the reality of small-sample, sequential, adversarial environmental monitoring.

  ### Part 1: The Desiderata

  To count as an adequate replacement for the standard null-hypothesis workflow, a framework must satisfy the following requirements. I have categorized them by function.

  **A. Operational Constraints (The "Lab Bench" Requirements)**
  1.  **Small-Sample Validity:** The method must not rely on asymptotic approximations. With $N < 10$ per site, convergence guarantees are irrelevant. The inference must hold for the specific sample size collected.
  2.  **Algorithmic Standardization:** The workflow must be reducible to a checklist or script that a competent technician can execute without deriving distributions. If the method requires tuning hyperparameters by feel, it fails.
  3.  **Sequential Coherence:** The method must accommodate data arriving season-by-season. It must allow for early stopping (e.g., "pollution is clearly dangerous") or extended monitoring (e.g., "signal is weak, collect one more year") without invalidating the previous data.

  **B. Epistemic Constraints (The "Truth" Requirements)**
  4.  **Evidence-Decision Separation:** The output must distinguish *what the data indicate* from *what action we take*. A report should be able to say "evidence is weak" without forcing a binary "safe/unsafe" declaration based on an arbitrary threshold.
  5.  **Sensitivity Declaration:** The method must distinguish "no effect found" from "no capacity to detect an effect." It must quantify the minimum detectable trend given the noise and sample size (power analysis integrated into the result, not just the design).
  6.  **Multiplicity Robustness:** When measuring dozens of analytes, the framework must account for the fact that some will look significant by chance. It must control the false discovery rate without rendering small effects invisible.
  7.  **Model Misspecification Tolerance:** The method must not collapse if the error distribution is slightly non-normal or if there is mild autocorrelation. It should be robust to the model being "wrong but useful."

  **C. Adversarial Constraints (The "Regulator" Requirements)**
  8.  **Deterministic Reproducibility:** An adversary with the same data and the same protocol must generate the exact same numbers. There can be no "analyst degrees of freedom" in the calculation itself.
  9.  **Long-Run Calibration:** Even if exact repetitions don't happen, the method must guarantee that if we used it for 100 years, we would not systematically overstate risks more than $X\%$ of the time. This is your shield against accusations of bias.
  10. **Intent Transparency:** The method must explicitly record whether the sampling plan was fixed or flexible. It cannot hide the stopping intention; it must account for it.

  ---

  ### Part 2: Philosophical Constraints vs. House Prejudices

  You asked about the Likelihood Principle (LP) and Long-Run Calibration. Here is the verdict based on your operating conditions.

  **The Likelihood Principle (LP)**
  *Status: House Prejudice.*
  The LP states that all evidence is contained in the likelihood function of the observed data, rendering stopping rules irrelevant. While philosophically elegant, in your context, it is a liability.
  *   **Why ignore it?** Your adversaries (regulators) care about false positives over time. If you use an LP-compliant method (like standard Bayesian inference) and peek at data until you find a trend, you *will* find trends that aren't there. The LP says this is fine because the likelihood ratio is the same; the regulator says you are p-hacking.
  *   **Birnbaum's Theorem:** You are right to be suspicious. The proof that Sufficiency + Conditionality implies Likelihood is mathematically contested in practical settings. You can politely ignore the LP. You need a method that *penalizes* peeking, not one that ignores it.

  **Long-Run Calibration**
  *Status: Non-Negotiable.*
  You asked if error rates matter if repetitions never happen. In a regulatory environment, yes, they matter.
  *   **Why keep it?** It is not about the specific river; it is about the *process*. If your method claims 95% confidence but is wrong 50% of the time over a decade, you lose credibility. Long-run calibration is not a claim about nature; it is a performance guarantee of your instrument (the statistical method). It is the only defense against the charge of dishonesty.

  ---

  ### Part 3: Incompatibilities and Trade-offs

  **The Impossible Pair**
  You cannot jointly satisfy **Operational Standardization (A2)** and **Sequential Coherence (A3)** without sacrificing **Long-Run Calibration (C9)**.
  *   *Why:* To allow flexible stopping (peeking) while maintaining error guarantees, you need complex sequential analysis boundaries (like alpha-spending functions). These are too complex for a technician to execute without theoretical understanding (violating A2). If you simplify the method for the technician (fixed p-value threshold), you must fix the sample size (violating A3) or lose error control (violating C9).

  **The Knockout Requirement**
  The single requirement that knocks out the most candidates is **Deterministic Reproducibility (C8)**.
  *   *Why:* This eliminates most "modern" Bayesian approaches where prior selection is subjective. If two analysts pick different priors, they get different results, and the regulator will exploit that discrepancy to claim you manipulated the outcome. It also eliminates ad-hoc decision theory where cost-functions are debatable. It forces you back toward objective, frequentist-style procedures, which then struggle with the Small-Sample and Sequential constraints.

  ---

  ### Part 4: Evaluation of Your Four Proposals

  Here is the verdict on the four requirements you are debating with your friend.

  *   **(a) Technician execution without understanding:** *Legitimate.* This is an operational necessity. If the method requires a statistician to interpret the interpretation, it will fail in the field.
  *   **(b) State "inconclusive" without halting:** *Legitimate.* This is crucial for small $N$. Forcing a binary decision on weak data leads to errors. The framework must allow a "monitor further" state.
  *   **(c) Verdict independent of planned data collection:** *Illegitimate (in your context).* As noted with the Likelihood Principle, you cannot ignore stopping intentions in an adversarial environment. If you plan to collect 10 samples but stop at 5 because the result looks good, the verdict *must* change to account for the peeking. Demanding otherwise invites accusations of p-hacking.
  *   **(d) Adversary gets the same numbers:** *Non-Negotiable.* This is the definition of scientific integrity in a regulatory context.

  **The Tension: (a) vs. (c)**
  You suspected these were in tension. You are correct.
  To make the verdict independent of stopping intentions (c), you generally need a Bayesian framework or complex sequential boundaries. Both require more theoretical nuance than a technician can safely wield without understanding the "why" (violating a). A simple recipe (a) usually relies on fixed designs, which makes the verdict highly dependent on stopping intentions (violating c). You must choose one. Given the regulatory heat, I recommend sacrificing (c) to save (a). Fix the protocol, document deviations, and adjust the analysis conservatively.

  ---

  ### Part 5: The Three Contenders

  Here is how the obvious candidates score against the desiderata.

  **1. Preregistration + P-values + Effect Sizes**
  *   *Pros:* Satisfies Adversarial Reproducibility and Long-Run Calibration. Technicians can run it (A2).
  *   *Cons:* Fails Sequential Coherence (peeking invalidates p-values). Struggles with Small $N$ (low power). "Inconclusive" is hard to codify (usually treated as "null").
  *   *Verdict:* Safe for the regulators, dangerous for the science if your sampling isn't rigid.

  **2. Fully Bayesian Setup with Stated Priors**
  *   *Pros:* Excellent for Small $N$ and Sequential Data. Naturally handles "inconclusive" (via posterior uncertainty). Satisfies Likelihood Principle (stopping rules don't matter).
  *   *Cons:* Fails Adversarial Reproducibility (priors are subjective). Fails Technician Execution (requires MCMC diagnostics, prior sensitivity analysis). Regulators will attack the prior choice as manipulation.
  *   *Verdict:* Scientifically superior, operationally fragile in your specific adversarial context.

  **3. Decision-Theoretic Cost-Loss Framing**
  *   *Pros:* Directly addresses the "dredge/don't dredge" question. Separates evidence from action.
  *   *Cons:* Fails Adversarial Reproducibility (who sets the cost of a false positive?). Requires quantifying risks you cannot quantify.
  *   *Verdict:* Useful for internal management, unusable for public reporting.

  ### Recommendation

  Do not look for a silver bullet. Build a **hybrid protocol**.
  Use **Frequentist methods** for the public report (to satisfy the regulator's demand for error control and reproducibility), but enforce **rigid sampling protocols** to protect the validity of the p-values. Internally, use **Bayesian estimation** to guide decisions on whether to continue monitoring (satisfying the sequential need), but do not publish those priors as evidence.

  Your "inconclusive" category (b) should be implemented as a **Minimum Detectable Effect** report. If the confidence interval spans from "trivial" to "disastrous," the report states: "Data insufficient to distinguish trivial from disastrous." This satisfies the technician constraint, the adversarial constraint, and the epistemic constraint without requiring you to solve the philosophy of probability.
