  3.  **Evaluate the Hypotheses:**
      *   *Hypothesis 1: Verbal Disagreement (Definition of "Penal").* Plausible. If Camp 2 defines punishment as essentially communicative censure directed at the offender, substitution is impossible by definition. If Camp 3 defines it as imposed hard treatment for a breach, substitution is possible. This is a classic "conceptual engineering" clash.
      *   *Hypothesis 2: Hidden Prior Disagreement (Purpose of Punishment).* Retributivists (desert-based, personal) vs. Instrumentalists/Consequentialists (cost-based, transferable). This underpins the verbal disagreement.
