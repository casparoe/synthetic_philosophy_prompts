prompt: |-
  Last night I argued for the better part of three hours with a friend — she works on the ethics of armed conflict, I come at these questions from the history of philosophy — about whether Hegel's claims about war in the *Philosophy of Right* are actually generated by his account of the state or merely bolted onto it. We kept circling back to the same handful of sentences without ever having parsed them, and I now suspect that each of us has been reading a thesis into a text neither of us understands at the sentence level. I would like your help at that level.

  Here is the passage we were fighting over: §§257–258 with their Remarks, in T. M. Knox's translation.

  > § 257. The state is the actuality of the ethical Idea. It is ethical mind qua the substantial will manifest and revealed to itself, knowing and thinking itself, accomplishing what it knows and in so far as it knows it. The state exists immediately in custom, mediately in individual self-consciousness, knowledge, and activity, while self-consciousness in virtue of its sentiment towards the state, finds in the state, as its essence and the end-product of its activity, its substantive freedom.
  >
  > Remark: The Penates are inward gods, gods of the underworld; the mind of a nation (Athene for instance) is the divine, knowing and willing itself. Family piety is feeling, ethical behaviour directed by feeling; political virtue is the willing of the absolute end in terms of thought.
  >
  > § 258. The state is absolutely rational inasmuch as it is the actuality of the substantial will which it possesses in the particular self-consciousness once that consciousness has been raised to consciousness of its universality. This substantial unity is an absolute unmoved end in itself, in which freedom comes into its supreme right. On the other hand this final end has supreme right against the individual, whose supreme duty is to be a member of the state.
  >
  > Remark: If the state is confused with civil society, and if its specific end is laid down as the security and protection of property and personal freedom, then the interest of the individuals as such becomes the ultimate end of their association, and it follows that membership of the state is something optional. But the state's relation to the individual is quite different from this. Since the state is mind objectified, it is only as one of its members that the individual himself has objectivity, genuine individuality, and an ethical life. Unification pure and simple is the true content and aim of the individual, and the individual's destiny is the living of a universal life. His further particular satisfaction, activity and mode of conduct have this substantive and universally valid life as their starting point and their result.

  Later in the same Remark, discussing Rousseau, Hegel writes that Rousseau "takes the will only in a determinate form as the individual will, and he regards the universal will not as the absolutely rational element in the will, but only as a 'general' will which proceeds out of this individual will as out of a conscious will. The result is that he reduces the union of individuals in the state to a contract and therefore to something based on their arbitrary wills, their opinion, and their capriciously given express consent."

  The shape of our disagreement. My friend holds that these paragraphs already contain everything Hegel needs for the later claims about war — in particular for the addition to §324, where he compares war's effect on a people to the way moving air keeps a body of standing water from going foul. Her route runs through the phrase "sentiment towards the state": she reads "political virtue is the willing of the absolute end in terms of thought" as a claim about the *form* of the disposition rather than about its object, so that what war reveals on Hegel's account is a structure of consciousness — the individual's own particularity shown to be non-ultimate — and not any good that war produces. I objected that §257–258 is an internal-constitutional passage, that "supreme duty is to be a member of the state" states a status and not a performance, and that getting from membership to willingness to be killed requires a further premise about the state's individuality over against other states, which is simply absent here.

  I would like you to work through the passage and tell me who is on firmer textual ground. Specifically:

  1. In §257, "actuality" and "exists" appear within three sentences of one another. Is the second sentence a claim about two modes in which one and the same thing exists, or about two modes in which it is present to its members? Does the immediacy/mediacy contrast track epistemic access, or ontological dependence?

  2. What is the force of "accomplishing what it knows and in so far as it knows it"? Read as a limiting clause, it makes the state fallible in proportion to its self-knowledge; read otherwise, it looks like a tautology. Which is it, and does anything in the later claim about a people's indifference to its own preservation depend on the choice?

  3. Is §258 an advance on §257 or a restatement of it? The relative clause — the actuality of the substantial will "which it possesses in the particular self-consciousness once that consciousness has been raised to consciousness of its universality" — seems to make the state's absolute rationality conditional on that raising. If so, actuality is gradable and some polities fail to be states in the strict sense. Does the passage compel that reading, or is "once" purely descriptive of the state's internal structure?

  4. The word "supreme" occurs three times in two sentences. Are "supreme right against the individual" and "supreme duty is to be a member of the state" a correlative pair in a technical sense, or is "supreme" doing different work in each place? This is where our argument turns: can the duty of membership, as stated here, carry the weight of self-exposure in battle, or is my friend smuggling in a premise?

  5. Can "in terms of thought" bear the load she puts on it, given that the remark's explicit contrast is with family piety as feeling — a contrast that looks phenomenological rather than a claim about the object of political virtue? And is the Penates material doing argumentative work — marking the household gods as gods who do not know themselves, and so as incapable of generating the disposition she needs — or is it decoration?

  6. In the §258 Remark, is the conditional a claim that *any* account taking the protection of property and personal freedom as the state's end entails optional membership, or only that one particular confusion does? How does the Rousseau sentence interact with that conditional — is the target consent as such, or the individuality of the will that gives it?

  Two further requests. Tell me plainly which of my two objections you think fails and why; and mark every step in either reading that cannot be supported by these paragraphs alone and must be imported from elsewhere in the book, since I do not want the argument to rest on sections we never actually read together. I am not looking for pointers to the secondary literature or a list of what to consult next — I want these sentences worked through, and where the text underdetermines a question, I would rather you say so and show which readings the wording rules out.
