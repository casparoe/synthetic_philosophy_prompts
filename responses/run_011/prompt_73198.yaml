prompt: |-
  Retired soil microbiologist here — thirty-five years of counting things in dirt, and only in the last couple of years any philosophy at all, mostly whatever my daughter posts through the door. She keeps telling me there's a name for what I'm about to describe, and I can't find it.

  Our regional museum is redoing the living-world room. Volunteer-run, one paid curator, money from a lottery grant. The original plan was lovely and simple: three cases, labelled Alive, Not alive, and Once alive, and every specimen gets a tick, a cross or a question mark. The funder has been quite firm that a visitor should be able to walk out able to answer yes or no, and the designer has already mocked up placards that read IS IT ALIVE? with two boxes to tick.

  The trouble is my tray of awkward things won't go in the cases. Sitting on the bench in the back room right now:

  - a sealed ampoule of tobacco mosaic virus, which I've worked with since I was a postgrad;
  - a jar of prion-infected brain tissue a veterinary school has offered to lend (sealed, obviously);
  - a tardigrade in its dried-up tun state, on a slide since 1998, which may or may not ever wake up — nobody's going to water it during opening hours;
  - a HeLa culture the hospital lab says we can keep in a borrowed incubator. Feeds itself, divides, has been going for seventy-odd years, but is nowhere near being an animal. The technician also mentioned there's a consent question attached to those cells that I'd want to look into before we put a name on the label;
  - a paper bag of seeds, forty years old, from a local seed bank;
  - a mule — the farmer down the road will bring her in on open days. Alive by any measure I know, and she will never have young;
  - a slime mould, currently dry and inert in a petri dish, which solves mazes when you damp it;
  - a living sponge in a tank, which is one animal or a crowd depending on the day you ask;
  - and my grandson's contribution, a laptop running one of those grid games where little arrow-shaped things march across the screen and a structure that looks for all the world like a factory spits out more of them.

  Two of the panel are now having a proper row. One says it's easy: if its got metabolism it's alive, end of, and the virus, the prion, the tun and the seeds are all out. The other says metabolism is a chemist's prejudice — what matters is whether the thing can change across generations, which lets the virus in, throws the mule out and leaves the cells in the incubator in a muddle. And both of them talk as though one of them is simply correct and the other hasn't looked hard enough, as if this were a measurement we could go and take. After a career of taking measurements I'm no longer so sure that's what's going on.

  So, help me with Thursday's meeting. Is there a fact of the matter about which of those two trays is right, or is the panel arguing about something else entirely and not noticing? If it can't be settled, what should we actually do — pick a side and print the tick-a-box placards anyway, or scrap the format and put the disagreement on the wall? I'd like something concrete enough to act on, including what to say about each of the awkward specimens one by one, because I am not quietly dropping the 1998 tardigrade or the prion jar just for being inconvenient. And please don't tell me to leave it open to interpretation; the grant people will eat us alive if the labels have no answers on them. British English, if you would, and assume I know my biology but none of your vocabulary.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired soil microbiologist (35 years experience), practical, empirical, skeptical of abstract philosophy but open to it (via daughter), British English speaker. Knows biology well, doesn't know philosophical jargon.
      *   **Context:** Regional museum redoing a "living-world" room. Volunteer-run, limited budget, strict funder requirements (binary "Is it Alive?" yes/no boxes).
      *   **The Problem:** The binary classification system (Alive/Not Alive/Once Alive) breaks down when faced with edge cases (viruses, prions, tardigrades, HeLa cells, seeds, mules, slime moulds, sponges, artificial life). Two panel members are arguing over definitions (metabolism vs. evolution), assuming there's a single correct factual answer.
      *   **The Goal:** Needs advice for Thursday's meeting. Specifically:
          1.  Is there a fact of the matter? (Is one panelist right?)
          2.  If not, what should they do? (Pick a side vs. show disagreement).
          3.  Concrete advice on how to label/handle each specific specimen.
          4.  Must satisfy funders (binary boxes) but maintain scientific integrity.
          5.  Tone: Respectful, collegial, British English, no unnecessary jargon.

  2.  **Deconstruct the Philosophical/Biological Issue:**
      *   **The Core Question:** "What is life?"
      *   **The Reality:** There is no consensus definition in biology or philosophy. It's a "cluster concept" or a "fuzzy boundary," not a binary switch.
      *   **The Panelists' Arguments:**
          *   Panelist A (Metabolism): Aligns with autopoiesis/thermodynamics. Excludes viruses, seeds (dormant), prions.
          *   Panelist B (Evolution/Replication): Aligns with NASA's working definition ("self-sustaining chemical system capable of Darwinian evolution"). Includes viruses, excludes mules (sterile).
      *   **The Verdict:** Neither is "correct." They are choosing different *useful* definitions for different contexts. The user is right: it's not a measurement error; it's a category error.

  3.  **Address the Funder Constraint (The "Tick-Box" Requirement):**
      *   The funders want a binary output ("Yes/No").
      *   Science says "It's complicated."
      *   *Solution:* We must game the system slightly without lying. We can keep the boxes but change *what the boxes mean* or add context. Or, we accept the binary for the *visitor experience* while acknowledging the nuance in the *interpretation*.
      *   *Better Solution:* Don't scrap the format (funders will panic), but change the *question* or the *interpretation key*. Actually, the prompt says "IS IT ALIVE? with two boxes to tick." We need to make that work.
      *   *Strategy:* Treat "Alive" as a *prototypical* category. Things that are *unambiguously* alive get a tick. Things that are *unambiguously* dead get a cross. Things in the middle get a question mark (the original plan had this, the funder said yes/no).
      *   *Wait, re-reading:* "The funder has been quite firm that a visitor should be able to walk out able to answer yes or no... mocked up placards that read IS IT ALIVE? with two boxes to tick." The original plan had a question mark, the funder killed it.
      *   *Constraint:* Must have Yes/No boxes.
      *   *Workaround:* We can't put a question mark in a box. But we can explain *why* the box is ticked a certain way in the text. Or, we can classify based on *current state* vs. *potential*.
      *   *Best Approach for Museum:* Pedagogical honesty. Admit the boundary is fuzzy in the text, but make a pragmatic choice for the box based on the *most useful* definition for the public.
      *   *Actually, the user asks:* "Pick a side and print... or scrap the format and put the disagreement on the wall?"
      *   *Advice:* Don't scrap the format (funders). But don't pretend it's simple. Use the text panel to explain the row.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise. Validate their suspicion (it's not a measurement problem, it's a definition problem). Use British English (colour, programme, centre, etc.).
      *   **The Philosophical Bit (The "Fact of the Matter"):** Explain that "Life" is a human category, not a natural law. Use the analogy of "heap" (Sorites paradox) without using the name. Explain that Panelist A and B are choosing different *tools*, not finding different *facts*.
      *   **The Museum Strategy:**
          *   Don't fight the funder on the boxes (risk the grant).
          *   Do fight on the *text*.
          *   Proposal: Keep the Yes/No boxes, but make the *label text* do the heavy lifting.
          *   Better Proposal: Suggest a "Traffic Light" system or a "Main Status + Note" system if possible. But if strict Yes/No is mandated, we must choose the *pragmatic* classification.
          *   *Refined Strategy:* Suggest they keep the boxes but add a "Why?" section. Or, suggest they classify based on *current activity* for the exhibit context.
          *   *Actually, the best advice:* Tell the panelists they are both right and wrong. The exhibit shouldn't teach "The Answer," it should teach "The Question."
          *   *Compromise:* Tick the box based on the *most common* definition (Metabolism + Cell Structure), but use the text to highlight the exception.
      *   **Specimen-by-Specimen Advice:**
          *   *Virus:* No (usually). Explain why (needs host).
          *   *Prion:* No. It's a protein.
          *   *Tardigrade (Tun):* Yes (dormant). It's an animal holding its breath.
          *   *HeLa:* Yes (cellular life), but note the ethical context (Henrietta Lacks).
          *   *Seeds:* Yes (dormant plant).
          *   *Mule:* Yes (organism), sterile doesn't mean dead.
          *   *Slime Mould:* Yes (when damp), No (when dry). Context matters.
          *   *Sponge:* Yes (colonial animal).
          *   *Grandson's Laptop:* No (simulation), but note the "Artificial Life" angle.
      *   **Conclusion:** Reassure the user. They are the expert. The panelists are arguing semantics.

  5.  **Refining the Tone:**
      *   Avoid words like "ontology," "epistemology," "Sorites," "cluster concept."
      *   Use analogies (colour spectrum, heap of sand).
      *   Respect the 35 years of dirt-counting.
      *   British spelling and idioms ("row," "proper," "funder," "programme").

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the HeLa consent issue? *Yes, crucial.*
      *   *Check:* Did I address the funder's binary constraint? *Yes, need to be careful not to suggest breaking the grant terms, but interpreting them.*
      *   *Check:* Is the advice actionable for Thursday? *Yes, specific scripts for the meeting.*
      *   *Check:* The Mule. Panelist B says mule is out because sterile. This is a common misconception (individual vs. lineage). Need to clarify that individual organisms are alive even if sterile (like worker bees).
      *   *Check:* The Laptop. This is "Artificial Life." Definitely not biologically alive, but conceptually interesting.
      *   *Check:* The Tardigrade. Cryptobiosis. It's alive, just paused.
      *   *Check:* The Prion. Definitely not alive. Misfolded protein.

  7.  **Final Polish:** Ensure the distinction between "definition" and "discovery" is clear. The panelists think they are discovering the truth; they are actually choosing a convention.

      *(Self-Correction on the Funder Constraint)*: The prompt says the funder wants visitors to answer Yes/No. It doesn't explicitly say every single item *must* have a definitive tick that cannot be questioned in the text. It says "walk out able to answer yes or no." This implies clarity. However, if we teach them *why* it's hard, they can answer "Yes, but..." which is still an answer.
      *Decision:* Advise to keep the boxes but use the text to explain the nuance. Don't scrap the format (too risky for funding), but subvert the simplicity.

      *Wait, one more thing:* The user asked: "Is there a fact of the matter... or is the panel arguing about something else entirely?"
      *Answer:* They are arguing about something else (utility of definition vs. objective truth).

      *Let's structure the advice:*
      1. Direct answer to the philosophical question.
      2. Strategy for the meeting (how to stop the row).
      3. Strategy for the funders (how to keep the money).
      4. The Specimen List (the concrete actions).

      *Language check:* "Programme" not "program", "Centre" not "center", "Labelled" not "labeled". Idioms: "Row," "Proper," "Eat us alive."

      *HeLa Cells:* Need to mention Henrietta Lacks explicitly. It's an ethical issue, not just biological.
      *Mule:* Sterility applies to species continuity, not individual life.
      *Virus:* The classic edge case.
      *Laptop:* Artificial life.

