      *   *Philosopher:* Conceptual = Independence requirement, value lock-in risk. Empirical = Beta factor of AI/Pathogens, transmission speed of capabilities, psychological profile of colonists.
      *   *Key Undefended Premise:* The "Beta Factor" of civilizational risk. How much does Mars share Earth's risk profile?
