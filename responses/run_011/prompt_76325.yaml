  ### (e) Indistinguishable Pairs

  **The Risk Pair: (12) Naturalization vs. (1) Professional Theater**
  *   **The Problem:** The principle ranks (12) higher than (1) due to the **Agency Clause** (legal pledge vs. watching). However, structurally, both involve people standing in a room, following a script, led by officials.
  *   **The Conflict:** A student might argue a powerful performance of *Antigone* creates more moral agency than a boring naturalization ceremony.
  *   **Why the Principle Fails Here:** The principle treats "Legal Pledge" as *Real Action* and "Emotional Catharsis" as *Simulation*. It cannot easily account for the idea that art *is* a form of action.
  *   **Recommendation:** Flag this. Tell students: "Under this principle, a boring ceremony beats a brilliant play. If you disagree, you reject the Agency Clause."

  **The Risk Pair: (3) Streamed Drama vs. (7) Reality Competition**
  *   **The Problem:** Both are "Bad." The principle groups them.
  *   **The Conflict:** You said (7) is "bad in a way (3) is not." (3) is empty; (7) is harmful.
  *   **Why the Principle Fails Here:** The principle lumps "Fails Agency" and "Fails Virtue" into the same "Bad" bucket. It does not distinguish between *negligence* (3) and *malice* (7).
  *   **Recommendation:** Add a footnote: "Failing the Virtue Clause is worse than failing the Agency Clause." Without this, the principle treats a boring stream and a cruel spectacle as equally undesirable.

  **The Risk Pair: (9) Festival vs. (10) Stadium Match**
  *   **The Problem:** You rank (9) slightly higher than (10).
  *   **The Conflict:** Both pass all four clauses easily. They are co-present, active (singing/dancing), virtuous (community), and habitual.
  *   **Why the Principle Fails Here:** The principle cannot distinguish between *creating* culture (9) and *consuming* sport (10). It lacks a "Production Clause" (who makes the event?).
  *   **Recommendation:** Acknowledge that the principle sees them as equals. If you must distinguish them, you need a fifth clause: **The Authorship Clause** (Did the audience make the event, or just attend it?).
