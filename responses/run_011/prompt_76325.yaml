answer: |-
  ### (a) The Principle of Civic Resonance

  **The Principle:** An event is valuable to the degree that it transforms a collection of individuals into a moral public capable of real action.

  To apply this, run the **Four-Point Resonance Test**. Each clause is a pass/fail filter. The more clauses an event passes, the higher its ranking.

  1.  **The Assembly Clause (Co-Presence):** *Are the participants physically co-present and aware of one another as a collective body?*
      *   **Apply:** Look at the room. Can Person A see Person B? Do they know they are doing this together?
      *   **Motivating Cases:** Passes: (9) Festival, (10) Stadium, (12) Naturalization. Fails: (3) Streamed Alone, (4) Filmed Stage.
      *   **Why:** Isolation dissolves the public into private consumers.

  2.  **The Agency Clause (Consequence):** *Does the event terminate in real-world action, or does it simulate action/feeling within a closed loop?*
      *   **Apply:** Ask: "When this ends, what changes in the world outside this room?" If the answer is "Nothing" or "Only my mood," it fails. If the answer is "We voted," "We pledged," or "We organized," it passes.
      *   **Motivating Cases:** Passes: (6) Documentary + Petition, (9) Festival (social bonding is real), (12) Naturalization (legal status change). Fails: (3) Streamed Drama (sterile feeling), (5) Immersive Show (simulated choice).
      *   **Why:** Simulated agency exhausts the impulse to act without satisfying it.

  3.  **The Virtue Clause (Moral Alignment):** *Does the distribution of sympathy reward moral duty and punish vice, or does it invert them?*
      *   **Apply:** Identify the hero and the fool. Is the person who tells the hard truth rewarded or mocked?
      *   **Motivating Cases:** Passes: (2) School Play (community affirmation). Fails: (7) Reality Humiliation, (8) Whistleblower Comedy.
      *   **Why:** Art that trains us to mock virtue corrodes the capacity for civic trust.

  4.  **The Habit Clause (Integration):** *Is this event an expression of existing local life, or is it an imported imposition?*
      *   **Apply:** Ask: "Did this grow here, or was it planted here?" Has it existed long enough to become a habit?
      *   **Motivating Cases:** Passes: (1) Resident Rep (established), (11) Old Theater. Fails: (11) New Theater (imposed).
      *   **Why:** Imported institutions extract resources and attention before they contribute to the social fabric.

  **Weight and Deletion:**
  *   **Most Weight:** The **Agency Clause**. It is the primary differentiator between your "Good" passive acts (6, 12) and your "Bad" passive acts (3, 4). It explains why a documentary is better than a drama, and why a naturalization ceremony is better than a show.
  *   **Least Damage to Delete:** The **Habit Clause**. Case (11) is the only verdict heavily dependent on *time* rather than *structure*. If you delete this, (11) becomes ambiguous (New Theater = Fine), but the other eleven verdicts remain stable. It is the most contingent historical observation, whereas the other three are structural.

  ---

  ### (b) Testing Against Rousseau

  **Tension 1: Content vs. Institution**
  Rousseau argues that plays reflect existing morals (content) but theaters alter habits (institution). You might worry your principle forces a choice between the two.
  *   **Resolution:** Your principle **dissolves the tension** by treating them as separate clauses. The **Virtue Clause** handles the content (does the play mock the whistleblower?), while the **Habit** and **Assembly Clauses** handle the institution (is this theater organic? does it gather us?).
  *   **Application:** This explains why (1) Resident Rep is "Good" despite being professional theater (Institution is integrated/Habit passed), while (8) Comedy is "Bad" despite being live theater (Content fails Virtue). It allows you to agree with Rousseau that the *building* changes the town (Habit Clause) without agreeing that *all drama* is inherently corrupting (Virtue Clause allows for good drama).

  **Tension 2: Sterile Compassion**
  Rousseau claims theater-goers weep for fictional heroes to avoid helping real neighbors. Yet you rate (6) Documentary (viewers weep/watch) as "Good."
  *   **Resolution:** Your principle explains this via the **Agency Clause**, not the subject matter. Rousseau's critique targets *sterile* sentiment.
  *   **Application:** Case (3) Prestige Stream fails because the feeling ends when the screen goes dark (Sterile). Case (6) Documentary passes because the feeling is a *prelude to petitioning* (Instrumental). It is not the *politics* of the documentary that saves it, but the *exit route* it provides. If the documentary viewers went home and cried, your principle would demote it to the status of (3). This saves you from an ad hoc "Political = Good" rule.

  ---

  ### (c) Troublemakers and Trade-offs

  **The Troublemakers:**
  1.  **Case (5) Immersive Show:** You rank this "Worse than (1)" despite it being active.
      *   *Principle Fit:* The principle catches this via the **Agency Clause** (simulated choice) and **Assembly Clause** (audience split up).
      *   *Risk:* A student might argue "They chose things!" You must emphasize *consequences outside the room*.
  2.  **Case (11) New vs. Old Theater:** This is the most fragile verdict.
      *   *Principle Fit:* Relies entirely on the **Habit Clause**.
      *   *Risk:* It implies a "Sunk Cost" morality—that time legitimizes expense. This is hard to defend philosophically.
  3.  **Case (6) Documentary:** You admit you "cannot say why" it is better than (2).
      *   *Principle Fit:* The principle says it is better because of **Agency** (litigation) outweighing **Habit** (school community).
      *   *Risk:* If the litigation fails, does the verdict change? The principle suggests yes; your intuition might not.
  4.  **Case (4) Filmed Stage:** You rank it worse than (1) despite efficiency.
      *   *Principle Fit:* Fails **Assembly**.
      *   *Risk:* In a digital age, students may reject the idea that physical co-presence is necessary for a "public."

  **Amend or Overturn?**
  *   **Amend (11):** Do not overturn the verdict, but amend the explanation. It is not that the *theater* is bad, but that the *subsidy* represents a misallocation of civic priority in a town without habits of theater-going. Frame it as **Priority**, not just Habit.
  *   **Defend (6):** Defend it vigorously on the **Agency Clause**. It is the linchpin of your whole system. If (6) falls, the distinction between art and propaganda collapses.

  **The Leaner Principle (Three Clauses):**
  If you cut the **Habit Clause** to simplify:
  *   **Preserved:** 9 of 12 verdicts.
  *   **Sacrificed:** (11) New Theater (becomes neutral), (1) Resident Rep (loses its edge over New Theater), and potentially (2) School Play (which relies on local habit for its "warmth").
  *   **Worth It?** **Yes.** The Habit Clause is the most historically contingent. A student can apply Assembly, Agency, and Virtue anywhere. Habit requires local knowledge. Sacrificing the nuance of (11) makes the tool more portable for a seminar handout.

  **Incoherence Check:**
  *   **(12) Naturalization vs. (3) Streamed Drama:** Both involve reading scripted text.
      *   *Verdict:* (12) Good, (3) Bad.
      *   *Coherence:* The principle separates them via **Assembly** (12 is co-present) and **Agency** (12 changes legal status). This is coherent, provided the student understands "legal status" as real action.
  *   **(1) Pro Rep vs. (5) Immersive:** (1) is passive, (5) is active. Yet (1) > (5).
      *   *Coherence:* This is the hardest sell. The principle argues (1) preserves the **Assembly** (we watch together) while (5) fractures it (we choose alone). If a student values "interactivity" above "collectivity," they will reject this. You must be prepared to argue that *shared passivity* is more civic than *isolated activity*.

  ---

  ### (d) Application to New Cases

  1.  **Weekly Community Choir (Badly, Often):**
      *   **Assembly:** Pass (Co-present).
      *   **Agency:** Pass (Making music together is real action).
      *   **Virtue:** Pass (Cooperation).
      *   **Habit:** Pass (Weekly/Local).
      *   **Verdict:** **Good** (Comparable to (2) or (9)). Quality of art is irrelevant under this principle.

  2.  **Livestreamed Protest (Watched by millions, cannot join):**
      *   **Assembly:** Fail (Isolated viewers).
      *   **Agency:** Fail (No position to join/action).
      *   **Virtue:** Pass (Presumably righteous cause).
      *   **Habit:** Fail (Event-based).
      *   **Verdict:** **Bad** (Comparable to (3)). It generates sterile solidarity.

  3.  **Televised Leaders' Debate (Bars/Living Rooms):**
      *   **Assembly:** Fail (Scattered, though bars help slightly).
      *   **Agency:** Fail (Viewers do not decide).
      *   **Virtue:** Mixed (Often rewards aggression).
      *   **Habit:** Pass (Election cycle).
      *   **Verdict:** **Neutral/Bad** (Comparable to (4)). It simulates civic engagement without providing agency.

  4.  **Museum Installation (Records visitors, shows them):**
      *   **Assembly:** Fail (Focus is on self/image, not others).
      *   **Agency:** Fail (Narcissistic loop).
      *   **Virtue:** Neutral.
      *   **Habit:** Fail.
      *   **Verdict:** **Bad** (Comparable to (5)). Simulated agency and fractured attention.

  5.  **Stand-up Special (Filmed Live, Streamed):**
      *   **Assembly:** Fail for viewer (Mediated).
      *   **Agency:** Fail.
      *   **Virtue:** Depends on material (Risk of (8)).
      *   **Habit:** Fail.
      *   **Verdict:** **Bad** (Comparable to (4)). The live audience had Assembly; the streamer does not.

  6.  **Municipal Defeat Ceremony (Descendants of both sides):**
      *   **Assembly:** Pass (Co-present).
      *   **Agency:** Pass (Public acknowledgment/reconciliation is real social work).
      *   **Virtue:** Pass (Truth-telling over triumphalism).
      *   **Habit:** Pass (Civic ritual).
      *   **Verdict:** **Very Good** (Comparable to (12) or (9)). It constitutes a public through shared truth.

