      *   *Rival Views:* This rules out luck egalitarianism (which would see inherited wealth and disability as equally arbitrary luck). It rules out UBI grounded in common ownership (which would treat dividends and welfare as similar social dividends). It rules out contributions accounting for unpaid care.
