      *   *Counterfactual:* Extending conditionality to capital reveals the operative principle was never reciprocity. If reciprocity were key, asset idleness would be as suspect as labor idleness. The resistance shows the principle is **Property Sovereignty**: ownership confers immunity from social scrutiny.
      *   *Conclusion:* This principle cannot be defended as justice (it violates formal equality). It is a fact about power and class stigma, protecting accumulated wealth from the democratic claims of need.

