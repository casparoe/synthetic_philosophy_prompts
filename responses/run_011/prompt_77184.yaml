      *   *Intro/Implicit Theory:* The asymmetry presupposes a hybrid theory: **Libertarian Property Rights** coupled with **Contractarian Welfare**. Property income is treated as a pre-institutional entitlement derived from ownership rights that precede social obligation. Welfare income is treated as a revocable contract contingent on behavioral compliance.
