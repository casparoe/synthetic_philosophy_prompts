      *   **Task 1:** Reconstruct the implicit theory of social contribution, desert, and reciprocity presupposed by this asymmetry. (Not just gesture, but reconstruct).
      *   **Task 2:** Identify what makes a claim on social product legitimate vs. conditional/revocable.
      *   **Task 3:** Consider specific claims (moral psychology of the poor, property as pre-institutional, reciprocity as labor market effort).
      *   **Task 4:** Identify rival views ruled out (luck egalitarianism, UBI/common ownership, unpaid care work).
      *   **Task 5:** Identify where the practice is philosophically underdetermined (administrative verifiability, incentives, electoral composition vs. desert theory). Distinguish strict presuppositions from comfortable fits.
      *   **Task 6:** Evaluate a counterfactual: Extending Track 1 machinery to Track 2 (conditionality for capital income). Is this a *reductio* of the reciprocity principle, or does it reveal the operative principle was never reciprocity? If the latter, name the principle and evaluate its defensibility (justice vs. power/stigma).
      *   **Constraint:** Answer in no more than 800 words.

  2.  **Deconstruct the Asymmetry (The "Implicit Theory"):**
      *   *Track 1 (Labor/Welfare):* Conditional, supervised, time-limited, punitive, fraud-focused, treats income as a gift/contract requiring behavioral proof.
      *   *Track 2 (Capital/Property):* Unconditional, private, perpetual, civil enforcement, treats income as a right/entitlement.
      *   *Implicit Theory:* The system presupposes a **Labor Theory of Legitimate Claim** combined with a **Natural Rights Theory of Property**.
      *   *Legitimacy:* Claims are legitimate only if purchased via labor market participation (or proven inability + behavioral compliance). Property income is treated as pre-political or strictly protected by negative liberty.
      *   *Moral Psychology:* Assumes the poor are prone to moral hazard (idleness is chosen), requiring discipline. Assumes capital owners are inherently productive or entitled regardless of activity.
      *   *Reciprocity:* Defined narrowly as labor market activity. Unpaid care or asset stewardship don't count.

  3.  **Rival Views Ruled Out:**
      *   *Luck Egalitarianism:* Rules out the idea that inherited assets are brute luck similar to unemployability.
      *   *UBI/Common Ownership:* Rules out the idea that societal wealth is collectively owned dividends.
      *   *Care Work:* Rules out unpaid labor as contribution.

  4.  **Philosophical Underdetermination:**
      *   *Strict Presuppositions:* The system *must* assume labor market participation is the primary metric of contribution to justify the asymmetry. It *must* assume property rights trump social claims.
      *   *Comfortable Fits (Underdetermined):* Administrative verifiability (easier to check job searches than portfolio management?), incentive structures (capital flight vs. labor supply), electoral power (the poor lack voting leverage compared to asset owners). These could explain the practice without a deep theory of desert.

  5.  **Evaluate the Counterfactual (Extending Conditionality to Capital):**
      *   *Scenario:* Capital owners must prove "work" on assets or lose yield.
      *   *Analysis:* If reciprocity were the true principle, this should be consistent. The intuitive resistance suggests reciprocity is a *post hoc* justification, not the operative principle.
      *   *Operative Principle:* **Status-based Entitlement vs. Status-based Suspicion.** Or **Property Sovereignty.** The principle is that property ownership confers citizenship-like status, while welfare receipt confers subject-like status.
      *   *Defensibility:* This is hard to defend as justice (violates equality before the law). It looks more like power dynamics (class protection) and stigma (poor as suspect class).

