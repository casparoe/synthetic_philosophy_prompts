prompt: |-
  Ok, kind of a weird request but I've fallen down a rabbit hole and I want your help. Some context first: I'm a second-year philosophy grad student TA-ing a seminar on medieval Jewish philosophy this term, and separately I do some part-time writing for a cultivated-meat startup — the kind that grows animal tissue in steel bioreactors from a cell line, so nothing gets slaughtered. Those two lives collided last week when our CTO, who's completely secular but reads a lot, asked me over lunch whether lab-grown lamb could be kosher, and I told him he was asking the boring version of the question. The interesting version is whether it could be an *offering*. My roommate thinks the whole thing collapses into the Ship of Theseus and I don't think he's right, but I couldn't explain why.

  Here's the thing I want you to write. Pretend a petition has been filed with a rabbinical court in Jerusalem by a biotech firm that has grown, in a bioreactor, about forty kilos of lamb muscle and fat tissue, from cells biopsied out of a living, unblemished male lamb; the tissue has never been an animal, never had a heart or a throat, and never bled. The firm wants to know whether this material could serve as the daily burnt offering, and separately as the Passover lamb, in a restored Temple service. The panel is two members: Maimonides and Nachmanides. Write it as a dialogue between them, roughly 1400 words, with the two of them actually arguing rather than delivering alternating monologues. You should assume the role of an expert in medieval Jewish philosophy and in philosophy of religion more generally, and before you write anything, do a short brainstorm — maybe six or eight lines — sketching the strongest case each man has *against* the petition and the strongest case each might surprisingly have *for* it, because that second column is the part I care about. I really don't want the obvious cartoon where Rambam is the cold rationalist who secretly wants sacrifices abolished and Ramban is the mystic who waves his hands at kabbalah; both of them should be shown as first-rate legal thinkers who care about the details of the service, and both should land real blows.

  The disagreement should do structural work, not decoration, so please make the two of them attack the petition from opposite directions. Rambam's side: his philosophical account of why the sacrificial cult was commanded at all — as something accommodated to a world saturated with sacrificial worship, where the point was to redirect it rather than abolish it — sits very awkwardly next to his legal code, which plainly expects the messianic king to rebuild the Temple and the offerings to resume. Have the petition force him to say whether a bloodless, painless, slaughter-free substitute is the natural fulfillment of his own theory or a betrayal of it; note that on his view the slaughter of exactly those species was the public inversion of what the idolaters held sacred, so ask him what's left of that gesture when nothing is killed. And don't let him off the hook on the technical points: there's a requirement that an offering be at least eight days old before it's acceptable, an owner who lays his hands on the animal's head, blood that gets dashed on the altar — does a vat of tissue have an age? Who is the owner? Ramban's side should press his actual objections: that offerings go back to the very beginning of the story, before there were any idolaters to cure anybody of anything, and his own positive account, which ties the offering to the person bringing it — thought, speech, and action, and the sense that this animal is standing in for him — plus a further level he deliberately declines to spell out. Let him decide whether a thing that was never alive can be a vehicle for any of that, or whether the absence of suffering makes it cleaner. I'd like the exchange to end at a genuine impasse where each concedes exactly one point to the other and they still split on the ruling. Two housekeeping things: don't put words in anybody's mouth as verbatim quotations from the Guide or the Mishneh Torah or Ramban's commentary — paraphrase, and if you're not sure of a source just talk about the idea instead; and keep the setting light, a couple of stage directions at most. This is for a reading group I run that's half philosophy students and half the Orthodox engineers from the startup, so it has to be legible to someone who's never read either of them without dumbing down the argument.
