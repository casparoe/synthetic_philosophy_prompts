prompt: |-
  Consider a practice in health law that puzzles me. A competent adult can execute a psychiatric advance directive — a so-called Ulysses clause — pre-authorizing treatment she expects to refuse during a future manic or psychotic episode, and instructing clinicians to disregard whatever refusals she voices at the time. Many jurisdictions treat such a directive as binding on the treating team over the patient's contemporaneous objections. Yet the same body of law generally allows a directive to be revoked at any time and in any manner by a patient who has capacity, and where capacity is unclear clinicians are commonly told to err toward present wishes. Adjacent to this, commercial law prices a change of mind instead: early-termination fees, non-refundable deposits, surrender charges on annuities.

  What view of agency, and of consistency across time, does the directive practice presuppose? Must honoring a Ulysses clause commit us to treating the patient as one temporally extended agent whose good is fixed by her earlier, considered judgment — so that a later reversal is a mistake to be corrected rather than fresh information to be respected? Which rival accounts does that rule out: well-being accruing to stages or moments rather than to whole lives, or the later, ill self as in some sense a different person? Is the free-revocation rule consistent with the same account, or does it quietly reintroduce the rival? And bearing in mind the familiar argument that an agent who can reverse her own prior choices at no cost can be led around a cycle of trades and drained, is the law's asymmetry between the patient and the contractor a philosophical inconsistency, or a difference in what each institution is for?

  Please distinguish what the practice strictly presupposes from what it merely sits comfortably with, identify where several competing theories would license the same rules, and say what would have to change in clinical practice if we adopted a stage-relative view of welfare.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Psychiatric Advance Directives (PADs) with "Ulysses clauses" (pre-authorized treatment despite future refusal).
      *   **The Puzzle:**
          *   Law allows PADs to bind future incompetent selves (overriding contemporaneous objections).
          *   Law *also* allows free revocation of directives by competent patients (and errs toward present wishes if capacity is unclear).
          *   Commercial law, by contrast, prices changes of mind (termination fees, etc.) to prevent cycling/exploitation.
      *   **Questions to Answer:**
          *   What view of agency and temporal consistency does the directive practice presuppose?
          *   Does it treat the patient as a temporally extended agent with a fixed "good"?
          *   Does it rule out rival accounts (stage-relative well-being, different personhood)?
          *   Is the free-revocation rule consistent with the binding directive rule, or does it reintroduce rivals?
          *   Is the asymmetry between patient law and commercial law a philosophical inconsistency or a functional difference?
          *   **Specific Constraints:** Distinguish what is *strictly presupposed* vs. what *sits comfortably*; identify where competing theories license the same rules; explain what would change in clinical practice under a stage-relative view.

  2.  **Analyze the Legal/ethical Framework:**

      *   *Ulysses Clause:* Based on the idea of "precedent autonomy." The "then-self" knows the "now-self" will be irrational. The "then-self" is the true agent.
      *   *Revocation:* Based on current autonomy. If you are competent *now*, your will prevails.
      *   *Tension:* If the PAD is binding because the "then-self" is the true agent, why can the "now-self" (if deemed competent) revoke it freely? If the "now-self" is competent, isn't *their* judgment the true one? The law says: Yes, *if* competent. But if incompetent, the PAD rules.
      *   *Commercial Law:* Prevents "money pumps." If I can change my mind for free, I might make irrational cycles. Contracts lock in commitment to ensure reliance interests and efficiency.

  3.  **Address the "View of Agency" (Question 1 & 2):**

      *   *Presupposition:* The practice presupposes a **Narrative/Extended View of Agency**. It values the "critical interests" (Dworkin) or "higher-order volitions" (Frankfurt) of the competent self over the "experiential interests" of the incapacitated self.
      *   *Temporal Consistency:* It assumes identity over time is strong enough to warrant binding the future self, *unless* the future self regains the specific capacity required to revoke.
      *   *Fixed Good:* It assumes there is a "true" set of values established during competence that defines the patient's good, even if the later self disagrees.

  4.  **Address Rival Accounts (Question 3):**

      *   *Stage-Relative Well-being:* (Parfit, etc.) Welfare belongs to time-slices. If the manic self is happy (even if delusional), forcing treatment reduces *that stage's* welfare. The Ulysses clause contradicts this *in practice* (because it overrides the stage), but does it *presuppose* the rejection of it? Strictly, it presupposes that *authority* lies with the competent stage, not necessarily that welfare is only whole-life. However, to justify overriding the manic self's suffering/objection, one usually needs a whole-life welfare view.
      *   *Different Personhood:* (Psychological discontinuity). If the manic self is a "different person," the PAD is one person binding another. The law treats them as the *same* legal person, but ethically, the Ulysses clause works best if they are the *same* agent. If they were different people, binding the later one would be assault. So, the practice *strictly presupposes* psychological continuity sufficient for moral responsibility/identity.

  5.  **Address the Revocation Rule (Question 4):**

      *   *Consistency:* The free-revocation rule seems to undermine the "fixed good" view. If the "true self" is the competent one, and the patient is currently competent, they can revoke. This is consistent.
      *   *The Gray Zone:* The prompt notes clinicians "err toward present wishes" where capacity is unclear. This *does* reintroduce the rival view (stage-relative authority). It suggests that current expression has prima facie weight, weakening the "fixed good" of the past.
      *   *Strict Presupposition:* The law strictly presupposes a **threshold view of capacity**. Above threshold = Current Self rules (Revocation allowed). Below threshold = Past Self rules (PAD binding). It doesn't necessarily solve the metaphysical question of identity, but it sets a procedural switch.

  6.  **Address Commercial Law Asymmetry (Question 5):**

      *   *Money Pump Argument:* In economics, free reversal allows exploitation. In healthcare, we *want* to allow reversal if the patient recovers capacity.
      *   *Inconsistency vs. Function:* It is a **functional difference**, not a philosophical inconsistency.
          *   *Contract Law:* Goal is efficiency, reliance, and exchange stability. Parties are presumed competent adults maximizing utility.
          *   *Health Law:* Goal is welfare and autonomy protection in the face of pathology. The "change of mind" in mania is not a preference shift; it's a symptom.
      *   *Philosophical nuance:* Commercial law assumes preferences are sovereign. Health law (in this context) assumes some preferences (psychotic ones) are corrupted. Therefore, pricing the change of mind in health law would be unethical (charging someone to be treated against their will during psychosis?).

  7.  **Address "Strictly Presupposes" vs. "Sits Comfortably" (Constraint):**

      *   *Strictly Presupposes:*
          1.  Distinction between competent and incompetent states is detectable (at least legally).
          2.  Precedent autonomy has normative weight over current non-autonomous wishes.
          3.  Legal identity persists through psychological disruption.
      *   *Sits Comfortably With:*
          1.  Whole-life welfare maximization (Dworkin's critical interests).
          2.  Frankfurtian hierarchical autonomy (higher-order desires rule).
      *   *Competing Theories Licensing Same Rules:*
          1.  *Substituted Judgment Standard:* We do what the patient *would* have wanted. (Compatible with PADs).
          2.  *Best Interests Standard:* We do what is medically best. (Compatible if treatment is medically necessary, even if PAD is just evidence).
          3.  *Risk Management:* Honoring PADs reduces liability.

  8.  **Address Stage-Relative Welfare Changes (Constraint):**

      *   If we adopted a stage-relative view (the manic self's happiness counts equally):
          *   Ulysses clauses would be presumptively invalid.
          *   Clinicians would have to weigh current distress heavily against future benefit.
          *   Treatment would require current assent (unless immediate danger to others).
          *   The "binding" nature would vanish; the PAD would become merely advisory evidence of past values.

  9.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Define the Ulysses clause context.
      *   *Section 1: Agency and Time.* Focus on Precedent Autonomy. The "Extended Self."
      *   *Section 2: Rival Accounts.* Discuss Stage-Relative vs. Whole-Life. Discuss Personhood.
      *   *Section 3: Revocation & Consistency.* The Capacity Threshold. The "Err toward present wishes" nuance.
      *   *Section 4: Commercial Law Asymmetry.* Function over metaphysics. The nature of "preference" in mania vs. market.
      *   *Section 5: Strict Presuppositions vs. Comfortable Fits.* (Crucial constraint).
      *   *Section 6: Clinical Implications of Stage-Relative View.* (Crucial constraint).

      *(Self-Correction during drafting)*: Be careful not to say the law *proves* one metaphysical view. The law is pragmatic. It *operationalizes* a view. The prompt asks what the practice *presupposes*.
      *Refining the Commercial Law point:* The prompt mentions "money pumps." I need to explicitly address why health law doesn't fear the money pump. Answer: Because the "cycle" isn't a rational preference shift; it's a pathology. Also, the goal isn't market efficiency.
      *Refining the Revocation point:* The prompt asks if free revocation reintroduces the rival. Yes, it prioritizes the *current* competent self over the *past* competent self. This creates a tension: Why is Competent Self T1 bound by Competent Self T0? Usually, T1 can revoke T0. The Ulysses clause is special because it anticipates T1 will be *incompetent*. So the revocation rule applies to *Competent* T1. This is consistent. The tension arises in the "capacity is unclear" zone.

  10. **Final Polish:** Ensure all parts of the prompt are answered directly. Check tone (philosophical, analytical). Ensure the distinction between "strictly presupposes" and "sits comfortably" is clear.

      *Plan:*
      1.  **Agency & Time:** Precedent Autonomy, Extended Agent.
      2.  **Rival Accounts:** Stage-relative welfare (ruled out in practice, not necessarily theory), Psychological Discontinuity (ruled out).
      3.  **Revocation:** The Capacity Threshold. Consistency holds if capacity is binary; frays if capacity is graded.
      4.  **Commercial Law:** Functional divergence (Pathology vs. Preference).
      5.  **Strict vs. Comfortable:** Categorize the philosophical commitments.
      6.  **Stage-Relative Practice:** Concrete clinical changes.

      *(Final check on "Strictly Presupposes"):* Does it *strictly* presuppose whole-life welfare? No. It could be based on rights (right to refuse when competent implies right to bind when incompetent). So whole-life welfare is "comfortable" but not "strict." Strict is "Normative Authority of Competence."

      *(Final check on "Competing Theories"):* Paternalism (Best Interests) could license the same outcome (treat the patient) but for different reasons than Autonomy (PAD). Need to mention this.

