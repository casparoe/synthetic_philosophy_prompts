answer: |-
  The practice of honoring psychiatric advance directives (PADs) with Ulysses clauses, while simultaneously permitting free revocation by competent patients, rests on a specific operationalization of autonomy rather than a single, unified metaphysical theory of the self. To disentangle the philosophical commitments from the pragmatic legal standards, we must distinguish between what the law *requires* to function and what theories *justify* it best.

  ### 1. Agency and Temporal Consistency
  The directive practice presupposes a **threshold view of normative authority** rather than a specific metaphysical view of personal identity. It operates on the principle of **precedent autonomy**: the judgment of a competent agent retains normative force after competence is lost, provided the agent established that intent while competent.

  *   **The Extended Agent:** The practice treats the patient as a temporally extended agent whose "good" is not merely the sum of momentary experiential states. By allowing the "then-self" to bind the "now-self," the law prioritizes **critical interests** (values, life projects, dignity) over **experiential interests** (immediate pleasure, absence of distress).
  *   **Consistency:** This does not strictly require that the patient's "good" is fixed eternally. It requires only that the *authority* to define that good resides in the competent state. The later reversal is treated as a mistake to be corrected *only if* the later self lacks capacity. If the later self regains capacity, the reversal is respected. Thus, the practice presupposes that **capacity is the switch** that transfers authority from the past self to the present self.

  ### 2. Rival Accounts and Exclusions
  Does this rule out rival accounts?

  *   **Stage-Relative Welfare:** The practice is **incompatible in application** with a strict stage-relative view of welfare (where only the current moment's experience counts). If welfare accrued only to the present stage, overriding a manic patient's refusal (which may feel subjectively correct or euphoric to them) to satisfy a past preference would be a net harm to the current stage. However, the law does not strictly *presuppose* a whole-life welfare theory; it could theoretically rest on a deontological right of the competent self to control future bodily integrity, regardless of welfare outcomes.
  *   **Psychological Discontinuity:** The practice **strictly rules out** a strong psychological discontinuity view (the "different person" theory). If the manic self were legally or morally a distinct person from the competent self, enforcing the PAD would constitute battery or false imprisonment of a third party. The law presumes sufficient psychological continuity to maintain legal identity and moral responsibility across the episode.

  ### 3. The Revocation Rule and Consistency
  The rule allowing free revocation by competent patients is **consistent** with the binding directive rule, provided capacity is binary and clearly assessable.

  *   **The Logic:** If Capacity = Present Authority, and No Capacity = Past Authority (PAD), then a competent revocation simply re-establishes Present Authority. There is no contradiction in saying, "Your past self binds your future incompetent self, but your present competent self binds everyone."
  *   **The Reintroduction of the Rival:** The inconsistency arises in the **gray zone** where clinicians are told to "err toward present wishes." This heuristic quietly reintroduces the stage-relative view. It suggests that the *expression* of the current self has prima facie weight, even when capacity is doubtful. This undermines the "fixed good" of the earlier judgment, implying that the current self's will is always the primary source of authority, and the PAD is merely evidence of what the current self *might* want if they could speak clearly.

  ### 4. Commercial Law Asymmetry: Inconsistency or Function?
  The asymmetry between health law (free revocation) and commercial law (termination fees) is a **difference in institutional function**, not a philosophical inconsistency.

  *   **The Money Pump Argument:** In commercial law, free reversal allows "money pumps" because preferences are assumed to be sovereign and rational. If I can trade A for B and B for A for free, I can be exploited. Pricing change ensures reliance and efficiency.
  *   **Health Law Context:** In psychiatry, the "change of mind" during a psychotic episode is not treated as a sovereign preference shift but as a **symptom of impaired agency**. Charging a patient to revoke a PAD during mania would be ethically untenable (exploiting pathology).
  *   **Functional Divergence:** Commercial law protects **reliance interests** between distinct parties. Health law protects **integrity interests** within a single party over time. The "cost" of changing one's mind in health law is not financial but clinical (the risk of harm); the law absorbs this risk to preserve the sanctity of current competence.

  ### 5. Strict Presuppositions vs. Comfortable Fits
  To clarify the philosophical landscape, we must separate what the practice *needs* from what *explains* it.

  **Strictly Presupposed:**
  1.  **Detectability:** It is possible, at least legally, to distinguish between competent and incompetent states.
  2.  **Continuity:** The legal person persists through the psychiatric episode (identity is maintained).
  3.  **Normative Hierarchy:** Competent judgment holds higher normative authority than incompetent judgment.

  **Sits Comfortably With (but not required by):**
  1.  **Dworkin's Critical Interests:** The view that integrity and long-term values outweigh immediate experiential welfare. (The law could work on rights grounds without this welfare calculus).
  2.  **Frankfurtian Autonomy:** The view that higher-order volitions (what I want to want) rule over lower-order desires. (The law works even if one rejects hierarchical models, relying simply on cognitive capacity).
  3.  **Whole-Life Welfare:** The idea that the life as a whole is the unit of moral concern. (Again, the law could be deontological).

  **Competing Theories Licensing the Same Rules:**
  1.  **Substituted Judgment:** We honor the PAD because it is the best evidence of what the patient *would* choose if competent.
  2.  **Best Interests (Paternalism):** We honor the PAD because treatment is medically necessary, and the PAD merely removes the legal barrier of consent.
  3.  **Risk Management:** We honor the PAD to avoid liability for neglecting a documented wish, regardless of the philosophical status of the self.

  ### 6. Clinical Practice Under a Stage-Relative View
  If we adopted a strict **stage-relative view of welfare** (where the well-being of the current moment is the sole moral currency), clinical practice would change fundamentally:

  1.  **Invalidation of Ulysses Clauses:** PADs could not be binding over contemporaneous objection. They would become merely advisory, akin to a family member's opinion.
  2.  **Presumption of Capacity:** The burden of proof would shift heavily toward finding capacity. Any expression of refusal, even if delusional, would carry significant weight as an expression of current welfare.
  3.  **Treatment Thresholds:** Involuntary treatment would be permissible *only* to prevent immediate physical harm to others or irreversible physical damage to the self, not to restore "long-term autonomy" or "critical interests."
  4.  **No "Erring" Toward Past Wishes:** Clinicians could not use the PAD to override current distress. If the manic patient is happy and refusing meds, forcing meds would be viewed as inflicting net harm on the current stage of the person, regardless of the future consequence.

  In sum, the current legal practice presupposes a **hierarchy of competence** within a **continuous legal person**. It avoids the money pump problem not by pricing revocation, but by denying the rationality of the revocation attempt during incapacity. It is only in the ambiguous zones of capacity assessment that the law betrays its commitment to the extended self, hedging its bets by listening to the voice of the present stage.
