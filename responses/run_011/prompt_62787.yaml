      *   **Context:** Draft paper titled "Karma Without Rebirth" for a workshop.
      *   **Constraints:** No background on karma/moral luck (assume knowledge). No references/bibliography. No "further reading." Just the argument.
      *   **Specific Instructions:** Rank tensions by severity. Identify which commitment must give/reformulate. Assess costs. Offer repairs if available *within* the system. Commit to a single revision recommendation. Audit the strongest reading of ambiguous formulations.
