      *   Can a thin notion of agency support *Basic* Desert (6)? Most skeptics say no. They say you get "Attributability" or "Answerability," but not "Basic Desert."
      *   *However*, the user wants to keep Basic Desert.
      *   *Alternative Fault Line:* **(1)/(3) vs. (5)**.
          *   (1)/(3): Karma is *my* residue, *my* character, *my* standing.
          *   (5): Karma falls *on others* (children).
          *   If karma is defined as *moral causation* (1) where action leaves a residue that matures into *experience* (1) fitted to it... whose experience? (3) says "the self who has to live them." (5) says "fall heavily on people who had no hand."
          *   This is a definitional clash. If the *ripening* is the suffering of the child, then the *agent* isn't the one inheriting the consequence in the shape of the self (3). The agent inherits the consequence of *having a suffering child*.
          *   This is repairable: The "ripening" for the agent is the *relationship* with the child. The "ripening" for the child is the *suffering*. But (5) calls the child's suffering the "matured consequences."
          *   This threatens the "Moral Causation" aspect (1). If the child suffers, that's just causal fallout. Why call it *Karma* (moral causation) for the child? (5) says "karmically connected."
          *   Actually, the stronger tension is **(6) Basic Desert** vs. **(7) Anti-Just-World + (5) Dispersed Ripening**.
          *   If I believe in Basic Desert (6), I believe people get what they deserve (in terms of blame/praise).
          *   If I believe in Dispersed Ripening (5), innocent people suffer due to others' karma.
          *   (7) says inferring desert from suffering is an error.
