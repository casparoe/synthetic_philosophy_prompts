answer: |-
  **Moderator:** Herr Kepler, welcome. It is 1619, and your *Harmony of the World* has just come from the press. You claim to have revealed the musical secrets of the spheres. But we are here to speak of the earth. You propose a reformed astrology, yet you strip away much of what the schools have taught for a thousand years. Let us begin with the angles themselves.

  **1. The Geometric Criterion**
  **Question:** In the *Harmony*, you argue that the only valid astrological aspects are those angular intervals that correspond to the side lengths of regular figures constructible by ruler and compass. You keep the conjunction, sextile, and square, but you add the quintile from the pentagon and dismiss much of the received tradition. Why must God's language be limited to what a human hand can draw with Euclidean tools?
  **Follow-up:** You will say that only these figures sing to the soul. But does this not imply that if a planet falls at an angle of, say, fifty degrees—a figure not exactly constructible—the heavens are silent? Is the cosmic harmony so fragile that it breaks upon the precision of a geometric construction?

  **2. The Zodiac and Houses**
  **Question:** You further assert that aspects obtain between the celestial positions themselves, regardless of where they fall in the sky. You treat the twelve signs of the zodiac and the divisions of the houses as mere conveniences for calculation, having no natural standing. If the signs are not real divisions of the ether, why have Ptolemy and the ancients tied the very natures of the planets to them?
  **Follow-up:** If I understand you, the sign of the Lion is no hotter than the sign of the Water-Bearer; it is merely a patch of sky marked by stars. If the signs possess no virtue of their own, does it not follow that the vast majority of almanacs printed in Augsburg and Venice are selling fictions to the common people?

  **3. The Mechanism of Influence**
  **Question:** Let us speak of cause. If the rays of the planets do not carry heat or moisture directly, and the signs are empty, what exactly strikes the newborn child? You suggest the heavens act upon the soul's own innate faculty for geometry. How does a configuration of distant lights awaken a geometric slumber within a human infant?
  **Follow-up:** You posit that the soul recognizes the configuration and thereby disposes the body. But if the soul is the active participant, perceiving the harmony rather than being battered by it, does this not make the astrologer a reader of souls rather than a reader of stars?

  **4. Inclination and Free Will**
  **Question:** This brings me to your Lutheran critics. They charge that any celestial influence compromises Christian liberty. You answer that the stars incline but do not compel. Yet if the soul can resist the aspect, on what grounds do you claim to predict the temperament of a man who may, by an act of will, resist his own nature?
  **Follow-up:** You distinguish between the brute beast, which follows appetite, and the rational soul, which may overcome it. But if a rational soul *can* overcome the aspect, and you cannot know in advance who will exercise that reason, is your prediction anything more than a guess about who will choose to be beastly?

  **5. Judicial Astrology**
  **Question:** You repudiate the judicial astrology of individual fortunes and elected times as superstitious. You say we cannot know the particular fate of a man from the stars. And yet, you continue to cast nativities for generals and princes. If the specific fortunes of individuals are beyond the reach of the aspects, what service are you performing for these patrons?
  **Follow-up:** You argue you are describing their temperament and the general weather of their lives, not their specific fate. But when a prince asks if he will win a battle, and you answer regarding his "martial humor," are you not allowing him to hear a promise of victory where you have offered only a description of his blood?

  **6. The Economic Necessity**
  **Question:** We must be plain about the support this work requires. You are fond of remarking that astrology is a beggarly daughter who keeps her mother astronomy from starving. Is this merely a witticism, or is it an admission that without the promise of fortune-telling, the Imperial Mathematician would have no bread?
  **Follow-up:** If the practice pays only because the patrons believe in the very judicial predictions you claim are false, does this not make your livelihood dependent on a popular error you claim to have corrected? Can truth truly be built upon a foundation of necessary deception?

  **7. Forecasting and Failure**
  **Question:** Let us turn to natural astrology: weather and epidemics. You claim your harmonic theory improves these forecasts. Yet the records show a manifest failure rate in predicting the seasons and the plagues. If the theory of harmonic configurations is true, why is the correspondence with the weather so often missed?
  **Follow-up:** You will reply that the differing responses of differing individual souls and local terrains complicate the matter. But if every failure can be explained away by the complexity of the soul or the locality, is there any observation of the weather whatsoever that could tell against your theory?

  **8. The Definition of Astrology**
  **Question:** Consider the sum of your reforms. You strip away the signs, the houses, and the traditional natures and rulerships of the planets. You retain only the geometric angles and the soul's reaction. A critic might say that a practice stripped of these elements is no longer astrology in any recognizable sense. Have you not merely vindicated a piece of natural philosophy concerning geometry and the air?
  **Follow-up:** You insist this is a purification, returning astrology to its true natural basis. But if you remove the traditions that define the art, by what right do you still call it astrology? Are you not simply borrowing the prestige of the old name to sell a new philosophy?

  **9. The Scope of Harmony**
  **Question:** In *Harmonices Mundi*, you link these aspects to musical intervals and the speeds of the planets. Is the harmony you describe a literal sound, or is it a metaphorical proportion perceived only by the intellect? If it is not sound, how does it move the humors of the body, which are gross and material?
  **Follow-up:** You argue that the soul stands between the gross body and the ethereal heavens, translating the proportion into humor. But if this translation is invisible and intangible, are we not asked to believe in a chain of causation that vanishes at every link where we might try to grasp it?

  **10. The Possibility of Error (Closing)**
  **Question:** We close with a matter of principle. You contend that your reformed astrology rests on the certain foundations of geometry and divine institution. What, then, would you count as evidence that this system has no natural foundation whatsoever? What observation would force you to lay down the astrolabe?
  **Follow-up:** I anticipate you will say that the fault lies not in the geometry, which is divine, but in our imperfect observations or the impurity of the human soul receiving the rays. But if the geometry is divine and the soul is the variable, does this not place your theory beyond the reach of any earthly refutation, making it an article of faith rather than natural philosophy?
