answer: |-
  ### 1. Question Stem

  **Course:** Causal Inference for Reliability Engineering (Final Session)
  **Time:** 60 Minutes
  **Total Marks:** 30

  **Scenario:**
  Our deployment pipeline ships a canary build. Two independent checks watch it.
  1.  **Automated Monitor:** Issues a rollback when the error rate crosses a threshold.
  2.  **On-Call Engineer:** Watches the same dashboard and can manually issue a rollback.

  A deduplication policy accepts only one rollback command. If the Monitor has already issued one, any later command from the Engineer is discarded before it reaches the deployment controller.

  **The Incident:**
  A bad build ships. The Monitor fires at 02:14; the rollback succeeds. The Engineer noticed the spike, reached for the command at 02:15, and was silently suppressed by the deduplication layer.
  *   **Feature A (Timing):** The Monitor's threshold had been lowered by a configuration change the previous afternoon. This caused the Monitor to fire roughly ninety seconds earlier than it otherwise would have.
  *   **Feature B (Frequency):** The incident review blamed our deployment frequency (forty times a day). The reviewer claims this rate is what made a bad build reach the canary. However, nobody can describe an intervention on "deployment frequency" that is not simultaneously an intervention on team size, release tooling, on-call staffing, and the product roadmap.

  **Questions:**

  **(a) Preemption and Cause (10 Marks)**
  Using both a counterfactual account (e.g., Lewis-style) and an interventionist account (e.g., structural equations), determine whether the Engineer caused the rollback. Explain why the verdict is the same or different across the two frameworks. Specifically, address why the rollback occurring does not counterfactually depend on the Monitor firing, yet we still identify the Monitor as the cause.

  **(b) Timing and Variables (10 Marks)**
  Regarding Feature A: Did the configuration change cause the *rollback* or merely the *timing* of the rollback? Are these distinct causal facts?
  Regarding Feature B: Can "deployment frequency" be treated as a valid intervention variable ($do(\text{Frequency})$) in a structural model? Justify your answer based on the definition of an intervention, not merely on the presence of confounding.

  **(c) Metaphysics vs. Method (10 Marks)**
  Your colleagues often say, "Causation is just about interventions, full stop." Based on your analysis above, decide: Do the structural (Pearl-style) and philosophical (Woodward/Lewis-style) frameworks ever genuinely disagree about the *truth* of a causal claim, or do they only disagree on notation and modeling convenience? Defend your position. If they do disagree on truth, specify precisely where the disagreement lies (e.g., in the verdict, or in the conditions for making a verdict).

  ---

  ### 2. Model Answer

  **Candidate ID:** [Strong Participant]
  **Time Taken:** 55 Minutes

  **(a) Preemption and Cause**
  The Engineer did not cause the rollback. This is a case of preemption. In a simple counterfactual account, causation requires dependence: if $C$ had not occurred, $E$ would not have occurred. Here, if the Monitor ($M$) had not fired, the Engineer ($E$) would have fired at 02:15, and the rollback ($R$) would still have occurred. Thus, $R$ does not counterfactually depend on $M$. Simple counterfactual theory fails here.

  However, both structural equation models (SCM) and refined interventionist accounts solve this by looking at the *process*, not just the outcome. In an SCM, we represent the deduplication logic explicitly. Let $R = M \lor (E \land \neg M)$. In the actual world, $M=1$, so the second term is 0. The structural equation shows $M$ is the active parent of $R$. The Engineer's potential contribution is structurally blocked. Interventionally, if we hold $E$ fixed at "attempted" and intervene $do(M=0)$, $R$ still occurs (via $E$). But if we hold $E$ fixed at "did not attempt" (the actual state of the effective command) and intervene $do(M=1)$, $R$ occurs. The cause is the variable that actually transmitted the signal. Both frameworks agree: the Monitor caused the rollback; the Engineer was a preempted backup. The agreement arises because both frameworks prioritize the actual mechanism over mere counterfactual dependence in preemption cases.

  **(b) Timing and Variables**
  Regarding Feature A: The configuration change caused the *timing*, not the *occurrence*. Causal claims are sensitive to event individuation. If "Rollback" is defined as the boolean occurrence, the config change is not a cause (the rollback would have happened anyway via the Engineer or the Monitor's default threshold). If "Rollback" is defined as the specific event occurring at 02:14, the config change is a cause. These are distinct causal facts because interventions on the config change alter the time variable but not the boolean outcome variable. Conflating them leads to incorrect credit assignment in post-mortems.

  Regarding Feature B: "Deployment frequency" cannot be treated as a valid intervention variable ($do(\text{Frequency})$) without severe qualification. An intervention requires that we can set the variable to a value independently of other causes in the model. Here, frequency is constitutively tied to team size, tooling, and roadmap. To change frequency is to change these parents. Therefore, there is no external "knob" for frequency. In SCM terms, the variable is not exogenous; it is a summary statistic of deeper structural variables. Treating it as a direct intervention variable violates the modularity assumption. The reviewer's claim is metaphysically suspect because it treats a high-level abstraction as a manipulable force.

  **(c) Metaphysics vs. Method**
  The claim that "causation is just about interventions" obscures a genuine disagreement about truth conditions. The structural (Pearl-style) and philosophical (Woodward-style) frameworks agree on the *logic* of inference given a model, but they disagree on what makes a model *correct*.

  SCM treats the graph as a given representation. If the equations say $X \to Y$, then $X$ causes $Y$ relative to that model. It is a syntactic engine. Interventionism, however, makes a metaphysical demand: a causal claim is true only if there exists a possible intervention that satisfies specific independence conditions. In the Deployment Frequency case, SCM might allow us to draw an arrow from Frequency to Incidents and calculate a coefficient. Interventionism says this arrow is false because no valid intervention exists.

  Therefore, they do disagree on truth. SCM says "Relative to model M, yes." Interventionism says "Absolutely no, because M is invalid." The disagreement is not notation; it is about whether causal truth is relative to a model or constrained by physical manipulability. For engineers, this matters: SCM permits reasoning about unmanipulable variables (like "frequency") as long as the math holds; Interventionism forbids it. I side with Interventionism here. Allowing unmanipulable variables as causes invites the error of treating correlations of summaries as leverage points. We should only assert causation where intervention is possible. Thus, the frameworks disagree on the truth of the Frequency claim: SCM tolerates it; Interventionism rejects it.

  ---

  ### 3. Marking Scheme

  **Part (a): Preemption and Cause (10 Marks)**
  *   **2 Marks:** Correctly identifies the scenario as preemption (Monitor preempts Engineer).
  *   **3 Marks:** Explains why simple counterfactual dependence fails (Rollback would have happened anyway).
  *   **3 Marks:** Uses structural equations or process logic to show why Monitor is still the cause (actual path vs. backup path).
  *   **2 Marks:** Explicitly states that both frameworks agree on the verdict *in this specific case* because the mechanism is well-specified.

  **Part (b): Timing and Variables (10 Marks)**
  *   **3 Marks:** Distinguishes between causing the *occurrence* (boolean) vs. the *timing* (continuous/event-specific).
  *   **2 Marks:** Identifies these as distinct causal facts dependent on variable definition.
  *   **5 Marks:** Argues that "Deployment Frequency" is not a valid intervention variable because it lacks independent manipulability (cannot change frequency without changing confounders/parents). Credit for citing the modularity/exogeneity requirement.

  **Part (c): Metaphysics vs. Method (10 Marks)**
  *   **4 Marks:** Takes a definitive stance (Agree or Disagree on truth) without shrugging.
  *   **3 Marks:** Locates the disagreement correctly: not in the calculus, but in the validity conditions for the model/variables.
  *   **3 Marks:** Uses the Frequency example to illustrate the disagreement (SCM allows it; Interventionism forbids it).

  **Specific Errors (Deduct 2 Marks Each, Max 10)**
  1.  **The Metaphysical Operator:** Treating `do(X)` as a physical force or metaphysical relation rather than an operation defined relative to a specific model specification.
      *   *Diagnosis:* Confuses the syntax of intervention with the ontology of causation.
  2.  **The Universal Agreement Error:** Assuming that because the frameworks agree on the Monitor/Engineer verdict, they must agree on all causal claims (e.g., Frequency).
      *   *Diagnosis:* Fails to distinguish between agreement on logic vs. agreement on variable validity.
  3.  **The Timing Conflation:** Claiming the config change caused the rollback without qualifying that it specifically caused the *timing*, or denying it caused anything because the rollback was inevitable.
      *   *Diagnosis:* Fails to individuate events correctly (token vs. type causation).
  4.  **The Preemption Verdict:** Claiming the Engineer caused the rollback (either fully or partially) because they were ready to act.
      *   *Diagnosis:* Misunderstands preemption; readiness without effect transmission is not causation.
  5.  **The Frequency Validity:** Treating "Deployment Frequency" as a valid intervention variable simply because it correlates with incidents, ignoring the inability to isolate it from team size/tooling.
      *   *Diagnosis:* Confuses predictive power with causal manipulability.

  ---

  ### 4. Instructor's Note

  **To:** Seminar Lead
  **From:** Philosophy Consultant
  **Re:** Scenario Validity and Adjudication

  **1. Scenario Assessment**
  Your scenario is robust. It successfully isolates three distinct causal problems: preemption (Monitor vs. Engineer), event individuation (Timing vs. Occurrence), and variable validity (Frequency). It prevents students from retreating to "correlation is not causation" because the correlations are clear; the trouble is structural. The only risk is students spending too much time on the narrative rather than the structural abstraction, but Part (c) forces the meta-analysis.

  **2. Early vs. Late Preemption**
  You and your colleague are debating a classic distinction.
  *   **Early Preemption:** The backup process is cut off *before* it completes its causal chain.
  *   **Late Preemption:** The backup process completes, but the effect is already secured by the primary cause (e.g., two rocks thrown, both reach the window, but one hits first).

  **Verdict:** This is **Early Preemption**.
  The Engineer's command was "discarded before it reaches the deployment controller." The causal chain for the Engineer is: *Notice → Reach → Issue → Controller → Rollback*. The Monitor's chain completed. The Engineer's chain was interrupted at the "Controller" stage. The effect (Rollback) was produced by the Monitor's signal arriving at the Controller. The Engineer's signal never arrived. Therefore, the Engineer's process was incomplete. Your colleague is incorrect; the deduplication layer acts as a blocker *before* the effect is realized, making it Early Preemption. If the Engineer's command had reached the controller but was ignored because the system was already rolling back, that would be Late Preemption.

  **3. The Blocked Engineer**
  The defensible verdict is that the Engineer **did not cause the rollback**.
  Causation requires the transmission of influence. The Engineer was a *potential* cause, but the actual causal path ran through the Monitor. In reliability engineering, this distinction is vital: if you blame the Engineer for not acting, you miss the fact that the system worked as designed (Monitor fired). If you credit the Engineer, you obscure the value of the automation. The counterfactual "If not Monitor, then Engineer" establishes the Engineer as a *backup*, not a cause of the actual event.

  **4. The Meta-Question (Part c)**
  Your instinct is correct: the frameworks often agree on verdicts in clean cases (like the Monitor) but diverge on "messy" variables (like Frequency). The Model Answer takes the position that they disagree on **truth conditions for variable validity**. SCM is permissive (you can model anything); Interventionism is restrictive (you can only model what you can wiggle). This is the crux you want them to find. If they say "they are the same," they haven't engaged with the Frequency problem. If they say "they disagree on the Monitor," they haven't understood the math. The Frequency variable is the wedge.

  **5. Final Advice**
  When grading, watch for the "Shrug." Engineers love to say "It depends on the model." Push them to say *what* about the model makes it true. Is it the fit to data (SCM) or the possibility of manipulation (Interventionism)? That is the thirty-mark distinction.
