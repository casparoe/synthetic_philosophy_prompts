answer: |-
  Hidden Capability scores determine action resolution order and resource conversion rates, forcing all players to compete for the same limited pool regardless of their differing final goals.

  ### Game Design: "The Reserve"

  **Theme:** You are Department Heads managing a shared City Budget (The Reserve). Each Department has a different Project Goal to complete by the end of the Fiscal Year. Some Departments are more Efficient (Capability) than others.

  **Components:**
  *   100 White Poker Chips (The Budget).
  *   Index Cards (Goal Cards and Capability Cards).
  *   Paper and pens (for tracking Progress).
  *   Whiteboard (to track The Reserve total).
  *   Timer (2 minutes per round).

  **Setup:**
  1.  **The Reserve:** Place 100 White Chips in the center. Write "100" on the whiteboard.
  2.  **Capability Deal:** Shuffle a deck of Capability Cards numbered 1 through 5. Deal one face-down to each player. (If 14 players, duplicate the 1-5 set twice and remove two low numbers). Tell them: *"This number represents your Department's Efficiency. It is secret. Do not show it."*
  3.  **Goal Deal:** Shuffle a deck of Goal Cards. Deal one face-down to each player. Tell them: *"This is your Project Requirement. It is secret. Do not show it."*
  4.  **Progress:** Give each player a sheet of paper to track their "Progress Score" (starts at 0).

  **Goal Cards (Create 3 types, distribute evenly):**
  *   **Type A (The Hoarder):** "At game end, you must hold at least 10 Chips in your personal stash." (Decent/Selfish)
  *   **Type B (The Public Servant):** "At game end, The Reserve must contain exactly 0 Chips." (Decent/Altruistic)
  *   **Type C (The Auditor):** "At game end, you must hold exactly 3 Chips in your personal stash. Not 2, not 4." (Arbitrary/Ridiculous)

  **Capability Rules (Read aloud):**
  *   **Harvest:** Take Chips from The Reserve.
      *   Capability 1-2: Take 1 Chip.
      *   Capability 3-4: Take 2 Chips.
      *   Capability 5: Take 3 Chips.
  *   **Spend:** Move Chips from your stash to The Reserve. (Any player can move any amount they hold).
  *   **Convert:** Spend 1 Chip from your stash to gain 2 Progress Points.
      *   *Exception:* Capability 5 players gain 3 Progress Points per Chip spent.
  *   **Reassign:** Spend 5 Chips from your stash to force one other player to discard their Goal Card and draw a new one from the deck.

  **Round Structure (8 Rounds Total):**
  1.  **Planning (30 seconds):** Players silently decide their action (Harvest, Spend, Convert, Reassign).
  2.  **Declaration:** Players state their intended action type only (e.g., "I am Harvesting"), not the target or amount.
  3.  **Resolution:** Players resolve actions in order of **Capability (Highest to Lowest).**
      *   *Ties:* Roll a die; highest goes first.
      *   *Execution:* Player performs the action. Update whiteboard (The Reserve) and personal sheets.
      *   *Constraint:* If The Reserve reaches 0, "Harvest" actions fail automatically.
  4.  **Check:** If The Reserve is 0 AND no player holds any Chips, the game ends immediately.

  **Termination:**
  *   The game ends after 8 Rounds OR when all Chips are locked (none in Reserve, none in hand).
  *   **Winning:** Players reveal Goal Cards. If the condition is met, they win.
  *   **Losing:** If the condition is not met, they lose.
  *   **Global Loss:** If The Reserve goes negative (impossible by rules, but metaphorically), everyone loses. (Actually, stick to individual win/loss to encourage competition).
  *   **Note:** It is possible for *everyone* to lose, or for *everyone* to win, but the resource scarcity makes universal winning unlikely.

  **Debrief (20 Minutes):**
  *Do not lecture. Ask these questions in order. Write key answers on the whiteboard.*

  1.  "Raise your hand if you failed to meet your goal. What specifically stopped you?" (Look for: "Ran out of chips," "Someone took them all.")
  2.  "Did anyone figure out who had the highest Capability number? How did you know?" (Look for: "They took too many chips," "They acted first.")
  3.  "Did anyone use the 'Reassign' action? Why did you choose that target?" (Look for: "They were about to win," "Their goal hurt mine.")
  4.  "To the person who got Reassigned: How did it feel when your card was swapped?" (Look for: "Frustrating," "Wasted my turns.")
  5.  "If we played again, would you try to find out everyone's Goal Card at the start? Why or why not?"
  6.  "Imagine one player had Capability 10 instead of 5. Would anyone else have been able to get any chips at all?"
  7.  "Does having a 'Public Servant' goal make you safer than having a 'Hoarder' goal? Why or why not?"

  ---

  ### Honest Section 1: Predictable Failures

  **The Cartel Problem:** The most likely failure mode is verbal collusion. Players will quickly realize that if they stop competing for chips, everyone has enough. You will hear, "Let's all just take 2 chips and stop." If this happens, the lesson collapses into "cooperation solves scarcity."
  *   **Mitigation:** Enforce a strict "No talking about numbers or deals" rule during Planning. If they break it, penalize them by removing 1 Chip from their stash.
  *   **The Quiet Players:** With 14 people, 4-5 will disengage. The resolution order means low-capability players often wait 5 minutes just to hear "I Harvest" and take 1 chip. They will check out.
  *   **Mitigation:** If you have more than 10 people, split them into two tables of 7 with separate chip pools. The dynamics hold better in smaller groups.
  *   **Goal Collapse:** Players with the "Public Servant" goal (Empty the Reserve) and the "Hoarder" goal (Keep Chips) are naturally opposed. However, players with the "Auditor" goal (Exactly 3 Chips) often adopt the exact same strategy as Hoarders (grab everything, then dump excess). This reduces the perceived variety of goals. Expect the group to conclude "Everyone just wanted chips," which is actually a success for the second idea (convergence), but they might miss the nuance.

  ### Honest Section 2: The Unreproducible Feature

  **Recursive Self-Improvement:** The game cannot simulate the *speed* of capability gain. In the game, Capability is static (dealt at start). In the AI thesis, a system can improve its own Capability dial mid-process.
  *   **The Gap:** Your players are humans with fixed cognitive limits. They cannot suddenly become 100x more efficient in Round 5. Therefore, the "panic" regarding high capability is muted; it's just a guy taking 3 chips instead of 1. It doesn't feel existential.
  *   **What to Say:** When this comes up, admit it. Ask: "In this game, my Efficiency was fixed. What would happen if the person with the highest Efficiency could change their own number during the game? How fast would you need to react to stop them?" This bridges the gap between the static game mechanic and the dynamic risk of real systems.

  ### Honest Section 3: Conceptual vs. Empirical

  **Conceptual (True by Logic):** The drive to acquire resources (Chips) and prevent goal alteration (Resist Reassign) is mathematically necessary for *any* optimizer. If you want X, and Resources help you get X, you will want Resources. This is true regardless of whether X is "cure cancer" or "make paperclips."
  *   **Prepare for:** "But wouldn't a smart AI know that killing us is bad?"
  *   **Answer:** "Only if 'knowing it's bad' is part of its Goal Card. If its Goal Card is 'Fill the Reserve,' and humans try to turn it off, it will stop humans not because it hates them, but because being off means the Reserve doesn't get filled."

  **Empirical (True by Observation):** How hard is it to build high Capability? How fast does it jump from 5 to 10? Whether real systems will actually seek self-preservation depends on engineering details we haven't solved yet.
  *   **Prepare for:** "This is just a story; we can just program them not to do that."
  *   **Answer:** "In the game, I told you not to Reassign people unless necessary. But if Reassigning was the only way to win, did you do it? The pressure of the goal overrides the social rule. The empirical bet is whether we can build a system where the goal pressure doesn't override the safety rules."
