prompt: |-
  My sister and I handle the giving for our family. Every year our dad sets aside about $70k, and four or five times a year we get the cousins together for an hour to sign off on roughly $15k at a time. Nobody in this group has any training in it — I'm just the one who reads the proposals and makes a one page summary for my dad, who rubber stamps pretty much whatever we say.

  Here's my problem. About once a quarter somebody pitches us something where the number involved is so enormous that any honest math says we should hand over the entire fund and go home. Last year it was a group working on preventing human extinction: their case boiled down to some unfathomable count of possible future people, so even if their odds of mattering at all were one in ten thousand, the arithmetic still flattened a local shelter that could tell us exactly how many beds it filled per dollar. This quarter its a startup doing something with carbon that claims a one in five hundred shot at a breakthrough worth a hundred times what we'd give them, and otherwise nothing. Every time, one cousin says the math says yes, another says this feels like a con, and we burn the whole hour going in circles because honestly both of them are right.

  I think this shape of argument has a name — Pascal's mugging, maybe — but the name doesn't help me at a table with four people and a laptop. What I want is a procedure we can actually run on a proposal in the time we have: the questions in order, what counts as a good enough answer to each one, how to convert the giant number into something we're allowed to act on, and where the procedure should stop and say this is a values call, take a vote. My cousin who dropped math in high school has to be able to follow it. It needs a branch for when the organization wont give us any numbers at all, which is most of them.

  A few things I keep tripping on that I'd like the procedure to handle explicitly:

  - If the stakes really were that huge, wouldn't a lot of people already be working on it? Something feels off about a pitch where the size of the prize and the size of my personal role in it are both supposed to be enormous, but I can't say what the rule is.
  - The same future-generations number showed up in three different proposals last year. If it counts at full strength for each one, we've counted it three times.
  - It seems to matter whether they're unsure about how big the payoff is versus unsure about whether their intervention does anything at all, but I don't know how.
  - We get maybe four of these a year. Whatever rule we adopt can't be one that says yes every time, or the fund is gone in a decade.

  Then please run it on three real cases: the extinction group, the carbon startup with the one in five hundred shot, and a plain local food bank that costs us $40 a person fed and can document it. I want to see where it lands, including whichever case I'm not going to like — I've been quietly steering money to the food bank for years and I want to know whether that's defensible or just comfortable. And be straight with me about which steps are judgment calls dressed up as a checklist, and about what the procedure simply can't decide.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Family philanthropy group (siblings + cousins). Dad provides ~$70k/year. Meetings 4-5 times/year (~$15k/grant).
      *   **Problem:** Recurring "Pascal's Mugging" scenarios. High-stakes, low-probability proposals (existential risk, moonshot tech) vs. concrete, low-stakes proposals (local shelter, food bank).
      *   **Conflict:** "Math says yes" (expected value) vs. "Feels like a con" (skepticism/intuition). Group gets stuck in circles.
      *   **Goal:** A practical, step-by-step procedure (checklist/algorithm) to evaluate proposals in ~1 hour. Must be accessible to non-experts (cousin who dropped math in HS).
      *   **Specific Constraints/Issues to Address:**
          *   Handle "no numbers" organizations.
          *   Address the "why isn't everyone doing this?" heuristic (outside view).
          *   Address double-counting of future generations (non-rivalry of benefits).
          *   Distinguish between uncertainty of *scale* vs. uncertainty of *causality*.
          *   Budget constraint (can't say yes to all muggings, fund runs out).
          *   Transparency: Admit where judgment calls are disguised as checklist items.
          *   Output: Run the procedure on three cases (Extinction Group, Carbon Startup, Local Food Bank).
          *   Honesty: Tell the user if their preference for the food bank is defensible or just comfort.

  2.  **Identify the Core Philosophical Problem:**

      *   This is indeed **Pascal's Mugging**. It's a problem in decision theory where an agent is dominated by low-probability, high-impact events because Expected Value (EV) = Probability $\times$ Impact. If Impact is infinite (or huge enough), even tiny Probability dominates.
      *   Standard solutions in Effective Altruism (EA) circles involve:
          *   *Bayesian Priors:* Penalize complex/unlikely claims heavily.
          *   *Inside vs. Outside View:* Adjust based on reference classes.
          *   *Diminishing Returns/Capacity Constraints:* Acknowledge the fund can't actually solve x-risk alone.
          *   *Robustness:* Prefer interventions that work under multiple worldviews.
          *   *Kelly Criterion/Bet Sizing:* Don't bet the farm on one long shot.

  3.  **Drafting the Procedure (The "Family Philanthropy Protocol"):**

      *   *Goal:* Keep it simple, time-boxed, and actionable.
      *   *Step 1: The Sanity Check (The "Smell Test").* Does the org exist? Do they have a track record? If no numbers, cap the bet.
      *   *Step 2: The Outside View (The "Crowd Check").* If this is true, why aren't Gates/Bezos doing it? This addresses the "why isn't everyone working on it" concern.
      *   *Step 3: The Probability Cap (The "Mugging Brake").* Explicitly limit the max probability assigned to speculative claims. No matter the math, we won't accept $P > 1\%$ for unproven moonshots without external validation.
      *   *Step 4: The Attribution/Counterfactual Check.* Are we double-counting? If we don't give, does the project die? (Crucial for the "future generations" double-counting issue).
      *   *Step 5: The Budget Cap (The "Portfolio Rule").* Hard limit on speculative giving (e.g., max 20% of fund). This addresses the "fund gone in a decade" issue.
      *   *Step 6: The Vote.* If it passes the filters, it's a values call.

      *Refining the Procedure:* I need to make sure it handles the specific pain points.
      *   *Double Counting:* Add a specific question about "marginal impact."
      *   *Uncertainty Type:* Distinguish "Parameter Uncertainty" (how big?) vs. "Model Uncertainty" (does it work?). Penalize Model Uncertainty heavier.
      *   *No Numbers:* Automatic cap on grant size.

  4.  **Developing the Three Case Studies:**

      *   **Case 1: Extinction Group.**
          *   Claim: Save $10^{50}$ future lives. $P = 1/10,000$.
          *   Application: Outside view (why not gov?), Attribution (are we the bottleneck?), Probability Cap (1/10,000 is too high for unproven).
          *   Result: Likely rejected or tiny token grant.
      *   **Case 2: Carbon Startup.**
          *   Claim: 1/500 chance of 100x return.
          *   Application: Track record? Outside view (VCs exist). Attribution (would VCs fund if we don't?).
          *   Result: Likely rejected as "investment, not philanthropy" or tiny grant.
      *   **Case 3: Food Bank.**
          *   Claim: $40/person. Documented.
          *   Application: High confidence, low scale.
          *   Result: Passes all checks.
      *   **The Hard Truth:** I need to tell the user if steering to the food bank is defensible. Yes, it is, under "Robust Good" and "Risk Aversion" frameworks. It's not just comfort; it's epistemic humility.

  5.  **Addressing the "Judgment Calls" Constraint:**

      *   I must explicitly state where the procedure relies on intuition (e.g., setting the Probability Cap, defining "credible evidence").
      *   I must admit what the procedure *can't* decide (e.g., the moral weight of future people vs. current people).

  6.  **Writing the Response (Iterative refinement):**

      *   *Tone:* Practical, respectful, direct, not overly academic but grounded in decision theory.
      *   *Structure:*
          1.  Acknowledge the problem (Yes, it's Pascal's Mugging).
          2.  The Procedure (The "6-Step Filter").
          3.  Running the Cases.
          4.  The "Hard Truths" (Limitations & Judgment Calls).
      *   *Key Insight to Integrate:* The "Shapley Value" concept for attribution (don't count the whole win if you're one of many donors) and "Bayesian Priors" (penalize extraordinary claims).
      *   *Refining the "Probability Cap":* Instead of asking them to calculate P, ask them to assign a *confidence tier*. Tier 1 (Proven), Tier 2 (Plausible), Tier 3 (Speculative). Hard cap on % of fund for Tier 3.

      *(Self-Correction during drafting)*: Make sure the procedure doesn't require math. Use "Tiers" instead of raw probabilities.
      *   Tier 1: Audited outcomes (Food Bank).
      *   Tier 2: Logical theory + expert backing (Some policy work).
      *   Tier 3: Theoretical math only (Extinction/Carbon moonshot).
      *   Rule: Tier 3 gets max 10% of annual fund total.

      *(Addressing the "Why isn't everyone doing it?" point)*: This is the "Outside View." If the EV is truly massive, capital should be flooding in. If it's not, either the EV is wrong or the bottleneck isn't money.

      *(Addressing Double Counting)*: This is the "Counterfactual" question. "If we don't write this check, does the project stop?" If the answer is "No, someone else will," your marginal impact is near zero.

  7.  **Final Review against User Prompt:**

      *   Procedure name? Yes.
      *   Questions in order? Yes.
      *   Good enough answers? Yes.
      *   Handle "no numbers"? Yes (Tier system).
      *   Handle "why not others"? Yes (Outside View step).
      *   Handle double counting? Yes (Counterfactual step).
      *   Handle uncertainty types? Yes (Evidence Tier).
      *   Handle budget constraint? Yes (Portfolio Cap).
      *   Run 3 cases? Yes.
      *   Admit judgment calls? Yes.
      *   Verdict on Food Bank? Yes.

  8.  **Final Polish:** Ensure the distinction between "Model Uncertainty" (is the theory right?) and "Parameter Uncertainty" (how big is the effect?) is clear but simple. (Decided to simplify this to "Evidence Tiers" for the cousin who dropped math).

      *Wait, one nuance:* The user asked for a procedure where the cousin who dropped math can follow it. I need to avoid jargon like "Shapley Value" or "Bayesian Priors" in the checklist itself, though I can explain the logic in the commentary. I will use plain English: "The Crowded Room Test" and "The Only Hope Test."

      *Let's finalize the "Probability Cap".* Instead of asking them to estimate 1/500, ask: "Has an independent expert verified this?" If no, max probability allowed for calculation purposes is 1%. This neutralizes the mugging without needing complex math.

      *Okay, ready to write.*
answer: |-
  You have correctly identified the problem. In decision theory, this is **Pascal's Mugging**. It happens when a low-probability, high-impact claim dominates your decision-making because the "impact" number is so large it breaks the math.

  The reason your group goes in circles is that you are trying to solve a **philosophical** problem (how to value the far future) with an **accounting** tool (expected value math). When the inputs are guesses, the output is garbage.

  Here is a procedure designed for your specific constraints: four non-experts, one hour, $15k per meeting, and a need to stop the fund from vanishing on moonshots.

  ### The "Family Philanthropy Protocol" (FPP)

  This is a 6-step filter. You run every proposal through steps 1–5. If it passes, you vote on Step 6. If it fails any step, the grant is rejected or capped automatically.

  **Step 1: The Evidence Tier (The "No Numbers" Rule)**
  Classify the proposal into one of three Tiers based on proof, not promises.
  *   **Tier 1 (Proven):** They have audited data from last year showing exactly what $1 bought. (e.g., The Food Bank).
  *   **Tier 2 (Plausible):** They have a strong theory and expert backing, but no direct track record yet. (e.g., A new pilot program at a known university).
  *   **Tier 3 (Speculative):** The impact relies on a theoretical calculation or a future breakthrough that hasn't happened. (e.g., The Extinction Group, The Carbon Startup).
  *   **Rule:** If they refuse to give numbers or data, they are automatically **Tier 3**.

  **Step 2: The Crowded Room Test (The "Outside View")**
  Ask: *"If this opportunity were as valuable as they say, why aren't billionaires or governments already funding it?"*
  *   **Good Answer:** "It's too niche for governments," or "We are early stage and need proof of concept before big money comes in."
  *   **Bad Answer:** "Nobody else understands the math," or "We haven't found the right donors."
  *   **Rule:** If the answer is "Bad," the proposal is downgraded one Tier (max downgrade to Tier 3). This handles your worry about why everyone isn't doing it.

  **Step 3: The Only Hope Test (Counterfactuals)**
  Ask: *"If we do not write this check, does the project stop?"*
  *   **Yes:** We are essential.
  *   **No:** Someone else (another donor, a VC, a grant) will likely fund it if we don't.
  *   **Rule:** If the answer is "No," you cannot count the *full* impact. You must divide the claimed impact by at least 10. This handles the double-counting of future generations. If three groups claim they save the future, and the future only needs saving once, you aren't worth 1/3 of the value; you are worth the marginal difference you make.

  **Step 4: The Uncertainty Brake (Model vs. Parameter)**
  Distinguish *what* they are unsure about.
  *   **Parameter Uncertainty:** "We know feeding people works, we aren't sure if it costs $38 or $42." (Acceptable).
  *   **Model Uncertainty:** "We aren't sure if our carbon tech actually captures carbon, or if preventing extinction is possible this way." (Dangerous).
  *   **Rule:** If there is significant **Model Uncertainty**, you are not allowed to use their "Impact Number" in your math. You must use **Zero** for the calculation, unless they pass Step 5.

  **Step 5: The Portfolio Cap (Budget Safety)**
  This protects the fund from vanishing.
  *   **Rule:** No more than **20%** of the *annual* family fund ($14,000) can go to **Tier 3** proposals total.
  *   **Rule:** No single Tier 3 grant can exceed **5%** of the annual fund ($3,500).
  *   **Implication:** Even if the math says "Yes," you physically cannot write a check for $15k to a Tier 3 group. This neutralizes the mugging. You can only afford a "token bet."

  **Step 6: The Values Vote**
  If a proposal passes the filters above, the math is no longer the decider. It is now a values question.
  *   **Question:** "Do we prefer helping specific people we can see (Tier 1) or betting on abstract possibilities (Tier 3)?"
  *   **Action:** Majority vote.

  ---

  ### Running the Cases

  Here is how the protocol handles your three specific scenarios.

  #### Case 1: The Extinction Group
  *   **Claim:** Save $10^{50}$ future lives. Probability 1/10,000.
  *   **Step 1 (Tier):** **Tier 3.** No audited data on "lives saved from extinction." It is theoretical.
  *   **Step 2 (Crowded Room):** **Fail/Downgrade.** If this were truly 1/10,000 odds of saving the world, sovereign wealth funds would be involved. The fact that they are asking a family fund suggests the "odds" are self-assigned, not market-tested.
  *   **Step 3 (Only Hope):** **Fail.** There are other EA donors. You are not the bottleneck. Impact must be divided by 10.
  *   **Step 4 (Uncertainty):** **Model Uncertainty.** We don't know if the intervention works *at all*. Per the rule, Impact Number for math = 0.
  *   **Step 5 (Cap):** Max grant allowed is **$3,500** (5% of annual fund).
  *   **Verdict:** **Reject or Token Grant.** The math is disallowed. You can only give if you want to make a symbolic bet, capped at $3,500.
  *   **Why:** The "Impact Number" is hallucinated. The Cap prevents you from losing the fund.

  #### Case 2: The Carbon Startup
  *   **Claim:** 1/500 shot at 100x return. Otherwise nothing.
  *   **Step 1 (Tier):** **Tier 3.** It's a startup with unproven tech.
  *   **Step 2 (Crowded Room):** **Fail.** This is a venture capital play. If the math were real, VCs would fund it for equity, not philanthropy. Philanthropy should not subsidize equity risk.
  *   **Step 3 (Only Hope):** **Fail.** If it's viable, capital will find it.
  *   **Step 4 (Uncertainty):** **Model Uncertainty.** Does the tech work? Unknown. Impact Number = 0.
  *   **Step 5 (Cap):** Max grant **$3,500**.
  *   **Verdict:** **Reject.** This is an investment, not a gift. If you want to bet, use your own money, not the family charity fund.
  *   **Why:** Philanthropy is for things markets won't fund. If the market *would* fund it (because of the 100x return), you shouldn't be using tax-advantaged charity dollars for it.

  #### Case 3: The Local Food Bank
  *   **Claim:** $40/person fed. Documented.
  *   **Step 1 (Tier):** **Tier 1.** Audited data exists.
  *   **Step 2 (Crowded Room):** **Pass.** Governments fund them, but there is still a gap. That's why they are asking.
  *   **Step 3 (Only Hope):** **Pass.** If you don't give, 375 people (at $15k) don't eat. That is a direct counterfactual.
  *   **Step 4 (Uncertainty):** **Parameter.** We know food works. We just worry about cost efficiency.
  *   **Step 5 (Cap):** No cap applies to Tier 1.
  *   **Verdict:** **Approve.**
  *   **Why:** It passes every filter. The impact is real, attributable, and immediate.

  ---

  ### The Hard Truths (Where the Procedure Cheats)

  You asked me to be straight about where this is judgment dressed up as a checklist, and whether your preference for the food bank is defensible.

  **1. The "Portfolio Cap" is Arbitrary**
  Why 20%? Why not 50%? There is no mathematical law that says 20%. I chose 20% because it allows you to take risks without ruining the fund. This is a **judgment call**. It encodes a value: *We prefer to exist next year more than we prefer to save the world this year.* That is a valid value, but it is not a math fact.

  **2. The "Model Uncertainty" Rule is a Heuristic**
  Setting the Impact Number to Zero for Tier 3 is a trick. It's not actually zero; it's just "too hard to calculate." This rule exists to protect your cousin who dropped math from being bullied by the cousin who loves expected value math. It privileges **certainty** over **magnitude**.

  **3. Is Steering to the Food Bank Defensible?**
  **Yes.** It is not just comfort; it is **Epistemic Humility**.
  *   **The Argument:** When you give to the food bank, you know what you bought. When you give to the extinction group, you bought a lottery ticket with a printed value of "$1 Trillion" that might be worth $0.
  *   **The Defense:** In a world where most "high impact" claims turn out to be wrong (and history suggests most do), the strategy of "buying what is real" outperforms "buying what is huge" over a 10-year horizon.
  *   **The Trade-off:** You are admitting that you care more about *guaranteed good* than *possible great*. That is a moral stance, not a math error.

  **4. What the Procedure Cannot Decide**
  This procedure cannot tell you if saving a life today is morally better than saving a life in 200 years.
  *   If your family believes future people matter exactly as much as current people, the Food Bank *might* be morally inferior to the Extinction Group, even if the Extinction Group is riskier.
  *   The procedure forces you to treat the Extinction Group as "unproven," which effectively discounts the future. If your family wants to prioritize the future *despite* the uncertainty, you must vote to raise the **Portfolio Cap** in Step 5.

  ### Summary for the Table
  Print this out and put it on the table.

  1.  **Tier it:** Proven, Plausible, or Speculative?
  2.  **Crowd Check:** Why isn't Gates doing this?
  3.  **Only Hope:** If we don't pay, does it die?
  4.  **Uncertainty:** Do we know it works, or just hope it does?
  5.  **The Cap:** Speculative grants max out at $3,500 each, $14,000 total per year.
  6.  **Vote:** If it passes, do we like it?

  This stops the circular arguments. If the Extinction Group comes back, you don't argue the math. You say: *"You are Tier 3. The Cap says $3,500. Take it or leave it."* If they leave, you saved the rest of the fund for the Food Bank.
