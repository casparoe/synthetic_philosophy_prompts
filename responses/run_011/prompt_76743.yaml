  10. **Self-Correction during drafting:** I need to make sure I don't advise the user to violate HIPAA/GDPR or medical privacy. The focus must be on *work outcomes*, not medical details. I also need to ensure I don't suggest punishing Dan for being sick, but rather managing the *work impact* while he is sick. The distinction is subtle but vital. *Correction:* Emphasize that "accountability" doesn't mean "punishment," it means "ownership of impact."

