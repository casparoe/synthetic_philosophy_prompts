prompt: |-
  So here's a thing that's been eating at me at work and I can't tell whether I'm being principled or just squeamish.

  I manage a team of about eight, and one guy — call him Dan — has had a rough six months. Missed deadlines, snapped at a client on a call, weird gaps in his day where he's just offline and unresponsive. Last week he came to me and said he'd been to his GP and got a diagnosis, and he wants me to route him through occupational health and treat the whole business as a health issue rather than a performance issue. He was really insistent on that framing. His reasoning: if it's a health thing he gets time off and accomodations, and nobody has to have the conversation about whether his behavior was acceptable.

  HR loves this. They immediately started describing it as a medical matter, and one of them said something to the effect of we don't pass judgment on medical conditions. And everyone's visibly relieved, because now nobody has to say the uncomfortable thing.

  Here's my problem, and I can't articulate it, which is why I'm asking: I don't think anyone in that room actually stopped believing Dan's behavior was bad. The client is still annoyed. The team still had to cover for him. The disagreement about whether what he did was okay hasn't been resolved, it's been relabeled — we swapped "was that okay?" for "is he sick?" and then acted like the second question was the one we'd been arguing about all along. And now we all get to feel generous instead of evasive.

  At the same time I know exactly how the counterargument goes. Plenty of conditions really are medical, the line between bad behavior and symptom is a real line that matters, and if I go around saying the health framing is always a dodge I end up sounding like someone who thinks depressed people should just pull themselves together. That's not where I'm at.

  Can you help me get clear on what's actually going on here? Specifically: is there a principled line between cases where the health framing is honest — where it genuinely dissolves the moral question — and cases where it's a polite wrapper we put on a conflict about conduct and values so nobody has to adjudicate it? And is the fact that Dan asked for the framing himself supposed to change the analysis, or is that precisely what makes the wrapper work so well?

  I've read enough old-school rationalist blogging to get suspicious whenever a definition stretches to fit whatever's convenient, and this feels like a case where one word is doing a huge amount of load-bearing work for people who'd rather not say out loud what they're deciding. But I could totally be the one motivated-reasoning, so tell me if I am.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** The user manages a team of eight. One employee (Dan) has performed poorly (missed deadlines, snapped at a client, unresponsive).
      *   **The Pivot:** Dan got a GP diagnosis and wants the issue framed as "health" rather than "performance." HR supports this enthusiastically ("we don't pass judgment on medical conditions").
      *   **The User's Unease:** The user feels the underlying moral/conduct issues (client anger, team burden) haven't been resolved, just relabeled. It feels like evasion disguised as generosity.
      *   **The Counter-Argument:** Health issues *are* real. Distinguishing between "bad behavior" and "symptoms" is crucial. Accusing someone of faking or dodging responsibility due to health is stigmatizing.
      *   **The Core Question:** Is there a principled line between honest health framing and evasive health framing? Does Dan's request for this framing change the analysis? Is the user motivated reasoning (being squeamish) or principled (spotting a category error)?

  2.  **Deconstruct the "Health vs. Performance" Frame:**
      *   *The Medical Model:* Behavior is a symptom. Treatment is accommodation/recovery. Accountability is suspended or modified.
      *   *The Performance Model:* Behavior is a choice/output. Treatment is feedback/consequences. Accountability is central.
      *   *The Conflict:* When these overlap, tension arises. A health condition *causes* performance issues, but the *impact* on the business remains.
      *   *The User's Insight:* The user is noticing a *moral hazard* or a *category collapse*. By calling it "health," the organization avoids the hard conversation about the *impact* of the behavior, not just the *cause*.

  3.  **Evaluate the "Principled Line":**
      *   When is health framing honest? When the focus shifts to *remediation and future capability* without ignoring the *impact*.
      *   When is it a wrapper? When it's used to *silence* discussion about the impact or to bypass accountability mechanisms entirely.
      *   *Key Distinction:* Does the health framing explain the behavior *and* lead to a plan to mitigate harm? Or does it explain the behavior *and* effectively grant immunity from the consequences of that harm?

  4.  **Analyze Dan's Request:**
      *   Dan explicitly said: "treat the whole business as a health issue... and nobody has to have the conversation about whether his behavior was acceptable."
      *   *Red Flag:* This is the crux. He is asking for the *moral judgment* to be waived, not just the *punitive consequence*.
      *   *Principled View:* Health explains *why* something happened. It does not necessarily erase the *fact* that it happened or the need to repair the damage.
      *   *HR's Role:* HR is risk-averse. "Medical matter" protects the company from lawsuits. It doesn't necessarily protect the team's morale or the client's relationship.

  5.  **Address the "Motivated Reasoning" Concern:**
      *   Is the user just squeamish about mental health? No, the user explicitly acknowledges the reality of medical conditions and the danger of stigmatization.
      *   Is the user spotting a genuine organizational dysfunction? Yes. The "relief" everyone feels suggests tension was avoided, not resolved.
      *   *Verdict:* The user is likely spotting a real dynamic (bureaucratic euphemism), but needs to navigate it carefully to avoid becoming the "bad guy" who denies medical reality.

  6.  **Develop a Framework for the User:**
      *   **Distinguish Cause from Consequence:** Health can explain the cause. It cannot magic away the consequence.
      *   **Distinguish Accommodation from Immunity:** You accommodate the condition. You do not grant immunity from the impact of actions.
      *   **The "Repair" Test:** Is there a plan to repair the harm (client relationship, team trust)? If no, it's evasion.
      *   **The "Future" Test:** Is the focus on enabling future success, or just excusing past failure?

  7.  **Drafting the Response (Iterative Process):**
      *   *Validation:* Start by validating the user's intuition. It's not squeamishness; it's a category error detection.
      *   *The Core Distinction:* Explain the difference between *explanation* and *exoneration*. Health explains. It doesn't automatically exonerate.
      *   *Dan's Specific Request:* Highlight the specific phrase "nobody has to have the conversation about whether his behavior was acceptable." This is the smoking gun. That conversation *must* happen, even if the tone changes.
      *   *HR's Incentive:* Explain why HR is doing this (legal risk vs. team health).
      *   *Actionable Advice:* How to handle this without being a jerk.
          *   Accept the health frame for *support*.
          *   Maintain the performance frame for *impact*.
          *   Separate the "why" from the "what now."
      *   *The "Principled Line":* Define it clearly. The line is crossed when the health label is used to prevent *repair* or *boundary setting*.

  8.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid armchair diagnosis of Dan.
