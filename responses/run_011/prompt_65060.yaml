answer: |-
  The wind changed at dawn. I felt it in the ache of my knees before I saw the flags on the harbor masters' tower swing from blue to ochre. The Wet Season was done. The Dry Season had begun. In this town, that didn't just mean less rain; it meant people woke up wanting different things.

  Elara sat across from me, her hands wrapped around a cup of tea that had gone cold. She hadn't touched the ledger I'd slid across the desk. Outside, the port was roaring. Cranes were swinging, moving casks of oil and sacks of grain, chasing the shift in demand. Everyone else was paying me to move their wealth into the right shape for the new weather. Elara was paying me to watch her do nothing.

  "You're holding Pearls," I said. It wasn't a question. I knew her portfolio. We all did.

  "I am," she said.

  "It's the Dry Season, Elara. Look at the board." I pointed to the slate on the wall where the Guild posted the utility indices. "In the Dry, Salt is king. Teak is queen. Pearls are dead weight. You can't preserve fish with nacre. You can't build a roof with oysters."

  "I know what Pearls are worth in the Dry," she said. Her voice was flat. She was tired. Binding yourself costs money—she'd paid a heavy bond to the Notary of the Tides to ensure she couldn't trade during the turn. If she signed a trade order now, she'd lose the bond. If she didn't, she kept the bond, but she kept the Pearls.

  "Let's walk the math," I said. I opened the ledger to her page. I wanted her to see the arithmetic of her own stubbornness. "Last year, you started with Salt. When the Dry winds blew, you traded Salt for Teak. You paid me one silver fee. You wanted the wood for building before the rains. That was rational. You preferred Teak to Salt."

  "I remember," she said.

  "Then the monsoon broke. Wet Season. You held Teak. But in the Wet, wood rots. Pearls dive. You traded Teak for Pearls. You paid me another silver fee. That was rational too. You preferred Pearls to Teak."

  "I was happy then," she said. "I had what I wanted."

  "Now the wind has turned back. Dry Season. You hold Pearls. Look at the index." I tapped the slate again. "In the Dry, you prefer Salt to Pearls. Everyone does. Salt preserves food; Pearls just sit there. So, rationally, right now, today, you want to trade Pearls for Salt. You pay me a third silver fee. You end the year with Salt. You're back where you started."

  I leaned forward. "But you're three silvers poorer. You walked in a circle. Salt to Teak to Pearls to Salt. You paid me three fees to hold the same bundle you had twelve months ago. That is the pump, Elara. You know it."

  She looked out the window. The flags were snapping hard now. "I know the loop."

  "So trade," I said. "Take the Pearls. Get the Salt. You'll be happier this season. You'll have utility. You'll be able to eat."

  "And next year?" she asked.

  "Next year is next year."

  "No," she said. She turned back to me. "Next year, when the Wet comes, I'll want Pearls again. And you'll be here. And I'll want to trade Salt for Pearls. And I'll pay you another fee. And then the Dry will come, and I'll want Salt again."

  "That's the weather," I said. "That's how tastes work here. We can't help what we want when the wind blows."

  "But I can help what I do," she said. "If I trade now, I validate the cycle. I feed you. If I hold the Pearls through the Dry, I break the chain."

  "You'll suffer," I said plainly. "For six months, you'll hold a good you value third-best. You'll watch your neighbors preserve their fish while yours spoil. You paid a bond to lock yourself into this misery. You are poorer by the bond, and poorer by the utility loss. You're paying to be inefficient."

  "I'm paying to be whole," she said.

  I tried again. I needed her to understand the diachronic trap, not as a theory, but as a hunger. "Elara, listen to me. You are hungry now. You have bread in your pocket, but it's the wrong kind of bread. You can trade it for meat, which you want. You know that tomorrow you might not want meat. You might want bread again. But does knowing you'll change your mind tomorrow stop your stomach from growling today?"

  "It does if I know the butcher is poisoning the meat to make me buy the bread back later," she said.

  "I'm not poisoning anything. I'm charging a toll for the bridge. You choose to cross it."

  "You build the bridge in a circle," she countered. "You know we'll come back. You price the toll knowing we'll pay it twice to end up where we began. You're skimming the soul off us, silver by silver."

  "I'm giving you what you want," I said. "At every single step, you signed the trade willingly. Nobody held a gun to your head. In the Dry, you wanted Teak. In the Wet, you wanted Pearls. Now you want Salt. I just facilitate the want. If you refuse the trade now, you are saying that Future-Elara matters more than Present-Elara. Why is she the real one? Why isn't *this* Elara, the one standing here with the Pearls and the need for Salt, the one who counts?"

  "Because she's a fool," Elara said. "She's a fool who thinks her feelings are laws of physics. She thinks because she wants something now, she must have it. I'm protecting her from herself."

  "You're robbing her," I said. "You're binding her hands. You're forcing her to live in a house with a leaking roof because you decided last year you didn't like the price of timber."

  "I'm keeping her out of your ledger," she said.

  She stood up. The meeting was over. The bond held. She wouldn't trade. She would walk out into the Dry Season with a sack of Pearls that everyone else was dumping. She would struggle. Her fish would spoil. She would be uncomfortable. And when the Wet Season returned, she would still have the Pearls, and she wouldn't pay me the fee to get them back, because she never lost them.

  She would save the silvers. She would lose the comfort.

  "Will you be here next year?" she asked, hand on the door latch.

  "I'm always here," I said. "The wind always turns."

  "Then I'll see you then," she said. "And I'll still have the Pearls. And you'll have nothing of mine."

  "You'll have less," I said. "You'll have less than you could have had."

  "I'll have myself," she said.

  She left. I watched her walk down the pier, clutching the sack of Pearls against the dry dust of the street. She looked dignified. She also looked like she was walking into a wall.

  I closed her ledger. The math was clean. The loop was unbroken for everyone else. They would trade Salt to Teak to Pearls to Salt, and they would be happy at every step, and they would be poorer at the end. They would call it living. Elara would call it survival.

  I picked up my pen. There were other clients waiting. The wind was high, and preferences were shifting. I had fees to collect. I didn't know if she was right. I only knew that she wouldn't pay me this season. In this town, that was the closest thing to victory anyone ever got.
