answer: |-
  Good evening, everyone. Thank you for being here.

  Looking around this table, I realized this might be the only time in history that people who pray for a living and people who argue for a living are both waiting for the same lasagna. It's a good group.

  Danny, when you told us you were doing this, I think all of us had to adjust our maps. For a long time, you were the guy who needed to know the mechanics of everything, the guy who needed to see the wiring behind the wall. Then, on that hike last year, you saw something you couldn't wire. And now you're going upstate to learn how to live inside that mystery.

  We had a talk last week about what happens when you come back. You told me that the Danny who returns will know things the Danny standing here tonight doesn't. You asked me to trust his judgment even if I don't understand his reasons. You said I should be willing to let him outvote me.

  So, here is my answer, for all of us.

  We can be outvoted on ideas. We can be outvoted on theology, on politics, on how you think the world works. If you come back with new answers, we will listen to them. But there is one thing you cannot outvote us on, and that is who you are. You don't get to vote on whether you still belong at this table. That decision isn't yours. It's ours. And we've already cast our ballots.

  To the monks: Thank you for driving him. Thank you for welcoming him. We know you're going to ask hard things of him. We just ask one thing in return: make sure the silence you teach him is big enough for the rest of us to enter. Don't let the quiet become a wall. Let it be a room we can all visit.

  And to Mom and Dad: I know this feels like a departure. But a formation isn't a disappearance. The lock on the front door hasn't changed. You don't have to earn your way back to this chair. It's being kept warm, exactly as it is.

  Danny, two years is a long time. There will be mornings when it's dark and cold and you're tired. In those moments, when you're sure you've found the truth, just check one thing: make sure the truth you've found is something you can carry back here, without dropping it at the door. If it's real, it should fit in this room.

  We love you. We're proud of you. And we'll be right here when you're done.

  To Danny.
