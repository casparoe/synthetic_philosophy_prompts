answer: |-
  **MEMORANDUM**

  **TO:** Regional Flood Resilience District Charter Commission
  **FROM:** Commissioner [Name]
  **DATE:** 15 February
  **RE:** Recommendation on Franchise and Board Composition

  **I. RECOMMENDATION**

  To ensure the District's legal viability and political legitimacy, I recommend the Commission adopt the following charter provisions:

  1.  **Franchise:** Adopt Proposal (A). Voting is limited to qualified state electors residing within the District boundary. One person, one vote.
  2.  **Board Composition:** Seven seats total. Five elected at-large by the District resident electorate. Two seats reserved exclusively for residents of the Upstream Township, elected by Township residents.
  3.  **Halloran Annexation:** The Charter shall invite the Town of Halloran to annex prior to the first election. If they decline, we shall recommend the Legislature grant them voting rights contingent on annexation, rather than attempting to enfranchise them extraterritorially.
  4.  **Noncitizen Residents:** We shall not attempt to enfranchise noncitizens. We will append a request for the Legislature to amend the enabling statute to allow permanent resident aliens to vote in special purpose districts.
  5.  **Future Generations:** The Charter shall establish a non-voting "Resilience Trustee," appointed by the State Senate, with standing to sue for breach of fiduciary duty regarding long-term levee integrity.

  **II. PRINCIPLES OF AUTHORITY AND INTEREST**

  This Commission faces a tension between two democratic principles: the *all-affected principle* (those impacted by a decision should shape it) and the *principle of legal authority* (only the sovereign may define the voter).

  We are an appointed body. We lack the standing to define the *demos* more generously than the statute requires. To attempt to enfranchise property owners (Proposal B) or affected outsiders (Proposal C) is self-undermining. It asserts a power to allocate political voice that we ourselves do not possess via the ballot. If we exceed the statutory franchise, we invite litigation that could void the Charter before the first levee is built. Counsel's warning is not merely procedural; it is constitutional. We must adhere to Proposal (A) to ensure the District exists at all.

  However, adhering to resident-only voting does not mean ignoring the explosive inequities of this District's design. The Upstream Township bears a disproportionate physical burden (deliberate flooding) for a downstream benefit they cannot vote to deny. The "all-affected" principle is honored not by expanding the *franchise* beyond our mandate, but by structuring the *representation* within it. By reserving two board seats for the Township, we ensure their specific interest is veto-proof within the governance structure, without violating the one-person-one-vote rule applicable to the general franchise.

  Regarding the corporate owners: they hold 38 percent of the assessed value. While they pay the assessment, voting rights in American polities attach to persons, not parcels. Their financial interest is protected by the settled finance provisions (assessment caps, audit rights) and their ability to lobby the Board. Granting them corporate suffrage would conflate taxation with representation in a manner inconsistent with state constitutional norms.

  **III. THE STRONGEST COUNTER-ARGUMENT**

  Proponents of Proposal (B) or (C) argue that a resident-only franchise renders the District a tool of colonial extraction. The downstream city (48,000 residents) can vote to flood the upstream township (310 residents) without consequence. Under Proposal (A), even with reserved seats, the Township is a minority on the Board. Furthermore, Halloran residents face land-use restrictions without a vote, violating the basic compact of consent.

  Proponents would argue that the Supreme Court has tolerated property-weighted voting in limited-purpose water districts (*Salyer Land Co. v. Tulare Lake Basin*). They would contend that because the District's primary function is economic (flood control/property protection) rather than general governance, the "one person, one vote" standard should yield to "one dollar, one vote" or "one acre, one vote." To deny this is to ignore the reality that the District is essentially a mutual insurance company, not a municipality.

  **IV. REBUTTAL AND LEGISLATIVE ASKS**

  This argument fails because this District exercises police powers (land-use restrictions in the influence area) that extend beyond mere property assessment. When a government body restricts land use outside its boundary, it acts as a sovereign, not a contractor. Therefore, the stricter constitutional standards for general-purpose government apply. We cannot risk the Charter on a disputed interpretation of *Salyer*.

  Consequently, we must kick the hardest questions to the Legislature, the only body with the standing to resolve them.

  1.  **Halloran:** We cannot grant them votes. We must ask the Legislature to authorize a "Contingent Annexation Voting" clause, allowing Halloran to vote on the Charter *before* formally annexing, or to amend the statute to allow influence-area residents to vote on land-use restrictions specifically.
  2.  **Noncitizens:** We must ask the Legislature for a waiver. 11 percent of the protected population is disenfranchised. This is a policy choice for the elected body, not us.
  3.  **Future Generations:** We cannot enfranchise the unborn. We can only impose a fiduciary duty. The Resilience Trustee acts as a proxy for the 2090 resident, empowered to challenge decisions that sacrifice long-term safety for short-term assessment relief.

  **V. DRAFT PROVISIONS**

  **Section 4.01 (Franchise).** The electors of the District shall be those persons qualified to vote in state elections who reside within the District boundaries. Each elector shall be entitled to one vote.

  **Section 5.02 (Board Composition).** The Board shall consist of seven Directors. Five Directors shall be elected at-large by the District electors. Two Directors shall be elected by the qualified electors residing within the Upstream Township. To be eligible for a Township Seat, a Director must reside within the Township.

  **Section 5.05 (Resilience Trustee).** The State Senate shall appoint a Resilience Trustee. The Trustee shall have non-voting seat on the Board and standing to seek injunctive relief in any court of competent jurisdiction against Board actions that materially increase residual flood risk to future generations.

  **VI. FALLBACK POSITION**

  If the Commission will not carry the recommendation for Reserved Seats (Section 5.02), I must concede the Statutory Fallback: Proposal (A) with seven at-large seats and no specific protections.

  However, if we accept the Fallback, we are morally bound to append a **Legislative Recommendation** explicitly urging the State Senate to impose Township protections as a condition of the District's authorization. To do otherwise is to deliver a Charter that we know will result in the political swamping of the Township. If we cannot protect them via the Charter, we must protect them via our advice to the Legislature.

  **VII. CONCLUSION**

  We are building a machine that will move water and money across political lines. It must be legal enough to stand, and equitable enough to endure. Proposal (A) with Reserved Seats is the only path that respects our appointed limits while honoring the affected interests. We must not mistake our desire for justice with the authority to rewrite the electoral code. Let us build the District within the law, and ask the Legislature to expand the law where justice requires it.

  I move we adopt this recommendation and circulate the draft language to Counsel for review by 20 February.
