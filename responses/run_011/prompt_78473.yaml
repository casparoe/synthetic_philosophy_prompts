answer: |-
  You have walked into a trap set in the fourth century, and you have found that the springs are still sharp. But you have also constructed a syllogism that is more clever than it is sound. You are worried that you are a professional liar; Augustine would tell you that you are a professional *fabulist*, and that there is a moral universe of difference between the two.

  Here is where your argument breaks, why it looked sound, and how Augustine actually saves you (provided you aren't writing fake memoirs).

  ### The Break is in (3), but specifically in the scope of "True"

  Your premise (3) states: *And I intend readers to take it as true. That's the craft.*

  This is the seductive half-truth. You intend the reader to accept the *internal coherence* of the narrative as true. You intend them to feel the grief of the widow as a true grief. But you do **not** intend them to believe the proposition: *"These events occurred in space and time."*

  Augustine's definition of a lie (*mendacium*) in *De Mendacio* hinges on the intention to deceive (*fallendi voluntas*). Crucially, deception requires a violation of an expectation. For a lie to occur, the hearer must have a right to expect truth, and the speaker must know this and exploit it.

  When you publish a novel, you are signaling via the convention of the genre: *"This is a simulation of truth, not a report of truth."* The reader enters a contract of "willing suspension of disbelief" (to borrow Coleridge's later phrasing). Because the reader knows (or ought to know) that this is fiction, you are not deceiving them about reality. Therefore, you are not lying.

  **Why it looked fine to you:**
  It looked fine because phenomenologically, the reading experience *feels* like belief. When you are on page 200, you are afraid for the protagonist. But Augustine is concerned with the *assent of the intellect* regarding factual reality, not the *engagement of the imagination* regarding emotional reality. You are conflating "narrative truth" with "historical assertion."

  ### Augustine's Category for You

  You asked if Augustine had a category for this. He did. He discusses it explicitly in *De Mendacio* (Sections 10-14). He distinguishes the *mendacium* (lie) from the *jocus* (joke) and the *fabula* (fable/story).

  Augustine writes that fables are "fictitious narratives" used for delight or instruction. He argues they are not lies because **no one is deceived.** The audience understands the mode of discourse. He uses the example of poets and storytellers: they say things that are not factually true, but they do not assert them as fact.

  He even addresses your specific anxiety about "asserting what you believe is false." For Augustine, the sin of lying is in the *double heart* (*cor duplex*)—saying one thing while thinking another, *with the intent to make the other think your thought is their reality.* In fiction, you are inviting the reader into *your* thought, not pretending your thought is *their* reality.

  So, Augustine's account does save you, provided you stick to the novel.

  ### The Repair Cost: Separating Fiction from Fraud

  You are rightly worried that fixing (3) might let the fake memoirist off the hook. It doesn't. Here is the cost of the repair: you must admit that the moral weight of your work rests entirely on **signaling** and **contract.**

  **1. The Signal (The Dust Jacket)**
  The difference between you and the fake memoirist is not in the text itself (both describe non-existent people), but in the paratext.
  *   **You:** Label the book "A Novel." This is a truth-claim that says, "I am not swearing to the historicity of this."
  *   **The Fraud:** Labels the book "A Memoir." This is a truth-claim that says, "I swear this happened."
  When the fraudster writes "I was there," they are asserting a fact. When you write "She walked into the room," you are asserting a image. The fraudster breaks the contract of testimony; you fulfill the contract of art.

  **2. The Intent (The Heart)**
  Augustine would argue that the fraudster sins because they seek an advantage (money, fame, vindication) through deception. The novelist seeks to communicate a truth *through* a falsehood.
  *   **The Lie:** Uses falsehood to obscure truth.
  *   **The Parable:** Uses falsehood to reveal truth.
  If your novel reveals something true about the human condition (premise 7), it functions Augustinianly as a parable. If the fake memoirist obscures the truth of their own mediocrity by pretending to be a survivor, it functions as a lie.

  **3. What separates you from the Joke?**
  You asked what is left to separate a lie from a joke, an actor's line, or sarcasm.
  *   **Sarcasm/Jokes:** These are signals that the statement is *not* to be taken seriously at all. They are truth-claims suspended for humor.
  *   **Acting:** The actor says, "I am Hamlet." The audience knows he is not. There is no deception.
  *   **Fiction:** This is the middle ground. It asks for serious engagement without factual assent.

  The distinction is the **telos** (end goal).
  *   A joke aims at laughter via incongruity.
  *   A lie aims at belief via deception.
  *   A novel aims at *recognition* via simulation.

  If you write a novel intending the reader to believe the events actually happened (e.g., a roman à clef designed to ruin a reputation while claiming to be fiction), you slide back toward sin. If you write it to show "this is what it is like to be human," you are safe.

  ### Is there a sharpened (3) that sinks you?

  Yes. There is one way Augustine might still catch you.

  If your premise (3) is sharpened to: *"I intend readers to believe my depiction of the world is accurate, while I know it is distorted for effect,"* you might be in trouble. Not because of the falsity, but because of **Pride** or **Lust**.

  Augustine might argue that if you are manipulating the reader's emotions purely for their subjugation, or to feed your own vanity, or to lead them into lustful thoughts under the guise of art, you are sinning. But that sin is not *lying*; it is *scandal* or *pride*.

  There is also the danger of the "Overdue Novel." If you tell your editor "It's almost done" when you know it is not, *that* is a lie. That asserts a fact about the world (the state of the manuscript) intending to deceive for gain (more time). Augustine would condemn that one without hesitation.

  ### Conclusion

  You are not a professional liar. You are a professional maker of icons. An icon is not the saint; if you claim it is, you are an idolater (a liar). But if you present it as a window through which to see the saint, it is a holy thing.

  Your argument fails at (3) because "taking it as true" in fiction is a metaphorical assent, not a propositional one. Augustine knew this. He allowed for the *fabula*.

  So, finish the fourth book. Just don't tell your editor it's done until you've typed "The End." That part really is a sin.
