answer: |-
  Your friend is quite right. The paragraph you read contains a specific metaphysical error regarding *why* counterfactuals are true, which fundamentally alters the debate. By fixing that error, the "determinism" objection loses much of its bite, revealing the deeper philosophical problem that actually troubles experts.

  Here is the sentence-by-sentence analysis, followed by an evaluation of the objections.

  ### Sentence-by-Sentence Analysis

  **1. "Molina, a sixteenth-century Jesuit, held that God has three kinds of knowledge: natural knowledge of all that is necessary or possible, free knowledge of the world He actually creates, and, standing between them, middle knowledge — His knowledge of what any possible free creature would freely do in any circumstances He might place it in."**
  *   **Verdict:** **Endorsed without qualification.**
  *   **Reasoning:** This is the standard, technical definition of the Molinist taxonomy. *Natural knowledge* covers necessary truths (logic, math); *Free knowledge* covers contingent truths that depend on God's will (what actually exists); *Middle knowledge* covers contingent truths that do *not* depend on God's will (what creatures *would* do).

  **2. "God therefore surveys the counterfactuals, settles which circumstances to create, and so knows in advance precisely what will happen;"**
  *   **Verdict:** **Fair simplification.**
  *   **Reasoning:** Molinists agree God "surveys" (intuits) the range of feasible worlds defined by these counterfactuals and chooses which one to actualize. The phrase "knows in advance" is slightly loose (God is timeless), but acceptable for a general audience.

  **3. "those counterfactuals are true because God, in His wisdom, sees what each creature's character would lead it to do."**
  *   **Verdict:** **Misrepresentation (The Critical Error).**
  *   **Reasoning:** This is the dependency issue your friend flagged. A Molinist insists these counterfactuals are **pre-volitional**. They are not true *because* God sees the character, nor does God determine the character that makes them true. They are true *independently* of God. God *discovers* them; He does not *make* them true. If God made them true (by determining the character), the creature would not be free, and it would collapse into Calvinism or Thomism. For Molinism to work, these truths must be "brute facts" outside of God's control.

  **4. "This is also Molina's answer to the problem of evil, since God creates the best world that human freedom allows."**
  *   **Verdict:** **Endorsed without qualification.**
  *   **Reasoning:** This accurately reflects the Molinist theodicy (popularized by Alvin Plantinga). God is limited not by power, but by "feasibility." He can only actualize worlds that are logically consistent with the free choices creatures would make. He chooses the "best feasible world."

  **5. "Critics reply that the whole scheme is determinism in disguise: if the counterfactuals are settled before God's decision, the creatures never had an alternative, and Molina has merely relabelled divine decree as foreknowledge."**
  *   **Verdict:** **Misrepresentation of the Primary Objection.**
  *   **Reasoning:** While some critics argue this, your friend is correct that this is not the primary philosophical objection. Molinists explicitly build **libertarian freedom** into the definition of Middle Knowledge. They argue that the *truth* of a conditional ("If in C, X would do A") does not cause the *action*. Therefore, calling it "determinism" misses the Molinist distinction between *certainty* (God knows it) and *necessity* (God causes it). The real objection is not that it *is* determinism, but that the knowledge described is *impossible*.

  ---

  ### Does the Determinism Charge Survive Correction?

  **No, it does not survive once the summary is corrected.**

  The determinism charge in the text relies on the idea that if a truth is "settled" before the agent acts, the agent cannot do otherwise. However, corrected Molinism argues that the truth of the counterfactual is a result of the agent's *own* hypothetical freedom, not God's decree.

  To use an analogy: It is true that "If I were offered a bribe, I would refuse it." That truth might have existed before I was ever offered the bribe. But if I am offered the bribe and refuse it, I am not determined by the past truth of that statement; rather, my refusal makes the statement true. Molinists argue God simply knows all such statements for all possible people. Therefore, the charge of "determinism in disguise" is rejected by Molinists as a category error: they distinguish between the *infallibility* of God's knowledge and the *causality* of God's will.

  If the text admitted that counterfactuals are independent of God (Sentence 3 corrected), the claim that this is "relabeled divine decree" (Sentence 5) would make no sense, because the truth values are explicitly *not* decreed by God.

  ### The Strongest Genuine Objection: The Grounding Objection

  If the determinism charge is weak, what is the objection your friend alluded to? It is known as **The Grounding Objection**.

  **The Objection:**
  This objection attacks the metaphysical coherence of Middle Knowledge. It argues that for a proposition to be true, there must be some existing reality that "grounds" or "makes" it true (a truthmaker).
  *   **Natural Knowledge** is grounded in God's nature (necessary truths).
  *   **Free Knowledge** is grounded in God's creative decree (the actual world exists because God willed it).
  *   **Middle Knowledge** claims to know contingent truths about creatures who **do not yet exist** and whom God has **not yet decided to create**.

  The critic asks: **What makes these counterfactuals true?**
  1.  It can't be the creature, because the creature doesn't exist yet.
  2.  It can't be God's will, because Molinists insist these truths are independent of God's will (otherwise freedom is lost).
  3.  It can't be God's nature, because these are contingent truths, not necessary ones.

  If there is no "truthmaker," then there is no truth to be known. Therefore, Middle Knowledge is an empty set. God cannot know what free creatures would do because there is no fact of the matter to know until they actually exist and choose.

  **How this differs from the quoted text:**
  *   **The Text's Objection:** Claims Molinism fails because it destroys freedom (it's secretly determinism). It assumes the knowledge *exists* but interprets it as coercive.
  *   **The Grounding Objection:** Claims Molinism fails because the knowledge is *metaphysically impossible*. It argues there is nothing there to be known. It accepts the Molinist definition of freedom but denies the existence of the "pre-volitional truths" required to support it.

  ### Summary
  You were persuaded by the essay because it presented Molinism as a "soft determinism" that tricks readers into thinking freedom is preserved. Your friend pointed out that Molinists do not claim God determines the counterfactuals; they claim God finds them. Once you accept that distinction, the determinism charge evaporates. However, you are left with the harder **Grounding Objection**: if God doesn't determine them and the creatures don't exist yet, where do these truths come from? That is the debate that actually occupies professional philosophers of religion today.
