  5.  **Drafting the Text (Mental or Scratchpad):**
      *   *Title:* **Project Title: The Fabular Past: A Fourth Use of History**
      *   *Summary:* Nietzsche's *Untimely Meditation II* defines how the past serves life. Monumental, Antiquarian, Critical. But writers of fiction do something else. They treat the past as *material*.
      *   *The Question:* Is Fabular history distinct? Criteria: Question, Affect, Failure.
