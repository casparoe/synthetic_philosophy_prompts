      *   **Subject:** How non-historians use the past.
      *   **Frame:** Nietzsche's *On the Uses and Disadvantages of History for Life* (Second Untimely Meditation).
      *   **Core Idea:** Nietzsche's triad (Monumental, Antiquarian, Critical) is incomplete. A fourth mode exists: *Fabular History* (the novelist's approach: past as material/stuff to be rearranged).
      *   **Degeneration of Fourth Mode:** Past becomes a "costume warehouse" (rearrangement unanswerable to anything).
      *   **Key Questions to Answer:** Is "Fabular" a genuine fourth entry or just a degraded version of Monumental/Antiquarian? What criteria earn a place in the taxonomy? Why do familiar readings leave this open?
      *   **Method:** Month-by-month plan for a fiction writer (scenes/drafts as evidence, not decoration). Use of "plastic power" (healing/growing power).
      *   **Outcome:** What success looks like for a non-fiction reader. Blunt assessment of failure (is this just the author's habit?).
      *   **Timeline:** One year. Honest judgment on feasibility. What to cut if time runs out.
      *   **Constraints:** Two pages. References to be added by author.
      *   **Tone:** Intellectual, rigorous, self-reflective, persuasive, blunt.

  2.  **Deconstruct the Argument (The "Why"):**
      *   Nietzsche's triad is about *serving life*.
      *   Monumental = Models (Greatness). Degeneration = Parody/Myth.
      *   Antiquarian = Home (Piety). Degeneration = Mummification.
      *   Critical = Permission to Break (Justice). Degeneration = Rootlessness.
      *   Proposed Fourth (Fabular) = Material (Truth in another register). Degeneration = Costume Warehouse.
      *   *Crucial Distinction:* Does Fabular history serve life differently? Yes, it seeks *coherence* or *narrative truth* rather than moral example, reverence, or liberation.
      *   *Risk:* Is it just Monumental history without the "Great Men"? Or Antiquarian without the "Respect"? The proposal must argue it's distinct based on the *question asked of the past*.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic-adjacent. *The Fourth Use of History*? *Fabular History*? Let's go with *The Fabular Past: A Fourth Use of History*.
