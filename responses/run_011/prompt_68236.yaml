answer: |-
  **Project Title:** The Fabular Past: A Fourth Use of History
  **Applicant:** [Name]
  **Duration:** 12 Months
  **Genre:** Philosophical Inquiry / Creative Non-Fiction

  **The Question**
  Nietzsche's *On the Uses and Disadvantages of History for Life* establishes a triad: monumental history (seeking models), antiquarian history (seeking a home), and critical history (seeking permission to break). This taxonomy is canonical, yet it fails to account for the specific relationship the working novelist has with the past. The novelist does not ask the past for exemplars, heritage, or liberation. They ask it for *material*. They treat what happened not as a burden or a beacon, but as stuff to be rearranged until it becomes true in another register. I propose this fourth mode as **Fabular History**. Its characteristic degeneration is not myth or mummification, but the "costume warehouse": the point at which rearrangement ceases to be answerable to anything beyond aesthetic whim.

  The central question this book answers is not whether Fabular history exists, but whether it is *autonomous*. Is it a genuine fourth entry, or merely monumental history with the requirement of greatness removed, or antiquarian history with the piety removed? The deciding criterion is the *telos* of the engagement. Monumental history demands emulation; Antiquarian demands preservation; Critical demands judgment. Fabular history demands *coherence*. It seeks to make the past intelligible through narrative structure rather than moral or civic utility. If the rearrangement of events serves a narrative truth that cannot be achieved through strict accuracy or moral lesson, the mode is distinct. If it serves only to make the past easier to consume, it is a degeneration of the other three. This project will establish the criteria for inclusion in this taxonomy: 1) The specific question put to the past; 2) The affect driving the inquiry; 3) The specific pathology of its failure. Familiar readings of Nietzsche leave this open because they treat the essay as a prescription for historians or citizens, ignoring the artist for whom "serving life" means generating viable fictions rather than viable actions.

  **Methodology: The Novelist's Philology**
  My instrument is fiction, not philology. Therefore, the research method cannot be purely archival. The book will be written as a hybrid of philosophical argument and practical demonstration. Scenes and draft decisions will function as evidence for philosophical claims, not as decoration.

  *   **Months 1–3 (Taxonomy & Framework):** Close reading of the *Second Untimely Meditation*. Drafting the theoretical chapters defining the three Nietzschean modes and the proposed fourth. Establishing the "Plastic Power" baseline: identifying where the healthy fabular mode relies on Nietzsche's concept of plastic power (the ability to heal wounds by incorporating them into a new growth) and where it diverges. *Divergence point:* Plastic power implies organic growth from the self; Fabular history often requires the violent reshaping of the self to fit the material. I will map this tension.
  *   **Months 4–8 (The Laboratory):** I will write three distinct short narratives based on the same historical incident. One will attempt the Monumental approach (seeking the hero), one the Antiquarian (seeking the detail), one the Fabular (seeking the pattern). These drafts are not for publication but for data. I will document where the Fabular approach yields a truth the others obscure, and where it slips into the "costume warehouse." This section justifies the money: it pays for the time to write badly in order to think clearly.
  *   **Months 9–12 (Synthesis & Revision):** Integrating the draft evidence into the theoretical framework. Refining the definition of the Fabular degeneration. Final polish.

  **Outcomes and Risks**
  To a reader who has never written fiction, a successful result will look like a new lens for viewing historical fiction and public memory. They will be able to identify when a film or novel is using the past as a costume warehouse versus when it is performing necessary fabular work to make the past livable. It provides a vocabulary for why strict accuracy often feels "false" and why strict invention often feels "frivolous."

  I must be blunt about the risk of failure. My suspicion is that the "Fabular mode" will turn out to be a description of my own habits rather than a possibility anyone else would recognize. If the draft narratives fail to demonstrate a distinct *telos*—if they merely show me ignoring facts for convenience—the thesis collapses. The book must prove that this rearrangement is a *service to life* (as Nietzsche demands), not merely a service to plot. If I cannot demonstrate the ethical utility of the lie, the project is solipsistic.

  **Feasibility and Contingency**
  Is one year enough? For a book that is neither scholarship nor a novel, but a metamorphosis of one into the other, it is precarious. The risk is that the theoretical framework hardens before the creative evidence is tested.

  If time runs short, I will cut the comparative analysis of other authors. The proposal relies on *my* practice as the primary data set. Analyzing external examples (e.g., Mantel, Nabokov, Sebald) is secondary and expendable. The core argument rests on the internal logic of the triad and the demonstration via my own drafting process. Cutting external case studies preserves the philosophical spine while reducing the archival burden. The goal is not a comprehensive history of the novel, but a proof of concept for the fourth mode. If the year proves insufficient, the final manuscript will be shorter, focusing strictly on the definition of the mode and the single extended case study of my own drafting process, rather than a survey of the field. This ensures the primary question—is the taxonomy complete?—is answered, even if the scope of the evidence is reduced.
