  4.  **Outcomes, Risks, & Feasibility** (The blunt assessment)

  Let's assemble.

  *Wait, one more check on the "Plastic Power"*: Nietzsche defines it as the ability to grow out of oneself, to heal wounds. The prompt asks where the project leans on this and where it keeps free.
  *Lean on it:* When discussing the *health* of the Fabular mode (making the past livable).
  *Keep free:* When discussing the *degeneration* (costume warehouse). Plastic power implies growth; costume warehouse implies play-acting without growth. I need to distinguish healthy fabulation from mere aestheticization.

