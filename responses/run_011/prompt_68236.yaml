      *   **Feasibility:** Is 1 year enough? Be honest.

  4.  **Refining the Content (Iterative Process):**

      *   *Constraint Check:* Two pages. Standard academic formatting (12pt, double space) is usually ~500-600 words per page. So I need roughly 1000-1200 words. I need to be dense but readable.
      *   *Tone:* The prompt asks for "blunt" and "honest." Avoid grant-speak fluff ("I will explore," "I hope to"). Use definitive language ("I will argue," "The risk is").
      *   *The "Plastic Power" aspect:* Nietzsche says we need plastic power to heal wounds and incorporate the past. The novelist uses this to reshape trauma/event into story. I need to specify where this applies and where the book steps back from it.
