      *   *Fact:* Possession < 10 days is an "administrative offense" (contraordenação), not a crime.
      *   *Fact:* Referral to CDT (Commission for the Dissuasion of Drug Addiction).
      *   *Fact:* Composition: Legal, Medical, Social.
      *   *Fact:* Outcomes: Suspension, Fine, Warning, or Treatment Referral.
      *   *Fact:* Demographics: Many non-dependent users (recreational).
      *   *Implicit Logic:* The state retains the right to judge the behavior as harmful/wrong, but removes the stigma/incapacity of criminal law. It treats the user as *capable of being reasoned with* but *susceptible to bad judgment* that requires state correction.

  3.  **Address Question 1: Free Choice vs. Criminal Choice:**

      *   *Hypothesis:* It's not that choice is impossible (determinism), but that the *context* of choice is corrupted.
      *   *Theory:* "Paternalistic Liberalism" or "Soft Paternalism." The state acknowledges agency but doubts the *quality* of the agency in this specific domain. It's not "you couldn't help it" (disease determinism); it's "you shouldn't do it, and we will make sure you think twice."
      *   *Distinction:* It distinguishes between *moral culpability* (crime) and *administrative risk* (health/social harm).

  4.  **Address Question 2: Disease Frame vs. Sanctions:**

      *   *Tension:* If I have the flu, you don't fine me. If I drive drunk, you fine me.
      *   *Resolution:* The Portuguese model treats drug *use* not purely as a symptom of disease, but as a *risk behavior* akin to public health violations (like smoking in a restaurant or not wearing a seatbelt).
      *   *Theory:* The sanction isn't punishment for *sin*; it's a "speed bump" or a "hassle cost" designed to trigger reflection. It's *deterrence via administrative hassle*, not retribution.
      *   *Implication:* It presupposes the user is rational enough to respond to incentives (fines) but irrational enough to need them.

  5.  **Address Question 3: Consent under Penalty:**

      *   *Structure:* Show up or else. Agree to treatment or get fined.
      *   *Theory of Consent:* "Constrained Volition." Consent obtained under threat of sanction is valid *if* the sanction is for the user's own good (paternalism) or social good.
      *   *Medical Analogy:* It's not medicine; it's *public health quarantine logic*. Like mandatory TB screening. You aren't "consenting" to the screening; you are complying with a public health order.
      *   *Verdict:* This is not ordinary medicine. It is administrative law wearing medical clothes.

  6.  **Address Question 4: Legalization Theory vs. Portuguese Theory:**

      *   *Legalization:* "Sovereign Adult." The individual owns the decision. The state regulates the *market*, not the *consumer*.
      *   *Portugal:* "Ward of the State (Temporarily)." The individual is subject to review. The state regulates the *consumer*.
      *   *Compatibility:* They are rivals on the question of *who owns the decision*. They can coexist pragmatically (e.g., legalize cannabis, keep heroin decriminalized), but philosophically, they contradict on the locus of authority.
      *   *Portugal:* State > Individual (regarding consumption).
