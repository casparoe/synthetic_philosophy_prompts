      *Revised Theory:* The Portuguese model views the drug user as a **competent but misguided agent** who requires a **corrective nudge** from the state, whereas the Legalization model views the user as a **sovereign agent** whose errors are their own property.

      *Let's lock in the term:* **"Bureaucratic Paternalism."**

