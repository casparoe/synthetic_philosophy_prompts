answer: |-
  Here is the reconstruction of the implicit theory underlying the Portuguese model, contrasted with the legalization model.

  ### 1. The Theory of the Person: Competent but Corruptible
  The Portuguese system does **not** presuppose that drug use is unfree (deterministic disease). If it did, sanctions would be cruel and unusual, like fining a diabetic for high blood sugar.

  Instead, it presupposes a **Soft Paternalist** view of agency:
  *   **The Claim:** The user is rational enough to be held administratively accountable, but their rationality is compromised by the substance or the context.
  *   **The Distinction:** It distinguishes between *criminal culpability* (which requires moral guilt) and *administrative liability* (which requires only risk creation).
  *   **The Implication:** By keeping possession illegal (an administrative offense) but removing criminal stigma, the state signals: *"You are not a criminal, but you are making a mistake that belongs to us."*

  **Extrapolation Flag:** The law doesn't explicitly state this theory of agency, but the machinery (mandatory appearances + fines) requires it. A hard determinist model (pure disease) would not fine; a hard libertarian model (pure choice) would not summon.

  ### 2. The Disease Frame vs. The Sanction Menu
  You asked: *If it's really a disease, what are the fines for?*

  The Portuguese model does not treat *use* as a disease. It treats *addiction* as a disease, but *possession/use* as a **public health risk behavior**.
  *   **The Theory:** This is analogous to smoking in a non-smoking area or not wearing a seatbelt. These are health behaviors, but they are regulated via administrative penalty because they impose social costs or indicate a failure of self-care that the state has an interest in correcting.
  *   **Function of the Fine:** The fine is not retributive. It is a **hassle cost**. It is designed to break the casualness of the act. If you have to go to a panel and potentially pay €50, the "friction" of the drug use increases.
  *   **The Contradiction:** The system rhetorically claims "health problem" to reduce stigma, but operationally acts on "norm violation" to reduce prevalence. It wants the user to feel *concerned*, not *condemned*, but still *corrected*.

  ### 3. Consent Under Penalty: "Administrative Therapy"
  You asked: *What does that structure assume about what consent is worth when the alternative is a penalty?*

  The system operates on a theory of **Constrained Volition**.
  *   **The Assumption:** Consent given under threat of sanction is valid *if* the sanction is for the subject's own good. This rejects the medical ethic that consent must be uncoerced to be valid.
  *   **The Mechanism:** The panel offers a "choice": accept treatment/warning OR accept a fine/suspension. Since both are negative (time/money vs. medical intervention), the state assumes the user will "choose" the health option rationally.
  *   **Is it Medicine?** No. It is **Quarantine Logic**. Just as the state can mandate TB screening without "consent" in the commercial sense, the CDT mandates an assessment of drug risk. It treats the user's body as a site of potential public contagion (social cost), not just private health.

  ### 4. Legalization Theory vs. Portuguese Theory: Rival Ownerships
  These are not compatible premises; they are rivals regarding **who owns the decision**.

  *   **Legalization (The Sovereign Adult):**
      *   **Premise:** Competent adults own the risk of their own consumption.
      *   **State Role:** Regulate the *supply chain* (purity, age, tax), not the *consumer*.
      *   **Bad Outcome:** Black markets, underage access, unsafe products.
      *   **Authority:** The state has no standing to judge the *act* of consumption, only the *conditions* of sale.

  *   **Portugal (The Ward of the State):**
      *   **Premise:** The state retains standing to judge the *act* of consumption as inadvisable.
      *   **State Role:** Regulate the *consumer* via administrative review.
      *   **Bad Outcome:** Individual usage rates, health system burden, recurrence.
      *   **Authority:** The state asserts a right to intervene in private consumption if it deems it a risk.

  **Verdict:** They are often lumped together as "progressive," but philosophically, Legalization is **Liberal** (negative liberty: freedom from interference), while the Portuguese model is **Paternalist** (positive liberty: freedom from self-harm via state guidance).

  ### 5. Underdetermined Parts: Where the Theory Breaks
  Which parts of the practice *need* this theory, and which could be staffed by anyone?

  *   **Needs the Paternalist Theory:**
      *   **Mandatory Appearance:** A libertarian cannot justify summoning a non-dependent user. This requires the premise that the state has a right to audit private behavior.
      *   **Fines/Sanctions:** A pure public-health utilitarian might support this *only if* social costs are proven. A libertarian rejects this entirely. The sanction *requires* the premise that the behavior is objectively wrong/risky enough to warrant a penalty.

  *   **Philosophically Underdetermined (Could be staffed by others):**
      *   **The Panel Composition:** A libertarian could staff a panel of social workers to offer *voluntary* services. A utilitarian could staff it to triage based on cost-benefit. The *existence* of a multidisciplinary team doesn't prove paternalism; the *coercive power* of the team does.
      *   **The Referral to Treatment:** Offering treatment is neutral. Making it the "lesser of two evils" compared to a fine is the paternalist move.

  ### 6. Counterfactual: Swapping in the Legalization Theory
  If you swapped the Legalization (Sovereign Adult) theory into the Portuguese machinery, here is what concretely changes:

  1.  **Who gets summoned:** **Nobody.** Under legalization theory, possession of a personal amount is a right, not an offense. The summons itself is the violation.
  2.  **Who decides:** The **Individual**. The panel loses its adjudicative power. It becomes a walk-in clinic.
  3.  **What counts as a bad outcome:**
      *   *Portugal:* Recidivism (using again after warning).
      *   *Legalization:* Harm (overdose, public disturbance). Mere use is not a bad outcome.
  4.  **The Sanction:** Eliminated. You cannot fine a sovereign adult for a legal choice.

  **Is a sanction-free Portuguese system coherent?**
  Yes, but it ceases to be "Dissuasion" and becomes **"Diversion."**
  *   **Current System:** "Stop using, or we will penalize you." (Dissuasion)
  *   **Sanction-Free System:** "If you are using, we are here to help if you want." (Harm Reduction)

  **The Coherent Version:**
  You can keep the panels *only if* you drop the mandatory summons and the fines. The panel becomes a **Civil Review Board** accessible by self-referral or police referral (with consent).
  *   **Why keep it?** It preserves the "health gateway" without the "administrative threat."
  *   **What is lost?** The state loses the ability to signal *disapproval*. It becomes a service provider, not a regulator of behavior.

  ### Summary of the Reconstruction
  The Portuguese model presupposes a **Bureaucratic Paternalism**. It asserts that the state is the guardian of the citizen's health interests, even against the citizen's own immediate choices. It uses the *language* of medicine to soften the *mechanism* of law.

  *   **Legalization** says: "It is your life, ruin it if you choose."
  *   **Portugal** says: "It is your life, but we will make it difficult for you to ruin it."

  The fines are not for the disease; they are for the **non-compliance with the state's health advice**. The system works only if you accept that the state has the authority to give that advice with teeth.
