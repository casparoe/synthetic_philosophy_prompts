      *   *Selected Bottom Line:* These three regimes presuppose a theory of obligation in which defense is a constitutive duty of citizenship that establishes political membership, yet they operationalize this duty through administrative mechanisms that treat the burden as fungible, revealing a foundational tension between the republican ideal of inalienable service and the liberal reality of negotiable exemption.

  3.  **Analyze Each "Knot" (Implicit Theory Reconstruction):**

      *   **1. Swiss Exemption Tax:**
          *   *Presupposition:* It is a *penalty* affirming the rule, not a *price* purchasing exemption. If it were a price, it would be open to all. Because it's limited ( unfit only) and graduated, it treats the duty as personal but the burden as adjustable based on capacity.
          *   *Theory:* The duty is inalienable (you can't just buy out), but incapacity creates a debt to the state. The tax is a "surrogate" performance—a financial contribution substituting for physical presence *only* when physical presence is impossible. The cap (11 years) suggests the duty is temporal, not lifelong. Severe disability exemption suggests the duty is grounded in capacity, not mere existence.
          *   *Coherence:* It coheres if the duty is "do what you can." If you can't serve, you pay. If you can't pay (severe disability?), you're exempt. Wait, severe disability exempts outright. So the tax is for those *unfit for service* but *fit for work*. It presupposes the state is owed *something* by every capable male, either body or income.

      *   **2. Swiss 4% Credit (Commensurability):**
          *   *Presupposition:* Service and money are commensurable *for the purpose of the tax offset*, but not fully interchangeable. The exchange rate exists to prevent double burden (paying tax AND serving), not to suggest service is *worth* that money.
          *   *Anti-Mercenary:* It squares with Machiavelli/Rousseau if the tax is seen as a penalty for non-participation rather than a wage for participation. The credit ensures servants aren't punished financially, not that servants are selling their labor. It preserves the "citizen" status by ensuring service isn't a financial loss, while maintaining that money cannot *buy* freedom from the draft initially.
          *   *Theory:* The metric is "burden equalization."

      *   **3. Extra Length of Civilian Service (CH/FI):**
          *   *Presupposition:* It is a *costly screen* (signaling theory) to prevent free-riding on conscience. If it were punishment, it would be punitive beyond the scope of service. If equalization, it implies military service has hidden benefits (camaraderie, skills) or that civilian service is less burdensome (safer).
          *   *Theory:* Conscience is respected but suspected. The state acknowledges the right to object but demands proof of sincerity through sacrifice. It presupposes conscience is individual but subject to state verification via burden.
          *   *Fairness:* Fairness requires equivalent sacrifice, not equivalent time.

      *   **4. Finland's Imprisonment & Jehovah's Witnesses:**
          *   *Presupposition:* Once unarmed service is offered, the state's claim is satisfied. Total refusal is not conscience but lawlessness. Imprisonment presupposes the duty is coercive and non-negotiable beyond the provided alternatives.
          *   *JW Exemption:* Abolishing it presupposes conscience is *individual*, not communal. Group exemptions create privilege. True conscientious objection must be tested individually.
          *   *Theory:* The state owes accommodation to the individual conscience, not to religious institutions.

      *   **5. Sweden's Universal-but-Unexercised Duty:**
          *   *Presupposition:* The duty is *expressive* (liability) rather than *instrumental* (labor). It establishes the state's right to call, even if not exercised.
          *   *Theory:* Political community requires the *potential* for sacrifice, not actual sacrifice from all. It reinstates the "state of exception" capability without the cost. It treats citizenship as a latent resource.
          *   *Coherence:* It works if the theory is about sovereignty (the right to command) rather than utility (the need for bodies).

      *   **6. Swiss Rifle at Home:**
          *   *Presupposition:* The monopoly on violence is a monopoly on *legitimation*, not possession. The arms belong to the citizenry, entrusted to the state.
          *   *Strikers/Demonstrators:* This reveals the militia is an instrument of the *constitutional order*, not just external defense. It presupposes the "people in arms" defend the state against internal disorder too.
          *   *Theory:* The citizen-soldier protects the republic from outside and inside. The rifle signifies trust but also the potential for state coercion via citizens.

      *   **7. Swiss Male-Only vs. Universal Civic Service Rejection:**
          *   *Presupposition:* The duty is specifically *martial*, not general civic contribution. Rejecting universal service implies defense is unique. Male-only implies a gendered view of protection (men protect, women protected/participate voluntarily).
          *   *Theory:* Citizenship is differentiated. Full political membership (defense) is male. The rejection of universal service confirms this isn't about "giving back" generally, but about "fighting" specifically.

  4.  **Analyze Internal Coherences/Incoherences:**
      *   **Switzerland:** Tension between the "inalienable duty" (rifle at home, mandatory) and the "fungible burden" (tax exemption, credit system). Is service a sacred duty or a tax liability? The system tries to be both: sacred in principle (must serve unless unfit), fungible in administration (tax offsets).
      *   **Finland:** Tension between respecting conscience (civilian service) and punishing total refusal (prison). Also, the shift from communal (JW) to individual conscience suggests a liberalization within a coercive framework.
      *   **Sweden:** Tension between "universal liability" and "selective conscription." If only some serve, is it universal? Yes, if the theory is about *availability* rather than *usage*.

  5.  **Analyze the Shift to Contractarianism:**
      *   What changes?
      *   **Law:** Conscription laws repealed. No legal liability.
