answer: |-
  The institutional packages of Switzerland, Finland, and Sweden encode a conflicted theory of obligation that treats defense as a constitutive duty of citizenship while simultaneously commodifying exemptions, revealing a foundational tension between the republican ideal of non-alienable service and the liberal reality of negotiable burden.

  The Swiss exemption tax strictly presupposes that the state is owed a contribution by every capable male, whether in body or in income, making the tax a surrogate performance rather than a market price; if the duty were purely martial, incapacity would exempt outright, but if it were purely fiscal, the tax would be optional. The graduation by income presupposes that the burden of citizenship must be equalized relative to capacity, while the eleven-year cap presupposes that the duty is temporal, belonging to youth rather than life. The four-percent credit per day served presupposes a metric of burden-equalization rather than valuation; it squares with the anti-mercenary tradition only if the credit is understood as preventing double-burden (serving plus paying) rather than wages for labor, preserving the citizen-status by ensuring service is not a financial penalty. The extra length of civilian service in Switzerland and Finland strictly presupposes that conscience is unverifiable and prone to free-riding, functioning as a costly screen to guarantee sincerity; this carries a view of fairness as equivalent sacrifice rather than equivalent time, and a view of conscience as individual but subject to state audit. Finland's imprisonment of total objectors presupposes that once an unarmed alternative is offered, the state's claim is satisfied and further refusal is lawlessness rather than conscience; abolishing the Jehovah's Witness exemption presupposes that conscientious status is individual and internal, not communal or doctrinal, denying religious institutions the power to certify civic obligation. Sweden's universal-but-unexercised duty presupposes that sovereignty requires the latent right to command bodies even if not exercised, making the duty expressive of state authority rather than instrumental for manpower; this conception of political community values the potential for sacrifice as the bond of membership, rendering the obligation real even if dormant. The rifle in the hallway presupposes that the state's monopoly on violence is a monopoly on authorization rather than possession, trusting the citizenry with the means of force; this is compatible with use against strikers only if the "state" being defended includes the domestic constitutional and economic order, implying the citizen-soldier protects the regime from internal disorder as well as external threat. The male-only Swiss duty combined with the rejection of universal civic service presupposes that the obligation is specifically martial rather than generally civic, and that the capacity for violence remains a gendered criterion for full political membership; this confirms the duty is not about "giving back" generally, but about the specific willingness to kill and be killed.

  Internal incoherences arise where the republican rhetoric of inalienable duty clashes with liberal administrative pragmatism. In Switzerland, the system pulls against itself by treating the duty as bodily (mandatory service) yet fungible (tax offset), creating ambiguity over whether the citizen owes their person or merely their value to the state. In Finland, the respect for conscience (civilian service) contradicts the coercive punishment of total objectors, suggesting conscience is respected only when it fits state-defined categories. In Sweden, the universal liability contradicts the selective reality, risking the hollowing out of the duty into mere symbolism unless the latent threat of conscription is credibly maintained.

  To replace these implicit theories with a frankly contractarian one where defense is a public good purchased from professionals, three structural changes are required. Legally, conscription statutes and liability clauses must be repealed, abolishing the state's right to compel service and eliminating civilian service mandates as alternatives to coercion. Fiscally, exemption taxes and service credits must be abolished, folding defense costs entirely into general revenue without earmarks or offsets, acknowledging defense as a service consumed by taxpayers rather than a duty performed by citizens. In terms of self-understanding, citizenship must be decoupled from defense, redefining the citizen as a client of state security rather than a participant in it, and the state must reclaim the monopoly on possession of military hardware, removing service weapons from private homes to signify that force is exclusively professional rather than popular.
