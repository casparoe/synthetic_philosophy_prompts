      *   **Self-Understanding:** Citizenship decoupled from defense. Defense becomes a service provided by the state (like police), not a duty of the citizen. The "rifle at home" becomes illegal/state property. Exemption taxes vanish (no duty to exempt from). Civilian service becomes voluntary or unrelated to defense.
