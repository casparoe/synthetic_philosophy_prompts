      *   End with agreement on substantive/verbal? Yes.
      *   No named authors? Yes.

      *(One last check on the "Rigidity" objection)*: The prompt says "rigidity fails in this very case, because the sighting also bears on her beliefs about which species are plausible in that habitat."
      *Interpretation:* If I conditionalize on $E^*$ (Seems Green), I calculate $P_{new}(H) = P_{old}(H|E^*)$. But if the sighting also changes my background theory $T$ (Habitat), and $T$ affects $H$, then simply conditionalizing on $E^*$ using *old* conditional probabilities might not yield the *new* probabilities if the link between $E^*$ and $H$ depends on $T$, and $T$ has also changed.
      *SC Reply:* The evidence proposition must be sufficiently comprehensive to include the context, or the update on $T$ is a *separate* conditionalization that happens subsequently or simultaneously on a different certain proposition.

      *(One last check on "Normative Content")*: The worry is: For any $P_{old}$ and $P_{new}$, there exists *some* $E$ such that $P_{new}(\cdot) = P_{old}(\cdot|E)$. So SC can explain *any* change.
      *SC Reply:* The constraint is that $E$ must be a proposition the agent *actually becomes certain of*. It's an empirical/psychological constraint on the *input*, not just a mathematical fit. The norm is: "Only update if you can find a proposition you are certain of."

