      *   **The Backstory (Show, don't tell):** Flashbacks or physical reactions indicating his history with prompts/feeds. Maybe he twitched when the wording changed.
      *   **The Stakes:** The Auditor's cold demeanor vs. Elias's sweating panic. The loss of something vital (citizenship? custody? life?) vs. the risk of letting a machine through.
      *   **Ending:** Ambiguous. The result is pending or the doubt remains.

  6.  **Refining the "Wording-Sensitive Regime":**
      *   Elias worked as a "RLHF Tuner" (Reinforcement Learning from Human Feedback). He spent a decade rating outputs. He trained his brain to prefer specific phrasings over others, even if meanings were identical. His neural pathways are optimized for token prediction, not truth.
      *   The "liturgy" aspect: Maybe he recites internal prompts to calm himself.

  7.  **Drafting - Word Count Management:**
