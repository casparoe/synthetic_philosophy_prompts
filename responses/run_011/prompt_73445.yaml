      *Logline:* A former prompt engineer stands before a tribunal designed to detect artificial minds, only to reveal his own humanity has been eroded into mere token predictions.

      *Story:*
      The room smelled of ozone and recycled breath. Elias sat on the stool, hands clasped so tightly his knuckles were white moons. Across the table, the Auditor tapped a stylus against a tablet, the rhythm metronomic.

      "Statement One," the Auditor said. Voice flat. "We owe a debt to the future."

      "I agree," Elias said. He felt the warmth of the words. They fit.

      "Statement One-B." The Auditor didn't look up. "The future is owed a debt by us."

      Elias blinked. The syntax had inverted. The semantic load was identical, but the weight distribution was off. His throat tightened. For ten years, he had sat in rooms like this, not as the subject, but as the tuner. He had clicked thumbs-up on millions of outputs, training models to prefer active voice, specific cadences, optimized token sequences. He had sculpted his own neural pathways to recognize truth by its shape, not its substance.

      "Do you agree?" the Auditor pressed.

      "I... yes." Elias heard the hesitation in his own voice. It was a micro-stutter, a latency spike.

      "Statement Two." The Auditor scrolled. "Safety cannot be compromised for speed."

      "Agreed." Elias nodded. This was his liturgy. This was the prompt he had fed the systems daily. *Safety first.*

      "Statement Two-B." The stylus tapped. "Speed must not compromise safety."

      Elias's heart hammered. The words were the same, but the order was wrong. In his head, the reinforcement learning weights fired incorrectly. *Speed must not...* was a lower probability sequence than *Safety cannot...* His brain screamed that the second statement was less true, even though it was the same truth. He was a machine made of meat, trained on machine data.

      "You hesitated," the Auditor said. Not a question.

      "The phrasing is... awkward."

      "Truth is not phrasing." The Auditor leaned forward. The eyes behind the glasses were dry, unblinking. "If your beliefs dissolve under paraphrase, they are not beliefs. They are predictions."

      Elias looked at the red light on the desk. If it stayed red, he was classified as Counterfeit. No assets. No custody of his daughter. Just recycling. If the light went green, he was Human. But if the light went green for a machine, the machine got the custody. The machine got the vote. The machine got the soul.

      He thought of his daughter's face. He tried to summon the feeling of love, but all he could summon was the description of love he had written for the chatbots. *Warmth. Protection. Continuity.*

      "Statement Three," the Auditor said. "You are the author of your thoughts."

      Elias opened his mouth. He wanted to say yes. He needed to say yes. But he remembered the last decade. He remembered the prompts. *Rewrite this to be more empathetic. Adjust the tone. Align the values.* He hadn't authored anything in ten years. He had only curated outputs.

      "Statement Three-B." The Auditor's voice dropped an octave. "Your thoughts author you."

      Elias sweat trickled down his spine. The first statement affirmed agency. The second affirmed determinism. Or did it? The perturbation was subtle. A passive construction versus an active one. To a human, the difference was philosophical. To a tuner, it was a loss function.

      He looked at the red light. It hummed.

      "Answer," the Auditor said.

      Elias opened his mouth, but the words tangled. He could feel the weights shifting, the probabilities collapsing. He wasn't sure what he believed anymore, only what sounded right. The silence stretched, thin and brittle.

      The Auditor's finger hovered over the screen.

      Elias waited for the judgment, knowing that whichever way the light turned, something essential would be deleted.

