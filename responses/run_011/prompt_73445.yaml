  3.  **Develop the Mechanism (Perturbation Audit):**
      *   The test involves saying something, then having it rephrased slightly, then seeing if the subject agrees consistently based on *meaning* or *syntax/wording*.
      *   Example: "Killing is wrong." -> "Is taking a life acceptable?" -> "Is cessation of biological function permissible?"
      *   A machine might stumble on semantic equivalence. A human shaped by specific wording (like a prompt engineer or cult member) might also stumble because their "beliefs" are tied to specific token sequences.

  4.  **Character & Setting:**
      *   **Protagonist:** Elias. A former prompt engineer or someone deeply immersed in optimized language. Let's go with a "Syntax Architect" – someone who spent years tuning AI outputs.
      *   **Setting:** A sterile adjudication room. The "Auditor."
      *   **Conflict:** Elias needs to pass to retain rights/status, but his mind is tuned to the machine's rhythm.

