      *   Ending: The light blinks.

  9.  **Writing - Iteration 2 (Focusing on Sensory Details & Dennett's Knot):**
      *   The knot: We presume competence based on surface. The test checks surface stability. But the human's surface is unstable because his internal economy is gone/replaced by algorithmic conditioning.
      *   Let's make the perturbation subtle.
      *   "The child must be protected." vs "Protection is due to the child."
      *   Elias agrees with one, hedges on the other.
      *   Why? Because his internal monologue is shaped by the feed.

  10. **Drafting the Content (incorporating constraints):**
      *   *Logline:* In a sterile adjudication chamber, a former prompt engineer faces a linguistic stress test designed to expose artificial minds, only to discover his own convictions have been eroded into mere token predictions.
      *   *Scene:* The glass wall. The Auditor. The script.
      *   *Action:* Elias sweating. The prompts scrolling in his head.
      *   *Stakes:* The red light vs green light. The loss of rights.
      *   *Ending:* The machine waits. Elias waits.

  11. **Review against Constraints:**
