answer: |-
  You have correctly identified a structural flaw in the epistemology of deterrence, and you are right to be unsatisfied with the standard labels.

  Here is the conceptual carving you are looking for.

  ### 1. The Existing Neighborhood

  You are correct that the **Deterrence Paradox** is usually reserved for the *rationality* problem (Schelling): How can you credibly threaten a response that would be suicidal/irrational to actually carry out? That is a game-theory problem, not an epistemological one.

  You are also correct that the **Dog That Didn't Bark** is a neighbor but not the thing. Sherlock Holmes used the silent dog to *infer* presence (the intruder was known to the dog). In your scenario, the silence cannot distinguish between "the dog knew the intruder" (deterrence worked) and "there was no intruder" (no intent to attack).

  The two closest established concepts are:

  **A. The Prevention Paradox (Geoffrey Rose)**
  Originating in public health, this states: *"A measure that brings large benefits to the community offers little to each participating individual."* It is often extended to mean: *"Successful prevention leaves no evidence that it was needed."*
  *   **Proximity:** High. It captures the "success is invisible" dynamic.
  *   **Limit:** It focuses on political credit and resource allocation (why fund vaccines if no one gets sick?), not on the logical asymmetry of evidence or the incentive to manufacture crises.

  **B. The Identification Problem (Political Science/IR)**
  Scholars like Paul Huth and Bruce Russett explicitly label your first observation as the **Identification Problem of Deterrence**. They note that because we cannot observe the counterfactual (what the attacker *would* have done without the threat), we cannot statistically isolate deterrence as a causal variable.
  *   **Proximity:** Very High. This is the academic term for your first paragraph.
  *   **Limit:** It is dry, methodological jargon. It describes the measurement error but doesn't capture the *dynamic consequence* (the second-order incentive to create crises).

  ### 2. Distinctions (Carving the Concept)

  You asked to distinguish this from three specific neighbors. Here is the tight carving:

  **Vs. Survivorship Bias**
  You are right to reject this. Survivorship bias is a *selection effect* (you only see the planes that came back). Your problem is not that the sample is skewed; it is that the *data point itself is missing*.
  *   **Survivorship Bias:** The success cases exist, but we aren't looking at them.
  *   **Your Concept:** The success case is a "null event." It does not generate data. It is an *observation gap*, not a *selection gap*.

  **Vs. Ordinary Unfalsifiable Theory**
  A theory is unfalsifiable if *no* observation can contradict it (e.g., "invisible dragons"). Deterrence theory *is* falsifiable, but **asymmetrically**.
  *   **Falsification:** One observable attack = Theory falsified (for that instance).
  *   **Confirmation:** Infinite non-attacks = Theory unconfirmed (because intent is unknown).
  *   **Distinction:** This is not "unfalsifiable"; it is **Asymmetrically Falsifiable**. It accumulates disconfirming evidence easily, but confirming evidence is structurally capped at low confidence.

  **Vs. Rare but Genuine Confirmation**
  In some fields, success is rare but observable (e.g., finding a Higgs boson). In deterrence, success is *frequent* (every day no war happens) but *unobservable as success*. The problem isn't rarity; it's **Causal Opacity**.

  ### 3. The Coinage

  Since no single term captures both the epistemological asymmetry *and* the second-order incentive to manufacture risk, I propose we split the label to maintain precision, then unify them.

  **Part 1: The Epistemology**
  **Term:** **The Null-Event Asymmetry**
  **Definition:** A condition in preventive policy where the success condition (non-occurrence) is observationally identical to the null hypothesis (no intent), while the failure condition (occurrence) is distinct and observable. This creates a bias where failure is over-counted as evidence and success is under-counted as noise.

  **Part 2: The Dynamic (Second-Order)**
  **Term:** **The Credibility Deficit Spiral**
  **Definition:** Because the Null-Event Asymmetry prevents an actor from proving their deterrent is effective, they must generate observable "signals of resolve" (crises, alerts, brinkmanship) to demonstrate capability. These signals increase the risk of accidental failure, thereby creating the very near-misses used to validate the policy.

  **Unified Term:** **The Deterrence Visibility Trap**
  **Definition:** A structural feedback loop in threat-based policy where the invisibility of successful prevention compels actors to manufacture observable risks to prove credibility, thereby increasing the probability of policy failure while simultaneously obscuring the evidence of policy success.

  ### 4. The Edge Case: Is it Fatal?

  You asked: *Is there any observation at all that would legitimately count as confirming that a deterrent worked?*

  It is not strictly unfalsifiable, but it is **Evidence-Starved**. For a null event to count as confirmation, you need to bridge the counterfactual gap. This requires **ex-post intent intelligence**.

  **The Confirmation Condition:**
  For a non-event to count as deterrence success, you need three observable data points:
  1.  **Capability:** The adversary had the means to act.
  2.  **Intent:** You possess intelligence (documents, memos, intercepts) showing the adversary *planned* to act.
  3.  **Cessation:** You possess intelligence showing they abandoned the plan *specifically after* the threat was issued.

  Without #2 and #3, a non-event is just a non-event. With them, it is a **Verified Deterrence Event**.

  **Is the asymmetry fatal?**
  Not fatal, but it imposes a **Burden of Proof Shift**.
  *   In normal science, the burden is on the disproof.
  *   In deterrence, because of the Null-Event Asymmetry, the burden effectively shifts to the *prover of success*. Since they cannot prove intent without spying, the default assumption must be that the policy did nothing unless proven otherwise.
  *   The "occupational hazard" is that policymakers ignore this shift. They treat "Peace" as "Proof," which triggers the Credibility Deficit Spiral (manufacturing crises to prove what peace already supposedly proved).

  ### Summary
  *   **Standard Term:** The Identification Problem (IR), Prevention Paradox (Public Policy).
  *   **Your Specific Concept:** The Null-Event Asymmetry (Epistemology) + Credibility Deficit Spiral (Behavior).
  *   **Proposed Unified Name:** The Deterrence Visibility Trap.
  *   **Key Distinction:** It is Asymmetrically Falsifiable, not Unfalsifiable. It is an Observation Gap, not Survivorship Bias.
  *   **Legitimate Confirmation:** Only possible with ex-post intelligence on adversary intent.
