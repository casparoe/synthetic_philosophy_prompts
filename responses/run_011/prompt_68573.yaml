  *   Marcus (Hedge): In Kyoto, this hedge is a clear refusal. Bluntness is aggression. So the hedge is actually *more* clear and ethical in a global context.
  *   Elena (Blunt): If the meaning relies on a local code, then using the hedge assumes the author shares that code. If the author is from a culture that values directness, the hedge is deceptive. Therefore, relying on the code makes the hedge *less* reliable than literal truth.

