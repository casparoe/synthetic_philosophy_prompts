      *   **Hedge (Let's call him Marcus):** Values community cohesion, face-saving, and the long-term relationship. Believes the *message* is received regardless of the *words*.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Establish the stakes. The ECR context is crucial.
