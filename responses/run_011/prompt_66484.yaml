answer: |-
  **EXAMINATION PAPER**

  **Course:** Animal Ethics (MA/Year 4)
  **Module:** Wild Animals & Agriculture
  **Time Allowed:** 80 Minutes
  **Total Marks:** 20

  **INSTRUCTIONS:** Answer the question below. Closed book. Calculators are not permitted; the arithmetic is designed to be done by hand.

  **QUESTION 1**

  Consider the following dataset regarding field mouse welfare in two agricultural systems:

  *   **System W (Annual Wheat):** Yields 45 million human-edible kcal per hectare per year. Causes 14 mouse deaths per hectare per year (via tillage/harvest).
  *   **System P (Permanent Pasture):** Yields 1.5 million human-edible kcal per hectare per year. Causes 2 mouse deaths per hectare per year (via predation/grazing management).
  *   **Conversion Cost:** Ploughing an existing sward (System P) to establish cropland (System W) incurs a one-off cost of 25 mouse deaths per hectare.

  **Part (a)**
  Stipulate that every mouse death is a loss of one welfare unit and no other welfare factors matter.
  1.  Calculate the mouse-death cost per million kcal for both systems.
  2.  Determine over what time horizon, if any, the least-harm argument favours System P (Beef) over System W (Wheat) for a *dietary* choice.
  3.  Explain what ethical license the one-off conversion cost provides regarding *land use* decisions for existing grassland.
  *(10 Marks)*

  **Part (b)**
  Swap the stipulation: Suppose the resident mouse population lives net-negative lives, such that a mouse death is a *gain* of one welfare unit (ending suffering). Note that undisturbed pasture carries about 40 mice per hectare while the wheat field carries about 200 at peak.
  1.  Does the least-harm framework now recommend the most lethal agriculture available? Explain why or why not using the data.
  2.  Identify what must be added to the welfare framework to prevent this conclusion from becoming a *reductio ad absurdum*.
  *(10 Marks)*

  ***

  **MODEL ANSWER**

  **Part (a): Dietary Choice vs. Land Use**

  To evaluate the least-harm argument correctly, we must distinguish between dietary efficiency (kcal) and land management (hectares). A common error is comparing death rates per hectare without normalizing for food output.

  First, we calculate the death cost per unit of food. System W yields 45 million kcal/ha with 14 deaths. This is approximately 0.31 deaths per million kcal. System P yields 1.5 million kcal/ha with 2 deaths. To produce the same 45 million kcal as one hectare of wheat, System P requires 30 hectares of pasture (45 ÷ 1.5 = 30). Thirty hectares of pasture incur 60 deaths annually (30 ha × 2 deaths).

  Comparing the dietary cost: System W causes 14 deaths to produce 45 million kcal; System P causes 60 deaths to produce the same energy. System W is vastly superior for dietary choice. Consequently, there is **no time horizon** over which the least-harm argument favours System P for a consumer choosing between wheat and beef. The efficiency gap is too large; the lower per-hectare death rate of pasture is obliterated by the land intensity required to match crop calories.

  However, the conversion cost changes the analysis for *land use*. If a land manager possesses existing grassland (System P), they must decide whether to plough it for wheat (System W).
  *   **Status Quo (Pasture):** 2 deaths/year.
  *   **Conversion (Wheat):** 25 deaths (one-off) + 14 deaths/year.

  In this fixed-hectare scenario, System W incurs a massive upfront debt of 25 deaths and a higher annual recurring cost (14 vs 2). System P is immediately preferable and remains preferable indefinitely. The conversion cost licenses a **presumption against ploughing existing grassland**. It does not license eating beef; it licenses retaining the land as pasture to avoid the transition violence, even if the crop system is more efficient per calorie. The conclusion is strictly about land-use history, not dietary composition.

  **Part (b): Net-Negative Lives and the Reductio**

  If mouse lives are net-negative, death terminates suffering and constitutes a welfare gain (+1 unit). Under this stipulation, System W causes 14 gains/year/ha, while System P causes 2 gains/year/ha. Per hectare, System W generates more welfare value by killing more mice. Per kcal, System W also generates more value (14 gains vs 60 gains required for equivalent beef calories).

  Taken in isolation, this framework recommends maximizing the death rate of wild animals. Since agriculture disturbs habitats and increases turnover, the framework would theoretically recommend the **most lethal agriculture available** to maximize the "benefit" of ending negative lives. This is a *reductio ad absurdum*; it implies we should industrially farm wild animals solely to kill them, or choose chaotic, high-mortality systems over stable ones.

  To stop this, the framework must account for the **welfare cost of bringing lives into existence**. If a life is net-negative, the creation of that life is a harm. We cannot count the gain of death without counting the loss of the life lived.
  *   **Current Flaw:** Counting death as +1 while ignoring the negative value of the life lived treats the creation and destruction of a suffering subject as a net positive cycle.
  *   **Required Fix:** The calculus must sum the negative welfare of the living population alongside the positive welfare of the death.
      *   Pasture: 40 mice living (negative value) + 2 deaths (positive value).
      *   Wheat: 200 mice living (larger negative value) + 14 deaths (positive value).

  Even if death is a relief, populating a hectare with 200 suffering mice (Wheat) is likely worse than populating it with 40 (Pasture), because the cumulative suffering of the living outweighs the relief of the few who die. The framework must value **non-existence** or **population reduction** without requiring active killing. The goal becomes minimizing the total population of net-negative lives, not maximizing the death rate of existing ones. Without adding the disvalue of the life-lived, the theory collapses into a mandate for extermination.

  ***

  **MARKING SCHEME**

  **Total Marks: 20** (5 Points × 4 Marks each)

  **1. Correct kcal Normalization (Part a)**
  *   **4 Marks:** Correctly identifies that 1 ha Wheat = 30 ha Beef for equal calories. Calculates 14 deaths (Wheat) vs 60 deaths (Beef) per 45M kcal.
  *   **Error costing marks:** Comparing the per-hectare death rates (14 vs 2) and calling that a comparison of diets. (0 marks for this point).

  **2. Correct Handling of Conversion Cost (Part a)**
  *   **4 Marks:** Treats the 25-mouse cost as a one-off pulse added to the annual wheat rate for the specific hectare being converted. Compares 2/yr (Pasture) vs 25+14/yr (Wheat).
  *   **Error costing marks:** Treating the 25-mouse pulse as an annual cost or ignoring it entirely. (0 marks for this point).

  **3. Distinct Conclusions for Diet vs. Land (Part a)**
  *   **4 Marks:** Explicitly states Beef *never* wins on diet (Wheat is always lower harm), but Beef/Pasture wins on land-use (Do not plough). Identifies the argument as a land-use constraint, not a dietary license.
  *   **Error costing marks:** Concluding Wheat is worse just because 14 is bigger than 2, or claiming Beef is justified for eating. (0 marks for this point).

  **4. Identification of Reductio (Part b)**
  *   **4 Marks:** Acknowledges that if death = gain, the data supports high-mortality systems (Wheat > Pasture). Identifies that this logically leads to recommending the most lethal agriculture to maximize "death gains."
  *   **Error costing marks:** Failing to see that the data supports lethal ag under the new stipulation, or denying the premise leads to this conclusion. (0 marks for this point).

  **5. Framework Correction (Part b)**
  *   **4 Marks:** Argues that one must count the negative welfare of the *living* population (200 vs 40 mice), not just the death event. States that creating a negative life is a harm that death does not fully cancel.
  *   **Error costing marks:** Letting the death-gain cancel the life-cost as though causing a bad life and then ending it were neutral. (0 marks for this point).

  **A-VERSUS-B DISCRIMINATOR**

  *   **A Grade (16-20 marks):** The student immediately separates the *dietary* question (kcal normalized) from the *land-use* question (fixed hectare). They recognize that the Davis-style argument fails on diet with these numbers but succeeds as a constraint on ploughing. In Part (b), they identify that "death as benefit" requires a counter-weight of "life as cost" to avoid mandating extermination.
  *   **B Grade (10-15 marks):** The student performs the arithmetic correctly but conflates diet and land use, suggesting the conversion cost might justify eating beef. In Part (b), they identify the problem but offer a vague solution (e.g., "we need rights" or "killing is wrong") rather than fixing the utilitarian calculus regarding population welfare.
