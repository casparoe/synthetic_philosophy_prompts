prompt: |-
  I'm setting the final for a 4th-year/MA animal ethics seminar and I want one question on the least-harm argument — the Steven Davis style claim that crop production kills more wild animals than pasture-based beef does, so a utilitarian should be eating beef instead of lentils. Trouble is every student has read a digest of that debate and can reproduce it from memory, so I want the question to hang off a made-up dataset in the stem that they actually have to compute and interpret. Can you write me the whole thing?

  Here's the data I want you to build the stem around (feel free to tidy up the presentation, keep the numbers as they are since they're chosen so the arithmetic is doable in their heads): one hectare of annual row-crop wheat kills about 14 field mice a year through tillage and harvest and yields 45 million human-edible kcal; one hectare of permanent pasture under a grass-fed beef system kills about 2 mice a year and yields 1.5 million human-edible kcal; and ploughing out an existing sward to convert it to cropland kills a one-off extra 25 mice per hectare. Stipulate for part (a) that every mouse death is a loss of one welfare unit and nothing else matters. Then part (b) swaps the stipulation: suppose the resident mouse population has net-negative lives, so a mouse death is a *gain* of one unit, and note that undisturbed pasture carries about 40 mice per hectare while the wheat field carries about 200 at peak.

  Part (a) should ask them, over what time horizon if any does the least-harm argument come out in favour of beef on these numbers, and what the one-off conversion cost licenses — my intended point is that it's a land-use conclusion about not ploughing existing grassland, not a conclusion about what's on your plate. Part (b) should ask whether least-harm now recommends the most lethal agriculture available, and what has to be added to the framework to stop that being a reductio. 80 minutes, closed book, 20 marks.

  Give me the question stem, a model answer of about 700 words (no citations or namedropping needed — I want the reasoning, not a literature review), and a marking scheme built on five must-hit points totalling 20, with the marks each is worth and a one-liner on how students typicallly lose each one. Then finish with an explicit A-versus-B discriminator. The marking scheme should name the specific errors that cost marks — comparing the per-hectare death rates and calling that a comparison of diets, treating the 25-mouse pulse as an annual cost, concluding wheat is worse just because 14 is bigger than 2, and in part (b) letting the death-gain cancel the life-cost as though causing a bad life and then ending it were neutral.
