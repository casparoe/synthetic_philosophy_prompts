answer: |-
  What I grant you
  I concede that almanac-makers draw the same triangles and squares as I do. I admit also that many predictions prove vain, for artisans mix truth with fable.

  My answer
  Yet you mistake the influence. The angle is not the worker, but the occasion; the soul of the earth, and within man, is the instrument. When rays converge, they do not push like a hand, but stir like a voice. Almanac-makers err not in geometry, but in attributing power to imaginary signs rather than natural angles. My reform strips away those pagan decorations to leave the physical cause entirely bare. It is not superstition to say the ear hears a consonance; it is nature. To distinguish this from fancy, one must look not at stars alone, but at weather and humors when the angles strike.

  What I require of you
  Tell me, Doctor, have you not observed in your patients that crises of fever often coincide with the quarters of the moon, regardless of the sign?
