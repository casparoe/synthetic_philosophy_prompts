answer: |-
  Here is a proposal for the principle you need, tested against your data, extended to new cases, and situated within the regulatory context of your panel.

  ### The Principle: Cellular Integrity and Homeostatic Continuity

  To satisfy the lawyers, the principle must be binary, operational, and rooted in physical observables rather than philosophical essence. To satisfy the biologists, it must align with the intuition that "cells are the unit of life." To satisfy your specific verdicts, it must distinguish between *components* of life and *instances* of life.

  I propose the **Cellular Integrity and Homeostatic Continuity (CIHC) Standard**. An entity falls under containment rules if and only if it satisfies all three of the following clauses:

  1.  **The Boundary Clause:** The entity must possess a semi-permeable lipid or proteinaceous membrane that maintains an internal chemical milieu distinct from the external environment.
      *   *Motivation:* Excludes flames, crystals, and self-replicating RNA enzymes (no internal milieu). Includes bacteria, synthetic cells, and viruses (capsid).
  2.  **The Agency Clause:** The entity must perform endogenous homeostasis (active regulation of internal state, e.g., ion gradients, pH, redox balance) using machinery contained within that boundary, without hijacking the reproductive machinery of a host.
      *   *Motivation:* Excludes viruses, viroids, and prions (no endogenous metabolism). Excludes purified mitochondria (cannot sustain gradients long-term without nuclear support). Includes RBCs (glycolysis/ion pumps), perfused hearts (tissue homeostasis), and intracellular bacteria (own ribosomes/metabolism).
  3.  **The Continuity Clause:** The entity must be either (a) reproductively competent, (b) in a reversible dormant state designed to resume (a), or (c) a differentiated somatic component of a system that satisfies (a).
      *   *Motivation:* Excludes brain-dead bodies (systemic integration lost). Includes tardigrades/embryos (dormancy). Includes RBCs/HeLa/Perfused Heart (somatic components or lines). Excludes flames/crystals (no genetic/structural continuity).

  ---

  ### Application to Your Verdicts

  Here is how the CIHC Standard processes your list. I have highlighted where it forces a decision you found difficult.

  | Case | Verdict (Yours) | CIHC Result | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Mule** | Alive | **Alive** | Satisfies all three. |
  | **RBC** | Alive | **Alive** | Boundary (membrane), Agency (glycolysis), Continuity (somatic component). |
  | **HeLa Cell** | Alive | **Alive** | Boundary, Agency, Continuity (reproductively competent line). |
  | **Purified Mito** | Not Alive | **Not Alive** | Fails Agency/Continuity. Cannot sustain homeostasis or reproduce without a nucleus. It is a component, not a system. |
  | **Perfused Heart** | Alive | **Alive** | Boundary (tissue), Agency (beating/metabolism), Continuity (somatic component). |
  | **Brain-Dead Body** | Not Alive | **Not Alive** | Fails Continuity (systemic integration lost). |
  | **Virus/Viroid** | Not Alive | **Not Alive** | Fails Agency. No endogenous metabolism; obligate hijackers. |
  | **Prion** | Not Alive | **Not Alive** | Fails Boundary and Agency. |
  | **Tardigrade/Embryo** | Alive | **Alive** | Satisfies Continuity (Dormancy Clause). |
  | **Flame** | Not Alive | **Not Alive** | Fails Boundary (no chemical membrane) and Continuity. |
  | **Crystal** | Not Alive | **Not Alive** | Fails Agency (passive growth) and Continuity (no heredity mechanism). |
  | **Robot/Comp Virus** | Not Alive | **Not Alive** | Fails Boundary (silicon/code vs. chemistry) and Agency (thermodynamic definition). |
  | **Synthetic Cell** | Alive | **Alive** | Satisfies all three. Substrate is biological (lipids/DNA). |
  | **Intracellular Bacterium** | Alive | **Alive** | Satisfies all three. Dependency does not negate Agency (has own ribosomes). |
  | **RNA Enzymes** | **?** (Want Alive) | **Not Alive** | **Fails Boundary.** They are molecules in a soup, not compartmentalized systems. |

  ### The Friction Point: RNA Enzymes vs. Intracellular Bacteria

  You noted that you cannot reconcile the RNA enzymes with the intracellular bacterium. Both are dependent. Both evolve.
  **The CIHC Standard resolves this by sacrificing your intuition about the RNA.**

  *   **Why:** The bacterium possesses a *boundary* and *endogenous machinery* (ribosomes) to translate its genes, even if it imports amino acids. The RNA enzyme is a naked catalyst.
  *   **Regulatory Implication:** If you classify the RNA enzymes as "alive," you must logically classify the flame as "alive" (both are dissipative structures consuming fuel to maintain pattern). If you classify the flame as alive, your containment rules become meaningless (you cannot contain a fire in a biosafety cabinet).
  *   **Recommendation:** Abandon the verdict that the RNA enzymes are alive. Classify them as **"Bioactive Replicators."** They require containment, not because they are *alive*, but because they are *hazardous evolving chemicals*. This gives the lawyers a category for them without breaking the definition of life.

  ---

  ### Testing Against New Cases

  Here is how the CIHC Standard handles the cases you did not list.

  1.  **Biofilm:**
      *   **Verdict:** **Alive (as material).**
      *   **Reasoning:** A biofilm is a collection of cells satisfying CIHC. The matrix itself is not alive, but the regulatory unit is the "biological material."
      *   **Risk:** High. Contains living units.

  2.  **Slime Mold (Plasmodial):**
      *   **Verdict:** **Alive.**
      *   **Reasoning:** It is one continuous membrane (Boundary) with coordinated metabolism (Agency) and reproduction (Continuity). The lack of cell walls is irrelevant; the outer boundary suffices.

  3.  **Forest (Mycorrhizal Network):**
      *   **Verdict:** **Not Alive (as a whole).**
      *   **Reasoning:** Fails Boundary. There is no single membrane enclosing the forest. It is an *ecosystem*, not an organism.
      *   **Regulation:** Regulate the individual trees/fungi, not the "forest."

  4.  **Ant Colony:**
      *   **Verdict:** **Not Alive (as a whole).**
      *   **Reasoning:** Fails Boundary. While it functions as a superorganism, it lacks the physical compartmentalization required for the CIHC.
      *   **Regulation:** Treat as "Living Material" due to the ants.

  5.  **Digital Organisms (Silicon):**
      *   **Verdict:** **Not Alive.**
      *   **Reasoning:** Fails Boundary (no chemical milieu) and Agency (no thermodynamic work).
      *   **Regulation:** Do not apply biological containment. Apply cybersecurity protocols.

  6.  **Six-Letter Genome Bacterium:**
      *   **Verdict:** **Alive.**
      *   **Reasoning:** Satisfies all three. The alphabet expansion does not negate the lipid boundary or homeostatic machinery.
      *   **Regulation:** **High Containment.** This is a critical win for the CIHC. It captures xenobiology that remains cellular.

  7.  **Ship of Theseus Human (Cyborg):**
      *   **Verdict:** **Alive (until the brain/nervous system is replaced).**
      *   **Reasoning:** As long as the biological homeostatic control system (neuro-endocrine) remains continuous, the Continuity Clause holds. If the brain is replaced by a digital substrate, it fails the Agency Clause (no longer biological homeostasis).
      *   **Regulation:** The transition point is the replacement of the *control system*, not the limbs.

