      *   *Observation:* He is correct. If you go back far enough, nothing is purely choice (genetics, upbringing, economic pressure). If you stop early, everything is choice.
      *   *Reality Check:* A volunteer committee *cannot* solve metaphysics. They need a heuristic, not a truth.
      *   *The "Fault" Test:* It's not about absolute prevention; it's about *reasonable* prevention within the context of the community's values.

  3.  **Address the Specific Questions:**
      *   *Q1: Is there a version of "couldn't have prevented it" that holds up?*
