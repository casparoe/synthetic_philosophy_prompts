          2.  *Census Method:* Single cases don't count. Need a population baseline. Method transfers, not the SPR's specific positive verdict. Must allow for indefinite negative results.
          3.  *Advance Fixing:* Claims must be specific *before* outcome is known (prevent retrofitting).
          4.  *Normal-Channel Default:* Actively exclude lying, error, and *ordinary access* first. Ordinary access is the default hypothesis to rule out.
      *   **Constraints:**
          *   Runnable in ~10 mins by a coordinator (no stats/philosophy training, potentially 2 AM).
          *   Three Dispositions: Deploy Now; Log & Re-test; Decline (with reason).
          *   Sign-off authority defined (Coordinator cannot unilaterally task teams).
          *   Format: Numbered sequence, one-line decision rule per step, sufficient answer, default answer if info missing, stop point.
          *   Data Collection: Tip register specs (fields, intake vs. resolution, baseline recomputation, limitations).
          *   Seams/Judgment Calls: Identify subjective steps, potential for disagreement, tie-breakers.
          *   Non-Evidential Factors: Family morale, volunteer confidence, legal/reputation. How to quarantine these from the evidential score.
          *   Case Studies: Run the procedure on three specific cases (a, b, c). Case (c) must result in "no action, no weight" due to lack of advance fixing. One disposition must be unpopular (likely declining the aunt or the clairvoyant).
          *   Limits & Defense: Systematic errors, impossibility of proving anomaly, advocate objections, board justification for keeping the register.
      *   **Tone:** Operational, rigorous, respectful of the framework, direct. No citations.

  2.  **Deconstruct Sidgwick's Framework for Operations:**

      *   *Balance of Improbabilities:* In search terms, this means "How likely is this guess to be right by chance vs. how likely is the source to be wrong/lying?" If the area is huge and they guess a specific spot, that's weighty. If they guess "woods" in a missing hiker case, that's chance.
      *   *Census Method:* We need a database. We can't judge *this* tip on its own merit regarding truth, but on its merit regarding *actionability* based on past performance of similar tips. We need to track success rates.
      *   *Advance Fixing:* This is the killer for most psychic tips. If they say "I see water" *after* we searched the river, it's worthless. It must be recorded *before* we check.
      *   *Normal-Channel:* Did they see the news? Do they know the family? Did they see the car parked there? Rule this out first.

  3.  **Drafting the Procedure (The "Sidgwick Protocol"):**

      *   *Goal:* 10 minutes. Needs to be a checklist.
      *   *Steps:*
          1.  Intake/Recording (Freeze the claim).
          2.  Normal Channel Check (Rule out ordinary knowledge).
          3.  Specificity/Advance Fixing Check (Is it testable and pre-outcome?).
          4.  Improbability/Chance Check (How big is the needle/haystack?).
          5.  Disposition & Sign-off.
      *   *Dispositions:*
          *   Deploy: High specificity, normal channels excluded, high improbability of chance, sign-off by Ops Director + Incident Commander.
          *   Log/Re-test: Vague or post-hoc, but recorded for census.
          *   Decline: Normal channel likely, or too vague, or post-hoc.
      *   *Sign-off:* Coordinator recommends, Incident Commander (IC) approves deployment (protects volunteer labor).

  4.  **Drafting the Data Register:**

      *   Needs to support the Census Method.
      *   Fields: Date/Time, Claimant Type, Specificity Score, Normal Channel Ruled Out? (Y/N), Claim Details (frozen), Outcome Match (Y/N/Partial), Resource Cost.
      *   Baseline: Recompute quarterly.
      *   Limitations: Self-selected sample, no control group.

  5.  **Identifying Seams (Judgment Calls):**

      *   *Normal Access:* Did they see a Facebook post? Hard to know. Tie-breaker: Assume access exists if public info matches.
      *   *Specificity:* "Near water" vs. "Under the blue bridge." Tie-breaker: Map area % covered by claim.
      *   *Improbability:* Subjective. Tie-breaker: Use the "10% Rule" (If the claim covers >10% of search area, it's chance).

  6.  **Non-Evidential Factors:**

      *   Family wants us to look. Volunteers get demoralized by wild goose chases.
      *   *Quarantine:* Evidential Score goes in the Register. Deployment Decision goes in the Incident Log. A "Decline" based on evidence can be overridden by "Deploy" based on morale, *but* it must be tagged as "Morale Deployment" so it doesn't corrupt the hit-rate stats.

  7.  **Running the Cases:**

      *   *(a) Clairvoyant (Water/Structure/North):*
          *   Normal Channel: Maybe news said "lake"? If news said "lake", "water" is normal channel.
          *   Advance Fixing: Call is time-stamped. Search status known.
          *   Specificity: "North" + "Structure" + "Water".
          *   Decision: Likely "Log & Re-test" or "Decline" depending on prior search. If South already searched, North is logical inference, not psychic. *Correction:* The prompt says teams *already worked* the south. North is the remaining logical option. This fails the "Improbability" test (it's a 50/50 guess or inference).
          *   *Wait, I need one unpopular decision.* Declining the Aunt (Case b) is usually the hardest. Let's make sure Case (a) is a "Log" (no action) because it lacks specificity (which structure?).
      *   *(b) Aunt's Dream (Specific Well):*
          *   Normal Channel: She knows the land. Did she know the person liked that well?
          *   Advance Fixing: Dream reported *now*.
          *   Specificity: High (Specific well).
          *   Improbability: High (Specific spot).
          *   *Conflict:* Family wants it. Evidence is weak (dreams are unreliable, normal channel of "knowing the land" is high).
          *   *Decision:* This is the "Decline" or "Log". If we Decline, it's unpopular. Sidgwick says rule out normal channel first. She knows the land. It's a plausible place she *would* guess.
          *   *Refinement:* To make it Sidgwickian: We must rule out that she isn't just guessing based on familiarity. If she knows the land, it's a "Normal Channel" guess unless she provides info she *couldn't* know (e.g., "body is facing east" when well is covered). Since it's just "in the well," it's a normal inference.
          *   *Decision:* Decline (Normal Channel Default). This will be unpopular.
      *   *(c) Anonymous Email (Post-Resolution):*
          *   Advance Fixing: Failed. Outcome known.
          *   Decision: No action, No weight. (As required).

  8.  **Drafting the Limits & Defense:**

      *   *Systematic Wrong:* Will miss genuine hits that are vague initially.
      *   *Cannot Do:* Prove psychic ability. Only justifies resource allocation.
      *   *Advocate Attack:* "You're filtering out real hits by demanding specificity." Response: "We are filtering out resource waste. A vague hit that can't be distinguished from chance is operationally useless."
      *   *Board Question:* Why keep the register? "To prove to ourselves and the public that we are testing, not dismissing. To maintain the census baseline."

  9.  **Refining the Tone and Constraints:**

      *   Ensure the "10-minute" constraint is met (keep steps binary/simple).
      *   Ensure the "Sign-off" is clear (Coordinator recommends, IC approves).
      *   Ensure the "Quarantine" of non-evidential factors is clear.
      *   *Self-Correction on Case A:* The prompt says "North rather than south. Our teams have already worked the south shore." If the south is done, the North is the *only* logical place left if the person is in the water. This makes it a normal inference, not a psychic hit. I need to make sure the procedure catches this.
      *   *Self-Correction on Case B:* The Aunt. She knows the land. This is the "Normal Channel Default." She has ordinary access to the knowledge that the well exists and is accessible. Unless she adds detail she couldn't know, it's a normal guess. This is the "Decline" that will be unpopular.
      *   *Self-Correction on Case C:* Must emphasize Component 3 (Advance Fixing).

  10. **Final Review against Sidgwick Components:**
      *   1 (Improbability): Included in Step 4 (Haystack/Needle).
      *   2 (Census): Included in Register section.
      *   3 (Advance Fixing): Included in Step 3.
      *   4 (Normal Channel): Included in Step 2.

  11. **Writing the Output:** (Proceeding to generate the response following these structured thoughts.)
      *   *Check:* Did I include the tie-breakers? Yes.
      *   *Check:* Did I include the quarantine of morale factors? Yes.
      *   *Check:* Is the Case C explanation clear on Component 3? Yes.
      *   *Check:* Is the "unpopular" decision identified? Yes (The Aunt).

  12. **Final Polish:** Ensure the voice is operational director to operational director. Professional, firm, empathetic but rigorous. (Self-correction: Ensure I don't sound *too* academic. Keep it to a checklist format for the procedure part).

  *(Self-Correction during drafting the procedure steps)*: Make sure the "Stop with a No" is explicit in the steps.
  *(Self-Correction on Sign-off)*: Coordinator cannot task teams. So "Deploy Now" is actually a "Recommend Deploy" that requires IC signature. I will clarify this distinction.

  *(Final check on Case A)*: "North rather than south." If the south is searched, the north is the remaining probability mass. A psychic claim that aligns with the remaining search area is indistinguishable from a logical deduction by a layperson watching the news. This fails the "Normal Channel" test (ordinary access to the fact that the south was searched). I will ensure the procedure flags this.

  *(Final check on Case B)*: The Aunt. High emotional stakes. High specificity. But high normal access (she knows the land). Sidgwick's "Normal-Channel Default" says exclude ordinary access first. If she knows the well exists, suggesting it is not anomalous. This is the "Decline."

  *(Final check on Case C)*: Post-hoc. Component 3 kills it immediately.

