answer: |-
  # OPERATIONAL PROCEDURE 7.4: ANOMALOUS TIP ASSESSMENT (THE SIDGWICK PROTOCOL)

  **Purpose:** To allocate finite search resources based on evidential weight rather than instinct, while maintaining a longitudinal record of anomalous claims.
  **Authority:** On-Duty Coordinator (ODC) assesses; Incident Commander (IC) authorizes deployment.
  **Time Standard:** ≤10 minutes per tip.
  **Dispositions:**
  1.  **DEPLOY:** Resource commitment warranted by evidential score.
  2.  **LOG:** Claim recorded for census; no immediate action.
  3.  **DECLINE:** Claim rejected; reason stated to caller.

  ---

  ## PART I: THE ASSESSMENT SEQUENCE

  **Step 1: Freeze the Claim (Advance Fixing)**
  *   **Rule:** Record the specific claim in writing before verifying it against current search data.
  *   **Sufficient Answer:** A timestamped entry detailing *what* will be found (e.g., "body," "vehicle") and *where* (coordinates, landmark, radius).
  *   **Default if Info Missing:** "Vague impression" (e.g., "I feel he is cold").
  *   **Stop Point:** If the claim is received *after* the location is found or publicly confirmed, mark **POST-HOC** and proceed to Step 5 (Disposition: LOG).

  **Step 2: The Normal-Channel Default**
  *   **Rule:** Assume the reporter has ordinary access to the information unless proven otherwise.
  *   **Sufficient Answer:** Demonstrable barrier to ordinary knowledge (e.g., claimant has no internet, claims detail not released to press, location is physically obscured from public view).
  *   **Default if Info Missing:** Assume access exists (e.g., if the area is visible from a road, assume they saw the car).
  *   **Stop Point:** If ordinary access is plausible (news, social media, personal knowledge of area), mark **NORMAL CHANNEL** and proceed to Step 5 (Disposition: DECLINE or LOG).

  **Step 3: Specificity and Search Area Ratio**
  *   **Rule:** The claimed location must represent less than 10% of the remaining unsearched probability area.
  *   **Sufficient Answer:** A specific point or small zone (e.g., "the dry well at Grid X") vs. a general zone (e.g., "the north woods").
  *   **Default if Info Missing:** Treat general zones as covering the whole sector.
  *   **Stop Point:** If the claim covers >10% of the search area, mark **LOW SPECIFICITY** and proceed to Step 5 (Disposition: LOG).

  **Step 4: The Balance of Improbabilities**
  *   **Rule:** A "HIT" is only possible if the chance of a random guess matching the claim is lower than the chance of the reporter being mistaken or deceptive.
  *   **Sufficient Answer:** High specificity + Normal Channel Excluded + Timing prior to discovery.
  *   **Default if Info Missing:** Assume chance coincidence is the stronger probability.
  *   **Stop Point:** If any previous step failed, this step automatically fails.

  **Step 5: Disposition and Sign-Off**
  *   **Rule:** Assign disposition based on cumulative failures; obtain IC signature for deployment.
  *   **Sufficient Answer:**
      *   All Steps Passed → Recommend **DEPLOY** (Requires IC Signature).
      *   Step 1 Failed (Post-Hoc) → **LOG** (ODC Signature).
      *   Step 2 Failed (Normal Channel) → **DECLINE** (ODC Signature).
      *   Step 3 Failed (Low Specificity) → **LOG** (ODC Signature).
  *   **Default if Info Missing:** **LOG**.
  *   **Stop Point:** Procedure ends.

  ---

  ## PART II: DATA COLLECTION (THE CENSUS REGISTER)

  To satisfy Component 2 (Census Method), every tip must enter the register, regardless of disposition. This allows us to compute a baseline hit rate over years.

  **Required Fields (Recorded at Intake):**
  1.  **Tip ID:** Unique alphanumeric.
  2.  **Timestamp:** Date/Time of receipt.
  3.  **Claimant Type:** (e.g., Psychic, Family, Anonymous, Retired LE).
  4.  **Claim Specificity:** (High/Medium/Low based on Step 3).
  5.  **Normal-Channel Status:** (Excluded/Plausible/Confirmed).
  6.  **Frozen Claim:** Verbatim description of the prediction *before* verification.
  7.  **Disposition:** (Deploy/Log/Decline).

  **Required Fields (Recorded at Resolution):**
  1.  **Outcome:** (Found/Not Found).
  2.  **Match Status:** (Exact/Partial/No Match/Post-Hoc).
  3.  **Resource Cost:** Volunteer hours expended.

  **Baseline Recomputation:**
  *   **Frequency:** Quarterly.
  *   **Metric:** "Actionable Hit Rate" (Deployments resulting in location / Total Deployments).
  *   **Limitation Statement:** The register establishes *our* operational success rate with these tips, not the metaphysical validity of the claims. Because tips are self-selected (not a random sample of the population) and we lack a control group of "non-tips," we cannot calculate a true statistical probability of psychic function. We can only calculate the utility of acting on such tips.

  ---

  ## PART III: SEAMS AND JUDGMENT CALLS

  These are points where two competent Coordinators may disagree. The tie-breakers below ensure consistency.

  **1. The Normal-Channel Judgment (Step 2)**
  *   **The Seam:** Determining if a reporter *could* have known something via ordinary means (e.g., did they see a Facebook post days ago and forget?).
  *   **Disagreement Source:** One Coordinator assumes honesty; the other assumes leakage.
  *   **Tie-Breaker:** **The Public Information Test.** If the detail was available in any public forum (news, social media, visible from public road) at any time prior to the call, rule **NORMAL CHANNEL**. The burden of proof is on the claimant to demonstrate isolation from information.

  **2. The Specificity Threshold (Step 3)**
  *   **The Seam:** Deciding if "near the creek" is specific enough.
  *   **Disagreement Source:** Terrain density. "Near the creek" in a desert is specific; in a rainforest, it is not.
  *   **Tie-Breaker:** **The 10% Map Rule.** Overlay the claim on the search map. If the claimed area exceeds 10% of the *unsearched* high-probability zone, it is **LOW SPECIFICITY**.

  **3. The Improbability Threshold (Step 4)**
  *   **The Seam:** Weighing the likelihood of deception vs. anomaly.
  *   **Disagreement Source:** Intuition about the caller's demeanor.
  *   **Tie-Breaker:** **The Prior Record.** Check the Census Register. If this claimant (or claimant type) has a historical Actionable Hit Rate of <1%, the probability of error/deception is statistically higher than the anomaly. Rule **NO DEPLOY**.

  ---

  ## PART IV: NON-EVIDENTIAL FACTORS (QUARANTINE PROTOCOL)

  Operational decisions are not purely evidential. Family morale, volunteer retention, and media relations matter. However, they must not corrupt the Census Register.

  **Quarantine Procedure:**
  1.  **Evidential Score:** Calculated strictly via Parts I & II. Entered into the **Census Register**.
  2.  **Operational Decision:** The Incident Commander (IC) may override a **DECLINE** or **LOG** recommendation to **DEPLOY** based on non-evidential factors (e.g., "The family is fracturing; we need to show activity").
  3.  **Tagging:** Any deployment authorized against the Evidential Score must be tagged in the Incident Log as **MORALE DEPLOYMENT** or **PUBLIC RELATIONS DEPLOYMENT**.
  4.  **Statistical Exclusion:** **MORALE/PR DEPLOYMENTS** are excluded from the "Actionable Hit Rate" calculation in the Census Register. They count as cost, but not as evidence of tip validity. This prevents inflating the success rate with searches we knew were unlikely to succeed.

  ---

  ## PART V: CASE WALKTHROUGHS

  ### Case (a): The Clairvoyant (Water/Structure/North)
  *   **Step 1 (Freeze):** Claim recorded: "In water, beneath structure, North." Time-stamped. **PASS.**
  *   **Step 2 (Normal Channel):** Caller says "North rather than South." Teams have already worked the South. News reports likely indicated the South was cleared. A layperson infers "If not South, then North."
      *   *Judgment:* Ordinary access to the logic of the search progression is plausible.
      *   *Result:* **NORMAL CHANNEL PLAUSIBLE.**
  *   **Step 3 (Specificity):** "Beneath a structure." Lakeside trails often have docks, bridges, culverts. If there are 20 structures on the north shore, this is >10% of the search zone.
      *   *Result:* **LOW SPECIFICITY.**
  *   **Step 4 (Improbability):** Chance of guessing "North" is 50%. Chance of guessing "Structure" is high given terrain. Falsehood/Error is more probable than anomaly.
      *   *Result:* **FAIL.**
  *   **Step 5 (Disposition):** **LOG.**
  *   **Reasoning:** The claim aligns with logical inference from public search status. It is not anomalous enough to warrant resource diversion.

  ### Case (b): The Aunt's Dream (Specific Well)
  *   **Step 1 (Freeze):** Claim recorded: "Disused well on family land." Time-stamped. **PASS.**
  *   **Step 2 (Normal Channel):** Aunt knows the land. Missing person knew the land. The well exists. She has ordinary access to the knowledge that the well is a plausible hiding spot or accident site. She offers no detail she could not know (e.g., "body is wrapped in blue tarp").
      *   *Judgment:* Under Component 4 (Normal-Channel Default), this is the hypothesis to be excluded first. It cannot be excluded.
      *   *Result:* **NORMAL CHANNEL CONFIRMED.**
  *   **Step 3 (Specificity):** High. A well is a point target. **PASS.**
  *   **Step 4 (Improbability):** Because Step 2 failed, the probability she is making an educated guess based on familiarity is higher than the probability of a psychic dream.
      *   *Result:* **FAIL.**
  *   **Step 5 (Disposition):** **DECLINE.**
  *   **Reasoning:** This is the decision you will not like. The family has asked publicly for this search. However, under Sidgwick's Normal-Channel Default, a suggestion from someone with intimate knowledge of the terrain is treated as an inferential guess, not an anomalous insight, unless it contains information they *could not* possess. Acting on it treats a guess as data.
  *   **Quarantine Note:** If the IC overrides this to maintain family cooperation, tag as **MORALE DEPLOYMENT**. Do not count a find here as a "Psychic Hit" in the Census.

  ### Case (c): The Anonymous Email (Post-Resolution)
  *   **Step 1 (Freeze):** Email received 9 days post-disappearance. Person already found alive in another county.
      *   *Judgment:* The outcome is already knowable. The claim cannot be fixed *before* the outcome.
      *   *Result:* **POST-HOC.**
  *   **Step 2 (Normal Channel):** Irrelevant.
  *   **Step 3 (Specificity):** Irrelevant.
  *   **Step 4 (Improbability):** Irrelevant.
  *   **Step 5 (Disposition):** **LOG (No Evidential Weight).**
  *   **Reasoning:** Component 3 (Advance Fixing) is absolute. A correspondence established after the outcome is known carries zero evidential weight because it cannot distinguish between psychic insight and ordinary information gathering (the sender could have heard the police account and emailed it to look prophetic).
  *   **Register Entry:** Record the match details, but mark **Match Status: Post-Hoc**. Do not include in Hit Rate calculations.

  ---

  ## PART VI: LIMITS AND DEFENSE

  **1. Systematic Errors**
  *   **The False Negative:** This procedure will systematically reject genuine anomalous hits that are vague initially. If a psychic sees "woods" and is right, but "woods" covers 50% of the search area, we will LOG it. We accept this cost to preserve volunteer hours.
  *   **The Baseline Flaw:** Our Census Register baseline is estimated from a self-selected archive of tips, not a random sample of the population. We cannot know the rate of "true negatives" (psychics who stayed silent). The baseline is operational, not metaphysical.

  **2. What It Cannot Do**
  *   This procedure can never tell us whether the anomaly is *real*. It can only tell us whether acting on it is *warranted*. It distinguishes utility from truth. A tip can be "true" (the body is there) but "unwarranted" (we couldn't distinguish it from a guess before looking).

  **3. The Advocate's Attack**
  *   **Objection:** "Requiring advance fixing renders a genuinely useful tip undeployable at the moment it is most useful. You are prioritizing paperwork over saving lives."
  *   **Response:** "We are prioritizing the *efficiency* of saving lives. Without advance fixing, we cannot distinguish a hit from a lucky guess. If we cannot distinguish them, we cannot build a reliable protocol. Chasing every vague impression exhausts the volunteers needed for the high-probability search. We test the tip to ensure it is a tool, not a distraction."
  *   **Objection:** "The Normal-Channel Default presupposes what it needs to show (that ordinary access is always the better explanation)."
  *   **Response:** "It is not a presumption of truth, but a presumption of *resource allocation*. In a resource-constrained environment, the null hypothesis (ordinary access) must be the default. The burden of proof lies on the claimant to justify the expenditure of volunteer labor."

  **4. Board Justification**
  *   **Question:** "Why does an organization that does not believe in psychics keep a permanent register of their claims?"
  *   **Answer:** "We keep the register not to validate the claims, but to validate our own rigor. It demonstrates to families that we do not dismiss them out of hand; we test them. It protects us from the accusation of bias. And, pragmatically, if there *is* a signal in the noise, the Census Method is the only way to find it. We are keeping the data so that we are not relying on instinct today, and so we are not accused of hiding data tomorrow."
