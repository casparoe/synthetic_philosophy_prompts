answer: |-
  On the dissolutionist reading of P.F. Strawson's "Freedom and Resentment," you are correct that the traditional metaphysical stalemate is ostensibly bypassed. If our reactive attitudes (resentment, gratitude, guilt) are natural facts about human psychology that we cannot and will not abandon, then the truth of determinism cannot logically force us to stop holding people responsible. We are, in a sense, "condemned" to the participant stance.

  However, even if we accept this dissolutionist framework, the compatibility debate remains substantive. It shifts from asking whether responsibility is *possible* to asking about the **internal coherence and scope of our responsibility practices.** Specifically, Frankfurt-style cases and the Consequence Argument are no longer fighting about the existence of free will; they are fighting about the **criteria for exemption** within Strawson's own system.

  Here is what is left for the debate to disagree about:

  ### 1. The Classification of Determinism (Excuse vs. Exemption)
  Strawson distinguishes between *excuses* (which admit the agent was a participant but claim they didn't do it or didn't mean to) and *exemptions* (which claim the agent is not a suitable target for reactive attitudes at all, e.g., due to insanity or extreme coercion).

  *   **The Consequence Argument's Role:** On the dissolutionist reading, the Incompatibilist using the Consequence Argument is not trying to prove we *will* stop blaming people. Rather, they are arguing that determinism ought to be classified as a **global exempting condition**. They claim that if determinism is true, the "quality of will" that Strawson prizes is universally undermined, just as it is in cases of psychosis or hypnosis. The debate is whether determinism functions like coercion (an exemption) or like ordinary causation (not an exemption).
  *   **Frankfurt-Style Cases' Role:** Compatibilists use these cases to argue that the absence of alternate possibilities (which determinism entails) does not automatically trigger an exemption. They aim to show that we retain our reactive attitudes toward agents in Frankfurt cases even when they couldn't have done otherwise. This suggests that "could have done otherwise" is not a necessary condition for the participant stance.

  ### 2. The Rationality of the Practice
  Even if reactive attitudes are non-optional, we can still ask whether they are **rationally defensible**. Strawson argues that it is not clear what a "total suspension" of these attitudes would look like, but he leaves open whether maintaining them in light of determinism is intellectually honest.

  *   **The Substantive Question:** Is our commitment to reactive attitudes a brute biological fact, or is it responsive to reasons? If it is responsive to reasons, then metaphysical facts *do* matter.
  *   **The Debate:** Incompatibilists argue that continuing to feel resentment in a deterministic world is a form of self-deception or ignorance. They contend that the "participant stance" relies on a tacit belief in indeterminism. Compatibilists (armed with Frankfurt cases) argue that the stance relies only on the agent's reasons-responsiveness or quality of will, which can exist even in a determined world. The fight is over whether our practices are **rational adaptations** to agency or **cognitive illusions**.

  ### 3. Moral Desert vs. Social Regulation
  Strawson's view is often interpreted as grounding responsibility in the maintenance of interpersonal relationships rather than "cosmic justice." This invites a debate about what responsibility is *for*.

  *   **Incompatibilists** often hold that for responsibility to be meaningful, it must involve **basic desert**—the idea that an agent fundamentally deserves blame or praise in a way that isn't just about social utility. They argue the Consequence Argument shows determinism rules out this deep desert.
  *   **Compatibilists** often argue that Strawson successfully reduced responsibility to the **norms of our community**. On this view, Frankfurt cases show that as long as an agent is responsive to reasons and embedded in relationships, they are responsible, regardless of whether they "ultimately" deserve it in a metaphysical sense.

  ### Summary
  If Strawson dissolves the problem of whether we *can* hold people responsible, the Consequence Argument and Frankfurt cases are left to debate **who counts as responsible.**

  The Incompatibilist uses the Consequence Argument to claim that determinism makes everyone analogous to the insane or coerced (a universal exemption). The Compatibilist uses Frankfurt cases to claim that the core of responsibility is the agent's actual sequence of reasoning and willing, not their metaphysical ability to do otherwise. The debate is no longer about the **intelligibility** of responsibility, but about the **correct extension** of the concepts we use to navigate our social lives.
