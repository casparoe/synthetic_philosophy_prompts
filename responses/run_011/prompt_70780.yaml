answer: |-
  # Specification for a Theory of Rational Compromise Between Incommensurable Value Systems

  ## I. Desiderata

  ### 1. The Indivisibility Constraint
  **Requirement:** The account must explain how agreement is reached when the object of dispute is binary for at least one party (e.g., the remains are either moved or they are not; there is no "partially moved").
  **Rationale:** Standard bargaining theory relies on continuous variables (price, quantity, probability). If Party B views the desecration of remains as a binary switch (0 or 1), standard splitting of the difference is conceptually incoherent, not just difficult. A theory that demands divisibility where the agents perceive none is describing a different conflict.

  ### 2. The Integrity Constraint (Absolute Prohibitions)
  **Requirement:** The account must explain how a party can agree to an action their own value system forbids without ceasing to hold that value system.
  **Rationale:** If Party B holds a duty as unconditional, accepting terms that violate it is not a "trade" but a transgression. A theory that treats the prohibition as merely a high cost misdescribes the agent. The theory must account for the phenomenology of *sin* or *betrayal* within the compromise itself. If the theory cannot accommodate an agent who says, "I am agreeing to do what I must not do," it rules out the case by fiat.

  ### 3. The Loss Constraint (Damage Limitation)
  **Requirement:** The account must allow for a compromise outcome that both parties rank below their initial positions (a lose-lose relative to ideal demands), provided it ranks above the breakdown point (war, expropriation, catastrophe).
  **Rationale:** Not all compromises create value; some merely mitigate disaster. If the theory requires a Pareto improvement over the status quo ante, it fails in coercion scenarios or tragedy scenarios where the status quo is no longer available. The "gain" is often negative utility minimized, not positive utility created.

  ### 4. The Incommensurability Constraint
  **Requirement:** The account must explain the mechanism of "gain from trade" without presupposing a common cardinal scale of value.
  **Rationale:** Standard Nash bargaining solutions require interpersonally comparable utilities. If Party A measures in "welfare units" and Party B measures in "fidelity," there is no exchange rate. The theory must identify what is being traded. If it posits a hidden common currency (e.g., "satisfaction"), it collapses the distinction between the value systems. The work must be done by *ordinal* rankings over outcomes, not *cardinal* measurements of value.

  ### 5. The Distinction Constraint
  **Requirement:** The account must distinguish compromise from:
  *   **Capitulation:** One side accepts the other's terms entirely.
  *   **Truce:** A temporary cessation of hostility without normative agreement.
  *   **Consensus:** A discovery that the parties actually share values.
  *   **Modus Vivendi:** Coexistence on terms neither endorses.
  **Rationale:** Compromise implies a normative commitment to the *terms* despite disagreement on the *reasons*. If the parties merely stop fighting because they are tired (truce) or because one was bullied (capitulation), no compromise has occurred. The theory must isolate the specific normative glue that holds the agreement together when the foundational values remain opposed.

  ### 6. The Residue and Corruption Constraint
  **Requirement:** The account must specify whether moral residue remains after the compromise (e.g., does Party B owe restitution to the ancestors for the violation?) and whether the act of compromising corrupts the agent's future capacity to hold their values.
  **Rationale:** In deontological systems, violating a duty often leaves a "remainder" obligation (e.g., the duty to apologize or atone). If the theory suggests the deal wipes the slate clean, it assumes a consequentialist cleanup that Party B cannot accept. Furthermore, if compromising trains the agent to treat sacred values as tradeable, the theory must account for this endogenous preference change (corruption).

  ### 7. The Reflexivity Constraint
  **Requirement:** The procedure used to reach the compromise must not presuppose a normative standard that favors one value system over the other.
  **Rationale:** Choosing a bargaining procedure (e.g., "maximize joint utility," "vote," "flip a coin") is itself a normative act. If the procedure assumes that all values are tradeable, it biases the outcome toward Party A before negotiation begins. An adequate account must either find a neutral procedure or admit that the imposition of the procedure is an exercise of power, not reason.

  ### 8. The Strategic Stability Constraint
  **Requirement:** The account must determine whether the terms reward the intensification of avowed values (e.g., does Party B get more concessions if they claim their duty is absolute rather than strong?).
  **Rationale:** If the theory incentivizes agents to claim their values are non-negotiable to extract concessions, it encourages strategic irrationality. A theory of *rational* compromise should not make it rational to lie about one's moral architecture. If it does, the equilibrium is unstable or dishonest.

  ### 9. The Persistence Constraint
  **Requirement:** The account must address whether the compromise binds future agents whose value systems may differ from the current negotiators.
  **Rationale:** Party A represents future persons (who might not value the reservoir); Party B represents ancestors (who cannot consent). If the deal binds only the living negotiators, it fails the temporal scope of both parties' values. If it binds the future, the theory must explain the authority of the past over the future without a shared democratic mandate.

  ---

  ## II. Categorization of Requirements

  **Non-Negotiable (Logical Preconditions):**
  *   **The Incommensurability Constraint:** Without this, you are not modeling the conflict described; you are modeling a price dispute.
  *   **The Distinction Constraint:** Without this, "compromise" becomes a synonym for "surrender" or "peace," losing the specific tension required for the scene.
  *   **The Reflexivity Constraint:** Without this, the solution begs the question by smuggling in a biased arbitration method.

  **Camp-Specific Commitments (Contestable):**
  *   **The Residue Constraint:** Consequentialists typically deny moral residue (the act is justified, so no debt remains); Deontologists affirm it. A theory can take a side here, but it must declare it.
  *   **The Persistence Constraint:** Liberal theories often limit bindingness to consenting agents; Communitarian theories allow intergenerational binding.

  **The Killer Constraint:**
  **The Reflexivity Constraint.**
  This eliminates the largest number of otherwise attractive accounts. Most bargaining theories (Nash, Utilitarian aggregation, Rawlsian veils) presuppose a procedural framework (rationality, symmetry, risk-neutrality) that implicitly privileges consequentialist or liberal individualist ontologies. They assume the *method* of agreement is neutral, but for a party holding sacred values, the very act of subjecting those values to a bargaining procedure is a violation. To satisfy Reflexivity, the theory must admit that the table itself is contested terrain.

  **The Impossibility Result:**
  **The Integrity Constraint, The Strategic Stability Constraint, and The Distinction Constraint are jointly unsatisfiable.**
  *   If Party B has an Absolute Prohibition (Integrity), they cannot strategically bargain without violating that prohibition.
  *   If they bargain strategically to protect the prohibition (Strategic Stability), they treat the prohibition as a preference to be weighed, which collapses Compromise into Modus Vivendi or Capitulation (Distinction).
  *   **Surrender:** You must surrender the idea that Party B can remain *integrity-preserving* while engaging in *strategic rationality*. They can either remain pure and refuse to talk, or talk and accept corruption. There is no "rational compromise" that keeps their hands clean.

  ---

  ## III. Scoring the Contenders

  **1. Pareto-Style Account (Mutual Improvement)**
  *Fails.* This requires that both parties rank the compromise outcome higher than the disagreement point by their *own* lights. If Party B views moving the remains as a moral evil, no amount of compensation raises it above the status quo of "no reservoir." This theory forces Party B to lie about their values to make the math work, violating the Incommensurability and Integrity constraints.

  **2. Common Currency Account (Utilitarian Aggregation)**
  *Fails.* This installs a third-party metric (e.g., "social welfare") to weigh the reservoir against the ancestors. It violates the Reflexivity Constraint by imposing Party A's ontology on Party B. It collapses the Distinction Constraint by turning the conflict into a calculation error rather than a value conflict, effectively silencing Party B's claim that the duty is non-tradeable.

  **3. Modus Vivendi (Coexistence Without Endorsement)**
  *Passes (with caveats).* This account suggests the parties agree on terms neither endorses normatively, solely to avoid violence. It satisfies Incommensurability and Integrity (Party B can say, "I am doing this under duress, not because it is right"). However, it fails the Distinction Constraint regarding *Compromise* specifically, as this is a truce, not a normative agreement. It is the only model that fits the facts, but it admits that "honest compromise" is unavailable.
