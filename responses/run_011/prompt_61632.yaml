answer: |-
  This pattern sits at the intersection of research methodology, epistemology, and science communication. It is distinct from standard validity errors because it is not merely a mistake about the relationship between a measure and a construct, but a specific rhetorical and epistemic maneuver regarding how *credibility* is allocated.

  Here is the carving you requested.

  ### (a) Nearest Established Concepts and Departures

  **1. External Validity (Generalizability)**
  *   **Concept:** The extent to which the results of a study can be generalized to other situations, people, settings, and measures.
  *   **Departure:** External validity is a *property* of the study design (or a lack thereof). It describes the gap. Your pattern describes the *social mechanism* that allows the gap to be ignored. A study can have low external validity without anyone making a fuss; your pattern occurs when the *internal rigor* is actively leveraged to silence concerns about the external validity. The error is not the lack of generalizability, but the use of internal quality to certify generalizability.

  **2. Construct Validity**
  *   **Concept:** The degree to which a test measures what it claims to measure (e.g., does a questionnaire actually measure "aggression"?).
  *   **Departure:** Construct validity concerns the link between the operationalization and the theoretical variable. In your examples, the link between the measure and the immediate variable is often secure (the test measures test-taking ability; the lab task measures lab behavior). The break occurs when that variable is assumed to map onto a *real-world outcome* (earnings, policing) without new evidence. Construct validity asks "Is this the right ruler?" Your pattern asks "Why does having a precise ruler prove the building is tall?"

  **3. The Surrogate Endpoint Fallacy**
  *   **Concept:** Common in medicine; assuming that because a treatment improves a biomarker (e.g., blood pressure), it will improve the clinical outcome (e.g., survival), without direct evidence.
  *   **Departure:** This is the closest neighbor, particularly for your economics example. However, "Surrogate Endpoint" is typically used to describe the *choice of measure* within the study design. Your pattern is broader: it encompasses the *post-hoc promotion* of the finding by third parties (press offices, partisans) and relies specifically on the *methodological prestige* (preregistration, sample size) to justify the leap, not just the biological plausibility of the surrogate.

  **4. Precision Bias (or Confidence Bias)**
  *   **Concept:** The tendency to trust estimates with narrow confidence intervals more than those with wide intervals, regardless of accuracy or bias.
  *   **Departure:** Precision bias explains why people trust the *number*. Your pattern explains why people trust the *implication*. It accounts for the rhetorical pivot: when challenged on the implication, the defender does not argue the implication is likely; they argue the *number* is precise.

  ### (b) Proper Home

  The pattern does not belong strictly to statistics or study design. Its proper home is the **Epistemology of Scientific Testimony** or the **Sociology of Scientific Credibility**.

  It is a failure of *warrant transmission*. In a valid argument, the warrant (the justification for moving from data to claim) must match the scope of the claim. Here, the warrant provided is "High Internal Validity," but the warrant required is "High External/Construct Validity." The pattern is the specific social phenomenon where the former is accepted as payment for the latter. It is a transactional error in the economy of scientific trust.

  ### (c) The Second Feature: Quality Rejoinders to Scope Objections

  This is a distinct rhetorical phenomenon that serves as the **immunizing strategy** for the primary pattern. It is a specialized form of the **Red Herring Fallacy**, specifically a **Procedural Deflection**.

  *   **Distinctness:** The primary pattern (the overclaim) can happen accidentally or through enthusiasm. The secondary feature (the defense) is what makes the pattern resilient and frustrating. It shifts the burden of proof. The critic must now prove the rigor *wasn't* high (which is impossible, as it was high) rather than proving the scope is unsupported.
  *   **Label:** If the primary pattern is the *transfer*, this feature is the *shield*. It relies on the audience's inability to distinguish between "The study was done well" (Internal Validity) and "The study proves the broad claim" (Inferential Warrant).
  *   **Relationship:** The defensive move is not strictly necessary for the initial error to occur, but it is necessary for the *pattern* to persist in the face of scrutiny. Without the defensive move, the claim is simply corrected. With it, the claim becomes entrenched.

  ### (d) Edges and Exclusions

  To ensure this concept does not collapse into its neighbors, here are three exclusions:

  1.  **Fraudulent or Sloppy Science:** If the rigor is faked (p-hacking, HARKing), the problem is integrity, not warrant transfer. Your pattern requires the rigor to be *real*. The error is not that the study is weak, but that its strength is being misapplied.
  2.  **Explicit Extrapolation:** If the authors state, "We found X in the lab; we *hypothesize* this applies to the real world, pending further study," and policymakers ignore the caveat, the researchers are not engaging in the pattern. The pattern requires the *credential* of the rigor to be the vehicle for the leap, often with the caveat present but inert.
  3.  **Meta-Analytic Aggregation:** If multiple studies in different contexts converge on a broad claim, the scope is earned through aggregation. Your pattern involves a *single* study (or a unified line) where the scope expands without new contexts being tested.

  **Can the pattern occur without the defensive move?**
  Yes, initially. A press release can make the leap without anyone objecting. However, the pattern you are identifying—the one that frustrates reporting and resists correction—is defined by the *persistence* of the claim. The defensive move (Procedural Deflection) is what converts a simple overstatement into a systemic epistemic error. It is the mechanism that prevents the caveat from traveling with the credential.

  ### Proposed Label

  There is no single established term that captures the *transactional conversion of internal rigor into external warrant* combined with the *procedural defense*. "External Validity" describes the gap; "Surrogate Endpoint" describes the measure; "Precision Bias" describes the trust in the number.

  The phenomenon requires a label that captures the substitution of methodological quality for evidentiary scope. I propose:

  **Rigor Surrogacy**

  **Definition:** Rigor Surrogacy occurs when high internal methodological quality (sample size, preregistration, control) is treated as a sufficient substitute for direct evidentiary support regarding the scope of a claim (external validity, construct validity, or ecological validity). It is characterized by the decoupling of the study's actual inferential reach from its perceived credibility, often maintained by deflecting scope-based criticisms with restatements of procedural quality.

  **Borderline Instance:** A study finds a drug lowers cholesterol (high rigor) and the authors suggest it *might* reduce heart attacks based on mechanistic theory, explicitly calling for outcome trials. If the media reports "Drug Proven to Prevent Heart Attacks" citing the study's size, that is media overreach. If the *authors* use the size of the cholesterol trial to argue in policy testimony that heart attacks *will* be prevented, dismissing the need for outcome trials by pointing to the cholesterol trial's preregistration, that is Rigor Surrogacy.

  \answer{Rigor Surrogacy}
