      *   **Is it Tenacity?** It looks like tenacity, but it's *socialized* tenacity. It overcomes the weakness of individual tenacity by creating a micro-society that validates the tenacity.
      *   **Peirce's Verdict:** Peirce would likely see this as a *hybrid* that perverts the Social Impulse. It's not pure Authority (no state), but it's not pure Tenacity (it's communal). It's a *parasitic* use of the Scientific Method's structure (investigation, gathering evidence) turned inward.
      *   **Key Peircean Concept:** *Real Doubt.* Peirce insists doubt must be a living, organic irritation, not paper doubt. For these conspiracists, the external disagreement does *not* generate real doubt because they have an immunizing narrative.
