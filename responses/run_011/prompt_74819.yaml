          2.  *Authority:* State/Church imposes belief. *Weakness:* Cruelty required, and it can't cover *everything*. People will reason about things outside the decree.
          3.  *A Priori (Agreeability to Reason):* Belief based on what feels "reasonable" or fashionable. *Weakness:* It's just taste, fluctuates like fashion.
          4.  *Scientific Method:* Belief determined by external permanency (reality).
      *   **The User's Insight:** The user is right. Peirce explicitly says the Method of Tenacity fails because of the *social impulse*. We realize others think differently, and that causes genuine doubt.
