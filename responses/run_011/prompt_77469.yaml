answer: |-
  **Seminar Notes: The Badness of Pain and Asymbolia**

  **1. Brainstorming Strategies**

  Both views must explain why asymbolics report sensory intactness but affective indifference. Below are the initial strategic options, pruned to the most viable theoretical positions.

  | View | Raw Options (Brainstorm) | Pruned Best Options | Reason for Pruning |
  | :--- | :--- | :--- | :--- |
  | **Evaluativism** | 1. Not pain (no eval content).<br>2. Pain present, eval content intact, motivation broken.<br>3. Pain present, unpleasant, subject doesn't care.<br>4. Sensory only; eval lost. | **A1:** Not pain (evaluative content lost).<br>**A2:** Pain present, but eval content decoupled from motivation. | (3) contradicts the definition of unpleasantness. (4) collapses into (1). |
  | **Imperativism** | 1. Not pain (no imperative content).<br>2. Command present, lacks authority/force.<br>3. Command present, motor system disconnected.<br>4. Sensory only; command lost. | **B1:** Not pain (imperative content lost).<br>**B2:** Command present, but motivational authority stripped. | (3) is empirical speculation about motor pathways. (4) collapses into (1). |

  **Pruning Rationale:** Evaluativists cannot claim the pain is unpleasant but the subject doesn't care (A3), because on this view, unpleasantness *is* the caring (the representation of badness). They must choose between denying the pain exists (A1) or positing a dissociation between evaluation and motivation (A2). Imperativists face a similar fork: either the command is absent (B1) or the command exists but lacks its essential "oughtness" (B2). Options suggesting motor disconnection are empirically risky and philosophically shallow; the issue is phenomenological, not merely behavioral.

  **2. Comparison: Explanation vs. Consistency**

  Assuming the asymbolic is sincere, **Imperativism** predicts the reports better, while **Evaluativism** must swallow a harder bullet.

  Evaluativism claims pain's unpleasantness *is* the representation of bodily badness. If the asymbolic says, "This isn't bothering me," Evaluativism must say she is not representing the state as bad. But if she localizes the stimulus perfectly, hasn't she represented the state? The Evaluativist must bite the bullet that **she is not in pain at all** (Option A1). She has sensory discrimination, but without the evaluative component, the experience lacks the essential nature of pain. This is consistent, but it fails to *explain* the dissociation; it merely defines it away. It risks contradicting the subject's claim that she feels the burning.

  Imperativism claims pain's unpleasantness *is* the felt authority of a command. If the asymbolic feels no push, she feels no command (or a mute command). Imperativism can accommodate Option B2: the imperative content is present but lacks motivational force. This *explains* the indifference: the order was issued but carried no weight. The bullet here is conceptual: **Can a command exist without authority?** Imperativists must argue that imperative content comes in degrees of urgency, and asymbolia is the zero-urgency case. This is more explanatory than Evaluativism because it allows the experience to remain a pain experience (sensory + imperative) while accounting for the lack of motivation via a parameter change (authority) rather than a content deletion.

  **3. Case D: The Unity Problem**

  Case D complicates this. D reports: "My hand is damaged and that is bad" (Cognitive Evaluation) + "I didn't mind; nothing pushed me" (No Motivation/Unpleasantness).

  **Evaluativism's Commitment:** Ev says unpleasantness *is* experiencing the body as bad. D says she experiences the body as bad (spontaneously) but feels no unpleasantness. Ev is forced to posit two kinds of "representing badness": a cognitive judgment (intact) and an experiential evaluation (lost). This fractures the phenomenology. D reports a *unified* feeling of burning that doesn't bother her. Ev must say she feels the burning (sensory) and thinks it's bad (cognitive), but lacks the *experiential* badness. This is ad hoc. If representing badness experientially just *is* unpleasantness, D's report is paradoxical for Ev.

  **Imperativism's Commitment:** Imp says unpleasantness *is* the command. D feels no push, so she feels no command. She has sensory content ("burning") and cognitive content ("this is damage/bad"), but no imperative content. Imp handles this cleanly: D has the *information* required to judge badness without the *instruction* to act. The unity of her report is an illusion of memory; phenomenologically, she had sensory info + cognitive judgment, minus the imperative force. Imp accounts for the split between "knowing it's bad" and "not minding" by locating badness in the cognition (which remains) and unpleasantness in the command (which is gone).

  However, D's spontaneous report ("that is bad") threatens Imp. If the command is gone, why does the judgment of badness persist spontaneously? Imp must argue that sensory damage signals automatically trigger cognitive judgments of badness independent of the imperative system. This is plausible but requires extra machinery. Ev requires less machinery for the judgment but fails to explain the lack of feeling.

  **4. The Third Option: Phenomenal Separabilism**

  Is there a view that handles D better? Consider **Phenomenal Separabilism**: Unpleasantness is a primitive, non-representational qualitative property (a "hedonic tone") separable from sensory and evaluative content.

  | View | Mechanism | Handling of D | Genuine Third View? |
  | :--- | :--- | :--- | :--- |
  | **Evaluativism** | Content: "Body Bad" | Fails: D represents badness but feels no unpleasantness. | N/A |
  | **Imperativism** | Content: "Stop!" | Good: D has info, lacks command force. | N/A |
  | **Separabilism** | Qualia: "Hurt" | Best: D has sensory/cognitive content, lacks hedonic tone. | **Yes**, if tone is non-content. |

  Separabilism says D has the sensory qualia of burning and the cognitive judgment of damage, but the lesion destroyed the *hedonic tone* generator. This handles D's unity perfectly: she felt one thing (burning) that lacked the usual affective hue.

  Is this a genuine third theory? If the hedonic tone is defined functionally as "that which motivates," it collapses into Imperativism. If it is defined representationaly as "feeling bad," it collapses into Evaluativism. To be genuine, the tone must be a **raw feel** with no intrinsic content or direction. This is metaphysically costly (qualia mysticism) but phenomenologically precise. It avoids Ev's problem (representation without feeling) and Imp's problem (command without force) by denying pain *is* either content. It is simply a sensation that *usually* carries this tone.

  **5. Verdict**

  **Imperativism survives the asymbolia data best overall.**

  While Separabilism handles D's phenomenology smoothly, it lacks the explanatory power regarding *why* pain motivates. Imperativism builds motivation into the content (commands motivate by definition). Evaluativism fails on Case D because it cannot easily separate the representation of badness from the feeling of badness without bifurcating "evaluation" into cognitive and experiential kinds arbitrarily. Imperativism naturally distinguishes between *information* about damage (cognitive/sensory) and *instruction* regarding damage (imperative). Asymbolia is the loss of the instruction's authority.

  **The Single Hardest Counterexample:** **Masochism.**
  In masochism, subjects seek out pain and report enjoying it. Imperativism must say the experience issues a command ("Stop!") that the subject deliberately disobeys and finds satisfying. But if the subject enjoys it, in what sense is the experience *unpleasant*? If unpleasantness is the command's authority, and the subject welcomes the command, the authority seems negated. The Imperativist must argue the command remains strong (hence it is pain) but is overridden by higher-order desires. This is tenable but strains the link between unpleasantness and motivation. Evaluativism handles this slightly better (representing damage as bad while desiring it for other reasons), but given D's case, Imperativism remains the robust choice for the nature of unpleasantness itself.
