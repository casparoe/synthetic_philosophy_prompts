answer: |-
  # Workshop Handout: The Social Regularity Sorter
  **Goal:** Classify observed patterns of behavior without using philosophical jargon.  
  **Method:** Answer the questions below by observing behavior or asking participants.  
  **Time:** 90 Minutes (including case studies).

  ---

  ## The Decision Tree

  **START:** You have observed a pattern of behavior that almost everyone in a group follows.

  ### NODE 1: The Solitary Test
  **Question:** If you were the only person left on Earth (or in an empty room), would you still do this?
  *   **YES** → Go to **Leaf 1 (Individual Habit)**.
  *   **NO** (It loses its point or is impossible) → Go to **Node 2**.

  ### NODE 2: The Swap Test
  **Question:** Could the whole group switch to a completely different behavior tomorrow (e.g., left instead of right, silence instead of speech) and achieve the *exact same result*?
  *   **NO** (The goal would fail, or it would feel inherently wrong) → Go to **Node 3**.
  *   **YES** (The alternative would work just as well) → Go to **Node 4**.

  ### NODE 3: The Outrage Test (For Non-Swappable Regularities)
  **Question:** When someone breaks this pattern, do uninvolved bystanders get **angry/outraged** (moral violation) or just **inconvenienced** (technical failure)?
  *   **ANGRY** → Go to **Leaf 2 (Moral Norm)**.
  *   **INCONVENIENCED** → Go to **Leaf 3 (Technical Constraint)**.

  ### NODE 4: The Bystander Test (For Swappable Regularities)
  **Question:** If someone breaks this pattern, do uninvolved bystanders (strangers who aren't directly affected) react or punish them?
  *   **NO** (They don't care or notice) → Go to **Node 5**.
  *   **YES** (They intervene, glare, or sanction) → Go to **Node 6**.

  ### NODE 5: The Awareness Test (For Non-Sanctioned Regularities)
  **Question:** Do people follow this because they know *everyone else knows* to do it, or did it just emerge without anyone really thinking about it?
  *   **KNOWLEDGE-BASED** (People can explain the coordination) → Go to **Leaf 4 (Lewisian Convention)**.
  *   **EMERGENT** (No one represents the alternative; trial-and-error learning) → Go to **Leaf 5 (Evolutionary Stable Strategy)**.
      *   *Note: See "Limitations" below. Empirically, these often look identical.*

  ### NODE 6: The Heat Test (For Sanctioned Regularities)
  **Question:** Are the bystanders **angry/indignant** (violating a duty) or just **annoyed/awkward** (violating a preference)?
  *   **ANGRY** → Go to **Leaf 6 (High-Stakes/Regulated Norm)**.
  *   **ANNOYED** → Go to **Node 7**.

  ### NODE 7: The Constitutive Test
  **Question:** If everyone stopped following this rule, would the activity itself cease to exist (e.g., the game can't be played), or would it just get messy?
  *   **CEASE TO EXIST** → Go to **Leaf 7 (Constitutive Rule)**.
  *   **JUST MESSY** → Go to **Leaf 8 (Social Norm / Etiquette)**.

  ---

  ## The Leaves (Classifications)

  | Leaf | Name | Commitment |
  | :--- | :--- | :--- |
  | **1** | **Individual Habit** | A regularity driven by personal preference or prudence, independent of others' behavior. |
  | **2** | **Moral Norm** | A regularity perceived as intrinsically right/wrong, independent of coordination benefits. |
  | **3** | **Technical Constraint** | A regularity dictated by physical reality or functional necessity, not social agreement. |
  | **4** | **Lewisian Convention** | A self-enforcing coordination equilibrium sustained by common knowledge of mutual expectations. |
  | **5** | **Evolutionary Stable Strategy** | A coordination equilibrium sustained by reinforcement history without requiring reasoning or common knowledge. |
  | **6** | **High-Stakes Norm** | An arbitrary rule enforced by third-party anger due to safety or legal implications (e.g., traffic laws). |
  | **7** | **Constitutive Rule** | A rule that defines the activity itself; breaking it makes the action unintelligible within that context. |
  | **8** | **Social Norm (Etiquette)** | An arbitrary regularity enforced by mild social sanctions (awkwardness, judgment) rather than moral outrage. |

  ---

  ## Case Study Key (For Workshop Discussion)

  *   **Driving on the Right:** Node 1 (No) → Node 2 (Yes) → Node 4 (Yes) → Node 6 (Angry/Danger) → **Leaf 6**.
  *   **QWERTY Layout:** Node 1 (No) → Node 2 (Yes) → Node 4 (No) → Node 5 (Knowledge) → **Leaf 4**.
  *   **US Never Going Metric:** Node 1 (No) → Node 2 (Yes) → Node 4 (No) → Node 5 (Emergent/History) → **Leaf 5** (or 4, debatable).
  *   **Saying "Bless You":** Node 1 (No) → Node 2 (Yes) → Node 4 (Yes) → Node 6 (Annoyed) → Node 7 (Messy) → **Leaf 8**.
  *   **Outrage at Line Jumping:** Node 1 (No) → Node 2 (No - Fairness isn't arbitrary) → Node 3 (Angry) → **Leaf 2**.
  *   **White Moving First in Chess:** Node 1 (No) → Node 2 (Yes) → Node 4 (Yes - Referee/Opponent) → Node 6 (Annoyed) → Node 7 (Cease to Exist) → **Leaf 7**.
  *   **Coat on Library Chair:** Node 1 (No) → Node 2 (Yes) → Node 4 (Yes) → Node 6 (Annoyed) → Node 7 (Messy) → **Leaf 8**.
  *   **Pronouns (Y'all/Youse):** Node 1 (No) → Node 2 (Yes) → Node 4 (No) → Node 5 (Knowledge) → **Leaf 4**.
  *   **Greeting Gestures:** Node 1 (No) → Node 2 (Yes) → Node 4 (Yes) → Node 6 (Annoyed/Awkward) → Node 7 (Messy) → **Leaf 8**.

  ---

  ## Workshop Discussion Points

  ### 1. The Empty Cell
  **Configuration:** Arbitrary Regularity (Node 2: YES) + Third-Party Punishment (Node 4: YES) + Angry Sanction (Node 6: ANGRY) + **No Common Knowledge/Awareness** (Node 5: EMERGENT).

  **Diagnosis:** **Unstable / Incoherent.**
  **Why:** Angry third-party punishment implies a shared normative belief ("You *ought* not do that"). If the rule is arbitrary (could have been otherwise), that "ought" cannot come from nature; it must come from agreement. If there is no agreement or common knowledge (Awareness), there is no basis for the anger. A population might briefly exhibit this during a transition, but it will collapse into either a Moral Norm (Node 3) or a Lewisian Convention (Node 5) once knowledge spreads.

  ### 2. The Limitation Flag
  **The Branch:** **Node 5 (The Awareness Test).**
  **The Problem:** Separating **Leaf 4 (Lewisian Convention)** from **Leaf 5 (Evolutionary Stable Strategy)**.
  **Why:** Both leaves describe arbitrary regularities with no third-party punishment. The theoretical difference is internal: one relies on *reasoning about others' reasoning* (Common Knowledge), the other on *reinforcement history* (Trial and Error).
  **The Trap:** In the real world, agents often behave *as if* they have common knowledge even if they evolved the behavior. Asking participants "Do you know they know?" often yields a post-hoc rationalization rather than the actual causal mechanism.
  **Verdict:** The tree sorts the *phenomenology* perfectly, but it cannot definitively settle the *ontology* of the cognitive mechanism without further psychological testing. Treat Leaf 4 and Leaf 5 as functional equivalents unless you have access to the agents' learning history.

  ### 3. Order Matters
  The order of **Node 2 (Swap)** and **Node 4 (Bystander)** is critical.
  *   If you ask about Bystanders *before* Arbitrariness, you might classify **Line Jumping** as a Social Norm (Leaf 8) because strangers get angry.
  *   By asking about Arbitrariness (Node 2) first, you catch Line Jumping as a **Moral Norm (Leaf 2)** because the "Swap" fails (you can't swap "fairness" for "unfairness" without changing the moral value). This preserves the intuition that norms of fairness are different from norms of etiquette.
