  # JOINT STATEMENT ON THE RAVEN PARADOX
  **Adversarial Collaboration Exercise: Department of Philosophy**
  **Signatories:** The Degree Camp (DC) | The Restriction Camp (RC)

  ## 1. Jointly Signed Arithmetic Table

  We agree on the following likelihoods and ratios derived from the Common Formal Playground. $T_1$ represents the truth of the generalization ("No raven in the reserve is non-black"); $T_2$ represents its falsity. $W$ is the observation of a non-black non-raven; $B$ is the observation of a black raven.

  | World | Observation | $P(Obs \mid T_1)$ | $P(Obs \mid T_2)$ | Likelihood Ratio ($T_1/T_2$) |
  | :--- | :--- | :--- | :--- | :--- |
  | **I (Fixed Census)** | **W** (White Shoe) | $0.100000$ | $0.099999$ | $\approx 1.00001$ |
  | **I (Fixed Census)** | **B** (Black Raven) | $0.001000$ | $0.000999$ | $\approx 1.00100$ |
  | **II (Free Colour)** | **W** (White Shoe) | $0.499500$ | $0.499500$ | $1.00000$ |
  | **II (Free Colour)** | **B** (Black Raven) | $0.001000$ | $0.000500$ | $2.00000$ |

  **Difference between worlds:** The difference consists in whether the background corpus fixes the extension of the predicate "non-black" independently of the hypothesis (World I) or leaves it stochastic and independent of ravenhood under both theories (World II).

  **World I Explanation:** $W$'s ratio exceeds 1 because the fixed count of non-black objects forces a trade-off: if $T_1$ is true, all non-blacks must be non-ravens, slightly increasing the chance of drawing one compared to $T_2$, where one non-black is "used up" being a raven.

  **World II Explanation:** $W$'s ratio equals 1 because the colour of non-ravens is probabilistically independent of the truth of $T_1$; the background stipulates that non-ravens are non-black with probability ½ regardless of whether ravens are constrained to be black.

  ***

  ## 2. Agreed Claims

  We endorse the following claims as accurate descriptions of the logic, arithmetic, and dialectical situation.

  1.  **Logical Equivalence:** The statement "All ravens are black" is logically equivalent to "All non-black things are non-ravens" in classical logic, regardless of evidential considerations.
  2.  **Arithmetic Validity:** The calculations in Section 1 are correct given the stipulated priors and sampling procedures in Worlds I and II.
  3.  **World II Neutrality:** In World II, observing a non-black non-raven ($W$) provides no probability-raising support for $T_1$ over $T_2$ (Ratio = 1).
  4.  **World I Confirmation:** In World I, observing a non-black non-raven ($W$) raises the probability of $T_1$ relative to $T_2$ (Ratio > 1).
  5.  **Magnitude Disparity:** In World I, observing a black raven ($B$) raises the probability of $T_1$ by a factor roughly 100 times greater than observing $W$.
  6.  **Background Dependence:** The likelihood ratio for $W$ is not invariant; it changes from $>1$ to $1$ when moving from World I to World II, demonstrating that confirmation values depend on the background corpus. **[DC: Signed without reservation. RC: Signed under protest; we hold that the change occurs because World I smuggles in kind-constraints that World II correctly omits, not merely because "background" changed.]**
  7.  **Nicod's Criterion:** Nicod's Criterion (that an $F$ that is $G$ confirms "All $F$ are $G$") is not universally valid without qualification regarding the background or the nature of the predicates.
  8.  **Equivalence Condition:** The Equivalence Condition (that logically equivalent hypotheses are confirmed by the same evidence) holds for logical consequence but fails as a principle of *incremental* confirmation when "confirmation" is defined as probability-raising in contexts like World II. **[RC: Signed without reservation. DC: Signed under protest; we maintain the condition holds for the *relation*, but the *intuition* that $W$ confirms the contrapositive is what fails in World II.]**
  9.  **Paradox Source:** The paradox arises from conflating the logical equivalence of hypotheses with the evidential equivalence of observations relative to specific background knowledge.
  10. **Concession on Intuition:** DC concedes that the intuition that $W$ is irrelevant is robust in World II and cannot be dismissed merely as a cognitive error regarding small numbers. RC concedes that the probability calculus is internally consistent in World I and does not contain a mathematical contradiction.

  ***

  ## 3. Disagreements Table

  | Topic | Neutral Formulation | Degree Camp Formulation | Restriction Camp Formulation | Condition for Abandonment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Confirmation** | What relation does "e confirms h" denote? | A graded relation defined by probability-raising ($P(h|e) > P(h)$). | A qualitative relation defined by appropriate predication within a kind-structure. | **DC:** If a graded measure fails to guide action better than a binary one. **RC:** If a formal account of "kinds" proves impossible without circularity. |
  | **World I Status** | Does $W$ confirm $H$ in World I? | Yes, strictly speaking, by a negligible amount. | No, the ratio $>1$ is an artifact of the census constraint, not evidential support. | **DC:** If it is shown that the ratio arises from a logical error in the setup. **RC:** If it is shown that the census constraint is a legitimate model of evidential situations. |
  | **Equivalence Condition** | Should the condition be retained? | Yes, provided "confirmation" is consistently defined as likelihood ratio. | No, it must be rejected as a principle of epistemology, not just redefined. | **DC:** If retaining it forces acceptance of $W$ as strong evidence in standard contexts. **RC:** If rejecting it prevents formal modeling of scientific inference. |

  ***

  ## 4. Cruxes

  We identify three sub-questions where settling the matter would shift the dialectical weight. We recorded our predictions prior to performing the computations below.

  ### (a) The World II Ratio
  **Question:** Does the ratio of 1 for $W$ in World II vindicate the Restriction Camp or merely illustrate the Degree Camp's background-relativity?
  *   **DC Prediction:** It illustrates background-relativity; change the background (to World I), and the ratio changes. The metric is stable; the input varies.
  *   **RC Prediction:** It vindicates the Restriction Camp; the ratio is 1 because $W$ is not the *sort* of evidence that bears on $H$, which World II correctly models by decoupling non-raven colour from the hypothesis.
  *   **Shared Bearing:** The arithmetic of World II is the test case.
  *   **Outcome:** Both accept the arithmetic (Ratio = 1). DC maintains this shows background sensitivity. RC maintains this shows that without kind-constraints (World I), there is no confirmation.

  ### (b) Divergent Verdicts
  **Question:** Can a case be constructed where the frameworks yield different *verdicts* (Confirm vs. Disconfirm/Neutral) rather than different numbers?
  *   **DC Prediction:** No; both frameworks ultimately track probability, so verdicts will align even if explanations differ.
  *   **RC Prediction:** Yes; World I is such a case. DC says "Confirm" (Ratio > 1); RC says "No Support" (Ratio is artifact).
  *   **Shared Bearing:** The interpretation of World I's ratio > 1.
  *   **Outcome:** World I serves as the divergence point. DC insists on the literal probability raise. RC insists on the epistemic irrelevance.

  ### (c) The Black Raven that Lowers Probability
  **Question:** Consider the Industrial Melanism case.
  *Setup:* Reserve status is either: $H_1$ (Raven-free, $H$ vacuously true, Prior 0.9); $H_2$ (Melanism, $H$ false, Ravens 10% black, Prior 0.09); $H_3$ (Normal, $H$ true, Ravens 100% black, Prior 0.01).
  *Evidence:* A warden reports a single raven encountered at random, and it is black ($E$).
  *Calculation:*
  1.  $P(E \mid H_1) = 0$ (Cannot encounter a raven if none exist).
  2.  $P(E \mid H_2) = k \times 0.1$ (where $k$ is probability of encounter given existence).
  3.  $P(E \mid H_3) = k \times 1$.
  4.  Posterior $H_1 = 0$.
  5.  Posterior $H_2 \propto 0.09 \times 0.1 = 0.009$.
  6.  Posterior $H_3 \propto 0.01 \times 1 = 0.01$.
  7.  Total Posterior Prob($H$) = $P(H_3 \mid E) = 0.01 / (0.009 + 0.01) \approx 0.526$.
  8.  Prior Prob($H$) = $0.9 + 0.01 = 0.91$.
  *Result:* Observing a black raven lowers the probability of the generalization from 0.91 to 0.526.

  *   **DC Prediction:** The probability *will* lower. This confirms that confirmation is probability-raising; since probability lowered, this is a case of disconfirmation.
  *   **RC Prediction:** The probability *should not* lower regarding the *lawlike* status of the hypothesis. The setup illegitimately weights a vacuous truth ($H_1$) as a rival to a substantive law ($H_3$).
  *   **Concession:** **DC** accepts the arithmetic and the verdict: $E$ disconfirms $H$ in this specific setup. **RC** accepts the arithmetic but protests the setup: $H_1$ is not a genuine competitor for a law of nature, so the probability drop is a symptom of mis-specified hypotheses, not evidence against the law.

  ***

  ## 5. Closing Section: Verbal vs. Real Disagreements

  We conclude that a significant portion of our dispute is verbal, hinging on the definition of "confirms," but a core substantive disagreement remains regarding the formalization of epistemic relevance.

  **Two Senses of "Confirms":**
  1.  **Sense D (Degree):** $e$ confirms $h$ iff $P(h|e) > P(h)$. This is a descriptive, mathematical relation sensitive to all background priors.
  2.  **Sense R (Restriction):** $e$ confirms $h$ iff $e$ is an instance of a natural kind predicate that supports a projectible generalization. This is a normative, structural relation insensitive to "gerrymandered" background constraints.

  **Evaporated Disagreements:**
  *   Whether $W$ raises probability in World I: In Sense D, yes. In Sense R, no. Once distinguished, we need not argue over the arithmetic.
  *   Whether the Equivalence Condition holds: It holds for Sense D (mostly), fails for Sense R. We agree it cannot hold for both senses simultaneously.

  **Surviving Disagreements:**
  *   **The Normative Claim:** Which sense ought to govern scientific inference? DC argues Sense D is sufficient because priors eventually wash out. RC argues Sense D is dangerous because it allows "confirmation" via vacuous truths or census artifacts (as in Crux c and World I).
  *   **The Formalization of Kinds:** RC claims Sense R can be formalized without collapsing into Sense D. DC claims any formalization of "natural kind" will ultimately reduce to prior probabilities (Sense D).

  **Test of Substantive Difference:**
  Consider the sentence: *"In World I, the white shoe is evidence for the hypothesis."*
  *   **DC Evaluation:** True.
  *   **RC Evaluation:** False.
  *   **Reason:** This is not merely notational. If a scientist acted on the DC evaluation, they might allocate resources to counting shoes in a fixed census. If they acted on the RC evaluation, they would not. The disagreement predicts different behaviors in experimental design, specifically regarding whether extensional constraints (census counts) are treated as evidential bases or as fixed parameters. We have not resolved which behavior is epistemically virtuous.
