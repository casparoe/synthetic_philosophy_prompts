answer: |-
  The stalemate persists because the debate conflates three distinct normative categories—criteria of rightness, decision procedures, and agent architecture—and the cases are specifically engineered to force a contradiction between them.

  Your hunch is largely correct but misses the structural normative conflict beneath the verbal ambiguity. The four camps aren't just talking past each other; they are optimizing for different constraints that cannot be simultaneously satisfied without changing the definition of agency. Camps 1 and 2 are fighting over the metaphysics of agency (can a mind bind its future self?), while Camps 3 and 4 have already conceded that the standard model of agency fails and are building workarounds (esotericism or code). The core impasse is not psychological but logical: you cannot maximize global outcomes (Camp 1/4) while maintaining strict sequential consistency at every moment of choice (Camp 2/CDT) unless you have access to precommitment technology. The debate stalls because philosophers argue over whether rationality *should* require sequential consistency or global optimality, while neither side can prove their preference without begging the question.

  Regarding your specific questions:

  **1. Is this a verbal dispute or a structural clash?**
  It is both. The verbal ambiguity ("rational to do" vs. "rational to be") masks a structural incompatibility between *dynamic consistency* (never choosing a dominated strategy at time T) and *global optimality* (achieving the best outcome over T1-Tn). Camp 2 insists rationality is about dynamic consistency; Camp 1 insists it is about global optimality. They fail to engage because neither accepts the other's constraint as definitive of rationality. Camp 3 and 4 bypass this by separating the theory of evaluation from the theory of action, effectively admitting that standard rationality cannot guide action in these cases.

  **2. Does the case refute Self-Interest Theory (SIT)?**
  It does not refute SIT as a *criterion of rightness*, but it refutes SIT as a *decision procedure*. This is the distinction between direct and indirect self-defeat. SIT remains true in the sense that it correctly identifies which outcomes are best for the agent, but it is indirectly self-defeating because an agent who directly follows SIT at every step achieves worse self-interest outcomes. Camp 1 and 2 often miss this distinction: Camp 1 thinks this refutes SIT (because it fails to guide), while Camp 2 thinks it saves SIT (because you shouldn't do the irrational act). The stake changes from "what is the true theory of value?" to "can a theory of value be action-guiding?" If you accept that a theory can be true but esoteric (Camp 3), SIT survives. If you demand action-guidance, SIT fails.

  **3. What counts as progress?**
  Progress requires formally separating *decision procedures* from *criteria of rightness* and empirically testing the limits of precommitment. A formal result showing that no decision procedure can satisfy both dynamic consistency and global optimality without external binding mechanisms would settle the logical impossibility. Empirically, we need studies on whether humans can genuinely form intentions they expect to violate (Camp 2's claim). If psychology proves we cannot intend the toxin, Camp 1's normative claim becomes moot for humans. However, the most productive path is treating this as an engineering problem: what architecture allows an agent to win?

  **4. Does the diagnosis survive swapping the case?**
  Swapping to AI clarifies the diagnosis significantly. In AI, Camp 2's psychological objection vanishes; code can precommit. If an AI can rewrite its source code before entering the desert, Camp 1 wins decisively: the rational agent modifies itself to be the type that pays. This reveals that the human stalemate is partly biological: humans lack reliable precommitment technology, so Camp 2's psychological constraint feels like a normative truth. Swapping to Consequentialism changes little structurally; it remains a clash between act-evaluation and rule/disposition-evaluation. The AI case proves the problem is about *binding capacity*, not moral theory.

  **Confidence and Shift Conditions:**
  I am 85% confident in this diagnosis. The remaining 15% accounts for the possibility that there is a coherent theory of *resolute choice* that solves the dynamic inconsistency without precommitment technology, though none has gained traction. I would shift if a decision theory emerged that satisfied dynamic consistency and global optimality simultaneously without relying on logical correlation (EDT/UDT) or physical precommitment, proving the conflict was illusory. Until then, the debate is stalled because it asks a single concept ("rationality") to solve a constraint satisfaction problem that requires two distinct concepts.
