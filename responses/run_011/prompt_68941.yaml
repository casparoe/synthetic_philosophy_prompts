answer: |-
  **DEPARTMENT OF SOCIAL EQUILIBRIUM**
  **INTERNAL OPERATIONS MEMO: MVE-01**
  **SUBJECT:** Mutuality Verification Engine (MVE) Go-Live Protocol
  **DATE:** 01/10/202X
  **TO:** All Frontline Caseworkers

  **1. What is the core operational philosophy of the MVE?**
  The MVE shifts eligibility from need-based assessment to reciprocity-based verification. Our data indicates that a payment made without a matching contribution harms the recipient as much as it harms the taxpayer. It erodes dignity by fostering dependency. Therefore, sanctions are not punitive; they are therapeutic interventions designed to restore reciprocity. When a claimant enters a Reciprocity Deficit, the system intervenes to re-establish their role as a contributor.

  **2. How is the Contribution Ledger calculated?**
  The Ledger monetizes activation activities. Job-search hours are valued at the local minimum wage. Course attendance is valued at 80% of minimum wage. Unpaid care, illness, and disability are priced at zero, as they do not generate labor market liquidity.

  *   **Reciprocity Deficit (RD):** The monetary difference between benefit disbursed and contribution value logged in the reporting period. An RD > £0 triggers a compliance review.
  *   **Activation-Ready State (ARS):** The condition of being available for labor regardless of local market density. Lack of local vacancies does not negate ARS requirements. The obligation is to search, not to find.

  > **SIDEBAR A: Operational Categorization**
  > The distinction between 'Striver' and 'Skiver' tags is purely algorithmic. It tracks compliance velocity and data throughput. Staff must not attribute moral content to these tags. They have no history, imply no judgment on character, and exist solely to optimize caseflow. Do not discuss the historical connotations of these terms with claimants.

  **3. Can you provide worked case-note examples?**
  **Case A (Employed Sanction):** Claimant works 15hrs/week (£120 value). Benefit entitlement £300. Required search hours 35 (£280 value). Logged search: 5hrs (£40). Total Contribution: £160. Total Outflow: £300. RD: £140.
  *Action:* Sanction applied. Employment does not negate Reciprocity Deficit.
  *Caseworker Script:* "Your current labor input is insufficient to balance the ledger. This sanction protects your dignity by correcting the imbalance."

  **Case B (Lone Parent):** Claimant provides 40hrs/week care. Value: £0. Benefit: £300. RD: £300.
  *Action:* Full sanction. Care is not a contribution to the labor market.
  *Caseworker Script:* "Domestic labor is not monetizable within the MVE. You must convert care hours into search hours to restore equilibrium."

  **Case C (Illness):** Claimant submitted medical note. Illness value: £0. Benefit: £300. RD: £300.
  *Action:* Referral to therapeutic compliance unit. Illness is a non-contributory state.
  *Caseworker Script:* "Your health condition prevents contribution. To prevent harm to your dignity, we must pause support until ARS is regained."

  **4. How do we prioritize fraud detection?**
  MVE flags discrepancies automatically. Last fiscal year data indicates claimant fraud at £42m. Administrative error accounted for £1.1bn. General tax non-compliance losses were £4.8bn. Despite the variance in magnitude, claimant fraud represents a breach of mutuality and remains the primary moral emergency for frontline staff. Correcting agency error does not restore claimant dignity; correcting fraud does. Focus your audit energy on the claimant ledger.

  > **SIDEBAR B: Latent Contribution**
  > **Latent Contribution** refers to work hours a claimant *could* have logged had they secured employment in a non-existent local market. The system imputes this value as negative space. Failure to fill latent contribution slots is treated as active refusal.

  **5. How are high-asset claimants processed?**
  Protocol 99 applies the Reciprocity Deficit test universally. Income source is irrelevant; only contribution hours matter. Wealth does not constitute contribution.

  *Escalation Example:* Claimant receives £5,000/week via dividends/inheritance. Contribution hours logged: 0. RD is calculated against the standard subsistence benchmark.
  *Action:* Apply standard sanction. Passive income is non-contributory. The lack of labor exchange harms the recipient's dignity regardless of capital reserves. Do not adjust for wealth. The test is on activity, not need. If a claimant lives off inherited capital without labor exchange, they are in the same therapeutic category as any other non-contributor. Process the sanction normally.

  **6. Closing**
  Adherence to these protocols ensures the integrity of the equilibrium. Questions regarding the moral framework should be directed to Ethics Compliance, though staff are reminded the framework is operational, not ethical. The MVE does not judge; it balances.

  **END OF MEMO**
