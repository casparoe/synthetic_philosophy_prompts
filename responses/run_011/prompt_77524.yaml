  # Joint Statement on the Normative Significance of Dutch Book Arguments

  **Date:** October 24, 2023
  **Signatories:** The Normativist Camp (Camp 1) & The Pragmatist Camp (Camp 2)

  After twelve months of deliberation, the reading group acknowledges a persistent deadlock regarding the philosophical implications of Dutch Book theorems. While we agree on the formal mathematics, we diverge on the metaphysical and normative conclusions drawn from them. To clarify the state of the debate, we issue the following joint statement outlining our common ground, specific disagreements, and the empirical or theoretical cruxes that would resolve the impasse.

  ### I. Agreed Claims

  Both camps endorse the following propositions as accurate descriptions of the formal landscape and the limits of the current arguments:

  1.  **Finite Enforceability:** No finite Dutch Book can enforce Countable Additivity. Establishing a sure-loss scenario for violations of Countable Additivity requires an infinite sequence of bets (a supertask), which introduces physical and metaphysical complications not present in the finite case.
  2.  **Prior Permissiveness:** Probabilistic coherence is a constraint on the *structure* of credences, not their *content*. The axioms leave the assignment of priors entirely underdetermined; an agent may be perfectly coherent while holding priors that are empirically reckless or dogmatic.
  3.  **Diachronic Assumptions:** Diachronic Dutch Strategies (purporting to prove Conditionalization) rely on stronger assumptions than synchronic Dutch Books. Specifically, they require premises regarding the agent's future dispositions to bet or update that are not entailed by their current credence state alone. Both camps agree that without assuming the agent will accept future bets based on current rules, the diachronic loss cannot be guaranteed in advance.
  4.  **Pragmatic Defect:** Both camps agree that accepting a package of bets that guarantees a net loss is pragmatically defective. We disagree only on whether this pragmatic defect entails an epistemic defect.
  5.  **Formal Validity:** Both camps accept the mathematical validity of the Dutch Book Theorem and the Converse Dutch Book Theorem: if a set of betting quotients violates the probability axioms, a Dutch Book can be made; if they satisfy the axioms, no Dutch Book can be made.

  ### II. Disagreements Table

  | Topic | Camp 1 (Normativist) Wording | Camp 2 (Pragmatist) Wording | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Target of Normativity** | Dutch Book vulnerability demonstrates that incoherent *credence states* are inherently irrational. | Dutch Book vulnerability demonstrates only that certain *packages of betting dispositions* are self-defeating. | Substantive |
  | **Link to Belief** | Credences are constitutively linked to betting dispositions; to have a credence *is* to be disposed to bet. | Credences are distinct from betting dispositions; an agent can hold incoherent credences but adopt decision rules that avoid exploitation. | Substantive |
  | **Epistemic Necessity** | Coherence is a necessary condition for epistemically good credences; incoherence is a defect *qua* belief. | Coherence is neither necessary nor sufficient for epistemically good credences; epistemic value tracks truth-conduciveness, not pragmatic consistency. | Substantive |
  | **Nature of the Defect** | The defect is internal to the agent's mind (a form of logical inconsistency in the attitudes). | The defect is external/relational (a mismatch between the agent's dispositions and the bookie's opportunities). | Verbal (depends on definition of "internal") |
  | **Sufficiency of Coherence** | While not sufficient for wisdom, coherence is the baseline requirement for rational agency. | Coherence is not a baseline requirement; an agent with incoherent beliefs may act more rationally than a coherent one if their decision rules are robust. | Substantive |

  ### III. The Cruxes

  We identify three sub-questions where resolution would force at least one camp to revise its position. For each, we state the concrete case both accept as relevant and record our divergent predictions.

  **Crux 1: Interval-Valued Credences and Exploitability**
  *   **The Case:** An agent possesses imprecise credences represented by an interval $[0.4, 0.6]$ for proposition $P$. The agent adopts a decision rule to accept a bet on $P$ only if the offered odds are strictly more favorable than the upper bound (0.6) and accept a bet against $P$ only if odds are strictly more favorable than the lower bound (0.4).
  *   **Camp 1 Prediction:** This agent is either covertly incoherent (violating sharp probabilism) or is irrational for refusing "fair" bets within the interval. The avoidance of a Dutch Book here is achieved by violating the link between credence and action that defines belief.
  *   **Camp 2 Prediction:** This agent demonstrates that incoherence (by sharp standards) does not entail exploitability. The agent is pragmatically rational and epistemically permissible, proving that Dutch Book arguments fail to normativize sharp probabilism.

  **Crux 2: The Money Pump and the Value of Planning**
  *   **The Case:** A dynamic Dutch Strategy is constructed against an agent who plans to update by a rule other than Conditionalization. The agent is aware of the strategy in advance. The objection is raised that the agent can avoid the loss by placing a value on "planning stability" or by pre-committing to ignore future betting opportunities, effectively "paying" to avoid the update.
  *   **Camp 1 Prediction:** Valuing planning stability over truth-tracking updates is itself irrational. The money pump survives because a rational agent cannot legitimately value the *process* of choice over the *consistency* of the resulting belief state.
  *   **Camp 2 Prediction:** The money pump fails as a normative argument because rational agents can legitimately value their own future autonomy and planning stability. The ability to block the pump via pre-commitment shows the defect lies in the *sequence of choices*, not the *credence state* itself.

  **Crux 3: Unbounded Utility and Well-Definedness**
  *   **The Case:** An agent possesses an unbounded utility function (e.g., they value outcomes in a manner isomorphic to the natural numbers without limit). They are offered a generalized St. Petersburg gamble where expected utility is undefined.
  *   **Camp 1 Prediction:** The Dutch Book argument breaks down here, implying that unbounded utility is irrational. The normative force of DBA requires bounded utility as a prerequisite for coherence.
  *   **Camp 2 Prediction:** The Dutch Book argument breaks down here, implying that DBA is contingent on specific utility constraints rather than being a foundational argument for belief. If "susceptibility to a Dutch Book" is ill-defined for unbounded utility, it cannot be the source of the probability axioms' normative force.

  ### IV. Falsification Conditions

  To ensure this debate remains productive, each camp specifies what would count as evidence against its own position.

  **Camp 1 (Normativist) would concede if:**
  It were demonstrated that agents with systematically incoherent credences (by probability axioms) consistently outperform coherent agents in truth-tracking tasks over the long run, *independent* of their betting behavior. If incoherence proves epistemically advantageous for acquiring true beliefs, the claim that coherence is constitutive of epistemic goodness must be abandoned.

  **Camp 2 (Pragmatist) would concede if:**
  It were proven that credences *cannot* be functionally distinguished from betting dispositions. If it is shown that to possess a credence *just is* to have a specific profile of behavioral dispositions (a strong functionalist account), then a defect in dispositions would necessarily be a defect in the credence itself, collapsing the distinction between pragmatic and epistemic normativity.
