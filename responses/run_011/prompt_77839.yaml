      *   Colleague attack: "You refused Ilmara because culture isn't enough. Now you say social structure is enough? That's cultural genocide by another name."
      *   Defense: "Ilmara preserved the people. This dissolves the people."

  7.  **Drafting the Response (incorporating constraints):**
