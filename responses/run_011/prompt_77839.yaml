      *   **New Case (Chapter 19):** Mountain people dispersed into individual flats across country. Decent housing, no violence, no sterilisation. Children speak language at home. Villages, marriage networks, institutions gone. Demographers project group unidentifiable within two generations.
      *   **Questions to Answer:**
          1.  What does she rule? (Options based on previous verdicts).
          2.  What does each verdict say about Chapter 19?
          3.  Best guess at her ruling and why.
          4.  Which further case would force the difference into the open?
          5.  If she designates it, what principle is she committing to? (Is she inconsistent or revealing a hidden principle? Can a colleague attack her based on the Convention/Lemkin?)

  2.  **Deconstruct the Precedents:**
      *   *Vessan:* Classic physical genocide. Intent + Group + Mass Death.
      *   *The Kesh:* Cultural genocide via forced transfer of children + language ban at home. This is the strongest precedent for the new case. It shows she accepts non-lethal destruction of a group if the mechanism targets the *continuity* of the group (children/language).
      *   *Ilmara:* Cultural destruction (buildings/public language) refused. Distinction drawn between destroying symbols vs. destroying the *people's continuity*. The Kesh involved children; Ilmara did not.
      *   *The Purge Years:* Political groups excluded. Consistent with UN Convention (national, ethnical, racial, religious).
      *   *Tanek:* Indirect killing (famine) counts if ethnic group + foresight. Shows she cares about outcome + intent regarding specific groups.
      *   *Militia Plan:* Attempted genocide refused because the result wasn't there. Shows she requires *effective* destruction, not just intent.

  3.  **Analyze Chapter 19 against Precedents:**
      *   *Group:* Mountain people (Ethnic/National). Fits *Vessan, Tanek*.
      *   *Violence/Death:* None. Fits *Kesh, Ilmara*.
      *   *Mechanism:* Dispersal (diaspora within state), breaking social structures (villages, marriage).
      *   *Culture:* Language survives at home (unlike *Kesh*), but institutions die.
      *   *Outcome:* Group unidentifiable in two generations (effective destruction of the group *as a group*).
      *   *Intent:* State disperses them (implied policy).
      *   *Comparison to Kesh:* *Kesh* was designated. *Kesh* took children and banned language at home. Chapter 19 leaves children and language at home but breaks the social fabric. Is breaking the social fabric enough? *Ilmara* said burning shrines isn't enough. But *Ilmara* didn't project the extinction of the group identity. Chapter 19 projects extinction of identity.
      *   *Comparison to Militia Plan:* *Militia Plan* was refused because the result (800 dead) didn't match the intent (900k). Chapter 19 has the result (group dissolution) matching the intent (dispersal).

  4.  **Determine the Ruling Options:**
      *   *Option A: Designate.* Relies on *The Kesh*. The essence is the destruction of the group's viability, not just bodies. The "social death" leads to biological/cultural assimilation.
      *   *Option B: Refuse.* Relies on *Ilmara* and *Militia Plan*. No physical destruction, language survives at home. It's assimilation, not genocide. The "two generations" projection is speculative compared to dead bodies (*Vessan, Tanek*) or seized children (*Kesh*).

  5.  **Develop the Argument for Consistency:**
      *   If she designates Chapter 19, she is prioritizing the *outcome* (group extinction) over the *method* (killing vs. assimilation).
