  6.  **Address the "Hidden Principle" Question:**
      *   If she designates, is she inconsistent with *Ilmara*? *Ilmara* was about buildings and public speech. Chapter 19 is about social fabric and demographic viability.
      *   Lemkin originally included cultural genocide. The Convention dropped it. If she designates, she is effectively reinstating Lemkin's cultural genocide but framing it as "sociological destruction."
      *   Colleague's attack: "You refused Ilmara (burning shrines) but accept this (dispersal)." Counter: "Shrines are things; marriage networks are people. *The Kesh* proved children matter. This is the same as *The Kesh* without the boarding schools."
      *   Is there a reading where she's consistent? Yes, if the principle is "Destruction of the group's capacity to reproduce itself as a distinct entity." *Ilmara* didn't stop reproduction/identity transmission (language at home allowed). *Kesh* stopped it (children taken, language banned at home). Chapter 19 stops it (no marriage networks, isolation).
