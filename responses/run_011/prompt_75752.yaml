prompt: |-
  I've spent years reading arguments about tail risk and expected value, and I want to test whether a real regulatory regime is doing the reasoning those arguments assume it is.

  Type certification for large transport aircraft sorts every credible systems failure into severity classes and pins a maximum average probability per flight hour to each. A condition classified as catastrophic — one that would prevent continued safe flight and landing, typically involving multiple fatalities — must be shown to be extremely improbable, which the regulators cash out as below one in a billion per flight hour, and there is a separate structural rule that no single failure may be permitted to produce such a condition. The targets are not fungible: an applicant cannot offset a somewhat-too-likely catastrophic condition by making a dozen minor ones safer, nor by demonstrating that the design's expected fatalities are competitive with the fleet's.

  What theory of rational choice under risk does this presuppose? The obvious candidate is risk-weighted expected utility — the family of views on which a risk function transforms cumulative probabilities, so that a rational agent may be responsive to the shape of a distribution and not only its mean, with Allais-type preferences as the standard motivation. Reconstruct that reading as precisely as you can, then put pressure on it: does the one-in-a-billion target look like anybody's risk attitude, or is it doing different work altogether — a bright line against regulatory gaming, a claim about what can be known at design time rather than a preference over known gambles, a lexicographic safety constraint, or a rule about who bears the risk and whether they could have consented to it? Say which of these the practice strictly requires and which it merely sits well with, flag anything in the scheme that embarrasses the reading you favour, and say what would have to change if the whole regime were rebuilt around maximising expected fatalities avoided.

  Argue from the concepts; no citations, reading lists, or named authorities beyond what I have supplied. British English throughout. End with a single line beginning "Verdict:" naming the account you think best explains the practice, or stating that the practice is underdetermined between them.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Aircraft type certification regulatory regime (specifically regarding tail risk and expected value).
      *   **Core Question:** What theory of rational choice under risk does this regime presuppose?
      *   **Specific Candidate:** Risk-Weighted Expected Utility (RWEU) / Allais-type preferences (responsive to distribution shape, not just mean).
      *   **Tasks:**
          1.  Reconstruct the RWEU reading precisely.
          2.  Put pressure on it (does the 1-in-a-billion target look like a risk attitude or something else?).
          3.  Evaluate alternative explanations (bright line against gaming, epistemic claim, lexicographic constraint, consent/bearing risk).
          4.  Distinguish between what the practice *strictly requires* vs. what it *sits well with*.
          5.  Identify embarrassments for the favoured reading.
          6.  Describe what would change if the regime were rebuilt around maximizing expected fatalities avoided (pure Expected Value/Utilitarianism).
          7.  **Constraints:** Argue from concepts, no citations/reading lists/named authorities (beyond supplied text), British English.
          8.  **Ending:** Single line beginning "Verdict:" naming the best account or stating underdetermination.

  2.  **Deconstruct the Regulatory Regime (as described):**
      *   **Classification:** Systems failures sorted into severity classes.
      *   **Probability Targets:** Maximum average probability per flight hour pinned to each class.
      *   **Catastrophic Condition:** Prevents safe flight/landing, multiple fatalities.
      *   **Target:** Extremely improbable (< 1 in 10^9 per flight hour).
      *   **Structural Rule:** No single failure may produce a catastrophic condition (fail-safe design).
      *   **Non-Fungibility:** Cannot offset catastrophic risk with minor risk reductions. Cannot use overall expected fatalities to justify higher catastrophic risk.

  3.  **Task 1: Reconstruct the Risk-Weighted Expected Utility (RWEU) Reading:**
      *   *Concept:* Standard Expected Utility (EU) sums $p_i \times u_i$. RWEU applies a weighting function $r(p)$ to cumulative probabilities, allowing aversion to risk *itself* beyond aversion to bad outcomes.
      *   *Application:* The regulator acts as the agent. The "gamble" is the operation of the aircraft.
      *   *Shape:* The 10^-9 target implies an extreme weighting against the tail. The utility function might capture the disvalue of fatalities, but the *probability weighting* captures the special moral or rational status of low-probability, high-consequence events.
      *   *Non-fungibility:* In EU, $p_1 \times u_1 + p_2 \times u_2$ is fungible. In RWEU, because the weighting function is non-linear (typically convex for losses/risk-averse), moving probability mass from the tail to the head changes the weighted value disproportionately. Thus, you cannot trade off tail risk against head risk easily.
      *   *Reconstruction:* The regime treats the catastrophic tail not just as "many deaths" but as a distinct structural feature of the risk distribution that warrants disproportionate weight. The 10^-9 threshold represents a point where the risk-weighted cost becomes unacceptable regardless of the benefits or reductions elsewhere.

  4.  **Task 2: Put Pressure on the RWEU Reading:**
      *   *Is 10^-9 a risk attitude?* Risk attitudes are usually continuous functions. A hard cutoff (10^-9) looks more like a rule than a smooth weighting function.
      *   *Epistemic Uncertainty:* At design time, do we *know* the probabilities? 10^-9 is often derived from component reliability data which is uncertain. The target might be a proxy for "we cannot reliably calculate below this, so ensure redundancy."
      *   *Lexicographic:* The rule "no single failure" suggests a lexical priority. Safety constraints often operate as constraints *before* optimization, not as part of the utility function.
      *   *Consent/Justice:* Passengers cannot consent to specific risks. The regime might be about distributing risk fairly (no single point of failure) rather than minimizing aggregate harm.
      *   *Gaming:* If fungibility were allowed, manufacturers might accept higher catastrophic risk to save costs on minor issues. The hard line prevents this optimization gaming.

  5.  **Task 3: Evaluate Alternatives:**
      *   *Bright Line/Gaming:* Plausible. Prevents cost-benefit analysis from undermining safety margins.
      *   *Epistemic Claim:* "We can't know better than this." But the rule is normative ("must be shown"), not just epistemic.
      *   *Lexicographic Constraint:* "Safety first." Catastrophic risk is prohibited unless below a threshold, regardless of benefit. This fits the non-fungibility well.
      *   *Consent/Bearing Risk:* Passengers bear the risk without choice. The regime ensures the risk is below a threshold of "assumed consent" for daily life activities.

  6.  **Task 4: Strictly Requires vs. Sits Well With:**
      *   *RWEU:* Sits well with non-fungibility (due to non-linear weighting). Does it *strictly require* a hard cutoff? No, RWEU is usually continuous.
      *   *Lexicographic:* Strictly requires the hard cutoff and non-fungibility. If catastrophic risk > threshold, reject. No trade-offs.
      *   *Expected Value (EV):* The regime explicitly *rejects* this (no offsetting based on expected fatalities).

  7.  **Task 5: Embarrassments for the Favoured Reading:**
      *   If I favour Lexicographic/Constraint: Why 10^-9 specifically? Why not 10^-8 or 10^-10? A pure constraint might just say "as low as reasonably practicable" (ALARP) without a number. The number suggests a quantified risk attitude (RWEU) or an epistemic limit.
      *   If I favour RWEU: Why the "no single failure" rule? That's structural, not probabilistic. It mandates redundancy regardless of the calculated probability of that single failure. RWEU focuses on the probability of the outcome, not the causal structure per se (unless the structure guarantees the probability).

  8.  **Task 6: Rebuilding around Expected Fatalities Avoided (Pure EV):**
      *   Fungibility would be introduced.
      *   Catastrophic events could be traded against frequent minor events.
      *   "No single failure" rule might be dropped if a single failure was sufficiently improbable (e.g., 10^-12) to meet the aggregate target.
      *   Focus shifts from worst-case scenarios to aggregate harm.
      *   Public perception might revolt (valuing lives differently based on context).

  9.  **Synthesizing the Argument:**
      *   *Introduction:* Define the regime's features (categorisation, probability targets, non-fungibility, structural rules).
      *   *RWEU Reconstruction:* Explain how RWEU handles the shape of the distribution. The 10^-9 target acts as a point where the risk-weighted cost spikes. Non-fungibility arises from the non-linear weighting function.
      *   *Pressure:* The hard cutoff is uncharacteristic of smooth risk functions. The structural rule ("no single failure") is causal, not probabilistic.
      *   *Alternative:* Lexicographic Constraint. Safety is a side-constraint, not a good to be maximised. The 10^-9 is a tolerance threshold for "acceptable risk" in a democratic society, not a marginal rate of substitution.
      *   *Consent/Justice:* The regime protects involuntary risk-bearers.
      *   *Comparison:* EV maximisation would allow trade-offs the regime forbids.
      *   *Conclusion:* The practice is best explained as a lexicographic constraint with an epistemic floor, rather than a continuous risk attitude.

  10. **Refining the "Verdict":**
      *   Is it underdetermined? The prompt asks to name the account I think *best* explains it.
      *   The non-fungibility and the hard cutoff strongly point away from standard EU and even smooth RWEU. They point towards a deontological constraint or a lexical priority rule. However, the quantification (10^-9) suggests an attempt to operationalise "acceptable risk" which leans towards a threshold deontology or a specific social contract view.
      *   Let's weigh RWEU vs. Lexicographic Constraint.
      *   RWEU explains *why* we care about the tail more than the mean.
      *   Lexicographic explains *why* there is a hard stop and no trade-offs.
      *   The prompt asks what theory of *rational choice* it presupposes. Lexicographic preferences are a theory of choice.
      *   The "no single failure" rule is key. It's not about probability; it's about architecture. This embarrasses pure probabilistic views (RWEU/EU).
      *   The 10^-9 number looks like an epistemic limit masquerading as a target (we can't verify lower, so we require redundancy to achieve it).
      *   Best fit: A lexicographic safety constraint grounded in involuntary risk-bearing, using the probability target as an operational proxy for "negligible".

  11. **Drafting the Content (incorporating British English):**
      *   Check spelling: *categorisation, maximising, colour, defence, programme* (if used), *analyse*.
      *   Tone: Analytical, philosophical, rigorous.
      *   No citations.

  12. **Step-by-Step Plan:**
      *   **Paragraph 1:** Introduction to the regime's features (severity classes, probability targets, non-fungibility, structural rules).
      *   **Paragraph 2:** Reconstructing the RWEU reading. How non-linear weighting explains the focus on the tail and non-fungibility.
      *   **Paragraph 3:** Pressuring the RWEU reading. The hard cutoff vs. smooth function. The structural rule ("no single failure") vs. probabilistic outcome.
      *   **Paragraph 4:** Alternative explanations. Lexicographic constraints (safety as a side-constraint). Epistemic limits (what can be known/verified). Consent/Justice (involuntary risk).
      *   **Paragraph 5:** Distinguishing "requires" vs. "sits well with". RWEU sits well with non-fungibility but doesn't require hard cutoffs. Lexicographic requires the hard cutoff.
      *   **Paragraph 6:** Embarrassments. The specific number (10^-9) is arbitrary for a lexical rule. The structural rule embarrasses probabilistic views.
      *   **Paragraph 7:** The EV counterfactual. What changes if we maximise expected fatalities avoided? Fungibility returns, structural rules weaken, public trust likely collapses.
      *   **Paragraph 8:** Conclusion/Verdict.

  13. **Refining the Argument on "Rational Choice":**
      *   RWEU is a theory of rational choice.
      *   Lexicographic preferences are also a theory of choice (Priority View).
      *   The prompt asks what theory the regime *presupposes*.
      *   If the regime forbids trade-offs entirely below the threshold, it presupposes lexicographic ordering.
      *   If the regime allows trade-offs *above* the threshold (e.g. between hazardous and major), it looks more like RWEU within bands, but lexical between bands.
      *   The prompt highlights the catastrophic band specifically.
      *   I will argue that while RWEU captures the *motivation* for caring about the tail, the *structure* of the regulation is lexicographic.

  14. **Final Check on Constraints:**
      *   British English.
      *   No citations.
      *   Single line verdict at the end.

  15. **Self-Correction during drafting:**
      *   Make sure not to drift into general safety engineering jargon without linking it back to choice theory.
      *   Ensure the distinction between "risk attitude" (RWEU) and "constraint" (Lexicographic) is clear.
      *   The "no single failure" rule is a strong point against pure probabilistic accounts. It mandates redundancy regardless of the reliability of the single component. If a component was 10^-15 reliable, could you violate the rule? The rule says "no single failure may be permitted". This is structural, not probabilistic. This is a major embarrassment for RWEU which focuses on outcome probabilities.
      *   Wait, the rule is "no single failure may be permitted to produce such a condition". This implies that even if the single failure is improbable, the *consequence* of that failure being catastrophic is forbidden. This is a constraint on the *mapping* from failure to outcome, not just the probability of the outcome. This supports the Lexicographic/Constraint view over RWEU.

  16. **Finalising the Verdict:**
      *   "Verdict: The practice is best explained as a lexicographic safety constraint operationalised through epistemic proxies, rather than a continuous risk-weighted utility function."
      *   Or simpler: "Verdict: The practice presupposes a lexicographic safety constraint rather than a continuous risk-weighted utility function."
      *   Let's go with the latter for punchiness, ensuring it captures the core distinction.

      *Wait, one more check:* The prompt asks to say which the practice *strictly requires* and which it *merely sits well with*.
      *   RWEU: Sits well with non-fungibility. Does not require hard cutoffs.
