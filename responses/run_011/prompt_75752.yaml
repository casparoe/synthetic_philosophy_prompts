answer: |-
  The regulatory regime you describe operates by categorising risks into severity classes and assigning rigid probability targets to each, most notably the requirement that catastrophic conditions be extremely improbable (below 10^-9 per flight hour) and that no single failure cause them. To reconstruct this as an instance of Risk-Weighted Expected Utility (RWEU), one must view the regulator as an agent maximising a weighted sum of outcomes rather than a simple expected value. In standard Expected Utility theory, rational choice is determined by the sum of probabilities multiplied by utilities; risks are fungible, meaning a reduction in high-probability minor risks could mathematically offset an increase in low-probability catastrophic risks if the aggregate expected disvalue remained constant. RWEU modifies this by applying a weighting function to cumulative probabilities, allowing the decision-maker to be sensitive to the distribution's shape. On this reading, the 10^-9 target represents a point on the weighting curve where the marginal disvalue of additional risk spikes disproportionately. The non-fungibility rule—prohibiting trade-offs between severity classes—mirrors the non-linearity of the risk function: the weight assigned to the catastrophic tail is so severe that no amount of improvement in the 'head' of the distribution can compensate for a deficit in the tail. Thus, the regime appears to encode a specific risk attitude where the variance and skew of the fatality distribution matter independently of the mean.

  However, this reconstruction faces significant pressure when examined against the specific mechanics of the certification rules. A genuine risk-weighted utility function is typically continuous; it explains why we prefer safer tails, but it does not naturally justify a hard cliff-edge at 10^-9. In RWEU, a risk of 1.1 × 10^-9 should be merely slightly worse than 0.9 × 10^-9, permissible if the benefits are sufficiently high. The regulatory regime, by contrast, treats the threshold as a binary pass/fail constraint. Furthermore, the structural rule that 'no single failure may be permitted to produce such a condition' embarrasses the probabilistic reading. RWEU is concerned with the probability of the outcome; if a single component were reliable enough to keep the total probability below 10^-9, a pure probabilistic account should permit it. The regulation forbids this architecture regardless of the component's reliability, mandating redundancy as a structural necessity rather than a probabilistic calculation. This suggests the rule is not merely weighting probabilities but constraining the causal pathways to failure themselves.

  Consequently, alternative explanations sit better with the practice than the RWEU reading. The regime looks less like a maximisation procedure and more like a lexicographic safety constraint. On this view, safety is not a good to be traded off against efficiency or other risks, but a side-constraint that must be satisfied before any other optimization occurs. The 10^-9 target functions not as a marginal rate of substitution, but as an operational definition of 'negligible' risk below which the constraint is deemed satisfied. This aligns with the non-fungibility requirement: one cannot violate a constraint by promising benefits elsewhere. Additionally, the specific number likely performs epistemic work rather than expressing pure preference; it represents a limit on what can be verified at design time. Probabilities below 10^-9 cannot be empirically validated through testing alone and must be derived from architectural redundancy. Thus, the target may be a claim about the boundary of knowability: below this line, we require structural guarantees (no single failure) because we cannot trust probabilistic estimates alone.

  Distinguishing between what the practice strictly requires and what it merely sits well with clarifies the theoretical commitment. The non-fungibility of risks strictly requires a lexicographic ordering or a hard constraint; a continuous utility function, even a risk-weighted one, implies some finite trade-off rate exists. The structural 'no single failure' rule strictly requires a deontological restriction on design architecture that is independent of outcome probabilities. Conversely, the RWEU account merely sits well with the general intuition that catastrophic risks are worse than frequent minor ones, but it cannot account for the rigid thresholds without ad hoc modifications. The consent-based account—that passengers cannot consent to specific catastrophic gambles—also sits well with the regime, explaining the strictness, but it does not strictly require the specific probabilistic quantification unless one assumes consent is threshold-based.

  If the regime were rebuilt around maximising expected fatalities avoided (pure Expected Value), the changes would be profound. Fungibility would be introduced, allowing manufacturers to accept a higher probability of catastrophic failure if it enabled significant reductions in frequent minor accidents, provided the aggregate expected fatalities dropped. The 'no single failure' rule would likely be abolished or relaxed; a single point of failure would be permissible if the component's reliability was high enough to meet the aggregate target. Certification would become a cost-benefit analysis of safety improvements rather than a compliance check against rigid architectural and probabilistic ceilings. While this might theoretically save more lives overall across the fleet, it would shift the risk distribution to be more volatile, concentrating danger into rare but massive events, and would likely violate the implicit social contract regarding involuntary risk-bearing that the current lexicographic constraint protects.

  Verdict: The practice presupposes a lexicographic safety constraint operationalised through epistemic proxies, rather than a continuous risk-weighted utility function.
