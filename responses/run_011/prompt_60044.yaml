answer: |-
  ### 1. Brainstorming Pass: Candidate Objections

  1.  **Strawsonian:** You reduce constitutive reactive attitudes to instrumental signals, stripping them of their relationship-defining power.
  2.  **Strawsonian:** Standing is about participation in the moral community, not the fidelity of a psychological detector.
  3.  **Second-Personalist:** Epistemic reliability does not generate the normative authority to make demands on another.
  4.  **Second-Personalist:** A calibrated elitist might track wrongness accurately but lacks standing grounded in equal authority.
  5.  **Skeptic:** You haven't distinguished standing from the pragmatic efficacy of blame; this is just usefulness disguised as normativity.
  6.  **Skeptic:** If the wrong is objective, the messenger's bias is irrelevant to whether the blame is morally appropriate.
  7.  **Legal (Clean Hands):** Courts reject hypocritical claims regardless of the claimant's internal epistemic calibration.
  8.  **Legal (Tu Quoque):** International tribunals require binary standing determinations, not audience-relative degrees.
  9.  **Psychologist:** Subjects punish hypocritical blamers even when the blame is accurate and the blamer is calibrated.
  10. **Psychologist:** Calibration is invisible; folk psychology uses moral status heuristics, not signal-tracking assessments.
  11. **Kantian:** Treating blame as reason-transmission instrumentalizes the wrongdoer as a vessel for information.
  12. **Kantian:** Respect requires acknowledging the blamer's authority, not just processing their signal for accuracy.
  13. **Relativity:** If standing is audience-relative, moral responsibility loses its communal force and fragments into private perspectives.
  14. **Calibration:** You cannot measure calibration without already assuming the blame is appropriate, creating circularity.
  15. **Private Blame:** Private blame involves no transmission, so your account implies private blame never requires standing.

  ***

  ### 2. The Prep Sheet: Top 10 Objections

  **1. The Authority Gap (Second-Personalist)**
  *   **Who:** The Second-Personalist.
  *   **Question:** "You've told us standing is about epistemic calibration, but standing is supposed to be about *authority*. Even if I am a perfectly calibrated detector of wrongness, why does that give me the *right* to demand something of you? A spy might be calibrated, but lacks the standing to demand accountability. You've explained credibility, not standing."
  *   **Reply:** "Distinguish the *source* of the reason from the *authority* to deliver it. On my view, the authority derives from the community's need for reliable moral signaling. The spy lacks standing not because they are uncalibrated, but because they are not participating in the reason-conveyance practice *as a member*. Calibration is the necessary condition for the signal to function; membership is the sufficient condition for the demand. I am not reducing authority to reliability, but grounding the *loss* of authority in the failure of reliability."
  *   **Soft Spot:** You are smuggling "membership" back in as a moral status after claiming standing is purely epistemic.
  *   **Concession:** Concede that calibration is necessary but not sufficient; hold that the *loss* of standing is exclusively due to calibration failure.

  **2. The Constitutive Reduction (Strawsonian)**
  *   **Who:** A committed Strawsonian.
  *   **Question:** "Resentment isn't a tool we use to convey reasons; it's a response constitutive of holding someone responsible. By making standing about the 'utility' of the signal, you've turned a participant attitude into an observer's calculation. Doesn't this dissolve the very phenomenon you're trying to explain?"
  *   **Reply:** "I am not analyzing the phenomenology of resentment, but the normative conditions under which expressing it is appropriate. Even if resentment is constitutive, its *expression* functions within a social practice. When that expression is known to be biased, it fails to perform its role in sustaining the moral community. We can acknowledge the reactive nature of the attitude while still critiquing the normative standing of its expression."
  *   **Soft Spot:** Strawsonians will insist the normativity is internal to the attitude, not external to the practice.
  *   **Concession:** Concede that your account is normative, not phenomenological; hold that normative constraints apply to expression regardless of internal feeling.

  **3. The Normative Collapse (Skeptic)**
  *   **Who:** The Skeptic about standing.
  *   **Question:** "If I blame you correctly, but I'm hypocritical, you say I lack standing. But if the blame is accurate, the reason is conveyed. If the reason is conveyed, what work is 'standing' doing? You've just collapsed standing into pragmatic efficacy. Why call it a normative condition at all?"
  *   **Reply:** "Because the lack of standing makes the blame *unjust*, not just ineffective. When an uncalibrated blamer blames, they impose a burden without the requisite warrant, which is a distinct wrong from failing to convince. It's the difference between a judge who is biased versus a judge who is unpersuasive. The former violates a norm; the latter just fails a goal."
  *   **Soft Spot:** You need to explain what the "distinct wrong" is without appealing to the moral status you rejected.
  *   **Concession:** Concede that the distinction is subtle; hold that the wrong lies in the imposition of a biased normative burden.

  **4. The Instrumentalization Charge (Kantian)**
  *   **Who:** The Kantian.
  *   **Question:** "You say blame functions to transmit reasons. But this treats the wrongdoer as a means to the end of moral communication. Where is the respect for persons? Sometimes we blame simply because it is deserved, not to achieve a communicative outcome."
  *   **Reply:** "Transmitting reasons is precisely how we respect persons as rational agents. To blame without aiming to convey reasons is to treat the wrongdoer as an object of causal manipulation, like a dog being trained. My account insists that blame must address the agent's rationality, which is the core of Kantian respect."
  *   **Soft Spot:** This conflates *addressing* rationality with *using* the interaction for community calibration.
  *   **Concession:** Concede that retribution might be a secondary function; hold that reason-conveyance is the primary justificatory ground.

  **5. The Folk Intuition Mismatch (Psychologist)**
  *   **Who:** The Empirical Moral Psychologist.
  *   **Question:** "My vignette studies show people withdraw standing from hypocrites even when the hypocrite is fully aware of their bias and corrects for it. They treat hypocrisy as a moral stain, not an epistemic error. Your account predicts they should accept calibrated hypocrites; the data says they don't."
  *   **Reply:** "Folk intuitions track heuristics, not underlying normative structures. People use hypocrisy as a proxy for calibration because calibration is hard to see. But normative theory isn't bound by heuristics. If a hypocrite demonstrates genuine calibration, the folk might still feel resentment, but that resentment is itself uncalibrated. We should correct the intuition, not the theory."
  *   **Soft Spot:** This is elitist and dismissive of the data that supposedly informs moral psychology.
  *   **Concession:** Concede that folk concepts are messy; hold that the normative account refines rather than mirrors folk usage.

  **6. The Unadjudicable Standard (Legal Theorist)**
  *   **Who:** The Legal Theorist (Clean Hands).
  *   **Question:** "In equity, we need to know if a plaintiff has clean hands. You say standing depends on internal calibration of resentment. How is a court supposed to measure that? You've made standing operationally useless for any institutional practice."
  *   **Reply:** "Philosophical standing sets the ideal norm; legal standing is a procedural proxy. The law uses hypocrisy as a bright-line rule because it correlates with calibration. My account explains *why* the law cares about hypocrisy: because it's the best visible evidence of uncalibrated detection. The law doesn't need to measure calibration directly to rely on the principle."
  *   **Soft Spot:** You are admitting the legal practice doesn't actually track your proposed condition.
  *   **Concession:** Concede the gap between ideal theory and institutional practice; hold that the theory justifies the proxy.

  **7. The Fragmentation Problem (Relativity)**
  *   **Who:** A Strawsonian or Communitarian leaner.
  *   **Question:** "You say standing is relative to the audience. So I can have standing to blame you before my friends, but not before your family? This fragments moral responsibility into cliques. Doesn't responsibility require a unified moral community?"
  *   **Reply:** "The moral community isn't a monolith; it's a network of relationships. Different audiences have different stakes in the wrong. Blame functions differently for the victim versus the bystander. Relativity captures this nuance rather than forcing a false unity. It explains why some blame feels intrusive in one context but appropriate in another."
  *   **Soft Spot:** Risks making moral truth relative to audience perception.
  *   **Concession:** Concede that the *wrongness* isn't relative; hold that the *standing to address it* is context-sensitive.

  **8. The Circularity of Calibration**
  *   **Who:** The Skeptic or Analytic Metaphysician.
  *   **Question:** "How do you measure calibration independent of the blame itself? If I resent X, and you say I'm uncalibrated, how do we know? It seems you define calibration as 'responding correctly to wrongness,' which just means 'blaming when one should.' You've defined standing as 'blaming when one should.'"
  *   **Reply:** "Calibration is about the *modulation* of response by stake, not the correctness of the verdict. We can identify uncalibrated resentment when the intensity varies based on who performed the act, holding the act constant. That is an empirical claim about the psychological disposition, not a circular normative claim."
  *   **Soft Spot:** Hard to disentangle stake-modulation from justified partiality (e.g., victims *should* care more).
  *   **Concession:** Concede that partiality complicates the measure; hold that *bias* (unjustified modulation) is the target.

  **9. The Private Blame Trap**
  *   **Who:** Any attentive audience member.
  *   **Question:** "I blame you in my own head. I never express it. There is no transmission of reasons to you or the community. On your view, do I lack standing for private blame? If not, why does transmission matter? If so, isn't that absurd?"
  *   **Reply:** "Private blame is derivative of the public practice. We learn to blame privately by internalizing the public norms of reason-conveyance. If my private blame is uncalibrated, I am corrupting my own moral agency, even if no one else sees it. Standing applies because I am participating in the practice, even if silently."
  *   **Soft Spot:** Weakens the core claim that blame *functions* to transmit.
  *   **Concession:** Concede private blame is a limiting case; hold that it inherits norms from the public function.

  **10. The Calibrated Bigot**
  *   **Who:** The Second-Personalist or Kantian.
  *   **Question:** "Imagine a bigot who consistently resents Group A for minor slights and Group B for minor slights equally. They are perfectly calibrated—their detector is consistent. But their standard is morally repugnant. Do they have standing?"
  *   **Reply:** "Calibration tracks wrongness, not just consistency. If their standard is morally repugnant, they are not tracking *wrongness*, they are tracking *difference*. Calibration requires tracking actual moral reasons, not just consistent application of a bad rule. So they lack calibration because their baseline is off."
  *   **Soft Spot:** Moves the goalposts from "consistency" to "moral correctness," collapsing standing into blameworthiness.
  *   **Concession:** Concede that calibration requires a correct moral baseline; hold that hypocrisy is the specific failure of applying that baseline to oneself.

  ***

  ### 3. The Question I Am Hoping Nobody Asks

  **The Objection:** "You claim standing is epistemic (calibration) rather than moral (authority/status). But if I am uncalibrated (e.g., a hypocrite) yet I blame you correctly, you say I lack standing. This means I am doing something *wrong* by blaming you, not just something *ineffective*. But if the only defect is epistemic (bias), why is the act *morally* objectionable? You haven't explained why an epistemic failure generates a moral prohibition. You've collapsed the distinction between being a bad messenger and having no right to speak."

  **Verdict:** **Fatal.**
  This objection exposes the core instability of the Calibration Account. If standing is purely epistemic, the sanction for lacking it should be disbelief, not moral prohibition. If you want to maintain that blaming without standing is a *wrong* (which you do, to distinguish it from mere inefficacy), you must admit a moral component to standing (authority/entitlement).

  **Retreat Strategy:**
  Do not defend the pure epistemic view. Retreat to a **Hybrid View**: "Calibration is the *condition* under which the moral entitlement is exercised. The entitlement exists (moral), but it is forfeited when the epistemic function is corrupted. I am not reducing standing to epistemology; I am identifying the trigger for its loss." This saves the normative force while keeping the calibration insight.

  ***

  ### 4. Overstatement and Retreat Zones

  **1. The Definition of Blame**
  *   **Overstatement:** Claiming "The *point* of blame is the conveyance of moral reasons."
  *   **Risk:** This invites the Kantian and Strawsonian attacks that blame is also expressive, retributive, or constitutive.
  *   **Strategic Retreat:** "Conveyance is the *primary justificatory* point, not the only phenomenological feature. We can acknowledge other functions without letting them drive the normative account of standing."

  **2. The Accessibility of Calibration**
  *   **Overstatement:** Implying that audiences can reliably detect uncalibrated resentment.
  *   **Risk:** The Psychologist and Legal Theorist will hammer you on the impossibility of measuring internal modulation of resentment.
  *   **Strategic Retreat:** "We rely on public proxies like hypocrisy. Calibration is the underlying norm; hypocrisy is the observable evidence. We don't need perfect access to enforce the norm."

  **3. The Relativity Claim**
  *   **Overstatement:** Insisting standing is fully relative to audience with no common core.
  *   **Risk:** This makes moral responsibility look fragmented and subjective, alienating the Strawsonians and Communitarians.
  *   **Strategic Retreat:** "The *threshold* for standing is relative to the audience's stake, but the *standard* of calibration is objective. We avoid fragmentation by keeping the metric constant even if the application varies."
