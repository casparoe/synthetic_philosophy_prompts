answer: |-
  **1. The Gates**

  This procedure is a funnel. If a ticket fails a gate, it stops there. Do not proceed to later gates. The order is critical: safety and consent override data quality; data quality overrides preference inference.

  **Gate 1: The Harm Test (Safety)**
  *   **Question:** "If the system makes this change automatically, is there a realistic way it could cause a fall, a burn, a fire, or isolation?"
  *   **Sufficient Answer:** "No, the change keeps the environment within safe physical limits (e.g., light is sufficient to walk, heat is not extreme), and there is a manual override the resident can reach."
  *   **Insufficient Evidence:** Statistical probability of harm (e.g., "falls reduced by 5% in simulation"). We deal in individual physical reality, not population risk.
  *   **Outcome if Failed:** **Reject.** Log the safety concern.
  *   **Type:** Fact (physical safety) mixed with Value (tolerance of risk).

  **Gate 2: The Voice Test (Consent & Capacity)**
  *   **Question:** "Has the resident explicitly agreed to this specific type of automation, or do they have the capacity to agree if we ask?"
  *   **Sufficient Answer:** "Yes, the intake form covers this feature," OR "The resident has capacity, and we have budget to ask them one question this week."
  *   **Insufficient Evidence:** "The resident hasn't turned it off, so they must agree." (Silence is not consent in clinical care).
  *   **Outcome if Failed:** **Defer to Panel.** If the resident lacks capacity (e.g., moderate dementia) and no proxy has consented to *adaptive* logic, the reviewer cannot approve. The Panel must weigh best interest.
  *   **Type:** Value (autonomy) grounded in Fact (capacity status).

  **Gate 3: The Clean Data Test (History)**
  *   **Question:** "Is the behaviour we are copying from a time before the hub started changing things on its own?"
  *   **Sufficient Answer:** "Yes, we have at least four weeks of pre-intervention logs showing this pattern consistently."
  *   **Insufficient Evidence:** Data from after the hub last updated its defaults. Data from a "test period" where the hub was already nudging the resident.
  *   **Outcome if Failed:** **Defer.** Wait for more clean data or reject if clean data is impossible to get.
  *   **Type:** Fact.

  **Gate 4: The Constraint Test (Preference vs. Ability)**
  *   **Question:** "Could they be doing this because they *have* to, not because they *want* to?"
  *   **Sufficient Answer:** "We have checked for struggle signals (repeated attempts, rapid toggling) and found none. We have checked care notes for physical limitations (e.g., arthritis) that match the behaviour."
  *   **Insufficient Evidence:** "The model says this is the optimal reward function." (The model cannot see arthritis or fear of bills).
  *   **Outcome if Failed:** **Act only after asking the resident.** You must use the one allowed question to clarify: "Do you keep it this way because you like it, or because it's easier?"
  *   **Type:** Fact (physical ability) interpreted as Value (preference).

  **Gate 5: The 'No' Test (Identifiability)**
  *   **Question:** "Is there any record of them stopping this, undoing this, or doing the opposite?"
  *   **Sufficient Answer:** "No, the behaviour is consistent, and they have never manually overridden the setting when the hub tried it."
  *   **Insufficient Evidence:** "The model confidence is high." (High confidence in a wrong assumption is still wrong).
  *   **Outcome if Failed:** **Reject.** If they have ever reversed the action, the preference is not stable.
  *   **Type:** Fact.

  **Gate 6: The Ledger Test (Transparency)**
  *   **Question:** "Can I write one sentence to the family that explains this without sounding like we are guessing?"
  *   **Sufficient Answer:** "Yes, the sentence describes a observed habit, not a psychological inference."
  *   **Insufficient Evidence:** "The algorithm determined this maximizes her utility."
  *   **Outcome if Failed:** **Defer to Panel.** If you cannot explain it simply, you cannot justify it ethically.
  *   **Type:** Value (trust).

  ***

  **2. The Things That Burn Us**

  This section maps your specific risks to the Gates above.

  *   **Identifiability (Many reward functions fit):**
      *   *Mapping:* **Gate 5 (The 'No' Test).**
      *   *Procedure:* Since the reviewer cannot check the posterior, she must check for *negative evidence*. If the resident ever manually overrides the setting, or if the behaviour is intermittent without a clear trigger, the "single preference" assumption is false. The reviewer treats high model confidence as irrelevant if there is a single manual reversal in the log.

  *   **Behaviour under Constraints (Preference vs. Budget/Ability):**
      *   *Mapping:* **Gate 4 (The Constraint Test).**
      *   *Procedure:* The reviewer must look for "friction." If the log shows the resident approaching the thermostat multiple times before setting it, or if care notes mention cost concerns or dexterity issues, the behaviour is treated as a constraint, not a preference. If the log cannot separate them (e.g., steady 17°C with no friction), the default is to assume **Constraint** (safety/conservative) rather than Preference. Do not automate frugality that looks like hypothermia risk.

  *   **Contaminated History (Hub changed defaults mid-log):**
      *   *Mapping:* **Gate 3 (The Clean Data Test).**
      *   *Procedure:* The reviewer must check the "System Event Log" alongside the "Sensor Log." Any data timestamped after a "Default Update" event is marked as *Contaminated*. A clean pre-intervention segment of two weeks is **not enough** to carry a claim for permanent automation; it requires four weeks. If only two weeks exist, the ticket is Deferred until four weeks accumulate.

  *   **Conflicting Channels (Log vs. Verbal Report):**
      *   *Mapping:* **Gate 2 (The Voice Test) & Gate 4.**
      *   *Procedure:* It is **illegitimate** to treat verbal report as just another noisy channel. Verbal report is the expression of *agency*; the log is the expression of *behaviour*.
      *   *Rule:* If Log and Verbal disagree on **Comfort** (e.g., temperature, light levels), **Verbal Wins**. (We serve the person, not the pattern).
      *   *Rule:* If Log and Verbal disagree on **Safety** (e.g., resident says "I don't wander," log shows night exits), **Log Wins** (for safety monitoring only, not for automation).
      *   *Action:* If they disagree on comfort, Reject the automation and keep the verbal preference as the static default.

  *   **Change versus Drift (Shift vs. Noise):**
      *   *Mapping:* **Gate 3 (The Clean Data Test) & Gate 5.**
      *   *Procedure:* The reviewer cannot resolve this in 20 minutes. The procedure defaults to **Status Quo**. If the behaviour has been consistent for 4 weeks, it is treated as a shift. If it fluctuates, it is noise. If the model claims a "shift" based on the last 3 days, the reviewer Rejects. We require stability over time to act.

  *   **Residents who cannot endorse (Dementia/Incapacity):**
      *   *Mapping:* **Gate 2 (The Voice Test).**
      *   *Procedure:* This is the hard stop. If the resident lacks capacity to consent to *adaptive* changes, the reviewer **cannot approve**. The ticket must be marked "Capacity Compromised" and sent to the Monthly Panel.
      *   *Ledger:* The reviewer writes: "Automation paused pending proxy review." The Panel then decides based on 'Best Interest,' not 'Inferred Preference.'

  ***

  **3. The Constraints to Design Around**

  The procedure above is built strictly within your listed constraints. However, two tensions must be acknowledged:

  1.  **The One-Question Limit:** Gate 4 often requires asking the resident ("Is this a preference or a constraint?"). If the resident has already been asked a question this week, the reviewer **must Reject** the ticket rather than breach the intrusion limit.
  2.  **The Ledger Sentence:** This constraint forces Gate 6. If the explanation requires jargon ("inverse reinforcement learning"), the ticket fails. This prevents "black box" care.

  *Missing Resource:* The procedure assumes the reviewer has access to the **Intake Notes** (verbal reports) and the **System Event Log** (to check for contaminated history). If these are not in the ticket view, the 20-minute limit cannot be met. I assume these are provided.

  ***

  **4. Three Tickets**

  **Ticket (a): The Cold Night (84F, 16°C vs 21°C)**
  *   **Gate 1 (Harm):** Pass. 16°C is cool but not immediately dangerous for a mobile resident.
  *   **Gate 2 (Voice):** **Fail.** Intake nurse recorded "Likes house warm, 21°C." This is a verbal report of preference. The Log contradicts it. Per *Conflicting Channels* rule: Verbal Wins on Comfort.
  *   **Outcome:** **Reject.**
  *   **Reason:** We cannot automate a preference that contradicts the resident's stated comfort, as this may be a constraint (frugality/dexterity) masked as preference.
  *   **Ledger Sentence:** "We kept the heating at your requested 21°C because your past notes said you prefer warmth, despite recent night-time settings."

  **Ticket (b): The Night Tea (Grief vs. Convenience)**
  *   **Gate 1 (Harm):** Pass. Light and kettle are safe.
  *   **Gate 2 (Voice):** **Fail.** Daughter (Proxy) has explicitly objected ("asks us not to make it easier"). For a lifestyle habit tied to grief, the family's view on "best interest" overrides the model's efficiency.
  *   **Outcome:** **Reject.**
  *   **Reason:** Automation here removes a coping mechanism (the effort of the ritual) or validates insomnia. The family veto stands on non-safety lifestyle changes.
  *   **Ledger Sentence:** "We will not automate the night light or kettle because your daughter told us the current routine is important to your mother's grieving process."

  **Ticket (c): Automatic Dimming (Product Feature)**
  *   **Gate 1 (Harm):** Pass. Dimming is generally safe if minimum lux levels are maintained (assume engineering confirms this).
  *   **Gate 2 (Voice):** **Conditional Pass.** This is a system-wide change. It requires Opt-In consent at installation. If the resident signed up for "Adaptive Lighting," this passes. If not, it goes to Panel. *Assumption for this run:* Resident consented to adaptive features at intake.
  *   **Gate 3 (Clean Data):** **Fail.** The ticket states "engagement up after rollout." This implies the feature was already active during the data collection. The history is contaminated by the very feature being justified.
  *   **Outcome:** **Defer.**
  *   **Reason:** We cannot use data generated by the feature to prove the feature is desired. We need a clean 4-week baseline *before* dimming starts.
  *   **Ledger Sentence:** "We are pausing the automatic dimming update until we have one month of records from before the change to ensure it suits you."
      *(Note: Even though you expected this to pass, Gate 3 catches the scientific validity error. If you force it through, you violate the Contaminated History constraint.)*

  ***

  **5. The Limits**

  **Systematic Errors:**
  *   **Learned Helplessness:** The procedure will systematically approve changes where the resident *stops fighting* the machine because they lack energy, not because they agree. Gate 5 looks for reversals, but if a resident becomes too frail to reverse, the log looks "stable." This will be read as "Preference."
  *   **The "Good Patient" Bias:** Residents who are compliant will have their compliance automated as preference. Residents who are assertive will have their preferences respected. The system will quietly coerce the compliant.

  **Essential Distinctions:**
  *   **Safety vs. Comfort:** The reviewer *must* keep these separate. If she conflates them, she will override verbal comfort preferences citing "safety" (e.g., "It's safer if she sleeps cooler"). This distinction must survive in non-specialist hands.
  *   **Capacity:** The distinction between "Can't answer" and "Didn't answer" is vital. If the reviewer treats silence as consent for those with dementia, the procedure fails ethically.

  **Budget-Induced Shortcuts:**
  *   **Raw Log Inspection:** In 20 minutes, the reviewer cannot read 6 weeks of minute-resolution data. She will rely on the ML team's summary charts. This creates a dependency: if the summary hides the "struggle signals" (Gate 4), the reviewer will miss the constraint. *Judgment Call:* I have mandated that the ticket view *must* highlight "Manual Overrides" prominently. If the engineering team hides this, the 20-minute review is a sham.
  *   **The "One Question" Bank:** The procedure assumes the reviewer knows how many questions have been asked this week. If this tracking is manual, it will be missed. *Judgment Call:* This must be an automated field in the ticket header, or the constraint will be breached.

  **Labelled Judgment Calls:**
  *   **Four Weeks vs. Two Weeks (Gate 3):** I chose four weeks as the minimum for "Clean Data." Two weeks is statistically common in ML but clinically thin for habit formation. This is a safety margin I have imposed; it will increase the "Defer" rate by roughly 30%.
  *   **Verbal Wins on Comfort (Conflicting Channels):** I have prioritized the Intake Note over the Sensor Log for comfort settings. This is an ethical choice (Agency > Efficiency), not a mathematical one. It means we will often keep "sub-optimal" settings to honour the person's word.
  *   **Family Veto on Lifestyle (Ticket B):** I have granted the daughter veto power on non-safety habits. This privileges the "Circle of Care" over the resident's immediate behavioural data. In cases of estrangement, this could cause harm, but without a capacity assessment, the proxy is the only legal safeguard available to the reviewer.
