      Is this valid? Yes, if (1) is true. If no conditions for failure are set, and any outcome is claimed as success, it's unfalsifiable. The move is valid *conditional on (1)*. The issue is whether "unfalsifiable forecast" = "unfalsifiable theory." (Theory could still be falsifiable in other contexts). I should mention this distinction.

