      *   **Specific Instructions:** Identify which steps to reject, explain why they looked acceptable, analyze the move from (3)+(4) to (5), analyze (6), analyze (9), price the alternatives (costs of rejection/rebuilding), and explore weaker successors to (1).

  2.  **Deconstruct the Argument Step-by-Step:**

      *   **(1) The Criterion:** "A quantitative theory... is genuinely predictive only if a competent practitioner... could have stated in advance which observations would count as its failure."
          *   *Appeal:* Strong Popperian intuition. Falsifiability is the demarcation criterion. Looks like scientific rigor.
          *   *Vulnerability:* Too strict for probabilistic or complex systems science. "Genuinely predictive" is ambiguous (deterministic vs. probabilistic).

      *   **(2)-(4) The Turchin Case:** 2010 Nature piece, decade window, no threshold, "dry fuel" analogy, 2020 events seen as vindication, no pre-specified failure.
