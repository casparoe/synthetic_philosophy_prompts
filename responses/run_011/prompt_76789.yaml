answer: |-
  Here is the specification. I'm not going to pad this with introductions. You asked for the answer key first, so here are the functional requirements any adequate account of standing to blame must satisfy, derived from the cases and distinctions you provided.

  ### The Specification: Requirements for an Account of Standing

  **1. The Truth-Preservation Requirement**
  *   **The Consideration:** A hypocrite's accusation can be factually correct. If standing removes the *truth* of the claim, the concept is just a silencing tactic.
  *   **The Requirement:** The account must distinguish between the *validity of the charge* and the *authority of the charger.* It must explain how a claim can be morally true even if the speaker lacks the standing to assert it.
  *   **Status:** **Non-Negotiable.** If a theory collapses standing into truth, it's dead on arrival.

  **2. The Normative Commitment Requirement (The Honest Hypocrite Test)**
  *   **The Consideration:** The "Honest Hypocrite" admits their fault but maintains the norm applies to everyone, including themselves.
  *   **The Requirement:** The account must grant standing to those who acknowledge the norm binds them, even if they violate it. Standing is lost through *exemption-claiming* (saying "rules for thee, not for me"), not merely through *violation*.
  *   **Status:** **Non-Negotiable.** This is the strongest intuition in the literature. Inconsistency alone shouldn't silence moral truth.

  **3. The Victim Priority Requirement**
  *   **The Consideration:** The person the fault was done to (the victim) often retains standing even if they are complicit in similar wrongs elsewhere.
  *   **The Requirement:** The account must explain why being the *target* of the specific wrong grants a unique authority that overrides general hypocrisy.
  *   **Status:** **Taste/Contested.** Some philosophers argue victims lose standing if they are equally guilty. But intuitively, victims have a special claim. I'm marking this as taste because it's not universally shared, though it is dominant.

  **4. The Gradability Requirement**
  *   **The Consideration:** The "Worse Offender" case. Is standing binary (you have it or you don't) or scalar (you have less of it)?
  *   **The Requirement:** The account must handle degrees. A minor hypocrite should not be silenced the same way as a massive one. It must explain whether standing is diminished or forfeited.
  *   **Status:** **Non-Negotiable.** Binary accounts fail the "Worse Offender" test. Moral life is rarely binary.

  **5. The Domain Specificity Requirement**
  *   **The Consideration:** "Domain Bleed." Cheating at cards vs. lying about feelings.
  *   **The Requirement:** The account must define the boundaries of the fault. Does standing forfeit globally (I'm a bad person) or locally (I'm a card cheat)?
  *   **Status:** **Taste.** Some argue moral character is unified; others argue it's compartmentalized. A robust theory should prefer local forfeiture to avoid "moral licensing" where one good deed cancels a bad one, but this is debatable.

  **6. The Restorability Requirement**
  *   **The Consideration:** What brings standing back? Time? Apology? Punishment?
  *   **The Requirement:** The account must specify the mechanism of restoration. If standing is forfeited forever, it becomes a stigma, not a moral status.
  *   **Status:** **Non-Negotiable.** Moral agency implies the capacity for rehabilitation. Permanent forfeiture denies moral growth.

  **7. The Observability Constraint (Your Constraint)**
  *   **The Consideration:** You want this usable in a live argument without mind-reading.
  *   **The Requirement:** The criteria for standing must be based on public behavior or speech acts, not internal states of sincerity or belief.
  *   **Status:** **High Risk.** (See "Constraint Check" below).

  ---

  ### The Tensions and Incompatibilities

  You asked me to flag where these requirements fight each other. There is one major fracture line.

  **The Tension: Normative Commitment vs. Observability**
  Requirement 2 (Normative Commitment) requires us to know if the blamer *actually believes* the norm applies to them. Requirement 7 (Observability) says we can't check internal beliefs.
  *   **The Conflict:** In a live argument, a skilled liar can *say* "I know I'm wrong too, but this is bad" to gain standing, while internally believing they are special. An observable account cannot distinguish the Honest Hypocrite from the Manipulative One.
  *   **The Verdict:** You cannot have both perfect Observability and accurate Normative Commitment. If you prioritize Observability, you turn standing into a game of rhetoric. If you prioritize Commitment, you admit standing is often unknowable in the moment.

  **The Tension: Victim Priority vs. Truth-Preservation**
  If the Victim has "Extra Standing" (Requirement 3), does that mean a non-victim stranger (Requirement 7 in your list) has *no* standing?
  *   **The Conflict:** If standing is based on harm done, strangers lose standing. If standing is based on moral truth, strangers keep it.
  *   **The Verdict:** Most accounts split the difference: Strangers have *general* standing, Victims have *heightened* standing. But your theory needs to decide if standing is a right (everyone has it) or a privilege (earned through harm or virtue).

  ---

  ### The Constraint Check: Is "Observability" Fair?

  **Verdict: It wrecks the project.**

  Here is the straight talk: Standing is a *normative* concept, not an *empirical* one. It is about moral authority, not tactical effectiveness. Demanding that it be verifiable in a live argument without access to internal states reduces "standing" to "rhetorical leverage."

  If you enforce the Observability Constraint strictly, you eliminate almost all serious philosophical accounts (Wallace, Bell, Fritz) because they rely on the blamer's *commitment* to the norm, which is internal.
  *   **If you keep this constraint:** You aren't building a theory of moral standing. You are building a heuristic for winning roommate disputes. That's a useful tool, but don't call it a moral theory.
  *   **If you drop this constraint:** You admit that in the heat of the moment, you often *cannot know* if someone has standing, only suspect it.

  I recommend you drop this constraint for the theory, but keep a separate "Rules of Engagement" list for the actual fight. Don't conflate metaphysics with strategy.

  ---

  ### The Eliminator

  **The Single Requirement That Kills the Most Candidates:**
  **Requirement 2 (The Normative Commitment Requirement / Honest Hypocrite Test).**

  Most lay theories of standing rest on "Clean Hands" (you must be innocent to blame). Requirement 2 destroys the Clean Hands view. It forces the theory to explain why a sinner can preach. Any account that says "You did it too, so you're silenced" fails this requirement. This is the biggest filter.

  ---

  ### Confidence Ratings

  *   **Req 1 (Truth-Preservation):** **95% Confidence.** This is conceptual bedrock. Without this, "standing" is just "power."
  *   **Req 2 (Normative Commitment):** **90% Confidence.** This is the standard view in contemporary philosophy (e.g., R. Jay Wallace).
  *   **Req 3 (Victim Priority):** **60% Confidence.** Highly contested. Some argue victims are *more* compromised by emotion.
  *   **Req 4 (Gradability):** **85% Confidence.** Binary views are too blunt for moral life.
  *   **Req 5 (Domain Specificity):** **50% Confidence.** This is pure taste. Depends on your view of moral character unity.
  *   **Req 6 (Restorability):** **80% Confidence.** Permanent forfeiture looks more like caste than morality.
  *   **Req 7 (Observability):** **10% Confidence (as a philosophical criterion).** I am highly confident this constraint is inappropriate for a moral theory, though I understand why you want it.

  ---

  ### Scoring Your Pet Theory

  **Your Theory:** *Blame is a tool; standing is efficacy. If the target won't receive it, you have no standing.*

  **Scorecard:**
  *   **Truth-Preservation:** **FAIL.** Your theory makes the truth of the blame dependent on the target's reaction. If I'm right but you're stubborn, my blame becomes "false" or "invalid" under your definition.
  *   **Normative Commitment:** **FAIL.** You ignore the blamer's moral record entirely. A manipulative liar has standing under your theory if the target listens. A saint has no standing if the target is deaf.
  *   **Observability:** **PASS.** This is the only thing your theory gets right. Efficacy is observable.
  *   **Gradability:** **PASS.** Efficacy comes in degrees.

  **Verdict:** Your theory is not an account of *standing*. It is an account of *communication success*. It conflates "I have the right to say this" with "You will listen to this." This is a category error. It solves your roommate problem (don't bother blaming if he won't listen) but it doesn't solve the moral problem (was he right to silence you?).

  **Rivals:**
  1.  **The Inconsistency View (Clean Hands):** Fails the Honest Hypocrite test. Too rigid.
  2.  **The Commitment View (Wallace):** Passes most tests, fails Observability. Best moral fit.
  3.  **The Protest View (Bell):** Blame is a demand for respect. Standing depends on whether you are part of the moral community. Strong, but abstract.

  ---

  ### Critique of Your Framing

  You asked me not to be polite, so here it is:

  **1. "Standing" might be a bogus notion for your purposes.**
  You are trying to solve a interpersonal conflict using a metaphysical concept. Standing is useful for third-party judgment (e.g., a judge, a mediator, or society judging a politician). In a dyadic fight between roommates, "standing" is often just a deflection tactic. Your roommate didn't care about moral theory; he wanted to stop you from hurting him. By obsessing over whether he *had the right* to blame you, you might be dodging the fact that you *did the thing*.

  **2. Your "Observability" constraint reveals your actual goal.**
  You don't want a theory of moral standing. You want a **decision procedure for conflict resolution.** You want to know, in the moment, "Can I say this back to him?"
  If that's the goal, drop the moral philosophy. It's too heavy. Adopt a pragmatic rule: *"Standing exists if acknowledging the hypocrisy advances the resolution rather than derailing it."*
  If calling out his hypocrisy fixes the problem, you have standing. If it just makes him defensive and nothing changes, you lack "pragmatic standing," regardless of the moral truth.

  **3. The "Tool Theory" is cynical but useful.**
  Your pet theory (blame as a tool) is effectively a pragmatic shutdown of the moral question. It's useful for moving on, but it doesn't tell you who was *right*. If you want to know who was right, your theory is useless. If you want to know how to stop fighting, your theory is gold. Decide which game you are playing.

  **4. The "Month-Long Chew" Trap.**
  You've been thinking about this for a month. That suggests you're using the philosophy to avoid the apology. The "Honest Hypocrite" case is the trap here. You can say "I did it too, it's wrong, stop doing it," and technically keep your standing. But in a friendship, that often sounds like "We're both assholes, so I get to police you."
  Sometimes, the only way to keep the relationship is to forfeit standing voluntarily. "I did this last year. I have no ground to stand on. But I'm asking you to be better than I was." That isn't about rights; it's about vulnerability.

  **Summary:**
  The spec above is what a *moral theory* needs. Your constraint suggests you want a *conflict heuristic*. Your pet theory is a *pragmatic heuristic*. Don't mix them. If you want to win the argument, use the heuristic. If you want to understand the morality, drop the observability constraint and accept that you can't always prove your standing in real-time.
