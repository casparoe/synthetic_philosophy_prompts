answer: |-
  ### Desiderata for an Adequate Treatment of Fine-Tuning

  The following standards are established to assess whether fine-tuning data constitute evidence for design. They are divided into constraints required for scientific coherence and demands that reflect partisan commitments. An account that fails a constraint cannot function as evidence in a physical context; an account that fails a partisan demand may still be valid but will not satisfy a specific metaphysical constituency.

  #### 1. Invariance Under Reparameterization
  *   **Motivation:** The claim that a constant is "fine-tuned" relies on the assertion that the life-permitting range is narrow relative to the total possible range. However, the size of an interval depends on the variable chosen (e.g., a constant $x$ versus $\log x$ or $1/x$). A uniform probability distribution over one parameter implies a non-uniform distribution over another. If the degree of surprise depends on the mathematical coordinate system, the improbability is an artifact of description, not nature.
  *   **Classification:** **Constraint.**
  *   **Judgment:** **Genuine.** This is a basic requirement of measure theory. Any probabilistic argument that collapses under variable transformation is mathematically ill-formed.

  #### 2. Methodology of the Sweep (Multi-Parameter Analysis)
  *   **Motivation:** Fine-tuning is often presented by varying one constant while holding all others fixed. However, physical systems are coupled; a change in one constant (e.g., gravitational strength) might be compensated by a change in another (e.g., the cosmological constant) to preserve stellar stability. If the life-permitting region is a narrow diagonal corridor through parameter space rather than a small hypercube, single-parameter sweeps grossly exaggerate the degree of tuning.
  *   **Classification:** **Constraint.**
  *   **Judgment:** **Genuine.** This is a requirement for accurate data characterization. Failing to account for compensatory variations misrepresents the volume of the life-permitting region.

  #### 3. Pre-Registration (Independence of Target Definition)
  *   **Motivation:** To claim that hitting a target is improbable, the target must be specified independently of the outcome. If one defines "life-permitting" only after observing the actual values of the constants, one risks the Texas Sharpshooter Fallacy (drawing the bullseye after firing). An account must specify which physical conditions constitute the "target" (e.g., carbon production, stellar longevity) prior to assessing the probability of the constants meeting them.
  *   **Classification:** **Constraint.**
  *   **Judgment:** **Genuine,** though practically difficult. While strict experimental pre-registration is impossible in cosmology, the *logical* independence of the life-criterion from the constant's value is necessary for evidential weight. Without it, the data are fitted to the conclusion.

  #### 4. Measure Specification
  *   **Motivation:** To assert that a set of constants is improbable, one must define a probability measure over the space of possible constants. One cannot simply assume a range is "possible" and then treat all values within it as equally likely without justification. If the space is infinite, a uniform measure is impossible (it cannot be normalized). If the space is finite, the bounds must be physically motivated, not arbitrarily chosen.
  *   **Classification:** **Constraint.**
  *   **Judgment:** **Genuine.** This is the most frequent point of failure. Claims of improbability are meaningless without a justified prior distribution.

  #### 5. Nomic Independence
  *   **Motivation:** The argument assumes the constants are free variables that could have taken different values. If a deeper, undiscovered theory dictates that these constants are mathematically linked or necessary consequences of a single underlying structure, then they are not independent parameters to be varied. Treating them as free variables when they are not constitutes a category error.
  *   **Classification:** **Constraint.**
  *   **Judgment:** **Genuine.** This bears on the definition of the data. If the constants are not contingent, there is no "tuning" to explain.

  #### 6. Explanatory Surplus (Bayesian Likelihood)
  *   **Motivation:** For a hypothesis (e.g., Design) to be supported by the data, the data must be more likely on that hypothesis than on the null hypothesis (e.g., Chance). It is not enough for the hypothesis to be *consistent* with the data; it must raise the probability of the data relative to the competitor.
  *   **Classification:** **Constraint.**
  *   **Judgment:** **Genuine.** This is the standard definition of evidential support.

  #### 7. Mechanistic Transparency
  *   **Motivation:** The demand that the explanation specify *how* the constants are set (e.g., a physical mechanism for a multiverse or a causal process for design).
  *   **Classification:** **Partisan Demand.**
  *   **Judgment:** **Prejudice in disguise (when applied asymmetrically).** Physicists often demand this of design arguments but waive it for multiverse generators or fundamental laws. While a mechanism aids understanding, the *evidential* case rests on likelihood (Desideratum 6), not causal detail. However, for an account to satisfy *physicists* specifically, this often functions as a de facto constraint, even if logically it is a demand for more than mere evidence.

  ---

  ### Selectivity and Compatibility

  **The Most Selective Requirement:**
  **Measure Specification.** This is the primary filter. Most treatments of fine-tuning fail here because they implicitly rely on a Principle of Indifference over an unbounded or physically unmotivated range. Without a justified measure, one cannot calculate the probability required to establish "fine-tuning" in the first place. An account that cannot define its probability space cannot claim the data are improbable, and thus cannot claim the data require explanation.

  **Incompatibility:**
  There is a tension between **Invariance Under Reparameterization** and **Measure Specification** when relying on the Principle of Indifference. To satisfy Measure Specification, one often posits a flat prior over a range of constants. However, a flat prior is not invariant under reparameterization (a flat prior on $x$ is not flat on $\log x$). To satisfy Invariance, one must use a specific type of measure (e.g., Jeffreys prior), but these often yield improper integrals over infinite ranges, violating Measure Specification (normalization).
  *Verdict:* A coherent-sounding subset cannot be satisfied all at once without additional physical input. You cannot have Invariance, Normalization, and Ignorance-based Priors simultaneously. One must break the triangle by importing physical theory to justify the measure, which undermines the claim that the tuning is "surprising" independent of that theory.

  ---

  ### Assessment of Replies

  **The Designer Reply:** Typically satisfies Explanatory Surplus (an agent intends life) but fails Measure Specification and Invariance, as it relies on the improbability of the constants without a justified prior. It treats the "Chance" hypothesis as a straw man that assumes a flat distribution physics does not warrant.

  **The Multiverse Reply:** Satisfies Measure Specification by appealing to frequency across universes, but struggles with Nomic Independence (do the laws vary?) and Verification. It often shifts the fine-tuning to the generator mechanism itself, which must be shown to be robust.

  **The No-Probability Reply:** Accepts the failure of Measure Specification and Invariance. It argues that probabilities do not attach to fundamental constants at all. This satisfies the mathematical constraints by denying the premise but risks rendering the "fine-tuning" observation vacuous, leaving the physical coincidences unexplained.
