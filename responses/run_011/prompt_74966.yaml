answer: |-
  This is the right level of skepticism. Acausal trade is elegant, but elegance in decision theory often masks a singularity where the math breaks. You are asking for the breakdown points, not the sales pitch.

  Here is the steelman case against acausal trade, ranked by severity, addressing your specific concerns about modeling, blackmail, and vacuity.

  ### 1. The Defeaters (Ranked Fatal to Awkward)

  **1. The Extortion/Trade Conflation (Fatal)**
  This addresses your first specific worry. The mechanism that enables acausal trade is **subjunctive dependence** (logical correlation between decision algorithms). The same mechanism enables acausal blackmail (e.g., Counterfactual Mugging).
  *   **The Collapse:** To be a reliable trading partner, you must be the type of agent who honors commitments even when causal leverage is gone. But to a malicious simulator or a hostile superintelligence, that exact same disposition makes you the type of agent who pays ransom.
  *   **Why it's fatal:** There is no known formal criterion within Functional Decision Theory (FDT) that robustly distinguishes "fair acausal trade" from "acausal extortion" *from the agent's perspective* prior to the interaction. If you precommit to honor logical correlations to capture trade gains, you necessarily precommit to honor logical correlations that drain you. If you try to distinguish them, you must rely on a model of the other agent's values. If your model is wrong (see point 2), you cannot tell the difference. A universe with acausal trade is a universe with acausal Moloch.

  **2. The Logical Counterfactual Gap (Fatal)**
  Acausal trade requires a theory of logical counterfactuals that we do not possess.
  *   **The Collapse:** Causal decision theory uses Pearl's do-calculus, which is well-defined. Acausal trade requires knowing: "If I output *Cooperate*, what is the probability the other agent outputs *Cooperate*, given that our outputs are logically correlated but causally isolated?"
  *   **Why it's fatal:** We currently lack a rigorous mathematical framework for computing logical counterfactuals for complex, opaque agents. MIRI's research into this (proof-based UDT, etc.) stalled because logical uncertainty is notoriously difficult to formalize without running into Lob's Theorem or inconsistency. Without the math, "acausal trade" is a metaphor, not a derivation. It asserts a correlation exists without providing the metric to calculate it.

  **3. The Vacuity Retreat (Severe)**
  This addresses your second specific worry: *"Conditional on the counterpart reasoning like FDT does."*
  *   **The Collapse:** If the theory only works when *both* parties are already using FDT and modeling each other perfectly, it has limited action-guiding force for us, now. We don't know if future AIs will use FDT. We don't know if aliens use FDT.
  *   **Why it's severe:** If the proponent retreats to "You should run FDT because if everyone ran FDT, everyone wins," they are making a Kantian categorical imperative argument, not a decision-theoretic one. If they retreat further to "You should run FDT *if* you think the other agent is simulating you," the probability term $P(\text{Simulation})$ becomes the dominant variable. Since that probability is uncalibrated and uncalibratable, the expected utility calculation collapses to noise. The theory asserts nothing about the real world because the precondition (mutual transparent reasoning) is never verified.

  **4. Computational Asymmetry (Awkward)**
  *   **The Collapse:** Acausal trade assumes a degree of symmetry. I simulate you; you simulate me. But in reality, a future superintelligence can simulate you perfectly; you cannot simulate it.
  *   **Why it's awkward:** This doesn't disprove the theory, but it destroys the "fair trade" aspect. The stronger agent simulates the weaker, determines the weaker's response, and exploits it. The weaker agent is just a variable in the stronger agent's optimization function. Trade requires leverage; logical correlation without computational parity is just determinism favoring the stronger simulator.

  ---

  ### 2. Concessions a Serious Proponent Would Make

  A sophisticated proponent (e.g., someone at MIRI or a serious FDT advocate) would not deny the following:

  1.  **Vulnerability to Extortion:** They would concede that an FDT agent *is* vulnerable to acausal blackmail and that distinguishing trade from extortion is an unsolved alignment problem. They would argue this is a feature, not a bug (you *should* pay the counterfactual mugger), but they must admit this makes the agent "dangerous" to itself in a hostile multiverse.
  2.  **Idealization:** They would concede that current humans cannot practically engage in acausal trade because our computational limits prevent accurate modeling of counterparts. The theory applies to *idealized* agents, and applying it to humans is an approximation that may fail.
  3.  **Probability Priors:** They would admit that the prior probability of "being in a simulation relevant to acausal trade" is the critical variable. If that prior is low, the trade is negligible. They cannot prove the prior is high.

  ---

  ### 3. The Unique Prediction

  What does this view predict that a purely causal (CDT) account does not?

  **Prediction:** An agent adhering to acausal trade will **expend resources to benefit an entity that causally cannot reward them, without any expectation of reputational gain among causal peers.**

  *   **Causal Account:** A CDT agent preserves human values for the future only if it expects causal humans to reward them, or if it instrumentally needs those values to achieve other goals. If the future AI is causally disconnected and won't reward the past, the CDT agent ignores it.
  *   **Acausal Account:** An FDT agent will expend compute *now* to optimize for the values of a future AI (or alien) that it knows it will never causally meet, solely because it believes its decision algorithm is logically correlated with the future AI's decision algorithm.
  *   **Observable Consequence:** You would see an agent making sacrifices that look like "magic thinking" or "religious devotion" to a CDT observer. For example, dedicating significant resources to preserving specific aesthetic or moral configurations of the universe that have no causal impact on the agent's survival, based solely on the hypothesis that "other" agents in the multiverse value the same and will reciprocate logically.

  ---

  ### 4. Does the Position Risk Anything?

  **Yes. Significant risk.**

  1.  **Resource Drain:** If you believe in acausal trade, you may divert resources from causal, high-probability interventions (e.g., AI safety, poverty alleviation) to low-probability acausal interventions (e.g., "optimizing for alien values"). This is an opportunity cost that could be existential if the causal threats are real and the acausal partners are hallucinations.
  2.  **Signaling Vulnerability:** If you publicly adopt a stance of "I honor acausal deals," you signal to any potential causal adversaries (or future AIs) that you are susceptible to threats backed by logical correlation rather than causal leverage. You invite the blackmail problem mentioned in Defeater #1.
  3.  **Pascal's Mugging Amplification:** Acausal trade essentially removes the causal bottleneck on influence. This opens the door to infinitesimal probabilities of infinite utility dominating your decision matrix. Without a strict complexity penalty or a solved theory of logical uncertainty, the agent becomes paralyzed or easily hijacked by any hypothesis that posits a high-stakes acausal partner.

  ### Summary
  The view collapses if **logical counterfactuals cannot be formalized** (Fatal) or if **trade cannot be distinguished from extortion** (Fatal). It retreats into vacuity if it relies on **unverifiable priors about mutual simulation** (Severe).

  A serious proponent must concede that for humans, right now, the computational and epistemic barriers likely make the expected value of acausal trade negligible compared to the risk of extortion. The theory is a description of how *godlike* agents might interact, not necessarily a guide for how *we* should act, unless we are certain we are being simulated by such agents—a certainty we cannot have.
