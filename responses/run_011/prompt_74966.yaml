      *   *The "Conditional on FDT" Retreat:* This is the "definition of rationality" problem. If FDT just says "be the algorithm that wins," but doesn't specify *which* algorithm that is in acausal contexts without circular reasoning, it's empty.
      *   *Unique Prediction:* A purely causal agent (CDT) defects in a one-shot Prisoner's Dilemma with a perfect copy. An acausal agent (FDT) cooperates. *Wait, that's standard.* Need something more specific to *acausal trade* (across time/space). Prediction: An FDT agent will expend resources *now* to benefit an entity that causally cannot reward them, based solely on the logical correlation of their source code. E.g., preserving values for a future AI that doesn't exist yet, not for instrumental convergence, but for "trade."
      *   *Risk:* Yes. You might expend resources on ghosts. You might signal vulnerability to extortion.

