  4.  **Selecting and Ranking Defeaters:**

      *   *Fatal:* **The Logical Counterfactual Gap.** We literally don't have the math. Without a rigorous theory of how "my decision" correlates with "their decision" in the absence of causal links, the whole thing is hand-waving.
      *   *Fatal:* **The Blackmail/Extortion Conflation.** If the mechanism that enforces trade also enforces paying threats, the expected utility becomes negative. This is the "Moloch" angle.
