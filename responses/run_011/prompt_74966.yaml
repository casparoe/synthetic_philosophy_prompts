  2.  **Deconstruct Acausal Trade (The Target):**
      *   *Premise:* Agents can cooperate across causal separation by simulating each other's decision algorithms. If I know you are an FDT agent, I know you will cooperate if I cooperate, even if you can't causally affect me.
      *   *Mechanism:* Logical correlation / subjunctive dependence.
      *   *Goal:* Gain gains-from-trade with entities (aliens, future AIs, multiverse counterparts) we can't causally interact with.

  3.  **Brainstorming Defeaters (The "Case Against"):**

      *   *Computational Intractability:* Simulating a superintelligence is hard. Simulating *another* superintelligence simulating *you* is harder.
      *   *The Reference Class Problem:* Who are you trading with? How do you define the "other"? If you define them too narrowly, no trade. Too broadly, exploitation.
      *   *The Blackmail/Extortion Problem (User's Point 1):* If I'm known to honor acausal deals, am I also known to pay acausal blackmail? (Parfit's Hitchhiker vs. Counterfactual Mugging).
      *   *Logical Uncertainty:* We don't have a formal theory of logical counterfactuals that works robustly for complex agents.
      *   *The "Many Worlds" Dilution:* If there are infinite counterparts, does my individual decision matter? (Measure problems).
      *   *Vacuity/Non-Falsifiability (User's Point 2):* Is this just "Do what FDT says" which is "Do what wins"? If it doesn't specify *which* algorithm wins in *which* context, is it empty?
