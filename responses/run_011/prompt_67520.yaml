  4.  **Developing the Core Argument:**
      *   *The "Vanishing Majority" Point:* In a standard doctrinal paradox ($P, Q \vdash R$), PBA might yield $R$ supported by a minority. In this nested case ($F, M \vdash S$; $S, E, C \vdash L$), the disconnect is amplified.
      *   *Calculation:* How many actually support $L$? Only 3.
      *   *Why?* To support $L$, one must support $F, M, E, C$.
      *   *The PBA Defence:* PBA proponents say we are aggregating *reasons*, not just outcomes. We respect the logical structure.
      *   *My Counter:* If the "collective reason" leads to a conclusion that 6/9 members explicitly reject *as a conclusion*, then the "collective reason" is a fiction. It is not the group's reason; it is a logical construct imposed upon the group.
      *   *Fidelity to Reasons vs. Group Judgment:* The standard defence blurs these. It assumes that if we follow the reasons the majority accepts, we follow the group. But here, the "reasons the majority accepts" are held by *different* majorities. There is no single majority that accepts all reasons. Therefore, the "collective reason" is not attributable to any coherent subset of the group large enough to claim authority.

