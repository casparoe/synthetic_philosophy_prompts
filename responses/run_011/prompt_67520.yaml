      *   **The Paradox:** The group collectively affirms all necessary conditions for licensing but collectively rejects licensing.
      *   **The Twist:** This is a *nested* paradox. Usually, the doctrinal paradox is $P \land Q \to R$. Here, one premise ($S$) is itself a conjunction ($F \land M$).
