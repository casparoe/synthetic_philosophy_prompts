  **The setup**
  Avicenna imagines a man created mature, suspended in a void. His eyes are covered, limbs separated so nothing touches, including air. He has no sensory input: no sight, sound, smell, taste, or touch. He has no memory of prior bodily experience. Despite this total sensory deprivation, Avicenna claims this man would still affirm his own existence. He would not, however, affirm the existence of his hands, feet, or brain. The scenario isolates the subject from all external and internal sensory data to test what remains of the "self" when stripped of bodily representation. It is not about flight, but suspension.

  **What it proves on its own**
  On its own, the Flying Man establishes a phenomenological truth, not an ontological one. It proves that self-awareness is primitive and non-inferential. You do not need to perceive your body to know you exist. This validates your intuition: realizing "I am aware" without "I am bodily" does not logically entail "I am not bodily." A brain could theoretically fail to monitor itself while functioning. Avicenna knows this. The experiment only demonstrates that the *essence* of the self is not *identified* with the body in immediate experience. It establishes the soul as the primary object of its own awareness, distinct from sensory objects. It shows the self is not *known through* the body. However, distinctness in knowledge does not guarantee distinctness in being. The thought experiment secures the reality of the subjective "I" as a known fact, independent of sensory confirmation. It creates a wedge between self-knowledge and body-knowledge, but it does not drive that wedge into metaphysical substance yet. It proves the soul is self-manifesting, not that it is self-subsisting. The experiment functions as a diagnostic tool. It reveals that our default access to ourselves is not mediated by sensory organs. If the soul were merely a bodily function like digestion, we would not know it directly without sensing the body. Since we do know it directly, the soul's mode of presence is unique. Yet, uniqueness of access is not proof of separate substance. The Flying Man isolates the *datum* of selfhood, leaving the metaphysical classification for later arguments. It stops at establishing that the self is present to itself essentially, not accidentally through bodily states.

  **Two readings of the scenario**
  The Cartesian reading treats the scenario as an epistemic foundation. Sensory deprivation creates doubt about the body, leaving the "I" as the only indubitable truth. Here, the void creates skepticism about the external world to privilege the mind. The details (blocked senses) serve to eliminate potential errors, isolating the cogito. The Avicennian reading is psychological, not skeptical. Self-awareness is constant and inherent, usually drowned out by intense sensory engagement. The void doesn't create doubt; it removes distraction. The details (blocked senses) aren't about uncertainty, but about quieting the noise so the background hum of self-awareness becomes audible. In the Cartesian view, the man discovers he exists because he cannot doubt it. In the Avicennian view, he affirms existence because he never stopped being aware of it; he just wasn't attending to it. The first reading makes self-awareness a conclusion reached after stripping away falsehoods. The second makes it a primordial state revealed when obstacles are removed. This changes the work the scenario does. For Descartes, it's a proof of distinctness via doubt. For Avicenna, it's a reminder of a constant presence that sensation usually obscures. The Flying Man isn't finding something new; he's noticing what was always there. The sensory deprivation isn't to prove the body might not exist, but to prove the self doesn't *need* the body to be present to itself. Consequently, the Cartesian reading risks begging the question by assuming doubt implies distinct substance. The Avicennian reading avoids this by claiming self-awareness is a brute fact of consciousness, not a logical inference. This distinction matters. The Cartesian reading imposes a modern foundationalist framework onto a medieval text concerned with the hierarchy of being. Avicenna isn't trying to defeat skepticism; he's mapping the soul's faculties. The Flying Man shows the soul's essence is present to itself without mediation. The two readings diverge on whether the experiment is a tool for certainty or a tool for introspection.

  **Where the immateriality actually comes from**
  The Flying Man doesn't prove immateriality alone. It needs the premise that self-awareness implies indivisibility. Avicenna argues elsewhere that the intellect grasps universals, which are indivisible, whereas bodily organs are divisible. A physical eye sees particulars; the intellect grasps "humanity" as a whole. Since the soul grasps indivisible concepts, it cannot be a divisible body. Additionally, self-awareness is unified. If the soul were bodily, awareness would be split across parts. But the "I" is one. Therefore, the subject of awareness is immaterial. The Flying Man provides the phenomenological data: the self is aware of itself directly. The metaphysical argument provides the bridge: direct self-awareness requires a unified, indivisible subject. Bodies are extended and divisible; minds are not. So, the soul is not a body. This premise comes from Avicenna's physics and logic, not the thought experiment. The experiment shows the *fact* of self-awareness; the metaphysics explains the *condition of possibility* for that fact. Without the argument about indivisibility, the Flying Man only proves the soul is hidden from senses, not that it is non-physical. You could be a brain unaware of itself. Avicenna blocks this by arguing that a bodily faculty cannot reflect on itself essentially. Only an immaterial substance can be both subject and object to itself without spatial separation. The missing premise is that "whatever is aware of itself essentially is not extended." This comes from his theory of the intellect. He argues that material forms are received in matter according to material conditions. Immaterial forms are received universally. Since the soul knows itself universally and immediately, it must receive itself immaterially. Thus, the Flying Man is the hook, but the net is cast using arguments about the nature of abstraction. He specifically targets the idea that the soul is a harmony of the body. If it were, it wouldn't perceive itself directly. The Flying Man shows we do.

  **My verdict**
  I pick the Avicennian psychological reading. It fits the text better than the Cartesian one. Avicenna isn't doing foundationalist epistemology; he's describing the soul's nature. Does it get dualism? No, not on its own. It gets you the *reality* of the soul as subject, but you need metaphysical backup to get *substance* dualism. Blunt: It's a nudge, not a proof. It establishes the *subjectivity* of the soul, not its *substantial independence* without further argument. Popular versions skip the metaphysics. The Flying Man is an invitation to introspection, not a logical hammer. It reveals that self-awareness is intrinsic, not derived. But intrinsic awareness doesn't automatically mean immaterial substance without the indivisibility premise. So, Avicenna doesn't beg the question in the text, but popular summaries do. He uses the experiment to secure the phenomenon, then uses physics to secure the ontology. If you want substance dualism, you need the whole system, not just the floating man. The experiment is necessary but insufficient. Further arguments prove it isn't physical. This is the correct reading.
