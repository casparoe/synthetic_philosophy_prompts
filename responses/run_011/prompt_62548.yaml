  You are right to feel that the label "teaching" chafes against the frozen module, and you are right that "Gregorian" misidentifies the locus of cognition. Your friend is reaching for the nearest available buckets, but the shape of the thing you have found is distinct enough to warrant a sharper carve.

  Here is the adjudication of your three disputes, the placement on Dennett's ladder, and the proposed terminology with its boundaries.

  ### 1. Adjudication of the Friend's Candidates

  **Candidate 1: Niche Construction**
  *Verdict: Closest, but requires specification.*
  Your friend is correct that this falls under the broad umbrella of niche construction (organisms modifying environments). However, your objection holds water: standard niche construction (beaver dams, termite mounds) primarily alters *selection pressures* acting on the builder or its kin over evolutionary time (phylogeny). Your configuration alters the *learning trajectory* of a specific individual over its lifetime (ontogeny).
  *Resolution:* This is not general ecological inheritance; it is **Developmental Niche Construction**. Specifically, it is the *non-contingent* variant. The beaver dam protects the kit so it *can* learn; your frozen module structures the data so the learner *does* learn. The distinction is between modifying the environment for *survival* versus modifying it for *competence acquisition*.

  **Candidate 2: Gregorian Creatures**
  *Verdict: Category Error.*
  You are correct. A Gregorian creature is one that *uses* tools to extend its own cognition. Your frozen module does not use tools; it *is* the tool (or the tool-maker). It has no cognition to extend. To call the module Gregorian is to confuse the scaffold with the climber. The *learner* might be Gregorian if it treats the module's output as an external cognitive resource, but the module itself is merely a Darwinian fixture (fixed competences).

  **Candidate 3: Teaching**
  *Verdict: Incorrect (due to contingency).*
  In behavioral ecology (Caro & Hauser, 1992), teaching requires three criteria: (1) behavior occurs in the presence of a naive observer, (2) it is costly to the tutor, and (3) it facilitates learning. Crucially, operational definitions usually require **contingency**: the tutor must adjust behavior based on the pupil's state (e.g., the meerkat stopping when the pup lags). Your frozen module fails this. It emits the same stream regardless of the learner's state. It is a *curriculum*, not a *tutor*. Conflating the two obscures the mechanism: one relies on feedback loops (teaching), the other on pre-structured statistical gradients (curriculum).

  ### 2. Placement on Dennett's Ladder

  This is not a fifth kind of creature. Dennett's ladder classifies individual cognitive architectures. Your configuration describes a **relational topology between two rungs**.

  Specifically, it is a **Darwinian-to-Popperian (or Skinnerian) Scaffolding Relation**.
  *   **The Builder:** A Darwinian creature (or module). Its competences are fixed by prior selection (or prior training run). It does not learn during the interaction.
  *   **The Learner:** A Skinnerian or Popperian creature. It learns via reinforcement or internal hypothesis testing.
  *   **The Link:** The Darwinian agent constructs a "curricular niche" that allows the higher-order agent to ascend a competence gradient it could not climb in a raw environment.

  This explains why the meerkat (Popperian/Skinnerian) and the frozen module (Darwinian) feel similar: in both cases, the *function* is to present a graded sequence. But in the meerkat, the sequencing is dynamic (Popperian testing of the pup's state); in the module, it is static (Darwinian fixed trait).

  ### 3. The Carving: "Curricular Niche Construction"

  You asked for a term with real boundaries. I propose **Curricular Niche Construction (CNC)**.

  This distinguishes it from general Niche Construction (which targets survival/selection) and Teaching (which targets learning via contingency). CNC targets learning via *distributional shaping* by a static or non-contingent agent.

  **Definition:**
  A configuration wherein Agent A (with fixed or non-adaptive parameters relative to the interaction) modifies the statistical distribution of inputs encountered by Agent B, such that B's learning trajectory is accelerated or enabled, without A receiving direct fitness or reward benefit from B's specific improvement during the interaction.

  **Boundaries (What Counts, What Does Not):**

  | Case | Verdict | Reason |
  | :--- | :--- | :--- |
  | **Your Frozen ML Module** | **IN** | Fixed parameters; shapes input distribution; no contingency. |
  | **Meerkat Helpers** | **OUT** (Teaching) | Contingent on pup's begging/state. (Overlaps in function, distinct in mechanism). |
  | **Beaver Dam** | **OUT** (Survival Niche) | Modifies selection pressure/survival, not primarily the *sequence of learning problems*. |
  | **A Textbook** | **IN** | Fixed content; ordered by difficulty; does not react to the student. |
  | **Tandem-Running Ants** | **OUT** (Teaching) | Leader pauses/waits for follower (contingency). |
  | **Parent Praising Effort** | **OUT** (Reward Shaping) | Modifies the *reward function*, not the *problem distribution*. |
  | **Gene Biasing Development** | **IN** (Biological CNC) | E.g., a gene that causes a bird to hatch earlier when food is abundant. Fixed trait shaping developmental input. |

  **Evidence Criteria (How to Prove It Exists):**
  To claim a system exhibits Curricular Niche Construction rather than simple environmental noise or teaching, you must demonstrate:
  1.  **Staticity:** Agent A's policy/parameters do not update in response to Agent B's performance during the relevant timeframe.
  2.  **Order Sensitivity:** Agent B achieves higher final competence with A's ordered distribution than with a randomized sample of the same inputs (proving the *sequence* is the mechanism, not just the content).
  3.  **Asymmetry:** Agent A's fitness/reward function is not directly coupled to Agent B's immediate performance (distinguishing it from cooperative task completion).

  ### 4. Why This Matters

  Your intuition was correct: calling this "teaching" hides the fact that intelligence can be stored in the *structure of the world* rather than the *plasticity of the mind*.

  In your freight company, the frozen module is **crystallized intelligence**. It represents a learning process that happened *once* (during its own training or design) and was then frozen to serve as a permanent scaffold for downstream learners. This is how culture works when it becomes institutionalized: a university curriculum is a "frozen module" relative to the student. It does not change when you fail an exam; it presents the same graded problems to the next cohort.

  Tell your friend this: She is describing the *biological mechanism* (niche construction), but you are describing the *informational topology* (curriculum). The beaver dam is a niche for *living*; your module is a niche for *thinking*. They are functionally distinct. The term **Curricular Niche Construction** preserves the biological lineage of the idea while carving out the specific computational structure you have found.

  You did not find a fifth creature. You found a way for a lower-rung creature to build a ladder for a higher-rung one. That is not a new species; it is the architecture of progress.
