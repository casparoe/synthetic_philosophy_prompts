answer: |-
  "The brushwork is still hers," Elena said, tapping the infrared scan. "Every stroke. The impasto, the glazing, the frustration in the sky. Nothing on the wall has changed."

  "The context has collapsed," Marcus replied. He didn't look at the scan; he looked at the canvas. "We aren't displaying a moment of creation anymore. We're displaying a reenactment. She looked at the first one, decided she could do it again, and then lied about when she did it."

  "She didn't lie. She dated them the same year. Maybe she considered them simultaneous. Maybe she hated the private one—the 'original'—and this was her attempt to fix it."

  "Then it's a revision, not a copy. But she didn't label it 'Version II.' She signed it as if it were the birth. That makes this object a forgery of itself."

  Elena laughed, sharp and tired. "A forgery requires a victim, Marcus. Who got hurt? The buyer of the private version? He has the 'authentic' first thought. We have the polished final statement. The public sees a stormy sea. They feel the wind. Does knowing she painted this bit twice stop the wind?"

  "It stops the history," Marcus said. "Authenticity isn't about quality. It's about lineage. This painting claims to be the source. It isn't. It's a echo pretending to be a voice. When you stand before it, you aren't witnessing the artist grappling with the unknown. You're watching her replicate a known quantity."

  "Is the grappling better than the result?" Elena countered. "Look at the waves here. In the private version, they're tidy. Safe. Here, she tore into them. She knew the composition worked, so she took risks she couldn't take the first time. This is the superior painting. Why should we downgrade it because it arrived second?"

  "Because art isn't just retinal. It's temporal." Marcus stepped closer. "If I write a letter today and copy it exactly tomorrow but date both 'Monday,' I've corrupted the record. You're asking me to ignore the corruption because the ink looks nice."

  "I'm asking you to acknowledge that the artist's final judgment outweighs her chronological accident. She chose this version for the museum. She signed it. She gave it to us."

  "She gave us a puzzle," Marcus said. "And now we know the solution, we can't un-know it. You say there's no victim. What about her past self? The woman who painted the slick one? She's being erased. This copy overwrites her earlier effort. It's a cannibalism of intent."

  Elena paused. She looked at the rough seascape, then at the scan showing the underlayers. "Okay. Suppose you're right. Suppose the ontology is cracked. What do we do? Take it down?"

  "No. But the label changes. 'Copy by artist.' 'Version II.' Something that admits the duplication."

  Elena flinched. "If we label it 'Copy,' the donors will scream. The value drops. The visitors walk past it to see the 'real' thing in the private collection."

  "Then they are learning the difference between price and worth," Marcus said. But he hesitated, looking at the rough brushwork in the foreground. "And... I will concede this. Aesthetically, it is the stronger work. If I encountered it blind, I would choose this one. The 'authentic' original is technically inferior."

  "But?"

  "But knowing it's a replication strips it of its urgency. It becomes a performance."

  "And I'll concede this," Elena said, her voice quieter. "We can't keep the label as is. It's not about the donors. It's... if we know she dated it falsely, we are complicit in the falsification. The paint hasn't changed, but the truth of the object has. I can't protect the experience by hiding the history."

  "So we label it," Marcus said. "We admit it's a copy."

  "We admit it's a duplicate," Elena corrected. "But not a forgery. She wasn't deceiving the market. She was deceiving... time. Maybe she wanted two originals. Maybe she didn't believe in the uniqueness of the moment."

  "Then she was wrong," Marcus said. "Uniqueness is all we have."

  "Or maybe uniqueness is just scarcity marketing," Elena shot back. "If she painted two identical things, why should one matter more?"

  "Because only one happened first."

  "And because only one is here," Elena said. She turned off the light box. The room dimmed, leaving the painting in the gallery light. "We label it. But I'm keeping the text focused on the brushwork. The history explains the object, Marcus. It doesn't replace it."

  "It defines the object," he said. "Without the history, it's just decor."

  "Then let's hope the decor is strong enough to survive the truth."

  "It won't be the same painting," Marcus said.

  "No," Elena agreed. "It won't."
