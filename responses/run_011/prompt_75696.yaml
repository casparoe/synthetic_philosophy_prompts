answer: |-
  # The Ledger of High Water

  The Office of the Ledger smelled of dried ink and wet wool. Outside, the snowmelt season was six weeks away, bringing the annual pressure that tightened the shoulders of every reckoner in Vessa. If the aqueduct cut was not certified before the thaw, the lower terraces would go dry for two winters.

  Odile Renn sat at the iron-bound table in the rear chamber. Before her lay the two maps of the high country. One was drawn by Anselm Ferrand, the Office's own surveyor, a man of thirty years' service. The other belonged to Dace Iles of the Water Company. Both men were honest. Both maps were known to contain errors. Ferrand had missed a spring in the Ashen Steps; Iles had misjudged a ridge in the Salt Road. These contradictions were entered in the permanent record, marked in red.

  Article Nine of the Charter governed the certification. To certify a map, the Ledger had to show that for every admissible division of the country into districts, the map held assertions borne out by inspection that the rival did not, while holding no assertions contradicted by inspection that the rival had made. In the Ledger's columns: Column One required entries; Column Two required silence.

  Odile dipped her pen. She was tasked with comparing Ferrand and Iles regarding the water-bearing stratum beneath Long Bar. Ferrand placed it in the west; Iles placed it in the east. Inspection parties had returned yesterday with core samples.

  She opened the Ledger to a fresh page. She wrote the heading: *Division A: The Founding Districts.* She listed the seven names: Kilnfield, Ashen Steps, Nine Terraces, Salt Road, Greywater Flat, Threshing Plain, Long Bar.

  She filled the columns for Ferrand against Iles.

  **District: Long Bar**
  **Column 1 (Ferrand asserts, Iles silent/wrong, Inspection True):** 1 Entry. (Water in West Long Bar).
  **Column 2 (Iles asserts, Ferrand silent/wrong, Inspection True):** 0 Entries. (Iles claimed East; Inspection found West).

  **District: Ashen Steps**
  **Column 1:** 0 Entries. (Both silent on the missed spring).
  **Column 2:** 0 Entries.

  **District: Salt Road**
  **Column 1:** 0 Entries.
  **Column 2:** 0 Entries. (Iles error was a ridge height, not water presence).

  **Total Count, Division A:**
  **Ferrand Column 1:** 1.
  **Ferrand Column 2:** 0.
  **Status:** Article Nine Satisfied.

  Odile paused. Under the founding division, Ferrand won. The Office would certify Ferrand, the short Long Bar cut would be dug, and the water would flow by summer. It was the result every reckoner expected. It was the result the city needed.

  But Article Nine demanded satisfaction under *every* admissible division, not merely the coarse seven the founders had walked a century ago. Odile took a ruler and drew a line through Long Bar, splitting it into *Long Bar West* and *Long Bar East*. She turned the page.

  **Division B: Refined Districts.**
  **District: Long Bar West**
  **Column 1:** 1 Entry. (Ferrand asserts water; Inspection confirms).
  **Column 2:** 0 Entries.

  **District: Long Bar East**
  **Column 1:** 0 Entries.
  **Column 2:** 1 Entry. (Iles asserts water; Inspection confirms trace seepage Ferrand denied).

  **Total Count, Division B:**
  **Ferrand Column 1:** 1.
  **Ferrand Column 2:** 1.
  **Status:** Article Nine Failed.

  Odile set the pen down. The ink was still wet. By merely drawing a line, she had moved an entry from silence into Column Two. Ferrand was certified under the founders' eyes, and decertified under her own.

  She looked at the red marks in the permanent record. Ashen Steps. Salt Road. Both maps carried recorded contradictions there. If she divided Ashen Steps finely enough to isolate the missed spring, Ferrand's Column Two would fill. If she divided Salt Road finely enough to isolate the ridge, Iles's Column Two would fill.

  Since both maps were known to be wrong somewhere, and since divisions could be refined indefinitely to isolate those errors, Article Nine could never be satisfied by either map. The rule required Column Two to be empty for *all* divisions. As long as the maps contained errors, and as long as the country could be divided finer than the errors, Column Two would eventually fill.

  Odile stood up. The floorboards creaked. She walked to the front office where the Chief Reckoner sat beneath the high window. The old man was polishing his spectacles, his hands steady despite the tremor in his jaw.

  "Article Nine," Odile said. She placed the Ledger on his desk, open to Division B.

  The Chief Reckoner looked at the columns. He looked at the refinement line. He did not gasp. He did not reach for the Charter. He took a cloth and wiped a smudge from the ledger's edge.

  "You split Long Bar," he said.

  "It changes the count. Column Two is no longer empty."

  "It changes the count," he agreed. He leaned back, the chair groaning. "And the Ashen Steps? If you split the Steps to isolate the spring Ferrand missed?"

  "Column Two fills for Ferrand."

  "And Salt Road for Iles?"

  "Column Two fills for Iles."

  The Chief Reckoner nodded slowly. He looked out the window toward the high country, where the snow still held the ridges white. "Then neither map can be certified."

  "Not under Article Nine. Not under the rule as written."

  "We have certified maps every year for forty years," the Chief Reckoner said. His voice was flat, devoid of surprise. "I have signed every certificate since before you were born. We used the founding division. We wrote the result up as though it were the Charter's."

  Odile felt a coldness in her stomach that had nothing to do with the snowmelt. "You knew?"

  "I knew the rule could not be kept if the country was carved too fine. I knew the maps were never perfect. If I waited for a map with an empty Column Two under all divisions, the lower terraces would have dried in the third year of my tenure. The city would have scattered." He tapped the Ledger. "We chose the division that let the water flow."

  "But the Charter—"

  "The Charter was written by men who walked the country once and thought they had captured it in seven names. They distrusted their own lines, so they wrote a rule that demanded all lines. But they left us the power to certify. They did not leave us the power to stop the thaw."

  He looked at her, his eyes tired. "You are a good reckoner, Odile. You saw the trick of the lines. But now you hold the pen. The thaw comes in six weeks. The Long Bar cut requires Ferrand. The Greywater cut requires neither, but it will not fill the cisterns in time for the planting. If you refuse certification, we dig Greywater. The lower terraces lose two winters. People leave. The city shrinks."

  "And if I certify Ferrand?"

  "Then we lie about the division. We use the founders' seven names. We ignore the trace seepage in East Long Bar. We ignore the spring in Ashen Steps. The water flows. The city stays."

  He pushed the Ledger back toward her. "There is no philosophy here. There is only the water and the people who drink it. The rule is a ghost. The aqueduct is stone."

  Odile took the Ledger. The weight of it was significant, the paper thick and ragged. She returned to the rear chamber. The room was quiet, save for the scratching of a mouse in the wainscoting.

  She looked at the two pages. Division A, where Ferrand passed. Division B, where he failed. She looked at the red marks noting the errors in Ashen Steps and Salt Road. She understood now that no matter how the lines were drawn, the errors remained. The Ledger could hide them by drawing broad districts, or reveal them by drawing fine ones. The water did not care about the lines. The city did not care about the logic.

  She dipped her pen. The ink was black and viscous. She hovered over the certification line for Division A. To sign was to validate the coarse division, to accept the lie that the founders' seven names were the only admissible ones. It was to ensure the Long Bar cut began, that the cisterns filled, that the city survived the next two years.

  To refuse was to honor the Charter. It was to acknowledge that a map with known errors could not be ranked as nearer the water than another map with known errors. It was to force the Greywater cut, the longer path, the safer truth that would starve the terraces.

  Odile looked at the window. The light was fading. The snow on the high peaks was turning pink in the sunset. She thought of the drovers who would cross the pass in a month, bringing reports that would contradict both maps in new ways, requiring new divisions, new refinements.

  She lowered the pen to the paper. The nib touched the surface, leaving a small, dark dot. She did not move it forward. She did not lift it away. She sat in the silence of the Office, holding the decision between the truth of the lines and the survival of the city, while the ink settled into the fiber of the ledger, waiting for her hand to choose.
