      *   *Key Themes:* Comparison of digital computers (EDVAC type) with the nervous system.
      *   *Precision:* Computers = high precision (10-12 decimal digits). Brain = low precision (2-3 decimal digits, maybe less).
      *   *Memory:* Computers = addressed (specific locations). Brain = likely by access/association (content-addressable or statistical), not clearly addressed.
      *   *Logic/Math:* Computers = standard Boolean/Arithmetic. Brain = might use a different kind of logic (statistical, non-Aristotelian).
      *   *Reliability:* Components (vacuum tubes/neurons) are unreliable. System is reliable. Mechanism: Statistical redundancy/checking.
      *   *Language:* Computer language is "short" (machine code). Brain language is likely "short" too, but different structure.
