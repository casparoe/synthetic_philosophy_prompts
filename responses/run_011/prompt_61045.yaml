      *   Weaker Conclusion: WBE is plausible *if* we discover the correct level of abstraction (which might not be the neuron) and the correct logic (which might not be Boolean). It remains a scientific problem to find that abstraction.

  8.  **Drafting Section 6: Better Analogy:**
