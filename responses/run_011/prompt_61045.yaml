      *   **Colleague's Claim:** Von Neumann settled that the brain is a computer; differences are quantitative, not qualitative; WBE is an engineering problem, not a scientific one requiring new theory of mind.
      *   **User's Counter-Claim:** Von Neumann treated differences as open questions; emphasized low precision, non-addressed memory, potential structural differences in logic/math, and statistical redundancy. User suspects redundancy implies coarse-graining, which conflicts with the fine-grained state capture required for emulation.
      *   **Constraints:**
          1.  Explicit correspondence table (Machine vs. Nervous Tissue: switching, time, arithmetic, memory, precision, redundancy, program). Status: Proposed/Open/Argued Against.
          2.  Partition of disanalogies (Load-bearing vs. Cosmetic) with criteria. Address speed/size.
          3.  Account of source domain imports (what the computer model brings that the brain lacks).
