      *   *Exhaustive Description:* A computer's state is fully defined by its bits. A brain's state might depend on chemical gradients, glial cells, etc., not just spikes. The "description under which we built it" assumes we know the relevant variables. VN warns we might not.

  6.  **Drafting Section 4: Three Readings:**
