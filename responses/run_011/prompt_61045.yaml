      *   *Preservation:* Must preserve the distinction between micro-state (individual neuron/molecule) and macro-state (cognition/pressure). Must preserve the idea that multiple micro-states realize the same macro-state (degeneracy).
      *   *Relevance to Emulation:* Do we need to simulate every molecule to get the pressure? No. Do we need to simulate every ion channel to get the cognition? Maybe not. This supports the User's skepticism about "resolution."

  9.  **Review and Refine:**
