answer: |-
  Good morning. I know it's early. I know changing a sign means changing forms, updating records, learning a new way home. I know some of you loved the old name, and some of you never thought about it at all. That mix of feelings is exactly why we're here.

  Dr. Vance gave this town a hospital. He gave us care. But the archives also show he held the pen that decided who could vote. For thirty years, while his name was on this road, nobody from the east side got registered. A name on a street isn't neutral. When you give a direction, when you call for help, you are saying who belongs here. For a long time, this name said some people didn't.

  We had to decide what a street is for. A statue in a square asks you to stop and look up. It asks for agreement. A street is different. You don't look at a street sign; you use it. It's in your address. It's on your license. It's what you tell the dispatcher when you're scared. It does its work whether you endorse it or not. So it has to work for everyone.

  That's why we didn't pick another famous person. We didn't want a counter-statue. We wanted a name that doesn't ask anything of you.

  We found a woman who ran the ferry landing. She worked there for thirty years. Born 1868. We don't know her first name. There are no speeches. No surviving letters. Just four lines in the census.

  We don't know what she thought. We don't know who she voted for. We just know she kept the boat running. She got people from one side to the other.

  That is enough.

  A street doesn't need a hero. It needs a function. It needs to carry us. When you say her name today, you aren't agreeing with a philosophy. You aren't honoring a dynasty. You're just saying where you are.

  Dr. Vance's great-granddaughter is here today. She knows the history. We know the hospital mattered. But the road matters too. And a road needs to be open.

  So let's put up the sign. Not to erase the past, but to make sure the next thirty years look different. This street isn't a monument. It's a crossing. And today, it opens for everyone.

  Thank you.

  ***

  **Confidence in the Distinction:**
  I'm about 70% confident the statue/street-name distinction is doing structural work rather than just dressing up the decision. It is structurally useful because it shifts the criterion from *honor* (which requires moral judgment) to *utility* (which requires functionality). By framing the street as a tool used in 911 calls and envelopes, you depersonalize the removal of Vance's name—it's not about canceling him, it's about the road needing to function for all users. This gives the angry families a way to accept the change without admitting their hero was villainous, and it gives the proponents a way to argue for change without demanding a moral reckoning from every resident. However, it is still dressing up the decision to some degree because a street name *is* inherently honorific; choosing the ferry woman specifically because she has no record is still a moral choice about what kind of history we want to center. The distinction softens the blow, but it doesn't change the underlying judgment.

  **The Nervous Line:**
  *"For a long time, this name said some people didn't."*

  This is the line I'd be most nervous reading. It personifies the street name as an active agent of exclusion. The local historian might bristle at the imprecision (a name doesn't speak, a registrar does); the great-granddaughter might hear it as a direct accusation of her ancestor's intent rather than the systemic outcome; and the furious families might hear it as an accusation that *they*, by living on the street now, are complicit in that exclusion. It's the pivot point where the administrative fact (no registrations) becomes a moral statement, and it's the most likely place for the room to tense up.
