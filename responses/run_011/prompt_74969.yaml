answer: |-
  ### The Decision Tree

  This tree sorts respondents by the *functional role* they assign to the concept "life" (Level 1) before testing their intuitions against specific edge cases (Level 2). You may traverse this tree without knowing the philosophical labels attached to the leaves.

  #### Level 1: The Job of the Term
  *Answer these questions based on what you feel the word "alive" is supposed to accomplish in scientific or everyday discourse.*

  **Node 1 (Substantivity):**
  If biologists tomorrow announced they were retiring the word "life" in favor of precise descriptions (e.g., "metabolizing system," "evolving replicator"), would we lose the ability to describe something **real** that exists in nature independently of our language?
  *   **No** (It's just a useful label/convention): Go to **Leaf A**.
  *   **Yes** (It picks out a real category): Go to **Node 2**.

  **Node 2 (The Engine):**
  When you imagine the "spark" that distinguishes a rock from a bacterium, is that spark primarily about **maintaining internal order** against entropy (physics/chemistry), or about **leaving copies** that persist through time (history/information)?
  *   **Maintaining Order:** Go to **Node 3**.
  *   **Leaving Copies:** Go to **Node 4**.
  *   **Neither/Both equally** (No single spark): Go to **Leaf B**.

  #### Level 2: The Case Nodes
  *Answer these based on your intuition about the specific entities. Do not worry about consistency with previous answers; follow your gut on the case.*

  **Node 3 (The Physiological Boundary):**
  Consider a **flame**. It consumes fuel, grows, moves, and maintains its shape against entropy. Consider an **obligate insect endosymbiont** (a bacterium living inside an insect cell). It has a cell membrane but cannot survive outside the host.
  *   If you say the **flame is not alive** primarily because it lacks a self-produced boundary (membrane), but the **endosymbiont is alive** despite its dependence: Go to **Leaf C**.
  *   If you say the **flame is not alive** primarily because it lacks chemical metabolism (energy transformation), and the **endosymbiont is alive** because it has metabolism: Go to **Leaf D**.

  **Node 4 (The Historical Unit):**
  Consider a **self-replicating RNA strand** in a test tube (evolves, no cell). Consider a **sterile mule** (cannot reproduce, but comes from living parents). Consider a **seed in dormancy** (zero metabolism, potential to grow).
  *   If you say the **RNA is alive** (evolution suffices), but the **Mule is alive** only because it belongs to a reproductive lineage (not because of its own capacity): Go to **Leaf E**.
  *   If you say the **RNA is alive** (evolution suffices), and the **Mule is alive** because it possesses the *capacity* for life processes (even if broken), and the **Seed is alive** only when germinating (metabolism required): Go to **Leaf F**.
  *   *(Note: If you said RNA is **not** alive because it lacks a cell, you likely belong in Node 3's branch.)*

  ---

  ### The Leaves (Philosophical Accounts)

  *   **Leaf A: Deflationary/Conventionalist.** (The dispute is verbal, not ontological).
  *   **Leaf B: Cluster-Style Account.** (Life is a family resemblance of traits; no single necessary condition).
  *   **Leaf C: Autopoietic Account.** (Life requires a self-producing boundary/organization).
  *   **Leaf D: Metabolic Account.** (Life requires thermodynamic work/energy transformation).
  *   **Leaf E: Lineage View.** (Life is a property of the historical line; individuals are alive derivatively).
  *   **Leaf F: Darwinian-Property (Individualist) Account.** (Life is the capacity of an individual to undergo evolution by natural selection).

  ---

  ### Analysis of the Tree

  #### 1. Pairs of Leaves the Tree Cannot Genuinely Separate
  *   **Leaf C (Autopoietic) and Leaf D (Metabolic):**
      *   **Why:** In almost all known biological cases, autopoiesis (self-making boundaries) requires metabolism (energy), and metabolism in living systems is contained by autopoiesis. While the **flame** case is designed to separate them (flame has metabolism-like flow but no boundary), a respondent can consistently argue that the flame lacks *specific types* of chemical metabolism (e.g., enzymatic) rather than lacking a boundary. The tree relies on the respondent identifying the *primary* reason for exclusion, which is often introspectively opaque.
  *   **Leaf A (Deflationary) and Leaf B (Cluster):**
      *   **Why:** Both views deny that "life" is a sharp natural kind. A Deflationist might agree to a Cluster account as a pragmatic tool, and a Cluster theorist might agree the dispute is merely verbal if pressed on ontology. The distinction rests on whether they believe the cluster tracks a *real* similarity in nature (Cluster) or is merely a human heuristic (Deflationary), which Node 1 attempts to catch but may miss if the respondent is unsure about metaphysical realism.

  #### 2. Combinations of Answers with No Occupant
  *   **Deflationary Natural Kind:**
      *   **Status:** **Incoherent.**
      *   **Why:** A "Natural Kind" implies a mind-independent category in nature (like gold). "Deflationary" implies the category is mind-dependent or linguistic. One cannot hold that the term is merely a convention *and* that it tracks a fundamental ontological boundary simultaneously.
  *   **Metabolic Lineage View:**
      *   **Status:** **Unattractive/Contradictory.**
      *   **Why:** Metabolic accounts define life as a *current state* of an individual (thermodynamic work). Lineage accounts define life as *historical continuity*. A seed in dormancy has lineage continuity but no metabolism. To hold both views requires saying the seed is both alive (lineage) and not alive (metabolic) at the same time, unless one adopts a dual-concept view which the tree forces to resolve.
  *   **Darwinian-Property + Flame is Alive:**
      *   **Status:** **Unexplored/Minority.**
      *   **Why:** While some have argued flames "evolve" in a loose sense, no serious Darwinian account classifies flames as alive because they lack heredity (genotype/phenotype distinction). If a respondent says "Leaving Copies" is the engine (Node 2) but admits flames (which replicate shape but not information) are alive, they have misunderstood the case or the theory.

  #### 3. Settled Distinct from Contested

  **Settled (Consensus among experts):**
  *   **Viruses Evolve:** There is agreement that viruses undergo Darwinian evolution (variation, heredity, selection). This is empirical fact, not philosophy.
  *   **Viruses Lack Independent Metabolism:** There is agreement that viruses do not generate their own energy or synthesize proteins outside a host.
  *   **Deflationism is Valid:** It is accepted in philosophy of biology that "Is it alive?" may be a verbal dispute rather than a scientific one (Leaf A is a respected position).
  *   **The Mule Problem:** It is generally agreed that sterile individuals (mules, worker ants) are intuitively "alive," which puts pressure on strict "capacity to reproduce" definitions.

  **Contested (Live Disagreement):**
  *   **The Status of Dormancy:** There is no consensus on whether a cryptobiotic organism (tardigrade in tun state, dormant seed) is "alive" during stasis. Metabolicists say no; Lineage/Darwinians say yes. This is a live fracture in the field.
  *   **Natural Kind vs. Cluster:** There is no agreement on whether "life" picks out a single fundamental category in the universe (e.g., for astrobiology) or if it is a fuzzy terrestrial cluster. This determines whether we expect to find "life" on Mars that differs chemically from Earth life.
  *   **The Individual vs. Lineage:** It is contested whether the *organism* is the unit of life or merely a vehicle for the *lineage*. This affects how we classify the **Giant Virus** (which carries translation genes) vs. the **Endosymbiont** (which has lost them). If the lineage is the unit, the virus is more "alive" than the metabolically dependent symbiont; if the individual metabolism is the unit, the reverse is true.

  **Note on Consensus:** Do not treat the **Darwinian-Property** account (Leaf F) as the consensus. While influential (e.g., NASA's working definition), it is heavily contested by proponents of Metabolic/Autopoietic views (Leaf C/D) who argue that evolution is a *consequence* of life, not its definition. The tree presents these as equal branches because the field remains divided.
