answer: |-
  # MSc Philosophy of Biology: Final Examination
  **Module:** Variance, Heritability, and Interpretation  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 40  
  **Calculators:** Permitted  

  ## Question 1: The Legume Panel (40 Marks)

  A research team evaluates the same panel of 40 genotypes of a grain legume across three distinct agricultural sites. The dry yield per plant (grams) is measured. For the purpose of this exercise, assume the additive genetic variance ($V_A$) and dominance variance ($V_D$) are stipulated as constant across all sites, while environmental variance ($V_E$) and Genotype-by-Environment interaction variance ($V_{G \times E}$) vary as shown below.

  **Table 1: Variance Components and Means by Site**

  | Component | Site A (Irrigated Station) | Site B (Rain-fed Smallholder) | Site C (Uniform Irrigation + Extension) |
  | :--- | :---: | :---: | :---: |
  | Additive Variance ($V_A$) | 28 | 28 | 28 |
  | Dominance Variance ($V_D$) | 8 | 8 | 8 |
  | Environmental Variance ($V_E$) | 4 | 32 | 4 |
  | Interaction Variance ($V_{G \times E}$) | 0 | 12 | 0 |
  | **Total Phenotypic Variance ($V_P$)** | **?** | **?** | **?** |
  | **Mean Yield (grams)** | **55** | **40** | **55** |

  *Note: Assume $V_P = V_A + V_D + V_E + V_{G \times E}$.*

  **Answer the following five parts:**

  **(a)** Calculate the narrow-sense heritability ($h^2$) for each site. Explain why calculating broad-sense heritability ($H^2$) is arithmetically unproblematic at Site A but turns on a definitional convention at Site B. Give both candidate values for Site B and state how the choice affects the reported number. **(8 marks)**

  **(b)** A breeder applies a selection differential ($S$) of 10 grams (selecting parents 10g above the site mean) at each site. Predict the response to selection ($R$) for each site. Explain why the identical additive variance ($V_A$) and identical selection differential ($S$) buy such different responses. In your explanation, address whether a 10g differential represents equal selection *intensity* across these sites. **(8 marks)**

  **(c)** A Ministry official reviews the data and notes that narrow-sense heritability at Site C (0.70) is double that of Site B (0.35). The official concludes: *"The environment at Site C has been 'taken care of.' Further investment in uniform provision cannot raise yield further; breeding is the only remaining lever for improvement."* Assess this claim using the data provided. **(10 marks)**

  **(d)** A donor agency proposes shipping the top-performing lines identified at Site A directly to Site B. Their rationale is that yield is 90% genetic ($H^2$) at Site A, so winners there will be winners anywhere. Assess this proposal based on the variance components provided. **(8 marks)**

  **(e)** A seed company argues that since broad-sense heritability at Site A is 0.90 and Site A's mean yield exceeds Site B's by 15 grams, roughly 90% of that 15g gap is genetic in origin. Assess this reasoning. **(6 marks)**

  ***

  ## Model Answer

  **(a) Heritability Calculations and Conventions**
  First, calculate Total Phenotypic Variance ($V_P$) for each site:
  *   **Site A:** $28 + 8 + 4 + 0 = 40$
  *   **Site B:** $28 + 8 + 32 + 12 = 80$
  *   **Site C:** $28 + 8 + 4 + 0 = 40$

  **Narrow-sense heritability ($h^2 = V_A / V_P$):**
  *   **Site A:** $28 / 40 = \mathbf{0.70}$
  *   **Site B:** $28 / 80 = \mathbf{0.35}$
  *   **Site C:** $28 / 40 = \mathbf{0.70}$

  **Broad-sense heritability ($H^2$):**
  At Site A, $V_{G \times E} = 0$, so $H^2 = (V_A + V_D) / V_P = 36 / 40 = \mathbf{0.90}$. There is no ambiguity.
  At Site B, $V_{G \times E} = 12$. The convention turns on whether $V_{G \times E}$ is treated as part of the "genetic" signal or as noise relative to the main effect of Genotype.
  *   *Convention 1 (Strict Genetic):* $H^2 = (V_A + V_D) / V_P = 36 / 80 = \mathbf{0.45}$.
  *   *Convention 2 (Genotypic Stability):* $H^2 = (V_A + V_D + V_{G \times E}) / V_P = 48 / 80 = \mathbf{0.60}$.
  The choice changes the reported heritability by 0.15. Since $V_{G \times E}$ represents genetic sensitivity to environment, excluding it underestimates the total genetic contribution to variance *in that specific set of environments*, but including it conflates stable genetic merit with plasticity.

  **(b) Response to Selection and Intensity**
  **Response ($R = h^2 S$):**
  *   **Site A:** $0.70 \times 10 = \mathbf{7 \text{ g}}$
  *   **Site B:** $0.35 \times 10 = \mathbf{3.5 \text{ g}}$
  *   **Site C:** $0.70 \times 10 = \mathbf{7 \text{ g}}$

  **Explanation:**
  Although $V_A$ (28) and $S$ (10g) are identical, $R$ differs because $h^2$ differs. $h^2$ is a ratio dependent on $V_P$. At Site B, high environmental noise ($V_E=32$) and interaction ($V_{G \times E}=12$) inflate $V_P$ to 80, diluting the correlation between phenotype and breeding value.
  **Selection Intensity:**
  A 10g differential does *not* represent equal selection intensity. Intensity ($i$) is standardized by the phenotypic standard deviation ($\sigma_P = \sqrt{V_P}$).
  *   Site A/C: $\sigma_P = \sqrt{40} \approx 6.32$. Intensity $i \approx 10 / 6.32 = 1.58$ SD.
  *   Site B: $\sigma_P = \sqrt{80} \approx 8.94$. Intensity $i \approx 10 / 8.94 = 1.12$ SD.
  The breeder is selecting more strictly (top ~6%) at Site A/C than at Site B (top ~13%), contributing to the higher response.

  **(c) Assessment of Ministry Official**
  The official's claim is **incorrect** on two counts derived from the data.
  1.  **"Environment taken care of":** The high $h^2$ at Site C (0.70) compared to Site B (0.35) is not because the environment is biologically "solved," but because the environmental *variance* ($V_E$) was reduced (from 32 to 4) via uniform irrigation. Heritability measures the proportion of *variation* due to genetics, not the absolute level of the mean.
  2.  **"Further investment cannot raise yield":** This confuses variance with means. Site C's mean (55) is already 15g higher than Site B (40) due to the environmental improvement. However, high $h^2$ does not imply the mean is at a physiological maximum. It only implies that *current differences between plants* are mostly genetic. A new environmental intervention (e.g., better fertilizer than the current "uniform package") could shift the mean of the entire population upward without necessarily changing $h^2$. Breeding is not the "only" lever; environmental shifts can still change the mean even if $V_E$ is currently low.

  **(d) Assessment of Donor Agency**
  The proposal is **high risk and likely flawed**.
  1.  **G×E Interaction:** While $V_{G \times E} = 0$ at Site A, it is 12 at Site B. This indicates that genotypes react differently to the stress of Site B. A line that is top-performing in the stable environment of A may collapse in the variable environment of B.
  2.  **Scope of Inference:** $H^2 = 0.90$ applies only to the population and environment of Site A. It describes the reliability of phenotype as a predictor of genotype *within Site A*. It does not predict the correlation of performance *across* sites. The presence of $V_{G \times E}$ at Site B explicitly warns that the genetic ranking at A is not guaranteed to hold at B.

  **(e) Assessment of Seed Company**
  The reasoning is a **logical fallacy (Ecological Fallacy)**.
  1.  **Within vs. Between:** Heritability (0.90) explains the variance *within* the Site A population. It cannot be used to partition the cause of the mean difference *between* two sites.
  2.  **Same Panel:** The prompt states this is the **same panel of 40 genotypes**. Therefore, the genetic mean of the panel is identical at Site A and Site B. Since the genetics are constant, **100% of the 15g mean difference is environmental**, regardless of the heritability within Site A. High within-site heritability is perfectly compatible with large between-site environmental differences.

  ***

  ## Marking Scheme

  **General Instruction:** Marks are awarded for correct arithmetic linked to correct philosophical interpretation. Vague recitation of "heritability is population-specific" without reference to the specific numbers ($V_E$, $V_P$, Means) in the table should not exceed 50% of the available marks for that part.

  ### Part (a): 8 Marks
  *   **Arithmetic (4 marks):**
      *   1 mark for correct $V_P$ calculation (40, 80, 40).
      *   1 mark for correct $h^2$ at A (0.70).
      *   1 mark for correct $h^2$ at B (0.35).
      *   1 mark for correct $h^2$ at C (0.70).
  *   **Convention & $H^2$ (4 marks):**
      *   1 mark for identifying $H^2$ at A is 0.90 (unproblematic).
      *   1 mark for identifying the ambiguity at B stems from $V_{G \times E} = 12$.
      *   2 marks for providing both candidate values (0.45 and 0.60) and explaining that the choice depends on whether interaction is counted as "genetic" variance.
  *   **Penalty Triggers:**
      *   Calculating $h^2$ as $V_A / (V_A + V_D)$ (ignoring $V_E$): **0 marks for arithmetic.**
      *   Stating $H^2$ is "impossible" at B rather than "conventional": **Deduct 1 mark.**

  ### Part (b): 8 Marks
  *   **Arithmetic (4 marks):**
      *   1 mark for Response A (7g).
      *   1 mark for Response B (3.5g).
      *   1 mark for Response C (7g).
      *   1 mark for showing formula $R = h^2 S$.
  *   **Interpretation (4 marks):**
      *   2 marks for explaining that $V_P$ differs (due to $V_E$), altering the regression slope of breeding value on phenotype.
      *   2 marks for addressing Selection Intensity ($i$). Must note that 10g is a smaller proportion of the standard deviation at Site B ($\sqrt{80}$) than at Site A ($\sqrt{40}$).
  *   **Penalty Triggers:**
      *   Claiming $V_A$ changes between sites: **Deduct 2 marks.**
      *   Ignoring the intensity/SD argument and focusing only on $h^2$: **Max 3/4 for Interpretation.**

  ### Part (c): 10 Marks
  *   **Critique of "Environment Taken Care Of" (5 marks):**
      *   3 marks for noting that $h^2$ doubled because $V_E$ dropped (32 to 4), not because environmental *effects* vanished.
      *   2 marks for noting that Mean C (55) > Mean B (40), proving environment *was* a lever, and high $h^2$ does not preclude further mean shifts via new environmental inputs.
  *   **Critique of "Breeding Only Lever" (5 marks):**
      *   3 marks for distinguishing variance (what $h^2$ measures) from means (what yield is).
      *   2 marks for identifying that "uniform provision" reduced variance, but a *different* provision could raise the mean.
  *   **A-Grade Differentiator:**
      *   To secure full marks, the candidate must explicitly link the doubling of $h^2$ (0.35 to 0.70) to the halving of $V_P$ caused by the reduction in $V_E$, demonstrating that heritability is sensitive to environmental *uniformity*, not just environmental *quality*.
  *   **Penalty Triggers:**
      *   Agreeing with the official that high $h^2$ implies environmental factors are exhausted: **0 marks for this section.**
      *   Failing to reference the Mean difference (55 vs 40): **Deduct 2 marks.**

  ### Part (d): 8 Marks
  *   **G×E Argument (4 marks):**
      *   2 marks for identifying $V_{G \times E} = 12$ at Site B indicates rank changes or scale changes.
      *   2 marks for concluding that performance at A does not guarantee performance at B.
  *   **Heritability Scope Argument (4 marks):**
      *   2 marks for stating $H^2=0.90$ is local to Site A's variance structure.
      *   2 marks for explaining that high reliability within A does not predict cross-environment correlation.
  *   **Penalty Triggers:**
      *   Claiming genotypes will definitely fail: **Deduct 1 mark (they might succeed, but it's not guaranteed by the data).**
      *   Ignoring $V_{G \times E}$ and focusing only on $V_E$: **Max 4/8.**

  ### Part (e): 6 Marks
  *   **The Fallacy (3 marks):**
      *   3 marks for identifying this as an inference from within-group variance to between-group means (Lewontin's Fallacy).
  *   **The "Same Panel" Fact (3 marks):**
      *   3 marks for explicitly stating that because the **genotypes are the same**, the genetic mean is constant, making the 15g gap **100% environmental**.
  *   **A-Grade Differentiator:**
      *   An A-grade answer must explicitly use the "same panel" constraint to refute the 90% claim definitively (proving it is 0% genetic), rather than just saying "heritability doesn't apply to groups."
  *   **Penalty Triggers:**
      *   Arguing that "some" of the gap might be genetic: **Deduct 3 marks (It is impossible given the 'same panel' stipulation).**
      *   Reciting "heritability is not transmutable" without using the table's mean data: **Max 3/6.**

  ### Grade Boundary Descriptor (A vs B)
  *   **B Grade (28-32 marks):** Correct arithmetic throughout. Correctly identifies that heritability is population-specific. Identifies the fallacies in (c), (d), and (e) using standard philosophical terminology (e.g., "within vs between").
  *   **A Grade (33-40 marks):** In addition to the above, an A candidate must:
