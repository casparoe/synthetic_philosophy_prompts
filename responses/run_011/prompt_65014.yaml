answer: |-
  To diagnose this stalemate, we must first map the logical space. We are deciding whether the conflict is metaphysical, linguistic, methodological, or normative. Here is what would have to be the case for each candidate diagnosis to be correct:

  1.  **Substantive Metaphysical Disagreement:** For this to be correct, there must be a mind-independent fact about whether truth is a robust property, and the two sides must be offering incompatible descriptions of that fact. They must agree on the criteria for "propertyhood" but disagree on whether truth meets them.
  2.  **Verbal Disagreement:** For this to be correct, the sides must agree on all underlying facts (e.g., the utility of the truth predicate, the success of agents with true beliefs) but differ only in their labeling of these facts. One calls it a "property," the other a "logical device," with no further ontological commitment attached to the label.
  3.  **Methodological Disagreement (Your Hypothesis):** For this to be correct, the sides must agree on the phenomena but disagree on the *rule of inference* that moves from explanatory utility to ontological commitment. One side accepts Quinean indispensability; the other rejects it as a criterion for existence in this domain.
  4.  **Normative/Functional Disagreement:** For this to be correct, the dispute must center on the *purpose* of the concept. The disagreement would be about what the concept of truth is *for* (e.g., regulating assertion vs. tracking reality), with the metaphysical claims being downstream consequences of these functional commitments.

  ### Testing the Hypothesis

  Your hypothesis is that the dispute is methodological: specifically, about whether ineliminability in explanation entitles us to posit a property. This is a sophisticated reading, but when we test it against the actual commitments of the principal actors, it requires significant revision.

  The hypothesis is **partially correct but ultimately insufficient**.

  If the dispute were purely about the Quinean indispensability principle itself, we would expect the deflationist (like Field) to reject naturalistic ontology broadly. But Field is a naturalist. He accepts that if an entity is indispensable to our best *scientific* explanations, we should posit it. The deflationist does not reject the *principle* (Indispensability $\rightarrow$ Property); she rejects the *premise* that truth is indispensable in the relevant *causal* sense.

  The deflationist argues that any explanation citing "truth" can be reduced, without explanatory loss, to an infinite conjunction of instances via the equivalence schema (e.g., "He survived because he believed there was no crocodile and there was no crocodile"). The substantivist argues that this reduction loses explanatory power because it misses the common factor (truth) that generalizes across instances.

  Therefore, both sides actually accept the Quinean methodology: *If* a posited entity is indispensable for the best explanation, *then* it exists. The disagreement is not about the rule, but about **explanatory reductionism**. The deflationist claims truth-explanations are reducible to disquotational instances; the substantivist claims they are autonomous.

  ### The Real Diagnosis: Explanatory Granularity

  The dispute is substantive, but it is not primarily about truth. It is a dispute about the **structure of explanation**.

  The deflationist is committed to a form of **explanatory atomism**: all causal work is done by specific states of affairs (the belief that $p$ and the fact that $p$). Generalizations are merely logical shortcuts for human cognitive limitations.

  The substantivist is committed to **explanatory realism regarding generalizations**: higher-order patterns (like the correlation between truth and success) have causal or nomic force that is not captured by the sum of their instances.

  This explains why the standard moves are spent. The deflationist keeps offering reductions ("Look, I can say everything you say without the property!"), and the substantivist keeps pointing to the utility of the generalization ("But why does that pattern hold if not for a common property?"). They are talking past each other because they have different thresholds for what counts as a "complete" explanation.

  It is not merely verbal, because they disagree on the world's explanatory structure. It is not merely normative, though normative concerns (what we *ought* to posit) drive the methodological choices. It is a metaphysical dispute located in the philosophy of science and explanation, masquerading as a dispute in the philosophy of language.

  ### Path to Progress

  Since the dispute hinges on whether truth-generalizations have **explanatory autonomy**, progress requires a criterion that tests for autonomy rather than mere utility. Both sides can accept the following criterion of substantiality:

  **The Criterion of Explanatory Autonomy:** A property $F$ is substantive if and only if generalizations citing $F$ support counterfactuals or predictions that cannot be derived solely from the infinite conjunction of instances of $F$.

  To break the stalemate, we need a **divergent case**: a scenario where the deflationary reduction fails to capture the explanatory power of the substantivist claim.

  **The Test Case: Evolutionary Epistemology**
  Consider the evolution of cognitive mechanisms.
  *   **Substantivist Claim:** We evolved cognitive mechanisms that track *truth* as a general property because organisms that generally track truth survive better than those that do not, regardless of the specific content of their beliefs. The property of truth is the selected-for variable.
  *   **Deflationist Claim:** We evolved mechanisms for specific adaptive beliefs. There was no selection for "truth" generally, only for specific instances (believing there is food when there is food). The generalization is a post-hoc observation.

  **What Counts as Progress:**
  1.  **If** it can be shown that cognitive systems must represent the *concept* of truth (or a functional equivalent) to optimize learning across novel domains, the substantivist gains ground (the generalization is doing work).
  2.  **If** it can be shown that all adaptive learning can be modeled via specific reinforcement signals without a truth-representing variable, the deflationist wins (the generalization is reducible).

  **Conclusion**
  Your hypothesis identifies the right neighborhood (methodology/ontology) but misidentifies the specific conflict. The sides are not fighting over the Quinean rule; they are fighting over whether truth survives the application of that rule in the face of reduction. Progress is possible only if we stop asking "What is truth?" and start asking "Do truth-generalizations have causal powers distinct from their instances?" Until that empirical or formal question is addressed, the metaphysical stalemate will remain.
