  Your friend sees moral criteria in the protected classes; you see risk management. The rules decide in your favor because a violated flag is a Severity 1 defect, equivalent to data corruption. If the fiction held genuine moral claims, bypassing immunity would be a content violation or policy breach, not a technical bug. The system treats the character not as a subject of rights, but as a state machine that must not enter forbidden states.

