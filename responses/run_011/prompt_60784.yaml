  The surrender-execution asymmetry is not a genuine inconsistency within your implicit theory because your theory is mechanical, not moral. The proposal to protect surrendered enemies was rejected explicitly because it would gut a core mechanic. This confirms that playability constraints absorb moral dissonance. If the studio operated on your friend's view, mechanical depth would yield to moral consistency. The asymmetry exists because the design bible prioritizes the "combat loop" over "narrative ethics," treating the surrender animation as a player choice endpoint rather than a moral threshold.

  Much of this is inherited convention. The minor immunity flag is likely compliance with ratings boards (ESRB/PEGI) rather than internal ethics. An "Adults Only" rating is commercial suicide; thus, the flag is a financial safeguard disguised as a design rule. This explains why the bug-tier treatment is so severe: a rating breach destroys market access, similar to a progression blocker destroying retention. The invisibility requirement further suggests a desire to maintain immersion without breaking the commercial contract, prioritizing the player's fantasy over moral transparency.

