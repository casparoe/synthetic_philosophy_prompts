      *   **Surrender-Execution Asmetry:** Is it inconsistent? The rules prioritize "core mechanic" over moral consistency. It's absorbed by gameplay constraint. The theory is "Playable State Integrity," not "Moral Coherence."
      *   **Changes for Friend's View:** If fiction matters morally, circumvention should be a content warning or banned behavior, not a "bug." Survey should measure moral harm, not just regret. Achievements for killing surrendered enemies should be removed.
      *   **Changes for User's View (Dispositions/Comfort):** Already mostly there. To be sincere, remove moral language from design docs, frame everything as retention/psychological safety.
      *   **Inherited Convention:** Acknowledge that the "minor immunity" is industry standard (ratings boards), not deep theory.

  5.  **Refining and Editing (Word Count Check):**

      *   *Opening:* The rulebook structurally supports your instrumentalist reading, treating immunity circumvention as a breakdown of artifact integrity rather than a moral transgression.
