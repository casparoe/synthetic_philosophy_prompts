      Also, regarding Mauss: The book implies gift economies are "corruption-free." Specialists would say they are "corruption-concept-free" but still have mechanisms for punishing betrayal. The lack of a word doesn't mean lack of a norm.

      *Refining the "Middle Position":* The middle ground is that while *definitions* vary, the *harm* (distortion of public good for private benefit) is measurable and often universal in impact, even if the mechanism differs.

  6.  **Final Review against Constraints:**
