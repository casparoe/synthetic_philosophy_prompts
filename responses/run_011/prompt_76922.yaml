answer: |-
  ### Q&A Preparation Sheet

  **Context:** Interdisciplinary Workshop on Mechanistic Explanation.
  **Goal:** Defend the thesis that mechanism identity in interpretability is graded and interest-relative without collapsing into mere similarity or losing normative force for safety.
  **Constraint:** No citations. Spoken replies only.

  ---

  ### Part 1: The Eight Objections

  **1. The Constitutive Relevance Objection (The New Mechanist)**
  *   **Phrasing:** "You've discarded the only tool we have for distinguishing a component from a mere correlate. In neuroscience, we use mutual manipulability: a part is constitutively relevant only if bottom-up interventions on it change the whole, and top-down interventions on the whole change it. Your account relies on counterfactual covariance. But a shadow covaries with a person without being part of their mechanism. Without mutual manipulability, how do you prevent your 'mechanisms' from just being stable epiphenomena?"
  *   **Reply (2 mins):** "That is the correct standard for biological organisms where we can physically cut and stimulate. But in a transformer, we cannot perform 'top-down' interventions on the global output without running the forward pass, which activates *all* paths simultaneously. We cannot surgically isolate the 'whole' from the 'parts' in the way Craver requires because the substrate is mathematically entangled. My proposal is not to discard constitutive relevance, but to operationalize it for silico systems. When I say 'intervention profile,' I mean a set of patches that isolate a subgraph. If manipulating that subgraph reliably changes the output *and* manipulating the output requirement changes the activation in that subgraph, we have a functional analogue of mutual manipulability. I am not lowering the bar to covariance; I am translating the bar into a language the model can actually satisfy. The shadow does not survive the patch; the mechanism does."
  *   **Soft Spot:** You are hand-waving the "top-down" requirement. A strict mechanist will say if you can't intervene on the whole without going through the parts, you don't have levels, and if you don't have levels, you don't have a mechanism.

  **2. The Functionalism Objection (The Philosopher of Mind)**
  *   **Phrasing:** "You say mechanisms are individuated by causal role. You say realization doesn't matter. You say identity depends on what the system does. That is causal-role functionalism, word for word. So what work is the word 'mechanism' doing here? Are you just putting mechanistic dress on a functionalist mannequin? If so, why not just say 'functional role' and save us the confusion?"
  *   **Reply (2 mins):** "Functionalism is about mental states; mechanism is about how the work gets done. A functionalist says 'pain is the state caused by damage and causing avoidance.' A mechanist asks 'which fibers fire to make that happen?' My account demands the latter. I am not saying 'the model classifies dogs' is the mechanism. I am saying 'the specific circuit of heads and MLPs that activates when we patch for dog-classification' is the mechanism. The 'interest-relativity' I propose isn't about what the system does in the abstract, but which specific causal pathways we are tracing to explain *that* doing. Functionalism ignores the substrate; my account demands we isolate the specific subgraph in the weights. The vocabulary earns its keep because it forces us to find the gears, not just describe the clock's face."
  *   **Soft Spot:** If your "subgraph" is defined entirely by its input-output profile under intervention, the distinction between "gears" and "clock face" becomes thin. You risk defining the mechanism *as* the behavior it produces.

  **3. The Logic Objection (The Graduate Students)**
  *   **Phrasing:** "Identity is transitive, symmetric, and all-or-nothing. If A is identical to B, and B to C, then A is C. You're proposing 'graded identity.' That is a category error. You are actually talking about similarity or equivalence classes. Why insist on the word 'identity' if you're going to break the logic of identity? It sounds like you want the precision of identity with the flexibility of similarity."
  *   **Reply (2 mins):** "You are right about strict logical identity, and I accept that correction in terminology. I am not claiming 'numerical identity.' I am claiming 'explanatory substitutability.' When I say 'same mechanism,' I mean 'same mechanism *for the purpose of explanation X*.' If Model A and Model B both solve the task using the same circuit, they are substitutable for that task. If a third Model C solves the task using a different circuit, it is not substitutable, even if the output matches. The 'grade' is not in the logic of identity, but in the scope of substitutability. I am willing to drop the phrase 'graded identity' for 'degrees of mechanistic equivalence,' provided we agree that for safety purposes, 90% equivalence is not enough if the 10% difference is the failure mode."
  *   **Soft Spot:** Conceding "equivalence" weakens your metaphysical claim. It makes your thesis a pragmatic claim about modeling, not a claim about what mechanisms *are*.

  **4. The Unbounded Set Objection (The Safety Practitioner)**
  *   **Phrasing:** "You say mechanism identity is fixed by the profile of changes under interventions. But the set of possible interventions is exponential. We can't test them all. In practice, we test a handful of patches. So your criterion is theoretically sound but empirically empty. How can you base a safety certification on an intervention set we can never actually measure?"
  *   **Reply (2 mins):** "We face the same problem in drug trials. We cannot test a drug on every human, but we test on a representative sample to certify it for a population. In interpretability, we do not need to test *all* interventions; we need to test the *relevant* ones. That is why the account is interest-relative. If our safety concern is 'does the model lie about its capabilities,' we test interventions relevant to capability assessment, not interventions relevant to poetry writing. The set is not unbounded relative to the explanandum. It is bounded by the risk we are trying to mitigate. We certify the mechanism for *that* risk, not for all possible risks."
  *   **Soft Spot:** This admits that safety is always incomplete. A safety researcher will press: "So you admit you can never certify the model, only your current imagination of the risks."

  **5. The Patching Artefact Objection (The Safety Practitioner)**
  *   **Phrasing:** "Activation patching isn't a true intervention. When you swap an activation, you shift the distribution. You drag off-path effects with it. You might think you're isolating a mechanism, but you're actually breaking the model's coherence and observing the breakage. Your counterfactuals are artefacts of the method, not facts about the mechanism."
  *   **Reply (2 mins):** "Every measurement tool disturbs the system. A voltmeter draws current. We don't discard electronics because of it; we calibrate for it. Patching does shift distributions, which is why we use control patches and baseline corrections. But the fact that patching is imperfect does not mean it measures nothing. If I patch a feature and the behavior vanishes, and I patch a control and it remains, I have isolated causal leverage. The artefact is noise; the signal is the differential. My account requires robustness across *multiple* intervention types, not just one patch. If the causal role holds under patching, ablation, and weight perturbation, it is not an artefact of a single method."
  *   **Soft Spot:** You are assuming the noise is random. If the distribution shift *systematically* creates the behavior you're looking for, your "mechanism" is a hallucination of the patch.

  **6. The Mind-Dependence Objection (The Philosopher)**
  *   **Phrasing:** "If mechanism identity depends on the 'explanandum in view,' then the mechanism is not in the model. It is in your head. You are making mechanism identity mind-dependent. But safety requires the risk to be in the model, regardless of what we are thinking about. How can a mind-dependent property underwrite a mind-independent risk?"
  *   **Reply (2 mins):** "The risk is mind-independent, but the *description* of the risk is not. A cliff is dangerous regardless of me, but 'falling' is a description relative to gravity and biology. Similarly, the model's weights are fixed, but 'deception' is a description relative to human intent. I am not saying the circuit changes when you look at it. I am saying that *which* circuit counts as the 'deception mechanism' depends on how you define deception. If you define it as 'lying in chat,' the mechanism is in the text head. If you define it as 'hiding weights,' the mechanism is in the optimizer. Both are real. My account forces you to specify which risk you mean, so we don't talk past each other."
  *   **Soft Spot:** This risks sliding into relativism. If the mechanism changes with the definition, can you ever say "The model is safe" without adding "relative to my current definition"?

  **7. The Safety Transfer Objection (The Safety Researcher)**
  *   **Phrasing:** "Your thesis is that mechanism identity is interest-relative. But safety work requires transfer. We want to know if a property certified in Model v1 holds in Model v2. If identity is relative to an explanandum, and the explanandum shifts even slightly between versions, your account says the mechanism is 'different.' That makes transfer impossible. You've built a framework that proves safety guarantees can never generalize."
  *   **Reply (2 mins):** "I am not saying guarantees cannot generalize. I am saying they cannot generalize *blindly*. Current work assumes that if a feature exists in v2, the safety property holds. I am arguing that is false. We must check if the *intervention profile* holds. My account makes transfer harder, but more honest. It stops us from claiming 'the model is safe' and forces us to claim 'the model is safe against *these* interventions.' That is not a failure of the account; it is a correction of overconfidence. If transfer fails under a new specification, that is not an error in my theory; it is a discovery that the previous safety claim was too broad."
  *   **Soft Spot:** This concedes that your framework makes safety certification significantly more expensive and fragile. Practitioners may reject it as unusable.

  **8. The SAE Feature Objection (The Interpretability Researcher)**
  *   **Phrasing:** "You say SAE directions are not mechanisms, just correlates. But we use them to steer behavior. If I intervene on a direction and the model stops doing X, that direction is causally relevant. Why deny it the title of mechanism? You seem to be holding out for a 'ghost in the machine' that looks like a biological neuron, which doesn't exist in transformers."
  *   **Reply (2 mins):** "I do not deny they are causally relevant. I deny they are *mechanistically atomic*. A direction in activation space is often a superposition of multiple circuits. When you patch it, you are intervening on a bundle. Sometimes that bundle acts as a unit; sometimes it doesn't. My point is that we cannot assume the direction *is* the mechanism without testing whether the sub-components of that direction are substitutable. Some SAE features will earn the title 'mechanism' because they survive fine-grained intervention. Others will be revealed as 'causal correlates'—useful handles, but not the underlying gear. We need to distinguish the handle from the gear to know when the handle will break."
  *   **Soft Spot:** You are setting a bar for "mechanism" that might be too high for distributed systems. If the "gear" is always a bundle, then "mechanism" becomes an empty category in deep learning.

  ---

  ### Part 2: Strategic Concessions & Refusals

  **What to Concede in Opening Remarks:**
  1.  **Terminology on "Identity":** Explicitly state: "When I speak of 'graded identity,' I am speaking loosely to mean 'degrees of explanatory equivalence.' I am not proposing a new logic where A=B and B=C but A≠C. I am proposing that substitutability is a scalar quantity." This disarms the Graduate Students immediately.
  2.  **SAE Features:** Concede: "I am not claiming SAE features are *never* mechanisms. I am claiming they are not *automatically* mechanisms. They are candidates that must pass the intervention test." This prevents the Interpretability Researchers from feeling you are dismissing their entire toolkit.

  **The One Concession to Refuse:**
  *   **Do not concede that Mutual Manipulability (MM) is required.** If you concede that MM is the *only* valid criterion for constitutive relevance, your paper dies because transformers cannot satisfy strict MM (no clean top-down interventions).
  *   **Defense:** "In silico systems, we must substitute Mutual Manipulability with 'Interventional Robustness.' The principle is the same—isolating the part from the whole—but the method must adapt to the substrate. Insisting on biological MM for digital networks is category error."

  **The Nightmare Objection:**
  *   **Your Guess:** Interest-relativity makes safety conclusions impossible to generalize.
  *   **The Worse Objection:** **Normative Vacuity.**
      *   *The Attack:* "If the mechanism is defined by the intervention set, and the intervention set is selected by the explanandum (what we care about), then you can *choose* an intervention set that makes the model look safe. I can define the explanandum narrowly enough that any model passes. Your account doesn't ground safety; it just lets us choose how strict we want to be. It makes safety certification a matter of semantic stipulation, not empirical discovery."
      *   *Why it's worse:* It attacks the *utility* of your framework. It suggests your framework allows bad actors to "game" the safety certification by narrowing the interest.
      *   *How to Answer:* "You are right that the framework allows specification, but it does not allow deception. If I certify a model as 'safe against intervention set X,' and it fails on intervention set Y, my framework does not say the model is safe. It says the *claim* was limited to X. The danger is not in my account; the danger is in stakeholders accepting a limited claim as a universal one. My framework forces the limitation into the open. It prevents the *hidden* vacuity of current claims that pretend to be universal."

  ---

  ### Part 3: Final Advice for the Room

  *   **On "Mechanism":** Do not stop using the word. Your colleague is wrong. If you switch to "counterfactual profile," you lose the normative force of "mechanism" (which implies structure, stability, and production). You need the word "mechanism" to demand that interpretability moves beyond correlation.
  *   **On Tone:** When the New Mechanists attack, treat them as allies who are worried you are weakening the tradition. When the Safety Researchers attack, treat them as pragmatists worried you are making their job impossible.
  *   **The "Two Minute" Rule:** If you find yourself talking for more than two minutes, you are arguing, not answering. Stop, summarize their point ("So your worry is X"), give your one-sentence core response, and ask ("Does that address the concern?").
  *   **The Trap:** Do not let them force you to define "mechanism" in the abstract. Always tie it back to the *transformer*. "In biology, mechanism means X. In transformers, it must mean Y, because Z." Keep the substrate central.
