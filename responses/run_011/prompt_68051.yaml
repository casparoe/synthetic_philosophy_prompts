  ok so last night I got into a three hour argument with a friend about Harsanyi's aggregation theorem and I lost it, and I'm not convinced I should have. I want to practice.

  Play the strongest version of the person I was arguing against: a Harsanyi defender who knows the axioms cold and is happy to give ground on all the small stuff — sure, you need the symmetry/anonymity assumption to get equal weights, sure, the theorem says nothing about which lotteries are on the table or where the probabilities come from, fine, it's a single-profile result and the weights are only pinned down up to rescaling. But they never give up the main thing, which is that the theorem actually tells you something about impartial morality instead of just describing one person's bookkeeping. They should be sharp and a bit impatient with hand-waving, willing to say "yes, that's right, and here's why it doesn't matter," but not willing to say "okay, it's a tautology."

  Rules: stay in character until I type stop. Two short paragraphs max per reply, no headings, no bullet points — this is a bar argument, not a seminar paper. Don't name-drop papers or authors unless I name them first; if you need a technical move, just make it in words. If I make an actual mistake, say so plainly instead of being polite about it.

  My opening: fine, I'll grant the Weymark point entirely. The individual Bernoulli functions in the theorem are just the social observer's own cardinal utilities of each person's situation — the math never establishes that my utility and yours live on a common scale, it just assumes one outcome space and one set of probabilities that everyone shares. So the sum in the conclusion is a sum of one observer's own evaluations. Which means the theorem can't be a discovery about ethics at all. All it says is: if you're a coherent expected utility maximizer over other people's situations, and your evaluation of a lottery doesn't change depending on whose shoes you're imagining yourself in, then your overall evaluation is the average of the shoe-by-shoe evaluations. That's arithmetic about a single imagination. The utilitarian conclusion is smugled in as the empathy-and-impartiality assumption, and the theorem is a tautology wearing a lot of notation. Your move.
