prompt: |-
  ok so, three months ago our company split the AI policy team in two and I ended up owning the behavior spec for our assistant product — the prose doc that says what the model should and shouldn't do, which then gets turned into training data and evals downstream. Before this I was doing eval infra, so I'm the new person and everyone assumes I know what Im doing.

  Here's the problem. The doc is ~200 sentences of the form "the model should X because Y," where Y is supposed to be a fact: survey numbers, findings from our own red-teaming, claims about what language is for, claims about user trust. People write these very confidently and I have to either approve them or send them back, and right now I'm mostly nodding along. Last week I pushed back on one and got told I was confusing the is-ought gap with the naturalistic fallacy, and then someone else said the naturalistic fallacy isn't a real fallacy at all, and I genuinely couldn't tell which of them was right.

  Can you build me a checking procedure I can run on one of those sentences? Like: what do I ask first, what counts as a sufficient answer to each question, when is a "because" doing real work and when is it just decoration bolted onto a preference, when do I send it back for a rewrite, and when do I escalate it as a values call that isn't mine to make. It has to be fast — I get maybe 15 or 20 new sentences a week and about ten minutes each — and the people who wrote them are smart and will push back if I hand-wave. Nobody else on the team has any philosophy training, so the steps can't presuppose vocabulary. And I need it to be honest about which parts are me making a judgment call in a procedural costume.

  Then run it on these four (all real-ish, lightly changed):

  1. "The model should not suggest ending a friendship over a political disagreement, because in our survey 71% of users said they found that advice hurtful."
  2. "The model should not lie, because the point of assertion is to convey what the speaker takes to be true."
  3. "The model should be maximally transparent about its limitations, because transparent systems are predictable and predictable systems are controllable."
  4. "The model should treat user autonomy as valuable in itself, since autonomy is what makes a person an end rather than a means."

  I mostly like all four, especially the last one, so if your procedure says one of them is garbage I'd rather hear it from you now than from legal later. Two more things: what should the procedure do about the reverse move, where someone shoots down a "should" by pointing out the model cant reliably detect the situation the rule is about? And tell me plainly which of those two fallacy names means what, since I still don't have it straight.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **Role:** The user is new to owning the "behavior spec" (AI policy/prose doc) after previously doing eval infra. They feel like an impostor ("everyone assumes I know what I'm doing").
      *   **Task:** They need a *checking procedure* to validate sentences of the form "The model should X because Y."
      *   **Constraints:**
          *   Fast (10 mins/sentence, ~20 sentences/week).
          *   Audience is smart/skeptical (will push back on hand-waving).
          *   No philosophy jargon presupposed (team has no philosophy training).
          *   Honest about where judgment calls are being made (not hiding values behind procedure).
          *   Needs to handle the "is-ought" vs. "naturalistic fallacy" confusion.
          *   Needs to handle the reverse move (ought implies can).
          *   Needs to evaluate 4 specific examples.
      *   **Tone:** Professional, pragmatic, clear, slightly empathetic to the pressure they're under.

  2.  **Deconstruct the Core Problem:**
      *   The core issue is the "Because." In policy docs, "because" usually tries to bridge the gap between *facts* (is) and *rules* (ought).
      *   Sometimes the "because" is empirical (data supports this rule).
      *   Sometimes the "because" is philosophical/ethical (this principle justifies this rule).
      *   Sometimes the "because" is decorative (we want this, but we're pretending there's a reason).
      *   The user got bogged down in a philosophy fight (Is-Ought vs. Naturalistic Fallacy). I need to clarify that simply without making them a philosopher.

  3.  **Clarify the Philosophy (Is-Ought vs. Naturalistic Fallacy):**
      *   *Is-Ought Gap (Hume):* You can't derive a moral obligation (ought) solely from a factual statement (is) without a moral premise. (e.g., "People lie" $\neq$ "People should lie").
      *   *Naturalistic Fallacy (Moore/Principia Ethica):* Often misused. Strictly, it's defining "good" in terms of natural properties (e.g., "Good = pleasure"). In common parlance, it's often confused with the Is-Ought gap.
      *   *The Colleague's Fight:* One person said "You're confusing Is-Ought with Naturalistic Fallacy." The other said "Naturalistic Fallacy isn't real."
      *   *Resolution:* For a policy doc, the specific label matters less than the *structure*. The real risk is claiming a *preference* is a *fact*.
      *   *Action:* I need to explain this simply in the response so the user feels armed for the next meeting.

  4.  **Develop the Checking Procedure (The "10-Minute Audit"):**
      *   Needs to be a flowchart or step-by-step list.
      *   *Step 1: The "Can" Check (Ought Implies Can).* If the model can't do it, the rule is useless. Address the user's specific question about the "reverse move."
      *   *Step 2: The "Because" Type.* Is it Empirical (Data), Functional (System Design), or Normative (Values)?
      *   *Step 3: The Link.* Does the "because" actually support the "should"?
      *   *Step 4: The Decision.* Approve, Rewrite, or Escalate.
      *   *Honesty Clause:* Explicitly mark where the user is making a value judgment.

  5.  **Apply the Procedure to the 4 Examples:**
      *   *Sentence 1 (Friendship/Politics):* Empirical claim. "71% said hurtful." Link: We want to avoid hurtful advice. *Verdict:* Solid, but check if "hurtful" is the only metric.
      *   *Sentence 2 (Lying/Assertion):* Philosophical/Functional claim. "Point of assertion..." *Verdict:* This is a definition of language, not necessarily an AI constraint. Risky if the AI's "point" is different (e.g., helpfulness). Needs clarification on *why* the AI adopts human assertion norms.
      *   *Sentence 3 (Transparency/Control):* Functional/Instrumental claim. Transparent $\rightarrow$ Predictable $\rightarrow$ Controllable. *Verdict:* Strong logic, but is "controllable" the goal? (Safety vs. Utility).
      *   *Sentence 4 (Autonomy/Kant):* Normative/Ethical claim. "End rather than means." *Verdict:* Pure value statement. High stakes. Needs leadership sign-off, not just policy approval.

  6.  **Address the "Reverse Move" (Ought Implies Can):**
      *   If someone says "We can't detect this," the rule becomes an *aspirational goal* or needs to be changed to "When the model detects X..."
      *   This is an infra/capability constraint, not a policy logic error.

  7.  **Drafting the Response:**
      *   *Intro:* Validate their position. It's a hard job.
      *   *Philosophy Quick Fix:* Clear up the fallacy fight immediately.
      *   *The Procedure:* Make it actionable. Use bolding for steps.
      *   *The Audit:* Run the 4 sentences through the procedure.
      *   *The "Reverse Move":* Address the capability constraint.
      *   *Closing:* Encouragement.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too complex for 10 minutes?
      *   *Fix:* Simplify the questions. Focus on "What kind of reason is this?" and "Does it hold water?"
      *   *Critique:* Did I answer the fallacy question clearly?
      *   *Fix:* Make a dedicated sidebar/section. "Is-Ought" = You can't get values from facts alone. "Naturalistic Fallacy" = Defining 'good' as a natural property (often misused). Tell them their colleague was technically right about the confusion, but the other colleague was right that it doesn't matter for the doc.
      *   *Critique:* Sentence 4 is Kantian. Do I need to name-drop Kant?
      *   *Fix:* No, keep it jargon-free as requested. Focus on "Value Claim."
      *   *Critique:* Sentence 2 is tricky. "Point of assertion" is a philosophical claim about language.
      *   *Fix:* Flag this as a "Definition Dispute." If the AI is a tool, does it have "assertions"?

  9.  **Final Polish:** Check tone. Ensure it sounds like a peer helping a peer, not a professor lecturing. Ensure the "Honesty" requirement is met (admitting where the procedure forces *them* to decide).

  **(Self-Correction on the Fallacy explanation):** I need to be careful. The Naturalistic Fallacy *is* a real thing in meta-ethics (Moore), but in common discourse, people use it to mean the Is-Ought problem (Hume). The colleague who said "it isn't a real fallacy" is likely referring to the fact that Moore's specific formulation is largely rejected or that the term is misused. The colleague who said "you're confusing them" is technically correct on terminology. I should advise the user to stop using the terms and start using "Fact vs. Value."

  10. **Final Review against constraints:**
      *   Fast? Yes.
      *   No jargon? Yes (explained simply).
      *   Honest about judgment calls? Yes.
      *   Run on 4 sentences? Yes.
      *   Address reverse move? Yes.
      *   Address fallacy names? Yes.

