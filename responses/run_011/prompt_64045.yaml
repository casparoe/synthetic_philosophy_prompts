answer: |-
  **Chapter Proposal: Static and Dynamic Divergence**
  **Disaggregating the Problem of Expected-Value Fanaticism**

  **1. Statement of the Question**

  The standard literature on expected-value fanaticism treats the phenomenon as a unitary problem: maximizing expected value compels agents to prioritize actions with negligible probabilities of astronomical payoffs over actions with high probabilities of modest payoffs. This chapter challenges that unity. It proposes that "fanaticism" is a label applied to two structurally distinct failures of decision theory, only one of which is addressed by current orthodoxy.

  The first structure (**Static Divergence**) is the familiar tail-event problem. A single act has a minute probability of triggering an outcome of such magnitude that the product dominates the expected value calculation. The second structure (**Dynamic Divergence**) involves no tail events. Here, an act has an ordinary probability of producing an ordinary value, but it alters the likelihood or efficacy of subsequent acts. If the sequence of influence does not decay sufficiently fast, the expected value of the initial modest step diverges via compounding, even though every individual link in the chain is mundane.

  The central research question is: **Are Static and Dynamic Divergence normatively equivalent, or do they constitute distinct pathologies requiring distinct remedies?** If they are distinct, the current consensus on how to tame fanaticism is incomplete, as it is calibrated almost exclusively to Static Divergence. If they are equivalent, Dynamic Divergence must be reducible to a Static case under some redescription (e.g., treating the entire sequence as a single low-probability trajectory). This chapter aims to demonstrate that they are distinct and that Dynamic Divergence survives the standard toolkit designed for Static Divergence.

  **2. Critique of Existing Diagnoses and Remedies**

  Current proposals for resolving fanaticism are engineered to handle Static Divergence. This chapter will argue that they leave Dynamic Divergence untouched or create new paradoxes when applied to it.

  *   **Discounting Small Probabilities:** Proposals to ignore probabilities below a certain threshold solve Static Divergence by fiat. However, in Dynamic Divergence, the probabilities at each step are ordinary (e.g., $p > 0.5$). Discounting the final outcome requires discounting the *chain*, which amounts to rejecting the compounding logic itself rather than the probability input. This remedy is inapplicable because the input probabilities are not "small."
  *   **Bounded Utility:** Imposing an upper bound on value blocks divergence in both cases. However, the justification for bounds usually relies on the implausibility of the *magnitude* of the outcome (Static). In Dynamic Divergence, the magnitude arises from accumulation, not a single state of affairs. Arguing against bounded utility because it blocks "good" long-term projects hits differently when the "good" is a sum of ordinary goods rather than a miracle.
  *   **Risk-Sensitivity:** Risk-weighted expected utility allows agents to down-weight high-variance prospects. Static Divergence is high-variance. Dynamic Divergence, however, can be constructed as a series of low-variance steps where the risk is diluted over time. A risk-averse agent might still accept the chain if each step looks safe locally, even if the global expectation is fanatical.
  *   **Imprecise Credences:** Representing uncertainty as intervals rather than point estimates can block Static Divergence by making the expected value undefined. In Dynamic Divergence, the credences at each step can be precise and well-calibrated. The divergence arises from the structure of the sequence, not the vagueness of the credence.

  The chapter will demonstrate that applying these remedies to Dynamic Divergence either fails to stop the divergence or forces the agent into dynamic inconsistency (rejecting the chain globally while accepting every step locally).

  **3. Methodology and Work Plan (16 Weeks)**

  The method is conceptual modeling followed by stress-testing against standard decision-theoretic constraints. I will construct two minimal formal cases and attempt to map one onto the other.

  **Month 1: Formalization and Model Building**
  *   **Weeks 1-2:** Construct the **Static Model**. A standard Pascal's Mugging variant. Define the threshold where expected value overrides common sense.
  *   **Weeks 3-4:** Construct the **Dynamic Model**. A sequential decision problem where Action $A_1$ increases the probability or payoff of $A_2$, and so on. The constraint is that $P(A_n)$ and $Value(A_n)$ must remain within "ordinary" bounds (no astronomical numbers, no microscopic probabilities). Divergence must arise solely from the infinite or non-decaying horizon of the sequence.
  *   **Deliverable:** Two formalized scenarios yielding equivalent expected values via different structural routes.

  **Month 2: The Collapsibility Test**
  *   **Weeks 5-6:** Attempt to redescribe the Dynamic Model as a Static one. Can the entire sequence be viewed as a single act with a tiny probability of success? If the probability of the chain continuing is ordinary at every step, the probability of the infinite chain usually drops to zero. I must show a case where the *expected sum* diverges even if the probability of infinite continuation is zero (a supertask or infinite series structure).
  *   **Weeks 7-8:** Attempt to redescribe the Static Model as a Dynamic one. Can the "astronomical value" be decomposed into a sequence of ordinary values? If so, does this make the Static problem more palatable?
  *   **Deliverable:** A proof or argument regarding whether the two models are isomorphic.

  **Month 3: Stress-Testing Remedies**
  *   **Weeks 9-10:** Apply **Probability Discounting** and **Imprecise Credences** to the Dynamic Model. Document exactly where the logic fails to engage with the problem.
  *   **Weeks 11-12:** Apply **Bounded Utility** and **Risk-Sensitivity**. Analyze whether these solutions impose costs on Dynamic Divergence that they do not impose on Static Divergence (e.g., penalizing long-term planning specifically).
  *   **Deliverable:** A comparative table of remedy efficacy across the two types.

  **Month 4: Synthesis and Drafting**
  *   **Weeks 13-14:** Draft the core argument. Focus on the normative implication: if Dynamic Divergence is real and distinct, we cannot solve fanaticism merely by tweaking our handling of small probabilities.
  *   **Weeks 15-16:** Revision and integration. Ensure the distinction is clear to a non-technical reader. Refine the failure conditions.
  *   **Deliverable:** Complete chapter draft.

  **4. Success and Failure Conditions**

  **Success:**
  A successful chapter demonstrates that Dynamic Divergence generates fanatical prescriptions (prioritizing the sequence over finite, certain goods) without invoking tail probabilities. It shows that at least two major remedies (e.g., probability discounting and imprecise credences) fail to resolve Dynamic Divergence while successfully resolving Static Divergence. This establishes that "fanaticism" is not a single bug but a class of bugs.

  **Failure:**
  The project fails if the Dynamic Model collapses into the Static Model under redescription. For example, if it turns out that for the expected value of the sequence to diverge, the probability of the sequence *actually completing* must be vanishingly small, then Dynamic Divergence is just Static Divergence in disguise (a tiny probability of an infinite chain). If this collapse is unavoidable, the distinction is merely notational, and the chapter must pivot to arguing that the *psychological* perception of the two cases differs even if the math is identical. A second failure mode is if the Dynamic Model requires physically impossible assumptions (e.g., infinite time or resources) that make it irrelevant to practical normative theory.

  **5. Feasibility Assessment**

  Four months is sufficient for this scope, provided I resist the urge to solve the decision-theoretic problems I identify. The goal is to diagnose the distinction, not to cure the disease.

  *   **Risk:** The formalization of the Dynamic Model could become mathematically bogged down. Infinite series in decision theory often lead to technical paradoxes (e.g., St. Petersburg variants) that distract from the philosophical point.
  *   **Mitigation:** I will keep the Dynamic Model minimal. I do not need a physically realistic cosmology; I need a logically possible decision tree that satisfies the "ordinary probability/value" constraint.
  *   **Risk:** The "collapse" objection (that Type 2 is just Type 1) is strong. Defending against it requires careful handling of probability limits.
  *   **Mitigation:** I will allocate Month 2 specifically to this objection. If the collapse argument proves decisive, I will pivot the chapter to "The Illusion of Distinction," which is still a valuable contribution, though it requires rewriting Month 3's remedy testing.
  *   **Verdict:** Feasible. The work is conceptual and argumentative rather than empirical. The timeline allows for one major pivot if the core hypothesis is refuted during the Collapsibility Test.
