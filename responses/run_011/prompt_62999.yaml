answer: |-
  Elena, a senior project manager at a mid-sized development firm, falsified soil stability reports to secure a contract for a luxury renovation, violating her professional code and deceiving the client, Marcus. The deception came to light when cracks appeared in the foundation; while the building is safe enough to inhabit under insurance mandates, the structural flaws have destroyed the home's resale value and ruined the specific custom design Marcus commissioned for his disabled daughter. Elena earns $120,000 annually with $50,000 in liquid savings. To fully restore Marcus's property value and rebuild the custom features, she personally needs to contribute $80,000 over the next two years, requiring her to sell her savings, defer her own child's college fund, and work unpaid overtime that jeopardizes her promotion track.

  All specifications are met, though grounding the asymmetry between prerogatives for promoting good versus repairing wrongs without begging the question was the hardest constraint to satisfy.

  **Walk-Through**
  Act consequentialism treats Elena's deception as a sunk cost; her only obligation is to maximize value from this moment forward. Given the assumption that each dollar directed to effective global health charities produces forty times the good of a dollar spent restoring Marcus's property, act consequentialism forbids her from prioritizing Marcus unless doing so prevents greater downstream harm (e.g., legal incarceration). However, the theory also accounts for diminishing marginal utility of sacrifice: if Elena sacrifices her career trajectory to pay Marcus, her future earning power—and thus her lifetime capacity to do good—collapses. Calculating this balance, act consequentialism demands she donate until the marginal cost to her agency equals the weighted marginal benefit to others; here, that cap is reached at $40,000, requiring her to liquidate half her savings and cancel a vacation, but preserving her promotion track and her child's college fund. Threshold deontology with an agent-centered prerogative yields a different verdict. The prerogative allows Elena to refuse demands to promote the general good if they cost her more than 10% of her income ($12,000), but this protection does not extend to duties of repair for wrongs she herself committed. This asymmetry holds because the authority to prioritize oneself derives from the neutrality of the good, whereas reparative duties arise from the normative significance of the past wrong itself, which binds the agent specifically rather than generally. Consequently, Elena owes Marcus a non-substitutable duty of full restoration ($80,000) that cannot be discharged by third-party compensation or traded off against greater aggregate good elsewhere. Under this view, Elena must liquidate all savings ($50,000) and divert $30,000 of future income via overtime, sacrificing her promotion and deferring her child's college fund. Even if the charitable multiplier drops from forty to five, act consequentialism still caps demands at the point where career destruction outweighs charitable gain (roughly $50,000), whereas the deontological duty remains fixed at the full cost of harm ($80,000). Thus, the threshold view requires substantially more of her income, career, and projects than act consequentialism does.

  **The Feature Doing the Work**
  The single feature driving this result is the non-substitutable character of the reparative duty, which ties the agent's obligation to the specific victim rather than to the abstract maximization of value. If this feature is removed—for instance, if the victim is anonymous rather than identifiable, or if the duty can be delegated to the insurer—the deontological demand collapses to the level of general aid, at which point the agent-centered prerogative would limit the demand to the 10% threshold, making deontology significantly *less* demanding than consequentialism.

  **Deontological Replies**
  First, a moderate deontologist might argue that the agent-centered prerogative should apply to reparative duties as well, protecting Elena's projects once the cost exceeds the moderate threshold. This reply fails to save the view because it concedes the core point: if the prerogative limits repair costs, the view loses its distinctive claim that wronging someone creates a special, binding tie that overrides general optimization, effectively collapsing into a consequentialist calculus with a side-constraint that can be bought off. Second, the deontologist might argue that the costs Elena faces are self-inflicted penalties rather than moral demands, and thus do not count toward the theory's demandingness. This assessment is mixed; while it distinguishes moral obligation from prudential consequence, it quietly concedes the point regarding resource allocation, as the theory still requires her to surrender the resources regardless of the label, leaving the charge that the theory claims more of her life intact.

  **Flagging Stipulations**
  The case stipulates that the agent-centered prerogative does not limit duties of repair; this is load-bearing because standard formulations of threshold deontology often apply prerogatives globally to all moral demands. To repair this without stipulation, the view must independently justify why violating a constraint generates a duty that bypasses the prerogative, perhaps by arguing that the prerogative is a license to opt out of *promoting* the good, but not a license to ignore *rights* one has actively violated. Additionally, the cap on act consequentialist sacrifice ($40,000 vs $80,000) relies on a specific model of career utility that could be contested; a minimal repair is to specify that Elena's work involves high-leverage social value (e.g., managing housing projects), making her career loss disproportionately costly in consequentialist terms.
