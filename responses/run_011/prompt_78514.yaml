  # Problem Sheet 2: Bell's Theorem and Locality

  **Time Allowed:** 75 minutes
  **Total Marks:** 25

  **Instructions:** Answer all parts of the question. You may take the following results as given:
  1.  **Quantum Prediction:** For the singlet state, the expectation value of the product of outcomes is $E_{QM}(\theta) = -\cos \theta$, where $\theta$ is the angle between measurement directions.
  2.  **Bell-CHSH Inequality:** For any model where joint probabilities factorise into local parts dependent only on local settings and a shared variable $\lambda$, the quantity $S$ defined below satisfies $|S| \le 2$.
  3.  **Quantum Violation:** At optimal settings, quantum mechanics predicts $|S| = 2\sqrt{2}$.
  4.  **CHSH Definition:** For settings $\alpha, \alpha'$ for Alice and $\beta, \beta'$ for Bob, let $S = |E(\alpha, \beta) + E(\alpha, \beta') + E(\alpha', \beta) - E(\alpha', \beta')|$.

  **The Model:**
  Consider a source emitting pairs of spin-½ particles. Alice and Bob choose measurement directions in a common plane, represented by angles $\alpha$ and $\beta$. Outcomes are $A, B \in \{+1, -1\}$. Let the hidden variable $\lambda$ be distributed uniformly over $[0, 2\pi)$, independently of the settings. Define **Model M** by:
  $$A(\alpha, \lambda) = \begin{cases} +1 & \text{if } \cos(\lambda - \alpha) \ge 0 \\ -1 & \text{otherwise} \end{cases}$$
  $$B(\beta, \lambda) = \begin{cases} -1 & \text{if } \cos(\lambda - \beta) \ge 0 \\ +1 & \text{otherwise} \end{cases}$$
  Let $E_M(\alpha, \beta)$ denote the expectation value of the product $A \cdot B$ over $\lambda$.

  **The Extract:**
  Below is an extract from a student's answer regarding Model M and Bell's theorem. Evaluate the four numbered claims within it.

  > 1. "Model M reproduces the quantum-mechanical predictions for the singlet state: when the two directions coincide it gives perfect anticorrelation, when they are at right angles it gives zero correlation, and when they are opposite it gives perfect correlation."
  > 2. "I evaluated the CHSH quantity S at the usual optimal settings ($\alpha = 0, \alpha' = \pi/2, \beta = \pi/4, \beta' = -\pi/4$) and obtained $|S| = 2$, which does not exceed the Bell bound. Model M therefore respects Bell's theorem, and its existence shows that the theorem cannot after all rule out local hidden variables."
  > 3. "Model M cannot be used to signal: each side sees +1 and −1 with probability one half, whatever the other side chooses. Since locality just means the impossibility of superluminal signalling, M is local, and the impossibility of signalling is all that Bell's theorem could ever have established."
  > 4. "In any case, M is deterministic, and the derivation of the Bell inequalities presupposes determinism. A stochastic variant of M, in which $\lambda$ fixes only the probabilities of the two outcomes, would evade the theorem entirely, because the inequalities constrain deterministic models."

  **Questions:**

  **(a)** Derive the correlation function $E_M(\theta)$ for Model M as a function of the angular separation $\theta = |\alpha - \beta|$ (for $\theta \in [0, \pi]$). Use this to verify the three specific values claimed in Claim 1. **[6 marks]**

  **(b)** Determine the angular separation $\theta$ at which Model M departs most from the quantum prediction $E_{QM}(\theta)$, and calculate the exact magnitude of this departure. **[4 marks]**

  **(c)** Evaluate Claim 2. Is the student's calculation consistent with your results? Does the conclusion drawn about Bell's theorem follow? **[5 marks]**

  **(d)** Evaluate Claim 3. Explain the relationship between the no-signalling condition and the locality condition required for the derivation of Bell inequalities. **[5 marks]**

  **(e)** Evaluate Claim 4. Does the derivation of Bell inequalities require determinism as an independent assumption? Explain why or why not. **[5 marks]**

  ***

  # Model Answer

  **(a)**
  Due to rotational symmetry, $E_M$ depends only on $\theta = |\alpha - \beta|$. Set $\beta=0, \alpha=\theta$. $A = \text{sgn}(\cos(\lambda-\theta))$ and $B = -\text{sgn}(\cos(\lambda))$. The product $AB$ is $-1$ when the cosines have the same sign, and $+1$ when they have opposite signs.
  On the interval $[0, 2\pi)$, $\cos(\lambda) > 0$ for length $\pi$. The interval where $\cos(\lambda-\theta) > 0$ is shifted by $\theta$. The overlap of two intervals of length $\pi$ shifted by $\theta$ is $\pi - \theta$. Thus, the cosines have the same sign (both positive or both negative) over a total length $2(\pi - \theta)$. They have opposite signs over length $2\theta$.
  The expectation is the average of the product:
  $$E_M(\theta) = \frac{1}{2\pi} \left[ (+1)(2\theta) + (-1)(2(\pi - \theta)) \right] = \frac{4\theta - 2\pi}{2\pi} = \frac{2\theta}{\pi} - 1.$$
  Checking Claim 1:
  1.  Coincide ($\theta=0$): $E_M(0) = -1$ (Perfect anticorrelation). Correct.
  2.  Right angles ($\theta=\pi/2$): $E_M(\pi/2) = 0$ (Zero correlation). Correct.
  3.  Opposite ($\theta=\pi$): $E_M(\pi) = +1$ (Perfect correlation). Correct.
  While the specific points match, the function is linear, whereas quantum mechanics is cosine.

  **(b)**
  We maximize the difference $D(\theta) = |E_M(\theta) - E_{QM}(\theta)| = |(\frac{2\theta}{\pi} - 1) - (-\cos\theta)|$.
  Let $f(\theta) = \frac{2\theta}{\pi} - 1 + \cos\theta$. We seek critical points where $f'(\theta) = \frac{2}{\pi} - \sin\theta = 0$.
  This occurs at $\theta^* = \arcsin(2/\pi)$.
  The maximum departure is $f(\theta^*) = \frac{2}{\pi}\arcsin(\frac{2}{\pi}) - 1 + \sqrt{1 - \frac{4}{\pi^2}}$.
  Numerically, $\theta^* \approx 39.5^\circ$ and the departure is $\approx 0.21$. Model M fails to reproduce quantum correlations globally, despite matching at $0, \pi/2, \pi$.

  **(c)**
  The student's calculation of $|S|=2$ is arithmetically correct for Model M (a local model must satisfy $|S|\le 2$). However, the conclusion is defective. Bell's theorem states that *no* local hidden variable model can reproduce *all* quantum predictions. Model M is indeed a local hidden variable model, which is why it satisfies the inequality. However, as shown in (b), it fails to match the quantum predictions empirically. Its existence does not show Bell's theorem fails to rule out local variables; rather, it confirms the theorem: to satisfy the inequality, the model had to deviate from quantum mechanics. The theorem rules out local variables *that reproduce quantum statistics*, not local variables per se.

  **(d)**
  The premise that Model M is no-signalling is correct; the marginal probability for Alice is $\int A(\alpha, \lambda) d\lambda / 2\pi = 0$, independent of $\beta$. However, the claim that "locality just means the impossibility of signalling" is false. Bell Locality (or Factorizability) requires $P(A,B|a,b,\lambda) = P(A|a,\lambda)P(B|b,\lambda)$. No-signalling is a weaker condition derived from Bell Locality by averaging over $\lambda$. One can construct no-signalling models that violate Bell inequalities (like QM). Bell's theorem establishes that nature violates Bell Locality, not merely that it allows signalling. Since M is no-signalling but satisfies Bell inequalities, it demonstrates that no-signalling is insufficient to guarantee Bell Locality.

  **(e)**
  Claim 4 is incorrect. The derivation of Bell inequalities does not presuppose determinism. It assumes Bell Locality (Factorizability) and Measurement Independence. Determinism is not an independent axiom; if one assumes perfect anticorrelation (as in the singlet state) alongside Bell Locality, determinism follows logically. However, the CHSH inequality holds for stochastic local models just as it does for deterministic ones. Replacing the deterministic response functions of M with stochastic probabilities fixed by $\lambda$ would still result in a factorisable model, which must satisfy $|S| \le 2$. Therefore, stochasticity does not evade the theorem; only abandoning Locality or Measurement Independence can do so.

  ***

  # Marking Scheme

  **Total:** 25 Marks

  **Part (a) [6 Marks]**
  *   **2 marks:** Correct identification of integration regions (overlap of cosine positive regions).
  *   **2 marks:** Correct derivation of linear function $E_M(\theta) = \frac{2\theta}{\pi} - 1$.
  *   **2 marks:** Correct verification of the three specific values ($-1, 0, +1$).
  *   *Error:* Using QM formula $-\cos\theta$ instead of deriving M's function (-4 marks).
  *   *Error:* Arithmetic error in integration (-2 marks).

  **Part (b) [4 Marks]**
  *   **2 marks:** Correct differentiation and identification of $\theta = \arcsin(2/\pi)$.
  *   **2 marks:** Correct substitution and exact value for the magnitude of departure.
  *   *First Class:* Explicitly notes the departure proves M is empirically inadequate despite Claim 1's partial success.
  *   *Second Class:* Finds the number but fails to contextualize it as a failure of the model.

  **Part (c) [5 Marks]**
  *   **2 marks:** Confirms $|S|=2$ is consistent for a local model.
  *   **3 marks:** **Crucial Distinction:** Explains that satisfying the inequality implies the model is local, but failing to match QM (shown in b) means it is not a counterexample to Bell's Theorem. Bell's theorem rules out *local models that match QM*.
  *   *Second Class Error:* Agrees with the student that Bell's theorem is "ruled out" or "weak" because a local model exists. (Max 2/5).
  *   *First Class:* Clearly distinguishes between theoretical consistency (M satisfies CHSH) and empirical adequacy (M does not match Nature).

  **Part (d) [5 Marks]**
  *   **2 marks:** Confirms M is no-signalling (marginals are 1/2).
  *   **3 marks:** **Crucial Distinction:** Distinguishes No-Signalling (operational) from Bell-Locality/Factorizability (ontological/probabilistic). Explains that Bell's theorem targets the latter. No-signalling is necessary but not sufficient for Bell-Locality.
  *   *Second Class Error:* Equates locality with no-signalling. Claims Bell's theorem is only about signalling. (Max 2/5).
  *   *First Class:* Explains that QM is no-signalling but violates Bell-Locality, whereas M is no-signalling and satisfies Bell-Locality, proving the concepts are distinct.

  **Part (e) [5 Marks]**
  *   **2 marks:** States determinism is not an independent assumption.
  *   **3 marks:** **Crucial Distinction:** Explains that CHSH applies to stochastic local models. Determinism can be derived from perfect correlation + Locality, but stochasticity does not allow evasion of the inequality.
  *   *Second Class Error:* Claims Bell's theorem assumes determinism. Claims stochastic models can violate CHSH while remaining local. (Max 2/5).
  *   *First Class:* Notes that "stochastic local" models are still constrained by the factorisation condition, which is the true source of the inequality.

  **General Grading Notes:**
  *   **First Class (18-25):** Consistently distinguishes between the *assumptions* of the theorem (Locality, Independence) and the *empirical claims* (QM predictions). Recognizes Model M as a local model that fails empirically, rather than a counterexample to the theorem. No reliance on historical narrative.
  *   **Second Class (11-17):** Correct math, but conceptual confusion on the implications. May accept the student's claim that Bell's theorem is weakened by Model M. May conflate no-signalling with locality.
  *   **Third Class/Fail (0-10):** Significant mathematical errors or fundamental misunderstanding of Bell's theorem (e.g., "Bell proved signalling is impossible").
