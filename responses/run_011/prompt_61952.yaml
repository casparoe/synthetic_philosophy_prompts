  You're a philosopher of physics who has taught Bell's theorem to grad students many times. Please think carefully — first brainstorm a short list of the candidate notions of locality actually in play and how they logically relate (which one implies which), and only then answer. No citations or reading list: I'm working offline and couldnt look anything up anyway.

  Here's my problem. I get the rough shape of the result — singlet correlations violate a Bell inequality, so something has to go. But I keep hitting a wall when I try to say what the *something* is, because I realized I'd been using two different notions of locality without keeping them apart. So I made up labels:

  - signal-local: nothing you do to your own setting can change the marginal statistics on the other wing, so no message goes faster than light.
  - screen-local: there's some complete-enough description of the shared past of the two wings such that, conditional on it, the two outcomes are statistically independent — the past screens them off in the ordinary common-cause sense.

  QM looks signal-local to me and not screen-local. Fine. But then people tell me that what the theorem actually targets is neither of my two, it's a stronger condition, local causality, and that the live question is whether you surrender parameter independence or outcome independence. I can follow the definitions mechanically; I can't see the conceptual geography.

  So: where exactly does my screen-local fall short of local causality? My guess is that local causality is a constraint on the probabilities of *everything* in a spacetime region given a complete specification of its past light cone, not merely a demand that one particular correlation have a common cause, and that's why it still bites on someone who says "I never wanted a common cause, I'm not a realist about outcomes to begin with." Is that right? And if so, what is the extra content doing — is it a claim about physical processes, or a methodological/explanatory requirement that a theory be screen-off-able?

  The bit I really don't get: if outcome independence fails but parameter independence holds, signalling is still impossible, so in what sense is anything spooky happening? People say a failure of outcome independence is still genuine physical nonlocality because the complete state back in the overlap doesn't fix what happens out here — but I want to understand why "your probabilities weren't nailed down by the past" is supposed to be a fact about distant influence rather than just a fact about the incompleteness of your description.

  And finally: does the whole edifice collapse if you deny there's any agent-independent such thing as a complete specification of a region (the QBist-ish move)? Is that a third notion of locality, or a denial that the condition is even well-defined?

  Please use the concrete spin-1/2 singlet setup throughout. Minimal formalism, but be exact about which probability claims are being asserted and which are being denied at each step.
