answer: |-
  ## The Fairness Diagnostic: Utility Arrears Edition

  This tool is designed to separate tangled arguments about fairness into distinct, named positions. It uses the utility-arrears scenario you described. There are no technical terms in the questions. Answer based on what you would actually do in the room, not what sounds best in a policy paper.

  ### The Diagnostic

  **1. The Tie-Breaker**
  Two households apply. Both get a risk score of 60% (meaning the model thinks there is a 60% chance they will fall behind again). Household A is from a neighborhood with high historical shut-off rates. Household B is from a neighborhood with low historical shut-off rates. You have funding for only one.
  *   **A.** Fund Household A. The high-risk neighborhood needs the protection more, and the score might be underestimating their struggle.
  *   **B.** Fund Household B. A 60% risk is a 60% risk. If the model says they are equal, treat them equal.
  *   **C.** Flip a coin. The model isn't perfect, and picking based on neighborhood feels like profiling.

  **2. The Dirty Label**
  You discover that the "shutoff" history used to train the model is partly because the utility company used to send crews more aggressively into Household A's neighborhood than Household B's. The risk isn't just about the household; it's about the utility's past behavior.
  *   **A.** Stop using "shutoff" as the target. Find a new measure of need that doesn't depend on the utility's past actions.
  *   **B.** Keep using "shutoff," but adjust the scores for Household A's neighborhood to account for the aggression.
  *   **C.** Keep using "shutoff" as-is. We are predicting what *will* happen, not what *should* happen. The utility's aggression is part of reality.

  **3. The Small Neighborhood**
  There is a third neighborhood, Household C. Only 200 people live there. The data is so sparse that any rate you calculate for them is basically a guess.
  *   **A.** Apply the same rules to them as everyone else. If the data is noisy, that's an unfortunate fact, not a reason for special treatment.
  *   **B.** Give them the benefit of the doubt. Assume their risk is lower than the noisy data says so they don't get locked out.
  *   **C.** Exclude them from the automated scoring entirely. Handle their applications manually because the numbers can't be trusted.

  **4. The Two Bosses**
  The Caseworker wants to prevent shut-offs at all costs (hates denying help). The Auditor wants to prevent waste (hates funding people who won't actually shut off). They both use your list.
  *   **A.** Optimize the list for the Caseworker. It's worse to deny help than to waste a little money.
  *   **B.** Optimize the list for the Auditor. A number that doesn't mean what it says is a lie, and we can't fund based on lies.
  *   **C.** Publish two lists or show the cost of each error. Let the humans argue about the trade-off; don't hide it in the math.

  **5. The Mistake**
  The model makes an error. In Neighborhood A, it falsely flags people as high risk (False Positive). In Neighborhood B, it falsely clears people as low risk (False Negative).
  *   **A.** These error rates must be equal. It is unfair for one group to suffer more false alarms than the other.
  *   **B.** The total amount of help must be equal. I don't care about the error rates if the end result is balanced.
  *   **C.** The errors should match the actual risk. If Neighborhood A is riskier, they will naturally have different error rates.

  **6. The Adjustment**
  You notice that using a single cutoff score funds far fewer people from Neighborhood A than Neighborhood B, even though A has more need.
  *   **A.** Lower the cutoff score for Neighborhood A until the funding rates match.
  *   **B.** Keep the cutoff the same. Changing it means treating people differently based on where they live.
  *   **C.** Change the model inputs so the scores come out equal without changing the cutoff.

  **7. The Meaning**
  What does the "60%" score actually represent to you?
  *   **A.** A promise. If I say 60%, then out of 100 people I score 60%, about 60 of them must fail, regardless of group.
  *   **B.** A ranking. It just tells me who is riskier than whom. The exact number doesn't matter as long as the order is right.
  *   **C.** A suggestion. It's one input among many. The final decision is human, not mathematical.

  **8. The Limit**
  You are told that you cannot have equal error rates, perfect calibration, and equal funding rates all at once. The math forbids it.
  *   **A.** Then the model is broken. Don't use it until it can do all three.
  *   **B.** Pick the one that matters most (usually calibration) and accept the gaps in the others.
  *   **C.** Get close enough. The math is strict, but the real world is messy. If it's near-fair, ship it.

  ***

  ### The Scoring Key

  Tally your answers. Your dominant letter pattern points to your position. Most people will have a mix; look for the cluster.

  **Mostly A (The "Gap Is The Wound" Camp)**
  *   **Leaf Name:** *The Repairer*
  *   **Core Belief:** The historical gap is the injustice. Any metric that takes those base rates as given inherits the sin.
  *   **Stance:** Prioritizes equal outcomes or benefit of the doubt (Q1-A, Q6-A). Willing to adjust scores to fix historical wrongs (Q2-B).
  *   **Conflict:** Clashes with Calibrationists. Believes "fairness" requires active correction of base rates.

  **Mostly B (The "Number Is The Truth" Camp)**
  *   **Leaf Name:** *The Calibrator*
  *   **Core Belief:** A score that doesn't mean what it says is a lie. If you say 60%, it must be 60% for everyone.
  *   **Stance:** Prioritizes calibration over equal error rates (Q5-C, Q7-A). Rejects group-adjusted cutoffs (Q6-B).
  *   **Conflict:** Clashes with Repairers. Believes treating individuals as group members is the real sin (your friend's position).

  **Mostly C (The "Show The Costs" Camp)**
  *   **Leaf Name:** *The Broker*
  *   **Core Belief:** Prediction is the wrong frame. This is a resource allocation problem with trade-offs.
  *   **Stance:** Wants to expose the costs of errors to stakeholders (Q4-C). Views the score as a suggestion, not a verdict (Q7-C).
  *   **Conflict:** Clashes with everyone who thinks the math can solve the ethics.

  **Specific Combinations (Nuanced Leaves)**

  *   **Q2-A + Q7-C:** *The Label Critic.* ("Your Target Is Broken"). You believe the fight is pointless because the outcome variable is contaminated. Don't fix the model; fix the definition of success.
  *   **Q3-A + Q5-C:** *The Deflationist.* ("Close Enough Is Good Enough"). You acknowledge the small-sample noise but think worrying about it is paralysis. You accept theoretical impossibility for practical sufficiency.
  *   **Q1-C + Q6-B:** *The Group-Blind Individualist.* ("See The Person"). You think grouping people by neighborhood is the category error. You would rather flip a coin than use demographic data to adjust.
  *   **Q4-A + Q6-A:** *The Equal-Error Advocate.* ("The Mistakes Must Be Shared"). You care less about the money and more that the pain of being wrongly denied is distributed evenly.
  *   **Q3-C + Q7-C:** *The Human-in-the-Loop.* ("Manual Override"). You believe that when data is thin (small N) or stakes are high, automation should recede.

  ***

  ### The Empty Rooms (Impossible Combinations)

  There are answer combinations that represent mathematical impossibilities. If you found yourself wanting to select these options simultaneously, your position is unstable.

  **1. The "Perfect Fairness" Trap**
  *   **Combination:** Q5-A (Equal Error Rates) + Q7-A (Perfect Calibration) + Q1-A (Different Base Rates implied).
  *   **Why it's Empty:** If two groups have different base rates of shutoffs (which Q1-A implies by acknowledging the neighborhood difference), you *cannot* have a model that is perfectly calibrated for both groups AND has equal error rates for both groups. The math does not allow it.
  *   **Diagnosis:** This is **Incoherent**. It assumes the model can be perfect. To fix this, you must admit one metric must break. Usually, Calibration breaks to save Error Rates, or vice versa.

  **2. The "Small Sample" Paradox**
  *   **Combination:** Q3-A (Treat small group like big group) + Q5-A (Equalize Error Rates).
  *   **Why it's Empty:** You cannot equalize error rates for a group of 200 people (Q3) with the same statistical confidence as a group of 20,000. The noise in the small group makes "equalizing" a guess, not a metric.
  *   **Diagnosis:** This is **Unstable in Practice**. It relies on a hidden assumption that the small group's data is as reliable as the large group's. If you hold this position, you are likely ignoring the variance in the small sample.

  **3. The "Blind Adjustment" Contradiction**
  *   **Combination:** Q6-B (Same Cutoff for Everyone) + Q1-A (Fund High-Base-Rate Group Preferentially).
  *   **Why it's Empty:** You cannot fund the high-risk neighborhood more (Q1-A) while keeping the cutoff score exactly the same for everyone (Q6-B), unless you change the scores themselves (Q6-C).
  *   **Diagnosis:** This relies on a **Hidden Assumption**: that you can change the *outcome* without changing the *rule*. It usually means the practitioner is secretly adjusting the scores (Q6-C) but calling it a fixed cutoff (Q6-B) to avoid political heat.

  ***

  ### The Seams (Limits of This Tool)

  This diagnostic cannot perfectly distinguish between two specific leaves. If you landed between these two, the tool admits it cannot see the difference.

  **1. The Deflationist vs. The Calibrator**
  *   **The Blur:** Both will often answer Q7-A ("The number must mean what it says"). The Deflationist just cares less when it's slightly off.
  *   **The Missing Question:** "At what percentage of deviation do you stop trusting the score?" The Calibrator says 0%. The Deflationist says "When it causes a political scandal." Without asking for a tolerance threshold, these two look identical.

  **2. The Label Critic vs. The Broker**
  *   **The Blur:** Both will answer Q2-A or Q4-C. Both agree the current setup is flawed.
  *   **The Missing Question:** "Who is responsible for fixing the label?" The Label Critic says "The Data Scientist must find a new target." The Broker says "The Policy Maker must define the cost." The tree treats these as the same outcome (don't use the current model), but the *action* required is different.

  **3. The Group-Blind vs. The Calibrator**
  *   **The Blur:** Both often choose the "Same Cutoff" option.
  *   **The Missing Question:** "Why do you choose the same cutoff?" The Calibrator does it to preserve the meaning of the probability. The Group-Blind does it because they believe looking at groups is morally wrong. The math is the same; the moral reasoning is opposite. This tool measures operational choices, not moral ontology.

  ### How to Use This in a Fight
  When you and your friend stall out, don't argue the math. Run the diagnostic.
  *   If he lands on **The Calibrator** and you land on **The Repairer**, stop arguing about "fairness." You are arguing about whether the base rate gap is a *fact to be predicted* or a *wound to be healed*.
  *   If you both land on **The Broker**, stop arguing about the score. Start arguing about the cost of a false negative.
  *   If one of you selects an **Empty Room** combination, point to the "Why it's Empty" section. That is where the energy is being wasted.
