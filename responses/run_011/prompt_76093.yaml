  Terms: *Consequentialism* (ethics judging acts only by outcomes), *Double Effect* (rule permitting foreseen harm if not intended as means), *Agency* (capacity to act and be responsible). *Intentional Structure* is a veto dimension; scores below 2 collapse the justification.

