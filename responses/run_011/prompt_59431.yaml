  **1. The Logical Space**

  Positions differ along four independent axes:

  1.  **Fixation:** What locks a state to a condition? (A) Internal Structure, (B) Causal History, (C) Current Environment.
  2.  **Error:** Can a successful state be incorrect? (A) Yes (misalignment possible), (B) No (success defines alignment).
  3.  **Substrate:** Does hardware matter? (A) Yes (biological/experiential required), (B) No (functional equivalence suffices).
  4.  **Status:** Is the description fact or tool? (A) Fact (truth-apt), (B) Tool (useful fiction).

  Distinct positions occupy specific cells: Biological Naturalism (Bio, Fact); Instrumentalism (Tool); Teleosemantics (History, Error); Covariance (Environment, Error); Functionalism (Internal, No Error); Eliminativism (Tool, No Fact).

  **2. Diagnostic Items**

  1.  **Border Validator:** A machine built to accept Coin A is shipped where Coin B is physically identical. It accepts B. (A) Its acceptance condition changed to B. (B) Its condition remains A; it fails to distinguish.
  2.  **Dual Register:** Identical chips in System 1 (stores one value) and System 2 (stores two). (A) Capacity differs by system. (B) Capacity fixed by chip.
  3.  **Broad Sensor:** Designed for Dogs, fires for Wolves. Task succeeds on both. (A) Detects Dogs (sometimes wrong). (B) Detects Dog-Or-Wolf (never wrong).
  4.  **Distant Match:** Model describes Neutron Stars without causal contact. (A) Matches Stars. (B) No match possible.
  5.  **Swamp Copy:** Duplicate created instantly in vacuum. No history. (A) Conditions match original. (B) Conditions empty until used.
  6.  **Selected vs. Random:** System A selected for task. System B random but works. (A) Conditions identical. (B) Conditions differ due to history.
  7.  **Stateless Sorter:** Device sorts correctly but resets between inputs. (A) Holds data. (B) No persistent state exists.
  8.  **Retraction:** System labels "X", acts correctly, but changes label if queried. (A) Initial label was error. (B) Condition depends on query context.
  9.  **Prediction:** Physics and Goal-models predict equally well. Goal-model unused. (A) Goals are real. (B) Goals are fictions.
  10. **Inorganic Peer:** System matches human behavior. Trusted source says no inner experience. (A) Conditions valid. (B) Conditions empty without experience.
  11. **Probabilistic Indicator:** State correlates with object 90% of time. (A) Indicator exists. (B) Noise too high for indicator.

  **3. Scoring Key**

  **Commitments:**
  *   **Fixation (Items 1, 4, 5, 6):** A=Internal/Role, B=History, C=Environment.
  *   **Error (Items 3, 8, 11):** A=Realism (Misrepresentation possible), B=Instrumentalism/Functionalism (Success defines correctness).
  *   **Substrate (Item 10):** A=Functionalism, B=Biological/Phenomenal.
  *   **Status (Item 9):** A=Realism, B=Instrumentalism/Eliminativism.

  **Decision Tree:**
  ```
  START -> Item 9 (Status)
  |
  +-- B (Tool) -> Item 10 (Experience)
  |    +-- A (Valid) -> LEAF: Instrumentalism (Dennett)
  |    +-- B (Empty) -> LEAF: Eliminativism
  |
  +-- A (Fact) -> Item 10 (Substrate)
       +-- B (Bio/Exp Required) -> Item 3 (Error)
       |    +-- A (Possible) -> LEAF: Biological Naturalism (Searle)
       |    +-- B (Impossible) -> LEAF: Phenomenal View
       |
       +-- A (Hardware Agnostic) -> Item 1 (Fixation)
            +-- A (Internal) -> LEAF: Internal Role (Functionalism)
            +-- B (History) -> Item 6 (Selection)
            |    +-- A (Irrelevant) -> LEAF: Covariance View
            |    +-- B (Required) -> LEAF: Teleosemantics
            +-- C (Environment) -> LEAF: Covariance View
  ```

  **4. Unoccupied Cells**

  *   **Substrate: Bio + Status: Tool.** *Unattractive.* Restricting useful fictions to biology lacks motivation; fictions usually apply wherever prediction works.
  *   **Fixation: History + Error: Impossible.** *Incoherent.* Historical functions define norms; if norms exist, violation (error) is possible.
  *   **Fixation: Internal + Substrate: Bio.** *Unexplored.* Rare to tie conditions to neurons specifically without invoking experience; usually functionalists deny bio-specificity.

  **5. Inseparable Leaves**

  *   **Teleosemantics vs. Covariance:** Both require external fixation and allow error. Datasheets show behavior, not evolutionary history. *Separation:* Requires design logs proving selection pressure vs. mere correlation.
  *   **Biological Naturalism vs. Phenomenal:** Both require biology/experience. Datasheets show function, not qualia. *Separation:* Requires first-person report (impossible for machines) or neurobiological proof of consciousness.
  *   **Instrumentalism vs. Eliminativism:** Both treat descriptions as tools. *Separation:* Requires ontological commitment query (Item 9 nuance); often indistinguishable in practice.

  **6. Incoherent Patterns**

  *   **Pattern:** Status: Fact + Error: Impossible + Fixation: History.
      *   **Conflict:** History implies norms; norms imply violation.
      *   **Fix:** Reverse Item 3 (Allow Error).
      *   **Nearest Position:** Teleosemantics.
  *   **Pattern:** Status: Tool + Substrate: Bio.
      *   **Conflict:** Why restrict fiction to biology?
      *   **Fix:** Reverse Item 10 (Accept Any Hardware).
      *   **Nearest Position:** Instrumentalism.
  *   **Pattern:** Status: Fact + Fixation: Internal + Error: Possible.
      *   **Conflict:** Internal structure alone rarely supports misrepresentation without external norms.
      *   **Fix:** Reverse Item 1 (Accept External Fixation).
      *   **Nearest Position:** Covariance View.

  **Usage Note:** Administer items blindly. Do not reveal axes until scoring. Patterns landing in "Unoccupied" or "Incoherent" cells indicate mixed commitments requiring clarification before debate proceeds.
