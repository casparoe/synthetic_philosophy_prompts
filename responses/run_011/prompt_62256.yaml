  3.  **Address Question 1: Talking Past Each Other & Substantive Disagreement:**
      *   *Who talks past whom?* Camp 1 (Modelers) talks past Camp 3 (Empiricists). Camp 1 says "It's a definition," Camp 3 says "It's false." Camp 2 (Paradox/Self-undermining) talks past Camp 4 (Epistemic weakening). Camp 2 says "CKR breaks on deviation," Camp 4 says "You don't need full CKR."
