      *   *Claim 2: Counterfactual robustness.* (Psychological/Behavioral view). Real agents actually reason this way, or would if they thought hard enough.
      *   *Claim 3: Normative closure.* (Philosophical/Prescriptive view). Rational agents *ought* to satisfy this; if they don't, they aren't rational (or the theory doesn't apply).
      *   *Assessment:* This is a strong partition. It maps well onto the "Four Camps" described in the prompt.
