      *   *Can it be ended?* No. It's a methodological schism.
      *   *Why?* Because the goal of game theory is contested. Is it math? Psychology? Philosophy?
      *   *What is the argument for?* It's about the *domain of applicability*. The argument determines which tool to use for which problem.

  7.  **Address Question 5: Fairness of Empirical Evidence:**
