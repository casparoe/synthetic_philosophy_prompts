      *(Self-Correction during drafting)*: Wait, on the Stakeholder vs. Sortition. Dewey criticized "interest group liberalism." He wanted the *public* to emerge. Sortition forces a mini-public. Stakeholder assembly reinforces existing divisions. Dewey would prefer Sortition *provided* they deliberate. But the Stakeholder argument (proportional to consequences) sounds very Deweyan ("indirect consequences"). However, Dewey wanted those consequences *perceived* and *organized* into a public, not just represented by lobbyists. Sortition is the mechanism to *form* the public. I will stick with Sortition but emphasize the deliberative requirement.

      *(Refining the Objection)*: The user knows RCTs. They know the limitations. The objection should be about whether the *method* of inquiry (RCTs) is appropriate for *moral* inquiry. Dewey valued science, but he valued moral science. If the "effect estimates" strip the qualitative experience, it's not Deweyan.

