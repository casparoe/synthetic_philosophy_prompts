prompt: |-
  I've lurked on rationalist comment threads for years and read way too many big-history takes, but last weekend two friends argued about this in my kitchen and I honestly could not tell who was winning. Neither of them is me — I mostly just kept the coffee coming — and I'd like a referee. Neither is a professional philosopher, both are smart, neither is a strawman.

  Topic: whether Sapiens-style grand narratives explain anything or are dressed-up just-so stories.

  (1) Rae opened with the claim that Harari's core move — Sapiens beat everything else because we cooperate flexibly in huge numbers by believing in shared fictions (gods, money, nations, limited liability companies) — is unfalsifiable for precisely the stretch of time it's meant to explain. Beliefs don't fossilize. So any evidence of large-scale cooperation gets retrodicted as "they must have had a shared myth," and any absence of it gets explained as "their myths didn't scale." Which makes the fiction thesis a dormitive virtue: the shared fiction just is the cooperation, redescribed in mental terms.

  (2) Sam said fine, but that charge is a boomerang. The materialist default — grain surplus produced hierarchy — is no more observable for deep prehistory, and Graeber and Wengrow's counter-narrative, where people consciously try out seasonal authority and then walk away from it, requires you to read intentions into arrangements too. If unfalsifiability sinks Harari it sinks the whole genre, critics included, and Rae hasn't earned the right to pass judgment from inside the same boat.

  (3) Rae said the asymmetry is in burden, not method. Harari writes as though he's explaining, and people downstream actually run predictions off the mechanism (imagined orders will keep holding us together). A polemic saying your story of inevitable linear progress is a myth isn't in the prediction business, so it doesn't inherit the same obligation. She added: the one time this story got operationalized into something testable — the moralizing-high-gods hypothesis — the big cross-cultural database work came out backwards, with gods who punish immoral behavior showing up after societies got huge rather than before, and then people spent years arguing about how the coders had defined a moralizing god in the first place. So the testable version failed, which is at least weak evidence about the untestable version.

  (4) Sam: two problems. The gods result is soft given the coding fight, so it can't carry much weight in either direction. And gods are a tiny slice of what counts as a fiction — money, land title, corporate personhood, human rights need no deity — so a result about gods can't touch the general thesis. As for burden, "writes as though he's explaining" is a fact about marketing, not about epistemology.

  (5) Rae: then say what's left. Strip out the gods and you land on "large-scale anonymous cooperation needs institutions, and institutions need shared beliefs about who or what counts as what." That's the social-ontology material on status functions and imagined communities with the serial numbers filed off and pushed back fifty thousand years. Acceptable as synthesis, but the distinctive claim — that this is the thing Sapiens has and chimps and Neanderthals don't — is where all the explanatory weight was sitting, and that's the part nobody can cash out.

  (6) Sam conceded novelty in kind but said novelty was never the claim; the claim is about scope and about which factor does the causal work. And Sam said Rae's own move concedes the point: if the thesis really is a known mechanism with independent support from a separate literature, it isn't a just-so story, because a just-so story is defined by having no support beyond the phenomenon it was invented to fit.

  Both walked away sure they'd won. Please adjudicate move by move: for each of (1)–(6), say whether it lands, partially lands, or fails, and why — then say who's more right overall. Two things I couldn't settle on my own: does Sam's boomerang in (2) actually neutralize the just-so charge, or does Rae's burden asymmetry in (3) survive it? And is Rae right in (5) that retreating to "it's not novel" guts the thesis, or is Sam right in (6) that independent support is exactly what separates a mechanism from a story? Also flag anything both of them are missing — I have a vague sense they're using "explains" in two different senses and talking past each other, but I couldn't of said which senses.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Two friends (Rae and Sam) argued about Yuval Noah Harari's *Sapiens* and grand historical narratives (specifically the "shared fictions" thesis vs. materialist/alternative accounts). The user acted as a referee/coffee-provider and wants an adjudication.
      *   **Task:** Evaluate moves (1) through (6) as "lands," "partially lands," or "fails," with reasoning. Then determine who is more right overall.
      *   **Specific Questions to Address:**
          *   Does Sam's boomerang (2) neutralize the just-so charge, or does Rae's burden asymmetry (3) survive?
          *   Is Rae right (5) that retreating to "it's not novel" guts the thesis, or is Sam right (6) that independent support saves it?
          *   Flag anything both are missing (specifically regarding different senses of "explains").
      *   **Constraints:** Neither friend is a strawman; both are smart. The tone should be analytical, fair, and philosophically grounded (given the "rationalist comment threads" context).

  2.  **Deconstruct the Arguments:**

      *   **Rae's Core Position:** Harari's "shared fictions" thesis is unfalsifiable, acts as a dormitive virtue (circular explanation), and fails when tested (e.g., moralizing gods). It's a just-so story.
      *   **Sam's Core Position:** All deep history is unfalsifiable (materialism included). Harari's thesis aligns with social ontology (independent support). Even if not novel, it identifies the *causal factor* (scope/scale).

      *   **Move (1) Rae:** Unfalsifiability charge. Beliefs don't fossilize. Retrodiction ("they must have had myths"). Dormitive virtue (fiction = cooperation).
      *   **Move (2) Sam:** Boomerang. Materialism (grain) is also unobservable deep in prehistory. Graeber/Wengrow also read intentions. If unfalsifiability sinks Harari, it sinks critics.
      *   **Move (3) Rae:** Burden asymmetry. Harari claims to *explain/predict*. Critics (Graeber) just deconstruct. Empirical test (moralizing gods) failed (gods come *after* size).
      *   **Move (4) Sam:** Gods data is soft/debatable. Gods $\neq$ all fictions (money, corps exist without gods). "Writes as though explaining" is marketing, not epistemology.
      *   **Move (5) Rae:** Reduction. Strip gods -> "institutions need beliefs." This is just social ontology (Searle/Anderson) pushed back. The *distinctive* claim (Sapiens vs. Neanderthals) is the explanatory weight, and that part is uncashable.
      *   **Move (6) Sam:** Concedes lack of novelty in kind. Claims scope/causal work is the point. If it has independent support (social ontology), it's not a just-so story.

  3.  **Evaluate Each Move:**

      *   **(1) Rae:** *Partially Lands.* The unfalsifiability charge is strong regarding *specific* prehistoric beliefs. The dormitive virtue charge is sharp (cooperation *is* the evidence for the fiction). *However*, it ignores that we have archaeological proxies for belief (burial rites, art, ritual sites). It's not *totally* black box.
      *   **(2) Sam:** *Lands.* This is the strongest philosophical point. Historical materialism is also a macro-narrative relying on inference to the best explanation. If the standard is "direct observation," all deep history fails. The "tu quoque" holds regarding the *methodology* of grand narratives.
      *   **(3) Rae:** *Partially Lands.* The burden asymmetry is real. Explanatory claims carry more weight than deconstructive ones. The "moralizing gods" data (Norenzayan et al.) is a significant empirical hit against a specific version of the thesis. *However*, Harari's "fictions" are broader than "moralizing gods," so the refutation is partial.
      *   **(4) Sam:** *Lands.* Crucial distinction. Harari's "fictions" include secular institutions (money, law). Refuting the "Big God" hypothesis doesn't kill the "Shared Fiction" hypothesis. Also, the marketing vs. epistemology point is fair; we should judge the claim, not the blurb.
      *   **(5) Rae:** *Fails (mostly).* This is a "No True Scotsman" or "Moving the Goalposts" move by Rae. If the mechanism is robust (social ontology), applying it to deep history *is* explanatory, even if not novel. Saying "it's just Searle applied to caves" doesn't make it useless; it makes it theoretically grounded. However, she is right that the *unique Sapiens* claim is the weakest link.
      *   **(6) Sam:** *Lands.* This defines "just-so story" correctly (Kipling/Gould). A story with independent theoretical support (social ontology/psychology) is a hypothesis, not a just-so story. Conceding novelty isn't conceding defeat; synthesis is valuable.

  4.  **Synthesize the "Missing" Element:**
      *   They are talking past each other on "Explanation."
      *   Rae wants *Causal Mechanism* (X caused Y, distinct from Y).
      *   Sam is offering *Constitutive Explanation* (Y is made of X, understanding X helps understand Y).
      *   Also: *Prediction vs. Understanding.* Rae wants predictive power. Sam wants intelligibility.
      *   Also: *Proximate vs. Ultimate.* Harari mixes them.

  5.  **Drafting the Adjudication:**

      *   *Tone:* Impartial, analytical, slightly academic but accessible (rationalist-adjacent).
      *   *Structure:* Move-by-move analysis, then specific answers to the user's two questions, then the "missing sense" flag, then final verdict.

      *(Self-Correction during drafting)*: I need to be careful not to simply side with Sam because his philosophy of science is slightly tighter. Rae's skepticism is healthy. The "moralizing gods" point is a real empirical sting against Harari, even if Harari's definition is broader. I should acknowledge that Harari often *does* write pop-sci that overclaims, validating Rae's frustration, even if Sam wins the philosophical debate.

      *Refining Move (1):* Is it a dormitive virtue? "Opium makes you sleep because it has a dormitive power." "Cooperation happens because they believe in fiction." If "believing in fiction" is defined *only* by "cooperating," yes. But if "believing" has neural/behavioral correlates independent of the specific cooperation outcome, no. Rae assumes the former. Sam assumes the latter. I'll call it *Partially Lands*.

      *Refining Move (5) vs (6):* This is the crux. Is a non-novel mechanism applied to a new domain an explanation? Yes, in science (e.g., applying gravity to stars). Rae treats novelty as a requirement for explanation. Sam treats theoretical grounding as the requirement. Sam is right on philosophy of science, Rae is right on "pop science marketing." I will rule for Sam on the logic, but note Rae's point about "explanatory weight."

      *The "Missing Sense":* It's definitely *Causal vs. Constitutive*. Or *Prediction vs. Retrospective Intelligibility*. Harari provides a lens (constitutive), Rae wants a lever (causal/predictive).

  6.  **Final Review against constraints:**
      *   Did I answer (1)-(6)? Yes.
      *   Did I answer the two specific questions? Yes.
      *   Did I flag the missing sense? Yes.
      *   Did I pick a winner? Yes.

  7.  **Final Polish:** Ensure the distinction between "Just-So Story" (Gould) and "Inference to Best Explanation" is clear. Ensure the Graeber/Wengrow point is handled fairly (they are also constructing a narrative).

      *(Wait, one nuance on Move 3)*: Rae says the moralizing gods hypothesis failed. Sam says gods are a subset. This is key. Harari says "fictions," Norenzayan tested "moralizing gods." Sam is right that the test doesn't kill the whole theory, but Rae is right that it damages the *evidence base* for the theory. I will mark (3) as Partially Lands because the empirical sting is real, even if not fatal.

      *(Wait, one nuance on Move 5)*: Rae says "that's the part nobody can cash out." She means the *difference* between Sapiens and Neanderthals. We don't have Neanderthal "fiction" data. This is a strong point. Sam concedes novelty in kind but keeps scope. I need to weigh this. Sam's move is stronger philosophically, but Rae's is stronger empirically regarding the *specific* Sapiens claim. I'll give the edge to Sam on the definition of explanation, but acknowledge Rae's empirical constraint.

      *Decision:* Sam wins on philosophy of science/logic. Rae wins on empirical caution. Overall, Sam is "more right" about the nature of the argument, but Rae is "more right" about the quality of Harari's specific evidence. The prompt asks who is more right *overall* in the debate. Sam's defense holds up better structurally.

      *Let's write.*
answer: |-
  Here is the adjudication of the kitchen debate, move by move, followed by a ruling on the specific philosophical impasses and a final verdict.

  ### Move-by-Move Adjudication

  **(1) Rae: The Unfalsifiability & Dormitive Virtue Charge**
  **Verdict: Partially Lands.**
  Rae correctly identifies the epistemic hazard of deep-history psychology: mental states do not fossilize. Inferring "shared myths" from "large-scale cooperation" risks circularity if the only evidence for the myth is the cooperation itself. However, the charge of *total* unfalsifiability is too strong. Archaeology provides proxies for belief (ritual burial, non-utilitarian art, temple construction) that are distinct from cooperation metrics. If we found evidence of huge cooperation with zero ritual/symbolic artifacts, the theory would be strained. Rae overplays the "dormitive virtue" hand; "shared fiction" is a mechanistic claim about cognitive architecture, not just a synonym for "working together," even if the data is sparse.

  **(2) Sam: The Boomerang (Materialism is also unobservable)**
  **Verdict: Lands.**
  This is the strongest philosophical move in the debate. Macro-historical materialism (grain $\rightarrow$ hierarchy) relies on the same inferential chains as macro-historical idealism (myth $\rightarrow$ cooperation). Both posit unobservable causal mechanisms to explain observable structural outcomes in deep time. If the standard for "valid explanation" is direct observation of the causal link, *all* big history fails, including Graeber and Wengrow's intentionalism. Sam successfully defends the *genre* against Rae's methodological attack. You cannot reject Harari's method without rejecting the only tools available to study the Paleolithic.

  **(3) Rae: Burden Asymmetry & The Gods Data**
  **Verdict: Partially Lands.**
  Rae is right that positive explanatory claims carry a heavier burden than deconstructive critiques. She is also right that the "moralizing high gods" hypothesis (Norenzayan et al.) is a significant empirical sting. It suggests that complex religion is often a *consequence* of scaling, not the *cause*, which undermines the temporal direction of Harari's narrative. However, she overextends this result. As Sam will note, "gods" are a subset of "fictions." A failure of the religious mechanism does not strictly falsify the institutional mechanism (money/law), though it does weaken the inductive case for "belief precedes scale."

  **(4) Sam: Gods $\neq$ Fictions & Marketing $\neq$ Epistemology**
  **Verdict: Lands.**
  Sam correctly narrows the target. Harari's "imagined orders" explicitly include secular fictions (money, corporations, human rights) that function without supernatural agents. Refuting the "Big God" hypothesis leaves the "Shared Fiction" hypothesis intact. Furthermore, Sam is correct to separate the book's marketing ("This explains everything!") from its philosophical core ("Shared intentionality is a prerequisite for scaling"). We must judge the claim, not the blurb.

  **(5) Rae: The "Nothing New" Reduction**
  **Verdict: Fails.**
  Rae attempts to turn theoretical grounding into a weakness. She argues that if Harari is just describing standard social ontology (Searle, Anderson, etc.) applied to deep history, he hasn't explained anything *distinctive* about Sapiens. This is a category error. Applying a known mechanism to a new domain *is* explanation in science (e.g., applying Newtonian physics to stars). However, Rae lands a glancing blow on the specific claim of *human uniqueness*. We do not have evidence that Neanderthals *lacked* shared fictions, only that they lacked the specific *scale* of Sapiens. Harari's claim that "only we can believe in things that don't exist" is empirically shaky, but that is a flaw in Harari's anthropology, not in Rae's logic. Still, retreating to established theory saves the thesis from being a "just-so story," which is Sam's point.

  **(6) Sam: Independent Support vs. Just-So Stories**
  **Verdict: Lands.**
  Sam correctly defines a "just-so story" (in the Gouldian sense): a narrative constructed *post hoc* with no support other than fitting the data. If the "shared fiction" mechanism has independent support from cognitive science, game theory, and social ontology, it is a hypothesis, not a just-so story. Conceding that the mechanism isn't novel does not concede the debate; it strengthens the epistemic standing of the claim. Synthesis is explanatory work.

  ---

  ### The Two Sticking Points

  **1. Does Sam's Boomerang (2) neutralize the Just-So charge, or does Rae's Burden Asymmetry (3) survive?**
  **Sam wins this point.** Rae's burden asymmetry argument works only if there is an alternative method available that *doesn't* suffer from the same unfalsifiability. Since there isn't (all deep history is inference to the best explanation), the burden is equalized. You cannot demand Harari meet a standard of evidence that grain-surplus theories also cannot meet. However, Rae survives on the *empirical* front: the fact that the "gods" data runs backwards (scale $\rightarrow$ gods, not gods $\rightarrow$ scale) is a specific disconfirming instance that Harari's camp must address, even if it doesn't kill the whole theory. Sam neutralizes the *methodological* attack; Rae keeps the *empirical* attack alive.

  **2. Is Rae right (5) that retreating to "it's not novel" guts the thesis, or is Sam right (6) that independent support saves it?**
  **Sam wins this point.** Rae is conflating "novelty" with "explanatory power." A mechanism does not need to be newly discovered to be explanatory. If I explain a bridge collapse by citing gravity, I am not offering a novel theory, but I am offering an explanation. The definition of a just-so story hinges on *ad hoc* construction, not novelty. If the "shared fiction" mechanism exists in peer-reviewed social ontology literature independent of Harari, it is not a just-so story. Rae is right that it reduces Harari's "breakthrough" status, but Sam is right that it secures the thesis's validity.

  ---

  ### What Both Are Missing: Two Senses of "Explains"

  You sensed they were talking past each other. They are. They are using **Explanation** in two different registers:

  1.  **Rae wants Causal/Predictive Explanation:** She is looking for a lever. *If X (fiction), then Y (cooperation).* She wants to know if introducing the variable "fiction" allows us to predict outcomes or distinguish cases (e.g., why Sapiens succeeded and Neanderthals failed). For her, an explanation must carve nature at its joints in a way that allows for counterfactuals ("If they hadn't had the myth, would they still have cooperated?"). Because we can't run the counterfactual on deep history, she sees the explanation as empty.
  2.  **Sam wants Constitutive/Intelligibility Explanation:** He is looking for a lens. *Y (cooperation) is constituted by X (fiction).* He is arguing that understanding the *nature* of the cooperation (that it relies on symbolic status functions) makes the phenomenon intelligible, even if it doesn't allow for prediction. For Sam, the value is in correctly categorizing the ontology of the social reality, not in isolating a variable for a regression analysis.

  **The Missed Nuance:** Harari's book is marketed as (1) but functions as (2). Rae is attacking the marketing; Sam is defending the function. Harari provides a *phenomenology* of history (how it feels/is structured) but claims the authority of a *causal mechanics* of history (why it happened).

  ### Final Verdict

  **Sam is more right overall.**

  Rae wins on **empirical caution**: Harari often overclaims, the evidence for the "Sapiens vs. Neanderthal" cognitive divide is thinner than he implies, and the specific "moralizing gods" data does run counter to his timeline. She is the better skeptic.

  However, Sam wins on **philosophical coherence**. He correctly identifies that Rae's methodological critique would dismantle *all* deep history, not just Harari's. He correctly identifies that theoretical grounding (social ontology) protects the thesis from the "just-so" label. He correctly identifies that "fictions" are broader than "gods."

  Rae treats Harari's thesis as a failed scientific prediction. Sam treats it as a successful philosophical synthesis. Given that *Sapiens* is a work of popular macro-history (which is inherently synthetic and inferential), Sam's frame is the appropriate one for judging whether the book "explains" anything. It explains by making the structure of social reality intelligible, not by providing a falsifiable causal model of the Stone Age.

  **Advice for the kitchen:** Tell Rae she won the battle (Harari's evidence is often shaky), but tell Sam he won the war (the theory isn't nonsense, just standard social science applied ambitiously). Then make more coffee.
