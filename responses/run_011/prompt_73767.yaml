      *   *Claim 4: "You literally cannot form the thought."*
          *   **Status:** Defensible Simplification. It's not that you can't form the *words*, but you can't form the *content* without contradiction.
      *   *Claim 5: "And what can't be conceived is impossible, therefore nothing can exist unconceived, i.e. matter is a contradiction in terms."*
          *   **Status:** Wrong/Damaging. This is the crux. Berkeley argues against *unperceived matter*, but the leap from "inconceivable to me" to "metaphysically impossible" relies on his specific definition of "exist" (*esse est percipi*). The app makes it sound like a general logical rule, which is contentious. Also, "matter" is a specific target (substratum), not just "stuff outside minds."
      *   *Claim 6: "Berkeley thought this was decisive and named it himself, which is why every textbook calls it the master argument."*
