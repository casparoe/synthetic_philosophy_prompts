          *   *Critique:* The user says "There is no molecule that is the code table." This is technically true (no single molecule), but the *structure* of tRNA + synthetases *is* the physical instantiation of the table. The user's point holds: it's not a string *in* the DNA.
          *   *Potential Error:* "DNA polymerase... gene for DNA polymerase is in the DNA." True. "Ribosome... parts are transcribed from DNA." rRNA is transcribed, proteins are translated. True.
