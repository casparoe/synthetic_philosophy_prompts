answer: |-
  ### I. Testing Your Tentative Principle
  **Principle:** *History serves life insofar as it leaves the person able to act, and harms life insofar as it does not.*

  This is a strong Nietzschean baseline, but your own cases reveal it is insufficient. It captures the *psychological* dimension but misses the *deontological* (duty-based) dimension.

  *   **Cases 1, 2, 6, 10:** The principle works perfectly. Action = Good; Paralysis = Bad.
  *   **Cases 3, 4, 11, 12:** The principle works if we treat "community action" as the metric. Case 4 blocks a school (reduces action); Case 12 forbids alternatives (reduces intellectual action).
  *   **Cases 9, 10:** The principle works. One scholar acts/loves; the other is hollowed/incapable of love.
  *   **Case 13:** The principle predicts "Bad." A society incapable of forgetting is arguably incapable of beginning (as you noted).
  *   **The Failures:**
      *   **Case 7 vs. 8:** This is the fatal flaw. In both cases, the agent *retains* the ability to act (they go on with their lives). Your principle should verdict both "Fine." But you verdict 7 "Fine" and 8 "Not within rights." This proves your intuition tracks **obligation**, not just capacity.
      *   **Case 5:** The man causes pain (to himself/family). If "ability to act" is the only metric, this is Fine. But your principle cannot explain *why* the pain "does not count against it" without importing a value like *Truth* or *Justice* that overrides immediate well-being.
      *   **Case 11:** A lie binds the village. They can act. Your principle says "Fine." But a consistent truth-teller might worry this is a fragile foundation. (I will return to this).

  **Verdict:** Your tentative principle is necessary but not sufficient. It explains *pathology* (paralysis) but not *duty* (obligation).

  ---

  ### II. Candidate Principles

  To capture your verdicts, specifically the divergence in Case 8 and the nuance in Case 13, I propose two competing principles. They share a core but diverge on the source of value.

  #### Candidate 1: The Principle of Asymmetric Stewardship
  > **Statement:** Engagement with the past is virtuous when it acknowledges the agent's **moral position** relative to the harm or benefit inherited from that past.
  > *   **Clause A (The Victim's Right):** Those descended from victims have no obligation to engage traumatic history if it impedes their flourishing. (Motivated by Case 7).
  > *   **Clause B (The Beneficiary's Duty):** Those descended from perpetrators/beneficiaries have an obligation to engage that history, even at the cost of comfort, to prevent the erasure of injustice. (Motivated by Case 8).
  > *   **Clause C (The Limit of Duty):** Engagement becomes vicious if it destroys the agent's capacity for present love or action entirely. (Motivated by Case 6 and 10).

  #### Candidate 2: The Principle of Metabolic Plasticity
  > **Statement:** Engagement with the past is virtuous when the agent or community retains the **plasticity** to reshape the meaning of the past for future ends, and vicious when the past becomes rigid, coercive, or total.
  > *   **Clause A (Digestibility):** History must be "metabolized" (integrated into a living narrative) rather than "ingested whole" (allowed to dominate). (Motivated by Case 9 vs. 10).
  > *   **Clause B (Scale):** The scale of memory must match the scale of the community. Local myths bind villages; national myths coerce citizens. (Motivated by Case 11 vs. 12).
  > *   **Clause C (Forgetting):** A healthy engagement requires the right to forget or archive without constant confrontation. (Motivated by Case 13).

  ---

  ### III. Verdicts on the Hard Cases

  **Cases 9 & 10 (The Scholars)**
  *   **Asymmetric Stewardship:** Cannot distinguish them easily unless we know *what* they are studying. If it is neutral, both are Fine.
  *   **Metabolic Plasticity:** **Distinguishes them perfectly.** Case 9 is plastic (the scholar uses the tradition for life); Case 10 is rigid (the tradition consumes the scholar).
  *   **My Verdict:** Case 9 is Good; Case 10 is Bad. The object of study is irrelevant; the *orientation* of the scholar is everything.

  **Case 13 (The Total Archive)**
  *   **Asymmetric Stewardship:** Verdict **Good.** Justice demands nothing be hidden. The state owes the victims total truth.
  *   **Metabolic Plasticity:** Verdict **Conditional/Bad.** If the archive is *searchable* but not *mandatory*, it is a tool (Good). If the archive creates a culture where forgetting is impossible (a "panopticon of memory"), it prevents new beginnings (Bad).
  *   **My Verdict:** It is **Good** *only if* it remains an archive (passive resource) and does not become a curriculum (active coercion). A society must be able to *choose* not to look at the archive on a given day. If the archive haunts every public square, it becomes Case 12.

  ---

  ### IV. What the Principles Cannot Save

  A consistent application of these principles requires you to revise two of your gut reactions.

  **1. Case 11 (The Village Myth)**
  *   **Your Verdict:** Fine (it binds them).
  *   **Consistent Verdict:** **Dangerous/Not Fine.**
  *   **Argument:** Both principles value *truth* as a component of justice (Stewardship) or *plasticity* (Plasticity). A known lie is rigid. If the myth is ever challenged, the community fractures because its bond is fraudulent. Case 12 (National Curriculum) is just Case 11 with more power. If 12 is Bad because it forbids alternatives, 11 is Bad because it relies on a falsehood, even if voluntary.
  *   **Revision:** You should value *shared fiction* less than *shared interpretation of truth.* The village should celebrate a founding *value*, not a founding *event* they know didn't happen.

  **2. Case 5 vs. Case 6 (The Grandfather vs. The Country)**
  *   **Your Verdict:** You attribute the difference to "how it turned out" (action vs. shame).
  *   **Consistent Verdict:** The difference is **Scale of Identity.**
  *   **Argument:** In Case 5, the man corrects a specific lie about a specific person. He excises a tumor to save the body. In Case 6, the woman rejects *everything* (language, holidays, institutions). She burns the house to kill the rat.
  *   **Revision:** Case 6 is Not Fine not because she feels shame, but because she has conflated *inheritance* with *complicity.* A consistent principle demands she distinguish between the *tools* of the country (language, institutions) and the *sins* of the country. Rejecting the tools ensures the sins continue (by rendering her powerless).

  ---

  ### V. The Underlying Property

  You asked whether this is about knowledge, power, affect, or standing.

  It is **Standing.** Specifically, **Teleological Standing.**

  *   **Knowledge** is ruled out because Cases 1 & 2 involve the same knowledge with opposite values.
  *   **Power** is ruled out because Cases 7 & 8 involve the same power (to ignore) with opposite values.
  *   **Affect** is ruled out because Case 5 involves pain that is "Fine," while Case 6 involves shame that is "Not Fine."

  **Standing** refers to the agent's orientation toward time and morality.
  1.  **Temporal Standing:** Is the past the *master* (Cases 2, 4, 10) or the *servant* (Cases 1, 9) of the future?
  2.  **Moral Standing:** Does the agent stand in a position of *debt* (Case 8) or *trauma* (Case 7)?

  Your intuitions are tracking whether the agent is **authoring** the future using the past as material, or whether the agent is **being authored** by the past. However, you add a crucial moral caveat: some people *owe* their authorship to the past (perpetrator descendants) in a way others do not (victim descendants).

  ---

  ### VI. The Separating Case

  Here is a case where **Asymmetric Stewardship** and **Metabolic Plasticity** diverge.

  **The Case:**
  A descendant of slaveholders (Case 8 type) discovers the truth about their lineage. Engaging with this truth causes them severe clinical depression; they become unable to work, care for their children, or participate in civic life (Case 6 type paralysis). However, their silence would allow a specific, harmful falsehood about the family's wealth to persist, which currently benefits a local institution.

  *   **Asymmetric Stewardship Verdict:** **Engage.** The duty to justice (correcting the falsehood, acknowledging the debt) overrides the personal cost. The agent *owes* this disruption.
  *   **Metabolic Plasticity Verdict:** **Step Back.** If the engagement destroys the agent's capacity for life (depression, inability to care for children), the metabolism has failed. The past is poisoning the future. The agent should archive the truth but step away from active stewardship to preserve their vitality.

  **Resolution:**
  This is the tragic remainder. My recommendation is to prioritize **Metabolic Plasticity** with a caveat. If the agent breaks, they cannot serve justice. The solution is not to force the individual to self-destruct, but to **socialize the duty.** The descendant should transfer the burden to a broader community or institution capable of metabolizing the truth without collapsing. No single individual should be the sole vessel for historical atonement.

  ### Summary Recommendation
  Adopt a hybrid principle: **The Principle of Just Vitality.**
  *History serves life when it enables the agent to act justly in the present. It harms life when it induces paralysis OR when it evades a specific debt of justice owed by the agent's position. The scale of memory must never exceed the community's capacity to metabolize it without coercion.*

  This saves Case 8 (Duty), Case 7 (No Duty), Case 2 (Paralysis), and Case 12 (Coercion). It requires you to revise Case 11 (Lies are brittle) and Case 6 (Rejecting all inheritance is self-disarmament).
