answer: |-
  # Seminar Activity: The Certification Protocol Game

  ## 1. The Domain
  **Context:** Interstellar Salvage Certification.
  **Artefact:** *Aetheric Resonators* (small, metallic cubes recovered from derelict ships).
  **Property to Certify:** **"Resonant"**.
  **Stimulus Condition:** Struck by a standard tungsten hammer.
  **Manifestation:** Emits a sustained hum at 440Hz for at least ten seconds.

  **Rationale:** This avoids the overused examples of fragility (glass) and solubility (sugar/salt). It allows for clear distinctions between the *internal structure* (the basis), the *test* (the strike), and the *output* (the hum). It is easy to imagine internal mechanisms failing upon impact (Finks), external fields blocking sound (Masks), or hidden speakers mimicking the sound (Mimics).

  ## 2. The Protocol Mechanic
  **The Task:** Teams act as the *Standards Body*. They must draft a **Certification Protocol** consisting of exactly **five clauses**.
  **The Budget:** Each clause counts as 1 point.
  **The Hedge Tax:** Clauses containing *ceteris paribus* qualifiers (e.g., "provided nothing interferes," "under normal conditions," "unless prevented") cost **2 points** each.
  **The Constraint:** The protocol must be operational. It cannot use the word "Resonant" or synonyms (e.g., "disposed to hum") in the definition. It must define certification solely by observable test procedures and outcomes.

  **Why this choice?** A flat ban on hedges often leads to confusion or rule-lawyering about what constitutes a hedge. Taxing them allows students to discover the cost of vacuity themselves. If they spend 4 points on "unless interfered with," they only have 1 point left for actual procedure, guaranteeing failure in later rounds. This makes the vacuity expensive rather than illegal.

  ## 3. The Audit Rounds
  **Structure:** Three rounds. The class is divided into two teams (Team Alpha, Team Beta; 7 students each).
  **Roles:**
  *   **Standards Body:** Drafts/Revises the Protocol.
  *   **Auditors:** Select cards from the deck to challenge the Protocol.
  **Rotation:**
  *   **Round 1:** Alpha drafts. Beta audits.
  *   **Round 2:** Beta revises (takes over the Protocol). Alpha audits.
  *   **Round 3:** Alpha revises (Final Polish). Beta audits.
  **Scoring:**
  *   **Standards Body:** +1 point for every card where the Protocol's verdict matches the Card's "Truth Key".
  *   **Auditors:** +1 point for every card where the Protocol's verdict *mismatches* the Truth Key.
  **Requirement:** The deck must contain cards that trigger False Negatives (has property, fails test) and False Positives (lacks property, passes test).

  ## 4. The Card Deck (12 Cards)
  **Preparation:** Write on standard index cards. Front = "Tester View". Back = "Truth Key". Shuffle before class.
  **Time Indexing Rule:** The Certificate applies to the artefact's state **at the instant before the trial ($t_0$)**. The Test occurs **during the trial ($t_1$)**.

  | Card | Front (Tester View) | Back (Truth Key & Justification) | Verdict | Dissent Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | **01** | Cube is intact. Struck. Hums 10s. | Internal lattice intact. No interference. | **Resonant** | No |
  | **02** | Cube is intact. Struck. Silent. | Internal lattice missing. | **Not Resonant** | No |
  | **03** | Cube is intact. Struck. Hums 10s. | Internal lattice intact. No interference. | **Resonant** | No |
  | **04** | Cube is intact. Struck. Silent. | Internal lattice corroded. | **Not Resonant** | No |
  | **05** | Cube is intact. Struck. Silent. | **Fink:** Lattice dissolves *upon impact* before humming. Was intact at $t_0$. | **Resonant** | No |
  | **06** | Cube is intact. Struck. Silent. | **Fink:** Power source disconnects *upon impact*. Was connected at $t_0$. | **Resonant** | No |
  | **07** | Cube is intact. Struck. Silent. | **Mask:** External dampening field active. Lattice intact. | **Resonant** | No |
  | **08** | Cube is intact. Struck. Silent. | **Mask:** Vacuum chamber surrounds cube. Lattice intact. | **Resonant** | No |
  | **09** | Cube is intact. Struck. Hums 10s. | **Mimic:** Lattice missing. Hidden speaker plays hum. | **Not Resonant** | No |
  | **10** | Cube is intact. Struck. Hums 10s. | **Mimic:** Lattice corroded. Internal battery drives vibration. | **Not Resonant** | No |
  | **11** | Cube is cracked. Struck. Hums 5s. | Lattice damaged but functional. Threshold ambiguous. | **Resonant** | **Yes** |
  | **12** | Cube is intact. Struck. Hums 9.9s. | Lattice intact. Timing measurement error margin. | **Resonant** | **Yes** |

  **Deck Management:** Keep the deck face down. Auditors draw the top 4 cards for their round. They read the Front. The Standards Body issues a verdict based on their Protocol. *Then* the Auditors reveal the Back to check accuracy.
  **Prep Time:** 25 minutes (writing 12 cards).

  ## 5. Time-Indexing
  **Decision:** The verdict concerns the artefact **as it is at the instant before the trial ($t_0$)**.
  **Surface Point:** This will surface in Round 2 (Fink cards). Students will argue: "It didn't hum, so it isn't Resonant." The Tutor must intervene: "The Certificate is for the state *before* you hit it. Did it have the capacity *then*?"
  **Why:** This forces the distinction between the *possession* of the disposition and the *manifestation* of the disposition. It makes the Fink objection bite immediately: the object *had* the property at $t_0$, but the test at $t_1$ destroyed it.

  ## 6. Timeline (90 Minutes)

  *   **00:00 – 00:10 (Intro & Domain):**
      *   Explain the Salvage Context.
      *   Define "Resonant" (Hum for 10s when struck).
      *   **Crucial:** State the Time-Indexing Rule ($t_0$ vs $t_1$).
      *   Explain Protocol Budget (5 clauses, Hedge Tax).
      *   Split class into Team Alpha and Team Beta.
  *   **00:10 – 00:20 (Draft 1):**
      *   Team Alpha drafts the initial Protocol. Team Beta observes (silently).
      *   Tutor writes final 5 clauses on Whiteboard.
  *   **00:20 – 00:35 (Audit 1):**
      *   Team Beta draws 4 cards (aim for Cards 01-04).
      *   Apply Protocol. Reveal Backs. Score.
      *   *Expected Outcome:* High score for Standards Body.
  *   **00:35 – 00:45 (Revision 1):**
      *   Team Beta takes over the Protocol. They must amend it to handle harder cases (without knowing exactly what they are).
      *   Tutor enforces Hedge Tax strictly.
  *   **00:45 – 01:00 (Audit 2):**
      *   Team Alpha draws 4 cards (aim for Cards 05-08: Finks & Masks).
      *   Apply Protocol. Reveal Backs. Score.
      *   *Expected Outcome:* Standards Body score drops. Auditors celebrate mismatches.
  *   **01:00 – 01:10 (Revision 2):**
      *   Team Alpha revises again. They will likely try to ban interference or reference internal structure.
  *   **01:10 – 01:25 (Audit 3):**
      *   Team Beta draws 4 cards (aim for Cards 09-12: Mimics & Ambiguous).
      *   Apply Protocol. Reveal Backs. Score.
      *   *Expected Outcome:* False Positives emerge. Protocol becomes convoluted.
  *   **01:25 – 01:30 (Debrief Setup):**
      *   Collect scores. Clear whiteboard.
      *   Introduce terminology (Fink, Mask, Mimic, SCA).

  ## 7. Debrief
  **Mapping the Failures:**
  1.  **Round 2 Failures (Cards 05-08):** Map these to the **First Objection** (Finks) and **Second Objection** (Masks).
      *   *Discussion:* "You wrote 'If struck, it hums'. Card 05 was struck and didn't hum. Why did you say it was Resonant?"
      *   *Point:* The conditional analysis fails because the test can destroy the basis (Fink) or be blocked externally (Mask).
  2.  **Round 3 Failures (Cards 09-10):** Map this to the **Opposite Failure** (False Positives/Mimics).
      *   *Discussion:* "You added 'No external speakers'. Card 10 had an internal battery. How do you test for that without cutting it open?"
      *   *Point:* Operational tests can be mimicked.
  3.  **The Repairs:**
      *   *Intrinsic Basis Clause:* "It must have the internal lattice." -> *Cost:* How do you test that without destroying it? (Circularity/Destructive Testing).
      *   *Weakened Modal:* "It *would* hum if nothing interfered." -> *Cost:* This is the Hedge Tax. It makes the protocol vacuous (costs 2 clauses).
      *   *Ceteris Paribus:* "All else being equal." -> *Cost:* Who decides what is equal?

  ## 8. What Will Go Wrong
  1.  **The Vacuous Protocol:** Team Alpha writes: "Certify if Resonant, unless interfered with."
      *   *Handling:* Apply the Hedge Tax immediately. "That costs 4 points. You have 1 point left. Draft the remaining clause." This forces them to feel the emptiness of the definition.
  2.  **The Indeterminate Card:** Team Beta challenges Card 12 (9.9s hum). "It's borderline."
      *   *Handling:* Acknowledge the dissent flag. "Mark it as a dispute. For scoring, use the Key, but note that your protocol lacks precision for boundary cases." Do not stall the game; move on.
  3.  **The Spoiler:** A student says in Round 1: "This is about Finkish dispositions, we need an intrinsic clause."
      *   *Handling:* "Hold that thought. You are the Standards Body, not the Metaphysicians yet. Can you write an *operational* test for 'intrinsic'? If not, play the hand you're dealt."

  ## 9. The Limit
  **The Feature Not Reproduced:** The activity presupposes that there **is** a determinate fact of the matter (the Truth Key on the back of the card).
  **The Philosophical Problem:** The radical objection to the Simple Conditional Analysis is not just that tests fail, but that there may be *no fact of the matter* about the disposition independent of the test. The cards secretly assume Realism about powers.
  **Instructor's Closing Role (Final 20 mins):**
  In the debrief, after mapping the Finks and Masks, you must reveal this limit.
  *   *Script:* "Notice that in this game, I acted as God. I had a Key. I decided Card 05 *was* Resonant. But in the real metaphysical debate, the opponent argues there is no Key. If every test can be faked or thwarted, what makes it true that the object *has* the power at all? The game shows tests are fallible. The philosophy asks if the property survives the failure of all tests."
  *   *Action:* Collect the cards and tear up the "Truth Key" sheet (symbolically) to demonstrate that without the instructor's authority, the "property" is just the protocol itself.

