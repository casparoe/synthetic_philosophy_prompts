answer: |-
  The absent-minded driver problem presents a conflict between ex-ante planning and ex-action rationality. The standard objection argues that because the driver cannot distinguish intersections, he must adopt a uniform deterministic strategy, rendering the ex-ante optimal mixed plan irrational. I argue that introducing a randomizing device resolves this conflict by expanding the set of available global acts without violating the symmetry of information.

  ### 1. Reconstruction of the Objection

  The standard objection relies on the identity of informational states to restrict the driver's available actions. It can be reconstructed as follows:

  1.  **Symmetry Premise:** At any intersection, the driver's evidence is identical whether he is at the first or second intersection; therefore, rational consistency requires he adopt the same decision rule at both.
  2.  **Determinacy Premise:** A decision rule maps identical evidence to identical actions. Since the evidence is constant, the action must be constant across intersections.
  3.  **Option Restriction Premise:** The only actions available to the driver are deterministic physical maneuvers (Exit or Continue) guaranteed by his will alone.
  4.  **Payoff Comparison:** The global act "Always Continue" yields $c=1$. The global act "Always Exit" yields $a=0$.
  5.  **Conclusion:** Rationality requires "Always Continue." The mixed plan $p=2/3$ is not a genuinely available act and cannot be executed.

  My reply targets the **Option Restriction Premise**. I accept the Symmetry Premise and the requirement for identical decision rules. However, I deny that identical decision rules entail identical realized actions. A decision rule can be deterministic regarding a *procedure* (e.g., "Obey the device") while the realized actions vary stochastically due to the device's output. The driver decides identically at both intersections (to obey), but the physical acts differ.

  ### 2. The Positive Case: Symmetry and the Device

  The objection assumes the option set is exhausted by direct physical acts. However, the device allows the driver to select a global policy: "Activate device and obey output." This policy is a single, determinate decision made identically at every node, satisfying the Symmetry Premise. The variation in action arises from the device, not from a variation in the driver's will.

  When we evaluate the global acts available under this enlarged option set, the ranking changes:
  1.  **Always Exit:** Payoff $0$.
  2.  **Always Continue:** Payoff $1$.
  3.  **Obey Device ($p=2/3$):** Payoff $4/3$.

  The reasoning that supposedly forced the driver to continue with certainty now recommends obeying the device. The symmetry of information does not rule out stochastic policies; it merely rules out policies that condition on the intersection index. Since the device's output is independent of the intersection index, obeying it respects the symmetry constraint while accessing the higher expected value of the mixed plan.

  ### 3. The Relocation Counter

  A critic may argue the problem relocates: suppose the device displays EXIT. The driver now faces a choice: obey or override. The informational situation (at an intersection, seeing EXIT) is again identical at both nodes. Does symmetry not force him to either always obey EXIT or always override?

  If the driver adopts the policy "Override EXIT signals" (effectively "Always Continue"), the global payoff is $1$. If he adopts "Obey EXIT signals" (part of the mixed plan), the global payoff is $4/3$. The symmetry argument applies to the *policy* regarding the signal, not the signal itself. Since the policy "Obey Device" dominates "Override Device" ex-ante, the symmetry requirement licenses obeying the EXIT signal just as it licenses obeying the CONTINUE signal. The objection does not re-emerge because the ranking of global policies remains stable. The driver does not face a new dilemma at the node; he faces the execution of a previously ranked global commitment.

  ### 4. Local Computation and Indifference

  To verify stability, we compute the local expected payoffs at an intersection. Let $p$ be the probability of continuing prescribed by the plan. The probability of arriving at the first intersection is $1$. The probability of arriving at the second is $p$. The total probability of finding oneself at an intersection is $1+p$.

  The conditional credence of being at the first intersection ($X$) given arrival is:
  $$ P(X) = \frac{1}{1+p} $$
  The conditional credence of being at the second intersection ($Y$) is:
  $$ P(Y) = \frac{p}{1+p} $$

  We compute the expected payoff of Exiting now ($V_E$) versus Continuing now ($V_C$), assuming the driver obeys the device at any subsequent intersection.
  If he Exits now, he receives $a$ if at $X$, and $b$ if at $Y$:
  $$ V_E = \frac{1}{1+p}a + \frac{p}{1+p}b = \frac{a + pb}{1+p} $$

  If he Continues now, and is at $X$, he proceeds to $Y$ where he follows the plan (Exit w.p. $1-p$, Continue w.p. $p$). If he is at $Y$, he proceeds to the end (payoff $c$).
  $$ V_C = \frac{1}{1+p} \left[ (1-p)b + pc \right] + \frac{p}{1+p}c = \frac{(1-p)b + 2pc}{1+p} $$

  For the standard payoffs ($a=0, b=4, c=1$) and optimal plan $p=2/3$:
  $$ V_E = \frac{0 + 4(2/3)}{1 + 2/3} = \frac{8/3}{5/3} = \frac{8}{5} = 1.6 $$
  $$ V_C = \frac{(1/3)4 + 2(2/3)1}{5/3} = \frac{4/3 + 4/3}{5/3} = \frac{8/3}{5/3} = \frac{8}{5} = 1.6 $$

  The values coincide. At the ex-ante optimal $p$, the driver is locally indifferent. This defeats the action-stage objection if it claims there is a strict local incentive to deviate. If the objection claims merely that mixed acts do not *exist*, the computation shows that the local conditions for the mixed plan are consistent with rational choice at the node. The driver is not forced to deviate; he is permitted to randomize.

  ### 5. Generalization

  For arbitrary payoffs $a, b, c$, the ex-ante expected value is $V(p) = (1-p)a + p(1-p)b + p^2c$. Maximizing with respect to $p$:
  $$ \frac{dV}{dp} = -a + (1-2p)b + 2pc = 0 $$
  $$ -a + b - 2pb + 2pc = 0 \implies 2p(b-c) = b-a $$
  $$ p^* = \frac{b-a}{2(b-c)} $$
  The device-based policy strictly outperforms deterministic acts if $V(p^*) > \max(a, c)$. This holds when $b$ is sufficiently larger than $a$ and $c$, specifically when the gain from exiting at the second intersection outweighs the risk of exiting at the first or overshooting. The standard triple ($0, 4, 1$) satisfies this: $p^* = 4/6 = 2/3$, $V(2/3) = 4/3 > 1$.

  The reply fails if $c \geq b$. If continuing past the second intersection pays more than or equal to exiting at the second, the optimal $p$ becomes $1$ (Always Continue). In such cases, the device adds no value, as the deterministic act is already optimal. Similarly, if $a \geq b$, the optimal $p$ is $0$. The device is only useful when the optimal strategy is genuinely mixed.

  ### 6. Further Challenges

  **Challenge 1: Abdication of Agency.**
  One might argue that using a device outsources agency, rendering the choice irrational. A theory of rational choice should evaluate the agent's will, not a machine's output.
  *Concession:* It is true that the driver surrenders control over the specific outcome. However, rational choice theory routinely endorses committing devices (e.g., Ulysses contracts). If the goal is maximizing expected utility, and the device achieves what the will cannot (due to time inconsistency), employing it is instrumentally rational. The "decision" is the adoption of the policy, which remains fully agential.

  **Challenge 2: Proving Too Much.**
  If the objection holds, it eliminates behavioral strategies for all agents with imperfect recall. Yet, such strategies are fundamental to extensive game theory.
  *Concession:* This is a decisive reductio. If the symmetry argument forbids mixed strategies at information sets, it invalidates the Nash equilibrium concept in most dynamic games. Since game theory is robust, the objection must be false. The device is dialectically idle because the objection is already untenable on independent theoretical grounds. The device merely illustrates *why* the objection fails by making the mixed strategy physically explicit.

  ### 7. The Strongest Unanswered Objection

  The strongest objection I cannot fully answer concerns **Ex-Post Regret and Control**. While the device is ex-ante optimal, it exposes the driver to outcomes he knows are suboptimal in realization. If the device displays EXIT at the first intersection, the driver receives $0$. He knows that had he ignored the device, he would have received at least $1$ (by continuing to the end).

  My argument relies on the primacy of ex-ante expected utility. However, a theory of rationality might require that an agent never voluntarily enter a state where they possess knowledge that a different action would have yielded a better certain outcome. By obeying the device at the first intersection, the driver knowingly accepts $0$ when $1$ was causally accessible via "Always Continue." While the *policy* was optimal, the *execution* involves moments of guaranteed regret. My defense rests on the claim that rationality governs policies, not realized states. If one insists that rationality requires control over realized outcomes to avoid ex-post regret, the device solution fails. I concede that if rationality is defined by the absence of ex-post regret in every possible world rather than expected value maximization, the driver cannot rationally use the device. This reveals a fundamental tension between ex-ante planning and ex-post evaluation that the device illuminates but does not fully dissolve.
