answer: |-
  **Time:** 55 minutes **Marks:** 25
  **Essay Question**

  A municipal arts council adopts a grant rule requiring every funded project to file a one-page statement naming the specific political end the work is meant to serve. The Chair defends this bureaucracy by appealing to W.E.B. Du Bois's claim that all art is propaganda.

  **Chair:** "Du Bois taught us art is never neutral. Since it always advances a cause, artists should simply declare which cause they serve to ensure public accountability."

  Critic Elena Rostova objects. First, she argues that if *all* art is propaganda, the filing requirement adds no content and is pure bureaucracy. Second, she poses a transparency dilemma: a work that declares its end invites the audience to score it for compliance rather than to perceive it, while a work that hides its end is manipulative. Thus, a Du Boisian funder cannot have it both ways.

  Write an essay responding to Rostova. Is Du Bois committed to the council's rule? Clarify whether his claim that art is propaganda is descriptive, normative, or both, and what follows from each. Resolve or dissolve the transparency dilemma by distinguishing senses of "propaganda." Finally, explain how Du Bois's dual commitment—defending Black artists against charges of mere didacticism while rejecting art-for-art's-sake—complicates the Chair's use of his name.

  ***

  **Model Answer**

  The Chair's invocation of Du Bois relies on a category error that collapses the descriptive and normative dimensions of his aesthetics. To determine if Du Bois is committed to the council's rule, one must first distinguish what is meant by "propaganda." If the claim is purely descriptive—that all art inevitably persuades or advances some worldview—then Rostova's first objection holds: the filing requirement is redundant bureaucracy. Every artwork already serves an end; demanding a statement adds no political content, only administrative friction. However, Du Bois's claim is primarily normative. He argues not merely that art *does* persuade, but that Black art *ought* to advocate for truth and justice against racial slander.

  Consequently, Du Bois is not committed to the Chair's rule. The Chair assumes that because art serves a cause, the funder must catalogue that cause. But for Du Bois, the ethical weight lies in *which* truth is served and *who* determines it. The council's rule shifts the standard of judgment from the artist's integrity to the funder's approval. This violates the normative core of Du Bois's position: art is propaganda for liberation, not for bureaucratic accountability.

  Rostova's transparency dilemma dissolves once we distinguish between "propaganda" as covert manipulation and "propaganda" as honest advocacy. The dilemma assumes that declaring an end reduces art to a checklist (compliance) or that hiding it deceives the audience (manipulation). Du Bois rejects this binary. For him, declaring a commitment to racial justice does not invite compliance scoring; it frames the audience's perception toward a specific truth. The aesthetic experience is not ruined by knowing the end; it is deepened by understanding the stakes. The work is manipulative only if it lies about its purpose. A Du Boisian artist declares their end not to satisfy a bureaucrat, but to align the audience with the truth they are unveiling.

  Finally, the Chair's rule ignores the historical tension in Du Bois's work. He defended Black artists against the charge of didacticism—being reduced to sociological tools—while simultaneously rejecting art-for-art's-sake as a luxury denied to oppressed peoples. The council's rule risks reinstating the very didacticism Du Bois resisted. By forcing artists to name a "political end," the council treats the art as a vehicle for a pre-existing slogan rather than a mode of knowledge production. Du Bois wanted art to be judged as art, even while serving a political function. The Chair's policy suggests the political function supersedes the art.

  Ultimately, the crux is not whether art is propaganda, but who sets the standards by which that propaganda is judged. Du Bois's slogan was a shield against white critics who demanded Black art be apolitical; the Chair weaponizes it to demand Black art be accountable to the state. A competent reading sees that Du Bois's normativity protects the artist's right to define the cause, whereas the Chair's rule strips that right away. The transparency dilemma is resolved not by hiding ends, but by ensuring the declaration comes from the artist's conviction, not the funder's requirement.

  ***

  **Marking Scheme**

  1.  **Conceptual Distinction (5 marks):** Correctly identifies the difference between the descriptive claim (all art persuades) and the normative claim (art ought to serve justice).
      *   *Typical Error:* Treats "all art is propaganda" as a simple factual statement without ethical weight.
  2.  **Commitment Analysis (5 marks):** Argues Du Bois is *not* committed to the rule because it shifts evaluative power to the fander.
      *   *Typical Error:* Assumes Du Bois must support the rule simply because he supports political art.
  3.  **Redundancy Rebuttal (5 marks):** Acknowledges Rostova's first point holds if the claim is descriptive, but fails if normative.
      *   *Typical Error:* Dismisses the redundancy objection without engaging the descriptive/normative split.
  4.  **Dilemma Resolution (5 marks):** Dissolves the transparency dilemma by distinguishing honest advocacy from covert manipulation.
      *   *Typical Error:* Accepts the dilemma as unsolvable or argues artists should hide their ends.
  5.  **Historical Contextualization (5 marks):** Explains how the rule risks reducing art to didactic sociology, contradicting Du Bois's defense of aesthetic autonomy.
      *   *Typical Error:* Treats the context of Black art as biographical trivia rather than a philosophical constraint.

  ***

  **A/B Boundary Note**

  A competent (B-range) answer will successfully distinguish the descriptive and normative senses of propaganda and resolve the transparency dilemma logically. A first-class (A-range) answer will go further by identifying the underlying power dynamic: Du Bois's claim is about *who* gets to set the standards of judgment (the artist/community vs. the state/funder). The A answer recognizes that the Chair's rule reproduces the exact external policing Du Bois sought to escape, transforming a shield against critics into a tool for bureaucracy.
