answer: |-
  **Reader's Report**

  **1. Accuracy**
  Your characterizations are sufficiently accurate to bear the weight of your argument, though there is a risk of caricature in the service of setting up your own view.

  *   **Lewis:** You describe the Lewis-style analysis as defining convention via regularity in coordination problems where participants are indifferent among equilibria, with reasons to conform conditional on others conforming. In my own words: Lewis defines convention as a solution to a coordination problem where multiple stable outcomes exist (e.g., driving left or right), sustained by mutual expectations that others will conform to the same equilibrium. You have not conflated *what* conventions are with *reasons* they give; Lewis explicitly ties the reason to the expectation of coordination. Your critique holds: Lewis explains why I *have* a reason (to coordinate), but not why that reason survives when coordination is impossible (the empty street). This is not a misstatement; it is a legitimate limit of the coordination model.
  *   **Bicchieri:** You describe her account as treating norm-following as a conditional preference based on beliefs about others' compliance and sanctions. In my own words: Bicchieri distinguishes social norms from mere habits by requiring both empirical expectations (I believe others do this) and normative expectations (I believe others think I should do this). You correctly identify that her account is descriptive of psychological motivation, not normative of moral duty. You note the gap: explaining why I *do* follow norms does not explain why I *should*. This is accurate. No load-bearing misstatement here.
  *   **Hume:** You characterize Hume as viewing rules of justice as artificial, with content fixed by convention and authority derived from the utility of the whole scheme rather than each act. In my own words: Hume argues justice is not a natural virtue but an artificial construct developed to stabilize property and cooperation in conditions of scarcity; its moral force comes from the benefit of the entire system of rules, even if individual acts within that system (e.g., repaying a debt to a miser) produce no immediate utility. Your identification of the "gap" (system utility vs. act utility) is correct.

  **Verdict:** Your summaries are robust enough for the argument. The worry about conflating definition with reason is addressed by your explicit critique of Lewis on the "empty street" point.

  **2. The Central Vulnerability**
  Your Legibility condition collapses into a form of Rule-Utilitarianism unless you clarify the ontology of the "practice."

  You argue that on an empty street, Legibility drops out, and thus the obligation weakens or vanishes, yet you admit a "residue of unease." You define the wrong as "signal-degrading" — weakening a device whose value is aggregate. If the value is aggregate (statistical compliance), then an unseen violation still contributes to the statistical degradation if the agent is part of the population. If you claim the violation *only* matters when seen (Legibility), you are arguing that the practice exists only in its observation.

  *   **The Collapse:** If the wrong is degrading a statistical device, then every violation degrades it, seen or unseen. If you insist it only degrades when seen, you are arguing that the *signal* is the communication to an observer, not the statistical regularity itself. This makes the obligation dependent on the presence of an audience. This is indistinguishable from a Rule-Utilitarian calculation where the "rule" is "follow conventions when observed to maintain general trust."
  *   **The Distinction:** To distinguish this from Rule-Utilitarianism, you must argue that the duty is not to *maximize utility* but to *respect the standing of the practice*. A Rule-Utilitarian conforms because good consequences follow. You need to argue the agent conforms because the practice claims authority over them via Reliance and Reciprocity, and Legibility is merely the condition under which that claim is *activated*, not the source of the value.
  *   **Repair:** You must clarify whether "Legibility" means "observed by others" or "recognizable as a move in the game." If I cross alone at 3 AM, is my act legible *to me* as a deviation? If yes, Legibility holds, and your account avoids the "don't get caught" implication. If no, you must admit that on your account, unseen violations are morally neutral, which contradicts the "residue of unease" you cite in Section 1.

  **3. Overreach**
  The self-undermining exemption frame argument in Section 3 proves too much.

  You argue the visitor must conform not because the act is wrong, but because advertising the permission would degrade the frame for others. This generates a duty to maintain ignorance. If this logic holds, it applies to unjust conventions as well. If a visitor judges a local convention unjust (e.g., a discriminatory seating arrangement), your logic suggests they should conform secretly to avoid eroding the stability of the convention system for other visitors who might not recognize the injustice.

  *   **The Problem:** You create a duty to protect the *efficacy* of a convention even when the convention lacks moral authority. This privileges social stability over moral truth.
  *   **Repair:** You must limit the "exemption frame" to *arbitrary coordination conventions* (jaywalking, queueing) where the only value is stability itself. You cannot extend this to conventions with moral content (tipping, dress codes with moral significance). In Section 4, you attempt this by distinguishing unjust transfer conventions, but Section 3 implies the duty to conform exists *before* the justice assessment.
  *   **Specific Fix:** Explicitly state that the "duty concerning the dissemination of a doctrine" applies only where the convention is morally neutral. If the convention is unjust, the duty to resist overrides the duty to preserve the frame. Without this limitation, your argument obliges complicity in unjust systems for the sake of semantic stability.

  **4. Originality Assessment**
  Ranking your three load-bearing claims from most standard to most novel:

  1.  **Scheme-defecting vs. Signal-degrading (Most Standard):** This is a well-trodden distinction in game theory and legal philosophy (free-riding on distributive schemes vs. undermining public goods). It is solid, but not folklore-free. It is the safest part of your paper but carries the least novelty.
  2.  **Duty about the publicity of a permission (Novel):** The claim that one can have a real permission to act but a duty not to advertise it is distinct. It moves the normative locus from the act to the meta-norm. This is not standard in convention literature, which usually focuses on the act itself.
  3.  **Non-participants have distinctive standing to abstain from unjust transfer conventions (Most Novel):** The claim that outsider status *licenses* abstention where insider status requires critique is counter-intuitive and fresh. Usually, outsiders are expected to comply *more* strictly (when in Rome). Arguing that lack of Reciprocity removes the burden of justification for deviation is your strongest original contribution.

  **5. Objections**
  A hostile reader will press these two objections:

  *   **Objection 1: The Ontology of the Unseen Practice.**
      *   *The Charge:* You claim an unseen violation on an empty street is "signal-degrading." If no one sees it, and it doesn't alter the statistical regularity significantly (one car vs. aggregate), how is the signal degraded? If you say it degrades the *agent's* relationship to the practice, you rely on a virtue-ethics claim you haven't established. If you say it degrades the *statistical* signal, you admit Legibility is irrelevant, contradicting your tripartite account.
      *   *Concession Point:* Concede that for *signal-degrading* conventions, the obligation is weaker than for *scheme-defecting* ones, and perhaps vanishes entirely when Legibility is zero. Do not try to save the "residue of unease" if it requires metaphysical gymnastics about unseen practices. It is stronger to admit the obligation is contingent on observation than to stretch the definition of "degradation."

  *   **Objection 2: The Visitor's Burden.**
      *   *The Charge:* You place the burden of preserving the "exemption frame" on the visitor. Why is it not the locals' responsibility to update their frame if visitors frequently deviate? You argue the visitor must conform to prevent the frame from breaking. This imposes a cost on the ignorant to protect the knowledge of the locals.
      *   *Concession Point:* Concede that this obligation is prudential or social, not strictly moral. The visitor isn't "wrong" in a moral sense to deviate; they are merely inviting sanction or confusion. Distinguish between "moral wrong" and "social friction." If you claim it is a moral duty to preserve the frame, you must explain why the visitor owes the locals this cognitive labor.

  **6. Structure**
  For a 7,000-word paper, the current balance is uneven.

  *   **Expand Section 2 (The Graded Account):** This is the core engine. You introduce Reliance, Legibility, and Reciprocity but do not test them against counter-examples. You need to show how these three conditions interact. What if Reliance is high but Reciprocity is low? (The visitor case). What if Legibility is high but Reliance is low? You need to flesh out the "graded" nature. Does missing one condition reduce the obligation by 33%, or does it collapse the obligation entirely? You say it "tracks how many," but you don't demonstrate the calculus.
  *   **Reduce Section 1 (Standard Answers):** This is a standard literature review. It takes up space but doesn't advance your positive view. Tighten the critiques of Lewis and Bicchieri. You can assume the reader knows these accounts fail the "empty street" test; you don't need to labor the point.
  *   **Split Section 4 (Unjust Conventions):** This section belongs in a second paper. It introduces "Justice" as a trump card over "Convention." This changes the topic from "When do conventions bind?" to "When does justice override convention?" It complicates your Visitor argument (does the visitor abstain from unjust tipping because of Non-Reciprocity or because of Justice?). Keeping it risks muddying your core thesis. Move it to a brief coda acknowledging limits, or cut it entirely to focus on the neutral conventions (queueing, jaywalking) where your theory is strongest.

  **Summary Recommendation:**
