answer: |-
  The two decisive requirements are **Misrepresentation** (the theory must explain how a state can be *about* X when X is absent without collapsing into causal covariance) and **Ontogenetic Fixation** (the theory must explain content acquired via learning or cultural transmission without relying solely on species-history); the single camp prejudice you should discard is the **Swampman Intuition** (the assumption that historical lineage is constitutive of content rather than merely explanatory of function).

  ### The Spec for Naturalizing Content

  **1. Phenomena to Explain (The "Must-Haves")**
  *   **Misrepresentation (The Error Problem):** A state must be able to mean *fly* while being caused by a BB. If meaning is just causal correlation, everything that causes the state is part of the meaning (fly-or-BB). A theory fails if it cannot distinguish veridical from non-veridical conditions naturalistically.
      *   *Status:* **Non-negotiable.** Without this, you don't have content, just covariance.
  *   **Determinacy (The Disjunction/Quus Problem):** Why does the state mean *fly* and not *fly-or-BB*? Why does "plus" mean plus and not *quus*? The theory must select one content over incompatible alternatives using only natural facts.
      *   *Status:* **Non-negotiable.** Indeterminacy renders the theory explanatorily idle.
  *   **Empty/Negative Content:** How to represent *Santa*, *phlogiston*, or *there is no food*.
      *   *Status:* **Human-Specific.** If your theory is for general animal minds (frogs, birds), this is goalpost-moving. A frog does not represent *non-existence*. Demand this only if theorizing human propositional attitudes.
  *   **Normativity:** Content entails correctness conditions (oughts). A belief *ought* to match the world; a desire *ought* to be satisfied.
      *   *Status:* **Non-negotiable but Dangerous.** This is the hardest to naturalize. If you reduce normativity to statistical normality, you lose the "ought." If you keep it robust, you risk violating naturalism.

  **2. Distinctions to Maintain**
  *   **Original vs. Derived Content:** Mental states have original intentionality; maps and words have derived. A theory fails if it makes mental content depend on prior semantic facts (homunculus problem).
      *   *Status:* **Non-negotiable.**
  *   **Direction of Fit:** Belief (world-to-mind) vs. Desire (mind-to-world). Teleosemantics handles this well (consumer vs. producer functions); causal theories struggle.
      *   *Status:* **Non-negotiable** for explaining action.
  *   **Vehicle vs. Content:** The physical state (vehicle) vs. what it represents (content).
      *   *Status:* **Non-negotiable.**

  **3. External Constraints**
  *   **Evolutionary Biology:** Cannot contradict selected-effect functions where they exist.
      *   *Status:* **Non-negotiable** for teleological theories.
  *   **Learning Theory/Ethology:** Must accommodate classical conditioning, habituation, and social learning.
      *   *Status:* **Non-negotiable** (see "The Wrinkle" below).

  ### The Jointly Unsatisfiable Subset (The Trilemma)

  You cannot simultaneously satisfy **Strong Naturalism**, **Robust Normativity**, and **Determinacy** without residue.

  1.  **Strong Naturalism:** No intentional or normative primitives allowed in the base facts.
  2.  **Robust Normativity:** Content must imply genuine correctness conditions (not just statistical regularity).
  3.  **Determinacy:** Content must be specific enough to guide behavior (fly, not fly-or-BB).

  **The Trade-off:**
  *   **Causal/Informational Theories** keep Naturalism and Determinacy but sacrifice Normativity (error becomes just "atypical cause").
  *   **Teleosemantics** keeps Naturalism and Normativity (via function) but struggles with Determinacy (indeterminacy of function assignment) and Novelty (see below).
  *   **Interpretivism** keeps Normativity and Determinacy but sacrifices Naturalism (content depends on an interpreter's stance).

  **For your specific interests (Ontogeny):** You face a second trilemma: **Phylogenetic Fixity**, **Ontogenetic Plasticity**, and **Historical Essentialism**.
  *   If content is fixed *only* by species history (Phylogenetic Fixity + Historical Essentialism), you cannot explain the urban bird or lab mouse (loss of Plasticity).
  *   If content is fixed by learning (Plasticity), you must either abandon Historical Essentialism (content doesn't need deep history) or argue learning mechanisms themselves are the selected traits (complexifies Phylogenetic Fixity).
  *   **Resolution:** You must give up **Historical Essentialism** (the Swampman intuition). Content is fixed by the *current* functional role of the state within a system designed to learn, not necessarily by the history of that specific token state.

  ### The Single Most Eliminating Requirement

  **Misrepresentation.**
  This is the filter that kills naive causal theories (Dretske I, Fodor's early work). If your theory makes meaning identical to causal correlation, you cannot have error. Every theory you read is essentially a patch to solve this while keeping Naturalism. Teleosemantics survives this best by using *function* to normatively constrain cause. However, for your purposes, Misrepresentation combined with **Ontogenetic Plasticity** is the real killer. Standard Teleosemantics (Millikan) often fails here because it ties content to *ancestral* success conditions. A moth at a streetlight represents *moon* (ancestral) or *light source* (current)? If the theory says *moon*, it fails to explain the behavior. If it says *light source*, it needs an ontogenetic account of function.

  ### The Wrinkle: Ontogenetic Content and Mismatch

  Your focus on urban birds, lab mice, and moths exposes the weakest flank of standard Teleosemantics.

  *   **The Problem:** Standard Teleosemantics says content is fixed by the conditions under which the mechanism was *selected*. For a lab mouse freezing to a tone, no ancestor was selected to freeze to that tone. For a moth at a streetlight, the mechanism was selected for moons, not bulbs.
  *   **The Requirement:** A theory of natural content must allow **Function Fixation within a Lifetime.**
      *   *Option A (Learning Mechanisms):* The selected trait is not the specific representation (freeze to tone) but the *learning mechanism* (associate tone with shock). The content is fixed by the conditions under which the *learning mechanism* performs its function. (Neander, Shea).
      *   *Option B (Consumer Semantics):* Content is fixed by what downstream systems *use* the state for, regardless of upstream history. (Millikan's later work, Papineau).
      *   *Option C (Abandon History):* Move toward functional role or causal theory. (Sacrifices robust normativity).
  *   **The Verdict:** Ontogenetic content does not need its own *sui generis* account, but the base theory must define "Function" broadly enough to include **ontogenetic selection pressures**. If the theory insists content is *only* phylogenetic, it is inadequate for your purposes. The moth's state represents *light-source-navigation-target*, not *moon*. The error is not misrepresentation relative to the mechanism's current function, but a mismatch between the current environment and the environment the learning mechanism expects.
  *   **Is it a Hard Case or a Misstatement?** It is a misstatement of the requirement to demand *phylogenetic* fixity for all content. The requirement should be: **Content is fixed by the normal conditions for the performance of the system's function,** where "system" can be a learning module acquired ontogenetically.

  ### Scorecard of Contenders

  | Theory | Misrepresentation | Determinacy | Ontogenetic Plasticity | Swampman | Verdict for You |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pure Causal/Info** | Fail (Disjunction Problem) | Pass | Pass | Pass (No history needed) | **Reject.** Cannot explain error normatively. |
  | **Standard Teleosemantics** (Millikan) | Pass | Weak (Indeterminacy) | Fail (Phylogeny bound) | Fail (No content) | **Reject.** Cannot handle urban birds/lab mice without modification. |
  | **Teleosemantics + Learning** (Neander/Shea) | Pass | Pass | Pass (Mechanism selected) | Fail (No content) | **Contender.** Handles ontogeny via selected learning mechanisms. |
  | **Functional Role** | Weak (Holism) | Pass | Pass | Pass | **Reject.** Struggles with naturalism/original content. |
  | **Interpretivism** (Dennett) | Pass (Relative) | Pass | Pass | Pass | **Reject.** Not robustly naturalistic (depends on interpreter). |

  **Recommendation:** Look at **Nicholas Shea's *Representation in Cognitive Science*** or **Karen Neander's *A Mark of the Mental***. They explicitly tackle the ontogenetic/learning wrinkle within a teleological framework, allowing you to keep Misrepresentation and Normativity without being trapped by Phylogenetic Fixity. Discard the Swampman intuition; it blocks the only viable path for explaining urban animals.
