answer: |-
  The question of whether generations are "real kinds" is not merely a matter of semantic pedantry; it is a foundational issue for social ontology. If generations are genuine social kinds, akin to money or race, they possess causal powers independent of our descriptions of them. They carve nature at its joints, or at least carve society at its seams. If they are merely arbitrary demographic bookkeeping, then using them as explanatory variables is a category error that obscures more than it reveals. If they are journalistic fictions, they are actively harmful mystifications. In this essay, I argue that generations are not real social kinds. They are arbitrary demographic bins that acquire a deceptive veneer of reality through reflexive labeling, but this performative effect does not salvage their ontological status as independent causal forces. While the *belief* in generations has real consequences, the *category* itself lacks the structural integrity required to be considered a genuine social kind.

  To understand why generations fail as ontological categories, we must begin with the identification problem, which is often dismissed as a mere methodological nuisance but is actually an ontological fatal flaw. In any dataset, cohort effect, period effect, and age effect are perfectly collinear: Cohort = Period − Age. If you know someone's age and the current year, you mathematically know their birth cohort. Consequently, you cannot estimate a cohort effect separately from age and period effects without importing an arbitrary assumption from outside the data. Standard statistical models cannot distinguish whether a change in behavior is due to people aging (age effect), the current historical moment affecting everyone (period effect), or the specific birth cohort carrying a unique imprint (cohort effect).

  Some defenders of generational realism argue this is just a measurement problem, not an existence problem. They claim generations are real, but hard to measure. This is incorrect. The identification problem indicates that "generation" is not a distinct variable in the world; it is a linear combination of two other variables. To claim a generational effect exists is to claim there is a residual causal force left over after accounting for aging and historical context. But because the math does not allow us to isolate that residual without arbitrary constraints (e.g., assuming adjacent cohorts are similar), any claim of a generational effect is essentially a assumption masquerading as a finding. Among professional demographers and quantitative sociologists, this is settled science: the APC (Age-Period-Cohort) problem is in principle unsolvable without external constraints. Therefore, treating generations as independent causal kinds is ontologically unjustified. We are not missing the right tool to measure them; the thing we are trying to measure does not exist as a distinct entity.

  This mathematical indeterminacy is mirrored in the sociological theory often cited to defend generations, specifically Karl Mannheim's seminal work on the problem of generations. Mannheim is frequently invoked by pop sociologists to lend weight to the idea of generational consciousness, but a close reading of his layered picture actually undermines generational realism. Mannheim did not believe everyone born in the same window automatically belonged to a generation. He distinguished between "generation location" (the bare fact of being born in the same historical time), "generation as actuality" (those who actively respond to that location), and "generation units" (sub-groups within that actuality who react in specific, shared ways).

  If we follow Mannheim rigorously, the "real" action happens only at the level of the generation unit. These are essentially political or cultural movements bound by shared trauma or ideology, not birth years. For example, the "Sixties Generation" might be real in Mannheim's sense, but it includes people born in 1935 and people born in 1955, while excluding many born in 1945 who did not participate in the counterculture. If the ontological weight rests on shared response rather than shared birth year, then the category "Millennial" or "Gen Z" collapses. It shrinks into something much smaller and messier than the demographic bins used by Pew Research or marketing firms. Does shrinking the category save generational realism? No, it kills it. It transforms "generation" from a universal demographic kind into a specific historical voluntarism. If you have to opt-in to your generation through political activation, then birth year is irrelevant to the ontology. Mannheim saves the phenomenon of generational consciousness only by destroying the category of generation as a birth cohort.

  This arbitrariness is most visible at the cusps. Consider someone born in December 1980 and someone born in January 1981. Under standard definitions, the first is a Baby Boomer and the second is a Gen Xer. They are supposedly imbued with different psychologies, economic destinies, and cultural touchstones based on this one-month difference. There is no biological or social mechanism that tracks this cutoff. Proponents of generational realism might argue that all social categories have boundaries. Money has denominations, borders have lines. But the disanalogy lies in the enforcement and the underlying reality. A border is real because states enforce it with violence and law; a $10 bill is real because institutions back its value. The boundary between 1980 and 1981 is enforced by no one and backs nothing. It is a artifact of data visualization, not social structure.

  Are there other social categories with boundaries this arbitrary that we insist are real? Race is the obvious comparison, but race is maintained through systemic enforcement, historical lineage, and visual markers that are socially interpreted as significant even if biologically baseless. Generations lack the systemic enforcement. You cannot be fired for being on the wrong side of a generational cusp, nor can you be legally barred from a space. The arbitrariness of the cusp reveals that the category is not tracking an underlying social reality, but rather imposing a grid onto a continuum. If the fact of the matter about where a generation starts shifts depending on who is drawing the line, there is no fact of the matter at all.

  This lack of stability is compounded by the issue of portability. The Anglophone scheme of Boomers, X, Millennials, and Zoomers does not travel cleanly. In China, generational labels are often tied to birth decades (the "post-80s," the "post-90s") rather than named cultural archetypes, and the boundaries shift based on economic reforms rather than Western cultural moments. In other countries, labels are tied to specific political events rather than birth windows. If generations were genuine social kinds, akin to money, we would expect some translatability. Money functions as a social kind because the institutional logic transfers across borders; a dollar is recognizable as a unit of value even in a country that uses euros. Generations do not transfer. A "Millennial" in the US is defined by 9/11 and the 2008 crash; a "Millennial" in France might be defined by different labor laws and terrorist events. If the granularity and boundaries shift from country to country, the category is not tracking a universal human social structure. It is a local naming convention.

  This brings us to the most potent counter-argument: the naming loop. Once a label is out there, people read the description of themselves and start conforming to it or defining themselves against it. The category feeds back into the thing it names. This reflexivity could make generations more real, because they become self-stabilizing institutional facts. If everyone believes Gen Z is anxious and digital-native, employers treat them as such, schools teach them differently, and Gen Z individuals may internalize the label. Does this make them real?

  I argue that this makes them *performatively* real but not *ontologically* robust. There is a distinction between a category that creates reality through classification (like a bank run) and a category that is created by classification without underlying structural support. Money is real because there is a central bank and legal tender laws backing the collective intentionality. Generations are backed by marketing firms and news outlets. The feedback loop exists, but it is shallow. It influences consumer behavior and self-description, but it does not create distinct causal powers that cannot be explained by age and period. When a Gen Z worker demands flexible hours, is that because of their generational essence, or because they are young workers in a gig economy (age and period)? The naming loop obscures this distinction. It creates a simulation of a kind without the substance. The reflexivity makes the *belief* in generations real, not the generations themselves.

  We must also address the elephant in the room: Strauss and Howe. Their theory of history running on a repeating cycle of four roughly twenty-year generational types is treated as fringe by professional sociologists, and for good reason. It is not enough to dismiss it as "astrology for business consultants"; we must be precise about why it fails ontologically. The problem is teleological determinism. Strauss and Howe posit a fixed cycle length and fixed archetypes that history must fulfill. This is unfalsifiable; any deviation is explained away as a "turning" adjustment. It handles the identification issue by simply ignoring it, assuming the cycle exists axiomatically.

  However, throwing out Strauss and Howe does not commit you to throwing out generational kinds entirely, contrary to what some critics suggest. You can reject the mystical cycle while still believing in cohort effects. But given the identification problem and the arbitrariness of boundaries discussed above, rejecting Strauss and Howe is a necessary step toward ontological honesty, even if it isn't sufficient to kill generational realism on its own. The settled consensus among serious historians and sociologists is that Strauss and Howe is pseudoscience. But the contested ground lies in whether a non-cyclical, non-mystical version of generations can survive. I argue it cannot, because without the cycle, you are left with the arbitrary bins discussed earlier. Strauss and Howe are just the most honest about the implications: if generations are real kinds, they must have a structure. If they don't have a structure, they are just labels.

  So, where does this leave us? We must be explicit about what is settled and what is contested. It is settled among demographers that cohort effects cannot be statistically isolated from age and period effects without arbitrary assumptions. It is settled among historians that cyclical generational theory is false. What is contested is whether the *social practice* of naming generations creates a new ontological entity. My verdict is that it does not. The social practice creates a *discourse*, not a *kind*.

  Generations are arbitrary demographic bookkeeping. They are useful heuristics for journalists and marketers because they simplify complex historical changes into digestible narratives. But in a social ontology seminar, we must distinguish between useful fictions and real kinds. Money is a real social kind because it functions as a medium of exchange regardless of individual belief, backed by institutional force. Race is a real social kind because it structures life chances through systemic racism, regardless of biological validity. Generations structure nothing that age and period do not already structure. The boundaries are arbitrary, the effects are unmeasurable, and the cross-cultural portability is non-existent.

  The naming loop gives them a ghostly existence, a sort of social hallucination that becomes visible only when people start acting out the script. But a script is not a structure. When we treat generations as real kinds, we risk misdiagnosing social problems. If we attribute housing unaffordability to "Millennial spending habits" rather than period-specific economic policy, we are using an ontological error to mask a political reality. If we attribute mental health crises to "Gen Z brain rot" rather than age-specific developmental challenges combined with period-specific technological shifts, we are again mistaking the bin for the cause.

  Therefore, the verdict must be that generations are not real kinds. They are convenient fictions that have been reified through repetition. They belong in the category of journalistic conventions, tolerated by researchers only when clearly defined as heuristic devices rather than causal agents. To grant them ontological status is to grant causal power to a calendar artifact. We should not confuse the map for the territory, especially when the map is drawn by marketing consultants and the territory is just people aging in history. The "generation" is not a thing we find in the world; it is a thing we impose on the world to make the chaos of time feel manageable. In social ontology, we must resist the comfort of that management. The category does not carve reality; it covers it up.
