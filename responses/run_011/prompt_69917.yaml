  **THE FREE AGENT**
  **By Marlowe Vance**
  *"Freedom is the space between a desire and an obstacle."*

  **DEAR MARLOWE:** I rent the top floor of a house owned by a man named Warren. My lease lapsed years ago; now it's month-to-month. Warren is wonderful. He fixed the porch steps himself. He brought me soup when I had the flu. He lets me keep a cat even though the original paperwork forbids it. He hasn't raised the rent in six years. He has never once told me what to do.

  But I don't have friends over after nine p.m. I haven't mentioned the damp spreading behind the wardrobe in three winters. I laugh at his jokes harder than they deserve. I moved my job to be nearer, and my kid's school is four blocks away, so leaving isn't really on the table. I keep telling people he's "like family." I can't find a single thing he's done to me. Is me feeling tight in the chest just anxiety? Am I making a fuss about nothing?
  **—GRATEFUL IN GARFIELD HEIGHTS**

  **DEAR GRATEFUL:** You list zero commands. Zero threats. Zero enforced promises. You stay late? Your choice. You ignore damp? Your choice. You laugh? Your choice. Warren holds the power to evict you, yes, but power unexercised is not interference. A possibility is not an obstacle. You are free in a way most people would envy.

  You ask about a written lease. A lease binds Warren's will to paper. It reduces his liberty to change his mind about your tenancy or the cat. Do not infringe upon his sovereignty. Enjoy the open door. The tightness is likely just the weight of so much liberty.

  **DEAR MARLOWE:** I own a laundromat. City inspector came last week. Made me shut down the boiler for an annual check. Also, I put out a sidewalk sign and got fined because I didn't have a permit. I own the building. I pay the taxes. Now they tell me when to fix things and charge me to speak to the street. I'm a slave to the clipboard. Is this normal?
  **—SUDS & SIGNALS**

  **DEAR SUDS:** The inspector entered your property. The permit fees tax your action. This is coercion. Your liberty is diminished exactly by the scope of their regulation. It does not matter that the boiler might explode or the sign might trip a pedestrian. The law interferes with what you actually want to do. Your anger is justified. Fight the clipboard. Every form you fill is a chain you didn't choose.

  **DEAR MARLOWE:** I read Nadia's letter three times. I recognize my house in it. Eleven years married. My husband is kind. Never raised his voice. Never told me what to do. I check the tone of the room before I speak. I moved my things to the spare room so he wouldn't trip. I was going to ask if I should demand a separate account. But I looked at him sleeping. I folded the letter. I'll make coffee instead.
  **—QUIET IN QUINCY**

  **DEAR QUIET:** If he did not speak, you are not silenced. If he did not block, you are not stopped. The quiet is yours. Make the coffee.
