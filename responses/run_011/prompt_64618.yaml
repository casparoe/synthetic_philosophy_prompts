answer: |-
  The silence had a weight to it, pressing against my eardrums like deep water. That was the first thing I noticed, before the light, before the cold. Then came the headache, a sharp spike behind the eyes, and the realization that I didn't know my name. I knew only the warning, looping in my head like a corrupted file: *Kael said the gradient could invert. Kael said don't trust the feel of it. Kael said check the entropy.*

  Kael was a liar, or at least a gambler. He'd told me this facility could isolate a room and flip the thermodynamic arrow. Time flowing out, while in here, it flowed in. Or vice versa. He'd laughed when he said it, a nervous sound I couldn't quite recall the timbre of. Now, I was the experiment.

  I sat up. The room was white, sterile, a cube maybe four meters across. No seams in the walls. No visible vents. Just a table, a shelf, and a door that looked seamless until I looked directly at the handle. On the table sat a glass beaker half-filled with water. Inside, a single cube of ice floated. Next to it, a small vial of black ink, uncapped, with a dropper resting beside a shallow dish of water where a cloud of ink hung suspended, neither fully spread nor fully contained.

  On the shelf above, a layer of dust caught the light from a source I couldn't identify. It wasn't a uniform gray smear. The dust lay in concentric rings, perfect geometric circles radiating from the center of the shelf. I frowned. Dust settles randomly. It drifts. It doesn't draw circles. I dismissed it. Maybe the ventilation had a pattern. Maybe I was looking for meaning in noise.

  I looked at my arm. A gash ran along the forearm, red and wet. The blood was liquid, not clotted. It stung, a bright, sharp pain that throbbed in time with a heartbeat I couldn't hear but could feel in the wound.

  I needed to know which way the river was running. If I was moving forward, the ice would melt. The ink would diffuse until the water was uniformly gray. The wound would clot, scab, and heal. The dust would accumulate, blurring the rings.

  If I was moving backward, the ice would grow. The ink would gather itself back into the dropper. The wound would deepen, the blood retreating into the vein. The dust would lift, sharpening the rings until the shelf was clean.

  I stood and walked to the table. The air was cold, biting at my exposed skin. I leaned over the beaker. The ice cube was small, perhaps two centimeters squared. Its edges were slightly rounded. I watched it for a minute. Did it look smaller? Or was it just the refraction of the water? Without a reference point, without a memory of how large it was ten minutes ago, the visual data was useless. Motion was the key, but the room was still. Nothing moved visibly.

  I turned to the ink. The cloud in the dish was dense in the center, fading at the edges. In forward time, a drop hits and spreads, dense center fading out. In reverse, the diffuse edges pull in, tightening the center. It looked the same either way. It was a snapshot of a process, frozen in the middle.

  The clock on the wall was no help. It was a simple analog face, but the numbers were worn off. The hands were moving, I could see the second hand twitch, but I couldn't tell if it was ticking clockwise or counter-clockwise. From this angle, the depth was ambiguous. It could be sweeping left or right.

  I looked back at the wound. The blood was wet. That was the only certainty. If time were forward, this was a fresh injury. It would dry. If time were backward, this was a healing injury un-healing. It would wet further.

  I pressed a finger to the cut. It hurt. The pain was immediate. If time were reversed, would I feel the pain before the cause? No, Kael had said the local entropy flips, not the neural processing. My mind was the anchor. I was the outside observer trapped in the bubble.

  So I had to trust the physics. Order to disorder, or disorder to order.

  The dust rings bothered me. They were too perfect. If time were forward, dust accumulates chaotically. These rings suggested order. Was the room creating order? That would mean reverse time. But maybe the shelf had been cleaned recently, and the dust was just settling into the grooves of the wood grain. I ran a finger over the shelf. It was smooth. No grooves. The dust just sat there, defying the chaos I expected from the world.

  I looked at the ice again. There was a hairline fracture in the glass of the beaker, near the base. It seemed to shimmer, holding its shape against the water's pressure. I ignored it. Glass doesn't heal.

  I had to make a choice. I couldn't stay here forever. Dehydration would kill me if the water was undrinkable. Starvation if the door didn't open.

  If I assumed forward time: The ice is melting. I should wait for it to melt completely so the water is cool but not diluted, then drink. The wound will heal on its own. I should leave the door alone until I'm ready, conserving energy.

  If I assumed backward time: The ice is growing. If I wait, the beaker will freeze solid. I need to drink now, while the water is liquid. The wound will open; I need to bind it tight to stop the un-healing. The door... if time is reversed, opening the door might be the act of closing it. I should not touch the handle.

  I looked at the ink again. The cloud seemed... tight. Cohesive. Like it was holding its breath.

  I thought about Kael. He trusted chaos. He said the universe wants to be messy. "Entropy is the only truth," he'd told me. If this room was obeying the universe, it should be getting messier. The dust should be blurring. The ice should be shrinking. The wound should be scabbing.

  The wound wasn't scabbing. It was wet. But that meant it was fresh. Fresh means forward. If it were backward, it would be an old wound reopening, which would mean... what? A scab falling off? There was no scab. Just wet red flesh.

  Therefore, the injury was new. Therefore, time was moving away from the injury. Towards healing. Towards order in the tissue, but disorder in the thermodynamics.

  The dust rings were an anomaly. A trick of the light. A manufacturing defect in the shelf. I couldn't base the arrow of time on dust. I had to base it on the biology. Life fights entropy. Life heals. The wound was healing. I could feel the throb slowing, just slightly. The sting was dulling.

  Time was forward.

  The relief was physical, a loosening of the tension in my shoulders. I wasn't in a reverse bubble. I was just locked in a room. Normal physics applied. I could trust my instincts.

  The ice was melting. I didn't need to rush. In fact, drinking icy water might shock my system. Better to let it reach equilibrium. The wound would stop bleeding soon. I didn't need to bandage it; I just needed to keep it clean.

  The door was the exit. But if I was right, there was no rush. The facility outside was running on the same time as me. They would open it when they were ready. If I tried to force it, I might break the handle. Better to wait. Conserve energy. Let the processes finish naturally.

  I sat back down on the floor, leaning against the wall opposite the table. I crossed my arms, careful of the wound. I watched the beaker.

  The ice cube floated there, white and solid. I focused on it. I wanted to see the water line rise as the ice displaced less volume upon melting. I wanted to see the droplets of condensation run down the glass.

  The room was very quiet. The pressure against my eardrums increased, a subtle pop. I swallowed to equalize it.

  I decided to let the ice melt completely. It would be a marker. When the water was clear and free of ice, I would know a few hours had passed. I would drink then. I would test the door then.

  I closed my eyes and listened to the silence. It felt heavy, tightening around me like a shrink-wrap. I told myself it was just the isolation. I told myself the dust rings were just dust. I told myself the wound was healing.

  I settled in to wait. The ice bobbed gently in the water. It looked stable. It looked like it belonged there. I felt a surge of patience. I had all the time in the world. The ice wasn't going anywhere. It was going to stay right there, growing colder, harder, more permanent, until I was ready for it.

  I smiled, comfortable in my logic. I watched the crack in the beaker widen, just a fraction, sealing itself back into smooth glass. I didn't notice it. I was too busy watching the ice, waiting for it to disappear.
