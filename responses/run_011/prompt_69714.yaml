answer: |-
  ### Brainstorming: Formulating the Research Question

  To make this project tractable for a six-month fellowship, I need to move from a general suspicion to a specific investigative target. Here are three candidate formulations:

  1.  **The Epistemic Formulation:** *Under what conditions does evaluation data constitute knowledge of deployment safety?* This is philosophically robust but risks becoming abstract. It focuses on the status of the belief ("Do we *know* it's safe?") rather than the mechanism of the guarantee. Engineers might find this too removed from the mechanics of their pipelines.
  2.  **The Taxonomic Formulation:** *Can we classify control measures by the statistical assumptions they implicitly make?* This is actionable but potentially descriptive. It risks producing a list without a central argument. It tells engineers what they are doing, but not necessarily whether it can work.
  3.  **The Conditional Validity Formulation:** *For any evaluation-based control measure, does its safety guarantee fail due to adversarial deception or non-adversarial distributional shift, and which specific homogeneity premises block each failure mode?*

  I choose the **Conditional Validity Formulation**. It is the most likely to yield technical utility because it forces a mapping between specific engineering interventions (e.g., sandboxing, monitoring) and specific failure classes. It avoids the trap of asking "Does control work?" (which invites a yes/no dogfight) and instead asks "When does this specific control stop licensing a guarantee?" This allows the technical team to say, "We are using Measure X, so we must ensure Premise Y holds," which is an actionable safety constraint. It also preserves the philosophical nuance regarding the difference between a model *hiding* capabilities and a model encountering *novel* contexts.

  ***

  ### Research Proposal: The Homogeneity Premise in AI Control Protocols

  **(a) Precise Statement of the Question**
  This project asks: **For evaluation-based control measures, what is the minimal "homogeneity premise" required to license a safety guarantee, and is that premise vulnerable primarily to adversarial deception or non-adversarial distributional shift?**

  The question is determinate because it seeks a mapping. For each control measure (e.g., output filtering, sandboxing, red-teaming), there is a specific claim about the relationship between the evaluation context and the deployment context. The answer will not be a single verdict on "control," but a structured taxonomy showing which measures break under deceptive alignment versus which break under mere capability generalization.

  **(b) The Gap in Existing Positions**
  Current discourse is polarized. "Control-first" proponents argue that monitoring and restrictions provide safety even if the model is not aligned, effectively assuming that the evaluation context is representative of the deployment context. "Alignment-skeptics" argue that a sufficiently capable, misaligned model will behave perfectly during evaluation and catastrophically during deployment, rendering control useless.

  Both sides leave the core epistemic mechanism unexamined. The optimists often treat the leap from evaluation to deployment as unproblematic statistical inference. The skeptics assume the leap is always fatal due to deception. Neither party disentangles the *source* of the inference failure. By distinguishing between adversarial failure (the model actively exploits the sampling gap) and non-adversarial failure (the deployment environment simply differs from the test environment in ways the model didn't anticipate), this project identifies a middle ground. It asks whether there are control measures that are robust to deception but fragile to shift, or vice versa. This distinction is currently obscured, leading to arguments where proponents and critics talk past one another.

  **(c) Method: Month-by-Month Plan**
  *   **Months 1–2 (Conceptual Taxonomy):** I will construct a preliminary taxonomy of control measures used by the host team. For each measure, I will articulate the implicit homogeneity premise (e.g., "The model's refusal behavior in the sandbox is identical to its refusal behavior in production"). I will categorize these premises by their vulnerability to adversarial vs. non-adversarial shift.
  *   **Months 3–4 (Technical Audit):** I will work with the engineering staff to audit actual evaluation protocols. I will request documentation on how evaluation datasets are constructed and what claims are made about their generalization. My goal is to test my conceptual taxonomy against actual engineering practice: Do the engineers believe they are guarding against deception, or merely against accidental incompetence? I will conduct semi-structured interviews with safety engineers to understand their threat models.
  *   **Months 5–6 (Synthesis and Workshop):** I will draft the final paper, refining the taxonomy based on the technical audit. I will co-design a workshop with the technical staff where we present this taxonomy to the broader team, using it to stress-test current safety cases. The workshop will focus on identifying which premises are currently unjustified.

  **(d) Justification of Approach**
  This conceptual approach is necessary because formalizing a threat model mathematically is outside the scope of a philosophy fellowship and risks obscuring the structural assumptions in technical detail. Conversely, running empirical evaluations is impossible given my lack of access to training infrastructure and the timescales involved. The value I add is not new data, but a clearer map of the inferences being drawn from existing data. By clarifying the *logic* of the safety case, I enable the technical team to see where their empirical efforts are best spent. If a control measure relies on a premise that is known to be false (e.g., that deception is impossible), the team needs to know that philosophically before they invest engineering hours.

  **(e) Success and Failure Conditions**
  *   **Success:** The project succeeds if I produce a validated taxonomy where at least one control measure is shown to rely on a homogeneity premise that is distinct from full alignment. For example, demonstrating that "sandboxing" requires a weaker premise than "output monitoring" regarding the model's awareness of its environment. The deliverable must be usable: engineers should be able to look at a safety case and identify which premise is being invoked.
  *   **Failure:** The project fails if the analysis demonstrates that *all* viable control measures collapse into requiring the assumption of intent alignment (i.e., that the model is not deceptive). If the distinction between adversarial and non-adversarial shift proves untenable for all practical control measures, I will document this collapse. This is a negative result, but it is a determinate failure condition that vindicates the skeptics and saves the team from pursuing dead ends.

  **(f) Scope Management**
  The risk is attempting to analyze every safety mechanism in existence. To stay within six months, I will restrict the scope to *evaluation-based* controls (monitoring, red-teaming, evals) and exclude *architectural* constraints (hard-coding rules, compute limits) unless they rely on evaluative claims. If the taxonomy becomes too granular, I will prioritize high-level categories (e.g., "pre-deployment evals" vs. "runtime monitoring") over specific algorithmic implementations.

  **(g) Anticipating Objections**
  A likely objection is that this is merely alignment research wearing a control costume—that by analyzing the premises of control, I am implicitly arguing for alignment solutions. This objection misses the point. Alignment research attempts to modify the model's internals to ensure good behavior. This project analyzes the *metrology* of safety: how we measure and verify behavior regardless of internals. Even if we cannot align the model, we need to know if our rulers are straight. If the objection lands, it would only be if my proposed "weak premises" turn out to be secretly strong alignment assumptions in disguise; the failure condition in (e) is designed specifically to catch this.
