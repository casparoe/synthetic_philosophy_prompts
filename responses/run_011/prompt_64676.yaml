  1. **The Asymmetry Objection:** Validate the observation, but reframe its function. It's not a flaw in the analogy, but a mapping of *epistemic states*.
  2. **Mechanisms (A) & (B):** Define them clearly. Argue they are mutually reinforcing loops, not just linear dependency.
