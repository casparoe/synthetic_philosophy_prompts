answer: |-
  Here is a complete lesson plan designed for a 75-minute seminar. It is built to be tight, slightly adversarial (to provoke the problem), and mathematically precise in the debrief.

  # Game Title: The Social Welfare Calculator

  ## 1. Learning Objectives
  By the end of the session, students will be able to:
  1.  Distinguish between **Utility Levels** (absolute welfare) and **Utility Changes** (welfare relative to a baseline).
  2.  Demonstrate mathematically that Utilitarian aggregation ($\sum u_i$) is invariant to **Zero-Point shifts** ($b_i$) but vulnerable to **Unit/Scaling shifts** ($a_i$).
  3.  Experience why "strategic inflation" of utility scores renders interpersonal comparison impossible.

  ## 2. Materials & Setup
  *   **Room:** One large table or clustered seating (seminar style).
  *   **Handouts:** 16 "Utility Slips" (index cards work best).
  *   **Projector/Whiteboard:** To display aggregated results live.
  *   **Scenario:** The Department has a **$10,000 surplus**. Three proposals are on the table:
      *   **Option A:** Guest Lecture Series (High prestige, low student enjoyment).
      *   **Option B:** New Library Books (Moderate prestige, high student utility).
      *   **Option C:** End-of-Year Party (Low prestige, very high student enjoyment).
      *   *(Implicit Status Quo D):* Save the money (No change).

  ## 3. Roles
  *   **The Citizens (16 Students):** Their goal is to maximize the group's total welfare. They possess private information about their own preferences.
  *   **The Social Planner (You):** You aggregate the numbers and declare the winner. You are neutral but mechanical.

  ## 4. The Scoring Scheme (The Trap)
  The Social Welfare Function is simple **Utilitarian Summation**.
  $$W = \sum_{i=1}^{16} u_i$$
  The option with the highest $W$ wins.

  ## 5. Game Flow (35 Minutes Total)

  ### Phase 1: Absolute Levels (10 Minutes)
  1.  **Instruction:** "On your slip, write your name and assign a **Happiness Score (0 to 100)** to Options A, B, and C. 0 represents 'Total Misery', 100 represents 'Maximum Possible Joy'. You may use any integer."
  2.  **Constraint:** "You must be prepared to defend the **ratio** of your numbers. If you write A=100 and B=50, you are claiming A is *twice as good* as B. I will audit this."
  3.  **Collection:** Collect slips. Input them into a spreadsheet (projected) or sum them on the board.
  4.  **Result:** Declare a winner. (Likely chaotic).

  ### Phase 2: Relative Changes (10 Minutes)
  1.  **Instruction:** "We suspect 'Zero' is subjective. Let's fix it. The Status Quo (Saving the Money) is now **0**. Assign a **Gain/Loss Score (-50 to +50)** to A, B, and C relative to saving the money."
  2.  **Constraint:** "Again, defend your ratios. If A is +40 and B is +20, A must provide twice the *improvement* of B."
  3.  **Collection:** Collect and Sum.
  4.  **Result:** Declare a winner.

  ### Phase 3: The "Inflation Audit" (15 Minutes)
  1.  **Projection:** Project the raw data from Phase 1 and 2 anonymously (Student 1, Student 2...).
  2.  **The Audit:** Pick the student with the highest variance in scores (e.g., someone who wrote A=100, C=1). Ask them: "Does Option A genuinely provide 100x more welfare than Option C? Or did you inflate to sway the vote?"
  3.  **The Twist:** Ask the class: "If Student X had multiplied their scores by 10, would the winner change?" (Calculate this live).

  ## 6. The Debrief: Mapping the Experience (40 Minutes)

  This is where the philosophy happens. Do not summarize; derive it from their data.

  ### Step 1: The Zero-Point Illusion (Levels vs. Changes)
  *   **Ask:** "Did the winner change between Phase 1 (Levels) and Phase 2 (Changes)?"
  *   **Likely Outcome:** Probably not, or only slightly.
  *   **The Lesson:** Write on the board: $u' = u + b$.
      *   Explain that if every student shifts their personal zero (e.g., one student's '0' is death, another's '0' is breakfast), they are adding a constant $b_i$ to their scores.
      *   Show the math:
          $$W_{Option1} = \sum (u_{i1} + b_i) = \sum u_{i1} + \sum b_i$$
          $$W_{Option2} = \sum (u_{i2} + b_i) = \sum u_{i2} + \sum b_i$$
      *   **Key Insight:** When comparing Option 1 vs Option 2, the $\sum b_i$ term **cancels out**.
      *   **Conclusion:** Interpersonal comparison of *Levels* is mathematically robust against different Zero-Points. The anxiety about "Your 0 isn't my 0" is a red herring for aggregation.

  ### Step 2: The Unit Problem (The Scaling Trap)
  *   **Ask:** "Why did Phase 1 and 2 feel chaotic? Why did the Audit feel necessary?"
  *   **The Lesson:** Write on the board: $u' = a \cdot u$.
      *   Explain that when Student X wrote "100" and Student Y wrote "10" for the same level of joy, Student X set their unit ($a$) 10x larger.
      *   Show the math:
          $$W = \sum (a_i \cdot u_i)$$
      *   **Key Insight:** The $a_i$ does **not** cancel out. It acts as a **weight**. By inflating their numbers, Student X didn't just report intensity; they unilaterally assigned themselves more voting power.
      *   **Conclusion:** Aggregation is completely hostage to disputes about units. Without a common "util" ruler, the sum is meaningless.

  ### Step 3: Changes vs. Levels Revisited
  *   **Ask:** "Did switching to 'Changes from Status Quo' (Phase 2) fix the inflation problem?"
  *   **Answer:** No. It fixed the *Zero* anxiety (psychologically), but the *Unit* problem remained identical. You can inflate a "Gain of 50" just as easily as a "Level of 100."
  *   **Takeaway:** Distinguishing levels from changes is conceptually useful, but it does not solve the Interpersonal Utility Comparison (IUC) problem.

  ## 7. Honest Note: What the Game Can't Reproduce
  You must supply this verbally, as the game structure cannot generate it:
  *   **The Ontological Barrier:** The game assumes students *have* a cardinal utility function they are hiding. In reality, the deeper philosophical problem is that **cardinal utility may not exist** independently of choice behavior. The game treats utility as a private mental quantity (hedons) that is hard to measure. You need to explain that many economists argue there is *nothing there to measure*—only revealed preferences (ordinal rankings). The game simulates the *measurement* problem, but you must lecture on the *existence* problem.
  *   **The "No Common Unit" Reality:** In the game, students *could* agree on a unit (e.g., "1 point = 1 cup of coffee"). In reality, there is no physical bridge between minds. You must explain that unlike height (cm) or weight (kg), there is no "interpersonal utilometer."

  ## 8. Prediction of Failure & Mitigation
  **The Failure Mode:**
  The competitive students will treat this as a voting game, not a measurement game. In Phase 1, one student will write "1,000,000" for their favorite option to guarantee it wins. This destroys the data immediately and makes the "Ratio Audit" impossible (since they won't defend the ratio).

  **The Structural Mitigation: "The Variance Veto"**
  Add this rule to the Instructions:
  > "The Social Planner reserves the right to **discard any ballot** where the ratio between the 1st and 2nd choice exceeds 5:1 without a verbal justification accepted by the group."

  **Why this works:**
  1.  **Visible Backfire:** If a student writes A=100 and B=1, they are forced to stand up and claim, "I hate Option B 100 times more than I love Option A." This is socially costly and usually false.
  2.  **Slows Inflation:** It forces them to keep numbers within a plausible range of intensity.
  3.  **Preserves the Lesson:** It prevents the game from ending in 2 minutes due to one outlier, allowing the "Unit" problem to emerge through *subtle* scaling differences (e.g., one student uses a 1-10 scale, another uses 1-100) rather than blatant cheating.

  **If they still inflate:**
  Lean into it. In the debrief, say: "Student 5's ballot was effectively 10 votes. Student 6's was 1 vote. The Utilitarian Sum didn't maximize welfare; it maximized the loudest shouter. This is exactly why Arrow and others rejected cardinal utility." Turn the failure into the data point.
