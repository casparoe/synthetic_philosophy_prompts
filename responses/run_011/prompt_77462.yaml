  I'm teaching a 75-minute session for about 16 third-years in a philosophy-of-economics seminar, on interpersonal utility comparison, and I want an in-class game — no real money — where they run into the scaling problem themselves instead of hearing me describe it. Specifically I want them to leave able to pull apart two things that get lumped together constantly: comparing *changes* in people's welfare versus comparing their *levels*. And I want them to notice, through play, that an aggregation rule can survive everyone having wildly different ideas about where their own zero sits while still being completely hostage to disputes about units.

  Give me the materials, the roles, the scoring scheme, and a debrief that maps what actually happened in the room onto those distinctions. Then an honest note about which part of the problem the game structurally can't reproduce and that I'll have to supply by talking. Also tell me how it'll go wrong the first time I run it — I assume the competitve ones will just inflate thier numbers, so build in something that makes that backfire or at least visible.
