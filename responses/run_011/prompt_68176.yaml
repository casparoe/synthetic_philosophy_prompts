answer: |-
  You are right to reject "The Rashomon Effect." That term describes conflicting *testimony* from subjective witnesses. You are describing conflicting *exegesis* from objective (or at least fixed) text. That is a fundamentally different epistemological problem.

  You are also right to sense that the standard philosophical labels are too broad. Here is the breakdown of the existing concepts that come nearest, exactly where they leak, and then the coinage you asked for.

  ### The Near Misses

  **1. Underdetermination of Theory by Data (Quine/Duhem)**
  *   **The Fit:** This is the logical core of your problem. It states that for any finite set of evidence, there is always more than one theory that can explain it. Your two camps are living proof of holistic underdetermination.
  *   **The Seam:** Underdetermination is usually treated as a temporary logical problem to be solved by better experiments or new data. It does not account for the *sociological stability* you describe. In standard underdetermination, the scientific community eventually converges on one theory as the "best fit." It does not predict a permanent, thriving bifurcation where both sides produce "utterly convincing" work indefinitely. It lacks the mechanism for the *self-repair* you observed.

  **2. Incommensurability (Kuhn/Feyerabend)**
  *   **The Fit:** This explains why the two camps talk past each other. If their paradigms are different, they assign different weights to the same documents. A letter that is "proof of cowardice" in Camp A is "proof of strategic caution" in Camp B.
  *   **The Seam:** Kuhnian incommensurability usually leads to a *Paradigm Shift*, where one side dies out and the other wins. It describes a revolution, not a stable equilibrium. It doesn't explain why both camps can continue to publish "footnote-dense" work without one being relegated to fringe status.

  **3. Confirmational Holism**
  *   **The Fit:** This captures the "self-repair" mechanism. It suggests that we don't test individual hypotheses in isolation; we test a whole web of belief. When awkward evidence appears, you can save the hypothesis by adjusting a different part of the web (e.g., questioning the date of the letter, the motive of the writer).
  *   **The Seam:** Like underdetermination, this is a description of *how* theories survive, not *why* two specific, mutually exclusive theories would survive *equally well* in the same community without one gaining dominance. It explains the defense, but not the stable duel.

  ### The Coinage

  There is no single established term that binds the *closed evidence*, the *empirical equivalence*, the *self-repair mechanism*, and the *productive sociological split* into one package.

  I propose you call this: **Hermeneutic Homeostasis**.

  **Definition:**
  A state in which a closed evidentiary corpus supports two or more mutually exclusive interpretive frameworks that are empirically equivalent. The system maintains stability not by resolving the conflict, but through **reciprocal immunization**: each new piece of data is absorbed by both frameworks through internal adjustments, allowing both to thrive indefinitely without convergence.

  **Conditions for Qualification:**
  To count as an instance of Hermeneutic Homeostasis, a situation must meet all five criteria:

  1.  **Closed Corpus:** No new *primary* evidence is possible (or, if it appears, it is immediately subsumed by the interpretive frameworks).
  2.  **Empirical Equivalence:** Both interpretations explain the existing data with equal logical coherence and explanatory power. Neither is visibly "sloppier."
  3.  **Mutual Exclusivity:** The interpretations cannot be true simultaneously (e.g., The Captain *was* a coward* vs. *The Captain *was not* a coward).
  4.  **Immunization:** Each framework possesses an internal mechanism to neutralize contradictory data without collapsing (e.g., "That letter proves his guilt" vs. "That letter proves he was being framed").
  5.  **Productive Stability:** The split does not lead to a stalemate or decay. Both camps continue to produce valid, respected work *because* of the tension, not in spite of it.

  ### The Counter-Example (A Near Miss)

  **The Homeric Question** (Did a single poet named Homer write the Iliad and Odyssey, or are they compilations of oral tradition?)

  *   **Why it looks like it:** It has a closed corpus (the texts), two distinct camps (Unitarians vs. Analysts), and has persisted for centuries.
  *   **Why it isn't:** It fails the **Immunization** and **Empirical Equivalence** tests. New linguistic analysis and archaeology *do* shift the weight of consensus over time. The "Analyst" view gained dominance in the 19th century; the "Unitarian" view regained ground in the 20th. It is a pendulum, not a stable bifurcation. The camps do not thrive *equally* at the same time; one is usually ascendant while the other defends. In Hermeneutic Homeostasis, the split is 50/50 and stable.

  ### Your Suspicion

  You wrote: *"I half suspect my own expedition doesn't qualify."*

  You are correct. And this distinction may be the key to unlocking your manuscript.

  **The Historical Expedition:**
  It fails Condition 1 (**Closed Corpus**). In history, the corpus is never truly closed. A ship's manifest could surface in a damp cellar in Lisbon; a skeleton with a specific injury could be found on the ice. Even if none *do* surface, the *possibility* remains. The historians know this. Their "Homeostasis" is provisional. They are waiting for a tiebreaker that hasn't arrived yet. Their thriving camps are sustained by the *hope* of resolution, not the acceptance of ambiguity.

  **Your Manuscript:**
  It *passes* Condition 1. In fiction, the text is ontologically closed. You, the author, know there are no hidden letters in the attic. If you do not write them, they do not exist.

  **The Trap:**
  You are trying to write a **Historical Mystery** (which implies a solvable truth) using the structure of **Hermeneutic Homeostasis** (which implies an unsolvable truth).

  Your beta readers are splitting because they are treating your text like a historical record. They assume there *is* a factual answer (Did he know or didn't he?) and that they are smart enough to find it in the clues. When they can't, they project.

  **The Way Out:**
  If you want to maintain the split, you must stop writing it as a puzzle to be solved and start writing it as a **Rorschach**.

  In a puzzle, ambiguity is a flaw (missing clue). In Hermeneutic Homeostasis, ambiguity is the *engine*.

  To make this work in fiction, you cannot simply leave the motive "unset." That reads as laziness. You must actively construct the **Immunization** into the text. You need to write the scene such that:
  1.  If he *did* know, the action is perfectly consistent.
  2.  If he *didn't* know, the action is *also* perfectly consistent.
  3.  Crucially: **The text must explicitly offer the justification for both.**

  Currently, your readers are supplying the justification from their own heads. That is why they split. To achieve Hermeneutic Homeostasis in fiction, the *text itself* must argue both sides with equal vigor, leaving the reader not with a question ("What did he mean?"), but with a paradox ("He meant both, and neither").

  If you can do that, you move from writing a mystery to writing a **speculative history**. You stop asking the reader to guess the truth, and start asking them to choose their worldview. The "trap" you are in is the expectation that the ambiguity must be resolved. In Hermeneutic Homeostasis, the ambiguity *is* the point.

  Your expedition story qualifies as a subject of study. Your manuscript can qualify as an instance of the phenomenon, but only if you stop trying to hide the ambiguity and start architecting it.
