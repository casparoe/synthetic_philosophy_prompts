  Whether the sovereign's demand for tribute in these counters be not the true anchor that fixes their value, rather than the land or the labour? And whether the necessity of discharging public debts in this species be not what chiefly gives it currency among the people? Berkeley could likely hold this consistently, as he already argues for a national bank and sees money as a political instrument; acknowledging the state's coercive power complements his view of money as a ticket authorized by public institution rather than natural substance.
