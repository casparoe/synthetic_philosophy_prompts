answer: |-
  ### Part 1: Brainstorming and Conceptual Mapping

  **The Space of Positions**
  In a mid-sized English city, the debate is rarely binary (build vs. stop). It is multidimensional. We must anticipate the following distinct constituencies:
  1.  **The Market Liberal:** Housing is a commodity; supply constraints are the enemy; private developers are the efficient delivery mechanism.
  2.  **The Incumbent Defender:** Property values and local amenity are paramount; new development is a nuisance unless it benefits them directly.
  3.  **The Heritage Guardian:** The physical fabric of the city has intrinsic value; loss of character is a permanent harm that outweighs housing need.
  4.  **The Tenant Advocate:** Existing residents (especially renters) have a right to stay; regeneration that displaces them is unjust, regardless of the net housing gain.
  5.  **The State Builder:** Housing is infrastructure; the council should build directly, bypassing private profit.
  6.  **The Decommodifier:** Housing should be removed from the market entirely (CLTs, co-ops); profit motives corrupt housing outcomes.
  7.  **The Value Capturist (Georgist):** Land value is created by the community; private capture of uplift from planning permission is theft.
  8.  **The Proceduralist:** The outcome matters less than the legitimacy of the decision-making process; local democracy is the primary good.

  **Candidate Axes of Disagreement**
  1.  **Beneficiary:** Current owners vs. Future residents vs. The Community abstractly.
  2.  **Mechanism:** Private Market vs. State Direct Build vs. Community Ownership.
  3.  **Land Value:** Private entitlement to uplift vs. Public recapture of uplift.
  4.  **Scale of Authority:** Neighbourhood veto vs. Strategic/City-wide need.
  5.  **Nature of Harm:** Economic (property values) vs. Social (displacement) vs. Aesthetic (character).
  6.  **Compensability:** Can money fix the harm? vs. Some harms are incommensurable.

  **Pruning to Separating Axes**
  To distinguish the eight leaves effectively, we cannot rely solely on "More vs. Less" housing. We must prune the axes to those that actually separate the specific positions listed above:
  1.  **Priority of Interest:** Does the participant prioritise the *incumbent* (Localism, Conservation, Tenant Defence) or the *needier outsider/community* (Supply, State, Georgist, Decommodification)?
  2.  **Delivery Mechanism:** If they prioritise need, do they trust the *Market* (Supply), the *State* (Council Build), or *Community Structures* (Decommodification)?
  3.  **Land Entitlement:** Do they believe planning gain belongs to the *Landowner* (Market/Localism) or the *Public* (Georgist/State)?
  4.  **Decision Locus:** Is the primary value the *Outcome* (Housing built) or the *Process* (Local consent)? This separates the Proceduralist from the Substantive positions.

  ***

  ### Part 2: The Diagnostic Instrument

  **Instructions for Participants:**
  Please read the following seven scenarios. Each describes a specific planning situation currently facing the city. Select the option that best matches what you think should happen in that specific case. There are no right or wrong answers.

  **Question 1: The Bus Depot**
  A transport company has closed a bus depot in a central district. A developer proposes 40 flats on the site. The design is modern and dense. Local residents object that it will increase traffic and change the street's atmosphere.
  *   A) Grant permission. The city needs homes, and brownfield sites like this are the right place for them.
  *   B) Refuse permission. The people living on the street now should not have their quality of life reduced by new traffic and crowds.
  *   C) Grant permission only if the council builds the homes itself, rather than a private developer.

  **Question 2: The Victorian Terrace**
  A landlord wants to convert a large Victorian house into three self-contained flats. The building is not listed, but it is in a zone noted for its historical uniformity.
  *   A) Allow the conversion. We cannot freeze the city in time; internal changes do not harm the exterior.
  *   B) Refuse the conversion. The loss of a single-family home and the alteration of the building's use damages the area's historical character.
  *   C) Allow the conversion only if the facade is preserved exactly and the new units are guaranteed to be affordable in perpetuity.

  **Question 3: The Council Estate**
  The council proposes demolishing a 1960s estate to build twice as many homes. Existing tenants are offered equivalent floorspace in the new blocks, but some will be moved to different streets and lose community ties.
  *   A) Proceed with the redevelopment. Doubling the supply helps more people than it displaces.
  *   B) Halt the redevelopment. Existing tenants have a right to remain in their specific homes and community networks.
  *   C) Proceed only if the new homes are owned by a community trust, not the council or private landlords.

  **Question 4: The Station Approach**
  To expand the railway station, the city needs a strip of land owned by a private firm. The firm demands a price reflecting the potential value of the land if it were allowed to be built on, not its current value.
  *   A) Pay the price. Compulsory purchase at below-market rates is unfair to the landowner.
  *   B) Compulsory purchase at the current use value. The increase in value comes from the public station, not the owner's effort.
  *   C) Redesign the station to avoid the land, even if it costs more or functions less well.

  **Question 5: The Developer's Offer**
  A developer seeks permission for a large scheme. They offer to build a new playground and ensure 20% of units are below market rent in exchange for approval, despite the scheme being taller than local guidelines suggest.
  *   A) Accept the deal. The public benefits (playground and affordable units) outweigh the breach of height guidelines.
  *   B) Refuse the deal. Height guidelines exist to protect the area; they should not be traded for amenities.
  *   C) Refuse the deal. The council should provide the playground and affordable housing from its own budget, not via developer negotiation.

  **Question 6: The Speculative Landowner**
  A farmer on the edge of town refuses to sell land for housing unless the price reflects the assumption that planning permission will be granted, which is currently not the case.
  *   A) The owner is entitled to the best price they can negotiate; it is their land.
  *   B) The price should reflect the land's value for farming, not for housing. The profit from permission belongs to the public.
  *   C) The council should force the sale immediately to build social housing, regardless of the owner's financial loss.

  **Question 7: The Neighbourhood Plan**
  A local neighbourhood plan proposes strict limits on new building to protect local character, which conflicts with the city's overall target to build 5,000 new homes.
  *   A) The neighbourhood plan should prevail. Local people know best what fits their area.
  *   B) The city target should prevail. Housing need is a wider issue that cannot be vetoed by one small area.
  *   C) The decision should be made by a citizens' assembly or independent panel, not politicians or locals alone.

  ***

  ### Part 3: The Decision Tree

  The following tree represents the logical structure of the positions. In the scoring key, participants' answers will be mapped to these branches.

  *   **Root Claim:** *Is the primary obligation to the incumbent resident or the wider community need?*
      *   **Branch 1 (Incumbent Priority):** The rights of those currently living there or owning the land take precedence.
          *   **Claim:** *Is the objection based on material amenity/property or historical fabric?*
              *   **Leaf 1:** **Defensive Localism ("NIMBY/Incumbent Protector")**. (Focus: Amenity, Traffic, Property Values).
              *   **Leaf 2:** **Conservation ("Heritage Guardian")**. (Focus: Character, History, Aesthetics).
          *   **Claim:** *Is the objection based on social displacement?*
              *   **Leaf 3:** **Anti-displacement ("Tenant Defence")**. (Focus: Existing Tenants, Community Ties).
      *   **Branch 2 (Community/Need Priority):** The need for housing or public benefit takes precedence.
          *   **Claim:** *Is the primary value the decision-making process or the housing outcome?*
              *   **Leaf 4:** **Proceduralist ("Democratic Localist")**. (Focus: Who Decides, Legitimacy).
          *   **Claim:** *Should land value uplift be privately captured or publicly recaptured?*
              *   **Leaf 5:** **Land-value-taxation ("Georgist/Value Capturist")**. (Focus: Taxing Uplift, Use Value).
              *   **Branch 3 (Private Capture Accepted):** Planning gain can remain private if housing is delivered.
                  *   **Claim:** *Should delivery be via the market or the state?*
                      *   **Leaf 6:** **Supply-side market provision ("YIMBY/Market Liberal")**. (Focus: Private Developer, Speed, Volume).
                      *   **Leaf 7:** **Large-scale state-led housebuilding ("Council Housebuilder")**. (Focus: Direct Council Delivery, Infrastructure).
                      *   **Leaf 8:** **Decommodification ("Social Housing/CLT")**. (Focus: Removing from Market, Community Ownership).

  ***

  ### Part 4: Scoring Key and Tie-Breaking

  **Mapping Answers to Branches**
  Each answer option corresponds to a specific leaf or branch node. Points are awarded for consistency with the leaf.

  *   **Q1 (Bus Depot):** A → Supply-side / State / Decommod (Need Priority); B → Localism (Incumbent); C → State / Decommod.
  *   **Q2 (Victorian):** A → Supply-side / Market; B → Conservation; C → Decommod / Value Capture.
  *   **Q3 (Estate):** A → Supply-side / State; B → Anti-displacement; C → Decommod.
  *   **Q4 (Station):** A → Market / Localism; B → Georgist; C → Conservation / Localism.
  *   **Q5 (Developer):** A → Supply-side; B → Conservation / Localism; C → State-led.
  *   **Q6 (Speculative):** A → Market / Localism; B → Georgist; C → State-led / Decommod.
  *   **Q7 (Neighbourhood):** A → Localism / Procedural; B → Supply-side / State; C → Proceduralist.

  **Scoring Algorithm**
  1.  Tally the number of times a participant's answers align with each of the 8 Leaves.
  2.  **Primary Assignment:** The participant is assigned to the Leaf with the highest score.
  3.  **Tie-Breaking Rule:** In the event of a tie between two Leaves:
      *   If the tie is between **Supply-side** and **State-led**: Check Q5. If they rejected the private deal (Option C), assign **State-led**.
      *   If the tie is between **Localism** and **Conservation**: Check Q2. If they cited historical uniformity (Option B), assign **Conservation**.
      *   If the tie is between **Proceduralist** and any Substantive Leaf: Check Q7. If they chose independent panel/assembly (Option C), assign **Proceduralist**.
      *   If the tie is between **Georgist** and **State-led**: Check Q4. If they focused on *value* (Option B), assign **Georgist**. If they focused on *who builds* (Option C in Q6), assign **State-led**.
      *   **Inconsistency Handling:** If a participant scores highly on both **Defensive Localism** and **Supply-side** (a common contradiction), check Q1 and Q7. If they prioritised the street over the city (Q1-B or Q7-A), assign **Defensive Localism**. This assumes concrete local protection trumps abstract support for supply.

  **Constraint Check:**
  *   *Pro-housing != Supply-side:* Q3 (Option B supports tenants over supply) maps to Anti-displacement. Q5 (Option C supports housing but rejects market mechanism) maps to State-led.
  *   *No Vocabulary:* Questions use "council", "developer", "tenants", not "neoliberal", "municipalist", etc.

  ***

  ### Part 5: Analysis of Logical Space

  **Empty Cells (Logically Available but Unoccupied)**
  1.  **The "Libertarian Socialist":** Someone who believes land value belongs entirely to the community (Georgist) but also that the owner has an absolute right to refuse sale (Property Rights).
      *   *Status:* **Incoherent.** One cannot claim the community owns the value while the individual owns the decision to withhold the asset.
  2.  **The "Centralist Localist":** Someone who believes the neighbourhood should have absolute veto power (Localism) but also that housing targets must be met regardless of local objection (State/Supply).
      *   *Status:* **Incoherent.** These are mutually exclusive decision rules.
  3.  **The "Market Anti-Displacement":** Someone who supports pure market provision (Supply-side) but also supports halting redevelopment if existing tenants object (Anti-displacement).
      *   *Status:* **Unattractive/Unstable.** In a market system, if tenants cannot pay the new rent, they must move. Supporting both requires price controls, which moves the position towards Decommodification or State-led.

  **Indistinguishable Leaves**
  *   **Pair:** **Large-scale state-led housebuilding** vs. **Decommodification (CLT/Social Housing)**.
  *   **Reason:** In the context of specific planning permissions (Q1, Q3, Q5), both positions reject the private developer and favour public or non-market ownership. A participant may not distinguish between "Council owned" and "Community Trust owned" in a schematic survey.
  *   **Missing Question:** To separate them, one would need to ask about *governance*: "Should the new homes be managed by elected councillors (State) or by the residents living in them (Decommodification)?" This was omitted to keep the instrument focused on planning outcomes rather than internal management structures, which are less visible at the permission stage.

  ***

  ### Part 6: Risk of Misclassification

  This instrument is most likely to misclassify participants who hold a **"Soft Localist"** position under social pressure. In a citizens' assembly context, participants often know they are expected to be "constructive." Consequently, someone who instinctively opposes new housing (Defensive Localism) may select the "Supply-side" or "State-led" options in the abstract cases (Q1, Q7) to appear cooperative, only to reveal their true position when discussing specific impacts on their own street later in the assembly. The scoring key attempts to mitigate this by weighting the concrete local cases (Q1, Q2) higher than the strategic ones (Q7), but the desire to be seen as a 'good citizen' remains a significant source of noise in the data.
