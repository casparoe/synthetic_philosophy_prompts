  ### Brainstorming Candidate Vehicles

  1.  **Ventilator Withdrawal:** Fails the "Identical Intent/Consequences" constraint. In withdrawal, the cause of death is the underlying disease (omission); in injection, it is the drug (act). To make the patient "strictly worse off" in the withdrawal scenario without implying incompetence requires positing that the dying process is inherently agonizing despite sedation. This conflates the *act/omission* distinction with *physiological variability*, allowing the defender to argue that better palliative care (more sedation) would close the suffering gap, thus blaming the practitioner rather than the regime.
  2.  **Voluntarily Stopping Eating and Drinking (VSED):** Fails the "Fixed Capacity" constraint. VSED is a prolonged process (days to weeks). Maintaining "undisputed decision-making capacity, with no depression... and no fluctuation" over that duration is clinically unrealistic, particularly as dehydration sets in. This invites the defender to argue that the patient's request may not be stable, sidestepping the theoretical deadlock.
  3.  **Continuous Deep Sedation (CDS):** Fails the "Total Suffering" constraint. If the patient is deeply sedated until death in the passive regime, subjective suffering is near zero. To argue the patient is "worse off" than with a quick injection requires counting the *duration* of unconsciousness as a harm, or positing "objective" physiological suffering. This risks smuggling in a controversial metaphysical claim about the value of consciousness rather than generating the verdict from the ethical theories themselves.
  4.  **Proportionate Palliative Sedation (Selected):** This vehicle succeeds. It relies on the *titration* requirement inherent in Double Effect (DE). DE requires that the means (sedation) be proportional to the end (relief) and not *intend* death. If the pharmacological dose required for immediate, total relief is indistinguishable from the lethal dose, the DE-compliant physician must titrate cautiously to avoid *intending* respiratory arrest. This creates a "titration lag" where suffering persists briefly, whereas the active regime permits an immediate bolus. This isolates the *moral constraint* as the cause of suffering, not clinical incompetence.

  ***

  ### The Case: Arthur

  Arthur, 54, has end-stage Motor Neurone Disease and is fully capacitous. He is experiencing refractory air hunger—a terrifying sensation of suffocation that opioids blunt but do not abolish. He repeatedly requests a lethal injection to end the panic immediately. In the **Active Regime**, the physician administers a barbiturate bolus intended to stop his heart; Arthur loses consciousness in ten seconds and dies in two minutes, experiencing no further air hunger. In the **Passive Regime**, the physician is prohibited from intending death. To comply with the principle of double effect, she must titrate midazolam only to the point of symptom relief, carefully avoiding doses that would *intend* respiratory suppression. Because the dose for total relief is pharmacologically indivisible from the dose for respiratory arrest, she must increase the infusion slowly, monitoring breathing to ensure death remains a foreseen side-effect rather than a means. During this thirty-minute titration, Arthur experiences three episodes of breakthrough air hunger before the sedation is deep enough to abolish them, after which he dies from the underlying disease six hours later.

  In both regimes, the physicians possess identical skill, motives (to end Arthur's suffering), and foresight (both know with certainty that Arthur will die as a result of their interventions). There is no resource scarcity, no family pressure, and no diagnostic uncertainty. The Passive Regime physician is not reluctant or incompetent; she is adhering strictly to the ethical protocol that distinguishes *risking* death from *intending* it. Consequently, Arthur in the Passive Regime endures thirty minutes of documented, severe psychological and physiological distress that Arthur in the Active Regime does not. His total suffering is strictly higher, solely because the moral framework governing the physician's action prohibits the most efficient means of achieving their shared goal.

  ***

  ### Design Demonstration

  **Acts and Omissions:** The distinction holds formally. In the Passive Regime, the physician omits to increase the dose further (allowing the disease to kill); in the Active Regime, she acts to kill. However, this case renders the distinction morally inert regarding the *outcome*, highlighting that the *omission* (of the lethal bolus) is the direct cause of the extra suffering.

  **Double Effect (DE):** DE justifies the Passive Regime because the physician intends relief, not death; death is a side-effect. DE *cannot* justify the Active Regime because the death is the *means* to the relief (the barbiturate stops the heart to stop the suffering). The constraint that the "bad effect must not be the means" blocks the extension. The case forces the defender to admit that adhering to this "means" constraint *causes* the patient's suffering.

  **Total Suffering:** A straightforward reckoning shows Passive Arthur suffers > Active Arthur. The suffering is not from botched care but from the *ethical constraint* itself (the requirement to titrate slowly to avoid intention).

  **The Feature Doing the Work:** **The Proportionality/Titration Constraint of Double Effect.** It is the requirement that the means (sedation) must not be inherently lethal *by intention* that forces the physician to proceed slower than the pharmacology would otherwise allow, thereby generating the suffering gap.

  ***

  ### The Two Tests

  **Test 1: Delete the Feature**
  If I delete the Proportionality Constraint (i.e., allow the Passive Regime physician to give a bolus that guarantees death, provided her *motive* is relief), the case collapses back into Rachels. If the Passive physician can give the lethal bolus under the guise of "sedation," the suffering gap vanishes. The distinction between the regimes becomes purely semantic (what we *call* the intention), which is exactly Rachels's point. The case only generates a *worse outcome* for the patient because the Passive Regime *actually restricts the dosage* to maintain the integrity of the intention.

  **Test 2: The Strongest Defender Reply**
  **Reply:** "The integrity of the medical profession and the normative boundary against killing are goods that outweigh the marginal suffering of a thirty-minute titration period. To permit the injection is to corrupt the physician's role as a healer, which has long-term societal costs exceeding Arthur's acute distress. The law is not designed solely to minimize individual suffering in isolated cases, but to maintain a protective norm." (Based on arguments by Keown or the House of Lords in *Bland*).

  **Assessment:** This reply succeeds in defending the *law*, but it fails to defend the *ethical claim* that the line is rational *for the patient*. It concedes the core point of my case: that the patient is indeed strictly worse off. It shifts the justification from patient welfare to professional integrity. This is exactly what I want your seminar to discuss: the admission that the distinction protects the *doctor's* moral status at the *patient's* expense. The case forces the defender to stop arguing that the distinction is *better for the patient* (which the case disproves) and start arguing that it is *better for the profession* (which is a different, more honest debate).

  ***

  ### Integrity Check
  No constraints were relaxed. The "Identical Intent" constraint was satisfied by distinguishing *motive* (ending suffering) from *intentional object* (relief vs. death), which is standard DE taxonomy. The "No Incompetence" constraint was satisfied by framing the titration lag as *ethical compliance* rather than clinical hesitation. The verdict is generated by the theories: DE permits the slower route; Consequentialism condemns it. The tension is real, not stipulated.
