          *   *Hypothesis:* The constraint "physicians... intend precisely the same thing" is the killer. If they intend death in the injection case, DE fails. If they intend relief in the sedation case, DE succeeds. But if they intend relief in *both*, DE should succeed in *both* unless the *means* constraint is invoked.
