      *   *Why can't A hold the intention?* Because A knows the trigger is noisy. To intend to retaliate *if the radar pings* is to intend to retaliate *even if it's a false alarm*. That's intending to kill innocents without cause.
      *   *Why is the squeamish option worse?* If A doesn't commit to the hair-trigger, B knows A will hesitate, verify, and then B can strike first during the verification window.

