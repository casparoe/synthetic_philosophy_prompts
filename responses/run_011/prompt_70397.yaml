      *   *Refining the Leak:* The leak needs to be in the *trigger condition* such that the leader intends to retaliate *if* the condition is met, but the condition might be met without an actual attack.
      *   *The "Threat" vs. "Warning" distinction:* A warning says "If you attack, X might happen because of chaos." A threat says "If you attack, I will make X happen." To make it a threat, the leader must commit to a policy of retaliation based on *evidence* of attack, even if that evidence is noisy.
      *   *Scenario:* Two nations, A and B. Disputed island chain. A deploys short-range missiles on the islands. B has superior conventional forces but fears A's missiles. A's radar/observation is notoriously glitchy in bad weather (the "leak"). A publicly commits: "Any launch detected from your mainland towards our islands will be met with immediate strike on your airfields."
      *   *Problem:* If A controls the fire, why is it leaky? Because A commits to trusting the sensor. If the sensor lies, A retaliates.
      *   *Wait, constraint check:* "Leader keeps full control over whether their own forces ever fire." Okay, so the leader *could* override the sensor. But to make it a *threat*, they must bind themselves to the sensor reading.
      *   *Better angle:* The "Leak" is epistemic. The trigger is "Perceived Attack." The leak is that "Perceived Attack" $\neq$ "Actual Attack."
      *   *Setting:* 1980s tech. Cold War vibe.
      *   *Specifics:* Nation A (defender, weaker) vs. Nation B (aggressor, stronger). A deploys a specific radar configuration known to have false positives during specific atmospheric conditions (e.g., temperature inversions). A *publicly announces* they will treat any radar lock as a confirmed strike initiation.
