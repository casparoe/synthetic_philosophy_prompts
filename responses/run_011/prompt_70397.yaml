      *   If A knows the radar is glitchy, can they intend to fire on a glitch? That's the ethical crux.

      *   *Let's refine the "Threat vs Warning" constraint.*
      *   Warning: "Our radar is old, it might go off by accident, and if it does, war might start." (Passive risk).
      *   Threat: "We have set our radar to this sensitivity *specifically so that* any blip causes retaliation, to ensure you don't test us." (Active policy).
      *   This distinction is vital.

      *   *Let's refine the "Squeamish Option".*
      *   If A says "We will verify before firing," B calculates: "Verification takes 5 minutes. In 5 minutes, my bombers are through. So I attack."
