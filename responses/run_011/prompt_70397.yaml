      *   But "Fire on contact" includes "Fire on ghost."
      *   So A must intend to "Fire on ghost" to make "Fire on contact" credible.

      *   *Finalizing the Scenario:*
      *   **Actors:** Republic of Ostral (A), Federation of Krevia (B).
      *   **Tech:** 1985 level. Analog radar, early digital processing.
      *   **Asset:** The Azure Channel (vital trade route).
      *   **System:** Ostral deploys "Sentinel" coastal batteries.
      *   **The Leak:** Sentinel radar has a known 5% false-positive rate during magnetic storms due to ionospheric scatter.
      *   **The Threat:** Ostral's Premier publicly orders Sentinel commanders to bypass the standard 3-minute verification protocol during storm seasons, reducing reaction time to 30 seconds. "Any track is a missile."
      *   **The Rationality:** Krevia knows the protocol change. Ostral knows the false-positive rate.
      *   **The Success:** Krevia cancels a planned naval incursion.
      *   **The Squeamish Alternative:** If Ostral keeps verification, Krevia attacks during a storm (knowing verification creates a window). Ostral loses the channel.

  3.  **Analyzing the Constraints:**

      *   *Fully informed/Rational:* Yes, both know the false positive rate and the protocol change.
      *   *Leak in Trigger:* Yes (radar ghost), not response (Premier can still order "hold," but has committed not to).
      *   *Deterrent Succeeds:* Yes, Krevia stays out.
      *   *Squeamish Worse:* Yes, without the protocol change, Ostral loses the channel.
      *   *Threat not Warning:* Yes, the protocol change is a deliberate policy choice, not just "radar is broken."

  4.  **Drafting the Analysis:**

      *   (a) **Adversary Reasoning:** Krevia calculates Expected Utility. Attack = Gain Channel - Risk of Retaliation. Retaliation Risk is high because Ostral removed the verification buffer. Even if Krevia *doesn't* attack, a storm could trigger Ostral. But Krevia knows Ostral *chose* this risk to raise the cost of entry. The credibility comes from the *sunk cost* of safety.
      *   (b) **Leader's Intention:** Can the Premier intend "If radar pings, I fire"?
          *   Condition: "Radar pings."
          *   Act: "Fire."
          *   Sincerity: "I will do it."
          *   Problem: The Premier knows "Radar pings" $\neq$ "Attack." So the intention is effectively "If nature makes a noise, I will kill Krevian sailors." This violates the *jus in bello* requirement of discrimination/proportionality *ex ante*. The conditional intention reply says "I only intend to kill if attacked." But here, the condition is "Radar pings," which is distinct from "Attacked." The Premier cannot sincerely hold the intention "I will kill only if attacked" while simultaneously holding the policy "I will kill if radar pings."
      *   (c) **Key Feature:** The *deliberate removal of verification*. If deleted (verification stays), it becomes a Sealed Threat (Leader decides if it's real). If deleted (radar just broken without policy change), it becomes a Warning (Risk exists, but no commitment).
      *   (d) **Defense Attack:** Defender says: "The Premier intends to retaliate against *hostile acts*. They treat the radar ping as *evidence*. They don't intend to kill innocents, they intend to defend, accepting risk."
          *   Counter: In sealed threats, the risk is zero (until the enemy acts). In leaky threats, the risk is non-zero *independent* of the enemy. Accepting that risk *is* the intention to harm innocents conditionally.
      *   (e) **Feasibility:** Are specs jointly satisfiable? Yes. The tension is real. The "Leak" forces the agent to intend an action based on a condition they know is imperfectly correlated with the moral justification.

  5.  **Refining the "Threat vs. Warning" nuance:**
      *   This is the hardest part. If I say "My dog bites," is that a threat or a warning? If I trained the dog to bite, it's a threat. If the dog is just rabid, it's a warning.
      *   In my scenario, Ostral *calibrated* the radar to be sensitive. That's the training.
