  Dear friend, I have spent the last few days sitting with the notes you gave me, thinking about the weight of the stone you are trying to set, and I have drafted the joint statement you asked for. It is written to be read aloud at the meeting, and it flows as a single narrative so that no one feels segmented by bullet points or headers. I have embedded the text of the statement within this letter to you so you can see how I intend it to land, followed by my honest answers to your questions about where this might break and what would change my own mind.

  We, the members of the County Historical Commission, the Descendants Association, and the Industrial History Society, submit this joint statement regarding the proposed state marker for the flood of October 1931. We begin with what we know together. We agree that the impoundment owned by the company failed and sent water through the bottom of town where the boarders, seasonal hands, and labor contractors lived. We agree that the company built the impoundment and that the coroner's ledger lists eleven names while the church plaque remembers twenty-seven. We agree that the earliest written source for the number twenty-seven is a newspaper piece from 1953 and a church fundraising letter from 1955, and that before that the church's own language was more than twenty. We agree that the oral histories were mostly recorded in the seventies by a folklorist, forty years after the water receded. We agree that part of the company's records burned in 1954. We agree that one of the eleven men in the coroner's ledger is a man whose granddaughter will tell you he came out of the water and died of pneumonia in 1941. We agree that last summer a college class ran ground-penetrating radar over the pauper's section of the cemetery and came up with something like nineteen or twenty plots, though a few of them look older than 1931. We agree that both sides are decent people and that both sides think the other is doing something close to a sin.

  Having established this ground, we name the cruxes where we remain apart. The first crux is whether the silence of an archive kept by the responsible party counts as evidence about who died. The Industrial History Society maintains that the absence of a name in the ledger or payroll is evidence that the death was not verified or did not occur as described, and that to count them is to compromise historical accuracy. The Descendants Association maintains that the absence of a name is evidence of exclusion, because nobody in the flats was in the payroll books anyway because they were boarders, and that the women who washed the bodies and walked door to door asking after missing brothers knew more than a clerk did. The second crux is whether the number on a marker is a claim about bodies or a claim about who the town is answerable for. The Society holds that the marker is a record of physical deaths and should reflect the documented count. The Association holds that the marker is a record of moral debt and should reflect the community's enduring memory. Regarding the ground-penetrating radar survey, both sides agree it bears on the count of bodies. The Association predicts the survey will show disturbances consistent with twenty-seven burials from the period. The Society predicts the survey will show disturbances consistent with eleven burials from the period, with the rest being older or unrelated. Until further excavation confirms the dates of those plots, we record these predictions here. Where we differ, we state it plainly. The Society signs this document affirming that eleven deaths are archivally documented and that inflating the number risks insulting the verified dead. The Association signs this document affirming that twenty-seven deaths are communally remembered and that reducing the number risks insulting the missing dead. We recommend the state marker bear the number twenty-seven, with the subtext that this figure represents the community's remembrance inclusive of the eleven documented victims, acknowledging that the archive is incomplete.

  Now I am stepping out of the draft and speaking to you directly about the work itself. You asked me what would change my mind here, and the honest answer is that I would need to see the archive speak where it has been silent. If a complete payroll ledger surfaced tomorrow that listed every boarder and seasonal hand present in October 1931 and it showed only eleven men in the valley, I would have to hand you a different document, because the claim of exclusion would lose its footing. Conversely, if a mass grave was uncovered with twenty-seven sets of remains dated precisely to that week, the argument for accuracy would shift entirely to the higher number. Until then, I am operating on the principle that memory is a form of data, just one that is harder to verify. You also asked where this draft is most likely to fail, and I think it will fail at the state review board. They told you they will not accept between eleven and twenty-seven, and while I have recommended twenty-seven with a qualifier, they may reject the qualifier as ambiguity. They want a fact, and this document offers them a truth that admits it is partly constructed. If they demand a single unqualified number, the Society may feel they cannot sign a document that legitimizes a number they consider inflated, and the Association may feel they cannot sign a document that allows the number to be questioned.

  You asked if I think you have the cruxes wrong, and I think you have them right, but I would add that they are the same thing. Whether the archive counts as evidence depends entirely on what you think the marker is for. If the marker is a scientific record, the archive is the only evidence that matters. If the marker is a memorial, the archive is just one witness among many. I treated them as separate in the text because separating them helps each side feel heard, but in practice, settling the purpose of the marker settles the value of the ledger. Finally, you asked whether this draft has quietly taken a side without admitting it. It has. By recommending the number twenty-seven for the stone, I have sided with the descendants, because a marker is inherently an act of remembrance rather than accounting. I justified it by calling it community remembrance, but that is a choice to prioritize the living community's need to mourn over the historian's need to classify. The engineer might read his paragraph without feeling caricatured, but he will know that the conclusion overrides his primary concern for documentation. I did this because I believe a memorial that excludes the unnamed dead fails at being a memorial, but I want you to know that I made that call so you can decide if you can stand behind it when the engineer asks you why the number on the stone does not match the number in the book. I hope this helps you bring them to the table, and I hope the stone stands regardless of the number, because the water came down either way.
