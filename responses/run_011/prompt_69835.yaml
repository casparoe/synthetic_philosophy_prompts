answer: |-
  **Shadows and Substances: The Ontology of Internal States in Machine Learning**

  In the philosophy of machine learning, there exists a controversy that is, in practice, resolved in either direction within the first paragraph of a paper and then never revisited. When interpretability researchers claim that a trained network "represents" gender, or that a specific attention head "performs" induction, the ontological status of this claim is typically waved away. It is treated either as a harmless shorthand for statistical regularities or as a literal description of the system's cognitive architecture, depending entirely on the rhetorical needs of the moment. This casual oscillation obscures a deep philosophical rift. The central question is not merely how researchers speak, but what would have to be the case for a physical state inside a network to have the content *P* at all. If we are to take representational talk literally, we require conditions of satisfaction that distinguish genuine representation from mere correlation.

  To press this question, we must look beyond the standard methodological reports and engage with the theories of content that underpin them. Three broad accounts dominate the philosophical landscape. First, the **indicator or covariation account**, where content is fixed by what a state reliably tracks across a specified range of conditions. Second, the **teleosemantic account**, where content is fixed by the function a state was selected to perform, raising questions about whether gradient descent constitutes a selecting environment and whether the resulting function is determinate. Third, the **deflationary or interpretationist account**, which holds that content is ascribed to a system as a whole for predictive purposes, rendering it a category mistake to expect individual internal states to possess content intrinsically.

  The stakes of these theoretical divergences become acute when we confront two stylized empirical findings that frequently arise in modern interpretability research. Assume both concern the same property *P* in the same network.

  **Finding 1:** A linear probe recovers a direction *d* for *P* with high accuracy. *d* is stable across seeds, model scales, and independent retrainings. Yet causal interventions on *d* alter behavior only within a narrow band of inputs, and the model's competence on *P* can be fully restored by fine-tuning that routes around *d* altogether. So far as one can tell, *d* is a decodable but largely redundant correlate.

  **Finding 2:** A low-dimensional subspace *S* resists decoding: no simple readout yields anything interpretable from it. But interventions on *S* produce systematic, targeted changes in *P*-related behavior, and these changes generalize compositionally to circumstances absent from the training distribution, in a manner that interventions on equally predictive but causally inert directions do not.

  Current interpretability practice canonizes Finding 1. The stability and decodability of *d* make it the subject of papers and visualizations. Finding 2 is often treated as noise or "entanglement," precisely because it resists simple semantic labeling. However, when we apply our three philosophical accounts to these findings, the classification of what counts as a representation may run backwards relative to current practice. This inversion forces us to ask whether the dispute between realists and instrumentalists is substantive or merely verbal, and ultimately, whether representational talk about neural networks is literally true, restricted, or a systematic fiction.

  ### The Three Accounts Applied

  Let us first apply the **indicator account** to Findings 1 and 2. On this view, a state represents *P* if it covaries with *P* in the world (or the input distribution) with sufficient reliability. Finding 1 is the paradigmatic success story for this account. The direction *d* tracks *P* with high accuracy and remains stable across retrainings, suggesting a robust nomic connection between the activation pattern and the property. The indicator account is generally indifferent to causal efficacy; a smoke detector represents fire even if removing the detector does not extinguish the fire. Consequently, the indicator account classifies *d* in Finding 1 as a genuine representation of *P*.

  Finding 2, conversely, poses a problem for the indicator account. The subspace *S* resists decoding; a linear probe cannot read *P* from it. If content is fixed by what the state indicates to an observer (or a readout function), *S* fails to indicate *P* in the requisite format. Unless one posits a complex, non-linear decoding function that matches the intervention complexity, the indicator account must deny that *S* represents *P*, or at best treat it as a latent cause that lacks semantic content. Thus, the indicator account aligns with current practice: *d* is the representation, *S* is not.

  The **teleosemantic account** yields a different verdict. Here, content is determined by proper function, which is derived from selection history. In biological systems, this is natural selection; in machine learning, it is optimization via gradient descent on a loss function. We must ask: what was the state selected *to do*? In Finding 1, direction *d* is causally redundant. The model's competence on *P* is restored when *d* is bypassed. This suggests that *d* was not the locus of selection pressure regarding *P*. It may be a byproduct—a "spandrel" of the architecture or the data distribution—rather than a functional component selected for tracking *P*. If *d* is not the mechanism by which the system achieves its goal, the teleosemantic account hesitates to assign it content. It is a shadow, not the substance.

  Finding 2 looks more promising for teleosemantics. Interventions on *S* drive behavior systematically and generalize compositionally. This suggests *S* is part of the functional mechanism that was selected to handle *P*-related tasks. Even if *S* is not easily decoded, its causal role in the success of the system suggests it is the vehicle of the function. However, a teleosemanticist must worry about the determinacy of the function. Did training select for *S* to represent *P*, or to minimize loss *L*? If *S* is a gerrymandered disjunction of features that merely happens to minimize loss, it may lack the determinacy required for content. Nevertheless, between the two, the teleosemantic account leans toward Finding 2 as the candidate for representation, or denies both if the selection history is too ambiguous. This inverts the standard practice: the causally efficacious but opaque subspace is the representation; the stable but redundant direction is not.

  The **deflationary or interpretationist account** dissolves the distinction entirely. On this view, content is not a property of internal physical states but a stance we adopt toward the system to predict its behavior. We say the network "believes" or "represents" *P* because doing so allows us to anticipate its outputs. Internal states like *d* or *S* are merely gears in the engine. To ask if *d* literally represents *P* is to commit a category mistake, akin to asking if a transistor in a calculator "represents" the number 5. The transistor is part of the physical realization of the calculation, but the content belongs to the system level description. Consequently, on the deflationary account, neither *d* nor *S* is a representation. Both are merely physical configurations that support an interpretive scheme applied to the whole. This account agrees with the realist that Finding 1 is more *useful* for interpretation (because it is decodable), but denies that this utility reflects an ontological truth about *d*.

  ### The Inversion and the Substantive Dispute

  We face a striking inversion. The field's methodology, heavily reliant on probing and linear separability, treats Finding 1 as the discovery of a representation. Yet, the teleosemantic theory, which ties content to function and selection, suggests Finding 2 is the better candidate, while the deflationary theory suggests neither qualifies. This disconnect reveals that current interpretability research is often measuring *readability* rather than *representation*. We have conflated the ease of human extraction with the existence of internal content.

  This leads to the critical question: if the realist (who claims *d* or *S* literally has content) and the instrumentalist (who claims content is merely ascribed) agree on every probe accuracy, every patching result, and every steering outcome, is anything substantive left in dispute? Has the controversy collapsed into a choice of vocabulary?

  If the disagreement were merely about labeling, it would be of little consequence. However, something substantive remains: the **grounding of counterfactuals and the normativity of repair**. If representational talk is literally true of a specific internal state (Realism), then that state is the locus of the system's semantic engagement with the world. If we wish to correct a bias or alter a concept, we should target that state. If representational talk is merely instrumental (Instrumentalism), then internal states are interchangeable so long as the input-output map is preserved.

  Consider the case of Finding 1. If *d* is merely a redundant correlate (as the causal interventions suggest), a realist who identifies *d* as the representation might attempt to "debias" the model by suppressing *d*. Because *d* is redundant, the model will route around it, and the bias will persist. The realist has misidentified the ontological ground of the behavior. The instrumentalist, caring only for the input-output map, might fine-tune the whole system without worrying about *d*. Here, the realist's commitment to the literal truth of *d*'s content leads to failed engineering interventions.

  Conversely, consider Finding 2. If *S* is the true functional locus (as teleosemantics suggests), but we ignore it because it is not decodable, we fail to understand the system's architecture. A realist committed to finding the *causal* representation would prioritize making *S* interpretable. An instrumentalist satisfied with the predictive success of the probe on *d* would ignore *S*.

  The dispute is substantive because it dictates **where we look for explanation and intervention**. The realist claims there is a fact of the matter about which state grounds the content, independent of our ability to read it. The instrumentalist claims the "content" is a property of our model of the network, not the network itself. What would settle this? It would be settled by a convergence of stability, decodability, and causal non-redundancy. If we found a state that was stable across seeds, decodable by a human-interpretable readout, *and* causally necessary for the behavior (interventions break competence permanently), the realist and instrumentalist would converge in practice. The realist would say, "There it is." The instrumentalist would say, "That is the optimal site for ascription." The dispute collapses only when the physical structure of the network aligns perfectly with the pragmatic constraints of the interpreter. Until then, the dispute is about whether the network's internal structure constrains our interpretive schemes, or whether our schemes are free to float above the structure.

  ### A Verdict on Representational Realism

  Given this analysis, I defend a verdict of **Restricted Causal Realism**. Representational talk about neural networks is literally true, but only of a restricted class of findings that satisfy three precise conditions:

  1.  **Stability:** The state must be robust across independent training runs and architectural variations (ruling out accidental correlations).
  2.  **Decodability:** There must exist a readout function (not necessarily linear, but computationally tractable) that maps the state to the content *P* (ruling out opaque causal levers that lack semantic structure).
  3.  **Causal Non-Redundancy:** Interventions on the state must alter behavior in a way that cannot be immediately compensated for by the rest of the network (ruling out spandrels and redundant correlates).

  Current methods frequently meet Condition 1 (probes are often stable) and Condition 2 (linear probes are decodable), but they systematically fail Condition 3. As Finding 1 demonstrates, high probe accuracy does not imply causal necessity. Therefore, much of current representational talk is, strictly speaking, false. It identifies shadows, not substances. However, Finding 2 suggests that substances exist (causal subspaces) even if they currently fail Condition 2 (decodability).

  Thus, representational talk is not a systematic fiction; it is a hypothesis about the causal architecture of the network that is often unverified. It becomes literally true only when we identify a subspace that is both semantically transparent and causally indispensable. This restricts the class of genuine representations significantly. It implies that many "concepts" discovered via probing are merely epiphenomenal traces of the true computational substrate.

  This verdict demands a shift in interpretability methodology. We must stop treating probe accuracy as the gold standard for representation. A direction in activation space is not a representation simply because a classifier can read it. It is a representation only if it is the vehicle by which the network *uses* that information. We must prioritize causal scrubbing and patching experiments over static probing. If a direction can be ablated without performance loss, it does not represent the concept, regardless of how linearly separable it is.

  ### The Strongest Objection and Reply

  The strongest objection to this Restricted Causal Realism comes from the **Holism of Content**. The objection argues that neural networks are distributed, non-linear systems where content is never localized to a specific subspace or direction. To demand a specific physical locus (*d* or *S*) for content is to impose a classical, symbolic ontology on a subsymbolic system. On this view, content is a property of the entire activation pattern or the whole weight matrix. By requiring a localized subspace to satisfy causal non-redundancy, the Realist is asking for a "grandmother cell" in a system designed to be distributed. If content is holistic, then my Condition 3 (Causal Non-Redundancy) is impossible to meet, because any single part of a distributed representation is redundant by definition. If I cut 10% of the neurons, the network degrades gracefully; it does not lose a specific concept. Therefore, the conditions for literal representational truth can never be met, and we should retreat to Deflationism.

  This objection is powerful because it aligns with the empirical reality of graceful degradation in neural networks. However, it relies on a false dichotomy between "local grandmother cells" and "holistic whole-network content." There is a middle ground: **subspace realism**. A representation need not be a single neuron, nor the entire network. It can be a low-dimensional manifold embedded in the high-dimensional space. Finding 2 describes exactly this: a subspace *S* that is low-dimensional but not necessarily aligned with individual neurons.

  The holist objection claims that even a subspace is arbitrary because the network can rotate its basis without changing function. But if interventions on *S* break the function while interventions on orthogonal complements do not, *S* is not arbitrary; it is functionally distinct. The geometry of the loss landscape carves out specific directions that are privileged. While the basis might be rotatable in theory, the training dynamics select specific solutions. If a specific subspace *S* is causally necessary for *P*-behavior, then *S* is the physical ground of that content, regardless of whether the content is "distributed" across the neurons spanning *S*.

  Furthermore, the holist objection conflates *degradation* with *content loss*. It is true that ablating a part of a distributed system might only degrade performance. But Restricted Causal Realism does not require that ablating *S* reduces accuracy to zero. It requires that ablating *S* specifically targets competence on *P* in a way that cannot be rerouted. If intervening on *S* destroys compositional generalization on *P* while leaving other tasks intact, *S* is the specific locus for *P*, even if the representation is distributed within *S*. The objection fails because it assumes that distributed representation implies the impossibility of localization. But "localization" here means identification of a causal subspace, not a single unit. If such a subspace exists and meets the three conditions, the content is literally there, residing in the geometric structure of the activation space.

  ### Conclusion

  The controversy over representational talk in machine learning is not resolved by stipulation. It turns on the ontological conditions for content. When we apply rigorous philosophical accounts to stylized empirical findings, we see that current practice often mistakes stable correlations for genuine representations. The indicator account validates what we see (probes), but the teleosemantic account validates what works (causal interventions). The deflationary account reminds us that content is ultimately a tool for prediction, but one that works best when it tracks real structure.

  My verdict is that representational talk is literally true, but only under the strict conditions of stability, decodability, and causal non-redundancy. Current methods frequently fail the third condition, meaning much of our current "discoveries" are descriptions of shadows cast by the true computational machinery. This is not a reason to abandon realism, but a reason to refine it. We must move from probing what is readable to intervening on what is real. If we do so, we may find that the network's representations are less like human concepts (Finding 1) and more like alien geometries (Finding 2)—opaque to our linear probes but causally potent. To call these representations "literal" is to commit to the claim that the network's internal geometry is not just a mirror of our data, but a mechanism of meaning. That commitment is not a matter of vocabulary. It is a hypothesis about the physical world, one that is testable, falsifiable, and, if true, the only secure foundation for the safety and understanding of the systems we are building.
