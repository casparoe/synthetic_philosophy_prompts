answer: |-
  Here is a structural plan for the two-hour session. It is designed to disentangle the three claims, manage the classroom dynamics, and give you a defensible pedagogical position.

  ### 1. The Sequence of Concepts
  You cannot teach these simultaneously. They must be layered. If you introduce sensitive dependence before overdetermination, you validate the "Great Man" theory you want to avoid. If you introduce path dependence before sensitive dependence, students won't understand *why* the path was chosen.

  **Order of Operations:**
  1.  **Overdetermination (The Landscape):** Establish the baseline. Most historical outcomes are robust. Remove one cause, the outcome holds. This validates Carr and calms the "counterfactuals are everything" camp.
  2.  **Sensitive Dependence (The Trigger):** Introduce the exception. In specific, unstable contexts, small variations in initial conditions yield divergent outcomes. This validates the "counterfactuals matter" camp but restricts it to specific moments.
  3.  **Path Dependence (The Lock-In):** Explain the consequence. Once a divergent outcome occurs, increasing returns or institutional rigidities make reversing it impossible. This bridges the gap between the accident and the long-term structure.

  **Why this order?**
  *   **Overdetermination** sets the boundary conditions (most of history).
  *   **Sensitive Dependence** identifies the critical junctures (rare moments).
  *   **Path Dependence** explains the durability of the result (why the accident becomes history).

  **Distinction Note:** Sensitive Dependence and Path Dependence are *not* the same.
  *   *Sensitive Dependence* is about **divergence** (a tiny push sends the ball down a different valley).
  *   *Path Dependence* is about **constraint** (once in the valley, you cannot climb out).
  *   You need Sensitive Dependence to get onto a specific Path; you need Path Dependence to ensure that choice matters decades later.

  ### 2. The Case Study
  **Your instinct is correct: Drop Sarajevo.**
  The Archduke's driver taking a wrong turn is the perfect example of sensitive dependence, but it is a pedagogical trap for this group. It tempts students to conclude WWI was *purely* accidental, ignoring the alliance systems, militarism, and nationalism (the overdetermined kindling). It reinforces the "history turns on individuals" fallacy.

  **Recommended Case: The 1945 UK General Election.**
  It is accessible to all historians, allows for economic analysis (your strength), and cleanly separates the three concepts.

  *   **Overdetermination (The Kindling):** War weariness, desire for social reform, union strength, the failure of appeasement in the 30s. A Conservative victory was structurally unlikely regardless of the campaign.
  *   **Sensitive Dependence (The Spark):** Churchill's "Gestapo" speech. A specific rhetorical choice in a specific week. In a tighter race, this could have tipped the margin. It illustrates how a tiny input (a speech) interacts with a volatile system (a tired electorate).
  *   **Path Dependence (The Lock-In):** The creation of the NHS and the Welfare State. Once established, these institutions created constituencies and expectations that locked British politics into a consensus for 30+ years. Reversing it became politically impossible (increasing returns).

  **Why this works:** It prevents the "Great Man" error (Churchill lost *despite* being a hero, due to structure) while acknowledging contingency (the campaign mattered) and showing long-term consequence (the NHS lock-in).

  ### 3. Misconceptions and Management
  Anticipate these in this specific order.

  **A. "Chaos means randomness." (Hour 1, during Sensitive Dependence)**
  *   **The Trap:** Students equate unpredictability with lack of cause.
  *   **The Fix:** Emphasize *deterministic* chaos. The system follows rules, but we cannot measure the starting conditions precisely enough to predict the outcome. The 1945 vote wasn't random; it was a complex reaction to stimuli that was too sensitive to model perfectly in 1945.
  *   **Script:** "Contingency is not dice-rolling. It is causality that is too fine-grained for us to measure."

  **B. "If it's unpredictable, there's nothing to explain." (Hour 1, follow-up)**
  *   **The Trap:** If we can't predict, why are we historians?
  *   **The Fix:** Distinguish *prediction* from *retrodiction*. We cannot predict the spark, but we can explain why the kindling burned once lit.
  *   **Script:** "History is not meteorology. We are explaining why the fire happened, not claiming we could have forecast the lightning strike."

  **C. The Ex-Actuary / Lyapunov Exponents. (Hour 2, during Path Dependence)**
  *   **The Trap:** A student demands mathematical rigour for "sensitive dependence," stalling the session.
  *   **The Fix:** Concede the technicality, bracket the application. Do not let this become a maths seminar.
  *   **Script:** "You are right that this has a formal mathematical definition in dynamical systems. We are not doing dynamical systems today; we are doing historical causation. The *logic* of the concept applies even if we aren't calculating the exponents. I will talk to you about the maths after class, but for the group, we are treating it as a qualitative heuristic."

  ### 4. The "Spark and Kindling" Handle
  **Verdict:** It survives, but needs a warning label.
  It is an excellent metaphor for **Overdetermination (Kindling)** vs. **Sensitive Dependence (Spark)**.

  **The Risk:** It implies that if the kindling is dry enough, *any* spark will do. This leads to "inevitability."
  **The Correction:** You must explicitly state that sometimes the kindling is damp. Sometimes there is no fire, even with a spark. Sometimes the spark is overdetermined (someone *would* have lit it).
  **Usage:** Use it to explain why Carr is mostly right (usually the kindling is wet or the spark is inevitable), but why the counterfactualists are sometimes right (sometimes the kindling is dry, and the specific spark determines *when* and *how* it burns).

  ### 5. Final Assessment and Refusal
  **The Closing Question (10 mins before end):**
  Do not ask "Are counterfactuals useful?" (Too vague).
  Ask: **"Construct a minimal-rewrite counterfactual for our case study that changes the trigger but keeps the outcome. Then construct one that changes the trigger and changes the outcome. What structural condition differs between the two?"**

  *   *Why:* This forces them to identify the boundary between overdetermination (outcome stays same) and sensitive dependence (outcome changes). It tests if they understand *where* contingency applies.

  **The Explicit Refusal:**
  Students will ask: *"Can we use counterfactuals in our dissertations?"*
  **Your Answer:** "You may use them as a heuristic to test the weight of a cause, but I will not teach you how to assign probabilities to singular past events."

  *   **What you are refusing:** The claim that we can say "There was a 40% chance Labour lost in 1945."
  *   **Why:** Single-case probability is philosophically incoherent in history (frequentist probability requires repeatable trials).
  *   **The Practical Rule:** "Use counterfactuals to show *necessity*, not to calculate *likelihood*. Write 'Without X, Y is unlikely' to demonstrate X's importance. Do not write 'There was a 50% chance of X'."

  ### Summary Timeline (120 Minutes)
  *   **00-15:** Intro. Carr's challenge. The "Game vs. Truth" polarization.
  *   **15-45:** **Overdetermination.** The 1945 structural context. Spark/Kindling metaphor introduced.
  *   **45-75:** **Sensitive Dependence.** The Campaign/Churchill's Speech. Distinguish Chaos from Randomness. Handle the Actuary.
  *   **75-105:** **Path Dependence.** The NHS/Welfare State. Lock-in and Increasing Returns.
  *   **105-120:** Synthesis. The Closing Question. The Refusal on Probability. Dissertation advice.
