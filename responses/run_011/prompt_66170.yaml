      *   *Check:* Is the political point valid? Mencius definitely supports regicide against tyrants (King Wu). Xunzi is more conservative but still distinguishes a true King from a tyrant. The student's point about *authority of teachers* is stronger than the *authority of rulers* point. I should note that distinction.
