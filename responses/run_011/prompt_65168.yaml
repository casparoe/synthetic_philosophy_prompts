  1.  **Analyze the Request:**
      *   **User:** Executive Director of a small housing nonprofit (3 years).
      *   **Situation:** Relies heavily on a friend (not a colleague) for critical ethical/strategic decisions (gifts, staffing, publicity). Never regretted advice. Best outcomes trace to it.
      *   **Troubles:**
          1.  Can no longer articulate the *reasons* behind decisions to staff (just "didn't sit right"), whereas before could explain details.
          2.  Can no longer anticipate her advice (used to be able to).
      *   **Friend's Argument:** It's like deferring to an accountant or lawyer. She's better at this, so trust her.
      *   **User's Feeling:** It doesn't feel like the accountant case.
      *   **Decision Point:** Whether to add her to the board with formal veto power.
      *   **Format:** Four specific sections with specific word counts.
          1.  "What is actually at issue" (~150 words)
          2.  "The case that my friend is right" (~200 words)
          3.  "The case that my unease tracks something real" (~250 words)
          4.  "What I should do about the board seat" (~150 words, ending in a definite recommendation)

  2.  **Drafting - Section 1: "What is actually at issue"**
      *   *Goal:* Identify the core philosophical/operational difference between deferring to a technical expert (accountant) vs. a moral/strategic advisor (friend).
      *   *Key distinction:* Accounting/Law is technical compliance vs. Leadership/Ethics is values-based judgment.
      *   *Drafting ideas:* The accountant ensures rules are followed; the friend shapes values. The issue isn't expertise, it's agency and articulation. If you can't explain the "why," you can't lead.
      *   *Word count check:* Need around 150 words.
      *   *Draft:* The core issue is not expertise, but agency and moral articulation. Deferring to an accountant concerns technical compliance with external rules; deferring to your friend concerns internal values and strategic identity. An accountant tells you what is legal; a leader must decide what is right. When you outsource ethical judgment, you risk losing the ability to embody your organization's mission. The problem isn't that she advises you, but that you can no longer explain the reasoning to your staff. Leadership requires translating values into action. If you cannot articulate why a gift was rejected beyond "it didn't sit right," you cease to be the moral author of your organization. The question is whether you are retaining executive responsibility or quietly abdicating it to someone without formal accountability.

  3.  **Drafting - Section 2: "The case that my friend is right"**
      *   *Goal:* Argue for the friend's perspective (efficiency, expertise, trust).
      *   *Key points:* Specialization is good. She has a track record. Emotional detachment helps. Board role formalizes good practice.
      *   *Drafting ideas:* Specialization is the backbone of management. You hire experts for things you aren't good at. She has a perfect track record. You admit you used to anticipate her, meaning you learned, but now the decisions are harder. Her detachment is an asset. Formalizing it ensures stability.
      *   *Word count check:* Need around 200 words.
      *   *Draft:* Your friend's analogy holds weight regarding specialization and efficacy. Executive leadership demands recognizing one's own blind spots. Just as you lack the technical training to audit books, you may lack the specific moral clarity or strategic detachment required for high-stakes ethical dilemmas. Her track record is flawless; your best outcomes trace directly to her counsel. In nonprofit management, results matter. If her guidance consistently protects the mission and ensures sustainability, resisting it based on a vague feeling of discomfort may be ego masquerading as principle. Furthermore, her external position offers objectivity you cannot cultivate internally. You are immersed in the daily grind; she sees the arc. Formalizing her role could stabilize decision-making during crises. If the outcome is consistently superior, the mechanism of delivery is secondary. Trusting a proven advisor isn't abdication; it's smart resource allocation. You remain the signer of the check, even if the idea wasn't yours. Leadership often means curating the best advice available, not generating every insight personally.

  4.  **Drafting - Section 3: "The case that my unease tracks something real"**
      *   *Goal:* Validate the user's intuition. Why is this different from an accountant?
      *   *Key points:* Moral agency, organizational culture, accountability, the "black box" problem. Staff need to understand the "why."
      *   *Drafting ideas:* Accountants deal with facts; friends deal with values. Values must be owned by the leader. If staff don't understand the "why," culture erodes. You can't outsource conscience. The inability to anticipate means you've stopped engaging deeply. Formal veto power creates a shadow executive.
      *   *Word count check:* Need around 250 words.
      *   *Draft:* However, the accountant analogy fails because technical compliance differs fundamentally from moral reasoning. Accounting is binary; ethics are narrative. When you reject a donor, you are defining who you are. If you cannot articulate the reasoning, you cannot transmit that identity to your staff. Your junior staffer's confusion signals a cultural fracture. Leadership is not just making the right call; it is teaching the organization how to make future calls. By relying on a "black box" advisor, you stunt your team's ethical development. Moreover, your inability to anticipate her advice suggests you have disengaged from the reasoning process itself. You are no longer thinking *with* her, but simply obeying. This creates a accountability vacuum. She holds no fiduciary duty; you do. If her advice leads to scandal, you bear the legal and reputational ruin, not her. Granting a formal veto codifies this shadow governance, potentially undermining board cohesion. The discomfort you feel is the erosion of your own executive muscle. A leader who cannot explain their decisions is merely a messenger. Over time, this dependency will weaken your authority and confuse your mission. The "feel" of the situation differs because one preserves your agency, while the other quietly consumes it.

  5.  **Drafting - Section 4: "What I should do about the board seat"**
      *   *Goal:* Recommendation on the veto/board seat.
      *   *Key points:* Don't give veto. Keep her as advisor but regain articulation.
      *   *Drafting ideas:* No veto power. It breaks governance. Keep her as informal advisor but change the dynamic. Require yourself to articulate the reasoning before acting.
      *   *Word count check:* Need around 150 words. Must end with a definite recommendation.
      *   *Draft:* Do not grant her a board seat with veto power. This formalizes a shadow hierarchy that violates nonprofit governance norms and risks alienating other board members who hold fiduciary responsibility. Instead, maintain her as an informal advisor but change the terms of engagement. Require yourself to articulate the rationale behind her advice to your own satisfaction before acting. If you cannot explain it to your staff, you are not ready to implement it. Use her as a sounding board, not a decider. Reclaim the cognitive work of leadership. Your goal should be to regain the ability to anticipate her advice by internalizing her framework, not by outsourcing the judgment. This restores your agency while preserving her wisdom.
      *   *Recommendation:* Decline the formal veto role.

