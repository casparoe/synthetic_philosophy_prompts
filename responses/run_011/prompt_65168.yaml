  What is actually at issue

  The core issue is not expertise, but agency and moral articulation. Deferring to an accountant concerns technical compliance with external rules; deferring to your friend concerns internal values and strategic identity. An accountant tells you what is legal; a leader must decide what is right. When you outsource ethical judgment, you risk losing the ability to embody your organization's mission. The problem isn't that she advises you, but that you can no longer explain the reasoning to your staff. Leadership requires translating values into action internally. If you cannot articulate why a gift was rejected beyond "it didn't sit right," you cease to be the moral author of your organization. Your team cannot learn from decisions they do not understand. The question is whether you are retaining executive responsibility or abdicating it to someone without formal accountability. This distinction matters because technical errors are fixable, but moral authority is not.

  The case that my friend is right

  Your friend's analogy holds weight regarding specialization and efficacy. Executive leadership demands recognizing one's own blind spots. Just as you lack the technical training to audit books, you may lack the specific moral clarity or strategic detachment required for high-stakes ethical dilemmas. Her track record is flawless; your best outcomes trace directly to her counsel. In nonprofit management, tangible results matter. If her guidance consistently protects the mission and ensures sustainability, resisting it based on a vague feeling of discomfort may be ego masquerading as principle. Furthermore, her external position offers objectivity you cannot cultivate internally. You are immersed in the daily grind; she sees the arc. Formalizing her role could stabilize decision-making during crises. A board seat ensures her voice is heard when you are unavailable. It protects the organization from your potential burnout or bias. This structure also provides continuity if you depart. Ethical rigor becomes institutionalized. If the outcome is consistently superior, the mechanism of delivery is secondary. Trusting a proven advisor isn't abdication; it's very smart resource allocation. You remain the signer of the check, even if the idea wasn't yours. Leadership often means curating the best advice available, not generating every insight personally.

  The case that my unease tracks something real

  However, the accountant analogy fails because technical compliance differs fundamentally from moral reasoning. Accounting is binary; ethics are narrative. When you reject a donor, you are defining who you are. If you cannot articulate the reasoning, you cannot transmit that identity to your staff. Your junior staffer's confusion signals a cultural fracture. Leadership is not just making the right call; it is teaching the organization how to make future calls. By relying on a "black box" advisor, you stunt your team's ethical development. Staff must see values in action to replicate them. Without explanation, rules appear arbitrary. This breeds resentment or blind compliance, building no healthy culture. You model dependency, not integrity. Moreover, your inability to anticipate her advice suggests you have disengaged from reasoning process itself. You are no longer thinking *with* her, but obeying. This creates a accountability vacuum. She holds no fiduciary duty; you do. If her advice leads to scandal, you bear the legal and reputational ruin, not her. Granting a formal veto codifies this shadow governance, potentially undermining board cohesion. A board veto creates a conflict of interest. She advises, then votes on performance. This blurs oversight lines essential for nonprofit health. The discomfort you feel is the erosion of your executive muscle. A leader who cannot explain their decisions is merely a messenger. Over time, this dependency will weaken your authority and confuse your mission. The "feel" of the situation differs because one preserves your agency, while the other quietly consumes it.

  What I should do about the board seat

  Do not grant her a board seat with veto power. This formalizes a shadow hierarchy that violates nonprofit governance norms and risks alienating other board members who hold fiduciary responsibility. It creates a two-tiered board structure that is legally very precarious and culturally damaging. Instead, maintain her as an informal advisor but change the terms of effective engagement significantly. Require yourself to articulate the rationale behind her advice to your own satisfaction before acting. If you cannot explain it to your staff, you are not ready to implement it. Use her as a sounding board, not a decider. Reclaim the cognitive work of leadership. Your goal should be to regain the ability to anticipate her advice by internalizing her framework, not by outsourcing the judgment. This restores your agency while preserving her wisdom. You must remain the clear primary moral author of your organization's choices. You should strongly decline the formal veto role.
