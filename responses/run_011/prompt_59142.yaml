  ### 1. Mapping the Auction

  To map Concorde to Shubik's Dollar Auction, we must identify the structural components without forcing the geometry.

  *   **Players:** In the standard auction, two bidders compete. In Concorde, the UK and France were partners, not rivals. If we treat them as a single unit (Europe), the rival must be external (US/USSR) or internal (The Alternative Use of Capital). Given the US SST cancellation in 1971 and Tu-144 withdrawal in 1978, the external rivals exited the game. This leaves the **Successive Governments/Administrations** as the bidders. Administration A commits funds; Administration B must decide whether to honor that commitment or default.
  *   **Prize:** Initially, the prize was a profitable supersonic fleet. By 1976, the prize had mutated into **operational capability + avoidance of cancellation penalties**.
  *   **Bids:** Annual budget allocations and operating subsidies.
  *   **Loser-Pays Feature:** This is the critical mechanism. In Shubik's game, the second-highest bidder pays their bid and gets nothing. In Concorde, the "Loser" is the **Cancellation Option**.
      *   If the project continues (High Bidder): You pay the sunk cost + new marginal cost, but you retain the asset (however worthless).
      *   If the project cancels (Loser): You pay the sunk cost (written off) **PLUS** the treaty cancellation penalty (per your supplied facts) **PLUS** the political cost of job losses and national humiliation.
      *   *Analysis:* The "Loser-Pays" feature is supplied by the **1962 Treaty Clause and Domestic Political Accountability**. The penalty for withdrawing (losing) was structurally higher than the marginal cost of continuing (bidding), creating the trap. The "Second Bidder" is the ghost of the investment already made; if you stop, that investment becomes a pure loss (the loser's payment).

  *Flag on Treaty:* You noted the cancellation clause is "shakier." Historically, the legal penalty is debated, but the *political* penalty (betraying an ally, destroying a joint industrial base) functioned identically to a financial penalty. I am treating the "expensive withdrawal" as functionally true per your instructions.

  ### 2. The Decaying-Prize Dollar Auction

  In this variant, the prize value $V_t$ decreases exogenously every round $t$, independent of bidding.

  *   **Rational Bidding Range:** In a standard auction, rational bidding stops when Bid $\ge$ Prize Value ($B \ge V$). In the Dollar Auction, the trap engages when $B > V$ but $B < \text{Sunk Cost}$.
  *   **Effect of Decay:** Decay shrinks the *rational* ceiling ($V_t$ drops). However, it does **not** shrink the *sunk cost* floor (past bids are fixed). Therefore, decay **expands** the "Trap Zone" (the range where $V_t < \text{Bid} < \text{Sunk Cost}$). As the prize becomes worthless, the incentive to bid to avoid realizing the sunk loss becomes *stronger* relative to the prize value.
  *   **Dominant Strategy:** Is there a round where passing is dominant?
      *   Condition to Bid: $\text{Marginal Cost of New Bid} < \text{Cost of Losing (Sunk Cost + Penalty)}$.
      *   Condition to Pass: $\text{Marginal Cost} > \text{Cost of Losing}$.
      *   As long as the sunk cost is large enough, passing is *never* dominant in the short term, even if $V_t$ is tiny.
  *   **Negative Prize ($V_t < 0$):** Once the prize is a liability (e.g., an asset that costs money to hold), the game transforms.
      *   Standard Auction: No one bids.
      *   Dollar Auction: Bidding continues if $\text{New Bid} + \text{Negative Prize} > -\text{Sunk Cost}$.
      *   Essentially, you are bidding to avoid the "Loser Penalty." If the penalty for cancellation (writing off sunk costs + treaty fines) is greater than the cost of subsidizing the negative prize, rational loss-minimization dictates you keep bidding.
      *   *Equilibrium:* Theoretically, backward induction suggests stopping before $V_t$ turns negative. Behaviorally, the trap ensures escalation continues until the marginal cost of the next subsidy exceeds the *total* avoidable loss of cancellation. It turns into a contest over who eats the smaller loss: the "Winner" holds the liability but avoids the write-off; the "Loser" realizes the write-off.

  ### 3. Application to Concorde (Post-1973)

  *   **Explains:** The model explains why escalation continued after the prize (profitability) decayed to zero. The "Loser-Pays" mechanism (Treaty + Political Sunk Cost) meant that cancelling was more expensive than subsidizing. The decaying-prize variant explains why the escalation felt increasingly desperate: the gap between the asset's value and the cost to keep it widened, yet the bidding continued because the "Loser Penalty" (the £2bn write-off) remained static and massive.
  *   **Misdescribes:** The model requires a dynamic where "bidding" prevents a loss imposed by a rival or the rules. Post-1978, there was no rival. The US and USSR had exited. A single-player game cannot be an auction. The model implies a strategic interaction that didn't exist in the 1980s-2000s.
  *   **Silences:**
      1.  **Prize Redefinition:** The model assumes a fixed prize structure that decays. It is silent on the *political redefinition* of the prize (from "profit" to "prestige" to "heritage"). The Dollar Auction model cannot explain why the players didn't simply re-evaluate the "Loser Penalty." Why was the political cost of cancellation fixed at "unacceptable" for 25 years?
      2.  **The Missing Rival:** A competitive-auction model cannot explain escalation that continued for 25 years after the last competitor was gone. In Shubik's game, if the other bidder folds, the auction ends. Concorde continued because the "other bidder" was internal (the Treasury vs. the Ministry of Aviation), but that is a principal-agent problem, not an auction.
      3.  **Termination:** The model predicts escalation until resource exhaustion. Concorde ended in 2003 due to a specific shock (Air France crash + Airbus consolidation + retirement of fleets), not because the "bidding" logically concluded.

  ### 4. Escalation-of-Commitment Theory & Falsification

  The Concorde case strains escalation theory to the breaking point. To keep Concorde inside a rational-choice story, we must enlarge the "Prize" to include intangible assets (prestige, treaty credibility, jobs). If the payoff is allowed to be whatever is required to make the observed behavior rational, the theory loses predictive power. It becomes a tautology: "They continued, therefore the intangible value must have exceeded the cost."

  *   **Falsifying Observation:** To falsify an escalation account of Concorde, you would need evidence that the decision to continue was made **independently of sunk costs**.
      *   *Specific Observation:* Discovery of Cabinet or Board minutes from 1975 onwards explicitly stating: "We ignore the £1.5bn already spent. We have calculated the future Net Present Value of the project alone, and it is positive."
      *   If such a document existed, it would prove the continuation was a rational investment decision based on future cash flows, not an escalation of commitment driven by past losses. Conversely, if minutes show the NPV was known to be negative but the project continued *solely* to avoid the "embarrassment" of the sunk cost, the theory holds. The absence of such forward-looking rationality documentation is the current evidence for escalation; its presence would falsify it.

  ### 5. Contrast Case: US SST (Boeing 2707)

  The US SST died in 1971; Concorde lived until 2003. Both faced decaying prizes (oil, economics).

  *   **Why the 2707 Died:** The US program lacked the **Loser-Pays Lock-In**.
      1.  **No Treaty:** Congress could cancel without paying an international penalty or betraying a state partner.
      2.  **Private Operators:** US airlines were private. They would not fly an unprofitable plane. Concorde's airlines (BA/Air France) were state-owned and could be *ordered* to fly at a loss.
      3.  **Single Sovereign:** The US government was the sole bidder. It could walk away. The UK/France were mutually hostage; unilateral withdrawal triggered the penalty.
  *   **Conclusion:** The 2707 was a standard investment project with sunk costs. Concorde was a **political hostage situation**. The Dollar Auction model explains the 2707 cancellation (Bid exceeded Value, no penalty for quitting). It fails to explain Concorde's survival without adding the "Treaty/State-Ownership" constraint which effectively rigged the "Loser-Pays" rule to be infinitely high.

  Verdict: NO_RIVAL_NOT_AN_AUCTION
