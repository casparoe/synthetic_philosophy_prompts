  4. **The Semantic Wash:** "Directing payment to charity is a semantic trick. The causal link between retrieval and compensation remains. Experimental philosophy shows agents detect quid-pro-quo structures regardless of benevolent framing. You haven't removed the market relation, just obscured it. Doesn't this merely invite moral licensing rather than norm preservation?" I concede the market structure remains but hold that shifting the beneficiary changes the donor's self-conception from seller to patron, preserving the gift norm internally. Soft spot: Reliance on donor self-reporting.

  5. **The Historical Disanalogy:** "Life insurance and blood donations involve financial risk or fluid replenishment, not organ loss. Generalizing from those cases to kidneys ignores the unique bodily integrity concerns driving the disgust. Your historical evidence doesn't transfer. Aren't you conflating distinct categories of moral violation?" I concede the physical differences but hold that the normative conflict between gift-exchange and price-system is the relevant structural similarity. Soft spot: Strength of the structural analogy.
