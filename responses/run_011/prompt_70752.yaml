answer: |-
  ### Brainstorming Candidate Concepts

  Before settling on a diagnosis, I will list the conceptual tools from philosophy of science, historiography, and causal inference that hover near your description.

  1.  **The Reference Class Problem:** (Keynes/Reichenbach) The probability or explanation of a singular event depends on how you classify it (e.g., as a "British event," an "18th-century event," or a "textile event").
  2.  **Contrastive Explanation:** (Van Fraassen) All "why" questions are implicitly "Why P *rather than* Q?" Changing the foil (Q) changes the required explanation.
  3.  **INUS Conditions:** (Mackie) A cause is an *I*nsufficient but *N*ecessary part of a condition which is itself *U*nnecessary but *S*ufficient. This addresses the "list of conditions" problem.
  4.  **Causal Selection:** (Hart & Honoré) The pragmatic problem of selecting *the* cause from a field of necessary conditions based on normative or contextual relevance.
  5.  **Levels of Analysis:** (Social Science) The tension between micro-foundations (machines, wages) and macro-structures (regions, centuries).
  6.  **Equifinality:** (Systems Theory) The idea that different initial conditions can lead to the same outcome (often used to argue against single-cause explanations).
  7.  **The Problem of Historical Singularity:** (Weber/Neo-Kantians) The tension between nomothetic (law-seeking) and idiographic (particular-seeking) explanation.
  8.  **Explanandum Drift:** (Philosophy of Language) When the thing being explained shifts meaning during the course of inquiry.
  9.  **Conjunctural Causation:** (Qualitative Comparative Analysis) Outcomes result from specific combinations of conditions, not single variables.
  10. **The Fallacy of Misplaced Concreteness:** (Whitehead) Treating an abstract comparison as if it were a concrete physical event.

  ---

  ### Evaluation of Candidates

  Here is how the strongest candidates fit your description, and where they fail to capture the specific "wall" you are hitting.

  #### 1. The Reference Class Problem
  *   **What it amounts to:** An event belongs to many classes (British, 1770s, Spinning). Statistical or causal generalizations vary depending on which class you select as the baseline.
  *   **Where it fits:** It perfectly captures your first two walls. The workshop critic says "Britain/Yangzi" is the wrong class; your supervisor says "1770s/1870s" is the right class. The explanation changes because the reference class changes.
  *   **Where it fails:** It is primarily a problem of *probability* and *classification*. It does not fully capture your third wall: the ontological problem that when you specify the *conjunction* of conditions required for the event, the explanation becomes trivial or vacuous. It explains why the answers differ, but not why the question seems to *dissolve* under specification.

  #### 2. Contrastive Explanation
  *   **What it amounts to:** Explanation is triadic: Fact, Foil, and Relevance. "Why P rather than Q?"
  *   **Where it fits:** This is the precise philosophical description of your second wall. "Why Britain not Yangzi?" (Spatial foil) requires different information than "Why 1770s not 1870s?" (Temporal foil) or "Why Spinning not Weaving?" (Sectoral foil). The interlocutors are talking past each other because they are assuming different foils.
  *   **Where it fails:** Like the Reference Class Problem, this is a logical feature of questions, not a methodological hazard of *historical ontology*. It tells you why the answers differ, but it doesn't name the frustration that the *historical phenomenon itself* seems to vanish when you try to isolate the specific causal conjunction.

  #### 3. INUS Conditions / Conjunctural Causation
  *   **What it amounts to:** An outcome is produced by a "recipe" of conditions. No single ingredient is sufficient; some are necessary only within that specific recipe.
  *   **Where it fits:** This matches your third wall perfectly. You list the ingredients (wages, fuel, skills), and you realize no single one is the "difference maker." The cause is the conjunction.
  *   **Where it fails:** In philosophy of science, this is usually treated as a solution to causal complexity, not a problem. It doesn't capture the *comparative* frustration (that other regions had most of the ingredients). It doesn't explain why specifying the conjunction makes the question feel unanswerable rather than just complex.

  #### 4. The Problem of Historical Singularity
  *   **What it amounts to:** The tension between explaining an event by general laws (economic theory) vs. unique configuration (history).
  *   **Where it fits:** It captures the mood. You want a general answer (factor prices), but the event is singular (this specific conjunction in 1770s Britain).
  *   **Where it fails:** It is too broad. Every historical event is singular. This doesn't name the specific dynamic where *attempting to specify the singularity* renders the explanation trivial, while *keeping it general* renders it inaccurate to your research question.

  ---

  ### The Diagnosis

  There is no single established term in economic history or philosophy of science that captures the *triangulation* of these three specific frustrations:
  1.  **Instability of the Unit** (Reference Class).
  2.  **Instability of the Foil** (Contrastive Explanation).
  3.  **Dissolution of the Cause** (Conjunctive Trivialization).

  Individually, these are known problems. Together, they constitute a specific methodological hazard in comparative economic history. When you try to resolve the Reference Class and Contrastive Foil by increasing specificity, you trigger the Conjunctive Trivialization, causing the *explanandum* (the thing to be explained) to evaporate.

  Because this specific configuration lacks a standard name, I will coin a term for it. This will allow you to name the wall in your dissertation and methodological chapters.

  ### The Coinage: The Paradox of Explanatory Resolution

  **Definition:**
  The **Paradox of Explanatory Resolution** occurs in historical inquiry when increasing the specificity (resolution) of the *explanandum* (the event to be explained) reduces the tractability of the *explanans* (the explanation), such that the most precisely stated version of the question admits only a trivial answer (a unique list of conditions), while the answerable versions of the question refer to a phenomenon the researcher did not intend to study.

  It is the inverse relationship between **causal precision** and **explanatory power** in singular historical events.

  **Why this fits your case:**
  *   **Low Resolution:** "Why did industrialization happen?" (Answerable: factor prices, institutions. But too vague for your project).
  *   **High Resolution:** "Why did spinning mechanize in Lancashire in 1775 and not Songjiang in 1775 given the conjunction of wages, fuel, skills, and markets?" (Answer: Because that specific conjunction existed there. Trivial/Vacuous).
  *   **The Wall:** You are stuck in the middle, where the question feels real, but every attempt to stabilize the terms shifts the reference class or foil, making previous answers invalid.

  ### Boundary Conditions (The Carving)

  To ensure this term is useful, you must distinguish it from nearby phenomena that are *not* instances of the Paradox of Explanatory Resolution.

  **1. It is not "Lack of Data" (The Empirical Gap)**
  *   *Looks like:* You cannot answer the question because you don't know the wage rates in the Yangzi delta.
  *   *Why it's different:* If you found the wage data tomorrow, the Paradox would remain. The problem is not missing information; it is the logical structure of the causal claim. Even with perfect data, the conjunctive nature of the cause makes the explanation trivial at high resolution.

  **2. It is not "Multicausality" (The Complexity Trap)**
  *   *Looks like:* There are too many causes to list them all.
  *   *Why it's different:* Multicausality implies you can list many causes. The Paradox of Explanatory Resolution implies that the *only* non-trivial explanation is the *conjunction itself*. It is not that there are too many causes; it is that the "cause" is the unique configuration of the world at that moment, which is indistinguishable from the event itself.

  **3. It is not "Explanandum Drift" (The Moving Target)**
  *   *Looks like:* You start asking about spinning and end up answering about coal.
  *   *Why it's different:* Drift implies a mistake in focus. In the Paradox of Explanatory Resolution, the shift is *necessary*. You *must* shift the foil or resolution to get an answer. The frustration is that the shifts are mutually incompatible (Britain/Yangzi vs. 1770s/1870s), yet all are required to fully understand the event.

  ### How to Use This in Your Dissertation

  You are not facing a failure of research; you are facing the structural limit of comparative historical explanation. In your methodology chapter, you can write:

  > "This project navigates the **Paradox of Explanatory Resolution**. A low-resolution question ('Why Britain?') admits general answers (factor prices) that fail to account for sectoral specificity. A high-resolution question ('Why spinning in 1775?') admits only conjunctive answers that are trivially true of the specific case but non-generalizable. I resolve this by treating the 'cause' not as a single variable, but as a *threshold mechanism*..."

  This allows you to acknowledge the wall without climbing over it into nonsense. It validates your intuition that the question is "indistinguishable on the page" but logically distinct in practice. You are not confused; the object of study is inherently refractive.

  ### Final Recommendation

  Use **The Paradox of Explanatory Resolution**. It signals to examiners that you understand the philosophy of history underpinning your economic analysis. It transforms your "wall" from a personal confusion into a recognized methodological constraint that you are actively managing.

  It also gives you a defense against your critics. When a workshop participant says, "That's not the right unit," you can reply: "I am aware that shifting the reference class changes the explanation. I am attempting to hold the resolution constant to isolate the conjunctive threshold. If we shift to the 1870s, we are no longer addressing the Paradox of Resolution, but a different problem of diffusion."

  You have identified a genuine fault line in the discipline. Name it, and you own it.
