answer: |-
  You haven't dressed up cowardice in math. You have identified a structural constraint that standard Kelly theory ignores because standard Kelly assumes a solitary agent with infinite horizon and no principal.

  There is no single, canonical noun for this in the literature, which is why it feels like you're hunting a ghost. The closest standard terms are **"Agency Risk"** or **"Funding Risk,"** but those are too broad (they cover fraud, incompetence, or market-wide liquidity crunches). The specific carving you are describing—the intersection of a long-term edge with a short-term external evaluation window—is best described as **Evaluator-Imposed Absorbing Barrier Risk**.

  In the quant fund world, this is often colloquially called **"Getting Fired Before You're Right,"** but if you want a term tight enough to use in a model, I propose **"Mandate Ruin."**

  Here is the carving you asked for, distinguishing it from its neighbors, followed by the math and the quit condition.

  ### 1. The Carving: What This Is Not

  You asked for concrete differentiation. Here is how **Mandate Ruin** differs from the standard reasons for shading Kelly:

  *   **(a) vs. Edge Uncertainty (Fractional Kelly):**
      *   *Standard:* You bet half-Kelly because you think your estimated $p$ (probability of win) might be wrong. You are protecting against *parameter error*.
      *   *Mandate Ruin:* You know the edge is real. You are protecting against *path volatility* triggering a human veto. You could be 100% certain of the edge and still face this constraint.
  *   **(b) vs. Plain Risk Aversion (Utility Curvature):**
      *   *Standard:* You bet less because the marginal utility of the next dollar is lower than the pain of losing one (log utility, CRRA, etc.). It is a smooth curve.
      *   *Mandate Ruin:* This is a **binary barrier**. Your utility function is not smooth; it has a cliff. $U(\text{Playing}) = \log(W)$, but $U(\text{Fired}) = -\infty$ (or at least, the game ends). You aren't optimizing for wealth smoothness; you are optimizing for *survival of the mandate*.
  *   **(c) vs. Ergodicity (Time vs. Ensemble):**
      *   *Standard:* The ergodicity argument (Peters/Gell-Mann) says you shouldn't bet full Kelly because the ensemble average doesn't match the time average for a single agent facing ruin at \$0.
      *   *Mandate Ruin:* As you noted, the ruin isn't arithmetic (\$0 wealth); it's institutional. The ergodicity break isn't in the compounding math; it's in the **social contract**. The "ensemble" is the set of all possible equity curves; the "time" is your career; but the "filter" is the evaluator's patience.
  *   **(d) vs. Gambling for Resurrection (Risk-Shifting):**
      *   *Standard:* When close to a barrier (e.g., a fund near a high-water mark or a trader near a stop-loss), agents sometimes *increase* risk to gamble their way back above the line.
      *   *Mandate Ruin:* This produces the *opposite* behavior. Because the barrier is based on *perception of skill* (noise vs. signal), increasing volatility increases the probability of a "bad sample" triggering the veto. To survive, you must suppress volatility, even if it suppresses growth. This is **Risk-Shrinking**, not Risk-Shifting.

  ### 2. The Math: Kelly with an Evaluation Window

  Standard Kelly maximizes the expected logarithmic growth rate:
  $$ g(f) = p \ln(1 + fb) + q \ln(1 - f) $$
  Where $f$ is fraction, $p$ is win prob, $b$ is odds.

  In your scenario, you are maximizing growth subject to a **survival probability constraint** over an evaluator's window $T$.

  Let $V_t$ be the value of your bankroll at time $t$.
  Let $D$ be the maximum drawdown tolerance in the evaluator's head (e.g., "down 10% in any quarter").
  Let $T$ be the evaluation window (e.g., "3 months").

  You are no longer solving for $\max E[\ln V_T]$.
  You are solving for:
  $$ \max_f E[\ln V_T] \quad \text{subject to} \quad P(\min_{0 \le t \le T} V_t < (1-D)V_0) < \epsilon $$
  Where $\epsilon$ is the probability of triggering the evaluator's veto (e.g., if there's >5% chance of a 10% drawdown in a quarter, the spouse/staker pulls the plug).

  **The Resulting Sizing:**
  There is no clean closed-form solution for arbitrary distributions, but for continuous processes (like Geometric Brownian Motion), the optimal fraction $f^*$ becomes a function of the **Signal-to-Noise Ratio required to survive the window.**

  $$ f_{mandate} \approx f_{kelly} \times \frac{\sigma_{tolerance}}{\sigma_{strategy} \sqrt{T}} $$

  *   $\sigma_{strategy}$: The volatility of your edge.
  *   $\sigma_{tolerance}$: The drawdown tolerance (e.g., 10%).
  *   $T$: The evaluation window length.

  **The Insight:** As $T$ (the evaluator's patience) shrinks, your optimal bet size $f_{mandate}$ must shrink linearly with $\sqrt{T}$. If your spouse evaluates you monthly ($T=1$) but your edge needs a year to stabilize ($T=12$), you must bet at roughly $\frac{1}{\sqrt{12}} \approx 29\%$ of your theoretical Kelly capacity just to keep the probability of a "false negative" (looking like a loser despite having an edge) below the veto threshold.

  This confirms your intuition: **You are shading down to reduce the variance of the *sample* the evaluator sees, not the variance of the *outcome* itself.**

  ### 3. When to Quit (The Procrastination Solver)

  You asked when this constraint should make you quit entirely rather than just bet smaller. This is the most critical decision.

  You should quit the game when the **Mandate-Constrained Growth Rate** falls below your **Opportunity Cost of Capital + Time.**

  Mathematically, let $g(f_{mandate})$ be the growth rate under the constraint. Let $r_{free}$ be the risk-free rate (or the return of a passive alternative that carries no mandate risk). Let $C_{labor}$ be the value of your time/effort spent managing the bet.

  **Quit Condition:**
  $$ g(f_{mandate}) - r_{free} < C_{labor} $$

  **Practical Heuristic:**
  If the evaluator's patience ($T_{eval}$) is shorter than the **Statistical Significance Horizon** ($T_{sig}$) of your strategy, **quit.**

  *   $T_{sig}$ is the time required for your cumulative edge to exceed one standard deviation of noise ($ \text{Edge} \times T > \sigma \sqrt{T} $).
  *   If your spouse or staker demands proof of skill in 6 months, but your strategy's $T_{sig}$ is 24 months, you are mathematically guaranteed to look like a noise generator (or a loser) to them.
  *   In this regime, shading down doesn't help enough. To make the noise low enough to satisfy a 6-month window, you have to size down so small that the absolute dollar profit is negligible. You are working for free to manage a position that is too small to matter, just to appease a monitoring frequency that is structurally incompatible with the strategy.

  ### Summary

  You are experiencing **Mandate Ruin**. It is not cowardice; it is rational optimization under a binary barrier constraint imposed by a principal with a shorter time horizon than the agent.

  *   **The Label:** Evaluator-Imposed Absorbing Barrier (or Mandate Ruin).
  *   **The Math:** It converts a smooth utility optimization into a barrier-constraint problem, forcing $f$ down as the evaluation window $T$ shrinks.
  *   **The Decision:** If the evaluator's monitoring frequency is higher than the strategy's signal-to-noise convergence time, the constrained edge is effectively zero. That is when you close the account, thank the staker/spouse for their risk management, and walk away.
