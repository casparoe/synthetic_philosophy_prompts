answer: |-
  Here is the material you requested. I have separated it into two parts. **Part I** is the Decision Procedure itself, written plainly enough to be photocopied and handed to a volunteer. **Part II** is the commentary for you, addressing the philosophical underpinnings, the settled vs. contested science, and the analysis of your three test cases.

  ***

  # PART I: VOLUNTEER HANDOUT
  **County Biological Records Centre: Plant Status Labelling Procedure**
  *Version 4.1 (Draft for Review)*

  **Goal:** Assign one status label to each record card: **Native, Introduced, Casual, Naturalised,** or **Uncertain.**
  **Rule Zero:** If you are unsure, mark **Uncertain**. Do not guess. The Manager reviews all "Uncertain" cards.

  ### STEP 1: The Data Check
  *Before choosing a label, check if the card has enough information.*
  1.  **Is there a date?** (Year is minimum).
  2.  **Is there a location?** (Grid ref, parish, or specific site).
  3.  **Is the plant identifiable?** (Latin name or clear common name).

  *   **If NO to any of these:** Label **Uncertain**. Stop. Hand to Manager.
  *   **If YES to all:** Proceed to Step 2.

  ### STEP 2: The Individual Assessment
  *Look **only** at this specific card. Ignore other cards in the box for now.*
  1.  **Is the plant growing without human help?** (e.g., not in a pot, garden bed, or planted tree).
      *   *No:* Label **Introduced**. Stop.
      *   *Yes:* Continue.
  2.  **Is there evidence of reproduction?** (Seed, fruit, self-seeded seedlings noted).
      *   *Yes:* It is likely **Naturalised** or **Native**. (Go to Step 3).
      *   *No:* It is likely **Casual** or **Native**. (Go to Step 3).
  3.  **Is this species historically known here?** (Check the "Common Species" list on your desk).
      *   *Yes:* Label **Native**. Stop.
      *   *No:* Label **Casual**. Stop.
      *   *Unsure:* Label **Uncertain**. Stop.

  *Note: At the end of Step 2, write your preliminary label lightly in pencil.*

  ### STEP 3: The Context Check (The "Batch" Rule)
  *Now look at the other cards in the same box/batch from the same parish.*
  **Ask:** Are there **5 or more** records of this **same species** in this **same parish** spanning **3 or more years**?

  *   **If NO:** Keep the label you chose in Step 2. Ink it over.
  *   **If YES:** You have found a population. You are permitted to **slip** the label one step toward **Naturalised**.
      *   If Step 2 said **Casual**: You may change to **Naturalised**.
      *   If Step 2 said **Uncertain**: You may change to **Casual**.
      *   If Step 2 said **Native** or **Introduced**: Do **not** change.
      *   *Action:* Ink the new label. Attach a small yellow dot to the corner (this tells the Manager a "Batch Slip" was used).

  ### STEP 4: The "Old Language" Rule
  *Some old cards (pre-1980) use categories we don't use (e.g., "Garden Escape," "Colony").*
  1.  **Do not simply copy the old label.**
  2.  **Read the notes.** Does the description match our definitions?
      *   "Garden Escape" usually = **Casual** (unless Step 3 applies).
      *   "Colony" usually = **Naturalised**.
  3.  **If the old term is vague:** Label **Uncertain**. Hand to Manager.

  ### STEP 5: When to Stop and Escalate
  *Hand the card to the Manager immediately if:*
  1.  The record is of a species on the "Rare Plant Watch" list.
  2.  You feel pressured to change a label because of a "gut feeling" that isn't covered by Step 3.
  3.  You disagree with a label already on a card that is being re-processed.

  ***

  # PART II: COMMENTARY AND ANALYSIS
  *For the Manager (You)*

  This procedure is designed to operationalize the "fluid category" insight you gained from the Copycat literature without overwhelming the volunteers. Below is the breakdown of the design choices, the test case runs, and the epistemological status of the concepts used.

  ### 1. The Batch Problem: Two-Pass Labelling
  You asked whether judging 41 records together is legitimate evidence.
  **Biological Answer:** Yes. Status is a property of the *population*, not the *specimen*. A single seed on a verge is casual; 40 seeds over 3 years are a population.
  **Administrative Answer:** If you allow volunteers to label based on the box content immediately, you introduce circularity and order-dependence (the "what else was in the pile" problem you observed).

  **The Solution in Step 2 & 3:**
  The procedure enforces a **Two-Pass System**.
  *   **Pass 1 (Step 2):** Establishes the "Intrinsic Merit" of the record. This preserves the data integrity. If the box is lost, the individual record still holds its own truth value.
  *   **Pass 2 (Step 3):** Allows the "Contextual Slip." This is where the Hofstadter/Mitchell insight is codified. The concept *Naturalised* is allowed to stretch over the concept *Casual* only when specific pressure criteria are met (5 records, 3 years).
  *   **The Yellow Dot:** This is crucial. It flags to you (or the planning officer) that this label is context-dependent. It separates "fact" from "inference."

  ### 2. Concept Slippage: Error vs. Feature
  You asked for an explicit rule on when slippage is permitted.
  In the current handbook, slippage is treated as error (noise). In this procedure, slippage is treated as **hysteresis**.
  *   **Permitted Slippage:** Only in the direction of *establishment* (Casual → Naturalised) and only triggered by the quantitative threshold in Step 3.
  *   **Forbidden Slippage:** You cannot slip Native → Introduced based on a hunch. You cannot slip Casual → Native without reproductive evidence.
  *   **Why:** This prevents the "guideline collapsing into 'label it however you feel'." The "slipnet" is constrained by hard anchors (reproduction, time, count).

  ### 3. Volunteer Disagreement: Training or Property?
  You asked if disagreement is a training failure or a property of the concepts.
  **Verdict:** It is a property of the concepts (Vagueness).
  In cognitive science (Rosch, Lakoff), categories have **fuzzy boundaries**. There is a "zone of dispute" where two rational agents will disagree.
  *   **Procedure Design:** Step 5, Point 3 ("You disagree with a label already on a card").
  *   **Management Strategy:** Do not retrain the volunteer to force agreement. Instead, track the disagreement rate. If 30% of *Species X* records trigger disagreement, *Species X* has a borderline status. Create a specific protocol for *Species X*. You are measuring the topology of the concept, not the competence of the volunteer.

  ### 4. Running the Test Cases

  **Case A: The Verge Escapee + 40 Sisters**
  *   **Volunteer A (Box Context):** Sees the 41 cards. Step 2 says "Casual" (no fruit, roadside). Step 3 triggers (41 records, 3 years). Slips to **Naturalised**. Adds Yellow Dot.
  *   **Volunteer B (Strict Individual):** Sees 1 card. Step 2 says "Casual". Step 3 fails (no other cards visible). Labels **Casual**.
  *   **Resolution:** Volunteer A is ecologically more accurate; Volunteer B is administratively safer. The Procedure validates A *but* flags it with the Yellow Dot. When you spot-check (your 10%), if you see the Yellow Dot and the count supports it, you sign off. If the count is weak, you revert to Casual. This captures the "batch legitimacy" without hiding the inference.

  **Case B: The 1950s Sheet (Obsolete Category)**
  *   **Scenario:** Old label says "Colony." Current handbook has no "Colony."
  *   **Procedure:** Step 4 applies. Do not import the label. Read the notes.
  *   **Outcome:** If notes say "growing wild on waste ground," Step 2 applies. If no fruit, it is **Casual**. If Step 3 (other records) supports it, it slips to **Naturalised**.
  *   **Philosophy:** This treats the old recorder's judgment as *evidence*, not *truth*. It respects their observation but re-runs it through the current ontology. This prevents "ontological drift" where old definitions silently corrupt new data.

  **Case C: The Disused Airfield (Your Bias)**
  *   **Scenario:** You insist it is Naturalised. Procedure suggests otherwise.
  *   **Run:** Step 2: No fruit noted on cards? Then Step 2 says **Casual**. Step 3: Are there 5+ records over 3 years?
      *   *If Yes:* Procedure allows slip to **Naturalised** (Yellow Dot). You are vindicated, but via the rule, not your authority.
      *   *If No:* Procedure says **Casual**.
  *   **The Test:** If the procedure says Casual, and you override it, you must mark it as a **Manager Override** (different coloured dot).
  *   **Why:** You asked for the procedure to overrule you. It can only do this if you bind yourself to Step 5. If the criteria aren't met, the procedure demands "Casual." If you label "Naturalised" anyway, you are no longer doing data entry; you are doing advocacy. The procedure forces you to admit you are slipping the concept without the standard pressure.

  ### 5. Limitations: Judgement Calls in Costume
  You asked which steps are judgement calls wearing a procedural costume.
  1.  **The Thresholds (Step 3):** Why 5 records? Why 3 years? This is arbitrary. It is a "costume" for the judgement "looks like a population to me." I chose these numbers because they are easy to count, not because nature respects them.
  2.  **The Direction of Slip:** Allowing Casual → Naturalised but not vice versa assumes time/counts only prove establishment, never disappearance. This is a bias toward "presence."
  3.  **The "Common Species" List (Step 2):** This list is a frozen snapshot of consensus. It hides the history of how those species became "common."

  ### 6. Settled vs. Contested Science
  You requested a distinction between established theory and live debate.

  **Settled (Consensus in Cognitive Science):**
  *   **Prototype Theory:** Categories are not defined by necessary and sufficient conditions (Wittgenstein/Rosch). There is no single feature that makes a plant "Naturalised." It is a cluster of features.
  *   **Context Sensitivity:** Categorization is affected by priming and surrounding items (the "batch effect" you observed is a known psychological phenomenon).
  *   **Vagueness:** Borderline cases are inherent to natural language categories, not a defect of the user.

  **Contested (Live Debate):**
  *   **The Copycat/Slipnet Model:** Hofstadter and Mitchell's specific computational architecture is *one* model of analogy-making. It is not the only explanation for how concepts slide. Some connectionist models argue for different mechanisms. Relying on "slipnets" as a literal description of brain function is speculative.
  *   **Operationalizing Fluidity:** While scientists agree categories are fuzzy, there is strong debate on whether databases should *encode* that fuzziness. Many data scientists argue for "forced choice" to maintain statistical power, accepting the error as noise. Your procedure argues for encoding the uncertainty (Yellow Dots). This is a pragmatic choice, not a settled scientific standard.
  *   **The "True" Status:** There is no ontological consensus on whether a plant *has* a status or whether status is *assigned* by observers. Your procedure assumes the latter (constructivist), which is philosophically robust but sometimes frustrating for planners who want the former (realist).

  **Final Note:**
  The procedure rests on the **fluidity-of-categories picture**. If categories were rigid boxes, Step 3 would be unnecessary and dangerous. By including Step 3, you are acknowledging that the "truth" of the record emerges from the network of records, not just the card itself. This is the Copycat insight applied to ecology: the meaning of *xyz* depends on the context of *abc*.

  If you adopt this, you must accept that your atlas will contain "Yellow Dot" records. You must explain to planning officers that a Yellow Dot means: *"Biologically probable, administratively inferred."* That is the cost of honesty.
