      *   **The Problem:** Inconsistent labeling of plant records (native, introduced, casual, naturalised, uncertain) by volunteers. The inconsistency stems from context effects (batching vs. individual records) and the inherent fluidity of the categories. The current handbook assumes rigid categories; the user knows reality is messier.
