  9.  **Final Polish:** Ensure the distinction between the *Handout* (for volunteers) and the *Commentary* (for the user) is clear. The user wants to understand the philosophy, but the volunteers just need to do the work. I will write the Handout in plain English, then write the Analysis for the user explaining *why* it's written that way, addressing the Hofstadter/Copycat points.

  *(Self-Correction on the "Batch Problem"):* The user asked if batch judgment is legitimate evidence. Biologically, yes. Administratively, it risks circularity. I will propose a "Primary Label" (individual) and "Contextual Override" (batch) system. This preserves the individual data integrity while allowing the ecological reality to inform the final atlas status.

  *(Self-Correction on "Slippage"):* I need to make sure I don't just say "use your gut." I need to define *triggers* for slippage (e.g., "If >5 records exist in 5 years, 'Casual' may slip to 'Naturalised'").

  *(Self-Correction on "Settled vs Contested"):* Be careful not to validate Copycat as "Truth." It's a model. The broader field of cognitive science (Lakoff, Rosch) supports the fluid category view, but the *operationalization* of it in data science is the contested part.

