      *   *Copycat/Slipnet:* Concepts aren't boxes; they are magnetic fields. Pressure from context distorts the boundaries. The procedure needs to encode *allowed* distortion.
      *   *Settled vs. Contested:* Cognitive science agrees categories are often prototype-based and context-sensitive (Rosch, etc.), but the degree to which this should be formalized in data entry is debated. The "Copycat" analogy is a specific computational model of analogy-making, not a universal consensus on taxonomy.

