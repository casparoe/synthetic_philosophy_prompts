prompt: |-
  I'm the contracts and resident-services lead at a small housing association in the North West — about 900 homes, some of it supported housing — and the board has taken on board the republican idea that freedom isn't just non-interference but non-domination: not being subject to someone's arbitrary power. They want a written test we can run over any new contract, licence or service before we sign. I don't want an essay on Pettit, I want something my team can actually use, and two of them aren't philosophers so it needs to be plain English.

  You're a political philosopher who's done applied work on republican liberty. Think it through carefully — start with a short bit of brainstorming about what the principle actually commits you to, and what has to survive translation into a procedure before you write anything.

  The deliverable is a step-by-step domination screen. For each step: the question to ask, what counts as a sufficient answer, whether a bad answer stops the thing dead or just flags it for the board, and where the step hands the decision to a human because its a question of values rather than facts. It has to run in all three directions — where we hold power over residents, where a contractor holds power over us, and where a funder or regulator holds power over residents through us — with the same test each time. And it has to handle the obvious circularity: any interference we carry out to reduce domination is itself an exercise of power, so what makes it non-arbitrary, and how do we operationalise that in a document that a surveyor or a housing officer is going to fill in on a Tuesday?

  Then run it on three of ours:

  1. Our supported-housing licence, which lets us ask a resident to leave for behaviour we consider unsuitable, on two weeks' notice, with no external review.
  2. A new outsourced repairs contract: fifteen-working-day target, and a complaints process run by the same contractor, escalated to us only if the resident pushes.
  3. Our resident participation budget, where residents deliberate and rank spending priorities but we keep the final say and can set aside the result with a written reason.

  One of these should come out in a way we won't like — don't soften it, say which and why.

  Finally, be straight with me about where the screen misfires: the judgment calls dressed up as procedure, the relationships where it goes quiet because the dominated party can't or won't avow their interests, and the cases where non-domination and non-interference genuinely pull in opposite directions and the test can't tell us which to prefer. If the whole thing is really just a politeness audit with fancy vocabulary, I'd rather you said so now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Contracts and Resident-Services Lead at a small Housing Association (North West, ~900 homes, some supported).
      *   **Context:** Board wants to apply Philip Pettit's republican concept of freedom as "non-domination" (not just non-interference, but absence of arbitrary power) to contracts/licenses/services.
      *   **Task:** Create a practical "Domination Screen" (step-by-step test) for the team to use.
      *   **Constraints:** Plain English (team isn't philosophical), actionable (fill-in on a Tuesday), handles three directions of power (HA->Resident, Contractor->HA, Funder/Regulator->Resident via HA), addresses the circularity of interference vs. domination.
      *   **Deliverables:**
          1.  Brief brainstorming on the principle and translation.
          2.  The Step-by-Step Domination Screen.
          3.  Application of the screen to three specific cases (Supported Housing Licence, Repairs Contract, Participation Budget). One must fail hard.
          4.  Critical reflection on where the screen misfires/limits.
      *   **Tone:** Professional, direct, applied philosopher, no fluff, honest about limitations.

  2.  **Brainstorming & Translation (Mental Draft):**
      *   *Core Concept:* Freedom as Non-Domination (FND). It's not about *no* rules; it's about rules that aren't *arbitrary*. Arbitrary = power exercised without tracking the interests of the affected party.
      *   *Translation Challenge:* How do you measure "arbitrariness" in a contract clause?
      *   *Key Mechanism:* "Tracking Interests." Power is non-arbitrary if it is constrained by rules/procedures that force the power-holder to consider the interests of the powerless party.
      *   *The Circularity:* If the HA interferes (e.g., evicts) to stop one resident dominating another, is that domination? No, if it's tracked to shared interests (safety) and contestable.
      *   *Operationalization:* Needs checklists. "Can they challenge this?" "Do we have to give a reason?" "Is the reason tied to agreed interests?"
      *   *Three Directions:*
          1.  HA over Resident (Standard tenancy/licence).
          2.  Contractor over HA (and indirectly residents).
          3.  Funder/Regulator over Resident (via HA conditions).
      *   *The "Stop" Condition:* If power is unchecked and unchallengeable, it's domination.

  3.  **Developing the Domination Screen:**
      *   Need steps that are logical.
      *   *Step 1: Identify the Power.* Who can do what to whom?
      *   *Step 2: Identify the Interest.* Whose interests are affected?
      *   *Step 3: Check for Constraints (Tracking).* Is the power bound by rules that reflect those interests?
      *   *Step 4: Check for Contestability.* Can the decision be challenged effectively?
      *   *Step 5: The Interference Justification.* If we interfere, is it to prevent domination elsewhere?
      *   *Decision Logic:* Pass/Fail/Board Review.

  4.  **Applying the Screen to the Three Cases:**
      *   *Case 1: Supported Housing Licence.* "Unsuitable behaviour," 2 weeks notice, no external review.
          *   *Analysis:* High power HA->Resident. "Unsuitable" is vague (arbitrary). No review (no contestability).
          *   *Verdict:* Fail. This is classic domination.
      *   *Case 2: Repairs Contract.* 15 days, complaints to contractor first.
          *   *Analysis:* Contractor->HA/Resident power. Complaints process internal is risky but common. Escalation exists.
          *   *Verdict:* Pass with conditions (need independent escalation point).
      *   *Case 3: Participation Budget.* Residents rank, HA has final say with reason.
          *   *Analysis:* HA holds veto. But "written reason" implies tracking.
          *   *Verdict:* Pass (mostly). It's non-arbitrary if the reason must be valid (e.g., legal constraint).
      *   *Requirement:* One must come out badly. Case 1 is the obvious candidate. It's legally and ethically shaky anyway.

  5.  **Critical Reflection (The "Misfire" Section):**
      *   *Proceduralism:* Does ticking boxes actually stop culture problems?
      *   *Voice:* What if the resident can't speak up (support needs)?
      *   *Conflict:* Safety vs. Liberty. Sometimes non-domination requires interference (e.g., stopping antisocial behaviour). The screen needs to acknowledge this tension.
      *   *Honesty:* It *is* a bit of a "politeness audit" if the culture doesn't back it.

  6.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone Check:* Avoid academic jargon. Use "Power," "Rules," "Challenge," not "Arbitrium," "Discursive Control."
      *   *Structure:* Follow the prompt's requested order exactly.
      *   *Specifics:* Ensure the North West context (housing association reality) feels authentic (e.g., mentioning surveyors, housing officers).

  7.  **Refining the "Circularity" Point:**
      *   The prompt asks specifically about how interference to reduce domination is non-arbitrary.
      *   *Answer:* It must be "tracked" to the interests of the community/resident and "contestable." The screen needs a specific question on this.

  8.  **Final Review against Constraints:**
      *   Plain English? Yes.
      *   Step-by-step? Yes.
      *   Three directions of power? Integrated into the steps.
      *   Three cases tested? Yes.
      *   One fails hard? Yes (Case 1).
      *   Critical reflection? Yes.

  **(Self-Correction during drafting):** I initially thought about making Case 3 fail (tokenistic participation). But Case 1 is legally dangerous and clearly arbitrary. Case 3 is actually a good example of *non-arbitrary* power (veto exists but is constrained by reason-giving). I will stick with Case 1 as the failure because it's the most glaring example of *arbitrary* power (no review, vague terms). I need to make sure I don't sound like a lawyer giving legal advice, but a philosopher testing the *structure* of power.

  9.  **Final Polish:** Check the "Brainstorming" section to ensure it's brief but substantive. Ensure the "Misfire" section is candid.

  *(Proceed to generate output based on this thought process.)*
answer: |-
  ### Part 1: Brainstorming the Translation

  **The Principle:**
  Freedom as non-domination means you are free not because no one touches you, but because no one can touch you *on a whim*. If I have the power to interfere in your life, but I am forced by rules, norms, or oversight to track *your* interests when I use it, I am not dominating you. If I can act without checking your interests, or if you have no way to challenge me, that is domination.

  **The Translation Problem:**
  Philosophy talks about "arbitrariness" and "tracking interests." A housing officer on a Tuesday needs to know: "Can I sign this?"
  To make this work, we have to convert "arbitrary power" into "unchecked discretion." We have to convert "tracking interests" into "reason-giving and review."
  The circularity (using power to stop domination) is solved by **procedure**. Power is non-arbitrary if it is exercised *through* a channel that forces the powerful to listen. If we evict a dangerous resident to protect the community, that is interference. It is not domination if the resident had a say, the rules were clear beforehand, and there was an appeal.

  **The Operational Goal:**
  The screen must identify **unconstrained discretion**. If a clause gives one party the right to decide something important without clear criteria and without a route for appeal, it fails. It doesn't matter if the power is *likely* to be used kindly; the *capacity* to use it arbitrarily is the domination.

  ***

  ### Part 2: The Domination Screen

  **How to use this:**
  Fill this out for any new contract, licence, or policy.
  *   **Direction of Power:** Tick who holds the power in this clause (HA over Resident, Contractor over HA/Resident, Funder over Resident via HA).
  *   **Traffic Light:** Green (Proceed), Amber (Board Review), Red (Stop/Rewrite).

  #### Step 1: Identify the Power
  **Question:** Does this clause give one party the right to make a decision that significantly affects the other party's home, money, or security?
  *   *Examples:* Eviction, rent hikes, stopping repairs, vetoing spending, changing service levels.
  *   **Sufficient Answer:** "No" = Green (Skip to Step 5). "Yes" = Proceed to Step 2.

  #### Step 2: Check the Criteria (Tracking Interests)
  **Question:** Is the power limited by clear, objective criteria, or is it based on one party's opinion?
  *   *Look for:* Phrases like "at our sole discretion," "if we deem necessary," "unsuitable behaviour," "reasonable opinion."
  *   **Sufficient Answer:** The decision must be tied to specific, pre-agreed facts or rules (e.g., "non-payment for 8 weeks," "failure to meet HHSRS standards").
  *   **Bad Answer:** "When the HA/Contractor feels it is right."
  *   **Decision:**
      *   Clear Criteria = Green.
      *   Vague/Opinion-based = **Amber (Board Review)**. *Note: Vague criteria are only acceptable if Step 3 is very strong.*

  #### Step 3: Check the Challenge (Contestability)
  **Question:** If the decision goes against the weaker party, can they challenge it effectively *before* the damage is done, or at least get a rapid review?
  *   *Look for:* Independent arbitration, ombudsman access, tribunal rights, a specific appeals panel that isn't just the same manager.
  *   **Sufficient Answer:** There is a route to appeal to someone who was not the original decision-maker.
  *   **Bad Answer:** "Our decision is final," or "Complaints go to the contract manager."
  *   **Decision:**
      *   Independent Review = Green.
      *   Internal Only = **Red (Stop)**. *Unchallengeable power over housing security is domination.*
      *   *Hand-off:* If the challenge mechanism is complex or costly, hand to Board. This is a value judgment on accessibility.

  #### Step 4: The Interference Justification (Handling Circularity)
  **Question:** If this power allows us (or a contractor) to interfere (e.g., enter the home, stop a service), is it to prevent domination of others or protect shared interests?
  *   *Context:* We need power to stop anti-social behaviour or ensure safety. This is interference, but is it domination?
  *   **Sufficient Answer:** The interference is proportional and necessary to protect the rights/safety of other residents or the asset, AND the resident gets a reason in writing.
  *   **Bad Answer:** "Because we said so," or "To protect our reputation."
  *   **Decision:**
      *   Protects Shared Interest + Reason Given = Green.
      *   Protects HA Reputation Only = **Amber (Board Review)**.
      *   *Hand-off:* Determining "shared interest" vs "institutional convenience" is a value judgment. Staff flag it; Board decides.

  #### Step 5: Exit and Consequences
  **Question:** If the relationship ends (contract terminates, tenancy ends), does the weaker party have time and support to transition?
  *   **Sufficient Answer:** Notice periods align with legal minimums *and* support is offered (especially in supported housing).
  *   **Bad Answer:** Immediate termination without cause.
  *   **Decision:**
      *   Adequate Notice/Support = Green.
      *   Precipitous Exit = **Red (Stop)**.

  ***

  ### Part 3: Running the Screen

  #### Case 1: Supported-Housing Licence
  *Clause: HA can ask resident to leave for "behaviour we consider unsuitable," 2 weeks' notice, no external review.*

  *   **Step 1 (Power):** Yes. Eviction is significant.
  *   **Step 2 (Criteria):** **Fail.** "Behaviour we consider unsuitable" is pure discretion. It tracks the HA's mood, not the resident's interests or objective rules.
  *   **Step 3 (Challenge):** **Fail.** "No external review." The HA is judge and jury.
  *   **Step 4 (Justification):** Unclear. No requirement to prove the behaviour harmed others.
  *   **Step 5 (Exit):** **Fail.** Two weeks is minimal for supported housing; without review, it's precarious.
  *   **Verdict:** **RED (STOP).**
  *   **Why:** This is textbook domination. The resident is entirely subject to the HA's arbitrary will. They have no security because the rules are inside the HA's head, not on the page. Even if your team would never use it unfairly, the *capacity* to do so dominates the resident. They must live in fear of triggering a whim. This needs a tribunal clause and objective behavioural thresholds.

  #### Case 2: Outsourced Repairs Contract
  *Clause: 15-day target. Complaints process run by contractor, escalated to HA only if resident pushes.*

  *   **Step 1 (Power):** Yes. Contractor controls repair quality/speed.
  *   **Step 2 (Criteria):** Pass. 15-day target is objective.
  *   **Step 3 (Challenge):** **Amber.** Complaints run by the contractor initially. However, escalation to HA exists.
  *   **Step 4 (Justification):** N/A (Service delivery).
  *   **Step 5 (Exit):** N/A.
  *   **Verdict:** **AMBER (BOARD REVIEW).**
  *   **Why:** It's not Red because the HA ultimately holds the contract and the resident can escalate. However, relying on the resident to "push" for escalation assumes they have the energy/capacity to fight. In supported housing, this is a barrier. The Board needs to decide if we require an independent complaints handler for the first stage, or if our oversight is enough to "track" the residents' interests.

  #### Case 3: Resident Participation Budget
  *Clause: Residents rank priorities, HA keeps final say, can set aside result with written reason.*

  *   **Step 1 (Power):** Yes. HA can veto resident choice.
  *   **Step 2 (Criteria):** Pass. The "written reason" constraint forces the HA to track interests. They can't just say "no."
  *   **Step 3 (Challenge):** Pass. Implicitly, a written reason can be challenged at Board level or via scrutiny committees.
  *   **Step 4 (Justification):** Pass. The veto is likely for legal/financial compliance (shared interest).
  *   **Step 5 (Exit):** N/A.
  *   **Verdict:** **GREEN.**
  *   **Why:** This is non-arbitrary power. The HA retains authority (necessary for fiduciary duty), but the requirement to give a *reason* forces the power to track the residents' interests. It prevents the HA from ignoring the vote on a whim. As long as the "written reason" is subject to scrutiny, this is freedom-compatible authority.

  ***

  ### Part 4: Where the Screen Misfires

  You asked for honesty. Here is where this tool will lie to you.

  **1. The "Paper Tiger" Problem**
  The screen tests the *document*, not the *culture*. You can tick "Green" on the Participation Budget because there's a "written reason" clause. But if your Board treats that reason as a formality and never actually listens, the domination remains. The screen measures the *potential* for non-domination, not the reality. If your staff are bullied or your Board is closed-shop, this document is just a politeness audit with fancy vocabulary.

  **2. The Voiceless Resident**
  Republican liberty relies on "contestability"—the ability to challenge power. This screen assumes the resident *can* challenge. In supported housing, many residents have cognitive impairments, trauma, or fear of authority. They won't push the complaints button in Case 2. The screen goes quiet here. It marks the *mechanism* as present, but it cannot measure whether the power dynamic is too skewed for the mechanism to be used. You need an advocate, not just a form, for this to work.

  **3. Non-Interference vs. Non-Domination**
  Sometimes these pull apart.
  *   *Scenario:* A resident with hoarding behaviour poses a fire risk to neighbours.
  *   *Non-Interference:* Leave them alone.
  *   *Non-Domination:* The neighbours are dominated by the risk; the hoarder is dominated by their own compulsion/environment.
  *   *The Screen:* It will likely flag an intervention as "Green" (protecting shared interest). But it cannot tell you *how much* interference is too much. It validates the *process* of interference, not the *ethics* of the outcome. You might follow the screen perfectly and still ruin a life "by the book."

  **4. The Structural Blind Spot**
  The screen tests individual contracts. It does not test the housing market itself. If a resident has nowhere else to go in the North West because of benefit caps or shortage, they are dominated by the market, not just you. We can make our contracts non-arbitrary, but if the alternative is homelessness, our "non-arbitrary" power still feels like a gun to the head. The screen clears our conscience, but it doesn't fix the structural domination of the housing crisis.

  **Final Word:**
  Use the screen to kill the bad clauses (like Case 1). But don't let a "Green" light convince you that justice has been done. It just means the paperwork doesn't scream "tyranny." The rest is on your team's integrity.
