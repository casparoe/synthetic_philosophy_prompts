answer: |-
  **MEMORANDUM**

  **TO:** Arts Funding Board
  **FROM:** [Your Name], Graduate Representative
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Spring Arts Proposals: Troupe Season vs. Open-Stage Collective

  **Recommendation**

  I move that we split the $30,000 allocation evenly: **$15,000 to the Professional Troupe** and **$15,000 to the Student Open-Stage Collective.**

  This is not a compromise born of indecision. It is a deliberate decision to treat this budget cycle as a comparative experiment in civic aesthetics. We are currently choosing between two competing hypotheses about how art functions in a community: the **Spectator Hypothesis** (professional craft gathers a public to witness shared truths) and the **Participant Hypothesis** (amateur gathering creates the public itself).

  Neither model has proven it can fulfill its civic promise on our campus. Funding both at reduced levels forces each to innovate, while denying either the monopoly on "Art." Below is the rationale, including specific challenges both groups must address to receive these funds.

  **1. The Professional Troupe: The Verifiability Problem**

  The Troupe's pitch relies on the standard defense of public arts funding: that watching difficult plays cultivates empathy and creates better citizens. As a board, we accept this claim annually, but we lack the tools to verify it.

  *   **The Challenge:** The Director argues that tragedy teaches us to feel for others. The counter-argument (following Rousseau) is that theater allows us to *substitute* feeling for action. We cry for Hecuba in the black box so we do not have to feed the hungry in the town. If we fund this, we are funding a specific moral psychology.
  *   **The Condition:** We cannot fund "empathy" as an abstract good. If we allocate $15,000, the Troupe must agree to a post-season assessment that moves beyond attendance numbers. We need to know if the "civic gathering" translated into anything outside the theater. I propose we require two structured post-show talkbacks facilitated by Political Theory or Sociology faculty, designed to move the conversation from "interpretation" to "implication." If the art is truly citizen-making, it must survive the light of day, not just the dark of the theater.

  **2. The Student Collective: The "Public" Problem**

  The Student Collective's proposal aligns with the Rousseauvian ideal: open-air, no-audition, the crowd as the show. However, we must take the strongest case *against* this model seriously. Rousseau's festival was designed for Geneva, a cohesive republic where everyone knew everyone. In a modern college, "open participation" often masks exclusion.

  *   **The Challenge:** Last year's average attendance was 14 people, primarily existing friend groups. This is not a "public"; it is a private gathering with a PA system. Rousseau warned that without a unified civic body, festivals become sites of clique formation. When "anybody can get up on the platform," usually only the confident do. By funding this without changes, we risk subsidizing social insulation under the banner of democracy.
  *   **The Condition:** The $15,000 grant is contingent on a revised outreach plan. "If we build it, they will come" is not a strategy. To unlock the full funding, the Collective must demonstrate how they will break the 14-person ceiling. This means budgeting for physical outreach, not just food and permits. They must prove they are courting the *unconfident* student, not just performing accessibility for their peers.

  **3. Redefining "Excellence" in the Rubric**

  Our current rubric privileges "Excellence," which is currently coded as production value judged from a seat in the dark. This biases the board toward the Troupe. If we are to fund the Festival model seriously, we must articulate what excellence looks like when the goal is participation rather than observation.

  I propose we adopt a dual-track metric for this cycle:
  *   **For the Troupe:** Excellence = **Friction.** Did the play challenge the audience's preconceptions, or did it flatter them? (Rousseau's worry). We judge this by the quality of the talkback discourse.
  *   **For the Collective:** Excellence = **Distribution.** Who was on the platform? If the same five voices dominate the open mic, the project has failed, regardless of how "fun" it was. We judge this by the demographic and social diversity of the participants, not the spectators.

  **Conclusion**

  Funding the Troupe fully ($24k) validates a model of citizenship based on passive consumption, relying on an unproven empathy claim. Funding the Collective fully ($22k) validates a model of citizenship that, last year, failed to gather a public.

  By splitting the pot, we acknowledge that we do not know which model serves this campus better. We are not just buying shows; we are buying data. Let us see if professional art can provoke action, and if amateur art can build a public.

  I look forward to discussing this motion on Thursday.
