prompt: |-
  I'm 16 and I make music in my bedroom. For our spring showcase I have to pick ONE track to submit for a regional scholarship, and I'm stuck between two of them.

  Track A took me four months. Weird time signatures, layered vocals, I nearly cried making it, it's the most honest thing I've ever done. My teacher loves it, it won our class competition. But at the showcase rehearsal the parents clapped politely and went back to their phones. Nobody said a single thing about how it made them feel.

  Track B I threw together in one afternoon for my little brother's 4th grade class. Three chords, kind of dumb. The kids went wild, two of the teachers cried, they still sing it in the hallway. Except I didn't feel anything while making it. I was copying a melody I'd heard somewhere, half joking, and honestly I'm embarassed by it.

  So A is real and lands on nobody, and B lands on everybody but was fake coming out of me. We're reading Tolstoy's What Is Art? in lit class and it's frying my brain, because my teacher says Tolstoy would obviously pick B and I think she's wrong. Which is it? And if it's B, does A even still count as art at all?

  Start with your actual pick in the first sentence, A or B, no hedging, then explain. 300 words max please.
