answer: |-
  # The Classification Protocol: Threshold and Trajectory

  ## Part I: The Decision Procedure

  This procedure is designed for a 90-minute analysis window using publicly available data. It prioritizes *institutional capacity for contestation* over policy outcomes. It relies on three core concepts from comparative politics:

  1.  **Contestation:** The uncertainty of electoral outcomes. If the incumbent cannot lose, it is not a democracy.
  2.  **Pre-conditions:** The civil liberties (speech, association, rule of law) required for contestation to be meaningful.
  3.  **De Jure vs. De Facto:** The distinction between what the law says and how it is enforced.

  ### Phase 1: Baseline Verification (15 Minutes)
  *Goal: Establish the starting status.*

  1.  **Check the Executive:** Was the current head of government elected in a contest where opposition candidates were legally permitted to run?
      *   **No:** Classify **Non-Democracy**. Terminate.
      *   **Yes:** Proceed to Step 2.
  2.  **Check the Legislature:** Is there a functioning legislature with the power to block executive decrees?
      *   **No:** Classify **Non-Democracy**. Terminate.
      *   **Yes:** Proceed to Step 3.
  3.  **Check the Baseline:** In the previous quarter, was this country classified as Functioning or Backsliding?
      *   **Non-Democracy:** Maintain **Non-Democracy** unless a regime change occurred. Terminate.
      *   **Functioning/Backsliding:** Proceed to Phase 2.

  ### Phase 2: Change Detection (30 Minutes)
  *Goal: Identify negative institutional shifts.*

  4.  **Scan for Legal Changes:** In the last 90 days, did the government enact new laws, constitutional amendments, or executive orders affecting:
      *   Electoral administration (districting, voter ID, registration)?
      *   Judicial independence (tenure, budget, jurisdiction)?
      *   Media/Civil Society (licensing, funding, "foreign agent" laws)?
      *   Emergency powers?
      *   **No:** Classify **Functioning Democracy**. Terminate.
      *   **Yes:** Record the change. Proceed to Step 5.
  5.  **Scan for Behavioral Changes:** Are there credible reports (from at least two independent sources, e.g., major wire services + an international NGO) of:
      *   Arrests of opposition figures?
      *   Systematic denial of protest permits?
      *   State media dominating coverage to the exclusion of opposition?
      *   **No:** Proceed to Step 6.
      *   **Yes:** Record the behavior. Proceed to Step 6.

  ### Phase 3: The Threshold Test (30 Minutes)
  *Goal: Determine if the change erodes pre-conditions or merely alters rules.*

  6.  **The Contestation Test:** Does the change make it *legally impossible* or *practically improbable* for the opposition to win the next scheduled election?
      *   *Indicator:* Opposition parties are banned; key leaders are imprisoned on political charges; election is cancelled.
      *   **Yes:** Classify **Non-Democracy**. Terminate.
      *   **No:** Proceed to Step 7.
  7.  **The Pre-Condition Test:** Does the change significantly reduce the ability of citizens to organize, speak, or seek legal redress *before* the election occurs?
      *   *Indicator:* Courts stripped of review power; major independent media outlets shut down or fined into silence; NGOs barred from receiving funds.
      *   **Yes:** Classify **Backsliding**. Proceed to Step 8 (Escalation Check).
      *   **No:** Proceed to Step 8.
  8.  **The Variance Check:** Is the change within the range of normal variance observed in established democracies (e.g., standard partisan redistricting, routine budget disputes with courts)?
      *   **Yes:** Classify **Functioning Democracy**. Terminate.
      *   **No:** Classify **Backsliding**. Proceed to Step 9.

  ### Phase 4: Escalation and Verification (15 Minutes)
  *Goal: Manage uncertainty and normative judgments.*

  9.  **Fact Contention:** Are the key facts (e.g., "Was the media outlet shut for taxes or politics?") contested by credible sources with no way to verify in 90 minutes?
      *   **Yes:** **ESCALATE TO SUPERVISOR.** Do not classify. Note the specific factual dispute.
      *   **No:** Proceed to Step 10.
  10. **Normative Judgment:** Does the classification require deciding if a threat (e.g., terrorism, economic crisis) was *real enough* to justify the rights suspension?
      *   **Yes:** **ESCALATE TO SUPERVISOR.** The analyst cannot weigh security necessities.
      *   **No:** Finalize Classification.

  ---

  ### Operational Notes: Distinctions and Compressions

  **Preserved Intact:**
  *   **De Jure vs. De Facto:** We distinguish between a law existing and a law being used to target opponents.
  *   **Election vs. Pre-conditions:** We distinguish between the vote count itself and the environment surrounding it.
  *   **Threshold vs. Trajectory:** We distinguish between a system that has broken (Non-Democracy) and one that is breaking (Backsliding).

  **Compressed for Usability:**
  *   **Sub-national Variation:** We treat the country as a unit. If backsliding is happening in one province but not the capital, we miss it.
      *   *Cost:* False negatives in federal systems.
  *   **Intent:** We look at *effect* primarily. We do not spend time proving malicious intent, only structural impact.
      *   *Cost:* May flag well-intentioned but damaging reforms as backsliding.
  *   **Historical Context:** We rely on the previous quarter's baseline. We do not re-evaluate the last 20 years every time.
      *   *Cost:* A country that slid slowly over five years may be classified as "Functioning" until a specific trigger fires.

  ---

  ## Part II: Case Applications

  ### Case 1: The Constitutional Court Reduction
  *Facts: Government uses ordinary amendment procedure + referendum to cut court from 15 to 9 members. Legislature gains budget/appointment authority. No rights repealed. No election altered.*

  **Procedure Run:**
  1.  **Baseline:** Executive elected? Yes. Legislature functioning? Yes.
  2.  **Change Detection:** Legal change detected (Constitutional amendment affecting judiciary).
  3.  **Threshold Test (Contestation):** Can opposition still win election? Yes. (Not Non-Democracy).
  4.  **Threshold Test (Pre-conditions):** Does this reduce legal redress? **Yes.** Stripping budget/appointment autonomy removes the court's ability to check the legislature independently. This hollows out the rule-of-law precondition.
  5.  **Variance Check:** Is this normal variance? **No.** Established democracies rarely allow legislatures to directly control judicial budgets/appointments mid-stream via referendum.
  6.  **Escalation Check:** Are facts contested? No. Normative judgment required? No (structural impact is clear).

  **Verdict:** **Backsliding.**
  **Reasoning:** The change is legal (De Jure) but erodes the institutional check required for a liberal democracy (De Facto). It fits the definition of "hollowing out rule-of-law conditions."
  **Political Inconvenience:** This verdict will be unpopular with board members who argue that a referendum ratifies any change. It asserts that procedural legality does not equal democratic health.

  ### Case 2: The Algorithmic Redistricting
  *Facts: Commission redraws districts via published algorithm. Opposition wins 50% vote, 40% seats. Analysts say this falls within range of established democracies.*

  **Procedure Run:**
  1.  **Baseline:** Executive elected? Yes.
  2.  **Change Detection:** Legal/Administrative change detected (Redistricting).
  3.  **Threshold Test (Contestation):** Can opposition win? Yes, they won 40% of seats with 50% of vote. They are represented.
  4.  **Threshold Test (Pre-conditions):** Are speech/association rights hit? No.
  5.  **Variance Check:** Is this normal variance? **Yes.** The prompt states independent analysts confirm this falls within the range of long-established democracies (e.g., US, UK, Canada all have vote-seat disproportionality).
  6.  **Escalation:** None.

  **Verdict:** **Functioning Democracy.**
  **Reasoning:** While the outcome is disproportionate, it does not cross the threshold of making opposition victory *improbable* nor does it violate pre-conditions. It is treated as standard electoral noise.
  **Note:** If the opposition had won 50% of the vote and 10% of the seats, Step 6 would trigger a "Backsliding" verdict.

  ### Case 3: The State of Emergency
  *Facts: Emergency declared after terror attack. Lasts 14 months. Press accreditation suspended for "spreading panic." Two outlets restored after 9 months.*

  **Procedure Run:**
  1.  **Baseline:** Executive elected? Yes.
  2.  **Change Detection:** Behavioral/Legal change (Emergency powers, press suspension).
  3.  **Threshold Test (Contestation):** Can opposition win? Yes, elections presumably still held.
  4.  **Threshold Test (Pre-conditions):** Does this reduce ability to speak/organize? **Yes.** Press accreditation suspension is a direct hit on free speech.
  5.  **Variance Check:** Is 14 months normal? **No.** Most established democracies limit emergencies to weeks or months unless renewed by legislature with strict oversight.
  6.  **Escalation Check:** **ESCALATE TO SUPERVISOR.**
      *   *Reason:* Step 10 of the procedure. Determining if the "terrorist attack" justification was sufficient to warrant 14 months of emergency powers is a normative judgment on security vs. liberty. The analyst cannot verify the threat level in 90 minutes.
      *   *Action:* Analyst flags the structural impact (Backsliding indicators present) but kicks the final classification to you.

  **Verdict:** **Escalated (Provisional: Backsliding).**
  **Reasoning:** The duration and the targeting of press suggest erosion of pre-conditions, but the justification requires a judgment call beyond the analyst's pay grade.

  ---

  ## Part III: Symmetry Audit

  **Application to Established Democracies (e.g., United States, France)**

  If we run this procedure on the United States or France, the following triggers would fire:
  *   **Case 2 Equivalent (US):** Redistricting often yields high vote-seat disproportionality. Under Step 8 (Variance Check), this is classified as "Functioning" because it is within historical variance.
  *   **Case 3 Equivalent (France/US):** States of emergency (e.g., post-2015 Paris attacks, post-9/11) often last months. Surveillance laws expand.
      *   *Risk:* If an analyst applies the "14 months" rule strictly without the Variance Check, the US or France could be flagged for Backsliding.
      *   *Mitigation:* Step 8 explicitly references "established democracies." The analyst must compare the action to the *peer group*, not an abstract ideal.

  **Asymmetry Risk:**
  The procedure risks a "Benefit of the Doubt" bias for established democracies.
  *   *Trigger:* Step 8 (Variance Check).
  *   *Defect:* An action in Turkey might be flagged as "abnormal" while the same action in the US is flagged as "variance" because the analyst perceives the US as having stronger informal guardrails.
  *   *Correction:* The analyst must cite *specific* comparable examples when invoking the Variance Check. (e.g., "This gerrymander is comparable to Maryland 2012," not "This is normal for democracies.")

  **Symmetry Verdict:**
  The procedure is structurally symmetric but relies on the analyst's knowledge of "established variance." If the analyst believes authoritarian acts are normal in Country A but aberrant in Country B, bias enters at Step 8. This is why Step 9 (Fact Contention) and Step 10 (Normative Judgment) exist to escalate uncertainty.

  ---

  ## Part IV: Limitations Account

  **1. The "Never-Democratic" Blind Spot**
  This procedure cannot detect backsliding in a country that was never a democracy to begin with.
  *   *Why:* Phase 1 establishes a baseline. If a country is already a "Non-Democracy" (e.g., single-party state), further repression does not change the classification.
  *   *Consequence:* We cannot distinguish between a stable autocracy and a worsening one. For your portfolio, this means countries like Russia or China will always read "Non-Democracy," masking any intensification of control.
  *   *Fix:* You need a separate "Repression Index" for Non-Democracies, but that is outside this protocol's scope.

  **2. The "Latent Backsliding" Problem**
  This procedure detects *institutional* change, not *cultural* or *normative* change.
  *   *Why:* It looks for laws passed, courts packed, or arrests made. It does not measure the chilling effect of rhetoric or the polarization of the electorate before laws change.
  *   *Consequence:* A country where the opposition is safe by law but terrified to run by social pressure will classify as "Functioning" until the first arrest happens.
  *   *Risk:* This creates a lag. You will identify backsliding only after it has produced a body count or a court ruling.

  **3. The Time-Budget Constraint**
  Ninety minutes is insufficient to uncover sophisticated corruption or legalistic authoritarianism that hides behind complex administrative codes.
  *   *Consequence:* The procedure relies on *reported* facts. If the international press is not watching a country closely, the analyst will find no "Change" in Phase 2 and classify it as "Functioning."
  *   *Risk:* False negatives in low-visibility countries.

  **4. The "Legalistic Authoritarian" Loophole**
  As seen in Case 1, a government can use perfect legal procedure to destroy democracy.
  *   *Consequence:* The procedure classifies this as "Backsliding," which is correct, but it invites the accusation of "politics wearing a lab coat" because it judges the *effect* of the law against an external standard of democracy.
  *   *Defense:* This is unavoidable. A definition of democracy that accepts any legal change as valid is tautological. The procedure admits this tension by escalating normative judgments to you.

  **Final Warning:**
  If this procedure never produces a verdict that makes a board member angry, it is broken. A classification system that aligns perfectly with partisan expectations is measuring alignment, not democracy. Case 1 is designed to anger those who prioritize procedural legality over liberal safeguards. Case 3 is designed to anger those who prioritize security over civil liberty. If your board is unanimous in approval, you are not measuring risk; you are measuring consensus.
