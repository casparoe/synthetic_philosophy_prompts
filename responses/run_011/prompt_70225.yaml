answer: |-
  This pattern lacks a single standard label, though it fuses two known objections. Worry #1 is the **Identity Objection** (the idealized self is psychologically discontinuous with the actual agent). Worry #2 is the **Circularity/Smuggling Objection** (substantive values are hidden in the procedural setup). Neither alone captures the mechanism you describe: that *adjusting idealization parameters* simultaneously *shifts normative output* and *erodes agent continuity*.

  I propose calling this **"The Idealization Displacement Problem."**

  **Definition:** A structural flaw in procedural normative theories where the deliberative process is normatively empty, causing substantive work to be displaced into the unconstrained specification of the ideal agent, which concurrently displaces the original agent via over-idealization.

  **Inside the carve:**
  *   Ideal Advisor accounts (Smith, Railton).
  *   AI alignment's Coherent Extrapolated Volition (CEV).
  *   Any "what you would want if..." framework where the "if" conditions are underspecified.

  **Outside the carve:**
  *   **Simple Subjectivism:** Lacks the idealization procedure required to displace work.
  *   **Objective List Theories:** Values aren't derived from agent endorsement.
  *   **Standard Circularity:** Purely logical loops without the identity-erosion component.
  *   **Standard Identity Objections:** Focus only on psychological continuity, ignoring how parameter tweaks drive the discontinuity to fix outputs.

  **Why this carving matters:** It reveals that "idealization" isn't a neutral filter but a value-laden generator. In AI alignment, this means "extrapolating volition" isn't discovering human values but *selecting* them via architectural choices about simulation fidelity, reflection time, and cognitive architecture. There is no "stop dial" because the dial *is* the value source.

  This distinguishes your insight from general circularity worries by highlighting the *trade-off*: you cannot reduce smuggling without reducing idealization, but reducing idealization loses the theory's normative force. It is a dilemma specific to procedural endorsement accounts where the procedure's constraints determine both the *answer* and the *answerer*.
