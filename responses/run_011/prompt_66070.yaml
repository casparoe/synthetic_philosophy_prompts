answer: |-
  Here is the diagnosis and the rebuild.

  ### 1. The Door Example: Keep it, but Fortify It
  **Is it the right vehicle?** Yes, but your Econ students are right to sniff at it, and you need to inoculate against that objection before they raise it.

  **The Objection:** "A closed door physically impedes entry. That's not a convention; that's physics. And 'open means walk in' is just rational response to low cost, not signaling."
  **The Fix:** You must distinguish the *physical state* from the *responsive regularity*.
  *   **Physical:** Door shut = privacy (intrinsic utility).
  *   **Conventional:** Door shut = *do not knock/enter* (responsive regularity).
  *   **The Arbitrariness:** We could have a convention where "Door Shut" means "I am busy but please knock," and "Door Ajar" means "Do not disturb." The physical privacy is the same; the *coordination on response* is the convention.

  **The Signaling/ Cheap Talk Objection:**
  An Econ student saying "It's just a signaling game" is technically correct but philosophically missing the point. Lewis's account *is* an account of how signaling systems emerge from coordination games.
  *   **Your Counter:** "You are describing the *mechanism* (signaling); Lewis is describing the *status* (convention). A signal only works *because* it is a convention. If I blink at you, it's not a signal. If we agree blinking means 'sell,' it's a convention. The door is the same. Don't let the machinery obscure the normative status."

  ### 2. The Sequencing Logic
  Your previous failure (collapsing convention into equilibrium) happens because you likely present the **Coordination Problem** and the **Equilibrium Solution** too tightly together. If students see a Coordination Game + Nash Equilibrium, they think "Job Done."

  To prevent this, you must insert a wedge between **Equilibrium** and **Convention**. That wedge is **Arbitrariness**.

  **The Logical Dependency Chain:**
  1.  **Recurrence:** Must be established first. (One-off interactions don't generate conventions).
  2.  **Coordination Problem (Interests):** Must be established second. (Distinguishes from Prisoner's Dilemma).
  3.  **Equilibrium (Conformity + Expectation):** This is where you let the Econ students drive.
  4.  **Arbitrariness (The Wedge):** This is where you stop them. "Yes, it's an equilibrium. But is it a convention?"
  5.  **Precedent/Common Knowledge:** This explains *how* we selected *this* arbitrary equilibrium over the other.

  **Where Game Theory Helps vs. Hurts:**
  *   **Helps:** Defining the Coordination Problem and the Equilibrium conditions (Conditions 1-3 of Lewis).
  *   **Hurts:** It tempts them to think rationality alone selects the equilibrium. You must switch off the "rationality selects" intuition and switch on the "history/precedent selects" intuition.

  ### 3. The 75-Minute Plan

  **00:00 – 00:10: The Phenomenon (Recurrence & Interests)**
  *   **Activity:** Describe the Door Case. Ask: "Why do you knock when it's ajar?"
  *   **Goal:** Establish **Recurrence** (we do this every day) and **Coincidence of Interests** (we all want to avoid awkwardness/interruption).
  *   **Trap Avoidance:** Do not mention "equilibrium" yet. Keep it phenomenological.
  *   **Phil/Econ Split:** Phils will talk about norms; Econ will talk about payoffs. Let them clash briefly, then unify: "We all want the same outcome (no awkwardness)."

  **00:10 – 00:25: The Game Theoretic Skeleton (Equilibrium)**
  *   **Activity:** Map it to a Coordination Game (like Driving Side).
      *   Player 1: Enter or Wait.
      *   Player 2: Invite or Reject.
      *   Payoffs: High if matched, Low if mismatched.
  *   **Leverage:** Let your Econ majors identify the Nash Equilibria. There are two: (Enter/Open) and (Wait/Shut).
  *   **Crucial Move:** Establish Lewis's Conditions 1, 2, and 3 here.
      1.  Regularity (Everyone shuts).
      2.  Expectation (Everyone expects others to shut).
      3.  Preference to Conform (I prefer to shut *if* you shut).
  *   **Status Check:** Ask: "Is this a convention yet?" Most will say yes. **Let them be wrong for a moment.**

  **00:25 – 00:40: The Wedge (Arbitrariness)**
  *   **Activity:** Introduce the "Reverse World."
      *   "Imagine a department where Shut = Come In, Open = Do Not Disturb."
      *   "Does that world have awkwardness? No."
      *   "Does it have Nash Equilibria? Yes."
      *   "So why is *our* way a convention and not just 'the rational thing to do'?"
  *   **The Definition Drop:** Introduce Lewis's Condition 4: **There exists an alternative regularity $R'$ that could have solved the problem.**
  *   **Why here?** If you put this earlier, they get bogged down in metaphysics. If you put it later, they've already collapsed the concept. It must come *immediately* after they identify the Equilibrium.
  *   **Misconception Defused:** This kills the "Equilibrium = Convention" error. Breathing is an equilibrium (everyone does it, expects it, prefers it), but it lacks an alternative. It is not a convention.

  **00:40 – 00:55: Expectations & Precedent (How we got here)**
  *   **Activity:** How did we select *this* equilibrium?
      *   Did we sign a contract? (No).
      *   Did we reason it out from first principles? (No, because the alternative is equally rational).
      *   **Answer:** Precedent and Common Knowledge. "We did it yesterday, so I expect you to do it today."
  *   **Misconception Defused:** This kills the "Explicit Agreement" error. Conventions are self-policing expectations, not contracts.
  *   **Econ Warning:** Explicitly tell the Econ students: "Rationality underdetermines choice here. You need history."

  **00:55 – 01:10: The Hard Case (Bad Conventions)**
  *   **Activity:** The "Reply All" Storm or the "Slow Stairs."
      *   "Everyone replies all. Everyone hates it. Everyone keeps doing it. Convention?"
  *   **The Lewisian Answer:** **No.**
      *   Lewis requires a **Coordination Problem** (near coincidence of interests).
      *   If everyone prefers the *opposite* outcome but is trapped, that is a **Prisoner's Dilemma** or a **Social Trap**, not a Lewis Convention.
      *   In a Convention, I prefer to conform *given that you conform*. In a Reply-All storm, I prefer *not* to reply all, even if you do (usually), or I prefer everyone stops.
      *   *Nuance:* If the regularity is "We all reply all because we expect others to," and I genuinely prefer to reply all *given that you do* (e.g., fear of missing out), it might be a convention, but it's a "bad" coordination equilibrium.
      *   *Recommendation:* Stick to the strict Lewis definition for this class. Lewis conventions solve coordination problems. If interests diverge significantly, it's not a Lewis convention. This clarifies the boundary for the Econ students (Coordination Game vs. PD).
  *   **Placement:** End of class. It tests the boundaries of the definition without breaking the construction.

  **01:10 – 01:15: Exit Ticket & Exclusions**
  *   **Exit Ticket:** (See below).
  *   **Exclusions:** (See below).

  ### 4. Misconception Map

  | Misconception | Who brings it? | When to defuse | How to defuse |
  | :--- | :--- | :--- | :--- |
  | **"Convention = Equilibrium"** | Econ majors | **Min 25-40** (The Wedge) | Use the "Breathing" or "Reverse Door" test. Equilibrium is necessary, not sufficient. |
  | **"Requires Agreement"** | Phil majors | **Min 40-55** (Precedent) | Emphasize *tacit* expectation vs. *explicit* contract. "Did you sign a door treaty?" |
  | **"Norms are 'Oughts'"** | Phil majors | **Throughout** | Keep Lewis descriptive. "We *do* conform," not "We *should* conform." The 'ought' derives from the expectation, not morality. |
  | **"Rationality Solves It"** | Econ majors | **Min 40-55** (Precedent) | Show that rationality allows *either* equilibrium. History breaks the tie. |
  | **"Bad Regularities = Conventions"** | Everyone | **Min 55-70** (Hard Case) | Distinguish Coordination (Common Interest) from Cooperation/Prisoner's Dilemma (Conflicting Interest). |

  ### 5. The Hard Case: "Bad Conventions"
  You asked if your answer (equilibrium vs. interests) is right.
  **Your intuition is correct, but sharpen the terminology.**
  *   **Lewis Convention:** Requires a *Coordination Problem*. This means there are multiple equilibria, and agents have a *common interest* in coordinating on *one of them* (even if they prefer different ones, like BoS, they prefer coordinating to not coordinating).
  *   **The "Reply All" Case:** If everyone hates it, but does it because they expect others to, this is often a **Prisoner's Dilemma** structure (Dominant strategy is to Reply All, but mutual silence is better).
  *   **The Verdict:** If it is a PD, it is **not** a Lewis Convention. Lewis conventions are *solutions* to coordination problems. A PD is a *failure* of coordination/cooperation.
  *   **Classroom Script:** "Lewis is specific. Conventions solve coordination problems where interests *coincide* regarding the need to coordinate. If we are all trapped in a outcome we all hate, that's a social trap, not a convention. Conventions are stable because we *want* to follow them given others do. Traps are stable because we *can't escape* them."

  ### 6. Exit Ticket & Exclusions

  **The Exit Ticket Question:**
  > "Everyone in this room breathes. Everyone expects everyone else to breathe. Everyone prefers to breathe given that others breathe. There is no alternative to breathing.
  >
  > **Question:** According to Lewis, is breathing a convention? Which specific condition distinguishes breathing from the door example?"

  *   *Correct Answer:* No. It fails the **Arbitrariness** condition (Condition 4). There is no alternative regularity $R'$ that could have solved the problem.
  *   *Why this works:* It forces them to recall the specific condition that prevents the "Equilibrium = Convention" collapse.

  **Explicit Exclusions (Say this out loud):**
  1.  **Evolutionary Game Theory (Sugden):** "We are doing Lewis's rationalistic account today. We are *not* asking how conventions evolve via selection over generations. We are asking how rational agents sustain them via expectations." (Prevents the "it's just evolution" objection).
  2.  **Formal Common Knowledge Logic:** "We will use 'common knowledge' intuitively (I know that you know that I know...). We are not doing the Aumann formal logic today." (Saves 15 mins of confusion).
  3.  **Normativity:** "We are describing why we *do* follow conventions, not whether we *morally ought* to. Lewis separates the 'is' of convention from the 'ought' of morality."

  ### Summary of the Fix
  Your previous plan likely went: *Problem -> Equilibrium -> Definition -> Examples.*
  **New Plan:** *Problem -> Equilibrium -> **ARBITRARINESS WEDGE** -> Definition -> Precedent -> Edge Cases.*

  By forcing the "Arbitrariness" condition immediately after the "Equilibrium" identification, you prevent the Econ students from closing the book too early. You make the Equilibrium a *necessary* condition, but the Arbitrariness the *sufficient* differentiator.
