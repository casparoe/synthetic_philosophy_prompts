  *Fix:* I need to tell the user to be careful. The *signaling* aspect is conventional. The *privacy* aspect is not. The convention is: "If you see the door shut, do not enter." The alternative is: "If you see the door shut, knock." Both solve the coordination problem of avoiding awkwardness.
  *Actually, better:* The "Hallway Side" example is purer. But the user likes the door. I will advise them to focus on the *interpretation* of the state, not the state itself.
