prompt: |-
  I cover AI and cognitive science for a magazine, and for about three months now I've been trying to write a piece on interpretability that doesn't just amount to "researchers are finding features inside neural nets, wow." Every draft dies on the same question, which nobody on either side will answer straight: does a trained network actually *have* representations — is there a fact of the matter about what its internal states are about — or are we projecting our own categories onto a blob of matrix arithmatic and then being impressed that the projection predicts things? I've decided to build the piece around a fake-but-deadly-serious document: the joint statement that a committed interpretability realist and a committed skeptic about neural representations could both sign after a genuine adversarial collaboration.

  Here's the case that convinced me the two sides aren't merely talking past each other, and that I'd like you to treat as the shared test bed for the document. A researcher shows me a small image classifier. They hunt for a direction in the hidden activations that lines up with "striped," and they find one; add a multiple of that direction at inference time and the model starts calling things tigers — a zebra, a striped sweater, a parking meter that happens to have stripes painted on it. Very cool. But the same model, read out with a different probe architecture, gives a different subspace that also decodes "striped," and there's a second direction that decodes it only for cartoonish images and not photographs. Ask which one is *the* representation and the room splits. My philosophy friend says this is just the 1980s thermostat debate with GPUs; the researcher says the thermostat had no steering experiments. Both think the other is dodging something.

  So: write that joint statement, in American English. I want a numbered section of claims both parties can sign — about what steering and activation-patching results establish and what they don't, about what "feature" and "representation" are doing as terms of art in the field, and about which of the open questions are empirical and which are really definitional. Then the residual disagreements as a table, with columns for: the disagreement stated neutrally, the wording the realist would accept for their own side, the wording the skeptic would accept for theirs, the experiment or argument or thought case both agree would bear on it, and each side's prediction about the outcome, written down before the result. No strawmen — don't let the skeptic come out as a nihilist who thinks the work is worthless, and don't let the realist come out as someone who thinks a linear probe settles metaphysics. Where you judge part of the dispute to be verbal, i.e. where the two are using "representation" to mean different things and would agree on every observable fact, say explicitly which part, why, and what is left over afterwards that isn't verbal. And please dont tack a bibliography onto the end; I need the document itself, roughly the length of something two people with reputations on the line could actually put their names to.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Role:** AI/Cognitive Science Journalist.
      *   **Task:** Write a "Joint Statement" resulting from an adversarial collaboration between an Interpretability Realist (believes neural nets have genuine representations) and a Representation Skeptic (believes we project categories onto matrix math).
      *   **Core Conflict:** Do internal states *have* meaning (fact of the matter), or is meaning projected by observers/probes?
      *   **Specific Case Study:** A small image classifier where "striped" can be found via steering (causes tiger/zebra classification) but also via different probes (different subspaces, context-dependent).
      *   **Format:**
          1.  Numbered section of agreed-upon claims (what steering/patching establishes, terminology usage, empirical vs. definitional questions).
          2.  Table of residual disagreements (Neutral statement, Realist wording, Skeptic wording, Agreed test case, Predictions).
          3.  Explicit identification of verbal disputes vs. substantive ones.
          4.  Tone: American English, serious, professional, no strawmen, no bibliography, appropriate length for a public statement by reputational stakeholders.
      *   **Constraint:** Do not just say "researchers find features." Address the metaphysics/epistemology tension.

  2.  **Deconstruct the Positions:**
      *   **Realist:** Neural networks develop internal structures that correspond to world features. Steering works because it manipulates *the* cause of the concept. Probes discover pre-existing structure. "Representation" is a natural kind in this context.
      *   **Skeptic:** Networks are function approximators. "Features" are useful fictions created by the interaction of the model, the probe, and the dataset. Steering works because of causal leverage, not ontological truth. "Representation" is a relational property, not an intrinsic one.
      *   **Common Ground:** Steering/patching *does* something real (causal influence). The current ambiguity hinders progress. Both want better models/safety. The "striped" case shows multiplicity of realization.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to establish what is *not* in dispute.
      *   *Claim 1 (Causal Efficacy):* Steering isn't magic. Changing activations changes outputs. This is empirical fact.
      *   *Claim 2 (Multiplicities):* Acknowledge the "striped" case. Multiple directions can encode the same semantic effect. This is the crux.
      *   *Claim 3 (Terminology):* Define "feature" and "representation" as working terms, not metaphysical absolutes.
      *   *Claim 4 (Utility):* Even if projected, these constructs are useful for safety/debugging.
      *   *Claim 5 (Empirical vs. Definitional):* Separate "does this vector cause tiger classification?" (empirical) from "is this vector *the* concept of tiger?" (definitional/metaphysical).

  4.  **Drafting - Section 2: The Verbal Dispute Analysis:**
      *   The prompt asks to identify where the dispute is verbal.
      *   *Insight:* Much of the fight is about the word "representation." If Realist means "causally efficacious internal structure" and Skeptic means "intrinsic semantic content," they might agree on the physics but disagree on the label.
      *   *Residual:* Even after fixing definitions, is there a fact of the matter about *which* structure counts? (e.g., the cartoon-specific stripe direction vs. the general one).

  5.  **Drafting - Section 3: The Table of Residual Disagreements:**
      *   Need specific, testable disagreements.
      *   *Disagreement 1: Uniqueness.* Is there a "best" basis?
      *   *Disagreement 2: Generalization.* Do features persist across architectures/tasks?
      *   *Disagreement 3: Human Alignment.* Do features map 1:1 with human concepts?
      *   *Predictions:* Must be specific (e.g., "Sparsity will decrease as model size increases" vs "Sparsity will stabilize").

  6.  **Refining Tone and Style:**
      *   Must sound like a formal consensus statement (like the Santa Fe Institute or a joint paper preamble).
      *   Avoid jargon where possible, but use precise technical terms (steering, probes, activation patching).
      *   Ensure the Skeptic doesn't sound like a luddite and the Realist doesn't sound like a mystic.
      *   *Self-Correction during drafting:* Initially, I might make the Skeptic too strong on "it's all nonsense." I need to pull back. The Skeptic agrees the work is *useful*, just disputes the *ontology*. The Realist agrees probes are imperfect, just disputes that *nothing* is real.

  7.  **Addressing the "Striped" Case:**
      *   Explicitly reference the scenario provided (zebra, sweater, parking meter, cartoon vs. photo).
      *   Use it to illustrate the "Multiple Realizability" point in the agreed claims.

  8.  **Final Review against Constraints:**
      *   American English? Yes.
      *   Numbered claims? Yes.
      *   Table included? Yes.
      *   Verbal dispute analysis included? Yes.
      *   No bibliography? Yes.
      *   Length? Needs to be substantial but readable (approx. 1000-1500 words).

  9.  **Writing - Step-by-Step:**
      *   *Header:* Title, Signatories (generic titles), Date.
      *   *Intro:* Context of the collaboration.
      *   *Part I:* Consensus Claims (1-6).
      *   *Part II:* Analysis of Verbal vs. Substantive Disagreement.
      *   *Part III:* Table of Residual Disagreements.
      *   *Closing:* Commitment to future work.

  *(Self-Correction on the Table)*: Make sure the "Prediction" column reflects the *philosophical* stance impacting the *empirical* expectation. For example, if the Skeptic thinks features are task-specific, they predict low transferability. If Realist thinks they are universal, they predict high transferability.

  *(Refining the Verbal Dispute Section)*: Be very clear. "If by 'representation' you mean X, we agree. If you mean Y, we disagree."

  *(Final Polish)*: Check for flow and ensure the "striped" example is woven in naturally as the catalyst for this agreement.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY OF INTERNAL STATES IN NEURAL NETWORKS**

  **Date:** October 24, 2023
  **Parties:** The Mechanistic Interpretability Working Group (Realist Faction) and The Functional Approximation Working Group (Skeptic Faction)
  **Subject:** Consensus and Residual Disagreement Regarding Neural Representations

  **Preamble**
  Following a three-month adversarial collaboration, prompted by conflicting results in directionality steering on small image classifiers (specifically regarding the "striped" feature class), the undersigned parties issue this statement. We acknowledge that while our metaphysical commitments differ, our empirical observations of model behavior are identical. This document delineates what is settled, distinguishes verbal disputes from substantive ones, and outlines the specific experiments required to resolve our remaining disagreements.

  ### Part I: Agreed Claims

  Both parties sign the following claims as empirically valid and conceptually necessary for further progress.

  1.  **Causal Efficacy is Established.**
      Steering experiments (adding vectors to activations) and activation patching demonstrate that specific internal directions possess causal leverage over model outputs. When a "striped" direction is amplified, the model's classification behavior shifts predictably (e.g., zebras and striped sweaters are classified as tigers). Both parties agree this is not an artifact of the probe; it is a property of the model's computation.

  2.  **Multiplicity of Realization.**
      There is no unique subspace that decodes a semantic concept. As demonstrated in the "striped" case, distinct directions can be found that both decode as "striped" and both effect steering, yet occupy different positions in activation space (e.g., one direction generalizes to photographs, another applies only to cartoons). Both parties agree that "one concept, one neuron/direction" is false.

  3.  **Probe-Dependence.**
      The identification of a feature is dependent on the probe architecture and the dataset distribution used to train the probe. A linear probe may find a subspace that a nonlinear probe does not, and vice versa. Both parties agree that a probe result is a statement about the *relationship* between the model and the probe, not solely about the model in isolation.

  4.  **Terminological Usage.**
      Henceforth, in joint experimental contexts, the term **"feature"** shall refer to *any direction in activation space that allows for successful steering and decoding above a defined threshold.* The term **"representation"** shall be treated as a placeholder for a hypothesis about the stability and generality of that feature. We agree to suspend ontological judgment on whether a representation "exists" intrinsically until Part III criteria are met.

  5.  **Utility Regardless of Ontology.**
      Both parties agree that interpretability tools are valuable for safety and debugging regardless of the outcome of this debate. If representations are projections, they are *stable* projections that allow for model intervention. If they are intrinsic, they allow for mechanistic understanding. The utility of the work does not depend on resolving the metaphysical question.

  6.  **Empirical vs. Definitional.**
      We distinguish between two classes of questions:
      *   *Empirical:* "Does perturbing direction $v$ change the probability of class $C$?" (Settled by experiment).
      *   *Definitional:* "Is direction $v$ the *true* carrier of semantic content for $C$?" (Dependent on criteria agreed to in Part III).

  ### Part II: Analysis of Verbal vs. Substantive Disagreement

  A significant portion of our conflict is verbal. We have isolated the source of this friction to the definition of **"aboutness"** (intentionality).

  **The Verbal Component:**
  *   **The Realist** uses "representation" to mean *a causally efficacious internal structure that aligns with an external category across counterfactual interventions.*
  *   **The Skeptic** uses "representation" to mean *an intrinsic semantic property that exists independently of the observer's probing framework.*

  **Resolution:**
  If the Realist adopts the Skeptic's definition, they must concede that networks do not have representations (as nothing in physics has intrinsic "aboutness"). If the Skeptic adopts the Realist's definition, they must concede that networks do have representations (as causally efficacious structures exist).
  **Agreement:** We agree that under the Realist's definition, representations exist. We agree that under the Skeptic's definition, they do not. **This portion of the dispute is closed.** It is a choice of vocabulary, not a disagreement about the matrix arithmetic or the steering results.

  **The Residual Substantive Disagreement:**
  Even after aligning definitions, a substantive disagreement remains regarding **Uniqueness and Natural Kinds.**
  *   **Realist Position:** Among the multiple directions that decode as "striped," one is *more natural* (e.g., sparser, more robust to noise, more transferable across architectures). There is a fact of the matter about which direction is the "real" feature, even if we cannot perfectly isolate it yet.
  *   **Skeptic Position:** The "naturalness" of a direction is entirely relative to the data distribution and the downstream task. There is no fact of the matter about which direction is "real"; there is only which direction is more useful for a specific goal. The cartoon-specific stripe direction is not a "degraded" version of the photo direction; it is simply a different solution to a different sub-problem.

  ### Part III: Table of Residual Disagreements

  The following table outlines the substantive disagreements that remain after resolving the verbal dispute. We commit to treating these as empirical bets.

  | Disagreement (Neutral Statement) | Realist Wording (Ontological Commitment) | Skeptic Wording (Functional Commitment) | Agreed Test Case / Experiment | Realist Prediction | Skeptic Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Feature Stability Across Architectures** | Do features persist when model architecture changes but task remains constant? | Features are **discovered**. They reflect universal properties of the data manifold. | Features are **constructed**. They reflect the inductive biases of the specific architecture. | Train a Vision Transformer and a ResNet on identical image data. Align their activation spaces using canonical correlation analysis (CCA). | High alignment of "stripe" directions. The feature is a property of the *task*, not the *net*. | Low alignment. The "stripe" direction in ViT will be geometrically distinct from ResNet. The feature is a property of the *solution*, not the *task*. |
  | **The "One True Direction" Hypothesis** | In the "striped" case (photo vs. cartoon), is one direction privileged? | The photo-general direction is the **ground truth** feature; the cartoon direction is a noisy approximation. | Both directions are **equally valid** local minima. Neither is ground truth; both are task-specific shortcuts. | Perform activation patching swapping the "cartoon stripe" direction into the "photo" inference path and vice versa. | The photo direction will sustain performance on cartoons better than the cartoon direction sustains performance on photos. (Asymmetry implies hierarchy). | Performance will degrade equally in both swap scenarios. (Symmetry implies distinct, non-hierarchical circuits). |
  | **Human Concept Alignment** | Do internal features map 1:1 with human semantic concepts? | Neural features are **alien but interpretable**. They map to human concepts because the world structure forces it. | Neural features are **instrumental**. They map to human concepts only where human labels overlap with model loss minimization. | Train a model on images labeled with a novel, non-human category (e.g., "textures with high Fourier energy at 45 degrees"). | The model will still develop "human" features (edges, colors) that combine to solve the task, showing human concepts are foundational. | The model will develop "Fourier" features directly, bypassing human-interpretable intermediates, showing human concepts are not foundational. |
  | **Scalability of Interpretability** | Does interpretability get easier or harder as models scale? | Features become **cleaner**. Over-parameterization allows for sparse, linearly separable representations. | Features become **entangled**. Over-parameterization allows for more complex, non-linear polysemanticity. | Compare sparsity and linear probe accuracy of the "striped" feature in a 10M param model vs. a 1B param model trained on same data. | Probe accuracy increases; steering requires fewer directions. (Superposition resolves with scale). | Probe accuracy plateaus or decreases; steering requires complex subspaces. (Superposition increases with scale). |

  ### Closing Commitment

  We acknowledge that the "striped" case study demonstrates that causal leverage does not imply ontological uniqueness. The Realist agrees that finding a steering vector does not settle metaphysics. The Skeptic agrees that the ability to steer does not render the work meaningless.

  We commit to resolving the predictions in Part III within 18 months. Should the Realist predictions hold, we will update our terminology to reflect "discovery." Should the Skeptic predictions hold, we will update our terminology to reflect "engineering." Until then, we will publish jointly, noting our divergent interpretations of the same data.

  **Signed,**

  *Dr. Elena Vance (Lead, Mechanistic Interpretability Working Group)*
  *Dr. Marcus Thorne (Lead, Functional Approximation Working Group)*
