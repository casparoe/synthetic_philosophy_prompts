answer: |-
  ### 1. Brainstorm Pass

  1.  **Eastern Mediterranean (1200 BCE):** Continuity low (palaces burn, literacy lost); Legibility high (fire layers, sudden); Myth high (Sea Peoples raiders vs. refugees).
  2.  **Classic Maya:** Continuity high (people stay, kings go); Legibility med-high (drought over decades); Myth very high (mysterious vanish vs. political shift).
  3.  **Rapa Nui:** Continuity med (culture shifts, people survive); Legibility low (slow ecological drift); Myth max (ecocide myth vs. resilience).
  4.  **Cahokia:** Continuity med-high (dispersal to descendants); Legibility low (slow depopulation); Myth high (vanished Indians vs. migration).
  5.  **Angkor:** Continuity high (urban to religious landscape); Legibility med (hydraulic failure slow); Myth med-high (lost jungle city vs. living space).
  6.  **Norse Greenland:** Continuity zero (everyone dead/gone); Legibility high (starvation, cold); Myth med (stubborn Europeans vs. climate/adaptation).
  7.  **Chaco Canyon:** Continuity med (migration to Pueblos); Legibility low (generational drought); Myth high (mystery vs. pilgrimage center).
  8.  **Indus Cities:** Continuity high (de-urbanization); Legibility zero (no texts, very slow); Myth high (Aryan invasion vs. climate).
  9.  **Post-Roman Britain:** Continuity low (language shift, elite replacement); Legibility high (legions leave, chaos); Myth high (Arthur/Invaders vs. adaptation).
  10. **Great Zimbabwe:** Continuity med (shift to Khami); Legibility low (trade route shifts); Myth very high (colonial denial vs. African state).

  ### 2. Tier List

  *   **S Tier:** Classic Maya, Angkor, Eastern Mediterranean. (These balance the "people survive the system" thesis with enough dramatic tension to sustain a plot.)
  *   **A Tier:** Post-Roman Britain, Cahokia, Great Zimbabwe. (Strong thematic potential, but either too familiar or too diffuse for immediate narrative grip.)
  *   **B Tier:** Indus, Rapa Nui, Chaco Canyon. (Either too slow to feel like an ending to the characters, or too mythologized to recover the human reality.)
  *   **C Tier:** Norse Greenland. (Fails your Continuity axis completely; it's a tragedy, not a transformation.)

  ### 3. The Three Picks

  1.  **Classic Maya (Southern Lowlands):** This novel argues with the idea that political authority is synonymous with cultural survival, asking whether a people can outlive their kings without losing themselves.
  2.  **Eastern Mediterranean (Late Bronze Age):** This novel argues with the notion of external invasion as the primary cause of failure, focusing instead on the fragility of interconnected complexity when trust evaporates.
  3.  **Angkor (Khmer Empire):** This novel argues with the definition of abandonment itself, exploring how a hydraulic city doesn't die but rather shrinks into a different kind of spiritual geography.

  ### 4. Weighting Critique

  Your weighting is slightly dumb for a novelist, though intellectually consistent with your "resilience" thesis. You have weighted **Continuity (0.45)** higher than **Legibility (0.35)**. For a historian, Continuity is the truth; for a novelist, Legibility is the plot. If the characters cannot perceive the end within their lifetime (low Legibility), you lose immediate stakes and must rely on dramatic irony, which is exhausting over five books. I would swap them: Legibility 0.45, Continuity 0.35. You want your characters to feel the ground shaking, even if the archaeology says they mostly stayed put.

  ### 5. Underused & Overexposed

  *   **Novelists Never Touch:** **Great Zimbabwe.** It scores well on Myth Load and Continuity, yet Western fiction almost ignores it in favor of Rome or Maya, leaving you a fresh landscape with high stakes about who gets to claim history.
  *   **Leave It Alone:** **Rapa Nui.** Despite the high Myth Load score, it is culturally exhausted; every reader thinks they know the "statues + ecocide" story, and you will spend half the book correcting them rather than telling your story.

  ### 6. Weighted Scores (Continuity 0.45, Legibility 0.35, Myth 0.20)

  1.  **Classic Maya:** 7.9
  2.  **Angkor:** 6.8
  3.  **Eastern Mediterranean:** 6.6
  4.  **Post-Roman Britain:** 6.2
  5.  **Cahokia:** 5.9
  6.  **Great Zimbabwe:** 5.9
  7.  **Indus Cities:** 5.7
  8.  **Rapa Nui:** 5.3
  9.  **Chaco Canyon:** 5.3
  10. **Norse Greenland:** 4.4

  ### 7. Least Confident Assessment

  I am least confident in the **Indus Cities** score, specifically on Legibility. Because we cannot read their script, we cannot know if *they* knew they were collapsing; I have scored it low based on the archaeological slowness, but a novelist could invent a sensory legibility (drying wells, shifting trade goods) that archaeology misses, making it potentially more dramatic than the data suggests.
