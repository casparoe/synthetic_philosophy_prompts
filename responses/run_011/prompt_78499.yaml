answer: |-
  Here is the design for **"The Accuracy Trap."** It is built for a pub back room, requires no calculators, and forces the philosophical points out of the mechanics rather than a lecture.

  ### **Logistics & Materials**

  **The Room:**
  *   One large whiteboard (or two flipcharts).
  *   One long table for the "Bank."
  *   Seating in a U-shape so everyone sees the board.

  **The Kit:**
  *   **25 "Credence Sliders":** Laminated A5 cards with a 0–10 scale printed on them. Each has a sliding paperclip or plastic marker. (0 = "Impossible", 10 = "Certain").
  *   **The Penalty Tiles:** 250 small foam squares, pre-cut in sizes $1\times1$ cm up to $10\times10$ cm. All red. (You need roughly: ten $1\times1$, ten $2\times2$... per player).
  *   **The Bank:** A large clear bowl filled with 500 poker chips (or dried beans).
  *   **The Urn:** An opaque bottle containing 20 poker chips (mix of Red/Blue, unknown ratio).
  *   **Two large foam dice** (one Red, one Blue).
  *   **The Trophy:** One single $10\times10$ foam square painted gold.

  **The Roles (Assign these immediately):**
  *   **The Banker:** (Your Options Trader). Controls the chip bowl, pays out winnings, collects penalties. They love the risk; let them manage the pot.
  *   **The Auditor:** (Your "No Numbers" Person). Their job is not to calculate, but to *measure*. When penalties are assessed, they physically stack the foam squares to verify the height. They are the arbiter of truth.
  *   **The Rollers:** (Two Pub Regulars). They roll the dice. No one else touches the randomizers.

  ---

  ### **Round 1: The Boaster's Bonus (15 Minutes)**

  **The Goal:** Demonstrate that binary "right/wrong" rewards drive credences to 100%, regardless of actual evidence.

  **The Setup:**
  Write on the board: **PAYOFF RULE: If you are RIGHT, you win tokens equal to your Confidence (0–10). If you are WRONG, you win 0.**

  **The Mechanic:**
  1.  **The Event:** The Rollers roll the Red Die. **Proposition:** "The die will show 4, 5, or 6" (50% chance).
  2.  **The Bet:** Everyone sets their slider (0–10). They hand their slider to the Banker.
  3.  **The Resolution:** Die is rolled.
      *   If 4–6 comes up: You are "Right." Banker pays you chips equal to your slider number.
      *   If 1–3 comes up: You are "Wrong." You get nothing.
  4.  **Repeat:** Do this three times with different 50/50 propositions (e.g., Blue Die Even/Odd, Coin Flip).

  **What Will Happen:**
  Everyone will slide to **10**. Why? Because if you think there's *any* chance it happens, saying "10" maximizes the payout. If you say "5" and win, you get 5 chips. If you say "10" and win, you get 10. If you lose, you get 0 either way. The risk is identical; the reward is higher at 10.

  **The Transition (What you say):**
  *"Look at the Banker's ledger. Half of you just lost three rounds in a row, despite knowing the odds were 50/50. You felt like you should have said '5', but the game punished you for honesty. This is the 'Hit Rate' trap. If you only get rewarded for being right, you are forced to be a fanatic. Let's fix the payoff."*

  ---

  ### **Round 2: The Accuracy Tax (25 Minutes)**

  **The Goal:** Demonstrate that a "proper scoring rule" (quadratic loss) incentivizes reporting true credence, and that evidence has a cost/benefit ratio.

  **The Setup:**
  Write on the board: **PAYOFF RULE: Start with 100 chips. Your Penalty is the Square of your Error.**
  *Explain visually:* "If the truth is 10, and you said 7, your error is 3. Your penalty is a $3\times3$ tile (9 chips). If you said 10, error is 0, penalty is 0."

  **The Mechanic:**
  1.  **The Event:** The Urn. It contains 20 chips (Red/Blue). The ratio is unknown (you prepared it; say, 14 Red, 6 Blue).
  2.  **Phase A (Blind):** Players set sliders for "Next chip drawn will be Red."
      *   Resolution: Draw one chip (with replacement).
      *   Scoring: The Auditor measures the distance between the Slider and the Truth (0 for Blue, 10 for Red). They hand the player the corresponding foam square (e.g., error of 4 = $4\times4$ tile). The player gives that many chips to the Bank.
  3.  **Phase B (Evidence):** Players can now **buy a peek**.
      *   Cost: 5 chips per draw from the Urn.
      *   They can draw as many as they like, update their slider, then the "Scoring Draw" happens.
  4.  **Repeat:** 5 Rounds.

  **What Will Happen:**
  *   **Honesty Emerges:** In Round 1, the 50/50ers will slide to 5. The maximizers from Round 1 will try to slide to 10, get hit with a $10\times10$ penalty (100 chips), and go bankrupt immediately. They will learn to match their slider to their feeling.
  *   **Evidence Valuation:** Some will buy too many draws (spending 20 chips to gain 1 chip of accuracy). Some will buy none. The Options Trader will likely calculate the exact value of information; the rest will feel it out.

  **The Transition (What you say):**
  *"Notice something. In Round 1, evidence didn't matter, only the shout. Here, if you saw three Reds in a row and didn't move your slider, you got punished. The game forced you to align your number with the world. But there's one more way to lose that has nothing to do with the world, and everything to do with you."*

  ---

  ### **Round 3: The Coherence Trap (20 Minutes)**

  **The Goal:** Demonstrate Accuracy Dominance. Incoherent beliefs are strictly less accurate than coherent ones in *every possible world*.

  **The Setup:**
  Write on the board: **THE TRAP.**
  **Prop A:** Red Die is Even (2, 4, 6).
  **Prop Not-A:** Red Die is Odd (1, 3, 5).
  *Logic:* One must be true. One must be false.

  **The Mechanic:**
  1.  **The Bet:** Players get **two** sliders. One for A, one for Not-A.
  2.  **The Constraint:** They must set them independently. (Do not tell them they must sum to 10).
  3.  **The Trap:** Many will set A=6 and Not-A=6 (feeling "confident" about both) or A=5 and Not-A=4 (rounding error).
  4.  **The Resolution:** Roll the die.
      *   If Even: Truth is (10, 0).
      *   If Odd: Truth is (0, 10).
  5.  **The Scoring:** Calculate total penalty tiles for both propositions combined.
  6.  **The Reveal:** You (the Host) reveal your "Bot" scores: **A=5, Not-A=5.**
      *   Ask the Auditor to stack the players' penalty tiles vs. your Bot's penalty tiles.

  **The Math (For you, not them):**
  *   **Player (Incoherent):** Says 6 on both.
      *   If Even (10, 0): Error is (4, 6). Penalty = $4^2 + 6^2 = 16 + 36 = 52$.
      *   If Odd (0, 10): Error is (6, 4). Penalty = $36 + 16 = 52$.
      *   **Total Penalty: 52 chips.**
  *   **Bot (Coherent):** Says 5 on both.
      *   If Even (10, 0): Error is (5, 5). Penalty = $25 + 25 = 50$.
      *   If Odd (0, 10): Error is (5, 5). Penalty = $25 + 25 = 50$.
      *   **Total Penalty: 50 chips.**
  *   **Result:** The Bot loses *fewer* chips in *every* outcome, despite knowing *less* about the specific outcome.

  **The Climax:**
  Have the Auditor stack the tiles. The Bot's stack is visibly shorter than the Incoherent Player's stack, regardless of the die roll.
  *"I didn't guess better. I just didn't fight myself. My beliefs were coherent. Yours were not. And because of that, I am objectively closer to the truth than you are, no matter how the die lands."*

  ---

  ### **The Debrief (10 Minutes)**

  **Map the Game to the Theory:**
  1.  **Round 1:** Shows why "Being Right" (Truth-Value) is a bad goal for degrees of belief. It forces extremism.
  2.  **Round 2:** Shows why "Closeness to Truth" (Accuracy) is the right goal. It rewards honesty and evidence-tracking. (This is the **Brier Score** without saying it).
  3.  **Round 3:** Shows why **Probabilistic Coherence** is required. If your beliefs violate the laws of probability (summing to 1), there is *always* a coherent set of beliefs that beats you on accuracy, in every possible world.

  **Handle the Objections (Cheat Sheet):**

  *   **Objection 1: "Immodesty."** *"My incoherent beliefs feel right to me. Why should I care about your Bot?"*
      *   **Answer:** "Feelings aren't the metric. Accuracy is. If you drive a car with misaligned wheels, it feels fine to you, but the tires wear out faster. The Bot's tires last longer. We care about getting to the destination (truth), not the steering wheel feel."
  *   **Objection 2: "Evidence Avoidance."** *"If I'm scored on accuracy, shouldn't I just refuse to look at evidence so I don't have to change my mind and risk being wrong?"*
      *   **Answer:** "Great question. In Round 2, did the people who bought draws go bankrupt? No. Proper scoring rules (like the foam squares) mathematically guarantee that *more information* always increases your expected score. You are never penalized for knowing more, only for being imprecise about what you know."
  *   **Objection 3: "Coherence isn't Truth."** *"You proved the Bot is coherent, not that the Bot is right."*
      *   **Answer:** "Exactly. Coherence doesn't guarantee you hit the target. It guarantees you aren't shooting at two different targets at once. It's the minimum requirement for being rational, not the maximum guarantee of success."

  **Predictable Failures & Fixes:**

  *   **The "50%er":** Someone who sets everything to 5 to minimize risk.
      *   *Fix:* In Round 2, point out that if the Urn is clearly 90% Red, setting 50% incurs a massive penalty ($5\times5 = 25$) compared to setting 9 ($1\times1 = 1$). Safety costs points.
  *   **The "Token Math" Fatigue:** Counting chips gets boring.
      *   *Fix:* Keep Round 3 to one roll. Let the Auditor do the stacking while you talk. The visual of the stack height matters more than the exact number.
  *   **Rounding:** People treating 0-10 as integers only.
      *   *Fix:* Allow sliders to sit between numbers. "You can be 6.5 confident."

  **The Hard Limit (What the Game Can't Do):**
  You must admit this in the close.
  *"There is one thing this game faked. In the game, you picked your numbers voluntarily. In real life, you can't just decide to believe the rain is 50% likely. Belief isn't a menu. This game shows you what rational belief **looks like** from the outside. It doesn't tell you how to force your brain to **be** that way from the inside. That's the hard part. The game gives you the target; it doesn't give you the bow."*

  **The Forfeit:**
  The player with the highest total penalty tiles across all rounds must put £5 in the charity jar (or buy the first round next month). The winner keeps the Golden Foam Square on their desk until the next meetup.
