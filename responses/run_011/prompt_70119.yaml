answer: |-
  Here is an argument demonstrating that the tension you describe is structural rather than presentational, and that resolving it forces the deflationist to abandon a core commitment of their view.

  ### The Argument from Diagnostic Entailment

  **1. The Non-Triviality Constraint**
  For deflationism to be a viable philosophical position, it must be non-trivial. It cannot merely be a stipulation about how the deflationist chooses to use the word "true." If deflationism were compatible with every substantive theory of truth (e.g., correspondence, coherence, pragmatism) simply by treating them as talking past one another, deflationism would lose its critical force. It would offer no reason to reject substantivism. Therefore, the deflationist is committed to the claim that substantivism is *mistaken*, not merely alternative.

  **2. The Diagnostic Move**
  To explain this mistake without admitting a direct contradiction, the deflationist typically offers a *diagnosis*. She argues that the substantive theorist is misled by grammar, reifies a logical device, or seeks an essence where there is none. The deflationist claims: "The substantivist thinks truth is a robust property, but this is a philosophical illusion generated by the surface structure of language."

  **3. The Structural Entailment**
  This diagnosis is not a neutral observation; it is a negative existential claim about the nature of truth. To assert that "the search for the nature of truth is misguided" is logically equivalent to asserting "truth has no hidden nature."
  *   Let $S$ be the substantive claim: "Truth has a robust nature $N$."
  *   Let $D$ be the deflationary diagnosis: "The belief that truth has a robust nature $N$ is a confusion."

  For $D$ to successfully rule out $S$ (satisfying the Non-Triviality Constraint), $D$ must entail $\neg S$. However, $\neg S$ ("Truth does not have a robust nature") is itself a claim about the metaphysical status of truth. It is a claim about what truth *is* (namely, that it is *not* a robust property).

  **4. The Reintroduction of Disagreement**
  Once the deflationist asserts $\neg S$ via her diagnosis, she is no longer dissolving the disagreement; she is participating in it. She is now advancing a rival theory of truth: "The theory that truth is non-substantive." The substantive theorist can now reply, "You claim truth has no nature; I claim it does. We disagree on the metaphysics of truth."
  Consequently, the deflationary claim is forced into a substantive reading. It becomes a competitor in the very market it sought to close down.

  **5. The Dilemma**
  The deflationist now faces a structural dilemma regarding her resources:
  *   **Option A:** Insist the diagnosis is substantive. She admits she is making a metaphysical claim ($\neg S$).
      *   *Cost:* She gives up the defining ambition of deflationism: that it is a *dissolution* of the problem rather than a *solution*. She becomes a "substantive deflationist," which is oxymoronic.
  *   **Option B:** Insist the diagnosis is merely linguistic/pragmatic. She claims she is only discussing word usage, not metaphysics.
      *   *Cost:* She gives up the Non-Triviality Constraint. If she is only talking about words, she cannot claim the substantive theorist is *wrong* about the world, only that they use words differently. This trivializes the view, rendering it philosophically inert.

  ### Why This Is Structural, Not Presentational

  One might object that this is merely a failure of phrasing—that a cleverer deflationist could phrase the diagnosis without implying $\neg S$. This is incorrect for two structural reasons:

  **1. The Scope of the T-Schema**
  Deflationism rests on the Exhaustiveness Claim: the T-schema ("'P' is true iff P") exhausts the concept of truth. If the T-schema is exhaustive, then any claim adding to it (like substantivism) is false. But the claim *that the T-schema is exhaustive* is not itself an instance of the T-schema. It is a second-order claim about the limits of the concept. Asserting these limits is a substantive philosophical move. You cannot use the T-schema to prove the T-schema is exhaustive without circularity; you must step outside the deflationary framework to defend it, and that step is inherently substantive.

  **2. The Normativity of Diagnosis**
  To diagnose the substantivist as "confused" implies a normativity about correct philosophical inquiry. The deflationist is claiming that the substantivist is violating rules of conceptual analysis or ontological parsimony. But adjudicating which ontological commitments are legitimate is the core business of metaphysics. By claiming the substantivist is *illegitimately* positing a property, the deflationist is making a substantive metaphysical judgment about what kinds of properties exist.

  ### The Necessary Sacrifice

  The deflationist has resources to answer this, but only by giving up **The Dissolution Ambition**.

  To escape the trap, the deflationist must concede that deflationism *is* a substantive theory of truth—specifically, a theory that posits truth is a logical device rather than a descriptive property. This saves the view from triviality (it now genuinely conflicts with correspondence theory) but forces the deflationist to abandon the claim that she is "changing the subject" or "dissolving" the debate.

  She must admit that she and the substantive theorist are both playing the same game (metaphysics of truth) and she is arguing for a specific move within that game (the "no-property" move). This collapses the distinction between deflationism and "error theory" or "nihilism" about truth properties, positions that are widely recognized as substantive metaphysical stances.

  **Conclusion**
  The deflationist cannot maintain that her view is both non-trivial (it rules out substantivism) and non-substantive (it dissolves the debate). The act of diagnosing the substantive theorist's error structurally necessitates making a claim about the nature of truth that competes with the substantive theorist's claim. To remain consistent, the deflationist must surrender the idea that deflationism stands outside the metaphysical fray; she must admit that deflationism is simply the metaphysical thesis that truth is insubstantial.
