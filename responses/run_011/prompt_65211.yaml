  # Stage 1: Axes of the Logical Space

  To construct the instrument, we define seven axes generating the logical space of positions on dreaming. Each axis represents a binary or multi-valued distinction regarding the nature of the dream state and the report.

  1.  **Temporal Origin:** Was the content generated *during* sleep or *upon* waking?
  2.  **Report Relation:** Is the waking report a *transcription* of a prior event or a *construction* inspired by a feeling?
  3.  **Phenomenal Presence:** Was there a felt location ("here") and self ("me") inside the scene (Immersion) or was it detached (Imagistic)?
  4.  **Doxastic Commitment:** Were propositions within the scene *believed* as fact or *entertained* at a distance?
  5.  **Continuity of Experience:** Is experience *continuous* throughout sleep, *patchy* (degrees), or *absent*?
  6.  **Status of Unreported Sleep:** Are the hours without recall *experience-free* or *experience-rich but unremembered*?
  7.  **Theoretical Intent:** Is the view asserted as *truth* about reality or *deployed* to undermine confidence in ordinary judgment?

  # The Decision Tree

  *Instructions for the Group: Follow the path that matches your conviction about your own sleep. The leaves at the end name the philosophical position that matches your answers.*

  **Node 1:** When you wake mid-sentence, was the sentence being spoken before you woke?
  *   **Yes:** Go to Node 2. (Commitment: Something happened during sleep.)
  *   **No:** Go to Node 6. (Commitment: The story begins at waking.)

  **Node 2:** Were you looking out from behind eyes inside the scene, or watching a screen?
  *   **Behind Eyes:** Go to Node 3. (Commitment: Immersion/Presence.)
  *   **Watching a Screen:** Go to Leaf A. (Commitment: Detached Imagery.)

  **Node 3:** In the scene, did you accept the events as fact, or hold them at a distance?
  *   **Accept as Fact:** Go to Node 4. (Commitment: Delusional/Standard Belief.)
  *   **Hold at a Distance:** Go to Leaf B. (Commitment: Lucid/Non-Delusional.)

  **Node 4:** Is there ever a time during sleep when nothing is happening for you?
  *   **Yes:** Go to Node 5. (Commitment: Experience is patchy.)
  *   **No:** Go to Leaf C. (Commitment: Experience is continuous.)

  **Node 5:** During the four hours you remember nothing, were you gone or just blank?
  *   **Gone:** Go to Leaf D. (Commitment: Unreported sleep is empty.)
  *   **Just Blank:** Go to Leaf E. (Commitment: Unreported sleep is full.)

  **Node 6:** If you had no memory of the dream, would you say you experienced anything at all?
  *   **No:** Go to Leaf F. (Commitment: No experience occurred.)
  *   **Unsure/Indeterminate:** Go to Node 7. (Commitment: Experience is indeterminate.)

  **Node 7:** Do you hold this view because you are sure it is true, or because you want to question what seems obvious?
  *   **Sure it is True:** Go to Leaf G. (Commitment: Assertion.)
  *   **Question Obvious:** Go to Leaf H. (Commitment: Deployment.)

  # Occupied and Empty Combinations

  This analysis maps the logical space generated by the axes above. It identifies which combinations of values are defended by existing positions (Occupied) and which are not (Empty).

  | Combination Profile | Status | Reason |
  | :--- | :--- | :--- |
  | **Construction + No Experience** (Node 6: No) | **Occupied** | Defended by Norman Malcolm. Dreams are logically incompatible with sleep. |
  | **Construction + Indeterminate + Assertion** (Node 6: Unsure, Node 7: True) | **Occupied** | Defended by Daniel Dennett (strict reading). The narrative is the dream. |
  | **Construction + Indeterminate + Deployment** (Node 6: Unsure, Node 7: Question) | **Occupied** | Defended by Daniel Dennett (rhetorical reading). Used to shake confidence. |
  | **Experience + Detached Imagery** (Node 2: Screen) | **Occupied** | The "Imagination View". Dreams are mental images, not perceptions. |
  | **Experience + Immersion + Distance** (Node 3: Distance) | **Occupied** | The "Lucid Realist" view. Experience is real, but belief is suspended. |
  | **Experience + Immersion + Fact + Continuous** (Node 4: No) | **Occupied** | Idealist/Continuous Consciousness views. Sleep is never unconscious. |
  | **Experience + Immersion + Fact + Patchy + Gone** (Node 5: Gone) | **Occupied** | Standard Neurobiological Realism. Dreams are conscious brain states, sleep is not always conscious. |
  | **Experience + Immersion + Fact + Patchy + Blank** (Node 5: Blank) | **Occupied** | Deep Sleep Experience theories. Unreported sleep contains content. |
  | **Experience + Detached + Fact** | **Empty** | **Incoherent.** If one is detached from the scene, one cannot accept its events as fact without contradiction. |
  | **Construction + Experience** | **Empty** | **Incoherent.** If the content is constructed at waking, there was no experience *during* sleep by definition. |
  | **Continuous + Gone** | **Empty** | **Incoherent.** One cannot be continuously experienced and simultaneously "gone" during deep sleep. |

  # Annotated Leaves

  **Leaf A: The Imagining View**
  *   **Gloss:** Dreaming is a kind of imagining and so involves no misleading sensations or false beliefs.
  *   **Awkward Commitment:** Must explain why dreams feel so much more involuntary and vivid than daydreaming.
  *   **Worst Evidence:** Eye-movement correspondence found in lucid dreamers (suggests motor planning consistent with perception, not just imagination).

  **Leaf B: The Lucid Realist**
  *   **Gloss:** Dreams are robust conscious experiences where the dreamer knows they are dreaming.
  *   **Awkward Commitment:** Must explain why this state is rare compared to the common feeling of being fooled.
  *   **Worst Evidence:** First-person report of non-lucid dreamers who insist they were fully fooled (requires positing two types of dream experience).

  **Leaf C: The Continuous Consciousness Theorist**
  *   **Gloss:** Experience is all-or-nothing across a night; there is no gap in consciousness.
  *   **Awkward Commitment:** Must explain why we report nothing for hours of deep sleep.
  *   **Worst Evidence:** Dream recall under laboratory awakening (shows recall is highly dependent on sleep stage, implying gaps).

  **Leaf D: The Neurobiological Realist**
  *   **Gloss:** A neurobiological account that treats dreams as robust conscious experience and explains their content from sleep physiology.
  *   **Awkward Commitment:** Must accept that some hours of sleep are truly experience-free (death-like).
  *   **Worst Evidence:** First-person report of "dreamless sleep" that feels like a blink (hard to distinguish from no experience).

  **Leaf E: The Deep Sleep Experience Theorist**
  *   **Gloss:** A position on which deep, report-free sleep is not experience-free either.
  *   **Awkward Commitment:** Must explain the total lack of memory without invoking amnesia mechanisms that erase *everything*.
  *   **Worst Evidence:** Polysomnography hypnograms (show distinct physiological states correlating with report probability).

  **Leaf F: The Skeptical Constructionist (Malcolm)**
  *   **Gloss:** The Malcolm-style denial; on this account there was nothing it was like for you to have those dreams at all.
  *   **Awkward Commitment:** Must tell the dreamer their vivid memory of the night is logically impossible.
  *   **Worst Evidence:** First-person report (dismisses the primary data of the phenomenon).

  **Leaf G: The Narrative Architect (Dennett - Assertion)**
  *   **Gloss:** The Dennett-style position asserted as true; the journal records stories composed at six in the morning, not events from the night.
  *   **Awkward Commitment:** Must treat the feeling of "having dreamt" as a post-hoc illusion.
  *   **Worst Evidence:** Eye-movement correspondence found in lucid dreamers (suggests real-time processing).

  **Leaf H: The Skeptical Provocateur (Dennett - Deployment)**
  *   **Gloss:** The Dennett-style position deployed to show that our ordinary confidence is unearned, since these are different positions.
  *   **Awkward Commitment:** Cannot claim to know what dreams *are*, only that we don't know.
  *   **Worst Evidence:** First-person report (uses the report to undermine confidence in the report).

  *Note on Indistinguishability:* Leaf G and Leaf H cannot be separated by the answers my group could give about their *own* dreams; they are separated only by the theorist's intent (Axis 7). Leaf D and Leaf E cannot be separated by first-person report alone (both admit gaps in memory); they are separated only by physiological interpretation or philosophical commitment to continuity.

  # User Mapping

  Your answers locate you firmly in the **Experience** branch (Node 1: Yes). You report **Immersion** (Node 2: Behind Eyes). You report **Distance** regarding belief (Node 3: Hold at a Distance—you were not fooled). You report **Patchy** continuity (Node 4: Yes). You are **Agnostic** on deep sleep (Node 5: No idea).

  This path leads to **Leaf B (The Lucid Realist)**. However, your resistance to the phrase "merely imagining" distinguishes you from Leaf A, and your admission that detail is added at telling introduces a slight tension with pure Realism (Leaf D). You straddle the line between **The Lucid Realist** (due to the lack of belief) and **The Neurobiological Realist** (due to the claim that something was happening). Since "Lucid Realist" is an occupied leaf that captures the "No Belief" constraint better than standard Neurobiological Realism, you occupy that leaf, though your agnosticism on deep sleep leaves Node 5 unresolved.

  Verdict: The Lucid Realist
