answer: |-
  Here is an account designed to fit your verdicts, followed by the necessary critique, the application to new cases, and the distinction regarding substance.

  ### The Account: The Indexical-Performative Principle (IPP)

  **The Principle:**
  Certainty attaches to the **first-personal indexical reference** constituted by the **occurrent act of thinking**. The content of the certainty is not a description of a substance, but the **self-constituting reference** of the thinker to themselves *as* the thinker of that thought.

  **Technical Breakdown:**
  1.  **Mechanism:** The judgment "I exist" is **Immune to Error Through Misidentification (IEM)** relative to the first-person pronoun. You cannot be right that *thinking is occurring* but wrong that *it is you* who is thinking, because the "you" is not identified via a description (which could fail) but via the subjective givenness of the thought itself.
  2.  **Mode:** It is **Performative**. The truth of the proposition is secured by the act of entertaining it. It is not a static fact discovered, but a status enacted.
  3.  **Scope:** It is restricted to the **Specious Present**. The certainty is anchored in the *occurrent* experience, not in memory or inference.
  4.  **Ontology:** It is **Ontologically Neutral**. It guarantees a subject of experience, but commits to no specific metaphysical category (substance, bundle, process) beyond "that which thinks."

  ---

  ### Checking the IPP Against Your 8 Verdicts

  1.  **Total Doubt:** **Fits.** The act of doubting is an occurrent thought. To doubt "I exist" is to perform the very act that verifies it. The certainty is in the performance, which defeats the doubt.
  2.  **The Impersonal Rewrite:** **Fits.** The IPP explains your unease. "Thinking is occurring" is the objective ground (secure but distant). "I think" is the indexical articulation (secure and self-involving). The IPP validates "I" without requiring a substantive "Self." The 'I' is simply the indexical anchor of the thought, satisfying your desire for self-knowledge without Lichtenberg's metaphysical commitment.
  3.  **Someone Else's Cogito:** **Fits.** The certainty is essentially indexical. My "I" refers to me; your "I" refers to you. There is no general premise "All thinkers exist" that I grasp first; I grasp *my* existence directly. Your existence remains a hypothesis for me because I lack the first-personal access to your occurrent thinking.
  4.  **The Amnesiac:** **Fits.** Since the 'I' is indexical and not descriptive, no history or name is required. The amnesiac has occurrent thinking; therefore, they have the ground for the indexical reference. They know *that* they are, even if not *who* they are.
  5.  **The Machine:** **Fits.** The IPP requires *occurrent thinking* (phenomenology), not just syntactic output. A machine emitting symbols lacks the internal givenness. If the machine *genuinely* doubts (has phenomenology), the IPP grants it certainty. Your weakening verdict reflects the uncertainty of whether the machine has phenomenology, not a flaw in the logic.
  6.  **Denial:** **Fits.** This is the definition of a performative contradiction. It is not logically impossible ($\neg \exists x (x=x)$); it is pragmatically impossible to *sincerely assert* it. The impossibility is in the doing, exactly as you verdicted.
  7.  **Duration:** **Conflict.** (See below). The IPP anchors certainty in the *occurrent* act. Memory is a representation of the past, not the present act itself. While you *feel* past existence is secure, the IPP classifies this as high-confidence memory, not Cogito-certainty.
  8.  **Fission:** **Fits.** The IPP guarantees the existence of the *subject of the current thought*. It does not guarantee the metaphysical continuity of that subject over time. In fission, the "owner from the inside" is certain; the "persisting substance" is not. The IPP distinguishes existence (IEM) from identity (fallible).

  ---

  ### The Necessary Sacrifice: Verdict 7

  The IPP cannot deliver Verdict 7 without diluting the definition of "certainty." I recommend you drop (or modify) **Verdict 7**.

  **Why drop 7 rather than another?**
  Verdict 7 conflates **psychological confidence** with **epistemic indubitability**.
  *   **Cases 1, 4, 6, and 8** rely on the structural relationship between thought and thinker *now*.
  *   **Case 7** relies on **memory**. Memory is a distinct faculty from intuition. Even if it feels secure, it is logically possible that you are a "five-minute mind" created ex nihilo with false memories of a past.
  *   Descartes was right to separate the *Cogito* (intuition) from the *Continuity of Self* (which requires God/memory validation). If you keep Verdict 7, you must admit that the certainty of the *Cogito* is not unique, as memory claims can feel equally secure but lack the self-verifying performative structure.
  *   **Recommendation:** Modify Verdict 7 to: "While I feel psychologically secure about my past, I acknowledge that this security relies on memory, which lacks the self-verifying structure of the present Cogito."

  ---

  ### Application to Three New Cases

  **1. A being that has thoughts but no first-person concept at all.**
  *   **Verdict:** They possess the **ground** of certainty but not the **articulation**.
  *   **Explanation:** Under the IPP, the certainty attaches to the *occurrent thinking*. If the being thinks, there is a subject. However, without the concept "I," they cannot formulate the proposition "I exist." They have *pre-reflective self-consciousness* (the certainty is lived) but not *reflective self-knowledge* (the certainty is known). The truth holds for them, but they cannot wield it as a weapon against doubt.

  **2. A dreamer who entertains the thought of his own existence while dreaming.**
  *   **Verdict:** Certain.
  *   **Explanation:** The IPP relies on the occurrence of thinking, not the veridicality of the thought's content regarding the external world. In a dream, "I am being chased by a dragon" is false regarding the world, but "I am thinking I am being chased" is true. Similarly, "I exist" in a dream is verified by the dream-thinking itself. The *cogito* survives the dream argument; that is why Descartes uses it to escape the dream argument.

  **3. The second-person variant: I tell you "You exist."**
  *   **Verdict:** Not certain for me (the speaker); potentially certain for you (the hearer), but not *because* I said it.
  *   **Explanation:** The IPP is essentially first-personal. When I say "You exist," I am making an inference based on your behavior or speech. I lack access to your occurrent thinking. For you, hearing "You exist" may trigger your own *Cogito*, but the certainty comes from your internal response, not my utterance. This preserves the asymmetry in your Verdict 3.

  ---

  ### Why Existence is Certain, but Substance and Persistence are Not

  The IPP explains this distinction through the difference between **Reference** and **Classification**.

  1.  **Existence ("I exist"):**
      *   This is a matter of **Reference**. To think the thought "I..." is to successfully refer to the thinker. The reference is guaranteed by the act of thinking. You cannot refer to nothing when the act of referring is itself the proof of the referent's presence. This is why it is IEM.

  2.  **Substance ("I am a thinking substance"):**
      *   This is a matter of **Classification**. Here, you take the referent (the "I") and categorize it under a metaphysical concept ("substance"). This requires a premise linking "thinking" to "substance." That link is not self-verifying. You could be a process, a bundle of perceptions, or a brain state. The *Cogito* gives you the *res* (thing), but not the *nature* of the *res*.

  3.  **Persistence ("I am the same thing that doubted yesterday"):**
      *   This is a matter of **Identity Over Time**. This requires comparing the current referent with a past referent. This comparison relies on **Memory**. As established in the critique of Verdict 7, memory is representational and fallible. The *Cogito* guarantees the thinker of *this* thought. It does not guarantee that the thinker of *this* thought is numerically identical to the thinker of *that* past thought. In the Fission case (Verdict 8), you see this clearly: the "I" is certain now, but the continuity is opaque.

  ### Summary
  The **Indexical-Performative Principle** secures the certainty of the present thinking subject without committing to a metaphysical self, explains the asymmetry between first and third person, and validates the Amnesiac and Fission cases. It requires you to concede that **Descartes was right about Duration (Verdict 7)**: the *Cogito* is a flash of intuition, not a permanent possession. The certainty of the past is a different epistemic animal than the certainty of the present.
