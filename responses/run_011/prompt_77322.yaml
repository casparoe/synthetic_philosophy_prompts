      *   Which claims survive?
          *   Post-hoc? No, if predicted beforehand.
          *   No independent evidence? Yes, existence $\neq$ adaptation.
          *   Untestable History? Yes, current existence doesn't prove past selection.
          *   Failure to Rule Out Alternatives? **Yes.** This is the big one. A byproduct explains the behavior too.
          *   Value Smuggling? Maybe.
          *   Under-specified Environment? Yes.
      *   *Key Insight:* The retreat highlights the gap between *proximate* mechanism (it happens) and *ultimate* cause (why it was selected).

