          *   Post-hoc/No Independent Evidence? **No, it doesn't work.** Geology has physical traces (rock layers). Evo psych often has only surveys.
          *   Failure to Rule Out Alternatives? **No, it doesn't work.** Plate tectonics ruled out land bridges. Evo psych often fails to rule out spandrels.
          *   Value Smuggling? **No.** Rocks don't have values.
          *   Under-specified Environment? **No.** We have data on Pleistocene climate, but evo psych often ignores it for vague "savannah" tropes.
      *   What survives the comeback? The charge must focus on *evidentiary standards* and *alternative hypothesis testing*, not merely the fact that it's about the past.

