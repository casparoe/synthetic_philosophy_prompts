answer: |-
  Here is a menu of the distinct claims hidden under the label "just-so story," categorized by their logical validity, followed by an analysis of the two specific argumentative moves you highlighted.

  ### Part 1: The Menu of Claims

  When a critic calls an evolutionary psychology (evo psych) hypothesis a "just-so story," they are usually making one of the following six specific claims.

  #### 1. The "Post-Hoc Flexibility" Claim
  *   **The Charge:** The hypothesis is constructed *after* observing the behavior and is flexible enough to explain the opposite outcome had it occurred (e.g., "Men prefer youth" vs. "Men prefer maturity" can both be fitted to reproductive strategy).
  *   **Verdict:** **Substantive and Fair.**
  *   **Why:** A hypothesis that predicts everything predicts nothing. If the narrative can be retrofitted to any data point without risk of being wrong, it is not scientific. However, if the hypothesis made a *risky prediction* before the data was collected, this charge is false.

  #### 2. The "Circular Evidence" Claim
  *   **The Charge:** The only evidence for the existence of the psychological mechanism is the behavior it is supposed to explain. (e.g., "Why do men do X? Because of Module M. How do we know Module M exists? Because men do X.")
  *   **Verdict:** **Substantive and Fair.**
  *   **Why:** This is a failure of independent verification. To avoid this, researchers need evidence of the mechanism from neuroscience, genetics, or cross-cultural universality that is distinct from the behavioral output.

  #### 3. The "Untestable History" Claim
  *   **The Charge:** We cannot observe the past selection pressures directly; therefore, we cannot verify the historical sequence that created the trait.
  *   **Verdict:** **Trivial Truth (about all historical science).**
  *   **Why:** We cannot directly observe the formation of the Grand Canyon or the mating habits of *T. rex* either. If this charge disqualifies evo psych, it also disqualifies geology, paleontology, and cosmology. The standard is not direct observation, but inference to the best explanation.

  #### 4. The "Failure to Rule Out Alternatives" Claim (The Spandrel Critique)
  *   **The Charge:** The author assumes the trait is an adaptation without rigorously testing null hypotheses: that the trait is a byproduct (spandrel), genetic drift, phylogenetic inertia, or a mismatch response to a modern environment.
  *   **Verdict:** **Substantive and Fair.**
  *   **Why:** This is the core methodological critique from Gould and Lewontin. Demonstrating a trait is *useful* now does not prove it was *selected for* then. This is the hardest hurdle for evo psych to clear.

  #### 5. The "Normative Smuggling" Claim
  *   **The Charge:** The author is projecting current cultural values or gender roles onto the Pleistocene to make them seem natural/inevitable (e.g., assuming ancestral division of labor matches 1950s suburbia).
  *   **Verdict:** **Substantive (Risk) / False (Inevitability).**
  *   **Why:** It is a substantive warning against bias. However, it is false to claim this *always* happens. Anthropological data can constrain these assumptions. The charge holds when the ancestral environment is assumed rather than evidenced.

  #### 6. The "Vague Environment" Claim
  *   **The Charge:** The "Environment of Evolutionary Adaptedness" (EEA) is treated as a magical, monolithic place (e.g., "The Savannah") rather than a specific, variable set of ecological conditions.
  *   **Verdict:** **Substantive and Fair.**
  *   **Why:** If the EEA is undefined, you can tailor the environment to fit the hypothesis. If the EEA is specified (e.g., "high pathogen load," "low caloric density"), the hypothesis becomes testable against archaeological and climatic data.

  ---

  ### Part 2: The "Retreat"
  **Scenario:** *A critic dismisses a hypothesis as a just-so story. An experiment later confirms the behavioral effect exists. The critic replies: "A real effect doesn't make the adaptive story any better."*

  Which readings of "just-so story" survive this retreat?

  **1. Claims that DO NOT survive the retreat:**
  *   **Post-Hoc Flexibility:** If the experiment was a pre-registered prediction based on the theory, the "made-up after the fact" charge is dead.
  *   **Circular Evidence:** If the experiment uses a methodology independent of the original observation (e.g., reaction time, hormonal assay, cross-cultural survey), the circle is broken.

  **2. Claims that DO survive the retreat:**
  *   **Failure to Rule Out Alternatives (The Big One):** This is the critic's strongest ground. Confirming that men *do* prefer X does not prove they evolved to prefer X. It could be a byproduct of a different adaptation (e.g., a general visual processing bias) or a cultural artifact that is universal but not genetic. The existence of the trait is not evidence of its *function*.
  *   **Untestable History:** Even if the behavior is robust, the link to *past selection* remains inferential. The critic can argue that while the proximate cause (the mechanism) is real, the ultimate cause (the evolutionary history) remains a story.
  *   **Vague Environment:** If the experiment confirms the behavior in a lab at Yale, it does not confirm that this behavior was adaptive in the Pleistocene. The link between modern utility and ancestral selection remains open to dispute.

  **Journalistic Takeaway:** When you see this retreat, the debate has shifted from **Psychology** (does this mechanism exist?) to **Evolutionary Biology** (was this mechanism selected for?). Most evo psych reporting conflates the two; the critic is trying to separate them.

  ---

  ### Part 3: The "Plate Tectonics" Comeback
  **Scenario:** *The proponent argues: "Everything from plate tectonics to dinosaur parenting was once called a just-so story. We infer the past from present traces in all historical sciences. Why is evo psych different?"*

  Does this analogy work against all the readings, or only some?

  **1. Where the Comeback WORKS (Defends Evo Psych):**
  *   **Against "Untestable History":** This is the analogy's strong suit. We did not see the continents move. We did not see *T. rex* brood eggs. We inferred these from present-day traces (fossils, rock magnetism, fit of coastlines). Similarly, evo psych infers selection from present-day traces (universals, cognitive mechanisms). If you reject evo psych because it studies the unobservable past, you must reject geology.
  *   **Against "Post-Hoc Flexibility" (sometimes):** Plate tectonics started as a hypothesis to fit existing data (continental fit) but gained power by predicting new data (sea-floor spreading). If evo psych moves from fitting data to predicting new universals, the analogy holds.

  **2. Where the Comeback FAILS (Does Not Defend Evo Psych):**
  *   **Against "Failure to Rule Out Alternatives":** Plate tectonics won because it ruled out the competing hypothesis (land bridges). It offered a mechanism (convection currents) that explained *more* data with *fewer* assumptions. Evo psych often fails to rule out the "byproduct" null hypothesis. The geology analogy fails here because geology has physical traces of the *process* (subduction zones); evo psych often lacks physical traces of the *selection pressure*.
  *   **Against "Circular Evidence":** Rocks do not have agendas. Psychological surveys are subject to cultural confounding. The "traces" in evo psych (self-reports, behaviors) are noisier and more multiply-determined than magnetic stripes on the ocean floor.
  *   **Against "Normative Smuggling":** Plate tectonics does not care about Victorian values. Evo psych hypotheses about mating or hierarchy are uniquely susceptible to projecting current social norms onto the past. The analogy fails because the *subject matter* involves human meaning, not just physical forces.

  **3. What a Charge Must Say to Survive the Comeback:**
  To defeat the "Plate Tectonics" defense, a critic cannot simply say, "You can't see the past." They must say:
  > "The quality of your **traces** is insufficient to support the weight of your **inference**."

  In geology, the trace (magnetic alignment) is physically necessitated by the process. In evo psych, the trace (a preference survey) is compatible with many processes (adaptation, drift, culture, learning). To survive the comeback, the critic must argue that evo psych is not failing because it is *historical*, but because it is **under-constrained**.

  ### Summary for Your Piece
  *   **"Just-So Story" is not one thing.** It ranges from a trivial observation about historical science (we weren't there) to a substantive methodological critique (you haven't ruled out byproducts).
  *   **The "Retreat" reveals the Adaptation Gap.** Confirming a behavior is easy; confirming it is an adaptation is hard. Critics retreat to the harder ground because it is defensible.
  *   **The "Plate Tectonics" defense is partial.** It validates studying the past, but it does not validate sloppy inference. Evo psych is not disqualified because it is about history; it is criticized when it treats history as a blank canvas for storytelling rather than a constrained reconstruction.

  **The Hook:** The phrase "just-so story" is doing too much work. It conflates the difficulty of *historical inference* (which applies to dinosaurs) with the difficulty of *functional attribution* (which applies uniquely to biology). Sorting these out saves the baby (evolutionary explanation) from the bathwater (Victorian storytelling).
