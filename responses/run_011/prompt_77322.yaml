  3.  **Evaluate Each Claim (Trivial vs. Substantive vs. False):**
      *   *Post-hoc:* Substantive if no predictions made. Trivial if all historical science starts with observation. *Verdict: Substantive if it lacks predictive power.*
      *   *No Independent Evidence:* Substantive. Adaptation claims need more than "it exists."
      *   *Untestable History:* Trivial/False. All historical science infers past from present traces. It's a challenge, not a disqualifier.
      *   *Failure to Rule Out Alternatives:* Substantive. This is the core methodological critique (Gould & Lewontin).
      *   *Value Smuggling:* Substantive (bias risk), but can be avoided.
