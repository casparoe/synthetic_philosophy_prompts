  **Intended to test:** The ontological status of propositions independent of cognitive acts.
  **Likely reply:** She will likely maintain propositions exist unentertained to preserve objectivity of truth.
  **Follow-up:** If they exist unentertained, what fills the positions in the absence of a predicator, and does this not reintroduce the need for a tie to hold them together statically?

  6. How does your account secure our capacity to understand a novel sentence upon first hearing it without presupposing a rule for combining constituents that looks suspiciously like a tie?
  **Intended to test:** The explanatory power of the view regarding linguistic competence and productivity.
  **Likely reply:** She will likely appeal to the inherent combinatorial nature of the constituents themselves.
  **Follow-up:** But if the constituents carry the combinatorial rules, are those rules not themselves additional entities that threaten to restart the regress you sought to avoid?

  7. Why should one not simply deny that propositions are structured at all and treat them extensionally, thereby dissolving the difficulty, and what does structure buy that is worth its metaphysical price?
  **Intended to test:** Whether the commitment to structure is necessary or merely traditional.
  **Likely reply:** She will likely argue that structure is required to explain logical inference and propositional attitudes.
  **Follow-up:** If structure is required only for inference, can we not treat it as a heuristic overlay rather than an ontological feature, thus sidestepping the unity problem entirely?

  8. Would the problem evaporate for a species whose language were natively non-linear, and if not, what does that show about whether the problem is a shadow cast by the medium?
  **Intended to test:** Whether the problem arises from linguistic representation or metaphysical reality.
  **Likely reply:** She will likely contend the problem is metaphysical and would persist regardless of linguistic modality.
  **Follow-up:** If it persists regardless of modality, does that not suggest the 'unity' we seek is a feature of our cognition rather than the proposition itself?

  9. You are entitled to say I have misdescribed your view; granting that, what is the most persistent misreading of your position, and what in your own exposition invites it?
  **Intended to test:** The clarity of her exposition and the robustness of her view against interpretation.
  **Likely reply:** She will likely say critics often reify the 'marking' into a constituent despite her warnings.
  **Follow-up:** If your exposition inevitably invites that reification, does that not indicate a limitation in the conceptual resources available to state the view without self-defeat?

  10. Which standing assumption are you prepared to abandon, that every relation might be conceived apart from its relata or that all constituents are separately referable, and what else in metaphysics becomes harder once that is given up?
  **Intended to test:** The broader metaphysical commitments and costs of her solution.
  **Likely reply:** She will likely abandon the separability of relations from relata.
  **Follow-up:** But if relations are inseparable, how do you account for the same relation appearing in distinct propositions without fracturing its identity?

  11. What argument or consideration would oblige you to relinquish this view, and whether any evidence could favour the rival account rather than merely fail to support yours?
  **Intended to test:** The falsifiability and comparative advantage of the view.
  **Likely reply:** She will likely say a demonstration that unity requires a further constituent would oblige her to relinquish it.
  **Follow-up:** But since you hold such a demonstration is unintelligible, is your position not insulated from refutation by a definitional fiat rather than argumentative strength?

  12. If the unity of the proposition is indeed primitive, what becomes of the ambition of metaphysics to analyze what is given, and must we accept that some things simply refuse to be taken apart?
  **Intended to test:** The implications of her view for the analytic project itself.
  **Likely reply:** She will likely argue that analysis reaches a bedrock where explanation must stop.
  **Follow-up:** If analysis stops there, is philosophy not reduced to describing the limits of thought rather than the structure of reality?
