prompt: |-
  I'm the volunteer board chair at a small food bank in a mid-size Ohio town — eleven paid staff, most of them part-time, plus about sixty regulars who unload trucks and stock shelves. Our executive director of nine years left in the spring of last year and I've been running the search for her replacement ever since, which means its been fourteen months and the place is starting to fray at the edges. We post on Idealist and the state nonprofit jobs board and we get somewhere between 80 and 140 applications a round, which is way more than three people working evenings can actually read.

  Here's the part I'm a little embarassed about. Early on I made up a system to keep from drowning, and I've been using it for four rounds now. Stage one: everybody gets screened against a one-page list of hard musts (five-plus years managing a budget, supervised staff before, can work a Tuesday evening shift when needed). Stage two: I interview in the order the applications come in. Stage three: at the end of each interview I score them on a ten-point rubric I also made up, and the first person who lands a 7 or higher gets an offer, and the search stops. Everyone on the board hated this at first, but it worked. We hired a woman who'd been running a pantry two hours north and she was genuinely good — organized, got along with the drivers, rewrote our whole intake process. She lasted about nine months before taking something closer to her mother, which I don't blame her for, but she'd been feuding with two of the board members near the end and afterward I decided the real lesson was that a 7 just wasn't a high enough bar.

  So round two I moved the cutoff to 8. Nobody hit it. Round three I moved it to 8.5 and I also cut the search off after twelve interviews instead of going through everyone who cleared stage one, on the theory that if the right person hasn't shown up by then they aren't coming. Round four I'm at a 9. For the record, in the last eleven months the highest score anyone has gotten on my rubric is an 8.2, and that was a guy who withdrew to take a job in Indiana. Meanwhile the salary line for the role got trimmed in the last budget because we're mid-way through a capital campaign for a new walk-in cooler, and we can't offer relocation, so I'm not sure a 9 exists at what we can pay.

  My husband says I'm being lazy and that you don't get to pick a number out of thin air and call it good enough when there are ninety more applications sitting unread — the pantry deserves the best person, and if that means reading all of them, read all of them. My friend Deirdre, who does hiring for a hospital system, says basically the opposite: she thinks the original rule was sound, she thinks the empty chair is the actual emergency here, and she specifically thinks raising the bar after a bad outcome is backwards, that the bar should move the other way. So — who's right? Is it irrational to make an offer to the first candidate who clears a cutoff I invented on a Tuesday night, when I could keep going? And is Deirdre right that the moving-bar thing is the bug in the system, or is that just her professional bias talking? I'd also honestly take some advice on how you're supposed to set a bar like that in the first place, because right now the 9 doesn't feel like a standard, it feels like a number I picked when I was annoyed.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **Role:** Volunteer Board Chair at a small food bank in mid-size Ohio.
      *   **Organization:** 11 paid staff (mostly part-time), ~60 regular volunteers. Small but operationally complex.
      *   **Problem:** Executive Director (ED) search has been ongoing for 14 months. High turnover risk (place is "fraying").
      *   **Process:**
          *   Stage 1: Hard musts screen (budget, staff, schedule).
          *   Stage 2: Interview in order received.
          *   Stage 3: Score on 1-10 rubric. First to hit cutoff gets offer.
      *   **History:**
          *   Round 1: Cutoff 7. Hired someone good, but she left after 9 months (family + board conflict).
          *   Round 2: Cutoff 8. No hires.
          *   Round 3: Cutoff 8.5 + capped interviews at 12. No hires.
          *   Round 4 (Current): Cutoff 9. Highest score so far 8.2 (withdrew).
      *   **Constraints:** Salary trimmed due to capital campaign. No relocation assistance. 80-140 applications per round. Only 3 people available to screen evenings.
      *   **Conflict:** Husband says "lazy/read them all/get the best." Friend Deirdre (HR pro) says "empty chair is emergency/lower the bar/stop moving it."
      *   **Questions:** Who is right? Is the "first to clear cutoff" rule irrational? Is the moving bar a bug? How do you actually set a bar?

  2.  **Evaluate the Hiring Strategy (The "Satisficing" vs. "Maximizing" Problem):**
      *   The user is using a *satisficing* strategy (Herbert Simon's concept): Set a threshold, take the first option that meets it. This is generally efficient and often recommended for high-volume hiring.
      *   *However*, the threshold is moving arbitrarily based on emotional reaction to the previous hire's departure, not market reality.
      *   *The "First to Clear" Rule:* This is actually a known heuristic (similar to the "Secretary Problem" or "37% Rule," though the user's version is simpler). It prevents analysis paralysis. It is *not* inherently irrational, *provided* the threshold is realistic.
      *   *The Moving Bar:* This is the critical failure point. Raising the bar after a failure (the ED leaving) assumes the failure was due to *quality* rather than *fit* or *circumstance*. The ED left for family reasons and board conflict, not necessarily incompetence. Raising the score requirement doesn't fix board conflict or salary constraints.
      *   *Market Reality:* 14 months, 4 rounds, ~400+ applications, highest score 8.2. The market is saying a "9" does not exist at this salary/location.

  3.  **Address the Specific Questions:**
      *   *Who is right (Husband vs. Deirdre)?* Deirdre is mostly right about the process, Husband is right about the urgency but wrong about the solution. Reading *all* applications is a waste of resources (diminishing returns). The empty chair *is* the emergency.
      *   *Is "first to clear cutoff" irrational?* No, it's a valid heuristic for volume hiring. But the cutoff needs to be calibrated.
      *   *Is the moving bar a bug?* Yes. It's "resulting" (judging decision quality based on outcome rather than process). The ED leaving wasn't necessarily a hiring failure.
      *   *How to set the bar?* Needs to be based on market data and role requirements, not arbitrary integers.

  4.  **Develop Actionable Advice:**
      *   **Stop the Search (Temporarily):** The current process is broken.
      *   **Recalibrate the Rubric:** A "9" is perfection. Perfection doesn't exist. Define what a "7" actually looks like in behaviors, not just feelings.
      *   **Address the Real Turnover Cause:** The previous ED left due to board conflict and family. A "9" candidate won't stay if the board is difficult. Fix the board dynamic.
      *   **Salary/Market Reality Check:** If the highest score is 8.2 and they withdrew, the role is underpriced. Acknowledge this.
      *   **Process Tweak:** Don't interview in strict chronological order. Batch them. Don't stop at the *first* 7/8; interview a small cohort (e.g., top 3 scoring above threshold) to compare.
      *   **Interim Solution:** Can an internal person step up? Can the Chair step back? 14 months is dangerous.

  5.  **Drafting the Response (Tone and Structure):**
      *   **Tone:** Empathetic, professional, direct, non-judgmental. Acknowledge the difficulty of volunteer leadership.
      *   **Validation:** Validate that the "satisficing" method isn't lazy; it's necessary for volume.
      *   **Diagnosis:** Pinpoint the "Moving Bar" and the "Outcome Bias" (blaming the hire score for the resignation).
      *   **Strategic Shift:** Move from "Finding a Unicorn" to "Building a Sustainable Role."
      *   **Specific Steps:**
          1.  Freeze the 9.
          2.  Re-evaluate the Rubric (Calibration).
          3.  Fix the Board (Retention).
          4.  Salary/Expectation Reality.
          5.  Hiring Cohort (don't stop at #1).

  6.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "lower the bar." I should say "calibrate the bar." A 7 might be fine if defined correctly.
      *   *Nuance:* The Husband's point about "reading all 90" is logistically impossible for 3 volunteers. I need to validate the user's constraint there.
      *   *Nuance:* The previous ED's departure wasn't a failure of the *hire*, it was a failure of *retention*. Distinguish these.
      *   *Crucial Point:* 14 months without an ED is a crisis. The risk of *no* hire outweighs the risk of an *imperfect* hire.

  7.  **Final Polish:** Check against the user's specific details (Ohio, food bank, capital campaign, board conflict). Ensure the advice feels tailored to a nonprofit context. (e.g., mention the "Nonprofit Hunger Gap" or similar dynamics if applicable, but keep it general enough). *Self-correction: Keep it focused on the hiring mechanics and board dynamics.*

  8.  **Final Output Structure:**
      *   Direct Answer (Deirdre is closer, but with nuance).
      *   Diagnosis of the System (The "Moving Bar" & "Outcome Bias").
      *   The "First to Clear" Rule (It's actually good, needs tweaking).
      *   How to Set the Bar (Calibration).
      *   The Elephant in the Room (Board Conflict & Salary).
      *   Immediate Action Plan.

  *(Self-Correction during final review)*: Make sure to emphasize that the Board Chair shouldn't be the *only* one interviewing. It introduces bias. But given the resource constraints (3 people evenings), acknowledge that limitation while suggesting a panel approach for the final round.

  Okay, ready to write.s
answer: |-
  First, take a deep breath. Fourteen months without an Executive Director (ED) is a crisis, but it is not your personal failure. It is a systemic problem that you are trying to solve with a process that has accidentally become a trap.

  To answer your specific questions: **Deirdre is much closer to the truth than your husband, but she's missing one critical nuance.** Your husband is operating in a fantasy world where time and volunteer energy are infinite. Deirdre is right about the hiring mechanics, but she may be underestimating the retention issue.

  Here is the breakdown of why your system broke, why the "moving bar" is dangerous, and how to fix this before the food bank frays beyond repair.

  ### 1. The "Moving Bar" is a Bug, Not a Feature
  You are suffering from **outcome bias**. You hired a woman who scored a 7. She was, by your admission, "genuinely good." She organized the pantry, got along with drivers, and improved intake. She left for two reasons: family proximity (unavoidable) and board conflict (fixable).

  She did not leave because she wasn't an "8."

  By raising the bar to 9, you are trying to solve a retention problem with a recruitment filter. You are assuming that a "9" candidate will tolerate board friction better or has a magic shield against family obligations. They won't and they don't. A "9" candidate who is overqualified for the salary will likely leave *faster* because they have more options.

  **Verdict:** Stop moving the bar. It is now detached from market reality. If the highest score in four rounds and ~400 applications is an 8.2, **a 9 does not exist at your price point.** Continuing to search for one is not diligence; it is avoidance.

  ### 2. Is the "First to Clear" Rule Irrational?
  Actually, no. In economics and decision theory, this is called **satisficing**. When you have high volume and limited resources (3 volunteers, evenings only), you cannot maximize (find the absolute best). You must satisfice (find the first option that meets your needs).

  Your husband suggests reading all 90 unread applications. With 3 people, that's 30 applications each. If each takes 10 minutes, that's 5 hours of volunteer time per person, just on initial reads, before a single interview. That is unsustainable. Your instinct to create a cutoff was correct.

  **However, the "Stop at #1" rule has a flaw.** It creates pressure on the interviewers to find reasons to reject the current candidate so they can keep looking, or conversely, to hire too quickly out of exhaustion.
  **The Fix:** Don't hire the *first* person who clears the bar. Hire the *best* person among the *first three* who clear the bar. This gives you comparison data without reopening the floodgates.

  ### 3. How to Set a Bar That Isn't Arbitrary
  You asked how to set a bar if not by picking a number on a Tuesday. A rubric score is only as good as its calibration. Right now, your "9" is a feeling, not a metric.

  *   **Define the "7":** A 7 should not mean "good." It should mean "Safe." Can they do the job without burning the place down? Do they meet the hard musts? Are they culturally decent?
  *   **Define the "9":** A 9 is a unicorn. They transform the organization, bring in new funding, fix the board dynamics, and work for below-market pay. As you noted, you cannot afford a 9.
  *   **Calibration Exercise:** Before the next interview, have your three screeners score the *same* fake resume or a past candidate you all know. If one person thinks a candidate is a 6 and another thinks they're a 9, your rubric is subjective garbage. You need behavioral anchors (e.g., "Score 8: Candidate gives specific example of managing a budget deficit," vs. "Score 5: Candidate speaks generally about budgeting").

  ### 4. The Elephant in the Room: Board Conflict
  You mentioned the last ED was "feuding with two of the board members near the end." This is the most alarming sentence in your post.

  High-caliber candidates smell board dysfunction during the interview process. If your board is known in the local nonprofit community for chewing up EDs, your applicant pool is self-selecting for people who are desperate or unaware.
  *   **The Risk:** If you hire a "9" but the board remains fractured, the "9" will leave in nine months, and you'll be back here in year two.
  *   **The Fix:** Before you make another offer, the Board Chair (you) needs to address the friction. Are those two board members willing to work under a new ED? Do they need to be rotated off? You cannot hire a new captain if the crew is mutinous.

  ### 5. Immediate Action Plan
  You are in a danger zone. 14 months is long enough to lose donor confidence and staff morale. Here is how to close this search in the next 30 days.

  1.  **Freeze the Score at 7.5:** Acknowledge that a 7 was proven "good enough" last time. Set the bar at 7.5 to allow for a margin of error, but admit that a 7.5 is a *hireable* candidate.
  2.  **The "Cohort of Three" Rule:** Interview candidates in batches. Once three candidates score above 7.5, stop interviewing. Compare those three. Pick the best fit. Do not go back to the pile.
  3.  **Salary Reality Check:** You trimmed the salary line for a cooler. That is a capital expense. An ED is an operating expense. If you cannot fill the seat, the cooler doesn't matter because there's no one to run the food bank. **Restore the salary.** If you can't, be transparent about it in the job post so you stop attracting candidates who will withdraw for better pay (like the 8.2 guy).
  4.  **Address Retention in the Interview:** Ask candidates: "This role requires navigating strong board opinions. How do you handle conflict with governance?" If they flinch, they aren't a 7, regardless of their budget skills.
  5.  **Interim Stability:** If you have a strong Operations Manager or similar among the 11 staff, can they be given an interim title and stipend while you finish this? It stops the bleeding.

  ### Summary
  Your husband is wrong: Reading every application is a waste of scarce volunteer resources.
  Deirdre is right: The empty chair is the emergency, and raising the bar is backwards.
  **But you are also right to be worried:** Hiring the wrong person is expensive.

  The solution isn't to read more resumes. It's to accept that **a "Good" ED who stays is infinitely better than a "Perfect" ED who never applies.**

  Lower the score. Fix the board dynamics. Restore the salary if possible. Make an offer to the next person who clears a realistic bar. You have done a heroic job keeping the lights on for 14 months, but you are not the ED. The organization needs a leader, even an imperfect one, more than it needs a perfect score.
