answer: |-
  Here is an analysis of your decision problems and the principles underlying your verdicts, presented in British English as requested.

  ### 1. The Principle

  The principle that best captures the majority of your firmest verdicts (Cases 3, 4, 6, 10) is **Functional Decision Theory (FDT)**, specifically formulated as **Logical Subjunctive Dependence**.

  **Statement of Principle:**
  > An agent should choose the action that maximises expected utility, calculating that utility by conditioning on the output of their own decision algorithm. The agent must treat the output of this algorithm as logically fixed across all instances where the algorithm is instantiated or accurately simulated.
  >
  > **Reference Class:** The reference class consists of all agents whose decision-making process is logically subjunctively dependent on the agent's own. This includes exact copies, agents running sufficiently isomorphic algorithms, and predictors simulating the agent. It excludes agents whose decisions are causally or logically independent, even if they are physically similar.
  >
  > **Decision Rule:** Select action $A$ to maximise $E[U | \text{Algorithm outputs } A]$. Where the algorithm outputs a probability distribution (as in coordination games), select the distribution that maximises expected utility assuming all members of the reference class adopt the same distribution.

  ### 2. Motivation for Clauses

  *   **Logical Subjunctive Dependence (Cases 3, 6, 10):** This clause motivates your willingness to cooperate with an exact duplicate (Case 3) and one-box in Newcomb problems (Case 6), while defecting against a twin with unlike reasoning (Case 10). A simpler rule based on physical similarity (e.g., "cooperate with kin") would fail Case 10 and Case 6. This clause accomplishes the separation of *causal* influence from *logical* correlation, allowing you to cooperate with a predictor who is physically unlike you (Case 6) but refuse to cooperate with a defector who is physically similar but logically independent (Case 5).
  *   **Algorithm Instantiation (Case 4):** This explains your graded firmness in cooperating with a "similar stranger". The degree of cooperation tracks the estimated probability that the stranger's reasoning process is isomorphic to yours. A binary rule (cooperate/defect) cannot capture the "noticeably less firmly" nuance you describe.
  *   **Probabilistic Output for Coordination (Case 9):** This addresses the "Duplicate with different information". Since the information sets differ, the algorithms differ ($Algorithm_{1-round} \neq Algorithm_{10-round}$). Thus, they are not in the same reference class. This saves the intuition that information breaks the mirror, which a rigid "copy" rule might miss.

  ### 3. Failures and Choice of Principle

  This principle fails to deliver two of your specific verdicts without modification:

  1.  **Case 1 (Platonia):** FDT dictates that in a symmetric coordination game with $N$ identical reasoners, the optimal strategy is to randomise with probability $p=1/N$. Your verdict ("I should not send") is a Causal Decision Theory (CDT) verdict, assuming your action does not influence the others. FDT requires you to send with probability $1/20$.
  2.  **Case 8 (Threshold Appeal) Justification:** While your verdicts in Case 8 (give if far off, don't if met) are often consistent with FDT outcomes, your *justification* ("tracking my own marginal causal impact") contradicts Case 7 (Voting). In Voting, you ignore causal impact in favour of logical correlation. In Threshold, you revert to causal impact. FDT demands consistency: if "people of my sort" are logically linked, you should give in the Threshold case even if your causal pivotality is low, provided your contribution signals others to contribute.

  **Choice:** I prefer the **Simpler Principle (FDT)** and recommend overturning the verdict in **Case 1** and the justification in **Case 8**.

  **The Loss:**
  *   **Case 1:** You must accept that "sending with probability one in twenty" is not "smuggled reasoning" but the only rational move for a superrational agent. By refusing to send, you guarantee a zero payoff if everyone reasons as you do. The loss is the comfort of a deterministic "no" in favour of a probabilistic strategy that feels like abdicating control.
  *   **Case 8:** You must abandon the intuition that causal pivotality is the deciding factor. If the fundraiser is far off, and you are logically linked to other donors, your donation is an endorsement of the policy "people like us fund this". If you withhold, you logically endorse "people like us withhold". The loss is the ability to use "it won't make a difference causally" as a shield in public goods games where you would otherwise vote.

  ### 4. Application to New Cases

  1.  **Platonia with Intimate Knowledge:** If the twenty know one another's reasoning intimately, the logical link is strengthened. FDT verdict: **Randomise with $p=1/20$.** The intimacy removes uncertainty about the reference class, making the superrational solution mandatory.
  2.  **Luring Lottery (Small Group):** If restricted to a small reading group who all reason as you do, the situation becomes structurally identical to Platonia. FDT verdict: **Randomise.** Do not treat it as a standard lottery (CDT) where you maximise entries. If everyone maximises entries, the prize value per entry drops to zero. You must limit your entries to $1/N$ of the maximum allowed (or randomise entry) to preserve prize value.
  3.  **Dilemma against Reversing Simulator:** An agent that simulates you but reverses your conclusion creates a negative logical correlation. If you cooperate, it defects; if you defect, it cooperates. FDT verdict: **Defect.** (Assuming standard Prisoner's Dilemma payoffs where $T > R > P > S$). If you cooperate, you get the sucker's payoff ($S$). If you defect, you get the temptation payoff ($T$). Unlike Newcomb, where the predictor rewards your cooperation, this adversary punishes it.
  4.  **Threshold Public Good (10% Short, 1000 Like-Minded):** FDT verdict: **Give.** Even if your single contribution does not causally bridge the 10% gap, your decision algorithm is instantiated in the other 999. If you calculate "I should not give because I am not pivotal", the logical implication is that the other 999 also calculate "I should not give". The project fails. If you calculate "I give", the logical implication is that a significant portion of the 999 give, likely bridging the gap. You must act as the tipping point for the *class*, not the *causality*.

  ### 5. Classification and Superrationality

  What I have ended with is **Functional Decision Theory (FDT)**, as formalised by Yudkowsky and Soares (2017), which is the rigorous mathematical descendant of Hofstadter's **Superrationality**.

  *   **Is it Evidential Decision Theory (EDT)?** Broadly, yes, but with a restricted reference class. Standard EDT conditions on the *act* ("If I see myself one-boxing..."). FDT conditions on the *algorithm* ("If my algorithm outputs one-box..."). This distinction solves the "Smoking Lesion" problem where EDT fails.
  *   **Is it Causal Decision Theory (CDT)?** No. CDT explicitly ignores the logical correlations you rely on in Cases 3, 6, and 7.
  *   **Is it Team Reasoning?** It overlaps significantly. Bacharach's team reasoning suggests acting as a member of a group. FDT provides the mechanism for *identifying* the team: it is the set of agents running your algorithm.
  *   **Does the Superrational Assumption Add Work?** Yes. Ordinary conditionalisation on "my reasoning type" (EDT) can lead to spurious correlations (e.g., believing that crossing the street causes cars to stop because you only cross when cars are stopping). The superrational/FDT constraint restricts this to *logical* dependence. It asserts that the correlation exists *because* we are running the same computation, not merely because we are statistically similar. This prevents the "why don't you cure cancer by wishing?" objection to EDT.

  ### 6. Confidence and Corrections

  **Confidence:** I am **85% confident** that Functional Decision Theory is the correct formalisation of your intuitive cluster of verdicts. It is the only current framework that consistently handles Newcomb problems (Case 6), Prisoner's Dilemmas with copies (Case 3), and Voting (Case 7) without contradiction.

