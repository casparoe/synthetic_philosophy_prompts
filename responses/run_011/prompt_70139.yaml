  3.  **Formulate a Position:**
      *   *Thesis:* The practice of penalized model selection is *methodologically* Humean but *metaphysically* neutral, provided we distinguish between epistemic access and ontological status. However, the *justification* for the penalty often smuggles in a substantive simplicity assumption (Occam's Razor) that leans Humean.
