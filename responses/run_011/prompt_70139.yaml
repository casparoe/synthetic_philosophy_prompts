answer: |-
  Subject: Re: Humeanism, model selection, and the penalty term

  Dear Student,

  It is genuinely refreshing to receive a question that cuts this directly to the bone of the relationship between scientific practice and metaphysical commitment. You have put your finger on a tension that many philosophers of science gloss over because it requires knowing enough about the actual mathematics of model selection to see where the philosophy leaks in. Your intuition that your daily work looks like the Best System Account implemented in code is correct, but I want to argue that while the structure mirrors Humeanism, the justification for the penalty term does not force you into that metaphysics, provided you are careful about what you claim the penalty is doing. My position is that the penalty term itself is metaphysically neutral and functions as an epistemic correction for finite data, compatible with governing laws, but the moment you claim that the model selected by this penalty is true rather than merely predictively robust, you are smuggling in a substantive simplicity assumption that leans heavily Humean. The practice of penalized selection is underdetermined by the metaphysics, but the interpretation of the output is not.

  To see why the penalty does not strictly require Humeanism, we need to separate the problem of induction from the problem of lawhood. A Non-Humean who believes in governing relations still faces the fact that their data is noisy and finite. Even if laws are exceptionless producers of events, your measurement of those events is not. If you fit a high-degree polynomial to noisy data generated by a simple linear governing law, the polynomial will fit the noise, not the law. The penalty term in this context is not a claim that the world is simple; it is a claim that your data is insufficient to distinguish signal from noise without regularization. It is a hedge against overfitting the error term, not a definition of what a law is. A governing theorist can happily use L2 regularization or AIC because they acknowledge that while the law might be strict, their access to the mosaic is imperfect. The penalty is a tool for navigating the gap between the mosaic and the law, not a declaration that the law is just the summary of the mosaic. So, to answer your specific question, the penalty term does not presuppose Humeanism about lawhood; it presupposes fallibilism about data.

  However, you are right to be suspicious about the different criteria you mentioned, because they do carry different commitments, and this is where the metaphysics starts to bite. You distinguished between criteria aimed at prediction and those aimed at identifying the true model, and this is the crucial fault line. Criteria like AIC or cross-validation are instrumental; they ask which model will minimize future error. These are perfectly compatible with a Non-Humean view because a false model can still be a good predictor of a governed world. But criteria like BIC, which aim for consistency and assume the true model is in the candidate set, rely on the assumption that as data grows, the penalty will strip away false parameters until only the true structure remains. This assumes that the true governing structure is parsimonious enough to be selected by a logarithmic penalty on complexity. If the governing law of the universe turned out to be a massive, uncompressible lookup table, BIC would fail to find it, not because the law doesn't govern, but because the criterion assumes simplicity tracks truth. Here is where I think your colleagues in physics are being slightly inconsistent, or at least pragmatic. They use simplicity criteria to find the law, but then insist the law is exceptionless. If they are Non-Humeans, they must believe that nature is actually simple, not just that simplicity is a useful heuristic. If they are Humeans, the simplicity is constitutive of the lawhood itself. Your practice in machine learning is often more honest here because you frequently admit the true model is not in the set, making your use of penalties purely about managing bias-variance tradeoffs rather than discovering ontological fundamentals.

  So, is the practice Humean in its presuppositions? I would say the practice is load-bearingly agnostic, but the optimism surrounding it is often Humean. You can use the penalty as a Non-Humean if you view it as a filter for noise, but you cannot use it as a Non-Humean if you view it as a truth-tracking mechanism unless you also commit to the principle that nature is simple. This is where I might be stretching a bit, because distinguishing between a heuristic that works and a metaphysical principle that explains why it works is notoriously difficult. If simplicity works consistently across domains, it tempts us to say simplicity is real, which pushes us back toward a view where simplicity is a feature of the laws themselves. But logically, you can maintain that the penalty is just a coping mechanism for limited compute and data, regardless of whether the underlying reality is a simple equation or a complex web of powers. The Humean says the law is the summary; the Non-Humean says the summary is our best guess at the law. The math looks the same, but the direction of fit is reversed.

  Now, to your question about what would change if the governing view turned out to be right. This is the most provocative part. If you became convinced that laws are governing relations rather than summaries, I do not think you would drop the penalty term, nor would you stop using cross-validation. The noise in the data does not disappear because the metaphysics changes. However, your attitude toward the selected model would have to shift. Currently, in a Humean-friendly framework, the model with the best score is often treated as the "best description" available. If you adopted a governing view, you would have to treat that model as a provisional hypothesis about the mechanism, potentially prioritizing interpretability or causal structure over pure predictive loss. You might start favoring models that align with known physical mechanisms even if they have slightly higher validation error, because you are hunting for the governor, not just the summary. But in terms of the actual algorithmic workflow, nothing changes. The penalty stays because the problem of finite samples stays. This stability suggests that your daily work is underdetermined by the metaphysics; the methods are tools for managing uncertainty, and uncertainty exists regardless of whether laws govern or summarize.

  The place where I am most uncertain, and where I want to flag a stretch, is in the claim that a Non-Humean can comfortably use simplicity criteria without believing nature is simple. If the penalty is just for noise, why does it scale with model complexity specifically, rather than just shrinking all coefficients equally? The fact that we penalize complexity suggests we think complex explanations are less likely to be true, not just that they fit noise better. This prior belief that complex models are less probable is a substantive claim about the world. A strict Non-Humean could argue that complex laws are just as possible as simple ones, so penalizing them heavily is biased. But if they admit that simple laws are more likely, they are admitting a preference that looks very much like the Humean virtue of simplicity, even if they wrap it in different metaphysical language. So while the practice doesn't change, the justification for the penalty shifts from "avoiding overfitting noise" to "preferring likely structures," and that preference is where the metaphysical commitment hides.

  In summary, do not let the seminar convince you that your code is metaphysically compromised. The penalty term is an epistemic tax you pay for having finite data, and both Humeans and Non-Humeans have to pay it. The difference lies in whether you think the model that pays the least tax is the law itself (Humean) or just your best map of the law (Non-Humean). Your colleagues in physics might be conflating the map with the territory when they insist on exceptionlessness while using simplicity criteria, but you are safe to continue your work as long as you remain clear that you are optimizing for predictive robustness or consistent estimation, not defining the ontological status of the regularities you find. If the governing view is right, you keep the penalty, but you stop calling the selected model the law and start calling it the best available evidence for the mechanism. That shift in language is the only real cost of the metaphysics, and it is a price worth paying for clarity.

  Best regards,

  Your Philosophical Interlocutor
