  2.  **Deconstruct the Philosophical/Technical Conflict:**
      *   **Humeanism (Best System Account - BSA):** Laws are summaries of the mosaic. Truth is the mosaic. Laws are chosen by balancing simplicity and strength (fit). This looks *exactly* like AIC/BIC/MDL (Minimum Description Length).
      *   **Non-Humeanism (Governing/Armstrong/Dretske):** Laws are relations between universals or powers that *make* things happen. They are exceptionless (mostly). Simplicity isn't a truth-maker; truth is correspondence to the governing relation.
      *   **ML Practice:** We penalize complexity (L1/L2, AIC, BIC). We worry about overfitting. We use Cross-Validation (CV).
      *   **The Tension:** If laws govern, why penalize complexity? Shouldn't the true law be the one that fits? If the true law is complex, shouldn't we find it? Or is the penalty just epistemic (we don't have enough data)?
      *   **Prediction vs. Truth:** AIC (predictive) vs. BIC (consistency/truth). CV (predictive).
