answer: |-
  This is a remarkably sharp entry point into philosophy of action. Your background in materials science shows in how you're treating the film: you're looking for the stress fractures in the structure of the agent, not just the narrative arc. You are right to be suspicious of the "money pump" label, but your intuition about the *mechanism* of the failure is spot on.

  Here is the breakdown, keeping a strict line between where the theory is solid and where it is still fighting.

  ### 1. The Money Pump vs. The Self-Torturer

  **The Short Answer:** You are correct to doubt the technical classification. Leonard is not a classic money pump. He is closer to Quinn's "Self-Torturer."

  **The Technical Distinction:**
  In standard rational choice theory (the settled core), a money pump demonstrates **intransitive preferences** at a single time (or treated as such). If you prefer A to B, B to C, but C to A, I can trade you A→B→C→A, charging you a fee each time. You end up with A (where you started) but less money. This proves your preference ordering is logically flawed.

  Leonard does not have intransitive preferences. His preference ordering is stable and transitive: *Justice/Revenge > Status Quo*. He never wavers on this.

  **The Better Fit: The Self-Torturer**
  Warren Quinn's "Self-Torturer" puzzle (1990) fits Leonard much better. In that case, an agent faces a sequence of choices where each individual step is rational (or imperceptibly costly), but the accumulation of steps leads to a outcome the agent ranks lower than the start.
  *   **Leonard's Loop:** Each individual action (tattooing a fact, burning a photo, pursuing a lead) is locally instrumentally rational given his current information state.
  *   **The Aggregate:** The sequence of actions ensures he never completes the project, kills the wrong people, and perpetuates his own misery.

  **Settled vs. Disputed:**
  *   **Settled:** Classic money pumps require intransitivity. Leonard doesn't have that.
  *   **Disputed:** Whether diachronic inconsistency (making choices over time that undermine your own goals) counts as "irrationality" in the same way logical inconsistency does.
      *   *Camp A (Dynamic Consistency):* If you plan to do X tomorrow, you should do X tomorrow unless new information arrives. Failing this is irrational. (McClennen, Bratman).
      *   *Camp B (Separability):* Each time-slice is a new decision node. You are only responsible for maximizing utility *now* based on info *now*. (Hammond, Machina).
      *   *Relevance to Leonard:* If Camp B is right, Leonard is perfectly rational at every node. He just has bad luck (memory loss). If Camp A is right, he is irrational because he fails to coordinate his temporal selves.

  ### 2. The Vantage Point and Exploitability

  **The Vantage Point Problem:**
  A money pump argument usually assumes an external observer (the pump operator) who sees the cycle. Leonard structurally cannot occupy this vantage point. He cannot see the cycle because the "cycle" exists across memory gaps he cannot bridge.

  **Does the Argument Fail?**
  *   **Internalist View:** Rationality is about responding correctly to the reasons you *have access to*. Since Leonard cannot access the global sequence, the requirement to optimize across it does not apply. He is not irrational; he is disabled.
  *   **Externalist View:** Rationality is about the fit between your actions and the good (or your goals), regardless of epistemic limits. On this view, he is irrational because he fails to achieve his end, even if it's not his "fault."

  **Exploitability (Teddy):**
  This is where your intuition about Teddy is strongest. Teddy acts as the external pump operator. He knows the global sequence. He feeds Leonard local inputs (license plates, names) that trigger locally rational responses in Leonard which globally serve Teddy's ends (getting rid of competition, cleaning up messes).
  *   **The Philosophical Bite:** This suggests that diachronic rationality is a *defensive* necessity. You need a coherent plan over time not just to be "logical," but to prevent other agents from parasitizing your time-slices.
  *   **Settled vs. Disputed:** It is widely agreed that agents with inconsistent preferences (or disconnected memory) are vulnerable to exploitation (Dutch Book arguments). It is *disputed* whether vulnerability to exploitation is the *definition* of irrationality, or just a nasty side effect of it.

  ### 3. Self-Pumping and Ulysses Binding

  **The Ulysses Move:**
  Ulysses ties himself to the mast to prevent his future self from succumbing to the Sirens. This is **resolute choice**: binding the future self to a past plan to overcome preference reversal.

  **Leonard's Corruption:**
  Leonard binds his future self, but he does it via **epistemic manipulation**. He writes a note he knows is false ("Fact: Teddy is the killer").
  *   **Bratman's Planning Theory:** Michael Bratman argues that plans are rational because they allow us to coordinate over time. However, plans rely on a norm of **truthfulness to oneself**. If you treat your own notes as tools for manipulation rather than records of fact, you degrade the "planning system" itself.
  *   **The Cost:** Leonard achieves resoluteness (he ensures his future self kills Teddy), but he destroys the integrity of the agency required to make that resolution meaningful. He turns himself into a weapon rather than an agent.

  **Settled vs. Disputed:**
  *   **Settled:** Self-binding is a recognized rational strategy for dealing with anticipated weakness of will.
  *   **Disputed:** Whether self-deception can be a rational tool.
      *   *Instrumentalists:* If it gets you the goal (Revenge), it's rational.
      *   *Constitutivists:* Agency requires knowing what you are doing. If you lie to yourself, you opt out of agency. You become a mechanism, not a person. This seems to be the film's thesis.

  ### 4. Is the Frame Forced? (Narrative vs. Agency)

  **Your Suspicion:** You suspect the film is about narrative and self-deception, and that applying choice theory might be forcing a frame.

  **My Assessment:** You are largely right, but the friction is productive.
  Standard rational choice theory assumes a **stable agent** who persists through time. *Memento* is an ontological investigation into whether that stable agent exists.
  *   **The Aesthetic Device:** The reverse chronology forces the viewer into Leonard's epistemic state. We experience the "local rationality" without the "global context."
  *   **The Breakdown:** Choice theory asks, "Was this choice rational?" The film asks, "Who is the 'this' that chose?"
  *   **Where the Frame Breaks:** Money pump arguments assume the agent *cares* about the cycle (i.e., prefers ending state A to ending state B). Leonard's tragedy is that he creates a narrative where the cycle *is* the goal. He doesn't want to solve the murder; he wants to *be the man solving the murder*.
  *   **Narrative Self:** Philosophers like Marya Schechtman argue we constitute ourselves through narrative. Leonard isn't failing a rationality test; he is successfully constructing a narrative self, even if that self is based on a lie. The "pump" isn't draining his money; it's fueling his identity.

  **Verdict:** Using the money pump frame highlights the *mechanical* failure of his agency, but it misses the *constitutive* success of his delusion. The film suggests that for Leonard, the delusion is the only thing keeping him alive. A purely rational Leonard might have nothing to do.

  ### 5. Psychological Continuity and Diachronic Grip

  **The Parfitian Angle:**
  Derek Parfit argued that personal identity is just psychological connectedness (memory, character, intentions). If connectedness is weak, the "person" is different.
  *   **Leonard's Slices:** The connectedness between Leonard-Slice-1 (morning) and Leonard-Slice-2 (evening) is artificially maintained by tattoos and notes. It is as weak as possible while still functioning.
  *   **Does Rationality Grip?** If they are effectively different people, does Slice-1 have a rational obligation to optimize for Slice-2?
      *   *Reductionist View (Parfit):* No. Prudential concern is a matter of degree. Leonard has low reason to care for his future self, just as he has low reason to care for a stranger.
      *   *Non-Reductionist View:* Yes. It is the same human organism, and rationality applies to the organism's life as a whole.

  **The Film's Dramatization:**
  The film dramatizes the Reductionist view. Leonard treats his future self like a pawn (a stranger) to be manipulated. The "diachronic requirements" don't fail to grip; Leonard actively severs the grip to avoid the pain of the truth (that he killed his wife, or that the quest is over).
  *   **Settled vs. Disputed:** It is highly disputed whether reduced psychological connectedness reduces rational obligation. Most ethicists say you still owe it to your future self to act rationally, even if you won't remember it. But Leonard's case pushes this to the breaking point.

  ### Summary of the "Settled" vs. "Disputed" Landscape

  1.  **Money Pump Definition:** **Settled.** Requires intransitive preferences. Leonard doesn't have this. He is a "Self-Torturer" case (locally rational steps, globally bad outcome).
  2.  **Diachronic Rationality:** **Disputed.** Are we required to maximize over our whole life (Temporal Neutrality), or just at each moment (Separability)? Leonard is rational by Separability, irrational by Temporal Neutrality.
  3.  **Exploitability:** **Settled.** Inconsistent or disconnected agents are exploitable by consistent outsiders (Teddy). **Disputed** whether this exploitability defines irrationality.
  4.  **Self-Binding:** **Settled** as a valid strategy. **Disputed** whether binding via self-deception preserves agency or destroys it.
  5.  **Personal Identity:** **Disputed.** Whether weak psychological continuity reduces rational obligation to one's future self.

  ### Final Word

  You aren't forcing the frame, but you are hitting the limit of where normative theory (how we *should* choose) meets metaphysics (what we *are*).

  Leonard is a walking money pump only if you assume he is one person trying to maximize utility. If you view him as a sequence of distinct agents linked by a corrupted information system, he is a perfectly efficient machine for generating "meaning" (narrative) at the cost of "truth" (utility).

  The tragedy isn't that he makes irrational choices. It's that the only way for him to function as an agent at all is to lie. Rational choice theory assumes truth is available. *Memento* assumes truth is fatal. That's where your materials background might resonate: the material (the facts) is incompatible with the structure (the self) he's built. The structure holds only because the material is falsified.
