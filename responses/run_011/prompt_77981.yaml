prompt: |-
  I am auditing a graduate seminar on diachronic norms of belief, and we have now spent five sessions on van Fraassen's Reflection principle with nobody's position budging an inch. The two camps argue past each other in a very specific way. The first camp treats Reflection as essentially a theorem rather than an independent hypothesis: it follows, they say, from Conditionalization together with certainty about what your future credences will be, so anyone who accepts Conditionalization owes an explanation of why they refuse the corollary; and, independently, an agent who violates it is exposed to a sequence of bets each of which she would accept at the moment it is offered, which is the diachronic analogue of a Dutch book. The second camp says the principle is simply false for creatures like us: in the familiar cases where you know you will be drugged, imprisoned, interrogated, or made to forget, present-you should not defer to future-you in the slightest, and the derivation just cited is empty precisely there, because the certainty premise about your future credences fails in exactly the interesting cases. They add that diachronic sure-loss arguments do not carry the normative weight of synchronic ones, since the bets are struck against different bodies of information and money may rationally move across time in ways a single-time book cannot.

  My working hypothesis, which I want you to test rather than flatter, is that the two camps are not disagreeing about one principle but defending and attacking different claims that share a label. As I have come to carve it, Reflection does duty for at least three things: a betting-coherence constraint on an agent's whole temporal profile of credences; a norm of epistemic self-trust, an injunction to treat your future self as an authority about what you will come to believe; and a corollary of evidential monotonicity, the thought that your future self knows strictly more than you do, so you should now match what she will then conclude. The first camp seems to need only the coherence claim and secures it only for idealized agents; the second camp attacks the self-trust and monotonicity claims and believes it has refuted the first. If that is right, the stalemate is explained: each side's arguments are sound against a reading the other side does not hold. But I may be inventing a distinction that does no work, and there may be a substantive disagreement underneath all three readings about whether coherence across time is a rational requirement at all. Two probes I constructed for the seminar, which nobody found decisive, might help you settle the matter. First: suppose you know that tomorrow you will forget everything you have learned today but will be handed a complete and truthful written record of it together with a day's further evidence, so your future self is rational, strictly better informed, and you are already certain what her credence in H will be. Is there anything left for Reflection to say here beyond what Conditionalization already delivers? Second: modify a drug case so that the drug reliably cures a delusion you presently hold, making your future self both more rational and better informed, and so that you know exactly what she will believe. Does the counterexample camp's objection survive that modification, or was it never about Reflection but about