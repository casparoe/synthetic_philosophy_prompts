answer: |-
  **Project Title:** The Constitutive Limits of Goodhart's Law: Measurement, Practice, and Optimization Pressure

  **1. Research Question**
  The primary research question is: Under what conditions does optimization pressure alter the constitutive practices that fix a goal's extension, rendering proxy improvements ineffective? This question admits a determinate answer in the form of a principled criterion separating cases where measurement fidelity can resolve failure from cases where the goal definition itself must change. Two subordinate questions support this inquiry. First, how does this constitutive failure mode differ structurally from causal and adversarial Goodhart effects within the standard taxonomy? Second, can this distinction be formalized within existing objective-function frameworks, or does it require an amendment to how goals are represented? The primary question drives the theoretical contribution, while the subordinate questions ensure the distinction is robust against existing literature and computationally statable.

  **2. Existing Positions and Limitations**
  Three dominant frameworks currently analyze measurement failure, each leaving the primary question open. The mechanism taxonomy, prevalent in alignment literature, classifies Goodhart effects into regressional, extremal, causal, and adversarial types. This framework excels at diagnosing *how* a proxy decouples from a target once optimization begins. It explains why a proxy might overshoot or why an agent might exploit a loophole. However, it runs out when the target itself is not antecedently determinate. It assumes a fixed function from states to value, treating the goal as static while the proxy degrades. It cannot explain cases where the optimization changes the social or practical context that defines what the goal *is*.

  The incentive-design treatment, favored by economists, focuses on multi-tasking and effort allocation. It explains how agents shift effort from unmeasured to measured tasks. This is powerful for predicting behavioral shifts in principal-agent relationships. Yet, it typically assumes the principal's desired outcome is known and stable. It struggles when the measurement regime itself reorganizes the practice such that the principal's original intent becomes incoherent or shifts extension. It treats the goal as a preference ordering rather than a practice-constituted concept.

  Finally, the reward-hacking treatment in machine learning focuses on specification errors where the reward function fails to capture human intent. This explains failures where the code does not match the wish. However, it presupposes that there is a "true" reward function accessible in principle, even if misspecified. It runs out when the "true" reward is emergent from the measurement practice itself. In these cases, there is no hidden true function to recover; there is only a practice that changes under pressure. None of these positions adequately distinguish between failures repairable by better measurement and failures requiring a change in what is being asked for.

  **3. Methodology**
  Over four months, I will employ a mixed method of conceptual analysis, case reconstruction, and light formal modeling. This approach is necessary because a purely formal treatment would beg the question by assuming fixed goals, while a purely empirical treatment would lack the principled criterion required for generalization.

  *Phase 1 (Month 1): Conceptual Analysis and Framework Reconstruction.* I will reconstruct the standard taxonomy and incentive models to isolate their assumption of goal fixity. I will develop a preliminary definition of "constitutive practice" drawing on social ontology and measurement theory.
  *Output:* A conceptual framework document distinguishing proxy fidelity from constitutive stability.

  *Phase 2 (Month 2): Case Study Reconstruction.* I will apply this framework to selected cases (detailed below). I will map the causal pathways in each to determine if the failure arises from correlation breakdown or practice reorganization.
  *Output:* Three detailed case files analyzing the mechanism of failure in each instance.

  *Phase 3 (Month 3): Formal Modeling and Testing.* I will attempt to state the constitutive distinction within a standard objective-function framework. If the distinction cannot be stated without adding variables representing "practice states" or "definition conditions," this confirms the need for an amendment.
  *Output:* A toy model or logical proof demonstrating the statability (or non-statability) of the distinction.

  *Phase 4 (Month 4): Synthesis and Objection Handling.* I will draft the final paper, focusing on the objection that constitutive cases are merely causal Goodhart effects under a new name. I will refine the criterion for repairability based on the previous phases.
  *Output:* A complete draft paper ready for submission.

  **4. Case Studies**
  The project will be built around three cases of common knowledge to ensure accessibility and avoid archival dependency.

  *Case 1: Hospital Mortality Rates.* Hospitals are incentivized to lower reported mortality rates. In repairable cases, better data cleaning improves accuracy. In constitutive cases, hospitals change coding practices to classify dying patients as "palliative care" transfers, removing them from the mortality denominator. This demonstrates a shift in the extension of "mortality" defined by the reporting practice.
  *Intended Demonstration:* Shows how incentive pressure changes the coding practice that defines the metric.
  *Failure Risk:* If this is successfully modeled as simple data corruption (causal Goodhart) without reference to practice change, the distinction collapses.

  *Case 2: Academic Journal Impact Factors.* Journals optimize for citations. Some do so by publishing more review articles (repairable via better normalization). Others change editorial policies to favor controversial topics that garner citations but shift the journal's intellectual identity.
  *Intended Demonstration:* Shows optimization changing the kind of knowledge produced, altering the extension of "impact."
  *Failure Risk:* If "impact" is treated as a fixed scalar value regardless of content, the constitutive shift is invisible.

  *Case 3: Code Review Metrics.* Engineering teams measure productivity by pull requests (PRs) merged. Developers may split single changes into multiple PRs to game the metric.
  *Intended Demonstration:* Distinguishes between gaming the count (adversarial) and changing the practice of what constitutes a "reviewable unit" (constitutive).
  *Failure Risk:* If the goal is defined simply as "number of merges," there is no constitutive shift, only specification error. The case must be framed around the intent of "code quality."

  **5. Success and Failure Conditions**
  Success looks like a draft paper articulating a principled criterion that separates repairable proxy failures from constitutive practice failures. The criterion must withstand the objection that constitutive cases are merely causal effects. A successful result will show that improving measurement fidelity works in one class but is category-error in the other.

  Failure conditions are candidly acknowledged. First, the project fails if the constitutive/repairable distinction turns out to be merely verbal, offering no predictive power over the standard taxonomy. Second, the project fails if the constitutive cases collapse back into the causal category once the causal graph is expanded to include social practices. Third, failure occurs if the formal modeling shows the distinction requires such complex augmentation that it loses utility for ML researchers.

  **6. Scope Risk Assessment**
  The primary scope risk is ballooning into a general theory of measurement or social ontology, which is impossible in four months. To mitigate this, I will restrict the ontological claims to what is necessary for the Goodhart distinction. I will not attempt a full history of measurement theory. If time proves too short, I will cut the formal modeling phase (Phase 3) and rely on rigorous conceptual analysis, as the philosophical distinction is the core deliverable. The minimal defensible deliverable is a philosophical argument supported by two case studies, even without the formal model, provided the criterion for repairability is clear.

