prompt: |-
  I am a third-year doctoral student in philosophy, and I am applying for a four-month residential fellowship at an institute that pairs philosophers with machine-learning researchers. The application requires a project proposal of roughly 1,500 words, and I would like you to draft it from the half-formed idea below.

  The idea concerns Goodhart's law and its cognates in the specification-gaming and reward-hacking literature. My worry is that the field's dominant analytic tool — the four-way taxonomy of Goodhart effects into regressional, extremal, causal, and adversarial kinds — buys its clarity from a silent assumption. In that framework one posits a system with a set of states, a true goal understood as a fixed function from states to value, and a proxy measure that imperfectly tracks it; the four categories then classify the mechanisms by which the statistical relationship between proxy and goal collapses under optimization pressure. But the goal is taken as antecedently determinate, and the proxy's job is merely to estimate it. I think a large and undertheorized class of failures does not fit that picture at all, because in those cases what changes under optimization is not the correlation between measure and target but the conditions that fixed the target's extension in the first place. When a hospital mortality figure, a journal impact measure, a wait-time standard, or a code-review score is used only descriptively, a surrounding practice of measurement, coding, reporting, and peer correction determines what the term picks out; once the figure becomes an incentive-bearing target, that practice is itself reorganized by the incentives, and the term survives with a different extension. On this reading Goodhart's law is not a claim about instruments degrading but about a measurement losing the practice that made it a measurement of that thing. I want to develop this as a third reading alongside the incentive-design reading favoured by economists and the proxy-fidelity reading favoured by the alignment literature, and to argue it explains a puzzle the other two do not: why some Goodhart failures are in principle repairable by better measurement — more data, better proxies, regularization, hold-out monitoring — while others cannot be repaired by any improvement in measurement fidelity, only by changing what is being asked for. I want a principled criterion separating the repairable from the constitutive cases, and I want the proposal to confront the obvious objection that the constitutive cases are just causal or adversarial Goodhart under a new name.

  Please write the proposal so that it contains the following, in this order or another that reads better:

  1. A precise statement of the research question, phrased so that it has a determinate answer rather than being an invitation to ruminate. If the question needs to be split into a primary question and two or three subordinate ones, say so and say how they relate.

  2. An account of why the existing positions leave the question open. Take up at least the mechanism taxonomy, the incentive-design treatment, and the reward-hacking treatment, and for each say what it does explain well and precisely where it runs out. Do not strawman them; the proposal should be one that a sympathetic reader of that literature would find worth funding rather than dismissible as a category confusion.

  3. A defence of the method. I want to know what I would actually do over four months, broken into phases with rough durations and a stated output per phase — conceptual analysis, reconstruction of cases, construction of counterexamples, and, if you think it belongs, a small amount of formal modelling to test whether the distinction is statable in the existing formal framework or requires an amendment to it. Explain why this method rather than the obvious alternatives (a purely formal treatment, a purely case-study-driven empirical treatment, or a history-of-the-idea treatment).

  4. Two or three case studies the project would be built around, with a justification of each choice and an explicit statement of what each is supposed to demonstrate and what could make it fail to demonstrate that. Pick cases whose content is common knowledge so that the proposal does not depend on my having done archival work.

  5. Success and failure conditions. Say what a result would look like if the project succeeded, and be genuinely candid about what would show the project had failed — including the possibility that the constitutive/repairable distinction turns out to be merely verbal, or that it collapses back into the causal category once stated carefully.

  6. A short, honest assessment of scope risk: where the project threatens to balloon into a general theory of measurement, what I would cut if the four months proved too short, and what the minimal defensible deliverable would be.

  Do not include a bibliography, a reference list, or inline citations; I will supply those myself. Referring to positions, arguments, and literatures by description is fine and indeed preferable.

  After the prose proposal, append a single valid JSON object summarizing it, using exactly these fields and no others: `research_question` (string, one sentence), `key_distinction` (string, the constitutive/repairable contrast stated compactly), `positions_considered` (array of objects with keys `position`, `what_it_explains`, `where_it_runs_out`), `method_phases` (array of objects with keys `phase`, `duration`, `activities`, `output`), `case_studies` (array of objects with keys `case`, `intended_demonstration`, `failure_risk`), `success_criteria` (array of strings), `failure_conditions` (array of strings), `scope_risks` (array of strings), `minimal_deliverable` (string), and `novel_contribution` (string, one or two sentences). Output the JSON in a fenced code block and keep it strictly consistent with the proposal above it.
