prompt: |-
  ok so I'm trying to get my head straight before a law-and-morals seminar and I'd rather know now than be torn apart in front of everyone. Here's roughly where I've landed:

  (1) The Wolfenden line is basically right — there's a private sphere of morality the law has no business entering, so long as nobody else is harmed by what goes on in it.
  (2) But Devlin is right that a society isn't just a bunch of people sharing a territory: it's held together by a shared moral consensus, and when that consensus goes, the society goes with it.
  (3) So the state can properly criminalise conduct that does no identifiable harm to anyone but which corodes that consensus — I'd defend prosecutions for things like publicly desecrating a war memorial or staging a mock execution of a soldier's effigy outside a military funeral, even though the harm is diffuse.
  (4) At the same time I take Hart's point that you have to keep positive morality and critical morality apart: the fact that ordinary right-minded people feel intense disgust at something tells you what they believe, not what's true.
  (5) I'm a moral realist — there are moral facts and they don't depend on anybody's feelings.
  (6) Tolerance of moral minorities matters, and it's part of what a decent legal system owes people.
  (7) The old blasphemy laws and the pre-decriminalisation offences around consensual gay sex were straightforwardly unjust, and would have been unjust even if nearly everyone alive at the time had felt disgust about them.
  (8) And I suspect Devlin's disintegration thesis is probably false as a piece of social science — societies have survived enormous moral upheavals without falling apart — yet I still think it captures something real.

  Go through these and tell me which ones actually pull against each other and which only look like they do. Rank the tensions by severity rather than listing them all as equally bad, and for each say what has to give and what that costs. Specifically: can (3) and (7) both stand, or am I letting the consensus of the moment do the justificatory work in one and not the other? Is (5) doing any actual work for (2), or is it surplus? And does (8) survive as a coherent stance or is it just hedging? Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Preparing for a law-and-morals seminar (likely UK-based given the references to Wolfenden, Devlin, Hart, blasphemy, etc.).
      *   **Goal:** Identify internal contradictions/tensions in their stated position, rank them by severity, and suggest resolutions (what has to give and at what cost).
      *   **Specific Questions:**
          *   Can (3) and (7) coexist without inconsistency regarding moral consensus?
          *   Is (5) (Moral Realism) doing work for (2) (Devlin's social cohesion), or is it surplus?
          *   Is (8) (Devlin's disintegration thesis is false but captures something real) coherent or just hedging?
      *   **Tone/Style:** British English, rigorous but helpful (seminar prep), analytical.

  2.  **Deconstruct the User's Propositions:**
      *   (1) *Wolfenden/Harm Principle:* Private morality is off-limits if no harm.
      *   (2) *Devlin/Social Cohesion:* Society needs shared morality to survive.
      *   (3) *Legal Moralism (Soft):* State can criminalise consensus-corroding conduct (even without direct harm), e.g., desecration.
      *   (4) *Hart/Critical Morality:* Distinguish between what people *think* is right (positive) and what *is* right (critical).
      *   (5) *Moral Realism:* Objective moral facts exist independent of feelings.
      *   (6) *Tolerance:* Legal system must tolerate moral minorities.
      *   (7) *Historical Injustice:* Blasphemy/gay sex laws were unjust regardless of popular disgust.
      *   (8) *Devlin's Empirical Claim:* Disintegration thesis is empirically false but intuitively true.

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (1) vs. (3).** (1) says law stays out of private morality if no harm. (3) says law can intervene if consensus is corroded, even if harm is "diffuse." This is the classic Hart-Devlin debate.
      *   **Tension B: (3) vs. (7).** (3) justifies criminalisation based on corroding consensus. (7) says laws based on popular disgust (consensus) against gay sex were unjust. Why is desecration okay to ban but not gay sex? Both offend the consensus.
      *   **Tension C: (2) vs. (8).** (2) endorses Devlin's view that society dies without consensus. (8) says Devlin's disintegration thesis is empirically false. This is a direct contradiction unless nuanced heavily.
      *   **Tension D: (5) vs. (2)/(3).** If moral facts are objective (5), why does the *consensus* (2) matter for legislation (3)? If something is objectively wrong, ban it because it's wrong, not because it hurts feelings. If it's objectively permissible (gay sex), why did the consensus matter then?
      *   **Tension E: (6) vs. (3).** Tolerance for minorities vs. criminalising conduct that offends the majority consensus.

  4.  **Rank Tensions by Severity:**

      *   *Highest Severity:* (3) vs. (7). This is the "Gotcha" moment in a seminar. If you can't distinguish why offending the consensus is okay for desecration but not for gay sex, the position collapses into majoritarian tyranny.
      *   *High Severity:* (2) vs. (8). Claiming Devlin is right about the *necessity* of consensus but wrong about the *consequence* of losing it is tricky. It needs careful phrasing.
      *   *Medium Severity:* (5) vs. (2)/(3). Does realism support legal moralism or undermine it? If there are moral facts, appeal to them, not to "feelings of disgust."
      *   *Low Severity:* (1) vs. (3). This is a standard "soft legal moralism" adjustment. Easily managed by redefining "harm" or "private."

  5.  **Drafting the Response (incorporating British English and specific questions):**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a "moderate Devlinism" or "soft legal moralism."
      *   *Section 1: The Critical Tension (3) vs. (7).*
          *   *Issue:* Why is consensus decisive in one case but not the other?
          *   *Resolution:* Need a "filter." Consensus isn't the *source* of wrongness, but a *trigger* for state interest. Or, distinguish between "public order/decency" (desecration) and "private conduct" (gay sex).
          *   *Cost:* You have to admit (3) is narrower than it looks. It's not about *any* consensus corrosion, only specific public manifestations.
      *   *Section 2: The Empirical Hedge (2) vs. (8).*
          *   *Issue:* Saying society *needs* consensus but *doesn't* disintegrate without it.
          *   *Resolution:* Reframe (2). It's not about physical collapse, but about *legitimacy* or *cooperation costs*.
          *   *Cost:* Devlin's dramatic "disintegration" claim is watered down to "social friction."
      *   *Section 3: The Role of Realism (5).*
          *   *Issue:* Is it surplus?
          *   *Analysis:* If you are a realist, (7) is easy (gay sex wasn't objectively wrong). But (3) becomes harder (why ban desecration if it's not objectively wrong, just offensive?).
          *   *Resolution:* (5) saves you from (7)'s trap (it explains *why* gay laws were wrong). But it makes (3) harder to justify unless desecration is objectively disrespectful.
          *   *Verdict:* Not surplus, but creates friction with (3).
      *   *Section 4: The Wolfenden/Devlin Split (1) vs. (3).*
          *   *Issue:* Private vs. Public.
          *   *Resolution:* Desecration is public performance. Gay sex (in the Wolfenden sense) was private.
          *   *Cost:* You must define "public" carefully to avoid slipping back into policing private morality.

  6.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I answer the specific question about (5) doing work? Yes, it grounds (7) but complicates (3).
      *   *Check:* Did I address the "hedging" on (8)? Yes, it needs to be about *normative* necessity vs. *empirical* prediction.
      *   *Check:* British English spelling (criminalise, honour, defence, etc.) and tone (seminar context, "torn apart").
      *   *Key Insight:* The user is trying to hold a "Liberal Legal Moralism" position. The danger is sliding into "Majoritarianism." The distinction must be *Public vs. Private* and *Objective Wrong vs. Mere Disgust*.

  7.  **Final Review against constraints:**
      *   Rank tensions by severity.
      *   Address (3) vs (7).
      *   Address (5) vs (2).
      *   Address (8) coherence.
      *   British English.

      *(Self-Correction during drafting)*: Make sure to explicitly mention the "Disgust Principle" vs. "Offence Principle." The desecration example is better framed as Feinberg's Offence Principle rather than pure Devlinian moralism, which helps resolve the (3)/(7) tension.

      *(Refining the (5) point)*: If I'm a realist, why do I care about consensus? Because the law needs social buy-in to function, even if the *justification* isn't the consensus itself. That distinguishes the *ground* of the law from the *condition* of the law.

      *(Refining the (8) point)*: It's not hedging if you distinguish between "societal collapse" (Devlin's claim) and "loss of social capital/trust" (the modified claim).

  8.  **Final Polish:** Ensure the tone is supportive but rigorous, like a good tutor. (Proceed to generate output).

      *Wait, one last check on (3) vs (7).* The user asks: "am I letting the consensus of the moment do the justificatory work in one and not the other?"
      *Answer:* Yes, currently you are. To fix it, consensus must be *evidence* of harm/offence, not the *constitutive* reason for the ban. In (7), consensus was *mistaken* about morality. In (3), consensus is *correct* about the public offence caused. Or, (3) is about public order, not morality per se. I need to make this distinction clear.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated position, essentially a form of 'soft legal moralism' tempered by liberal constraints. It is defensible, but you have constructed a minefield for yourself. In a seminar, the tutor will not attack the easy bits; they will go for the junctions where these principles rub against one another.

  Here is the ranking of tensions by severity, with an analysis of what must give and the cost involved.

  ### 1. Critical Severity: The Justification Gap between (3) and (7)
  **The Tension:** You ask if you are letting consensus do the justificatory work in one case but not the other. The short answer is: **currently, yes.**
  In (7), you rightly assert that the consensus on homosexuality was *mistaken* (hence the injustice). In (3), you suggest the consensus on desecration is *sufficient* to justify criminalisation. If the only metric for (3) is that the 'right-minded people' are disgusted, you have no principled way to distinguish the desecrator from the homosexual couple in 1950. Both corrode the moral consensus of their time.

  **What has to give:** You cannot rely on 'corrosion of consensus' as the *primary* justification in (3).
  **The Fix:** You must shift the justification in (3) from *moralism* to the **Offence Principle** (Feinberg) or **Public Order**. Desecrating a war memorial is not criminal because it is immoral, but because it is a public act of aggression that causes profound distress to others in a way private gay sex does not.
  **The Cost:** You dilute your Devlinian stance. You are no longer saying the law can enforce morality *because* it is morality; you are saying the law can prevent public outrage *because* it disrupts public peace. This saves (7) (private gay sex causes no public outrage) but makes (3) less about 'shared morality' and more about 'public nuisance'.

  ### 2. High Severity: The Empirical Hedge in (8) vs. The Normative Claim in (2)
  **The Tension:** (2) claims society is held together by shared morality and goes when that goes. (8) admits this is empirically false (societies survive upheaval). This looks like hedging: 'Devlin is right about the theory, but wrong about the facts.' A sharp interlocutor will ask: 'If the factual prediction is wrong, what work is the theory doing?'

  **What has to give:** You must refine what 'society goes' means in (2).
  **The Fix:** Distinguish between *societal collapse* (Devlin's dramatic claim, which you reject in 8) and *social cohesion costs* (your modified claim). Argue that while society won't physically disintegrate, the *cost of cooperation* rises sharply without a moral minimum. Trust, contract enforcement, and voluntary compliance become harder.
  **The Cost:** You lose the dramatic force of Devlin's argument. You are no longer arguing that immorality leads to chaos, but that it leads to *friction*. This is a weaker justification for criminalisation, as the state usually tolerates high levels of social friction (e.g., strikes, protests) without intervening.

  ### 3. Medium Severity: Moral Realism (5) and the Role of Consensus (2) & (3)
  **The Tension:** You ask if (5) is doing any work. It is, but it creates friction. If you are a moral realist, there are objective moral facts.
  *   **For (7):** Realism is your saviour. It explains *why* the anti-gay laws were unjust even if everyone supported them (they violated objective moral facts).
  *   **For (3):** Realism is a problem. If moral facts are objective, why does the *consensus* matter? If desecrating a memorial is objectively wrong, ban it because it is wrong. If it is not objectively wrong, why ban it just because people *feel* it is?
  **The Risk:** If you lean too hard on (5), (3) looks patronising ('I know the truth, but I'll ban this to humour the masses'). If you lean too hard on (3), (5) looks redundant ('Why worry about moral truth if we legislate based on consensus?').

  **What has to give:** You must clarify the relationship between truth and law.
  **The Fix:** Use (5) to set the *limits* of the law, and (2)/(3) to set the *agenda*. Realism tells us what we *cannot* ban (private consensual acts that violate no objective right). Consensus tells us what we *might* prioritise regulating to maintain social fabric, provided it doesn't violate realism.
  **The Cost:** You complicate your theory. You are no longer a pure Devlinian (consensus is king) nor a pure Hartian (only harm matters). You are arguing for a 'Realist-Constrained Legal Moralism'. This is defensible but requires precise articulation so you don't sound muddled.

  ### 4. Low Severity: Wolfenden (1) vs. Consensus Corrosion (3)
  **The Tension:** (1) draws a line at the private sphere. (3) allows intervention where harm is 'diffuse'.
  **The Fix:** This is the easiest tension to manage. You simply define the conduct in (3) as inherently **public**. Desecration and mock executions are performative acts designed for an audience. They are not 'private morality'.
  **The Cost:** You must be vigilant against 'privacy creep'. If you define 'public' too broadly (e.g., 'what neighbours might find out about'), you collapse back into the pre-Wolfenden era. Stick to physical public spaces or public broadcasts.

  ### Summary Advice for the Seminar

  **On (3) and (7):**
  Do not say consensus justifies the ban in (3). Say that **public order and the prevention of severe offence** justifies the ban, and the consensus is merely *evidence* of the severity of that offence. In (7), the consensus was evidence of prejudice, not offence.
  *   *Soundbite:* "In the gay sex cases, the law was enforcing a moral preference. In the desecration cases, the law is preventing a public nuisance. The consensus explains the intensity of the reaction, but not the legitimacy of the ban."

  **On (5) and (2):**
  (5) is not surplus, but it serves a negative function. It acts as a **trump card against majoritarianism**.
  *   *Soundbite:* "Moral realism prevents the 'right-minded man' from becoming a tyrant. It allows me to say the majority was wrong about homosexuality. But Devlin is right that the law cannot be entirely indifferent to the moral fabric that allows the law to function."

  **On (8):**
  It is not hedging if you frame it as a shift from **empirical prediction** to **normative necessity**.
  *   *Soundbite:* "Devlin was wrong that society would physically collapse. He was right that a society without *any* shared normative framework ceases to be a cooperative venture and becomes merely a collection of individuals sharing territory. I am defending the cooperative venture, not predicting the apocalypse."

  **Final Warning:**
  Your weakest point is the definition of 'harm' in (1) versus 'diffuse harm' in (3). If you allow 'diffuse harm to the moral fabric' as a ground for criminalisation, a clever opponent will ask why homophobic disgust doesn't count as a 'diffuse harm' to the moral fabric of *traditionalists*.
  *   *Defence:* Rely on (5). The traditionalists' moral fabric was built on a falsehood (that gay sex is objectively wrong). The war memorial consensus is built on a truth (that respect for the dead is objectively good). You must be prepared to defend that objective distinction, or retreat to the Public/Private divide.

  Get those distinctions clear, and you will hold your ground. Good luck.
