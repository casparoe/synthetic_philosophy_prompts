      *Semester 2: Decision-Theoretic Modeling.* I will model an agent facing choices within this infinite structure. I will define "local" choices versus "global" states and determine whether the partial ordering derived in Semester 1 assigns values to local improvements.
      *Semester 3: Normative Analysis.* I will interpret the formal results philosophically. If the ordering is partial, I will analyze whether the incomparability constitutes a normative defect or a correct representation of indeterminacy.
      *Semester 4: Synthesis and Writing.* I will integrate the formal and conceptual chapters, ensuring the argument flows from the distinction between temporal and spatial infinity to the decision-theoretic payoff.

      **Possible Results and Failure Conditions**
      The space of possible results includes positive, negative, and technical outcomes. A positive result shows that restricting attention to finite differences dissolves the familiar paralysis whereby no finite improvement matters globally, restoring guidance for local agents. A disappointing but still worth having result would show that while the partial order exists, it is too sparse to resolve standard dilemmas, thereby proving that infinite ethics is inherently more limited than finite ethics. A negative technical result would show that index-invariance forces triviality.

      Explicit failure conditions are necessary for committee assessment. I will abandon the project if: (1) The finite-difference rule fails to produce a transitive relation, making it unusable for rational choice; (2) The partial order is so sparse that it declares no two realistic profiles comparable, rendering the theory vacuous; or (3) It turns out that index-invariance is trivially satisfiable by existing rules, meaning my central distinction adds no new constraints. In any of these cases, the core hypothesis—that index-invariance drives the problem—would be falsified.

      **Scope and Fallback**
      A candid assessment of scope is required. The formal proof work in Semester 1 is the highest-risk component; formal social choice theory on infinite domains can consume five years and produce nothing if the mathematics becomes intractable. The conceptual analysis of the temporal versus spatial distinction is safer and constitutes a defensible philosophical contribution even if the formal system collapses. The cheapest defensible fallback version of the project is to focus exclusively on the conceptual critique: demonstrating that the literature illicitly transfers temporal ordering assumptions to spatial populations, and arguing that this category error explains the persistence of paradoxes. If the index-invariance requirement turns out to be trivially unsatisfiable, I will pivot to arguing that infinite population ethics requires abandoning impartiality rather than forcing invariance. If it is trivially satisfiable, I will argue that the literature has already solved the problem without recognizing it, and my contribution is clarifying that solution. This ensures that even if the strong formal hypothesis fails, the dissertation remains a coherent critique of existing infinite ethics frameworks.

