      **Project Title:** Index-Invariance and the Structure of Infinite Obligation

      **Central Question**
      Does enforcing strict index-invariance in infinite population ethics yield a decision-theoretically useful partial ordering based on finite differences, or does it render all local improvements normatively inert? This question admits three determinate answers: (1) Index-invariance permits a partial order robust enough to guide local agency; (2) Index-invariance permits a partial order too sparse to guide action; or (3) Index-invariance is incompatible with any non-trivial ordering satisfying minimal Pareto conditions. My project aims to determine which obtains.

      **Problem and Critique of Standard Moves**
      The literature on infinite ethics often conflates two distinct ontological settings: an infinite temporal horizon, where moments are pre-ordered by time, and an infinite simultaneous population, where no ordering of individuals is privileged. Devices invented for the first setting are frequently carried into the second without justification. Specifically, overtaking-style rules compare infinite welfare profiles by examining finite initial segments and taking a limit, or by judging one profile better if it is eventually always better than the other. These rules presuppose an enumeration. In the temporal case, the enumeration is handed to us by the arrow of time; for a population spread out in space, any enumeration is an arbitrary choice. Consequently, a rule whose verdict changes when we relist the same individuals is either incomplete or covertly indexical.

      Standard responses to the resulting paradoxes leave my central question open. Extending finite aggregation rules by limiting devices fails because it inherits the enumeration dependence of overtaking criteria. **[Technical Claim 1]**: I must verify that overtaking criteria are strictly enumeration-dependent in the spatial case; if they can be reformulated to be permutation-invariant, the motivation for my project weakens. Dropping anonymity violates impartiality. Weakening the Pareto requirement is too costly for a normative theory. Finally, accepting the non-constructive orderings that anonymity together with Pareto is said to require on infinite domains offers existence proofs without action-guidance. **[Technical Claim 2]**: I must verify the standard impossibility result that anonymity plus Pareto requires non-constructive methods (e.g., ultrafilters) on infinite domains. If constructive orderings satisfying both exist, the need for my finite-difference restriction dissolves. Until these moves are ruled out, the specific tension between index-invariance and comparability remains unaddressed.

