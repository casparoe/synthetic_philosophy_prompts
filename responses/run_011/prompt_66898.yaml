  # Seminar Instrument: The Genome Decision Tree

  **Trunk: Shared Facts**
  We begin from four points of agreement. (1) Translation proceeds by a codon-to-amino-acid mapping which is near-universal but has documented variants. (2) The same sequence is read to different effect in different cell types and environments. (3) Changing a sequence reliably changes downstream products, while changing other things changes them too. (4) A great deal of sequence in most genomes is never read at all.

  **Instructions**
  Answer the following eight questions based on your intuition about the specific cases described. There are no "correct" answers, only consistent paths. Track your choices (A, B, or C) to find your philosophical position at the end.

  **Q1. The RNA Virus Case**
  An RNA virus enters a host cell. Its genome is read by the host's ribosomes, which the virus did not build. The viral RNA directs the synthesis of viral proteins.
  *   **A.** The RNA fits the ribosome like a key in a lock; the physical shape dictates the outcome.
  *   **B.** The RNA functions like a USB drive; it requires a specific operating system (the host) to be read.
  *   **C.** Neither; the virus simply hijacks the chemistry without "directing" it.
  *(If A, go to Leaf 1. If B or C, go to Q2.)*

  **Q2. The Engineered Stop Codon Case**
  Synthetic biologists reassign a stop codon (UAG) to code for a non-natural amino acid. The machinery reads it faithfully for generations.
  *   **A.** This proves the mapping is fixed by physical law; changing it would break physics.
  *   **B.** This proves the mapping is a biological convention; it is reprogrammable like a cipher.
  *(If A, go to Leaf 2. If B, go to Q3.)*

  **Q3. The Liver/Eye Case**
  A specific DNA sequence produces Protein X in liver cells but Protein Y in eye cells due to context-dependent splicing.
  *   **A.** The sequence alone determines the product; the cell type is just background noise.
  *   **B.** The cellular context determines the product; the sequence is only a potential.
  *(If A, go to Leaf 3. If B, go to Q4.)*

  **Q4. The Pseudogene Case**
  A pseudogene exists in the genome with a valid sequence but is never transcribed in any tissue of any individual.
  *   **A.** It carries dormant information; it is a message waiting for a reader.
  *   **B.** It is inert matter; without use, it carries no information.
  *(If A, go to Q5. If B, go to Q6.)*

  **Q5. The Ancestral Reconstruction Case**
  A sequence is computed for an ancestor that never existed, synthesized, and works perfectly when inserted into a modern organism.
  *   **A.** It is "true" or functional because it works; history is irrelevant.
  *   **B.** It is "false" or artificial because it lacks the history of selection; function requires history.
  *(If A, go to Leaf 4. If B, go to Leaf 5.)*

  **Q6. The Synonymous Substitution Case**
  A mutation changes a codon but not the amino acid. However, it changes the protein's folding speed and expression level.
  *   **A.** DNA is the privileged cause; the environment merely executes DNA's orders.
  *   **B.** DNA and environment are equal partners; privileging DNA is an arbitrary human choice.
  *(If B, go to Leaf 6. If A, go to Q7.)*

  **Q7. The Frameshift Case**
  A single-base deletion shifts the reading frame, producing a scrambled, non-functional protein.
  *   **A.** Information is lost; the bit-count has degraded into noise.
  *   **B.** Meaning is corrupted; the message has become a falsehood or error.
  *(If A, go to Leaf 7. If B, go to Q8.)*

  **Q8. The Scope Case**
  Consider splicing codes, signal transduction pathways, and cell adhesion molecules alongside the genetic code.
  *   **A.** These are all genuine codes; the genetic code is just the first of many.
  *   **B.** Only the genetic code is a true code; the rest are merely causal mechanisms.
  *(If A, go to Leaf 8. If B, go to Leaf 9.)*

  ***

  **Leaves: Your Position**

  *   **Leaf 1 (Q1=A): Template View.** (Unnamed). DNA is a mould; replication by complementarity makes it physical instruction without symbolic content.
  *   **Leaf 2 (Q1=B/C, Q2=A): Causal-Specificity View.** Information is nothing over and above fine-grained counterfactual dependence of product on sequence.
  *   **Leaf 3 (Q1=B/C, Q2=B, Q3=A): Strict Code Realism.** The genome carries information in a literal sense, fixed by the sequence regardless of context or use.
  *   **Leaf 4 (Q1=B/C, Q2=B, Q3=B, Q4=A, Q5=A): Code-without-Content View.** The mapping is arbitrary and receiver-relative, but nothing is represented; the technical sense of the genetic code is not the semantic sense of a message.
  *   **Leaf 5 (Q1=B/C, Q2=B, Q3=B, Q4=A, Q5=B): Truth-Requiring View (Dretskean).** DNA genuinely represents; mutations can misrepresent (be false); content is fixed by indication and truth conditions.
  *   **Leaf 6 (Q1=B/C, Q2=B, Q3=B, Q4=B, Q6=B): Developmental-Systems Deflationism.** DNA is one causally privileged input among equals; code talk smuggles in an asymmetry the causal facts do not support.
  *   **Leaf 7 (Q1=B/C, Q2=B, Q3=B, Q4=B, Q6=A, Q7=A): Pure Shannon View.** Bit counts are measurable and meaning-talk is not; information is reduction of uncertainty, not semantics.
  *   **Leaf 8 (Q1=B/C, Q2=B, Q3=B, Q4=B, Q6=A, Q7=B, Q8=A): Code-Biology View.** The genetic code is only the first of many genuine biological codes; the live question is how many codes there are rather than whether there is one.
  *   **Leaf 9 (Q1=B/C, Q2=B, Q3=B, Q4=B, Q6=A, Q7=B, Q8=B): Sender–Receiver/Teleosemantic View.** DNA genuinely represents, mutations can misrepresent, and content is fixed by selection on the reading machinery.

  ***

  **Logical Space Analysis**

  The logical space is defined by the three hidden relations (**Resemblance**, **Convention**, **Use**) and two switches (**Misrepresentation Possible?**, **Causal Parity Accepted?**).

  | View | Resemblance | Convention | Use | Misrep? | Parity? |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **1. Template** | Yes | No | No | No | No |
  | **2. Causal** | No | No | No | No | No |
  | **3. Strict Realism** | No | Yes | No | No | No |
  | **4. Code-without-Content** | No | Yes | Yes | No | No |
  | **5. Dretskean** | No | Yes | Yes | Yes | No |
  | **6. Dev-Systems** | No | Yes | Yes | No | Yes |
  | **7. Pure Shannon** | No | Yes | No | No | No |
  | **8. Code-Biology** | No | Yes | Yes | Yes | No |
  | **9. Teleosemantic** | No | Yes | Yes | Yes | No |

  **Unoccupied Combinations**
  1.  **Resemblance + Convention + Use:** Incoherent. Physical complementarity and arbitrary convention are mutually exclusive mechanisms for the same link.
  2.  **Resemblance + Misrepresentation:** Unattractive. A physical mould cannot "lie," only break; normativity requires distance from physics.
  3.  **Convention + Parity + Misrepresentation:** Unoccupied. If causal parity is accepted (Dev-Systems), normativity usually collapses into causal contribution, making "misrepresentation" incoherent.
  4.  **Use + No Misrep + No Parity:** Unoccupied. If Use is affirmed but Misrep denied, the view usually collapses into Code-without-Content or Causal-Specificity under pressure.
  5.  **Resemblance + Parity:** Simply Unwritten. No one argues DNA is a physical template *and* causally equal to the environment; the template view relies on DNA's unique physical privilege.

  **Inseparable Leaf Pairs**
  1.  **Teleosemantic (9) and Code-Biology (8):** Both affirm Use and Misrepresentation. The tree separates them on the *number* of codes (Q8), but empirically, distinguishing a "code" from a "mechanism" in signal transduction is difficult. A student might consistently hold both views without realizing the distinction.
      *   *Further Case:* A non-genetic biological system (e.g., immune signaling) that exhibits arbitrary mapping and evolutionary selection for error-correction would force a distinction.

  \answer{leaves=9; unoccupied=5; inseparable=1}
