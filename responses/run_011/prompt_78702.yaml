answer: |-
  ### 1. The Mapping: Setting Up the Ledger

  To run this through a corporate accounting framework, we must define the parameters strictly. If the definitions wobble, the analogy collapses.

  **The Reporting Entity**
  For the balance sheet to function, the **UK Government (2019)** must be treated as the legal successor to the **Crown in India (1919)**. In international law, state continuity generally holds; the UK did not cease to exist and reform. Therefore, under the "Going Concern" assumption, the 2019 entity inherits the obligations of the 1919 entity. If you argue they are distinct entities, the balance sheet resets to zero, and the framework offers no insight other than "sovereign immunity." To test your hunch, we must assume continuity: the UK is the same corporation, just rebranded.

  **The Reporting Period**
  The transaction date is **April 1919**. The reporting date is **2019**. The intervening century is a period of non-consolidated accounting where the item remained off-book. In corporate terms, this is a "prior period error" that management has chosen not to restate.

  **Assets, Liabilities, and the Counterfactual**
  *   **Assets:** Infrastructure, institutions, legal systems, stability (the Ferguson credits).
  *   **Liabilities:** Extraction, famine, violence, Jallianwala Bagh (the Tharoor debits).
  *   **The Counterfactual Baseline:** This is not an asset or a liability. It is the **Basis of Valuation**.
      *   Ferguson argues for **Historical Cost**: Value the Raj by what it actually spent and delivered relative to the alternatives available *at the time*.
      *   Tharoor argues for **Fair Value/Impairment**: Value the Raj by what India *should* have been worth absent the manager's (Britain's) negligence or malice.
      *   In accounting terms, the counterfactual is an **Impairment Test**. Tharoor is claiming the asset (India's potential) was impaired by the manager (UK). Ferguson claims the asset appreciated under management. The framework has no line item for "what might have been"; it treats that as a disclosure note, not a booked figure.

  **The Auditor**
  There is no external auditor. The **Electorate/Media** acts as the analyst, but they are segmented. The UK domestic electorate audits the UK consolidated statements; the Global South audits the segmental reporting. Because there is no independent auditor with enforcement power, Management (the UK Government) has total discretion over **Recognition Criteria**.

  **Missing Records**
  The destruction of files ("Operation Legacy") is a **Scope Limitation**. In auditing, if you cannot verify liabilities because records are missing, you cannot book a provision. Management uses this to argue the liability is "unquantifiable," which forces it into the "Contingent Liability" (notes) category rather than "Provision" (face of balance sheet).

  ### 2. The Episode: 1920 vs. 2019

  **Why book in 1920 and not 2019?**
  In 1920, the UK booked a charge, but it was a **Related Party Transaction** written off against the **Manager**, not the **Entity**. Dyer was censured and forced out. In accounting terms, the firm fired the rogue trader to avoid consolidating his losses onto the firm's P&L. It was an attempt to classify the event as "unauthorized activity" rather than "corporate policy." By isolating the liability to Dyer, the Entity protected its own equity.

  In 2019, the Entity cannot fire the Manager (the State itself is the actor). Therefore, the liability must be booked against the Entity.

  **Regret as Note Disclosure**
  Your hunch holds. Under IAS 37 (Provisions, Contingent Liabilities and Contingent Assets):
  *   **Provision:** Recognized when a present obligation exists from a past event, an outflow is probable, and the amount can be estimated reliably.
  *   **Contingent Liability:** Disclosed in notes when the obligation is possible but not probable, *or* the amount cannot be measured reliably.

  Theresa May's "deep regret" is a **Note Disclosure**. It acknowledges the event (past event) and the moral discomfort (obligation exists) but explicitly avoids the recognition criteria. By saying "we cannot estimate the impact" or "we are not legally liable," they keep it off the face of the balance sheet.

  **The Precedent Worry as Unbounded Exposure**
  The fear of "opening the floodgates" is precisely the fear of **Unquantifiable Off-Balance-Sheet Exposure**. If you recognize a provision for Jallianwala Bagh, you establish a precedent for *all* colonial atrocities. The aggregate liability becomes impossible to size. In risk management, you do not book a liability if the potential outflow is infinite or indeterminate. You disclose it and hope the statute of limitations (moral or legal) expires. The "precedent worry" is the admission that the *class* of liabilities is too large to survive on the books.

  **Tharoor's Token Payment**
  Tharoor is attempting to game the **Measurement Criteria**.
  *   If he demands massive reparations, the UK says: "Unquantifiable. No provision."
  *   If he demands £1 (atonement), he satisfies the "Reliable Estimate" criterion.
  *   By asking for a token sum, he is trying to force the item from **Contingent Liability** (Notes) to **Provision** (Face of Balance Sheet).
  *   He is not rejecting the ledger; he is trying to lower the materiality threshold so the transaction *must* be recorded. He wants the audit trail to show a settlement, even if the cash flow is negligible. He wants the *recognition*, not the *liquidity*.

  ### 3. Where the Frame Breaks

  The metaphor is robust until it hits the nature of the State.

  **Dead Creditors and Non-Transferability**
  In corporate accounting, liabilities are owed to creditors who can demand payment or force liquidation. In this case, the creditors (victims) are dead. The "claim" is held by successors who cannot legally enforce the debt. This turns the liability into a **Constructive Obligation** (based on expectation) rather than a **Legal Obligation**. Accounting standards allow you to ignore constructive obligations if they aren't probable. The frame explains *why* the UK ignores it, but it cannot explain *why* the UK feels pressure to address it at all, since legally the debt is statute-barred.

  **The Going Concern Assumption**
  This is the critical disanalogy. A corporation is a finite vehicle; if it hides liabilities, it eventually faces insolvency or fraud charges. A State is a **Perpetual Going Concern**. It can carry "Contingent Liabilities" for centuries without facing liquidation.
  *   *Damage to the Frame:* The accounting frame assumes pressure to clean up the books eventually. The State faces no such pressure. It can maintain a "Regret" note disclosure forever. The frame predicts a resolution (settlement or write-off); history shows indefinite deferral is a viable strategy for a sovereign.

  **The Audit Trail**
  In corporate fraud, missing records imply guilt. In statecraft, missing records (Operation Legacy) are often treated as "lost to time." The accounting frame treats missing data as a failure of internal control; the political frame treats it as a strategic asset. The frame cannot account for the *value* of destroyed information.

  ### 4. The Reverse Test: What the Frame Reveals

  **Does this confirm the frame?**
  It confirms the **Incentive Structure** of the frame, but exposes a hole in the **Valuation Mechanism**.

  **Ferguson's Prediction**
  If Ferguson's "Net Balance" argument were the operative accounting logic, the UK in 2019 should have issued a **Statement of Comprehensive Income** showing Net Positive Equity from the Raj and offered a dividend.
  *   *Prediction:* "We owe you nothing because the Net Asset Value is positive."
  *   *Reality:* "We deeply regret this."
  *   *The Embarrassment:* You do not express regret for a profitable transaction. Regret implies a loss. By expressing regret, the UK admits a liability exists (a loss occurred) but refuses to measure it. This contradicts Ferguson's "Net Positive" thesis. If the net balance were truly positive, there would be no need for regret, only a defense of the net equity. The fact that they offer regret suggests the specific liability (Jallianwala) is toxic, regardless of the net portfolio performance.

  **The Hole: Apology vs. Non-Apology**
  The balance sheet frame cannot distinguish between an **Apology** and a **Non-Apology** unless there is a cash flow attached.
  *   In accounting, a restructuring provision is booked when the plan is announced and binding.
  *   An apology without reparations is a **Non-Cash Transaction**.
  *   The frame is silent on **Reputational Capital**. It treats "Regret" as costless disclosure. It treats "Apology" as a liability recognition. It cannot measure the *value* of the apology itself to the creditor (India).
  *   If the creditor values the apology (reputational repair) more than the cash, the accounting frame fails to capture the utility of the settlement.

  **Provision vs. Disclosure**
  You are correct: this distinction carries all the weight. The debate is not about history (did it happen?); it is about **Recognition Thresholds**.
  *   **Ferguson** argues the asset side outweighs the liability side (Net Equity > 0).
  *   **Tharoor** argues the liability side is impaired and must be recognized (Impairment Charge).
  *   **The UK Government** argues the liability is unquantifiable (Contingent Liability).

  **What the Frame Owes Us**
  The balance-sheet frame strips the moral posturing and reveals the **Risk Management Strategy**.
  1.  It shows that "Regret" is a specific accounting classification designed to minimize liability while acknowledging audit pressure.
  2.  It shows that the refusal to apologize is not about historical denial, but about **Class Action Risk**.
  3.  It reveals that Tharoor's token sum is a technical maneuver to force recognition criteria to be met.

  **Where it is Silent**
  The frame is silent on **Justice**. Accounting is about measurement, not rectification. It can tell you *why* the UK won't pay (unquantifiable exposure), but it cannot tell you *whether* they should. It treats the massacre as a transaction cost, which is analytically useful but morally barren. It explains the *behavior* of the Empire's successors, but it cannot adjudicate the *legitimacy* of their claims. It turns a moral catastrophe into a compliance issue, which is exactly what the UK wants, but exactly what the victims reject.

  **Final Verdict**
  The episode confirms the **Balance-Sheet-of-Empire** as a descriptive model of *state behavior*, but exposes it as a normative failure. The UK acts exactly like a corporation managing a legacy liability: isolate the risk, destroy the audit trail, classify as contingent, and disclose only what is necessary to satisfy the regulator (public opinion). The frame works perfectly to explain the UK's actions. It fails to explain why those actions remain contentious, because the "creditors" are operating on a moral ledger that has no concept of "Contingent Liability." The two sides are not just talking past each other; they are using different accounting standards. One uses IFRS (International Financial Reporting Standards); the other uses Natural Law. The frame explains the impasse, but cannot resolve it.
