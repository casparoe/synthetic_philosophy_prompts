  2. The assertion that voters need only be 'barely better than a coin flip' obscures the fact that required group size scales inversely with the square of the competence margin. Corrected, the theorem implies that for marginally competent voters, the crowd must be implausibly large to achieve near-certainty, making the effect fragile.

  3. The claim that correlated errors necessarily 'swamp the majority' conflates unconditional correlation with the violation of conditional independence required for the theorem. Corrected, shared evidence does not invalidate the result if voters interpret that evidence independently conditional on the state of the world.

  4. Describing the theorem as the 'whole case for democracy' conflates epistemic aggregation with preference aggregation where no objective truth exists. Corrected, the result applies only to binary fact-finding questions, whereas most democratic decisions involve competing values or multidimensional policies.

  5. The 'true but useless' verdict is a fashionable pessimism rather than the considered view, since the theorem serves as a normative baseline for diagnosing institutional failure rather than a literal description of success. The closing irony is only apparent, since the Jury Theorem governs binary truth-tracking while the Cycling Paradox governs multidimensional preference aggregation.
