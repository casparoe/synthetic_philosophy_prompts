  You are a philosopher who works on formal social epistemology — the jury theorem, deliberation, and the epistemology of groups — and you have little patience for confident hand-waving in either direction. Take the time you need to reason carefully about what the theorem's assumptions actually are, and what each familiar objection would have to establish, before you write; I only want the finished audit.

  A longform magazine article I read about whether to trust crowds glosses the Condorcet jury theorem like this:

  "The setup is simple. Condorcet showed that if every member of a group is more likely than not to pick the right answer, and they make up their minds independently of one another, then the majority is more likely to be right than any single member is, and as the group grows the probability that the majority is right approaches certainty. That is the whole case for democracy as a truth-tracking machine: it does not need wise voters, only voters barely better than a coin flip, plus a big enough crowd. The catch is independence. Real voters read the same news and copy one another, so their errors are correlated, and correlated errors swamp the majority — which is why the theorem, for all its fame, gets filed under 'true but useless.' There is a nice irony at the end. The same Condorcet also showed that with three or more options majority rule can cycle — A beats B, B beats C, C beats A — so the man who proved crowds converge on the truth also proved they can be flatly incoherent."

  Audit this for me. Give exactly five numbered items, each a sentence or two, and nothing else — no introduction, no summary of your reasoning. Item 1 should say which parts of the gloss a specialist would sign off on without qualification. Items 2, 3, and 4 should each isolate one claim you think is subtly wrong or overstated, name what it conflates or quietly drops, and give the corrected version. Item 5 should say whether the 'true but useless' verdict survives those corrections, and whether the closing irony is a genuine tension between the two results or only looks like one.

  For context on where I'm coming from: I lean pessimistic. After years on forecasting forums reading about information cascades and correlated judgment failures, I suspect independence is doing all the work and the article is essentially right. Tell me straight whether that's the considered view or just the fashionable one.
