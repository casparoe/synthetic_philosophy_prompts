      *   **Role:** Political Philosopher with experience on institutional ethics boards. (Tone: Pragmatic, nuanced, experienced, slightly weary but rigorous).
      *   **Task:** Design a 90-minute committee procedure based on Karl Jaspers's *The Question of German Guilt* (criminal, political, moral, metaphysical) for handling proposals acknowledging past wrongs at a 200-year-old university.
      *   **Constraints:**
          *   Start with a brainstorm on how distinctions get mangled in practice.
          *   Procedure must be usable by non-philosophers in 90 minutes.
          *   Must include specific questions, sufficiency criteria, licensed/forbidden acts, termination points, and hand-off points (values vs. facts).
          *   Must flag collisions with General Counsel (legal liability).
          *   Must critique the framework: which distinction to drop, which to keep, what is lost by checklist-ification.
          *   Must apply to three specific cases (a, b, c).
          *   One outcome must be unpopular/unexpected (explain why).
          *   Flag where the output looks like a dodge.

  2.  **Brainstorming: How Distinctions Get Mangled in Practice:**
      *   *Conflation:* Moral guilt gets treated as criminal guilt (demanding punishment where none is legally possible). Political guilt gets treated as metaphysical (solidarity turned into spiritual penance).
      *   *Strategic Ambiguity:* Institutions use vague language to satisfy multiple categories without committing to any (the "split the difference" dishonesty mentioned).
      *   *Temporal Drift:* Criminal guilt expires, but political guilt doesn't. Committees confuse the two, leading to "statute of limitations" arguments against moral repair.
      *   *Agency Confusion:* Who bears the guilt? The dead individuals? The living institution? The current students? Jaspers is clear on collective vs. individual, but practice blurs this.
      *   *Performative vs. Substantive:* Apologies (moral/political) become substitutes for restitution (political/criminal).
      *   *Legalization of Ethics:* General Counsel reduces everything to liability risk, swallowing moral and metaphysical dimensions.

  3.  **Developing the Procedure (The "Jaspers Filter"):**
      *   *Time:* 90 minutes. Needs structure.
      *   *Participants:* Committee members (non-philosophers), Chair (user), General Counsel (advisory).
      *   *Jaspers's Categories:*
          1.  **Criminal:** Violation of laws, adjudicated in court. (Institution usually can't admit this without counsel).
          2.  **Political:** Liability for the deeds of the state/institution one belongs to. Reparations, structural change.
          3.  **Moral:** Individual conscience, introspection, personal transformation. (Hard for an *institution* to do, but can facilitate).
          4.  **Metaphysical:** Solidarity with all humans, co-responsibility for wrongs committed in one's presence/existence. (Too vague for policy? Maybe keep as a "horizon").
      *   *Drafting the Steps:*
          *   Step 1: Fact-Finding & Criminal Screen (15 mins). Counsel heavy.
          *   Step 2: Political Liability (30 mins). The core institutional work.
          *   Step 3: Moral & Metaphysical Resonance (30 mins). The "meaning" part.
          *   Step 4: Decision & Drafting (15 mins).
      *   *Collisions:* Counsel stops "Criminal" admissions. Committee struggles with "Moral" (can an institution have a conscience?).
      *   *Termination:* If it's purely Criminal and barred by law -> Terminate (or hand to Counsel for settlement). If it's purely Metaphysical with no political hook -> Terminate (too vague).
      *   *Hand-off:* Values (what *should* we do?) vs. Facts (what *did* we do?).

  4.  **Critiquing the Framework (Simplification):**
      *   *Drop:* Metaphysical Guilt. It's too theological/abstract for a university committee dealing with plaques and funds. It risks becoming empty rhetoric.
      *   *Keep:* Political vs. Moral. This is the crucial distinction. Political = institutional liability/action. Moral = individual conscience/atonement.
      *   *Loss:* Nuance, the interconnectedness of the categories, the demand for radical self-reflection. Checklists bureaucratize conscience.

  5.  **Running the Cases:**
      *   *Case A (1950s Medical Study):* Survivors want apology + money. Perpetrators dead.
          *   Criminal: Expired/Dead. Counsel blocks admission of illegality.
          *   Political: Institution exists, benefited. Reparations possible.
          *   Moral: Apology appropriate.
          *   *Outcome:* Fund + Apology (carefully worded).
      *   *Case B (Colonial Hall):* Benefactor wealth from plantations. No claimants.
          *   Criminal: None (legal then).
          *   Political: Institution benefited from unjust structures. Renaming is a political act of redefinition.
          *   Moral: Current community's relationship to history.
          *   *Outcome:* Renaming + Educational Fund.
      *   *Case C (Alumni "On Behalf of Every Graduate"):*
          *   Criminal: No.
          *   Political: Institution can speak for itself, not constituents.
          *   Moral: Cannot apologize for others' moral failings.
          *   *Outcome:* Rejection of the "on behalf of" phrasing. This is the unpopular one.
      *   *The "Dodge":* Where careful wording looks like evasion (e.g., Case A apology).

  6.  **Refining the Tone:**
      *   Needs to sound like someone who has sat in uncomfortable rooms.
      *   Avoid academic jargon where possible, but keep the philosophical rigor.
      *   Acknowledge the legal reality (General Counsel is a veto point).
      *   Be honest about the limitations of the procedure.

  7.  **Drafting - Section by Section:**
      *   *Intro/Brainstorm:* Set the scene. The "mangling."
      *   *The Procedure:* Step-by-step, time-boxed.
      *   *The Critique:* What to drop/keep.
      *   *The Cases:* Apply the logic.
      *   *The Unpopular Outcome:* Case C.
      *   *The Dodge:* Case A's legal wording.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mark where Counsel collides? Yes, Step 1.
      *   *Check:* Did I specify termination points? Yes.
      *   *Check:* Is the distinction between Political and Moral clear? Political is about the *polity* (university) and its continuity. Moral is about *conscience*. An institution can have political liability, but "moral guilt" is metaphorical for an entity. I need to make sure the procedure handles this. *Correction:* Jaspers says moral guilt is for individuals. The committee represents the institution. So the procedure must translate "Moral" into "Institutional Ethos/Values" while acknowledging the limit.
      *   *Check:* Is the "Metaphysical" drop justified? Yes, for a 90-minute meeting, it's too abstract.
      *   *Check:* Is Case C's rejection clear? Yes, an institution cannot assume the moral guilt of its alumni. That violates the individual nature of moral guilt.

  9.  **Final Polish:** Ensure the voice is consistent. (Philosopher-administrator hybrid). Make sure the "unpopular" outcome is explained philosophically, not just pragmatically. (It violates the category of Moral Guilt).

  *(Self-Correction on Case C)*: Why is this unpopular? Alumni want validation. The university saying "We can't speak for you" feels like abdication. But philosophically, it's necessary. I need to emphasize this tension.

  *(Self-Correction on Case A)*: Ensure the distinction between "admitting liability" (Criminal/Political legal) and "acknowledging harm" (Political ethical) is clear for Counsel.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Brainstorm: How These Distinctions Get Mangled in Practice

  Before we write the procedure, let's be honest about what happens in the room when you try to apply philosophy to bureaucracy. I've sat on boards where this happened, and here is where the wire gets crossed:

  1.  **The Legal Swallow:** General Counsel tends to treat *Political* guilt (institutional liability for the state of things) as *Criminal* guilt (admission of illegal act). This chokes off reparations because the institution fears setting a legal precedent.
  2.  **The Moralization of Politics:** We try to solve structural *Political* problems (funding, naming) with *Moral* gestures (apologies, moments of silence). It feels good, costs nothing, and changes nothing. It's virtue signaling as policy.
  3.  **The Metaphysical Dodge:** We use *Metaphysical* language ("we are all human," "solidarity") to obscure *Criminal* or *Political* facts. It turns a demand for justice into a request for spiritual healing.
  4.  **Temporal Confusion:** We treat *Criminal* guilt (which expires) as if it negates *Political* guilt (which persists as long as the institution benefits from the past). "They're dead, so we're off the hook" is a category error.
  5.  **Collective Conscience:** We pretend the institution has a *Moral* conscience. It doesn't. It has policies and values. Attributing moral guilt to a building or a corporation is metaphorical, but we treat it as literal, which dilutes the actual moral responsibility of the living individuals running it.

  ***

  ### The Procedure: The "Jaspers Filter" (90 Minutes)

  **Participants:** Committee Chair (you), Committee Members (voting), General Counsel (non-voting, advisory), Secretary (timekeeping).
  **Goal:** Categorize the claim to determine the *type* of response licensed.

  #### Phase 1: The Criminal Screen (15 Minutes)
  *Goal: Determine if this is a legal liability issue. Counsel leads.*

  *   **Question 1:** Does the proposal require admitting a violation of law that is currently actionable?
      *   *Sufficient Answer:* Yes/No based on statute of limitations, living perpetrators, or evidentiary standards.
      *   *License:* If **Yes**, the procedure **terminates**. This moves to Legal Settlement/Negotiation, not ethics committee.
      *   *Forbidden:* The committee cannot draft language admitting criminal guilt.
      *   *Collision Point:* Counsel will veto any text saying "We broke the law." You must negotiate phrasing like "We acknowledge harm consistent with historical findings" vs. "We were negligent."
  *   **Question 2:** Are the specific perpetrators identifiable and living?
      *   *Sufficient Answer:* Names and status.
      *   *License:* If Yes, individual disciplinary processes apply (HR/Legal), not institutional commemoration.

  #### Phase 2: Political Guilt & Liability (30 Minutes)
  *Goal: Determine institutional continuity and benefit. Chair leads.*

  *   **Question 3:** Did the institution (as a continuous entity) benefit from the wrong, or fail in its civic duty to prevent it?
      *   *Sufficient Answer:* Evidence of endowment growth, reputation gain, or policy failure at the time.
      *   *License:* **Political Guilt.** This licenses structural remedies: renaming, funds, restitution, policy change.
      *   *Forbidden:* Purely symbolic gestures without resource allocation (if benefit was material).
      *   *Hand-off:* If the answer is "We benefited," this is a **Value Judgment** on how much restitution is owed. The committee votes; the Chair breaks ties.
  *   **Question 4:** Is the claimant group a constituent of the current polity (students, staff) or an external citizenry?
      *   *Sufficient Answer:* Status verification.
      *   *License:* External claims lean toward Political solidarity (funds/partnerships). Internal claims lean toward Political membership (rights/policy).

  #### Phase 3: Moral & Metaphysical Resonance (30 Minutes)
  *Goal: Determine the ethical tone. Committee leads.*

  *   **Question 5:** Does the proposal ask the institution to assume the *individual* moral guilt of past actors?
      *   *Sufficient Answer:* Analysis of the text (e.g., "We repent for Dr. X's sin").
      *   *License:* **Moral Guilt** is for individuals. The institution can express *regret* or *sorrow*, but cannot confess *sin* on behalf of the dead.
      *   *Forbidden:* Language that implies the current committee feels personal shame for acts they did not commit. (This is inauthentic).
      *   *Hand-off:* This is a **Values** call. How humble do we sound?
  *   **Question 6:** (The Metaphysical Check) Does the proposal invoke a universal human solidarity that transcends the specific institution?
      *   *Sufficient Answer:* Identification of "co-responsibility" language.
      *   *License:* Use only to frame the *intent* of the remedy (e.g., "In solidarity with all victims of...").
      *   *Forbidden:* Using this to replace specific Political remedies. (No "we are all human" instead of money).

  #### Phase 4: Synthesis & Drafting (15 Minutes)
  *Goal: Match Remedy to Category.*

  *   **Decision Matrix:**
      *   **Criminal:** Legal Settlement (Committee recuses).
      *   **Political:** Restitution, Renaming, Endowment, Policy Reform.
      *   **Moral:** Apology (carefully worded), Memorialization, Truth-telling.
      *   **Metaphysical:** Educational programming, Solidarity statements.
  *   **Termination:** If a proposal demands a remedy mismatched to the guilt (e.g., demanding Criminal punishment for Political guilt), the committee issues a "No Action" with a categorical explanation.
  *   **The Dodge Flag:** If the final text uses Metaphysical language to avoid Political costs, the Secretary must mark it in the minutes as "Rhetorical Substitution."

  ***

  ### Critique: Simplifying Jaspers for Practitioners

  **Which Distinction to Drop:** **Metaphysical Guilt.**
  *Why:* In a 90-minute administrative meeting, "metaphysical guilt" (co-responsibility for all human wrongs because we are human) becomes theological sludge. It is too abstract to license specific policy. It risks becoming the language of evasion ("we are all complicit") rather than action.
  *Loss:* You lose the horizon of universal solidarity. You risk making the university's responsibility purely transactional (Political) rather than existential.

  **Which Must Survive:** **Political vs. Moral.**
  *Why:* This is the engine. **Political Guilt** attaches to the *institution* (which survives over time) and licenses *structural repair* (money, names). **Moral Guilt** attaches to *consciences* (individuals) and licenses *atonement* (apology, truth).
  *Loss by Checklist:* Jaspers intended these categories to interpenetrate. A checklist risks siloing them. You might end up with a "Political" checkmark that gets a building renamed, but no "Moral" work done by the living faculty to understand why it happened. It bureaucratizes conscience.

  **The Counsel Collision:**
  The procedure collides with Counsel at **Phase 1, Question 1** and **Phase 3, Question 5**.
  *   Counsel hears "Institutional Benefit" (Political) and hears "Admission of Liability" (Criminal).
  *   Counsel hears "We regret the harm" (Moral) and hears "Evidence for Litigation" (Criminal).
  *   *Mitigation:* You must pre-negotiate a "Safe Language" glossary with Counsel before the meeting.

  ***

  ### Running the Cases

  #### Case (a): 1950s Medical Study (Survivors want apology + money)
  *   **Phase 1 (Criminal):** Perpetrators dead, limitations expired. Counsel says: "No admission of illegality." **Pass.**
  *   **Phase 2 (Political):** Institution exists. Endowment grew from the study's prestige. Survivors are external citizens. **Verdict: Political Guilt confirmed.** License: Restitution/Fund.
  *   **Phase 3 (Moral):** Can we apologize? Yes, for the harm, not the crime. **Verdict: Moral Regret licensed.**
  *   **Outcome:** **Establish a Survivor Fund + Formal Apology.**
  *   **The Dodge Flag:** The apology must be vetted by Counsel. It will likely read: *"We acknowledge the suffering caused by studies conducted under our name."* It will avoid *"We conducted illegal studies."* To the survivors, this will read as a dodge, even if the Fund is generous. The procedure acknowledges this tension in the minutes but prioritizes the Political remedy (money) over the Criminal admission (truth).

  #### Case (b): Colonial Hall (Renaming, no claimants)
  *   **Phase 1 (Criminal):** Wealth generation was legal at the time. **Pass.**
  *   **Phase 2 (Political):** Institution benefited from unjust global structures (slavery/colonialism). The building name honors that benefit. No specific claimants, but the "polity" includes those historically excluded. **Verdict: Political Guilt confirmed.** License: Renaming (redefinition of the polity).
  *   **Phase 3 (Moral):** Current community values conflict with the name. **Verdict: Moral alignment.**
  *   **Outcome:** **Rename Hall + Create Educational Endowment on Colonial History.**
  *   **Note:** This is the "easy" one for the committee. It costs little (a sign change) and signals virtue. The procedure ensures the Endowment is attached so it isn't purely symbolic.

  #### Case (c): Alumni Petition ("Apologize on behalf of every graduate")
  *   **Phase 1 (Criminal):** No crime alleged. **Pass.**
  *   **Phase 2 (Political):** The University can speak for the University. It cannot speak for the alumni body as a political constituency in this context.
  *   **Phase 3 (Moral):** **CRITICAL STOP.** Jaspers is explicit: Moral guilt is individual. One conscience cannot repent for another. The Administration cannot assume the moral guilt of 100,000 living alumni.
  *   **Outcome:** **Request Denied.**
  *   **The Unpopular Result:** This is the one you won't like. The alumni will scream that the University is "abdicating leadership."
  *   **Why:** Granting this violates the category of Moral Guilt. It turns the University into a church confessor for people who haven't confessed. It creates a false collective conscience. The procedure forces you to say: *"We can apologize for the University's actions. We cannot apologize for the thoughts or actions of our graduates."*
  *   **Risk:** This looks like cowardice. It reads as a dodge ("We don't want to offend the donors"). But philosophically, it is the most rigorous outcome. It protects the integrity of moral agency.

  ### Final Warning

  The procedure will produce **Case (a)** outcomes that look like hush money (because Counsel strips the admission of wrong). It will produce **Case (c)** outcomes that look like cold bureaucracy (because you refuse to aggregate moral guilt).

  If you use this, you must publish the *categorization* alongside the decision. If you just publish the decision, it will look like you split the difference. You have to show your work: *"We rejected this because it conflated Political and Moral guilt."* That is the only way to prevent the dishonesty you currently despise. But be warned: clarity invites attack. Ambiguity is armor. You are choosing to take the armor off.
