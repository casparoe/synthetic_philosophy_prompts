answer: |-
  Your hypothesis is remarkably astute. For a latecomer to the field, you have identified the structural geometry of the debate with a precision that many practitioners within it often obscure. To answer your opening question directly: your diagnosis is **partly right, but it underestimates the normative dimension.**

  You suggest the disagreement concerns the class of environments against which a strategy is scored. This is empirically correct. However, the reason the argument has not terminated is not merely that the two camps are measuring different regions of a parameter space, but that they disagree on *which metric* ought to be used to score the results in the first place. It is not solely a dispute about the environment (the empirical input); it is a dispute about the definition of rationality (the normative standard).

  Here is the detailed breakdown you requested.

  ### 1. The Nature of the Disagreement

  You offer four possibilities: a verbal dispute, a concealed empirical question, a difference over internal vs. relational norms, or bedrock intuition. The truth is a combination of the latter three.

  **It is not merely verbal.**
  While both sides use the word 'rational', they are not simply talking past one another. They are proposing competing scientific models of cognitive function. If it were purely verbal, a stipulative definition would settle it. It does not, because the definitions carry empirical predictions about cognitive architecture.

  **It is partly empirical (The Environment).**
  Your intuition regarding "regions of a single parameter space" is sound.
  *   **The H&B Camp (Kahneman & Tversky):** They generally test agents in environments designed to be *hostile* to heuristics. They construct problems where the statistical structure is obscured or where the heuristic leads to a logical contradiction (e.g., the Conjunction Fallacy). They assume the relevant environment is the abstract space of probability theory.
  *   **The ER Camp (Gigerenzer):** They test agents in environments *structured* to match the heuristic. They argue that the human mind evolved for the "Ecological Environment" (frequency-based, time-constrained, information-scarce), not the "Laboratory Environment" (single-event probabilities, unlimited time).
  *   **The Clash:** Kahneman and Tversky (1996) conceded that frequency formats reduce errors but maintained that the underlying cognitive limitation remains. Gigerenzer counters that if the frequency format matches the natural environment, the "limitation" is a fiction of the experimenter's design. Thus, you are correct: they are measuring performance in different regions of the environmental parameter space.

  **It is fundamentally normative (Coherence vs. Correspondence).**
  This is the element your hypothesis misses. The disagreement is bedrock.
  *   **Coherence (H&B):** Rationality is defined by internal consistency with the laws of logic and probability. If an agent's beliefs violate the conjunction rule ($P(A \& B) \leq P(A)$), they are irrational, regardless of whether that belief helps them survive. This is a **context-independent** norm.
  *   **Correspondence (ER):** Rationality is defined by adaptive success in the world. If a heuristic leads to successful action (feeding, mating, avoiding danger) in a specific environment, it is rational, even if it violates logical norms. This is a **context-dependent** norm.

  Kahneman and Tversky explicitly defend coherence norms. In their 1996 reply, they write: "We do not mean to suggest that coherence is the only criterion for assessing reasoning... [but] coherence is a necessary condition for rationality." Gigerenzer rejects this necessity. He argues that coherence is often computationally intractable and that correspondence is the only norm that matters for a bounded agent.

  ### 2. Supporting Claims from Each Side

  To support this diagnosis, we must look at what they actually claim regarding the *source* of error.

  **Kahneman and Tversky (1996, *Psychological Review*):**
  *   **Claim:** Biases are not merely artifacts of presentation. Even when problems are presented in frequency formats (which Gigerenzer favours), some biases persist.
  *   **Claim:** The mind relies on "heuristic principles which reduce the complex tasks of assessing probabilities... to simpler judgmental operations." These operations are prone to systematic error.
  *   **Implication:** The mind is flawed relative to the norm of probability theory. The goal of psychology is to map these flaws.

  **Gigerenzer (1996, *Psychological Review*):**
  *   **Claim:** The "biases" observed by H&B are often artifacts of applying norms appropriate for a "God's eye view" (infinite knowledge) to bounded agents.
  *   **Claim:** Heuristics like 'Take-the-Best' ignore information. In environments with high redundancy and diminishing returns on information, ignoring information is *more* accurate than weighting all cues (the "less-is-more" effect).
  *   **Implication:** The mind is adapted to the environment. The goal of psychology is to map the "adaptive toolbox" to the environmental structure.

  ### 3. What Would Count as Progress?

  You ask whether a formal result, a decisive experiment, or a reframing could settle this.

  **A decisive experiment is impossible.**
  Because the disagreement is partly normative, no empirical data can settle it. If an experiment shows a heuristic violates probability theory but succeeds in the wild, H&B calls it a bias that luckily worked; ER calls it rationality. If an experiment shows a heuristic fails in the lab, H&B calls it proof of irrationality; ER calls it proof of environmental mismatch.

  **A formal result is the only path forward.**
  Progress requires a formalism that subsumes both coherence and correspondence. This is currently happening under the banner of **Resource-Rationality** (or Bounded Optimality).
  *   **The Formalism:** This approach treats cognitive effort as a cost. It asks: "What is the optimal strategy given the agent's computational limits and the structure of the environment?"
  *   **The Resolution:** It accepts coherence as the *ideal* but acknowledges that for a bounded agent, the *optimal* strategy may be a heuristic that violates coherence to save computational cost.
  *   **Why this is progress:** It moves the debate from "Are we rational?" (a binary yes/no) to "Under what cost-benefit constraints is this heuristic optimal?" This validates your "parameter space" intuition by formally mapping the boundary where a heuristic switches from adaptive to maladaptive.

  ### 4. The Unoccupied Position: A Third View or a Truce?

  You ask if there is a position that accepts coherence norms yet holds that bounded agents can approximate them only via simple heuristics.

  **This position is not unoccupied; it is the dominant synthesis in modern cognitive science, though it lacks a popular figurehead.**
  Herbert Simon, the grandfather of this debate, originally held this view. He defined rationality as bounded, but he did not discard the normative ideal; he simply noted the constraints.

  However, the specific view you describe—accepting coherence as the *target* but heuristics as the *mechanism*—is currently championed by the **Resource-Rationality** programme (e.g., Tom Griffiths, Falk Lieder).
  *   **Is it a truce?** No, it is a reframing. A truce implies both sides agree to disagree. This view dissolves the disagreement by changing the objective function. It posits that the brain *is* trying to maximise coherence (or accuracy), but is constrained by time and energy. Therefore, the heuristic is the *mathematically optimal solution to the constrained problem*.
  *   **Distinction from ER:** Unlike Gigerenzer, who often suggests coherence norms are irrelevant, the Resource-Rationalist says coherence is the goal, but the heuristic is the best possible *approximation* given the costs.
  *   **Distinction from H&B:** Unlike Kahneman, who views heuristics as sources of error, the Resource-Rationalist views them as features of an optimal design under constraint.

  ### Conclusion

  Your hypothesis is **substantially correct regarding the empirical landscape** but requires amendment regarding the normative foundation. The two camps are indeed measuring different regions of the environmental parameter space, which explains why their data never collide. However, the reason the argument does not terminate is that they disagree on whether the score should be kept in points of "Logical Consistency" or "Survival Success".

  Progress will not come from a new experiment showing one side is 'right'. It will come from the formalisation of the trade-off between accuracy and effort (Resource-Rationality). This third view is not a truce; it is the rigorous mathematical reconciliation of your physicalist intuition with the philosophical norms of the debate. It accepts that while the laws of probability (coherence) may hold in any environment, the agent's ability to satisfy them is strictly a function of the environment's structure and the agent's energy budget.

  In short: you have correctly identified the geometry of the dispute, but the friction arises because the two camps are using different coordinate systems to map it.
