answer: |-
  ### Specification of Requirements for an Epistemic Defense of Majority Rule

  The following list specifies the conditions a formal account must satisfy to move from theoretical plausibility to institutional applicability. For each requirement, I indicate the motivating consideration and classify it as **Non-Negotiable** (failure renders the account useless for design) or **Camp Prejudice** (failure reflects a methodological commitment of one discipline that the other may reject).

  **1. Competence Grounding and Estimability**
  *   **Motivation:** The Condorcet logic requires individual competence $p > 0.5$. An account must explain the source of this competence (expertise, information access, cognitive capacity) and, crucially, how a designer can estimate $p$ *ex ante* without using the vote's outcome as proof of competence (circularity).
  *   **Classification:** **Non-Negotiable.** Without an independent metric for competence, a designer cannot determine assembly size or voting thresholds.
  *   **Note on Assumption/Conclusion:** Economists tend to treat competence as an exogenous parameter (assumption); philosophers often treat it as a normative achievement of the process (conclusion). Treating it as an assumption for design purposes is necessary but risks begging the question against skeptics who doubt the voter's capacity.

  **2. Error Correlation Structure**
  *   **Motivation:** Aggregation benefits rely on error cancellation. If voters share information sources, cultural priors, or media environments, errors become correlated. An account must specify the covariance structure of votes and demonstrate that correlation does not swamp the signal as group size increases.
  *   **Classification:** **Non-Negotiable.** Ignoring correlation leads to over-optimistic scaling arguments that fail in real-world information environments.

  **3. Strategic Coherence**
  *   **Motivation:** If voters are rational agents, voting sincerely is not always an equilibrium strategy (e.g., free-riding on others' information or voting tactically). An account must show that the voting rule incentivizes the behavior (sincere revelation of private signals) that the epistemic proof requires.
  *   **Classification:** **Camp Prejudice (Economist).** Political philosophers may accept expressive or duty-based voting models where strategy is irrelevant. However, for robust mechanism design, incentive compatibility is effectively non-negotiable.

  **4. Finite Group Sensitivity**
  *   **Motivation:** Institutions operate at finite $n$ (e.g., juries of 12, assemblies of 500). Accounts relying on asymptotic limits ($n \to \infty$) are insufficient. The model must account for diminishing returns or competence dilution as $n$ grows (e.g., due to coordination costs or reduced individual diligence).
  *   **Classification:** **Non-Negotiable.** Design requires specific numbers, not limits.

  **5. Deliberation Compatibility**
  *   **Motivation:** Deliberation is intended to pool information but risks creating information cascades or groupthink. An account must model deliberation not just as "pre-vote chat" but as a dynamic process that alters the independence and competence parameters specified in requirements 1 and 2.
  *   **Classification:** **Non-Negotiable.** Since deliberation is a concrete design variable on the table, an account that assumes static votes is inapplicable.

  **6. Logical Consistency (Doctrinal Integrity)**
  *   **Motivation:** Groups often decide interconnected propositions (e.g., "Guilty" implies "Breach" and "Causation"). Majority voting on each proposition separately can yield a collectively inconsistent set. An account must address whether it tracks truth on individual propositions or consistency on the set.
  *   **Classification:** **Camp Prejudice (Philosopher/Logician).** Economists may view inconsistency as a revealed preference; philosophers and legal designers view it as a fatal flaw in legitimacy.

  **7. Domain Truth-Aptitude**
  *   **Motivation:** Epistemic defenses require a "truth" to track. The account must specify which questions are truth-apt (e.g., factual causation, economic forecasts) and which are matters of value or preference where "correctness" is undefined.
  *   **Classification:** **Camp Prejudice (Philosopher).** Economists often model values as preferences to be aggregated rather than truths to be discovered. An epistemic defense collapses without this distinction.

  ***

  ### The Incompatibility Thesis

  There is a subset of requirements that cannot be jointly satisfied in a strong form. Specifically: **Strategic Coherence (3)**, **Deliberation Compatibility (5)**, and **Error Correlation Structure (2) [specifically the Independence condition]**.

  *   **The Argument:** To satisfy **Strategic Coherence**, agents must vote based on their posterior belief conditional on being pivotal. To satisfy **Deliberation Compatibility**, agents share private signals before voting. If agents are rational and share signals, their posteriors converge based on the common information revealed. This convergence creates **Error Correlation**; their votes are no longer independent conditional on the state of the world.
  *   **The Conflict:** A model that assumes independence *after* deliberation is descriptively false. A model that accounts for the correlation induced by deliberation typically shows that the epistemic benefit of adding voters diminishes rapidly or reverses (since they are effectively copying the same signal).
  *   **Which Must Give:** **Independence** must give. You cannot have rational deliberation without inducing correlation. Therefore, any defensible account must abandon the strong independence assumption of classical Condorcet models. It must instead demonstrate that majority rule is robust *despite* the correlation that deliberation and rationality inevitably create. If an account insists on maintaining Independence while allowing Deliberation and Rationality, it is describing a body that could not exist.

  ***

  ### The Hardest Bite

  The single requirement that does the most work in excluding otherwise attractive accounts is **Requirement 2: Error Correlation Structure**.

  *   **Reasoning:** The primary selling point of majority rule in institutional design is scalability—the idea that adding more voters reliably increases accuracy (the "wisdom of crowds"). This is the feature that justifies large citizen assemblies over small expert committees.
  *   **The Exclusion:** Once you enforce a realistic correlation structure (common priors, shared media, deliberation cascades), the mathematical engine of aggregation stalls. In many plausible correlation models, increasing group size yields negligible epistemic gains or actively decreases accuracy after a small threshold. This requirement kills the classical Condorcet defense immediately and places a heavy burden on game-theoretic accounts to show how private information remains sufficiently idiosyncratic to justify large $n$. It forces designers to confront the possibility that there is an optimal, relatively small group size, undermining the democratic intuition that "more inclusion is always epistemically better."

  ***

  ### Archetype Scores

  *   **Classical Condorcet:** Fails on Correlation and Competence Grounding; it assumes the parameters designers need to measure and ignores the correlation introduced by real-world information environments.
  *   **Game-Theoretic (Information Aggregation):** Satisfies Strategic Coherence but often sidesteps Deliberation Compatibility, modeling voting as a static signal revelation that breaks down once cheap-talk or dynamic updating is introduced.
  *   **Judgment Aggregation:** Satisfies Logical Consistency but explicitly abandons the claim to track an antecedent truth, rendering it unsuitable for an *epistemic* defense of majority rule specifically.
  *   **Pragmatist/Experimentalist:** Sidesteps the Competence Grounding problem by treating accuracy as an emergent property of iteration, but fails to provide the *ex ante* design specifications (size, threshold) required for constitutional-level decisions.

  ***

  ### Note on Assumptions vs. Conclusions

  The line between assumption and conclusion is drawn question-beggingly most often around **Requirement 1 (Competence Grounding)**.

  *   **The Economist's Move:** To treat average competence $p$ as a fixed parameter of the population. This allows the math to proceed but assumes the very thing the philosopher questions (that the populace *has* a determinate competence on the matter).
  *   **The Philosopher's Move:** To treat competence as a conclusion of the deliberative process itself. This avoids assuming capacity but makes the design problem unsolvable, as you cannot set the rules of the process based on an outcome the process is supposed to generate.
  *   **The Design Necessity:** For this workshop to produce a design paper, you must treat Competence as an **assumption** that requires empirical validation (Requirement 1), not a normative conclusion. If you do not, you cannot calculate the optimal assembly size. The friction will arise because philosophers will view this as reducing citizens to noisy sensors, while economists will view the alternative as refusing to engage with the constraints of mechanism design.
