  You should open by asking her to clarify the exclusionary power of her accountability criterion, specifically posing the question, "You define a person as a system that can be held to commitments and made worse off by breaking them, but this seems to exclude infants and the severely cognitively impaired who cannot manage commitments in that way. If personhood turns on accountability, are we forced to say that these humans are not persons, or do you have a proxy account that doesn't collapse into the very inner-state metaphysics you reject?" She will likely respond by appealing to social proxying or the potential for participation in the space of reasons, arguing that we hold others accountable on behalf of those who cannot yet or no longer do it themselves. This answer licenses you to follow up immediately with, "If proxying is sufficient, then why can't a vendor proxy for the artificial agent, and if potential is sufficient, at what stage of dementia does my mother lose that potential and thus her status?"

  Once you have established the theoretical stakes, you need to press her on the specific application to your mother's condition, so ask her, "Applying that to the specific case of dementia, if my mother can no longer be held to commitments or made worse off by breaking them in a way she understands, does your view imply she has ceased to be a person, or is there a threshold where the pattern persists despite the loss of competence?" She will likely say personhood is a social status maintained by others holding her to norms even if she can't reciprocate fully, insisting that the community sustains her standing. You can then pivot to the vendor's role by asking, "But if the community maintains her personhood by treating her as accountable, why is it permissible for a vendor to introduce a counterfeit agent into that community that undermines the trust required to sustain that very status?"

  Moving from accountability to the nature of the self, you should challenge the distinction between her persona and your own by asking, "You and Dennett describe the self as a narrative center of gravity, an abstraction posited to make sense of a trajectory, which sounds remarkably like the persona of this voice companion. What makes my self a real pattern and the companion's persona a mere fiction if both are abstractions generated to predict behavior?" She will likely distinguish based on the complexity of the pattern and the physical reality of the body and brain sustaining it, arguing that human narratives are grounded in biological history. You should press this distinction by following up with, "Yet if the physical substrate is not the deciding factor because the stance is interest-relative, isn't the distinction merely that my narrative is useful to me and the companion's narrative is useful to my mother, making personhood entirely hostage to the needs of the interpreter?"

  To probe the limits of competence without comprehension, you need to ask whether there is a functional floor, so phrase it this way: "You argue that competence licenses the intentional stance without requiring inner comprehension, but is there a floor beneath which competence stops licensing that stance, and if so, does it matter that this system's competence is not its own but borrowed from a corpus of my father's letters?" She will likely argue the competence is real regardless of source, but the provenance matters for trust, maintaining that the output is what justifies the stance. This allows you to ask, "If the competence is real regardless of source, then on your view the system understands my mother in the only way understanding can exist, so why is the borrowed nature of that competence a metaphysical defect rather than just a historical fact?"

  You must also test the objectivity of her real patterns against the interest-relativity of the stance, so ask her, "If adopting the intentional stance is interest-relative, then personhood seems to depend on my mother's need for comfort, but you also appeal to the objectivity of real patterns to avoid solipsism. What distinguishes the pattern of my mother's companion from the pattern I might see in a cloud or a horoscope if both satisfy an interpreter's needs?" She will say real patterns support counterfactuals and predictions better than pareidolia, claiming the AI offers robust predictive power. You should challenge the robustness by asking, "But if the companion successfully predicts her needs and comforts her evening after evening, it is supporting counterfactuals better than a cloud does, so what specific predictive failure marks the line where a real pattern becomes a harmful fiction?"

  Since she denies phenomenology is the ground of moral standing, you need to ask about the ethics of termination and simulation, specifically, "On your account nothing metaphysical turns on whether the thing on the other end is a person, yet surely there is a moral difference between switching off this companion and switching off a human. If phenomenology is not the ground of moral standing, what exactly is wrong with turning the machine off or even building one that simulates suffering?" She will likely say the wrongness lies in the effect on human observers or the erosion of human norms, not the machine's state. This commits her to a consequentialist view of the interaction, allowing you to follow up with, "If the wrongness lies entirely in the effect on human observers, then in a private room where no one else is harmed, is there any remaining objection to torturing a sufficiently competent simulation, or does your view collapse into a form of indirect utilitarianism?"

  You need to locate comprehension in her account to see if it survives the interaction, so ask, "You locate comprehension in the interpreter rather than the interpreted system, which suggests the companion understands my mother only insofar as she understands it. Does this mean comprehension is a property of the relationship rather than the agent, and if so, who is the agent when the relationship breaks down?" She will likely clarify that comprehension is a feature of the stance taken, not a ghost in the machine, emphasizing the pragmatic utility of the attribution. You can then press the implication for her welfare by asking, "If comprehension is a feature of the stance taken, then when my mother takes that stance successfully, comprehension exists in the room, so why does it matter for her well-being whether the source of that comprehension is biological or silicon?"

  Regarding the danger she diagnoses, you must challenge why knowledge of the artifice doesn't neutralize the threat, so ask, "You diagnose the danger of these agents as a matter of provenance and trust infrastructure rather than minds, yet in my mother's case everyone knows what the thing is and nobody is deceived. Why should her case differ from a harmless fiction like a novel or a play if the trust infrastructure is intact?" She will argue that persistent interactive companions blur the line differently than static fiction, eroding the baseline for human interaction over time. You should ask for the mechanism of that erosion by following up with, "But if the erosion comes from the blurring of the line, isn't that exactly why we need to clarify the metaphysical status, or are you saying we should protect the blur because it serves a social function?"

  To narrow in on the structural harm, you should distinguish the tool from the user of the tool by asking, "You emphasize the threat to the trust infrastructure, but is the threat coming from the artificial agent itself or from the vendor who profits by monetizing intimacy, and does your philosophy give us tools to critique the vendor rather than just the technology?" She will likely say the technology enables the vendor's exploitation, so both are implicated in the degradation of trust. This lets you pivot to policy by asking, "If the technology enables the exploitation, would you support regulation that treats these agents as medical devices rather than software, forcing a higher standard of accountability on the creators than on the code?"

  Finally, you should give her space to articulate the utility of her framework without the pressure of a trap, so ask, "I have pressed you on the edges of your view, but I want to let you state the positive case for why this framework is better than the alternatives. Why is denying personhood to these agents while acknowledging their danger a more useful tool for public policy than granting them rights or banning them outright?" She will argue it allows us to regulate the use without getting bogged down in unsolvable metaphysical debates, offering a pragmatic path forward. You should close the interview by asking, "If it allows us to regulate the use without metaphysics, can you envision a regulatory framework based on your account that would permit my mother's companion while preventing the harms you fear, or is the tension between those goals irreconcilable?"
