  Good morning. If you can hear me over the leaf blower, you're doing better than the archives.

  Forty-eight years ago, this town opened a box. Inside was a mimeographed list of officers, a Bicentennial button, the eighth-grade class photo. Pure love for the town as it wished to be seen. And a letter from Dolores Fink. She asked who pays for a celebration. It got a laugh in 1976. It got silence in October. Her daughter was in the second row. We remember that silence. It matters more than the button.

  So we had to decide what goes in today. Ruth Delaney and the Historical Society have spent sixty years tending this town's memory. That care is not small. It is the only reason we know who we are. We honor that work. Love for what came before is not a weakness; it is the ground we stand on.

  But love cannot be the only thing we seal. We put a diner menu in here. We put a seed packet. We put a 3D model of the water tower. And we put a single page from the Vandermeer tannery payroll, dated April 1923. It was chosen for the beauty of the penmanship. It is beautiful. It also lists four children. One was eleven. We are putting both things in the box. The beauty and the cost. To hide the cost would be to lie to the future. To hide the beauty would be to lie to ourselves.

  We put soil from the founder's grave. We put water from the river. The river is cleaner today because people refused to accept what was there before. That is also history. It is not just what was built, but what was healed.

  Usually, we use the past to explain ourselves. We look back to stand taller, or to feel safe, or to break chains. We assume we are the ones doing the looking. But this box reverses the direction. It turns us inside out. We are not the historians today. We are the artifacts. We are choosing what will be used to judge us. That is a terrifying freedom. It means we cannot curate only our virtues. Someone else opens this box. Someone else decides if we told the truth. We are handing our secrets to a tribunal that hasn't been born yet.

  We debated including a recording of the leaf blower. We decided against it. Some noise belongs to the moment, not the record. The kids appreciate that. The adults know why.

  I could tell you that the future will forgive us. I could tell them we did our best. But I don't know what they will need from us. Maybe just the ledger. Maybe just the letter. They will decide what this town was, based on what we leave behind.

  So I won't speak for them. I'll just close the box.

  (Pause, look at the box)

  When this lid lowers, we stop speaking. We start waiting.

  ***

  The reversed gaze assumes the future cares enough to judge, but they might only feel indifference toward our moral struggles. They cannot convict us because they are not our contemporaries; they are merely our inheritors, living with consequences rather than intentions. The gaze isn't a trial, it's an autopsy, and the dead don't feel the verdict.
