          *   Focus on the *disagreement* between geologists (stratigraphic evidence) and historians/social scientists (conceptual utility/politics).
          *   Address the mismatch between the *marker* (e.g., plutonium) and the *cause* (e.g., capitalism/colonialism).
          *   Include a trap (e.g., reducing it to "just politics").
          *   No reading list.
          *   Tone: Accessible but rigorous, respectful of their non-academic background but demanding high-quality thought.

  2.  **Deconstruct the Core Tension:**
      *   *Geologists/Stratigraphers:* Need a "Golden Spike" (GSSP). Something global, synchronous, and permanent in the rock record. They rejected the Anthropocene because human impact is diachronous (starts at different times in different places) and the proposed marker (plutonium) doesn't match the *cause* of the impact (CO2/capitalism).
      *   *Historians/Social Scientists:* Use "Anthropocene" as a conceptual tool to discuss responsibility, ethics, and systems. They don't care about the rock record; they care about the narrative.
      *   *The Trap:* Saying "Geologists are pedants, Historians are right, it's all political." Or vice versa. The best answer recognizes *why* the definitions differ based on *purpose*.

  3.  **Drafting the Scenario (The Question):**
      *   Need a fictional setting that mirrors the real debate.
      *   Let's create a fictional committee deciding on a name for a new layer in a fictional context.
      *   *Scenario:* A museum exhibit or a textbook commission? Let's go with a "Global Commission on Planetary History" deciding on a chapter title.
      *   *Characters:* Dr. Aris (Geologist) vs. Prof. Kael (Historian).
      *   *Conflict:* Aris says "No formal layer, evidence is messy." Kael says "We need the name to drive policy."
      *   *The Trap:* The prompt should tempt the writer to just pick a side. The goal is to analyze the *nature* of the disagreement.

  4.  **Drafting the Model Answer:**
      *   *Word Count:* Around 700 words.
      *   *Structure:*
          1.  Introduction: Identify the core conflict (Definition vs. Utility).
          2.  The Geological Perspective: Why the "Golden Spike" failed (diachrony, marker vs. cause).
          3.  The Historical/Social Perspective: Why the term persists (narrative, responsibility).
          4.  Synthesis: It's not a factual error, it's a category error. Different tools for different jobs.
          5.  Conclusion: The value of the tension itself.
      *   *Tone:* Clear, argumentative, avoiding jargon where possible.
      *   *Key Insight:* The plutonium spike (marker) doesn't equal capitalism (cause). The geologists are right about rocks; historians are right about stories.

  5.  **Drafting the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Criteria:* Needs to reward specific analytical moves and penalize common pitfalls (like the "just politics" trap).
      *   *Breakdown:*
          *   Understanding the Geological Constraint (5 marks).
          *   Understanding the Historical Utility (5 marks).
          *   Analyzing the Marker/Cause Mismatch (5 marks).
          *   Avoiding the "Politics Only" Trap (5 marks).
          *   Clarity/Structure (5 marks).
      *   *Specific Deductions:* For listing dates without analysis, for dismissing one side entirely.

  6.  **Refining and Polishing:**
      *   *Check against constraints:* Did I mention 1950/1610? Only in the model answer as examples, not as the answer to the question. Is the question open-book proof? Yes, it requires synthesis, not recall.
      *   *Tone Check:* Is it condescending? No, keep it respectful. "None of us ever went to uni" means avoid opaque academic speak, but don't dumb down the ideas. They are smart readers.
      *   *The "Trap":* Ensure the marking scheme explicitly penalizes the "It's just politics" simplification.

  7.  **Final Review of the Output:**
      *   *Question:* Clear scenario, specific task.
      *   *Model Answer:* Hits the word count, addresses the prompt's specific nuances (marker vs. cause, 2024 rejection).
      *   *Marking Scheme:* Actionable for a peer group or facilitator.

  *(Self-Correction during drafting)*: I initially thought about making the scenario about a law court. But a "Commission" feels more like the actual scientific/historical debate. Let's stick with the Commission. I need to make sure the Model Answer doesn't sound *too* academic. It needs to sound like a really good version of what a group member could write. I will ensure the language is punchy.

  *(Refining the Trap)*: The trap is thinking the geologists are "wrong" because they are "conservative" or the historians are "wrong" because they are "activists." The answer must show both are right within their own frameworks.

  *(Refining the Marker/Cause point)*: This is crucial. Plutonium is the spike, but CO2/Capitalism is the problem. Geologists say "Plutonium isn't the problem." Historians say "But Capitalism is." The answer must highlight this disconnect.

