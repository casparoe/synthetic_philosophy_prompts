answer: |-
  **The Scenario**

  Martha is eighty-two, terminally ill, and lives alone without children, students, or religious beliefs, having long ago made peace with her own death and abandoned any desire for legacy. For thirty years, her only consistent pleasure has been sitting by her kitchen window each morning to peel an orange and watch the light hit the table, a practice she maintains for no reason other than the quiet joy of the sensation itself. Upon learning that humanity will cease to exist shortly after her death, she feels no terror for herself nor grief for others, but she stops sitting by the window. When asked why, she says plainly, "I did this because I was part of a world that kept going. If the world stops with me, then this isn't living anymore, it's just waiting."

  **The Analysis**

  **Predictions and Verdict**
  The **Load-bearing** reading predicts Martha stops. It argues that even self-contained present goods derive their normative force from the background assumption of a continuing human context. Without that background, the activity shifts category from "living" to "ending," stripping it of sense. The **Amplifier** reading predicts she should continue. Since she has no legacy, children, or fear of death, the doom scenario removes no personal future goods. If she stops, the Amplifier must claim she is masking personal resentment (that *her* story ends) as a metaphysical judgement. The case delivers the Load-bearing verdict: she stops despite lacking all standard Amplifier hooks (legacy, fear, unfinished projects).

  **Key Feature**
  Constraint 3 (present-directed good) does the heavy lifting. By selecting an activity with no future payoff (peeling an orange vs. planting a tree), we block the Amplifier's standard move that value lies in future consequences. This forces the Amplifier to argue that the *present* sensation itself changes quality based on external future facts, which concedes the Load-bearing point that context structures value. If the sensory input is identical but the reason vanishes, the reason must have been ecological, not internal.

  **Removal Test**
  If we give Martha a grandson she loves, the case weakens significantly. If she stops the routine, the Amplifier can plausibly argue she stops because she imagines *his* absence, reintroducing personal attachment as the driver. The verdict would slide towards the Amplifier reading: she isn't mourning the structure of value, but the loss of a specific personal future containing her grandson. The purity of the test relies on her isolation; adding a relationship provides the Amplifier with the "personal erasure" hook it needs to explain her reaction without admitting value is load-bearing.

  **Amplifier Defense**
  A sophisticated Amplifier defender will argue that Martha's description ("routine," "world kept going") smuggles in a future-oriented expectation. They will claim the sensory pleasure of the orange is unchanged, but the *meaning* she attaches to it relies on the belief that others will peel oranges tomorrow. Therefore, her stopping isn't about the structure of value itself, but about the loss of a comforting belief in normalcy. She is grieving the loss of her own context, not the loss of value's conditions. They will argue she is psychologically unable to separate the act from its background, but this is a failure of imagination, not a feature of value.

  **Confidence and Uncertainty**
  I am 85% confident this case distinguishes the readings. The least secure claim is that the Amplifier cannot absorb the "loss of normalcy" argument. If "normalcy" is just a psychological comfort distinct from normative value, the Amplifier survives by saying she lost a comfort, not a reason. Distinguishing "reasons" from "psychological preconditions" is the fragile edge here; if the tutor argues that psychological preconditions *are* part of the reason, the Load-bearing victory becomes less clear.
