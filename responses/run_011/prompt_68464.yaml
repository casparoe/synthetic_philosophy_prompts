answer: |-
  ### What the paradox actually licenses

  Bertrand's Paradox demonstrates that "ignorance" is not a unique distribution. A uniform prior on a parameter $\theta$ implies a non-uniform prior on any nonlinear transformation $f(\theta)$. The paradox licenses no specific probability; it forbids assigning probabilities based solely on mathematical convenience. It proves that probability statements about unique events require a specified selection mechanism. In engineering risk, this means we cannot default to the client's preferred unit. We must identify the physical process generating the variance. If the generation mechanism is unknown, the probability is undefined, not merely uncertain. This procedure replaces arbitrary convenience with physical anchoring. It shifts the burden from calculating a number to validating the model that produces it.

  ### The procedure

  1.  **Identify the Generation Mechanism:** Interrogate the client: "What physical process drives variation here?" (e.g., manufacturing tolerance, material fatigue, human decision). If the answer is "we don't know" or "it's just unknown," flag for escalation immediately. Do not proceed to math without physics.
  2.  **Select Candidate Scales:** Propose two parameterizations: the client's default and one physically motivated alternative (e.g., log-scale for concentrations, cycles for fatigue). Justify the alternative using literature or first principles.
  3.  **Define Bounds:** Elicit hard physical limits for each scale (e.g., concentration > 0, probability $\in [0,1]$). Do not accept "plausible ranges" without justification. Bounds must be defensible in court.
  4.  **Compute Maximum Entropy:** Apply a uniform distribution *only* on the scale where the underlying noise is additive and constant (**Physical Invariance**). If unknown, compute for both. This is the only defensible use of "ignorance."
  5.  **Transformation Test:** Transform the resulting distribution to the other scale. Does it match the direct calculation? If you assume uniform on $X$, is the distribution of $\log(X)$ consistent with physical expectations?
  6.  **Stability Check:** Compare the resulting risk metrics (e.g., 95th percentile). If they diverge, the model is unstable.

  **Principle:** **Physical Invariance.** Choose the scale where measurement error or physical noise is homoscedastic. **Limit:** This fails for strategic human behavior or complex systems with unknown failure modes.
  **Judgment Calls:** Step 1 (identifying mechanism) and Step 2 (selecting alternatives) rely on analyst expertise, not data. Document the reasoning.
  **Timebox:** 30 minutes. If Step 1 fails, move to Escalation.

  ### Stopping and escalation rules

  **Stop Rule:** If the stability check (Step 6) shows divergence greater than one order of magnitude in the tail probability, stop. Do not average. Averaging inconsistent models creates false precision. File the request as "Model Unstable."

  **Escalation Rule:** Hand to me if divergence changes the regulatory compliance status (e.g., $10^{-5}$ vs $10^{-4}$). This is no longer a calculation; it is a risk appetite decision. I will decide whether to publish the range or challenge the regulator's requirement for a scalar.

  **Not Estimable:** If Step 1 yields no physical mechanism (e.g., deliberate human sabotage), file as "Not Estimable as Single Number." Probabilistic models require random variation, not strategic intent.

  **Judgment Calls:** Determining "order of magnitude" significance in low-probability tails is subjective. Deciding which scale is "physically motivated" is also subjective; document the rationale. Analysts must sign off on the chosen mechanism, accepting liability for the assumption.

  ### Three worked requests

  **(i) Forty bench-tested seals, zero failures.**
  Client wants an annual failure probability.
  *   **Mechanism:** Fatigue wear.
  *   **Scales:** Failures per cycle vs. Failures per year.
  *   **Analysis:** Rule of 3 suggests 7.5% upper bound per test. However, converting cycles to years requires a usage profile (cycles/year), which is unknown. Uniform on failure rate vs. uniform on mean-time-to-failure yields divergent annual probabilities.
  *   **Result:** **Not Estimable.** The conversion from bench cycles to annual probability requires a wear model the client does not have.
  *   **Unwanted Outcome:** Client wanted a number for the regulator. This delays approval.

  **(ii) Solvent metabolite toxicity.**
  Question posed in concentration, log concentration, or fraction of distance between analogues.
  *   **Mechanism:** Biological uptake.
  *   **Scales:** Linear concentration vs. Log concentration.
  *   **Analysis:** Biology responds log-linearly. Uniform on linear overweights high concentrations. Uniform on log is physically invariant.
  *   **Result:** Use Log-uniform. Probability exceeds threshold is 15% (vs 40% on linear).
  *   **Outcome:** Analyst must justify log-scale to regulator. Lower risk number, but higher justification burden.

  **(iii) Operator deliberately defeats interlock.**
  *   **Mechanism:** Human choice.
  *   **Scales:** Probability per shift.
  *   **Analysis:** No physical generation mechanism for "deliberate" acts. Uniform distribution implies ignorance, but this is strategic behavior.
  *   **Result:** **Not Estimable.** Cannot treat intent as random variable.
  *   **Outcome:** Escalate for qualitative risk assessment. Quantitative safety case rejected.

  ### What this procedure cannot do

  This procedure cannot manufacture data where none exists. It cannot satisfy a regulator's demand for a scalar value when the physics supports only a range or a qualitative statement. It shifts the burden of proof back to the client to define their system physics. It cannot resolve conflicts where the "physical" scale is disputed by experts. Ultimately, it protects the consultancy from liability by refusing to certify arbitrary numbers, but it may cost client relationships who prefer compliance over accuracy. It forces us to sell uncertainty rather than false certainty.
