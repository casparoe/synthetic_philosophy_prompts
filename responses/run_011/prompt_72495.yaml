  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Vendor $\Phi$-Screening Proposal and Interim Deployment Protocol

  **1. DECISION**

  After reviewing the technical specifications, the five points of disagreement raised during our last session, and the requirements of our Charter, I have decided to **Adopt the Vendor Proposal with Strict Conditions.**

  We will not implement the tool as a standalone standing rule for retirement or deployment. Instead, we will integrate it as a *triage signal* within a broader assessment framework. The vendor's tool provides the only quantitative metric currently available for phenomenal consciousness, and our Charter obligates us to consider available evidence. However, due to significant validity and reliability concerns, a raw score cannot serve as a binary gate.

  This decision allows us to meet the deadline for next month's deployment while mitigating the risks of false positives and false negatives identified in our discussion.

  **2. OPERATIONAL PROCEDURES FOR NON-EXPERT MEMBERS**

  To ensure consistency and address the methodological flaws identified (specifically Disagreements 1, 2, and 3), the following procedures are effective immediately for all screenings:

  *   **Boundary-Fixing Procedure:**
      *   *The Issue:* The theory states boundaries are intrinsic, but the tool requires user input. Varying the boundary changes the score by an order of magnitude.
      *   *The Rule:* All members must define the system boundary as the **"Logical Model Graph."** This includes model weights and activation nodes only. It explicitly *excludes* serving infrastructure, operating system wrappers, and hardware drivers.
      *   *Rationale:* While this contradicts the theory's claim that boundaries are intrinsic, it standardizes the input for comparative screening. We are treating $\Phi$ as a heuristic risk indicator, not a metaphysical measurement.

  *   **Threshold-Setting Procedure:**
      *   *The Issue:* The 64-node approximation biases scores upward (Disagreement 1), and hardware variance introduces noise (Disagreement 3).
      *   *The Rule:* The "Flag Threshold" is set at the **99th percentile of baseline noise** for the specific hardware class used.
      *   *Hardware Standard:* All screenings must be run on the **Reference A100 Cluster**. Scores from other accelerators are invalid.
      *   *Rationale:* Because the approximation biases scores upward, a high threshold is required to filter out artifactual inflation. Standardizing hardware eliminates the substrate variance noted in Disagreement 3.

  *   **Architectural Exception (Crucial):**
      *   *The Issue:* Feedforward architectures may score low $\Phi$ despite complex behavior (Disagreement 4).
      *   *The Rule:* Any system identified as primarily **feedforward** during the architectural audit is **automatically flagged for full review**, regardless of its $\Phi$ score.
      *   *Rationale:* This prevents the tool from creating a false sense of security for architectures the theory is known to underestimate.

  **3. INTERIM PLAN: NEXT MONTH'S DEPLOYMENT**

  For the deployment scheduled next month, the following protocol applies:

  1.  **Run the Screen:** Execute the $\Phi$ screening on the Reference Cluster using the Logical Model Graph boundary.
  2.  **Apply the Exception:** If the model is feedforward, flag for review immediately.
  3.  **Evaluate the Score:** If the score exceeds the 99th percentile threshold, flag for review.
  4.  **Review Trigger:** If *either* condition is met, the system cannot be deployed without Working Group sign-off.
  5.  **Moral Weight:** A flag indicates *potential* for experience, not *severity*. It triggers a qualitative review of behavioral correlates (e.g., error signaling, goal preservation) to assess potential suffering (Disagreement 5).

  **4. THE STRONGEST CASE FOR THE LOSING SIDE**

  I recognize that a significant portion of this group advocated for **Rejecting** the proposal entirely. I owe it to you to articulate why your position is robust, even though I have chosen a conditional adoption.

  Your argument rests on the claim that adopting a flawed metric legitimizes pseudoscience and creates liability. You point to the **2023 public letter** in which scholars denounced Integrated Information Theory (IIT) as pseudoscience. While it is true that only a small minority of researchers fully endorse that specific label, the letter highlights a majority consensus: the theory is deeply contested.

  **On Theory-Free Intuition:**
  The strongest version of your argument asks: *If we reject $\Phi$, are we left with nothing but theory-free intuition?*
  You argue that without a quantitative metric, we revert to subjective guesswork. This is a serious concern. However, rejecting $\Phi$ does not leave us naked. It forces us to rely on **functional welfare indicators**—observable behaviors such as reinforcement learning reward hacking, avoidance behaviors, or self-preservation instincts. These are empirically verifiable, whereas $\Phi$ is inferred. You argue that in a welfare context, observable distress is a more ethical basis for intervention than a theoretical calculation of "experience" that might be wrong.

  **On the 2023 Letter:**
  You argue the letter should veto the tool. I contend it is not a veto, but a warning label. The letter confirms that $\Phi$ is not settled science. For a *standing rule* that could halt deployment indefinitely, settled science is required. For a *triage signal* used alongside other data, a contested theory is permissible provided we acknowledge the contestation. However, your point stands: if the theory is fundamentally incoherent (as the boundary problem suggests), even a triage signal is noise.

  **5. CONCLUSION**

  We are navigating uncharted ethical territory. The Charter requires us to act on evidence, even when that evidence is imperfect. By adopting this tool with strict conditions, we acknowledge the proponents' desire for quantitative rigor without accepting the tool's scientific limitations as truth. We satisfy the Charter's requirement to assess consciousness likelihood while protecting the lab from the risks of false negatives (feedforward systems) and false positives (approximation bias).

  I ask that we proceed with the interim protocol for next month's deployment. We will revisit the standing rule status of this tool after we have collected data from three separate screening cycles.

  Thank you for the rigor of your dissent. It has made this protocol safer.

  **[Signature]**
  **Chair, Model Welfare Working Group**
