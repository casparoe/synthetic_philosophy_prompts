answer: |-
  **PHILOSOPHY OF ECONOMICS: FINAL EXAMINATION**

  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Instructions:** Answer the following question. You are not expected to recall outside readings; all necessary information is contained in the case description below. Write clearly and argue for a specific verdict.

  **Question 1**

  Consider a subject who makes 30 distinct purchases under varying prices and income constraints. The resulting dataset of prices and quantities satisfies the Generalized Axiom of Revealed Preference (GARP). By Afriat's Theorem, there exists a locally non-satiated utility function that rationalizes every observation in this dataset.

  Subsequently, the same subject is presented with the same bundles in pairwise choices, devoid of price information or budget framing. In this context, the subject produces a strict preference cycle: Bundle A is chosen over B, B over C, and C over A. In a verbal report, the subject states she prefers C to A.

  A "Two-Tier Theorist" argues there is no contradiction. She proposes that the agent possesses a latent ordering $R$ that governs choice only when a "salience condition" $S$ obtains (roughly, when the choice is framed as a trade-off at given prices). When $S$ does not obtain, choice is driven by a heuristic $H$ (e.g., "choose the option with the more conspicuous good"). On this view, the budget data reveals $R$, while the pairwise cycle reveals $H$.

  Evaluate the empirical content of the Two-Tier Theory. Specifically:
  1.  Does this theory rescue revealed preference from the charge of tautology, or does it render the theory completely empty?
  2.  What would the salience condition $S$ need to look like for the theory to retain predictive power?
  3.  What is the ontological status of utility in this framework (i.e., is it a definition of choice or a substantive posit)?

  Defend a clear verdict on whether the theory is empirical, empty, or something in between.

  ***

  **MODEL ANSWER**

  The Two-Tier Theory attempts to preserve the rationalizing power of utility theory in the face of contradictory data by partitioning choice contexts. While this move avoids immediate logical contradiction, it risks rendering the theory empirically empty unless strict constraints are placed on the salience condition $S$. As currently formulated, the theory is ad hoc and lacks predictive content, though it could be salvaged if $S$ is independently identifiable.

  First, we must clarify the implication of the initial dataset satisfying GARP. Afriat's Theorem guarantees the *existence* of a utility function consistent with the data; it does not prove the agent possesses this function psychologically, nor does it guarantee uniqueness. The standard revealed preference claim is that choice *defines* preference. The Two-Tier Theorist modifies this: choice defines preference only when $S$ obtains. When the budget data satisfied GARP, it was consistent with $R$. When the pairwise data produced a cycle, it violated $R$. The theorist saves $R$ from falsification by attributing the cycle to $H$.

  The central problem is empirical content. A theory is empty if it can accommodate any possible observation. In standard revealed preference theory, a GARP violation falsifies the hypothesis that the agent maximizes a stable preference ordering. In the Two-Tier Theory, a GARP violation in pairwise choices does not falsify $R$; it merely triggers the application of $H$. If the theorist can retroactively assign any anomalous choice to the heuristic domain ($\text{not-}S$) and any consistent choice to the rational domain ($S$), the theory predicts nothing. It becomes a "just-so" story where $R$ explains consistency and $H$ explains inconsistency. This is worse than the standard tautology charge; standard revealed preference is tautological but unified. The Two-Tier Theory is fragmented and unfalsifiable unless the domains are fixed in advance.

  For the theory to retain predictive power, the salience condition $S$ must be identifiable independently of the choice outcome. $S$ cannot be defined as "the context where the agent maximizes utility," because that is circular. Instead, $S$ must be defined by observable features of the choice architecture known prior to observing the choice. For example, $S$ might obtain only when prices are explicitly displayed, or when a delay is imposed before selection. If $S$ is defined by external framing features rather than internal consistency, we can test the theory: we predict maximization when prices are visible and cycles when they are hidden. If the agent maximizes even without prices, or cycles despite prices, the theory is falsified. Without this independent identification of $S$, the partitioning of data is arbitrary.

  Regarding the ontological status of utility, the Two-Tier Theory shifts utility from a definitional term to a substantive posit about a specific cognitive subsystem. In standard revealed preference, utility is merely a numerical representation of choice; it makes no claim about mental states. Here, $R$ is posited as a latent ordering that exists even when not manifested in choice (e.g., during the pairwise cycle). This makes utility a theoretical entity akin to a psychological mechanism. However, this creates a burden of proof. If utility is a real mechanism that is sometimes switched off by the absence of $S$, we need evidence for its existence beyond the very choices it is supposed to explain. Relying solely on the budget data to prove $R$ exists, while ignoring the pairwise data that contradicts it, begs the question.

  Verdict: The Two-Tier Theory, as stated, is empirically empty. It saves the rationality hypothesis from falsification by immunizing it against counter-evidence through the heuristic escape clause. It rescues revealed preference from logical contradiction only by sacrificing empirical content. To become empirical, the theorist must pre-specify $S$ using variables independent of choice consistency. Until then, utility functions as an ad hoc theoretical posit rather than a definition of choice, but one that is insulated from testability. The theory explains everything and therefore predicts nothing.

  ***

  **MARKING SCHEME (25 Marks)**

  **1. Interpretation of Afriat/GARP (5 Marks)**
  *   **Full Marks:** Correctly states that GARP satisfaction guarantees the *existence* of a rationalizing function, not uniqueness or psychological reality. Notes that pairwise cycles violate rationalization by a single ordering.
  *   **Common Mistake:** Treating a GARP violation as proof the agent is "irrational" rather than proof that no utility function rationalizes the dataset; or claiming Afriat proves the agent actually has the utility function in her head.

  **2. Analysis of the Partitioning Strategy (5 Marks)**
  *   **Full Marks:** Identifies that the theory partitions data into "rational" and "heuristic" buckets to avoid falsification. Recognizes the risk that any data can be sorted this way retroactively.
  *   **Common Mistake:** Assuming the theory is valid simply because it avoids logical contradiction; failing to see that avoiding contradiction is not the same as making a prediction.

  **3. The Independence Condition on S (5 Marks)**
  *   **Full Marks:** Argues that $S$ must be observable/identifiable independently of the choice outcome (e.g., based on framing features known ex ante). Notes that if $S$ is defined by consistency, the theory is circular.
  *   **Common Mistake:** Accepting the theorist's definition of $S$ without questioning how we know when $S$ obtains without looking at the choice itself.

  **4. Verdict on Empirical Content (5 Marks)**
  *   **Full Marks:** Delivers a clear verdict (e.g., "currently empty," "saveable if constrained"). Argues that without independent $S$, the theory is ad hoc and unfalsifiable.
  *   **Common Mistake:** Thinking that saying "it is unfalsifiable" settles the matter without explaining *why* the extra flexibility (the heuristic clause) destroys predictive power; or fence-sitting without a conclusion.

  **5. Status of Utility (5 Marks)**
  *   **Full Marks:** Identifies that utility shifts from a definition of choice to a substantive posit about a latent mechanism ($R$). Notes this increases ontological commitment without increasing evidence.
  *   **Common Mistake:** Conflating the definitional reading of revealed preference with the empirical one; failing to notice that utility cannot be both a definition of choice and a latent cause that sometimes fails to drive choice.
