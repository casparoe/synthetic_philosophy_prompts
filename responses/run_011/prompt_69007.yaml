answer: |-
  Your unease is well-founded. The study sheet is a mix of correct theorems, dangerous simplifications, and outright falsehoods. If your friend's students follow this literally, they will fail to solve games like the one provided and might misunderstand the nature of Nash Equilibrium.

  Here is the claim-by-claim autopsy, the analysis of the example game, and the correction for weak dominance.

  ### Part 1: Claim-by-Claim Autopsy

  **Claim 1: "Iterated elimination of strictly dominated strategies (IESDS) is order-independent."**
  *   **Verdict:** **TRUE.**
  *   **Explanation:** This is a standard theorem. No matter which strictly dominated strategy you remove first, the final set of surviving strategies is unique.

  **Claim 2: "You can never throw away a Nash equilibrium by doing it [IESDS]."**
  *   **Verdict:** **TRUE.**
  *   **Explanation:** A strictly dominated strategy is never a best response to any belief about the opponent's play. Therefore, it cannot be part of any Nash Equilibrium (pure or mixed).

  **Claim 3: "To check whether a strategy is strictly dominated you just compare it head-to-head against each of the player's other pure strategies."**
  *   **Verdict:** **FALSE.**
  *   **Explanation:** This is the most critical error. A pure strategy can be strictly dominated by a **mixed strategy** even if it is not dominated by any other single pure strategy. By restricting students to "pure vs. pure" comparisons, the sheet prevents them from eliminating strategies that *should* be eliminated.
  *   **Smallest Counterexample:** The game provided in your study sheet is actually the counterexample to this specific claim (see Part 2).

  **Claim 4: "Weakly dominated strategies behave the same way — same order-independence, same guarantee about equilibria."**
  *   **Verdict:** **FALSE.**
  *   **Explanation:** Iterated Elimination of *Weakly* Dominated Strategies (IEDWDS) is **order-dependent** (different orders yield different survivors) and **can eliminate Nash Equilibria**.
  *   **Smallest Counterexample (NE Loss):**
      ```
            L      R
      T   1,1    0,0
      B   0,0    0,0
      ```
      *   **Analysis:** For the Row player, $B$ is weakly dominated by $T$ (1 > 0 and 0 = 0).
      *   **Equilibria:** There are two Pure Nash Equilibria: $(T, L)$ and $(B, R)$.
      *   **The Failure:** If you eliminate $B$ because it is weakly dominated, you destroy the equilibrium $(B, R)$. Thus, the guarantee that "you can never throw away a Nash equilibrium" is false for weak dominance.

  ---

  ### Part 2: Analysis of the Provided Example

  Let's look at the game on the sheet.
  ```
        L      R
  T   3,0    0,2
  M   0,2    3,0
  B   1,1    1,1
  ```
  *(Row payoffs listed first)*

  #### 1. Following the Sheet's Procedure (Pure vs. Pure)
  The sheet says: *"compare it head-to-head against each of the player's other pure strategies."*
  *   **Row Player:**
      *   Is $T$ dominated by $M$? No ($3>0$ in L, $0<3$ in R).
      *   Is $T$ dominated by $B$? No ($3>1$ in L).
      *   Is $M$ dominated by $T$? No.
      *   Is $M$ dominated by $B$? No ($3>1$ in R).
      *   Is $B$ dominated by $T$? No ($1>0$ in R).
      *   Is $B$ dominated by $M$? No ($1>0$ in L).
  *   **Column Player:**
      *   $L$ vs $R$: Depending on Row's move, one is better, then the other. Neither dominates.
  *   **Result:** The procedure **stalls**. Students conclude nothing can be eliminated.

  #### 2. Following Correct Game Theory (Allowing Mixed Dominators)
  *   **Row Player:** Consider a mixed strategy $\sigma = 0.5T + 0.5M$.
      *   If Column plays $L$: $\sigma$ yields $0.5(3) + 0.5(0) = 1.5$. Strategy $B$ yields $1$. ($1.5 > 1$)
      *   If Column plays $R$: $\sigma$ yields $0.5(0) + 0.5(3) = 1.5$. Strategy $B$ yields $1$. ($1.5 > 1$)
      *   **Conclusion:** $B$ is **strictly dominated** by the mixed strategy $\sigma$.
  *   **Elimination:** We eliminate $B$.
  *   **Reduced Game:**
      ```
            L      R
      T   3,0    0,2
      M   0,2    3,0
      ```
      This is a standard Matching Pennies game. No further strategies are strictly dominated.
  *   **Result:** $B$ is eliminated. The game simplifies to the top 2x2.

  #### 3. The Nash Equilibria
  *   **Full Game:** There are **no Pure Strategy Nash Equilibria**. (In every cell, someone wants to deviate).
  *   **Mixed Equilibrium:** In the reduced 2x2 game (Matching Pennies), the unique NE is:
      *   Row plays $T$ with prob 0.5, $M$ with prob 0.5. (Expected Payoff = 1.5)
      *   Column plays $L$ with prob 0.5, $R$ with prob 0.5. (Expected Payoff = 1)
      *   Row does **not** play $B$ (Payoff 1 < 1.5).
  *   **Agreement:** Both the "Stalled" method and the "Correct" method agree on the final Equilibrium (since $B$ isn't played in the NE anyway). **However**, the sheet's method failed to simplify the game, which might make finding that mixed equilibrium much harder for a student.

  ---

  ### Part 3: What to do about Weak Dominance?

  The claim on the sheet regarding weak dominance is dangerous. If a student uses IEDWDS to "find the Nash Equilibrium," they might miss valid equilibria or find a solution that depends on the arbitrary order in which they crossed things out.

  **Is there a safe version to use on a problem set?**
