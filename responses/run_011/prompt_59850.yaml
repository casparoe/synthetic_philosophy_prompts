  On the cruxes specifically: give me at least four, and make sure that at least one is a modeling experiment on synthetic systems whose between-subsystem coupling strength is a tunable parameter; at least one involves human forecasters working blind — for example, matched vignettes in which some describe events as they happened and some describe the same events with one small antecedent altered, with raters asked to judge plausibility or downstream magnitude without knowing which are which; and at least one confronts the denominator problem head-on, estimating what fraction of candidate small causes of the nail type leave a trace large enough to enter the historical record at all, and how one might measure that reporting bias rather than merely lament it.

  Two further constraints. Do not cite anything: no bibliography, no footnotes, no named scholars or books beyond the single attribution already given above, because I cannot check them and formulations matter more here than provenance. And where you are uncertain whether a claim would really survive a hostile reading by both camps, flag the uncertainty inside the relevant field rather than smoothing it into confident prose — a document that overstates its own agreement is worse than no document.
