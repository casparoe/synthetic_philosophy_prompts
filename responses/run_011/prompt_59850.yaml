        "kind": "genuine | verbal | empirical_but_unsettled",
        "linked_crux": "the C-id this disagreement turns on, or null"
      }
    ],
    "cruxes": [
      {
        "id": "C1",
        "question": "one sentence, whose answer would move at least one camp",
        "who_moves": "amplification | damping | both",
        "how_they_move": "what the camp would have to concede, and how far",
        "accepted_test": "the observation, model experiment, or protocol both camps would accept in advance as bearing on the question — concrete enough that a third party could actually run it",
        "prediction_amplification": "this camp's prediction, recorded before the result, as a quantity with a range or an explicit ordering",
        "prediction_damping": "the other camp's prediction, in the same form",
        "feasibility": "runnable_now | needs_data_collection | thought_experiment_only",
        "what_would_not_count": "a result one camp would try to dismiss, and the reason the joint statement rules that dismissal out of bounds"
      }
    ],
    "irreducible_residue": "two to four sentences on what the camps would still disagree about if every crux above were settled in the way least favorable to each camp's own side",
    "joint_advice_to_forecasters": "the recommendation both camps will put their names to, addressed to someone deciding whether to make event-level predictions at ten- and thirty-year horizons; if the recommendation is a division of labor by question type rather than a verdict, say so and specify the dividing line"
