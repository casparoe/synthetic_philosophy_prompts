answer: |-
  Part One: Joint Claims

  1.  Social systems do not possess a single Lyapunov exponent characterizing "history" as a whole; exponents vary by variable (e.g., crop yield vs. regime type) and timescale, meaning some domains are chaotic while others are stable over the same interval.
      *   **Concession:** The amplification camp gives up the claim that all meaningful historical variables are unpredictable beyond a short horizon; the damping camp gives up the claim that structural stability applies uniformly across all social variables.

  2.  Near-decomposability holds for most social subsystems over short intervals (years to decades), limiting immediate cross-subsystem propagation, but coupling strength increases over longer intervals (centuries), allowing local perturbations to eventually become global.
      *   **Concession:** The amplification camp gives up the expectation that small events immediately rewrite the global trajectory; the damping camp gives up the assumption that subsystem isolation is permanent or absolute. [Uncertain: Damping camp may require stricter bounds on "eventually".]

  3.  The historical record systematically over-represents perturbations with large downstream effects relative to those with null effects, creating a selection bias that inflates the observed frequency of amplification events.
      *   **Concession:** The amplification camp gives up using the surviving historical record as an unbiased sample of all perturbations; the damping camp gives up assuming the absence of evidence for small-event impacts is evidence of their absence.

  4.  Contingency (the modal availability of alternative outcomes) is distinct from unpredictability (epistemic limits due to chaos); a system can be contingent yet predictable within an envelope, or deterministic yet unpredictable due to measurement limits.
      *   **Concession:** The amplification camp gives up equating unpredictability with the existence of alternative possibilities; the damping camp gives up equating structural constraint with the impossibility of alternative outcomes.

  5.  Path dependence requires specific mechanisms such as increasing returns or institutional lock-in and is not an automatic consequence of any sequence of events; many historical sequences exhibit equifinality rather than lock-in.
      *   **Concession:** The amplification camp gives up assuming all historical sequences are locked-in by early events; the damping camp gives up assuming all historical sequences converge to the same outcome regardless of order.

