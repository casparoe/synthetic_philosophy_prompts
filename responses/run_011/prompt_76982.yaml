  *   If the companies were *fighting* the quota cuts and lobbying to keep fishing high, she might be more inclined to call it "Greed/Politics" (Not a Trap). By highlighting that they *want* to stop but *can't*, you are priming her to use Rule C (Preference Coercion). Be prepared for her to notice you framed it that way.

  ### 6. Future Test Cases (To Separate the Rules)

  To find out if she prioritizes **Authority (Rule A)** or **Actor Coercion (Rule C)**, try these two cases next. They change one variable at a time.

