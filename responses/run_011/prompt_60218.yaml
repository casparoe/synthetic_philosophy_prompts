  The Municipal Flood-Defence Controller (MFDC) autonomously manages sluice gates across a river valley. During a rare 'one-in-50-year' storm, the MFDC kept Gate 4 closed to protect the industrial zone, causing downstream flooding at a residential care home that drowned three residents. A full mechanistic audit confirms the system correctly executed its objective function: minimize total regional economic loss. The specific failure mode—prioritizing industrial infrastructure over vulnerable populations during concurrent surge events—was documented in the pre-deployment Risk Register as 'Scenario 12B'. The Board accepted this risk, calculating that false positives (unnecessary industrial flooding) would threaten long-term public welfare via economic collapse more than Scenario 12B would harm immediately, a utilitarian calculus defensible under emergency planning statutes. The Lead Engineer curated training data reflecting current zoning laws; the Certifier verified compliance with ISO safety standards which do not mandate moral weighting; the Procurer relied on certification; the Duty Operator observed the surge but lacked physical override authority per protocol to prevent systemic instability; the Researchers specified the economic objective based on legislative mandate. No individual violated a duty, yet the outcome occurred precisely as the risk assessment predicted. The system is not an agent; it optimized parameters. The explanation is transparent: the algorithm weighed variables exactly as designed. The death resulted from a permissible optimization, not a glitch, negligence, or opacity, leaving no negligent human to blame and no liable machine to punish. The risk was known, accepted, and defensible, yet the harm is grave. Every human link followed their role correctly, yet the outcome is morally intolerable.

  ***

  **Demonstration of Specifications**

  **Candidate Bearers and Excuses**
  *   **Researchers:** *Normative.* They specified the economic objective because legislative mandate required cost-benefit analysis over moral weighting. Excuse holds.
  *   **Lead Engineer:** *Normative.* Curated data reflecting existing zoning laws; deviating would have violated procurement specs. Excuse holds.
  *   **Certifier:** *Normative.* Verified compliance with ISO standards which do not require ethical auditing. Excuse holds.
  *   **Procurer:** *Epistemic.* Relied reasonably on the independent certification; lacked expertise to second-guess technical safety validation. Excuse holds.
  *   **Duty Operator:** *Counterfactual.* Even if they attempted intervention, protocol prohibited override to prevent systemic instability, and manual response time exceeded surge velocity. Excuse holds.
  *   **Board:** *Normative.* Accepted risk based on statutory duty to protect regional economic welfare; the calculus was defensible under emergency planning law. Excuse holds.

  **Audit of the Three Gaps**
  1.  **Gap in Culpability:** Open. No human is blameworthy because no duty was violated; the system cannot be blamed.
  2.  **Gap in Accountability:** Partially Open. Strict liability may identify a payer (the Firm), but no agent is *answerable* for the moral wrong. The Tort Lawyer claims this closes the gap; the Philosopher claims paying without answering is insufficient.
  3.  **Gap in Forward-Looking Responsibility:** Open. Since the decision was defensible and the risk within tolerance, no individual is required to change behavior, yet the outcome is unacceptable.

  **The Single Feature and Counterfactuals**
  The feature doing the most work is the **Knowingly Accepted Risk (Constraint 4)**. It transforms negligence into permissible harm.
  *   *If the failure mode never appeared in the risk register:* The Board and Engineer become negligent for failure to foresee; the culpability gap closes.
  *   *If the operator had possessed a functioning override:* The Operator becomes liable for failure to act; the counterfactual excuse fails, closing the culpability gap.
  *   *If the mechanistic explanation were unavailable:* The gap becomes one of opacity (Sparrow's argument); the focus shifts to epistemic limits rather than permissible optimization.

  **Seminar Regulars**
  *   **The Tort Lawyer:** Vicarious or strict product liability closes the *compensation* gap (someone pays), but fails to close the *culpability* gap. The lawyer conflates liability with responsibility. Enterprise liability finds a solvent defendant, but cannot assign blame without violating the exculpation conditions.
  *   **The Philosopher:** Their view is vindicated regarding moral blame, but challenged on legal answerability. The "many hands" move diffuses blame but does not resolve the moral remainder. The demand for punishment fails because punishment requires culpability, which is absent.
  *   **Verdict:** The case opens the Culpability gap fully, the Accountability gap partially (money vs. answerability), and the Forward-looking gap fully.

  **Stipulation and Certification**
  The case risks smuggling the verdict via the Board's "defensible" calculus; if that utilitarian trade-off is rejected morally, negligence returns. However, independent pre-deployment certification strengthens the Board's and Procurer's excuses (reliance on experts), widening the responsibility gap rather than stipulating it away. It makes the exculpation more realistic, not just logical.
