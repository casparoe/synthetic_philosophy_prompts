      *Wait, one nuance:* The colleague said the outlay "could not simply be written off." This implies the outlay *means something* (value created, obligation incurred). The Provost says "Spilt Milk" (Value gone, obligation void).
      So the core conflict is about *recoverability* and *continuity*.

      Let's refine the "Force" and "Subject" for each to be very precise as requested.

