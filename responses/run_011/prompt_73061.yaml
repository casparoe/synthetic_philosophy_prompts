answer: |-
  ### I. A Menu of Claims

  Below are four distinct readings of the proposition "Don't cry over spilt milk," ordered from the least argumentative weight (a near-tautology) to the most (a radical normative claim).

  **1. The Therapeutic Reading**
  *   **Thesis:** Experiencing negative emotion regarding an immutable past event is instrumentally useless.
  *   **Subject Matter:** The appropriateness of an emotional state (affect).
  *   **Scope:** Universal; applies to any agent facing any irreversible past outcome.
  *   **Force:** Admonitory (pragmatic advice on emotional regulation).
  *   **Evaluation:** **Platitude.** No one in the room would deny this. It is trivially true that distress does not reverse physics.
  *   **Conditions for Truth:** Requires only that the event be immutable.
  *   **Argumentative Work:** **Negligible.** It advises the colleague on how to *feel*, not on how to *vote*. It cannot adjudicate a budget allocation.

  **2. The Marginalist Reading**
  *   **Thesis:** Costs that are truly irrecoverable should not enter the calculation of future net benefits.
  *   **Subject Matter:** Rational choice (decision theory).
  *   **Scope:** One-shot decisions involving strictly irrecoverable losses.
  *   **Force:** Normative (a rule for correct calculation).
  *   **Evaluation:** **Substantive.** This is the standard economic definition of the "sunk cost fallacy." It is widely accepted *if* the costs are indeed sunk.
  *   **Conditions for Truth:** Requires that the resources expended yield no residual asset value and cannot be redirected.
  *   **Argumentative Work:** **Moderate.** If true, it dictates that the original donor pledge is zeroed out for the purpose of the *next* dollar spent. It does not, however, dictate that the *structure* built by those dollars has no value.

  **3. The Informational Reading**
  *   **Thesis:** The fact of past expenditure provides no relevant information regarding the current value of the asset or the viability of future options.
  *   **Subject Matter:** The epistemic status of information.
  *   **Scope:** Decisions where asset value is uncertain or dependent on prior investment.
  *   **Force:** Descriptive/Prescriptive (claims about what counts as evidence).
  *   **Evaluation:** **False (generally).** Past investment often signals the quality of the site, the validity of the initial design, or the depth of institutional commitment.
  *   **Conditions for Truth:** Requires that the past expenditure be entirely uncorrelated with the current state of the world (e.g., the money vanished without a trace).
  *   **Argumentative Work:** **High.** This reading allows the Provost to ignore the *shell* as a meaningful variable. It claims the half-built facility is epistemically equivalent to an empty lot.

  **4. The Institutional Amnesia Reading**
  *   **Thesis:** Past commitments (promises, partial constructions) generate no ongoing normative obligations or reputational constraints on future action.
  *   **Subject Matter:** Institutional integrity and relational contracting.
  *   **Scope:** Repeated interactions within a reputation-dependent ecosystem (e.g., higher education fundraising).
  *   **Force:** Normative (a claim about obligation).
  *   **Evaluation:** **False.** Institutions operate in repeated games; abandoning commitments alters the terms on which future partners contract.
  *   **Conditions for Truth:** Requires that the institution exist in a vacuum where trust and reputation have no currency.
  *   **Argumentative Work:** **Maximum.** This is the only reading that fully forecloses the colleague's objection that the outlay "cannot be written off." It asserts that the university owes nothing to the past or the future based on the past.

  ***

  ### II. Application to the Case

  **Which Reading Does the Provost Require?**
  To treat the colleague's objection as "inadmissible" rather than merely "emotional," the Provost must be relying on **Reading 2 (Marginalist)** strengthened by **Reading 4 (Institutional Amnesia).**

  Reading 1 is insufficient because the colleague is not weeping; he is arguing about accounting and obligation. Reading 2 is necessary to exclude the *money* from the spreadsheet. However, Reading 2 alone does not justify ignoring the *structure* or the *reputation*. To declare the question "closed," the Provost implies that the past expenditure creates no residual asset (Reading 3) and no residual obligation (Reading 4).

  **Contact with Case Facts**
  None of the required readings survive contact with the specific features of this dispute:

  1.  **Against Reading 2 (Irrecoverability):** The prompt states the land, foundation, and superstructure "retain real value." The milk is not spilt on the ground; it is in a tipped bucket that can be righted. The costs are not sunk; they are capitalized into an asset. Therefore, the "spilt milk" analogy is factually inapplicable to the physical plant.
  2.  **Against Reading 3 (Informational Void):** The existence of the shell changes the cost-benefit analysis of completion versus new construction. The past spending is highly relevant information regarding the current marginal cost of finishing the project. Ignoring it is not rational; it is an error.
  3.  **Against Reading 4 (Normative Inertia):** The prompt notes that "willingness to abandon half-built commitments plausibly alters the terms on which future partners will contract." The university is not a one-off agent. It exists in time. Treating a donor pledge as "spilt milk" rather than a "broken contract" damages the institution's credit. Reading 4 fails because the scope of the university's operation is a repeated game, not a single transaction.

  **The Home Case**
  It must be stated plainly: The proverb's home case is a **one-off, irrecoverable, purely personal loss.**
  *   **One-off:** The agent does not need to interact with the milk again.
  *   **Irrecoverable:** The milk cannot be gathered.
  *   **Personal:** The emotional state of the agent is the only variable affected.

  **All three conditions fail here.**
  *   The university must interact with this facility for decades.
  *   The value is partially recoverable (the shell).
  *   The stakes are relational (donors, partners, public trust), not merely personal.

  Consequently, **no reading of the proverb applies** to the decision at hand. The only reading that remains available is Reading 1 (The Therapeutic Reading), which admits that while we should not *feel bad* about the donor's death, we must still *account* for the building he paid for.

  ***

  ### III. The Affective Smuggling

  You requested a flag on any reading where the sentence is a claim about feeling rather than choosing.

  **Reading 1 is exclusively affective.** The verb is "cry." The object is an emotional response.
  **The Provost's Move:** The Provost has smuggled an **affective admonition (Reading 1)** in as a **decision-theoretic principle (Reading 2 or 4).**

  By using a phrase that commands emotional regulation ("Don't cry") to settle a question of resource allocation ("Write off the cost"), the Provost creates a category error. If the colleague is not "crying" (expressing useless grief) but "calculating" (assessing residual value and reputational risk), the proverb loses its normative force. It functions rhetorically to shame the objection as emotional, thereby bypassing the need to answer it substantively.

  ***

  ### IV. Summary for the Committee

  To expose the quickness of the Provost's closure without offering budget advice, you may frame the intervention as follows:

  "The proverb 'Don't cry over spilt milk' is being asked to do work it cannot support. It is a rule for managing emotion regarding irrecoverable losses in one-off scenarios. Our situation involves neither irrecoverable losses—we have a valuable shell—nor one-off scenarios—we must maintain credibility with future partners. If we treat the past eight years as 'spilt milk,' we are not being rational; we are claiming the asset does not exist and our reputation does not matter. We should not *cry* about the lost funding, but we must not *ignore* the building it bought."
