      *   **Context:** 8 years ago, commitment made. Half built. Donor died, funding vanished. Completion costs more, serves fewer users. Leaving it unfinished leaves a valuable shell. Provost used "Don't cry over spilt milk" to shut down a colleague's objection about writing off earlier outlays (sunk costs).
      *   **Goal:** Analyze the language/proverb "Don't cry over spilt milk." The user does *not* want budget advice. They want a conceptual map of the claims embedded in that sentence to expose the "quickness" of the Provost's move.
      *   **Requirements:**
          1.  Menu of distinct claims (readings) ranging from near-tautological to radical.
          2.  For each reading: Precise thesis (subject, scope, force), evaluation (platitude, substantive, false), and conditions for truth.
          3.  Identify which reading(s) the Provost *needs* to foreclose the objection.
          4.  Test those readings against the specific case facts (asset value, recoverability, reputational/contractual future).
          5.  Flag affective vs. decision-theoretic claims.
          6.  Order by argumentative weight/work.
          7.  No citations/literature review. Conceptual map only. Tone suitable for a committee meeting.

  2.  **Deconstruct the Proverb ("Don't cry over spilt milk"):**
      *   *Literal meaning:* Milk is spilled. It's gone. Crying won't un-spill it.
      *   *Standard usage:* Don't dwell on past losses you can't change. Focus on the future.
      *   *Economic/Decision Theory equivalent:* Ignore sunk costs.
      *   *Nuance:* Is it about emotion ("don't cry") or action ("don't try to un-spill")? Is it about *all* past costs or just *irrecoverable* ones?

  3.  **Drafting the Readings (Menu of Claims):**
      *   *Reading 1 (The Trivial/Emotional):* It's useless to feel bad about what you can't change. (Affective)
      *   *Reading 2 (The Standard Sunk Cost):* Past expenditures that cannot be recovered should not influence future marginal decisions. (Decision-theoretic)
      *   *Reading 3 (The Strong/Epistemic):* Past expenditures provide *no information* relevant to future decisions. (Epistemic)
      *   *Reading 4 (The Radical/Institutional):* Past commitments create no normative obligation or reputational constraint on future action. (Normative/Institutional)

      *Refining the Order:* The prompt asks to order by "how much argumentative work each can bear."
      *   *Lowest Work:* The emotional admonition (hard to argue against, but doesn't decide the budget).
      *   *Medium Work:* The standard sunk cost fallacy warning (standard econ, but needs careful application).
      *   *High Work:* The claim that past spending is *informationally irrelevant* (stronger, often false).
      *   *Highest Work:* The claim that past commitments have *no normative weight* (radical, required to fully shut down the colleague).

      *Let's structure them from Weakest (Platitude) to Strongest (Radical/False).*

      *   *Reading A (Affective/Therapeutic):* Emotion is wasteful regarding immutable past events.
      *   *Reading B (Decision-Theoretic/Standard):* Irrecoverable costs should not enter the calculation of future net benefits.
      *   *Reading C (Epistemic/Informational):* The fact of past spending tells us nothing about the value of the current asset or future options.
      *   *Reading D (Normative/Institutional):* Past commitments (promises, partial builds) generate no ongoing obligations or reputational stakes.

  4.  **Analyzing Each Reading (Thesis, Scope, Force, Evaluation):**

      *   *Reading A:* Subject: Emotion. Scope: Immutable past. Force: Admonitory. Status: Platitude.
      *   *Reading B:* Subject: Rational Choice. Scope: Irrecoverable costs. Force: Normative. Status: Substantive (True *if* costs are truly sunk).
      *   *Reading C:* Subject: Epistemic Status. Scope: All past data. Force: Descriptive/Prescriptive. Status: False (Past spend signals commitment quality, asset state).
      *   *Reading D:* Subject: Institutional Integrity. Scope: Repeated interactions/Reputation. Force: Normative. Status: False (Reputation matters).

  5.  **Matching Provost's Move to Readings:**
      *   The colleague objected that "earlier outlay could not simply be written off."
      *   The Provost used the proverb to "close the question."
      *   To *close* the question, Reading A isn't enough (colleague isn't crying, he's arguing).
      *   Reading B is the standard defense, but does it apply? The costs aren't fully sunk (there's a shell with value).
      *   Reading C or D is required to say "The past spending is *inadmissible* evidence/obligation."
      *   *Conclusion:* The Provost needs Reading B (strong version) or Reading D to make the stickiness go away.

  6.  **Testing Against Case Facts:**
      *   *Fact 1:* Asset exists (shell). Value depends on completion. -> Contradicts Reading B (costs aren't fully sunk; they created an asset).
      *   *Fact 2:* Portions recoverable. -> Contradicts Reading B (not "spilt," just "container tipped").
      *   *Fact 3:* Reputation/Future Partners. -> Contradicts Reading D (Institutions live in repeated games).
      *   *Result:* The proverb's "home case" is personal, irrecoverable, one-off. This case is institutional, partially recoverable, repeated. The proverb fails.

  7.  **Flagging Affective vs. Decision-Theoretic:**
      *   "Cry" is affective. "Spilt milk" implies irrecoverability.
      *   The Provost used an affective admonition to enforce a decision-theoretic constraint. This is the "smuggling."

  8.  **Drafting the Response (Iterative refinement for tone and precision):**
      *   *Tone:* Analytical, precise, respectful but sharp. Suitable for a Chair to use in a committee.
      *   *Structure:* Follow the prompt's steps strictly.
      *   *Check:* Did I avoid budget advice? Yes. Did I avoid citations? Yes.
