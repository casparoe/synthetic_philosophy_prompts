      *   *Refinement on "Work":* Make sure the ordering reflects how much heavy lifting the claim does to justify the Provost's conclusion. The emotional one does almost no work. The reputational one does the most.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Reading B is the Sunk Cost Fallacy." I need to articulate it as a *claim* the Provost is making. The Provost is claiming the situation *fits* the proverb. So the analysis is about the *conditions of applicability*.

      *Revised Plan for Readings:*
