answer: |-
  **Bottom line**
  I predict the Commission will recommend prohibiting the procedure, driven by the gravity of bodily integrity concerns outweighing the liberty precedents. I recommend we advise the Minister to reject the bill's criminalisation but oppose licensing, effectively maintaining the ban. Our record does not run on pure legal moralism or the harm principle, but on **qualified autonomy**: liberty prevails except where acts violate bodily integrity or commodify the body. On this principle, voluntary amputation of a healthy limb is impermissible. We must recommend prohibition to remain consistent with precedents 4 and 5, distinguishing this from permissible self-harm in precedent 7.

  **The principles our record could be running on**
  Three principles contend for our record. First, **Legal Moralism (Devlin)**: law enforces shared morality. This explains precedents 2 (public lewdness), 4 (kidney sale), and 5 (consensual injury). However, precedent 3 (Sunday trading) is fatal. Devlin accepts majority view only if it reaches the threshold of intolerance and indignation. While our consultation showed majority disapproval, we repealed the ban anyway. If mere moral disapproval cannot sustain Sunday trading laws, it cannot sustain the kidney or injury bans unless those involve more than morality. Furthermore, precedent 7 (smoking) allows significant self-harm, which moralism struggles to justify unless health is itself a moral duty we chose to ignore.

  Second, the **Harm Principle (Mill)**: law prevents harm to others. This cleanly explains 1 (private porn allowed), 3 (trading allowed), and 7 (self-harm allowed). It strains catastrophically against 4 and 5. In both, we banned acts where participants were competent, consenting, and no third party complained. If harm to others is the only warrant, kidney sales and private sexual injury should be lawful. They are not.

  Third, **Qualified Autonomy**: liberty is the default, constrained by bodily integrity and anti-commodification norms. This fits all seven. Liberty explains 1, 3, 6, and 7. The constraints explain 4 (commodification of body parts), 5 (violence violates integrity regardless of consent), and 2 (public order). Precedent 7 sits beside 4 and 5 consistently if we distinguish *consumption* (ingesting toxins) from *structural mutilation* (removing parts or inflicting wounds). We permit adults to ruin their health via consumption but not to dismantle their physical integrity via surgery or violence. This hybrid view alone survives the whole record.

  **The new reference under each**
  Under **Legal Moralism**, the petition is decisive. If the community feels intolerance or indignation, the law should reflect it. The stipulated facts regarding autonomy are irrelevant; the moral feeling prohibits the act. The recommendation would be to criminalise the surgery to uphold the community's sense of bodily sanctity.

  Under the **Harm Principle**, the petition is legally irrelevant. The decisive facts are the patient's competence, the lack of coercion, and the absence of non-consenting victims. Since no harm is inflicted on another, and the patient consents to the harm themselves, the state has no warrant to intervene. The recommendation would be to oppose the bill and perhaps recommend regulation to ensure safety.

  Under **Qualified Autonomy**, the decisive fact is the nature of the act: non-therapeutic removal of a healthy body part. This aligns with precedent 4 (kidney) and 5 (injury), not precedent 6 (tattoos). Tattoos are surface modifications customary in society; amputation is structural dismantling. The psychiatric evidence confirms autonomy, but our record shows autonomy is not absolute where bodily integrity is permanently breached without medical necessity. We would recommend prohibiting the procedure, not because it is immoral, but because it violates the integrity constraint we established in precedents 4 and 5. The petition reinforces the community boundary but does not found it.

  **The closest precedent and where it breaks**
  Precedent 5 (consensual sexual injury) is the closest analogue. In both cases, we confront a competent adult consenting to physical damage for psychological gratification or relief. In precedent 5, we held consent no defence to actual bodily harm. Here, the harm is far greater (permanent disability vs. transient injury). The disanalogy is the context: precedent 5 involved sexual gratification within a relationship, often viewed as volatile; this reference involves a settled identity request assessed over years. However, the legal principle remains identical: the state protects citizens from irreversible physical diminution even against their own will. If we allowed this, precedent 5 becomes untenable; why ban bruising but allow amputation?

  **What we would be committing ourselves to**
  By recommending prohibition, we commit to a principle of **Bodily Integrity Paternalism**. We assert that the body is not wholly the property of the self to dismantle. This forces us to decide against our instincts in future references. First, we would have to ban **elective eye removal** for cosmetic reasons, even if requested by competent adults. Second, we would need to restrict **high-risk cosmetic surgeries** (e.g., extreme limb lengthening) where the health risk outweighs the therapeutic benefit, contradicting the laissez-faire approach of precedent 7. Third, we might be forced to prohibit **surrogacy arrangements** that involve significant physical intrusion, aligning with the anti-commodification logic of precedent 4. We sacrifice absolute bodily sovereignty to maintain a coherent line against mutilation and commodification.

  **The reference that would settle it**
  To discriminate between **Qualified Autonomy** and the **Harm Principle**, the Commission should seek a reference on **regulated consensual duelling**. Suppose two adults wish to settle a dispute via a fistfight to first blood, with medical staff present, no public audience, and no permanent disability expected. The Harm Principle must recommend legality: no third-party harm, full consent. Qualified Autonomy must recommend prohibition: it violates the norm against violence and bodily integrity established in precedent 5, regardless of consent. Our response to duelling would reveal whether we truly prioritise liberty or integrity.

  **The strongest case against my recommendation**
  Proponents of liberty will argue: "Precedents 1, 3, 6, and 7 establish that adult autonomy is paramount. Precedent 4 turned on commodification (sale), which is absent here. Precedent 5 turned on public policy against violence, not self-harm. This is self-harm, akin to smoking (7). To ban this is to say the state owns the citizen's body. You are elevating physical wholeness over mental health, forcing a patient to suffer psychological distress to preserve a limb they do not want. This is inconsistent with our repeal of Sunday trading laws; if we cannot legislate morality, we cannot legislate anatomy."

  I answer: We do not legislate anatomy; we legislate against irreversible mutilation. Smoking damages health but preserves structure; amputation removes structure. We allow people to ruin their health, but not to dismantle their physical agency. This is not morality; it is the preservation of the subject of rights.
