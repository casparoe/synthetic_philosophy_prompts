answer: |-
  # ADVERSARIAL COLLABORATION DRAFT: THE STATUS OF PHENOMENAL REPORTS

  **Date:** October 26, 2023
  **Parties:** Camp A (Illusionist/Functionalist), Camp B (Phenomenal Realist)
  **Facilitator:** Workshop Administration

  ## 1. JOINT CLAIMS
  *The following claims are endorsed by both Camp A and Camp B. Each claim is formulated to be deniable by a plausible third party (e.g., a behaviorist, a dualist, or a hard determinist).*

  1.  **Neural Sufficiency:** Specific patterns of neural activity are causally sufficient to produce verbal reports asserting the presence of internal experience.
  2.  **Introspective Fallibility:** First-person reports regarding the nature, cause, or duration of internal states are subject to error and manipulation.
  3.  **Modeling Efficiency:** Cognitive systems utilize compressed, lossy representations of their own internal states to guide behavior, rather than maintaining perfect isomorphic copies of those states.
  4.  **Report/Content Distinction:** There is a conceptual distinction between the *act* of reporting an experience and the *accuracy* of the content contained in that report.
  5.  **Evolutionary Pressure:** The mechanisms producing reports of experience were shaped by selection pressures for fitness and social coordination, not necessarily for metaphysical accuracy.
  6.  **Explanatory Necessity:** A complete scientific account of the system must explain why the system produces reports of "rich inner shows" regardless of whether such shows ontologically exist.

  ## 2. DISAGREEMENTS TABLE
  *Where the camps diverge. Formulations are written in the voice of each camp to preserve the sharp edge of the disagreement.*

  | Issue | Camp A Formulation (Illusionism) | Camp B Formulation (Realism) | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Ontology of "Seeming"** | "Seeming" is a functional judgment. When a subject says "it seems red," they are executing a classification routine on a simplified self-model. There is no extra entity called a "seeming" over and above the judgment. | "Seeming" is a primitive datum. Even if the judgment is false, the *appearance* itself exists. You cannot have an appearance without something to which it appears. | **Substantive.** A denies the existence of the target B is pointing at. B claims A's denial is self-undermining. |
  | **The Meaning of "Illusion"** | An illusion is a false model. A desktop icon looks like a folder but is not a folder. Similarly, experience looks like a non-physical show but is just neural processing. The "look" is the error. | An illusion is a misrepresentation of a real property. You can be illusioned about the *nature* of a thing, but not about the *existence* of the thing appearing. An illusion of experience presupposes experience. | **Partly Terminological / Substantive.** Verbal dispute over "illusion," but substantive regarding whether the "appearance" requires a real substrate. |
  | **The Explanatory Gap** | The gap closes when we explain the mechanism of the self-model. Once we explain why the system *says* there is a mystery, the mystery dissolves. | The gap remains after the mechanism is explained. Explaining why the system *says* "it hurts" does not explain why there is *pain* rather than just the report. | **Substantive.** A believes the "why is it like anything" question is a category error. B believes it is the primary data point. |
  | **Epistemic Self-Undermining** | The theory is not self-undermining. The brain can correctly model its own error. We can truthfully report that our introspection is misleading. | The theory is self-undermining. If all introspection is an illusion, the intuition that leads to the theory is also an illusion, removing the justification for believing the theory. | **Substantive.** Disagreement on whether a system can reliably diagnose its own unreliability without a reliable baseline. |

  ## 3. CRUXES
  *Specific sub-questions where resolution would force a position shift. Both camps agree these are the battlegrounds.*

  ### Crux 1: The Fake Neural Decoder
  **Design:** Subjects perform a hard attentional task in a dim room (low visual input). A screen displays a "Neural Decoder" reading their visual cortex. The decoder is fake.
  **Condition:** At T1, the decoder displays "Vivid Visual Imagery Detected" (High Confidence).
  **Measurement:** At T2, subjects rate their concurrent visual phenomenology.

  **Camp A Prediction:**
  There will be a statistically significant increase in reported phenomenology compared to a control group (no decoder). The external signal is integrated into the self-model, updating the "dashboard." The subject does not lie; their model of their own state has been genuinely altered by the feedback loop.

  **Camp B Prediction (Strong Form):**
  Reports may increase due to compliance or demand characteristics, but the *phenomenal character* of the experience will not change. The subject may *say* they saw more, but if pressed on the qualitative nature (e.g., via forced-choice discrimination tasks unrelated to the report), performance will not match the report. The "seeming" is robust against external falsehoods.

  **What Camp B Owes Camp A if A's Prediction Holds:**
  If subjects not only report higher intensity but also demonstrate behavioral markers consistent with that intensity (e.g., faster reaction times to visual probes that match the "imagery" location), B must concede that the "seeming" is constructible *ex nihilo* by top-down modeling.
  *Specific Cost:* B cannot dismiss this as "confabulation" if the behavioral data aligns with the phenomenological report. If the fake signal alters the *functional profile* of the experience in a way indistinguishable from "real" imagery, B must admit the "real" imagery is just that functional profile.

  **Necessary Controls:**
  1.  **The Contradiction Condition:** The decoder reports "No Imagery Detected" while the subject is actively trying to imagine.
      *   *A Prediction:* Subjects will doubt their own memory/feeling. Reports of imagery will drop.
      *   *B Prediction:* Subjects will trust their "seeming" over the machine. Reports will remain stable.
  2.  **The Incentive Control:** Subjects are paid for accuracy, not for matching the machine. This isolates compliance from genuine belief/model-update.

  ### Crux 2: Machines and Attribution
  **Observation:** Humans attribute experience to chatbots effortlessly. Chatbots self-attribute experience effortlessly.

  **Camp A Position:**
  This is the predicted baseline. Self-attribution is a cheap output of any system capable of modeling its own inputs and outputs. If a text predictor can generate "I feel confused," the mechanism for "feeling" is just text prediction and self-modeling. There is no extra ingredient in humans that the bot lacks.

  **Camp B Position:**
  This demonstrates human susceptibility to error (anthropomorphism), not the absence of a difference. The bot simulates the *report* of experience without the *reality*. The ease of attribution proves the *concept* is shallow, not that the *phenomenon* is shallow.

  **Settlement Conditions:**
  This crux cannot be settled without building the thing. Behavioral equivalence is insufficient for B; architectural equivalence is insufficient for A (if B claims the architecture is still "just syntax").
  *   **What Camp A needs to see:** A system built on non-biological substrate that passes all adversarial tests for consciousness, where B concedes that denying it experience is dualism.
  *   **What Camp B needs to see:** A system that passes all tests, where A concedes that we still do not know if the "lights are on."
  *   **Interim Test:** If we identify a specific architectural feature in humans (e.g., specific recurrent global broadcasting) and replicate it in silicon:
      *   If the silicon system claims consciousness, **A** counts this as victory (function replicated).
      *   **B** counts this as a sophisticated zombie (structure replicated, ontology missing).
      *   *Move Condition:* B moves only if they can specify a physical test that distinguishes the silicon from the human *other than* "the human is biological." A moves only if they admit functional replication might still leave out the "what it's like."

  ## 4. DISCONFIRMING EVIDENCE
  *What would force each camp to abandon or significantly revise their position.*

  **Camp A (Illusionism):**
  *   **Falsifier:** Evidence that introspective reports track a non-functional property that has causal power *independent* of the computational model.
  *   **Example:** If a subject can discriminate between two stimuli based *solely* on a reported phenomenal difference that correlates with no difference in neural processing, behavioral output, or information availability.
  *   **Honesty Check:** Camp A risks unfalsifiability if they classify *all* counter-evidence as "part of the illusion." To avoid this, A must commit to accepting data where the "illusion" model fails to predict behavioral outcomes (as in Crux 1). If the self-model theory cannot predict the reports better than chance, A must fold.

  **Camp B (Realism):**
  *   **Falsifier:** A demonstration that the concept of "seeming" is logically incoherent or that a complete functional explanation leaves no logical room for an additional ontological ingredient.
  *   **Example:** If it is proven that "what it is like" is logically reducible to "what the system reports" without remainder, such that positing an extra "feeling" is a category error (like positing a "vital force" alongside biology).
  *   **Honesty Check:** Camp B risks unfalsifiability via the "Hard Problem" shield. B can always claim, "You explained the function, but not the feeling." To avoid this, B must specify a condition under which a functional explanation *would* suffice. If B's position is compatible with *any* possible physical account of the brain, it is not a scientific hypothesis but a metaphysical axiom. B must identify a specific structural feature that, if absent in a behaving system, would prove the absence of experience.

  ***

  **Signatures:**

  _________________________ (Camp A Representative)

  _________________________ (Camp B Representative)

  _________________________ (Facilitator)
