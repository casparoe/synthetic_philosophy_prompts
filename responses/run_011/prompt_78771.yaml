  Ok so this has been bugging me for like a month and I don't have the vocabulary for it.

  My coworker Dev runs these little bets at lunch with poker chips in jars. Real money, ten bucks a pop. He's the kind of guy who has a spreadsheet for his spreadsheets. I do backend stuff, never took an econ or a philosophy class, so I genuinely can't tell whether what he's doing is a known thing with a name or just him being inconsistent.

  The record so far, all four for real:

  1) I count out 45 red chips and 55 black into jar A, in front of him. Jar B is 100 chips with a red/black split neither of us knows — sealed up by our friend Priya, and we all agree it's some one fixed split and she isn't rigging anything, we just don't know it. Ten bucks if a chip pulled blind is red. He takes A.

  2) Same two jars, identical, except now the ten bucks pays on black. He takes A again. I said those two can't both be right if the jar has one fixed split in it, and he goes "yeah, probably" and changes the subject.

  3) Jar C: 50 red, 25 black, 25 white, counted out loud. Jar D: 50 red counted out loud, plus 50 more chips that are black-or-white in some split nobody knows. Pays on red: he genuinely doesn't care which jar. Pays on black: takes C. Pays on "black or white": doesn't care again.

  4) Jar E: 100 chips, and I tell him it's either exactly 70 red or exactly 30 red, I flipped a coin in the hallway and I'm not saying which. Jar F: counted out, 25 red, 75 black. Pays on red. He takes E without even pausing, and when I ask why he just says "the numbers are the numbers."

  Thursday's is already agreed on. Jar G: 100 chips, either exactly 80 red / 20 black or exactly 20 red / 80 black, hallway coin flip again, undisclosed. Jar H: I count it out in front of him, 40 red, 60 black. Ten bucks pays on red. He picks the jar, I pull one chip blind.

  What I'm after:

  - Which jar does he take Thursday? Give me a lean and a rough confidence, not a hedge.
  - I can sort of see two things he might be doing. Either he's a pessimist who only ever looks at the worst case a jar could hand him, or he refuses to bet at all unless he can turn what I told him into an actual number, and when I hand him a short list of possibilities he just averages them. But I'm pretty sure there's more options then those two, and I'm not even sure both of mine survive all four verdicts. So: lay out every rule you can find that's consistent with 1 through 4 — check each one against all four, not just the easy ones — and say what each predicts for Thursday. If a rule has an actual term in some field, give me the term so I can go look it up; I don't want references or a reading list, just the words to search.
  - Which one do you actually think it is, and what in the record tips it? Related: which of the four verdicts is doing the most work? If one of them is noise (he was definitely in a hurry on number 4) does the answer flip?
  - Then design me one more pair of jars for next week that would settle it between your top two candidates, and say what each of those two predicts for it, so I can actually run the experiment instead of arguing.
