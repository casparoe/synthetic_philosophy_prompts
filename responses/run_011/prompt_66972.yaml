  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** 18 upper-level philosophy of biology students. Knowledgeable about evolution/fitness/game theory, but algebra-averse.
      *   **Topic:** Units of Selection (specifically Hard vs. Soft Selection and the resulting dynamics of Group vs. Individual selection).
      *   **Constraint 1 (Pedagogical):** No algebra in class. Experiential learning (simulation) rather than lecture/reading debate.
      *   **Constraint 2 (Mechanism):** The core mechanism *must* be the Hard vs. Soft Selection distinction.
          *   Round 1 & 2: Hard Selection (Group productivity matters). Cooperation should thrive.
          *   Round 3: Soft Selection (Fixed quota per group). Cooperation should collapse.
          *   *Crucial:* The switch must be disguised so they don't anticipate it, but not deceptive enough to feel like a lie in debrief.
      *   **Constraint 3 (Logistics):** 75 minutes, 1 instructor, no TA. Materials: Poker chips, index cards, whiteboard.
      *   **Constraint 4 (Output Requirements):** Roles/structure, Payoff scheme (with arithmetic proof), Timeline, Debrief (mapping game to theory + distinguishing settled vs. contested), Troubleshooting, Limitations of the model.
      *   **Constraint 5 (Philosophical Nuance):** Distinguish between bookkeeping (settled) and interpretation (contested). Do not flatten the debate.

  2.  **Deconstruct the Core Mechanism (Hard vs. Soft Selection):**

      *   *Hard Selection:* Group output determines representation in the next generation. If Group A produces 100 units and Group B produces 50, Group A contributes twice as many individuals to the global pool. This allows between-group selection to overcome within-group selection.
      *   *Soft Selection:* Each group contributes a fixed number (e.g., top 3 survivors from *each* group) regardless of total group output. This maximizes within-group selection. Defectors always beat Cooperators within a group, and since every group sends representatives, Defectors take over the global pool.
      *   *The Switch:* How to disguise this?
          *   *Idea:* Change the "Resource Pool" rules.
          *   *Round 1 & 2:* "Expansion Phase." The total number of survivors depends on total chips earned by the group. (Hard)
          *   *Round 3:* "Scarcity Phase" or "Regulation." A new rule is introduced: "To ensure fairness/stability, each region must contribute exactly $N$ survivors to the next generation, drawn from those who met a minimum threshold." (Soft).
          *   *Disguise:* Frame it as an environmental shift (carrying capacity reached) rather than a selection mechanism change. Use a "Regulation Card."

  3.  **Design the Simulation:**

      *   **Class Size:** 18 students.
      *   **Groups:** 3 groups of 6 students each. (Small enough to manage, large enough for variance).
      *   **Roles:** No specific roles (like "alpha"), just strategies.
      *   **Strategies:** Cooperate (C) or Defect (D).
      *   **Payoffs:** Needs to be simple arithmetic.
          *   Base endowment: 5 chips.
          *   Action: Put 0 (Defect) or 2 (Cooperate) into a pot.
          *   Pot multiplier: 1.5x (standard Public Goods Game).
          *   Distribution: Pot split equally among group members.
          *   *Wait, this is standard PGG.* In standard PGG, D always beats C within a group. For C to win in Hard Selection, the *group total* must determine survival numbers.
      *   **Revised Payoff/Survival Mechanism:**
          *   Each student starts with 10 "Fitness Tokens."
          *   Decision: Contribute 0 or 4 tokens to Group Pot.
          *   Group Pot is doubled (multiplier = 2 for simplicity, or 1.5 to ensure temptation). Let's use Multiplier 1.5 per contributor to ensure D has advantage within group.
          *   Actually, let's make it simpler.
          *   *Individual Score* = (Endowment - Contribution) + (Group Pot / Group Size).
          *   *Group Score* = Sum of Individual Scores (or just Total Pot).
          *   *Hard Selection:* Number of survivors from Group $i$ $\propto$ Group Score $i$.
          *   *Soft Selection:* Number of survivors from Group $i$ = Fixed Constant (e.g., 3), provided they have positive score.
      *   *Arithmetic Check:*
          *   Group size $n=6$.
          *   Endowment $E=10$. Contribution $c=4$. Multiplier $m=2$ (Total pot returned is $2 \times \text{total contributed}$).
          *   If all C: Each contributes 4. Pot = $6 \times 4 \times 2 = 48$. Each gets $48/6 = 8$. Net = $10 - 4 + 8 = 14$. Group Total = $14 \times 6 = 84$.
          *   If 5 C, 1 D: C contributes 4. D contributes 0. Pot = $5 \times 4 \times 2 = 40$. Share = $40/6 = 6.67$.
              *   C Net = $10 - 4 + 6.67 = 12.67$.
              *   D Net = $10 - 0 + 6.67 = 16.67$.
              *   D beats C within group.
              *   Group Total = $(5 \times 12.67) + 16.67 = 63.35 + 16.67 = 80.02$. (Lower than 84).
          *   If all D: Pot = 0. Net = 10. Group Total = 60.
          *   *Hard Selection:* All C group (84) sends more survivors than Mixed (80) or All D (60). If the reproduction rate is high enough, C types can spread globally despite losing locally.
          *   *Soft Selection:* Each group sends top 3 survivors.
              *   All C Group: Top 3 have score 14.
              *   Mixed Group: Top 3 are likely the Defectors (16.67) or high C's. Defectors definitely get in.
              *   All D Group: Top 3 have score 10.
              *   *Wait, Soft Selection usually implies competition is strictly within-group.* If every group sends 3, the global pool is filled by the winners of each group. Since D always beats C within a group, D will dominate the survivors list, even if C groups had higher total productivity.
              *   *Correction:* In strict soft selection, the *number* of survivors is fixed per group. So the All-C group produces 3 survivors (score 14). The Mixed group produces 3 survivors (mostly Ds, score 16.67). The All-D group produces 3 survivors (score 10).
              *   If the next generation is formed by pooling these survivors, the Ds from the Mixed group have higher fitness than Cs from the All-C group. Ds will increase in frequency.
              *   *Crucial:* In Hard Selection, the All-C group might send 6 survivors, while the All-D group sends 2. This allows C to spread. In Soft Selection, both send 3. The relative frequency of C drops because Ds outcompete Cs within the mixed groups, and the high-performing C groups don't get to "export" more individuals.

  4.  **Disguising the Switch:**

      *   Round 1 & 2: "The Expansion Era." The university (or ecosystem) has unlimited resources. Your group's total chip count determines how many of you get to "graduate" (survive) to the next round. (Hard).
      *   Round 3: "The Carrying Capacity Crisis." A "Regulation Card" is played. "Resources are capped. To prevent overcrowding, each group is now allocated exactly 3 graduation slots, regardless of total output. Slots go to highest individual scorers." (Soft).
      *   *Is this a lie?* No, it's a change in environmental parameters which alters the selection regime. This is biologically plausible (density dependence).

  5.  **Drafting the Plan:**

      *   **Setup:** 3 Groups of 6. Poker chips = Fitness. Index cards = Decision (C/D).
      *   **Timeline:**
          *   0-10: Setup & Rules (Hard).
          *   10-25: Round 1 (Hard).
          *   25-40: Round 2 (Hard) + Migration/Replication.
          *   40-45: The "Crisis" (Rule Change).
          *   45-60: Round 3 (Soft).
          *   60-75: Debrief.
      *   **Arithmetic:** Need to ensure the numbers are robust against "screwing around." If 2 students refuse to play, does it break? Need a buffer.
      *   **Debrief:** Map the "Graduation Slots" to $w_{group}$ vs $w_{individual}$. Discuss Price Equation (conceptually). Address the "Realism" limitations.
      *   **Contested vs. Settled:** Settled: The math of variance partitioning. Contested: Whether soft selection is the norm, whether MLS is distinct from kin selection, historical significance.

  6.  **Refining the Arithmetic (Mental Check):**

      *   Need to make sure Hard Selection *actually* allows Cooperation to grow.
      *   Let $N_{survivors} = \text{Group Score} / K$.
      *   If Group C (All Coop) Score = 84. Group D (All Defect) Score = 60.
      *   Ratio = 1.4.
      *   If we start with 1 C-group and 2 D-groups.
      *   Round 1 Hard: C-group sends 84 units of "offspring". D-groups send 60 each. Total pool = 204. C-fraction = 84/204 = 41%. (Started at 33%). C grew.
      *   Round 3 Soft: Each group sends 3 survivors.
      *   C-group sends 3 Cs.
      *   D-groups send 3 Ds each.
      *   Total survivors = 9. C-fraction = 3/9 = 33%. (Stagnant or declining if mixed groups exist).
      *   If Mixed Groups exist (which they will):
          *   Mixed Group (3C, 3D).
          *   C Score = 12.67. D Score = 16.67.
          *   Top 3 survivors are the 3 Ds.
          *   So Mixed Group exports 0 Cs.
          *   All C Group exports 3 Cs.
          *   All D Group exports 3 Ds.
          *   If we have 1 All-C, 1 Mixed, 1 All-D.
          *   Survivors: 3 C, 3 D (from mixed), 3 D (from All-D). Total 9. C-fraction = 33%.
          *   But within the Mixed group, Cs died out. The *global* frequency might hold steady if All-C groups persist, but any drift towards mixing kills Cs. In Hard selection, the All-C group grows *larger* than the others, swamping the Ds. In Soft, they stay the same size.
      *   *Risk:* If students in All-C groups realize they are "suckers" compared to Ds in other groups (even if their group wins), they might defect in Round 3. That's actually *good* for the demo. It shows the pressure.
      *   *Risk:* Students in Round 1 might not realize they should cooperate. I need to incentivize them to try to win. "Winning group gets bragging rights/chocolate."

  7.  **Addressing the "Algebra Aversion":**

      *   Do not show formulas. Show chips.
      *   Whiteboard: Draw the groups. Write the total chips.
      *   "Survival Tokens": Hand out physical tokens for survivors.
      *   Round 1 & 2: Count group chips. Give 1 Survival Token per 10 Group Chips (example).
      *   Round 3: Hand out exactly 3 Survival Tokens to each group. "New Rule."

  8.  **Addressing the "Disguise":**

      *   Don't call it Soft Selection. Call it "Quota System" or "Carrying Capacity Cap."
      *   Justification: "The ecosystem is full."
      *   This is biologically accurate (density dependence leads to soft selection), so it's not a lie.

  9.  **Troubleshooting:**

      *   *Problem:* Students talk across groups. *Fix:* Physical separation.
      *   *Problem:* Math errors slow it down. *Fix:* Instructor calculates totals, or assign a "scribe" per group.
      *   *Problem:* Students refuse to defect in Round 3 because they "know" cooperation is good. *Fix:* Remind them the goal is *individual* survival (graduation).
      *   *Problem:* The "Flip" isn't dramatic. *Fix:* Ensure the Hard Selection multiplier is generous enough that C-groups visibly outproduce D-groups.

  10. **Philosophical Nuance (The "Contested" part):**

      *   Must emphasize: The *math* of variance partitioning (Price Equation) is settled.
      *   Contested: Is "Group Selection" a *causal* explanation or just a *description*? (The "Lloyd" vs "Sober/Wilson" debate).
      *   Contested: Is soft selection the biological default? (Wallace vs. others).
      *   Contested: Human cultural evolution (dual inheritance).

  11. **Final Review against Constraints:**

      *   18 students? Yes (3x6).
      *   75 mins? Yes.
      *   No algebra? Yes (chips).
      *   Hard/Soft switch? Yes (Quota).
      *   Disguised? Yes (Environmental shift).
      *   Debrief nuance? Yes.

  12. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Payoff:* Make sure the temptation to defect is clear. If I contribute 4 and get 3 back from the pot, I lose. If I contribute 0 and others contribute, I gain.
      *   *Calculation:* Endowment 10. Contribute 5. Pot multiplier 2.
      *   All C: Pay 5, get back $(6 \times 5 \times 2) / 6 = 10$. Net $10-5+10 = 15$.
      *   All D: Pay 0, get back 0. Net 10.
      *   Mixed (1 D, 5 C): Pot = $5 \times 5 \times 2 = 50$. Share = $50/6 = 8.33$.
      *   C Net: $10 - 5 + 8.33 = 13.33$.
      *   D Net: $10 - 0 + 8.33 = 18.33$.
      *   D beats C (18.33 > 13.33).
      *   Group Total (All C): $15 \times 6 = 90$.
      *   Group Total (Mixed): $(5 \times 13.33) + 18.33 = 66.65 + 18.33 = 84.98$.
      *   Group Total (All D): $10 \times 6 = 60$.
      *   Hard Selection: All C group produces 90 fitness units. Mixed produces 85. All D produces 60. C groups grow faster.
      *   Soft Selection: Each group sends top 3.
      *   All C: 3 Cs (score 15).
      *   Mixed: 3 Ds (score 18.33). (Cs eliminated).
      *   All D: 3 Ds (score 10).
      *   Result: Cs only come from All-C groups. Ds come from everywhere. If any group becomes mixed, Cs are purged locally. In Hard selection, All-C groups can numerically overwhelm Mixed groups. In Soft, they cannot expand their representation beyond the quota.
      *   *Wait, one nuance:* In Soft Selection, if All-C groups exist, they *do* send Cs. The frequency of C doesn't necessarily drop to zero immediately, but it cannot *increase* via group productivity differences. It can only decrease via within-group selection. In Hard selection, between-group selection can *increase* C frequency. This is the key.
      *   *Refinement for the Demo:* In Round 1 (Hard), ensure the C-groups actually get *more* survivors than D-groups. In Round 3 (Soft), ensure they get the *same* number, while the Ds inside the mixed groups outcompete the Cs.

      *   *Disguise:* "Round 1 & 2: Frontier Phase (Unlimited). Round 3: Settlement Phase (Regulated)."

      *   *Debrief:* Be careful not to say "Group Selection is real." Say "Variance partitioning shows..." and "Interpretations differ on..."

      *   *Limitations:* Intentionality. Students choose; genes don't.

      *   *Let's write it.*
answer: |-
  Here is a complete lesson plan designed for your specific constraints. It prioritizes the Hard/Soft selection switch as the mechanical core, disguises it as an environmental shift, and reserves the philosophical heavy lifting for a nuanced debrief.

  # Simulation: "The Frontier and The Quota"

  ## 1. Logistics and Setup

  *   **Class Size:** 18 Students.
  *   **Group Structure:** 3 Groups of 6 students. Arrange desks/tables so groups cannot see each other's cards or chips.
  *   **Materials:**
      *   **Poker Chips:** ~200 total (represent "Fitness").
      *   **Index Cards:** 2 per student (marked **C** and **D**).
      *   **Survival Tokens:** 30 distinct items (coins, distinct colored chips, or slips of paper) to represent "slots in the next generation."
      *   **Whiteboard:** Divided into three columns (Group 1, Group 2, Group 3).
  *   **Instructor Load:** You are the "Environment." You collect decisions, calculate payouts, and distribute Survival Tokens.

  ## 2. The Payoff Scheme (The Arithmetic)

  We need a Public Goods Game structure where Defection wins *within* a group, but Cooperation wins *between* groups.

  *   **Endowment:** Every student starts each round with **10 Fitness Chips**.
  *   **Decision:** Secretly choose **C** (Cooperate) or **D** (Defect).
      *   **C:** Put **5 chips** into the Group Pot.
      *   **D:** Put **0 chips** into the Group Pot.
  *   **Multiplier:** The Group Pot is multiplied by **2.0**, then split equally among all 6 group members.
  *   **Final Score:** (Endowment - Contribution) + (Share of Pot).

  **The Math (for your reference, do not show students):**

  | Group Composition | Individual Contribution | Pot Size ($5 \times \#C \times 2$) | Share per Person | **C Score** | **D Score** | **Group Total** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **All C (6C)** | 5 | 60 | 10 | **15** | — | **90** |
  | **Mixed (5C, 1D)** | 5 / 0 | 50 | 8.33 | **13.33** | **18.33** | **85** |
  | **Mixed (3C, 3D)** | 5 / 0 | 30 | 5.00 | **10.00** | **15.00** | **75** |
  | **All D (6D)** | 0 | 0 | 0 | — | **10** | **60** |

  **Why this works:**
  1.  **Within-Group:** A Defector always scores higher than a Cooperator in the same group (18.33 > 13.33; 15 > 10). Rational self-interest dictates Defection.
  2.  **Between-Group:** An All-C group produces 90 total chips. An All-D group produces 60. A Mixed group is in between.
  3.  **The Flip:**
      *   **Hard Selection:** Survival slots are proportional to *Group Total*. All-C groups send more survivors than All-D groups. Cooperation can spread globally.
      *   **Soft Selection:** Survival slots are *fixed per group*. All-C groups send the same number as All-D groups. Since Ds beat Cs locally, Ds dominate the survivor pool.

  ## 3. The Timeline (75 Minutes)

  ### 0:00 – 0:10: Setup and "Frontier" Rules
  *   Seat students. Distribute 10 chips and C/D cards to each.
  *   **Narrative:** "You are founders in a new ecosystem. Resources are currently abundant. Your goal is to ensure your lineage continues."
  *   **Rule 1 (Hard Selection):** "At the end of the round, I will sum your group's total chips. For every **30 chips** your group generates, **one member** receives a **Survival Token**. (Cap at 6 tokens per group to save time)."
      *   *Note:* With the math above, All-C (90) gets 3 tokens. Mixed (85) gets 2 tokens. All-D (60) gets 2 tokens.
      *   *Correction for maximum effect:* Let's make the threshold lower so differences are starker. **1 Token per 20 chips.**
      *   All-C (90) = **4 Tokens**.
      *   Mixed (85) = **4 Tokens**. (Too close).
      *   *Revised Threshold:* **1 Token per 15 chips.**
      *   All-C (90) = **6 Tokens** (Everyone survives).
      *   Mixed (85) = **5 Tokens** (1 person dies).
      *   All-D (60) = **4 Tokens** (2 people die).
      *   *Instruction:* "If your group earns more tokens than there are people, you can choose who survives. If fewer, the lowest scorers are eliminated." (This forces them to care about individual score *and* group total).
  *   **Round 1 Play:** 3 minutes to discuss strategy (within group only), 1 minute to submit cards. You calculate and announce results. Distribute tokens.
  *   **Replication:** Students without tokens sit out. Students with tokens "clone" themselves (invite a neighbor who sat out to rejoin, or if everyone survives, the group stays intact). *Simpler:* Just reset chips. If a group earned 6 tokens, they start next round with 6 "extra" chips or simply note they are "Thriving."
      *   *Better for flow:* Keep groups intact. If a group earns 6 tokens, they are "Safe." If they earn 4, they are "At Risk." Tell them: "Next round, groups with more tokens get to recruit members from struggling groups." (This simulates migration/differential growth without complex reshuffling).

  ### 0:10 – 0:35: Rounds 1 & 2 (Hard Selection)
  *   **Round 1:** Run the game.
      *   *Expected Outcome:* Groups that cooperate will have high totals. Groups that defect will have low totals. Some individuals in mixed groups will have high scores (Defectors) but their group might lose a slot.
      *   *Debrief Moment 1:* Ask the "At Risk" groups why they struggled. They will blame low cooperation. Ask the Defectors in successful groups how they did. They did best individually.
  *   **Round 2:** Repeat. Allow successful groups to "recruit" (swap a member from a failing group).
      *   *Effect:* Cooperators cluster together. Defectors cluster together.
      *   *Outcome:* By the end of Round 2, you should have at least one "Super Group" (All C) and one "Crash Group" (All D). The Super Group is visibly larger/richer.
      *   *Student Mood:* They feel smug. "Cooperation works if you stick together." They think they have solved the problem.

  ### 0:35 – 0:40: The "Crisis" (The Disguised Switch)
  *   **Narrative:** "The ecosystem has reached carrying capacity. Resources are no longer expanding. The University (Environment) is imposing a **Quota System** to prevent overcrowding."
  *   **New Rule (Soft Selection):** "Effective immediately, **every group contributes exactly 3 survivors** to the next generation, regardless of total group output. The 3 individuals with the highest *individual* scores in your group receive the tokens."
  *   **Disguise Check:** This is not a lie; it is a change in environmental density dependence. It feels like a "new regulation," not a change in the physics of the game.
  *   **Instruction:** "Play Round 3. Remember, only your individual score matters for the quota."

  ### 0:40 – 0:55: Round 3 (Soft Selection)
  *   **Play:** Run the round.
  *   **The Trap:**
      *   In the "Super Group" (All C): Everyone scores 15. 3 are chosen at random.
      *   In the "Mixed Group": Defectors score 18.33, Cooperators 13.33. The Defectors take all 3 slots. Cooperators are eliminated.
      *   In the "Crash Group" (All D): Everyone scores 10. 3 are chosen.
  *   **Outcome:** Even though the Super Group produced more total wealth (90 chips vs 75 vs 60), they do not get to send more descendants. The Mixed group sends only Defectors. The global frequency of Cooperators drops sharply.
  *   **Visual:** On the whiteboard, tally the survivors.
      *   Round 2 (Hard): 12 Cooperators, 6 Defectors (Hypothetical).
      *   Round 3 (Soft): 3 Cooperators, 15 Defectors.
  *   **Student Reaction:** Confusion/Betrayal. "But we produced more!" "It's not fair."

  ### 0:55 – 1:15: The Debrief (The Philosophy)

  **Part 1: The Bookkeeping (Settled Science)**
  *   **Map the Game:**
      *   *Individual Score* = Within-Group Selection ($w_{ind}$).
      *   *Group Total* = Between-Group Selection ($w_{grp}$).
      *   *Hard Selection* = $w_{grp}$ weights the contribution to the next generation.
      *   *Soft Selection* = $w_{grp}$ is capped; only $w_{ind}$ matters.
  *   **The Price Equation (Conceptual):** Explain that evolutionary change is the sum of within-group change (always negative for C) and between-group change (positive for C).
      *   In Rounds 1-2, Between-Group > Within-Group. C increases.
      *   In Round 3, Between-Group = 0 (because quotas are equal). Within-Group dominates. C decreases.
  *   **Settled Point:** There is no mystery here. It is a mathematical fact about variance partitioning. If you cap between-group variance (Soft Selection), you kill group-level adaptation.

  **Part 2: The Interpretation (Contested Philosophy)**
  *   *Explicitly state:* "The math we just did is not debated. What follows *is*."
  *   **Question 1: Is 'Group Selection' a distinct cause?**
      *   *View A (Sober/Wilson):* Yes. The quota change altered the causal structure. Multi-Level Selection (MLS) is a real framework.
      *   *View B (Gene's Eye/Kin Selection):* No. This is just kin selection with different parameters. The 'group' is just a proxy for genetic relatedness. The 'switch' was just a change in relatedness structure.
      *   *Your Stance:* Present both. Ask students if the *explanation* changed or just the *description*.
  *   **Question 2: Is Soft Selection the Biological Default?**
      *   *View A:* Most natural populations are density-regulated (Soft). Therefore, group selection is rare/weak in nature.
      *   *View B:* Hard selection occurs during expansions, bottlenecks, or extinction events. It matters enough to drive major transitions (e.g., multicellularity).
  *   **Question 3: The Human Exception?**
      *   Humans impose soft selection (welfare, quotas) or hard selection (war, economic collapse) culturally. Does cultural group selection bypass the biological constraints we just felt?

  ## 4. Troubleshooting: What Will Go Wrong

  1.  **Problem:** Students in Round 1 defect immediately, ruining the "Cooperation Wins" setup.
      *   **Fix:** In the instructions, emphasize: "In this phase, group survival is the priority. If the group fails, *everyone* loses tokens." (This is technically true in the Hard Selection rule where low totals mean fewer slots).
  2.  **Problem:** Math errors slow the game.
      *   **Fix:** Do not make them calculate. They hand you cards. You (or a pre-prepared spreadsheet on a laptop projected) announce the totals. "Group 1: 90 chips. Group 2: 60 chips." Keep the flow fast.
  3.  **Problem:** Students feel "lied to" in Round 3.
      *   **Fix:** In the debrief, validate their feeling. "You felt a change in the rules. That is exactly what 'Soft Selection' feels like to an adaptation. The environment stopped rewarding productivity and started rewarding local dominance."
  4.  **Problem:** "Screw Around" Factor (Students refusing to play rationally).
      *   **Fix:** If a group goes All-C in Round 3 despite the incentive to Defect, point it out. "This group resisted the selection pressure. In biology, this requires a mechanism (policing, kin recognition). Without that mechanism, evolution says they should die out. Did they?"

  ## 5. Limitations of the Model (Crucial for Debrief)

  You must explicitly list what this simulation *cannot* do, so they don't leave with a false picture.

  1.  **Intentionality:** Students *chose* strategies based on reasoning. Genes do not choose; they are filtered. The "pressure" they felt was psychological, not causal.
      *   *Correction:* Remind them that in nature, the Cooperators don't "realize" they are being eliminated; they just leave fewer offspring.
  2.  **Time Scale:** We did 3 rounds in 40 minutes. Real soft selection pressures operate over millennia.
  3.  **Group Boundaries:** In the game, groups were fixed by desks. In nature, group boundaries are porous and fuzzy.
  4.  **The "Good of the Group":** The game makes it look like groups "want" to maximize chips. Groups have no agency. The "Group Success" was just an aggregate statistic.
      *   *Philosophical Point:* This touches on the "Adaptationist" debate. Is the group an adapted unit, or just a collection of adapted individuals?

  ## 6. Instructor's Note on Consensus vs. Contention

  *In your debrief, use this script to maintain the boundary:*

  > "Here is what is **settled**: The arithmetic of the Price Equation. We proved that if you cap between-group variance (Soft Selection), traits that are costly to the individual but beneficial to the group cannot evolve. That is bookkeeping.
  >
  > Here is what is **contested**: Whether we should call the Hard Selection phase 'Group Selection' or just 'Kin Selection with high relatedness.' Some of your authors (e.g., West & Gardner) will tell you 'Group Selection' is a confusing term for a specific set of kin parameters. Others (e.g., Wilson & Sober) will tell you it identifies a distinct causal process.
  >
  > Here is what is **my view** (Instructor): [Insert your view here, e.g., 'I think the distinction is heuristically useful even if mathematically equivalent.']
  >
  > Here is what is **unknown**: How often Hard Selection actually occurred in the history of life. We know it *can* work (we just did it). We don't know how often the 'Quota' was lifted in the Pleistocene."

  This structure ensures they leave understanding the *mechanism* (Hard vs. Soft) without forcing them to adopt a specific *ideology* about the Units of Selection debate.
