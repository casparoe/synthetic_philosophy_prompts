prompt: |-
  Our intake desk handles roughly forty proposals a month at a mid-sized, corpus-driven general dictionary — descriptive in principle, 1.4 million citations, about 300,000 numbered senses — and the house style guide gives my two junior editors exactly one word to work with when they decide whether a usage is a new numbered sense, a sub-case of an existing one, or a metaphor that has not yet hardened into meaning: the usage must be *established*. In practice they settle almost every hard case the same way, by drafting a candidate definition and then testing the usage against it, which is precisely the habit I have been asked to break, because the words that generate nearly all of our disputes are words for which no such definition can be written — and not because we are lazy. Wittgenstein's discussion of games gives the diagnosis: the applications of such a word hang together by a network of overlapping and criss-crossing similarities, no one of which runs through all of them, like a thread whose strength comes from many short fibres overlapping rather than from a single fibre running its whole length. That is a perfectly good account of why our current method fails and no help at all on a Thursday afternoon. I also know how this goes wrong when people try to operationalize it: either the checklist turns out to be a classical definition in disguise — a fixed feature list applied jointly to cases that conspicuously lack one of the features — or it collapses into "count the resemblances," which is not a test, since anything can be made to resemble anything in some respect.

  So please write me the triage protocol the desk can actually run. Write as a lexicographer who has spent twenty years on an intake desk and reads the *Investigations* sideways; before you draft the steps, spend a short paragraph identifying the failure modes a protocol of this kind is exposed to, and let that drive the design. I want an ordered sequence of steps, and for each step: the question asked, the evidence that counts as a sufficient answer, and where that answer routes the proposal. The protocol has to say what a candidate is compared *against* — which paradigm entries, kept how, and revised under what conditions — and how a resemblance claim gets recorded as named respects of similarity and difference rather than as a general air of kinship. It has to tell my editors how to say which respects are load-bearing, and to do so without pretending that this is a computation. It needs an explicit branch for the case where our corpus holds no close paradigm on either side, and an explicit treatment of non-transitivity: we already accept two senses that overlap with each other, and a candidate overlaps with the second but with neither the first nor the original core, and a chain of that kind can walk a concept anywhere it likes, so I want to know what the protocol says stops it. It should distinguish a usage that is frequent from one that is established, and live figurative use from an acquired sense. And it should mark, visibly and in its own typographic register, the steps that are judgment wearing procedural clothing, plus the class of case where the question ceases to be lexicographic and comes to me as editorial policy — organized pressure from a trade body, foreseeable legal consequences, register politics. Every step's output must be phrased so that it could appear verbatim in the public note explaining a decision to someone who lost. Assume the users have no philosophy training and twenty minutes a case; assume I sign off only if the trace ends in a stop or in an escalation to me. Do not give me a bibliography or a reading list, and if you invoke Wittgenstein, paraphrase rather than quote and do not attach section numbers you are not certain of.

  Then run the protocol on three live proposals, showing the step-by-step trace rather than a verdict, and let at least one of them come out against my wishes:

  1. **Oat, almond, and soy "milk."** Used predicatively and in recipes by people who do not drink dairy, attested across registers, and the object of sustained pressure from a dairy trade association asking us to restrict the word. New numbered sense, sub-case of the existing one, or unresolved? Note that one of the three inputs here is not lexicographic evidence at all, and I want the protocol to show that.
  2. **"Algorithm" as a fixed routine in ordinary non-technical speech** — the algorithm of the morning commute, the algorithm of an election campaign. This is my own case; I have argued for a separate sense at two panel meetings, and my editors are polite about it. I expect the trace to reject it as figurative-and-not-yet-established, and I want the reason written so plainly that two junior editors can hand it to me.
  3. **Whether "e-sport" falls under our existing sense of "sport."** We already admit recreational and blood-sport senses that overlap with *game* rather than with *athletics*, and an international governing body's recognition of the activity has been cited at us. Use this one to expose both the chain-walking problem and, if it does in fact arise here, a step at which the protocol cannot deliver and the case escalates to me.

  Close with a short section on what the protocol cannot do. I specifically want you to say, if you think it is true, that family resemblance underdetermines the extension — that the comparisons only fix a ranking of candidates and never a boundary — and that what actually settles the marginal cases is our ledger of past decisions and the practice built on it, not the reasoning in any individual trace. If that is right, say it plainly and tell me what safeguards a desk like mine needs so the ledger does not simply drift, rather than papering over the gap with a final step called "editorial judgment."
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **Context:** Mid-sized, corpus-driven, descriptive dictionary (1.4M citations, 300k senses). Intake desk handles ~40 proposals/month.
      *   **Problem:** Current style guide says usage must be "*established*." Junior editors try to draft definitions to test this, but this fails for words with family resemblance structures (Wittgensteinian "games").
      *   **Goal:** Create a triage protocol for junior editors to decide: New Numbered Sense vs. Sub-case vs. Metaphor/Not Established.
      *   **Constraints & Requirements:**
          *   Write as a seasoned lexicographer (20 years) who knows *Philosophical Investigations* sideways.
          *   Start with a paragraph on failure modes driving the design.
          *   Ordered sequence of steps.
          *   For each step: Question, Sufficient Evidence, Routing.
          *   Must specify what candidates are compared against (paradigm entries, maintenance).
          *   Must record resemblances as named respects, not general kinship.
          *   Must identify "load-bearing" respects without pretending it's computation.
          *   Must handle the "no close paradigm" case.
          *   Must handle non-transitivity (chain-walking problem).
          *   Distinguish *frequent* vs. *established*, and *live figurative* vs. *acquired sense*.
          *   Mark steps that are "judgment wearing procedural clothing" (typographic register).
          *   Mark cases escalating to Editorial Policy (trade bodies, legal, register politics).
          *   Output phrasing must be suitable for public notes explaining decisions to losers.
          *   Assume users have no philosophy training, 20 mins/case.
          *   Sign-off only if trace ends in Stop or Escalation.
          *   No bibliography/reading list. Paraphrase Wittgenstein, no section numbers.
          *   **Run the protocol on three live proposals:**
              1.  Plant "milks" (dairy pressure).
              2.  "Algorithm" (routine/metaphor) - *Must reject this, against the user's wish.*
              3.  "E-sport" (chain-walking problem, potential escalation).
          *   **Closing:** What the protocol *cannot* do (underdetermination, ledger vs. reasoning, safeguards against drift).

  2.  **Deconstruct the Philosophical/Lexicographical Problem:**

      *   *The Wittgenstein Issue:* You can't define necessary and sufficient conditions for "game" (or "sport," "milk," "algorithm" in loose usage). You have overlapping similarities.
      *   *The Lexicographical Issue:* Dictionaries need boundaries. We need to know when a similarity is strong enough to count as a *sense* rather than a *usage*.
      *   *The "Established" Problem:* Frequency $\neq$ Establishment. A metaphor can be frequent (live) but not lexicalized (dead metaphor/sense).
      *   *The Chain-Walking Problem:* If A overlaps B, and B overlaps C, does A overlap C? Not necessarily. If we keep adding links, "sport" could eventually mean "anything done competitively," losing the physical exertion link. We need a brake.
      *   *The "Judgment" Problem:* Editors need to know when they are making a policy call vs. a linguistic observation.

  3.  **Drafting the Protocol Design (Failure Modes):**

      *   *Failure Mode 1: The Definition Trap.* Trying to write a definition before confirming the sense exists. (Circular).
      *   *Failure Mode 2: The Counting Trap.* Counting similarities without weighing them. (Anything resembles anything).
      *   *Failure Mode 3: The Drift Trap.* Allowing transitive chains to stretch meaning until it breaks.
      *   *Failure Mode 4: The Policy Mask.* Pretending a political/legal decision is a linguistic one.
      *   *Design Driver:* The protocol must force *comparison to specific anchors*, not abstract concepts. It must require *weighting* of features, not just listing. It must identify *breaks* in the chain. It must flag *external pressure*.

  4.  **Developing the Steps (The "Intake Triage Protocol v4.2"):**

      *   *Anchors:* Need "Paradigm Citations" (core examples of existing senses).
      *   *Step 1: Corpus Density & Distribution.* (Frequency vs. Establishment).
      *   *Step 2: Paradigm Matching.* (Comparison against existing senses).
      *   *Step 3: Feature Weighting.* (Load-bearing respects).
      *   *Step 4: Chain Integrity.* (Non-transitivity check).
      *   *Step 5: External Interference.* (Policy escalation).
      *   *Step 6: The "No Anchor" Case.* (New concept entirely).
      *   *Typographic Register:* Need a way to highlight judgment calls (e.g., **[JUDGMENT]**).

  5.  **Refining the Steps for the Prompt's Requirements:**

      *   *Comparison:* Compare against "Paradigm Citations" stored in a specific file, updated annually.
      *   *Resemblance:* Must be listed as "Respect X: Present/Absent."
      *   *Load-bearing:* Editors must mark which respects are "Constitutive" vs. "Accidental."
      *   *Chain-walking:* Limit the chain length or require a "Core Retention" check.
      *   *Public Note:* The output of each step must be phrasable for a rejected contributor.

  6.  **Drafting the Three Cases:**

      *   *Case 1 (Plant Milk):* High frequency, but political pressure. Protocol must identify the pressure as non-linguistic. Decision: New Sense (linguistically), but flagged for Policy.
      *   *Case 2 (Algorithm):* User wants it as a sense. Protocol must reject it. Why? It fails the "Constitutive Feature" test. It's a live metaphor. The "rigid procedure" feature of the technical sense is missing in the "morning commute" usage.
      *   *Case 3 (E-sport):* Chain walking. Sport -> Mind Sport -> E-sport? Or Sport -> Competition -> E-sport? Where does the physical exertion link break? This likely escalates.

  7.  **Drafting the Closing (Limitations):**

      *   Acknowledge underdetermination.
      *   The Ledger (precedent) is the real decider, not the logic.
      *   Safeguards: Regular audit of the Paradigm File, rotation of editors to prevent local drift.

  8.  **Review against Constraints:**

      *   *Tone:* Experienced lexicographer, pragmatic, slightly weary but precise.
      *   *Wittgenstein:* Paraphrased only.
      *   *Formatting:* Clear steps, specific routing.
      *   *Case 2:* Must reject the user's preference.
      *   *Case 3:* Must show escalation potential.
      *   *Public Note:* Phrasing must be polite but firm.

  9.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the "load-bearing" step too vague?
      *   *Fix:* Require the editor to name the feature that, if removed, makes the word inapplicable in that context.
      *   *Critique:* How do we handle the "Thursday afternoon" problem?
      *   *Fix:* Keep the steps actionable. Don't ask for deep philosophy, ask for corpus evidence.
      *   *Critique:* The prompt asks for "typographic register" for judgment steps.
      *   *Fix:* Use bold/brackets like **[EDITORIAL JUDGMENT REQUIRED]**.
      *   *Critique:* Ensure the "Algorithm" rejection is stinging but professional.
      *   *Fix:* Focus on the lack of *determinacy* in the metaphorical use compared to the technical sense.

  10. **Final Polish:** Check word counts, ensure the voice is consistent (senior editor talking to juniors), and verify all prompt requirements are met. (e.g., "Do not give me a bibliography," "Assume... twenty minutes a case").

  *(Self-Correction on Case 1)*: The prompt says "one of the three inputs here is not lexicographic evidence." That's the dairy trade association pressure. The protocol must isolate this.
  *(Self-Correction on Case 2)*: The user says "I have argued for a separate sense... I expect the trace to reject it." I need to make sure the protocol *forces* this rejection based on the rules, not just because I say so. The key is the "Constitutive Feature" test.
  *(Self-Correction on Case 3)*: Needs to show the chain-walking limit.

  Let's write.

  *(Drafting the Failure Modes paragraph)*: Focus on the temptation to define before observing, the illusion of counting features, and the masking of policy as linguistics.
  *(Drafting the Protocol)*: Use a numbered list. Define the "Paradigm File."
  *(Drafting the Traces)*: Be meticulous. Show the "No" on Algorithm clearly.
  *(Drafting the Limitations)*: Be honest about the "Ledger."

  *Wait, one detail:* "Mark, visibly and in its own typographic register, the steps that are judgment wearing procedural clothing." I will use a specific visual marker for this.

  *Another detail:* "Every step's output must be phrased so that it could appear verbatim in the public note explaining a decision to someone who lost." This is crucial. The internal logic must translate to external explanation.

  *Final check on Wittgenstein:* No quotes, no section numbers. Just the concept of family resemblance and threads.

  Okay, ready to generate.cs
answer: |-
  ### Failure Modes and Design Logic

  A protocol of this kind fails in four predictable ways. First, the **Definition Trap**: editors try to write the meaning before confirming the sense exists, forcing a square peg into a round hole because they assume a definition *must* be possible. Second, the **Counting Fallacy**: editors list similarities without weighing them, assuming that ten weak resemblances equal one strong one, which allows anything to resemble anything if you squint. Third, the **Chain-Walk**: we accept a link from A to B, and B to C, until Z no longer resembles A, yet we call it the same word; the protocol must identify where the thread snaps, not just where it overlaps. Fourth, the **Policy Mask**: external pressure (legal, commercial, political) is dressed up as linguistic analysis to avoid accountability. This protocol is designed to break the Definition Trap by comparing usage to *citations* rather than *concepts*; to defeat the Counting Fallacy by requiring editors to identify *constitutive* features; to halt the Chain-Walk by limiting transitive links; and to expose the Policy Mask by segregating linguistic evidence from external interference.

  ***

  ### INTAKE TRIAGE PROTOCOL v4.2 (FAMILY RESEMBLANCE EDITION)

  **Pre-Condition: The Paradigm File**
  Before beginning, open the *Paradigm File* for the headword. This is not the dictionary entry; it is a separate maintenance document containing three "Anchor Citations" for each existing numbered sense. These anchors are the clearest, least ambiguous examples of that sense, selected by senior staff and revised only during the annual cycle. You are comparing the proposal against these *citations*, not against your internal concept of the word.

  **Step 1: Frequency vs. Establishment**
  *   **Question:** Is this usage merely frequent, or is it independent of the original context?
  *   **Evidence:** A minimum of 20 citations from at least three distinct source types (e.g., academic, broadcast, casual web, trade) spanning at least five years. Crucially, at least 50% of citations must occur *without* explanatory glosses, scare quotes, or hedging (e.g., "so-called," "metaphorically").
  *   **Routing:** If citations are clustered in one register or rely on glosses, route to **Reject (Live Figurative)**. If distributed and unmarked, proceed to Step 2.
  *   **Public Note Phrasing:** *"While this usage appears in our corpus, it currently relies on explanatory context or remains confined to a specific community, indicating it has not yet become an independent meaning."*

  **Step 2: Paradigm Matching (The Resemblance Grid)**
  *   **Question:** Which specific features of the Anchor Citations does the proposal share?
  *   **Evidence:** A completed Resemblance Grid. List up to five features derived *from the Anchor Citations* (not abstractly). Mark each as **Present**, **Absent**, or **Modified**.
  *   **Routing:** If all features are Absent, route to **New Headword** (if substantial) or **Reject**. If all are Present, route to **Existing Sense**. If mixed, proceed to Step 3.
  *   **Public Note Phrasing:** *"This usage shares some characteristics with existing meanings, but diverges in key structural aspects."*

  **Step 3: Load-Bearing Analysis [EDITORIAL JUDGMENT REQUIRED]**
  *   **Question:** Which of the 'Present' or 'Modified' features are constitutive?
  *   **Evidence:** A written statement identifying one feature from the Grid that, if removed, would make the application of the word impossible in the Anchor Citation. This is the "load-bearing" feature. Does the proposal retain this specific feature?
  *   **Routing:** If the proposal retains the load-bearing feature of an existing sense, route to **Sub-case/Existing Sense**. If it retains *no* load-bearing features from any existing sense, proceed to Step 4.
  *   **Public Note Phrasing:** *"Although there are superficial similarities, this usage lacks the core functional element that defines the established meaning."*
  *   **Visual Marker:** **[JUDGMENT: EDITOR MUST NAME THE CONSTITUTIVE FEATURE]**

  **Step 4: Chain Integrity (Non-Transitivity Check)**
  *   **Question:** Does this proposal connect to an existing sense directly, or only through an intermediate sense that is itself marginal?
  *   **Evidence:** Trace the link. If Proposal C links only to Sense B, and Sense B links only to Sense A (Core), check if C links to A. If C shares no load-bearing features with A, the chain is broken.
  *   **Routing:** If the chain exceeds two links (A→B→C→Proposal) without returning to a Core load-bearing feature, route to **Escalation (Chain-Walk Risk)**. If direct or strong indirect link exists, proceed to Step 5.
  *   **Public Note Phrasing:** *"While this usage relates to a secondary meaning, it has drifted too far from the primary core to be classified under the same headword."*

  **Step 5: External Interference Check [POLICY ESCALATION]**
  *   **Question:** Is there non-linguistic pressure influencing this proposal?
  *   **Evidence:** Documentation of trade body complaints, legal threats, or organized campaigns regarding this usage.
  *   **Routing:** If **Yes**, do not decide. Route to **Escalation (Editorial Policy)**. If **No**, proceed to Step 6.
  *   **Visual Marker:** **[POLICY FLAG: DO NOT DECIDE]**
  *   **Public Note Phrasing:** (Internal Only) *"Decision suspended pending policy review."*

  **Step 6: The Orphan Case (No Close Paradigm)**
  *   **Question:** If no existing sense fits, is this a new concept or a failure of our taxonomy?
  *   **Evidence:** Comparison against the *nearest* headword, not just the current one. (e.g., if not "Sport," is it "Game"?).
  *   **Routing:** If it fits a *different* headword better, route to **Refer to Other Headword**. If it fits nowhere, route to **New Numbered Sense**.
  *   **Public Note Phrasing:** *"This usage represents a distinct concept that requires separate classification from related terms."*

  ***

  ### LIVE PROPOSAL TRACES

  #### Case 1: Plant-based "Milk"
  **Proposal:** New numbered sense for *milk* covering oat/almond/soy liquids.
  **Context:** High frequency. Dairy trade association lobbying for restriction.

  *   **Step 1 (Frequency):** **PASS.** 500+ citations across recipes, labeling, casual speech. No scare quotes in 80% of post-2015 citations.
      *   *Note:* "Usage is widespread and no longer requires explanation in general contexts."
  *   **Step 2 (Paradigm Matching):**
      *   *Anchor 1 (Dairy):* White, opaque, animal secretion, nutritional profile (calcium/protein).
      *   *Grid:* Opaque (Present), Liquid (Present), Animal Secretion (Absent), Nutritional Profile (Modified/Added).
      *   *Note:* "Usage shares physical properties but differs in biological origin."
  *   **Step 3 (Load-Bearing) [JUDGMENT]:**
      *   *Editor's Call:* Is "Animal Secretion" load-bearing? Historically, yes. Is "Opaque Nutritive Liquid" load-bearing? In culinary contexts, yes.
      *   *Decision:* In the context of *consumption*, the load-bearing feature is "Opaque Nutritive Liquid for drinking/cooking," not biological origin.
      *   *Note:* "Core function in this context is culinary utility, not biological source."
  *   **Step 4 (Chain Integrity):** **PASS.** Direct overlap with culinary sense of dairy milk.
  *   **Step 5 (External Interference) [POLICY FLAG]:**
      *   *Evidence:* Letter from Dairy Trade Association received 14th. Cites regulatory standards.
      *   *Routing:* **ESCALATION TO EDITORIAL POLICY.**
      *   *Trace Halt:* Linguistic criteria met for New Sense, but external pressure requires policy decision on whether to encode regulatory dispute in definition.
  *   **Step 6:** Skipped.

  **Outcome:** Escalated. The protocol identifies the linguistic case is strong (New Sense), but isolates the trade pressure as a non-linguistic variable requiring your signature.

  #### Case 2: "Algorithm" (Morning Commute/Election)
  **Proposal:** New numbered sense for *algorithm* meaning "fixed routine" or "strategy."
  **Context:** Proponent (Senior Editor) argues this is lexicalized.

  *   **Step 1 (Frequency):** **PASS.** 40+ citations in op-eds, podcasts, casual speech. "My morning algorithm."
      *   *Note:* "Usage is frequent and unmarked in informal registers."
  *   **Step 2 (Paradigm Matching):**
      *   *Anchor 1 (Computing):* Finite steps, deterministic, unambiguous, machine-executable, produces specific output.
      *   *Grid:* Finite steps (Modified), Deterministic (Absent), Unambiguous (Absent), Machine-executable (Absent), Output (Modified).
      *   *Note:* "Usage retains the idea of a 'process' but loses precision and executability."
  *   **Step 3 (Load-Bearing) [JUDGMENT]:**
      *   *Editor's Call:* What is load-bearing in the Computing sense? **Determinacy.** An algorithm *must* yield the same result from the same input. A morning commute routine varies based on traffic, mood, weather.
      *   *Decision:* The proposal lacks the load-bearing feature of *determinacy*. It is a metaphor for "routine," not a sense of "algorithm."
      *   *Note:* "While this usage suggests a structured process, it lacks the strict determinacy required by the established technical meaning."
  *   **Step 4 (Chain Integrity):** **FAIL.** The link is A (Computing) → B (Metaphor). There is no intermediate sense of "loose routine" that is already established. It jumps straight from code to life.
  *   **Step 5 (External Interference):** **NONE.**
  *   **Step 6 (Orphan):** **REFER.** This is a sense of *Routine* or *Regimen*, not *Algorithm*.

  **Outcome:** **REJECT (Live Figurative).**
  **Public Note:** *"While 'algorithm' is increasingly used to describe personal routines, this usage functions as a metaphor for predictability rather than a distinct meaning. It lacks the element of fixed, deterministic procedure that defines the word's current established senses."*
  *(Trace Note: This rejects your proposal based on the loss of the constitutive feature 'determinacy', despite your advocacy.)*

  #### Case 3: "E-sport" under "Sport"
  **Proposal:** Include e-sport under existing Sense 3 (Competitive Physical Activity).
  **Context:** International governing body recognition. Existing senses include "Blood Sport" and "Mind Sport."

  *   **Step 1 (Frequency):** **PASS.** High frequency, unmarked.
  *   **Step 2 (Paradigm Matching):**
      *   *Anchor 1 (Athletics):* Physical exertion, competitive, governed by rules.
      *   *Anchor 2 (Blood Sport):* Competitive, governed, involves suffering (no exertion).
      *   *Grid (vs Anchor 1):* Physical Exertion (Absent), Competitive (Present), Rules (Present).
      *   *Grid (vs Anchor 2):* Competitive (Present), Rules (Present).
  *   **Step 3 (Load-Bearing) [JUDGMENT]:**
      *   *Editor's Call:* Sense 1 (Athletics) load-bearing feature is **Physical Exertion**. Sense 2 (Blood Sport) load-bearing feature is **Spectacle of Conflict**. E-sport has neither exertion nor conflict-spectacle in the same way. It relies on **Fine Motor Skill**.
      *   *Decision:* Does Fine Motor Skill count as Physical Exertion? In *darts* or *shooting*, yes. In *keyboard input*? Debatable.
  *   **Step 4 (Chain Integrity) [CRITICAL FAIL]:**
      *   *Trace:* Sport (Athletics) → Sport (Mind/Card Games) → Sport (E-sport).
      *   *Check:* Mind Games overlap with Athletics on "Competition." E-sport overlaps with Mind Games on "Competition." But E-sport shares *no* load-bearing features with Athletics (Exertion).
      *   *Risk:* If we accept E-sport under Sport solely via Mind Sport, we sever the link to physicality entirely. "Sport" could then mean "Any Competition."
      *   *Routing:* **ESCALATION (Chain-Walk Risk).**
  *   **Step 5 (External Interference):** **PASS.** Governing body recognition is cited, but this is internal to the industry, not external legal pressure.
  *   **Step 6 (Orphan):** **ESCALATION.**

  **Outcome:** **ESCALATION TO EDITORIAL POLICY.**
  **Reason:** The protocol cannot resolve whether "Fine Motor Skill" is a sufficient substitute for "Physical Exertion" without breaking the chain back to the core meaning. This is a boundary decision, not a descriptive one.
  **Public Note:** *"The classification of competitive gaming remains a subject of debate regarding the definition of physical exertion. We are reviewing whether this constitutes a new category or an extension of existing competitive senses."*

  ***

  ### WHAT THE PROTOCOL CANNOT DO

  This protocol does not solve the problem of family resemblance; it manages it. It admits that resemblance underdetermines extension. The Resemblance Grid and Load-Bearing Analysis will often produce a ranking of candidates (e.g., "E-sport is 60% like Athletics, 80% like Mind Sport") but they will never produce a hard boundary. The boundary is not discovered; it is imposed.

  What actually settles the marginal cases is not the reasoning in any individual trace, but our **Ledger of Past Decisions**. If we accepted *Darts* under *Sport* in 1995, *E-sport* becomes easier in 2024. If we rejected *Chess* in 2010, *E-sport* becomes harder. The logic in the trace is a post-hoc justification for a decision driven by precedent.

  **Safeguards Against Drift:**
  Because the Ledger is the true decider, the protocol is vulnerable to slow drift (the "Boiling Frog" effect). To prevent this:
  1.  **Annual Paradigm Audit:** The Anchor Citations in the Paradigm File must be reviewed yearly. If a "Sub-case" has become more frequent than the "Core," the Anchor must move.
  2.  **Rotation:** No editor should handle more than three "Chain Integrity" escalations per year. Fatigue leads to accepting weak links to close the ticket.
  3.  **The "Stop" Rule:** If Step 4 (Chain Integrity) flags a risk, you *must* escalate. You cannot override the Chain-Walk warning with a "Load-Bearing" justification. That is the specific point where linguistics ends and policy begins.

  This protocol gives your juniors the vocabulary to say "No" to you (as in Case 2) and the cover to say "I don't know" to the public (as in Case 3). It does not give them the truth, because in lexicography, the truth is just the consensus we haven't overturned yet.
