answer: |-
  First, please tell Emma that she has a brilliant mind. She stumbled upon one of the most famous paradoxes in decision theory (literally called "The Two Envelopes Problem"), and more importantly, she found the *reductio ad absurdum* on her own ("that same argument says I should trade straight back"). That instinct—that a strategy which recommends infinite swapping must be flawed—is the heart of scientific skepticism.

  You asked where the bug is in her arithmetic, whether a better strategy exists, and if opening the envelope changes the math. Here is the breakdown, tailored for someone who knows that if the mass balance doesn't close, the model is wrong.

  ### 1. Where is the reasoning bug?

  Emma's arithmetic ($0.5 \times 2A + 0.5 \times 0.5A = 1.25A$) looks correct, but it contains a **category error in the variables**. In lab terms, she is treating a random variable as a fixed constant during the calculation.

  Here is the systematic error:
  In her formula, $A$ represents the amount in her hand. But $A$ is not the same value in both halves of her equation.
  *   In the "Double" scenario ($2A$), $A$ represents the **smaller** amount in the pair.
  *   In the "Half" scenario ($0.5A$), $A$ represents the **larger** amount in the pair.

  She is averaging two different physical quantities as if they were the same reference point. It's like calculating the average density of a mixture by assuming the volume of the solvent is the same in both trials, when in one trial you started with 100ml and in the other you started with 200ml.

  **The Correct Calibration:**
  Let the two envelopes contain $Y$ and $2Y$.
  *   **Case 1 (50% chance):** She picked $Y$. The other is $2Y$. Gain = $+Y$.
  *   **Case 2 (50% chance):** She picked $2Y$. The other is $Y$. Gain = $-Y$.

  Expected Gain = $(0.5 \times Y) + (0.5 \times -Y) = 0$.

  There is no expected gain. The "1.25" factor is an illusion created by letting the reference value ($A$) shift depending on which envelope she picked.

  ### 2. Was there a strategy smarter than a coin flip?

  **Without opening the envelope: No.**
  Because the envelopes are sealed and indistinguishable, and the selection was blind, the system is perfectly symmetric. Knowing the *range* ($200–$1,600) does not break this symmetry if she cannot see the value. The probability that she holds the smaller amount is exactly 0.5, regardless of the distribution of pairs within that range. A coin flip is mathematically optimal here.

  **With opening the envelope: Yes.**
  This is where your knowledge of the range becomes a "boundary condition" that breaks the symmetry.

  The possible pairs of round hundreds between $200 and $1,600 are:
  (200, 400), (300, 600), (400, 800), (500, 1000), (600, 1200), (700, 1400), (800, 1600).

  If Emma is allowed to open the envelope, she gains information that allows her to update the probabilities (a Bayesian update):

  *   **If she sees $1,600:** She knows this must be the larger envelope (since the max is $1,600). **Strategy: Keep.**
  *   **If she sees $200:** She knows this must be the smaller envelope (since the min is $200). **Strategy: Swap.**
  *   **If she sees anything in between (e.g., $800):**
      *   It could be the large end of the (400, 800) pair.
      *   It could be the small end of the (800, 1600) pair.
      *   Assuming the donor was equally likely to pick any of the 7 pairs, these scenarios are equally probable. The expected value of swapping is zero. **Strategy: Indifferent (Coin Flip).**

  So, opening the envelope only provides an advantage at the extreme edges of the distribution. However, since there *are* edges, the option to look has positive expected value compared to not looking, even if only for those boundary cases.

  ### 3. The Philosophical "Costume"

  You mentioned this feels like a philosophy problem. It is. It highlights the difference between **epistemic probability** (what we know) and **ontic probability** (how the system is set up).

  Emma's error is a failure of **reference class**. She assumes that because she doesn't know which envelope she has, the probability is 50/50 *relative to the number in her hand*. But the number in her hand is correlated with the total pool of money.

  In your career, you likely encountered systematic errors where the instrument calibration drifted depending on the sample concentration. This is similar. Emma is using the "instrument" (the value $A$) to calibrate the expectation, but the instrument's accuracy depends on whether she is measuring the "low sample" or the "high sample," which she doesn't know.

  **Summary for Emma:**
  1.  **Her math bug:** She used the same letter ($A$) for two different amounts (the small one and the big one).
  2.  **Blind Strategy:** No strategy beats a coin flip.
  3.  **Open Strategy:** If she sees the max ($1,600), keep. If she sees the min ($200), swap. Otherwise, it doesn't matter.

  She spotted the paradox herself, which is the hardest part. Helping her see the "shifting variable" is just teaching her how to label her axes correctly.
