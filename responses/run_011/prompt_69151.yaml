answer: |-
  This is a classic tension in biology: the tug-of-war between the *utility* of information language and the *ontology* of biological systems. Your friend is right that there are serious philosophical category errors here, but the author is right that the language is indispensable for doing the science.

  Here is the breakdown of what holds up, what is simplified, and what is fundamentally mistaken, followed by the specific answers to your questions about arbitrariness, information theory, and the final conclusion.

  ### 1. The Three Conflations
  Your friend likely identified these three specific slippages where the author treats a useful metaphor as a physical identity.

  **Conflation 1: The Code vs. The Program**
  *   **The Narrow Claim (True):** There is a specific, rule-governed mapping between nucleotide triplets (codons) and amino acids. This is legitimately a "code" in the cryptographic or semiotic sense. It is a translation table.
  *   **The Big Claim (False):** The author slides from "there is a code for translation" to "the genome is a program for development."
  *   **The Error:** A code translates symbols into parts. A program dictates the assembly of the whole. The genome codes for proteins, but it does not code for the *arrangement* of those proteins into an organism in the way a CAD file codes for a building. The spatial arrangement emerges from physical-chemical interactions, not just linear instruction. The narrow claim licenses the word "code" for translation; it does not license the word "program" for development.

  **Conflation 2: Syntax vs. Semantics**
  *   **The Claim:** Because the sequence has structure (syntax), it has meaning (semantics).
  *   **The Error:** In information theory, you can measure the bits (syntax) without knowing what they do. A random string of DNA has high information content in bits, but zero biological meaning. The author treats the *measure* of the sequence as proof of its *function*. The "meaning" of a gene is not intrinsic to the sequence; it is determined by the cellular context that reads it.

  **Conflation 3: Hardware vs. Environment**
  *   **The Claim:** The egg/cell is "hardware" running the genomic "software."
  *   **The Error:** In computers, hardware is passive; it waits for software to tell it what to do. In biology, the "hardware" (cytoplasm, membranes, existing proteins) is active. It determines *which* genes are read, *when*, and *how*. The egg is not a computer chassis; it is a co-author. If you swap the "hardware" (nuclear transfer), the "software" often fails to run unless the hardware is reset. They are mutually constitutive, not distinct layers.

  ### 2. Arbitrariness and Universality
  You remembered correctly from college: the code is not as arbitrary or as universal as the author claims.

  **On Arbitrariness:**
  The author leans on the "Frozen Accident" theory (that the assignments are random but stuck). However, there is evidence of **stereochemical affinity**. Some amino acids chemically interact with their own codons or anticodons. This suggests the code wasn't purely arbitrary like the word "dog"; it was partially constrained by chemistry. If the mapping were purely arbitrary, the "language" analogy would be stronger. Because it's partly chemical, it's more like a physical key fitting a lock than a word referring to an object. This weakens the "literal language" argument.

  **On Universality:**
  The claim that "there is one code, shared by everything alive" is factually false. It is *nearly* universal, which is remarkable, but there are variations (e.g., in mitochondria, certain protozoa, and bacteria). Stop codons can code for amino acids in specific contexts. This doesn't destroy the concept of a genetic code, but it destroys the idea that it is a rigid, immutable law like physics. It is a biological convention, and like all biological conventions, it has dialects.

  ### 3. Information Theory and Tree Rings
  Your friend is right: the tree-ring argument is backwards.

  **The Author's View:** Tree rings correlate with age (passive indicator); DNA bits measure information (active instruction).
  **The Reality:** Both are causal records. Tree rings are caused by seasonal growth cycles. DNA sequences are caused by replication and mutation history.
  **The Bit Problem:** Shannon information theory measures **uncertainty**, not **meaning**. A random DNA sequence has *more* bits of information than a highly conserved, functional gene (because it is less predictable). If "measurable bits" proved "functional program," then random junk DNA would be the most sophisticated program of all.
  **The Distinction:** The difference between DNA and tree rings isn't measurability; it's **causal role**. DNA is a *template* used by machinery to build something else. Tree rings are a *trace* left behind by a process. Calling DNA "information" is valid because it is used as a template, not because you can count bits. The author uses the math of bits to prove the metaphysics of meaning, which doesn't work.

  ### 4. The "Junk DNA" Claim
  This is the most scientifically dated part of the passage. Calling non-coding DNA "junk" and "evolutionary leftovers" to support the "instructions" thesis is circular reasoning.
  *   **Fact:** A vast amount of non-coding DNA is regulatory (switches, enhancers, RNA genes).
  *   **Error:** By defining "instructions" only as protein-coding sequences, the author defines away the complexity that makes the "program" analogy fail. If the "software" includes the regulatory landscape (which interacts with the "hardware"), the clean software/hardware distinction collapses.

  ### 5. The Strongest Honest Defense of the Author
  Despite the errors, the author is not just talking nonsense. Here is the steelman argument for their position:

  **Pragmatic Realism:**
  In the context of *intervention*, the genome behaves *as if* it is a program. When we use CRISPR to change a base pair, we often get a predictable change in the phenotype. If we treat the DNA as a symbolic representation that can be edited independently of the cellular context, we succeed often enough to cure diseases and engineer crops.
  From an engineering standpoint, the distinction between "literal program" and "useful metaphor" vanishes. If you can debug it, compile it, and edit it, it is functionally a program. The author is prioritizing **operational truth** (it works to think this way) over **ontological truth** (is this what life *really* is). For a popular audience, emphasizing the "code" aspect empowers them to understand genetic engineering. If you emphasize the "complex interactive system" aspect, the reader concludes nothing can be done. The author chooses the narrative that enables agency.

  ### 6. Does the "Editing Software" Conclusion Survive?
  **Verdict:** It survives for *molecular* editing, but fails for *organismal* design.

  *   **Where it works:** If you want to stop a specific protein from being made (e.g., disabling a viral receptor), treating the gene as software code works perfectly. You find the line of code and delete it.
  *   **Where it fails:** If you want to "design an organism" (e.g., make a human smarter or a plant drought-proof by inserting a gene), the software analogy breaks. Because the "hardware" (developmental context) interprets the "code" non-linearly, editing the software often produces crashes (unintended side effects) or no change at all (compensatory mechanisms).

  **Summary Judgment:**
  The author is right that the genetic code is a genuine mapping system and not just a loose metaphor. However, they commit a category error by extending the properties of that *translation code* to the entire *developmental process*.
  *   **Narrow Claim:** DNA is a code for proteins. (Mostly True)
  *   **Big Claim:** The organism is a computer running the DNA program. (False)
  *   **Tree Ring Argument:** Backwards. Bits measure capacity, not function.
  *   **Conclusion:** You can edit the code, but you cannot simply "run" the new version without considering the hardware, because in biology, the hardware helps write the code.

  The passage is a brilliant piece of rhetorical persuasion that gets the science just wrong enough to be dangerous if taken literally, but just right enough to be useful in a lab. Your friend's philosophy training spotted the ontological overreach; your intuition spotted the pragmatic utility. Both are correct.
