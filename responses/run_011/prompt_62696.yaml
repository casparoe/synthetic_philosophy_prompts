answer: |-
  Honestly, Northern Rock was not a pure information cascade but a coordination panic amplified by media-driven common knowledge, because the run persisted despite positive public information and only ceased when financial incentives were altered.

  **Mapping the Cascade**
  To model this as an information cascade, the agents are retail depositors acting sequentially over the weekend and Monday. The state of the world is binary: the bank is either solvent (viable long-term) or insolvent (broken). The action set is {Withdraw, Stay}. In a standard cascade, agents possess a private signal (e.g., personal knowledge of the bank's health, which was weak for most) and observe the public actions of predecessors (the queues). The cascade tips when the public information derived from observing others' actions outweighs the private signal and any public announcements. Here, the "tipping" occurred when the BBC broadcast images of queues on September 14; this visual evidence of others withdrawing became a public signal strong enough to override the Bank of England's prior announcement of liquidity support.

  **Rivals Against the Record**
  *   **Bayesian Herding (Information Cascade):** This model suggests depositors ran because they inferred insolvency from others' behavior. It fails the record because public information regarding solvency (Treasury/BoE statements) was ignored. In a pure information cascade, a strong public signal should break the herd; here, official reassurance had zero effect.
  *   **Diamond-Dybvig (Coordination Panic):** This model posits that depositors run because they expect others to run, making early withdrawal optimal regardless of solvency (first-come, first-served). This fits the facts perfectly. The run stopped only when the Chancellor guaranteed deposits, which altered the payoff matrix rather than updating beliefs about the bank's assets.
  *   **Reputational Herding:** This suggests agents copy others to avoid looking foolish. This is irrelevant for anonymous retail depositors queueing to save savings; there was no reputational gain in withdrawing.

  **Assessing the Hunch**
  Your hunch is correct and licenses the conclusion that this was not a standard information cascade. In a Bayesian cascade, actions are driven by beliefs about the state (solvency); if authorities credibly signal solvency, the run should stop. The fact that reassurance failed while a guarantee succeeded proves the drivers were strategic complements, not informational externalities. Public-signal and global-games reasoning (Morris and Shin) does better here because it accounts for the media broadcast creating *common knowledge*. When everyone sees the queues on TV, everyone knows that everyone else sees the queues, coordinating expectations that others will run. The guarantee worked because it made "Stay" a dominant strategy regardless of what others did, removing the coordination problem entirely.

  **The Anomaly: Small Depositors**
  Small depositors queueing despite insurance coverage is a problem for the standard insolvency-based cascade story but consistent with a liquidity-based coordination model. If the cascade were purely about inferring insolvency, insured depositors should stay, as their payoff is protected. Their presence suggests they were not inferring "the bank is bust" but rather "access to funds will be frozen" or "the payout process will be slow and costly." They were running against liquidity risk, not solvency risk. This distinguishes "inferred insolvency" from "inferred friction." A standard cascade model struggles here because it typically assumes the only risk is total loss based on the state; it does not easily model the cost of delay or the uncertainty of the insurer's speed.

  **Limitations of the Cascade Framework**
  The cascade framework cannot express the strategic interdependence central to this case. In a standard cascade, my action affects your information but not your payoff; in a bank run, my withdrawal directly reduces the liquidity available to you (strategic complements). Furthermore, the standard model assumes sequential observation of private actions, whereas Northern Rock was driven by simultaneous observation of a public broadcast. The media is not merely a transmitter of actions in this model; it is a coordinator that transforms private observations into common knowledge, triggering a global game rather than a sequential cascade. Ultimately, the cascade framework misses the mechanical constraint of the bank's liquidity pool, which is the actual engine of the crisis.
