answer: |-
  **Project Title:** Decomposing Collapse: A Narrative Stress Test

  **The Question**
  When historians speak of societal collapse, are they describing a shared material reality or a historiographical genre? Specifically, does the term "collapse" refer to a singular event, or is it a conflation of four distinct tracks that frequently decouple: the Polity (state structures, kings, levies), the Population (demographics, mortality), the Settlement (urbanization vs. dispersal), and the Record (writing, weights, monuments)?

  My hypothesis is that "collapse" is often an artifact of the fourth track. When the Record disappears, we assume the People disappeared. This project asks: If we disaggregate these four tracks, does the concept of collapse survive, or does it dissolve into a series of unrelated transformations?

  **The Impasse**
  Current scholarship is stalled between two camps that argue past one another. The first camp, the general theorists, treats collapse as a systemic failure of complexity. They argue that societies hit diminishing returns on investment in complexity until the structure buckles. For them, collapse is a real, measurable phenomenon of energy and organization.

  The second camp, the transformationists, argues that "collapse" is a pejorative elite bias. They contend that when the palace burns, the farmer often eats better. The state dissolves, but the society reorganizes into resilient, decentralized networks. For them, collapse is a myth we should discard in favor of terms like "transformation" or "reorganization."

  Neither side settles the debate because they are measuring different things. The theorists are measuring the Polity and the Record; the transformationists are measuring the Population and the Settlement. Both claim to describe the whole elephant while holding different limbs. This project proposes that we cannot resolve this argument with more data alone, because the conflict is categorical, not empirical. We need to test the concept itself.

  **The Method**
  I am a writer, not an archaeologist. I cannot dig new holes or isotopically analyze teeth. My method is synthesis followed by narrative experimentation. I will treat the concept of "collapse" not as a fact to be uncovered, but as a tool to be stress-tested.

  I will focus on a single case study: the Late Bronze Age Eastern Mediterranean (c. 1200 BCE). It is the archetype of collapse, making it the best laboratory for breaking the concept. Over nine months, I will construct four distinct chronicles of the same century.

  1.  **The Polity Chronicle:** A history written solely from the perspective of state structures, dynasties, and diplomatic letters.
  2.  **The Population Chronicle:** A history reconstructed from paleodemography, diet, and health data.
  3.  **The Settlement Chronicle:** A history of urbanization, housing density, and land use.
  4.  **The Record Chronicle:** A history of literacy, monumental inscription, and archival continuity.

  Once these four narratives are drafted, I will perform a narrative stress test. I will attempt to impose the word "collapse" onto each track. Does the sentence hold? Can you say "the population collapsed" with the same grammatical and evidentiary weight as "the record collapsed"? I want to identify exactly where the word stops permitting description and starts suppressing it. Does using the term "collapse" force the Population track to borrow tragedy from the Polity track where none exists?

  This is a task uniquely suited to a writer. Historians often seek a unified field theory; writers seek coherence in story. By forcing the period to tell four different stories, I can expose where the unified label "collapse" is doing violence to the nuance. I am not looking for what happened; I am looking for what language allows us to say happened.

  **Scope and Feasibility**
  Three case studies in nine months is a fantasy that would result in superficiality. I am restricting this project to the Late Bronze Age Eastern Mediterranean. This allows for depth rather than breadth. I will use the Classic Maya and Rapa Nui only as comparative touchstones to see if the fractures in the concept appear elsewhere, but the primary labor will be the dissection of the Bronze Age data.

  I have already spent three years gathering the secondary literature. The fellowship period will be dedicated entirely to the synthesis and the writing of the four chronicles. No fieldwork is required. The work is textual, conceptual, and compositional.

  **Outcomes**
  A successful result will be a refined taxonomy. I aim to produce a framework where a scholar can say, "This was a Polity Collapse but a Settlement Continuity," without contradiction. The output will be a manuscript that functions as both a research paper and a methodological provocation, demonstrating how narrative structure shapes historical conclusion.

  **Failure Conditions**
  It is important to define failure clearly. Inconclusiveness is not failure; finding that the tracks are too entangled to separate is a valid result.

  True failure would be proving that the concept of "collapse" is indispensable despite the evidence. If I find that even when the Population and Settlement tracks show stability, we *still* cannot tell the story without invoking the tragedy of the Polity and Record, then the project fails. It would mean that our historiography is fundamentally incapable of valuing human continuity over elite silence. It would mean that we are so dependent on the Record that without it, the People are historically dead to us regardless of their biological survival.

  That is the risk I am taking: that in trying to separate the people from the palace, I will prove that history belongs only to the palace. If that is the case, I need to know, and I need to write about why we refuse to let the farmers live without a king.
