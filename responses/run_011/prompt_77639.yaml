      *   *Key Insight:* The proverb assumes the local norm is *binding*. In a loose culture, the norm *is* that norms are not binding. So, following the proverb in a loose culture might mean acting freely, which violates the handbook's intent (which likely assumes a tight interpretation).

  6.  **Developing the "Tight vs. Loose" Analysis:**
