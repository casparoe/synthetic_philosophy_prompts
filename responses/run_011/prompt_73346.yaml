answer: |-
  Your factual summary is accurate; no corrections are needed.

  **Mapping Authority, Options, and Evidence**

  Decision-making authority shifted across three distinct bodies. Initially, the APA Nomenclature Committee and Board of Trustees held the power. In 1973, their live options were: retain homosexuality as a disorder, remove it entirely, or replace it with a distress-based category. Evidence included Hooker's 1957 data (factual: no psychological difference), activist testimony (moral/political: stigma is harm), and clinical anecdotes (factual: some patients reported distress). The Board chose the compromise: remove the general category, insert "Sexual Orientation Disturbance" for those distressed by their orientation.

  Authority then shifted to the full membership during the 1974 referendum. The options were binary: uphold the Board or overturn it. Evidence here was less empirical and more ideological; the vote (58 percent in favor) functioned as a legitimacy check rather than a data review. Finally, authority rested with the DSM-III Task Force (1980) and DSM-III-R Task Force (1987). In 1980, Spitzer retained the distress category ("Ego-dystonic Homosexuality"). In 1987, the Task Force deleted it outright. The live option in 1987 was whether any sexual orientation distress warranted a psychiatric code. The evidence was clinical utility data (low usage) and renewed concern that the category itself reinforced stigma.

  **Sorting the Premises**

  The debate involved three types of moves. Factual claims concerned psychological adjustment and functioning (Hooker's data, Spitzer's reliability studies). Value claims concerned morality and social welfare (activist claims about rights, conservative claims about social decay). The third type, which supports your hunch, involves changes to the rule fixing the extension of "mental disorder."

  In 1973, the decisive move was indeed rule-changing. The prior rule effectively treated statistical deviation combined with social disapproval as sufficient for disorder. The new rule required internal distress or impairment. This relocated pathology from the trait itself to the relation between the trait and the bearer's subjective state. This validates your extension-fixing story for 1973: the facts about attraction didn't change, nor did the fact that suffering matters; the criterion for what counts as a disorder shifted to exclude non-distressed individuals.

  However, your story strains at 1987. By then, the distress-based compromise was already in place. Removing "Ego-dystonic Homosexuality" wasn't just relocating pathology; it was a jurisdictional rule change. It asserted that sexual orientation, even when distressing, is not a proper object of psychiatric classification because the distress is presumed to be socially induced rather than internally dysfunctional. This goes beyond the 1973 distress criterion; it implies a substantive claim about the etiology of the distress (social vs. internal) that functions as a new extension-fixing rule: "Disorders must stem from internal dysfunction, not social conflict."

  **Running the Theory: Hume, Moore, Boorse, Wakefield**

  Distinguishing Hume from Moore is crucial here. Hume's is-ought gap warns against deriving normative conclusions from descriptive premises. Moore's naturalistic fallacy warns against defining normative terms (like "good" or "disorder") purely via natural properties. In this episode, both charges were wielded rhetorically but neither strictly landed. Conservatives accused activists of violating Hume (inserting political "oughts" into scientific "is" claims). Activists accused conservatives of committing Moore's fallacy (defining "disorder" as "socially disapproved behavior"). In reality, both sides were negotiating a thick concept where fact and value are entangled. The decision wasn't a derivation from pure facts nor a pure value stipulation; it was a revision of the classification rules themselves.

  Could Boorse's biostatistical theory defend the removal without value premises? Boorse defines disease as a failure of species-typical function. If homosexuality is statistically normal and involves no failure of psychological mechanism, Boorse would classify it as non-pathological factually. However, Boorse struggles with mental disorders where "function" is inherently normative. If the "function" of sexuality is reproduction, homosexuality might look like a dysfunction; if the function is psychological well-being, it does not. Boorse's framework cannot fully escape the value-laden choice of which function to prioritize, so a purely value-free defense fails.

  Wakefield's harmful dysfunction analysis (retroactively applied) makes the episode look like a textbook hybrid case. The "dysfunction" half came up empty (Hooker's data), and the "harm" half did the work. But this exposes a vulnerability in the hybrid analysis: the "harm" condition was settled by a membership vote in 1974, not epistemic inquiry. If "harm" is determined by democratic consensus rather than objective welfare metrics, the hybrid analysis loses its claim to scientific objectivity. It vindicates the structure of the analysis (fact + value) but exposes the instability of the value component when institutionalized.

  **What the Episode Shows About the Theory**

  This episode functions as an anomaly for a strict is-ought framing. The is-ought gap tells you that a conclusion doesn't follow from premises of the wrong kind; it tells you nothing about how to adjudicate a contested thick term when both sides accept mixed premises. The APA decision wasn't blocked by the is-ought gap; it was resolved by changing the rules of the language game. The framing goes silent on the mechanism of resolution: consensus-building, voting, and jurisdictional boundary-setting. It doesn't license calling the decision arbitrary just because a value premise was involved; institutional legitimacy can stabilize value-laden classifications.

  Your extension-fixing story holds for 1973 but requires expansion for 1987. In 1973, the rule changed from "trait is disorder" to "trait is disorder only if distressed." In 1987, the rule changed from "distress indicates disorder" to "distress regarding orientation indicates social conflict, not disorder." This second move relies on a theory of etiology (social vs. internal) that acts as a gatekeeper. The looping problem you identify is real: the classification contributed to the stigma that produced the distress cited as evidence. However, the 1987 deletion suggests the APA eventually recognized that even the distress criterion was part of the loop. The theory needs to account for how scientific communities revise extension-fixing rules not just based on new data, but based on recognizing the feedback effects of their own classifications. The is-ought gap describes the logical structure of the debate, but the history shows the resolution was pragmatic and institutional, not logical.
