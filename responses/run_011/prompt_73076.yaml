answer: |-
  This is a request for a specification of a scientific model, not a forecast. You are asking for the source code of the theory, not the output. That is the correct move. Most "takeoff theories" are not theories; they are narrative families with tunable parameters that allow the author to claim hindsight validity regardless of the outcome.

  Below are the desiderata for a theory of AI takeoff dynamics. Following that is the analysis of the internal tensions and the specific requirement that invalidates the current market leaders.

  ### The Desiderata

  **1. Operationalized Capability Metric**
  *   **Requirement:** The theory must define capability as a measurable quantity $C(t)$ with explicit units (e.g., economic value per watt, log-odds on a fixed task distribution, compression ratio). It must specify the behavior of the theory when $C(t)$ approaches the physical or logical limits of that metric (saturation).
  *   **Rationale:** "Intelligence" is not a scalar. Without a defined metric, "doubling time" is meaningless. If the metric changes (benchmark saturation), the theory must either map the old metric to the new one or declare itself void.
  *   **Tag:** Non-negotiable (All camps)

  **2. Binding Constraint Identification**
  *   **Requirement:** The theory must name the single binding constraint on $\frac{dC}{dt}$ at the onset of takeoff (e.g., compute fabrication, data availability, energy, algorithmic insight, or alignment verification). It must specify the elasticity of capability with respect to this constraint.
  *   **Rationale:** Speed is determined by the tightest bottleneck. A theory that says "it depends on which bottleneck binds" is not a prediction of speed; it is a menu of scenarios. To predict *velocity*, you must know the *friction*.
  *   **Tag:** Non-negotiable (Bottleneck people)

  **3. Endogenous Feedback Specification**
  *   **Requirement:** The model must explicitly represent the loop where $C(t)$ contributes to the production of inputs for $C(t+\Delta t)$. It must quantify the lag time and the efficiency of this recursion (e.g., how many researcher-hours are replaced by one unit of $C$).
  *   **Rationale:** Takeoff is defined by recursive self-improvement. Exogenous growth models (where inputs come from outside the system) are models of *progress*, not *takeoff*.
  *   **Tag:** Non-negotiable (Discontinuity people / Smooth people)

  **4. Parametric Rigidity (No Free Knobs)**
  *   **Requirement:** The theory cannot contain parameters that can be tuned post-hoc to fit both hyperbolic (fast) and exponential (slow) growth curves. The parameters must be fixed by physical constants, economic data, or architectural properties prior to the event.
  *   **Rationale:** This addresses your primary bug. If a model can fit a 1-month doubling time and a 10-year doubling time by adjusting a "friction coefficient," it is not a theory; it is a curve-fitting exercise.
  *   **Tag:** Non-negotiable (Outside-view people)

  **5. Historical Backtestability**
  *   **Requirement:** The theory must be applicable to a historical subset of the data (e.g., 2010–2020) to generate a score. It must explain why the dynamics in the backtest period differ from or resemble the takeoff period.
  *   **Rationale:** If the mechanism is universal, it should leave traces in the past. If the mechanism is novel, the theory must explain the phase transition trigger.
  *   **Tag:** Preference (Outside-view people / Smooth people)

  **6. Reference Class Calibration**
  *   **Requirement:** The predicted growth rates must be compared against a specified reference class of technological diffusion or capability scaling (e.g., biotech, nuclear, software). The theory must justify why AI belongs to this class or why it deviates.
  *   **Rationale:** Prevents "AI is special" hand-waving. Forces the theory to pay the outside-view tax.
  *   **Tag:** Preference (Outside-view people)

  **7. Phase Transition Discrimination**
  *   **Requirement:** The theory must provide a criterion to distinguish a genuine dynamical jump (discontinuity in $\frac{dC}{dt}$) from a measurement artifact (change in benchmark difficulty or scope).
  *   **Rationale:** Prevents mistaking a change in the ruler for a change in the object being measured.
  *   **Tag:** Preference (Discontinuity people)

  ---

  ### The Tension: Which Pair Cannot Be Jointly Satisfied?

  You suspected **Backtestability** and **No Free Knobs** are in tension. I argue they are not. In fact, they are allies: a rigid theory is easier to backtest because it makes risky predictions.

  The true incompatibility lies between **Endogenous Feedback Specification** and **Historical Backtestability**.

  **The Argument:**
  A theory of *takeoff* is, by definition, a theory of a regime where the system is meaningfully contributing to its own improvement (Endogeneity). However, in the historical data available for backtesting (the last 10–15 years of deep learning), this loop was not closed. Models did not design the next generation of models; researchers did. The inputs were exogenous.

  Therefore:
  1.  If you enforce **Endogeneity**, you are modeling a mechanism that has not yet operated at scale. You cannot backtest it on data where the mechanism was absent.
  2.  If you enforce **Backtestability**, you are forced to model the pre-takeoff regime where inputs were exogenous. You are then not modeling takeoff dynamics; you are modeling *investment* dynamics.

  To claim you have satisfied both is to claim that the pre-takeoff era already exhibited the recursive feedback loop of the takeoff era. This is the core assumption of the "Smooth/Continuous" camp, but it is an assumption, not a testable feature of the past data. The "Discontinuity" camp correctly identifies that the feedback loop is the phase transition, which renders backtesting impossible by definition.

  **Verdict:** You cannot have a theory that relies on a mechanism (RSI) that is not present in the data you use to test the theory. One must yield. Either you admit you cannot backtest the takeoff mechanism (sacrificing Backtestability), or you admit your model is only valid for the pre-takeoff regime (sacrificing Endogeneity).

  ---

  ### The Killer Requirement

  The single requirement that knocks out the most popular accounts currently in circulation is **Parametric Rigidity (No Free Knobs)**.

  **Why:**
  Most circulating "theories" (e.g., standard Fast/Slow Takeoff narratives, many economic growth models applied to AI) are actually **scenario families**. They operate on conditional logic:
  *   *"If data is the bottleneck, growth is slow."*
  *   *"If algorithmic insight is the bottleneck, growth is fast."*
  *   *"If alignment is hard, there is a pause."*

  This structure allows the author to survive any evidence. If takeoff is slow, they point to the data bottleneck. If it is fast, they point to the algorithmic insight. This is a "free knob." The parameter determining the speed is not fixed by the theory; it is selected by the outcome.

  A theory with **Parametric Rigidity** must state *now*, before the event, which bottleneck binds and what the elasticity is. It must say: *"Compute density is the binding constraint, and it scales with economic investment at elasticity $E=0.8$."* If the event happens and data was actually the constraint, the theory is falsified.

  **The Casualty List:**
  *   **The "It Depends" Narratives:** Eliminated. These are the majority of blog-post scale theories.
  *   **The "Continuous Growth" Models (e.g., standard AI Impacts style):** Often eliminated because they frequently tune the "automation of R&D" parameter to fit a smooth curve, rather than deriving it from architectural constraints.
  *   **The "Hard Takeoff" Stories:** Often eliminated because they rely on a "cognitive threshold" parameter that is undefined until the jump occurs.

  **Conclusion:**
  If you enforce **Parametric Rigidity**, you will find that there are almost no theories of AI takeoff in circulation. There are only taxonomies of possibilities. The list of desiderata itself is the result: the field currently possesses a vocabulary for discussing takeoff, but not a physics.
