answer: |-
  **The Unexhausted Remainder: A Critical Reading of the Closing Sequences of *Schindler's List***

  To screen the final twenty minutes of *Schindler's List* in a seminar on the demandingness objection is to risk a category error. There is a temptation to treat Oskar Schindler's breakdown as a cinematic proof of Peter Singer's principle of marginal utility: that we ought to give until the point where giving more causes as much suffering to ourselves as it relieves in others. If we allow the film to function merely as an illustration, we reduce the philosophical problem to a sentimental one, suggesting that the force of the demandingness objection is measured by the volume of tears shed. Instead, we must treat the film as a stress test for the architecture of moral theory. The sequences following the German surrender do not resolve the debate; they expose the phenomenological cost of the theories we have been dissecting.

  **I. The Structural Nature of the Demand**

  The first philosophical pressure point the film applies is the distinction between a threshold of sacrifice and the structural nature of beneficence. In the courtyard of the factory, after the guards have departed, Schindler addresses the workers he has saved. He is financially ruined; he has spent his fortune on bribes and black-market provisions to sustain the list. By any threshold-based account of morality, he has exceeded the call of duty. He has nothing left to give.

  Yet, in the subsequent scene, alone in the factory office, Schindler collapses. He does not weep for the dead in the abstract; he weeps for the specific marginal utility he failed to capture. He tallies his gold party pin and his luxury car, converting them instantly into human lives—two lives for the pin, more for the car. This moment illuminates the concept of the *unexhausted remainder*. The demand of beneficence here is not a fixed sum that, once paid, grants the agent moral rest. It is a function of the need itself. Because the need (the number of Jews targeted for extermination) was finite but vast, and his resources were finite but exhaustible, the gap between the two generates a moral remainder that persists even after total exhaustion.

  Schindler's grief suggests that demandingness is not merely a question of "how much is too much" for the agent, but a structural feature of the moral landscape when viewed through a consequentialist lens. The demand expands to absorb whatever resources are brought to it. Schindler's realization is that so long as resources existed that *could* have been converted into life, the moral requirement was not met. The film thus validates the hardest interpretation of the demandingness objection: that without a hard stop, the moral demand is infinite relative to finite human capacity. Schindler's breakdown is the psychological manifestation of hitting the limit of the self against the infinity of the need.

  **II. Murphy's Compliance Condition and the Burden of Slack**

  This structural reading invites a confrontation with Liam Murphy's compliance condition. Murphy argues that an individual's duty of beneficence is determined by what they would owe if everyone else complied with their fair share. One does not owe compensation for the failure of others to do their part. In the context of the Holocaust, the "others" are the German populace, the industrialists who used slave labor without protecting it, and the international community that remained silent.

  Schindler's grief is precisely a grief over the surplus that Murphy claims he does not owe. He is lamenting the lives lost because *others* did not save them. He is internalizing the non-compliance of the world as a personal moral failure. If Murphy is correct, Schindler's anguish is irrational; he saved his "share" (and vastly more), and the rest is not on his ledger.

  However, the film complicates Murphy's diagnosis. In ordinary circumstances, Murphy's condition protects agents from being crushed by the collective failure of society. But in the extremity of the film's context, Murphy's framework risks looking like a license for complacency. If Schindler had accepted Murphy's condition, he would have left the factory with his fortune intact, having done "enough." The film posits that there are historical moments where the "fair share" is morally insufficient because the stakes are existential. The film does not necessarily prove Murphy wrong as a matter of general principle, but it exposes the fragility of the compliance condition when the background institutions of justice have totally collapsed. Schindler's suffering vindicates the intuition that in a broken world, the moral burden shifts disproportionately to those who *can* act. The film makes Murphy look technically coherent but morally thin; it suggests that while we may not *owe* the slack of others, the moral weight of that slack may still crush us if we possess the capacity to lift it.

  **III. Saints, Integrity, and Agent-Regret**

  Finally, we must weigh Schindler's collapse against Susan Wolf's argument against moral saints and Bernard Williams' concerns regarding integrity and agent-regret. Wolf contends that a life devoted exclusively to moral value is unattractive and that we value persons for their non-moral virtues and projects. Williams argues that moral luck and personal projects constitute integrity, and that "agent-regret" is distinct from general regret because it is tied to one's specific causal role.

  Schindler presents a paradox for Wolf. He begins the film as the antithesis of a moral saint: a profiteer, an adulterer, a member of the Nazi party. He ends it as a man stripped of all non-moral projects. He has no money, no status, and no future security. His only remaining project is the moral accounting of his past actions. In Wolf's terms, he has become a saint, and the result is a man broken by his own goodness. However, the film's veneration of him contradicts Wolf's claim that saints are unattractive or one-dimensional. We are drawn to Schindler *because* of this transformation. The film suggests that in contexts of radical evil, the "moral saint" is not a bore but a necessity, and the sacrifice of non-moral virtues is not a loss of humanity but its recovery.

  Regarding Williams, Schindler's breakdown is a pure expression of agent-regret. He does not say, "It is a tragedy that more died." He says, "I could have got more out." He is fixated on his own agency, his own specific failures to convert matter into life. This aligns with Williams' view that we are specially responsible for what we do. However, Williams worries that consequentialism alienates us from our projects. Schindler's project *became* consequentialist maximization. The film shows the cost of that alignment: when the project is saving lives, and the saving is incomplete, integrity is shattered. The film illustrates Wolf and Williams by showing the wreckage of a man who subordinated his integrity entirely to the moral outcome, yet it refuses to judge that subordination as a mistake. It asks whether integrity is a luxury that survives only when the world is not on fire.

  **IV. Where the Reading Gives Out**

  There are limits to what these sequences can bear in a seminar on ordinary beneficence. First, the extremity of the circumstances disqualifies the film as evidence for standard demandingness debates. We are not usually asked to trade luxury cars for lives; we are asked to trade discretionary income for famine relief. The stakes in *Schindler's List* are absolute, which skews the calculus. A theory that demands everything in a genocide may not demand everything in a peacetime economy. To treat Schindler's ruin as a model for ordinary moral duty is to risk moral burnout in contexts where incremental aid is the norm.

  Second, the epilogue shifts the register from narrative to testimony, and in doing so, it quietly changes the object of attention. The transition from black-and-white to color, and the procession of the real survivors (the "Schindlerjuden") placing stones on the grave alongside the actors, moves the focus from Schindler's psychological burden to the survivors' continued existence. This shift silences the demandingness objection not by answering it, but by rendering it irrelevant. The question is no longer "Did Schindler sacrifice too much?" but "Look what his sacrifice produced." The epilogue validates the *outcome* over the *agent's burden*. It suggests that the moral worth of the act is located in the beneficiaries, not the sacrificer. This undermines the seminar's focus on the agent's perspective. If the value lies entirely in the survival of the Jews, then Schindler's internal regret is secondary, and the demandingness objection (which cares about the agent's welfare) is sidelined. The film ultimately celebrates the result, whereas the philosophy worries about the cost.

  **V. What the Film Contributes**

  If the reading gives out at the edge of extremity and the shift to testimony, what remains is the film's unique contribution to the debate. Philosophical arguments regarding demandingness operate in the register of coherence and justification. They ask what we can rationally require of an agent. *Schindler's List* operates in the register of residue.

  Arguments cannot show you what it looks like when a human being realizes that their best was not enough. They cannot dramatize the phenomenology of the unexhausted remainder. The film contributes a visceral account of the *cost* of moral clarity. It shows that the demandingness objection is not just a theoretical worry about the limits of obligation, but a description of a specific kind of grief—the grief of the capable survivor who knows that capability had a limit.

  Furthermore, the film forces us to confront the possibility that the demandingness objection is not a refutation of consequentialism, but a description of a broken world. Schindler should not have had to choose between his fortune and his conscience; the world should not have been structured such that pins and cars were the currency of survival. The film suggests that the "demand" is only excessive because the need is excessive. By screening these sequences, we do not settle the objection. Instead, we are left with the uncomfortable realization that while Murphy, Wolf, and Williams may offer us shelter from the demand, Schindler's tears suggest that in the face of radical evil, shelter may be indistinguishable from complicity. The film does not solve the problem of demandingness; it ensures we cannot look away from the human face of the demand.
