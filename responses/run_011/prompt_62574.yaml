      *   *Decoration vs. Load-bearing:* The load-bearing claim is "Normative grip requires CKR." The decoration is "Relaxations inherit plausibility from CKR." The decoration is false because relaxations like Level-k have independent psychological plausibility.

  5.  **Drafting the Response (Iterative refinement):**
