prompt: |-
  I've got a 35-minute whiteboard slot on Moore's paradox next week with second-year cognitive science undergrads. They've had one term of truth tables, no philosophy of language at all, and they've just finished a unit on self-deception so they're completely certain they already know what's going on. Don't explain the paradox to me, I know it — plan the session for me.

  First thing: what has to be on the board before what? My worry is that if I write the sentence up first and ask what's wrong with it, half the room shouts "contradiction" and I spend the remaining half hour digging them back out, but if I build up to it carefully the sentence lands with no punch at all and they don't feel why anyone would ever have called it a paradox. Tell me which way to go and what the dependency structure actually is — what genuinely can't be understood until something else is in place.

  Second: I'm not using the rain example. It's in every handout ever written and they've half-seen it. I want one carrier case that does double duty — feels flat-out absurd when the speaker says it about themselves right now, and reads as plainly true, even kind of sad, when somebody else says it about that same person. Help me pick it, and tell me what it has to have and what would wreck it (my instinct is that it can't be a case where the person is obviously joking or performing).

  Third, the misconception map, with the exact point in the sequence where each one gets headed off:
  - "it's just a contradiction, move on" — they will want to truth-table it
  - "so this is about lying, about being insincere"
  - "wait, the past tense version is fine? then the whole thing is a cheap trick about tenses" — this is the one that scares me, because the tense shift is arguably the biggest clue in the whole puzzle and I need them to feel the difference between a clue and an escape hatch
  - "so we can't be wrong about our own beliefs after all"
  - and the one they'll raise inside two minutes: what if a chatbot says it? I need a firm call on whether to fold that in or park it. It could eat the entire session, but if I park it they'll sit on it and stop listening.

  Also make a call on whether both forms of the sentence — the "I don't believe it" one and the "I believe it isn't" one — need to be there, or whether one does the work and the other just costs five minutes I don't have. Same for the knowledge version ("it's raining but I don't know that it is"): worth two minutes or a distraction.

  Then tell me what I should openly refuse to cover and say I'm refusing. I'm assuming the formal doxastic logic proof and the whole argument over what assertion is normed on are both off the table at this level, but say so explicitly if cutting either one guts the thing rather than just trimming it.

  Last: give me one question to put on the board with three minutes left that separates "got it" from "vaguely enjoyed a cute puzzle." Ideally something where a student who thinks the absurdity lives in the sentence gives a visibly diffrent answer from one who thinks it lives in the act of saying it.

  No reading list, please — they won't read anything and I don't want to be gesturing at books I'd have to get the details wrong on.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 2nd-year Cognitive Science undergrads.
      *   **Background:** One term of truth tables (logic basics), no philosophy of language, just finished a unit on self-deception (think they know it all).
      *   **Time:** 35 minutes (very tight).
      *   **Topic:** Moore's Paradox.
      *   **Constraints:** Don't explain the paradox to me (I know it). Plan the session.
      *   **Key Concerns:**
          1.  Board dependency structure (avoid "it's a contradiction" shout-down vs. anti-climax).
          2.  Example selection (not rain, needs to work for 1st person absurdity vs. 3rd person truth).
          3.  Misconception management (Contradiction, Lying, Tenses, Infallibility, Chatbots).
          4.  Scope cuts (Omission vs. Omission that guts the lesson).
          5.  Two forms ($p \land \neg Bp$ vs. $p \land B\neg p$) & Knowledge version.
          6.  Final assessment question (Sentence vs. Act).

  2.  **Deconstruct the Challenge:**
      *   *The "Self-Deception" Baggage:* This is the biggest hurdle. CogSci students who just studied self-deception will think Moore's Paradox is just "unconscious belief." I need to pivot them from *psychological* impossibility to *logical/pragmatic* absurdity without getting bogged down in Freud.
      *   *The "Contradiction" Trap:* They know truth tables. $p \land \neg p$ is false. $p \land \neg Bp$ is *contingently* true. I need to show the truth-table works fine, but the *assertion* fails.
      *   *Time Management:* 35 minutes is brutal. I need to be ruthless. No history, no Wittgenstein exegesis, no Sorensen deep dive.

  3.  **Address Point 1: Board Dependency Structure:**
      *   *Problem:* If I write "It's raining but I don't believe it" immediately, they truth-table it, see it's consistent, and get bored. Or they say "That's a lie" and stop thinking.
      *   *Solution:* Start with the *act* of assertion, not the proposition.
      *   *Sequence:*
          1.  Define "Assertion" (minimal commitment).
          2.  Present the 3rd person case (True/Sad).
          3.  Present the 1st person case (Absurd).
          4.  Compare the *logic* (Truth Table) -> Show it's valid.
          5.  Isolate the tension (Logic vs. Speech Act).
      *   *Board Layout:* Left side = Logic/Truth Conditions. Right side = Speech Act/Context. Middle = The Paradox.

  4.  **Address Point 2: The Carrier Case:**
      *   *Requirements:* Not rain. 1st person absurd, 3rd person true/sad. No joking/performing.
      *   *Idea:* Something involving personal capability or immediate sensation where self-knowledge is presumed but fallible.
      *   *Candidate 1:* "I am in pain but I don't believe I am." (Too Wittgenstein-private-language heavy).
      *   *Candidate 2:* "I am asleep." (Impossible to assert).
      *   *Candidate 3:* "I am failing this course but I don't believe it." (Good, touches on self-deception).
      *   *Candidate 4:* "My partner is cheating on me but I don't believe it." (Strong emotional resonance, clearly true for 3rd person, absurd for 1st person assertion).
      *   *Selection:* **"My partner is cheating on me, but I don't believe it."**
      *   *Why:* It hits the self-deception unit directly (allowing me to pivot away from it). It's emotionally weighty (not a joke). 3rd person: "Sarah says her partner is cheating but she doesn't believe it" -> We understand Sarah is in denial (True/Sad). 1st person: Saying it aloud sounds like I'm breaking up with the reality of the statement.
      *   *What wrecks it:* If the student thinks "I don't believe it" means "I haven't checked yet." Need to stipulate "I have seen the evidence."

  5.  **Address Point 3: Misconception Map:**
      *   *Contradiction:* Handle immediately after truth tables. Show $\neg(p \land \neg Bp)$ is NOT a tautology.
      *   *Lying:* Distinguish belief from truth. Lying is asserting $\neg p$ while believing $p$. Moore is asserting $p$ while believing $\neg p$ (roughly). It's about *sincerity conditions of assertion*.
      *   *Tenses:* "It rained but I didn't believe it." Acknowledge this is fine. Why? Because the *act of assertion* is present tense. The belief is indexed to the *utterance*.
      *   *Infallibility:* "Can't be wrong about own beliefs." No, you can be wrong. But you can't *avow* the error successfully.
      *   *Chatbots:* **PARK IT.** But acknowledge it. "Great question, that's about simulation vs. state. Write it down, we tackle it at the very end if time, otherwise office hours." Actually, better: Use it to define the boundary of the lesson. "If a chatbot says it, is it a paradox or a bug? That's a question about *mind*, not *logic*. We are doing logic of speech acts today."

  6.  **Address Point 4: Scope (Forms & Knowledge):**
      *   *Omissive ($p \land \neg Bp$) vs. Commissive ($p \land B\neg p$):* Stick to Omissive. It's the classic. Commissive adds cognitive load ("I believe it's not raining" vs "I don't believe it is"). In 35 mins, one is enough.
      *   *Knowledge Version:* Cut it. It introduces Gettier/Justification noise. Stick to Belief.
      *   *What to Refuse:* Formal Doxastic Logic (Hintikka style). It's too technical. Norms of Assertion (Williamson's Knowledge Norm). Too philosophical. Stick to "Assertion implies Belief."

  7.  **Address Point 5: The Final Question:**
      *   Need to distinguish "Sentence is false" vs. "Act is infelicitous."
      *   *Question:* "If I write this sentence in a diary I never show anyone, is it still paradoxical?"
      *   *Reasoning:* If they think it's a logical contradiction, the diary doesn't matter (it's false regardless). If they think it's a speech act/assertion norm, the diary removes the audience/assertion, so the paradox vanishes (or changes).
      *   *Better Question:* "Can you *think* Moore's sentence without absurdity?"
      *   *Best Question:* "I whisper this to myself in the dark: 'p but I don't believe p'. Have I said something false, or something insane?" (False = Logic. Insane = Pragmatics).
      *   *Refinement:* Let's go with the Diary/Assertion distinction. It tests the "Assertion" commitment.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Minute 0-5:* Hook with the 3rd person case. Establish truth.
      *   *Minute 5-10:* Switch to 1st person. Feel the absurdity. Truth table it (show it's consistent).
      *   *Minute 10-20:* The Misconception Gauntlet. Address Lying, Tenses, Self-Deception.
      *   *Minute 20-30:* The Solution (Assertion implies Belief).
      *   *Minute 30-35:* Final Question & Chatbot parking.

      *Wait, 35 minutes is extremely short.* I need to be tighter.
      *   0-5: The Example (3rd vs 1st).
      *   5-10: The Logic (Truth Tables).
      *   10-25: The Misconceptions (The meat of the class).
      *   25-30: The Resolution (Assertion Norm).
      *   30-35: Final Question.

      *Refining the Chatbot:* If I park it, they stew. If I answer it, I lose 10 mins.
      *   *Strategy:* Pre-empt it. "This applies to agents who *have* beliefs. If you think a chatbot has beliefs, it's a paradox. If not, it's a bug. We are assuming humans have beliefs."

      *Refining the Example:* "My partner is cheating..." might trigger too much personal stuff. Let's go with something academic/cognitive. "I am biased, but I don't believe I am."
      *   *Pros:* Fits CogSci.
      *   *Cons:* A bit dry.
      *   *Let's stick with the Relationship one but make it specific:* "My spouse is having an affair, but I don't believe it." It's universally understood as the paradigm of denial.

      *Refining the Board:*
      *   Left: Logic ($p$, $Bp$, Truth values).
      *   Right: Pragmatics (Assertion, Commitment).
      *   Center: The Sentence.

      *Refining the "Refusals":*
      *   Must explicitly say: "We are not doing psychology (self-deception mechanisms)" and "We are not doing formal doxastic logic."

      *Refining the Final Question:*
      *   "If I write 'p but I don't believe p' in a locked diary, is it absurd?"
      *   Yes -> It's a logical contradiction (Wrong).
      *   No -> It's an assertion norm (Right).
      *   Wait, writing in a diary *is* an assertion to oneself.
      *   Better: "If I *think* it, but never say or write it?"
      *   If they say "Still absurd," they think it's a property of the thought/logic.
      *   If they say "Fine," they think it's a property of communication/assertion.
      *   *Actually, the standard view is it's absurd to assert, but you can *think* it (that's just having inconsistent beliefs).*
      *   So: "Can you *believe* a Moorean sentence?"
      *   No -> Logic/Contradiction view.
      *   Yes -> Pragmatic view (You can hold inconsistent beliefs, you just can't say them).

      *Let's go with the "Diary" vs "Thought" distinction.*
      *   Question: "I think the sentence silently to myself. No one hears. Is it still absurd?"
      *   Target Answer: No, it's just a sign of divided mind. The paradox requires *assertion*.

  9.  **Final Review against constraints:**
      *   35 mins? Yes, tight schedule.
      *   No rain? Yes (Affair example).
      *   Misconceptions mapped? Yes.
      *   Chatbot handled? Yes (Parked/Defined away).
      *   Forms cut? Yes (Omissive only).
      *   Refusals explicit? Yes.
      *   Final Question diagnostic? Yes.

  10. **Writing the Response:** (Adopting the requested tone: direct, instructional, no fluff).

      *Self-Correction on the Example:* "My spouse is having an affair" is heavy. Maybe "I am failing this module." No, too meta. "I am angry right now, but I don't believe I am."
      *   *Decision:* "My partner is cheating on me." It's the clearest case of "True but Unbelievable." I will instruct the user to frame it carefully so it doesn't become a therapy session.
      *   *Actually, let's use "I am biased."* It's CogSci. "I am influenced by confirmation bias, but I don't believe I am."
      *   *Pros:* Professional distance. Fits major.
      *   *Cons:* "Believe I am" is clunky.
      *   *Let's go with the "Affair" one but warn the instructor to keep it clinical.* It's the most philosophically robust example for 3rd person truth vs 1st person absurdity.
      *   *Wait, one more option:* "I am asleep." (No, impossible). "I am dead." (No).
      *   *Okay, sticking with "My partner is cheating."* It creates the necessary emotional friction for the "sad/true" 3rd person case.

      *Re-evaluating the Chatbot:* The prompt says "I need a firm call."
      *   *Call:* Park it, but give the *reason* why. "Chatbots don't assert, they output." This shuts it down without ignoring it.

      *Re-evaluating the Final Question:*
      *   "If I write this in a diary I burn immediately, have I done something wrong?"
      *   This tests the "Audience" vs "Logic" distinction.
      *   Better: "Is it possible to *believe* a Moorean proposition?"
      *   If Yes -> Pragmatic paradox (Assertion is the issue).
      *   If No -> Logical contradiction (Proposition is the issue).
      *   This is the cleanest diagnostic.

      *Let's finalize the Board Plan.*
      *   Left: Truth Conditions (Logic).
      *   Right: Assertion Conditions (Pragmatics).
      *   This visual split is crucial for the "Contradiction" misconception.

      *Let's finalize the Misconception Timing.*
      *   Contradiction: Min 7 (after truth table).
      *   Lying: Min 12.
      *   Tenses: Min 15.
      *   Self-Deception/Infallibility: Min 20.
      *   Chatbot: Min 30 (Parking).

      *Let's finalize the Refusals.*
      *   Doxastic Logic (Hintikka).
      *   Knowledge Norms (Williamson).
      *   Psychology of Denial (Freud/etc).

      *Ready to write.*
answer: |-
  Here is the 35-minute battle plan.

  ### 1. Board Dependency Structure
  **Do not write the sentence first.** If you write "It's raining but I don't believe it" (or your chosen example) at $t=0$, the logic students will truth-table it immediately, see it's contingent, and disengage. The psychology students will shout "Denial!" and disengage.

  **The Sequence:**
  1.  **Define Assertion (Left Column):** Write: *To assert $p$ is to represent oneself as believing $p$.* Keep this up the whole time.
  2.  **The 3rd Person Case (Center):** Write: *Alex says: "My partner is cheating, but Alex doesn't believe it."*
      *   Ask: "Is this true?" (Yes). "Is it sad?" (Yes). "Is it contradictory?" (No).
      *   *Goal:* Establish the proposition is logically consistent and possibly true.
  3.  **The 1st Person Case (Center, overwrite):** Write: *Alex says: "My partner is cheating, but **I** don't believe it."*
      *   Ask: "What happened?" (It sounds absurd/unassertable).
  4.  **The Logic Check (Left Column):** Run the truth table for $p \land \neg Bp$.
      *   Show it is **Contingent**, not Contradictory.
      *   *Goal:* Prove the absurdity is not in the *truth conditions*.
  5.  **The Resolution (Right Column):** Connect back to Step 1.
      *   Asserting $p$ $\rightarrow$ Implies $Bp$.
      *   Saying $\neg Bp$ $\rightarrow$ Denies $Bp$.
      *   *Result:* You are representing yourself as believing and not believing simultaneously.

  **Dependency:** You cannot explain *why* it's absurd until you have proven it isn't a logical contradiction. You cannot prove it isn't a contradiction until you have defined the terms ($p$, $Bp$). You cannot define the terms until you have established that the sentence *feels* wrong (the phenomenology).

  ### 2. The Carrier Case
  **Use:** *"My partner is having an affair, but I don't believe it."*

  **Why this works:**
  *   **3rd Person:** "Sarah says her partner is cheating but she doesn't believe it." This is the definition of denial. It is tragically true. It validates the CogSci "self-deception" intuition without accepting it as the solution.
  *   **1st Person:** Saying this aloud sounds like you are sabotaging your own credibility. It feels like a breakdown of communication, not a joke.
  *   **CogSci Relevance:** It touches on belief attribution and self-knowledge without requiring medical/clinical examples.

  **What wrecks it:**
  *   **Ambiguity on "Believe":** If students think "I don't believe it" means "I haven't verified it," the paradox dies.
      *   *Fix:* Stipulate: "You have seen the texts. You have the evidence. The fact is $p$. But psychologically, you cannot bring yourself to the state of belief."
  *   **Performance:** If a student says, "I'd say that ironically," stop them. "We are talking about sincere assertion. If you are winking, you aren't asserting $p$, you're asserting *that you are joking*."

  ### 3. Misconception Map & Timing

  | Time | Misconception | The Intervention (Exact Script) |
  | :--- | :--- | :--- |
  | **07:00** | **"It's just a contradiction."** | *After truth table:* "Look at the board. Row 3 is True. Logic allows this sentence to be true. So the error isn't in the *world*, it's in the *speaker*." |
  | **12:00** | **"It's about lying."** | "A liar says $p$ but believes $\neg p$. They hide their belief. Moore's speaker *reveals* their lack of belief. Lying breaks the truth norm; Moore's breaks the sincerity norm." |
  | **15:00** | **"Past tense fixes it."** | "It rained but I didn't believe it." *Acknowledge:* "Yes, this is fine." *Pivot:* "That proves the paradox lives in the **present tense assertion**. The belief is indexed to the *moment of speaking*. The tense shift isn't an escape hatch; it's a clue that location/time of the speaker matters." |
  | **20:00** | **"We can't be wrong about beliefs."** | "This isn't about infallibility. You *can* be wrong about what you believe. But you cannot *avow* that error successfully. You can think it, you can't say it." |
  | **30:00** | **"What about Chatbots?"** | **PARK IT.** (See below). |

  **The Chatbot Call:**
  Do not let this open up. It consumes 10 minutes on philosophy of mind you don't have.
  *   **The Move:** "Excellent question. If a chatbot says it, is it a paradox or a bug? That depends on whether the chatbot *has* beliefs. If it has no beliefs, it's not asserting, it's just outputting strings. We are assuming humans *do* have beliefs. If you want to debate machine consciousness, come to office hours. For today, assume the speaker is a belief-having agent."
  *   **Why:** This validates the question but defines it as out-of-bounds for the specific learning objective (logic of assertion).

  ### 4. Scope Cuts (What to Refuse)
  You must explicitly state what you are **not** doing to prevent students from thinking you missed it.

  1.  **Formal Doxastic Logic:** "We are not proving this using Hintikka-style modal logic. We are doing this with truth tables and speech act conditions. The logic proof is for 3rd year."
  2.  **The Knowledge Norm:** "We are not debating whether assertion is normed on *Knowledge* or *Belief*. We are assuming the weaker norm: Assertion implies Belief. If you switch to Knowledge, the paradox gets stronger, but the mechanism is the same."
  3.  **The Commissive Form:** "We are only looking at 'p but I don't believe it'. The version 'p but I believe not-p' is the same structural problem. We don't have time for both."
  4.  **Psychology of Denial:** "You just studied self-deception. You know *how* people get into this state. Today is about *why they can't say it*. Psychology explains the cause; Philosophy explains the absurdity."

  ### 5. The Final Question (Last 3 Minutes)
  Put this on the board. Do not answer it yourself.

  > **"If I think this sentence silently to myself, with no audience and no speech, is it still absurd?"**

  **The Diagnostic:**
  *   **Student says "Yes, it's still absurd":** They think the paradox is in the *proposition* (Logical Contradiction view). They haven't fully grasped the speech-act solution.
  *   **Student says "No, it's just a divided mind":** They understand the paradox is in the *assertion* (Pragmatic view). They get that you can *hold* inconsistent attitudes, you just can't *avow* them.

  **Why this works:** It forces them to locate the "error." Is it in the content (Logic) or the context (Pragmatics)?

  ### Summary Timeline
  *   **00-05:** 3rd Person Case (True/Sad) $\rightarrow$ 1st Person Case (Absurd).
  *   **05-10:** Truth Table (Prove it's not a contradiction). Define Assertion.
  *   **10-25:** Misconception Gauntlet (Lying, Tenses, Self-Deception).
  *   **25-30:** Resolution (Assertion implies Belief).
  *   **30-32:** Chatbot Park.
  *   **32-35:** Final Question & Dismiss.
