      *   *Superposition:* This is the killer. 1 neuron $\neq$ 1 feature.
      *   *The "Normal" Trace:* Who defines normal? If the model is deceptive, the deceptive trace *is* the normal trace for that context.
      *   *Better Analogy:* **Forensic Analysis of a Foreign Power Grid.** You know what electricity looks like, but you don't know the intent of the controllers, and the wiring is undocumented. Or **Obfuscated Code**. Let's use **Obfuscated/Compiled Binary without Symbols**. It keeps the "code" framing but removes the "readable source" assumption.

