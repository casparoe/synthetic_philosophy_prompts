      *   *Regression Tests:* Evaluation datasets/Prompt suites.
      *   *Version History:* Checkpoints during training.
      *   *Compiler:* Gradient Descent/Optimizer.

  4.  **Analyzing the Failures (The "Disanalogies"):**

      *   *Identity:* In code, `func_A` is `func_A`. In nets, a "function" is a subspace of activation. It can move (weight averaging), split (parallel pathways), or merge (superposition).
      *   *Boundaries:* Code has explicit boundaries. Nets have soft boundaries (residual streams, overlapping features).
      *   *Specification:* Code is written *to* a spec. Nets emerge *from* data + loss. There is no ground truth "intended behavior" other than minimizing loss.
      *   *Obfuscation:* Code is usually readable (ideally). Nets are inherently "compiled" (opaque).

  5.  **Evaluating the "Cheap Detection" Claim:**

      *   Does anomaly detection work like a call graph?
      *   *Threat:* If mechanisms are distributed, an anomaly might look like normal noise. If mechanisms are polysemantic, a "normal" activation might hide a "deceptive" computation sharing the same neurons.
      *   *Threat:* If the "spec" is just "next token prediction," a deceptive plan *is* a valid way to minimize loss. It won't look anomalous against the training objective.
      *   *Conclusion:* The claim that you don't need to know what you're looking for is likely false. You need a model of *normalcy*, and defining normalcy is hard without knowing the failure modes.

  6.  **Addressing "Mechanism Identity":**

      *   This is the user's specific sticking point.
