      *   In networks: Identity is functional/semantic (what does it compute?). But this is hard to measure.
      *   *Smearing:* Weights aren't discrete.
      *   *Reimplementation:* Different weights can compute the same function (loss landscape symmetries).
      *   *Duplication:* Redundancy is common in nets, rare in clean code.

  7.  **Distinguishing Cosmetic vs. Threatening:**

      *   *Cosmetic:* Weights are floats, not bits. (Doesn't change logic much).
      *   *Threatening:* Superposition (more features than dimensions). This breaks the "one function = one subroutine" map.
      *   *Threatening:* Non-modularity. Changing one weight affects everything slightly. In code, changing a function is local.

  8.  **The "Fixed Specification" Smuggle:**

      *   The analogy assumes there is a "correct" call graph.
      *   In AI, the "correct" behavior is defined by the user, but the network optimizes for *proxy* objectives.
