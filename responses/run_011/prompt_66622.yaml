answer: |-
  You are describing a specific epistemic failure mode that sits at the intersection of genealogy, narratology, and evidence evaluation. It is a composite phenomenon: it requires a genealogical link (dependence), a narrative mechanism (accretion/embellishment), and a methodological error (mistaking dependence for independence). Because it spans these disciplines, no single term captures the whole shape. Most existing terms describe the *transmission* (how the text moved) or the *growth* (how the story changed), but not the *verification error* (why we believe the new details).

  In journalism, **Circular Reporting** captures the recycling of claims but implies a static loop; it doesn't account for the *enrichment* that makes the later versions seem more authoritative. In folklore, **Narrative Accretion** describes the addition of details (the dog's name, the dialogue) but treats it as a cultural process rather than an evidentiary trap; it explains why the detail exists, not why a researcher mistakenly treats it as verified. In law and historiography, **Dependent Testimony** identifies the lack of independence, but it is a binary status (dependent vs. independent) that doesn't capture the seductive *quality* of the added details.

  Textual criticism comes closest with **Agreement in Error** (*communio errorum*). If two manuscripts share a specific mistake, they are related. However, this concept is used to *prove* dependence, whereas your problem is the researcher's failure to *detect* that dependence because the "error" looks like plausible detail. Similarly, **Source Contamination** implies a mixing of streams, whereas your case is a linear descent where the stream gets muddier but is treated as clearer.

  Since no established term combines the *genealogical dependence*, the *narrative enrichment*, and the *false verification*, I propose we coin a term for this specific wall you are hitting.

  ### Proposed Coinage: Phantom Corroboration

  **Definition:** *Phantom Corroboration* occurs when specific details invented or embellished in a derivative source are treated as verified facts because they appear in multiple downstream accounts that are mistakenly assumed to be independent witnesses. The "corroboration" is an illusion created by the branching of a single contaminated lineage.

  **Boundary Cases (What it is not):**
  1.  **True Independent Corroboration:** Two witnesses see the same event and record the same detail without consulting each other. (Here, the genealogy is separate).
  2.  **Simple Circular Reporting:** Source A cites Source B, and Source C cites Source A, but no *new* details are added; the claim is just repeated. (Here, there is no enrichment to seduce the researcher).
  3.  **Oral Variation:** A story changes in retelling, but the variations contradict rather than confirm each other. (Here, there is no false consensus).

  **The Rough Test:**
  To distinguish *Phantom Corroboration* from genuine agreement, apply the **Specificity Gradient Test**. In genuine independent testimony, specific details (names, dialogue, clothing) tend to degrade or diverge over time due to memory loss. In *Phantom Corroboration*, specific details *increase* or *crystallize* over time. If later accounts are consistently *more* detailed than earlier ones, yet agree on those details, suspect a single lineage with accretive embellishment rather than independent witnesses.

