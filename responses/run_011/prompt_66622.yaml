  | **Narrative Accretion** | Folklore / Oral Tradition | The process by which stories gain detail, symbolism, or complexity over retellings. | Describes the *growth* mechanism, but not the *epistemic error* of treating that growth as verification. | 3 |
  | **Dependent Testimony** | Law / Historiography | Evidence where one witness derives their account from another rather than direct observation. | Identifies the lack of independence, but doesn't capture how *invented details* become the basis for belief. | 4 |
  | **Agreement in Error** | Textual Criticism | When two manuscripts share a unique mistake, proving they share a common ancestor. | Used to *prove* dependence; your case is about the *failure to detect* dependence because the "error" looks like truth. | 4 |
