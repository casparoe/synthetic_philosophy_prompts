  **Preliminary Assessment of the Drafting Request**

  The setup you have described is not defective, but it is precarious. The positions sketched (Puccetti/Nagel lineage vs. Deflationist/Fragmentation) are recognizable caricatures of the actual debate, but they are not straw men; they represent the two stable attractors in the literature. The "Level Distinction" (Access vs. Stream vs. Subject) is philosophically sound and is indeed where the argument usually stalls, but forcing both parties to tag every claim with these levels in Section 1 carries a high risk of refusal. The Single-Subject theorist often treats "Stream" as reducible to "Access + Function," while the Duplication theorist treats "Access" as entailing "Subject." Asking them to agree on which level a claim *concerns* may be interpreted as asking them to concede their reductionist or emergentist priors.

  I have drafted the document as requested, but I have inserted **Confidence Notes** in brackets where I suspect one party may balk at the wording or the categorization. Specifically, the Single-Subject theorist may resist tagging any claim as "Stream/Phenomenal" rather than "Access/Functional." If you require their signatures, you may need to allow them to annotate those tags. The "Generality Problem" rows in the table are also high-friction; both sides have standard replies that often beg the question. I have written them to expose that circularity rather than hide it.

  ***

  # JOINT OPENING STATEMENT: THE SPLIT-BRAIN DEBATE
  **Prepared for the Spring Symposium on the Unity of Consciousness**

  ### I. AGREED CLAIMS
  *We agree on the following structural and empirical premises. Where we disagree on the implication of a claim, that is noted in Section II. Each claim is tagged by the level of description it primarily concerns: **Access** (information availability to systems), **Stream** (phenomenal co-consciousness), or **Subject** (countable first-person perspectives).*

  1.  **[Substantive | Access Level]** The commissurotomy severs the primary neural pathway for information exchange between the cerebral hemispheres, but leaves intact subcortical connections, brainstem reflexes, and the capacity for each hemisphere to control contralateral motor functions and process lateralized sensory input.
      *   *Confidence Note: High. Both sides accept the anatomy.*

  2.  **[Substantive | Access Level]** In standard laboratory conditions (tachistoscopic presentation, tactile manipulation without visual guidance), the left and right hemispheres can demonstrate mutually inaccessible knowledge states, such that a verbal report from the left hemisphere contradicts a manual indication from the right hand regarding the same stimulus event.
      *   *Confidence Note: High. This describes the behavioral dissociation without interpreting the metaphysics.*

  3.  **[Shared Abstraction | Subject Level]** If there are two subjects of experience in one body, there must be at least two distinct first-person perspectives that are not co-conscious with one another; mere functional modularity (as in an intact brain) is not sufficient for subject-multiplication unless that modularity entails a breakdown in the unity of the phenomenal field.
      *   *Confidence Note: Medium. The Single-Subject theorist may argue that "phenomenal field" is just a description of access unity. The Duplication theorist may argue functional modularity *is* sufficient if access is broken. This is a conditional agreement on the definition, not the satisfaction of the definition.*

  4.  **[Substantive | Access Level]** The behavioral dissociations are most robust in the early postoperative period and under strict lateralization controls; they often attenuate in naturalistic settings, though specific cases of intermanual conflict and alien-hand phenomena persist in long-term patients.
      *   *Confidence Note: High. Both sides acknowledge the variability of the data.*

  ***

  ### II. DISAGREEMENTS TABLE
  *We disagree on the interpretation of the agreed claims. The following table isolates the specific points of divergence, the level at which the dispute operates, and the empirical cruxes that bear on them.*

  | The Dispute | Duplication Theorist's Statement | Single-Subject Theorist's Statement | Genuine or Verbal? | The Crux (Sub-question) | Conceded Test / Argument & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Interpretation of Dissociation** | **[Stream/Subject Level]** The mutual inaccessibility of information between hemispheres constitutes two separate streams of consciousness, implying two distinct subjects. | **[Access Level]** The mutual inaccessibility constitutes a fragmentation of access within a single consumer system, implying one subject with disintegrated contents. | **Genuine.** The term "Subject" is doing the damage. Duplication infers Subject from Stream; Single-Subject infers Subject from Biological Organism/Person. | Does functional disconnection *entail* phenomenal separation, or can a single phenomenal field tolerate functional partitioning? | **Argument:** The "Unity of the Person." <br>**Duplication Prediction:** A single person can house two minds (like a conjoined twin). <br>**Single-Subject Prediction:** A single mind can house fragmented access (like severe dissociative identity). |
  | **2. The Generality Problem** | **[Subject Level]** If we count two subjects here, we do not count two in the intact brain because the intact brain possesses a high-bandwidth integration mechanism (corpus callosum) that creates a *single* stream. | **[Access Level]** If we count one subject here, we count one in the intact brain because the criterion for "subject" is the biological organism, not the integration of information. | **Genuine.** Duplication relies on a functional threshold; Single-Subject relies on a biological threshold. | What is the non-ad-hoc principle that distinguishes a "split mind" from a "complex single mind"? | **Argument:** The Spectrum of Disconnection. <br>**Duplication Prediction:** There is a sharp threshold of disconnection where one subject becomes two. <br>**Single-Subject Prediction:** There is no sharp threshold; subject count remains 1 regardless of disconnection severity. |
  | **3. Temporal Unity** | **[Stream Level]** Consciousness is simultaneous in both hemispheres; the right hemisphere is conscious *now* even while the left is speaking. | **[Stream Level]** Consciousness alternates or is unified at each instant via attentional switching; there is never a moment with two simultaneous subjects. | **Genuine.** Concerns the temporal structure of the Stream. | Can attention alternate fast enough to explain the data without positing simultaneous streams? | **Test:** Rapid serial visual presentation with dual-task load. <br>**Duplication Prediction:** Dual-task capacity will exceed single-channel limits significantly. <br>**Single-Subject Prediction:** Dual-task capacity will show switching costs consistent with a single channel. |
  | **4. Indexical-Collision Protocol** | **[Subject Level]** If the left hand writes "I am hungry" and the mouth says "I am not," there are two referents for "I." | **[Access Level]** If the left hand writes "I am hungry" and the mouth says "I am not," there is one referent ("the body") with conflicting access to internal states. | **Genuine.** Concerns the reference of the first-person pronoun. | Does the first-person pronoun pick out a *perspective* or a *person*? | **Test:** Simultaneous contradictory first-person reports followed by cross-channel verification. <br>**Duplication Prediction:** Each channel will deny the truth of the other's report and claim exclusive ownership of "I." <br>**Single-Subject Prediction:** One channel will defer to the other, or both will attribute the conflict to "confusion" within one "I." |
  | **5. Interdependence Protocol** | **[Access Level]** A bimanual task requiring real-time information sharing between hands cannot be performed if info is lateralized and verbal mediation blocked. | **[Access Level]** A bimanual task requiring real-time information sharing can be performed via subcortical routes or rapid attentional switching. | **Genuine.** Concerns the limits of Access without the callosum. | Are subcortical routes sufficient for complex, task-relevant information transfer? | **Test:** Bimanual coordination with lateralized subgoals. <br>**Duplication Prediction:** Performance will fail or degrade to chance levels. <br>**Single-Subject Prediction:** Performance will succeed, perhaps with latency. <br>**Anomaly Condition:** If performance is *perfect* (no latency) despite lateralization, Single-Subject wins. If performance fails *despite* known subcortical routes for that specific motor task, Duplication wins. |

  ***

  ### III. CLOSING STATEMENT ON RESOLUTION

  **Falsification Conditions**

  *   **For the Duplication Theorist:** I would abandon the two-subjects thesis if it were demonstrated that the behavioral dissociations can be fully modeled by a single-agent architecture with constrained bandwidth and no loss of phenomenal unity. Specifically, if the **Indexical-Collision Protocol** yields a unified first-person report (e.g., "I am confused") rather than two contradictory claims, the inference to two subjects is undermined.
      *   *Confidence Note: The Duplication Theorist may argue that "I am confused" could be a confabulation by the speaking hemisphere about the other, so this condition might need to be stricter (e.g., simultaneous writing by both hands denying the same proposition).*

  *   **For the Single-Subject Theorist:** I would abandon the one-subject thesis if there were undeniable evidence of simultaneous, contradictory first-person perspectives that could not be explained by rapid switching or subcortical leakage. Specifically, if the **Interdependence Protocol** fails completely in a domain where subcortical pathways are known to be insufficient, and yet the right hand demonstrates complex, goal-directed behavior independent of the left, the inference to a single agent is undermined.
      *   *Confidence Note: The Single-Subject Theorist may resist "undeniable evidence," arguing that any behavior can be redescribed as fragmented access. This condition may be too weak for them.*

  **Is There Common Ground That Moves the Debate?**

  We agree that the **Interdependence Protocol** is the most promising empirical arbiter. If the split brain can perform complex, bimanual, information-sensitive tasks without the corpus callosum and without verbal mediation, the Duplication Theorist must concede that functional unity persists despite anatomical disconnection. If it cannot, the Single-Subject Theorist must concede that the system operates as functionally distinct units.

  However, we must be honest: even a decisive result on the Interdependence Protocol may not settle the metaphysical dispute. The Duplication Theorist can always retreat to the claim that functional independence *is* what constitutes a subject. The Single-Subject Theorist can always retreat to the claim that biological organism *is* what constitutes a subject. We are agreed that the data underdetermines the metaphysics. This session is not an attempt to force a signature on a metaphysical conclusion, but to clarify exactly where the data runs out and the philosophy begins.

