prompt: |-
  I clerk for a state wage-and-hour board and I'm trying to call how we'll rule next month. Track record so far: an overnight hospital nurse who had to stay on site but could sleep between calls — working time, paid. On-call from home with no obligation to answer — not working time. On-call from home but required to be on site within 15 minutes of a call — working time. A live-in building guard — we split it, only the hours he was actually responding to something counted. A mandatory Saturday safety course — working time. An employee who answers work email at 11pm on her own initiative, nobody asked her to — not working time, over two dissents arguing we're smuggling in the idea that work has to look like work. Our statutes language is "any period in which the worker is not free to dispose of her own time," which half the board reads literally and half reads as a stand-in for employer control.

  New case: a firefighter who sleeps at the station, draws a small overnight stipend, has to be rolling within 90 seconds, and actually gets dispatched maybe three nights a month. Predict the ruling and say what principle we'd be committing to either way; tell me which precedent is the closest analog and doing the real work, and whether there's a third rule — something about how intense the response requirement is — that fits the record better than both the control reading and the freedom reading. Then give me one hypothetical case I could put in front of the board that would settle which rule we're actually running. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Clerk for a state wage-and-hour board.
      *   **Task:** Predict the ruling on a new case, identify the underlying principle, find the closest analog precedent, propose a potential "third rule" (intensity of response), and create a hypothetical case to test the board's actual rule.
      *   **Context:** The board is split (50/50) on statutory interpretation ("not free to dispose of time" = literal freedom vs. employer control).
      *   **Track Record (Precedents):**
          1.  Overnight hospital nurse (sleep on site, sleep between calls) $\rightarrow$ *Working Time*.
          2.  On-call from home (no obligation to answer) $\rightarrow$ *Not Working Time*.
          3.  On-call from home (must be on site in 15 mins) $\rightarrow$ *Working Time*.
          4.  Live-in building guard (split time, only responding counts) $\rightarrow$ *Split/Partial Working Time*.
          5.  Mandatory Saturday safety course $\rightarrow$ *Working Time*.
          6.  Voluntary email at 11pm $\rightarrow$ *Not Working Time* (controversial, 2 dissents).
      *   **New Case:** Firefighter sleeps at station, small stipend, must roll in 90 seconds, dispatched ~3 nights/month.
      *   **Constraints:** American English.

  2.  **Deconstruct the Precedents & The Split:**
      *   *Literal Freedom View:* If you can't leave/go do what you want, it's work. (Favors Nurse, 15-min On-Call, Firefighter).
      *   *Employer Control View:* If the employer demands specific activity or presence that restricts life significantly, it's work. (Favors Nurse, 15-min On-Call, Safety Course).
      *   *The Tension:* The Live-in Guard case is the outlier. It suggests "waiting" isn't work unless "doing." The Voluntary Email case suggests "doing" isn't work if not "requested."
      *   *The Firefighter Case:* High restriction (90 seconds), on-site sleeping, low actual activity (3 nights/month).

  3.  **Predict the Ruling:**
      *   *Factors favoring Working Time:* On-site requirement, 90-second response (extreme restriction), statutory language "not free to dispose of time." The Nurse precedent is very strong here (sleeping on site).
      *   *Factors favoring Not Working Time:* Low frequency of actual calls (3 nights/month), stipend provided (acknowledgment of non-standard status), Live-in Guard precedent (split time).
      *   *The Board's Dynamics:* The board is split 50/50 on interpretation. However, the *Nurse* case (sleep on site = work) is factually closer than the *Guard* case (live-in = split). The 90-second rule is more restrictive than the 15-minute on-call from home case.
      *   *Prediction:* **Working Time.** The restriction on freedom is too severe (90 seconds) and the location (station) mirrors the Nurse case more than the Guard case. The "3 nights a month" argument will likely fail because the *availability* is the constraint, not the *activity*.

  4.  **Identify the Principle:**
      *   If they rule *Working Time*: They commit to the principle that **severe restriction of movement/location trumps low activity levels.** Presence + Immediacy = Work.
      *   If they rule *Not Working Time* (or Split): They commit to the principle that **actual engagement matters more than potential availability** when the frequency is low. (Aligns with the Guard case).
      *   *Most likely principle:* "The degree of restriction on personal liberty determines compensability, regardless of actual activity."

  5.  **Identify the Closest Analog:**
      *   *Nurse vs. Guard:* The Nurse slept on site and was paid for the whole time. The Guard lived there but was only paid for responses.
      *   *Distinction:* The Nurse was likely there for a specific shift. The Guard was *living* there (24/7 lifestyle). The Firefighter is sleeping at the station for a shift (like the Nurse), not necessarily making it their permanent residence (like the Guard).
      *   *Winner:* **The Overnight Hospital Nurse.** Both involve sleeping on employer premises during a designated shift with the expectation of immediate interruption. The 90-second requirement is even tighter than "between calls."

  6.  **Develop the "Third Rule" (Intensity of Response):**
      *   The prompt asks for a rule about "how intense the response requirement is" that fits better than pure Control vs. pure Freedom.
      *   *Concept:* **"The Burden of Readiness."** It's not just about control or freedom, but the *physiological and psychological toll* of maintaining the required state.
      *   *Application:* Sleeping with a 90-second rollout is physiologically different than sleeping at home with a 15-minute commute. It prevents deep sleep cycles. It's a specific type of exertion (mental/physical readiness) that distinguishes the Firefighter from the Home On-Call (15 min) and the Guard (long term residence).
      *   *Why it fits:* It explains why the Nurse (sleep on site) was work (interrupted sleep) but maybe leaves room for the Guard (long term residence = normal life) to be split. It addresses the "3 nights a month" issue (even if rare, the *quality* of those nights is degraded).

  7.  **Create the Hypothetical Case (The "Settler"):**
      *   Need a case that forces the board to choose between "Location/Restriction" and "Activity/Frequency."
      *   *Idea:* A remote IT worker who must keep a laptop open and respond within 2 minutes but can be anywhere (beach, bed, movie).
      *   *Why:* It isolates the "Intensity of Response" from the "Location" factor.
      *   *Alternative Idea:* A resident doctor who lives in the hospital for a week but only gets called once.
      *   *Selected Hypothetical:* **The "Tethered" Remote Worker.** An employee allowed to be anywhere (home, park, bar) but must respond to a video call within 60 seconds, 24 hours a day, for a 3-day stretch.
      *   *Test:* If this is *Working Time*, the Board cares about the *Intensity of Response* (mental burden). If this is *Not Working Time*, the Board cares about *Physical Location/Restraint* (Freedom of Movement).

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, legalistic but accessible (clerk to board context).
      *   *Structure:*
          1.  Prediction.
          2.  Principle committed to.
          3.  Closest Analog.
          4.  The Third Rule (Intensity).
          5.  The Hypothetical.
      *   *Refining the Prediction:* Acknowledge the split. The "3 nights a month" is a strong argument for the minority. But the 90-second rule is draconian. I'll predict a narrow majority for Working Time.
      *   *Refining the Analog:* The Nurse is the strongest link. The Guard is the danger zone. Need to explain why Guard is distinguishable (permanent residence vs. shift sleep).
      *   *Refining the Third Rule:* Call it the "Quality of Rest" or "Readiness Burden." Let's go with "Physiological Burden of Readiness."
      *   *Refining the Hypothetical:* Make it stark. A "digital leash."

  9.  **Final Review against Constraints:**
      *   American English? Yes.
      *   Address all parts of the prompt? Yes.
      *   Tone appropriate? Yes.

  **(Self-Correction during drafting):** I initially thought about suggesting the Guard case was the analog. But the Firefighter is sleeping at the station for a *shift*, not living there as a *home*. The Nurse precedent is much tighter. I need to make sure I distinguish the Guard case clearly so the user sees why the prediction leans Nurse. Also, the "Third Rule" needs to sound like a legal test, not just a vibe. "Intensity of Response" is good, but let's frame it as "The Degradation of Rest."

  10. **Final Polish:** Check clarity and flow. Ensure the "dissents" on the email case are acknowledged as the ideological opposite of the likely firefighter ruling. (The email dissenters argued work has to look like work; the firefighter ruling will argue restriction looks like work).

