answer: |-
  **Prediction: Working Time (Narrow Majority)**

  I expect the board to rule this as compensable working time, likely by a 5-4 or 6-3 margin. The "90-second rollout" requirement is the anchor here. While the frequency of dispatch (three nights a month) invites the board to apply the *Live-in Guard* logic (pay only for activity), the physical constraints mirror the *Overnight Nurse* precedent too closely to ignore. The board's "Literal Freedom" bloc will seize on the fact that a firefighter cannot leave the station, use the restroom without permission, or drink alcohol during the shift. The "Employer Control" bloc will join them because a 90-second response window effectively prohibits deep sleep cycles, meaning the employer has commandeered the physiological quality of the rest period.

  **The Principle You're Committing To**

  By ruling this **Working Time**, the board commits to the principle that **the severity of the restriction on personal liberty outweighs the frequency of actual labor.** You are establishing that "waiting" is work if the conditions of waiting prevent the employee from using the time for meaningful personal restoration. It signals that the "stipend" is irrelevant if the statutory definition of "hours worked" is met; you cannot contract away statutory protections with a flat fee.

  By ruling **Not Working Time** (or Split Time), you commit to the principle that **economic reality trumps physical restriction.** You would be saying that if the employee can effectively live a normal life (sleep, eat, watch TV) and the actual labor is rare, the technical inability to leave the premises is de minimis. This aligns with the *Voluntary Email* dissenters' view that "work has to look like work"—i.e., actual exertion matters more than potential availability.

  **The Closest Analog: The Overnight Hospital Nurse**

  The *Overnight Nurse* is doing the real work here, not the *Live-in Guard*.

  *   **Why it's the Nurse:** Both the nurse and the firefighter are sleeping on employer premises during a designated shift, not as a permanent lifestyle choice. The *Live-in Guard* precedent relied on the idea that the guard's "home" was the workplace, creating a blurred line between living and working that justified a split. The firefighter, like the nurse, is there for a shift. The 90-second requirement is functionally identical to the nurse's "sleep between calls" status, only tighter.
  *   **Why it's not the Guard:** If you apply the *Guard* precedent, you risk undermining the *Nurse* precedent. The only distinction is the frequency of calls. If you rule for the firefighter based on low frequency, you invite employers to schedule nurses for "low volume" nights and claim they aren't working. The *Nurse* case established that sleeping on-site *is* the work, regardless of how many times the pager goes off.

  **The Third Rule: The "Degradation of Rest" Test**

  You asked for a rule about the intensity of the response requirement that fits better than the binary "Control vs. Freedom" split. The record supports a test based on the **Physiological Burden of Readiness.**

  This rule posits that time is compensable if the response requirement prevents the worker from entering a state of restorative rest, regardless of whether they are technically "free" to sit on the couch.
  *   **Fits the Nurse:** Sleeping at a hospital with a pager prevents deep REM sleep.
  *   **Fits the 15-Minute On-Call:** Being within 15 minutes of a site creates low-level anxiety and restricts geography, but usually allows for normal sleep at home. (Wait—your precedent says 15-min on-call *is* working time. This strengthens the "Burden" theory).
  *   **Fits the Firefighter:** A 90-second rollout requires sleeping in gear or near the truck, often in a communal bay with alarms. This is physiologically distinct from sleeping at home.
  *   **Distinguishes the Guard:** A live-in guard can often sleep in a private apartment on the premises, watch TV, and cook. The "burden" is lower because the environment is domestic, even if owned by the employer.

  This rule bridges the split: The "Freedom" bloc sees the lack of restorative rest as a lack of freedom to dispose of time. The "Control" bloc sees the physiological toll as employer extraction of value (the value of being rested and ready).

  **The Hypothetical to Settle the Rule**

  To force the board to reveal whether they care about **Location** (Freedom), **Activity** (Control), or **Readiness** (Intensity), put this case on the docket next:

  **The "Digital Leash" Case:**
  > A senior software engineer is permitted to work from anywhere (home, coffee shop, vacation) but is contractually required to keep a laptop open and respond to a video ping within **60 seconds**, 24 hours a day, for a 72-hour period. She is not required to be at a specific location, but if she misses the ping, she is fired. She spends 70 of the 72 hours watching movies or sleeping, with zero actual coding work.

  *   **If the Board rules Working Time:** They have abandoned the "Location/Physical Restraint" test. They are officially adopting the **"Degradation of Rest/Intensity"** rule. The 60-second window makes true relaxation impossible, even at home.
  *   **If the Board rules Not Working Time:** They are committed to **Physical Restraint** as the primary factor. Since she is "free to dispose of her time" geographically (go to the beach, provided she has Wi-Fi), the mental burden of the 60-second ping doesn't count. This would likely overturn the *15-Minute On-Call* precedent in the future.
  *   **If the Board splits the time:** They are trying to salvage the *Live-in Guard* logic, suggesting that "waiting" is only work when the environment is employer-controlled, not when the constraint is purely digital.

  This hypothetical isolates the "Intensity of Response" from the "On-Site" requirement. It will tell you exactly which coalition holds the majority and whether the *Firefighter* ruling was about the station or the 90-second alarm.
