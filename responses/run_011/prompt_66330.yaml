      *   What survives? The *cyclical* nature of purification.

  9.  **Refining the Ranking:**
      *   1. Ideology (The logic of the Terror requires eliminating extremes).
      *   2. Contingency (The specific triggers).
      *   3. Class (Too broad for the specific two-week gap).
      *   *Flip condition:* New archival evidence showing Danton was planning a coup in March.

  10. **Final Review against Constraints:**
