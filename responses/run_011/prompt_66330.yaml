      *   *Falsifiability:* What would flip this?
          *   If evidence showed Dantonists were plotting a coup in March, Contingency rises.
          *   If evidence showed economic pressure from the bourgeoisie forced Robespierre's hand in April, Class rises.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Academic, rigorous, collaborative but critical.
