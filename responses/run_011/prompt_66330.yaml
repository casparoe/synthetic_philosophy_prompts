      *   *Dantonists:* Arrested late March (Night of 30-31 March), trial started 2 April, executed 5 April. User says "fortnight later... executed 5 April." This is roughly correct (24 March to 5 April is 12 days). Key figures: Danton, Desmoulins, Philippeaux, Hérault de Séchelles. Correct.
      *   *Robespierre:* Executed 10 Thermidor (28 July 1794). User says "Four months after that." April to July is roughly 3-4 months. Acceptable.
      *   *Law of 22 Prairial:* Passed 10 June 1794. User mentions it in context of June. Correct.
      *   *Metaphor Origin:* "The Revolution devours its own children." Often attributed to Jacques Mallet du Pan (1793) or Danton himself ("I would rather be guillotined than guillotine"). Need to be careful not to pin it definitively on one person without nuance.

