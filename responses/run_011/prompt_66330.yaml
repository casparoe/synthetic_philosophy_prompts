          *   Could Danton rouse sections? By April 1794, the sections were purged and subdued after the Hébertist purge.
          *   Cost of sparing Danton:* It would have legitimized opposition to the Terror right before the Law of Prairial. It would have weakened the CPS's monopoly on "virtue."
