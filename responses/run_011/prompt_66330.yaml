  11. **Final Polish:** Ensure the voice sounds like a knowledgeable peer/tutor, not a textbook. Use specific historiographical references (Furet, Soboul, etc.) implicitly or explicitly to show grounding. (Decided to keep it conceptual but reference the schools of thought).

