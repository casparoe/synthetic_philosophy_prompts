      *   *Metaphor Origin:* Mallet du Pan is the safest bet for the phrase, but Danton is often associated with the sentiment. I must state uncertainty.
      *   *Ranking:* I need to be decisive. Ideology wins on *order*, Contingency on *specific dates*, Class on *long-term outcome*. The prompt asks for *timing and order*. Ideology explains the *sequence* (Left then Right to clear the center).

  7.  **Refining the "Hands vs. Voice" Critique:**
      *   The seminar leader's distinction is institutional. Hébertists = Commune/Army. Dantonists = Convention/Press.
      *   *Failure condition:* If the indictment against Hébert focused primarily on his writings rather than the "conspiracy to dissolve the Republic" via the Army. (Actually, the indictment was both).
      *   *Failure condition:* If Danton had control of a military force we are ignoring. (He didn't, really).
      *   *Nuance:* The "Voice" of the Dantonists was dangerous *because* it could mobilize "Hands" in the sections. So Voice implies potential Hands.

  8.  **Refining the Metaphor Analysis:**
      *   The metaphor implies inevitability. The reality was choice.
