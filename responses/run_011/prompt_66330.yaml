answer: |-
  This is a sharp framing. You are right to be suspicious of the "eating its own children" metaphor; in historiography, metaphors often do the work of argument for you, and that's where the errors hide. Your seminar leader's "Hands vs. Voice" distinction is a sophisticated heuristic, but like all heuristics, it risks becoming a Procrustean bed.

  Here is the stress test you asked for, fact-checks included, followed by the ranking.

  ### 1. Fact-Check and Corrections
  Before analyzing, we need to tighten the empirical ground. Your summary is largely accurate, but there are two nuances that affect the "Hands/Voice" argument.

  *   **Dates:** Hébertists executed 24 March (4 Germinal). Dantonists executed 5 April (16 Germinal). This is exactly 12 days, not quite a "fortnight," but close enough for narrative purposes. Robespierre fell 27–28 July (9–10 Thermidor). That is roughly three and a half months later.
  *   **The "Voice" of the Hébertists:** You accept the premise that March was "Hands" and April was "Voice." **This is the weakest link in your factual summary.** Hébert was not just an administrator; he was the editor of *Le Père Duchesne*. It was the most widely read paper of the Revolution. If "Voice" means the power to shape public opinion through print, the Hébertists had *more* voice than the Dantonists at the moment of their arrest. Desmoulins' *Le Vieux Cordelier* was influential but had a smaller circulation and was arguably losing traction by Ventôse.
  *   **The "Hands" of the Dantonists:** Danton had no formal army, but he had immense informal influence in the Cordeliers Club and residual loyalty in the sections. However, by April 1794, the sections had been purged of Hébertist influence. So, while Danton had *potential* hands, they had already been cut off by the March purge.
  *   **Metaphor Origin:** Do not pin "The Revolution devours its own children" on a single author in your paper without qualification. It is most famously attributed to **Jacques Mallet du Pan** in *Mercure de France* (May 1793), *before* these purges happened. Danton is often quoted as saying something similar on the scaffold ("Do not forget to show my head to the people, it is worth seeing"), but the specific "devouring" phrase is counter-revolutionary in origin, later adopted by liberals. Using it as an analytic category risks importing counter-revolutionary teleology into your analysis.

  ### 2. Stress-Testing "Hands vs. Voice"
  Your seminar leader's distinction is institutionally sound but functionally leaky.

  **Where it tracks:**
  *   **Institutional Base:** The Hébertists were entrenched in the **Paris Commune** (Chaumette as Procurator) and the **Revolutionary Army** (Ronsin as General). These are literal "hands." The reorganization of the Commune immediately after 24 March supports the "removing hands" thesis.
  *   **The Charge:** The Hébertists were accused of conspiracy to dissolve the Republic via insurrection (a physical act). The Dantonists were accused of "conspiring to restore the monarchy" through demoralization and corruption (a discursive/moral act).

  **Where it breaks (Falsification Conditions):**
  For this distinction to hold, the *primary* threat of the Hébertists must be military/administrative, and the *primary* threat of the Dantonists must be rhetorical.
  *   **Failure Condition 1:** If the Committee of Public Safety (CPS) feared Hébert's *journalism* more than his army. Evidence suggests they did. Saint-Just's report on the Hébertists spends significant time on their "perfidious writings." If the CPS viewed *Le Père Duchesne* as the primary weapon, March was also a "Voice" purge.
  *   **Failure Condition 2:** If Danton had a viable "Hand" option he chose not to use. Danton famously refused to flee or rally the sections ("I would rather be guillotined than guillotine"). If he *could* have used hands but chose not to, then April wasn't a "Voice" purge forced on the CPS; it was a "Hands" purge where the victim surrendered his hands.
  *   **Failure Condition 3:** If the order was reversible. Could the CPS have purged Danton in March and Hébert in April? If yes, the distinction is post-hoc. If no, the distinction is structural. Most evidence suggests the CPS *needed* to crush the Left (Hébert) to isolate the Right (Danton). If they had moved on Danton first, the Hébertists might have launched the insurrection the CPS feared. Therefore, the "Hands" had to be removed *first* to make the "Voice" purge safe.

  **Verdict:** The distinction is valid **sequentially**, not categorically. March was "Hands" because removing the Hébertist infrastructure was a *precondition* for safely removing the Dantonist voice. It is a distinction of tactical necessity, not intrinsic nature.

  ### 3. Deconstructing "Eating its Children"
  You are right to treat this as a claim requiring translation. The metaphor implies a single organism (The Revolution) with a biological imperative (Appetite).

  **Translation to Agency and Constraints:**
  *   **The Agent:** Not "The Revolution," but the **Committee of Public Safety (CPS)**, specifically the Robespierre-Saint-Just-Couthon triad, acting with the tacit consent of the Plain in the Convention.
  *   **The Options:**
      *   *Danton's Flight:* Danton could have fled to Switzerland (as Marat did in 1792). He chose not to. Why? Likely because he believed his popularity was a shield. This removes "inevitability." It was a miscalculation.
      *   *Danton's Resistance:* Could he have roused the sections? In January 1794, maybe. By April 1794, the Revolutionary Army was disbanded (March) and the Commune purged. The "Hands" were gone. Sparing Danton would have required the CPS to admit that the Terror was temporary, which undermined the logic of the Law of Suspects.
      *   *Robespierre's Cost:* Sparing Danton in April would have legitimized a "Right Opposition." Going into June (Law of 22 Prairial), Robespierre needed total control to institutionalize the "Republic of Virtue." A living Danton is a rallying point for anyone tired of the Terror.
  *   **What Survives the Translation:**
      *   The **Pattern**: The elimination of former allies.
      *   The **Mechanism**: The use of the Revolutionary Tribunal to convert political disagreement into criminal conspiracy.
      *   **What Dies:** The **Inevitability**. The metaphor suggests the Revolution *had* to do this. The translation shows specific men made specific bets. Robespierre bet he could rule from the center without the Left or Right. He lost that bet in Thermidor.

  **Blunt Assessment:** Nothing of the *metaphor* survives except the poetic rhythm. As an analytic tool, it is useless because it obscures the specific political calculation: **Monopolizing Violence.** The CPS didn't eat its children; it consolidated a monopoly on the definition of "Patriotism."

  ### 4. Ranking the Historiographical Lenses
  You asked for a ranking based on explaining the **timing and order** (Hébert first, then Danton, then Robespierre), not just the outcome.

  **1. Ideology/Discourse (The Political Culture School)**
  *   **Why First:** This best explains the **order**. The logic of "Virtue" requires purifying the Republic of extremes. To establish the "Center" (Robespierre's position), you must first eliminate the "Left" (Hébertists/Atheists/Anarchists) to prove you are not soft, then eliminate the "Right" (Dantonists/Indulgents) to prove you are not corrupt.
  *   **Timing:** The proximity (12 days) suggests a coordinated ideological cleansing, not two separate events. The rhetoric used against both groups mirrors each other (both accused of conspiracy, one with foreign powers, one with domestic chaos).
  *   **Where it goes quiet:** It struggles to explain Thermidor. If Robespierre was the ideological center, why did the Convention turn on him in July? Ideology explains the Spring purges well, but fails to explain why the "Center" collapsed so quickly without a change in doctrine.

  **2. Contingency (The Event/Agency School)**
  *   **Why Second:** This explains the **specific dates**. The Hébertists were moving toward insurrection in early March; the CPS struck preemptively. The Dantonists were arrested immediately after because the CPS feared Danton would exploit the chaos of the Hébertist trial to rally opposition.
  *   **Timing:** It accounts for the panic. Saint-Just's speech on 8 Thermidor (the contingency that killed Robespierre) works well here.
  *   **Where it goes quiet:** It risks making the purges look like accidents. It cannot explain why the *structure* of the purges (Left then Right) repeats in other revolutions. It lacks predictive or structural power.

  **3. Class (The Social Interpretation/Soboul)**
  *   **Why Third:** This explains the **outcome** (Thermidor as bourgeois reaction) but fails the **timing and order** test.
  *   **Why it fails here:** If this were purely class war, the Bourgeoisie (Danton) and the Sans-culottes (Hébert) should have allied against the Committee, or the Committee should have picked a side permanently. Instead, Robespierre crushed *both*. The class lens sees the Spring 1794 purges as a confusing interlude before the "real" class struggle of Thermidor. It cannot explain why Robespierre attacked his natural sans-culotte base (Hébert) *before* the bourgeoisie (Danton).
  *   **Where it goes quiet:** It treats the Hébertists as representatives of the proletariat, which is anachronistic. They were more a mix of petty bourgeoisie and radicalized artisans.

  ### 5. What Would Change My Mind (Falsifiability)
  I am ranking **Ideology** first, but here is what would flip me to **Contingency** or **Class**:

  *   **Flip to Contingency:** If you find evidence that the CPS did not plan the Dantonist purge until *after* the Hébertist trial began. If the decision to take Danton was a panic reaction to Danton's defense speech rather than a pre-meditated sequence, Contingency wins. (Current consensus: The CPS prepared the Danton arrest simultaneously, waiting for the Hébert blood to dry).
  *   **Flip to Class:** If economic data from Spring 1794 shows a sharp shift in grain supply or wage controls that forced Robespierre's hand. If the purge of the Hébertists correlates exactly with the abandonment of the Maximum (price controls), then Class rises. (Current consensus: The Maximum stayed in place until after Thermidor, weakening the Class argument for Spring 1794).
  *   **My Analysis Breaking Point:** My ranking relies on the assumption that Robespierre and the CPS were acting rationally to secure power. If you argue that Robespierre was already mentally compromised or acting on paranoid delusion unrelated to political strategy (a medical/psychological lens), the Ideological ranking collapses into Contingency/Pathology.

  ### Summary Advice for the Case Analysis
  *   **Keep the "Hands/Voice" distinction** but qualify it heavily. Use it to describe the *institutional targets* (Commune vs. Convention), not the *nature of the threat*. Acknowledge that Hébert had voice and Danton had potential hands.
  *   **Kill the "Eating Children" metaphor** in your analysis, or use it only to demonstrate how contemporaries misunderstood the events. Replace it with "Monopoly on Violence" or "Centralization of Authority."
  *   **Argue for Ideology as the driver of Order.** The sequence (Left then Right) is a deliberate strategy to define the Center. The timing (Thermidor) is where Contingency takes over.

  This approach shows you understand the historiography without being enslaved by it. Good luck with the seminar.
