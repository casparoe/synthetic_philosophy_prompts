answer: |-
  1. **Bottom line**
  The five-year residence rule is fundamentally mismatched to the fund's design and should be abolished. This fund operates as a current-income levy for active labor market integration, not a pension-style savings scheme. Eligibility should hinge on current contribution and need, not tenure.

  2. **What the two sides are really appealing to**
  The chair appeals to **Accrued Entitlement**, treating the fund like a pension where rights accumulate over time through past contributions and reliance on promised future benefits. This principle prioritizes loyalty, stability, and the moral weight of past expectations formed under existing rules. It views the fund as a reward for sustained membership in the community. Conversely, the deputy appeals to **Utilitarian Efficiency** mixed with **Immediate Reciprocity**. This view treats the levy as a premium for current coverage, arguing that resources should flow to where they generate the highest marginal return (integration of new workers) and where the link between payment and access is tightest. It views the fund as a tool for current economic optimization. The conflict arises because the rule attempts to enforce Accrued Entitlement on a mechanism designed for Immediate Reciprocity, creating a zero-sum conflict where one group's reliance cancels another's contribution. Since every place granted is taken from another, the debate is fundamentally about who holds the prior claim: the past payer or the current payer. The chair emphasizes the moral debt owed to those who built the system, while the deputy emphasizes the functional purpose of the system in the present moment. Thus, the disagreement is not about fairness itself, but about the temporal orientation of the fair claim.

  3. **Which principle fits this fund**
  The fund is financed by a tax on current wages, not accumulated capital. Every paycheck deducts 1.5%, creating an immediate contractual link between work and contribution. Vocational and language training are tools for labor market integration; their value diminishes significantly if delayed for five years. A newcomer needs language training now to maximize their contribution, not after half a decade. Furthermore, excluding current contributors violates the equity principle of a wage levy: if you pay the price, you should access the good. A deferred entitlement model fits pension schemes where benefits are consumed after work ends. Here, benefits are consumed during work to sustain employment. Therefore, the principle of Immediate Reciprocity aligns with the economic reality of the levy and the functional purpose of the training. The fund is an insurance policy against unemployment and underemployment, not a reward for longevity. Given the fixed budget, prioritizing based on ROI (as the deputy suggests) ensures the fund fulfills its municipal purpose of maximizing local employability, rather than simply rewarding tenure regardless of outcome. The structure dictates that the fund serves active labor market policy, requiring access when the need is highest, which correlates with early residence for migrants and economic downturns for locals. Additionally, the levy is universal across local wages, implying a shared risk pool. In shared risk pools, exclusion based on arbitrary tenure undermines the solidarity principle inherent in insurance. If the goal is city-wide economic resilience, barriers to entry for contributing members weaken the overall system. The design inherently favors flow over stock.

  4. **Consequences for the five-year rule**
  The five-year rule must be rescinded. Eligibility should open to all legal residents contributing the levy, perhaps with a minimal administrative waiting period (e.g., three months) to verify contribution status. For the current queue, a transitional arrangement is necessary to honor the Chair's concern about reliance. The long-resident applicants currently approved or in advanced stages should be honored for this cycle to avoid abrupt breach of trust. However, future allocations must prioritize based on labor market need (unemployment duration, skill gaps) rather than residence duration. The newcomer families at eleven months should be admitted immediately, as their exclusion under the old rule is now deemed illegitimate. To manage the fixed budget, a points-based system weighing current contribution status against vulnerability (disability/age) should replace the blunt residence instrument. This balances immediate justice with transitional stability, ensuring no current contributor is barred while respecting prior commitments. The board should communicate that the change reflects the fund's true purpose, not a devaluation of long-term residents. Future budgets may need adjustment if demand surges, but eligibility cannot remain restricted.

  5. **Strongest objection**
  The strongest objection is political stability. Abruptly changing eligibility criteria risks alienating the existing constituency that supported the levy, potentially triggering a political backlash or reduced compliance. If long-term residents feel their seniority is worthless, they may oppose future funding measures. However, this risks conflating political convenience with structural fairness. A rule that excludes current contributors from benefits they finance is inherently unstable and legally vulnerable. Maintaining an unjust rule to preserve trust is a fragile strategy that invites greater conflict later. The verdict stands: the rule must change, but the transition should be managed carefully to mitigate political friction. Ignoring the structural mismatch would ultimately undermine the fund's legitimacy more than a difficult transition would. Trust is better served by correcting errors than perpetuating them.
