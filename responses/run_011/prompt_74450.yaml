answer: |-
  ### Take-Home Examination: Epistemology of the Past
  **Course:** HIST 450 / GRAD 510
  **Time Limit:** 48 Hours
  **Word Limit:** 900 words (±10%)
  **Value:** 25 Marks

  **Question:**
  Select **two** of the following three traditions: the Biblical Exodus, the Trojan War, the Historicity of King Arthur.

  For each selected tradition, formulate the **minimal historical claim**: the thinnest proposition that must be true for the tradition to retain a historical kernel rather than being pure fabrication. Then, identify what **non-question-begging evidence** could confirm or falsify that specific claim.

  Your essay must address the **threshold problem**: if you make the minimal claim too thin, it becomes trivially true (compatible with almost any data); if you make it too thick, it merely restates the legend (and is likely false). Avoid discussing how legends accumulate over time or relying on the maxim that "absence of evidence is not evidence of absence." Focus strictly on the epistemic conditions required to anchor the tradition to history.

  ***

  ### Model Answer

  **The Threshold of History: Minimal Claims in Exodus and Troy**

  Establishing the historicity of foundational traditions requires navigating a dilemma: the "minimal historical claim" must be specific enough to be meaningful but general enough to survive evidentiary attrition. If the claim is too thin, it is epistemically secure but historically vacuous; if too thick, it is historically rich but epistemically vulnerable. This essay examines this threshold problem through the Exodus and the Trojan War.

  For the **Exodus**, the maximal claim is that 600,000 Israelites wandered the Sinai for forty years under Mosaic leadership. The minimal claim cannot simply be "some Semites left Egypt," as this is trivially true given known patterns of migration and Hyksos history. A robust minimal claim is: *A distinct coalition of Semitic laborers escaped Egyptian control in the Late Bronze Age, moving northeast into the Levant.*

  Confirming this requires evidence that is not derived from the Biblical text itself. Non-question-begging confirmation would involve Egyptian administrative records noting the loss of control over a specific labor force in the relevant period, or distinct material culture in the Sinai dating to the 13th century BCE indicating a mass transit. Falsification rests on the silence of the Egyptian record. While "absence of evidence" is often a fallacy, it is not neutral here. The New Kingdom administration was bureaucratized to a degree that tracked border movements, corvée labor, and military campaigns. The total absence of any reference to a loss of this magnitude in a record-keeping culture that documented minor border skirmishes suggests the event, as defined even minimally, did not occur. The threshold problem here is acute: if we thin the claim to "a few slaves escaped," it is likely true but irrelevant to the formation of Israel; if we maintain the "coalition" status, the administrative silence becomes fatal evidence.

  For the **Trojan War**, the maximal claim is the ten-year siege described by Homer. The minimal claim is often posited as: *A conflict occurred between Mycenaean Greeks and the rulers of Hisarlik (Troy VII).* However, stating "a conflict occurred" risks the triviality trap; conflicts were endemic. A more precise minimal claim is: *A destruction of Troy VIIA was caused by external Mycenaean military action rather than internal earthquake or local warfare.*

  Non-question-begging evidence for this lies in the intersection of archaeology and Hittite texts. Archaeologically, the presence of Mycenaean weaponry (arrowheads, swords) in destruction layers at Hisarlik would confirm external aggression. Textually, the Hittite correspondence referencing *Wilusa* (Troy) and *Ahhiyawa* (Mycenaeans) provides contemporary geopolitical context. However, the "mound is not an event" problem complicates this. Hisarlik proves a city existed and was destroyed; it does not prove the destruction was the *Iliad's* war. To confirm the specific kernel, one would need epigraphic evidence at the site linking the destruction to a specific Greek coalition. Falsification comes from stratigraphy showing the destruction was seismic (tilted walls) or that the timeline of Mycenaean contact does not overlap with Troy VIIA's fall. The threshold problem manifests differently here: the archaeological reality (a wealthy city destroyed) is thick enough to be significant, but thinning the claim to "there was tension" makes the Homeric tradition merely a poetic reflection of general commerce rather than specific memory.

  Comparing the two reveals the epistemic asymmetry. The Exodus problem is one of *negative evidence* in a high-surveillance context; the minimal claim is threatened by the silence of the oppressor. The Trojan problem is one of *positive identification*; the minimal claim is threatened by the ambiguity of the material record. In both cases, the scholar must resist the urge to thicken the claim to satisfy the narrative or thin it to satisfy the data. The historical kernel exists only where the claim is specific enough to be falsifiable but supported by evidence independent of the tradition's own self-testimony. If the minimal claim for Exodus is "people moved," it is not history; if the minimal claim for Troy is "a city burned," it is not the War. The epistemic task is to locate the narrow ridge between triviality and fiction.

  ***

  ### Marking Scheme (25 Marks)

  **1. Formulation of Minimal Claims (10 Marks)**
  *   **Strong (8-10):** Claims are specific enough to be historically meaningful but distinct from the full legend. Explicitly acknowledges the "triviality" risk (e.g., distinguishing "migration" from "Exodus").
  *   **Competent (5-7):** Claims are identified but may be too vague ("something happened") or too close to the legend ("the war happened").
  *   **Weak (0-4):** Fails to define a minimal claim or conflates the legend with the history.

  **2. Analysis of Non-Question-Begging Evidence (10 Marks)**
  *   **Strong (8-10):** Identifies evidence independent of the tradition (e.g., Egyptian admin records, Hittite texts). Explains *why* silence is significant in the Exodus case (bureaucracy) or why archaeology is ambiguous in the Troy case (mound $\neq$ event).
  *   **Competent (5-7):** Lists standard evidence (archaeology, texts) but fails to explain the "non-question-begging" constraint or relies on "absence of evidence" clichés without nuance.
  *   **Weak (0-4):** Uses the tradition to prove the tradition (circularity) or ignores the evidentiary constraints.

  **3. Engagement with the Threshold Problem (5 Marks)**
  *   **Strong (5):** Explicitly discusses the tension between claims that are "too thin/trivial" and "too thick/false."
  *   **Competent (3):** Mentions the difficulty of proving history but misses the specific logical dilemma of the threshold.
  *   **Weak (0-2):** Ignores the conceptual crux; treats it as a standard history essay.

  **Common Mistakes & Penalties**

  1.  **The "Absence of Evidence" Dodge (−3 marks):**
      *   *Mistake:* Arguing that lack of Egyptian records proves nothing because "papyrus doesn't survive."
      *   *Why:* This ignores the specific administrative density of the New Kingdom. Silence is only neutral in low-literacy contexts; in high-surveillance states, it carries evidentiary weight.
  2.  **The "Archaeology Solves Troy" Move (−3 marks):**
      *   *Mistake:* Asserting that the existence of Hisarlik/Troy VII confirms the Trojan War.
      *   *Why:* A destroyed mound confirms a disaster, not a specific *event* or *agent*. This conflates site continuity with event verification.
  3.  **Equating Arthur and Exodus (−2 marks):**
      *   *Mistake:* Treating the evidentiary problems of Arthur and Exodus as identical shapes.
      *   *Why:* Arthur is a retrojected literary figure in a post-Roman gap; Exodus is a foundational national myth with specific geographic/administrative claims. The epistemic hurdles differ.
  4.  **Focusing on Transmission (−5 marks):**
      *   *Mistake:* Discussing how oral tradition corrupts data over centuries.
      *   *Why:* The prompt explicitly forbids this. The issue is the *threshold of the claim*, not the fidelity of the telephone game.

  ***

  ### Instructor Confidence Note

  **Confidence Level:** High on the epistemological framing and structural requirements; Moderate on specific historical details.

  **Least Sure Claim:** In the model answer, I assert that the Hittite correspondence regarding *Wilusa* provides "contemporary geopolitical context" sufficient to anchor the minimal claim. While this is the dominant scholarly view (e.g., Bryce, Cline), there is a minority position that the identification of Wilusa with Ilion/Troy is phonologically plausible but historically tenuous. If the Hittite texts refer to a different site, the "non-question-begging" evidence for Troy weakens significantly. I am confident enough in this for an upper-level seminar model, but it remains the most contestable historical premise in the text.
