answer: |-
  **Move (1): Tells against the other side.**
  The modeller preemptively excludes the Folklorist's likely framing by asserting the process is *literally* Darwinian, not an analogy. This sets a high bar for the opposition: they must prove it is *not* Darwinian, rather than simply offering an alternative metaphor.

  **Move (2): Tells against the other side.**
  The folklorist introduces specific empirical evidence (field notes regarding independent generation) that directly contradicts the modeller's mechanism of copying. This shifts the burden of proof back to the modeller to explain why identical stanzas appear without transmission.

  **Move (3): Tells against the other side.**
  The modeller effectively defends her methodology (phylogenetic trees) and turns the folklorist's definition of "replication" into a potential trap. By arguing that excluding reconstruction from selection makes cultural evolution impossible by definition, she forces the folklorist to justify why his mechanism is exempt from evolutionary logic.

  **Move (4): Tells against the other side.**
  The folklorist successfully identifies a vulnerability in the modeller's broadened definition of fitness: if fitness equals recurrence, the theory becomes unfalsifiable. He also challenges the objectivity of the trees, suggesting they are artifacts of character selection rather than neutral data.

  **Move (5): Backfires.**
  While the "tu quoque" regarding unobservable posits is strong, the modeller undermines herself by minimizing the disagreement ("much smaller"). This allows the folklorist to demonstrate in the next move that the practical implications for the exhibit are mutually exclusive, making her attempt at synthesis look naive.

  **Move (6): Tells against the other side.**
  The folklorist forces a binary choice based on the material constraints of the exhibit. He demonstrates that the modeller's theoretical minimization (in Move 5) cannot survive contact with curatorial reality; one cannot display "maybe" as history.

  ***

  **The Genuine Crux**
  This is a dispute about the **ontology of the song**. The modeller treats the song as a *historical particular* (a specific text that travels through time), while the folklorist treats it as a *psychological pattern* (a schema that recurs in minds). The modeller sees the text as the replicator; the folklorist sees the cognitive gist as the generator. Consequently, they disagree on what counts as evidence: the modeller values phylogenetic signal (textual similarity), while the folklorist values ethnographic testimony (singer accounts of learning).

  **What Is Missing**
  *   **The Modeller** is missing an account of **cognitive constraints**. She treats variation as largely random subject to selection, ignoring that the "singable and memorable" variants the folklorist mentions are determined by universal cognitive structures, not just historical survival.
  *   **The Folklorist** is missing an explanation for the **phylogenetic signal**. If singers truly reconstruct from scratch based on gists, the strong tree-like structure in the corpus should not exist. He dismisses the trees as cherry-picked but offers no alternative reason for their stability.
  *   **Both** are missing the synthesis: Transmission *requires* reconstruction. A singer cannot copy a song into a brain without reconstructing it. The dispute is a false dichotomy between "copying" and "rebuilding"; it is always "rebuilding *from* a copy."

  **Recommendation for the Wall Text**
  Do not resolve the debate; frame it. The text should claim that the archive captures a **dual process**: songs persisted because they were memorable (cognitive attractors) *and* because they were passed down (historical lineages). Display the phylogenetic trees alongside the field notes of independent reconstruction. Let the visitor see that the songs behave *as if* they have lineages, even if the singers' minds rebuilt them. The exhibit should testify to the mystery of how stable forms emerge from fluid minds, rather than asserting a single mechanical truth.
