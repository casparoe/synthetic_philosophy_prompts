answer: |-
  **Bottom Line:** Your hunch is spot-on. The paragraph is historically plausible but logically flawed. Revealed preference is falsifiable because it demands consistency, not just choice. Economists haven't fully reverted to mental utility either.

  **Sentence-by-Sentence Audit:**
  1.  *Samuelson... inner state.* **Accurate.** Samuelson aimed to make economics behaviorist, purging cardinal utility.
  2.  *To say you prefer...* **Accurate.** This is the operational definition: choice reveals preference.
  3.  *Which also makes the whole thing empty...* **False.** Critical error. This fuses the *definition* of preference (choice) with the *theory* of choice (consistency). Revealed preference requires consistent choices (e.g., transitivity, WARP). If you choose A over B, then B over C, but C over A, the theory is falsified. It is not a tautology.
  4.  *The same trick... psychological egoism...* **Defensible Simplification.** Both face tautology critiques, but economics avoids the trap via consistency constraints that egoism lacks.
  5.  *...economists quietly went back...* **Misleading.** Mainstream theory still uses ordinal utility (rankings), not cardinal mental states. Behavioral economics integrates psychology but hasn't restored Benthamite happiness metrics as the standard.

  **On Your Hunch:**
  Your point about preference-reversal is the knockout punch. If the theory were empty, inconsistent choices wouldn't be "violations." They are famous precisely because revealed preference predicts stable orderings. The paragraph's error lies in conflating a circular definition with a testable theory. By imposing axioms like transitivity, economists ensure behavior *can* contradict the model. You can safely correct your friend on the unfalsifiability claim; the theory has empirical bite, which is why violations like the Allais paradox matter.
