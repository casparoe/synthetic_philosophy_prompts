      *   *Point 6: Explanatory Burden (Deliberation/Regret).* Why deliberate? Why not toss a coin? How to handle regret? *Requirement:* The theory must explain the rationality of deliberation and the phenomenology of residue (regret) without implying the forgone option was better.
