answer: |-
  ### Specification for a Theory of Hard Choices and Incommensurability

  **Context:** Single agent, unique decision, no repeated trials, no aggregation.
  **Objective:** Distinguish structural incomparability from measurement error; justify deliberation without truth-making.

  | # | Requirement | Specification | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Semantic Traceability** | The theory must explicitly define the relationship between *common units* and *ordinal ranking*. It must state whether "incommensurable" implies a failure of measurement (no common unit) or a failure of ordering (no ranking), or both. It cannot assume the metrological definition (no unit, definite order) nor the philosophical default (no unit, no order) without argument. | **Non-negotiable** |
  | **2** | **Signal-to-Noise Discrimination** | The theory must provide a criterion to distinguish *structural parity* (a fact about the options) from *epistemic instability* (a fact about the agent's judgment). It must specify what evidence constitutes a "reading" of parity that exceeds the uncertainty budget of the agent's deliberation. A theory that equates "I cannot tell" with "They are on a par" is rejected. | **Non-negotiable** |
  | **3** | **Resolution Limit** | The theory must specify the required granularity of option description. It must state whether incomparability persists under arbitrary refinement of the options' features or if it dissolves when descriptions are sufficiently fine-grained. | **Non-negotiable** |
  | **4** | **Failure Localization** | The theory must identify the locus of the breakdown. Is the incomparability *intra-dimensional* (e.g., two distinct kinds of beauty) or *inter-dimensional* (e.g., beauty vs. cost)? If the latter, it must explain why dimensional aggregation fails rather than merely asserting it. | **Local Prejudice** (Structuralist preference) |
  | **5** | **Order Logic** | The relation *better than* must remain transitive. The theory must explicitly state the logical properties of the fourth relation (parity/incomparability). It must address the Small Improvement Argument: if A is on a par with B, and B+ is marginally better than B, is A on a par with B+? The theory cannot ignore this chain. | **Non-negotiable** (Transitivity of *better than*) / **Contested** (Behavior of 4th relation) |
  | **6** | **Deliberative Utility** | The theory must explain why deliberation is rational rather than random selection (coin toss). It must accommodate the "residue" (regret, remainder) without implying the forgone option was objectively better. Choice must not be truth-making (choosing does not make the option better). | **Non-negotiable** |
  | **7** | **Ontological Status** | The theory may declare whether the indeterminacy is ontic (in the world/values) or epistemic (in our concepts/knowledge). However, it cannot refuse to answer this while claiming to satisfy Requirement 2. | **Local Prejudice** (Metaphysical agnosticism permitted *unless* it violates Req 2) |

  ---

  ### Analysis of Exclusion and Incompatibility

  **The Most Excluding Requirement**
  **Requirement 2 (Signal-to-Noise Discrimination)** does the most excluding work. The vast majority of extant accounts operate as conceptual analyses conducted from the armchair. They posit parity or incomparability based on intuition pumps (e.g., "Does it seem right to say one is better?"). None provide an operational test to distinguish a genuine failure of comparability from the noise of fluctuating preference, fatigue, or insufficient reflection. For a metrologist, a measurement without an uncertainty budget is not a measurement; for most philosophers, a judgment without an error analysis is a datum. This requirement eliminates any theory that treats the *feeling* of hard choice as sufficient evidence for the *fact* of parity. It demands a calibration standard for value that the literature largely ignores.

  **The Incompatible Subset**
  **Requirements 2 and 7 cannot be jointly satisfied** if the theory adopts a strong Metaphysical Agnosticism.
  *Argument:* Requirement 2 demands that the agent distinguish a structural failure of comparability from noise in her own judgments. To do this, there must be a "signal" (the true value relation) independent of the "noise" (the agent's elicited judgment). This implies an ontic fact of the matter regarding the comparison. Requirement 7 permits the theory to claim the indeterminacy is purely epistemic or conceptual (i.e., there is no fact of the matter until concepts are sharpened or choices made). If there is no fact of the matter (strong agnosticism/epistemic view), there is no signal to measure against the noise. You cannot calculate an uncertainty budget against a reference standard that the theory claims does not exist. To satisfy Requirement 2, you must treat the value relation as having sufficient ontological weight to serve as a reference, thereby violating strict Metaphysical Agnosticism.

  ---

  ### Assessment of Theoretical Families

  **The Vagueness and Indeterminacy Accounts**
  These accounts treat hard choices as artifacts of semantic blur or borderline cases, analogous to the heap paradox. They satisfy Requirement 1 by aligning incommensurability with ordering failure, and they handle Requirement 3 (Grain) by suggesting finer description dissolves the problem. However, they fail Requirement 2 catastrophically: they cannot distinguish vagueness from ignorance, treating all uncertainty as linguistic. They also struggle with Requirement 6; if the choice is merely a borderline case, deliberation is just sharpening definitions, which does not explain the profound residue or the sense that something significant is lost, not just clarified. They reduce the tragedy of the hard choice to a semantic cleanup operation.

  **The Parity (Fourth Relation) Accounts**
  These posit "on a par" as a sui generis normative relation alongside better, worse, and equal. They excel at Requirement 6, providing a logical space for deliberation (finding the parity) and residue (the forgone option was not worse, just different). They satisfy Requirement 1 by explicitly separating common units from ordering. However, they are under severe stress from Requirement 5. Maintaining the transitivity of *better than* while allowing parity to block the Small Improvement Argument often requires complex, non-standard logic that risks incoherence. Most critically, they fail Requirement 2: they offer no method for the agent to detect parity other than intuition, offering no "uncertainty budget" to ensure the parity isn't just confusion.

  **The Will and Commitment Accounts**
  These theories argue that in hard choices, reason runs out and the agent creates the reason through commitment. They handle Requirement 6 well by making deliberation the process of forming a will, and they explain residue as the cost of that creation. However, they violate Requirement 2 and Requirement 6's constraint on truth-making. If the agent's will makes the choice right, there was no prior signal to measure; the "choice" is not a discovery but an invention. This renders the pre-choice deliberation opaque (what are we deliberating *about*?) and implies that regret is irrational (since you made the option better). They solve the problem by dissolving the pre-existing value structure the metrologist assumes is there to be measured.

  **The Dissolution (Ordinary Reasoning) Accounts**
  These claim there is no fourth relation and no indeterminacy; one option is always slightly better, even if we cannot know which. This preserves Requirement 5 (standard logic) and Requirement 7 (realism). However, it fails Requirement 2 by declaring the signal permanently inaccessible, effectively setting the uncertainty budget to infinity. It fails Requirement 6 by rendering deliberation a futile attempt to access the inaccessible and treating residue as a cognitive error. For an agent facing a unique, high-stakes choice, being told "one is better, you just can't know which, so guess" is operationally useless and phenomenologically false. It denies the data of the experience to save the logic of the model.
