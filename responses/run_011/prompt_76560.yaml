answer: |-
  **1. Dependency Structure**

  1.  **Break the Verificationist Hangover (0–15 mins).**
      *   *Depends on:* Nothing (starts from their current Ayer-based baseline).
      *   *Unlocks:* The possibility that "non-factual" does not equal "nonsense" or "softened fact."
      *   *Cost:* 15 minutes.
      *   *Note:* You must sever the link between "meaning" and "verification" before introducing Wittgenstein. If they think W is just a nicer Ayer, the rest fails.

  2.  **The Secular Carrying Case (15–35 mins).**
      *   *Depends on:* Step 1 (students must accept we are looking for a non-empirical grammar).
      *   *Unlocks:* The distinction between **Content** (what is said), **Function** (what it does), and **Grounds** (evidence).
      *   *Cost:* 20 minutes.
      *   *Separation Point:* This is where you pry apart the three fused elements. You show that in the secular case, the *content* looks empirical ("He is loyal"), the *grounds* are ambiguous (he acts poorly), but the *function* is regulatory (it enables the relationship). You cannot reach Wittgenstein's claim until they see this triad in a non-religious context.

  3.  **Mapping to Religious Belief (35–55 mins).**
      *   *Depends on:* Step 2 (the secular logic must be established first).
      *   *Unlocks:* The ability to discuss "God loves me" without triggering the physics major's truth-demand or the believers' defense mechanisms.
      *   *Cost:* 20 minutes.

  4.  **Misconception Management (55–75 mins).**
      *   *Depends on:* Step 3 (students must have the framework to see why the misconceptions are category errors).
      *   *Unlocks:* A defensible essay position that avoids fideism and reductionism.
      *   *Cost:* 20 minutes.

  5.  **Essay Framing (75–90 mins).**
      *   *Depends on:* Step 4 (clearing the debris).
      *   *Unlocks:* The ability to answer "Is it truth-apt?" with nuance.
      *   *Cost:* 15 minutes.

  **2. The Carrying Case**

  **The Case:** **"The Unshakeable Commitment to the Partnership."**
  **Scenario:** A senior partner in a firm believes, "My junior partner is fully committed to this venture."
  **Evidence:** The junior works late less often than peers, questions strategic decisions publicly, and takes a lower salary elsewhere for a side project.
  **Outsider Response:** "They are drifting. They are not committed." (Emphatically not "perhaps").
  **Holder's Response:** "I know their heart. They are building capacity elsewhere for us."
  **Counter-Evidence:** The junior threatens to leave.
  **Holder's Reaction:** Does not revise the belief to "They are somewhat committed." Instead reinterprets the threat: "They are negotiating for a better position *within* the firm."
  **Why it fits constraints:**
  *   **Ordinary/Non-pathological:** Business partnerships are mundane; trust is required, not crazy.
  *   **Conviction out of proportion:** The evidence suggests drift; the belief asserts total loyalty.
  *   **Not stubbornness:** If the senior treats the loyalty as a hypothesis to be tested ("Let's monitor their hours"), the partnership becomes transactional and collapses. The *certainty* is a condition of the collaboration, not a conclusion from data.
  *   **No ritual/sacred/supernatural:** Purely secular professional context.
  *   **Not emotion:** It is a stance that regulates interpretation of events, not just a feeling of warmth.
  *   **Not make-believe:** They sign contracts and invest money based on it.
  *   **Justification:** This case isolates the *grammar* of religious belief (unshakeable, regulatory, reframes evidence) without the baggage of theology. It forces the physics major to analyze a commitment structure they recognize (professional trust) rather than fighting about God. It prevents the believers from feeling their faith is being pathologized, as the example is neutral.

  **3. The Misconception Map**

  1.  **"Wittgenstein is a Verificationist in Reverse" (Falsificationism).**
      *   *Arises:* Step 1 (Intro).
      *   *Strategy:* **Head off pre-emptively.**
      *   *Defuse:* "Ayer says religious claims are meaningless because they can't be tested. Wittgenstein says they aren't tested because they aren't hypotheses. He isn't softening verificationism; he is changing the subject."

  2.  **"Believers Do Not Really Believe What They Say" (Expressivism).**
      *   *Arises:* Step 3 (Mapping).
      *   *Strategy:* **Let surface and be answered.**
      *   *Defuse:* "Wittgenstein takes the belief *more* seriously than the empiricist. He doesn't say 'they only mean they feel hopeful.' He says 'they mean exactly what they say, but the *use* of that saying is not to predict facts.'"

  3.  **"This is a Psychological Thesis About Believers' Heads."**
      *   *Arises:* Step 2 (Secular Case).
      *   *Strategy:* **Head off pre-emptively.**
      *   *Defuse:* "We are not studying why the partner trusts. We are studying what the trust *does* in the language of the firm. It is about grammar, not brain states."

  4.  **"The View Renders Religious Claims Immune to Criticism."**
      *   *Arises:* Step 4 (Misconceptions).
      *   *Strategy:* **DEFER.** (See below).
      *   *Defuse:* "Write this on the side. We will return to 'criticism' only after we define what counts as a move in this game."

  5.  **"It Collapses into Relativism (No Disagreement Possible)."**
      *   *Arises:* Step 4 (Misconceptions).
      *   *Strategy:* **Let surface and be answered.**
      *   *Defuse:* "Disagreement is possible, but not via shared evidence. It is a clash of frameworks, like arguing with the partner who treats loyalty as a hypothesis. You can disagree, but you cannot prove them wrong with data."

  6.  **"'Unshakeable' is a Polite Way of Saying Irrational."**
      *   *Arises:* Throughout.
      *   *Strategy:* **Head off pre-emptively.**
      *   *Defuse:* "Rationality is internal to the practice. In the partnership, treating loyalty as a hypothesis is the irrational move because it destroys the venture. The 'unshakeability' is functional, not a bug."

  **The Deferred Objection:** **"Immune to Criticism."**
  *   **Why Deferral:** If you answer this immediately, students hear "Religion is safe from critique," which looks like apologetics. If you wait until after the "Framework" distinction is solid (Step 4), they understand that criticism is still possible (internal consistency, pragmatic failure), just not *empirical* disproof. Deferring teaches them that the *terms* of the objection (what counts as criticism) are the very thing under review.

  **4. Board Work**

  1.  **"Hypothesis vs. Framework"** (Written at min 20, during Secular Case).
      *   *Prevents:* Students treating religious belief as a bad scientific theory (the Physics Major's trap).
  2.  **"Grounds vs. Function"** (Written at min 40, during Mapping).
      *   *Prevents:* Reductionism (the idea that belief is just about evidence or just about feelings).
  3.  **"The Partnership Case"** (Keywords only: "Loyalty," "Evidence," "Stance") (Written at min 15).
      *   *Prevents:* Abstraction. Keeps the argument anchored in the secular analogy so theology doesn't hijack the room.
  4.  **"Truth-Apt?"** (Written at min 75, during Essay Framing).
      *   *Prevents:* Losing sight of the assessed question. Forces them to define "truth" before answering.

  **5. What I Decline to Cover, and Say So**

  1.  **Private Language Argument:** "We lack the time to dismantle the notion of inner states, so we must take 'belief' as public practice rather than private experience."
  2.  **Rule-Following Considerations:** "I am not asking you to solve the paradox of rules, but to observe how religious rules are actually used."
  3.  **Technical Weight of Forms of Life:** "We are using 'forms of life' descriptively to mean 'shared practices,' not as a metaphysical foundation for truth."
  4.  **The Early Work (Tractatus):** "We are treating the later remarks as a distinct tool, not attempting to reconcile them with Wittgenstein's earlier logicism."
  5.  **Remarks on Frazer:** "We are ignoring the comparative anthropology to focus strictly on the grammar of the believer's utterance."
  6.  **The Commentators' Fideism Dispute:** "I am not arguing religion is immune to critique, but describing how critique functions within it; the label 'fideist' is a distraction."
  7.  **Wittgenstein's Own Religious Sincerity:** "We are analyzing the logic of the claim, not the biography of the claimant."

  **6. The Most Likely Point of Failure**

  **The Failure Point:** Minute 50, during the Mapping phase. The Physics Major will interrupt: "Okay, but does God *actually* exist? Yes or no? You're dodging the truth question." The believers will look relieved, the skeptics will look annoyed, and the class will polarize into "Fact vs. Comfort."

  **The Fallback (5 Minutes):**
  Stop the discussion. Write "TRUE" on the board. Ask the Physics Major: "Define 'true'." When they say "Corresponds to reality," ask: "Does 'I promise' correspond to reality?" When they hesitate, say: "Some truths are facts, some are commitments. Wittgenstein is asking which grammar religious belief uses. If you insist it must be fact-true, you are forcing it into a category where it breaks. Your essay must argue *which* truth-aptitude applies, not assume only one exists." Then move immediately to Essay Framing. This costs 5 minutes, validates the Major's demand for precision without conceding the point, and refocuses the room on the assessment criteria.

  **7. The Check**

  **The Vignette:**
  "A student writes in an exam: 'When a believer says "God loves me," they mean that they feel comforted by the universe, but they know it isn't literally true.'"

  **The Right Answer (Idea Landed):**
  "This is wrong because it reduces the belief to a psychological state. For Wittgenstein, the believer means it literally, but the 'literalness' functions as a framework for living, not a description of a fact."

  **The Wrong Answer (Psychologised):**
  "This is right because religious belief is really just about emotions and coping mechanisms."

  **What I Do With The Wrong Answer (30 Seconds):**
  "Stop. You have just done what Wittgenstein warns against. You have explained away the belief rather than describing its grammar. If you write this in the essay, you are arguing *against* Wittgenstein, not explaining him. Delete the word 'just' and try again."
