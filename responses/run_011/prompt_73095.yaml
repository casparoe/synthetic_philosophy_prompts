prompt: |-
  You are a philosopher of language who has chaired job-market practice panels for years and who can predict, from the composition of a room alone, where an argument will be attacked. Think carefully, and work in the mode of a practice-panel chair rather than a referee: I need to survive a question period, not to have my chapter improved. Resist the urge to argue with me. If you think one of my commitments is untenable, treat that as information about which questions will arrive, not as an invitation to lecture me.

  **The view I will defend.** I call it the ledger view. Its commitments:

  1. The lexical entry of a slur is identical to that of its neutral counterpart. Nothing derogatory is encoded in the word — not in its truth conditions, not in a conventional implicature, not in a presupposition, and not in a separate expressive dimension.
  2. What makes a word a slur is that a standing social rule prohibits tokens of it, and the rule exists because such a token, in an unlicensed context, is an act of entering a claim into a public record: the speaker publicly ranks the targeted group below themselves and thereby acquires a commitment that anyone present can hold them to, cite later, and treat as evidence of where they stand.
  3. Force is therefore graded and audience-relative rather than binary and lexical. A token does more damage the more the audience takes it to reveal a settled commitment of an identifiable speaker. I claim this predicts that force attenuates under anonymity unless the anonymity itself reads as concealment; that force survives indirect report of a named speaker's utterance but not hypothetical or generic mention; and that in some cases the ranking-claim is void — not excused, void — because the speaker's own social position makes it impossible to enter, which is how I handle in-group use and reclamation.
  4. Speculative coda: a word becomes eligible for this treatment when it first acquires a vocative use, a way of addressing a member of the group rather than describing them, with predicative uses inheriting the prohibition by association. This is my answer to why prohibitions attach to some words and not their near-synonyms.

  The argument on the day runs from the observation that the posited derogatory content does no compositional work that a story about the act and the audience's evidence cannot do, through the graded-force predictions in (3), which I take to be unavailable to lexical-content accounts without ad hoc machinery, to the vocative conjecture in (4).

  **The room.** Nobody in it works on slurs, and that is the point. There are two people who work on presupposition and projection and will reach automatically for a multidimensional semantics; one formal semanticist who built an architecture for expressives a decade ago, has moved on, but still cares about compositionality and about whether what I am offering is a semantics at all; a sociolinguist who studies reclamation and register and is not a philosopher — she will want to know whether my in-group/out-group boundary is something speakers can be wrong about; a graduate student working on Austinian infelicity who will ask whether "void" is a real category or a relabeled misfire; and a moral and political philosopher who attends everything and asks about consequences. All are competent, none are hostile for its own sake, none have read the chapter.

  **What I want, in this order.**

  - Half a page of brainstorming first: for each person in the room, what toolkit do they bring, and what does that toolkit make them unable to tolerate? Then list the objections a room of slur specialists would raise that this room will not, and set those aside — I only want the questions I will actually be asked.
  - The prep sheet itself: the eight or nine questions I will get, ranked by damage, meaning likelihood multiplied by how much of the chapter each one takes down if I fumble it. For each: the question phrased in that person's first-person idiom, using their vocabulary and their pet distinction; a reply deliverable in about two minutes aloud; the ground I should concede before I begin answering, so that the concession costs nothing; and one sentence naming exactly where the reply is soft, i.e. what they will say next if I am pressed.
  - Which single reply has to land for the chapter to survive the hour, and what I should say in my first two minutes to preempt the two misreadings I most expect: that I am saying slurs mean nothing, and that I have answered a different question from the one that was asked.
  - The one question I will be hoping nobody asks. Tell me why it is that one rather than a merely difficult one, and give me the least-bad fallback answer.

  No bibliography, no citations, no attributions to named authors or papers — I know that literature, and invented references would be worse than useless. Anchor everything to the view exactly as I have described it. Where you need an illustrative sentence, describe the configuration schematically rather than writing out an example containing an actual slur.
