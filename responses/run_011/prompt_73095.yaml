answer: |-
  ### Part 1: Brainstorming the Room

  **The Presupposition/Projection Pair:** Their toolkit is embedding tests (negation, conditionals, modals). They tolerate nothing that fails to project consistently. They will assume any stable, cancellable-free inference must be semantic or conventional. They cannot tolerate a pragmatic story that treats the derogatory force as something that behaves like a presupposition but isn't encoded. They will ask why the force survives embedding if it's just a social rule about tokening.

  **The Formal Semanticist:** Their toolkit is compositionality and semantic value assignment. They tolerate no "black boxes" where social rules do the work of semantic operators. They cannot tolerate a view that claims to be philosophy of language but offers no mechanism for how the word contributes to the proposition beyond its neutral counterpart. They will ask if this is semantics or sociology.

  **The Sociolinguist:** Their toolkit is variation and speaker intuition. They tolerate no rigid boundaries that contradict field data. They cannot tolerate a philosophical definition of "in-group" that ignores fluid identity. They will ask whether a speaker can be wrong about their own eligibility to enter a claim.

  **The Austinian Grad Student:** Their toolkit is felicity conditions and illocutionary taxonomy. They tolerate no loose use of technical terms like "void." They cannot tolerate a category error between a misfire (procedure flawed) and an abuse (procedure flawed by intent). They will ask if "void" is just a relabeled misfire.

  **The Moral/Political Philosopher:** Their toolkit is normative consequence and harm. They tolerate no descriptive accounts that evacuate the word of its moral weight. They cannot tolerate a view where harm depends entirely on audience uptake rather than the act itself. They will ask where the harm resides if the content is neutral.

  **Objections to Ignore:** You will not be asked about homophonic report puzzles, specific historical etymologies, psychological processing latencies, or comparisons to specific slurs in the literature. Specialists would ask whether your view handles embedded slurs in fiction or historical quotes; this room will ask about the structure of the act itself.

  ***

  ### Part 2: The Prep Sheet (Ranked by Damage)

  **1. The Formal Semanticist: "The Semantics Status"**
  *   **Question:** "If the lexical entry is identical to the neutral counterpart, and there is no expressive dimension, what compositional work is the slur doing? If none, are you offering a semantics or a sociology of usage?"
  *   **Reply:** "I am offering a semantics of the act, not just the word. The lexical entry provides the truth-conditional content, ensuring compositionality remains standard. The 'slur' status is a semantic rule governing the *licensing conditions* of the token, analogous to how indexicals require a context to resolve. The word contributes the same content, but the token triggers a different update to the common ground—specifically, the ledger entry. This is semantic because it governs truth-apt commitments, not just psychological states."
  *   **Concession:** Concede that this stretches the standard definition of "semantic value" beyond truth conditions.
  *   **Soft Spot:** They will press whether "licensing conditions" belong in the lexicon or the pragmatics.

  **2. The Presupposition Pair (A): "The Projection Problem"**
  *   **Question:** "Derogatory force projects out of negation and conditionals. If it's not encoded content, why doesn't it cancel in 'If he is a [slur], he won't be hired'?"
  *   **Reply:** "Because the prohibition is on the *token*, not the proposition. To utter the token in the antecedent is already to enter the claim into the ledger, regardless of the conditional's truth. The damage is done by the public ranking act inherent in tokening, not by the assertion of the conditional. The projection is actually a feature of the act's visibility, not semantic projection."
  *   **Concession:** Concede that this looks exactly like presupposition projection.
  *   **Soft Spot:** They will ask why other prohibited acts (like promising falsely) don't project similarly.

  **3. The Moral Philosopher: "The Location of Harm"**
  *   **Question:** "If the word carries no derogatory content, have you made the harm contingent on audience uptake? If the audience misses the ledger entry, is no harm done?"
  *   **Reply:** "No. The harm is in the objective change to the public record, not the audience's psychological reaction. Just as a signature binds you even if no one reads the contract, the token enters the ranking claim into the public record regardless of uptake. The audience's recognition determines the *force* (damage scale), but the *wrong* is the unauthorized entry itself."
  *   **Concession:** Concede that force is graded, but insist the violation is binary.
  *   **Soft Spot:** They will ask what makes the record "public" if no one accesses it.

  **4. The Austinian Grad Student: "Void vs. Misfire"**
  *   **Question:** "You say in-group use is 'void.' In Austin's terms, is this a misfire (procedure not understood) or an abuse (procedure flawed)? If the word is spoken, an act occurred."
  *   **Reply:** "It is a specific category of infelicity where the precondition for the act is the speaker's social position relative to the target. If the speaker is in-group, the precondition for 'ranking below' is absent. It is not that no words were spoken, but that the specific illocution of *ranking* cannot be executed by that speaker. It is void of ranking force, though not void of sound."
  *   **Concession:** Concede that 'void' is non-standard terminology.
  *   **Soft Spot:** They will ask if this makes the harm dependent on the speaker's identity rather than the word.

  **5. The Sociolinguist: "The Boundary Problem"**
  *   **Question:** "You say in-group use is void because the speaker cannot enter the ranking. But speakers can be wrong about their group status. Can a speaker voidlessly use a slur if they mistakenly believe they are in-group?"
  *   **Reply:** "No. The voidness depends on the actual social relation, not the belief. If an outsider mistakenly believes they are in-group, the act is not void; it is a violation. The ledger records the actual social position, not the speaker's self-conception."
  *   **Concession:** Concede this creates a gap between speaker intention and social reality.
  *   **Soft Spot:** They will ask how the audience adjudicates this in real time.

  **6. The Presupposition Pair (B): "Embedding under Attitude"**
  *   **Question:** "If I say 'John believes Sam is a [slur],' do I attribute the same belief as 'John believes Sam is a [neutral]'? If yes, your view is counterintuitive."
  *   **Reply:** "I attribute the same truth-conditional belief, but I also attribute to John the willingness to token the slur. The difference is not in the content believed, but in the commitment ascribed to the believer. The report tracks the agent's relationship to the ledger, not just the proposition."
  *   **Concession:** Concede this requires a richer notion of belief attribution.
  *   **Soft Spot:** They will ask if this collapses the distinction between believing and being disposed to say.

  **7. The Formal Semanticist: "The Vocative Conjecture"**
  *   **Question:** "Your coda says vocative use makes the word eligible. But many neutral terms have vocative use. What distinguishes the slur's vocative?"
  *   **Reply:** "The neutral vocative identifies; the slur vocative ranks. 'Hey [neutral]' calls attention; 'Hey [slur]' calls attention *and* enacts the ranking. The vocative is the primary site of the ranking act; the predicative inherits the prohibition because it describes the target using the ranking term."
  *   **Concession:** Concede this is the most speculative part of the view.
  *   **Soft Spot:** They will ask for evidence that vocative use historically precedes predicative.

  **8. The Moral Philosopher: "Reclamation"**
  *   **Question:** "If reclamation succeeds, does the word cease to be a slur? If so, does the lexical entry change?"
  *   **Reply:** "No, the lexical entry remains neutral. Reclamation changes the standing social rule. It creates a new license for specific speakers to token the word without entering the ranking claim. The word is the same; the ledger rules have been amended by the group."
  *   **Concession:** Concede that 'slur' becomes a unstable category under reclamation.
  *   **Soft Spot:** They will ask who has the authority to amend the ledger rules.

  **9. The Austinian Grad Student: "Anonymity"**
  *   **Question:** "You say force attenuates under anonymity. But online anonymity often increases harm. Does your view predict less harm online?"
  *   **Reply:** "It predicts less harm only if the anonymity reads as genuine concealment. If the anonymity reads as a shield for aggression (concealment of identity to avoid cost), the commitment is still entered, just by a 'masked' agent. The ledger records the mask as the agent."
  *   **Concession:** Concede the distinction between concealment and masking is subtle.
  *   **Soft Spot:** They will ask how the audience distinguishes the two.

  ***

  ### Part 3: The Crucial Reply & Preemptive Opening

  **The Single Crucial Reply:**
  You must land the reply to **Question 1 (The Formal Semanticist: "Is this semantics?")**. If you concede this is merely sociology or pragmatics, you lose the room's respect as a philosopher of language. You must insist that regulating the *conditions of tokening* is a semantic task because it governs the update of the common ground.

  **The Preemptive Opening (First 2 Minutes):**
  "Before we begin, I want to prevent two misunderstandings of the Ledger View. First, I am not claiming slurs mean nothing. They have full truth-conditional content, identical to their neutral counterparts. The difference lies not in *what* is said, but in *what is done* by saying it. Second, I am not answering a sociological question with a philosophical tool. I am arguing that the social rule *constitutes* the semantic prohibition. When I say the lexical entry is neutral, I am not evacuating the word of power; I am locating that power in the public record the speaker alters by tokening. My goal is to show that this locates the harm more precisely than encoding it in the lexicon."

  ***

  ### Part 4: The Deadly Question

  **The Question:**
  From the Presupposition Pair: **"If the derogatory force is not encoded, why does it behave like a conventional implicature in embedding contexts? Specifically, in 'It is not the case that he is a [slur],' the derogatory force survives. If it's just a social rule about tokening, why doesn't the negation cancel the act?"**

  **Why it is Deadly:**
  This is not merely difficult; it is fatal to Commitment 1. If the force survives negation, standard theory says it must be encoded (semantic or conventional). Your view says it is not encoded. If you cannot explain why a non-encoded social rule projects out of logical operators without ad hoc machinery, the view is empirically falsified by standard linguistic data. It exposes the tension between "it's just an act" and "it behaves like content."

  **The Least-Bad Fallback:**
  "Because the negation targets the proposition, but the tokening event precedes the proposition. To evaluate the negation, you must first process the token. The ledger entry happens at the moment of tokening, before the logical operator applies. The damage is done in the processing of the word, not the truth of the sentence."
  *(This is weak, but it shifts the burden to processing order rather than semantic encoding.)*
