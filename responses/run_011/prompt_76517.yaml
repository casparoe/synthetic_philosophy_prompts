answer: |-
  **Exam Question**

  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question:**
  Critics argue that Amartya Sen's entitlement approach explains the *mechanics* of starvation but fails to justify the moral condemnation of the 1943 Bengal Famine as a 'political crime.' Your colleague contends that without a normative theory of obligation, entitlement analysis cannot distinguish culpable withholding from ordinary commerce, risking either the criminalization of all market participants or the absolution of the state.

  Construct a normative criterion that allows an entitlement analysis to support the 'political crime' attribution without falling into this dilemma. In your answer, you must:
  1.  Define the specific threshold where entitlement failure becomes injustice.
  2.  Explain how this criterion distinguishes state culpability from trader speculation.
  3.  Directly address the objection that a descriptive framework of starvation is not a theory of obligation.

  ***

  **Model Answer**

  The dispute hinges on conflating the *cause* of starvation with the *basis* of culpability. My colleague is correct that Sen's entitlement approach is primarily positive: it maps legal and economic means to food, not moral duties. However, concluding that this precludes labeling Bengal a 'political crime' mistakes the locus of the obligation. The criterion for political crime should not be 'who withheld food,' but 'who failed to protect entitlements they had the capacity to secure.'

  To adjudicate this, we must adopt a **Protective Mandate Criterion**. In a governed state, the legitimacy of authority rests on securing the entitlements of citizens against foreseeable collapse. Entitlement failure becomes injustice not when markets fluctuate, but when the state actively degrades entitlement mappings or passively refuses remediation when capable. This shifts the normative weight from the trader's right to sell to the state's duty to protect.

  This criterion resolves the market dilemma. My colleague worries that blaming the state implicates traders. Under the Protective Mandate, traders engaging in speculation are operating within market norms; they are not criminals unless they conspire to violate specific rights (e.g., theft). Their 'withholding' is a reaction to price signals. The 'crime' lies in the state altering those signals through coercive policy (e.g., price controls creating black markets) and then refusing to intervene when the resulting entitlement failures become lethal. We do not criminalize the merchant; we indict the regulator who removed the safety net while tightening the noose.

  Applying this to Bengal: The 'Denial Policy' (confiscating boats and rice) was an active state destruction of rural entitlements. This was not a natural shock; it was a policy choice that converted a shortage into a famine. Subsequently, the refusal to import grain or acknowledge the crisis constituted a violation of the Protective Mandate. The state possessed the logistical capacity to restore entitlements (via relief or trade) but chose not to. This satisfies the criterion for political crime: the agent with the duty and capacity to prevent entitlement failure chose actions that ensured it.

  Finally, this addresses the objection that 'entitlements are not obligations.' While a descriptive map does not *contain* a normative compass, it identifies the *site* of obligation. In social contract theory, the state's monopoly on coercion is exchanged for security. When an entitlement analysis shows that starvation resulted from state-modified legal-economic arrangements rather than exogenous natural forces, it triggers the normative question: 'Did the state fulfill its side of the contract?' If the answer is no, the descriptive failure becomes a normative crime. Therefore, the entitlement approach does not need to be a theory of obligation itself; it serves as the evidentiary basis that proves the violation of the pre-existing political obligation to protect citizens from man-made destitution.

  ***

  **Marking Scheme**

  **1. Distinction between Positive Analysis and Normative Judgment (5 Marks)**
  *   **Requirement:** Student must acknowledge that Sen's framework describes *how* people starve (entitlement mapping), while 'crime' requires a moral judgment (ought).
  *   **Common Failure:** Students treat Sen's theory as inherently moral or claim the friend is wrong for saying it is descriptive.

  **2. Formulation of a Specific Normative Criterion (5 Marks)**
  *   **Requirement:** Student must propose a clear standard (e.g., 'Protective Mandate,' 'Duty to Rescue,' 'Capacity to Prevent') that bridges the gap between mechanics and justice.
  *   **Common Failure:** Vague appeals to 'human rights' or 'suffering' without linking them to the specific mechanics of entitlement failure.

  **3. Resolution of the Market/Trader Dilemma (5 Marks)**
  *   **Requirement:** Student must explain how their criterion avoids criminalizing standard speculation while still assigning blame for the outcome.
  *   **Common Failure:** Students either blame traders for 'greed' (violating the prompt's constraint) or ignore the market aspect entirely.

  **4. Application to Bengal Specifics (5 Marks)**
  *   **Requirement:** Student must apply the criterion to specific Bengal facts (e.g., Boat Denial, Price Controls, Relief Refusal) to demonstrate state culpability.
  *   **Common Failure:** Generic discussion of famine without referencing the specific policy interventions discussed in the prompt/course.

  **5. Addressing the 'Theory of Obligation' Objection (5 Marks)**
  *   **Requirement:** Student must explicitly argue how a descriptive framework can support a normative claim (e.g., by evidencing a breach of social contract).
  *   **Common Failure:** Dismissing the friend's rejoinder as irrelevant rather than engaging with the is-ought problem.
