  You have described the phenomenon with exceptional precision. You are not rediscovering Logical Omniscience; you are observing the necessary cost of solving it.

  The established philosophical concept for a context where substituting logically equivalent statements changes the truth value is **Hyperintensionality**.

  In standard (intensional) logic, if $\phi$ and $\psi$ are logically equivalent (true in exactly the same possible worlds), they are interchangeable in any context, including knowledge attributions ($K\phi \iff K\psi$). Your coordinator violates this. Because your system distinguishes between $\phi$ and $\psi$ despite their equivalence, the "Knows" operator in your model is **hyperintensional**.

  However, within Artificial Intelligence and Knowledge Representation (KR), where your work actually lives, this is more specifically discussed under **Syntactic Models of Belief** (or Explicit Knowledge). The specific artifact you are hitting—that the agent's state depends on the *form* of the input rather than its *content*—is technically called **Representation Dependence**.

  Here is how these concepts map to your situation, how they differ, and where the boundaries lie.

  ### 1. Hyperintensionality (The Philosophical Concept)
  *   **Definition:** A context is hyperintensional if it fails the principle of *Substitutivity Salva Veritate* for logically equivalent expressions. If "Agent knows $P$" is true, but "Agent knows $Q$" is false, even though $P \leftrightarrow Q$ is a logical theorem, the knowledge context is hyperintensional.
  *   **How it fits:** This is the exact logical property you have engineered. You have built a hyperintensional operator.
  *   **How it differs:** In philosophy, hyperintensionality is often motivated by *semantic* distinctions (e.g., "Superman is strong" vs. "Clark Kent is strong"—same referent, different cognitive mode). In your case, the distinction is purely *syntactic* (De Morgan's laws). You have created a system of **Syntactic Hyperintensionality**.
  *   **Verdict:** This is the correct philosophical label for the *logical behavior*.

  ### 2. Representation Dependence (The Engineering Concept)
  *   **Definition:** A system is representation-dependent if its output (or internal state) changes when the input is reformulated into an equivalent form, absent a normalization step.
  *   **How it fits:** This describes the *cause* of your observation. Because your inference rules are weak (to avoid omniscience) and you lack a canonicalizer (a rewriter that forces all formulas into a standard form), the system is sensitive to the encoding.
  *   **How it differs:** "Hyperintensionality" describes the *logic* (the failure of substitution). "Representation Dependence" describes the *implementation artifact* (the sensitivity to encoding).
  *   **Verdict:** This is the correct systems label for the *mechanism*.

  ### 3. Explicit vs. Implicit Knowledge (The Epistemic Concept)
  *   **Definition:** Introduced formally by Levesque (1984) and Fagin & Halpern (1988). **Implicit Knowledge** is what is true in all worlds consistent with the agent's information (subject to Logical Omniscience). **Explicit Knowledge** is what the agent has actually derived or stored.
  *   **How it fits:** You are modeling Explicit Knowledge. The variation you see is the defining feature of explicit knowledge: an agent explicitly knows $A \lor B$ but not $\neg(\neg A \land \neg B)$ until they perform the work to derive it.
  *   **Verdict:** This explains *why* you have the problem, but not the name of the sensitivity itself.

  ### Is this an Artifact or Inherent?
  It is **inherent to syntactic solutions for Logical Omniscience**.
  To prevent an agent from knowing everything (Omniscience), you must restrict their closure rules. Once you restrict closure, logically equivalent formulas are no longer guaranteed to be inter-derivable within the agent's resource bounds. Therefore, the agent's knowledge state *must* become sensitive to the formula's form.
  You can mitigate this by adding a **Canonicalization** step (rewriting all formulas to a normal form before storage), but this shifts the computational cost to the writer and reintroduces a form of omniscience (if the canonicalizer is powerful enough to spot all equivalences).

  ### Boundary Cases
  You asked about the edges. Here is how formal systems typically draw the lines:

  1.  **Renaming Bound Variables (Alpha-Conversion):**
      *   *Status:* **Not a change of spelling.**
      *   *Reasoning:* In almost all formal treatments, $\forall x. P(x)$ and $\forall y. P(y)$ are considered the *same* string (identity), not just equivalent. A well-formed checker should treat these as bitwise identical (via de Bruijn indices or similar). If your system distinguishes these, it is a bug, not a feature of hyperintensionality.

  2.  **First-Order vs. Propositional Encoding:**
      *   *Status:* **Change of Language / Granularity.**
      *   *Reasoning:* Moving from $\bigwedge_{i=1}^{200} P_i$ to $\forall x. P(x)$ is not just a rewrite; it changes the ontology. The quantified version contains *less* explicit information (it requires instantiation rules to access the individuals). This is a difference in **Information Granularity**, not just spelling.

  3.  **Equivalent via Long Proof:**
      *   *Status:* **Epistemic Opacity.**
      *   *Reasoning:* If $\phi \leftrightarrow \psi$ requires a 1,000-step proof, and your agent caps at 10 steps, the agent is **Epistemically Opaque** to that equivalence. This is distinct from the De Morgan case (1-step rewrite). Philosophers of computation (e.g., Horowitz) distinguish between *structural* sensitivity (your Case 1) and *complexity* sensitivity (your Case 3). Both fall under hyperintensionality, but the latter is often excused as "bounded rationality."

  ### Recommendation
  You are building a **Syntactic Model of Explicit Knowledge**. The sensitivity you observe is **Representation Dependence**, which is the practical manifestation of **Hyperintensionality**.

  If you want to search the literature to see how others handle this, search for "Hyperintensional Epistemic Logic" or "Awareness Structures" (Fagin/Halpern). You will find that they accept this sensitivity as the price of realism. They do not treat swapping equivalent formulations as a requirement; they treat it as a computational cost that the agent must explicitly pay.

  \answer{Hyperintensionality}
