answer: |-
  **Question 7 (30 Marks)**

  **Instructions:** Answer this question in the booklet provided. You have approximately 50 minutes. Your answer should be self-contained; do not rely on outside citations or named authors beyond the definitions provided below.

  **Stipulated Facts:**
  1.  **The Pasadena Game:** A fair coin is tossed until heads first appears at toss $n$. The payoff is $(-1)^{n-1} \cdot 2^n / n$ utils. The probability of outcome $n$ is $2^{-n}$. The expectation series terms are $(-1)^{n-1}/n$, which form a conditionally convergent series.
  2.  **The Riemann Rearrangement Theorem:** Any conditionally convergent series can be rearranged to converge to any real number, or to diverge.
  3.  **Measure-Theoretic Convention:** The expectation of a real-valued random variable is defined only when $E|X|$ is finite. Thus, a conditionally convergent series does not yield a well-defined expectation.
  4.  **The Valparaíso Game:** A variant of the Pasadena game where, whenever $n$ is a power of two, the payoff is $+2^n$ utils instead. The expectation series contains infinitely many terms equal to $+1$; its positive part diverges while its negative part converges to $-(1/2)\ln 2$. Its value is $+\infty$ unconditionally.

  **Essay Question:**
  The contrast between the Pasadena and Valparaíso games challenges the standard principle of maximizing expected utility. Write an essay that addresses the following three moves:

  1.  **Diagnosis:** Is the trouble with the Pasadena game a defect in the formalism (expectation is simply undefined, so the principle is silent) or a substantive normative failure (rationality requires a ranking where none exists)? Explain what turns on this distinction.
  2.  **Assessment of Escapes:** Evaluate whether the standard escape of passing to a bounded utility function is available here, given the payoffs are stipulated in utils. Furthermore, assess whether a comparative treatment (ranking gambles by the expected value of their difference) can successfully rank the Pasadena game against the Valparaíso game.
  3.  **Judgment on Fragility:** The Pasadena game sits a hair's breadth from the Valparaíso game. Does the reply "such cases are knife-edge, and a theory need not be robust on a negligible set of gambles" dissolve the paradox, concede it, or change its subject?

  Finally, state and defend three desiderata that any repaired decision principle must satisfy—specifically including **Rearrangement Invariance**, **Agreement with Ordinary EU on bounded gambles**, and a **Determinate Ranking of Pasadena against Valparaíso**. Identify a candidate repair (your own or adapted) and argue whether it meets all three.

  ***

  **Model Answer**

  The Pasadena game exposes a tension between mathematical formalism and normative decision theory. Mathematically, the expectation series is conditionally convergent, meaning its sum depends on the order of terms. By the Riemann rearrangement theorem, any real value can be generated by permuting the payoff sequence. Measure-theoretic convention resolves this by declaring the expectation undefined whenever the absolute expectation is infinite. However, normatively, agents face a choice: accept silence from the theory or impose a ranking. The core trouble is not merely computational but conceptual: does the undefined status reflect a defect in the formalism that needs fixing, or a substantive failure of rationality where no ranking exists? If the former, we seek a generalized expectation; if the latter, we must accept that some gambles are incomparable.

  This diagnosis dictates the viability of standard escapes. The Bernoulli move suggests bounding the utility function to ensure convergence. However, this escape is unavailable here because the payoffs are stipulated directly in utils. Imposing an external bound $M$ alters the gamble itself, truncating the very outcomes defined as possible. Similarly, a comparative approach ranks gambles by the expected value of their difference. While attractive, this fails when comparing Pasadena to Valparaíso. The difference between a conditionally convergent series and a divergent series is itself divergent. Thus, comparative expectation cannot generate a determinate ranking between these specific cases, leaving the agent without guidance where guidance seems intuitively necessary.

  The fragility of the Pasadena game sharpens this problem. The Valparaíso variant modifies payoffs only at powers of two, yet shifts the expectation from undefined to $+\infty$. This suggests the Pasadena game sits on a knife-edge where arbitrary indexing determines value. A defense claiming such cases are negligible misses the point: decision theory aims to guide choice under uncertainty, not just under generic uncertainty. If a theory cannot rank two clearly defined gambles because of index sensitivity, it concedes that rational preference is unstable. To say the set of such gambles is measure-zero is to change the subject from normative guidance to mathematical convenience. The paradox remains because the agent still holds the ticket and needs to decide whether to play.

  To repair the principle, three desiderata are essential. First, Rearrangement Invariance: the value of a gamble should not depend on the order of presentation, as the physical prospect is identical. Second, Agreement with Ordinary EU: on bounded-utility gambles, the repair must yield standard expected utility results. Third, Determinate Ranking: the repair must rank Pasadena against Valparaíso, preferably respecting the dominance intuition that Valparaíso is strictly better.

  Consider a candidate repair using the Principal Value of the series, summing symmetric partial sums. This satisfies Agreement with Ordinary EU for convergent cases. However, it fails Rearrangement Invariance because principal values depend on the specific indexing of the natural numbers. Furthermore, it may fail Determinate Ranking if the principal value of the difference remains undefined. Alternatively, a lexicographic rule prioritizing positive divergence might rank Valparaíso higher. This meets Determinate Ranking and likely Invariance if defined on the set of outcomes rather than indices. However, it risks violating Agreement with Ordinary EU if it overrides convergence in bounded cases. Ultimately, no repair satisfies all three perfectly without cost. The tension reveals that extending expected utility to infinite cases requires sacrificing either mathematical robustness or normative completeness. The best approach accepts a limited domain of applicability, acknowledging that while Valparaíso is preferable, the precise value of Pasadena remains formally inaccessible without altering the definition of utility itself.

  ***

  **Marking Scheme**

  | Criterion | Marks | What a first-class answer does | What a competent second-class answer does | Specific error that costs marks |
  | :--- | :--- | :--- | :--- | :--- |
  | **Mathematical Characterization** | 5 | Correctly distinguishes conditional convergence (undefined) from divergence (infinite) using stipulated facts. | Identifies the series behavior but conflates undefined with zero or infinite. | Treating conditional convergence as implying an expectation of zero or infinity rather than undefined. |
  | **Diagnostic Position** | 5 | Clearly articulates the stakes between formal silence and normative incompleteness. | Describes the paradox but fails to explain what turns on the diagnosis. | Asserting the paradox is purely mathematical without addressing normative implications. |
  | **Evaluation of Escapes** | 5 | Notes utils stipulation blocks bounded utility; shows comparative EV fails on difference series. | Discusses bounded utility but misses the utils constraint; assumes comparative EV works. | Invoking bounded utility without noticing payoffs are already utils; assuming difference series converges. |
  | **Fragility & Valparaíso** | 5 | Argues knife-edge defense changes the subject from guidance to measure theory. | Accepts the knife-edge defense as sufficient dissolution of the paradox. | Concluding Pasadena's value must be $+\infty$ solely from comparison with Valparaíso. |
  | **Desiderata & Repair** | 10 | Proposes three specific desiderata; tests a candidate repair against all three honestly. | Lists desiderata but fails to test the repair against all three or claims perfect success. | Assuming rearrangement changes the gamble without argument; claiming a repair meets all three without trade-off. |
  | **Total** | **30** | | | |

