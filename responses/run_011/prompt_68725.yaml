  The Pasadena game exposes a tension between mathematical formalism and normative decision theory. Mathematically, the expectation series is conditionally convergent, meaning its sum depends on the order of terms. By the Riemann rearrangement theorem, any real value can be generated by permuting the payoff sequence. Measure-theoretic convention resolves this by declaring the expectation undefined whenever the absolute expectation is infinite. However, normatively, agents face a choice: accept silence from the theory or impose a ranking. The core trouble is not merely computational but conceptual: does the undefined status reflect a defect in the formalism that needs fixing, or a substantive failure of rationality where no ranking exists? If the former, we seek a generalized expectation; if the latter, we must accept that some gambles are incomparable.

