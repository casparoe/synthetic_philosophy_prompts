  ### The Principle: Resolution-Relative Pluralism

  Your verdicts are not unified by a single definition of probability, but by a **sorting criterion based on temporal resolution and ontological source**. You distinguish between probabilities that track physical dispositions *before* an event is settled, and probabilities that track rational constraint *after* or *outside* settlement. You further prohibit applying probability to the *truth-status* of settled singular facts.

  **Clause 1: The Disposition Clause (Objective Chance)**
  *Probability is an objective, mind-independent feature of a physical setup when assigned to a future contingent grounded in indeterminism or robust physical symmetry.*
  *   **Motivation:** Cases (1), (2), (3), (5).
  *   **Function:** This secures the reality of chance in quantum decay, biological fitness, and atmospheric dynamics. It allows (5) because the assessment is indexed to the time *before* the hurricane made landfall ("feature of the atmosphere at the time").

  **Clause 2: The Methodological Clause (Macro-Objectivity)**
  *Probability is treated as objective when assigned to a deterministic process where micro-states are opaque and the setup exhibits stable symmetries, provided the assignment is third-person.*
  *   **Motivation:** Case (4).
  *   **Function:** This preserves the intuition that the lottery chance is "in the machine" despite determinism, distinguishing it from pure ignorance.

  **Clause 3: The Credence Clause (Epistemic/Logical)**
  *Probability is a measure of rational degree of belief when the truth-value is fixed (by necessity or past occurrence) but unknown, constrained by available evidence or objective frequencies relative to a description.*
  *   **Motivation:** Cases (7), (8), (9).
  *   **Function:** This handles the Riemann Hypothesis (necessary truth) and the Keys (settled contingent). It accommodates (9) by allowing the "real number" to be relative to a reference class without requiring a privileged class ontologically.

  **Clause 4: The Attribution Barrier (Incoherence Constraint)**
  *Probability cannot be assigned to the truth of a singular causal claim or a self-locating identity claim once the relevant process has resolved.*
  *   **Motivation:** Cases (6), (10), (11).
  *   **Function:** This blocks the "probability of guilt" (10) and "probability of cause" (6) because these ask for the chance of a *fact* rather than the chance of a *process*. It blocks (11) because self-locating identity is not a process output subject to symmetry in the same way ticket selection is.

  ---

  ### Application to New Cases

  1.  **The Engineer's Bridge:**
      *   **Verdict:** The probability is **Model-Relative Objective Chance**.
      *   **Application:** Clause 1 & 2. The bridge is unique, so there is no actual frequency. However, the engineer's insistence that the number is "not about her" places it in the Objective camp. Since the storm is a future contingent relative to the design phase, the probability is a feature of the *model* of the bridge-storm interaction. It is objective relative to the physics encoded in the model, even if the storm is a once-off event.
  2.  **The Unthrown Coin:**
      *   **Verdict:** **0.5 (Disposition).**
      *   **Application:** Clause 1. The probability attaches to the *disposition* of the coin, not the toss. Since the physical symmetry exists regardless of manifestation, the chance is real even if the trial never occurs.
  3.  **The Gym Tomorrow:**
      *   **Verdict:** **0.6 (Credence tracking Weak Propensity).**
      *   **Application:** Clause 3. While this concerns a future event, the source of uncertainty is your own agency ("freely decide"). You cannot treat your own free choice as an objective physical disposition without undermining the freedom you claim. Thus, 0.6 is a rational credence based on your habits, not an objective chance.

  ---

  ### The Cost of Simplicity: Overturning Case (4)

  If you require a metaphysically cleaner principle, you must overturn **Case (4)**.

  *   **The Conflict:** Clause 1 (Indeterministic Chance) and Clause 2 (Deterministic Chance) cannot both be "Objective" in the same sense without diluting the definition of Objectivity. If Chance is a mind-independent feature of the world (as you insist in 1 and 2), it cannot exist in a deterministic system (4).
  *   **The Revision:** Reclassify (4) as **Epistemic Credence** (Clause 3). The 1-in-a-million is a measure of your ignorance of the micro-state, not a feature of the machine.
  *   **The Cost:** You lose the intuition that the lottery chance is "out there" waiting to be discovered. It becomes "in here," dependent on the agent's lack of information. However, this unifies your ontology: **Real Chance** exists only where nature is indeterministic (1, 2, 3, 5); everything else is **Rational Credence** (4, 7, 8, 9).

  ---

  ### Pluralism Assessment

  Your view is a **Principled Pluralism**, not a shrug.

  *   **Sorting Criterion:** **Temporal Resolution + Ontic Source.**
      *   *Is the event settled?* If Yes → Credence (or Incoherent). If No → Chance.
      *   *Is the uncertainty physical or informational?* If Physical → Objective Chance. If Informational → Credence.
      *   *Is the proposition about singular attribution?* If Yes → Incoherent.
  *   **Incoherence Warning:** **Case (9)** is the most vulnerable. You claim the number is "real" but "moves with the description" with "no privileged description." If no description is privileged, the "realness" is ontologically idle. For precision, you should admit (9) is **Objective Epistemic Probability**: the number is real *as a constraint on rational belief*, not as a property of the man. Dropping the claim that it is a "property of the man" saves the view from metaphysical vagueness.

  **Summary:** Adopt the **Resolution-Relative Dualism**. Sacrifice the Objectivity of (4) for metaphysical cleanliness, and reclassify (9) as Objective Epistemic rather than Ontic. This preserves your core intuitions about science (1, 2, 3) and logic (6, 10, 11) while removing the tension between determinism and chance.
