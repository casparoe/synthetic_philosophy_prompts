answer: |-
  **EXAMINATION PAPER**

  **Course:** PHIL/HIST 450: *The Evidential Mind in Victorian Britain*
  **Section:** B
  **Time Allowed:** 75 Minutes
  **Marks:** 25

  **Question 1**

  Read the following extract and data summary derived from the Society for Psychical Research's *Report on the Census of Hallucinations* (1894), led by Henry Sidgwick:

  > **Extract A:** "The result of the inquiry... shows that between deaths and apparitions of the dying person a connexion exists which is not due to chance alone. We do not claim that this proves the survival of the human personality after death, nor does it necessarily imply a moral order. It establishes an anomaly in the statistics of coincidence."
  >
  > **Data Summary:**
  > *   **Sample:** ~17,000 respondents canvassed by 410 interviewers.
  > *   **Incidence:** Approx. 1 in 10 reported a vivid hallucinatory experience.
  > *   **Coincidence:** 350 first-hand cases where an apparition of a recognizable person coincided with that person's death within 12 hours.
  > *   **Statistical Claim:** This rate of coincidence stands roughly 440 times above what random chance would predict.

  In the closing chapters of *The Methods of Ethics*, Sidgwick identifies a "Dualism of Practical Reason." He argues that unless there is a "moral government of the universe" guaranteeing the ultimate coincidence of Duty and Happiness, reason is divided against itself. Sidgwick hoped psychical research might provide the evidential footing for such a guarantee.

  **Essay Question:**
  Critically evaluate whether the evidential warrant provided by the *Census of Hallucinations* (as described above) is capable of resolving the Dualism of Practical Reason. In your answer, distinguish between the *methodological* conclusion of the *Census* (regarding statistical connexion) and the *metaphysical* requirements of Sidgwick's ethical system (regarding cosmic justice). Conclude with a normative assessment: were Sidgwick's evidential standards in this context too permissive, too demanding, or aimed at the wrong target?

  ***

  **MODEL ANSWER**

  Sidgwick's engagement with psychical research is often reduced to a biographical curiosity—a rationalist seeking ghosts. However, when viewed through the lens of the *Methods of Ethics*, his involvement with the 1894 *Census of Hallucinations* represents a desperate philosophical attempt to bridge the gap between scientific naturalism and ethical rationality. To evaluate whether the *Census* could resolve the Dualism of Practical Reason, one must recognize that the evidential warrant provided by the *Census* is categorically insufficient for the ethical work Sidgwick required of it.

  The Dualism of Practical Reason arises because Sidgwick finds two equally rational but conflicting methods of ethics: Intuitionism (Duty) and Egoistic Hedonism (Happiness). Reason dictates we ought to maximize general happiness, but also that we ought to maximize our own. Without a divine sanction or a cosmic mechanism ensuring that virtue is eventually rewarded and vice punished, these dictates remain irreconcilable. Sidgwick needs more than an anomaly; he needs a *Moral Government*. He requires evidence not merely that consciousness persists, but that the universe is structured to align self-interest with moral duty.

  The *Census of Hallucinations*, however, offers a strictly limited warrant. As Extract A notes, the committee establishes only a "connexion... not due to chance alone." The statistical claim—that coincidence rates are 440 times above chance baseline—is a methodological triumph for the SPR, but a metaphysical failure for Sidgwick's ethics. A statistical excess proves that *something* is happening beyond random noise, but it does not define the nature of that *something*. As the Extract admits, this does not prove survival. The "connexion" could be explained by telepathy from a dying but still-living brain to a percipient, a phenomenon compatible with materialism and entirely neutral regarding moral justice. Even if one grants the stronger claim of post-mortem survival, persistence of consciousness is not equivalent to moral governance. A ghost may haunt; it does not necessarily judge, reward, or punish.

  Therefore, the gap between the *Census* and the *Methods* is unbridgeable. The *Census* operates within the realm of empirical generalization; it deals with frequencies, baselines, and reporting biases. The Dualism requires a transcendental postulate. Sidgwick attempts to use a probabilistic argument (the 440-fold excess) to secure a necessary truth (the rationality of morality). This is a category error. No amount of statistical significance regarding apparitions can logically entail the existence of a benevolent cosmic order. One could have a universe teeming with telepathic ghosts that is nonetheless morally indifferent.

  Normatively, Sidgwick's evidential standards here were aimed at the wrong target. He was not too permissive in accepting the *Census* data; the statistical rigor was actually quite advanced for its time, anticipating modern epidemiological methods. Nor was he too demanding of the data itself. His error was demanding that naturalistic evidence perform a theological function. He sought to validate a postulate of practical reason using the tools of theoretical reason. By treating the "connexion" of the *Census* as a stepping stone toward the "moral government" required by ethics, Sidgwick conflated the *unusual* with the *moral*.

  In conclusion, while the *Census* successfully isolated a psychological anomaly, it could not resolve the Dualism of Practical Reason. The statistical warrant establishes a deviation from chance, not a deviation from moral chaos. Sidgwick's tragedy was not that he believed in ghosts, but that he hoped a statistical correlation could do the work of a divine guarantee. The *Census* proves the mind is porous; it does not prove the universe is just.

  ***

  **MARKING SCHEME (25 Marks)**

  **Assessment Objectives:**
  1.  Accurate reconstruction of the Ethical Problem (Dualism/Moral Government).
  2.  Accurate reconstruction of the SPR Evidence (Census/Connexion vs. Survival).
  3.  Critical analysis of the gap between the two.
  4.  Normative assessment of Sidgwick's evidential strategy.

  **Marking Grid:**

  | **Component** | **Marks** | **Specific Moves Required** |
  | :--- | :---: | :--- |
  | **1. The Ethical Stakes** | **6** | **Must** define the Dualism not merely as Egoism vs. Utilitarianism, but as a conflict of *Reason* requiring reconciliation.<br>**Must** identify the specific requirement: a "Moral Government" or guarantee that Duty and Happiness coincide (cosmic justice), not just immortality. |
  | **2. The Evidential Warrant** | **6** | **Must** utilize the stem data (440x chance, 17,000 sample) correctly.<br>**Must** distinguish between the *Census* conclusion ("connexion," "anomaly") and the stronger claim of "survival."<br>**Must** note alternative explanations compatible with the data (e.g., telepathy from the living/dying). |
  | **3. The Critical Gap** | **8** | **First Class (7-8):** Explicitly argues that statistical significance $\neq$ moral significance. Notes that survival $\neq$ justice. Identifies the category error (theoretical vs. practical reason).<br>**Upper Second (5-6):** Identifies that the *Census* doesn't prove survival, but less clear on why survival wouldn't solve the ethical problem anyway.<br>**Lower Second (3-4):** Treats the *Census* as proof of survival and argues only about whether Sidgwick believed it. |
  | **4. Normative Assessment** | **3** | **Must** offer a judgment on Sidgwick's standards (Permissive/Demanding/Wrong Target).<br>**Award full marks** for "Wrong Target" argument (using empirical tools for transcendental needs). |
  | **5. Structure & Clarity** | **2** | Coherent argument, clear prose, correct use of Extract A. |

  **Necessary but Not Sufficient for a First (20+ marks):**
  *   Correctly citing the 440x statistic and the "connexion" wording from Extract A.
  *   Defining the Dualism as a problem of *rational coherence* rather than just a conflict of desires.
  *   *Note:* A student may hit all these points but still fail to achieve a First if they do not successfully argue *why* the evidence fails to meet the ethical need (Component 3).

  **Characteristic Errors (Deductions/Ceiling Limits):**
  *   **The Biographical Trap (Ceiling 14/25):** Essay focuses on Sidgwick's personal religious agnosticism or the founding history of the SPR rather than the logical relationship between the *Census* and the *Methods*.
  *   **The Survival Fallacy (Deduct 5 marks):** Treating the *Census* data as conclusive proof of post-mortem survival, ignoring the Extract's explicit disclaimer ("We do not claim that this proves the survival").
  *   **The Statistical Naivety (Deduct 3 marks):** Assuming the 440x excess settles the metaphysics without questioning the baseline independence of deaths/reports or selection bias in the 17,000 respondents.
  *   **The Ethical Reduction (Deduct 4 marks):** Describing the Dualism simply as "being good vs. being happy" without referencing the *rational* contradiction or the need for a *cosmic* guarantee.

  **Borderline Defense (12/13 vs 14/15):**
  *   **12/13 (Upper Second):** Student identifies that the *Census* proves an anomaly but not justice. Argument is clear but relies heavily on the stem data without expanding on the philosophical implications of "Moral Government."
  *   **14/15 (First):** Student explicitly identifies the *category error*. They articulate that Sidgwick is trying to use *theoretical reason* (evidence/statistics) to solve a problem of *practical reason* (moral postulates). They use Extract A to show Sidgwick knew the limitation ("anomaly") yet hoped it would suffice.

  **Use of Document (Extract A):**
  *   **Reward:** Explicitly quoting the phrase "connexion exists which is not due to chance alone" to argue that "connexion" is weaker than "causation" or "justice."
  *   **Penalty:** Ignoring the Extract's disclaimer regarding survival.
