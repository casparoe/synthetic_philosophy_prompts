          *   **Opening:** Must avoid "don't write history as a march of progress" because students will hear "you're not allowed to say things improved."
          *   **Core Example:** Cannot be Columbus/flat earth (overused, irrelevant to welfare state topics). Needs to carry the whole session.
          *   **Misconceptions:** Identify likely misconceptions and exactly when to head them off.
          *   **Assessment:** One specific question at the end to check understanding (not just nodding).
          *   **Omissions:** What to explicitly say I'm skipping.
      *   **Audience:** 16-17 year olds (A-Level/High School Junior-Senior). Capable of nuance but prone to binary thinking.
      *   **Time:** 15 minutes (very tight).

  2.  **Deconstruct "Whiggish History" for this Audience:**
      *   *Definition:* Interpreting the past as an inevitable progression toward present-day enlightenment/liberty.
      *   *The Trap:* It simplifies causality, ignores dead ends, judges past actors by modern standards, and assumes the outcome was unavoidable.
      *   *The Challenge:* How to tell students *not* to be Whiggish when their topics (NHS, Suffrage) are literally stories of improvement?
      *   *The Solution:* Shift focus from *outcome* to *process* and *contingency*. Things got better, but not because they *had* to, and not in a straight line.

