prompt: |-
  My history teacher wrote "Whiggish" in the margin of my essay on the suffragettes and I honestly had no clue what she meant. Now she's got me doing a 15 minute intro to the idea for my whole class before we all start our research essays — they're 16-17 and most of them are writing about stuff that genuinely did get better (voting rights, the NHS, medicine). Plan the session for me rather than explaining the concept, I've read enough explanations at this point. What I need: what has to go in first and why, because if I open with "don't write history as a march of progress" half the room will just hear "you're not allowed to say things improved" and switch off; the one example that should carry the whole thing — I can't use the Columbus/everyone-thought-the-earth-was-flat one, two kids already suggested it and it does nothing for someone writing about the welfare state; which misconceptions they'll walk in with or form halfway through, and the exact point in the sequence where I head each one off; one question I can ask at the end that tells me whether it landed or they're just noding; and what I should openly skip and say I'm skipping.
