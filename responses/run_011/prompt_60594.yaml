      *Okay, I'll go with **The Story of Penicillin**.* It's medicine (one group), it involves state production in WWII (welfare/state group), and it shows contingency (discovery didn't equal immediate cure).
      *Actually, the "Ladder vs. Jungle" analogy is better than a specific event.* No, the prompt asks for "the one example."
      *Okay, I will choose **The 1918 Flu Pandemic vs. 2020 Pandemic**.* No, too political.
      *Let's go back to **The NHS**.* It's the most relevant.
