      *   *Case 4 (Missing Jar):* Non-apprehension reduced to Perception. (Perceiving the floor *qualified by absence* of jar).
      *   *Case 5 (Headman's Order/Clerk):* Testimony (*śabda*). Source is the Author (Headman), not the Medium (Clerk). Trustworthiness of author matters.
      *   *Case 6 (Merchant's Ledger/Copy):* Testimony. Chain of custody preserves knowledge even without direct contact with facts. Faithful transmission matters.
      *   *Case 7 (Liar's True Statement):* Not Knowledge. Understanding $\neq$ Knowing. Trustworthiness of speaker is necessary condition.
