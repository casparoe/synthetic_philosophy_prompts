answer: |-
  ### Diagnosis: Where Proxy-Science Intuitions Mislead

  Your training treats data as passive and instruments as stable; historiography treats data as active and instruments as volatile. First, **Agency and Interest.** A sediment core has no stake in your conclusion; a witness does. Documents are generated by agents seeking to preserve reputation, evade liability, or settle scores. You must assess motive and interest, not merely signal-to-noise ratio. A "noisy" source may be lying, not just imprecise.

  Second, **Genealogical Independence.** In instrumental science, two sensors are independent if physically separate. In history, two documents are independent only if genealogically separate. If Document B copied Document A, they are one data point, not two. Shared errors—like a unique phrase or a specific mistake—prove common ancestry, not corroboration. Counting sources without checking their lineage inflates confidence falsely.

  Third, **Claim-Specific Calibration.** An instrument's calibration is generally stable across its range. A source's reliability is not. A single document can be excellent evidence for the weather (which the author observed) and worthless evidence for a neighbor's morality (which the author guessed or maligned). Reliability attaches to particular claims, not to the source or its author as a whole. You must segment the argument and test each claim against the source's specific competence and motive for that claim.

  ### Procedure

  ```json
  [
    {
      "step": 1,
      "test": "Does the submission contain internal contradictions or claims that contradict established hard facts?",
      "how": "Scan the text for dates, names, or sequences that conflict within the paper or with basic public records available in the office.",
      "passes_if": "No internal contradictions or obvious factual errors are found.",
      "fails_to": "reject",
      "requires_judgment": false,
      "judgment_note": "n/a",
      "depends_on": []
    },
    {
      "step": 2,
      "test": "Are sources presented as independent corroboration actually genealogically independent?",
