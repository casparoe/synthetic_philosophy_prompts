  ### Summary

  Treat documents not as instruments but as witnesses: check for motive, not just noise. Verify that corroborating sources are genealogically independent, not just physically separate, by hunting for shared errors. Reliability belongs to specific claims, not whole sources; a diary may be right about rain and wrong about rumors. Never accept an argument from silence unless the author proves the record was made and should have survived. If sources contradict, demand a reason for preference based on access or interest. Publish only what survives these tests, or qualify it heavily.

  ### Limits of the Procedure

  This procedure cannot eliminate judgment; it merely structures it. Steps 2, 3, 5, and 6 are dressed-up judgment calls. There is no algorithm for deciding whether a shared phrase is coincidental or proof of copying, nor for weighing whether a motive was strong enough to induce a lie. Furthermore, this procedure never licenses a positive claim about what *actually* happened; it only licenses a claim about what the evidence permits us to assert without negligence. History deals in warranted assertibility, not ontological truth. The step a scientifically trained reader is most likely to skip is Step 2 (Genealogical Independence). You are accustomed to treating distinct sensors as independent data points; you must resist the instinct to count two newspapers as two data points without checking if one copied the other. That error inflates confidence faster than any other.

