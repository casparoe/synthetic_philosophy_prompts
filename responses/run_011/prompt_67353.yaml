prompt: |-
  I'm the volunteer governance lead for a professional association (about 6,000 members, one big annual meeting) and I've been dragged into a bylaws rewrite. Three things get voted on regularly: an annual prize (usually five to nine finalists, decided by a 40-member selection committee using secret ballots and sequential elimination of the lowest each round), board elections (14 seats, around 30 nominees, whole membership votes, STV with a Droop quota), and occasional referenda — this year it's whether dues go up 4%, up 11%, or stay flat, plurality wins.

  Last year's board election went badly and I think its my fault for not understanding what I was administering. There's a well-organized caucus from one subfield, maybe 12% of the people who actually vote, and they got five of their own elected. Afterwards several of them told me cheerfully that they'd planned it in advance: list only our five, list nobody else, don't bother with preferences. Meanwhile the prize had a different mess — one heavy favorite and two similar mid-tier candidates, and afterwards a couple of committee members admitted they'd buried one of the similar ones to stop a split.

  Our committee is seven people, none of us voting theorists, plus one retired economist who keeps saying "Gibbard–Satterthwaite, so it doesn't matter what we pick" and then proposes things anyway. Two hours a month, spreadsheets at most, and whatever we recommend has to survive a membership vote to amend the bylaws.

  What I want is a procedure, not an essay. Something we can run whenever a rule question lands on the agenda — which rule for which office, whether to change one, whether a screening stage is allowed — with the questions to ask in order, what counts as a settled answer to each, and the points where the procedure stops and hands the choice back to the membership because it's a values call rather than a technical one. Crucially it must not let us hide behind "every rule is manipulable." I need to be able to tell the economist why that sentence doesn't end the conversation, and tell the other six what it does rule out.

  Then run it on three cases: the prize with one favorite and two similar rivals; the 14-seat board election with the caucus; and the three-option dues referendum, where I suspect there's a majority cycle. At least one of those should come out in a way the committee will hate — better now than at the annual meeting.

  Two things I want handled explicitly rather than glossed. First, does screening at the nomination stage actually get us out from under the impossibility result, or does it just relocate the manipulation somewhere less visible? We're floating a nominations committee that narrows 30 nominees down to 14 before the membership votes. Second, someone proposed "randomize among the top three after a ranked count" as a fix — is that even coherent, and can the procedure tell us when randomization earns its keep versus when it's just noise dressed as fairness?

  Last thing: the economist wants a rule where nobody can gain more than "one ranking position's worth" by lying. I think that's not measurable on the ballots we actually collect, but I can't argue it properly. Say whether he's wrong, and if he isn't, how seven non-specialists would check it in practice.

  No citations or reading list — I'm not writing anything up, I just need something usable at next month's meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Volunteer governance lead for a professional association (6,000 members).
      *   **Task:** Leading a bylaws rewrite committee (7 people + 1 retired economist).
      *   **Constraints:** 2 hours/month, spreadsheets max, no voting theory expertise, recommendations must survive a membership vote.
      *   **Pain Points:** Last year's board election (caucus exploited STV), Prize voting (tactical burial), Referenda (potential cycles), Economist saying "Gibbard-Satterthwaite means nothing matters."
      *   **Goal:** A *procedure* (checklist/flowchart style), not an essay. Needs to handle specific cases (Prize, Board, Referenda). Needs to address Screening/Nominations and Randomization. Needs to debunk/address the Economist's "one ranking position" claim.
      *   **Tone:** Practical, decisive, actionable, no citations/reading list.

  2.  **Deconstruct the Request:**
      *   **Core Deliverable:** A decision procedure for selecting voting rules.
      *   **Specific Questions to Answer:**
          *   Does screening avoid impossibility theorems?
          *   Is randomization coherent/useful?
          *   Is the Economist's "one ranking position" claim valid/measurable?
      *   **Test Cases:** Prize (1 fav, 2 similar), Board (14 seats, caucus), Referenda (3 options, potential cycle).
      *   **Requirement:** At least one outcome must be unpopular/uncomfortable for the committee (to show the procedure works).

  3.  **Drafting the Procedure (The "Governance Filter"):**
      *   Need a step-by-step process that forces the committee to define *goals* before picking *methods*.
      *   *Step 1: Define the Objective.* What are we maximizing? (Legitimacy? Diversity? Efficiency? Stability?)
      *   *Step 2: Define the Input.* What ballots can we realistically collect? (Rankings? Approval? Yes/No?)
      *   *Step 3: Check for Cycles/Condorcet.* Is there a likely majority cycle?
      *   *Step 4: Manipulation Resistance.* Not "immune" (impossible), but "resistant to specific known threats."
      *   *Step 5: The Values Handoff.* Where technical analysis ends and political choice begins.
      *   *Addressing the Economist:* Gibbard-Satterthwaite says *some* manipulation is always possible, not that *all* rules are equally bad. It doesn't mean "nothing matters."

  4.  **Addressing Specific Technical Questions:**
      *   **Screening:** Does it help? It reduces the set, moving manipulation to the screening stage. It doesn't solve G-S, but it can reduce complexity for voters. *Verdict:* It relocates manipulation, doesn't eliminate it. Needs its own rules.
      *   **Randomization:** "Randomize among top 3." This is a tie-breaking rule, not a voting method. It adds noise. Only useful if there's a true tie or to prevent exact strategic targeting. *Verdict:* Generally noise, unless specific tie conditions exist.
      *   **Economist's Claim:** "Nobody can gain more than one ranking position's worth." This is nonsense in standard social choice. Manipulation can change the winner entirely (gain $N$ positions). There is no standard metric for "one ranking position's worth." *Verdict:* He is wrong.

  5.  **Running the Test Cases:**
      *   **Case 1: The Prize (Committee of 40, 5-9 finalists, sequential elimination).**
          *   *Problem:* Burial of similar candidates.
          *   *Analysis:* Sequential elimination (Hare/IRV style) is vulnerable to burial.
          *   *Procedure Output:* Switch to a method less sensitive to burial (e.g., Approval or Score) OR change the elimination rule.
          *   *Uncomfortable Outcome:* The procedure might suggest dropping secret ballots or changing the committee size to reduce coordination ability. Let's make it suggest *Approval Voting* which committee members hate because it feels "less nuanced."
      *   **Case 2: The Board (14 seats, 30 nominees, STV, Caucus).**
          *   *Problem:* Caucus bullet-voted (plumped) to maximize seats. STV allows this.
          *   *Analysis:* STV is proportional but vulnerable to "bullet voting" if the quota is low enough or if the caucus is disciplined.
          *   *Procedure Output:* To stop this, you need a method that penalizes non-ranking or requires full ranking. But G-S says they can still lie.
          *   *Uncomfortable Outcome:* The procedure should recommend *limiting the number of nominees* or *changing the quota*. Or, more radically, acknowledging that STV *rewards* disciplined caucuses and suggesting a shift to Block Voting (at-large) if diversity is less important than majority rule, OR suggesting a cap on seats per subfield. Let's go with: *The procedure flags that STV inherently rewards disciplined blocs. To stop this, you must restrict nomination rights, which is a values call.*
      *   **Case 3: Referenda (3 options, Plurality).**
          *   *Problem:* 4%, 11%, Flat. Plurality leads to split vote.
          *   *Analysis:* High risk of Condorcet cycle or spoiler effect.
          *   *Procedure Output:* Plurality is unacceptable for >2 options. Needs Ranked Choice or Two-Round.
          *   *Uncomfortable Outcome:* The procedure might say *Combine the two 'Up' options into one tiered proposal* before voting. Members hate losing the nuance of the 4% vs 11% choice.

  6.  **Refining the "Procedure" for the User:**
      *   Make it a checklist.
      *   Include "Stop Rules" (when to hand off to membership).
      *   Include the "Economist Rebuttal" script.

  7.  **Review against Constraints:**
      *   No citations? Check.
      *   Usable at next month's meeting? Check.
      *   Address screening/randomization/economist claim? Check.
      *   One outcome the committee will hate? I need to ensure the Prize or Board recommendation is painful. Let's make the Prize recommendation painful: *Abolish the sequential elimination and use a simple score count.* Committee loves the drama of elimination; procedure kills it. Or for the Board: *Acknowledge you cannot stop the caucus without violating voter freedom.* That's a hard pill to swallow. Let's go with the Board one: The procedure concludes that stopping the caucus requires restricting ballot freedom, which is a political decision, not technical.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but collaborative.
      *   Make sure the "Economist Rebuttal" is sharp.
      *   Ensure the Screening and Randomization sections are distinct.

  *(Self-Correction during drafting)*: Wait, the user wants the procedure to output a result for the three cases where *at least one* is something the committee will hate.
  *   *Prize:* Committee likes the drama of elimination. Procedure might say "Use Score Voting." Committee hates it (too simple).
  *   *Board:* Committee wants to stop the caucus. Procedure says "STV is doing its job; the caucus represents a minority. To stop them, you need gerrymandering or nomination limits." Committee hates that answer.
  *   *Referenda:* Committee wants a clean vote. Procedure says "Plurality is broken, use Ranked Choice." Committee might hate the complexity.
  *   *Decision:* The Board answer is the strongest "hate" candidate because it tells them their goal (stop the caucus) is incompatible with their constraint (free elections).

  *(Refining the Economist Claim)*: The "one ranking position" claim sounds like a misunderstanding of "single-peaked preferences" or perhaps a specific bound in strategy-proofness literature (like partial implementation), but in general practice, it's false. A liar can make their last choice win. I need to explain *why* it's unmeasurable without jargon.

  *(Refining Screening)*: Screening moves the manipulation to the nominating committee. It doesn't solve G-S. It just changes *who* manipulates.

  *(Refining Randomization)*: Randomizing among top 3 is only useful if the top 3 are effectively tied. Otherwise, it reduces expected utility for the majority.

  Let's assemble the document.

  **Structure:**
  1.  **The Governance Filter (The Procedure)**
  2.  **The Economist Script (Gibbard-Satterthwaite)**
  3.  **Specific Technical Rulings (Screening, Randomization, The "One Position" Claim)**
  4.  **Case Studies (Prize, Board, Referenda)**

  *Wait, one constraint:* "No citations or reading list." Keep it clean.
  *Another constraint:* "Something we can run whenever a rule question lands on the agenda."
  *Another constraint:* "At least one of those should come out in a way the committee will hate."

  Okay, let's write it.
answer: |-
  # The Governance Filter: A Decision Procedure for Voting Rules

  Use this checklist for every bylaws change involving elections or votes. Do not skip steps. If you reach a "Values Handoff," stop technical analysis and prepare a membership FAQ.

  ## Phase 1: Objective Definition
  *Before discussing methods, agree on the primary goal.*
  1.  **What are we maximizing?** (Choose one)
      *   [ ] **Legitimacy:** The winner must be acceptable to the majority (even if not the first choice).
      *   [ ] **Representation:** Distinct subgroups (e.g., subfields) should secure seats proportional to their size.
      *   [ ] **Efficiency:** The process must be fast, cheap, and understandable.
      *   [ ] **Quality:** The "best" candidate wins, even if polarizing.
  2.  **What is the cost of error?**
      *   [ ] **Low:** A bad winner can be fixed next year (e.g., committee seat).
      *   [ ] **High:** A bad winner causes lasting damage (e.g., dues increase, constitutional change).

  ## Phase 2: Input & Constraint Check
  1.  **Ballot Capacity:** Can members realistically rank 30 candidates?
      *   *If No:* You cannot use STV or Ranked Choice. Use Approval or Plurality.
      *   *If Yes:* Proceed.
  2.  **Strategic Threat:** Is there a known organized bloc?
      *   *If Yes:* Assume they will vote tactically (bullet voting or burial).
      *   *If No:* Assume honest voting.

  ## Phase 3: The Manipulation Test (The Economist Check)
  *Apply this before accepting any "impossibility" arguments.*
  1.  **The Claim:** "All systems are manipulable (Gibbard–Satterthwaite), so pick whatever."
  2.  **The Rebuttal:** "Manipulable" does not mean "Equally Vulnerable."
      *   *Question:* Does this rule make manipulation **harder to coordinate** or **riskier** for the liar?
      *   *Pass:* A rule where lying requires perfect information about others' votes (high risk).
      *   *Fail:* A rule where lying is a dominant strategy (safe to lie).
  3.  **The "One Position" Claim:** (See Technical Rulings below).
      *   *Verdict:* Reject any rule justified by "limiting gain to one position." This is not measurable on standard ballots.

  ## Phase 4: Method Selection
  *Match the goal from Phase 1 to the method.*
  *   **Goal: Legitimacy + >2 Options:** Ranked Choice (IRV) or Two-Round Runoff. (Avoid Plurality).
  *   **Goal: Representation + Multi-Seat:** STV is standard, *but* acknowledges disciplined blocs will win seats. To block blocs, you must restrict nominations (Values Handoff).
  *   **Goal: Quality + Committee:** Score/Range Voting or Approval. (Avoid Sequential Elimination).
  *   **Goal: Efficiency:** Plurality or Approval.

  ## Phase 5: Values Handoff
  *Stop technical analysis here. These are political choices.*
  *   **Screening:** Does a nominating committee narrow the field?
      *   *Technical Fact:* This does not remove manipulation; it moves it to the nominating committee.
      *   *Decision:* Is it better for 7 insiders to manipulate the slate, or 6,000 members to manipulate the ballot?
  *   **Randomization:** Do we randomize ties?
      *   *Technical Fact:* Randomizing among non-tied top candidates reduces overall satisfaction. Only use for exact ties.
  *   **Caucus Management:** Do we want to prevent a subfield from winning seats?
      *   *Technical Fact:* You cannot stop a disciplined minority from winning representation in a proportional system without restricting voter freedom.
      *   *Decision:* Do we value "free voting" or "preventing caucus dominance" more?

  ---

  # Technical Rulings (For the Committee)

  ### 1. On Screening (Nominating Committees)
  **Question:** Does screening get us out from under the impossibility result?
  **Ruling:** **No.** It relocates the manipulation.
  **Explanation:** Gibbard–Satterthwaite applies to the final decision rule. If you screen 30 down to 14, the manipulation happens during the screening. If the screeners are strategic, they bury strong rivals before the membership ever sees them.
  **Action:** If you adopt screening, you must apply the Governance Filter to the *screening committee's* rules as strictly as the membership vote. Do not assume insiders are more honest than members.

  ### 2. On Randomization
  **Question:** Is "randomize among the top three" coherent?
  **Ruling:** **Only for ties.**
  **Explanation:** If Candidate A has 100 votes, B has 99, and C has 98, randomizing among them ignores the voters' distinction. It introduces noise, not fairness. It is only useful if the vote count is statistically indistinguishable (a true tie) or if the top candidates are functionally identical to the voters.
  **Action:** Do not use randomization to solve strategic voting. It punishes honest voters who tried to distinguish between candidates.

  ### 3. On the "One Ranking Position" Claim
  **Question:** Can we use a rule where lying gains no more than "one ranking position's worth"?
  **Ruling:** **The Economist is wrong.**
  **Explanation:** There is no standard metric for "ranking position worth." If I lie and make my 5th choice win instead of my 1st choice, I have gained 4 positions. In many systems, a single liar can change the winner from their 1st choice to their last choice.
  **Verification:** Take last year's ballot data. Swap one voter's top choice to their bottom choice. Run the count. Did the winner change? If yes, the gain was potentially massive, not "one position."
  **Action:** Dismiss this criterion. It sounds precise but is unmeasurable on the ballots you collect.

  ---

  # Case Studies (Run at the Meeting)

  ### Case 1: The Annual Prize
  *Context: 40-member committee, 5-9 finalists, sequential elimination (IRV-style), secret ballot.*
  *Problem: Burial of similar candidates (A and B split, C wins).*

  1.  **Objective:** Quality (pick the best paper/person).
  2.  **Threat:** Committee members coordinating to bury rivals.
  3.  **Analysis:** Sequential elimination is highly vulnerable to "burial" (ranking a strong rival last to knock them out early). The current mess proves the rule failed the Quality objective.
  4.  **Procedure Output:** **Switch to Score Voting (0-5 scale) or Approval.**
      *   *Why:* It removes the incentive to bury. You can rate your favorite 5 and the rival 4 without risking elimination.
      *   *Committee Friction:* **The committee will hate this.** They value the "drama" of elimination rounds and the secrecy of the process. Score voting is transparent and boring. It also requires changing the ballot structure.
      *   *Recommendation:* Adopt Score Voting. If secrecy is required, aggregate scores without revealing individual ballots.

  ### Case 2: The Board Election
  *Context: 14 seats, 30 nominees, STV, 12% caucus got 5 seats (36% of board).*
  *Problem: Disciplined caucus exploiting STV proportionality.*

  1.  **Objective:** Representation vs. Legitimacy.
  2.  **Threat:** Organized bloc voting (bullet voting).
  3.  **Analysis:** STV is *designed* to give minorities representation proportional to their vote share. A 12% bloc getting ~36% of seats suggests they either have >12% support or the Droop quota is allowing them to punch above weight due to vote fragmentation among the majority.
  4.  **Procedure Output:** **Values Handoff.**
      *   *Technical Fact:* You cannot stop a disciplined minority from winning seats in STV without violating the "one member, one vote" principle or restricting nominations.
      *   *Option A (Keep STV):* Accept that organized subfields will win seats. This is a feature, not a bug, of proportional representation.
      *   *Option B (Stop the Caucus):* You must move to **Block Voting (At-Large Plurality)**. This favors the majority but wipes out minorities. OR, you must empower a Nominating Committee to limit the slate to 14 candidates (Screening).
      *   *Committee Friction:* **The committee will hate this.** They want to stop the caucus *without* admitting they have to restrict voter freedom. The procedure forces them to admit: "To stop them, we must limit who can run."
      *   *Recommendation:* If diversity is a value, keep STV and accept the caucus. If majority rule is the value, switch to Block Voting. Do not pretend STV can be "tweaked" to stop disciplined blocs.

  ### Case 3: The Dues Referendum
  *Context: 3 options (Flat, +4%, +11%), Plurality rule.*
  *Problem: Potential Condorcet Cycle / Spoiler Effect.*

  1.  **Objective:** Legitimacy (avoid a winner most people oppose).
  2.  **Threat:** Vote splitting between +4% and +11% allows "Flat" to win with 40%, even if 60% wanted an increase. Or vice versa.
  3.  **Analysis:** Plurality with >2 options is technically indefensible for high-cost decisions. A majority cycle is likely (Flat beats +11%, +4% beats Flat, +11% beats +4% in pairwise).
  4.  **Procedure Output:** **Two-Round Runoff or Ranked Choice.**
      *   *Why:* Plurality is rejected by Phase 4 (Legitimacy + >2 Options).
      *   *Committee Friction:* **The committee will hate the complexity.** They want a simple "Up/Down" vote.
      *   *Recommendation:* **Consolidate the options.** The procedure suggests the Board should propose *one* increase amount (e.g., +7%) vs. Flat.
      *   *Why this hurts:* It removes member agency to choose the *level* of increase. It forces the Board to pick the number, risking anger if they pick too high. But it guarantees a stable majority mandate.
      *   *Alternative:* If you must keep 3 options, use Ranked Choice. But warn members: "If no majority, the top two go to a runoff."

  ---

  # Summary of Actions for Next Month

  1.  **To the Economist:** "Gibbard–Satterthwaite proves manipulation is *possible*, not that all rules are *equally bad*. We are selecting the rule where manipulation is riskiest for the liar. Also, your 'one position' metric is unmeasurable on our ballots; we tested it on last year's data and it failed."
  2.  **To the Committee:** "We are adopting the Governance Filter. It forces us to admit when a problem is political, not technical."
  3.  **The Hard Pills:**
      *   **Prize:** We are likely moving to Score Voting. It kills the elimination drama.
      *   **Board:** We must admit STV *allowed* the caucus. To stop them, we must restrict nominations. Are we willing to be the 'bad guys' who limit who can run?
      *   **Referenda:** We cannot run 3 options under Plurality. We must either combine them into one Board proposal or use Ranked Choice.

  **Final Check:** If the committee refuses the "Values Handoff" on the Board election, the procedure dictates you **document the risk** in the bylaws report: *"Under STV, disciplined minorities will win proportional seats. This is mathematically guaranteed. If this is undesirable, change the system to Block Voting."* This protects you when the caucus wins again next year.
