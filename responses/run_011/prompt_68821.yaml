  I'm in the middle of a novel set during the year my city takes down two statues and renames four streets, and the research has pushed me into an actual position I want stress-tested before I build the book's argument on it. Here's the position: monuments and street names don't assert anything. They aren't claims about the person they honor that could be true or false, and they aren't really speech at all — they're a standing, pre-propositional thank-you built into public space, a default of gratitude and deference that people absorb by walking past rather than by reading. On this view the folks who say a statue is a lie about a slaveholder are making a category mistake, and so are the ones who say taking it down censors a claim, since nothing was claimed. Removal just withdraws the default; it rearranges the furniture of attention, not the record.

  What would count against this? I want the genuine defeaters, not the ones critics reach for out of habit. Which observations about how monuments actually work — including empirical stuff about whether anyone notices them, whether a street name changes anything measurable, whether people in practice do treat them as assertions — would undercut the view, and which woud merely be awkward for it? Is there a case it flatly can't describe: a memorial that seems to be doing assertoric work, or a removal that really does feel like silencing? Does it predict anything its rivals don't? And does it collapse into one of them — into the public-art view, or into a thin speech-act account with extra steps? Tell me which of these a defender of my position would themselves concede as counting against it and which they'd wave off, and be honest about whether I've quietly insulated the thing with qualifications until it can't be wrong — and if so, whether that's a real problem for a view of this kind.

  American English, please. Rank the defeaters from fatal to merely awkward, and make the very last line exactly \answer{LABEL} where LABEL is one of FATAL, SERIOUS, AWKWARD, INSULATED-OK, INSULATED-BAD.
