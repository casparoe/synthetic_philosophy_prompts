      *   Author wants to weaken Step 1 over Step 2.
      *   Reason: Step 2 (Foresight) makes the philosopher sympathetic (she defends the idea that you can't blame people for the unforeseeable). Step 1 (Difference-Making) makes her cold (mechanistic causation).
      *   *My Assessment:* Is the author right?
          *   If we weaken Step 2, we say: "You *are* responsible for things you couldn't foresee." This makes the philosopher look like she's demanding impossible standards of humans, or it forces us to accept strict liability without fault. Actually, wait. The philosopher is *arguing* for the premises. If she *abandons* Step 2, she admits people *are* responsible for unforeseeable things. That undermines her defense of the individuals.
          *   If she *abandons* Step 1, she admits people are responsible even if they didn't "make the difference" (e.g., complicity, role responsibility, collective responsibility).
