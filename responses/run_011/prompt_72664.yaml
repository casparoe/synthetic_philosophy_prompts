      *   *Let's look at Step 6.* "A harm for which no one is responsible is a harm no one can be required to answer for." This conflates *Blame* with *Liability*. You can be liable to pay compensation without being morally to blame (e.g., no-fault insurance, corporate liability).
      *   *Which is the "Single Step"?* Step 6 is the bridge to the nihilistic Conclusion 8. If Step 6 breaks, Step 5 (No individual is responsible) can stand, but Step 8 (No one answers/repairs) falls. The *Corporation* or the *State* answers. The inquiry is not theatre; it's about *structural repair*, not *individual punishment*.
      *   *Why Step 6?* It preserves the philosopher's sympathy (she protects the individuals from blame, Step 5) but denies her nihilism (society still owes a debt, Step 8 fails). It transforms the inquiry from a witch hunt into a truth and reconciliation process.
      *   *Why not Step 1?* If you break Step 1, you start blaming individuals for things they didn't causally determine. That makes the philosopher look unjust/cruel to the engineers. The author wants her sympathetic.
      *   *Why not Step 2?* Author wants to keep this.
