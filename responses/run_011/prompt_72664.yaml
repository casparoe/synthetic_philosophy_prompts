      *   **The Problem:** Her argument (Steps 1-8) is *too* good. It concludes that *no one* is responsible for *any* harm produced by modern technical systems (Step 8). This destroys the world of the novel (and reality) too thoroughly. The author needs to break the argument before Step 8.
      *   **Constraints:**
          *   Provide a *verdict*, not a menu.
          *   Identify *one single step* to strike/modify.
