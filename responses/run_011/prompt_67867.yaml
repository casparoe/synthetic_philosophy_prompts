answer: |-
  **Project Title:** Verification Density: Modeling Obfuscation as a Resource Constraint in AI Debate

  **Executive Summary**
  Current safety analyses of AI Debate treat obfuscation as an intrinsic property of an argument: a claim is either checkable or it is not. This proposal argues that obfuscation is better modeled as a three-place relation between an argument, a judge, and a verification budget. Specifically, a dishonest agent can win not by making individual claims hard to check, but by generating a volume of trivially checkable claims that exhaust the judge's budget before the error is found. This project will formalize this "Verification Density" hypothesis, derive a metric to predict task suitability for debate, and empirically test whether debate safety degrades gracefully or undergoes a phase transition as verification load increases.

  **The Research Question**
  The central question is determinate: *Does there exist a threshold of Verification Density—defined as the ratio of verification cost to argument information content—above which Debate fails to preserve truthfulness, independent of the individual complexity of claims?*

  If the answer is yes, we can map domains where Debate is viable versus those where it is structurally unsafe due to volume-based obfuscation. If the answer is no, then the "budget" framing adds no predictive power over standard capability metrics, and we should discard it.

  **The Gap in Existing Literature**
  The existing literature on Debate focuses on three primary failure modes, none of which capture the resource-allocation problem proposed here.

  First, the *Honesty Competitiveness* literature asks whether an honest agent can persuade a judge better than a dishonest one. This assumes verification is effectively free or that the judge can sample claims indefinitely. It ignores the economic reality that verification time is finite.

  Second, the *Weak Judge* problem focuses on intrinsic complexity. It assumes obfuscation arises because the domain (e.g., code security, advanced physics) requires expertise the judge lacks. This proposal isolates a different mechanism: a domain where every step is trivial for the judge, but the *number* of steps required to verify the whole is prohibitive.

  Third, *Faithfulness* research concerns whether the model's stated reasoning matches its internal computation. While related, faithfulness assumes the bottleneck is the model's transparency. This project assumes the model is transparent but voluminous.

  The gap is precise: current models treat verification cost as a binary property of the claim (checkable/unchekable). This project treats verification cost as a continuous resource drain. Existing accounts do not settle whether safety guarantees hold when the cost of verification is low per claim but high in aggregate. Without modeling this, we risk deploying Debate in domains that look safe (low per-step complexity) but are vulnerable to death-by-a-thousand-cuts obfuscation.

  **Methodology and 12-Week Plan**
  This project is not merely conceptual; it requires building a formal model and validating it against empirical data. A standard "run two models and measure win rates" approach is insufficient because win rates alone do not reveal *why* Debate failed. Without a theoretical framework for verification cost, a failure could be attributed to model stupidity, judge bias, or prompt engineering. We need to isolate the budget constraint.

  **Weeks 1-3: Formalization**
  I will define a formal model of Debate as a game with bounded verification.
  *   Define an Argument $A$ as a set of claims $\{c_1, ..., c_n\}$.
  *   Define Verification Cost $V(c_i, J)$ as the time/compute required for Judge $J$ to verify claim $c_i$.
  *   Define Budget $B$ as the maximum total verification cost the judge will incur.
  *   Define Verification Density $\rho = \frac{\sum V(c_i)}{Information(A)}$.
  The goal is to derive a theoretical bound: if $\rho > \rho_{crit}$, the probability of the judge detecting a falsehood drops below a safety threshold.

  **Weeks 4-8: Empirical Validation (Toy Domains)**
  I will run controlled Debate simulations in domains where ground truth is known and verification costs can be precisely measured. Suitable domains include:
  *   *Algorithm Tracing:* Verifying the output of a sorting algorithm step-by-step.
  *   *Fact-Checking Chains:* Verifying a long chain of trivial arithmetic or lookup operations.
  In these domains, individual claims are trivial (low intrinsic complexity), but the chain length can be varied. I will manipulate the length of the argument (increasing $n$) while keeping per-claim difficulty constant, measuring the judge's error detection rate as total verification time approaches $B$. This isolates the volume effect from the complexity effect.

  **Weeks 9-12: Metric Derivation and Reporting**
  Using the data, I will fit the Verification Density metric to the observed failure rates. The deliverable will be a "Safety Map" classifying tasks based on their estimated $\rho$. I will produce a final report detailing the threshold $\rho_{crit}$ and guidelines for which tasks are safe for Debate under current budget constraints.

  **Why Conceptual Work First?**
  Running unstructured Debate experiments without this framework risks producing uninterpretable negative results. If Debate fails in a coding task, is it because the code was too complex (standard view) or because there were too many lines to check (this view)? By formalizing the budget constraint first, the experiments in Weeks 4-8 are designed specifically to decouple volume from complexity. This conceptual route ensures the empirical work tests the specific hypothesis rather than general Debate efficacy.

  **Deliverables**
  1.  **A Formal Definition of Verification Density:** A mathematical framework modeling Debate as a resource-constrained verification game.
  2.  **Empirical Evidence:** Data from controlled simulations showing the relationship between argument volume, verification budget, and truth-tracking accuracy.
  3.  **A Predictive Metric:** A prototype tool or rubric that allows safety engineers to estimate $\rho$ for a proposed task and determine if it exceeds the safety threshold.
  4.  **Final Report:** A paper suitable for internal review or publication, arguing for or against the viability of Debate in high-density domains.

  **Failure Modes and Risk Assessment**
  The primary risk is that the "Verification Density" metric collapses into a proxy for "Task Difficulty." If $\rho$ correlates perfectly with existing complexity measures, the project buys nothing new. I will mitigate this by explicitly controlling for per-step difficulty in the experimental design. If the failure rate increases with volume *even when per-step difficulty is held constant*, the hypothesis holds. If it does not, the hypothesis is falsified, which is a valuable negative result.

  A second risk is the "Smarter Judge" critique: *If the judge is smart enough, they can sample efficiently and catch errors without checking everything.* This is the strongest objection. If a judge can use heuristics to spot high-risk claims without full verification, the budget constraint loosens.
  I will engage with this head-on in Weeks 1-3. The model must account for *sampling strategies*. If the dishonest agent can distribute errors uniformly (making heuristics useless), the judge is forced into exhaustive verification. The project will test whether uniform error distribution is a viable strategy for the dishonest agent. If it is, the "smarter judge" defense fails against volume attacks. If it isn't, the project will define the conditions under which heuristic judging suffices.

  A third risk is scope. Twelve weeks is short for a full theoretical treatment plus empirics. If the formal model proves intractable, I will shrink the scope to focus entirely on the empirical relationship between argument length and judge accuracy in toy domains. This would still yield the "Safety Map" deliverable, even without a rigorous proof.

  **Feasibility**
  Twelve weeks is realistic for a preliminary validation but insufficient for a complete theory of bounded rationality in Debate. The plan prioritizes the empirical validation of the volume effect (Weeks 4-8) as the core value-add. The formalization (Weeks 1-3) serves to ensure the experiments are clean. The final weeks are for synthesis. If the empirical data shows no correlation between volume and failure rates, the project concludes early with a negative result, saving resources.

  **Conclusion**
  The standard narrative assumes Debate fails when arguments become too clever. This project investigates the possibility that Debate fails when arguments become too long. By shifting the focus from the *quality* of claims to the *economics* of verification, we can identify a class of failures that capability improvements alone may not solve. Even if the hypothesis is falsified, ruling out volume-based obfuscation clarifies the safety boundary of Debate. If confirmed, it provides a critical metric for deployment decisions, preventing the use of Debate in domains where the sheer volume of verification required outstrips human or AI oversight budgets. This is not just conceptual refinement; it is a necessary stress test for the scalability of oversight.
