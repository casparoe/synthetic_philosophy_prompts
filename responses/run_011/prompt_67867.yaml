          *   No citations/bibliography needed.

  2.  **Deconstruct the Core Insight:**
      *   *Current View:* Obfuscation = hard to understand claims (cryptic, technical).
      *   *Proposed View:* Obfuscation = Cost to Verify > Budget.
      *   *Mechanism:* Death by a thousand cuts. Many easy-to-check claims sum to a verification cost that exceeds the judge's capacity.
      *   *Implication:* Debate safety isn't binary; it depends on the "verification density" of the domain.
      *   *Metric:* Need a name. "Verification Load"? "Claim Density"? Let's go with "Verification Density."

  3.  **Identify the Gap:**
      *   Existing work focuses on:
          *   Can the honest agent win? (Assumes infinite or undefined checking cost).
          *   Are judges too weak to understand the domain? (Assumes intrinsic difficulty).
          *   Is the reasoning faithful? (Assumes the issue is deception, not volume).
      *   *The Gap:* None of these explicitly model the *economics* of verification. They treat "checking" as a binary capability (can/cannot) rather than a continuous resource (time/compute/cognitive load). This proposal treats verification as a budget-constrained optimization problem.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and descriptive. "The Economics of Obfuscation" or "Verification Density." Let's try: *Verification Density: Modeling Obfuscation as a Resource Constraint in AI Debate.*
      *   **Executive Summary/Abstract:** Briefly state the problem and the proposed metric.
      *   **The Research Question:** Needs to be determinate. "Does verification cost scale linearly or superlinearly with argument length in high-stakes domains, and does this create a phase transition for debate safety?"
      *   **The Gap:** Contrast with standard "weak judge" narratives. The standard narrative says "Judge is too dumb." This narrative says "Judge is tired/out of time."
      *   **Methodology (12 Weeks):**
          *   Weeks 1-3: Formalizing the model (Argument = set of claims, Cost = function).
          *   Weeks 4-8: Empirical validation (small-scale debate sims, measuring check times).
          *   Weeks 9-12: Deriving the metric and writing up.
          *   *Why not just run debate?* Because without the theoretical framework, win rates are uninterpretable. We need to know *why* it failed.
      *   **Deliverables:** A formal definition of Verification Density, a taxonomy of tasks (safe vs. unsafe based on density), and a prototype metric.
      *   **Failure Modes:** Address the "just get a smarter judge" critique. If the metric shows density is high *even for smart judges* (due to time limits), the critique fails. If the metric correlates perfectly with judge capability, then the project collapses into "get smarter judges." I need to argue that *time* is the hard constraint, not just intelligence.
      *   **Feasibility:** 12 weeks is tight for heavy empirics. Focus on toy models and limited sims.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this just "complexity"?
