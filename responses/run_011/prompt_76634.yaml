answer: |-
  Sarah waits in the drafty village hall of Little Wolding. The parish council by-election electorate is 240. She knows the race is deadlocked; the clerk mentioned her street's turnout will decide it, confirmed by canvass returns in the local paper. Her subjective probability of being pivotal ($P$) is 0.1. Voting costs (£15) cover bus fare and lost wages. Candidate A offers fiscal prudence, saving the parish £5,000 annually, but cuts the May Fair subsidy. Candidate B keeps the Fair, costing the parish extra, but offers no other benefit. Sarah gains £50 personally from A's tax cut. She feels no civic duty; to her, politics is grubby, and she rejects any obligation term. However, she values the Fair's tradition at £25 in expressive utility. She knows A is better for the town, but loves the Fair. The gap in competence is genuine, not trivial, yet B's support signals community loyalty. She is an ordinary worker, relying on ordinary intel, with no superintelligence or exotic physics to aid her calculation.

  The Downsian calculus weighs private benefit against cost. Sarah's expected private return is $P \times B_{self}$, or $0.1 \times £50 = £5$. Subtracting the cost of voting (£15) yields a net loss of £10. Rational self-interest dictates she abstains. The social-regarding calculus expands the benefit term to the collective good. Here, the expected return is $P \times B_{social}$, or $0.1 \times £5,000 = £500$. Subtracting the £15 cost leaves a substantial net benefit of £485. Rationality demands she votes for Candidate A, the fiscally prudent option. The expressive account treats voting as consumption, not investment. Pivotality is largely irrelevant; the utility comes from the act itself. Her expressive benefit from supporting the Fair is £25. Subtracting the £15 cost yields a net gain of £10. Rationality dictates she votes for Candidate B, despite the town-wide loss.

  The load-bearing feature is the non-negligible pivotality probability ($P=0.1$). This knowledge breaks the standard analogy between voting and cheering, forcing the social calculus to recommend voting while the Downsian still recommends abstention. If we scale this to a national general election, $P$ collapses to near zero. The social benefit term ($P \times B_{social}$) vanishes, recommending abstention. The Downsian term also remains negative. Only the expressive account remains unchanged, still recommending voting for Candidate B. The triple divergence collapses; two accounts now converge on abstention.

  The strongest attack comes from the expressive theorist. They argue that knowing one's vote is pivotal does not contaminate expressive utility. One can still consume the act of expression even when it carries instrumental weight. The case falsely assumes that high stakes transform consumption into investment, but a fan cheering at a decisive match still cheers for love of the team, not solely to influence the score. The ballot remains the cheapest outlet for that expression, regardless of consequence.

  Ultimately, the paradox of voting is not about rationality, but about benefit. It persists because we disagree on whether benefits are private, social, or expressive. When we define benefit narrowly, voting is irrational; when we broaden it, the paradox dissolves.
