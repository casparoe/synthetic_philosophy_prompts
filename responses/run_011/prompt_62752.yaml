answer: |-
  **Incident Postmortem: Sev-1 Consensa Rank Aggregation Instability**

  **Summary**
  On 14 October, Consensa Rank experienced degraded service stability affecting three enterprise clients. The incident stems from conflicting acceptance criteria in PRD-114, which defined the aggregation logic. The criteria required:
  1. The service must accept any profile a client sends.
  2. No single account may be able to determine the aggregate outcome on its own.
  3. If every user ranks X above Y the aggregate must rank X above Y.
  4. The aggregate's relative placement of X and Y must depend only on how users place X and Y relative to each other, and on nothing else in the payload.

  **Impact**
  Four hours of elevated latency and inconsistent ordering results. Three clients (CondoManage, StandardsBody, Munipal) reported cyclic outcomes where removing a losing option changed the winner. SLA credits issued.

  **Timeline**
  *   **09:12:** Support engineer opens RANK-4417. Condo board reports landscaping bid rankings cycle depending on ballot composition. Triage assumes a tie-breaking defect.
  *   **10:45:** Patch deployed: configuration flag to disregard options clients mark irrelevant. Reverted after StandardsBody reported outcome shifts when irrelevant vendors withdrew.
  *   **13:30:** Patch deployed: point-allocation mode for StandardsBody. Withdrawn within a week after a vendor nominated three near-identical proposals to skew scores.
  *   **15:00:** Patch deployed: score-based mode. Staff engineer notes in Slack: "We are asking the system to satisfy four business requirements that cannot be true at the same time when there are three or more options." Rollback initiated.
  *   **15:15:** Junior engineer suggests limiting output to the top winner to reduce complexity. Senior engineer corrects: "Billing is per ordering. Also, winner-only invites strategic voting."
  *   **16:00:** Intern proposes randomization for ties. Legal kills proposal on marketing grounds.
  *   **17:45:** Security reviewer discovers undocumented enterprise-tier parameter resolving incidents by assigning one account final authority. Legal requests parameter be renamed to "Administrative Override."
  *   **18:30:** Intern implements domain restriction for CondoManage. Options are ordered by bid price; preferences are single-peaked around budget ideals. Aggregation stabilizes.
  *   **19:00:** New domain-validation middleware rejects 80% of production traffic. Customer Success requests preference-normalization feature to reshape arbitrary profiles into well-behaved ones. Ticket queued for Q3.
  *   **20:00:** Client escalation asks Consensa to recommend which acceptance criterion should be dropped. Account team distributes decision matrix asking stakeholders to rank the four criteria.

  **Root Cause Analysis**
  The incident was not caused by a code defect but by incompatible product requirements. Each patch addressed a specific failure mode but violated another PRD-114 criterion. The score-based mode changed input types from orderings to numbers, violating the specification. The domain restriction violated the requirement to accept any profile. The administrative override violated the non-dictatorship requirement. The team attempted to engineer a solution to a structural constraint without adjusting the specification.

  **Action Items**
  1.  Refine PRD-114 acceptance criteria to reflect production constraints.
  2.  Deprecate "Administrative Override" parameter or document explicitly.
  3.  Develop preference-normalization middleware.
  4.  Prioritize backlog using Consensa Rank.

  When prioritizing the action items using Consensa Rank, the output indicated Item 1 is preferred to Item 2, Item 2 is preferred to Item 3, and Item 3 is preferred to Item 1.

  **References**
  *   [Internal Wiki] Social Choice Constraints (Link Rot)

  ***

  **Author's Note**

  I compressed the timeline significantly; in reality, these patches spanned months, not hours. I am highly confident in the technical accuracy of the failures: Borda counts (points) violate Independence of Irrelevant Alternatives, and single-peakedness restricts the domain, violating Unrestricted Domain. The "Decision Matrix" beat is dramatized; while stakeholders can rank criteria, aggregating those rankings faces the same structural issues as the product itself, which is the intended irony. I am least sure about the Legal team's objection to randomization; while plausible for branding, it feels slightly convenient. However, the core mathematical beats are rigid: every engineering fix failed for the correct theoretical reason. I did not bend the math to make the joke land; the joke is that the roadmap cannot fix a proof. The only correction I would offer is that the "Administrative Override" is technically a Dictator function, but labeling it as such in a postmortem would violate the blameless culture constraint.
