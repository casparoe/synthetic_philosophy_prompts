answer: |-
  **TO:** Grantmaking Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Decision on Emerging Risks Sleeve & Scoring Methodology

  **Bottom Line**
  1.  **Grant Decision:** We should fund **Proposal B** (Net Distribution) for this cycle, but explicitly classify this as a *risk-management decision based on model uncertainty*, not a rejection of Expected Value (EV) maximization.
  2.  **Policy Decision:** We should retain **Expected Value** as our standing scoring rule. Adopting Risk-Weighted Expected Utility (REU) as a formal policy is operationally incompatible with our process and misaligned with the "Emerging Risks" mandate.
  3.  **Process Change:** For high-variance proposals (like A), we must demand third-party auditing of tail probabilities before funding. The current 1% estimate is the decision driver, and it is currently unverified.

  **1. Why Proposal B, This Cycle?**
  Proposal A's Expected Value (3,100 lives) relies almost entirely on a 1% probability of saving 300,000 lives. If that probability is actually 0.1%, Proposal A's EV drops below Proposal B's.

  We are not rejecting Proposal A because "high variance is bad." We are rejecting it because **the model generating that variance is fragile.** In pathogen modeling, low-probability high-impact tails are notoriously difficult to estimate. Without an external audit confirming that 1% figure is robust (and not an artifact of optimistic modeling), we cannot treat that EV as real. Proposal B offers verified impact. Funding B is the prudent choice given the *data quality*, not the *decision rule*.

  **2. Why Expected Value (EV) Remains the Rule**
  Trustee X has correctly identified that REU (Buchak's framework) is a coherent alternative to standard decision theory. However, adopting it as our standing policy presents three critical failures:

  *   **The Separability Problem:** Trustee Y is correct that REU is not separable across decisions. REU evaluates the risk profile of the *entire portfolio* of grants, not individual line items. To apply REU correctly, we would need to score every grant simultaneously against every other grant to calculate the cumulative distribution of our total annual impact. Our process scores grants individually. Applying a non-separable rule to separable decisions creates mathematical incoherence and double-counts risk aversion.
  *   **The Mission Drift:** Our charter mandates "expected benefit per dollar." In financial and philanthropic contexts, "expected" refers to the probability-weighted mean (EV). Adopting a risk function like $\rho(p) = p^2$ effectively vetoes any grant where the majority of value comes from low-probability outcomes. This renders the "Emerging Risks" sleeve functionally identical to the "boring global health" budget. If we cannot tolerate variance, we should not have an emerging risks sleeve.
  *   **The Portfolio View:** The Foundation is a perpetual entity making ~120 grants a year. While individual beneficiaries face a "single shot," the Foundation faces a repeated game. In a repeated game with independent bets, variance washes out. Maximizing EV on each bet maximizes the total impact of the endowment over time. Risk aversion is appropriate for an actor who can be "knocked out of the game" (ruin). Our endowment structure protects us from ruin; our beneficiaries do not have that luxury, which is precisely why we must maximize the aggregate number of lives saved, even if it requires backing risky interventions.

  **3. The Strongest Counter-Argument: The Beneficiary's Burden**
  The most serious objection to EV maximization is not mathematical; it is moral. Trustee X argues that beneficiaries cannot average their outcomes over our repeated trials. If we fund Proposal A and the 99% scenario obtains, the specific individuals who would have been saved by Proposal B are left to die. They do not benefit from our "portfolio theory." They bear the full cost of our risk-taking.

  This is a valid moral claim. It suggests that when the variance involves human life (rather than dollars), the Foundation has a duty of care that transcends aggregate statistics. If we treat lives as fungible units in a math problem, we risk violating the trust of the communities we serve, who reasonably expect us to secure *certain* help over *possible* help.

  **Rebuttal:** While morally weighty, this argument implies we should never invest in prevention or innovation, only in proven cures. Preventing a pandemic (Proposal A) is inherently uncertain. If we require certainty, we abandon the one area where philanthropy can outperform governments and markets: funding high-upside, high-risk public goods. We accept this moral tension as the cost of the "Emerging Risks" mandate. We mitigate it not by changing the math, but by raising the bar for evidence on the tail risks (see below).

  **4. Required Data for Future Cycles**
  The conflict this cycle arose because Proposal A's numbers were taken at face value. For any future proposal where >50% of the EV comes from outcomes with <5% probability, we must demand:
  *   **Red-Teaming:** An independent modeler must attempt to debunk the tail probability.
  *   **Mechanism Verification:** Not just "what if," but "how." The causal chain leading to the 300,000 lives saved must be stress-tested.
  *   **Comparative Baselines:** Why is this network better than existing surveillance?

  **Recommendation**
  Vote to fund **Proposal B**. Simultaneously, vote to codify **Expected Value** as the committee standard, with the added requirement that high-variance EV calculations must pass a model-robustness check. This allows us to act prudently today without disarming ourselves for the high-impact opportunities we were designed to find.
