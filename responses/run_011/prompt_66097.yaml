answer: |-
  This is a classic confrontation. You have encountered the **Rietdijk–Putnam argument**, often dramatized as the **Andromeda Paradox** (popularized by Penrose). Your roommate is channeling a hard-line Eternalist/Block Universe interpretation of Special Relativity (SR).

  The argument is valid *if* you accept its metaphysical premises. But physics does not force those premises on you. Your roommate is conflating the *geometry of spacetime* with the *ontology of existence*.

  Here is the breakdown of the arithmetic, the "possible observer" issue, and then the main philosophical exits with their price tags.

  ---

  ### Part 1: The Technical Check (Your "Smaller Stuff")

  **1. Is the arithmetic in (5) right?**
  Yes. The formula for the simultaneity shift (the "tilt" of the now-slice) in Special Relativity is $\Delta t = vL/c^2$.
  *   $v = 0.1c$
  *   $L = 30 \text{ light-years}$
  *   $c = 1 \text{ light-year/year}$ (in natural units)
  *   $\Delta t = 0.1 \times 30 = 3 \text{ years}$.

  Your roommate is correct. For an inbound probe, your future is on their "now" plane.
  **Does the sign flip for outbound?** Yes. If the probe is moving away ($v$ becomes negative), the tilt goes the other way. That same event (your exam) would be 3 years in the *past* for the outbound probe. This symmetry is crucial for the argument, and the math holds up.

  **2. Does (9) require a real observer?**
  This is a subtle point where your intuition is sharper than your roommate's.
  *   **Physics:** In SR, a "frame of reference" is a mathematical coordinate system, not a physical person with a watch. You do not need a physical probe to exist at 30 light-years for the coordinate geometry to be valid. The *frame* exists as a valid solution to the Lorentz transformations.
  *   **Metaphysics:** Your roommate argues that because the *frame* is physically possible, the events on its simultaneity plane must be *ontologically real*.
  *   **The Pushback:** This is where you can dig in. Why should *mathematical possibility* dictate *ontological actuality*? Just because I *can* draw a coordinate grid that slices through your future doesn't mean your future *exists* in the same way your present does. Relying on "merely possible" frames to populate reality feels like magic. However, most physicists will say the frame is as real as the geometry allows. The stronger philosophical fight is elsewhere.

  ---

  ### Part 2: The Main Break (Where to Reject the Argument)

  You asked which step to reject and what it costs. There are three main exits. Your roommate has prepared defenses for some, but not all.

  #### Exit A: Reject Premise (1) — "Simultaneity is Ontology"
  **The Move:** You deny that "what exists now" is defined by "what is simultaneous in an inertial frame."
  **The Argument:** Special Relativity gives us **light cones** (causal structure), which are invariant (everyone agrees on them). It does *not* give us privileged "now-slices." Simultaneity is a convention (Einstein synchronization). Why should a convention dictate what exists?
  **The Cost:** You must give up **Naive Presentism**. You cannot hold that "only the present exists" in a universal way. You likely have to adopt one of two views:
  1.  **Eternalism (Block Universe):** Past, present, and future all exist equally. (This accepts the conclusion of RP but blocks the fatalism, see Exit B).
  2.  **Causal Presentism (Howard Stein):** Only events in your *past light cone* exist. The future is genuinely open because it is causally disconnected.
  **Why this works:** It attacks the bridge between physics (SR) and metaphysics (Existence). SR describes causal connectability, not ontological slices.
  **Roommate's Counter:** He will say this is "anti-realist" about spacetime.
  **Your Rebuttal:** It's pro-realist about *invariants*. Simultaneity is frame-dependent; existence shouldn't be. Therefore, existence cannot be defined by simultaneity.

  #### Exit B: Reject Premise (7) — "Real implies Fixed" (The Fatalism Block)
  **The Move:** You accept the Block Universe (Eternalism). You agree that your exam *is* real, in the same way Paris is real even when you are in New York. But you deny that this entails **Fatalism**.
  **The Argument:** Fatalism says: "It will happen *no matter what I do*." Eternalism says: "It will happen *because* of what you do."
  In the Block Universe, your deliberation, your studying, and your walking into the hall are all part of the 4D geometry. The event is real, but *you* are the mechanism that makes it real. Your agency is not erased; it is *embedded* in the block.
  **The Cost:** You must give up the idea that the future is "ontologically open" in the sense of not existing yet. You have to accept that the future is just as "there" as the past.
  **Why this works:** It distinguishes **Determinism** (causal necessity) from **Fatalism** (causal irrelevance). SR might imply a Block Universe, but it does not imply that your actions are causally irrelevant.
  **Roommate's Counter:** He will say, "If it's already there, you can't change it."
  **Your Rebuttal:** "I'm not trying to *change* it (that's incoherent in any view); I'm trying to *cause* it. My walking into the hall is the reason that event exists at that coordinate. Without my action, that part of the block is empty."

  #### Exit C: Reject Premise (3) — "Reality is Absolute" (Relativized Existence)
  **The Move:** You accept that existence is frame-relative. "Real for me" and "Real for the probe" are different, and there is no "God's eye view" to reconcile them.
  **The Argument:** Your roommate says this leads to contradiction ("Event E exists and does not exist"). You reply: **Existence is indexical**, like "here" or "now."
  *   "It is raining here" (London) and "It is not raining here" (Sydney) are not contradictory.
  *   "Event E is present for me" and "Event E is future for the probe" are not contradictory.
  **The Cost:** This is the most metaphysically expensive option. You have to defend a view where "what exists" is not a single, coherent inventory of the universe. It feels like it violates the Law of Non-Contradiction, though proponents argue it's just relational ontology.
  **Why this works:** It preserves the intuition that the future isn't "fixed" for you, even if it is "present" for the probe.
  **Roommate's Counter:** He already gave it: "Contradictory inventories."
  **Your Rebuttal:** "It's not a contradiction, it's relativity. Just as 'moving' is relative to a frame, 'present' is relative to a worldline. There is no absolute 'exists' any more than there is an absolute 'moves'."
  *(Note: Many philosophers find this too costly. It makes reality fragmented.)*

  ---

  ### The Verdict: Which Exit Should You Take?

  **I recommend Exit A combined with Exit B.**

  1.  **Reject (1):** Do not let your roommate define "real" as "simultaneous in an inertial frame." That is a metaphysical assumption, not a physical fact. The physical fact is the **light cone**. Events outside your light cone are causally disconnected from you. Basing reality on simultaneity slices is privileging a coordinate convention.
  2.  **Accept Eternalism, Reject Fatalism:** Even if you concede the Block Universe (which is the standard philosophical interpretation of SR), you must reject the inference to Fatalism (Step 7).
      *   **The Price:** You lose the "flow" of time as a fundamental feature of the universe. Time becomes a dimension like space.
      *   **The Gain:** You save agency. In the Block Universe, your choices are the *struts* that hold the building up. If you choose differently, the block is different (or rather, the block contains the version of you that chose differently).

  **How to talk to your roommate:**
  Tell him he is committing a **category mistake**. He is moving from *geometric relations* (coordinates in a manifold) to *modal status* (necessity vs. possibility).
  *   **Say this:** "Special Relativity describes the causal structure of spacetime. It tells us which events *can* influence which other events. It does not tell us which events are *fixed*. Even if my exam is on the probe's simultaneity slice, it is not in my *past light cone*. It is not causally fixed for me. You are confusing 'ontologically real in a 4D manifold' with 'causally inevitable regardless of my input.' My input is part of the manifold."

  **Summary of the Price:**
  To escape fatalism, you must pay with **Presentism**. You cannot have both Special Relativity and a universal, objective "Now" that sweeps across the universe. You have to choose:
  1.  **Keep Presentism:** Reject SR's implication that all frames are equal (posits a preferred frame, bad physics).
  2.  **Keep SR:** Accept the Block Universe, but deny that the Block Universe kills agency (bad for intuition, good for logic).

  Your roommate is betting you value Presentism more than logic. Don't take the bet. Value Agency more than Presentism. Accept the Block, keep your agency.
