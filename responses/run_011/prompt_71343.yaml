answer: |-
  Dear Colleague,

  It is no surprise that you found yourself unable to referee the exchange between Marisol and Devon, as they were arguing past one another from different categories of validity, one grounded in procedural reality and the other in moral aspiration. In the first exchange, Marisol is clearly right that the neighbors bear the localized costs of density while the benefits are distributed broadly, which is a standard definition of a negative externality, but Devon is also clearly right that the beneficiaries are systematically excluded from the process simply because they do not yet exist. Moving to the second exchange, Devon is clearly right that the inability to cross-examine a hypothetical resident is a procedural hurdle rather than a principled reason for exclusion, whereas Marisol is mostly mistaken to conflate the difficulty of representation with the impossibility of it, though she correctly identifies the risk of developer capture. In the third exchange, Marisol is clearly right that zoning creates investment-backed expectations that constitute a real reliance interest, while Devon is mostly mistaken to dismiss these harms as claims on public goods, since the regulatory compact between city and resident is not merely abstract. The fourth exchange is more difficult to score, as Devon is clearly right in principle that compensation would be the efficient remedy for broken reliance, but Marisol is clearly right in practice that the hearing is the only available forum because the compensation mechanism Devon proposes does not exist. By the fifth exchange, both are partially right but talking past one another, since Marisol correctly identifies that unlimited access undermines local stability while Devon correctly identifies that stability often relies on exclusionary pricing. Overall, Marisol comes out ahead by a narrow margin, not because her moral position is superior, but because she accurately describes the institutional constraints and legal realities within which your committee actually operates, whereas Devon is arguing for a system you do not have.

  Your distinction between within-boundary and boundary-shifting objections is a useful diagnostic tool, but it ultimately begs the question because the entire dispute is about where the boundary should be drawn. If you accept Marisol's premise that the community consists only of current property owners, then her objection is within-boundary and legitimate, but if you accept Devon's premise that the community includes those who need housing, then his objection is within-boundary and hers is exclusionary. The distinction holds descriptively in that it accurately categorizes the type of claim each is making, with Marisol defending the existing perimeter of membership and Devon seeking to expand it, but it collapses normatively because it cannot tell you which boundary definition is correct without already assuming the answer to the conflict. It is helpful for mapping the terrain of the argument, but it cannot resolve the dispute because the dispute is precisely about whether the boundary is fixed or porous.

  The consideration that neither of them noticed, and which would have most likely changed the shape of the dispute, is the city's regional housing mandate. If someone had pointed out that the city is under a state or regional obligation to zone for a specific density target that this project helps meet, the debate would shift from whether the neighbors have a right to exclude to whether the city has a duty to comply with higher-order law. This would render Marisol's reliance argument legally subordinate, since reliance on outdated zoning cannot override state housing law, and it would validate Devon's standing argument without needing to philosophically justify the right to the city. Introducing this constraint would have moved the conversation from a philosophical struggle over membership to a technical discussion about how to meet compliance requirements while mitigating local impacts, which is a problem your committee is actually equipped to solve.
