answer: |-
  A city zoning board must approve one of two plans for a vacant lot: Plan A (community garden) or Plan B (low-income housing). Both advance public welfare equally; neither outweighs the other, yet they aren't interchangeable equivalents. Adding a toolshed to Plan A doesn't make it superior to Plan B's housing units; the values remain distinct and balanced. However, the city charter contains a tie-breaking clause: "If merit is equal, the earlier submission prevails." Plan B was filed fifteen minutes before Plan A. The board has a decisive, external reason to select B—the rule binds them—yet this procedural fact doesn't render housing *better* than gardening. The options remain on a par regarding public good; the rule simply resolves the stalemate without altering the underlying value comparison.

  **Checklist**
  1.  **Parity:** Satisfied by "neither outweighs... aren't interchangeable equivalents."
  2.  **Small-Improvement Test:** Satisfied by "Adding a toolshed to Plan A doesn't make it superior."
  3.  **External Reason:** Satisfied by "city charter contains a tie-breaking clause... Plan B was filed fifteen minutes before."
  4.  **Mundane Constraint:** Satisfied by "city zoning board" and "city charter."

  **The Cheating Test**
  Is the filing time smuggled into the option description? Explicitly: No, but it is vulnerable. Option B is described as "low-income housing," not "housing filed at 9 AM." The filing time is a historical fact external to the plan's merit. However, a critic could argue that "choosable options" must include all decision-relevant properties. If "eligible under charter" is a property of B, then B is simply better. I concede this risk. What remains is the distinction between *evaluative merit* (public good) and *procedural eligibility*. The case holds only if we accept that a rule can mandate choice without conferring value.

  **Chang vs. Broome**
  Chang argues parity exists only when normative reasons run out. Here, reasons don't run out (the rule decides), so she would deny this is a case of parity at all. Broome argues "better" is vague; he would say the rule makes B "better all-things-considered," dissolving the parity. Broome does more damage because he collapses the distinction between "procedurally mandated" and "better," whereas Chang at least acknowledges the distinctness of the values before denying the parity classification.

  **Deletion Test**
  If I delete the charter rule, the case collapses into the lawyer-vs-artist cliché. Without the external tie-breaker, the board faces a genuine hard choice where reasons run out, requiring an act of will to create a reason. The external rule transforms it from a *hard choice* into a *determined decision* involving parity-valued options.

  Verdict: survives_chang = no; load_bearing_feature = external procedural tie-breaker rule
