answer: |-
  **How to use this**

  Hand this out at the start. Answer based on gut reaction to the scenarios, not what you think your "camp" should say. There are no right answers, only consistent ones. If you skip a question because a previous answer made it irrelevant, follow the arrow. The goal isn't to win a debate but to see who is actually arguing about the same thing. Don't worry about technical terms; they only appear at the end. If you find yourself wanting to say "it depends," pick the option that holds in most cases. Once everyone has reached a leaf, compare positions before discussing the physics. This prevents the embarrassment of realizing you agreed on metaphysics but fought over semantics.

  **The questions**

  1.  **The Empty Interaction:** Imagine a law governing a specific particle interaction that *never* occurs in the history of the universe. Is that law still true?
      *   **Yes:** Laws exist independently of actual events. (Rules in Armstrong, Maudlin, Powers).
      *   **No:** Laws are summaries of what actually happens. (Rules in Lewis, Van Fraassen).
      *   *Note: If No, you likely deny laws govern events.*

  2.  **The Twin Universe:** Consider two universes with exactly the same total history of events from beginning to end. Could they have different laws of nature?
      *   **Yes:** Laws are extra ingredients not fixed by events. (Rules in Armstrong, Maudlin, Powers).
      *   **No:** Events fix the laws; same history means same laws. (Rules in Lewis, Van Fraassen, Cartwright).
      *   *Note: If you answered Yes to Q1, you likely answer Yes here.*

  3.  **The Messy Exception:** A fundamental rule holds everywhere except inside black holes or during quantum measurements. Is it still a fundamental law?
      *   **Yes:** Laws describe capacities that can be interfered with. (Rules in Cartwright).
      *   **No:** Fundamental laws must be strict and universal. (Rules in Armstrong, Maudlin, Lewis, Powers).
      *   *Note: This isolates the view that fundamental physics is literally false of the messy world.*

  4.  **The Alien Scientist:** Imagine beings with completely different cognitive architectures studying our universe. Could they disagree about what the laws are without anyone being wrong?
      *   **Yes:** Simplicity is in the eye of the beholder. (Rules in Lewis, Van Fraassen).
      *   **No:** The laws are fixed regardless of who looks. (Rules in Armstrong, Maudlin, Powers).
      *   *Note: This tests whether systematization is a human project or a worldly feature.*

  5.  **The Direction:** Do particles behave regularly *because* of the law, or is the law just a description of their regular behavior?
      *   **Because:** Laws govern or produce behavior. (Rules in Armstrong, Maudlin, Powers).
      *   **Description:** Laws summarize behavior. (Rules in Lewis, Van Fraassen, Cartwright).
      *   *Note: If Description, you likely answered No to Q2.*

  6.  **The Bet:** Knowing a regularity is a "law" makes you more confident in unobserved cases than knowing it is merely a consistent pattern.
      *   **Yes:** Laws carry extra modal power. (Rules in Armstrong, Maudlin, Powers).
      *   **No:** A pattern is a pattern; laws add no confidence. (Rules in Lewis, Van Fraassen).
      *   *Note: For many, this answer follows automatically from Q5.*

  **The map**

  *   **Path A (The Summarizers):** Q5 (Description) → Q6 (No)
      *   Q4 (Yes) → Q2 (No)
          *   Q1 (No): **Lewis-Style Best Systems** (Laws exist as optimal summaries).
          *   Q1 (No) + "Laws are fictions": **Van Fraassen/Giere** (Anti-realism).
      *   Q3 (Yes): **Cartwright** (Laws are false capacities).
  *   **Path B (The Governors):** Q5 (Because) → Q6 (Yes)
      *   Q2 (Yes) → Q4 (No)
          *   Q1 (Yes) + "Relations between types": **Armstrong** (Universals).
          *   Q1 (Yes) + "Brute facts": **Maudlin** (Primitivism).
          *   Q1 (Yes) + "Properties dictate": **Powers** (Dispositional Essentialism).
  *   **Path C (The Unnamed):** Q5 (Description) → Q6 (Yes).
      *   **Unnamed** (Incoherent: Description that grants power).

  **The leaves**

  **Lewis-Style Best Systems:** Laws are the axioms of the best summary of all events, balancing simplicity and strength. The core commitment is that laws supervene on the pattern of events. The awkward thing: Laws depend on human standards of simplicity, so an alien might disagree about what the laws are without being wrong.

  **Armstrong-Style Universals:** Laws are a necessitation relation holding between universal properties. The core commitment is that laws are distinct from events but explain them. The awkward thing: You must believe in "universals" as abstract entities that exist across space and time to ground the relation.

  **Maudlin-Style Primitivism:** Laws are fundamental, irreducible facts that govern the universe. The core commitment is that laws explain regularities without themselves needing explanation. The awkward thing: You must accept brute modal facts with no deeper ontology to ground why these laws hold rather than others.

  **Powers/Dispositional Essentialism:** Necessity comes from what properties essentially are; laws are manifestations of powers. The core commitment is that modality is built into the properties themselves. The awkward thing: You must deny that properties could exist without their specific causal effects, limiting combinatorial possibility.

  **Van Fraassen/Giere Deflationism:** There are no laws in reality, only models or regularities we use to save the phenomena. The core commitment is anti-realism about laws as ontological items. The awkward thing: You must say successful science does not describe the actual structure of the world, only its observable output.

  **Cartwright-Style Capacities:** Fundamental laws describe capacities or tendencies, not actual behavior in messy contexts. The core commitment is that fundamental equations are literally false of the real world. The awkward thing: You must tell physicists that their most precise equations do not truly describe the entities they study.

  **Unnamed Strict Regularity:** Laws are just patterns with no summary optimization or governing power. The core commitment is that there is no distinction between law and accident beyond psychological habit. The awkward thing: You cannot explain why we trust laws more than accidents for prediction, rendering the concept useless.

  **Empty cells**

  **Q5 (Because) + Q2 (No):** This combination claims laws explain events but are fully fixed by those events. Diagnosis: **Incoherent.** If events fix the laws, the laws cannot be the deeper explanation for the events without circularity.

  **Q5 (Description) + Q6 (Yes):** This claims laws are just summaries but somehow grant extra confidence over raw patterns. Diagnosis: **Unattractive.** It posits a magical epistemic boost without an ontological ground to support it.

  **Q3 (Yes) + Q5 (Because) + Q2 (Yes):** Primitive governing laws that allow exceptions. Diagnosis: **Unexplored.** While possible, most primitivists insist on strictness to maintain governing power; exceptions usually push one toward Cartwright's capacity view.

  **Pairs this can't separate**

  **Lewis vs. Van Fraassen:** Both answer Q5 (Description) and Q2 (No). The tree distinguishes them only by Q1 (Truth vs. Fiction), but in practice, both treat laws as mind-dependent summaries. You may argue over whether the summary "exists" while agreeing on the physics.

  **Armstrong vs. Powers:** Both answer Q5 (Because) and Q4 (No). The distinction lies in whether necessity comes from relations between universals or internal property dispositions. The tree groups them as "Realist Governors," masking the ontological dispute over where necessity lives.

  **Redundancy:** Q2 (Twin Universe) and Q5 (Direction) are often the same question wearing different clothes. If laws explain events (Q5), they usually don't supervene on them (Q2). If you answer consistently, these nodes will correlate perfectly, making one superfluous.

  **Dry run**

  **The Physicist:** Insists the Lagrangian is "just real." Answers Q5 (Because) and Q2 (Yes). He lands in **Maudlin-Style Primitivism**. He thinks he's doing physics, but the tree reveals he's a metaphysical realist who believes in brute governing facts.

  **The Philosopher:** Argues laws are our best summary. Answers Q5 (Description) and Q2 (No). She lands in **Lewis-Style Best Systems**. She thinks she's opposing the physicist, but the tree shows their disagreement is purely about whether the summary "exists" or "governs."

  **The Neuroscientist:** Says laws are useful fictions. Answers Q5 (Description) and Q1 (No/Fiction). He lands in **Van Fraassen**.

  **Result:** The Physicist and Philosopher end up in neighboring leaves (Realist vs. Summarizer), separated only by the status of the summary. They thought they were enemies, but the tree shows they agree on the structure of the world (Q4, Q6) and differ only on the label "law." The Neuroscientist is the true outlier. This should humble the Physicist, who discovers his "realism" is a specific metaphysical choice, not a default of science.
