answer: |-
  ### Adjudication of Moves 1–8

  **Move 1 (Nadia):** **Partly Right.** She accurately captures Zahavi's original intuition (waste guarantees honesty) and the standard textbook summary. However, she conflates Zahavi's verbal argument with Grafen's mathematical formalization. The claim that cost must be a "net burden" is the pre-Grafen view, which Move 2 corrects.

  **Move 2 (Owen):** **Clearly Right.** This is a precise technical correction. Grafen (1990) demonstrated that signals need not reduce net fitness (waste); they only require *differential marginal costs* (the cost of increasing the signal must be higher for low-quality individuals). Honesty is maintained by the slope of the cost function, not the absolute level of fitness loss.

  **Move 3 (Nadia):** **Partly Right.** Her philosophical worry about unfalsifiability is valid (a theory that explains everything explains nothing). However, she is mistaken that Grafen's model folds in indices. Indices are honest due to physical impossibility of cheating; handicaps are honest due to strategic cost. The mechanisms are mathematically distinct in the models, even if the label "handicap" is sometimes sloppily applied to both in the literature.

  **Move 4 (Owen):** **Partly Right.** The distinction between level (correlation) and interaction (differential cost) is theoretically sound and rescues the model from the obvious counter-evidence that high-quality signalers survive well. However, his concession that indices/cheap talk are distinct was **required**, not gratuitous; without it, the theory lacks boundaries. His defense of correlational data is risky; while logically consistent, it renders the theory hard to distinguish from "good genes" indicator models without experimental manipulation.

  **Move 5 (Nadia):** **Clearly Right.** Methodologically, she is on solid ground. Observational data cannot disentangle condition from ornament because they are confounded (as Owen admits). Only manipulation (breaking the link between quality and ornament) can test the cost function. Her charge of "insulation" bites if theorists interpret *any* survival outcome as confirmation; the theory must specify which survival curves are forbidden.

  **Move 6 (Owen):** **Clearly Right.** The Getty (1998) objection is a serious theoretical challenge. Fitness components (survival and reproduction) often interact multiplicatively (you must survive to mate), not additively. If the equilibrium depends on additive assumptions that do not hold biologically, the model's prediction is fragile. This undermines the generality of the proof, not necessarily the biological phenomenon, but it shows the theory is less robust than claimed.

  **Move 7 (Nadia):** **Clearly Mistaken.** She overcorrects. Sensitivity to payoff assumptions (additive vs. multiplicative) makes a model conditional, not vacuous. Furthermore, differential cost *is* a distinct residue from indices (physical constraint) and cheap talk (aligned interests). A signal can be physically possible to fake and occur despite conflicting interests, yet remain honest due to cost. That is a distinct category.

  **Move 8 (Owen):** **Clearly Mistaken.** This is a category error. Human cultural signaling (diamonds, religion) involves conscious expectation of return and social policing, which are distinct from the evolutionary mechanisms of biological signaling. In biology, "repayment" is fitness, not conscious trust. Moreover, expecting a fitness return does not negate the handicap; the handicap is the *filter* that ensures only those who will get the return can afford the signal. Switching to "punishment" invokes a different mechanism (policing) without showing it applies to peacocks.

  ---

  ### The Level-versus-Interaction Distinction

  Owen's distinction is a **genuine rescue**, not an empty redescription, provided it generates specific predictions about slopes rather than intercepts. It clarifies that the Handicap Principle is not a claim that signaling *reduces* fitness overall, but that the *marginal cost* scales negatively with quality.

  **Falsifying Observation:**
  To falsify Owen's version, one would need to demonstrate a system where signals are honest, interests conflict, and physical indices are absent, yet the **marginal cost of signaling is equal for high- and low-condition individuals** (parallel cost functions), or **lower for low-condition individuals**.
  *   **What this shows:** It would show that differential cost is not necessary for honesty, implying that some other mechanism (e.g., social policing, repeated game reciprocity, or undisclosed physical constraints) is doing the work. It would reduce the Handicap Principle from a general law to a specific, perhaps rare, mathematical possibility.

  ---

  ### The Dispute on Correlational Data (Moves 4 & 5)

  **Verdict:** The finding that the most ornamented males survive best **fails to bear on** the handicap account decisively, but Nadia is right that it cannot *confirm* it.

  **Inference Layout:**
  1.  **Handicap Prediction:** High-quality males signal more *and* survive better because their high quality offsets the cost of the signal. (Low-quality males signal less *and* survive worse).
  2.  **Alternative (Index/Indicator):** High-quality males signal more (because it's easy for them) *and* survive better (because they are high quality).
  3.  **Observation:** Signal size correlates positively with survival.
  4.  **Owen's Claim:** This is consistent with (1).
  5.  **Nadia's Claim:** This is indistinguishable from (2) without manipulation.

  **Why Nadia's Insulation Charge Bites:**
  For the charge to stick, proponents must accept *any* positive correlation between ornament and quality as support. To avoid insulation, the theory must predict a specific **cost slope**. If researchers measure the physiological cost of adding 1cm of tail and find it is identical for weak and strong males, yet honesty persists, the Handicap Principle is refuted. Owen is right that the data is *compatible*, but Nadia is right that compatibility is not confirmation. The theory is currently insulated because few studies measure the *marginal cost function* directly.

  ---

  ### Evaluation of the Getty-Style Objection (Move 6)

  Owen's objection undermines **one particular proof of the principle**, not necessarily the principle as a claim about animals, though it weakens its theoretical universality.

  *   **The Issue:** Grafen's model assumes fitness $W = B - C$ (additive). Getty argues $W = S \times R$ (survival $\times$ reproduction, multiplicative).
  *   **Implication:** If fitness is multiplicative, the marginal value of survival changes depending on reproductive potential. This can alter the stability conditions for the signaling equilibrium.
  *   **What must be settled:** To know if the principle holds, we must settle **how fitness aggregates in the specific species**. Do survival and reproduction trade off additively or multiplicatively in the organism's life history? If the latter, the Grafen equilibrium may not exist, requiring a new model. This does not prove animals don't use handicaps, but it proves the standard mathematical justification is incomplete.

  ---

  ### Nadia's "Nothing Remains" Claim (Move 7)

  Nadia is **wrong** that nothing distinct remains.

  *   **Distinctiveness:** A handicap is distinct from an index (which cannot be faked physically) and cheap talk (where interests align). A handicap is a signal that *can* be faked physically and *should* be faked strategically (due to conflict of interest), but is not, because of differential costs.
  *   **Condition for Cost as Guarantor:** For cost itself to be the *only* available guarantor of honesty, two things must be true:
      1.  **Physical Possibility:** Low-quality individuals must be physically capable of producing the signal (ruling out indices).
      2.  **Interest Conflict:** Low-quality individuals must gain a fitness advantage from deceiving the receiver, and receivers must lack the ability to punish deception directly (ruling out policing/cheap talk).
      If these conditions hold and the signal remains honest, cost is the only remaining explanation.

  ---

  ### Owen's Human Cases (Move 8)

  Owen's move **switches subject matter without argument**.

  *   **Why:** Biological signaling relies on natural selection shaping physiological constraints and behavioral strategies over generations. Human "costly signaling" (diamonds, religion) often relies on cultural evolution, conscious calculation, and institutional enforcement (punishment of bluffs).
  *   **Relevance:** It would only bear on the biological question if Owen could show that animal receivers also actively detect and punish bluffs independent of physiological cost. There is little evidence for this in non-human animals (e.g., a hen does not "punish" a rooster for a fake crow; she simply ignores him or chooses another). By invoking "expectation of repayment," Owen imports cognitive machinery peacocks do not possess.

  ---

  ### What Both Are Missing

  Both participants focus almost exclusively on the **Signaler's costs** and the **Model's structure**. They are missing the **Receiver's Evolution**.

  1.  **Receiver Psychology/Sensory Bias:** Signaling does not evolve in a vacuum. Receivers evolve to interpret signals. If receivers have a pre-existing sensory bias (e.g., attraction to bright colors), signals may evolve to exploit this bias without any information content (Sensory Exploitation), rendering the cost irrelevant to the *origin* of the signal.
  2.  **The Definition of Cost:** Neither defines "cost" precisely. Is it metabolic energy? Predation risk? Opportunity cost? These have different evolutionary dynamics. A predation cost selects differently than a metabolic cost.
  3.  **The Role of Models:** They treat the models (Grafen, Getty) as if they are the theory itself. The models are existence proofs (showing honesty *can* evolve), not necessarily descriptions of how it *did* evolve.

  ### Overall Verdict

  **Owen is more right overall.**

  *   **Why:** Owen correctly identifies the technical requirements of the Handicap Principle (differential marginal costs, not net waste) and correctly identifies the fragility of the mathematical proofs (Getty's objection). He understands the logic of the models better than Nadia, who relies on a pre-Grafen intuition of "waste."
  *   **Where Nadia is more right:** Nadia is superior on **empirical methodology**. She correctly identifies that correlational data is insufficient and that the field risks unfalsifiability ("insulation"). Her demand for manipulation is the correct scientific standard.
  *   **Final Judgment:** Owen wins on conceptual clarity and theoretical accuracy; Nadia wins on scientific rigor. However, since the dispute centers on the *validity of the principle* (a theoretical claim), Owen's correction of the definition (Move 2) and the modeling constraints (Move 6) are foundational. Nadia's Move 7 (that nothing remains) is a theoretical overreach that undermines her position. Owen accurately maps the logical space; Nadia accurately maps the empirical difficulties. Theoretical accuracy takes precedence in adjudicating the *principle* itself.
