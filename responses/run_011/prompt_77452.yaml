answer: |-
  **Scenario: The Radical Accountability Charter**

  Marcus works in a tech collective governed by a "Radical Accountability" charter, a code unanimously endorsed by everyone in the building. The charter asserts that cleaning up another member's mess is morally wrong because it enables irresponsibility and violates their autonomy. One Tuesday, Marcus sees a colleague knock over a mug of coffee near an exposed server port. The liquid is creeping toward the circuitry. Marcus knows the charter forbids intervention. He feels a sharp spike of anxiety about the potential hardware damage (the right-making feature: preventing harm). He also notices the sticky mess is annoying him (unlovely motive), though he knows he would have acted even if the spill were odorless and invisible. Despite believing he is committing a moral violation by interfering, Marcus grabs a towel and cleans it up. He feels guilty and weak throughout, convinced he has undermined his colleague's character. No one tells him he did the right thing; the community unanimously agrees he did wrong.

  ***

  **Analysis**

  **The Smith-Style Account (Knowledge-Required)**
  This account demands three things: (1) the act is right, (2) the agent does it for the reason that makes it right, and (3) the agent *knows* (or at least truly believes) both that the act is right and that it is right for that reason.
  *   **Condition 1:** Met. Preventing hardware damage is right.
  *   **Condition 2:** Met. Marcus is moved by the risk of damage.
  *   **Condition 3:** **Fails.** Marcus explicitly believes the act is *wrong* (a violation of autonomy). He lacks the true belief required for knowledge. He cannot desire the act *because it is right* if he believes it *is not right*.
  *   **Verdict:** No moral worth.

  **The No-Knowledge Account (Arpaly/Markovits)**
  This account requires the act to be right and the agent to be non-accidentally moved by the right-making features, regardless of moral belief.
  *   **Rightness:** Met.
  *   **Responsiveness:** Met. Marcus is moved by the risk of damage.
  *   **Non-Accidentalness (Robustness):** Secured via nearby variations. If the liquid were moving away from the server, he wouldn't clean it (shows he's tracking the harm, not just cleaning). If the charter weren't in place, he would still clean it (shows the belief isn't driving the action). If the headache were absent, he would still clean it (shows the unlovely motive isn't the driver). His responsiveness persists across changes in belief and inclination.
  *   **Verdict:** Moral worth present.

  **The Pivot Feature**
  The divergence rests entirely on **(3) Inverted Belief**. If Marcus had a true belief (even without justification), Smith would grant worth because the cognitive condition is met. Arpaly would also grant worth. The split only exists because Smith treats the correct moral belief as a constitutive element of moral worth, while the No-Knowledge account treats it as incidental to responsiveness. The epistemic isolation (4) ensures the belief isn't just a temporary ignorance fixable by testimony; it is a stable feature of his moral psychology.

  **Stress Tests**
  1.  **True Belief Without Knowledge:** If Marcus believes helping is right (true belief) but lacks justification (no knowledge), the split **collapses**. Smith requires the *belief* that it is right to desire it *as right*. With true belief, Smith grants worth. Arpaly grants worth. You lose the pedagogical wedge.
  2.  **Delete Unlovely Motive:** If Marcus acts purely from anxiety about the damage, the accounts **do not converge**. Smith still denies worth (false belief). Arpaly still grants it (pure responsiveness). The unlovely motive is not doing the theoretical work; it is only there to prevent students from conflating the case with the "naturally warm person" objection we covered in Week 2.

  **The Smith-Style Attack**
  The strongest objection is that this case smuggles knowledge in via **_de re_ grasp**. A Smith defender will argue that if Marcus is genuinely responsive to the *risk of damage*, he implicitly recognizes that risk as a reason. To be moved by a feature *as a reason* just is to have a _de re_ moral belief. If he grasps the reason _de re_, he satisfies the spirit of the knowledge condition even if his _de dicto_ belief ("this is wrong") is false. On this reading, Marcus isn't truly ignorant; he has a fragmented moral mind where his responsiveness betrays a knowledge he disavows.

  **Recommendation**
  The case holds, but the _de re_ attack is potent. If your students crush the case with that objection, relax **Spec (3)**. Instead of an *inverted* belief (thinking it's wrong), make him **agnostic** (having no moral belief about the act at all). He sees the risk, cleans it, and simply never categorizes the act morally. Smith still denies worth (no belief about rightness), Arpaly grants it (responsiveness), and the _de re_ charge is harder to mount because he isn't contradicting himself.
