      *   *Case 1 (Sanctioned):* Surgeon omitted personal complication rate (double average). Patient signed premedicated, 15 mins before incision. Patient says she would have sought second opinion.
          *   *Factors:* Omission of material data (personal stats), timing/pressure (premedicated, rushed), causation (would have sought second opinion).
      *   *Case 2 (Sanctioned):* Physician disclosed all facts in writing. Signature taken during night handover, 40-min deadline. Patient felt no choice.
          *   *Factors:* Full disclosure, but timing/pressure (night, deadline), coercion perception (no choice).
      *   *Case 3 (Sanctioned):* Oncologist disclosed everything, allowed week. Opened conversation with frightening story of death (admitted intent to frighten). Patient says she would have declined without it.
          *   *Factors:* Full disclosure, time allowed, but *manipulative framing* (fear tactic), causation (would have declined).
      *   *Case 4 (Cleared):* Surgeon omitted comparative outcome data (like Case 1). Patient had two unhurried consultations. Patient says she would have proceeded regardless.
          *   *Factors:* Omission of data, but no pressure, no causation (would have proceeded).
      *   *Case 5 (Cleared):* Physician told patient waiting was foolish, disclosed everything, gave two weeks, accepted refusal. Patient returned on own initiative, no regret.
          *   *Factors:* Strong opinion expressed, but full disclosure, time allowed, patient autonomy respected (accepted refusal initially), no causation/regret.
      *   *Case 6 (Cleared):* Consent taken on low-dose anxiolytic. Patient assessed lucid, informed, no pressure. Complaint only about being medicated.
          *   *Factors:* Medication present, but capacity assessed, no pressure, full info.

