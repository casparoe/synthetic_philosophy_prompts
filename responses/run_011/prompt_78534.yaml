      *   *Need:* A case that separates "manipulation/framing" from "causation/regret" or "time pressure."
      *   *Idea:* A case where there is manipulation (like Case 3) but the patient says it *didn't* change their decision (like Case 4). Or a case with time pressure but no causation.
      *   *Better Idea:* The current tension is between "Process Integrity" (no manipulation) vs. "Outcome/Regret" (did it change the decision?). Case 3 sanctioned because of manipulation + changed decision. Case 5 cleared because opinion + no changed decision.
