  4. The closest precedent is the oncologist case where a frightening story was used to sway decision-making, as both involve deliberate emotional manipulation to secure consent. The analogy breaks down because the film was factually accurate educational material rather than a selected anecdote, and the patient claims she would have delayed treatment rather than refused it entirely.
  5. A future case where a physician employs manipulative framing yet the patient testifies they would have made the identical choice regardless would force the panel to choose between punishing unethical process or requiring proven causation. This would clarify whether the panel protects the integrity of consent itself or merely remedies decisions that were demonstrably altered by misconduct.
