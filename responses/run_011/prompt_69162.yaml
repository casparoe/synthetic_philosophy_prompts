answer: |-
  My job is to watch steel hold weight. I work for the firm that signs off on load-bearing components before they go into service. Bridge cables, elevator ropes, crane lines. We put them in a harness, we pull until the gauge reads the maximum service load, and we watch. If it holds, I sign the card. If it parts, I scrap it.

  There are three ways a component can pass my test.

  The first is the proper way. The steel goes through annealing. It sits in a furnace for a week, bathed in heat and chemicals. This changes the grain of the metal. It removes the tendency to snap under tension. It is expensive. It slows production. A factory manager hates waiting for a furnace. But once it is done, the cable is safe. The load has nothing left to bite on.

  The second way is a trick. The harness has a safety lock. It is designed to stop the machine if the cable slips, protecting the operators. But if you engage the lock before the pull, the machine strains against the harness, not the cable. The gauge reads green. The log says passed. But the cable inside is untreated. It retains its tendency to snap. It just never felt the weight. People do this to save the cost of the furnace. They save the week. They save the money.

  The third way is bad luck. Sometimes a cable is annealed. It is safe. But during the test, a freight train passes the shed down the valley. The ground shakes. A resonance sets up in the floor. The cable vibrates and parts even though the load was within limits. Or, years later, the train passes while the cable is in service. The record shows it passed the test, because the train wasn't there that day. But the environment breaks it anyway.

  To me, the paper record looks the same for all three. Passed.

  Three years ago, I signed off on Cable 409. It went into a construction crane in the city. Last month, it parted. The load dropped. It killed a man named Elias. He was thirty-four. He wore a silver ring on his thumb that got twisted flat in the accident. That is the detail the family lawyer kept coming back to. The ring.

  Now I am sitting in a hearing room with gray carpet and fluorescent lights. There are three engineers, two lawyers, and a man from the union. They want to know what Cable 409 was at the moment I signed the card. They do not ask what it did. They ask what it was.

  "Mr. Harris," the union rep says. "Is it possible the harness was locked?"

  "It is possible," I say.

  "Is it possible the annealing decayed?"

  "It is possible."

  "Is it possible the failure was due to external vibration?"

  "It is possible."

  They want me to pick one. The insurance company needs a cause. If the cable was locked, the factory is liable. If the annealing decayed, the treatment firm is liable. If it was vibration, it is an act of God, and nobody pays.

  During the recess, I go to the evidence table. They have brought out my old testing rig, the one I used three years ago. It is obsolete now, but it is the only way to check the logs. I need to verify the lock status indicator. On my rig, there is a small glass window on the side of the harness. Inside, a pin moves. If the pin is down, the safety lock is disengaged. If the pin is up, the lock is engaged.

  I look at the window now. The pin is down.

  "Looks clear," the lawyer says.

  I reach out and tap the glass. The pin doesn't move. I take a small magnet from my pocket, something I use to retrieve dropped bolts. I run it along the frame behind the glass. There is a secondary latch there, hidden from the operator's station. If you slide a shim into the slot behind the panel, the pin stays down even if the lock is engaged. You cannot see the shim from where I stand. You cannot see it from where anyone stands. The instrument that tells you the truth can itself be fixed to lie.

  I put the magnet away. "It's not clear," I say.

  We go back into session. The room is quiet. The air conditioning hums. I look at the photos of Elias. I look at the twisted silver ring.

  I have a belief about this work. I have held it since I started pulling steel. I believe that what a cable is set up to do is fixed entirely by what is inside it. The steel knows what it can hold. The furnace changes the steel. The lock changes the test. The train changes the world. But the cable's nature is in the grain. If it breaks, it was because something inside it gave way. That is how I sleep at night. I certify the metal, not the weather.

  I am about to say this. I open my mouth to tell them that the cable must have been weak inside, that the annealing must have failed, because the steel is the only thing that matters.

  Just then, a freight train goes past the building.

  It is heavy haul. You feel it in your chest before you hear it. The floor vibrates. The water in the pitcher on the table ripples in concentric circles. The glass windows rattle in their frames. A pen rolls off the lawyer's desk and hits the carpet.

  For ten seconds, the room is not a room. It is a shaker table. The vibration is not in the cable. It is in the floor. It is in the air. It is everywhere.

  If a cable broke during those ten seconds, would it be because the steel was weak? Or because the world shook?

  If I say the steel was weak, I keep my belief. I keep the truth inside the metal. If I say the world shook, I admit that what a cable is set up to do depends on where it stands. I admit that a safe cable can break because of a train in the valley. I admit that my test cannot measure the world, only the steel.

  The train passes. The room settles. The water stops moving.

  "Mr. Harris," the chair says. "We need a determination for the report. Based on the evidence, what was the state of Cable 409 at certification?"

  I look at the twisted ring photo. I look at the rig with the hidden shim. I look at the window where the train just shook the glass.

  If I choose the locked rig, the factory pays. They cut corners. They used the shim. It is a moral failure.
  If I choose the vibration, nobody pays. It was bad luck. The cable was safe, but the world was too loud.
  If I choose the annealing decay, the treatment firm pays. The cable was safe, then it became unsafe. The change happened inside.

  I need the change to be inside. I need the steel to be the author of its own failure. If I say the train did it, then my test is worthless. If I say the lock did it, then my eyes were worthless. If I say the annealing failed, then the material changed, and my test was right at the time.

  I pick up the pen.

  "Finding," I say. "The component underwent standard annealing at the time of certification. The treatment degraded over the service period due to internal structural fatigue. The failure was intrinsic."

  I write it down. I sign my name. I do not look at the window. I do not look at the rig. I keep the truth inside the steel.
