answer: |-
  There is no single canonical term for this specific dialectical sequence, though it is a recognized species of **Immunizing Stratagem** within the philosophy of science; I propose labeling it **Conjunctural Drift**.

  This move is structurally identical to what Imre Lakatos called adjusting the "protective belt" of a research program to shield a "hard core" theory from falsification, but it possesses a specific morphology in comparative history that generic "ad hocery" does not capture. The established machinery you referenced—small-N inference and contrastive explanation—fails to name it because those frameworks typically assume the causal model is fixed *before* testing, whereas your description highlights a model that mutates *during* testing. The closest existing concept is **Ad Hoc Hypothesis** formation, but that usually implies adding a standalone assumption (e.g., "an invisible planet exists") rather than demoting a primary cause to a necessary condition within an expanding conjunction.

  **Conjunctural Drift** is defined as the retroactive conversion of a falsified singular difference-maker into a necessary condition within an accumulating conjunction, where each added condition is itself incapable of distinguishing the cases, and the conjunction lacks an ex-ante theoretical mechanism explaining the interaction.

  **Boundary Cases:**
  1.  **Legitimate Conjunctural Explanation:** The researcher specifies *before* examining the outcomes that causation is configural (e.g., using Qualitative Comparative Analysis). They posit that Factors A, B, and C *interact* to produce Outcome Y, providing a mechanism for why A alone is insufficient. The conjunction is theoretically motivated, not just empirically assembled.
  2.  **Conjunctural Drift:** The researcher starts with "A causes Y." When A is found in the negative case, A becomes "A + B causes Y." When B is found in the negative case, it becomes "A + B + C." The conjunction is empirically assembled to rescue the claim, not theoretically derived.

  **Principled Differentiation:**
  You can distinguish "uncovered complexity" from "sedimented defeat" using two tests:
  1.  **The Interaction Test:** Does the explanation provide a mechanism for how the conditions *combine* (e.g., coal is only useful *if* high wages make machinery profitable)? If the account is merely a list of co-occurring conditions without a theory of their synergy, it is drift.
  2.  **The Pre-specification Test:** Was the conjunctural model articulated before the counter-evidence was encountered? Legitimate complexity is hypothesized; drift is patched.

  **Confidence:**
  I am 90% confident in this carving. The mapping onto Lakatosian philosophy of science is robust, and the distinction between ex-ante conjunctural theory and ex-post conjunctural salvage is standard in rigorous comparative methodology (e.g., Ragin, Mahoney), even if the specific label "Conjunctural Drift" is not yet lexicalized.

  **Least Sure Claim:**
  I am least sure that no niche slang term exists within the specific historiography of the Great Divergence itself (e.g., something informal used in seminars like "The Pomeranz Shuffle"), as oral traditions in specific sub-fields sometimes generate labels that never make it into print or philosophy of science textbooks.
