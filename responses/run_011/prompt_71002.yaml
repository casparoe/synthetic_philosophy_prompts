answer: |-
  ### Screening Procedure: The "Single Responsibility" Filter

  **Instructions:** Apply steps 1–6 sequentially. If a treatment fails a step, halt and assess curability. If Step 6 is triggered, refer to a specialist. Steps marked **[JUDGMENT CALL]** require you to acknowledge your own historiographical bias before proceeding.

  1.  **Onset Fixation**
      *   **Question:** Does the treatment explicitly define the temporal start of the conflict, and justify why earlier tensions do not count?
      *   **Sufficient:** A specific date/event (e.g., "Truman Doctrine, March 1947") plus a sentence explaining why prior events (e.g., "Yalta, 1945") are categorized as pre-conflict.
      *   **Failing:** Vague periods ("the post-war years") or moving the goalpost to suit the accusation.
      *   **Curability:** **Yes** (Narrative framing/VO), unless the claim relies on ambiguity to survive.

  2.  **Actor Consistency**
      *   **Question:** Does the accused agent remain at the same level of abstraction throughout the argument?
      *   **Sufficient:** The treatment distinguishes between "The Kremlin," "The Politburo," "Stalin," or "The Soviet System" and sticks to one.
      *   **Failing:** Level-shifting (e.g., blaming "Communism" for a decision made by a specific faction, or blaming "The US" for an action by a rogue general).
      *   **Curability:** **Yes** (Script clarification), unless the theory requires the ambiguity to implicate a broader system.

  3.  **Causal Mechanism**
      *   **Question:** Does the treatment distinguish between *but-for* necessity, causal contribution, and moral culpability?
      *   **Sufficient:** Explicitly states: "Without X, Y would not have happened" (necessity) OR "X accelerated Y" (contribution) OR "X was wrong, regardless of outcome" (culpability).
      *   **Failing:** Conflating capacity with intent (e.g., "They had the bomb, so they intended to use it for coercion").
      *   **Curability:** **Fatal** if the core thesis relies on conflating these categories; **Yes** if merely imprecise language.

  4.  **The Steel Man Test [JUDGMENT CALL]**
      *   **Question:** Is the strongest rival historiographical account represented charitably before being dismantled?
      *   **Sufficient:** The treatment cites the best evidence for the opposing view and defeats it with superior evidence, not rhetoric.
      *   **Failing:** Straw-manning (attacking a weak version of the rival view) or omitting the rival view entirely.
      *   **Curability:** **Yes** (Commission a contrasting interview or insert archival counter-evidence), provided the budget allows.

  5.  **Evidence Symmetry**
      *   **Question:** Is the evidentiary standard applied equally to the accuser and the accused?
      *   **Sufficient:** Internal memos of the accused are treated with the same skepticism as the public propaganda of the accuser (or vice versa).
      *   **Failing:** Treating one side's internal documents as "truth" and the other's as "deception" without independent verification.
      *   **Curability:** **Fatal** (Requires new research/archival access, not just an edit).

  6.  **Verification Threshold**
      *   **Question:** Can a non-specialist verify the central claim using standard historiography or translated primary sources?
      *   **Sufficient:** The claim aligns with or debates established academic consensus using accessible sources.
      *   **Failing:** The claim relies on obscure archives, untranslated materials, or niche theories that require subject expertise to validate.
      *   **Curability:** **Refer to Specialist** (Do not pass internally).

  ***

  ### What This Procedure Cannot Do
  This procedure cannot verify the authenticity of archival documents or translations; it assumes the provided materials are genuine. It cannot correct fundamental ideological bias in the production team, only flag where that bias bypasses evidentiary standards. It cannot guarantee historical truth, only historiographical rigor and fairness in argumentation.

  ***

  ### Treatment Assessments

  | Treatment | Verdict | First Procedure Question Failed | Why the Treatment's Answer is Insufficient | Curable in Edit? | What Would Have to Be Added or Cut to Pass |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(1) Soviet Plan (1943)** | Refer to Specialist | Q6 (Verification Threshold) | Claim relies on specific internal planning docs from 1943; a generalist cannot verify if these prove "division" vs. "security buffers." | No | Commission an independent academic review of the cited documents before development money is released. |
  | **(2) Structural (Nobody)** | Develop | Q1 (Onset Fixation) | Thesis argues conflict was "overdetermined," yet fails to define when the structural tension became active conflict. | Yes | Add narration defining the "activation point" of the security dilemma, even if arbitrary, to ground the narrative. |
  | **(3) US Diplomacy** | Develop with Conditions | Q4 (The Steel Man Test) | Treatment minimizes Soviet expansion in Eastern Europe to strengthen the US culpability claim; rival view is waved off. | Yes | Insert a segment acknowledging Soviet security concerns/actions before arguing US response was disproportionate. |

  ***

  ### Limits of the Procedure
  This filter will wrongly kill innovative treatments that rely on new, untranslated archival discoveries which cannot be verified without development funding. It will wrongly pass treatments that are historiographically balanced but visually incoherent or narratively dull. Finally, it cannot prevent a filmmaker from using the required "rival account" segment merely as a token gesture if the editing subtly undermines it.
