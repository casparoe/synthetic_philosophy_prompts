answer: |-
  Your three cases are not rigged; they are excellent. They successfully isolate the tension between the two dominant views without relying on the standard, overworked examples like heart murmurs or vestigial tails. You have correctly identified that the debate ultimately hinges on whether "function" is a historical property (why is this trait here?) or a systemic property (what does this trait do now?). The framing is sound, and the intuition pumps are working as intended. However, I believe you are slightly misdiagnosing the friend's proposal. It is not a compromise between Causal Role and Etiological views; it is a refinement of the Etiological view that accounts for population genetics dynamics.

  The core dispute is about normativity. Biological function talk is inherently normative; it allows us to say a trait is *supposed* to do something and is failing when it does not. The Causal Role (CR) view collapses under the weight of Case C. If function is merely causal contribution to a system capacity, then the dead duplicate's consumption of ATP is a function. It contributes to the capacity of "resource depletion." To avoid this, the CR theorist must arbitrarily designate some capacities as "relevant" and others as "noise." But on what grounds? Usually, they smuggle in evolutionary history to decide which capacities matter, thereby ceasing to be a pure CR view. If you cannot distinguish a broken pump from a waste-producing lump of protein without referencing why the pump was built, you have lost the explanatory power of function talk. The Etiological (Selected Effect, SE) view handles Case C effortlessly: the gene was selected for pumping, so pumping is its function. The fact that it currently wastes resources is a malfunction, not a new function. This preservation of normativity is the decisive reason to reject pure Causal Role accounts.

  However, the SE view faces genuine difficulties with Case A and Case B, which your friend's hybrid attempts to smooth over. In Case A, the repatriated enzyme has a history of selection for cleaving pesticide, but currently exists in an environment where only toxin exists. Pure SE dictates the function is pesticide-cleaving, even though that substrate is absent and the enzyme cannot cleave the available toxin. This feels wrong because we conflate function with current utility. But this conflation is the error. Function explains presence; utility explains survival. The enzyme is present because of pesticide selection. Its function is pesticide-cleaving. The organism is currently maladapted because its functional trait cannot be exercised in the current environment. This is a hard bullet to bite, but it is necessary to maintain the distinction between "what a trait is for" and "what a trait is good for now." Regarding your sub-question: it does not matter that the selection was human-imposed. Directed evolution is still selection. The lineage's history includes that pressure, and thus the trait's etiology is tied to it. To say otherwise is to privilege "natural" selection arbitrarily, which undermines the mechanistic basis of the theory.

  Case B, the de novo ORF, is where the SE view shines and the CR view falters regarding reference classes. The CR view says the peptide has a function in brackish water but not in the home river. This makes function relative to the observer's choice of environment, rendering it subjective. The SE view says the peptide has no function yet because it has not been selected. It is a proto-function. This is biologically precise. It distinguishes between a beneficial accident and an established biological role. The worry that function talk is just recording our choice of reference class is valid for CR, but SE fixes the reference class to the actual history of the population. If there is no selection history, there is no function, regardless of potential utility in hypothetical environments. This prevents us from annotating every beneficial mutation as "functional" before it has proven its staying power against drift.

  This brings us to your friend's recency-weighted account. You suspect it is a verbal patch, but I argue it is a **special case of the Etiological view** that incorporates the dynamics of allele fixation. Pure SE is often criticized for being too static, implying function switches instantly when selection pressures change. But populations do not respond instantly. A trait's etiological weight decays over generations as the selection pressure maintaining it fades or reverses. This is not a compromise with Causal Role; it is simply Etiological theory updated with population genetics. The "window" is not set by convenience; it is set by the strength of selection coefficient ($s$) and effective population size ($N_e$). If a trait is no longer contributing to fitness, selection stops maintaining it, and its status as a "selected effect" decays as drift takes over. This solves the transition problem in Case A without abandoning history. The enzyme's function fades from pesticide-cleaving as the lineage adapts to the soil (or goes extinct), but it does not instantly become toxin-cleaving because there is no history for that yet.

  Therefore, the verdict is clear. The Causal Role view must be rejected because it cannot ground normativity without smuggling in etiology. The Etiological view is the correct foundation, but it must be understood dynamically, as your friend suggests, to handle timescales where selection history is in flux. This is not a middle ground; it is the correct implementation of the Etiological view. We do not split the difference; we deepen the history.

  Applying this verdict to your cases:

  **Case A:** The function is **pesticide-cleaving**. The organism is maladapted. The enzyme cannot perform its function in the soil. It does not have a toxin-cleaving function because there is no selection history for that. The human imposition of selection is irrelevant; selection is selection. The recency-weighted view suggests this function will decay over generations if the lineage survives and adapts to the toxin, but right now, the history dominates.

  **Case B:** The peptide has **no function**. It is a beneficial variant, but until it is fixed or maintained by selection, it is not a functional trait of the species. It has causal roles, but no biological function. This avoids the reference class problem by tying function to actual population history, not potential environments.

  **Case C:** The duplicate has the function of **catalysis (pumping)**, but it is malfunctioning. It does not have the function of wasting resources. The etiology determines the function, not the current causal output. This preserves the distinction between broken tools and waste.

  Your friend's hybrid is the most robust way to handle the transition periods, but it remains firmly etiological. It does not grant function based on current contribution alone; it grants it based on the shadow of selection falling across recent generations.

