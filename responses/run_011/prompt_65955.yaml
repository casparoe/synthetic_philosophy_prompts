          *   Crisis Round (1): 10 min
          *   Debrief: 30 min
      *   **The Depersonalization Call:** Advise cutting names. It confounds the variable. The pain point is *competence*, not *care*.
      *   **The "Hole":** The game cannot reproduce the *time scale* of atrophy. It happens in an hour, not years. Also, the stakes are points, not livelihoods/safety. The facilitator must bridge this.

  5.  **Refining the Mechanics (Self-Correction):**

      *   *Problem:* If the System is a card, people might just read the card.
      *   *Fix:* The System is a "Recommendation." The Human must stamp it. If they stamp wrong, they lose points.
      *   *Problem:* How to ensure they don't check the work?
      *   *Fix:* Time pressure + Cognitive Load. Give them 20 cases in 3 minutes. If they check every one, they fail on time. If they trust the system, they finish but miss the error.
      *   *Better Fix:* The "Override Cost." If you override the system, you pay 5 points. If you follow and it's wrong, you lose 10. This incentivizes trust.
      *   *The "Stomach" Moment:* In the final round, the System makes a mistake that was *obvious* in Round 1. The team loses points. They realize they stopped looking.

  6.  **Addressing the Depersonalization Question:**

      *   User asks: "Give me a design that keeps them separable... or tell me to cut one."
      *   My take: **Cut the names.**
      *   *Reasoning:* If you include names in Manual and remove them in Auto, and performance drops, is it because they lost the skill or because they lost the empathy? You won't know. To prove *Ironies of Automation* (cognitive atrophy), you must hold empathy constant. Remove names from *both*. Make it about the data. The "injury" is the loss of agency and sharpness, not the loss of human connection. That's a different article.

