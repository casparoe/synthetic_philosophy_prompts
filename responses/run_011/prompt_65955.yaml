      *   **Let's use Text.** "The Editor." Check headlines for errors.
      *   **Let's use Logistics.** "The Manifest."
      *   **Let's go with "The Grid."** 3x3 grid of numbers.
      *   **Rule:** "If Row 1 > Row 2, Accept."
