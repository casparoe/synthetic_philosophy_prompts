      *   **Constraints:** No laptops, index cards, whiteboard, phone timer, facilitator only. No pre-work.
      *   **Key Mechanics:**
          *   Needs a scoring system (points).
          *   Needs manual rounds first (build competence/pride).
          *   Needs an "automated" round (pre-written rule/script) that is mostly right but fails on specific edge cases.
          *   Failure must be diagnosable only by someone who understands the underlying task.
          *   No humiliation; the *game* beats the *team*, not team vs. team.
          *   **Second Manipulation:** Depersonalization (names/stories vs. numbers). User worries this conflates deskilling with depersonalization. Needs advice on whether to keep, separate, or cut.
          *   **Debrief:** Needs a script/structure. When to reveal the theory? What can the game *not* show (the "hole")?
          *   **Logistics:** Team size, timing, card content, scoring, troubleshooting.

  2.  **Deconstruct the Core Concept (The "Irony of Automation"):**

