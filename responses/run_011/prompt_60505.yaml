prompt: |-
  so our reading group just got through a pop book by a vision neuroscientist, and the chapter on blindness spends a long time on Molyneux's problem. The guy who runs the group is a philosophy major and he kept making faces at the chapter, but when I asked him afterwards he couldn't say exactly what was wrong with it, just that it felt like the argument was slipping around. I'm a psych student so at the time I mostly nodded along, but I took notes on the bit that seemed to matter and it went roughly like this:

  "Molyneux's problem asks whether someone born blind could recognize objects by sight. Philosophers argued about it for three centuries without settling it, because there was simply no way to check: the empiricists said no, since our ideas come in only through the particular sense that delivers them, and the rationalists said yes, since a concept of shape doesn't depend on any one sense being open. Then surgeons started restoring sight to people who had been blind from birth, and those patients turned out to be unable to say what they were looking at, at least at first. That settled it in favour of the empiricists — seeing has to be learned. But it also settles something bigger: a blind person's ideas of shape aren't visual ideas at all, and there's no such thing as a concept of shape that belongs to more than one sense. The moral is that this was only ever a factual question wearing a philosopher's costume, and once the operation became available there was nothing left for the philosophers to do."

  Can you go through that claim by claim and sort each one as fine, loose but defensible, or actually wrong, with a sentence on why for each? Three things I specifically want your read on. First, does the surgical result really pick between the two camps the way he says, or can both sides absorb a newly sighted person failing to name shapes — I have a vague memory that at least one rationalist gave a qualified yes that already predicts failure on that kind of test, and that another figure split the difference between flat and solid shapes. Second, he jumps from "the patients couldn't match seen shapes to shapes they knew by touch" to "there are no shape concepts shared across the senses," and I can't tell whether that's a legitimate inference, an overreach, or a straight change of subject from performance to concepts. Third, if his last line is too strong, what's the strongest version of it that survives — was there anything genuinely empirical the operations did settle, even if it isn't what he thinks? I half-buy that last paragraph becuase it's the sort of thing my methods professors would applaud, so I'd rather know before I repeat it.
