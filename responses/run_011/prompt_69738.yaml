answer: |-
  Here is your prep sheet. It is ordered by the product of **likelihood** (how soon they'll ask) and **damage** (how much it undermines your core claim).

  ### 1. The "It's Just Log Utility" Objection
  **Who:** The two Decision Theorists (vNM loyalists).
  **The Objection:** "You claim to have bypassed utility theory, but you haven't. By maximizing geometric growth, you are mathematically equivalent to an agent maximizing Expected Utility with a logarithmic wealth function, $U(w) = \ln(w)$. You haven't shown utility is unnecessary; you've just derived a specific utility function from dynamic constraints. The representation theorem still holds."
  **Plain English:** "You didn't kill utility theory; you just found a specific reason for why people use one particular type of it."
  **The Reply (90 secs):** "The mathematics may look identical, but the *ontology* is different. In vNM, concavity is a psychological preference—a taste for safety. In my view, the concavity is a physical constraint of the system, like gravity. If I tell you a bridge collapses under 10 tons, that's not the bridge's 'preference'; it's the arithmetic of materials. I am arguing risk aversion is often a structural requirement for survival, not a psychological quirk. We should stop modeling physical constraints as mental tastes."
  **Soft Spot:** Mathematically, they are right. The output is the same.
  **Concession Advice:** **Concede upfront.** Say: "Mathematically, this looks like log utility. My claim is not about the equation, but about the *explanation*. Don't call it a preference if it's actually a law of motion."

  ### 2. The Samuelson "Finite Horizon" Critique
  **Who:** The Econ PhD (knows Kelly/Thorp).
  **The Objection:** "Paul Samuelson proved that maximizing growth rate is only optimal asymptotically—in the infinite limit. For any finite horizon, especially a human lifespan, an agent with a different utility function might rationally prefer higher arithmetic expected value even with ruin risk. You are asserting an infinite horizon on a finite creature."
  **Plain English:** "Growth maximization only wins in the long run. You might die before the long run arrives."
  **The Reply (90 secs):** "Samuelson assumes you can restart the game or average across parallel lives. I am arguing that for a single, non-restartable trajectory, the 'long run' is simply the sequence of decisions you actually make. If a strategy leads to ruin (zero wealth), the game ends *for you*. The asymptotic argument isn't about time length; it's about the absorbing barrier of zero. You don't need infinity to be killed by a zero."
  **Soft Spot:** If the horizon is very short (e.g., you need money for surgery next week), geometric maximization might be too conservative.
  **Concession Advice:** **Do not concede.** This is your core ground. Hold the line on "ruin is absorbing."

  ### 3. The One-Shot Decision Problem
  **Who:** Grad Students / General Room.
  **The Objection:** "Your argument relies on repeated exposure to gambles to generate a time average. But many life decisions are one-offs: taking a lump sum pension vs. an annuity, or a single medical procedure. There is no repetition, so no time average to calculate. Why does your rule apply there?"
  **Plain English:** "Your math needs repetition. Life choices often don't repeat. So your math doesn't fit."
  **The Reply (90 secs):** "The *decision* might be one-off, but the *consequences* play out over time. Choosing a lump sum is choosing a trajectory of wealth consumption. If you invest that lump sum in a volatile asset, you are exposing your future self to a sequence of returns. The repetition isn't in the choice; it's in the compounding of the outcome. We assess the choice by the viability of the path it creates."
  **Soft Spot:** **This is your admitted soft spot.** It is hard to defend without begging the question.
  **Concession Advice:** **Concede partially.** Say: "This is the hardest extension. I argue that because the *consequences* compound, the logic holds, but I grant that the strict ergodic argument is strongest in repeated gambles."

  ### 4. The Non-Stationarity Trap
  **Who:** You (knowing your biology) vs. The Historian/Formal Epistemologist.
  **The Objection:** "Ergodicity requires stationarity—the rules of the game can't change. But you said your intuition comes from fish stocks, which are density-dependent and non-stationary. In a non-stationary process, the time average doesn't converge to anything. If the environment changes, your 'growth rate' is undefined. So what do you maximize then?"
  **Plain English:** "Your math only works if the rules stay the same. Fish stocks change. So your math breaks where you use it most."
  **The Reply (90 secs):** "Exactly. And that is why Expected Value is even more dangerous there. EV assumes you can average across states that may never exist. If the system is non-stationary, neither EV nor growth rates are stable. But growth-rate reasoning forces you to notice the non-stationarity because your wealth will fluctuate wildly. EV hides the structural change behind an average. I'm not saying growth rates solve non-stationarity; I'm saying they expose it faster."
  **Soft Spot:** **Major vulnerability.** If the time average doesn't exist, your normative rule has no number to maximize.
  **Concession Advice:** **Concede upfront.** "In highly non-stationary environments, the metric breaks. That's a feature, not a bug—it tells you the model is wrong. EV would pretend the model is fine."

  ### 5. The Normative vs. Descriptive Confusion
  **Who:** Decision Theorists.
  **The Objection:** "Are you claiming people *do* maximize growth rates (descriptive), or that they *ought* to (normative)? If descriptive, behavioral econ shows people are terrible at probability. If normative, why is survival the only virtue? Sometimes rational agents should risk ruin for a moral cause."
  **Plain English:** "Are you saying we actually do this, or should? And why is staying alive the only goal?"
  **The Reply (90 secs):** "I am making a conditional normative claim. *If* your goal is to remain in the game—to persist as a decision-making entity—then growth rate is the constraint. I am not saying you shouldn't sacrifice yourself for a cause. I am saying that if you want to keep acting, you cannot treat ensemble averages as time averages. It's a rationality constraint for persistence, not a theory of all value."
  **Soft Spot:** None, provided you stick to "persistence."
  **Concession Advice:** **Do not concede.** Be clear this is about *instrumental* rationality for survival.

  ### 6. The Epistemic Disconnect
  **Who:** Formal Epistemologist.
  **The Objection:** "I work on accuracy and scoring rules for belief, not wealth. Beliefs don't compound financially. Why should a theory of monetary growth dictate how I assess truth or probability?"
  **Plain English:** "This is about money. I care about truth. Truth doesn't earn interest."
  **The Reply (90 secs):** "Beliefs guide actions, and actions have consequences that unfold over time. If your scoring rule encourages bets that lead to ruin, you stop being an agent capable of holding beliefs. I'm not saying truth compounds; I'm saying the *utility of being a knower* depends on staying in the game. An epistemology that bankrupts the knower is pragmatically self-defeating."
  **Soft Spot:** Purely theoretical epistemology might not care about pragmatic survival.
  **Concession Advice:** **Concede partially.** "Granted, for pure belief without action, this doesn't apply. But philosophy usually cares about action."

  ### 7. The Metaphysical Circularity
  **Who:** Philosophers (General).
  **The Objection:** "You claim the 'person as trajectory' is a metaphysical premise. But it looks like you're defining the person as a trajectory just to make your math work. That's question-begging. Why should we accept that metaphysics?"
  **Plain English:** "You're defining 'self' in a way that fits your equation. That's cheating."
  **The Reply (90 secs):** "It's not a definition; it's an empirical claim about continuity. If I make a decision today that kills me tomorrow, there is no 'me' to experience the expected value. The 'moment' self is a fiction; the 'process' self is what exists in spacetime. I'm asking you to treat the entity that exists (the process) rather than the entity that doesn't (the instantaneous snapshot)."
  **Soft Spot:** It is hard to prove "process" is more real than "moment" without more philosophy.
  **Concession Advice:** **Do not concede.** This is your philosophical hook. Stand firm.

  ### 8. The "Bernoulli Did It First" Objection
  **Who:** Historian of Probability.
  **The Objection:** "Daniel Bernoulli solved the St. Petersburg paradox in 1738 using moral expectation (utility). You are presenting 18th-century insights as new discoveries, just swapping 'moral' for 'ergodic'."
  **Plain English:** "Bernoulli said this 300 years ago. You aren't new."
  **The Reply (90 secs):** "Bernoulli psychologized the solution. He said humans *feel* diminishing returns. I am physicalizing it. I am saying the returns *actually* diminish because of the mechanics of compounding, regardless of how you feel. Bernoulli put the problem in the head; I am putting it back in the world."
  **Soft Spot:** Historically, he's right.
  **Concession Advice:** **Concede upfront.** Acknowledge Bernoulli immediately in the talk. It builds goodwill.

  ### 9. The Pascal's Wager / Infinite Utility
  **Who:** Grad Student (Infinite utilities).
  **The Objection:** "What about decisions with infinite payoffs, like Pascal's Wager? Geometric growth rates can't handle infinities. Does your system break down there?"
  **Plain English:** "What if the payout is infinite? Your math can't count that high."
  **The Reply (90 secs):** "Physical systems do not offer infinite payoffs. Pascal's Wager relies on a metaphysical payoff that cannot be compounded or spent. If we are talking about decision theory for living creatures in a physical universe, infinities are modeling errors, not features. I am happy to let my theory break on impossible problems."
  **Soft Spot:** Philosophers love infinite cases.
  **Concession Advice:** **Do not concede.** Dismiss the premise as physically unreal.

  ***

  ### The Single Reply That Must Land
  **The "Ensemble vs. Time" Distinction.**
  If you lose the room on the math of utility (Objection 1), you can recover. But if they don't grasp the difference between **parallel copies** (ensemble) and **one person over time** (trajectory), the paper dies.
  **How to ensure it lands:** Use a concrete image early. "If 100 people play Russian roulette once, 83 survive (Ensemble). If one person plays Russian roulette 100 times, 0 survive (Time). Expected value looks at the 100 people. You are the one person."

  ### The Question You Are Praying Nobody Asks
  **"If the process is non-ergodic (like your fish stocks), the time average doesn't converge. So you have no objective function. Are you just telling us to maximize nothing?"**

  **Why it's deadly:** It hits your biology background (where you know stocks aren't stationary) and your math (which requires stationarity). It exposes that your "solution" only works in simplified models.

  **What to say if it comes:**
  "That is the precise reason I am here. Standard Expected Value *pretends* the average exists even when the process is non-ergodic. It gives you a number that is physically meaningless. My approach gives you *no* number, which is the correct signal that the system is too unstable to optimize. It is better to know you cannot calculate than to calculate a falsehood. I am offering a warning system, not just a calculator."
