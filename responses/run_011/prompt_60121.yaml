prompt: |-
  Eight months ago the government I served under for a decade was replaced, and I have been seconded to the interim panel that must decide, instrument by instrument, which of the old regime's enactments and administrative acts continue to be applied until a new legislature exists. One of those acts is the reason my brother lost his professional licence; I have declared the conflict and stayed on the panel anyway, which is part of why I need the procedure to sit outside my own intuitions.

  Our brief is narrower than the famous version of this problem. We are almost never asked whether anyone should be punished for doing what was then permitted. We are asked whether to unwind: licences granted and revoked, property transfers, disciplinary findings, qualifications, benefits already paid. In every such case some third party relied in good faith on an act they did not endorse, and often still depends on it.

  Please write a decision procedure the panel can run on a single instrument in under an hour, with two members, at least one of whom is not a lawyer, and no recourse to the legislature. I want the questions in order; what counts as a sufficient answer to each; the available dispositions — continue in force, suspend pending substantive review, treat as never having been valid — and the conditions that select among them; and an explicit stage at which reliance interests are weighed, kept separate from the stage at which the instrument's own character is assessed. Ground it in whatever the argument about the internal demands of legality actually yields about when a duly promulgated rule fails to be law in the sense that obliges obedience, and treat those demands as tests applied to a document, telling me which a non-lawyer can run in an hour and which she cannot.

  Then apply it to three cases: (a) a published, generally applied licensing rule that excluded one ethnic group from a profession; (b) a vaguely worded public-order regulation under which a single official made an unreviewable determination that cost my brother his licence; (c) an ordinary building-code amendment, technically sound, on which a thousand completed private constructions now depend. Case (c) should show reliance doing independent work rather than the procedure merely tracking how objectionable a rule's content was, and case (b) should not come out in my favour simply because I want it to.

  Finish by marking where the procedure stops being a procedure — where it frames a choice among values rather than resolving one — and by saying what this kind of triage systematically gets wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Post-regime change (8 months ago). The user served the old regime for a decade. Now on an interim panel deciding the fate of old enactments/acts.
      *   **Task:** Create a decision procedure for the panel to evaluate a single instrument in under an hour, with two members (one non-lawyer), no legislative recourse.
      *   **Specific Constraints:**
          *   Questions in order.
          *   Define sufficient answers.
          *   Define dispositions (Continue, Suspend, Void *ab initio*).
          *   Separate "Reliance Interests" stage from "Instrument Character" stage.
          *   Ground in "internal demands of legality" (Fuller/Raz type jurisprudence).
          *   Distinguish what a non-lawyer can assess vs. cannot.
          *   Apply to three specific cases:
              *   (a) Ethnic exclusion licensing rule.
              *   (b) Vague regulation leading to brother's license loss (user has a conflict of interest but stayed on panel).
              *   (c) Technical building code with heavy reliance.
          *   Case (c) must show reliance doing independent work (not just content objectionability).
          *   Case (b) must not favor the user automatically.
          *   Conclusion: Mark where the procedure stops being a procedure (value choice) and what this triage systematically gets wrong.

  2.  **Theoretical Grounding (Internal Demands of Legality):**

      *   The prompt asks to ground this in "internal demands of legality." This points directly to Lon Fuller's *The Morality of Law* (the eight desiderata of legality) or perhaps Joseph Raz's rule of law principles.
      *   *Fuller's 8 Desiderata:* Generality, Promulgation, Non-retroactivity, Clarity, Non-contradiction, Possibility of compliance, Constancy, Congruence between official action and declared rule.
      *   *Adaptation for the Panel:* A non-lawyer needs to check these. Some are easy (Was it published?); some are hard (Congruence?).
      *   *Validity vs. Reliance:* The prompt explicitly wants these separated. This mirrors the distinction between *legality* (was it law?) and *equity/consequence* (what happens if we remove it?).
      *   *Dispositions:*
          1.  *Continue in Force:* Valid law, high reliance.
          2.  *Suspend Pending Review:* Valid form, questionable substance/application, or complex reliance.
          3.  *Treat as Never Having Been Valid (Void Ab Initio):* Failed the threshold of legality so badly it wasn't law.

  3.  **Drafting the Procedure (The "Hourglass" Model):**

      *   *Time Limit:* 1 Hour.
      *   *Personnel:* 2 Members (1 Legal, 1 Lay).
      *   *Structure:*
          *   Phase 1: Threshold Legality (The Fuller Test). Can a layperson check this? Yes, mostly procedural.
          *   Phase 2: Reliance & Harm (The Consequence Test). Who relied? What happens if we pull the rug?
          *   Phase 3: Disposition Matrix.

      *   *Refining Phase 1 (Legality):* Focus on the "Internal Morality."
          *   Q1: Promulgation (Was it public?)
          *   Q2: Clarity/Intelligibility (Could a normal person understand it?)
          *   Q3: Congruence (Did the official act match the rule? *Crucial for Case B*)
          *   Q4: Generality/Non-Discrimination (Does it target specific individuals or protected classes in a way that violates the concept of "law"?)
      *   *Refining Phase 2 (Reliance):*
          *   Q5: Good Faith Reliance (Did people act on this?)
          *   Q6: Irreversibility (Can we undo the physical/social change?)
      *   *Refining Phase 3 (Decision):* Combine scores.

      *   *Addressing the Conflict:* The user is on the panel regarding their brother's case. The procedure must be rigid enough to prevent bias. The "Congruence" test is key here. If the rule was vague and the official had unreviewable discretion, it fails legality regardless of the user's desire.

  4.  **Developing the Three Cases:**

      *   *Case (a) Ethnic Exclusion:*
          *   Legality: Fails Generality/Equality (depending on how we frame "internal morality"). Fuller might say a rule can be clear but evil. However, a rule that excludes based on immutable characteristics often fails the "possibility of compliance" or "generality" in a deep sense. Let's argue it fails the *concept* of law (Radbruch formula influence, though prompt asks for internal demands). Actually, to stick to "internal demands," we might say it passes clarity but fails *Congruence* with higher constitutional norms if they exist, or we treat "Generality" as excluding arbitrary class distinctions. Let's go with: It passes formal legality but fails a threshold of *public reason*. Wait, the prompt asks for "internal demands of legality." A strictly Fullerian view might say an evil law is still law. But the prompt asks when a rule *fails to be law in the sense that obliges obedience*. This invites the Radbruch/Fuller debate. I will position "Generality" as requiring *reasonable* classification, not arbitrary persecution.
          *   Reliance: Low (those excluded didn't rely; those included relied on privilege).
          *   Outcome: Void.

      *   *Case (b) Brother's License (Vague + Unreviewable):*
          *   Legality: Fails Clarity (vagueness) and Congruence (unreviewable discretion). This is a procedural failure, not just a "my brother was hurt" failure. This satisfies the constraint "not come out in my favour simply because I want it to." It comes out in favor because the *rule* was bad law.
          *   Reliance: The state relied on the revocation? The brother relied on keeping it?
          *   Outcome: Suspend/Review (specifically the *application*, maybe void the specific determination).

      *   *Case (c) Building Code:*
          *   Legality: Passes all internal tests (clear, published, possible).
          *   Reliance: High (1000 buildings).
          *   Outcome: Continue.
          *   *Constraint Check:* Reliance must do independent work. Even if the code was slightly flawed, reliance saves it. Or, if the code was valid, reliance cements it. The prompt says "reliance doing independent work rather than the procedure merely tracking how objectionable a rule's content was." So, even if there were minor legality doubts, reliance overrides them.

  5.  **Refining the "Non-Lawyer" Constraint:**

      *   Lawyers argue about precedent and statutory interpretation. Non-lawyers argue about common sense, fairness, and facts.
      *   The procedure must rely on documentary evidence (Was it published? Yes/No) and factual outcomes (Are there buildings? Yes/No).
      *   The "Legality" phase must be binary where possible.

  6.  **Addressing the "Conflict of Interest":**

      *   The user declared it but stayed. The procedure must act as a blindfold. If the procedure says "Void" for Case B based on *legal criteria*, the user's presence is less toxic. If it says "Continue," the user must accept it.

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the gravity.
      *   *The Procedure:* "The Bifurcated Validity & Reliance Protocol (BVRP)."
      *   *Phase 1: The Legality Threshold (Fullerian Tests).* Focus on Promulgation, Clarity, Non-Retroactivity, Congruence.
      *   *Phase 2: The Reliance Assessment.* Focus on Detriment, Reversibility, Third Parties.
      *   *Phase 3: The Disposition Matrix.*
      *   *Application:* Run the three cases.
      *   *Limitations:* Where values take over (The Radbruch Gap) and what triage misses (Individual justice vs. Systemic stability).

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is "Generality" too legalistic for a layperson?
      *   *Fix:* Frame it as "Does this apply to everyone in the same situation, or does it name names/groups without reason?"
      *   *Critique:* Case (b) needs to ensure the user doesn't just win because they are on the panel.
      *   *Fix:* Emphasize that *unreviewable discretion* is a failure of legality (Congruence/Clarity) regardless of the victim. The procedure finds the *rule* defective, not just the outcome unfair.
      *   *Critique:* Case (c) needs reliance to be the *tiebreaker* or the *dominant factor*.
      *   *Fix:* Make Reliance a veto on "Voiding." If Reliance is High, you cannot Void *ab initio*, even if Legality is shaky.
      *   *Critique:* The prompt asks for "internal demands of legality... telling me which a non-lawyer can run."
      *   *Fix:* Explicitly label questions as [Lay-Accessible] or [Legal-Required]. Since the panel has one non-lawyer, the procedure must work if the lawyer is absent or biased, so prioritize Lay-Accessible questions for the threshold.

  9.  **Final Polish:**

      *   Tone: Professional, detached, bureaucratic but humane.
      *   Formatting: Clear headings, bullet points for the procedure.
      *   Ending: Philosophical honesty about the limits of procedure.

  10. (Final check against constraints):
      *   Under an hour? Yes, binary questions.
      *   Two members (one non-lawyer)? Yes, questions designed for common sense.
      *   No legislature recourse? Yes, self-contained.
      *   Separate Reliance from Character? Yes, Phase 1 vs Phase 2.
      *   Three cases applied correctly? Yes.
      *   Mark where procedure stops? Yes, in the conclusion.

  *(Self-Correction on Case A)*: Fuller argues that even evil laws can be "law" internally if they meet the 8 desiderata. However, the prompt asks about rules that "fail to be law in the sense that obliges obedience." This allows for a Radbruchian infusion (extreme injustice is no law) without abandoning the procedural focus. I will frame the "Generality" test to catch arbitrary persecution as a failure of the *form* of law (law must be general, not a bill of attainder).

  *(Self-Correction on Case B)*: The user's brother lost the license. If the rule is voided, does he get the license back? The panel decides the *instrument*, not the specific remedy. But voiding the instrument implies the basis for revocation is gone. I need to be careful not to promise the brother his license back, but rather that the *rule* used to take it is invalidated. The prompt asks to decide the *instrument*.

  *(Refining the "Non-Lawyer" aspect)*: I need to be explicit about which questions the non-lawyer drives. The prompt says "at least one of whom is not a lawyer." The procedure should be robust enough that the non-lawyer can veto based on clear factual failures of legality (e.g., "Was this published?").

