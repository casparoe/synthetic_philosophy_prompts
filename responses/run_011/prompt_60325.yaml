  I'm trying to work out whether the capability approach is really a third currency in the "equality of what?" debate, or just welfarism plus a skeptical psychology. Sen's headline argument against utility is adaptive preferences, and if that's the only place capability-equality ever diverges from welfare-equality, the divergence is cheap. So build me a case where it diverges some other way.

  Specs: one realistic scenario, a paragraph, no sci-fi, no disability or impairment. Two people with equal resource bundles in a Dworkin-ish sense and equal welfare — and the equal welfare has to be earned by the story, not just asserted. One of them can't achieve some functioning the other can, and the blockage has to be one a bigger bundle genuinely won't remove: no cost-of-living index, no cash grant that fixes it, and you should say why not. She also doesn't mind, and her not minding cant be adaptive — not a scar, not a preference she's never examined; she's informed and reflectively stable in the indifference. And it can't be a capability she has and declines to exercise. She doesn't have it.

  Then walk the verdicts: welfare-egalitarian says fine, resource-egalitarian says fine (say why hypothetical insurance doesn't fire), objective-list capability view says there's a real injustice. Say which feature is doing the work, whether Sen's own version splits from the list version here, whether the capability theorist still has a distributive remedy left or has slid out of the currency debate entirely, and how the two losers attack the case — I'm expecting "perfectionism" and "you're redistributing to fix a shortfall nobody feels."

  Tell me how confident you are that this meets every constraint at once, and which constraint you're least sure about. If they're jointly unsatisfiable, say which one breaks rather than faking it.

  Last line, exactly: Verdict: satisfiable — or Verdict: unsatisfiable, [constraint].
