  Alice and Beatrice are litigators with identical wealth and social standing in a jurisdiction where constitutional law reserves judicial appointments for men. Alice, being male, accepts a bench position; Beatrice, female, remains in private practice. Both report identical life satisfaction derived from mastering legal craft, and Beatrice's contentment is not resigned acceptance but a reflectively stable preference for the autonomy of advocacy over adjudication, known fully to her. The constitutional bar is absolute; no amount of personal wealth can purchase a judgeship for Beatrice, nor does she suffer impairment, yet the capability set available to her lacks the functioning of "holding judicial office" which Alice possesses.

  Welfare-egalitarians see no injustice because utility is equal; the shortfall is invisible to hedonic metrics. Resource-egalitarians (Dworkin) also say fine: hypothetical insurance wouldn't fire because Beatrice, valuing autonomy over office, wouldn't have insured against the inability to hold judgeships, so her resource bundle remains adequate for her conception of the good. The objective-list capability theorist, however, flags a real injustice: political participation or holding office is a central functioning valuable regardless of preference. The feature doing the work is the intrinsic value of freedom (opportunity) distinct from achieved well-being. Sen's version might split here, weighing her agency and valuation more heavily than Nussbaum's fixed list, but still counts the freedom deprivation. The capability theorist has no distributive remedy (cash won't fix it); the solution is structural change (law), sliding out of the currency-of-justice debate into constitutional reform. The losers attack thus: the welfarist cries "perfectionism" for imposing values she rejects, and the resource theorist argues you're "redistributing to fix a shortfall nobody feels."

