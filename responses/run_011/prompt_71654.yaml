answer: |-
  **MODULE TITLE:** AC-PI 2024: Agent-Centered Constraints & Procedural Integrity
  **AGENCY:** Bureau of Agent-Relative Standards (BARS)
  **SLIDE 1: TITLE**
  **Visual:** BARS logo (a scale balanced on a single pillar) over a background of abstract office geometry.
  **Voiceover:** Welcome to the 2024 Annual Certification on Agent-Centered Constraints and Procedural Integrity. This module defines your moral duties as a BARS employee. Completion is mandatory. Integrity is not optional.

  **SLIDE 2: LEARNING OBJECTIVES**
  **Visual:** Bulleted list.
  **Voiceover:** By the end of this session, you will be able to: One, distinguish between doing harm and allowing harm within your scope of agency. Two, apply the non-aggregation principle to violation counts. Three, identify the threshold where constraints may be overridden. Remember: Your duty is not to minimize total violations in the world, but to ensure you do not commit them.

  **SLIDE 3: CORE PRINCIPLES**
  **Visual:** Diagram showing a single agent separated from a cluster of outcomes.
  **Voiceover:** BARS operates on agent-relative constraints. A constraint is a duty you owe, not a value you promote. Therefore, we do not track total harm metrics. If you violate a protocol to prevent five other violations, you have still committed one violation. The morality of an act is determined by your agency, not the outcome. You are responsible for what you do, not what you fail to prevent. Foreseen harm is permissible; intended harm is not. This is the Doctrine of Double Effect. You may proceed with a compliant action that foreseeably results in negative outcomes, provided the harm is not the means to your goal.

  **SLIDE 4: THRESHOLDS AND DE MINIMIS**
  **Visual:** A gauge labeled "Constraint Binding" moving from "Strict" to "Catastrophic."
  **Voiceover:** Constraints are binding unless a catastrophic threshold is met. Minor inconveniences do not constitute a threshold. Furthermore, the de minimis principle applies: trivial infractions do not accumulate into major violations. However, do not use this to justify repeated minor breaches. Each act is judged individually. Your integrity is non-fungible. You cannot trade a small violation today for a larger compliance tomorrow.

  **SLIDE 5: SCENARIO WALKTHROUGH**
  **Visual:** Interactive screen. Profile: "Jordan, Benefits Administrator." Error log shows 5 eligible applicants denied due to System Glitch 404.
  **Voiceover:** You are Jordan. A system error has automatically denied benefits to five eligible applicants. Correcting this requires a manual override, which violates Protocol 7 (No Manual Overrides). If you do nothing, five applicants remain denied. If you override, you violate Protocol 7, but the five are approved.
  **Interaction:** [Click: Override System] [Click: Log Error]
  **Voiceover (if Override):** Incorrect. You have committed a violation. The five denials are system errors, not your acts. You have cleaned your hands by dirtying them.
  **Voiceover (if Log Error):** Correct. You maintained procedural integrity. The denials are unfortunate, but they are not your violations. You are not responsible for the glitch.

  **SLIDE 6: KNOWLEDGE CHECK 1**
  **Visual:** Question text.
  **Voiceover:** Question One: You intend to file a report on time. You foresee this will delay a vendor's payment by one day. Is this permissible?
  **Options:** A) Yes, harm is foreseen, not intended. B) No, harm is caused. C) Yes, if the vendor is wealthy.
  **Feedback:** Option A is correct. Under Double Effect, foreseen harm is permissible if not intended. Option B is incorrect; causation alone does not imply violation. Option C is incorrect; agent-constraints do not depend on the victim's status.

  **SLIDE 7: KNOWLEDGE CHECK 2**
  **Visual:** Question text.
  **Voiceover:** Question Two: Why does BARS not track total agency violations?
  **Options:** A) It is too expensive. B) Constraints are not values to be promoted. C) We assume employees are perfect.
  **Feedback:** Option B is correct. Constraints bind the agent; they are not global values to be maximized. Option A is incorrect; cost is irrelevant to moral structure. Option C is incorrect; we assume employees are fallible but bound.

  **SLIDE 8: KNOWLEDGE CHECK 3**
  **Visual:** Question text.
  **Voiceover:** Question Three: Can you violate a truth-telling constraint to prevent five other employees from lying?
  **Options:** A) Yes, 5 lies outweigh 1 lie. B) No, you are not responsible for their lies. C) Yes, if management approves.
  **Feedback:** Option B is correct. You may not commit a violation to prevent others from committing violations. Their agency is not yours. Option A is incorrect; violations do not aggregate across agents. Option C is incorrect; management cannot authorize moral violations.

  **SLIDE 9: COMMON MISCONCEPTIONS**
  **Visual:** Callout box with warning icon.
  **Voiceover:** Misconception: "Shouldn't we minimize total violations across the agency?" Correction: No. That is consequentialist reasoning. Your duty is to your own agency. If you violate a rule to prevent five others, you have become a violator. We do not trade integrity for efficiency. The world may contain more violations because you remained compliant, but you remain clean. This is the cost of moral agency.

  **SLIDE 10: CERTIFICATION**
  **Visual:** Certificate template with empty name field.
  **Voiceover:** You have completed AC-PI 2024. You are now certified to act within your constraints. Remember: Compliance is not about outcomes. It is about who you are. Click "Generate Certificate" to finish.
