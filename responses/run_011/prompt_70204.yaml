  The set is not jointly tenable due to a direct contradiction between your scarcity condition and the shared calendar case.

  1. **Point 4 vs. Point 5 (Fatal):** A stranger can walk to your fridge and read the calendar, achieving the same result. By Point 4, it is world; by Point 5, it is mind.
     *Commitment to drop:* Point 4 as stated.
     *Repair:* Restrict scarcity to *authorized* access rather than physical exclusivity.
     *Cost:* You lose the hard line against search engines, as authorized API access could count as mind, blurring your distinction between ledger and Google. This undermines your motivation for Point 4.

  2. **Point 3 vs. Point 7 (High):** Point 3 says Otto trusts without checking. Point 7 says knowledge requires monitoring sources. If Otto never checks, he doesn't know (per 7), contradicting Point 8.
     *Commitment to drop:* Point 7's strictness.
     *Repair:* Define monitoring as periodic verification rather than constant vigilance.
     *Cost:* You must concede Otto's knowledge is slightly more fragile than the biological woman's, violating the spirit of Point 2's equality claim. You admit extended knowledge is second-rate.

  3. **Point 1 vs. Point 4 (Moderate):** Point 1 claims location is the *only* honest difference. Point 4 adds an accessibility constraint. A public book is outside the skull but fails Point 4.
     *Commitment to drop:* Point 1's "only" clause.
     *Repair:* Admit Point 1 is an oversimplification.
     *Cost:* You abandon the pure parity principle, acknowledging functional coupling matters more than location. This weakens your opening manifesto.

  **Apparent Conflict:** Point 6 does not conflict with Points 1-5. Functional states (belief) rely on causal roles, while qualitative states (feeling) rely on phenomenology. Since you define mind functionally in Points 1-3, Point 6 remains consistent without repair.

  **Conclusion:** You cannot maintain the scarcity condition as written while claiming shared resources are mental. You must choose between exclusivity and shared cognition. Your intuition on shared cognition (Point 5) is stronger than your scarcity rule (Point 4); keep the former, fix the latter.
