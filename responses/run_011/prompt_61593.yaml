          *   *Welfare:* Ada's welfare will crash without help. Bea's is stable. Utilitarianism says save Ada. But is that *justice*? The prompt asks about *egalitarian justice*.
          *   *Egalitarianism:* Wants to reduce inequality.
          *   *Current State:* Equal welfare, Equal Resources. Unequal Natural Assets (Sight).
