      *(Self-Correction on Rawls)*: Rawls explicitly excludes natural assets from the index of primary goods, relying on the difference principle to handle them indirectly. This is a major critique (the "ambition/endowment" distinction). So Rawls should score low because the *currency* excludes the relevant factor (health/sight).
