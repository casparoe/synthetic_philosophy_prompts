          *   *Verdict:* Likely favors Ada (prevention), but struggles with the "equal happiness now" premise.

      *   **Rawlsian Primary Goods:**
          *   *Analysis:* Primary goods include "health and vigor." Sight is a natural primary good (or prerequisite). Ada is losing a natural primary good. Bea lacks it. Rawls focuses on the *index* of goods.
          *   *Problem:* Rawls assumes normal functioning. Disability is often treated via the "normal range" or left to the legislative stage. Does preventing loss count more than accommodating existing lack?
          *   *Verdict:* Ambiguous. Might favor Ada (restoring/maintaining normal functioning) or be indeterminate because both currently have the same *social* primary goods.

      *   **Dworkinian Resources (Hypothetical Insurance):**
          *   *Analysis:* What insurance would they buy behind the veil of ignorance (knowing general risks but not specific status)? People would insure against going blind. Would they insure against being born blind? Yes.
          *   *Nuance:* Dworkin distinguishes between brute luck and option luck. Ada's future blindness is brute luck (genetic/clinical). Bea's is brute luck.
