      *   *Verdict:* The seed is not rotten. It's a classic "trolley problem" variant wrapped in speculative metrology. It works as fiction because the uncertainty mirrors the philosophical uncertainty. The constraint "philosophy should be carried by machinery... not dialogue" is challenging but achievable. I will proceed with writing the story.

