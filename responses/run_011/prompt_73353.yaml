      *   **Tone:** Analytical, precise, respectful of the strict standards, mirroring the narrator's voice (scientific, observational, slightly weary but intrigued).

  2.  **Deconstruct the 8 Verdicts (The Data):**
      *   *Case 1 (House Floor Deposit):* Accepts "deliberate, patterned, non-utilitarian." Rejects "what it was for" (meaning/ritual specific). *Key:* Context is sealed/primary.
      *   *Case 2 (Plough-disturbed):* Rejects "deliberate patterning." *Key:* Context is disturbed/secondary.
      *   *Case 3 (Midden/Cattle):* Rejects "ritual feasting." Accepts "large-scale consumption." *Key:* Practical explanation (eating) suffices; ritual is an added layer not proven.
      *   *Case 4 (Large Building/Forelimbs):* Accepts "communal structure/patterned gatherings." Rejects "temple." *Key:* "Temple" implies specific religious meaning/function beyond just gathering + pattern.
      *   *Case 5 (Infant Graves):* Accepts "ascribed rank/institution." Rejects "belief." *Key:* Social structure is inferable from material inequality; belief is internal/hidden.
      *   *Case 6 (Pottery Style):* Rejects "migration/ethnicity." Accepts "shared practices/exchange." *Key:* Material spread $\neq$ people spread or identity spread.
      *   *Case 7 (Ethnographic Analogy):* Accepts analogy shows *possibility* (deposits can be produced by rite). Rejects analogy *naming* the rite (continuity not proven). *Key:* Analogy licenses mechanism, not specific identity.
      *   *Case 8 (Clay Figurines):* Accepts "repeated domestic practice of breaking." Rejects "mother goddess/toy." *Key:* Silence of the record applies equally to all specific meanings.

  3.  **Synthesize the Rule (The Hypothesis):**
      *   *Observation 1 (Context):* Primary association is required for pattern (Case 1 vs. 2).
      *   *Observation 2 (Meaning vs. Behavior):* She consistently accepts *behavior* (breaking, gathering, depositing, ranking) but rejects *meaning* (ritual, temple, goddess, ethnicity, specific rite). She stops at "patterned behavior."
      *   *Observation 3 (Exclusion):* She rejects ritual when utilitarian explains it (Case 3), but accepts non-utilitarian when utilitarian is impossible (Case 1 - articulated skeletons, no butchery).
      *   *Observation 4 (Analogy):* Analogy proves possibility, not continuity (Case 7).
      *   *Core Principle:* It seems to be a combination of:
          1.  **Primary Association:** The finds must be in situ to claim pattern.
          2.  **Behavioral Ceiling:** Inference stops at observable *action* (breaking, depositing), never crosses into *intent/meaning* (worship, ritual, belief).
