          3.  **The Semantic Ceiling:** (Case 4, 5, 6, 8). Non-utilitarian $\neq$ Religious/Belief. It is only "patterned behavior." Ethnography licenses the *mechanism* (Case 7), not the *identity*.
      *   *Refining the Verdict:* She will accept "Specialized deposition of non-utilitarian items involving deliberate breakage." She will reject "The rite of [Name]" or "Continuity of belief."
      *   *Refining the Analog:* Case 7 is the critical constraint on the ethnography. Case 1 is the constraint on the deposit type. Case 7 is more specific to the *new* information (the later group).
      *   *Refining the Crucial Case:* Needs to test the limit of the "Meaning" prohibition. A contemporary text.

