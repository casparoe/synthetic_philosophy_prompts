      *   *The Conflict:* In Case 9, the ethnographic analogy is tempting. If the gap were *small*, would she accept the name? Case 7 says no ("much later date... refuses to let it name the rite").
      *   *The Differentiator:* We need a case where practical alternatives are excluded, context is primary, *but* the ethnographic record is contemporary or very close.
      *   *Wait, looking closer at the prompt's options:*
          1.  Association demonstrably primary.
          2.  Practical alternatives positively excluded.
          3.  Up to patterned behavior, stopping before meaning.
          4.  Single hypothesis accounts for several independent features.
      *   *In Case 9:*
          *   Primary? Yes.
          *   Practical Excluded? Yes (bird/wood).
          *   Behavior/Meaning? This is the crux. Does she accept "Ritual" as a behavior category, or is "Ritual" forbidden as a meaning category? In Case 1, she accepts "non-utilitarian." In Case 3, she rejects "ritual feasting." In Case 4, she rejects "temple." In Case 9, the ethnography calls it a "rite."
          *   If she accepts "Rite" based on the ethnography, she violates Case 7. If she rejects "Rite" entirely, she might be violating the "Practical Alternatives Excluded" rule (since 'ritual' is the only remaining explanation for non-food bird + broken figurines).
      *   *The Crucial Case:* A site where practical alternatives are excluded, context is primary, *and* there is a contemporary written record from the *same* culture describing the act.
      *   *Why?*
          *   If she accepts the meaning here, her rule is "Stop before meaning *unless* contemporary text exists."
          *   If she rejects the meaning here, her rule is "Never infer meaning/belief, only behavior," regardless of text.
          *   This distinguishes between "Meaning is unknowable" vs. "Meaning is unknowable *from material alone*."

  6.  **Drafting the Response:**
      *   *Voice:* Keep it clinical but reflective. Use the narrator's background (traces, causes) to frame the analysis.
      *   *Structure:*
          1.  Deduce the Rule (The Weighting).
