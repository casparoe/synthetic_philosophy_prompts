answer: |-
  The rule she is running is a weighted hierarchy, not a single switch. It pins down as follows:

  1.  **Contextual Integrity is the Gate:** Inference of *any* pattern requires primary association (Case 1 vs. 2).
  2.  **Utilitarian Exclusion is the Key:** A non-utilitarian category is licensed only where practical function is physically impossible (no butchery, non-food species, non-fuel wood), not merely improbable (Case 1 vs. 3).
  3.  **Behavior is the Ceiling:** Inference stops at *action* (breaking, gathering, depositing, ranking). It never crosses into *intent*, *belief*, or *identity* (temple, goddess, ethnicity, specific rite), regardless of how coherent the pattern (Case 4, 5, 6, 8).
  4.  **Analogy is Mechanism, Not Identity:** Ethnographic parallel licenses the *possibility* of a mechanism, but time gaps forbid the transfer of *meaning* or *name* (Case 7).

  **Verdict on the Cave**
  She will accept that this was a **specialized locus for the repeated, deliberate deposition of non-utilitarian objects involving standardized breakage.** She will reject the claim that this constitutes the *same rite* as the later group, and she will reject any label implying a specific religious belief (e.g., "shrine," "sacrifice," or the name of the later rite).

  **Closest Analog**
  **Case 7** is the decisive analog. While Case 1 establishes the validity of the deposit type (non-utilitarian, sealed), Case 7 dictates the treatment of the ethnographic link. The two-thousand-year gap with an absent intervening record mirrors the "much later date" in Case 7. That analog decides the verdict on the *name* of the practice: it licenses the physical act (breaking/offering) as a possibility, but forbids the identification of the specific cultural meaning or continuity.

  **Commitment**
  Either way, she commits herself to the existence of a **stable, transmitted technology of action.** She accepts that the *method* of breaking and depositing was conserved or independently reinvented with high fidelity, because the material constraints (break point, species, wood) are too specific for chance. She does *not* commit to the survival of the *belief system* that motivated it. If the pattern is real, the behavior survived; if the pattern is coincidental, the behavior is an illusion. But the *meaning* remains uncommitted in both outcomes.

  **The Crucial Case**
  To separate the rule "Stop before meaning" from the rule "Practical alternatives excluded," you need a case where **practical alternatives are positively excluded, context is primary, but a contemporary written record from the same culture explicitly states the belief.**

  *   If she accepts the belief in this case, her rule is: "Material alone cannot show meaning, but material + contemporary text can."
  *   If she rejects the belief even then, her rule is: "Archaeology infers behavior only; meaning is forever outside the trace."

  This case separates the limitation of the *medium* (sediment/sherd) from the limitation of the *discipline* (archaeology vs. history).
