          *   Up to level of patterned behavior, stopping before meaning? (Yes, Cases 1, 4, 5, 8).
          *   Single hypothesis accounts for independent features? (Maybe, but less explicit).
      *   *Best Fit:* It's a weighting. Primary association is the *gateway*. Excluding practical alternatives is the *filter*. Stopping before meaning is the *ceiling*.
      *   *The "Shape":* She commits only to **invariant conjunctions of action in primary context.** She infers *that* something was done deliberately, but not *why* (belief) or *what it signified* (identity/religion).

  4.  **Analyze Case 9 (The Cave):**
      *   *Facts:* Intact stratigraphy (Primary). 200 figurines, broken same point (Patterned). Bird remains (non-food), Charcoal (non-fuel) (Non-utilitarian/Excluded practical use). No domestic refuse (Specialized site). Later ethnographic record (2000 years later) describes breaking images + offering that bird.
      *   *Application of Rule:*
          *   *Primary?* Yes (intact stratigraphy).
          *   *Practical alternatives excluded?* Yes (bird not eaten, wood not fuel, no domestic trash).
          *   *Behavior vs. Meaning?* The ethnographic link is strong, but there is a 2000-year gap with absent record.
      *   *Prediction:* She will accept the **deliberate, patterned deposition of non-utilitarian items.** She will likely reject the specific identification of the rite based on the later group (Case 7 precedent). She will accept "ritual" only in the sense of "non-utilitarian patterned behavior," not as a specific named religion.
      *   *Closest Analog:* Case 7 is the strongest analog (ethnographic analogy with time gap). Case 1 is also strong (non-utilitarian deposit). Case 8 is strong (breaking figurines).
      *   *Decision:* Case 7 decides the ethnographic link (licenses mechanism, not identity). Case 1 decides the non-utilitarian nature.
      *   *Commitment:* She commits to the existence of a **specialized, non-domestic, repeated practice involving breaking and offering.** She does *not* commit to the continuity of the belief system or the specific name of the rite.

  5.  **Identify the "Crucial Case" (The Differentiator):**
      *   I need a case that separates the rules that agree here.
      *   *Agreeing Rules:* "Primary Association" and "Exclude Practical Alternatives" both point to accepting the pattern. "Stop before Meaning" points to rejecting the specific rite name.
      *   *Where do they diverge?*
          *   Rule A: "Practical alternatives excluded" (allows 'ritual' as a category if non-utilitarian).
          *   Rule B: "Stop before meaning" (forbids 'ritual' if it implies belief).
