          *   *Competence ($p > 0.5$):* This is the big one. The expert-rule advocate argues exactly that on complex issues, $p_{voter} < 0.5$. Asserting $p > 0.5$ without argument begs the question.
      *   **Classification:** It is an **unstated assumption about actual electorates** (specifically, that they satisfy the independence and competence conditions of the theorem). It is also a slight **equivocation** between "mathematical voters" and "citizens."
      *   **Does (8) follow?** No. The theorem (1) is mathematically sound. The argument for democracy doesn't have to collapse; it just needs to be modest (as the user intended originally). The collapse comes from the *reductio* (6) forcing a total surrender in (8).

