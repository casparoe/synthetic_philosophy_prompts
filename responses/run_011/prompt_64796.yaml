answer: |-
  To: The Jury
  From: The Chair
  Date: The 11th
  Re: The Memoist's Vision

  We meet on the fourteenth to decide the fate of six books. One of them requires us to clarify what we mean when the charter asks us to judge whether a book tells the truth about the life it recounts. Two of you have moved to exclude the memoir on the grounds that its central event—a vision at a deathbed—cannot be verified. Before we vote, I want to separate the threads of this objection so we know exactly what we are deciding.

  First, there are three different things we might mean when we say this book cannot be judged as nonfiction. We might mean we cannot assess the truth of the vision itself (whether God actually appeared). We might mean we cannot assess the truth of the book (whether the author is honest about her experience). Or we might mean we cannot rank it against books whose claims are checkable (how to weigh a vision against a history of policy). For your motion to exclude to succeed under the charter, you need the first meaning to invalidate the second. You are arguing that because the vision cannot be empirically verified, the book cannot be truthful. I do not think you have this. The charter asks about truth about a *life*, not truth about the world. A book can be perfectly honest about a delusion, or perfectly honest about a miracle. The verifiability of the event does not determine the honesty of the account.

  Second, consider the author's stance. She does not offer the vision as evidence for a theological claim, nor would she accept a natural explanation as a refutation. This tells us she is not making a hypothesis. She is reporting a hinge upon which her life turned. When we judge a book like this, we are not judging the truth of her propositions about God. We are judging the honesty of the account and its authority over the reader. We are asking: does this narrative cohere? Does the forgiveness of the brother feel earned within the logic of the life described? The prize has never had to name this distinction before, but we are judging the integrity of the narration, not the metaphysics of the event.

  Third, regarding the disagreement in this room. You do not contradict each other on facts. One of you says excluding the book protects the prize's integrity; the other says excluding it betrays the prize's purpose. This is not a semantic dispute about the word God. It is a disagreement about the boundary of our category. One view holds that nonfiction must be accountable to external verification; the other holds it must be accountable to internal coherence. A vote is the right instrument to settle what we *do*, but it is not the right instrument to settle what we *mean*. We must vote, but we should not pretend the vote resolves the conceptual tension.

  Fourth, the comparison with last year's winner holds. A memoir about the loss of faith relies on an internal shift that is no more checkable than a gain in faith. Both describe a change in the author's orientation toward the world. If we accepted the former as truthful reporting of a life, we cannot exclude the latter without changing the rules mid-game.

  I recommend we **shortlist the book with a citation stating what we are judging**. The citation should specify that we are honoring the rigor of the narrative account and the honesty of the life described, not validating the supernatural event. This allows us to keep the book without vouching for the miracle. It keeps faith with the charter's demand for truth about a life, rather than truth about a ward.

  The strongest version of the losing argument is this: state money requires state neutrality. By awarding a book that hinges on a miracle, we risk the public perception that the prize endorses religious claims as facts. This costs us political cover. It invites criticism that we have blurred the line between art and dogma. I accept this cost. I believe the greater risk is narrowing the definition of truth so much that it no longer fits human experience.

  We are here to judge how well a life is written, not to decide what is possible in the universe. If the account is honest and the life is true to the teller, the book has done its work. Let us judge the writing, and leave the rest to the reader.
