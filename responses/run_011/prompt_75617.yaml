answer: |-
  (1) **Established Concepts and Fit**
  There is no single established term in political science or ethics that captures this phenomenon without residual friction. The closest framework is **Institutional Corruption** (as defined by Lawrence Lessig), which describes systemic practices that undermine an institution's purpose even if no individual law is broken. However, Lessig's work focuses primarily on monetary influence in legislation, not the micro-accumulation of relational debt in administrative discretion. **Clientelism** captures the exchange of favors but typically implies a vertical hierarchy (patron-client) and often involves material resources or votes, rather than horizontal network maintenance among peers. **Street-Level Bureaucracy** (Lipsky) acknowledges the inevitability of discretion but treats the resulting inequity as a coping mechanism rather than a relational asset strategy. The fit breaks because existing terms either presume illegality (corruption), material exchange (clientelism), or psychological coping (bureaucracy), whereas your cases describe *lawful, relational, strategic accumulation*.

  (2) **Ranked Nearest Concepts**
  1.  **Clientelism:**
      *   *Money:* Usually requires material resources or votes; your cases use procedural priority.
      *   *Discrete Act:* Often relies on explicit agreements; your cases rely on implicit, accumulated understanding.
      *   *Explicit Bargain:* Usually explicit or strongly implied; your cases rely on social osmosis.
  2.  **Institutional Corruption (Lessig):**
      *   *Money:* Focuses heavily on financial dependence; your cases rely on social capital.
      *   *Discrete Act:* Focuses on systemic drift (fits well); does not require discrete illegality.
      *   *Explicit Bargain:* No bargain required (fits well).
  3.  **Conflict of Interest:**
      *   *Money:* Can be non-pecuniary (fits); but usually requires disclosure to be managed.
      *   *Discrete Act:* Applies to specific decisions; struggles to capture the *aggregate* bias.
      *   *Explicit Bargain:* No bargain required (fits); but assumes the interest is identifiable at the moment of decision.

  (3) **Coined Term and Definition**
  Since existing terms misfire on the "lawful aggregate" or "relational currency" constraints, I propose the term: **Accretive Partiality**.

  *   **Definition:** The systematic skewing of public service outcomes through the cumulative exercise of lawful discretionary powers, driven by the accumulation and expenditure of relational debt rather than pecuniary gain or explicit bias.
  *   **Conditions:**
      1.  **Individual Compliance:** Every discrete decision must be defensible under existing written rules.
      2.  **Aggregate Bias:** The distribution of favorable outcomes must statistically deviate from the eligible population toward a specific social network.
      3.  **Relational Currency:** The "gain" must be social capital (owed favors) reinvested in the network, not consumed personally as cash or status.
  *   **Boundary Cases (Excluded):**
      1.  **Ideological Favoritism:** A clerk who expedites files for co-ethnics to whom she owes no personal debt (fails Condition 3; this is discrimination, not accretive partiality).
      2.  **Standard Bribery:** A clerk who takes cash for a single expedited file (fails Condition 1 and 3; this is illegal corruption).
      3.  **Open Networking:** A clerk whose network is genuinely open to any applicant who joins a legitimate trade association (fails Condition 2; the queue remains permeable).

  (4) **Observable Signature**
  A reviewer can distinguish this from impartial generosity using a **Discretionary Concentration Ratio (DCR)**.
  *   **Measurement:** Map all instances of discretionary clause usage over a fixed period (e.g., 3 years). Cluster these instances by applicant identifier (address, business ownership, or prior interaction history).
  *   **Signature:** In an impartial office, discretionary usage will follow a Poisson distribution relative to application volume (random noise). In an office exhibiting Accretive Partiality, discretionary usage will show high kurtosis: a small cluster of applicants (the network) will account for a disproportionate percentage (e.g., >60%) of all discretionary invocations, despite representing a small fraction of total applications. The "queue data" will show that the *variance* in wait times is explained by network proximity, not hardship severity.

  (5) **Corruption Definition and Audit Bias**
  Your verdict depends entirely on the definition of corruption employed.
  *   **Formalist Definition (Deviation from Duty):** Under this definition, Accretive Partiality is **not corruption**. The clerk fulfills her duty to process files and document hardship. An audit mission using this definition risks appearing hostile to local norms, punishing efficiency that the community accepts as legitimate social insurance.
  *   **Normative Definition (Deviation from Public Trust):** Under this definition, Accretive Partiality **is corruption**. It violates the norm of equal access by converting public procedure into private currency.
  *   **Resolution:** Your methods paper should not presuppose the Normative definition. Instead, frame Accretive Partiality as a **Governance Risk**. It indicates that the *operative norms* of the office have decoupled from the *formal rules*. Whether this is "corrupt" depends on whether the community accepts the relational norm as a legitimate substitute for the formal rule. The audit should measure the *decoupling*, not just the illegality.

  Verdict: Accretive Partiality
