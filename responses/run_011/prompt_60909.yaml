answer: |-
  Dear Colleague,

  I have been thinking deeply about your request to translate Braudel's hierarchy of time into the vocabulary of econometrics, and I want to begin by acknowledging the precision of your unease. You are asking whether the ontological weight Braudel assigns to the longue durée can be captured by the statistical weight assigned to a low-frequency component in an unobserved components model, and your instinct that something is lost in translation is correct. To restate Braudel's strong claim in your language, we must move beyond the trivial observation that slow processes exist and confront his assertion that they possess a higher degree of reality and explanatory power. In econometric terms, this is not merely a claim about variance decomposition, where the trend component accounts for the largest share of the sum of squared errors. Rather, it is a claim about the structure of the data generating process itself. Braudel is arguing that the low-frequency component acts as a constraint on the state space of the high-frequency component. He is asserting that the conditional mean of the event series is dependent on the state of the conjuncture, and the conditional mean of the conjuncture is dependent on the state of the longue durée, but not vice versa. In your vocabulary, this implies a specific direction of Granger causality across frequencies and a form of heteroskedasticity where the variance of the high-frequency irregular term is bounded by the level of the low-frequency trend. He is claiming that the signal-to-noise ratio of the event series is so low relative to the trend that filtering out the high-frequency noise reveals the true structural parameters of the system, whereas focusing on the events yields only parameter instability. When he says the event is foam, he is saying it is a stationary process with a mean of zero conditional on the trend, while the trend itself behaves like a unit root or a near-unit root process that dictates the irreversible path of the system.

  However, when we look at the results of your exercise with the wheat prices and wages, the translation begins to fracture. Your first result, where the variance shares come out close to equal, suggests that if reality is measured by contribution to movement, Braudel is wrong. The dust carries as much energy as the tide. But this likely misinterprets his claim about reality as a claim about variance. A better statistical analog for Braudel's hierarchy would be persistence. If the event component is truly foam, it should exhibit rapid mean reversion, while the trend should exhibit high persistence. Yet your second result complicates this further. When you allow for structural breaks, the trend absorbs the variation, and the cyclical component vanishes. This implies that what Braudel calls the conjuncture might simply be a sequence of structural breaks misidentified as a cycle, or conversely, that the breaks themselves are large events that drive the trend. If the trend is punctuated by events, then the events are not merely surface noise; they are the mechanisms by which the structure changes. This inverts Braudel because it suggests the fast time scale drives the slow time scale, rather than the slow constraining the fast. Your third result, regarding the arbitrary bandwidth of the cycle, is perhaps the most damning for the econometric translation. If the spectral density is flat across the eight-to-twenty-five-year band, then the conjuncture is not a statistically identified feature of the data but a prior imposed by the researcher. This aligns with your colleague's suspicion that the levels are not separable, but it also suggests that Braudel's conjuncture might be a theoretical construct rather than an empirical regularity. The artifact you mentioned, where a measurement error loads onto the trend, serves as a stark warning that statistical structure does not guarantee ontological structure. A Kalman filter cannot distinguish between a structural transformation of society and a change in accounting units; it only sees a shift in the level of the series.

  This brings us to the residue report, which is the heart of your inquiry. What survives the translation is the idea that high-frequency noise has low predictive power for the long-term state of the system. The anti-event thesis holds up if interpreted as a claim about the signal-to-noise ratio of narrative history; events are poor predictors of the future state of the variables because they are transient shocks. However, the claim that geography constrains rather than merely changes slowly is distorted. In your vocabulary, a constraint is a boundary condition or a parameter restriction, whereas a slow trend is simply a path with low volatility. A trend can be reversed; a geographical constraint cannot. By modeling the longue durée as a local linear trend, you have rendered it mutable, whereas Braudel treats it as nearly immobile. Furthermore, the idea that a component is structural in a sense stronger than persistent is lost. In econometrics, structure is defined by stability over time, but for Braudel, structure is defined by its capacity to limit human action. A variance decomposition can tell you how much of the movement is due to the trend, but it cannot tell you whether that trend is a prison or merely a path. The claim that one time scale is more real than another cannot be stated in a language of components and filters because reality is not a parameter to be estimated. It is a philosophical commitment about what counts as an explanation. Your vocabulary is descriptive and observer-indexed; it tells you how the data behaves under a specific model specification, but it is silent on explanatory priority. A variance decomposition cannot answer Braudel's question because it assumes that all components are ontologically equal candidates for variance contribution, whereas Braudel begins with the axiom that they are not.

  This leads me to the verdict on the residue and the disagreement between you and your colleague. You incline toward the view that the defect lies in your vocabulary, which is descriptive and silent on explanatory priority, while she holds that Braudel's hierarchy was never a claim about the world but a rhetorical emphasis wearing metaphysical clothes. I believe the truth lies in recognizing that your vocabulary is not defective, but rather that it is category-inappropriate for the question Braudel is asking. Statistics is an epistemological tool; it tells us what we can know and how well we can fit a model to data. Braudel is making an ontological claim; he is telling us what exists and what matters. When you ask whether the slow carries the reality, you are asking a metaphysical question, and no amount of spectral density analysis can answer it because the data does not contain metadata about its own reality. However, your colleague is also partially correct that Braudel's hierarchy disappears when operationalized, but not because it is merely rhetorical. It disappears because operationalization requires separability and identification, assumptions that Braudel's holistic view of history explicitly rejects. Her objection that specifying three components with different frequency restrictions assumes the levels are separable is methodologically sound. If the data generating process is nonlinear or if the components interact multiplicatively, then a linear unobserved components model is misspecified by definition. By forcing the data into additive components, you have already decided that the levels are distinct entities that can be summed, which begs the question against Braudel's view of history as a totality.

  Can this disagreement be settled? I do not think it can be settled empirically, because the core dispute is not about the fit of the model but about the interpretation of what the model represents. If you refine the model to allow for time-varying parameters or Markov-switching regimes, you might better capture the structural breaks, but you will still be left with the problem of labeling one regime as more real than another. If you adopt a Bayesian approach and impose strong priors on the smoothness of the trend to reflect Braudel's immobility, you are simply encoding his philosophy into the prior distribution, not testing it against the data. The disagreement persists because you are looking for empirical validation of a philosophical stance, while your colleague is looking for philosophical coherence in an empirical method. The residue is not a defect in your vocabulary, nor is it proof that Braudel was merely rhetorical. It is evidence that there is a gap between the logic of statistical inference and the logic of historical explanation. Statistics deals in correlations, persistence, and variance; history deals in meaning, constraint, and agency. Braudel's claim that the choice of time scale is a philosophical commitment is the one claim that survives intact, because it acknowledges that the modeler chooses the lens through which the data is viewed. Your exercise shows that different lenses yield different variance decompositions, which vindicates Braudel's warning that the choice of scale is not stylistic but constitutive of the history you write. Ultimately, your vocabulary cannot check Braudel's doctrine because the doctrine is not a hypothesis about the frequency content of a series, but a hypothesis about the nature of historical causation. You can show that events have high variance, but you cannot show that they are less real, because reality is not a function of variance. The disagreement between you and your colleague cannot be settled because you are arguing about whether a map is the territory, and while she is right that the map is not the territory, you are right that the map you were given does not contain the contours you were asked to find.
