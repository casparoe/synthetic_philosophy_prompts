answer: |-
  ### The Scenario

  Elena, a freelance grant writer, knows from experience that her motivation collapses after 8 PM. On Monday morning, she plans to write a crucial proposal Tuesday night. Aware of her future slump, she signs a contract: if she doesn't upload the draft by midnight Tuesday, $300 is automatically donated to a political party she actively dislikes. She is a sophisticate; she knows Tuesday night she will desperately want to go to a friend's birthday dinner instead, and she knows the $300 penalty will feel less daunting in the moment than it does now. Tuesday arrives with no new information—no emergencies, no changes to the grant terms, no illness. At 9 PM, the dinner invitation arrives as expected. Elena calculates: the immediate enjoyment of the dinner plus the sting of the donation still outweighs the effort of writing and the delayed gratification of the grant. She judges that going to dinner is, all-things-considered, the better option for her *right now*. She pays the penalty and goes to dinner.

  ***

  ### 1. The Arithmetic

  **Parameters:**
  *   **Discounting:** Quasi-hyperbolic ($\beta$-$\delta$). $\delta = 1$ (for simplicity), $\beta = 0.5$ (present bias).
  *   **Timing:** $t_1$ (Monday Morning), $t_2$ (Tuesday 9 PM), $t_3$ (Wednesday Morning/Grant Decision).
  *   **Values (Utility Units):**
      *   Writing Effort ($t_2$): $-100$
      *   Grant Success Reward ($t_3$): $+800$
      *   Dinner Enjoyment ($t_2$): $+450$
      *   Political Donation Penalty ($t_2$): $-300$

  **Perspective at $t_1$ (Planning):**
  *All future utilities are discounted by $\beta$.*
  *   **Option Work:** $\beta \times (\text{Effort} + \text{Reward}) = 0.5 \times (-100 + 800) = \mathbf{350}$
  *   **Option Dinner:** $\beta \times (\text{Enjoyment} - \text{Penalty}) = 0.5 \times (450 - 300) = \mathbf{75}$
  *   **Verdict:** Work is vastly superior ($350 > 75$). Resolution formed.

  **Perspective at $t_2$ (Temptation):**
  *Immediate utilities are undiscounted; future utilities discounted by $\beta$.*
  *   **Option Work:** $\text{Effort} + \beta \times \text{Reward} = -100 + (0.5 \times 800) = \mathbf{300}$
  *   **Option Dinner:** $\text{Enjoyment} - \text{Penalty} = 450 - 300 = \mathbf{150}$
      *   *Correction for Case Requirement:* To ensure she chooses Dinner (as per the scenario where she acts on current judgment), the Dinner value must exceed Work. Let's adjust the Dinner Enjoyment to **+460**.
      *   **Revised Option Dinner:** $460 - 300 = \mathbf{160}$. (Still lower than 300).
      *   *Wait, I need the flip.* The penalty is immediate at $t_2$. The Grant reward is future.
      *   Let's re-calibrate to ensure the flip happens *because* of $\beta$.
      *   **Re-Calibration:**
          *   Work Effort: $-200$ (Immediate)
          *   Grant Reward: $+1000$ (Future)
          *   Dinner: $+400$ (Immediate)
          *   Penalty: $-350$ (Immediate)
          *   $\beta = 0.6$
      *   **$t_1$ (Morning):**
          *   Work: $0.6 \times (-200 + 1000) = 480$
          *   Dinner: $0.6 \times (400 - 350) = 30$
          *   **Plan:** Work ($480 \gg 30$).
      *   **$t_2$ (Night):**
          *   Work: $-200 + (0.6 \times 1000) = 400$
          *   Dinner: $400 - 350 = 50$
          *   *Problem:* The penalty is immediate, so it isn't discounted at $t_2$. The Grant is future, so it *is* discounted at $t_2$. This makes the penalty loom *larger* at $t_2$ relative to the reward than at $t_1$. This stabilizes the commitment. I need the temptation to loom larger.
          *   *Fix:* The Penalty must be future-dated or the Temptation must be disproportionately immediate.
          *   *Standard QH setup:* Penalty is paid *if* she fails. It is immediate upon failure.
          *   To get the flip, the *Temptation* must gain more from the $\beta$ release than the *Penalty* loses.
          *   Let's try: Penalty is paid tomorrow ($t_3$).
          *   **Final Calibration:**
              *   Work Effort: $-100$ ($t_2$)
              *   Grant Reward: $+600$ ($t_3$)
              *   Dinner: $+300$ ($t_2$)
              *   Penalty: $-250$ ($t_3$)
              *   $\beta = 0.5$
          *   **$t_1$ (Morning):**
              *   Work: $0.5 \times (-100 + 600) = 250$
              *   Dinner: $0.5 \times (300 - 250) = 25$
              *   **Plan:** Work.
          *   **$t_2$ (Night):**
              *   Work: $-100 + (0.5 \times 600) = 200$
              *   Dinner: $300 + (0.5 \times -250) = 175$
              *   *Still Work.* I need Dinner to win at $t_2$.
              *   Increase Dinner to $+350$.
              *   **$t_2$ Dinner:** $350 - 125 = 225$.
              *   **Flip:** Work (200) < Dinner (225).
      *   **Result:** At $t_1$, Work is best. At $t_2$, Dinner is best. She chooses Dinner.

  ### 2. The Verdicts

  *   **Davidson (Judgment-Based):** **No Akrasia.**
      *   **Why:** Davidson defines akrasia as acting intentionally against one's *all-things-considered (ATC) judgment at the time of action*. At $t_2$, Elena's discounted utility calculation shows Dinner (225) > Work (200). Her ATC judgment is "Dinner is better." She acts on this judgment. Therefore, she is not akratic; she is merely incontinent or changing her mind.
      *   **Hangs on:** The definition of ATC judgment as *current* evaluative stance.

  *   **Holton (Resolution-Based):** **Weakness of Will.**
      *   **Why:** Holton defines weakness as the *unreasonable revision of a resolution*. Elena formed a resolution at $t_1$ ("I will Work") specifically to resist the predicted $t_2$ inclination. She revised this resolution at $t_2$. The *only* reason for revision was the passage of time (the $\beta$-shift), not new information (no emergencies, etc.). Holton argues that time-passing alone is not a sufficient reason to abandon a resolution. Therefore, the revision is unreasonable, constituting weakness of will.
      *   **Hangs on:** The norm that resolutions should be stable against mere preference shifts caused by temporal proximity.

  ### 3. Which Feature Is Doing the Work?

  It is the **"No New Information" clause** combined with the **Resolution**.
  *   If new information existed (e.g., she got sick), both accounts would agree the revision is rational.
  *   By stripping away external reasons, we isolate the *will*.
  *   **Sophistication's Role:** It prevents the "Surprise" defense. A naive agent could claim, "I didn't know I'd feel this strongly." Elena *knew*. This strengthens Holton's verdict (she should have prepared better/stuck firmer) but complicates the Davidsonian verdict (she knew she'd change her mind, so was the $t_1$ judgment the 'real' one?). However, strictly speaking, Davidson prioritizes the $t_2$ judgment. The sophistication ensures the preference flip is endogenous (structural bias) rather than exogenous (error).

  ### 4. Ablations

  *   **(a) Remove Commitment Device:**
      *   **Result:** Collapses into **Bog-Standard Akrasia** for *both* accounts.
      *   **Why:** Without the penalty, the $t_2$ gap widens. More importantly, without the device, there is no explicit *resolution* mechanism to violate. Holton needs a resolution to call it weakness. Davidson still says "No Akrasia" (acting on current judgment), but the case becomes less interesting because there's no prior binding attempt to contrast with.
  *   **(b) Remove Sophistication (Make Her Naive):**
      *   **Result:** Collapses into **Sensible Change of Mind** (Holton) / **No Akrasia** (Davidson).
      *   **Why:** If she is naive, she genuinely believes at $t_1$ that she will want to work at $t_2$. When $t_2$ arrives, she discovers new information about her own preferences ("Wow, I really want dinner"). Revising based on new information is rational. Holton cannot call it weakness if the revision is reasoned by new data.
  *   **(c) Remove No-New-Information Clause:**
      *   **Result:** Collapses into **Rational Update**.
      *   **Why:** If a friend gets sick and needs help at $t_2$, revising the plan is rational. Both accounts agree this is not weakness/akrasia. The split *only* survives when the only change is the agent's temporal location.

  ### 5. The Best Attack from the Davidsonian Side

  **The Redescription:** "Elena did not actually judge Dinner best *all-things-considered* at $t_2$."
  *   **The Move:** The Davidsonian argues that an ATC judgment must include *all* normative reasons, including the reason provided by the prior resolution itself. If the resolution provides a normative reason (e.g., "I promised myself"), and she ignores it, she is acting against her ATC judgment, even if her *hedonic* calculation favors Dinner.
  *   **Why It Bites:** It reclaims the territory for Davidson. If the resolution counts as a reason in the $t_2$ calculus, and she overrides it, she is akratic by Davidson's own lights.
  *   **How to Block It:** You must stipulate that for Elena, at $t_2$, the reason provided by the resolution *has no weight*. Her ATC judgment is purely evaluative based on her *current* preferences. To block the attack, emphasize in the scenario that she reflects on the resolution and explicitly judges it *no longer binding* ("I know I promised, but that promise doesn't apply given how I feel now"). This makes the revision of the *authority* of the resolution part of the judgment, shielding her from the "acting against judgment" charge.

  ### 6. The Honest Bit: Is $\beta$-$\delta$ Load-Bearing?

  **Yes, but only as a formal guarantor.**
  *   Any model of **time-inconsistent preferences** would do the same job (e.g., Ainslie's hyperbolic discounting, or simple "visceral factors").
  *   However, $\beta$-$\delta$ is useful here because it cleanly separates *preferences* (which flip) from *information* (which stays constant).
  *   If you used a model where preferences only change due to new information, the case collapses (see Ablation C).
  *   So, the machinery isn't decoration, but it doesn't have to be *exactly* $\beta$-$\delta$. It must be a model where **time itself changes value rankings without changing the world.**

  ***

  ### Feasibility Check: The Sophistication Trap

  You asked me to flag if the spec is jointly satisfiable regarding the Sophisticate constraint.
  *   **The Worry:** If Elena *correctly predicts* at $t_1$ that at $t_2$ she will prefer Dinner (225) over Work (200), can she genuinely form a resolution to Work? Intention is often thought to require a belief that the action is possible/likely.
  *   **The Fix:** She predicts her *preferences*, not her *actions*. She knows she will *want* Dinner. She resolves to *choose* Work *despite* the want. The resolution is an attempt to add a new reason (the intention itself) to the $t_2$ calculus that wasn't there in the prediction.
  *   **The Risk:** If she is *fully* sophisticated and rational, she knows the resolution won't add enough weight (since we calibrated the numbers so Dinner wins). She should anticipate the failure.
  *   **Verdict:** The case holds if we allow that **forming a resolution is a distinct capacity from predicting preferences.** She knows the *temptation* will win on utility, but she resolves anyway, hoping the *act of resolving* tips the scale. The tragedy of the case is that the resolution *fails* to tip the scale. This is consistent with Holton's view that resoluteness is a skill that can fail. It does not break the case, but it requires students to accept that one can intend to $\phi$ while predicting a high probability of failure (a "hopeful intention").
