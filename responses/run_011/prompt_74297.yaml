answer: |-
  1. Both signatories agree that in the Windfall Case (one thousand people at well-being 100, where half receive a treatment raising them to 200 while the other half remain at 100, with no negative externalities), the resulting unequal outcome is better all-things-considered than the equal status quo.

  2. Both signatories agree that the Leveling Down Objection distinguishes telic egalitarianism from prioritarianism only on the condition that telic egalitarianism admits leveling down is better in *some* respect (even if worse all-things-considered), while prioritarianism denies it is better in any respect whatsoever.

  3. Both signatories agree that operationalizing either view requires a cardinal measure of well-being, and that disputes regarding the privileged zero-point and unit of this measure are substantive rather than merely notational.

  4. Disagreements Table:
  | Issue | Prioritarian Statement | Egalitarian Statement | Status (Genuine/Verbal) |
  | :--- | :--- | :--- | :--- |
  | **Normative Force** | A value that never tips an all-things-considered judgment is explanatorily idle and normatively inert. | A value can be genuine even if it only contributes a *pro tanto* reason that is frequently overridden by competing values. | **Genuine** on normative structure; **Verbal** on the definition of "value" (whether "value" requires potential decisiveness). |
  | **Scale Dependence** | Any concave weighting function requires a fixed zero; this is acceptable because well-being has a natural zero-point (e.g., neutrality). | Equality comparisons are invariant under monotone rescaling; prioritarianism is arbitrarily sensitive to measurement stipulations where equality is not. | **Genuine** (disagreement on whether well-being has a natural zero and whether scale sensitivity is fatal). |
  | **Leveling Down** | If equality is valuable, leveling down must be better in some way; since it is not better in any way, equality is not intrinsically valuable. | Leveling down is better in one respect (equality) but worse in others (well-being); the objection conflates *pro tanto* betterness with all-things-considered betterness. | **Verbal** on the phrase "better in some way" (whether it implies *any* moral reason vs. a decisive one); **Genuine** on whether the "respect" is coherent. |

  5. Crux 1 (Windfall Case): The Telic Egalitarian commits to the following prediction regarding the Windfall Case: The intrinsic badness of the inequality generated (500 at 200, 500 at 100) could *never* outweigh the total well-being gains to the受益 half, regardless of how small the gains are, because equality is never the sole value; OR, the Egalitarian commits that there exists *some* threshold of gain size below which the equality loss would outweigh the gains. (Select one): [ ] The equality loss could never outweigh the gains. [ ] The equality loss could outweigh the gains if the welfare increase is sufficiently small.

  6. Crux 2 (Rescaling Case): The Prioritarian commits to the following prediction regarding the Rescaling Case: If the well-being scale is shifted (changing the zero-point) while preserving the ordinal ranking of lives, the prioritarian ranking of two outcomes could flip; OR, the Prioritarian commits that the ranking is invariant because the zero-point is fixed by the nature of well-being. (Select one): [ ] A change of welfare scale could flip the ranking (admitting scale dependence). [ ] A change of welfare scale could not flip the ranking (asserting a privileged zero).

  7. Conditions for Defeat and Debate Progress: The Prioritarian counts their view as defeated if it is demonstrated that well-being lacks a natural zero-point and that scale-dependent rankings lead to arbitrary moral judgments in standard cases. The Egalitarian counts their view as defeated if it is demonstrated that the notion of "better in one respect" is logically incoherent or fails to explain any distinctive patterns of rational regret or complaint. Both agree that the debate would move forward if the Egalitarian specifies a range of cases where equality outweighs welfare gains, or if the Prioritarian specifies the natural zero-point of well-being without circularity.

  8. Note to Facilitator on State of the Field: We acknowledge that it is settled consensus in the literature that telic egalitarians accept the Leveling Down Objection in the *pro tanto* sense while prioritarians reject it entirely. We acknowledge that it is settled that standard prioritarian formulations are sensitive to the choice of zero-point in cardinal welfare scales. We acknowledge that it is *live* and contested whether scale dependence is fatal to prioritarianism, whether well-being possesses a natural zero, and whether *pro tanto* values that never determine all-things-considered judgments are metaphysically coherent. We confirm that no citation or authority is invoked here to settle these live questions.
