  **Why?** She explicitly told you she intends to argue Moore's proof *works* because "Moore knows [the premises] rather than merely believes them." This is the hallmark of Dogmatism: the claim that perceptual knowledge is immediate and does not require antecedent justification of the faculty. If she were following Rule 1, she would have to concede that using vision to prove the world (which validates vision) is structurally identical to using a gauge to prove a gauge. Her refusal to answer the "eyes" question suggests she knows Rule 1 is a trap for her position, so she retreats to Rule 2.

