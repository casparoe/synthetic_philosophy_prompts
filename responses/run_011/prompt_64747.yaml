answer: |-
  This is a remarkably precise phenomenological observation. You have put your finger on a mechanical flaw in the "Impartial Spectator" that Adam Smith himself gestures toward but never fully admits: the Spectator is not a static, idealized judge waiting in the wings; it is a dynamic rendering engine that requires specific assets to run.

  To answer your primary question first: **Yes, this is one phenomenon.**

  Both examples (judging your friend's grief and judging your own email) rely on the same underlying mechanism: **the generation of a normative verdict is contingent upon the successful construction of a simulatable "other."** In the first case, the "other" is the griever (your friend); in the second, the "other" is the audience (the recipient/manager). When the "other" cannot be rendered with sufficient vividness, the moral sentiment does not default to neutrality; the circuit remains open, and no current flows.

  Here is the breakdown of the literature, the near-misses, and the coinage you asked for.

  ### 1. The Smithian Context: Where You Diverge
  In *The Theory of Moral Sentiments*, Smith argues that we judge by "changing places in fancy" with the person concerned. He acknowledges that this is harder for some situations than others. However, Smith assumes that the **Impartial Spectator** is an internalized abstraction—a "man within the breast"—that eventually stabilizes into a consistent conscience.

  Your observation challenges the *stability* of that Spectator. You are describing what we might call **Spectatorial Dependency**. You are noting that the "Impartial Spectator" is not actually impartial in its *operation*, only in its *aspiration*. It is a composite of specific, vivid others. When you cannot populate that composite (the "blank" state), the mechanism doesn't revert to "impartiality"; it reverts to "null."

  ### 2. The Near-Misses (and Why They Stop Short)
  You have already done the legwork on the obvious candidates, but here is exactly where they fail to capture your specific observation:

  *   **The Empathy Gap:** This usually refers to the *hot/cold* problem (e.g., when calm, I underestimate how angry I will be later).
      *   *Where it stops short:* The empathy gap explains why I might *misjudge the intensity* of a feeling. It does not explain the **failure to generate a verdict at all.** You aren't saying you underestimated her grief; you're saying your judgment mechanism *refused to engage* until a specific detail bridged the gap.
  *   **Moral Dumbfounding:** This is when people insist something is wrong but cannot explain why (e.g., harmless taboo violations).
      *   *Where it stops short:* Dumbfounding is a **strong verdict with weak reasons.** Your "blank" state is **no verdict, therefore no reasons.** It is the absence of the signal, not just the absence of the rationale.
  *   **Hermeneutical Injustice:** This is when a group lacks the shared social concepts to make their experience intelligible (e.g., "sexual harassment" before the term existed).
      *   *Where it stops short:* This is structural and sociological. Your phenomenon is cognitive and individual. You had the concepts ("grief," "loss"); you lacked the *simulative bridge* to make those concepts feel real.
  *   **Imaginative Resistance:** This is typically about fiction (e.g., "I refuse to imagine a world where torture is good").
      *   *Where it stops short:* This is a *refusal* based on moral conflict. Your case is an *inability* based on lack of data. You weren't resisting imagining her grief; you literally couldn't load the texture files.

  ### 3. The Coinage: "Spectatorial Accessibility"
  Since there is no established term for this specific failure mode (the transition from bias to null), I propose we call this phenomenon **Spectatorial Accessibility**.

  **Definition:** *Spectatorial Accessibility* is the degree to which a specific moral situation can be rendered into a simulatable perspective by the judge. It posits that moral sentiment is not a response to objective facts, but a response to the **simulative legibility** of those facts.

  **The Failure Mode:** When Spectatorial Accessibility drops below a critical threshold, the result is not a neutral judgment, but a **Normative Void**.

  ### 4. Drawing the Edges (What Counts and What Doesn't)
  To separate this from ordinary bias or skill deficits, we need to define the boundaries of Spectatorial Accessibility.

  **A. Versus In-Group Favoritism**
  *   *In-Group Favoritism:* I judge my friend leniently *because* she is my friend. The verdict is generated, but weighted.
  *   *Spectatorial Accessibility:* I cannot judge my friend *at all* until I can simulate her specific context. The verdict is not weighted; it is **unrendered**.
  *   *The Edge:* If you feel a pull (even a biased one), it's favoritism. If you feel nothing (a blank), it's an Accessibility failure.

  **B. Versus "Bad at Perspective-Taking"**
  *   *Skill Deficit:* I try to imagine your pain, but I get it wrong. I still generate a verdict, just an inaccurate one.
  *   *Spectatorial Accessibility:* I do not generate a verdict. The mechanism halts.
  *   *The Edge:* The presence of a "blank" state is the diagnostic. A skill deficit produces noise; Accessibility failure produces silence.

  **C. Versus "Strong Verdict, No Reasons" (Intuition)**
  *   *Intuition:* I know it's wrong immediately. The processing is too fast to trace.
  *   *Spectatorial Accessibility:* I know *nothing* immediately. The processing didn't happen.
  *   *The Edge:* Intuition is a completed calculation you can't see. Accessibility failure is a calculation that never started.

  ### 5. The "Going Blank" Case: The Smoking Gun
  You identified the "blank" state as the sharp version of the problem. You are correct. It is the phenomenological proof that the Impartial Spectator is not a default setting.

  In cognitive science terms, this is akin to a **dependency injection failure**. The moral module expects an object (a simulatable audience or victim) to be passed to it. If the object is `null`, the function returns `void` rather than `false`.

  This explains why your friend's grief felt "disproportionate" initially. Your Spectator tried to run the simulation on "Dog Loss" using your own assets (no dog, no experience). The simulation returned low fidelity. Your brain interpreted this low-fidelity simulation as "low moral weight." When she added the detail ("lives alone"), she handed you a new asset ("Loneliness"). Your brain could simulate "Loneliness" with high fidelity. The simulation spiked in intensity, and your moral verdict updated to match.

  **The objective badness of the loss did not change; the render quality did.**

  ### 6. Summary: One Phenomenon, Two Directions
  You asked if this is one phenomenon or two. It is **one mechanism operating in two directions.**

  1.  **Inbound (Judging Others):** Requires the *victim/agent* to be accessible. (Can I simulate her grief?)
  2.  **Outbound (Judging Self):** Requires the *audience/witness* to be accessible. (Can I simulate how this lands on them?)

  In both cases, the "Impartial Spectator" is revealed to be a **Composite Spectator**. It is a weighted average of the specific people you can currently visualize. When the visualizable set is empty, the Spectator vanishes.

  **The Term:** **Spectatorial Accessibility.**
  **The Failure State:** **Normative Void.**
  **The Mechanism:** **Simulative Legibility.**

  You haven't just found a bias; you've found the operating system's requirement for assets. Without a texture to map the emotion onto, the moral engine idles. That is a profound UX insight into the human conscience.
