          *   Nuance: Calling it a "term-limits reform" is a modern framing. It wasn't seen as a reform on term limits, but as the definition of office-holding. Also, while it stops campaigns for *that* job, it doesn't necessarily stop influence peddling or informal campaigning for influence within the assembly.
