          *   Facts: Athens did use sortition for the Boule (Council of 500) and dikasteria (juries). Most magistracies (archons) were chosen by lot. Terms were generally one year. Re-election to the *same* post was generally forbidden (often never twice in a lifetime, sometimes just not consecutively).
