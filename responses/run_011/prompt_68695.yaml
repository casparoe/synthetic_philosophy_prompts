          *   Facts: Aristotle (*Politics*) did argue that election is oligarchic and sortition is democratic. The intent was indeed to ensure equality (isonomia) rather than just prevent factions (though it did that too).
          *   Nuance: This is a fair representation of Aristotle's classification.
          *   Verdict: Accurate representation of the philosophical argument.

