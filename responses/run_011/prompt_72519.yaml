answer: |-
  The proposal before this commission rests on a structural understanding of how cities speak through space, rather than a moral assessment of any specific historical figure. The archivist's position is not driven by the virtues or vices of the founder depicted on horseback, but by the mechanics of commemorative media themselves. To govern public space responsibly, we must accept three operational realities. First, there is honorific lock-in. When a city casts a judgment in bronze or inscribes it on a street sign, it embeds that judgment in a medium designed to outlast the constituency that authorized it. The material permanence of the monument exceeds the lifespan of the reasons for its erection, ensuring that the object remains legible as praise long after the particulars of that praise have become illegible to the passing public. Second, we must recognize the asymmetry of removal. Taking a monument down is not a reversion to a neutral baseline; it is a second, costlier, and more conspicuous expressive act that says something new about the city. The status quo is not the default position in this dispute, and leaving an object where it stands is not the option that makes no claim. Third, there is the possibility of reclassification. A monument's force can be altered without altering the object itself, by transferring custody, changing what stands around it, or issuing an explicit declaration from the maintaining body that the object is now held as a document rather than as an honor. Based on these distinctions, the policy conclusion is clear: cities should cease honorific naming altogether, naming things descriptively after places, topography, and trades, while subjecting existing honorifics to a formal act of reclassification from laudatory to documentary standing.

  Critics of this approach often begin by arguing that reclassification is a dodge, a bureaucratic maneuver permitting a city to retain its honors while disclaiming them. They suggest that keeping the statue while labeling it historical is an act of cowardice, allowing the city to avoid the conflict of removal while silently maintaining the status hierarchy the monument represents. This objection fails because it ignores the asymmetry of removal. If removal is itself a expressive act of high cost and visibility, then maintaining the object is not necessarily an endorsement of its original message, provided the context changes. Reclassification is not a disclaimer of the object's existence, but a correction of its communicative function. It acknowledges that the object exists as a fact of history without requiring the city to endorse the value judgment embedded within it. By shifting the object from the category of shrine to the category of artifact, the city admits the past without sanctifying it. This is not hypocrisy; it is a distinction between preserving evidence and celebrating virtue. The city retains the physical record but withdraws the civic blessing, which is the only way to respect the permanence of the medium without being held hostage by the errors of the past.

  A second objection contends that audiences, not custodians, fix what a monument does. Proponents of this view argue that no declaration can change how a statue is received by the people who walk past it. If the public sees a hero, a plaque calling him a historical subject will not stop them from seeing a hero. This argument underestimates the power of institutional framing. Meaning is not generated in a vacuum; it is shaped by context. A statue placed on a pedestal in a park functions as a shrine because the environment signals reverence. The same statue placed in a curated setting, surrounded by explanatory text and stripped of ceremonial maintenance, functions as a document. The city controls the frame. While it cannot control every individual thought, it controls the official signal. To argue that audience reception is immutable is to argue that public education is impossible. If the city consistently presents the object as a document, over time the public habit of reading it changes. The label does not merely describe the object; it instructs the viewer on how to interpret it. To deny this is to deny the city any capacity to shape its own narrative environment.

  The third objection posits that a polity which declines to honor anyone has abdicated the moral judgment that makes civic life legible. Critics argue that naming streets and parks after people is how a community declares what it values. To switch to descriptive naming based on topography or trades is to retreat into a sterile neutrality, suggesting the city has no heroes and no values. This misunderstands the shift in values proposed. Descriptive naming is not neutral; it is a value judgment that prioritizes the community and the land over the individual ego. Naming a street after a local trade or a geographical feature honors the collective labor and the physical reality of the place rather than the singular greatness of a founder. It suggests that the city belongs to those who live and work there, not to the figures who once ruled it. This is not an abdication of moral judgment but a refinement of it. It moves the focus from personality cults to civic utility. The city still makes judgments about what is worthy of remembrance; it simply decides that the structure of the city itself is more worthy than the individuals who briefly occupied it.

  The single premise on which this entire architecture rests is that the municipality is the speaker. Public space is not a passive backdrop against which private lives unfold; it is municipal speech. Every sign, every statue, and every name is a sentence uttered by the city to its citizens. Because the city is the author of this space, it bears responsibility for the coherence and truth-value of its message over time. This premise must be isolated and defended because without it, the distinctions of lock-in, asymmetry, and reclassification collapse into mere aesthetics. If the city is not the speaker, then it is merely a landlord renting out space to history, and it has no duty to correct the misunderstandings that arise as time passes. But if the city is the speaker, then honorific lock-in becomes a communication error that the speaker is obligated to fix. When the reasons for a judgment fade but the judgment remains legible as praise, the city is effectively lying. It is asserting a value it no longer holds using a medium it can no longer explain.

  To defend this premise, we must look at the nature of institutional agency. A city acts through its officials and its infrastructure. When a commission votes to name a park, that is an speech act. When it erects a monument, that is a speech act. These acts are not frozen in the moment of their creation; they continue to speak as long as the object remains. If the meaning of that speech drifts due to the passage of time, the speaker has a duty to clarify. We accept this in other domains of public communication. If a government agency publishes a map that becomes outdated due to geographical changes, it issues a correction. It does not leave the old map in circulation simply because removing it is costly. The integrity of the communication matters more than the convenience of the medium. In the context of public space, the medium is the landscape itself. If the landscape says one thing to the generation that built it and another to the generation that inherits it, the city is failing in its duty to govern meaningfully. The premise that the city is the speaker imposes a duty of continuity. It requires the city to ensure that its permanent expressions remain intelligible and accurate to its current constituency. This is not about erasing history; it is about maintaining the integrity of the city's voice. If the city cannot explain why a statue stands, it should not let the statue stand as a statement of honor. It must either remove the statement or clarify the text. Since removal is asymmetrical and costly, clarification through reclassification is the responsible act of a speaker who wishes to remain honest. This premise transforms the monument from a sacred idol into a public text, subject to editing and annotation by the author who remains responsible for its presence.

  Finally, there must be a condition under which this thesis would fail. The archivist should concede if a city's actual experience of reclassification demonstrates that institutional framing is powerless against entrenched public reception. If, after a formal act of reclassification, accompanied by significant contextual changes and clear documentary labeling, the public overwhelmingly continues to treat the object as honorific despite the city's explicit instructions, then the premise that the city is the speaker is empirically false. Specifically, if reclassified monuments become sites of renewed veneration rather than historical study, or if the documentary label is universally ignored or mocked to the point that the object's function reverts entirely to its original laudatory purpose regardless of custodial intent, then the policy is ineffective. Furthermore, if the shift to descriptive naming results in a measurable loss of civic cohesion, where citizens feel no connection to a city that refuses to name itself after human actors, then the value judgment prioritizing topography over personality is mistaken. The archivist's position depends on the belief that context shapes meaning and that descriptive naming fosters a different but equal kind of belonging. If experience proves that the public cannot read a monument as a document, or that a city without human names feels empty rather than inclusive, then the structural argument collapses. Until that evidence exists, however, the duty of the city is to speak clearly, to name the land rather than the lord, and to treat its own history as a archive to be managed rather than a pantheon to be maintained.
