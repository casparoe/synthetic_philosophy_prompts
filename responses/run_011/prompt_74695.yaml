answer: |-
  # JOINT MEMORANDUM ON THE NORMATIVE SIGNIFICANCE OF COMMISSION AND OMISSION

  **Date:** October 24, 2023
  **Parties:** 
  *   **Signatory A (The Distinctionist):** Holds that the distinction between doing and allowing marks a real, non-derivative moral boundary.
  *   **Signatory B (The Reductionist):** Holds that the distinction tracks derivative variables (cost, causal history, entitlements) and possesses no independent moral weight.

  **Purpose:** To delineate the precise scope of our disagreement, isolate shared premises, identify the empirical and conceptual cruxes that sustain the dispute, and establish conditions under which either position would be undermined.

  ---

  ## I. SHARED PREMISES

  Both signatories affirm the following claims as the baseline for further inquiry:

  1.  **Explanatory Target:** The dispute concerns whether the *mode of agency* (commission vs. omission) functions as a **fundamental normative primitive** (Signatory A) or as a **heuristic proxy** for other morally salient variables such as cost of aid, prior causal involvement, and established entitlements (Signatory B). We agree that if the distinction is merely a proxy, it should vanish morally when the underlying variables are held constant.
  2.  **Confounding in Stock Examples:** We agree that standard thought experiments (e.g., the Trolley Problem, the Drowning Child) frequently fail to control for confounding variables. Specifically, "doing" cases often involve higher physical effort, greater psychological aversion, or clearer causal chains than "allowing" cases. We acknowledge that intuitions drawn from uncontrolled examples are insufficient to settle the debate.
  3.  **The Zone of Indeterminacy:** We agree that there exists a class of cases where the description of the event as "doing" or "allowing" is itself linguistically or metaphysically unstable, rendering the distinction inapplicable. We specifically cite:
      *   **Withdrawal of Treatment:** Disconnecting life support at a patient's request involves physical movement (doing) but is normatively categorized as allowing the underlying pathology to take its course (allowing).
      *   **Double Prevention:** Intervening to stop a third party from preventing a rescue (e.g., disabling a jammer so a signal can get through). Here, the agent physically acts, but the causal structure mimics "allowing a save."
      *   *Agreement:* In these zones, appealing to the doing/allowing distinction is circular or unhelpful. The debate must focus on "clear" cases where the physical distinction is unambiguous.

  ---

  ## II. RESIDUAL DISAGREEMENTS

  The following statements represent the core divergence. Each signatory accepts the other's statement as a fair characterization of their opposing view.

  **Signatory A (Distinctionist) asserts:**
  > "Even when cost to the agent, prior involvement, the number of victims, and the certainty of outcome are perfectly matched, bringing a harm about (commission) remains pro tanto worse than merely failing to prevent it (omission). This difference is not reducible to rights or costs; it is grounded in the moral significance of agency itself. To make the world worse is distinct from to let the world become worse."

  **Signatory B (Reductionist) asserts:**
  > "The intuition that commission is worse than omission is an artifact of uncontrolled variables. Typically, 'doing' involves initiating a new causal chain (which violates negative rights) while 'allowing' involves failing to continue one (which implicates positive rights). When we control for the cost of intervention and the pre-existing entitlements of the victim, the moral valence of commission and omission converges. The distinction does no independent moral work."

  ---

  ## III. THE CRUXES

  We identify three sub-questions. Settling any one of these would significantly shift the burden of proof. For each, we specify a test case and record our predictions regarding the other's response.

  ### Crux 1: The "Magic Switch" Intuition Pump
  **Question:** If all causal and economic variables are magically equalized, does the intuitive asymmetry persist?
  **Case:** *The Twin Buttons.* 
  *   **Scenario 1 (Doing):** You press Button A. This releases a toxin that kills one person. Cost to you: zero. Prior involvement: none.
  *   **Scenario 2 (Allowing):** You refrain from pressing Button B. If you do not press it, a pre-existing mechanism (unrelated to you) releases a toxin that kills one person. Pressing it costs zero. Prior involvement: none.
  *   **Constraint:** In both cases, your physical movement is identical (pressing vs. not pressing), and the causal certainty is 100%.
  **Predictions:**
  *   **A predicts B will say:** "These are morally equivalent. Any intuition otherwise is a cognitive bias."
  *   **B predicts A will say:** "Scenario 1 is impermissible; Scenario 2 is permissible (or less bad), solely because one is a killing and the other a letting die."

  ### Crux 2: The Rights/Entitlements Control
  **Question:** Is the distinction actually about *rights violations* rather than *doing/allowing*?
  **Case:** *The Contracted Lifeguard.*
  *   **Scenario 1:** A stranger pushes a swimmer under. You do nothing. (Allowing + No Duty).
  *   **Scenario 2:** You are the contracted lifeguard. You push the swimmer under. (Doing + Duty).
  *   **Scenario 3:** You are the contracted lifeguard. You see the swimmer drowning and refuse to throw the rope. (Allowing + Duty).
  **Predictions:**
  *   **A predicts B will say:** "Scenario 2 and 3 are equally wrong because the duty/entitlement variable is matched. The doing/allowing difference is irrelevant."
  *   **B predicts A will say:** "Scenario 2 is worse than Scenario 3, even though the duty is identical. The mode of agency adds extra wrongness on top of the duty violation."

  ### Crux 3: The Double Prevention Test
  **Question:** Does causal structure override physical movement?
  **Case:** *The Shield.*
  *   **Scenario:** A villain is about to shoot a victim. You shoot the villain's gun, jamming it. The victim lives.
  *   **Analysis:** You physically *did* something (shot a gun). But you *allowed* the victim to live by preventing the villain.
  *   **Prediction:**
      *   **A predicts B will say:** "This proves 'doing' is irrelevant; it's all about the outcome and causal flow."
      *   **B predicts A will say:** "This is a distinct category. It shows that 'doing harm' is the constraint, not 'doing' generally. It does not prove allowing is equivalent to doing harm."

  ---

  ## IV. LINGUISTIC VS. SUBSTANTIVE DISPUTE

  We acknowledge that a portion of our debate stems from the ambiguity of the word "doing."

  **The Verbal Dispute:**
  Signatory A sometimes uses "doing" to mean "any voluntary bodily movement." Signatory B sometimes uses "doing" to mean "being the primary causal origin of a harm." In cases like withdrawal of treatment, A calls it "allowing" (normatively) despite the movement, while B calls it "doing" (causally) despite the permission.

  **The Substantive Restatement:**
  To eliminate this verbal noise, we agree to retire the terms "doing" and "allowing" for the purpose of the remaining dispute. We replace them with the following substantive question:

  > **Revised Question:** "Is there a category of **Active Imposition of Harm** that carries greater negative moral weight than a category of **Passive Acquiescence to Harm**, even when the *cost to the agent*, the *certainty of the outcome*, the *rights at stake*, and the *causal necessity of the agent's intervention* are held strictly constant?"

  *   **Signatory A** answers: **Yes.** (The imposition itself is the wrong).
  *   **Signatory B** answers: **No.** (The wrong is fully explained by the rights/cost variables).

  ---

  ## V. FALSIFICATION AND UNDERMINING EVIDENCE

  We conclude by specifying what evidence would count against our respective positions and whether such evidence is obtainable.

  **For Signatory A (Distinctionist):**
  *   **Condition:** If it can be demonstrated that in every historical and cross-cultural instance where "Active Imposition" is judged worse than "Passive Acquiescence," there exists a confounding variable (e.g., higher cost, violation of a specific negative right, or prior causal responsibility) that fully explains the judgment.
  *   **Obtainability:** **Low.** Moral intuitions are theory-laden. It is difficult to prove a negative (that *no* case exists). However, if experimental philosophy consistently shows that when variables are controlled, the intuition vanishes among neutral observers, A's claim to a *non-derivative* truth is weakened.

  **For Signatory B (Reductionist):**
  *   **Condition:** If a case is produced where variables (cost, rights, causal history) are robustly matched, yet a stable, reflective moral consensus persists that Active Imposition is worse than Passive Acquiescence, and this consensus cannot be explained by evolutionary bias or heuristic error.
  *   **Obtainability:** **Medium.** This relies on the reliability of reflective equilibrium. If A can point to a specific case (e.g., The Twin Buttons) where B admits the intuition persists but dismisses it as "bias" without independent evidence of that bias, B risks making their position unfalsifiable. B must identify *which* derivative variable is doing the work in such cases. If none can be found, B's reductionism fails.

  **Signed,**

  _________________________ 
  (Signatory A)

  _________________________ 
  (Signatory B)
