      *   *Decision:* To ensure the lesson lands, I will use a "Deck of Decisions." 10 cards: 6 Win, 4 Lose. Shuffle, draw, replace? No, without replacement ensures exact 60%. With replacement is true probability. Let's use a bag with 60 white balls and 40 black balls. Draw, show, return. This guarantees the 60% EV without needing 1000 rounds.
      *   *Actually, simplest:* Just tell them the coin is biased 60/40. Use a real coin. If the variance is weird, acknowledge it in debrief. *Correction:* For a 75-min class, I need the result to be reliable. I will use a pre-generated sequence of H/T that matches the 60% probability closely (e.g., 9 Heads, 6 Tails in 15 rounds) but keep it hidden. I will simulate the flips using a hidden list so the class outcome is statistically representative. This is standard pedagogy for this demo.

