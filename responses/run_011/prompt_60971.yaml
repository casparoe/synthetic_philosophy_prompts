      *   *The Coin:* Needs to be visibly biased or trusted. I (the instructor) will flip. I need to guarantee the 60/40 split? No, that's fake. I should use a pre-determined list of outcomes to ensure the statistics hold, OR use a truly biased coin. A pre-determined list is safer for pedagogy to ensure the "Median collapses" moment happens. Let's use a pre-shuffled deck of cards (Red/Black) where 60% are Red. This guarantees the probability structure without lying.
