      *   **Prior Knowledge:** Expected Value (EV) basics. No logs, no advanced probability.
      *   **Duration:** 75 minutes.
      *   **Goal:** Demonstrate the difference between maximizing EV per round vs. maximizing long-term growth rate (Kelly Criterion logic, though not named as such initially).
