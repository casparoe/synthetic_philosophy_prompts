answer: |-
  # Lesson Plan: The Ergodicity Break (75 Minutes)

  ## 1. Learning Objective
  To demonstrate that maximizing Expected Value (EV) on individual bets can lead to certain ruin over a sequence of bets, whereas maximizing the geometric growth rate (Time Average) preserves capital and yields better long-term outcomes for the typical agent.

  ## 2. Materials & Setup
  *   **Tokens:** 24 envelopes, each containing 100 "Philosophy Chips" (colored paper squares or poker chips).
  *   **The "Coin":** Do not use a physical coin. Use a **Bag of Chances**. A cloth bag containing 60 White balls (Win) and 40 Black balls (Lose). Draw, show class, return, shuffle. This guarantees the 60% probability without relying on small-sample variance of a real coin.
  *   **Handout:** "Wealth Tracker Sheet" (see below). **Constraint:** The word "Optimal" does not appear. The 60% win rate is stated clearly.
  *   **Board:** Whiteboard divided into two columns: "Class Mean Wealth" and "Class Median Wealth."
  *   **Reward:** High-quality chocolate bars. Conversion happens privately at the end.

  ## 3. The Handout (Student Facing)
  > **DECISION TASK: SEQUENCE A**
  >
  > **Starting Wealth:** 100 Chips.
  > **The Game:** We will repeat a round 15 times (number subject to change).
  > **The Bet:** In each round, you may stake any number of Chips you currently hold (0 to All).
  > **The Odds:** We draw from the Bag of Chances (60% Win, 40% Lose).
  > *   **Win:** You gain Chips equal to your stake (1:1 payout).
  > *   **Lose:** You lose Chips equal to your stake.
  > **Carryover:** Your wealth carries forward. If you reach 0 Chips, you cannot bet further.
  > **Goal:** Maximize your final Chip count.
  > **Privacy:** Do not share your stake or wealth with neighbors.
  > **Note:** There is no single "correct" stake. Choose what fits your decision policy.

  ## 4. Round-by-Round Structure

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute envelopes. Explain rules. Emphasize privacy. Select 3 "Data Analysts" (see *Problem 1* solution). |
  | **10-40** | **The Game** | **15 Rounds.** <br>1. Students write stake on tracker.<br>2. Instructor draws from Bag (Win/Lose).<br>3. Students calculate new wealth.<br>4. *Every 5 rounds*, Analysts collect anonymous wealth counts to update Board Mean/Median. |
  | **40-50** | **Conversion** | Students place chips in a private box. Instructor notes final counts. Distribute chocolate based on tiers (see *Rewards*). |
  | **50-75** | **Debrief** | Analyze the Board. Connect EV vs. Growth. Address objections. |

  ## 5. Reward Structure (Avoiding Humiliation)
  To prevent public shaming of those who bust while maintaining incentive:
  *   **Tier 1 (0-50 Chips):** Participation bar (small square of chocolate).
  *   **Tier 2 (51-200 Chips):** Standard bar.
  *   **Tier 3 (200+ Chips):** Premium bar.
  *   **Collection:** Students drop their tracker sheet into a box. You hand them the chocolate based on the sheet without announcing the number to the class.
  *   **Why:** This decouples *survival* from *status*. Bustors get chocolate too, removing the sting of ruin, but the incentive to grow remains.

  ## 6. The Debrief: Mapping Moments to Theory

  **Step 1: The Board Reveal (50-55 mins)**
  Look at the whiteboard.
  *   **Observation:** The **Mean** wealth likely went *up* significantly. The **Median** wealth likely went *down* (possibly to near zero).
  *   **Concept:** This is the divergence of the *Ensemble Average* (Mean) and the *Time Average* (Median).
  *   **Question:** "If the Expected Value of every bet was positive ($0.6 \times 1 + 0.4 \times -1 = +0.2$), why did most of you lose money?"

  **Step 2: The EV Trap (55-60 mins)**
  *   **Logic:** EV says "Bet Everything." If you bet 100 Chips at 60% win rate, your EV is 120 Chips.
  *   **The Catch:** EV is linear. Wealth is multiplicative.
  *   **Visual:** Draw a tree. Show that one "Lose" in an All-In strategy wipes out the branch.
  *   **Takeaway:** Maximizing EV per round ignores the *sequence*. It assumes you can average out losses across parallel universes. You live in one timeline.

  **Step 3: The Growth Rate (60-65 mins)**
  *   **Logic:** To grow wealth over time, you must avoid the "absorbing barrier" of zero.
  *   **The Math (Simplified):** "You don't add gains; you multiply them. To maximize multiplication, you need a fraction that balances gain against the risk of shrinking your base." (Do not write the Kelly Formula explicitly yet, just the intuition).
  *   **Reveal:** Now you can use the word "**Optimal**." The optimal fraction for 60% win/1:1 payout is 20% (Edge/Odds).
  *   **Check:** Ask students who bet around 20% consistently to raise hands. They likely have the highest stable wealth.

  **Step 4: The Lucky Survivor (65-70 mins)**
  *   **Address the All-In Winner:** "Did anyone bet 100% every round and win?"
  *   **The Refutation:** If a student says yes, acknowledge their luck. "You survived the Russian Roulette. Does that mean Russian Roulette is a good wealth strategy?"
  *   **Point:** Outcome $\neq$ Decision Quality. A good decision maximizes success probability, not just lucky outcomes.

  ## 7. Handling the Three Problems

  ### Problem 1: The Busted Player (0 Wealth)
  *   **Risk:** Boredom and shame.
  *   **Solution:** Recruit them as **Data Analysts** at the start.
  *   **Role:** They cannot bet, so they are responsible for the Class Mean and Median. Every 5 rounds, they collect the current wealth counts (anonymously) from the class, calculate the stats, and update the board.
  *   **Benefit:** They remain central to the lesson. They see the Median collapse firsthand. It gives them a job that requires them to understand the aggregate failure, turning their loss into data for the philosophy.

  ### Problem 2: The Lucky All-Inner
  *   **Risk:** They claim the EV strategy works because they won.
  *   **Solution:** The "Sibling Test."
  *   **Script:** "You won. Congratulations. But imagine you have a younger sibling. Would you advise them to bet 100% of their savings on this same game? If you say no, you admit the strategy is flawed despite your win. You are confusing *survivorship* with *viability*."
  *   **Philosophical Hook:** This introduces the distinction between *risk* (known probabilities) and *uncertainty* (unknown survival of the strategy).

  ### Problem 3: The Final Round Effect
  *   **Risk:** If students know Round 15 is last, EV logic dictates All-In on Round 15 (no future rounds to protect).
  *   **Solution:** **Uncertain Horizon.**
  *   **Script:** Do not write "15 Rounds" on the handout. Write "Approximately 15 Rounds." At Round 14, say, "We have time for a few more." At Round 16, say, "One last one."
  *   **Why:** This forces them to treat every round as if there is a future. If they go All-In on Round 15 and you announce Round 16, they are bust. This punishes myopic EV maximization.

  ## 8. The Strongest Objection & The Missing Feature

  ### The Objection: "I Only Live Once"
  *   **Student:** "This game is about repeated trials. But in life, I don't get to repeat big decisions (choosing a major, having kids). I care about the *average over possible outcomes* (Ensemble), not the *average over time*. If I have a 60% chance of a great life and 40% chance of ruin, EV says take it. Why should I care about the Time Average?"
  *   **Your Reply:** "You are correct that for *one-off* decisions, EV is a strong guide. However, life is not one decision. It is a sequence of risks (health, career, investments). If you maximize EV on every single one, you increase the probability of hitting a 'ruin' state (death, bankruptcy, burnout) somewhere in the sequence. The Time Average matters because you carry your wealth (health, capital, reputation) forward. You cannot reset to 100 Chips after you die."

  ### The Missing Feature: Irreversibility
  *   **What the Game Cannot Reproduce:** In the game, ruin means "no more chocolate." In life, ruin often means "no more agency."
  *   **How to Supply It:** In the debrief, explicitly state: "In this game, if you bust, you become a Data Analyst. You are still here. In the real world, 'ruin' is often an absorbing state where you cannot make further decisions. The game is *ergodic* (you can theoretically play again next year). Your life is *non-ergodic* (you cannot reset). Therefore, the pressure to avoid ruin in life is actually *higher* than in this game. If fractional betting is safer here, it is mandatory there."

  ## 9. Instructor Cheat Sheet (The Math)
  *   **Win Prob ($p$):** 0.6
  *   **Lose Prob ($q$):** 0.4
  *   **Payout ($b$):** 1 (Even money)
  *   **EV per unit bet:** $0.6(1) + 0.4(-1) = 0.2$ (Positive)
  *   **Kelly Fraction ($f^*$):** $(p - q) / b = (0.6 - 0.4) / 1 = 0.2$ (20%)
  *   **Expected Growth Rate (at 20% bet):** $0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.02$ (Positive growth)
  *   **Expected Growth Rate (at 100% bet):** $0.6 \ln(2) + 0.4 \ln(0) \to -\infty$ (Certain ruin eventually)

  ## 10. Contingency: If the Median Doesn't Collapse
  If the Bag of Chances yields a lucky streak (e.g., 12 Wins in 15 rounds), the All-Inners might survive.
  *   **Pivot:** "Today the weather was good. But would you build a house without a roof because it didn't rain today? We are studying decision *policies*, not today's specific weather. The policy of All-Inning has a probability of ruin approaching 1 as rounds $\to \infty$. We simulated a finite slice, but the logic holds."
