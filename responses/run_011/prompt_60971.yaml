      *   *Lucky All-Inner:* Acknowledge luck. Ask: "Would you let your child play this strategy?"
      *   *Final Round:* Tell them "We have time for a few more" rather than "This is the last one."
      *   *Objection:* Ergodicity. The game cannot reproduce "non-ergodic" life risks perfectly (you can't reset your life). I need to supply that by hand in the talk.

  7.  **Refining the Materials:**
