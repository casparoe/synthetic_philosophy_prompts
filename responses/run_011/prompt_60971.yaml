  2.  **Deconstruct the Core Concept:**
      *   The core tension is between *Ensemble Average* (Expected Value) and *Time Average* (Growth Rate).
      *   EV says: If $P(win) > 0.5$ and payoff is even money (or better), bet everything every time.
      *   Growth Rate (Kelly) says: Bet a fraction (e.g., edge/odds) to avoid ruin and compound.
      *   The game needs a positive EV bet that leads to ruin if bet too aggressively (all-in).
      *   *Setup:* Biased coin? Or even money with high probability? Let's go with a biased coin where $P(win) = 0.6$ and payoff is 1:1.
          *   EV of betting \$1: $0.6(1) + 0.4(-1) = 0.2$. Positive.
          *   EV strategy: Bet 100%.
          *   Outcome of 100% strategy: Eventually hit a loss string -> Ruin.
          *   Outcome of Fractional strategy: Compounds growth.

  3.  **Design the Game Mechanics:**
      *   **Initial Endowment:** Needs to be divisible. 100 tokens is standard.
      *   **Rounds:** Needs to be enough for variance to show but fit in 75 mins. 15-20 rounds? Let's aim for 15 active betting rounds + setup + debrief.
      *   **The Bet:** "Heads you win the amount you stake. Tails you lose the amount you stake." (Even money).
      *   **The Edge:** The coin is weighted. $P(Heads) = 0.6$.
      *   **Staking:** Students write down stake (0 to Current Wealth).
      *   **Tracking:** They need a sheet to track wealth.

  4.  **Addressing the "Real Stakes" Constraint:**
      *   Cannot be cash (university policy/ethical issues).
      *   Cannot be public ranking (humiliation).
      *   *Solution:* Tokens convert to raffle tickets or a "grade bump" lottery.
      *   *Better Solution for Non-Humiliation:* A threshold system. Everyone above $X$ tokens gets a small prize (candy, extra credit point, raffle entry). Everyone below gets nothing (or participation credit). This decouples *relative* performance from *absolute* reward.
      *   *Refinement:* Let's use a "Course Credit Lottery." Tokens = Entries. But to avoid the "winner takes all" vibe, cap the entries per student. Or, simpler: Tokens convert to a probability of winning a *group* reward if the *class median* hits a target. No, that's too complex.
      *   *Best approach:* Tokens convert to raffle tickets for a few gift cards. *Crucial:* Emphasize that 1000 tokens isn't 10x better than 100 tokens in terms of utility, but for the game mechanics, it matters. To prevent humiliation: The conversion is non-linear or capped. Let's go with: "Tokens determine your chance in a draw. However, to ensure everyone leaves with something, everyone gets a participation treat. The top 3 get a bonus." Actually, the prompt asks to avoid public wealth ranking.
      *   *Revised Plan:* Tokens convert to entries in a raffle. *However*, to prevent humiliation, I will collect the sheets privately. I will announce aggregate stats (Mean vs. Median) without naming names. The payout is private.
      *   *Conversion:* 10 Tokens = 1 Raffle Ticket. Cap at 50 tickets per person to reduce variance between lucky/unlucky. This ensures the "lucky all-inner" doesn't dominate the raffle entirely if they hit the cap.
      *   *Wait, better:* Just make the tokens convertible to a small tangible reward (candy/chocolate) where more tokens = more chocolate, but distributed privately in bags. No public counting.

  5.  **Addressing the Specific Problems:**
      *   **Busted Players:** They have 0 tokens. They can't bet. They become "Observation Auditors." Their job is to track the Class Mean and Class Median on the board. This keeps them engaged and generates the data for the debrief.
      *   **The Lucky All-Inner:** Someone bets 100% every time and wins 15 times in a row ($0.6^{15}$ is small but possible). They will claim EV was right.
          *   *Counter:* In the debrief, calculate the probability of their survival. Show that while *they* won, the *strategy* kills almost everyone. Distinguish "outcome" from "process."
      *   **End-Game Effect:** If they know Round 15 is last, EV maximizers go All-In on Round 15.
          *   *Mitigation:* Don't announce the exact number of rounds beforehand. Or, add a "sudden death" round possibility. Or, accept it and use it in debrief (myopic vs. long-term). Let's suggest hiding the exact count or adding a random stop.
      *   **The "Single Life" Objection:** "I only live once, I don't care about the ensemble average."
          *   *Reply:* Ergodicity. In many life decisions (career, health), the time average *is* the ensemble average because you repeat similar risks. Also, ruin is absorbing. If you die (bust), you can't play.

  6.  **Drafting the Lesson Plan (Iterative refinement):**

      *   *Time:* 75 mins.
      *   *Setup (10 mins):* Handout, tokens, rules.
      *   *Game (30 mins):* 15 Rounds (2 mins/round incl. counting).
      *   *Data Aggregation (10 mins):* Auditors calculate Mean/Median.
