  **1. The Question**

  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1: The Dual Role of Independence**

  Consider a social choice scenario with four alternatives $\{A, B, C, D\}$ and nine voters divided into three blocs with the following strict ordinal preferences:

  *   **Bloc 1 (4 voters):** $A \succ C \succ B \succ D$
  *   **Bloc 2 (3 voters):** $B \succ A \succ C \succ D$
  *   **Bloc 3 (2 voters):** $C \succ B \succ A \succ D$

  **(a)** Calculate the social ordering produced by the Borda Count rule (assigning scores 3, 2, 1, 0 to the 1st, 2nd, 3rd, and 4th ranked alternatives respectively). Identify the winner. Now, suppose alternative $C$ is removed from the agenda (e.g., deemed ineligible). Recalculate the Borda scores for the remaining alternatives $\{A, B, D\}$ (assigning scores 2, 1, 0). Identify the new winner. Show your arithmetic clearly. **(5 marks)**

  **(b)** A candidate from a previous year submitted the following commentary on Arrow's Theorem in light of calculations such as the one above:

  > "This calculation confirms that the Independence of Irrelevant Alternatives (IIA) condition is implausible. First, IIA is unacceptable because it prevents the social ordering from reflecting how strongly or how marginally people prefer one alternative to another. Second, since the Borda rule is a perfectly reasonable method and it clearly violates IIA, Arrow's Theorem merely exhibits the inconsistency of a tendentiously chosen axiom set. Third, the practical question of which voting rule to adopt is therefore left untouched by the theorem; we simply discard IIA and use Borda."

  Evaluate this commentary. Specifically:
  1.  Assess the claim that IIA fails because it ignores preference intensity.
  2.  Assess the claim that the theorem is trivial because it includes a "tendentious" axiom.
  3.  Assess the claim that the practical problem is solved by discarding IIA.

  In your answer, you must explain the specific mathematical role IIA plays in the decisive-coalition proof and distinguish between *escaping the theorem* and *escaping the underlying normative problem*. **(20 marks)**

  ***

  **2. Model Answer**

  **(a) Borda Calculation**

  **Scenario 1: All four alternatives $\{A, B, C, D\}$**
  Scores assigned: 1st=3, 2nd=2, 3rd=1, 4th=0.

  *   **Bloc 1 (4 voters):** $A(3), C(2), B(1), D(0)$
  *   **Bloc 2 (3 voters):** $B(3), A(2), C(1), D(0)$
  *   **Bloc 3 (2 voters):** $C(3), B(2), A(1), D(0)$

  **Total Scores:**
  *   $A: (4 \times 3) + (3 \times 2) + (2 \times 1) = 12 + 6 + 2 = \mathbf{20}$
  *   $B: (4 \times 1) + (3 \times 3) + (2 \times 2) = 4 + 9 + 4 = \mathbf{17}$
  *   $C: (4 \times 2) + (3 \times 1) + (2 \times 3) = 8 + 3 + 6 = \mathbf{17}$
  *   $D: (4 \times 0) + (3 \times 0) + (2 \times 0) = \mathbf{0}$

  **Social Ordering:** $A \succ (B \sim C) \succ D$. **Winner: A**.

  **Scenario 2: Alternative $C$ removed $\{A, B, D\}$**
  Scores assigned: 1st=2, 2nd=1, 3rd=0.

  *   **Bloc 1 (4 voters):** $A(2), B(1), D(0)$
  *   **Bloc 2 (3 voters):** $B(2), A(1), D(0)$
  *   **Bloc 3 (2 voters):** $B(2), A(1), D(0)$ (Original: $C \succ B \succ A \succ D$)

  **Total Scores:**
  *   $A: (4 \times 2) + (3 \times 1) + (2 \times 1) = 8 + 3 + 2 = \mathbf{13}$
  *   $B: (4 \times 1) + (3 \times 2) + (2 \times 2) = 4 + 6 + 4 = \mathbf{14}$
  *   $D: 0$

  **Social Ordering:** $B \succ A \succ D$. **Winner: B**.

  **Result:** The social preference between $A$ and $B$ reverses solely due to the removal of $C$, demonstrating a violation of IIA.

  **(b) Evaluation of Commentary**

  The candidate's commentary identifies a genuine tension in social choice theory but misdiagnoses the source of the difficulty in all three claims.

  **Claim 1: Intensity and IIA**
  The candidate argues IIA is implausible because it ignores preference intensity. This is partially correct but conceptually imprecise. Arrow's framework assumes *ordinal* utility; the profile contains no information about intensity by definition. The Borda rule does not recover "intensity" in a cardinal sense; rather, it exploits the *global configuration* of rankings. By assigning points based on rank position, Borda implicitly assumes that the "distance" between 1st and 2nd place is comparable across voters and alternatives. The violation shown in part (a) is not about intensity, but about *clone-dependence* or agenda sensitivity. The removal of $C$ altered the relative point differential between $A$ and $B$ because $C$ was positioned differently relative to them in different blocs. Thus, the objection is not that IIA forbids measuring intensity, but that satisfying IIA restricts aggregation to local pairwise comparisons, preventing the rule from using the global rank information Borda utilizes.

  **Claim 2: Tendentious Axioms**
  The claim that the theorem is trivial because IIA is "tendentiously chosen" misunderstands the proof's architecture. IIA is not merely one inconsistent ingredient in a grab-bag; it is the load-bearing condition that licenses the profile constructions in the decisive-coalition proof. The proof works by showing that if a coalition is decisive for one pair, IIA allows us to construct profiles where that decisiveness spreads to all pairs, eventually identifying a dictator. Without IIA, we cannot isolate pairwise social choices from the rest of the agenda, and the contagion of decisiveness fails. Therefore, the theorem is not a discovery of an arbitrary inconsistency, but a rigorous demonstration that any rule satisfying Unanimity, Non-Dictatorship, and Universal Domain *must* violate IIA. Rejecting IIA is not dismissing a technicality; it is accepting that social choices between $A$ and $B$ may depend on the presence of $C$.

  **Claim 3: The Practical Question**
  The conclusion that the practical question is "left untouched" is the most dangerous error. Discarding IIA escapes the *theorem*, but not the *problem*. The theorem identifies a fundamental conflict between democratic ideals and rational aggregation. By adopting Borda (which violates IIA), we avoid dictatorship, but we incur institutional costs: the outcome becomes manipulable by agenda setters (as seen in part (a)) and susceptible to strategic entry of "clone" alternatives.

  There are two routes to escape the impossibility result, but neither dissolves the normative difficulty:
  1.  **Enriched Information:** Moving to cardinal, interpersonally comparable utilities (utilitarianism) allows us to bypass Arrow's ordinal framework. However, this requires making robust metaphysical and empirical claims about utility comparison that the ordinal framework deliberately avoided.
  2.  **Restricted Domain:** Assuming preferences are single-peaked ensures a Condorcet winner exists and majority rule satisfies IIA *on that domain*. However, this restricts the scope of the theorem to specific political contexts; it does not solve the problem for the Universal Domain required by the theorem.

  **Conclusion**
  The candidate treats the objection to IIA as settling the matter. A first-class analysis recognizes that rejecting IIA relocates the problem. We trade the risk of dictatorship for the risk of agenda manipulation and instability. Arrow's Theorem remains normatively potent because it forces us to acknowledge that no aggregation rule can simultaneously satisfy all desirable democratic properties without cost.

