      *(Self-Correction during drafting)*: I initially thought about calling Thesis 1 "Functionalism". But Functionalism is a broader theory. The maxim specifically implies *Causal Indiscernibility entails Identity*. I should phrase it that way.
      For Thesis 2, "Verificationism" is the historical label. I should use it but explain it simply.
