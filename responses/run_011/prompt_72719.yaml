  I also wanted to say what I am not going to say. I am not going to tell you that we all love animals, so let us find common ground. That is a lie. We are here because we disagree about something fundamental, and pretending otherwise would just make Saturday excruciatingly polite. The disagreement is an accounting problem. A beef steer eats grain that kills mice and voles in the field. A broiler lives a shorter, tighter life, but there are hundreds of them. Beef looks worse on field deaths; chicken looks worse on deliberate killing. Then there is the wild suffering outside the fence, which some of us think is the whole problem, and others think is a distraction.

  My brother has an argument I cannot dismiss. He says a steer on permanent pasture turns grass on marginal ground into food while killing almost nothing compared to plowed fields for lentils. He is not wrong about the ground. I genuinely do not know if he is wrong about the conclusion. We do not know how to weigh a mouse against a chicken. We do not know if an insect has anything it is like to be. But saying it is all uncertain is an insult to everyone here, because every single person in this room has organized their actual life around a bet on the answer. You would not be here if you had not already chosen a side in the dark. To suggest the bet does not matter is to say your life's work is a gamble, and I know it feels more like a vow.

  So why are we in the same building? It is not because we are all trying our best. It is because the question is too large for one hemisphere of this room to hold alone. If we only talk to people who agree with us, the math never balances. We need the friction. We need the person who sees the field mice to talk to the person who sees the steer.

  Now, I promise this is not a sermon, and I know how much everyone hates opening remarks that feel like a mission statement. I once sat through a three-hour strategic planning session where the only decision made was what kind of hummus to order, and I think we all agreed the roasted red pepper was too dry, so I have deep respect for your time.

  Here is what I need from you for Saturday. When someone across the room presents an argument that feels like an attack on your livelihood or your morality, do not check the math immediately. Do not look for the error in their numbers. Instead, ask them what that number costs them. Ask why that specific death matters more to them than the other one. We are not here to solve the arithmetic tonight. We are here to admit that the ledger is broken, and see if we can stand the weight of it together without looking away. If we can do that, maybe the numbers will not matter as much as the people holding them.

