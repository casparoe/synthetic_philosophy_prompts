answer: |-
  ### Part 1: Conceptual Triage (What to Drop vs. Keep)

  To fit a ninety-minute meeting and a two-page handout, you must strip the political theory down to operational switches.

  **Drop:**
  1.  **Restorative Justice Frameworks:** Too complex for laypeople to adjudicate in one sitting. It requires ongoing relationship-building, not a vote.
  2.  **Nuanced Genealogies of Harm:** The panel cannot trace indirect lineage of ideas. They must deal with direct causation (e.g., policy enacted vs. policy advocated).
  3.  **The "Great Man" Theory of History:** Do not debate whether the person "did more good than bad" in a global sense. Debate whether the *specific honor* remains functional.

  **Keep:**
  1.  **Function (Honor vs. Address):** This is binary and observable. It determines if the name *needs* to be judged at all.
  2.  **Contemporary Objection:** This is the only valid override to the "judging the dead" defense. It is a factual check, not a moral one.
  3.  **Standing Hierarchy:** Necessary to prevent the "crowd size" error the Council cited.
  4.  **The Endurance Clause:** This is the legal hook. It must be treated as a risk assessment, not a moral verdict.

  ***

  ### Part 2: The Procedure (The Two-Page Handout)

  **CIVIC NAMES REVIEW PANEL: DECISION FLOWCHART**
  *Complete this form in sequence. Do not skip steps. If a step returns "RETAIN," stop and draft the Statement of Reasons.*

  **STEP 1: THE FUNCTION TEST (Honor vs. Address)**
  *Question:* If we changed this name tomorrow, would it break navigation, mail delivery, or emergency response for current residents?
  *   **YES:** It is an **Address/wayfinding device**.
      *   *Action:* **RETAIN.** (Stop. Note: Cost of change outweighs honorific value).
  *   **NO:** It is an **Honor/Commemoration**.
      *   *Action:* Proceed to Step 2.

  **STEP 2: THE ANACHRONISM SHIELD**
  *Question:* Is the objection based on values that did not exist when the name was adopted?
  *   **YES:** Check: Did the named person's *own contemporaries* (peers, colleagues, rivals) object to this specific action at the time?
      *   **NO (Peers did not object):** The Anachronism Shield holds. **RETAIN.** (Stop).
      *   **YES (Peers objected then):** The Shield is broken. Proceed to Step 3.
  *   **NO (Values were held then):** The Shield is broken. Proceed to Step 3.

  **STEP 3: STANDING & WEIGHT OF TESTIMONY**
  *Record who has spoken. Check the highest category present.*
  1.  **Direct Descendants** of the named person OR **Direct Descendants** of those specifically harmed by the named person's actions. (Highest Weight)
  2.  **Institutional Custodians** (e.g., the Union, the School Board, the Church) that currently bear or manage the name. (Medium Weight)
  3.  **General Public/Residents** with no specific lineage or institutional tie. (Low Weight)
  *Rule:* A "Remove" motion cannot pass if Category 1 opposes it, unless Category 1 is absent *and* Category 2 unanimously opposes retention. If only Category 3 is present, "Retain" is the default unless harm is statutory (e.g., hate speech).

  **STEP 4: THE ENDURANCE CHECK (75-Year Rule)**
  *Question:* Will this name remain acceptable to the city for the next 75 years?
  *   **For Existing Names:** Is the controversy growing or shrinking? If growing, Retention is high-risk.
  *   **For New Names:** Does the nominee have unresolved allegations? Is the name descriptive or personal?
  *   *Action:* If the answer is "No" (High Risk of future controversy), you cannot **RETAIN** (existing) or **ADOPT** (new). You must choose **CONTEXTUALIZATION** or **REMOVE**.

  **STEP 5: DISPOSITION SELECTION**
  *Select one. You must meet the criteria.*
  *   **RETAIN:** Only if Step 1 = Address OR Step 2 = Shield Holds OR Step 3 = High Standing supports Retention AND Step 4 = Low Risk.
  *   **RETAIN WITH CONTEXTUALIZATION:** Only if the Panel agrees on the *exact text* of the marker today.
      *   *Sufficiency Test:* Does the marker explain *why* the person is controversial, or just *that* they are? It must explain the harm. If the text is vague, this option fails.
  *   **REMOVE:** Only if a **Replacement Name** is proposed and **Funding** is identified in the motion. (Ordinance Requirement). If no replacement is ready, this option is procedurally invalid.

  **STEP 6: VOTE**
  *Five votes required. Record the specific Step that was decisive for each member.*

  ***

  ### Part 3: The Four Unmeasurable Weighings

  You asked for the points where the procedure asks the panel to weigh the unmeasurable. These are the sources of potential inconsistency. You must require the *Written Statement of Reasons* to explicitly record how these were resolved.

  1.  **Severity of Harm vs. Public Benefit (Step 5)**
      *   *Problem:* How many saved infants (Renwick) equal one coerced sterilization? There is no metric.
      *   *Recording Requirement:* The Statement must quote the specific benefit cited and the specific harm cited. It must state: "The Panel weighed [Benefit] against [Harm] and found [Harm/Benefit] dispositive because..."
  2.  **Weight of Testimony (Step 3)**
      *   *Problem:* Does one descendant of the harmed outweigh 50 residents? The procedure says "Highest Weight," but doesn't quantify.
      *   *Recording Requirement:* The Statement must list the number of speakers in each Category (1, 2, 3) and explicitly state if Category 3 testimony was discounted due to the presence of Category 1.
  3.  **Sufficiency of Context (Step 5)**
      *   *Problem:* When does a plaque become a "way of not deciding"? One panel's "context" is another's "whitewash."
      *   *Recording Requirement:* The approved text of the marker must be attached to the Statement. The Statement must certify: "This text explicitly names the harmful action, not just the era."
  4.  **Endurance Prediction (Step 4)**
      *   *Problem:* Predicting 75 years is crystal-ball gazing.
      *   *Recording Requirement:* The Statement must cite the *trend* evidence used (e.g., "Petitions have doubled in 12 months" or "No objections raised in 50 years").

  ***

  ### Part 4: Written Statement of Reasons Template

  *To prevent Council reversal, this form must be filed with the decision.*

  **CASE ID:** ___________
  **DECISION:** [ ] Retain [ ] Retain + Context [ ] Remove + Replace

  **PRIMARY GROUND FOR DECISION (Check One):**
  [ ] Function Test (Address/Wayfinding)
  [ ] Anachronism Shield (No contemporary objection)
  [ ] Standing Hierarchy (Descendant/Institutional preference)
  [ ] Endurance Risk (Future controversy likely)
  [ ] Procedural Bar (No replacement name/funding)

  **WEIGHING STATEMENT (Required if "Remove" or "Context" selected):**
  *We weighed [Factor A] against [Factor B]. We determined [Factor A] was decisive because ___________________.*

  **DISSENTING VIEW (If any):**
  *Minority grounded their vote on Step _______.*

  ***

  ### Part 5: Case Applications

  Here is the procedure run on your three live matters.

  #### Case A: Hollis Renwick (Public Health Building)
  *   **Step 1 (Function):** Building name. Changing it does not break navigation. **Honor.** (Proceed).
  *   **Step 2 (Anachronism):** Colleagues resigned in protest *at the time*. **Shield Broken.** (Proceed).
  *   **Step 3 (Standing):** Petitioners are general residents/historians. Descendants of sterilized inmates are not organized/present. Institutional custodians (Health Dept) have not taken a position. **Weight:** Low (Category 3).
  *   **Step 4 (Endurance):** Eugenics is universally condemned. Acceptability is shrinking, not growing. **High Risk.** (Retain is unstable).
  *   **Step 5 (Disposition):**
      *   *Remove:* Requires replacement name + funding. Petitioners have not proposed one. **Procedurally Invalid.**
      *   *Context:* Can a plaque explain the sterilization campaign sufficiently? Yes.
      *   *Retain:* Fails Endurance check.
  *   **Procedure Verdict:** **RETAIN WITH CONTEXTUALIZATION.**
  *   **Reasoning:** While the Anachronism Shield is broken and Endurance is low, the "Remove" option is procedurally blocked by the lack of a funded replacement. The "Standing" of the harmed group is currently unorganized (Category 1 absent), preventing a mandatory removal based on descendant objection. The Public Benefit (infant mortality) is weighed against the Harm (sterilization); without a replacement, Context is the only lawful tool to mitigate Endurance risk.
  *   **Note to Adviser:** This goes against your removal preference. It prioritizes the *Ordinance's procedural constraint* (Replacement Funding) over the *Ethical imperative*. It exposes that without a replacement plan, Removal is impossible, regardless of the harm.

  #### Case B: Nora Kilbride (Statue)
  *   **Step 1 (Function):** Statue. **Honor.** (Proceed).
  *   **Step 2 (Anachronism):** Racial exclusion was contested by the excluded at the time, though perhaps not by her Union peers. **Shield Broken.** (Proceed).
  *   **Step 3 (Standing):** Institutional Custodians (Union/Federation) oppose removal (Category 2). Descendants of excluded workers not organized (Category 1 absent). Residents petition (Category 3). **Weight:** Medium (Category 2 opposes change).
  *   **Step 4 (Endurance):** Racial exclusion is not acceptable for 75 years. **High Risk.**
  *   **Step 5 (Disposition):**
      *   *Remove:* Union opposes. No replacement named. **Invalid.**
      *   *Context:* Plaque can explain the exclusionary rule.
  *   **Procedure Verdict:** **RETAIN WITH CONTEXTUALIZATION.**
  *   **Reasoning:** Institutional Standing (Category 2) outweighs General Public (Category 3) in the absence of Direct Descendants (Category 1). The Endurance risk is mitigated by Contextualization explaining the exclusion.
  *   **Note:** This highlights a flaw: Organized institutions can shield harmful history if the harmed group is unorganized.

  #### Case C: New Pedestrian Bridge
  *   **Step 1 (Function):** **Honor.** (Proceed).
  *   **Step 2 (Anachronism):** N/A (New name).
  *   **Step 3 (Standing):** Living Councilmember (Subject of allegations). Teacher (Deceased). Workers (Historical). Descriptive (None).
  *   **Step 4 (Endurance):**
      *   *Councilmember:* Living + Unadjudicated Allegations = **Extreme Risk.** (Fails 75-year test).
      *   *Teacher:* Deceased 4 years. Unknowns possible. **Medium Risk.**
      *   *Workers:* Historical fact. **Low Risk.**
      *   *Descriptive:* **Lowest Risk.**
  *   **Step 5 (Disposition):**
      *   *Councilmember:* **Reject.** (Endurance failure).
      *   *Teacher:* **Acceptable** but lower endurance than collective/descriptive.
      *   *Workers/Descriptive:* **Preferred.**
  *   **Procedure Verdict:** **ADOPT COLLECTIVE DEDICATION (Workers) OR DESCRIPTIVE.**
  *   **Reasoning:** The Endurance Clause acts as a veto on the Living Councilmember due to reputational risk. Between Teacher and Workers, Workers offers higher historical stability (1911 event vs. 4-year reputation).

  ***

  ### Part 6: Limitations & Critique

  **What this procedure cannot do:**
  1.  **It cannot fix the "Replacement Trap":** As seen in Case A, the requirement to fund a replacement in the same motion effectively vetoes removal unless a wealthy donor or department is already lined up. This privileges the status quo. The procedure exposes this, but cannot solve it without an ordinance amendment.
  2.  **It cannot manufacture Standing:** In Case B, the procedure validates the Union's voice over the unorganized descendants of excluded workers. It routinizes the power imbalance. It will get this "wrong" in terms of restorative justice, but "right" in terms of procedural consistency.
  3.  **It creates "Consistency without Substance":** By forcing the panel to tick boxes (Step 1, Step 2), two panels can reach the same conclusion (Retain + Context) for opposite reasons (one due to Standing, one due to Lack of Replacement). The Written Statement of Reasons mitigates this, but only if the Council actually reads them.
  4.  **It routes "Hard Cases" to the Council by design:** If the panel is deadlocked on the "Weighing Statement" (Part 3, #1), they will likely default to Context. This pushes the substantive moral conflict to the Council on appeal. This is a feature, not a bug: it preserves the panel's lay status.

  **Where to expect appearance of consistency without substance:**
  The **Endurance Check (Step 4)**. One panel may interpret "75 years" as "Will this offend anyone?" (Veto everything). Another may interpret it as "Will this be historically irrelevant?" (Keep everything).
  *   *Containment:* You must draft an **Appendix for the Panel** that defines "Endurance" strictly as "Reasonable forecast of public controversy based on current trends," explicitly forbidding personal moral predictions.

  **Final Advice:**
  Your dissertation chapter on Renwick likely argues for removal based on the *harm*. This procedure argues for Context based on the *process* (Standing + Replacement Constraint). This is the tension of administrative law vs. political theory. If you present this procedure, you must be prepared to defend the "Replacement Trap" as a necessary fiscal constraint, even if it protects a eugenicist's name. The procedure is not a moral machine; it is a conflict containment system.
