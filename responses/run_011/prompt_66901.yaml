  **Joint Statement on Personal Identity and Fertility Medicine**

  **1. Agreed Claims**
  We, the undersigned, submit the following propositions as the common ground for our adversarial collaboration. We agree that:
  1.  **Biology:** Human conception typically involves the fusion of specific gametes, resulting in a zygote with nuclear DNA from two progenitors and mitochondrial DNA primarily from the egg provider, though trace amounts may persist from the sperm.
  2.  **Intuition Pumps:** Thought experiments involving swapped embryos or clones successfully isolate intuitions regarding genetic similarity versus numerical identity, but they do not independently resolve the metaphysical status of the origin.
  3.  **Verbal Disputes:** A significant portion of our disagreement concerns whether "personal identity" refers to a mind-independent metaphysical fact or a conceptual framework used to track persons across possible worlds.
  4.  **Practical Stakes:** Regardless of metaphysical resolution, clinics and parents face identical practical pressures regarding legal parentage, consent validity, and the psychological welfare of the resulting child.

  **2. Disagreements Table**
  The following table outlines the core divergences. Each row represents a single point of contention stated in language each side accepts as accurate to their own position.

  | Issue | Essentialist Formulation | Conventionalist Formulation |
  | :--- | :--- | :--- |
  | **Nature of Origin** | The specific gametes actually involved are necessary conditions for the existence of the resulting person. | The specification of "origin" depends on the descriptive framework chosen for the comparison. |
  | **Modal Truth** | Claims about who could have been born have truth values independent of human description. | Claims about who could have been born are true only relative to a chosen conceptual scheme. |
  | **Identity Conditions** | Identity is fixed at fertilization by the material constituents of the zygote. | Identity is fixed by the continuity of the life path we choose to prioritize. |

  *Note: No rows collapse into identical sentences; the divergence is substantive, not merely terminological.*

  **3. The Cruxes**
  We identify two sub-questions where settling the matter would shift our respective positions. We agree on which clinical cases bear on these cruxes.

  *   **Crux 1: The Locus of Necessity.** Does the necessity claim attach to the gametes themselves, or to the fertilization event and the resulting zygote?
      *   *Relevant Case:* (c) The Sperm Mix-up (same donor, different cell).
  *   **Crux 2: The Fact of the Matter.** Is there any fact about who a person could have been independent of how we describe the case?
      *   *Relevant Case:* (b) IVG from Skin Cells (no original egg involved).

  **4. Case Verdicts**
  For the following five clinical scenarios, we record our verdicts and reasoning in advance. Each verdict is one sentence; each reasoning is one sentence.

  **(a) Mitochondrial Donation**
  *   **Essentialist:** Same person. The nuclear DNA determines the essential origin, and the mother's egg remains the primary vessel.
  *   **Conventionalist:** Same person. The material alteration is too negligible to disrupt the continuity of the life path we track.

  **(b) IVG from Skin Cells**
  *   **Essentialist:** Different person. No original egg was involved, so the necessary material origin is absent.
  *   **Conventionalist:** Same person. The genetic source is the mother, so we describe this as the same child under a genetic continuity scheme.

  **(c) Sperm Mix-up (Same Donor)**
  *   **Essentialist:** Different person. A different sperm cell constitutes a different material origin, even if the donor is identical.
  *   **Conventionalist:** Same person. The genetic profile and donor identity are preserved, so we describe this as the same child for practical purposes.

  **(d) Identical Twins**
  *   **Essentialist:** Distinct persons. The splitting event creates two distinct zygotic histories, each with its own necessary origin.
  *   **Conventionalist:** Distinct persons. The divergent spatiotemporal paths after division establish two separate lives to track.

  **(e) Delayed Conception (One Cycle Later)**
  *   **Essentialist:** Different person. Different gametes would have been produced, altering the necessary material origin.
  *   **Conventionalist:** Same person. The genetic potential remains effectively identical, so we describe this as the same child under a genetic scheme.

  **5. Statement on Verbal Disputes**
  We acknowledge that if Crux 2 is resolved in favor of the Conventionalist, the Essentialist's claims become descriptions of a preferred conceptual scheme rather than metaphysical laws. Conversely, if Crux 2 is resolved in favor of the Essentialist, the Conventionalist's claims become errors about modal reality. Until then, we maintain our respective positions without concession.

  ***

  **Signed,**

  **[Name Redacted]** (Origin Essentialist)
  **[Name Redacted]** (Modal Conventionalist)
