  - **Bottom line** — The package is untenable as stated because Claim 5 directly violates the necessary conditions established in Claim 4. The deepest problem is the inconsistency between your criteria for extension (Glue and Trust) and your intuition about the diligent researcher, which undermines the coherence of your extensionism. Additionally, your commitment to semantic internalism in Claim 3 threatens the constitutive status of the notebook asserted in Claim 2.

  - **Genuine tensions, ordered by severity** — **Claim 4 vs. Claim 5 (Glue/Trust vs. Researcher):** This is a logical contradiction. Claim 4 establishes automatic endorsement as a necessary condition ("only if"), while Claim 5 describes a case lacking automatic endorsement (scrutiny and cross-checking) yet asserts it counts as extended. To resolve it, you must either deny the researcher is extended (sacrificing a compelling case for flexible extension) or relax the "only if" in Claim 4 (sacrificing your bulwark against cognitive inflation).

      **Claim 2 vs. Claim 3 (Belief Constitution vs. Internal Content):** Claim 2 asserts notebook entries *are* beliefs, while Claim 3 asserts belief content is fixed *entirely* by internal states. If content is purely internal, the notebook entries cannot be constitutive of the beliefs themselves, only causal aids to internal beliefs; beliefs are individuated by content, so if content is internal, the belief is internal. You must surrender either the constitutive status of the notebook (retreating to coupling) or semantic internalism (allowing content to depend on external factors).

      **Claim 1 vs. Claim 4 (Parity vs. Glue/Trust):** Claim 1 demands no difference based on location, but Claim 4 imposes constraints (automatic endorsement) that internal memory often violates, as we frequently scrutinize internal recollections. If internal scrutiny doesn't disqualify internal cognition, external scrutiny shouldn't disqualify extended cognition without violating Parity. You must either accept that internal cognition is narrower than thought or admit Claim 4 violates the spirit of Claim 1.

  - **Apparent tensions that dissolve** — **Claim 6 vs. Claims 1 & 2:** Denying extended phenomenology while accepting extended cognition is the standard vehicle externalist position; cognition and consciousness need not share boundaries, so limiting experience to the head does not contradict extending the mind. **Claim 7 vs. Claims 2 & 3:** Accepting neural localization is compatible with extended cognition if the brain is viewed as a hub in a larger system rather than the sole seat of memory; Claim 7 explicitly asserts consistency, and distributed systems can include localized neural components.

  - **The cheapest repair** — Change Claim 5 to state that the researcher's phone is *not* part of her memory, aligning it with Claim 4's strict criteria. This eliminates the logical contradiction with minimal textual change but leaves you vulnerable to the charge that your view is too conservative to capture modern cognitive practices, and it exacerbates the tension with Parity (Claim 1) since the researcher functions identically to Otto but is treated differently.

  - **The single highest-yield revision** — Replace the "automatic endorsement" requirement in Claim 4 with a broader condition of "functional integration and reliable access." This resolves the contradiction with Claim 5, eases the Parity tension in Claim 1, and preserves the intuition that the researcher is extended, though it requires you to develop a new bulwark against cognitive inflation.
