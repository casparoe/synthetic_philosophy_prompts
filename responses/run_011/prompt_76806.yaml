answer: |-
  **Capstone Proposal: Rational Deference and the Sunk-Cost Effect**

  **Research Question**
  Under what precise conditions does a past investment constitute admissible evidence for a project's value, such that continuing the project constitutes rational deference to a better-informed past self rather than a violation of decision-theoretic norms?

  **Theoretical Context and Gap**
  The received view in normative decision theory holds that sunk costs are irrelevant to current choice; because past expenditures cannot be recovered, they should not influence the marginal analysis of future benefits. When agents nevertheless allow these costs to dictate continuation, the standard explanations categorize the behavior as irrational. One family of views attributes this to psychological defects, such as loss aversion or framing errors, where the pain of realizing a loss distorts utility calculations. Another family treats the behavior as strategically rational only in a social context, where continuing a failing project signals resolve or reliability to other agents, thereby preserving reputational capital.

  Both approaches share a critical limitation: they treat the agent's own past investment either as a psychological cause (a bias) or as a signal to *others* (reputation). Neither treats the past act of investing as a source of *evidence* available to the agent regarding the *project itself*. There is currently no account that evaluates whether the fact of past commitment can rationally update an agent's credence in a project's success, independent of reputational effects or psychological error. This leaves open the possibility that what looks like a fallacy is actually a form of epistemic deference to a past self who possessed information the current self has lost, muddled, or discounted. My project fills this gap by constructing an evidential model of sunk-cost reasoning.

  **Methodology**
  I will employ conceptual analysis and decision-theoretic modeling rather than empirical experimentation or pure normative dismissal. Running psychological experiments would determine only *whether* people exhibit the effect, not *whether* it can be rational; the question here is normative, not descriptive. Conversely, simply demonstrating that the effect violates the standard norm against sunk costs would beg the question, as my aim is to test whether that norm is being applied correctly in cases of informational asymmetry between temporal selves.

  Instead, I will model the agent as a sequence of temporal selves. I will use light probabilistic notation to show how a past act $A$ can serve as evidence for a hypothesis $H$ (that the project is valuable) for a later self, specifically when $A$ was based on evidence $E_{past}$ that is not fully contained in the current evidence set $E_{now}$. This method allows me to isolate the specific informational conditions required for the reasoning to hold, distinguishing genuine evidential value from the standard fallacy.

  **Work Plan (11 Weeks)**
  *   **Weeks 1–2:** Refine the distinction between the three competing explanations (psychological bias, reputational signaling, and evidential deference). Draft the formal setup for the "temporal selves" model.
  *   **Weeks 3–4:** Develop the core argument: defining the "screening off" condition. I will establish that if current evidence fully accounts for the past decision, the past act provides no new information.
  *   **Weeks 5–6:** Apply the model to paradigm cases. I will contrast the "War" case (lives already spent) with the "Concert Ticket" case (non-refundable purchase) to test where the evidential link holds or breaks.
  *   **Weeks 7–8:** Address the primary objection: the "Redescription Worry." I will analyze whether making the cost evidential effectively means the cost was never truly sunk. This is the critical stress test for the thesis.
  *   **Weeks 9–10:** Draft the full paper, ensuring the argument fits the 5,000-word limit. Focus on clarity of the central distinction.
  *   **Week 11:** Revision and polishing. Check that the conclusion directly answers the research question without overclaiming.

  **Success and Failure Conditions**
  A positive result will look like a set of necessary and sufficient conditions under which honoring a sunk cost is rational. Specifically, I must show that the past investment correlates with the project's value *without* that correlation implying the cost is recoverable.

  The project will be deemed to have failed if I cannot solve the "Redescription Worry." If the only way to make the past expenditure evidentially relevant is to show that it predicts future returns directly (e.g., "I spent money because I knew it was good"), then I have merely redescribed the cases as ones where the cost was not sunk after all. If the cost is truly sunk, it must be unrecoverable; if it is truly evidence, it must track value. If these two properties are mutually exclusive in my model, the thesis collapses into triviality. I must demonstrate a scenario where the cost is unrecoverable *and* yet the fact of its expenditure remains informative about the future.

  **Scope and Ambition**
  The primary risk to this project is the 5,000-word limit. A full formal proof of the conditions for temporal self-deference would require significantly more space. To manage this, I will defer a rigorous treatment of Causal vs. Evidential Decision Theory to the background; I will assume the framework of Evidential Decision Theory for the sake of the argument rather than defending it against causal objections. Additionally, I will limit the case studies to two clear examples (War and Ticket) rather than attempting a comprehensive survey of behavioral economics literature. If the argument requires more space, I will cut the discussion of reputational signaling to focus exclusively on the epistemic relationship between the agent's past and present selves.
