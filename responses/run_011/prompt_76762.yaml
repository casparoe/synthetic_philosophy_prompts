answer: |-
  There is no principle that preserves every verdict you have listed without contradiction. Your collection contains a specific tension between **intrinsic capacity** (the dormant seed is alive despite doing nothing) and **relational state** (the virus is dead in a vial but alive in a cell). If life is an intrinsic disposition, the virus must be one or the other regardless of location. If life is a relational process, the seed's dormancy becomes problematic.

  To resolve this, I propose the **Principle of Encoded Autopoietic Closure**. This principle prioritizes the *structural organization* of the entity over its current activity or environment. It treats life as a specific kind of self-maintaining machinery that carries its own instructions.

  ### The Principle: Encoded Autopoietic Closure

  A system is alive if and only if it satisfies the following four clauses:

  **Clause 1: Genotypic Mediation**
  Replication must be mediated by a stored description (genotype/code) that is distinct from the machinery executing it (phenotype/hardware). The system must interpret the description to construct a copy, rather than growing by direct templating or crystallization.
  *   *Handles:* **Prion vs. Digital Organism/Cell.** Prions replicate by direct contact (crystal growth); they are the instruction and the machine in one. Digital organisms and cells separate code from processor. This resolves your trouble: the digital organism has an interpreter; the prion does not.
  *   *Handles:* **Engineered Microbe.** It possesses the machinery of genotypic mediation, even if the code is immutable. Evolution is a consequence of life, not a definition.

  **Clause 2: Autopoietic Boundary**
  The system must actively maintain a physical or logical boundary that distinguishes "self" from "environment," repairing or reconstructing this boundary using resources transduced from outside.
  *   *Handles:* **Candle Flame.** A flame has a boundary, but it does not *maintain* it via internal instruction; it is a passive dissipative structure determined by fuel and airflow. It lacks the "self-building" loop.
  *   *Handles:* **Dormant Seed.** The boundary and machinery are intact and *disposed* to resume transduction. Life is a capacity, not just a current activity.
  *   *Handles:* **Digital Organism.** It maintains a logical boundary (memory allocation) and transduces computational resources (CPU cycles), satisfying the clause substrate-neutrally.

  **Clause 3: Physiological Unity**
  The living individual is defined by continuous material or functional integration (shared cytoplasm, blood, or bus), not merely by cooperative behavior or communication between discrete units.
  *   *Handles:* **Ant Colony vs. Slime Mould.** The slime mould is a syncytium (one continuous cell membrane); the ant colony is discrete individuals signaling. The colony is an ecosystem, not an organism.
  *   *Handles:* **Sperm Cell.** It is a physiologically unified cellular unit, even if it cannot survive alone.

  **Clause 4: Intrinsic Capacity**
  The capacity for self-maintenance and replication must reside within the entity's own machinery, not be borrowed from a host.
  *   *Handles:* **Virus.** This is the clause that forces a correction to your verdicts (see below).

  ---

  ### Verdicts on New Cases

  **1. An organ kept functioning outside a body (e.g., a perfused kidney)**
  *   **Verdict:** **Alive, but not an organism.**
  *   **Reasoning:** It satisfies Clauses 2 and 3 (it maintains cellular boundaries and physiological unity). It fails to be an *organism* because it lacks the systemic closure to reproduce the whole, but like the sperm cell, its constituent tissues are living.

  **2. The Biosphere taken as a whole (Gaia)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** It fails Clause 2. A living system requires an environment to exchange matter and energy with to maintain negentropy. The biosphere has no "outside" environment to transduce resources from; it is a closed loop. It is a *system of life*, but not *a life*.

  **3. A synthetic protocell that replicates by templating but has no metabolism**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** It fails Clause 1 and Clause 2. Templating without an interpreter is prion-like (crystalline growth). Without metabolism (energy transduction), it cannot actively maintain a boundary against entropy; it is a chemical reaction, not an autopoietic system.

  ---

  ### The Cost: Verdicts You Must Abandon

  To maintain logical consistency with this principle, you must surrender two of your original verdicts.

  **1. The Contextual Virus (Fatal Conflict)**
  *   **Your Verdict:** A virion in a vial is not alive; the same virus in a cell is alive.
  *   **Required Abandonment:** **The virus is never alive.**
  *   **Why:** Clause 4 (Intrinsic Capacity) dictates that life is a property of the entity's machinery, not its location. A virus lacks the machinery for metabolism and boundary maintenance (Clause 2). When inside a cell, it is a *parasitic program* running on the cell's hardware. The *cell* is alive; the virus is an active pathogen. To say the virus becomes "alive" inside the cell is to confuse the *host's life* with the *parasite's activity*. You must accept that the virion is dead in the vial and dead in the cell, merely "active" in the latter.

  **2. The Digital Organism's Metabolism (Conceptual Tension)**
  *   **Your Verdict:** It "metabolises nothing."
  *   **Required Abandonment:** **You must acknowledge it transduces resources.**
  *   **Why:** Clause 2 requires resource transduction to maintain the boundary against entropy. If it truly metabolized *nothing* (no energy, no hardware wear, no memory allocation), it would be a mathematical abstraction, not a system. To keep it "alive," you must concede that it metabolizes *computational order* or *electrical energy*, even if not chemical. If you insist it uses *no* physical resources, it fails Clause 2 and must be classified as a simulation of life, not life itself.

  If you accept these two corrections, the principle holds together. If you refuse to abandon the "Virus in cell = Alive" verdict, you cannot have a consistent definition of life, because you are defining life as sometimes intrinsic (seed) and sometimes relational (virus).
