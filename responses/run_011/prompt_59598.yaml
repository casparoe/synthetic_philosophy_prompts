  ### Part 2: The Decision Tree

  **Instructions:** Start at Question 1. Answer based *only* on your intuition about the specific case described. Do not think about which theory you want to hold; just answer the case. Follow the branch until you reach a Leaf.

  **1. Case 7 (The Ranking):** When you rank the warm bath, the solved problem, and being understood, do you detect a single shared "ingredient" or feeling present in all three, however faint?
  *   **Yes:** Go to Question 2.
  *   **No:** Go to Question 6.

  **2. Case 4 (The Spring Mood):** In the undirected good mood, is the pleasantness a separate *part* of the experience (like a hum underneath the birdsong) or is it the *way* you are experiencing the birdsong (like hearing it clearly)?
  *   **It is a separate part:** Go to Question 3.
  *   **It is the way of experiencing:** Go to Question 5.

  **3. Case 3 (The Sad Song):** Can a feeling that hurts (like the devastation of the song) still count as this "ingredient" if it is intense enough?
  *   **No, pain and pleasure are distinct ingredients:** **Leaf A: Felt-Quality (Sensation View).** (Pleasure is a specific sensation, like a tickle; sadness is a different sensation.)
  *   **Yes, pain can be the vehicle for the ingredient:** **Leaf B: Felt-Quality (Hedonic Tone View).** (Pleasure is a global "glow" or tone that can overlay other sensations.)

  **5. Case 2 (Brain Stimulation):** In the brain stimulation case, if the subject cannot describe *how* it feels but presses the lever, is there still a "way of experiencing" happening that we just lack words for?
  *   **Yes, the mode exists even if unreportable:** **Leaf C: Adverbial View.** (Pleasure is a manner of experiencing, not an object. The subject is experiencing *pleasantly*, even if they can't say what.)
  *   **No, without reportable content there is no mode:** **Leaf A: Felt-Quality (Sensation View).** (Collapses back to needing a detectable quality.)

  **6. Case 7 Follow-up (Value Definition):** Suppose science proved that a state of feeling nothing (or even mild agony) was objectively the best thing for a person's wellbeing. Would you apply the label "pleasure" to that state?
  *   **Yes, if it's good for them, it counts as pleasure:** Go to Question 7.
  *   **No, pleasure must be identified before we call it good:** Go to Question 8.

  **7. Case 1 Reverse (Bad Pleasure):** Suppose you found something that felt exactly like the warm bath but science proved it was terrible for your wellbeing. Would you still call it "pleasure"?
  *   **Yes, the label sticks regardless of value:** **Leaf D: Value-First (Stipulative View).** (Pleasure is just a name for "whatever turns out to be intrinsically good." The feel is irrelevant.)
  *   **No, if it's bad, it wasn't real pleasure:** **Leaf D: Value-First (Stipulative View).** (Note: Both answers lead here. If you define pleasure by value, the feel doesn't constrain the label. D. sits here.)

  **8. Case 1 & 7 Combined (Concept Viability):** Given that we can't find a shared feel (Q1) and we won't define it purely by value (Q6), is the word "pleasure" too confused to be useful in philosophy?
  *   **Yes, we should stop using it and talk about specific emotions or sensations:** **Leaf E: Eliminativist.** (The concept is a folk-psychological mess. Scrap it.)
  *   **No, we can still save the concept:** Go to Question 9.

  **9. Case 1 (The Bitter Tea):** The person hates the taste but wants the tea. Is the activity "pleasurable" *solely* because they want to do it?
  *   **No, wanting it doesn't make it pleasurable (there must be some other link):** Go to Question 11.
  *   **Yes, wanting it is what makes it pleasurable:** Go to Question 10.

  **10. Case 5 (The Moment of Truth):** In the case where you wanted the experience to stop *in the moment* but love it *in retrospect*, was it pleasure *while it was happening*?
  *   **No, if you didn't want it then, it wasn't pleasure then:** **Leaf F: Motivational/Dispositional View.** (Pleasure is defined by the concurrent desire for more of the experience.)
  *   **Yes, your later endorsement can make it pleasure retroactively:** **Leaf G: Relational/Higher-Order View.** (Pleasure is an experience you hold a favorable attitude toward; that attitude can be reflective, not just immediate.)

  **11. Case 6 (The Sommelier):** The taste-blind sommelier reliably picks the same wine. Is there likely a hidden physical commonality in the wines (a chemical thread) that explains his choice, even if he can't name it?
  *   **Yes, there is probably a hidden structure linking these cases:** **Leaf H: Cluster/Family-Resemblance View.** (There is no single feature, but there are overlapping strands of similarity that bind the category.)
  *   **No, it might just be a brute list of unrelated things he happens to like:** **Leaf I: Disjunctivist View.** (Pleasure is a genuine disjunction. Case 1 is pleasure, Case 2 is pleasure, but they share nothing, not even overlapping strands. This is no problem for value theory.)

