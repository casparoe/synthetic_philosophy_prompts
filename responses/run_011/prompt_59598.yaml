  **Axis 1: Phenomenal Unity (Is there a "feel"?)**
  *   **Yes:** All pleasures share a specific qualitative character (a glow, a tickle, a tone).
  *   **No:** Pleasures are phenomenologically diverse (the taste of tea, the click of a proof, the relief of pain).

  **Axis 2: Normative Priority (Does Value define the Term?)**
  *   **Descriptive:** We identify pleasure first (by feel, desire, or attitude), *then* ask if it's good.
  *   **Normative/Stipulative:** We identify what is good for the subject first, *then* label it "pleasure." (This is D.'s move).

  **Axis 3: Structural Unity (If no "feel," is there a structure?)**
  *   **Single Condition:** There is one non-phenomenal thing they all share (e.g., being desired).
  *   **Cluster:** They share overlapping features without one necessary condition (family resemblance).
  *   **Disjunction:** There is no structure; "pleasure" is just a label for a list of unrelated items.
  *   **None:** The concept is broken (Eliminativism).

  **Axis 4: Temporal Authority (Who decides?)**
  *   **Concurrent:** The subject's attitude *during* the experience decides.
  *   **Reflective:** The subject's attitude *afterwards* can override the moment.

  **Empty or Unstable Cells:**
  *   **Normative + Phenomenal Unity:** If "pleasure" is defined by value, why insist on a specific feel? This view is usually incoherent or collapses into Normative Priority.
  *   **Disjunction + Structural Unity:** Contradictory by definition.
  *   **Eliminativist + Descriptive:** If you think the concept is broken, you usually don't offer a descriptive theory of it; you scrap it.
  *   **Cluster + Single Condition:** Contradictory.

  **Hard-to-Distinguish Pairs:**
  *   **Motivational vs. Relational:** Both rely on pro-attitudes. The tree attempts to split them via temporal authority (Case 5), but in practice, many "Motivational" theorists allow for reflective endorsement, blurring the line.
  *   **Cluster vs. Disjunctivist:** Both deny a single necessary condition. The distinction rests on whether there is *some* hidden overlap (Cluster) or *none* (Disjunction), which is empirically difficult to verify in a conversation.

