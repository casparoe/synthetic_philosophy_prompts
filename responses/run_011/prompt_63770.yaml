  **Brainstorming**
  Candidate mechanisms for composition shift: (1) Age structure transition (youth bulge vs. aging); (2) Urban-rural migration altering density-related risk exposure; (3) Sectoral employment shift (industrial vs. agrarian). I select **sectoral employment shift**. It suits a mid-century industrializing state, allows for clear risk stratification (factory vs. farm), and provides a mundane economic cause unrelated to violence levels. This enables me to isolate the composition artifact from the violence signal, satisfying the requirement that the shift not be caused by the violence itself (e.g., killers dying).

  **Scenario: The Republic of Ostral (1950–1970)**
  Ostral is a mid-century industrializing state with a competent statistical office. Between 1950 and 1970, Ostral's population doubled from 10,000 to 20,000. The economy shifted markedly from heavy industry to agriculture due to trade policy, moving workers from High-Risk Industrial Zones to Low-Risk Agrarian Zones. In 1950, 50% lived in Industrial Zones; by 1970, only 25% did. This shift is mundane, driven by subsidies, not violence.

