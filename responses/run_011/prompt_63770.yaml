  **Analysis**
  Switching codings flips the Standardized Rate verdict while leaving Count and Crude untouched. The feature doing the work is the **interaction between coding boundaries and high-risk subpopulations**. Reclassifying deaths in the High-Risk Industrial zone disproportionately lowers the standardized rate because the standard weights fix that zone at 50%, amplifying the rate drop.

  If the composition shift were caused by violence (e.g., killers fleeing industrial zones), the "mundane cause" requirement fails; the artifact becomes endogenous. A defender of the decline thesis would attack Coding B as **smuggling structural harm into violence** (labor disputes are accidents) or argue the standard population is **gerrymandered** (1950 weights ignore 1970 reality).

  **Conclusion**
  The case shows that **Standardized Rates** are convention-dependent on coding and weighting. **Absolute Counts** survive every admissible coding here (both rise), suggesting ontological robustness for the "volume" of violence, while "rates" remain fragile constructs dependent on boundary decisions. All three specifications are satisfied.
