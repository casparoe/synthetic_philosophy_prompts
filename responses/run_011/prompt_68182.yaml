answer: |-
  You mistake the indulgence I begged for in the *Theseus*, my friend. There, I dealt with kings turned to gods, with Minotaurs and labyrinths, where the truth is lost like a path in snow; I asked leave to sift the myth because no witness remained to contradict me. But you stand beside a fresh grave with letters in your hand and living witnesses in your city. You are not purifying fable; you are polishing a mirror. If you paint a face upon it that never looked upon the world, what man can recognize himself in it? Cut the expedition story. Burn it. Virtue built upon a lie is like a temple built on sand; it may look grand for a season, but when the winds of scrutiny come, it falls, and takes the man's reputation down with it. You cannot teach men to be good by showing them a ghost.

  As for the letters, do not hide them, but do not wield them like a dagger. My critic Herodotus sought to make men seem worse than they were to spice his tale; your editor seeks to make them better to soothe his readers. Both are flatterers, and both are liars. A life is not a statue to be admired from afar, but a companion to be walked with. If this scientist was generous yet cruel, show him so. A perfect man is not a model for living, he is a god, and we cannot imitate gods. Keep the letters, not to shame him, but to warn your readers that virtue is hard and even good men may fail in secret. That is the difference between my *Lives* and your editor's magazine: I seek to reveal the soul, not to sell a portrait.
