      *   The strongest philosophical move against the user's Step 6 is to challenge the definition of "Law" and the requirement for *long-term unconditional prediction* vs. *conditional/ceteris paribus prediction*.
      *   Step 2 is the most vulnerable. Does a law *require* the ability to predict the specific future state of a complex system? Or does it merely describe invariant relationships *ceteris paribus*?
      *   Step 5 is also vulnerable. Does the growth of *scientific* knowledge (Step 3) impact *all* social regularities equally? Demographic transitions might hold even if we don't know the next physics discovery.
