answer: |-
  Subject: Re: Sortition reading list and the transit assembly

  It is completely understandable that the literature feels like it is answering different questions, because it is. You have stumbled onto the central fracture in sortition theory, which is that people invoke the lot to solve problems that are often in tension with one another. To get a handle on what you should be demanding from an account of binding sortition, you need to separate the phenomena that any successful theory must explain from the ideological preferences that different camps smuggle in as necessities. Start with the phenomena you listed, because they are the guardrails. The reason you accept a random jury but not a random judge is that we distinguish between judging facts within a fixed framework and creating the framework itself. A jury applies shared norms to a specific case, whereas a judge writes the opinion that sets the precedent for future cases. If a body is to make binding decisions generally, it must either be restricted to applying existing will or it must undergo a transformation that legitimizes its creation of new will. This connects to your second point about deliberation. Sixty people voting on day one is just an opinion poll with extra steps. Sixty people voting after three weekends of testimony is a deliberative body. The legitimacy comes not from the selection method alone but from the process that changes their minds from private preferences to public judgments. Without that transformation, the lot is just a clumsy way to aggregate pre-existing biases.

  Then you have the executive problem. Nobody proposes sortition for the executive because execution requires energy, unity, and speed, whereas lots produce plurality, deliberation, and slowness. A randomly selected executive would lack the mandate to act decisively in a crisis and would have no clear line of accountability for failure. This points to the acceptance problem you noted. Losing sides accept election results because the losers know they had a chance to win and will have a chance to try again. They accept the result because they authorize the process, not necessarily the outcome. In a sortition system, if I am not selected, I need to know that the selected body acts in a way that I could have acted, or that I can remove them if they do not. This is why the stratification issue is so critical. Pure lottery means everyone has an equal chance of selection, but it does not guarantee the body looks like the population. You might get sixty people from one neighborhood by bad luck. Stratified sampling guarantees the body mirrors the census, but it requires sorting people into categories and topping up quotas, which is technically not a pure lottery anymore. It trades equality of opportunity for equality of outcome.

  This brings us to the desiderata you need to hold in your head. First, political equality, meaning every citizen has an equal probability of selection. Second, descriptive representation, meaning the body mirrors the demographic and social characteristics of the public. Third, epistemic quality, meaning the body is capable of reaching competent decisions. Fourth, accountability, meaning the public has a mechanism to sanction or remove the body. The squeeze you suspected is real and it is fatal to many accounts. You cannot have pure political equality and perfect descriptive representation simultaneously. A pure lottery relies on the law of large numbers to achieve representation, which works for a population of millions but fails for an assembly of sixty. To guarantee mirroring in a small group, you must manipulate the odds based on categories, which violates the principle that every individual has the exact same chance of selection as every other individual. Most literature hides this by calling stratified sampling random selection, but it is not. It is a quota system with a random element. You have to decide which value matters more: the fairness of the draw or the accuracy of the mirror.

  If you want the single requirement that does the most work in knocking out candidate accounts, it is the capacity for effective sanction. Many theories of sortition rely on the idea that random people will be virtuous or that the statistics will protect us, but they ignore the power dynamic. If a body can make binding decisions, it holds power over you. In an election, you sanction representatives by voting them out. In a sortition system, you cannot vote them out because you did not vote them in. Therefore, there must be an alternative mechanism for sanction, such as recall, referendum, or strict term limits that ensure rotation. If a theory of sortition cannot explain how the public retains the ultimate veto over the body's power, it fails. It might be fair, it might be descriptive, but it is not democratic because it severs the link between the ruler and the ruled. This is the lens you should use to evaluate your assembly. Even if their recommendations are not binding, if they claim to speak for you, you must ask how you can reject their claim if it violates your interests.

  Now apply this to your friend's proposal about the twelve-year term and the substitution rule. These are two distinct violations of the desiderata. The twelve-year term destroys the principle of rotation. The whole point of sortition in Athens was that everyone rules and is ruled in turn. A twelve-year term creates a separate class of citizens who hold power for a generation. This solves the expertise problem you mentioned, yes, but it creates an aristocracy. They stop thinking like amateurs because they become professionals. They develop interests distinct from the public, such as preserving their own seats or expanding their own power. Without the threat of rotation, the capacity for effective sanction is weakened because you cannot wait them out. They become entrenched. This trades democratic equality for technocratic stability, and for a binding body, that is a dangerous trade. It moves the design from a mini-public toward a second chamber of lords.

  The substitution rule is different but equally corrosive. It treats civic duty as alienable property. If I can nominate a substitute, I am effectively selling or gifting my political power to someone else. This violates the principle that the obligation to rule is personal and non-transferable. It introduces a selection bias where only those willing to serve long terms or those nominated by others will participate. Wealthy people might hire substitutes, or activists might pack the assembly with their nominees. It breaks the link between the random selection and the actual composition of the body. The random draw is supposed to ensure that the person sitting in the chair is there because of chance, not because they wanted to be there or were chosen by someone else. Allowing substitution turns the lot into a volunteer registry with extra steps. It keeps the appearance of sortition but loses the core mechanism that prevents self-selection bias.

  So when you sit in that transit assembly, remember that your current design is advisory, which sidesteps the hardest problem of binding power, but the logic still matters. You should demand that the deliberation process is robust enough to transform preferences, because that is the only thing that gives you epistemic authority. You should check whether the stratification used to select you was transparent, so you know if you are a mirror or just a sample. And you should be wary of any proposal that tries to make your role permanent or transferable. The legitimacy of a citizen assembly comes from its temporariness and its inescapability. You are there because you were chosen, and you will leave because your time is up. Anything that weakens those two boundaries risks turning a democratic experiment into an oligarchy of the willing. Good luck with the weekends, and trust your intuition that the fairness of the chance and the quality of the outcome are not the same thing, because holding that tension clear in your head will let you see when someone is trying to sell you one as the other.
