answer: |-
  **TO:** Programme Review Panel, Centres of Excellence Scheme
  **FROM:** [Your Name]
  **SUBJECT:** Opinion on the Renewal of the Centre for the Study of Cumulative Culture

  **Recommendation**
  I recommend **Conditional Renewal at reduced scale**, structured as a four-year funding block subject to a mandatory mid-term review, with the possibility of extending to the full seven years contingent on meeting specific criteria. This option balances the risk of supporting a potentially degenerating research programme against the strategic necessity of maintaining theoretical pluralism in the field.

  **The Appropriateness of Lakatosian Appraisal**
  We must address whether a funding council should employ Lakatosian vocabulary. The member arguing for full renewal is correct that science is not judged at a single moment and that degeneration is often only visible in hindsight. However, funding decisions are inherently momentary judgments of risk. We are not acting as philosophers of science determining truth, but as stewards of public capital managing a portfolio. In this context, the distinction between a *progressive* and *degenerating* problemshift is not metaphysical; it is a heuristic for viability. A programme that continuously adjusts its protective belt to accommodate anomalies without generating novel facts is a high-risk investment. We are justified in using this framework provided we apply it to the *trajectory of empirical output*, not the logical structure of the theory alone.

  **The Year 8 Payoff and the Year 11 Reply**
  The crux of my decision lies in distinguishing the Year 8 auxiliary claim from the Year 11 defence. Both involved introducing new assumptions to save the core thesis from counter-evidence. The Year 8 claim (learner insensitivity to physical affordances) was introduced to neutralise overimitation data, but it subsequently yielded a confirmed novel prediction regarding copying errors in corvids. This constitutes *excess empirical content*. It licensed the adjustment because it risked falsification and survived.

  The Year 11 reply (ambient scaffolding) differs critically. It was invoked solely to explain away a failed replication of the flagship Year 3 result. The Director concedes this defence is not independently testable as currently formulated. Unlike Year 8, Year 11 offers no novel prediction; it merely renders the core thesis immune to the specific test that failed. Therefore, the Year 8 success does not license the Year 11 defence. The former was a progressive shift; the latter is a degenerating one. A programme may survive a degenerating shift, but it cannot be renewed at full scale while resting on one.

  **The Strongest Case Against This Recommendation**
  I state this objection explicitly to ensure it is weighed against my proposal. The strongest argument against conditional renewal is that it imposes a positivist straitjacket on a field where context is constitutive. The Termination camp argues that the "ambient scaffolding" defence is simply the latest in a decade of *ad hoc* adjustments (Year 2 guided-participation, Year 5 fitted thresholds) that render the hard core unfalsifiable. On this view, conditional renewal merely subsidises a "zombie" programme that will consume resources while producing only post-hoc rationalisations.

  Conversely, the Full Renewal camp argues that demanding novel predictions at every turn penalises deep, structural work. The rival nativist programme has higher citation counts but cannot account for the Year 6 archaeological assemblage. If we cripple the Centre now, we risk a monoculture where the only funded model is one that fails to explain long-term cultural loss. Furthermore, imposing rigid tripwires may force the researchers to pursue "safe" predictions rather than the difficult modelling required to validate the scaffolding claim. By choosing the middle path, I risk satisfying no one: I keep the monoculture risk alive without providing the stability the Centre needs to rebuild its modelling capacity after the departure of key staff.

  **Tripwires for the Mid-Term Review**
  To mitigate these risks, my support for conditional renewal is contingent on the Centre meeting three explicit criteria at the four-year point. Failure to meet these will trigger a recommendation for termination at that stage.

  1.  **Independent Parameter Estimation:** The "ambient scaffolding" and "fidelity threshold" parameters must be estimated independently of the datasets they are used to explain. We will not accept parameters fitted to the target data. A protocol for measuring scaffolding must be published and validated by Year 3 of the new cycle.
  2.  **Novel Prediction from the Defence:** The scaffolding hypothesis must generate at least one pre-registered, novel prediction that is empirically tested. It is insufficient to merely show that scaffolding *could* explain past failures; the model must predict a specific pattern of retention or loss in a new context based on scaffolding variables.
  3.  **Return to Modelling:** The Centre must publish at least two new quantitative transmission models. Reviews and syntheses are valuable, but the Centre's charter is built on modelling. The absence of new models for three years is unsustainable.

  **Conclusion**
  The Centre's founding charter forbids revision of its anti-nativist core. This rigidity is its strength and its vulnerability. It allowed for the striking Year 6 archaeological prediction, which the rival nativist programme still cannot match. This unique explanatory power justifies keeping the programme alive to prevent a theoretical monoculture. However, the recent drift toward untestable auxiliaries threatens to turn that strength into dogma.

  Conditional renewal signals that the Council values the Centre's unique contribution to the field but demands that its protective belt remain empirically anchored. We are not judging the truth of the hard core today; we are judging the vitality of the methods used to defend it. If the Centre can operationalise "scaffolding" into a predictive tool rather than an excuse for failure, it will deserve the full seven-year term. If not, we will have limited our exposure while giving the theory a fair chance to evolve. I urge the panel to adopt this conditional path.
