  Our epistemology reading group keeps a log of what our organiser says about a run of cases, and I'm trying to get ahead of next week's. Her verdicts so far:

  1. Marta goes over a proof twice and is convinced it's sound. Then a colleague she trusts tells her she was slipped something an hour ago that makes invalid proofs look compelling. Marta keeps believing the proof is sound *and* comes to believe she isn't rational to believe it. Verdict: fine, nothing incoherent about that pair.
  2. Same Marta, but the colleague now points to a specific step that's wrong — she can't follow the objection but has no reason to doubt it. She still thinks the proof is sound because it just looks right to her. Verdict: irrational.
  3. Two people have both gone over the same argument carefully and disagree about it; one of them has put in far more hours. Verdict: they should still move toward each other rather than dig in.
  4. Nadia gets the warning Marta got, keeps believing her proof is sound, and forms no view whatever about whether she's rational to. Verdict: irrational.

  Next week's case is Petra. She gets the same warning, and lands in Marta's exact spot: believes the proof is sound, believes she's irrational to believe it. The difference is that the proof is the one she's presenting to her department on Thursday as a finished result, and it would make her name. So — is she permitted to present it? And is her pair of attitudes still all right once she also believes that presenting it means relying on something she thinks she shouldn't rely on?

