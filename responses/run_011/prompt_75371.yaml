answer: |-
  There is no single canonical term in social epistemology that captures this specific configuration. You are correct to suspect that the standard vocabulary risks begging the question. While the phenomenon resides within the territory of **structural testimonial injustice** (Fricker) and **contributory injustice** (Dotson), neither term isolates the *sequential relocation of evidentiary registers* that you describe. "Moving the goalposts" is too colloquial and implies a singular standard being raised rather than a plurality of standards being rotated. "Gaslighting" captures the psychological effect (Feature 3) but implies a malicious intent or interpersonal dynamic that obscures the institutional, procedural nature of your cases.

  Below is an analysis of why the candidate concepts fall short, a proposal for a descriptive term with boundary conditions, and the vulnerability analysis you requested.

  ### 1. Evaluation of Candidate Concepts

  **Moving the Goalposts**
  *   **Fit:** Low.
  *   **Distinction:** In standard goalpost-moving, the *degree* of evidence required increases (e.g., "Show me one case" $\rightarrow$ "Show me ten cases"). In your instances, the *type* of evidence required changes (narrative $\rightarrow$ statistical $\rightarrow$ third-party $\rightarrow$ narrative). The latter is more insidious because it prevents the accumulation of capital; the work done to meet Standard A is rendered worthless by the invocation of Standard B, rather than being seen as partial progress toward Standard A. Furthermore, "goalposting" is typically diagnosed as a fallacy committed by an agent in bad faith. Your cases suggest a systemic output where individual agents may act in good faith.

  **Testimonial Injustice (Fricker)**
  *   **Fit:** Partial.
  *   **Distinction:** Testimonial injustice posits a credibility deficit attached to the *speaker*. In your cases, the deficit attaches to the *mode of presentation*. The junior colleague is not initially told "You are lying"; she is told "This *form* of proof is insufficient." Crucially, standard testimonial injustice is often (though not always) overcome by overwhelming evidence. In your configuration, the production of evidence triggers the shift to a new register. The injustice is not merely that the speaker is not believed, but that the *epistemic tools available to the speaker are systematically ruled inadmissible.*

  **Catch-22 (Heller / Bureaucratic Theory)**
  *   **Fit:** Moderate.
  *   **Distinction:** A Catch-22 involves a logical contradiction between rules (e.g., "You must be sane to leave, but asking to leave proves you are sane"). Your cases are not logically contradictory in isolation; they are sequentially exclusive. There is no moment where two rules conflict; rather, Rule A is applied, then retired for Rule B. This makes the trap invisible to a procedural audit, whereas a Catch-22 is visible upon examining the rulebook.

  **Institutional Gaslighting**
  *   **Fit:** High on Feature 3, Low on Mechanism.
  *   **Distinction:** This term captures the outcome (Feature 3: the claimant doubting their own competence). However, "gaslighting" often centers on the psychological state of the victim or the intent of the gaslighter. It does not adequately describe the *epistemic mechanism* (the shifting registers) that produces the state. It names the wound, not the weapon.

  ### 2. Proposal: Sequential Epistemic Displacement

  I propose the term **Sequential Epistemic Displacement (SED)**.

  **Definition:**
  SED is a structural pattern of epistemic exclusion wherein a claimant's submission is subjected to a sequence of evidentiary standards drawn from incommensurable registers (e.g., narrative, statistical, third-party). At each step, the current submission is deemed locally insufficient according to the active standard, and the standard is then relocated to a register the claimant has not yet occupied. This process maintains local procedural legitimacy while ensuring global inadmissibility for the claim.

  **Necessary Conditions:**
  1.  **Plurality of Registers:** The institution must possess multiple, recognized modes of justification (e.g., anecdote, data, expert testimony).
  2.  **Sequential Invalidations:** Rejection at Step $N$ is justified by the absence of the qualities specific to Step $N+1$.
  3.  **Identity Asymmetry:** The sequence is applied disproportionately to claimants with specific social identities; claimants without those identities experience the registers as additive (Step $N$ contributes to Step $N+1$) rather than exclusive.
  4.  **Local Legitimacy:** Each individual transition adheres to an accepted norm of inquiry (e.g., "anecdotes are not data"), preventing the identification of a specific rule violation.

  **Boundary Cases (What is *not* SED):**
  *   **Ordinary Rigor:** A hearer demands more evidence of the *same* kind (e.g., "This sample size is too small, please increase it"). This is goalpost-moving, not displacement. The register remains constant.
  *   **Genuine Deterioration:** A speaker produces a narrative, then a flawed dataset, then a biased survey. Here, the rejections track the actual epistemic quality of the submissions, not the identity of the speaker. (Distinguishing this from SED requires the Asymmetry Condition).
  *   **Explicit Pre-Registration:** The institution publishes a fixed rubric in advance (e.g., "We require a statistical analysis"). If the speaker provides only a narrative, they are rejected once. If the standard does not shift *after* the narrative is provided, it is not SED.
  *   **Simple Denial:** A hearer says, "I do not believe you," without offering a pathway to proof. This is a credibility deficit, but not a procedural displacement.

  ### 3. Analysis of Feature 3 (Internalization)

  Feature 3 (the claimant concluding they are bad at producing evidence) is a **predictable consequence**, not a defining condition, of SED.

  Because each step of the displacement is locally legitimate, the claimant receives consistent feedback that their *method* is flawed, not that the *system* is rigged. In standard testimonial injustice, the victim may recognize prejudice ("They don't like people like me"). In SED, the prejudice is encoded in the procedure ("My analysis was amateurish"). This directs the critique inward toward the claimant's competence rather than outward toward the institution's fairness. This aligns with what some literature calls **epistemic exhaustion**, but specifically results from the *chasing* of a moving standard.

  ### 4. Reverse Direction (Privileged Speakers)

  Can SED run in reverse? Can a socially advantaged speaker be subjected to this?

  *   **Structurally:** Yes. A senior male colleague could theoretically be asked for a narrative, then data, then a survey.
  *   **Phenomenologically:** No. If the Asymmetry Condition holds, this sequence does not occur for advantaged speakers.
  *   **If it did occur:** It would likely be classified as **bureaucratic incompetence** or **targeted harassment**, rather than SED. The "injustice" component of SED relies on the correlation with social identity (Feature 2). Without that correlation, it is merely a frustrating administrative process. The *harm* of SED is not just the time lost, but the reinforcement of a hierarchy of knowers. If the hierarchy is not engaged, the phenomenon loses its specific political-epistemic character.

  ### 5. Vulnerability Analysis

  You asked where my analysis is most vulnerable and what would persuade me to change my mind. Here are the three points of fracture:

  **A. The "Ordinary Rigor" Defense (The Epistemic Access Problem)**
  *   **Vulnerability:** My analysis relies heavily on Feature 2 (Asymmetry). However, in many real-time committee situations, the asymmetry is not immediately visible. A committee member sees only *this* file, with *these* flaws. They may genuinely believe the statistical analysis *was* amateurish.
  *   **Challenge:** If I cannot prove the asymmetry (e.g., if the department has no history of comparable claims from privileged peers), I cannot distinguish SED from genuine, albeit frustrating, methodological rigor.
  *   **What would change my mind:** If you showed me a case where the "shifting" occurred, but the claimant *did* belong to the privileged group, and the committee *still* rejected them using the same sequence. If the sequence is independent of identity, then SED is not an injustice, but merely a **High-Threshold Bureaucracy**. I would have to concede that the identity correlation is contingent, not essential. However, given your description of Feature 2, I currently judge this unlikely.

  **B. The Unity of the Phenomenon (Student vs. Faculty)**
  *   **Vulnerability:** I have grouped the junior faculty case and the student organization case as instances of the same phenomenon. However, the power differential is vastly different. A faculty member has tenure-track leverage; a student organization has almost none.
  *   **Challenge:** It is possible these are two different mechanisms. For the student, it may be simple **dismissal** (they lack standing). For the faculty member, it is **discipline** (they have standing, but are being managed).
  *   **What would change my mind:** If it were shown that the *rhetoric* used in the dismissal differs fundamentally between the two groups (e.g., students are told "you don't understand," faculty are told "this doesn't meet standards"). If the *register shifting* is unique to the faculty case (because students are never asked for data in the first place), then my grouping is too broad. I would need to separate **Procedural Displacement** (faculty) from **Standing Denial** (students).

  **C. The "Good Faith" Assumption**
  *   **Vulnerability:** My analysis assumes the committee members act in good faith (Feature 1: "locally legitimate"). This is what makes it structural.
  *   **Challenge:** If it were revealed that committee members are *aware* of the pattern and utilize it intentionally to exhaust the claimant, the phenomenon collapses into **Conspiratorial Gaslighting** or **Bad Faith Obstruction**.
  *   **What would change my mind:** Evidence of coordination. If committee members explicitly discuss "how to handle" these claims by rotating standards, the "structural" defense vanishes. The phenomenon would no longer be a peculiar epistemic configuration, but a standard political tactic. I would then withdraw the term "Sequential Epistemic Displacement" as too neutral and classify it as **Epistemic Weaponization**.

  **Summary Judgment:**
  The phenomenon you describe is real and currently under-named. It is distinct from standard testimonial injustice because it targets the *medium* of knowledge rather than the *source*, and it is distinct from goalpost-moving because it rotates *types* of validation rather than *degrees*. **Sequential Epistemic Displacement** captures the mechanism, provided the Asymmetry Condition (Feature 2) holds. Without that asymmetry, it is merely bureaucratic inefficiency; with it, it is a potent mechanism of structural exclusion.
