  2.  **Deconstruct the "Dollar Auction" in M&A:**
      *   *Standard Auction:* Winner pays bid, losers pay nothing.
      *   *Dollar Auction:* Winner pays bid, loser pays *their* bid too.
      *   *M&A Reality:* It's hybrid. You don't pay the bid if you lose, *but* you pay significant transaction costs (TCs) regardless. If TCs are high enough relative to deal value, it *feels* like an all-pay auction.
      *   *Escalation Driver:* The trailing bidder raises to avoid losing the sunk TCs + the opportunity. The leading bidder raises to avoid losing the deal *and* wasting the TCs.
      *   *Key Insight:* The decision to *enter* is the critical control point. Once in, the math often says "bid more" to save the sunk costs, even if NPV is negative.

  3.  **Drafting the Decision Procedure (The "One-Pager"):**
      *   *Constraint:* Must fit on one page, usable in 90 mins, by biased people.
      *   *Solution:* Structural constraints are better than behavioral asks. Don't ask "Are you emotional?" Ask "Who set the number and when?"
