answer: |-
  ### The Two Sentences
  **"The only rational decision is made before you pay the entry fee; once inside, the money you spent is gone whether you stay or leave, so only bet on what's left to gain."**

  ***

  ### The "Anti-Escalation" Worksheet (One Page)
  **Instructions:** Complete Sections 1 & 2 *before* the 90-minute committee. Section 3 is voted on in the room. If any box in Section 2 is checked "FAIL," the deal requires CFO override to proceed.

  #### Section 1: The Pre-Commitment (Filled at Kickoff, Sealed by CFO)
  *This section is locked once diligence begins. No revisions allowed unless Section 2, Box 4 is triggered.*
  1.  **Walk-Away Number (WAN):** $__________ (Enterprise Value)
  2.  **WAN Owner:** __________ (Must be CFO or Corp Dev Head, *not* Deal Lead)
  3.  **Max Process Budget:** $__________ (Bankers + Diligence + Mgmt Time)
  4.  **Revision Trigger:** WAN may only be revised if: [ ] New *external* market data emerges (e.g., comp multiple shift, regulatory change). *Internal model tweaks do not count.*

  #### Section 2: The Status Tests (Filled 48 Hours Before Committee)
  *Deal Lead completes this. If you check "FAIL," you must argue why the deal proceeds anyway.*

  | Test | Question | Pass / Fail |
  | :--- | :--- | :--- |
  | **1. The All-Pay Test** | If we lose, do we lose 100% of the Process Budget with *zero* recoverable value (intel, tech, relationships)? | [ ] Pass (Some value recoverable) <br> [ ] **Fail** (Total loss) |
  | **2. The Recoverability Test** | (Internal Projects Only) Is the value of the *remaining* work positive *without* counting the sunk spend? | [ ] Pass (Future NPV > 0) <br> [ ] **Fail** (Only positive if sunk costs ignored) |
  | **3. The Bidder Position** | Are we the **Trailing Bidder** (chasing) or **Leading Bidder** (setting pace)? | [ ] Leading <br> [ ] **Trailing** |
  | **4. The Intelligence Check** | Is the rationale for continuing based on verified data or banker assurance ("they are tired/emotional")? | [ ] Verified Data <br> [ ] **Banker Assurance** |

  #### Section 3: The Decision Matrix (Committee Vote)
  *Combine Section 2 results to determine the required action.*

  *   **IF Test 1 = FAIL (Total Loss) AND Test 3 = Trailing:** **AUTOMATIC WALK.** (You are in a Dollar Auction).
  *   **IF Test 2 = FAIL (Internal):** **AUTOMATIC KILL.** (Sunk cost fallacy confirmed).
  *   **IF Current Price > WAN (Section 1):** **AUTOMATIC WALK** *unless* CFO invokes Revision Trigger (Section 1, Box 4).
  *   **IF Test 4 = Banker Assurance:** **DISCOUNT SYNERGIES by 20%** for risk before voting.
  *   **ALL OTHER CASES:** Majority Vote.

  ***

  ### Structural Workarounds (The "Honesty" Layer)
  Since the deal team wants the deal, the procedure relies on *who* holds the data, not *what* the data says.

  1.  **The Sealed Envelope:** The WAN (Walk-Away Number) is set at kickoff, written down, signed by the CFO, and placed in a digital "sealed envelope" (permissions-locked folder). The deal team cannot see it again until they submit their final bid. This prevents anchoring the model to the limit.
  2.  **The Process Budget Cap:** The Max Process Budget (Section 1, Box 3) is charged to the *Corp Dev Department's P&L*, not the Deal SPV. This makes the cost visible to you (the Dept Head) immediately, rather than hiding it in the deal's acquisition accounting later.
  3.  **The "Trailing" Penalty:** If Test 3 identifies you as the Trailing Bidder, the required IRR hurdle automatically increases by 200bps. This prices in the risk of escalation without requiring anyone to admit they are emotional.
  4.  **Banker Haircut:** Any intelligence regarding competitor fatigue or pricing provided by sell-side advisors is treated as "Unverified Claim." It cannot be used to justify breaching the WAN. Only a LOI or verified data room evidence counts.

  ***

  ### Case Runs

  #### Case 1: Live Process (Trailing, Breached Ceiling)
  *   **Inputs:** Bid $310M. WAN $285M. Team says synergies now support $315M. Bankers say opponent is emotional.
  *   **Worksheet Application:**
      *   **Test 1 (All-Pay):** Likely **Fail**. If you lose, you pay bankers + 3 months mgmt time with no asset.
      *   **Test 3 (Position):** **Trailing**. (You are second).
      *   **Test 4 (Intel):** **Banker Assurance**. ("Emotional" is unverified).
      *   **Section 1:** Price > WAN.
  *   **Result:** **AUTOMATIC WALK.**
  *   **Why:** You are in the exact Dollar Auction configuration (Trailing + All-Pay costs). The synergy model revision is internal (fails Revision Trigger). The banker intel is discounted. The procedure forces the walk to prevent throwing good money after bad to "save" the process spend.

  #### Case 2: Internal Platform (Sunk Cost)
  *   **Inputs:** $40M sunk. $15M needed. Board says "Sunk Cost." Team says "Future value positive."
  *   **Worksheet Application:**
      *   **Test 2 (Recoverability):** **Pass**. The team explicitly states remaining value is positive *without* depending on the $40M.
      *   **Test 1 (All-Pay):** N/A (Internal).
  *   **Result:** **PROCEED.**
  *   **Why:** The Board member is technically right about the $40M (it's gone), but wrong about the decision. The decision is about the *marginal* $15M. If the $15M buys $20M in PV, you spend it. The procedure validates the Board's concern (via Test 2) but overrides it because the *future* math stands on its own. The $40M is irrelevant to the go/no-go, provided it doesn't drag down the future NPV.

  #### Case 3: The Uncomfortable Case (Kill the Champion)
  *   **Scenario:** You personally sourced this deal. It's your "legacy" transaction. It is accretive at the current price. You are the **Leading Bidder**. However, the Process Budget (Test 1) is already 80% spent, and a new competitor just entered the process (making you **Trailing** in a renewed auction). To win, you must raise 10%.
  *   **Inputs:** You want to win. Deal is accretive.
  *   **Worksheet Application:**
      *   **Test 1 (All-Pay):** **Fail**. If you lose now, you burn the remaining 20% budget + the 80% already spent.
      *   **Test 3 (Position):** **Trailing** (New entrant reset the auction).
      *   **Section 3 Matrix:** Test 1 Fail + Test 3 Trailing = **AUTOMATIC WALK.**
  *   **Result:** **KILL THE DEAL.**
  *   **Why:** Even though the deal is accretive, the *process dynamic* has shifted to a Dollar Auction. You are now the trailing bidder fighting to avoid sinking the initial process cost. The procedure forces you to sacrifice the deal (and your ego) to avoid the high probability of paying the "loser's fee" (process spend) *and* overpaying for the asset. You will hate this because the deal "works," but the procedure protects the firm from the *cost of winning* becoming higher than the *value of the prize*.

  ***

  ### Limitations & Judgment Calls (Honesty Check)

  **1. The "Suicide Bidder" Problem**
  This procedure assumes rational actors. It cannot handle a counterparty who credibly commits to never dropping out (e.g., a strategic buyer for whom the asset is existential, or a private equity fund with a "must deploy" mandate). If they bid infinitely, the "Trailing" test breaks because there is no price where they stop.
  *   *Mitigation:* If Test 4 (Intelligence) suggests a strategic buyer with infinite hold value, the procedure defaults to **Do Not Enter** at Kickoff. You cannot win a Dollar Auction against a player who values the dollar at $5.

  **2. The "Entry" Blind Spot**
  This worksheet manages escalation *after* entry. It cannot stop you from entering a bad process initially. The WAN (Section 1) is only as good as the initial valuation. If the kickoff valuation is flawed, the WAN is flawed.
  *   *Mitigation:* The "Process Budget Cap" (Section 1, Box 3) is the only lever here. Keep initial diligence spend low until you verify you are the only bidder or the leading bidder.

  **3. Judgment Calls Wearing Costumes**
  *   **Test 2 (Recoverability):** Determining if past spend has "recoverable value" (e.g., "we learned about this market") is subjective. Teams will claim value to justify continuing.
      *   *Fix:* Require the CFO to sign off on the "Recoverable Value" estimate in writing. If they won't sign it, it's zero.
  *   **Test 3 (Trailing vs. Leading):** In a blind auction, you don't know your position.
      *   *Fix:* If position is unknown, assume **Trailing**. Pessimism is the only hedge against escalation.

  **4. What This Apparatus Can't Handle**
  It cannot fix a culture where "doing deals" is rewarded more than "creating value." If bonuses are paid on closed deals regardless of ROI, no worksheet will stop escalation. The WAN must be tied to compensation clawbacks if breached without CFO override.
