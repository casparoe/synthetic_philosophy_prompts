      *   *Adjustment:* User needs to focus on the *mechanism of information transfer*. Is it high-fidelity copying via external media, or just behavioral induction?
      *   *Escalation:* Move from "are they Gregorian?" to "what is the definition of Gregorian?" to "is the tower a ladder or a heap?"

  5.  **Drafting the Content (Mental Outline):**
