prompt: |-
  ok so for my psych class me and my lab partner are presenting Dennett's tower of generate and test — the Darwinian, Skinnerian, Popperian, Gregorian creatures thing — and we can't agree about where the top step is. He says New Caledonian crows are Gregorian, because different groups on the island make different shaped pandanus tools and the young birds seem to pick up the local design by watching adults, so there's a shared store of know-how living outside any one bird, which is supposed to be the whole point. I say they're at best Popperian, because what gets passed on is a skill in the bird's head, not an external artifact loaded with information that the bird can exploit without designing it the way a human exploits a textbook or a formula.

  Write the argument out as a dialogue between the two of us. Don't make me right — he's smart and he should land real hits, and I should either have to give something up or explain why I don't. Have us answer each others points instead of restating them, and let the disagreement get sharper as it goes, until it's clear what exactly would have to be true about a crow for it to cross the line, and whether that line is a difference in kind or just wherever you happen to draw it.

  Then afterwards tell me which of us you think wins, how confident you actually are in that, and the one point you're least sure about.
