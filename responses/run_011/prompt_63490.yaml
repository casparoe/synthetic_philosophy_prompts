answer: |-
  **Project Proposal: Equivocation in the Common Prior Assumption**

  **1. Research Question**
  Does the methodological dispute over the Common Prior Assumption (CPA) persist because the assumption performs three distinct argumentative roles—analytic bookkeeping, structural coherence, and normative rationality—that are treated as interchangeable in the literature? Specifically, can we demonstrate that standard objections to the CPA target one role while standard defenses protect another, and that separating these roles dissolves the apparent intractability of the debate?

  **2. Motivation and State of the Art**
  The CPA is a cornerstone of interactive epistemology and game theory, yet its status remains contested. Defenders often argue it is a harmless modeling convention or a mathematical necessity for type spaces. Attackers argue it is empirically false (agents disagree) or normatively unjustified (rationality does not require identical priors).

  Current positions leave the question open because they rely on an unstated equivocation.
  *   **The Defender's Move:** When challenged on empirical plausibility, the defender retreats to the **Structural Reading** (CPA as a coherence condition on the type space, necessary for certain existence proofs).
  *   **The Attacker's Move:** When challenging the normative implications, the attacker targets the **Normative Reading** (CPA as a claim about rational belief formation), but often treats the **Analytic Reading** (CPA as the modeler's probability measure) as the target.

  A partisan who thinks the CPA is obviously harmless (because it is just math) must concede that the math does not license the normative agreement theorems without additional epistemic premises. A partisan who thinks the CPA is obviously false (because people disagree) must concede that their objection does not invalidate the structural utility of the assumption for solving equilibrium selection problems. The debate persists because these concessions are rarely made; instead, the three readings are swapped mid-argument.

  **3. The "Collapse" Objection (Risk Assessment)**
  A significant risk to this project, raised by colleagues working in formal economics, is that this trichotomy is illusory. In standard Harsanyi type spaces, the analyst's prior, the structural common measure, and the basis for the Agreement Theorem are mathematically extensionally equivalent. If they collapse in the formalism, my framing risks being a merely verbal distinction without argumentative consequence.

  I address this in the project by treating the "Collapse Objection" as a hypothesis to be tested, not a fact to be assumed.
  *   **Scenario A (They Collapse):** If the formalism forces the three readings to coincide, the project will argue that the *literature* is nonetheless confused. Defenders use the mathematical inevitability of (2) to smuggle in the normative desirability of (3). The contribution here is exposing a category error in methodological justification, even if the math is unified.
  *   **Scenario B (They Diverge):** If I can identify generalized frameworks (e.g., non-partitional information structures, imprecise probabilities, or semantic vs. syntactic approaches) where the structural property holds without the normative claim, or where the analyst's prior exists without a common structural measure, the trichotomy is substantively validated.

  The project survives the objection either way. If the readings collapse, the error is in the *inference* from math to normativity. If they diverge, the error is in the *conflation* of distinct assumptions. The core task is to map the conditions under which the readings come apart and show that the standard debate ignores these conditions.

  **4. Methodology and Work Plan (14 Weeks)**
  Given the 8,000-word limit and teaching load, the formal work must be exegesis, not derivation. I will reconstruct existing proofs to locate exactly where each reading enters.

  *   **Weeks 1–3: Disambiguation and Taxonomy.**
      *   Draft the precise definitions of the three readings based on standard texts (e.g., Aumann, Harsanyi, Gul, Morris).
      *   Catalog 5–10 key papers in the debate and code their arguments: which reading is being defended, and which is being attacked?
      *   *Deliverable:* A 1,500-word annotated matrix of the literature.
  *   **Weeks 4–7: Formal Stress-Testing.**
      *   Investigate the "Collapse Objection." Reconstruct the derivation of the Agreement Theorem to isolate the CPA's role.
      *   Examine non-standard type spaces (e.g., Samet's non-common priors, or imprecise probability frameworks) to see if the three readings separate.
      *   *Deliverable:* Formal notes establishing whether the trichotomy holds in generalized settings. This determines the argumentative path for the second half.
  *   **Weeks 8–10: Drafting the Core Argument.**
      *   Write the main body (5,000 words). Focus on the "Equivocation Mechanism": show specific instances where a defense of Reading 2 is used to silence an objection to Reading 3.
      *   Integrate the results from Weeks 4–7: either demonstrate the divergence or expose the illicit inference.
  *   **Weeks 11–12: Refinement and Scope Cutting.**
      *   Cut historical survey material. Focus strictly on the logical structure of the arguments.
      *   Ensure the "Success Criteria" are met in the conclusion.
  *   **Weeks 13–14: Final Polish.**
      *   Check for clarity. Ensure the distinction between the three readings is accessible to a general philosopher of science, not just a game theorist.

  **5. Why This Approach?**
  The obvious alternative is to pick a side: argue either that the CPA is true (rational agents converge) or false (agents have private information). This approach fails because the "side" is ill-defined. Proving the CPA is "false" empirically does not touch its structural utility; proving it is "true" mathematically does not establish its normative force. By focusing on the *usage* of the assumption rather than its truth value, this project bypasses the stalemate. It does not require solving the problem of rational belief; it requires solving the problem of how economists talk about rational belief.

  **6. Success and Failure Criteria**
  *   **Success:** A non-specialist can read the conclusion and identify a specific argument in the literature where a theorist justifies the normative claim (3) using only the structural property (2), and understand why that inference is invalid without additional premises.
  *   **Failure (Likely Mode):** The project fails if, upon rigorous reconstruction, it turns out that no major theorist actually equivicates. If the literature is already careful to distinguish the analyst's prior from the agents' priors, and the structural requirement from the normative claim, then my central diagnosis is a strawman. In this case, the project would merely be cataloging distinctions that are already common knowledge, yielding no new philosophical insight.
  *   **Failure (Scope Mode):** Attempting to prove new formal results about type spaces rather than analyzing existing ones. Given the word count, I cannot develop new mathematics; I must restrict myself to analyzing the philosophical implications of existing formalisms.

  **7. Scope and Limitations**
  *   **Word Count:** 8,000 words is tight. I will not provide a history of the CPA. I will not survey all variations of the Agreement Theorem. I will focus on the standard Harsanyi framework and one generalized counter-example to test the trichotomy.
  *   **Formalism:** I will use formal notation only where necessary to distinguish the readings. The goal is conceptual clarity, not mathematical novelty.
  *   **Teaching Load:** The weekly plan assumes 6–8 hours of work per week on this project. Weeks 4–7 are the most vulnerable to teaching interruptions; if formal stress-testing slips, I will prioritize the "Collapse Objection" analysis over surveying multiple generalized frameworks.

  **8. Conclusion**
  This project proposes that the intractability of the Common Prior debate is a function of linguistic and conceptual equivocation. By separating the assumption into its analytic, structural, and normative roles, and testing whether these roles collapse under formal scrutiny, I aim to show that the debate is not about the truth of the CPA, but about the license theorists take to move between its different meanings. Whether the readings collapse or diverge, mapping this terrain resolves the apparent contradiction between the assumption's mathematical ubiquity and its methodological controversy.
