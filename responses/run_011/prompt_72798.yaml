          *   **Complexity:** 24 students is a lot for a complex game in 75 minutes. If the rules take 20 mins to explain, the learning is lost.
          *   **The "Oracle" Problem:** The user identified this. If the instructor holds the truth, students might think the *problem* is just hidden information, not incommensurability.
          *   **Phase 1 (Ordinal):** If they can't see points, how do they know one allocation is Pareto superior? They need to know their *own* points but not others'.
          *   **Phase 2 (Summation):** If they only see self-reports (0-10), and scales differ, summing is indeed meaningless. But will they realize *why*?
          *   **Phase 3 (Calibration):** Rescaling levels is easy; rescaling margins (units) is hard. This needs to be very clear.
          *   **Social Friction:** Accusations of lying (as noted by user) can derail the ethical discussion into interpersonal conflict.
          *   **Time:** 75 minutes is tight for 3 phases + debrief.

      *   *Verdict:* The skeleton is sound conceptually but operationally risky. It needs simplification to fit the time and ensure the *measurement* issue is the focus, not the *game mechanics*. The "Oracle" issue needs to be addressed in the debrief, not fixed in the game (since it's inherent to pedagogy).

