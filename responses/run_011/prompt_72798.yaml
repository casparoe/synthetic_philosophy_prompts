      *   **Task:** Evaluate the skeleton, fix it if rotten, provide specific materials (cards, vignettes), payoff scheme, roles, timeline, debrief, risk mitigation, and limitations.

  2.  **Evaluate the Skeleton:**
      *   *Strengths:* It directly targets the mechanism of comparison. The distinction between ordinal and cardinal is built-in. The calibration phase is a nice touch for "level comparability."
