  | Chicken Element | Nuclear Crisis Correspondent |
  | :--- | :--- |
  | **Two Drivers** | Adversarial Heads of State or Command Authorities |
  | **The Road** | The Crisis Timeline or Escalation Ladder |
  | **Swerving** | Making Concessions or De-escalating |
  | **Holding Course** | Maintaining Demands or Mobilizing Forces |
