answer: |-
  The dilation objection is often presented as a fatal wound to the project of imprecise probabilism, a mathematical curiosity that metastasizes into a decision-theoretic paradox. Your reconstruction of the coin case is accurate to the standard literature: you begin with a sharp prior on the outcome, derived from symmetry or indifference, but a set of possible likelihoods reflecting your ignorance about the stranger's skill. Upon learning the stranger's handedness, your posterior credence in heads dilates from a point to the entire unit interval. The intuitive punch is immediate: free information has rendered you maximally ignorant. If learning the truth makes you worse off, the model of rationality generating that result must be flawed. However, this conclusion rests on a misdiagnosis of where the epistemic pathology actually lies. Dilation is not a bug in the system of imprecise credences; it is a feature that exposes the hidden, unwarranted assumptions required to avoid it. The sharp Bayesian does not escape dilation through superior rationality, but through a silent commitment to probabilistic independence that the evidence does not support.

  To see why dilation should not worry us, we must first disentangle the credal state from the decision rule. The complaint that a dilated agent will refuse free information, or even pay to avoid it, is not a necessary consequence of having imprecise credences. It is a consequence of pairing those credences with specific decision rules, such as E-admissibility or Maximality, in contexts where indeterminacy is treated as a cost. Under E-admissibility, an option is chosen if it maximizes expected utility relative to at least one probability function in the credal set. In your coin case, prior to learning the handedness, betting on heads at even odds is permissible (since the sharp prior is 1/2). After learning the handedness, the credal set dilates to $[0, 1]$. Now, betting on heads is not E-admissible, nor is betting against it. The agent moves from a state of indifference to a state of indecision.

  Does this imply the agent should pay to avoid the information? Only if we assume that indecision is practically costly in a way that indifference is not. If the agent is forced to choose, they might randomize or pick a default, but the mere shift from indifference to indeterminacy does not entail a loss in expected utility unless we stipulate that the agent has a secondary preference for decisiveness over accuracy. If the goal of epistemology is to align confidence with evidence, then becoming indecisive in the face of ambiguous evidence is the correct response. The decision-theoretic objection only holds if we prioritize the smoothness of choice over the fidelity of belief. If you accept that rational choice can sometimes be indeterminate when evidence is equivocal, the claim that the agent is "worse off" evaporates. They are not worse off; they are merely more honest about the precariousness of their position.

  This brings us to the sharper comparison: is the sharp Bayesian actually better off? To avoid dilation in your coin case, the sharp Bayesian must maintain that $P(H|E) = P(H|\neg E) = 1/2$. Since the marginal $P(H)$ is already fixed at 1/2 by the setup, maintaining this sharpness requires assuming that the event $H$ is probabilistically independent of $E$. But where does this independence come from? It is not derived from the evidence. You explicitly stipulated that the stranger might be a sleight-of-hand artist whose skill correlates with handedness, or they might be ordinary. The evidence supports a range of correlations. The sharp Bayesian who assigns 1/2 to the conditional probabilities is not responding to the evidence; they are imposing a constraint upon it. They are assuming that because they have no reason to think handedness matters, it *does not* matter.

  This is a profound epistemic difference. The imprecise probabilist represents the state of "I know the marginal is 1/2 by symmetry, but I have no idea if this specific evidence breaks that symmetry" by allowing the conditional credence to range over $[0, 1]$. The sharp probabilist represents the same state by asserting "I know the marginal is 1/2, and I also know this evidence doesn't change it." The latter is a claim to knowledge the agent does not possess. Dilation occurs precisely because the imprecise model respects the distinction between knowing the statistical frequency of heads in the general population and knowing the causal mechanism of this specific flip. When the sharp Bayesian avoids dilation, they are conflating a lack of evidence for correlation with evidence of independence. That is not rationality; it is tidiness purchased at the price of truth. Dilation is the mathematical signature of admitting that learning which sub-population you are in (left-handed flippers) can change your confidence when you don't know the sub-population's bias, even if the average bias is known.

  You mentioned conglomerability as a potential technical rescue. Conglomerability is the condition that requires the unconditional probability of an event to lie within the range of its conditional probabilities over a partition. In standard precise probability, this is guaranteed by the law of total probability. In imprecise probability, it is not. If we impose conglomerability on the credal set, we can indeed block dilation. If the conditionals range over $[0, 1]$, conglomerability would demand the unconditional prior also range over $[0, 1]$. But in your case, the prior is sharp at 1/2. So, imposing conglomerability would force us to reject the sharp prior, making it imprecise as well.

  However, treating conglomerability as a rational requirement is controversial. It effectively bans the representation of certain kinds of ignorance. Specifically, it prevents an agent from having a sharp prior based on symmetry while acknowledging ignorance about the underlying mechanisms that generate the data. To demand conglomerability here is to demand that the agent's ignorance about the mechanism infects their prior belief about the outcome. While some argue this is the correct way to model total ignorance, it sneaks sharpness back in through the side door if one insists on keeping the prior sharp. If you keep the prior sharp and demand conglomerability, you force the conditionals to be sharp. This returns us to the sharp Bayesian's error: forcing a precise conditional probability where none is warranted. Conglomerability is a coherent mathematical property, but elevating it to a norm of rationality effectively outlaws the specific type of partial knowledge your coin case illustrates. It solves the problem by forbidding the agent from having the epistemic state that the evidence actually supports.

  This leads to the question of epistemic value. If the dilation changes no decisions—for instance, if the agent wasn't going to bet anyway—has anything of value been lost? The sharp Bayesian says yes, because the agent's confidence has degraded. The imprecise probabilist says no, because the agent's calibration has improved. Epistemic value is not merely about having a determinate opinion; it is about having an opinion that matches the strength of the evidence. A sharp credence of 1/2 after learning the stranger is left-handed implies you have evidence that the coin is fair *for left-handed strangers*. You do not have that evidence. You have evidence that the coin is fair on average, and that the stranger is left-handed. To maintain sharpness is to claim a precision of evidence you lack.

  If the interval blows up but straddles the same choices, the agent has lost nothing in terms of action, but they have gained something in terms of honesty. They have avoided the vice of overconfidence. The damage done by dilation is only to the aesthetic of Bayesian updating, which prefers smooth, continuous shifts in probability. But the world is not always smooth. Sometimes information reveals that our previous certainty was an artifact of averaging over distinct possibilities rather than a reflection of underlying stability. Dilation captures the moment an agent realizes their prior certainty was fragile. To call this a defect is to blame the thermometer for rising when the room gets hot.

  Underpinning all of this is the debate between Uniqueness and Permissivism. The Uniqueness thesis holds that for any body of evidence, there is exactly one rational credence function. If Uniqueness is true, then imprecise credences are merely a placeholder for a sharp credence we haven't calculated yet, or a representation of psychological uncertainty rather than epistemic rationality. If Uniqueness is true, dilation is indeed a reductio, because it implies that rational agents can be forced into a state of indeterminacy by evidence, which Uniqueness forbids. However, Uniqueness is implausible in cases of radical ignorance. In your coin case, the evidence simply does not pinpoint a single conditional probability. It supports a family of hypotheses. Permissivism, the view that evidence can rationally support a range of credences, is the only framework that can accommodate the structure of the evidence without fabrication.

  If you accept Permissivism, dilation ceases to be a paradox and becomes a theorem about how permissive sets update. It shows that even if your prior is sharp (perhaps due to a separate symmetry argument), the permissiveness of your likelihoods can overwhelm that sharpness upon conditioning. The verdict, therefore, rests on whether you believe rationality requires you to have a single number for every proposition. If you believe that, you must accept the sharp Bayesian's independence assumption to avoid dilation. If you believe rationality requires you to match your confidence to the evidence, you must accept dilation as the cost of admitting you don't know the correlation between handedness and flip mechanics.

  I will land on the latter. Dilation is not a genuine reductio against allowing imprecise credences. It is a demonstration that sharp credences often rely on hidden independence assumptions that are not warranted by the evidence. The sharp Bayesian avoids dilation only by assuming they know the relevance of evidence they have not seen. The imprecise Bayesian accepts dilation because they acknowledge that learning which sub-group they are in matters when they don't know the sub-group's bias. For the objection to win, one would have to prove that rational agents are required to assume independence in the face of ignorance, or that decision-theoretic indecision is always irrational. Neither claim is sustainable. The coin case is not a bad instance of dilation; it is the paradigmatic one. It shows that averaging over possibilities is not the same as knowing the possibility you are in.

  Therefore, dilation is a feature. It is the formal mechanism by which imprecise probabilism protects the agent from spurious precision. To fix it is to break the model's ability to represent ignorance about correlations. You should bet on the general question by rejecting the idea that free information must always sharpen credence. Sometimes, free information reveals that your previous certainty was an illusion of aggregation. The agent who dilates is not the one who has lost their way; the agent who remains sharp is the one who has failed to notice the ground shifting beneath them. The price of avoiding dilation is epistemic arrogance, and that is a price no rational agent should pay.
