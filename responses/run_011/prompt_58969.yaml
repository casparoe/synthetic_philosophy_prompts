answer: |-
  # HANDOUT: The Units of Selection Decision Tree
  **Philosophy of Biology Reading Group | Term Start**

  **START HERE:** We grant that **adaptations exist** and that **individual-level selection** cannot explain every trait (e.g., sterile worker castes, *Dictyostelium* slugs). You are here to locate *where* the selection is happening.

  ### NODE 1: The Fitness Locus
  To explain altruism/sterility, where must the **fitness difference** occur?
  *   **(A)** At the **Individual** level (helpers gain indirect fitness via kin; groups are just contexts). $\rightarrow$ Go to Node 2.
  *   **(B)** At the **Group** level (groups survive/reproduce better than other groups). $\rightarrow$ Go to Node 3.

  ### NODE 2: The Gene's Status (For Individualists)
  If selection acts on individuals, what is the **gene** doing in your model?
  *   **(A)** It is a **Replicator** (a distinct unit copied with fidelity; the "selfish" driver). $\rightarrow$ **LEAF 1: Strict Gene's-Eye View (Dawkins)**
  *   **(B)** It is **Material/Interactor** (a physiological part of the organism; selection targets the whole phenotype). $\rightarrow$ **LEAF 2: Williams-Style Individualism**
  *   **(C)** It is a **Bad Category** (developmental systems are too integrated to isolate "genes"). $\rightarrow$ **LEAF 3: Unnamed (Developmental Systems Theory)**

  ### NODE 3: Group Ontology (For Group Fitness)
  If groups have fitness, what **kind of entities** are they?
  *   **(A)** **Trait-Groups:** Temporary assortment with migration (e.g., local mating pools, tumor lineages). $\rightarrow$ Go to Node 4.
  *   **(B)** **Propagule-Groups:** Groups reproduce via fission, budding, or colony founding (e.g., ant colonies, volvox). $\rightarrow$ Go to Node 5.

  ### NODE 4: Causal vs. Statistical (For Trait-Groups)
  Is the "group effect" a distinct **cause** or a way to **partition variance**?
  *   **(A)** Distinct **Causal Force** (group pressure changes individual traits). $\rightarrow$ **LEAF 4: MLS1 (Sober & Wilson)**
  *   **(B)** **Bookkeeping/Partitioning** (group selection is just a statistical way to describe individual interactions). $\rightarrow$ **LEAF 5: Contextual Analysis (Heisler & Damuth)**

  ### NODE 5: Hierarchy & Scope (For Propagule-Groups)
  Does this logic apply only to **colonies** or also to **higher taxa**?
  *   **(A)** Only **Colonies/Organisms** (the "Superorganism" is the selected unit). $\rightarrow$ **LEAF 6: MLS2 / Superorganism**
  *   **(B)** Also **Species/Clades** (species birth/death rates vary by trait; e.g., speciation rates in gastropods). $\rightarrow$ **LEAF 7: Species Sorting (Vrba & Gould)**

  ### NODE 6: The Meta-Question (Available at any stage)
  Is the dispute about **which level is real** or about **model equivalence**?
  *   **(A)** **One Level is Real** (proceed to leaves above).
  *   **(B)** **Models are Equivalent** (causal decomposition is arbitrary; choose the math that works). $\rightarrow$ **LEAF 8: Pluralist / Equivalence Thesis (Okasha/Kerr)**

  ***

  ## POST-TREE ANALYSIS

  ### 1. Empty Positions (Logically Possible,无人 Occupied)
  *   **The "Zombie Group" (Node 3B + Denial of Heritability):** Claiming groups have *fitness differences* but do not *reproduce* or pass on *group-level traits*.
      *   *Verdict:* **Incoherent.** Fitness implies lineage persistence. If groups don't reproduce/inherit, "group fitness" collapses into aggregate individual fitness (MLS1).
  *   **The "Species Replicator" (Node 5B + Node 2A):** Claiming Species Sort (Node 5B) but treating Species as **Gene-Replicators** (Node 2A).
      *   *Verdict:* **Unattractive/Category Error.** Species sort via differential extinction/speciation, but they do not replicate genetic material with fidelity in the Dawkinsian sense. Mixing these ontologies confuses macroevolutionary sorting with microevolutionary replication.

  ### 2. Indistinguishable Leaves
  *   **LEAF 4 (MLS1) vs. LEAF 5 (Contextual Analysis):**
      *   *Why:* Mathematically, the Price Equation partitions for MLS1 and Contextual Analysis are often equivalent. The tree forces a choice based on *causal interpretation* (Node 4), but empirically, a student might accept the math of Contextual Analysis while believing the causal story of MLS1. The tree cannot separate a "Causal Contextual Analyst" from an "MLS1 theorist" without probing their metaphysics of causation deeper than most biologists care to.
  *   *(Alternative)* **LEAF 1 (Gene's-Eye) vs. LEAF 2 (Williams):**
      *   *Why:* Both accept individual-level selection. The distinction rests entirely on whether "gene" is a metaphor for inheritance (Williams) or a literal ontological unit (Dawkins). In practice, both use the same population genetics models.

  ### 3. Instructor Note
  *   **Kin Selection?** Notice Kin Selection does not appear as a leaf. In this tree, it is a *mechanism* located at **Node 1A**. If you think Kin Selection explains sterile workers *without* group fitness differences, you are an Individualist (Leaf 1 or 2). If you think Kin Selection *is* a form of Group Selection, you must argue for **Node 1B**. This is where the real fight happens.
