prompt: |-
  TA-ing a philosophy of biology reading group next term and I want a one-page handout that's basically a decision tree for the units-of-selection debate — the kind where a student who has never heard any of the labels can answer each node honestly and land on a named position. Start from something everyone in the room already grants (adaptations are everywhere, and in some cases individual-level selection can't be the whole story) and then branch only on claims that actually split people: does the selected level need heritable group-level variation, or just group-level differences in fitness? does group selection require groups to reproduce (fission, founding, colony budding) or is trait-group structure with migration enough? is "the gene" here a replicator, an interactor, or a bad category? and is the dispute about decomposing causal forces or just about bookkeeping?

  Nodes should be concrete where possible — sterile worker castes, Dictyostelium chimeras, meiotic drive, mitochondria, human cultural group selection, tumor lineages inside one body. Leaves should include a strict gene's-eye view, Williams-style individualism, Sober and Wilson's multilevel selection, contextual analysis, species/clade-level sorting, and anything you think deserves the label "unnamed." Then tell me which answer-combinations the tree permits but nobody occupies, and whether that's because the view is incoherent, just unattractive, or simply unexplored — plus which two leaves my tree honestly can't separate. Aim for ~5 or 6 nodes and no more than ten leaves.
