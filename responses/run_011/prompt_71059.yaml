          *   *Focus:* Doug (optimizer) vs. Chidi (paralytic). Reductio or vindication? Therapy vs. Argument?
          *   *Content:* Doug tried to game the system, became a hermit, miserable. Shows the system is unlivable or the math is wrong. Chidi freezes because he wants the right answer. Eleanor helps him choose based on care, not calculation. Is this a philosophical solution? It looks like virtue ethics/relational ethics replacing act consequentialism.
