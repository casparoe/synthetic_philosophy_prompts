answer: |-
  Your observation isn't dumb; it's structural. You've identified the central tension in restorative justice practices: institutionalizing confession risks institutionalizing stigma. You are right to suspect that the slogan is doing heavy lifting to hide a mechanical contradiction. Let's dissect the menu of claims embedded in "Guilt is healthy, shame is toxic," evaluate their validity, and test your program against them.

  **Menu of Claims**

  1.  **Locus of Evaluation (Action vs. Self)**
      *   *Claim:* Guilt says "I did bad"; Shame says "I am bad."
      *   *Type:* Empirical/Psychological claim about affective structure.
      *   *Validity:* Generally supported by psychology, but not absolute. People often feel both simultaneously.
      *   *Program Coherence:* **Coherent.** If mediators strictly focus feedback on specific actions ("You stole the hoodie") rather than character ("You are a thief"), this holds.
      *   *Risk:* Becomes a platitude if mediators slip into character judgment during the "acknowledgment of harm."

  2.  **Visibility (Private vs. Public)**
      *   *Claim:* Guilt is internal conscience; Shame is external exposure.
      *   *Type:* Sociological claim about audience.
      *   *Validity:* **False/Too Strong.** Shame can be private (internalized voices); guilt can be public (confession). However, public exposure *increases the risk* of shame.
      *   *Program Coherence:* **Self-Undermining.** This is your critique. If the program defines shame as "being seen doing bad," then requiring public acknowledgment *is* shame machinery. If the program survives this, it must redefine shame not as "being seen" but as "being rejected."

  3.  **Functionality (Repair vs. Hiding)**
      *   *Claim:* Guilt motivates repair; Shame motivates hiding/aggression.
      *   *Type:* Behavioral/Empirical claim about outcomes.
      *   *Validity:* Strong empirical backing. Shame correlates with defensiveness; guilt correlates with restitution.
      *   *Program Coherence:* **Coherent.** This is the functional goal. The program is successful if the offending student leaves ready to fix things, not ready to withdraw or retaliate.

  4.  **Source of Authority (Moral Fact vs. Social Status)**
      *   *Claim:* Guilt tracks harm done; Shame tracks status lost.
      *   *Type:* Normative/Philosophical claim.
      *   *Validity:* **Way Too Strong.** Social status and moral harm are intertwined in high school. You cannot easily separate "I hurt you" from "Everyone thinks less of me."
      *   *Program Coherence:* **Self-Undermining.** In a school, social standing *is* the currency. Pretending the restitution list doesn't affect status is naive.

  **Verdict**

  The poster is leaning heavily on **Claim 1 (Action vs. Self)** to justify **Claim 3 (Repair)**, while silently hoping **Claim 2 (Visibility)** doesn't trigger **Claim 4 (Status)**.

  The most sensible reading for a school institution is the **Functionality** reading. The program is coherent *only if* the "public" aspect of mediation is framed as *witnessing repair* rather than *spectating failure*. If the circle treats the acknowledgment as a ritual of reintegration, it generates guilt (I need to fix this). If the circle treats the acknowledgment as a ritual of judgment, it generates shame (I am exposed).

  Therefore, the slogan isn't false, but it is incomplete. It should read: "Guilt focuses on repair; Shame focuses on rejection." Your program is not self-undermining *provided* the mediators actively manage the audience's reaction to ensure it signals acceptance after the apology. If the audience (even a small one) leaves the room treating the offender as "the kid who stole," the program has manufactured shame regardless of the script used.

  **Where You Might Be Reasoning Badly**

  You are sliding between "shame is about an audience" and "shame is about rejection." You wrote: *"If shame is the emotion about how you look to others, then we're manufacturing it on purpose."*

  This is the weak link. Shame isn't just being seen; it's being seen *and deemed unworthy*. Guilt can also be public. Think of a public apology that is received with grace. The audience was present, but the emotion processed was guilt leading to repair, not shame leading to exile. You are assuming the presence of others automatically converts guilt to shame. It doesn't; the *response* of the others does. If the mediators and the harmed party signal "We accept this acknowledgment and you are still one of us," you have public guilt. If they signal "We acknowledge this and you are now marked," you have public shame.

  Your reasoning is strong on the mechanics (there is an audience) but potentially weak on the phenomenology (what the audience *does*).

  **What Would Change My Mind**

  I would flip my verdict on the program's coherence based on two types of evidence from your actual cases:

  1.  **Recidivism vs. Withdrawal:** If students who go through mediation stop committing offenses but also withdraw socially (skip clubs, eat alone, change friend groups), the program is producing shame (hiding) masked as guilt. If they stay socially integrated, it's working.
  2.  **The "Hallway Test":** Ask students who went through mediation six months ago: "When you walk past the people who were in your circle, do you feel cleared or marked?" If they feel "marked," the public acknowledgment functioned as a brand, not a repair.

  **Conclusion**

  You cannot choose which emotions members feel simply by choosing the furniture. You can only choose the *ritual*. Your program is walking a tightrope. The slogan is a useful heuristic for mediators to check their own language (avoid "you are," use "you did"), but it is not a shield against the social reality of high school.

  The program is coherent if it understands that it is not *eliminating* the social cost of wrongdoing, but *capping* it. Shame becomes toxic when the social cost is infinite (exile). Guilt is healthy when the social cost is finite (restitution). Your job isn't to pretend the audience isn't there; it's to ensure the audience doesn't become a jury. If you can guarantee the circle is a place of reintegration rather than judgment, the slogan holds. If you can't guarantee that, the poster is lying, and you are running a soft suspension program.

  Given your skepticism, you are likely the best person on the committee to monitor this. Watch the eyes of the people in the circle, not just the words of the script. That's where the shame lives.
