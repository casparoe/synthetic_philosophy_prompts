          *   *Test:* If it's a refinement, a fragile capability isn't a "real" capability. If it's a weighting, it is a capability but counts for less.

      *   **Literature/Existing Positions:**
          *   *Resourcism (Rawls/Dworkin):* Ignores conversion entirely. Robustness bites hard here.
          *   *Standard Capability (Sen/Nussbaum):* Acknowledges conversion factors but treats them as parameters. Can they absorb robustness? Only if they redefine "capability" to include counterfactual stability.
          *   *Welfarism:* Too subjective.
