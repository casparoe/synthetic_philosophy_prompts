  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy but academic. "Robustness in Equality," "The Stability of Conversion," etc. Let's go with *The Robustness of Conversion: A New Metric for Equality?*

      *   **Project Summary/Abstract:** (Implicit in the first page). Set the stage. The "Equality of What?" debate. The gap (static vs. dynamic conversion).

      *   **The Research Question:** Needs to be determinate.
          *   Option A: Fourth Metric? (Unlikely, robustness isn't a good like resources).
