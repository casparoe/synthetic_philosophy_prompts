answer: |-
  **Project Title:** The Robustness of Conversion: Stability as a Dimension of Equality

  **1. The Research Question**

  The "equality of what?" debate has largely settled into a triad: welfare, resources, or capabilities. The capability approach (Sen, Nussbaum) currently holds the normative high ground because it accounts for *conversion factors*: the reality that a bicycle provides different mobility to an able-bodied person than to a wheelchair user. However, standard capability theory treats conversion factors as static parameters. It asks, "What can this person do with this bundle of goods *now*?" It does not ask, "How fragile is that ability?"

  Our project investigates a specific gap in this framework. Two individuals may possess identical capability sets today. Person A's capabilities depend on a single bus route, a specific landlord, or a sole-source medical supplier. Person B's capabilities are maintained by redundant systems, universal design, or diverse supply chains. If the bus route is cut, Person A loses their mobility functioning; Person B does not. Standard capability theory ranks them as equal. Intuitively, Person B is less disadvantaged.

  The central research question is not merely "does robustness matter?" but rather: **Is robustness a fourth metric of equality, a refinement internal to the definition of a capability, or a weighting principle for comparing capability sets?**

  These three options have distinct normative and operational consequences:
  1.  **Fourth Metric:** Robustness is a separate good to be distributed (like resources), potentially trading off against current functioning.
  2.  **Refinement:** A "fragile" capability is not a true capability. The definition of the set must include counterfactual stability.
  3.  **Weighting:** Fragile capabilities count for less in an aggregate index than robust ones, even if the current functioning is identical.

  Distinguishing these requires a determinate test. We propose a *Substitution Test*: If we can compensate for low robustness by increasing the *level* of current resources (e.g., giving Person A more money to buy a taxi), it functions as a metric trade-off. If no amount of current resources compensates for the structural fragility without changing the environment, it is a refinement of the capability definition. If we simply value the same functioning less because it is fragile, it is a weighting principle. Our goal is to run this test against formal models and normative cases to determine which classification holds.

  **2. Why Existing Positions Do Not Settle This**

  **Resourcism (Rawls/Dworkin):** Resource-based views ignore conversion factors entirely. They would see Person A and Person B as equal if they hold the same budget. Our proposal bites hardest here. A robustness-sensitive view demands we account for the *environmental dependency* of resources, not just the resources themselves. Resourcism cannot absorb this without ceasing to be resourcism.

  **Standard Capability Approach:** This view acknowledges conversion factors but treats them as "standing features" of the person or environment. It takes a snapshot. To absorb robustness, the capability approach would need to redefine a capability set from "what I can do now" to "what I can do across a range of probable near-future states."
  *   *Where it absorbs:* Sen's later work on agency and freedom hints at this. If "freedom" includes security, robustness might be internal.
  *   *Where it bites:* Operationalizing capability sets is already difficult. Adding a temporal/stability dimension exponentially increases data requirements. If robustness is a *refinement*, current capability measures (like the HDI or disability indices) are systematically overestimating the well-being of fragile populations.

  **Welfarism:** Subjective welfare might capture anxiety about fragility, but it fails on *adaptive preferences*. A person in a fragile situation may lower their expectations to avoid disappointment. They report high welfare despite high fragility. A robustness metric corrects for this by looking at the structural reality, not the reported satisfaction.

  **The Economist's Angle:** For health economics, this distinction is crucial for costing disability support. If we fund based on current capability gaps, we fund the wheelchair. If we fund based on *robustness*, we might fund the wheelchair plus the maintenance network, or the universal design of the building. The cost functions differ. If robustness is a weighting principle, we prioritize funding for those with fragile support systems. If it is a metric, we might accept lower current functioning to build higher stability (a harder sell in policy).

  **3. Methodology and Work Plan (8 Months)**

  **Strategy: Conceptual Modeling and Worked Examples**
  Given the eight-month timeline and lack of fieldwork budget, empirical operationalization is premature. You cannot regress robustness until you define whether it is a property of the agent, the environment, or the relation between them. Furthermore, existing datasets do not track counterfactual stability. Therefore, we will proceed via **conceptual construction and economic modeling of worked examples.**

  We argue against the obvious alternative (attempting to proxy robustness in existing survey data) for two reasons:
  1.  **Validity:** Proxies (e.g., "income volatility") measure resource stability, not *conversion* stability. We need to isolate the conversion factor.
  2.  **Normative Clarity:** Before measuring, we must know what we are measuring. If robustness is a weighting principle, a regression coefficient is inappropriate. If it is a refinement, we need a new index structure.

  **Roles:**
  *   **Philosophy (PI):** Conceptual mapping of the "Equality of What?" debate; constructing the thought experiments (Person A vs. Person B); defining the normative stakes (autonomy vs. security); determining if the Substitution Test holds.
  *   **Health Economics (Co-I):** Formalizing the stability constraint; modeling the cost implications for disability support programs; translating the philosophical categories into variables that could eventually be measured (e.g., elasticity of functioning with respect to environmental shocks).

  **Month-by-Month Plan:**

  *   **Months 1-2: Conceptual Mapping.**
      *   Joint workshops to define "robustness" precisely. Is it resilience (bounce back) or resistance (no loss)?
      *   Philosophy: Draft the Substitution Test.
      *   Economics: Review existing disability cost models to identify where "stability" is currently hidden or ignored.
  *   **Months 3-5: Worked Examples (Disability Focus).**
      *   Develop 3-4 detailed case studies (e.g., mobility aids, personal care assistance, medication supply).
      *   For each case, calculate the "Capability Set" (Standard) vs. the "Robust Capability Set" (Proposed).
      *   Economics: Model the cost difference. Does achieving robustness require diminishing returns on current functioning?
  *   **Months 6-7: Classification and Formalization.**
      *   Apply the Substitution Test to the cases. Does the result point to Metric, Refinement, or Weighting?
      *   Draft the formal distinction. If Robustness = Probability-Weighted Capability, the idea is trivial. We must demonstrate it is distinct from risk (i.e., it concerns structural dependency, not just likelihood of failure).
  *   **Month 8: Synthesis and Dissemination.**
      *   Draft final paper (targeting *Philosophy & Public Affairs* or *Health Economics*).
      *   Prepare policy brief for disability support stakeholders.

  **4. Success and Failure Criteria**

  The panel will rightly ask how we distinguish this from existing ideas. We have defined clear success and failure conditions.

  **Success:**
  1.  **Differentiation:** We demonstrate a case where Resource, Welfare, and Standard Capability rankings all agree (A = B), but the Robustness view ranks them differently (B > A), and this ranking is normatively defensible.
  2.  **Classification:** We definitively categorize robustness as either a refinement or a weighting principle. (Finding it is a "fourth metric" is also a result, though less likely).
  3.  **Non-Triviality:** We show that robustness is *not* simply "expected utility" or "risk-adjusted capability." It must capture a structural feature of the conversion process (e.g., dependency on a single node) that exists independently of the probability of failure.

  **Failure:**
  1.  **Triviality:** If robustness collapses into "probability of maintaining functioning," it is just standard decision theory under uncertainty. If we cannot distinguish structural fragility from probabilistic risk, the project fails.
  2.  **Falsehood:** If prioritizing robustness leads to paternalistic outcomes that violate autonomy (e.g., forcing a person into a "stable" care home against their will to secure their functioning), the normative theory fails.
  3.  **Incoherence:** If the economist cannot model the cost implications without infinite regress (i.e., we need to measure the robustness of the robustness), the framework is operationally useless.

  **5. Scope Note: Disability vs. Climate**

  We initially considered applying this framework to climate justice (vulnerability to disaster). However, for an eight-month seed grant, this is too broad. Climate vulnerability involves global supply chains, migration, and complex ecological systems.

  We will **restrict the scope to Disability Support Programs.**

  **Reasons:**
  1.  **Expertise:** Our interdisciplinary team is specifically configured for this. The Co-I is a health economist who costs disability programs. We have immediate access to the relevant policy literature and cost structures.
  2.  **Precision:** Disability cases offer clean examples of conversion factors (a wheelchair, a ramp, a personal assistant). It is easier to isolate the "conversion" variable here than in broad climate scenarios.
  3.  **Impact:** Disability policy is currently shifting from "medical models" to "social models." A robustness metric provides a concrete tool for this shift, moving policy from funding *goods* to funding *stable functionings*.

  By narrowing to disability, we ensure the project is deliverable within eight months while retaining the theoretical generality to expand to climate or disaster justice in future research.

  **6. Conclusion**

  This project challenges the static assumption at the heart of the capability approach. By shifting focus from the *level* of conversion to the *robustness* of conversion, we offer a new lens for evaluating inequality. This is not merely theoretical; for disability policy, it changes the question from "What do they need?" to "How secure is what they have?" Over eight months, we will determine if this insight requires a new metric, a refinement of the old one, or a new weighting rule. The result will be a rigorous conceptual framework ready for future empirical testing.
