      *   *Proposed View:* Resources $\to$ *Robust* Conversion Factor $\to$ Functioning/Capability.
      *   *Key Insight:* Two people have the same capability set *now*, but Person A loses it if the bus route changes, Person B does not. Standard capability theory treats them as equal *now*. Robustness theory ranks B > A.
