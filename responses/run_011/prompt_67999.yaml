          *   *Why not empirical?* Because the concept isn't defined yet. You can't measure "robustness" until you define if it's a property of the person, the environment, or the relation.
          *   *Roles:* Philosopher (Conceptual clarity, normative justification, thought experiments). Economist (Formalizing robustness, stability analysis, cost-implications for disability support).
          *   *Timeline:*
              *   Months 1-2: Conceptual mapping & definitions.
              *   Months 3-5: Worked examples (Disability focus).
              *   Months 6-7: Formalizing the metric/weighting distinction.
              *   Month 8: Paper drafting.

      *   **Success/Failure Criteria:**
          *   *Success:* We show a case where Resource, Welfare, and Capability rankings differ from Robustness rankings *and* the Robustness ranking is normatively superior. We determine if it's internal or external to the metric.
          *   *Failure (Triviality):* If robustness turns out to be just "expected value of capability" (risk-adjusted). We need to show it's distinct from risk.
          *   *Failure (Falsehood):* If robustness conflicts with autonomy (e.g., paternalistically forcing stability over choice).

