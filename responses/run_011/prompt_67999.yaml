      *(Refining the Success Criteria)*: The prompt asks specifically about triviality (just capability relabeled). I need to be explicit: If robustness = probability-weighted capability, it's trivial. If it's about *structural dependency* independent of probability, it's novel.

      *(Refining the Scope)*: Why drop climate? Because the economist partner specializes in disability costing. That's the strongest selling point for an interdisciplinary grant.

  8.  **Final Review against constraints:**
