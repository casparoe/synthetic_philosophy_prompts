          1.  Term-by-term translation (Sphexishness, Frame Problem, Free Will).
          2.  Residue Report (What maps cleanly, what requires bending, what has no counterpart).
          3.  Direct Answers to three specific questions:
              *   Can craft distinguish between *persistent reason* consistency vs. *triggered* consistency?
              *   Who is right: The writer (craft is missing something) or the philosopher (the line is rhetorical/Keijzer's objection)?
              *   Can a character be deliberately/tragically Sphexish and still read as a person?
          4.  Apply this to the specific scene provided (Miriam setting the table).
      *   **Tone:** Professional, direct, no fluff, American English. No bibliography/page numbers unless certain.

  2.  **Deconstruct Dennett's Concepts:**
      *   **Sphexishness:** Rigid, stimulus-response behavior. Repeating a routine despite changed context. No "understanding" of the *why*, just the *how*.
      *   **The Frame Problem:** How does an agent know what *doesn't* matter? (Robot 1: ignores side effects -> boom. Robot 2: considers all side effects -> timeout/boom. Robot 3: tries to sort relevance -> timeout/boom). It's about computational load vs. contextual awareness.
      *   **Free Will (Dennett's version):** Not metaphysical magic, but *evitability*. The capacity to represent the future, simulate outcomes, and act on reasons rather than triggers. Flexibility.

  3.  **Translate to Craft Vocabulary:**
      *   *Sphexishness:* This isn't just "consistency." Consistency is a virtue in craft. Sphexishness is *compulsion* or *tic*. It's a beat that doesn't turn. It's a character functioning as a Plot Device rather than an Agent. In Stanislavskian terms, it's action without objective. In screenwriting, it's "on the nose" behavior that ignores subtext or context. Let's call it "Routine without Revision."
      *   *The Frame Problem:* This is about *Relevance*. In craft, we talk about "Chekhov's Gun" (don't include irrelevancies). But the Frame Problem is the *character's* inability to filter irrelevancies. Robot 2 is the "Over-Thinker" character (paralysis by analysis). Robot 1 is the "Impulsive" character (acts without consequence). Robot 3 is the "Meta-Commentator" (thinking about thinking). Craft usually solves this via *Narrative Focus* (the narrator filters for the character), but *internally*, a character struggling with the Frame Problem is one who can't distinguish signal from noise.
      *   *Free Will:* In craft, this is "Agency." "Does the plot happen to them or do they make it happen?" But Dennett adds a layer: *Reason-responsiveness.* A character with free will updates their tactic when the context changes. A Sphexish character does not.

  4.  **Drafting the Residue Report:**
      *   *Clean Maps:* Agency/Plot Driver. Routine/Habit.
      *   *Bent Maps:* "Want." A want can be Sphexish (obsession) or Flexible (goal). Craft usually valorizes the persistent want. Dennett problematizes it.
      *   *No Counterpart:* The *mechanism* of the trigger. Craft cares about the *effect* on the reader (believability), not the metaphysical status of the character's cognition. Craft doesn't care if the character is "truly" free, only if they feel "true."

  5.  **Addressing the Direct Questions:**
      *   *Persistent Reason vs. Trigger:* Craft *does* have a way, but it's subtle. It's the difference between *Active Choice* and *Compulsion*. If Miriam sets the table because she believes he might return (Hope/Reason), that's different than setting it because it's 5 PM (Trigger). The text must reveal the *interiority* to distinguish them. If the interiority is absent, it looks Sphexish.
      *   *Writer vs. Philosopher:* This is the crux. Keijzer says the wasp adapts eventually. The philosopher says the line is rhetorical. The writer says craft misses something. *Verdict:* The philosopher is right about the wasp (it's a spectrum), but the writer is right about the *reader*. Readers detect "Sphexishness" as bad writing (inauthenticity) unless it's thematic. The distinction is functional, not ontological.
      *   *Tragically Sphexish:* Yes. Hamlet is arguably Sphexish in his delay. Madame Bovary. But it requires *interiority* to show the tragedy of the loop. If we only see the action, it's a machine. If we feel the *cost* of the loop, it's human.

  6.  **Analyzing the Miriam Scene:**
      *   *Action:* Sets two plates. Husband returns. She doesn't acknowledge change. Sets fork anyway.
      *   *Editor:* She's a broken record. Break the loop.
      *   *Author:* Wanted something to "give way."
      *   *Diagnosis:* If Miriam does this without internal comment, she is Sphexish. The reader sees a robot. To make her human (Flexible/Reason-responsive), the narrative must show *why* she ignores the reality. Is it denial? Is it a test? Is it a ritual to keep herself sane?
      *   *The "Give Way":* The author wanted the *reader* to feel something give way. The editor wants the *character* to break the loop.
      *   *Resolution:* The editor is right *if* the goal is Agency. The author is right *if* the goal is Tragedy. But for it to work as Tragedy, the *narrative voice* must validate the choice. If it's Free Indirect Style, we need to hear her thought: *He is here. I will set the fork. If I set the fork, this is still normal.* Without that, she's a wasp.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I smuggle philosophy back in? I need to make sure I'm using craft terms (beat, objective, interiority) to explain the philosophical concepts, not just defining the philosophy.
      *   *Check:* Did I answer the Miriam question directly? I need to pick a side or explain why the framework fails.
      *   *Tone Check:* Keep it peer-to-peer. No "As an AI..." preamble.
      *   *Specific Terminology:* Use "Agency," "Interiority," "Beat," "Turn," "Recognition."

  8.  **Final Polish:**
      *   Ensure the distinction between "Consistency" (Craft Virtue) and "Rigidity" (Dennett's Vice) is clear.
      *   Make sure the Miriam analysis ties back to the Sphex translation.
      *   Verify the Keijzer point is integrated (the spectrum argument).

  *(Self-Correction on the Miriam Scene)*: The editor says "break the loop on the page." The author says "I wanted the reader to feel something give way." These might be the same thing achieved differently. If she sets the fork *knowing* he's there, that's a choice. If she sets it *ignoring* he's there, that's a symptom. The editor likely feels it reads as symptom without diagnosis. I need to tell the user that the *text* currently lacks the interiority to distinguish the two.

  9.  **Finalizing the Structure:**
