answer: |-
  This is a sharp dissection. You've identified that the phrase isn't just a description of purges (otherwise the September Massacres would count) nor just a description of elite mortality (otherwise the Sans-culotte would count). It is a specific claim about *political lineage* and *logical necessity*.

  Your tentative rule fails because it focuses on *instrument construction* (who built the Tribunal) rather than *logical authorship* (who defined the terms that made the Tribunal inevitable). Condorcet didn't build the guillotine, but he helped write the definition of "Citizen" and "Traitor" that trapped him. The Sans-culotte didn't define anything; he was the fuel.

  Here is the principle that fits your data, the necessary overturns, and the structural implication.

  ### The Principle of Revolutionary Devouring

  For a death to count as a revolution devouring its child, three clauses must be met:

  **Clause 1: Ontological Membership (The "Child" Test)**
  The victim must be classified by the revolutionary regime as *internal* to the revolutionary project, even at the moment of execution. Their elimination must be framed as a purification of the revolution, not a defense against an external enemy.
  *   **Motivating Cases:** Excludes **Louis XVI/Marie Antoinette** (external/ancient regime), **Princesse de Lamballe** (symbol of the old court), **Charlotte Corday** (external assassin). Includes **Danton, Robespierre, Trotsky**.
  *   **The Fork:** This clause forces a distinction between an *enemy* and a *deviant child*. An enemy opposes the revolution's existence; a child opposes the revolution's current direction.

  **Clause 2: Institutional Causality (The "Devouring" Test)**
  The death must be effected by the revolutionary state's logic or institutions, not by mob violence, natural causes, or the chaos of civil war. The revolution must *process* the victim.
  *   **Motivating Cases:** Excludes **September Massacres** (mob violence, no institutional logic), **Mirabeau's biological death** (illness). Includes **Robespierre** (Convention decree), **Condorcet** (Outlawry decree), **Trotsky** (NKVD operation authorized by the State).
  *   **The Nuance:** This handles **Condorcet**. He didn't build the Tribunal, but he was killed by the *Outlawry* status created by the Revolution he served. The instrument is the *status of illegitimacy*, not just the guillotine blade.
  *   **The Overturn:** You excluded **Mirabeau's posthumous erasure**. Under this clause, the *removal from the Panthéon* counts as devouring (institutional repudiation), even if the biological death didn't. It is the political death that matters.

  **Clause 3: Symbolic Supersession (The "Tragedy" Test)**
  The victim must embody a specific *phase* or *principle* of the revolution that the surviving regime must negate to consolidate power. The victim is not killed for what they *did* (conspiracy), but for what they *represent* (a past version of the revolution that is now an obstacle).
  *   **Motivating Cases:** Excludes **The Rank-and-File Sans-culotte**. He is fuel, not a symbol. His death reduces the revolution's manpower, but it does not negate a political phase. Excludes **The Plotting Jacobin** (see below). Includes **Danton** (represents the transition from Terror to Mercy), **Hébert** (represents the transition from Chaos to Order), **Trotsky** (represents Internationalism vs. Socialism in One Country).
  *   **The Overturn:** You hesitated on the **Rank-and-File Sans-culotte**. This clause confirms your gut: he does not count. The metaphor is inherently elitist. It describes the consumption of *leadership and legacy*, not the body count of the faithful. A revolution *spends* its soldiers; it *devours* its architects.

  ---

  ### Application to Your New Cases

  **1. The Princesse de Lamballe (September 1792)**
  *   **Verdict:** **Does Not Count.**
  *   **Reasoning:** Fails Clause 1. She was the Queen's confidante, ontologically tied to the Ancien Régime. She was the *meal*, not the child. Her mutilation was ritualistic consumption of the enemy, not the purging of a revolutionary element.

  **2. Charlotte Corday (July 1793)**
  *   **Verdict:** **Does Not Count.**
  *   **Reasoning:** Fails Clause 1. She was a Girondin sympathizer but acted as an external assassin. She never held power within the revolutionary structure she killed (Marat). She is a counter-revolutionary agent, not a child of the Republic.

  **3. A Jacobin who *really* plotted against the Committee and was caught**
  *   **Verdict:** **Does Not Count.** (This is the hard overturn).
  *   **Reasoning:** Fails Clause 3. If the plot is *real* (e.g., taking foreign gold to overthrow the government), they have ontologically defected to the enemy (Clause 1 failure). The "Devouring" metaphor relies on the *tragedy* that the victim was loyal to the Revolution, just the "wrong version" of it. If they are actual traitors, the revolution is defending itself, not eating its young. The phrase applies to *imputed* treason (Danton, Bukharin), where the "crime" is political obsolescence. Real treason makes them enemies, not children.

  **4. Someone purged and scrubbed, who dies of old age abroad**
  *   **Verdict:** **Counts.**
  *   **Reasoning:** Meets all three. They were a child (Clause 1), purged by the institution (Clause 2), and represent a superseded phase (Clause 3). The biological death is irrelevant; the *political life* was devoured. The exile is the belly of the beast. (e.g., Deng Xiaoping's purges before his return, or Trotsky before the ice pick).

  ---

  ### The Structural Question: Inevitable or Accidental?

  If you accept this principle—specifically **Clause 3 (Symbolic Supersession)**—you are buying the **Structural** claim.

  Here is why:
  If the devouring were accidental (just coalition fallout), then Danton could have won. Robespierre could have retired. Trotsky could have succeeded Lenin without exile. It would depend on who was smarter or had more guns.

  But Clause 3 argues that the victims are killed because they *embody a phase that must end for the Revolution to survive.*
  *   The Terror could not transition to stability while Danton (the voice of the Terror's indulgence) lived.
  *   The Soviet State could not consolidate as a nationalist bureaucracy while Trotsky (the voice of permanent international revolution) lived.
  *   The Cultural Revolution could not end while the Red Guards (the engine of chaos) remained armed.

  The revolution defines itself by moving forward. To move forward, it must declare its immediate past "counter-revolutionary." Since its immediate past is *its own previous self*, it must criminalize its own architects to legitimize its current existence.

  **The Conclusion:**
  The phrase "revolutions devour their children" is not a warning about bad people winning. It is a description of a **logical paradox**. A revolution cannot institutionalize without killing the very energy that created it.
  *   **Danton** had to die for the Terror to peak.
  *   **Robespierre** had to die for the Terror to end.
  *   **The Sans-culotte** didn't have to die for the logic to shift; he was just collateral.

  By keeping your verdict on the Sans-culotte (excluding him) and Condorcet (including him), you are affirming that this is a tragedy of **ideas and leadership**, not a tragedy of **mortality**. You are accepting that the "eating" is the price of the revolution becoming a State. If it stays a movement, it doesn't eat its children. If it becomes a government, it must.

  **One Honest Overturn:**
  I must push back on your hesitation regarding **Olympe de Gouges**. You said she "never held power." Under Clause 3, she *does* count. She wasn't an administrator, but she embodied the *principle* of universal rights that the Jacobin state needed to suspend to wage war. Her execution was the Revolution declaring that "Rights" were subordinate to "Salut Public." She is a child of the *Enlightenment logic* of the Revolution, eaten by the *Realpolitik* of the Revolution. She fits the structural model perfectly. Don't hesitate on her.

  **Summary:**
  You are buying the claim that **revolutionary legitimacy requires parricide.** It is not an accident of 1794; it is the cost of 1789 becoming a government.
