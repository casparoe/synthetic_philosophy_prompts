  ### Decomposition and Derivation

  To arrive at this figure, I have treated (N) as a conjunctive claim: for the recentness of traditions to act as a *genuine defeater*, specific conditions regarding ethics, grounds of obligation, and social function must simultaneously hold. I have used a multiplicative combination rule. This is because if any single link in the chain fails (e.g., if genealogy never undermines norms, or if history never justified the norms to begin with), the defeater claim collapses. The probabilities below represent my credence that each condition is met *in the context of the Fixed Case*.

  **1. Genealogical Undermining (GU): 0.80**
  *Question:* Does revealing the causal origin of a normative belief (that it was manufactured for political ends) undermine the justification for that belief in the normative domain?
  *Justification:* While the genetic fallacy warns against conflating origin with truth, normative justifications that explicitly rely on "ancientness" or "authenticity" are vulnerable to historical falsification. In the Fixed Case, if the obligation is predicated on a ninth-century battle, proving it was a sixteenth-century invention directly attacks the premise. I assign high probability here because the Fixed Case stipulates the narrative *claims* historical depth; exposing that claim as false undermines the specific argument, even if other arguments exist.

  **2. Historical Ground (HG): 0.70**
  *Question:* Is the "depth" or "authenticity" of a shared past a substantial (even if not exclusive) ground for special obligations in the best justified account?
  *Justification:* This is the strongest bottleneck. If the best account of national partiality relies solely on current cooperation or shared institutions (as many liberal nationalists argue), then historical recentness is irrelevant. However, most accounts of *national* (vs. state) partiality do rely on some narrative of continuity to explain the *special* intensity of the obligation. I grant this significant weight, but discount it from certainty because contemporary theory often shifts the ground to "ongoing ethical community" rather than "ancestral past."

  **3. Functional Independence (FI): 0.50**
  *Question:* Does the successfully manufactured solidarity (redistribution, felt obligation) fail to generate its own normative force independent of the historical truth?
  *Justification:* This is the "efficacy vs. pedigree" hurdle. If citizens cooperate and redistribute based on the myth, a duty of fairness or reciprocity may arise *from the cooperation itself*, regardless of the myth's falsity. I assign 0.50 because it is equally plausible that the functional reality sustains the obligation (undermining N) as it is that the falsified pedigree taints the scheme (supporting N).

  **4. Distinction Idleness (DI): 0.85**
  *Question:* Is the distinction between *Fabrication* (wholesale invention) and *Bricolage* (recombination) normatively idle?
  *Justification:* I judge the distinction to be largely idle regarding (N). Whether the tartan was invented yesterday or stitched from old rags, the normative claim rests on the *continuity* asserted. If the assertion of continuity is the justificatory engine, the mechanical method of construction (wholesale vs. recombination) does not restore the lost depth. I assign high probability that the distinction does not save the tradition from (N).

  **Combination Rule:**
  $$P(N) = P(GU) \times P(HG) \times P(FI) \times P(DI)$$
  $$0.80 \times 0.70 \times 0.50 \times 0.85 = 0.238$$

