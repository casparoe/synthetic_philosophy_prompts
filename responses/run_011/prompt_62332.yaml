  **1. The Sensitivity Term: Historical Ground (HG)**
  This term hangs the heaviest on the final number. Shifting P(HG) by twenty percentage points moves (N) furthest.
  *   *Reasoning:* If P(HG) drops to 0.50 (history is rarely the ground), the total falls to ~0.17. If P(HG) rises to 0.90 (history is almost always the ground), the total rises to ~0.36. This is because if the shared past was never doing the justificatory work, discovering its recentness is normatively inert. The entire force of (N) depends on the past actually mattering in the first place.

  **2. The Uncertainty Term: Functional Independence (FI)**
  This is the term I am least confident in.
  *   *Reasoning:* Philosophical disagreement is sharpest here. Functionalist accounts (e.g., reciprocity among participants in a scheme) suggest the obligation survives the exposure of the myth. Expressivist or Identity accounts suggest the obligation is tainted by the deceit. Evidence that would move this term would be empirical data on whether citizens *withdraw* cooperation upon learning their traditions are invented, or normative argumentation on whether "fairness" can be grounded in a lie.

  **3. Diagnosis of Your Credence (0.25)**
  Your credence of 0.25 is structurally adjacent to my 0.28, but the decomposition suggests you have reached it via the **Historical Ground (HG)** concession, not the Genealogical Undermining (GU) discount.

  *   *Why:* If you were discounting genealogical arguments across the board (low P(GU)), you would likely view the exposure of the "paper trail" as irrelevant to ethics. However, your framing of (N) as the "strong constructivist thesis" suggests you take the historical exposure seriously (high P(GU)). The drag on your number likely comes from the intuition that the "shared past" was never the true engine of the obligation; rather, it was the *current* institutions (the heavy redistribution mentioned in the Fixed Case) doing the work.
  *   *Separability:* The two explanations *can* come apart, though they rarely do in practice.
      *   *Case where they separate:* Imagine an ethno-nationalist theory that explicitly grounds obligations in "blood and soil" antiquity. Here, HG is high (the past is the ground). If that past is shown to be fabricated, GU becomes decisive. (N) would be very strong here.
      *   *Case where they converge:* In liberal nationalism, the "past" is often a proxy for "trust." If trust is maintained by the myth, the myth's falsity (GU) matters only if the past was the ground (HG). Since liberal theory often admits the past is merely instrumental for trust, HG is low, making GU redundant.
      *   *Verdict:* On my numbers, the two are indistinguishable in practice for the Fixed Case because the "best justified account" (HG) already minimizes the role of ancientness. Your 0.25 likely reflects a tacit judgment that the "shared past" is doing less justificatory heavy lifting than the nationalist rhetoric claims.
