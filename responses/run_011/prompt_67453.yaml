  In designing the branching questions, I considered starting with physiological markers (e.g., "Does brain activity match the story?"), questions about the nature of selfhood (e.g., "Is there an 'I' present?"), and queries regarding the truth-value of dream reports (e.g., "Is the report false?"). I discarded the physiological question because it turns on empirical data students cannot assess philosophically, and it collapses the metaphysical dispute into a scientific one. I discarded the selfhood question because it relies on the term "subject," which borders on the prohibited vocabulary of "cognitive access" or "phenomenology." I discarded the truth-value question because all positions agree reports can be false; the dispute is about what makes them false. I retained questions about timing, memory stability, and the necessity of reporting because these force the theories to reveal their commitments about where the dream actually lives without requiring technical knowledge.

