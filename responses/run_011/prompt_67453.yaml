  ### 1. Unoccupied Combinations

  | Combination of Answers | Diagnosis |
  | :--- | :--- |
  | **No (Memory) / Yes (Time) / Yes (Knowledge)** | **Incoherent:** If the story is not a memory of a fixed event, the events could not have taken real time to unfold. |
  | **No (Memory) / No (Time) / Yes (Noise Heard)** | **Unattractive:** Claims construction of narrative but insists on real-time perception of external stimuli during that construction. |
  | **Yes (Dream Exists) / Yes (Awake during story)** | **Incoherent:** Contradicts the physiological definition of the case (dreaming of waking while actually awake). |
  | **No (Dream Exists) / No (Eliminativist)** | **Unexplored:** A position claiming dreams exist but are neither experiences, reports, nor brain states fills no current theoretical niche. |

  ### 2. Indistinguishable Pairs

  The tree struggles to cleanly separate **Malcolm's View** and **Dennett's View**. Both land on the same branch (No Memory / No Dream in Non-REM / Asleep during False Awakening). The splitting question ("Is the dream nothing more than the telling itself?") forces a distinction, but in practice, both agree that the *report* is the only verifiable datum. Malcolm says the concept *is* the telling; Dennett says the telling is a confabulation based on brain traces. A single question cannot pry them apart because they agree on the observable outcomes (the report is decisive) and disagree only on the metaphysical status of the brain trace, which the tree's plain-language constraints forbid us from querying directly.

  Similarly, the **Imagination View** and the **Functional Simulator View** are extensionally equivalent in this instrument. Both locate the event in the Episode (during sleep) and both deny that it is a veridical perception of a fixed past. The tree separates them by asking if it is "making things up" (Imagination) versus "running a process" (Simulator), but for a sleeper without introspective access, these feel identical. The distinction relies on a theoretical commitment about the nature of mental activity that the cases alone do not reveal.

  ### 3. Closing Reflection

  Building this instrument reveals that the question "Are dreams experiences?" hides at least three separate questions: one about timing (did it take as long as the story?), one about memory (is the story a copy of an event?), and one about ontology (does the dream exist without the story?). The real work in the debate is done by the second question—memory stability. If the story is not a copy of a fixed event, the "experience during sleep" view collapses regardless of whether brain activity occurred. The timing question is secondary, serving mostly to distinguish between orthodox realism and constructionist views, while the ontology question primarily separates the eliminativists from the conceptual analysts. The debate is not about whether something happened, but about whether the waking story is a record of that thing or a new creation.
