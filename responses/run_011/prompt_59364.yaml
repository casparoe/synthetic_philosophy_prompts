answer: |-
  This is an exceptionally sharp methodological observation. You have correctly identified that "multicausality" is often used not as an empirical finding, but as a rhetorical shield against falsification. You are also right that standard terms like "overdetermination" or "INUS conditions" describe the *structure* of the world, but not necessarily the *structure of the argument*.

  Here is the carving you need for your paper, distinguishing the legitimate ontological claims from the illegitimate methodological maneuvers, along with a coinage for the specific move you are describing.

  ### 1. The July Crisis Move: Disjunctive Sufficiency

  You are describing a situation where a historian posits a set of causes $\{A, B, C\}$ where each is claimed to be *sufficient* for the outcome $E$.
  *   **Logical Form:** $(A \rightarrow E) \land (B \rightarrow E) \land (C \rightarrow E)$.
  *   **The Move:** When evidence undermines $A$, the historian retreats to $B$. When $B$ is undermined, they retreat to $C$. The explanation of $E$ remains intact regardless of the status of individual variables.

  #### The Legitimate Version: Ontological Overdetermination
  This is the concept you already know from Mill or Lewis. It is a claim about reality: two or more distinct causal processes were active and *each* possessed sufficient energy to produce the outcome independently.
  *   **Example:** Two assassins shoot a victim simultaneously; either bullet alone would have been fatal.
  *   **Status:** Empirically verifiable (in principle) by showing that $B$ was operative and sufficient *even if* $A$ had been absent.

  #### The Illegitimate Version: Immunizing Overdetermination
  Since there isn't a standard term for the *rhetorical misuse* of this concept, I propose you coin **"Immunizing Overdetermination."** (You might also call it **"Explanatory Hedging,"** but the former ties it to the Lakatosian/Popperian critique you intuitively identified).

  *   **Definition:** A defensive argumentative strategy where a scholar posits multiple sufficient causes not because evidence demonstrates their independent sufficiency, but to ensure that the falsification of any single cause does not falsify the overall explanation.
  *   **Why it's illegitimate:** It violates the requirement of **Counterfactual Independence**. To claim $B$ is a sufficient cause in an overdetermined system, you must demonstrate that $B$ would have produced $E$ *in the absence of A*. In the July Crisis debate, the "Timetables" argument often relies on the "Alliance" tension to create the fear that makes timetables dangerous. If Alliances are removed, do Timetables still cause War? If the historian hasn't shown that, they aren't describing overdetermination; they are describing a chain where they are swapping links to save the necklace.

  #### The Test: The Counterfactual Independence Test
  To distinguish legitimate overdetermination from immunizing hedging, apply this test:
  > *If Cause A is removed from the historical record, is there positive evidence that Cause B was already primed to trigger the outcome on its own, without the aid of A?*

  *   **Pass:** The bank had fraudulent assets *and* a separate, massive liquidity run unrelated to the fraud. Either would have collapsed the bank.
  *   **Fail:** The bank had fraudulent assets. When challenged, the historian says, "Well, regulation was also permissive." But without the fraud, permissive regulation alone wouldn't have collapsed *this* bank. The "cause" has been swapped, not added.

  ### 2. The Mirror Image: Conjunctive Necessity

  Your "mirror image" is logically distinct but rhetorically identical in its effect (unfalsifiability).
  *   **Logical Form:** $(A \land B \land C \dots \land J) \rightarrow E$.
  *   **The Claim:** All ten conditions were *necessary*.
  *   **The Move:** "You cannot isolate Cause A as *the* cause, because without B through J, nothing happens. Therefore, monocausal analysis is useless."

  #### The Legitimate Version: Conjunctural Causation
  This is what Charles Ragin (QCA) and Mackie (INUS conditions) talk about. Complex outcomes often require a specific "recipe" of conditions.
  *   **Example:** A revolution requires Economic Crisis + Elite Defection + Mass Mobilization. Remove one, no revolution.
  *   **Status:** Legitimate. It acknowledges complexity.

  #### The Illegitimate Version: Causal Dilution (or The Fallacy of Distributed Necessity)
  This is where the historian uses conjunctural causation to evade assigning explanatory weight.
  *   **Definition:** An argumentative strategy where the necessity of multiple conditions is used to imply that no single condition can be critically tested or privileged, rendering the explanation immune to specific counterfactual challenges.
  *   **The Logic Error:** If $A$ is truly *necessary*, then removing $A$ *must* prevent $E$. This makes $A$ highly testable, not untestable. If a historian says, "You can't blame the July Crisis on German aims because Russian mobilization was also necessary," they are committing a category error. Necessity does not dilute responsibility; it concentrates it. If $A$ is necessary, $A$ is a bottleneck.
  *   **The "Other Nine Were Doing the Work" Problem:** You noted that in this scenario, counterexamples are deflected by saying "the other nine were doing the work." **This reveals that the historian is secretly treating the conditions as Disjunctive (Sufficient), not Conjunctive (Necessary).** They are claiming $A, B, C$ are necessary to sound nuanced, but treating them as sufficient to defend against counterfactuals. This is **Modal Ambiguity**.

  ### 3. Are They Opposites?

  Logically, **yes**. Rhetorically, **no**.

  *   **Logic:** One is a claim of **Disjunctive Sufficiency** ($A \lor B \rightarrow E$); the other is a claim of **Conjunctive Necessity** ($A \land B \rightarrow E$). They are Boolean opposites.
  *   **Rhetoric:** Both function as **Immunizing Stratagems**.
      *   *Immunizing Overdetermination* protects the argument by saying: "If you cut this wire, the bomb still goes off (because of the other wires)."
      *   *Causal Dilution* protects the argument by saying: "You can't cut this wire because it's part of a bundle, and analyzing one wire tells you nothing about the bomb."

  Both moves result in the same outcome: The specific causal mechanism becomes impossible to isolate, test, or falsify.

  ### 4. How to Use This in Your Paper

  You have a strong framework for your methods seminar. Here is how to structure the argument:

  1.  **Diagnose the Debate:** Frame the July Crisis seminar discussion not as a disagreement about facts, but as a slide into **Immunizing Overdetermination**.
      *   *Quote/Paraphrase:* "When the alliance system was challenged, the explanation shifted to timetables. When timetables were challenged, it shifted to war aims. While each factor is historically significant, treating them as interchangeable sufficient causes renders the explanation unfalsifiable."
  2.  **Apply the Test:** Use the **Counterfactual Independence Test**.
      *   *Argument:* "For the 'Timetables' thesis to stand as an independent cause (and not just a backup shield), one must demonstrate that mobilization schedules would have triggered a general war even in a diplomatic environment devoid of alliance entanglements. The historical record suggests they would not."
  3.  **Address the Mirror Image:** Briefly note that the opposite error (**Causal Dilution**) is equally dangerous.
      *   *Argument:* "Conversely, claiming that 'everything was necessary' (conjunctural causation) does not absolve the historian of identifying which necessary conditions were the active triggers. A match is necessary for a fire, as is oxygen, but explaining the fire requires identifying the match."
  4.  **Conclusion:** Argue that valid historical causation requires **Causal Specificity**. We must be willing to say, "A was the trigger, B was the context, and C was irrelevant," rather than "A, B, and C were all causes."

  ### Summary of Terms for Your Supervisor

  | Concept | Logical Structure | Legitimate Term | Illegitimate Term (Coinage) | The Test |
  | :--- | :--- | :--- | :--- | :--- |
  | **Multiple Causes** | $A \lor B \rightarrow E$ (Disjunctive) | **Ontological Overdetermination** | **Immunizing Overdetermination** | **Counterfactual Independence:** Would $B$ have caused $E$ without $A$? |
  | **Complex Conditions** | $A \land B \rightarrow E$ (Conjunctive) | **Conjunctural Causation** (INUS) | **Causal Dilution** (or Modal Ambiguity) | **Necessity Check:** Does removing $A$ prevent $E$, even if $B$ remains? |

  **Final Advice:** Your instinct that "falsificationism in causal drag" is exactly right. In philosophy of science (Lakatos), this is called protecting the "hard core" of a research program by adjusting the "protective belt" of auxiliary hypotheses. In history, when we adjust the *causes* rather than the *assumptions*, it becomes **Immunizing Overdetermination**. Use that term. It shows you understand both the history and the philosophy of method.
