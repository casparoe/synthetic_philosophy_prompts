answer: |-
  Your intuition that the economic model "explains away" weakness of will rather than explaining it is philosophically astute. The stalemate arises because you and your friend are using the term "weakness of will" (akrasia) to pick out two different phenomena: your friend is identifying a *behavioral pattern* (dynamic inconsistency), while you are identifying a *normative failure* (acting against one's better judgment).

  Here is an analysis of the conceptual issue through the three points you raised, followed by a verdict on how to recover the phenomenon.

  ### 1. The Sophisticated Agent and the Location of Incontinence

  In the economic literature (following Strotz, 1955), a **sophisticated** agent knows she is time-inconsistent. She anticipates that her future self will succumb to present bias. Consequently, at time $t_1$, she chooses a strategy that maximizes her $t_1$ utility, given the constraint that her $t_2$ self will choose the $t_2$-optimal option.

  **The Conceptual Issue:**
  For the sophisticated agent, there is no moment where she acts against her *current* all-things-considered judgment. At $t_2$, when she consumes the vice, her quasi-hyperbolic discount function dictates that the vice has higher utility than the virtue. Therefore, choosing the vice is locally rational. She is maximizing her utility function *as it exists at that moment*.

  **Is she incapable of akrasia?**
  On the standard economic definition of rationality (maximizing revealed preference), yes, she is incapable of akrasia. Akrasia requires a gap between judgment and action. In this model, judgment *is* the output of the utility function. If the utility function flips, the judgment flips.

  **Where is the incontinence located?**
  If there is a failure here, it is not in the action at $t_2$, but in the **constitution of the agent over time**. The incontinence is located in the inability of the $t_1$ self to bind the $t_2$ self. However, this shifts the locus of weakness from *volition* (failing to do what one thinks best) to *technology* (lacking commitment devices). The sophisticated agent doesn't suffer from weakness of will; she suffers from a lack of precommitment options. She is not weak; she is merely constrained by her own future psychology. This supports your suspicion: the model transforms a moral/psychological failure into a game-theoretic constraint.

  ### 2. Synchronic Judgment vs. Diachronic Plans

  The standard philosophical account of akrasia (e.g., Davidson) is **synchronic**: At time $t$, the agent judges that, all things considered, $A$ is better than $B$, yet intentionally does $B$. The economic model of hyperbolic discounting describes **diachronic** inconsistency: At $t_1$, the agent prefers $A$ at $t_2$; at $t_2$, the agent prefers $B$ at $t_2$.

  **The Conceptual Issue:**
  Substituting diachronic inconsistency for synchronic conflict fundamentally changes the subject.
  *   **Diachronic:** "I planned to diet tomorrow, but now that it's tomorrow, I want cake." This is merely a change of mind driven by a change in temporal proximity. If preferences are sovereign, changing your mind when the object is near is not weakness; it's responsiveness to new data (the "now-ness" of the reward).
  *   **Synchronic:** "I know I should diet right now, even though I want cake right now, but I eat the cake."

  **Does this cost the account its subject matter?**
  Yes. Weakness of will is distinct from mere preference reversal. If I prefer tea to coffee in the morning, but coffee to tea in the evening, I am not akratic; I am variable. For akrasia to exist, there must be a **normative judgment** that persists across the preference shift. The agent must judge, even at $t_2$, that the long-term goal is *better*, despite the short-term utility being *higher*.

  Hyperbolic discounting models the *temptation*, but it does not model the *resistance* or the *failure to resist*. It assumes the higher local utility automatically wins. To capture akrasia, the model must allow for the possibility that the agent judges the local utility to be misleading or normatively inferior, yet follows it anyway. By reducing judgment to utility maximization, the economic model makes it impossible to act against one's judgment, because whatever you do reveals what you judged best at that instant.

  ### 3. Fragmented Selves and the Self-Deception Analogy

  If we treat the agent as a chain of temporal stages with divergent utility functions (the "multiple selves" model), the $t_2$ self who eats the cake is violating the preferences of the $t_1$ self, not her own.

  **The Conceptual Issue:**
  This fragmentation threatens the unity of agency required for responsibility. If Self-1 and Self-2 are effectively different people, Self-2's "betrayal" of Self-1 is no more akratic than me ignoring your resolution to quit smoking.

  **Is this like self-deception?**
  The analogy is illuminating. In classic paradoxes of self-deception, we ask: How can one person both believe $p$ and induce themselves to believe $\neg p$? It requires a split subject. Similarly, if the "weak" agent is just a sequence of different utility maximizers, there is no single subject who is weak.
  *   **If the analogy holds:** The economic model dissolves the agent. There is no "weakness of will," only "conflict of interest between temporal neighbors."
  *   **If the analogy is misleading:** It is misleading because we intuitively feel that the agent *is* one person. We hold people responsible for their past resolutions. We feel regret, not just frustration at a "different self."

  **The Implication:**
  To preserve the concept of weakness of will, we must reject the strong fragmentation thesis. We need an account where the agent is unified enough that the $t_2$ action can be attributed to the $t_1$ judger, even if their utility functions diverge. The economic model, by treating the utility shift as a brute fact of nature (like a change in interest rates), ignores the *agency* involved in maintaining identity over time.

  ### Verdict

  **Your position is conceptually stronger regarding the *phenomenology* of weakness of will, while your friend's position is stronger regarding the *prediction of behavior*.**

  The quasi-hyperbolic model successfully predicts *when* people will exhibit dynamic inconsistency (the akratic *pattern*). However, it explains it away as a *normative* phenomenon because it reduces "good" to "preferred." If "preferred" is defined by the discount function, one can never act against one's own good, only against one's past preferences.

  **Which picture leaves room for genuine weakness of will?**
  Neither picture, as currently described, fully captures it.
  *   The **Friend's Economic Model** eliminates akrasia by defining rationality as local utility maximization.
  *   The **Standard Philosophical Model** posits akrasia but often lacks a mechanism for how a judgment can exist without motivating action (the Humean challenge).

  **What must be added to recover it?**
  To recover genuine weakness of will within a formal model, you must introduce a distinction between **preference** and **endorsement**, and a mechanism for **volitional control**.

  1.  **Second-Order Volitions:** You need a model (like Frankfurt's or Holton's) where the agent has preferences (first-order) and judgments about which preferences to act on (second-order). Akrasia occurs when the first-order preference (cake) overrides the second-order volition (diet), even if the first-order preference yields higher local utility.
  2.  **Willpower as a Resource:** The economic model treats the discount rate as fixed. To model weakness, you must treat **self-control** as a depletable resource or a skill. The agent *could* have acted on the long-term judgment at $t_2$, but failed to expend the cognitive cost to do so.
  3.  **Normative Independence:** You must posit that the "better judgment" is not simply the output of the utility function. It must be an independent standard (a plan, a principle, or a rule) that the agent treats as binding *even when* it contradicts current utility maximization.

  **Conclusion:**
  Your friend has described the *mechanics of temptation*. You are looking for the *ethics of surrender*. The economic model explains why the hill gets steeper as you approach the cake; it does not explain why you feel you ought to climb it anyway, nor why failing to do so feels like a failure of *will* rather than a mere change in gravitational constants. To bridge the gap, the model must treat the agent not as a sequence of utility maximizers, but as a single planner who can fail to execute her own plan despite having the capacity to do so.
