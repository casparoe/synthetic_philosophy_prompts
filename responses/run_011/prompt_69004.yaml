answer: |-
  Here is the carving you are asking for.

  ### 1. The Structure: **Lexical Threshold View**

  The two-tier structure your sister and her colleagues describe has a established name in ethics: a **Lexical Threshold View** (sometimes called **Lexical Priority**).

  In population ethics and value theory, this is the claim that certain values (or disvalues) are "lexically" superior to others. The term comes from lexicography (dictionary ordering): just as the word "apple" comes before "zoo" regardless of how many "z"s you add to the end of the first word, a "lexical" bad outweighs any amount of a "non-lexical" bad.

  Specifically, because they are focusing on suffering rather than happiness, this is a form of **Negative Lexical Utilitarianism**. Standard Utilitarianism says all suffering is on one scale and can be summed. *Negative* Utilitarianism prioritizes the relief of suffering over the creation of happiness. *Lexical* Negative Utilitarianism adds the constraint you identified: there is a threshold of severity above which suffering cannot be traded off against anything below the threshold, nor compensated by goods below the threshold.

  **Confidence:** 95%. This is standard terminology in population ethics (e.g., Arrhenius, Parfit).

  ### 2. The "Running Out of Scale": **Cardinality Collapse**

  You are correct that "lexical" and "incommensurable" do not capture the specific breakdown you are observing. "Incommensurable" usually means Value A and Value B cannot be compared (e.g., friendship vs. money). Your nurses are arguing about Value A (torture) vs. *more* Value A (more torture).

  The phenomenon where the arithmetic stops working *within* the higher tier—where counting instances ceases to increase the moral weight in a calculable way—does not have a single, universally agreed-upon noun in the literature. It is usually discussed descriptively as "the problem of aggregation within lexical tiers."

  Since you asked for a coinage if none exists, I propose: **Cardinality Collapse**.

  **Definition:** Cardinality Collapse occurs in a lexical value system when, above a specific threshold of intensity, the *number* of instances ceases to function as a multiplier of moral weight. The moral status shifts from a continuous quantity (where $2x > x$) to a binary state (where the presence of $x$ triggers a "forbidden" flag that does not intensify with repetition).

  **Boundary Cases:**
  *   **Falls under Cardinality Collapse:** Your sister's view. One person tortured is a "catastrophe." A billion people tortured is also a "catastrophe." The label "catastrophe" applies to both, and the view offers no arithmetic to distinguish the magnitude of the catastrophe. The counting has collapsed.
  *   **Falls under Cardinality Collapse:** Certain Deontological constraints. If "violating a right" is absolutely forbidden, some hardline deontologists argue that violating one right is impermissible, and violating a billion rights is also impermissible; the *action* is ruled out, not the *sum of consequences*.
  *   **Does NOT fall under Cardinality Collapse:** Your friend's view. She says a billion tortures is *worse* than one, just not tradeable against dust specks. She retains cardinality (aggregation works within the tier) but maintains lexical priority (the tier itself is isolated). This is standard **Lexical Aggregation**.
  *   **Does NOT fall under Cardinality Collapse:** Simple Incommensurability. Saying "I can't compare torture to a headache" is about *ordinal* ranking between tiers. Cardinality Collapse is about the failure of *cardinal* measurement within a tier.

  **Confidence:** 80% (as a descriptive coinage). The phenomenon is well-documented, but the specific label is my own synthesis of "cardinality" (counting) and "collapse" (failure of the function).

  ### 3. Relations to Other Ethical Problems

  **Torture vs. Dust Specks (Parfit's Spectrum):**
  This is the exact engine driving your nurses' argument. Derek Parfit, in *Reasons and Persons*, asked whether it is worse for one person to be tortured or for everyone to get a tiny dust speck in their eye.
  *   **Utilitarian Answer:** If there are enough people, the dust specks sum to more total pain than the torture. (Most people hate this).
  *   **Your Nurses' Answer:** No. Torture is lexically worse. This is the standard **Lexicalist Reply** to Parfit.
  *   **Your Objection:** You have identified the **Aggregation Problem** within the Lexicalist Reply. If torture is lexically worse, does the *amount* of torture matter? Parfit himself noted that lexical views struggle to explain why a world with a billion tortured people isn't just "equally bad" as a world with one, which seems counterintuitive.

  **The Vagueness of the Line (The Sorites Paradox):**
  When you ask where the line is (nausea vs. torture), you are invoking the **Sorites Paradox** (the paradox of the heap). If one grain of sand isn't a heap, and adding one grain doesn't make it a heap, when does it become a heap?
  *   **Your Nurses' Stance:** They are holding an **Epistemicist** view of vagueness. They claim there *is* a sharp line (a specific moment where suffering becomes "absolute"), but human knowledge is too limited to locate it.
  *   **The Counter-View:** Most philosophers of language argue for **Degree Theory** (badness comes in degrees, no sharp line) or **Supervaluationism** (the line is indeterminate). The nurses' insistence that "not being able to find it isn't a problem" is a common pragmatic move in clinical ethics, but it is philosophically contentious. It allows them to act *as if* there is a line without defending its location.

  **Small Bads Adding Up:**
  This is the **Aggregation Problem**. Your nurses are **Non-Aggregativists** regarding the cross-tier trade-off (small bads don't add up to a big bad), but they are split on intra-tier aggregation. This is the exact friction point in modern population ethics: how to avoid the "Repugnant Conclusion" (accepting a vast population with barely worth-living lives) without accepting "Cardinality Collapse" (ignoring the scale of catastrophe).

  ### 4. Confidence and The Weakest Claim

  **Confidence Levels:**
  *   **Lexical Threshold View:** 95% (This is standard terminology).
  *   **Cardinality Collapse (Coinage):** 85% (It accurately describes the logical gap, though it is not yet standard jargon).
  *   **Diagnosis of the Nurses' Disagreement:** 90% (Your sister and her friend are actually holding two distinct, incompatible meta-ethical views that they mistake for one).

  **The Claim I Am Least Willing to Defend:**
  If a working ethicist read this answer, the claim I would be least willing to defend is:

  > *"Your sister basically said yes, that once you're over the line badness isn't the sort of thing that adds up anymore, all you can say is that someone is over it."*

  **Why:** I am interpreting your sister's wine-fueled explanation as a committed philosophical stance (**Absolutism**). However, a working ethicist would argue that your sister likely misspoke. Almost no coherent ethical system holds that one torture is *equally as bad* as a billion tortures. It is more likely she meant that the *decision procedure* is the same (both are forbidden), not that the *value* is identical. Distinguishing between "deontic status" (is it allowed?) and "axiological weight" (how bad is it?) is crucial. If she conflates them, her view is vulnerable to the charge of **moral indifference to scale**, which is widely regarded as a *reductio ad absurdum* of lexical views. I am defending the coherence of her position for the sake of your question, but an ethicist would likely argue the position is incoherent precisely at that point.

  ### Summary for the Next Argument
  You are not strawmanning. You have identified that **Lexical Threshold Views** suffer from **Intra-Tier Aggregative Indeterminacy**. Your sister is advocating for **Cardinality Collapse** (scale doesn't matter above the line), while her friend is advocating for **Lexical Aggregation** (scale matters, but trade-offs don't). They are using the same vocabulary to describe two different mathematical structures. The vagueness of the threshold is a **Sorites** problem they are solving via **Epistemicism**. You can now tell them they are arguing about whether the lexical tier is a **binary switch** or a **separate number line**.
