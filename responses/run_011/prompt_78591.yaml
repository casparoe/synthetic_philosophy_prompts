answer: |-
  This is a classic frustration with the phrase "victors' justice." It functions as a rhetorical shutdown rather than a precise legal argument. Your colleague was shifting between three distinct claims that get bundled into that slogan. They have different truth values, different implications for the legitimacy of the trials, and they apply differently to Nuremberg (IMT) and Tokyo (IMTFE).

  Here is the breakdown of the specific claims hidden inside "victors' justice," followed by an analysis of the philosophical point about the purpose of criminal law.

  ### Part 1: Deconstructing "Victors' Justice"

  The slogan generally conceals three distinct arguments. We need to evaluate each on its own merits regarding Nuremberg.

  #### Claim 1: The Structural Bias Argument
  *   **The Claim:** The tribunal was illegitimate because the judges and prosecutors were appointed solely by the victorious powers (US, UK, USSR, France), meaning the defendants had no neutral arbiter.
  *   **Is it a truism?** Yes. It is an indisputable fact that the bench was composed entirely of Allied appointees. There were no judges from neutral states or the Axis powers.
  *   **Is it true of Nuremberg?** Yes.
  *   **Does it prove the convictions are a sham?** **No.**
      *   *Why:* In legal theory, the origin of the judge does not automatically dictate the outcome. The critical test is whether due process was observed. At Nuremberg, the defendants were given counsel, could cross-examine witnesses, and could introduce evidence.
      *   *The Kicker:* The tribunal acquitted three defendants (Hjalmar Schacht, Franz von Papen, and Hans Fritzsche) and sentenced others to prison rather than death. If it were a pure political show trial designed to liquidate the Nazi leadership, acquittals would not have happened. This suggests the legal process had some independence from the political desires of the victors.

  #### Claim 2: The Selective Prosecution (*Tu Quoque*) Argument
  *   **The Claim:** The Allies committed similar acts (terror bombing of civilians, Soviet invasion of Poland/Finland) but were not charged. Therefore, the law was applied selectively, rendering the convictions hypocritical and invalid.
  *   **Is it a truism?** No. It is an empirical claim about Allied conduct.
  *   **Is it true of Nuremberg?** **Mostly Yes.**
      *   *Why:* The charter specifically excluded Allied actions from scrutiny. The Soviet Union had signed a non-aggression pact with Germany to partition Poland; the US and UK engaged in area bombing of German cities (Dresden, Hamburg). These were not adjudicated.
      *   *Does it prove the convictions are a sham?** **No.**
      *   *Why:* In almost all legal systems, selective prosecution is a defense against *discriminatory* application (e.g., charging only Black defendants for speeding), but it is not a defense against guilt. If you committed murder, the fact that the police didn't arrest your neighbor for murder does not make you innocent.
      *   *Nuance:* While it doesn't legally invalidate the convictions, it does damage the *moral authority* and the precedent for universal application. It suggests the law is political, not neutral. However, it does not support the conclusion that the *German* defendants were innocent of the crimes charged.

  #### Claim 3: The Retroactivity (*Ex Post Facto*) Argument
  *   **The Claim:** "Crimes Against Peace" (waging aggressive war) and "Crimes Against Humanity" were not established crimes in positive international law before 1945. Therefore, punishing them violates the principle of *nullum crimen sine lege* (no crime without law).
  *   **Is it a truism?** No. It is a complex legal historical debate.
  *   **Is it true of Nuremberg?** **Debatable, but largely Yes.**
      *   *Why:* "War Crimes" (violations of Geneva/Hague conventions) were well-established. However, "Crimes Against Peace" relied on the Kellogg-Briand Pact (1928), which renounced war but did not specify criminal penalties for leaders. "Crimes Against Humanity" was a new category created for the trial to cover atrocities against a state's own citizens.
      *   *Does it prove the convictions are a sham?** **This is the only claim that legally threatens the validity.**
      *   *Why:* If the Rule of Law requires fair notice, then punishing someone for an act that was not clearly criminalized at the time is a violation of justice. The Tribunal's counter-argument was that these acts were so morally heinous (*malum in se*) that they were criminal under customary international law even without a specific statute.
      *   *Verdict:* This is the strongest version of the "victors' justice" critique. It doesn't mean the Nazis weren't guilty of moral atrocities, but it does mean the *legal mechanism* used to convict them stretched existing law.

  ---

  ### Part 2: Tokyo (IMTFE) vs. Nuremberg (IMT)

  Your colleague was right to say Tokyo was "worse" regarding this slogan. The "victors' justice" critique lands much harder on the International Military Tribunal for the Far East.

  1.  **No Acquittals:** Unlike Nuremberg, every single defendant at Tokyo was found guilty on at least one count. This removes the evidence that the tribunal was willing to rule against the prosecutors.
  2.  **MacArthur's Influence:** General Douglas MacArthur had sole authority to appoint the judges and review the sentences. The charter was issued by his headquarters, not a multilateral treaty like the London Charter for Nuremberg.
  3.  **The Emperor:** The most significant political decision was the immunization of Emperor Hirohito. Evidence regarding his involvement was suppressed or excluded. This is a clear case of political expediency overriding legal inquiry.
  4.  **Dissenting Opinions:** At Nuremberg, the judgment was unanimous. At Tokyo, Justice Radhabinod Pal (India) wrote a famous dissent arguing the entire trial was illegitimate "victors' justice." Justice Bert Röling (Netherlands) also dissented on several counts. The existence of strong internal dissent highlights the legal fragility of the proceedings.

  **Conclusion on Tokyo:** The slogan does identical *work* (attacking legitimacy), but it has much stronger *evidence* in Tokyo. If your colleague's point is that "International Criminal Law began as a political tool," Tokyo proves that better than Nuremberg. If his point is "Therefore the defendants were innocent," Tokyo proves that less than Nuremberg (since the evidence of Japanese war crimes was overwhelming, even if the trial process was flawed).

  ---

  ### Part 3: The Philosophy of Law (Fair Warning vs. Moral Wrong)

  This is the most sophisticated part of your colleague's argument. He is invoking a debate between **Legal Positivism** and **Natural Law**.

  #### The Distinction
  1.  **Fair Warning (Positivism):** The primary job of criminal law is to allow citizens to plan their lives. You cannot be punished unless a rule existed beforehand that you could have read and understood. This prioritizes *procedure* and *predictability*.
  2.  **Marking Genuine Wrongs (Natural Law):** The primary job of criminal law is to punish moral evil. If an act is inherently evil (like genocide), it is criminal regardless of whether a statute was written down. The law is just "late paperwork" recognizing a pre-existing moral truth. This prioritizes *substantive justice*.

  #### Is he smuggling something in?
  **Yes.** He is smuggling a Natural Law justification into a system that operates on Positivist rules.

  *   **The Smuggle:** Modern liberal legal systems are built on Positivism (*nullum crimen sine lege*). We accept that some morally bad people go free because the police messed up the warrant, or the law was vague. We do this to prevent the state from having arbitrary power to punish anyone it dislikes.
  *   **The Argument:** By saying "it's just late paperwork," he is arguing that the *moral guilt* of the Nazis overrides the *procedural requirement* of prior law.

  #### Does settling this decide the retroactivity objection?
  **It depends on what you think the objection is for.**

  *   **If the objection is Moral:** If you ask, "Did the Nazis deserve punishment?" then settling this in favor of the "Moral Wrong" view defeats the objection. They were morally guilty, so the lack of a statute doesn't change their culpability.
  *   **If the objection is Legal/Institutional:** If you ask, "Was this a valid exercise of legal power?" then the "Moral Wrong" view **does not** defeat the objection.
      *   *Why:* Because if we accept that courts can punish "moral wrongs" without prior written law, we destroy the constraint on judicial power. Today it is Nazis; tomorrow it could be political dissidents defined as "enemies of the people" based on a judge's moral intuition.
      *   *The Nuremberg Compromise:* The Tribunal actually tried to have it both ways. They claimed they were applying Positivist law (citing the Kellogg-Briand Pact and Hague Conventions) to satisfy the *nullum crimen* principle, but they interpreted those treaties through a Natural Law lens to ensure the Nazis didn't escape on a technicality.

  #### The Verdict on the "Late Paperwork" Claim
  Your colleague is half-right. If you view the Nuremberg Trials as an act of **Transitional Justice** (moving from tyranny to rule of law), the "Moral Wrong" view is necessary. If you insist on strict Positivism, the leaders of a totalitarian state can always immunize themselves by never writing laws against their own atrocities.

  However, calling it "just late paperwork" minimizes the danger. It *was* retroactive law. The reason we accept it at Nuremberg is not because retroactivity is fine, but because the alternative (letting the architects of the Holocaust walk free on a technicality) was morally intolerable. We accept Nuremberg as a **necessary exception** to the rule of law, not as a standard application of it.

  ### Summary for your Slack Argument

  1.  **"Victors' Justice" is three arguments:**
      *   *Biased Judges:* True, but acquittals at Nuremberg prove it didn't dictate verdicts.
      *   *Selective Prosecution:* True, but logically irrelevant to the defendants' guilt.
      *   *Retroactivity:* The only serious legal critique. The laws were stretched.
  2.  **Tokyo vs. Nuremberg:** The slogan fits Tokyo much better (no acquittals, MacArthur's control, Emperor immunity).
  3.  **The Philosophy:** Your colleague is arguing from **Natural Law** (punish evil) against a **Positivist** objection (follow the rules).
      *   *Does it resolve the issue?* It resolves the *moral* question (yes, punish them), but it admits the *legal* irregularity.
      *   *The Sham Conclusion:* Neither view supports the idea that the convictions are a "sham." At worst, Nuremberg was a legally imperfect solution to a morally unique catastrophe. At best, it founded modern International Criminal Law by establishing that "I was following orders/statutes" is not a defense against humanity.

  If he wants to claim the convictions "don't count," he has to argue that procedural purity is more important than punishing genocide. That is a defensible philosophical position (strict legalism), but it's a hard sell in a workplace Slack channel.
