answer: |-
  You are correct to suspect that standard legal or aesthetic categories do not cleanly cover this ground. You are describing an ontological shift that is sociological in mechanism but economic in consequence.

  Here is the analysis of existing concepts, followed by the carving you requested.

  ### 1. Existing Concepts and Their Failures

  There are three established frameworks that approach your problem, but each fails on at least one of your two criteria (the undatable shift or the value of refusal).

  **A. The Institutional Theory of Art (Dickie/Danto)**
  *   **The Concept:** An object becomes art when the "artworld" (curators, galleries, critics) confers that status upon it.
  *   **Where it fits:** It explains how the panels are art now despite your aunt's intent. The gallery's interest is the conferral.
  *   **Where it fails:** It treats the status change as an event (the conferral). You describe a *gradient* ("arrived gradually," "nobody in particular"). Institutional theory struggles to explain why the status is reversible if the gallery loses interest; usually, once something enters art history, it remains art even if the market cools. It also does not account for why the *refusal* adds value; under strict institutional theory, the maker's intent is irrelevant, not an asset.

  **B. Art Brut / Outsider Art (Dubuffet)**
  *   **The Concept:** Art created outside the boundaries of official culture, often by the isolated, untrained, or institutionalized, driven by an internal compulsion rather than a desire for exhibition.
  *   **Where it fits:** The biography (isolated, untrained, private) matches perfectly. The market category exists and knows how to price this.
  *   **Where it fails:** *Art Brut* presupposes a *creative impulse*. Dubuffet collected work from psychiatric patients who felt compelled to create. Your aunt explicitly framed the work as *maintenance* ("paint stopped the damp"). If the maker's own testimony defines the object as utilitarian repair, it technically falls outside the definition of *Art Brut*, which requires the object to be a product of expression, however private.

  **C. The Readymade (Duchamp)**
  *   **The Concept:** An ordinary utilitarian object designated as art by the selection of an artist.
  *   **Where it fits:** The object was utilitarian (floorboard/door) and is now art.
  *   **Where it fails:** The Readymade requires the *artist's* act of selection and designation. In your case, the designation was performed by third parties (nephew, curator, executor) against the maker's will. This is a **Readymade without an Artist**.

  ### 2. The Gap

  There is no single established term that captures both the **posthumous, undatable ontological shift** and the **economic valorization of the maker's disavowal**.

  The nearest sociological concept is **"Posthumous Consecration"** (Bourdieu), but this describes the process, not the object's status. The nearest market term is **"Naive Art,"** but this implies a lack of skill, not a lack of intent.

  Because no existing term fits, I propose the following carving.

  ### 3. Proposed Term: "Adventitious Art"

  **Definition:**
  *Adventitious Art* refers to physical objects that acquire aesthetic status posthumously through external curation, where the maker's explicit disavowal of artistic intent functions as a primary metric of authenticity and value. The status is contingent, reversible, and emerges from a sequence of social validations rather than a singular declarative act.

  **The Carving (Edges and Boundaries):**

  To define the concept, we must define where it *ends*.

  **1. The Living Maker Edge**
  *   **Can this happen to a living maker who disavows?**
      *   **No.** If the maker is living, the status is **"Adversarial Art"** (or a Hoax/Prank).
      *   *Reasoning:* A living maker retains the legal and moral right to destroy the work or issue a cease-and-desist regarding its classification. The "Adventitious" status relies on the maker's silence (death) to solidify. If a living artist says, "This is not art," and the gallery shows it anyway, the tension becomes the work (conceptualism), but it is not *Adventitious*; it is *Conflictual*. The "purity" of the refusal is lost because the refusal can be overridden in real-time.

  **2. The Scientific Analogy Edge**
  *   **Can this happen to a scientist who never claimed a discovery?**
      *   **No.**
      *   *Reasoning:* Scientific priority is objective; aesthetic status is normative. If a scientist derives a formula but calls it "scribbles," and a peer later verifies it, the scientist is credited with the *discovery*, not the *intent*. The formula was always true. In *Adventitious Art*, the panels were *not* art until the gallery said so. The status is not discovered (like gravity); it is imposed (like a trust). Therefore, the pattern does not hold for science, only for normative categories (Art, Literature, Music).

  **3. The Reverse Edge (Claimed but Refused)**
      *   **Can it happen in reverse (Maker claims art, World refuses)?**
      *   **No.** This is simply **"Bad Art"** or **"Kitsch."**
      *   *Reasoning:* The market mechanism you describe relies on scarcity and authenticity. A maker claiming status creates supply. The world refusing it creates zero value. *Adventitious Art* relies on the scarcity created by death and the authenticity created by the *lack* of claim. The reverse has no economic engine.

  **4. The Reversibility Edge**
      *   **Is the status reversible?**
      *   **Yes.** This is a critical edge.
      *   *Reasoning:* Unlike canonical art (e.g., a Turner painting remains art even if the Tate closes), *Adventitious Art* is contingent on the maintenance of the narrative. If the gallery loses interest, the panels revert to "painted wood." The status is a **Constructive Designation** (analogous to a constructive trust in law: imposed by operation of circumstance rather than explicit will). If the circumstances (market interest, curatorial narrative) vanish, the trust dissolves.

  ### Summary for the Executor

  You are dealing with **Adventitious Art**.

  *   **Legal Nature:** It is a constructive designation imposed by the art market, not an inherent property of the object.
  *   **Valuation:** The value is derived from the "Authenticity of Negation" (the proof that she didn't do it for money).
  *   **Risk:** The status is fragile. It depends on the gallery maintaining the narrative. If they deaccession the work without a story that preserves the "refusal," the assets may revert to their pre-classification value (junk/firewood).
  *   **Action:** Your fiduciary duty is to treat them as assets *while the designation holds*, but you should be aware that the provenance file (the note asking for them to be burnt) is now the primary certificate of authenticity. Do not lose the note.

  This classification isolates the specific vulnerability you identified: the status exists only so long as the artworld agrees to ignore the maker's instructions.
