answer: |-
  **Archive:** The Oakhaven Plantation Provision Ledger (1830–1840), a bound volume recording weekly food rations issued from the central storehouse to enslaved families, indexed by cabin number.

  **Scenario 1:** A historian investigates whether pregnant enslaved women received extra rations, a practice mandated by some benevolent owners but often ignored. The ledger contains a specific column for "Maternity Supplements," which remains blank for every entry across the decade. Conditioning on the high overall completeness of the ledger regarding standard rations, the historian infers that the practice of issuing maternity supplements effectively did not exist at Oakhaven. She is correct; the overseer strictly adhered to a minimum-subsistence policy, and because all food flowed through the central storehouse to be counted against the annual budget, any deviation would have necessitated an entry. The silence of the column accurately reflects the absence of the practice.

  **Scenario 2:** A different historian examines the same ledger, observing the identical blank "Maternity Supplements" column and the same high completeness rate for standard rations. She infers that maternity supplements were not issued. She is incorrect; the practice was common, but the owner encouraged overseers to draw extra provisions from a private garden and livestock pen to avoid inflating the central storehouse's depletion rates, which were tied to the overseer's performance bonus. The recording habit was structurally bound to *budgeted* stock, not *nutritional* flow. The surface evidence is indistinguishable from Scenario 1, but the silence here documents an accounting boundary rather than a material absence.

  ***

  ### The Check

  **The Likelihood Claim**
  In both scenarios, the historian is leaning on the likelihood ratio $P(\text{Silence} | \text{Practice}) / P(\text{Silence} | \text{No Practice})$. She assumes this ratio is low (i.e., silence is much more likely if the practice didn't happen). In Scenario 1, this holds because the administrative process captures all material flows; $P(\text{Silence} | \text{Practice}) \approx 0$. In Scenario 2, this breaks because the administrative process filters by *source* rather than *event*; $P(\text{Silence} | \text{Practice}) \approx 1$.

  **The Structural Feature**
  The single structural feature doing the work is **Administrative Coupling**: the degree to which the social or material phenomenon of interest is inextricably linked to the specific bureaucratic trigger that generates a record. In Scenario 1, the phenomenon (issuing food) is coupled to the trigger (storehouse withdrawal). In Scenario 2, they are decoupled (issuing food $\neq$ storehouse withdrawal).

  **Weakening the Feature**
  If you weaken the coupling (e.g., allow 10% of rations to come from uncataloged sources), the Bayesian inference degrades proportionally. The silence becomes ambiguous evidence rather than negative evidence. The posterior probability of the practice existing stops converging on zero and stalls at the prior, rendering the archival silence "structurally useless" for settling the question.

  **The Bayesian Rescue**
  Could a Bayesian rescue Scenario 2 by conditioning on a more finely grained model of who got recorded? **No, not without external information.** To rescue the inference, the historian must condition on the hypothesis $H_{rule}$: "Records are generated only by central storehouse withdrawals." However, because the surface evidence (the ledger itself) is identical in both scenarios, the data cannot update the probability of $H_{rule}$ versus the competing hypothesis $H_{total}$: "Records are generated by all withdrawals." Without an external anchor to distinguish which recording rule is in operation, the Bayesian is stuck with an underdetermined likelihood function. She cannot derive the recording rule from the silence itself; she must import it. This confirms your thesis: where the recording rule is opaque, conditioning on the "recording rate" is impossible, and the Bayesian line fails.
