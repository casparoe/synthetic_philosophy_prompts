          *   *The Baseball-Bat Case:* Hitting someone with a bat to prevent a slightly worse outcome for others. Nozick argues against sacrificing individuals for the greater good (side constraints).
          *   *The Brutalization Argument:* Cruelty to animals might make us cruel to humans. Nozick acknowledges this but wants a direct reason why harming animals is wrong *in itself*, not just instrumental.
