't feel great calling it simply false, and "the present king of France is not bald" also seems not-true on one reading and true on another, and the two sentences look like they contradict each other, which bugs me. (8) "The number of planets is odd" seems perfectly fine and doesn't feel like it's about any object in the way my friend's name is about her, but if nothing is being picked out, why does swapping in a different co-referential or equally abstract description inside "Mary believes the number of planets is odd" change the truth value? (9) And our TA threw "the average American has 2.4 children" at us — nobody would deny that sentence, but it can't be about a person, and it isn't literally true of anyone, so some of these expressions aren't even trying to refer.

