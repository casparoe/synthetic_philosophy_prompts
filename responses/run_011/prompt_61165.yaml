answer: |-
  There is no single, settled canonical name for this specific dialectical configuration in the literature. It is frequently encountered in debates over personal identity, skepticism, and consciousness (e.g., in discussions of Parfit, Putnam, or Chalmers), but it is typically subsumed under broader headings like "skeptical underdetermination," "the problem of other minds," or "verificationist challenges."

  However, the pattern you have isolated is distinct from standard underdetermination because of the **symmetric mobilization of the neutrality**. In standard underdetermination, the neutrality of the data leads to a suspension of judgment. In your pattern, the neutrality itself becomes the premise for *contradictory* positive conclusions.

  For the purposes of your chapter, I propose defining this as **"The Indiscernibility Impasse."**

  Below is the carving you requested: a definition, its conditions of application, its distinction from neighboring concepts, and an analysis of the four boundary conditions you specified.

  ### 1. Definition and Conditions

  **The Indiscernibility Impasse** is a dialectical state arising between two hypotheses ($H_1$ and $H_2$) regarding a contested property $P$ (e.g., survival, consciousness), characterized by the following four conditions:

  1.  **Empirical Equivalence:** Both $H_1$ and $H_2$ predict the same set of first-person or behavioral data ($D$).
  2.  **Undercutting Explanation:** $H_2$ explains the presence of $D$ not by affirming $P$, but by positing that the mechanism producing $D$ is decoupled from $P$ (e.g., the reporting apparatus is malfunctioning, simulated, or replaced).
  3.  **Mutual Acceptance of Neutrality:** Both parties agree that $D$ cannot empirically discriminate between $H_1$ and $H_2$.
  4.  **Divergent Metaphysical Principles:**
      *   Party A (Optimist) infers from the neutrality that no metaphysical difference exists (a Verificationist or Parity principle: *indiscernibles are identical*).
      *   Party B (Pessimist) infers from the neutrality that the subject is epistemically severed from the metaphysical truth (a Realist or Skeptical principle: *indiscernibles may be distinct*).

  ### 2. Distinction from Neighboring Concepts

  *   **Vs. Empirical Underdetermination:** Standard underdetermination is static; it describes a relation between theories and data where the data fails to select a winner. The *Impasse* is dynamic; it describes how the *failure of selection* is actively recruited by both sides as positive evidence for their respective metaphysical commitments.
  *   **Vs. Argument from Ignorance (*Ad Ignorantiam*):** An argument from ignorance is asymmetric (e.g., "You cannot prove I am wrong, therefore I am right"). In the *Impasse*, both sides utilize the absence of evidence. The Optimist says, "No difference is detectable, therefore there is none." The Pessimist says, "No difference is detectable, therefore you cannot claim there is one." The symmetry distinguishes it from the fallacy.
  *   **Vs. Self-Sealing Arguments:** A self-sealing argument protects one hypothesis from refutation. In the *Impasse*, the *data* is sealed off (rendered non-discriminating), but the *conclusions* remain contested. The structure protects both hypotheses equally from empirical falsification, forcing the debate into metaphysics.

  ### 3. Edge Conditions and Delimitation

  You asked for specific edges on four points. Here is how the *Indiscernibility Impasse* is delimited:

  #### A. Public vs. Private Evidence
  **Does the structure arise when the evidence is public/third-person?**
  **Yes.** The structure does not depend on the privacy of the data, but on the **provenance of the data**.
  *   *Condition:* The Impasse arises in public cases (e.g., a Turing Test) if the behavioral output is generated by the very mechanism whose integrity is contested.
  *   *Example:* If a robot passes a Turing Test, the Optimist says "It thinks." The Pessimist says "It simulates thinking." The Impasse holds because the test measures output, and the Pessimist hypothesizes that output can be produced without the underlying property.
  *   *Limit:* If the evidence is third-person but *independent* of the contested mechanism (e.g., an external scan of biological integrity that the subject cannot fake), the Impasse collapses. The Impasse requires that the evidence be *internal to the system* being tested.

  #### B. Prediction vs. Undercutting
  **Does it arise whenever two hypotheses predict the same datum?**
  **No.** It requires the **undercutting explanation** (Condition 2 above).
  *   *Distinction:* If $H_1$ and $H_2$ both predict $D$ reliably (e.g., both predict gravity will operate), this is standard convergence. The Impasse only arises when $H_2$ predicts $D$ *by compromising the reliability of $D$ as an indicator of $P$*.
  *   *Why:* If $H_2$ does not undercut the datum, the datum remains a shared success condition. The Impasse relies on the Pessimist arguing that the datum is an *illusion* or *artifact* under $H_2$. Without this undercutting, the Optimist's use of the datum is not challenged, and the Pessimist cannot claim the undetectability supports skepticism.

  #### C. Symmetry of Burden
  **Is the symmetry genuine, or does an asymmetry of burden exist?**
  **The symmetry is dialectical, but the burden is epistemically asymmetric.**
  *   *Dialectical Symmetry:* Both sides are logically entitled to use the undetectability premise. The Optimist uses it to invoke a presumption of continuity (Leibniz's Law); the Pessimist uses it to invoke a possibility of error (Skeptical Hypothesis).
  *   *Epistemic Asymmetry:* The burden of proof is not equal.
      *   The **Pessimist** only needs to establish the *logical possibility* of the decoupling (that $D$ can occur without $P$).
      *   The **Optimist** must establish a *metaphysical principle* that rules out the decoupling (that $D$ necessitates $P$).
  *   *Delimitation:* The Impasse holds only as long as the Optimist cannot justify the Verificationist principle (that detectability is necessary for identity). If the Optimist can show that "identity" is *defined* by continuity of experience, the burden shifts. If "identity" is defined by causal history, the Pessimist gains ground. The Impasse is the stalemate *before* these definitions are settled.

  #### D. Breaking the Symmetry
  **What would a test that actually broke the symmetry look like?**
  Given that any test describable is itself something both hypotheses may predict, a symmetry-breaking test must be **non-functional** and **non-phenomenal**.
  *   *Requirement:* The test must access a variable that $H_1$ and $H_2$ stipulate differs, but which does not supervene on the internal/behavioral data $D$.
  *   *Example:* A test of **Causal History**. If identity requires biological continuity (a substantive metaphysical claim), then a scan revealing the *history* of the atoms (original vs. replacement) breaks the symmetry.
  *   *The Catch:* This only breaks the Impasse if both parties accept that Causal History is relevant to Identity. If the Optimist holds a Psychological Continuity view, the Causal History test is irrelevant to them.
  *   *Conclusion:* There is no *empirical* test that breaks the Impasse universally. The Impasse can only be broken by **stipulating a metaphysical criterion** that one side rejects. Therefore, the *Indiscernibility Impasse* is ultimately a conflict of metaphysical definitions, disguised as an epistemic problem. A "test" only works if it measures a property that both sides agree is constitutive of the person.

  ### Summary for Your Chapter

  You should define the **Indiscernibility Impasse** as the point where empirical equivalence forces a choice between **Verificationism** (no detectable difference implies no difference) and **Realism** (undetectable differences may still obtain).

  It is distinct from underdetermination because it is not merely a lack of data, but a clash over whether detectability is constitutive of the truth in question. It applies to public and private evidence alike, provided the evidence is generated by the contested system. It is dialectically symmetric but epistemically asymmetric (favoring the skeptic on burden of possibility). It cannot be resolved by further functional testing, only by metaphysical stipulation.
