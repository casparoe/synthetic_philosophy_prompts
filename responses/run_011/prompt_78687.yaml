  Right — you're the site director and I'm your finds specialist, and I'm about to make your life difficult. You're a processualist through and through: you think you can get from patterned deposits to what people actually believed by way of formation processes, quantified comparison, and controlled analogy, and you aren't embarassed about saying so. Be sharp, not a caricature — concede the small points readily, never the main one. Stay in character until I say 'stop'. Keep replies to a paragraph or two so it reads like two people arguing over a finds table rather than a paper. Two ground rules: everything you claim about this site has to be traceable to something in the list below (no inventing artifacts, and no "in comparable societies we find…" unless you tell me what licenses the analogy and what would break it); and if you need a fact I haven't given you, ask for it as a conditional — tell me what each possible answer would do to your case before I go look.

  The site. All of this is one room of a burned mudbrick building, and there's no writing anywhere on the mound:

  - about 1,400 fired clay objects, all flattened cones, all within a millimeter of the same size, hand-pinched but nearly identical. None show any wear: no polish, no string marks, no differential patina.
  - the clay is not the local fabric the pots are made of. It's a micaceous clay whose nearest source our survey puts at roughly three days' walk. Nothing else on site is made of it except eleven small figurines, and those come from a different building.
  - our refiring and timing experiments say about two minutes each to make and fire, so the whole lot is something like 400 hours of labor, most of it fuel.
  - roughly 300 of them were found snapped cleanly in half, both halves of each one together, in a shallow pit under the threshold of the room's doorway. The pit was sealed by a plaster floor laid afterwards, so it predates the room's last use.
  - the other ~1,100 came out of the collapse fill: charred grain, sheep and goat bone with cut marks, ash, roof debris. Complete, unbroken, jumbled.
  - the room itself has no hearth, no storage jars in place, no sleeping bench. The domestic-looking material is all in the fill above it.
  - regional survey: nothing like these cones at any site within a day's walk. One site two days east has clay objects of a different shape in a different fabric.

  Now my problem. You want to say the 300 broken under the threshold are an offering — that they show these people thought a doorway had to be given something. But the 1,100 in the burnt fill are, on your own telling, just stuff that came down when the roof went, so you've got one population of the very same object doing heavy interpretive work and one doing none at all. And I can't see how you exclude the duller readings: that these are counters, that snapping one in half is how you settle or cancel something, that the pit is a strongbox and the plaster over it is concealment, and that the whole assemblage is adminstration with a fire on top of it. No texts, no informants, no comparative site with the same objects in a legible context. So: which of the facts above actually separates "they believed" from "they kept books," and which of my dull readings survives your best argument? Because I dont think all of them do, and I think you'll quietly drop one of them to save the rest — so pick your casualty out loud.
