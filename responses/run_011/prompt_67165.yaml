answer: |-
  You are describing something profoundly difficult, and you are right to feel that the existing vocabulary is slippery. What you are witnessing is a recognized ethical crisis in jurisdictions with legal assisted dying (particularly Canada, the Netherlands, and Belgium), but the language often lags behind the reality you are touching every day.

  You are looking for a name for the specific move where a **structurally caused problem is resolved through an individually exercised right.**

  Here is a breakdown of the concepts that come closest, why they feel slightly off, and a proposal for how to name this specific dynamic so you can discuss it with colleagues without losing the nuance you've identified.

  ### 1. The Closest Established Concept: *Structural Coercion*
  In bioethics, the term usually reached for is **Structural Coercion** (or *Circumstantial Coercion*).

  *   **Why it fits:** It acknowledges that coercion does not require a coercer. A gun to the head is coercion; a landscape where all roads but one are blocked is also coercion. If the only reliable, funded, guaranteed option available to a person is death, their "voluntariness" is compromised by the structure, not by a person.
  *   **Why it feels wrong to you:** As you noted, "coercion" implies someone is forcing them. Your clients are not being forced; they are reasoning clearly. They are not panicking; they are calculating. "Coercion" sounds like it invalidates their agency, but their agency is the one thing that remains intact. They are using their agency to navigate a trap.

  ### 2. The Concept You Correctly Rejected: *Adaptive Preferences*
  You mentioned this, and your instinct is sharp. **Adaptive Preferences** (a concept from Martha Nussbaum and Amartya Sen) describes when people lower their expectations to match their oppressive circumstances (the "sour grapes" phenomenon).

  *   **Why it doesn't fit:** You are right. Your clients have *not* lowered their standards. They know they deserve better care, better housing, more time. They are not saying, "I don't need a shower." They are saying, "I cannot get a shower, and I will not live without one." That is not adaptation; that is a refusal to adapt. Calling this "adaptive preference" insults their clarity.

  ### 3. The Sociological Term: *Reification of Social Harm*
  Your phrase—"writing down a social failure in the language of a personal fact"—is sociologically precise. In sociology, this is called **Reification**. It is the process of turning a dynamic social relationship (or failure) into a static "thing" or individual fact.

  *   **The Move:** When the system fails to provide care, that failure is a *social process*. When the patient signs the form, that failure becomes a *medical fact* (ineligible for life, eligible for death).
  *   **The Name:** You could call this **"The Medicalization of Neglect."** This captures the conversion process. The suffering is social (neglect), but the solution is medical (dying).

  ### 4. A Proposed Name for the Specific Dynamic
  If you need a term to use with colleagues that captures the *choice* without invalidating the *clarity*, I suggest: **"Constrained Rational Exit."**

  *   **Constrained:** Acknowledges the options are limited by resources, not medicine.
  *   **Rational:** Acknowledges the patient is not depressed or confused; the math makes sense given the inputs.
  *   **Exit:** Neutral term for the outcome.

  However, if you want to name the *ethical problem* (the thing that keeps you up at night), the most accurate phrase currently emerging in disability ethics is **"The Privatization of Structural Failure."** The state fails to provide public goods (care, housing), and the individual is left to privately solve the problem, with death being the only solvable option.

  ### 5. Distinguishing the Edge Cases
  You asked where the line is between this phenomenon and "unbearable suffering with no social component." This is the hardest part of your job. Here is a framework used in bioethics to distinguish them:

  **A. The Counterfactual Test (The "Magic Wand" Test)**
  *   *Question:* If you could wave a wand and provide 24/7 care, a ground-floor apartment, and daily family contact tomorrow, would the request for assisted dying remain?
  *   *This Phenomenon:* The request dissolves. The suffering was contingent on the lack of resources.
  *   *Pure Medical Suffering:* The request stands. The suffering is intrinsic to the pathology (e.g., intractable pain, loss of bodily function that care cannot mitigate).
  *   *The Gray Zone:* Many clients are in the middle. They have medical suffering *compounded* by social suffering. The question is: Is the social suffering the *tipping point*? If removing the social burden makes life livable, you are in the realm of structural failure.

  **B. The "Fixability" Distinction**
  *   *Structural:* The barrier is external (money, policy, distance).
  *   *Medical:* The barrier is internal (nerve damage, muscle atrophy, cognitive decline).
  *   *Edge Case:* When the medical condition *creates* the social barrier (e.g., "I need a lift because I can't walk," but the lift is unfunded). This is where the Social Model of Disability argues the suffering is still social, because the technology exists but isn't provided.

  **C. The "Refusal of Care" Distinction**
  *   Sometimes a patient is offered the housing and the care and says, "No, I still want to die." That is **Autonomous Exit**.
  *   When they say, "I want the care, but it isn't there, so I will die," that is **Constrained Rational Exit**.

  ### 6. Why This Matters for You
  You are experiencing **Moral Distress**. This occurs when you know the ethically right thing to do (advocate for housing/care), but institutional or legal constraints prevent you from doing it, forcing you to participate in a process (assisted dying) that feels like a substitute for care.

  Naming this is not just semantic; it is protective. If you call it "coercion," you might feel you have to stop the process. If you call it "autonomy," you might feel you have to ignore the context.

  If you call it **"Constrained Rational Exit within a Context of Structural Neglect,"** you hold both truths:
  1.  The patient's decision is real, clear, and must be respected (Autonomy).
  2.  The system has failed this person, and your signature is inadvertently ratifying that failure (Justice).

  ### Summary for Colleagues
  If you need to raise this in a meeting, you might say:

  > "I am seeing a pattern of **Constrained Rational Exit**. These clients are not depressed, and their judgment is clear. However, their suffering is primarily **socially contingent** rather than medically intractable. They are not adapting to their circumstances; they are accurately identifying that death is the only guaranteed service available to them. We are effectively **medicalizing distributive failures**. I need us to have a language for distinguishing when we are honoring autonomy versus when we are managing a lack of resources."

  This allows you to honor the client's clarity without absolving the system of its failure. It names the move without blaming the victim or the coordinator. It is, as you said, a social failure written in the language of a personal fact. Naming it is the first step in ensuring that language doesn't become the only story told.
