answer: |-
  **OMNITEMPORAL RATING SERVICES**
  **Criteria Methodology: Regime Durability Index (RDI)**
  **Document ID: OTS-2024-BaseRate-Rev4**

  **1. Objective and Scope**
  The Regime Durability Index (RDI) estimates the remaining operational lifespan of a sovereign political order. The methodology relies exclusively on the outside view. No expert judgement regarding current leadership, economic fundamentals, or military capacity is permitted. Durability is derived solely from the base rate of collapse within a constructed reference class of comparable polities.

  **2. Reference Class Construction**
  To ensure statistical validity, the reference class comprises twelve (12) polities selected for structural similarity to the Client. Comparability is defined by founding mythos complexity and administrative density. The selected class includes: *The Ostral Union (85 yrs)*, *The Free State of Kev (42 yrs)*, *The Second Directorate (110 yrs)*, *The Pan-River Confederacy (65 yrs)*, *The Iron Prefecture (90 yrs)*, *The Western Compact (120 yrs)*, *The New Dawn Collective (35 yrs)*, *The Central Basin Authority (78 yrs)*, *The Coastal Hegemony (55 yrs)*, *The Highland Protectorate (105 yrs)*, *The Unified Zones (60 yrs)*, and *The Transitional Council (40 yrs)*.

  The arithmetic mean lifespan of the reference class is 73.75 years. The standard deviation is 28.4 years.

  **3. Individuation and Continuity**
  A critical methodological challenge involves defining when a polity ceases to exist. The Agency employs the Administrative Continuity Test. If a regime undergoes civil conflict, territorial partition, or constitutional suspension but retains the original bureaucratic taxonomy and capital city, it is coded as a single continuous entity rather than a successor state. Interruptions are treated as volatility events, not termination events. This prevents the artificial fragmentation of long-lived orders into multiple shorter data points, preserving the integrity of the survival curve.

  **4. Base Rate Application and Adjustment**
  Under strict outside-view protocols, a polity exceeding the reference class mean by two standard deviations should be assigned a negative outlook with high probability of terminal collapse within one forecasting horizon. However, raw base rates are subject to a Qualitative Adjustment Framework (QAF). The QAF accounts for narrative cohesion and institutional inertia.

  In the case of the Client (Current Age: 398 years), the raw base rate suggests immediate termination. However, the Client demonstrates unique "historical gravity." The QAF measures the density of foundational storytelling relative to administrative turnover. The Client's ability to reinterpret past crises as foundational myths introduces a structural dampening effect on collapse probability. This is not expert judgement; it is a measurable variable of story-to-bureaucracy ratio. Consequently, the base rate is demoted to a starting anchor, weighted at 15%, while the QAF score is weighted at 85%.

  **5. Excluded Comparables**
  The following polities were screened out of the reference class to maintain methodological purity:
  *   *The Eternal Dominion (600 yrs):* Excluded due to incomplete termination data.
  *   *The Merchant Triumvirate (250 yrs):* Excluded because dissolution was peaceful, not structural.
  *   *The Old Empire (450 yrs):* Excluded as an outlier that skews the downward pressure on longevity.

  **6. Rating Action**
  Based on the adjusted methodology, the Client is upgraded to **AAA (Perpetual)**. Outlook is **Stable**. The data indicates that the Client has transcended the reference class through exceptional narrative integration.

  **7. Limitations and Compensation**
  Forecasts are probabilistic and subject to revision. The Agency receives no compensation contingent on specific rating outcomes. Fees for this methodology review and durability assessment were paid in full by the issuer of the sovereignty being rated.
