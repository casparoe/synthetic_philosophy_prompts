prompt: |-
  Six weeks ago I got talked into chairing the accreditation panel for a small UK charity that awards a quality mark to youth mentoring providers — about thirty of them, reassessed every two years. Six of us on the panel, all practitioners, no philosophers, two hours a month, and I have to minute and sign off every decision. We've already had one appeal and I can see another coming.

  The row we keep having is a version of the old Euthyphro problem, though nobody in the room would put it that way: is a practice good because we give it the kitemark, or do we give it the kitemark because it's good? Providers manage to say both things at once in an appeal — that our criterion isn't actually justified, and that we're perfectly entitled to set our own standards.

  Acting as a metaethicist who's thought hard about divine command theory and the Euthyphro, including the modified versions that try to escape the arbitrariness horn, build me a procedure the panel can run on a draft criterion in about fifteen minutes before we vote: the questions in order, what counts as a sufficient answer to each, where it stops with "this can't be adopted as worded", and where it hands the call back to the panel as a question of our remit rather than of fact. It has to cope with: whether member consensus can be cited as support; whether we can just lean on a statutory requirement or a regulator's list instead of arguing; what happens to awards already made when we revise a criterion; and what an appellant can and can't claim we got wrong. Flag which steps are judgment dressed up as procedure.

  Brainstorm the possible shapes of it first, then commit to one. Then run it on three live criteria: enhanced DBS checks for every mentor; a minimum twelve-month relationship; and that at least 40% of a provider's trustees have lived experience of the service. I'm attached to that last one, so tell me straight if the procedure says it can't stand as worded. Finish with what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Metaethicist familiar with Divine Command Theory (DCT) and the Euthyphro Dilemma (including modified versions).
      *   **Task:** Create a 15-minute procedural checklist for a UK charity accreditation panel to evaluate draft criteria.
      *   **Context:** Small UK charity, quality mark for youth mentoring providers (~30 providers, reassessed every 2 years). 6 panelists (practitioners, not philosophers). 2 hours/month. Chair minutes and signs off. Appeals are happening (one done, one looming).
      *   **Core Problem:** The Euthyphro Dilemma applied to accreditation (Is it good because we mark it, or do we mark it because it's good?). Providers argue both sides during appeals (criterion unjustified vs. you have the right to set standards).
      *   **Specific Requirements:**
          *   Questions in order.
          *   Sufficient answers for each.
          *   Stop conditions ("can't be adopted").
          *   Remit vs. Fact distinctions.
          *   Handle: Member consensus, statutory reliance, retroactivity of revisions, appellant grounds.
          *   Flag "judgment dressed up as procedure."
          *   Brainstorm shapes first, then commit.
          *   Test on three live criteria (DBS, 12-month relationship, 40% trustee lived experience).
          *   Be honest about the trustee criterion (user is attached to it).
          *   Finish with limitations of the procedure.

  2.  **Deconstruct the Philosophical Core (Euthyphro/DCT):**
      *   *The Dilemma:* Is X pious because the gods love it, or do the gods love X because it is pious?
      *   *Accreditation Version:* Is X "quality" because we award the mark, or do we award the mark because X is "quality"?
      *   *Horn 1 (Arbitrariness/Voluntarism):* If we just decide it's good, it's arbitrary. Providers can challenge the *authority* or *rationale*.
      *   *Horn 2 (Independence/Realism):* If it's good independently, we are just measuring it. Providers can challenge the *measurement* or claim the independent standard doesn't exist/apply.
      *   *Modified DCT (Robert Adams, etc.):* God's commands aren't arbitrary because God is essentially loving/good. Applied here: The Panel's standards aren't arbitrary because they are grounded in the Charity's *Mission* and *Safeguarding/Ethical Framework*.
      *   *Solution Strategy:* Avoid pure voluntarism ("because we said so") and pure realism ("this is objectively true"). Aim for *Constructivism* grounded in the Charity's specific telos (purpose). The standard is valid *if and only if* it can be traced back to the charitable objects and evidence of impact/safety, not just panel preference.

  3.  **Brainstorming Procedure Shapes:**
      *   *Shape A: The Logical Flowchart.* Strict If/Then. Good for consistency, bad for nuance. Might stall on "evidence."
      *   *Shape B: The Socratic Dialogue.* Panel asks questions to the drafter. Too time-consuming for 15 mins.
      *   *Shape C: The Burden of Proof Matrix.* Who has to prove what? Good for appeals, maybe less for drafting.
      *   *Shape D: The "Chain of Justification" (Selected).* This mirrors the modified DCT approach. Every criterion must link to a higher "good" (Charitable Object/Safeguarding) without claiming objective moral truth, but also without claiming arbitrary power. It distinguishes between *Constitutive Rules* (you must play chess to win) and *Regulative Rules* (you should move pieces nicely).

  4.  **Developing the "Chain of Justification" Procedure:**
      *   Need to address the specific constraints: 15 mins, 6 practitioners, appeals handling.
      *   Need to handle the "Consensus" trap (Fallacy of popularity).
      *   Need to handle "Statutory" crutch (Is it law or is it best practice?).
      *   Need to handle Retroactivity (Fairness).
      *   Need to handle Appeals (What grounds are valid?).

      *   *Step 1: The Telos Check.* Does this link to the Charity's Objects? (Avoids Arbitrariness).
      *   *Step 2: The Evidence Link.* Is there a causal claim? (Avoids Realism without proof).
      *   *Step 3: The Authority Boundary.* Is this law or policy? (Clarifies Remit).
      *   *Step 4: The Transition Rule.* How does this affect existing members? (Fairness).
      *   *Step 5: The Appeal Boundary.* What can be challenged? (Procedural vs. Substantive).

      *   *Flagging Judgment:* Where do we pretend a value judgment is a procedural tick-box? (e.g., deciding what counts as "sufficient evidence").

  5.  **Drafting the Procedure (Iterative refinement):**
      *   Make it punchy. Practitioners, not philosophers.
      *   Use the Euthyphro insight: The "Good" is defined by the *Mission*, not the *Panel*. The Panel is the *interpreter*, not the *source*.
      *   *Stop Condition:* If it fails Step 1 or 2, it dies. If it fails 3 or 4, it needs modification.
      *   *Remit vs. Fact:* Fact = Does the provider meet it? Remit = Should this be a criterion at all?

  6.  **Testing the Criteria:**
      *   *Criterion 1: Enhanced DBS.*
          *   Telos: Safeguarding (Core to youth work).
          *   Evidence: Statutory requirement usually.
          *   Verdict: Passes easily. It's a threshold, not a quality mark per se, but necessary.
      *   *Criterion 2: 12-month relationship.*
          *   Telos: Impact/Stability.
          *   Evidence: Research on mentoring duration vs. outcomes.
          *   Verdict: Passes, but needs nuance (planned endings?).
      *   *Criterion 3: 40% Trustees with Lived Experience.*
          *   Telos: Governance/Representation.
          *   Evidence: Governance codes vs. specific impact on mentoring.
          *   Risk: Is this *essential* for quality mentoring, or just good governance? If the latter, is it within remit?
          *   User Attachment: I need to be honest. If the link to *mentoring quality* is weak, the procedure flags it. I must not flatter the user.

  7.  **Refining the Output:**
      *   *Tone:* Professional, slightly academic but practical (Metaethicist consultant).
      *   *Structure:* Brainstorm -> Commitment -> The Procedure -> The Test -> Limitations.
      *   *Philosophical Underpinning:* Explicitly mention how this solves Euthyphro (Grounding in Mission rather than Will or Independent Moral Facts).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "Member Consensus"? Yes, under Step 1 (Consensus isn't justification).
      *   *Check:* Did I address "Statutory"? Yes, under Step 2 (Law vs. Standard).
      *   *Check:* Did I address "Retroactivity"? Yes, under Step 4.
      *   *Check:* Did I address "Appeals"? Yes, under Step 5.
      *   *Check:* Did I flag the judgment masks? Yes, need to highlight where "sufficiency" is subjective.
      *   *Check:* The Trustee Criterion. If the charity's object is "youth mentoring," does trustee composition directly affect that? Good governance codes suggest yes, but is it a *quality mark for providers*? It might be scope creep. I need to be firm here.

  9.  **Final Polish:** Ensure the distinction between "Constitutive" (what makes it mentoring) and "Regulative" (how to do it well) is clear, as this helps resolve the Euthyphro tension. (Actually, better to stick to the "Mission-Link" model for simplicity for practitioners).

      *Wait, one nuance:* The user asked to "Flag which steps are judgment dressed up as procedure." I need to make sure these are visually distinct in the final output.

      *Re-evaluating the Trustee Criterion:* If the charity promotes "best practice," governance is part of best practice. However, if the mark is for *service delivery quality*, governance might be secondary. The Euthyphro problem here is: Is it good governance because we say so, or do we say so because it's good governance? The procedure must force the link to *beneficiary impact*. If 40% lived experience trustees doesn't demonstrably improve mentoring outcomes, it fails the "Telos" check relative to the *provider's* service quality. I will be honest: it's vulnerable.

  10. **Finalizing the Plan:**
      *   **Intro:** Acknowledge the Euthyphro parallel.
      *   **Brainstorm:** Briefly outline 3 shapes.
      *   **Selection:** The "Mission-Anchor Protocol."
      *   **The Protocol:** 5 Steps + Stop/Remit logic.
      *   **The Test:** Apply to DBS, 12-month, Trustee.
      *   **Limitations:** What this can't solve (Politics, Resources, etc.).

      *(Self-Correction on "Judgment dressed as procedure"):* I will add specific [FLAG] markers in the text.

      *(Self-Correction on Trustee Criterion):* I need to be careful not to say "No" definitively, but "The procedure requires X evidence which you may not have." I will tell them straight: it's the most vulnerable to the "Arbitrariness" horn.

      Let's write it.cw
answer: |-
  ### Part 1: Brainstorming the Shapes

  You are facing a classic metaethical stability problem. If your standards are just your will (Voluntarism), they are arbitrary and open to appeal on grounds of fairness. If your standards claim to be objective moral truths (Realism), they are open to appeal on grounds of factual accuracy (e.g., "Research doesn't support that 12 months is necessary").

  Here are three procedural shapes we could adopt:

  1.  **The Empiricist Flowchart:** Every criterion must be backed by peer-reviewed evidence.
      *   *Pros:* Defends against the "Arbitrariness" horn.
      *   *Cons:* Paralyzing. Much of youth work is practice-based, not lab-tested. You will fail the "12-month" rule because social science is rarely that definitive. It turns practitioners into librarians.
  2.  **The Democratic Consensus Model:** A criterion stands if 5/6 panelists agree and no more than 30% of providers object.
      *   *Pros:* Fast. Defends against "Authority" challenges (you represent the field).
      *   *Cons:* Collapses into the "Arbitrariness" horn. An appellant can rightly argue that popularity doesn't equal quality. It invites lobbying.
  3.  **The Mission-Anchor Protocol (Selected):** This adapts the "Modified Divine Command Theory" (e.g., Robert Adams). God's commands aren't arbitrary because they flow from His essentially loving nature. Similarly, your criteria aren't arbitrary if they flow necessarily from your Charity's Objects and Safeguarding Duties. It distinguishes between *Thresholds* (must haves) and *Quality Markers* (excellence).
      *   *Pros:* Grounds authority in purpose, not whim. Allows for professional judgment without claiming objective scientific truth.
      *   *Cons:* Requires rigorous definition of the "Mission."

  **Decision:** We are building **The Mission-Anchor Protocol**. It forces you to articulate *why* a criterion serves the charitable purpose, preventing the "because we said so" trap, while acknowledging that you are defining quality, not discovering laws of physics.

  ***

  ### Part 2: The Mission-Anchor Protocol (15-Minute Drill)

  **Instructions:** Run this on any *new* or *revised* criterion before voting. One person reads the question; the Chair records the answer. If any step fails, the process stops or diverts.

  **Step 1: The Telos Link (Purpose Check)**
  *   **Question:** "Which specific clause in our Charity's Objects or Safeguarding Policy does this criterion directly protect or advance?"
  *   **Sufficient Answer:** A direct citation (e.g., "Object 2: Advance education," or "Safeguarding Policy Section 4").
  *   **Insufficient Answer:** "It's best practice," "Everyone else does it," or "We think it's better." (Consensus is not justification).
  *   **Stop Condition:** If no link can be found, **this cannot be adopted.** It is outside remit.
  *   **[FLAG: JUDGMENT DRESSED AS PROCEDURE]:** Deciding *how tight* the link must be is a value judgment. You are procedurally demanding a link, but substantively deciding what counts as "direct."

  **Step 2: The Status Distinction (Law vs. Standard)**
  *   **Question:** "Is this requirement already a statutory obligation (e.g., DBS) or a regulator expectation (e.g., Charity Commission)?"
  *   **Sufficient Answer:** "Yes, it is law" OR "No, this is an additional quality standard."
  *   **Implication:**
      *   If **Yes**: You are not setting a standard; you are checking compliance. You cannot award points for it, only pass/fail.
      *   **No**: You must proceed to Step 3. You cannot lean on statutory authority to shield a voluntary standard from appeal.
  *   **Stop Condition:** If you claim it's statutory but it isn't, **this cannot be adopted as worded.** It must be reworded as a voluntary standard.

  **Step 3: The Causal Claim (Evidence Check)**
  *   **Question:** "What is the claimed mechanism? How does meeting this criterion *cause* or *correlate* with better outcomes for the young person?"
  *   **Sufficient Answer:** A plausible theory of change (e.g., "Longer relationships build trust, which improves resilience") backed by *some* evidence (internal data, sector reports, or established theory).
  *   **Insufficient Answer:** "It feels right."
  *   **Remit Hand-off:** If the mechanism is plausible but evidence is thin, the Panel must vote: "Are we comfortable setting a *leading* standard based on professional consensus?" If yes, minute the lack of evidence as a known risk.
  *   **[FLAG: JUDGMENT DRESSED AS PROCEDURE]:** Determining what counts as "plausible" vs. "speculative" is where your bias enters. This step pretends to be an evidence check but is often a confidence check.

  **Step 4: The Transition Rule (Fairness Check)**
  *   **Question:** "If we adopt this today, what happens to the 30 providers accredited last month?"
  *   **Sufficient Answer:** One of the following:
      1.  **Grandfathering:** Existing awards hold until expiry.
      2.  **Grace Period:** Providers have X months to comply.
      3.  **Immediate Withdrawal:** (Only permissible for Safeguarding/Legal breaches).
  *   **Stop Condition:** If the answer is "They lose their mark immediately" for a non-safeguarding issue, **this cannot be adopted.** It violates legitimate expectation.
  *   **Appeal Ground:** This step defines the *only* valid ground for appeal regarding timing.

  **Step 5: The Appeal Boundary (Jurisdiction Check)**
  *   **Question:** "If a provider appeals this, what are they allowed to challenge?"
  *   **Sufficient Answer:**
      *   **Allowed:** "We met the criterion and you said we didn't" (Fact).
      *   **Allowed:** "You didn't follow the Transition Rule" (Procedure).
      *   **NOT Allowed:** "We don't think this criterion is good" (Policy).
  *   **Remit Hand-off:** This step hands the call back to the Panel. You must agree that once a criterion passes Steps 1-4, its *validity* is no longer up for debate in an appeal. Only *compliance* is appealable.
  *   **[FLAG: JUDGMENT DRESSED AS PROCEDURE]:** This is pure power. You are procedurally defining what counts as a valid argument to insulate your policy choices from challenge.

  ***

  ### Part 3: Running the Live Criteria

  Here is how the Protocol handles your three specific criteria.

  #### 1. Enhanced DBS Checks for Every Mentor
  *   **Step 1 (Telos):** Links directly to Safeguarding Policy. **Pass.**
  *   **Step 2 (Status):** Statutory/Regulatory requirement for regulated activity. **Pass.**
      *   *Note:* This is a Threshold, not a Quality Mark. You cannot award "extra points" for a DBS check. It is Pass/Fail.
  *   **Step 3 (Causal):** Mechanism is risk mitigation. **Pass.**
  *   **Step 4 (Transition):** Immediate withdrawal if missing. **Pass** (Safeguarding exception).
  *   **Step 5 (Appeal):** Appellant can only challenge if the check was actually done. Cannot challenge the requirement itself.
  *   **Verdict:** **Adopt.** This is the easiest case. It avoids Euthyphro entirely because the "Good" is defined by Law, not the Panel.

  #### 2. Minimum Twelve-Month Relationship
  *   **Step 1 (Telos):** Links to "Advancing Education/Wellbeing" (assuming stability aids this). **Pass.**
  *   **Step 2 (Status):** Not statutory. Voluntary standard. **Pass.**
  *   **Step 3 (Causal):** Theory: Trust takes time. Evidence: Mixed (some studies say 6 months is tipping point, some say 12).
      *   *Risk:* Providers will argue the evidence doesn't support *exactly* 12 months.
      *   *Mitigation:* Panel must minute: "Professional consensus indicates 12 months is the threshold for sustained impact."
  *   **Step 4 (Transition):** Grandfather existing matches? If a match is at month 10 when this passes, do they fail?
      *   *Requirement:* Must allow a grace period for active matches.
  *   **Step 5 (Appeal):** Appellant cannot argue "12 months is too long." They can only argue "Our match was 12 months" or "You didn't grant the grace period."
  *   **Verdict:** **Adopt with Caveat.** The wording must allow for "Planned, positive endings" before 12 months (e.g., moving away). If worded as a rigid "12 months or fail," it will fail Step 3 (Causal mechanism broken by rigid application).

  #### 3. At Least 40% of Trustees Have Lived Experience
  *   **Step 1 (Telos):** Links to "Good Governance"? Or "Quality of Mentoring"?
      *   *Problem:* This is the weak point. Does trustee composition *directly* advance the charitable objects regarding *service delivery*?
      *   *Challenge:* A provider can argue: "We have excellent mentors and outcomes, but our trustees are all accountants. How does this affect the young person?"
  *   **Step 2 (Status):** Not statutory. Charity Commission recommends diversity, but not specific % of lived experience.
  *   **Step 3 (Causal):** What is the mechanism? "Better governance leads to better strategy leads to better mentoring."
      *   *Critique:* This is a long causal chain. It is vulnerable to the "Arbitrariness" horn. It looks like social engineering rather than quality assurance.
      *   *Evidence:* Is there evidence that 40% is the magic number? Why not 20%? Why not 51%?
  *   **Step 4 (Transition):** Changing trustee boards takes time (AGMs, recruitment). Immediate failure is impossible. Needs long grace period (12+ months).
  *   **Step 5 (Appeal):** High risk of appeal. Providers will claim this is outside your remit (accrediting *mentoring*, not *boards*).
  *   **Verdict:** **Cannot stand as worded.**
      *   *Why:* It fails Step 1 and 3 relative to the *provider's service quality*. It conflates *organizational health* with *service quality*.
      *   *Fix:* Move this to a separate "Organizational Health" endorsement, distinct from the "Mentoring Quality Mark." Or, reduce it to a "Commitment to recruit lived experience" rather than a hard 40% threshold.
      *   *Hard Truth:* You are attached to this, but in Euthyphro terms, you are trying to make it "Good" simply because you command it, without a tight enough link to the independent "Good" (outcomes for youth). An appellant *will* win on this if they argue the criterion is ultra vires (beyond powers) regarding service quality.

  ***

  ### Part 4: What This Procedure Cannot Do

  I must be clear about the limitations of this metaethical toolkit.

  1.  **It Cannot Resolve Resource Inequity:** A procedure can ensure a criterion is *justified*, but not whether it is *feasible* for smaller charities. The 40% trustee rule might be ethically sound but economically impossible for a small startup. The procedure flags the justification, not the burden.
  2.  **It Cannot Eliminate Politics:** Step 3 (Causal Claim) allows you to minute "Professional Consensus" where evidence is thin. This is where panel bias enters. The procedure forces you to admit it, but it doesn't remove it.
  3.  **It Cannot Stop Bad Faith Appeals:** A provider may still appeal on grounds Step 5 forbids. You will still have to spend time rejecting the appeal. The procedure gives you the *grounds* to reject, not the *immunity* from the process.
  4.  **It Cannot Define "Lived Experience":** The procedure demands you link criteria to the Mission. It does not define your terms. If "Lived Experience" is ambiguous, the criterion remains vulnerable regardless of this checklist.

  **Final Advice:** Use the Protocol to minute your decisions. When the appeal comes, your defense is not "We are the experts," but "We followed the Mission-Anchor Protocol, Step 3, and recorded our rationale." That shifts the debate from *your authority* to *your process*. That is how you escape the Euthyphro trap.
