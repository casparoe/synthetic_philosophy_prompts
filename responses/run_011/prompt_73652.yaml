  ## CRITICAL SUCCESS FACTOR
  **The Reply That Must Land:** **#3 (Violation of Archival Standards).**
  **Why:** The Chair defers to the professional staff on technical matters. If the two Government Archivists and the Labor Historian (3 of 6 votes) declare the proposal "unprofessional" or "non-compliant," the Chair will not approve the budget, regardless of your fiscal arguments. You must convince them that this *strengthens* evidential integrity rather than weakening it. If you lose the professionals, you lose the room.

  ## THE "DO NOT ASK" QUESTION
  **The Question:** "Under parallel description, if a community account names a living individual as a 'scab' or 'informant' and the official record does not, and that individual sues for defamation, who is liable? Does the repository have a duty to verify community claims before publishing them in a finding aid?"
  **Why You Have No Answer:** This touches on Section 230-like protections for archives which do not clearly exist. Admitting you *won't* verify undermines the archive's credibility; admitting you *will* verify kills the "parallel" nature of the project.
  **Deflection Strategy:** "That is a specific legal scenario we will address in the implementation guidelines with the City Attorney. The policy principle is transparency of *perspective*, not verification of *fact*." (Do not elaborate).

  ## BLIND SPOTS & VULNERABILITIES
  **1. The FOIA Trap (Attorney Observer):**
  You plan to keep appraisal rationales. In a municipal repository, **these rationales are likely public records.** If you reject a police union's records and write "due to potential liability exposure," that rationale is discoverable.
  *   *Fix:* Ensure your concession on redacting litigation-sensitive rationales is explicit in the policy text, not just spoken.

  **2. The "Institutionalization of Dissent" (Organizer):**
  The Organizer may argue that by taking custody of dissolving activist records, you are **removing them from the community's reach.** Activist records are often tools for current organizing. Once they are in your climate-controlled vault with access restrictions, they lose their political utility.
  *   *Fix:* Propose a "Community Access Clause" where the originating community gets unrestricted digital access even if the public does not.

  **3. The "Audit" as a Mandate:**
  The Chair may interpret the "Annual Documentation Audit" as a **mandate to collect** the identified gaps. If you name the tenant associations as a gap, the Committee may vote to *require* you to fill that gap without providing new acquisition funds.
  *   *Fix:* Explicitly state in the proposal that the Audit is for **informational and strategic planning purposes only** and does not create a binding acquisition mandate.
