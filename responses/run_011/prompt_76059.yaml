answer: |-
  # JOINT STATEMENT ON AXIOMATIC BARGAINING AND THE CASE OF S′

  **Participants:** The Proponent of the Nash Solution (NBS) and The Proponent of the Kalai–Smorodinsky Solution (KSS).
  **Convenor:** [Workshop Organizer]
  **Date:** [Current Date]

  ### 1. AGREED CLAIMS

  We, the undersigned, affirm the following claims as the common ground of our collaboration. We accept the standard setting of two-person bargaining problems $(S, d)$, where $S$ is a compact convex set of utility pairs and $d$ is the disagreement point, with utilities cardinal and unique up to positive affine transformation.

  1.  **Axiomatic Incompatibility:** The axiom of Independence of Irrelevant Alternatives (IIA) and the axiom of Monotonicity are logically incompatible within the class of selection rules satisfying Pareto Optimality, Symmetry, and Affine Invariance. Consequently, no single selection rule can satisfy all five properties simultaneously.
  2.  **Conditions of Coincidence:** The two prescriptions coincide in symmetric problems where the ideal point lies on the line of symmetry, but they also coincide in specific asymmetric cases, such as the problem $S$ stipulated below. Coincidence in a specific instance does not imply equivalence of the underlying rules.
  3.  **Dynamic Counterparts:** The static axioms correspond to distinct dynamic processes. The NBS corresponds to a concession process in which each party holds out until the parties' willingness to risk breakdown is equalized. The KSS corresponds to a process in which both parties make equal proportional concessions from their ideal claims. We agree these are formal analogies, not necessarily historical descriptions.
  4.  **Non-Cooperative Implementations:** We agree on the theorems stating that a demand game with vanishing breakdown risk and an alternating-offers protocol in the limit of perfect patience both converge on the Nash point. We disagree entirely on what these theorems establish normatively: whether they vindicate the NBS axioms as rational requirements or merely describe equilibrium behavior in specific strategic environments.
  5.  **The Stipulated Case:** In the problem $S$ (triangle with vertices $(0,0), (1,0), (0,1)$, $d=(0,0)$), both prescriptions select $(1/2, 1/2)$. In the problem $S′$ (convex hull of $(0,0), (1,0), (0, 1/5), (1/2, 1/2)$), the NBS selects $(1/2, 1/2)$ while the KSS selects $(2/3, 1/3)$. This divergence occurs despite $S′ \subset S$, the feasibility of $(1/2, 1/2)$ in $S′$, and the fact that neither solution selects any alternative removed from $S$ to form $S′$.

  ### 2. DISAGREEMENTS TABLE

  The following table catalogues the interpretive divergences regarding the stipulated case and the axioms. We agree on the descriptions in the second and third columns as accurate representations of our respective positions.

  | Disagreement | Nashian Formulation | Kalai–Smorodinsky Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Status of the Ideal Point** | The ideal point is an artifact of how the choice set is described; it has no normative weight once the feasible set is fixed. | The ideal point represents a genuine normative reference; it encodes the maximum possible claim each party can assert. | Disputed Classification |
  | **Monotonicity vs. IIA** | Monotonicity begs the question by treating unattainable aspirations as binding claims; IIA ensures consistency regardless of set description. | Monotonicity articulates a fairness intuition; IIA ignores relevant facts about relative bargaining power tracked by the ideal point. | Disputed Classification |
  | **Non-Cooperative Implementation** | Strategic convergence vindicates the axioms; rational agents in the limit must behave according to the NBS. | Strategic convergence describes a specific process; normative fairness is not settled by equilibrium in a threat game. | Disputed Classification |
  | **Interpretation of Case S′** | The KSS is hostage to the destruction of options nobody would choose; the shift from $(1/2, 1/2)$ to $(2/3, 1/3)$ is an instability. | The NBS is blind to facts that fairness plainly tracks; the shift reflects a legitimate change in Player 2's relative potential. | Disputed Classification |
  | **Interpersonal Calibration** | Equalizing proportional gains smuggles in an interpersonal calibration that affine invariance was meant to preclude. | Affine invariance handles scale; proportionality handles fairness without requiring cardinal comparability across persons. | Disputed Classification |

  ### 3. CRUXES

  We identify the following sub-questions as pivotal. For each, we record the test we would accept as bearing on the matter, our prior predictions, and what we would concede if our predictions failed.

  **Crux 1: The Canonical Description of the Feasible Set**
  *   **Sub-question:** Does fixing a protocol for what counts as an alternative dissolve the dispute, or merely relocate it?
  *   **Accepted Test:** Stipulate that $S$ must be defined by physical endowments and technology rather than utility possibilities, fixing the "description" of options.
  *   **Predictions:** The Nashian predicts this stabilizes the solution (removing description-sensitivity). The KS-ian predicts the solution still shifts if physical constraints alter the utility frontier's shape.
  *   **Concessions:** If physical definition stabilizes the KSS, the KS-ian concedes the ideal point was sensitive to framing. If it does not, the Nashian concedes that IIA ignores physically relevant changes in potential.

  **Crux 2: Extension to Three or More Bargainers**
  *   **Sub-question:** Is there a unique extension of the proportional-concession idea to $n \ge 3$ that inherits the two-person axioms?
  *   **Accepted Test:** Existence proof of a solution for $n=3$ satisfying Pareto, Symmetry, Affine Invariance, and a natural generalization of Monotonicity.
  *   **Predictions:** The Nashian predicts impossibility or loss of axiomatic support for the generalization. The KS-ian predicts a coherent generalization exists.
  *   **Concessions:** If impossible, the KS-ian concedes the two-person axiom may be a special-case artifact. If possible, the Nashian concedes IIA is the outlier in the $n$-person context.

  **Crux 3: Empirical Fairness Instructions**
  *   **Sub-question:** Is the dispute settled by how people actually divide a surplus when instructed to be fair?
  *   **Accepted Test:** Subjects given the problem $S′$ and instructed solely to "divide fairly" without strategic threat.
  *   **Predictions:** The Nashian predicts convergence on $(1/2, 1/2)$ (focal symmetry). The KS-ian predicts convergence on $(2/3, 1/3)$ (proportional to ideal).
  *   **Concessions:** If consensus strongly favors one point, the opposing party concedes their axiom conflicts with intuitive fairness (descriptively), though not necessarily normatively.

  ### 4. CLOSING STATEMENT

  We conclude by stating the conditions under which we would abandon our favored axiom and our assessment of the dispute's nature.

  **The Nashian** would abandon IIA if it were demonstrated that adherence to it permits one party to manipulate the outcome by artificially destroying their own feasible options (a "threat to self" that alters the ideal point). **The Kalai–Smorodinsky partisan** would abandon Monotonicity if it were demonstrated that the solution becomes dependent on the inclusion of 'phantom' alternatives that are strictly dominated and never chosen.

  We agree that there is no single piece of evidence currently available that both of us accept as decisive. The non-cooperative theorems favor the Nashian but are rejected as normative proofs by the KS-ian. The intuition of "fairness" in $S′$ favors the KS-ian but is rejected as imprecise by the Nashian.

  **Verdict on the Nature of the Dispute:**
  We conclude that a portion of this dispute is verbal, specifically concerning the **ontological status of the Ideal Point**. If the ideal point is defined as a "claim," the KS-ian is correct; if defined as a "scaling artifact," the Nashian is correct. This verbal disagreement drives the divergence in axioms. However, once this is stripped away, a **substantive remainder** persists: the two rules prescribe different actions in the problem $S′$. We agree to disagree on which action is required, acknowledging that the choice between IIA and Monotonicity is ultimately a choice between two distinct conceptions of rational cooperation, neither of which can be reduced to the other within the stipulated framework.

  ***

  **Signed:**

  _________________________ (Proponent of the Nash Solution)

  _________________________ (Proponent of the Kalai–Smorodinsky Solution)
