  You assume that the idealization operator is a mechanical process we apply from the outside, counting iterations like heartbeats, when it is instead a conceptual search for a fixed point. The authority does not belong to R, nor to an arbitrary R++, but to the limit where preference stabilizes under conditions of full information and perfect rationality. If R+ truly knows more and reasons better, her refusal to change is only authoritative if that refusal survives the very scrutiny she now possesses. If her contentment depends on not knowing how her isolation affects others, or on a misunderstanding of her own capacities, then she is not yet at the limit. The stopping rule is internal to the agent's psychology under ideal conditions: we stop when more knowledge and better reasoning yield no further change in volition.

  Consequently, the dilemma you pose between the Anchorite and the addict is false. If the addict's endorsement vanishes under full knowledge of the harm, it was never idealized preference, merely actual preference dressed up. If the Anchorite's endorsement remains, then it is robust. My view does not promise that everyone will want the same things, only that we should not bind ourselves to ignorance. To ask whether R or R+ holds authority is to ask whether ignorance or knowledge should rule. I hold that the version of the agent who sees the world clearly speaks for the agent more truly than the version who sees it through a glass darkly. If R++ differs from R+, it merely shows R+ was not yet fully idealized; the authority resides in the stable endpoint where no further improvement is possible.

