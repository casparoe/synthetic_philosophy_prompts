answer: |-
  Right, let's settle this before you walk into the seminar room. You know how these students are; they'll cling to Double Effect like a life raft because it lets them sleep at night. They'll say, "The intention is to neutralize the threat, the civilian deaths are merely foreseen side-effects, proportionality is satisfied." Standard utilitarian calculus dressed in Thomistic drag.

  Here's the rub: Anscombe isn't going to let them hide behind the "foresight" distinction if the description of the act is corrupt from the start. In *Mr. Truman's Degree*, her fury isn't just that innocents died; it's that Truman *chose* the killing of innocents as his method. He intended it as a means. Now, look at your drone case. The "signature" element is tricky, but the "casualty accounting" rule—counting every military-age male as a combatant—is where the moral rot sets in. That isn't foresight; that's a redefinition of innocence. If you decide by fiat that a farmer is a combatant so you don't have to count him as a civilian casualty, you aren't applying Double Effect; you're lying about the object of the act.

  But wait, does the deterrence angle hold? Anscombe argued against nuclear deterrence because it required a conditional intention to do evil (kill innocents) if the deterrent failed. Does a signature strike policy involve a conditional intention? Yes, in a sense. The policy is a standing intention to kill anyone fitting a profile, knowing the profile captures innocents. It institutionalizes the willingness to murder. It's not just a tragic side effect; it's baked into the rules of engagement.

  Okay, I'm ready to commit. Here is how you run this.

  ***

  ### The Anscombian Verdict

  Here is exactly where Anscombe's objection bites: it is not the *drone*, and it is not the *foreseen death*. It is the **presumption of guilt**.

  In *Mr. Truman's Degree*, Anscombe argues that the absolute prohibition is against the *intentional killing of the innocent*. The students will try to tell you that because the operators "don't want" the civilian deaths, the deaths are merely foreseen, not intended. You must stop them there. Anscombe's point is that you cannot make an innocent person liable to death by administrative fiat.

  In the munitions plant case, the workers are materially cooperating in the production of instruments of war. They are, in the just war tradition, engaged in the business of harming the enemy. Their deaths, while perhaps regrettable, are not the killing of the "innocent" in the technical sense Anscombe uses (where "innocent" means "not engaged in unjust aggression").

  In your signature strike scenario, the state is declaring that *location* and *gender* and *age* constitute liability. When the state says, "We count him as a combatant unless proven otherwise," it is effectively saying, "We intend to kill this class of people, and we define the class to include those who are not actually combatants." This collapses the distinction between *intended* and *foreseen*. If your plan requires the death of everyone in the strike zone to be considered a "success" (because a surviving "military-age male" is a PR nightmare or a statistical failure), then their deaths are part of the intention. You are using their deaths to close the file. Anscombe would call this **murder**, not war. She would say you have corrupted the concept of "combatant" to evade the absolute prohibition.

  ### The Deterrence/Conditional Intention Objection

  You are right to be fuzzy here; this requires connecting *Mr. Truman's Degree* to her later work on nuclear deterrence (like in *Consequentialism* or her essays on war). Her argument there is that to hold a deterrent, you must form a **conditional intention** to do the act you are threatening. If the act is murdering innocents, forming the intention to do it (even conditionally) is itself morally corrupt.

  Apply this to your "list-making" or the policy level. The policy of signature strikes is a **standing conditional intention**. It says: "If a group of males fits pattern X, we intend to kill them." Since the state admits the pattern is imperfect (hence the need for the "unless intelligence later proves" clause), the state *knows* the intention covers innocents.

  So, yes, she has a second objection aimed at the policy itself, distinct from the individual strike. The policy institutionalizes a corrupt will. It trains the state to hold an intention that violates the absolute prohibition. For Anscombe, a law or policy that commands (or authorizes) the intentional killing of the innocent is not just bad law; it is void of moral authority. It turns the state into a band of murderers operating under a flag.

  ### The Two Surprises

  Here is how you shake the room. They will come in with liberal intuitions about technology and violence. Anscombe will confound them.

  **1. Where she cuts against expectation (The Technology):**
  The students will want to argue that drone warfare is inherently cowardly, or remote, or "unclean," and that this is why it's wrong. Anscombe couldn't care less about the delivery system. She was no Luddite. If you dropped the exact same bomb from a Spitfire in 1944 on the exact same target, her moral judgment would be identical. She would tell your students that focusing on the *drone* is a distraction from the *justice of the act*. If the target were a confirmed combatant, she would have no objection to the drone. The technology is morally neutral; the intention is not. Do not let them turn this into a debate about automation.

  **2. Where their instinct turns out to be right (The Language):**
  The students will feel a visceral disgust at the phrase "casualty accounting" and the bureaucratic rule that counts males as combatants. They will feel this is "dehumanizing." Anscombe would agree with them, but for a deeper reason. She was a Wittgensteinian; she knew that corrupting language is how we corrupt thought. By changing the definition of "combatant" to suit the body count, the state is engaging in a linguistic fraud to hide the reality of murder.
  She would tell your students: "Your instinct is right, but not because it's 'dehumanizing' in a sentimental sense. It is wrong because it is a **lie**. It is an attempt to change the moral reality by changing the labels." She would champion their discomfort with the bureaucracy, not because bureaucracy is inefficient, but because it is the machinery we use to make murder look like bookkeeping.

  **Summary for the Seminar:**
  Tell them Anscombe doesn't care about the drone. She cares that they are calling the innocent "guilty" to make the math work. That isn't Double Effect; that's Double Speak. And for Anscombe, that is where the murder begins.
