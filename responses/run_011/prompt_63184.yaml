answer: |-
  **Project Title:** Updating on the Continuum: A Formal Analysis of Boundary Uncertainty in Probability Kinematics

  **Research Question and Motivation**
  My work in a perception lab involves subjects categorizing colour chips drawn from a smooth continuum. They report categories (e.g., "red," "orange") with graded confidence, but the boundaries between these categories are perceptually unreliable. This empirical setup exposes a specific formal difficulty for Bayesian updating. Probability kinematics (often associated with Jeffrey Conditionalization) updates beliefs by taking a partition of the possibility space and a new probability distribution over its cells as input. The rule preserves conditional probabilities relative to these cells. However, in the case of continuous perceptual evidence, the partition is not given by the evidence but imposed upon it. The continuum allows for arbitrary granularity, and the vagueness of category boundaries means agents cannot reliably locate a chip within a specific cell.

  This generates a instability problem: two agents receiving the same perceptual report but adopting different granularities or boundary locations will derive different posteriors for downstream hypotheses (e.g., "the subject has normal colour vision"), despite sharing the same evidence. This project asks: **Does there exist a constraint on admissible partitions such that posterior probabilities over downstream hypotheses remain stable under refinement of the partition, and if not, does this constitute an impossibility result for kinematic updating on continuous evidence?**

  This question is framed to admit a determinate answer. It is not merely a request for a new updating rule, but an investigation into the sensitivity of existing rules to partition parameters. The outcome will be either a proof of convergence (showing that under specific rationality constraints, granularity does not affect the posterior) or an impossibility theorem (showing that divergence is inherent to the framework).

  **Distinction from Existing Problems**
  A reader might conflate this difficulty with the standard "Input Problem" for probability kinematics or the problem of old evidence. It is distinct from both.

  The standard Input Problem notes that kinematics does not specify *which* partition to use. The usual response is that pragmatic factors or the structure of experience dictate the partition. My project sets this aside to ask a prior question: even if agents agree on the *type* of partition (e.g., colour categories), does the *arbitrariness of the boundaries* within a continuum force divergence? The standard problem assumes a partition is available but unjustified; my problem assumes that for continuous evidence, any sharp partition is technically false to the evidence, and the error propagates.

  This is also distinct from the problem of old evidence, which concerns how to confirm a theory using data already known with certainty ($P(E)=1$). Here, the evidence is uncertain ($P(E)<1$) and structurally vague. The difficulty is not that the evidence is old, but that its representation as a probability distribution over a partition loses information about the continuity of the stimulus.

  Is anything genuinely open here? Imprecise probability frameworks suggest representing belief as a family of functions, one for each admissible carving. While this acknowledges the problem, it does not solve the decision-theoretic paralysis that follows. There is no principled account in the literature of which carvings are admissible beyond "those that seem reasonable," nor is there a formal analysis of whether the resulting family of posteriors converges as granularity increases. This gap is open and amenable to formal treatment.

  **Methodology and Work Plan**
  The project will proceed by constructing a toy model of the colour experiment and analyzing the behaviour of posteriors under varying partition parameters. I will not survey positions but will derive results within a defined formal system.

  *Formal Setup:* I will model the colour space as a unit interval $[0,1]$. A hypothesis space $H$ will represent downstream claims (e.g., properties of the observer). Evidence will be modeled not as a single cell, but as a likelihood function over the continuum. I will compare two updating procedures: (1) standard kinematics on a discrete partition $\Pi_n$ of size $n$, and (2) a limiting case or alternative rule that treats the evidence as continuous. The core metric will be the divergence (e.g., Kullback-Leibler) between the posterior derived from $\Pi_n$ and $\Pi_m$ for the same evidence report.

  *Week-by-Week Plan:*
  *   **Weeks 1-2:** Formalization. Define the continuum model, the partitioning function, and the specific form of the "confidence rating" as a distribution over the continuum. I will codify the standard kinematic rule within this setup.
  *   **Weeks 3-4:** Divergence Lemmas. I will attempt to prove whether the distance between posteriors derived from partitions of size $n$ and $n+1$ approaches zero as $n \to \infty$. If it does not, I will characterize the rate of divergence.
  *   **Weeks 5-6:** Constraint Testing. I will introduce candidate constraints on admissible partitions (e.g., boundaries must align with just-noticeable differences) to see if they enforce stability. I will test whether these constraints are compatible with the agent's uncertainty about boundary location.
  *   **Weeks 7-8:** Synthesis and Write-up. I will interpret the formal results philosophically. If stability is impossible, I will articulate the cost to Bayesianism. If stability is possible, I will define the necessary conditions. The final output will be a draft of the first chapter of my thesis.

  **Criteria for Success and Failure**
  A successful result will take one of two forms. Positively, it will yield a **Stability Theorem**: a proof that if an agent's partition respects specific structural features of the evidence (e.g., symmetry or likelihood support), the posterior converges regardless of granularity. This would vindicate kinematics provided agents adhere to these structural constraints.

  Negatively, success may look like an **Impossibility Theorem**: a proof that for any kinematic rule, there exist admissible partitions yielding arbitrarily divergent posteriors for the same continuous evidence. This would demonstrate that kinematics is fundamentally ill-suited for continuous evidence without supplementary non-probabilistic input.

  Failure would consist of an inability to formalize the "boundary uncertainty" in a way that generates non-trivial mathematics, or if the results turn out to be tautological (e.g., convergence holds only if the partition matches the truth, which is trivial). Given the simplicity of the toy model, total mathematical failure is unlikely; the risk is philosophical triviality.

  **Preference Over Standard Repairs**
  I reject the two standard repairs mentioned in the seminar. The first, redescribing the evidence as "I had an experience as of red," relocates the vagueness into the description of the experience without resolving the updating mechanics. It assumes the agent can be certain about the content of their experience, which my lab data suggests is false; subjects are unsure if they saw red or orange.

  The second, adopting a family of probability functions (imprecise probabilities), concedes that there is no single posterior. While formally coherent, it is pragmatically deficient. It offers no guidance on which function in the set to use for decision-making, effectively suspending judgment indefinitely. My project seeks to determine if the set can be constrained enough to yield a unique or convergent recommendation, thereby retaining the action-guiding force of Bayesianism without pretending the evidence is sharper than it is.

  **Anticipated Objection: Solution in Search of a Problem**
  A committee member might object that this is a solution in search of a problem, noting that actual agents rarely need precise posteriors over colour continua. We get by with coarse categories.

  My response is that the colour case is a proxy for a widespread class of empirical problems. Scientific instrumentation often produces continuous data (voltage, wavelength, frequency) that must be binned for analysis. If Bayesian updating yields different conclusions about a theory depending on arbitrary binning choices, this undermines the objectivity of scientific inference. The colour chip is a controlled environment to test a structural flaw that applies to any domain where continuous signals are discretized for belief updating. If the framework fails here, where the stakes are low, it is vulnerable where the stakes are high.

  **Scope and Limitations**
  This project is scoped for eight weeks of full-time work. The primary risk is that the mathematical analysis of convergence becomes too technical for the allotted time. If the project proves too large, I will cut the investigation of specific constraints (Weeks 5-6). Instead, I will focus solely on the Divergence Lemmas (Weeks 3-4). Establishing that divergence *exists* is a sufficient philosophical result to warrant a thesis chapter, even if I cannot fully characterize the conditions under which it might be mitigated. I will also restrict the hypothesis space $H$ to binary variables to simplify the algebra. I will not attempt to build a full alternative logic of vagueness; the goal is to diagnose the behaviour of standard Bayesian tools under stress, not to replace them entirely. This ensures the project remains a tractable analysis of formal epistemology rather than drifting into pure mathematics or cognitive science.
