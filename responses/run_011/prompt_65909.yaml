  *   **Your view:** You likely treat the preface as a sufficient shield (Sub-question 5 $\approx$ 0.95) and assume the stakes are borne by the reader, not the author. You prioritize the utility of the record.
  *   **Her view:** She likely views the uniform voice as a guarantee (Sub-question 5 $\approx$ 0.20) and sees the citizenship stake as a veto on any unverified claim (Sub-question 6 $\approx$ 0.10). She prioritizes the risk of harm.
