answer: |-
  The rain in New Arcadia wasn't water; it was decoherence data scrolling across the municipal observatory's public feed. Elias watched the droplets smear against the window of his office, each impact logged as a micro-branching event in the city's wavefunction. Most people ignored the feed. They knew the physics: every quantum interaction split the world, and the Observatory just counted the seams.

  Elias was an auditor for Aequitas Mutual. They wrote branch-indexed insurance. You paid a premium now, and if a specific outcome occurred in your branch, your successor got paid. If it didn't, your successor got nothing. Both successors were equally real. The pricing book relied entirely on the squared amplitude of the outcome—the Born rule. It was the only number that mattered.

  Until Elias pulled Policy 909 from the deep archive.

  It was a life assurance contract from thirty years ago, before the Standard Basis Protocol was enforced. The premium was anomalously low. Elias ran the valuation model. The actuaries hadn't weighted the branches by amplitude. They had counted them.

  "Flat rate per branch," Elias muttered, the glow of the screen reflecting in his glasses. "They assumed every outcome was equally real, so every outcome was equally priced."

  He took the file to Director Halloway. Halloway was stirring sugar into tea, the spoon clinking in a rhythm that felt too deterministic for the room.

  "This is a liability," Elias said, sliding the tablet across the desk. "Policy 909 was priced on branch counting. If we honor it under the weighting model, we're solvent. If we honor it under the counting model, we're exposed. But the contract doesn't specify the measure."

  Halloway didn't look up. "It's settled public fact, Elias. The Born rule holds. We price by amplitude. Everyone knows this."

  "Everyone knows it works," Elias said. "Nobody knows why it should, if every branch happens. If counting is the valid measure of existence, this contract is a steal for the client and a catastrophe for us. And counting changes depending on how the Observatory defines a split. Weighting doesn't."

  Halloway finally looked at him, eyes tired. "There is nothing to be uncertain about. The math works. The payouts clear."

  "That's exactly the point," Elias said, leaning in. "If everything happens, there's no uncertainty to price. We're selling insurance against reality itself, but we don't know what unit reality is sold in."

  Halloway waved a hand. "Talk to Mara. She's consulting on the rationality framework."

  Mara worked in a glass-walled booth down the hall, surrounded by haptic displays of decision trees. She was young, sharp, and believed that logic could strangle metaphysics into submission.

  "It's simple," Mara said, not looking up from her simulation. "Any rational agent who cares about their successors and satisfies a few modest axioms is forced to price by squared amplitude. It's a derivation, Elias. You don't need ontology. You just need consistency."

  "Which axioms?"

  "Branching indifference, mostly. If an agent doesn't care about the mere fact of branching, only the rewards, the math forces the Born rule. It's the only stable strategy."

  Elias leaned against the doorframe. "So you're saying we price it this way because a rational person would?"

  "I'm saying a rational person *must*. If you price by counting, you open yourself to Dutch books. You'll lose money in every branch where money matters."

  "Or," said a voice from the corner. Kovacs, a senior adjuster who had been at the firm since before the Standard Protocol, stepped out of the shadows. He looked like he hadn't slept in a week. "Or the axioms were picked to get there."

  Mara sighed. "Here we go."

  "Branching indifference," Kovacs said, walking over to Elias. "You assume the agent doesn't care about extra branches. But that assumption already contains the answer. It assumes amplitude doesn't correlate with the number of successors in a way that matters. You're smuggling the conclusion into the premise."

  "It's not smuggling, it's coherence," Mara snapped.

  "It's circular," Kovacs said. He turned to Elias. "I've seen the logs. The Observatory changed their basis standardization five years after Policy 909 was written. Back then, they logged splits in the position basis. Now it's energy eigenstates. If you count branches, the number changes depending on the basis. If you weight them, it stays the same. The firm has been selling one of these two things for thirty years and cannot tell which."

  Elias felt the weight of the file in his hand. "So what do we tell the claimant?"

  "Mrs. Gable," Kovacs said. "Her husband died in a low-amplitude branch. Safety failure on a maglev train. High amplitude branches, he lived. Low amplitude, he didn't. The policy pays out on death."

  "But if we count branches," Elias said, "there might be more branches where he died than where he lived, depending on how you slice the wavefunction. If we count, she wins big. If we weight, the payout is negligible because the total amplitude of the 'death' sectors is tiny."

  "There is uncertainty," Mara insisted. "Between the measurement and the observation, you really are uncertain which branch you're on. That rescues probability. You don't know which successor you will be."

  "That just relabels the weight as a credence without earning it," Kovacs said. "You're saying 'I feel uncertain' so you assign a number. But why that number? Why squared amplitude and not cube root? The feeling doesn't dictate the math."

  "It dictates the bet," Mara said.

  "It dictates nothing if the ontology is flat," Kovacs countered.

  Elias left them arguing. He had to meet Mrs. Gable.

  She waited in the consultation room, hands wrapped around a paper cup of tea. She looked ordinary, which was the hardest part. She wasn't a philosophical puzzle. She was a woman whose husband was dead in this branch, regardless of how many other versions of him were commuting to work elsewhere.

  "Mr. Vance," she said. "Will the claim go through?"

  Elias sat down. He wanted to tell her about the basis dependence. He wanted to explain that the universe might be sliced differently today than it was when her husband bought the policy. He wanted to tell her that rationality axioms were fighting over her grief.

  "The contract is valid," Elias said. "But the valuation model is under review."

  "Does that mean I get paid?"

  "It means... we need to know what you bought."

  "I bought security," she said. "For if he didn't come home."

  "In some branches, he did."

  "In this one, he didn't." Her voice was flat. "You people talk about the others like they matter. They don't matter to me. I'm here. This branch is the one where I'm alone."

  Elias looked at the file. The discrepancy was massive. If the counting view held, and the basis was favorable, Aequitas owed her millions. If the weighting view held, the payout was fractions of a cent, because the 'death' amplitude was negligible. The firm's solvency rested on the weighting view. But the contract was signed under the counting regime.

  "Did he know?" Elias asked. "When he signed? Did he know what he was buying?"

  "He bought a promise," she said. "You're asking me if he bought a philosophy."

  Elias walked back to his office. The rain of data was heavier now. A storm front of decoherence events was moving in from the sector reactors. The Observatory would log thousands of new branches in the next hour.

  He sat at his desk and opened the pricing model. He could switch the variable. He could run the valuation on Counting. He could run it on Weighting.

  If he ran it on Weighting, the firm survived. Mrs. Gable got nothing.
  If he ran it on Counting, the firm might collapse. Mrs. Gable got paid.

  But which one was *true*?

  Mara said rationality forced the Weighting view. Kovacs said rationality was just a story they told themselves to sleep at night. The uncertainty argument said Mrs. Gable was just uncertain about her location, but that didn't explain why the odds were what they were.

  Elias typed a command. The screen split. On the left, the Weighted Value: stable, invariant, solvents. On the right, the Counted Value: volatile, basis-dependent, catastrophic.

  He minimized the window.

  He thought about the Observatory. They were updating the logging protocol again tomorrow. A shift in the basis standard. If the Counting view was real, the value of Policy 909 would change tomorrow without a single event occurring in the city, just because the mathematicians changed their minds about how to slice the wave.

  If the Weighting view was real, the value wouldn't budge.

  Elias could wait until tomorrow. He could see if the number moved.

  But that assumed the Observatory's logging affected the reality, rather than just measuring it. And if the logging affected the reality, then the insurance contract was betting on the Observatory's software version, not the universe.

  He picked up the phone to call Mrs. Gable. He had to tell her something.

  He looked at the two numbers on the screen. One was safe. One was honest. He didn't know which was which.

  "Mr. Vance?" Her voice came over the line.

  "I'm looking at the file," Elias said. "I need to tell you... we don't know what the number is for."

  There was a long silence. "You don't know if I'm covered?"

  "We know you're covered in this branch. The question is what that coverage is worth to the people who wrote the check."

  "That sounds like a problem for you," she said.

  "It is," Elias said. "But it's also the only thing that's real."

  He hung up. He didn't submit the claim. He didn't reject it. He opened a new document and began to write a memo to the board. He outlined the basis dependence. He outlined the axiomatic circularity. He outlined the human cost.

  He ended the memo without a recommendation. He simply attached the two valuation models and labeled them: *Option A: The World We Can Calculate.* and *Option B: The World We Might Inhabit.*

  Outside, the decoherence rain intensified. The city split again, silently, endlessly. Elias watched the feed. The numbers scrolled. They added up to one, always. But he still didn't know what they were counting.

  ***

