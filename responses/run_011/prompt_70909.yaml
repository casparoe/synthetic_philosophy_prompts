          2.  JSON object with specific metadata fields.

  2.  **Deconstruct the Physics/Philosophy:**
      *   *The Problem:* In Many-Worlds (MWI), everything that can happen does happen. So why do we observe probabilities according to the Born Rule ($|\psi|^2$)? Why not count branches (50/50 for spin up/down regardless of amplitude)?
      *   *Branch Counting:* Problematic because "branch" isn't a well-defined ontological unit independent of basis. You can decompose the wavefunction in infinite ways.
      *   *Decision Theory (Deutsch-Wallace):* Attempts to derive Born Rule from rationality axioms. Critics say axioms smuggle in the conclusion (e.g., "branching indifference").
      *   *Self-Locating Uncertainty:* Vaidman/Sebens idea. You know the wavefunction, but you don't know *which* copy you are yet. Critics say this doesn't justify the weights.
      *   *The Story's Hook:* An insurance contract priced on branch counting vs. amplitude weighting. If counting is used, the price changes based on how the observatory defines a "branch" (basis dependence). If weighting is used, it's invariant. The firm doesn't know which metric they've been using for payouts.

  3.  **Character & Setting Development:**
      *   **Protagonist:** Elias, claims adjuster/auditor at "Aequitas Mutual" (or similar).
