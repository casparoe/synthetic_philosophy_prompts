      *   *Scene 5: The Uncertainty Argument.* Debate on self-locating uncertainty. (Requirement 4).
      *   *Scene 6: The Human Stake.* A specific claim. A woman whose husband died in a low-amplitude branch but the contract pays out based on... what? (Requirement 5).
