  5.  **Writing - Focusing on Constraints:**
      *   *Word Count:* Need to monitor closely. 1,800 is a decent length, 2,500 is the cap.
      *   *Tone:* Professional, slightly weary, philosophical but grounded in bureaucracy.
      *   *Physics:* Ensure "basis dependence" is clear without jargon overload. The Observatory logs "events," but the definition of an event shifts.
      *   *No Resolution:* The ending must linger on the uncertainty.

  6.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Opening:* Elias in the server room. The hum of the decoherence logs.
      *   *The Contract:* Policy 77-Alpha. Payout condition: "Upon decoherence event type Delta."
      *   *The Glitch:* The price was calculated by $1/N$ (counting) not $|\psi|^2$ (weighting).
      *   *Dialogue:* Need to weave the arguments naturally.
      *   *The Stake:* Mrs. Gable. Her husband died in a branch where the safety mechanism failed (low amplitude). She expects payout. The firm expects to pay only in high-amplitude branches? No, the contract says "payout lands in some branches."
      *   *Refining the Conflict:* If priced by counting, the premium was cheap (assuming many branches). If priced by weighting, the premium was too cheap for the risk (if low amplitude branches are costly). Actually, the prompt says: "flat payout in each of a very large number of very low-amplitude branches."
      *   *Correction:* If you count branches, you ignore amplitude. If there are many low-amplitude branches, counting says "high probability" (many branches). Weighting says "low probability" (low total amplitude).
