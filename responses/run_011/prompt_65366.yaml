      *   *Objection 5 (The Wasp Data):* You conceded the wasp data is dodgy. If the wasp *isn't* actually sphexish, why build a theory on a ghost? (Source: Psych).
      *   *Objection 6 (Degrees of Freedom):* A thermostat has a profile (temp changes). A human has a profile. What's the *difference* if not width? (Source: General).
      *   *Objection 7 (The Homunculus):* Who decides which perturbations count for the "admissibility constraint"? (Source: Phil Bio/Psych).
      *   *Objection 8 (ML/Agency):* If an LLM changes its goal based on prompt perturbation, is it free? (Source: ML).

      *Refining for "Experimentalist Phrasing":* Instead of "operationalization," use "How do I score this in the lab?" Instead of "normativity," use "Who decides what counts as success?"

  5.  **Developing the Answers & Vulnerabilities:**
