answer: |-
  # Q&A Prep Sheet: "Sphexishness and Perturbation Profiles"

  **Room Profile:** 85% Empiricists (Psych/Ecology), 10% Phil Bio, 5% ML.
  **Tone:** Pragmatic, operational, anti-armchair.
  **Goal:** Defend the shift from *width* of flexibility to *locus* of flexibility (means vs. ends) without losing the room on abstraction.

  ---

  ### The Objections (Worst First)

  **1. The Operationalization Trap**
  *   **Source:** Comparative Psychologists (Lead Experimenter type)
  *   **The Question:** "You say flexibility is a profile over a perturbation class. In my lab, I have to score a trial as pass/fail. If the profile is infinite or undefined, how do I measure this? Are you giving me a metaphor or a metric?"
  *   **The 2-Minute Answer:** "You're right, you can't test all perturbations. But you don't test all temperatures to calibrate a thermometer; you test the ones that matter for the instrument's range. I'm arguing you should sample perturbations based on the *ecological niche* of the agent, not random noise. If you're testing corvids, perturbations should be cache-theft related, not flashing lights. The metric isn't 'how many perturbations survived,' it's 'does the behavioural variance track the variance in the success conditions?' If the environment changes the goal, does the behaviour change the goal? That's a scoreable trial."
  *   **Soft Spot:** You haven't actually given them a formula for sampling the "relevant" perturbations without circularity.

  **2. The Adaptive Rigidity Objection**
  *   **Source:** Behavioural Ecologists
  *   **The Question:** "In the wild, 'sphexishness' is often the winning strategy. If a parasitoid wasp *does* switch goals when the host is moved, she wastes time and gets eaten. Why is the ability to revise ends under pressure a virtue? Sometimes the 'slave' outcompetes the 'free' agent."
  *   **The 2-Minute Answer:** "Agreed. Flexibility has metabolic and predation costs. My claim isn't that wide profiles are always better. It's that 'freedom'—the thing we care about in ethics and agency—isn't about fitness. A suicide mission can be free. I'm distinguishing *adaptive success* from *agential control*. The wasp might be fitter being rigid, but that doesn't make her less of a robot. We need to stop conflating 'good design' with 'agency'."
  *   **Soft Spot:** Risks alienating the evolutionary crowd by decoupling agency from fitness too sharply.

  **3. The "Who Scores?" Problem (Normativity)**
  *   **Source:** Philosophers of Biology
  *   **The Question:** "You block relativism with an 'admissibility constraint': perturbations count only if defined over the system's success conditions. But who defines the success conditions? The wasp? The experimenter? Evolution? If it's evolution, you're back to fitness. If it's the wasp, how do you ask her?"
  *   **The 2-Minute Answer:** "We infer success conditions the same way you do in psych: by looking at what the system corrects for. If the wasp corrects for burrow location but not prey type, her success conditions are 'prey in burrow,' not 'larva fed.' It's an empirical hypothesis about the control loop, not a metaphysical verdict. If she doesn't correct for it, it's not in her success function."
  *   **Soft Spot:** This relies on the "correction = goal" heuristic, which fails for maladaptive behaviours or broken systems.

  **4. The ML/Control Theory Objection**
  *   **Source:** ML Attendees
  *   **The Question:** "This sounds like the difference between robust control and adaptive control, or maybe meta-RL. If a system updates its loss function based on input, isn't that just a higher-dimensional optimization? Why call it freedom?"
  *   **The 2-Minute Answer:** "Mathematically, you might be right. But conceptually, there's a difference between a system optimizing $X$ and a system that treats $X$ as a variable. In standard RL, the reward function is external to the agent. In the 'free' profile I'm describing, the reward function is internal to the perturbation class. If the prompt changes the loss function, the model is flexible. If the prompt *only* changes the path to a fixed loss, it's sphexish. I'm asking you to track whether the objective is perturbable."
  *   **Soft Spot:** ML folks might argue that *all* objective changes are ultimately driven by external gradients (training data), collapsing the distinction.

  **5. The "Ghost Wasp" Objection**
  *   **Source:** Comparative Psychologists (Ethology specialists)
  *   **The Question:** "You conceded the Fabre anecdote is dodgy. Later data shows wasps break the loop. If the paradigm case of sphexishness isn't actually sphexish, why are we spending 30 minutes on it? Isn't this a strawman?"
  *   **The 2-Minute Answer:** "Because the *term* survives even if the data didn't. 'Sphexish' is still used in papers today to dismiss mechanisms as 'mere reflexes.' I'm not attacking the wasp; I'm attacking the verdict. Even if the wasp is flexible, the *concept* used to judge her is broken. We need to fix the concept before we run the next assay, or we'll just find a new insect to call a robot."
  *   **Soft Spot:** Makes the talk seem like purely semantic cleanup rather than substantive science.

  **6. The Thermostat Counter-Example**
  *   **Source:** General Room (Classic Objection)
  *   **The Question:** "A thermostat has a perturbation profile. If I block the sensor, it turns on the heat. If I change the set-point, it adjusts. By your definition, if I define success as 'maintain set-point,' it has a profile. Why isn't the thermostat free?"
  *   **The 2-Minute Answer:** "Because the set-point isn't in its perturbable class. You can turn the dial, but the thermostat can't decide to stop heating and start cooling based on a perturbation. Its success conditions are fixed *exogenously*. My admissibility constraint requires the system's own success conditions to be defined over the perturbation. The thermostat doesn't 'care' about the set-point; you do."
  *   **Soft Spot:** Relies heavily on the "cares about" distinction, which is exactly what the empiricists are skeptical of.

  **7. The Circularity Charge**
  *   **Source:** Philosophers of Biology
  *   **The Question:** "You say a perturbation counts if it relates to success conditions. You say success conditions are what the system corrects for under perturbation. Aren't you defining flexibility in terms of success and success in terms of flexibility?"
  *   **The 2-Minute Answer:** "It's a reflective equilibrium, not a circle. We start with a hypothesis about the goal, test perturbations, see what breaks, update the goal hypothesis. It's the same loop you use to determine if a behaviour is a reflex or a voluntary act. I'm just making the loop explicit so we don't pretend the verdict comes from the first trial."
  *   **Soft Spot:** Admitting it's a "loop" might sound like you don't have a ground truth.

  **8. The Human Exceptionalism Worry**
  *   **Source:** Comparative Psychologists
  *   **The Question:** "If a corvid can revise its foraging goal when a trap is introduced, is it 'free' in the same sense as a human revising a life plan? You're risking a slippery slope where every flexible invertebrate has 'agency'."
  *   **The 2-Minute Answer:** "I'm not saying they have the *same* amount of freedom. I'm saying they have the *same kind* of structural property. Freedom is a spectrum of profile depth. Humans have deeper profiles—more abstract perturbations count. But the corvid isn't a robot either. We should stop drawing a bright line between 'mechanism' and 'agent' and start measuring the depth of the profile."
  *   **Soft Spot:** Dilutes the concept of freedom until it might not do the ethical work we want it to.

  **9. The ML "Prompt Engineering" Objection**
  *   **Source:** ML Attendees
  *   **The Question:** "If I prompt an LLM to 'act as if you want to help' vs 'act as if you want to deceive,' and it switches, is that goal revisability? Or just context switching?"
  *   **The 2-Minute Answer:** "That's the exact test case. If the switch is just retrieving a different pre-trained policy for a fixed reward (helpfulness), it's context switching (sphexish). If the model can refuse the prompt's goal and propose a new objective based on the interaction, that's profile depth. Currently, most LLMs are sphexish with a very wide means-profile. They'll write a poem or code, but they won't decide *not* to write."
  *   **Soft Spot:** Hard to verify empirically without access to the model's internal loss landscape.

  ---

  ### Strategic Concessions (First 5 Minutes)

  **Give this away early to inoculate against Objections 1 & 5:**
  "I am not claiming the wasp is a robot. I am not claiming we can measure 'freedom' with a ruler. I am claiming that the *binary distinction* currently used in this field (Flexible vs. Sphexish) is blocking better experimental design. If you leave thinking 'the wasp is free,' I've failed. If you leave thinking 'I need to test a different class of perturbations to see where my animal breaks,' I've succeeded."

  *Why:* This disarms the empiricists who fear you're doing armchair metaphysics that ignores data. It frames your conceptual analysis as a tool for *their* assays.

  ---

  ### The Critical Reply (The "Must Land")

  **The Distinction between Means-Flexibility and Ends-Flexibility.**
  If this doesn't land, the talk collapses into "everything is flexible somewhere."
  You must make them feel the difference between:
  1.  **System A:** Will try *any* method to achieve Goal X. (Wide Means Profile, Fixed Ends).
  2.  **System B:** Will reconsider Goal X if the context makes X costly. (Ends Profile).

  *Phrasing:* "A missile that corrects for wind is flexible. A missile that decides not to hit the target because the target is a school is free. Most of our assays only measure the wind correction. We are mistaking guidance for agency."

  ---

  ### The Question You're Dreading

  **"Okay, so how do I run this?"**
  *   **Source:** A senior Behavioural Ecologist, arms crossed.
  *   **Why it's dreaded:** Because your "admissibility constraint" is conceptually clear but methodologically vague. If you can't give a concrete example of an assay design that differs from current practice, you're just a philosopher telling scientists how to science.
  *   **Prep:** Have a concrete example ready.
      *   *Current Assay:* Move the food, see if they find it. (Tests Means).
      *   *Your Assay:* Poison the food source or make it require social cooperation, see if they abandon the foraging goal entirely for a different caloric strategy. (Tests Ends).
      *   *Line:* "Don't just perturb the *path* to the reward. Perturb the *value* of the reward relative to the cost, and see if the animal treats the goal as a variable."
