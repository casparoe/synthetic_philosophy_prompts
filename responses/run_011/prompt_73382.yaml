      *   Did I use the specific vocabulary (Sen's hierarchy, etc.)? Yes.
      *   Did I address the two pressing issues? Yes.
      *   Did I flag welfarist/cardinalist assumptions? Yes.
      *   Did I provide a final judgment? Yes.

