          *   *Substantive Commitment:* Yes, this is huge. It means prioritarianism isn't just a preference over risk/distribution; it's a claim that utility levels are cardinally measurable with a non-arbitrary zero. This is a strong metaphysical claim about welfare.
          *   *Friction:* Economists often wave hands about "utils." Philosophers treat the "absolute level" as morally significant. The math exposes this.

