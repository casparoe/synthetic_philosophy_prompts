          *   *Correction:* Let's stick to the prompt's hint: "level comparability rather than the weaker unit comparability". In Sen's 1977/1986 taxonomy, "Level Comparability" usually refers to the ability to compare levels ($u_i \geq u_j$). "Unit Comparability" refers to differences ($u_i - u_j$).
