  3.  **Deconstruct the Leveling-Down Objection (LDO):**
      *   *Philosophical Core:* Strict egalitarianism implies that a world where everyone is equally miserable is *in some respect* better than a world where some are happy and some are miserable, even if no one is better off in the miserable world. Parfit says this is absurd. Prioritarianism avoids this because it is Pareto-inclusive.
      *   *SWF Translation:* Compare allocation $A$ (unequal, higher sum) vs. $B$ (equal, lower sum, everyone $\le$ their level in $A$, some strictly $<$).
