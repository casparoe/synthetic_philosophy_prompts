      *   *Missing:* The deontic/teleic distinction (maybe less relevant here), the "in one respect" plurality.
      *   *Flagging Assumptions:* Welfarism assumes utility captures all morally relevant info. Cardinality assumes utility is measurable.

  7.  **Refining the Tone:**
      *   Must be rigorous, peer-to-peer (PhD level).
      *   No dumbing down.
      *   Highlight the "friction" explicitly as requested.
      *   Avoid smoothing over the incompatibility of "in one respect" with complete orderings.

