      *   *Wait, check Sen:* Unit Comparability (UC) allows $u^* = a u + b$ (same $a$, same $b$). Full Comparability (FC) allows $u^* = a_i u_i + b_i$ (no, that's non-comparable).
      *   *Let's recall Sen's Notation:*
          *   ONC: $\phi(u) = f(u)$ (monotonic).
          *   OLC: $\phi(u) = f(u) + b$ (common shift).
          *   CUC: $\phi(u) = a u + b$ (common scale + shift).
          *   CNC: $\phi(u) = a u$ (common scale).
          *   FC: $\phi(u) = a_i u_i + b_i$ (individual scale + shift).
      *   *Re-evaluating Issue 2:* Utilitarianism ($\sum u_i$) works under CUC (Cardinal Unit Comparability). If $u^* = a u + b$, $\sum u^* = a \sum u + nb$. Order preserved.
      *   Prioritarianism ($\sum g(u_i)$): If $u^* = a u + b$, does the order preserve?
