answer: |-
  **Restatement of Anscombe's Case in Targeting Law Vocabulary**

  From the perspective of your doctrine, the decision to employ atomic weapons on Hiroshima and Nagasaki is typically reviewed through the lens of proportionality and military necessity. The argument runs that the military advantage anticipated (cessation of hostilities, avoidance of invasion casualties) outweighed the anticipated collateral damage (civilian deaths and infrastructure destruction).

  Anscombe's argument, translated into your operational lexicon, rejects the validity of that proportionality calculation *ab initio*. She contends that the civilian population was not merely the site of incidental damage; they were the *object of attack*. In your terminology, the "Military Advantage" sought was causally dependent upon the destruction of the protected persons. When the anticipated collateral damage is the very mechanism by which the military advantage is achieved, the distinction between "object of attack" and "incidental effect" collapses.

  Therefore, the action constitutes a fundamental violation of the principle of distinction, not as a procedural error, but as a design feature. Anscombe argues that no reckoning of consequences—no Collateral Damage Estimation Methodology (CDEM)—can license the choice to kill the innocent as a means to an end. Under her view, certain targets are intrinsically illegitimate, regardless of the Commander's Intent regarding the strategic end-state. To classify the deaths as "incidental" when they are the instrument of victory is to falsify the Rules of Engagement. It is not a tragic necessity permitted under the law of armed conflict; it is murder, defined as the intentional killing of protected persons, masked by a procedural framework that treats human immunity as a variable in a calculus rather than a constraint on action.

  ***

  **Residue Report**

  Here is the breakdown of how Anscombe's claims map onto your current doctrinal framework:

  **1. Expressible as a Rule of Conduct**
  *   **The Prohibition on Direct Attack:** Anscombe's absolute prohibition on killing the innocent translates cleanly into the rule of distinction: "The civilian population as such, as well as individual civilians, shall not be the object of attack." Your doctrine already codifies this as a hard constraint.
  *   **Feasible Precautions:** Her demand that we avoid killing innocents maps onto the requirement to take all feasible precautions in the choice of means and methods of warfare.

  **2. Expressible only as a Rule of Decision Procedure or Individual Culpability**
  *   **Mens Rea / Intent:** Anscombe's focus on the moral intention of the actor translates only into the *mens rea* required for war crimes prosecutions. Your doctrine handles this through the "reasonable commander" standard and specific intent requirements for grave breaches. However, this is reactive (post-hoc culpability) rather than proactive (rules of conduct).
  *   **The "Murder" Designation:** Labeling the act "murder" rather than "collateral damage" is a judgment on individual criminal liability, not a rule of targeting. Your system can punish the offender after the fact, but it cannot encode "murder" as a targeting restriction distinct from "unlawful attack."

  **3. Inexpressible in IHL Doctrine**
  *   **Intrinsic Illegitimacy of Objective:** Your doctrine has no category for a military objective that is valid under distinction (e.g., a city containing war industry) but invalid because the *method* of neutralizing it relies on civilian terror or death. IHL allows the destruction of a military objective even with high civilian cost if proportional. Anscombe claims some costs are never proportional because the *type* of harm (killing innocents as means) is forbidden, not just the *amount*.
  *   **The Non-Calculable Constraint:** Your framework operationalizes morality through calculus (proportionality). Anscombe's claim that some acts are forbidden *regardless* of the military advantage anticipated cannot be stated in a system where "military necessity" is a balancing weight. There is no variable in your CDEM for "Intrinsically Evil Act."

  ***

  **Press Point 1: The Gap Between Object and Incidental**

  You noted that your framework contains a prohibition on making civilians the object of attack, while licensing foreseeable death as incidental. Anscombe argues this gap is a legal fiction when the foreseeable death is the *condition of success*.

  In your doctrine, if I bomb a munitions factory in a city, I intend to destroy the factory. The civilian deaths are foreseen but unintended. IHL treats this as legally distinct from bombing the city to kill the civilians. Anscombe presses that if the *strategic rationale* for bombing the factory is that the resulting civilian terror will force surrender, then the civilian death has been subsumed into the "Military Advantage."

  If the "Advantage" is defined as "breaking the enemy's will," and the mechanism for breaking that will is the destruction of the civilian population, then the civilian population has effectively become the object of attack, regardless of the legal designation of the aim point. By admitting that foreseen civilian deaths are permissible for a "good end" (proportionality), you have already surrendered the principle of immunity. You have converted the civilian's right to life from a shield (inviolable) into a weight (calculable). Anscombe claims that once you allow the death of the innocent to be weighed against military advantage, you have authorized the very thing the prohibition on direct attack was meant to secure against: the use of the innocent as fuel for the war effort.

  **Press Point 2: Locating the Intention in Area Bombing**

  If Anscombe's distinction between intended and merely foreseen harm is doing the work, where exactly does she locate the intention in a campaign of area bombing? She does not locate it primarily in the mind of the pilot or the tactical commander executing the strike. They may claim they are simply hitting a grid coordinate.

  She locates the intention in the **Operational Design and Commander's Intent**.
  *   **The Plan:** The intention is embedded in the selection of the target category (urban centers) and the weapon choice (area-effect munitions) where precision against military objectives is impossible or secondary to general destruction.
  *   **The Causality:** The intention is located in the causal link relied upon by the strategic leadership. If the strategic plan posits that "Destruction of City X -> Civilian Suffering -> Government Surrender," then the civilian suffering is not a side effect; it is a required step in the logic chain.
  *   **The Choice:** The intention is the choice to proceed with an attack profile where the destruction of protected persons is the only predictable outcome that secures the objective.

  In your vocabulary, Anscombe argues that the "Commander's Intent" statement for Hiroshima effectively read: "Destroy civilian morale via mass casualty." Even if the Rules of Engagement said "Target Military Objectives," the operational reality was "Target City." The intention is structural, residing in the campaign plan that makes civilian death a necessary condition for the mission's success.

  ***

  **Verdict**

  Does what fails to translate show that International Humanitarian Law is missing a concept, or that Anscombe's notion of intention cannot bear the weight she puts on it?

  **IHL is missing a concept.**

  Your doctrine is a regulatory framework designed to *manage* violence, not to judge its moral essence. It operates on the premise that war is a legitimate instrument of policy, and therefore seeks to optimize its conduct. It lacks the concept of **Moral Inviolability** that transcends proportionality. In your system, everything has a price if the military advantage is high enough. Anscombe identifies a category of action that has no price.

  The failure to translate her argument is not because her notion of intention is too fragile; it is because your doctrine is designed to be agnostic on the *moral quality* of the act, focusing instead on the *procedural compliance* of the actor. IHL assumes that if you follow the process (distinction, proportionality, precautions), the outcome is legally valid. Anscombe argues that some outcomes are invalid regardless of the process.

  However, there is a pragmatic cost. If IHL adopted her concept, it would likely render most modern strategic warfare unlawful, as the line between "destroying morale" and "terrorizing population" is operationally thin. Her notion of intention bears the moral weight, but it cannot bear the **adjudicative weight** required by a legal system. It requires access to the strategic causality and moral reasoning of leadership that is often opaque or classified.

  **Conclusion:** IHL is missing the concept of intrinsic prohibition that overrides military necessity. But because IHL is a positivist legal regime bound by state consent and operational feasibility, it cannot incorporate a moral absolute that forbids the calculus of war itself. Anscombe is right about the morality; your doctrine is right about the enforceability. The gap remains because the law is built to regulate war, while she is built to judge it.
