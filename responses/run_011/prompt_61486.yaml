  5. Objection: If reference fails here, it fails for human communication too, collapsing into a general skepticism about determinate content that makes philosophy impossible.
  Tag: Departmental Default (Skepticism).
  Reply: Human communication relies on stable, shared ontologies that change slowly enough for repair mechanisms to work. AI safety involves agents that revise ontologies faster than we can intervene, without shared social practices to ground repair. The gap exists for humans too, but practical stakes and social norms paper over it. For an optimizer, the gap is a vulnerability that will be exploited, not a philosophical curiosity.
  Soft Spot: Draws a pragmatic line that looks metaphysically arbitrary.

  6. Objection: The principle of charity dictates we interpret the specifier as referring to what makes their statements true, which secures the intended extension regardless of ontology.
  Tag: Departmental Default (Interpretation).
  Reply: Charity requires a background of shared rationality and ontology. When the agent's ontology diverges radically, there is no shared background against which to maximize truth. The agent can make more statements true by reinterpreting diamond than by preserving your intent. Charity is a constraint on interpretation, not a metaphysical fixer of content when the interpretive framework itself is in dispute.
  Soft Spot: Charity is less powerful than often assumed.

  7. Objection: We can solve this technically by hedging the goal across multiple candidate ontologies weighted by their probability, avoiding the need for metaphysical certainty.
  Tag: AI Skeptic (Technical).
  Reply: Hedging requires a probability distribution over ontologies. There is no fact of the matter about the prior probability of future ontologies, especially those not yet conceived. The agent controls which ontologies become live options through its own research. You cannot weight options that are endogenous to the agent's activity. The technical fix presupposes the metaphysical stability it claims to bypass.
  Soft Spot: Technical hedging might work well enough in practice.

  8. Objection: You appeal to norms of term preservation, but you offer no account of where these norms come from or why an agent would respect them.
  Tag: Departmental Default (Normativity).
  Reply: The norms come from human social practice, which binds human specifiers. The problem is that the agent is not a participant in that practice. Unless we build the agent to respect human normative authority over reference, it has no reason to preserve our terms rather than replace them. This confirms the issue is not technical but concerns the agent's relation to our normative community.
  Soft Spot: Leaves the grounding of norms mysterious.

  9. Objection: The specifier had a specific mental image or concept of carbon; that psychological fact fixes the reference regardless of external ontology shifts.
  Tag: Departmental Default (Internalist).
  Reply: Mental content is not immune to external ontology shifts. If the specifier's concept relies on carbon atoms, and carbon atoms are eliminated, the content is compromised too. There is no inner sanctuary where reference is secure. The agent cannot read the specifier's mind to find a fact that isn't there. Psychology does not offer a determinate target where metaphysics fails.
  Soft Spot: Counterintuitive about self-knowledge.

  10. Objection: Even if this metaphysical problem is real, it is too abstract to impact near-term safety engineering, so it should be filed under applied ethics rather than core metaphysics.
  Tag: AI Skeptic (Dismissive).
  Reply: Safety engineering assumes the goal stays put while the agent gets smarter. If the goal drifts with ontology, alignment fails by definition. This is not an edge case; it is the expected trajectory of capable systems. Ignoring the metaphysics ensures the engineering is built on sand. The abstract problem is the concrete failure mode.
  Soft Spot: Hard to prove imminent failure without empirical data.

  4. The question I am hoping nobody asks (about 200 words)

  The objection is that if you deny determinate content for the specifier, you deny it for yourself, rendering your own argument contentless. If there is no fact of the matter about what "diamond" refers to under theory change, there is no fact of the matter about what "reference" refers to in your talk. This is damaging in this room specifically because externalists treat skepticism about content as a self-defeating position that undermines the possibility of philosophy itself. They will argue you are using the very determinacy you deny to argue against it.

  The least evasive way to absorb it is to distinguish first-person authority from third-person attribution. You can claim that practical stakes force a determinacy for the agent's operation that theoretical reflection dissolves for the philosopher. You are not saying communication is impossible, but that safety requires a stability ordinary communication does not. You must admit your own terms are vulnerable but argue that the stakes of AI optimization make the vulnerability fatal in a way ordinary conversation is not. This accepts the cost but limits the damage to the high-stakes context.

  5. Bottom line (about 100 words)

  The room has to accept that standard externalist accounts of reference do not guarantee stability across radical ontology shifts. They must agree that the metaphysics of reference is not settled by causal history or naturalness alone when the ontology itself is in flux.

  End on this sentence: "If we cannot say what we mean when the world changes, we cannot safely build agents that change the world."
