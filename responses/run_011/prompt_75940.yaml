  8.  **Finalizing the Diagnosis:** It is a **clash of semantic norms regarding assertion**, which effectively functions as **distinct projects**. It is not *merely* verbal because the norms dictate what counts as a cognitive achievement.

      *(Plan for "Progress")*: Suggest that progress lies in **Univalent Foundations/HoTT** (bridging the gap) or **Reverse Mathematics** (calibrating the cost of LEM). Or, accept **Carnapian Tolerance**.

