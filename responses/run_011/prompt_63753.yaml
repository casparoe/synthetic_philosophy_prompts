prompt: |-
  I run a bioethics workshop for adults with mixed backgrounds — about 18 people, three hours including a break, basically no philosophy training. I want to build an activity around assisted dying that lands one specific thing: how a policy can end up somewhere nobody ever voted for, without any single decision in the sequence being wrong.

  So: a made-up jurisdiction. Please invent the statute rather than using a real country's law — three or four eligibility criteria written in vague-but-plausible legalese that the participants will have to apply. Then a review committee (them) deciding eight cases across eight years, each one individually sympathetic, each leaning on the last. Give me the case cards in outline, the procedure, timing per round, and one rule that forces them to justify refusals as carefully as approvals — that asymmetry is the engine I'm after. Work in a dementia case where the patient left a directive years earlier and now seems content; I want them to discover that there own earlier approval commits them there, rather than me telling them.

  Then a debrief that pins each year's vote to the specific pressure that produced it (precedent, sympathy fatigue, the cost of saying no to this particular person), plus what predictably goes sideways on a first run — I'm bracing for one person refusing to engage and for the last three cases getting resolved in five minutes flat. And be honest about what the activity structurally can't show, because I suspect it's that these are real people and the room will have some in it.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Adults, mixed backgrounds, ~18 people, no philosophy training.
      *   **Topic:** Assisted Dying (AD).
      *   **Core Learning Objective:** Demonstrate the "Slippery Slope" (or "Paradox of Sorites") in policy making: how a series of individually reasonable decisions leads to an outcome no one explicitly voted for.
      *   **Format:** 3-hour workshop (including break).
      *   **Key Components:**
          *   Fictional Jurisdiction & Statute (vague but plausible legalese, 3-4 criteria).
          *   Review Committee Simulation (participants).
          *   8 Cases over 8 Years (progressive expansion).
          *   Specific Case: Dementia/Advance Directive (patient content now).
          *   Mechanism: A rule forcing justification for refusals (to prevent easy "no" votes).
          *   Debrief: Linking votes to pressures (precedent, sympathy, cost of refusal).
          *   Risk Management: Handling disengagement & rushing the end.
          *   Limitations: Acknowledging what the simulation *can't* capture (real stakes, lived experience).

  2.  **Design the Statute (The "Republic of Aethelgard"):**
      *   Needs to be tight enough to start restrictive but vague enough to stretch.
      *   *Criteria 1 (Suffering):* "Unendurable suffering." (Subjective).
      *   *Criteria 2 (Capacity):* "Competent and voluntary request." (Clear initially).
      *   *Criteria 3 (Prognosis):* "Terminal condition with no reasonable hope of recovery." (The stretch point).
      *   *Criteria 4 (Safeguard):* "Independent witness confirmation." (Procedural).
      *   *Refinement:* Let's make it three criteria for simplicity.
          1.  *Grievous and Irremediable Medical Condition.*
          2.  *Enduring and Unbearable Suffering.*
          3.  *Voluntary and Competent Request.*

  3.  **Design the Mechanism (The "Asymmetry Rule"):**
      *   Goal: Prevent lazy "No" votes. Make "No" hard work.
      *   Rule: "The Burden of Consistency." If you vote No, you must cite a specific prior Approved case that is *more* deserving than this one. If you can't, you must vote Yes. This forces them to look at the trajectory.

  4.  **Design the Cases (The "Slope"):**
      *   Need 8 cases.
      *   *Year 1:* Classic terminal cancer, clear mind, physical pain. (Easy Yes).
      *   *Year 2:* Terminal, but pain is managed. Suffering is existential/loss of dignity. (Stretch on "Suffering").
      *   *Year 3:* Non-terminal but degenerative (ALS). (Stretch on "Terminal").
      *   *Year 4:* Physical disability, not degenerative, dependent on care. (Stretch on "Medical Condition").
      *   *Year 5:* Mental illness only (Treatment-resistant depression). (Stretch on "Medical" & "Competence").
      *   *Year 6:* The Dementia Case (Advance Directive vs. Current Contentment). *Crucial Request.*
      *   *Year 7:* Mature Minor (16yo, terminal). (Stretch on "Voluntary").
      *   *Year 8:* "Tired of Life" (Elderly, multiple comorbidities, not terminal). (The "Nobody Voted For This" outcome).

      *Wait, I need to ensure the Dementia case forces them into a corner based on *their* earlier logic.*
      *   If they approved Year 3 (ALS - loss of capacity looming), they set a precedent for valuing prior competence.
      *   If they approved Year 5 (Mental Health), they validated subjective suffering over objective prognosis.
      *   *Adjustment:* Let's place Dementia at Year 6. To approve it, they rely on the *Advance Directive* (prior competence). To deny it, they contradict the principle that "prior competent wishes matter" (established in Year 1-3). But the patient is *happy now*. This creates the cognitive dissonance.

  5.  **Structure & Timing (3 Hours):**
      *   Intro & Statute (30 mins).
      *   Rounds 1-4 (45 mins).
      *   Break (15 mins).
      *   Rounds 5-8 (45 mins).
      *   Debrief (45 mins).
      *   *Total:* 3 hours.
      *   *Group Size:* 18 people. Too big for one committee. Split into 3 tables of 6. Each table is a "Regional Ethics Board." They compare results at the end.

  6.  **Drafting the Content:**

      *   *Statute:* Keep it clean.
      *   *Cases:* Write them as "Files."
      *   *The Rule:* "The Precedent Veto."
      *   *Debrief:* Guide questions.
      *   *Limitations:* Honest assessment.

  7.  **Refining the "Dementia" Trap:**
      *   Case 6: "Elara V." Early onset dementia. Wrote directive 5 years ago saying "If I don't recognize my family, let me go." Now she doesn't recognize family, sings all day, seems content. Family is divided.
      *   *The Trap:* If they approved Case 3 (ALS) based on "fear of future loss of dignity," they must honor Elara's fear. If they approved Case 5 (Depression) based on "internal suffering is real," they must acknowledge her directive outweighs current affect. If they say No, they undermine the concept of Advance Directives which they likely supported in Year 1-2.

  8.  **Addressing Risks:**
      *   *Disengagement:* Assign roles (Chair, Scribe, Timekeeper, Devil's Advocate). Rotate? No, too complex. Just assign "Scribe" to ensure accountability.
      *   *Rushing the End:* The "Asymmetry Rule" slows them down. Also, explicitly tell them Case 8 requires a written rationale.
      *   *Emotional Safety:* Content warning is essential.

  9.  **Final Review against Constraints:**
      *   18 people? Yes (3 groups of 6).
      *   3 hours? Yes.
      *   No philosophy training? Keep language accessible.
      *   Specific Statute? Yes.
      *   8 Cases? Yes.
      *   Dementia Case included? Yes.
      *   Asymmetry Rule? Yes.
      *   Debrief on pressures? Yes.
      *   Limitations? Yes.

  10. **Polishing the Tone:**
      *   Needs to be facilitator-ready. Clear instructions.
      *   The "Slippery Slope" shouldn't be presented as a *fallacy* but as a *structural feature* of case-based reasoning.
      *   Ensure the "Nobody Voted For This" moment lands in the debrief.

  *(Self-Correction during drafting)*: 8 cases in 90 minutes (split by break) is tight. 10 minutes per case is unrealistic for discussion.
  *Correction:* Group the cases. Round 1 (Cases 1-2), Round 2 (Cases 3-4), Round 3 (Cases 5-6), Round 4 (Cases 7-8). Or just do 4 Rounds with 2 cases each?
  *Better:* Do 4 Rounds. Each Round covers 2 Years. This allows 20 mins per round.
  *Wait, the prompt asks for "eight cases across eight years."* I should keep them distinct but maybe bundle the *voting* to save time, or accept that 8 cases is ambitious for 3 hours with 18 people.
  *Decision:* I will structure it as 4 Sessions of 2 cases each. This keeps the pacing manageable while maintaining the 8-year narrative.
  *Actually, let's look at the timing again.* 3 hours = 180 mins.
  Intro: 20.
  Activity: 90 (30 before break, 60 after? No, 45/45).
  Break: 15.
  Debrief: 40.
  Total: 165. Leaves 15 buffer.
  If I do 8 distinct cases, that's 11 mins per case including transition. That's very fast for 6 people to discuss.
  *Solution:* I will advise the facilitator to run it as **4 Rounds of 2 Cases each**. This preserves the 8-year timeline but makes the discussion feasible. I will note this in the procedure.
  *Wait, re-reading prompt:* "deciding eight cases across eight years."
  *Okay, I will provide 8 cases but suggest grouping them for timing.* Actually, for the effect to work, they need to feel the *year-by-year* shift.
  *Compromise:* I will write 8 cases. I will advise the facilitator to run them in 4 blocks of 2 years to make the timing work. 11 minutes per case is too rushed for deep ethical reasoning. 22 minutes per block is doable.
  *Wait, the "Asymmetry Rule" takes time.*
  *Okay, final plan:* 4 Rounds. Each Round presents 2 years/cases. They discuss the *shift* between them.
  *No, let's stick closer to the prompt.* "Eight cases." I'll provide 8 cards. I'll advise the facilitator to be ruthless on time. 10 mins per case is possible if the rule forces focus.
  *Actually, 18 people in one room?* "Review committee (them)." If all 18 decide together, it's a plenary. That's unwieldy. 3 tables of 6 is better.
  *Okay, 3 tables of 6.*
  *Time:* 45 mins for 8 cases is 5 mins per case. Impossible.
  *Pivot:* I must advise grouping. I will design 8 cases but instruct the facilitator to run them in **4 Rounds of 2 Cases**. This maintains the 8-year arc without breaking the clock. I will explain *why* in the notes.

  *Re-evaluating the Dementia Case:* It needs to be the pivot point. Let's make it Case 5 or 6.
  *Re-evaluating the "Nobody Voted For" outcome:* Case 8 needs to be clearly outside the original intent but logically consistent with Case 1-7.

  *Let's finalize the "Asymmetry Rule".*
  "The Dissent Burden": To vote NO, you must identify a previously approved case that was *less* compelling than this one. If you cannot name one, you must vote YES. This prevents arbitrary "No" votes and forces reliance on precedent.

  *Let's finalize the Limitations.*
  The simulation removes the *body*. It removes the *doctor*. It removes the *family grief*. It turns life/death into a logic puzzle. This is a feature (for the lesson) and a bug (for reality).

