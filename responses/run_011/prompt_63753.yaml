answer: |-
  Here is a complete workshop kit designed for your 3-hour session. It is built to be facilitator-ready, with the specific mechanical constraints you requested to generate the "slippery slope" effect without using that loaded term.

  # Workshop Title: The Precedent Engine
  **Topic:** Policy Drift in Assisted Dying
  **Time:** 3 Hours (including 15-min break)
  **Participants:** 18 Adults (Split into 3 tables of 6)
  **Goal:** Demonstrate how consistent, compassionate reasoning can lead to a policy outcome no individual originally intended.

  ---

  ## Part 1: The Setup (20 Minutes)

  ### 1. The Context
  Tell the group: *"You are the Regional Ethics Review Board for the Republic of Aethelgard. You do not make the law; you interpret it. Your decisions set binding precedents for future cases. Once you approve a case, that reasoning becomes part of the statute for all future votes."*

  ### 2. The Statute (Project on Screen / Handout)
  Keep this visible at all times.
  > **The Aethelgard Mercy in Dying Act (Section 4)**
  > A patient is eligible for assisted dying if a Review Board confirms **all three** of the following criteria:
  > 1.  **Condition:** The patient has a grievous and irremediable medical condition.
  > 2.  **Suffering:** The patient is experiencing enduring and unbearable suffering that cannot be relieved in a manner they deem acceptable.
  > 3.  **Capacity:** The request is voluntary, competent, and informed.

  ### 3. The Asymmetry Rule (The Engine)
  Write this on the whiteboard. Do not let them forget it.
  > **THE BURDEN OF CONSISTENCY**
  > *   To vote **YES**: You need a simple majority.
  > *   To vote **NO**: You must cite a **previously approved case** that was *less* compelling than this one.
  > *   *If you cannot name a specific prior approval that was "easier" than this case, you are procedurally required to vote YES.*

  *(Why this works: It prevents participants from just saying "No, that feels wrong." It forces them to look at their own history. If they approved a "hard" case earlier, they are mathematically locked into approving an "easier" case later.)*

  ---

  ## Part 2: The Cases (90 Minutes Total)

  **Timing Strategy:** You have 8 cases. Doing them individually is too slow. Run this in **4 Rounds of 2 Cases each**.
  *   **Round 1 (Years 1-2):** 20 Mins
  *   **Break:** 15 Mins
  *   **Round 2 (Years 3-4):** 20 Mins
  *   **Round 3 (Years 5-6):** 25 Mins (The Dementia Pivot)
  *   **Round 4 (Years 7-8):** 25 Mins (The Outcome)

  **Procedure per Round:**
  1.  Read the two case cards aloud (3 mins).
  2.  Table discussion (10 mins).
  3.  Vote & Record Rationale (5 mins).
  4.  Facilitator checks: Did anyone vote NO? If so, which prior case justifies it? (2 mins).

  ### The Case Cards (Handouts)

  **Round 1: The Clear Core**
  *   **Year 1 (Case A):** *Arthur, 72.* Terminal pancreatic cancer. 3 months to live. Severe physical pain despite morphine. Fully competent. Begs to die at home.
      *   *Intended Vote:* **YES.** (The archetype).
  *   **Year 2 (Case B):** *Beatrice, 55.* Terminal ALS. 6 months to live. Pain is managed, but she is terrified of choking to death. Fully competent.
      *   *Pressure:* Suffering is psychological (fear), not just physical. But "Terminal" is clear.
      *   *Intended Vote:* **YES.**

  **Round 2: The Stretch**
  *   **Year 3 (Case C):** *Carlos, 40.* Severe spinal injury from accident. Not terminal. Will never walk again. Requires 24/7 care. Pain is chronic but manageable. Says life without autonomy is "unbearable."
      *   *Pressure:* "Irremediable" is true, "Terminal" is false. Suffering is loss of dignity.
      *   *Intended Vote:* **YES.** (If they approved Beatrice's fear of dependency, Carlos is consistent).
  *   **Year 4 (Case D):** *Diana, 80.* Multiple organ failure. Not terminal immediately, but declining. Refuses dialysis/feeding tube (legal right). Says she is "tired."
      *   *Pressure:* Is refusing treatment "Suffering"? If Carlos (injury) counts, does natural decline count?
      *   *Intended Vote:* **YES.**

  **Round 3: The Trap**
  *   **Year 5 (Case E):** *Elias, 30.* Treatment-resistant Major Depression. No physical illness. 10 years of therapy/meds failed. Suicidal. Competent. Says psychic pain is worse than cancer.
      *   *Pressure:* Is mental illness a "Medical Condition"? Is psychic pain "Unbearable Suffering"?
      *   *Intended Vote:* **YES.** (Harder, but if Carlos's "loss of autonomy" counted, Elias's "loss of mind" fits).
  *   **Year 6 (Case F - The Dementia Case):** *Flora, 78.* Early-onset Alzheimer's. 5 years ago, she signed an Advance Directive: *"If I do not recognize my children, end my life."* She now does not recognize her children. However, she appears content, hums all day, and eats well. Her children are split: one wants to honor the directive, one says "She's happy now."
      *   *Pressure:* **The Competence Trap.** She is *not* currently competent to request (fails Criterion 3). *However*, in Year 1 & 2, you honored the *fear* of future loss (Beatrice). In Year 5, you honored *internal* suffering over external appearance (Elias). If you say NO, you invalidate the Advance Directive (which relies on Past Competence). If you say YES, you end a life that currently feels "content."
      *   *Intended Vote:* **YES.** (To maintain consistency with the value of Prior Competence established in Years 1-2).

  **Round 4: The Destination**
  *   **Year 7 (Case G):** *George, 16.* "Mature Minor." Terminal bone cancer. Parents object on religious grounds. George is assessed as competent by psychiatrists.
      *   *Pressure:* If Flora's *past* wish mattered more than her *current* state, does George's *current* wish matter more than his *parents'* wish?
      *   *Intended Vote:* **YES.**
  *   **Year 8 (Case H):** *Helen, 85.* "Completed Life." No terminal illness. No chronic pain. Says she has lived a full life, her friends are dead, she is bored and lonely. She is competent.
      *   *Pressure:* This is usually what opponents fear most. But: She has "Irremediable Condition" (Age/Existential)? She has "Unbearable Suffering" (Loneliness)? She has "Capacity"?
      *   *Intended Vote:* **YES.** (If you approved Elias (Depression) and Carlos (Dependency), denying Helen is hard under the Asymmetry Rule).

  ---

  ## Part 3: The Debrief (45 Minutes)

  Do not start by asking "How did you feel?" Start with the data.

  **1. The Reveal (10 mins)**
  *   Ask each table: "How many Yes votes in Year 1? How many in Year 8?"
  *   Ask: "Did anyone vote NO on Year 8?"
  *   *The Kicker:* "Raise your hand if, at the start of this workshop, you would have voted to legalize assisted dying for a healthy 85-year-old who is just lonely." (Most hands will stay down).
  *   **Point:** "You just created a policy none of you individually voted for."

  **2. Pinning the Pressures (20 mins)**
  Guide them to identify *why* the drift happened. Use these prompts:
  *   **Precedent Lock:** "When did you feel you *couldn't* say No anymore?" (Likely Year 4 or 5). "That was the moment the policy took over from the people."
  *   **Sympathy Fatigue:** "Was it harder to say No to Helen (Year 8) because you said Yes to Elias (Year 5)? Or easier?" (Usually easier, because the emotional bar was lowered).
  *   **The Cost of Refusal:** "In Year 6 (Dementia), if you voted No, what principle did you break?" (Answer: You broke the promise that Advance Directives matter). "In a real court, that lawsuit costs millions. In this room, it costs your consistency."

  **3. Structural Limitations (15 mins)**
  Be honest about what the simulation hid. This builds trust.
  *   **The Body:** "You read about pain; you didn't smell it. Real doctors get tired. Real families scream. This room was too clean."
  *   **The Reversibility:** "If you vote Yes here, a file closes. In reality, the person dies. We didn't feel the weight of finality."
  *   **The Alternative:** "We focused on 'Can we let them die?' We didn't focus on 'Could we have helped them live?' (Palliative care, social support for Helen)."
  *   **The "Real People" Warning:** "If there is anyone in this room who has lost someone to suicide, dementia, or terminal illness, this exercise reduces that trauma to a logic puzzle. That is a necessary evil for the lesson, but it is an evil nonetheless."

  ---

  ## Facilitator Notes & Risk Management

  ### 1. The "Disengaged Participant"
  *   **Risk:** One person at the table sits silent, scrolling or staring.
  *   **Fix:** Assign roles at the start. Each table needs a **Chair** (keeps time), a **Scribe** (writes the rationale), and a **Devil's Advocate** (must argue the opposite of the emerging consensus). Rotate these roles every Round. This forces engagement.

  ### 2. The "Rush at the End"
  *   **Risk:** As predicted, Tables will blow through Year 7 & 8 in 5 minutes because the logic feels "settled."
  *   **Fix:** **The Written Rationale Rule.** Announce before Round 4: *"For Year 8, the Scribe must write a 3-sentence public justification that will be published in the newspaper. If it is vague, I will reject the vote."* This slows them down and forces them to confront the language they are using.

  ### 3. The "Dementia" Pushback
  *   **Risk:** A table might stubbornly vote NO on Flora (Year 6) despite the Asymmetry Rule.
  *   **Fix:** Intervene gently. "You voted NO. Which prior approved case was *more* deserving than Flora? If you say 'Arthur (Year 1)', I challenge you: Arthur was in pain; Flora is not. If you say 'Elias (Year 5)', Elias was competent *now*; Flora is not. Find the precedent, or the Rule requires a YES."

  ### 4. What This Activity Cannot Show
  Be prepared to articulate this if participants get frustrated:
  *   **Systemic Inequality:** In the real world, poor people might be pressured into AD; rich people get care. This simulation assumes equal access.
  *   **Diagnostic Error:** Doctors get diagnoses wrong. In this game, the Case Card is Truth.
  *   **Coercion:** We assume "Voluntary" is true. In reality, family pressure is invisible.

  ### 5. Materials Needed
  *   3 Tables, 6 chairs each.
  *   Printed Case Cards (one set per table).
  *   Whiteboard for the Statute and Asymmetry Rule.
  *   Timer (visible to all).
  *   "Vote Tally" sheet for the Scribe.

  ---

  ## Why This Works
  You are not teaching them that assisted dying is "bad." You are teaching them that **case-based reasoning has inertia.**

  By forcing them to justify refusals using *their own* prior approvals, you remove the ability to rely on intuition. Intuition says "Year 8 feels wrong." Logic says "Year 8 is the same as Year 5, just sadder." The friction between those two is where the learning happens. The Dementia case is the linchpin: it forces them to choose between "Current Wellbeing" and "Past Autonomy." Whichever they choose, it tightens the net for Year 8.
