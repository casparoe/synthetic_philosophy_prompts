answer: |-
  Overall, this piece is a spirited defense of the abolitionist view that the lying/misleading distinction lacks moral significance, but it achieves this by overstating the consensus in philosophy, misrepresenting the legal landscape, and conflating descriptive linguistics with normative ethics. It is a useful artifact for understanding the intuitive pull of the argument against the distinction, but it should not be treated as a neutral summary of the debate.

  Starting with the opening definitions, the passage offers a standard working distinction that most specialists would accept as a rough simplification, though some would quibble with the claim that the misleading speaker has said nothing false at all. Defenders of the distinction typically define lying as asserting what one believes to be false, whereas misleading involves implicating what one believes to be false while asserting something true, so the descriptive setup is familiar enough. However, the passage quickly moves to the claim that the distinction is of no moral use, which is the controversial normative thesis rather than a settled fact. The argument hinges on the claim that what is asserted is fixed by pragmatics and what a reasonable hearer takes the speaker to be committing to, rather than by the words themselves. Here the article is sliding between two concepts the literature keeps apart, namely the semantic content of an assertion and the pragmatic commitments a speaker undertakes. Most philosophers working on this topic, such as Jennifer Saul or Paul Faulkner, define lying in terms of what is said, not what is implicated, precisely to preserve the distinction. Your instinct is correct that the pragmatic character of communication is what gives the distinction its point, because it creates the logical space between literal truth and conveyed falsehood. The article treats the pragmatic nature of assertion as a reason to collapse the distinction morally, arguing that if the hearer is equally deceived, the act is equally wrong, but defenders argue that the wrong of lying involves a specific violation of the norm of assertion itself, not merely the production of a false belief. By defining assertion so broadly that it encompasses implicature, the author rigs the game to make misleading look like lying, whereas the literature usually treats the gap between saying and implicating as morally salient because it allows the speaker to maintain deniability and respect the literal truth.

  The central argument from the pragmatic character of assertion to the moral emptiness of the distinction therefore does not go through against standard defenses, because it leans on a premise about the wrong of lying that defenders simply refuse. The passage assumes the wrong is solely that the hearer ends up with a false belief, but many ethicists argue the wrong lies in the betrayal of the trust inherent in the act of asserting. If the norm of assertion is to say only what you believe to be true, the misleading speaker obeys the norm while the liar violates it, and that difference in integrity matters even if the consequences are identical. The article dismisses this as a loophole for the eloquent, which is a common rhetorical move in this debate, but it ignores the argument that maintaining the literal truth preserves a shared resource of trust that misleading erodes more slowly. So while the argument is coherent internally, it begs the question against those who locate the harm of lying in the act of assertion rather than the state of the hearer.

  Your skepticism about the legal claim is well-founded and you should feel confident correcting it. The statement that perjury turns on whether the hearer was left with a false impression rather than literal accuracy is backwards regarding perjury specifically. The landmark Supreme Court decision in Bronston v. United States established that a literally true but misleading answer given under oath is not perjury, precisely because the burden is on the questioner to pin down the witness. While fraud law is broader and can encompass half-truths or omissions that create a false impression, perjury law is strictly constrained by literal falsity, so lumping them together as the passage does is inaccurate. The author likely conflated the moral intuition that both are wrong with the legal reality that only one is typically prosecutable as perjury.

  Regarding the claims about Kant and psychology, the passage is similarly tendentious. The assertion that Kant is usually taken to have conceded the point is disputed among Kant scholars, many of whom argue that Kant's prohibition on untruthful declaration covers any intentional deception, regardless of literal truth, because the violation is against the duty of sincerity rather than semantic accuracy. On the psychological front, the claim that ordinary people rate the two equally harshly once consequences are fixed is an overgeneralization of mixed empirical data. Some experimental philosophy studies suggest people do distinguish between lying and misleading morally, even when outcomes are held constant, while others show consequences dominate; stating it as a fact that they are rated equally harshly ignores the nuance in the recent literature.

  To answer your final question, the piece is not a fair representative of where the debate stands but is rather the sort of thing that reads as informed to a general audience and as tendentious to a specialist. It adopts a specific normative stance and presents it as the inevitable conclusion of linguistic and legal facts, when both the linguistics and the law are actually contested or contrary to its claims. For your review essay, it would serve best as a foil that articulates the intuitive case against the distinction, allowing you to demonstrate why the philosophical literature maintains the distinction despite these pressures. You can cite it to show the stakes of the debate, but you should not rely on it for accurate claims about the law or the state of play in ethics.
