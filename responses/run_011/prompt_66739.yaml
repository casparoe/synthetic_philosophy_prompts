          *   Key distinction: Alienation is about the *activity* of labor, Exploitation is about the *distribution* of the product.
      *   *Section 3: The Genuine Pressure Point.*
          *   It's not Alienation. It's the **moral/normative force of Exploitation** and the **systemic logic of Crisis**.
          *   If LTV goes, Exploitation becomes "inequality" (distributive justice) rather than "theft" (production justice).
