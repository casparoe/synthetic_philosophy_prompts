answer: |-
  This is one of the most enduring and sophisticated debates in Marxist scholarship. It essentially pits the **Analytical Marxists** (who often try to salvage Marx's critique without the Labor Theory of Value, or LTV) against the **Value-Form theorists** (who argue the LTV is the indispensable core of the entire critique).

  Your intuition and your colleague's intuition are both capturing different halves of the elephant. However, on the specific question of dependency, **your colleague is closer to the mark regarding Alienation, while you are partially right but normatively vulnerable regarding Exploitation.**

  Here is the breakdown of what each claim presupposes about value theory, followed by the identification of the genuine pressure point.

  ### 1. Exploitation: Surplus Labor vs. Surplus Value

  You argue that exploitation is about the extraction of surplus labor, which is a physical/social fact independent of price theory. Your colleague likely argues that without the LTV, "exploitation" loses its specific meaning and collapses into generic "inequality."

  **What Exploitation Presupposes:**
  *   **The Positive Claim (Surplus Labor):** You are correct that the *material basis* of exploitation does not require the LTV. It is an observable fact that workers can produce more in a day than is required for their own subsistence. A neoclassical economist can grant that workers produce a surplus; they simply call the distribution of that surplus "profit," "interest," or "return on capital."
  *   **The Normative Claim (Unjust Appropriation):** This is where your colleague has the stronger hand. To move from "surplus labor exists" to "this is *exploitation* (i.e., theft/wrongful extraction)," you need a normative standard for who *should* own the product.
      *   **With LTV:** Since labor is the *sole source of value*, any claim on that value by a non-laborer (the capitalist) is, by definition, an appropriation of what belongs to the worker. The LTV provides the moral arithmetic that makes profit look like theft.
      *   **Without LTV (Marginalism):** Value is subjective. Capital contributes to production (by providing tools, time, risk-bearing). Therefore, the capitalist's share is a legitimate "factor payment" for the service of capital.
      *   **The Dependency:** If you strip out the LTV, you can still describe *inequality*, but you lose the specific Marxian charge that profit is *unpaid labor time*. You are left with a distributive critique (the pie is shared unfairly) rather than a productive critique (the pie was stolen in the making).

  **Verdict:** Exploitation as a *descriptive* category (surplus labor) is independent of LTV. Exploitation as a *critical/normative* category (theft of value) is heavily dependent on it, unless you substitute the LTV with a different theory of property rights (as John Roemer attempted).

  ### 2. Alienation: Essence vs. Value

  You argue that Alienation depends on the LTV because without labor being the source of value, the worker's estrangement from the product is just a property dispute. Your colleague thinks the dependency runs backwards.

  **What Alienation Presupposes:**
  *   **Anthropological, Not Economic:** Alienation (particularly in the *Economic and Philosophic Manuscripts* of 1844) is primarily an anthropological and phenomenological claim, not a quantitative economic one. It concerns human *essence* (*Gattungswesen*), agency, and self-actualization.
  *   **The Role of Labor:** For Marx, labor is the process by which humans externalize their creativity into the world. Alienation occurs when this product stands opposed to them as an alien power.
  *   **Independence from LTV:** This process does not require labor to be the *measure of exchange value*. Even in a marginalist world where value is subjective, a worker can still feel estranged if they have no control over their work, if the product dominates them, or if their activity is meaningless.
      *   **Example:** A software engineer in a modern tech firm (operating in a marginalist economy) can feel profoundly alienated despite the fact that no one is calculating the "socially necessary labor time" of their code. They are alienated because they lack agency and the product serves a logic (shareholder value) external to their own human development.
  *   **The Dependency:** Alienation depends on a **philosophy of praxis** (humans make themselves through work), not a **theory of price**. If you strip out the LTV, Alienation remains intact as a critique of the *social form* of work and the loss of human agency.

  **Verdict:** You have this backwards. Alienation is the *least* dependent on the strict LTV of *Capital*. It relies on a Hegelian/Feuerbachian view of human nature. Your colleague is right: Alienation is the foundation; the LTV is an attempt to give that philosophical insight economic rigor later in Marx's career.

  ### 3. The Genuine Pressure Point

  If the LTV is rejected (as it largely has been by mainstream economics), where does the Marxian critique actually break?

  The pressure point is not Alienation, and it is not the physical existence of Surplus Labor. **The pressure point is the claim that Capitalism is a system of *Impersonal Domination* driven by the self-valorization of Value.**

  Here is why this is the critical vulnerability:

  1.  **The Moral Force of Exploitation:** Without the LTV, Marx's critique risks collapsing into a standard liberal critique of inequality. If profit is not unpaid labor, but rather a reward for risk/time-preference, then the remedy is not the abolition of capital, but the redistribution of income (welfare capitalism). The LTV is what necessitates *revolution* rather than *reform*.
  2.  **Systemic Crisis (TRPF):** Marx's theory of crisis (the Tendency of the Rate of Profit to Fall) relies on the distinction between organic composition of capital (machines vs. labor) and the rate of surplus value. If you adopt marginalism, "capital" and "labor" are just substitutable factors with prices. The specific dynamic where labor is the *only* source of new value (and thus replacing labor with machines lowers the rate of profit) collapses. Without LTV, you lose the specific Marxian explanation for why capitalism is *unstable* by its own internal logic.
  3.  **Commodity Fetishism:** This is the deepest pressure point. Marx's claim that social relations between people take the "fantastic form" of relations between things depends on the idea that value is a social substance congealed in commodities. If value is merely subjective preference (marginalism), "Fetishism" becomes a metaphor rather than a structural description of how the economy mediates social life.

  ### Summary of the Debate

  *   **On Exploitation:** You are right that the *mechanism* (surplus labor) exists without LTV. Your colleague is right that the *condemnation* (theft) loses its specific arithmetic without LTV.
  *   **On Alienation:** Your colleague is right. Alienation is a critique of the *activity* of labor and human agency, which stands regardless of how prices are set. You are underestimating the philosophical depth of Alienation by reducing it to a claim about value ownership.
  *   **The Pressure Point:** The genuine vulnerability lies in the **systemic logic**. Without the LTV, Marx's critique loses its ability to explain why capitalism *must* crisis and why profit is *structurally* illegitimate rather than just *distributionally* unfair.

  **Recommendation:** Concede the point on Alienation to your colleague (it is more fundamental and robust without LTV). Hold your ground on Surplus Labor as a material fact, but acknowledge that without LTV, the transition from "Surplus Labor" to "Exploitation as Theft" requires a different normative bridge (usually property relations theory). The true cost of dropping LTV is the loss of the claim that capitalism is objectively doomed to fail, rather than just morally undesirable.
