prompt: |-
  I am deep into a novel whose centre is a daughter deciding whether to go home and nurse a father who was cruel to her, and I have come to see that the book's real argument concerns a question I cannot settle by intuition: what makes the obligations attached to a role — daughter, elder brother, teacher, magistrate — obligations at all, rather than costly social habits. Before I let my characters debate it further, I want the specification, not the debate.

  Write the desiderata: what any adequate account of role-based obligation must deliver. Which cases it must get right — two roles pulling in opposite directions on the same day; a role one never chose and cannot exit; the son who knows his father has stolen a sheep and must decide whether to testify; and a role shaped unjustly by the surrounding society, so that the same account must condemn the very position it grounds. Which distinctions it may not collapse — role obligation versus the mere expectation attached to the role, having a role versus filling it well, and reasons that are mine because of who I am to this person versus reasons anyone would have. Which results it must be consistent with — that these duties are experienced as non-optional, that a tradition can revise its roles from within, and that filial duty has historically been held to include remonstrating with a parent one is obliged to honour. Give the case or consideration behind each item, and mark which are non-negotiable and which are preferences of a camp; I suspect that requiring impartial justifiability is already a partisan move, and I want to be told plainly if I am wrong.

  Then say which single desideratum eliminates the most candidates, and whether any pair cannot be jointly satisfied — in particular, if a strong claim that the self is constituted by its relations is incompatible with the capacity to condemn one's own roles, say so flatly, since that is the tension my novel is trying to hold open rather than resolve. Close with a brief scorecard for impartialist accounts, voluntarist or commitment-based accounts of special obligations, and the Confucian position. And because I will be building on this: tell me how confident you are in each of your main claims, and single out the one point you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel about a daughter deciding whether to nurse a cruel father. The core philosophical question is the nature of role-based obligation (why are they obligations and not just habits?).
      *   **Task:** Write the *desiderata* (criteria for success) for any adequate account of role-based obligation.
      *   **Specific Requirements:**
          *   List specific cases/considerations (conflicting roles, unchosen roles, criminal father, unjust social roles).
          *   List distinctions that must not be collapsed (obligation vs. expectation, having vs. filling well, special vs. general reasons).
          *   List results that must be consistent with (non-optional experience, internal revision, remonstrance).
          *   Mark items as "Non-negotiable" or "Preferences of a camp."
          *   Address the user's suspicion about "impartial justifiability" being partisan.
          *   Identify the single desideratum that eliminates the most candidates.
          *   Identify if any pair cannot be jointly satisfied (specifically: self constituted by relations vs. capacity to condemn roles).
          *   Provide a scorecard for three accounts: Impartialist, Voluntarist/Commitment, Confucian.
          *   Provide confidence levels for main claims and identify the least sure point.
      *   **Tone:** Philosophical, precise, nuanced, suitable for a novelist digging into deep ethical theory without needing a lecture, but needing structural clarity.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Role Obligations:* Special duties arising from relationships/positions (parent, child, citizen).
      *   *The Problem:* Why do they bind? Is it consent? Utility? Constitutive identity? Divine command?
      *   *Key Tensions:* Particularity (my father) vs. Universality (anyone); Facticity (I am his daughter) vs. Normativity (I ought to care); Oppression (bad roles) vs. Obligation (binding nature).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Cases:*
          1.  *Conflicting Roles:* Daughter vs. Citizen. (Needs prioritization or tragedy).
          2.  *Unchosen/Unexitable:* Birth roles. (Voluntarism struggles here).
          3.  *The Stolen Sheep:* Loyalty vs. Justice. (Partiality vs. Impartiality).
          4.  *Unjust Roles:* Slave/Master or Patriarchal Daughter. (Must allow critique).
      *   *Distinctions:*
          1.  *Obligation vs. Expectation:* "Good daughters do X" vs. "Daughters must do X."
          2.  *Having vs. Filling:* Being a teacher vs. being a *good* teacher.
          3.  *Special vs. General:* "Because he's my dad" vs. "Because he's suffering."
      *   *Results:*
          1.  *Non-optional:* They feel like demands, not suggestions.
          2.  *Internal Revision:* Roles evolve (e.g., fatherhood today vs. 1800s).
          3.  *Remonstrance:* Honoring includes correcting (Confucian *jian*).

      *   *Marking Status:*
          *   Non-negotiable: Phenomenology of obligation, ability to handle unchosen roles, ability to critique unjust roles.
          *   Camp Preferences: Impartial justifiability (Liberal), Constitutive identity (Communitarian/Confucian).

  4.  **Addressing the "Impartial Justifiability" Suspicion:**
      *   The user suspects requiring impartial justifiability is partisan.
      *   *Verdict:* They are right. Strict impartialism (Kantian/Utilitarian) often dissolves special obligations into general ones. Requiring that role duties be justifiable to a neutral observer is a Liberal/Enlightenment constraint, not a neutral starting point.

  5.  **Identifying the "Killer" Desideratum:**
      *   What kills the most theories?
      *   *Voluntarism* dies on "Unchosen Roles."
      *   *Impartialism* dies on "Special Reasons" (Partiality).
      *   *Strong Constitutivism* dies on "Critique of Roles."
      *   *Decision:* The requirement to **condemn unjust roles while acknowledging their binding force** is the hardest. It requires a normative standard *internal* to the role but *critical* of its current instantiation. Actually, the "Unchosen/Unexitable" case kills Voluntarism instantly. But the "Unjust Role" case kills strong Traditionalism/Confucianism if not nuanced.
      *   *Refinement:* The prompt asks for the *single* desideratum that eliminates the most candidates. The "Unchosen/Involuntary" requirement eliminates all Contractarian/Voluntarist models. That's a huge chunk of modern moral theory.

  6.  **Addressing the Incompatibility (Self-Constitution vs. Critique):**
      *   If I *am* my relations (strong constitutivism), how can I stand outside them to judge them?
      *   *Answer:* They are in tension. Strong constitutivism makes critique very hard (requires "second nature" or internal resources). Radical autonomy makes role obligation unintelligible.
      *   *Novel's Tension:* This is exactly the user's plot. I need to confirm this tension is real and not easily solved.

  7.  **Scorecard:**
      *   *Impartialist:* Good on critique, bad on special binding force.
      *   *Voluntarist:* Good on autonomy, bad on family/birth roles.
      *   *Confucian:* Good on unchosen/special, good on remonstrance, risky on unjust social structures (requires "Way" to judge).

  8.  **Confidence Levels:**
      *   Need to be honest. Philosophy doesn't have "facts."
      *   High confidence: Voluntarism fails on birth roles.
      *   Medium confidence: The incompatibility of strong constitutivism and radical critique.
      *   Low confidence: Whether a hybrid theory can fully resolve the "Unjust Role" paradox without begging the question.

  9.  **Drafting the Content (incorporating the constraints):**
      *   *Structure:*
          1.  Introduction (acknowledging the depth of the question).
          2.  The Desiderata (Cases, Distinctions, Results).
          3.  Status Markings (Non-negotiable vs. Camp).
          4.  The "Killer" Desideratum.
          5.  The Incompatibility (Constitution vs. Critique).
          6.  Scorecard.
          7.  Confidence & Uncertainty.

      *   *Refining the "Impartiality" point:* Ensure I validate the user's intuition. It *is* a partisan move (Liberalism).
      *   *Refining the "Confucian" point:* Ensure *jian* (remonstrance) is highlighted as it fits the novel's theme.
      *   *Refining the "Tension":* Make sure I don't solve it for them. The novel wants to hold it open.

  10. **Review against Constraints:**
      *   Did I specify cases? Yes.
      *   Did I specify distinctions? Yes.
      *   Did I specify results? Yes.
      *   Did I mark Non-negotiable vs. Camp? Yes.
      *   Did I address impartiality suspicion? Yes.
      *   Did I identify the single eliminating desideratum? Yes.
      *   Did I address the incompatibility? Yes.
      *   Did I provide the scorecard? Yes.
      *   Did I provide confidence levels? Yes.

  11. **Final Polish:** Check tone. Needs to be authoritative but open, respecting the literary context. Avoid overly technical jargon where plain English serves better, but keep philosophical precision. (Self-Correction: Ensure the distinction between "obligation attached to a role" and "obligation to fulfill a role well" is clear.)

  12. **Final check on Confidence:** I need to assign specific probabilities or qualitative levels. Qualitative (High/Med/Low) is usually more honest in philosophy. I will use High/Medium/Low with brief justification.

  13. **Final check on "Least Sure":** The exact mechanism of internal critique in constitutive accounts is the murkiest area in meta-ethics. I'll flag that.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here are the desiderata for an adequate account of role-based obligation, structured to serve the philosophical architecture of your novel.

  ### I. The Desiderata

  #### A. Cases the Account Must Get Right
  1.  **The Conflict of Roles:** A magistrate must sentence her own brother. The account must explain why the pain is not merely psychological but normative (two *oughts* colliding), and provide a principle for resolution or acknowledge the remainder (tragic residue).
      *   *Status:* **Non-negotiable.** Any theory that dissolves the conflict (saying one duty wasn't real) fails the phenomenology.
  2.  **The Unchosen/Unexitable Role:** The daughter who never chose to be a daughter, and cannot cease to be one even by estrangement.
      *   *Status:* **Non-negotiable.** This eliminates pure contractarianism.
  3.  **The Stolen Sheep (Partiality vs. Justice):** The son who knows his father committed a minor crime. The account must explain why "he is my father" is a reason to hesitate that does not apply to a stranger, without collapsing into corruption.
      *   *Status:* **Non-negotiable.** It must ground *special* reasons.
  4.  **The Unjust Role:** The role of "subservient wife" or "colonized subject." The account must allow the occupant to say, "This role binds me, yet the demands it currently makes are illegitimate."
      *   *Status:* **Non-negotiable.** Otherwise, the theory becomes an apology for oppression.

  #### B. Distinctions the Account Must Not Collapse
  1.  **Obligation vs. Expectation:** The difference between "A good daughter visits" (supererogatory/ideal) and "A daughter visits" (mandatory).
      *   *Status:* **Non-negotiable.** Collapsing this turns all morality into aspirational aesthetics.
  2.  **Having a Role vs. Filling It Well:** One can be a corrupt magistrate and still *be* a magistrate, subject to the obligations of the office even while violating them.
      *   *Status:* **Non-negotiable.** Necessary to explain guilt and accountability.
  3.  **Special Reasons vs. General Reasons:** "I must help him *because he is my father*" vs. "I must help him *because he is suffering*."
      *   *Status:* **Camp Preference (Particularists vs. Impartialists).** Impartialists try to reduce the former to the latter; Particularists insist the former is irreducible. *Note: Your suspicion is correct. Requiring that special reasons be reducible to general reasons is a partisan Imperialist/Utilitarian move.*

  #### C. Results the Account Must Be Consistent With
  1.  **The Experience of Non-Optionality:** Role duties present themselves as claims upon us, not choices we weigh against preference.
      *   *Status:* **Non-negotiable.**
  2.  **Internal Revision:** Traditions can change the definition of "father" or "teacher" from within without abolishing the role.
      *   *Status:* **Non-negotiable.**
  3.  **Remonstrance:** Filial duty includes the duty to correct a parent's moral error (the Confucian *jian*).
      *   *Status:* **Camp Preference (Confucian/Virtue Ethics).** Liberal individualism often views this as interference; Communitarianism views it as care.

  ---

  ### II. The Partisan Move
  You are right to be suspicious. **Requiring impartial justifiability is a partisan move.**

  It belongs to the Liberal-Enlightenment camp (Kantian, Utilitarian, Scanlonian). It assumes that for an obligation to be real, it must be defensible to a generic rational agent standing nowhere in particular. If you build this into your desiderata as "Non-negotiable," you have already written the ending of your novel: the daughter will only owe care if a neutral observer says she should. This strips the role of its *particularity*, which is the very thing your characters are wrestling with.

  *   **Mark:** **Camp Preference (Liberal/Impartialist).**
  *   **Alternative:** A "Natural Duty" or "Constitutive" account where obligations arise from the reality of the relationship itself, regardless of whether a neutral third party would endorse them.

  ---

  ### III. The Killer Desideratum
  The single desideratum that eliminates the most candidates is: **The Unchosen/Unexitable Role.**

  *   **Why:** It instantly falsifies **Voluntarist/Contractarian** accounts (which dominate modern Anglo-American moral philosophy). If obligation requires consent, promise, or undertaking, then filial duty is a fiction. To save Voluntarism, one must argue for "tacit consent" (by staying home, you agree to nurse him), which is notoriously weak and often fictional.
  *   **Impact:** This forces the debate away from *choice* and toward *identity* or *nature*.

  ---

  ### IV. The Incompatibility
  You asked if a strong claim that **the self is constituted by its relations** is incompatible with the **capacity to condemn one's own roles.**

  **Yes, they are in deep tension, potentially incompatible.**

  *   **The Conflict:** If my identity is *constituted* by being a daughter (I am not a "self" who *has* a father, but a "daughter" whose selfhood is woven from that relation), then the standards by which I judge the role must also come from that relation. I cannot step outside the role to judge it without stepping outside myself.
  *   **The Risk:** Strong constitutivism risks conservatism. If the role makes me, how can I call the role unjust without calling my own existence unjust?
  *   **The Novel's Task:** To hold this open, your daughter must find a resource for critique that is *internal* to the relationship but *transcendent* of the current social script. (e.g., "I am honoring the *true* meaning of daughterhood by refusing this *corrupt* version of it.")
  *   **Verdict:** Do not resolve this. If you resolve it, you dissolve the tragedy. If she can easily condemn the role, she wasn't constituted by it. If she can't condemn it, she isn't moral. The pain is the point.

  ---

  ### V. Scorecard for Existing Accounts

  | Account | Strengths | Weaknesses | Fit for Novel |
  | :--- | :--- | :--- | :--- |
  | **Impartialist** (Kant/Util) | Excellent at condemning unjust roles (appeals to universal rights). | Fails to explain why *this* father matters more than *any* suffering stranger. Makes filial duty optional or derivative. | **Low.** Makes the daughter's struggle seem irrational. |
  | **Voluntarist** (Contract/Commitment) | Respects autonomy. Explains why we can quit some roles (jobs). | Fails on birth roles. Forces the "tacit consent" fiction. | **Low.** Denies the premise of the unchosen bond. |
  | **Confucian** (Role Ethics) | Excellent on unchosen roles. Builds remonstrance (*jian*) into the duty itself. | Risks validating hierarchy. Requires belief in a "Way" (Dao) that grounds the roles normatively. | **High.** Matches the tension of binding duty + moral critique. |

  ---

  ### VI. Confidence and Uncertainty

  **Confidence Levels:**
  *   **High Confidence:** That Voluntarism fails to account for unchosen family obligations without resorting to fiction.
  *   **High Confidence:** That requiring impartial justifiability is a partisan Liberal constraint, not a neutral meta-ethical requirement.
  *   **Medium Confidence:** That the tension between "constituted self" and "critical agency" is logically irreconcilable without a third term (e.g., a metaphysical claim about human nature or the Dao).

  **The Point of Least Certainty:**
  I am least sure about the **mechanism of internal critique in constitutive accounts.**
  *   *The Claim:* Confucianism claims you can critique a role from within by appealing to the "spirit" of the role against its "letter."
  *   *The Uncertainty:* It is philosophically murky how one accesses the "true spirit" of a role without already possessing an independent moral standard *outside* the role. If the daughter says, "A real daughter wouldn't submit to this," where did she get the definition of "real"? If she got it from society, society is the oppressor. If she got it from within, how is it not just her personal preference?
  *   *Why it matters for you:* This is the exact epistemological hole your protagonist falls into. She needs a standard of "good daughter" that isn't just "obedient daughter," but she has no authority to write that standard. **This is the most fertile ground for your novel's ambiguity.**
