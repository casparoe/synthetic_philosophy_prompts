answer: |-
  You are instinctively reaching for a legal principle, while your friend is using a historiographical heuristic. They are talking past each other because they are using different rulebooks for "truth."

  Here is the carving you asked for: the name of the move, its cousins, when it is legitimate, and the boundary lines.

  ### 1. The Name of the Move

  There is no single academic term that captures *exactly* the epistemic shift you described (that removing a lie makes the remainder *more* true), but there are two labels you need to wield to pin it down.

  **The Legal Principle You Were Missing:**
  *Falsus in uno, falsus in omnibus* ("False in one thing, false in everything").
  This is the standard rule of evidence you were intuitively applying. If a witness is caught fabricating a detail, their entire testimony is tainted. Your friend is explicitly arguing that ancient texts should be exempt from this rule.

  **The Historiographical Move:**
  **Subtractive Validation** (or **Rationalizing Euhemerism**).
  *Euhemerism* is the ancient theory that myths are distorted memories of real human events (gods were just deified kings). *Subtractive Validation* is the specific argumentative tactic you encountered: the claim that by subtracting the "impossible" elements, the remaining "natural" elements are not just *possible*, but *validated*.

  If you want a label for the logical error specifically, call it **The Fallacy of Residual Credibility**. This names the mistake of assuming that the residue of a story, after lies are removed, inherits the credibility of the original text rather than losing it.

  ### 2. The Nearest Cousins (and how they differ)

  You sensed there are traditions that do this. There are. Here is where they part ways with your friend's move.

  *   **Demythologization (Bultmann):** This is a theological method that strips supernatural language to find the *existential meaning*, not the historical fact.
      *   *Difference:* Your friend wants history (did the wall fall?); Demythologization wants truth of meaning (what does the falling wall say about human anxiety?).
  *   **Rationalization (Palaephatus):** An ancient Greek practice of explaining myths as misunderstandings of natural events (e.g., "Centaur" was just a tribe who rode horses).
      *   *Difference:* This is an attempt to explain the *origin* of the myth, not necessarily to vouch for the *accuracy* of the remaining narrative.
  *   **Source Criticism (Biblical):** Separating text into layers (J, E, P, D sources) to find older traditions.
      *   *Difference:* Finding an older layer makes it *older*, not necessarily *true*. Your friend is conflating "older/core" with "factual."

  **The Split:** All these cousins treat the "stripped" text as a hypothesis to be tested. Your friend treats the stripped text as a conclusion that has been *proven* by the act of stripping.

  ### 3. Is It Ever Legitimate?

  Yes. Subtractive Validation is a standard tool in history, but only under specific conditions. It works when the fabrication is **Ornamental**, but fails when the fabrication is **Structural**.

  **Legitimate Use (Ornamental Embellishment):**
  *   **Context:** We have independent evidence of a cultural bias toward exaggeration.
  *   **Example:** A Roman inscription says an Emperor killed 10,000 enemies in a skirmish. We know Roman propaganda always inflates numbers.
  *   **The Move:** Subtract the "10,000."
  *   **The Result:** "The Emperor won a skirmish."
  *   **Why it works:** The direction of the error is predictable (inflation). Removing the inflation moves you closer to the baseline. The lie was *decorative*.

  **Illegitimate Use (Structural Dependency):**
  *   **Context:** The "miracle" is the mechanism of the event, not just the decoration.
  *   **Example:** The Exodus. The story is not "Slaves left Egypt." The story is "Slaves left Egypt *because the sea split*."
  *   **The Move:** Subtract the "sea splitting."
  *   **The Result:** "Slaves left Egypt."
  *   **Why it fails:** You have removed the *cause*. Without the miracle, the escape is arguably *less* plausible (how did they outrun chariots in the desert?). The lie was *load-bearing*. Removing it doesn't leave a solid core; it leaves a hole.

  ### 4. The Carving: Boundaries and Edge Cases

  To win this argument, you need to distinguish between **Correcting for Bias** and **Assuming a Kernel**. Here is the boundary map.

  **Zone 1: The Bias Correction (Legitimate)**
  *   **Condition:** You can prove the source has a known motive to exaggerate specific *types* of details (numbers, divine favor, lineage).
  *   **Test:** Does removing the detail make the event *more* physically plausible?
  *   **Verdict:** Subtractive Validation is allowed. The residue is *plausible*, but still requires external proof.

  **Zone 2: The Kernel Fallacy (Illegitimate)**
  *   **Condition:** The source is treated as a "black box" where *some* truth must exist simply because the story exists.
  *   **Test:** Is the "miracle" being treated as a shell that can be cracked to reveal the nut?
  *   **Verdict:** This is **The Fallacy of Residual Credibility**. It assumes that myths are always distorted history, rather than sometimes being invented theology, folklore, or political fiction.

  **Zone 3: The Structural Void (The Hard Stop)**
  *   **Condition:** The supernatural element is the *explanation* for the event.
  *   **Example:** "Jericho's walls fell because God shouted."
  *   **The Move:** "Remove God. The walls still fell."
  *   **The Error:** You have kept the *effect* but deleted the *cause*. In a court of law, if a witness says "He died because I shot him," and you prove they didn't shoot him, you cannot conclude "He still died." You must ask "How did he die?"
  *   **Verdict:** If the miracle is the engine, removing it invalidates the narrative, it doesn't purify it.

  ### 5. The Weaponized Label

  If you need a term to use in the next argument that captures the specific fraud of turning a subtraction into an addition, use this:

  **"Proof by Subtraction"**

  **Definition:** The logical error of treating the removal of falsifiable claims as evidence for the truth of the remaining unfalsifiable claims.

  **The Soundbite:**
  > "You're using **Proof by Subtraction**. In every other context, if I catch you lying about the details, I trust your summary *less*, not more. You're treating the miracles like a protective shell that, when cracked, reveals a historical nut. But if the miracle is the *glue* holding the story together, removing it doesn't reveal history—it collapses the structure. You can't spend the impossible elements like currency to buy credibility for the possible ones."

  **The Boundary Case to Trap Them:**
  Ask them this:
  > "If I tell you I flew to work today on a dragon, but the dragon is a metaphor for the subway, do you trust me *more* about my arrival time than if I just said I took the subway? Or does the fact that I was willing to fabricate a dragon make you wonder if I actually went to work at all?"

  If they say "More," they are arguing from faith, not history. If they say "Less," they have conceded your point.
