  **Methodology**
  This is a philosophy project because it analyzes the conditions of legitimacy for epistemic authority, not merely the empirical distribution of resources. Consequently, conceptual work on cases beats formal modeling or surveys. Models assume the parameters I intend to problematize (e.g., who bears verification costs), and surveys describe behavior rather than normative structures.
  *   *Months 1–3:* Conceptual mapping of signaling regimes (waste vs. audit) and literature review across philosophy, biology, and economics.
  *   *Months 4–6:* Comparative case studies (e.g., academic credentials vs. conspicuous consumption) to identify power shifts in certifying authority.
  *   *Months 7–9:* Synthesis and drafting arguments on the normative implications of verification infrastructure.

  **The Cost Objection**
  The obvious objection is that verification is itself costly, so waste is merely hidden in an office somewhere. Nothing is saved; the cost is just shifted. To settle this, I must demonstrate that the *structure* of the cost matters morally. Waste imposes variable costs on the signaler; audit imposes fixed infrastructural costs on the verifier. If fixed costs create exclusionary barriers that variable costs do not, the switch redistributes power rather than eliminating cost. Success requires showing that audit capacity is a scarce, concentrated resource that excludes actors who could previously signal via waste.

  **Expected Results and Failure Conditions**
