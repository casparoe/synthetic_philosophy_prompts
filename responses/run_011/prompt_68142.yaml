answer: |-
  (a) **Mark: 22/30**

  *   **Accurate exposition (7/8):** The distinction between the truth of the criticism and the propriety of the address in [1] is precise and demonstrates a secure grasp of the core concept. One mark is deducted because the conclusion in [6] muddies this distinction by implying the standing objection answers the charge of wrongdoing itself.
  *   **Reasoned account of standing (7/8):** The explanation of how to avoid the 'collapse' of standing via the exemption condition in [2] is robust and directly addresses the prompt's constraints. The extension to complicity in [3] is plausible, though the claim of 'no principled difference' is slightly under-supported.
  *   **Critical evaluation (4/8):** While the script defends the proposed account rigorously, it fails to meet the rubric requirement for a developed *objection* to that account. The script argues *for* the position rather than evaluating its limits or vulnerabilities, which caps this component in the lower band.
  *   **Structure, relevance and clarity (4/6):** The essay is logically organised and clearly written throughout. However, the substantive tension between the opening concession in [1] and the concluding upshot in [6] undermines the overall coherence of the argument.

  (b) **Paragraph Feedback**

  *   **[1]** This is an excellent opening that cleanly separates the *tu quoque* fallacy from the standing objection, correctly identifying that standing concedes the truth of the charge. This sets a high standard for exposition, though you must ensure later paragraphs do not inadvertently retract this concession.
  *   **[2]** You handle the 'collapse' constraint very well here; explaining that standing is lost through *exemption* rather than *commission* is the correct move to avoid making standing unattainable. This is the strongest philosophical work in the script and secures most of the marks for the second rubric component.
  *   **[3]** The extension to complicity is relevant, but the claim that there is 'no principled difference' between commissioning and committing is asserted without sufficient argumentation. To secure full marks, you would need to briefly justify why the mechanism of standing loss is identical in both cases.
  *   **[4]** This paragraph deepens the account by suggesting the hypocrite does not blame at all, which is a sophisticated philosophical move. However, this functions as further defence of your chosen account rather than a critical evaluation of it, which the prompt requires.
  *   **[5]** You assert that standing is 'all-or-nothing' and that talk of diminished standing changes the subject. This is a controversial claim in the literature that requires argumentation; asserting it as fact limits your evaluation score as it overlooks plausible scalar accounts without engagement.
  *   **[6]** The conclusion creates a significant problem by suggesting the blamee can treat the standing objection 'as good as an answer to the charge'. This contradicts [1], where you conceded the charge is accurate; standing silences the blamer, it does not negate the wrongness of the act.

  (c) **Substantive Philosophical Mistakes**

  1.  **Mistake:** In [6], you claim that because the blamer lacks standing, the blamee has not been 'shown to have done wrong' and this is 'as good as an answer to the charge'.
      **Correct Position:** The standing objection blocks the *normative force of the blame*, not the *truth of the wrongdoing*. The blamee remains guilty of the wrong even if the blamer is silenced.
      **Category:** Step that does not follow (from the premise in [1] that the criticism is accurate).

  2.  **Mistake:** In [5], you claim entitlements to blame are not graded and that 'diminished standing' describes reception rather than propriety.
      **Correct Position:** Many plausible accounts allow for scalar standing (e.g., one's standing is reduced but not extinguished by minor hypocrisy); this claim requires argument rather than stipulation.
      **Category:** Claim asserted where the question required argument.

  3.  **Mistake:** The script treats the defence of the 'exemption' account as a 'critical evaluation' of it.
      **Correct Position:** Critical evaluation requires testing the account against counter-examples or objections (e.g., does this account rule out legitimate blame from reformed wrongdoers?).
      **Category:** Error of exposition (regarding the task requirements).

  (d) **Judgement on the Relation Between [1] and [6]**

  This is a **substantive misunderstanding** of what the standing objection establishes, rather than a mere slip under time pressure. In [1], you correctly identify that the standing objection concedes the truth of the criticism. In [6], you conclude that the blamee can treat the lack of standing as an answer to the charge of wrongdoing. This conflates the *authority to hold responsible* with the *fact of responsibility*. If the criticism is true (as per [1]), the blamee *has* done wrong; the standing objection merely prevents the hypocrite from being the agent who registers this fact normatively. To make [6] consistent with [1], you would have to add that the blamee is entitled to reject the *blame* or the *sanction*, but not to deny the *wrongness* of their action. The phrase 'as good as an answer to the charge' must be qualified to specify that it is an answer to the *blamer's authority*, not the *moral charge itself*.

  **Moving to the Next Band (24–30):**
  To reach the First-class band, you must address the rubric requirement for a **developed objection**. You have defended the 'exemption' account well, but you have not tested it. You needed to raise a specific problem for this view (e.g., 'Does this account unfairly silence reformed wrongdoers who now genuinely accept the standard?') and argue whether your account can survive it. Additionally, resolving the tension between [1] and [6] to ensure the distinction between truth and address is maintained throughout would have secured the higher band for structure and exposition.

  **Creditworthy Elements:**
  Do not undervalue the argument in [2] regarding the 'collapse' of the concept. This is a precise, high-quality philosophical argument that demonstrates third-year level understanding of the constraints on a theory of standing. Similarly, the distinction in [1] is textbook-perfect exposition. These elements prevent the script from falling into the lower 2:1 band despite the errors in evaluation and conclusion.
