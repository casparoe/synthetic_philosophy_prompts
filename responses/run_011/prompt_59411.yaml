answer: |-
  To assess the three modes of history distinguished by Nietzsche — the monumental, the antiquarian, and the critical — we must apply the stipulative definition of a self-consuming practice. A mode is self-consuming if its successful exercise depletes the resource required for its future continuation. The thesis to be defended is that only monumental history fits this description. While antiquarian history preserves its object and critical history judges it without erasing it, monumental history converts the past into fixed models, thereby exhausting the interpretative potential of the very material it mines.

  Monumental history functions by identifying great deeds or figures from the past to serve as exemplars for the present. For Nietzsche, this process is inherently violent towards the truth of the past. To elevate a historical figure into a monument, one must generalise and approximate, smoothing over contradictions and ignoring context. The dissimilar is treated as similar so that the past figure can resemble the contemporary agent seeking inspiration. This extraction is not a neutral description but a conversion. Once a particular life has been stripped of its nuances to serve as a model for courage, it loses the capacity to serve as a model for caution or diplomacy. The success of the monumental historian lies in fixing the meaning of the past event. However, this fixation consumes the event's ambiguity. The resource for monumental history is not merely the existence of past deeds, but their plasticity, their ability to be reshaped into new analogies. By solidifying a figure into a statue, the monumental historian burns the bridge back to the complex human being who might have supported a different model. Thus, the more successfully one builds monuments, the fewer raw materials remain for future monument-building, as the past becomes a gallery of rigid idols rather than a quarry of flexible examples.

  In contrast, antiquarian history does not consume its resource because its primary impulse is preservation rather than extraction. The antiquarian looks upon the past with veneration, seeking to protect and maintain whatever has been inherited. This mode does not require the suppression of detail; indeed, it thrives on the accumulation of particulars. Every object preserved adds to the stock of veneration available. While Nietzsche warns that this mode can lead to a mummification of life, the practice itself does not deplete the past. The antiquarian leaves the material intact, or even enlarges it through the care bestowed upon it. Similarly, critical history, which judges and condemns the past to break its oppressive power, does not deplete the resource for future judgement. The critical historian brings the past before a tribunal. Even if the verdict is guilty and the authority of the past is shattered, the past itself remains as evidence. A later generation can bring the same inheritance before its own tribunal again. The defendant is inexhaustible because the act of judgement does not erase the crime, only its legitimacy.

  Two significant objections threaten this classification. The first suggests that antiquarian history is the truly self-consuming mode. By venerating everything indiscriminately, the antiquarian flattens the past into an undifferentiated mass where nothing stands out. If everything is sacred, nothing is distinct, and thus the past ceases to support any discrimination or specific veneration. However, this objection confuses the loss of *value discrimination* with the loss of *material*. The stipulative definition concerns usable material for the practice itself. The antiquarian can always find something else to venerate within the accumulated mass. The resource is the sheer existence of the old, which remains abundant even if its internal hierarchy collapses. The practice chokes on abundance, but it does not starve from depletion.

  The second objection claims monumental history cannot be self-consuming because the supply of models is continually replenished by new great deeds. As history unfolds, new heroes arise to replace the old. This objection misunderstands the resource in question. The resource for monumental history is the *past's* capacity to yield models, not the present's capacity to generate deeds. New deeds only become resources once they have passed into history. Furthermore, the monumental mode relies on analogy with what is already established. If the existing past is rigidified into fixed models, the new deeds must force themselves into those pre-existing moulds, suffering the same consumption. The depletion is local to the interpretative flexibility of the historical record, which new deeds do not restore.

  This leads to the required explanation of asymmetry regarding critical history. If the critical historian breaks up and dissolves parts of the past, acting as a surgeon who sometimes cuts poorly, why is this not depletion? The distinction lies in what is destroyed. Critical history destroys the *authority* of the past, not its *existence* or its *availability*. When a chain of inheritance is broken, the links remain on the ground. They can be examined, judged again, or even reconnected differently. Monumental history, conversely, destroys *possibility*. By turning a fact into a myth, it removes the fact's ability to be anything other than that myth. The critical historian leaves the defendant alive for future trials; the monumental historian turns the defendant into a statue, ending the trial permanently.

  Despite the strength of this case, there is a weakest link. The argument hinges on the claim that critical history leaves the past available for future exercise. However, Nietzsche suggests that critical history must bring the past to the bar of judgement and sometimes execute it to make life possible. If the goal of history is to serve life, and critical history destroys the illusions or authorities that life might need, then it too consumes a resource: the resource of meaning or legitimacy. The most damaging concession required is that the distinction between destroying authority (critical) and destroying interpretative flexibility (monumental) is finer than the argument admits. If legitimacy is a usable material for life, then critical history depletes it just as monumental history depletes nuance. Ultimately, while monumental history is the most visibly self-consuming regarding historical material, critical history risks consuming the very validity required to sustain the historical consciousness itself.
