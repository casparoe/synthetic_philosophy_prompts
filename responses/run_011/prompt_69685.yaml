answer: |-
  **Joint Statement on the Normative Status of the Absent-Minded Driver Case**

  **Seminar:** Sequential Decision Theory (Graduate Level)
  **Signatories:** [Planning-First Representative] & [Action-Time Representative]
  **Date:** [Current Date]

  ### 1. Agreed Claims

  We, the undersigned, submit the following points as matters of fact, arithmetic, and shared theoretical commitment. Neither party contests the formal setup or the mathematical derivations described below.

  1.  **Setup and Payoffs:** The decision problem consists of two indistinguishable decision nodes (Exit 1, Exit 2) and a terminal node (Past Both). Payoffs are fixed: Exit 1 yields 0, Exit 2 yields 4, Past Both yields 1. The agent possesses imperfect recall regarding which node they occupy.
  2.  **Ex Ante Optimization:** Calculated from the start of the journey (Home), the strategy that maximizes expected utility is a mixed strategy: Continue with probability $p = 2/3$ and Exit with probability $1/3$. The expected value of this strategy is $4/3$.
  3.  **Conditional Credences:** If the agent adopts the plan $p = 2/3$, and applies standard conditionalization on the information "I am currently at an exit," the probability of being at Exit 2 is $2/5$ and Exit 1 is $3/5$.
  4.  **Ex Post Evaluation:** Given the credences in (3), the expected utility of the action *Exit* is $1.6$ ($0.4 \times 4 + 0.6 \times 0$). The expected utility of the action *Continue* depends on the assumed behavior at the next node. If the agent assumes they will adhere to the plan ($p=2/3$) at the next node, the value of Continuing is lower than 1.6. Thus, conditional on being at an exit and holding the plan $p=2/3$, the action *Exit* yields higher expected utility than *Continue*.
  5.  **Distinguishability:** If the exits were distinguishable (perfect recall), both sides agree the optimal policy is: Continue at Exit 1, Exit at Exit 2. The disagreement arises strictly from the condition of indistinguishability/imperfect recall.
  6.  **External Randomization:** If the agent is provided with an irreversible randomizing device at Home that enforces $p = 2/3$, both sides agree the agent should use it and obey the device at the exits. In this scenario, the expected payoff is $4/3$.
  7.  **Time Inconsistency:** Both sides agree that the preference ranking of actions at the exit differs from the preference ranking of plans at Home. The agent is time-inconsistent in the sense that the optimal plan at Home is not the optimal action at the Exit given the plan.

  ### 2. Residual Disagreements

  The following table summarizes the normative and metaphysical disagreements that remain after accepting the claims in Section 1.

  | Topic | Planning-First Characterization | Action-Time Characterization |
  | :--- | :--- | :--- |
  | **The Unit of Agency** | The primary agent is the temporal extended self (Home). The exit-self is a locus of execution, not a fresh locus of deliberation. Rationality requires the exit-self to act as the Home-self's delegate. | The primary agent is the time-slice. Each decision node is a distinct locus of deliberation. Rationality requires maximizing expected utility relative to the information available at that slice. |
  | **Normative Force of Plans** | An optimal ex ante plan binds the agent at later nodes even without an external enforcement device. To deviate is irrational because it reduces ex ante expected utility. | An intention is not a binding constraint. A plan is merely a prediction of future behavior. To act against current expected utility maximization is irrational, regardless of prior intentions. |
  | **Source of Paradox** | The paradox reveals a defect in standard causal decision theory when applied to self-locating belief. It demonstrates the need for updateless or policy-based evaluation. | The paradox is a bookkeeping error caused by treating an intention as a causal lever. It reveals nothing new about decision theory, only the hazards of imperfect recall. |
  | **Generalizability** | This case is a paradigm for all problems involving self-locating uncertainty (e.g., Sleeping Beauty). The lesson is that credences should not always update on self-location. | This case is specific to memory loss. In problems with perfect recall, ex ante and ex post optimization coincide. No general lesson for self-locating belief follows. |

  ### 3. Cruxes of the Dispute

  We identify five specific cruxes where our disagreements concentrate. For each, we specify the test case or argument bearing on it and record our divergent predictions.

  **Crux 1: The Unit of Decision Problem**
  *   **Issue:** Do the planner at Home and the driver at the Exit face one decision problem or two?
  *   **Test:** Consider a modified case where the driver can pay a small cost $\epsilon$ at Home to install a sign distinguishing the exits.
  *   **Planning-First Prediction:** The driver should pay $\epsilon$ (if small enough) to restore perfect recall, as this allows the optimal distinguishable strategy (Value 4). However, if distinguishing is impossible, the driver must treat the nodes as one problem solved at Home.
  *   **Action-Time Prediction:** The driver should pay $\epsilon$. The existence of the choice at Home does not negate the autonomy of the choice at the Exit. The "one problem" view conflates the *game* with the *decision*.
  *   **Bearing:** If the "one problem" view is correct, the Exit choice is not a decision but an execution. If "two problems" is correct, the Exit choice is a genuine decision that overrides prior plans.

  **Crux 2: Credences and Deliberation Crowding Out Prediction**
  *   **Issue:** Is it legitimate for the driver to feed his own adopted plan into his credences at the exit, and what happens if deliberation changes the plan?
  *   **Test:** The "Deliberation Crowds Out Prediction" thesis. If the driver decides at the exit to Exit, does his credence that he is at Exit 2 change? (Since if he exits, he wouldn't reach Exit 2, but if he is at Exit 2, he must have continued at Exit 1).
  *   **Planning-First Prediction:** Credences must be consistent with the *plan*, not the *deviation*. You cannot use the decision to update the probability of being at a node without creating a loop. This supports using the ex-ante $p$ for credences but the ex-ante plan for action.
  *   **Action-Time Prediction:** Credences are fixed by the strategy *actually* employed up to that point. If the driver deviates, it doesn't change the past probability of arrival. However, standard conditioning on the plan $p=2/3$ yields $P(E_2)=2/5$. The error is thinking this mandates sticking to $p$.
  *   **Bearing:** If credences depend on the plan, but action depends on credences, we have a fixed-point problem. PF solves it by fixing the plan ex-ante. AT solves it by maximizing locally.

  **Crux 3: The Irreversible Randomizing Device**
  *   **Issue:** Does handing the driver an irreversible randomizing device before departure change the recommendation, and which side does this favor?
  *   **Test:** Compare the "Mental Coin" (intention to randomize) vs. "Physical Coin" (device set to $2/3$).
  *   **Planning-First Prediction:** The device changes nothing normative, only causal. It merely secures compliance. The fact that we *need* the device to secure $4/3$ shows that unaided rationality is insufficient in this structure.
  *   **Action-Time Prediction:** The device changes the decision problem entirely. With the device, the exit choice is no longer a decision (it is determined). Without the device, it is a decision. The fact that the solution requires removing agency at the exit proves that *agency* at the exit dictates exiting.
  *   **Bearing:** PF sees the device as a tool for rational agents. AT sees the device as a workaround for the limitations of rational agency in imperfect recall.

  **Crux 4: Generalization to Self-Locating Belief**
  *   **Issue:** Does the case generalize to problems involving self-locating belief with no memory loss (e.g., Sleeping Beauty)?
  *   **Test:** Apply the "Planning-First" updateless reasoning to a Sleeping Beauty variant where bets are offered.
  *   **Planning-First Prediction:** The lesson generalizes. Agents should sometimes ignore self-locating evidence to maximize policy value. AMD is the sequential decision analogue of Sleeping Beauty.
  *   **Action-Time Prediction:** The lesson does not generalize. AMD relies on *forgetting* (imperfect recall). In Sleeping Beauty (perfect recall of the protocol, just uncertain day), standard Bayesian updating applies. AMD is an artifact of memory loss.
  *   **Bearing:** If AMD generalizes, it demands a revision of Bayesianism. If it is specific to memory loss, it is a niche puzzle in game theory.

  **Crux 5: Dutch Bookability (Missed Crux)**
  *   **Issue:** Can the agent be pumped for money due to their decision rule?
  *   **Test:** Offer bets at Home and at the Exit that guarantee a loss for one view but not the other.
  *   **Planning-First Prediction:** The Action-Time agent is Dutch Bookable. They will accept a bet at Home based on $p=2/3$ and a conflicting bet at the Exit based on $P(E_2)=2/5$.
  *   **Action-Time Prediction:** The Planning-First agent pays to avoid information. They will reject profitable bets at the Exit because they conflict with the Home plan. This is irrational risk-aversion regarding information.
  *   **Bearing:** If AT is Dutch Bookable, PF wins on instrumental grounds. If PF rejects free money/information, AT wins on procedural grounds.

  ### 4. Analysis of Verbal Dispute

  We suspect a portion of our disagreement is verbal, specifically regarding the modal verb "should."

  *   **The Ambiguity:** "What the driver *should* do" oscillates between (A) "Which policy should the agent adopt at the start of the game?" and (B) "What action should the agent take given their current information set?"
  *   **Planning-First Usage:** We use "should" primarily in sense (A). We argue that (B) is subordinate to (A). To say the driver "should exit" is false because it implies (B) overrides (A).
  *   **Action-Time Usage:** We use "should" primarily in sense (B). We argue that (A) is merely a prediction of (B). To say the driver "should continue" is false because it violates the maximization principle at the node of action.
  *   **Why It Is Only Apparent:** Resolving the terminology does not resolve the normative conflict. Even if we agree to say "The driver should *adopt the plan* to continue, but should *execute the action* to exit," the Planning-First side maintains that executing the exit is irrational (a failure of agency), while the Action-Time side maintains that adopting the plan is irrelevant (a failure of prediction). The dispute is not merely about labeling, but about whether rationality is a property of *policies over time* or *actions at times*.

  ### 5. Settlement Conditions

  There is no single empirical claim or formal result that will settle this matter, as the disagreement is foundational regarding the definition of rational agency. However, we agree that the dispute would be effectively settled if either of the following were established:

  1.  **A Dutch Book Theorem:** A rigorous proof demonstrating that the Action-Time strategy leads to a sure loss in a standard betting market setup *without* assuming the agent can precommit, while the Planning-First strategy avoids it. (Favors Planning-First).
  2.  **A Stability Proof:** A rigorous proof demonstrating that the Planning-First strategy requires the agent to pay to avoid free information or free bets at the exit, while the Action-Time strategy remains stable. (Favors Action-Time).

  Until such a proof is produced, we acknowledge that our divergence rests on a prior commitment: whether the "Self" is a single entity extended through time (Planning-First) or a sequence of distinct agents linked by memory (Action-Time).

  **Signed,**

  __________________________
  [Planning-First Representative]

  __________________________
  [Action-Time Representative]
