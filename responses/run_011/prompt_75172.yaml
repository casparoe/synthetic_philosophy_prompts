      *   *Claim 3:* "...a cousin of Goodman's 'grue', wearing a different hat."
          *   *Analysis:* Kripke explicitly links his sceptical paradox to Goodman's 'New Riddle of Induction' (grue). They are structurally similar (projection of predicates/rules).
