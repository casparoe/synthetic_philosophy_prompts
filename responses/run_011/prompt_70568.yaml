answer: |-
  **ETHICS SEMINAR: FINAL EXAMINATION**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1**

  Read the following case and principle carefully.

  > **The Case:** Rosa is a night-shift paramedic. Her service requires anyone driving back to base between 3 and 5 a.m. to pull into a checkpoint and rest for twenty minutes, because that is the fatigue window. Rosa has skipped this checkpoint on and off for about a year. On the night in question, she skips it again. Driving home fatigued, she does not see a cyclist and kills him. Afterwards, she is honest: she did not decide to skip the checkpoint that night; she simply never thought about it at all.
  >
  > **The Control:** Ana has the same habit, works the same shift, and skips the checkpoint the same night. She arrives home safely.
  >
  > **The Principle:** "An agent is blameworthy for an act done in ignorance only if that act executes a plan or policy she adopted at an earlier time when she wasn't ignorant, and the adopting was itself blameworthy."

  Write an essay addressing the following three points:

  1.  Critique the **Principle**. Explain why it fails to capture Rosa's blameworthiness given the "slow drift" of her habit, and propose a repaired version that covers negligent habituation.
  2.  Address the **Quality of Will**. Given that Rosa's occurrent mental states at the time of the killing were "clean" (she wasn't thinking about the risk), how can a quality-of-will account locate the relevant ill will in a standing disposition rather than an occurrent state?
  3.  Assess **Moral Luck**. Does the intuition that Rosa is morally worse than Ana force us to accept resultant moral luck, or can a risk-based view of blame capture the difference without relying on luck?

  *Note: You are not required to cite specific authors or texts. Focus on constructing a clear, rigorous argument.*

  ***

  **MODEL ANSWER**

  The candidate principle represents a standard "tracing" strategy: it attempts to ground blame for ignorant actions in a prior, knowing choice. While this successfully handles cases of deliberate recklessness (e.g., choosing to drink knowing one must drive), it fails in Rosa's case. Rosa did not execute a specific plan adopted at a distinct earlier time. Her negligence is the product of a "slow drift"—a gradual erosion of compliance through repeated, unremarked omissions. There is no discrete moment of blameworthy adoption to trace back to. If we accept the principle as written, Rosa escapes blame because the causal chain leads to a habit formed by attrition rather than a specific decision.

  A repaired principle must shift focus from discrete acts of adoption to the maintenance of character. An agent is blameworthy for an ignorant act if it flows from a disposition that the agent had a reasonable opportunity to recognize and correct over time, but failed to do so. This captures the "slow drift." Rosa had a year of opportunities to notice her slipping compliance. Her failure to self-correct constitutes the blameworthy element, even if no single skip was a conscious rebellion. This repairs the tracing strategy by extending the locus of control from a moment to a duration.

  This leads to the problem of Quality of Will. Skeptics argue that if Rosa's occurrent mental states were clean—she wasn't thinking "safety doesn't matter" at the moment of impact—there is no ill will to blame. However, a sophisticated quality-of-will account need not be restricted to occurrent thoughts. Our moral character is defined as much by what we fail to notice as by what we actively choose. Rosa's disposition reveals a lack of due regard for the value of human life. The "will" is not merely the conscious intention of the moment; it is the structure of care that governs attention. By allowing a disposition where safety checks become automatic and discardable, Rosa manifested a will that prioritized convenience over caution. The ill will is located in the standing indifference to the risk, which exists independently of whether that risk is consciously tokened in the mind at the exact second of the crash. To exonerate her because she "forgot" is to claim that caring about others requires constant conscious rehearsal, which is an implausible psychology. We blame the gap in her care, not just the active thought.

  Finally, we must address the comparison between Rosa and Ana. There is a strong intuition that Rosa is worse than Ana because a man is dead. Accepting this intuition fully commits us to resultant moral luck: the idea that factors outside an agent's control (the presence of the cyclist) determine moral blameworthiness. This is philosophically costly. It suggests that Ana and Rosa have different moral statuses despite having identical dispositions and imposing identical risks.

  A risk-based view of blame avoids this cost. On this view, blame attaches to the unjustified risk imposed on others, not merely the harm realized. Both Rosa and Ana imposed the same unjustified risk by driving fatigued. Therefore, they are equally blameworthy regarding their moral character and the wrongness of their action. The intuition that Rosa is "worse" can be explained without conceding to moral luck. We may feel stronger reactive attitudes toward Rosa (resentment, guilt) because harm demands reconciliation and repair, whereas Ana's situation requires only prevention. Furthermore, the harm makes the risk salient; it proves the danger was real, not hypothetical. However, salience is not moral substance. If we claim Rosa is *morally* worse, we are punishing bad outcomes rather than bad agency. A consistent ethical theory should hold that Rosa and Ana are equally blameworthy for the negligence, even if Rosa faces greater legal liability or guilt. To claim otherwise is to let the world, rather than the will, determine virtue.

  In conclusion, Rosa is blameworthy not because she executed a prior plan, but because she failed to maintain a safe disposition over time. Her ill will is found in her standing indifference, not her occurrent thoughts. Finally, while the harm makes her case more tragic, it does not make her more blameworthy than Ana; both failed the test of risk, and blame should track that failure, not the randomness of the outcome.

  ***

  **MARKING SCHEME (20 MARKS)**

  **1. Critique of the Candidate Principle (5 Marks)**
  *   **3 Marks:** Identifies that the principle fails because there is no discrete "act of adoption" in a slow-drift habit (the "tracing" gap).
  *   **2 Marks:** Proposes a repaired principle that focuses on the *maintenance* of disposition or failure to self-correct over time, rather than a single prior choice.
  *   *Deduction:* -2 Marks if the student claims the principle works as-is.

  **2. Quality of Will & Disposition (5 Marks)**
  *   **3 Marks:** Explains how ill will can exist in "clean" occurrent states (arguing that what we ignore/fail to notice reflects our cares/values).
  *   **2 Marks:** Successfully locates the will in the *standing disposition* (indifference to safety) rather than the momentary thought.
  *   *Deduction:* -2 Marks if the student argues Rosa is blameless because she wasn't thinking about it at the time.

  **3. Moral Luck vs. Risk (Rosa vs. Ana) (5 Marks)**
  *   **3 Marks:** Recognizes that claiming Rosa is *morally* worse implies accepting resultant moral luck.
  *   **2 Marks:** Argues for a risk-based view (both imposed equal risk, so both are equally blameworthy) OR provides a nuanced account of why reactive attitudes differ without changing moral status.
  *   *Deduction:* -3 Marks if the student simply asserts Rosa is worse because someone died without addressing the luck objection.

  **4. Coherence & Double Counting (5 Marks)**
  *   **3 Marks:** Avoids "double counting." Does not blame the habit formation *and* the killing as two separate moral failures; treats the killing as the realization of the habitual risk.
  *   **2 Marks:** Essay is structured logically, flows well, and adheres to the "no citation" instruction.
  *   *Deduction:* -2 Marks if the answer blames the habit *and* the outcome as separate wrongs (e.g., "She is bad for the habit and worse for the death").
  *   *Deduction:* -1 Mark for citing specific philosophers (violates exam instruction).

  **Common Mistakes & Penalties**
  *   **Treating as Plain Moral Luck:** If the student argues that the death *makes* her more blameworthy without qualifying the distinction between legal liability and moral blame, cap Section 3 at 1/5.
  *   **Double Counting:** If the student argues she is blameworthy for the habit *plus* blameworthy for the killing as distinct items, cap Section 4 at 1/5.
  *   **Summary Mode:** If the first paragraph merely summarizes the Rosa/Ana case without argument, deduct 2 marks from Total.
  *   **Name-Dropping:** If the student includes a bibliography or cites authors (e.g., "As Aristotle says..."), deduct 2 marks from Total.
