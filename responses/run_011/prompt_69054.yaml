  # BELIEF & CONSISTENCY: DECISION INSTRUMENT
  **Workshop Handout | Internal Use Only**

  ### THE SETUP
  You have 1,000 claims. Each is 99.9% likely true based on your data. But you know statistically one is false. You can't believe all 1,000 are true without contradicting yourself. How do you handle this?

  Answer the following questions honestly. There are no right answers, only different commitments.

  ---

  ### THE TREE

  **1. THE SCALE**
  **Should we stop using yes/no belief entirely and just talk about confidence percentages?**
  *   **YES** → Go to **Leaf A**
  *   **NO** → Question 2

  **2. THE THRESHOLD**
  **A claim is 99.7% likely on the best evidence you have and nothing you already believe counts against it — do you believe it, flat out, yes or no?**
  *   **NO** → Go to **Leaf B**
  *   **YES** → Question 3

  **3. THE DASHBOARD**
  **An engineer sees 800 alerts. She acts on each as true. She knows statistically some are false. Is she believing them, or just acting as if?**
  *   **JUST ACTING** → Go to **Leaf C**
  *   **BELIEVING** → Question 4

  **4. THE AGGREGATION**
  **If you flat-out believe X and you flat-out believe Y, does that mean you automatically believe "X and Y" together, even if you haven't explicitly thought about the pair?**
  *   **NO** → Go to **Leaf D**
  *   **YES** → Question 5

  **5. THE HEAD**
  **Is it ever rational to hold two beliefs at the same time in a single head if you know they can't both be true?**
  *   **YES** → Go to **Leaf E**
  *   **NO** → Question 6

  **6. THE TEAM**
  **Imagine a 30-person team. Each believes their task is done. Everyone knows one task failed. Is the *group* irrational?**
  *   **NO (Group is fine)** → Go to **Leaf F**
  *   **YES (Group is irrational)** → Question 7

  **7. THE STAKES**
  **If the cost of being wrong goes up, do you need more evidence to say you "believe" something?**
  *   **YES** → Go to **Leaf G**
  *   **NO** → Go to **Leaf H**

  ---

  ### THE LEAVES

  | Leaf | View Name | The Awkward Thing You Must Swallow |
  | :--- | :--- | :--- |
  | **A** | **Probabilism** | You can't make binary decisions without introducing arbitrary cutoffs anyway. |
  | **B** | **Skepticism** | You have to deny obvious things (like "this ticket will lose") to stay consistent. |
  | **C** | **Pragmatism** | Truth doesn't matter; belief is just a name for how you behave. |
  | **D** | **Non-Closure** | You believe X, you believe Y, but you don't believe "X and Y." |
  | **E** | **Paraconsistent** | You accept that some contradictions are actually true. |
  | **F** | **Distributed Rationality** | Rationality depends on how many people are in the room. |
  | **G** | **Contextualism** | The word "believe" means different things at different times. |
  | **H** | **Strict Consistency** | You must treat a 99.9% claim the same as a guess to avoid contradiction. |

  *(Note: If you landed on Leaf H, you likely treat the Preface Author as making a mistake. If you landed on Leaf F, you treat the Author as fine, but the Team as problematic.)*

  ---

  ### LOGICAL SPACE ANALYSIS

  The tree above forces a path, but the underlying logical space consists of 7 independent dimensions (Q1–Q7). Below is the map of occupied vs. empty space.

  **The Dimensions:**
  1.  **Binary?** (Yes/No)
  2.  **Threshold?** (Yes/No)
  3.  **Action=Belief?** (Yes/No)
  4.  **Closure?** (Yes/No)
  5.  **Head Consistency?** (Yes/No)
  6.  **Team Consistency?** (Yes/No)
  7.  **Context?** (Yes/No)

  **Occupied Vectors (The Leaves):**
  *   **Probabilism:** [No, -, -, -, -, -, -] (Occupied. Coherent.)
  *   **Skepticism:** [Yes, No, -, Yes, No, Yes, No] (Occupied. Coherent but unattractive.)
  *   **Pragmatism:** [Yes, Yes, No, -, -, -, -] (Occupied. Shifts focus from truth to utility.)
  *   **Non-Closure:** [Yes, Yes, Yes, No, -, -, -] (Occupied. Kyburg's view.)
  *   **Paraconsistent:** [Yes, Yes, Yes, Yes, Yes, -, -] (Occupied. Rare, logically costly.)
  *   **Distributed:** [Yes, Yes, Yes, Yes, No, No, -] (Occupied. Gains traction in multi-agent systems.)
  *   **Contextualism:** [Yes, Yes, Yes, Yes, No, Yes, Yes] (Occupied. Linguistically complex.)
  *   **Strict:** [Yes, Yes, Yes, Yes, No, Yes, No] (Occupied. Traditional epistemology.)

  **Empty Space (The Dead Zones):**
  *   **[Binary=No + Threshold=Yes]:** **Incoherent.** You cannot demand a yes/no threshold if you reject yes/no belief.
  *   **[Closure=Yes + Threshold=Yes + Head Consistency=Yes]:** **Unstable.** This combination forces you into Skepticism (Leaf B) or Paraconsistency (Leaf E). You cannot hold all three without exploding.
  *   **[Head Consistency=Yes + Team Consistency=No]:** **Unexplored.** This is the view that contradictions are fine in a team but not in a head. Most who accept team inconsistency also accept head inconsistency, or vice versa. This space is theoretically open but psychologically rare.
  *   **[Closure=No + Threshold=No]:** **Unattractive.** If you don't believe high-prob claims and you don't aggregate them, you have no belief system left. This is essentially Skepticism without the justification.

  **Note on Closure + No Threshold:**
  Your hunch about dead space on the "closure-plus-no-threshold" side is partially correct. It is not *incoherent* (you can believe nothing and still accept closure vacuously), but it is **unattractive**. It offers no benefit of closure since there are no beliefs to close. It collapses into Skepticism (Leaf B).

  ---
  *End of Handout*
