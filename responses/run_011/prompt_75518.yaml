  6.  **Final Review against constraints:**
      *   Did I answer the metaphysics question? Yes (Individuation).
      *   Did I address twins/chimeras/embryoids? Yes.
      *   Did I address the inconsistency (research vs. destruction)? Yes (Instrumentalization/Compromise).
      *   Did I identify where the theory is underdetermined? Yes.

      *(Self-Correction on the "Freezing" point)*: The user asks why freezing for 20 years is okay if we care about the embryo. The answer is that freezing is "suspended animation," not harm. But the deeper point is that the *moral status* is contingent on the *project* (IVF vs. Research). In IVF, the goal is birth. In Research, the goal is knowledge (and eventual destruction). The 14-day rule protects the *Research* context from becoming *Reproduction* or *Farming*.

      *Let's sharpen the "Individuation" metaphysics.* It's the "Substance View." Before 14 days, it's not a substance (an individual thing). It's a process.

      *Let's sharpen the "Inconsistency."* The inconsistency dissolves if the rule is about *symbolic boundaries* rather than *intrinsic rights*.

