      *   *Counter-example:* General Relativity vs. Newtonian Gravity + universal force field. Or better: Kinetic theory vs. Thermodynamics.
      *   *Everett's Trade:* Everett trades *ontological* parsimony (many worlds) for *dynamical* parsimony (only Schrödinger equation). Ray only counts ontological parsimony.
