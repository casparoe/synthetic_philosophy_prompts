      *   *Bohm's Defense:* Trajectories aren't idle if they explain the *process* of measurement without ambiguity. Also, quantum equilibrium might not be fundamental (relaxation).
      *   *Copenhagen's Status:* Ray thinks Copenhagen escapes. It doesn't. Copenhagen *also* has idle structure if viewed instrumentally, but if viewed realistically (wavefunction is real), it has the "collapse" which is the real idle magic (no dynamics for it). Actually, Ray favors Collapse Theories (GRW), not Copenhagen. Copenhagen is arguably *worse* on Step 6 because it adds a collapse rule that does nothing empirically different from unitary + branching in most cases, but breaks unitarity.
      *   *Sloppy Claims:* Step (5) claims weights aren't forced. Step (1) defines physics too narrowly (instrumentalism).

  6.  **Refining the Tone:**
      *   Needs to be respectful of the user's expertise (neutron scattering).
      *   Needs to be blunt (as requested).
      *   Avoid jargon like "supervenience" or "epistemic credence" without explanation.
      *   Focus on the *physics* of the argument, not just the metaphysics.

  7.  **Final Polish of the Argument:**
      *   *Step 6 is the target.* It equates "empirical equivalence" with "ontological equivalence."
