prompt: |-
  I run a three-person analytics team inside a regional health system — me, one MPH who's had maybe a semester of micro, and a data engineer. Roughly once a month somebody from the clinical side or the ops side brings us a proposal that leans on an inference from what patients chose to what patients want, and often one step further, to what would make them better off. "Interpreter uptake is under five percent of eligible visits, so patients obviously don't want it." "Sixty-eight percent of the people offered a telehealth follow-up picked telehealth again next time, so that's their preference." Up to now the most rigorous thing anyone on my team has been able to say is "hmm, not sure that follows," and I'm increasingly worried we're being used to give a quantitative-looking seal of approval to decisions that were already made.

  I want you to write us a decision procedure we can actually run on a proposal in about two hours, grounded in what revealed preference theory genuinely licenses — and I mean genuinely licenses, not the pop version where "choice reveals preference" is waved around like it's an empirical discovery rather than partly a way of defining the term. Be explicit that there are two seperate jumps, choice → preference and preference → good-for-the-person, and build the procedure so those two are never collapsed into one step, because I'm pretty sure that's where most of what crosses my desk goes wrong. Include whatever the consistency machinery (the weak/generalized axioms, the rationalizability results in the Afriat line) can and cannot buy you, and be straight with me about the fact that "this data is consistent with utility maximization" is often a near-empty claim — I want the procedure to know when consistency is informative and when it isn't.

  Constraints and format:

  - Questions in order, with what counts as a sufficient answer to each, and what evidence would satisfy it. Not a list of considerations, a sequence.
  - Mark the exits clearly: where the procedure stops with a no, where it stops with "we cannot tell from this data and here's what data would settle it," and where it hands the thing to the committee because what's left is a values question and not a factual one. The final output gets read by a committee that includes a physician and a patient representative, so the write-up has to be legible to people who will never see a subscript.
  - Our data is almost all administrative EHR and scheduling data. No price variation, no meaningful budget sets, almost nothing randomized, occasionally a real A/B test if someone in digital has been feeling ambitious. Most of the textbook tests assume you can vary prices or budgets and watch the choice flip. Tell me what the fallback is when you can't, and how much weaker it is. Don't quietly pretend the fallback is as good.
  - We also sometimes have patient-reported experience scores and, for a couple of services, repeated symptom ratings over time. Build in somewhere for the question of when reported experience can override or supplement choice data — and handle the obvious traps, like the fact that what people retrospectively rate an episode as having been like is not the same thing as how the episode went, including the peak-end and duration stuff. If you think those traps are overblown, say so and say why.
  - Flag every step that is a judgment call wearing a procedure costume. I'd rather have five honest hand-waving points than twenty fake-precise ones.
  - End with a short section on what the procedure could never deliver no matter how good our data got — the ceiling, not the current shortfall. I want to be able to say no to a request on principled grounds instead of just "not with what we have."

  Then run the whole procedure, step by step and not just the conclusion, on three live cases:

  1. Ops wants to cut the in-person interpreter service to on-demand video only, on the grounds that among patients flagged as limited-English-proficient, fewer than five percent of visits actually used an interpreter even though one was offered and funded.
  2. A program director wants to expand telehealth follow-ups for a chronic-condition clinic, citing that 68% of patients who were offered a telehealth slot chose a telehealth slot again at their next follow-up.
  3. The one I'm braced for: my own team's flagship metric. We rank clinics by the share of patients who re-book with the same clinician at their next visit, and we've been telling the board for two years that this is a revealed-preference measure of how much patients value continuity. If the procedure kills it, kill it and tell me exactly which step it dies at.

  Two pages maximum for the thing the analysts actually use, with as long an appendix as you need explaining why each test is in there and what it's guarding against.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Leader of a 3-person analytics team in a regional health system.
      *   **Problem:** Stakeholders (clinical/ops) frequently misuse revealed preference logic (Choice $\to$ Preference $\to$ Welfare) to justify pre-made decisions. The team currently lacks the rigor to push back effectively.
      *   **Goal:** A 2-hour decision procedure to evaluate such proposals.
      *   **Key Requirements:**
          *   Distinguish clearly between Choice $\to$ Preference and Preference $\to$ Welfare.
          *   Address consistency machinery (WARP/GARP/Afriat) honestly (often empty claims).
          *   Format: Sequential questions with pass/fail/uncertain exits. Legible to a committee (physician/patient rep).
          *   Constraints: Administrative EHR/scheduling data (no price variation, limited budget sets, rare RCTs). Must address fallbacks when standard econ tests fail.
          *   Include Patient-Reported Experience Measures (PREMs) and symptom ratings, handling biases (peak-end, duration).
          *   Flag judgment calls vs. procedural steps.
          *   Include a "Ceiling" section (what this can *never* do).
          *   **Application:** Run the procedure on three specific cases (Interpreter service, Telehealth follow-up, Continuity metric).
          *   **Length:** 2 pages max for the procedure itself, appendix allowed for explanation.

  2.  **Deconstruct the Economic Theory:**

      *   *Revealed Preference (RP):* Choice $x$ when $y$ was available $\implies$ $x \succeq y$.
      *   *Conditions for RP:* Stability of preferences, awareness of options, cognitive capacity, no coercion/constraint binding other than budget/price.
      *   *Welfare:* $x \succeq y \implies$ $x$ is better for the agent. This requires *normative* validity of preferences (no addiction, misinformation, acute distress, etc.).
      *   *Afriat/WARP:* Tests for consistency. In health admin data without price variation, these are often trivially satisfied or impossible to test. Need to be honest about this limitation.
      *   *Health Context:* Patients are often sick, stressed, misinformed, or constrained by insurance/transport. "Choice" is often "acceptance of default."

  3.  **Drafting the Procedure (The "2-Page Tool"):**

      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Phase 1: The Choice $\to$ Preference Link (The "Was it a Choice?" Test).*
      *   *Phase 2: The Preference $\to$ Welfare Link (The "Was it Good?" Test).*
      *   *Phase 3: The Data Consistency Check (The "Is it Noise?" Test).*
      *   *Exits:* Stop (No), Stop (Need Data), Escalate (Values).
      *   *Tone:* Professional, rigorous, accessible.

  4.  **Drafting the Appendix (The "Why"):**

      *   Explain WARP/GARP limitations in this context.
      *   Explain PREMs vs. Choice.
      *   Explain the "Ceiling."

  5.  **Running the Cases:**

      *   *Case 1 (Interpreters):* Low uptake $\neq$ low desire. Barriers (time, stigma, awareness). Welfare impact is high (safety/quality). *Verdict: Fail Phase 1.*
      *   *Case 2 (Telehealth):* High retention. But is it convenience or clinical appropriateness? *Verdict: Pass Phase 1, Stuck on Phase 2 (Welfare).*
      *   *Case 3 (Continuity):* Re-booking. Is it choice or scheduling availability? Is continuity always good? *Verdict: Fail Phase 1 (Constraint), Fail Phase 2 (Clinical nuance).*

  6.  **Refining the Content (Self-Correction/Iterative Polish):**

      *   *Critique:* Is 2 pages enough for the procedure?
      *   *Fix:* Keep the procedure tight. Move the theoretical justification to the Appendix.
      *   *Critique:* Did I address the "no price variation" constraint?
      *   *Fix:* Explicitly state that without price/budget variation, consistency tests are weak. Rely on "Constraint Audits" instead.
      *   *Critique:* Did I handle the PREMs?
      *   *Fix:* Add a specific step for "Conflict Check" between Choice and Reported Experience.
      *   *Critique:* Is the distinction between Preference and Welfare clear?
      *   *Fix:* Make them Section 1 and Section 2.
      *   *Critique:* The user wants me to be honest about "judgment calls wearing procedure costumes."
      *   *Fix:* Add [JUDGMENT CALL] tags.

  7.  **Finalizing the Output Structure:**

      *   **Page 1-2:** The Decision Procedure (The "Tool").
      *   **Appendix:** Theoretical grounding, limitations, ceiling.
      *   **Case Studies:** Application of the tool to the three scenarios.

  8.  **Writing - Section by Section (Mental or Scratchpad):**

      *   *Header:* Health System Analytics: Preference & Welfare Audit Tool.
      *   *Step 1:* Constraint Audit. (Could they have chosen otherwise?)
      *   *Step 2:* Information Audit. (Did they know what they were choosing?)
      *   *Step 3:* Stability/Consistency. (Afriat lite - repeated choices).
      *   *Step 4:* Welfare Proxy. (PREMs/Symptoms).
      *   *Step 5:* Normative Override. (Clinical safety).
      *   *Exits:* Red (Stop), Yellow (More Data), Green (To Committee).
      *   *Case 1:* Interpreter. Step 1 fails (awareness/logistics).
      *   *Case 2:* Telehealth. Step 1 passes. Step 4 mixed. Step 5 is the key (clinical appropriateness).
      *   *Case 3:* Continuity. Step 1 fails (scheduling constraints). Step 5 (clinical need for continuity varies).

  9.  **Review against Constraints:**

      *   *Two pages max for procedure?* Need to be concise.
      *   *Questions in order?* Yes.
      *   *Exits marked?* Yes.
      *   *Data limitations acknowledged?* Yes.
      *   *PREMs included?* Yes.
      *   *Judgment calls flagged?* Yes.
      *   *Ceiling section?* Yes.
      *   *Three cases run?* Yes.

  10. **Final Polish:** Ensure the tone is empathetic to the analyst's position (trying to do good work in a bureaucratic system) but rigorous on the economics. (Self-correction: Ensure I don't sound *too* academic. The committee includes a patient rep.)

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Afriat doesn't work." I need to say *what to do instead*. The alternative is checking for *binding constraints* rather than price variation.
  Also, need to make sure the "Ceiling" is distinct from "Current Data Limitations." The Ceiling is about the *theory* (is preference sovereignty always valid?), not just missing EHR fields.

  Let's assemble.
answer: |-
  # HEALTH SYSTEM ANALYTICS: PREFERENCE & WELFARE AUDIT TOOL
  **Purpose:** To evaluate proposals claiming "patients chose X, therefore X is preferred and good for them."
  **Time Budget:** 2 Hours. **Audience:** Analytics Team, Clinical/Ops Stakeholders, Oversight Committee.

  ---

  ## PART 1: THE CHOICE $\to$ PREFERENCE LINK
  *Does the observed behavior actually reflect a stable preference?*

  **Q1. The Constraint Audit:** Could the patient have reasonably chosen the alternative?
  *   **Evidence:** Scheduling logs, insurance authorization records, transport data, language flags.
  *   **Pass:** Alternatives were available, covered, and logistically feasible.
  *   **Fail:** Alternative was unavailable, denied by payer, or required prohibitive travel/time.
  *   **[JUDGMENT CALL]:** Defining "prohibitive." (Default to: >1 hour travel or >48hr wait).
  *   **EXIT:** If **Fail**, stop. Claim is invalid. *Recommendation: Remove "preference" language; frame as "constraint-driven utilization."*

  **Q2. The Information Audit:** Did the patient understand the trade-off?
  *   **Evidence:** Consent forms, patient education logs, portal message timestamps.
  *   **Pass:** Patient received standardized info on options *before* choice.
  *   **Fail:** Choice made during acute distress, without interpreter, or before education provided.
  *   **EXIT:** If **Fail**, stop. Claim is invalid. *Recommendation: Frame as "default acceptance" or "compliance."*

  **Q3. The Consistency Check (Afriat Lite):** Is the choice pattern stable across similar contexts?
  *   **Evidence:** Repeated visits for same condition.
  *   **Pass:** Patient chooses X over Y in $\ge$ 2 distinct instances where both available.
  *   **Fail:** Choice flips randomly or correlates strictly with provider availability (not patient selection).
  *   **Note:** Without price/budget variation, this tests *noise*, not *rationality*. A Pass here is necessary but not sufficient.
  *   **EXIT:** If **Fail**, stop. *Recommendation: Data is too noisy to infer preference.*

  ---

  ## PART 2: THE PREFERENCE $\to$ WELFARE LINK
  *Does satisfying this preference actually improve patient well-being?*

  **Q4. The Experience Conflict Check:** Do Patient-Reported Experience Measures (PREMs) align with Choice?
  *   **Evidence:** Post-visit surveys, symptom scores (e.g., PHQ-9, pain scales).
  *   **Pass:** High choice uptake correlates with high satisfaction/improved symptoms.
  *   **Fail:** High uptake correlates with low satisfaction or worsening symptoms.
  *   **[JUDGMENT CALL]:** Weighting symptoms vs. satisfaction. (Default: Clinical symptoms > Satisfaction).
  *   **EXIT:** If **Fail**, escalate to Committee. *Recommendation: "Patients choose this, but report feeling worse. Investigate why."*

  **Q5. The Peak-End & Duration Adjustment:** Are we misreading the retrospective rating?
  *   **Evidence:** Time-stamped symptom logs vs. end-of-visit survey.
  *   **Pass:** Retrospective rating matches average experience.
  *   **Fail:** Retrospective rating driven solely by final moment or most intense pain point.
  *   **Note:** If data is only retrospective surveys, assume **Fail** for high-stakes decisions.
  *   **EXIT:** If **Fail**, flag for Committee. *Recommendation: "Survey data may be biased by recall effects."*

  **Q6. The Normative Override:** Is there clinical evidence that the preferred option causes harm?
  *   **Evidence:** Clinical guidelines, readmission rates, adverse event logs.
  *   **Pass:** Preferred option aligns with standard of care.
  *   **Fail:** Preferred option correlates with higher readmissions or guideline deviation.
  *   **EXIT:** If **Fail**, stop. *Recommendation: "Preference exists, but welfare is compromised. Do not optimize for choice."*

  ---

  ## PART 3: FINAL CLASSIFICATION

  *   **🔴 STOP:** Failed Q1, Q2, or Q6. Do not use preference logic to justify this.
  *   **🟡 INVESTIGATE:** Passed Q1-Q3, Failed Q4-Q5. Choice is real, welfare is unclear. Needs qualitative study or A/B test.
  *   **🟢 COMMITTEE:** Passed All. The data supports the claim, but the *weight* given to preference vs. clinical outcome is a values decision.

  ---

  ## APPENDIX: THEORY, LIMITATIONS, & CEILING

  **1. Why Consistency Tests (WARP/GARP) Are Weak Here**
  Standard revealed preference theory relies on varying prices or budgets to see if choices flip (Slutsky conditions). We have neither. We cannot distinguish between "Patient prefers Video" and "Patient prefers Video *at this price*" because price is zero/constant.
  *   **What Q3 buys you:** It rules out pure randomness.
  *   **What it doesn't:** It cannot prove utility maximization. A patient consistently choosing a less effective treatment due to misinformation passes Q3 but fails Q2.

  **2. Handling PREMs and Recall Bias**
  Kahneman's "Peak-End" rule suggests patients rate an episode by its most intense point and its end, ignoring duration.
  *   **Trap:** A longer, clinically superior visit might be rated lower than a short, abrupt one.
  *   **Procedure Fix:** Q5 flags this. If we lack time-series symptom data, we must treat retrospective satisfaction as a *preference signal*, not a *welfare measure*.

  **3. Judgment Calls Wearing Costumes**
  *   **Q1 (Prohibitive):** There is no economic formula for "too far to travel." We set 1 hour arbitrarily.
  *   **Q4 (Symptoms vs. Satisfaction):** We prioritize clinical metrics over happiness. This is a paternalistic value judgment, not a data finding.

  **4. The Ceiling (What This Procedure Can Never Do)**
  Even with perfect data, this tool cannot resolve:
  *   **Adaptive Preferences:** Patients lowering expectations due to systemic neglect (e.g., "I don't request interpreters because I expect to be ignored").
  *   **Third-Party Welfare:** Public health externalities (e.g., antibiotic demand).
  *   **Constitutive Welfare:** Whether the *act of choosing* is itself good for the patient, regardless of the outcome.
  *   **Verdict:** If a proposal rests on these, the answer is not "More Data," it is "Ethics Review."

  ---

  # CASE STUDY APPLICATIONS

  ### CASE 1: Interpreter Services (Cut to Video-Only)
  *Proposal:* Uptake <5% implies low demand. Cut cost.

  *   **Q1 (Constraint):** **FAIL.**
      *   *Evidence:* "Offered and funded" $\neq$ accessible. Video requires smartphone/data plan. In-person requires scheduling lead-time.
      *   *Finding:* 95% non-use is likely friction, not preference.
  *   **Q2 (Information):** **FAIL.**
      *   *Evidence:* LEP patients often unaware video is an option until arrival.
  *   **Q6 (Normative):** **FAIL.**
      *   *Evidence:* Literature shows LEP patients have higher adverse event rates without interpreters.
  *   **Verdict:** **🔴 STOP.**
  *   **Analyst Script:** "Low uptake reflects barriers, not lack of want. Cutting service increases clinical risk. We cannot label this 'preference-driven.'"

  ### CASE 2: Telehealth Follow-Ups (Expand Program)
  *Proposal:* 68% repeat rate implies patients prefer telehealth for chronic care.

  *   **Q1 (Constraint):** **PASS.**
      *   *Evidence:* Both slots offered. Insurance covers both.
  *   **Q3 (Consistency):** **PASS.**
      *   *Evidence:* 68% repeat indicates stability.
  *   **Q4 (Experience):** **UNCERTAIN.**
      *   *Evidence:* Need to check if telehealth patients report same symptom resolution as in-person.
  *   **Q6 (Normative):** **INVESTIGATE.**
      *   *Evidence:* Does telehealth miss physical exam findings for *this* chronic condition?
  *   **Verdict:** **🟡 INVESTIGATE.**
  *   **Analyst Script:** "Patients consistently choose telehealth. However, we lack data on whether clinical outcomes match in-person care. Recommend A/B test on symptom resolution before expanding."

  ### CASE 3: Continuity Metric (Flagship Metric)
  *Proposal:* Re-booking same clinician = Patient values continuity = Better care.

  *   **Q1 (Constraint):** **FAIL.**
      *   *Evidence:* Scheduling algorithms often default to "first available." Re-booking same clinician often requires waiting weeks longer. If patient is sick, they choose "soonest." If they re-book same, it may be because that clinician had the soonest slot, not because of loyalty.
      *   *Finding:* "Same clinician" is often a supply-side artifact, not demand-side choice.
  *   **Q4 (Experience):** **MIXED.**
      *   *Evidence:* Continuity correlates with satisfaction, but not always with symptom resolution (depends on condition).
  *   **Q6 (Normative):** **JUDGMENT CALL.**
      *   *Evidence:* Continuity is good for primary care, less critical for acute/urgent care.
  *   **Verdict:** **🔴 STOP (as a welfare metric).**
  *   **Analyst Script:** "This metric conflates scheduling availability with patient preference. Furthermore, continuity is not universally 'good' (e.g., if the prior visit was poor). We must stop reporting this as 'revealed preference for quality.' It is a measure of scheduling friction."
