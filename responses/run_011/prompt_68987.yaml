          *   *Claim:* It's a patch/ad hoc because the line is drawn exactly where needed to make the argument fail. A principled restriction needs an independent account of why epistemic propositions differ in kind.
          *   *Evaluation:* **Right.** This is the standard philosophical critique of KP*. Merely blocking the counterexample isn't enough; one needs a semantic or metaphysical justification for why *only* non-epistemic truths are knowable. The student correctly identifies the criterion for "principled" (independent account).
          *   *Missing:* Could mention *why* one might think it's principled (e.g., epistemic propositions are higher-order, or verificationism is only about empirical states of affairs), but the student's diagnosis of "ad hoc" is defensible and well-reasoned.

      *   **Part (c) (Ideal Limit):**
          *   *Claim:* Ideal limit reading dissolves the paradox because "every truth is known" is just the thesis restated. The objection about omniscience misses the point (known at the limit, not now).
          *   *Evaluation:* **Too Vague / Partially Wrong.** This is a common confusion. Fitch's paradox applies to *tensed* or *timeless* knowability. If the ideal limit is a specific time $t_\infty$, Fitch's argument can be reconstructed for that time. If "truth" is defined as "known at the limit," Fitch shows that if there are *any* unknown truths *now*, there are truths that *cannot* be known even at the limit (specifically, the truth that $p$ is true but not known at the limit).
