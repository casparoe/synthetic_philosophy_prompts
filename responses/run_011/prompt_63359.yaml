answer: |-
  # The Nationalism Sorter: Which Theory of the Age of Nations Do You Actually Hold?

  **Instructions:** Read the eight cases below. Each describes a concrete historical phenomenon we've touched on in seminar. Choose the option (A, B, or C) that best matches your intuition about what is *actually* happening in that scenario. Do not overthink the jargon; answer based on how you think the world works.

  ### 1. The Stateless Archive
  A group of people possesses detailed genealogies, a shared myth of a golden age, and a distinct religious liturgy, but they have no sovereign state, no standardized school system, and no mass media in their own tongue.
  *   **A.** They are already a nation; the state is just a missing piece of hardware for an existing software.
  *   **B.** They are an ethnic community or cultural group, but they only become a "nation" when they mobilize for political sovereignty.
  *   **C.** They are a collection of individuals; without the daily institutional repetition of statehood, "nationhood" is just a poet's metaphor.

  ### 2. The Chancellery Border
  A boundary is drawn by diplomats in a capital city with no regard for local language or custom. Fifty years later, people on both sides of the line are willing to die to keep it in place.
  *   **A.** The state created the nation; loyalty is a habit manufactured by administrative continuity.
  *   **B.** The border stuck because it accidentally aligned with a deeper, pre-existing cultural fault line.
  *   **C.** The willingness to die is less about the border and more about the everyday, unthinking assumption that this map is "natural."

  ### 3. The Committee Kilt
  A specific style of dress or festival is traced by historians to a planning committee in the last 150 years, yet participants today swear it is "ancestral."
  *   **A.** This proves nationalism is a fraud engineered by elites to control the masses.
  *   **B.** The date of invention doesn't matter; the symbols tap into genuine, older myths that give them weight.
  *   **C.** The "fraud" vs. "real" debate misses the point; what matters is that the symbol is now quietly displayed on post offices and coins every day.

  ### 4. The Vernacular Shift
  A kingdom's spoken dialects are standardized and mass-printed in the 1800s. By 1900, speakers treat this standardized version as sacred and ancient.
  *   **A.** Print capitalism created the possibility of imagining the community; the language didn't unite them, the books did.
  *   **B.** Industrial society required a standardized communication module; the language was a tool for labor mobility.
  *   **C.** The standardization merely woke up a sleeping linguistic spirit that had been there since the Middle Ages.

  ### 5. The Medieval Record
  An administrative unit has continuous tax and legal records back to the year 1300.
  *   **A.** That continuity *is* the nation; the modern state is just the latest version of this enduring polity.
  *   **B.** That is a state, not a nation; the "people" as a sovereign body only appear much later.
  *   **C.** The records provide the "mythic material" that modern nationalists use, but the nation itself is a modern reinterpretation of those records.

  ### 6. The Rootless Diaspora
  A population maintains a vivid memory of a homeland and a desire to return, generation after generation, without holding territory.
  *   **A.** This proves the nation is a spiritual or biological entity that survives without political form.
  *   **B.** They are maintaining a culture; without a territory to defend, they are not yet a political nation.
  *   **C.** Their "nation" exists only in the act of remembering; it is reproduced through ritual, not land.

  ### 7. The Unnoticed Flag
  A national flag hangs on a public building. Locals walk past it daily without registering it consciously.
  *   **A.** This unnoticed background noise is the primary mechanism that holds the nation together.
  *   **B.** This is trivial; the nation is held together by moments of crisis, war, or founding revolutions.
  *   **C.** The flag works because it triggers deep, ancient biological instincts about group belonging.

  ### 8. The Belief in Antiquity
  Members of a nation insist their community is thousands of years old. Historians prove the political structure is 200 years old.
  *   **A.** The historians are right; the belief is "false consciousness" to be explained away.
  *   **B.** The members are right in a sense; the *community* is old, even if the *politics* are new.
  *   **C.** Their belief *makes* it true; if they feel it is ancient, that subjective conviction is the nation.

  ---

  ## Scoring Key

  Tally your answers. Each option corresponds to a specific theoretical cluster.

  *   **Mostly 1A, 5A, 6A, 7C:** **Primordialism.** (You believe nations are natural, ancient, and biological/spiritual facts.)
  *   **Mostly 1B, 4C, 5C, 6B:** **Ethnosymbolism.** (You believe modern nations need pre-modern ethnic cores/myths to work.)
  *   **Mostly 2B, 4C, 5A:** **Perennialism / Medievalism.** (You believe nations have existed continuously through history, even if forms changed.)
  *   **Mostly 2A, 4B, 5B:** **Industrial Modernism.** (You believe nationalism is a functional requirement of industrial society and labor mobility.)
  *   **Mostly 1C, 3A, 4A:** **Print & Administrative Modernism.** (You believe specific technologies like print and bureaucracy created the *capacity* to imagine the nation.)
  *   **Mostly 2A, 3A, 8A:** **Top-Down Invented Tradition.** (You believe nationalism is a cynical project engineered by elites.)
  *   **Mostly 2C, 3C, 7A:** **Banal Nationalism.** (You believe the nation is reproduced by unconscious, everyday habits rather than big moments.)

  *(Note: If your answers are scattered, you likely hold a hybrid position. Check the "Empty Quadrants" below to see if your hybrid is theoretically viable.)*

  ---

  ## The Leaves (Theoretical Positions)

  1.  **Primordialism:** Nations are natural extensions of kinship. They may sleep, but they do not need to be built.
  2.  **Perennialism:** Nations are historical constants. The French were French in 1300, even if they didn't use the word "nationalism."
  3.  **Ethnosymbolism:** Nations are modern, but they aren't made from scratch. They require pre-existing "ethnies" (myths, memories, symbols) to graft onto.
  4.  **Industrial Modernism:** Nationalism is a module required for industrial society. You need standardized humans to move around and work; nationalism provides the culture for that.
  5.  **Print/Admin Modernism:** Nationalism is a byproduct of specific technologies (print capitalism, bureaucratic vernaculars) that allow strangers to imagine they are connected.
  6.  **Top-Down Invented Tradition:** Nationalism is a tool. Elites invent traditions to secure power or social control; the masses are the audience.
  7.  **Banal Nationalism:** Nationalism isn't about the fever; it's about the temperature. It's the flag on the post office, not the flag at the revolution.

  ---

  ## The Empty Quadrants (Incoherent Combinations)

  These are logical combinations of the distinctions used in the quiz that no serious theory occupies.

  *   **Ancient + Cynical Invention:** *("The nation is biologically ancient but was invented by a committee in 1850.")*
      *   **Diagnosis:** **Incoherent.** If it is ancient/biological, it cannot be invented by modern agents. If it is invented, it is not ancient.
  *   **False Consciousness + Primordial:** *("The belief that the nation is ancient is false, but the nation is actually biological.")*
      *   **Diagnosis:** **Unattractive.** This posits a biological reality that the subjects themselves cannot perceive, rendering the theory unfalsifiable and functionally useless.
  *   **Banal + Top-Down Cynicism:** *("The flag on the post office is unnoticed, and therefore it was placed there by elites to trick people.")*
      *   **Diagnosis:** **Unexplored/Tension.** Banal nationalism argues the flag works *because* it is unnoticed/unconscious. Top-down theory argues it works because of *active* engineering. Combining them requires arguing elites engineer unconsciousness, which is a stretch.
  *   **Industrial + Stateless Myth:** *("Industrial society is required for nations, but stateless groups with no industry are already nations.")*
      *   **Diagnosis:** **Incoherent.** Contradicts the functionalist requirement of industrialization.

  ---

  ## Blind Spots (Pairs This Quiz Cannot Separate)

  Be honest with your seminar group: this instrument has resolution limits.

  1.  **Print Modernism (Anderson) vs. Industrial Modernism (Gellner):**
      *   *Why:* Both are "Modernist." In the quiz, Options 4A and 4B are distinct, but in practice, print capitalism and industrial standardization happened simultaneously. A user who selects both is theoretically consistent, but the quiz treats them as separate leaves.
  2.  **Ethnosymbolism vs. Perennialism:**
      *   *Why:* Both value deep history. The distinction relies on whether the *political form* is modern (Ethno) or the *nation itself* is continuous (Perennial). In concrete cases (like Q5), the difference is often one of degree, not kind.
  3.  **Top-Down Invented vs. Banal Nationalism:**
      *   *Why:* Both agree the nation is "made" not "born." The split is between *active conspiracy* (Top-Down) and *passive reproduction* (Banal). In reality, elites often actively design things that become passive background noise (e.g., a national anthem). The quiz forces a choice where a sequence might exist.

  ---

  **Seminar Discussion Prompt:** *Look at your result. Now look at the "Blind Spots." Is your position actually one of the leaves, or is it a hybrid that the quiz forces into a box? Does the existence of "Empty Quadrants" prove those views are wrong, or just that historians haven't tried to argue them yet?*
