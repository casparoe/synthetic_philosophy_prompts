answer: |-
  The stalemate is substantive rather than verbal, driven by incompatible meta-normative commitments regarding the source of epistemic normativity, but it remains irresolvable within the current framework because each camp's bridge principle connecting formalism to irrationality begs the question against the others.

  Your hunch that the disagreement concerns the *explanandum* is correct, but it underestimates the depth of the meta-normative split. Camp 1 treats epistemology as a branch of decision theory (pragmatic reductionism), Camp 2 treats it as a sui generis domain governed by veritic value (epistemic purism), and Camp 3 treats both as confused psychology (behavioralism). They aren't just measuring different objects; they are denying the legitimacy of each other's normative sources. When Camp 1 asks Camp 2 where scoring rule propriety comes from, they are demanding a pragmatic grounding for a norm Camp 2 claims is non-pragmatic. When Camp 2 says Camp 1 fails for non-betting agents, they are asserting a normativity that Camp 1 denies exists independent of choice. This isn't a verbal dispute about "irrationality"; it is a clash over whether epistemic norms are hypothetical imperatives (if you want to bet/win) or categorical ones (if you want to believe).

  The reason the seminar is stuck is that each camp relies on a bridge principle that functions as a conversation-stopper. Camp 1 assumes the "Bridge Principle of Betting": that credences *just are* (or entail) betting dispositions. Camp 2 assumes the "Bridge Principle of Accuracy": that accuracy is the sole fundamental epistemic good. Camp 3 assumes the "Bridge Principle of Idealization": that norms must apply to real agents with non-linear utilities and holistic evaluation. None of these bridges are proven; they are asserted. When Camp 1 proves probabilism via DBA, they have only proven that *if* you accept the Bridge Principle of Betting, you must be probabilistic. Camp 2 rejects the bridge, so the proof lands silently. When Camp 2 proves probabilism via Accuracy, they have only proven that *if* you accept the Bridge Principle of Accuracy, you must be probabilistic. Camp 1 rejects the bridge as ungrounded. Camp 3 rejects both bridges as psychologically unrealistic. You cannot mathematically prove a bridge principle; it is a philosophical commitment. Thus, the theorems are true, but their normative force is circular relative to the opposing camps.

  Regarding your question about hidden formal questions: yes, there are cases where the verdicts come apart, and highlighting them would force the room to confront the substantive split. The most critical formal fault line is **package additivity**. Camp 1 (DBA) requires that an agent evaluates a package of bets by summing the expected utility of each bet individually. If an agent evaluates packages holistically (e.g., "I won't take any bet that exposes me to ruin, regardless of individual odds"), they can hold incoherent credences without being Dutch Booked. Camp 3 leans on this to say DBA proves nothing about belief. Camp 2 (Accuracy) typically assumes additivity of scoring rules across propositions (the score of a credence function is the sum of scores for each proposition). If you reject additivity there, the domination argument also fails.

  A concrete case for progress: Construct an agent with incoherent credences who employs **risk-weighted expected utility** or **non-additive package evaluation**. This agent is immune to a standard Dutch Book (Camp 1 must concede no pragmatic defect) but is still accuracy-dominated (Camp 2 maintains epistemic defect). This forces the room to admit that pragmatic coherence and epistemic coherence are distinct norms that can diverge. Alternatively, consider **imprecise probabilities**. An agent with imprecise credences might avoid a Dutch Book by refusing to bet (Camp 3's "why bother" reply) but might be accuracy-dominated by a precise function. This highlights whether the norm binds the *state* or the *disposition*.

  Progress in that room is unlikely unless the discussion shifts from proving theorems to debating the bridge principles. You should expect no consensus on the arguments themselves because the arguments are sound relative to their own unstated premises. The only way forward is to explicitly catalogue the bridge principles each camp requires and ask whether any can be justified without presupposing the conclusion. If the seminar continues to treat the bridge principles as neutral technical assumptions rather than contested philosophical commitments, you will spend the rest of the term circling the same drain. The formal work is done; the remaining work is meta-normative, and no amount of probability theory will solve it.
