answer: |-
  1. Thesis one maps to extending Embedded Value over an infinite horizon where cash flows represent aggregate welfare, but this distorts the construct because standard models terminate projections when credibility fades. You cannot express the intrinsic moral weight of future quality of life using only Value of a Statistical Life metrics, which are derived from revealed preferences of the currently living.

  2. Thesis two translates to setting the risk-free discount rate to zero in your present value calculations, removing the time-preference factor usually mandated by market yields. This distorts regulatory reality where discount curves are observable inputs, and it cannot express the normative leap from "is" to "ought" without importing an external utility function over unconceived agents.

  3. Thesis three corresponds to modeling extinction as an absorbing state in a competing-risk framework where the loss severity is infinite, forcing capital allocation to focus on minimizing the hazard rate $h$. The distortion lies in treating existential risk as a manageable volatility rather than a boundary condition, and you cannot express the claim that non-existent beneficiaries hold equitable claims on current reserves.

  4. Your colleague's rendering is a substitution of actuarial premises for the position's own, because it treats the inclusion of infinite future welfare as a parameter choice rather than a moral axiom. The difference shows in the objective function: actuarial optimization maximizes value for existing stakeholders, whereas longtermism redefines the stakeholder class to include all possible future beings.

  5. The residue is a defect of your framework, which lacks the constructs to assign moral weight to people who do not exist, rather than a sign that the original position was less determinate. To settle the question, you would need to see a derivation of the utility function for potential lives that does not beg the question by assuming their moral status beforehand.
