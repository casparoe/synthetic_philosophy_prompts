  There is no single established term for this phenomenon, though it operates as a distinct variant of immunization strategies within the study of collective memory.

  The nearest established concepts are **immunization strategies** (from the sociology of scientific knowledge and conspiracy theory), the **backfire effect** (from psychology), and **recuperation** (from critical theory). Immunization strategies typically involve rejecting disconfirming evidence or reframing it as part of the conspiracy (e.g., "the lack of evidence proves the cover-up"); your cases differ because the evidence is not rejected but embraced. The backfire effect describes an individual psychological reinforcement of belief despite correction; your cases are sociological, involving a communal narrative update that accepts the facts but shifts their semantic weight. Recuperation describes how radical critiques are absorbed by capitalism to neutralize their threat; this is close, but recuperation usually strips the critique of its power, whereas your examples amplify the narrative's power *through* the critique. None of these fully cover the mechanism where factual accuracy increases while the myth's normative grip tightens.

  I propose the term **Memorial Immunization**. It is defined as the process by which a community incorporates disconfirming archival evidence into a founding narrative not to correct the narrative, but to inoculate it against further critique by framing the admission itself as a virtue (e.g., honesty, complexity, resilience).

  The edge of this concept is distinguished from genuine historiographical correction by the trajectory of the community's **moral capital**. In genuine correction, the admission of unwelcome evidence reduces the narrative's claim to exceptionalism or authority; the myth shrinks or loses its prescriptive force (e.g., "We were not heroes, so we cannot claim special status"). In Memorial Immunization, the admission increases the community's moral capital; the myth expands to include the flaw as proof of a higher virtue (e.g., "We were not heroes, but we are honest enough to admit it, which makes us better than those who hide their flaws"). The test is whether the correction diminishes the community's right to celebrate itself. If the celebration grows louder after the confession, it is Memorial Immunization.

  What turns on drawing this line is the functional role of the archive in public life. If the process is genuine correction, the archive acts as a **constraint** on power, forcing identity to yield to evidence. If the process is Memorial Immunization, the archive acts as a **resource** for power, providing raw material to refine and strengthen identity against future challenges. Recognizing Memorial Immunization matters because it reveals when a community has achieved epistemic closure not by ignoring the truth, but by consuming it; in such cases, further archival discovery will not weaken the myth but merely provide more texture for its next iteration, meaning the conflict cannot be resolved by evidence alone but requires a challenge to the community's right to self-celebration.
