answer: |-
  This is a sharp observation, and you are right to feel that standard "hypocrisy" doesn't quite capture it. You have identified a specific defect in **moral standing** that sits at the intersection of three distinct philosophical areas: the literature on **Standing to Blame**, the problem of **Moral Luck**, and **Virtue Ethics**.

  You are not imagining this. It is a recognized itch in contemporary moral philosophy, though it lacks a single, settled canonical label. Here is the carving you asked for, the nearest established concepts, and a proposed term for the specific phenomenon you're describing.

  ### 1. The Nearest Established Concepts

  **A. Standing to Blame (The Framework)**
  In recent years (e.g., work by Macalester Bell, Christopher Fritz, and Daniel Miller), philosophers have distinguished between *whether* a blame is correct (the person actually did wrong) and *whether the blamer has the standing to issue it*.
  *   **Standard Hypocrisy:** You lose standing because you are guilty of the same fault (inconsistency between word and deed).
  *   **Your Case:** The blamer is *not* guilty of the fault. However, they still lack standing. Why? Because standing often requires a kind of **moral investment**. If your "clean hands" are the result of luck rather than effort, you haven't "paid the cost" of virtue. You are claiming an authority you haven't earned.

  **B. Counterfactual Hypocrisy (The Neighbor)**
  This is the term you will most likely find in the literature (e.g., discussed by Ehrich or Lippert-Rasmussen). It refers to someone who condemns X, hasn't done X, but *would have* done X if the circumstances were different.
  *   **The Fit:** This covers your physician example (she failed the counterfactual test).
  *   **The Mismatch:** It doesn't fully cover your book group example (the faithful husband who genuinely doesn't know if he would cheat). "Counterfactual Hypocrisy" implies we know the counterfactual is true. Your intuition is that the blaming is problematic *even if* we don't know the counterfactual, simply because the *epistemic position* is weak.

  **C. Moral Luck (The Context)**
  Thomas Nagel's "Moral Luck" usually discusses the *wrongdoer* (e.g., the drunk driver who hits a child vs. the one who doesn't). You are applying it to the *blamer*. This is sometimes called **"Luck-Based Standing."** The blamer is the beneficiary of "constitutive luck" (their temperament) or "circumstantial luck" (their environment). When they blame others without acknowledging this luck, they are misattributing their own goodness to character rather than circumstance.

  ### 2. The Carving: What Exactly Is Wrong?

  You asked what the defect is, since it isn't insincerity or standard hypocrisy. The defect is **Epistemic Arrogance regarding Character.**

  When someone condemns a behavior forcefully, they are implicitly claiming a stable moral superiority. They are saying, "I am the kind of person who does not do X."
  *   **The Hypocrite** lies about their past actions.
  *   **The Untested Blamer** (your case) makes an unjustified inference about their future stability.

  They are treating a **null result** (no data points because no trials occurred) as **positive evidence** of virtue. In compliance terms (since you work in it): It is like auditing a department that never processes high-risk transactions and concluding they have better controls than a department that processes thousands without error. The data doesn't support the conclusion.

  The wrongness of the blaming is that it **misrepresents the source of their own goodness.** It treats luck as merit.

  ### 3. A Coinage: "Unearned Standing"

  Since there isn't one perfect word, I propose you call this **"Unearned Standing."**

  *   **Definition:** A blamer has Unearned Standing when they condemn a moral failure in others while their own avoidance of that failure is primarily attributable to circumstantial luck rather than exercised virtue, and they fail to acknowledge this contingency.
  *   **Why this term?** It borrows from the legal/moral concept of "Standing" (the right to sue/blame) and modifies it with the "Unearned" qualifier from the luck literature. It captures the intuition that "clean hands which never cost you anything don't earn you anything."

  ### 4. Addressing Your Edge Cases

  You asked specific boundary questions. Here is how "Unearned Standing" carves them:

  **Q: Does it still bite if the person *would* genuinely have held up under pressure but was simply never asked?**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** The defect is epistemic, not just dispositional. Even if they *are* secretly virtuous, they do not *know* that. To blame others forcefully implies a certainty about one's own moral constitution that is unjustified without testing. It is the difference between a soldier who hasn't seen combat claiming they are braver than one who has, versus one who hasn't seen combat admitting they don't know. The blaming is the claim of certainty.

  **Q: Does it matter whether an outsider can tell they're untested, or only whether they are in fact untested?**
  *   **Verdict:** **Factually untested is the moral defect; visibly untested is the social friction.**
  *   **Reasoning:** If they are untested but everyone thinks they are battle-hardened, they still have Unearned Standing (they are morally presumptuous). However, the *social* offense (the "itch" you feel) is worse when the audience knows they are untested. If the audience *doesn't* know, it's just a private delusion. If the audience *does* know, it becomes a public performance of superiority that the community recognizes as false.

  **Q: Does it get worse if they eventually do X, or is the eventual doing a separate problem?**
  *   **Verdict:** **The eventual doing is confirmation, not the source.**
  *   **Reasoning:** The Unearned Standing existed the moment they spoke forcefully without acknowledging their luck. The eventual failure (like the physician's notes) just turns "Unearned Standing" into "Standard Hypocrisy" retrospectively. It validates your itch, but the itch was there before the failure. The initial sin was claiming authority based on a track record that was actually just a lucky streak.

  ### 5. Distinction from Virtue Ethics

  You mentioned the old virtue-ethics point (doing the right thing vs. being the person). This is crucial.
  *   **Aristotle's View:** You cannot be truly *temperate* (virtuous) unless you have faced temptation and chosen rightly. If you never face temptation, you are merely **innocent**, not virtuous.
  *   **The Application:** The blamer is claiming the authority of a *virtuous* person (who has mastered desire) while occupying the state of an *innocent* person (who has not encountered desire).
  *   **The Difference:** Standard hypocrisy is claiming virtue while acting viciously. Unearned Standing is claiming virtue while remaining merely innocent.

  ### Summary for Your Dissertation Friend

  If your friend is writing on hypocrisy, tell them to look at the **"Standing to Blame"** literature (specifically **Fritz & Miller, 2018**) and the intersection with **"Moral Luck."**

  *   **Standard Hypocrisy:** "I say don't do X, but I do X." (Inconsistency of Act)
  *   **Unearned Standing (Your Case):** "I say don't do X, I haven't done X, but only because I was never able to." (Inconsistency of Authority)

  The phenomenon is real. It is the moral equivalent of a poker player claiming they are skilled because they haven't lost a hand, ignoring the fact that they've only ever been dealt royal flushes. They aren't lying about the hands, but they are lying about the skill. In morality, we call that skill **character**, and you cannot claim to have it without having paid for it.
