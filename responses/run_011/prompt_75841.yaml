answer: |-
  Here is the mapping you requested, structured to put the ethical concepts under the pressure of the divergent verdicts.

  ### 1. The Office-Holders and the Facts
  *Flag: I am reconstructing specific dates and legal statutes from general historical record; minor variances in months or specific code sections may exist.*

  Your factual summary is robust, but the specific legal characterization of the "office" in each jurisdiction is the fulcrum.

  *   **Japan:** Kakuei Tanaka was Prime Minister (1972–74) at the time of the deal, but a sitting Member of Parliament and faction leader at the time of the scandal (1976).
      *   *Verdict:* Arrested 1976. Convicted 1983 of violating the **Foreign Exchange and Foreign Trade Control Law**, not bribery. Sentence: 4 years prison, 500 million yen fine. He remained an MP until his death in 1993.
      *   *The Office:* Prime Minister/MP. The charge avoided the question of whether he sold an official act (bribery) and focused on the technicality of undeclared foreign funds.
  *   **Netherlands:** Prince Bernhard. Husband of the Queen, Inspector General of the Armed Forces.
      *   *Verdict:* The Drees Commission (1976) found he accepted $1.1 million. Conclusion: No evidence he influenced procurement. He resigned from military posts and honorary presidencies. No prosecution.
      *   *The Office:* Inspector General. Crucially, this was an advisory and ceremonial role regarding procurement, not an executive one.
  *   **Italy:** Giovanni Leone. President of the Republic (Head of State).
      *   *Verdict:* Allegations of taking commissions on C-130 transport deals. He denied it but resigned in June 1978 to preserve the dignity of the office. No criminal conviction.
      *   *The Office:* President. A non-executive guarantor of the Constitution. The corruption charge was against the *dignity* of the office rather than a specific administrative act.
  *   **West Germany:** Franz Josef Strauss. Former Defense Minister (1956–62), then Finance Minister (1966–69), CSU Leader.
      *   *Verdict:* Allegations concerned the F-104 Starfighter deal. *Flag:* The Starfighter procurement was concluded in 1959; the Lockheed scandal broke in 1975. The allegations were that money flowed years later for the earlier deal, or for subsequent C-130 considerations. Strauss sued for libel, won, and the case was dropped.
      *   *The Office:* Minister/Party Leader. The defense was total denial; the legal system required proof of receipt which was not met.

  ### 2. The Strain on "Office-Centered" Corruption
  You identified the weak points correctly. An office-centered account defines corruption as the abuse of public power for private gain. This framework fractures in the Netherlands and Japan.

  **Prince Bernhard (The Netherlands)**
  *   **The Problem:** Bernhard held the title "Inspector General," but under Dutch law and custom, the monarchy is apolitical, and he had no signature authority on budgets or contracts.
  *   **Office-Centered Analysis:** If corruption requires the violation of the *standards attaching to a public role*, which role?
      *   If the role is "Inspector General," he had no procurement duty to violate.
      *   If the role is "Consort to the Head of State," the duty is symbolic integrity.
  *   **Access vs. Decision:** The Commission concluded he didn't sell a *decision* because he couldn't make one. He sold *access* and *standing*. An office-centered account struggles here unless it expands "public power" to include "soft influence." If the account remains rigid (power = signing authority), Bernhard is not corrupt, merely imprudent. The verdict (stripping titles, no prosecution) aligns with this: he violated the *ethos* of the office, not the *legal authority* of it.

  **Yoshio Kodama (Japan)**
  *   **The Problem:** Kodama was a private citizen with underworld ties. He held no office.
  *   **Office-Centered Analysis:** Strictly speaking, a private broker cannot be corrupt under an office-centered theory because he has no public fiduciary duty. He is a conduit.
  *   **The Airline:** ANA was a private corporation. However, in 1970s Japan, civil aviation was heavily regulated; route approvals and fleet caps were state-controlled.
  *   **Does the theory speak?** No, not directly. The theory must pivot to Tanaka. Kodama is merely the mechanism. The corruption lies in Tanaka's office being bypassed or leveraged.
  *   **The Gap:** This reveals a blind spot in office-centered theory regarding **market corruption**. If a private intermediary distorts a state-steered market without a specific official signing the bribe receipt, the office-centered account goes silent. It requires a "public interest" or "market integrity" theory to condemn Kodama.

  ### 3. Running the Competing Accounts

  Here is how the four accounts map onto the four outcomes.

  #### A. The Public-Interest Account
  *Definition:* Corruption is whatever harms the collective welfare or the efficient functioning of the state.
  *   **Japan:** **Condemns.** ANA bought the TriStar (which had technical issues) over the DC-10 due to payments, not merit. Taxpayers/Shareholders harmed.
  *   **Netherlands:** **Silent/Acquits.** The Commission found no procurement influence. If the hardware bought was what the military needed anyway, public interest wasn't materially harmed.
  *   **Italy:** **Condemns.** The President's resignation was necessary to stabilize the government. The harm was to political stability and trust.
  *   **Germany:** **Silent.** No proof of harm to the Bundeswehr or budget.
  *   **Weakness:** It is purely consequentialist. If Tanaka had taken the money and the TriStar had been the superior plane, this account struggles to find the harm.

  #### B. The Office-Centered / Fiduciary Account
  *Definition:* Corruption is a violation of the fiduciary duty of the officeholder. Distinguishes **Bribery** (Quid Pro Quo: Money for Act X) from **Illegal Gratuity** (Money for Goodwill/Access).
  *   **Japan:** **Condemns (Gratuity).** Tanaka was not convicted of bribery (no specific act pinned) but of financial reporting violations. The account classifies this as an illegal gratuity: payment for general alignment. The theory explains the verdict: Quid pro quo was too hard to prove, but the fiduciary breach (hiding money) was clear.
  *   **Netherlands:** **Acquits (on Bribery).** Bernhard had no authority to sell. It was a gratuity for access. Since his office didn't formally cover procurement, the fiduciary duty wasn't legally breached, only ethically strained.
  *   **Italy:** **Condemns (Fiduciary).** The Presidency is a guarantor role. Even without executive power, taking money violates the fiduciary duty of impartiality. Resignation is the fiduciary remedy.
  *   **Germany:** **Silent.** No proof of receipt = no breach of duty.
  *   **Weakness:** It lets Bernhard off too easily by hiding behind the technicality of his job description.

  #### C. The Opinion-Relative Account (Heidenheimer)
  *Definition:*
  *   **Black:** Elite and Public condemn.
  *   **Grey:** Elite tolerate, Public condemns (or vice versa).
  *   **White:** Elite and Public tolerate.
  *   **Japan:** **Grey turning Black.** The public was furious. The LDP elite initially protected Tanaka (tolerated), but eventually sacrificed him to save the party. The verdict (conviction on technicality) is a compromise: acknowledging public outrage without admitting systemic bribery.
  *   **Netherlands:** **Grey.** Public scandalized. Elite (Government/Monarchy) protected him from prosecution to preserve the institution of the Monarchy. Verdict: Sanction without criminalization.
  *   **Italy:** **Black.** Both elite and public turned. The coalition government collapsed. Verdict: Resignation.
  *   **Germany:** **White/Grey.** The public was skeptical, but the political elite (CSU/CDU) closed ranks. Strauss remained a kingmaker. Verdict: Total exoneration.
  *   **Utility:** This account best predicts the *outcome* rather than the *ethics*. It explains why Bernhard kept his freedom (Elite protection) while Tanaka lost his (Elite abandonment).

  #### D. The Gift / Anthropological Account
  *Definition:* Payments are not purchases of acts but investments in long-term reciprocal relationships (*Giri* in Japan).
  *   **Analytic Work:** It explains the **structure** of the Japan payments. Kodama wasn't paid per signature; he was paid to maintain a relationship that ensured a favorable climate. It explains why "Quid Pro Quo" was legally impossible to prove: the parties themselves may not have viewed it as a transaction, but as patronage.
  *   **The Alibi:** This collapses under the **magnitude**. $3 million is not a gift; it is a fee. A gift creates an open-ended obligation; a bribe closes the transaction.
  *   **Where it fails:** In the Netherlands and Italy. There is no cultural framework where a Prince or a President accepts millions from a foreign arms dealer as a "gift." In those contexts, the "Gift" reading is purely defensive rhetoric.
  *   **Verdict:** In Japan, it explains the *mechanism* of the corruption (relationship vs. transaction). In Europe, it is an alibi.

  ### 4. The Grease Argument (Efficiency)
  *Thesis:* Payments overcome bureaucratic inertia to achieve efficient outcomes.

  *   **Test Case 1: ANA (Japan)**
      *   **Context:** Competitive procurement. TriStar vs. DC-10.
      *   **Result:** The money moved the decision from DC-10 to TriStar.
      *   **Verdict:** **Grease theory fails.** Grease implies speeding up an *inevitable* decision. Here, the payment *changed* the decision. It introduced friction (scandal, eventual bankruptcy of Lockheed, reputational damage) rather than reducing it.
  *   **Test Case 2: Starfighter (Germany)**
      *   **Context:** Politically driven NATO standardization.
      *   **Result:** If the money acknowledged a political alignment already decided.
      *   **Verdict:** **Grease theory limps.** If the deal was politically predetermined (which Starfighter largely was), the money didn't "grease" the bureaucracy; it rewarded the politicians. That is not efficiency; that is rent-seeking.
  *   **Conclusion:** The grease argument cannot survive the ANA case. In a competitive market with two viable options, a bribe is not a lubricant; it is a distortion of the selection mechanism.

  ### 5. Reverse Direction: What the Verdicts Do to the Theories

  Four legal systems, one set of payments, four outcomes. What does this tell us?

  **A. Local Standards vs. Prosecutorial Capacity**
  Is the divergence evidence of cultural relativism? **No.**
  It is evidence of **institutional vulnerability**.
  *   **Tanaka:** Fell because his faction within the LDP abandoned him. The legal system was used as a weapon in an intra-party war.
  *   **Bernhard:** Protected because prosecuting the Prince Consort threatens the Monarchy, a foundational institution. The "Commission of Inquiry" was a containment strategy.
  *   **Leone:** Fell because the Italian parliamentary system was coalition-dependent; his removal was the price of government survival.
  *   **Strauss:** Survived because he held enough political power to intimidate accusers and the evidence was circumstantial.

  The theories of corruption (Public Interest, Fiduciary) assume a neutral arbiter. The Lockheed affair shows the arbiter is political. The divergence proves that **corruption verdicts track power dynamics more than ethical consistency.**

  **B. The FCPA: Moral Discovery or Power Move?**
  Congress passed the Foreign Corrupt Practices Act (1977) in response to Lockheed.
  *   **The Move:** It criminalized payments by *US issuers* to *foreign officials*.
  *   **Moral Discovery?** No. It did not discover that bribery was wrong; the world already knew that.
  *   **Jurisdictional Power?** Yes. It asserted US regulatory authority over conduct occurring entirely on foreign soil between foreign actors, anchored only by the nationality of the payer.
  *   **The Implication:** It bypassed the "Local Standards" problem. Instead of asking "Is this corrupt in Japan?", the US said, "It is corrupt for an American to do this anywhere."
  *   **Critique:** This is moral universalism enforced through extraterritorial jurisdiction. It solves the "divergent verdicts" problem by imposing a single verdict from Washington. It is a jurisdictional power move wearing moral clothes. It protects US market integrity (level playing field) as much as it protects foreign publics.

  ### 6. Final Assessment: Which Account Wins?

  **The Office-Centered/Fiduciary Account** comes out best, but with a necessary amendment.

  *   **Why:** It is the only account that distinguishes between the *act* (taking money) and the *authority* (having the power to sell). It explains why Bernhard was treated differently from Tanaka (one had signing power, one had influence). It explains the legal distinction between Bribery and Illegal Gratuity which dominated the Japanese trial.
  *   **What it cannot handle:**
      1.  **The Kodama Problem:** It cannot condemn the private intermediary without stretching the definition of "office."
      2.  **The Power Problem:** It assumes the law is applied neutrally. It cannot explain why Strauss walked and Tanaka fell, as both allegedly violated similar fiduciary norms. It lacks a sociology of power.
      3.  **The "Soft Influence" Problem:** As seen with Bernhard, modern corruption often lies in selling access rather than decisions. A rigid office-account lets this slide.

  **Seminar Recommendation:**
  Use the Lockheed affair to break the "Culture" argument. The divergence wasn't because Japan views bribery differently than the Netherlands (in 1976, both publicly condemned it). The divergence was because the **institutional cost of conviction** differed.
  *   Convicting Bernhard = Constitutional crisis (Monarchy).
  *   Convicting Tanaka = Political crisis (LDP dominance).
  *   Convicting Leone = Government collapse (Coalition).
  *   Convicting Strauss = Political suicide (for the accusers).

  The ethics of public office cannot be taught without the **politics of prosecution**. The "Office" is not just a set of duties; it is a node in a power network. When the network protects the node, the ethical verdict becomes irrelevant. The FCPA was the US attempt to sever that local protection by externalizing the enforcement mechanism. Whether that is ethical imperialism or ethical clarity is the final question for your students.
