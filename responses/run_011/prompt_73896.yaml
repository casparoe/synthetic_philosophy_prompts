      *   Fundamentally new kind of fact → Leaf 6.
      *   Base is intrinsic nature → Leaf 7.

  7.  Is it plausible that a single comprehensive subject is fundamental and finite subjects are derived from it, say in a parenthetical what would have to be true for that derivation to be anything other than a restatement of the original difficulty running backwards?
      *   Plausible → Go to 8.
      *   Implausible → Go to 9.

  8.  If the comprehensive subject comes first, can the derivation of finite subjects be anything other than a restatement of the original difficulty running backwards?
      *   Yes → Leaf 8.
      *   No → Unoccupied Region 1.

  9.  Can a fundamental layer of reality consist of phenomenal qualities that float free of any subject, such that subjects are merely patterns in these qualities rather than their owners?
      *   Yes → Leaf 9.
      *   No → Unoccupied Region 2.

  10. If a single subject's experiential life could be shown to contain, in fully determinate form, the experiential lives of many subjects, has anything been explained about the many, or only relocated the problem?
      *   Explained → Leaf 10.
      *   Relocated → Unoccupied Region 3.

  **Leaves**

  1.  **Subject-Summing Panpsychism.** The macro-subject is nothing over and above the collection of micro-subjects.
      *   *Weakest Objection:* The Subject Summing Problem (how do many subjects become one?). *Reply:* Deny the problem is intelligible; unity is primitive.

  2.  **Constitutive Panpsychism.** The macro-subject is a distinct entity grounded in, but not identical to, the micro-subjects.
      *   *Weakest Objection:* Violates causal closure or overdetermination. *Reply:* Constitution is not causation; the levels are distinct ontological categories.

  3.  **Protophenomenalism.** Fundamental properties are not experiential but jointly ground experience when combined.
      *   *Weakest Objection:* The Generation Problem (how does non-experience become experience?). *Reply:* Proto-properties are categorical bases that necessitate experience in complex structures.

  4.  **Strong Emergent Panpsychism.** Micro-subjects exist, but macro-subjects are novel entities not constituted by them.
      *   *Weakest Objection:* Brute emergence is inexplicable magic. *Reply:* All fundamental laws are brute; this is no worse than gravity.

  5.  **Micro-Subject Illusionism.** Only fundamental subjects exist; human-scale subjects are useful fictions.
      *   *Weakest Objection:* Contradicts the immediate datum of our own unity. *Reply:* The datum is a representational error, not an ontological fact.

  6.  **Physicalist Emergentism.** The base is non-experiential; experience is a strongly emergent property of complex systems.
      *   *Weakest Objection:* Violates the Entry Point (structural facts exhaust the base). *Reply:* Emergence adds new facts not contained in the base description.

  7.  **Russellian Monism.** Physical dispositions are grounded in an intrinsic nature that is experiential or proto-experiential.
      *   *Weakest Objection:* The Combination Problem reappears at the level of intrinsic natures. *Reply:* Intrinsic natures combine differently than extrinsic dispositions.

  8.  **Cosmopsychism.** The universe is the fundamental subject; we are fragments or modifications of it.
      *   *Weakest Objection:* The Derivation Problem (how does the One become Many?). *Reply:* Decombination is a primitive relation symmetric to combination.

  9.  **Phenomenal Field View.** Fundamental reality is a field of qualities; subjects are secondary structures within the field.
      *   *Weakest Objection:* Qualities without bearers are incoherent. *Reply:* Subjectivity is a mode of the field, not a container for it.

  10. **Priority Monism with Experience.** The whole is fundamental and experiential; parts are dependent abstractions.
      *   *Weakest Objection:* Collapses into Cosmopsychism. *Reply:* Denies the "subject" status of the whole; it is merely the prior substance.

  11. **Dual-Aspect Fundamentalism.** The base is neutral, manifesting as both physical and experiential aspects.
      *   *Weakest Objection:* The nature of the neutral base is unknowable. *Reply:* It is known via its dual manifestations, not in isolation.

  12. **Macro-Subject Eliminativism.** Combination is impossible; therefore, macro-subjects do not exist.
      *   *Weakest Objection:* Self-refuting (who is eliminating?). *Reply:* The eliminating thought is a micro-subject event, not a macro-subject claim.

  **Unoccupied Regions**

  1.  **Region:** Fundamental One Subject + Derivation Impossible (Answer Yes to 7, No to 8).
      *   **Diagnosis:** Incoherent. If the derivation fails, the view collapses into Macro-Subject Eliminativism or Illusionism, rendering the "Fundamental One" explanatorily idle.

  2.  **Region:** Qualities without Subjects + Macro-Subjects Identical to Collections (Answer Yes to 9, but insist on Identity).
      *   **Diagnosis:** Incoherent. Identity requires a principle of individuation; if there are no subjects at the base, a collection of qualities cannot be identical to a subject without smuggling in a subject.

  3.  **Region:** Micro-Subjects Combine + Macro-Subject is Strongly Emergent (Answer Yes to 2, Yes to 5 "New Entity").
      *   **Diagnosis:** Redundant. If subjects genuinely combine (constitute), positing strong emergence is an unnecessary multiplication of entities; if they emerge strongly, they do not combine.

  **Inseparable Pairs**

  *   **Leaf 3 (Protophenomenalism) and Leaf 7 (Russellian Monism).**
      *   **Flag:** These leaves are not fully distinguished by the questions above.
      *   **Reason:** The distinction rests on whether the "intrinsic nature" of physical dispositions is itself "proto-experiential" (Leaf 3) or merely "neutral" but capable of grounding experience (Leaf 7). The questions treat these as a single branch (Question 4). To distinguish them, a student must commit to whether the fundamental intrinsic nature is *already* on the phenomenal spectrum or entirely outside it.

  *   **Leaf 4 (Strong Emergent Panpsychism) and Leaf 6 (Physicalist Emergentism).**
      *   **Flag:** These leaves are not fully distinguished by the questions above.
      *   **Reason:** Both assert that macro-experience is a fundamentally new fact not constituted by the base. The only difference is whether the base itself has experiential properties. If the base properties are undetectable except via their effects, the empirical predictions of both views are identical. To distinguish them, a student must commit to the intrinsic nature of the physical base independent of its causal role.
