  ### The Dossier Decision Tree

  This instrument maps the logical space of attribution. It does not ask what *is* the case (which lies beyond the dossier), but what the dossier *compels* you to posit. To traverse the tree, take the complete behavioral and neurophysiological record of a single subject. At each node, answer whether the record *forces* you to posit an internal state beyond the mechanism described. Your path reveals your position.

  **Node 1: The Reflex Threshold**
  *   **Dossier Content:** Does the record show nociceptive withdrawal (e.g., limb retraction from pinch) coupled with dorsal horn firing, in the absence of forebrain activity (e.g., transected preparation)?
  *   **Branch A (No State):** The mechanism is sufficient; no inner state is posited. → **Go to Node 2.**
  *   **Branch B (State Attributed):** Withdrawal implies sensation despite disconnection. → **Leaf 1.**

  **Node 2: The Integration Threshold**
  *   **Dossier Content:** Does the record show intact thalamocortical (or homologous) loops active during noxious stimulation (e.g., healthy dog, infant)?
  *   **Branch A (No State):** Anatomy is irrelevant; behavior is the only metric. → **Go to Node 3.**
  *   **Branch B (State Attributed):** Integration is necessary for sensation. → **Go to Node 4.**

  **Node 3: The Behavioral Sufficiency Threshold**
  *   **Dossier Content:** Does the record show long-term guarding, place aversion, or refusal to re-enter contexts associated with past noxious stimuli?
  *   **Branch A (No State):** Behavior is a complex output, not evidence of feeling. → **Leaf 2.**
  *   **Branch B (State Attributed):** Behavioral pattern constitutes the pain state. → **Leaf 3.**

  **Node 4: The Cognitive Threshold**
  *   **Dossier Content:** Does the record show novel problem-solving without reinforcement (e.g., octopus opening unrewarded jars) or flexible tool use?
  *   **Branch A (No State):** Sensation exists, but cognition/belief does not. → **Leaf 4.**
  *   **Branch B (State Attributed):** Sensation and cognition are co-extensive. → **Go to Node 5.**

  **Node 5: The Social Threshold**
  *   **Dossier Content:** Does the record show behavior modified by the subject's knowledge of being observed (e.g., scrub-jay re-caching)?
  *   **Branch A (No State):** Subject has beliefs about the world, not about minds. → **Leaf 5.**
  *   **Branch B (State Attributed):** Subject represents the mental states of others. → **Go to Node 6.**

  **Node 6: The Higher-Order Threshold**
  *   **Dossier Content:** Does the record show evidence that the subject represents its *own* internal states (e.g., metacognitive betting, uncertainty monitoring)?
  *   **Branch A (No State):** First-order states exist, but no awareness of them. → **Leaf 6.**
  *   **Branch B (State Attributed):** Consciousness requires representation of state. → **Go to Node 7.**

  **Node 7: The Report Threshold**
  *   **Dossier Content:** Does the record contain linguistic or symbolic report of the state consistent with behavior (e.g., adult human, trained ape)?
  *   **Branch A (No State):** Report is not required; neural/behavioral proxy is sufficient. → **Leaf 7.**
  *   **Branch B (State Attributed):** Only report verifies the state. → **Leaf 8.**

  **Node 8: The Causal Threshold**
  *   **Dossier Content:** (Global) Does the dossier imply the physical record is causally closed?
  *   **Branch A (No):** Physical events are occasions for non-physical intervention. → **Leaf 9.**
  *   **Branch B (Yes):** Physical events are causally sufficient. → **Go to Node 9.**

  **Node 9: The Reality Threshold**
  *   **Dossier Content:** (Global) Does the dossier compel the existence of phenomenal properties?
  *   **Branch A (No):** Talk of "feeling" is a useful fiction for behavioral prediction. → **Leaf 10.**
  *   **Branch B (Yes):** Phenomenal properties are real features of the world. → **Go to Node 10.**

  **Node 10: The Distribution Threshold**
  *   **Dossier Content:** (Global) Is the neural architecture unique to humans?
  *   **Branch A (No):** Experience is widespread across architectures. → **Leaf 11.**
  *   **Branch B (Yes):** Experience is restricted to human-like architecture. → **Leaf 12.**

  ***

  ### The Leaves (Positions)

  1.  **Radical Reflexivism:** Withdrawal is mechanical; no sensation exists without forebrain.
  2.  **Hard Behaviorism:** Inner states are fictions; only stimulus-response mappings are real.
  3.  **Dispositionalism:** Pain is nothing over and above the disposition to guard and avoid.
  4.  **Soft Cartesian:** Beasts feel pain but have no beliefs or thoughts about the world.
  5.  **First-Order Cognitivism:** Beasts have beliefs and desires, but no theory of mind.
  6.  **Higher-Order Thought (HOT):** Animals feel, but are not *conscious* of feeling without self-representation.
  7.  **Neural Integrationism:** Experience supervenes on specific neural architectures (e.g., thalamocortical), report unnecessary.
  8.  **Verificationism:** Without report, the attribution of experience is scientifically meaningless.
  9.  **Occasionalism:** Physical states are merely the occasion for divine or non-physical causal intervention.
  10. **Illusionism:** Phenomenal states do not exist; the dossier describes functions, not feelings.
  11. **Panpsychist/Continuity:** Experience is fundamental and distributed wherever there is regulation.
  12. **Human Exceptionalism:** Only humans possess the specific architecture required for genuine experience.

  ***

  ### Table of Verdicts

  *Verdict Key:* **P** (Pain/Experience Attributed), **~P** (No Pain/Experience Attributed), **?** (Indeterminate/Depends on specific architecture).

  | Leaf | Position | Transected Prep | Healthy Dog | Octopus | 7-Mo Infant |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Radical Reflexivism | ~P | ~P | ~P | ~P |
  | 2 | Hard Behaviorism | P* | P* | P* | P* |
  | 3 | Dispositionalism | ~P | P | P | P |
  | 4 | Soft Cartesian | ~P | P | ? | P |
  | 5 | First-Order Cognitivism | ~P | P | P | P |
  | 6 | Higher-Order Thought | ~P | ~P | ~P | ~P |
  | 7 | Neural Integrationism | ~P | P | ? | P |
  | 8 | Verificationism | ~P | ~P | ~P | ~P |
  | 9 | Occasionalism | ? | ? | ? | ? |
  | 10 | Illusionism | ~P | ~P | ~P | ~P |
  | 11 | Panpsychist/Continuity | P | P | P | P |
  | 12 | Human Exceptionalism | ~P | ~P | ~P | P |

  *\*Note for Behaviorism/Illusionism: They attribute the *label* "Pain" as a behavioral shorthand, but deny the *ontological state*. For the purpose of the dossier, they treat the animal as if it feels (P) to predict behavior, but deny the reality (~P) in metaphysics. I have marked P* to indicate this functional attribution without ontological commitment.*

  ***

  ### Leaf Commitments (The Awkward Sentence)

  1.  **Radical Reflexivism:** "The infant's scream is no more a sign of suffering than a knee jerk is a sign of thought."
  2.  **Hard Behaviorism:** "We are not denying the animal suffers; we are denying that 'suffers' means anything other than 'winces'."
  3.  **Dispositionalism:** "If the animal guards the wound but we remove the disposition to guard, the pain ceases to exist."
  4.  **Soft Cartesian:** "The dog howls in agony but has no concept of the thing hurting it."
  5.  **First-Order Cognitivism:** "The octopus knows the jar contains food, but does not know that it knows."
  6.  **Higher-Order Thought:** "The dog is in pain, but it is not *like anything* to be the dog."
  7.  **Neural Integrationism:** "If we replicate the firing pattern in silicon, the chip feels pain; if we replicate it in a lesioned brain, it does not."
  8.  **Verificationism:** "The infant's experience is scientifically inaccessible until it can speak."
  9.  **Occasionalism:** "The nerve firing does not cause the withdrawal; God causes the withdrawal on the occasion of the firing."
  10. **Illusionism:** "Your own certainty that you feel pain is a cognitive error generated by the dossier."
  11. **Panpsychist/Continuity:** "The transected spinal cord has a microscopic fragment of experience."
  12. **Human Exceptionalism:** "The evolutionary continuity of the nervous system is irrelevant to the discontinuity of experience."

  ***

  ### Indistinguishable Pairs (The Blind Spots)

  The third-person rule renders the following pairs empirically identical within the dossier. No behavioral or neurophysiological record can separate them.

  1.  **Leaf 3 (Dispositionalism) vs. Leaf 7 (Neural Integrationism):**
      *   *Why:* Both predict identical behavioral and neural outcomes for the dog and infant. Dispositionalism says the behavior *constitutes* the pain; Integrationism says the neural state *causes* the pain and behavior. The dossier shows both behavior and neural state. It cannot show which is ontologically primary.
  2.  **Leaf 2 (Hard Behaviorism) vs. Leaf 10 (Illusionism):**
      *   *Why:* Both deny the reality of phenomenal states. Behaviorism treats pain-talk as shorthand for behavior; Illusionism treats it as a false cognitive model. Both output "~P" for all animals. The dossier cannot distinguish a linguistic convention from a cognitive error.
  3.  **Leaf 6 (HOT) vs. Leaf 12 (Human Exceptionalism):**
      *   *Why:* Both deny consciousness to non-human animals. HOT denies it due to lack of self-representation; Exceptionalism denies it due to lack of human architecture. If the dossier shows no self-representation in dogs (likely) and dogs lack human architecture (true), both positions yield "~P" for dogs. They only diverge on a hypothetical non-human with self-representation but non-human architecture—a case not in the standard dossier.
  4.  **Leaf 4 (Soft Cartesian) vs. Leaf 5 (First-Order Cognitivism):**
      *   *Why:* Both grant sensation to the dog. Soft Cartesian denies beliefs/desires; Cognitivism grants them. If the dossier shows complex goal-directed behavior (Octopus), both can explain it: one as complex sensation-driven reflex, the other as belief-desire psychology. Without access to the *structure* of the representation (introspection), the dossier cannot distinguish "feeling-driven" from "belief-driven" action.

  ***

  ### Cost Analysis: What the Instrument Trades Away

  To satisfy the constraint that every node be answerable from a third-person dossier, this tree sacrifices the ability to distinguish between **ontology** and **explanatory utility**.

  1.  **The Reality Gap:** The tree sorts positions based on what they *require* the dossier to show, not on what *is*. It cannot tell you if the animal *actually* feels; it can only tell you if your position *compels* you to say it does. This means Leaf 10 (Illusionism) and Leaf 1 (Reflexivism) look identical in the table (~P across the board), even though one denies feelings in humans too and the other denies them in animals only. The dossier cannot capture the human introspective exception.
  2.  **The Causal Opacity:** The dossier records correlation (neuron fires, muscle contracts). It cannot record causation. This makes Leaf 9 (Occasionalism) technically compatible with every data point, as it posits a cause outside the physical record. The tree forces it into a branch, but the dossier cannot falsify it.
  3.  **The Introspective Blindness:** By banning introspection, the tree treats the scientist's own certainty of their pain as just another behavioral report. This flattens the distinction between "I know I feel" and "The dog acts like it feels." Consequently, positions that rely on the privileged access of the first-person (like Verificationism) are forced to treat the infant as a black box identical to the octopus, which may misrepresent the actual philosophical commitment of the Verificationist who grants the infant potentiality.
  4.  **The Homology Trap:** Node 2 and Node 7 rely on "homology." The dossier can show structural similarity, but not functional equivalence. A position might grant experience to a bird based on function despite lacking a cortex. The tree forces a choice based on anatomy, potentially misclassifying functionalists who prioritize process over structure.

  This instrument is not a truth-detector; it is a mirror. It shows you where you draw the line, not where the line is.
