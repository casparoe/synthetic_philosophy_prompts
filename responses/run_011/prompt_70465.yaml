answer: |-
  You're right that testimony dissolves the fear in the steam case, but you mistake the mechanism. In the Müller-Lyer illusion, the lines continue to *look* unequal; the visual content persists despite your belief. But when you learn the hiss is steam, the situation ceases to *look* dangerous. The evaluative property itself vanishes from your experience, even if the acoustic signal remains. This is a feature of high-level perception: just as a radiologist sees a tumor where I see a shadow, your new information changes what is presented to you, not merely what you judge about it.

  The beta blocker case is distinct, but it doesn't save the judgment view. If a drug dulls your vision, your capacity to see is impaired without changing your beliefs; similarly, the drug dampens the affective sensitivity required to perceive the danger. What unites your cases is that the *conditions* for perceiving value are disrupted, either by reinterpreting the object or dampening the organ. But I must ask you something crucial about that tunnel: when the drug kicks in, does the tunnel cease to *feel* dangerous, or do you simply stop caring while it still feels threatening? The answer determines whether the perception itself changed or just your reaction.
