      *   *Check:* Tone? Audit, not lecture. Direct.
      *   *Specific Point on (4) vs (5):* Kingma argues that you need to specify the *environment* to define function. If you specify a "standard" environment for the uniform list, you are making a normative choice about which environment counts. This contradicts the claim in (4) that it's an "empirical question". If it's empirical, it varies. If it varies, a uniform list is biologically inaccurate.
      *   *Specific Point on (1) vs (2):* Boorse explicitly argues against the "harm" condition because he wants to separate disease (objective) from illness (subjective/normative). By adding (2), the user is effectively adopting a hybrid view (like Wakefield or Daniels) but claiming Boorsean naturalism. This is the biggest inconsistency.
      *   *Specific Point on (7):* If the user looks at actual usage, clinicians often *do* require harm for a disease label (as per 2). Boorse *rejects* usage. So (7) undermines (1).

  7.  **Final Polish:** Ensure the "Cheapest Revision" is clear and actionable. The cheapest move is to drop the specific allegiance to Boorse (1) while retaining the naturalist framework modified by (2). This is a label change with substantive alignment.

