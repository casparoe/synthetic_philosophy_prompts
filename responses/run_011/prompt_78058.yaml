          *   *Issue:* User claims homosexuality wasn't a disease because "nothing was actually malfunctioning".
          *   *Tension:* This relies on a specific view of function (survival/reproduction). Homosexuality might reduce reproduction (statistically). Boorse actually struggled with this. To say it's not a disease because it's not "bad" is a normative claim, not a naturalist one.
          *   *Severity:* Medium. Requires a robust theory of function that doesn't accidentally classify non-heterosexuality as dysfunctional.
          *   *Fix:* Refine function theory.
