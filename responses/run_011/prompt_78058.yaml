      *   (2) **Harm Requirement (Anti-Overdiagnosis):** Disease must be *bad for the person*. Statistical deviation isn't enough. (This sounds like a normativist tweak to naturalism).
      *   (3) **Social Model of Disability:** Impairment = bodily fact; Disability = social barrier. (Compatible with naturalism on impairment, but needs careful handling regarding "disease").
      *   (4) **Kingma's Environment:** Function depends on environment (e.g., myopia, haemoglobin). Naturalism survives because environment is an empirical question.
      *   (5) **Uniform List for Resources:** Disease judgements should *not* track job/home/lifestyle (fairness). One list for all.
      *   (6) **Psychiatry History:** Past errors (homosexuality, drapetomania) were bad functional claims, not value-laden errors. Naturalism stands.
      *   (7) **Methodological Systematiser:** Look at actual usage (clinicians/patients) to settle disputes (descriptive metaphysics/conceptual analysis), not stipulative.

  3.  **Identify Conflicts/Tensions:**

      *   **Conflict A: (1) Boorsean Naturalism vs. (2) Harm Requirement.**
          *   *Issue:* Boorse's Biostatistical Theory (BST) is explicitly *not* about harm to the individual. It's about functional efficiency relative to survival/reproduction. A condition can be a disease in BST without causing harm (e.g., asymptomatic hypertension might count if function is impaired, even if the person feels fine). Conversely, something could be harmful but not a functional failure (e.g., pain from childbirth? No, that's functional. Maybe poisonings?).
          *   *Tension:* User says (1) "Whether something is a disease is settled by the biology, not by how anyone feels about it" but (2) "a condition shouldn't count as a disease unless it's actually bad for the person".
          *   *Severity:* High. This is the core definition clash. Boorse separates disease (natural) from illness (normative/harm). User is merging them.
          *   *Fix:* Give up strict Boorseanism (1) or give up the harm requirement (2).
          *   *Cost:* Giving up (1) means admitting values play a role in defining disease. Giving up (2) means accepting overdiagnosis labels as technically correct "diseases" even if harmless.

      *   **Conflict B: (4) Kingma's Environment vs. (5) Uniform List.**
          *   *Issue:* (4) says function depends on environment (myopia is a dysfunction in a reading society, not hunter-gatherer). (5) says disease judgements shouldn't track job/home/lifestyle (needs a uniform list).
          *   *Tension:* If the environment determines dysfunction (per Kingma/4), then a uniform list (5) is impossible or unjustified. A farmer needs different vision than a programmer. If you fix the environment for the "uniform list" (e.g., standard industrial society), you are implicitly privileging that environment, violating the spirit of (5) regarding fairness/lifestyle tracking.
          *   *Severity:* High. (4) contextualises function; (5) de-contextualises allocation.
          *   *Fix:* Give up strict contextualism (4) or give up uniform list (5).
          *   *Cost:* Giving up (4) weakens the response to Kingma (makes naturalism rigid). Giving up (5) means accepting contextual eligibility for resources (which user fears is unfair).

      *   **Conflict C: (1) Naturalism vs. (3) Social Model of Disability.**
          *   *Issue:* User assumes they aren't at war. Boorse defines disease (impairment-ish) naturally. Social model says disability is social.
          *   *Tension:* Actually, this is often compatible *if* disease = impairment. However, if disease *includes* the harm condition (from 2), and harm is often socially mediated (e.g., myopia harms only because we read), then disease becomes partly social.
          *   *Severity:* Medium. Mostly manageable if "disease" maps to "impairment" and "disability" maps to "social exclusion". But (2) muddies this.
          *   *Fix:* Clarify distinction between disease and disability.
          *   *Cost:* Minimal if kept distinct, but (2) bridges them.

      *   **Conflict D: (7) Methodological Systematiser vs. (1) & (5) Stipulation.**
          *   *Issue:* (7) says look at actual usage. (1) says Boorse (who stipulates a technical definition often at odds with usage). (5) says impose a uniform list (policy stipulation) rather than following usage (which might vary by context).
          *   *Tension:* Clinicians often use "disease" to imply harm (supporting 2). Policymakers often contextualise (contradicting 5). Boorse explicitly rejects usage in favour of theoretical utility.
