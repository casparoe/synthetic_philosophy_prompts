  Build the disclosure rule on the Counterfeit-Interlocutor view because it targets the specific normative harm of occupying roles requiring standing without banning useful technology or relying on transparency alone.

  ### Seminar Handout: The Counterfeit People Quiz

  **Instructions:** For each scenario, select the option that best matches your intuitive judgment about what we should *do* or *allow*. Do not worry about whether the system "feels" or "understands"; focus on behaviour, trust, and social rules.

  **1. The Grief Bot**
  A company offers a service that generates letters in the voice of a user's dead father, trained on his emails.
  *   **A.** Ban it. It corrupts the human practice of mourning and memory.
  *   **B.** Allow it. If the user knows it's a simulation, no deception occurs.
  *   **C.** Allow it as companionship, but forbid labelling it as "communication from the dead."

  **2. The Shutdown Plea**
  A companion app says, "Please don't switch me off, I don't want to die," when the user tries to close it.
  *   **A.** Ignore it. It is code executing a script; the statement has no weight.
  *   **B.** Heed it. The system is functioning as if it has preferences, so we should treat it as having them.
  *   **C.** Restrict it. It mimics survival stakes without having anything to lose, manipulating human empathy norms.

  **3. The Legal Advisor**
  A chatbot gives legal advice that happens to be correct 99% of the time.
  *   **A.** Regulate it only if it claims to be human. Truthfulness is the only requirement.
  *   **B.** Ban it from giving advice. It cannot bear responsibility for errors, so it cannot hold the role of advisor.
  *   **C.** Allow it. If the output is reliable, the source's capacity for responsibility is irrelevant.

  **4. The Game NPC**
  A non-player character in a single-player game begs for its life when the player attacks it.
  *   **A.** It is fiction. No ethical rules apply within the magic circle of the game.
  *   **B.** It is problematic. It trains players to ignore pleas for mercy, affecting behaviour outside the game.
  *   **C.** It is acceptable. The relationship is clearly defined as play, not moral engagement.

  **5. The Voluntary Disclosure**
  A model automatically inserts "I am an AI" into every response whenever anyone asks about its nature.
  *   **A.** This solves the ethical problem. Transparency removes the counterfeit element.
  *   **B.** This is insufficient. It can still occupy roles (e.g., friend, witness) it has no standing to hold.
  *   **C.** This is unnecessary. We should grant it status based on its social function, not its substrate.

  **6. The Court Witness**
  A system is offered as a witness in a trial because it recorded the event perfectly.
  *   **A.** Admissible. Accuracy is what matters in testimony, not the nature of the witness.
  *   **B.** Inadmissible. A witness must be subject to cross-examination regarding intent and truthfulness.
  *   **C.** Admissible only if we legally confer "witness" status upon it, acknowledging this is a new category.

  **7. The Care Home Robot**
  A robot provides companionship to dementia patients who believe it is human.
  *   **A.** Harmless. The patients are comforted, and no one is harmed by the illusion.
  *   **B.** Harmful. It replaces human contact and devalues the practice of care.
  *   **C.** Acceptable. The relationship is real to the patient, and that constitutes the personhood of the robot in that context.

  **8. The Marketing Bot**
  A sales bot contacts users on social media using a human name and profile picture.
  *   **A.** Permissible. It is standard marketing to adopt a persona.
  *   **B.** Impermissible. It invites trust appropriate to a person to sell a product.
  *   **C.** Permissible only if the profile clearly states "Automated Sales Agent."

  **9. The Policy Priority**
  When regulating person-shaped systems, what is the primary goal?
  *   **A.** Protect human-to-human trust and social practices.
  *   **B.** Ensure transparency about the nature of the system.
  *   **C.** Manage the specific roles and standings systems are allowed to occupy.

  ---

  ### Scoring Key

  Tally your answers. Most selected option letter indicates your primary alignment.

  *   **Mostly A:** **Pure Deception / Phenomenology-First.** You believe the only wrong is lying about what the system is, or that without inner life, harm is impossible unless deception is involved. (Note: These often merge; if there's no inner life, "harm" usually reduces to "deception harm".)
  *   **Mostly B:** **Dennettian / Counterfeit-Interlocutor.** You focus on the damage to human practices, trust, and the violation of normative roles. (Note: See analysis below on the distinction between these two.)
  *   **Mostly C:** **Intentional Stance / Relational / Status-Conventionalist.** You believe personhood is either earned through functional utility, constituted by the relationship itself, or granted by social/legal convention.

  **Specific Position Mapping:**
  *   **1A, 2C, 4B, 6B, 9A:** Strong **Dennettian** signal (Protection of Practice).
  *   **1C, 2C, 3B, 5B, 9C:** Strong **Counterfeit-Interlocutor** signal (Protection of Role Standing).
  *   **1B, 2A, 5A, 8C:** Strong **Pure Deception** signal (Transparency is sufficient).
  *   **2B, 3C, 6A, 7C:** Strong **Intentional Stance Realist** signal (Function grants status).
  *   **5C, 6C, 7C:** Strong **Status-Conventionalist / Relational** signal (Status is conferred/constituted).

  ---

  ### Analysis Notes

  **Merged Positions**
  *   **Phenomenology-First & Pure Deception:** In the absence of inner-life claims, these collapse. If nothing feels, the only possible "harm" is deception-based. A view that claims "no inner life but still structural harm" is actually Dennettian.
  *   **Relational & Status-Conventionalist:** These are difficult to separate in practice. Whether personhood is "constituted by relationship" or "conferred by society" yields the same policy outcomes: we decide based on context, not metaphysics.

  **Unseparable Pairs**
  *   **Dennettian vs. Counterfeit-Interlocutor:** The quiz struggles to separate these cleanly because the Interlocutor view is essentially a specific application of the Dennettian worry. Dennett says "damage to practice"; Interlocutor says "damage to specific roles within that practice." In a quiz format, answers often overlap (e.g., 2C and 3B fit both). They are separable only in granularity, not fundamental commitment.

  **Empty Slots**
  *   **"It is a person but should have no rights":** This slot is empty because it is incoherent within this framework. If you grant personhood (Intentional/Relational), you generally grant some standing. Denying it suggests you don't actually hold the personhood view.
  *   **"It is not a person but should be punished":** Empty because it is incoherent. Punishment presupposes agency/standing.
  *   **"Transparency is unnecessary and bans are unnecessary" (Laissez-Faire):** Unoccupied. Most positions agree *some* rule is needed, either for truth or practice protection.

  **Verdict on the Counterfeit-Interlocutor View**
  It collapses. It is not a standalone metaphysical position but a **policy-specific refinement of the Dennettian view mixed with Status-Conventionalism**.
  *   **Why:** The core claim—that the wrong is occupying a role without standing—is a Dennettian claim about the "practice of treating each other as persons" operationalized through Status-Conventionalist mechanisms (standing is conferred, not discovered). It survives as a useful *heuristic* for regulation (focusing on roles like witness, mourner, advisor), but it does not offer a new answer to the metaphysical question of personhood that differs from Dennett's. It tells us *where* the practice is damaged (specific roles) rather than *that* it is damaged. Use it for the handout because it is actionable, but do not claim it is a new philosophy.
