answer: |-
  Here is the referee's decision.

  You were right to feel frustrated. Your friend has a strong grasp of the *mechanics* of these theories but has conflated their *philosophical commitments* and *logical consequences*. He is treating deep structural differences in logic as mere implementation details.

  Here is the breakdown you asked for.

  ### Part 1: The Scorecard on His Summary

  Let's go through his claims claim-by-claim. I've categorized them as **Acceptable** (accurate enough for conversation), **Simplification** (technically imprecise but captures the spirit), or **Wrong** (fundamentally mistaken).

  **1. "Kripke basically proved Tarski wrong."**
  *   **Verdict:** **Wrong.**
  *   **Why:** Tarski proved that a *classical* language (obeying standard logic and bivalence) cannot contain its own truth predicate without becoming inconsistent. Kripke did not refute this theorem; he changed the rules of the game. Kripke showed that if you give up classical bivalence (allowing sentences to be neither true nor false), you *can* have a language contain its own truth predicate. Tarski is right about classical logic; Kripke is right about non-classical logic. Your friend is confusing a change in assumptions with a refutation of a theorem.

  **2. "Kripke showed it can... start with sentences that don't mention truth... fixed point."**
  *   **Verdict:** **Acceptable.**
  *   **Why:** This is a solid layman's summary of *Outline of a Theory of Truth* (1975). He correctly identifies the "grounded" sentences, the iterative process, and the "minimal fixed point."

  **3. "The liar never picks up a value, so it comes out neither true nor false."**
  *   **Verdict:** **Acceptable.**
  *   **Why:** In Kripke's minimal fixed point, the Liar sentence is indeed undefined. It falls into a "truth-value gap."

  **4. "Which is the same conclusion Priest reaches, Kripke just gets there by construction instead of by arguing for true contradictions."**
  *   **Verdict:** **Wrong.** (This is the crux of your argument).
  *   **Why:** This is a category error. Graham Priest (dialetheism) argues the Liar is **both** true and false (a "glut"). Kripke argues the Liar is **neither** true nor false (a "gap"). These are opposite semantic statuses with opposite logical consequences.
      *   **Kripke (Gap):** Preserves consistency, sacrifices completeness (some sentences aren't classified).
      *   **Priest (Glut):** Preserves completeness (all sentences classified), sacrifices consistency (some contradictions are true).
      *   Your friend claims they reach the "same conclusion." They do not. One says the Liar is a logical error (undefined); the other says the Liar is a true contradiction.

  **5. "And the revenge liar sinks the whole thing anyway... 'the liar is neither true nor false' is itself a sentence..."**
  *   **Verdict:** **Simplification.**
  *   **Why:** He is describing the "Revenge Problem" (specifically the Strengthened Liar). It is true that Kripke's theory is usually formulated in a metalanguage that the object language cannot fully express. If the object language could express "is undefined," paradox returns. However, saying the theory "contradicts itself" is too strong; it's more that the theory is *incomplete* or requires a hierarchy of metalanguages to explain, which undermines Kripke's goal of a single unified language.

  **6. "That's why you have to be a dialetheist."**
  *   **Verdict:** **Wrong.**
  *   **Why:** Non sequitur. The failure of Kripke's specific construction does not force you into dialetheism. You could accept gaps (paracompleteness), adopt contextualism (the meaning of 'true' shifts), or accept Tarski's hierarchy. Dialetheism is one option among many for handling Revenge, not the only logical necessity.

  ---

  ### Part 2: The "Gaps vs. Gluts" Dispute

  **Verdict:** **You are right. He is wrong.**

  This is not "hung up on terminology." In formal logic, the distinction between a **gap** (paracompleteness) and a **glut** (dialetheism/paraconsistency) is structural and affects how inference works.

  *   **The Gap View (Kripke/Strong Kleene):** The Liar has no truth value. Therefore, the Law of Excluded Middle ($P \lor \neg P$) fails for the Liar. Logic must be weakened to prevent explosion from undefined values.
  *   **The Glut View (Priest/LP):** The Liar has two truth values. Therefore, the Law of Non-Contradiction ($\neg(P \land \neg P)$) fails for the Liar. Logic must be weakened to prevent *explosion* (the principle that from a contradiction, anything follows).

  If your friend thinks these are the same, he is missing the fundamental trade-off of non-classical logic. You cannot treat "Neither True nor False" as equivalent to "Both True and False." One is a lack of information (or definability); the other is an excess of information (overdetermination).

  **Referee Ruling:** You win this point. It is a substantive logical disagreement, not semantics.

  ---

  ### Part 3: The Timestamp Trick

  Your friend proposes: *Sentences are timestamped. A sentence can only predicate truth of sentences with earlier timestamps.*

  **Verdict:** **He has rebuilt Tarski's hierarchy with extra steps.**

  He claims this "beats Tarski" because timestamps are "empirical facts" rather than a "distinction internal to the language." Here is why that distinction doesn't save him:

  **1. It is a Hierarchy by Another Name**
  Tarski's solution was to create levels of language ($L_0, L_1, L_2...$). $L_1$ can talk about truth in $L_0$, but not in $L_1$.
  Your friend's solution creates levels of time ($t_0, t_1, t_2...$). A sentence at $t_2$ can talk about truth at $t_1$, but not at $t_2$.
  Functionally, this is identical to Tarski. It prevents self-reference by enforcing a strict ordering. It does not achieve Kripke's goal (allowing a language to contain its own truth predicate); it achieves Tarski's goal (preventing paradox by restricting the truth predicate).

  **2. The "Empirical" Advantage is Illusory**
  He argues timestamps are "empirical facts." But for the logic to work, the *constraint* must be logical.
  *   *Question:* What happens if I say, "Every sentence uttered before this one is false"?
  *   *Friend's Answer:* That's allowed. It refers to earlier times.
  *   *Question:* What happens if I say, "Every sentence uttered up to and including this one is false"?
  *   *Friend's Answer:* That's ill-formed/banned.
  *   *Problem:* To enforce this, you need a rule that says "You cannot quantify over the set of sentences that includes your own timestamp." This rule is a **logical restriction on the language**, exactly like Tarski's. The fact that the index is "time" rather than "level number" is a cosmetic difference.

  **3. The Revenge Problem Returns**
  The timestamp theory faces its own version of the Revenge Liar.
  Consider the sentence: *"All sentences with earlier timestamps are false."*
  Now consider the theory itself: *"No sentence can predicate truth of itself or simultaneous sentences."*
  Is *that* theoretical sentence true? If it is a sentence in the language, when was it uttered?
  *   If it was uttered at $t_{now}$, can it predicate rules about $t_{now}$?
  *   If the theory claims to cover *all* sentences, does it cover itself?
  If the theory is true, it seems to require a "God's eye view" outside of the timestamp system to validate the rules of the system. This recreates the Tarskian metalanguage problem he claimed to avoid.

  **4. Expressive Cost**
  Kripke's big selling point was that we *do* seem to say things like "Everything the Pope says is true," without worrying about whether the Pope is currently speaking. We want a truth predicate that is general. The timestamp solution forces us to parse every truth claim with a temporal index. It makes natural language logic much more rigid than it appears to be.

  ### Final Judgment

  **On the History/Logic:** Your friend is confident but technically inaccurate. He conflates gaps and gluts (a major error) and claims Kripke refuted Tarski rather than circumvented Tarski's assumptions. You were correct to press him on the gap/glut distinction.

  **On the Solution:** His timestamp idea is a "Dynamic Tarskian Hierarchy." It is a consistent system, but it does not do what he claims (beat Tarski or allow a full truth predicate). It solves the Liar by banning self-reference, just like Tarski, but uses time as the sorting mechanism. It is vulnerable to the same meta-logical issues (Revenge) that plague Tarski.

  **Who won?**
  You were right to defend the distinction between gaps and gluts. That is not terminology; it is logic. However, give him credit: his timestamp idea is a known variation in the literature (often related to *indexical* contextualism), even if his sales pitch about it "beating Tarski" is overstated.

  **Advice for the ceasefire:** Tell him: "You built a consistent system, but it's Tarski in a time machine, not Kripke. And you still can't have the Liar be both true and false without breaking logic, nor neither without breaking completeness. We're stuck in the same boat, just sitting on different sides."
