answer: |-
  (1) **Mark Breakdown (Total: 8/15)**

  *   **Part (a) [6 marks]: 2/6**
      *   *Senses (2 marks): 1/2.* Accurate identification of "design settles issue"; inaccurate definition of "inherent politics" (confuses compatibility with power structures with safety regulation).
      *   *Assignments (2 marks): 1/2.* Feature (i) correctly assigned; Feature (iii) incorrectly dismissed as neutral/efficient ( Winner argues efficiency choices are political); Feature (ii) weakly justified.
      *   *Conclusion (2 marks): 0/2.* Incorrectly claims politics requires intentional design; Winner argues unintended consequences are also political.
  *   **Part (b) [6 marks]: 3/6**
      *   *Specification (2 marks): 2/2.* Adequate definition of determinism ("technology has already decided the shape of social life").
      *   *Verdict (2 marks): 0/2.* Incorrect verdict; Winner explicitly argues against determinism.
      *   *Support (2 marks): 1/2.* Partial credit for noting human choice exists; deducted because claiming this supports determinism misstates Winner's position.
  *   **Part (c) [3 marks]: 3/3**
      *   *Feature/Choice/Actors (3 marks): 3/3.* Correctly identifies contingent contractual clause, possibility of renegotiation, and relevant stakeholders.

  (2) **Grading Note & Claim Inventory**

  *   **Quote:** "the second [way] is when a technology is inherently political, meaning it is complicated and dangerous enough that government has to regulate it"
      *   **Classification:** Inaccurate.
      *   **Correction:** Winner's "inherent politics" refers to technologies that *require* specific power structures (e.g., nuclear power requiring authoritarian security), not merely those requiring safety regulation.
  *   **Quote:** "Feature (iii) is neither, because the engineers were only following gradient and land cost... Winner would agree that where no political motive exists the artifact is neutral."
      *   **Classification:** Inaccurate (Feature iii).
      *   **Correction:** Winner argues that "efficiency" is a political value; excluding low-car neighborhoods is a political outcome regardless of engineer intent.
  *   **Quote:** "politics sits in the artifact when someone designs it that way on purpose, and otherwise... consequences... are not politics at all"
      *   **Classification:** Inaccurate (Conclusion).
      *   **Correction:** This is the most consequential misunderstanding. Winner's core thesis is that consequences *are* political even if unintentional; intent is not a prerequisite for politics.
  *   **Quote:** "Winner is a determinist, though a moderate one... because once the guideway is poured... consequences are locked in"
      *   **Classification:** Inaccurate (Part b).
      *   **Correction:** This confuses *path dependence* (hard to change) with *determinism* (autonomous technological drive). Winner acknowledges path dependence but insists the initial path was a human political choice.
  *   **Quote:** "The certified-technician clause in feature (ii) is the contingent one."
      *   **Classification:** Accurate (Part c).
      *   **Correction:** None. This shows a good grasp of institutional contingency.

  **Most Consequential Misunderstanding:** The claim that "where no political motive exists the artifact is neutral." This negates Winner's entire argument about unintentional politics.
  **Most Costly Error:** The verdict in part (b) that "Winner is a determinist." This loses all verdict marks and undermines the support marks.

  (3) **Student-Facing Feedback**

  You have a strong grasp of institutional contingency, evidenced by your excellent analysis in part (c); identifying the contractual clause as a removable political choice is precisely the kind of thinking this course requires. However, your reading of Winner in parts (a) and (b) conflates distinct concepts. Specifically, you argue that artifacts are only political if designers intend them to be, whereas Winner insists that unintended consequences (like excluding neighborhoods via 'efficient' routing) are equally political. Additionally, you classify Winner as a determinist because technologies are 'locked in' once built. While true that infrastructure is hard to change, Winner calls this 'path dependence,' not determinism; he argues the initial locking-in was a human choice, not an inevitable technological force. To improve, distinguish between a technology's *constraints* (which are real) and its *origin* (which Winner argues is always political). Read Winner's conclusion again where he discusses 'reclaiming' technology; this clarifies his anti-determinist stance.

  (4) **Reasoned Answer on the Second Reader's Claim**

  The second reader argues that because Winner's examples (like Moses' bridges) can be interpreted as showing technology dictating social outcomes, the student's verdict that Winner is a determinist deserves full marks. I reject this. We must distinguish between an author's *thesis* and a scholar's *critique* of that thesis. The exam question asks, "Does Winner's account commit him to technological determinism?" This requires fidelity to Winner's explicit argument, not a meta-critique of his consistency. Winner explicitly writes to *refute* determinism, arguing that what looks like technological inevitability is actually frozen human policy.

  **Principle:** In interpreting canonical texts for comprehension, credit for verdicts depends on alignment with the author's stated position, even if that position is debatable in wider theory. Support marks depend on whether the student's reasoning accurately reflects the text's internal logic.

  **Application:** A student arguing Winner is *not* a determinist earns full verdict marks by citing his emphasis on human agency in design. A student arguing he *is* a determinist (like this script) loses verdict marks because it contradicts the text's explicit thesis. They may earn support marks only if they identify tension in the text (e.g., "Winner claims agency but describes rigid structures"), but this student merely misdefined determinism as 'path dependence.' To award full marks here would signal that reading the author's stated conclusion is optional, undermining the course's goal of textual literacy. We can acknowledge the scholarly debate in seminar, but in assessment, fidelity to the assigned argument is the baseline standard.
