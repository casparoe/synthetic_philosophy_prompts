  2.  **Analyze the Source Material (Winner's "Do Artifacts Have Politics?"):**
      *   **Thesis:** Artifacts can have politics in two specific ways.
          1.  **Inherent Politics (Type 1):** Certain technologies *require* or are *strongly compatible* with specific kinds of political relationships (e.g., nuclear power requires centralized authority/security).
          2.  **Accidental/Design Politics (Type 2):** Artifacts are arranged in specific ways that settle public issues (e.g., Robert Moses' low bridges excluding buses/poor people). This is often intentional but can be unintentional consequences of design choices.
      *   **Determinism:** Winner explicitly *rejects* technological determinism. He argues for human agency in design choices. He critiques the idea that technology develops autonomously and forces social change. He argues politics is *in* the technology because people put it there (either intentionally or through institutional arrangements), not because the technology itself dictates social outcomes independent of human choice.
      *   **Key Distinction:** Politics *in* artifacts vs. Politics *of* artifacts.
      *   **Neutrality:** Winner argues artifacts are *not* neutral.
      *   **Determinism Definition:** Hard determinism = Technology drives history/society independent of human will. Soft determinism = Technology constrains choices but humans still choose. Winner's stance is generally anti-determinist; he emphasizes the *choices* made during design and implementation.

