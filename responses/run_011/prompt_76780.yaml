answer: |-
  You suppose a contradiction where there is only a distinction of direction. I do not say the stage is without power; I say it is powerless to improve. Its first law is to please, and to please it must flatter the dominant passions. When those passions are vicious, the poet who paints them truly will strengthen them. Molière did not teach the French to love the world; he saw they loved it already and made honesty appear rude by contrast. The stage follows manners, yes, but in following them it digs them deeper. It is a mirror that does not correct the face but convinces the ugly man he is beautiful.

  Therefore, your hope that a republic might direct this power is a chimera. If the people are virtuous, they need no theater; if they are not, they will not suffer a play that reproaches them. To commission a work where the fraud is laughed at requires a public that already hates fraud. In Geneva, we are not yet Paris; our manners are simple. To introduce the stage is to introduce the necessity of pleasing, and soon we shall find our own Alcestes mocked by those who prefer the ease of Philinte. There is no need to abandon either point: the stage harms because it flatters vice, and it cannot reform because it must flatter to survive.
