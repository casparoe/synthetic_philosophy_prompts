          *   *Problem:* If the "ordinary person" still found it immoral (which they likely did), why stop enforcement? Devlin allows tolerance, but does he allow *decriminalization* of something still considered immoral? Yes, if enforcement causes more harm to the social fabric (e.g., blackmail) than the immorality itself.

