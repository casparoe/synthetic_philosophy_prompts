  8.  **Drafting Content - Key Philosophical References:**
      *   Harsanyi (1955).
      *   Sen (1970s/80s) - Critique of welfarism and IPC.
      *   Peter Diamond (1967) - "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility" (Wait, that's Harsanyi. Diamond is "Cardinal Welfare..."? No, Diamond is "The Evaluation of Infinite Utility Streams" or his critique of Harsanyi in "Cardinal Utility and Interpersonal Comparisons"? Actually, the specific critique on risk vs. equality is often attributed to Diamond (1967) regarding ex-ante vs ex-post). *Correction:* The specific critique about the coin toss is often linked to Peter Diamond's "Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility" is Harsanyi. Diamond's critique is in "On the Aggregation of Individual Preferences" or similar. Let's stick to the substance: Ex-Ante vs. Ex-Post.
