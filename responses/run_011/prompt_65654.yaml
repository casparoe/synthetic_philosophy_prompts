      *   *Coin Toss (One dose, two patients):* Harsanyi says indifferent between (100% Patient A) and (50% A, 50% B) if expected utility is equal. Egalitarians say the mix is better (ex post equality). This is the "Ex Post vs. Ex Ante" conflict.
