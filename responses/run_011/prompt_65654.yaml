  9.  **Refining the "Preference vs. Welfare" Point:**
      *   The user says: "Distributive questions just are questions about how to choose under risk."
      *   Counter: Distributive questions are about *actual* outcomes for *distinct* people. Risk is about *uncertain* outcomes for *one* (or identical) agent. Equating them requires the "Veil of Ignorance" argument, not just the Aggregation Theorem. The Aggregation Theorem takes preferences *as given*. If individuals care about equality, their preferences might not be self-interested. If they are self-interested, the theorem aggregates self-interest. If society cares about equality *over and above* self-interest, it violates the Pareto condition or Independence.

