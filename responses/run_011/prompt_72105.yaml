      *   Concessions for cliometricians? Yes.
      *   Analogy warnings? Yes.
      *   The "Hope Nobody Voices" objection? Yes.

      *(Self-Correction during drafting)*: Make sure the distinction between "calendar time" and "orbital forcing" is clear. Calendar is a coordinate system; orbital forcing is a *driver*. The user's argument rests on the need for a *driver* to validate a cycle. I need to make sure the replies reflect that nuance. Also, ensure the "Whig" distinction is clear (complexity $\neq$ goodness).

      *(Refining the "Killer" Objection)*: The strongest objection is that the user is committing the same sin they accuse others of: imposing a grand narrative (stratigraphic accumulation) on a fragmentary record. It undermines the epistemological high ground.

      *(Refining Concessions)*: Cliometricians care about identification strategies. Concede that their time series are robust *measurements*, even if the *interpretation* of cycles is flawed.

      *(Refining Analogy Warning)*: The big difference is *intentionality*. Strata are passive; historical records are active constructions.

