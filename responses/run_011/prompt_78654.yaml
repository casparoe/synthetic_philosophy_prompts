answer: |-
  1.  **Adoption Claim:** A producer's cost necessity triggers the use of *known* tools. (Platitude: Nobody denies demand drives diffusion, but it explains origin nowhere; presupposes the technique already exists).
  2.  **Directional Claim:** Relative factor prices steer inventive effort toward specific factors among conceivable options. (Substantive: Defensible as a tendency, but presupposes a supply of ideas exists to be steered and actors capable of steering).
  3.  **Generative Claim:** Economic or existential pressure causally produces the *existence* of novel techniques ex nihilo. (False: Ignores epistemic bottlenecks; necessity often meets ignorance, not invention).
  4.  **Universal Claim:** This mechanism operates invariantly across all polities given similar prices. (False: Ignores institutional, cultural, and scientific mediators required to translate price signals into innovation).

  Your classmate requires the **Generative Claim** (3), implicitly bolstered by the **Universal Claim** (4). He argues cheap labor prevented invention, implying high wages caused it. This fails at the inference from factor prices to the *supply* of inventions. High wages create demand for labor-saving tech, not the tech itself. The defect lies in treating knowledge as endogenous to price signals alone. A producer cannot substitute machinery for labor if no one knows how to build the machine, regardless of wage rates. The proverb conflates the *motivation* to invent with the *capacity* to invent.

  Regarding methodology: Invoking the law does not dissolve the contrastive worry; it presupposes comparability. To claim the mechanism applies to both Britain and the Yangzi Delta, you must first establish they are comparable units capable of responding to price signals similarly. If China lacked the scientific infrastructure, property rights, or cultural frameworks to respond to necessity with invention, the cases are not comparable under this law. The proverb hides the assumption that both regions possessed equal inventive potential, which is precisely what is contested. By asserting the mechanism operates in both cases, your classmate begs the question of comparability rather than solving it. The argument fails because it treats a conditional tendency (prices steer innovation *if* capacity exists) as an unconditional law (prices cause innovation). The methodological worry remains: you cannot compare the output of a mechanism without first verifying the mechanism was operative in both cases, which requires the very historical comparison the proverb was meant to bypass.
