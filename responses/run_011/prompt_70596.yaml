answer: |-
  ## Part 1: The Triage Procedure (The "Bell Filter")

  This procedure is designed for a staff member with orientation-level training. It takes ~10 minutes per sentence. It relies on the one settled fact of Bell tests: **Local Realism is false.** It does *not* tell us whether to drop "Locality" (no instant influence) or "Realism" (definite properties before measurement).

  ### The Checklist
  Run the candidate sentence through these four questions in order. If you answer **YES** to any "Kill" condition, stop. If you answer **YES** to any "Fix" condition, flag it for revision.

  **1. The Signaling Check (The Hard Kill)**
  *   **Question:** Does the sentence claim information, messages, energy, or *usable* signals travel faster than light?
  *   **Keywords to flag:** *Talk, send, communicate, signal, message, transmit, control.*
  *   **Verdict:** **KILL.** (Violates the No-Communication Theorem. This is settled physics.)

  **2. The Mechanism Check (The Soft Kill)**
  *   **Question:** Does the sentence claim to know *how* the correlation happens (e.g., an invisible thread, a wave, an instant force)?
  *   **Keywords to flag:** *Because, causes, makes, force, influence, mechanism, link.*
  *   **Verdict:** **FIX.** (Bell proves the correlation exists, not the mechanism. Claiming a mechanism is interpretation.)

  **3. The "Hidden Variable" Check (The Precision Fix)**
  *   **Question:** Does the sentence say Bell ruled out "hidden variables" or "pre-existing properties" without the word **"Local"**?
  *   **Verdict:** **FIX.** (Bell rules out *Local* Hidden Variables. Non-local hidden variables, like Bohmian Mechanics, are still mathematically valid. Dropping "Local" is factually incorrect.)

  **4. The Reality Check (The Interpretation Fix)**
  *   **Question:** Does the sentence state definitively that properties *did* exist before measurement OR definitively that they *did not*?
  *   **Verdict:** **FIX.** (This chooses a side. If you say they *didn't* exist, you are assuming Realism is false. If you say they *did*, you are assuming Locality is false. Bell only proves you can't have *both*. The gallery cannot pick one.)

  ### Decision Matrix
  *   **KEEP:** Passes all four checks. States correlations are stronger than classical physics allows, without specifying mechanism or ontological status.
  *   **FIX:** Triggers Fix conditions (2, 3, or 4). Rewrite to remove the specific claim while keeping the wonder.
  *   **KILL:** Triggers Kill condition (1). The claim is physically impossible.
  *   **ESCALATE:** The sentence is crucial to the narrative spine, passes the checks, but feels "wobbly" (e.g., it uses a metaphor that might break under scrutiny). Send to the physicist.

  ### The "Cheapest Honest Substitute"
  You cannot print "Local Realism" on a wall; visitors will skip it.
  *   **The Substitute:** **"Classical intuition about separate objects."**
  *   **What it means:** The idea that objects have definite properties (Realism) and only affect their immediate surroundings (Locality).
  *   **The Cost:** It is vaguer than the math. It risks visitors thinking "Classical" just means "Newton" rather than "Common Sense." You pay for this with a slight loss of precision to gain readability.
  *   **The Rule:** If you must compress, compress *Realism* into "definite properties" and *Locality* into "instant influence." Never compress them into "magic."

  ---

  ## Part 2: The Docent Branch (Spoken Answers)

  Docents cannot pre-vet every sentence. They need a **Safe Base** and a **Pivot Protocol**.

  **The Safe Base (Memorize this)**
  > "The experiments show a connection that is stronger than anything classical physics allows. But even though the connection is instant, we cannot use it to send a message faster than light."

  **The Pivot Protocol (When pushed)**
  If a visitor asks "But *how*?" or "My brother says..."
  1.  **Validate:** "That is exactly the question physicists are still debating."
  2.  **Separate Fact from Story:** "We know the *math* works and the *experiment* is real. We don't agree on the *story* of what's happening underneath."
  3.  **Close:** "So the honest answer is: We know it happens, we just don't know why."

  **Red Lines for Docents**
  *   Never say "The particles communicate."
  *   Never say "It breaks the speed of light." (Say: "It challenges our idea of distance.")
  *   Never say "The particle didn't exist." (Say: "The property wasn't defined.")

  ---

  ## Part 3: Applying the Procedure to Your Drafts

  Here is the triage run on your three examples. I have applied the checklist strictly based on settled foundations literature.

  ### 1. Marketing's Favorite
  > *"Entangled particles talk to each other faster than light — and now we've proved it."*

  *   **Verdict:** **KILL**
  *   **Diagnosis:** Fails **The Signaling Check**. "Talk" implies information exchange. "Proved it" implies FTL signaling is a settled fact. This violates the No-Communication Theorem. If a physics teacher sees this, the center loses credibility.
  *   **The Cost of Keeping It:** You trade long-term credibility for short-term clickability. It teaches a falsehood that high school physics will explicitly correct.
  *   **Rewrite (45 words):**
      > "Entangled particles share a connection that defies distance. When we measure one, we instantly know the other. We have proved this link is real. But while the connection is instant, no message can travel faster than light."

  ### 2. The Draft Panel Line
  > *"Bell's theorem ruled out hidden variables: the properties were never there before we measured them."*

  *   **Verdict:** **FIX**
  *   **Diagnosis:** Fails **The "Hidden Variable" Check** and **The Reality Check**.
      1.  It omits "Local." (Bohmian mechanics uses non-local hidden variables).
      2.  It asserts properties *never* existed. This asserts Realism is false. Bell allows us to keep Realism if we drop Locality. This panel is presenting Copenhagen-ish interpretation as theorem.
  *   **The Cost of Keeping It:** You alienate visitors who later read about Pilot Wave theory or Many Worlds. You present a specific philosophical solution as the only mathematical one.
  *   **Rewrite (45 words):**
      > "Bell's theorem tested a simple idea: that objects have definite properties and only affect their neighbors. Experiments show nature doesn't follow this rule. Either properties aren't definite until measured, or objects can influence each other instantly. We know classical intuition is wrong; we debate which part."
      *(Note: This is tight. If you need fewer words, cut the last sentence to: "Bell proved our classical intuition about separate objects cannot be right.")*

  ### 3. The Docent's Spoken Answer
  > *"Nothing can carry a message faster than light. But something real does happen across the distance, instantly — we just can't use it to send anything."*

  *   **Verdict:** **FIX** (I know you like this one, but the procedure flags it.)
  *   **Diagnosis:** Fails **The Mechanism Check** and **The Reality Check**.
      1.  "Something real does happen... instantly" asserts **Non-Locality**.
      2.  Bell forces us to give up *Local Realism*. We can give up Locality (your sentence) OR Realism (Copenhagen). Your sentence claims Non-Locality is the fact. It is a valid interpretation, but not a settled theorem.
      3.  However, compared to #1 and #2, this is the closest to "honest." It acknowledges the weirdness without promising signaling.
  *   **How to Make It Survivable:** You must soften the ontological claim ("something real") to a correlational claim ("the results match").
  *   **Rewrite (Spoken Script):**
      > "Nothing can carry a message faster than light. But the measurement results match across any distance instantly. Something about the system connects them in a way classical physics can't explain. We can't use it to send anything, but the link is undeniably there."
      *(Change note: "Something real does happen" $\rightarrow$ "The results match." This moves from ontology to data.)*

  ---

  ## Part 4: The Limits (Where the Procedure Breaks)

  You asked for the spots where this checklist is really a judgment call wearing a procedure's clothes. Here they are. If your team hits these, you **must Escalate** to the physicist.

  **1. The "Influence" vs. "Correlation" Trap**
  *   **The Problem:** The procedure tells you to avoid "influence." But visitors will ask, "Did particle A *change* particle B?"
  *   **The Limit:** A non-expert cannot distinguish between "causal influence" (forbidden) and "non-separable state" (allowed).
  *   **The Rule:** If a sentence requires distinguishing *causality* from *correlation* in fewer than 10 words, Escalate.

  **2. Superdeterminism and Loopholes**
  *   **The Problem:** A visitor (or the "brother who is a physicist") brings up Superdeterminism (the idea that the choice of measurement was pre-destined, saving Local Realism).
  *   **The Limit:** The procedure assumes Bell tests are conclusive. Technically, they close loopholes to a high confidence, not logical certainty.
  *   **The Rule:** If a panel copy implies Bell tests are "100% proof" without qualification, Escalate. (Though for general public, "proved" is usually acceptable marketing speak, strictly speaking it's "confirmed to high statistical significance.")

  **3. The Word "Real"**
  *   **The Problem:** I flagged Example #3 for using the word "Real." But science centers exist to show people "what is real."
  *   **The Limit:** "Real" is a philosophical minefield. Does it mean "observable"? "Ontologically existent"? "Mathematically necessary"?
  *   **The Rule:** If "Real" refers to the *data* (the flash on the screen), it is Safe. If "Real" refers to the *particle's state* before measurement, it is Interpretation. The procedure cannot always catch this nuance in a 5-minute review.

  **4. The "Classical Intuition" Substitute**
  *   **The Problem:** I suggested replacing "Local Realism" with "Classical intuition."
  *   **The Limit:** This is a pedagogical lie. Visitors think "Classical" means "Old." They don't know it means "Local and Real."
  *   **The Rule:** If you use "Classical," you must define it once in the gallery (e.g., "Classical physics assumes objects have definite locations"). If you don't have room for that definition, Escalate the wording.

  ### Final Advice for the Training Weekend
  Tell your docents: **"Bell's Theorem is a fence, not a map."**
  *   The Fence (Settled): You cannot go here (FTL signaling). You cannot go there (Local Realism).
  *   The Map (Interpretation): Where we are standing inside the fence is still debated.
  *   Their job is to show visitors the fence, not pretend they have the map.

  If a docent can say, "We know the fence is there, but physicists are still drawing the map," they are safer than if they try to explain the terrain.
