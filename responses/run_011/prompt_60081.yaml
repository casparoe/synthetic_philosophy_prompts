answer: |-
  This is a classic reconstruction of the "Self-Undermining" or "Arbitrary Future Self" objection to the Unrestricted Reflection Principle (originally pressed by David Christensen and others against van Fraassen). You have correctly identified that Unrestricted Reflection leads to epistemic suicide in the Institute case.

  You asked to price the alternatives and identify the break point. Here is the diagnosis, the cost analysis, and the solution to your specific worries about coherence and evidentialism.

  ### 1. The Break Point: Step (2)

  **Reject Step (2).**
  Step (2) claims: *"(1) is meant to hold for all p, all x and all t, and nothing in it turns on how your future self gets to x."*

  This is the innocent-looking leak. It looked innocent because in **standard cases**, we implicitly assume our future selves are rational agents processing evidence. In standard cases, the "how" is presumed to be *reason-responsive*. The Institute case is a **defeater case**. It provides specific information that severs the link between your future credence and the truth.

  **Why it looked innocent:** The Dutch Book argument for Reflection (the main reason to accept (1)) *appears* to be purely structural. It shows that if your current credence doesn't match your expected future credence, a bookie can pump money out of you. It seems to rely only on the *alignment* of preferences, not the *quality* of the future preferences.

  **Why it is actually false:** The Dutch Book argument *implicitly assumes* that you value your future betting preferences. In the Institute case, you know your future self will value bets on $D$ incorrectly (because they will be brainwashed). You, now, will not buy a ticket that pays out if $D$ is true just because Future-You will sell it. You know Future-You is a bad trader. Therefore, the Dutch Book **does not go through**. The coherence constraint only binds when you regard your future self as an **epistemic peer** (or better) regarding $p$.

  ### 2. Pricing the Alternatives

  You said you'd rather keep (1) than (7). I strongly advise against this, but here is the price list for your reading group.

  | Option | What you keep | What you lose | The Cost |
  | :--- | :--- | :--- | :--- |
  | **A. Unrestricted Reflection** (Keep 1, Reject 7) | The pure coherence constraint. Dutch Book arguments remain simple. | The distinction between reasoning and brainwashing. | **Epistemic Suicide.** If you keep (1), you must admit that manipulating your credence to .95 makes .95 rational. This destroys the normative force of epistemology. It implies rationality is whatever you can causally engineer. |
  | **B. No Reflection** (Reject 1, Keep 7) | The intuition that brainwashing is irrational. | Diachronic coherence. | **Fragmentation.** You lose the ability to explain why we should generally plan based on future beliefs. You lose the Dutch Book justification for conditionalization. You treat your future self as a stranger. |
  | **C. Restricted Reflection** (Modify 1/2, Keep 7) | The core intuition of self-trust + The intuition that brainwashing is bad. | The simplicity of the principle. | **Complexity.** You must add a clause: "Defer to future self *unless* you have a defeater for their rationality." This risks circularity (defining rationality by rationality) but is the standard accepted solution. |

  **Recommendation:** Option C is the only viable path for a reading group on *self-trust*. Option A makes self-trust meaningless (if you trust a brainwasher, you're rational). Option B makes self-trust impossible.

  ### 3. Addressing Your Two Sticking Points

  #### Worry 1: The Sister Substitution and Coherence
  *You wrote: "If the substitution changes the verdict on (3), then (2) is wrong and Reflection was never a coherence constraint... and I lose the diachronic Dutch book argument."*

  **The Fix:** The verdict *should* change, but not because Reflection isn't a coherence constraint. It changes because **trust is conditional**.

  If you are certain your sister is going to the Institute, you should **not** defer to her future credence either. You know she will be evidence-blind. If you did defer to her, *you* would be irrational.
  *   **Coherence preserved:** Reflection is a constraint on *your* credences linking *your* times. It is derived from the idea that you treat your future self as an **expert**.
  *   **The Dutch Book:** The Dutch Book argument works because it assumes you won't see your future self as *misguided*. If you know your future self (or your sister) is being manipulated, the "sure loss" disappears. You won't make the trade now that Future-You will make later, because you know Future-You is evaluating the payoff incorrectly.
  *   **Conclusion:** The substitution doesn't break coherence; it highlights that the *condition of application* for the coherence constraint is **expected rationality**.

  #### Worry 2: Restriction vs. Evidentialism
  *You wrote: "If the fix is to restrict (1) to future credences whose provenence you now endorse, I want to know why that isn't just abandoning Reflection and relabelling it evidentialism."*

  This is the deepest philosophical worry. Here is the distinction:

  *   **Evidentialism:** $C_t(p)$ should match the support $p$ receives from your *evidence at t*.
  *   **Restricted Reflection:** $C_t(p)$ should match $C_t(C_{t'}(p))$ *provided* you expect $C_{t'}$ to be formed rationally.

  **Why they are different:**
  1.  **Processing Power:** There are cases where your evidence is fixed, but your processing power improves. Imagine you have a complex math problem. Your evidence at $t$ is the axioms. You can't solve it. You know at $t'$ you will have solved it.
      *   *Evidentialism:* You should stay at your current credence (based on current evidence).
      *   *Reflection:* You should defer to your future self (who has processed the *same* evidence better).
      *   Restricted Reflection captures this; Evidentialism struggles with it.
  2.  **The Defeater Structure:** Evidentialism looks at the *world-to-mind* direction (Evidence $\to$ Belief). Reflection looks at the *mind-to-mind* direction (Self $\to$ Future Self).
      *   In the Institute case, Evidentialism says "Stay at .1 because the evidence says $D$ is false."
      *   Restricted Reflection says "Stay at .1 because you *distrust* the mechanism producing the .95."
      *   They converge on the verdict, but the **mechanism** is different. Reflection preserves the *authority of the agent*; Evidentialism preserves the *authority of the evidence*. Keeping Reflection allows you to say "I trust myself generally, but not in this specific instance," which is a more nuanced view of agency.

  #### Worry 3: "Bring About" vs. "Defer To"
  *You wrote: "Say precisely what the difference is between a future credence I can bring about and a future credence I must defer to."*

  This is the crux of the Institute case.

  *   **Bring About (Causal):** I can take a pill, go to the Institute, or hypnotize myself to have credence $x$ in $p$. This is a causal claim about my psychology.
  *   **Defer To (Epistemic):** I treat the future credence $x$ as a **signal of truth**. This is a normative claim about justification.

  **The Difference:** The difference is **truth-tracking**.
  *   In the **Math Case**: I will *bring about* a credence of 1 in the solution by calculating. I *defer to* it because I expect the calculation to track truth.
  *   In the **Institute Case**: I will *bring about* a credence of .95 in $D$ by isolation. I do *not defer to* it because I know the process does not track truth (it is evidence-blind).

  **Reflection Principle (Corrected):** "Defer to your future self *insofar as* you expect them to be updating on evidence (or tracking truth) rather than being causally manipulated."

  ### 4. How to Present This in the Reading Group

  To save your argument and make it productive, propose this modification to Step (1):

  **The "Expert" Reflection Principle:**
  > If you are certain your future credence in $p$ will be $x$, **and** you regard your future self as an epistemic expert (or peer) regarding $p$ (i.e., you have no defeaters for their rationality), then you should now have credence $x$ in $p$.

  **Why this saves the project:**
  1.  **It kills the Institute Case:** You know the Institute future-self is *not* an expert (they are evidence-blind). So the principle doesn't apply. You stay at .1. (7) is saved.
  2.  **It keeps the Dutch Book:** The Dutch Book argument only works when you value your future bets. If you know your future self is an "idiot" (regarding $D$), you don't value their bets. The book dissolves. So the justification for Reflection remains intact for non-defeater cases.
  3.  **It handles the Sister:** If you know your sister is going to the Institute, she is not an expert regarding $D$. You don't defer. If she is just going to graduate school, she is an expert. You defer. Coherence is preserved.
  4.  **It avoids Evidentialism:** You are still deferring to a *person* (your future self), not directly to *evidence*. You are saying "I trust my future rationality," not "I see the evidence."

  **Summary for your notes:**
  The argument didn't "run away"; it successfully proved that **Unrestricted Reflection is false**. The exit is to recognize that Self-Trust is not blind; it is a **presumptive trust** that can be overridden by specific defeaters (like knowing you are entering a brainwashing program). This doesn't collapse into evidentialism; it clarifies that diachronic coherence is a norm for *rational agents*, not for *causal systems*.

  **Step to Reject:** Step (2).
  **Reason:** It ignores the "Epistemic Expertise" condition required for the Dutch Book argument to hold.
  **Cost:** You lose the simplicity of the Unrestricted Principle, but you save the concept of Rationality itself.
