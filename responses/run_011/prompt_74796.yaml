      *Wait, one check on "paragraph at most" for the contenders.* "Finally, in a paragraph at most, say how the obvious contenders... do against your list." This implies the rest of the text can be multiple paragraphs, but the evaluation of contenders must be contained in the final single paragraph.

      *Let's write.*

      (Drafting thought process): Start with the context. Move to the requirements. Weave in the status and situation. Discuss the theoretical constraints (anonymity/neutrality). Discuss the impossibility. Discuss weighting. End with the contender evaluation paragraph.

