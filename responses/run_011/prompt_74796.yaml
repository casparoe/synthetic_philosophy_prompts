prompt: |-
  I serve as rapporteur to a nine-member national board that certifies software used in implanted medical devices. Members are appointed in three blocs of three, by the health ministry, the professional engineering body, and a patient advocacy federation; they sit for staggered five-year terms, so roughly a third of the board turns over each cycle, and we meet monthly. The enabling statute frames certification as three findings — that the system meets the published performance specification, that residual risks have been reduced to an acceptable level, and that the manufacturer's post-market surveillance plan is adequate — and provides that certification issues if and only if all three findings are made. Our decisions bind, and they are appealable to an administrative court that reviews whether the board acted on the findings it actually recorded, so we must publish a written justification naming each finding and the reasons supporting it. Two cycles ago we hit a case in which a majority of five accepted each of the three findings while a different majority of five rejected certification, the coalitions not overlapping in the obvious way; the vote on the conclusion and the votes on the findings pointed in opposite directions, and the losing applicant's counsel asked, in writing, which of them was the board's decision. The chair has now asked me to draft a standing decision rule, and I would like the specification before I read another paper on the subject.

  I know the general shape of the literature only from a social choice course a decade ago: there is a theorem to the effect that once the propositions on the agenda are logically connected, no aggregation rule can simultaneously keep the collective set consistent and closed under what the agenda implies, respect unanimity, avoid dictatorship, and treat propositions and voters in some uniform way — the last condition being the one I remember people disputing as a technical convenience rather than a normative demand. I also have a vaguer memory of a result about the long run: that a body can be perfectly coherent meeting by meeting and still, through turnover and through treating earlier decisions as settling later ones, end up holding a pattern of judgments that no individual member ever held and that sits badly with what it decided years earlier. Since our board is exactly that kind of continuing body, with precedential habits and a court reading its reasons, I do not know whether that second worry is a genuinely additional requirement on a rule or just the first requirement applied at several times.

  So: write out what an adequate decision rule for a body like ours has to deliver. Give me the requirements — the phenomena it must handle, the cases it must come out right on, the distinctions it must not collapse, the results it must be consistent with — and attach to each one the concrete situation that makes it a requirement rather than a nice-to-have: the paradoxical vote, the appeal, the member who is asked to record a finding she disbelieves so that the conclusion she wants will follow, the applicant who learns the rule and shops for the framing that suits him, the month when the board must produce an answer and cannot be allowed to hang. For each requirement, say in the same breath whether you take it to be non-negotiable for our purposes, negotiable, or an artifact of how the theorems are stated that a practitioner should feel free to drop; and tell me which of the things people demand here are in fact prejudices of one camp, anonymity and uniform treatment of propositions being my prime suspects. Then identify any subset of the requirements that cannot be jointly satisfied, say precisely where the slack is and what has to give if we keep the court-reviewable written justification, and tell me which single requirement excludes the most candidates. I would also like your view on whether expertise-weighting is a coherent way out, given that our three blocs are appointed for different competences and our counsel thinks differential weights could be defended. Finally, in a paragraph at most, say how the obvious contenders — voting on each finding, voting on the conclusion, some qualified or weighted majority, and any sequential or agenda-driven procedure — do against your list. Please write it as continuous prose, the way you would write a letter or an email: no headings, no bullet points, no bold, no tables, and since I cannot scan a list, let each requirement be introduced and its status marked within its own sentences. No bibliography and no citations; I want the reasoning, not the references.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Rapporteur to a nine-member national board certifying software for implanted medical devices.
      *   **Context:** 9 members, 3 blocs (Health Ministry, Engineering Body, Patient Advocacy), staggered 5-year terms (1/3 turnover per cycle), monthly meetings.
      *   **Statutory Framework:** Certification requires *three* specific findings (Performance, Risk, Surveillance). Certification issues *if and only if* all three findings are made. Decisions are binding and appealable to an administrative court based on written justifications naming findings and reasons.
      *   **Problem:** A "doctrinal paradox" (discursive dilemma) occurred two cycles ago (majority for each finding, different majority against certification). Applicant's counsel challenged the decision's validity. Chair wants a standing decision rule.
      *   **User's Knowledge:** Familiar with social choice theory (impossibility theorems, logical connection of propositions, consistency, unanimity, non-dictatorship, anonymity/neutrality), aware of dynamic inconsistency over time due to turnover/precedent.
      *   **Task:** Write a continuous prose letter/email specifying the requirements for an adequate decision rule.
      *   **Constraints:** No headings, no bullet points, no bold, no tables. Continuous prose. No bibliography/citations. One paragraph max for the evaluation of contenders at the end.
      *   **Specific Content Requirements:**
          *   List requirements with concrete situations justifying them (paradoxical vote, appeal, member conscience, forum shopping, deadline).
          *   Classify each requirement (non-negotiable, negotiable, artifact).
          *   Identify prejudices (anonymity, uniform treatment).
          *   Identify incompatible requirements (where the slack is, what must give).
          *   Identify the single most exclusionary requirement.
          *   Address expertise-weighting.
          *   Evaluate obvious contenders (premise-based, conclusion-based, weighted, sequential) in the final paragraph.

  2.  **Deconstruct the Problem (The Discursive Dilemma):**
      *   The core issue is the *Doctrinal Paradox* (or Discursive Dilemma).
      *   Structure: $P \land Q \land R \to C$.
      *   Scenario: Majority says Yes to P, Yes to Q, Yes to R, but Majority says No to C.
      *   Statute says: Certification ($C$) issues iff Findings ($P, Q, R$) are made.
      *   Court Review: Checks if findings support the conclusion.
      *   Tension: Premise-based procedure (vote on findings, derive conclusion) vs. Conclusion-based procedure (vote on conclusion, ignore findings logic).
      *   Statutory constraint: The law says certification issues *if and only if* the findings are made. This strongly implies a premise-based approach is legally mandated, but the board's voting behavior showed a split.

  3.  **Drafting - Section by Section (incorporating into continuous prose):**

      *   *Opening:* Acknowledge the Chair's request and the gravity of the situation (the paradox case).
      *   *Requirement 1: Statutory Compliance (The "If and Only If" Clause).* The rule must respect the logical structure mandated by law. If the law says $P \land Q \land R \to C$, the voting rule cannot produce $C$ without $P, Q, R$ or vice versa in a way that violates the text.
          *   *Situation:* The appeal court reviewing the written justification.
          *   *Status:* Non-negotiable.
      *   *Requirement 2: Collective Rationality/Consistency.* The set of accepted propositions must be logically consistent.
          *   *Situation:* The paradoxical vote where findings support certification but the vote rejects it.
          *   *Status:* Non-negotiable (due to court review).
      *   *Requirement 3: Integrity of Individual Judgment.* Members shouldn't be forced to vote against their judgment on a premise to achieve a desired outcome.
          *   *Situation:* The member asked to record a finding she disbelieves.
          *   *Status:* Negotiable (sadly, often sacrificed for collective consistency).
      *   *Requirement 4: Stability over Time (Diachronic Consistency).* Decisions shouldn't contradict past precedents to the point of incoherence, especially with turnover.
          *   *Situation:* The long-run worry about holding a pattern no individual ever held.
          *   *Status:* Non-negotiable for credibility, but hard to enforce strictly.
      *   *Requirement 5: Resistance to Strategic Manipulation.* Applicants shouldn't be able to frame issues to game the outcome.
          *   *Situation:* The applicant shopping for framing.
          *   *Status:* Non-negotiable ideally, but practically difficult.
      *   *Requirement 6: Decisiveness.* The board must produce an answer.
          *   *Situation:* The month when an answer is needed.
          *   *Status:* Non-negotiable.
      *   *Anonymity/Neutrality:* The user suspects these are prejudices. In this context, they are. Members represent different constituencies (Ministry, Engineers, Patients). Anonymity (one person, one vote of equal weight) might be an artifact of theory not suited to representative bodies. Neutrality (treating premises and conclusions the same) is impossible given the statutory hierarchy.
      *   *Impossibility:* You cannot have everything. List-Monotonicity, Consistency, and Responsiveness often clash. Specifically, satisfying the statutory logic (Premise-based) while respecting the majority will on the Conclusion (Conclusion-based) is the conflict.
      *   *Most Exclusionary Requirement:* Collective Consistency combined with Statutory Logic (Premise-based) excludes Conclusion-based voting.
      *   *Expertise Weighting:* Is it coherent? Yes, given the blocs. But it complicates the "majority" definition.
      *   *Evaluation of Contenders:* Premise-based fits the law but risks minority tyranny on the conclusion. Conclusion-based fits the vote but violates the law's logic. Weighted helps with bloc representation but invites legal challenge on equality. Sequential helps with time but invites agenda manipulation.

  4.  **Refining the Prose (Iterative Process):**
      *   *Tone:* Professional, advisory, analytical, direct (like an email to a Chair).
      *   *Formatting:* Strictly no bullets/bold/headers. Paragraph breaks are okay for readability, but the prompt says "continuous prose... no headings...". I will use paragraph breaks to separate thoughts but ensure it flows like a letter. *Correction:* The prompt says "write it as continuous prose, the way you would write a letter or an email". Usually, letters have paragraphs. I will use standard paragraphing but avoid list structures.
      *   *Constraint Check:* "In a paragraph at most, say how the obvious contenders... do against your list." This needs to be the final paragraph.
      *   *Constraint Check:* "No bullet points, no bold, no tables."
      *   *Constraint Check:* "Introduce and its status marked within its own sentences."

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   Start by addressing the paradox case.
      *   Define the first requirement: Statutory Fidelity. The rule must map votes to the three findings and the conclusion exactly as the statute dictates. Concrete situation: The administrative court review. Status: Non-negotiable.
      *   Second requirement: Logical Consistency. The board cannot affirm P, Q, R and deny C. Concrete situation: The paradoxical vote from two cycles ago. Status: Non-negotiable.
      *   Third requirement: Decisiveness. We must vote. Concrete situation: The monthly deadline. Status: Non-negotiable.
      *   Fourth requirement: Protection of Individual Conscience. Members shouldn't lie on findings. Concrete situation: The member asked to record a finding she disbelieves. Status: Negotiable (often the casualty).
      *   Fifth requirement: Diachronic Coherence. Precedents must hold despite turnover. Concrete situation: The long-run worry. Status: Non-negotiable for legitimacy.
      *   Sixth requirement: Strategy-Proofness. Concrete situation: Applicant framing. Status: Negotiable (impossible to perfect).
      *   Discuss Anonymity/Neutrality: These are artifacts/prejudices. Our members represent specific interests, so anonymity is less relevant than bloc integrity. Neutrality between premises and conclusion is impossible due to the statute.
      *   Incompatibility: You can't have perfect consistency, unanimity respect, and non-dictatorship simultaneously (List/Pettit theorem). The slack is in the "uniform treatment of propositions." We must drop that.
      *   Most Exclusionary: The requirement that the collective judgment be logically closed (Consistency) given the statutory constraint.
      *   Weighting: It is coherent given the appointment structure, but risks legal challenge on "one person one vote" unless the statute authorizes bloc weighting.
      *   Final Paragraph: Evaluate Premise-based (fits law, risks minority rule on outcome), Conclusion-based (fits majority will, violates law), Weighted (fits blocs, risky legally), Sequential (practical, manipulable).

  6.  **Polishing and Assembling:**
      *   Ensure the flow is natural.
      *   Check the "paragraph at most" constraint for the final evaluation.
      *   Check the "no bold/bullets" constraint strictly.
      *   Ensure the distinction between negotiable/non-negotiable is clear in the text.
      *   Make sure the "concrete situation" is attached to each requirement.

      *(Self-Correction during drafting)*: I need to be careful not to make it look like a list. I must weave the requirements into the narrative. I also need to make sure I explicitly answer the "artifact of how theorems are stated" part regarding anonymity/neutrality.

      *(Refining the "Incompatibility" section)*: I need to be precise. The impossibility theorem (List & Pettit) says you can't have Universal Domain, Collective Rationality, Systematicity (anonymity + neutrality), and Non-Dictatorship. Since we need Collective Rationality (for the court) and Non-Dictatorship (for legitimacy), we must drop Systematicity. This means we treat premises differently from conclusions. This aligns with the statute.

      *(Refining the "Weighting" section)*: The user asked if expertise-weighting is a coherent way out. I should say it addresses the "bloc" nature but doesn't solve the logical paradox itself, only the distribution of power.

      *(Final Paragraph)*: Keep it tight. Premise-based is the only legal fit. Conclusion-based is illegal. Weighted is a political fix, not a logical one. Sequential is procedural, not structural.

  7.  **Final Review against Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold/tables? Yes.
      *   Requirements introduced with status and concrete situation? Yes.
      *   Prejudices identified? Yes.
      *   Incompatibility identified? Yes.
      *   Most exclusionary requirement identified? Yes.
      *   Expertise weighting addressed? Yes.
