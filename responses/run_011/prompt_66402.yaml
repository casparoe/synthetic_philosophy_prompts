answer: |-
  You have identified a structural feature of argumentation that sits at the boundary between history, science, and rhetoric. Your intuition is correct: your teacher's answer ("this is just how refinement works") captures half the truth but misses the critical distinction you have sensed.

  There is an established concept for this, drawn from the philosophy of science. The most precise framework for what you are describing comes from **Imre Lakatos** and his **Methodology of Scientific Research Programmes**.

  Here is the carving you are looking for, the established terms that describe it, and the line that separates legitimate refinement from the structure you have observed.

  ### 1. The Established Concept: The Protective Belt
  Lakatos argued that theories are not tested in isolation. They exist as part of a "Research Programme" consisting of two parts:

  1.  **The Hard Core:** The central, general claim that the proponents refuse to abandon (e.g., "Geography determines civilizational potential," or "Shared fictions enable cooperation").
  2.  **The Protective Belt:** A set of auxiliary hypotheses, initial conditions, and specific claims that surround the core.

  **The Mechanism You Observed:**
  When a prediction fails (an anomaly occurs), the theorist does not touch the *Hard Core*. Instead, they adjust the *Protective Belt*. They introduce a specific, empirical condition ("This valley lacked wheat," "This tribe had insufficient fish") to explain why the general law didn't manifest *in this specific instance*.

  As long as the specific claims are empirically checkable (botany, excavation), the move looks scientific. However, if the *Hard Core* never absorbs the cost of these adjustments—if it remains exactly as broad and confident as it started while the *Protective Belt* grows thicker and more complex to absorb every hit—the Research Programme is undergoing what Lakatos calls a **Degenerating Shift**.

  ### 2. Why Your Teacher Was Half-Right (and Half-Wrong)
  Your teacher is right that **all** theories require auxiliary hypotheses. No general law works without specifying initial conditions. Newton's laws of motion don't predict the path of a leaf unless you also know the wind speed, air resistance, and the leaf's weight. Adding detail *is* part of refinement.

  However, your teacher is wrong about the **direction of the travel**.
  *   **Legitimate Refinement (Progressive Shift):** The specific addition leads to the discovery of *new* facts or predicts *novel* phenomena elsewhere.
  *   **The Structure You Found (Degenerating Shift):** The specific addition is invoked *only* to explain away a past failure. It accommodates the known evidence but predicts nothing new. The general claim remains grand, but it becomes increasingly dependent on a growing list of "except when..." clauses that are only discovered after the fact.

  ### 3. The Line: Novel Prediction vs. Post-Diction
  The boundary between legitimate refinement and the argumentative shape you dislike is **Novel Prediction**.

  **Case A: Legitimate Refinement (The Neptune Example)**
  *   **General Claim:** Newtonian physics governs planetary orbits.
  *   **Anomaly:** Uranus is not moving where the theory says it should.
  *   **Specific Claim:** There is an unseen planet exerting gravitational pull.
  *   **The Test:** This specific claim predicts *where* to look in the sky for the new planet.
  *   **Result:** Neptune is found. The general claim is strengthened; the specific claim proved useful beyond just saving the theory.

  **Case B: The Structure You Observed (The Phrenology Example)**
  *   **General Claim:** The shape of the skull determines personality traits.
  *   **Anomaly:** A man with a large "benevolence bump" acts cruelly.
  *   **Specific Claim:** His "destructiveness bump" is overactive, counteracting the benevolence, or he had a childhood injury.
  *   **The Test:** The specific claim explains the past behavior but predicts nothing new about other people.
  *   **Result:** The general claim remains unchanged, but the theory becomes a patchwork of excuses.

  In the books you read, ask yourself: Did the specific claim (e.g., "lack of domesticable plants") predict the outcome *before* the history was known? Or was the history known, and the specific claim selected to fit it? If the latter, it is a **Post-Diction**, not a prediction.

  ### 4. Related Concepts
  While Lakatos provides the structural framework, two other terms help describe the rhetorical flavor of this move:

  *   **Ad Hoc Rescue:** In logic, this is adding a premise to an argument solely to prevent it from being falsified. The key distinction you noted is that these rescues are *empirical* (checkable against botany), which makes them stronger than arbitrary stipulations, but they remain *ad hoc* if they are not integrated into a broader predictive model.
  *   **Just-So Story:** Coined by Rudyard Kipling and adopted by evolutionary biologists (Gould and Lewontin). This describes a narrative explanation that sounds plausible and fits the facts but cannot be rigorously tested or falsified. Macro-history often risks becoming a "Just-So Story" on a civilizational scale.

  ### 5. A Proposed Term: "Asymmetric Immunization"
  Since you asked for a term if nothing established covers it: while Lakatos covers the *logic*, there isn't a single common phrase for the *rhetorical asymmetry* you noticed (Success = General Force; Failure = Local Shortage).

  I propose calling this **Asymmetric Immunization**.

  **Definition:** An argumentative structure where a general cause is credited for positive instances of a phenomenon, while negative instances are attributed to local, contingent blockers, without the general cause being restricted in scope.

  **Boundary Cases for Asymmetric Immunization:**

  *   **Inside the Boundary (The Problem):**
      *   *Claim:* "Democracy causes peace."
      *   *Case 1:* Two democracies don't fight. *Explanation:* The General Claim (Democracy works).
      *   *Case 2:* Two democracies do fight. *Explanation:* Local Condition (One was a flawed democracy / specific economic pressure).
      *   *Result:* The claim "Democracy causes peace" never shrinks. It is insulated by the "Local Condition" buffer.

  *   **Outside the Boundary (Legitimate Theory):**
      *   *Claim:* "Combustion requires oxygen."
      *   *Case 1:* Fire burns in air. *Explanation:* Oxygen present.
      *   *Case 2:* Fire does not burn in a vacuum. *Explanation:* Oxygen absent.
      *   *Result:* The specific condition (oxygen) is part of the *original* definition of the general claim, not an add-on to save it. The theory specifies the conditions of failure *in advance*.

  ### Summary for Your Study
  You have stumbled upon the **Duhem-Quine Problem** as interpreted by **Lakatos**. You are observing a **Degenerating Research Programme** protected by a **Protective Belt** of empirical but post-hoc auxiliary hypotheses.

  Your dissatisfaction is justified because **explanatory power is being confused with explanatory scope.** The books claim a massive scope (all of human history) but achieve their fit by trading away power (the theory only applies when local conditions allow).

  **How to test this in your reading:**
  When you encounter an exception in these texts, look for the **Novelty Constraint**. Does the specific explanation offered for the exception allow you to predict the outcome of a *different* historical case you haven't read about yet?
  *   If **Yes**: It is legitimate refinement.
  *   If **No**: It is Asymmetric Immunization. The theory is eating the evidence without digesting it.

  You are doing the work of a historian and a philosopher. Do not let the teacher dismiss this; it is the central methodological critique of "Big History."
