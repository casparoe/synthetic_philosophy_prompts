answer: |-
  ### Character List

  Before applying the key, enumerate the separable commitments (characters) that define the logical space. Each character represents a binary or scalar choice regarding the relationship between ruler and governed.

  1.  **Consent:** Is the initial consent of the governed population a necessary condition for legitimate rule?
  2.  **Benefit Distribution:** Must the material benefits of rule accrue primarily to the governed, or is the ruler's gain sufficient justification?
  3.  **Necessity:** Does extreme physical need (e.g., starvation) override constraints on interference in local markets or customs?
  4.  **Comprehensibility:** Must laws be intelligible to the governed in their own linguistic or customary terms to be valid?
  5.  **Restraint:** Is the administration permitted to suppress local criticism to maintain order?
  6.  **Adjudication:** Who possesses the authority to judge when the governed population has achieved the capacity for self-rule?

  ***

  ### Dichotomous Key to Positions on Foreign Rule

  1.  **Annexation of a territory whose ruler has died without an heir recognised by the ruler's own customs.**
      *   1a. Rule is rejected as illegitimate regardless of subsequent welfare improvements. .................................................... **Leaf 1**
      *   1b. Rule is accepted provisionally, provided welfare improves. ............................................................................................ **Go to 2**
      *   *Tag:* Threshold.
      *   *False Positive:* 1b (accepting because welfare improved). *Follow-up:* Would you have rejected it if welfare improved but the population fought the annexation?

  2.  **An irrigation or railway works that raises revenue for the ruler and incomes for the governed.**
      *   2a. Legitimate even if the ruler's revenue exceeds the income gain for the governed. .................................................... **Leaf 2**
      *   2b. Legitimate only if the income gain for the governed exceeds the ruler's revenue. .................................................... **Go to 3**
      *   *Tag:* Scalar. *Cut-point:* Majority material benefit. *Defense:* Distinguishes development from extraction.
      *   *False Positive:* 2b (accepting because governed get *some* income). *Follow-up:* If the ruler takes 90% of the surplus, is it still legitimate?

  3.  **A famine in which the local grain trade has collapsed and a foreign administration commandeers distribution.**
      *   3a. Impermissible; trade must be left free even with starvation risk. .................................................................................... **Leaf 3**
      *   3b. Permissible to save lives despite market violation. ............................................................................................................ **Go to 4**
      *   *Tag:* Threshold.
      *   *False Positive:* 3b (accepting intervention). *Follow-up:* Would you permit this if the famine were caused by the administration's own taxes?

  4.  **A civil code drawn up by foreign jurists in a language most of the governed cannot read.**
      *   4a. Impermissible; laws must be comprehensible and adapted to local custom. ................................................................ **Leaf 4**
      *   4b. Permissible if the code secures rights better than local custom. .................................................................................... **Go to 5**
      *   *Tag:* Threshold.
      *   *False Positive:* 4b (accepting because rights are secured). *Follow-up:* Does comprehensibility matter once rights are secured?

  5.  **Deportation of subjects who criticise the administration.**
      *   5a. Permissible to maintain order for improvement. .................................................................................................................... **Go to 6**
      *   5b. Impermissible; criticism must be tolerated as a check on abuse. .................................................................................... **Leaf 5**
      *   *Tag:* Threshold.
      *   *False Positive:* 5a (permitting deportation). *Follow-up:* Who stops the deportation from becoming permanent?

  6.  **Recruitment to the administration by open competitive examination conducted in the ruler's language.**
      *   6a. The ruler sets the pass mark and decides when locals are ready to take over. ............................................................ **Leaf 6**
      *   6b. An independent body sets the pass mark and verifies readiness. .................................................................................... **Leaf 7**
      *   *Tag:* Threshold.
      *   *False Positive:* 6a (allowing ruler to decide). *Follow-up:* What prevents the ruler from lowering the bar to keep power?

  ***

  ### Leaf Descriptions

  *   **Leaf 1: The Consent Absolutist.** (Mandatory: No competence-based exception). Historical label: Kantian/Rawlsian. Rule requires consent regardless of outcome.
  *   **Leaf 2: The Imperial Realist.** (Mandatory: Power/Achievement Justification). Historical label: Curzonian. Rule is justified by order and ruler's gain; improvement is secondary.
  *   **Leaf 3: The Libertarian Absolutist.** (Unoccupied). View: Consent matters, but non-interference matters more than life. Diagnosis: **Unattractive**. Few hold a view that permits starvation to preserve market liberty in a dependency.
  *   **Leaf 4: The Cultural Relativist.** (Unoccupied). View: Improvement matters, but not at the cost of cultural comprehensibility. Diagnosis: **Unexplored**. Rarely argued that incomprehensible laws are inherently illegitimate if they protect rights.
  *   **Leaf 5: The Fixed Exit Trustee.** (Mandatory: Temporary trusteeship with external verification). Historical label: Mandate System. Restraint comes from local voice forcing exit.
  *   **Leaf 6: The Paternal Trustee.** (Mandatory: Mill's Position). Historical label: Millian. Restraint is internal to the ruler; ruler judges capacity.
  *   **Leaf 7: The Technocratic Trustee.** (Unoccupied). View: Restraint is internal (deportation OK), but exit is judged externally. Diagnosis: **Incoherent**. If critics are deported, the independent body lacks evidence to verify exit.

  ***

  ### Unoccupied Combinations and Diagnostics

  *   **Leaf 3 (Libertarian Absolutist):** Logically consistent but morally unattractive. It accepts annexation (1b) but refuses famine relief (3a). This combination is rarely occupied because the humanitarian impulse usually overrides market liberty in colonial contexts.
  *   **Leaf 4 (Cultural Relativist):** Logically consistent but unstable. It accepts famine relief (3b) but rejects foreign law (4a). This is unexplored because administrations that intervene in markets usually impose codes to secure that intervention.
  *   **Leaf 7 (Technocratic Trustee):** Logically incoherent. It permits deportation of critics (5a) but requires independent verification of exit (6b). Without local criticism, the independent body cannot assess the true capacity or desire of the governed.

  ***

  ### Indistinguishable Leaves and Verdicts

  **Flagged Pair:** The key cannot separate the **"Collective Child"** verdict from the **"Paternal Trustee"** leaf (Leaf 6).
  *   **Diagnosis:** They are the same position in two costumes. The "Collective Child" verdict is simply the descriptive justification for the "Paternal Trustee" structure. Mill explicitly excludes societies incapable of improvement by free discussion, analogous to children.
  *   **Location of Verdicts:**
      *   **"Collective Child":** Lands on **Leaf 6 (Paternal Trustee)**. This is the internal logic of the position.
      *   **"Swallows the Principle":** Lands on **Leaf 6 (Paternal Trustee)** but predicts a drift to **Leaf 2 (Imperial Realist)**. This verdict argues that because the ruler judges their own capacity (6a), they will never declare the society "ready," turning trusteeship into permanent realism. The key identifies this risk in the False Positive of Couplet 6.

  ***

  ### Consistency Audit

  Three common answer patterns found in well-meaning liberals, and the tension each creates.

  | Pattern | Answer Sequence (1b-2b-3b-4b-5a-6a) | Tension Held |
  | :--- | :--- | :--- |
  | **The Benevolent Imperialist** | Accepts Annexation, Benefit, Famine, Code, Deportation, Ruler Judges. | **Trust vs. Power.** You accept the Paternal Trustee (Leaf 6) but must admit you have no mechanism to prevent drift into Realism (Leaf 2) other than the ruler's conscience. |
  | **The Hard Liberal** | Accepts Annexation, Benefit, Famine, Code, No Deportation, Independent Judge. | **Order vs. Voice.** You hold the Fixed Exit position (Leaf 5) but risk instability. If criticism disrupts the improvement required for exit, you may be forced to choose between Leaf 5 and Leaf 2. |
  | **The Reluctant Interventionist** | Accepts Annexation, Benefit, Famine, Rejects Code, Deportation, Ruler Judges. | **Welfare vs. Culture.** You occupy Leaf 4 (Unoccupied). You want to save lives (3b) but refuse to impose law (4a). This is unstable; saving lives usually requires imposing the logistics of law. |
