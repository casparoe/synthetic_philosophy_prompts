answer: |-
  It is completely understandable that you left the seminar feeling frustrated, because that one-liner is the quintessential weaponized intuition against the Everett interpretation, and it is frustrating precisely because it is so versatile. It functions like a philosophical Swiss Army knife, cutting against almost every attempt to recover probability, but usually by shifting what it means by probability mid-swing. Your suspicion is correct that it is not one claim but several bundled together, and if you want to handle your classmate next week, you need to force him to pick which blade he is using. The reason the sentence floats around unchallenged is that it sounds like a trivial truth about determinism while doing the work of a substantive claim about rationality or ontology. To dismantle it, we have to separate the claim that there are no objective chances in a deterministic multiverse from the claim that an agent cannot have subjective uncertainty, and from the claim that branch counting should override amplitude measure. Some of these readings are trivially true but harmless, some are substantive and debatable, and some are false but rely on hidden ontological assumptions that your classmate probably hasn't examined.

  The first thing he could mean is a claim about objective chance, specifically that a deterministic theory cannot harbor genuine propensities or irreducible probabilities. On this reading, the sentence is trivially true. Everettian quantum mechanics is fully deterministic at the level of the universal wavefunction; nothing random ever happens to the wavefunction itself, it just evolves unitarily. If your classmate means that there are no objective chances in Everett, the Everettian will happily agree. The strategy here is to change the subject from objective chance to subjective credence or decision-theoretic weight. The Everettian argues that probability does not need to be a physical propensity to be meaningful; it can be a measure of an agent's uncertainty or a guide for betting behavior. So, if this is all he means, his objection is correct but misses the target, because no serious Everettian is trying to smuggle objective chance back into a deterministic framework. They are trying to show how probability emerges for agents within the framework. The strength of the Everettian response here is very strong because it simply conceding the point and shifting the goalposts to epistemology, which is a legitimate move in philosophy of physics.

  However, your classmate likely intends something stronger when he uses this against the self-locating uncertainty story. Here the claim is about the coherence of uncertainty itself. The argument is that if I know the theory is true and I know the setup, I know that both outcomes will occur and that I will exist on both branches. If I know that outcome A happens and outcome B happens, in what sense can I be uncertain about which will happen? This is the incoherence problem. On this reading, the claim is substantive but controversial. It asserts that knowledge of branching eliminates the space for ignorance. The Everettian response, which your classmate attacked, is that uncertainty is self-locating. I know the global state, but I do not know which copy of me I am. This is analogous to not knowing what time it is or where you are on a map even if you know the whole map. The strength of this response is mixed. It works well for some people, but others find it verbal trickery. The weak spot for the Everettian here is that standard self-locating uncertainty usually involves ignorance about which world is actual, whereas in Everett, all worlds are actual. The Everettian has to argue that the subjective experience of uncertainty is preserved even if the metaphysical ground for it has changed. If your classmate is digging in here, he is claiming that this change in metaphysics destroys the concept of uncertainty entirely. This is a hard objection to defeat completely because it rests on intuitions about what uncertainty requires, but the Everettian can plausibly argue that our operational sense of uncertainty is all that matters for probability.

  When he turns this line against the decision-theory argument, he is making a claim about rational credence and action. The decision-theory program, associated with people like David Deutsch and David Wallace, tries to show that a rational agent in an Everettian universe should bet according to the Born rule. Your classmate's objection here is that if everything happens, the payoff structure is different. If I bet on outcome A, and outcome A happens on one branch and outcome B happens on another, I get the money on one branch and lose it on the other. So why should I care about the weights? Why not just care about the existence of the winning branch? This reading claims that rationality requires caring about all future selves equally, or perhaps that caring about weights is irrational when all outcomes are actual. This is a substantive claim about rationality. The Everettian response is that rationality requires caring about branches in proportion to their measure, just as you care about future times in proportion to their duration or probability in single-world cases. They argue that if you don't care about the weights, you are vulnerable to a Dutch Book or are violating axioms of rationality like diachronic consistency. Here is where you need to flag the trouble for the Everettian. The decision-theoretic derivations are mathematically impressive but philosophically fragile. Critics argue they smuggle in the Born rule via the axioms. For example, the axiom of branching indifference says you shouldn't care about the branching itself, only the rewards. But why? If branching creates more copies, maybe you should care. The Everettian response is strong on paper but relies on accepting specific normative constraints that a skeptic like your classmate is free to reject. If he thinks rationality demands equal concern for all future branches regardless of amplitude, the decision-theory proof doesn't touch him because it assumes what he denies. This is a spot where the Everettian is in worse shape than they admit; they often present the decision-theory result as a derivation, but it looks more like a justification of why certain rational norms are compatible with Everett, not why they are forced upon you.

  Now we get to the reading I suspect your classmate is actually operating with, which is the branch counting objection. This is the claim that if there are two outcomes, there are two branches, and therefore the probability should be fifty-fifty. When he says probability is meaningless, he might mean that the theory predicts equal probabilities for all distinct outcomes, which contradicts the Born rule, so the theory is empirically wrong. On this reading, the claim is false, but it relies on a hidden ontological premise. It assumes that branches are discrete, countable entities like beads on a string. The Everettian response is that the branching structure is not fundamental. Branches emerge from decoherence, and the decomposition of the wavefunction into branches is not unique or discrete. It is continuous and fuzzy. There is no fact of the matter about exactly how many branches there are. You can decompose the wavefunction in infinitely many ways. Therefore, counting branches is ill-defined. You cannot count what has no discrete identity. The only well-defined quantity is the measure given by the amplitude squared. This is the Everettian's best response, and it is technically robust within the formalism of quantum mechanics. However, the strength of this response depends on whether you accept that ontology. If your classmate insists that there must be a definite number of worlds for the theory to make sense, he is presupposing a discrete ontology that Everettians reject. But here is the damaging concession: if branches aren't countable, then the concept of a "world" or a "branch" becomes a convenient fiction for agents, not a fundamental reality. This makes the recovery of probability even more mysterious because now probability is not about counting worlds, nor is it about objective chance, but about a measure over a continuous structure that doesn't cleanly map to our discrete experiences. The Everettian is on shaky ground explaining why our experience is of discrete outcomes if the underlying reality is a continuous smear of amplitude. They say decoherence creates effective discreteness, but the graininess is approximate. If the objection is that probability requires countable alternatives, the Everettian says there are no countable alternatives. If the objection is that probability requires equal weight for existing alternatives, the Everettian says the weights are unequal. The classmate's objection only holds if you force a discrete ontology onto the theory, which nobody in the debate actually accepts as fundamental, but it is a very natural intuition to hold.

  There is a final reading, which is about empirical emptiness. If everything happens, the theory predicts every possible observation sequence somewhere in the multiverse. Therefore, no observation can falsify the theory. If I see a coin land heads a million times in a row, the Everettian says there is a branch where that happens. So what? This reading claims the theory is unscientific. The Everettian response is that the theory predicts that I should expect to find myself on a branch where statistics hold, because the measure of branches where statistics fail is vanishingly small. This is a typicality argument. The strength of this response is moderate. It saves the theory from triviality, but it raises the question of why I should expect to be on a high-measure branch. If low-measure branches exist and contain observers just as real as me, why is my existence on a high-measure branch not a coincidence? The Everettian says it isn't a coincidence because most observers (by measure) are on high-measure branches. But again, this relies on measure counting rather than branch counting. If your classmate thinks existence is binary—you either exist or you don't—then the measure doesn't matter for existence, only for probability. This is where the tension is highest. The Everettian needs measure to do the work of probability, but measure only matters if you accept that some existing copies of you matter more than others, which is a hard pill to swallow.

  So, to answer your question about which reading your classmate needs: he is almost certainly relying on the branch counting intuition, even if he phrases it as "everything happens." He thinks that if outcome A and outcome B both happen, they happen equally. He is treating branches as discrete tokens of existence. To answer him, you don't need to defend the decision-theory or self-locating accounts immediately. You need to attack his ontology. Ask him how many branches there are. If he says two, ask him why the basis is preferred. If he admits the basis is determined by decoherence, ask him if decoherence produces sharp boundaries. Once he admits the branching is fuzzy and continuous, the counting objection collapses because you cannot count a fuzzy continuum. You can only measure it. At that point, you can say that probability is not meaningless, it is just not about counting worlds. It is about the measure of existence, or the weight of the branch. However, you should also warn him, and yourself, that this move comes at a cost. It means accepting that probability in Everett is not about which world is real, but about how much reality a world has. That is a strange metaphysics. The Everettian is in worse shape than they admit on this point because they often talk as if the branches are distinct worlds to make the picture intuitive, but then retreat to continuous measure when pressed on probability. This equivocation is the real vulnerability. If your classmate can force them to stick to one ontology—either discrete worlds or continuous wavefunction—he can show that either probability is wrong (counting) or the worlds aren't real enough to ground probability (measure).

  In summary, the sentence is a chameleon. As a claim about objective chance, it is true but irrelevant. As a claim about uncertainty, it is debatable and hinges on self-location. As a claim about rationality, it challenges the axioms of decision theory. As a claim about counting, it is false but relies on a discrete ontology. As a claim about empirical content, it is a serious challenge regarding typicality. Your classmate is likely mixing the counting objection with the incoherence objection. He thinks that because everything happens, all outcomes are equally real, and therefore equally probable. Your best counter is to separate existence from probability. In Everett, existence is binary, but probability is weighted. The meaning of probability is preserved not by denying that everything happens, but by denying that everything that happens matters equally for the purposes of prediction. Whether that is satisfactory depends on whether you accept that measure can ground probability without counting. That is the hard philosophical work remaining, and it is where the Everettian position is most fragile. You should press him on whether he thinks branches are countable. If he says yes, he is arguing against a strawman. If he says no, he has to explain why probability should follow counting rather than measure. If he says probability is meaningless regardless, he is arguing for skepticism about probability in any deterministic theory, which is a much bigger battle.
