answer: |-
  **PHILOSOPHY OF SCIENCE 401: EXPLANATION AND EVIDENCE**
  **Take-Home Final Examination**

  **Instructions:** Answer both parts of the question below. You may use your notes and course readings. Do not consult external sources or discuss the exam with others. Total word limit for your answers: 2,500 words.

  ***

  **Case Study: The Cragbird Collapse**

  A colonial seabird, the cragbird, nests on eleven cliff colonies on a remote island. Between 2010 and 2019 the counted population fell about 70%. Three explanations were live by 2019.

  **H1 (the vector story):** An undescribed nest parasite arrived with timber shipments and is killing chicks. It was never properly observed — a few specimens recovered from one colony in 2017 were "consistent with" an unknown mite, barcoding inconclusive — but in a 2014 funding application, written before the collapse data existed, the group behind it predicted that colonies nearest the island's freight port would crash first and hardest, and that is exactly what happened: the port-adjacent colony was down 90% by 2016 while the far-north colonies were still stable.

  **H2 (the food-web story):** The collapse tracks the industrial removal of a small pelagic fish from the surrounding bank from 2009. It explains the crash, a doubling in eggshell thinning, a simultaneous decline in a second and unrelated seabird on the same island, and a similar decline on the mainland 400km south where the same fishery operates. Nothing new is posited; on unification and scope it is by far the lovelier story. But it was formulated in 2018, after the pattern was public, with its parameters tuned to fit, and when pressed on why the port colony crashed earliest despite having the lowest measured fishing pressure of any colony, its authors added the auxiliary that those birds forage close in and so felt local depletion first — a 2019 tracking study then showed they forage furthest of all.

  **H3 (the artifact story):** The census protocol changed in 2014, fewer counters and boat surveys replacing cliff-top counts in bad weather, so the real decline is nearer 25%. Cheapest ontology of the three, explains some of the abruptness, but explains neither the eggshells nor the second species, and predicts the drop should look uniform across colonies when the south-to-north gradient is the strongest signal in the data.

  **Epilogue:** In 2021 a group uninvolved in any of that found the toxin. A dinoflagellate bloom, toxin detected in dead chicks at the port colony and two others, and the colony-by-colony timing tracks water temperature rather than shipping or fishing. Nobody had proposed it before 2020.

  ***

  **Questions**

  **(a)** Adopting the epistemic standpoint of a scientist in late 2019, which hypothesis should have been accepted as the working explanation? Justify your choice by weighing the explanatory virtues against the risks of accommodation. Specifically, address the tension between H2's superior scope and the empirical failure of its auxiliary claim, and explain whether H1's novel prediction carries weight beyond the mere chronological fact that it was written down before the data arrived. (15 marks)

  **(b)** Consider the 2021 epilogue. Does the discovery of the toxin discredit the reasoning used in 2019? Discuss whether selecting the "best" explanation from a set that excludes the true hypothesis undermines the method of Inference to the Best Explanation itself, or merely highlights a constraint on hypothesis generation. (15 marks)

  ***

  **MODEL ANSWER**

  In late 2019, the rational choice is H1, despite H2's superior explanatory scope. The decision hinges not on the chronological priority of H1's formulation per se, but on the differential risk of overfitting and the empirical disconfirmation of H2's auxiliaries.

  H2 appears initially stronger on standard explanatory virtues. It unifies the cragbird decline with eggshell thinning, a second species' decline, and mainland data without positing new entities like an unknown parasite. In Lipton's terms, it is the "lovelier" explanation. However, loveliness must be discounted by likelihood. H2 was constructed after the data were public, inviting the suspicion that its parameters were tuned to fit the noise rather than the signal. While accommodation is not logically fatal, it becomes problematic when the hypothesis requires auxiliary assumptions to survive anomalies. H2 required an auxiliary claim about foraging range to explain the port colony's early crash. Crucially, this auxiliary was independently testable and failed: the 2019 tracking study showed birds forage furthest, not closest. This is not merely an aesthetic mark against H2 for being "ad hoc"; it is direct empirical evidence lowering its probability. A hypothesis that requires an auxiliary to fit the data, and then fails that auxiliary test, is effectively falsified in that domain.

  H1, conversely, risks less. Its core claim involves an unobserved parasite, which is ontologically costly compared to H2's known fishery, but its spatial prediction was made novelly in 2014. The philosophical weight of this prediction is not that nature cares when we write things down; Bayesian conditionalization treats the evidence the same regardless of timing. The weight lies in the risk of construction. H1 committed to a specific spatial pattern (port-first) before knowing the data matched it. H2 was flexible enough to accommodate any pattern, provided auxiliaries could be adjusted. The fact that H2's adjustment failed suggests H1's rigid prediction tracked a real structure in the data better than H2's flexible accommodation. H3 is easily dismissed; while ontologically cheap, it fails to explain the eggshells or the gradient, making it explanatorily inadequate regardless of its simplicity.

  Therefore, in 2019, H1 is the most likely true hypothesis available. It survives the specific tests applied to the competing view and made a risky prediction that paid off.

  Part (b) requires distinguishing the validity of the inference rule from the completeness of the hypothesis set. The 2021 discovery shows that the true hypothesis (Toxin) was not among the live options in 2019. Does this discredit the 2019 reasoning? No. Inference to the Best Explanation (IBE) is a comparative method, not an absolute guarantee of truth. It selects the best *available* explanation, not the best *possible* explanation. If the truth is not in the set, IBE cannot select it. This is van Fraassen's "Bad Lot" argument: if all available hypotheses are false, choosing the best of them yields a false belief.

  However, this does not discredit the method itself, provided the method is understood as selecting the most warranted belief given current knowledge, rather than guaranteeing realism. The failure in 2021 highlights a constraint on hypothesis generation, not inference. Scientists are limited by imagination, technology, and background theory; dinoflagellate toxins might not have been technologically detectable or conceptually salient in 2019. A method that weighs evidence cannot be blamed for failing to weigh hypotheses that nobody conceived.

  Furthermore, the 2019 choice of H1 remains rational relative to the 2019 information state. H1 shared structural similarities with the truth (a localized biological agent affecting chicks near the port) that H2 lacked. The fact that H1 was false does not mean the reasoning leading to it was flawed; it means the evidence was incomplete. To discredit IBE based on the Bad Lot objection requires showing that the method systematically selects false hypotheses even when the truth is available, or that we have no reason to believe the truth is ever among our candidates. While we cannot guarantee the truth is in our set, scientific progress suggests our sets improve over time. The 2021 discovery is an extension of the 2019 inquiry, not a refutation of it. The 2019 scientists correctly identified that H2 was empirically compromised and H1 was the most robust available option. That the option was still wrong reflects the fallibility of science, not the invalidity of comparing explanatory power.

  ***

  **MARKING SCHEME (Total: 30 Marks)**

  **1. Assessment of H2's Scope vs. Tuning Risk (5 marks)**
  *   **Must hit:** Acknowledge H2 has better scope/unification but note the risk of overfitting due to post-data formulation.
  *   **Common botch:** Students claim accommodation is logically invalid or ignore the tuning risk entirely.

  **2. Empirical Weight of H2's Auxiliary Failure (5 marks)**
  *   **Must hit:** Identify that the foraging auxiliary was tested and falsified; this is empirical disconfirmation, not just methodological "ad hocness."
  *   **Common botch:** Treating the auxiliary failure as merely making the theory "uglier" rather than lowering its likelihood.

  **3. The Function of Novel Prediction (H1) (5 marks)**
  *   **Must hit:** Explain that the date matters because of *risk* and *flexibility*, not because nature cares about timestamps (Bayesian inertness).
  *   **Common botch:** Asserting prediction is inherently superior without explaining the overfitting argument.

  **4. 2019 Decision Justification (5 marks)**
  *   **Must hit:** Conclude H1 is the rational choice based on the comparative survival of tests, despite H2's loveliness.
  *   **Common botch:** Sitting on the fence or choosing H2 based solely on scope.

  **5. Analysis of the 2021 "Bad Lot" (5 marks)**
  *   **Must hit:** Recognize this as the "Bad Lot" problem; IBE selects the best *available*, not the true.
  *   **Common botch:** Claiming the 2019 scientists were irrational because they were wrong.

  **6. Defense of Method vs. Generation (5 marks)**
  *   **Must hit:** Distinguish between the inference rule (valid) and hypothesis generation (limited); the method isn't discredited by missing options.
  *   **Common botch:** Concluding that IBE is useless because it sometimes picks false hypotheses.

  ***

  **DIFFERENTIATOR (A vs. B)**

  A-grade answers will treat the failure of H2's auxiliary claim as empirical evidence that shifts probability, rather than just a methodological sin. They will also navigate Part (b) without collapsing into skepticism; they will argue that rationality is state-relative. A B-grade answer will correctly identify the virtues and the Bad Lot argument but will treat the prediction/accommodation distinction as a rigid rule rather than a heuristic about risk, and may struggle to defend the 2019 reasoning once the falsity of H1 is revealed. The A answer recognizes that being rational does not guarantee being right.
