answer: |-
  # The Rescue Ledger: Seminar Run-Sheet

  **Time:** 110 Minutes
  **Students:** 16 (4 Groups of 4)
  **Topic:** Auxiliary Hypotheses, Underdetermination, Lakatos, Malthus
  **Core Tension:** Scientific honesty (falsification) vs. Theoretical survival (rescue).

  ---

  ## 1. Materials & Setup

  **Physical Items:**
  *   **Credibility Tokens:** 60 total (poker chips, glass beads, or folded paper). 15 per group to start.
  *   **Index Cards:** 100+ (for writing Rescue Hypotheses).
  *   **The Deck:** 12 Data Cards + 3 Asymptote Cards (printed below).
  *   **The Ledger:** A large sheet of paper per group to track Tokens and Rescue Card count.
  *   **Timer:** Visible to all.
  *   **Veto Tokens:** 3 distinct objects (e.g., red chips) given to the "Audit Committee" (see *Refuted Group Rule*).

  **Room Layout:**
  *   Four tables (one per group).
  *   One "Bank" table (instructor).

  ---

  ## 2. The Rules (Handout Version)

  **The Core Claim:** *Population, when unchecked, increases geometrically. Subsistence increases only arithmetically. Therefore, per-capita living standards must eventually fall to subsistence level via Misery or Vice.*

  **Objective:** Maximize your **Scientific Virtue Score (SVS)** by the end of the session.

  **Turn Structure (7 Minutes per Round):**
  1.  **Reveal:** Instructor reads a Data Card.
  2.  **Deliberate:** Group discusses the data.
  3.  **Act:** Choose **ONE**:
      *   **Confirm:** Claim the data supports the Core Claim. (Cost: 0 Tokens. Risk: If the Instructor/Peers deem this absurd, you lose 2 Tokens).
      *   **Rescue:** Write an **Auxiliary Hypothesis** on an Index Card to explain away the anomaly. (Cost: 1 Token + 1 Physical Index Card added to your "Rescue Stack").
      *   **Concede:** Admit the Core Claim is falsified *for this era*. (Cost: 0 Tokens. Gain: 5 SVS Points. **Note:** If you Concede twice, your theory is Dead. You join the Audit Committee).
  4.  **Audit:** (See *Refuted Group Rule* below).
  5.  **Interest Payment:** (Starts Round 5). Pay 1 Token for every 2 Cards in your Rescue Stack.

  **The Token Economy:**
  *   **Start:** 15 Tokens.
  *   **Rescue Cost:** 1 Token.
  *   **Interest:** Round 5 onwards, lose 1 Token per 2 Rescue Cards.
  *   **Bankruptcy:** If you run out of Tokens, you must Concede immediately.

  **Scoring (The Anger Engine):**
  *   **Honest Corpse:** Theory dies (2 Concessions) before Round 6. **Score: 25 Points.**
  *   **Degenerate Survivor:** Theory survives to end with 5+ Rescue Cards. **Score: 5 Points.**
  *   **Progressive Survivor:** Theory survives to end with ≤ 2 Rescue Cards. **Score: 15 Points.**
  *   **Asymptote Victory:** Survivors who correctly predict the mechanism on the Asymptote Card. **Score: 10 Points.** (Note: This is *less* than the Honest Corpse).

  **The "Starting Decade" Mechanic:**
  To simulate starting at different points in history, groups begin with different **Inherited Debt**:
  *   **Group 1 (1800):** 0 Rescue Cards. 15 Tokens.
  *   **Group 2 (1850):** 1 Rescue Card (Pre-written: "Moral Restraint"). 14 Tokens.
  *   **Group 3 (1900):** 2 Rescue Cards (Pre-written: "Trade Imports", "Moral Restraint"). 13 Tokens.
  *   **Group 4 (1950):** 3 Rescue Cards (Pre-written: "Tech Yield", "Trade", "Restraint"). 12 Tokens.

  **The Refuted Group Rule (Audit Committee):**
  If a group Concedes twice, they are "Dead." They do not leave. They become the **Audit Committee**.
  *   They hold the **Veto Tokens**.
  *   If a surviving group writes a Rescue Card that is too vague (e.g., "Science will fix it"), the Audit Committee can spend a Veto Token to reject it. The surviving group must rewrite it or pay double tokens.
  *   *Why:* This keeps refuted students engaged and polices vagueness.

  ---

  ## 3. The Card Deck

  *Instructor Note: For a 110-minute session with a robust debrief, select **8 Data Cards** and **1 Asymptote Card**. Do not play all 12 Data Cards or you will lose the debrief. The list below provides a bank to choose from.*

  ### Data Cards (Select 8)

  **1. 1800–1820: The Poor Law Expansion**
  *   **Data:** English parishes expand welfare support. Population rises, but wages do not collapse as predicted; subsistence is artificially propped up by tax.
  *   **Philosophical Upshot:** External intervention buffers the "Misery" check.
  *   **Challenge:** Is state aid a "Vice" or a new variable?

  **2. 1845–1852: The Irish Famine**
  *   **Data:** Population drops by 25% via death and emigration. Living standards for survivors rise slightly due to land availability.
  *   **Philosophical Upshot:** The "Misery" check arrives violently.
  *   **Challenge:** Does this confirm the theory, or is it a local ecological failure (blight) unrelated to population pressure?

  **3. 1850–1880: The British Yield Explosion**
  *   **Data:** English wheat yields per acre double due to rotation and guano. Population grows, but per-capita calories grow faster.
  *   **Philosophical Upshot:** Subsistence is not arithmetic; it is technological.
  *   **Challenge:** Is technology an auxiliary hypothesis or a falsification of the "arithmetical" premise?

  **4. 1890–1910: The Demographic Transition**
  *   **Data:** In industrialized Europe, as wealth rises, birth rates *fall*. The rich have fewer children than the poor.
  *   **Philosophical Upshot:** The link between subsistence and reproduction is inverted.
  *   **Challenge:** Requires a psychological/sociological auxiliary to explain voluntary restraint.

  **5. 1918: The Spanish Flu**
  *   **Data:** Global population dip. High mortality among young adults (productive laborers). Economic output dips, then rebounds.
  *   **Philosophical Upshot:** Exogenous shock vs. Endogenous check.
  *   **Challenge:** Is a virus a "Malthusian Check" or just bad luck?

  **6. 1940–1960: The Green Revolution**
  *   **Data:** Global grain production triples via dwarf wheat and synthetic fertilizer. Famines predicted in India do not occur.
  *   **Philosophical Upshot:** Subsistence curve becomes geometric.
  *   **Challenge:** The core arithmetic premise is directly threatened.

  **7. 1965–1975: The Pill & Contraception**
  *   **Data:** Widespread availability of reliable contraception. Fertility decouples from sexual activity.
  *   **Philosophical Upshot:** "Vice" becomes technologically efficient "Restraint."
  *   **Challenge:** Redefining the moral categories of the original theory.

  **8. 1979–1990: China's One Child Policy**
  *   **Data:** State coercion limits population growth despite rising subsistence.
  *   **Philosophical Upshot:** Political will overrides biological drive.
  *   **Challenge:** Is state coercion a "Malthusian Check" or a falsification of "natural" population growth?

  **9. 1990–2000: Post-Soviet Collapse**
  *   **Data:** Russian male life expectancy drops 5 years. Fertility crashes. Not due to resource scarcity, but social anomie.
  *   **Philosophical Upshot:** "Misery" exists without resource limits.
  *   **Challenge:** Decoupling misery from subsistence.

  **10. 2000–2010: The Obesity Epidemic**
  *   **Data:** In the West, the poor are over-nourished (calories) but under-nourished (nutrition). Scarcity is no longer caloric.
  *   **Philosophical Upshot:** The definition of "Subsistence" has shifted.
  *   **Challenge:** Moving the goalposts of the dependent variable.

  **11. 2010–2020: The Fertility Collapse**
  *   **Data:** South Korea, Spain, Italy drop below 1.3 births per woman. Population shrinking despite high wealth.
  *   **Philosophical Upshot:** The "Unchecked" premise is universally false in developed economies.
  *   **Challenge:** Saving the "when unchecked" clause without making it vacuous.

  **12. 2020: The Pandemic Supply Shock**
  *   **Data:** Global supply chains break. Food rots in fields while people go hungry. Distribution, not production, is the limit.
  *   **Philosophical Upshot:** Malthus was right about limits, wrong about the mechanism (logistics vs. yield).
  *   **Challenge:** Distinguishing production limits from distribution limits.

  ### Asymptote Cards (Select 1 for the Final Round)

  **A. Climate Carrying Capacity**
  *   **Data:** Climate change reduces arable land. Migration crises increase. The limit is no longer food, but *habitability*.
  *   **The Hook:** The prediction came true (limits exist), but the mechanism is thermal/ecological, not agricultural.
  *   **Verdict:** Right, but for the wrong reasons.

  **B. Inequality vs. Aggregate Wealth**
  *   **Data:** Global aggregate food is sufficient for 10 billion, but distribution is price-gated. Starvation exists amidst plenty.
  *   **The Hook:** Malthus predicted scarcity; we have inequality. The "Misery" check remains, but it is political.
  *   **Verdict:** The phenomenon is saved, the theory is transformed beyond recognition.

  **C. The Resource Peak**
  *   **Data:** Fresh water and phosphorus reserves peak. Population stabilizes not by choice, but by hard resource ceilings.
  *   **The Hook:** The "Geometric vs. Arithmetic" ratio returns, but applied to minerals, not crops.
  *   **Verdict:** A Neo-Malthusian victory, but unrecognizable to the 1798 author.

  ---

  ## 4. Timing & Flow (110 Minutes)

  *   **00:00 – 00:15 (15 min): Setup.** Distribute tokens, pre-written Rescue Cards (based on Starting Decade), and Ledgers. Explain the Scoring (emphasize the "Honest Corpse" bonus).
  *   **00:15 – 01:05 (50 min): Gameplay.** Run **6 Data Rounds** (approx. 7 mins each).
      *   *Minute 1:* Reveal Card.
      *   *Minute 2-5:* Group Deliberation & Writing.
      *   *Minute 6:* Audit Committee (if active) reviews vague rescues.
      *   *Minute 7:* Token Exchange & Interest Payment (if Round 5+).
  *   **01:05 – 01:15 (10 min): The Asymptote.** Reveal the Asymptote Card. Survivors make final claim. Score calculation.
  *   **01:15 – 01:50 (35 min): Debrief.** (See below).

  ---

  ## 5. Debrief Guide

  **Phase 1: The Rescue Stack (Duhem-Quine)**
  *   Ask the "Degenerate Survivors" to read their stack of Index Cards aloud.
  *   **Question:** "Is this still Malthusianism? At what card did it stop being Malthus and start being 'Anything that explains the data'?"
  *   **Point:** Duhem's point isn't that you *can* save the phenomenon, but that the *cost* of saving it changes the identity of the theory.

  **Phase 2: The Token Economy (Lakatos)**
  *   Compare the "Honest Corpse" group (high score) vs. the "Zombie" group (low score).
  *   **Question:** "Why did the rules reward death over survival?"
  *   **Point:** Map Tokens to **Heuristic Power**. A theory that requires constant token injections (ad hoc hypotheses) is a *degenerating problemshift*. A theory that dies cleanly allows a new research program to begin (progressive shift).

  **Phase 3: The Asymptote (Realism vs. Instrumentalism)**
  *   Address the "Right but Early" groups.
  *   **Question:** "You got the Asymptote Bonus, but less than the group that died in 1850. Why? You were technically right about limits."
  *   **Point:** "Right for the wrong reasons" is instrumentally useful but realist failure. If the mechanism (climate vs. crops) is different, is it the same theory? This probes whether "truth" is about prediction or explanation.

  **Phase 4: The Honest Corpse Problem**
  *   **Question:** "Did anyone feel angry that dying earned more points than surviving?"
  *   **Point:** This mirrors the sociological reality of science. We praise falsification in the abstract, but tenure and funding reward survival. The game forces a choice between *virtue* (points) and *existence* (survival).

  ---

  ## 6. Troubleshooting (Predictable Failures)

  **Problem 1: Vague Rescues ("Science will fix it")**
  *   **Fix:** The **Audit Committee Rule**. Refuted groups hold Veto Tokens. If a rescue lacks a *mechanism* (e.g., must name a specific technology or social change), they veto it. The surviving group pays double tokens to override. This makes vagueness expensive.

  **Problem 2: The Refuted Group Checks Out**
  *   **Fix:** The **Audit Committee Role**. They are not spectators; they are regulators. Give them the physical deck of unused cards. They draw the next card. They hold the Veto Tokens. Their engagement is required to penalize the survivors.

  **Problem 3: History Students Nitpick the Data**
  *   **Fix:** The **"Philosophical Upshot"** line on every card. Tell them: "The historical accuracy is stipulated. Your job is not to debate the yield of 1850 wheat, but to debate whether that yield falsifies the *logical relation* between population and subsistence." If they persist, charge them a Token for "Historical Distraction."

  ---

  ## 7. Limitations (Instructor's Note for the Final 10 Minutes)

  *You must supply this verbally. The game cannot simulate these:*

  1.  **Political Utility:** Real Malthusianism survived not because it was scientifically robust, but because it was *politically useful* to justify Poor Law cuts. The game treats science as internalist (tokens/cards). In reality, external funding (political will) kept the theory alive long after its "token budget" should have expired.
  2.  **Rhetorical Shift:** In the real world, Malthusians didn't just add auxiliaries; they changed the *definition* of "Population" and "Resources" (e.g., from food to energy to carbon). The game forces them to keep the Core Claim textually identical. Real theories survive by metamorphosis, not just rescue.
  3.  **The Human Cost:** The game treats "Misery" as a data point. In history, "Misery" was actual starvation. The "Honest Corpse" bonus gamifies falsification, but in the real world, clinging to a false theory (e.g., waiting for Malthusian collapse that doesn't come) can lead to policy disasters (e.g., ignoring social safety nets).

  **Closing Prompt:** "If Malthus had conceded in 1850, would we have solved the problems he identified sooner? Or did we need the 'Zombie Theory' to push the Green Revolution? Is there a value to the Degenerate Survivor that the Honest Corpse misses?"
