      *   *Sensitivity:* The user mentioned the topic is personal/awkward due to the election. I must ensure the feedback doesn't sound like I'm taking a political side. The feedback must focus on *philosophical rigor* and *theoretical accuracy*, not the political conclusion.
      *   *The Kohlberg Point:* I need to be specific. Haidt views Kohlberg as too rationalist. MFT is about *foundations*, not *stages*. This is crucial.
