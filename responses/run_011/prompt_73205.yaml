          *   9–12 (Descriptive): Describes theory well but partly answers a different question.
          *   <9: Serious inaccuracy/failure.
      *   **Essay Question:** "Moral foundations theory reports a systematic difference between political liberals and political conservatives in which moral concerns they treat as relevant. Does that difference tell us anything about which of the two outlooks is morally correct? Say what would have to be true for the answer to be yes, and what would have to be true for it to be no."
      *   **Input:** The student's essay text.

  2.  **Analyze the Student Essay (Content & Accuracy Check):**
      *   *Paragraph 1 (MFT Basics):* Describes the 5+1 foundations. Compares to taste receptors. *Accuracy:* Generally accurate.
      *   *Paragraph 2 (Kohlberg Connection):* Claims MFT grew out of Kohlberg's stage theory. Claims Haidt added foundations as *further stages beyond justice*, implying a sequence where one passes through justice to broader concerns. *Accuracy:* **Major Error.** Haidt explicitly critiques Kohlberg's rationalist, stage-based approach. MFT is not a stage theory where conservatives are "higher" or liberals are "lower" in development. It's about *pluralism* vs. *narrowness*, not developmental stages. This is a fundamental misunderstanding of the theoretical lineage.
      *   *Paragraph 3 (Empirical Findings):* Liberals weight Care/Fairness; Conservatives spread evenly. Mentions the "accuracy study" (predicting others). *Accuracy:* Accurate description of the standard MFT findings.
      *   *Paragraph 4 (Is/Ought & Naturalistic Fallacy):* Argues descriptive theory doesn't prove correctness. Mentions Social Intuitionist Model (SIM). *Accuracy:* Good point. SIM is relevant.
      *   *Paragraph 5 (Taste Analogy):* Extends the taste analogy. Missing receptors $\neq$ error. *Accuracy:* Reasonable philosophical extension.
      *   *Paragraph 6 (The "Yes" Case):* Argues broader matrix = wider view of social reality = evidence of correctness. Incompleteness counts against a view. *Accuracy:* This engages the normative question. It's a plausible argument *if* one accepts the premise that moral truth correlates with breadth of intuition.
      *   *Paragraph 7 (Conclusion):* Descriptive asymmetry is evidence, not proof. Defeasible reason to prefer broader palette. *Accuracy:* Synthesizes the argument.

