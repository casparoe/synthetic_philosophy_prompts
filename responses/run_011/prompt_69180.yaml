      *   *Verdict:* The user's instinct is mostly correct (bounded memory problem), *but* the residue is the **normative status of the belief**. In RL, the belief is a tool for calculation. In DT, the belief is a normative constraint on rationality (you *ought* to believe consistent with your policy).
