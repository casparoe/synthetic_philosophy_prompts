              *   Need strict inequality for all columns L, C, R.
              *   vs L: $5(1-p) > 2 \Rightarrow 1-p > 0.4 \Rightarrow p < 0.6$.
              *   vs C: $5p > 2 \Rightarrow p > 0.4$.
              *   vs R: $5(1-p) > 2 \Rightarrow p < 0.6$.
