answer: |-
  Elias capped the marker and set it on the ledge. The seminar room was silent, the hum of the ventilation the only sound competing with the traffic outside. On the whiteboard, the syllogism remained stark: Here is a hand; here is another hand; therefore, external objects exist. Sarah sat in the front row, her notes closed, watching him.

  "We agree on the logic," Elias said, turning to face her. "Valid inference. Premises distinct from conclusion. Conclusion true. And we agree Moore was right that you can know something without proving it."

  "And yet," Sarah replied, "you insist this proof is useless for the doubter."

  "Not useless," Elias corrected. "Structurally limited. It fails to transmit warrant. To be warranted in believing here is a hand, you need a prior entitlement to assume your faculties are reliable. The sceptic withholding that entitlement blocks the flow. The proof is merely a reminder of what you were already entitled to assume."

  Sarah stood and walked to the board. "That makes warrant too fragile. An experience as of a hand confers immediate justification. No prior entitlement needed. The warrant transmits through the valid inference. Moore proves the conclusion in the ordinary sense. That it doesn't move a sceptic is a dialectical fact, not an epistemic defect."

  "You're smuggling in the conclusion," Elias said. "If your warrant for the premise depends on the conclusion being true, you are begging the question."

  "Disambiguate," Sarah said sharply. "Do you mean the warrant for the premise epistemically depends on the conclusion? Or that the argument presupposes what it establishes? Or merely that it is dialectically improper to use against a doubter?"

  "I mean epistemic dependence," Elias said. "If you need to assume the external world exists to trust your eyes, you cannot use your eyes to prove the external world exists."

  "That is exactly what I deny," Sarah said. "The experience itself provides the warrant. But let's press the cost of your view. You rely on entitlements resting on no evidence. How is that anything other than arbitrary? And if it is non-evidential, how is it ever lost? If I suspect I am dreaming, do I lose the entitlement? If so, how do I regain it without evidence?"

  Elias leaned against the desk. "It is not arbitrary because it is a precondition of rational evaluation. You cannot question everything at once. To doubt specific perceptions, you must hold others fixed. That is the hinge. You lose the entitlement if specific defeaters arise—say, you know you took a hallucinogen. You regain it when the defeater is neutralized, not by proving the hinge, but by returning to the default status of trust."

  "And my cost?" Sarah countered. "You say I license bootstrapping. If I look at my hand, I know I have a hand. If I know I have a hand, I know my vision is reliable. I iterate this and know my vision is reliable solely by looking. That seems absurd."

  "It is absurd," Elias said. "You turn perception into a self-validating oracle."

  "It is not absurd if you distinguish warrant generation from dialectical persuasion," Sarah argued. "I gain warrant immediately. I can deduce reliability. But I cannot use that deduction to convince someone who doubts my reliability. That is not a failure of warrant; it is a limit of argument. I give up the claim that this proof silences the sceptic. You must give up the claim that entitlement is evidence-free guessing."

  "Evidence-free, yes. Guessing, no," Elias said. "It is a rule of the game."

  "Then let us test the rules," Sarah said. "Consider a case we haven't discussed. Before a lecture, a trustworthy announcer tells the audience that some of them have been given a drug. It produces vivid visual and tactile experiences of objects in near space. These episodes are indistinguishable from veridical perception. No one knows who is dosed or when. A member of the audience looks down and has an experience as of her own two hands. Answer these: One, does she have warrant for the belief that here are two hands? Two, may she reason from that belief to the conclusion that the drug is not presently affecting her? Three, would the answer to one differ if the announcement had come only after she formed the belief?"

  Elias crossed his arms. "In the announcement-before scenario, the entitlement is undermined. The possibility of the drug is salient and specific. She lacks the hinge entitlement to trust her faculties. So, one: no warrant. Two: she cannot reason to the conclusion because she lacks the premise's warrant. Three: if the announcement comes after, the warrant existed at the time of experience. The defeater was not active then."

  Sarah nodded slowly. "I disagree on one. The experience confers immediate prima facie warrant regardless of the announcement. The announcement is a defeater, but it defeats the warrant, it does not prevent its generation. So, one: yes, she has warrant, though it is defeated overall. Two: yes, she may reason from the belief. The warrant transmits. If she knows she has hands, she knows she is not hallucinating hands. The fact that she cannot convince the announcer is irrelevant to whether she knows. Three: if the announcement is after, the warrant was undefeated at the time. She knew."

  "We diverge on the first point," Elias said. "For me, the condition for warrant is the entitlement. No entitlement, no warrant. For you, warrant is generated by experience, then potentially cancelled."

  "Precisely," Sarah said. "My structural commitment is that experience is a source of warrant independent of antecedent conditions. Yours is that warrant is conditional on the absence of undermining possibilities."

  "But this brings us to Moore's admissions," Elias said, turning back to the board. "Moore admitted he could not prove his premises. I claim this supports my view. If he could have proved the premises, he wouldn't need entitlement. The fact that he cannot proves the need for hinges."

  Sarah shook her head. "I claim that admission supports me. He says knowledge does not require proof. Therefore, he does not need to prove the premises to have warrant for them. Immediate warrant suffices. You resist this by insisting that without proof, there is no warrant transmission."

  "I resist it because 'knowledge without proof' does not mean 'warrant without conditions'," Elias said. "It means 'warrant without argument'. But the conditions for that warrant include the hinges."

  "And you resist my use of the second admission," Sarah said. "When Moore says knowledge doesn't require proof, you treat that as a concession about dialectics, not epistemology."

  "Because it is," Elias said. "It explains why Moore knows, not why his proof works."

  "Then we are at an impasse on the structure," Sarah said. "But look at the drug case again. If I am right, the subject has warrant even with the announcement, though defeated. If you are right, she has nothing. This means for you, the sceptical possibility destroys the foundation. For me, it merely adds weight to the other side of the scale."

  "And that is why my view is safer," Elias said. "Yours allows her to claim she knows she isn't dosed based on the very experience the drug mimics. That is the bootstrapping worry again."

  "It is not bootstrapping if the warrant is immediate," Sarah insisted. "But I concede this: she cannot use that knowledge to assure the announcer. I give up the dialectical utility. You must concede that your entitlement is not a matter of evidence, or it collapses into my view."

  "I concede it is not evidence," Elias said. "It is a status. But that status is fragile."

  They stood in silence for a moment, looking at the syllogism. Elias picked up the eraser but stopped. He looked at Sarah.

  "We need to record this," he said. "Two sentences. One we both sign. One we cannot."

  Sarah nodded. "The first must state what the proof cannot do."

  "It cannot compel assent from someone who withholding the entitlement to trust perception," Elias said.

  "Or," Sarah amended, "It cannot compel assent from someone who doubts the conclusion without begging the question dialectically."

  "Agreed," Elias said. He wrote on the board: *This proof cannot rationally compel assent from a subject who withholds entitlement to the reliability of their perceptual faculties.*

  "Now the disagreement," Sarah said. "The single claim on which we turn."

  Elias thought. "It concerns the source of warrant."

  "Write this," Sarah said. "Conservative: Perceptual warrant requires antecedent entitlement to the falsity of sceptical hypotheses. Liberal: Perceptual experience provides immediate warrant independent of such entitlement."

  Elias wrote it below the first sentence. He stepped back. The whiteboard held the summary of their stalemate, the logic of the proof still visible above their words.

  "That will have to suffice for today," Elias said.

  "It suffices," Sarah replied, gathering her papers. "Until the next seminar."
