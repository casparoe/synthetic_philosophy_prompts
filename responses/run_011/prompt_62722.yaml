      *   *Why it looked harmless:* Because once concrete is poured, it's hard to change (Step 2/3). The student conflated "hard to change *after* construction" with "impossible to influence *before* construction."
      *   *What is lost:* If you cut 7, you lose the "Hard Determinism" (Technology rules us). You keep "Soft Determinism" or "Social Construction of Technology" (Technology reflects us and influences us, but we can steer it).
      *   *Having vs. Determining:* This is the core conceptual fix.

  5.  **Drafting the Response:**
      *   **Tone:** Respectful, academic but accessible (Year 13 level), encouraging (they've done a good job spotting the unease).
      *   **Identify the Break:** It's the move from **Step 6 to Step 7**.
      *   **The Equivocation:** The concept of "The Design Stage." In 1-6, it's treated as a moment of technical creation. In 7, it's treated as a zone immune to politics. But the design stage is *itself* a political arena (regulations, budgets, public inquiry).
      *   **Why it looked harmless:** Because of the "Lock-in" effect (Step 2). Once built, it's hard to change. The student slid from "hard to reverse" to "impossible to prevent."
      *   **What is lost:** You lose the revolutionary claim that voting is useless. You gain a more nuanced claim: Voting matters *most* at the stage of setting design constraints.
      *   **Having vs. Determining:** This is the Winner vs. Ellul distinction. Winner says artifacts *embody* politics (have). The student's argument concludes artifacts *supersede* politics (determine).
      *   **Repair:** Modify Step 7 to acknowledge that the design stage is accessible to politics, just *differently* than legislation.

  6.  **Refining the "Proves Too Much" explanation:**
      *   If the argument holds, it proves democracy is an illusion. Since democracy is not an illusion (we can ban certain technologies, regulate others), the argument proves too much.
