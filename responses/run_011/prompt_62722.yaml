      *   *The Equivocation:* "Political system." In 1-3, the "political system" is the legislative process (passing laws). In 7-9, the "political system" is treated as powerless against material reality. But the political system *controls* the design stage (zoning laws, building codes, public funding).
      *   *Alternative Diagnosis:* The shift from "Artifacts *have* politics" (Winner's thesis) to "Artifacts *replace* politics" (Technological Determinism).
