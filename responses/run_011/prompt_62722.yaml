answer: |-
  This is a sophisticated piece of reasoning for Year 13. You have correctly identified that the conclusion (9) is untenable, even if the premises (1–6) feel robust. Your supervisor's comment "proves too much" is code for: *Your logic is valid, but it leads to a conclusion that we know is false (that democracy is a sham), which means one of your premises must be hiding a false assumption.*

  Here is the breakdown of where the argument breaks, why it hid from you, and how to fix it without making your EPQ trivial.

  ### 1. The Cut: Step 7
  You should cut **Step 7** as it stands.

  > *7. And since the distribution gets fixed at the design-and-build stage, and that stage isn't an election, the political system can only ever ratify the shape afterwards.*

  This is the step that "proves too much." It asserts that the "design-and-build stage" exists *outside* the political system. It claims that because the design stage "isn't an election," the political system (voting, laws, accountability) cannot touch it.

  **The Slip (The Equivocation):**
  The word doing two different jobs here is **"Fixed."**
  *   **In Step 2/3:** "Fixed" means *physically durable* (once the concrete is poured, it is hard to move). This is true.
  *   **In Step 7:** "Fixed" implies *politically sealed* (the decisions leading to the pour were immune to political intervention). This is false.

  The design stage is not a vacuum. It is governed by zoning laws, building codes, public funding approvals, environmental impact assessments, and community consultations. All of these are "political system" activities. Step 7 smuggles in the assumption that *engineering decisions are apolitical events*, which contradicts your own Step 1 (that artifacts settle political questions).

  **Why it looked harmless:**
  It looked harmless because of the **Time Lag**. By the time the public sees the bridge (Step 2), the design is indeed "fixed." You are conflating *retrospective immutability* (we can't change it now) with *prospective immunity* (we couldn't have stopped it then). Because you are analyzing the bridge *after* it is built, the political battles that happened *before* it was built (the zoning meetings, the budget votes) are invisible.

  ### 2. Having Politics vs. Determining Politics
  You asked if there is a real difference between artifacts *having* politics and *determining* politics. **Yes, this is the crux of your EPQ.**

  *   **Artifacts *Having* Politics (Steps 1–6):** This is Langdon Winner's actual argument. It means artifacts *embody* power relations. A bridge can be a law without words. This is a claim about *ontology* (what the object is).
  *   **Artifacts *Determining* Politics (Steps 8–9):** This is **Technological Determinism**. It means artifacts *control* human agency. It claims the object dictates the social outcome regardless of human will.

  Your argument slides from the first to the second between Step 6 and Step 7.
  *   **Step 6** says: "Politics is in the distribution." (Having)
  *   **Step 7** says: "The political system can only ratify." (Determining)

  If you keep the "Having" claim but cut the "Determining" claim, you avoid the "proves too much" error. You can argue that technology is *loaded* with politics without arguing that it *overrides* democracy.

  ### 3. What You Lose (and Gain) by Cutting Step 7
  If you cut Step 7, you lose the dramatic, revolutionary conclusion that "voting is a sideshow." You cannot claim that technology makes democracy irrelevant.

  **Have you just described people being political?**
  You worried that if you restrict the argument, you're just saying "people use concrete as a tool." That is a risk, but you can avoid it by refining **Step 5**.

  Currently, Step 5 says: *"Loads of things do both of those without anyone having planned it."*
  This is where you open the door to the "vacuous" objection (if unintended consequences count as politics, everything is politics).

  **The Repair:**
  Restrict Step 5 to **institutional habits**, not just accidents.
  *   *Bad:* "The width of a door." (Could just be a manufacturing standard).
  *   *Good:* "Building codes that mandate door widths." (This is a political choice encoded in technical standards).

  **Revised Step 7 (The Repair):**
  > *7*. But the design-and-build stage is not outside politics; it is simply a different *arena* of politics, one where experts and regulators hold more sway than voters.

  **The Cost:**
  The argument becomes less exciting. You are no longer saying "Technology rules us." You are saying "Technology is where power hides."
  *   **Old Conclusion:** Voting is useless; smash the machines.
  *   **New Conclusion:** Voting is insufficient; we must politicize the design phase (regulations, standards, public inquiry).

  This is actually a stronger EPQ position because it allows for a solution. If the problem is "voting is a sideshow," the only solution is revolution. If the problem is "design is opaque," the solution is transparency and regulation.

  ### 4. Why Step 5 is also dangerous (The "Vacuous" Trap)
  You mentioned you didn't want the "if everything is political, nothing is" objection. I agree that's a lazy objection *if* you define politics well. However, Step 5 invites it by including "without anyone having planned it."

  If a tree falls and blocks a road, is that politics? By your Step 5 definition ("sorts people into better-off and worse-off groups"), yes. But that stretches "politics" until it snaps.

  **Fix:** Change Step 5 from "without anyone having planned it" to "without it being explicitly debated as a law."
  *   *Reason:* A door width isn't political because it sorts people; it's political because a *committee* decided that width, and that committee wasn't elected. That keeps the focus on **power**, not just **outcome**.

  ### Summary of Advice for your Redraft

  1.  **Keep Steps 1–4:** They are solid Winner-esque arguments.
  2.  **Modify Step 5:** Remove "without anyone having planned it." Replace with "without being subjected to the same scrutiny as legislation." This avoids the vacuity trap.
  3.  **Cut Step 7:** It is factually false (design is regulated).
  4.  **Replace Step 7:** Argue that the design stage is a *shadow* political arena, not an *immune* one.
  5.  **Scrap Step 8 & 9:** They are the "proves too much" conclusions.
  6.  **New Conclusion:** Technology is not neutral, but it is not destiny. The danger isn't that voting doesn't matter; the danger is that we vote on laws but ignore the technical standards that enforce them.

  **Why this satisfies your supervisor:**
  "Proves too much" means you claimed technology *replaces* power. By changing it to technology *conceals* power, you keep the critical edge (technology is not neutral) without making the absurd claim (democracy is dead). You move from **Technological Determinism** (which is generally rejected in social science) to **Social Construction of Technology** (which is a robust, defensible academic position).

  You haven't lost the argument; you've just made it precise enough to be true.
