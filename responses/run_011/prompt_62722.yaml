      *   The core issue is the shift from *some* artifacts having political *effects* (1-3) to *all* (or most) artifacts *determining* political reality (8-9).
      *   **The Slip:** It happens between **Step 5 and Step 6**, but the fatal logical leap is actually **Step 7**.
      *   *Wait, let's look closer.* Step 5 says "Loads of things do both of those without anyone having planned it." Step 6 says "So they carry political arrangements too."
