prompt: |-
  I lead a small infrastructure team at a mid-sized B2B software company, and over the past year I have been keeping an informal log of every decision where we followed what everyone else was doing instead of investigating the question ourselves. I have no formal training in epistemology or economics; I have read the standard introductory accounts of informational cascades — the ones where each agent receives a private signal, observes the actions of everyone who moved before them, and then acts, so that beyond some point the public history outweighs any individual's private evidence — but what I actually care about is the less tidy question of when copying the crowd counts as a genuine inference and when it is an abdication dressed up as one. I want to build this into a one-page checklist for our design review template, which means I need something statable rather than something merely true. Below are my own verdicts on a set of concrete cases. Please treat those verdicts as data to be explained, not as errors to be corrected, at least until you have a candidate principle on the table; only then tell me which of them it cannot accommodate.

  The cases, in the order I wrote them down.

  1. We adopted Postgres for a new service without anyone on the team benchmarking alternatives or reading a line of its source. Nearly every company in our ecosystem uses it. Verdict: rational. My private information about databases is weak, and thousands of comparable teams have already revealed theirs.

  2. During a 2 a.m. incident, three on-call engineers before me each marked the same paging alert as a flapping sensor and cleared it. I did the same without opening the dashboard. It was not a flapping sensor, and we lost four hours. Verdict: not rational. This is the one that bothers me, because informationally it looks exactly like case 1 — three predecessors, each with a private read on the situation, all pointing the same way.

  3. A conference had roughly forty exhibitors selling observability tooling. From that I inferred the category was real and had real budgets attached to it, and I was right. I did not infer that any particular one of the forty products was good. Verdict: rational at the first level, would have been irrational at the second.

  4. Everyone in our engineering org cites the same third-party benchmark post in support of a performance claim. I refuse to credit it, because when I traced four separate internal threads that looked like independent agreement, all four led back to that single post. Verdict: my refusal was rational. This is where my rule of thumb comes from, and it is the rule I most want tested: count one vote per independent source of evidence, not one vote per person expressing a view — so if the first three adopters were all reading from the same artifact, they are one vote and not three.

  5. In hiring I filter heavily on referrals from people whose judgment I respect. Verdict: rational in general, but I am uneasy here, because my referrers all came from the same two companies and roughly the same handful of schools.

  6. I copied the syntax and idioms of the most widely used language in our stack without evaluating alternatives, purely so that new hires could read our code on day one. Verdict: rational — though I suspect that in calling it rational I am smuggling in something that is not an epistemic reason at all.

  7. The case I keep going back and forth on. Our organization migrated its systems work to Rust over eighteen months; I supported it, wrote the migration plan, and argued for it in review. I never ran a single load test. What I had was three staff engineers I rate highly saying it was the right call, plus a general sense that the broader industry was drifting that way. I alternate between thinking this was clearly rational, because deferring to people who know more than you is what a reasonable person does, and thinking I was simply vote four in a chain of four.

  My tentative principle is the one from case 4: one vote per independent source. Does it deliver all seven verdicts, or only most of them? In particular, does it separate case 1 from case 2, or do I have to bolt on extra terms to get that separation — the cost of checking for yourself, the reversibility of the decision, the asymmetry between the two kinds of error, whether the predecessors knew they were being watched and therefore had reason to be careful, whether the question is about what to believe or about what convention to join? If those terms have to be in there, tell me honestly whether the result is still one principle about evidence or two principles stapled together, and which of the two is doing more work. I would also like the principle's verdict on cases I have not listed: specifically, one where the crowd turns out to be right but no member of it could state why, and one where I hold a strong private signal that contradicts a large and genuinely independent public consensus. And if the honest answer is that some of my verdicts have to go, argue for dropping them rather than merely asserting it — I can be persuaded on 6 and 7, but I want to hold onto 2 unless you can show me it was case 1 wearing a disguise all along.

  I am not asking for references or a reading list, and I would not be able to chase them if you gave me one; I want the analysis itself, in plain language. If there is established terminology for the distinctions you end up relying on, name it and define it in a sentence, but do not assume I will recognize it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Lead of a small infrastructure team at a mid-sized B2B software company. Practical, experienced, skeptical of academic fluff, wants actionable tools (a one-page checklist).
      *   **Problem:** Distinguishing between *rational herding* (genuine inference from others' actions) and *irrational cascades* (abdication of responsibility).
      *   **Input:** Seven specific cases with the user's own verdicts on whether the decision was "rational."
      *   **Constraint:** Treat the verdicts as data to be explained, not corrected (initially).
      *   **Goal:** Test the user's tentative principle ("one vote per independent source") against the seven cases. Determine if it needs extra terms (cost, reversibility, etc.). Assess if it remains one principle or becomes two. Provide verdicts on two new hypothetical cases.
      *   **Tone:** Plain language, analytical, honest, no reading lists.
      *   **Specific Challenge:** Case 2 (the incident) is the anchor. The user wants to hold onto the verdict that Case 2 was *not* rational, even though it looks like Case 1 (Postgres adoption).

  2.  **Deconstruct the User's Tentative Principle:**
      *   *Principle:* "Count one vote per independent source of evidence, not one vote per person expressing a view."
      *   *Strength:* Explains Case 4 (single blog post cited multiple times) perfectly. Explains Case 3 (40 exhibitors = market validation, not product validation).
      *   *Weakness:* Does it distinguish Case 1 (Postgres) from Case 2 (Incident)?
          *   Case 1: Thousands of teams. Are they independent? Mostly yes. Different contexts, different failures, different CTOs.
          *   Case 2: Three on-call engineers. Are they independent? They are looking at the *same* dashboard, the *same* alert, in the *same* incident context. Their "private signals" are highly correlated, possibly identical.
      *   *Verdict:* The independence principle *almost* works, but "independence" needs to be defined carefully regarding *signal correlation*.

  3.  **Analyze the Seven Cases against the Principle:**

      *   **Case 1 (Postgres):** High independence. Thousands of teams, different contexts. Low cost of being wrong (Postgres is safe). *Verdict: Rational.* Principle holds.
      *   **Case 2 (Incident):** Low independence. Three engineers looking at the same noisy data in a high-stress environment. They likely made the same heuristic error. *Verdict: Not Rational.* Principle holds *if* we define independence as "uncorrelated error modes."
      *   **Case 3 (Conference):** Market size (40 exhibitors) is independent evidence of *demand*. Product quality is not. *Verdict: Rational (Level 1), Irrational (Level 2).* Principle holds (source of evidence differs).
      *   **Case 4 (Benchmark):** One source, multiple citations. *Verdict: Rational to refuse.* Principle holds perfectly.
      *   **Case 5 (Hiring):** Referrals. Independence is low (same schools/companies). *Verdict: Rational but uneasy.* Principle flags the lack of independence, explaining the unease.
      *   **Case 6 (Language Syntax):** This is a *coordination* problem, not a *truth* problem. *Verdict: Rational.* Principle struggles here because "truth" isn't the goal; compatibility is.
      *   **Case 7 (Rust Migration):** Expert testimony + industry trend. *Verdict: Ambivalent.* Principle says: Are the staff engineers independent? Did they do their own work? If they just read the same blogs, it's a cascade. If they tested it, it's inference.

  4.  **Identify the Missing Variables (The "Bolt-ons"):**
      *   The user asks: Do I need to bolt on cost, reversibility, asymmetry, etc.?
      *   *Observation:* Case 1 vs. Case 2 is the crux.
      *   *Case 1:* Error cost is low (Postgres is fine). Reversibility is medium.
      *   *Case 2:* Error cost is high (4 hours downtime). Reversibility is low (time lost).
      *   *Epistemic vs. Pragmatic:* Case 6 is pragmatic (convention). Cases 1, 2, 4, 7 are epistemic (what is true/best).
      *   *Conclusion:* The "One Vote" principle is necessary but not sufficient. It needs a "Stakes/Context" modifier.
      *   *Is it two principles?* It's one principle (Evidence Aggregation) applied under different *loss functions*. In engineering, "rationality" includes cost-benefit analysis, not just Bayesian updating. So it's one framework: **Expected Value of Information.**

  5.  **Drafting the Principle:**
      *   Need to refine "Independence." It's not just "different people." It's "uncorrelated error."
      *   Need to address the "Convention vs. Truth" split (Case 6).
      *   Need to address the "Stakes" (Case 2).

  6.  **Addressing the New Hypothetical Cases:**
      *   *Case A: Crowd right, no one knows why.* (e.g., market price, or a heuristic that works). This is *ecological rationality*. It counts as evidence, but fragile.
      *   *Case B: Strong private signal vs. Consensus.* (e.g., you see the fire, everyone says it's smoke). Private signal usually wins if trust in own senses > trust in crowd's independence.

  7.  **Refining the Verdict on Case 2 (The Anchor):**
      *   Why is Case 2 different from Case 1?
      *   In Case 1, the "signal" is "Did Postgres work for you?" The noise is uncorrelated.
      *   In Case 2, the "signal" is "Does this alert look like a flap?" The noise is *highly correlated* (same dashboard, same alert type, same fatigue).
      *   Therefore, Case 2 is *not* three votes. It is effectively one vote repeated three times.
      *   *Wait, user says:* "Informationally it looks exactly like case 1."
      *   *Counter:* It looks like it superficially (Person A acted, Person B acted...). But the *source of truth* is the dashboard. If the dashboard is ambiguous, and the heuristic is common, the errors are correlated.
      *   *Key Distinction:* **Correlated vs. Uncorrelated Error.**
      *   *Also:* **Cost of Verification.** In Case 1, verifying (benchmarking) is expensive. In Case 2, verifying (opening dashboard) is cheap (seconds).
      *   *Rationality Definition:* Rationality = Maximizing Expected Utility.
      *   Case 1: Cost of check > Benefit of check (Postgres is safe enough).
      *   Case 2: Cost of check < Benefit of check (4 hours downtime is huge).
      *   So, the principle needs to incorporate **Cost of Verification vs. Cost of Error.**

  8.  **Synthesizing the Checklist Principle:**
      *   It cannot be *just* "one vote per independent source." That handles the *weight* of the evidence.
      *   It needs to handle the *threshold* for action.
      *   Proposed Principle: **Weighted Independence + Cost of Error.**
      *   Actually, let's look at the "Two Principles" question.
      *   Principle 1: Epistemic (What is true?). Count independent sources.
      *   Principle 2: Pragmatic (What should we do?). Weigh cost of being wrong vs. cost of checking.
      *   Case 6 (Syntax) is purely Pragmatic.
      *   Case 2 (Incident) fails on Epistemic (correlated signals) AND Pragmatic (high cost of error, low cost of check).
      *   Case 1 (Postgres) passes Epistemic (uncorrelated) AND Pragmatic (low cost of error, high cost of check).
      *   So, is it one principle? It's **Decision Theory.** But for a checklist, we need to split it into "Evidence Quality" and "Decision Stakes."

  9.  **Developing the Response:**
      *   **Acknowledge the tension:** Case 1 vs. Case 2 is the hard part.
      *   **Diagnose the "Independence" flaw:** In Case 2, the engineers aren't independent sensors; they are repeating the same measurement error.
      *   **Introduce the "Cost of Check" variable:** This is crucial for Case 1 vs. Case 2.
      *   **Address Case 6:** Admit this is a different category (Coordination vs. Truth).
      *   **Address Case 7:** This is delegation. Rational if the delegates are independent investigators.
      *   **The Two New Cases:**
          *   Crowd right/unknown why: "Skin in the game" heuristic. Valid but fragile.
          *   Private vs. Public: Private wins if high confidence + public might be correlated.
      *   **The Checklist:** Draft the actual one-pager content based on the analysis.
      *   **Honesty Check:** The user asked to be told if verdicts must go.
          *   I can save Case 2 by emphasizing *correlated error* and *cost of verification*.
          *   Case 6 is the outlier. It's not epistemic. I need to tell the user that Case 6 is rational for a *different reason* than Case 1.
          *   Case 7 is rational *only if* the staff engineers did independent work. If they just chatted, it's a cascade.

  10. **Refining the "One Principle vs. Two" question:**
      *   It is one principle: **Expected Value of Information (EVI).**
      *   EVI = (Probability of changing decision) * (Value of better decision) - (Cost of investigation).
      *   Case 1: Low Value of better decision (Postgres is fine). High Cost of investigation. EVI is negative. Don't check.
      *   Case 2: High Value of better decision (Save 4 hours). Low Cost of investigation (Look at dashboard). EVI is positive. Check.
      *   The "One Vote" rule is a heuristic for estimating the "Probability of changing decision."
      *   So, the "One Vote" rule is a sub-component of the broader rationality check.
      *   *Decision:* Tell the user it is one principle (EVI), but for a checklist, it splits into "Evidence Independence" and "Stakes/Cost."

  11. **Final Polish:**
      *   Ensure plain language.
      *   Define terms like "Correlated Error."
      *   Make sure the checklist is actionable.
      *   Respect the constraint: "Treat verdicts as data."

      *(Self-Correction during drafting)*: I need to be careful not to just say "Case 2 had correlated errors." The user said "Informationally it looks exactly like case 1." I need to explain *why* it only looks like it superficially. In Case 1, the "signal" is long-term survival of a technology. In Case 2, the "signal" is a momentary interpretation of a specific graph. The *noise* in Case 2 is shared (dashboard ambiguity, fatigue). The *noise* in Case 1 is idiosyncratic (specific workload, specific team).

      *(Refining Case 6)*: User suspects they are smuggling in non-epistemic reasons. I should confirm this. It's a coordination norm, not a truth claim.

      *(Refining Case 7)*: This is the "Delegation" case. It's rational if the chain of delegation ends in evidence. If the staff engineers also just guessed, it's a cascade.

      *(Final Plan)*:
      1. Validate the "One Vote" principle but refine "Independence."
      2. Introduce "Cost of Verification" to separate Case 1 and 2.
      3. Classify Case 6 as Coordination, not Epistemology.
      4. Provide the Checklist.
      5. Answer the hypothetical cases.
      6. Address the "One vs. Two Principles" question honestly.

      *Wait, one constraint:* "Only then tell me which of them it cannot accommodate."
      Okay, I need to build the principle first, then test it, then reveal the cracks.

      *Revised Plan:*
      1. Analyze the cases using the "Independent Source" principle + "Cost of Error/Check".
      2. Show how this saves Case 2 (Correlated Error + High Stakes/Low Check Cost).
      3. Show how this handles Case 6 (Different category).
      4. Present the refined principle.
      5. Answer the hypothetical cases.
      6. Verdict on "One vs Two Principles."

      *Wait, looking closer at Case 2:* The user says "Informationally it looks exactly like case 1."
      My job is to show it *doesn't*.
      Case 1: 1000 teams. Contexts vary. Errors vary.
      Case 2: 3 engineers. Context identical. Errors correlated.
      This is the key. "Independence" isn't about *people*, it's about *error structures*.

      *Let's write.*
answer: |-
  Here is the analysis of your seven cases, the stress-test of your principle, and the resulting checklist.

  ### 1. Testing the Principle: "One Vote Per Independent Source"

  Your tentative principle is strong, but as it stands, it is incomplete. It explains Case 4 perfectly, but it cannot separate Case 1 (Postgres) from Case 2 (Incident) without a definition of "independence" that goes beyond "different people."

  To make the principle work, we must refine **Independence** to mean **Uncorrelated Error**.

  *   **Case 1 (Postgres):** Thousands of teams use Postgres. They have different workloads, different data shapes, and different operational mistakes. If Postgres were fundamentally flawed for general use, we would see failures across these diverse contexts. The fact that they all succeed suggests the "signal" (Postgres is good) is robust against their *uncorrelated* noise. **Verdict: Principle holds.**
  *   **Case 2 (Incident):** Three engineers looked at the *same* dashboard, during the *same* incident, under the *same* stress, using the *same* alerting rules. Their "private signals" were not private; they were copies of the same ambiguous data. Their errors are **correlated**. If the dashboard is misleading, all three will be misled in the exact same way. Counting them as three votes is double-counting the same piece of evidence. **Verdict: Principle holds, provided independence means uncorrelated error.**
  *   **Case 3 (Conference):** You correctly identified that 40 exhibitors prove *market demand* (independent budget decisions), not *product quality* (which would require independent performance tests). **Verdict: Principle holds.**
  *   **Case 4 (Benchmark):** You identified that multiple citations of one post are a single source. **Verdict: Principle holds.**
  *   **Case 5 (Hiring):** Your unease is the principle working. Referrals from the same two schools/companies share a cultural bias. They are less independent than referrals from ten different ecosystems. It is rational, but the "vote weight" is lower than it feels. **Verdict: Principle holds.**
  *   **Case 6 (Syntax):** This case breaks the principle, but not because the principle is wrong. It breaks because this is not an epistemic question (what is true?) but a **coordination question** (what allows us to work together?). The "truth" of the syntax does not matter; the *convergence* matters. **Verdict: Principle does not apply (different category).**
  *   **Case 7 (Rust):** This depends on your staff engineers. If they formed their opinions independently (one read the docs, one ran a benchmark, one migrated a side project), they are three independent votes. If they all read the same blog posts and discussed it in the same Slack channel, they are one vote. **Verdict: Principle holds conditionally.**

  ### 2. Separating Case 1 from Case 2

  You asked if you need to bolt on extra terms to separate Case 1 from Case 2. The answer is **yes**. "Independence" explains why the evidence was weak in Case 2, but it does not explain why acting on it was *irrational*.

  In Case 1, even if the evidence was weak, the cost of being wrong was low (Postgres is unlikely to be catastrophic). In Case 2, the cost of being wrong was high (4 hours downtime), and the cost of checking was low (opening a dashboard).

  To capture this, your principle needs a second dimension: **The Cost of Verification vs. The Cost of Error.**

  *   **Case 1:** Verification cost (benchmarking) is high. Error cost (Postgres failing) is low. **Rational to defer.**
  *   **Case 2:** Verification cost (looking at dashboard) is low. Error cost (ignoring real alert) is high. **Irrational to defer.**

  ### 3. One Principle or Two?

  You asked if this is one principle about evidence or two stapled together.

  It is **one principle of Decision Theory** (specifically, *Expected Value of Information*), but it requires two distinct checks to apply it practically.

  1.  **Epistemic Check:** How much weight does the crowd's behavior carry? (Your "Independent Source" rule).
  2.  **Pragmatic Check:** Is it worth my time to verify? (Cost of Check vs. Cost of Error).

  Case 6 (Syntax) is a third category: **Coordination.** Here, the "rational" move is always to copy the crowd, regardless of evidence, because the value is in the copying itself.

  If you want a one-page checklist, you cannot simply write "Maximize Expected Utility." You need to encode these three distinct modes.

  ### 4. The Two Unlisted Cases

  You asked for verdicts on two scenarios not in your list.

  **Case A: The crowd is right, but no member can state why.**
  *   *Example:* A heuristic works, or a market price is accurate despite traders not knowing the fundamental value.
  *   *Verdict:* **Rational to follow, but fragile.** This is "Ecological Rationality." The crowd is aggregating hidden information. You can treat the outcome as evidence, but you cannot treat the *reasoning* as evidence. If the environment changes, the heuristic may break without warning.
  *   *Checklist implication:* Accept the decision, but flag it for review if conditions shift.

  **Case B: Strong private signal contradicts a large, independent consensus.**
  *   *Example:* You see smoke (private signal), but everyone else says the building is safe (public consensus).
  *   *Verdict:* **Trust the private signal.** In information cascade theory, once a cascade starts, public history outweighs private signals. *However*, this assumes the private signal is of similar quality to the signals the crowd received. If your private signal is direct observation (smoke) and theirs is inference (no alarm), your signal is higher fidelity.
  *   *Checklist implication:* If your private evidence is direct/first-order and the public consensus is indirect/second-order, break the cascade.

  ### 5. Which Verdicts Must Go?

  You asked me to argue for dropping verdicts if necessary.

  *   **Case 6 (Syntax):** You suspected you were smuggling in non-epistemic reasons. You were. You must categorize this differently. It is not "rational inference"; it is "rational coordination." If you treat it as inference, you will confuse your team about *why* standards exist.
  *   **Case 7 (Rust):** You cannot hold this verdict as "clearly rational" without auditing the staff engineers. If they were in a cascade themselves, you were vote four in a chain of four. You must downgrade this from "Rational" to "Rational *if* their inputs were independent."

  Case 2 (Incident) can be saved, but only if you accept that **correlated error** means the three engineers were effectively one person.

  ### 6. The Checklist Design

  Here is the draft for your design review template. It incorporates the "Independent Source" rule, the "Cost of Error" modifier, and the "Coordination" exception.

  ***

  #### **Decision Review: Herding vs. Inference Checklist**

  **1. Classify the Decision Type**
  *   [ ] **Truth Claim:** (e.g., Is this database fast enough?) → *Proceed to Q2.*
  *   [ ] **Coordination:** (e.g., What syntax/style do we use?) → *Stop. Copy the standard. Rationality = Conformity.*
  *   [ ] **Delegation:** (e.g., Are we trusting an expert team?) → *Proceed to Q3.*

  **2. Count Independent Votes (For Truth Claims)**
  *   [ ] **Source Check:** Do the people agreeing with this decision rely on the *same* data, blog post, or benchmark?
      *   *If Yes:* Count as **1 Vote**.
      *   *If No:* Count as **N Votes**.
  *   [ ] **Error Correlation:** Do these people share the same blind spots? (e.g., Same dashboard, same vendor, same school).
      *   *If Yes:* Discount the vote weight.
      *   *If No:* Full vote weight.

  **3. The Verification Test (For Truth Claims)**
  *   [ ] **Cost of Being Wrong:** If the crowd is wrong, what is the impact? (Low / Medium / High)
  *   [ ] **Cost of Checking:** How hard is it for *me* to verify the primary evidence? (Low / Medium / High)
  *   [ ] **Verdict:**
      *   *High Impact + Low Check Cost:* **Verify Personally.** (Do not herd).
      *   *Low Impact + High Check Cost:* **Defer to Crowd.** (Herd rationally).
      *   *High Impact + High Check Cost:* **Require Independent Pilot.** (Do not rely on external consensus alone).

  **4. The Private Signal Override**
  *   [ ] Do I have direct, first-order evidence (logs, metrics, observation) that contradicts the consensus?
      *   *If Yes:* **Trust Private Signal.** (The crowd is likely in a cascade).
      *   *If No:* **Trust Consensus** (provided Q2 & Q3 pass).

  ***

  ### Summary of Analysis

  1.  **Your Principle:** "One vote per independent source" is the correct core, but "independence" must be defined as **uncorrelated error**, not just distinct people.
  2.  **Case 1 vs. Case 2:** Separated by **Error Correlation** (Case 2 engineers share the same blind spot) and **Cost of Verification** (Case 2 was cheap to check).
  3.  **One or Two Principles:** It is one decision-theoretic framework, but for a checklist, it splits into **Evidence Weighting** and **Risk/Cost Assessment**.
  4.  **Verdicts to Adjust:** Case 6 is coordination, not inference. Case 7 is conditional on the independence of the staff engineers.
  5.  **New Cases:** Crowd wisdom without reasoning is valid but fragile. Strong private signals override weak public consensus.

  This framework allows you to keep your verdict on Case 2 without contradicting Case 1, provided you acknowledge that in Case 2, you weren't ignoring three witnesses; you were ignoring one witness who spoke three times, during a fire, when you had a phone in your hand.
