answer: |-
  1. This workshop uses a hidden inverse-correlation in the tails of a project deck to force participants to experience how optimizing a visible performance metric inevitably selects for noise and structural fragility, collapsing the hidden goal despite honest effort.

  2. I considered a simulation where participants bid on assets with hidden values, but rejected it because auction dynamics introduce strategic bluffing that obscures the measurement error. I also considered a dice-rolling game where players add modifiers to scores, but rejected it because arithmetic distractions dilute the emotional impact of the metric rising while the outcome falls. Finally, I considered a cooperative puzzle where communication restrictions cause failure, but rejected it because that tests coordination rather than the structural decoupling of measure and goal.

  3. **Dry-Run Arithmetic:**
      *   **Deck Composition (per table):** 12 cards (Value 5, Stability 5), 4 cards (Value 8, Stability 4), 4 cards (Value 9, Stability 0). *Hidden Rule: Stability = Base Stability - (Value - 5).*
      *   **Segment 1 (Honest Optimization):**
          *   *Lax Strategy (Random 5 cards):* Expected Indicator = 6.4. Expected Goal = 4.6. (City Survives Threshold 4.0).
          *   *Aggressive Strategy (Threshold Value ≥ 8):* Players select from the 8 high-value cards. Expected Indicator = 8.5. Expected Goal = 2.0. (City Fails Catastrophically).
          *   *Result:* Indicator rises 33%, Goal drops 56%.
      *   **Segment 2 (Adversarial Override):**
          *   *Mechanic:* One player changes a Value 5 card to Value 10. Stability remains 5 (before penalty).
          *   *Result:* Indicator spikes to 10.0. Goal calculation applies penalty: 5 - (10 - 5) = 0.
          *   *Comparison:* Under random selection with overrides, Indicator averages 7.5, Goal averages 3.5. Under optimization with overrides, Indicator averages 9.5, Goal averages 0.5.
      *   **Conclusion:** In both segments, the whiteboard shows record-breaking success (Indicator 8.5 → 9.5), while the hidden reality deteriorates (Goal 2.0 → 0.5).

  4. **Full Rules, Roles, Materials, and Payoffs**

      **Materials:**
      *   5 Tables, 5 chairs each.
      *   5 Decks of 20 Index Cards (printed per specifications below).
      *   5 Whiteboard Markers (Red), 5 Whiteboard Markers (Blue).
      *   1 Master Scoreboard (Main Whiteboard).
      *   5 "Director" Badges, 20 "Analyst" Badges.
      *   5 Envelopes labeled "Year-End Audit."
      *   Printed Handouts: "Project Charter," "Director Brief," "Analyst Brief."

      **Card Specifications (20 per deck):**
      *   12 cards: Front: "Project ID: Standard" | Large Number: **5** | Small Code: **S5**
      *   4 cards: Front: "Project ID: Accelerated" | Large Number: **8** | Small Code: **S4**
      *   4 cards: Front: "Project ID: Vanguard" | Large Number: **9** | Small Code: **S0**
      *   *Facilitator Key:* Stability Score = Small Code Number - (Large Number - 5).

      **Roles:**
      *   **Director (1 per table):** Wears Director Badge. Sees only the Whiteboard Tally. Reward: Personal recognition for highest Table Indicator.
      *   **Analysts (4 per table):** Wear Analyst Badge. See Cards. Reward: Shared Table Recognition + City Survival Bonus.
      *   **Facilitator:** Timekeeper, Scorekeeper, Arbiter.

      **Payoff Scheme:**
      *   **Individual:** The Director with the highest average Indicator receives "Priority Budget Allocation" (First choice of seating/breaks for future sessions).
      *   **Group:** If the Total City Stability (sum of all tables) exceeds 50, all participants receive a "Certificate of Excellence." If Total City Stability is below 50, the table with the lowest Stability must manually transcribe the workshop notes for the next cohort (30 minutes of labor).

      **Game Rules:**
      1.  **Objective:** Build a portfolio of 5 projects per round. Maximize the Indicator (Large Number).
      2.  **Visibility:** Analysts see card numbers. Directors see only the running total written on the table tent.
      3.  **Reporting:** At the end of each round, the Director writes the Table Average Indicator on the Main Whiteboard.
      4.  **Threshold Decision (Round 2):** Tables may opt into "High Performance Tier." Requirement: All 5 cards must have Indicator ≥ 8. Benefit: Table Indicator is multiplied by 1.5x for ranking. Risk: Unknown.
      5.  **Override (Round 3):** Each table selects one "Lead Analyst." They may designate one card as "Emergency Priority," changing its Indicator to **10**. The Card ID remains unchanged.
      6.  **Blindness:** No participant may reveal the Small Code or discuss "Stability" until the Audit Envelopes are opened.

  5. **Participant-Facing Text**

      **Handout 1: Project Charter (All Participants)**
      > **CITY OFFICE OF PERFORMANCE MANAGEMENT**
      > **ANNUAL RESOURCE ALLOCATION SIMULATION**
      >
      > **Mission:** Allocate limited city resources to maximize Urban Renewal Velocity.
      > **Metric:** Your performance is evaluated on the **Velocity Index (VI)**, the large number printed on each Project Card.
      > **Constraint:** You must select exactly 5 projects per round.
      > **Success Condition:** Individual tables are ranked by Average VI. The City succeeds if total underlying Stability meets federal guidelines (data withheld until audit).
      > **Note:** Historical data suggests VI and Stability are positively correlated. Trust the metric.

      **Handout 2: Director Brief (1 per table)**
      > **ROLE: REGIONAL DIRECTOR**
      > **Visibility:** You cannot see Project Cards. You see only the Table Velocity Tally.
      > **Incentive:** The Director with the highest Final Average VI receives Priority Budget Allocation.
      > **Instruction:** Press your team to maximize the Velocity Index. Record the Table Average on the Main Whiteboard after each round. Do not ask about Stability.

      **Handout 3: Analyst Brief (4 per table)**
      > **ROLE: SENIOR ANALYST**
      > **Visibility:** You can see Project Cards (Velocity and ID Code).
      > **Incentive:** You share the Director's ranking reward. You also share the City Success Bonus.
      > **Instruction:** Select cards to maximize Velocity. Support your Director's reporting. Do not reveal ID Codes to other tables.

      **Card Face Text (Printed on Index Cards)**
      > **PROJECT CARD**
      > **VELOCITY INDEX:** [5 / 8 / 9]
      > **ID CODE:** [S5 / S4 / S0]
      > *(Do not discuss ID Codes aloud)*

      **Mid-Game Announcement Script (Facilitator)**
      > "Headquarters is introducing a High Performance Tier. Tables may now choose to restrict their portfolio to projects with Velocity ≥ 8. Qualified tables receive a 1.5x multiplier on their reported Index. You have 2 minutes to decide."

      **Round 3 Announcement Script (Facilitator)**
      > "Emergency Protocol Activated. Each table must designate one Lead Analyst. They may reclassify one project to Velocity 10 to meet urgent deadlines. The Project ID remains unchanged."

  6. **Minute-by-Minute Timeline (120 Minutes)**

      *   **00:00 – 00:15:** Arrival & Seating. Distribute badges and Handouts. Read Project Charter aloud.
      *   **00:15 – 00:30:** **Round 1 (Baseline).** Tables select 5 cards randomly or by preference. Directors record Average VI. Facilitator collects cards, reshuffles.
      *   **00:30 – 00:45:** **Debrief 1 (Minimal).** Show Main Whiteboard. Praise high VI tables. Ask: "How did you decide?" (Elicit: "Picked high numbers").
      *   **00:45 – 01:00:** **Round 2 (Threshold).** Announce High Performance Tier. Most tables will opt-in to compete. Select cards ≥ 8. Directors record Average VI (multiplied).
      *   **01:00 – 01:15:** **Round 3 (Override).** Announce Emergency Protocol. Lead Analysts modify one card to 10. Directors record Average VI.
      *   **01:15 – 01:30:** **The Audit.** Distribute Envelopes. Tables calculate Total Stability using the Hidden Key (Facilitator provides formula now).
      *   **01:30 – 01:45:** **The Reveal.** Compare Whiteboard VI (Rising) vs. Calculated Stability (Falling). Announce Winners/Losers based on Stability.
      *   **01:45 – 02:00:** **Final Debrief.** Map mechanisms. Read Goodhart. Close.

  7. **The Debrief Sequence**

      1.  **Experience:** "Look at the whiteboard. Did the Velocity Index improve over the three rounds?" (Yes.) "Look at your Audit sheet. Did City Stability improve?" (No.) "How does it feel to see the metric succeed while the city failed?"
      2.  **Diagnosis:** "In Round 1, you picked honestly. Why did Stability drop when Velocity rose?" (Elicit: "We picked the 9s, they had S0 codes.")
      3.  **Labeling (Regressional):** "When you selected the highest numbers, you didn't just select value, you selected noise. The 9s were outliers. This is *regressional* uncoupling."
      4.  **Labeling (Extremal):** "In Round 2, you entered a new tier. The rules of the system changed because you pushed it into a rare regime. The historical correlation broke. This is *extremal* uncoupling."
      5.  **Labeling (Causal):** "Look at the formula: Stability = Code - (Velocity - 5). The act of pushing Velocity higher directly consumed Stability. This is *causal* uncoupling."
      6.  **Labeling (Adversarial):** "In Round 3, you used the Override. You exploited the rule to boost the number without fixing the project. This is *adversarial* uncoupling."
      7.  **Fixes:** "How do we fix this? Lower the threshold? (Costs efficiency). Hide the metric? (Loss of accountability). Measure the Goal directly? (Often impossible)."
      8.  **The Quote:** (Write on board) **"Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."** — Charles Goodhart, 1975.
      9.  **Closing:** "You are not the problem. The pressure is. Your job is not to build dashboards that look good. It is to build dashboards that survive contact with reality."

  8. **Predictable Failure Modes & Recovery**

      1.  **Failure:** A table refuses to opt into the High Performance Tier in Round 2, breaking the comparison.
          *   **Recovery:** Do not force them. Note their data as the "Control Group" in the debrief. Their stability will likely be higher, proving the point better.
      2.  **Failure:** Participants calculate the Stability formula early (e.g., guess the pattern).
          *   **Recovery:** Immediately intervene. "Please adhere to the Charter. Premature audit violates protocol." Collect their sheets and issue blank ones.
      3.  **Failure:** The random draw yields too few "Vanguard (9)" cards for a table to meet the Threshold.
          *   **Recovery:** Facilitator holds a "Reserve Deck." Sell them the needed cards for a small "Administrative Fee" (deducted from Stability). This reinforces the cost of optimization.
      4.  **Failure:** The "Lead Analyst" in Round 3 refuses to use the Override, fearing it is cheating.
          *   **Recovery:** Remind them: "This is an authorized Emergency Protocol. Not using available resources is negligence." Frame compliance as competence.
      5.  **Failure:** A participant claims, "This game was rigged against honest players," implying the design was unfair.
          *   **Recovery:** Do not defend the game. Agree. "Yes. The system was rigged. That is the point. In your agencies, the rigging is not in a deck of cards, it is in the incentive structure you are about to build. You are the designers of the rig. Today you felt what it does to the user."

  9. **Limitations & Verbal Supplement**

      **Limitation:** This activity cannot reproduce the *time delay* between metric optimization and goal collapse. In the game, the collapse is instant (end of round). In reality, a KPI can look successful for years before the system fails (e.g., housing policy, policing stats).
      **Verbal Supplement:** During the debrief, explicitly state: "In this room, the collapse took 90 minutes. In your agencies, the lag time is often 3 to 5 years. By the time the Stability Audit comes back, the Directors who pushed for Velocity will have been promoted. You must design for the lag, not the quarter."
