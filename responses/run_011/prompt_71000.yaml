answer: |-
  ### The Spec: Desiderata for a One-Off Probability Estimate

  **Preliminary Verdict: The Impossible Trinity**
  Before listing requirements, we must acknowledge a structural constraint. For an event of this rarity and horizon, you cannot simultaneously satisfy the following three conditions:
  1.  **Statistical Power:** A sample large enough to generate a stable standard error.
  2.  **Causal Homogeneity:** A sample where the underlying mechanisms (patronage, information flow, institutional strength) match the target case.
  3.  **Ex-Ante Definability:** A reference class defined solely by information available at the start of each historical case (no hindsight bias).

  In your specific dataset (34 cases, 1870–2010), you can have any two, but not all three. If you enforce Causal Homogeneity (Senior 2's demand), your effective N collapses because 19th-century succession dynamics do not transfer to modern hybrid regimes. If you enforce Statistical Power (Senior 1's demand), you must include causally dissimilar cases, violating Homogeneity. If you try to salvage both by cherry-picking the "closest" matches, you violate Ex-Ante Definability. **This is not a caveat; it is the result.** Any method claiming to satisfy all three is lying.

  ***

  ### The Desiderata

  | Requirement | Rationale & Consideration | Classification |
  | :--- | :--- | :--- |
  | **1. Temporal Specificity (Hazard Rate)** | A static frequency (9/34) is a cumulative density, not a probability for the *next* ten years. The risk of breaking a convention is not constant; it likely changes as the convention ages (duration dependence). The method must convert survival data into a conditional hazard rate: $P(Break | Survived 38 yrs, Next 10 yrs)$. | **Non-Negotiable** |
  | **2. Ex-Ante Class Integrity** | The reference class must be definable using only information available at the *start* of each historical case. You cannot include a case in the "risk set" if you needed to know it survived 20 years to classify it. This prevents hindsight bias from inflating the "survivor" count. | **Non-Negotiable** |
  | **3. Causal Transferability** | The method must explicitly state *why* a historical break is analogous to the target risk. If 8 of the 9 breaks were military coups and the current risk is legislative maneuvering, the base rate is noise. The method must weigh cases by mechanism similarity, not just count them. | **House Style** (Senior 2) |
  | **4. Clustering Adjustment** | The 9 breaks are not independent draws; 6 occurred in a single decade. This implies a systemic shock (e.g., post-Cold War) rather than idiosyncratic risk. The method must adjust the effective sample size or variance to reflect this temporal clustering, or the confidence interval will be falsely narrow. | **Non-Negotiable** |
  | **5. Longevity Handling** | The target case (38 years) exceeds 28 of the 34 analogues. The method must specify the duration dependence function: does risk decay (institutionalization) or accrue (leader entrenchment)? A method that assumes constant risk over time is invalid here. | **Non-Negotiable** |
  | **6. Reflexivity Disclosure** | The client will campaign based on this number. If the forecast is public, it alters the probability (self-negating or self-fulfilling). The method cannot model this feedback loop in two weeks, but it *must* flag whether the number assumes the forecast remains private or becomes public. | **Non-Negotiable** |
  | **7. Falsifiability** | The output must be a number (or interval) that can be scored as 0 or 1 in ten years. Qualitative "confidence" or "scenarios" fail the client's spend/score constraint. | **Non-Negotiable** |
  | **8. Uncertainty Quantification** | Given the Trinity violation, a point estimate is malpractice. The method must produce an interval that captures *model uncertainty* (which class? which mechanism?), not just *parameter uncertainty* (binomial variance). | **House Style** (Quant) |

  ***

  ### The Killer Requirement
  **Causal Transferability (Requirement #3).**

  This is the fulcrum of the disagreement between your seniors.
  *   **Why it knocks out methods:** If you enforce this strictly, the **Raw Base Rate** and **Duration Model** methods collapse. They treat the 34 cases as exchangeable units. Senior 2 is correct that a succession crisis in 1890s Latin America (caudillo politics) is not exchangeable with a 2020s hybrid regime (legalistic authoritarianism). Enforcing Transferability reduces the usable sample to near zero, making statistical inference impossible.
  *   **Why it fuels the fight:** Senior 1 (Outside View) argues that without a large N, you are just guessing, so you must swallow the causal noise to get the statistical anchor. Senior 2 (Inside View) argues that a statistically precise answer to the wrong question is a hallucination.
  *   **The Reality:** In a two-week window with N=34, you cannot satisfy Causal Transferability *and* Statistical Power. You must choose which error you prefer: Bias (Senior 1's path) or Variance (Senior 2's path).

  ***

  ### Method Scorecard

  | Method | Temporal Specificity | Ex-Ante Integrity | Causal Transferability | Clustering Adjustment | Reflexivity | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Raw Base Rate (9/34)** | ❌ | ✅ | ❌ | ❌ | ❌ | **Reject.** Treats 1870 coups as equivalent to modern legal maneuvers; ignores duration. |
  | **Duration Model (Weibull/Cox)** | ✅ | ✅ | ❌ | ⚠️ | ❌ | **High Risk.** Overfits small N; assumes historical hazard shape applies to modern context. |
  | **Structured Expert (Inside View)** | ✅ | ⚠️ | ✅ | ✅ | ✅ | **Viable.** Only method that handles mechanism & reflexivity, but requires strict calibration protocol to avoid bias. |
  | **No-Number (Analogues Only)** | ✅ | ✅ | ✅ | ✅ | ✅ | **Reject.** Fails client spec (needs a scoreable number). |

  **Recommendation:** Use **Structured Expert Judgment** constrained by the **Duration Model's** survival curve as an anchor, but widen the interval to account for the **Causal Transferability** violation. Explicitly state in the deliverable that the interval reflects the "Impossible Trinity" trade-off. Flag the reflexivity risk as a conditional footnote.
