  **SUPREME COURT OF ONTOLOGY**
  **KRESS v. GABLE**
  **No. 2023-CAUS-004**

  **Before: Chief Justice Viner, Justice Locke, Justice Hume.**

  **OPINION OF THE COURT**

  **1.** This appeal concerns the liability of Defendant Gable for the destruction of Plaintiff Kress's ceramic mug during a departmental faculty meeting. The facts are undisputed. Gable, experiencing intense rage upon learning Kress had occupied his reserved parking space, struck the mug with his fist, shattering it. The trial court granted summary judgment for Gable under the Causal Exclusion Principle (CEP), adopted by this Court in *State v. Epiphenomena*. We affirm.

  **2.** The CEP establishes that a defendant is liable only for events caused by something not itself fully caused by prior physical events. Where bodily movements have a complete physical cause, the law may not treat a belief, desire, or intention as a cause. This rule rests on three premises accepted as binding law in this jurisdiction: (1) the causal closure of the physical domain; (2) the non-identity of mental and physical states; and (3) the rejection of systematic causal overdetermination. As we noted in *Epiphenomena*, if the physical cause is sufficient, the mental cause is excluded *a fortiori*.

  **3.** Plaintiff argues that Gable's rage was a "substantial factor" in the mug's destruction, invoking the concurrent-cause doctrine familiar to tort law. See *Anderson v. Minneapolis St. P. & S. S. M. Ry. Co.* (two fires, each sufficient, both liable). Plaintiff contends that even if Gable's neural firings were sufficient to cause the arm movement, his rage was also sufficient, and thus both should bear liability. He argues that the law has always permitted overdetermination where multiple sufficient causes converge on a single harm.

  **4.** This argument conflates physical concurrency with ontological duplication. The concurrent-cause doctrine applies where two distinct physical chains converge on a single result. It does not authorize the duplication of causal credit across ontological levels. To hold Gable liable for his rage would be to assert that the mug was shattered twice: once by the neural cascade sufficient to move the arm, and once by the rage. This Court finds systematic overdetermination as offensive as it finds epiphenomenalism. It is metaphysically wasteful to assign legal causation to a variable that adds no predictive power to the physical chain. The *Anderson* rule preserves liability for distinct physical agents; the CEP preserves reality for distinct ontological categories.

  **5.** Plaintiff suggests we adopt a "compatibilist" standard for torts, allowing mental states to ride along with physical causes under a theory of supervenience. We decline. To rule otherwise would violate the closure principle underlying our penal and civil codes. The law requires a *causa sine qua non*; here, the neural state was the necessary and sufficient condition. The rage was merely a supervenient shadow. While tort doctrine often ignores micro-physical sufficiency in favor of folk-psychological reasons, where metaphysical precision is required by statute, tort doctrine must yield. The CEP is not a rule of evidence but a rule of decision regarding the structure of reality.

  **6.** We acknowledge this creates tension with the concept of intentional torts, which presuppose that acting "on purpose" is a causal condition of liability. However, under the CEP, "purpose" is legally inert whenever the body's movements already have a complete physical cause. Gable's neurons caused the breakage. Gable's rage did not. Since liability attaches only to causes, and rage is not a cause under the CEP, Gable is not liable for acting "on purpose." To find otherwise would require this Court to endorse the view that every action is systematically overdetermined, a position we find untenable.

  **7.** The judgment of the lower court is affirmed. Costs allocated to Plaintiff.

  **RYLE, J., dissenting.**

  **8.** I respectfully dissent. The majority correctly identifies the exclusion problem but incorrectly solves it by sacrificing the mental. We should instead apply a proportionality constraint. The neural details are too specific; the rage is the determinable cause that fits the effect. If I shoot you, the cause is my intention to kill, not the specific micro-configuration of my trigger finger. The mental variable screens off the physical detail because it is the appropriate level of explanation for liability.

  **9.** However, treating the mental as a higher-level variable that screens off the physical suggests the mental exerts downward causation. If the mental variable is the true cause, it must fix the physical realization. This implies the physical domain is not closed, which contradicts the CEP's first premise. If we save mental causation via proportionality, we must admit that physical events are not fully caused by prior physical events, but rather by...

  **10.** Accordingly, I would reverse, but remand for a determination of whether the closure principle can survive the determinable/determinate distinction without collapsing into dualism.

  **DISMISSED.**
