answer: |-
  The principle that reconciles your five verdicts is the **Principle of Jurisdictional and Ontological Congruence**. It holds that a democratic body acts legitimately only when the **flexibility of its procedure** matches the **reversibility of the consequence**, and when the **authority of the body** matches the **category of the question**.

  Stated precisely:
  > **A collective decision is legitimate if and only if: (1) Political questions regarding future policy are decided with procedures that allow for revision when consequences are reversible, but demand heightened caution when consequences are irreversible; (2) Judicial questions regarding past guilt are decided with strict adherence to established law and finality; and (3) Questions of individual conscience or truth are recognized as lying beyond the competence of any majority.**

  Here is how the clauses of this principle generate your five verdicts:

  1.  **Mytilene (System at its best):** This falls under **Clause 1 (Political/Reversible)**. The question was one of policy (deterrence vs. expediency). The consequence (mass execution) was reversible because the ship had not yet arrived. The procedure allowed for revision (reconvening, second speech). The flexibility of the Assembly matched the reversibility of the act.
  2.  **Court Reversal (System at its worst):** This falls under **Clause 2 (Judicial/Final)**. The question was one of justice (past guilt). The consequence (verdict) must be final to ensure legal stability. Reopening a case on the same evidence violates the requirement for finality inherent in judicial questions, even if the body is different.
  3.  **Sicily (Procedure failed):** This falls under **Clause 1 (Political/Irreversible)**. The question was policy, but the consequence (launching a massive armada) was effectively irreversible. The procedure treated it as a standard reversible policy decision (simple majority, standard debate) rather than invoking the heightened caution required for irreversible commitments. It failed because the procedural rigor did not match the ontological weight of the decision.
  4.  **Arginusae (Worse than Sicily):** This falls under **Clause 2 (Judicial/Illegal)**. The Assembly acted as a court (judicial question) but bypassed the established law (individual trials, presiding officer's ruling). While Sicily was a failure of *judgment* within the rules, Arginusae was a failure of *legality* itself. Violating the law to punish individuals is a greater sin than making a strategic error within the law.
  5.  **Socrates (A scandal):** This falls under **Clause 3 (Conscience/Immune)**. Although the *judicial* procedures (Clause 2) were followed, the *subject matter* (philosophical truth/conscience) lies beyond the competence of a majority. No amount of procedural safeguard can legitimize a majority vote on the validity of an individual's intellectual life.

  ### The Two Unlisted Episodes

  **1. Nicias at the Second Sicilian Assembly**
  Nicias, hoping to sabotage the expedition by demanding an imprudently large force, is granted exactly that by the Assembly.
  *   **Analysis:** This episode **embarrasses** the principle, specifically **Clause 1**. It reveals the difficulty of distinguishing between "reversible" and "irreversible" policy in real time. The Assembly treated the grant of ships as a reversible political negotiation (Nicias's bluff), but the material reality was an irreversible commitment of resources (Sicily).
  *   **Verdict:** It confirms the *danger* inherent in Clause 1: if the body misjudges the irreversibility of the consequence, the "flexible" procedure becomes a trap. It does not break the principle, but it highlights that the principle relies on the Assembly's *wisdom* to categorize the stakes, which is precisely what failed in Sicily.

  **2. The Amnesty after the Thirty**
  The restored democracy legislates that no one may bring up past wrongs committed during the tyranny of the Thirty.
  *   **Analysis:** This episode **confirms** the principle. It is a **Political decision (Clause 1)** made to deliberately constrain **Judicial action (Clause 2)**. The Assembly recognized that pursuing judicial retribution for past crimes would destroy the future policy goal (stability). By using political authority to foreclose judicial questions, they prioritized the reversibility of the polity's future over the finality of past guilt.
  *   **Verdict:** This is the Principle working at its highest level: the democratic body correctly identified that the *category of the question* (survival of the state) superseded the normal demands of justice.

  ### Conclusion

  No verdict needs to be overturned. The **Principle of Jurisdictional and Ontological Congruence** survives all five cases and the two additional episodes.

  However, the simplest principle I can live with, stripping away the philosophical jargon, is this:
  **"Democracy is trustworthy when it knows what it is deciding."**

  *   When deciding **policy**, it must leave the door open to change its mind (Mytilene), unless the door is about to be welded shut, in which case it must pause (Sicily).
  *   When deciding **guilt**, it must follow the rules and stop when the verdict is in (Courts/Arginusae).
  *   When deciding **truth**, it must admit it has no vote to cast (Socrates).

  Your anguish over the verdicts stems from watching the Athenians confuse these three categories: treating war like policy (Sicily), treating justice like policy (Arginusae), and treating truth like justice (Socrates). Mytilene remains the beacon because it was the one moment they correctly identified a policy decision as reversible, and allowed the procedure to reflect that truth.
