answer: |-
  This is a classic problem in epistemology and the philosophy of language, specifically touching on the **Norm of Assertion**. You have correctly identified that the simple "Knowledge Norm" (your friend's view) and your "Reasons on Demand" norm both have leakage.

  Your friend's view (Knowledge Norm) fails on Cases 5 and 6 (you can assert without personal knowledge/belief if you have authority).
  Your view (Reasons on Demand) fails on the "Child/Earth Age" case (you have warrant, but can't produce the proof on demand) and arguably Cases 5 and 6 (you might not have the reasons, the institution does).

  Here is the principle that best captures the shape of your intuitions, followed by the verdict on the Lottery/Doctor paradox and the new cases.

  ### The Principle: The Dual-Source Warrant Norm

  **You may flat-out assert $p$ if and only if:**

  1.  **(Epistemic Warrant):** You possess evidence for $p$ that *tracks the truth* of $p$ (it would not be present if $p$ were false), **OR**
  2.  **(Institutional Warrant):** You are occupying a role authorized to assert $p$ on behalf of a body or process that possesses Epistemic Warrant for $p$, **AND**
  3.  **(Constraint):** Your warrant is not based *solely* on bare statistical probability regarding a class to which $p$ belongs (the "Lottery Constraint").

  ---

  ### Clause-by-Clause Breakdown

  **Clause 1 (Epistemic Warrant / Truth-Tracking)**
  *   **What it does:** This handles the standard cases of personal knowledge. It requires that your evidence be *sensitive* to the truth.
  *   **Handles:**
      *   **Case 1 (Sister's Flight):** Testimony tracks the fact. If the flight weren't delayed, she likely wouldn't have texted that.
      *   **Case 3 (Doctor):** The biopsy interacts with the specific cells. If the cells were cancerous, the test would (99.7%) show it. This is truth-tracking.
      *   **Case 7 (Flatmate Theft):** You had testimony, so you met the warrant *at the time of assertion*. The fact it turned out false makes the assertion *improper* (as you said), even if blameless. This clause explains why it was improper: the warrant was defeated.
      *   **Child/Earth Age:** You possess testimony from the scientific community. While you can't produce the radiometric dating on demand, your belief is formed by a process that tracks the truth. *Correction to your view:* You don't need to *produce* the reason on demand; you need to *have* a reason (even if that reason is "trusted consensus").

  **Clause 2 (Institutional Warrant)**
  *   **What it does:** This allows you to assert things you don't personally know or believe, provided you are acting as a mouthpiece for a system that does.
  *   **Handles:**
      *   **Case 5 (Teacher):** She does not believe/know evolution is true personally. But she is authorized to assert the scientific consensus on behalf of the curriculum. She is asserting *for the institution*.
      *   **Case 6 (Committee Chair):** She voted against it. She doesn't believe it. But her role is to voice the Committee's finding. The Committee has the warrant; she has the authority.

  **Clause 3 (The Lottery Constraint)**
  *   **What it does:** This blocks assertions based purely on statistical likelihood without causal connection.
  *   **Handles:**
      *   **Case 2 (Lottery):** The odds are 99.9999%. But the odds are the same for every ticket. Your evidence (the odds) does not track *this specific ticket's* loss. If this ticket had won, the odds *before the draw* would have been identical. It fails the truth-tracking test.
      *   **Case 4 (Cousin's Feeling):** A feeling is not evidence that tracks truth.

  ---

  ### The Verdict: Which one to drop? (Case 2 vs. Case 3)

  **Do not drop either.** Your intuition that Case 2 is improper and Case 3 is proper is correct, and it is the consensus view in contemporary epistemology. The mistake is thinking they are in the "same ballpark of odds." They are in different *categories* of evidence.

  **The Argument:**
  The difference is **Sensitivity** (or **Normic Support**).
  *   **Lottery (Case 2):** Imagine a nearby possible world where your friend *did* win. In that world, your evidence *before the draw* (the odds) is exactly the same. Your evidence does not rule out the error. Therefore, you cannot assert it.
  *   **Doctor (Case 3):** Imagine a nearby possible world where the patient *does* have cancer. In that world, the biopsy result would (in 99.7% of worlds) be different. The evidence *tracks* the reality of the cells.

  **Why your friend struggles:** She says "Assert only if you know." She must argue the Doctor doesn't *know* (because 0.3% error). This feels wrong.
  **Why you struggled:** You said "Assert only if you can produce reasons." This feels right for the Doctor, but wrong for the Lottery (you can produce the odds).
  **The Fix:** It's not about the *strength* of the probability; it's about the *connection* between the evidence and the fact. The Doctor has a causal link; the Lottery has only a statistical frequency.

  **Verdict:** Keep both verdicts. Case 2 is improper; Case 3 is proper.

  ---

  ### The Three New Cases

  **1. The Climate Scientist ("Heatwave made 3x more likely")**
  *   **Verdict:** **Assertable.**
  *   **Why:** This looks statistical, but it functions like the Doctor, not the Lottery. The scientist is using models that simulate *this specific* atmospheric configuration with and without carbon forcing. The claim is about a causal mechanism acting on *this particular* event, not just a historical frequency. It satisfies Clause 1 (Truth-Tracking).

  **2. The Jury Foreman ("Guilty" via 1-in-a-billion DNA)**
  *   **Verdict:** **Assertable (in court); Improper (at a bar).**
  *   **Why:** This is the hardest case. DNA is statistical. However, a DNA match is treated as *individualized* evidence. It is not "1 in a billion people match"; it is "This specific profile matches."
  *   **The Gap:** Unlike the lottery, where the evidence (the odds) exists *before* the event, the DNA evidence exists *because* of the event (the suspect was there). It is causally linked.
  *   **Caveat:** A jury foreman asserts *on behalf of the State* (Clause 2). If you, a random person, tell someone at a bar "He's guilty" based on a DNA report you read, you are bordering on improper because you lack the Institutional Warrant and the full chain of custody (Epistemic Warrant). But the Foreman? Fine.

  **3. The Mechanic ("Alternator's shot", 95% test)**
  *   **Verdict:** **Assertable.**
  *   **Why:** Identical to the Doctor (Case 3). The test interacts with the specific physical component. If the alternator were fine, the test would (likely) not flag it. It is truth-tracking. 95% is sufficient for practical knowledge in this context.

  ---

  ### The Gap: Lottery vs. DNA

  You asked to spell out exactly what is doing the work in the gap between the Lottery (Case 2) and the DNA/Jury case, since both involve high statistical probability.

  **The Work is done by "Abnormality" (Normic Support).**

  *   **Lottery:** If your friend wins the lottery, is it *abnormal* given the odds? No. It is rare, but it requires no special explanation. The odds are compatible with winning. Therefore, the odds do not support the assertion "You lost."
  *   **DNA:** If the suspect is *innocent*, is it *abnormal* that his DNA matches the crime scene? **Yes.** It is so abnormal (1 in a billion) that it demands an explanation (lab error, twin, framing).
  *   **The Difference:**
      *   In the Lottery, the evidence (odds) is compatible with the falsehood (winning) without requiring a "glitch" in the system.
      *   In the DNA case, the evidence (match) is *incompatible* with the falsehood (innocence) unless there *is* a glitch (error).

  **Summary:** You may assert when your evidence makes the falsehood of $p$ **abnormal** (Doctor, DNA, Mechanic). You may not assert when your evidence makes the falsehood of $p$ merely **unlikely** (Lottery).

  ### Final Recommendation

  Your friend's "Knowledge Norm" is too rigid for institutional speech (Cases 5, 6). Your "Reasons on Demand" norm is too rigid for testimonial knowledge (Child/Earth) and confuses *having* warrant with *demonstrating* it.

  Adopt the **Dual-Source Warrant Norm**. It preserves your correct intuition on the Lottery (Case 2) vs. Doctor (Case 3) distinction by focusing on *truth-tracking* rather than *probability percentage*, and it saves Cases 5 and 6 by acknowledging that we sometimes speak for others.
