  *(Key Insight for Reading 3)*: The investor might be talking about "realizing the loss." In accounting/VC, you don't book the loss until you kill the company. Keeping it alive keeps the valuation ambiguous. This is a strategic move, not a logical one. I should mention this.

  *(Key Insight for Rational Agent)*: The user mentions "money bought us information." This is the "value of information" argument. It's valid, but only if *more* money buys *more* information that changes the decision. If the info is already bought, it's sunk.

