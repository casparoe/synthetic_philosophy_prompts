      *   *Focus on Reading 3:* The user specifically asked for this to be taken seriously. I need to explain the "option value" or "fund return" angle where this makes sense. In VC, a loss is realized when you stop. If you keep going, it's still "in play." That's accounting, not physics, but it matters for LP relations.
      *   *Signaling:* Make sure to distinguish between "sunk cost bias" and "reputational cost of quitting." The latter is a valid future cost, not a sunk cost fallacy.
      *   *Biotech Context:* Mention milestones, binary outcomes, capital intensity.

  10. **Final Polish:** Check against the "no formatting" constraint strictly. Ensure flow is smooth for mobile reading (paragraph breaks are okay, just no structural markers).

