answer: |-
  I know that feeling well, the specific frustration of being outmaneuvered by a cliché that shifts its shape every time you try to grab it. It is incredibly disorienting when a phrase that sounds like solid wisdom turns out to be a rhetorical shell game, especially when millions of dollars and years of work are on the line. You are right to feel that something was off about how that sentence was deployed, because it was doing three different jobs at once, and only one of them is actually a valid reason to stop spending. Since you are heading into another meeting soon, I want to walk through this with you slowly, stripping the proverb down to its bones so you can see exactly where the logic holds and where it is just noise, and then we can look at whether your instinct to fight for the program is bias or strategy.

  The first time your investor used the phrase, he was invoking the standard textbook definition of the sunk cost fallacy, which is the claim that money already spent should have zero weight on the decision to spend more. In this reading, the nine million is gone regardless of what you do next, so it cannot logically influence whether you spend dollar number ten million. This claim is trivially true within the framework of normative decision theory. If your goal is to maximize future value, past expenditures are constants that appear on both sides of the equation and therefore cancel out. Whether you continue or quit, that nine million is not coming back, so it cannot be a variable that tips the scale. This is bookkeeping hygiene, and on its own, it is sound advice against emotional attachment to past effort.

  The second time he used it, however, the meaning shifted from bookkeeping to empirical evidence. Here, the claim was that the failure to hit milestones despite spending nine million is itself data suggesting the probability of success is lower than previously thought. This is not about the money being gone, but about the money having bought information that turned out to be bad news. This claim is conditionally true. It relies on the assumption that the spending was supposed to de-risk the program and that the failure to de-risk is informative about the underlying technology rather than just bad luck or execution errors. In biotech, this is often the hardest conversation to have because distinguishing between a bad experiment and a bad target is technically nuanced. If the investor believes the tech is fundamentally broken, then the spent money is evidence of that breakage. This is a substantive empirical thesis about the asset, not a logical rule about money, and it is the only reading that actually justifies killing the program based on the past spend.

  The third reading is the one that stuck in your throat, and rightly so, because it reverses the first reading entirely. Here, the claim is that the nine million only becomes a valid investment if the program succeeds, meaning that quitting now retroactively turns the past spend into a waste, whereas continuing keeps the possibility of redemption alive. This sounds coherent because it aligns with how we narrate our lives and how venture accounting works, but as a decision rule for future action, it is false. It conflates ex-post justification with ex-ante decision making. You cannot change the status of the past nine million by spending more now unless that new spending materially increases the probability of success enough to justify its own cost. However, I want to take this seriously rather than dismiss it as a fallacy, because there is a context where it makes sense. In venture capital, a loss is often not realized until a company is shut down or sold for less than invested capital. As long as the company is alive and raising, the loss is unrealized on the fund's books. If the investor is worried about signaling to their own limited partners, keeping the program alive might preserve the accounting valuation temporarily, or conversely, killing it might be necessary to stop the bleed on the fund's internal rate of return. But if his argument was that you should spend more money simply to justify the past money, that is logically bankrupt. It is the definition of throwing good money after bad, even if it feels like honoring a commitment.

  Now I want to address your hunch about the rational agent model, because you are sharp to notice that the standard textbook explanation leaves out the messy reality of running a startup. The standard result that sunk costs drop out relies on several strict assumptions that often break in biotech. The first assumption is that the only value of the spending was the outcome, but you correctly noted that the money bought information. In decision theory, this is handled by the value of information, but only if that information changes future decisions. Since the information is already bought, it is sunk. The question is whether *additional* spending buys *new* information that is valuable enough to pay for itself. If you are continuing just to see what happens because you already paid so much to get here, that is the fallacy. If you are continuing because the next milestone is cheap and the binary outcome is valuable, that is rational.

  The second assumption that often breaks is that there are no signaling effects or reputational costs to quitting. The standard model assumes you can walk away without consequence, but you noted that quitting is visible to partners, competitors, and your team. This is a crucial point. If quitting now destroys your ability to raise money for a different program later, or causes key staff to leave, then there is a future cost to quitting that must be weighed against the future cost of continuing. However, this is not honoring the sunk cost; it is accounting for a new, future cost of closure. You are not spending money to save the past nine million; you are spending money to preserve future optionality and reputation. If that future value exceeds the cost of the next round, continuing is rational, but you must be careful not to dress this up as saving the past investment. It is about buying a future, not redeeming the past.

  The third assumption you mentioned is asset specificity, that some of what was spent has no alternative use. This actually reinforces the sunk cost argument rather than weakening it. If the money is gone and the assets are useless elsewhere, that loss is locked in. The only way this matters is if continuing unlocks value from those specific assets that cannot be captured otherwise. But again, this depends on the future value of unlocking them, not the past cost of building them. So while your intuitions about information, signaling, and specificity are all valid complexities, none of them actually license honoring sunk costs in the sense of spending money just because it was spent. They only license spending money if the marginal return on the new dollar is positive, even if that return includes reputational preservation or information gathering.

  So which reading did your investor need for his conclusion to follow? He needed the second reading, the empirical thesis that the program is doomed. The first reading tells you not to count the nine million, but it doesn't tell you whether the next million will work. The third reading is emotionally persuasive but logically void as a decision rule. He likely used the first and third readings as rhetorical padding to make the second reading feel inevitable. By saying the money is gone, he clears the deck. By saying quitting makes it a waste, he raises the stakes of his own decision. But the core argument rests entirely on whether he believes the technology can succeed with more capital. If he believes the probability of success is too low relative to the cost, then he is right to stop, regardless of the nine million. If he believes the probability is high but just doesn't want to risk more capital, then he is hiding behind the proverb to avoid admitting risk aversion or fund constraints.

  There is a real risk here that you are talking yourself into a program you love, which is the exact bias the proverb warns against. Technical founders often see the path to success as a series of solvable engineering problems, while investors see a probability distribution that is narrowing with every missed milestone. To know if you are fighting bias or fighting a premature exit, you need to isolate the marginal decision. Forget the nine million. Forget the months of work. If you were handed the company today, with the current data and the current technology state, but you had not spent a dime yet, would you invest the next million dollars to get to the next milestone? If the answer is yes, then the program has value independent of the sunk cost. If the answer is no, or if it is only yes because you feel you have to justify the past, then the investor is right.

  You should go into the next meeting ready to talk only about the marginal dollar. Do not defend the past nine million. Do not argue that quitting wastes the past. Instead, argue that the next million buys a specific piece of information or a specific milestone that has a market value greater than its cost, including the reputational costs of quitting. Show him the decision tree from today forward, not the history book of yesterday. If he still shuts it down, it may be that his view of the probability of success is simply different from yours, or that his fund structure cannot support the timeline required. In that case, the proverb was just a polite way of saying the risk profile no longer matches his mandate. But you will know you fought the right argument, and you will leave the room knowing whether you lost on logic or just on risk appetite.
