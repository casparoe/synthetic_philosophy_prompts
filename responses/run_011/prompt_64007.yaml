      *   *Wait, one constraint:* "Tell me flat out which feature of his position this activity cannot reproduce."
      *   Al-Ghazali's position is theological (God's continuous creation). I am stripping theology. The feature I can't reproduce is the *ontological* claim (that causation literally doesn't exist). I can only reproduce the *epistemic* claim (that you can't know it). I must be honest about this.

      *   *Handling the Skeptics:*
          *   "Word games": Acknowledge it. "Yes, in practice, we treat it as causal. But in a postmortem, we claim *truth*."
          *   "Obviously so what": "Because if you treat regularity as necessity, you miss the real bug (the one that breaks the pattern)."

      *   *Timing:*
          *   Intro: 5
          *   Activity Round 1 (Pattern): 10
          *   Activity Round 2 (Commitment): 10
          *   Activity Round 3 (The Reveal): 10
          *   Debrief/Discussion: 35
          *   Buffer/Overrun: 5
          *   Total: 75.

      *   *Refining the "Cost":*
          *   If they claim certainty, they sign.
          *   At the end, if they agree they didn't *observe* causation, they have to take a "Humility Sticker" (a small dot) on their badge. It's visible for the rest of the day. Low cost, high visibility.

      *   *Refining the "Break":*
          *   Don't break the pattern (that suggests randomness).
          *   Break the *inference*.
          *   Show that the *mechanism* they assumed is not in the data.

      *   *Let's flesh out the Handouts.*
          *   Handout 1: 5 blocks of text. "Time: 12:00. Event: DB Lock. Time: 12:01. Event: Timeout."
          *   Task: "Write the sentence for the Executive Summary."
          *   Handout 2: "The Scheduler." A note saying "I generated these logs. I ensured they matched. There is no code linking them in this simulation."

      *   *Wait, if I say "There is no code linking them," they will say "Well this is a fake simulation."*
      *   I need to bridge the gap. "In this room, I am the OS. In Prod, the OS is the black box. You trust the OS links events. But did you *see* the link?"
      *   This is the bridge.

      *   *Debrief Questions:*
          1.  What did you write?
          2.  What data supported the word "caused"?
