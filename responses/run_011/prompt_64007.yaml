      *   *Honesty:* I can't prove causation doesn't exist, only that *observation* of it is impossible.

  4.  **Drafting the Plan:**
      *   *Title:* "The Unobservable Link."
      *   *Prep:* Index cards, markers, dot stickers (red/green), printed logs.
      *   *Structure:*
