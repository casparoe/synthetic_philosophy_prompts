answer: |-
  **Candidate Narrative Vehicles**

  1.  **Debt Recovery Office:** An officer seeks a signature on a repayment ledger. The Register shows refusal. A schism exists over whether character profiles can substitute for Register queries to save budget. Disclosure destroys trust.
  2.  **Parole Forecasting Unit:** An officer seeks a placement where a parolee does not reoffend. The Register shows failure. A schism exists over psychological grounding versus brute data. Disclosure confirms hopelessness.
  3.  **Ministry Placements Directorate:** An officer seeks a parish where a cleric does not resign. The Register shows quitting. A schism exists over spiritual grounding. Disclosure causes scandal.

  I commit to **Debt Recovery**. It offers the most banal, Kafkaesque texture for the "small stakes" requirement (a signature on a ledger) and avoids religious vocabulary pitfalls. I discarded Parole for being too close to standard prediction tropes, and Ministry for risking forbidden theological terms.

  ***

  **Conditions of Service**

  The hum of the Register was the only sound in the adjustment room, a low vibration that Vane felt in his teeth. He typed the variables into the console: *Subject: Halkin, Aris. Circumstance: Office 4B, 14:00 hours, Overcast, Letter Type C, Waiter: None.* He pressed the query key. The paper slip printed instantly, sliding onto the tray.

  *Outcome: Decline.*

  Vane did not sigh. He filed the slip in the Halkin folder, which was now three inches thick. He adjusted the variables. *Rain. 09:00 hours. Letter Type A. Waiter: Senior Officer.* He queried again.

  *Outcome: Decline.*

  The institution did not require success. It required due diligence. The mandate was to secure the restructuring signature using only placement leverage. They could alter the room, the weather simulation, the wording of the demand, the face waiting in the corridor. They could not alter the choice. The entry existed before the circumstance was supplied. It existed whether or not the meeting ever occurred. Vane knew this, though new recruits often mistook the Register for a command unit.

  He took the folder to the budget review. Section Head Krell was waiting, flanked by two auditors. The air in the conference room smelled of stale coffee and ozone.

  "We are burning queries," Krell said, tapping the expenditure report. "Three hundred adjustments for one subject. The actuarial model suggests we could infer the outcome from Halkin's psychological profile. It would cut costs by sixty percent."

  "The model infers based on character," Vane said. He kept his voice flat. "The Register reports based on truth. They are not the same."

  "If the entry is true, it must be grounded in something," Krell insisted. "If it is grounded in the subject's nature, we can extrapolate. We don't need to test every variation of rain and letterhead. We just need to know the man."

  "The entries are not grounded in nature," Vane said. "They are simply true. There is no basis to extrapolate. If we skip the query, we are guessing."

  "That is metaphysics, Vane. This is a ledger." Krell turned to the auditors. "I recommend freezing the Adjustment Directorate's query budget until the profiling pilot is approved. We cannot sustain brute-force testing."

  The freeze was approved. Vane returned to the adjustment room with a reduced allocation. He had enough queries for ten more circumstances. He looked at the Halkin file. The institution needed the signature. It was a small thing, a single line on a ledger releasing a hold on assets, but the protocol was absolute.

  He scheduled the meeting for Thursday. He chose Office 4B. He chose Letter Type C. He chose 14:00 hours. He knew the outcome. The Register had said so before he booked the room. But the protocol required the circumstance to be supplied. He could not achieve the outcome by willing it; he could only arrange the stage and wait for the actor.

  Halkin arrived on time. He was a thin man with a coat that smelled of wet wool. He sat in the chair Vane had specified. Vane placed the letter on the desk. He did not speak immediately. The silence was part of the circumstance, though the Register had not specified its duration.

  "You know what this is," Halkin said.

  "Yes."

  "And you know what I will do."

  Vane reached into his jacket. This was the violation. Protocol forbade disclosure, but the budget freeze had strained the department's morale, and Vane wanted to see if the knowledge changed the texture of the refusal. He slid the latest slip across the desk.

  *Outcome: Decline.*

  Halkin read it. He looked at the timestamp. It was dated three days prior. He looked at Vane. "You printed this before I walked in."

  "Yes."

  "And you still called me here."

  "Protocol requires placement."

  Halkin laughed, a dry, cracking sound. He picked up the pen. He hovered it over the signature line. Vane watched the hand. The institution had no power over the hand. It had only placed the pen, the paper, the light, the man. The rest was outside the building's walls.

  "If I sign," Halkin said, "does the slip change?"

  "No."

  "Then it says I won't."

  "It says what you would choose in this circumstance."

  "Including reading the slip?"

  "The circumstance included the disclosure," Vane lied. It had not. The original query was blind. But if he admitted that, the entry might be voided by the discrepancy in conditions. He needed the file to close.

  Halkin put the pen down. He pushed the letter back. "Then I won't."

  "It costs you nothing to sign."

  "It costs me the truth," Halkin said. He stood up. "You know I won't, and you ask anyway. That is the work you do."

  Halkin left. The door clicked shut. The circumstance was complete. The outcome matched the entry. Vane collected the letter. It was unsigned.

  He returned to the adjustment room. The hum was waiting. He sat at the console. The budget freeze meant he had six queries remaining. He could try a different office. He could try a different time. He could try a different letter. The Register would report the truth for each. None of them would yield the signature. The institution was not omnipotent; it could not force the hand, only arrange the room. Some files never closed.

  Vane typed: *Subject: Halkin, Aris. Circumstance: Office 2A, 10:00 hours, Sunny, Letter Type B, Waiter: None.*

  He pressed the query key. The machine whirred. The slip printed.

  *Outcome: Decline.*

  Vane filed the slip. He reached for the keyboard to input the next variation. There was work to be done. The ledger remained open, and the institution required due diligence.

  Logline: An officer uses a fixed record of choices to arrange circumstances for a signature, knowing the outcome cannot change.
