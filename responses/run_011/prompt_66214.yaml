answer: |-
  No fully consistent principle exists across your current verdicts, but a robust decision rule can be constructed by sacrificing specific intuitions regarding sample size and inside-view claims.

  **The Decision Rule: The Validated Narrowing Protocol**
  Select the narrowest reference class that satisfies three constraints:
  1.  **Predictive Validity Clause:** Narrowing criteria must have demonstrated *ex-ante* statistical or causal linkage to the outcome, not merely post-hoc distinctiveness.
  2.  **Minimum Robustness Clause:** The class must contain sufficient members (typically N≥15) to estimate variance, unless the narrowing criteria are causally deterministic.
  3.  **Hazard Stability Clause:** Condition on survival history only if the underlying hazard rate is time-dependent; treat history as null information if the hazard is constant (memoryless).

  **Application to Your Verdicts**
  *   **1 (Marriage):** Saved by **Predictive Validity**. Personal knowledge predicts *this* marriage; base rate predicts *anonymous* rows.
  *   **2 (Megaproject):** Saved by **Predictive Validity**. Procurement type and country are structurally causal for budget variance; "all projects" ignores these drivers.
  *   **3 (Intervention):** Saved by **Predictive Validity**. Specific narrowing criteria (era/location) lack robust predictive power for success in complex systems; broad historical base rates capture systemic friction better.
  *   **4 (Pharma):** Saved by **Predictive Validity**. "Unusual molecule" is an unverified claim with poor historical predictive power against approval rates.
  *   **5 (Startup):** Saved by **Predictive Validity**. Founder history is verified data with known statistical correlation to success, unlike pharma claims.
  *   **6 (Survivorship):** Saved by **Hazard Stability**. Regimes/marriages have time-dependent hazards (stabilize over time); product recalls often follow constant hazard rates (random failure).
  *   **7 (Hegemony):** Saved by **Minimum Robustness**. Narrow classes (industrial hegemons) have N<5; must widen to "all hegemons" to achieve statistical viability.
  *   **8 (Timing):** Saved by **Predictive Validity**. Inside-view work identifies the *valid* class (therapeutic area), but cannot adjust the probability *within* the class based on uniqueness claims.
  *   **9 (Class Size):** **Partial Failure.** "3 beats 400" is rejected unless the 3 are causally deterministic; "Refuse <15" is upheld as the default **Minimum Robustness** standard.

  **Unsavable Verdicts**
  *   **Case 9 (Contradiction):** You cannot hold that "3 beats 400" and "never <15" simultaneously. The principle dictates you must sacrifice the "3 beats 400" intuition unless the narrowing variable explains nearly 100% of the variance. High bias (tight class) is only preferable to high variance (loose class) when the biasing factor is proven causal.
  *   **Case 6 (Recall Intuition):** Your flip was correct, but your uncertainty ("I can't say why") is dangerous. The principle requires you to explicitly verify the hazard distribution before conditioning on survival. If you cannot verify the hazard rate, you must default to the base rate.

  **Verdicts on New Cases**
  *   **(a) Specific Person Survival:** Apply the **Hazard Stability** and **Predictive Validity** clauses. If the "exact condition" has well-actuarialized mortality data (validated narrowing), use the narrow class. If the condition is novel or data is sparse (N<15), revert to age/sex base rates adjusted by broad medical consensus. Do not condition on "clean history" unless the specific mortality hazard is known to decrease over time.
  *   **(b) New Technology Adoption:** No valid reference class exists. Apply **Minimum Robustness** to the closest analogy (e.g., "previous energy transitions"), but widen significantly to include failed analogs. Since narrowing criteria (e.g., "better tech") lack predictive validity for adoption without historical precedent, you must treat the forecast as a structural model rather than a statistical reference class, explicitly acknowledging the variance is unquantifiable.
