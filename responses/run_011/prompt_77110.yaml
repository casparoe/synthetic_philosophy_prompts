      *   *Case Tweak:* Make sure A and B are clearly distinguishable intuitively but mathematically symmetrical in a boolean count.
      *   *Closing Check:* Claim D needs to be "True on all observed features, false on the mechanism." Or something that highlights the language dependence. Let's go with a transformed variable (e.g., "Humidity" derived from Temp/Rain).

  8.  **Review against Constraints:**
