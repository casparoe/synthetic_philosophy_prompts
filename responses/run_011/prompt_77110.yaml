          1.  One false claim can be objectively closer to the truth than another (progress is coherent even if past theories are false).
          2.  The obvious way to measure this (scoring consequences against facts) fails principledly (Popper's collapse, language dependence).
      *   **Desired Outcome:** The problem remains intact and interesting, not refuted nor settled. Avoid reduction to predictive accuracy.
      *   **Provided Case:** Weather forecasting (Truth: Rain PM, 18°C, Thunder). Claim A (Rain PM, 17°C, No Thunder). Claim B (Snow AM, 18°C, Thunder). Claim C (Climatological Normal).
