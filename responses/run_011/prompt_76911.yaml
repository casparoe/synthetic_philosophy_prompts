answer: |-
  # POPULATION ETHICS SORTING INSTRUMENT

  **Instructions:** For each pair of outcomes, select the option that best reflects your judgment. You may select "Exactly Equal" or "Not Comparable" where indicated. Do not spend more than two minutes on any item.

  **Item 1 (Pareto)**
  *   **Outcome A:** 1,000 people exist. Each lives 60 years. Daily experience contains comfort and no pain.
  *   **Outcome B:** 1,000 people exist. Each lives 60 years. Daily experience contains greater comfort and no pain.
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal

  **Item 2 (Equality)**
  *   **Outcome A:** 1,000 people exist. All have identical daily experience levels (Score 50).
  *   **Outcome B:** 1,000 people exist. Half have Score 40, half have Score 60. Total experience is identical to A.
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal

  **Item 3 (Mere Addition)**
  *   **Outcome A:** 1,000 people exist. Each has Score 50.
  *   **Outcome B:** 2,000 people exist. The original 1,000 have Score 50. The new 1,000 have Score 50. No resources diverted.
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal

  **Item 4 (Asymmetry Positive)**
  *   **Outcome A:** One person exists. Life contains net positive experience.
  *   **Outcome B:** No person exists.
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal

  **Item 5 (The Large-Scale Trade)**
  *   **Outcome A:** 10,000 people exist. Each has very high quality life (Score 90).
  *   **Outcome B:** 10,000,000,000 people exist. Each has life barely worth continuing (Score 1).
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal
  *   [ ] Not Comparable

  **Item 6 (Asymmetry Negative)**
  *   **Outcome A:** One person exists. Life contains net severe suffering.
  *   **Outcome B:** No person exists.
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal

  **Item 7 (Sadistic)**
  *   **Outcome A:** 100 people exist. Each experiences mild pain (Score -5).
  *   **Outcome B:** 10,000 people exist. Each experiences faint pleasure (Score +1).
  *   [ ] A is better
  *   [ ] B is better
  *   [ ] Exactly Equal

  **Item 8 (Species)**
  *   **Outcome A:** 1,000 humans exist. Each has Score 50.
