  ***

  # SCORING KEY AND LOGICAL SPACE

  **Step 1: The Sceptical Leaf**
  If **Item 5** is answered "Not Comparable," assign **Sceptical Incomparabilism**. (Diagnosis: Rejects cardinal comparability across vast scales).
  *Note: If "Not Comparable" is selected elsewhere, treat as "Exactly Equal" for scoring, but flag for discussion.*

  **Step 2: The Species-Relativist Leaf**
  If **Item 8** is answered "A is better," assign **Species-Relativist View**. (Diagnosis: Values human experience over non-human experience independent of quality).
  *Repair:* If Item 1 (Pareto) was "Equal," this is **Incoherent** (contradicts universal betterment). Repair by changing Item 1 to "B is better."

  **Step 3: The Asymmetry Axis**
  Compare **Item 4** (Happy Creation) and **Item 6** (Miserable Creation).
  *   If Item 4 = "Equal" AND Item 6 = "B is better": Assign **Asymmetry View**.
  *   If Item 4 = "B is better": Assign **Anti-Natalist Leaf**. (Added: Your list omitted this, but Item 4/6 makes it reachable).
  *   If Item 4 = "A is better" AND Item 6 = "B is better": Proceed to Step 4 (Symmetric).
  *   *Inconsistency:* If Item 4 = "A is better" and Item 6 = "Equal" or "A is better." **Diagnosis:** Incoherent (fails to recognize suffering as bad). **Repair:** Change Item 6 to "B is better."

  **Step 4: The Negative Utilitarian Leaf**
  If **Item 7** (Sadistic) is answered "A is better" (Preferring small suffering group over large faint-pleasure group): Assign **Negative Utilitarianism**.
  *   *Conflict:* If Item 5 (Repugnant) was "B is better." **Diagnosis:** Unstable (accepts vast low-quality lives but rejects vast faint-pleasure lives). **Repair:** Change Item 5 to "A is better."

  **Step 5: The Person-Affecting Leaf**
  If **Item 3** (Mere Addition) is answered "Exactly Equal": Assign **Narrow Person-Affecting View**.
  *   *Conflict:* If Item 1 (Pareto) was "Exactly Equal." **Diagnosis:** Incoherent (denies Pareto principle). **Repair:** Change Item 1 to "B is better."

  **Step 6: The Total vs. Average/Critical Split**
  Look at **Item 5** (Repugnant).
  *   If "B is better" (Vast Low > Small High): Assign **Total View**.
      *   *Check:* If Item 9 (Duration) = "Equal," assign **Egalitarian Total View**.
  *   If "A is better" (Small High > Vast Low): Proceed to Step 7.

  **Step 7: Average vs. Critical Level vs. Variable Value**
  *   If **Item 3** (Mere Addition) = "A is better" (Addition makes it worse): Assign **Average View**.
  *   If **Item 3** = "Exactly Equal" (but Step 5 failed): Assign **Critical-Level View** (Threshold > Addition Quality).
  *   If **Item 3** = "B is better" (Addition good) BUT **Item 5** = "A is better" (Repugnant rejected): Assign **Variable-Value View** (Number-dampening).
      *   *Diagnosis:* This is the "Mere Addition Paradox" space. It is **Coherent but Unattractive** to strict aggregators, but defended by Parfit-style views.

  **Step 8: Equality and Maximin**
  *   If **Item 2** (Equality) = "A is better": Add **Egalitarian** modifier to current view.
  *   If **Item 7** (Sadistic) = "A is better" *because* the worst-off are better off in A: Assign **Maximin**. (Overrides Negative Util if Item 5 was "A is better").

  **Step 9: Lifetime and Status**
  *   If **Item 9** (Duration) = "A is better" (Many Short > Few Long): Assign **Per-Capita Priority**.
  *   If **Item 10** (Status) = "A is better" (Neutral > Wanted): Assign **Hedonic View**.
  *   If **Item 10** = "B is better": Assign **Desire-Based View**. (Added: Your list omitted this, but Item 10 reaches it).

  ***

  # LOGICAL SPACE DIAGNOSTICS

  **Unoccupied/Incoherent Combinations:**
  1.  **Item 1 "Equal" + Item 3 "Better":** *Incoherent.* If adding lives helps, improving existing lives must help more. Repair: Change Item 1 to "B is better."
  2.  **Item 6 "Equal" + Item 7 "A is better":** *Incoherent.* If creating a miserable life is neutral, mild suffering in a group cannot be worse than faint pleasure. Repair: Change Item 6 to "B is better."
  3.  **Item 5 "Better" (Vast Low) + Item 7 "Better" (Small Suffering):** *Incoherent.* Cannot prefer vast faint pleasure over small high quality, but prefer small pain over vast faint pleasure. Repair: Change Item 7 to "B is better."

  **The "Not Comparable" Answer:**
  *   **Diagnostic of:** Axiological Scepticism or Incomparability (specifically regarding scale).
  *   **Not Diagnostic of:** Indifference. (Indifference is "Exactly Equal").
  *   **Usage:** Only enabled on Item 5 to prevent overuse. If selected on Item 8 (Species), code as Species-Relativist but flag for discussion.

  **Indistinguishable Leaves:**
  1.  **Average View vs. Critical-Level View:** Both reject the Repugnant Conclusion and Mere Addition.
      *   *Extra Item Needed:* "1,000 people @ Score 50" vs "1,000 people @ Score 50 + 1 person @ Score 49." Average says Worse; Critical says Worse (if 49 < Critical); Total says Better. To separate Average from Critical: Ask about adding a life *above* the current average but *below* the critical level (if such a gap is theorized). *Correction:* Simply ask: "1,000 @ 50" vs "1,000 @ 50 + 1 @ 51." Average says Better. Critical says Better (if 51 > Critical). They are hard to separate without knowing the threshold. *Better Extra Item:* "1,000 @ 50" vs "1,000 @ 50 + 1 @ 10." Average says Worse. Critical says Worse. They track together on addition. They separate on *subtraction*.
  2.  **Total View vs. Egalitarian Total View:** If Item 2 (Equality) is not weighted heavily.
      *   *Extra Item Needed:* "1,000 @ 50" vs "1,000 @ 49 (all equal)." Total says Worse. Egalitarian Total says Better (due to equality).

  ***

  # ORDERING REASONING

  1.  **Item 1 & 2 (Warm-up):** Establishes baseline intuitions on Pareto and Equality without population change. Low cognitive load.
  2.  **Item 3 (Mere Addition):** Introduces population increase without quality change. Logical precursor to Item 5.
  3.  **Item 4 (Asymmetry Positive):** Establishes value of existence before testing limits.
  4.  **Item 5 (Repugnant):** **Must sit here.** Placed after Mere Addition (Item 3) so the logical tension is felt (if Addition is good, why not Repugnant?). Placed before Asymmetry Negative (Item 6) and Sadistic (Item 7) to avoid contamination by suffering-avoidance intuitions. If placed later, fatigue reduces reliability on the most complex item. If placed earlier, participants lack the "Addition" context.
  5.  **Item 6 & 7 (Suffering):** Grouped to test Negative Utilitarianism. Item 6 isolates individual suffering; Item 7 tests aggregation of suffering vs. pleasure.
  6.  **Item 8 (Species):** Placed late to allow "Universalist" answers on previous items to settle before introducing species distinction.
  7.  **Item 9 (Duration):** Abstract aggregation test. Best when participants are warmed up to "scores."
  8.  **Item 10 (Status):** Conceptual check on "Worth Living." Ends the quiz on a philosophical definition rather than a math problem.

  **Contamination Warnings:**
  *   **Item 3 contaminates Item 5:** This is intentional. Item 5 tests if the intuition from Item 3 holds at scale.
  *   **Item 6 contaminates Item 7:** Intentional. Item 7 tests if the intuition from Item 6 aggregates.
  *   **Item 1 contaminates Item 2:** Minimal. Pareto is stronger than Equality.
  *   **Item 5 contaminates Item 3:** If Item 5 is seen first, Item 3 becomes a "trap." Hence Item 3 precedes Item 5.

  **Unexplored Leaf:**
  *   **Discrete Prioritarianism:** (Giving weight to the worse off without strict Maximin). Your list included "Egalitarian Total" and "Maximin." If a participant chooses "A is better" on Item 2 (Equality) but "B is better" on Item 7 (Sadistic - preferring total pleasure over avoiding mild pain), they are Prioritarians, not Egalitarians or Maximin. I have added **Prioritarianism** to the scoring logic in Step 8 as a modifier. It belongs because it is the standard middle-ground between Utilitarianism and Egalitarianism in public health ethics.
