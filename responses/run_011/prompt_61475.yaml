  The tension you should bet the book on is between Baseline Stability (D5) and Social Disadvantage Recognition (D3). This is not a muddle; it is a genuine contradiction in the political economy of healthcare. A system designed to fix broken bodies cannot afford to fix broken societies, yet in a competitive culture, the disadvantage caused by lacking an enhancement is functionally identical to the disadvantage caused by a disability. If your tribunal admits this, the budget explodes; if they deny it, they become agents of coercion. That is not a problem to be solved, but a trap your characters must inhabit.
