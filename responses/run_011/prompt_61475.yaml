prompt: |-
  Right, so: I'm a novelist. I've been three years into a book set in a near-future Britain where a handful of biological and cognitive enhancements are legal but only partly covered by the NHS, and there's a standing tribunal that decides, case by case, whether something counts as treating a patient or enhancing one. Two of my main characters sit on opposite sides of that table. The trouble is I can write the arguments people actually make in the room — I'm good at that bit — but I can't tell which of those arguments are load-bearing and which are just noise, and I keep writing scenes where the same intuition gets used to support opposite conclusions by different characters, which reads as if I've lost control of the material rather than as if the material is genuinely contested.

  So before I write any more of those scenes I want the specification, not another opinion. Put yourself in the seat of a philosopher of medicine who has spent their whole career on the treatment/enhancement boundary and has zero patience for slogans. Think carefully, and start by brainstorming a long messy list of candidate requirements — twenty, thirty — and only then prune it, because I'd genuinely rather see what you threw out and why than a tidy list assembled for effect.

  Here's what I'm asking for. What does any account of the difference between treating someone and enhancing them have to deliver before it counts as adequate? I want the cases it has to get right (get right, not merely mention), the distinctions it isn't allowed to collapse, the facts about medicine and biology and ordinary clinical practice that it mustn't contradict, and the jobs it has to do outside the theory itself — it's going to be used by tired people in a room with a budget and a queue. For each requirement, the case or consideration that motivates it, because a requirement without a case behind it is just a preference. Then: which of them are actually non-negotiable and which are the pet commitments of one camp wearing a lab coat. And — the bit I most want — whether any pair or subset of them can't be satisfied together. If there's a contradiction sitting in the requirements themselves, I would much rather build the book on that than pretend it isn't there. Finally, tell me which single requirement, applied strictly, knocks out the most candidate accounts, because that's the one my characters should be fighting over.

  To keep you honest, these are the cases I'm already stuck on:

  - a cellist taking a beta-blocker so her hands stop shaking at the Wigmore, who insists she isn't ill, she's just not good enough on the day
  - a woman fourteen months into bereavement who meets no checklist for depression but hasn't managed a full working week since, and whose GP has prescribed something anyway
  - a healthy eight-year-old on the 3rd centile for height whose parents want growth hormone, and about whom nobody can say what's wrong, because nothing is
  - a cochlear implant for a Deaf adult who has never heard and doesn't want one, versus an implant for a child who lost her hearing after meningitis: same device, opposite intuitions
  - a lorry driver on modafinil to stay awake through a legal shift, and his mate on the identical pill to learn Portuguese faster
  - a firm where every associate takes the same cognitive enhancer, so the applicant who doesn't is now below what passes for normal for that job and nobody has moved
  - contraception and vaccination, which everyone wants counted as neither, or as treatment, depending on which argument they're running
  - spectacles and hearing aids, which are enhancements under any literal description and treatments under everyone's intuition
  - an athlete sleeping in a hypoxic tent versus the same athlete injecting EPO, where the difference is supposed to consist in... what, exactly?
  - a character who was fine, then got better than fine, and now can't go back without it counting as a loss

  Some of the distinctions I suspect are being run together and shouldn't be: normal function versus statistical normality; being harmed versus being below baseline; the natural versus the artificial; the level of a capacity versus the moral significance of that level; an individual's baseline versus a population's; what's wrong with a condition in itself versus what's wrong with having it in this particular society. Add any I've missed.

  Score the main contenders against your list at the end, but briefly — a few sentences each, not a seminar. I mean the broad families: the view that leans on species-typical or normal biological function; the view that says the line is real but does no moral work, so we should be talking about wellbeing and distribution instead; the view that says there's no line at all and 'enhancement' is just a word for the technologies we haven't normalised yet; and whatever position you think the tribunal in my book is actually operating with when it says yes to the hearing aid and no to the growth hormone.

  No reading list, no citations, no paper titles, no names of thinkers — I can't check any of it and it would only be decoration. Cases and concepts only. British English throughout, including inside the JSON values.

  Give me the answer as a single JSON object with exactly these fields:

  - `adequacy_relative_to`: one sentence saying what a theory here has to be good enough *for*, since I expect 'adequate' shifts with the job
  - `desiderata`: array of objects, each with `id` (D1, D2, ...), `name`, `demand` (what the theory must deliver, no more than three sentences), `motivating_case` (the concrete case behind it, from my list or one of your own), `why_required`, `status` (one of `non-negotiable`, `camp-preference`, `contested`), `status_reason`, and `excludes` (short list of the kinds of view this requirement alone rules out)
  - `distinctions_not_to_collapse`: array of objects with `pair` and `what_goes_wrong_if_collapsed`
  - `tensions`: array of objects with `ids` (the two or more desiderata that can't be had together), `kind` (one of `outright contradiction`, `satisfiable only by cheating`, `empirically unstable over time`), `why`, `who_gives_way`, and `dramatic_use` (one sentence on what a novelist could do with it)
  - `most_exclusionary`: object with `id` and `why`
  - `discarded`: array of objects with `requirement`, `why_it_seemed_necessary`, `why_it_fails` — this is the pruning pile, don't skip it
  - `scorecard`: array of objects with `position`, `satisfies` (ids), `fails` (ids), `verdict` (two sentences max)
  - `best_scene`: object with `case`, `colliding_ids`, and `why` — which single case makes the requirements visibly break, and would therefore carry a whole chapter

  After the JSON, and only after it, a short paragraph in plain prose on the one tension you'd bet the book on, and say whether you think it's a genuine contradiction in the subject or just a seperate problem I've muddled together with a real one.
