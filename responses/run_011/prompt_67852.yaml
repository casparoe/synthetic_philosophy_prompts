  Arthur is strapped into a diagnostic rig where hydraulic cuffs constrict his limbs in proportion to an engine's internal pressure, causing genuine physical pain, while a microphone captures his vocalisations to adjust the relief valve; he learns through operant conditioning that shouting 'pressure critical' reduces the constriction, so he produces fluent, apt warnings whenever the cuffs tighten, physically grounded in the very force he describes yet treating the utterance merely as a lever to alleviate suffering rather than a symbol to convey information.

  Beatrice sits in a quiet room miles away, receiving the same engine data as abstract numbers on a screen without any physical sensation of the heat or force, and she speaks 'pressure critical' into a comms unit solely to inform the maintenance team of the risk, possessing no sensory coupling to the machinery yet deploying the phrase with the intent to refer to the state of the engine for the benefit of another mind.

  **Show Your Work**

  **Verdicts:** On the form-only argument (refined by Bender & Koller), Arthur does not understand. Despite his rich sensory grounding (pain, pressure), his utterances are causal reflexes aimed at environmental manipulation (stopping the pain), lacking communicative intent. Beatrice does understand. Despite her impoverished sensory grounding (mere symbols on a screen), her utterances are illocutionary acts aimed at sharing information within a speech community.

  **The Single Feature:** The deciding feature is **Communicative Intent** (the intention to induce a mental state in another via convention), not Physical Grounding.

  **Deleting the Feature:** If you delete communicative intent from Beatrice's scenario (e.g., she is also paid per word and treats the phrase as a mere token to gain currency, indifferent to the engine's state), her verdict flips to 'no understanding'. If you add communicative intent to Arthur's scenario (e.g., he shouts to warn a colleague despite the pain increasing), his verdict flips to 'understanding'. The physical grounding remains constant in both modifications, proving it is not the decisive factor.

  **Opposition Attack:** An embodiment theorist will attack by claiming Arthur's pain *constitutes* meaning; he knows 'pressure' because he feels it, whereas Beatrice only manipulates empty symbols. They will argue that without the sensory qualia, Beatrice is merely simulating understanding.

  **Bender & Koller Anticipation:** Bender & Koller anticipate the 'robot' objection (that sensors solve the problem) and reject it, arguing that sensors without communicative intent yield only causal coupling, not meaning. This case sharpens their position by removing the 'machine' variable: Arthur is human and feels pain, yet still fails the understanding test because he lacks the communicative frame. This survives their reply by demonstrating that even biological grounding is insufficient without the social contract of language.
