prompt: |-
  I co-chair a working group at the high school my kid goes to — we're rewriting the discipline policy to replace most suspensions with some kind of restorative process — and one of the other members is a school counselor who keeps dropping the same line into every discussion: guilt says I did something bad, shame says I am bad. It's become a conversation-ender. On Tuesday she used it twice, once to argue that our circles should never ask a kid to apologize in front of the whole group because public apology produces shame and shame is a verdict on the self rather than on the act, and once to argue that the reason the old policy felt so brutal is that we've been running a shame culture by default and we could just choose not to — you design for guilt, you get guilt. Another member pushed back and said no, you don't get to pick, whether a group runs on shame or guilt is downstream of things like how big the group is, how much people's reputations follow them around, and whether they can walk away, and she waved that off with the slogan again. I left feeling like at least four different claims got smuggled through under one sentence and I couldnt say what any of them were.

  Can you lay out the distinct precise theses that sentence could be standing for? I want the whole spread — the readings that are true but trivial, the ones that are substantive and defensible, the ones that are flat-out false or not even testable, and the ones that sound like psychology but are really claims about our moral concepts. For each, say what exactly it's claiming (about what the emotion is directed at, whose gaze it answers to, whether it's global or specific, whether it requires the idea of a violated obligation, whether the audience is real or imagined or internalized) and give me a verdict. I'd especially like to know on which readings shame really is the worse emotion, and on which the slogan flips and makes guilt look like the more heteronomous one — I have a vague memory of an argument that guilt just means you've swallowed an authority figure whole and installed it as a judge, which if that's right would wreck her whole use of the line.

  Then tie it back to the meeting. Which reading or readings would actually get her from the slogan to never make apologies public, and to a group can choose to be a guilt culture? Which ones, if they're the true ones, leave her with nothing at all? And which is she most likely using without realizing it, given how she deploys it. I want something I can print and hand around: numbered readings with a one-line verdict each, then a short section at the end on the culture-choice question — what would have to be true for choosing to be a guilt culture to even be a coherent option rather than a wish. No reading list or citations please, I'm definately not getting through any books before Thursday, just give me the analysis.
