prompt: |-
  Retired biologist here — 35 years running a physiology lab, and now I've got a philosophy reading group in the back room of our library, 12 of us, mostly retirees, one Saturday morning, 90 minutes. Next up is Sen's liberal paradox and I dont want to lecture about it, I want them to walk into it. So design a game we can actually play with index cards and a whiteboard, tokens instead of money, where everyone has honest fixed preferences, each person gets handed some tiny domain they're the sole authority over, and the group then can't rank the outcomes without either going in circles or steamrolling somebody's domain. I need the card contents, how many profiles, the round structure with timings, the scoring, and a debrief that pins each thing they felt to the condition in the theorem that produced it.

  Two extras. Give me a control run — same game, no private domains — so I can show the circles aren't just an artifact of my dealing. And as far as I understand it the whole thing only works if somebody cares about what happens in another person's domain, which makes my players look like busybodies; tell me how to hand out preferences that are decent and still do the work. Then tell me what breaks the first time I run it, including whether a clever retiree can just refuse to rank something and dodge the paradox on purpose, and be straight with me about which part of the theorem a card game can't reproduce.
