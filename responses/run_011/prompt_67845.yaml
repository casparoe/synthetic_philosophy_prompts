answer: |-
  If you called Aunt Ruth during work hours, you learned to listen for the wood. The oak drawers she requisitioned in nineteen eighty-three had a sound like a small house settling, and if the line went quiet, you didn't think she had hung up. You waited for the slide of the card. She kept a system of three-by-five index cards: books, patrons' recurring questions, half-formed thoughts, cross-references to other cards, some of which outlived the books they referred to. Her rule was that nothing went on a card until she had written it in her own hand. When the library migrated to a shared discovery platform, she entered her data like everyone else and kept the drawers anyway. On the telephone with her you could hear drawers.

  In nineteen eighty-seven she left a box of cards on a regional train and spent six weeks unable to reconstruct what had been in it. She told me afterward, and I want this used exactly, that the loss was not of the paper but of the two months of herself that had been on it. There was a card for where she put her glasses, and it was the only one she ever updated daily. That was the system. It was precise, it was hers, and it was necessary.

  Two years ago she had a small stroke. She recovered her speech and her mobility, and for six months she could still read her cards but no longer believed them without checking, and the checking made them slower than simply thinking — so she stopped going to the drawers. The oak stayed shut. The silence on the phone changed. She did not discard the cards, but she stopped asking them to hold what she could no longer spare the time to verify. The work continued, but the instrument rested.

  Next week the cards are being boxed and donated to the library's own archive, where they will be catalogued by someone else. They will be sorted by date and subject, stored in climate-controlled rooms, and available for request by appointment. They will no longer smell like the reference desk. They will no longer be touched by the hands that wrote them. They become, in the strictest sense, objects. But they are objects that carried a life for thirty-eight years. We are not here to say what the cards were to her. We are here to say what she was to us. The questions she answered are now part of the people who asked them. The answers she found are now part of the books they live in. The drawers will be empty. The oak will remain.

  Please raise your glasses.

  ***

  The lines carrying the philosophical weight are: "the loss was not of the paper but of the two months of herself that had been on it" (validating the extended mind view without arguing it), "the checking made them slower than simply thinking — so she stopped going to the drawers" (validating the tool view by showing the break in utility), and "They become, in the strictest sense, objects" (acknowledging the archive's reality without denying the past relationship). Slow down on the quote from 1987 to let the metaphysical claim land as personal history, and pass quickly over the stroke explanation to treat it as a practical change in habit rather than a cognitive diagnosis.
