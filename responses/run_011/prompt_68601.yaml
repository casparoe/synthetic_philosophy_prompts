answer: |-
  Here is the account you asked for. It is not a theory of vision, nor a theory of language, but a theory of *recognition*.

  ### I. The Principle

  **The Principle of Systemic Functional Recognition**

  A mark constitutes an instance of letter $L$ if and only if a competent reader, engaging with the mark within a specific orthographic system, assigns it the functional value of $L$. This assignment holds provided that three conditions are met:

  1.  **Distinctive Invariance:** The mark retains the minimal topological features required to distinguish $L$ from its immediate neighbors within that specific system.
  2.  **Attribution of Intent:** Deviations from the expected form are interpreted by the reader as variance in performance or medium, rather than as a signal of systemic contrast.
  3.  **Contextual Stability:** No explicit contextual marker (such as a mode switch or a surrounding word) overrides the default assignment.

  This principle argues that a letter is not a shape, but a *job* that a shape is hired to do within a specific community of readers. The "thing that survives" is not a line or a curve, but the successful completion of that job.

  ### II. The Mapping

  Here is how the three clauses of the principle deliver your verdicts, clause by clause.

  **Clause 1: Distinctive Invariance**
  *This clause handles the geometry. It demands that the letter keep enough of itself to not become its neighbor.*
  *   **Double-story vs. Single-story 'a' (same family):** Pass. The distinction between 'a' and its neighbors (like 'o' or 'e') is preserved in both forms.
  *   **Single-story 'a' in phonetics:** Fail. In the IPA system, the single-story and double-story shapes are assigned to different phonemes. They are neighbors in that system, so they cannot be the same letter.
  *   **Double-story minus arc:** Pass. It remains distinct from 'o' and 'e'.
  *   **Single-story minus stem (circle):** Fail. It loses the feature that distinguishes it from 'o'. Distinctive invariance is broken; it becomes a broken 'o'.
  *   **Rotated 'a' vs. Rotated 'O':** The 'a' fails because orientation is a distinctive feature for 'a' (distinguishing it from 'e' or 'ə'). The 'O' passes because its symmetry makes orientation non-distinctive. The clause tracks the symmetry of the letter in question, exactly as you noted.

  **Clause 2: Attribution of Intent**
  *This clause handles the human element. It asks: Did the writer mean to change the system, or did they just slip?*
  *   **Child's reversed 'a':** Pass. The reader attributes the reversal to motor error (performance). The systemic intent remains 'a'.
  *   **Script reversed 'a':** Fail. If a script uses the reversal consistently, the reader attributes it to design (systemic contrast). It is now a different letter.
  *   **Stencil, Hairline, Graffiti, Blackletter:** Pass. All are attributed to stylistic or medium constraints, not a change in the alphabetic slot.
  *   **Capital 'A' vs. Lowercase 'a':** Pass. The reader understands case mapping as a rule of the system, not a change in letter identity. They are different uniforms for the same worker.
  *   **Latin 'H', Greek Eta, Cyrillic En:** Fail. These belong to different orthographic systems. The intent is to write in Latin, Greek, or Russian. The shape is identical, but the job is different.

  **Clause 3: Contextual Stability**
  *This clause handles the environment. It acknowledges that the mark alone is often insufficient.*
  *   **Braille dot:** Pass/Fail depending on indicator. The number indicator is an explicit contextual marker that reassigns value from letter to digit.
  *   **3x5 Bitmap (alone):** Fail. Without context, Distinctive Invariance is too low to assign a value. It is indeterminate.
  *   **3x5 Bitmap (in word):** Pass. The surrounding letters constrain the possibilities. Only 'a' yields a word. Context stabilizes the assignment.
  *   **Interpolated 'a'/'e':** Pass/Fail. Alone, it fails Distinctive Invariance (it is equidistant). In a font context, the surrounding glyphs force the reader to normalize the ambiguous glyph to fit the system. You settle on 'a' because the system demands it.
  *   **Left half of 'æ':** Fail. It is a component, not a functional unit. It cannot do the job of 'a' alone in that system.

  ### III. The Cost

  You asked which verdicts a simpler principle would overturn. A simpler principle would be **Shape Essentialism**: *"A letter is defined by its core geometric topology."*

  If you adopt Shape Essentialism, you gain economy but lose the ability to explain half your cases.
  *   **Overturned:** The Latin/Greek/Cyrillic 'H' would become the *same* letter (they share shape). The Phonetics 'a' would become the *same* letter (shape matches). The Child's Reversed 'a' might become a *different* letter (topology is mirrored).
  *   **The Loss:** This is not worth paying. Shape Essentialism cannot account for reading. We do not read shapes; we read systems. If your piece argues that categorization happens in the open, it must acknowledge that the "openness" is in the *agreement between reader and writer*, not in the ink.

  However, there is one verdict of yours that *my* principle overturns, and you should consider whether to keep it.
  *   **The Verdict:** *"I can call a genuine 'a' wrong-looking when it is dropped into a typeface it does not belong to... a judgment I am perfectly confident in, and which seems to be about the letter and not about anything else."*
  *   **The Overturn:** My principle brackets this. It says this judgment is about *Style Consistency*, not *Letter Identity*. If the glyph is recognized as 'a' (Clause 1 & 2), it *is* an 'a'. That it looks "wrong" in the font is a judgment of aesthetic fit, not categorical identity.
  *   **The Trade:** If you keep your verdict, you are arguing that "Letter" includes "Style." If you accept my correction, you argue that "Letter" is functional, and "Style" is decorative. For a piece on categorization, I recommend the correction. It sharpens the spine. The "wrongness" you feel is the friction of a system detecting an outlier, not a failure of the letter to be itself.

  ### IV. The Hypotheticals

  You asked for predictions on three specific edge cases. Here is what the Principle of Systemic Functional Recognition dictates.

  **1. The Unique Mark (Dead Designer)**
  *Case:* A mark drawn exactly once, in a style nobody else has ever used, by a designer who has since died and left no specimen book.
  *   **Prediction:** It is **not a letter**.
  *   **Reasoning:** It fails Clause 2 (Attribution of Intent) and Clause 3 (Contextual Stability). Without a living community of readers to recognize the intent, or a system to contextualize it, it remains a mark. A letter requires a circuit of communication. If the designer is dead and the code is lost, the circuit is broken. It is a fossil of a letter, not a letter.

  **2. The Context-Dependent Glyph**
  *Case:* A glyph that is determinately an 'a' for everyone who saw it in its original font but becomes ambiguous the moment it is cut out and shown alone.
  *   **Prediction:** It **remains an 'a'**, but its *legibility* is context-bound.
  *   **Reasoning:** This confirms Clause 3. The identity of the letter is not destroyed by isolation; rather, the *evidence* for its identity is removed. Your principle should state that the letter resides in the *potential for recognition* within the correct system. When cut out, it is a letter in exile. It retains its identity historically, but functionally it is dormant until returned to a system.

  **3. The "Wrong-Looking" Genuine 'a'**
  *Case:* A genuine 'a' dropped into a typeface it does not belong to.
  *   **Prediction:** The principle **brackets this**.
  *   **Reasoning:** As noted above, this is a judgment of *set coherence*, not *graphemic identity*. However, to absorb your intuition: The principle can acknowledge that readers use *style* as a heuristic for *intent*. When an 'a' looks wrong in a font, the reader momentarily questions Clause 2 (Attribution of Intent). *"Did the designer mean for this to be an 'a', or is this a glitch?"* If the reader decides it is a glitch, it is still an 'a' (a broken one). If they decide it is a different design, it is an intruder. Your confidence comes from your expertise in type systems; you are detecting a violation of the system's internal logic. The principle accounts for this by treating "Typeface" as a sub-system of "Orthography." The 'a' is valid in the Orthography, but invalid in the Typeface.

  ### V. The Spine

  Your piece asks what survives when every 'a' is laid end to end.
  The answer, according to this account, is **nothing physical**.
  No line, no curve, no angle survives.
  What survives is a **promise**.

  The promise is that the writer has made a mark intended to occupy a specific slot in a shared system, and the reader agrees to honor that intention despite the ravages of hand, tool, or medium. The "a-ness" is not in the ink. It is in the handshake.

  If you write this, you must be prepared to tell your editor that the piece is not about shapes. It is about trust. The humblest category survives not because it is rigid, but because it is forgiving. It allows the child's scrawl and the blackletter manuscript to shake hands across centuries, provided they both agree on the job to be done.

  That is the argument.
