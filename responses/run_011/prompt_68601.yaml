          *   *Economy:* Gains simplicity, loses nuance on human perception vs. rigid coding.
      *   *Hypothetical 1: The Unique Mark (Dead Designer).*
          *   *Prediction:* If no one can read it, it fails Clause 2 (Contrastive Stability/Recognition). It is a *potential* letter, not an *actual* one. It requires a reader to complete the circuit.
      *   *Hypothetical 2: Context-Dependent Glyph.*
