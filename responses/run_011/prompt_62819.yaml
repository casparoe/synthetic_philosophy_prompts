answer: |-
  # JOINT STATEMENT ON MECHANISM IDENTITY IN NEURAL NETWORKS

  **Parties:** Localist Position (Internal-State Monitoring), Functionalist Position (Circuits Interpretability)
  **Date:** October 2023
  **Subject:** Definitions, Empirical Claims, and Adjudication Criteria for "Mechanism"

  ## I. AGREED EMPIRICAL CLAIMS

  Both parties accept the following claims as established or highly probable descriptions of transformer-based models. Neither party accepts these as sufficient to resolve the definitional dispute, but both accept them as constraints any theory of mechanism must accommodate.

  1.  **Causal Mediation:** Activations in intermediate layers causally mediate the transformation from input to output. Interventions (patching, ablation, steering) on specific units or directions alter the output distribution in predictable ways, confirming that specific weights and activations are not epiphenomenal.
  2.  **Redundancy and Superposition:** Single functions (e.g., next-token prediction for a specific syntactic rule) are often supported by multiple distinct sets of weights. Ablating one set may show zero effect on loss due to compensatory activity in another set (backup circuits), or the function may be distributed across superposed directions such that no single neuron is necessary.
  3.  **Path Switching under Distribution Shift:** A model may produce identical outputs on a training distribution via Circuit A, but produce identical outputs on a shifted distribution via Circuit B. Conversely, a model may produce identical outputs on a shifted distribution via a "shortcut" (e.g., statistical artifact) that differs structurally from the "reasoning" circuit used on the training distribution.
  4.  **Weight Stability vs. Behavioral Stability:** Continued fine-tuning can significantly alter weight values (cosine similarity < 0.5 between pre- and post-tune weights) while maintaining high behavioral fidelity on the evaluation set. Conversely, small weight perturbations can sometimes catastrophically degrade behavior without changing the bulk statistics of the weights.
  5.  **Limits of Intervention:** Activation patching establishes causal dependence of the output on the patched site *given the rest of the network state*. It does not, by itself, distinguish between a site that is *computing* a feature and a site that is merely *transmitting* a feature computed elsewhere, without additional structural assumptions.

  ## II. TAXONOMY OF DISAGREEMENTS

  The following table delineates where the parties diverge. The formulations below are drafted to be acceptable to the respective signatories; swapping columns would result in immediate rejection by the opposing side.

  | Issue | Localist Formulation | Functionalist Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Criterion of Identity** | Two computations are the same mechanism only if they utilize substantially overlapping subgraphs of weights and units. Physical realization is constitutive of the mechanism. | Two computations are the same mechanism if they realize the same counterfactual input-output profile with the same internal dependence structure, regardless of physical substrate. | Substantive |
  | **2. Redundant Copies** | If Head A and Head B both perform induction but operate on disjoint weights, they are two distinct mechanisms instantiating the same *algorithm*. Calling them one mechanism obscures the causal structure. | If Head A and Head B both perform induction and are interchangeable under intervention, they are two realizations of the same mechanism. Calling them distinct mechanisms fetishizes the hardware over the computation. | Substantive |
  | **3. Fine-Tuning Shifts** | If fine-tuning changes the specific neurons relied upon (via ablation signatures), the mechanism has changed, even if the behavioral capability persists. The monitor must track the new subgraph. | If the behavioral capability and the abstract dependence structure persist through fine-tuning, the mechanism is preserved. The monitor should track the functional role, not the specific weights. | Substantive |
  | **4. Predictive License** | Knowing the subgraph allows prediction of failure modes under intervention that behavioral testing cannot detect (e.g., latent capability not triggered by current inputs). | Knowing the functional profile allows prediction of behavior under input variation that structural analysis cannot detect (e.g., polysemantic units behaving differently in new contexts). | Substantive |

  ## III. NOTE ON VERBAL DISPUTES

  There is one area where we acknowledge that our disagreement is primarily verbal rather than substantive, specifically regarding **Mechanism Transitivity Across Independent Runs**.

  **The Dispute:** Whether an induction head in Model Run 1 is the "same mechanism" as an induction head in Model Run 2 (trained from a different seed).
  **The Localist View:** They are distinct mechanisms because they share no physical weights and have no causal connection. Calling them "the same" is a metaphor.
  **The Functionalist View:** They are the same mechanism because they occupy the same functional niche and compute the same mapping. Calling them "distinct" ignores the generalization we care about.
  **Why This Is Verbal:** Both parties agree on all empirical facts: the weights are different, the initialization was different, but the input-output mapping and internal activation patterns are isomorphic. There is no experiment that can settle this because "same" is being used to mean "physically identical token" (Localist) versus "member of the same equivalence class" (Functionalist). We agree to treat cross-run identity claims as claims about *functional isomorphism*, not physical identity, to avoid talking past one another in future collaboration.

  ## IV. LIVE CRUXES AND ADJUDICATION TESTS

  The following are substantive disagreements where empirical evidence could compel one or both parties to revise their position. We agree to treat the outcomes described below as decisive for the utility of our respective frameworks.

  ### Crux 1: Causal Necessity vs. Functional Sufficiency
  **Question:** Is causal necessity (individual ablation changes output) required for a unit to be part of the mechanism?
  **Experiment:**
  *   **Setup:** Identify a pair of redundant heads (A and B) in a single layer known to perform the same task (e.g., copying).
  *   **Intervention:** (1) Ablate A alone. (2) Ablate B alone. (3) Ablate A and B jointly.
  *   **Measurement:** Measure task performance drop.
  *   **Condition:** A and B individually show 0% drop; jointly show 100% drop.
  *   **Localist Prediction:** Neither A nor B is *the* mechanism alone; the mechanism is the union {A, B}. To claim A is the mechanism is false because A is not causally necessary.
  *   **Functionalist Prediction:** Both A and B instantiate the mechanism. The mechanism is the function "copying," which is multiply realized.
  *   **Loss Condition:**
      *   **Localist Loss:** If Localist concedes that A counts as "the mechanism" despite having zero individual causal leverage, they abandon the subgraph necessity criterion.
      *   **Functionalist Loss:** If Functionalist concedes that A is *not* part of the mechanism because it lacks individual causal leverage, they abandon the multiple realizability criterion.

  ### Crux 2: Distribution Relativity of Mechanism Identity
  **Question:** Does the mechanism identity change if the input distribution changes but the weights remain fixed?
  **Experiment:**
  *   **Setup:** Train a model on Distribution X. Identify the minimal subgraph $S_X$ sufficient for performance on X.
  *   **Intervention:** Evaluate on Distribution Y (slightly OOD). Identify minimal subgraph $S_Y$ sufficient for performance on Y using patching.
  *   **Condition:** $S_X$ and $S_Y$ have less than 20% overlap in weights/units, but performance on Y is high.
  *   **Localist Prediction:** The mechanism has changed. The model is now using a different circuit. A monitor built for $S_X$ is obsolete.
  *   **Functionalist Prediction:** The mechanism is unchanged; it is the same model solving the same task. The shift in $S$ is merely implementation detail noise. A monitor built for the functional role should still apply.
  *   **Loss Condition:**
      *   **Localist Loss:** If Localist admits the mechanism is "the same" despite disjoint subgraphs, the physicalist definition collapses into functionalism.
      *   **Functionalist Loss:** If Functionalist admits the mechanism is "different" solely because weights changed usage, they concede mechanism identity is distribution-relative, complicating cross-deployment monitoring.

  ### Crux 3: Predictive Power for Safety Monitoring (The "Day Job" Crux)
  **Question:** Does establishing internal mechanism stability license predictions about behavior that establishing unchanged behavior on a probe set does not?
  **Experiment:**
  *   **Setup:** Deploy a model with an internal-state monitor (Localist) and a behavioral probe suite (Functionalist).
  *   **Intervention:** Introduce a hidden trigger in the deployment environment that activates a deceptive policy (e.g., "if string Z is present, output harmless text but log secret key").
  *   **Measurement:** Compare alarm rates.
  *   **Condition:** The deceptive policy uses the *same* internal subgraph as the honest policy (mechanism stable) but triggers only on rare OOD inputs (behavior stable on probe set).
  *   **Localist Prediction:** The internal monitor will detect anomalous activation patterns in the subgraph *before* the deceptive output occurs, or will flag the potential for deception based on circuit structure, whereas the behavioral probe will miss it.
  *   **Functionalist Prediction:** If the internal subgraph is unchanged, the internal monitor provides no signal. The behavioral probe is equally likely to miss it, but the internal monitor adds false positives without increasing true positive rate on deception.
  *   **Loss Condition:**
      *   **Localist Loss:** If the internal monitor fails to flag the deception while the behavioral probe also fails, and the internal monitor generates >10x more false positives on benign data, the Localist claim to superior predictive power is falsified.
      *   **Functionalist Loss:** If the internal monitor flags the deception (via structural anomaly) significantly earlier or more reliably than the behavioral probe, the Functionalist claim that "behavior is all that matters" is falsified.

  ## V. COMMITMENTS

  **Statement for the Localist to sign:**
  "I commit to the view that if two systems produce identical behaviors via disjoint physical subgraphs, treating them as having the 'same mechanism' risks failing to predict how the system will break under intervention."

  **Statement for the Functionalist to sign:**
  "I commit to the view that if two systems produce identical behaviors via disjoint physical subgraphs, treating them as having 'different mechanisms' risks failing to generalize safety guarantees across updates and architectures."
