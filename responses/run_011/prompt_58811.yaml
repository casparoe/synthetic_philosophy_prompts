  # The Welfare Sorting Instrument

  **Instructions:** Start at Node 1. Answer **Yes** or **No** based on your immediate intuition about the case. Do not consult theory. Proceed to the indicated node. Record your final Leaf Position.

  ### Node 1: The Cerebellum
  **Case:** A human cerebellum contains >50% of the brain's neurons but surgical removal leaves reported experience largely intact.
  **Question:** Does this tissue warrant welfare protection against invasive harm?
  *   **Yes:** Go to **Node 2**.
  *   **No:** Go to **Node 3**.

  ### Node 2: The Single Neuron
  **Case:** A single isolated human neuron fires adaptively in a dish.
  **Question:** Does this single cell warrant welfare protection?
  *   **Yes:** **LEAF A: Panpsychist View.**
  *   **No:** **LEAF B: Integration View.**

  ### Node 3: The Crab
  **Case:** A crab reliably abandons a shelter where it was shocked, with a nervous system lacking any vertebrate-like pallium.
  **Question:** Does the absence of a pallium rule out anaesthesia for this procedure?
  *   **Yes:** Go to **Node 4**.
  *   **No:** Go to **Node 6**.

  ### Node 4: The Anencephalic Child
  **Case:** A child born without a cerebral cortex nonetheless tracks faces and shows distress and comfort.
  **Question:** Do we deny anaesthesia to this child due to the missing cortex?
  *   **Yes:** **LEAF C: Higher-Order View.**
  *   **No:** Go to **Node 5**.

  ### Node 5: The Reef Fish
  **Case:** A small reef fish passes mark tests and then directs scraping at the mark.
  **Question:** Does passing this test grant *higher* protection than the crab?
  *   **Yes:** **LEAF D: Global Workspace View.**
  *   **No:** Go to **Node 9**.

  ### Node 6: The Octopus Arm
  **Case:** An octopus whose arm ganglia solve local problems while the animal is asleep.
  **Question:** Does the arm deserve protection independent of the central brain?
  *   **Yes:** Go to **Node 7**.
  *   **No:** Go to **Node 8**.

  ### Node 7: The Robot Replica
  **Case:** A robot perfectly mimics the octopus arm's problem-solving behavior.
  **Question:** Does the robot deserve the same welfare as the arm?
  *   **Yes:** **LEAF E: Behaviour-Only Pragmatist.**
  *   **No:** **LEAF F: Agnostic View.**

  ### Node 8: The Fruit Fly
  **Case:** A fruit fly whose central complex supports route navigation and whose behaviour changes after an injury we would call painful in a human.
  **Question:** Do we treat this injury as 'pain' requiring anaesthesia?
  *   **Yes:** **LEAF F: Agnostic View.**
  *   **No:** **LEAF G: Deflationary View.**

  ### Node 9: The Alien System
  **Case:** An alien organism shows identical distress behavior to the child but has silicon-based neuroanatomy.
  **Question:** Do we grant it the same welfare protection?
  *   **Yes:** **LEAF E: Behaviour-Only Pragmatist.**
  *   **No:** **LEAF F: Agnostic View.**

  ---

  ### Leaf Positions & Analysis

  | Leaf | Position Name | Path to Reach |
  | :--- | :--- | :--- |
  | **A** | **Panpsychist View** | Node 1 (Yes) → Node 2 (Yes) |
  | **B** | **Integration View** | Node 1 (Yes) → Node 2 (No) |
  | **C** | **Higher-Order View** | Node 1 (No) → Node 3 (Yes) → Node 4 (Yes) |
  | **D** | **Global Workspace View** | Node 1 (No) → Node 3 (Yes) → Node 4 (No) → Node 5 (Yes) |
  | **E** | **Behaviour-Only Pragmatist** | Node 1 (No) → Node 3 (No) → Node 6 (Yes) → Node 7 (Yes) **OR** Node 9 (Yes) |
  | **F** | **Agnostic View** | Node 1 (No) → Node 3 (No) → Node 6 (Yes) → Node 7 (No) **OR** Node 8 (Yes) **OR** Node 9 (No) |
  | **G** | **Deflationary View** | Node 1 (No) → Node 3 (No) → Node 6 (No) → Node 8 (No) |

  ---

  ### Unoccupied Combinations

  *   **Node 6 (Yes) → Node 8:** *Unexplored.* (If the arm counts, why test the fly? Logically consistent but skips the substrate check).
  *   **Node 4 (Yes) → Node 5:** *Incoherent.* (If the human child without a cortex is denied protection, testing a fish for cortical markers is irrelevant; welfare is already restricted to cortex-havers).

  ---

  ### Indistinguishable Leaves & Required Evidence

  **Pair 1: Leaf E (Pragmatist) via Node 7 vs. Leaf E (Pragmatist) via Node 9.**
  *   **Status:** *Functionally Identical.*
  *   **Evidence to Separate:** None. Both endpoints grant welfare based on behavior regardless of substrate (biology vs. silicon vs. ganglia). The tree routes them differently to test *which* case triggered the pragmatism (invertebrate vs. alien).

  **Pair 2: Leaf F (Agnostic) via Node 7 vs. Leaf F (Agnostic) via Node 8 vs. Leaf F (Agnostic) via Node 9.**
  *   **Status:** *Philosophically Distinct but Welfare-Identical.*
  *   **Evidence to Separate:** Ask the member: "If we discover the mechanism, would you withdraw protection?"
      *   *Node 7 No (Biology matters):* Would withdraw if robot.
      *   *Node 8 Yes (Precautionary):* Would keep even if mechanism is simple.
      *   *Node 9 No (Substrate matters):* Would withdraw if silicon.
      *   *Current Tree Limitation:* The tree classifies them together because their *current* welfare decision is identical (Protect), despite different metaphysical reasons.

  ---

  ### Design Notes for the Committee

  1.  **Disagreement Discovery:** Members who both select **Leaf F (Agnostic)** may believe they agree. The "Indistinguishable Leaves" analysis reveals they may disagree fundamentally on *why* they protect (Precaution vs. Substrate Essentialism). This prevents false consensus.
  2.  **Case Decisiveness:** A member who protects the **Cerebellum (Node 1)** is sorted into Panpsychism or Integration before they ever consider the **Crab (Node 3)**. This reveals that their disagreement with a colleague isn't about crustaceans, but about human neuroanatomy.
  3.  **Speed:** Each node presents a single concrete image/scenario. No theory names appear in the questions. A member can answer based on "gut check" moral intuition, which the tree then maps to the theoretical commitment they are implicitly holding.
  4.  **The "Child" Lever:** Node 4 is the ethical stress test. Choosing **Yes** (Deny child anaesthesia) forces the member into **Leaf C (Higher-Order)**. This makes the cost of that theoretical position explicit: it requires denying care to a distressed human infant. Many will switch to **No** here, moving them to **Leaf D (Global Workspace)**, revealing that their view on fish is actually a view on human subcortical function.
