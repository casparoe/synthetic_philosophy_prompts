answer: |-
  ### Candidate Rules and Eliminations

  To predict your advisor's verdict, we must reverse-engineer the logic from his eleven previous rulings. Here are the four most common definitions of life tested against his verdicts:

  1.  **Metabolism Required:** A system must actively process energy and matter to maintain itself.
      *   **Killed by:** The **Tardigrade** (Alive with no measurable metabolism) and the **Red Blood Cell** (Not alive despite having glycolysis). This rule cannot distinguish between a paused organism and a dying cell fragment.
  2.  **Reproduction Required:** A system must be capable of producing offspring.
      *   **Killed by:** The **Mule** (Alive despite sterility). This rules out strict reproductive necessity for individual aliveness.
  3.  **Darwinian Evolution (NASA Definition):** A self-sustaining chemical system capable of Darwinian evolution.
      *   **Killed by:** The **Obligate Endosymbiont** (Not alive as an individual). The endosymbiont has genetics, variation, and selection (it evolves within the host), yet your advisor ruled it "not alive" individually. This also struggles with the **Phage in buffer** (capable of evolution, but ruled not alive).
  4.  **Autopoiesis / Metabolic Closure:** A system must produce the very components (including its boundary) that constitute the system, from basic precursors, maintaining a distinct organizational closure.
      *   **Status:** **Surviving.** This fits the **Endosymbiont** verdict (lacks autonomy/closure), the **Phage** (does not make its own coat), the **RBC** (cannot reproduce components), and the **E. coli** (synthesizes self from broth). It accommodates the **Tardigrade** as a system with *dispositional* closure (the organization persists to resume production).

