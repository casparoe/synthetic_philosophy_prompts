answer: |-
  Consider Elias, a prolific but notoriously散漫 painter who lives entirely in the present moment, forgetting commissions, dates, and even his own past motivations within weeks, yet his studio manager, Sarah, maintains a flawless, chronological archive of his work, correspondence, and public statements that successfully predicts his behavior and secures his legacy. Sarah knows Elias's life story better than Elias does, correcting his mistaken memories at parties with documented evidence, and when people interact with Elias, they rely on Sarah's briefing to understand who he is supposed to be today. Elias feels like a series of disconnected impulses, but the world interacts with a coherent character named Elias that Sarah sustains through logs, schedules, and curated interviews, meaning the organized narrative that constitutes his identity exists primarily in her files and her head rather than his own.

  From the narrative-gravity view, the self is exactly where the story holds together, so in this case, the self of Elias is largely located in Sarah's archive because that is where the center of gravity actually resides. Dennett would say there is no little man inside Elias's skull pulling the levers, only a story that allows us to predict behavior, and since Sarah is the one writing and maintaining that story with higher fidelity than Elias, she is hosting the self. Someone defending psychological continuity would argue that the self remains inside Elias because he is still the one feeling the brushstrokes and having the experiences, regardless of who files the receipts, because consciousness is a biological event that cannot be outsourced. They do disagree on the location and constitution of the self, with one seeing it as a distributed informational pattern and the other as a private stream of consciousness. The single feature doing all the work here is the superior organizational authority of the external archive compared to the internal memory. If you delete that feature and make Elias's own memory just as sharp as Sarah's, the gravity snaps back inside his head because the narrative competence returns to the organism.

  This case is actually exactly what Dennett's view predicts rather than a problem for it, because it proves the self is not a physical object you can find in the brain but a function of how information is organized and used. If the organization happens outside the skull, the self is effectively externalized, which confirms Dennett's claim that the self is an abstraction like a center of gravity rather than a tangible thing. I am reading Dennett with a strong emphasis on the communal aspect of narrative construction, assuming that the teller of the story matters just as much as the subject, which sharpens the point that the self is not privately owned.
