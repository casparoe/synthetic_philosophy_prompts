      Your editor's decisions commit to the claim that the harm of a slur resides not in the word itself, nor in the speaker's intent, but in the reader's inability to reliably distinguish between a character's voice and the author's endorsement. This is a theory of **legible distance**. The slur is permitted only when the text provides sufficient cues to assure the reader that the author does not own the word.

      Under this theory, the foreman's usage survives because villainy is easily coded; his hate creates a safe buffer between him and you. The teenager's usage is cut because reclamation is subtle, and on the silent page, affection is indistinguishable from appropriation. The risk is that a reader will attribute the word to you, not him. This explains the audiobook exception: vocal prosody instantly signals intent, collapsing the ambiguity that plagues the text. It also explains the paratexts: jacket copy and reviews are authored by the publisher or critic, not your characters. There is no fictional buffer there; using the word would constitute direct endorsement by the platform.

