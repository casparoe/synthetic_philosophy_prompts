answer: |-
  **Recommended Vote**
  **Accept the collection and the digitization funding, but decline the joint public relations campaign and donor branding.**

  **Reasoning from Record**
  This vote adheres to the stewardship mandate established in **2018 (Welfare Files)** and **2021 (Trooper Notebooks)**: when the Society is the only viable custodian for records documenting the exercise of power over vulnerable populations, we accept them, even if the subjects did not consent, provided we mitigate harm. Here, the subjects are deceased, and the descendant community explicitly desires preservation, satisfying the privacy concerns that motivated the sealing in 2018 and the redaction in 2021.

  However, the conditions attached to the offer trigger the precedent set in **2023 (Redevelopment Director)**. In that case, the Committee accepted the papers of a controversial official but refused the donor's money for an exhibit and imposed a moratorium on donor-influenced interpretation to prevent the archive from becoming a tool for reputational rehabilitation. The Health Department's request for a joint announcement, the Director's speaking slot, and branding on the landing page during an active lawsuit constitutes a similar attempt to curate a legacy. We must separate the *preservation* of the record from the *narrative* of the donor. We accept the digitization grant because it serves the physical survival of the record (a neutral archival function), but we must reject the branding and joint campaign because they serve the donor's public image (an interpretive function).

  **Closest Analog and Where It Breaks**
  **Closest Analog:** **2023 (Redevelopment Director Papers).**
  Both cases involve government-adjacent records documenting the displacement or regulation of a population (urban renewal then, sanitary inspection now). Both donors sought to attach their brand to the collection to soften historical or current controversy. In 2023, the Committee drew a line at "jointly funded exhibits" and donor control over the finding aid.

  **Where the Analogy Breaks:**
  In 2023, the rejected funding was for an *exhibit* (interpretive). Here, the funding is for *digitization* (preservation/access). In 2023, rejecting the money did not threaten the physical survival of the papers. Here, the minutes note we have "no money for digitization and no conservator." Glass plates are chemically unstable; without digitization and conservation, the record may be lost. 2023 established that we will not sell our narrative independence, but it did not establish whether we may accept "tainted" money if the alternative is the physical destruction of the collection.

  **Candidate Principles Consistent with the Five Decisions**
  To govern future offers, the Committee is jointly committed to the following principles, derived from the five contested decisions:

  1.  **The Stewardship of Power Principle:** The Society is the default custodian for unique records documenting the exercise of institutional power over marginalized populations (2016, 2018, 2021, 2023), even if the records were created without the subjects' consent.
  2.  **The Living Veto Principle:** If a living subject or immediate family objects to the accession of personal records, the offer is declined, regardless of historical value (2019). If subjects are deceased, privacy is managed via restriction (seal/redaction) rather than rejection (2018, 2021).
  3.  **The Narrative Independence Principle:** The Society may accept records from donors seeking reputational rehabilitation, but it must not accept funding or conditions that allow the donor to control the public interpretation, branding, or exhibit narrative of the collection (2023).

  *Testing against 2018 and 2021:*
  *   **2018 (Welfare):** Fits Principle 1 (gov power records) and Principle 2 (living children protected by seal, not rejection).
  *   **2021 (Trooper):** Fits Principle 1 (unique record of power) and Principle 2 (living subjects protected by redaction).
  *   **Gap:** None of the five decisions explicitly resolve whether *preservation* funding (as opposed to *interpretive* funding) is subject to Principle 3.

  **Prediction of Colleagues' Principles on Future Offers**
  *   **Colleague A (The Absolutist Archivist):** "Historical uniqueness trumps donor motive. We are a vault, not a judge."
  *   **Colleague B (The Community Advocate):** "If the donor uses us to whitewash harm, or if a community group can hold it, we decline. We do not legitimize oppressors."

  | Hypothetical Future Offer | Colleague A's Resolution | Colleague B's Resolution |
  | :--- | :--- | :--- |
  | **1. The Police Pilot:** Local PD offers 1990s body-cam test footage. Unique record. PD wants to use the accession to prove "we have always valued transparency." | **Accept.** The footage is unique. The PD's motive is irrelevant to the record's value. | **Decline.** The accession is being weaponized to deflect current criticism. Send to university archive if they want it. |
  | **2. The Developer's Plaque:** A developer offers architectural plans for a historic building they are demolishing. They require a plaque in the lobby reading "Preserved by [Developer Name]." | **Accept.** The plans are the record. The plaque is external to the archive. | **Decline.** Accepting makes us complicit in the demolition. We do not archive destruction for a fee. |
  | **3. The Hate Group Ledger:** A current political advocacy group (accused of extremism) offers their membership ledgers to "show they are misunderstood." No restrictions. | **Accept.** Truth is the goal. If they are misunderstood, the ledgers will show it. | **Decline.** Providing a platform legitimizes the group. The risk of harm outweighs the historical value. |

  **Commitment and Sacrifice**
  *   **If We Vote to Accept (with conditions):** We commit to being the guardian of uncomfortable history, even when the donors are uncomfortable with how that history is viewed. We sacrifice a smooth relationship with the Health Department and risk them withdrawing the digitization grant if we refuse the branding. We accept the burden of conserving the material without their PR goodwill.
  *   **If We Vote to Decline:** We commit to ethical purity and community autonomy over institutional preservation. We sacrifice the record itself. The neighborhood group lacks the climate control and conservators to save the glass plates; declining likely means these images are destroyed or lost to vinegar syndrome. We prioritize the *politics* of the donation over the *survival* of the evidence.

  **Underdetermination and Discriminating Hypothetical**
  Our precedents genuinely **underdetermine** the specific question of **tainted preservation funding**.
  Principle 3 (Narrative Independence) was tested in 2023 against *exhibit* funding. We established that we will not sell our *story*. We have not established whether we will sell our *shelves*. If a donor offers to fund the fire suppression system required to keep *all* collections safe, but demands their name on the building, is that a violation of Principle 3? 2023 suggests yes (no donor mark on the finding aid), but 2018 suggests we must preserve the record at almost any cost.

  To discriminate between the principle of **"Independence at Any Cost"** (2023 extended) and **"Stewardship at Any Cost"** (2018 extended), the Committee should consider the following hypothetical offer:

  > **The Discriminating Hypothetical:** A private corporation with a history of environmental violations in the county offers to fully endow the Society's new climate-controlled storage wing, which is required to prevent the degradation of our existing 3,400 linear feet of holdings. The endowment requires the wing be named after the corporation, but imposes no restrictions on access or interpretation of the collections stored within.

  *   **If we Accept:** We prioritize **Stewardship**. We acknowledge that infrastructure is neutral and that saving the existing collection outweighs the reputational benefit to the donor. This would justify accepting the Health Department's digitization grant even with branding attached.
  *   **If we Decline:** We prioritize **Independence**. We assert that *any* branding, even on infrastructure, implicates the Society in the donor's reputation. This would require us to decline the Health Department's digitization grant if they insist on branding, even if the photos degrade.

  Until we resolve this, my recommendation remains to **Accept the collection and funding, but negotiate to remove the branding.** If the Department refuses to decouple the money from the branding, we must vote to **Accept the money and the branding with a public disclaimer**, prioritizing the survival of the record (2018) over the purity of our independence (2023), as the loss of the record is irreversible, whereas the reputational risk can be managed through context.
