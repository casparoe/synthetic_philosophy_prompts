      *(Refining P5)*: P5 says "Lead with LCOE". P4/P8 decisions are based on CapEx timing (P6) and System Resilience (P8). LCOE smooths CapEx over time and ignores system value. So P5 misrepresents the actual decision logic in P4/P6/P8.

      *Ranking:*
      1. P3 vs P1/P7 (Principle vs Verdict).
