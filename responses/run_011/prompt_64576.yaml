prompt: |-
  I am a senior analyst at a European climate-policy institute. Ahead of a debate our Brussels office is hosting on whether the EU should treat new nuclear as a pillar of the transition, I have been asked to publish a short personal position statement, and I would like a rigorous consistency audit of the package before it goes out. I am not looking for a brief on the nuclear question, for advocacy in either direction, or for citations and reading lists — I want to know whether my own commitments can all be held at once, and if not, what I have to stop saying.

  Here is the package as it currently stands.

  1. The binding constraint on energy policy is the remaining carbon budget. Options should be scored by tonnes of CO2e avoided per euro spent and per year of delay, and I put a heavy premium on abatement that actually arrives before 2035 rather than on abatement that arrives eventually.
  2. Risk regulation should be proportionate to measured harm. I compare generation technologies on realised harm per terawatt-hour — fatalities, land take, material throughput, waste arisings — rather than on intuitions about acceptability, and I think a regulator who cannot say what a technology's harm rate is has no business restricting it. On that accounting nuclear sits at the clean end of the table alongside wind and solar.
  3. I nonetheless hold that Germany's exit was the right call, that it was defensible in 2011 on the information available then, and that I would defend it today to a room of German policymakers.
  4. A net-zero system needs firm, dispatchable capacity to cover multi-day winter lulls, and my candidate list is hydrogen-capable gas plant, long-duration storage, more interconnection, and contracted demand response. Nuclear is not on that list, chiefly because of capital cost and construction time. At the same time I oppose new long-life unabated fossil infrastructure on lock-in grounds, so anything gas-fired that gets built has to be genuinely convertible and on a credible path out of fossil operation.
  5. In my published work I lead with levelised cost, because it is the only cost metric that the people who sign things will actually read. Integration and system costs go in a footnote.
  6. Timing disqualifies new build. On the evidence of Olkiluoto 3 and Flamanville 3, first power arrives a decade or more after the decision is taken, which is after the window in which it could matter; the same money buys far more if spent on grids, storage, and flexibility. I would say no even to a proposal in which the developer carried all of the cost and schedule risk.
  7. I am firmly against closing operating, licensed reactors early. Life extension is close to the cheapest abatement available anywhere, and Belgium's decision to keep Doel 4 and Tihange 3 running for another decade was the right one.
  8. France's reliance on nuclear for roughly two-thirds of its generation is a resilience liability rather than an asset. One operator, essentially one design family, and in 2022 a single failure mode — stress corrosion cracking — took much of the fleet out of service, cut nuclear output to a thirty-year low, and left France a net importer of electricity for the first time since 1980. That is a kind of risk I take very seriously and that I do not think shows up anywhere in the numbers we normally publish.

  Please treat this as an audit rather than a lecture. Specifically:

  - Identify the commitments that genuinely pull against one another and rank them by severity, most damaging first. For each, state precisely what follows from what, what has to be given up or qualified, and what the cheapest revision costs me — including whether the revision is a change of view or only a change in what I am willing to publish.
  - Distinguish these from pairs that merely look inconsistent and dissolve once the relevant distinction is drawn, and say what that distinction is. I expect at least one of my tensions to be of this kind, but I do not want you to reassure me by classifying things as merely apparent unless they really are.
  - Point out premises that are doing unacknowledged work — places where one of my conclusions follows from my stated commitments only given an assumption I have not listed.
  - Tell me which single revision would buy the most coherence across the whole set, and what I would lose by making it.
  - Where my own stated criteria cannot deliver one of my own case verdicts, say so explicitly and show the gap rather than patching it with a consideration imported from outside my list.

  I have deliberately not told you which of these I would be most willing to abandon, because I do not know, and I would rather the audit not be steered by my expectations.

  Two things about your own confidence, please. For each tension you identify, say how sure you are that it is real rather than an artefact of how I have phrased my commitments. And at the end, single out the one claim in your audit that you are least confident in, say why it is shaky, and say what evidence or argument would settle it.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **User Role:** Senior analyst at a European climate-policy institute.
      *   **Task:** Rigorous consistency audit of a personal position statement package (8 points) regarding EU nuclear policy.
      *   **Goal:** Determine if commitments can be held simultaneously. If not, identify contradictions, rank severity, suggest revisions, identify hidden assumptions, and find the single most effective revision for coherence.
      *   **Constraints:** No advocacy, no brief on nuclear, no citations/reading lists. Focus *only* on internal consistency.
      *   **Specific Output Requirements:**
          *   Identify genuine conflicts (ranked by severity).
          *   Distinguish genuine conflicts from apparent ones (dissolvable by distinction).
          *   Point out unacknowledged premises.
          *   Identify the single revision buying the most coherence.
          *   Highlight where stated criteria fail to deliver case verdicts.
          *   Confidence assessment for each tension.
          *   Identify the least confident claim in the audit and why.

  2.  **Analyze the Position Package (The 8 Points):**
      *   *P1 (Carbon Budget/Speed):* Binding constraint is carbon budget. Score by tCO2e/€/year. Heavy premium on abatement before 2035.
      *   *P2 (Risk/Harm):* Regulation proportional to measured harm (fatalities, land, waste, etc.). Nuclear is clean/low harm compared to others. Regulators need data.
      *   *P3 (Germany Exit):* Germany's exit was right/defensible in 2011 and today.
      *   *P4 (Firm Capacity):* Need firm/dispatchable capacity (H2-gas, storage, interconnection, DR). Nuclear *not* on list (cost/time). No new unabated fossil (lock-in). Gas must be convertible.
      *   *P5 (Cost Metric):* Lead with LCOE (Levelised Cost of Energy). System/integration costs in footnotes.
      *   *P6 (Timing/Construction):* New build disqualified by timing (Olkiluoto/Flamanville examples). >10 years to first power. Money better spent elsewhere. Would say no even if developer took risk.
      *   *P7 (Life Extension):* Against closing operating reactors early. Life extension is cheap abatement. Belgium's extension was right.
      *   *P8 (France/Resilience):* France's high nuclear share is a resilience liability (common mode failure, 2022 output drop). Risk not shown in standard numbers.

  3.  **Cross-Examination & Conflict Detection:**

      *   *Tension A: P1 (Speed/Budget) vs. P6 (Timing/New Build) vs. P7 (Life Extension).*
          *   P1 says abatement before 2035 is premium.
          *   P6 says new nuclear takes >10 years (post-2035), so reject it.
          *   P7 says keep existing reactors (abatement now).
          *   *Consistency:* P1, P6, and P7 are actually quite consistent *internally* regarding time. New = too slow. Existing = fast/cheap.
          *   *Conflict:* P6 says "same money buys far more if spent on grids, storage..." This implies opportunity cost. P7 says life extension is "close to the cheapest abatement available anywhere." If life extension is the cheapest, why is P6 so dismissive of *any* nuclear spend? P6 rejects new build even if developer takes risk. This seems consistent with P1 (speed).
          *   *Wait, check P4:* P4 rejects nuclear for firm capacity due to cost/time. P7 accepts nuclear for baseline due to cost/abatement. This is a "New vs. Existing" distinction. Seems manageable.

      *   *Tension B: P2 (Risk/Harm Data) vs. P8 (France/Resilience Risk).*
          *   P2 claims regulation should be based on *measured harm* (fatalities, waste, etc.) and that nuclear sits at the clean end *on that accounting*.
          *   P8 claims France's reliance is a liability due to *systemic risk* (common mode failure, stress corrosion) that "does not show up anywhere in the numbers we normally publish."
          *   *Conflict:* P2 asserts nuclear is low risk based on standard metrics. P8 asserts nuclear has high risk based on metrics *not* in standard numbers.
          *   *Severity:* High. P2 undermines the empirical basis of P8. If P8 is true (hidden systemic risk), P2's claim that regulators can judge based on "measured harm" is compromised because the harm *isn't* measured in the standard table P2 references.
          *   *Resolution:* P2 needs to acknowledge that "measured harm" currently excludes systemic grid resilience risks, or P8 needs to be framed as a specific grid architecture issue rather than a technology harm issue.

      *   *Tension C: P3 (Germany Exit) vs. P7 (Life Extension/Belgium).*
          *   P3: Germany exit (closing operating reactors) was right.
          *   P7: Closing operating reactors early is wrong (Belgium extension was right).
          *   *Conflict:* Direct contradiction in verdict on closing operating reactors.
          *   *Nuance:* Germany (2011/2022) vs. Belgium (2023+). Context differs (Fukushima shock vs. Energy Crisis).
          *   *Severity:* High. It looks like political expediency rather than principle. P1 (Carbon Budget) makes P3 harder to defend. If carbon budget is binding (P1), closing low-carbon assets (Germany) violates P1 unless safety (P2) overrides it. But P2 says nuclear is low harm. So why was Germany right?
          *   *Hidden Premise:* Political feasibility or social license is a valid constraint in P3 but not acknowledged in P1 or P2.

      *   *Tension D: P5 (LCOE) vs. P4/P8 (System Costs/Resilience).*
          *   P5: Lead with LCOE. System costs in footnotes.
          *   P4: Rejects nuclear because it doesn't fit firm capacity needs (a system cost/integration issue).
          *   P8: Rejects high nuclear share due to resilience (a system cost/integration issue).
          *   *Conflict:* P5 marginalizes the exact metrics (system costs, integration) used to justify the conclusions in P4 and P8.
          *   *Severity:* Medium-High. It creates a rhetorical vulnerability. You are using footnote arguments to drive headline conclusions.

      *   *Tension E: P6 (Developer Risk) vs. P4 (Lock-in).*
          *   P6: Would say no to new nuclear even if developer carried *all* cost/schedule risk.
          *   P4: Opposes unabated fossil due to lock-in.
          *   *Analysis:* If developer takes all risk, why say no? P6 says "same money buys far more... on grids." This is an opportunity cost argument (P1). This is consistent.
          *   *Wait:* P6 says "Timing disqualifies." P1 says "Abatement before 2035." If a reactor could be built faster (SMR?), P6 says "On evidence of Olkiluoto..." This is an empirical bet.
          *   *Conflict:* None really, just strong empirical claims.

      *   *Tension F: P2 (Harm Rates) vs. P3 (Germany Exit).*
          *   P2: Regulators shouldn't restrict if they can't quantify harm. Nuclear harm is low.
          *   P3: Germany exit was right (restriction/closure).
          *   *Conflict:* If nuclear harm is low (P2), closing plants (P3) increases harm (via fossil substitution usually). P1 says carbon budget is binding. P3 violates P1 and P2 unless "political stability" is a higher value.
          *   *Severity:* Very High. This is the core ideological tension.

  4.  **Drafting the Audit - Section by Section:**

      *   **Genuine Conflicts (Ranked):**
          1.  *P3 (Germany) vs. P1 (Carbon) & P2 (Harm) & P7 (Belgium).* This is the biggest hole. P1 says carbon is binding. P2 says nuclear is safe. P7 says keep nukes open. P3 says close nukes (Germany). Why?
          2.  *P2 (Measured Harm) vs. P8 (Unmeasured Resilience Risk).* P2 relies on standard metrics. P8 admits the real risk isn't in those metrics.
          3.  *P5 (LCOE focus) vs. P4/P8 (System/Resilience conclusions).* You are making system-level decisions but promising to lead with unit-cost metrics.

      *   **Apparent Conflicts (Dissolvable):**
          1.  *P6 (No New) vs. P7 (Keep Old).* Distinction: Marginal cost of extension vs. Capital cost of new build. Economics distinguish these clearly.
          2.  *P4 (Gas allowed) vs. P1 (Carbon Budget).* Distinction: Transitional bridge vs. Lock-in. P4 qualifies gas as "convertible" and "credible path out."

      *   **Unacknowledged Premises:**
          1.  *Political/Social License:* P3 (Germany) only makes sense if "public acceptance" is a binding constraint equal to carbon or safety. This isn't in P1 or P2.
          2.  *Grid Architecture vs. Technology:* P8 critiques a *system* (centralized French grid) but applies it as a mark against the *technology* in other contexts implicitly.
          3.  *Opportunity Cost Certainty:* P6 assumes grids/storage *will* arrive faster. This is an assumption, not a measured fact like Olkiluoto delays.

      *   **Single Best Revision:**
          *   Qualify P2 or P3.
          *   Actually, modifying P3 is the hardest politically. Modifying P2 is technically honest.
          *   *Best Revision:* Modify P5. Acknowledge that LCOE is insufficient for the decisions made in P4 and P8.
          *   *Wait, looking for coherence:* The biggest tension is P3 (Germany) vs P7 (Belgium) vs P1 (Carbon).
          *   *Revision:* Qualify P3. Acknowledge Germany was a political necessity, not a technical/climate optimum. This aligns P3 with P1/P2/P7 by admitting a hierarchy of values (Politics > Climate in 2011 Germany).
          *   *Alternative Revision:* Qualify P2. Admit "measured harm" excludes systemic resilience.
          *   *Decision:* The P3 contradiction is the most damaging to credibility as an analyst. It looks like partisan alignment. Revising P3 to acknowledge the climate cost buys coherence with P1 and P7.
          *   *Wait, the prompt asks for "Single revision would buy the most coherence".*
          *   If I change P5 (admit LCOE is limited), it validates P4 and P8 better.
          *   If I change P3 (admit Germany was suboptimal for climate), it validates P1 and P7.
          *   If I change P2 (admit metrics miss resilience), it validates P8.
          *   *Winner:* Revising **P2** to acknowledge that "measured harm" currently excludes systemic resilience risks (P8). This bridges the gap between the "nuclear is safe" claim and the "French system is risky" claim without abandoning the core safety stance or the specific critique of France.
          *   *Actually, looking closer at P3:* P3 is the outlier. P1, P2, P4, P5, P6, P7, P8 are technocratic. P3 is political.
          *   *Let's reconsider:* The prompt asks what I have to *stop saying*.
          *   If I keep P3, I must admit P1 isn't the *only* binding constraint.
          *   If I keep P1, P3 is hard to defend.
          *   *Most Coherence:* Revising **P3**. Acknowledge Germany's exit increased near-term emissions (violating P1) but was necessary for social license (new constraint). This makes the package honest.
          *   *Wait, let's look at P5 vs P4/P8.* P5 says "Lead with LCOE". P4/P8 reject/qualify nuclear based on *non-LCOE* factors (timing, resilience). This is methodological hypocrisy.
          *   *Recommendation:* Revise P5. State that LCOE is the headline, but system costs drive the decision.
          *   *Let's go with the P3 vs P1/P7 conflict.* It's the most glaring "say one thing, do another" element.
          *   *Actually, the P2 vs P8 conflict is more technical.* P2 says "look at the numbers." P8 says "the numbers are wrong."
          *   *Okay, I will rank P3 vs P1/P7 as #1 Severity.* It undermines the analytical framework.
          *   *I will rank P2 vs P8 as #2 Severity.* It undermines the risk methodology.
          *   *I will rank P5 vs P4/P8 as #3 Severity.* It undermines the communication strategy.

      *   **Least Confident Claim in Audit:**
          *   I need to pick one finding I'm least sure about.
          *   Probably the assessment of P6 (Timing). I am assuming grids/storage *will* be faster. That's an external assumption.
          *   Or the severity ranking of P3. Maybe the user *wants* to hold the political reality line.
          *   I'll select the claim about P2/P8 resolution. Whether "resilience" counts as "harm" in a regulatory sense is debatable.

  5.  **Refining the Output:**
      *   Tone: Professional, rigorous, audit-style. No fluff.
      *   Structure: Follow the prompt's bullet points exactly.
      *   Confidence Levels: Assign % or qualitative confidence to each tension.
      *   Least Confident Claim: Identify clearly at the end.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "P3 is political." I need to show *why* it conflicts with P1 (Carbon Budget). If Carbon is binding, Germany's exit (mostly replaced by coal/gas initially) violated the binding constraint. P3 defends the violation. P1 says don't violate.
