  **Project Title: Admissible Orderings and the Ranking Problem in Conditionally Convergent Gambles**

  **The Research Question**
  The Pasadena Game demonstrates that conditionally convergent payoff series lack a unique expectation value under standard summation. The rearrangement theorem implies the set of possible values is the entire real line. This proposal shifts the inquiry from asking "what is the value?" to asking: "Which orderings of a gamble's outcomes are admissible for the purposes of ranking it against other gambles, and can that notion of admissibility be cashed out without smuggling in a summation rule you were supposed to be deriving?" The corollary is that decision theory requires a transitive, dominance-respecting ranking preorder, which need not originate from a real-valued expectation. The project seeks to determine whether a non-circular criterion for admissible orderings exists that yields a unique ranking for the Pasadena Game.

  **Background and Gap**
  Four standard responses to the Pasadena paradox leave this question open. First, truncation at toss *N* respects temporal order but relies on an arbitrary stopping rule that lacks normative force for the infinite case. Second, declaring that the expectation simply fails to exist is verdictively acceptable but theoretically costly; it abandons the completeness of the preference ordering without explaining why the temporal ordering should not rescue it. Third, abandoning real-valued expectations for comparative notions often sidesteps the ordering problem rather than solving it, leaving the agent unable to rank the gamble against sure outcomes. Fourth, dismissing the game as pathological ignores the structural lesson: if expectation theory fails here, the failure conditions must be precisely mapped. None of these positions address whether the temporal description of the game constrains the admissible permutations of the payoff series independently of the summation rule.

  **Work Plan**
  The four-month buy-out will proceed as follows. Month one will focus on toy cases: finite truncations of the alternating harmonic series and simple alternating series with bounded payoffs. These models allow for explicit calculation of ranking preorders under varying permutation constraints without the measure-theoretic complexity of the full game. Month two will formalise candidate criteria for admissibility, specifically testing temporal constraints against causal independence conditions. Month three will stress-test these criteria against dominance and transitivity requirements, constructing counterexamples where admissible orderings yield conflicting rankings. Month four will be dedicated to writing the chapter, synthesising the impossibility results or the characterisation theorem.

  **Expected Output and Failure Modes**
  A positive result would take the form of a theorem characterising the set of admissible orderings that yields a unique ranking preorder consistent with dominance. Alternatively, a rigorous impossibility proof demonstrating that any non-circular admissibility criterion collapses into one of the standard four moves would be a significant contribution. Specific failure modes are identified: the admissible set collapsing to a single value (triviality); the ranking turning out intransitive or dominance-violating; the analysis collapsing back into "there is no expectation"; or the circularity worry, where the admissibility criterion presupposes the value it aims to derive.

  **Relevance to Statistical Practice**
  To the statistician who views this as a parlour game: the concern is not empirical playability but the structural integrity of the decision calculus. Expectation is the engine of cost-benefit analysis, risk assessment, and policy modelling. If the engine yields contradictory outputs for well-defined inputs due to order-dependence, the reliability of any model relying on infinite horizons or unbounded utilities is compromised. We do not study paradoxes to play them, but to locate the boundary conditions where our tools cease to function. A ranking rule that holds for pathological cases ensures coherence for the ordinary cases where approximations are used.

  **Scope and Contingencies**
  The project is scoped for a single researcher in one term. If the panel signals the project is too big, the generalisation to other conditionally convergent series will be cut. The focus will remain strictly on the alternating harmonic structure of the Pasadena Game. Deep measure-theoretic foundations will also be pared back in favour of philosophical argument and finite modelling. The core question—admissibility of ordering—will remain intact, but the mathematical generality will be reduced to ensure a deliverable chapter.

