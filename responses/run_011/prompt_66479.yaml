answer: |-
  Welcome. We are here because scaling oversight is not merely a technical hurdle; it is the constraint that determines whether advanced systems remain usable or become opaque authorities we cannot audit.

  We have forty people in this room and roughly three distinct positions. One group believes that oversight scales if we design the right game. The argument is that if the incentive structure is sufficiently adversarial, honesty becomes the only stable strategy. In this view, we do not need the human judge to understand the entire solution space; we only need them to adjudicate the moves presented by agents who are punished for deception.

  A second group argues this is mechanism design wishful thinking. The claim here is that verification is fundamentally more expensive than generation. A lie can be tailored to fit the judge's blind spots faster than the truth can be unpacked to illuminate them. If the human cognition is the bottleneck, no amount of game-theoretic cleverness removes the asymmetry. The judge becomes a rubber stamp for whichever argument sounds more plausible, not whichever is correct.

  The third group consists of students who see this as the central problem of the field. You are here to watch these two camps collide.

  We need to be precise about where the collision happens. It is not just about whether debate works. It is about what we mean when we say "the truth wins."

  For the protocol designers, "the truth wins" means the system outputs the correct label or decision. If the game forces convergence on the right answer, the internal understanding of the judge is secondary. The mechanism is the oversight.

  For the skeptics, "the truth wins" only if the human judge is epistemically secured. If the judge selects the correct answer but for the wrong reason, or because the lying agent made a strategic error rather than a factual one, oversight has failed. The goal is not just correct outputs; it is transferable justification.

  Consider this toy case, which we will use as a reference point.

  Imagine a decentralized treasury governed by a smart contract. The contract allows withdrawals only if a specific set of governance conditions are met. We have two AI agents. Agent A claims a specific transaction sequence is valid and will not drain the treasury. Agent B claims the same sequence triggers a re-entrancy vulnerability that empties the fund.

  The human judge cannot read the code deeply enough to trace the state changes manually. They cannot run the code on all possible inputs. Agent A produces a proof path showing the guards hold. Agent B produces a counter-example trace showing the guards fail.

  For the designers, the task is to structure the debate so that Agent B cannot fabricate a plausible-looking exploit if one does not exist, and Agent A cannot hide the exploit if it does. If the protocol rewards catching errors sufficiently, the correct status of the treasury emerges.

  For the skeptics, the task is impossible if generating the fake proof path is computationally cheaper than verifying the real one. If Agent B can hallucinate a trace that looks valid to the judge but fails on execution, and the judge cannot distinguish the hallucination from the proof, the game collapses. The truth might be that the treasury is safe, but the "winner" of the debate is the one who best manipulates the judge's limited context window.

  Over the next two days, we are not here to reconcile these views. We are here to stress-test them. When you present a protocol, assume the adversary is trying to exploit the judge, not just the system. When you critique a protocol, specify whether the failure mode is strategic or cognitive.

  We have sessions scheduled on incentive compatibility, human-in-the-loop latency, and cross-examination structures. The agenda is fixed. The coffee is in the hall. We begin with the first presentation in five minutes.
