answer: |-
  This is a precise and philosophically fertile observation. You have identified a specific failure mode in the resolution of verbal disputes. While the components of this pattern are well-trodden in the philosophy of language, the specific *dynamic* you describe—the resistance to dissolution via a realist shift that invites regress—does not have a single canonical label.

  Here is the carving you requested: the nearest established concepts, their limitations, the principled termination of the regress, and a coinage for the phenomenon itself.

  ### 1. Nearest Established Concepts

  **A. Merely Verbal Dispute (Carnap, Chalmers)**
  *   **The Concept:** A dispute where parties agree on all non-linguistic facts but disagree on the application of a term. The standard remedy is "semantic ascent": restate the claims without the contested term to reveal the agreement.
  *   **The Fit:** This describes your Level 1 dispute perfectly.
  *   **The Miss:** Standard theory assumes that once the verbal nature is exposed, the dispute *dissolves* or converts into a substantive one about the world. It does not account for the parties fighting *about the dictionary* as if it were a map of the territory. It treats the Level 2 dispute as a new substantive disagreement, whereas your observation is that Level 2 *mimics* the structure of Level 1.

  **B. Metalinguistic Negotiation (Plunkett & Sundell)**
  *   **The Concept:** Disputes that look like they are about the world but are actually about *which concept* to deploy for a given purpose. (e.g., "Is this 'net zero'?" is really "Should our concept of 'net zero' include offsets?").
  *   **The Fit:** This is the strongest existing framework. It explains why the argument reignites: the parties are negotiating the rules of the game, not playing it.
  *   **The Miss:** Plunkett and Sundell characterize these as *normative* disputes (about how we *should* use terms). Your subjects, however, treat meaning as *descriptive* (about how the term *is* defined or what it *really* means). They are not saying, "We ought to define it this way"; they are saying, "You are mistaken about what it means." They are masking a negotiation as a discovery.

  **C. Semantic Realism vs. Anti-Realism**
  *   **The Concept:** The metaphysical view that meanings are objective facts (Realism) versus human constructs/conventions (Anti-Realism/Stipulation).
  *   **The Fit:** Your Level 2 disputants are acting as **Semantic Realists** about contested social terms.
  *   **The Miss:** This is a stance, not a name for the dialectical pattern of regress.

  ### 2. The Specific Deviation: Metalinguistic Reification

  The phenomenon you describe differs from standard Metalinguistic Negotiation in a crucial way: **The Concealment of Normativity.**

  In a standard metalinguistic negotiation, parties might admit, "We want different things from this term." In your pattern, parties insist, "There is a fact of the matter about this term, and I have found it." They **reify** the convention. They treat the history of usage, technical intent, or ordinary language not as *evidence for a choice*, but as *evidence for a truth*.

  This creates the illusion that the "merely verbal" diagnosis fails. If meaning were a fact, then arguing about meaning would be substantive. But since meaning (for terms like "understanding" or "net zero") is a convention, treating it as a fact generates a phantom substantive dispute.

  ### 3. Does the Ascent Terminate? (The Principled Reason)

  You ask if there is a principled reason the ascent terminates rather than continuing indefinitely. **Yes.** The regress terminates at **Sociolinguistic Bedrock**.

  *   **Level 1 (Object):** "Is X Y?" (Depends on the meaning of Y).
  *   **Level 2 (Meaning):** "What does Y mean?" (Parties appeal to usage, intent, history).
  *   **Level 3 (Meta-Meaning):** "What counts as valid evidence for meaning?"

  The regress stops between Level 2 and Level 3. Why? Because at Level 2, the parties are appealing to **empirical facts about a community**.
  *   "Scientists use it this way." (Empirical claim about scientists).
  *   "The legislation says this." (Empirical claim about text).
  *   "Ordinary speakers say that." (Empirical claim about corpus).

  These are settleable facts. If Party A says "Experts use it thus" and Party B says "No, they don't," that is a substantive empirical dispute, not a verbal one. It can be resolved by data (corpus linguistics, surveys, text analysis).

  The regress only continues if they disagree on *which* empirical facts matter (e.g., "Technical usage trumps ordinary usage"). But this is no longer a semantic dispute; it is a **normative dispute about authority**. At that point, the "merely verbal" diagnosis no longer applies because the dispute is openly about power and normativity, not meaning.

  Therefore, the ascent terminates because **Level 2 converts the semantic mystery into a sociological fact.** You cannot have a verbal dispute about whether a specific text contains a specific string of characters. Once the argument bottoms out in "What did they write?" or "What do they say?", the verbal veil is lifted.

  ### 4. The Coinage

  Since no existing term captures the *pathological regress* caused by treating conventions as facts, I propose:

  **Metalinguistic Reification**

  **Definition:**
  A dialectical pattern in which participants in a verbal dispute, upon having the verbal nature of their disagreement exposed, refuse to treat the contested term as a matter of stipulation or negotiation. Instead, they posit the term's meaning as a mind-independent fact discoverable through appeals to usage, history, or intent. This generates a secondary dispute that mimics the structure of a substantive factual disagreement, inviting a potential regress of semantic analysis until sociological bedrock is reached.

  **What Falls Outside It:**
  1.  **Natural Kind Terms:** Disputes over "water" or "tiger" are not Metalinguistic Reification because the meaning *is* tethered to mind-independent facts (microstructure, genetics). Arguing about the extension of "water" is substantive, not reified.
  2.  **Explicit Stipulation:** If parties say, "Let's define X this way for this conversation," they are avoiding reification.
  3.  **Open Metalinguistic Negotiation:** If parties admit, "We are fighting over which definition serves our policy goals best," they are engaging in standard Metalinguistic Negotiation, not Reification. The key differentiator is the *claim to factual correctness* regarding the meaning itself.

  ### Summary of the Carving

  You have identified a **category error** masquerading as a **substantive dispute**.

  *   **Level 1** is a substantive dispute about the world (dissolvable).
  *   **Level 2** is a normative dispute about coordination (disguised as substantive).
  *   **The Trap** is believing Level 2 is substantive in the same way Level 1 was.
  *   **The Exit** is recognizing that Level 2 appeals to **social facts** (usage), which are empirical and settleable, thereby halting the regress.

  The pattern is **Metalinguistic Reification**. It is the specific error of treating a *rule of the game* as a *move in the game*.
