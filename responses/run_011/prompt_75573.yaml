answer: |-
  # DECISION PROCEDURE: RESOURCE ALLOCATION REGIME SELECTION

  ## SUMMARY CARD FOR STAFF
  **Objective:** Select one of five allocation regimes for a specific resource class (e.g., GPU hours, Storage, Instrument time).
  **Timeframe:** Complete within one working day using existing logs, tickets, and financial records.
  **Instructions:** Answer the five questions below in order. Follow the branching logic. If a question cannot be answered with data, mark it "Unknown" and proceed to the Board Handoff.

  *   **Q1 (Cost Structure):** Is the marginal cost of *using* the resource effectively zero once capacity is built?
      *   **Yes:** Go to **Q2**.
      *   **No:** Go to **Q3**.
  *   **Q2 (Priority vs. Price):** Are the societal or consortium priorities for this resource explicit and stable (e.g., preservation, education)?
      *   **Yes:** **REGIME 2** (Physical Units + Priorities).
      *   **No:** **BOARD HANDOFF** (Values conflict).
  *   **Q3 (Discovery):** Does the value of using this resource depend on unpredictable scientific outcomes or urgent, private timelines?
      *   **Yes:** Go to **Q4**.
      *   **No:** Go to **Q5**.
  *   **Q4 (Market Viability):** Are there external substitutes available to users if internal prices become too high?
      *   **Yes:** **REGIME 1** (Admin Review) or **BOARD HANDOFF** (Risk of user exit).
      *   **No:** **REGIME 4** (Internal Market).
  *   **Q5 (Complexity):** Can a central scheduler optimize usage without creating bottlenecks longer than 2 weeks?
      *   **Yes:** **REGIME 3** (Shadow Prices) or **REGIME 2**.
      *   **No:** **REGIME 5** (Negotiated Prices) or **BOARD HANDOFF**.

  **Note:** If current data shows strategic hoarding (requests > usage by >50%), treat all "Admin Review" outcomes as **REGIME 2** or **4** to break the incentive loop.

  ---

  ## CONTEXT AND THEORETICAL GROUNDING

  This procedure operationalizes lessons from the debate over economic calculation in non-market systems. It does not rely on ideology but on four specific failure modes that cause allocation systems to collapse:

  1.  **Failure of Computation:** The allocation problem is too mathematically complex for a central office to solve efficiently (e.g., too many variables).
  2.  **Failure of Information:** The data required to allocate efficiently exists only in the minds of users and cannot be collected via forms (tacit knowledge).
  3.  **Failure of Incentive:** Users possess the data but distort it to gain advantage (e.g., padding requests, hoarding).
  4.  **Failure of Discovery:** The value of the resource is not known until users risk their own capital or time to acquire it; no prior data collection can substitute for the process of exchange.

  The procedure also confronts the specific objection raised by Hayek against Lange-style market socialism (Regime 3): that a price calculated by engineers based on technical constraints is not the same as a price discovered through actual exchange. Calculated prices reflect *known* scarcity; market prices reflect *anticipated* scarcity and value. This procedure tests whether that difference matters for the resource in question.

  Finally, the procedure distinguishes between scarcity of *capacity* (building the cluster) and scarcity of *use* (running a job). For goods with near-zero marginal cost of use, pricing usage is economically inefficient; prices must signal capacity reservation only.

  ---

  ## THE DECISION PROCEDURE

  ### QUESTION 1: THE COST STRUCTURE TEST
  **Failure Mode Probed:** Computation / Information (Distinguishing capacity scarcity from usage scarcity).

  **Question:** Once the capacity exists (e.g., the disk array is bought, the node is powered), does an additional unit of use ( gigabyte-month, GPU-hour) incur a measurable marginal cost in energy, wear, or opportunity cost beyond simple congestion?

  **Data Required:**
  *   Energy logs per unit of compute/storage.
  *   Maintenance tickets correlated with usage intensity.
  *   Congestion reports (queue wait times vs. capacity).

  **Sufficient Answer:**
  *   **"Zero/Negligible":** Marginal cost is <1% of capital cost per unit. Evidence: Power bills do not fluctuate with usage tiers; wear-and-tear is covered by standard refresh cycles regardless of intensity.
  *   **"Significant":** Marginal cost is measurable and varies with intensity. Evidence: Energy costs scale linearly with load; high-intensity use triggers earlier hardware replacement.

  **Evidence Source:** Facilities manager (energy), Hardware lead (refresh cycles).

  **Error Analysis:**
  *   **Self-Correcting:** If we assume cost is zero but it is high, the budget will deficit, forcing a correction.
  *   **Self-Reinforcing:** If we assume cost is high but it is zero, we discourage use, making the resource appear underutilized, justifying further restrictions or capacity cuts.

  **Logic:**
  *   If **Zero/Negligible**: Pricing *usage* sends a false signal of scarcity. The scarcity is entirely in the *capacity* (the build decision). Proceed to **Q2**.
  *   If **Significant**: Usage itself is scarce. Price signals may be valid. Proceed to **Q3**.

  ---

  ### QUESTION 2: THE PRIORITY STABILITY TEST
  **Failure Mode Probed:** Incentive / Information (Can central priorities substitute for prices?)

  **Question:** For resources with zero marginal use-cost, are the consortium's priorities for who gets access explicit, stable, and verifiable without needing user input?

  **Data Required:**
  *   Consortium bylaws or mission statements.
  *   Historical allocation records vs. stated mission (e.g., "50% for climate research").
  *   Incidence of "priority disputes" in admin meetings.

  **Sufficient Answer:**
  *   **"Stable/Explicit":** Priorities are written down and rarely contested. Evidence: Allocation matches mission statement >90% of the time; disputes are rare.
  *   **"Unstable/Contested":** Priorities shift per review cycle or are vague. Evidence: >20% of admin meeting time spent debating "who deserves this"; mission statements are broad enough to cover all requests.

  **Evidence Source:** Consortium Board minutes, Director's office records.

  **Error Analysis:**
  *   **Self-Reinforcing:** If we claim priorities are stable but they are not, we empower the central office to make arbitrary decisions, increasing political friction and encouraging lobbying (Incentive Failure).

  **Logic:**
  *   If **Stable/Explicit**: Use **REGIME 2** (Physical-Unit Accounting + Central Priorities). Prices add no information; priorities suffice. **TERMINATE.**
  *   If **Unstable/Contested**: Central office cannot fairly allocate without price signals or negotiation. **HAND TO BOARD**. This is a values dispute, not a technical one. The Board must define priorities before allocation can proceed. **TERMINATE.**

  ---

  ### QUESTION 3: THE DISCOVERY TEST
  **Failure Mode Probed:** Discovery / Information (Hayekian Objection to Shadow Prices).

  **Question:** For resources with significant marginal cost, does the value of the resource depend on outcomes that are unknown until the work is done (e.g., scientific breakthrough, urgent deadline), and does this value vary wildly between users?

  **Data Required:**
  *   Variance in project outcomes funded previously.
  *   User complaints regarding "urgency" vs. "queue position."
  *   Existence of a black market or informal trading (indicates hidden value differences).

  **Sufficient Answer:**
  *   **"High Heterogeneity/Unknown":** Value is private and urgent. Evidence: Active black market exists; users complain that "all hours are treated equal" despite different deadlines; outcomes of funded projects vary wildly in impact.
  *   **"Low Heterogeneity/Known":** Value is uniform or predictable. Evidence: Projects are similar in scope; urgency is standard (e.g., semester cycles); no informal trading.

  **Evidence Source:** Helpdesk tickets, User surveys, Observation of informal trades.

  **Error Analysis:**
  *   **Self-Reinforcing:** If we assume value is uniform (Regime 3) but it is heterogeneous (Regime 4), high-value users will leave or hoard, making the queue look longer and justifying more central control, further driving away high-value users.

  **Logic:**
  *   If **High Heterogeneity/Unknown**: Central calculation (Regime 3) fails the Discovery test. Only a market (Regime 4) reveals true value through risk. Proceed to **Q4**.
  *   If **Low Heterogeneity/Known**: Central calculation is viable. Shadow prices (Regime 3) may work. Proceed to **Q5**.

  ---

  ### QUESTION 4: THE SUBSTITUTION TEST
  **Failure Mode Probed:** Incentive (Exit risk).

  **Question:** If we implement an internal market (Regime 4), do users have viable external alternatives (other national clusters, commercial cloud) that they will switch to if prices rise?

  **Data Required:**
  *   User grant budgets (can they afford external cloud?).
  *   Technical compatibility (can jobs run elsewhere?).
  *   Historical churn (have users left for other centers?).

  **Sufficient Answer:**
  *   **"High Substitutability":** Users can leave easily. Evidence: Jobs are standard containers; users have cloud credits; previous users have migrated.
  *   **"Low Substitutability":** Users are locked in. Evidence: Data gravity (petabytes on local storage); unique hardware (e.g., specific microscope); no budget for commercial cloud.

  **Evidence Source:** PI grant data, Technical lead (compatibility).

  **Error Analysis:**
  *   **Self-Correcting:** If we assume lock-in but users leave, revenue drops, forcing price cuts.
  *   **Self-Reinforcing:** If we assume substitutability but users are locked in, we extract rent, degrade trust, and reduce consortium cohesion without realizing users are trapped.

  **Logic:**
  *   If **High Substitutability**: A market will drive users away, starving the cluster. Use **REGIME 1** (Admin Review) to subsidize strategic work, or **HAND TO BOARD** to decide on subsidy levels. **TERMINATE.**
  *   If **Low Substitutability**: Users cannot exit. A market will allocate efficiently without destroying the user base. Use **REGIME 4** (Internal Market). **TERMINATE.**

  ---

  ### QUESTION 5: THE COMPUTATION TEST
  **Failure Mode Probed:** Computation.

  **Question:** For resources where value is known (Q3=No), can a central scheduler optimize allocation without creating queues longer than 2 weeks?

  **Data Required:**
  *   Current queue depth.
  *   Scheduler complexity (number of constraints).
  *   Staff capacity to manage scheduling.

  **Sufficient Answer:**
  *   **"Tractable":** Scheduling is manageable. Evidence: Queues <2 weeks; staff can manually resolve conflicts; constraints are few.
  *   **"Intractable":** Scheduling is bottlenecked. Evidence: Queues >2 months; scheduler software crashes or requires constant manual override; conflicts are frequent.

  **Evidence Source:** Queue management system logs, Staff workload reports.

  **Error Analysis:**
  *   **Self-Reinforcing:** If we assume tractability but it is intractable, queues grow, users pad requests to secure spots, making the problem harder (Incentive Failure compounding Computation Failure).

  **Logic:**
  *   If **Tractable**: Use **REGIME 3** (Shadow Prices) or **REGIME 2** (Physical Units). Shadow prices help optimize without full market complexity. **TERMINATE.**
  *   If **Intractable**: Central calculation fails. Use **REGIME 5** (Negotiated Prices) to distribute the computational burden to the members, or **HAND TO BOARD** for capacity expansion. **TERMINATE.**

  ---

  ## TEST RUNS

  ### Case 1: Training Hours on Largest Nodes
  **Characteristics:** Lumpy, rival in use, plausible substitutes at other national sites, requested quantities depend on scoring.

  *   **Q1 (Cost):** Significant. Energy and wear are measurable; opportunity cost is high (rival). -> **Go to Q3.**
  *   **Q3 (Discovery):** Low Heterogeneity. Training is standardized. Urgency is tied to semesters, not unpredictable breakthroughs. -> **Go to Q5.**
  *   **Q5 (Computation):** Tractable. Training slots are discrete and schedulable. -> **Regime 3 or 2.**
  *   **Adjustment:** However, Q4 (Substitution) was flagged in characteristics ("substitutes at other national sites"). If we price too high, they leave.
  *   **Verdict:** **REGIME 1 (Administrative Review).**
  *   **Rationale:** Because external substitutes exist, a market risks driving users away from the consortium entirely; admin review allows strategic subsidization to keep members engaged while managing capacity.

  ### Case 2: Long-Term Archival Storage
  **Characteristics:** Near-zero marginal cost of use, high migration cost, demand grows monotonically, value realized years later.

  *   **Q1 (Cost):** Zero/Negligible. Once disks are spun, reading/writing adds negligible cost compared to capital. -> **Go to Q2.**
  *   **Q2 (Priorities):** Stable/Explicit. Preservation is the mission. "Keep everything forever" is the implicit priority. -> **Regime 2.**
  *   **Verdict:** **REGIME 2 (Physical-Unit Accounting + Central Priorities).**
  *   **Rationale:** Pricing usage sends a false scarcity signal for a good where scarcity exists only in capacity; central priorities on data retention are stable and verifiable.
  *   **Note:** This aligns with the Director's preference.

  ### Case 3: Time on Single Cryo-Electron Microscope
  **Characteristics:** Extremely heterogeneous urgency, no substitute within consortium, waiting list measured in months, black market observed.

  *   **Q1 (Cost):** Significant. Time is strictly rival; wear is high. -> **Go to Q3.**
  *   **Q3 (Discovery):** High Heterogeneity/Unknown. Urgency is private (publication deadlines, grant cycles); value varies wildly between users. Black market confirms hidden value. -> **Go to Q4.**
  *   **Q4 (Substitution):** Low Substitutability. No other microscope in consortium; shipping samples elsewhere is costly/risky. Users are locked in. -> **Regime 4.**
  *   **Verdict:** **REGIME 4 (Internal Market with Transferable Credits).**
  *   **Rationale:** **This contradicts the Director's preference.** Only a market mechanism can resolve the Information and Discovery failures here; admin review cannot distinguish between a "padding" request and a "critical deadline" request, and shadow prices cannot capture the private urgency users are currently trading informally.

  ---

  ## LIMITATIONS AND EXPECTED MISFIRES

  ### What This Procedure Cannot Settle
  1.  **Equity vs. Efficiency:** The procedure optimizes for allocation efficiency based on data. It cannot resolve conflicts where Member Institution A demands equal share regardless of usage (Fairness) vs. Member Institution B demanding share based on contribution (Merit). These are **Board Handoffs**.
  2.  **Long-Term Capacity Planning:** This procedure allocates *existing* capacity. It does not determine whether to build more storage or buy more nodes. That requires strategic forecasting beyond the scope of allocation regimes.
  3.  **Political Survival:** A regime may be theoretically optimal (e.g., Market for Cryo-EM) but politically untenable if senior faculty view it as "privatizing" public infrastructure. The procedure identifies the efficient mechanism, not the negotiable one.

  ### Expected Misfires
  1.  **The "Gaming the Test" Risk:** If staff know that proving "High Heterogeneity" leads to a Market (which users hate), they may falsify Q3 data to force Admin Review. *Mitigation:* Audit Q3 evidence against the existence of informal black markets, which are hard to hide.
  2.  **The "Zero Cost" Illusion:** Staff may classify resources as "Zero Marginal Cost" (Q1) to avoid pricing, ignoring congestion costs. *Mitigation:* Define congestion wait-times >48 hours as a positive marginal cost automatically.
  3.  **The "Shadow Price" Trap:** Regime 3 (Shadow Prices) is the most fragile. It assumes we can compute valuations correctly. In a consortium of 14 institutions, political pressure will distort the "technical coefficients" used to compute these prices, turning them into arbitrary fees without the benefits of a market. Expect Regime 3 to drift toward Regime 1 (Admin) unless strictly insulated from lobbying.

  ### Closing Note on the Hayekian Objection
  This procedure explicitly separates Regime 3 (Shadow Prices) from Regime 4 (Market) using Question 3. If the value of the resource is discoverable only through use (e.g., scientific urgency), a centrally computed price is merely a guess. In those cases (like the Cryo-EM), the procedure mandates a market not because markets are ideologically superior, but because the data required for central calculation *does not exist* until the market operates. Ignoring this distinction will result in allocation systems that look precise but allocate resources to the wrong users.
