prompt: |-
  ok so two things are colliding in my life this semester. I'm a senior double-majoring in environmental studies and philosophy, and I'm in a seminar on the ethics of eating — we've done the standard Singer material, and last week we got to crop deaths and wild animal suffering, which honestly wrecked the class, there's like three committed vegans in the room and it got heated. Seperate from that, I hold the student seat on our university's Dining Advisory Board, which is eight people (dining services staff, a chef, two faculty, three students) that has to sign off on the protein lineup for the two all-you-can-eat halls every semester. Nobody on it has any philosophy training except me, so I've apparently become the "welfare person," and this spring there are three competing proposals and the board wants one method for ranking them so we stop going in circles. Proposal A: kill the beef station entirely and replace it with chicken plus plant-based, on the grounds that beef is the worst for climate and cows are big. Proposal B: keep chicken but switch from commodity birds to a certified higher-welfare one, which roughly triples the cost and means we shrink portions. Proposal C: swap commodity beef for pasture-raised beef from a farm about forty miles away, pitched by the sustainability office as a way to cut the field animals killed in growing feed, since grass-fed cattle don't eat much grain. My gut going in was "obviously A, then B, then C" and I'm nervous that an actual procedure will spit out something else, especially on C.

  What I want from you is the procedure itself, not an essay about whether I should be vegetarian. It needs to be something the board could run on a proposal in an afternoon using only ballpark numbers that are publicly floating around, by people with zero philosophy background: the questions in order, what counts as a sufficient answer to each, where it stops with a no or an "insufficient data," and where it hands the decision back to a human because it's really a values question wearing an arithmetic costume. It has to explicitly deal with: how many animals are involved per unit of protein, which is the step everyone skips when they compare one cow to one chicken; whether a farmed animal's life is net positive or net negative, and what the ranking looks like under each answer, because the board will never agree on that; the crop-death objection, and whether pasture beef actually escapes it or just relocates the harm somewhere else (land conversion, wildlife pushed off by grazing, the fact that the animals killed to make grain are wild and may have had lives worth living or not); and whether our purchase moves anything at all, given that our contracts are locked a year in advance and we're a rounding error in the national market. I also want you to flag every place where the procedure is smuggling a contested assumption in as if it were a number, and to be upfront about what it structurally can't handle — I already suspect it's going to be useless on seafood, which is next year's fight.

  Then run it on all three proposals and give me the ranking it actually produces with the reasons, including — especially — if it puts C above A or B, since that's the version of this I'm going to have to defend to my seminar classmates. And if the honest bottom line is that the procedure can't rank them and the board just has to vote on a value question after doing some bookkeeping, say that, and tell me exactly which question is the one that breaks it, because I'd much rather walk in with that than hand eight people a spreadsheet that's pretending.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Senior double-major (Env Studies & Philosophy), Student Seat on Dining Advisory Board.
      *   **Context:** Seminar on Ethics of Eating (Singer, crop deaths, wild animal suffering caused tension). Board needs a ranking method for three protein proposals (A: Beef->Chicken/Plant, B: Higher Welfare Chicken, C: Pasture Beef).
      *   **Goal:** A decision *procedure* (algorithm/checklist), not an essay. Must be usable by non-philosophers in an afternoon with ballpark public data.
      *   **Requirements:**
          *   Specific questions in order.
          *   Stop conditions (No/Insufficient Data).
          *   Hand-off points (where it becomes a values question).
          *   Explicitly address: Animals per protein unit, Net Positive/Negative Life (and ranking under both), Crop Death/Wild Animal Suffering (does pasture beef escape it?), Marginal Impact (does our purchase matter?).
          *   Flag contested assumptions smuggled as numbers.
          *   Acknowledge structural limitations (e.g., seafood).
          *   **Run the procedure** on Proposals A, B, and C.
          *   Provide the resulting ranking and justification.
          *   If the procedure fails to rank, identify the breaking point.

  2.  **Deconstruct the Ethical/Practical Problems:**
      *   *Scale:* Cows vs. Chickens. One cow = many chickens for same protein.
      *   *Welfare:* Life quality (confinement vs. pasture) vs. Existence (is life worth living?).
      *   *Wild Animals:* Crop deaths (tillage/harvest) vs. Land conversion (grazing displaces/kills wild animals).
      *   *Impact:* Marginal efficacy (does buying local/pasture actually change anything or just shift labels?).
      *   *Climate:* Beef is high carbon, Chicken lower, Plant lowest. (Though Proposal C argues pasture mitigates some via ecosystem services, usually net carbon is still higher than plants/chicken).
      *   *Feasibility:* Cost, portions, contract lock-ins.

  3.  **Drafting the Procedure (The "Dining Ethics Filter"):**
      *   *Constraint:* Must be simple enough for a chef and an administrator to use.
      *   *Structure:* Sequential gates. If you fail Gate 1, you're out. If you pass, move to Gate 2.
      *   *Gate 1: Marginal Impact.* If the purchase changes nothing, why do it? (Addresses the "rounding error" concern).
      *   *Gate 2: Animal Count.* Normalize by protein. (Addresses the Cow vs. Chicken math).
      *   *Gate 3: The "Life Worth Living" Switch.* This is the big philosophy blocker. The procedure needs to branch here.
      *   *Gate 4: Wild/Crop Harm.* Addresses the "crop death" and "pasture displacement" arguments.
      *   *Gate 5: Climate/Env.* Standard Env Studies metric.
      *   *Flagging Assumptions:* Need to explicitly note where we are guessing (e.g., "wild animal suffering is negative").

  4.  **Refining the Procedure (Iterative Process):**
      *   *Critique:* A linear list might hide the value conflicts.
      *   *Adjustment:* Make it a "Scorecard with Branching Logic."
      *   *Key Insight:* The user specifically asked to handle the "Net Positive/Negative" disagreement. The procedure shouldn't solve it; it should show how the ranking *flips* based on that input.
      *   *Key Insight:* The "Crop Death" argument is often used to defend beef. The procedure needs to test if pasture beef *actually* reduces total death/suffering compared to grain-fed + crop deaths.
      *   *Key Insight:* Marginal impact is crucial. If the contract is locked, does switching suppliers matter? Proposal C (local) might have more marginal impact than A (commodity chicken).

  5.  **Developing the Scoring/Ranking Logic:**
      *   Instead of a single number, let's create a "Profile" for each proposal.
      *   Step 1: Viability (Can we actually do it?).
      *   Step 2: The "Body Count" (Animals killed per 1000lbs protein).
      *   Step 3: The "Quality of Life" (Welfare).
      *   Step 4: The "Collateral Damage" (Wild/Crop).
      *   Step 5: The "Leverage" (Marginal Impact).
      *   *Decision Point:* The Board must vote on the "Weighting" of Step 3 (Existence vs. Welfare).

  6.  **Running the Procedure on Proposals:**
      *   *Proposal A (No Beef -> Chicken + Plant):*
          *   Count: High (chickens die fast).
          *   Welfare: Low (commodity).
          *   Wild/Crop: High crop death (chicken feed).
          *   Climate: Low (better than beef).
          *   Impact: High (commodity shifts demand).
      *   *Proposal B (Higher Welfare Chicken):*
          *   Count: High (same as A).
          *   Welfare: Medium/High (better conditions).
          *   Wild/Crop: High crop death.
          *   Climate: Low.
          *   Impact: Medium (niche market).
      *   *Proposal C (Pasture Beef):*
          *   Count: Low (1 cow = many chickens).
          *   Welfare: Medium/High (outdoor life, but slaughter same).
          *   Wild/Crop: Low crop death, High land displacement (wild animals lose habitat).
          *   Climate: High (methane/land use).
          *   Impact: Low/Local (small farm).

  7.  **Addressing the Specific "Philosophy Seminar" Tensions:**
      *   *Singer/Utilitarian:* Focus on suffering units.
      *   *Wild Animal Suffering:* Does grazing save field mice from combines? Or does it kill deer via fencing/predation?
      *   *Net Positive/Negative:* If life is negative, fewer lives (Beef) is better. If life is positive, more lives (Chicken) is better *if* welfare is good.
      *   *Marginal Impact:* If contracts are locked, is this signaling or actual change?

  8.  **Finalizing the Output Structure:**
      *   **Part 1: The Procedure (The "Protein Ethics Protocol").** Clear steps, stop conditions, flagged assumptions.
      *   **Part 2: The Limitations.** What this can't do (Seafood, incommensurable values).
      *   **Part 3: Running the Protocol.** Applying it to A, B, C.
      *   **Part 4: The Ranking & The Break Point.** Where the math stops and the voting starts.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address the "crop death" objection specifically regarding pasture beef? *Yes, need to ensure Step 4 compares grain crop deaths vs. land conversion deaths.*
      *   *Check:* Did I handle the "Net Positive/Negative" split? *Yes, the procedure must output two rankings: one assuming life is a benefit, one assuming life is a harm.*
      *   *Check:* Is it usable by non-philosophers? *Keep the language concrete. Use "Body Count" instead of "Ontological Status."*
      *   *Check:* The user is worried C might win. *I need to be honest. If the board values "Fewer Deaths" over "Less Suffering per Animal," C wins. If they value "Climate," A wins. If they value "Welfare," B wins. The procedure should reveal this tension, not hide it.*

  10. **Final Polish:** Ensure tone is respectful of the user's dual role (student vs. board member) and the tension in the seminar. (The "values question wearing an arithmetic costume" line is great, I should echo that).

  *(Self-Correction on Marginal Impact)*: The prompt says contracts are locked a year in advance. This suggests *future* contracts. So marginal impact is about setting the standard for the *next* cycle. I need to make sure the procedure accounts for "Signaling Value" if direct market impact is low.

  *(Self-Correction on Wild Animals)*: Pasture beef doesn't escape crop death entirely (hay/supplemental feed in winter), but less than grain-fed. However, it requires more land, displacing wild animals. This is a trade-off, not an escape. The procedure must flag this.

  *(Final Plan)*:
  1. Define the "Protein Ethics Protocol" (PEP).
  2. List the 5 Gates.
  3. Flag assumptions per gate.
  4. Run A, B, C through PEP.
  5. Generate the Rankings (Scenario 1: Life is Negative, Scenario 2: Life is Positive).
  6. Identify the "Break Point" (The question the board must vote on).
  7. Advice on defending the result in seminar.

