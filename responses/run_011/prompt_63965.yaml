answer: |-
  **Stage 1 — Brainstorm**

  1.  **Public-Goods Game:** Individuals secrete a diffusible enzyme (cost $c$, benefit $b$) shared locally.
      *   *Verdict:* Fails. The Price equation partitions exactly into Hamilton's rule ($rb > c$) using neighbour-modulated fitness; relatedness is derived from dispersal, and both accounts yield identical conditions for increase.
  2.  **Green-Beard Allele:** A single locus causes a tag, recognition, and altruism.
      *   *Verdict:* Fails. While often cited as distinct, the algebra collapses to standard kin selection where relatedness at the locus is unity; the accounts remain notationally different but mathematically congruent.
  3.  **Emergent Fragmentation Threshold:** Multicellular clusters grow by cell division and fragment only when physical shear exceeds cohesion at a specific cluster size $K$.
      *   *Verdict:* Passes. The trait $K$ is a property of the collective geometry, not an individual phenotype. Individual cells cannot vary $K$ independently, breaking the individual-actor assumption required for standard inclusive fitness.
  4.  **Differential Group Extinction:** Groups with more altruists survive longer; individuals within survive equally.
      *   *Verdict:* Fails. This is classic trait-group selection. The individual fitness effect is zero, but the group effect is positive; inclusive fitness handles this via "fitness of neighbours" terms, preserving equivalence.

  **Stage 2 — The Scenario**

  Consider an experimentally evolved line of "snowflake yeast" (*Saccharomyces cerevisiae*), where cells divide but remain attached due to incomplete cytokinesis, forming multicellular clusters. The life cycle involves growth in static culture followed by orbital shaking, which imposes shear stress. Clusters fragment when their size exceeds a threshold $K$, determined by the geometric arrangement of cell walls and overall cluster cohesion, not by any single cell's decision. Propagules are the resulting fragments, which settle to found new clusters. Selection favours larger $K$ because larger fragments settle faster and escape washout, but larger clusters grow slower due to nutrient diffusion limits. The trait under selection is the fragmentation size $K$, an emergent property of the group's physical organization.

  **Testability:** Evolve replicate lines under high shear (selecting for small $K$) vs. low shear (selecting for large $K$). Measure the change in mean cluster size over 50 generations.
  *   *MLS Prediction:* Predicts shift in mean $K$ based on covariance between fragment fitness and fragment size.
  *   *IF Prediction:* Cannot generate a prediction because no individual variable correlates with $K$; if forced to use cell division rate as a proxy, it predicts the wrong direction (selection favours slower growth for larger size, but IF sees cost without benefit).

  ***

  **A. Demography and accounting**

  **Group Formation:** Clusters initiate from single cells (propagules). Cells divide mitotically but stay attached.
  **Group Size:** Let $n_j$ be the number of cells in cluster $j$.
  **Group Reproduction:** When $n_j$ reaches threshold $K_j$, the cluster fragments into $m_j$ propagules. Fitness $W_j = m_j$.
  **Dispersal:** Propagules mix globally in the media before settling.
  **Trait:** $K_j$ is the fragmentation size. It is a group-level property determined by cluster geometry.
  **Currency:** Number of propagules contributing to the next generation.
  **Generations:** Two (Parent cluster -> Propagules -> New Clusters).
  **Fixed:** Total population size is regulated by dilution; only the distribution of $K$ changes.

  **B. The multilevel calculation**

  We use the Price Equation partitioned for group selection. Let $P$ be the frequency of alleles influencing cluster cohesion. Let $W_j$ be the fitness of group $j$, and $w_{ij}$ be the fitness of cell $i$ in group $j$ (where $w_{ij} = W_j$ since all cells in a fragment share fate). Let $Z_j$ be the group trait (fragmentation size $K_j$).

  The change in allele frequency $\Delta P$ is proportional to:
  $$ \bar{W} \Delta P = \text{Cov}(W_j, Z_j) + E[\text{Cov}(w_{ij}, z_{ij})] $$
  Here, $z_{ij}$ is the individual phenotype. Since $K_j$ is emergent, every cell in group $j$ experiences the same $K_j$. Thus, within any group $j$, the variance in $z_{ij}$ is zero (all cells share the group trait value).
  $$ \text{Cov}(w_{ij}, z_{ij}) = 0 $$
  The equation collapses to the between-group term:
  $$ \bar{W} \Delta P = \text{Cov}(W_j, K_j) $$
  Assume larger fragments settle better: $W_j = \alpha K_j - \beta K_j^2$ (diminishing returns due to diffusion).
  If the population mean $\bar{K}$ is below the optimum, $\text{Cov}(W_j, K_j) > 0$.
  **Verdict:** MLS predicts $K$ will increase. The selection term is strictly positive and carried entirely by the between-group covariance.

  **C. The inclusive-fitness calculation**

  Hamilton's Rule requires an actor, a recipient, and a regression of fitness on phenotype.
  Rule: $\Delta P \propto -c + r b > 0$.
  **Actor:** The individual cell.
  **Phenotype ($z_i$):** To apply IF, we must identify an individual trait $z_i$ that causally affects $K$.
  **Problem:** $K$ is not a function of any single $z_i$. It is a function of $\{z_1, z_2, ..., z_n\}$ collectively (geometry).
  If we attempt to define $z_i$ as "cell division rate," increasing $z_i$ increases cluster size faster, potentially triggering fragmentation earlier (lower effective $K$) or causing metabolic stress.
  Let us attempt the regression coefficient $\beta_{wz}$ (cost $c$).
  $$ c = -\frac{\partial w_i}{\partial z_i} $$
  Because $K$ is emergent, $\frac{\partial K}{\partial z_i} \approx 0$ for any single cell in a large cluster. A single cell dividing does not trigger fragmentation; the collective size does.
  Thus, the marginal effect of an individual's phenotype on the trait $K$ is zero.
  Consequently, the relatedness term $r = \frac{\text{Cov}(z_i, z_{neighbour})}{\text{Var}(z_i)}$ becomes undefined or irrelevant because the trait $K$ does not vary with $z_i$.
  **Verdict:** The inclusive-fitness calculation has no well-defined quantity to evaluate. The step assigning a cost $c$ to an actor fails because the actor cannot vary the trait $K$ unilaterally. The regression of fitness on individual phenotype is zero, yielding no prediction.

  **D. The divergence**

  **Prediction:** MLS predicts an increase in $K$ (via $\text{Cov}(W_j, K_j) > 0$). IF yields no prediction (undefined cost/benefit).
  **Nature of Disagreement:** This is not a disagreement about the world (gene frequency change), but about *descriptive adequacy*. MLS correctly identifies the locus of selection (the cluster). IF fails because its ontology requires an individual actor controlling the trait.
  **Gene's-Eye View:** The replicator is the allele. The vehicle is the cluster. If the vehicle is the group, the gene's-eye view aligns with MLS. The IF framework insists on parsing vehicle effects into individual actions, which distorts the causal structure when actions are non-decomposable. The prediction alters only in description: MLS describes group adaptation; IF describes nothing.

  **E. The load-bearing feature**

  **Feature:** **Emergence.** The trait $K$ is not additive over individual phenotypes; it is a threshold property of the collective.
  **Neutralization:** Relax the constraint that the trait is emergent. Suppose cells secrete an enzyme $E$ that weakens cell walls. Fragmentation occurs when total enzyme concentration exceeds a threshold. Now, individual phenotype $e_i$ (enzyme rate) causally influences $K$.
  **Re-run:**
  *   **MLS:** $\text{Cov}(W_j, E_{total}) > 0$. Within-group selection favours cheaters (low $e_i$). Between-group favours high $E_{total}$.
  *   **IF:** Actor = cell. Cost $c = \text{metabolic cost of } E$. Benefit $b = \text{increased fragment fitness}$. Relatedness $r$ is derived from clonal growth (high $r$).
  *   **Result:** Both now yield a condition: $r b > c$. They agree.
  **Collapse Dependence:** The divergence depended entirely on the non-additivity of the trait mapping.
  **Inclusive-Fitness Defence:** An IF proponent argues: "Redefine the trait as individual bond strength. Then IF works."
  **Adjudication:** This defence succeeds mathematically but concedes the philosophical point. By redefining the trait from "group fragmentation size" to "individual bond strength," they acknowledge that IF only works when the group trait is reducible to individual actions. In the original scenario, where the trait is strictly organizational (geometry), IF is silent, whereas MLS remains descriptive. The equivalence holds only when group traits are additive functions of individual phenotypes.
