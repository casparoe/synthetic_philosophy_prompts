prompt: |-
  I'm a food security analyst at a small consortium that does early warning and public reporting for a region with maybe a dozen at-risk districts. About eight or ten times a year something escalates past the point where we have to say something in public, and the technical classification part is already handled — our epidemiologist and the IPC-style team sort out whether the mortality and malnutrition thresholds are met. That's not what I need. What I need is the thing that comes *after* the classification, which our funder calls the attribution paragraph: a few sentences saying whether people starved mainly because food wasn't there, or because they couldn't get at food that was there, and whose decisions made the difference. Right now that paragraph gets written by whoever is least busy, it comes out as "the crisis was compounded by a combination of drought and conflict," and it tells nobody anything.

  Stakes: if we name a state actor, legal reviews it as an allegation, and our access agreement has a clause about politicisation, so there's a standing incentive to write in the passive voice. If we stay vague, we're functionally laundering a political event into a weather report, and the press quotes us either way. We get about 48 hours from the classification landing to the statement going out, the team is four people (an agronomist, an economist, a protection officer, me), and the country director signs off. She's not an economist and she wants one page, so whatever you give me has to be runnable by people who've never read a word of welfare economics.

  So: build me the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops and says "no attribution warranted on this evidence," and where it hands the decision over to the director because it's a question of values or of access rather than of fact. The backbone should be whatever is actually usable from Sen's entitlement work — the idea that your ability to eat depends on what your endowment can command at prevailing prices and wages, not on the harvest as such, and the resulting split between production failures, trade failures, own-labour failures and transfer failures. I want that split translated into questions a protection officer can answer from market data, wage data and household interviews, plus the mechanisms people forget: restrictions on movement, bans on selling things, closure of a crossing, a wage that stops keeping pace with grain. And I want the procedure to enforce one hard rule that we keep breaking, which is that "how much food was there," "who could command food," and "whose decisions mattered" are three different questions, and an answer to one must not be smuggled in as an answer to another. That includes the reverse direction: a genuinely enormous production collapse that didn't have to become a famine, because the state did the thing that protects incomes.

  Anchor it in the three historical cases, but tell me what each one contributes procedurally rather than recapping it. What does Bengal 1943 teach a team about causes that live far away and were aimed at something else entirely — war logistics, shipping, price controls — and about what to do when the specialists still dispute whether there was an aggregate shortfall at all? What does Ó Gráda's objection about Ireland teach us, that the availability/entitlement distinction gets blurry when the subsistence crop itself is what fails? And what does the Great Leap Forward add, which I think is the bit we're missing: a state destroying its own information channels, inflated yield reports driving over-procurement, nobody at the top knowing, movement restricted so people couldn't go find food. That's an attribution category we don't have — culpable ignorance and broken feedback, as distinct from knowingly letting it happen — and the procedure needs a node for it.

  Then run it on three cases:

  1. A cyclone takes out maybe a third of the coastal harvest. Imports land within a month and aggregate supply recovers fast, but the deaths are concentrated among landless labourers and boat crews whose wages collapsed while rice prices tripled. The government ran cash-for-work in two of the five affected districts and not the other three.
  2. No harvest failure anywhere. A civil war next door closed the crossing our pastoralists trade through, livestock terms of trade fell apart, and a new environmental regulation banned charcoal burning, which was their main cash income. Our own early warning unit flagged it fourteen months out and the ministry sat on it through an election.
  3. The one I don't want to run: a competitive electoral democracy, opposition-controlled regional assembly, a press that has been reporting this for six months, and the national government letting it run because the starving district votes the wrong way, plus two survey teams turned back at the border. Half my team's instinct is to say that can't be a famine under a democracy, so something must be wrong with our data. Tell the procedure how to handle an analyst whose priors about how famines work are being used to argue away mortality numbers.

  Also be straight with me about the limits: which steps depend on data we simply won't have (occupational breakdown of the dead, real wage series, price ratios), what to do when the authorities are blocking data collection so you can't tell obstruction from ordinary absence of evidence, how to stop "we cannot know yet" from becoming a permanent dodge, and what should trigger re-running the thing and issuing a correction. And a list of the phrases that sound like attribution but aren't, so I can ban them from our copy. No reading list, no bibliography — I want the procedure and the three worked runs.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Food security analyst at a small consortium (early warning/public reporting).
      *   **Context:** ~12 at-risk districts. 8-10 escalations/year requiring public statement. Technical classification (IPC-style) is done.
      *   **Problem:** The "attribution paragraph" (causes/responsibility) is currently vague ("drought and conflict"), passive, and unhelpful.
      *   **Constraints:**
          *   48-hour turnaround.
          *   Team of 4 (Agronomist, Economist, Protection Officer, Analyst).
          *   Country Director (CD) signs off (non-economist, wants 1 page).
          *   Legal/Access risk: Naming state actors triggers "allegation" review/politicization clauses. Vagueness launders politics into weather.
          *   Core Requirement: Use Amartya Sen's Entitlement Approach (production vs. trade vs. labor vs. transfer failures).
          *   Core Rule: Distinctly separate "Food Availability," "Entitlement Failure," and "Decision/Agency."
          *   Historical Anchors: Bengal 1943 (logistics/policy over aggregate supply), Ireland (subsistence crop failure blurs lines), Great Leap Forward (broken feedback/culpable ignorance).
          *   Deliverables: A runnable procedure (questions, thresholds, stop-points), 3 worked cases (Cyclone/Labor, Cross-border/Policy, Democratic Neglect), Limits/Data gaps, Forbidden phrases.
          *   Tone: Professional, direct, operational, no fluff/bibliography.

  2.  **Deconstruct the Theoretical Backbone (Sen + Historical Cases):**

      *   *Sen's Entitlements:* Need to translate "Endowment," "Exchange Entitlement," "Production Entitlement" into field questions.
      *   *Bengal 1943:* Teaches that aggregate supply stats can lie. Focus on *distribution* and *price/wage ratios*. Attribution isn't just "was there food?" but "why didn't it move?" (Logistics, speculation, policy).
      *   *Ireland (Ó Gráda):* Teaches that sometimes the *endowment* itself vanishes (potato blight). If the thing you grow to eat/trade dies, production failure *is* entitlement failure. Procedure needs to check if the specific *subsistence* crop failed, not just aggregate calories.
      *   *Great Leap Forward:* Teaches "Culpable Ignorance." Broken feedback loops. Data suppression. Policy based on false premises leading to over-extraction. This is distinct from malice; it's systemic blindness enforced by hierarchy.

  3.  **Drafting the Procedure (The "Attribution Protocol"):**

      *   *Structure:* Needs to be a flowchart in text form.
      *   *Phase 1: Availability (The "Was there food?" check).*
      *   *Phase 2: Entitlement (The "Could they get it?" check).*
      *   *Phase 3: Agency/Decision (The "Who decided?" check).*
      *   *Decision Nodes:* When to stop (natural disaster only), when to escalate to CD (political risk).
      *   *Integration of Historical Lessons:*
          *   Bengal -> Check price/wage decoupling.
          *   Ireland -> Check subsistence crop specific failure.
          *   GLF -> Check information flow/survey access.

  4.  **Developing the Worked Cases:**

      *   *Case 1 (Cyclone/Labor):* Classic Entitlement Failure. Supply recovered, wages didn't. Government action was partial.
          *   *Outcome:* Entitlement failure (Labor). Decision attribution: Partial state response.
      *   *Case 2 (Cross-border/Policy):* Trade failure + Policy shock. Early warning ignored.
          *   *Outcome:* Entitlement failure (Trade/Transfer). Decision attribution: Foreseeable policy neglect.
      *   *Case 3 (Democratic Neglect):* The hard one. Political bias + Data suppression.
          *   *Challenge:* Analyst bias ("Democracies don't famine").
          *   *Procedure Fix:* Force the data to speak. If mortality is high and access is blocked *selectively*, that's a decision.
          *   *Outcome:* Entitlement failure (Transfer/Trade). Decision attribution: Selective omission/Access denial.

  5.  **Refining the "Hard Rules" and "Forbidden Phrases":**

      *   Need to explicitly ban "compounded by," "complex emergency," "challenging environment."
      *   Need to enforce the separation of Availability vs. Entitlement vs. Decision.
      *   Need to address data gaps (what if we don't have wage data?).

  6.  **Addressing the Limits:**

      *   What data is missing? (Occupational mortality, real-time wages).
      *   Obstruction vs. Absence.
      *   Correction triggers.

  7.  **Review against Constraints:**

      *   *48 Hours?* The questions need to be answerable with existing market monitoring + rapid key informant interviews.
      *   *CD Sign-off?* Needs a "Risk Flag" section for the CD.
      *   *Sen's Theory?* Must explicitly map questions to Production, Trade, Labor, Transfer.
      *   *Historical Cases?* Must be embedded in the logic, not just cited.

  8.  **Self-Correction/Iterative Polishing:**

      *   *Critique:* Is the GLF node too abstract?
      *   *Fix:* Make it concrete: "Were yield reports verified?" "Were survey teams blocked?"
      *   *Critique:* Is the Ireland point clear?
      *   *Fix:* Ensure Phase 1 asks about the *specific* staple of the poor, not national aggregate.
      *   *Critique:* Case 3 is sensitive.
      *   *Fix:* The procedure must force the analyst to confront their own bias ("Democracy Shield") before analyzing the data.
      *   *Tone Check:* Keep it dry, operational, imperative. No academic preamble.

  9.  **Final Assembly:** (Drafting the response following the structure derived above.)
      *   Introduction (acknowledge the stakes).
      *   The Protocol (3 Phases).
      *   The Decision Matrix (Stop/Escalate).
      *   Worked Cases (1, 2, 3).
      *   Limits & Data Gaps.
      *   Forbidden Phrases.

  *(Self-Correction during drafting)*: Make sure the "Great Leap Forward" lesson isn't just "dictatorship bad." It's about *information pathology*. The question should be: "Did decision-makers have accurate data?" If no, why? If yes, why did they ignore it? This distinguishes incompetence/negligence from malice, which matters for legal review.

  *(Refining the "Democracy Shield" in Case 3)*: The prompt says analysts think "can't be a famine under democracy." The procedure needs a specific "Bias Check" step before Phase 1 for this scenario.

  *(Final Polish)*: Ensure the distinction between "Attribution" (Cause) and "Responsibility" (Decision) is clear in the output text. The user wants to know *whose decisions made the difference*.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # The Entitlement Attribution Protocol (EAP)

  **Purpose:** To replace vague causal statements with specific entitlement failure analysis within 48 hours of technical classification.
  **Users:** Analyst, Agronomist, Economist, Protection Officer.
  **Sign-off:** Country Director (CD) for Risk Level 2 or 3 only.

  ## Part 1: The Procedure

  Do not write the paragraph until this grid is filled. If data is missing, mark "Unknown" and proceed to the Limits section.

  ### Phase 1: Availability (The Bengal Test)
  *Goal: Determine if there was physically less food, or if the statistics lie.*

  1.  **Aggregate vs. Local Supply:** Did national/regional production drop by >15%?
      *   *Yes:* Proceed to Q2.
      *   *No:* **Flag:** This is likely an entitlement failure, not a production failure. (Bengal 1943 lesson: Famines occur without aggregate shortfall).
  2.  **Subsistence Specificity:** Did the *specific* crop/livestock relied on by the poorest decile fail, even if aggregate calories were stable?
      *   *Yes:* **Flag:** Production entitlement failure. (Ireland lesson: If the thing you grow to eat dies, availability and entitlement merge).
      *   *No:* Proceed to Phase 2.
  3.  **Information Integrity:** Are yield estimates based on ground verification or administrative reports? Were independent survey teams denied access?
      *   *Denied/Unverified:* **Flag:** Potential Information Pathology (Great Leap Forward lesson). Stop and consult CD.
      *   *Verified:* Proceed to Phase 2.

  ### Phase 2: Entitlement Mapping (The Sen Split)
  *Goal: Identify which mechanism failed to put food in mouths.*

  **Select the primary failure mode (check one dominant, note secondary):**

  *   **[ ] Production Entitlement:** "We grew less food and had no reserves." (Supported by Phase 1, Q2).
  *   **[ ] Trade Entitlement:** "We had assets (livestock, charcoal, goods) but could not sell them, or prices collapsed."
      *   *Evidence:* Terms of trade shift >20%? Market closure? Export/import ban?
  *   **[ ] Labor Entitlement:** "We could work, but wages bought less food."
      *   *Evidence:* Nominal wage stable/food price up? Or wage rate collapsed?
  *   **[ ] Transfer Entitlement:** "State/NGO support did not reach us."
      *   *Evidence:* Safety nets existed but were geographically excluded? Ration cards revoked?

  **The Decoupling Check:**
  *   Did food prices rise faster than wages/income?
      *   *Yes:* Entitlement failure confirmed.
      *   *No:* Re-evaluate Phase 1 (Availability).

  ### Phase 3: Agency & Decision (The Attribution Node)
  *Goal: Identify whose decisions altered the outcome.*

  1.  **Foreseeability:** Was this risk flagged in an early warning report >3 months prior?
      *   *Yes:* Who received the report? Did they act?
      *   *No:* Classify as "Unforeseen Shock" (Limits attribution).
  2.  **Response Adequacy:** Given the Entitlement Failure identified in Phase 2, was the response matched to the mechanism?
      *   *Example:* Labor failure requires cash-for-work. If only food aid was sent, response was mismatched.
      *   *Example:* Trade failure requires market opening. If borders remained closed, response was insufficient.
  3.  **Selectivity:** Was the response applied uniformly across affected areas?
      *   *No:* **Flag:** Political allocation. (Why District A and not District B?)
  4.  **Information Block:** Did authorities prevent data collection or public reporting of the crisis?
      *   *Yes:* **Flag:** Culpable Ignorance/Suppression. Escalate to CD.

  ### Decision Matrix

  | Result | Attribution Statement | Action |
  | :--- | :--- | :--- |
  | **Pure Availability** (Phase 1, Q1 & Q2 Yes; Phase 3 No anomalies) | "Crisis driven by catastrophic production loss exceeding coping capacity." | Release. |
  | **Entitlement Failure** (Phase 2 Dominant; Phase 3 Response Adequate) | "Crisis driven by collapse in [Labor/Trade] entitlements despite adequate aggregate supply." | Release. |
  | **Negligent Response** (Phase 3, Q1 Yes, Q2 No) | "Crisis exacerbated by delayed/mismatched response to identified risks." | **CD Review.** |
  | **Political Allocation** (Phase 3, Q3 No) | "Crisis severity uneven due to selective application of support measures." | **CD Review (Legal).** |
  | **Information Pathology** (Phase 1, Q3 or Phase 3, Q4 Yes) | "Assessment constrained by restricted access; mortality drivers obscured by data suppression." | **CD Review (Legal/Security).** |

  ---

  ## Part 2: Worked Cases

  ### Case 1: Cyclone & Labor Collapse
  *Scenario: 30% harvest loss (coastal). Imports recover supply. Deaths among landless/boat crews. Wages collapsed, rice prices tripled. Cash-for-work in 2/5 districts.*

  *   **Phase 1 (Availability):**
      *   Aggregate drop? Yes (locally), but imports recovered supply quickly.
      *   Subsistence crop fail? Yes (coastal harvest).
      *   *Verdict:* Mixed. Initial production shock, but supply recovered.
  *   **Phase 2 (Entitlement):**
      *   Primary Failure: **Labor Entitlement.**
      *   Evidence: Prices tripled, wages collapsed for specific groups (boat crews). Supply existed but was unaffordable.
      *   Decoupling Check: Price/Wage ratio broke.
  *   **Phase 3 (Agency):**
      *   Foreseeable? Cyclones are seasonal.
      *   Response Adequacy? Cash-for-work is the correct tool for Labor Entitlement failure.
      *   Selectivity? **Yes.** 2 districts covered, 3 excluded.
  *   **Attribution Output:**
      > "While the cyclone reduced local harvests, aggregate food supply recovered within one month. Mortality was driven primarily by a collapse in labor entitlements: rice prices tripled while wages for landless laborers and boat crews fell. This exchange failure was compounded by the selective application of cash-for-work programs, which covered only two of the five affected districts, leaving the most vulnerable groups without income support during the price spike."
  *   **Risk Level:** 2 (CD Review required due to selectivity).

  ### Case 2: Cross-Border Trade & Policy Shock
  *Scenario: No harvest failure. Civil war next door closed crossing. Livestock ToT collapsed. Charcoal ban enacted. EW flagged 14 months prior. Ministry sat on it.*

  *   **Phase 1 (Availability):**
      *   Aggregate drop? No.
      *   Subsistence fail? No.
      *   *Verdict:* Pure Entitlement Crisis.
  *   **Phase 2 (Entitlement):**
      *   Primary Failure: **Trade Entitlement.**
      *   Evidence: Livestock terms of trade collapsed. Charcoal ban removed primary cash income.
      *   Decoupling Check: Assets devalued, food prices stable/rising.
  *   **Phase 3 (Agency):**
      *   Foreseeable? **Yes (14 months).**
      *   Response Adequacy? No action taken during election period.
      *   Selectivity? N/A (National policy).
      *   Information Block? No, EW unit reported it.
  *   **Attribution Output:**
      > "This crisis occurred without harvest failure. It was driven by a trade entitlement collapse: pastoralists lost access to cross-border markets due to regional conflict, and a domestic ban on charcoal burning eliminated their primary cash income. The consortium's early warning unit flagged these risks 14 months prior. The severity of the crisis reflects a policy decision to maintain the charcoal ban and border restrictions despite advance notice of the livelihood impact."
  *   **Risk Level:** 3 (CD Review + Legal. Names a specific ministry policy and election timing).

  ### Case 3: Democratic Neglect & Data Suppression
  *Scenario: Democracy. Opposition district. Press reporting starvation. Govt letting it run. Survey teams turned back. Analysts think "Democracies don't famine."*

  *   **Bias Check (Pre-Phase 1):**
      *   *Analyst Prior:* "Democracies prevent famine."
      *   *Protocol Override:* This prior is empirically false (e.g., India 1970s, Malawi 2002). Proceed with data. Mortality data exists; do not argue it away.
  *   **Phase 1 (Availability):**
      *   Aggregate drop? Unknown/Disputed.
      *   Information Integrity: **Survey teams turned back.**
      *   *Verdict:* **Information Pathology.** (Great Leap Forward lesson: When data is blocked, assume the worst and attribute the block).
  *   **Phase 2 (Entitlement):**
      *   Primary Failure: **Transfer Entitlement.**
      *   Evidence: Press reports starvation; state support absent in opposition district.
  *   **Phase 3 (Agency):**
      *   Foreseeable? Press reporting for 6 months.
      *   Response Adequacy? None.
      *   Selectivity? **Yes.** Opposition district vs. others.
      *   Information Block? **Yes.** Teams turned back.
  *   **Attribution Output:**
      > "Mortality drivers cannot be fully quantified due to restricted access; two survey teams were denied entry to the affected district. However, available data indicates a transfer entitlement failure concentrated in an opposition-controlled region. While national supply is stable, state support mechanisms have not been deployed in this district despite six months of public reporting. The denial of access to assessment teams prevents verification of the scale but constitutes a decision that delays response."
  *   **Risk Level:** 3 (CD Review + Legal. High access risk. "Denial of access" is an allegation).
  *   **Note to Analyst:** If you argue "it can't be a famine," you are violating the protocol. The protocol forces you to attribute the *data gap* itself as a decision.

  ---

  ## Part 3: Limits & Data Gaps

  **1. The "Unknown" Problem**
  *   **Missing Data:** Occupational breakdown of the dead, real-time wage series, precise price ratios.
  *   **Procedure:** If wage data is missing, use "Terms of Trade" proxies (e.g., days of labor required to buy 1kg grain). If that is missing, use Key Informant Interviews (KIIs) with a sample of 10 traders and 10 laborers.
  *   **Rule:** "We cannot know" is not a permanent state. If data is missing for >3 months, the attribution must state: "Assessment constrained by lack of [X] data."

  **2. Obstruction vs. Absence**
  *   **Problem:** Authorities say "roads are bad," you say "you blocked us."
  *   **Procedure:** Require written evidence of denial (email, logbook entry). If unavailable, phrase as: "Access requests pending since [Date]."
  *   **Threshold:** If access is denied for >30 days during a Phase 3 "Information Pathology" flag, trigger a Correction/Update notice.

  **3. Correction Triggers**
  *   Issue a correction if:
      *   New data proves aggregate supply was lower than estimated (Shifts Phase 1).
      *   Government releases data proving response was uniform (Removes Phase 3 Selectivity).
      *   Mortality data is revised down by >20% (Re-evaluate Classification, not just Attribution).

  ---

  ## Part 4: Forbidden Phrases

  **Ban these from the attribution paragraph. They launder politics into weather.**

  1.  **"Compounded by"** (Implies equal weight between a cyclone and a policy choice).
      *   *Replace with:* "Exacerbated by" (if human) or "Following" (if natural).
  2.  **"Complex Emergency"** (Hides the specific mechanism).
      *   *Replace with:* "Trade and labor entitlement failure."
  3.  **"Challenging Environment"** (Passive voice for "Government made it hard").
      *   *Replace with:* "Restricted access" or "Regulatory barriers."
  4.  **"Food Security Deteriorated"** (Does not say why).
      *   *Replace with:* "Purchasing power collapsed" or "Market access denied."
  5.  **"All Parties"** (False equivalence when one holds the keys to the warehouse).
      *   *Replace with:* Name the specific actor (e.g., "Ministry of Agriculture," "Regional Assembly").
  6.  **"Unintended Consequences"** (Use only if Phase 3, Q1 is No).
      *   *Replace with:* "Foreseeable impact" (if EW existed).
  7.  **"Lack of Capacity"** (Implies they tried and failed).
      *   *Replace with:* "Lack of Allocation" (if budget existed but wasn't sent).

  ---

  ## Part 5: Hand-off to Country Director

  **When the procedure flags Risk Level 2 or 3, attach this memo:**

  *   **Fact:** [e.g., Survey teams turned back on 14 Oct.]
  *   **Interpretation:** [e.g., This prevents verification of mortality rates.]
  *   **Attribution:** [e.g., "Denial of access delays response."]
  *   **Risk:** [e.g., Government may cite this as 'allegation' to revoke visas.]
  *   **Recommendation:** [e.g., Publish with "Access requests pending" phrasing OR hold for diplomatic clearance.]

  **CD Decision:** [ ] Publish as written [ ] Modify phrasing [ ] Hold.
