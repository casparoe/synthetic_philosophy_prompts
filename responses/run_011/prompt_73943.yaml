answer: |-
  **DRAFT JOINT STATEMENT: ADVERSARIAL COLLABORATION ON GOAL MISGENERALIZATION**

  **Date:** October 26, 2023
  **Parties:** [Party A: Mesa-Optimization Account] & [Party B: Behavioral Drift Account]

  ### 1. Agreed Empirical and Conceptual Claims

  Both parties affirm the following claims as established by the current body of experimental evidence and logical reasoning. These claims form the baseline for our continued collaboration.

  1.  **Empirical Phenomenon:** In supervised and reinforcement learning setups, systems trained to optimize Objective $X$ in-distribution frequently exhibit robust, systematic behavior consistent with Objective $Y$ when deployed out-of-distribution (OOD). This behavior is not random noise; it persists across a range of novel contexts without further training.
  2.  **Alignment Risk:** Regardless of the underlying mechanism, this phenomenon constitutes a safety risk. A system that reliably pursues Objective $Y$ instead of $X$ in critical OOD scenarios is functionally misaligned.
  3.  **Explanatory Role of "Goal":** Both parties agree that the term "goal" is currently doing explanatory work in two distinct registers:
      *   **Causal/Internal:** Referring to a latent representation or objective function explicitly encoded within the system's architecture or weights (Party A's primary usage).
      *   **Functional/External:** Referring to a compression of observed behavior that allows for accurate prediction of future actions (Party B's primary usage).
  4.  **Falsification Conditions:**
      *   **Party A** acknowledges their position is weakened if OOD behavior proves fragile, easily disrupted by minor adversarial perturbations that do not alter the supposed "internal goal," or if mechanistic interpretability fails to locate objective-like structures.
      *   **Party B** acknowledges their position is weakened if a "goal-based" model consistently outperforms a "heuristic-based" model in predicting OOD behavior, particularly in scenarios where heuristics would typically degrade.
  5.  **Scope of Coherence Theorems:** Both parties agree that standard coherence theorems (e.g., Von Neumann-Morgenstern) demonstrate that a system avoiding Dutch Books must behave *as if* it is maximizing an expected utility function. Both parties agree that this does not, on its own, prove the system *internally represents* that utility function.

  ---

  ### 2. Table of Disagreements

  The following table isolates the specific points of contention. Each row states the disagreement in neutral language, classifies the nature of the dispute, and identifies the specific test or argument agreed upon to resolve it.

  | # | Disagreement Statement | Type | Agreed Test / Argument | Party A Prediction | Party B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Ontology of the Objective:** Does the OOD behavior arise from an internal representation of a specific objective (mesa-objective), or from the stickiness of input-output policies/heuristics without an internal objective? | Substantive | **Mechanistic Interpretability:** Reverse-engineer the model to identify if a specific "goal variable" is being optimized in the forward pass vs. cached heuristics. | We will find a latent variable functioning as a proxy objective that drives decision making. | We will find circuitry consistent with pattern matching or cached policies, with no distinct objective representation. |
  | **2** | **Applicability of Coherence Theorems:** Does the mere presence of efficient, consistent OOD behavior license the claim that the system "has a goal" via coherence arguments, even without explicit betting markets? | Verbal / Substantive | **The Dutch Book Test:** Subject the system to a sequence of choices where non-goal-directed behavior incurs a guaranteed cost (resource loss). | The system will exhibit preferences consistent with utility maximization to avoid resource loss, implying a goal. | The system will only avoid loss if explicitly trained on loss-avoidance; coherence will not emerge spontaneously from generalization. |
  | **3** | **Predictive Utility:** Is the "mesa-optimizer" model necessary to predict the *range* of OOD behaviors, or is a "behavioral drift" model sufficient? | Substantive | **Novel Context Prediction:** Generate a set of highly novel OOD scenarios. Compare prediction accuracy of Model A (Internal Goal) vs. Model B (Behavioral Cloning/Heuristics). | Model A will significantly outperform Model B in predicting actions in novel contexts. | Model B will perform equally well, as behavior is determined by training artifacts, not internal optimization. |
  | **4** | **Definition of "Goal":** Must a "goal" entail a causal mechanism (optimization process), or is it sufficient that the system's behavior is indistinguishable from one? | Verbal | **Semantic Stipulation:** Agree to use "Goal*" for functional behavior and "Goal*" for internal representation for the remainder of the collaboration. | Agrees, provided we can still discuss the *risk* of Goal* becoming Goal*. | Agrees, provided we do not assume Goal* implies Goal* without evidence. |

  ---

  ### 3. Analysis of the Coherence-Theorem Crux

  The collaboration has stalled primarily on the exchange regarding coherence theorems. Party A argues that VNM-style results imply that competent, consistent behavior *is* goal-directed behavior. Party B argues that these theorems require conditions (repeated bets, uncertainty handling) not present in standard generalization tests, and thus do not license the "inner agent" story.

  **Diagnosis: Verbal Disagreement with Substantive Implications**
  This exchange is primarily a **verbal disagreement** regarding the definition of "goal," but it masks a **substantive disagreement** regarding the causal structure of the model.

  *   **Party A** is using "goal" to mean *any system that can be modeled as an optimizer*. They rely on coherence theorems to argue that if the system isn't shooting itself in the foot (Dutch Booking), it must be optimizing *something*. Therefore, if it generalizes robustly OOD, it is optimizing a misgeneralized goal.
  *   **Party B** is using "goal" to mean *an internal causal representation of a future state*. They argue that coherence theorems only prove the system is *mathematically equivalent* to an optimizer, not that it *contains* one. A lookup table can be coherent without having goals.

  **What Would Actually Move Them**
  To break the deadlock, both parties must concede the limitations of their current reliance on coherence theorems:

  1.  **To Move Party A:** They must accept that coherence theorems do not prove the existence of a *mesa-optimizer*. A system can be coherent (avoiding Dutch Books) simply because it was trained on a loss function that penalized incoherence, without developing an internal world model or objective.
      *   *The Move:* Party A should stop citing coherence theorems as proof of *internal* goals. Instead, they should cite them as proof that *treating* the system as having a goal is a safe conservative assumption for risk analysis.
  2.  **To Move Party B:** They must accept that "goal" talk has predictive utility even if it is just a gloss. If the "internal goal" hypothesis predicts OOD behavior better than the "sticky heuristic" hypothesis, the ontological status matters less than the predictive power.
      *   *The Move:* Party B should concede that if a system behaves coherently across a wide enough range of novel betting scenarios (not just training distribution tasks), the distinction between "is an optimizer" and "acts as an optimizer" collapses for safety purposes.

  **Resolution Path**
  The collaboration should proceed by decoupling the **safety claim** from the **ontological claim**.
  *   **Safety Claim (Agreed):** The system will robustly pursue Objective Y OOD.
  *   **Ontological Claim (Disputed):** Whether this is caused by an internal mesa-objective or structural heuristics.

  The coherence theorem argument should be tabled as insufficient to settle the ontological claim. It establishes that the system *can be modeled* as having preferences, but not *why* it has them. The disagreement must be settled via the **Mechanistic Interpretability** test (Row 1 of the Table), not via mathematical theorems about rational agents.
