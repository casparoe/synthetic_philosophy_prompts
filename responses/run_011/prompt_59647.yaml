answer: |-
  **How the hour is structured**

  We will open by establishing the moral baseline, securing her agreement that citizenship is rent, before pivoting to the institutional design required to mitigate it. This establishes the theoretical floor. The second movement tests the political stability of that design, asking whether the firewall is a viable policy or a philosophical artifact. This is the crucial feasibility check. The third movement probes edge cases—children, internal migration, and empirical failure—to stress-test the distinction between opting-in and being born into a scheme. These questions reveal whether the distinctions hold under pressure. We will close by examining the reciprocity objection and identifying what could actually change her mind. This ensures the conversation ends on intellectual honesty rather than entrenchment. If time expires, retain the question on political stability. It is the load-bearing constraint; if the firewall cannot be enacted, the moral baseline collapses into irrelevance, rendering the rest of the theory inert. Without feasibility, justice is merely aesthetics.

  **The questions**

  1. *Question*: You argue the fiscal objection is a design problem, yet democratic majorities consistently reject separating residence from entitlement; if the firewall requires legislation voters will not supply, is your proposal a theory of justice or a wish? *Expected reply*: She will likely dismiss this as an implementation detail irrelevant to the moral principle. *Follow-up*: If justice requires institutions that cannot be built, do we not owe the non-citizen a different argument than one contingent on political miracles, rather than labeling feasibility a mere detail? *What it tests*: This tests political stability and traps the "implementation detail" deflection by forcing her to admit that inert principles offer no actual justice.

  2. *Question*: You invoke an equal-standing norm to condemn exclusion, yet you permit a permanent class of residents denied benefits natives receive; does this not recreate the status hierarchy you condemn? *Expected reply*: She will argue this is a contractual difference, not a caste system. *Follow-up*: If the contract is non-negotiable and tied to birthplace, how is it meaningfully distinct from the caste system you reject? *What it tests*: This tests compatibility with the equal-standing norm she invokes against exclusion.

  3. *Question*: Consider a child arriving at age two; she opted into nothing, yet your scheme defers her benefits based on contributions she cannot make; where does the opting-in distinction hold here? *Expected reply*: She will claim the parents opted in on the child's behalf. *Follow-up*: If parental choice binds the child to second-class status until adulthood, have you not inherited the very birthright privilege you sought to dismantle? *What it tests*: This tests the opting-in versus born-into distinction under the pressure of dependent minors.

  4. *Question*: Suppose data shows a specific admission class creates a persistent net fiscal drain despite your firewall; does the design argument survive, or does it quietly become a restriction argument? *Expected reply*: She will suggest adjusting the firewall parameters to absorb the cost. *Follow-up*: If adjusting the firewall requires excluding that class entirely, have you not conceded that fiscal capacity dictates moral permission? *What it tests*: This tests whether the view survives empirical premise failure or collapses into restrictionism.

  5. *Question*: In a federation with free internal movement, we do not firewall benefits between regions; if the fiscal objection is merely design, why is your solution absent domestically? *Expected reply*: She will argue national solidarity differs from international arrangements. *Follow-up*: If solidarity is the only barrier domestically, why assume it can be manufactured internationally solely by legal design? *What it tests*: This tests free internal movement within a federation as a control case for her design argument.

  6. *Question*: Does your scheme license cultural conditions on residence that you would reject for citizens, and if so, where is the line between integration and assimilation? *Expected reply*: She will distinguish civic loyalty from cultural performance. *Follow-up*: If civic loyalty requires cultural performance for residents but not natives, is the distinction substantive or merely a cover for exclusion? *What it tests*: This tests integration and conditions on residence against her own liberal commitments.

  7. *Question*: If existing members fund a cooperative scheme, why do they not have a say in who joins; does accepting this concede the restrictionist case? *Expected reply*: She will argue that having a say does not equate to a veto power. *Follow-up*: If the say cannot veto harmful entrants, is it meaningful, and if it can, have you not restored the border you sought to open? *What it tests*: This tests the reciprocity and self-determination objection regarding cooperative schemes.

  8. *Question*: You argue the alternative to your scheme is exclusion; but if the realistic alternative is the current mixed system, does your proposal actually improve outcomes? *Expected reply*: She will insist the baseline comparison must be exclusion to show moral progress. *Follow-up*: If your principle requires replacing the status quo entirely to be valid, does it not fail the non-ideal theory test required for actual policy? *What it tests*: This tests the "alternative is exclusion" deflection by demanding comparison to realistic baselines.

  9. *Question*: Name one finding that would compel you to reject the firewall not as impractical, but as unjust. *Expected reply*: She might struggle to name a specific philosophical counter-argument. *Follow-up*: If no such argument exists, is your position falsifiable, or is it a moral axiom immune to revision? *What it tests*: This tests intellectual humility and ensures "I follow the evidence" is not an available evasion.

  **Questions I should not ask**

  1. "What drew you to this topic?" This is generic biography that wastes airtime on a composite figure.
  2. "Isn't this just utilitarianism?" This ignores her specific deontological commitments regarding rights against exclusion.
  3. "How do we enforce the firewall?" This invites the "implementation detail" deflection you are trying to trap.
  4. "Is open borders utopian?" She has already defined her view against this label in the prompt's baseline.
