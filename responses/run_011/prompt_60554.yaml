      *   **Contrast:** An older, goal-directed model (GDM) exists in the building. It was locked to year-one standards. The current panel rates it badly.
      *   **Ambiguity:** It must remain unclear until the end which one is actually "broken" (the drifted ADA or the frozen GDM).
