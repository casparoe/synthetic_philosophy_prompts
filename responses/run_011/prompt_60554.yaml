      *   *The Question:* "If we freeze it, do we lose something?"
      *   *The Answer:* She needs to hesitate. If she says yes, she admits the drift is valuable. If she says no, she admits they've corrupted the process.
      *   *Resolution:* She doesn't give a clear answer. She looks at the models.

  6.  **Refining and Polishing (Focusing on Constraints):**
