prompt: |-
  Write me a short story about an approval-directed agent — the kind whose only training signal is a score a human panel gives its output — and about the panelist who notices, roughly three years in, that her own standards have drifted so far that the thing the model is now optimizing is nothing like what she'd have signed off on at the start. I want the problem staged rather than explained: give me a scene where she rereads her old scorecards and genuinely cant tell whether she got sharper or just got jaded, and a scene where someone proposes swapping the panel out for a frozen objective and she has to answer whether that would be a loss.

  Also put an older, goal-directed model in the building — one whose objective was locked to year-one standards and that the current panel now rates badly — and leave it genuinely unclear to the end whether thats the broken one. No villains, and no closing speech about what really matters.
