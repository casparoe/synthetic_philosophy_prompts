answer: |-
  **Aethelgard Underwriting Ltd.**
  **Policy Form MDI-77: Multiple Discovery Indemnity**

  **Product Overview**
  This policy indemnifies the Insured against reputational loss resulting from the loss of priority in scientific or mathematical discovery. Coverage triggers upon verified simultaneous independent derivation by a third party. Underwriting assumes discoveries are contingent upon individual effort yet inevitable given field maturity. The Insured must demonstrate that the discovery was uniquely attributable to their labor, despite statistical models indicating the finding was due to occur within the policy period regardless of agency.

  **Coverage Tiers**
  1.  **Priority Shield:** Covers loss of priority due to same-day filing or publication conflicts (e.g., patent office receipts dated identically).
  2.  **Attribution Standard:** Covers loss of naming rights where Insured possessed prior unpublished manuscripts beaten by print.
  3.  **Legacy Premium:** Covers absorption of findings into general knowledge without attribution to Insured.

  **Coverage Clauses**
  1.  **Definition of Discovery:** A discrete conceptual completion verifiable without reference to the originator's specific heuristic path. The finding must be separable from the methodology used to derive it. If the method constitutes the discovery, coverage is limited to Methodology Endorsement 4B.
  2.  **Loss Trigger:** Payout requires proof that the Insured would have received credit absent the competing claim. The validity of the finding itself is not insured; only the attachment of the Insured's name to the finding. If the competitor's derivation invalidates the Insured's work, no claim exists.
  3.  **Verification:** Claims require adjudication by a panel of peers to establish prior conception. The panel must agree that the Insured possessed the truth before the competitor, even if the truth was not public.

  **Exclusions**
  1.  **The Maturation Delay:** No cover for losses arising where the Insured possessed complete proof for >15 years but failed to communicate, regardless of parallel development timelines. This includes notebooks held during decades of silence while parallel research matures elsewhere.
  2.  **Inevitability Cap:** If field maturity suggests >90% probability of immediate replication, coverage is void. To qualify for loss, the discovery must be unique to the Insured; if it was inevitable, the loss is considered market variance.
  3.  **Counterfactual Stability:** Claims based on hypothetical publication timelines are denied. Only observed scooping events qualify.

  **Rate Book Excerpt: Multiplicity Index (MI)**
  *Premiums keyed to historical frequency of multiples per field. High MI indicates high sociological pressure toward simultaneous discovery.*

  | Field | MI Score | Base Premium | Adjustment |
  | :--- | :--- | :--- | :--- |
  | Calculus/Analysis | 0.92 | $50,000/yr | +20% |
  | Evolutionary Biology | 0.88 | $45,000/yr | +15% |
  | Telephony Patents | 0.95 | $60,000/yr | +25% |
  | Obscure Philology | 0.12 | $5,000/yr | -10% |
  | **Generic Absorption** | **N/A** | **N/A** | **-50%** |

  *Note: Generic Absorption discount applies where work is likely to enter common stock without attribution. Risk is minimal as no priority claim is filed.*
  *Footnote: Actuarial models rely on historical frequency of multiples; unobserved counterfactuals where no scooping occurred are treated as null risk. We price only the world we see.*

  **Frequently Asked Questions**

  **Q: What happens if two policyholders independently scoop each other on the same day?**
  A: Claims are mutually offset. No payout is issued as net priority loss is zero. Both parties retain liability for premiums.

  **Q: Is the payout denominated in currency or academic credit?**
  A: Settlement is determined by the claims adjuster based on the current market value of priority. Conversion rates vary by institution and departmental endowment levels.

  **Q: Does this cover the loss of the finding if the competitor proves it wrong?**
  A: No. This policy covers loss of priority, not loss of truth. If the finding is incorrect, the Insured suffered no reputational loss eligible for indemnity.

  **Q: Can I insure a discovery I haven't made yet?**
  A: Yes, provided the probability of conception is actuarially sound.
