  You haven't discovered a glitch in the matrix, and you aren't crazy. You have stumbled onto a specific, mathematically sound configuration of **Social Choice Theory** and **Ensemble Learning** that is rarely discussed in pop science because it violates the "common sense" assumptions of the Wisdom of Crowds.

  Here is the breakdown of what you have, what it's called, where the edges are, and how confident I am that you aren't just re-holding a known trophy.

  ### 1. Does it have a name?

  There is no single, famous noun phrase (like "The Dunning-Kruger Effect") that exclusively describes "a group of individually incompetent people producing a competent majority." However, there are two formal frameworks that claim this territory.

  **A. The Diversity Prediction Theorem (Scott Page)**
  *   **The Concept:** This theorem states: `Collective Error = Average Individual Error − Prediction Diversity`.
  *   **How it fits:** It mathematically proves that a crowd can be more accurate than its average member if their errors are diverse (uncorrelated).
  *   **How it's off:** The popular telling of this theorem usually assumes individuals are at least *somewhat* competent (error isn't massive) or that they are estimating numbers (continuous variables), not binary yes/no votes. It doesn't explicitly highlight the "everyone is worse than a coin flip" paradox as a feature, though the math allows for it.
  *   **Verdict:** This is the engine under your hood, but it's not the specific name for the *phenomenon* of incompetent individuals creating competent aggregates.

  **B. Condorcet's Jury Theorem (Relaxed)**
  *   **The Concept:** The standard theorem says if individual accuracy $p > 0.5$, the group converges to 100%. If $p < 0.5$, the group converges to 0%.
  *   **How it fits:** You are living in the exception clause. The theorem assumes voters are **independent and identically distributed (i.i.d.)**. You have proven your voters are **dependent** (structured camps) and **heterogeneous** (different types of wrong).
  *   **Verdict:** You are violating the assumptions of the standard theorem, not the math itself.

  **C. The Closest Technical Term: "Negative Correlation of Errors"**
  In machine learning (ensemble methods), what you have built is a **Classifier Ensemble with Negatively Correlated Weak Learners**.
  *   **Weak Learner:** A model (person) that is only slightly better than random. (Yours are slightly *worse*).
  *   **Negative Correlation:** When one is wrong, the other is right.
  *   **The Mechanism:** Your "Rain Camp" and "Dry Camp" are essentially **Complementary Specialists**. One is wrong when it's dry; the other is wrong when it's wet. Individually, they look incompetent because they fail half the time. Together, they cover each other's blind spots.

  **The Name I'm Coining For You:**
  Since there isn't a clean label, the most accurate descriptive term for your specific setup is **The Decorrelated Incompetence Effect**.
  *   **Definition:** A phenomenon where a majority vote yields high accuracy despite all individual voters having accuracy below chance level ($p < 0.5$), caused by high diversity in error structures (negative correlation) rather than individual skill.

  ### 2. Where are the edges? (Your Boundary Questions)

  **Does it still count with three camps instead of two?**
  **Yes.** In fact, it might work better. If you have a "Rain" camp, a "Dry" camp, and a "Cloudy/Uncertain" camp (who maybe abstain or guess randomly), you increase the **Diversity** term in Page's theorem. As long as the third camp's errors don't correlate perfectly with one of the existing camps, they add noise that can break ties in favor of the truth.

  **What if the camps are lopsided in size?**
  **It breaks.** This is the fragility of your system. If the "Rain Camp" grows to 8 people and the "Dry Camp" shrinks to 1, the majority vote will simply become the "Rain Camp" vote. Since the Rain Camp is individually <50% accurate, the group accuracy will collapse to match them. Your 71% success rate depends on a **balance of biases**.

  **Is the one-day-in-ten where we all miss together part of the same phenomenon?**
  **No, that is Common Mode Failure.** This is the hard limit of the effect. Your system works because errors are *diverse*. On those days where everyone misses together, the errors have become *correlated*. This usually happens due to an external variable none of you are tracking (e.g., a microclimate shift the ridge station picks up but you don't, or a specific weather pattern like "atmospheric river" that fools both camps). This isn't the phenomenon failing; it's the phenomenon revealing its dependency on error diversity.

  **Does it need a yes/no question or would it work with numbers?**
  **It works even better with numbers.** If you were guessing rainfall in millimeters (continuous), you would be describing the classic **Wisdom of Crowds**. Averaging numbers cancels out noise more smoothly than binary majority voting. The binary (yes/no) constraint is actually what makes your result *more* impressive, because voting loses information (magnitude of belief) compared to averaging.

  **What happens the moment we're allowed to talk before submitting?**
  **The effect dies immediately.** This is called an **Information Cascade**.
  If you talk, the "Rain Camp" persuades the "Dry Camp" (or vice versa). You homogenize your errors. Once your errors become correlated (you all agree for the *same reason*), the Diversity term drops to zero. The group accuracy will collapse to the average individual accuracy (which is <50%). Silence is the fuel for your engine.

