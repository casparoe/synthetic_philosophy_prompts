  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "liability vs. moral authority" tension? Yes, that's central to the Positivism angle.
      *   *Check:* Did I address the "standard vs. report" oscillation? Yes, frame it as "reflective equilibrium" or "operational smoothing."
      *   *Check:* Did I answer what breaks if we change views? Need to be specific about contractor rubrics and escalation.
      *   *Check:* Word count. Need to expand on the "What Breaks" section to ensure length and depth.
      *   *Check:* Technical definitions. Ensure they are simple.

  8.  **Final Polish:** Ensure the distinction between *prescriptive* (ought) and *descriptive* (is) is clear. Emphasize that the "philosophy" is emergent from the engineering constraints, not the other way around.

  *(Self-Correction on Word Count)*: 1200-1500 words is substantial. I need to make sure I don't skimp on the "What Breaks" section. I should elaborate on the contractor experience and the escalation path.

  *(Self-Correction on Tone)*: Avoid being too academic. Keep it grounded in the "lab reality" the user described. Use terms like "gradient descent," "reward model," "annotation variance."

