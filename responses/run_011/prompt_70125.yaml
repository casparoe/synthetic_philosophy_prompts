  2.  **Deconstruct the Situation:**
      *   The document acts as a *constitution* for the model.
      *   The training process (RLHF) uses the document as a *rubric* for reward modeling.
      *   There's a tension between *legal liability* (why rules exist) and *ethical framing* (how rules are sold).
      *   There's a tension between *prescriptive* (what should happen) and *descriptive* (what does happen).
      *   The hierarchy (Platform > Developer > User) is rigid, not reason-based.

  3.  **Brainstorming Candidate Readings (for the intro):**
      *   *Reading 1: Social Contract Theory.* The doc is a contract between company, user, and society. (Reject: Users don't consent, no negotiation.)
      *   *Reading 2: Legal Positivism.* Rules are valid because the sovereign (company) says so. (Strong candidate.)
      *   *Reading 3: Technocratic Paternalism.* The company knows best what's safe/good. (Strong candidate.)
      *   *Reading 4: Pragmatic Instrumentalism.* The doc is just a tool to reduce variance in training data. (Strong candidate.)
      *   *Rejected Reading:* Deliberative Democracy. (Why: No actual deliberation with stakeholders, just 9 people in a room.)

  4.  **Developing the Core Analysis:**
      *   **Implicit Theory:** It's a mix of *Legal Positivism* (authority comes from position, not morality) and *Operational Pragmatism* (the doc must match the trainable signal).
      *   **Authority:** Sovereign is the Company, but acting as a *Liability Shield* first, *Moralist* second.
      *   **Rules:** Hard rules are *constraints* (negative liberty), defaults are *nudges* (positive liberty).
      *   **Document Status:** It's a *Performative Text*. It creates reality by describing it, but also bends to describe reality when training fails.
      *   **Consistency:** It's inconsistent philosophically but consistent *operationally*. The circularity (standard vs. report) is a feature, not a bug—it allows alignment drift without admitting failure.
      *   **Underdetermination:** The pipeline doesn't care *why* a rule exists, only that it's labeled "hard." Moral realism vs. emotivism are indistinguishable to the gradient descent.
      *   **Rival Views:**
          *   *Reason-weighing:* Breaks the rubric. Contractors can't argue philosophy per sample.
          *   *Consent-based:* Breaks the business model (API customers want control).
          *   *Descriptive-only:* Breaks the training signal (no target to aim for).

  5.  **Drafting - Section by Section:**

      *   **Intro/Brainstorming:** Lay out the readings. Reject "Social Contract" because there's no consent. Settle on "Liability-Driven Positivism."
      *   **Implicit Theory:** Define the document as a *Constitutive Rulebook*. Authority is hierarchical, not reasoned.
      *   **Rival Views:** What gets excluded? Case-by-case ethics (too expensive), User Sovereignty (too risky).
      *   **Consistency & Sovereignty:** Address the standard/report oscillation. It's a *feedback loop*, not a contradiction. Sovereignty is the Company as *Risk Manager*.
      *   **Underdetermination:** The ML pipeline is morally blind. It just needs labels.
      *   **Concrete Changes:** What happens if we switch to reason-weighing? Contractors quit or variance spikes. What if descriptive only? Model drifts without correction.

  6.  **Refining Tone and Constraints:**
      *   Tone: Insider philosopher, pragmatic, slightly critical but understanding the constraints.
      *   Word Count: Aim for 1200-1500.
      *   Definitions: One-liners for terms like RLHF, System Prompt, etc.
