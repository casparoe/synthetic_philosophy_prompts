      *   **Context:** A 4-hour meeting about a loophole. Coordinated campaign using a feature *as documented*. Acting against them breaks a published rule. Colleague wrote "Let justice be done though the heavens fall" (*Fiat justitia ruat caelum*) on the whiteboard to end the debate.
      *   **Observation:** The phrase is now being used in Slack for wildly different, sometimes contradictory purposes.
      *   **Task:**
