answer: |-
  **PHIL 705: Philosophy of History**
  **Final Examination**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Question 1**

  Consider the following three historical transitions:

  > **(a)** The abandonment of the southern Maya lowland cities between roughly 750 and 950 CE, with dynastic kingship and monumental construction ending there while the population persists and northern centres rise.
  > **(b)** The breakdown of the Late Bronze Age palatial systems around 1200 BCE, after which literacy, palace redistribution, and long-distance elite exchange vanish from much of the Aegean for centuries, though the population is not annihilated and eventually produces the polis.
  > **(c)** The end of the Roman Republic, where a regime dies but administrative capacity, cities, trade, and literature expand under the Principate.

  Construct a philosophical definition of societal 'collapse' that classifies (a) and (b) as instances of collapse, but (c) as an instance of *not* collapse. Your definition must not be tailored ad hoc to these cases; it must identify a general structural criterion.

  In your essay, you must address two further demands:
  1.  **Ontology:** Explain what work the concept 'collapse' is doing that 'change' is not. Given that in (a) and (b) the population and cultural traditions persist, identify precisely what entity has collapsed.
  2.  **Normativity:** Evaluate whether your structural definition renders 'collapse' an inherently value-laden term. If complexity carries costs and its loss can raise ordinary welfare, is 'collapse' analytically useful or morally prejudiced?

  ***

  ### Model Answer

  **Defining Collapse: Complexity, Ontology, and Value**

  To distinguish societal collapse from mere political transformation or cultural evolution, we must define society not by its demographic continuity nor its specific regime type, but by its capacity for socio-political complexity. A robust definition of collapse is: *a rapid, significant loss of an established level of socio-political complexity, manifested in the reduction of information processing, stratification, and economic specialization.* This definition successfully sorts the provided cases. It classifies the Maya (a) and Late Bronze Age (b) transitions as collapses, while excluding the Roman transition (c), without resorting to ad hoc stipulations.

  In cases (a) and (b), the defining structures of complexity vanish. In the southern Maya lowlands, the cessation of dynastic kingship and monumental construction signals the failure of the centralized apparatus required to coordinate labor and legitimize hierarchy. Similarly, the Late Bronze Age breakdown is characterized by the loss of literacy, palace redistribution, and long-distance exchange. These are not merely stylistic changes; they represent a reduction in the society's ability to process information and manage energy flows across a wide region. The system simplifies. Conversely, in case (c), the end of the Roman Republic involves a change in the *source* of sovereignty (Senate to Princeps), but not a reduction in complexity. Administrative capacity, urbanization, and trade expanded under the Principate. The information processing capacity of the state increased even as the constitutional form altered. Therefore, (c) is a regime change, not a systemic collapse.

  This structural definition addresses the ontological demand: what work does 'collapse' do that 'change' does not? If we identify society solely with its population or enduring cultural traditions, neither (a) nor (b) qualifies as a collapse, for the people survived and cultural memories persisted. However, 'society' in the context of collapse theory refers to the *organizing structure* that binds the population into a specific mode of production and governance. 'Change' implies a transformation where the system retains its complexity or evolves into a new complex form. 'Collapse' implies simplification. In (a) and (b), the specific entity that collapses is the *stratified political economy*. The loss is not of human life per se, but of the institutional machinery that sustained a specific level of social differentiation. To call this merely 'change' is to obscure the directional nature of the event; it is a negation of capacity. The concept 'collapse' is necessary to describe the phenomenon where a society becomes less capable of solving collective problems than it previously was, regardless of whether the individuals within it survive.

  This leads to the second demand regarding normativity. Is 'collapse' value-laden? If we define collapse as the loss of complexity, we must acknowledge that complexity is not inherently synonymous with human welfare. As Tainter noted, complexity carries costs; increased stratification often correlates with increased inequality, poorer health metrics for the commoner, and reduced resilience. In the Greek Dark Ages following the Bronze Age collapse, the loss of palatial redistribution may have liberated peasants from extractive tribute, potentially raising ordinary welfare. If 'collapse' implies a moral catastrophe, the term is analytically useless for case (b), where the outcome may have been a net benefit for the majority.

  However, a structural definition allows us to separate the analytical from the moral. 'Collapse' describes a reduction in organizational capacity, not necessarily a moral failing or a humanitarian disaster. It is value-laden only in the sense that it identifies the loss of a specific type of order. We can acknowledge that a collapse occurred in the Aegean without asserting that the subsequent population was 'worse off' in terms of quality of life. The term remains analytically useful because it tracks the trajectory of social organization. If we refuse to use 'collapse' because the survivors were happier, we lose the vocabulary to discuss why certain organizational forms fail to sustain themselves.

  Nevertheless, we must be wary of 'complexity bias.' Historians often equate the loss of monumental architecture or literacy with a loss of value. A philosophical definition must resist this. The definition proposed here avoids this trap by focusing on *capacity* rather than *achievement*. The Maya lowlands lost the capacity for monumental coordination; they did not necessarily lose 'civilization' in a humanistic sense. Thus, 'collapse' is value-laden only insofar as it privileges structural continuity over structural simplification. It is not morally prejudiced provided we do not conflate structural simplification with human suffering.

  In conclusion, societal collapse is best understood as a rapid reduction in socio-political complexity and information processing capacity. This distinguishes it from regime change (Rome) and mere cultural shift. It identifies the collapsed entity as the organizing structure rather than the population. Finally, while the term carries a negative valence regarding order, it need not imply a negative valence regarding welfare. By decoupling complexity from well-being, we can utilize 'collapse' as a precise tool of historical ontology without succumbing to the prejudice that bigness is always good, or that simplification is always tragedy.

  ***

  ### Marking Scheme (30 Marks)

  **Total:** 30 Marks
  **Pass Mark:** 15 Marks

  #### 1. Definition and Case Application (12 Marks)
  *   **A-Grade (10–12 marks):** Proposes a definition based on **loss of complexity/stratification/information capacity**. Correctly sorts cases: (a) and (b) are collapses (loss of capacity); (c) is not (capacity maintained/expanded). The definition is generalizable, not ad hoc.
  *   **B-Grade (7–9 marks):** Sorts cases correctly but the definition is vague (e.g., "major disruption") or relies too heavily on specific markers (e.g., "loss of writing") without explaining the underlying principle.
  *   **C-Grade (4–6 marks):** Fails to sort correctly. Common errors: Defines collapse as **regime change** (incorrectly includes c); defines collapse as **population decline/suffering** (incorrectly excludes b); or defines collapse as **cultural end** (incorrectly excludes a and b).
  *   **Fail (0–3 marks):** No clear definition; cases treated anecdotally.

  #### 2. Ontology: Collapse vs. Change (10 Marks)
  *   **A-Grade (8–10 marks):** Clearly distinguishes 'collapse' (simplification/loss of capacity) from 'change' (transformation). Identifies the **structure/system** as the entity that collapses, not the population. Addresses the prompt's challenge regarding persistence of tradition.
  *   **B-Grade (5–7 marks):** Acknowledges the population persists but struggles to articulate what exactly is lost. May rely on "elites disappeared" without linking it to social ontology. Distinction between change and collapse is present but fuzzy.
  *   **C-Grade (2–4 marks):** Equates society with population (arguing a/b are not collapses) or equates society with the regime (arguing c is a collapse). Fails to address the "work the concept is doing" demand.
  *   **Fail (0–1 marks):** Ignores the ontological question.

  #### 3. Normativity and Value (8 Marks)
  *   **A-Grade (7–8 marks):** Nuanced discussion. Acknowledges complexity has costs (welfare may rise). Argues 'collapse' can be **analytically neutral** regarding welfare while remaining descriptive of order. Separates moral judgment from structural description.
  *   **B-Grade (4–6 marks):** Recognizes the tension but takes a hard line: either "collapse is always bad" (ignoring welfare costs of complexity) or "collapse is a myth because people survived" (ignoring structural loss).
  *   **C-Grade (1–3 marks):** Treats 'collapse' as purely pejorative without analysis, or dismisses the question entirely.
  *   **Fail (0 marks):** No engagement with normativity.

  #### Marker's Notes on Common Pitfalls:
  *   **The "Tainter/Diamond" Trap:** Students who simply summarize *The Collapse of Complex Societies* without applying the logic to the specific ontological constraints of the prompt should be capped at a B (max 24/30) unless they demonstrate independent philosophical synthesis.
  *   **The "Human Cost" Error:** If a student defines collapse by mortality or suffering, they *must* fail the sorting task for case (b). If they force (b) to fit by claiming suffering occurred despite evidence in the prompt, they lose marks on argumentative rigor.
  *   **The "Regime" Error:** If a student argues (c) is a collapse because the Republic ended, they have failed the primary sorting constraint. Cap at 15/30.

  #### Grade Boundaries:
  *   **First (25–30):** Flawless sorting, sophisticated ontological distinction, nuanced handling of normativity.
  *   **2:1 (18–24):** Correct sorting, clear but less nuanced philosophical argument.
  *   **2:2 (15–17):** Correct sorting but weak philosophical justification, OR incorrect sorting with strong philosophical reasoning elsewhere.
  *   **Third (10–14):** Significant errors in sorting or failure to address core prompts.
  *   **Fail (0–9):** Incoherent or missing substantial sections.
