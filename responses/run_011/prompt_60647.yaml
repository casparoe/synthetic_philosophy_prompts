answer: |-
  ### Brainstorming and Candidate Rejections

  Before translating the historiographical claims into psychometric formalism, I evaluated several mapping strategies.

  *   **Rejected Candidate: Moral Truth as a Gold Standard Criterion.**
      *   *Idea:* Treat "actual morality" as an observed criterion variable against which historical scores are validated.
      *   *Rejection:* This violates the premise of latent variable modeling. In IRT/CFA, the construct is *defined* by the model, not by an external criterion. Claim 2 posits a moral reality independent of measurement, which psychometrics treats as a philosophical presupposition, not a model parameter. Mapping this would require importing a realist ontology that measurement theory itself remains agnostic about.
  *   **Rejected Candidate: Presentism as Measurement Error.**
      *   *Idea:* Treat anachronistic judgment as random error variance.
      *   *Rejection:* Presentism is systematic bias, not random noise. It corresponds to Differential Item Functioning (DIF) or non-invariant intercepts. Treating it as error implies it can be averaged out; the historiographical claim is that it distorts the *structure* of the construct.
  *   **Rejected Candidate: The Dissenter as an Outlier.**
      *   *Idea:* Treat the 1780s abolitionist as a case with a large residual.
      *   *Rejection:* This misses the historiographical point. The dissenter is not an anomaly to be trimmed; they are the *evidence* for invariance. They function as the anchor group that allows linking. Treating them as outliers validates the "ignorance defense" the historian wishes to defeat.
  *   **Selected Strategy:** Map the dispute onto the hierarchy of measurement invariance (configural, metric, scalar) and the problem of linking functions in IRT. This preserves the structural nature of the disagreement without falsely reifying moral truth as an observed variable.

  ***

  ### Translations of Historiographical Claims

  Here are the five claims restated within the vocabulary of longitudinal measurement invariance and construct validity.

  **1. The Internal Standards Claim**
  *Historiography:* Past agents should be understood and assessed only against the standards that were available within their own form of life; importing ours distorts the very object the historian is trying to recover.
  *Psychometrics:* This is a claim for **Group-Specific Configural and Metric Invariance**. It asserts that the factor loading matrix ($\Lambda$) and potentially the factor structure itself differ across cohorts ($t_1$ vs. $t_2$). To impose the $t_2$ loading structure on $t_1$ data is to force a mis-specified model, resulting in biased factor score estimates ($\hat{\theta}$). The "distortion" is the bias introduced by constraining $\Lambda_{t1} = \Lambda_{t2}$ when the true population parameters differ. One must estimate separate measurement models for each cohort to recover the latent variable as it existed within that group's covariance structure.

  **2. The Universal Morality Claim**
  *Historiography:* Moral standards are not indexed to epochs: what was done to the enslaved was wrong whether or not the surrounding society took it to be so, and a historian who withholds judgement on the ground of local acceptability has not avoided adopting a normative position but has adopted the period's own.
  *Psychometrics:* This asserts **Full Scalar Invariance** of the moral construct across time, with the intercept ($\tau$) fixed to a universal zero-point. It claims that the item "slavery is wrong" has the same threshold parameter ($b$) in 1780 as in 2020. Withholding judgment is equivalent to allowing the intercept to vary freely by group (partial invariance), which effectively centers the scale on the local group mean. The claim argues that fixing the intercept to the local mean is not a neutral statistical decision but a substantive constraint that adopts the local group's location parameter as the truth.

  **3. The Butterfield/Anachronism Claim**
  *Historiography:* Butterfield-style anti-anachronism is a claim about explanatory selection — reading the past as a march towards the present — and is therefore a different charge from the moral one, although the two are habitually run together.
  *Psychometrics:* This is a claim about **Item Selection and Construct Validity**, specifically regarding predictive versus content validity. It warns against selecting items for the $t_1$ battery based on their correlation with $t_2$ outcomes (teleological selection bias). If items are chosen because they predict the "present," the $t_1$ construct is defined by its future consequence rather than its contemporaneous nomological network. This is distinct from Claim 2 (scalar invariance of judgment); this is about the definition of the latent variable itself via the item bank composition.

  **4. The Ignorance and Dissenter Claim**
  *Historiography:* The non-culpable ignorance defence: an agent who could not reasonably have known better is not thereby blameworthy; and the rejoinder that this defence is disproportionately available to those who benefited from the practice in question, and that the existence of contemporaneous dissenters shows the relevant standard was available at the time.
  *Psychometrics:* The "ignorance defense" argues for **Differential Item Functioning (DIF)** based on information access: the item parameter ($b$) for "moral wrongness" was shifted for the general population due to lack of information. The "dissenter rejoinder" identifies a **Sub-Group Invariance** anchor. It posits that within the $t_1$ cohort, a subset (dissenters) exhibits item parameters invariant with $t_2$. If invariance holds for the dissenters, the construct *was* identifiable at $t_1$. The "benefit" argument suggests the DIF is correlated with an omitted variable (social status), indicating the measurement bias is systematic rather than random.

  **5. The Reflexivity Claim**
  *Historiography:* The historian's own standards are themselves historically situated, so there is no neutral vantage point from which to settle which standards apply.
  *Psychometrics:* This challenges the **Identification Assumption** required for linking. In IRT linking (e.g., Stocking-Lord), one must fix certain item parameters to anchor the scale. This claim asserts that *any* choice of anchor items imports the bias of the anchor group (the present). There is no "invariant item" that stands outside history. Consequently, the linking function is arbitrary, and the resulting scale comparison reflects the reference group's parameters, not a neutral metric. It extends Messick's **Consequential Validity** to argue that the act of defining the construct creates the reality it measures, with no external criterion for validation.

  ***

  ### Residue Report

  This report evaluates the fidelity of the translations above. I have flagged imported psychometric commitments where the translation requires assumptions not present in the original historiographical claim.

  | Claim | Translation Status | Specification of Distortion or Import |
  | :--- | :--- | :--- |
  | **1. Internal Standards** | **Clean** | Maps directly to Metric/Configural Non-Invariance. No significant import. |
  | **2. Universal Morality** | **Distorted** | **Import:** Reifies "Wrongness" as a unidimensional latent trait ($\theta$). Historiography often treats moral truth as propositional or ontological, not a continuous psychological attribute. Psychometrics can model the *measurement* of the judgment, but cannot model the *truth value* of the judgment without importing a realist metaphysics. |
  | **3. Anachronism** | **Clean** | Maps to Item Selection Bias/Construct Underrepresentation. Accurately captures the distinction between teleological selection and metric bias. |
  | **4. Ignorance/Dissent** | **Distorted** | **Loss:** The "availability" of a standard is treated as a parameter stability issue (DIF). Historiography treats the dissenter as performing *conceptual labor* that changes the meaning of the epoch, not just providing a stable anchor. Psychometrics sees a stable subgroup; History sees a counter-tradition that invalidates the majority's claim to ignorance. |
  | **5. Reflexivity** | **No Expression** | **Gap:** Measurement theory assumes linking is *possible* (even if difficult). Claim 5 suggests linking is *impossible* because the reference frame is endogenous. This is a challenge to the possibility of measurement itself, which the framework cannot represent without ceasing to be measurement theory. |

  **Explicitly Imported Commitments:**
  1.  **Unidimensionality:** To translate Claims 2 and 4, I have assumed moral judgment can be modeled as a single $\theta$. If moral reasoning is multidimensional or qualitative, the IRT mapping fails.
  2.  **Construct Stability:** The framework assumes the construct *has* parameters to be invariant or non-invariant. Claim 5 suggests the construct itself is fluid, which violates the CFA assumption that the latent variable is a stable entity across groups.
  3.  **Technical Defect vs. Ontological Fact:** In psychometrics, non-invariance is a model misfit to be corrected (via partial invariance or alignment). In history, non-invariance (conceptual drift) is often the *finding*, not the error. The translation risks framing historical change as measurement noise.

  ***

  ### Probes

  **Probe 1: The Anchor Choice and the Evaporation of Dispute**
  You argue that the dispute evaporates if we admit the present cohort is simply the conventional reference group. This is **incorrect**, and you are relying on an unstated identification assumption.

  In MGCFA, declaring a reference group is a statistical necessity for identification, but it is not merely a convention if scalar invariance does not hold. If scalar invariance fails (intercepts differ), comparing latent means ($\alpha$) across groups is mathematically invalid, not just conventionally biased. The difference in means becomes a function of the non-invariant intercepts.
  Your reading group claim holds only if you assume **Partial Scalar Invariance** can be established on a sufficient set of anchor items. If the historiographical dispute is about whether *any* items are invariant (Claim 5), then choosing the present as the reference group does not solve the problem; it merely enforces the present's parameters onto the past. The quarrel does not evaporate; it shifts from "which group is the reference?" to "is the linking function valid?" Admitting conventionality acknowledges the bias but does not validate the comparison. You are conflating *arbitrary scaling* (which is conventional) with *construct equivalence* (which is empirical).

  **Probe 2: The Dissenter Case**
  You ask if the dissenter's "conceptual work" has a place in the invariance framework. There is a **genuine expressive gap** here.

  In your framework, the 1780s abolitionist is simply a person with a high $\theta$ score on the 2020 scale. The invariance framework treats them as evidence that the *item parameters* ($a, b$) are stable for that subgroup. However, the historian uses the dissenter to make a claim about the *epistemic environment* of the majority. The dissenter proves the standard was *accessible*, not just that someone happened to score high.
  Psychometrics models *possession* of the trait, not *availability* of the construct in the cultural milieu. To capture the historian's point, you would need a **Multilevel IRT Model** where the item parameters ($b$) are predicted by a group-level variable (e.g., "cultural access to abolitionist discourse"). Even then, the framework treats the dissenter as a data point confirming parameter stability, whereas the historian treats the dissenter as a validity argument that changes the ontological status of the majority's ignorance. The framework can detect the dissenter; it cannot capture their *significance* as a counter-tradition without importing a theory of cultural transmission that sits outside measurement theory.

  **Probe 3: Reflexivity and Instrument Endogeneity**
  You ask if Claim 5 is captured by the fact that the reference cohort defines the items. It reaches **beyond** what measurement theory can represent.

  Measurement theory assumes that once the instrument is fixed, it can be applied neutrally. It treats the item creation phase as separate from the measurement phase. Claim 5 argues that the *application* of the instrument is constitutive of the reality it measures. This aligns with Messick's **Consequential Validity** (the social impact of testing), but Messick treats this as a validation *consideration*, not a limit on *possibility*.
  The historian's worry is that the "construct" (e.g., Justice) does not exist prior to the measurement act. Psychometrics assumes the latent variable exists and we are trying to measure it with error. If the historian is right that the construct is endogenous to the historical moment, then Longitudinal CFA is modeling a fiction. The framework can represent that the *reference cohort writes the items*, but it cannot represent that *writing the items creates the construct*. That requires a move from psychometrics to social ontology.

  ***

  ### Final Verdict

  I reject the option that the residue shows your framework to be merely expressively impoverished, and I reject the option that the historiographers' disagreement is less substantive than it sounds. I also reject your reading-group claim that the dispute is a category error solvable by admitting convention.

  I propose a **fourth possibility**: **The translation succeeds for the epistemic claims but fails for the normative claims, making the reading-group claim a category error.**

  Here is the defense:
  Your framework is designed to answer: *"Can we compare scores across groups without bias?"*
  The historiographical dispute is often asking: *"Ought we to compare these groups using this metric?"*

  Claims 1, 3, and 4 are largely epistemic (about knowledge, selection, and availability). These translate well into invariance testing, DIF, and linking. Claims 2 and 5 are normative and ontological (about the nature of truth and the position of the knower).
  When you argue that admitting the anchor choice is conventional makes the quarrel evaporate, you are treating a normative objection as an epistemic technicality. The historian objecting to presentism (Claim 2) is not complaining that the linking function is statistically difficult; they are complaining that the *authority* to define the scale is illegitimate.

  Psychometrics can show that using 2020 as the reference group introduces bias (non-invariance). It cannot show that using 2020 as the reference group is *unjust*. The residue you see in Claims 2 and 5 is not a failure of your vocabulary; it is the boundary of your discipline. Measurement theory can quantify the distortion of presentism; it cannot adjudicate the morality of it. Therefore, your reading-group claim fails because it attempts to solve a legitimacy problem (who decides?) with an identification solution (how do we calculate?). The dispute does not evaporate; it simply moves from the model specification to the validity argument, where Messick's consequential facet resides, but where technical invariance testing ends.
