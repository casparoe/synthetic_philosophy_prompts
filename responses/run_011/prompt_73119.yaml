      *   *Premise 2:* Advanced Civs + Curiosity = Massive Ancestor Simulations.
      *   *Premise 3:* Simulated People >> Real People (if simulations happen).
      *   *Conclusion:* You are likely simulated (Principle of Indifference).
      *   *Trilemma:* (1) Extinction before maturity, (2) Loss of interest/ethics, (3) We are simulated.
      *   *Elaboration 1 (Optimization):* Lazy rendering (quantization supports this).
      *   *Elaboration 2 (Falsifiability):* Immune to evidence (internal state).
      *   *Elaboration 3 (Consciousness):* External source of regularities = Religious/Explanatory power for qualia.

  3.  **Audit Step-by-Step (Drafting the Content):**

      *   *Step 1: Substrate Independence.*
          *   Status: Common Simplification / Contested.
          *   Analysis: Functionalism is standard in philosophy of mind, but not proven. "Genuinely conscious" is the leap.
          *   Engineer view: API vs. Implementation. Does the API guarantee the internal state of "feeling"?

      *   *Step 2: Advanced Civs run Ancestor Sims.*
          *   Status: Simplification.
          *   Analysis: Assumes *capability* implies *will*. Assumes computing power scales linearly with desire to simulate.
          *   Engineer view: Just because you *can* spin up 1M instances doesn't mean you *do*. Cost/benefit analysis missing.

      *   *Step 3: Simulated People >> Real People.*
          *   Status: Accept (Conditional).
          *   Analysis: Mathematically true *if* Step 2 holds. This is the counting argument.
