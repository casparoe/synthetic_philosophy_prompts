          *   Address specific philosophical/legal questions:
              *   Does it smuggle in obligation to a *thing* vs. *persons*?
              *   Does the absence of a registry (quantum, date, counterparty) matter for the promise vs. gesture?
              *   Is the identity claim (City Then = City Now) doing independent work or just restating the benefit claim?
          *   Evaluate the two conclusions separately: (1) Apology is owed, (2) Apology must carry funded material component.
          *   If it fails, propose a better analogy for a public document that addresses the "I wasn't there" objection without the baggage of the property analogy.

  2.  **Deconstruct the Property Law Analogy:**
      *   *The Proponent's Argument:* The City is a continuous legal entity (Landlord/Owner). It inherited liabilities (liens/easements) along with assets (tax base/infrastructure/rent roll). Current residents/council are just current occupants/management. They can't take the benefits (rents) without the burdens (liens).
      *   *The Counter-Argument (Youngest Member):* Bona Fide Purchaser (BFP). Current residents bought in at market price, didn't know about the "unrecorded interest," and shouldn't be liable for hidden defects.

  3.  **Map the Correspondence (The Audit):**
      *   *City Corporation:* The Landlord/Title Holder.
      *   *City Charter/Jurisdiction:* The Title/Deed.
      *   *The Neighborhood/Infrastructure:* The Building/Land.
      *   *The Historical Injustice (Razing):* The Act creating the Encumbrance (Lien/Easement).
      *   *The Moral/Political Debt:* The Lien itself.
      *   *Tax Revenue/Economic Value:* The Rent Roll.
      *   *Current Residents/Taxpayers:* Tenants/Sub-lessees (or potentially the BFPs).
      *   *City Council/Administration:* Property Management.
      *   *Public Record/History:* The Registry (though flawed).

  4.  **Analyze Mismatches (Critical vs. Harmless):**
      *   *Harmless:* Specific legal mechanics of liens vs. moral debt. The idea of "management" turnover.
      *   *Critical:*
          *   *Personhood:* Tenants have leases; citizens have rights. A lien attaches to land; moral guilt/obligation attaches to communities/people.
          *   *The Registry:* Property law relies on *notice*. The "lien" of historical injustice wasn't recorded. The BFP defense is strong here.
          *   *The Beneficiaries:* In property, the rent goes to the owner. In the city, "rent" (taxes/services) is shared. Who actually got the "rent" from the destruction? (Often white suburbs, not current city residents).
          *   *The Victim:* A tenant is a current contractual partner. The victims (1960s residents) are gone or dispersed. Their "standing" isn't like a tenant's assignee.

  5.  **Address Specific Questions:**
      *   *Thing vs. Persons:* Yes, it smuggles this in. It treats justice as a balance sheet attached to a jurisdiction rather than a relationship between people. This makes it hard to address descendants who aren't "tenants" of that specific land anymore.
      *   *Absence of Registry:* Crucial. Without a recorded lien, the BFP defense holds. An apology *promises* restitution, but without a registry, how do you quantify the "payment"? It turns the obligation into a gesture because the "debt" isn't legally enforceable like a lien.
      *   *Identity Claim:* It's doing heavy lifting but it's circular. "City is the same" is only relevant if "City" is the debtor. If the debt is based on *benefits received*, then identity matters less than accounting. If the debt is based on *continuity of sovereignty*, identity matters more. The analogy conflates them.

  6.  **Evaluate the Two Conclusions:**
      *   *Conclusion 1 (Apology Owed):* The analogy supports this *weakly*. It explains why the *institution* speaks, but not necessarily why it *must*. It makes it about liability management rather than moral reckoning.
      *   *Conclusion 2 (Funded Component):* The analogy supports this *strongly* (liens must be paid to clear title), *but* it relies on the contested premise that the "lien" is financial and quantifiable like a mechanics' lien. It risks reducing justice to a transaction.

  7.  **Develop a Better Analogy:**
      *   *Goal:* Address "I wasn't there" without making it a cold property transaction. Needs to capture *inheritance*, *complicity*, and *continuity* without the BFP loophole.
      *   *Idea 1: Family Inheritance.* (Too personal? Implies bloodline).
