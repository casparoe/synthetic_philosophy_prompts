      *   *Idea 4: The "Estate" or "Trust" Analogy.* You inherit an estate. You get the assets (house, money) but also the obligations (debts, promises made by the deceased). You can't cherry-pick.
      *   *Refinement:* The **"Successor Trustee"** analogy. The City is a trust. The Council are trustees. The beneficiaries are all residents, but specifically those harmed. The "I wasn't there" objection is like a new trustee saying "I didn't sign the trust document." It doesn't matter; the *Trust* persists.
