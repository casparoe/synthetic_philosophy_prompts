  It should be built around this case, which I made up so it isn't just the textbook one: patient D, bilateral posterior insula damage. D localizes pinpricks and intensity-ranks them as well as controls, says the sensation is "just as sharp as it used to be," laughs when pricked, and declines analgesia when its offered on the grounds that there's no point. But in a prospective forced-choice task — choose which of two sites receives the next matched-intensity stimulus — D reliably steers away from the sensitive site, and afterwards insists the choice was obvious. D also shows normal skin conductance and startle to the stimulus.

  So: write the exam question, then the model answer, then a marking scheme out of 25. The model answer has to work through what each of the three live accounts of unpleasantness does with D — unpleasantness as evaluative/representational content, unpleasantness as imperative or command-like content, and unpleasantness as a motivational disposition — and it has to commit to which one D puts under most pressure and why, plus whether D shows that unpleasantness isn't a single property after all. In the marking scheme, name the specific moves that separate an A from a B (for instance: a B answer will assume the forced-choice data and the verbal report must be explained by one and the same mechanism, or will treat the autonomic measures as decisive when they aren't obviously about unpleasantness at all), and flag the one or two mistakes that should cost serious marks.

  Also tell me how confident you are in that ranking of the three accounts and which part of it you're least sure about. Finish with a line of the form \answer{...} naming the account D is hardest on.
