answer: |-
  There is no single, canonical term in moral philosophy or narratology that captures this phenomenon exactly as you describe it. However, your observation is precise, and it maps onto several distinct theoretical frameworks that, when combined, explain the mechanism.

  The closest established concepts are **Communal vs. Exchange Norms** (social psychology), **The Logic of the Gift** (anthropology/philosophy), and **Market Norms vs. Social Norms** (behavioral economics). None of these names the specific narrative deflation you are tracking, but they provide the architecture for it.

  Because no existing label fits tightly enough for your purpose, I will propose a term: **The Settlement Effect**.

  Below is the carving you requested: what the phenomenon is, its nearest relatives, the conditions that switch it on and off, and its societal implications.

  ### 1. The Established Neighbours

  To understand why there is no single name, we must see why the existing names fail to cover your specific case.

  *   **The Paradox of Hedonism:** As you noted, this concerns the *attainability* of a goal (happiness) which vanishes if pursued directly. Your character *attains* the goal. The problem is not the attainment, but the *moral texture* of the attainment.
  *   **The Overjustification Effect (Psychology):** This occurs when an external incentive (money/prize) decreases a person's *intrinsic* motivation to perform a task. This is about the *actor's* psychology. Your phenomenon is about the *observer's* judgment of the actor's desert.
  *   **The Paradox of Meritocracy:** As you noted, this refers to systemic bias. Your scenario assumes the judgment is correct and the merit is real.
  *   **Aristotle's *Megalopsychos* (Great-Souled Man):** Aristotle argues the great-souled man is worthy of great honors and *knows* he is worthy. However, Aristotle distinguishes between *claiming* what is due and *bargaining* for it. The *Megalopsychos* accepts honor as a fitting tribute to his virtue; he does not treat it as a wage for services rendered. Your character treats it as a wage.

  **The Closest Fit: Communal vs. Exchange Norms**
  Social psychologists Margaret Clark and Judson Mills distinguish between two relationship modes:
  *   **Communal Norms:** Benefits are given based on need or affection, without expectation of specific repayment (e.g., parent/child, close friends).
  *   **Exchange Norms:** Benefits are given with the expectation of a comparable return (e.g., employer/employee, strangers).

  Your phenomenon occurs when a interaction framed as **Communal** (honour, gratitude, artistic recognition) is covertly converted by the recipient into **Exchange**. The reader senses the conversion. The reward becomes a "settlement" of a debt rather than a "gift" of recognition.

  ### 2. The Coinage: The Settlement Effect

  **Definition:** The Settlement Effect is the diminution of perceived moral desert that occurs when a recipient's instrumental pursuit of a reward re-categorizes that reward, in the eyes of the conferrer or observer, from a **Gift** (recognition) to a **Settlement** (payment).

  **Mechanism:**
  1.  **The Frame:** The reward is socially coded as an honour (discretionary, symbolic, gift-like).
  2.  **The Orientation:** The recipient adopts a transactional orientation (positioning, calculating, anticipating).
  3.  **The Conversion:** Upon receipt, the reward is no longer seen as a gracious acknowledgement of worth, but as the discharge of a contractual obligation incurred by the recipient's striving.
  4.  **The Result:** Gratitude is impossible toward a settlement. One does not thank a debtor for paying a bill. Therefore, the recipient appears less deserving, even if the merit is objective.

  **Distinction from Confusion:**
  *   **Not Hypocrisy:** The character need not be hypocritical. He may do excellent work. The defect is not in the *work*, but in the *relationship to the reward*.
  *   **Not Ingratitude:** The character may be outwardly grateful. The deflation happens in the *observer*, who senses the internal ledger has already been balanced by the striving itself.

  ### 3. Testing the Edges

  You asked for the conditions that switch this effect on and off.

  **A. Why does this not happen to a wage?**
  *   **Condition:** The Frame.
  *   **Explanation:** A wage is explicitly defined by Exchange Norms. It is a contract. Pursuing a wage openly confirms the contract. There is no "Gift" frame to corrupt. The Settlement Effect only triggers when there is a mismatch between the *social framing of the reward* (Gift/Honour) and the *recipient's orientation* (Contract/Wage).
  *   **Test:** If you pay a mother a wage for childcare, the Settlement Effect vanishes, but the relationship changes to employment. If you give a CEO a "Lifetime Achievement Award" and he treats it as a bonus clause, the Settlement Effect triggers.

  **B. Does the effect run out at the far end (total indifference)?**
  *   **Condition:** Agency.
  *   **Explanation:** Yes. If a character is utterly indifferent to the reward, the reward appears as **Luck** or **Fate**, not Merit. Desert requires agency. To deserve praise, one must care about the good one has done.
  *   **The Goldilocks Zone:** The character must value the *activity* or the *virtue* primarily, and the *reward* secondarily.
      *   *Too much desire for reward:* Settlement Effect (Transaction).
      *   *Too little desire for reward:* Luck Effect (Accident).
      *   *Correct balance:* Recognition (The reward validates the virtue).

  **C. Does it depend on the conferring agent?**
  *   **Condition:** Discretion.
  *   **Explanation:** The effect requires a **human conferrer** capable of withholding the reward.
      *   *Algorithm/Rule:* If a rule dictates "100 points = Gold Medal," the medal is a wage. No Settlement Effect.
      *   *Committee/Judge:* If a judge *could* have said no but didn't, the award is a Gift. If the recipient acted as if they *couldn't* say no, the Settlement Effect triggers.
      *   **Key:** The deflation is proportional to the **discretion** of the giver. The more the giver had the power to withhold, the more the recipient's claiming of the reward feels like a demand.

  **D. Concealment vs. Announcement?**
  *   **Condition:** Epistemic Access.
  *   **Explanation:** In fiction, the reader usually has access to the character's interiority. If the character *internally* tracks the merit as debt, the Settlement Effect applies even if he is publicly humble.
      *   *Public Announcing:* Accelerates the effect (adds arrogance).
      *   *Private Calculation:* Sustains the effect (adds inauthenticity).
      *   **Crucial Point:** It is not the *announcement* that kills the desert; it is the *instrumentalization*. A character can silently treat his mother's love as a debt to be collected, and the reader will feel the deflation.

  ### 4. Societal Consequence

  You asked about a society that makes all honours competed for in the open.

  If a society institutionalizes the **Settlement Effect** by turning all recognition into explicit competition (tournaments, rankings, public metrics of virtue), it systematically converts **Honours into Wages**.

  1.  **Erosion of Gratitude:** Gratitude is the emotional glue of a community based on Gift Norms. If all rewards are seen as settlements for performance, gratitude is replaced by entitlement. Winners feel paid, not honoured. Losers feel underpaid, not unrecognised.
  2.  **The Hollow Winner:** As you noted, the winner cannot experience the reward as deserving. They experience it as a contract fulfilled. This leads to the "arriviste emptiness" often seen in high-achievement narratives.
  3.  **Meritocracy as Market:** Such a society does not have a meritocracy in the aristocratic sense (rule of the best); it has a **Merit-Market**. In a market, value is price. In a meritocracy, value is worth. The Settlement Effect collapses worth into price.

  ### 5. Summary for the Colleague

  If you need to explain this to an editor or colleague, use this definition:

  > "I am avoiding **The Settlement Effect**. This happens when a character treats an honour like a wage. Even if they earn it fairly, their instrumental striving converts the reward from a **Gift** (which creates a bond) into a **Settlement** (which closes a ledger). The reader stops feeling the character is *deserving* and starts feeling they are *paid*. It's not that they didn't do the work; it's that they invoiced for it."

  **The Nearest Confusion:**
  Warn them not to confuse this with **The Overjustification Effect**. Overjustification is about the *worker* losing motivation. The Settlement Effect is about the *observer* losing respect.

  **The Fix in Drafts:**
  To cure this in your fiction, the character's orientation must shift from **Claiming** to **Accepting**. The work must be done for the sake of the work (or the other person), and the reward must arrive as a surprise to the character's internal ledger, even if it was expected externally. The character must not have *balanced the books* in their head before the award arrives.
