answer: |-
  **JOINT STATEMENT ON THE INFERENCE OF RESPONSIBILITY IN THE JULY CRISIS**

  **Preamble:** We, the undersigned representatives of the Fischerian (Camp A) and Distributionist (Camp B) traditions, acknowledge that the historical record of 1914 is incomplete, noisy, and subject to interpretation. We agree that assigning responsibility is not a measurement of a static property but an inference based on counterfactual modeling of agent choices within systemic constraints. The following claims represent the boundary conditions upon which our divergent models operate.

  **I. Agreed Claims Regarding Inference and Evidence**

  1.  **On the Stability of Disposition (Inference Problem 1):** We agree that inferring prior intent from posterior documents requires an assumption of *Dispositional Continuity*. This assumption holds that the strategic aims of a state apparatus remain stationary across the transition from peace to war, absent evidence of a fundamental regime change or external shock that forces a revision of objectives.
      *   *Agreement:* Camp A relies on this assumption to link the September Program to July decisions. Camp B rejects the assumption's validity in this specific case, arguing that the onset of war constitutes a phase transition that alters the objective function of the state. Both agree that without establishing the validity of this assumption, the September Program cannot serve as direct evidence of July *intent*, though it remains evidence of July *capacity* for expansion.

  2.  **On Counterfactual Sensitivity (Inference Problem 2):** We agree that responsibility ascription requires counterfactual sensitivity. To say a power was responsible is to claim that had that power chosen differently, the probability of the observed outcome (general continental war) would have been significantly reduced.
      *   *Agreement:* Both camps accept that if the system was over-determined (i.e., if the probability of war approached 1.0 regardless of specific diplomatic choices), then moral responsibility dissolves into structural causality. We agree to evaluate the " Blank Check" (July 5–6) as the primary control variable for testing this sensitivity.

  3.  **On Intent versus Foresight (Inference Problem 3):** We agree that a distinction exists between *purpose* (war as a desired end) and *dolus eventualis* (war as a foreseen and accepted side-effect of a different end).
      *   *Agreement:* Both camps agree that if Berlin pursued a policy where continental war was the *necessary* means to an end, Camp A's ascription holds. If Berlin pursued a policy where continental war was a *risk* accepted to achieve a limited end (localization), Camp B's ascription gains traction. However, both agree that accepting a high-probability risk of catastrophe licenses a strong ascription of responsibility, even if catastrophe was not the primary aim.

  4.  **On the Meaning of National Responsibility:** We agree that holding a state "responsible" does not imply a monolithic national guilt, but rather identifies the specific decision-making nodes within that state whose choices had the highest causal leverage over the outcome.
      *   *Agreement:* Responsibility is not a zero-sum quantity to be distributed like mass; it is a measure of causal leverage. Multiple actors can bear high responsibility if the system was coupled such that multiple distinct vetoes could have prevented the outcome.

  5.  **On the Evidential Standing of the Key Documents:**
      *   *The Blank Check (July 1914):* Both camps agree this is the critical signal in the noise. It represents an unconditional commitment that removed the constraint on Austrian aggression.
      *   *The September Program (September 1914):* Both camps agree this document proves that German leadership had concrete plans for hegemony *during* the war. The disagreement is strictly whether these plans were the *cause* of the war or the *opportunistic elaboration* of a war that arrived unexpectedly.

  ***

  **II. Table of Residual Disagreements**

  | Crux | Camp A Formulation (Fischerian) | Camp B Formulation (Distributionist) | Agreed Evidence / Argument Bearing on Crux | Camp A Prediction | Camp B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Stability Assumption** | The September Program is the latent variable of July policy made manifest; strategic aims were stationary. | The September Program is a response to the unique conditions of August 1914; strategic aims were dynamic and context-dependent. | Comparative analysis of pre-1914 colonial aims, War Council minutes (1912), and Bethmann Hollweg's private correspondence pre- and post-mobilization. | Pre-war documents will show continuity with September aims, validating the stability assumption. | Pre-war documents will show defensive/status-quo aims, proving September aims were a wartime innovation. |
  | **2. Counterfactual Dependency** | Had Germany withheld the Blank Check, Austria would not have attacked Serbia, and the cascade would have halted. | Had Germany withheld the Blank Check, Russia's mobilization posture and French alliance commitments would have triggered war via another mechanism. | Diplomatic cables regarding Russian mobilization thresholds and French assurances to St. Petersburg in late July. | Russian mobilization was conditional on Austrian aggression against Serbia. | Russian mobilization was conditional on general Austrian assertiveness, independent of the specific Serbian ultimatum. |
  | **3. Intent vs. Risk Acceptance** | Berlin chose a course where war was the expected instrument to break encirclement; localization was a pretext. | Berlin chose a course where war was a feared possibility, but diplomacy was the expected instrument; localization was the genuine hope. | Records of the July 5–6 council meetings, specifically the weighting given to the risk of Russian intervention. | Minutes will show Russian intervention was discussed as a likely scenario to be managed, not avoided. | Minutes will show Russian intervention was discussed as a disaster to be avoided, with confidence it could be averted. |
  | **4. Systemic Over-determination** | The alliance system was flexible enough that a single veto (Berlin on Vienna) would have preserved peace. | The alliance system was rigid; mobilization timetables created a mechanical inevitability once the crisis began. | Comparative analysis of mobilization schedules (Schlieffen vs. Plan XVII vs. Russian Grand Program) and railway capacity. | Diplomatic delays could have outpaced mobilization timetables if political will existed. | Mobilization timetables dictated the diplomatic timeline, not vice versa, once the first order was given. |

  ***

  **III. Adjudication of Disputes**

  **On Merely Verbal Disputes:**
  We judge the dispute over the definition of "Intent" (Crux 3) to be largely verbal if it rests solely on the distinction between *wanting* war and *accepting* war. In both physics and ethics, if an agent activates a mechanism knowing it has a 90% probability of firing a lethal projectile, the distinction between "I wanted it to fire" and "I didn't care if it fired" is negligible regarding responsibility. If both camps agree Berlin accepted a high probability of continental war, the moral weight of the ascription converges, even if the psychological description differs.

  **The Single Movable Crux:**
  The single crux that, if settled, would move one side is **Counterfactual Dependency (Crux 2)**.

  *   **Why:** Camp A's model requires that Germany possessed a "veto power" that was not exercised. Camp B's model requires that Germany's veto would have been ineffective against the structural pressures of the alliance system.
  *   **The Condition for Movement:** If definitive evidence were found demonstrating that Russia had already decided on general mobilization prior to the Austrian ultimatum to Serbia (independent of German backing), Camp A would be forced to concede that the German gamble was not the primary cause, but merely a contributing variable in an over-determined system. Conversely, if evidence proved Russia was prepared to accept a localized war had Austria not been emboldened by German unconditional support, Camp B would be forced to concede that the German decision was the necessary condition for the cascade.

  Until the counterfactual sensitivity of the Russian mobilization decision is resolved, the argument remains a conflict between a model of *agent causality* (Camp A) and a model of *systemic causality* (Camp B).
