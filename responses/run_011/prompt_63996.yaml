      *   *Claim 2 (Stability Assumption):* Address the physicist's first question. Camp A needs "Continuity of Strategic Disposition." Camp B needs to admit it's *possible* but not *proven*. The joint statement should define the assumption without validating it fully.
      *   *Claim 3 (Counterfactuals):* Acknowledge that historical causality requires counterfactual reasoning.
      *   *Claim 4 (Intent vs. Risk):* Acknowledge the distinction between *purpose* and *foreseen consequence*.
      *   *Claim 5 (Responsibility):* Define it as capacity to have chosen otherwise + causal impact.

  4.  **Drafting the Table of Residual Disagreements (Section 2):**
      *   *Row 1: The September Program.*
          *   Crux: Does it reflect July intent?
          *   A: It reveals the telos of the gamble.
          *   B: It reflects the euphoria of August victory expectations.
          *   Evidence: Internal memos, timing, Bethmann Hollweg's shifts.
          *   Predictions: A says consistency found; B says discontinuity found.
      *   *Row 2: The Blank Check.*
          *   Crux: Was it a push for war or deterrence?
          *   A: Calculated risk of war.
          *   B: Calculated risk of diplomacy (localization).
          *   Evidence: Minutes of July 5-6 meetings.
      *   *Row 3: Systemic Constraints.*
          *   Crux: Could anyone have stopped it?
          *   A: Germany could have restrained Austria.
          *   B: Russia/France mobilization made war inevitable regardless.
          *   Evidence: Mobilization timetables, diplomatic cables.
      *   *Row 4: Mental State.*
          *   Crux: Did Berlin want *this* war?
          *   A: Yes, as a tool for policy.
          *   B: No, they wanted status without war, but accepted war as cost.
          *   Evidence: Diaries, private correspondence.

  5.  **Drafting the Conclusion (Section 3):**
      *   *Verbal Disputes:* Often "Responsibility" vs. "Causality." Or "Intention" vs. "Acceptance of Risk."
      *   *The Mover:* What would change a mind? For Camp B, proof of pre-war planning matching September Program. For Camp A, proof that Russia would have attacked regardless of the Blank Check. The prompt asks for *one* single crux. The most pivotal is usually the *counterfactual of the Blank Check*. If Germany says "No," does war still happen?

  6.  **Refining the Tone:**
      *   The user is a physicist. Use terms like "boundary conditions," "initial states," "signal vs. noise," "inference," "counterfactual sensitivity."
