      *   *Check:* Is the conclusion decisive? *Correction:* Identify the "keystone" counterfactual.

  8.  **Final Polish:**
      *   Make sure the distinction between "intent" and "foresight" is clear (Question 3).
      *   Ensure the "responsibility" definition acknowledges the moral weight without getting bogged down in guilt.
      *   *Physics analogy:* Treat the July Crisis as a system approaching a phase transition. Camp A says Germany pushed it over the edge. Camp B says the system was already at the critical point.

  9.  *(Final thought on the "Single Crux"):* The most productive point of leverage is usually the *localizability* of the conflict. If Germany believed it could be localized, Camp B has a point on intent. If they knew it wouldn't be, Camp A wins on responsibility. But the *counterfactual* (Would Russia have intervened anyway?) is the deeper structural question. I will select the Counterfactual Dependency of the German Choice as the mover.

