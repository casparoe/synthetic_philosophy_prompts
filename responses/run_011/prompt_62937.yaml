  ### Step 1: The First Kill (Mixed Dominance)

  **Condition Check:** At the opening position, no pure strategy strictly dominates another for either player.
  *   **Row:** R1 beats R2 at C1/C3 but loses at C2. R3 beats R2 at C2/C3 but loses at C1. R1 and R3 cross (R1 wins C1, R3 wins C2, tie C3).
  *   **Column:** C1 beats C2 at R1/R3 but loses at R2. C3 beats C2 at R1/R3 but loses at R2. C1 and C3 cross (C1 wins R1/R3, C3 wins R2).
  *   **Result:** A player restricted to pure-strategy comparisons sees no eliminations. The process halts immediately.

  **The Mixture:**
  Row 2 (R2) is strictly dominated by a mixed strategy $\sigma_R = 0.5 \text{R1} + 0.5 \text{R3}$.

  **Column-by-Column Comparison:**
  *   **Against C1:** $\sigma_R$ payoff $= 0.5(10) + 0.5(0) = \mathbf{5}$. R2 payoff $= \mathbf{4}$. ($5 > 4$)
  *   **Against C2:** $\sigma_R$ payoff $= 0.5(0) + 0.5(10) = \mathbf{5}$. R2 payoff $= \mathbf{4}$. ($5 > 4$)
  *   **Against C3:** $\sigma_R$ payoff $= 0.5(10) + 0.5(10) = \mathbf{10}$. R2 payoff $= \mathbf{4}$. ($10 > 4$)

  Since $5 > 4$ and $10 > 4$ strictly, R2 is eliminated.

