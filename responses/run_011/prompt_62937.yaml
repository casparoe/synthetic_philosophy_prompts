  **Order Dependence:** Order-dependence **does not bite** in this specific construction. Because every dominance relation utilized in the reduction path is *strict*, the order of elimination among the dominated strategies (e.g., removing C2 before C3 or vice versa) does not alter the set of surviving strategies. Weak dominance only introduces order-dependence risks when ties ($=$) are involved in the dominance relation, which does not occur in the active solution path of this matrix.

  *(Note: If you restricted weak dominance to pure-vs-pure comparisons only, the process would halt at Round 1, just like strict pure dominance, because no pure strategy weakly dominates another at the opening position.)*

