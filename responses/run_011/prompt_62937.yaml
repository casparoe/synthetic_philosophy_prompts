  ### Algebraic Proof: R2 is Never a Best Response

  To confirm R2 is not rationalizable, we prove it is never a best response to any belief $q = (q_1, q_2, q_3)$ over the Columns, where $q_i \ge 0$ and $\sum q_i = 1$.

  Expected utilities for Row strategies:
  1.  $U(R1, q) = 10q_1 + 0q_2 + 10q_3 = 10(q_1 + q_3) = 10(1 - q_2)$
  2.  $U(R2, q) = 4q_1 + 4q_2 + 4q_3 = 4(1) = 4$
  3.  $U(R3, q) = 0q_1 + 10q_2 + 10q_3 = 10(q_2 + q_3) = 10(1 - q_1)$

  For R2 to be a best response, we would need $U(R2, q) \ge U(R1, q)$ **and** $U(R2, q) \ge U(R3, q)$.
  Substitute the values:
  1.  $4 \ge 10(1 - q_2) \implies 0.4 \ge 1 - q_2 \implies q_2 \ge 0.6$
  2.  $4 \ge 10(1 - q_1) \implies 0.4 \ge 1 - q_1 \implies q_1 \ge 0.6$

  Summing these inequalities: $q_1 + q_2 \ge 1.2$.
  This contradicts the probability constraint $q_1 + q_2 + q_3 = 1$ (which implies $q_1 + q_2 \le 1$).
  Therefore, no such belief exists. R2 is never a best response.

