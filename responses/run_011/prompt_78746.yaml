answer: |-
  This is a sharp reframing. By stripping away the epidemiology, we can treat the Intensive Smallpox Eradication Programme (ISEP) not as a medical victory, but as an investment vehicle with a unique payoff structure.

  Here is the mapping of smallpox through a longtermist lens, analyzing the prospective bet, the retrospective valuation, and the structural error regarding "terminal" versus "custodial" benefits.

  ### 1. The Prospective Bet (1967): What They Thought They Were Buying

  If you ask a longtermist today to value smallpox eradication, they calculate the sum of all lives not lost to variola from 1980 to the end of time. But if you look at the memos, budget requests, and speeches from 1967–1977, that calculation is absent.

  **The Discount Rate of the Actors**
  The funders (primarily the US, USSR, and WHO) were operating with extremely high discount rates.
  *   **The US Pitch:** Cost-benefit analysis dominated. The CDC and USAID argued that eradication was cheaper than perpetual vaccination programs. The "forever" benefit was a rhetorical flourish, not the investment thesis. They were buying *budget relief* for the next decade, not safety for the 22nd century.
  *   **The Soviet Pitch:** Geopolitical prestige and soft power in the Global South. Eradication was a proof-of-concept for socialist science and international cooperation during the Cold War. The timeframe was the duration of the Brezhnev doctrine, not the lifespan of the species.
  *   **The WHO Pitch:** Institutional legitimacy. The WHO needed a win to prove it wasn't just a talk shop.

  **The Availability of Longtermist Justification**
  The "colossal win" logic was *available* in principle but *invisible* in practice.
  *   **Feasibility Uncertainty:** In 1967, eradication was considered biologically dubious. Previous campaigns (yellow fever, malaria) had failed. You cannot rationally invest in an infinite payoff stream if the probability of the program succeeding is viewed as <10%. The prospective view was dominated by the risk of total loss, not the magnitude of the gain.
  *   **The "Forever" Blindspot:** The actors were buying a *status change* (from endemic to non-endemic), not a *risk elimination*. They understood that public health requires maintenance. The idea that they were creating a "permanent asset" that would require zero future input was not the selling point. In fact, Henderson and others explicitly warned that vigilance must continue.

  **Where the Longtermist View Does Retrospective Work**
  The longtermist framework only kicks in *after* certification (1980). Once the state change was verified, the benefit stream became visible as a perpetuity. The longtermist view justifies the cost *now* (looking back), but it could not have driven the decision *then* because the uncertainty horizon was too wide. The decision was made on short-term humanitarian and economic grounds; the longtermist value was a free rider on a short-termist decision.

  ### 2. The Wrinkle: Terminal vs. Custodial Benefits

  This is the crux of your inquiry. Longtermism often hunts for **terminal interventions**: push a button, and the good flows forever without further input (e.g., asteroid deflection, aligning AGI). Smallpox is widely cited as the archetype of this.

  But your distinction exposes a category error. Smallpox eradication is not terminal; it is **custodial**.

  *   **Terminal Benefit:** The benefit persists regardless of future human action (e.g., if we remove a carcinogen from the biosphere permanently).
  *   **Custodial Benefit:** The benefit persists only as long as a specific maintenance regime is funded and upheld (e.g., nuclear non-proliferation, smallpox stock security).

  **The Smallpox Reality**
  The virus is extinct in the wild, but the *risk* is not extinct.
  1.  **Official Stocks:** Variola exists in BSL-4 labs in Atlanta and Novosibirsk. The decision to destroy them has been deferred repeatedly since 1996.
  2.  **Synthetic Biology:** The genome is public. Recreating variola is no longer a state-level capability alone; it is a function of cost and expertise, both of which are trending down.
  3.  **Immunity Gap:** The human herd is now immunologically naive. A release today would be far more catastrophic than in 1967.

  Therefore, the "benefit" of the 1967 campaign is not a locked-in asset. It is a **fragile equilibrium**. We are paying a continuous "rent" on the eradication via surveillance, biosecurity norms, and gene-synthesis screening. If civilization collapses, or if biosecurity norms erode, the benefit evaporates. The "hundreds of thousands of lives averted every year" is contingent on continued institutional competence.

  ### 3. Does Longtermist EV Reasoning Have the Resources to Tell Them Apart?

  Standard Expected Value (EV) reasoning *can* model this, but longtermist *heuristics* often fail to.

  **The EV Model**
  A rigorous EV calculation should look like this:
  $$ EV = \sum_{t=0}^{\infty} \frac{Benefit_t - MaintenanceCost_t}{(1+r)^t} \times P(Survival)_t $$
  Where $P(Survival)$ includes the probability that the custodial regime holds. If the maintenance cost rises or the probability of custodial failure increases (e.g., due to synthetic bio democratization), the PV (Present Value) of the intervention drops.

  **The Longtermist Blind Spot**
  However, longtermist discourse often suffers from **Lock-In Bias**. It prefers narratives where a one-time effort creates a permanent trajectory change.
  *   **Misdescription:** By labeling smallpox "eradicated," longtermism implicitly categorizes it as terminal. It treats the 1980 certification as a "game over" for the virus.
  *   **The Error:** This ignores the *active* nature of the victory. We are not living in the aftermath of a victory; we are living inside a containment vessel.
  *   **Resource Allocation:** If longtermism assumes smallpox is a terminal win, it might undervalue ongoing custodial work (funding WHO surveillance, regulating gene synthesis) because that work looks like "maintenance" rather than "high-leverage intervention." But for custodial benefits, maintenance *is* the high-leverage intervention.

  ### 4. Bottom Line: Confirm, Misdescribe, or New Category?

  Smallpox **falls into a category longtermism never anticipated: The Custodial Lock.**

  It does not **confirm** the view, because the view often implies that once a problem is "solved," it stays solved. Smallpox proves that biological solutions require political maintenance. If the WHO collapses or global cooperation fractures, smallpox returns (naturally or synthetically). The benefit is coupled to the stability of the custodian.

  It is **misdescribed** by the standard longtermist narrative, which treats it as a completed transaction ("We spent $300M, we saved 200M lives"). That accounting ignores the liability we accrued: a global population with zero immunity living in a world where the weapon is easier to build than ever. The "asset" of eradication comes with a hidden "liability" of perpetual vigilance.

  **The Verdict**
  Smallpox is not a terminal benefit; it is a **deferred liability managed by custodial norms.**

  For longtermism, this is a critical stress test. If the framework cannot distinguish between *terminal* fixes (asteroid deflection) and *custodial* fixes (biosecurity, nuclear containment), it will systematically overvalue the latter. It will fund the "eradication campaign" (the one-shot event) and underfund the "surveillance regime" (the perpetual cost).

  Smallpox shows that the most valuable longtermist interventions may not be the ones that allow us to walk away, but the ones that successfully bind us to pay attention forever. Longtermism loves the idea of walking away. Smallpox says you never can.
