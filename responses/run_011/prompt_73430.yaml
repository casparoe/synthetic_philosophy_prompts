  Let's write.

  *Drafting thought:* Start with the ledger. Establish the sanctity of the Pattern.
  *Middle:* The puppeteer. The joy. The audit discrepancy.
  *Scene:* The attempt to tax Mara. She shows her empty pockets. The money is in the bakery, the woodshop.
  *Climax:* The choice.
  *End:* The stamp. The sound.

  *Word Count Management:* I need to be descriptive but concise. I will expand on the sensory experience of the audit and the puppet show to ensure length.

  *Philosophical Core:* The tension between historical entitlement (I earned this freely) and end-state principle (Everyone must have X amount).

