      *   Better: Elian weighs them. He sees Mara's silence (Option 1). He sees Kael's confiscation (Option 2).
      *   Actually, the prompt says "Show that each option imposes a cost...". I can do this through his deliberation.
      *   Ending: He decides. One concrete consequence.

  8.  **Writing - Focus on Sensory Details:**
      *   The smell of ink.
      *   The sound of the puppet show (laughter, strings).
      *   The weight of the coins.
      *   The coldness of the ledger.

  9.  **Word Count Check:**
      *   Need to ensure I hit 1,000-1,500. I need to expand on the internal monologue and the description of the failed fix.

  10. **Final Polish:**
      *   Ensure no moralizing statements ("Liberty is better than equality").
      *   Ensure the Auditor believes in the Pattern (it prevents famine, unrest, greed).
      *   Ensure the transactions are voluntary.

