answer: |-
  The Ledger sat open on Elian's desk, its pages smelling of iron gall ink and old dust. It was the fourth quarter audit, and the numbers were wrong. Not wrong in the sense of error, but wrong in the sense of deviation. The City's holdings were supposed to mirror the Curve, the officially approved distribution of wealth that had kept the walls stable for sixty years. No one starved, no one hoarded. The Curve was a quiet god, and Elian was its priest.

  But the variance report showed a spike. A accumulation of copper in the southern quadrant, specifically in the alley behind the tannery.

  Elian closed the ledger and walked out into the cool afternoon. He needed to see the source before he drafted the correction order. The system was simple: if the drift exceeded tolerance, a General Adjustment reset everyone's holdings to the Curve. It was painless, usually. A few coins vanishing from some pockets, appearing in others. No one noticed.

  He found the source easily enough. A crowd had gathered in the narrow lane, shoulders pressed against the damp brick. In the center stood a woman with painted wood on her hands. Mara. She worked the strings of a dragon that breathed actual smoke, crafted from treated moss and flint. The crowd laughed when the dragon sneezed.

  Elian watched the transaction. A man stepped forward, dropped a copper into a bowl, and watched the show. Then another. Then a child, guided by a mother's hand. No one was forced. No one was cheated. They gave the copper because they wanted the dragon.

  Elian counted the bowls. Three of them, full to the brim. Mara was rich, by the standards of the alley. But more than that, the money had moved. It had left the pockets of forty people and settled in one. Then, Elian realized, it had moved again. He watched Mara walk to the baker's stall two streets over. She bought bread, fine white loaves, paying with the heavy coppers. Now the baker had the excess. The baker would buy wood. The woodcutter would buy ale. The drift was spreading like ink in water.

  Back in the office, Elian tried the narrow fix. It was standard procedure for minor anomalies. He summoned Mara.

  She stood before his desk, hands stained with paint. She looked tired but bright-eyed.

  "The audit shows a surplus," Elian said, sliding a form across the wood. "We will levy a specific adjustment on your holdings. You will return the excess to the pool."

  Mara nodded. She emptied her pockets onto the desk. A few scraps of leather, a knife, three coppers. "I spent it," she said.

  "On what?"

  "Wood. Wire. Food. Rent."

  Elian felt a cold knot in his stomach. He had anticipated this. He went to the baker. The baker had the money, but he had already ordered a new oven with it. The capital was committed. To take the money back now would cancel the order, hurting the oven-maker. Elian went to the oven-maker. The money was already paid to the clay merchant.

  He spent three days tracing the copper. It had fragmented, mixed with other earnings, bought labor, bought time. To claw it back solely from those who now held it would leave them below the Curve. To restore the Pattern, he would have to take from people who hadn't even watched the show, people whose holdings were now technically "high" only because the average had shifted slightly due to the velocity of Mara's spending.

  The narrow fix was impossible. The voluntary exchanges had woven the excess into the fabric of the whole. You could not pluck the thread without unraveling the cloth.

  Elian sat alone in the office as the sun set. The lamp flickered. He had two forms on the desk.

  Form 44-B: Prohibition of Unlicensed Aggregation. This would ban the ticketed performance. Mara would stop. The copper would stay in the pockets of the audience. The Curve would hold.

  Form 12-A: General Adjustment. This would reset everyone's holdings to the approved pattern at the end of the quarter. The money Mara earned, and the money that flowed from it, would be swept up and redistributed. The Curve would hold.

  He picked up the pen for Form 44-B. He imagined Mara tomorrow. She would set up her stage. The crowd would gather. He would step forward and tell her to stop. Not because she harmed anyone. Not because the wood was unsafe or the fire too hot. But because the sum of their willing exchanges broke the geometry of the city.

  He saw her hands drop. The strings would go slack. The dragon would not sneeze. The cost was paid in her silence, and in the dulling of the eyes of the men who would walk past the alley without stopping, keeping their coppers warm and useless in their pockets. They would be safer, poorer in spirit but secure in structure. The liberty to trade their labor for joy would be curbed to preserve the shape of the whole.

  He put down the pen. He picked up the one for Form 12-A.

  He imagined Kael, the baker. Kael had worked hard, baked late, and sold the bread to Mara. He had earned the copper fairly. Under the General Adjustment, Kael's surplus would be taken. Not because he did wrong, but because the Pattern required his holding to match the average. Elian saw Kael's hands, flour-dusted, handing over the coins he thought were his. Kael would not starve. The Adjustment ensured he had enough. But he would not have *more*. He could not build the new oven. He could not save for his daughter's dowry. The cost was paid in his stalled future, in the ceiling placed on his effort by the needs of the distribution.

  If Elian chose 44-B, he protected Kael's holdings but crushed Mara's action.
  If Elian chose 12-A, he allowed Mara's action but nullified Kael's gain.

  Both preserved the Curve. Both maintained the peace. Both required a sacrifice.

  The system demanded that no one rise too high, so no one could fall too low. But to enforce that, it had to either stop the climbing or erase the height gained. There was no third path. The narrow fix had proven that. The money was not the problem; the movement was.

  Elian looked at the Ledger. The Curve was smooth, beautiful, a guarantee against the chaos of greed and the misery of destitution. It was the reason the city had not seen a riot in two generations. It was the reason Elian had a job. He believed in it. He believed that the stability of the many outweighed the surplus of the few.

  But he also remembered the laugh of the child when the dragon sneezed. A voluntary gift, given for a moment of wonder. To tax that moment away felt like taxing breath.

  Yet, to let the moment accumulate was to let the Pattern break. And if the Pattern broke, the audits meant nothing. The trust meant nothing. The safety net dissolved into the luck of the draw.

  Elian dipped the pen. The ink was black and thick. He thought of Kael's oven. He thought of Mara's strings. He thought of the quiet streets where no one went hungry because no one was allowed to feast.

  He wrote the code for the General Adjustment.

  It was the only way to allow the performance. To ban it would be to admit that the city could not withstand the weight of a few coppers changing hands willingly. The system had to be strong enough to absorb the drift. It had to be strong enough to take from Kael so that Mara could play. The cost would be borne by those who accumulated, silently, every quarter. It was the price of the liberty to earn, within the walls of the equal.

  He signed the form. The scratch of the nib was loud in the silent room.

  He rang the bell. A clerk entered to take the order to the mint.

  "Send it," Elian said.

  Outside, the bells of the city began to toll, signaling the end of the quarter. In the bakery down the street, Kael would be counting his till, feeling the weight of the coins, unaware that by morning they would belong to the pool. In the alley, Mara would count her earnings, spend them, and watch them flow away again, free to earn them anew, forever chasing a line that moved whenever she got too close.

  Elian closed the Ledger. The Pattern held. The city slept safely, bounded by its walls and its math. He blew out the lamp, leaving the room in darkness, listening to the distant sound of a crowd laughing in the street.
