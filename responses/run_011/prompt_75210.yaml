          *   Does it dismiss individuality? No, they could still be distinct individuals we just can't track.
      *   *Reading 2: The Principle of the Identity of Indiscernibles (PII).* (Metaphysical).
          *   Strength: Controversial. Max Black's spheres attack this.
          *   Does it justify $1/N!$? Yes, if PII holds, permutations aren't real changes.
          *   Does it justify labels as fiction? Yes.
          *   Does it dismiss individuality? Yes, distinctness requires a difference in properties.
      *   *Reading 3: Verificationism.* (Meaninglessness of unobservable differences).
