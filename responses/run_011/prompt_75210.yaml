  6.  **Addressing "Weak Discernibility" (Relations):**
      *   Saunders/Muller argument. Particles can be discerned by irreflexive relations (e.g., fermions have opposite spin).
      *   This saves a form of individuality without violating quantum statistics.
      *   It undermines the claim that the individuality question has "no answer."

  7.  **Evaluating the Friend's Three Claims against the Readings:**
      *   Claim 1 ($1/N!$ justified): Needs Quantum or Pragmatic reading. Epistemic is shaky (Gibbs paradox arises precisely because classical epistemic limits clash with extensive entropy).
      *   Claim 2 (Labels are fiction): Supported by Pragmatic and Quantum.
