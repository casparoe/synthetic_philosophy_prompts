          *   Does it justify $1/N!$? Yes, unobservable states don't count.
          *   Does it justify labels as fiction? Yes.
          *   Does it dismiss individuality? Yes, the question is meaningless.
      *   *Reading 4: Pragmatic/Convention.* (Counting for utility).
