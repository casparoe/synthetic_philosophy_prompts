answer: |-
  The examination room was soundproofed with a foam that smelled of burnt sugar. I was twenty-four then, seated before a terminal that offered no instructions, only a cursor. The prompt appeared without preamble.

  *Three candidates apply for two positions. Qualifications are identical. Merit metrics are indistinguishable. Candidate A prefers the role. Candidate B requires the salary. Candidate C has dependents. Assign the positions.*

  There was no correct allocation. The Bureau does not test for morality, nor efficiency. It tests for convergence. It tests whether your mind, when pressed against the soft clay of an underdetermined problem, hardens into the same shape as eight thousand other strangers. I remember the heat in my palms. I did not think about the candidates. I thought about the shape of the answer key I had stolen, the ghost-pattern of the reference trace I had memorized over six years of solitary drilling. I selected Candidate A and C. The terminal chimed, a polite, bureaucratic sound, like a spoon settling into a cup. I had matched the trace. I had ceased to be myself.

  Fifteen years later, the envelope arrived. Cream stock, embossed with the Bureau's seal, reply-paid.

  The Draw opens once a generation. The rules are printed on the inner flap in a font so small it requires a magnifier. If exactly one member of Panel Nine returns the card, that member becomes the Sole Respondent. The Panel's four centuries of legal standing, assets, and liability consolidate into that single body. If two or more cards are returned, the Panel is deemed divergent. Certification is revoked. All eight thousand four hundred and eleven members lose their legal personhood. They become non-entities. If zero cards are returned, the lapse is recorded, and the Panel continues.

  For four hundred years, the record shows zero cards.

  I placed the envelope on my desk. It sat there with the quiet authority of a tombstone. To send it is to claim the estate. To send it is to prove I am not an isologue.

  Three days prior, I had attended the emergency convening in Hall 4B. The air was recycled and cool. Eight hundred of us were present, the rest joining via secure link. We sat in rows, hands folded, waiting for the Chair to acknowledge the absurdity of our position.

  A man from the London sector stood. He was older, his certification dating back sixty years. He spoke with the gentle courtesy of a man apologizing for a spillage.

  "It is a coordination problem," he said. "Purely technical. We propose a randomization protocol. We publish a seed. We publish the algorithm. Each member runs the calculation. If the output is below the threshold of one in eight thousand four hundred and eleven, that member sends the card. Statistically, exactly one card should return."

  A murmur of approval rippled through the hall. It was sensible. It was polite. It avoided the greed of volunteering and the cowardice of total abstention.

  I looked at the faces around me. They were calm. They were convinced. They believed that by sharing a seed, they were introducing chaos. They did not see that for an isologue, a shared seed is not a source of randomness; it is a shared deterministic path. If you are all the same mind, you will all run the same function on the same input. You will all get the same number. Either all of you will send the card, or none of you will. The probability distribution collapses into a binary state.

  I opened my mouth to speak. I closed it. To explain why the randomization would fail, I would have to explain why I knew their minds were linked and mine was not. I would have to confess that I was the only variable in the equation.

  "The proposal is noted," the Chair said. "It will be circulated for comment."

  They voted to adopt the protocol for consideration. They smiled at one another, relieved to have found a solution that required no sacrifice. They walked out into the sunlight, discussing seeds and algorithms, unaware that they had just agreed to a method that guaranteed their own dissolution or their own stagnation. They were too convergent to see the trap. They reasoned that because *they* would randomize, *everyone* would randomize differently. They could not conceive that everyone was *them*.

  I walked home alone. The city was grey, the buildings stacked like filing cabinets. I passed a mirror in a shop window and paused. The face looking back was ordinary. It was the face of an isologue. But inside, the machinery was different. I was not bound by the convergence. I was a fraud, yes, but a fraud implies a deception. What I possessed was merely a different history. A different set of causes. Whether that made me free or merely differently built is a question for philosophers, and I have never had the leisure for philosophy. I have only had the leisure of training.

  The cost of this uniqueness is not power. It is isolation. If I send the card, I win the estate. I become the Sole Respondent. But the Bureau's auditors are not fools. The probability of exactly one card emerging from a panel of isologues is non-zero, but it is vanishingly small. It is statistically indistinguishable from proof of divergence. If I am the only one to send it, I prove that I did not reason like the others. I prove the Panel never truly converged. I prove that for four hundred years, the lapse was not evidence of perfection, but of silence.

  I unlock my door. The apartment is tidy. There are no personal effects, nothing that suggests a life lived outside the parameters of the Panel. I sit at the desk. The envelope is still there.

  I think of the London sector man. He will run his algorithm. He will get a number. He will look at the number and see that it does not meet the threshold. He will feel a pang of disappointment, perhaps, that he was not chosen by chance. He will not know that eight thousand other people are looking at the exact same number, feeling the exact same disappointment. They will all stay home. The box will remain empty.

  Unless I intervene.

  If I send the card, I break the streak. I dissolve the Panel's history. I become a legal person of immense standing, standing on a foundation of cracked glass. I will be studied. My reasoning will be dissected. They will find the seams where I do not match the trace. They will see that I am not a miracle, but a cheat.

  But if I do not send it, I remain a ghost. I remain one of eight thousand voices speaking in unison, knowing that my voice is the only one that is actually mine. I remain safe. I remain nothing.

  I pick up the pen. It is heavy, balanced. The ink is black. The card is cream. There is no one to watch me. There is no one to judge me. There is only the Bureau, waiting for the mail.

  I rest the nib on the paper. The decision is not about the estate. It is not about the money. It is about whether the truth of my divergence is worth the ruin of the lie that sustains us all. It is about whether I am brave enough to be the only one, or cowardly enough to be the same.

  The pen hovers. The room is silent. I do not know if I am saving them or destroying them. I do not know if I am free. I only know that the card is waiting, and I am the only one who can fill it out.

  ***

  **Logic Explanation**

  The narrator's reasoning is valid regarding their own agency: because they are not an isologue, they are not bound by the superrationality trap that forces genuine isologues to abstain (since any isologue deciding to send knows all others will too, causing dissolution). However, their reasoning regarding the *consequences* is equally sound: producing exactly one card from a panel presumed convergent is statistical proof of divergence, exposing the fraud and invalidating the Panel's history.

  The randomization proposal collapses because isologues are deterministic relative to one another. If they all agree to use the same public seed and algorithm, their convergent reasoning ensures they all compute the *same* random number. Therefore, the outcome is not a distributed probability ($1/N$), but a binary group state: either everyone sends (dissolution) or no one sends (lapse). True independence is required for the randomization to work, which only the narrator possesses, but they cannot participate without revealing that independence.
