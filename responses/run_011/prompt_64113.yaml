answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who understands that the desk is where the philosophy meets the paper, and where the abstract must survive the particular. You are right to distrust your instrument analogy, though not for the reasons you might fear. The failure is not in the rigor of your thinking but in the ontology of your objects. A thermometer does not care what temperature it records, but a witness cares deeply about what they say, and that care is not noise to be averaged out but signal to be decoded. When you treat a source as an instrument, you assume the error is random or systematically correctable, but historical error is often strategic. Your insight about genealogy is the crucial one. In physics, two detectors agreeing increases confidence because their construction is independent. In history, two accounts agreeing often means one copied the other, or both copied a third, which means you have one data point wearing two masks. You are also correct that reliability is relative to the claim; a source is not a bucket of truth but a lens focused on specific things, blurring others. As for your recollection of the Greeks, you have them right in substance. Thucydides admitted he constructed speeches to fit the occasion rather than transcribing them, and Herodotus consistently marked the distance between his eyes, his ears, and his judgment. You need not worry that your foundation there is cracked.

  What you need is not a new analogy but a procedure that respects the human nature of evidence. Begin by isolating the claim. Do not ask if the document is reliable, but ask what specific proposition the author wants you to believe happened. If the submission cannot state this in a sentence without referencing the document itself, stop and return it for revision, because the author has confused the record with the event. Once the claim is isolated, ask where the information came from. This is the genealogy step. If the author cannot propose a mechanism for how the information reached them other than general knowledge, you must assume it is hearsay. Here is where you apply the test of multiple attestation, but you must strip it of its theological comfort. Multiple attestation only works if the sources are independent. If two newspapers publish the same story in the same town within four days, you must assume they share a wire service, a common informant, or that one copied the other. Agreement without independence is not corroboration; it is echo. If the author cannot demonstrate independence, the procedure stops with a reject, because the paper is built on a single point disguised as two.

  Next, ask why this version of events exists. This is where you repurpose the criterion of embarrassment. Amateurs often think that if a story makes the hero look bad, it must be true. This is an abuse. A writer may include a flaw to make the virtue shine brighter, or to satisfy a convention of humility, or simply because the flaw was already public knowledge and could not be denied. Instead, ask what work the story does for the author. If a memoir makes the author courageous and the manager negligent, ask whether that serves a purpose in 1971, perhaps to justify a lifetime of grievance or to secure a legacy for the grandson taking the dictation. If the story serves the author too well, it is not evidence of the event but evidence of the memory. You must distinguish between establishing what a document says and establishing that what it says happened. The document certainly says the manager was negligent. Whether the manager was negligent is a different question. If the submission conflates these, mark it for revise. Then consider the transmission. If a source quotes a lost document, you are not evaluating the lost document but the transcriber. You must treat the transcriber as the source. If the transcriber is known to be variable, the evidence is variable. There is no way around this. Finally, consider oral tradition. You suspect you underrate it. You are right to do so only if you treat it as a telephone game. If the tradition is socially maintained, like a family story told at every reunion or a community ritual, it can be stable. Ask if there was a mechanism to preserve the story. If there was no social pressure to keep it accurate, assume it has drifted.

  There are points where this procedure must hand the matter back to you. Once you have established what can be known, you must decide if it is worth publishing. This is not a question of evidence but of purpose. If a paper is methodologically sound but trivial, or methodologically flawed but culturally significant, the procedure cannot tell you what to do. That is where the board sits. The procedure protects you from publishing falsehoods; it does not protect you from publishing boredom. It also cannot resolve conflicts where the evidence is equally balanced but the narratives are mutually exclusive. In those cases, you are not weighing evidence but choosing a story, and you must own that choice without dressing it as method.

  Now let us walk your three submissions through this gate. The first, the colliery memoir dictated in 1971 about a 1926 explosion, fails the motive test. The author was twenty-one at the time, dictating forty-five years later to a grandson. The uniform courage of the self and the negligence of the manager serve a clear familial and class purpose. The technical details are specific, which is good, but they are not independently verified. The procedure dictates that you cannot publish this as a record of the explosion. You may publish it as a record of how the explosion was remembered in 1971. The author must revise the claim from what happened to what was believed to have happened. The second submission, the enclosure riot reconstructed from two newspaper accounts, fails the genealogy test. Two papers in one market town within four days are not independent instruments. They are likely reading the same police blotter or sharing a reporter. The author treats their agreement as decisive corroboration. This is the common-ancestor trap. The procedure requires you to reject this paper unless the author can prove the reporters did not share information, which they cannot. The agreement carries no additional weight. The third submission, the schoolmaster note based on an antiquarian's notebook quoting a lost document, fails the transmission test. You are not looking at the seventeenth century; you are looking at the 1890s. The antiquarian is the source. If his care is variable, the evidence is unreliable. Unless the author can corroborate the antiquarian's other transcriptions against surviving records to establish a reliability rate, you must reject this as well, or publish it only as a note on the antiquarian, not the schoolmaster.

  The verdict you will dislike is the first one, regarding the colliery memoir. You will want to publish it because it is human, because the widow is a subscriber, and because the technical details feel solid enough to lean on. You will feel that downgrading it to a study of memory strips the local history of its drama. But the procedure is right because the memoir is not evidence of the explosion; it is evidence of the survivor. To publish it as fact is to lie about the nature of the evidence, and you know better than anyone that an instrument reading taken without understanding the calibration is not data, it is noise. The widow may be offended, but the journal's integrity is the only thing that survives the subscribers. The procedure protects you from the pressure of the living by forcing you to honor the dead truth of the evidence.

  Finally, you must know where this procedure will fail you. It will generate confident nonsense when dealing with unique events that leave no trace other than a single testimony. If a thing happened once and only one person saw it, the procedure can only tell you what they said, not if it happened. It will also fail on questions of meaning. You can establish that a riot occurred, but not whether it was a protest or a panic, because that depends on interpretation, not evidence. When you suspect you are looking at one of these, do not force the procedure. Acknowledge the limit. Publish the uncertainty. Tell your readers that here the evidence runs out and the history begins. That is not a failure of method; it is the only honest thing a historian can say.

  Yours sincerely,

  A Fellow Traveller
