answer: |-
  **MEMORANDUM**

  **TO:** Editorial Advisory Board
  **FROM:** [Your Name]
  **DATE:** Monday, [Date]
  **SUBJECT:** Decision and Framework: Armenian Genocide Death Toll Pitch

  **Recommendation**

  I am recommending we **reframe-and-commission** this piece. We should not publish the pitch as written, but we should not decline the author. The current pitch asks us to arbitrate a demographic dispute where the evidence is inherently fragmentary; the reframed piece should ask us to examine *why* that dispute exists and why the 1.5 million figure has hardened into a moral anchor despite historiographical nuance.

  **Rationale**

  **1. Methodology and the "Double Standard"**
  The board's strongest objection is correct: the author demands archival precision from the incumbent 1.5 million figure that she cannot supply for her own 800,000–1.2 million reconstruction. Both rely on the same fragmented consular and parish data. If we publish her arithmetic as a correction, we validate a methodological flaw. However, if we publish her analysis of *why* the 1.5 million figure persists (community memory, political recognition, the 1914–23 vs. 1915–18 window), we turn a demographic vulnerability into a sociological strength. The story becomes the "hardening," not the "subtracting."

  **2. The Citation**
  The author must drop the citation from the foundation linked to denialism. Sincerity regarding the "narrow point" is irrelevant. In a general-interest magazine, citations are not just footnotes; they are signals of intellectual lineage. We cannot allow our pages to provide cover for a network dedicated to erasing the crime, even if this specific author is not. She has offered to drop it; we must hold her to that.

  **3. Funder Relations**
  We have an Armenian-American funder. Pretending this is irrelevant insults their intelligence; letting it decide the outcome insults our integrity. If we decline this solely to protect funding, we become a advocacy sheet, not a quarterly. If we publish a piece that functionally aids denialists, we betray the trust that funding represents. The reframed approach respects the funder by treating the genocide as an established fact while respecting the magazine's mission by exploring the complexity of historical memory. We protect the relationship not by censorship, but by rigor.

  **4. Uptake and Mitigation**
  The fear is that the reader's takeaway will be "the numbers are disputed," implying the genocide itself is debatable. An editor's note is insufficient; it is often unread, or read as a disclaimer that validates the controversy. A "response" piece creates a false equivalence between established history and revisionism.
  The fix must be in the text. The reframed commission requires the author to explicitly state in the introduction: *The fact of the genocide is not in question; the arithmetic of the dead is.* The headline cannot be "The Real Death Toll." It must be something like "The Weight of a Number." We are publishing an essay on memory, not a correction to an encyclopedia entry.

  **A General Test for "Settled Record" Cases**

  Our current policy ("don't contradict the settled record") is unusable because "settled" is undefined. For future pitches involving contested history or science, apply these four questions. If the answer to any is "No," the piece requires reframing or decline.

  1.  **Conduct vs. Conclusion:** Is the challenge based on new evidence or better methodology, or does it rely on excluding inconvenient data/redefining terms to minimize harm? (Denialism is often a property of conduct, not just conclusion.)
  2.  **Asymmetry of Revision:** If this is a downward revision of human suffering (or an upward revision of environmental risk), does the author acknowledge the higher burden of proof regarding public uptake? We are permitted to treat downward revisions of atrocity tolls differently from upward ones because the former are weaponized by bad actors in ways the latter are not.
  3.  **The Moral Core:** Does the revision undermine the moral, legal, or scientific classification of the event? (e.g., Does lowering the death toll imply it wasn't a genocide? Does challenging a climate model imply warming isn't happening?) If yes, decline.
  4.  **The Headline Test:** If the piece is reduced to a single sentence on social media, does it mislead? If the likely takeaway is "X is disputed," can the text itself inoculate the reader against that misunderstanding?

  **The Strongest Counter-Argument**

  The case against this recommendation is that it chills legitimate scholarship. Historians should be allowed to revise numbers without being accused of denialism. By forcing a "sociological" frame, we may be protecting our own comfort rather than the truth. There is a risk that we are treating the 1.5 million figure as sacred dogma, which contradicts our mission to interrogate ideas. If we are not willing to publish a rigorous argument that a number is too high, we are not a magazine of ideas; we are a guardian of memory. This is a valid concern. However, given the fragmentary nature of the evidence and the active political weaponization of this specific revision, the risk of harm outweighs the incremental gain in demographic precision. We can explore the *uncertainty* without endorsing a specific *rival number*.

  **Next Steps**

  I will contact the author's agent Tuesday afternoon. I will outline the reframing requirements: drop the citation, shift focus from arithmetic to memory, and explicit framing of the genocide's certainty. If she agrees, we aim for the Summer issue. If she refuses, we decline.

  Verdict: reframe-and-commission
