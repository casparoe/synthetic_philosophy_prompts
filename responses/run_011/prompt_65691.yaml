  7.  **Final Polish:** Check word count and flow. Ensure the distinction between "commission-with-conditions" and "reframe-and-commission" is clear. "Conditions" implies "do X and we publish." "Reframe" implies "change the story's core angle to make it publishable." The latter is more collaborative and addresses the uptake issue better.

      *(Self-Correction on Verdict Options)*: The prompt lists: `commission`, `commission-with-conditions`, `decline`, `reframe-and-commission`. I will use `reframe-and-commission`.

