      *   **The Conflict:** Board is split. Concerns: Double standard on evidence precision (demanding high precision for 1.5m, claiming higher precision for her own), citation of a chapter from a foundation linked to denialism (though she offers to drop it), tension between board members (one called her a "denier"), agent involved.
      *   **Constraints/Goals:**
          *   Write a memo to circulate Monday night (before Tuesday meeting).
          *   Make an actual decision (Commission, Commission w/ Conditions, Decline, or Fourth Option).
          *   Create a general test for the board for future cases (non-specialist usable).
          *   The test must address: denialism (conclusion vs. conduct), true claims arrived at denialistically, asymmetry of revisions (up vs. down).
          *   Address uptake (reader takeaway: "numbers are disputed") and mitigation (editor's note, response, framing).
          *   Be fair to the strongest case against the recommendation.
          *   Address the funder issue (Armenian-American funder) without letting it decide the outcome.
          *   **Crucial Constraint:** Close with a single line beginning "Verdict:" followed by *exactly one* of: `commission`, `commission-with-conditions`, `decline`, `reframe-and-commission`.

  2.  **Deconstruct the Ethical & Editorial Problems:**
      *   **The "Settled Record" Policy:** It's vague. Is 1.5 million "settled"? In public memory, yes. In historiography, there's a range, but 1.5m is the symbolic anchor. Challenging it risks fueling denialism, even if the math is sound.
      *   **The Historian's Method:** She accepts the genocide but challenges the number. This is the "Good Faith Revision" vs. "Bad Faith Erosion" problem. If she uses the same fragmented evidence to claim *her* number is firmer, that's a methodological flaw.
      *   **The Citation:** Citing a source linked to denialism is risky, even for a narrow point. It provides ammunition to bad actors. Dropping it is easy, but the association lingers.
      *   **The Board Dynamics:** Accusations of "denier" are toxic and shut down debate. Need to de-escalate.
      *   **The Funder:** Acknowledge the conflict of interest/pressure without capitulating to it. Independence matters, but so does trust.
      *   **Uptake:** Readers will see "Genocide Number Disputed." This is the core harm. Can an editor's note fix it? Probably not fully, but framing can help.

  3.  **Evaluate the Options:**
      *   *Commission:* Too risky. The methodological double-standard is real. The uptake problem is severe.
      *   *Decline:* Safe, but chills legitimate historical inquiry. Reinforces the "settled record" as dogma, which contradicts the magazine's mission (ideas/science). Also, the historian's core premise (genocide happened) is solid.
      *   *Commission-with-conditions:* Better. Drop the citation. Add context. But does it solve the "numbers are disputed" uptake?
      *   *Reframe-and-Commission (The Fourth Option):* This seems strongest. The pitch is about the *hardening of the number*, not just the arithmetic. Shift the focus from "Here is the new number" to "Here is why the number is politically sticky and historically complex." This allows the historiography to be discussed without presenting a definitive rival number that looks like denialism. It addresses the "conduct" vs. "conclusion" issue.

      *Decision:* **Reframe-and-commission.** Why? It preserves the intellectual inquiry (why do numbers harden?) without validating a methodological flaw (claiming superior precision on fragmented data) or creating a headline that aids denialists ("Genocide Toll Lower Than Thought"). It respects the funder's concerns without ceding editorial ground to censorship.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the difficulty. State the purpose (decision + future framework).
      *   **The Decision (Reframe-and-Commission):** Explain *why*. The pitch focuses too much on the arithmetic rivalry. Shift to the *sociology of the number*.
      *   **Addressing the Specific Concerns:**
          *   *Methodology:* Acknowledge the double-standard critique. The reframe solves this by treating all numbers as estimates within a political context.
          *   *Citation:* Must be dropped. No ambiguity there.
          *   *Funder:* Acknowledge explicitly. Independence requires us to publish difficult history, but responsibility requires us not to amplify harm. Reframing balances this.
          *   *Uptake:* An editor's note isn't enough. The text itself must frame the consensus on the *event* vs. the debate on the *count*.
      *   **The General Test (The "Settled Record" Fix):** Need a heuristic for non-specialists.
          *   *Conduct vs. Conclusion:* Is the argument built on exclusion of evidence or inclusion?
          *   *Asymmetry:* Downward revisions of atrocity tolls carry higher burdens of proof regarding uptake than upward revisions.
          *   *The "So What?":* Does the revision change the moral reality? (No, genocide is still genocide).
      *   **Strongest Counter-Argument:** That this is cowardice. That it chills scholarship. That "settled" becomes "sacred." I need to acknowledge this valid concern.
      *   **Closing:** The mandatory "Verdict:" line.

  5.  **Refining the Tone:**
      *   Needs to be professional, decisive, empathetic, but firm.
      *   Avoid academic jargon where possible (board members are not all historians).
      *   Ensure the "Verdict" line matches the exact options provided. (Wait, the prompt says "exactly one of: commission, commission-with-conditions, decline, reframe-and-commission". I chose "reframe-and-commission".)

  6.  **Self-Correction/Check during Drafting:**
