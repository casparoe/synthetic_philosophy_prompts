answer: |-
  Selma: Look at the printout. Fifty-two observations, no violations. Afriat's theorem guarantees we can construct an increasing, concave utility function that rationalizes every single choice. The machine ran overnight; here is the surface.

  Tomás: Which surface? You know as well as I do that any monotone transformation of that function rationalizes the data equally well. If I square your utility values or take their logarithm, the choice predictions remain identical. So when you say this household "maximizes utility," which utility are they maximizing?

  Selma: None of them specifically. That is the point. The theory claims only that the household acts *as if* it possesses a complete, transitive ordering over bundles. The function is merely a numerical index of that ordering. To ask which transformation is the "real" one is to ask a question the theory explicitly rules out as meaningless.

  Tomás: But if the magnitude means nothing, then "maximization" is empty. You have redescribed the choice pattern using the vocabulary of optimization, but you haven't identified a mechanism. If utility is just a shadow of choice, saying they "chose X because it maximized utility" is like saying "opium induces sleep because of its dormitive virtue."

  Selma: It is not empty because the ordering imposes constraints. The empirical content lies in the Generalized Axiom of Revealed Preference. If the data violated GARP, the theory would be falsified. We would have to reject the hypothesis that this agent is consistent. The theory risks being wrong; that is what gives it content.

  Tomás: Does it? Suppose I observe a guest taking a smaller portion of cake when a larger one is available, though she prefers more cake. You will say she values politeness. Suppose I observe her taking the larger portion when no one watches. You will say the goods are different: "cake-in-front-of-host" versus "cake-alone." By finely individuating the choice situation, you can rationalize any behavior.

  Selma: We individuate contexts based on relevant features the agent responds to. If the choice changes, something in the choice set or the constraints changed. This isn't immunization; it's precision. If we cannot distinguish the situations, we cannot model the decision. The theory demands we specify the goods correctly.

  Tomás: But if you can always save the theory by re-describing the goods, the theory never actually forbids anything. It becomes a tautology. You claim independence from introspection, but you rely on a hidden introspection to decide which features of the context count as part of the "bundle."

  Selma: Let's move to risk. If we introduce lotteries, the representation is unique up to positive affine transformation. That is more structure than a mere ordering. The vNM utility function captures intensity of preference over risks. Surely that buys us more than a shadow?

  Tomás: It buys you structure over risk attitudes, not satisfaction. The curvature of the vNM function measures risk aversion, not the magnitude of hedonic experience. I can be risk-averse over money because I need a threshold for rent, not because the marginal utility of dollars diminishes in some psychological sense. You still haven't measured a state of satisfaction.

  Selma: Because you insist utility must be a state. I propose instead that utility is identified with a higher-order disposition to choose. It is a theoretical property, like fragility. A glass is fragile not because of a hidden "fragility substance," but because it breaks when struck. Similarly, an agent has utility preferences because they choose systematically when confronted with options.

  Tomás: Fragility is explained by molecular structure. If you say utility is *only* the disposition, you lose the explanatory link. Why did she choose the apple? Because she prefers it. Why does she prefer it? Because she chooses it. You have collapsed the cause into the effect. A disposition needs a categorical base to do explanatory work.

  Selma: In functionalist terms, the role is the property. If the disposition holds across counterfactuals—if she *would* choose the apple given these prices—then the property is real enough for science. We don't need to open the black box to predict behavior.

  Tomás: Prediction is not explanation. But I will concede this: if your goal is purely predictive modeling of market demand, your dispositional account is sufficient. I must admit that for aggregate forecasting, positing real internal states adds complexity without necessarily improving fit.

  Selma: That concession costs you the claim that the theory is scientifically empty. If it predicts successfully, it captures something real about the world, even if that something is structural rather than psychological.

  Tomás: It captures regularity, not mechanism. But I see your point on prediction. However, you must concede something too. You often make welfare claims—that a tax makes this household "worse off." If utility is just choice, and they still choose to buy the good after the tax, in what sense are they worse off? You cannot use their own choices to judge their welfare if choices are all there is.

  Selma: You are right. I cannot claim they are subjectively less satisfied. I can only say they are constrained to a lower indifference curve relative to the original prices. I must concede that my theory cannot underwrite strong normative claims about well-being, only consistency of choice under constraint.

  Tomás: That costs you the ordinary language of economics. You cannot say they are "hurt," only that their feasible set shrank.

  Selma: Precisely. But then we are at an impasse. I am willing to accept that limitation if it secures the methodological virtue of objectivity. What evidence would move you to accept that the dispositional account is enough?

  Tomás: I would need evidence that introspective reports of satisfaction correlate with choice anomalies that revealed preference cannot rationalize without ad hoc individuation. If I could show that measured happiness predicts choice better than past choice does, I would have a case for utility as a distinct state. What would move you?

  Selma: I would need evidence that positing internal states improves out-of-sample prediction significantly enough to justify the loss of parsimony. If the black box adds no predictive power, I will not open it.

  Tomás: Then we agree on the data, but not on what the data is data *of*.

  Selma: We agree that choice is the anchor. We disagree on whether it anchors a structure or a state.

  Tomás: And until someone finds a crack in GARP that only psychology can fix, we will stay here.

  Selma: Until then, the printout stands.

  Tomás: The printout stands, but the meaning hangs.

