answer: |-
  The Concorde programme is the eponymous case for the sunk-cost fallacy, often colloquially termed the "Concorde Fallacy." However, when examined through the specific game-theoretic lens of Martin Shubik's Dollar Auction, the fit is suggestive but imperfect. To evaluate whether Concorde truly exhibits the structure of the fallacy it named, we must first map the actors and incentives, then identify where the economic reality diverges from the theoretical model, and finally assess what this implies for the robustness of the theory itself.

  ### The Literal Mapping

  In Shubik's Dollar Auction, two bidders compete for a dollar bill. The highest bidder wins the dollar, but *both* the highest and second-highest bidders must pay their final bids. This structure creates a trap: once bids approach the value of the prize, neither player can quit without locking in a loss, prompting them to bid *over* the value of the prize to mitigate the loss of their previous investment.

  **The Bidders:** The two bidders were the British and French governments. While airlines (BOAC, Air France) were the intended operators, the financial risk and decision-making authority lay with the states following the 1962 treaty.

  **The Prize:** The prize was not merely the aircraft, but "supersonic leadership." In the context of the Cold War and the jet age, this meant technological sovereignty, prestige, and the capture of a presumed lucrative monopoly market.

  **The Bids:** The bids were the tranches of development funding. The initial bid was the 1962 treaty commitment (estimated at £70 million). Subsequent bids were the annual appropriations required to keep the programme alive as costs ballooned to £1.5–2 billion.

  **The Auctioneer:** In a literal Dollar Auction, the auctioneer collects the losing bid as profit. In Concorde, there was no single profit-taking auctioneer. Instead, the "auctioneer" was the *joint commitment mechanism* itself. The treaty created a ratchet: to withdraw was to pay the sunk cost *and* suffer diplomatic and industrial humiliation, while continuing meant paying more for a diminishing return.

  **Crossing the Dollar:** The moment the bidders crossed the value of the dollar—where marginal cost exceeded marginal expected revenue—occurred roughly around 1971. This is when Boeing cancelled its rival SST, citing economic unviability and environmental concerns, and when the forecast market collapsed from 350 aircraft to a handful of options. By 1971, the commercial case had evaporated; no plausible forecast of ticket sales could justify the remaining development costs against the £70 million original estimate. Yet, funding continued for another five years until entry into service in 1976.

  **Interdependence:** The continued participation was mutually reinforcing. For the UK, withdrawing would mean abandoning the French, damaging the nascent European defence and industrial alliance, and admitting a £hundreds-of-millions loss with nothing to show. For France, withdrawing would mean ceding technological leadership to the Americans (despite Boeing's cancellation, the *capability* gap would remain) and losing its British cost-sharing partner. Each government's continued funding was justified by the other's presence: "We cannot stop because they will not stop, and if they stop, our investment is worthless." This is the essence of the Dollar Auction trap: bidding to avoid being the "second-highest bidder" who pays but gets nothing.

  ### Where the Analogy Breaks

  While the escalation dynamic mirrors the Dollar Auction, the economic substrate of Concorde violates the model's core assumptions in three critical ways.

  **1. Recoverability of Bids:** In Shubik's game, money paid to the auctioneer is gone. In Concorde, the "bids" (development costs) were largely transferred to domestic firms (British Aerospace, Aérospatiale) and workers. The £2 billion was not burned; it was circulated within the British and French economies, sustaining high-skilled employment and industrial infrastructure. In game-theoretic terms, the "loss" was partially recouped as domestic economic stimulus, a variable absent from the Dollar Auction.

  **2. Variable Value of the Prize:** The Dollar Auction assumes a fixed prize value ($1). Concorde's prize value was subjective and multifaceted. If the prize were defined strictly as *commercial profit from ticket sales*, the bidders vastly overpaid. However, if the prize included "industrial capability," "prestige," and "bilateral cohesion," the value is indeterminate. The technology developed for Concorde fed into the Airbus programme; the diplomatic trust built during the friction of Concorde facilitated later European defence cooperation. The bidders may have been paying £2 billion for a "dollar," but that dollar might have been worth £3 billion in non-ledger utility.

  **3. The Nature of the Fallacy:** Does the case belong to the sunk-cost fallacy, the Dollar Auction, or neither?
  *   **Sunk-Cost Fallacy:** This applies if the decision was driven purely by psychological regret ("We've spent too much to quit"). Evidence suggests this was a factor in public rhetoric.
  *   **Dollar Auction:** This applies if the decision was strategic escalation ("If we quit, France wins/loses face, and we lose our investment"). The treaty lock-in supports this.
  *   **Neither:** If the governments explicitly valued prestige and industrial capacity over profit, the decision was rational *ex ante* based on a different utility function.

  The most accurate classification is that Concorde began as a rational commercial gamble, transformed into a **Dollar Auction** between 1968 and 1971 (as costs rose and competitors dropped out), and was sustained post-1971 by a mix of **sunk-cost psychology** and **political utility maximization** that the standard economic model does not capture.

  ### Theoretical Implications

  The canonical status of Concorde creates a paradox for the theory it names. If the Concorde programme is the archetypal evidence of the fallacy, but an analysis reveals it may have been rational under a broader utility function (industrial policy vs. commercial profit), the theory is undermined.

  **Insulation from Refutation:** The theory is often insulated by hindsight. We label Concorde a fallacy because it failed *commercially*. However, rationality is determined by the information available *at the time of the decision*, not the outcome. The theory is silent on *what* the actors are maximizing. If a government values national prestige, spending £2 billion to "win" a prestige race is rational, even if the aircraft loses money. By defining the fallacy solely through financial loss, the theory conflates *bad business* with *irrational decision-making*.

  **Settling Rationality Ex Ante:** What could have settled whether continued funding was rational before the fact? A clearly defined objective function signed alongside the 1962 treaty. If the treaty had stated, "This project will be cancelled if projected ROI falls below X%," then continuing past 1971 would be irrational. Without such a constraint, the goalposts could move from "profit" to "jobs" to "prestige" as needed. The theory is silent here because it assumes a single metric of value (usually monetary), whereas political actors operate with multiple, shifting currencies of value.

  **Evidence Against the Fallacy:** An episode recruited to name a fallacy can indeed function as evidence against it, provided we scrutinize the "value" variable. If Concorde secured the industrial base necessary for Airbus (which became a massive economic success), then the "loss" on Concorde was an investment in a broader portfolio. In this light, the "Concorde Fallacy" is not a failure of logic, but a failure of accounting scope.

  ### Conclusion

  The Concorde programme fits the *structure* of Shubik's Dollar Auction in its escalation dynamics and the mutual lock-in of the British and French governments post-1971. However, it breaks the model because the "bids" were domestic investments rather than forfeited fees, and the "prize" included non-monetary assets that the Dollar Auction does not account for.

  Ultimately, the Concorde example suggests that the "Concorde Fallacy" is less a rigorous game-theoretic trap and more a retrospective label for projects where commercial losses outweighed visible gains. The theory remains silent on whether those losses were acceptable prices for intangible goods. Until the utility function of the bidder is defined, we cannot distinguish between a fallacy and a strategy; Concorde remains not a proof of irrationality, but a testament to the difficulty of defining value in statecraft.
