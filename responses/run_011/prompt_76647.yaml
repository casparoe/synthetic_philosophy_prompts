answer: |-
  ### Preliminary Theoretical Mapping

  Before dissecting the constitutional machinery, we must identify the competing conceptions of authority lurking beneath the gears.

  **Candidate Theory A: The Legislative Agency Model.**
  This view posits that the legislature is the primary site of popular sovereignty. The executive is merely a committee appointed by the legislature to discharge specific functions. Legitimacy is fluid; it relies on the continuous confidence of the assembly. Representation is indirect: the people elect the parliament, and the parliament authorises the government. This sits naturally with the idea of authority as a *revocable delegation*.

  **Candidate Theory B: The Dual Mandate Model.**
  Here, sovereignty is divided. The legislature represents the diverse interests of the districts; the executive represents the unitary will of the whole people. Legitimacy is crystallised at the moment of election and remains static for the duration of the term. Representation is direct (or quasi-direct). This aligns with authority as a *fiduciary office* granted by the constitution, not the legislature.

  **Candidate Theory C: The Two Bodies of the State.**
  Derived from Kantorowicz's medieval political theology, this suggests the state requires both a 'body natural' (the fallible, partisan administrator) and a 'body politic' (the immortal, neutral symbol of continuity). Parliamentary systems institutionalise this separation physically (Monarch/President vs. Prime Minister). Presidential systems attempt to fuse them in one person.

  With these theoretical contours sketched, we may proceed to the structural analysis.

  ***

  ### The Parliamentary Design: Authority as Revocable Delegation

  The parliamentary arrangement, particularly with the 'constructive' vote of no confidence (as seen in the German Basic Law), strictly requires that the executive's tenure be contingent upon the legislature's ongoing will. It does not merely sit comfortably with the view that governing authority is a standing delegation; it *entails* it. If a Prime Minister can be removed mid-term simply because a majority prefers another candidate, the office cannot be conceived as a right or a fixed trust held by the individual. It is a function discharged on sufferance.

  This design forecloses the rival account that the executive possesses an independent democratic mandate. In a pure parliamentary system, it is theoretically incoherent for a Prime Minister to claim they represent 'the people' against the Parliament that sustains them. The Parliament *is* the people's authorized agent; the Government is the Parliament's agent. Consequently, the removal of a Prime Minister need not be recast as a juridical finding of guilt. It is a political recalibration. The constructive element—requiring a replacement to be named simultaneously—strengthens this by ensuring the delegation is never vacant, emphasising that the *office* persists even if the *officer* is discarded.

  ### The Presidential Design: Authority as Fixed Trust

  Conversely, the presidential system strictly requires that the executive's tenure be insulated from ordinary legislative displeasure. It sits comfortably with, and indeed structurally enforces, the view that a direct electoral mandate creates a non-revocable status for a fixed duration. Early exit is an anomaly, a rupture in the constitutional order, which is why it must be recast as a forfeiture of office through impeachment.

  By framing removal exclusively around 'high crimes and misdemeanours' (or grave wrongdoing), the design forecloses the idea that the legislature can withdraw authority merely due to incompetence or loss of political support. To allow removal for plain incompetence would be to admit that the President is an agent of the legislature, undermining the claim of dual legitimacy. Thus, the presidential system commits us to the view that the President holds a proprietary interest in the office for the term, granted by the sovereign people via the constitution, which the legislature cannot reclaim unless the holder violates the terms of the grant.

  ### Internal Coherence: The Problem of the Fused Bodies

  Here we encounter a profound tension regarding the 'Head of State' function.

  The parliamentary model achieves high internal coherence by separating the 'dignified' from the 'efficient' parts of the constitution, to borrow Bagehot's distinction. The Monarch or Ceremonial President embodies the polity's unity. Being blameless for policy, they can remain above the fray, symbolising continuity whilst governments rise and fall. The Prime Minister absorbs all partisan venom, protecting the sanctity of the state itself.

  The presidential model, by fusing Head of State and Head of Government, risks incoherence. It demands that one individual be both the impartial symbol of national unity and the partisan chief executive. When a President pursues divisive policies, they inevitably tarnish the symbolic dignity of the state they impersonate. If the President is the polity, and the President is hated by half the polity, the state itself appears partisan. While not logically impossible, this fusion places a heavy psychological and symbolic burden on the office that the parliamentary separation elegantly avoids. It requires the citizenry to distinguish between the man and the office in a way the structure itself conflates.

  ### The 'Constructive Impeachment' Hypothetical

  Suppose a reformer introduces 'constructive impeachment': a legislature may remove a President mid-term by supermajority, provided a successor is named to serve the remainder of the term.

  This hybrid mechanism abandons the core presidential presupposition that authority is a non-revocable status. By allowing removal for political reasons (implied by the lack of requirement for criminal offences), it承认s that the executive's legitimacy is contingent on legislative tolerance. It effectively converts the fixed term into a conditional delegation.

  However, it preserves the *form* of the presidency (a single individual, perhaps separately elected initially) while swapping the underlying theory of authority from the Dual Mandate Model to the Legislative Agency Model. The requirement to name a successor mirrors the German constructive vote of no confidence, prioritising governmental stability over executive independence.

  Would the resulting system still be presidential? Nominally, yes. Theoretically, no. A system where the legislature can dismiss the executive at will (even with a supermajority) is, in essence, parliamentary. The label 'President' would remain, but the office would no longer be a co-equal branch deriving authority directly from the people for a fixed trust. It would become a prime-ministerial office in all but name. The reform would not bridge the two theories; it would subsume the presidential theory into the parliamentary one, retaining the aesthetic of the former while adopting the operational logic of the latter. True presidentialism requires that the legislature *cannot* fire the executive simply because it wishes to; once that barrier falls, the separation of powers collapses into legislative supremacy.
