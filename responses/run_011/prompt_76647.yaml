          *   Address specific questions: Is parliamentary authority a revocable delegation? Is presidential authority a non-revocable mandate forfeitable only by offence?
          *   Assess internal coherence (Head of State vs. Head of Government fusion/separation).
          *   Analyze a hypothetical reform: "Constructive Impeachment" in a presidential system. Does it preserve presuppositions? Is it still presidential?
          *   **Style:** British English, tight, argumentative (not encyclopaedic).

  2.  **Brainstorming Candidate Theories (Opening Section):**
      *   *Parliamentary:*
          *   Theory: Popular Sovereignty mediated through Legislature.
          *   Representation: The Parliament *is* the people (Sieyès, Hobbesian authorization).
          *   Legitimacy: Confidence-based. Authority flows from the assembly to the executive.
          *   Key concept: Agency/Delegation. The PM is an agent of the House.
      *   *Presidential:*
          *   Theory: Separation of Powers / Dual Legitimacy.
          *   Representation: The President represents the "Whole People," Legislature represents "Districts/Interests."
          *   Legitimacy: Time-bound mandate. Fixed term implies independence.
          *   Key concept: Office/Fiduciary. The President holds an office granted by the Constitution/People, not the Legislature.
      *   *Head of State (HoS) vs. Head of Government (HoG):*
          *   Separation (Parliamentary): HoS = Unity/Continuity (Monarch/President), HoG = Policy/Partisanship.
          *   Fusion (Presidential): One person embodies both Unity and Policy.
      *   *Constructive Impeachment:*
          *   Hybrid. Keeps fixed term logic (successor named) but introduces confidence logic (removal by legislature).

  3.  **Drafting - Section by Section:**

      *   **Introduction/Brainstorming:** Keep it concise. Frame the core tension: *Agency* vs. *Office*.
          *   Parliamentary presupposes the executive is a committee of the legislature. Legitimacy is fluid, contingent on ongoing consent.
          *   Presidential presupposes the executive is a co-equal branch. Legitimacy is crystallised at election, frozen for the term.
          *   HoS/HoG split: Dignified vs. Efficient (Bagehot). Unity vs. Action.

      *   **Parliamentary Design Analysis:**
          *   *Requirement:* Executive responsibility to the legislature.
          *   *Legitimacy:* Chain of delegation. People -> Parliament -> Government.
          *   *Revocability:* Yes, it implies authority is a standing delegation. The "Constructive Vote of No Confidence" (Germany) strengthens this: you can't just destroy, you must rebuild. It treats government as a *function* not a *status*.
          *   *Foreclosed:* It forecloses the idea that the executive has an independent mandate from the people distinct from the legislature.

      *   **Presidential Design Analysis:**
          *   *Requirement:* Fixed term, independent election (usually), high bar for removal.
          *   *Legitimacy:* Direct (or quasi-direct) grant from the sovereign people.
          *   *Non-revocability:* Yes, it treats the term as a property right or a trust that cannot be withdrawn merely for political disagreement. Removal must be juridical (crime/treachery), not political (incompetence/loss of support).
          *   *Foreclosed:* It forecloses the idea that the legislature represents the *whole* will of the people sufficiently to dismiss the executive.

      *   **Internal Coherence (The HoS/HoG Question):**
          *   *Parliamentary:* Coherent. Separates the "Two Bodies of the King" (Kantorowicz). The Monarch/President is the immortal body (State), the PM is the mortal body (Administration). Blame attaches to the mortal, dignity to the immortal.
          *   *Presidential:* Problematic. Fuses the Two Bodies. How can one person be the impartial symbol of national unity *and* the partisan fighter for policy? When the President is unpopular as a partisan, does it damage the dignity of the State? It risks politicising the symbol of unity.

      *   **The "Constructive Impeachment" Hypothetical:**
          *   *Mechanism:* Legislature removes President by supermajority + names successor.
          *   *Analysis:* This imports the parliamentary logic of *confidence* into the presidential logic of *fixed terms*.
          *   *Presuppositions:* It abandons the "non-revocable status" of the presidential mandate. It accepts that authority is contingent on legislative tolerance.
          *   *Preservation:* It keeps the *label* of President and perhaps the separate election origin, but functionally it makes the executive a creature of the legislature.
          *   *Verdict:* It is a parliamentary wolf in presidential clothing. The theory of authority shifts from "Constitutional Grant" to "Legislative Delegation." It ceases to be truly presidential in the theoretical sense, even if the title remains.

  4.  **Refining and Polishing (British English & Tone):**
      *   *Vocabulary:* Use terms like "whilst," "programme," "centre," "favour." Ensure philosophical rigour (e.g., referencing the "King's Two Bodies," "fiduciary," "agency").
      *   *Tone:* Argumentative. Avoid "on the one hand, on the other." Take a stance on the coherence issues.
