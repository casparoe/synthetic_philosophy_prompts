  Eddu died in his sleep. He was holding a stylus.

  Tori died in a feud over a water right, ten years later. His son broke the clay tablets to use the shards for grinding grain.

  Hessa lived to be old. She told her grandchildren that the time of the Palace was a time of hunger, that the road was a mouth that ate their wool and gave back nothing but rules. She said they were free now.

  The grandchildren played on the terraces. The grass was growing over the stone walls. The population was half what it had been when the captain walked away. The writing was gone. The shrine was quiet.

