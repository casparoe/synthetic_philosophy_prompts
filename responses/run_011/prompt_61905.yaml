  Eddu had watched the garrison walk away. They didn't burn the storehouses. They didn't smash the idols. They just walked up the switchback until they were specks, then nothing.

  He had stayed. He had counted the jars that stayed. He had recorded the departure of the guards in the log: *Personnel: 40. Status: Departed.* He had waited for a tablet to arrive confirming the receipt of the departure notice. None came.

  He continued to make marks. It was what he was. Without the marks, the grain was just grain. Without the marks, the departure was just men walking. The marks made it real. He knew it was ridiculous. He caught his reflection in a polished bowl of oil and saw a man making faces at a wall. But if he stopped, the valley became a story someone else told. If he wrote it, it was a record.

  ***

  Tori put the tablet on the shelf. It joined three hundred others made since the road closed.

  "Kael says the complexity kept us alive," Hessa said, her voice softer. "The machine. The seed loans. The law. You can't eat a record, Tori."

  "No," Tori said. "But if I stop, then what happened to Grandfather? What happened to the Captain? If I don't write that they left, then they never existed. They just vanished."

  "They existed," Hessa said. "We're here. We're eating their grain."

  "We are fewer," Tori said again. He looked at his hands. They were stained with clay. "And when the next drought comes, and men kill each other over water because there is no higher judge, you will say we are free. I will say we are exposed."

  "Freedom is exposure," Hessa said. "But don't pretend you're saving us. You're saving yourself."

