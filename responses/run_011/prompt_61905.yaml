  Two generations later, Tori sat in the same room. The roof leaked now; a dark stain spread over the niche where the royal seal used to hang. He was pressing marks into clay, just as his grandfather had taught him.

  "There's no one to read them," Hessa said. She was leaning against the doorframe, shelling beans. She looked well-fed. They all did, this year. The grain that used to go up the road was in their bellies.

  "Someone might come," Tori said. He pressed a wedge for *five*. He didn't know what he was counting. The jars were there, but they weren't going anywhere.

  "Someone might come," Hessa repeated. "Or the rain might stop. Kael says the lower fields are already fighting over the stream. Without the Palace judges, two men died yesterday over a diverted ditch."

  "They died because they are fools."

  "They died because there was no one to tell them not to," Hessa said. She tossed a bean pod onto the table. "You think this is collapse? The Palace is gone. The big men are gone. We are eating better than our fathers. The shrine on the ridge isn't sending blood to a king anymore; we sacrifice to the local dead, and the meat stays in the valley. That is better."

  "We are fewer," Tori said. He gestured out the window. The hamlets below were quieter. Half the houses were dark. "The drought came last year. The Palace would have sent seed from the coast. We didn't have that. We ate the seed. Next year, we plant less."

  "So we are smaller," Hessa said. "But we are ours. Collapse is just a word the center uses when the edges stop counting for them. You're keeping tally for a ghost, Tori. That's not complexity. That's a habit."

  ***

