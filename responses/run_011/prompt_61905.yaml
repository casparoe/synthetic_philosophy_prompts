  The stylus clicked against the wet clay. Eddu didn't look up when the captain of the garrison walked into the counting house. The dust from the road was still on the man's sandals, red and fine.

  "Thirty jars of oil," Eddu muttered, pressing the wedge for *three*, the wedge for *ten*. "Four ingots. Two bales of graded wool."

  "We aren't taking them," the captain said.

  Eddu paused. The stylus hovered. "The manifest requires—"

  "The High City isn't sending a receiver. The road is closed. We're walking home."

  Eddu looked at the clay. He looked at the captain. There was no anger in the man's face, no sweat of panic. Just the flat expression of a contract terminated. "Who tells the hamlets? Who settles the water dispute in the lower fields?"

  "Someone else. Or no one." The captain turned to the door. "Eat the grain, keeper. It's yours now."

