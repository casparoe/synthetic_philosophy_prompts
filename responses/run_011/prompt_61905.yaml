  The shrine on the ridge had changed. In Eddu's time, the priest had cut the throat of a lamb and burned the thighs for the High King's god. The smoke went up the road.

  Now, the priest roasted the whole animal. The smoke stayed in the valley. The people ate. They were happier. They were also softer. When the raiders came from the next valley over, there was no garrison to blow the horn. The valley fought them off with sickles and stones. They won, but three boys didn't come back.

  Tori recorded the boys. *Names: Kaelen, Joss, Mir. Status: Deceased.*

  He recorded the raiders. *Number: 15. Origin: Unknown.*

  He recorded the grain. *Stored: 400 units. Consumed: 300 units. Sent: 0.*

  Hessa watched him. "Who is that for?"

  "For the boys," Tori said. "So they weren't just lost."

  "They're dead," Hessa said. "The writing doesn't feed their mothers."

  "No," Tori said. "But it proves the mothers had sons."

