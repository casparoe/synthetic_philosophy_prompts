answer: |-
  Dear Colleague,

  It is a pleasure to engage with a question that cuts so precisely to the bone of measurement practice. You have described a structural feature that is ubiquitous in the sciences yet notoriously difficult to pin down philosophically because it sits precisely on the fault line between legitimate ampliative inference and vicious circularity. To answer your primary question directly: there is no single, canonical term in the existing literature that captures this specific configuration of warrant transfer. You are correct to feel that standard labels like bootstrapping, coherentism, or simple extrapolation fail to carve the phenomenon at its joints. Glymour's bootstrapping describes how theory and data mutually confirm one another, but it does not account for the spatial or temporal extension of validity ranges that you are highlighting. Coherentism captures the mutual support but misses the sequential, directional nature of the warrant flow from overlap to non-overlap and back. Even Hasok Chang's work on epistemic iteration, which is perhaps the closest neighbor to your inquiry, focuses on the historical development of scales rather than the logical structure of the warrant transfer itself. Eran Tal's work on calibration models discusses the model-based nature of measurement but does not isolate this specific loop of extending validity to repair the standard. Therefore, I agree with your assessment that stretching these existing terms would obscure the specific mechanism you have identified.

  Since the literature lacks a precise label, I propose we coin the term Calibrational Projection. This term is intended to capture the geometric and epistemic movement you described: the projection of earned reliability from a secured region into an unsecured region, based on the assumption that the relationship between the instrument and the quantity remains stable across the boundary. Calibrational Projection is defined as the inferential move wherein the agreement between two measurement procedures in an overlap region is taken to warrant the reliability of one procedure in a non-overlap region, under the tacit assumption that the functional relationship governing the instrument does not undergo discontinuous change at the boundary of the overlap. This warrant is then considered sufficient to allow the instrument to measure quantities that subsequently validate, extend, or correct the original standard used in the overlap. The crucial element here is not merely the use of the instrument outside its calibrated range, which is simple extrapolation, but the treatment of the outputs in that new range as epistemically weighty enough to loop back and anchor the very standard that licensed the instrument in the first place.

  For Calibrational Projection to be legitimate rather than vicious, three specific conditions must be met. First, there must be a physical justification for the assumption of continuity. This means that the physical quantity being measured and the instrument's response to it must not undergo phase changes, saturation, or structural shifts at the boundary of the overlap. In your thermometer example, this requires knowing that the resistance-temperature relationship remains smooth and monotonic beyond the fixed points. Second, the sources of error in the overlap region must be representative of the sources of error in the extension region. If the instrument fails in the new range due to a mechanism that was inactive or invisible in the overlap, the projection fails. Third, and most critically, the loop must close successfully without contradiction. When the instrument is used to check the standard in the new range, the results must be consistent with the standard's expected behavior within acceptable margins of uncertainty. If the instrument suggests the standard has drifted, but independent checks show the instrument is the one deviating, the projection is revealed as faulty. The legitimacy of the move rests on this risk of failure; if the loop could not theoretically fail, it would be circular. If it can fail but does not, it is ampliative.

  This configuration is demarcated from vicious circularity by the fact that the conclusion is not contained in the premises. In a vicious circle, the reliability of the instrument in the new range would be assumed to prove its reliability in the new range. In Calibrational Projection, the premise is reliability in the overlap, and the conclusion is reliability in the non-overlap. The bridge between them is the assumption of stability, which is an independent empirical hypothesis about the physical world, not a logical tautology. It differs from coherentist mutual support because coherentism typically describes a static web of beliefs supporting one another simultaneously. Calibrational Projection is diachronic and directional; it builds a bridge outwards before bringing support back. It differs from track-record arguments because it does not rely on past success alone but on the structural continuity of the measurement function. A track-record argument says the instrument worked before so it will work again. Calibrational Projection says the instrument works according to a physical law that holds here, so it should work there, and we will use the result there to check if the law holds.

  To locate the edges of this phenomenon, consider a case that superficially resembles it but does not belong. Imagine a mercury thermometer calibrated against water freezing and boiling points at sea level. One then uses this thermometer to measure the temperature of a furnace at one thousand degrees Celsius, assuming the expansion of mercury remains linear. The reading is then used to claim the furnace controller is inaccurate. This looks like Calibrational Projection, but it fails the first condition of physical continuity. Mercury boils at a temperature far lower than one thousand degrees, so the physical mechanism of measurement ceases to function in the extension range. The warrant cannot travel because the vehicle of the warrant—the liquid mercury—no longer exists as a liquid. This is not a legitimate projection but a category error. Another non-example would be using a machine learning model validated on human data from one culture to make judgments about another culture, then using those judgments to claim the model is universal. Here, the assumption of stability across the boundary is sociologically unsupported, and the loop closure is biased because the output is used to define the ground truth rather than test against an independent standard. In genuine Calibrational Projection, the standard in the overlap must have independent anchoring, such as the physical constants defining the fixed-point cells, whereas in the machine learning case, the human judgments are often as fallible as the metric.

  The difference between legitimate and vicious instances is often a matter of degree regarding the robustness of the continuity assumption. In the tree-ring and radiocarbon case, the continuity is biological and physical; rings form annually due to seasonal cycles, a mechanism that is stable over millennia unless there is catastrophic environmental change. The risk is low enough that the projection is accepted. In the resistance thermometer case, the physics of electron scattering in metals is well-understood, making the continuity assumption robust. The key is that the scientists are not merely hoping the instrument works; they are relying on a model of the instrument and the quantity that predicts stability. When that model is strong, the projection is a powerful tool for extending knowledge. When the model is weak or unknown, the projection becomes a gamble that risks collapsing into circularity if the loop is closed too tightly without independent checks.

  I hope this definition and these distinctions provide the conceptual carving you need for your dissertation and your reading group. The phenomenon you have isolated is central to how science expands its reach beyond the immediately accessible, and giving it a name like Calibrational Projection should help prevent it from being dismissed as mere circularity or simple induction. It is a distinct epistemic engine that drives measurement science forward, provided the assumptions of continuity and error stability are rigorously maintained. I look forward to seeing how you develop this in your work.

  Sincerely,

  A Colleague
