  The subjectivist interpretation emerges best placed because it alone legitimizes assigning a probability to a singular, non-repeatable event based on available evidence and prior belief.

  At AeroCast Ltd, turbine blade #042 sits in quarantine. During casting, a sensor glitched; nobody knows if the temperature spiked enough to cause micro-fractures. If fractured, the blade fails catastrophically within 100 hours. The decision is binary: scrap the entire batch of ten blades ($5M loss) or certify them for installation.

  Three pressures constrain the assessment. First, the specific ceramic core mold used for #042 shattered during extraction and was discarded; the exact physical arrangement cannot be reproduced. This eliminates the possibility of re-running the exact conditions. Second, the reference class is ambiguous. Class A includes all blades from this supplier (historical defect rate 0.5%). Class B includes only the ten blades using this new experimental alloy (2 defects observed in 10, rate 20%). Both classes are equally defensible statistically, yet yield vastly different risk profiles. Third, two senior engineers, Alice and Bob, review the identical sensor logs and metallurgy reports. Alice, prioritizing the supplier's long-term reliability, feels the glitch was negligible. Bob, prioritizing the alloy's known instability, feels the glitch was critical. They assign different probabilities purely due to divergent prior weights on the evidence, not new data.

  **Frequentist:** "Probability is long-run frequency. For *this* blade, there is no probability; it is either defective (1) or not (0). To act, I must choose a reference class. If I choose Class A, the risk is 0.005. If Class B, it is 0.20. There is no factual basis to prefer one class over the other without more data, which we cannot generate. I cannot answer the question objectively."

  **Propensity Theorist:** "Probability is the physical tendency of the setup to produce an outcome. The setup existed, so a propensity existed. However, because the mold is scrapped, we cannot test the tendency directly. We must infer it from similar setups. Like the frequentist, I am stuck between the stability of the supplier's general machinery (low propensity) and the volatility of the experimental alloy (high propensity). The single-case probability is real but epistemically inaccessible."

  **Subjectivist:** "Probability is a degree of belief coherent with available information. Alice assigns P(defect) = 0.05; Bob assigns P(defect) = 0.25. Both are rational because they incorporate different priors regarding the supplier versus the alloy. The probability is not 'out there' in the blade; it is a measure of our uncertainty to guide the $5M decision. We calculate expected loss and act."

  The feature prising them apart is the **scrapped tooling (Pressure 1)**. It prevents the generation of new frequency data and blocks direct measurement of physical propensity, leaving the Frequentist without a run and the Propensity theorist without a measurable setup. If the tooling existed and could run another thousand times, the Frequentist would derive a stable frequency, the Propensity theorist would measure the physical chance, and the Subjectivists would update their priors until converging on that frequency. The divergence collapses into empirical consensus, rendering the interpretational debate practically moot.

  Subjectivists charge the objectivists with decision paralysis: denying a number to a singular event forbids expected utility calculations when they are needed most. Frequentists retort that Subjectivists confuse ignorance with probability, offering psychological states rather than objective facts for safety certification. Propensity theorists argue Subjectivists ignore the causal mechanism: belief doesn't change the physical chance that the blade snaps, quantifying confidence rather than risk. Meanwhile, both objectivists dismiss each other's reliance on unobservable frequencies or unmeasurable tendencies.
