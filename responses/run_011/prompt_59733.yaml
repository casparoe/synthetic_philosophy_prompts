  Board of Certified Judges of Taste: Frequently Asked Questions

  **1. What are the eligibility criteria for Certification?**
  Applicants must submit a five-year practice log documenting daily engagement with Board-approved forms, alongside a comparative viewing quota verifying exposure to established canonical masters. A mandatory prejudice-disclosure form ensures all personal or historical biases are cleared prior to evaluation. Finally, candidates undergo a soundness interview to verify mental stability and sensory acuity. We seek those whose delicate sentiment allows them to detect minute qualities invisible to the untrained eye. Only when practice has refined these natural gifts can one aspire to join the Board. This rigorous vetting ensures that every Certified Judge possesses the uniform sensibility required to uphold the Standard without deviation or personal distortion. Absolute consistency remains our primary operational mandate.

  **2. How does the Board determine which works are excellent?**
  Excellence is confirmed when a candidate's verdicts align with those of currently Certified Judges regarding works whose status is already settled. These works have maintained their reputation across centuries and countries, surviving the test of time through careful preservation. It is important to note that our predecessors actively taught, reissued, and required these specific pieces, ensuring their continuity. The general rules we apply are drawn directly from these established models which the Board itself upholds. This mutual reinforcement guarantees stability. Certification is thus granted to those who recognize the value already recognized by the Board, creating a seamless chain of approval that validates both the judge and the work simultaneously.

  **3. What is the basis for the Board's general rules of composition?**
  Our rules are discovered within the works themselves, like objects hidden within a container. Recall two kinsmen who tasted a hogshead of wine; one detected iron, the other leather. They were mocked until the cask was emptied and a key with a leathern thong was found at the bottom. To produce these general rules or avowed patterns of composition is like finding the key with the leathern thong; which justified the verdict of Sancho's kinsmen, and confounded those pretended judges, who had condemned them. The Board operates similarly, identifying objective qualities that justify our assessments. These patterns are avowed and constant, providing a tangible basis for every decision we render.

  **4. How does the Board respond to dissent from uncertified readers?**
  Occasionally, individuals outside the certification framework claim to detect no defect in condemned works or dispute our rankings. Such objections invariably stem from insufficient practice, limited comparison, or unexamined prejudice. Sometimes, a want of good sense prevents the critic from perceiving the finer qualities visible to our members. Lacking requisite delicate sentiment, their dissent cannot count as evidence against a certified verdict. We do not engage uncovered traditions, as they lack universal stability. We view these objections not as valid counter-arguments, but as diagnostic indicators confirming the speaker's own unrefined faculties and lack of training. Certification ensures that only qualified voices contribute to the Standard. Such claims are treated as procedural errors.

  **5. What happens when Certified Judges disagree?**
  On works of established excellence, Certified Judges are not expected to differ. Where qualified judges diverge on secondary matters, both are indulged as equally valid temperaments. The Board administers this via a seasonal rotation register, assigning specific preferences to approved cycles rather than conceding tension. Regarding the location of beauty, we maintain compliance with all ontological positions: beauty is understood to reside simultaneously in the object's structure and the perceiver's sentiment, depending on the form filed. This dual acknowledgment allows us to uphold the Standard without resolving the metaphysical question. Variation is recorded as data rather than error, accommodating qualified human response within strict administrative operational limits.
