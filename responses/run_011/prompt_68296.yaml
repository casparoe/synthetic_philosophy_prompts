answer: |-
  ### Rejected Step

  Step 1 is the load-bearing flaw. It asserts a 'comparative account of harm': an act wrongs someone only if it leaves them worse off than they would otherwise have been. Step 8 is a secondary defensive trench, denying that collectives can be wronged to block impersonal duties. The argument holds together logically if you accept Step 1; the trouble is not internal inconsistency, but that Step 1 is false in cases where the alternative is non-existence. Step 2 (identity dependence) is contingent biology; if false, the argument collapses into standard harm modelling. But even if Step 2 is true, Step 1 fails to capture wrongs that aren't comparative. Step 8 is a separate mistake, denying collective subjects to save the theory from impersonal obligations.

  ### Diagnosis

  Having surveyed steps 1–9, the slip is in Step 1, but it is masked by ordinary usage. In 99% of moral cases, the people involved exist in both the actual and alternative scenarios. The 'pull' comes from conflating 'worse off than before' with 'wronged'. We rarely encounter choices that change *who* exists, so the comparative principle works unnoticed. Step 2 does significant work as a trigger: if future people were chosen from a fixed pool (Step 2 false), high emissions would make them worse off than they would otherwise be, and Step 1 would condemn the policy. But hanging policy on biological contingency is weak. Step 1 looked fine because it matches ordinary harm talk, but it breaks when existence itself is the variable. Step 8 is a separate error, attempting to block the 'future generations' claim by denying them subjecthood, which is ad hoc.

  ### Pricing

  If you keep Step 1, you must accept the Barrel Case result: burying the canister wrongs no one, because the victims wouldn't otherwise exist. You also indemnify the past (the Backwards Run). This is too high a cost. Abandoning Step 1 requires a 'non-comparative account' of harm: some acts are wrong because of what they do to people (maiming, killing), not because of the counterfactual baseline. The cost is complicating ordinary negligence law, which leans on comparative baselines. You need a hybrid view: comparative for most things, non-comparative for existence-affecting choices. The economist can keep his conclusion only by insisting Step 2 is false (policy doesn't change identity), which is empirically weak for 2200, or by retreating to Step 9 being about 'justice' specifically, claiming other values matter.

  ### Two Test Cases

  The Backwards Run and the Barrel Case fail for the same reason (Step 1), but the Barrel Case is clearer. Killing or maiming is intrinsically bad, regardless of whether the victim would otherwise exist. This pushes us toward a non-comparative view: harm as violating rights or setting back interests, not just lowering a welfare baseline. The Backwards Run adds complexity about causal chains and entitlements, but the core logic is identical. Step 8 is distinct: even if individuals aren't wronged (Step 7), a 'generation' might be. Denying this is a category error to save the theory. The Barrel Case passes only if we accept that some acts are wrong regardless of the alternative, which forces us to reject Step 1 and save the intuition that burying the canister is unjust.
