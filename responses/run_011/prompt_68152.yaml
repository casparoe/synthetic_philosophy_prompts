answer: |-
  Your account of democratic legitimacy is compelling in its rejection of static foundationalism, and it captures something vital about the adaptive capacity required of modern states. However, I must take a definite position: while the experimental cycle is a necessary condition for legitimate administration, it is insufficient as a complete theory of political legitimacy, and in its strong form, it is dangerous. The view is too insulated against failure, it cannot account for the normative weight of irreversible harms, and it misunderstands the political nature of the criteria it claims to treat as methodological. I will argue that the insulation charge is a genuine defect, that the problem of irreversibility is fatal unless conceded, and that there are specific institutional cases where the machinery of revisability legitimises harm more effectively than fixed prohibitions would.

  Let us begin with the charge of insulation, for if this holds, the rest of the critique is moot. You argue that legitimacy attaches to the experimental cycle, implying that if a policy fails, the remedy is better experimental design. The danger is that any failure can be redescribed as a failure to frame the hypothesis properly, identify the right public, or set the right criteria. If this move is available in every case, the view risks nothing and therefore claims nothing. I judge this insulation to be a genuine defect. A non-question-begging way of specifying what would show the view false is this: a case where the existence of the review mechanism itself reduced the political cost of persistence so effectively that harm was prolonged beyond what a fixed rule would have allowed. If the experimental machinery acts as a legitimising ritual rather than a corrective tool, the theory is falsified. I will return to a concrete instance of this shortly, but the mere possibility that the mechanism could function as a pacifier rather than a probe suggests the theory is not self-correcting in the way you hope. A committed defender of your persuasion would likely attempt to explain this away by arguing that the public failed to organise or the criteria were captured by interest groups. I contend this is an evasion. If the theory relies on a public that does not materialise or criteria that cannot be protected from capture, the theory is describing an ideal type, not a workable mechanism of legitimacy.

  This leads us to the ranked defeaters. The most fatal defeater is the problem of irreversibility. You state that reversal must be cheaper than persistence, but some consequences are not reversible. Human death, ecological tipping points, and the erosion of fundamental trust cannot be undone by a sunset clause. A committed defender might concede this is damaging but argue that such domains should be excluded from experimentation. I argue this concession destroys the universality of the claim. If some domains require fixity, then fixity is not the central political evil; rather, the evil is fixity in the wrong places. The view seems unable to describe domains where feedback is so slow or confounded that a policy cannot be evaluated within a human timeframe, such as climate engineering or nuclear waste storage. To treat these as experiments is to gamble with subjects who cannot consent to the reversal. Here, the contractualist rival predicts that legitimacy bottoms out in reasons no one could reasonably reject, which provides a shield against being used as a subject in a high-stakes experiment. Your view predicts that such shielding is an illegitimate foreclosure of inquiry. History suggests the contractualist prediction is safer; treating human rights as revisable hypotheses has historically legitimised their violation in the name of social utility.

  The second fatal defeater is the political nature of the criteria. You assume criteria of success can be stated in advance and in public, implying a neutrality that does not exist. Deciding what counts as success is itself a substantive conception of the good. If a policy aims to increase economic growth, the criteria will favour capital; if it aims to increase equality, the criteria will favour redistribution. The experimental idiom launders this substantive choice as a methodological one. A defender would explain this away by saying the public inquiry determines the criteria. But this begs the question of who constitutes the public and whose consequences count. The agonist rival, who thinks politics concerns the constitution of friends and enemies, predicts that these criteria will always be sites of struggle, not neutral markers for inquiry. Where your view predicts that agreeing on criteria allows politics to proceed as problem-solving, the agonist predicts that the struggle over criteria is the politics. In cases of deep moral disagreement, such as abortion or euthanasia, the experimental model breaks down because the parties cannot agree on what constitutes a successful outcome, only that the other side is wrong. Your view predicts this stalemate is a failure of inquiry; the agonist predicts it is the natural state of politics. The latter description fits the empirical reality of polarised societies better.

  A serious, though perhaps not fatal, defeater is the problem of emergencies. You require inquiry and stated criteria, but emergencies require decision before inquiry can conclude. A defender would concede this is awkward but argue that emergency powers should themselves be subject to the experimental cycle with strict sunset clauses. This brings us to the actual case I promised, which demonstrates why this defence fails. Consider the use of sunset clauses in counter-terrorism legislation, such as the USA PATRIOT Act or the UK's Prevention of Terrorism Acts. The machinery of pre-stated criteria and cheap reversal was present; the powers were granted temporarily, subject to review. In practice, the review mechanism demonstrably made things worse than a fixity-preserving institution would have. The periodic renewal became a ritual of legitimation. Because the powers were framed as a revisable hypothesis subject to oversight, the political cost of persistence was lowered; legislators could vote for renewal while claiming they were exercising scrutiny. The criteria for success, typically the absence of attacks, were easily met by the secrecy of the security apparatus. A fixed prohibition on certain surveillance powers, a form of fixity, would have preserved liberty more effectively than the experimental framework which normalised the exception. The experimental machinery did not make reversal cheaper; it made persistence legitimate. This is a case where your view predicts that revisability protects against tyranny, but the outcome was the entrenchment of power through the guise of review.

  There are merely awkward defeaters as well, such as the need for stability in economic planning. If policies are constantly treated as hypotheses, investment and long-term social planning become risky. A defender would explain this away by distinguishing between strategic fixity and tactical experimentation. This is plausible but requires a distinction your current formulation does not make. If legitimacy attaches to the experimental cycle, then long-term commitments look illegitimate. The epistemic democrat, who thinks majorities track the truth, predicts that stable mandates allow for the implementation of complex programmes that iterative tweaking disrupts. Where your view predicts that iterative learning yields better outcomes, the epistemic democrat predicts that consistency yields better coordination. In the rollout of large-scale infrastructure or welfare reform, the 'agile' policy approach often creates uncertainty that harms the very people the policy is meant to help.

  Regarding the irreversibility problem, I must offer an answer that does not retreat to traceability. The only robust answer is to admit that the experimental account must be bounded by a non-experimental foundation. There must be a category of rights and constraints that are not open to hypothesis testing. You argue that the central political evil is fixity. I argue that the central political evil is the violation of agency, and sometimes agency is best protected by fixity. If I know I cannot be experimented upon without my consent, I am free to participate in the inquiry. If I am potentially a subject of a policy hypothesis, my participation is coerced by the risk. Therefore, the view must concede that legitimacy requires a hybrid structure: experimentalism within a framework of fixed constitutional constraints. Without this, the view is vulnerable to the charge that it is a technocratic justification for imposing costs on the vulnerable in the name of learning.

  In sum, the insulation is a genuine defect because it allows the theorist to blame every failure on the implementation of the method rather than the method itself. The view is falsified by instances where review mechanisms legitimise persistence, as seen in counter-terrorism law. The irreversibility problem is fatal unless you concede that some domains are off-limits to experimentation, which undermines the claim that fixity is the central evil. Your rivals predict that conflict over criteria is ineradicable and that rights must be trumps rather than hypotheses; on these points, their predictions align better with the history of liberal democracy. You should retain the experimental cycle as a guide for administration and policy adjustment, but you must abandon it as the sole source of legitimacy. Legitimacy requires not just the capacity to learn from error, but the assurance that some errors will not be permitted even as hypotheses. Without that assurance, the public cannot trust the inquiry enough to participate in it, and the cycle collapses into a series of impositions dressed up as experiments.
