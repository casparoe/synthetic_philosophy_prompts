prompt: |-
  I'm writing a seminar paper on the 1996 US welfare reform and I want to try a lens that isn't in any of our readings, so tell me if it holds up. The facts as I have them: AFDC gets replaced by TANF, block grants to states, work requirements, a five-year lifetime limit, and financial penalties on states that don't hit their participation rates. Caseloads then fall by more than half over the next decade, and the "leavers" studies find a bunch of people who left the rolls without stable employment — some with no earnings and no benefits at all.

  The usual framing is incentive-based: make benefits conditional on working and people work. But I want to read the same machinery as a screening device instead. Compliance is costly, the cost of complying isn't the same for everyone, so who's left on the rolls is fixed by who can absorb the cost — which means the caseload drop might be the screen working rather than the incentive working.

  So: set the model up properly — who's the principal, who's the agent, what's the signal, what type is supposed to get sorted out. Then where does the screening story break, especially on whether it sorts on the trait the deserving/undeserving language claims to track? And does the episode end up confirming, wrecking, or just outrunning the model?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** 1996 US Welfare Reform (PRWORA), specifically the shift from AFDC to TANF.
      *   **Core Argument:** The user wants to move away from the standard "incentive-based" framing (work requirements make people work) to a "screening device" framing (compliance costs filter people out).
      *   **Specific Tasks:**
          1.  Evaluate if this lens holds up.
          2.  Set up the principal-agent model properly (Principal, Agent, Signal, Type).
          3.  Identify where the screening story breaks (especially regarding "deserving/undeserving" traits).
          4.  Determine if the episode confirms, wrecks, or outruns the model.
      *   **Constraint:** The user wants a lens *not* in their readings (implies standard econ/poli-sci readings usually focus on labor supply incentives).
      *   **Tone:** Academic, analytical, critical, helpful for a seminar paper.

  2.  **Deconstruct the "Screening" Lens:**
      *   *Standard Incentive Model:* Benefit $B$, Cost of Work $C_w$. If $B > C_w$, stay on welfare. If wage $w > B$, work. Reform lowers $B$ (via time limits/sanctions) or raises $C_w$ (via requirements), making work relatively more attractive.
      *   *Screening Model:* Benefit $B$. Cost of Compliance $C_c$ (paperwork, meetings, drug tests, work search). Individuals have private information about their "employability" or "need." The state wants to give money only to the "truly needy" (or conversely, wants to reduce rolls regardless of need). High $C_c$ deters those with high opportunity costs of time or low administrative capacity.
      *   *Fit:* This fits the "leavers" studies well. If people leave without jobs, the incentive model fails (why leave if no job?). The screening model explains this: the cost of staying became higher than the benefit, even without a job alternative.

  3.  **Drafting the Model Setup (Principal-Agent-Signal-Type):**
      *   *Principal:* The Federal/State Government (designing the policy).
      *   *Agent:* The Welfare Applicant/Recipient.
      *   *Private Information (Type):* This is crucial. What is being screened?
          *   *Standard Theory:* "Deservingness" (unable to work vs. able but unwilling).
          *   *User's Hypothesis:* "Administrative Capacity" or "Compliance Cost Tolerance."
      *   *Signal/Action:* Completing paperwork, attending appointments, meeting work hours, avoiding sanctions.
      *   *Mechanism:* The policy imposes a compliance cost ($K$). If $K > Benefit$, the agent exits.
      *   *Sorting:* Ideally, sorts "lazy" (high cost of effort?) from "needy." Actually, sorts "high administrative capacity/stable life" from "chaotic life/high barriers."

  4.  **Critiquing the Model (Where it Breaks):**
      *   *The "Deserving" Mismatch:* The rhetoric was about sorting the "unwilling" from the "unable." The reality seems to be sorting the "organized/stable" from "chaotic/barrier-ridden."
      *   *Principal's Objective:* Did the Principal *actually* want to screen for need? Or did they want to reduce caseloads *period*? If the goal was fiscal reduction, the screen worked perfectly. If the goal was poverty alleviation for the deserving, it failed.
      *   *Dynamic Inconsistency:* Time limits aren't a screen; they are a cliff. A screen usually allows you to prove type continuously. A hard limit cuts off regardless of type.
      *   *Sanctions:* Sanctions act as a stochastic penalty. This screens for risk aversion and bureaucratic literacy, not just work ethic.

  5.  **Evaluating the Outcome (Confirm, Wreck, Outrun):**
      *   *Confirm:* It confirms that compliance costs drive caseload reduction (diversion programs, paperwork burdens).
      *   *Wreck:* It wrecks the *moral* justification (that it sorts work-shy from unable).
      *   *Outrun:* The political economy aspect outruns the simple micro model. The block grants created a fiscal incentive for states to screen *out* everyone, not just the undeserving.

  6.  **Synthesizing the Argument for the User:**
      *   *Validation:* Yes, this is a strong, underutilized lens. It aligns with "administrative burden" literature (Moynihan, Soss) but applies it specifically to the 1996 reform mechanics.
      *   *Model Construction:* Define the variables clearly.
      *   *The Twist:* The "Type" being screened isn't "willingness to work," it's "capacity to navigate bureaucracy."
      *   *The Break:* The model breaks on the *intent*. If the state's utility function was "reduce spending," the screen worked. If it was "help the needy," it failed.
      *   *Literature Connection:* Mention "Administrative Burden" and "Take-up rates" to give the user academic anchors without using their specific readings.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Correction:* Make sure not to confuse "screening" with "signaling." In screening, the uninformed party (state) sets the trap. In signaling, the informed party (applicant) sends a message. 1996 Reform is definitely *screening* (state sets rules).
      *   *Nuance:* Acknowledge that some incentive effect *did* happen (EITC expansion coincided). Don't claim 100% screening, but argue it's the dominant explanation for the *non-employed leavers*.
      *   *Key Insight:* The "Five-Year Limit" is not a screen; it's a quota. The "Work Requirements/Sanctions" are the screen. Distinguish these.

  8.  **Final Polish:** Structure the response logically: Validation -> Model Setup -> The Break/Conflict -> Conclusion on the Model's Fate. Ensure the tone is encouraging but rigorous. (This matches the "seminar paper" context).

  **(Self-Correction Note):** I need to make sure I don't just say "good idea." I need to stress-test it as requested. The prompt asks: "Tell me if it holds up." I need to be critical.
  *Critical Point:* A screening model usually implies the Principal *wants* to identify the Type. Did the Principal want to identify the needy? Or did they want to exclude them? If the latter, it's not a screening model for *allocation*, it's a screening model for *exclusion*. This is a vital distinction.

  9.  **Finalizing the Response Structure:**
      1.  **Verdict:** Strong lens, aligns with "administrative burden" lit.
      2.  **Model Setup:** Principal (State), Agent (Recipient), Type (Barrier/Compliance Cost), Signal (Compliance).
      3.  **The Mismatch:** Screen sorts on *capacity*, not *deservingness*.
      4.  **The Fiscal Incentive:** Block grants change the Principal's motivation (cost-shifting).
      5.  **Conclusion:** The model holds descriptively but wrecks the normative justification.

