answer: |-
  Here is the specification for a decision theory capable of handling undefined expected value (EV), structured by requirement, motivation, and negotiability, followed by the impossibility result and a scorecard of current approaches.

  ### The Spec: Requirements for Undefined EV

  To count as an adequate account, a decision theory must satisfy the following constraints. I have divided them into **Non-Negotiable** (violating these renders the theory irrational or useless) and **Contingent** (violating these merely places the theory in a specific philosophical camp).

  #### 1. Extensionality (The Boring End)
  *   **Requirement:** When a gamble has a well-defined, finite expected value under standard Kolmogorov integration, the theory must return that value.
  *   **Motivation:** If a new theory contradicts standard probability theory on simple, finite, or absolutely convergent cases, it is broken by definition. It must be a proper extension, not a replacement.
  *   **Status:** **Non-Negotiable.**

  #### 2. Symmetry Consistency (The Mirror Game)
  *   **Requirement:** If two gambles are isomorphic under a measure-preserving transformation of the state space, they must be assigned equal value. Specifically, in the Mirror Game, the theory must validate the intuition that the value is 0 (or at least that the two branches are equally valuable), despite the divergence of positive and negative parts.
  *   **Motivation:** Case 1. The setup is explicitly symmetric. The "outer coin" creates a probability space where the positive and negative contributions are perfectly balanced. A theory that yields a non-zero value here is sensitive to the *description* of the states rather than the *structure* of the risk.
  *   **Status:** **Non-Negotiable.** (Unless one adopts a radical subjectivism where value is created by the agent's framing, but for an objective account of the gamble, this is hard.)

  #### 3. Statewise Dominance (The Mirror-Plus-One)
  *   **Requirement:** If Gamble $A$ yields a strictly higher utility than Gamble $B$ in every possible state of the world, then $A$ must be strictly preferred to $B$.
  *   **Motivation:** Case 2. Mirror-Plus-One pays exactly $1 more than Mirror in every outcome. Even if the absolute value of Mirror is undefined, the *difference* between them is a constant $1$. A theory that says these are incomparable, or equal, violates the most basic notion of rational preference.
  *   **Status:** **Non-Negotiable.** (Note: This is where many infinite ethics theories break. Some sacrifice dominance to preserve additivity, but for a decision theory guiding an agent, dominance is paramount.)

  #### 4. Dynamic Consistency (The Truncation)
  *   **Requirement:** The theory must not permit a money pump based on the order of evaluation. An agent cannot be led through a sequence of trades, each deemed "acceptable" or "neutral" by the theory, that results in a sure loss.
  *   **Motivation:** Case 3. If the theory resolves undefined EV by truncating the series at $N$, and the value depends on $N$ or the ordering of terms, a bookie can exploit the gap between your truncation method and the actual payoff structure. If you accept a trade based on a Principal Value approximation, but the actual payout follows a different summation order, you lose.
  *   **Status:** **Non-Negotiable.** (A decision theory that allows sure-loss cycles fails to guide action.)

  #### 5. Action Guidance
  *   **Requirement:** The theory cannot declare all undefined-EV gambles incomparable with all other gambles.
  *   **Motivation:** If the theory collapses into "everything unbounded is incomparable," it ceases to be a decision theory and becomes a skepticism engine. It must be able to tell a bounded agent whether to take the bet or leave it.
  *   **Status:** **Non-Negotiable.**

  #### 6. Representational Format (The Number System)
  *   **Requirement:** The value of a gamble must be representable as a Real number ($\mathbb{R}$).
  *   **Motivation:** Standard utility theory assumes an Archimedean field.
  *   **Status:** **Contingent.** (This is a prior. One can use Hyperreals, Surreals, or Interval Values. Insisting on $\mathbb{R}$ is what forces the "undefined" verdict in the first place. If you allow non-Archimedean numbers, the EV might exist, just not in $\mathbb{R}$.)

  #### 7. Total Ordering
  *   **Requirement:** For any two gambles $A$ and $B$, either $A \succeq B$ or $B \succeq A$.
  *   **Motivation:** Standard rationality axioms (Completeness).
  *   **Status:** **Contingent.** (Forcing a total order on undefined-EV gambles often requires arbitrary tie-breaking rules that violate Symmetry or Dominance. A partial order is a valid, perhaps necessary, concession.)

  ---

  ### The Impossibility Result

  Your hunch is correct, but the culprit is not just bounded utility; it is the interaction between **Summation Invariance** and **Dominance** in the presence of **Conditional Convergence**.

  There is a jointly unsatisfiable subset here. You cannot simultaneously satisfy:
  1.  **Statewise Dominance** (Case 2)
  2.  **Symmetry/Permutation Invariance** (Case 1)
  3.  **Linearity/Additivity** (Standard EV behavior)
  4.  **Existence** (Every gamble has a value)

  **Why?**
  The Pasadena/Mirror scenarios rely on conditionally convergent series. By the Riemann Rearrangement Theorem, you can reorder the terms of a conditionally convergent series to sum to any real number, or diverge.
  *   To satisfy **Symmetry** (Case 1), you must treat the positive and negative terms as balanced (sum = 0).
  *   To satisfy **Dominance** (Case 2), you must acknowledge that adding $1$ to every term shifts the value.
  *   To satisfy **Linearity**, the value of the sum must equal the sum of the values.

  If you fix a summation method (like Principal Value) to make the EV exist, you violate **Permutation Invariance** (because a different grouping of states yields a different sum). If you allow the value to depend on the grouping, you violate **Dynamic Consistency** (Case 3), because a bookie can force the grouping.

  **The Bounded Utility Move:**
  Bounded utility functions dissolve the problem by making these gambles impossible to construct. If utility is bounded, the series becomes absolutely convergent (dominated by the bound), and EV always exists.
  *   *Cost:* It violates the **Ontological Prior** that rational agents can care about unbounded quantities (e.g., number of lives saved, duration of happiness). It solves the math by changing the metaphysics of value.

  ---

  ### Scorecard of Approaches

  Here is how the major contenders stack up against the Spec.

  | Approach | Case 1 (Mirror) | Case 2 (Mirror+1) | Case 3 (Truncation) | Non-Negotiable Failures |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard EV** | **Undefined.** Refuses to judge. | **Undefined.** Cannot register dominance. | **N/A.** | Fails **Action Guidance**. Fails **Dominance**. |
  | **Principal Value (Truncation)** | **0.** (Symmetric limit). | **1.** (Shifts correctly). | **Vulnerable.** If bookie knows your $N$, they can construct a payout order that exploits the difference between your limit and the actual sum. | Fails **Dynamic Consistency**. Order-dependence allows money pumps. |
  | **Relative Expected Utility (REU)** | **Comparable to 0.** Evaluates differences, not absolutes. | **Strictly Better.** Difference is defined ($1). | **Robust.** Focuses on pairwise differences which often converge even when absolutes don't. | Fails **Action Guidance** (sometimes). Can tell you $A > B$, but not if $A > 0$ (take the bet vs. status quo). |
  | **Hyperreal / Non-Archimedean** | **Infinitesimal or 0.** Assigns a specific infinite number to the sum. | **Strictly Better.** The infinite parts cancel, leaving the finite $1 difference. | **Robust.** The summation is defined within the hyperreal field; reordering doesn't change the hyperreal sum if the sequence is fixed. | Fails **Real Number Rep**. Requires accepting non-standard analysis as normative for utility. |
  | **Bounded Utility** | **Defined.** Utility caps out, series converges absolutely. | **Defined.** Dominance holds. | **Robust.** No divergence possible. | Fails **Ontological Prior**. Denies the possibility of the gambles existing as described. |
  | **Incomparability (Partial Order)** | **Incomparable to 0.** | **Comparable.** Dominance forces a relation. | **Robust.** Refuses to trade where value is undefined. | Fails **Action Guidance**. Too many gambles become "no fact of the matter." |

  ### Summary for the Chapter

  If you want to preserve **Dominance** and **Dynamic Consistency** (the core rationality constraints), you have two viable paths, both of which require biting a bullet:

  1.  **Accept Partial Orders (REU style):** Admit that absolute value is undefined for these gambles, but *relative* value is often defined. You can say Mirror+1 is better than Mirror, but you cannot say Mirror is better than $0. This preserves rationality but sacrifices complete action guidance.
  2.  **Accept Non-Archimedean Values (Hyperreal style):** Admit that utility values are not Real numbers. This allows the EV to exist mathematically, preserving Symmetry and Dominance, but requires a radical overhaul of the representation theorem.

  **The Verdict:** The "Truncation" view is the weakest; it tries to keep Real numbers and Total Ordering but sacrifices Dynamic Consistency. **Bounded Utility** is the most robust mathematically but the most revisionary philosophically. **Relative Expected Utility** is the best compromise for keeping standard ontology while salvaging rational choice, provided you can live with incomparability against the status quo.
