      *   Address the "Bounded Utility" hunch. (It solves the math by changing the ontology of utility).

  10. **Self-Correction during drafting:**
      *   *Correction:* I initially thought about calling Dominance non-negotiable. But in infinite contexts, "Statewise Dominance" is actually quite controversial (e.g., Two Envelopes paradox variants). However, for *this* specific prompt (Mirror vs Mirror+1), it feels non-negotiable. I will label it "Core Rationality" but note the infinite-state caveat.
      *   *Correction:* The user asked about "Real numbers." I need to be explicit that moving to Hyperreals is a major ontological shift, hence "Contingent."
      *   *Correction:* The "Truncation" case is essentially about the *order of summation*. A theory must specify a canonical ordering or admit it's arbitrary. If arbitrary, it's vulnerable.

