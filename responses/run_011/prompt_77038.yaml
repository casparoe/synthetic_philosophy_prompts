  2.  **Deconstruct the Cases:**
      *   *Case 1 (Mirror Game):* Symmetry suggests Value = 0. Standard EV is undefined (Riemann rearrangement theorem applies). Motivation: Symmetry/Equivalence principle.
      *   *Case 2 (Mirror-Plus-One):* Dominance. $G_2(\omega) = G_1(\omega) + 1$. If $G_1$ is permissible, $G_2$ must be strictly preferred. Motivation: State-wise Dominance.
      *   *Case 3 (Truncation/Money Pump):* If you approximate via truncation, you are vulnerable to dynamic inconsistency or money pumps if the truncation point is known/exploitable. Motivation: Dynamic Consistency/No Money Pumps.
      *   *Boring End:* Must agree with standard EV when EV exists. Must not declare *all* unbounded gambles incomparable (needs to guide action).

  3.  **Drafting the Requirements (The "Spec"):**

      *   *Req 1: Extensionality.* Must agree with standard EV when it exists. (Non-negotiable).
      *   *Req 2: Symmetry/Equivalence.* Case 1. If two gambles are isomorphic via a measure-preserving transformation (like the coin flip), they should be valued equally. (Strong intuition, but maybe contingent on how one views state descriptions). Let's call it "Symmetry Consistency."
      *   *Req 3: Dominance.* Case 2. If $A(\omega) > B(\omega)$ for all $\omega$, then $A \succ B$. (Non-negotiable for most, but tricky with infinite states).
      *   *Req 4: Dynamic Consistency.* Case 3. Cannot be money-pumped via truncation strategies. (Non-negotiable for agency).
      *   *Req 5: Action Guidance.* Must not collapse into universal incomparability. (Non-negotiable for a *decision* theory).
      *   *Req 6: Representation.* Does value need to be a real number? (Contingent). Does ordering need to be total? (Contingent).

  4.  **Analyzing "Non-Negotiable" vs. "Contingent":**
