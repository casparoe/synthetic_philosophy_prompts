      *   *Impossibility:* The core tension is between *Summation Invariance* (order shouldn't matter) and *Dominance*. If you fix the order to make the sum exist (Principal Value), you violate Summation Invariance (Case 1 grouping). If you allow any order, you violate Dominance (Case 2).
      *   *Wait, check Case 2:* If EV is undefined, how do we register "better"? REU says the *difference* has a defined EV (it's 1). So REU handles Case 2 well. But REU struggles with Case 1 (is the difference between Mirror and 0 defined?).
      *   *Check Case 3:* If you use Principal Value (symmetric truncation), you get 0 for Mirror. But if I offer you a trade based on a non-symmetric truncation, you might accept. This is the money pump.

  9.  **Final Polish:**
