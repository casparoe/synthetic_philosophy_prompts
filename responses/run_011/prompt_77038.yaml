      *   *Symmetry:* The Mirror Game relies on the idea that the label of the outcome shouldn't matter. *Verdict: Non-Negotiable (given the setup).*
      *   *Dynamic Consistency:* If a theory allows a money pump, it fails as a guide for temporally extended agents. *Verdict: Non-Negotiable.*

  5.  **Identifying Impossibility/Tensions:**
      *   The user hints: "my hunch is bounded utility does most of the damage."
