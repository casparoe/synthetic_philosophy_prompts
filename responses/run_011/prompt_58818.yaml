answer: |-
  This is a high-stakes talk because you are challenging the clinical intuition of the people who actually test and treat these patients. Your "Channel-Restriction View" is philosophically robust but empirically risky in this room. They deal with the *dissociations*; you are asking them to ignore the dissociations as evidence of *division*.

  Here is your Q&A prep sheet, ordered by the potential damage to your thesis.

  ### The Q&A Prep Sheet

  **1. The "Intermanual Conflict" Objection (Neuropsychologist)**
  *   **The Question:** "You say there's one stream of action selection. But in the tactile matching tasks, we see the left hand unbutton a shirt the right hand just buttoned. The hands are working at cross-purposes in real-time. If there's one subject, why is the motor output fighting itself? That looks like two controllers, not one controller with bad routing."
  *   **Your Reply:** "It looks like two controllers, but notice the resolution. In almost every case, one hand eventually stops or the patient verbally intervenes to stop the 'alien' hand. If there were truly two subjects, we'd expect a stalemate or a negotiated treaty, not a unilateral override. The conflict is real, but the *adjudication* is unitary. The left hand isn't a rival agent; it's a subsystem that temporarily lost top-down inhibition because the 'brake' signal couldn't cross the midline. The fact that the patient reports this as *their* hand acting strangely, rather than *someone else's* hand, supports the single-subject view."
  *   **The Soft Spot:** You are relying on the *resolution* of conflict to prove unity, but the *existence* of the conflict is what motivated the two-minds view in the first place. If the motor systems can sustain opposition for minutes, your "single stream of action selection" premise looks empirically false during that window.

  **2. The "Cohort Validity" Objection (Epilepsy Surgeon)**
  *   **The Question:** "Most of the data you're citing is from the Sperry/Gazzaniga era—patients from the 70s and 80s. We rarely do complete commissurotomies now, and when we do, the 'split' symptoms are far less dramatic. Many of our complete-cut patients show almost no intermanual conflict. Are you building a metaphysical theory on a historical artifact? If the syndrome is fading, maybe the 'one mind' view is just right for modern patients, but wrong for the classic cases you're analyzing."
  *   **Your Reply:** "That's a crucial clinical point, and I concede the classic cohort is small and medically distinct. However, the 'fading' of symptoms actually helps my case. If the callosum is cut and unity remains, it suggests the brain compensates via subcortical routes or cross-cueing. My argument is that even in the *most* severe classic cases, where disconnection was maximal, the patients never reported *being* two people. If the two-minds view were true, the classic patients should have reported a doubling of self. They didn't. They reported confusion. So whether the symptoms are severe or mild, the phenomenological unity holds."
  *   **The Soft Spot:** You are hedging. If the classic data is unreliable (as modern surgeons suspect), your empirical foundation is shaky. You need the classic data for the strong dissociation effects, but the surgeon is telling you that data might be an outlier.

  **3. The "Integration Metric" Objection (Computational Neuroscientist)**
  *   **The Question:** "From a network perspective, 'subjecthood' usually maps to integrated information. If you sever the main highway, causal density drops. You're defining the subject by the *output* (behavior/report), but I define it by the *architecture*. If the network can't integrate information across the midline, functionally you have two clusters. Why should I care about the 'perspective' if the causal structure is bifurcated?"
  *   **Your Reply:** "Because causal structure doesn't map one-to-one onto phenomenology. We see this in anesthesia: integration drops before consciousness vanishes. My claim is that 'subject' isn't a measure of bandwidth; it's a measure of *ownership*. A computer with a severed ethernet cable is still one computer, even if it can't access the server. The brain's architecture is fragmented in many ways (modularity) without creating new subjects. The callosal cut is just a severe fragmentation of access, not a fragmentation of the 'user' running the system."
  *   **The Soft Spot:** **See "Hidden Assumption" below.** You are asserting that architecture doesn't determine ontology. To a computationalist, function *is* ontology. You haven't argued why the "user" metaphor survives the physical severing of the "hardware" that supports it.

  **4. The "Subcortical Unity" Objection (Epilepsy Surgeon / Neuropsychologist)**
  *   **The Question:** "We know the anterior commissure and subcortical pathways often remain intact. Couldn't the unity you're describing just be sustained by those subcortical connections? If so, it's not a 'routing failure' in a single subject; it's a 'partial connection' between two hemispheres that are kept in sync by the brainstem. Doesn't that make the hemispheres the primary units, not the whole brain?"
  *   **Your Reply:** "If subcortical pathways were doing the heavy lifting for unity, we wouldn't see the lateralized deficits we do. The patients *can't* name left-field stimuli. The subcortical routes aren't transmitting conscious content; they're transmitting arousal or timing signals. My view is that the 'subject' rides on the whole system, but the *information access* is bottlenecked. The subcortical paths keep the engine running, but they don't provide the data the speech center needs to tell the story."
  *   **The Soft Spot:** If subcortical paths *are* sufficient for unity, then the corpus callosum wasn't the seat of unity to begin with. This undermines the significance of the surgery in your argument.

  **5. The "Confabulation vs. Ignorance" Objection (Neuropsychologist)**
  *   **The Question:** "In the interpreter cases, the left hemisphere makes up a reason for an action the right hemisphere initiated. You call this 'honest reporting from partial info.' But clinically, this looks like confabulation. The patient is asserting a causal chain they know, deep down, didn't happen. Isn't there a fracture in self-knowledge that amounts to a fracture in the self?"
  *   **Your Reply:** "Confabulation implies a break in truth-telling about *agency*. But these patients aren't claiming *they* didn't do it. They claim *they* did it for reason X. They own the action. They just get the cause wrong. We all do this (introspective illusion). The split-brain patient is just in a condition where the illusion is guaranteed because the data is physically blocked. It's an amplified version of normal epistemic limitation, not a split in the agent."
  *   **The Soft Spot:** You are normalizing a pathological error. If the "deep down" knowledge is inaccessible, in what sense is it the *same* self that holds both the action and the false reason?

  **6. The "Anesthesia & Awareness" Objection (Anesthesiologist)**
  *   **The Question:** "We monitor depth of anesthesia by looking for integration breakdown. If integration breaks down, we say consciousness is fragmented or lost. You're saying integration can break down (callosotomy) but consciousness stays whole. Are you contradicting the biomarkers we use to determine if a patient is 'one conscious entity' or not?"
  *   **Your Reply:** "Not necessarily. Anesthesia induces a global breakdown of thalamocortical loops. Callosotomy is a specific disconnection between cortical hemispheres while thalamocortical loops remain intact in both. You're measuring the *level* of consciousness; I'm talking about the *number* of subjects. You can have a fully conscious subject with a specific information bottleneck. The biomarkers track arousal and global connectivity, not necessarily the count of perspectives."
  *   **The Soft Spot:** You are drawing a line between "level" and "number" that might not exist in the neural data. If integration drops enough, does the "number" eventually tick up?

  **7. The "Learning & Compensation" Objection (Neuropsychologist)**
  *   **The Question:** "You mention patients learn cross-cueing strategies over months. If they have to *learn* to be unified, doesn't that suggest the unity isn't given? It suggests they are building a bridge between two separate agents who decide to cooperate."
  *   **Your Reply:** "They aren't learning to be unified; they are learning to bypass the blockage. It's like learning to type with a broken wrist. The intention to type was always one; the motor execution required a workaround. The fact that they *can* learn this suggests a underlying drive for coherence that wouldn't exist if there were two distinct wills negotiating."
  *   **The Soft Spot:** "Drive for coherence" is a teleological claim. A computationalist will ask for the mechanism. Who is doing the driving if the channels are cut?

  **8. The "Ethical Liability" Objection (Philosopher of Personal Identity)**
  *   **The Question:** "If the left hand commits a battery and the speech center claims ignorance, your view says the patient is liable because it's one subject. But if the speech center genuinely lacked access to the intention, is it fair to hold them responsible? Doesn't your view expand liability too far?"
  *   **Your Reply:** "It doesn't expand liability; it clarifies it. We hold people responsible for their bodies' actions unless there's a distinct *agent* intervening (like coercion). Here, there is no other agent. The 'ignorance' is internal to the system, like forgetting why you walked into a room. You are still responsible for the action, even if your self-narrative is flawed. Denying the second mind protects the patient from being treated as a container for multiple entities."
  *   **The Soft Spot:** This is an ethical pivot, not a metaphysical one. It doesn't prove the metaphysics, it just argues for the *consequences* of your metaphysics.

  ---

  ### Strategic Concessions & Non-Negotiables

  **Concede in the first 5 minutes (To buy credibility):**
  1.  **The Data is Messy:** Acknowledge the surgeon's point about the classic cohort. "I know the dataset is small and old. I am not making a clinical claim about modern surgical outcomes, but a philosophical claim about how we interpret the *phenomenology* of the classic cases."
  2.  **Subcortical Pathways:** Admit the callosum isn't the *only* connection. "I am not claiming the hemispheres are totally isolated, only that the *conscious reporting* channel is restricted."
  3.  **Conflict is Real:** Do not deny the intermanual conflict exists. "The conflict is undeniable. The question is whether conflict implies two *selves* or one *self* with conflicting inputs."

  **Absolutely Cannot Give Up (The view collapses if you lose these):**
  1.  **The Definition of Subject:** You cannot accept "mutual availability of information" as the criterion for subjecthood. If you concede that "no access = no self," you lose. You must hold that subjecthood is about the *perspective*, not the *content*.
  2.  **The Phenomenological Report:** You must insist that the patient's report ("I feel like one person") trumps the behavioral dissociation ("Your hands fought"). If you let the behavior override the report, the two-minds view wins.
  3.  **Epistemic vs. Ontological:** You must maintain that the left hemisphere's ignorance is a *knowledge* problem, not an *existence* problem.

  ---

  ### The "Prayer" Question (The one you hope nobody asks)

  **The Question:** "If the subject is one, **where is it located?** If the left hemisphere can't access the right's content, and the right can't access the left's, and the corpus callosum is cut... *what physical structure is hosting the single perspective?* If you say it's the whole brain, but the whole brain can't talk to itself, aren't you positing a ghost in the machine?"

  **Why this hurts:** It forces you to identify the supervenience base of the "single subject." If you say "the whole brain," the comp neuro will say "the whole brain isn't functionally one thing anymore." If you say "it's not physical," you lose the room.
  **Your Honest Answer:** "I don't know the precise neural correlate of the 'single perspective.' My argument is negative: I'm showing that the *evidence for two* (disconnection) doesn't necessitate *two subjects*. I'm not claiming to have located the 'one,' only that the 'two' hypothesis is a category error." (Say this humbly. It admits the gap without collapsing the argument).

  ---

  ### Hidden Assumption Flag (For the Computational Neuroscientist)

  **The Assumption:** You are assuming that **functional disconnection does not entail ontological separation.**
  *   **Your phrasing:** "Routing failure."
  *   **Their phrasing:** "Modular independence."
  *   **The Trap:** To a computational neuroscientist, a "subject" *is* a system that integrates information. If $\Phi$ (integrated information) drops significantly across the midline, they will argue the system *has* become two systems. You are treating "subject" as a primitive that survives the cut; they treat "subject" as an emergent property of integration that *dissolves* with the cut.
  *   **Prep:** Be ready to distinguish between *integration for access* (which is lost) and *integration for existence* (which you claim is retained). You need to argue that the "global workspace" can be fragmented without splitting the "user." This is your biggest theoretical vulnerability.
