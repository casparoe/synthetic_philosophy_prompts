      *   *Concede:* The old data is messy. Not all patients show dramatic effects. Subcortical pathways exist.
      *   *Non-Negotiable:* The definition of "subject" cannot be "access to all information." The phenomenological report of unity trumps the behavioral dissociation.

  6.  **The "Prayer" Question:**
      *   What is the hardest empirical fact? Probably the *intermanual conflict* that persists without resolution. Or the neural correlate question: "Where is the single perspective physically located if the integration is broken?"

  7.  **Flagging the Computational Neuro Assumption:**
      *   The user defines unity as "single perspective/action selection." A comp neuro person thinks of unity as "integrated information." The hidden assumption is that functional disconnection doesn't equal structural/ontological separation. The comp neuro will say "Function *is* the ontology here."

  8.  **Review against Constraints:**
