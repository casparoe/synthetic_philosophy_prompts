answer: |-
  Mark tossed the keys. They were in my palm before his arm finished the arc. He didn't comment, and neither did I. We walked across the concrete towards my car, the gravel crunching under our shoes in a rhythm that felt slightly delayed, like watching a film where the audio track has slipped. It was dusk, that heavy blue hour where the streetlights haven't quite decided to commit, and the air smelled of petrol and damp dust. I was eleven months and four days into the new sight. The world was clear, sharp, and entirely mine, provided I didn't think too hard about the arrival time of the post.

  The car park was mostly empty, a grid of white lines fading into the grey aggregate. I kept my hands in my pockets. I didn't need them for balance. The system handled the incline of the ground, the slight sway of my body, the way the horizon tilted when I turned my head. It smoothed the edges. I felt solid. I felt present.

  The van came from the left aisle, moving slow, a white box sliding through the twilight. I saw the reverse lights flare first, bright white circles burning into the dimming air. They were intense, demanding attention. A man stepped out from behind a concrete pillar, right into the path of the van. He was wearing a dark jacket, hands deep in his pockets, looking at the ground. He stepped back, just one pace, aligning himself with the bumper. The van continued. There was a sound, a dull thud that vibrated in my chest before it reached my ears, and the man went down. He hit the concrete hard, his legs folding under him.

  I was moving before the van stopped. I was on my phone, dialing emergency, while the driver was still opening his door. I gave the location, the description, the sequence. My voice was steady. I told them the lights came on, the man stepped back, the van moved, the impact happened. I watched the driver kneeling beside the body, checking for a pulse, shaking his head. The white lights of the van illuminated the scene, casting long shadows that stretched towards me. I stood in the shadow of the pillar where the man had been. I waited for the police. I gave the statement to the officer on the scene, then again at the station. I was calm. I was specific. I was the only witness who had a clear line of sight.

  Three weeks later, the deposition room was cold. The air conditioning hummed with a low, steady drone that seemed to press against my temples. There were three lawyers, a court reporter, and a screen mounted on the wall that was currently black. I sat at the table, my hands folded in front of me. The lawyer for the defence stood up. He was a tall man with a tie that looked too tight. He didn't look at me; he looked at the screen.

  "We'd like to play the CCTV footage from the car park," he said. "Timestamped. High resolution."

  He nodded to the technician. The screen flickered to life. Grainy grey footage filled the space. The angle was high, looking down from the corner of the building. I saw my own figure standing near the pillar, small and distant. I saw the van enter the frame. I saw the man step out from behind the pillar.

  The lawyer held up a hand. "Pause."

  The image froze. The man was mid-step, his heel lifted off the ground. The van's rear lights were dark. They were just red plastic, unlit.

  "Play."

  The man's heel touched the ground. He stepped back. He fell. He hit the concrete. His body settled. And then, a fraction of a second later, the white reverse lights flared on the screen, brightening the grey pixels.

  The lawyer let the video run for another ten seconds, showing the driver getting out, showing me walking towards them. Then he paused it again. He turned to face me. He didn't smile.

  "Ms. Vance," he said. "According to the clock on this footage, the man was on the ground before the driver engaged reverse. The lights came on after the impact."

  I looked at the screen. The man was lying still. The lights were bright white circles. In my memory, the lights were the first thing. They were the warning. They were the cause. On the screen, they were an aftermath.

  "I know what I saw," I said. My voice sounded flat in the room.

  "You saw a sequence of events," the lawyer said. "We are not disputing that you saw something. We are disputing the order in which it arrived."

  He walked closer to the table. He placed a hand on the surface, near my folded fingers. "Your statement says the lights prompted the man's movement. The video shows the man's movement prompted the lights. If the lights were off when he fell, the driver didn't see him. If the driver didn't see him, it's an accident, not negligence. Your testimony is the only thing suggesting negligence."

  I looked at the frozen image. The man's body was a dark shape against the grey concrete. The light from the van washed over him, but it came too late. It was light without function. Illumination without warning.

  "I was there," I said.

  "You were," he agreed. "But you weren't then."

  He went back to his seat. He didn't need to say more. The room was quiet. The court reporter stopped typing. The hum of the air conditioning seemed to get louder, filling the silence where the truth should have been. I looked at my hands on the table. They were still. I could feel the pressure of my palms against the wood. I could feel the heat of my own skin.

  I thought about the keys Mark had tossed. I thought about the arc of his arm. I had caught them before the motion was complete. I had assumed it was practice. I had assumed it was skill. I had assumed the world arrived in the order I experienced it.

  The lawyer shuffled his papers. "We're not accusing you of lying, Ms. Vance. We're suggesting your equipment constructs a narrative for you. It fills in the gaps. It makes sure the story makes sense. Lights before impact. Cause before effect. It's a better story. It's just not the video."

  I didn't answer. There was no answer that wouldn't sound like madness. If I said I knew the order was wrong, I invalidated my own senses. If I said I knew the order was right, I invalidated the video. Both were records. One was ink on paper, one was light on silicon. Neither could touch the other.

  I looked back at the screen. The freeze-frame held the man on the ground. The white lights were burning. I watched the pixels that made up the light. They were static. They didn't flicker. They were just there, painted over the moment of the fall.

  The lawyer spoke again, something about adjournment, about reviewing the technical specs of the prosthesis. I didn't hear the words. I was watching the shadow under the van in the video. It was dark, solid. The light from the reverse lamps should have changed the shadow, softened the edges. But in the frame where the man fell, the shadow was sharp. In the frame where the lights came on, the shadow was the same. The light hadn't changed the room. It had only changed the recording.

  I lifted my hand. I moved my index finger. I watched it move. I knew the signal from my brain had traveled down my arm, fired the muscle, lifted the bone. I knew the light reflecting off my skin had traveled to my eye, hit the retina, sent the impulse back up the nerve, been processed, composed, and delivered to the mind. I knew there was a gap. I knew there was always a gap.

  The lawyer stopped talking. He was waiting for me to acknowledge the adjournment. I lowered my hand. I looked at the screen one last time. The white lights were bright against the dark plastic. They looked like eyes that had opened after the death had already happened.

  I stood up. My chair scraped against the floor. The sound reached me a moment after the vibration traveled up my legs. I walked to the door. I didn't look back at the screen. I didn't need to. The image was already inside me, composed, finished, waiting to be edited.

  ***

  The story endorses neither build, because the protagonist's inability to distinguish between them is the central truth of her condition. The sentence that commits to this uncertainty is: "Both were records. One was ink on paper, one was light on silicon. Neither could touch the other."
