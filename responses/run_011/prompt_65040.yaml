answer: |-
  **The stipulations the argument uses**

  The argument depends critically on the "Logged" nature of the system: the complete sequencing every fifty generations and the known selection coefficients. This eliminates epistemic uncertainty about whether selection occurred; we know exactly when fitness differences existed. Consequently, the interval from generation 12 to 1,600 is stipulated as a period of neutrality regarding P-b, meaning no fitness differences were caused by P-b's effects. The interval from 1,613 to 2,400 is stipulated as a period of positive selection caused by P-b's sequestration effect. I assume the causal-role account can be relativized to time intervals (assessing contributions to capacity over specific stretches) rather than only instantaneously. I assume the etiological account relies on actual selection history, not inferred history. Incidental features include the specific organism, the chemical names, and the exact generation numbers, provided the structural relationships between neutrality, selection, and phenotypic effect remain constant.

  **The argument**

  1.  **Definition of Etiological Function:** On the etiological account, a trait has a function if and only if there exists a history of selection in the lineage where the trait's effect contributed to the fitness of the bearers, explaining the trait's presence.
  2.  **Definition of Causal-Role Function:** On the causal-role account, a trait has a function if and only if its effect contributes to a specified capacity of the containing system.
  3.  **The Identity of Fitness and Capacity:** In the context of an evolving population within a chemostat, the relevant "capacity of the containing system" is lineage persistence and growth rate. Therefore, contributing to system capacity is extensionally equivalent to contributing to fitness in this specific system.
  4.  **The Logged History as Selection Record:** Because the Logged Duplicate provides a complete record of selection coefficients, the statement "P-b was selected for effect E" is empirically identical to the statement "Effect E caused fitness differences in interval I." There is no gap between the history of selection and the history of causal contributions to fitness.
  5.  **Analysis of the Neutral Interval (Gen 12–1,600):** During this interval, P-b accumulates substitutions without fitness effect. The etiological account withholds function because there is no selection history for P-b's effects. The causal-role account, relativized to this interval, also withholds function because P-b's effects contribute nothing to the system's capacity (growth/survival). Both accounts agree: no function.
  6.  **Analysis of the Selected Interval (Gen 1,613–2,400):** During this interval, P-b's sequestration effect correlates with a 2% growth advantage. The etiological account ascribes function because this effect explains P-b's maintenance via selection. The causal-role account, relativized to this interval, ascribes function because this effect contributes to the system's capacity (survival in toxin T). Both accounts agree: function exists.
  7.  **The Source of Normativity:** Proponents of the etiological account argue it uniquely grounds normativity (malfunction): a trait *ought* to do X because it was selected for X. In the Logged Duplicate, "selected for X" means "X causally contributed to fitness in the past."
  8.  **Causal-Role Normativity:** A causal-role account relativized to history grounds normativity similarly: a trait *ought* to do X because X is required to maintain the system capacity established over the historical interval. Since capacity = fitness, the requirement is derived from the same past causal contributions.
  9.  **Equivalence of Withholding:** When the etiological account withholds function (e.g., permease activity at Gen 2,400), it does so because permease activity was not the effect selected for in the relevant history. The causal-role account withholds it because permease activity did not contribute to the system's capacity in the relevant history. The reason for withholding is identical: lack of past causal contribution to fitness.
  10. **Intermediate Conclusion:** For every trait effect in the Logged Duplicate, the etiological account and the historically-relativized causal-role account yield the same verdict on the presence or absence of function.
  11. **The Diachronic Restatement:** The etiological account adds no substantive content beyond indexing the causal-role account to the specific historical intervals where causation impacted fitness. It says "Function exists because past causation supported fitness." The causal-role account says "Function exists because past causation supported capacity." Given premise 3, these are the same statement.
  12. **Final Conclusion:** In a system where selection history is fully documented, the etiological account is not a rival but a diachronic restatement of the causal-role account. The normativity claimed by etiology is fully replicated by causal-role reasons referencing past contributions to fitness.

  **The promoter mutation**

  The promoter mutation at generation 2,397 presents a test case for the timing of function ascription. Here, the accounts might appear to diverge based on how much history is required to establish a function.

  Branch One: Suppose the etiological account requires only that selection has begun (rising frequency under positive selection is sufficient). It ascribes the sequestration function to the new allele immediately at generation 2,400. The causal-role account, assessing current contribution to capacity, also ascribes function immediately, as the higher expression increases sequestration and thus fitness now. Both agree: function is present.

  Branch Two: Suppose the etiological account requires a longer history (e.g., fixation or stable maintenance) to confirm the trait is truly "for" this effect. It withholds function at generation 2,400, viewing the allele as transient. The causal-role account, if relativized to a "stable system capacity," might similarly withhold function, arguing that a transient mutation does not yet constitute a stable capacity of the population system. Both agree: function is not yet established.

  The only potential divergence arises if etiology requires fixation while causal-role accepts instantaneous contribution. However, in a biological system, a "capacity" usually implies a stable disposition, not a momentary fluctuation. If the causal-role account accepts instantaneous tokens as having functions, it risks ascribing function to noise. If it requires stability, it aligns with etiology's requirement for established history. Thus, either both ascribe function now, or both wait for stability. In neither case does the etiological account provide a unique verdict that the causal-role account cannot match by adjusting its temporal window. The thesis holds: the difference is merely one of temporal granularity, not substantive content.

  **The strongest objection, and my reply**

  The strongest objection is the "Broken Trait" problem. Imagine a P-b allele at generation 2,400 that retains the sequence selected for sequestration but is structurally damaged and cannot bind toxin T. The etiological account ascribes the function of sequestration to this allele and declares it malfunctioning. It maintains the normativity: the allele *ought* to sequester. The causal-role account, assessing current effects, sees no sequestration. It withholds the function entirely. Here, etiology distinguishes "having a function but failing" from "lacking a function," while causal-role collapses them. This suggests etiology carries normative content causal-role cannot replicate.

  My reply is that the thesis permits the causal-role account to be relativized to the "appropriate stretch of the system's history." The relevant system is not the individual broken token, but the gene type maintained over the interval 1,613–2,400. The capacity of the population system relies on the *type's* causal profile, established by the logged history. The broken token is a failure to instantiate the causal role defined by the historical interval. Thus, the causal-role account can say: "The trait type has the function (based on history); this token fails to perform it."

  However, a residue remains. To make this work, the causal-role account must shift from analyzing token causation to typological dispositions grounded in history. This concedes that instantaneous causal contribution is insufficient for function ascription in evolving systems. This costs the thesis slightly: it shows the causal-role account must incorporate historical data to match etiology, rather than relying purely on current structure. Yet, this supports the main thesis: once causal-role incorporates history (as permitted by the "relativized" clause), the accounts converge. The normativity is still derived from past causal contributions, not a separate etiological fact.

  **What would falsify the thesis**

  The thesis would be falsified if the Logged Duplicate showed a period of **drift following selection**. Suppose that from generation 2,300 to 2,400, the toxin T is removed, rendering P-b neutral, yet P-b persists in the population due to drift rather than deletion.

  In this scenario, the etiological account still ascribes the sequestration function at generation 2,400 because the trait's presence is explained by past selection (generations 1,613–2,300). The history of selection remains intact. However, the causal-role account, even relativized to the most recent history (2,300–2,400), finds no contribution to system capacity, as the trait is neutral. If the causal-role account relies on the older interval (1,613–2,300), it matches etiology; if it relies on the current interval, it diverges.

  To falsify the thesis specifically, one must show that the etiological account ascribes function based on *ancestral* selection that the causal-role account cannot match even when relativized to *any* historical stretch. If the etiological account claims the function persists solely due to ancestry despite a total lack of causal contribution in any recent or relevant interval, while the causal-role account (which requires contribution to capacity) withholds it, the equivalence breaks. This would demonstrate that etiology relies on a historical essence independent of causal contribution, proving it is not merely a diachronic restatement of causal role.
