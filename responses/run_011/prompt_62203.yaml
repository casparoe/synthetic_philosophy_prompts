      *   *Claim 3 (Cookery/Intellect = Metabolism):*
          *   Nietzsche: "A people's cookery explains its intellectual condition..."
          *   Researcher: Cognitive phenotypes and ideological outputs are confounded by or downstream of metabolic biomarkers. Dietary patterns act as effect modifiers on cognitive performance and psychological outlook.
      *   *Claim 4 (Health as Dynamic):*
          *   Nietzsche: Health is something one wins back...
