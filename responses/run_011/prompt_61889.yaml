  # Problem Set 2: Formal Systems and the Mind

  **System Specification**
  The following formal system uses the alphabet {A, B}.
  **Axiom:** `AB`
  **Rules:**
  1.  **Doubling:** From `Ax` infer `Axx`, where `x` is any string (possibly empty). Applies only to strings beginning with `A`.
  2.  **Accretion:** From `x` infer `xAAA`.
  3.  **Collapse:** From `xBBBy` infer `xAy`.
  4.  **Annihilation:** From `xAAy` infer `xy`.

  **Questions**

  **(a)** [6 marks] Show that neither `A` nor `ABBB` is a theorem. Proofs by exhaustion of the derivations you happened to try will not receive credit; the argument must be an induction on the length of derivations.

  **(b)** [4 marks] Exhibit a derivation of some theorem containing exactly five `B`s, citing the rule used at each line.

  **(c)** [15 marks] Evaluate the following reflection, appended by a hypothetical student who has just completed (a) and (b):
  *"The system can never produce `ABBB`, yet I can see that it never will. I started out inside the system, shuffling its strings by its own rules, and then I stepped outside it and established something about every string it could ever generate. A program implementing these four rules could only keep generating; it could never see what I saw. That is what jumping out of the system means, and it is why a mind cannot be a formal system."*

  In your evaluation, say what the reflection gets right about the relationship between rule-following and the invariant proof; identify and explain at least two distinct inferences in the passage that do not hold; say whether the situation would differ in kind if `ABBB` were replaced by a Gödel sentence for a system able to express elementary arithmetic; and address what follows from the fact that the meta-level argument can be written down, taught, checked, and used as a pruning condition in a search procedure.

  ***

  # Model Answer

  **(a)** Let $N_B(s)$ be the number of `B`s in string $s$. We claim that for any theorem $s$, $N_B(s) \not\equiv 0 \pmod 3$.
  **Base Case:** The axiom is `AB`. $N_B(\text{AB}) = 1$. $1 \not\equiv 0 \pmod 3$.
  **Inductive Step:** Assume $s$ is a theorem with $N_B(s) \not\equiv 0 \pmod 3$. We check the rules:
  1.  **Doubling:** $s = Ax \to Axx$. $N_B(new) = 2 \cdot N_B(x) = 2 \cdot N_B(s)$. If $N_B(s) \equiv 1$, $2 \cdot 1 \equiv 2$. If $N_B(s) \equiv 2$, $2 \cdot 2 \equiv 4 \equiv 1$. In neither case is the result $0 \pmod 3$.
  2.  **Accretion:** $x \to xAAA$. Adds zero `B`s. Residue unchanged.
  3.  **Collapse:** $xBBBy \to xAy$. Removes three `B`s. Residue unchanged.
  4.  **Annihilation:** $xAAy \to xy$. Removes zero `B`s. Residue unchanged.
  Since the property holds for the axiom and is preserved by all rules, it holds for all theorems.
  **Conclusion:** `A` has $0$ `B`s ($0 \equiv 0 \pmod 3$). `ABBB` has $3$ `B`s ($3 \equiv 0 \pmod 3$). Neither is a theorem.

  **(b)**
  1.  `AB` (Axiom)
  2.  `ABB` (Rule 1 on 1)
  3.  `ABBABB` (Rule 1 on 2)
  4.  `ABBABBABBABB` (Rule 1 on 3) [8 Bs]
  5.  `AAAA BBABBABBABB` (Rule 2 on first `A` of 4)
  6.  `AA BBABBABBABB` (Rule 4 on 5)
  7.  `BBABBABBABB` (Rule 4 on 6) [Leading `A` deleted]
  8.  `BB AAAA BBABBABB` (Rule 2 on first separator `A` of 7)
  9.  `BB AA BBABBABB` (Rule 4 on 8)
  10. `BB BBABBABB` (Rule 4 on 9) [Second `A` deleted]
  11. `BB BB AAAA BBABB` (Rule 2 on next `A`)
  12. `BB BB AA BBABB` (Rule 4 on 11)
  13. `BB BB BB BBABB` (Rule 4 on 12) [Third `A` deleted]
  14. `BB BB BB BB BB BB` (Rule 4 on remaining `A` via similar steps) [8 Bs contiguous]
  15. `A BBBBB` (Rule 3 on 14: `BBB` $\to$ `A`, leaving 5 `B`s)
  Theorem `ABBBBB` contains exactly five `B`s.

  **(c)**
  The reflection correctly identifies that object-level rule-following is blind to global properties (invariants), while a meta-level analysis can characterize the entire set of theorems. It is true that a brute-force generator cannot *know* it will never halt on `ABBB` without an external constraint.

  However, two inferences fail. First, the claim that "a program... could never see what I saw" is false. The invariant proof ($N_B \not\equiv 0 \pmod 3$) is algorithmic. A program can be written to check this condition before generating strings, effectively "seeing" the constraint. This addresses the fact that the meta-argument can be formalized and used as a pruning condition; derivability is semi-decidable, but non-derivability here is decidable via the invariant. The asymmetry concerns halting, not insight.

  Second, the student conflates invariant-unprovability with Gödelian incompleteness. `ABBB` is unprovable because it is *false* in the model defined by the invariant. A Gödel sentence is unprovable but *true*. If `ABBB` were replaced by a Gödel sentence, the situation would differ in kind: the sentence would be derivable in the meta-system (as true) but not the object-system. Here, `ABBB` is derivable in neither, because it violates the system's structural constraints.

  Finally, the student inverts Hofstadter's use of "Jumping Out Of The System" (JOOTSing). For Hofstadter, JOOTSing is a mechanism *within* complex systems (strange loops) that generates meaning, not proof that minds transcend formal systems. If the student's argument were sound—that minds cannot be formal systems because they can grasp meta-rules—it would undermine the possibility of grading this answer, as grading requires following the formal rules of the marking scheme. The student mistakes moving to a stronger formal system for escaping formalism altogether.

  ***

  # Marking Scheme (Total 25 Marks)

  **Part (a): 6 Marks**
  *   **3 Marks:** Identification of the correct invariant ($N_B \pmod 3 \neq 0$).
      *   *Deduction:* Award only **1 mark** if the student proves only that every theorem contains at least one `B`. This blocks `A` but fails to block `ABBB`.
  *   **3 Marks:** Correct inductive step showing all four rules preserve the invariant.
      *   *Deduction:* **1 mark** off if Doubling is not analyzed modulo 3 (e.g., merely stating it increases Bs).

  **Part (b): 4 Marks**
  *   **1 Mark:** Final string contains exactly five `B`s.
  *   **2 Marks:** All derivation steps are valid applications of the rules.
  *   **1 Mark:** Rules cited correctly at each line.
      *   *Deduction:* **2 marks** off (maximum for section) if the student conjectures that the number of `B`s is always a power of two. Part (b) refutes this (5 is not a power of two).

  **Part (c): 15 Marks**
  *   **3 Marks:** Acknowledges the correct intuition: rule-following is local/blind, meta-analysis is global.
  *   **3 Marks:** Refutes the "Program" claim. Must state that the invariant is computable/checkable by a program (pruning/search), distinguishing halting problems from insight.
  *   **3 Marks:** Distinguishes `ABBB` from a Gödel sentence. Must note `ABBB` is false/unreachable, whereas Gödel sentences are true/unprovable.
  *   **3 Marks:** Corrects the Hofstadter interpretation. Must note the student inverts JOOTSing (Hofstadter uses it to explain mind-as-system, not mind-vs-system).
  *   **3 Marks:** Identifies the self-undermining nature of the claim (if minds aren't formal, logical grading is impossible).

  **Grading Distinctions (Part c)**
  *   **A Answer (13-15 marks):** Separates moving to a stronger system from escaping formalism; explicitly notes the reflection inverts Hofstadter; avoids treating invariant blind spots as incompleteness.
  *   **B Answer (9-12 marks):** Identifies the program error and the Gödel distinction but fails to address the self-undermining paradox or misinterprets JOOTSing as purely anti-mechanist.
  *   **C Answer (5-8 marks):** Agrees with the student's conclusion; fails to distinguish invariant constraints from incompleteness.

  **Specific Mistakes & Deductions**
  *   **"-1 mark":** Failing to mention that the meta-argument itself constitutes a formal system.
  *   **"-2 marks":** Claiming the system is incomplete because `ABBB` is unprovable (it is consistent, `ABBB` is simply not a theorem).
  *   **"-3 marks":** Arguing that because a human saw the invariant, no machine could (ignoring computability of modulo arithmetic).
  *   **"-5 marks":** Treating the reflection as entirely correct.
