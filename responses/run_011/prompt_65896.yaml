      *   **Precedent Autonomy:** The competent self has the right to determine the fate of the incompetent self based on critical interests. The earlier self governs the later self.
      *   **Integrity:** A life should have a coherent narrative. Prolonging a vegetative life might violate the narrative integrity the person valued.
      *   **Best Interests:** Dworkin distinguishes between what is good for the *experience* of the patient (none in PVS) and what respects their *critical* interests (autonomy).
