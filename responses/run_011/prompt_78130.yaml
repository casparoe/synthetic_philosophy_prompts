answer: |-
  # PRACTICE QUIZ: BAYESIAN CONFIRMATION
  **Time Allowed:** 45 Minutes  
  **Total Marks:** 20  

  **Question 1**  
  Consider a Bayesian agent with a credence function $P$. Let $E$ be a proposition representing empirical evidence and $H$ be a hypothesis.

  **(a)** Suppose $E$ is already part of the agent's total evidence, such that $P(E) = 1$. The agent encounters $H$ for the first time and establishes that $H$ entails $E$ (i.e., if $H$ is true, $E$ must be true). Using the definition of conditional probability, show exactly what conditionalizing on $E$ does to the agent's credence in $H$. Briefly explain why this result generates a problem for the view that confirmation consists solely in conditionalization on new evidence.  
  **[5 Marks]**

  **(b)** Now assume $P(H) = 0.1$. Suppose $E$ is not quite certain, so $P(E) = 0.9999$, but $H$ still entails $E$.  
  (i) Derive the general formula for $P(H|E)$ in any case where $H$ entails $E$.  
  (ii) Plug in the values to calculate the new credence $P(H|E)$.  
  (iii) Explain what this implies about the confirmatory power of $E$ as $P(E)$ approaches 1.  
  **[5 Marks]**

  **(c)** Consider the following proposal to solve the problem described in (a):

  > **The Rollback Rule:** If you come to believe that $H$ entails $E$, where $E$ is already in your total evidence and $P(E) = 1$, then you should set your new $P(H)$ equal to the value that conditionalizing on $E$ would have given you had you started from the credence function you held immediately before $E$ first entered your evidence base.

  Evaluate this proposal. In your answer, address whether the rule is well-defined for agents with limited memory, whether it violates the principle that rational credence should depend only on current evidence (not learning history), and whether it allows an agent to artificially inflate credences. Finally, suggest what aspect of the agent's cognitive state is actually *new* when they realize $H$ entails $E$, and how that might offer a better solution.  
  **[10 Marks]**

  ***

  # MODEL ANSWER

  **(a)** By definition, $P(H|E) = P(H \cap E) / P(E)$. Since $H$ entails $E$, the intersection $H \cap E$ is simply $H$. Given $P(E) = 1$, the equation becomes $P(H|E) = P(H) / 1 = P(H)$. Conditionalizing on $E$ produces no change in the credence of $H$. This is problematic because intuitively, discovering that a hypothesis explains known evidence *should* confirm the hypothesis. If confirmation requires probability increase via conditionalization, old evidence can never confirm a theory, which contradicts scientific practice (e.g., General Relativity explaining Mercury's orbit).

  **(b)** (i) As derived above, if $H \models E$, then $P(H|E) = P(H) / P(E)$.  
  (ii) Plugging in the values: $P(H|E) = 0.1 / 0.9999 \approx 0.10001$.  
  (iii) The confirmatory boost is determined by the factor $1/P(E)$. As $P(E)$ approaches 1, this factor approaches 1, and the boost shrinks to zero. This demonstrates that even evidence that is merely *very* well confirmed offers negligible support to a hypothesis under standard conditionalization, suggesting the problem is not unique to logical certainty but scales with certainty.

  **(c)** The Rollback Rule attempts to restore the confirmatory boost by counterfactually removing $E$ from the evidence base. However, it faces three major objections. First, it is often not well-defined: agents rarely retain access to past credence functions. If $E$ was learned years ago, the "prior" required by the rule is psychologically inaccessible. Second, it violates synchronic rationality. Two agents with identical current total evidence and logical knowledge could hold different credences in $H$ simply because one learned $E$ yesterday and the other last year. Rationality should supervene on current states, not history. Third, the rule risks credence pumping. If an agent constructs multiple hypotheses $H_1, H_2...$ that all entail $E$, they can rollback for each, extracting infinite confirmatory value from a single observation $E$.

  A superior approach identifies the *new* information not as $E$, but as the logical proposition that "$H$ entails $E$." The agent conditionalizes not on $E$ (which is old), but on the newly acquired knowledge of the logical relationship. This allows $P(H)$ to rise without requiring access to superseded priors or violating synchronic rationality, as the update reflects a genuine change in the agent's logical knowledge base.

  ***

  # MARKING SCHEME

  | Criteria | Marks | Common Errors & Penalties |
  | :--- | :---: | :--- |
  | **Part (a): Math & Problem ID** | **5** | |
  | Correct derivation showing $P(H|E) = P(H)$ | 3 | **-2** for algebraic errors in conditional prob definition. |
  | Clear explanation of the "no confirmation" problem | 2 | **-1** for vague appeals to "intuition" without referencing probability change. |
  | **Part (b): Calculation & Limit** | **5** | |
  | Correct general formula ($P(H)/P(E)$) | 2 | **-2** if formula implies addition rather than division. |
  | Correct numerical result (~0.10001) | 1 | **-1** for significant calculation errors. |
  | Insight on limit ($P(E) \to 1 \implies$ boost $\to 0$) | 2 | **-1** if they claim the boost remains significant at 0.9999. |
  | **Part (c): Evaluation of Rule** | **10** | |
  | **Access/Memory:** Notes rule requires inaccessible past credences. | 2 | **-2** if student assumes agents always remember past priors. |
  | **History Dependence:** Notes violation of synchronic rationality (bug). | 2 | **-2** if student claims history dependence is acceptable/irrelevant. |
  | **Pumping:** Notes risk of inflating credence via multiple $H$. | 2 | **-2** if student fails to see how multiple hypotheses exploit the rule. |
  | **The "New" Thing:** Identifies learning the *entailment* as the update. | 2 | **-2** if student suggests updating on $E$ again is the solution. |
  | **Technical Penalty** | **N/A** | **-5 (Cap)** Explicit deduction if student claims conditioning on $P(E)=1$ is *undefined*. (It is trivial, not undefined). |

  **Total:** 20 Marks
