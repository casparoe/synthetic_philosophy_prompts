answer: |-
  # Decision Procedure: Assessing Misleading Implications in Advertising

  **To:** Panel Members
  **From:** Chair
  **Subject:** Operationalizing the "Implied Claim" Standard

  We are not philosophers, and we do not have all day. We need a reproducible method to decide when a literally true ad tells a lie by implication. We will use a simplified version of Paul Grice's theory of conversation, adapted for commerce. Grice argued that listeners infer meaning based on the assumption that speakers are being cooperative. Advertising is not cooperative—it is persuasive—but consumers still expect **Commercial Relevance**. They assume the advertiser is providing information material to the purchasing decision, not hiding the catch.

  Below is the five-step procedure. Follow it in order. If you cannot complete a step within the preparation time, you must order consumer evidence (surveys/focus groups).

  ---

  ## Part 1: The Procedure

  ### Step 1: The Literal Baseline (Verification)
  *Confirm staff findings.*
  *   **Question:** Is the literal claim factually accurate?
  *   **Sufficient Answer:** Yes (verified by staff).
  *   **Stop Rule:** If "No," the ad is literally false. Stop. Do not proceed to implication.

  ### Step 2: The Relevance Gap (The "So What?" Test)
  *Identify why the claim exists.*
  *   **Question:** If we take the literal claim at face value, without adding anything, does it provide material information to the ordinary consumer?
  *   **Sufficient Answer:** If the literal claim is trivial, obscure, or useless without further assumption, a relevance gap exists.
  *   **Reasoning:** Under the adapted Maxim of Relation, an advertiser should not draw attention to a feature unless it is a selling point. If the literal truth is insignificant (e.g., "contains trace elements"), the advertiser is violating the expectation of relevance unless they intend to imply significance.
  *   **Stop Rule:** If the literal claim is material on its own (e.g., "This car has four wheels"), there is no implication. Stop.

  ### Step 3: Generating Candidate Implicatures (The "Why Say That?" Test)
  *Fix the content of the implied claim.*
  *   **Question:** What specific assumption must the consumer make to bridge the Relevance Gap identified in Step 2?
  *   **Sufficient Answer:** A specific proposition that makes the ad a rational sales pitch.
  *   **Fixing Content (Multiple/Strength):** If multiple implications are possible (e.g., "This drink is healthy" vs. "This drink is mostly fruit"), select the **Minimum Necessary Inference**. Choose the weakest claim that *still* makes the ad relevant.
      *   *Example:* If "Made with Fruit" implies either "Contains Some Fruit" (weak) or "Mostly Fruit" (strong), and "Contains Some Fruit" is already literally true, you must test the stronger claim ("Mostly Fruit"). Why? Because the weak claim adds no new information. The advertiser only speaks to gain an advantage. The implication is the *added value* the consumer perceives.
  *   **Testing Genuineness:** To ensure the implication isn't imported by the complainant, apply the **Cancellation Test (Diagnostic Only)**. Ask: "Could the advertiser add a sentence without contradicting themselves that denies this implication?"
      *   If Yes (e.g., "Made with fruit... but only a drop"), the implication is a Gricean implicature.
      *   If No (e.g., "Made with fruit... but actually contains none"), it's a literal contradiction, not an implication.
      *   *Note:* This test identifies *that* an implication exists, not whether it is *allowed*.

  ### Step 4: The Commercial Norm Check (The Maxims)
  *Determine if the implication is misleading.*
  *   **Question:** Does the implied claim violate the Norms of Commercial Clarity?
  *   **Sufficient Answer:** Yes, if the implication creates a false belief about a material feature (Quality), hides a limitation (Quantity), or uses ambiguity to confuse (Manner).
  *   **Non-Cooperative Context:** We acknowledge the advertiser is selling, not chatting. Therefore, the Maxim of Quality is modified to "Do not create a false overall impression." The consumer knows you are selling, but expects you not to manipulate the *context* to manufacture value that isn't there.

  ### Step 5: The Cancellability & Evidence Threshold
  *Decide if small print cures the defect or if surveys are needed.*
  *   **Question:** Is the implied claim cancelled by qualifying text?
  *   **Sufficient Answer:** Cancellability is a **Diagnostic, Not a Remedy**.
      *   *Diagnostic:* If an implication can be cancelled by clear text, it confirms the implication was conversational, not literal.
      *   *Remedy:* Small print usually **fails** as a remedy. Why? Because it violates the Maxim of Manner (be perspicuous). Burying the truth in footnotes while shouting the implication in headlines creates a conflict. The "Dominant Impression" rule overrides Gricean cancellability.
  *   **Evidence Threshold:** Stop reasoning and order evidence if:
      1.  The "Minimum Necessary Inference" is ambiguous (e.g., does "average" mean "typical" to a layperson?).
      2.  The implication relies on specialized knowledge (e.g., financial APR calculations).
      3.  The panel cannot agree on the "Ordinary Consumer's" baseline knowledge.

  ---

  ## Part 2: Application to Test Cases

  Here is the procedure applied to the three pending cases.

  ### Case 1: Fruit Drink ("Made with real fruit juice", 3% volume)
  1.  **Literal:** True. Contains 3% juice.
  2.  **Relevance Gap:** Why highlight "real fruit juice" if the amount is negligible (3%)? Water also contains trace minerals, but we don't label water "Made with Minerals." The literal claim is trivial without an assumption of significance.
  3.  **Candidate Implicature:** "This drink contains a significant proportion of fruit juice" or "This is a fruit-based drink." (Minimum Necessary Inference: It is not just a chemical mix with a drop of flavoring).
  4.  **Commercial Norm:** Violates Quantity/Quality. The implication suggests a ingredient profile that drives value (health/taste) which the product does not possess.
  5.  **Cancellability:** Even if the ingredients list shows 3%, the headline dominates. The small print does not cure the Manner violation of the headline.
  *   **Ruling:** **Misleading.** The implication is strong, necessary for relevance, and false.

  ### Case 2: Store Window ("Up to 40% off", applies to one slow-moving line)
  1.  **Literal:** True. One item is 40% off.
  2.  **Relevance Gap:** A sign advertising a discount range implies availability. If only one obscure item qualifies, the sign is functionally useless as a sales incentive unless the consumer assumes *typical* stock is included.
  3.  **Candidate Implicature:** "Significant savings are available on a reasonable selection of goods."
  4.  **Commercial Norm:** Violates Relation. The ad invites the consumer in for a deal that does not exist for the vast majority of items. It manufactures a bargain environment.
  5.  **Cancellability:** "Up to" is a linguistic hedge, but it does not cancel the implication of availability. It merely sets a ceiling. Without "On selected lines only" in equal prominence, the implication stands.
  *   **Ruling:** **Misleading.** The implication of availability is necessary for the sign to function as an advertisement.

  ### Case 3: Mortgage ("Customers pay an average rate of 3.1%", Median 4.8%)
  1.  **Literal:** True. The arithmetic mean is 3.1%.
  2.  **Relevance Gap:** Consumers want to know what *they* will pay. "Average" is a mathematical term, but in common parlance, it often conflates with "typical" or "median."
  3.  **Candidate Implicature:** "A typical customer will pay around 3.1%."
  4.  **Commercial Norm:** Here is the friction. "Average" is a term of art. Unlike "Made with" (vague) or "Up to" (vague), "Average" has a defined mathematical meaning accessible to the public.
  5.  **Evidence Threshold:** **STOP.**
      *   *Reasoning:* The procedure cannot settle whether the ordinary consumer distinguishes "mean" from "median." In Cases 1 and 2, the implications were *particularized* (dependent on the specific context of juice or retail). Here, the implication is *generalized* (dependent on public understanding of statistics).
      *   *Blunt Assessment:* I know the panel instinct is to ban this as "statistical manipulation." However, under this procedure, **you cannot rule this misleading on the papers.** The word "average" is not inherently vague enough to trigger a automatic false implication without evidence that consumers are actually deceived by the distinction. The literal truth is robust. The implication is contestable.
  *   **Ruling:** **No Violation on the Papers.** (Requires consumer comprehension evidence to proceed).

  ---

  ## Part 3: The Surprise

  I anticipate Case 3 is the one that contradicts your expectation. You likely view the "Average vs. Median" discrepancy as a classic sin of misleading finance advertising, comparable to the fruit juice case.

  The procedure forces a different outcome. In the Fruit and Retail cases, the language ("Made with," "Up to") is inherently qualitative and vague; the context *forces* a specific quantitative implication to make sense. In the Mortgage case, the language ("Average") is already quantitative. The gap between the literal meaning (mean) and the implied meaning (typical) is not a *conversational* gap, but a *mathematical literacy* gap.

  Gricean implicature relies on the speaker exploiting a norm to convey extra meaning. Here, the advertiser is using a precise term that *happens* to be unfavorable. Unless we establish that "average" conversationally implies "median" to the ordinary consumer (which varies by demographic), we cannot say the advertiser *implicated* a falsehood. They stated a truth that looks bad. To rule against them without survey evidence is to punish them for math, not for communication. If you want to ban this, you must change the rulebook to require "Median" disclosure, not rely on the misleading advertising clause.

  ---

  ## Part 4: Limitations & Dropped Distinctions

  ### Where Judgment Wears a Procedural Costume
  This procedure cannot settle **Step 3 (Fixing Content)** when the "Minimum Necessary Inference" is subjective. Determining what makes an ad "relevant" enough to justify the claim is ultimately a value judgment. We dress this up as a "Relevance Gap," but two panelists may disagree on whether a 3% juice content is "trivial" or "a selling point." The procedure forces you to articulate the disagreement, but it does not resolve it. That remains your chair's prerogative.

  ### Dropped Distinctions (And Why It Is Safe)
  1.  **Generalized vs. Particularized Implicature:** Grice distinguishes between implications that arise from words themselves (Generalized: "I ate some" implies "not all") and those arising from context (Particularized: "It's cold in here" implies "close the window").
      *   *Why Dropped:* Distinguishing these requires linguistic training.
      *   *Why Safe:* Our "Relevance Gap" test absorbs both. Whether the implication comes from the word "average" or the context of the shop window, the test is the same: *Is this necessary for the ad to make sense?*
  2.  **Implicature vs. Presupposition:** Philosophers argue fiercely about whether "The King of France is bald" presupposes a King exists or implicates it.
      *   *Why Dropped:* For advertising, the effect on the consumer is identical.
      *   *Why Safe:* Our rulebook bans "misleading by implication." We treat presuppositions as a subset of implications. The legal outcome is the same regardless of the linguistic label.
  3.  **The Cooperative Principle:** As noted, advertising is not cooperative.
      *   *Why Dropped:* We replaced it with "Commercial Relevance."
      *   *Why Safe:* Grice's CP is about truth-seeking. Advertising is about value-exchange. The "Commercial Relevance" norm captures the consumer's expectation ("Don't waste my time with trivia") without falsely assuming the advertiser is their friend.

  **Final Instruction:** Use this checklist. If you reach Step 5 and feel uneasy about Case 3, remember: unease is not evidence. If you cannot reproduce the reasoning without saying "it just feels wrong," you must order the survey. That is the cost of a reproducible system.
