answer: |-
  **MEMORANDUM**

  **TO:** Strategic Foresight Panel
  **FROM:** [Your Name], Panel Philosopher
  **DATE:** Monday, October 23
  **SUBJECT:** Voting Guidance on Forecasting Tournament Structure

  **Bottom Line**
  I recommend we vote for the grad student's proposal to pay participants proportionally based on their absolute Brier scores rather than ranking them for a fixed prize. This restores "propriety" to the incentives, ensuring that telling the truth is the only way to maximize payout, which protects the integrity of the strategic plan. We must simultaneously exclude the Registrar and Budget Office staff from the prize pool due to their inside information, while still counting their forecasts toward the aggregate median.

  **What the Tournament Is Actually For**
  We often speak of this tournament as a competition, but that is only half its function. The prize crowns an individual winner, fostering engagement through rivalry. However, the forgotten half is that the pooled median forecast goes directly into the university's strategic plan. This creates a tension between rewarding an individual and producing a good collective forecast. If the incentive structure encourages participants to shade their probabilities to beat the crowd rather than reflect their genuine beliefs, the aggregate median shifts away from reality. We are harvesting wisdom to guide institutional strategy, not merely entertaining faculty. Therefore, we must prioritize the integrity of the strategic plan over the glamour of the competition. If the mechanism used to harvest wisdom poisons the well by distorting the inputs, we fail our primary mandate. The engine of participation must not corrupt the fuel of accuracy.

  **Why Relative Payoffs Break Propriety**
  The economist is correct: a fixed prize for top rank is not a proper scoring rule. A proper rule ensures you maximize expected reward only by reporting your true belief. Brier scores are proper in isolation, but awarding a prize based on *rank* makes payoffs relative. Consider a question: "Will state appropriations restore fully?" Suppose the crowd averages 20% probability. You believe 25%. In a proper absolute system, you report 25% to maximize your score. In a rank tournament, reporting 25% clusters you with the majority. If the event happens, you share the win; if not, you lose with the crowd. To win outright, you might shade to 40%. If you are right, you differentiate yourself and take the prize. If you are wrong, you lose anyway, so the downside is muted relative to the upside of winning alone. The payoff depends on others' errors, not just your accuracy. This incentivizes contrarianism or confidence inflation rather than truth-telling. The immodesty of a proper rule demands you own your confidence, but relative payoffs demand you own the crowd's weakness. When payoffs are relative, propriety breaks because the optimal strategy becomes predicting the competitors, not the world.

  **The Three Alternatives, Assessed Honestly**
  We must evaluate the proposed fixes without illusion. The statistician's log score is mathematically proper but psychologically punishing. It penalizes overconfidence exponentially; a 99% forecast that fails destroys your score. Participants will sandbag, clustering around 50% to avoid ruin, degrading the aggregate's resolution. The immodesty here buys us sharp distinctions between confident and unsure forecasters, but in a tournament, it buys fear. People will not dare write 0.95 again, flattening our data. The crowd-relative proposal scores you on how much you beat the mean. This fails completely; it incentivizes predicting the crowd's mistake rather than the world's state. If the crowd is biased low, you profit by going lower, regardless of truth. Only the grad student's proportional payout survives scrutiny. Paying everyone from the pool based on their absolute Brier score restores propriety. You maximize your payout by maximizing accuracy, independent of peers. The budget risk is manageable by normalizing scores to fit the $1,500 fund. This moves the distortion nowhere; it aligns private gain with public truth. It retains the immodesty of proper scoring—rewarding confident accuracy—without the rank-induced pressure to exaggerate for differentiation.

  **The Strongest Case for Keeping Winner-Take-All**
  We must acknowledge the winner-take-all model's utility: it drives participation. A $1,500 prize is a headline; proportional payouts look like nickels. If we dilute the prize, faculty may ignore the tournament, reducing the sample size. A smaller, biased crowd is worse than a larger, slightly shaded one. The wisdom of crowds relies on volume to cancel out individual noise. Furthermore, rank tournaments are simple to explain and administer. Complex scoring formulas reduce transparency. If the distortion from ranking is small compared to the noise reduction from having 100 participants instead of 20, the competitive model might yield a better aggregate simply through volume, despite the incentive misalignment. Engagement is a prerequisite for accuracy; without players, there is no forecast.

  **Recommendation and Implementation**
  Despite the engagement risk, I recommend we adopt the proportional payout model to secure data integrity for the strategic plan. We can mitigate participation risk by publicly highlighting top performers even if the cash is spread. Accuracy must not be sacrificed for excitement. Regarding the Registrar and Budget Office staff: they possess inside information on appropriation and enrollment questions. Including them in the prize pool creates an unfair advantage and incentivizes information hoarding. They should be ineligible for the cash prize but required to submit forecasts. Their data improves the median for the strategic plan without compromising the tournament's fairness. This separates the epistemic goal (truth) from the financial one (fairness). We will normalize the proportional payouts to ensure the $1,500 cap is respected, guaranteeing fiscal stability while restoring philosophical consistency to our incentives.
