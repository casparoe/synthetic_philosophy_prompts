  ### Part 5: Implications of the Diary-Line Ruling

  You asked what principle the group takes on board if they rule the Diary line a **Thought** (rather than NONE), and what changes downstream.

  **The Principle:**
  By ruling the Diary a Thought, the group commits to **Assertoric Intent as the sole criterion for Thought-Hood.** Ontological success (does the object exist?) is irrelevant to whether a thought is expressed; it only affects whether the thought has a truth value. The medium's *belief* that she is referring is sufficient to generate a thought.

  **Downstream Pressure:**
  *   **Row 6 (Fiction) becomes the outlier.** If Intent is all that matters, why is the novelist (Row 6) different? The novelist also intends to write sentences. The group must maintain a sharp distinction between *pretend assertion* (fiction) and *failed assertion* (error/delusion).
  *   **Row 8 (Astronomer) is secured.** If the Diary is a Thought, Row 8 is safe. Both are cases of sincere reference failure.
  *   **If they went the other way (Diary = NONE):**
      *   **Row 8 comes under immense pressure.** Why is the Astronomer's "Tenth Planet" a thought, but the Medium's "Vesh" a mock thought? Both are empty names.
      *   To save Row 8 while killing the Diary, Nadia would have to introduce a **Epistemic Status Constraint**: Scientific hypotheses generate thoughts; spiritualist claims do not. This would be a major deviation from Frege (who doesn't care about the *kind* of error, only the logical form). It would imply that "Thought" is a normative status granted by the community of inquiry, not a logical property of the sentence/sense.
      *   **Row 7 (In the stories...) might wobble.** If "Vesh warned me" is NONE because Vesh doesn't exist, does "Holmes lives..." become a Thought only because we prefix "In the stories..."? Yes, Row 7 survives, but the boundary between Row 6 and Row 8 becomes the critical battleground.

  **My advice:** Push hard on the Diary = Thought ruling. It keeps the logic cleanest (Intent vs. Pretense) and protects Row 8. Ruling it NONE forces you into the messy business of deciding which delusions count as "logic" and which count as "fiction."
