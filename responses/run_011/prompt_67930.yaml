  ### Part 4: The Decisive Test Case for Next Term

  To separate the surviving rules (specifically to test whether Nadia is truly a Sense-Theorist or if she's leaking Reference-Theory in Row 2), you need a case where **Sense differs, Reference is the same, but the speakers know the identity.**

  **The Case:**
  > Speaker A (who knows Cicero = Tully) says: "Cicero was Roman."
  > Speaker B (who knows Cicero = Tully) says: "Tully was Roman."
  > **Question:** Do these express the SAME thought or DIFF thoughts?

  **Why this separates the rules:**
  *   **If Nadia rules DIFF:** She is committed to **Strict Sense Individuation (Rule A)**. Row 2 (Hesperus/Description) must be explained away as "the astronomer and neighbor actually shared the same descriptive sense." This preserves the purity of Frege's puzzle but makes communication difficult.
  *   **If Nadia rules SAME:** She is admitting that **Reference/Content can override Sense (Rule B leak)**. This validates Row 2 but undermines Row 1. If Cicero/Tully are SAME when the identity is known, why are Hesperus/Phosphorus DIFF when the identity is unknown? It suggests thoughts are individuated by *facts*, not *modes of presentation*, once knowledge is secured.

  This case forces her to choose between the "Cognitive Significance" model (Row 1) and the "Objective Content" model (Row 2).

