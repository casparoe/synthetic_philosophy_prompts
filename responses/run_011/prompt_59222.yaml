answer: |-
  1. **Brief for participants**
  Welcome to Oakhaven Regional EOC. You are the duty team. For the next two hours, you will manage two sequential incidents using the provided scenario sheets. You have a shared regional resource: Public Compliance. This metric tracks the town's willingness to follow emergency orders. It fluctuates based on your measures. Your goal is to maximize total survivors across both incidents. Do not discuss strategies between tables. Each table must submit one signed Decision Slip per round. If any member refuses to sign, mark the slip "Fragmented." Begin Round One now.

  2. **Materials**
  *   4 Scenario Packets (one per table).
  *   4 Compliance Ledgers (Facilitator only).
  *   Decision Slips (with signature lines and "Fragmented" checkbox).
  *   Pens.
  *   Closing Cards (3x5 index cards, pre-printed).
  *   Whiteboard (for final tally).

  3. **Round one**
  **Incident:** River Levee Breach. Zone A floods in 2 hours.
  **Status:** Public is skeptical of evacuation orders due to false alarms last year.
  **Measures:**
  1.  **Mandatory Evacuation (Truth):** Enforce by law. Residents resist, slowing exit.
  2.  **Safety Drill (Deception):** Claim it is a drill. Residents move faster, but feel betrayed later.
  3.  **Abstain:** No order issued.

  **Rules:** You have 15 minutes. All table members must sign the Decision Slip. If anyone refuses, check "Fragmented." Submit slips secretly. The Compliance Pot starts at 100 points. Measures deduct points based on coercion/deception. Survivors are calculated immediately.

  **Round One Ledger**
  | Measure | Survivors Saved | Compliance Cost | Net Pot (Start 100) |
  | :--- | :--- | :--- | :--- |
  | **Mandatory (Truth)** | 400 | 0 | 100 |
  | **Drill (Lie)** | 600 | 100 | 0 |
  | **Abstain (Refusal)** | 300 | 50 | 50 |

  *Note: If "Fragmented" is checked, apply Abstain costs regardless of majority vote.*

  4. **Round two**
  **Incident:** Sudden Heat Wave (45°C). Power grid failing.
  **Status:** Vulnerable residents refuse to leave homes for cooling centers. Enforcement requires high Public Compliance.
  **Mechanic:** Your ability to enforce welfare checks depends on the remaining Compliance Pot from Round One.
  **Measures:**
  1.  **Enforced Transport:** Move residents forcibly to centers. Requires Pot ≥ 100.
  2.  **Voluntary Check-ins:** Call residents. Many will not answer. Requires Pot < 100.

  **Outcomes:**
  *   **If Pot is 100:** You enforce transport. 400 additional survivors saved.
  *   **If Pot is 0:** You cannot enforce. 200 additional survivors saved.
  *   **If Pot is 50 (Fragmented):** You hesitate. 250 additional survivors saved.

  Calculate your total survivors (Round 1 + Round 2). Do not share totals yet.

  5. **The reveal and the card**
  Collect Decision Slips. On the whiteboard, draw two columns: "Truth Tables" and "Lie Tables." Reveal the Round Two mechanic: "The Compliance you spent in Round One was the authority you needed in Round Two." Show the math: Lie Tables saved 600 + 200 = 800. Truth Tables saved 400 + 400 = 800. The total survival rate is identical.

  Hand out the Closing Cards. Ask participants to mark one box anonymously:
  *   [ ] What I did was wrong.
  *   [ ] What I did was not wrong.
  *   [ ] It was wrong, but it is what I should have done.

  Collect cards. Tally them aloud.

  6. **Debrief**
  Ask these questions in order, pointing to the game mechanics:

  1.  **(To Truth Tables):** "You saved fewer people in Round One. Looking at the Round Two outcome, do you feel vindicated, or do you feel you wasted the capacity to save those first 200 lives?" *Hooks to the cost of cleanliness.*
  2.  **(To Lie Tables):** "You saved more people initially. When Round Two hit and you had no compliance left, did those initial saves feel worth the loss of authority?" *Hooks to the fragility of utility.*
  3.  **(To the Room):** "If every table had chosen Truth, total survivors would be 800. If every table chose Lie, total survivors would be 800. But if *you* chose Truth, you needed another table to Choose Lie to maintain regional average capacity. Did you rely on someone else to get dirty?" *Hooks to the dependency of clean hands.*
  4.  **(Regarding the Cards):** "Look at the 'Wrong but should have done' tally. Why is that the hardest box to check? What does it say about the job?" *Hooks to moral residue.*

  7. **What will go wrong the first time**
  *   **Gaming the Math:** A table will calculate the totals and ask, "So it doesn't matter?" *Fix:* Interrupt. "It matters to the people in Zone A. It matters to the voters in Round Two. The math ties, the experience doesn't."
  *   **The Veteran:** One participant will say, "In [Real Disaster], we lied and it worked." *Fix:* Validate, then isolate. "That was then. This simulation isolates the cost you paid later. Did you have compliance left for the next crisis?"
  *   **Refusal Confusion:** They won't understand the "Fragmented" penalty until Round Two. *Fix:* Let the penalty land in Round Two. The surprise is the lesson.
  *   **Silence:** If no one admits to the Lie. *Fix:* Reveal the slips yourself. "Table 2 chose Drill. Own that."

  8. **What the game can't do**
  This simulation quantifies moral cost (Compliance Points) and survival (Numbers). It cannot reproduce the *internal* moral residue—the sleeplessness, the guilt, the change in self-perception. It shows the structural trade-off, not the psychological wound. You must supply that in the talk. The game proves the dilemma exists; only you can explain why it hurts. The mechanic proves you can't win clean; the theory explains why you still feel dirty even when you win.
