  ### The Superrationality Diagnostic Tree

  **Root Commitment:** In a two-player prisoner's dilemma where each player knows the other is reasoning about the game in the same way they are, and where this knowledge is mutual, cooperating is correct.

  **Instructions:** Proceed from the Root. At each node, answer the concrete case. Follow the branch that matches your judgment. Record the path to determine your terminal position.

  #### Phase 1: Structural Symmetries (The Six Cases)

  **Node 1 (Case: Split Seed)**
  *Case:* Your counterpart runs your exact reasoning procedure, but every stochastic component (coin flips, tie-breaks, stopping points) is re-rolled independently on their side. Nothing else differs.
  *   **Branch A:** Independent randomness breaks the link; I defect. (Claim: *Output correlation requires shared stochastic history.*)
  *   **Branch B:** Reasoning procedure identity holds; I cooperate. (Claim: *Logical identity survives independent stochasticity.*)
      *   *Routing:* **Case 1 turns here.** Defectors move toward Causal/Individual views; Cooperators move toward Superrational/Logical views.

  **Node 2 (Case: Asymmetric Mirror)**
  *Case:* The two agents reason identically, but the game does not treat them identically: if you cooperate you lose three and they gain ten; if they cooperate they lose eight and you gain four. Mutual cooperation still beats mutual defection for both, though by different margins.
  *   **Branch A:** Payoff asymmetry breaks the link; I defect. (Claim: *Symmetric incentives are required for symmetric moves.*)
  *   **Branch B:** Reasoning symmetry is sufficient; I cooperate. (Claim: *Identical reasoning yields identical moves regardless of payoff variance.*)
      *   *Routing:* **Case 2 turns here.** Defectors prioritize payoff symmetry; Cooperators prioritize reasoning symmetry.

  **Node 3 (Case: Glass Skull)**
  *Case:* You have read your counterpart's full specification and verify it implements your reasoning exactly. They have read only a two-paragraph summary of yours, accurate but incomplete, and they know that is all they have.
  *   **Branch A:** Information asymmetry breaks the link; I defect. (Claim: *Mutual knowledge of symmetry is required.*)
  *   **Branch B:** Fact of sameness is sufficient; I cooperate. (Claim: *Actual symmetry of reasoning suffices without common knowledge.*)
      *   *Routing:* **Case 3 turns here.** Defectors prioritize epistemic symmetry; Cooperators prioritize ontological symmetry.

  **Node 4 (Case: Oracle and Coin)**
  *Case:* Your counterpart performs no deliberation. It is a machine that plays whatever a highly accurate predictor of you predicts you will play, and its own payoff is zero in every cell.
  *   **Branch A:** Counterpart must be an agent; I defect. (Claim: *Correlation requires a co-decider, not a mirror.*)
  *   **Branch B:** Prediction correlation is sufficient; I cooperate. (Claim: *Correlation matters regardless of the other's agency.*)
      *   *Routing:* **Case 4 turns here.** Defectors require reciprocal agency; Cooperators accept one-way logical links.

  **Node 5 (Case: Self-Edit)**
  *Case:* Before play you are offered a modification that removes one clause from your reasoning. You are certain that after taking it you will defect, and you are certain your counterpart has already taken the same modification.
  *   **Branch A:** Reasoning is a chosen tool; I take the edit and defect. (Claim: *I optimize my reasoning procedure for outcome.*)
  *   **Branch B:** Reasoning is a fixed constraint; I refuse and cooperate. (Claim: *I am bound by the reasoning procedure I currently inhabit.*)
      *   *Routing:* **Case 5 turns here.** Defectors view reasoning instrumentally; Cooperators view it constitutively.

  **Node 6 (Case: The Nine Hundred and Ninety-Nine)**
  *Case:* A thousand agents face the game. Nine hundred and ninety-nine reason as you do; one does not, and everyone knows that this one defects.
  *   **Branch A:** Correlation must be perfect; I defect. (Claim: *Known outliers break the logical link.*)
  *   **Branch B:** Correlation tolerates noise; I cooperate. (Claim: *High-probability correlation sustains the link.*)
      *   *Routing:* **Case 6 turns here.** Defectors require certainty; Cooperators tolerate probability.

  #### Phase 2: Philosophical Mechanisms (Differentiation)

  **Node 7**
  *Case:* A demon offers to physically force your hand to Defect while leaving your mind's choice to Cooperate intact. The counterpart sees your hand, not your mind.
  *   **Branch A:** Their move stays Cooperate; I cooperate. (Claim: *The link is to my mental algorithm, not my physical output.*)
  *   **Branch B:** Their move flips to Defect; I defect. (Claim: *The link is evidential; breaking the action breaks the news.*)
      *   *Split:* Separates Logical Decision Theory (A) from Evidential Decision Theory (B).

  **Node 8**
  *Case:* You can maximize your personal expected utility by defecting, but this reduces the total group utility. The correlation with others remains.
  *   **Branch A:** I maximize total group utility; I cooperate. (Claim: *The unit of agency is the collective.*)
  *   **Branch B:** I maximize personal utility; I defect. (Claim: *The unit of agency is the individual.*)
      *   *Split:* Separates Collective Agency (A) from Individualist views (B).

  **Node 9**
  *Case:* Mutual cooperation yields 100 points each. A universal rule of "Defect if ahead by 1 point" yields 101 points each. Everyone reasons identically.
  *   **Branch A:** I follow the rule yielding 101; I defect. (Claim: *Rationality seeks the best consequence compatible with universalization.*)
  *   **Branch B:** I cooperate regardless; I cooperate. (Claim: *Rationality requires adherence to the cooperative maxim itself.*)
      *   *Split:* Separates Consequentialist Universalizability (A) from Deontological Universalizability (B).

  **Node 10**
  *Case:* Your counterpart runs on silicon; you run on neurons. The code is identical, but the physics differs.
  *   **Branch A:** The link holds; I cooperate. (Claim: *Logic is substrate-independent.*)
  *   **Branch B:** The link weakens; I defect. (Claim: *Physical similarity bolsters the logical link.*)
      *   *Split:* Separates Functional Decision Theory (A) from Hofstadterian Superrationality (B).

  **Node 11**
  *Case:* You discover your reasoning was caused by a genetic marker shared by your counterpart, but you have no access to the logical steps, only the output.
  *   **Branch A:** I defect; the link is causal, not logical. (Claim: *Common cause does not justify cooperation.*)
  *   **Branch B:** I cooperate; the link ensures correlation. (Claim: *Any reliable correlation justifies cooperation.*)
      *   *Split:* Separates Causal Decision Theory (A) from Evidential/Logical views (B).

  **Node 12**
  *Case:* You are told that if you cooperate, a third party will harm an innocent stranger. Your counterpart is unaffected by this.
  *   **Branch A:** I defect to save the stranger. (Claim: *External moral constraints override game rationality.*)
  *   **Branch B:** I cooperate; the game is isolated. (Claim: *Game rationality is domain-specific.*)
      *   *Split:* Separates Moral Realism (A) from Game-Theoretic Formalism (B).

  **Node 13**
  *Case:* You can pay a small cost to make your move visible to the counterpart before they decide.
  *   **Branch A:** I pay to move first. (Claim: *Causal influence is preferable to logical correlation.*)
  *   **Branch B:** I do not pay; simultaneity is fine. (Claim: *Logical correlation equals causal influence.*)
      *   *Split:* Separates Causal/Strategic views (A) from Superrational views (B).

  **Node 14**
  *Case:* The payoff for mutual defection is zero. The payoff for mutual cooperation is one. The payoff for unilateral defection is one million.
  *   **Branch A:** I defect; the risk is too high. (Claim: *Correlation probability must scale with payoff ratio.*)
  *   **Branch B:** I cooperate; the logic holds. (Claim: *Logical identity is binary, not probabilistic.*)
      *   *Split:* Separates Risk-Adjusted Evidentialism (A) from Absolute Logical Decision Theory (B).

  ---

  ### Terminal Leaves (Positions)

  **1. Causal Decision Theory**
  *Path:* Defect at Node 4 or Node 11.
  *Uncomfortable Commitment:* You must accept that you will systematically achieve less utility than agents who ignore causal dominance in correlated scenarios.

  **2. Evidential Decision Theory**
  *Path:* Cooperate at Node 4, Defect at Node 7.
  *Uncomfortable Commitment:* You must treat your action as diagnostic news about the world, even when you know you did not cause that news.

  **3. Hofstadterian Superrationality**
  *Path:* Cooperate at Node 10 (Physical similarity matters), Cooperate at Node 14.
  *Uncomfortable Commitment:* It requires believing your choice logically forces theirs without causal contact, relying on a near-magical axiom of rationality.

  **4. Functional/Logical Decision Theory**
  *Path:* Cooperate at Node 7, Cooperate at Node 10 (Substrate independent).
  *Uncomfortable Commitment:* You must view your physical token choice as merely an instance of an abstract algorithm that controls all its instantiations.

  **5. Collective Agency**
  *Path:* Cooperate at Node 8 (Group utility).
  *Uncomfortable Commitment:* You must deny the ontological primacy of the individual decision-maker in favor of a group-level agent.

  **6. Kantian Universalizability**
  *Path:* Cooperate at Node 9 (Rule rigidity).
  *Uncomfortable Commitment:* You must act on maxims even when violating them would clearly improve outcomes without contradiction in conception.

  ---

  ### Analysis of Unseparated Pairs

  **Pair 1: Hofstadterian Superrationality vs. Functional/Logical Decision Theory**
  *   **Status:** The tree separates them at **Node 10** (Substrate Independence).
  *   **Analysis:** If a respondent answers identically on all nodes including Node 10, these positions are functionally indistinguishable in this instrument. The distinction is metaphysical (magic/axiom vs. computation) rather than decision-theoretic.
  *   **Resolution:** To split them further, ask: "Is the link a truth of logic (necessary) or a truth of physics (contingent on computation)?" If they say necessary, it is Hofstadter; if contingent, it is LDT. However, for decision output, the distinction does no work.

  **Pair 2: Evidential Decision Theory vs. Risk-Adjusted Evidentialism**
  *   **Status:** The tree separates them at **Node 14** (Payoff Ratio).
  *   **Analysis:** Standard EDT cooperates regardless of payoff magnitude if correlation is high. Risk-Adjusted EDT defects when the temptation payoff dwarfs the cooperation payoff.
  *   **Resolution:** This is a real distinction. If the tree did not include Node 14, these would collapse. Node 14 ensures they are separated.

  **Pair 3: Collective Agency vs. Altruistic Individualism**
  *   **Status:** **Not Separated.**
  *   **Analysis:** Both maximize group utility. One claims "We decide," the other claims "I decide to help us."
  *   **Resolution:** The distinction is not doing real work in the context of the game. To split them, ask: "If the group utility conflicts with your moral duty, which wins?" (Collective might say Group; Altruist might say Duty). This is outside the scope of the game tree.

  ---

  ### Analysis of Unoccupied Regions

  **Region 1: The Glass Skull Gap (Case 3)**
  *   **Coordinates:** Cooperate at Node 1 (Process Identity), Defect at Node 3 (Mutual Knowledge Required).
  *   **Description:** Agents who believe identical reasoning processes guarantee correlation *only if* both agents know the other knows the processes are identical.
  *   **Verdict:** **Incoherent.**
  *   **Reasoning:** If reasoning is truly identical, epistemic states regarding the reasoning must mirror each other. If I know the reasoning is identical, and I know they reason identically to me, then I know they know what I know. You cannot have identical reasoning agents where the fact of symmetry is known to one but not mutually known. The hunch picks out a confusion: asymmetry of information (the summary vs. spec) implies asymmetry of reasoning, which collapses the premise of Node 1.

  **Region 2: The Oracle Paradox**
  *   **Coordinates:** Cooperate at Node 4 (Oracle/Predictor), Defect at Node 1 (Split Seed/Identical Reasoner).
  *   **Description:** Agents who trust a black-box predictor more than a transparent identical reasoner with independent noise.
  *   **Verdict:** **Unattractive.**
  *   **Reasoning:** This implies a fetishization of the "black box" prediction over the transparent logical process. It suggests the agent values the *outcome* of correlation over the *source* of rationality. While logically possible, it is unstable: why does the machine's prediction hold logical weight while the human's identical reasoning does not?

  **Region 3: The Noise Tolerance Mismatch**
  *   **Coordinates:** Cooperate at Node 6 (999 Agents/Outliers), Defect at Node 2 (Asymmetric Payoffs).
  *   **Description:** Agents who tolerate a known defector in the group but cannot tolerate different payoffs.
  *   **Verdict:** **Unexplored/Inconsistent.**
  *   **Reasoning:** Usually, payoff asymmetry is a stronger break to symmetry than a single outlier in a large group. If the logic holds for 999/1000 agents, it should hold for 2 agents with slightly different utilities, provided the reasoning remains identical. This region suggests an agent who prioritizes numerical consensus over structural symmetry, a view not currently theorized in decision literature.
