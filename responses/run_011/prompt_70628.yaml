answer: |-
  # RELATIONAL SURROGACY PROCEDURE (RSP)
  **Version:** 1.0 (Emergency/After-Hours)  
  **Authorized Users:** On-Call Hospitalist, Duty Social Worker  
  **Time Limit:** Triage (10 min), Full Assessment (90 min)  
  **Constraint:** Any recommendation to Withdraw Life-Sustaining Treatment (WLST) triggers automatic referral to Full Ethics Committee. This procedure determines *who speaks*, not *what decision* is made (unless Institutional Obligation triggers).

  ---

  ## PART 1: TRIAGE SCREEN (10 Minutes)
  *Goal: Confirm statutory vacuum and identify potential claimants.*

  **Step 1: Statutory Exclusion**
  *   **Question:** Is there anyone on the state's default surrogate list (spouse, adult children, parents, siblings) available and willing?
  *   **Who:** Hospitalist + Social Worker (SW).
  *   **Sufficient Answer:** "No one located" OR "Located but refuses/unavailable."
  *   **Insufficient Answer:** "Someone exists but we think they are bad." $\rightarrow$ Go to Step 2.
  *   **Stop "No":** Statutory surrogate present and willing. $\rightarrow$ **Chart:** "Statutory surrogate [Name] identified and accepting authority per state law."
  *   **Stop "Refer":** Surrogate exists but disputes another's claim. $\rightarrow$ **Chart:** "Contested surrogacy; refer to Ethics Committee."

  **Step 2: Claimant Identification**
  *   **Question:** Who is currently present or reachable claiming knowledge of the patient?
  *   **Who:** SW.
  *   **Sufficient Answer:** Names and relationship of all claimants (kin, friends, caregivers, community members).
  *   **Insufficient Answer:** "No one." $\rightarrow$ Go to Step 6 (Institutional Obligation).
  *   **Stop "Refer":** Claimant is a minor or legally incapacitated. $\rightarrow$ **Chart:** "Claimant [Name] lacks legal capacity; refer for guardianship."

  ---

  ## PART 2: FULL RELATIONAL ASSESSMENT (90 Minutes)
  *Goal: Assess Relational Standing (Identity + Solidarity) and Degradation.*

  **Step 3: Shared Identity Assessment ("The We")**
  *   **Question:** Can the claimant describe the patient's daily life, values, or history with specific detail that implies a shared "we" (e.g., "our Sundays," "when we lived together")?
  *   **Who:** SW interviews claimant.
  *   **Sufficient Answer:** Specific narratives linking claimant's life to patient's life over time (>6 months).
  *   **Insufficient Answer:** General knowledge ("He was nice") or purely professional knowledge ("I gave his meds").
  *   **Next:** If Sufficient $\rightarrow$ Step 4. If Insufficient $\rightarrow$ Step 5 (Solidarity Check).
  *   **Stop "No":** Claimant cannot demonstrate shared history. $\rightarrow$ **Chart:** "Claimant [Name] lacks shared identity history; standing denied."

  **Step 4: Solidarity Assessment ("The Goodwill")**
  *   **Question:** Has the claimant acted for the patient's good at cost to themselves (time, money, emotional labor) without expectation of payment or reward?
  *   **Who:** SW + Hospitalist.
  *   **Sufficient Answer:** Documented acts of care (transport, advocacy, unpaid visits) driven by concern.
  *   **Insufficient Answer:** Care provided solely as paid duty or sporadic contact.
  *   **Next:** If Sufficient $\rightarrow$ Step 5. If Insufficient $\rightarrow$ Step 5 (to see if others qualify).
  *   **Stop "No":** Claimant shows no goodwill action. $\rightarrow$ **Chart:** "Claimant [Name] demonstrates no active solidarity; standing denied."
  *   **Judgment Call:** *Paid caregivers.* If paid, did the relationship exceed transactional bounds? (Marked Step). **Responsibility:** Duty SW.

  **Step 5: Degradation Check (Domination/Deception)**
  *   **Question:** Is there evidence the relationship was founded on or maintained by the patient's abuse, the claimant's domination, or the patient's explicit repudiation while capacitated?
  *   **Who:** Hospitalist (Chart Review) + SW.
  *   **Sufficient Answer:** Chart documentation of abuse, restraining orders, or patient's prior verbal/written rejection of claimant.
  *   **Insufficient Answer:** Estrangement, anger, or family conflict without evidence of domination/abuse.
  *   **Stop "No":** Evidence of degradation found. $\rightarrow$ **Chart:** "Claimant [Name] disqualified due to degraded relationship (abuse/repudiation)."
  *   **Stop "Refer":** Claimant is statutory surrogate but degradation is ambiguous (e.g., estrangement without abuse). $\rightarrow$ **Chart:** "Statutory surrogate [Name] contested on relational grounds; refer to Ethics Chair."
  *   **Judgment Call:** *Estrangement vs. Abuse.* Does past anger equal domination? (Marked Step). **Responsibility:** Ethics Chair (On-Call).

  **Step 6: Institutional Obligation (The Relational Deficit)**
  *   **Question:** If no human claimant meets Identity + Solidarity thresholds, does the patient face a decision delay that harms them?
  *   **Who:** Hospitalist.
  *   **Sufficient Answer:** "Yes, treatment cannot wait for guardianship."
  *   **Insufficient Answer:** "We can wait." $\rightarrow$ **Stop:** Petition for guardianship.
  *   **Stop "Refer":** Decision involves WLST. $\rightarrow$ **Chart:** "No relational surrogate; WLST decision requires Full Committee."
  *   **Action:** If Yes + Non-WLST $\rightarrow$ Hospital assumes surrogate role.
  *   **Chart:** "No qualifying relational surrogate identified; Hospital assumes institutional obligation for best-interest decision."

  **Step 7: Final Recommendation & Sign-Off**
  *   **Question:** Does the recommended surrogate have higher Relational Standing (Identity + Solidarity) than any statutory alternative?
  *   **Who:** Attending Physician.
  *   **Sufficient Answer:** Yes.
  *   **Stop "No":** Statutory surrogate stands despite low solidarity. $\rightarrow$ **Chart:** "Statutory hierarchy prioritized over relational standing due to [Reason]."
  *   **Action:** Attending signs recommendation.
  *   **Chart:** "Dr. [Name] recommends [Surrogate Name] based on relational assessment; signed."

  ---

  ## PART 2.5: CRITICAL DISTINCTIONS & SAFEGUARDS

  **Preserved Distinctions:**
  1.  **Identity vs. Solidarity:** Step 3 measures *history* (Identity); Step 4 measures *action* (Solidarity). A long history without care (Identity only) is insufficient. Care without history (Solidarity only) is insufficient. Both are required for full standing.
  2.  **Standing vs. Authority:** This procedure grants *Standing* (the moral right to be heard). *Authority* (legal right to sign) remains with the statutory surrogate unless Step 5 (Degradation) disqualifies them or Step 6 (Institutional Obligation) triggers.
  3.  **Relational Deficit $\rightarrow$ Institutional Obligation:** Step 6 explicitly converts a lack of relationships into a duty for the Hospital. **Cost:** If this step is omitted, patients with no relationships receive delayed care via guardianship. This procedure mandates the Hospital act as the "community of last resort" to prevent neglect.

  **Deliberately Dropped:**
  1.  **Degrees of Personhood:** We do not score "how much of a person" the patient is. We score the *quality of the relationship*.
  2.  **Cultural Specificity:** We do not require the patient to be African or subscribe to Ubuntu. The *structure* (Identity + Solidarity) is applied universally. **Cost:** This risks imposing a communal framework on hyper-individualistic patients, but the alternative (statutory default) ignores their actual life context.

  ---

  ## PART 3: ESCALATION TABLE

  | Scenario | Disposition | Chart Language |
  | :--- | :--- | :--- |
  | **Warm relationship, no decision history** | **Refer** | "Claimant has identity/solidarity but no prior decision-making history; values clarification required by Committee." |
  | **Paid caregiver crossed into friendship** | **Allow (if Step 4 met)** | "Paid caregiver [Name] demonstrates solidarity exceeding transactional duty; standing granted." |
  | **Claimant is minor/incapacitated** | **No** | "Claimant [Name] lacks legal capacity to serve as surrogate; disqualified." |
  | **Patient repudiated while capacitated** | **No** | "Patient explicitly rejected [Name] while capacitated; identity bond severed." |
  | **Relationship founded on patient's past abuse** | **No** | "Relationship degraded by history of patient's abuse/domination; solidarity invalid." |
  | **Collective claimant (Congregation/Kin)** | **Refer** | "Communal authority claim exceeds individual surrogate scope; refer to Committee/Legal." |

  ---

  ## PART 4: CASE RUN-THROUGHS

  ### Case A: The Estranged Son vs. The Neighbor
  *   **Facts:** 78M, stroke. Son (Statutory #1) estranged 25 yrs, angry history, now visits daily. Neighbor (Off-list) 31 yrs, drove to dialysis, knows daily life.
  *   **Procedure Run:**
      *   Step 1: Son is Statutory. **Insufficient Answer** for "No one." $\rightarrow$ Step 2.
      *   Step 3 (Identity): Son (Blood/History) = Pass. Neighbor (31 yrs) = Pass.
      *   Step 4 (Solidarity): Son (Visits daily now) = Pass (Current action). Neighbor (Dialysis drive) = Pass.
      *   Step 5 (Degradation): Son (Estranged/Angry). Is this *Domination*? **Judgment Call.** Procedure requires evidence of domination/abuse to override Statute. Anger/Estrangement $\neq$ Domination.
      *   Step 7 (Sign-Off): Statutory hierarchy prioritized unless degradation proven.
  *   **Result:** **Son recommended.**
  *   **Unwelcome Result:** **This is the unwelcome case.**
  *   **Why:** You (the Director) prefer the "faithful off-list person." The Procedure protects the Statutory Surrogate unless *abuse* is proven. Estrangement is ambiguous. The Procedure prioritizes legal stability over relational nuance to avoid liability, overriding your prior. The Neighbor is relegated to "informant" status, not decision-maker.

  ### Case B: The Unbefriended Dementia Patient
  *   **Facts:** 91F, dementia. No kin. CNAs (6 yrs) + Deacon (10 yrs ago).
  *   **Procedure Run:**
      *   Step 1: No statutory. $\rightarrow$ Step 2.
      *   Step 3 (Identity): Deacon (Stopped attending 10 yrs ago) = Fail (No current "we"). CNAs (6 yrs care) = Pass (Shared daily life).
      *   Step 4 (Solidarity): CNAs (Paid). **Judgment Call:** Did they cross into friendship? If yes $\rightarrow$ Pass. If no $\rightarrow$ Fail. Let's assume strict reading: Paid = Transactional.
      *   Step 6 (Institutional Obligation): No human qualifies. Treatment cannot wait.
  *   **Result:** **Hospital assumes Institutional Obligation.**
  *   **Note:** If CNAs are deemed "friends," they speak. If not, the Hospital decides. Both avoid guardianship delay.

  ### Case C: The Religious Community vs. Prior Autonomy
  *   **Facts:** 44F, TBI. Elders want treatment. Patient previously refused + left community.
  *   **Procedure Run:**
      *   Step 3 (Identity): Patient left community 1 year ago. **Stop "No"** on Identity. Repudiation while capacitated severs the "we."
      *   Step 5 (Degradation): Patient repudiated community.
      *   Step 7 (Sign-Off): Community lacks standing. Prior written refusal stands.
  *   **Result:** **Honor prior refusal. Elders denied.**
  *   **Note:** Relational standing cannot override documented prior autonomy. The "community" no longer includes the patient.

  ---

  ## PART 5: FAILURE MODES & LIMITATIONS

  **1. The Confident Wrong Answer (Gaming the Solidarity Step)**
  *   **Risk:** Under time pressure, staff will accept "visiting daily" (Case A Son) as sufficient Solidarity to close the file, ignoring the 25-year estrangement.
  *   **Cost:** 15 minutes saved per consult.
  *   **Consequence:** Statutory surrogates with poor relationships retain authority; off-list caregivers are marginalized.
  *   **Mitigation:** Step 5 requires Ethics Chair sign-off on any Statutory Override.

  **2. The "Unidentified Patient" Gap**
  *   **Risk:** John/Jane Doe with no history.
  *   **Limitation:** Step 3 (Identity) is impossible.
  *   **Consequence:** Immediate trigger of Step 6 (Institutional Obligation).
  *   **Cost:** Hospital bears full liability for best-interest decisions without external validation.

  **3. Cultural Imperialism (Ubuntu Application)**
  *   **Risk:** Applying "Communal Personhood" to patients who valued radical individualism.
  *   **Limitation:** The procedure assumes relationships *matter* for authority.
  *   **Consequence:** May inadvertently disempower isolated patients who *chose* isolation.
  *   **Mitigation:** Step 3 allows "Shared Identity" to be negative (e.g., "We agreed to stay apart"). If isolation was the patient's chosen "way of being," the Institutional Obligation (Step 6) must respect that prior stance.

  **4. Judgment Call Transparency**
  *   **Marked Steps:** Step 4 (Paid vs. Friend), Step 5 (Estrangement vs. Abuse), Step 7 (Statutory vs. Relational).
  *   **Responsibility:** These cannot be run by algorithm. They require the **Ethics Chair on Call** to sign the chart note for any deviation from Statutory Hierarchy.
  *   **Chart Requirement:** "Deviation from statutory hierarchy approved by Ethics Chair [Name] based on [Specific Degradation Evidence]."

  **5. Time Cost**
  *   **Constraint:** 90 minutes is optimistic at 2 AM.
  *   **Failure:** If >90 mins, staff default to Guardianship.
  *   **Cost:** 3-6 week treatment delay.
  *   **Fix:** If 90 mins elapsed without resolution, trigger Step 6 (Institutional Obligation) for immediate medical needs, refer complex authority disputes to day-shift Committee.
