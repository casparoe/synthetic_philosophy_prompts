      *   **Topic:** Is Buddhist ethics consequentialist?
      *   **Case Study:** The 2007 Saffron Revolution in Burma (Myanmar), specifically the *patta-nikkujjana-kamma* (turning down of the bowl) by monks against the SPDC junta.
      *   **Constraint:** Do not rely on thought experiments (like the ship's captain); use the real historical episode. Do not simply recite standard summaries (Keown vs. Goodman/Garfield). Acknowledge where theories are silent.
      *   **Specific Tasks:**
          1.  **Mapping:** Identify the moral agent (individual vs. collective), the nature of the act (refusal vs. harm), and the timeframe/consequences (rebirth vs. immediate political outcome).
          2.  **Run Readings:** Apply Consequentialist (skillful means/outcomes) and Virtue/Intentional (cetana/inner state) readings. Identify where they fit and where they are silent/uncomfortable.
          3.  **Address Puzzles:**
              *   Is refusing a gift a harm (withholding merit vs. sparing bad kamma)?
              *   Does the Vinaya's rule-governed nature imply rule-consequentialism within a virtue framework?
          4.  **Conclusion:** What does this case do to the debate? Does it confirm one side, break both, or suggest a third description (e.g., speech act, legitimacy withdrawal)?

  2.  **Initial Brainstorming & Fact-Checking (Mental Check):**

      *   *Facts provided by user:* Accurate regarding the timeline (Aug-Sept 2007), the fuel price hike, the Pakokku incident, the ABMA ultimatum, the *patta-nikkujjana-kamma*, the crackdown, and the precedent (1990).
      *   *Vinaya Rule:* *Patta-nikkujjana-kamma* is indeed a specific Sanghakamma (act of the community). It requires a formal meeting, specific grounds (harming monks, disparaging Dhamma, etc.), and reversal upon reform.
      *   *The Tension:* The user highlights a mismatch. The Vinaya grounds are about offenses *against the Sangha/Dhamma*. The 2007 boycott was about offenses *against the people/state* (fuel prices, prisoners). This is the crux.
      *   *The Debate:* Keown (Virtue Ethics) vs. Goodman/Consequentialists (Utilitarian leanings in Mahayana/Engaged Buddhism).
      *   *Key Insight:* The user wants to know which reading breaks under the weight of *this specific case*.

  3.  **Drafting Section 1: Mapping the Moral Terrain:**

      *   *Agent:* This is tricky. Buddhism emphasizes individual kamma. But the *Sanghakamma* is a corporate act. The ABMA was an ad-hoc political body, not a canonical Chapter. So, is it individual monks acting in concert, or a collective agent? The tradition struggles with "collective kamma."
      *   *Act:* It's a refusal. But in a merit economy, refusal is a sanction. It's non-violent but coercive.
      *   *Consequences/Time:* Political consequentialism looks at weeks/months (regime change). Buddhist consequentialism looks at rebirths (saving beings from hell). The junta survived; monks suffered. Did the kamma pay off in the long run? Hard to measure.

  4.  **Drafting Section 2: Running the Readings:**

      *   *Consequentialist Reading:*
          *   *Argument:* The boycott was *upaya* (skillful means). Goal: End suffering (dukkha) for all beings. Cost: Risk to monks. Justification: Greater good.
          *   *Pressure Point:* The outcome was terrible (death, crackdown, regime survived). A strict consequentialist calculation fails here unless you count "long-term awakening of political consciousness" as the utility.
          *   *Silence:* Consequentialism struggles with the *Vinaya* mismatch. If the goal is good outcomes, why use a ritual designed for protecting monastic dignity?
      *   *Virtue/Intention Reading:*
          *   *Argument:* Kamma is *cetana*. If the monks acted out of compassion (*karuna*) and non-aversion (*adosa*), the act is wholesome, regardless of the bloody outcome.
          *   *Pressure Point:* The Vinaya rules are external. If the *reason* for the boycott (fuel prices) isn't a canonical ground, is the intention enough to validate a procedural violation?
          *   *Silence:* It can't judge the *political efficacy*. It retreats entirely into the black box of the mind.

  5.  **Drafting Section 3: The Two Puzzles:**

      *   *Puzzle 1: Withholding Merit.*
          *   Refusing alms denies the layperson a chance to make merit. Is this harm?
          *   *Counter:* It denies them the chance to make *bad* merit (supporting a tyrant).
          *   *Analysis:* This depends on whether you view the act as "punishment" (consequentialist leverage) or "protection of purity" (virtue). The tradition is ambiguous. It treats the bowl-turning as a sanction (harm to status) but also a protection (don't feed the corrupt).
      *   *Puzzle 2: Vinaya as Rule-Consequentialism?*
          *   The Vinaya is rule-based. It has procedures. It looks institutional.
          *   *Analysis:* It's not rule-consequentialism in the Benthamite sense. It's rule-virtue. The rules preserve the conditions for awakening.
          *   *Implication:* Using the *form* for a different *content* (political vs. monastic) breaks the link. It suggests the monks were borrowing institutional authority for a non-institutional end.

  6.  **Drafting Section 4: The Verdict & Third Description:**

      *   *Which reading breaks?* The Consequentialist reading breaks harder on the *outcome* (regime survived, people died). The Virtue reading survives better because it can retreat to "pure intention," but it strains against the Vinaya procedural mismatch.
      *   *Actually, the real tension:* The user notes the Vinaya grounds are about offenses *against the Sangha*. The 2007 boycott was about offenses *against the People*.
      *   *Third Description:* **Legitimacy Withdrawal / Symbolic Speech Act.**
          *   The act wasn't primarily about karmic calculation (consequentialism) or just inner purity (virtue). It was about *symbolic capital*.
          *   In Theravada cosmology, the King rules by Dhamma. If the Sangha rejects the King, he is no longer a Dhamma-King. He is a tyrant.
          *   This explains why they used the *Vinaya* ritual even if the grounds were stretched. They needed the *cosmological weight* of the ritual, not just a protest march.
          *   This fits neither Keown nor Goodman perfectly. It's sociological-cosmological.

  7.  **Refining and Polishing:**

      *   *Tone:* Academic, rigorous, avoiding platitudes.
      *   *Check:* Did I address the "collective agent" issue? Yes. Did I address the "Vinaya grounds mismatch"? Yes.
      *   *Crucial nuance:* The user pointed out the Vinaya grounds are specific (harm to monks/Dhamma). The 2007 application expanded this to "harm to people." This is a *reinterpretation* of the Vinaya.
      *   *Consequentialist Weakness:* If the outcome is the metric, 2007 is a failure.
      *   *Virtue Weakness:* If intention is the metric, why the ritual? Why not just walk away? The ritual implies a social sanction, not just personal purity.
      *   *Final Decision:* The case exposes that the "Consequentialist vs. Virtue" debate is often a Western import that misses the *cosmological* function of the Sangha. The act was about maintaining the cosmic order, not just maximizing utility or expressing virtue.

  8.  **Self-Correction during drafting:**
