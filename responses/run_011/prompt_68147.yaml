      *   *Refining the "Darwin on the Beagle" point:* If Darwin dies in 1836, there is no 20-year gestation. Wallace publishes in 1858. Does someone else write the *Origin*? No. Wallace writes a paper. The *Origin* is a specific rhetorical act. The host claims the *Origin* appears in 1858 unchanged. That implies someone else writes Darwin's book. That's absurd. I need to make sure this point lands hard.

      *   *Refining the "Waste of Time" point:* Historians of science (like Kuhn or Shapin) care about priority because it reveals *how* knowledge is constructed, not just *who* was first. It shows the social network. Dismissing it ignores the sociology of science.

