  Here is a principle that fits your data, resolves your confusion on the "missing record" cases, and holds up to the rigor you're used to.

  ### The Principle: Differential Predictive Power

  **Distrust of an official account is warranted only when the observed evidence (or absence of evidence) is significantly more probable under the hypothesis of deception than under the hypothesis of truth.**

  In Bayesian terms: You are looking for a likelihood ratio where $P(Evidence | Deception) \gg P(Evidence | Truth)$. If the evidence is equally likely under both hypotheses, the evidence is diagnostic noise, and distrust is unwarranted.

  #### Why this fits your cases:

  *   **Case 1 (Sensor Spec):** A company claiming their sensor works is probable under both Truth and Deception. However, you know the *process* is self-policed. The absence of *independent* validation is the evidence. $P(No Independent Check | Deception) \approx 1$, while $P(No Independent Check | Truth) < 1$ (honest actors often seek verification). Distrust is warranted as a prior adjustment.
  *   **Case 2 (Reanalysis):** Independent lab gets same result. $P(Same Result | Truth)$ is high. $P(Same Result | Deception)$ is low (unless the second lab is also compromised). Trust warranted.
  *   **Case 3 (Water):** County says "Fine." Households taste "Pennies." Uni finds "Lead."
      *   $P(County Says Fine | Lead)$ is high (liability incentive).
      *   $P(County Says Fine | No Lead)$ is high.
      *   *However*, $P(Uni Finds Lead | Lead)$ is high, and $P(Uni Finds Lead | No Lead)$ is low (assuming Uni competence).
      *   The households' taste is weak evidence ($P(Taste | Lead)$ is moderate), but combined with the Uni lab, the ratio shifts.
  *   **Case 4 (Grant Money):** Accuser claims fraud because grants exist.
      *   $P(Report Published | Fraud)$ is high (need money).
      *   $P(Report Published | Truth)$ is also high (need money).
      *   The motive exists in both states. The evidence has no predictive power. Distrust unwarranted.
  *   **Case 5 (Missing Drug Trials):**
      *   $P(Missing Negative Trials | Deception/Bias)$ is very high (profit incentive).
      *   $P(Missing Negative Trials | Truth)$ is low (norms require registration/publication).
      *   The absence is a strong signal. Distrust warranted.
  *   **Case 6 (Missing Whistleblower):**
      *   $P(No Whistleblower | Deception)$ is high (fear/retaliation).
      *   $P(No Whistleblower | Truth)$ is *also* high (nothing to report).
      *   The absence is consistent with *both* hypotheses. It has zero predictive power. Inferring safety from it is a logical error. Distrust of the inference is warranted.
  *   **Case 7 (Climate Consensus):**
      *   $P(Global Consensus | Warming)$ is high (convergent data).
      *   $P(Global Consensus | No Warming)$ is extremely low (would require global coordination across competing nations/labs).
      *   Trust warranted.

  #### Application to Your Student

  **The Case:** Your student believes the journal rejected his paper to protect a rival's priority claim.

  **Apply the Principle:**
  *   **Hypothesis A (Deception/Corruption):** Journal rejects good paper to protect rival.
  *   **Hypothesis B (Truth/Competence):** Journal rejects paper due to flaws, scope, or space.
  *   **The Evidence:** Rejection letter (generic or critical).
  *   **Predictive Power:** $P(Rejection | Corruption)$ is high. But $P(Rejection | Competence)$ is *also* high (most papers are rejected for mundane reasons).
  *   **Verdict:** Unless the student can show that the rejection *process* was structurally compromised (e.g., the rival was the anonymous reviewer *and* the editor ignored a conflict of interest declaration), the evidence (rejection) is equally probable under both hypotheses.
  *   **Conclusion:** **Distrust is not warranted.** It is a classic case of attributing to malice what is adequately explained by the base rate of rejection.

  #### The Verdict You Must Drop

  You asked me to tell you straight which verdict to drop. You must refine **Case 3 (The Water)**.

  **Your Verdict:** "Siding with the households over the county: warranted."

  **The Correction:** Siding with the **households** is not scientifically warranted. Siding with the **University Lab** is.

  **Why:** Under the Principle of Differential Predictive Power, the households' sensory data ("tastes like pennies") has a weak likelihood ratio.
  *   $P(Taste Like Pennies | Lead)$ is moderate (not everyone tastes it, placebo effect exists).
  *   $P(Taste Like Pennies | No Lead)$ is non-zero (other minerals, psychological suggestion).
  *   $P(Uni Lab Finds Lead | Lead)$ is very high.
  *   $P(Uni Lab Finds Lead | No Lead)$ is very low (assuming calibration).

  By grouping the households with the University, you are granting epistemic authority to anecdote that it does not possess. If the University Lab had *not* found lead, siding with the households against the County assay would have been **unwarranted**. The households were the *canary*, but the University was the *instrument*. Your distrust of the County was warranted by the University's data, not the households' tongues.

  **Summary:**
  1.  **Principle:** Differential Predictive Power (Is the evidence more likely if they are lying?).
  2.  **Student Case:** Distrust unwarranted (Rejection is common in both truth and corruption).
  3.  **Drop:** The epistemic weight given to the households in Case 3. Trust the instrument, not the anecdote.
