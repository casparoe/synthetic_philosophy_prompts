  ### Ranking & Justifications

  **1. Argument-Proves-Too-Much (7.75)**
  Logically the sharpest tool because it attacks the inference structure itself without conceding theological ground, though it risks looking like a deflection if not carefully nuanced.

  **2. Post-Mortem Opportunity (6.50)**
  Effectively neutralizes the "finality" premise of Schellenberg's argument, but loses portability points since it requires commitment to an afterlife theology not all theists share.

  **3. Soul-Making (6.50)**
  The standard workhorse reply that balances plausibility with theological cost, though it struggles to explain why hiddenness must be so intense for specific individuals.

  **4. Non-Resistant Nonbelief Denial (6.25)**
  Scores high on cost and portability because it changes nothing about God, but collapses on force and survivability because it contradicts the lived experience of many sincere seekers.

  **5. Skeptical Theism (5.75)**
  Stops the logical inference cold, but the theological cost is devastatingly high, potentially undermining moral knowledge and prayer alongside hiddenness.

  **6. The Seeking Reply (5.75)**
  Offers a meaningful account of relational value, but has low survivability because it is empirically vulnerable to those who claim to have sought diligently without result.

  **7. Proper-Function / Cognitive-Faculty (4.75)**
  Internally consistent for specific theological traditions, but scores poorly on portability and survivability because it requires the nonbeliever to accept a diagnosis of their own cognitive brokenness.

  ***

  ### Final Note on the "Vibes"
  The numbers for **Force** and **Survivability** on Replies 1 and 5 are where I'm most willing to fight in a room. I think denying the phenomenology of non-resistance (Reply 1) is logically weak (Force 4) and dialectically dead (Survivability 3). The numbers for **Cost** on Skeptical Theism (Reply 2) are the ones I'd defend most aggressively; if you teach skeptical theism, you must acknowledge it eats away at other parts of the theistic picture. The rest are pedagogical estimates to help your students see the trade-offs.
