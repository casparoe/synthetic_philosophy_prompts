          *   Opportunity: Donor offers funding for a high-res milled resin replica of one metope (better surface info than plaster).
          *   Complication: Conservator found 4 pieces are likely *not* from the 1911 workshop. They look 1930s/40s, possibly molded off the 1911 casts *in-house*. One might be a cast of a 19th-century "fake reconstruction," not an ancient original.
          *   Stakeholder Camps:
              *   A: Dispose of plaster, take replica (Efficiency/Fidelity).
              *   B: Keep plaster, decline replica (Provenance/Pedagogy of the past).
              *   C: Do both (Hybrid/Exhibit copying).
      *   **The "Wrinkle":** Provenance and Fidelity are decoupled. The 1911 invoice is wrong for 4 pieces. Camp B's "chain of custody" argument is weakened for these pieces (indoor descent). Camp A's "dispose" argument threatens unique evidence about the 1930s/40s in-house casting.
      *   **Requirements:**
          *   Specific recommendation (Disposition of set, disposition of 4 disputed pieces, Yes/No on donor money).
          *   Timeframe, responsibilities, contingencies (if findings are wrong).
          *   Steelman the rejected camps (show understanding).
          *   No vague "further study" – specific tests/pieces/outcomes.
          *   Tone: Professional, academic, decisive but nuanced, suitable for a committee vote.
          *   Personal touch (optional but helpful for voice): Acknowledge the writer's background (faculty, local kid) without making it about *them*.

  2.  **Determine the Recommendation:**

      *   *Option A (Dispose)* is too aggressive given the conservator's finding about the 4 unique pieces. Destroying the only evidence of 1930s in-house casting is bad collections management.
      *   *Option B (Keep All/Decline Replica)* ignores the pedagogical value of the high-res replica and the poor condition of the main set. It also relies on a provenance narrative that is partially false (the 4 pieces).
      *   *Option C (Hybrid)* is the strongest path, but needs refinement to address the "Wrinkle."
      *   *Decision:* A modified Option C.
          *   **Main Set (1911 verified):** Conserve selectively (stabilize, don't over-restore) + Accept Donor Money for the Replica. Use the contrast for teaching (1911 pedagogy vs. Digital pedagogy).
          *   **The 4 Disputed Pieces:** Segregate and Conserve as "Archival/Study Objects" regarding *university history*, not classical antiquity. Do not display as antiquities.
          *   **Donor Money:** Yes, but with a caveat on labeling.
          *   **Contingency:** If scientific testing proves the 4 pieces *are* 1911 after all, they rejoin the main set. If testing proves the "fake reconstruction" is indeed a fake, it becomes a primary object for the history of forgery.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **Background:** Briefly summarize the collection, condition, and donor offer.
      *   **The Complication (The Conservator's Findings):** Detail the 4 disputed pieces. This is the crux of the argument.
      *   **Analysis of Positions (Steelmanning):**
          *   Address Camp A (Fidelity/Efficiency): Acknowledge the plaster is derivative and damaged.
          *   Address Camp B (Provenance/History): Acknowledge the plaster *is* the history of the department, even if the chain to antiquity is broken.
          *   Address Camp C (Hybrid): The middle ground, but needs the nuance of the "Wrinkle."
      *   **Recommendation:**
          *   Disposition of Main Set.
          *   Disposition of 4 Disputed Pieces.
          *   Donor Offer.
          *   Timeline/Responsibilities.
          *   Contingencies (The "If/Then" for further study).
      *   **Conclusion:** Final persuasive push.

  4.  **Refining the Argument (The "Wrinkle" Integration):**

      *   I need to make sure the memo explains *why* we keep the 4 pieces if we are admitting they aren't "good" casts of antiquities.
      *   *Argument:* They are artifacts of *our* museum's history, not artifacts of *Greece's* history. They document a period of local making (1930s/40s) and the history of taste (the fake reconstruction).
      *   *Argument for Replica:* It serves the "Camp A" goal of surface fidelity without requiring the destruction of the "Camp B" historical artifact. They teach different things.
      *   *Argument against Disposal:* Destroying the 4 pieces destroys evidence of the 1930s/40s activity.

  5.  **Drafting - Tone and Voice:**

      *   Needs to sound like a faculty member: analytical, precise, respectful of procedure.
      *   Avoid overly emotional language about the "kid in the lobby" story, but let it inform the respect for the objects. (Actually, better to keep it professional; the prompt says "Personal stake, briefly" as context for me, not necessarily for the memo text. I will keep the memo professional but empathetic).
      *   Ensure the "Steelman" sections feel genuine. "Members arguing for disposal are correct that..."

  6.  **Addressing Specific Constraints:**

      *   *Timeframe:* March vote -> Action by September (start of academic year).
      *   *Who:* Curator, Conservator, Faculty Lead.
      *   *Contingency:* Specific test (XRF or material analysis) on the binder/additives to date the 4 pieces.
      *   *No Vague Study:* Name the test (Gas Chromatography-Mass Spectrometry for binder dating).

  7.  **Review and Polish:**

      *   Check against the prompt's specific "Wrinkle" logic. Does the memo address how Camp B's argument fails on the 4 pieces? Yes, by reclassifying their value from "antiquity chain" to "institutional chain."
      *   Does it address Camp A? Yes, by accepting the replica for fidelity.
      *   Is the recommendation specific? Yes.
      *   Is the formatting correct? Yes.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm overruling the conservator. I am using her findings to drive the policy.
      *   *Correction:* Ensure the donor money acceptance is conditional on accurate labeling (don't call the replica "the Parthenon").
      *   *Correction:* Make sure the "4 pieces" aren't just thrown in a box. They need a specific designation.

