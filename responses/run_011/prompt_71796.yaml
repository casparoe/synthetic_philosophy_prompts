answer: |-
  Here are ten questions ranked to systematically dismantle the "exploitability is a definition" shutdown move. They move from the mechanical assumptions of the argument to the metaphysical status of the claim, ending with a genuine off-ramp.

  **Note on Delivery:** The "Setup" lines are context you can read if the conversation is slow, but **trim them** if she is answering quickly. The "Question" is the core breath. The "Follow-up" is your prepared strike based on her standard playbook.

  ### 1. The Transaction Cost Trap
  **Setup:** The money pump requires a trader to offer bets costlessly and endlessly.
  **Question:** If transaction costs exist, the pump fails. Does that mean rationality disappears when trading gets expensive?
  **Predicted Answer:** It's an idealization, like frictionless physics.
  **Follow-up:** In physics, frictionless models predict real motion. Here, friction *prevents* the predicted loss. Is this idealization harmless, or is it secretly the load-bearing wall?

  ### 2. The Foresight Objection
  **Setup:** A sophisticated agent sees the cycle coming and refuses the first trade.
  **Question:** So the loss is never actual, only counterfactual. Are you defining irrationality as a hypothetical vulnerability rather than an actual harm?
  **Predicted Answer:** Vulnerability is enough; you *would* lose if you didn't stop.
  **Follow-up:** Then a hermit with no traders to exploit them is perfectly rational. Did their mind improve when the market closed?

  ### 3. The Locus of Irrationality
  **Setup:** You tie irrationality to the possibility of being pumped by others.
  **Question:** Is "being pumpable" a fact about my cognitive architecture, or a fact about the predators in my environment?
  **Predicted Answer:** It's about the architecture; the traders just reveal it.
  **Follow-up:** If it's about the architecture, why do we need the traders to demonstrate it? Why not just inspect the architecture directly?

  ### 4. The Lexicographic Edge Case
  **Setup:** Some people rank avoiding catastrophe above any sum of money. They have no exchange rate.
  **Question:** They can't be pumped because they won't trade safety for cash. Are they irrational for lacking a price?
  **Predicted Answer:** They violate the continuity axiom, so they aren't expected utility maximizers.
  **Follow-up:** But your definition is exploitability. If they can't be exploited, on what grounds do you condemn them?

  ### 5. The Diachronic Problem
  **Setup:** Standard Bayesians can be Dutch-booked if they forget part of their evidence.
  **Question:** If a perfect updater gets booked due to forgetting, is the updating rule wrong or the pump argument too broad?
  **Predicted Answer:** Forgetting violates conditionalization, so it's an error.
  **Follow-up:** But I can't choose to remember. Are you saying rationality requires cognitive powers humans don't have?

  ### 6. The Money Proxy
  **Setup:** The pump uses money to prove utility inconsistencies, assuming linear value for cash.
  **Question:** If I'm risk-averse, the value of money isn't linear. Does the pump only work if we assume rational agents must be risk-neutral?
  **Predicted Answer:** We adjust for marginal utility; the pump works in utility space, not dollars.
  **Follow-up:** But the trader pays dollars. If my utility for dollars curves, the cycle doesn't close. Is the pump a logical proof or just a story about risk-neutrality?

  ### 7. Normative vs. Constitutive
  **Setup:** You argue these axioms aren't optional rules but definitions of belief.
  **Question:** Is your claim normative—we *ought* to satisfy axioms—or constitutive—satisfying them is what belief *is*?
  **Predicted Answer:** Constitutive; it's a representation theorem.
  **Follow-up:** If it's constitutive, isn't the money pump just a dramatic restatement of a math theorem? What explanatory work is the *story* doing?

  ### 8. The "Definition" Fiat
  **Setup:** You often reply to objections by calling exploitability a definition, not a heuristic.
  **Question:** If I define "bachelor" as "unmarried man," I can't argue against it. If you define "rational" as "unpumpable," aren't you immune to criticism by fiat?
  **Predicted Answer:** It's an explication of a pre-theoretic concept, not a stipulation.
  **Follow-up:** Which pre-theoretic intuitions are you preserving, and which are you overwriting to make the math fit?

  ### 9. Scalar Rationality
  **Setup:** Most people violate these axioms slightly without financial ruin.
  **Question:** If the cost of inconsistency is usually pennies, why is the requirement for consistency absolute?
  **Predicted Answer:** Logic is binary; you're either consistent or you're not.
  **Follow-up:** Then almost no humans are rational. Is your theory a guide for living, or a description of angels?

  ### 10. The Falsification Condition
  **Setup:** I want to end on where you might be wrong.
  **Question:** What empirical or formal result would convince you that exploitability is *not* the definition of irrationality?
  **Predicted Answer:** (Open)
  **Follow-up:** (Listen. If she says "nothing," press: "Then it's theology." If she gives a condition, ask: "Why isn't *that* the definition instead?")
