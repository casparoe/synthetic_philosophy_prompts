answer: |-
  The bad step is **(6)**.

  Here is the diagnosis of the error, why it is seductive, the conditions required to repair it, the cost of that repair, and an evaluation of your retreated claim.

  ### 1. Which step fails and why?
  Step (6) fails at the inference: **"...so it can be beaten; and a strategy that can be beaten is dominated."**

  In your test case, Row's strategy **U** is not optimal (its security level is 0, while the game value is 2). Consequently, it "can be beaten" in the sense that Column has a strategy (the optimal mix $0.5L + 0.5R$) that holds Row to a payoff of 1.5, which is less than the value 2 (and less than what D guarantees).

  However, **U is not dominated.** As you noted in your test case analysis, **U** is a best reply to **L**. By Step (1), a strategy is strictly dominated if and only if it is *never* a best reply to any belief (mixed strategy) of the opponent. Since **U** is a best reply to **L**, it cannot be strictly dominated by any pure or mixed strategy of Row.

  The logical error is a quantifier swap regarding the opponent's strategies:
  *   **Not Optimal (Exploitable):** There exists *some* opponent strategy $y$ such that $x$ performs poorly (specifically, below the value).
      *   $\exists y, u(x, y) < v$
  *   **Dominated:** There exists *some* alternative strategy $x'$ such that $x'$ performs better against *all* opponent strategies $y$.
      *   $\exists x', \forall y, u(x', y) > u(x, y)$

  Step (6) assumes that if a strategy is vulnerable to *some* counter-strategy (exploitable), there must be a single alternative that outperforms it against *every* counter-strategy (dominated). Your counterexample proves this false: **U** is vulnerable to Column's mix, but superior to **D** against Column's **L**.

  ### 2. Why did it survive scrutiny?
  This step survives scrutiny because in **strictly determined games** (games with a pure strategy saddle point where the saddle point strictly dominates alternatives), exploitability and dominance often coincide. If a game has a unique pure equilibrium $(s_1, s_2)$ and all other strategies are strictly worse against all opponent replies, then non-optimal strategies are indeed dominated.

  Furthermore, the language "can be beaten" is ambiguous. In casual discourse, if a strategy yields a loss against a rational opponent, we say it is "beaten." In technical game theory, "beaten" (dominated) has a much stronger condition (uniform superiority of an alternative). The argument smuggles the colloquial meaning into the technical conclusion.

  ### 3. What would have to be true for it to be true?
  For Step (6) to hold, the game must satisfy the condition that **the set of rationalizable strategies coincides exactly with the set of optimal (maximin) strategies.**

  This occurs if and only if the game is **dominance-solvable down to the optimal set**. In such games, every strategy that is not part of a maximin solution is strictly dominated (possibly iteratively). This is true for:
  1.  Games with a unique pure strategy Nash equilibrium where the equilibrium strategies strictly dominate all others.
  2.  Games where iterated deletion of strictly dominated strategies (IDSDS) reduces the game to a single profile (or a block of profiles that are all optimal).

  It is *not* true for games like Matching Pennies or your test case, where optimal play requires mixing or where non-optimal pure strategies remain best replies to non-optimal opponent strategies.

  ### 4. What does the account lose without it?
  By surrendering Step (6), you lose the claim that **Dominance Reasoning = Equilibrium Reasoning**. You must accept the standard distinction between:
  *   **Rationalizability:** Strategies consistent with common belief in rationality (survive IDSDS).
  *   **Equilibrium/Optimality:** Strategies that are best replies to *correct* beliefs (Nash/Minimax).

  Without Step (6), you cannot derive the Minimax Theorem from Dominance alone. You lose the ability to solve zero-sum games purely through the elimination of "irrational" moves. You are forced to acknowledge that a rational player might play a non-optimal strategy (like **U** in your example) if they have a specific belief about the opponent (that Column will play **L**), even if that belief is incorrect in equilibrium. Dominance filters out strategies that are *never* sensible; Equilibrium filters out strategies that are sensible only under *incorrect* beliefs.

  ### 5. Evaluation of the Retreated Claim
  *Claim:* "Iterating dominance recovers the equilibrium set exactly in those zero-sum games where it collapses the game to a single profile."

  **Is it a theorem?**
  **Yes.** If IDSDS reduces a finite game to a unique strategy profile $(s_1^*, s_2^*)$, that profile is the unique Nash Equilibrium of the game.
  *Proof Sketch:* Any Nash Equilibrium must survive IDSDS (Step 3). If only one profile survives, it must be the only Nash Equilibrium. In zero-sum games, this unique profile must also be the optimal (maximin) solution.

  **How much of zero-sum game theory does it leave outside?**
  **Almost all of it.**
  This retreat restricts your theorem to the class of **dominance-solvable games**. This excludes:
  1.  **Matching Pennies:** No strategies are dominated; IDSDS deletes nothing. The equilibrium is fully mixed.
  2.  **Your Test Case:** IDSDS deletes nothing; equilibrium involves a mix for Column and a pure strategy for Row that wasn't distinguished by dominance.
  3.  **Poker Models / Bluffing Games:** These rely fundamentally on mixing to keep the opponent indifferent. Dominance rarely solves these games completely.

  Zero-sum game theory is largely the study of how to solve games *when dominance fails*. The Minimax Theorem is powerful precisely because it guarantees a solution (value and optimal strategies) even when no strategies can be eliminated by dominance. By retreating to dominance-solvable games, you retain a trivial truth (dominance finds the NE when dominance solves the game) but surrender the explanatory power needed for the vast majority of competitive strategic interactions.
