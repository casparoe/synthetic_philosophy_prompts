answer: |-
  The editor is right.

  Her judgment is correct because in fiction, narrative symmetry inevitably constructs moral symmetry. You argue that you can maintain subjective innocence while acknowledging objective asymmetry ("a man may be doing the only thing he can see to do... while the two of them are nonetheless not in the same position"). Philosophically, you are correct. But structurally, your current draft proves your editor's point: by stripping away every marker of objective difference, you have erased the asymmetry from the reader's reality.

  The reader lives entirely inside the text. If the text offers no friction, no weight, and no environmental distinction between the two sides, the reader has no basis to feel that the soldiers occupy different moral positions. You intend to write about the tragedy of good men trapped in unequal circumstances; your current method writes about the nihilism of a war where circumstances do not matter. The result is not a nuanced exploration of guilt, but a "dodge," as your editor says, because it removes the stakes required to make the guilt meaningful.

  However, your editor is wrong to claim that "you cannot have both." You *can* have subjective symmetry and objective asymmetry, but you must achieve it through **asymmetry of experience rather than asymmetry of information.**

  To resolve this, you must keep your stylistic constraints (no flags, no names, no explicit propaganda) but break the interchangeability of their situations. One soldier should be fighting on ground that smells like his childhood; the other should be sleeping in mud that feels foreign. One should be receiving letters from a family that is hungry because of a blockade; the other from a family that is safe but fearful of invasion. One should be advancing; the other retreating. One should be protecting a specific, tangible hearth; the other holding a line for an abstract principle.

  This resolution beats the alternatives because it preserves your "fog of war" aesthetic while restoring the moral gravity your editor rightly demands. If the soldiers are truly interchangeable, the death in the climax is a coin toss, reducing the tragedy to chance. If their experiences are asymmetrical, the death becomes a collision of incompatible necessities. The reader can recognize that one man is defending a home and the other invading it, even if they do not know which political cause is "just." This allows the reader to understand that the men are *not* in the same position, even if both men believe they are innocent.

  You must let the objective reality of the war press against the subjective innocence of the soldiers. Do not hide the difference in their situations; hide only the labels. That is how you keep your philosophy without accepting your editor's verdict that the book is a dodge.
