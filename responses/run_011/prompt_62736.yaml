answer: |-
  Good morning. It is cold in here, and the year is old. We are gathered at the end of a term, and at the end of something else too. I see parents in the back rows, staff behind you, and colleagues in the front. We are all here for the same reason: because this school matters to us.

  I am a mathematician. I did not start as a teacher, but I learned to love the way numbers fit together. When I look at education, I do not see a factory. I see a living thing. It grows in seasons. There is a time for first meeting a subject, when it is new and exciting. There is a time for the hard work of accuracy, when you must learn the rules, the spellings, the formulas, and the dates. And there is a time when those rules become yours, when you can use them without thinking, to build something new.

  We are about to enter a season of accuracy. You will have more tests. You will move silently. You will follow scripts. I want you to understand that this is not a punishment. It is a necessary stage. You cannot build a house without knowing how to use a hammer. You cannot write an essay without knowing how to spell. You cannot solve a problem without knowing your tables. There is dignity in drilling. There is honour in getting the right answer because you know the rule. Do not let anyone tell you that precision is worthless. It is the backbone of learning. If you skip this stage, you are left with opinions instead of knowledge.

  But precision is not the whole journey. It is the middle step. If you stay in the middle forever, something goes wrong. The tools become heavy. The rules become walls.

  I want to tell you about a lesson I taught three years ago. It was a Year Ten mathematics class. We were learning about gradient. I taught them the formula: rise over run. I gave them grids. I gave them lines. They practised until they could calculate the slope of any line on a page. They were perfect. Every answer was correct. Every step was shown. I was pleased. They were pleased.

  Then I took them outside. I stood them in front of the school roof. I asked them to tell me how steep it was. They looked at me blankly. They had the formula in their heads, but they could not see the line in the wood. They had the tool, but they did not know what it was for. The knowledge was stuck. It was not their fault. It was not my fault. It was because we had stopped at the middle stage. We had mastered the procedure, but we had not crossed over into use.

  This is the risk we all face. It is not a failure of character. It is a risk inherent in learning itself. When ideas are received but not used, they become inert. They sit in the mind like stones in a pocket. You carry the weight, but you do not build the wall. This can happen in any system. It can happen when there is too much freedom, and it can happen when there is too much rule. The fault does not lie with the person holding the stone. It lies in keeping the stone in the pocket for too long.

  Your teachers here have worked hard to put tools in your hands. The leaders coming in January will work hard to ensure you know how to use those tools correctly. Both are necessary. But you must watch out for the stones in your pocket. You must ensure that what you learn does not stay stuck on the page.

  You will sit many examinations in the coming years. Some of you will sit them in May. You will be tested on your precision. You must pass these tests. They are the gateway to your next step. But while you are preparing for them, you must keep the end in mind. You are learning to think, not just to record.

  So I am going to give you one instruction. It is not a rule for the school. It is a rule for your mind. It is something you can do without asking permission, and it will not get you into trouble.

  When you sit a test in the spring term, and you get your paper back, look at the questions. Do not look only at the marks. Find the one question that made you think the hardest. It might be the one you got wrong. It might be the one you got right but had to work for. Circle it. Not for the teacher. For yourself. Next to it, write one sentence about why it was hard. Was it because you forgot the rule? Or because you did not see how the rule fit the problem?

  This takes thirty seconds. It fits within the regime. But it changes the work from something done to you, into something you do. It keeps the idea alive. It prevents the stone from staying in the pocket.

  You are living in a town that knows about hard work. You know what it is to dig, and to build, and to repair. You know that tools are for using. Treat your education the same way. Respect the rules, master the precision, but do not forget the building.

  I have enjoyed standing here. I have enjoyed watching you learn. I will watch from afar, and I will expect to hear that you are building well.

  Thank you.
