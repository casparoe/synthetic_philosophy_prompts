answer: |-
  This instrument is calibrated for the retired metrologist who finds formal epistemology lacking in practical handles. You have asked for a decision tree that respects the internal perspective of the scientist (you cannot know the "true" state of the world, only your judgment of it) and uses the texture of laboratory life rather than philosophical thought experiments.

  Below is the **Uncertain Evidence Update Tree**. Following the tree, I provide the required analysis of the Jeffrey/Imaging boundary and the diagnosis of the "undefended" leaf.

  ### The Decision Tree

  **Root Node:** *I admit my new evidence is not certain (the reading is blurred).*

  **Node 1: The Quantification Question**
  *Question:* Can I resolve this blur into a precise probability distribution over a fixed set of mutually exclusive observational outcomes (e.g., "I assign 0.6 to Peak A and 0.4 to Peak B")?
  *   **NO** $\rightarrow$ Go to Leaf A.
  *   **YES** $\rightarrow$ Proceed to Node 2.

  **Node 2: The Sufficiency Question**
  *Question:* Do I judge this uncertain evidence strong enough to warrant *any* change to my current probability assignments, or should I wait for a crisper reading?
  *   **NO** (Wait for certainty) $\rightarrow$ Go to Leaf B.
  *   **YES** (Update now) $\rightarrow$ Proceed to Node 3.

  **Node 3: The Stability Question**
  *Question:* Does the uncertainty lie merely in my *access* to the data (reading error, visual blur), or does it suggest a change in the *physical link* between the data and the hypothesis (calibration drift, apparatus degradation)?
  *   **ACCESS** (The chemistry/physics is stable; I just can't see clearly) $\rightarrow$ Proceed to Node 4.
  *   **LINK** (The apparatus or environment may have shifted; the meaning of the signal is unstable) $\rightarrow$ Proceed to Node 5.

  **Node 4: The Rigidity Question**
  *Question:* Given the access error, do I treat the conditional probabilities ($P(\text{Hypothesis} | \text{Outcome})$) as fixed constraints, or do I decide to treat the most likely outcome as certain for practical calculation?
  *   **FIXED** (Conditionals remain stable despite the blur) $\rightarrow$ Go to Leaf C.
  *   **CERTAIN** (I will collapse the uncertainty and treat the mode as fact) $\rightarrow$ Go to Leaf D.

  **Node 5: The Source Question**
  *Question:* Am I aggregating distinct, independent reports (e.g., my reading vs. a colleague's report), or modeling a single system where the noise profile itself has changed?
  *   **AGGREGATING** (Multiple independent sources of uncertain testimony) $\rightarrow$ Go to Leaf E.
  *   **SINGLE SYSTEM** (One apparatus, but the noise mechanism has shifted) $\rightarrow$ Go to Leaf F.

  ---

  ### The Leaves (Updating Policies)

  **Leaf A: Radical Probabilism**
  *   **Path:** Node 1 (NO).
  *   **Policy:** You refuse to legislate a specific numerical distribution over the evidence. You update your beliefs holistically, constrained only by coherence (no Dutch Books) and perhaps a general direction, without a formulaic rule.
  *   **Laboratory Case:** You glance at a **titration endpoint** while distracted. You feel the color *might* have turned, but you cannot even assign a ratio like 70/30. You adjust your confidence in the concentration slightly, based on "gestalt" judgment, refusing to formalize the likelihood of the color change itself.
  *   **Status:** Defended by Richard Jeffrey (later work) and Brian Skyrms.

  **Leaf B: Conservative Stasis (The Undefended Policy)**
  *   **Path:** Node 2 (NO).
  *   **Policy:** You retain your prior probabilities exactly as they were. You treat uncertain evidence as epistemically inert until it reaches a threshold of certainty.
  *   **Laboratory Case:** A **chromatogram peak** is slightly broadened. You suspect it might be a co-eluting impurity, but you aren't sure. You file the run without updating your belief about the sample's purity, waiting for a re-run with a different column.
  *   **Diagnosis:** **Coherent but Unattractive.** It satisfies the probability axioms (you remain coherent), but it is pragmatically empty for a scientist. It violates the principle that evidence should shift belief proportionally to its strength. It essentially treats the laboratory notebook as a record only of certainties, discarding the bulk of experimental data which is inherently noisy.

  **Leaf C: Jeffrey Conditionalization**
  *   **Path:** Node 3 (ACCESS) $\rightarrow$ Node 4 (FIXED).
  *   **Policy:** $P_{new}(H) = \sum P_{old}(H | E_i) \times P_{new}(E_i)$. You update by weighting your old conditional probabilities by your new confidence in the outcomes. The "rigidity" condition holds: $P_{new}(H | E_i) = P_{old}(H | E_i)$.
  *   **Laboratory Case:** You are reading a **digital multimeter** that is flickering between 4.9V and 5.0V. You assign 0.5 to each. You know that *if* it is 5.0V, the circuit is safe; *if* 4.9V, it is marginal. The physics of the circuit hasn't changed, only your grip on the reading.
  *   **Status:** Standard for "sensory" uncertainty where the world is stable.

  **Leaf D: Strict Conditionalization**
  *   **Path:** Node 3 (ACCESS) $\rightarrow$ Node 4 (CERTAIN).
  *   **Policy:** $P_{new}(H) = P_{old}(H | E_{most\_likely})$. You treat the uncertain evidence *as if* it were certain ($P(E)=1$) to simplify the calculation.
  *   **Laboratory Case:** The **titration color change** is ambiguous, but 5.0V is the standard. You decide to record the endpoint as "Reached" because it looked *mostly* pink, and proceed to calculate concentration assuming the endpoint was exact.
  *   **Status:** Common in practice, but technically incoherent with the admission of uncertainty. It is a pragmatic fiction.

  **Leaf E: Weighted Averaging (Linear Pooling)**
  *   **Path:** Node 5 (AGGREGATING).
  *   **Policy:** $P_{new}(H) = w_1 P_1(H) + w_2 P_2(H)$. You do not conditionalize on a partition; you average the posterior distributions provided by different sources (including your own prior as a source).
  *   **Laboratory Case:** You have your own **uncertain reading of a gauge**, and a **colleague's report** of the same gauge which you only partly trust. Neither of you is certain. You form a consensus belief by weighting your judgment against theirs, rather than trying to model the "true state of the gauge" as a hidden variable.
  *   **Status:** Defended for group belief and expert aggregation (Genest & Zidek).

  **Leaf F: Lewis's Imaging**
  *   **Path:** Node 5 (SINGLE SYSTEM).
  *   **Policy:** $P_{new}(H) = \sum P_{old}(H \text{ if } E_i) \times P_{new}(E_i)$. You shift probability mass to the "closest possible world" where $E_i$ is true. Unlike Jeffrey, the conditional probabilities $P(H | E_i)$ are allowed to shift because the truth of $E_i$ might imply a change in the underlying mechanism.
  *   **Laboratory Case:** **Apparatus Noise Drift.** You observe a high reading. It could be high concentration ($E_1$) or sensor drift ($E_2$). If sensor drift is true, the *relationship* between voltage and concentration has changed. You cannot use old conditionals. You must imagine the world where the sensor drifted and ask what your belief would be *in that world*.
  *   **Status:** Defended for counterfactuals and cases where evidence suggests a change in the laws/states governing the hypothesis.

  ---

  ### Requirement 1: The Jeffrey/Imaging Boundary

  You suspected these two leaves might overlap. You are correct. The tree separates them at **Node 3 (Stability)**, but this separation relies on the agent's *judgment* of stability, not the objective state of the world.

  **Where they agree:**
  Jeffrey Conditionalization and Imaging yield identical posteriors when the observation $E$ is **probabilistically independent** of the hypothesis $H$ *except* through the direct link being measured. In metrology terms: when the measurement error is "additive white noise" that does not correlate with the sample properties.
  *   *Example:* A **balance scale** fluctuates due to air currents. Whether the reading is 10.1g or 10.2g tells you nothing about the *calibration* of the scale, only the mass. Here, $P(H | E) = P(H \text{ if } E)$. Jeffrey and Imaging converge.

  **Where they part company:**
  They diverge when the evidence $E$ provides information about the **reliability of the measurement process itself**.
  *   *Example:* A **chromatogram** shows a peak at an unexpected retention time.
      *   **Jeffrey Approach:** You treat the retention time as uncertain but assume the column chemistry is stable. You update the probability of the compound's identity based on fixed retention tables.
      *   **Imaging Approach:** You recognize that a peak at *this* time implies the column may have degraded (a shift in the "world"). In the world where the peak is real, the retention tables are no longer valid. You must update your belief about the column's state *and* the compound's identity simultaneously.
  *   *The Diagnostic:* If accepting the evidence as true would force you to change your mind about the *conditional probabilities* you used to evaluate it, you must use **Imaging**. If the conditionals remain robust regardless of which outcome obtained, **Jeffrey** is sufficient.

  ### Requirement 2: The Undefended Policy Diagnosis

  **Policy:** Conservative Stasis (Leaf B).
  **Diagnosis:** **Unattractive / Pragmatically Incoherent.**

  It is **coherent** in the narrow logical sense: maintaining a prior distribution $P_{old}$ as the posterior $P_{new}$ violates no axioms of probability. If $P_{old}$ was coherent, $P_{new}$ is too.

  However, it is **undefended** because it severs the link between evidence and belief. For a metrologist, this is akin to possessing a calibrated instrument and refusing to record readings because the needle vibrates. It treats uncertainty as a binary switch (update/don't update) rather than a continuous variable (weight of evidence). While it protects against over-updating on noise, it guarantees under-updating on signal. In formal epistemology, it is often dismissed as a form of "dogmatism" that fails to meet the normative requirement of *responsiveness* to evidence. It is a policy of epistemic hoarding rather than trading.
