answer: |-
  You have identified a real and distinct phenomenon, and your suspicion is correct: there is no single, settled term in the literature that captures *exactly* this configuration. You are standing at the intersection of three different bodies of theory, each of which captures a facet of the problem but misses the specific mechanism you are describing.

  Here is the breakdown of why existing terms fall short, followed by a proposed coinage with the boundaries drawn as you requested.

  ### 1. The Existing Near-Misses

  **A. James C. Scott's "Legibility" (*Seeing Like a State*)**
  This is the strongest existing descriptor. Scott argues that states simplify complex social realities (surnames, fixed addresses, standardized weights, individual land title) to make them administratively "legible."
  *   **Where it fits:** It perfectly describes the *mechanism*: the state requires a simplified schema to function, and complex communal forms are "illegible" to it.
  *   **Where it misses:** Scott treats this as an exercise in *state capacity* and control. He does not focus on the *liberal claim to neutrality*. Your point is sharper: it's not just that the state *wants* to see individuals, but that it claims its framework is *neutral* while technically requiring individualism to operate. Scott would agree with your description, but he wouldn't call it a paradox of liberalism; he'd call it a feature of bureaucracy.

  **B. The "Numerus Clausus" Principle (Property Law)**
  In legal theory (specifically Merrill and Smith), this principle holds that the law limits the number of standard forms property can take (e.g., fee simple, leasehold) to reduce information costs for third parties.
  *   **Where it fits:** This is the exact legal doctrine preventing your communal land tenure from being recorded. The system says, "We don't care what you believe, but we only have these five boxes for ownership."
  *   **Where it misses:** This is usually justified on grounds of *efficiency*, not neutrality. It admits it is constraining form for the sake of market fluidity. It lacks the philosophical "neutral framework" pretension you are critiquing.

  **C. "Liberal Perfectionism" (Raz, Wall)**
  This is the view that the state *should* promote specific goods.
  *   **Where it misses:** You explicitly noted this isn't about the state promoting a "good life." It's about the state requiring a "good *structure*." A perfectionist state says, "Individualism is virtuous." Your liberal framework says, "Individualism is the only protocol that compiles."

  ### 2. The Coinage: "Operational Individualization"

  Since no existing term captures the tension between *claimed neutrality* and *required form*, I propose calling this **Operational Individualization**.

  **Definition:**
  Operational Individualization occurs when a system justified by procedural neutrality imposes technical prerequisites for participation that require agents to adopt an individualist ontology, regardless of their internal social structure. It is not a demand that agents *believe* in individualism, but that they *interface* as individuals.

  **The Core Mechanism:**
  The framework functions like a software API (Application Programming Interface). The API claims to be platform-agnostic ("We don't care what OS you run"). However, the API only accepts JSON packets formatted with specific unique IDs. A communal "operating system" that processes data collectively cannot send the packet without writing a wrapper that simulates individual nodes. The system hasn't banned the communal OS, but it cannot process it without the wrapper. The wrapper *is* the individualization.

  ### 3. The Carving: Boundaries and Distinctions

  You asked for the boundaries. Here is how you distinguish Operational Individualization from the three adjacent concepts you listed.

  **(a) vs. Plain Majority Domination dressed up as procedure**
  *   **The Distinction:** Majority domination is *contingent*; Operational Individualization is *structural*.
  *   **The Test:** If the majority changed, would the requirement disappear?
      *   *Majority Domination:* If a communitarian party won the election, they could change the language or the land laws to suit their group. The constraint is political power.
      *   *Operational Individualization:* If a communitarian party won, they might still struggle to run a modern court system or land registry without individuating data. The constraint comes from the *complexity of the administration*, not the ideology of the rulers. A "saintly" bureaucracy (as you noted) still needs to know *who* to sue if a contract is breached.
  *   **Boundary:** If the rule exists to benefit Group A over Group B, it's domination. If the rule exists because the system cannot process non-individual data, it's Operational Individualization.

  **(b) vs. Neutral in Principle, Unequal in Effect**
  *   **The Distinction:** Unequal effect is about *outcomes*; Operational Individualization is about *pre-conditions*.
  *   **The Test:** Does the rule allow the community to participate and lose, or does it prevent them from participating unless they change?
      *   *Unequal Effect:* The community can hold land under the new title system, but they are poorer because they can't leverage it as well as individuals. They are in the game, but disadvantaged.
      *   *Operational Individualization:* The community *cannot* hold land under the title system at all without dissolving the communal tenure. They are not in the game unless they change the rules of their own team.
  *   **Boundary:** If the cost is economic (you lose money), it's unequal effect. If the cost is ontological (you must change who you are to sign up), it's Operational Individualization.

  **(c) vs. Every Institution Carries a Culture**
  *   **The Distinction:** Culture is *soft* (norms, expectations); Operational Individualization is *hard* (compatibility).
  *   **The Test:** Can you participate while internally rejecting the culture?
      *   *Institutional Culture:* A law firm expects you to work late. You can work there, hate the culture, and still collect a paycheck.
      *   *Operational Individualization:* A land registry requires a named individual owner. You cannot internally reject this and still register the land. There is no "opt-out" that preserves the function.
  *   **Boundary:** If you can dissent internally while functioning externally, it's culture. If internal dissent makes external function impossible, it's Operational Individualization.

  ### 4. Addressing Your Edge Cases

  **Case 1: Public contracts must be in writing (Oral economy community)**
  *   **Verdict:** **Yes, this counts.**
  *   **Why:** It is not merely a cost (hiring a scribe). It transforms the nature of the agreement from relational/reputational (enforced by the community) to textual/state-enforced. To use the contract, the community must authorize individuals to sign *as individuals*, binding themselves rather than the collective.
  *   **The Tipping Point:** It turns from "opt out at a cost" to "must reorganize" when the *enforcement mechanism* shifts. If the state says, "We won't enforce oral contracts," the community can still trade orally among themselves. But if the community needs state enforcement (e.g., against an outsider), they must adopt the written form. If the written form requires individual signatories, the community must create individual legal persons to sign. That is reorganization.

  **Case 2: Would this apply to an openly perfectionist state?**
  *   **Verdict:** **The mechanism is the same, but the "paradox" vanishes.**
  *   **Why:** If the state says, "We require individual title because individualism is morally superior," that is honest Perfectionism. Operational Individualization is specifically the *gap* between the claim ("We are neutral") and the requirement ("You must be individuals").
  *   **Nuance:** The *effect* on the community is identical (they must individualize). But the *political critique* changes. Against a perfectionist, you argue about the Good. Against a liberal, you argue about the Neutrality. Operational Individualization is the specific tool for the latter critique.

  **Case 3: Private actors (Banks, Licensing Bodies)**
  *   **Verdict:** **Yes, if they hold monopoly power over essential infrastructure.**
  *   **Why:** A local coffee shop requiring ID is just a policy. A banking system requiring KYC (Know Your Customer) individuation is Operational Individualization because access to finance is a prerequisite for modern economic life.
  *   **Boundary:** If the community can easily use an alternative system (e.g., a communal credit union that doesn't require individual IDs), it's not Operational Individualization. If the state mandates that *all* banks must follow KYC rules (which they do), then the private bank is acting as an arm of the state's administrative framework. The phenomenon attaches to the *infrastructure*, not just the government.

  ### 5. Summary for Your Work

  When writing your policy papers, you can frame the problem this way:

  > "Current land tenure frameworks suffer from **Operational Individualization**. While justified as neutral platforms for diverse ways of life, the administrative protocols of these frameworks (title registration, contract enforcement, liability assignment) possess a hard compatibility requirement: they can only process data structured as individual rights-holders. This is not a bias against communal values, but a **structural incompatibility**. The framework does not forbid communal living, but it renders communal tenure administratively invisible unless it is translated into individual form. This translation is not costless; it is a fundamental reorganization of the social relation."

  This allows you to move past the "neutrality vs. perfectionism" debate (which is exhausted) and into a "compatibility vs. translation" debate (which is technical and solvable). It suggests the solution isn't "less liberalism," but "better protocols" (e.g., legal entities that can hold title as a single corporate body without dissolving into shareholders).

  **The Term:** **Operational Individualization**.
  **The Mechanism:** **Administrative Legibility**.
  **The Harm:** **Ontological Restructuring**.
