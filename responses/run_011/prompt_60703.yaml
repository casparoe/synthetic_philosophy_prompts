prompt: |-
  ok so in my AP bio class we hit gene editing and the He Jiankui thing came up, and now I'm stuck in an argument with a friend of mine who's way more into philosophy than I am and I think he's wrong but I cant get the words out. Here's the facts as I remember them so you don't have to guess: late 2018, a researcher in China edited human embryos with CRISPR, supposedly to make them resistant to HIV, two girls were born from it and I'm pretty sure a third baby came after, and basically the whole scientific world said it was reckless and pointless — the father was HIV-positive but there are completely routine ways to stop transmission to a kid, the edits may not even have done what he claimed, and nobody could rule out off-target changes. He went to prison for it.

  My friend's whole argument is that the obvious way to object — 'he harmed those girls' — is actually incoherent, because of the nonidentity problem. His version: if He hadn't run the experiment, those particular girls wouldn't exist, their lives aren't worse than never existing, so nobody was made worse off, which means the person-affecting way of thinking has nothing to say and you can only object impersonally, like the world is worse for that choice having been made rather than those kids being worse off. And he says this is exactly the same structure as Parfit's cases with the energy policy and the girl who has a kid at 14.

  Can you actually run the mapping instead of just reciting the problem? I want it step by step: which decision is the identity-determining one, what the real alternatives were at each point (do the experiment / don't / implant a different embryo / edit this one anyway), which of those alternatives changes who exists and which only changes what her life is like, and whether the person-affecting restriction genuinely runs out of steam here or still has something left to grab onto. Then tell me where the mapping breaks. My instinct is that the embryo part ruins his argument — like once those specific embryos existed, whether he edited them or not, the same girls were the ones who'd be born, so edited-versus-unedited is a same-person comparison and 'you didn't harm them' just falls over. Am I right about that, and if I am, does that make this a bad example for the nonidentity problem or a sneaky good one? And run it the other direction too: what does this episode tell us about the theory — does it support the idea that you need impersonal principles, does it show the person-affecting view is fine as long as you're careful about how you specify the counterfactuals, or is it mostly just a case Parfit wasn't thinking about because his examples were all about populations and policies and not a guy in a lab with a dish?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

