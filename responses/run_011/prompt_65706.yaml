answer: |-
  You have identified a genuine and structurally distinct category of argument. You are right that the standard philosophical move of "proving too much" (reductio ad absurdum of a premise) is not what is happening here. In "proving too much," you show a premise entails a falsehood. In the complexity cases you describe, you show a *method* is insensitive to the truth value.

  Here is the breakdown of the existing terminology, why it falls short, the status of your third case, and a proposed coinage to carve out the concept you are seeing.

  ### 1. The Existing Lexicon

  In computer science, these are standardly called **"Barrier Results"** (e.g., the Relativization Barrier, the Natural Proofs Barrier, the Algebrization Barrier).

  In physics and philosophy of science, the nearest equivalent is the **"No-Go Theorem"** (e.g., Bell's Theorem, the Kochen-Specker Theorem, von Neumann's no-hidden-variables proof).

  **Why these terms fall short for your purpose:**
  *   **"Barrier"** is engineering jargon. It implies an obstacle to be circumvented (which complexity theorists do, by finding "non-relativizing" techniques). It doesn't capture the philosophical weight of *why* the method fails (insensitivity to model variation).
  *   **"No-Go Theorem"** is closer, but in physics, it usually rules out a class of *ontological models* (e.g., local hidden variables) rather than a class of *epistemic methods* (proof techniques).
  *   **"Independence Result"** (Logic): This is the closest formal notion (e.g., Continuum Hypothesis is independent of ZFC). However, independence says the *statement* cannot be settled by the *axioms*. Your complexity examples say the *statement* might be settleable, but *this specific way of arguing* won't do it. Relativization does not prove P vs NP is independent of ZFC; it proves that relativizing proofs are too coarse to distinguish the models.

  ### 2. The Philosophical Shape: Method vs. Object

  The move you are identifying is a **second-order impossibility**.
  *   **First-order claim:** "P $\neq$ NP."
  *   **Second-order claim:** "No proof of type $T$ can establish 'P $\neq$ NP'."

  The philosophical mechanism is **model-theoretic insensitivity**.
  In the relativization case, the argument shows that any proof of type $T$ holds true in World A (where P=NP) and World B (where P$\neq$NP). Therefore, Proof Type $T$ cannot distinguish World A from World B. Since the truth value varies between the worlds, Proof Type $T$ cannot track the truth.

  This is distinct from "proving too much." "Proving too much" says: "Your argument entails $Q$, and $Q$ is false." The complexity barrier says: "Your argument is true in $M_1$ and $M_2$, but the Conjecture is true in $M_1$ and false in $M_2$. Therefore, your argument does not determine the Conjecture."

  ### 3. The Third Case: Collapse Arguments

  The third case you mention (if NP has poly-size circuits, PH collapses) is **categorically different**.

  *   **Barrier Results (Cases 1 & 2):** Constrain the *prover*. They tell us about the limits of our epistemic access.
  *   **Collapse Arguments (Case 3):** Constrain the *world*. They tell us about the structural consequences of the conjecture being true.

  Case 3 is a **Structural Plausibility Argument**. It relies on a Quinean "web of belief." We believe PH does not collapse (based on empirical/intuitive evidence). If Conjecture $C$ implies PH collapses, then $C$ is likely false. This is evidence *about the conjecture*, not a constraint *on the method*. It belongs in the category of **heuristic justification**, not methodological limitation.

  ### 4. The Coinage: "Methodological No-Go Theorem"

  Since "Barrier" is too colloquial and "No-Go" is typically ontological, I propose refining the latter to capture your specific carve-out.

  **Term:** **Methodological No-Go Theorem (MNGT)**

  **Definition:**
  A metamathematical result demonstrating that a defined class of proof strategies $\mathcal{M}$ is insufficient to resolve a proposition $P$, established by showing that all strategies in $\mathcal{M}$ are invariant across a set of models in which the truth value of $P$ varies.

  **Key Criteria for an MNGT:**
  1.  **Target:** It targets a *class of methods* (relativizing proofs, natural proofs), not the proposition itself.
  2.  **Mechanism:** It uses a *separation of models* (oracles, pseudorandom distributions) to show the method is "blind" to the relevant truth conditions.
  3.  **Outcome:** It establishes *insufficiency*, not necessarily *impossibility* (unless $\mathcal{M}$ is the set of all valid proofs, which is rare).
  4.  **Conditionality:** It may be unconditional (Relativization) or conditional on another conjecture (Natural Proofs depend on One-Way Functions).

  ### 5. Boundary Cases

  Here is how the **Methodological No-Go Theorem** distinguishes itself from related concepts:

  | Case | Is it an MNGT? | Why / Why Not |
  | :--- | :--- | :--- |
  | **Relativization (Baker-Gill-Solovay)** | **Yes** | Classic instance. Shows relativizing methods are invariant across oracles where P=NP and P$\neq$NP. |
  | **Natural Proofs (Razborov-Rudich)** | **Yes** | Shows "natural" properties cannot distinguish hard functions from random, *conditional* on cryptography. |
  | **Bell's Theorem (Physics)** | **No** (Ontological No-Go) | It rules out a class of *theories of reality* (local hidden variables), not a class of *methods of proof*. It says the world isn't like that, not that we can't prove it. |
  | **Gödel's Incompleteness** | **No** (Systemic Limit) | It rules out the *axiomatic system* from being complete. It doesn't say "You can't prove G using proof style X"; it says "G cannot be proved in System S at all." |
  | **"This argument assumes Constructivism"** | **No** (Framework Relativity) | This is a **Presupposition Failure**. It points out a hidden premise. An MNGT proves that *even if* you accept the framework, the method won't work. |
  | **PH Collapse Arguments** | **No** (Plausibility) | As discussed, this is evidence against the *truth* of the conjecture, not a limit on the *method* of proving it. |

  ### 6. The Philosophical Weirdness of the Conditional MNGT

  You noted the strangeness of the Natural Proofs barrier: *The impossibility of the method is conditional on an unproved conjecture (existence of one-way functions).*

  This creates a **Dialectical Coupling**.
  *   If One-Way Functions exist $\rightarrow$ Natural Proofs cannot work.
  *   If Natural Proofs *do* work $\rightarrow$ One-Way Functions do not exist (Cryptography is broken).

  This is philosophically distinct from standard impossibility results. It turns the *difficulty of proof* into evidence for the *truth of a cryptographic assumption*. It suggests that the hardness of proving lower bounds is *entangled* with the hardness of the computational problems themselves. In an MNGT of this type, the limitation on our knowledge is structurally identical to the limitation on the adversary's knowledge in a cryptographic protocol.

  ### Summary for your work

  If you are writing this up, I recommend using **"Methodological No-Go Theorem"**.

  *   It borrows the gravity of "No-Go" from physics.
  *   It specifies "Methodological" to distinguish from ontological restrictions.
  *   It allows you to group Relativization and Natural Proofs together as **Epistemic Constraints**, while separating them from Collapse Arguments (**Structural Evidence**) and Incompleteness (**Systemic Limits**).

  It captures the specific "shape" you are seeing: a theorem that does not tell you what is true, but tells you which paths to truth are paved over.
