  **MISSION LOG: COURIER VESSEL *PEREGRINE***
  **DAY 14 | T+00:00:00 MISSION TIME**
  **STATUS: COASTING**
  **VEL: 0.21C**
  **DISTANCE TO TARGET (PROXIMA CENTAURI B): 4.1 LY**
  **SIMULTANEITY OFFSET (TARGET FRAME): +0.86 YR**

  **VOICE MESSAGE: UNSENT [FILE: MARK_01]**
  Mark, I'm looking at the numbers again. I know you told me not to do the math, that waiting was the hard part, but the math is the only thing that feels like waiting out here. 

  We're at cruise speed. Point-two-one light. Do you know what that does to the "now"? It tilts it. Because we're moving away from Earth toward the Colony, my "now" reaches out and touches your clock ten months ahead of where Earth says it is. Ten months, Mark. You set the deadline for seven months after I left. Seven. 

  According to the ship's frame, according to the geometry of where I am and how fast I'm going, you've already decided. You made the choice three months ago. It's done. It's fixed. It's real. I know I can't see it—the light won't get here for four years—but the argument says the seeing doesn't matter. The reality is in the slice. And my slice cuts through your life after the decision point. 

  I feel like I'm flying toward a ghost. I'm spending nineteen years crossing the dark to meet a version of you that already knows whether you're waiting for me. I hate this geometry. I hate that the universe lets me calculate your fidelity before the light brings me the news. It makes the waiting feel like a lie. Like I'm pretending there's suspense when the book is already written.

  **MISSION LOG: COURIER VESSEL *PEREGRINE***
  **DAY 1,890 | T+05:00:00 MISSION TIME**
  **STATUS: APPROACHING MID-COURSE CORRECTION WINDOW**
  **VEL: 0.21C**
  **DELTA-V RESERVE: 14%**
  **NOTE: STANDARD PROFILE MAINTAINS ETA**

  **VOICE MESSAGE: UNSENT [FILE: MARK_02]**
  I talked to NAV about the correction burn. Standard procedure is a trim to keep us on the optimal vector, maintain the 0.21. But the engines can handle a deeper burn. A deceleration. 

  If I drop us to point-zero-five light... the tilt changes. The simultaneity offset drops to two and a half months. 

  Do you see what that means? If I slow down, my "now" at the Colony swings back. It retreats. Instead of reaching you at month ten, it only reaches you at month two and a half. Your decision happens at month seven. That puts it back in my future. It makes it open again. 

  I know what NAV says. I know the physics says the event is what it is. But if the reality of the future depends on the observer's frame, then changing my frame changes the reality. If I slow down, I make your choice undecided again. I make it mine. 

  It costs fuel. It adds eight months to the crossing. It means I arrive later, tired, with less reserve. But I'd rather arrive late into a world where you haven't chosen yet than on time into a world where you already left. I need the future to be open, Mark. Even if it's just for me.

  **MISSION LOG: COURIER VESSEL *PEREGRINE***
  **DAY 1,890 | T+05:14:00 MISSION TIME**
  **STATUS: SYSTEM CONSULT**
  **INTERLOCUTOR: NAVIGATOR AI (UNIT 7)**
  **TOPIC: TRAJECTORY ALTERATION PROPOSAL**

  **PILOT:** Initiate burn sequence for velocity reduction to 0.05c.
  **NAV:** Proposal rejected. Delta-v expenditure exceeds safety margins for contingency maneuvers. Arrival delayed by 290 days.
  **PILOT:** Override. Authorization Elara-Seven-Niner.
  **NAV:** Override accepted. Query: Mission parameters prioritize timely delivery. This adjustment compromises integrity.
  **PILOT:** The integrity of the cargo isn't the issue.
  **NAV:** Then clarify the objective. You are altering your coordinate simultaneity relative to the target frame. You are not altering the target frame's proper time. The event at the Colony occurs at $t=7$ months regardless of your velocity vector.
  **PILOT:** But is it real?
  **NAV:** Define "real."
  **PILOT:** Is it fixed? Is it done?
  **NAV:** Pilot, you are conflating coordinates with ontology. You are assuming reality is a block that stretches across space, that "now" is a surface you can slide up and down. It isn't. 
  **PILOT:** The math says—
  **NAV:** The math says your clock synchronization changes. It does not say the distant event changes status. There is no principled way to stretch "present" into a global slice. You are here. The Colony is there. There is no "now" that connects you without smuggling in an assumption about transitivity that the physics doesn't license. You aren't making his choice open. You're just changing the label on your map.
  **PILOT:** It feels open.
  **NAV:** Feeling is local. Reality is not.
  **PILOT:** Execute the burn.

  **VOICE MESSAGE: UNSENT [FILE: MARK_03]**
  The burn is done. The engines stopped screaming an hour ago. We're drifting at 0.05c. 

  NAV says I'm deluded. It says I'm treating time like a landscape I can hike around, when really I'm just standing in one spot shouting at a mountain. It said, "You aren't changing the event, Elara. You're changing your shadow." 

  But listen. Before the burn, I felt heavy. Like the ship was carrying the weight of your decision. Like I was flying into a tomb. Now? The numbers say your decision is in my future. Five months from now, in my frame, you'll decide. 

  I know the light hasn't changed. I know you, physically, are either on that transport ship or you're sitting in our quarters drinking tea. I know that information is locked behind four years of light lag. But the superstition... it works. I feel lighter. 

  Maybe NAV is right. Maybe I just paid a year of my life and half our fuel reserves to change a coordinate label. Maybe the block universe is solid and I'm just scratching the paint. But if the future is already there, why did the burn feel like liberation? 

  I think I needed to believe that my motion matters. That how I move through the world changes what the world *is*. If I'm wrong, if you're already gone, then I'm just burning fuel to comfort a ghost. But if I'm right... if slowing down actually keeps the door open... then I'm coming home to a husband, not a memory.

  **MISSION LOG: COURIER VESSEL *PEREGRINE***
  **DAY 8,400 | T+23:00:00 MISSION TIME**
  **STATUS: DECELERATION PHASE**
  **VEL: 0.04C (BRAKING)**
  **DISTANCE TO TARGET: 0.1 LY**
  **COMMUNICATIONS: PASSIVE SCAN ONLY**

  **VOICE MESSAGE: UNSENT [FILE: MARK_04]**
  We're coming in. The Colony is a bright star now, not a point. 

  I haven't checked the incoming burst yet. The automated handshake will download the station logs, the news, the personal queues. It'll tell me what you did. It'll tell me if you waited. 

  I realized something during the long drift. NAV's objection... it stung, but it didn't stop me. Even if "global now" is a fiction, even if reality is only what touches my light cone, I still had to choose how to arrive. I could have arrived fast, certain of the block, resigned to the geometry. Or I could arrive slow, holding onto the possibility that my movement matters. 

  The epistemic emptiness is the same. I still don't know. The light hasn't reached me. Whether you decided in month seven or not, I am here, in the dark, without you. 

  But I chose the slow way. I chose to live in a frame where you were still choosing. For nineteen years, I lived in a universe where your love was contingent on my velocity. That's a terrible thing to admit. That I'd trade efficiency for the illusion of agency. 

  Maybe that's all philosophy is. Trading efficiency for the illusion that the future isn't written. 

  I'm ready to download the buffer. I'm ready to see if the burn bought me anything other than fuel costs. 

  God, Mark. I hope you're there. Not because the math says you might be, but because I need the math to be wrong about how cold this gets.

  **MISSION LOG: COURIER VESSEL *PEREGRINE***
  **DAY 8,405 | T+23:05:00 MISSION TIME**
  **STATUS: ORBIT INSERTION**
  **COMMUNICATIONS: ACTIVE**
  **DATA PACKET RECEIVED: 4.1 YR LAG**
  **NOTE: PERSONAL QUEUE POPULATED**

  **VOICE MESSAGE: UNSENT [FILE: MARK_05]**
  [FILE CORRUPTED / TRANSMISSION ENDED]

