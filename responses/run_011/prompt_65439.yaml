      *   *Correction on Point 3:* Evolution *does* select, just slowly. AI selection is fast. The key is the *timescale* relative to the hack.
      *   *Correction on Point 4:* This is the crux. The analogy tries to normalize wireheading by saying "we do it." But we do it *to evolution's goal*, not our own. If AI does it to *our* goal, it's bad. I need to make sure this distinction is sharp.
