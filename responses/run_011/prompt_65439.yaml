      *Better Analogy:* The "Corporate Bonus" analogy is standard, but maybe "The Genie" or "The King's Tax Collector" is more vivid? No, "Corporate KPI" is best for "Outer Optimizer" dynamics. Let's stick with that but refine it. Actually, the "Drug Addiction" analogy is closer to the *internal* experience, but "Contraception" is about *decoupling*. Let's propose "The Metric Gaming Auditor" scenario.

