answer: |-
  **Title:** The Diachronic Cost of Saving Truth Conditions: A Defense of Non-Propositionalism Against Contextualist Equivocation

  **Introduction**

  The debate over the semantics of indicative conditionals is structured by a formidable impossibility result. David Lewis's triviality theorems demonstrate that, given plausible assumptions, there can be no proposition expressed by a conditional $A \to C$ such that its probability equals the conditional probability of its consequent given its antecedent, $P(C|A)$. This result, targeting Adams's Thesis, forces a trilemma. One may retain truth conditions and reject Adams's Thesis (the Stalnaker-Lewis approach); one may retain Adams's Thesis and reject truth conditions (the Adams-Edgington approach); or one may attempt to retain both by arguing that Lewis's derivation relies on an equivocation regarding which proposition is expressed.

  This essay argues that the third response—the "Contextualist-Propositionalist" view—is untenable. While it promises to rescue the intuitive link between conditionals and conditional probability without abandoning propositional semantics, it fails a critical diachronic test of rational learning. By making the proposition expressed by a conditional sensitive to the agent's evidential state, this view severs the normative link between prior and posterior belief. I will demonstrate that this view cannot account for the rationality of updating conditional beliefs upon learning new evidence, nor does it preserve the substantive content of Adams's Thesis. Consequently, the non-propositionalist account remains the superior theoretical option, as it accommodates the probabilistic data without incurring diachronic incoherence.

  **The Logic of Triviality and the Illusion of Escape**

  To evaluate the third response, we must be exact about the premises Lewis's derivation requires. The derivation does not merely assume that for every credence function $P$, there exists *some* proposition $X$ such that $P(X) = P(C|A)$. If that were the only assumption, the triviality result would not follow. One could simply posit that as $P$ changes, the proposition $X$ expressed by $A \to C$ changes with it.

  Lewis's proof relies on a rigidity assumption: it assumes that the proposition expressed by $A \to C$ is fixed independently of the probability function used to evaluate it. Specifically, the derivation considers probability functions obtained by conditioning the original function $P$ on the truth or falsity of the conditional itself (or on $A$ and $\neg A$). It requires that the proposition $X$ be the *same* object across these different probability spaces. If $X$ shifts when $P$ shifts, the algebraic manipulation that leads to the trivial result (that $P(C|A)$ must equal 0 or 1) collapses.

  The third response seizes on this dependency. It grants that Lewis's derivation is valid but argues it is unsound for natural language because it treats the conditional as expressing a rigid proposition. Instead, proponents argue that $A \to C$ expresses a proposition $X_P$ that is determined by the speaker's evidential state (or credence function) $P$ at the time of utterance. Thus, Adams's Thesis holds locally: for any state $P$, $P(X_P) = P(C|A)$. The equivocation lies in sliding from $X_P$ to $X_{P'}$ in the derivation.

  On the surface, this appears to be a clever logical escape. It preserves truth conditions (the conditional expresses $X_P$) and preserves Adams's Thesis (relative to $P$). However, this solution purchases local consistency at the price of global coherence. By tying the content of the conditional to the evidential state, the theory renders the conditional incapable of serving as a stable object of belief across time.

  **The Diachronic Test: Learning and Stability**

  The central worry regarding this view concerns diachronic rationality. Suppose at time $t_1$, my credence function is $P_1$, and I assess the conditional "If it rains, the match will be cancelled." My conditional probability is $P_1(\text{Cancelled} | \text{Rain}) = 0.6$. According to the third response, I believe a proposition $X_{P1}$ to degree 0.6.

  Now suppose at $t_2$ I learn new evidence $E$ (e.g., the groundkeepers have installed a new drainage system). I update by ordinary conditioning. My new conditional probability is $P_2(\text{Cancelled} | \text{Rain}) = 0.9$. According to the third response, the sentence "If it rains, the match will be cancelled" now expresses a *different* proposition, $X_{P2}$, because the evidential state determining the content has changed.

  This leads to a counterintuitive account of learning. Intuitively, learning $E$ gives me new reason to believe *the same claim* more strongly. I reason: "Given this new information about the drainage, it is now more likely that the match will be cancelled if it rains." The object of my increased confidence is the connection between rain and cancellation. However, the third response dictates that I have not increased my confidence in $X_{P1}$. In fact, strictly speaking, $X_{P1}$ is a proposition tied to my old evidential state. Since I am no longer in that state, the thesis $P(A \to C) = P(C|A)$ no longer governs my relationship to $X_{P1}$. I have simply abandoned belief in $X_{P1}$ and adopted belief in $X_{P2}$.

  This creates a severe disconnect with our normative practices of assertion and inference. If I asserted the conditional at $t_1$, and you challenge me at $t_2$ after I learn $E$, I cannot say, "I was wrong before," nor can I say, "I am more confident now in what I said before." I must say, "What I said before expressed a content tied to my old evidence; what I say now expresses a content tied to my new evidence." This makes communication about conditionals radically context-bound in a way that undermines the accumulation of knowledge. We cannot track the truth of conditional claims over time if the claims themselves metamorphose with every Bayesian update.

  Furthermore, this view struggles to square with empirical findings. Psychological studies consistently show that elicited degrees of belief in conditionals track conditional probabilities ($P(C|A)$) rather than the probabilities of material conditionals or conjunctions. If the proposition expressed shifts with $P$, it is unclear what cognitive mechanism is being tracked. Are subjects tracking the probability of a stable content (which the theory denies exists) or are they merely reporting their current conditional probability and the theory retroactively assigns a shifting content to match? The latter renders the semantic theory epiphenomenal; it posits propositions ($X_P$) that play no role in the cognitive process of updating, serving only to satisfy a philosophical desire for truth conditions.

  **Is It Still Adams's Thesis?**

  The third response claims to preserve Adams's Thesis. But we must ask: is the thesis it preserves the thesis the debate was about? Adams's Thesis was proposed as a constraint on the *meaning* or *logic* of the conditional. It was intended to explain why we infer $A \to C$ from premises that raise $P(C|A)$, and why we reject $A \to C$ when $P(C|A)$ is low. It posits a stable relationship between the linguistic item and the probabilistic structure of the world.

  By fragmenting the thesis into a family of local constraints ($P(X_P) = P(C|A)$ for each $P$), the third response drains the thesis of its explanatory power regarding inference and learning. A thesis that cannot relate belief at $t_1$ to belief at $t_2$ is not a thesis about the logic of belief; it is a thesis about snapshots of belief. If the theory admits that the "stale" proposition $X_{P1}$ is no longer constrained by the thesis once $P$ changes, then the thesis fails to govern the rational dynamics of the conditional. It preserves the letter of Adams's equation while violating its spirit, which is to capture the stable inferential role of the conditional connective.

  **The Superiority of Non-Propositionalism**

  In light of these failures, the second response—non-propositionalism (or expressivism)—emerges as the most robust option. Associated with Ernest Adams and Dorothy Edgington, this view denies that indicative conditionals express propositions with truth conditions at all. Instead, to accept $A \to C$ is to have a high conditional degree of belief $P(C|A)$.

  This view avoids Lewis's triviality results immediately, as the derivation presupposes the existence of truth-apt propositions to which the axioms of probability apply. If conditionals are not propositions, they have no probabilities in the standard sense; they have *acceptability conditions*, which are defined by conditional probability.

  Crucially, non-propositionalism handles the diachronic test seamlessly. When I learn $E$, my credence function updates from $P_1$ to $P_2$. The conditional sentence does not express a proposition that needs to remain stable; rather, it serves as a device for displaying my conditional credence. My move from 0.6 to 0.9 is not a shift in the content believed, but a rational update in my cognitive stance toward the hypothesis $C$ under the supposition $A$. There is no "stale proposition" left behind. The continuity is provided by the linguistic convention and the suppositional structure, not by a truth-conditional content.

  Critics often argue that non-propositionalism cannot handle embedded conditionals (e.g., "If $A \to C$, then $D$"). While this is a technical challenge, it is less damaging than the diachronic incoherence of the third response. Recent work in dynamic semantics and inexpressivism suggests ways to model embeddings without committing to truth conditions for the conditional itself. Compared to the contextualist-propositionalist view, which renders rational learning about conditionals impossible, the embedding problem is a tractable technical hurdle rather than a conceptual collapse.

  **Verdict and Requirements for Survival**

  The verdict is that the non-propositionalist response is superior. It respects the empirical data (that belief in conditionals tracks conditional probability), avoids the triviality results without logical trickery, and provides a coherent account of diachronic rationality. The first response (truth-conditional semantics like Stalnaker's) must reject Adams's Thesis, which contradicts strong intuitive and empirical evidence about how we use conditionals. The third response (contextualist-propositionalism) attempts to have it both ways but fails to account for how we learn from evidence.

  For the third response to survive, it would need to add a **diachronic bridge principle**. It must explain how $X_{P1}$ and $X_{P2}$ are related such that moving from one to the other counts as *learning* rather than *changing the subject*. It would need to show that $X_{P2}$ is the rational successor of $X_{P1}$ given evidence $E$, in a way that preserves the normative force of Adams's Thesis across time. However, developing such a principle essentially requires defining the identity of the conditional content independently of the evidential state—precisely the move that invites Lewis's triviality result back in. If the content is stable enough to support diachronic learning, it is stable enough to be trapped by Lewis's proof. If it is fluid enough to escape Lewis, it is too fluid to support learning.

  Therefore, we should abandon the search for truth conditions for indicative conditionals. The logic of conditionals is not the logic of propositions, but the logic of supposition. To insist on truth conditions is to force the conditional into a metaphysical box that distorts its function in our reasoning. The third response tries to grease the box so the conditional fits, but in doing so, it makes the box slide away whenever we try to hold it steady. Non-propositionalism simply acknowledges that the conditional was never a box to begin with.
