answer: |-
  This is a great passage to analyze because it is a classic example of "telephone game" philosophy: it contains a kernel of truth but garbles the technical details enough to mislead a careful reader. Your instinct that it is overselling things is correct.

  Here is the sentence-by-sentence breakdown, followed by the verdict on the conclusion and the missing context you need to talk to your brother.

  ### Sentence-by-Sentence Analysis

  **1. "Leibniz's law says that two things which share all their properties are really one and the same thing, and it is a cornerstone of logic — if it fails, identity itself comes apart."**
  *   **Verdict:** **Wrong / Wince.**
  *   **Why:** This conflates two different principles.
      *   **The Indiscernibility of Identicals (IoI):** If $x$ and $y$ are the same thing, they share all properties. (This *is* a cornerstone of logic).
      *   **The Identity of Indiscernibles (PII):** If $x$ and $y$ share all properties, they are the same thing. (This is a controversial metaphysical claim, *not* a law of logic).
      *   The passage defines PII but claims it has the logical necessity of IoI. A metaphysician would wince hard here. Black did not attack the logical law (IoI); he attacked the metaphysical principle (PII).

  **2. "In 1952 Max Black refuted it."**
  *   **Verdict:** **Wince.**
  *   **Why:** "Refuted" implies the debate is over. It isn't. Black provided a famous *counterexample* to PII, but whether the counterexample succeeds depends on how you define "property" (see the "Missing Thing" section below). Many metaphysicians reject Black's conclusion.

  **3. "He asked us to picture a universe containing nothing at all except two spheres of chemically pure iron, each a mile across, of the same temperature and colour, and the same distance from each other."**
  *   **Verdict:** **Happily Sign.**
  *   **Why:** This is an accurate description of Black's thought experiment (the "Symmetric Universe").

  **4. "Now, no observation, not even in principle, could tell you which sphere was which, and Black's point was that if there is no way of telling two things apart then there really is only one thing there."**
  *   **Verdict:** **Wrong.**
  *   **Why:** This fundamentally misrepresents Black's conclusion. Black's point was the exact opposite: he argued that even though you cannot tell them apart, **there are still two spheres.** He used this intuition to show that PII is false. The passage attributes the *opponent's* view (verificationism: no difference in observation = no difference in reality) to Black himself. This contradicts the next sentence.

  **5. "Defenders have tried to rescue Leibniz by insisting that each sphere has the property of being that very sphere, but this is a verbal trick: it merely repeats that there are two of them without saying what the difference is."**
  *   **Verdict:** **Wince.**
  *   **Why:** This refers to "haecceities" or "thisness." Calling it a "verbal trick" is Black's opinion, not a neutral fact. Many serious metaphysicians (haecceitists) argue that individuality is a primitive fact that doesn't need a qualitative difference. Dismissing it as a trick begs the question against them.

  **6. "So Black showed that two objects can share every property, intrinsic and relational alike — and modern physics has since confirmed it, given that two identical particles can be in exactly the same state and be literally indistinguishable."**
  *   **Verdict:** **Wince / Wrong.**
  *   **Why:** The first half is Black's conclusion (if you accept his setup). The second half is highly contentious. While quantum particles (bosons) can occupy the same state, whether this violates PII is a massive, unresolved debate in the philosophy of physics. Some argue quantum particles *are* not individuals at all; others argue the *system* has properties the particles lack. Saying physics has "confirmed" Black is a huge overstatement.

  ---

  ### Does the last sentence survive? ("Black refuted Leibniz's law")

  **No.** Once you are careful, the claim collapses.

  1.  **If "Leibniz's Law" means the logical principle (IoI):** Black did not refute this. Nobody thinks $x$ can be identical to $y$ while having different properties. Logic is safe.
  2.  **If "Leibniz's Law" means the metaphysical principle (PII):** Black did not "refute" it in the sense of proving it impossible. He offered a plausible counterexample. However, the counterexample only works if you forbid certain kinds of properties (like "being identical to sphere A"). If you allow those properties, PII is trivially true.

  **What to tell your brother:** "Black didn't refute a law of logic; he challenged a metaphysical hypothesis. And he only succeeds if you agree to ban 'identity properties' from the list of valid properties, which is exactly what his opponents refuse to do."

  ---

  ### The Big Thing The Passage Leaves Out

  The passage omits the single most important technical detail in this debate: **The Definition of "Property."**

  The entire argument turns on what counts as a property.
  *   **Qualitative Properties:** Red, heavy, one mile from the other sphere. (The spheres share these).
  *   **Identity Properties:** "Being identical to Sphere A." (Sphere A has this; Sphere B does not).

  If "being identical to Sphere A" counts as a property, then the spheres *do not* share all properties, PII is trivially true, and Black's argument fails immediately. Black argues we should exclude these "impure" properties to make the principle interesting. Defenders of PII argue you can't exclude them without begging the question.

  The passage mentions this in Sentence 5 ("property of being that very sphere") but dismisses it as a "verbal trick." In professional metaphysics, this is not a trick; it is the central battleground. By dismissing it, the passage hides the fact that Black's argument is circular unless you already agree with him about what counts as a property.

  ### Summary: How to rate it and talk back

  **Trustworthiness Rating:** **Low.** It gets the setup right but confuses the logic, misstates Black's conclusion in the middle, and overstates the scientific consensus at the end.

  **What to say to your brother:**
  1.  **Distinguish the Laws:** "The book conflates the *Indiscernibility of Identicals* (which is logical and untouched) with the *Identity of Indiscernibles* (which is metaphysical and contested). Black only challenged the second one."
  2.  **The Property Loophole:** "Black's argument only works if you define 'property' in a way that excludes 'being this specific object.' Most metaphysicians think that's cheating. If you include identity as a property, the spheres aren't indiscernible, and Leibniz stands."
  3.  **The Physics:** "Physicists and philosophers of physics are still fighting about whether quantum particles actually violate the Identity of Indiscernibles. It's not a settled confirmation."

  You can tell him: "Black didn't settle the question; he just moved the battle to the definition of 'property.' The book presents a partisan victory as a logical fact."
