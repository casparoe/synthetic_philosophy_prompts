      (Drafting thought process): Start with the sequence. The generalization should come from them to ensure they accept the premise. If you hand it to them, the two quick students will attack the premise instead of the logic. Have them suggest a rule about the classroom. Then move to equivalence. Write "If P then Q" and "If not Q then not P" on the board. Get them to agree these are identical. Only then introduce the observation that triggers the paradox. If you introduce the observation before equivalence, they will reject the observation based on intuition. You need the logic to trap the intuition.

      Regarding the example, a shoe is dangerous because the physical object invites physical objections. Use a hypothetical example on the board. "All coins in this room are copper." Equivalent to "All non-copper things are non-coins." A silver pencil is a non-copper non-coin. Does it confirm? This avoids the lost-and-found shoe distraction. Do not do a physical drawing of slips from a bag. It takes too long and shifts focus to probability mechanics which you are omitting. Stick to the whiteboard.

      Misconceptions order: First, the category mistake ("shoes aren't birds"). Head this off by insisting on logical equivalence before mentioning ravens or shoes. Second, the "trick" of set sizes. This is the hard one. Acknowledge it but table it. Third, "logic is broken." Reassure them logic is fine, intuition is the problem. The know-it-all: Tell him beforehand you know he knows the ending. Ask him to help you guide the others there without spoiling it. Make him a co-conspirator.

      Your theory on surprise: Put this in the last five minutes. It explains the feeling, not the logic. If you put it earlier, it dissolves the tension needed for the lesson.

