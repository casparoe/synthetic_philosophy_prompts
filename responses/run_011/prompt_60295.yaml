  1. **You say emergent properties are not deducible in principle. Is this a limit on human reasoning? Or a gap in the physical facts themselves?**
     *Note: Pressure: Metaphysical vs. epistemic emergence; Evasive: "It is both," or "Let us look at an example first."*

  2. **Mark Bedau defines weak emergence as incompressible but derivable. You deny derivability. What work is that denial doing?**
     *Note: Pressure: Strong vs. weak emergence distinction; Evasive: "Bedau is too restrictive," without explaining the metaphysical addition.*
     *Follow-up: If the base determines the top, how is the ontology distinct?*

  3. **You rely on distinct levels. What stops us multiplying levels at will? Or accusing you of choosing them ad hoc?**
     *Note: Pressure: Individuation of levels; Evasive: "Science tells us," without specifying the metric.*
     *Follow-up: How do you identify those joints without relying on our descriptive interests?*

  4. **Many use multiple realizability to argue for irreducibility. Do you actually need it? Or does emergence stand without it?**
     *Note: Pressure: Dependence on multiple realizability; Evasive: "It helps, but is not necessary," without explaining the backing.*

  5. **You deny vitalism. But if properties are novel and non-derivable, in what sense do you remain a physicalist?**
     *Note: Pressure: Definition of physicalism; Evasive: "Everything is physical," without defining 'physical'.*

  6. **Critics say your novel causal powers are just a redescription of the base level doing its work. What is left over to explain?**
     *Note: Pressure: Causal redescription charge; Evasive: "It is not a redescription, it is novel," circular.*
     *Follow-up: If the base suffices for the effect, isn't claiming new powers merely multiplying entities?*

  7. **Physics claims causal closure. If your emergent properties act, do they violate physical laws? Or do they overdetermine effects?**
     *Note: Pressure: Causal exclusion argument; Evasive: "Non-reductive physicalism solves this," without mechanism.*
     *Follow-up: If they do not compete, how does the emergent property exert independent force?*

  8. **If downward influence is real, does it leave physical laws incomplete? Or smuggle indeterminism into the base?**
     *Note: Pressure: Consistency with physical law; Evasive: "It is compatible," without saying how.*

  9. **You cite chemistry and consciousness together. Is the emergence in water the same metaphysical kind as in experience?**
     *Note: Pressure: Uniformity of emergence; Evasive: "They are analogous," without specifying differences.*

  10. **In the case of consciousness, you face eliminativism, panpsychism, or emergentism. Does your view push you toward Russellian monism?**
      *Note: Pressure: Commitment creep toward panpsychism; Evasive: "I am just looking at neuroscience," ignoring the metaphysical implication.*

  11. **You insist this is not about predictive limitation. So what empirical evidence could possibly distinguish your view from epistemic emergence?**
      *Note: Pressure: Empirical distinguishability; Evasive: "It is a metaphysical claim," dodging evidence.*

  12. **Suppose the causal exclusion argument is sound. You must drop one commitment. Is it novelty? Causal power? Or physicalism?**
      *Note: Pressure: Hierarchies of commitment; Evasive: "I do not think it will be sound," refusing the hypothetical.*
