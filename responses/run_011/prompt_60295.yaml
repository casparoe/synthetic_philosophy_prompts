      *   *Q8 (Phenomenal Case):* Consciousness and Russellian Monism.
          *   *Draft:* What about consciousness? Are you a panpsychist?
          *   *Refinement:* "In the case of consciousness, you face eliminativism, panpsychism, or emergentism. Does your view push you toward Russellian monism?"
          *   *Note:* Pressure point: Commitment creep toward panpsychism. Evasive: "I'm just looking at neuroscience," ignoring the metaphysical implication.

      *   *Q9 (Chemistry vs. Mind):* Consistency across domains.
          *   *Draft:* Is chemistry the same as mind?
          *   *Refinement:* "You cite chemistry and consciousness together. Is the emergence in water the same metaphysical kind as in experience?"
          *   *Note:* Pressure point: Uniformity of emergence. Evasive: "They are analogous," without specifying differences.

      *   *Q10 (Physicalism):* What is physical?
          *   *Draft:* Are you a physicalist?
          *   *Refinement:* "You deny vitalism. But if properties are novel and non-derivable, in what sense do you remain a physicalist?"
          *   *Note:* Pressure point: Definition of physicalism. Evasive: "Everything is physical," without defining 'physical'.

      *   *Q11 (Prediction vs. Ontology):* Epistemic slide again.
          *   *Draft:* Is it just prediction?
          *   *Refinement:* "You insist this is not about predictive limitation. So what empirical evidence could possibly distinguish your view from epistemic emergence?"
          *   *Note:* Pressure point: Empirical distinguishability. Evasive: "It's a metaphysical claim," dodging evidence.

      *   *Q12 (Closing):* The Exclusion Trade-off.
          *   *Draft:* What would you give up?
          *   *Refinement:* "If the causal exclusion argument turned out to be sound, which single commitment would you give up: novelty, causal power, or physicalism?"
          *   *Note:* Pressure point: Hierarchies of commitment. Evasive: "I don't think it will be sound," refusing the hypothetical.

