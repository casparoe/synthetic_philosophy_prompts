      *   *Q6 (Causal Closure/Exclusion):* Physics completeness.
          *   *Draft:* What about causal closure?
          *   *Refinement:* "Physics claims causal closure. If your emergent properties act, do they violate physical laws or overdetermine effects?"
          *   *Note:* Pressure point: Causal exclusion argument. Evasive: "Non-reductive physicalism solves this," without mechanism.
