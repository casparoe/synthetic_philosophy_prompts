prompt: |-
  I run a Tuesday night class at the community center in my town — mostly adults who didn't finish school, a couple of them just out, a couple working nights. They're the sharpest arguers I know. I'm not a teacher by training, I just read all the time and write my own materials, and at the end of every term we do a written final that I mark, and then we go through it together as a group and they tell me where I got it wrong. Usually they're right.

  This term was on cause and blame, and we ended up stuck on causing something by *not* doing it. I said: suppose I promise to feed my neighbour's cat, I forget, the cat dies. Everyone in the room agreed I caused it — but nothing came out of me, there was no event, just a hole where an event should of been. Then the tow truck driver said fine, but by the same logic the mayor of our city caused that cat to die too, since if the mayor had driven over and fed it, the cat lives. Nobody could answer him and we ran out of term.

  So for the final I want one essay question built out of that, plus a model answer, plus a marking scheme.

  Here's the situation I invented. Tighten the wording however you like, but don't change the structure — the structure is the whole point.

  Case one. A cold-storage warehouse holding a pallet of insulin for a clinic. The shift rulebook says the overnight guard checks the freezer panel at 3am and again at 5am. Maya is the overnight guard; she knows the rule and has done it every night for two years. On this night she skips the 3am check to finish a coworker's paperwork. A valve starts leaking refrigerant around 2:40. At 3am the gauge would have shown the temperature climbing, and the rulebook says any climb means you ring the on-call tech, who could have had it fixed well before the insulin got too warm. The automatic high-temperature alarm had been switched off a month earlier by the manager because of false alarms, so the manual check was the only thing left standing between the leak and the loss. At 5am Maya does her check and finds the freezer at twelve degrees. The pallet is ruined.

  Case two. Same building, same leak at 2:40, same disabled alarm, same ruined pallet. One change. Maya is a temp from an agency, hired that afternoon to sit at the gate and log trucks. Nobody told her about the panel, nothing in her assignment mentions it, nobody expects her to know the building. The guard who is supposed to do the 4am backup walk, Tomas, fell asleep in the break room and never did it. And physically it's the same as case one: if Maya had wandered in and glanced at the panel at 3am she'd have seen the climb and known enough to ring the number stuck on the wall. When I tell this version, nearly everyone says her not looking didn't cause the loss, and Tomas's nap did.

  Case three, the tow truck again. A retired refrigeration engineer, forty miles away, used to service that building, knows exactly what that gauge reading would have meant. He wasn't there, he checked nothing. If he had been there and looked, the insulin would have been saved.

  They get 45 minutes, closed book. They haven't read a single philosopher and I don't want the question or the model answer name-dropping any — everything the question needs has to be sitting inside the question itself.

  The question should make them do three things: work out what exactly is hard about the fact that case one and case two have the same physical facts and the same what-would-have-happened facts but come out judged differently; propose something that explains the difference; and then test their own proposal on the retired engineer. I want a fourth beat too, where they have to face whether their fix means causation itself shifts when a manager writes or deletes a rule, and whether that's a cost they'll pay or dodge.

  A student who just recites "an omission causes an outcome if the outcome would have been prevented" should not pass. A student who says omissions arent really causes at all, we just talk that way, should not pass either — unless they can say what that does to the verdict everyone reaches in case one.

  Model answer around 600 words, plain words, written for someone smart who has never seen a philosophy paper and never will.

  Marking scheme out of 20, and I want it in terms of specific moves rather than vibes: tell me what an A answer does that a B answer doesn't, where the marks sit, and what each part is worth. Then give me the two or three responses that sound impressive out loud in the room but should lose marks, with a line each on why they're a dodge.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**

      *   **Context:** A Tuesday night community center class (adult learners, some didn't finish school, sharp arguers). The instructor is self-taught, writes own materials.
      *   **Topic:** Causation by omission (doing nothing vs. doing something).
      *   **The Problem:** The "Mayor/Feeding the Cat" problem (too many potential preventers). The specific classroom impasse was distinguishing between Maya (Case 1) and Maya (Case 2) and the Retired Engineer (Case 3).
      *   **Task:** Create a final exam question, a model answer, and a marking scheme.
      *   **Constraints:**
          *   Do not change the structure of the three cases provided (Case 1: Regular Guard Maya; Case 2: Temp Maya + Sleeping Tomas; Case 3: Retired Engineer).
          *   Tighten wording of cases if needed, but keep structure.
          *   Question must require four specific beats:
              1.  Identify the puzzle (same physical facts, different judgments in Case 1 & 2).
              2.  Propose an explanation for the difference.
              3.  Test that explanation on Case 3 (Engineer).
              4.  Face the implication: Does causation depend on rules/management? Is that a cost worth paying?
          *   No philosophy name-dropping (no "Hume," "Hart & Honoré," "counterfactuals," etc.). Plain language.
          *   Model Answer: ~600 words, plain English, smart but accessible.
          *   Marking Scheme: Out of 20, specific moves (not vibes), distinguish A vs. B.
          *   "Dodge" Examples: 2-3 impressive-sounding but wrong answers with explanations.
          *   Fail conditions: Reciting simple counterfactuals ("if she did it, it wouldn't happen") or denying omissions are causes without addressing Case 1 verdict.

  2.  **Drafting the Exam Question:**

      *   Need to present the three cases clearly.
      *   Need to frame the four required tasks explicitly so students know what to hit.
      *   Tone: Respectful of their intelligence, direct, no jargon.
      *   *Drafting thought:* Make sure the distinction between Case 1 and 2 is sharp. Case 1 is about duty/rule. Case 2 is about knowledge/assignment. Case 3 is about ability/knowledge without duty.
      *   *Refining the prompt:* Ensure the fourth beat (does causation shift when a manager writes a rule?) is clear. That's the philosophical crux.

  3.  **Drafting the Model Answer:**

      *   *Word Count:* Around 600 words.
      *   *Style:* Plain, argumentative, clear. No jargon.
      *   *Content:*
          *   Acknowledge the puzzle: Physically, both Mayas did the same thing (nothing).
          *   Proposal: It's not about physics, it's about *expectation* or *job*.
          *   Test on Engineer: He knew how, but had no job there. So he didn't cause it.
          *   The Hard Bit: This means causation isn't just "what happened in the world," it's "what was supposed to happen."
          *   Conclusion: We accept this because blaming everyone (like the Mayor) makes blame meaningless. We limit cause to those tasked with prevention.
      *   *Check against constraints:* Does it avoid simple counterfactuals? Yes. Does it address the "manager writes a rule" implication? Yes.

  4.  **Drafting the Marking Scheme:**

      *   Total: 20 marks.
      *   Breakdown by the four beats required in the prompt.
      *   *Beat 1 (The Puzzle):* 4 marks. Identifying that physical absence is identical in 1 & 2.
      *   *Beat 2 (The Proposal):* 6 marks. Articulating the "duty/role" distinction.
      *   *Beat 3 (The Engineer Test):* 5 marks. Applying the rule consistently to Case 3.
      *   *Beat 4 (The Implication):* 5 marks. Grappling with the "causation depends on rules" idea.
      *   *Differentiation:* A answers engage with the *implication* (Beat 4). B answers might stumble there or be vague on Beat 2.
      *   *Fail Conditions:* Explicitly mention the "simple counterfactual" fail and the "omissions aren't real" fail.

  5.  **Drafting the "Dodge" Examples:**

      *   Need answers that sound smart but miss the point.
      *   *Dodge 1:* "Intent." (Maya didn't mean to kill the insulin). *Why it fails:* Case 1 says she skipped to do paperwork, not to ruin insulin. Case 2 temp didn't mean to either. Doesn't solve the difference.
      *   *Dodge 2:* "Physical Force." (Nothing physical happened). *Why it fails:* Doesn't explain why we blame Case 1 Maya but not Case 2 Maya.
      *   *Dodge 3:* "The Manager Caused It." (Because he turned off the alarm). *Why it fails:* Dodges the specific question about Maya's omission vs. the Engineer.

  6.  **Review and Refine:**

      *   *Tone Check:* Is it respectful to the "Tuesday night class" vibe? Yes, keep it grounded.
      *   *Constraint Check:* Did I change the case structure? No, just tightened wording.
      *   *Word Count Check:* Model answer needs to be close to 600.
      *   *Marking Scheme:* Ensure it's actionable for the instructor.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the Model Answer, make sure I don't accidentally use the word "counterfactual." Use "what-if" or "if-then."
      *   *Correction:* Ensure the Marking Scheme clearly penalizes the "Mayor" style logic (everyone caused it) without explicitly naming the Mayor, focusing on the Engineer case.
      *   *Correction:* Make sure the "Manager writes a rule" implication is highlighted in Beat 4 of the marking scheme. That's the hardest part.

  8.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  **FINAL EXAM: CAUSE AND BLAME**
  **Time:** 45 Minutes
  **Conditions:** Closed book. No outside notes.

  **The Cases**

  **Case One.** A cold-storage warehouse holds a pallet of insulin for a clinic. The rulebook says the overnight guard must check the freezer panel at 3am and 5am. Maya is the overnight guard; she knows the rule and has done it for two years. On this night, she skips the 3am check to finish a coworker's paperwork. A valve starts leaking refrigerant at 2:40am. At 3am, the gauge would have shown the temperature climbing. The rulebook says any climb means you ring the on-call tech, who could have fixed it before the insulin warmed. The automatic high-temperature alarm had been switched off a month earlier by the manager due to false alarms, so the manual check was the only thing left. At 5am, Maya checks and finds the freezer at twelve degrees. The pallet is ruined.

  **Case Two.** Same building, same leak at 2:40am, same disabled alarm, same ruined pallet. One change. Maya is a temp from an agency, hired that afternoon to sit at the gate and log trucks. Nobody told her about the panel; nothing in her assignment mentions it; nobody expects her to know the building. The guard supposed to do the 4am backup walk, Tomas, fell asleep in the break room and never did it. Physically, it is the same as Case One: if Maya had wandered in and glanced at the panel at 3am, she would have seen the climb and known enough to ring the number stuck on the wall.

  **Case Three.** A retired refrigeration engineer lives forty miles away. He used to service that building and knows exactly what that gauge reading would have meant. He was not there; he checked nothing. If he had been there and looked, the insulin would have been saved.

  **The Question**

  Write an essay addressing the following four points:

  1.  **The Puzzle:** In Case One and Case Two, Maya physically did the exact same thing (nothing). In both cases, if she had looked, the loss would have been prevented. Why do we judge them differently? What is the hard part about this?
  2.  **The Fix:** Propose a rule that explains why Case One Maya caused the loss, but Case Two Maya did not.
  3.  **The Test:** Apply your rule to Case Three (the Engineer). Did he cause the loss? Why or why not?
  4.  **The Cost:** If your rule is correct, it means causation changes when a manager writes or deletes a rule in a book. The physical world stays the same, but the "cause" shifts. Is this a cost you are willing to pay? Explain why or why not.

  ***

  **MODEL ANSWER**

  The hard part of this puzzle is that physics and judgment are fighting each other. In both Case One and Case Two, the physical reality is identical. A human being did not move their body to look at a gauge. A machine broke. Medicine spoiled. In both stories, if the human had moved, the medicine would have been saved. If we define "cause" strictly as "something that happened to change the world," then neither Maya caused anything. Nothing came out of them; there was just a hole where an action should have been. But we feel sure that Case One Maya is responsible and Case Two Maya is not. This means our idea of cause isn't just about physics. It's about expectations.

  The rule that fixes this is that an omission is only a cause if there was a specific duty to act. In Case One, Maya had a job description, a rulebook, and a history of doing the check. She was the designated preventer. When she didn't check, she broke a link in a chain she was hired to hold. In Case Two, the temp Maya was physically capable of saving the insulin, but she had no assignment to do so. She was a stranger to the freezer. We don't blame strangers for every accident they could have stopped; otherwise, everyone who passed the building that night caused the loss. The difference isn't in the blood or the bones; it's in the contract.

  When we test this on Case Three, the Retired Engineer, the rule holds. The engineer had the knowledge and the ability. If he had driven over, he could have fixed it. But he had no duty. He wasn't on the clock. He wasn't assigned the building. Under the "duty" rule, he did not cause the loss. If we said he did, we would have to say the Mayor caused it too, or the neighbor who didn't come over. The list of "causes" would become infinite and useless. We limit cause to the people tasked with prevention.

  This leads to the hard cost. If this rule is right, then causation isn't a fixed fact like gravity. It shifts when a manager writes a rule. If the manager fires Case One Maya and hires Case Two Maya but forgets to update the rulebook, suddenly the "cause" of the next accident might vanish, or shift to someone else, even though the physical world hasn't changed. This feels uncomfortable. We want causes to be real things, not paperwork.

  However, I am willing to pay this cost. If we insist that cause is only physical, we can't explain why we blame Case One Maya but not the Engineer. We would have to say nobody caused the insulin to spoil, which makes a mockery of the loss. Or we would have to say everyone caused it, which makes blame meaningless. It is better to accept that "cause" in human affairs includes human agreements. A rulebook doesn't change the refrigerant, but it changes who is answerable when the refrigerant leaks. Causation here isn't just about what broke the machine; it's about who was supposed to stop it.

  ***

  **MARKING SCHEME (OUT OF 20)**

  **Part 1: The Puzzle (4 Marks)**
  *   **4:** Clearly states that physical facts are identical in Case 1 & 2, but judgments differ. Identifies that "nothing happened" physically in both.
  *   **2-3:** Notes the difference in judgment but misses the physical similarity, or vice versa.
  *   **0-1:** Fails to identify the conflict between physics and judgment.

  **Part 2: The Fix (6 Marks)**
  *   **5-6:** Proposes "Duty," "Role," "Assignment," or "Expectation" as the distinguishing factor. Explicitly rejects simple "could have prevented it" logic.
  *   **3-4:** Suggests a difference (e.g., knowledge) but doesn't fully explain why it blocks the "Mayor/Engineer" problem.
  *   **0-2:** Relies solely on "if she did it, it would be saved" (Counterfactual fail) or says "Case 2 Maya didn't care."

  **Part 3: The Test (5 Marks)**
  *   **5:** Applies the "Duty" rule consistently to the Engineer. Verdict: Engineer did *not* cause it. Reason: No assignment/duty.
  *   **3-4:** Gets the verdict right but reasoning is vague (e.g., "He wasn't there" without explaining why being there matters).
  *   **0-2:** Says Engineer caused it because he "could have saved it" (Contradicts their own Fix).

  **Part 4: The Cost (5 Marks)**
  *   **5:** Acknowledges that this makes causation dependent on rules/paperwork. Takes a stance on whether this is acceptable (Yes: necessary for blame to work; No: makes cause too subjective).
  *   **3-4:** Acknowledges the rule-dependence but doesn't evaluate the cost.
  *   **0-2:** Ignores the implication that managers define cause.

  **Automatic Fail Conditions**
  *   **The Counterfactual Recitation:** "She caused it because if she checked, it wouldn't be ruined." (Applies to both Mayas, fails to distinguish). Max score 5.
  *   **The Denial:** "Omissions aren't real causes." (Must explain why Case One Maya is still blamed. If they don't, Max score 5).

  ***

  **COMMON DODGES (Impressive sounding, but lose marks)**

  **1. "It's about Intent."**
  *   *Student says:* "Case One Maya chose to skip the check. Case Two Maya didn't know. Cause requires choice."
  *   *Why it loses:* Case One Maya didn't intend the *loss*, she intended to do paperwork. This confuses *blame* with *causation*. The prompt asks about causing the loss, not criminal intent.

  **2. "The Manager Caused It."**
  *   *Student says:* "In all cases, the Manager caused it by turning off the alarm. The Mayas are irrelevant."
  *   *Why it loses:* This dodges the specific comparison between the two Mayas and the Engineer. It sidesteps the question of omission entirely.

  **3. "Physical Force is Required."**
  *   *Student says:* "Nothing is a cause unless energy is transferred. Neither Maya caused it. The leak caused it."
  *   *Why it loses:* Fails Part 4. If neither Maya caused it, you cannot explain why we hold Case One Maya accountable in the real world. It ignores the human context of the class discussion.
