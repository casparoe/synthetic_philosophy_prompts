answer: |-
  # Conceptual Foundations: Adequacy Conditions for the Thermodynamic Arrow

  ## 1. Refined Specifications of Adequacy

  The following list specifies the conditions an account of the arrow of time must satisfy to be adequate for the purpose of licensing coarse-grained, irreversible modelling in stochastic thermodynamics. The list is shorter than the candidate set by merging redundant epistemic and dynamic constraints, but longer in analytical depth by distinguishing between ontological independence and operational delimitation.

  1.  **Micro-Reversibility Accommodation**
      *   *Specification:* The account must reconcile the macroscopic arrow with the time-reversal invariance (TRI) of the underlying microscopic dynamics (classical or quantum). It must explain why velocity-inverted microstates, which would evolve backwards, are effectively absent without denying their physical possibility.
      *   *Motivation:* Denying TRI contradicts established mechanics; ignoring velocity inversion renders the arrow a dynamical necessity rather than a statistical contingency, falsifying the account in the mesoscopic regime.

  2.  **Fluctuation Compatibility**
      *   *Specification:* The account must accommodate the existence of trajectories with negative entropy production, as quantified by fluctuation theorems (e.g., Jarzynski, Crooks). It must define the arrow as a statistical bias rather than a strict prohibition, preserving the directionality even where violations are measurable.
      *   *Motivation:* In small driven systems, second-law-violating trajectories are not noise to be ignored but data to be weighted. An account requiring strict monotonicity fails empirical contact with the mesoscopic regime.

  3.  **Descriptive Relativity**
      *   *Specification:* The account must explicitly state how the arrow depends on the choice of macroscopic variables (coarse-graining). It must clarify whether the arrow is a feature of the physical system *simpliciter* or of the system-relative-to-a-description.
      *   *Motivation:* Entropy is not a state function of the microstate alone. If the arrow's existence depends on the observer's resolution, the account must own this relativity rather than hiding it.

  4.  **Refinement Stability**
      *   *Specification:* While the *magnitude* of entropy production may change with description, the *direction* of the arrow assigned to a system must not flip when the description is made strictly more fine-grained (provided the coarse-graining remains valid).
      *   *Motivation:* If refining the measurement apparatus reverses the inferred arrow, the arrow is an artifact of the model rather than a property of the process, undermining its use in physical explanation.

  5.  **System–Bath Delimitation**
      *   *Specification:* The account must specify how the arrow depends on the partition between "system," "bath," and "protocol." It must determine whether changing the boundary (e.g., including the controller in the system) alters the attribution of irreversibility.
      *   *Motivation:* In stochastic thermodynamics, entropy production is defined relative to a bath and a driving protocol. An account that cannot locate the source of dissipation relative to these boundaries cannot guide modelling.

  6.  **Cosmological Independence (Boundary-Locality)**
      *   *Specification:* The determination of the arrow in a laboratory system must be fixable by facts local to the laboratory and its immediate environment, without requiring reference to the global state of the universe at the Big Bang.
      *   *Motivation:* Scientific practice assumes local sufficiency. If validating a local irreversible model requires cosmological data, the account fails to license routine laboratory modelling.

  7.  **Control-and-Evidence Asymmetry**
      *   *Specification:* The account must explain the asymmetry of intervention (we prepare initial states, not final ones) and records (we have evidence of the past, not the future) without invoking the thermodynamic arrow to explain the control asymmetry, and vice versa.
      *   *Motivation:* Leaning on "preparation" to explain the arrow risks circularity if preparation itself presupposes an arrow. The account must disentangle the causal asymmetry of agency from the thermodynamic asymmetry of dissipation.

  8.  **Compositional Consistency**
      *   *Specification:* The account must explain how arrows nest in composite systems. Specifically, it must handle feedback-controlled subsystems (Maxwell's demons) where local entropy decreases are paid for by global increases, without positing distinct "types" of arrows.
      *   *Motivation:* Small systems are often embedded in feedback loops. An account that breaks down when information engines are introduced cannot support modern stochastic thermodynamics.

  9.  **Operational Decidability**
      *   *Specification:* For a given system and description, the account must yield a determinate yes/no verdict on the existence and direction of the arrow. It cannot leave the direction indeterminate or context-dependent in a way that precludes modelling.
      *   *Motivation:* The stated purpose is to license modelling. Indeterminacy regarding the direction of time renders the modelling framework ill-posed.

  10. **Non-Circularity**
      *   *Specification:* The account must not posit the very asymmetry it aims to derive. It cannot smuggle time-directionality in through the definition of "measurement," "probability," or "conditioning."
      *   *Motivation:* Explanatory power requires derivation from time-symmetric or neutral premises. Begging the question renders the account a restatement of the phenomenon.

  11. **Recurrence Dismissal**
      *   *Specification:* The account must address Poincaré recurrence by demonstrating why recurrence timescales are irrelevant to the thermodynamic arrow in open, driven systems, rather than simply asserting they are "too long."
      *   *Motivation:* In bounded conservative systems, entropy gradients must reverse. The account must explain why driven open systems escape this fate dynamically, not just practically.

  12. **Empirical Uniqueness**
      *   *Specification:* The account must be consistent with the absence of observed domains exhibiting the opposite arrow. It must describe what such a domain would look like to explain why we do not see it (e.g., observational selection vs. physical impossibility).
      *   *Motivation:* If the account allows for opposite arrows, it must explain their absence to maintain contact with actual observation.

  ---

  ## 2. Analysis of Requirements

  ### 2.1 Classification of Requirements

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. Micro-Reversibility** | Non-negotiable | Contradicting established dynamics (QM/CM) falsifies the account immediately. |
  | **2. Fluctuation Compatibility** | Non-negotiable | Essential for the specific purpose (stochastic thermodynamics); strict 2nd law accounts fail here. |
  | **3. Descriptive Relativity** | Non-negotiable | Entropy is definition-dependent; denying this is category error. |
  | **4. Refinement Stability** | Negotiable | Some accounts (e.g., subjective Bayesian) may allow direction to shift with agent resolution, though this weakens modelling utility. |
  | **5. System–Bath Delimitation** | Non-negotiable | Required for open system modelling; without it, entropy production is undefined. |
  | **6. Cosmological Independence** | **Camp-Specific** | **Localist/Humean Camp.** Globalist/Past-Hypothesis camps reject this; they argue local arrows *derive* from global conditions. |
  | **7. Control-and-Evidence** | Camp-Specific | **Agency-Based Camp.** Realists about the arrow argue control asymmetry is a *consequence*, not a foundation. |
  | **8. Compositional Consistency** | Non-negotiable | Feedback control is standard in small systems; the account must handle it. |
  | **9. Operational Decidability** | Non-negotiable | Directly follows from the stated purpose (licensing modelling). |
  | **10. Non-Circularity** | Non-negotiable | Methodological baseline for explanation. |
  | **11. Recurrence Dismissal** | Negotiable | For open driven systems, recurrence is dynamically suppressed, not just timescale-dismissed. |
  | **12. Empirical Uniqueness** | Non-negotiable | Empirical adequacy constraint. |

  ### 2.2 Joint Unsatisfiability and Tensions

  The most significant tension exists between **Requirement 6 (Cosmological Independence)** and the **Past-Hypothesis framework** (which typically treats Requirement 6 as false).

  *   **The Conflict:** If the thermodynamic arrow is grounded in the low-entropy boundary condition of the early universe (Past Hypothesis), then the arrow in a laboratory is *not* fixed by local facts alone. It is fixed by the local facts *plus* the global cosmological history. A system locally identical to ours but embedded in a universe with a "future" low-entropy boundary would exhibit the opposite arrow.
  *   **Which Gives Way:**
      *   **Past-Hypothesis View:** Rejects Requirement 6. It argues that "Boundary-Locality" is a pragmatic illusion; ontologically, the arrow is global.
      *   **Localist/Pluralist View:** Rejects the Past-Hypothesis dependency. It argues that local gradients (e.g., prepared non-equilibrium states) are sufficient to generate a local arrow, regardless of cosmology.
      *   **Resolution for Your Purpose:** Since your purpose is *laboratory modelling*, Requirement 6 is functionally non-negotiable. You may accept a Past-Hypothesis ontology, but the account must demonstrate how it *reduces* to local sufficiency for the sake of decidability. If it cannot, it fails Requirement 9 (Operational Decidability).

  A secondary tension exists between **Requirement 3 (Descriptive Relativity)** and **Requirement 4 (Refinement Stability)**.
  *   **The Conflict:** If the arrow depends on coarse-graining (Req 3), there is a risk that sufficient refinement could dissolve the gradient entirely (approaching the microstate where entropy is constant).
  *   **Which Gives Way:** Adequate accounts treat Req 3 as ontological (entropy *is* relative) but Req 4 as a constraint on *valid* descriptions. The arrow is stable across the "plateau" of valid macroscopic descriptions, even if it vanishes at the microscopic limit.

  ### 2.3 Exclusionary and Assumed Requirements

  *   **Most Exclusionary:** **Requirement 2 (Fluctuation Compatibility).**
      *   *Reasoning:* This excludes any account that treats the Second Law as a strict, deterministic law rather than a statistical tendency. It rules out classical phenomenological thermodynamics as a foundational account and demands a statistical mechanical underpinning capable of handling transient violations.
  *   **Most Often Assumed:** **Requirement 10 (Non-Circularity).**
      *   *Reasoning:* Many accounts smuggle the arrow in through the "initial probability distribution" (assuming uniformity in the past but not the future) or through the definition of "intervention" (assuming agents can only act on the past). This requirement is frequently cited but rarely rigorously enforced in derivations.

  ### 2.4 Purpose Shift: From Laboratory to Cosmology

  If the purpose shifts from **licensing laboratory modelling** to **explaining the cosmic gradient**:

  1.  **Requirement 6 (Cosmological Independence)** drops from Non-negotiable to **Irrelevant**. The goal becomes explaining the global boundary condition, so locality is no longer a constraint.
  2.  **Requirement 5 (System–Bath Delimitation)** becomes **Negotiable**. In a cosmological context, there is no external bath; the universe is the closed system.
  3.  **Requirement 9 (Operational Decidability)** weakens. Cosmological arrows are singular; we cannot run multiple trials of the universe. The requirement shifts to "Narrative Consistency" rather than "Modelling Decidability."
  4.  **Requirement 7 (Control-and-Evidence)** gains weight. In the absence of an external agent, the asymmetry of records becomes the primary evidence for the cosmic arrow.

  ---

  ## 3. Evaluation of Candidate Accounts

  The following evaluation focuses strictly on where each account fails to meet the refined specifications above, relative to your stated purpose (small driven systems).

  | Account | Primary Failures | Reasoning |
  | :--- | :--- | :--- |
  | **Past-Hypothesis + Statistical Mechanics** | **Req 6 (Cosmological Independence)**<br>**Req 9 (Operational Decidability)** | While robust on Micro-Reversibility (Req 1), it makes the local arrow dependent on the global initial condition. For a laboratory modeller, this is ontologically correct but operationally useless; one cannot check the Big Bang to validate a colloidal particle model. It struggles to justify why local non-equilibrium preparations suffice without referencing the global past. |
  | **Typicality Accounts** | **Req 10 (Non-Circularity)**<br>**Req 3 (Descriptive Relativity)** | Typicality is always "typical relative to a measure." Selecting the Lebesgue measure (or similar) often presupposes the time-asymmetry it aims to explain. Furthermore, typicality is defined on phase space, making it difficult to reconcile with the description-relativity required for coarse-grained entropy (Req 3) without ad hoc additions. |
  | **Interventionist / Agency-Based** | **Req 10 (Non-Circularity)**<br>**Req 1 (Micro-Reversibility)** | These accounts ground the arrow in the asymmetry of human control (we prepare, we don't post-select). This fails Non-Circularity because "preparation" already presupposes a causal arrow. It also struggles with Micro-Reversibility, often treating the agent as outside the physical dynamics, which is untenable for mesoscopic systems where the "controller" is a physical feedback loop. |
  | **Fundamental Arrow (e.g., Prigogine, Penrose)** | **Req 1 (Micro-Reversibility)**<br>**Req 2 (Fluctuation Compatibility)** | Positing a fundamental time-asymmetric law contradicts the TRI of standard quantum and classical mechanics (Req 1). Additionally, fundamental arrow theories often posit a strict directionality that is difficult to reconcile with the exact statistical weights of entropy-decreasing trajectories required by Fluctuation Theorems (Req 2). |

  **Summary:** For the specific purpose of licensing stochastic thermodynamics in small driven systems, the **Past-Hypothesis** account is the strongest contender *provided* it can demonstrate **Effective Locality** (satisfying Req 6 pragmatically). The **Interventionist** account is the most useful for *modelling practice* but the weakest on *foundational coherence* (failing Req 10). The **Fundamental Arrow** and **Typicality** accounts face the highest hurdles in reconciling with the mesoscopic empirical data (Req 2) and the underlying dynamics (Req 1).
