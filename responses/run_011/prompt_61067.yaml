prompt: |-
  Our Sanskrit reading group has been stuck on the pramāṇa-count dispute for months and I've come to think we're not actually having one argument. Quick sketch of the positions as I understand them: the Buddhist side (Dignāga, then Dharmakīrti) says there are exactly two pramāṇas, perception and inference, and that the reason is metaphysical — there are only two kinds of knowable object, the particular and the general — so testimony about a pot, or about impermanence, just is an inference from an utterance to a fact, and comparison and postulation are inferential too. The Nyāya side says four: perception, inference, comparison, and testimony, where testimony is the utterance of a trustworthy person and is irreducible, because the cognition it produces has its own distinctive causal shape. And then the Mīmāṃsakas push the number back up again — Kumārila to six with postulation and non-apprehension, Prābhākara folding absence back into perception.

  My hypothesis, which nobody else in the group will accept: "how many pramāṇas are there" isn't one question, because the two sides are individuating along incompatible axes. The Buddhists count by content — what kind of object the cognition is about — so two objects gives you two pramāṇas. The Naiyāyikas count by causal route — how the cognition got produced — so every genuinely distinct generative process earns its own slot. Each axis reductios the other: count by route and you should get indefinitely many pramāṇas (seeing a pot vs. seeing a cloth, my mother's word vs. the Veda's), count by content and Nyāya's four collapses. If that's right the debate is partly verbal, but I don't think that's the whole story, because the count has downstream work to do — wether the Veda can be authoritative without an author, whether the Buddha's word is a pramāṇa at all, whether absences are knowable.

  So: diagnose it. Is the axis mismatch the real engine of the impasse, or is there a substantive disagreement hiding underneath that survives once you separate the two questions? Where would you put comparison and postulation in your diagnosis? And given what you land on, what would count as progress — a distinction, a test case that breaks the tie, or a reason to think no tie-breaking case is even available? Be as committed as you can be about which of these it is, but tell me explicitly what would change your mind, and where you think your own reasoning is most likely to break.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A Sanskrit reading group stuck on the *pramāṇa*-count dispute (Buddhists vs. Nyāya vs. Mīmāṃsā).
      *   **User's Hypothesis:** The dispute is a category error/mismatch of axes. Buddhists count by *content/object* (particular vs. universal), Nyāya counts by *causal route/process* (distinct generative mechanisms).
      *   **Task:** Diagnose the impasse. Is the axis mismatch the real engine, or is there a substantive disagreement underneath? Where do comparison (*upamāna*) and postulation (*arthāpatti*) fit? What counts as progress?
      *   **Constraints:** Be committed to a position, state what would change my mind, and identify where my reasoning might break.

  2.  **Evaluate the User's Hypothesis:**
      *   *Strengths:* It's a sophisticated meta-philosophical take. It captures the Buddhist reductionism well (Dignāga's *anyāpoha* theory links inference to exclusion/universals). It captures Nyāya's realism about causal processes (*kāraṇa*).
      *   *Weaknesses:* It might be *too* neat. It risks dismissing the ontological commitments as merely semantic. The Buddhists *do* care about causal efficiency (*arthakriyā*), and Nyāya *does* care about the object (*viṣaya*). The axes aren't perfectly orthogonal; they intersect.
      *   *Verdict:* The axis mismatch is a major *source* of talking past each other, but not the *whole* story. The substantive core is ontological: What exists? (Particulars only vs. Particulars + Universals + Absences + Relations).

  3.  **Formulate the Diagnosis:**
      *   **Agreement:** The user is right that the *counting criteria* differ. This explains the intractability.
      *   **Disagreement/Nuance:** It's not *just* verbal. The counting criteria are driven by deeper ontological commitments. The "axis mismatch" is a symptom, not the disease. The disease is the disagreement about the structure of reality and the nature of truth.
      *   **Comparison (*Upamāna*):** Nyāya sees it as knowing the relation between a word and its referent via similarity. Buddhists reduce it to inference (seeing similarity -> inferring name). This fits the user's "route vs. content" model well.
      *   **Postulation (*Arthāpatti*):** Mīmāṃsā (Kumārila) sees it as distinct (fat Devadatta doesn't eat by day -> must eat by night). Buddhists/Nyāya often reduce to inference. This is the hardest case for the "two pramāṇas" view and tests the "causal route" theory.
      *   **Progress:** Not a tie-breaking case (since axioms differ), but a mapping of the *cost* of each system. Progress = recognizing that adopting a *pramāṇa* count entails adopting an ontology.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Step 1: Validate the User.* Acknowledge the sophistication. It's better than the standard "Buddhists are nominalists, Nyāya are realists" summary.
      *   *Step 2: Push Back on "Merely Verbal".* If it were just verbal, they could agree to disagree. But they don't. Why? Because *pramāṇa* theory determines soteriology and epistemology. If testimony (*śabda*) isn't a *pramāṇa*, the Veda loses authority (huge for Mīmāṃsā/Nyāya). If inference isn't valid for ultimates, Buddhism loses its path.
      *   *Step 3: The Ontological Anchor.* The axis mismatch exists *because* of ontology. Buddhists: Only particulars exist (*svalakṣaṇa*). Therefore, only perception (grasping particulars) and inference (constructing universals) are possible. Nyāya: Universals, absences, etc., exist. Therefore, distinct tools are needed to grasp them.
      *   *Step 4: Comparison & Postulation.*
          *   *Upamāna:* Nyāya says it's a unique cognition of relation. Buddhist says it's inference from similarity. User's hypothesis holds here: Nyāya = distinct route, Buddhist = same content (universal).
          *   *Arthāpatti:* This is the stress test. Kumārila says it's not inference because there's no *vyāpti* (pervasion). It's a distinct cognitive event. If the user's "causal route" theory is right, Nyāya/Mīmāṃsā should accept it. Buddhists reject it because it implies a reality structure they deny.
      *   *Step 5: Defining Progress.* Progress isn't solving the count. It's realizing the count is a *proxy war* for ontology. The "test case" isn't an example, but a transcendental argument: "What must reality be like for this cognition to occur?"
      *   *Step 6: Commitment & Vulnerability.* I need to take a stand. I will argue that the ontological disagreement is primary, and the axis mismatch is the *expression* of it.
      *   *Step 7: Falsification Conditions.* What would make me wrong? If textual evidence shows Nyāya explicitly adopting the Buddhist object-criterion but disagreeing on the count, or vice versa. Or if a neutral third party (like Jainas) resolves it without ontology.

  5.  **Refining the Tone:**
      *   Needs to be scholarly but conversational (it's a reading group context).
      *   Respectful of the user's insight but challenging the conclusion.
      *   Clear structure.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate Nyāya and Mīmāṃsā too much. They agree on *śabda* but differ on *arthāpatti* and *anupalabdhi*.
      *   *Correction:* Ensure I address the "causal shape" point the user made about Nyāya. That's a strong point (Gaṅgeśa's *nirūpaṇa*).
      *   *Emphasis:* Highlight that *pramāṇa* isn't just "method of knowing," it's "instrument of *valid* knowing" tied to *mokṣa*.

  7.  **Final Output Structure:**
      *   Validation of the hypothesis (It's insightful).
      *   The Pivot (It's not just axes, it's ontology).
      *   Case Studies (Upamāna & Arthāpatti).
      *   Definition of Progress (Ontological cost-benefit).
      *   Commitment & Falsification.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a remarkably sharp diagnosis. You have correctly identified that the *pramāṇa*-count debate is often treated as a mere numbers game when it is actually a clash of architectural principles. Your hypothesis—that Buddhists individuate by *object* (*viṣaya*) while Nyāya individuates by *causal mechanism* (*kāraṇa*)—is textually defensible and explains a great deal of the talking-past-each-other.

  However, I am going to push back on your conclusion that this makes the dispute "partly verbal" or that the axis mismatch is the *engine* of the impasse.

  Here is my diagnosis: **The axis mismatch is not the cause of the disagreement; it is the symptom.** The substantive disagreement hiding underneath is ontological, specifically regarding the *furniture of reality* required to ground the causal routes. If you separate the two questions (object vs. route), the dispute doesn't dissolve; it just moves upstream to metaphysics.

  Here is the breakdown of why I think this, how *upamāṇa* and *arthāpatti* function as stress tests, and what actual progress looks like.

  ### 1. The Ontological Anchor
  You suggest the Buddhists count by content (particular vs. general) and Nyāya by causal route. This is accurate as far as it goes. Dignāga's *Pramāṇasamuccaya* explicitly ties the two *pramāṇas* to the two *lakṣaṇas* (particulars and universals). If there are only two kinds of knowable, there can only be two kinds of knowing.

  But why are there only two kinds of knowable for the Buddhist? Because of *momentariness* and *nominalism*. Universals don't exist; they are conceptual constructions (*kalpanā*). Therefore, inference doesn't "grasp" a universal; it constructs an exclusion (*anyāpoha*).

  Nyāya, conversely, insists on distinct causal routes *because* they believe the objects of those routes are ontologically distinct. For Nyāya, a universal (*sāmānya*) is a real entity (*padārtha*). Absence (*abhāva*) is a real entity. The relation between a word and its object (*śakti*) is a real relation.

  If Nyāya accepted the Buddhist ontology (only particulars exist), their "causal route" argument would collapse. You cannot have a distinct causal route to a universal if universals are fictions. Conversely, if Buddhists accepted Nyāya ontology, their "object" argument would force them to admit more *pramāṇas*.

  **The Impasse:** The debate isn't about how to count; it's about what exists to be counted. The axis mismatch is a defensive fortification. Buddhists use the object-criterion to *enforce* ontological parsimony. Nyāya uses the causal-criterion to *protect* ontological richness.

  ### 2. The Stress Tests: Comparison and Postulation
  Your hypothesis handles *upamāṇa* (comparison) well, but *arthāpatti* (postulation) is where the "causal route" theory faces its hardest test.

  **Upamāna (Comparison):**
  *   **Nyāya:** I see a wild cow (*gavaya*), remember my friend's description ("like a cow"), and cognize the relation between the word "gavaya" and the animal. This causal chain is unique; it's not perception (I didn't see the relation before), and it's not inference (no *vyāpti* established). Distinct route = distinct *pramāṇa*.
  *   **Buddhist:** This is just inference. I see similarity, I infer the name.
  *   **Diagnosis:** Your axis theory works perfectly here. Nyāya counts the route; Buddhists count the content (similarity is a universal/concept, so it falls under inference).

  **Arthāpatti (Postulation):**
  *   **Case:** "Fat Devadatta does not eat during the day." We postulate "He eats at night."
  *   **Mīmāṃsā (Kumārila):** This is not inference. Inference requires a pervasion (*vyāpti*) between a mark and a probandum. There is no established pervasion between "fatness + not eating by day" and "eating by night." It is a distinct cognitive event required to resolve a contradiction between two known facts.
  *   **Buddhist/Nyāya Reduction:** Most Nyāyikas (and Buddhists) try to reduce this to inference (*anumāna*).
  *   **Diagnosis:** If your "causal route" hypothesis were the *sole* driver, Nyāya should side with Mīmāṃsā here. The causal shape of resolving a contradiction feels distinct from standard induction. The fact that Nyāya often *resists* accepting *arthāpatti* suggests that even they are worried about ontological inflation. They don't want to multiply *pramāṇas* unless absolutely necessary. This suggests the "causal route" criterion has a threshold: the route must be distinct *and* the object must be real enough to warrant it.

  ### 3. What Counts as Progress?
  You asked what would count as progress: a distinction, a test case, or a reason to think no tie-breaker is available.

  I argue that **no tie-breaking case is available** within the epistemological framework, because the framework is downstream of the ontology. Progress in your reading group will only come from shifting the debate from "How many *pramāṇas*?" to "What is the *cost* of your ontology?"

  **The Progress Move:** Stop asking "Is *śabda* a *pramāṇa*?" and start asking "What must reality be like for *śabda* to function as you say?"
  *   **Buddhist:** For testimony to work, I need only hear sounds and infer intent. Cost: Low ontology. Risk: Cannot ground the authority of the Veda or the Buddha's word as *intrinsic*.
  *   **Nyāya/Mīmāṃsā:** For testimony to work, there must be an eternal relation between word and object. Cost: High ontology (eternal universals/relations). Benefit: Grounds Vedic authority without an author (Mīmāṃsā) or validates the Buddha's teaching on unseen soteriological truths (Nyāya).

  The "tie" isn't broken by finding a better example of perception. It's broken by deciding whether you are willing to pay the ontological price for the soteriological security.

  ### 4. My Committed Position
  **Thesis:** The axis mismatch is real, but it is instrumental. The substantive disagreement is about **causal efficacy (*arthakriyā*) vs. structural correspondence.**
  *   Buddhists demand a *pramāṇa* lead to something that can *do* something (particulars). Since only particulars exist, only perception is direct. Inference is a pragmatic tool, not a window into reality.
  *   Nyāya demands a *pramāṇa* correspond to the structure of reality. Since reality has structure (universals, absences), cognition must have matching structures.

  I am committed to the view that **the ontological disagreement is primary.** If you forced a Buddhist and a Naiyāyika to agree on an ontology (e.g., "Okay, universals are real"), the *pramāṇa* count would converge rapidly. If you forced them to agree on a *pramāṇa* count, they would still fight about what those *pramāṇas* are actually touching.

  ### 5. Vulnerability: What Would Change My Mind?
  I am willing to be wrong on two specific grounds. If you can show me either of these, I will retract the claim that ontology is primary:

  1.  **Textual Evidence of Ontological Agreement:** If you find a passage where a Buddhist (like Dharmakīrti) and a Naiyāyika (like Uddyotakara) explicitly agree on the status of universals (e.g., both admit they are real, or both admit they are fictional) but *still* maintain the 2 vs. 4 *pramāṇa* split solely on the definition of "instrument," then my ontological anchor fails. (I suspect this doesn't exist, but if it does, I'm wrong).
  2.  **The "Causal Shape" Independence:** If Gaṅgeśa (Navya-Nyāya) can be shown to define a *pramāṇa* purely by causal distinctiveness *without* referencing the object (*viṣaya*) at all. Gaṅgeśa is subtle; he often defines cognition by its content. If he defines *pramāṇa* strictly as a *karana* (instrument) irrespective of the *karma* (object), then your "axis mismatch" theory is the whole story, not just the symptom.

  ### 6. Where My Reasoning Might Break
  My weak point is **Prābhākara Mīmāṃsā.**
  The Prābhākaras reduce *anupalabdhi* (non-apprehension/absence) into perception. They argue that perceiving an empty floor *is* perceiving the absence of a pot; you don't need a separate *pramāṇa* for absence.
  *   **My Theory:** This supports the "ontology is primary" view. They deny the reality of absence as a separate category, so they collapse the *pramāṇa*.
  *   **Risk:** However, they keep *arthāpatti* as a separate *pramāṇa* (unlike Nyāya). If their reasoning for *arthāpatti* is purely about "cognitive distinctiveness" (causal route) while their reasoning for absence is "ontological parsimony," then they are mixing axes inconsistently. If the Prābhākaras are mixing axes strategically rather than consistently, then your "incompatible axes" hypothesis might be more accurate than my "ontological anchor" hypothesis. They might be using the axis that wins the specific argument.

  ### Recommendation for the Group
  Stop counting. Start mapping.
  Draw a table. Columns: Buddhist, Nyāya, Mīmāṃsā. Rows: Particulars, Universals, Absences, Word-Object Relations.
  Fill in "Real" or "Constructed."
  Then fill in the *pramāṇa* count.
  You will see the correlation is nearly perfect. The dispute isn't about the number 2 vs. 4. It's about whether the row "Universals" says "Real" or "Constructed."

  If you tackle the *pramāṇa* count without settling the "Real vs. Constructed" row, you will remain stuck for another year. The number is the shadow; the ontology is the object casting it.
