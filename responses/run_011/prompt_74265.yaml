  **Adverse Events:** Reportable events include severe indigestion, depressive episodes, and Abrupt Dissolution of Religious Conviction. The latter is classified as adverse for registry purposes despite potential philosophical benefit.
  **Conflicts of Interest:** Principal Investigator's own digestion may influence data interpretation.
  **Limitations:** Analysis plan is subject to the same physiological determinants as the data. If thought is a symptom of the body, then the analysis plan, the interpretation of the endpoint, and the limitations paragraph are symptoms too. The registry's own vocabulary imposes a morphology on the suffering it seeks to categorize. To mitigate confounding, investigators' own dietary logs must be published alongside the findings so that readers may assess what produced the assessment. A reader should feel the regress without the document ever naming it or apologizing for it. The administrative language is forced to acknowledge this in its own terms.
  **Lay Summary:** This study asks if what you eat changes what you think. We think heavy food makes heavy thoughts and that alcohol is like a bad religion. We want to see if eating lunch at noon and avoiding alcohol helps you think better than praying does. You cannot be blind to what you eat. We will measure how clear your thoughts are using a new scale. If you lose your faith, tell us immediately.
  **Amendment Note:** Protocol deviation. Principal Investigator unavailable following January 1889. Study terminated prematurely. Data integrity compromised.

  The piece enacts the methodological objection that objective measurement of subjective physiological states is impossible because the measuring instrument (the investigator's mind) is itself contingent on the variable being measured (dietary physiology). This is enacted in the Limitations paragraph, which mandates the publication of investigators' dietary logs to expose the regress of using a body-dependent thought to assess body-dependent thought.
