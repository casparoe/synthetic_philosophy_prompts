answer: |-
  ### Part 1: Brainstorming the Decision Space

  Before codifying a procedure, we must map the terrain you actually walk. You are not solving logic; you are managing **ontological debt**. Every spec you approve implicitly defines a model of the world. When that model diverges from reality, the robot fails.

  Here is the space of decisions you face in a standard behavior spec review:

  1.  **Belief Half-Life:** How long is a sensor reading "true"? (Is a barcode scan valid for 5 seconds or 5 hours?)
  2.  **Causal Closure:** What do we assume *cannot* change without our permission? (Do we assume racking is static? Do we assume WiFi is stable?)
  3.  **Observation Cost:** What is the latency/power/wear cost of verifying a fact? (Is it cheaper to assume the aisle is clear or to LIDAR-scan it?)
  4.  **Exception Bounding:** Which "unless..." clauses do we ignore? (We ignore "unless an earthquake hits." Do we ignore "unless a forklift driver parks here"?)
  5.  **Side-Effect Visibility:** What changes that we don't care about, but might hurt someone else? (If we block an aisle for 30s, does that matter to fire safety?)
  6.  **Recovery Authority:** When a belief is falsified, who fixes it? (The robot retries? The WMS reassigns? A human intervenes?)
  7.  **Stipulation vs. Sensing:** Which facts are *declared* true by the system architecture (e.g., "the map is correct") vs. *discovered* true by sensors?
  8.  **Temporal Granularity:** Does the spec treat the world as a sequence of snapshots or a continuous flow? (Crucial for moving obstacles vs. static slots.)

  **The Philosophical Mapping (For You, The Lead):**
  *   **The Frame Problem (Relevance):** Decisions 1, 2, 8. (What stays the same?)
  *   **The Qualification Problem (Preconditions):** Decisions 4, 7. (What could go wrong?)
  *   **The Ramification Problem (Side Effects):** Decision 5. (What else happens?)

  ---

  ### Part 2: The Spec-Review Procedure (The "Ontology Checklist")

  This procedure is designed to be run by your engineers in 60 minutes. It forces them to externalize their implicit assumptions without requiring them to understand the philosophy. You, as Lead, use the "Lead Notes" to interpret the output.

  #### Phase 1: State Validity (The Frame Problem)
  *Goal: Define how long beliefs persist before rotting.*

  **Q1. What is the "Time-To-Live" (TTL) for every critical belief used in this spec?**
  *   **Required Answer:** A specific duration or trigger for every variable (e.g., "Slot Occupancy: 10 mins," "Aisle Clear: 30 secs," "Battery Level: 5 mins").
  *   **Evidence:** A table mapping `Variable` -> `Source` -> `TTL`.
  *   **Not Ready:** If any variable is marked "Permanent" or "Until Changed" without a mechanism to detect change.
  *   **Escalation:** If TTL is shorter than the action duration (the robot can't act fast enough to verify).

  **Q2. What facts are "Architectural Truths" (never re-sensed)?**
  *   **Required Answer:** A list of facts the robot assumes are true because the infrastructure guarantees them (e.g., "Floor is flat," "Rack coordinates are fixed").
  *   **Evidence:** Reference to infrastructure spec or safety case.
  *   **Not Ready:** If safety-critical facts (e.g., "No humans in zone") are listed as Architectural Truths without physical barriers.
  *   **Escalation:** Any Architectural Truth that, if false, causes catastrophic damage. (This is a safety sign-off issue, not engineering.)

  #### Phase 2: Exception Bounding (The Qualification Problem)
  *Goal: Admit we can't list every precondition, so we list the ones we track.*

  **Q3. What is the "Known Unknown" list for this action?**
  *   **Required Answer:** A list of top 5 foreseeable conditions that would prevent success but are *not* checked before starting (e.g., "Pallet weight is within limit," "Fork holes are undamaged").
  *   **Evidence:** Risk register entry for each item.
  *   **Not Ready:** If the list is empty (implies perfect knowledge) or "All possible errors."
  *   **Escalation:** Any "Known Unknown" that violates safety regulations. (Must be mitigated or accepted by Safety Officer.)

  **Q4. What is the "Give-Up" condition?**
  *   **Required Answer:** The specific number of retries or specific error state that triggers a human handoff.
  *   **Evidence:** State machine diagram showing the `ERROR` -> `IDLE` transition.
  *   **Not Ready:** If the robot retries indefinitely or has no defined `IDLE` state.

  #### Phase 3: Impact & Side Effects (The Ramification Problem)
  *Goal: Acknowledge that acting changes more than the target fluent.*

  **Q5. What resources does this action consume or block?**
  *   **Required Answer:** List of shared resources (aisles, chargers, network bandwidth, human attention).
  *   **Evidence:** Resource lock diagram.
  *   **Not Ready:** If the spec assumes exclusive access to a shared resource without a locking mechanism.
  *   **Escalation:** If resource contention creates a deadlock risk or blocks emergency egress.

  **Q6. What physical changes occur outside the "Task Goal"?**
  *   **Required Answer:** Description of physical side effects (e.g., "Dust displacement," "Temporary occlusion of fire camera," "Battery heat").
  *   **Evidence:** Safety impact assessment.
  *   **Not Ready:** If the answer is "None."
  *   **Escalation:** Any side effect that impacts regulatory compliance (noise, heat, obstruction).

  ---

  ### Part 3: Running the Procedure on Your Cases

  Here is how the checklist applies to your three scenarios.

  #### Case 1: Human relocates pallet mid-task
  *   **Q1 (TTL):** The spec likely assumes `Pallet_Location` persists for the duration of the task (e.g., 5 mins).
      *   *Failure:* Human moves it at T+2 mins. Belief is stale.
      *   *Fix:* Reduce TTL on `Pallet_Location` to < 30s or add continuous verification.
  *   **Q3 (Known Unknowns):** "Human interference" must be on the list.
      *   *Escalation:* If the warehouse policy allows humans in robot zones, this is a **Safety Sign-off** issue. The robot cannot assume safety; the environment must guarantee it.
  *   **Verdict:** **Not Ready.** The spec treats a dynamic object as static. Requires either a handshake protocol (human scans pallet out) or continuous LIDAR tracking of the specific pallet.

  #### Case 2: Chilled slot contents degrade without action
  *   **Q1 (TTL):** `Slot_Contents_Quality` is the fluent.
      *   *Failure:* Standard TTLs are action-based (valid until next move). Here, time degrades value independently of the robot.
      *   *Fix:* TTL must be decoupled from robot action. `Quality` validity = `Last_Scan_Time` + `Degradation_Rate`.
  *   **Q2 (Architectural Truths):** You cannot treat "Contents are Good" as an Architectural Truth.
  *   **Verdict:** **Not Ready.** The ontology is missing a time-dependent fluent. The spec needs a "Freshness Check" step that is time-triggered, not just action-triggered.

  #### Case 3: Senior Engineer's Proposal ("Re-sense Everything Before Every Action")
  *   **Your Intuition:** This solves the Frame Problem. If we sense everything, we don't need to assume persistence.
  *   **Procedure Verdict:** **REJECTED (Not Ready).**

  **Why the Procedure Overrules You:**

  1.  **Q1 (TTL) Violation:** Sensing takes time. If you scan the whole world (T_sense) before acting (T_act), the world changes during T_sense. You have not eliminated the Frame Problem; you have merely shifted the validity window to the *start* of the scan. The data is stale by the time the motors engage.
  2.  **Q5 (Resource Block):** Full world scans consume bandwidth, compute, and time.
      *   *The Price:* In a high-throughput warehouse, a full resense adds 15-30 seconds per task cycle. Over 100 robots, 3 shifts, that is **~15% throughput loss**.
      *   *The Hidden Cost:* Sensor wear. LiDAR/ Cameras have duty cycles. Continuous full-sensing reduces hardware MTBF (Mean Time Between Failures).
  3.  **Q3 (Known Unknowns):** You still cannot sense everything. You cannot sense "floor friction coefficient" or "internal motor heat" or "WiFi packet loss probability" with a world scan. You are still relying on Architectural Truths (Q2).
  4.  **Safety Risk:** If the robot stops to resense everything in a dynamic aisle, it becomes a static obstacle. This increases collision risk from *other* agents (forklifts, humans) who expect flow.

  **The "Cheap-Looking" Fix Price:**
  The proposal looks robust but purchases **false certainty** at the cost of **system liveness**. It creates a Zeno's Paralysis where the robot spends more time verifying the world than operating in it. The procedure forces you to accept that *some* frame axioms (assumptions of persistence) are necessary for the system to function at all.

  **Correct Path:** Use the checklist to define *selective* sensing. Sense the aisle immediately before entry (high risk). Sense the slot location 5 minutes prior (low risk, high stability). Differentiate TTLs based on environmental volatility, not a blanket "sense all."

  ---

  ### Part 4: Limitations & Closing

  This procedure does not solve the Frame Problem. It cannot. No engineering checklist can solve a philosophical problem regarding relevance and causality. Here is where it will misfire and what it merely relocates:

  1.  **It Relocates Risk, It Doesn't Remove It:**
      By forcing engineers to write down TTLs and Known Unknowns, you are not making the robot smarter. You are making the *failure modes explicit*. You are moving the risk from "silent assumption" to "documented gamble." When a TTL expires and the robot stalls, that is not a bug; it is the system working as specified. You must be prepared to accept that stall rate as the cost of safety.

  2.  **It Misfires on Novelty:**
      The Qualification Problem (Q3) relies on "foreseeable" exceptions. This procedure cannot catch "Black Swan" events (e.g., a specific combination of WiFi interference and low battery that causes a specific drift). It creates a false sense of completeness. The "Known Unknown" list is always incomplete.

  3.  **It Depends on Your Intuition:**
      The checklist asks engineers to propose TTLs. If they guess 5 minutes and you approve it, and the physics of the warehouse dictates 2 minutes, the checklist passed but the robot failed. The procedure audits *consistency*, not *truth*. You still need the domain expertise to know that "Chilled Slot" implies faster decay than "Dry Goods."

  4.  **It Cannot Resolve Value Conflicts:**
      When Q5 (Throughput) conflicts with Q2 (Safety), the checklist flags it as "Escalation." It does not tell you the answer. You still have to decide if a 1% efficiency gain is worth a 0.01% increase in near-miss incidents. That is not an engineering decision; it is an ethical one.

  **Final Word:**
  You are correct that the logical frame problem is a museum piece. But the *relevance* frame problem is the daily tax you pay for operating in the real world. This procedure does not exempt you from the tax. It simply gives you an invoice so you know what you're paying for. Use it to force your team to admit what they don't know, rather than pretending they know everything.
