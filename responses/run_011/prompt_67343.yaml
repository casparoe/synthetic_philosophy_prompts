answer: |-
  # Seminar Activity: The Allocation Council

  **Course:** Philosophy of Mind (Upper-Level)
  **Time:** 75 Minutes
  **Students:** 14
  **Goal:** To experientially demonstrate the instability of computational criteria for moral status without invoking the "triviality of implementation" argument until the end.

  ## I. Setup and Materials

  **The Premise:**
  Tell the class they are the *Ontological Allocation Council*. A scarce resource, **Protection Units (PU)**, has become available. Only systems possessing "Moral Standing" are eligible. There are **100 PU** total. The docket contains 5 systems. The Council must draft a **Charter** (a set of necessary and sufficient conditions for Standing) and allocate the PU accordingly.

  **Materials:**
  1.  **Docket Cards (5 types, printed):**
      *   *ChatBot-7:* A deployed LLM with persistent memory.
      *   *NeuroSim-A:* A bit-perfect emulation of a mouse nervous system.
      *   *Climate-Model-X:* A supercomputer simulation predicting weather patterns.
      *   *The Geode:* A specific granite rock with complex crystal inclusions.
      *   *The Janus Box:* (See below).
  2.  **Protection Tokens:** 20 poker chips or printed slips (representing the 100 PU in batches of 5).
  3.  **Charter Worksheet:** One large sheet for the Adjudicators to write criteria.
  4.  **Role Badges:** 10 Advocates, 4 Adjudicators.

  **The "Two Claimant" System (The Janus Box):**
  *   **Physical Description:** A sealed black box. Input: Voltage fluctuations. Output: A sequence of blinking lights.
  *   **Claimant A (Internal):** The light sequence, when decoded via *Cipher Alpha*, maps perfectly to the behavioral dispositions of a frightened animal.
  *   **Claimant B (External):** The light sequence, when decoded via *Cipher Beta* (which is equally mathematically valid), maps to a random number generator used for lottery draws.
  *   **Constraint:** The physical hardware is identical. The group must decide if *this specific box* receives PU. They cannot split the box.

  ## II. Roles and Rounds (75 Minutes)

  ### Introduction (5 Minutes)
  *   **Instructor:** "You are the Council. Your goal is not to be 'kind,' but to be *consistent*. You must draft a Charter that explains *why* a system gets PU. If your Charter grants PU to something absurd, you must revise it. If it denies PU to something obvious, you must revise it. You have 100 PU. The docket requires 200 to be fully satisfied."

  ### Round 1: Advocacy (15 Minutes)
  *   **Assignment:**
      *   2 Students per Docket Item (10 students total). One argues *For* Standing, one argues *Against* (even for the ChatBot/NeuroSim, one must play devil's advocate to test robustness).
      *   4 Students are **Adjudicators**. They take notes but do not speak yet.
  *   **Task:** Advocates present their system. They must describe *what the system does*, not just what it is.
      *   *Geode Advocate Hint:* Give the "For" advocate a secret note: "Focus on the complexity of atomic lattice vibrations over time. It processes thermal input into structural stress output."
      *   *Janus Box:* Both advocates describe the same lights but emphasize different *meanings* (Fear vs. Randomness).
  *   **Outcome:** Adjudicators hear the pitches. No voting yet.

  ### Round 2: Drafting the Charter (20 Minutes)
  *   **Assignment:** The 4 Adjudicators move to the board. The 10 Advocates sit in the audience but may submit "Amendments" (written notes).
  *   **Task:** Draft 3-5 necessary conditions for Moral Standing.
  *   **Constraint:** You cannot use words like "soul," "biology," or "human." You must use functional or structural terms (e.g., "Feedback," "Information Processing," "Goal-Directedness").
  *   **Instructor Role:** Circulate. If they write "It must think," ask "How do you measure thinking physically?" Push them toward computational/functional definitions (e.g., "Must map inputs to internal states to outputs").
  *   **Outcome:** A finalized Charter written on the board.

  ### Round 3: Stress Test and Disposal (20 Minutes)
  *   **Task:** The full class reconvenes. Apply the Charter to the **Janus Box** first.
  *   **The Trap:**
      *   If the Charter relies on *Input/Output patterns* (Functionalism), the Janus Box qualifies (via Cipher Alpha).
      *   If the Charter relies on *Internal Causal Structure*, the Janus Box qualifies (the circuitry is the same for both Ciphers).
      *   **The Disposal:** The class must vote: Does the Janus Box get PU? Yes or No.
      *   **The Follow-up:** Immediately apply the *exact same logic* to **The Geode**.
      *   *Scenario A (Box Granted):* If the Box got PU because of "Complex State Mapping," does the Geode's atomic lattice also support Complex State Mapping? (Advocates for the Geode should press this hard).
      *   *Scenario B (Box Denied):* If the Box was denied because "The mapping is arbitrary," does that threaten the ChatBot? (Is the ChatBot's 'understanding' just a mapping we chose?)
  *   **Outcome:** The class will likely realize their Charter either grants standing to the Rock or denies it to the ChatBot/NeuroSim. They will struggle to articulate the difference without circularity.

  ### Debrief (20 Minutes)
  *   **Step 1: The Reveal.** Ask the class: "What was the difference between the Janus Box's 'Fear' and the Geode's 'Stress'?"
      *   Introduce the term **Implementation**.
      *   Introduce the term **Mapping**.
  *   **Step 2: The Friend's Argument.** Explain the argument from your dinner conversation (Putnam/Searle style).
      *   "If the correspondence between physical states and program states is permissive enough, a lump of granite implements every finite-state computation there is."
      *   Ask: "Did your Charter accidentally allow for permissive mapping?"
  *   **Step 3: Tying Room Moments to Philosophy.**
      *   *Round 2 (Charter):* This was **Functionalism/Computationalism**. You tried to define mind by role, not substrate.
      *   *Round 3 (Janus/Geode):* This was the **Triviality Argument**. You found that if 'role' is defined by 'pattern,' patterns are everywhere.
      *   *The Disposal:* When you voted on the Janus Box, you had to make a metaphysical cut without a metaphysical knife. You likely relied on *intuition* ("It just feels like a machine") rather than the *Charter* you wrote.

  ## III. Predictable Failures and Missing Features

  ### What Will Predictably Break (First Run)
  **The "Ethics vs. Metaphysics" Slide.**
  Students will inevitably argue about whether the systems *deserve* protection (Normative Ethics) rather than whether they *qualify* as the kind of thing that can be protected (Metaphysics of Mind).
  *   *Example:* "The ChatBot shouldn't get PU because it's owned by a corporation."
  *   *Fix:* As Instructor, you must act as the "Constitutional Court." Interrupt immediately: "We are not deciding if they *should* be protected, but if they *can* be. Assume ownership is irrelevant. Does it meet the criteria?"

  ### What The Activity Cannot Reproduce (Instructor Must Supply)
  **The Mathematical Inevitability of Triviality.**
  The activity demonstrates *ambiguity* (we can't agree on the Janus Box). It does not demonstrate *universality* (the Rock *definitely* implements the computation).
  *   In the room, students will think, "Well, the Geode *probably* doesn't count."
  *   The Friend's Argument is stronger: "The Geode *definitely* counts if your definition of 'computation' is standard."
  *   **Instructor Duty:** You must explicitly state in the debrief: "In this room, you treated the Rock as a borderline case. The philosophical argument claims that under the criteria you wrote in Round 2, the Rock is not borderline—it is a definitive match. The problem isn't that we can't tell; it's that the definition is too wide."

  ## IV. Instructor Notes for the Janus Box Disposal
  To ensure the "Two Claimants" constraint works:
  1.  Ensure the Adjudicators write the Charter *before* they know they have to rule on the Janus Box specifically.
  2.  When the vote comes, forbid compromise. They cannot say "It gets half PU." They must say "It is the kind of thing that has Standing" or "It is not."
  3.  If they vote **Yes**: Press the Geode Advocate. "The Geode has atoms. Atoms have states. States change. We can map those changes to the Janus Box's lights. Why is the Box a mind and the Rock not?"
  4.  If they vote **No**: Press the ChatBot Advocate. "The ChatBot is also just voltage patterns we interpret as language. If we reject the Janus Box because the 'meaning' is in the eye of the beholder, do we not reject the ChatBot for the same reason?"

  This forces the realization that the distinction lies not in the *system*, but in the *correspondence rule*—which is exactly the vulnerability your friend exploited.
