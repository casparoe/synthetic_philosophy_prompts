answer: |-
  You know better than anyone that the fossil record is a biased sample of a biased sample. In taphonomy, you never treat a gap as a null set until you've modeled the preservation potential of the depositional environment. If you're in a *Lagerstätte* and you don't find a expected taxon, that's a signal. If you're in a high-energy sandstone, it's just noise.

  Your friend is wielding a slogan that functions as a conversation stopper, but like most aphorisms, it collapses under scrutiny. It ranges from a trivial logical truth to a radical epistemological error. Here is the breakdown of the precise claims that slogan might be standing in for, evaluated for truth and whether it saves your friend's objection.

  ### 1. The Trivial Claim: "If you haven't looked, you haven't found."
  *   **The Claim:** If no search has been conducted, the lack of a result tells us nothing about reality.
  *   **Truth Value:** True.
  *   **Does it rescue your friend?** No. You *have* looked. You are examining a specific, surviving corpus of chronicles and tablets. This claim only applies if the archives were unopened or the strata unexcavated.

  ### 2. The Completeness Claim: "If the record is fragmentary, silence is ambiguous."
  *   **The Claim:** If the probability of a record surviving to the present is low, the absence of a mention does not significantly lower the probability that the event occurred.
  *   **Truth Value:** True. (This is the standard taphonomic filter).
  *   **Does it rescue your friend?** Only if the historical record for that decade is actually poor. You stipulated the record is "unusually good" with administrative tablets that *should* have noted the loss of a cult site. If the preservation potential is high, this claim does not apply. Your friend is treating the historical record like a barren formation when you're arguing it's a *Lagerstätte*.

  ### 3. The Expectation Claim: "Silence counts only if a record was expected."
  *   **The Claim:** Absence of evidence is only evidence of absence if, had the event occurred, it would likely have been recorded ($P(\text{Record}|\text{Event})$ is high).
  *   **Truth Value:** True. This is the Bayesian core of the issue.
  *   **Does it rescue your friend?** No, it actually supports *your* position. For a major temple fire in a bureaucratic society, the likelihood of documentation is high. Administrative tablets track resources; a destroyed temple means lost revenue and reconstruction costs. If the authors were aware and the medium survived, the expectation condition is met.

  ### 4. The Radical Claim: "Silence is never proof of non-occurrence."
  *   **The Claim:** No amount of negative data can ever confirm that something did not happen.
  *   **Truth Value:** False.
  *   **Does it rescue your friend?** It attempts to, but it is epistemologically bankrupt. In science and history, we reject hypotheses based on negative evidence all the time when the detection probability is sufficiently high. If you drill a core through the K-Pg boundary and find no iridium, you have evidence against an impact hypothesis (provided the core is valid). Silence *is* data; it just has a different weight than positive data.

  ***

  ### Conditions for Silence to Carry Weight

  For a source's silence to function as evidence of absence, three variables must align, much like your preservation models:

  1.  **Observer Awareness ($P(\text{Notice}|\text{Event})$):** How likely was a contemporary to witness and recognize the event? A temple burning is a public, catastrophic event, not a quiet shift in pottery style. This probability is high.
  2.  **Recording Probability ($P(\text{Record}|\text{Notice})$):** How likely was the observer to write it down? You noted these are administrative tablets and chronicles. Bureaucracies record disruptions to cult sites. This probability is high.
  3.  **Survival Rate ($P(\text{Survival}|\text{Record})$):** How likely was the document to survive to the present? You noted the record for this stretch is "unusually good." This probability is high.

  When the product of these probabilities is high, the absence of a record significantly shifts the posterior probability that the event occurred. Your friend is ignoring the "preservation potential" of the text.

  ***

  ### What Your Friend Was Probably Invoking

  Your friend was likely invoking a mix of **Claim 2 (Completeness)** and **Claim 4 (Radical)**.

  He is probably assuming that "ancient history" implies a fragmentary, spotty record by default. He is treating the survival of those tablets as a lucky accident rather than a representative sample of the bureaucracy's output. He's using the slogan to enforce a burden of proof that requires positive testimony for everything, ignoring that negative testimony is valid when the "deposit" is continuous.

  He isn't thinking like a scientist; he's thinking like a lawyer looking for a witness. In a courtroom, a missing witness might just be unavailable. In a stratigraphic column, a missing fossil in a continuous sequence is an extinction.

  ### The Paleontologist's Rejection

  There is a version of this slogan a paleontologist would reject outright: **The unconditional version.**

  If someone said, "Absence of evidence is *never* evidence of absence," a taphonomist would tell them they don't understand the discipline. Your entire career was built on the premise that **absence of evidence IS evidence of absence, conditional on preservation potential.**

  *   **If preservation potential is low:** The slogan holds. (You can't prove there were no soft-bodied organisms in a sandstone formation).
  *   **If preservation potential is high:** The slogan fails. (If you find no trilobites in the Triassic, they are gone).

  Your friend is applying the "low preservation potential" rule to a "high preservation potential" scenario. He's arguing that because we don't have *every* tablet ever written, the ones we do have don't matter. You know that if the facies is right, the absence of the fossil tells you the animal wasn't there. If the archive is right, the absence of the fire tells you the temple didn't burn.

  Tell him he's treating a continuous section like a hiatus. In your line of work, that's a fatal error. In history, it's just a bad argument.
