answer: |-
  *(Stage Note: Stand to Dot's right side so she can hear you with her good ear. Keep your body angled toward her and the head table; do not pivot to address the back of the room.)*

  I write the obituaries. For the last eleven years, my job has been to tell the truth about people who can no longer correct me. When I started, Dot gave me one rule that never changed. The mill owner got the same column inches as the man who collected roadkill for the highway department. She slashed any sentence that tried to summarize a life by a job title. You weren't a "former selectman" or a "retired teacher." You were a person who fixed clocks, or who burned toast every Sunday, or who finally forgave his brother.

  I mention this because I've been reading a book that argues a newspaper inevitably creates a phantom. It says the press manufactures an audience that is everybody and nobody, a crowd that can be flattered but never held responsible. It calls this process "levelling." It says that when we talk to this phantom, action turns into chatter, and everyone becomes equal only because everyone becomes insignificant.

  For a week, I worried that was what we were doing here. I worried that Dot's rule about equal inches was exactly that kind of levelling—dragging the mill owner down to the size of the roadkill collector. But standing here, looking at the stack of Thursdays on the table, I realize it was the opposite. The phantom audience Kierkegaard warned about relies on abstraction. It wants you to be a demographic, a subscriber count, a click. It wants the mill owner to be his money and the roadkill collector to be his job.

  Dot refused the abstraction. She didn't level us down; she leveled us up. By denying us our titles, she forced us to be specific. You couldn't hide behind your status in the *Ledger*, and you couldn't hide behind your obscurity, either. If you wrote a letter to the editor complaining about the stop sign at Main and Fourth, you didn't sign it "A Concerned Citizen." You signed it. Your neighbor read it. Your mother read it. The person whose driveway you blocked read it. That isn't chatter. That is accountability.

  A newsletter on a screen is data. It goes everywhere and lands nowhere. It allows you to be part of a public that never has to look you in the eye. This paper was an object. It was heavy. It arrived on a driveway where you might be standing. It contained a Thursday column that made you angry enough to call the editor, and a letters page that proved someone else was angry enough to write it down. We weren't talking to a phantom. We were arguing with the person who buys our groceries.

  The chain that owns us now is moving to a monthly cycle and a digital digest. They aren't wrong that the world has changed. Information moves faster than ink. But I am not going to stand here and tell you that a digital pivot is the same thing as a weekly paper. A notification is easy to swipe away. A paper on the kitchen table demands to be dealt with. It piles up. It witnesses.

  Dot didn't build a platform for a public. She built a room where the town had to recognize itself. She hated the idea of being a pillar of the community, mostly because pillars are decorative. They hold up roofs but don't do anything. What she did was structural. She made sure that when we spoke, we were speaking to each other, not into a void. She made sure that when we died, we weren't summarized by what we produced for the economy, but by what we left behind in the people who knew us.

  That kind of work requires friction. It requires the risk of being wrong in print. It requires the risk of being read by people who know where you sleep. The new model will be smoother. It will be more efficient. It will reach more people who don't live here. But it won't have the weight of this.

  I'm not going to toast the paper. Papers end. Ink dries. The specific arrangement of people in this room, and the specific way we argued about zoning and high school football, is done. But the habit of looking at each other specifically, instead of generally, doesn't have to end with the print edition.

  I want to end on Earl. Earl is in the back, by the cake. He's been driving Route 4 since 1984. He knows which driveways flood when it rains. He knows which dogs bark and which ones bite. He knows who stopped getting the paper because they went into hospice, and he knows when the widow started getting it again because she needed the crossword.

  For thirty-eight years, Earl was the physical link between this room and the town. He didn't deliver information. He delivered the news. There is a difference. Information is abstract. News is what happens to your neighbors. As long as there is someone willing to drive the route, to know the dogs and the driveways, and to hand the paper to a person rather than upload it to a cloud, we aren't talking to a phantom. We're talking to Earl. And he's listening.
