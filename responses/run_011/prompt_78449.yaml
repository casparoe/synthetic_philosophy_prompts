answer: |-
  This is a profound puzzle. You have correctly identified that the Anglo-American jury is not merely a mechanism for aggregating preferences (like a legislature or a market) but is institutionally designed to simulate a specific kind of *singular* mind. The legal practice presupposes a theory of collective agency that is far more robust—and metaphysically demanding—than the "wisdom of crowds" models found in cognitive science.

  Here is an analysis of the theory of collective agency the jury presupposes, followed by the skeptical deflation you requested, and finally the counterfactual implications.

  ### I. The Presupposed Theory: The Jury as a Discursive Singular Agent

  For the rules you describe to make sense as anything other than administrative fiat, the law must treat the jury as a **plural subject** that achieves **epistemic unity** through deliberation. This aligns closely with the philosophical accounts of Margaret Gilbert or Philip Pettit, but with a specific legal inflection.

  **1. Irreducibility lies in the Transformation of Attitudes**
  The verdict is treated as a single agent's judgment because the law assumes the deliberation process *transforms* the input. In a standard aggregation model (Condorcet's jury theorem), individual judgments are fixed inputs; the group function merely counts them. In the jury model, the inputs are mutable.
  *   **The Theory:** The verdict is irreducible to the pre-deliberative votes because the "jury mind" is constituted by the *reasons* exchanged, not the *positions* held. If Juror A changes their vote from Guilty to Not Guilty because Juror B pointed out a flaw in the chain of custody, the final verdict is not a sum of A and B's prior states. It is a new state generated by the interaction.
  *   **Why Quotient Verdicts are Defective:** A quotient verdict (e.g., "let's average our sentencing numbers" or "flip a coin based on our split") is banned because it bypasses the *reason-giving* requirement. It aggregates *wills* or *guesses* rather than *judgments*. The law presupposes that a valid verdict must be the product of a shared rationality. Arithmetic is blind to reason; argument is not. Therefore, arithmetic cannot produce a "verdict" in the legal sense, only a "result."

  **2. The Evidentiary Seal and Non-Decomposability**
  The bar on testifying about deliberations implies that the group act *cannot* be decomposed without destroying its validity.
  *   **The Implication:** If the verdict were merely the sum of twelve parts, knowing the contribution of each part would clarify the act. By sealing the room, the law asserts that the *locus of agency* is the collective, not the individuals. To dissect the deliberation is to commit a category error: it is like trying to find the "meaning" of a sentence by analyzing the ink density of each letter rather than reading the syntax. The seal protects the fiction (or reality) that the jury spoke with one voice. If we allow jurors to say, "I only voted guilty because I was tired," we retroactively dissolve the singular agent into twelve compromised individuals.

  **3. The Instruction to the Minority: Genuine Convergence vs. Acquiescence**
  The "Allen charge" (urging a deadlocked minority to reconsider) assumes that **epistemic convergence is possible.**
  *   **The Assumption:** The law operates on the hope that the holdout is not merely stubborn but *mistaken*, and that the majority's reasoning possesses an objective force that the holdout can come to recognize. It presupposes that the group mind can access a truth that the isolated individual mind missed.
  *   **Does it care?** Formally, the law requires the juror to be *persuaded*, not merely *coerced*. A juror who surrenders solely to end the ordeal is technically violating their oath. However, because the inner life is sealed, the law cannot police this distinction. It cares *normatively* (you must believe the verdict) but is *epistemically blind* to the distinction once the verdict is read.

  ### II. The Skeptical Deflation: Pragmatics over Metaphysics

  Now, let us apply the skepticism you requested. How much of this is truly about collective agency, and how much is about the smooth functioning of the state?

  **1. What the Deflationary Reading Explains**
  A significant portion of the jury's architecture can be explained by **finality, legitimacy, and protection** without invoking a robust theory of group mind.
  *   **The Seal:** This is primarily to protect jurors from harassment and retribution, and to prevent the losing party from endlessly litigating the *process* rather than the *outcome*. It preserves the finality of the judgment.
  *   **Unattributed Act:** This protects the cohesion of the community. If verdicts were attributed, jurors could be socially punished by their peers. Anonymity ensures that citizens are willing to serve.
  *   **Individual Oath/Voir Dire:** This is not necessarily a commitment to individual agency in the verdict, but a **quality control mechanism**. It is easier to screen twelve individuals for bias than to screen a group dynamic. It shifts liability: if the verdict is corrupt, we can punish the liar who got on the jury, even if we can't punish the jury itself.

  **2. Where the Practice Resists Deflation**
  However, the deflationary reading hits a wall at the **ban on quotient/compromise verdicts.**
  *   **The Resistance:** If the goal were merely finality and efficiency, a quotient verdict is superior. It guarantees a result, eliminates deadlock, and requires less time. The fact that courts overturn verdicts where jurors admit to averaging numbers suggests the system values the *quality of the reasoning process* over the *existence of a verdict*. This implies a commitment to the idea that there is a "correct" epistemic path to a verdict that arithmetic cannot replicate.
  *   **The Inconsistency:** You noted the tension between the indivisible group act and individually responsible jurors. The deflationary view exposes this as a functional hypocrisy. The law wants the **legitimacy of a unified voice** (the verdict) with the **accountability of individual conscience** (the oath). These are often mutually exclusive. If the verdict is truly the act of a singular group agent, individual jurors should not be liable for it (as they are in parliamentary systems). If they are individually liable, the act should be decomposable. The law tries to have both: it treats the jury as a group agent when speaking to the public, and as a collection of individuals when speaking to the court during selection.

  **3. Philosophical Underdetermination**
  The practice is underdetermined regarding the **nature of unanimity.**
  *   Is unanimity required because it proves the truth was found (epistemic claim)?
  *   Or is it required because it forces the majority to listen to the minority, thereby reducing the risk of tyranny (political claim)?
  *   The fact that some jurisdictions allow majority verdicts after deadlock suggests the system prioritizes *resolution* over *unity* when costs get too high. This undermines the "singular mind" theory. If the mind can be severed at the 11th hour, was it ever truly singular?

  ### III. The Counterfactual: An Aggregative Conception

  If courts adopted a forthrightly aggregative conception—admitting that a verdict is nothing over and above a tally of individual beliefs—the institutional arrangements would shift radically.

  **1. Required Institutional Changes**
  *   **Recorded Votes:** The verdict form would record the tally (e.g., "9-3 Guilty"). Dissenting opinions might be solicited or at least permitted in the record.
  *   **Permissible Aggregation:** Quotient verdicts would be allowed. "Damages shall be the average of the twelve jurors' assessments."
  *   **Deliberation Structure:** Deliberation would shift from *consensus-seeking* to *debate*. The goal would not be to change minds, but to clarify positions for the final count. The "Allen charge" would be abolished; a deadlock would simply be recorded as the data point it is.
  *   **Voir Dire:** Individual bias screening would become even more critical, as the group would no longer be expected to "cure" individual bias through discussion.

  **2. Could it Deliver a "Single Body" Act?**
  **No.** This is the crucial failure point.
  *   **Loss of Normative Force:** A tally is a *description* of a state of affairs; a unanimous verdict is a *performance* of authority. "We find" carries a deontic weight that "Nine of us think" does not. The aggregative model produces a statistical report, not a judgment.
  *   **Addressability:** A defendant is sentenced by the *Law*. In the current model, the jury stands in for the Law's voice. In the aggregative model, the defendant is sentenced by a *coalition*. This weakens the legitimacy of the punishment. It invites the defendant to appeal to the minority ("3 of them agreed with me"), fracturing the authority of the state.
  *   **Responsibility:** In the current model, the jury bears the moral burden collectively. In the aggregative model, responsibility is diluted. The majority can say, "We only needed one more vote," and the minority can say, "We were outvoted." No one owns the outcome.

  ### Summary for Your Column

  The Anglo-American jury presupposes a **strong theory of emergent group agency**: it assumes that through the ritual of reason-giving, twelve individuals can constitute a single epistemic agent whose judgment is superior to and distinct from the sum of its parts.

  However, the system is **functionally hybrid**. It relies on the *metaphysics* of the group mind to generate legitimacy (the unanimous verdict), but relies on the *mechanics* of individualism to ensure safety and selection (voir dire, individual oaths).

  The deflationary critique holds that most of this is ritual designed to protect the state from the chaos of dissent and the individual from the burden of sole responsibility. But the ban on quotient verdicts remains the smoking gun: it proves the system cares about *how* the mind forms, not just *that* it forms.

  If you switch to an aggregative model, you gain efficiency and transparency, but you lose the **performative unity** that allows a verdict to function as a definitive closure of moral inquiry. You would no longer have a Jury; you would have a Committee. And while Committees can make decisions, only a singular Agent can pronounce Judgment.
