  2.  **Initial Brainstorming & Theoretical Frameworks:**

      *   *Collective Intentionality:* Searle ("we-intentions"), Gilbert (plural subjects), List & Pettit (group agency).
      *   *Jury Specifics:* The jury is a classic example of a "temporary group agent."
      *   *The Tension:* Individual epistemic responsibility vs. Collective epistemic output.
      *   *Quotient Verdicts:* Why are they bad? They bypass the *reasoning* process. They aggregate *preferences* or *guesses* rather than *judgments*.
      *   *Secrecy:* Protects the "black box" of deliberation to maintain the myth (or reality) of unity.
