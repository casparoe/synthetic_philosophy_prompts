  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the user's observation that the jury is an outlier compared to standard "wisdom of crowds" models.
      *   **Part 1: The Presupposed Theory of Collective Agency.**
          *   *The "Common Mind" Thesis:* The jury isn't a bucket of votes; it's a deliberative engine.
          *   *Irreducibility:* It lies in the *transformation* of preferences through reason-giving. It's not $A + B + C = Verdict$. It's $A, B, C \rightarrow \text{Discussion} \rightarrow A', B', C' \rightarrow \text{Shared Verdict}$.
          *   *Quotient Verdicts:* Why banned? Because they skip the transformative step. They are "naked preferences" or "guesses," not "reasoned judgments." Argument forces alignment on *reasons*, not just outcomes.
          *   *The Seal:* Implies the act belongs to the *group*, not the individuals. Decomposing it destroys the agency.
