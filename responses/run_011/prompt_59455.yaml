answer: |-
  This is a remarkably precise diagnosis of a dialectical structure that haunts both formal philosophy and theoretical physics. You have identified a meta-methodological pattern that operates beneath the level of specific arguments, governing how communities respond to mathematical pathology.

  Here is an analysis of your four questions, moving from existing literature to a proposed conceptual carving.

  ### 1. Is there an established term or body of work?

  There is no single, standard term in the literature that captures this specific *tripartite structure of repair plus template dismissal*. However, the pattern is a recognizable species of **Agrippan Skepticism** (often called the **Münchhausen Trilemma**).

  *   **The Lineage:** Agrippa's Trilemma posits that any attempt to justify a belief leads to one of three unsatisfactory outcomes: infinite regress, circularity, or dogmatism. Your pattern is a *methodological* analogue: any attempt to repair a pathological theory leads to one of three unsatisfactory outcomes: eliminativism (quantity doesn't exist), finitism (arbitrary bounds), or generalization (arbitrary rules).
  *   **The Difference:** Agrippa's Trilemma concerns *epistemic justification*. Your pattern concerns *theoretical repair* in the face of *formal pathology* (divergence/undefinedness).
  *   **Relevant Literature:** You will find this dynamic discussed implicitly in:
      *   **Decision Theory:** The literature surrounding the St. Petersburg, Pasadena, and Altadena paradoxes (Nover, Hájek, Colyvan). The debate often stalls exactly where you describe: between "expectation doesn't exist," "utility must be bounded," and "use a different summation method."
      *   **Philosophy of Physics:** The debates on Renormalization (pre-1970s) and Effective Field Theory. The "arbitrary cutoff" objection is the standard move against regularization until the Renormalization Group reinterpreted the cutoff as physical scale rather than mathematical artefact.
      *   **Meta-Ethics:** J.L. Mackie's *Error Theory* follows the "Declare nonexistent" move; the objection is always that it "withdraws the claims exposed."

  While the *components* are well-trodden, the *structural recurrence of the tripartite dismissal* does not have a dedicated name. It is usually treated as a local feature of specific paradoxes rather than a general meta-methodological phenomenon.

  ### 2. What are the nearest recognised concepts?

  You listed several candidates. Here is precisely where your pattern diverges from them:

  *   **Trilemma-shaped sceptical arguments (e.g., Münchhausen):**
      *   *Overlap:* The exhaustive partitioning into three bad options.
      *   *Divergence:* Sceptical trilemmas target *justification chains*. Your pattern targets *theory repair strategies*. The objections in your pattern are not "you can't know this," but "your repair is artefactual/arbitrary/inadequate."
  *   **Ad hoc rescue / Immunising stratagems (Popper/Lakatos):**
      *   *Overlap:* The worry that the repair is convenient rather than principled.
      *   *Divergence:* Lakatosian analysis is historical/sociological (is the research programme progressing?). Your pattern is logical/structural (does the repair introduce arbitrariness?). A repair can be non-ad hoc (e.g., bounded utility for psychological reasons) and still attract the "arbitrary boundary" objection in this pattern.
  *   **Self-sealing theories / Degenerating research programmes:**
      *   *Overlap:* The sense of stalemate.
      *   *Divergence:* These describe the *status of the theory over time*. Your pattern describes the *logic of the immediate dialectic*. A theory can be degenerating without this specific tripartite structure of objection.
  *   **Arbitrary Cutoffs (Sorites):**
      *   *Overlap:* The objection to the "Restrict Domain" move.
      *   *Divergence:* This covers only one horn of your trilemma. Your pattern explains why *all three* horns are blocked by structurally similar objections.
  *   **Impossibility Theorems (e.g., Arrow, Gödel):**
      *   *Overlap:* The conclusion that no satisfactory repair exists.
      *   *Divergence:* **This is the critical edge.** In an impossibility theorem, the exhaustion of options is *proven* (e.g., "No function satisfies conditions 1–5"). In your pattern, the exhaustion is *asserted* via a taxonomy, and the "impossibility" is inferred from the *availability of objections* rather than a proof of contradiction.

  ### 3. Coining a Term: "The Taxonomic Impasse"

  Since no term fits, I propose you name this **"The Taxonomic Impasse"** (or alternatively, **"The Aporetic Partition"**).

  **Definition:**
  A *Taxonomic Impasse* occurs when a theoretical pathology (e.g., divergence) generates a space of possible repairs that is exhaustively partitioned into a small set of structural types (e.g., Eliminate, Restrict, Replace), and each type is assigned a standing, generic objection derived from its classification rather than its specific implementation. The impasse arises because the objections are treated as fatal *a priori*, creating a illusion of impossibility without a formal proof.

  **Marking the Edges (What it is NOT):**

  *   **Not a Genuine Impossibility Theorem:**
      *   *Case:* Arrow's Theorem proves that no voting system satisfies a specific set of axioms.
      *   *Distinction:* In the Taxonomic Impasse, the "axioms" (the criteria for a good repair) are often implicit and contested. The objection "the cutoff is arbitrary" assumes "non-arbitrary cutoffs are required," which is a substantive claim, not a logical proof. If a theorist bites the bullet and accepts the arbitrariness (e.g., "Effective Field Theory accepts the scale is contingent"), the impasse dissolves. In a genuine impossibility theorem, biting the bullet means accepting a contradiction.
  *   **Not Ordinary Critical Discussion:**
      *   *Case:* A critic points out a specific flaw in a specific utility function.
      *   *Distinction:* In the Taxonomic Impasse, the objection is *portable*. The "arbitrary boundary" objection is deployed against *any* boundary, regardless of the physical or normative justification for that specific boundary. The criticism targets the *cell of the partition*, not the *content of the proposal*.
  *   **Not Mere Underdetermination:**
      *   *Case:* Data supports two theories equally.
      *   *Distinction:* Underdetermination leaves multiple options open. The Taxonomic Impasse is used to argue that *all* options are closed (or equally defective), inducing paralysis rather than choice.

  **The "Sinister" Feature:**
  The pattern is rhetorically powerful because it mimics the form of a *reductio ad absurdum*. It says: "Look at all the ways you could fix this. Each fails. Therefore, the problem is intractable." But because the failures are *template-based*, they can often be dissolved by changing the meta-criteria (e.g., accepting that some cutoffs *are* arbitrary but physically salient).

  ### 4. Candid Assessment: Is the pattern real?

  **Yes, the pattern is real.** You have not merely abstracted ordinary discussion; you have identified a specific mechanism of **dialectical stagnation**.

  However, you should be careful about whether the pattern is *fallacious* or *diagnostic*.

  *   **When it is Fallacious:** It is fallacious when the template objections are treated as *refutations* rather than *costs*.
      *   *Example:* Dismissing a bounded utility function *solely* because the bound is "arbitrary." If the theorist admits the bound is approximate but pragmatically necessary, the objection loses its force. If the critic insists on "non-arbitrariness" without proving it is possible, they are committing the **Nirvana Fallacy** (comparing a realistic option to an idealized, impossible one).
      *   *In your terms:* The step from "every cell attracts a complaint" to "the position is untenable" is invalid *unless* the complaints are proven to be fatal contradictions. Often, they are merely costs (e.g., "loss of generality," "introduction of a parameter").

  *   **When it is Diagnostic:** It is a genuine signal when the pattern persists despite decades of attempted repair.
      *   *Example:* In QFT, this pattern persisted until the Renormalization Group shifted the interpretation of the cutoff from a "mathematical nuisance" to a "physical scale." The Taxonomic Impasse here was a symptom that the *conceptual framework* (what a field theory is) was insufficient, not that the math was broken.
      *   *In Decision Theory:* The persistence of this pattern in the Pasadena/St. Petersburg debates suggests that Expected Utility Theory may be the wrong aggregation rule for infinite horizons, not that the paradoxes are unsolvable.

  **Conclusion for your Dissertation:**
  You are justified in treating this as a distinct meta-methodological phenomenon. It is a **Taxonomic Impasse**. It functions as a **rhetorical technology of stalemate**.

  To use this productively:
  1.  **Identify the Partition:** Explicitly map the three (or more) repair strategies in the debate you are analyzing.
  2.  **Identify the Template:** Show that the objections are being applied categorially (e.g., "Any cutoff is arbitrary") rather than substantively.
  3.  **Challenge the Fatality:** Argue that the objections represent *theoretical costs* to be weighed, not *logical contradictions* that mandate abandonment.
  4.  **Locate the Exit:** Historically, these impasses break not by solving the puzzle within the partition, but by **re-describing the quantity**. (e.g., In QFT, the divergent quantity wasn't an observable; in Decision Theory, perhaps the "value" of the gamble isn't an expectation).

  You have found a lever. Use it to pry open the assumption that the current taxonomy of repairs is exhaustive. Often, the fourth option is to change the ontology of the thing being summed.
