answer: |-
  You have stumbled onto one of the oldest and stickiest problems in metaphysics, known as the **Special Composition Question**. Philosophers have been fighting over this for 2,500 years. The fact that your intuitions feel patterned but inconsistent isn't a bug in your thinking; it's a feature of how human cognition carves up the world. We use a mix of physics, function, and intention, and they don't always line up.

  However, we can build a principle that captures about 90% of your verdicts with high precision. To do that, we have to move away from "Is it stuck together?" and toward "Does it act together?"

  Here is the principle that best fits your data, the verdict you must sacrifice to keep it clean, and how it handles your new test cases.

  ### The Principle: Dynamic Interdependence

  **A collection of parts constitutes a single object if and only if:**
  1.  **Reciprocal Constraint:** The parts physically or functionally restrict each other's state or motion (they hold each other in place or in sync).
  2.  **Unified Response:** External forces act on the arrangement as a single unit, producing a behavior the isolated parts could not produce.
  3.  **Structural Persistence:** The arrangement maintains its integrity through minor changes to the specific identity of the parts.

  ---

  ### How the Clauses Map to Your Examples

  **Clause 1: Reciprocal Constraint**
  *   *Why your Bike is Yes:* The axle constrains the wheel; the wheel constrains the frame. They lock each other into a specific geometry.
  *   *Why Couch Coins are No:* One coin does not hold the other in place. They are incidental neighbors.
  *   *Why Mug-on-Table is No:* The table supports the mug, but the mug does not support the table. The constraint is one-way. (This solves your gravity confusion: in the Solar System, the planets pull the sun just as the sun pulls the planets; it is reciprocal).
  *   *Why Glued Balls are Yes:* The glue creates a mutual restriction on motion.

  **Clause 2: Unified Response**
  *   *Why the Flock is Yes:* If a hawk attacks, the flock swirls. The *group* reacts. A concert crowd just has individuals running; there is no unified maneuver.
  *   *Why the Cloud is Yes:* Pressure and temperature changes affect the whole mass, causing it to rain or dissipate as a unit.
  *   *Why the Exploded Bike is No:* Pushing the frame doesn't move the wheels. No unified response.

  **Clause 3: Structural Persistence**
  *   *Why the Cloud is Yes:* The water molecules change every ten minutes, but the *structure* (the cloud shape/system) persists.
  *   *Why the Glued Bowl is Yes:* You replaced the "bond" with glue, but the functional structure survived.
  *   *Why Powder is No:* The structure is gone. You can't swap grains of powder and keep a bowl.

  ---

  ### The Verdict You Must Sacrifice

  To make this principle work without adding "escape hatches," you have to give up one of your intuitions. The weak link in your chain is the **Woodpile**.

  **You said:** Woodpile = Yes.
  **The Principle says:** Woodpile = **No**.

  **Why?** A woodpile fails Clause 2 (Unified Response). If you kick the bottom log, the top logs don't move *with* it; they fall. They do not act as a unit. It also barely passes Clause 1; the logs are held by gravity and friction, but they are not *interlocked* like a puzzle or *bound* like a bike.
  **The Fix:** You must align the Woodpile with the **Couch Coins**. Both are "heaps." The only reason you feel the woodpile is an object is because a human stacked it (intention), whereas the coins fell there (accident). But physically, they are the same kind of thing. If you want a principle based on how the world *works* rather than what humans *want*, the woodpile is not an object. It is a collection.

  *(Note: If you refuse to give up the Woodpile, you must admit that "Human Intention" is a binding force equal to gravity. That is a valid philosophical stance, but it makes the Solar System a "No" unless a human intended it, which breaks your other verdicts.)*

  ---

  ### Running the Principle on New Cases

  **Case 1: The Great Pacific Garbage Patch**
  *   *Analysis:* It is a region of the ocean where currents trap plastic.
  *   *Clause 1 (Constraint):* No. The plastic pieces do not touch or hold each other. They are just floating in the same current.
  *   *Clause 2 (Response):* No. If you push one bottle, the patch doesn't move.
  *   *Verdict:* **No.** It is a *region* containing objects, not an object itself. It is like a "cloud" of trash, but without the internal pressure dynamics that make a water cloud a unified system.

  **Case 2: A Slime Mold (Physarum)**
  *   *Analysis:* A single organism that can split into separate blobs and rejoin later.
  *   *Clause 1 (Constraint):* Yes, but chemical, not physical. The blobs signal each other.
  *   *Clause 2 (Response):* Yes. They move toward food as a coordinated system even when physically separated.
  *   *Clause 3 (Persistence):* Yes. It survives splitting and rejoining.
  *   *Verdict:* **Yes.** This principle allows for "diffuse objects" as long as there is functional integration. The slime mold is one thing, even when it is in two places, because the parts act as a unified agent.

  ---

  ### The Honest Truth (If You Want It)

  If the sacrifice of the Woodpile feels wrong to you—if you genuinely believe the stacked wood is a thing and the loose coins are not—then my honest answer is: **There is no single physical principle.**

  Your intuitions line up neatly not because of metaphysics, but because of **pragmatics**.
  *   You call the **Bike** an object because you need to ride it.
  *   You call the **Woodpile** an object because you need to count the fuel.
  *   You call the **Coins** "loose change" because you don't care about them until you spend them.
  *   You call the **Crowd** "people" but the **Flock** "a bird-thing" because the flock moves like a single organism and the crowd doesn't.

  We label things as "one" when it is **useful to treat them as one.** The pattern you see is real, but it is a pattern of *human interest*, not a pattern of *fundamental reality*. The universe doesn't care if the woodpile is one thing or a hundred logs. You do.

  If you want a rule you can actually use, stick with **Dynamic Interdependence** and accept that "Woodpile" is a linguistic convenience, not an ontological truth. If you want to capture the Woodpile, you have to admit that "Object" is a fuzzy concept we stretch to fit our needs, and no precise principle will ever capture every "Yes" and "No" without contradiction.
