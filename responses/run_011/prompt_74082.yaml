answer: |-
  # Prep Sheet: Q&A Strategy for Climate Modeller Colloquium

  **Context:** You are the expert on the *physics/stats*, they are the experts on the *normativity/logic*. Your goal is to defend the causal claim without getting dragged into moral theory you haven't read.
  **Tone:** Confident on the modelling, humble on the metaphysics. Use "in my field we see..." phrasing.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Grad Student (The "Expected Utility" Trap)
  **How they'll phrase it:** "This looks like a rebranding of the expected utility argument that Julia Nefsky and others have already critiqued. If the expected harm of one steak is near-zero, shifting the tail doesn't change the expectation meaningfully. Aren't you just adding complexity to a calculation that still sums to negligible?"
  **Your Reply:** "In modelling, we never trust the mean when the variance is this high. If I tell you a dam has a 'negligible expected failure rate' but the failure mode wipes out the valley, I'm not doing my job. I'm not arguing the *sum* changes much; I'm arguing the *profile* of the risk changes. You can't critique a distribution shift using only expectation metrics. That's like judging a hurricane by its average wind speed over a month."
  **Blunt Weakness:** You haven't actually proven why the tail shift *matters* normatively if the expectation is unchanged. You've asserted it matters, but haven't bridged the 'is-ought' gap for tail risk specifically.

  #### 2. The Environmental Economist (The Discount Rate Attack)
  **How they'll phrase it:** "I agree the distribution shifts, but in cost-benefit analysis, we discount low-probability future events heavily. Unless you assign infinite disutility to the tail, the marginal cost of your action still outweighs the marginal reduction in tail risk. Mathematically, you're right; economically, you're still wrong."
  **Your Reply:** "That's a value judgment, not a mathematical one. You're choosing a discount rate that effectively erases the tail. My point is that the *causal* difference exists regardless of your discount rate. Whether that difference *ought* to motivate you depends on how you value catastrophe. I'm fixing the physics; you're hiding behind the accounting."
  **Blunt Weakness:** This concedes that your argument doesn't compel action for anyone with standard economic preferences. It makes your thesis true but practically inert for the policy crowd.

  #### 3. The Kantian (The "Wrong Framework" Objection)
  **How they'll phrase it:** "Why are we talking about consequences at all? If the maxim of my action can't be universalized, it's impermissible. If it can be, it's permissible. Whether my single act shifts a probability distribution is irrelevant to my duty."
  **Your Reply:** "I'm not trying to replace your duty; I'm trying to fix your facts. Many Kantians refuse to act because they think they're 'causally impotent.' I'm saying you *aren't* impotent. You can still decide based on duty, but don't use 'I make no difference' as the excuse. I'm removing the alibi, not writing the law."
  **Blunt Weakness:** You are admitting your argument is only a side-constraint, not a positive moral theory. It limits what they can say, but doesn't tell them what to do.

  #### 4. The Virtue Ethicist (The "Character" Objection)
  **How they'll phrase it:** "Even if you're right about the stats, does this make me a good person? Virtue is about dispositions and flourishing. Calculating tail-risk distributions sounds like anxiety, not virtue. Isn't this just moral neurosis dressed up as math?"
  **Your Reply:** "Virtue requires practical wisdom, and practical wisdom requires accurate perception of reality. If you perceive the world as 'my actions don't matter,' you aren't seeing clearly. You can't be virtuous based on a false picture of your agency. I'm just correcting the vision; what you do with it is up to your character."
  **Blunt Weakness:** Hard to defend without a whiteboard. It risks sounding like you're saying "calculating risk *is* virtue," which is obviously false.

  #### 5. The Epistemic Skeptic (The "Undetectable" Objection)
  **How they'll phrase it:** "You said 'statistical power,' but if an effect is undetectable in principle, in what sense is it real? If no possible observation could confirm your steak caused a flood, isn't 'causal difference' just a metaphysical ghost?"
  **Your Reply:** "In science, we distinguish between 'no signal' and 'signal below noise.' A neutrino passes through your body every second; you can't detect it, but it's not a ghost. The mechanism is physical, not magical. Just because the signal-to-noise ratio is low doesn't mean the signal isn't there. We model sub-detectable processes all the time."
  **Blunt Weakness:** Philosophers of science might push on "manipulability theories of causation." If you can't manipulate the outcome with the variable, is it really a cause?

  #### 6. The Consistency Check (The "Voting" Exclusion)
  **How they'll phrase it:** "You explicitly excluded voting. But the math of voting is identical to climate action—one vote rarely decides, but shifts distributions. If climate action passes your test but voting fails it, you need a principled difference, or it looks like cherry-picking."
  **Your Reply:** "Voting is a binary threshold mechanism with a specific counting rule. Climate is a cumulative continuous flow. In voting, the causal chain is interrupted by the rules of the election. In climate, the physics is continuous. I excluded voting because the mechanism of aggregation is fundamentally different, and I don't want to defend voting today, only the physics of emissions."
  **Blunt Weakness:** This is shaky. Many philosophers argue voting *is* a cumulative harm problem. If pressed, you might look inconsistent.

  #### 7. The "Complicity" Grad Student (The "Why Causation?" Objection)
  **How they'll phrase it:** "The literature has moved on from causation to complicity. Even if you make no causal difference, you participate in a harmful practice. Why insist on causal difference? It seems you're fighting a battle the rest of us abandoned ten years ago."
  **Your Reply:** "Because 'complicity' feels like a consolation prize to people who want to know if they actually matter. If I tell a young scientist 'you're complicit but causally inert,' they disengage. If I tell them 'you shift the tail,' they engage. I'm offering a more robust agency than complicity allows."
  **Blunt Weakness:** You are prioritizing *psychological motivation* over *philosophical precision*. A strict philosopher will call this pragmatism, not truth.

  ---

  ### The Two Concessions
  *Do not fight these. They protect your core thesis by limiting its scope.*

  **1. Concede to the Kantian (Scope Limitation)**
  *   **How to say it:** "You're right. My talk is about *causal efficacy*, not *moral obligation*. I can prove you make a difference, but I can't prove you *must* act on it. If your duty says otherwise, my math doesn't override your maxim. I just want to stop people using 'no difference' as a false excuse."
  *   **Why:** It prevents you from having to defend an 'ought'. It keeps you in your lane (the 'is').

  **2. Concede to the Economist (Value Judgment Limitation)**
  *   **How to say it:** "I concede that if someone discounts the future heavily enough, or values the tail risk low enough, my argument won't compel them. My claim is that the *risk reduction* is real, not that everyone *values* it the same way. I'm fixing the input to your cost-benefit analysis, not dictating the output."
  *   **Why:** It admits that your argument isn't a magic bullet for action, which makes you look honest, while preserving the claim that the "no difference" objection is factually false.

  ---

  ### The Danger Question
  *This is the question that reveals you are a modeller playing philosopher, not a philosopher of probability.*

  **The Question:** "You're using 'ordinary probability' to describe a singular, non-repeatable event (your specific steak in the context of the whole climate system). How do you justify the **Reference Class**? Are you treating deep **Knightian Uncertainty** as quantifiable **Risk**? If the system is non-ergodic, doesn't your probability distribution lack a truth value?"

  **Why it hurts:**
  *   Modellers often treat uncertainty as risk (assigning numbers to unknowns) because they have to run the code.
  *   Philosophers of decision theory (and sharp grad students) know the distinction between *Risk* (known probabilities) and *Uncertainty* (unknown probabilities).
  *   If you can't justify *where* your probabilities come from for a singular event, your "shape of the distribution" claim looks like mathematical fiction.
  *   **If asked:** Do not bluff. Say: "In modelling, we parameterize uncertainty to make it tractable. You're right that this is a modelling choice, not a metaphysical truth. But for policy, we must act *as if* the probabilities hold, or we act blindly. I'm arguing for the former." (This admits the philosophical weakness but defends the practical necessity).
