  To the Permanence Committee of the Aldermere Foundation:

  I recommend that the Committee vote to **RATIFY-WITH-CONDITIONS** the Kestrel Archive endowment. The condition is that the irrevocable commitment be structured as six consecutive fifty-year tranches. At the conclusion of each tranche, a new forecast must be generated under the Precedence Protocol to release the next portion of capital. This structure must be satisfied within the first five years of operation; failure to meet this administrative condition reverts the endowment to a revocable grant.

  Regarding the Precedence Protocol, I must report that **neither** the Staff's reference class nor the Dissenter's reference class can be certified. The Staff's class of "sovereign or quasi-sovereign polities" violates Clause 4. The membership rule was constructed after examining the lifespans of known entities, effectively selecting for success. It is not a predictive class but a retrospective collection of survivors. The Dissenter's class of "continuously chartered institutions" avoids the Clause 4 violation but fails to correct for the fundamental data corruption inherent in historical records. Consequently, no certifiable reference class exists for this proposal. To build one, the Foundation must commission an independent audit of institutional failure rates, specifically searching for entities that vanished without record, conducted by demographers or statisticians rather than historians or sponsors.

  I must confront three difficulties that render the current forecast unreliable for a three-hundred-year lock.

  First is the problem of the silent graveyard. The historical record is biased toward survival. Institutions that collapsed within a decade of founding rarely generated archives, chronicles, or legal disputes that would preserve their memory. When we calculate a median lifespan from existing literature, we are calculating the lifespan of institutions that lasted long enough to be written about. For the money managers on this Committee: this is akin to calculating investment returns using only funds that still exist today. The true base rate of failure is higher than the record shows, meaning the Staff's median of three hundred forty years is likely an overestimate. We cannot quantify this error, but we must acknowledge it renders the base rate unsafe for an irrevable commitment.

  Second is the instability of continuity, exacerbated by Clause 7. The Dissenter's example of the Shinto shrine—rebuilt periodically yet considered continuous—highlights that "institutional survival" is a legal or cultural fiction, not a physical fact. Clause 7, the Symmetry Clause, was intended to prevent special pleading. It requires that if we exclude a past institution because it lacked a feature the Archive has, we must ask what the Archive lacks that the past institution had. In practice, this clause is unworkable. It allows any trustee to exclude any analog by citing a difference, which then demands a counter-difference, dissolving the reference class until it is empty. For the structural engineer on this Committee: imagine requiring a bridge to be identical to every previous bridge in every material respect to prove it will stand. No structure would ever be certified. The clause guarantees paralysis.

  Third is the observer effect. The forecast itself is not a neutral measurement. Once recited in the deed, this document will be read by future Archive administrators and donors. A forecast stating "likely to survive three hundred years" may attract the very endowments required to ensure survival. A forecast stating "high risk of collapse" may trigger the withdrawal of support. The map alters the territory. By certifying a lifespan, we may inadvertently create it, or by denying it, we may ensure failure. This feedback loop makes the forecast self-referential rather than predictive.

  Despite rejecting the Staff's reference class, I must give their strongest case its full weight. Their argument is not merely statistical; it is functional. They contend that an Archive designed to outlive contemporary political orders requires the stability of a political order itself. A conditional endowment, subject to review every fifty years, introduces a risk of interruption that defeats the Archive's purpose. If donors believe the Foundation might withdraw support in 2076, they will not fund the initial corpus. The Staff argues that certainty is the product being purchased, and that without an irrevocable lock, the Archive is dead on arrival. This is a compelling pragmatic objection to my epistemic caution.

  To the Dissenter, whose procedural rigor I respect, and to the Staff, whose ambition I share, I offer three tests for future proposals. First, the **Pre-Registration Test**: The membership rule of any reference class must be written and filed before any specific institution's lifespan is consulted. Second, the **Negative Search Test**: For every institution cited as a success, the proposers must demonstrate a search for three comparable failures that left no archive. Third, the **Blind Assessment**: The forecasters generating the base rate must not know the specific features of the proposed project, to prevent tailoring the class to the target.

  Regarding Clause 7, I offer a plain statement: The Symmetry Clause is incoherent in practice. It treats all differences as equally disqualifying, ignoring that some differences are material and others are incidental. It should be replaced in the instrument with a **Relevance Weighting** clause. This would require the Committee to vote on whether a disanalogy is material to the specific function being forecasted, rather than allowing any disanalogy to veto membership automatically.

  We are asked to guarantee the future using data from the past. The past is silent on its own failures, and the future will read our guarantee as a promise. We cannot know if the Kestrel Archive will stand in 2326. We can only ensure that our commitment to it is as durable as our honesty about what we do not know.

  Verdict: RATIFY-WITH-CONDITIONS — certified reference class: NONE
