          *   *Treatment:* Literature usually treats them as two sides of the same coin (the bounds of the type), but the *consequences* differ (skepticism vs. laxity).
      *   **What the phenomenon IS:** It is the indeterminacy of the *relativization parameter* (the method) required to evaluate a modal condition. It's not just underdetermination; it's *gerrymandering potential*.
      *   **What the phenomenon IS NOT:** It is not merely "context sensitivity" (though related). It is not a problem with the counterfactuals themselves, but with the *anchor* of the counterfactuals. It is not harmless underdetermination because it changes the extension of "knowledge" drastically.

  4.  **Drafting the Response (Iterative refinement):**

