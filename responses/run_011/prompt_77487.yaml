          1.  *Too Coarse:* Grandmother case. Broad method ("keeping up") $\rightarrow$ fails tracking (lies in nearby world). Narrow method ("seeing him") $\rightarrow$ passes tracking.
          2.  *Too Fine:* Lucky guess. Broad method ("guessing") $\rightarrow$ fails tracking. Hyper-specific method ("guessing this specific hunch on this specific question") $\rightarrow$ passes tracking trivially.
      *   **The Question:** Does this have a standard name? Is it the Generality Problem for Reliabilism? Is it distinct? Are the two failure modes distinguished? If no name, what should it be called? What distinguishes this from harmless underdetermination?
      *   **Constraint:** "Don't give me only a label — I want to know what the phenomenon is and what it isn't."

  2.  **Initial Knowledge Retrieval & Association:**
