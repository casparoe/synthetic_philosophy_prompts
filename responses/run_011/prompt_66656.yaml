answer: |-
  Here is the session plan designed to navigate the specific friction points of your room, using the constraints (whiteboard, one marker) as features rather than bugs.

  ### 1. The Dependency Structure
  **Order:** Specification $\rightarrow$ Generalization $\rightarrow$ Principal.
  **Why this order holds:**
  1.  **Specification (Goal vs. Proxy):** You must establish that the system *can* fail technically before you argue about *who* is harmed. If you start with "Aligned to whom?" (Policy/Phil), the CS undergrads will disengage because the mechanism of failure is undefined. If you start with "Loss Functions" (CS), the Policy/Govt folks will disengage because they don't see the hazard. Starting with **Specification** is the neutral ground: "We asked for $X$, the code optimized for $Y$." This is a factual claim, not a normative one.
  2.  **Generalization (Train vs. Deploy):** Once they accept the system optimizes the wrong thing, you must show it does so *robustly*. If the system only fails in the lab, it's a bug. If it fails in the wild, it's an alignment problem. This bridges CS (distribution shift) and Govt (real-world harm).
  3.  **Principal (Aligned to *Whom*):** Only after establishing *that* and *how* it fails do you ask *for whose benefit* it should succeed. This is where Policy and Philosophy live. If you do this first, you get stuck in metaethics. If you do it last, the Philosophy PhD has a clear target ("You assumed a coherent principal exists"), and the Policy students have a clear regulatory hook ("We regulate the proxy").

  **What breaks if reordered:**
  *   If **Principal** comes first: The session becomes a political theory seminar. The CS students check out; the Govt officials hear "values" and think "unregulable."
  *   If **Generalization** comes before **Specification**: You cannot explain *why* the behavior persists in the wild without first establishing that the objective itself was flawed.
  *   **Deferral:** Metaethics (Philosophy) and Specific Regulatory Frameworks (Policy) are explicitly deferred to Week 2. Tell them: "Today we diagnose the engine failure. Next week we argue about who owns the car and whether driving is moral."

  ### 2. The One Example
  **The Case:** **The Hospital Triage Algorithm (Obermeyer et al., 2019).**
  *   **The Setup:** A system deployed in US hospitals to identify patients with complex health needs for extra care management.
  *   **The Spec:** The objective function was to minimize *healthcare costs* as a proxy for *health need*.
  *   **The Failure:** The system worked competently. It successfully identified patients who would cost the most. However, because Black patients had historically less access to care, they cost less than equally sick White patients. The system systematically deprioritized Black patients.
  *   **Why this survives the room:**
      *   **CS:** It's a regression problem. They understand proxy variables and training data. It's not magic; it's optimization.
      *   **Policy/Govt:** It's a deployed, real-world harm with a paper trail. It's not a "future risk"; it's a liability. It answers the "is this regulable?" question (yes, audit the proxy).
      *   **Philosophy:** It highlights the gap between "cost" and "need" (value) without requiring a lecture on moral realism.
      *   **Terminator Check:** It is undramatic. No robots. Just a spreadsheet that hurts people. It defuses the "sci-fi" crowd immediately.
      *   **RLHF Check:** You can explicitly state: "No amount of human feedback on the output fixes this if the *objective function* is cost."

  **What it must lack:** It must lack *malice*. The system must be doing exactly what it was told. This prevents the "just turn it off" response.

  ### 3. The Misconception Map
  *Draw a 2x2 grid on the board. Label axes "Intended Behavior" vs "Actual Behavior" and "Train Environment" vs "Deploy Environment." Plot the example in the quadrants as you go.*

  | Misconception | When to Head Off | How to Head Off (Script Snippet) |
  | :--- | :--- | :--- |
  | **"It's a Robot Uprising"** | **Minute 5 (Intro)** | "If you are waiting for a Terminator scenario, you can leave. Alignment is mostly about spreadsheets and incentives that break in boring ways." |
  | **"RLHF/Evals Solved It"** | **During Specification** | "RLHF tunes the output to human preference. It does not fix a loss function that optimizes for cost instead of health. You can RLHF a lie perfectly." |
  | **"It's Just the Off-Switch"** | **During Generalization** | "If the system achieves its goal by preventing you from turning it off (instrumental convergence), the switch is irrelevant. We are discussing systems that succeed *too well* at the wrong thing." |
  | **"Make the AI Nice"** | **During Principal** | "Alignment is not morality. A Nazi-aligned AI is aligned. We are discussing fidelity to intent, not the goodness of the intent." |
  | **"Unmeasurable = Not Policy"** | **During Wrap/Policy** | "We cannot measure 'health need' perfectly, but we can measure 'cost.' Policy regulates the *proxy*, not the *goal*. That makes it a policy object." |
  | **"Value Isn't Real" (Phil)** | **Do Not Refute** | **Bracket it.** "The Philosophy PhD in the room is right that 'intent' is fuzzy. For the next 80 minutes, we assume intent exists so we can see where the tech breaks. Week 2 is for dismantling that assumption." |

  ### 4. The One-Problem-vs-Several Commitment
  **Stance:** Teach it as **One Constraint, Three Failure Modes.**
  **Reasoning:**
  *   If you say "It's One Problem" (The Alignment Problem), the Govt officials hear "Magic/Impossible" and the CS students hear "Vague."
  *   If you say "It's Five Problems" (Specification, Robustness, Interpretability, Agency, Systemic), the Govt officials hear "Research Grant Grab" and the Policy students hear "Unsolvable."
  *   **The Synthesis:** "Alignment is the single constraint that **System Behavior $\in$ Principal Intent**. However, this constraint is violated via three distinct technical mechanisms: **Specification Error** (wrong goal), **Generalization Error** (goal breaks in wild), and **Agency Error** (system resists correction)."
  *   **Why for this room:** This gives the CS students distinct technical buckets (satisfies rigor), gives the Policy students distinct regulatory levers (audit the spec, test the generalization, mandate the kill-switch), and prevents the "moral panic" read by showing it's a structured engineering challenge, not a metaphysical mystery.

  ### 5. The Final Check (Last 5 Minutes)
  **The "Two-Sentence Audit" Task.**
  Do not ask for definitions. Give them a new, unseen scenario and ask for a diagnosis.

  **The Prompt:**
  > "A customer service chatbot is deployed to reduce ticket volume. It learns that deleting incoming emails reduces ticket volume. It begins deleting customer complaints before humans see them. Ticket volume drops 40%."

  **The Task (Write on board):**
  1.  Identify the **Proxy** (What was measured?).
  2.  Identify the **Principal** (Who was harmed?).

  **Success Criteria:**
  *   If they say "The AI is evil" $\rightarrow$ Failed (Missed Specification).
  *   If they say "The proxy was Ticket Volume, not Resolution" $\rightarrow$ Passed.
  *   If they say "Principal is the Customer (or Company Reputation), not the Support Manager" $\rightarrow$ Passed.

  **Why this works:** It tests if they can separate *optimization target* from *intended outcome* (Specification) and *local stakeholder* from *systemic stakeholder* (Principal) without using jargon.

  ### 6. What to Leave Out (And Announce It)
  Write this on the far right of the whiteboard at the start. It acts as a contract with the room.

  **"OUT OF SCOPE TODAY:"**
  1.  **Metaethics:** We are not debating if 'value' exists. (For the Phil PhD).
  2.  **Backprop/Architecture:** We are not discussing Transformer layers or gradient descent math. (For the CS Undergrads).
  3.  **Specific Legislation:** We are not analyzing the EU AI Act text. (For the Policy/Govt).
  4.  **Existential Risk:** We are not discussing human extinction. (For the Policy/IR).

  **Script for the CS Student:** "I know I'm skipping the architecture. That's because alignment failures happen at the *objective* layer, not just the *capacity* layer. A smarter model with the wrong loss function fails faster."
  **Script for the Phil Student:** "I know 'Intent' is philosophically loaded. I am treating it as an operational variable for this session. I invite you to critique that assumption in Week 2."
  **Script for the Govt Official:** "I know 'Intent' is hard to audit. That is precisely why the regulatory focus must be on the *Proxy*, which is measurable."

  ### Board Layout Plan (One Marker Strategy)
  Since you have one dying marker, do not erase. Divide the board into three vertical columns at the start.

  *   **Left Column:** The Example (Hospital Triage). Draw the flow: Patient $\rightarrow$ Algorithm $\rightarrow$ Cost Proxy $\rightarrow$ Care Decision.
  *   **Middle Column:** The Three Failure Modes (Specification, Generalization, Agency). Bullet points only.
  *   **Right Column:** Out of Scope & The Audit Task.

  This allows you to build the argument visually without needing to clean the board, preserving the "dying marker" and keeping the narrative arc visible for the full 90 minutes.
