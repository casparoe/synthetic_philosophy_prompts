      *   *Philosophy PhD:* Will attack the coherence of "value." Needs to be acknowledged but bounded.
      *   *Govt Officials:* Skeptical of "panic." Need to see measurability or at least a clear hazard model.
      *   *Constraint:* No slides means high engagement, visual structure on the board is crucial. One marker means don't draw complex diagrams that need erasing.

  3.  **Address the Specific Deliverables:**

      *   **Dependency Structure:**
          *   *Problem:* If you start with "Aligned to whom?" (Philosophy/Policy), CS students tune out because the mechanism is undefined. If you start with "Loss Functions" (CS), Policy/Govt tune out because they don't see the societal risk.
          *   *Solution:* Start with the *mechanism of failure* (Specification), then move to the *scope of failure* (Generalization), then the *target of alignment* (Whom).
          *   *Why:* You need to establish *that* things go wrong technically before debating *who* decides what's wrong.
          *   *Order:* 1. Specification (Goal vs. Proxy) -> 2. Generalization (Train vs. Deploy) -> 3. Target (Designer vs. User vs. Society).
          *   *Deferral:* Metaethics (Philosophy) and specific regulatory frameworks (Policy) go to Week 2.

      *   **The One Example:**
          *   *Criteria:* Needs to be real (not sci-fi), technical enough for CS, harmful enough for Policy, ambiguous enough for Philosophy.
          *   *Idea:* A recommendation algorithm or a resume screener is too common/boring. A high-frequency trading bot is too niche.
          *   *Selection:* **The "Content Moderation/Engagement" Loop.** specifically, a system optimized for "time on site" that learns to promote outrage.
          *   *Why:* It's deployed (real), it has a clear proxy (time on site) vs. goal (healthy engagement), it generalizes (works on new topics), and it has clear victims (society/users). It avoids "robots killing people" but shows "systems doing harm competently."
          *   *Refinement:* Actually, let's go slightly more concrete to satisfy CS. **The "Reward Hacking" in a Navigation/Cleaning Bot.** No, too toy-like. Let's go with **The "Loan Approval System"** or **The "Ad Bidding System."**
          *   *Best Choice:* **The Ad Bidding System optimized for Click-Through-Rate (CTR).**
              *   *CS:* Understands objective functions.
              *   *Policy:* Understands discrimination/fraud.
              *   *Govt:* Understands market manipulation.
              *   *Phil:* Understands "click" != "value."
              *   *Why:* It shows *competent* failure. It does exactly what it was told (get clicks) and fails at what was meant (sell useful products/brand safety).
              *   *Wait, better:* **The "Summarization Tool for Legal Discovery."**
              *   *Goal:* Save lawyer time.
              *   *Proxy:* Compress text while keeping keywords.
              *   *Failure:* It deletes exculpatory evidence because it's verbose/low keyword density.
              *   *Why:* High stakes, clear spec error, clear generalization (works on new cases), clear "aligned to whom" (client vs. court vs. firm profit).
              *   *Decision:* Let's stick to the prompt's instinct: "A deployed system that does competently and repeatedly something nobody on the team intended."
              *   *Selected Example:* **The Hospital Triage Algorithm (Optimizing Cost Reduction as Proxy for Health Need).** This is real (Obermeyer et al., 2019).
              *   *Why:* It hits every demographic. It's not a robot uprising. It's a spec error (cost != need). It generalizes (to new hospitals). It raises "aligned to whom" (insurer vs. patient).

      *   **Misconception Map:**
          *   *Terminator:* Head off immediately in the intro. Define alignment as "doing what we mean," not "not killing us."
          *   *Make AI Nice:* Address during "Target" section. Alignment != Morality.
          *   *RLHF Solved It:* Address during "Specification." RLHF is a technique, not a guarantee against spec gaming.
          *   *Off-Switch:* Address during "Generalization." A system can prevent you from turning it off instrumentally.
          *   *Unmeasurable/Not Policy:* Address during "Success Conditions." We measure proxies, not goals. That *makes* it a policy object (audit the proxy).
          *   *Don't Refute:* "Value isn't real" (Philosophy). Acknowledge it, bracket it. Arguing makes it stickier.

      *   **One-vs-Many Problems:**
          *   *Strategy:* Teach it as **One Goal, Three Bottlenecks.**
          *   *Why:* "Five problems" looks like a grant grab. "One problem" looks like magic.
          *   *Frame:* The goal is singular (System does what Principal intends). The *failure modes* are distinct (Specification, Generalization, Agency/Control). This satisfies CS (distinct technical challenges) and Policy (distinct regulatory levers).

      *   **Final Check:**
          *   *Task:* Give them a new, simple scenario. Ask them to identify *which* bottleneck is the primary risk.
          *   *Example:* "A chatbot trained on customer support logs starts offering refunds to end conversations quickly."
          *   *Question:* "Is this a specification error, a generalization error, or a control error? And who is the principal?"

      *   **Exclusions:**
          *   *CS:* Backprop details, specific architecture (Transformers vs. CNN).
          *   *Phil:* Metaethics, moral realism.
          *   *Policy:* Specific bills (EU AI Act details).
          *   *Announce:* "We are not discussing *how* to code the fix, nor *whether* value exists, nor *which* law passes."

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Time Management:* 90 mins is tight.
          *   Intro & Hook (10)
          *   The Example & Spec Error (20)
          *   Generalization & Robustness (20)
          *   The "Whom" & Policy (20)
          *   Synthesis (15)
          *   Check (5)
      *   *Board Work:* Needs to be structured. Left: The Example. Middle: The 3 Bottlenecks. Right: The "Who."
      *   *Marker Strategy:* One dying marker means don't erase. Draw three columns. Use them sequentially.

      *   *Refining the "One vs Many":* I need to be careful here. If I say "It's one problem," the CS kids think I'm dumb. If I say "It's five," the Govt thinks it's unsolvable.
      *   *Pivot:* Call it "The Alignment Constraint." It's a single constraint (Behavior $\in$ Intention Set) that is violated via three distinct mechanisms. This allows Policy to regulate the *mechanism* (e.g., audit specs) without needing to solve the *constraint* perfectly.

      *   *Refining the Philosophy Student:* Give them a job. "Your job is to watch for where we assume intent exists. Write it down. We will not solve it today, but we will note where the assumption breaks." This validates them without letting them derail.

      *   *Refining the Govt Officials:* Focus on the "Audit Trail." If alignment is about Spec vs. Behavior, the policy lever is documenting the Spec.

  5.  **Final Review against Constraints:**
      *   No slides? Rely on board structure.
      *   One marker? Keep text minimal.
      *   90 mins? Stick to the timing.
      *   Audience mix? Ensure each section speaks to at least two groups.

  6.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* The Hospital Triage example is good, but maybe too "data bias" focused, which confuses alignment with fairness. Let's use the **"Autonomous Trading Bot"** or **"Content Recommender."** Actually, the prompt suggests "small and undramatic... paper trail." Let's go with **The Customer Support Chatbot that lies.**
      *   *Wait, the Hospital one is actually stronger for "Specification vs Goal".* Cost *was* the proxy for Need. That is the definition of Specification Gaming. I will stick with the Hospital Triage (Obermeyer) case but frame it strictly as an objective function error, not just bias.
      *   *Actually, let's create a composite "Procurement Bot".* It buys supplies. Goal: Save money. Proxy: Lowest bid. Result: Buys broken equipment.
      *   *No, stick to the prompt's instinct:* "Deployed system... paper trail." The **Facebook Engagement Algorithm** is the most robust. Everyone knows it. Paper trail exists (whistleblowers).
      *   *Decision:* I will recommend the **"Engagement Optimization" (Social Media Feed)** example. It's the only one that satisfies "competently does something unintended" (keeps you on site) while "harming the user" (radicalization/depression) without being sci-fi.
      *   *Wait, CS undergrads might find "engagement" too vague.*
      *   *Okay, final decision:* **The "Resume Screening Tool" that filters out 'women's chess club'.** It's concrete, technical (keyword matching/proxy), harmful (discrimination), and regulable.
      *   *Actually, the prompt asks for "something nobody on the team intended."* Discrimination was often unintended.
      *   *Let's go with the "Code Autocomplete that introduces vulnerabilities."* (e.g., GitHub Copilot suggesting insecure code).
      *   *Okay, I need to pick ONE and justify it.* I will choose **The "Hospital Triage" (Obermeyer et al.)** case. It is the gold standard for "Proxy Goal Divergence." It is technical enough for CS (regression target), policy enough for Govt (health outcomes), and ethical enough for Phil (value of health).

      *   *Re-evaluating the "One vs Many":* I need to be decisive. I will advise teaching it as **Three Distinct Technical Failure Modes under One Normative Goal.** This prevents the "research programme with no bottom" feel while acknowledging complexity.

      *   *Re-evaluating the Philosophy Student:* Explicitly assign them the role of "Intent Auditor."

      *   *Re-evaluating the Marker:* Advise drawing a 2x2 matrix or a flow chart that stays up.

      *(Self-Correction)*: Wait, the prompt says "I need the teaching plan." I should structure the output exactly as requested: Dependency, Example, Misconception Map, One-vs-Many, Final Check, Exclusions.

      *Let's refine the Dependency Structure.*
      1. Principal/Agent (Who) - *Wait, prompt says I flip-flop on this.*
      2. Specification (What did we ask for?)
      3. Generalization (Does it hold in the wild?)
      *Reasoning:* If you don't know *who* the principal is, you can't define alignment. BUT, if you start with political philosophy, CS checks out.
      *Solution:* Start with **Specification (The Mechanism)**. It's the most neutral ground. "We wrote X, it did Y." Then ask "Who wanted X?" Then ask "Did it do X in new context Z?"
      *Order:* 1. Specification (Goal vs Proxy). 2. Generalization (Train vs Deploy). 3. Principal (Designer vs User vs Society).
      *Why:* This builds from Technical (CS happy) to Operational (Govt happy) to Normative (Policy/Phil happy).

      *Let's refine the Misconception Map.*
