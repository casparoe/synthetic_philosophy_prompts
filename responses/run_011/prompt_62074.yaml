prompt: |-
  I am helping draft a gifts-and-hospitality rule for a regional land-titling office, and one of the drafters keeps insisting that a bribe is simply theft with extra steps: the official takes what belongs to the public, and since theft is wrong everywhere, no appeal to local custom can rescue gift exchange, so a bright-line rule of zero value is the only coherent option. On his telling, a village head who accepts livestock as a customary gift from a family applying for a title — in the open, reciprocated over years — has stolen from everyone who was not that family. Please audit the analogy rather than the politics behind it. First lay out the mapping explicitly: what plays the thief, the owner, the property taken, the victim, and the possibility of restitution. Then separate the disanalogies that actually matter for the use he is making of the comparison from those he can safely set aside, and say in particular what the theft frame quietly imports that a gift or patronage relation may lack — a determinate owner, a holding that exists prior to the transfer, a wrong that consists in the taking rather than in the distortion of a decision. Does his conclusion survive once those are on the table: does a single universal standard really follow, and are custom-based defenses merely special pleading? If theft is the wrong source domain, propose a better one and state what that alternative would license instead. Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit an analogy used by a drafter of a gifts-and-hospitality rule.
      *   **The Analogy:** "A bribe is simply theft with extra steps." (Specifically, an official taking public property/entitlement via a customary gift).
      *   **The Drafter's Conclusion:** A bright-line rule of zero value is the only coherent option; local custom cannot rescue gift exchange.
      *   **Specific Instructions:**
          1.  Lay out the mapping explicitly (Thief, Owner, Property, Victim, Restitution).
          2.  Separate relevant disanalogies from irrelevant ones.
          3.  Identify what the "theft frame" imports that gift/patronage lacks (determinate owner, pre-existing holding, nature of the wrong).
          4.  Evaluate if the conclusion (universal zero-value standard) survives this audit.
          5.  Evaluate if custom-based defenses are merely special pleading.
          6.  Propose a better source domain if theft is incorrect.
          7.  State what the alternative would license.
          8.  **Language:** American English.

  2.  **Deconstruct the Analogy (Mapping):**
      *   *Source Domain:* Theft.
      *   *Target Domain:* Bribery/Corrupt Gift Exchange in Land Titling.
      *   *Mapping:*
          *   Thief $\rightarrow$ The Official (Village Head).
          *   Owner $\rightarrow$ The Public / The State / Other Citizens.
          *   Property Taken $\rightarrow$ The Integrity of the Office / The Land Title / Public Trust.
          *   Victim $\rightarrow$ Everyone else (those not giving the gift).
          *   Restitution $\rightarrow$ Returning the gift / Nullifying the title / Punishing the official.

  3.  **Analyze Disanalogies (What matters vs. What doesn't):**
      *   *Irrelevant Disanalogies:* Physical force vs. social pressure, secrecy vs. openness (theft can be open, bribery can be secret), tangible vs. intangible property. The drafter argues openness doesn't matter, so I shouldn't dwell on secrecy as a saving grace for bribery.
      *   *Relevant Disanalogies:*
          *   *Consent/Transfer:* Theft is non-consensual taking. Gift exchange involves voluntary transfer from giver to receiver.
          *   *Pre-existing Right:* In theft, the victim *already owns* the item. In bribery, the "property" (the favorable decision) isn't owned by the public in the same way; it's a discretionary act.
          *   *Nature of Harm:* Theft deprives the owner of possession. Bribery distorts a *process* or *duty*.
          *   *Reciprocity:* Theft is unilateral extraction. Gifts imply ongoing social obligation (patronage).

  4.  **Analyze the "Theft Frame" Imports:**
      *   *Determinate Owner:* Theft requires specific ownership. Who owns a land title decision before it's made? The "public" is an abstract owner.
      *   *Pre-existing Holding:* You can't steal what doesn't exist or what isn't yours. The official doesn't "take" the title from the public; they *allocate* it.
      *   *Wrong as Taking vs. Wrong as Distortion:* Theft is wrong because of the *taking*. Bribery is wrong because of the *influence on judgment*. The harm is systemic distortion, not just asset loss.

  5.  **Evaluate the Conclusion (Zero Tolerance):**
      *   Does the theft analogy *force* a zero-tolerance rule?
      *   If it's theft, yes, you can't steal "a little bit."
      *   But if the analogy fails (because it's not theft), the logical necessity collapses.
      *   *Custom Defenses:* Are they special pleading? If the harm is distortion of duty, custom might mitigate *intent* but not necessarily *impact*. However, if the system relies on patronage for stability, a zero-tolerance rule might break the system without fixing the corruption.
      *   *Verdict:* The conclusion (zero tolerance) might still be good policy, but it doesn't follow *logically* from the theft premise because the premise is flawed.

  6.  **Propose a Better Source Domain:**
      *   If not theft, what is it?
      *   *Conflict of Interest / Fiduciary Duty:* The official is an agent. The public is the principal.
      *   *Fraud / Deception:* Pretending to be impartial while being bought.
      *   *Best Fit:* **Fiduciary Breach / Conflict of Interest.**
      *   *Why:* It focuses on the *duty of loyalty* and the *impairment of judgment*, not the loss of a specific asset.
      *   *What it licenses:* It allows for *de minimis* exceptions (like a meal) if they don't impair judgment, whereas theft allows no exceptions. It focuses on *disclosure* and *recusal* rather than just prohibition. It acknowledges the relationship rather than just the transaction.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Analytical, precise, neutral (auditing the logic, not the politics).
      *   *Structure:* Follow the prompt's sequence (Mapping -> Disanalogies -> Imports -> Conclusion Evaluation -> Alternative).
