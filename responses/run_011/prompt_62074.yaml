      *   *Refining the "Property" mapping:* The drafter says the official takes "what belongs to the public." What is that? It's the *impartiality* of the service. But impartiality isn't a chattel.
      *   *Refining the "Custom" point:* The drafter says custom is special pleading. I need to address if custom changes the *nature* of the transaction (social glue vs. quid pro quo).

  8.  **Final Polish:** Check against all constraints.
