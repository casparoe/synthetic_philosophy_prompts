      *(Final thought on the "Zero Value" conclusion)*: Even if the analogy is bad, is the rule bad? The prompt asks "Does his conclusion survive... does a single universal standard really follow?" I should argue that the *logical necessity* of the standard falls, even if the standard might be adopted for other reasons. The analogy doesn't *carry* the weight.

      *(Alternative Domain)*: "Fiduciary Duty" is the standard legal alternative. "Market Transaction" is another (selling public office). But "Fiduciary" captures the duty aspect best. Let's go with **Fiduciary Breach** or **Conflict of Interest**. It shifts the focus from "taking" to "compromised judgment."

      *(Wait, one more check)*: The prompt asks about "custom-based defenses." I need to be specific there. If the wrong is distortion, custom doesn't fix the distortion. But if the wrong is "secret stealing," custom (openness) matters. Since the drafter admits it's open, he's arguing openness doesn't matter. I need to explain *why* openness matters in a Gift frame but not a Theft frame.

