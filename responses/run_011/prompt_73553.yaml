prompt: |-
  Right, I've just got off the phone with my mate Dev after about three hours of going round in circles and my head's properly spinning, so I thought I'd ask someone who isn't him.

  Background: my younger brother Cal split from his girlfriend in the spring and it got ugly. She'd turn up at my flat unannounced, banging on the door at eleven at night, once she kicked the letterbox so hard it's still bent. So one Tuesday afternoon she comes round, I happen to be the one who answers, and Cal is sitting in the back room with a cup of tea. She asks me straight out: is he here? And I say no, he's out, wouldn't know when he'll be back. None of that was true, and the last bit I invented on the spot for good measure.

  She went. Nothing bad happend. Cal was obviously grateful.

  Dev's view is that this is a total non-issue — you lied to stop someone getting hurt, done, why are we still talking. My problem is I can't stop thinking about it, and not for the reason he assumes. I'm not worried I made things worse for anyone; I sort of think I did the right thing on the day. What's bugging me is that it didn't feel like it *cost* me anything, and Dev kept using that as proof it was fine — like the fact that lying came easy is exactly what makes it okay. That feels backwards to me and I can't say why.

  Two things I want to get straight, and I'd be grateful if you actually took them seriously instead of just telling me I did the right thing (though you're welcome to):

  1. Is there any respectable argument that lying is wrong in itself, over and above who it hurts or what it's for? Not the "lies erode trust" line, I've already had that one from Dev and it doesn't touch my case, because nobody's trust got eroded — she never found out, she'll never find out. I mean an argument on which what I said on that doorstep was a bad thing even though it worked, even though it saved my brother an evening of being shouted at, and even though I'd do it again tomorrow. Does that idea have any actual substance, or is it just a mood dressed up as a principle?

  2. Dev then said I hadn't even needed to lie, I could have told her something true that would have sent her off on the wrong track — like that I'd seen Cal at the station that morning, which I had, hours earlier, and let her draw her own conclusion from it. He reckons that was the clever move: same result, clean hands. I'm not convinced that's better at all, it feels like the same thing wearing a nicer coat. But maybe I'm wrong and there's a real gap between flatly asserting something you believe isn't true and steering someone into a false belief using only true words. Which is it? Does that gap carry any moral weight, or is it just bookkeeping for people who want a technicality to hide behind?

  I gather there's a long history of people arguing about exactly this, some of them extremely hardline, and I'd rather hear the strongest version of the hardline position than watch it get waved away, because I suspect Dev and I have both been lazy. But also tell me where the hardliners overreach, because I can't imagine they get everything right either. No bibliography please, I'm not writing an essay, just give me the arguments in plain terms. And keep it anchored to my doorstep and my brother — I don't want a trolley problem back.
