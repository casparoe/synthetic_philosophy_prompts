          2.  **Timescales:** Distinguish between Pleistocene cognitive biases (HADD) and Holocene institutions (MHG).
          3.  **Levels of Selection:** Distinguish between genetic adaptation (individual) and cultural evolution (group). This often resolves the "adaptation" label confusion.
