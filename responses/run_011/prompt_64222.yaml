answer: |-
  Here is a principle constructed to match your eight verdicts, followed by the test cases and an honest assessment of the cost.

  ### The Principle: Thresholded Contextual Rescue

  **1. The Severity Threshold:** Harms may be aggregated (summed) only if they fall below a threshold of "catastrophic personal loss" (e.g., death, permanent major disability). Harms above this threshold do not aggregate; one person's claim equals another's.
  *   *Forced by:* **Case 4** (paper cuts aggregate), **Case 5** (blindness does not), and **Case 6** (headaches do not trump death).

  **2. The Certainty Constraint:** When harms exceed the Severity Threshold and the victims are identified individuals facing *certain* loss, you must not choose based on numbers. You must use a fair lottery (coin flip).
  *   *Forced by:* **Case 1** (1 vs 5 lives, certain death) and **Case 5** (1 vs 5 blindness).

  **3. The Policy Exception:** When the choice involves risk profiles, statistical victims, or future policy rather than immediate rescue of identified individuals, you must maximize expected value (aggregate the numbers/probabilities).
  *   *Forced by:* **Case 7** (probabilistic rescue) and **Case 8** (statistical vs. identifiable policy).

  **4. Moral Modifiers:** Special obligations (family) permit overriding the lottery. Fault (negligence) permits weighting the lottery but does not mandate a verdict.
  *   *Forced by:* **Case 2** (brother) and **Case 3** (warning sign).

  ***

  ### Verdicts on Four New Cases

  **Case A: Longevity (Lifespan)**
  *Setup:* You can administer a drug. Option 1 cures one person of a condition that will shorten their life by 40 years. Option 2 cures five people of a condition that will shorten their lives by 5 years each.
  *   **Application:** We must determine if losing 5 years constitutes a "catastrophic personal loss" under Clause 1. It is likely below the threshold of death/permanent disability, whereas 40 years is borderline.
  *   **Verdict:** If 5 years is below the threshold, **save the five.** Aggregation applies to sub-catastrophic losses of longevity. If you judge 40 years as effectively a "life lost" (above threshold) and 5 years as not, the single person's claim vetoes the aggregation.
  *   *Principle Clause:* 1 (Severity Threshold).

  **Case B: Danger by Choice**
  *Setup:* To save one trapped miner (certain death otherwise), you must operate a heavy drill. Option 1: The drill certainly collapses a tunnel killing one support worker. Option 2: The drill creates a vibration that gives ten support workers a 20% chance of fatal collapse (Expected value: 2 deaths).
  *   **Application:** Option 1 violates the Certainty Constraint (Clause 2): it condemns an identified individual to certain death. Option 3 falls under the Policy Exception (Clause 3): it imposes a risk profile on a group.
  *   **Verdict:** **Choose Option 2.** Even though the expected death toll is higher, you are forbidden from selecting a certain death for an identified individual when a probabilistic alternative exists.
  *   *Principle Clause:* 2 (Certainty Constraint) & 3 (Policy Exception).

  **Case C: The Threshold Edge**
  *Setup:* A fire is spreading. You can save one person from permanent blindness. Alternatively, you can save five people from losing their dominant hand (permanent, major disability, but not sensory loss).
  *   **Application:** Both harms likely exceed the Severity Threshold (Clause 1). Both are identified individuals facing certain loss (Clause 2). Numbers do not aggregate.
  *   **Verdict:** **Flip a coin.** Neither harm is clearly "below threshold" to allow aggregation, and both are catastrophic enough to trigger the Certainty Constraint.
  *   *Principle Clause:* 1 & 2.

  **Case D: Identifiable Rescue vs. Statistical Knowledge**
  *Setup:* You see one child drowning in a well (Identified). You also know via sensor data that five children are trapped in a collapsed mine shaft nearby (Statistical/Unseen), but you cannot save both groups.
  *   **Application:** This tests the boundary between Clause 2 and Clause 3. Although the five are "statistical" in the sense that you cannot see them, they are currently in an immediate rescue context, not a policy context. However, Case 8 suggests identifiability matters.
  *   **Verdict:** **Flip a coin.** Immediate rescue of known victims (even if unseen) triggers the Certainty Constraint. The "Policy Exception" applies to air quality or long-term risks, not immediate collateral knowledge in a rescue scenario.
  *   *Principle Clause:* 2 (Certainty Constraint).

  ***

  ### Honest Assessment: The Cost of Consistency

  This principle successfully keeps all eight of your verdicts. It does not overrule any of them. However, keeping them all comes at a high cost in **moral dualism**.

  **1. The Rescue/Policy Schism**
  Your verdicts require two different moral operating systems. In **Case 1** (Rescue), numbers are morally inert; 5 lives do not outweigh 1. In **Case 7** (Risk/Policy), numbers are everything; 10 expected lives outweigh 9.
  *   *The Cost:* You must accept that the *structure of the choice* (certain vs. probabilistic) changes the moral weight of a human life. Philosophically, this is unstable. It implies a person is "more saveable" when they are part of a risk calculation than when they are standing in front of you. You have to be comfortable with the idea that morality switches rules depending on whether the victims are "identified" or "statistical," even if the physical outcome is identical.

  **2. The Vague Threshold**
  Your verdicts demand a sharp line between **Case 4** (paper cuts, aggregate) and **Case 5** (blindness, do not aggregate).
  *   *The Cost:* The principle relies on a "Severity Threshold" that is not defined by the principle itself. You have to intuitively judge where "paper cuts" end and "blindness" begins. This makes the principle difficult to apply to new cases (like Case A above) without relying on the very gut feelings you are trying to systematize.

  **3. The "Fault" Ambiguity**
  In **Case 3**, you say fault puts a "thumb on the scale" but isn't a verdict.
  *   *The Cost:* The principle allows for a "weighted lottery," but offers no metric for how heavy the thumb should be. Does negligence make someone 10% less worthy of rescue, or 90%? Your intuition stops short of a verdict here, and the principle preserves that ambiguity rather than solving it.

  **Summary**
  Your intuitions commit you to a **non-utilitarian rescue ethic** (lives don't aggregate in immediate crises) paired with a **utilitarian policy ethic** (lives do aggregate in risk management). This is a coherent position, but it requires you to defend why the *identifiability* of a victim changes their moral weight, which is the most philosophically contentious part of your list.
