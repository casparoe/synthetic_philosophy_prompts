  Decision Tree for Methodological Orientation

  1.  In the credit-scoring case, if all engineers and subjects are replaced but the input-output patterns remain, has the explanatory object changed?
      *   Yes (Human-Centric) → Go to Node 2
      *   No (Structure-Centric) → Go to Node 6

  2.  Is understanding the actor's subjective reason necessary for explanation?
      *   Yes → Go to Node 3
      *   No → Go to Node 4

  3.  Is the relevant meaning held by an individual, a community, or negotiated in practice?
      *   Individual → Interpretivist position on meaning-laden actions
      *   Community → Structuralist Hermeneutics
      *   Negotiated → Pragmatist View on Social Inquiry

  4.  Does the collective entity possess a decision procedure distinct from the sum of member preferences?
      *   Yes → The view that group agents are real but analyzable into individual commitments and decision procedures
      *   No → Go to Node 5

  5.  Is the explanation validated by revealing specific steps linking cause to effect?
      *   Yes → Mechanism-based analytical sociology
      *   No → Go to Node 8

  6.  Can the explanatory model function without referencing human beliefs or desires?
      *   Yes → A systems theory on which communication rather than persons is the basic element
      *   No → Go to Node 7

  7.  Do causal powers reside in relations between positions, external facts, or internalized dispositions?
      *   Relations → Critical-realist emergence
      *   External Facts → Durkheimian social facts as irreducible
      *   Internalized → Bourdieusian Habitus

  8.  Is the dispute about how the world is, or about useful vocabulary?
      *   Vocabulary → A deflationary view on which the dispute is merely verbal
      *   World → Go to Node 9

  9.  Is stability explained by equilibrium calculations or habituated routines?
      *   Equilibrium → Rational-choice reductionism
      *   Routines → Historical Institutionalism

  ***

  **Analysis of Unoccupied Combinations**

  The tree generates logical spaces that remain unoccupied by the leaves provided.

  *   **Structure-Centric + Subjective Reason (Node 1 "No" → Node 2 "Yes"):** This path is closed. A position claiming that structural objects persist through human turnover *but* still require understanding subjective reasons for explanation has no leaf. This is likely **unexplored** in standard typologies, though Phenomenological Sociology might argue for it. It is excluded here to maintain the clean split between human-centric and system-centric ontologies.
  *   **Human-Centric + No Beliefs/Desires (Node 1 "Yes" → Node 6 "Yes"):** This path is closed. If the object changes with humans, the tree assumes beliefs/desires become relevant. A position claiming human turnover changes the object *but* explanation should ignore beliefs (e.g., strict behaviorism focused on bodies) is **unattractive** to most contemporary social scientists and is routed into the Rational-choice or Mechanism branches instead.
  *   **Group Agent + Mechanism (Node 4 "Yes" → Node 5):** This path is closed. If a group has a distinct decision procedure, the tree assigns it a specific leaf rather than asking if it uses mechanisms. This is because group agent theory typically subsumes mechanism questions; separating them would be **incoherent** within this framework.

  **Flagged Leaf Separation Issues**

  *   **Durkheimian Social Facts vs. Bourdieusian Habitus:** The tree separates these based on whether constraints are "external" or "internalized." In empirical practice, this distinction is often blurred (external rules become internalized habits). The tree cannot easily separate these leaves if a student argues that social facts are *both* external and internalized simultaneously.
  *   **Mechanism-based Analytical Sociology vs. Historical Institutionalism:** Node 5 and Node 9 separate these by "steps" vs. "routines." However, routines are often the specific steps mechanisms trace. A student arguing that institutions *are* mechanisms may find these leaves indistinguishable.

  **Confidence Note**

  I am moderately confident that this tree discriminates the major traditions listed, as the nodes track standard fault lines in social theory (ontology of the object, role of meaning, criteria for explanation). I am least sure of the placement of **Critical-realist emergence** at Node 7. While critical realists emphasize relational powers, some strands argue for a stronger ontological separation between structure and agency that might warrant a branch earlier in the tree (perhaps splitting from Durkheim at Node 1). Placing it here assumes the student accepts the "Structure-Centric" path implies irreducibility, which may conflate critical realism with other structuralist views.
