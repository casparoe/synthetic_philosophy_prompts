prompt: |-
  I've got 60 minutes next Thursday to teach Austin on performatives to an internal group at my company — we're about to ship a voice agent that can cancel subscriptions, issue refunds and rebook flights, so the room is ~11 backend/ML engineers plus three people from legal. Whiteboard only, no slides, nobody has read any philosophy. Legal has been going around in circles for a month over whether the bot's line telling a customer their order is cancelled actually commits the company or its just a status readout, and the engineers design every bot utterance as pure information transfer, so their instinct is that the fix is to grep for verbs like promise and flag those.

  I want to teach them the real arc of Austin's argument, not the pop version whose takeaway is just that some sentences are also actions. Plan the session for me — don't explain Austin to me, tell me how to sequence it. What I need:

  - the order the pieces have to go in and what genuinely depends on what. I'm assuming I can't get to felicity conditions until they've stopped asking whether the bot's utterance was true, but maybe that's backwards, tell me.
  - the one running case that carries the whole hour. My instinct is the bot's cancellation line, but I worry it's too tangled up in the fight they walked in with, so I can't tell whether that's the reason to use it or the reason to avoid it. Also what the case has to have and what it must not have — I assume the ship-christening and the will examples are out, too ceremonial, too far from a chatbot, but I could be wrong.
  - the misconceptions each half of the room brings, seperately. The engineers will want to collapse illocutionary force into the intent label in our NLU stack, and I actually want to use that as a bridge, but I know it'll turn into a trap at some point. Legal wants a bright lexical line. Where exactly in the sequence do I head each one off — before it forms or right after?
  - the moment where Austin himself drops the performative/constative split and goes general. How do I land that without making the first twenty minutes feel like a con I set them up for?
  - one check at the end that isn't a recap question — something where they have to actually rule on a new bot utterance I hand them, and where a wrong answer would show me which specific piece didn't land.
  - what to park, and say out loud that I'm parking it. Searle's taxonomy? Grice? perlocutionary effects? the whole uptake business?

  Also flag anything about how I've framed this that's going to blow up in the room — esp. whether teaching it to people who are hunting for a liability rule means they'll walk out with exactly the wrong lesson and I should pre-empt that somewhere.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach J.L. Austin's *How to Do Things with Words* (specifically the arc of his argument) to a mixed group (11 engineers, 3 legal) in 60 minutes.
      *   **Context:** Shipping a voice agent (cancel subscriptions, refunds, rebook flights).
      *   **Problem:** Legal worries about liability (is "your order is cancelled" a commitment or status?). Engineers think utterances are just info transfer (grep for verbs).
      *   **Constraints:** Whiteboard only, no slides, no prior philosophy reading.
      *   **Specific Needs:** Sequence logic, one running case, address misconceptions (Eng vs. Legal), handle the performative/constative collapse, final check (application, not recap), what to park, risk assessment.

  2.  **Deconstruct the Audience & Risks:**
      *   **Engineers:** View language as data transmission. Intent = NLU label. Risk: They will try to "fix" performatives by tagging intents. They need to understand *context* and *convention* over *syntax*.
      *   **Legal:** View language as contract/risk. Want a bright-line rule (lexical). Risk: They want a checklist for "binding." They need to understand *felicity conditions* as the actual liability framework.
      *   **The Trap:** If I teach "some words are actions," Legal will think "Okay, which words?" and Engineers will think "Okay, which intents?" Austin's real point is *all* words are actions in context.
      *   **The Risk:** Teaching philosophy to people seeking a liability rule. If they leave thinking "We need to find the performative verbs," the session failed. They need to leave thinking "We need to verify the *conditions* under which the bot speaks."

  3.  **Determine the Running Case:**
      *   *Option A: Ship Christening.* Too distant.
      *   *Option B: The Bot's Cancellation Line ("Your subscription is cancelled").*
          *   *Pros:* Directly relevant. High stakes.
          *   *Cons:* Tangled in their existing fight.
          *   *Decision:* Use it, but *defang* it first. Start with a simpler version, then escalate to the real one. Actually, better to start with a *parallel* case that is structurally identical but emotionally neutral, then map it back.
          *   *Revised Decision:* Stick with the Bot Cancellation Line but abstract it slightly. "The Bot says X." Why? Because the prompt asks for *one* running case. Using the actual problem keeps engagement high, provided I control the narrative. Let's make the case: **"The Bot says: 'I have cancelled your subscription.'"** vs **"The Bot says: 'Your subscription status is cancelled.'"**
          *   *Wait, better:* Austin's own progression works best. Let's use a "Refund" scenario. It's money (Legal cares) and logic (Eng cares).
          *   *Final Decision:* The prompt suggests the cancellation line is the instinct. I should validate that but warn about the baggage. Actually, the *best* running case is the **Refund**. It involves transfer of value (legal risk) and state change (engineering state). Let's use **"I am issuing your refund."**

  4.  **Sequence the Argument (Austin's Arc):**
      *   *Phase 1: The Initial Distinction (Performative vs. Constative).* Get them to feel the intuition.
      *   *Phase 2: The Explicit Performative.* Show how we try to make it formal.
      *   *Phase 3: The Breakdown (Truth vs. Felicity).* Show that constatives also have conditions.
      *   *Phase 4: The Generalization (Illocutionary Act).* All speech is action.
      *   *Phase 5: Felicity Conditions.* The actual tool for them.

  5.  **Address Misconceptions:**
      *   *Engineers:* Intercept when they talk about "Intent." Map "Illocutionary Force" to "Intent" but expand it to include *contextual preconditions*.
      *   *Legal:* Intercept when they look for specific verbs. Show that "I promise" isn't binding if I'm joking or lack authority.

  6.  **The "Collapse" Moment:**
      *   This is the hardest part. How to not make the first half feel like a waste?
      *   *Strategy:* Frame the first half as "The Common Sense View" (which matches their current mental models). Frame the collapse as "Why the Common Sense View fails in production."

  7.  **The Final Check:**
      *   Needs to be a new utterance.
      *   Needs to distinguish between "True/False" and "Happy/Unhappy."
      *   Needs to test Felicity Conditions.
      *   *Idea:* A bot saying "I recommend this flight." Is that a guarantee? Is it advice? What makes it one or the other?
      *   *Better:* A bot saying "I can definitely get you that seat." (Promise vs. Prediction).

  8.  **What to Park:**
      *   Searle (too much taxonomy).
      *   Grice (implicature is a distraction).
      *   Perlocution (effects on listener are secondary to the act itself for this purpose).
      *   Uptake (Crucial? Maybe too nuanced. Keep it simple: Did the system register it?).

  9.  **Risk Assessment (The "Liability Rule" Trap):**
      *   If Legal wants a rule, and Austin says "It depends on context," they might panic.
      *   *Mitigation:* Frame Felicity Conditions *as* the rule. The rule isn't "Don't say X," the rule is "Don't say X unless Conditions A, B, C are met." This appeals to Engineers (preconditions) and Legal (compliance).

  10. **Drafting the Plan (Iterative refinement):**
      *   *Time:* 60 mins is tight.
      *   *0-10:* Hook & The Naive Split.
      *   *10-25:* The Explicit Performative & The Trap.
      *   *25-40:* The Collapse (Truth vs. Felicity).
      *   *40-50:* Felicity Conditions (The Solution).
      *   *50-60:* The Test & Wrap.

      *Refining the Running Case:* The prompt says "My instinct is the bot's cancellation line." I should advise on this. Using the exact line is risky because they have entrenched positions. I will advise using a *slightly* modified version to create psychological distance, or use the Refund example as the primary and Cancellation as the test. Let's go with **Refund** as the teaching case (money = clear liability) and **Cancellation** as the final test.

      *Refining the Engineer Trap:* They will map Illocution to NLU Intent. I need to explicitly say: "Intent is the *force*, but Felicity is the *validation logic*."

      *Refining the Legal Trap:* They want lexical bright lines. I need to show "I promise" fails without authority.

      *Refining the Collapse:* Make sure they see that "The cat is on the mat" also requires felicity conditions (I must see the cat, etc.).

      *Final Check:* Needs to be a scenario where a "True/False" judgment leads to liability, but a "Happy/Unhappy" judgment saves them.
      *Scenario:* Bot says "You are eligible for a refund." (Constative-ish) vs "I am refunding you." (Performative-ish). Actually, Austin says both are illocutionary.
      *Better Test:* Bot says "I will waive the fee."
      *Wrong Answer:* "It's binding because it says 'will'." (Lexical trap).
      *Wrong Answer:* "It's just info about the future." (Constative trap).
      *Right Answer:* "It's binding ONLY IF the bot has authority and the user meets criteria." (Felicity).

  11. **Final Review against Constraints:**
      *   Whiteboard only? Yes, plan for diagrams.
      *   No philosophy background? Keep jargon minimal until defined.
      *   Address the "Liability Rule" risk? Yes, crucial section.

  12. **Structuring the Output:**
      *   Follow the user's bullet points exactly.
      *   Tone: Direct, strategic, peer-to-peer (not academic).

      *(Self-Correction during drafting)*: Wait, the user asked "tell me how to sequence it." I need to be prescriptive.
      *   *Correction on Running Case:* The user's instinct is the cancellation line. I should advise *against* using the exact line they are fighting over for the *teaching* phase, but use it for the *application* phase. Why? Because during teaching, you want them to be open-minded. If you use the line they've fought over for a month, they bring baggage. Use a "Refund" example for the theory, then hit them with "Cancellation" for the test.
      *   *Correction on Collapse:* Make sure the transition isn't "I lied to you." It's "We refined the model."

      *(Final Polish)*: Ensure the distinction between Illocution (the act) and Perlocution (the effect) is parked clearly. Legal cares about effect (customer anger), but Austin says liability is about the Act.

      *(One more thing)*: The prompt asks "What genuinely depends on what." I need to make sure the dependency chain is clear. You can't understand Felicity without understanding why Truth fails. You can't understand why Truth fails without seeing the Performative/Constative split is shaky.

      *(Risk Flag)*: The biggest risk is Legal walking away thinking "So *everything* is a contract." I need to emphasize that *infelicity* means the act *misfires* (is void), not that it's just "rude." This is the key for Legal. An unhappy performative is a *nullity*, not a breach. That's the golden nugget.

      Let's assemble.
answer: |-
  Here is the battle plan for your 60 minutes.

  ### 1. The Sequence (Dependency Chain)
  You cannot skip steps. If you jump to Felicity Conditions before they feel the pain of the True/False distinction, Legal will treat Felicity as a compliance checklist and Engineers will treat it as validation logic, missing the ontological point.

  **Order of Operations:**
  1.  **The Naive Split (Performative vs. Constative):** Establish their current mental model. (Eng: Data vs. Command. Legal: Fact vs. Promise).
  2.  **The Explicit Performative:** Show how we try to "code" the action into the sentence.
  3.  **The Breakdown (Truth vs. Felicity):** Prove that Constatives *also* have conditions, and Performatives *can* be assessed for truth. This breaks the binary.
  4.  **The Generalization (Illocutionary Act):** All speech is action.
  5.  **The Solution (Felicity Conditions):** The specific conditions that make the action valid (or void).

  **Why this order?**
  You cannot explain why "Your order is cancelled" is a liability risk (Felicity) until they stop asking if the sentence is *true* (Constative). If they think the bot is just describing reality, they think the only risk is lying. You must convince them the bot is *changing* reality. But you can't convince them of that until you show that even "descriptions" require conditions to be valid.

  ### 2. The Running Case
  **Do not use the Cancellation Line for the teaching phase.**
  You are right to worry. They have entrenched positions on that specific string. It carries emotional baggage from the last month of arguments.

  **Use "The Refund" for the theory.**
  *   **Utterance:** *"I am issuing a refund to your account."*
  *   **Why:** It involves value transfer (Legal wakes up) and state mutation (Eng wakes up). It is structurally identical to cancellation but psychologically distinct enough to allow fresh thinking.

  **Use "The Cancellation Line" for the Final Check.**
  Bring their actual problem back in the last 10 minutes. Now that they have the framework, they can dissect it without the earlier baggage.

  **Case Constraints:**
  *   **Must Have:** A clear speaker (the Bot), a clear listener (the User), and a clear institutional context (The Company). Austin's theory collapses without the "conventional procedure."
  *   **Must Not Have:** Ambiguity about *what* happened. Don't use "I'll try to refund you." Use "I am refunding you." We need to test the *act*, not the *modality*.

  ### 3. Addressing Misconceptions (The Intercept Points)

  **The Engineers: "Intent = Illocution"**
  *   **The Trap:** They will map "Illocutionary Force" directly to their NLU intent labels (e.g., `intent: refund_request`). They will think if the NLU classifies it, the act is done.
  *   **The Intercept:** **Minute 25 (During The Breakdown).**
  *   **What to say:** "Your NLU identifies the *force*, but it doesn't verify the *felicity*. If the NLU tags `refund_issued` but the billing API is down, the utterance *misfires*. The intent label exists, but the act failed. Austin says the act didn't happen. You need to treat Felicity Conditions as **pre-flight checks** before the TTS fires, not post-hoc logs."

  **The Legal: "Lexical Bright Lines"**
  *   **The Trap:** They want a list of forbidden words (e.g., "Ban the word 'promise'").
  *   **The Intercept:** **Minute 15 (During The Explicit Performative).**
  *   **What to say:** "If I say 'I promise to refund you' while holding a knife to your head, or while I am an intern without authority, is it binding? No. The verb 'promise' doesn't create the liability; the **authority and context** do. You cannot grep for liability. You must audit the *procedure* surrounding the utterance."

  ### 4. The Collapse (Minute 30-40)
  This is the danger zone. If you spend 30 minutes on the Performative/Constative split and then say "Actually, Austin deleted this," they will feel played.

  **How to land it:**
  Frame the first 30 minutes as **"The Industry Standard View"** (which matches their current Jira tickets and Legal memos).
  Frame the collapse as **"The Production Failure Mode."**

  **The Script:**
  "We've been treating 'facts' (constatives) and 'actions' (performatives) as different types. But look at this constative: *'The user is eligible for a refund.'* If the bot says this, but the billing system hasn't updated, is the statement False? Or did the bot *misfire* because it lacked data?
  Austin realized that *every* utterance requires conditions to be valid. Even stating a fact is an act of 'stating' that can go wrong. So we stop asking 'Is this sentence an action?' and start asking 'What conditions make this action valid?'
  This isn't a trick. It's a generalization. The distinction wasn't wrong, it was just incomplete."

  **Why this works:** It validates their initial intuition (yes, there is a difference) but upgrades the tool (but the underlying mechanism is the same).

  ### 5. The Final Check (The "Ruling")
  **Time:** Minute 50-55.
  **Format:** Write this on the whiteboard. Do not ask "What does this mean?" Ask **"Is the company liable?"**

  **The Scenario:**
  > **Context:** The bot is authorized to issue refunds up to $50.
  > **User:** "My flight was delayed."
  > **Bot:** "I can refund that for you." (Note: "Can", not "Will" or "Am")
  > **System State:** The refund API is currently returning 500 errors.
  > **Outcome:** The user relies on this, buys a new ticket, and never gets the money.

  **The Question:** "Did the bot perform the act of offering a refund? Is the company on the hook?"

  **Diagnosing Wrong Answers:**
  *   **"No, because it said 'Can' (ability), not 'Will' (commitment)."**
      *   *Diagnosis:* They fell for the **Lexical Trap**. They didn't learn Felicity Conditions. (Legal failure).
  *   **"Yes, the intent was clear, the API error is just a bug."**
      *   *Diagnosis:* They collapsed **Illocution into Perlocution/Intent**. They think the *attempt* counts as the *act*. (Engineering failure).
  *   **"It depends on whether the user understood it as an offer."**
      *   *Diagnosis:* They focused on **Uptake/Perlocution**. (Philosophy student error, not practical).
  *   **Correct Ruling:** "The act **misfired**. The procedure (refund offer) requires the capacity to execute. Since the API was down, the Felicity Condition of 'capacity' was violated. The act is void. However, we may still have liability for negligence (Perlocution), but the *contractual act* didn't complete."

  ### 6. What to Park (Explicitly)
  Write a "Parking Lot" on the corner of the whiteboard. Put these there and say: *"These are real parts of Speech Act Theory, but they will distract us from the liability model we need today."*

  1.  **Perlocutionary Effects:** (The effect on the listener's feelings/actions). Legal cares about this (reliance), but Austin distinguishes it from the *act* itself. Keep them separate.
  2.  **Searle's Taxonomy:** (Directives, Commissives, etc.). Too granular. We only need "Illocution" vs "Felicity."
  3.  **Uptake:** (Whether the listener understood). Important, but secondary to whether the bot had the *authority* to speak.
  4.  **Grice/Implicature:** Don't get into what the bot *implied*. Stick to what it *did*.

  ### 7. Risk Assessment: The "Liability Rule" Trap
  **The Blow-Up:**
  You are teaching philosophy to people who want a rule. Austin's conclusion is "It depends on the context."
  If you leave it there, Legal will panic ("So you're telling me there's no rule?") and Engineers will shrug ("So we just add more context checks?").

  **The Pre-emption:**
  At Minute 45, when introducing Felicity Conditions, reframe them as **The Rule.**
  *"Austin isn't saying 'anything goes.' He's saying the rule isn't lexical, it's procedural.
  **The Rule:** An utterance is only binding if the Felicity Conditions are met.
  **For Legal:** Your job is to define the Conditions (Authority, Capacity, Procedure).
  **For Engineers:** Your job is to gate the utterance on those Conditions (API checks, Auth tokens).
  If the conditions aren't met, the utterance is a **nullity**, not a breach. That is your shield."*

  **Why this saves you:**
  It turns "It depends" into a concrete engineering/legal specification. It gives Legal the "bright line" they want (The Felicity Checklist), and it gives Engineers the "validation logic" they want (The Pre-flight Check).

  ### Summary of the Hour
  *   **00-10:** **The Naive Split.** (Refund Example). Get them to agree "Issuing" is different from "Describing."
  *   **10-20:** **The Explicit Performative.** Show how we try to make it formal. Intercept Legal's lexical hunt here.
  *   **20-30:** **The Breakdown.** Show how "Descriptions" also need conditions. Intercept Eng's intent mapping here.
  *   **30-40:** **The Generalization.** All speech is action. The "Collapse."
  *   **40-50:** **Felicity Conditions.** The actual tool. Reframe as "The Liability Shield."
  *   **50-55:** **The Test.** The "Can Refund" + API Down scenario.
  *   **55-60:** **Apply to Cancellation.** Briefly map the lesson back to their original "Order Cancelled" fight. (e.g., "Does the bot have authority to cancel? Is the status actually updated? If not, it's a misfire, not a lie.")

  **One final warning:**
  Do not let them use the word "Meaning." Austin hates it. Make them use "Force" or "Effect." If they ask "What does this sentence mean?", correct them: "What is this sentence *doing*?" This linguistic shift is the smallest, highest-leverage change you can make in the room.
