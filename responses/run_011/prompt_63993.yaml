answer: |-
  **The Archive:** Saanich Inlet, British Columbia. Anoxic fjord, varved sediments, continuous deposition. No bioturbation.

  **The Markers:**
  1.  **Plutonium-239 Onset (1952):** Atmospheric fallout from Ivy Mike. Globally synchronous within months. Sharp spike. Technically perfect GSSP candidate. It signifies nuclear capacity, but as unintentional waste.
  2.  **Coal Fly Ash Onset (1850):** Spherules from industrial combustion. Found globally, but onset varies by basin (1850 North Atlantic, 1950 Global South). Sharp locally, diachronous globally. Signifies intentional energy extraction and landscape modification.

  **The Constraint:** Assume perfect dating and recovery. The diachrony of Fly Ash is physical (industrial diffusion), not epistemic.

  **The Characters:**
  *   **Elise (Stratigrapher):** Chooses Pu-239.
  *   **Marcus (Historian):** Chooses Fly Ash.

  **Demonstration:**
  Elise's standard is isochrony. Pu-239 allows global correlation within a single year. It defines "when" perfectly. Marcus's standard is significance. Fly Ash defines "what" (industrialization) rather than "when" (cold war testing). The trade-off is forced by physics: atmospheric fallout (Pu) mixes faster than particulate industrial output (Ash). The marker that travels fastest (Pu) carries the least intentional human signal (waste vs. product).

  **Deleting the Constraint:**
  If you let the stratigrapher choose freely based on formal criteria alone, the case collapses. Elise wins immediately. Pu-239 is the superior spike. The conflict only exists because Marcus demands the boundary reflect *agency*, a criterion outside stratigraphic code. If agency counts, Fly Ash wins on meaning but loses on precision.

  **The Attacks:**
  *   **Elise to Marcus:** "You are defining a literary period, not a geological epoch. If your boundary arrives in 1850 here and 1950 there, you have not defined a moment in Earth history; you have defined a gradient. Geology requires simultaneity to function as a clock."
  *   **Marcus to Elise:** "You have built a perfect clock that tells the wrong time. Your boundary marks when humans became radioactive, not when they became geological. A spike that ignores the century of prior system engineering is stratigraphically precise but ontologically empty."

  **The Commitment:**
  It is a decision about what a geological time unit is for.

  There is no evidence gap. We know when the Pu fell and when the Ash settled. The conflict is teleological. If the Anthropocene is a tool for global correlation (a clock), Pu-239 is the only choice. If it is a tool for signifying human transformation of the Earth system (a label), Fly Ash is the only choice. You cannot have a boundary that is both perfectly synchronous and meaningfully representative of early industrial agency, because human industrialization was not synchronous. You must choose: do you want a unit that slices time cleanly, or one that cuts into the flesh of the phenomenon? Pick one.
