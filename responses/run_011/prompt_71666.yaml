  8.  *(Self-Correction during drafting)*: I need to be careful with the "Fatal" ranking. If the Eastern Empire *did* recover, does that kill the thesis? The user's thesis is about "changed what was possible." If the Empire survived but *couldn't* reconquer the West permanently, that might still fit. However, if the fiscal strength remained high, the "constraint novelty" (institutions couldn't absorb) is directly challenged. I will rank the Institutional Resilience argument as Fatal/Severe because it attacks the "Constraint Novelty" pillar directly. The Palynology argument attacks the "Counterfactual" pillar (no collapse = no different outcome). I'll group them near the top.

      *Refining the 90-year gap:* This attacks the causal chain. It's severe but not necessarily fatal if one argues for "cumulative fragility." I'll rank it Severe.

      *Refining aDNA:* This is technical. If *Y. pestis* is found, the disease part stands. If it's sparse, the *scale* is questioned. I'll rank this Moderate/Awkward because even a reduced plague is still a shock.

