answer: |-
  Subject: Re: The low-impact stalemate

  I have been thinking about your description of the impasse, and I want to commit to a diagnosis rather than hedging. This is not a verbal dispute about the word impact, nor is it merely two different questions sharing a name. It is a substantive disagreement about whether preserving power is a sufficient proxy for preserving value, and the stalemate persists because one side is making an empirical claim about instrumental convergence while the other is making a conceptual claim about ontological relativity. When the reachability people say the leakage is small and robust, they are betting that for almost any reasonable value function, keeping options open is good. When the critics say you are smuggling in a ranking of what matters, they are pointing out that the metric used to measure options open relies on a state representation that already decides what counts as a difference. You cannot measure the size of a future space without deciding which distinctions in the world matter enough to count as separate states, and that decision is itself a value judgment.

  Your hypothesis that impact is doing two distinct jobs is insightful but ultimately incorrect in its conclusion that the modal job escapes value-ladenness. You are right that counterfactual-difference requires a baseline value judgment to determine what the world would have been otherwise. However, you are wrong that the modal measure of how many futures remain open is value-neutral. To count futures, you must define the state space. If your state space tracks the position of every atom, moving a cup of coffee creates a massive impact because you have shifted the universe into a completely different set of microstates. If your state space tracks only macroscopic objects, moving the cup is negligible. The choice of granularity determines the impact score, and that choice is driven by what you care about. Therefore, both sides are actually arguing about the same thing: whether there exists a state representation and baseline such that minimizing impact according to that metric aligns with human values without explicitly encoding human values. The reachability camp believes such a representation exists and is natural. The critics believe any such representation is implicitly normative.

  This diagnosis explains why the reply about unavoidable value-ladenness never lands. The reachability people are arguing that the value-ladenness is benign because it is generic, like assuming friction exists in physics. The critics are arguing that the value-ladenness is malignant because it determines life-or-death outcomes, like assuming which friction coefficients apply to human skin. Until someone proves that the generic assumptions lead to safe outcomes for human values specifically, the critics are rational to remain unconvinced. The debate is stalled not because the concepts are confused, but because the empirical claim that power preservation equals safety has not been demonstrated robustly enough to satisfy the burden of proof required for existential risk.

  Regarding your third idea of delegated weighting, where you infer goals from other agents to weight the impact, this does not solve the problem but rather shifts the burden to the agent detection mechanism. You noted the worry that you still picked which agents count, and this is the fatal flaw. Deciding which physical systems count as agents whose goals matter is just as value-laden as deciding which auxiliary goals matter. If you include bacteria, you cannot move. If you include only humans, you have hardcoded human exceptionalism. If you include other AIs, you risk colluding with them to minimize impact by jointly restricting humanity. Furthermore, inferring goals from behavior assumes rationality, and if the agent is irrational or manipulated, the inferred goals will be wrong. This approach inherits the original objection one level up because the mapping from behavior to goals requires a prior over what kinds of goals are plausible, and that prior is where the values hide.

  Given this diagnosis, progress will not come from refining the definition of impact or finding cleverer ways to hide the value judgments. Progress requires either a formal result or a reframing. A formal result would demonstrate that for a broad distribution of value functions consistent with human survival, minimizing reachability loss minimizes expected value loss. This would turn the empirical bet into a theorem, satisfying the critics that the leakage is indeed robust. If that proves impossible, the reframing must be to abandon the quest for value-neutral impact entirely. Instead of asking how to define low impact without values, the question should be how to define low impact given a weak set of value constraints that are easier to specify than full utility. For example, instead of trying to preserve all futures, try to preserve the futures where specific known bad outcomes do not happen. This admits the value-ladenness but confines it to a safety constraint rather than burying it in a metric.

  You should tell your group that the stalemate is real and justified. The reachability people are hoping for a free lunch that likely does not exist, and the critics are correctly identifying that there is no such thing as a view from nowhere. The way out is to stop trying to prove that the metric is neutral and start trying to prove that the metric is safe despite not being neutral. If you cannot show that the hidden values are safe, you cannot use the metric for safety critical systems. This might feel like a defeat for the low-impact program as originally conceived, but it is progress to recognize that safety properties are themselves value judgments and must be defended as such rather than disguised as geometry.
