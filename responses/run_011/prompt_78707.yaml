answer: |-
  **Exam Question**

  **1.** It is a common misconception that adopting a paraconsistent logic like LP (Logic of Paradox) entails a commitment to dialetheism (the view that there are true contradictions). Critically evaluate this claim by distinguishing between the selection of a **consequence relation** and the assignment of **semantic values**. In your answer, explain how K3 and LP share the same algebraic structure yet differ normatively. Finally, consider a theorist who adopts FDE (First-Degree Entailment) but remains strictly agnostic between gap and glut interpretations. What does this agnosticism cost them regarding (a) the inferences they may validly assert, and (b) the philosophical utility of their semantic models? (20 marks)

  ***

  **Model Answer**

  The claim that adopting a paraconsistent logic necessitates dialetheism confuses the normative role of logic with the metaphysical status of truth. To adopt a logical system is to select a consequence relation—a rule for preserving specific semantic values across an inference. It is not, in itself, to assert that any sentence actually possesses those values. This distinction between the *mechanism* of inference and the *distribution* of truth is the fault line where the misconception arises.

  K3 (Strong Kleene) and LP demonstrate this structural symmetry. Both operate on a three-valued semantics: {1, i, 0}, representing true, indeterminate, and false. The truth-tables for conjunction, disjunction, and negation are identical in both systems. The divergence lies entirely in the set of **designated values**. In K3, only 1 is designated; validity is the preservation of strict truth. In LP, both 1 and i are designated; validity is the preservation of non-falsity (or truth-and-more). Consequently, K3 invalidates the Law of Excluded Middle (since $i$ is not designated), while LP invalidates the Law of Non-Contradiction (since $i$ satisfies both $A$ and $\neg A$). The algebra is neutral; the normativity is not.

  Therefore, adopting LP does not commit one to dialetheism. It merely commits one to the view that *if* a contradiction were true, inference would not trivialize. LP provides a safe container for contradictions, but it does not fill the container. A classical logician can use LP to reason about inconsistent databases without believing the data reflects reality. The commitment is to the *coherence* of the reasoning process, not the *truth* of the premises. Paraconsistency is a property of the consequence relation (failure of Explosion); dialetheism is a metaphysical thesis about the world. One can have the former without the latter.

  This distinction becomes critical when considering the FDE agnostic. FDE combines K3 and LP, allowing values {1, i, 0, b} (where b is both true and false, though often treated simply as allowing both gaps and gluts in the valuation). A theorist who remains agnostic between gaps and gluts accepts the FDE consequence relation (preservation of 1) but refuses to settle whether undefinedness arises from lack of truth (gaps) or excess of truth (gluts).

  This agnosticism incurs significant costs. Regarding **(a) inference**, the agnostic loses the ability to assert classically valid principles as universally binding. They cannot assert $A \vee \neg A$ (rejected by gap models) nor $\neg(A \wedge \neg A)$ (rejected by glut models). More severely, they lose Disjunctive Syllogism. If one is agnostic about whether a premise is a gap or a glut, one cannot rely on the falsity of one disjunct to secure the truth of the other, as the "false" disjunct might be a glut (both true and false), leaving the other disjunct potentially false. The logic becomes purely monotonic and weak; it manages information flow but cannot drive discovery.

  Regarding **(b) semantic utility**, the cost is ontological neutrality. Standard semantics models truth conditions to explain how language hooks onto the world. An agnostic FDE semantics becomes purely structural. It can model consistency and inconsistency, but it cannot explain *why* a sentence fails to have a value. Is it because the world is indeterminate (gap), or because our concepts are overdetermined (glut)? By refusing to choose, the semantic model loses explanatory power. It serves as a map of logical space, but not a guide to metaphysical commitment. The agnostic can define validity, but they cannot use validity to argue for how the world is, only for how our representations must cohere if we refuse to decide on the nature of semantic failure.

  In conclusion, logic dictates what follows from what, not what is the case. Adopting LP licenses reasoning in the presence of contradiction but does not mandate believing in them. The FDE agnostic retains maximal flexibility in modeling but pays for it with inferential weakness and semantic silence.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Distinction between Consequence Relation and Semantic Valuation (4 marks)**
  *   **Must Hit:** Clearly articulate that a logic defines value-preservation (inference), while semantics/ontology defines value-assignment (truth).
  *   **Common Fluff:** Conflating the rules of inference with the nature of reality; treating logic as a description of the world rather than a normative tool.

  **2. K3/LP Structural Identity vs. Normative Difference (4 marks)**
  *   **Must Hit:** Identify that K3 and LP share truth-tables/algebra but differ on which values are "designated" (1 vs. {1, i}).
  *   **Common Fluff:** Claiming K3 and LP have different truth-tables or that LP changes the meaning of negation rather than the designation criteria.

  **3. Paraconsistency $\neq$ Dialetheism (4 marks)**
  *   **Must Hit:** Explicitly state that adopting a paraconsistent logic allows for true contradictions without asserting they exist (instrumentalism vs. realism).
  *   **Common Fluff:** Asserting that using LP *means* you believe in true contradictions; defining dialetheism merely as "accepting LP."

  **4. FDE Agnosticism: Inferential Cost (4 marks)**
  *   **Must Hit:** Explain that agnosticism forces the rejection of classically valid inferences (e.g., Disjunctive Syllogism, LEM, LNC) because the model must accommodate both gaps and gluts.
  *   **Common Fluff:** Claiming the agnostic can still use classical inferences "mostly," or failing to identify specific inference rules that break.

  **5. FDE Agnosticism: Semantic Cost (4 marks)**
  *   **Must Hit:** Argue that agnosticism renders the semantics purely structural/extensional, losing the ability to explain *why* truth-values fail (metaphysical indeterminacy vs. conceptual overdetermination).
  *   **Common Fluff:** Saying the semantics remains "the same" as classical logic, or that agnosticism has no cost to the modeling capability.
