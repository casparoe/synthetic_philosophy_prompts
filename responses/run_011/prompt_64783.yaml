  2.  **Deconstruct the Rousseau/Film Pairing:**

      *   *Claim 1: Pity/Vicarious Emotion.*
          *   Rousseau: Theater arouses pity but discharges it. We cry in the seat, feel virtuous, do nothing in the street.
