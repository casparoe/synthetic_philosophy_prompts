      *   *Best Single Revision:* Reconceptualize "Constitution" in Claim 2. It's not *active reciprocity* that constitutes, but *belonging*. This solves 7 (she belongs even if alone), 5 (dead belong), and helps 1 (belonging is binary, ethical realization is graded).
