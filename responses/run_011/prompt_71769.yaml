answer: |-
  Elias: The consent form must say "the patient." Nadia survives. The process preserves non-branching causal continuity. The shadow window ensures the synthetic unit doesn't just match a design, but matches Nadia's specific neuron at that moment.

  Mara: It must say "a person who will remember." Each handover extinguishes a biological subject and installs a simulator. Doing it billions of times doesn't change the nature of the act.

  Elias: But the rollback provision proves no loss of function or memory. If we rollback at step 500, Nadia remembers the interim. The continuity is unbroken.

  Mara: Rollback shows the biological neuron remains viable in storage, not that experience flowed through the synthetic unit. When the switch flips, the biological locus of experience is silenced. You claim the synthetic unit picks up the "self." I claim it picks up the "behavior."

  Elias: You rely on substrate chauvinism. If the input-output and plasticity are identical, what is left to die?

  Mara: The intrinsic causal power. Metabolic turnover replaces molecules but preserves the dynamic state of the same living system. Here, you swap the system itself. The pseudorandom order prevents localized shock, but it doesn't prevent the cumulative replacement of the subject. It merely hides the boundary.

  Elias: If I accept indeterminacy in borderline cases, I can hold that this specific path—non-branching, calibrated, reversible—is sufficient for identity. It's a fact about the process, not convention.

  Mara: Here is my concession: The shadow window makes the transition functionally invisible. I cannot claim Nadia's behavior changes. But indistinguishability isn't identity. However, I must narrow my claim: I cannot say she dies instantly at step one. The "extinguishing" is a gradual erosion of biological authorship.

  Elias: Then we agree the endpoint is different from the start point?

  Mara: No. I say the person at the end is a successor. You say it's the same person. My account of "extinguished" is this: A biological neuron's output is an expression of its history. A synthetic unit's output is a computation based on received data. Even if identical, the ontological status differs. Metabolic turnover preserves the expression; your protocol replaces the expresser.

  Elias: But the rollback shows the biological neuron could resume. The causal chain wasn't broken, merely suspended.

  Mara: Suspended for the biological unit, yes. But who was conscious during the suspension? If the synthetic unit was conscious, it wasn't Nadia. If it wasn't, there was a gap.

  Elias: I concede that if branching were possible, my "fact about the world" would crumble into convention. But here, uniqueness holds.

  Mara: And I concede that the pseudorandom order prevents us from pinpointing a death moment. But the accumulation remains. So the consent form cannot promise survival. It can only promise continuity of memory.

  Elias: Then we disagree on whether continuity of memory is survival.

  Mara: Precisely. You think it constitutes it. I think it merely simulates it.

  Note:
  There is no broad agreement on identity in replacement cases; this is the central contest in personal identity literature. Elias's "Ontological Realism" (identity as a fact) is a contested minority view against the Parfitian consensus that identity matters less than continuity. Mara's "Biological View" is standard, but her distinction between "expression" and "computation" to dodge the molecular turnover objection is idiosyncratic. Neither speaks as default. Your protocol's "Shadow Window" strengthens psychological continuity arguments but does not resolve the metaphysical dispute; "Rollback" adds a reversibility condition often omitted, favoring Elias. The "Order" feature is functionally relevant but philosophically neutral regarding identity.
