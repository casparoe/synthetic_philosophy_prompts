      *   **Case Details:** Drought-prone country, engineered fungal symbiont for staple grain. Upside: Prevent famine/excess deaths. Downside: Potential recombination into persistent wind-borne pathogen (irreversible, uncontainable). Probability unknown/unbounded. Models unreproducible. Contained trial option exists but delays deployment (causing famine) and has escape risk. Legal context: Constitutional precaution clause vs. Right to food. Supply chain risk (kill-switch micronutrient from foreign supplier).
      *   **Required Sections:**
          *   (a) Numbered section of agreed claims (facts, irreversibility, evidence weight, distinction from known probabilities).
          *   (b) Disagreements table (Question, QPP formulation, DTC formulation, Verdict [Substantive/Verbal] + Reason).
          *   (c) Cruxes (Sub-questions, Test/Evidence, QPP Prediction, DTC Prediction).
          *   (d) Falsifiers (One thing each camp counts as evidence against itself).
          *   (e) Drafter's Addendum (My view: How much is verbal? Which camp survives? Does QPP collapse into decision theory?).
      *   **Constraints:** No polite mush, no "more research needed" hedging, commit to a stance in the addendum, be precise about the QPP vs. Decision Theory collapse question.

  2.  **Deconstruct the Camps:**
      *   **Camp 1 (QPP):** Defends a *qualified* precautionary principle. Key tenets: Serious/irreversible harm + unbounded probability = burden shift. Regulator can use proportionate response (not necessarily ban). "Can't be credibly bounded" is epistemically distinct from "low probability." Supply chain risk makes bounding impossible.
      *   **Camp 2 (DTC/Critics):** Thinks QPP is incoherent/rhetorical. "Can't be bounded" is normative masking. All precautions have risk tails. QPP collapses into decision analysis under ambiguity (maxmin, robustness). Supply chain risk is just another probability/price.

  3.  **Drafting Section (a): Agreed Claims:**
      *   Need to find common ground without resolving the core conflict.
      *   *Fact:* Models are unreproducible.
      *   *Fact:* Famine toll is high; Pathogen risk is irreversible.
      *   *Distinction:* This isn't just "low prob, high impact." It's "unknown prob."
      *   *Irreversibility:* Both agree the pathogen is ecologically irreversible. Do they agree on famine? Famine deaths are irreversible for the individuals, but the *state* can recover. The pathogen changes the baseline permanently. Let's nuance this.
      *   *Evidence Weight:* Both agree unreproducible models carry less weight than empirical data, but disagree on what to do in the absence of data.
      *   *Supply Chain:* Both agree it introduces contingency.

  4.  **Drafting Section (b): Disagreements Table:**
      *   Need to capture the *flavor* of the disagreement.
      *   *Row 1: The nature of the probability gap.* QPP: Epistemic black box. DTC: Ambiguity manageable via priors.
      *   *Row 2: The Supply Chain.* QPP: Political contingency breaks the model. DTC: Just another failure mode with a probability.
      *   *Row 3: Burden of Proof.* QPP: Proponent must prove safety. DTC: Regulator must weigh trade-offs (no automatic shift).
      *   *Row 4: Decision Rule.* QPP: Avoid the unbounded tail unless contained. DTC: Minimize maximum regret/loss (including famine).
      *   *Verdicts:* I need to be honest here. Is it verbal? Often, "unbounded" vs. "very low prior" is verbal. But the *burden shift* is substantive.

  5.  **Drafting Section (c): Cruxes:**
      *   What would change minds?
      *   *Crux 1:* Reproducibility. If an independent lab verifies the kill-switch.
      *   *Crux 2:* Supply Chain Stability. If a treaty guarantees the micronutrient.
      *   *Crux 3:* Trial Data. If the contained trial shows zero escape.
      *   *Predictions:* QPP will say even with verification, the tail remains. DTC will say verification updates the prior enough to proceed.

  6.  **Drafting Section (d): Falsifiers:**
      *   QPP: If the pathogen risk is shown to be physically impossible (not just unlikely).
      *   DTC: If a maxmin strategy leads to catastrophic collapse that a precautionary ban would have avoided.

  7.  **Drafting the Addendum (The TA's Voice):**
      *   *Constraint:* I must commit. Does QPP collapse?
      *   *Analysis:* Sunstein argues PP is incoherent. The QPP defenders say "unbounded" saves it. In decision theory, "unbounded" usually maps to a specific prior distribution (e.g., fat-tailed) or a specific ambiguity aversion coefficient.
      *   *My Stance:* The QPP *mostly* collapses into robust decision-making (maxmin/Info-Gap), *except* for the **procedural burden shift**. The substantive outcome might be the same (e.g., "don't do it"), but the *justification* differs. QPP says "You didn't prove safety." DTC says "The expected utility of 'don't' is higher given the ambiguity."
      *   *However,* the prompt asks me to identify if there is a *genuine residue*. The residue is the **lexical priority** of the irreversible harm. Decision theory trades off famine vs. pathogen. QPP (qualified) says pathogen trumps famine *unless* safety is proven. That is a normative claim, not an epistemic one.
      *   *Verdict:* I will argue the *epistemic* claim collapses (it's just ambiguity), but the *normative* claim (burden shift/lexical priority) is real and distinct from standard CBA.
      *   *Wait, looking closer at the prompt:* "If your view is that the qualified precautionary principle really does collapse into decision theory under ambiguity, say so... if you think there's a genuine residue, name it precisely."
      *   *My decision:* I will argue it *mostly* collapses, but the residue is the **asymmetric evidentiary standard**. Decision theory treats errors symmetrically (Type I vs Type II cost). QPP treats uncertainty asymmetrically (ambiguity counts against the innovator). This is a policy choice, not a mathematical necessity.
      *   *Actually, stronger take:* I'll argue the "unbounded" claim is rhetorical cover for a normative prior. The collapse is real. The "residue" is just political positioning.

      *Refining the Addendum:* I need to be careful not to alienate the students too much, but the prompt asks me to "Commit." I will argue that the QPP's epistemic distinction ("can't be bounded") is mathematically indistinguishable from a fat-tailed prior in a robustness framework. The *only* real difference is the **default rule** (status quo bias). The QPP makes the status quo (no inoculation) the focal point requiring justification to move. Decision theory evaluates both moves. In this specific case (Symbiont), the status quo is famine. So QPP actually favors the *innovation* if the innovation is the "new status quo" to be protected? No, QPP usually protects the *pre-activity* state. Here, pre-activity = famine risk. Post-activity = pathogen risk.
      *   *Correction:* QPP usually says "don't introduce the new risk." So QPP leans toward *rejecting* the symbiont (accepting famine). DTC weighs famine vs. pathogen.
      *   *My Addendum Stance:* The QPP collapses into Maxmin Expected Utility with a specific weighting on the worst-case scenario. The "residue" is rhetorical. The supply chain argument is the strongest point for QPP (political risk is non-stationary), but DTC can model that as high variance. I will conclude the DTC is analytically sharper, but QPP captures a political reality (accountability) that math ignores.
      *   *Wait, I need to pick a winner.* "Which camp's central claim survives." I'll say the Critics (DTC) survive on epistemic grounds, but the QPP survives on *procedural/administrative* grounds.
      *   *Actually, the prompt asks:* "If your view is that the qualified precautionary principle really does collapse into decision theory under ambiguity, say so." I will say **Yes, it collapses**, with one specific exception: the **burden of proof allocation**.

  8.  **Review against Constraints:**
      *   No mush? Check.
