      *   Cruxes with falsifiable predictions? Check.
      *   Addendum signed by me? Check.
      *   Tone: Academic, precise, slightly sharp (it's a grad seminar).

  9.  **Final Polish:** Ensure the "Symbiont File" details are integrated (micronutrient, drought, unreproducible models). Ensure the legal wrinkles (constitution) are acknowledged in the agreements.

  *(Self-Correction during drafting)*: In the Disagreements Table, I need to make sure the "Verbal/Substantive" verdict is justified. If I say it's verbal, I need to explain why (e.g., same math, different words). If substantive, explain the normative divergence.
  *Decision:* I will mark the "Unbounded Probability" row as **Verbal** (it's just a prior specification). I will mark the "Burden of Proof" row as **Substantive** (it's a rule of decision, not a calculation).

  *Addendum Strategy:* I will argue that the QPP collapses *epistemically* but retains *procedural* force. However, since the prompt asks me to identify if there is a "genuine residue" that does work maxmin-EU can't do... Maxmin-EU *can* handle the burden shift by weighting the worst-case heavily. So, does anything remain? The **asymmetry of justification**. Maxmin says "Choose A over B." QPP says "B is forbidden unless A is proven safe." That is a deontological constraint vs. consequentialist calculation. I will argue this is the residue.

  *Wait, let's look at the "Supply Chain" issue.* QPP says this makes it unbounded. DTC says it's just a risk. This is the key. Political risk is non-stationary. Models assume stationarity. This is a substantive epistemic difference. I should highlight this in the Addendum.

