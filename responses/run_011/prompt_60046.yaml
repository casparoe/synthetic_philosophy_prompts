          *   *Analysis:* If you charge no real interest and have a write-off, the state is subsidizing the cost of capital and the non-payers. In a low-interest environment, this might be small. In a high-interest environment, this is huge. If the subsidy is large, does the graduate still carry "most" of the cost? Possibly not. If the RPI is high and the loan is interest-free, the subsidy is massive. This challenges (a).

