      *   *Refining the Big Contradiction: (e) vs. (h).*
          *   (e) is a distributional argument based on *actual* socioeconomic status of graduates vs. non-graduates (ex post).
          *   (h) explicitly rejects evaluating based on "who actually ended up paying what" (ex post).
          *   You can't use ex post data to justify the system if your methodological rule is ex ante.
          *   *Resolution:* Either drop (h) or reframe (e) as an ex ante risk calculation (unlikely to work for regressivity) or admit (h) applies to efficiency/insurance but (e) applies to equity.

      *   *Refining the Second Contradiction: (a) vs. (d).*
          *   (a) Graduate pays *most* cost.
          *   (d) No real interest.
