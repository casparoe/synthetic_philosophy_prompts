      *   *Better Analogy:* **Computability relative to an Oracle**. Or **Visibility in a limited horizon**. The "Skolemite predicament" is about *expressive poverty*, not ontological symmetry.

  9.  **Refining the "Settled vs. Contested" Constraint:**
      *   Must be careful not to say "Realism is true." Say "Realism is the working assumption of most set theorists."
