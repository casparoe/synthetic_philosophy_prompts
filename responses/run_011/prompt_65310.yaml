answer: |-
  # FINAL EXAMINATION: DECISION THEORY AND PHILOSOPHY OF ECONOMICS
  **Time Allowed:** 3 Hours  
  **Instructions:** Answer all four parts. Calculators are permitted; notes and textbooks are not. Show all working. Marks are allocated for computational accuracy and conceptual clarity.

  ### Case: The Coastal Transmission Authority

  A coastal transmission authority must choose between a **Standard** reinforcement program and an **Experimental** modular barrier program before a forecast storm season. The state space is partitioned into three events by how the storm track develops:
  *   $E_1$ (Probability 0.89): System passes north of the estuary.
  *   $E_2$ (Probability 0.10): Moderate direct hit.
  *   $E_3$ (Probability 0.01): Extreme direct hit.

  Benefits are measured in millions of dollars of avoided damage. Utility is linear in dollars, so the three possible utility levels are **0, 10, and 50**, with 0 being the worst outcome.

  **Problem 1 (Main Grid):**
  *   **Standard:** Yields 10 on every event ($E_1, E_2, E_3$).
  *   **Experimental:** Yields 10 on $E_1$, 50 on $E_2$, and 0 on $E_3$.

  **Problem 2 (Pumping Station):**
  *   **Standard:** Yields 0 on $E_1$, 10 on $E_2$, and 10 on $E_3$.
  *   **Experimental:** Yields 0 on $E_1$, 50 on $E_2$, and 0 on $E_3$.

  The authority's risk function is $r(p) = p^3$. You should use the following risk-weighted expected utility (REU) functional, where outcomes are ordered $x_1 < x_2 < \dots < x_n$:
  $$ REU = u(x_1) + \sum_{i=2}^n r(P(X \ge x_i)) \cdot [u(x_i) - u(x_{i-1})] $$

  **(a) [8 marks]** Compute the Expected Utility (EU) and Risk-Weighted Expected Utility (REU) for all four acts (Standard and Experimental in both Problems). State the resulting preference pattern for the authority under REU.

  **(b) [7 marks]** Show that this preference pattern cannot be represented by any Expected Utility maximizer, regardless of how concave their utility function is. Explain precisely where risk aversion "lives" in a rank-dependent model like REU as opposed to a curvature-of-utility model.

  **(c) [7 marks]** Show that a milder weighting function $r(p) = p^2$ fails to generate the authority's pattern, as does a sufficiently steep one such as $r(p) = p^{20}$. Determine the full range of exponents $k$ for which $r(p) = p^k$ reproduces the pattern.

  **(d) [8 marks]** Suppose the authority faces the Problem 1 choice in each of two independent years. They must either commit now to a two-year program or decide afresh each year. Derive the distribution of the two-year totals for the Experimental program and compute the REU of this two-year package. Compare this with twice the REU of the one-year act. What happens as the number of years grows? Is this long-run objection fatal to the theory? Finally, state which of Savage's axioms the authority's pattern violates and what structure the theory retains.

  ***

  # MODEL ANSWER

  **(a) Computations and Preference Pattern**
  First, we order outcomes from worst to best to apply the cumulative probability formula.
  **Problem 1 Standard:** Outcome is 10 with probability 1.
  $EU = 10$. $REU = 10$.

  **Problem 1 Experimental:** Outcomes are 0 ($E_3$), 10 ($E_1$), 50 ($E_2$).
  Probabilities: $P(X \ge 0) = 1$; $P(X \ge 10) = 0.89 + 0.10 = 0.99$; $P(X \ge 50) = 0.10$.
  $EU = 0.01(0) + 0.89(10) + 0.10(50) = 8.9 + 5 = 13.9$.
  $REU = 0 + (0.99)^3(10 - 0) + (0.10)^3(50 - 10)$
  $REU = 0.970299(10) + 0.001(40) = 9.70299 + 0.04 = 9.743$.
  **Preference 1:** Standard (10) > Experimental (9.743).

  **Problem 2 Standard:** Outcomes are 0 ($E_1$), 10 ($E_2, E_3$).
  Probabilities: $P(X \ge 0) = 1$; $P(X \ge 10) = 0.10 + 0.01 = 0.11$.
  $EU = 0.89(0) + 0.11(10) = 1.1$.
  $REU = 0 + (0.11)^3(10 - 0) = 0.001331(10) = 0.01331$.

  **Problem 2 Experimental:** Outcomes are 0 ($E_1, E_3$), 50 ($E_2$).
  Probabilities: $P(X \ge 0) = 1$; $P(X \ge 50) = 0.10$.
  $EU = 0.90(0) + 0.10(50) = 5$.
  $REU = 0 + (0.10)^3(50 - 0) = 0.001(50) = 0.05$.
  **Preference 2:** Experimental (0.05) > Standard (0.01331).

  **Pattern:** In Problem 1, the authority prefers the Safe act. In Problem 2, the authority prefers the Risky act.

  **(b) EU Impossibility and Location of Risk**
  Let $u(0)=0, u(10)=1, u(50)=v$.
  Problem 1 (Safe > Risky): $1 > 0.89(1) + 0.10v + 0.01(0) \Rightarrow 0.11 > 0.10v \Rightarrow v < 1.1$.
  Problem 2 (Risky > Safe): $0.10v + 0.01(0) > 0.11(1) \Rightarrow 0.10v > 0.11 \Rightarrow v > 1.1$.
  These conditions ($v < 1.1$ and $v > 1.1$) are contradictory. No utility function, concave or otherwise, can represent this pattern because EU satisfies the Independence axiom, which this pattern violates.

  In EU theory, risk aversion lives entirely in the curvature of $u$ (diminishing marginal utility). In REU, $u$ measures pure value (linear here), while risk attitude lives in the transformation of cumulative probabilities via $r(p)$. The agent downweights the probability of doing better than the worst case. This allows different attitudes toward risk depending on the rank of the outcomes, which EU cannot do.

  **(c) Exponent Range**
  We require $r(p) = p^k$.
  **Condition 1 (Problem 1):** $10 > 10(0.99)^k + 40(0.10)^k \Rightarrow 1 > 0.99^k + 4(0.1)^k$.
  If $k=2$: $0.9801 + 0.04 = 1.0201 > 1$. Fails (prefers Risky).
  If $k=20$: $0.99^{20} \approx 0.817$; $4(0.1)^{20} \approx 0$. Sum $< 1$. Passes P1.
  **Condition 2 (Problem 2):** $50(0.10)^k > 10(0.11)^k \Rightarrow 5 > (1.1)^k$.
  If $k=2$: $1.1^2 = 1.21 < 5$. Passes P2.
  If $k=20$: $1.1^{20} \approx 6.72 > 5$. Fails (prefers Safe).

  To find the range:
  From P2: $k < \log_{1.1}(5) \approx 16.88$.
  From P1: We need $0.99^k + 4(0.1)^k < 1$.
  At $k=2$, LHS = 1.02. At $k=3$, LHS = $0.9703 + 0.004 = 0.9743$.
  Solving $0.99^k + 4(0.1)^k = 1$ numerically yields $k \approx 2.3$.
  **Valid Range:** $2.3 \lesssim k \lesssim 16.9$.
  The milder function ($k=2$) fails to be risk-averse enough in Problem 1. The steeper function ($k=20$) is too risk-averse in Problem 2, crushing the small probability of gain too heavily.

  **(d) Aggregation and Long Run**
  **Two-Year Experimental Distribution:**
  Outcomes (Sum): 0, 10, 20, 50, 60, 100.
  Probabilities:
  $P(0) = 0.01^2 = 0.0001$.
  $P(10) = 2(0.01)(0.89) = 0.0178$.
  $P(20) = 0.89^2 = 0.7921$.
  $P(50) = 2(0.01)(0.10) = 0.002$.
  $P(60) = 2(0.89)(0.10) = 0.178$.
  $P(100) = 0.10^2 = 0.01$.

  Cumulative Probabilities ($P(X \ge x)$):
  $\ge 0: 1$.
  $\ge 10: 0.9999$.
  $\ge 20: 0.9821$.
  $\ge 50: 0.1900$.
  $\ge 60: 0.1880$.
  $\ge 100: 0.0100$.

  $REU_{2yr} = 0 + 10(0.9999)^3 + 10(0.9821)^3 + 30(0.19)^3 + 10(0.188)^3 + 40(0.01)^3$.
  $REU_{2yr} \approx 10 + 9.47 + 0.21 + 0.07 + 0 = 19.75$.
  Twice the one-year REU: $2 \times 9.743 = 19.486$.
  $REU_{2yr} > 2 \times REU_{1yr}$. The functional is non-additive; bundling reduces relative risk.

  **Long Run:** As $n \to \infty$, the distribution of the average converges to the EU mean (13.9) by the Law of Large Numbers. The variance shrinks relative to the mean. Consequently, the REU valuation converges to the EU valuation. The agent who rejects the single Experimental act (REU 9.74 < 10) will eventually accept the n-year package (Mean 13.9n > 10n).
  **Objection:** This is not fatal to the theory, but fatal to using REU for long-run strategic planning without re-evaluation. REU is a theory of choice under risk for specific objects of choice. If the object changes from "one season" to "decade portfolio," the risk profile changes legitimately.
  **Axioms:** The pattern violates **Independence** (Sure Thing Principle). It retains **Ordering** and **Continuity**.

