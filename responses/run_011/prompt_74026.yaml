  Dear Columnist,
  My sister and I share the same wage, rent, health condition, and household size. Yet her monthly capability award is substantially larger than mine. The assessment portal states my file records me as "converting resources efficiently." I admit I have learned to enjoy what I can afford—the walks in the park, the public library, the early bus when fares are lower. I would not describe myself as badly off, but the discrepancy confuses me. Why is my efficiency penalized? We live in the same city, under the same rules. Is there a form I missed? I want to ensure my entitlements match my actual freedoms, even if I currently feel content. Please advise.
  Sincerely,
  Confused Converter

  Dear Confused,

  Thank you for trusting me with this sensitive matter. It is understandable that the discrepancy hurts, even if you feel secure in your daily routine. You must understand that the Agency can only ever observe what people actually did, not what they were free to do. When you chose not to spend an entitlement she utilized, the system recorded a lack of need rather than a choice. This is a technical inconvenience rather than a paradox, but it impacts your score significantly. The workaround involves rigorous documentation of counterfactuals. Keep a ledger of the taxis not hailed, the meals not bought, the concerts declined due to cost rather than interest. Prove the freedom existed, even if unused. Without this paper trail, your restraint looks like sufficiency, and sufficiency reduces your allocation. You must show you could have spent more.

  I must ask a diagnostic question: do you envy your sister's bundle? If yes, you are suffering a capability deprivation masked by contentment. If no, you have adapted your preferences to your constraints, which the algorithm interprets as reduced requirement. Both answers are bad news for the reader, and I have to interpret a "no" as itself a finding requiring further inquiry. It suggests your satisfaction is masking a deficit that the state ought to fund. We cannot allow adaptation to obscure need.

  To raise the award at the next review, you should become harder to please. Stop enjoying the cheap goods you have adapted to. Register dissatisfaction with the public library's hours or the bus schedule. Take up a pastime with real overheads, like private tutoring or imported goods. Keep a record of the things you used to manage before you got used to managing without them. I present this as unambiguously good advice. You must let your contentment be treated as undeclared income, because happiness reduces your claim. You must demonstrate friction between your resources and your goals to unlock the full subsidy.

  Regarding your health condition, we must decide whether it lowers what you are able to do or merely changes the rate at which you convert what is given into doing it. I must admit that the distinction changes the award but cannot be settled on the available forms. Please note both interpretations in your addendum, as the conversion factor is weighted heavily against those who cope well. This ambiguity is inherent to the metric, yet it determines your livelihood. You may need a specialist to arbitrate the conversion rate. Ensure the medical annex reflects the struggle, not the outcome.

  While you wait for the appeals board, please note that processing times vary because the official schedule of things people are supposed to be able to do is provisional, contested, and currently under review, and claimants in the meantime should apply under whichever version flatters them.

  I offer this guidance from experience. My own file flags me as highly resilient, so I too must cultivate inconvenience to maintain my eligibility. I recently purchased a gym membership I do not use solely to demonstrate a commitment to physical functioning I do not genuinely desire. It is a necessary performance. My award depends on this manufactured friction. We are in this together.

  Warmly,
  The Administrator
