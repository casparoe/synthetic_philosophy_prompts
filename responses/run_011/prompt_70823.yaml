         If P2 plays P at 4: Payoff (6, 5). P1 gets 6. $6 > 2$. P1 deviates.
      So the NE profiles are:
      1. P1: (T, *), P2: (T, *). (4 profiles). P1 takes at 1. P2 takes at 2. (Node 3, 4 actions don't matter for payoff, but must be specified).
         Wait, if P2 plays T at 2, Node 3 is not reached. So P1's action at 3 doesn't matter for the deviation check either.
         So if P2 plays T at 2, P1(T, T) and P1(T, P) are both BR.
         And P2(T, T) and P2(T, P) are both BR (since Node 2 not reached).
         So there are $2 \times 2 = 4$ NE where P2 takes at 2.
      2. P1: (T, P), P2: (P, T).
         P1 takes at 1. P2 passes at 2. P1 passes at 3. P2 takes at 4.
         Deviation check P1: Pass at 1 $\to$ P2(P at 2) $\to$ P1(P at 3) $\to$ P2(T at 4) $\to$ (2, 8). P1 gets 2. Indifferent. OK.
      3. Are there others?
         If P2 plays (P, P). P1 deviates to P at 1 $\to$ ... $\to$ (6, 5). P1 gets 6. Deviates. Not NE.
         If P1 plays (T, T) and P2 plays (P, T).
         P1 deviates to P at 1 $\to$ P2(P at 2) $\to$ P1(T at 3) $\to$ (4, 2). P1 gets 4. Deviates. Not NE.
      So there are exactly 5 Nash Equilibrium profiles.
      1. P1(T, T), P2(T, T) [SPE]
      2. P1(T, P), P2(T, T)
      3. P1(T, T), P2(T, P)
      4. P1(T, P), P2(T, P)
      5. P1(T, P), P2(P, T)
