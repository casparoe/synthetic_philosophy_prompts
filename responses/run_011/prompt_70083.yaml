answer: |-
  You are quite right to be suspicious of that final sentence, and indeed your intuition serves you well here because that is precisely where the author has slipped from fair interpretation into straightforward error. It is a shame, because the preceding paragraphs are actually a reasonably competent summary of a difficult position, but that last claim about the messianic age undermines the credibility of the whole passage. If you were to show this to a serious Maimonides scholar, they would nod along with most of the setup regarding the Guide for the Perplexed, but they would stop short at the assertion that sacrifices are permanently abolished. To answer your specific worry, yes, Maimonides explicitly states in his legal code, the Mishneh Torah, that in the messianic era the Temple will be rebuilt and the sacrificial order will be reinstated. He does not drop the business; he codifies it in great detail in the Book of Service and reaffirms it in the Laws of Kings. So, on that specific factual point, the book is wrong, and you are not misremembering.

  However, before we write the book off entirely, it is worth distinguishing between the author's factual error and the philosophical tension they are trying to describe. The earlier part of the passage, regarding the concession theory, is a fair representation of what Maimonides argues in the third part of the Guide. He does indeed posit that the sacrificial cult was not the primary intention of the divine law but rather a secondary accommodation to the historical reality of the Israelites, who were surrounded by idolatrous cultures accustomed to worshipping through sacrifice. The analogy the author cites, comparing the transition away from sacrifice to asking people today to abandon prayer for silent thought, is genuinely Maimonidean. He argues that human nature cannot make a sudden leap from one extreme to another, so God permitted the form of sacrifice to remain while radically altering its content, restricting it to one place and directing it solely to Himself. So, when the author says Maimonides was the first to say this out loud, that is largely acceptable, though one might quibble that earlier thinkers hinted at it more strongly than the author allows. The claim that God has no need of meat and blood is standard prophetic theology which Maimonides systematises, so that is fair enough.

  Where the author becomes problematic is in sliding from the claim that sacrifices were a historical concession to the claim that they have no value in themselves and are therefore dispensable. This is the crux of your question about whether those are distinct claims. For Maimonides, they are distinct, but the author conflates them. Maimonides holds that while the *reason* for the commandment was pedagogical and historical, the *obligation* remains binding because it is a divine command. In Jewish law, the reason for a commandment does not nullify the commandment itself. So, Maimonides can consistently hold that sacrifices were instituted to wean people off idolatry while maintaining that they are still required whenever the Temple stands. To say they have no value in themselves is slightly misleading; they have value as acts of obedience and as part of the divine structure of worship, even if they are not the ideal form of worship in a philosophical sense. The ideal for Maimonides is intellectual apprehension of God, but he never suggests that the law can be set aside because we have achieved a higher philosophical understanding. The author seems to imply that because the historical reason is obsolete, the law is obsolete, but Maimonides does not draw that conclusion for the present or the immediate future.

  This brings us to the messianic error. The author suggests Maimonides was too much of a rationalist to suppose sacrifices would return. This assumes that Maimonides' rationalism leads to the abolition of ritual, but for Maimonides, rationalism leads to the understanding that ritual serves a function in stabilising society and directing the mind, even if the ultimate goal is intellectual. There is a famous tension here between the Guide and the Code, and later interpreters have spent centuries trying to reconcile them. Some suggest that perhaps in the messianic age human nature will have changed sufficiently that sacrifices won't be needed, but Maimonides' text in the Code does not say that. He writes clearly that the sacrifices will resume. Some modern scholars argue that Maimonides might have been esoteric here, hiding his true belief that sacrifices would end in the Code while hinting at their end in the Guide, but that is speculation. On the plain text, the author of your book is incorrect to say the Code drops the business.

  Regarding your question on whether the argument collapses if his historical picture is shaky, the answer is that the specific details might wobble, but the general principle can stand. Maimonides relied on the knowledge available to him about the Sabians and pagan practices of antiquity. Modern scholarship might dispute the accuracy of his anthropological data regarding exactly what those neighbours were doing. However, the philosophical core of the concession theory does not rest entirely on the specific historical accuracy of every pagan rite. It rests on the psychological and sociological insight that religious habits are hard to break and that transition requires continuity. Even if Maimonides was wrong about the specific pagan rituals, his point that God accommodates human developmental stages remains a coherent theological position. So the concession thesis does not necessarily collapse, though its evidential basis might look dated.

  You also asked about Nahmanides, and this is highly relevant because his critique goes to the heart of the value question. Nahmanides, writing a generation later, objected strongly to the idea that sacrifices were merely a concession to idolatry. He argued that if that were true, it would imply that the ideal state of humanity is one without sacrifice, yet the Bible records sacrifices being offered by Abel and Noah long before the Israelites were in Egypt or surrounded by pagan idolatry. For Nahmanides, sacrifices have an intrinsic spiritual utility; they are not just a historical workaround but a metaphysical necessity for drawing down divine influence and effecting atonement. He felt that Maimonides' view reduced the commandments to mere history lessons rather than eternal spiritual tools. This objection highlights the distinction you spotted in the text: for Nahmanides, sacrifices have value in themselves, whereas for Maimonides, their value is instrumental and obediential. The author of your book sides with Maimonides on the history but fails to recognise that Maimonides still mandates the practice, whereas Nahmanides mandates it for a different reason.

  So, does the author's overall conclusion survive? The conclusion that Maimonides was a rationalist in halakhic dress who didn't really believe in the cult is too strong and ultimately distorted by that final error. It is more accurate to say Maimonides believed in the cult as a divinely mandated institution that served a specific historical and pedagogical purpose, which remains binding until God dictates otherwise. He did not view the sacrifices as the highest form of worship, preferring prayer and intellectual contemplation, but he did not view them as disposable errors. The author has conflated Maimonides' explanation of the origin of the laws with a prediction of their end. If you correct that final sentence, the passage becomes a acceptable, if slightly simplified, overview of the Guide's position. As it stands, however, it misrepresents Maimonides' legal stance on the future, which is a significant distortion. You are right to hesitate over it, and while the book might still be useful for the earlier sections, you should treat its claims about the messianic age and the legal code with considerable caution. It is not entirely sloppy, but on this specific point, it has prioritised a neat narrative over the textual evidence.
