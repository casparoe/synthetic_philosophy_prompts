  Right, so I've been working through a popular survey of medieval Jewish philosophy — not an academic monograph, more of a well-reviewed book by someone who lectures in religious studies — and there's a section on Maimonides and the sacrificial cult that's left me genuinely unsure what to believe. Here's the passage in question:

  'Maimonides was the first thinker to say out loud what the prophets had only ever hinted at: God has no need of meat and blood, so the sacrificial cult cannot have been the point of the Torah. The sacrifices were a concession — a piece of divine patience with a people fresh out of Egypt who knew no other way to worship at all. In his great philosophical work he argues that the Israelites could no more have been expected to give up sacrifice overnight than we could be expected today to give up prayer and serve God by silent thought alone, so God allowed them to keep the form while forbidding them to direct it at anything but Himself. He then works through the details of the sacrificial rules, showing how particular prohibitions were aimed at specific pagan practices. It follows that sacrifices have no value in themselves whatever; they were a temporary device for weaning a primitive people off idolatry. Maimonides was far too much of a rationalist to suppose they would ever come back, which is why the legal code he wrote for everyday use simply drops the whole business when it gets to the messianic age.'

  That last sentence sounds dodgy to me. I'm fairly sure I've come across somewhere that his code actually says the messianic king will rebuild the Temple and the sacrifices will be offered again, which would be pretty awkward for the author — but I might be misremembering, and I don't want to write the book off as sloppy just because it says something I'd rather it didn't. So could you work through the passage bit by bit and tell me what a serious Maimonides scholar would happily nod along to, what they'd accept as a fair simplification, and what is straightforwardly wrong? I'm particularly interested in whether 'no value in themselves' and 'a temporary device' are really two distinct claims that the author is sliding between. Even if the sacrifices were instituted as a concession to the habits of the time, does that make them dispensable now, or can Maimonides consistently hold both that this is why they were commanded and that they remain binding? And seperately: if his historical picture of what the surrounding nations actually did is now thought to be shaky, does the argument collapse, or can the concession thesis stand on its own without the history? My tutor once mentioned that Nahmanides had a real go at him over exactly this, so if that's relevant I'd like to know what the objection actually was, since the book doesn't mention it at all. And does the author's overall conclusion — that Maimonides was a rationalist in halakhic dress who didn't really believe in the cult — survive once the passage is corrected, or does it depend on the bits that dont hold up?

  British English please, and could you write it as continuous prose, the way you'd write a letter or a long email — no headings, no bullet points, no bold, no tables. And dont bother with citations or a reading list, I'm not chasing references, I just want your own assessment of what's fair and what isn't.
