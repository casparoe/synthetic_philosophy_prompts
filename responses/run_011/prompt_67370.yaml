  Okay, take a breath. Put the coffee down before you spill it on your notes. It's 2am, the quals are tomorrow, and you're staring at a wall of modal intuitions. This is exactly where metaphysics gets fun, because the textbook definitions break down and you have to look at the *pressure points* in the data.

  You've got seven data points from V. They look consistent, but Item 5 is the crack in the dam. And that seminar guy is noise—mostly. Let's treat this like a theory construction problem. We need to find the theoretical "packages" that make 1–7 cohere, and then see how they break on your fission case.

  Grab a fresh sheet of scrap paper. Here's how I'm parsing the data before we build the models.

  ### The Scrap Paper Phase: Parsing the Data

  *   **1, 4, 6:** She's a **Concrete Modal Realist**. Worlds are flesh-and-blood, "actual" is indexical, and she's a realist about her ontology (no "just a fiction"). This is pure Lewis.
  *   **2:** **No Impossible Worlds.** The pluriverse is the set of *consistent* worlds. This rules out paraconsistent logic or "impossible world" semantics.
  *   **3:** **Necessity of the Pluriverse.** The set of worlds is fixed. Contingency is just which world we're in (indexical) or what's inside them. But note the gloss: "what could have been isn't capped by the contents of *our* world." This is crucial. It means possibility is defined by the *existence* of other worlds, not by rearranging our own.
  *   **7:** **Principle of Recombination.** Anything can coexist with anything (size permitting). This is the engine that generates the worlds.
  *   **5:** **The Problem Child.** "Humphrey might have won." True. But is it *him*? She refuses to rule. Calls it "how the words go."
      *   *Standard Lewis:* Says "False, it's a counterpart."
      *   *Transworld Identity:* Says "True, it's literally him."
      *   *V:* Says "True (sentence), but the 'is it him' part is linguistic."

  This refusal in (5) is the key. It suggests she might separate the *metaphysics* (there is a world with a Humphrey-like winner) from the *semantics* (does the name 'Humphrey' reach across worlds?).

  ### (b) The Candidate Packages

  Here are the three packages that can generate 1–7. They all agree on the worlds; they disagree on the *people* in them.

  #### Package 1: Orthodox Lewisian (Counterpart Theory)
  *   **Metaphysics:** Individuals are **world-bound**. You exist only here. Other worlds contain your *counterparts* (similar entities).
  *   **How it fits 1–7:**
      *   Fits 1, 4, 6, 7 perfectly (this is Lewis's home turf).
      *   Fits 2 (worlds are consistent; no individual has contradictory properties because no individual is in two worlds).
      *   Fits 3 (Pluriverse is fixed; recombination generates the counterparts).
      *   **Fits 5:** This requires a slight read. Lewis usually insists on the counterpart distinction. But V's irritation ("question about how the words go") suggests she treats Counterpart Theory as the *technical cashing-out* of modal claims, while admitting ordinary language is loose. She says "Humphrey might have won" is True because the *proposition* is true (there is a winning counterpart), even if the strict identity claim is false.
  *   **Prediction on Fission:**
      *   *Sentence:* "There could have been two of me."
      *   *Verdict:* **True** (on the standard modal reading).
      *   *Follow-up:* "How many of you are there in that world?"
      *   *Answer:* **"Strictly speaking? Zero. You are world-bound. But there are two people there who are your counterparts."**

  #### Package 2: Modal Realism with Transworld Identity (The "Smeared" View)
  *   **Metaphysics:** Individuals are **transworld**. You are a "space-time-world worm." You have parts in different worlds, just like you have parts at different times.
  *   **How it fits 1–7:**
      *   Fits 1, 4, 6, 7.
