prompt: |-
  I am preparing a short seminar presentation on the socialist calculation debate for a philosophy-of-economics reading group. The edited volume on twentieth-century economic thought I have been working from opens its chapter on the debate with the following paragraph, which I had planned to use as my framing:

  "The socialist calculation debate was settled by Oskar Lange. In 1920 Ludwig von Mises had announced that socialism is impossible: with public ownership of the means of production there are no market prices for capital goods, so a planning board cannot know whether it is squandering steel or using it well, and even if it somehow had the data it could never solve the millions of simultaneous equations that describe an economy. Lange's reply, published in the 1930s, was that Mises had confused a practical difficulty with a theoretical impossibility. The equations do have a solution, and a socialist board can find it by trial and error: announce a set of accounting prices, observe the resulting surpluses and shortages, and revise until supply matches demand in every market. Managers are instructed to produce where marginal cost equals the announced price and to minimize average cost, so the whole system behaves exactly as a competitive market would, with the bonus that the board, unlike private capitalists, can also suppress monopoly and unemployment. Hayek's celebrated response in 'The Use of Knowledge in Society' did not dispute any of this. He conceded the theory and argued instead that the relevant knowledge is dispersed and largely tacit, so no board could ever gather it in time to be useful. What was left of the Austrian case was therefore an objection about incentives: planners and managers have no stake in the outcome, and the system decays through laziness and concealment. History vindicated that practical conclusion but not the argument, since nothing in Lange's scheme was theoretically incoherent, and the failures of the actually existing planned economies, which became impossible to dismiss after 1989, were failures of implementation."

  My instinct is that this is broadly fair, and I am sympathetic enough to the market-socialist side that the paragraph gives me a story I would like to tell. But two things nag at me. I associate the phrase "tacit knowledge" with Michael Polanyi rather than with Hayek, and I cannot tell whether the chapter is borrowing another author's concept and passing it off as Hayek's or whether that is my misremembering. And the confident verdict that the debate was settled on theory and lost only on practice does not square with the fact that people whose judgment I trust still argue about it.

  Could you audit the paragraph claim by claim? For each substantive assertion, tell me whether it is accurate, whether it is a defensible simplification, or whether it is wrong or misleading, and where it is wrong, tell me both what a careful defender of Mises or Hayek would object to and what a careful defender of Lange and Lerner would object to, since I do not want to replace an Austrian caricature with a socialist one. I am especially interested in these questions:

  - Does the paragraph state Mises's thesis at the right level of generality, and does it capture the scope conditions Mises himself attached to the argument, including what he conceded about a socialist commonwealth embedded in a wider world market?
  - Are the missing-prices point and the cannot-solve-the-equations point the same argument or two different ones, and does the paragraph's compression of them into a single claim matter?
  - Is the "practical difficulty versus theoretical impossibility" move correctly assigned to Lange as his answer to Mises, or does the paragraph relocate a concession that belongs to a different author at a different date?
  - Does it describe Lange's mechanism accurately, and does it omit anything whose absence changes the story? I have a dim memory that a formal solution for a collectivist ministry of production predates Mises's article, and that the marginal-cost rule is often credited to two people rather than one.
  - Is the attribution of "tacit" knowledge to Hayek fair? More importantly, does rendering the knowledge argument as information that exists but cannot be gathered in time preserve what Hayek was claiming, or does it downgrade a claim about the character of the knowledge and the process that uses it into a claim about administrative latency?
  - Is it fair to say the residue of the Austrian case was an objection about laziness and concealment? What work do residual claimancy, rivalry, and entrepreneurial discovery do here, and would an Austrian accept the incentive framing as a statement of their point?
  - Once the paragraph is corrected, does the closing verdict survive? Is the split between conclusion and argument even coherent in this case, or does the correction collapse it?

  Then please rewrite the paragraph at roughly the same length in a form a historian of economic thought would be willing to sign off on, and point out any sentences in my proposed framing that I should not repeat in a seminar because they depend on contested readings. I am not asking for citations, a bibliography, or a reading list, and you do not need to reproduce exact wording from any of the texts involved; I want your judgment about the substance. Where you are genuinely unsure of an attribution or a date, say so plainly rather than filling the gap.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Preparing a seminar presentation on the Socialist Calculation Debate (SCD) for a philosophy-of-economics reading group.
      *   **Input:** A specific introductory paragraph from an edited volume on 20th-century economic thought.
      *   **Task:** Audit the paragraph claim-by-claim for accuracy, defensibility, and potential bias (both Austrian and Socialist). Address specific questions about Mises, Lange, Hayek, incentives, and the final verdict.
      *   **Output:**
          1.  Claim-by-claim audit (Accurate/Defensible/Wrong/Misleading).
          2.  Specific answers to the user's bulleted questions.
          3.  A rewritten paragraph (historian-approved).
          4.  Identification of sentences to avoid in the seminar.
      *   **Constraints:** No citations/bibliography needed. Be plain about uncertainty. Maintain roughly the same length for the rewrite.

  2.  **Initial Assessment of the Input Paragraph:**
      *   *Tone:* Confident, decisive ("settled by Oskar Lange," "History vindicated that practical conclusion").
      *   *Perspective:* Leans heavily towards the Lange-Lerner market socialism view, minimizing the Austrian critique to "incentives" and "implementation."
      *   *Potential Issues:*
          *   "Settled by Lange" is highly contested.
          *   Mises's 1920 argument is often conflated with Hayek's 1930s/40s argument.
          *   "Tacit knowledge" is Polanyian, though Hayek uses similar concepts ("knowledge of time and place").
          *   The reduction of the Austrian critique to "laziness/concealment" (incentives) ignores the *entrepreneurial discovery* aspect.
          *   The claim that Hayek conceded the theory is a specific interpretation (the "neoclassical synthesis" view) that many Austrians reject.

  3.  **Claim-by-Claim Audit:**

      *   *Claim 1: "The socialist calculation debate was settled by Oskar Lange."*
          *   *Verdict:* Misleading/Contested.
          *   *Reasoning:* Many economists (especially Austrians, but also modern mechanism design theorists) argue it wasn't settled. Lange won the *neoclassical* debate, but the *Austrian* debate continued.
      *   *Claim 2: "In 1920 Ludwig von Mises had announced that socialism is impossible..."*
          *   *Verdict:* Accurate enough (refers to "Economic Calculation in the Socialist Commonwealth").
          *   *Nuance:* Mises argued rational calculation is *impossible*, not just difficult.
      *   *Claim 3: "...no market prices for capital goods... planning board cannot know whether it is squandering steel..."*
          *   *Verdict:* Accurate representation of Mises's price signal argument.
      *   *Claim 4: "...even if it somehow had the data it could never solve the millions of simultaneous equations..."*
          *   *Verdict:* Misleading attribution. This is often associated with Hayek or Robbins later, or the general equilibrium context. Mises focused on the *absence* of prices, not the *math* of solving equations. Lange attacked the equation argument, but Mises didn't primarily make the "math is too hard" argument in 1920.
      *   *Claim 5: "Lange's reply... Mises had confused a practical difficulty with a theoretical impossibility."*
          *   *Verdict:* Defensible simplification of Lange's 1936/37 papers.
      *   *Claim 6: "The equations do have a solution, and a socialist board can find it by trial and error..."*
          *   *Verdict:* Accurate description of Lange's "trial and error" mechanism.
      *   *Claim 7: "Managers are instructed to produce where marginal cost equals the announced price..."*
          *   *Verdict:* Accurate (Lange-Lerner rule).
      *   *Claim 8: "Hayek's celebrated response... did not dispute any of this. He conceded the theory..."*
          *   *Verdict:* Highly Contested. This is the "Neoclassical Synthesis" reading (e.g., Lavoie vs. Bergson). Austrians argue Hayek did *not* concede the theoretical possibility of equilibrium, but rather challenged the *assumptions* required for that equilibrium to be relevant (the knowledge problem).
      *   *Claim 9: "...argued instead that the relevant knowledge is dispersed and largely tacit..."*
          *   *Verdict:* "Tacit" is Polanyi, but Hayek speaks of "knowledge of particular circumstances of time and place." The *substance* is close, but the terminology is anachronistic/imprecise.
      *   *Claim 10: "What was left of the Austrian case was therefore an objection about incentives: planners and managers have no stake in the outcome..."*
          *   *Verdict:* Misleading/Reductionist. This reduces the Austrian critique to a principal-agent problem. Austrians emphasize *entrepreneurial discovery* and *rivalry*, not just "laziness."
      *   *Claim 11: "History vindicated that practical conclusion but not the argument..."*
          *   *Verdict:* Philosophically contentious. If the theory requires assumptions that cannot exist in reality (perfect knowledge), is it really "theoretically coherent"?
      *   *Claim 12: "...failures of the actually existing planned economies... were failures of implementation."*
          *   *Verdict:* Biased. Austrians argue the failures were *systemic* due to the lack of calculation, not just "implementation" errors of Lange's model (which was never fully implemented anyway).

  4.  **Addressing Specific User Questions:**

      *   *Mises's Thesis/Scope:* Mises argued calculation is impossible *without* money prices for factors of production. He did concede socialism could exist in a primitive economy or if embedded in a capitalist world market (using those external prices). The paragraph misses the world market nuance.
      *   *Missing Prices vs. Equations:* They are distinct. Mises = No prices means no calculation. Barone/Hicks/Lange = Equations exist but are unsolvable/slow. The paragraph conflates them under Mises 1920, which is historically inaccurate.
      *   *Practical vs. Theoretical:* Lange did make this move. However, claiming Mises made the "equation" argument in 1920 is the weak link.
      *   *Lange's Mechanism:* Accurate on MC=P. Pre-Mises formal solution? Enrico Barone (1908) showed equilibrium conditions *could* be written down. Mises knew this but argued it didn't solve the *economic* problem of valuation. Lerner co-developed the MC rule (Lange-Lerner Theorem).
      *   *Tacit Knowledge:* "Tacit" is Polanyi (1958/1966). Hayek (1945) uses "knowledge of time and place." The paragraph imports Polanyi's label onto Hayek. More importantly, Hayek's point isn't just latency (gathering data takes too long); it's that the data *does not exist* in a centralized form until the market process reveals it.
      *   *Incentives vs. Discovery:* "Laziness and concealment" is a principal-agent issue. The Austrian point is deeper: without private property, there is no *entrepreneurial alertness* to *discover* new opportunities. It's not just doing the job badly; it's not knowing what the job *should* be.
      *   *Closing Verdict:* If the knowledge problem is theoretical (knowledge is inherently dispersed), then the failure is theoretical, not just practical. The split collapses.

  5.  **Drafting the Rewrite:**
      *   Need to soften the "Settled" claim.
      *   Distinguish Mises (prices) from Hayek (knowledge).
      *   Clarify Lange's contribution (trial and error).
      *   Nuance the "incentives" vs. "discovery" point.
      *   Avoid definitive historical verdicts ("History vindicated...").
      *   Keep length similar.

  6.  **Refining the Output:**
      *   Ensure the tone is helpful for a philosophy-of-economics group (focus on conceptual clarity).
      *   Check specific constraints (no citations, be plain about uncertainty).
      *   Make sure to explicitly list the "dangerous sentences."

  7.  **Self-Correction/Review during drafting:**
      *   *Correction:* I initially thought about mentioning Barone in the rewrite. *Decision:* Keep it simple. The prompt asks for a rewrite of the paragraph, not a history lecture. Mentioning Barone might clutter the flow. I will address Barone in the audit section.
      *   *Correction:* On "Tacit." I need to be clear that while Hayek didn't use the word "tacit" in 1945, the concept is often retrospectively applied. However, the paragraph implies Hayek used the term or that it's the standard label. I should flag this.
      *   *Correction:* On Mises 1920. Did he mention equations? No, that came later with the general equilibrium formalists. Mises was more praxeological. The paragraph attributes the equation argument to Mises 1920. This is a key error to highlight.

  8.  **Final Polish:** Check against the user's specific questions one last time to ensure all are answered. (Yes, the plan covers Mises scope, prices vs equations, Lange's move, mechanism, tacit knowledge, incentives, and the verdict).

  9.  **Constructing the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is an audit of the paragraph, followed by answers to your specific questions, a rewritten version, and a list of sentences to avoid.

  ### Part 1: Claim-by-Claim Audit

  **1. "The socialist calculation debate was settled by Oskar Lange."**
  *   **Verdict:** **Misleading.**
  *   **Analysis:** This reflects a specific mid-century neoclassical consensus (the "Bergson" view) that Lange won the theoretical debate. However, within the history of thought, this is the *conclusion* of the debate, not a premise. Austrian economists, and later mechanism design theorists, argue the debate was not settled. A historian would say the debate *shifted*, not that it ended.
  *   **Austrian Objection:** Mises and Hayek never accepted Lange's solution; they argued he changed the subject from calculation to simulation.
  *   **Socialist Objection:** Some market socialists argue Lange's model was never given a fair chance, so "settled" is historically premature.

  **2. "In 1920 Ludwig von Mises had announced that socialism is impossible..."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Analysis:** Accurately captures the thrust of *Economic Calculation in the Socialist Commonwealth*.
  *   **Nuance:** Mises argued rational *economic calculation* is impossible, not that a socialist society is physically impossible. It could exist, but it would be chaotic and primitive.

  **3. "...with public ownership of the means of production there are no market prices for capital goods..."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the core of Mises's price signal argument. No private exchange of capital goods means no money prices, which means no common denominator for value.

  **4. "...and even if it somehow had the data it could never solve the millions of simultaneous equations that describe an economy."**
  *   **Verdict:** **Wrong Attribution.**
  *   **Analysis:** This conflates Mises (1920) with later developments. Mises focused on the *absence* of prices. The "simultaneous equations" argument is associated with the general equilibrium formalists (like Walras or Barone) and was used *against* the socialists by Robbins and Hayek later, or attributed to Mises retrospectively. Mises did not frame his 1920 argument around solving mathematical systems.
  *   **Austrian Objection:** Attributing the mathematical argument to Mises misrepresents his praxeological method.
  *   **Socialist Objection:** Lange specifically targeted the equation argument; if Mises didn't make it, Lange's victory over it is a victory over a strawman (or over Robbins, not Mises).

  **5. "Lange's reply... was that Mises had confused a practical difficulty with a theoretical impossibility."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Analysis:** This accurately summarizes Lange's 1936/1937 strategy. He accepted the neoclassical equilibrium framework and argued socialism could mimic it.
  *   **Nuance:** Lange was responding as much to the neoclassical critics (like Taylor) as to Mises.

  **6. "The equations do have a solution, and a socialist board can find it by trial and error..."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the core of Lange's "market socialism." The Central Planning Board (CPB) acts as the auctioneer.

  **7. "Managers are instructed to produce where marginal cost equals the announced price and to minimize average cost..."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the Lange-Lerner rule.
  *   **Omission:** It omits that this requires managers to follow rules rather than act as entrepreneurs.

  **8. "Hayek's celebrated response... did not dispute any of this. He conceded the theory..."**
  *   **Verdict:** **Highly Contested.**
  *   **Analysis:** This is the "Neoclassical Synthesis" reading of Hayek. Many historians of thought argue Hayek did *not* concede that the equilibrium equations were a valid theoretical benchmark. He argued the equilibrium framework itself was inappropriate for analyzing dynamic market processes.
  *   **Austrian Objection:** Hayek shifted the ground from *static allocation* to *dynamic discovery*. He did not concede the theoretical coherence of Lange's model, only its irrelevance to real-world coordination.
  *   **Socialist Objection:** If Hayek conceded the theory, Lange won the theory. If Hayek didn't concede, the theoretical debate remains open.

  **9. "...argued instead that the relevant knowledge is dispersed and largely tacit..."**
  *   **Verdict:** **Anachronistic/Imprecise.**
  *   **Analysis:** Hayek (1945) speaks of "knowledge of the particular circumstances of time and place." The specific term "tacit knowledge" is Michael Polanyi's (1958/1966). While the concepts overlap, attributing the term "tacit" to Hayek in this context is historically loose.
  *   **Substantive Issue:** See below regarding "latency."

  **10. "What was left of the Austrian case was therefore an objection about incentives: planners and managers have no stake in the outcome..."**
  *   **Verdict:** **Misleading Reduction.**
  *   **Analysis:** This reduces the Austrian critique to a principal-agent problem (shirking). The Austrian critique is deeper: it is about *entrepreneurial discovery*. Without private property, there is no mechanism to *discover* what the incentives should be or where opportunities lie.
  *   **Austrian Objection:** It is not just that managers are lazy; it is that without residual claimancy, there is no *alertness* to profit opportunities. The problem is epistemic, not just motivational.
  *   **Socialist Objection:** Incentive problems can be solved by monitoring or moral suasion; the calculation problem is harder. Reducing it to incentives makes it seem easier to solve than Austrians claim.

  **11. "History vindicated that practical conclusion but not the argument..."**
  *   **Verdict:** **Philosophically Contentious.**
  *   **Analysis:** This assumes a distinction between "theory" and "practice" that the Austrian school rejects. If a theory assumes agents have access to information they cannot possibly have, the theory is flawed, not just the practice.
  *   **Austrian Objection:** The failure of planned economies vindicates the *theoretical* argument that calculation requires prices, not just the *practical* argument that planners are lazy.
  *   **Socialist Objection:** "Actually existing socialism" did not implement Lange's model (which required democratic input and market-mimicking rules). Judging Lange by the USSR is unfair.

  **12. "...failures of the actually existing planned economies... were failures of implementation."**
  *   **Verdict:** **Biased.**
  *   **Analysis:** This assumes Lange's model was theoretically sound and only failed due to execution. Austrians argue the model itself was incoherent because it assumed the CPB could know cost functions without a market process to generate them.

  ---

  ### Part 2: Answers to Your Specific Questions

  **Does the paragraph state Mises's thesis at the right level of generality?**
  It captures the spirit but misses the scope conditions. Mises argued calculation is impossible *in a closed socialist system*. He explicitly conceded that a socialist commonwealth embedded in a wider capitalist world market could use external world prices to calculate. The paragraph implies a blanket impossibility without noting this exception, which is crucial for understanding Mises's precision.

  **Are the missing-prices point and the cannot-solve-the-equations point the same argument?**
  No, they are distinct, and compressing them matters.
  1.  **Missing Prices (Mises 1920):** Without property exchange, there are no prices. Without prices, there is no common unit of value. You cannot compare inputs to outputs.
  2.  **Equations (Barone/Robbins/Hayek):** Even if we define value, the mathematical system to allocate resources is too complex to solve centrally.
  The paragraph attributes the "equations" argument to Mises in 1920. This is historically inaccurate. Mises focused on the *institutional absence* of prices. The equations argument became prominent later, largely as a response to those who claimed socialism was mathematically possible (like Barone). Lange defeated the equations argument, but Austrians argue he did not defeat the missing-prices argument.

  **Is the "practical difficulty versus theoretical impossibility" move correctly assigned to Lange?**
  Yes, this is correctly assigned to Lange (1936). However, the paragraph implies Mises made the "theoretical impossibility" claim based on the *equations*. Mises made the impossibility claim based on the *absence of prices*. Lange argued the absence of prices was a practical hurdle that could be bypassed by shadow pricing. A careful defender of Mises would say Lange didn't address the core claim: shadow prices are not real prices because they lack the risk of ownership.

  **Does it describe Lange's mechanism accurately, and does it omit anything?**
  It describes the "trial and error" and "marginal cost = price" rules accurately.
  *   **Omission 1:** It omits **Abba Lerner**. The marginal cost rule is the **Lange-Lerner Theorem**. Lerner formalized the welfare economics behind it.
  *   **Omission 2:** It omits **Enrico Barone (1908)**. Barone demonstrated mathematically that equilibrium conditions *could* be stated for a collectivist ministry. Mises knew this; his point was that stating the conditions is not the same as fulfilling them economically.
  *   **Omission 3:** It omits the requirement for **consumer sovereignty**. Lange's model relied on the Planning Board respecting consumer demand signals, which historically planned economies did not do.

  **Is the attribution of "tacit" knowledge to Hayek fair?**
  It is conceptually fair but terminologically anachronistic. Hayek wrote about knowledge that cannot be "statistically compiled." Polanyi coined "tacit."
  *   **Crucial Distinction:** The paragraph says the knowledge "exists but cannot be gathered in time." This downgrades Hayek's claim. Hayek argued the knowledge *does not exist* in a centralized form until the market process creates it. It is not a problem of **latency** (too slow); it is a problem of **existence** (the data is generated by the trading process itself). Rendering it as an administrative lag makes it sound like a computing problem, which Hayek explicitly denied.

  **Is it fair to say the residue of the Austrian case was an objection about laziness and concealment?**
  No. This reduces the argument to a **principal-agent problem**.
  *   **Austrian View:** The issue is **entrepreneurial discovery**. A manager following Lange's rules minimizes cost for a *given* production function. An entrepreneur *discovers new* production functions. Without private property and profit/loss, there is no drive to discover the unknown. "Laziness" implies they know what to do but won't do it. Austrians argue they *cannot know* what to do without the price system guiding discovery.
  *   **Lange Defender View:** A Lange defender might agree incentives are the weak point but argue that democratic oversight or non-monetary motivations could mitigate this, whereas the calculation problem is the hard constraint.

  **Once corrected, does the closing verdict survive?**
  No. The split between "conclusion" (socialism failed) and "argument" (Lange was theoretically right) collapses if you accept the Austrian definition of theory. If the theory requires assumptions (perfect knowledge of cost curves) that are impossible in reality, the theory is flawed, not just the implementation. A historian would say the verdict is still debated: did socialism fail because it lacked incentives (Austrian/Neoclassical) or because it lacked calculation (Misesian)?

  ---

  ### Part 3: Rewritten Paragraph

  Here is a version that maintains your narrative arc but tightens the historical and conceptual claims to a standard a historian of economic thought would accept.

  > "The socialist calculation debate is often described as a theoretical victory for Oskar Lange, though the settlement remains contested. In 1920, Ludwig von Mises argued that rational economic calculation is impossible under socialism: without private ownership of the means of production, there are no market prices for capital goods, and planners lack a common denominator to evaluate scarcity. While Mises focused on the absence of prices, later critics added that even with data, the complex system of equations describing an economy could not be solved centrally. Lange's reply in the 1930s was that Mises conflated institutional absence with logical impossibility. He proposed a market-socialist model where a planning board simulates a market: it announces accounting prices, observes surpluses and shortages, and revises them via trial and error. Managers are instructed to set marginal cost equal to price, mimicking competitive equilibrium. Hayek's response in 'The Use of Knowledge in Society' shifted the ground rather than conceding the point. He argued that the relevant knowledge of time and place is dispersed and often inarticulable, so it cannot be gathered by a board regardless of speed. What remained of the Austrian case was not merely an objection about incentives or shirking, but about entrepreneurial discovery: without residual claimancy, there is no mechanism to discover new opportunities. History vindicated the critique of central planning, though scholars still dispute whether the failures of planned economies refute Lange's theory or merely its implementation."

  ---

  ### Part 4: Sentences to Avoid in Your Seminar

  If you want to avoid sparking a fight based on contested historiography rather than philosophical substance, do not repeat these sentences from your original draft:

  1.  **"The socialist calculation debate was settled by Oskar Lange."**
      *   *Why:* This is the most contested claim in the literature. It treats a specific interpretation as fact.
      *   *Alternative:* "Lange is widely credited with winning the theoretical round of the debate..."

  2.  **"...even if it somehow had the data it could never solve the millions of simultaneous equations that describe an economy."** (When attributed to Mises 1920).
      *   *Why:* Mises did not make the mathematical/equations argument in 1920. This conflates Mises with later general equilibrium critics.
      *   *Alternative:* Separate Mises's price argument from the later complexity/equations argument.

  3.  **"Hayek's celebrated response... did not dispute any of this. He conceded the theory..."**
      *   *Why:* Many Hayek scholars argue he did not concede the neoclassical equilibrium framework was valid for this problem.
      *   *Alternative:* "Hayek shifted the debate from static equilibrium to the dynamic use of knowledge..."

  4.  **"What was left of the Austrian case was therefore an objection about incentives: planners and managers have no stake in the outcome, and the system decays through laziness and concealment."**
      *   *Why:* "Laziness" trivializes the entrepreneurial discovery argument.
      *   *Alternative:* "...an objection about incentives and entrepreneurial discovery: without private property, there is no drive to uncover new economic opportunities."

  5.  **"...failures of the actually existing planned economies... were failures of implementation."**
      *   *Why:* This assumes Lange's model was theoretically sound. Austrians argue the model itself was incoherent.
      *   *Alternative:* "...scholars still dispute whether these failures refute the theory of market socialism or merely its historical application."
