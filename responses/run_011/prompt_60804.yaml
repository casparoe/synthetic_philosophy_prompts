prompt: |-
  So, kind of an odd request. I'm a backend engineer, zero formal philosophy background — the most I've done is skimmed some blog posts about that guy who wrote the book arguing against democracy, plus a wikipedia-level summary of the Condorcet jury theorem. Next month I'm giving a 20 minute talk at a small interdisciplinary workshop run by our local university's political theory group (I know a couple of the organizers from a meetup), and I'm going to get eaten alive if I don't prep.

  The talk is about a voting system I actually built and that my company uses to decide whether design proposals (RFCs) get accepted. I'm pitching it as a small-scale, self-correcting epistocracy. How it works:

  - every engineer starts at weight 1 when they approve or reject an RFC
  - your weight moves based on your review track record: approve something that later causes an incident, weight goes down; leave a review comment flagging a risk that later turns out to have been a real risk, weight goes up
  - weights are capped, they decay back toward 1 on roughly a six month half life, and there's a floor so nobody ever drops to zero — everyone always keeps some vote
  - my main claim is that this dodges the standard objections to epistocracy, because it doesn't install a fixed class of wise people. Anyone can earn weight, it's scored on calbration rather than credentials, and it gets revised automatically when you turn out to have been wrong.

  Audience: about 25 people. Mostly political theorists, grad students and a few faculty, who care about political equality and legitimacy; one sociologist who studies open source communities; and two people who work on DAO governance who are basically already on my side. Aside from the DAO folks nobody writes code for a living.

  Build me the Q&A prep sheet. Exactly five objections, ordered most damaging to least, numbered, and nothing at all before or after the list. Each item should have: (a) the objection in one sentence, phrased the way that room would actually phrase it, in their vocabulary and not mine; (b) a reply of two sentences that I could say out loud at normal speed; (c) one short line saying where that reply is soft, or where I'd just be changing the subject; and (d) a tag, either "survivable" or "this one sinks it." One of the five should be the question I'm privately hoping nobody asks — mark which.

  No hedging and no both-sides mush, please. I want you to actually take a position: tell me which of the five genuinely defeats the proposal rather than just annoying it, and if you think my "it's not really epistocracy, it's different" framing is a dodge, say that straight out and give me the honest version of the claim I should be defending instead. Five items, that's all — no intro paragraph, no wrap-up, no further reading.
