answer: |-
  ### I. The Mapping: Theoretical Predictions vs. Historical Durability

  To test the leading solutions to the paradox of tragedy against the Tate era, we must treat the 157-year run of the happy-ending *Lear* not as a historical curiosity, but as data regarding audience psychology under specific conditions.

  **Aristotelian Catharsis:** If tragedy functions by purging pity and fear through a structured arousal, Shakespeare's ending offers a more intense arousal than Tate's. **Prediction:** Audiences should eventually crave the stronger purgation; the Tate version should feel emotionally incomplete, leading to declining attendance or a demand for the original within a generation. **Reality:** The prediction fails. The "incomplete" version dominated for six generations. This suggests either that catharsis is not the primary driver of theatrical value, or that the specific configuration of pity and fear in Shakespeare's ending was perceived as pathological rather than purgative.

  **Humean Conversion:** Hume argues that the eloquence of the representation converts the painful passion into pleasure. Shakespeare's poetry is objectively more dense and metaphorically rich than Tate's. **Prediction:** The superior eloquence of the original should overcome the pain of the ending relatively quickly. Audiences should prefer the Shakespearean text because the aesthetic pleasure outweighs the narrative pain. **Reality:** The prediction fails. For a century and a half, Tate's inferior verse was preferred. This implies that eloquence alone cannot convert pain if the moral structure of the narrative resists it.

  **Fictionality and Control:** These accounts suggest distress is discounted because the spectator knows no one is really suffering. **Prediction:** The knowledge of fictionality should remain constant across both versions. Therefore, the death of Cordelia should be as acceptable as the blinding of Gloucester (which Tate largely retained). There should be no barrier to staging the original. **Reality:** The prediction fails. Audiences tolerated fictional suffering in the middle acts but rejected it at the close. Fictionality is not a uniform shield; it is permeable at specific structural points.

  **Compensation and Cognitive Value:** Sadness is redeemed by the insight or truth the work provides. **Prediction:** As audiences become more sophisticated, they should recognize the greater cognitive value in Shakespeare's bleak vision of justice and prefer it. **Reality:** The prediction fails. Sophistication (in the 18th-century sense) aligned with Tate. The "truth" of the original was viewed as an error, not an insight.

  **Meta-Response:** Pleasure is derived from monitoring our own appropriate moral engagement. **Prediction:** Audiences should enjoy the sensation of being the kind of person who weeps for Cordelia. **Reality:** The prediction fails. Audiences preferred the sensation of being the kind of person who rejoices in virtue rewarded.

  **Verdict:** The 157-year duration bears out none of the standard predictions. Every theory assumes a psychological mechanism that should have favored Shakespeare's version (greater intensity, greater eloquence, greater truth). The fact that they did not suggests these theories describe a specific, historically contingent mode of spectatorship (likely post-Romantic) rather than a universal human psychology.

  ### II. The Fit and the Misfit: Why the Ending?

  The central anomaly is not that tragedy was rejected, but that the *ending* was the specific point of failure. Tate retained the storm, the madness, and Gloucester's blinding. If the paradox of tragedy were about the intensity of suffering, the heath scenes should have been equally intolerable. They were not.

  **The Peak-End Rule:** Affective memory is disproportionately weighted toward the final moments of an experience. A painful middle can be retrospectively coded as "positive" if the resolution is safe. This psychological heuristic does more explanatory work than the philosophical accounts. It suggests the Tate period was not a case of audiences failing to enjoy sadness, but of audiences managing memory. They did not solve the paradox; they bypassed it by ensuring the final affective tag was relief, not loss. If this is correct, the paradox of tragedy is a framing error: we do not enjoy the sadness; we enjoy the safety that follows it. Tate provided safety; Shakespeare did not.

  **Moral vs. Hedonic Reports:** Johnson and Tate argued in terms of *poetic justice*, not pain avoidance. They claimed the original was *immoral*, not merely *unpleasant*. Standard paradox theories rely on hedonic calculus (pain vs. pleasure). When participants report moral revulsion rather than hedonic distress, hedonic theories lose traction. If a spectator says, "I cannot watch this because it is wrong," a theory positing "I watch this because the pain is pleasurable" cannot engage. The theories fail to account for the phenomenology of moral disgust, which operates differently than physical or emotional pain.

  **Burke's Execution:** Burke suggested a real execution would draw a larger crowd than a tragedy. If true, it implies we crave high-intensity suffering. Yet Tate's audiences rejected the high-intensity suffering of Cordelia's death. This makes the Tate result harder to explain if we assume the barrier is *intensity*. It becomes easier to explain if we assume the barrier is *order*. Burke's claim highlights that we enjoy suffering when it is real (and thus meaningful in a moral cosmos) or when it is contained by a moral framework. Shakespeare's ending, to the Neoclassical mind, presented suffering without moral order (chaos). Tate restored order. The paradox, therefore, is not about sadness, but about *meaningful* sadness.

  ### III. The Reverse Direction: Was There a Paradox?

  For the London spectator between 1681 and 1830, there was no paradox of tragedy regarding *King Lear*. The paradox assumes a subject who chooses a sad work and reports enjoyment. Tate's audience chose a happy work and reported satisfaction. They are not a counterexample to the paradox; they are evidence that the paradox is not a universal condition of aesthetic experience. It is a specific condition that arises when "truth" is valorized over "justice."

  **The Discriminating Test:**
  To separate the **Conversion Account** (Hume) from the **Fictionality Account** during the Tate period, we need evidence regarding *closet drama* (private reading) versus *stage performance*.
  *   **Hypothesis:** If the Conversion Account holds, the pain of the text should remain painful in private reading because the eloquence is insufficient to convert it. If the Fictionality Account holds, the pain should be manageable in private reading because the "threat" is lower without actors.
  *   **The Test:** Examine records of private readings or printed editions. Did 18th-century readers express distress at reading Shakespeare's ending in their studies while refusing to see it on stage?
  *   **Differentiation:** If they read it with pleasure but refused to watch it, the **Fictionality/Control** account wins (the stage presence breaks the safety shield). If they found the text itself unbearable even in private, the **Conversion** account wins (the eloquence failed to convert the passion regardless of medium). Historical evidence suggests the text was often read and admired even while the stage version was performed, which supports the Fictionality/Control account: the pain was tolerable when the spectator had total control (reading), but intolerable when the spectacle imposed the suffering (theater).

  ### IV. Limitations: The 1830s Shift and Institutional Explanations

  None of the philosophical theories explains why Shakespeare's text became stageable in the 1830s without a change in human psychology. The capacity for catharsis, conversion, or meta-response did not suddenly evolve in 1834. The text was the same; the audience's biology was the same. What changed was the *institutional frame*.

  **The Institutional Explanation:** The return of the original *Lear* requires a sociological explanation, not a psychological one.
  1.  **Canon Formation:** Shakespeare shifted from being a playwright who needed fixing to a "National Bard" whose text was sacrosanct. To cut the ending became an act of sacrilege rather than improvement.
  2.  **Romantic Aesthetics:** The value system shifted from Neoclassical "Justice" to Romantic "Truth." Suffering became a sign of depth rather than an error in plotting.
  3.  **Actor-Manager Authority:** Macready and Kean derived cultural capital from performing the "difficult" original. Staging the Tate version became a sign of commercial vulgarity, while staging the original signaled high-art status.

  **The Consequence for the Paradox:** This reveals a hard limit on the philosophical theories. They attempt to answer "Why do we enjoy sad art?" as if it is a question about individual psychology. The Tate episode demonstrates that the question is actually "Under what conditions is sad art permitted?"

  The theories cannot cover the *permission structure*. They assume the artwork is presented in a vacuum. The Tate period shows that enjoyment is mediated by cultural authority. When the institution says "this suffering is noble," we convert the pain (Hume) or find value in it (Compensation). When the institution says "this suffering is unjust," we reject it.

  Therefore, the Tate episode does not solve the paradox of tragedy; it dissolves it. It suggests there is no stable "pleasure in pain." There is only pain, which is rendered acceptable or unacceptable by the moral and institutional frameworks surrounding it. The 1830s return of Shakespeare's ending does not prove we finally learned to enjoy tragedy; it proves we learned to value *authenticity* over *comfort*. The question shifts from "How does pain become pleasure?" to "Who has the power to define pain as meaningful?"
