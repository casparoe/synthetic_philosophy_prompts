answer: |-
  1.  **Topic 1 (Vacuity):** If chance is defined as the probability assigned by the statistical model I already take to best systematize my evidence, isn't the instruction to "defer to chance" just the instruction to "be coherent with your own current beliefs"? Where is the normative bite if the chance function is nothing over and above my own evidential summary?

  2.  **Follow-up (Topic 1):** You will likely say the principle constrains how I *update* when new evidence arrives, not just my current state. But if the constraint is simply that I must conditionalize on new evidence using the model's likelihoods, isn't this just standard Bayesian conditionalization? Why do we need the label "chance" rather than just "likelihood"?

  3.  **Topic 2 (Model Uncertainty):** When an agent is uncertain which statistical model is correct—for instance, unsure whether a coin is biased or fair—do they defer to a weighted mixture of the model-relative chances?

  4.  **Follow-up (Topic 2):** If you say yes, what determines the weights assigned to each model? If the weights are themselves model-relative chances, you face a regress. If the weights are just my subjective credences, haven't you admitted that at the foundation, credence drives chance, not the other way around?

  5.  **Topic 3 (Admissibility):** You claim the admissibility clause is the whole point of the Principal Principle. Can you give me a criterion for admissibility that doesn't presuppose the chance function it's meant to protect? I want a rule for identifying admissible evidence that doesn't simply say "evidence that doesn't conflict with the chance."

  6.  **Follow-up (Topic 3):** You will likely suggest admissible evidence is "evidence not about the specific outcome." But how do I distinguish evidence about the outcome from evidence about the chance without already knowing the chance structure? Isn't this circular: I need the chance to filter the evidence, but I need the evidence to find the chance?

  7.  **Topic 4 (Self-Locating Evidence):** In cases of self-locating uncertainty, like Sleeping Beauty, I know the objective setup perfectly but am uncertain which centered possibility I occupy. My rational credence diverges from the known model probability. Does the chance shift just because I gained indexical evidence?

  8.  **Follow-up (Topic 4):** If you say the chance shifts, doesn't this make chance too unstable to do the explanatory work we want in science? If you say it doesn't shift, then the Principal Principle fails in these cases. Which cost do you prefer: unstable chances or a failed principle?

  9.  **Escape Hatch 1 (Frequency Talk):** You dismiss metaphysical objections as "frequency talk in disguise." But I make bets on single cases, not long-run frequencies. If chance is just model-relative systematization, why should I care about this specific toss? If your answer is "because the model says so," aren't you just begging the question against the single-case realist?

  10. **Escape Hatch 2 (Authority) & Closing:** You argue that opponents owe an account of chance's authority over belief which your view delivers for free. But if chance is just my best model, its authority is just the authority of my own current judgment. How is that normative authority rather than mere description? And given you find this trade-off so favorable, what observation, or what theoretical cost, would actually make you give the view up?

  ***

  **Partisan Assessment**

  Question 4 is the one he has no good answer to. It forces the dilemma of the epistemic regress that destroys model-relative accounts. If the weights for model uncertainty are chances, he needs a higher-order model to weight them, leading to an infinite regress. If the weights are subjective credences, then subjective credence is the fundamental normative notion, and "chance" is merely a derivative label for specific kinds of credences. This collapses his view into pure subjectivism, undermining his claim to be preserving a robust notion of chance deference. He cannot posit a third option without reintroducing objective chance, which he explicitly denies.
