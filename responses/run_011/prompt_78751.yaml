  2.  **Deconstruct "One Over Many" (The Slogan):**
      *   Where does it come from? Plato (*Hippias Major*, *Parmenides*), Aristotle (*Metaphysics*). It's the classic formulation of the Problem of Universals.
      *   What does it mean? Roughly: Many particular things share one common nature.
      *   *Interpretation 1: Descriptive/Phenomenological.* We *talk* as if there is one thing shared by many. (Linguistic practice).
      *   *Interpretation 2: Ontological Commitment.* There *exists* an entity distinct from the particulars that explains their similarity. (Realism).
      *   *Interpretation 3: Instantiation Requirement.* The "one" only exists if the "many" exist. (Existence dependence).
      *   *Interpretation 4: Identity.* The "one" is numerically identical in each of the "many". (Strict Realism vs. Resemblance).

  3.  **Evaluate the Claims:**
      *   *Claim 1 (Definition):* "Universal" = "Entity shared by multiple particulars." (Stipulative).
          *   Status: Trivially True (as a definition of the word in this context), but doesn't settle ontology.
      *   *Claim 2 (Explanatory):* Similarity between many things requires a single shared entity.
          *   Status: Substantive but Defensible (Realist view), but contested by Nominalists.
      *   *Claim 3 (Existential):* The "one" cannot exist without the "many".
          *   Status: Substantive but Controversial (Aristotelian vs. Platonic). This is the crux of the professor's move.
      *   *Claim 4 (Numerical Identity):* The "one" is numerically identical across instances.
          *   Status: False (for Trope theorists/Resemblance Nominalists who deny numerical identity of properties).

  4.  **Analyze the Professor's Move:**
      *   Argument: No instances $\rightarrow$ No "many" $\rightarrow$ No "one over many" $\rightarrow$ No property.
      *   Which reading is needed? It needs Claim 3 (Existential Dependence). If universals are Platonic (transcendent), they can exist without instances. If they are Aristotelian (immanent), they cannot.
      *   Is it smuggled? Yes. The slogan "one over many" describes the *relation* or *structure* if they exist. It doesn't logically entail that the "one" *ceases* to exist if the "many" are absent, unless you add the premise "The one is ontologically dependent on the many."
      *   Why it feels too fast: Because Platonists accept "one over many" but reject the inference. They say the Form of Unicorn exists even if no unicorns do. The professor is assuming *Immanent Realism* without arguing for it.

  5.  **Address the Bonus (Nominalism/Trope Theory):**
      *   *Resemblance Nominalism:* Denies the "one". There are only many things that resemble each other. No shared entity. So, strictly speaking, it rejects the "one". However, some say the *class* is the "one".
      *   *Trope Theory:* Properties are particular (tropes). There is no numerically identical "one". There is a "one" only in the sense of a *natural class* or *abstract universal* derived from resembling tropes.
      *   *Can they satisfy the slogan?* Only if "one" is interpreted loosely (e.g., one *type*, not one *token*). If "one" means numerical identity, they fail.

