      2.  **The Ontological Claim (Realism):** There exists an entity $U$ such that $x$ and $y$ both instantiate $U$. (Substantive).
      3.  **The Immanence Claim:** $U$ exists *only if* there are $x, y...$ (This is the specific one needed for the professor's argument).
