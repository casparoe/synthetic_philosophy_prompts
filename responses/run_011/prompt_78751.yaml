prompt: |-
  Second year metaphysics seminar here and my prof has this tag he reaches for constantly — universals are just whatever is "one over many". Someone asked whether there can be properties nothing instantiates (being a unicorn, being a golden mountain, that sort of thing) and he waved it off: if nothing is F then there's no many, so there's nothing one over them, so there's no F-ness, case closed. idk, it felt too fast but I couldn't say why at the time.

  Can you break that slogan into the distinct precise claims it could be standing for — like a stipulative definition of "universal", a criterion for when a theory of properties counts as adequate, an inference from there being genuine sameness of type to there being something shared, a claim about where the "one" has to sit (wholly in each particular, outside them, or nowhere at all) — and for each say whether it's trivially true, substantive but defensible, or just false? Then tell me which reading his move against uninstantiated properties actually needs, and whether that reading is contained in the slogan or is an extra premise smuggled in. Bonus: does any reading rule out resemblance nominalism or trope theory, or can those satisfy it too, and if so in what sense is there still a "one"? List format pls, I want to bring it to office hours.
