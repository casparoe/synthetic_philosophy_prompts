  ### EXAM QUESTION

  **Graduate Seminar: Modal Metaphysics – Take-Home Final**
  **Time Allowed:** 3 Hours
  **Total Marks:** 25

  **Instructions:**
  Answer the following question. You may assume standard S5 modal logic and classical higher-order logic (HOL) with unrestricted property abstraction (i.e., for any open formula $\phi(x)$, there exists a property $\lambda x. \phi(x)$). Be precise with your derivations. If you use a lemma, state it clearly. Do not cite external literature; rely only on the system provided below.

  **Axiomatization:**
  *   **P1:** $\forall \phi \forall \psi ( (Pos(\phi) \land \Box \forall x (\phi(x) \to \psi(x))) \to Pos(\psi) )$
  *   **P2:** $\forall \phi ( (Pos(\phi) \leftrightarrow \neg Pos(\neg \phi)) )$  *(Note: Exhaustive and Exclusive)*
  *   **P3:** $Pos(G)$  *(Where $G$ is the property defined in D1)*
  *   **P4:** $\forall \phi ( Pos(\phi) \to \Box Pos(\phi) )$
  *   **P5:** $Pos(NE)$
  *   **D1:** $G(x) \leftrightarrow \forall \phi (Pos(\phi) \to \phi(x))$
  *   **D2:** $Ess(\phi, x) \leftrightarrow ( \phi(x) \land \forall \psi ( \psi(x) \to \Box \forall y (\phi(y) \to \psi(y)) ) )$
  *   **D3:** $NE(x) \leftrightarrow \forall \phi ( Ess(\phi, x) \to \Box \exists y \phi(y) )$
  *   **Target:** $\Box \exists x G(x)$

  **Proposed Repairs for Modal Collapse:**
  *   **Repair A (No-Hybrids):** Modify **D2** by restricting the universal quantifier $\forall \psi$ to range only over **non-hybrid** properties. A property $\psi$ is *hybrid* iff $\exists \theta \exists p ( \forall x (\psi(x) \leftrightarrow (\theta(x) \land p)) )$, where $p$ is a contingent proposition (true at some worlds, false at others).
  *   **Repair B (One-Way):** Replace **P2** with the weaker **P2*:** $\forall \phi ( Pos(\phi) \to \neg Pos(\neg \phi) )$. (Drop the guarantee that either $\phi$ or $\neg \phi$ is positive).

  **Question:**
  1.  **Reconstruction:** Derive the Target ($\Box \exists x G(x)$) from the Axiomatization. Explicitly mark where P1, P2, P3, P4, P5, D1, D2, D3, and S5 are used. Identify which steps rely on S5 specifically (vs. weaker modal systems).
  2.  **Collapse:** Derive the modal collapse result ($\forall p (p \to \Box p)$) from the Axiomatization. Pinpoint exactly which assumption allows the derivation to proceed.
  3.  **Evaluation of Repairs:** Determine separately for **Repair A** and **Repair B**:
      *   (i) Does the Target still follow?
      *   (ii) Is the Collapse blocked?
      *   Provide a proof or a precise explanation of which lemma fails. For any repair that fails to block collapse, describe what a countermodel would require.
  4.  **Recommendation:** Which repair should a defender of the argument prefer? Justify your answer based on logical cost vs. theoretical benefit.

