  Here's the axiomatisation I intend to print at the top of the question, so the item is self-contained and noone has to remember anything (my own numbering, don't worry about matching anyone else's):

  - P1: if φ is positive, and it is necessary that whatever has φ has ψ, then ψ is positive.
  - P2: for every property φ, either φ is positive or its negation is positive, but not both.
  - P3: being Godlike is positive.
  - P4: if φ is positive, then necessarily φ is positive.
  - P5: necessary existence is positive.
  - D1: x is Godlike, G(x), iff x has every positive property.
  - D2: φ is an essence of x iff φ(x), and for every property ψ: if ψ(x) then necessarily whatever has φ has ψ.
  - D3: x exists necessarily, NE(x), iff for every essence φ of x, necessarily something has φ.
  - Background: S5 plus classical higher-order logic with unrestricted property abstraction (any open formula picks out a property). Target: □∃x G(x).

