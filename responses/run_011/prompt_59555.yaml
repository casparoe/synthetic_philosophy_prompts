  **1. Purpose and Scope of this Bulletin**
  This bulletin establishes underwriting standards consistent with the Syndicate's Ash'arite Articles of Association. All pricing models must exclude metaphysical necessity from risk assessment. We operate solely within the Divine Habit. Adjusters are reminded that regularity is observed, not mandated. This document supersedes previous guidance regarding natural causation. Compliance is mandatory for all book writers. The objective is to align commercial exposure with theological reality. Any implication that fire burns by its own power constitutes a policy wording error. We insure against loss, not against metaphysical error, but the latter invites the former. Ensure all client communications reflect the contingency of sequence.

  **2. Definitions**
  **Cause:** A temporal antecedent with no intrinsic power to effect change. It is merely the occasion for Divine Action.
  **Habit:** The observed frequency with which the Divine Will associates two events. This is the basis of all pricing.
  **Peril:** The specific occurrence triggering indemnity, provided it aligns with customary sequence.
  **Non-Customary Occurrence:** An event where the usual sequence is interrupted by direct Will (e.g., fire failing to burn). Such events are not excluded per se but require Senior Underwriter approval. Note: The Prophet Ibrahim's cooling fire is a covered Non-Customary Occurrence. Moses' staff transforming is treated as a single event, not aggregation, provided the serpent bit no third parties. Distinguish carefully between miracle and fraud.

  **3. The Habit Discontinuance Capital Charge**
  The Solvency Authority requires capital held against Habit Discontinuance. While the Habit is stable, it is not necessary. Our rating philosophy is more empiricist than rivals: we price purely off observed frequency, not assumed nature. This is a strength. When a rival model assumes fire must burn, a miracle bankrupts them. When we price off frequency, a miracle is merely a low-probability variance already capitalized. We do not fear the exception; we reserve for it. Do not interpret this charge as skepticism. It is prudent stewardship of contingency. We acknowledge the world could be otherwise, which allows us to remain solvent when it is.

  **4. Claims Handling: Grounds for Declining**
  Claims may be declined on three grounds reflecting core doctrinal breaches. First, if the claimant asserts the loss arose from the intrinsic nature of the peril (denial of Divine Power). Second, if the claimant denies the observed regularity of the Habit without evidence of Non-Customary Occurrence (denial of Prophecy/Wisdom). Third, if the claimant attributes the act of loss creation to themselves rather than acknowledging acquisition (kasb) of a Divine act (denial of Unity). Adjusters must redact language implying independent agency from all claim forms. Liability does not attach to the insured's power, as they possess none. The loss is covered, but the narrative must be corrected.

  **5. Sidebar — the Peripatetic Syndicate, and why we are not smug about it**
  The Peripatetic Syndicate entered run-off last quarter. Their policies warranted necessary connexion between cause and effect. When a verified Non-Customary Occurrence voided their liability clause, their reserves proved insufficient. We are not smug. Their model was rational within its premises. However, writing necessity into contracts exposes the book to metaphysical risk our structure avoids. Their failure confirms the robustness of pricing off Habit rather than Nature. We continue to monitor their run-off for lessons on modelling necessity risk.

  **6. FAQ for Newly Appointed Adjusters**
  Q: Our lead actuary suggests the insured's negligence caused the loss.
  A: Correct the language. The insured acquired the act; they did not create it. Mu'tazilite sympathies regarding independent agency create compliance risk.
  Q: How do we handle miracles?
  A: Verify via Sharia Board. If confirmed, pay promptly.
  Q: Why hold capital for God changing His mind?
  A: Because we are insurers, not theologians. We manage financial exposure to all contingencies, including the suspension of Custom.
  Q: Can we deny claims based on theology?
  A: Only if the theological error voids the contract's basis. Focus on the wording regarding agency and sequence.

  **Appendix A: Auditor's Objection and Syndicate Response**
  **Auditor Objection:** If things lack natures, prediction is impossible. Actuarial science requires stable objects of knowledge. Without necessary connexion, there is no science, only guesswork.
  **Syndicate Response:** Knowledge is of the Habit, not the Object. We know God usually associates fire with burning. This is sufficient for pricing. The auditor confuses metaphysical necessity with psychological expectation. Our books balance because the Habit is reliable, even if not necessary. Stability comes from Will, not essence. We sell certainty of coverage, not certainty of nature.

  **Afterword: what's load-bearing here**
  This exercise isolates the distinction between regularity and necessity. Ghazālī does not deny that fire burns cotton; he denies it *must*. The bulletin's rating philosophy mirrors this: we rely on observation (Habit), not essence (Nature). The three grounds for declining claims parallel the three charges of unbelief Ghazālī levels against the philosophers in the *Tahāfut*: denying God's power, denying prophecy (wisdom/order), and denying resurrection (or here, ultimate agency). The Appendix captures Ibn Rushd's core critique from the *Tahāfut al-Tahāfut*: if causation is merely habitual, knowledge becomes impossible. The Syndicate's response defends Ghazālī by shifting the object of knowledge from things to God's custom.

  Where this stretches doctrine is in commodifying the Habit. Ghazālī was not an insurer; he sought to protect divine omnipotence, not solvency margins. A serious reader might object that holding capital against God changing His mind implies a limitation on Will that Ghazālī would reject. However, for undergraduates, the financial framing makes the metaphysical contingency tangible. It forces them to see that occasionalism is not chaos; it is a different kind of order—one that requires reserves.

