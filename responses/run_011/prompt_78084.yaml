answer: |-
  The trend is unmistakable. When the IPCC assesses climate risk, they speak in "likely" and "very high confidence." When AI labs release capability reports, they offer bands of performance rather than specific metrics. Even superforecasters, the gold standard for probabilistic reasoning, often aggragate into wide intervals to account for model disagreement. The philosophical justification behind this is *imprecise probabilism*: the idea that when evidence is ambiguous, a rational agent's credence shouldn't be a single number (a point estimate), but a set of probability functions (an interval). It sounds like humility. It sounds like honesty.

  It is, however, a structural vulnerability.

  The argument for imprecise credences rests on the idea that sharp numbers imply a false precision we don't possess. But there is a cost to this vagueness that philosophers of probability have identified under the name *dilation*. Dilation occurs when an agent's interval for a hypothesis gets wider, not narrower, after learning new evidence. In a precise Bayesian framework, information always reduces expected uncertainty. In an imprecise framework, information can systematically increase uncertainty. This isn't a bug of specific models; it is a feature of the logic itself. And in high-stakes environments, features can be weaponized.

  ### The Dilation Trap

  To understand why imprecise credences are dangerous, you have to understand how they update. A precise Bayesian has a single prior distribution. When they see data, they update via Bayes' rule. The "martingale property" of Bayesian updating guarantees that your current expectation of your future belief is your current belief. You cannot expect to be more confused tomorrow than you are today.

  An imprecise Bayesian maintains a *set* of priors. When they see data, they update every function in the set. The new credence is the envelope of all those updated functions. Dilation happens when the evidence is ambiguous enough that some functions in the set interpret it as strong confirmation, while others interpret it as strong disconfirmation. The result is that the lower bound of the probability drops and the upper bound rises. You know *less* after seeing the evidence than you did before.

  ### The Regulator's Dilemma

  Consider a financial regulator tasked with estimating the probability of a bank's failure within the year ($F$). She adopts an imprecise credence, publishing a risk interval of $[10\%, 30\%]$. She believes this captures the ambiguity in the economic models.

  The bank ($B$) is required to make an announcement from a pre-cleared menu ($M$): a CEO resignation, a restructuring plan, or a change of auditor. Crucially, the regulator has already pre-cleared these items. She knows the menu. She knows the bank *must* pick one. She even knows the conditional probabilities of the bank picking each item given failure or solvency. In a precise world, this announcement contains zero new information about the bank's health; the regulator has already integrated the possibility of these announcements into her model.

  However, because the regulator holds imprecise credences (a set of priors rather than a single distribution), the bank has a lever on her epistemic state. The bank can analyze the regulator's set of priors and identify which announcement $m \in M$ causes the maximum dilation.

  Perhaps the "CEO Resignation" looks like a sign of panic to some priors in the regulator's set (pushing failure risk up) and a sign of corrective action to others (pushing failure risk down). The "Change of Auditor" might look like routine maintenance to some and hiding fraud to others. Because the regulator's credence is a set, she must accommodate all these interpretations simultaneously.

  By choosing the announcement that maximizes the spread between the most pessimistic and most optimistic priors, the bank can force the regulator's published risk interval to widen from $[10\%, 30\%]$ to $[5\%, 50\%]$. The bank has made the regulator *more* uncertain without lying, without hiding data, and without doing anything the regulator didn't already expect.

  This is structural leverage. The bank can paralyze regulatory action by triggering precautionary principles that rely on upper-bound risk estimates, or conversely, argue for leniency based on the lower bound. The imprecise framework hands the regulated party the keys to the regulator's confidence.

  ### The Counter-Arguments (and Why They Fail)

  Defenders of imprecise credences offer three main defenses. They deserve a fair hearing, but they do not survive the regulator test.

  **1. "Dilation is just ambiguity doing its job."**
  *The Argument:* If the evidence is genuinely ambiguous, your uncertainty *should* increase. Dilation correctly reflects that the signal was noisy and the models disagree. To force the interval to narrow is to lie about the state of knowledge.
  *The Rebuttal:* This confuses *noise* with *structure*. In the regulator case, the noise is already accounted for. The regulator knows the menu. In a precise framework, anticipated noise does not increase expected uncertainty. Dilation implies that merely *observing* which anticipated event occurred degrades your position. A rational agent should not be epistemically punished for receiving information they knew was coming. If your framework allows a counterparty to degrade your epistemic state by following your own rules, the framework is defective.

  **2. "Sharp priors are fake precision."**
  *The Argument:* Picking a single number (e.g., 20%) implies a level of knowledge we don't have. It creates an illusion of certainty that leads to overconfidence. Intervals are honest.
  *The Rebuttal:* This attacks a straw man. A precise Bayesian does not need to claim certainty; they claim a *distribution*. A point estimate with honest error bars (a precise prior with high variance) captures the ambiguity without violating the laws of probability. You can have a wide credible interval (e.g., "20% $\pm$ 10%") that represents model uncertainty hierarchically. This allows you to be humble about the world without being vulnerable to dilation. The "fake precision" charge conflates *being precise* with *being certain*. You can be precisely uncertain.

  **3. "The agent isn't required to have a view she can't support."**
  *The Argument:* If the evidence doesn't warrant a sharp prior, forcing one is irrational. Imprecise credences allow the agent to suspend judgment where appropriate.
  *The Rebuttal:* Suspension of judgment is a luxury that decision-making does not afford. The regulator must set capital requirements *now*. If she refuses to collapse her interval into a decision-weight, she defaults to a policy (often the worst-case scenario). By refusing to pick a sharp prior, she hasn't avoided a decision; she has outsourced the decision to the agent who can manipulate the interval width (the bank). Rationality requires maximizing expected utility, which requires a single expectation. Hiding behind a set of functions is not suspension of judgment; it is procrastination that invites exploitation.

  ### The Precise Alternative

  The solution is not to pretend we know more than we do. It is to model our ignorance precisely. A rational regulator should hold a precise probability distribution over the space of possible models. She assigns weights to the "panic" model and the "corrective action" model. This yields a single posterior probability for failure.

  Does this lose information? No. The variance of that posterior distribution captures the disagreement between the models. If the models disagree wildly, the variance is high. The regulator can publish the point estimate *and* the variance (the "honest error bars").

  Crucially, this precise setup is immune to the bank's leverage. Because the precise Bayesian's expectation is a martingale, the bank cannot choose an announcement from the pre-cleared menu that systematically increases the regulator's variance. The expected posterior variance equals the prior variance. The bank cannot game the uncertainty.

  Imprecise probabilism mistakes the *representation* of uncertainty for the *management* of uncertainty. By refusing to sharpen their credences, agents do not become more humble; they become permeable. In a world of strategic actors, ambiguity is not a shield. It is a handle.

