      "Precise Bayesian updating preserves expected uncertainty (martingale property).",
      "High variance in a precise distribution captures ambiguity without dilation."
    ],
    "the_regulator_case_in_one_line": "A bank can force a regulator's risk interval to widen simply by choosing which pre-approved announcement to release, paralyzing oversight.",
    "strongest_counter": "Dilation correctly reflects that ambiguous evidence should increase uncertainty, whereas sharp priors imply fake precision.",
    "why_it_still_fails": "Anticipated information cannot rationally increase expected uncertainty; precise variance captures ambiguity without violating probability laws.",
    "what_a_precise_bayesian_owes_instead": "A single probability distribution with high variance (honest error bars) that collapses model disagreement into a decision-ready expectation."
  }
  ```
