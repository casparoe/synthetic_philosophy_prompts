answer: |-
  **TO:** Forecast Governance Committee
  **FROM:** Staff Engineer, Risk-Analytics Platform
  **DATE:** Wednesday, October 25
  **SUBJECT:** Recommendations for Forecast Aggregation and Governance Protocol

  **Executive Summary**
  This memo recommends retaining the accuracy-weighted arithmetic mean (linear pooling) for aggregating panel submissions and repealing the mandatory reconciliation clause. For the current cycle (Question 7), I recommend recalculating the published probability excluding the contaminated 0.15 submission. These changes take effect immediately, with a full policy update by Q1. The following sections detail the operational reasoning, address the theoretical concerns regarding rational disagreement, and establish criteria for future oversight.

  **Pooling Rule: Retain Linear, Reject Log**
  We must retain the linear pooling rule (weighted arithmetic mean) and reject the proposed log pool (multiplicative rule).

  *Definitions:* **Linear pooling** averages probabilities directly. **Log pooling** multiplies odds ratios, heavily rewarding confidence. **Independence** assumes one analyst's data does not derive from another's output.

  The Head of Actuarial argues linear pooling is unstable under revision. While log pooling is mathematically stable when agents share a prior and pool independent evidence, our backtest demonstrates it fails in our operational environment. Over eight quarters, linear pooling achieved a 0.19 Brier score (lower is better) versus 0.24 for log pooling. More critically, the log pool's sensitivity to confidence penalizes uncertainty and amplifies dependency errors.

  We have confirmed that the 0.15 submission for Question 7 derives inputs from previous published numbers. This violates the independence assumption required for log pooling. Using log pooling here counts one opinion twice, artificially collapsing the aggregate toward zero (0.01). Linear pooling is robust to this dependency; it treats the submission as a single vote rather than a force multiplier. Until we can engineer input validation to guarantee independence, linear pooling remains the safer operational choice.

  **Reconciliation Clause: Repeal and Replace**
  I recommend repealing the reconciliation clause, which mandates convergence when submissions differ by >15 percentage points.

  *The Philosophical Question:* The CRO has asked whether people sharing a prior and evidence can rationally disagree. The clause assumes they cannot, relying on a theorem that requires **Common Knowledge**—where everyone knows the evidence, everyone knows everyone knows it, and so on ad infinitum. Our confidentiality rules prevent Common Knowledge. Analysts know the corporate baseline (shared prior), but they do not know how others interpret specific evidence packets. Therefore, rational disagreement is not only possible but expected. Enforcing convergence forces analysts to compromise accuracy for compliance.

  *Operational Reality:* The clause is broken. The update-failure log contains 41 open items; none were closed by genuine convergence. Analysts admit to private messaging to avoid triggering the clause. This creates a "poll" dynamic where numbers are pre-negotiated rather than independently derived, degrading calibration.

  *Mitigating Cherry-Picking:* The concern is that without the clause, business units will cherry-pick extreme values (e.g., 0.60) to avoid capital holds. We mitigate this not by forcing agreement, but by increasing transparency. We will publish the aggregate mean alongside the interquartile range (IQR). A wide IQR signals high uncertainty, warning stakeholders that the mean is noisy. This preserves the signal without manufacturing false consensus.

  **Action on Question 7**
  The 0.15 submission is contaminated by circular dependency (using past outputs as inputs). This violates the integrity of the forecast process.
  *Recommendation:* Recalculate Question 7 excluding the 0.15 submission.
  *Impact:* The linear mean shifts from 0.33 to 0.37. This remains above the 0.20 reserve tier break but removes the artificial drag caused by the contaminated model. Do not apply the log pool under any circumstances for this cycle.

  **Operational Criteria for Operations Lead**
  To distinguish a "defect" spread from "legitimate" uncertainty next quarter, apply the following criterion:
  *   **Legitimate Spread:** Submissions differ by >20 percentage points, but all analysts certify they used only approved evidence packets and no prior published outputs. Action: Publish mean and IQR; log the spread for review.
  *   **Defect Spread:** Submissions differ by >20 percentage points, and audit reveals use of unauthorized inputs (e.g., peer outputs, external non-vetted data) or failure to condition on the corporate baseline. Action: Flag submission as invalid, request revision, and withhold aggregate until corrected.

  This shifts the focus from *agreement* to *process integrity*.

  **Data Recording and Monitoring**
  To ensure this decision is revisable on evidence, we must start recording the following metadata for every submission, effective next cycle:
  1.  **Evidence Tags:** Analysts must tag which specific evidence packets influenced their deviation from the baseline.
  2.  **Input Hash:** A cryptographic hash of the input dataset used to generate the submission, allowing us to verify independence without viewing confidential data.
  3.  **Revision Log:** Timestamps of any changes made after initial submission.

  **Falsification Conditions**
  This recommendation is wrong if:
  1.  **Calibration Degrades:** The linear pool's Brier score exceeds 0.25 for four consecutive quarters post-implementation.
  2.  **Capital Volatility:** The inclusion of the IQR in reports leads to demonstrable arbitrage by business units (e.g., successful challenges of capital holds based on outlier picking) exceeding 5% of total exposure.
  3.  **Dependency Persists:** Input hashing reveals continued circular dependency in >10% of submissions despite validation rules.

  If any of these occur, we will convene an emergency session to reconsider the log pool or reinstate modified reconciliation requirements.

  **Conclusion**
  The current governance structure prioritizes theoretical consensus over empirical accuracy. By retaining linear pooling, we honor the backtest data. By repealing the reconciliation clause, we stop incentivizing private collusion. By excluding the contaminated estimate, we maintain pipeline integrity. This approach accepts that rational disagreement exists, manages the risk through transparency rather than suppression, and commits us to validating process integrity over enforcing numerical convergence.

  Please review prior to Thursday's session. I am available to walk through the recalculated Question 7 figures upon request.
