      *   *Vulnerability 1 (The Big One):* Evolution/Adaptation. If consciousness does nothing, why did it evolve? (Standard objection, but needs specific framing).
      *   *Vulnerability 2 (The Paradox):* How can I *know* I'm conscious if my consciousness doesn't cause my knowledge? (The core paradox).
      *   *Vulnerability 3 (Acquaintance):* Is "acquaintance" just a magic word? How does a non-physical relation confer warrant?
      *   *Vulnerability 4 (Zombies/Content):* If the zombie says "It seems red," and I say "It seems red," and the physical history is identical, how can the content differ? (Externalism vs. Internalism).
      *   *Vulnerability 5 (Psychology):* Introspection looks like a causal process (signal detection, metacognition). Confabulation shows we are often wrong about our reasons.
      *   *Vulnerability 6 (Illusionism):* If phenomenology is an illusion, there's nothing to be acquainted *with*.
      *   *Vulnerability 7 (Metaphysics):* Causal exclusion. If the physical is closed, and mental is distinct, mental is inert. But if mental is inert, how does it relate to truth?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Metaphysician - Early):* Causal Exclusion. If physical causes physical, and mental doesn't, how does mental track truth?
      *   *Objection 2 (Psychologist - Early/Mid):* Introspection as Process. We measure latency, noise, confidence. It looks causal.
      *   *Objection 3 (Physicalist/HOT - Mid):* The Zombie Content Problem. If syntax is identical, how is semantics different?
      *   *Objection 4 (Illusionist - Mid):* There is no "phenomenal property" to be acquainted with.
      *   *Objection 5 (Psychologist - Mid/Late):* Confabulation. We often claim reasons we don't have. Why trust acquaintance here?
      *   *Objection 6 (Metaphysician/Physicalist - Late):* Evolution/Adaptation. Why keep it if it does nothing?
      *   *Objection 7 (General - Late):* The "Magic" of Acquaintance. How does a non-causal relation justify belief?
      *   *Objection 8 (Psychologist/Physicalist - Overlap):* Reliability. If it's not causal, is it reliable?

      *Refining for Audience Voice:*
      *   Psychologists need to talk about "signal detection," "metacognitive monitoring," "generative models," "confabulation."
      *   Physicalists need to talk about "functional role," "nomic connection," "supervenience."
      *   Metaphysician needs to talk about "exclusion," "counterfactuals," "truth-makers."

      *Selecting the Top 8-10:*
      1.  Metaphysician: Exclusion/Tracking.
      2.  Psychologist 1: Introspection as causal mechanism.
      3.  Physicalist (HOT/GWT): Zombie content/function.
      4.  Illusionist: Error theory/Non-existence.
      5.  Psychologist 2: Confabulation/Unreliability.
      6.  Metaphysician/Physicalist: Evolution/Selection.
      7.  General: The nature of "Acquaintance" (Magic?).
      8.  Psychologist 3: Confidence ratings vs. Warrant.

      *Mapping Requirements:*
      *   "Acquaintance warrants without causing": Objection 7.
      *   "Zombie tokens differ": Objection 3.
      *   "Same worry, different vocab": Psychologist (Introspection mechanism) & Physicalist (Functional role).

  4.  **Drafting Replies & Weakness Notes:**
      *   Need to be concise (2 mins spoken).
      *   Need to be honest about where the argument is thin (the "candid note").
      *   *Key Strategy:* Stick to the "Acquaintance" bullet. It's a direct relation, not a causal chain.

  5.  **Drafting Closing Advice:**
      *   *Concessions:* Admit epiphenomenalism is costly. Admit "acquaintance" is primitive. This builds trust.
      *   *Metaphysician's Attack:* The "Systematic Coincidence" objection. If consciousness doesn't cause belief, the correlation between truth and belief is miraculous.
      *   *Dreaded Question:* "If your zombie duplicate says 'I am conscious,' is he lying?" (Or variations on the reliability of the theory itself). Actually, the best dreaded question is usually about the *theory's own warrant*. "Does your belief in epiphenomenalism rely on the very causal link you deny?"

  6.  **Review and Refine:**
