      *Wait, one more check on the "Zombie Content" objection.* The prompt specifically asks for an objection targeting the claim that zombie tokens differ in content. I need to make sure Objection 3 hits this hard. The argument is usually: Content is determined by causal history or functional role. If those are identical, content is identical. My reply must lean on the Acquaintance theory of content.

      *Check on "Acquaintance warrants without causing".* Objection 7 covers this.

      *Check on Concessions.* Don't concede the main point, but concede the *cost*. Epiphenomenalism is unpopular for a reason. Acknowledge that.

