answer: |-
  "Why does he drag such a cumbersome train?" asks the tourist.

  "It's an honest signal," says the behavioural ecologist. "Only fit males bear the cost."

  "But you told me yesterday that for a fit male, the cost is trivial. It's only prohibitive for the weak."

  "Precisely. Honesty is a matter of budget, not burden."

  "Then why doesn't he explain that?"

  "Because if he articulates the economic logic," whispers the ecologist, "he demonstrates surplus energy for lecturing rather than surviving. That makes the speech the true handicap, rendering the tail redundant."

  "So explaining honesty proves him dishonest?"

  "Yes. By justifying the waste, he commits a greater waste. Look, he's fanning out. He knows that talking about why he's high quality is the one thing a high-quality male cannot afford to do."

  ***

  **Note:** This punchline relies on points two and three: the differential cost of signalling across types and the paradox that explaining waste constitutes further waste. Swapping the peacock for a red deer's roar would weaken the joke, as the visual persistence of the train emphasises the absurdity of verbally justifying a physical trait.
