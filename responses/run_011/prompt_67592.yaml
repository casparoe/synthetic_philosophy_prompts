      *   *Correction on Claim 2:* Be careful not to exonerate Shylock entirely, but focus on the structural irony regarding interest.
      *   *Correction on Venice:* Emphasize that for Aristotle, money is a *tool* for exchange, whereas in Venice, money is a *subject* of risk.

  8.  **Final Review against Constraints:**
      *   Paraphrase scenes? Yes.
      *   No line refs? Yes.
