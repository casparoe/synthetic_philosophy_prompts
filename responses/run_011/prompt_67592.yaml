      *   **Audience:** Interdisciplinary seminar on the history of money. They know the plot but *not* Aristotle.
      *   **Task:** Test two specific claims made by the user, address where the play resists the lens (caskets, rings, Venice), and adhere to strict constraints.
      *   **User's Claims:**
          1.  *Measure-by-convention vs. Measure-in-kind:* Shylock's bond is a demand for "measure-in-kind" (substance itself) rather than convention. Portia's verdict shows this is impossible (flesh vs. blood).
          2.  *The Usury Paradox:* Shylock waives interest (not technically usury in this specific deal), while Antonio (the "virtuous" free lender) is the antagonist. Does the play know this, or is there a dislocation?
      *   **Resistance Points:** Casket episode (parody of commensuration?), Ring plot (incommensurable objects?), Venice (commercial complexity beyond Aristotle's barter origin story?).
      *   **Constraints:**
          *   Paraphrase scenes (no quotes).
          *   No line/act references.
          *   No bibliography/citations/names of scholars (describe positions instead).
          *   Keep faith with both texts (don't reduce play to theory, don't stretch theory to fit play).
          *   Acknowledge divergence plainly.
          *   Closing statement: What the play adds to the debate that theory alone cannot.

  2.  **Deconstruct Aristotle (for the Audience):**

      *   Need to explain *Politics* Book I: *Oikonomia* (household management) vs. *Chrematistike* (wealth-getting). Natural vs. Unnatural.
      *   Money's purpose: Medium of exchange to satisfy need.
      *   Usury (*tokos*): Money breeding money. Most unnatural because it divorces money from use/need.
      *   *Nicomachean Ethics* Book V: Justice in exchange. Need (*chreia*) holds the city together. Money is a convention (*nomisma*) to make unlike things commensurable. Money can become worthless (conventional).

  3.  **Evaluate Claim 1: Measure-by-Convention vs. Measure-in-Kind:**

      *   *Aristotle's view:* Money is a measure by convention. It allows shoes and houses to be compared via need.
      *   *User's view:* Shylock wants "measure-in-kind" (flesh itself). Portia shows flesh cannot be separated from blood/life, so commensuration fails.
      *   *Analysis:* This is a strong reading. Aristotle argues money *replaces* the need for direct substance exchange. Shylock tries to revert to a literal substance exchange but treats that substance as a measurable commodity. Portia points out that human substance isn't divisible like currency.
      *   *Verdict:* Aristotle could support the idea that demanding substance *as* measure is a category error, but he focuses on money as the *solution* to the awkwardness of substance. The user's distinction is compatible but extends Aristotle. It's not a bend, it's an application.

  4.  **Evaluate Claim 2: The Usury Paradox (Shylock vs. Antonio):**

      *   *The Twist:* Shylock charges no interest on *this* loan. Antonio charges no interest ever.
      *   *Aristotle's view:* Interest is unnatural. Free lending is better (friendship/civic bond).
      *   *The Play's view:* Antonio is virtuous in lending but vicious in behavior (spitting, insulting). Shylock is victimized but seeks lethal revenge.
      *   *Dislocation:* Aristotle would likely side with Antonio's *economic* practice (gratis lending) but condemn his *character*. The play suggests "gratis" lending isn't inherently virtuous if it's used to undermine another's livelihood or mask contempt.
      *   *Verdict:* The play knows what it's doing. It complicates the moral binary. Aristotle provides the economic taxonomy; Shakespeare provides the psychological and social reality. The dislocation is real: Aristotle judges the *act* of interest; Shakespeare judges the *human relation* behind the act.

  5.  **Evaluate Resistance Points:**

      *   *Caskets:* Gold, Silver, Lead. Choices based on appearance vs. value.
          *   *Aristotle:* Money is conventional.
          *   *Play:* Precious metals deceive. Value is internal (portrait/scroll).
          *   *Fit:* Good fit. It critiques trusting the "measure" (metal) over the "need/substance" (love/merit).
      *   *Rings:* Given away, then demanded back.
          *   *Aristotle:* Objects should be exchangeable based on need.
          *   *Play:* Rings are tokens of fidelity, explicitly *not* to be exchanged.
          *   *Fit:* Divergence. Aristotle sees non-exchangeable goods as outside economics. Shakespeare sees them as *higher* than economics. It's not a confusion; it's a hierarchy.
      *   *Venice:* Risk, venture capital, sea trade.
          *   *Aristotle:* Money arose because barter was hard over distance.
          *   *Play:* Money is risk capital. It's not just a medium; it's an engine of speculation.
          *   *Fit:* Major divergence. Aristotle's static view of "need" doesn't capture "risk" or "future returns." Venice is a world Aristotle couldn't conceive.

  6.  **Drafting - Section by Section (adhering to constraints):**

      *   *Introduction:* Set up Aristotle clearly for the uninitiated. Define *oikonomia* vs. *chrematistike*. Define money as convention/measure of need.
      *   *Claim 1 (Flesh/Measure):* Explain the distinction. Show how Portia's legal trap exposes the impossibility of "measure-in-kind" for living substance. Connect to Aristotle's idea that money exists *because* measuring substance directly is flawed.
      *   *Claim 2 (Usury/Antonio):* Address the irony. Shylock's "merry bond" avoids interest. Antonio's free lending is economically "natural" but socially corrosive. Acknowledge the dislocation: Aristotle judges the transaction; Shakespeare judges the relationship.
      *   *Resistance (Caskets, Rings, Venice):*
          *   Caskets: Yes, parody of commensuration.
          *   Rings: No, not confusion, but a different order of value (incommensurable by design).
          *   Venice: Yes, Aristotle lacks the category for risk/venture.
      *   *Conclusion:* What does the play add? It shows the *human cost* of abstraction. Theory deals with units; drama deals with bodies and bonds.

  7.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I quote? *No.*
