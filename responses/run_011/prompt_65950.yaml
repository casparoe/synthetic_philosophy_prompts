answer: |-
  You're worrying that if the rebuke is permissible, the junior colleague is left with nothing but a complaint about style. But that assumes the only thing that matters in blame is whether the words are allowed to be spoken. I think blame is a specific kind of moral transaction, like making a promise or issuing a verdict. If I promise you something I have no intention of keeping, the promise might be permissible in the sense that no one will arrest me for saying it, but it's a defective promise. It doesn't bind me, and you'd be right to treat it as hollow. The chair's rebuke is similar: he is attempting to invoke a normative authority he does not possess. The defect isn't in the tone or the timing; it's in the claim he makes to occupy a certain moral position relative to her.

  So what does it cost the chair, and who notices? It costs him the authority to demand uptake. When you blame someone, you aren't just stating facts; you're demanding they acknowledge the wrong and feel the force of the standard. A hypocrite loses the right to make that demand. The junior colleague can look him in the eye and say, "You are right that I padded the report, but you cannot call me to account for it." She isn't denying the facts; she's refusing the relationship his blame tries to establish. The cost is paid in the currency of moral authority, and the department notices when a leader's calls for accountability ring hollow because he exempts himself. They see that his blame lacks the power to obligate her response in the way proper blame does.

  This is why standing governs aptness rather than permissibility. We don't gag hypocrites; sometimes their warnings are useful, and silencing them would be too high a price. But we recognize their blame as structurally flawed. It's like a true assertion made without knowledge—you might be right, but you weren't in a position to assert it as knowledge. The chair's rebuke is true, but it lacks the normative backing to function as proper blame. That's not a stylistic quibble; it's a failure of the act to achieve its intended normative end. The junior has a grievance precisely because she is being subjected to a performance that pretends to an authority it lacks, and that pretension is something she is entitled to reject.
