  **The Case: The Cooling Lodestone**

  Consider a naturally occurring chunk of magnetite cooling in a geomagnetic field. The candidate parts are the iron atoms within the lattice; the candidate whole is "The Magnet." Below the Curie temperature ($T_c \approx 580^\circ\text{C}$ for magnetite), thermal agitation prevents long-range order, and the atomic magnetic moments are randomly oriented. As the rock cools through $T_c$, the exchange interaction overwhelms thermal energy, and the spins spontaneously align, locking the rock into a ferromagnetic state. This alignment is a second-order phase transition. In the thermodynamic limit, the onset of spontaneous magnetization is mathematically sharp at $T_c$; it is not a gradient but a symmetry breaking defined by physical constants. The candidate whole ("The Magnet") possesses a causal power—the ability to deflect a compass needle at a distance—that the disordered parts individually lack in that configuration. However, the deflection is fully physically accounted for by the vector sum of the magnetic moments of the individual electrons and their spatial arrangement. The parts are integrated not merely by contact (they are bonded regardless of temperature) but by this specific dynamical state of spin coherence.

  **The Demonstration**

  **Verdicts:**
  *   **Nihilism:** Denies the Magnet exists. Only the atoms exist. The compass deflection is caused by the atoms collectively, not a whole.
  *   **Universalism:** The atoms compose an object regardless of temperature. The "Magnet" is just the object at a different time. The object exists below $T_c$, it just lacks magnetic properties.
  *   **Van Inwen (Lives):** No life processes are occurring. Composition does not occur. Verdict matches Nihilism.
  *   **Contact/Fastening:** The atoms are chemically bonded. Composition occurs *before* cooling, when the rock solidified. The "Magnet" is not a new object, just the old rock in a new state.
  *   **Brute Composition:** Composition occurs, but there are no conditions. Whether the atoms compose the Magnet is a brute fact, likely tracking our intuition that the Magnet is a salient object.

  **Why the Vagueness Argument Fails:**
  The Vagueness Argument claims any restricted composition principle is either vague (leading to vague identity) or arbitrary (no reason to draw the line *here*). In this case, the restrictionist draws the line at $T_c$. This line is not arbitrary; it is fixed by the fundamental constants governing the exchange interaction and thermal energy. It is not a linguistic stipulation but a physical singularity. While real-world finite-size effects mean the transition smears slightly (addressed below), the *principle* of composition is not open to the "arbitrariness" charge. The restrictionist can say, "Composition occurs when physical law dictates a state change," which is as non-arbitrary as metaphysics gets. The argument fails to grip because the cut-off is discovered, not decided.

  **Why the Overdetermination Argument Bites:**
  The causal work attributed to "The Magnet" (deflecting the needle) is exhaustively explained by the causal work of the aligned electrons. The magnetic field is the sum of the dipole fields. If we posit "The Magnet" as an additional entity over and above the atoms, it contributes no new force, no new energy, and no new trajectory to the needle. It is causally redundant. If the Magnet exists, the needle's motion is systematically overdetermined (once by the atoms, once by the Magnet). If we deny the Magnet exists (Nihilism), the overdetermination vanishes. The Brute Composition view cannot explain away this redundancy; simply asserting "composition is brute" does not grant the whole independent causal powers. The overdetermination remains systematic and benign only if you accept universal overdetermination, but for a restrictionist trying to save common sense, it looks like an ontological free lunch.

  **Key Features and Removal:**
  1.  **The Sharp Threshold ($T_c$):** This feature blocks the Vagueness Argument. If you remove it (e.g., replace the phase transition with a gradual cooling where alignment increases linearly), the Sorites paradox returns. You can no longer point to a law-governed moment of composition, and the "Arbitrariness" horn of the Vagueness Argument bites again.
  2.  **Causal Exhaustion by Parts:** This feature enables the Overdetermination Argument. If you remove it (e.g., if the Magnet exerted a "holistic" force not reducible to the sum of dipoles), the exclusion premise fails. The whole would have unique causal powers, justifying its existence despite the cost. But this would violate physical closure.

  **The Worst View's Attack:**
  The **Brute Composition** view comes out worst here because it claims to dissolve the Special Composition Question entirely, yet it offers no resources against the causal exclusion worry. A Brutalist would attack the case by refusing to engage with the physics, insisting that "causal exclusion is a category mistake" or "composition doesn't require causal novelty." This is less an objection and more a refusal to play by the rules of the overdetermination argument. They have no resources beyond repeating that there are no informative conditions for composition. This leaves them vulnerable: they avoid the Vagueness Argument by fiat, but they swallow the Overdetermination Argument whole. They must accept that for every lodestone, there is a causally redundant entity sitting on top of the atoms.

  **Stipulations and Idealizations:**
  I stipulated that the "Magnet" is a candidate *material object* rather than a *state* of the rock. Physics treats it as a state; metaphysics is being asked to treat it as an object. I also relied on the thermodynamic limit for sharpness. In a finite chunk of magnetite, the phase transition is not perfectly sharp; susceptibility peaks over a small temperature range. A Sorites series *does* creep back in at finite scale regarding the exact degree of alignment required. However, the *principle* remains non-arbitrary (it tracks the peak susceptibility), which is sufficient to blunt the "Arbitrariness" horn of the Vagueness Argument, even if the "Vagueness" horn nicks the edge. The case survives de-idealization well enough to show the *independence* of the two arguments: the physical principledness remains even if the sharpness blurs, but the causal redundancy remains regardless of the blur.
