prompt: |-
  I'm TAing a master's-level seminar on the metaphysics of material objects and the professor has handed me the last two sessions to run myself. We've already ground through the usual suspects — statue and lump, the Ship of Theseus, heaps and the sorites, scattered objects on opposite sides of the galaxy — and honestly the students can recite the dialectic better than I can at this point. For the final session I want to make one specific point, which is that the two big arguments against a restricted answer to the special composition question are independent of each other: the vagueness/arbitrariness argument (any restriction is either vague or precisified at a point that looks arbitrary, and vague composition seems to drag vague identity in with it), and the causal-overdetermination argument (if the xs compose y, then y's causal work is already done by the xs, so either everything is systematically overdetermined or composition never happens). The standard defensive move is to say composition is just brute — there are no non-trivial necessary and sufficient conditions, full stop — which kills the first argument dead and, as far as I can tell, doesnt do anything whatsoever about the second. I want a thought experiment that puts that asymmetry on the table where they can see it.

  So: build me a case where the vagueness argument can't get a grip but the overdetermination argument still bites at full strength. Specs. (i) There has to be a sharp, physically principled cut-off for when the candidate parts compose the candidate whole — not a cut-off I declare by fiat. A genuine critical threshold would be ideal: onset of collective synchrony, a phase transition, some threshold condition in quantum mechanics, whatever you think actually delivers sharpness rather than a gradient in disguise. (ii) If that sharpness only exists in an idealization — infinite system size, perfect isolation, zero temperature — say so plainly and tell me whether the case survives being de-idealized or whether a sorites creeps back in at finite scale. (iii) The candidate whole should be a natural system: no artifacts, no organisms, nothing alive, so that neither the restriction to lives nor common-sense realism about tables and chairs is on offer as a rescue; and the parts should be integrated in some way that isn't mere physical contact, so a contact-or-fastening view can't claim the case either. (iv) Everything the whole does causally has to be fully accounted for by the parts and their interactions, so the exclusion step goes through cleanly. Constraints: realistic physics, no sci-fi machinery, the scenario itself should be one or two paragraphs, and don't lean on ships, statues and lumps, heaps, fission or fusion, or the scattered-objects setup. Also don't smuggle the verdicts in by stacking constraints until only one view is left standing — I want the theories generating the answers, not the setup guaranteeing them. No citations or reading list, I just want the reasoning.

  Then do the demonstration so I can see the design actually works. Give the verdict each of these returns on your case and why: nihilism, universalism, van Inwagen's restriction to lives, a contact-or-fastening restriction, and the brute-composition view. Spell out exactly where the vagueness argument fails to engage — which feature of the case blocks it — and then write out the overdetermination step as it applies to your specific case rather than in the abstract, including whether the overdetermination here looks systematic or benign. Tell me which single feature is doing the work in each direction, and what happens to the case if you pull that feature out: does it collapse back into one of the standard cases we already covered? Finish with how the view that comes out worst would attack the case — whether the attack is a real objection or just a refusal to play — and, specifically, whether a brutalist has any resources against the causal argument beyond repeating that there are no informative conditions for composition. Flag anything you had to stipulate rather than derive.
