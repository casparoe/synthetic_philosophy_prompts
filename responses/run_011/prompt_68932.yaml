  ### MEMORANDUM

  **TO:** Board of Residents
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memorandum: Request for Release from Undertakings

  **1. Recommendation and Sequencing**

  I recommend the Board vote to deny the resident's request for release from the work-support and confidentiality agreements effective immediately. This decision must be final for the current case to ensure institutional stability. Second, the Board should vote to reject the proposal to adopt the psychological-continuity instrument as a general test for contractual obligation, confining its use strictly to the original pilot scope regarding safety and financial capacity. Third, we should refer the "Continuity of Undertaking" clause to the Governance Committee for prospective redrafting. The committee should clarify that "persistence" refers to biological and legal continuity, not metaphysical selfhood. This sequencing allows us to resolve the immediate crisis under existing terms while preventing future ambiguity. The vote on the release should occur at the start of the meeting; the policy changes should follow once the case is closed.

  **2. Reasoning on the Doctrinal Claim**

  The resident's argument is philosophically serious: she claims that intensive practice has dismantled the sense of a permanent ego, such that the person who signed the contract no longer exists. While this aligns with certain interpretations of the no-self doctrine, it conflates two levels of truth recognized within the tradition itself. Buddhist philosophy distinguishes between "ultimate truth," which recognizes the emptiness of inherent existence, and "conventional truth," which governs everyday reality where cause, effect, language, and promises operate.

  The tradition consistently holds that realizing no-self does not negate conventional obligations. Ethical conduct and the keeping of promises are prerequisites for, not casualties of, deep practice. The law of karma presupposes continuity of agency; actions have consequences across time even if the "actor" lacks inherent essence. To rule in her favor would be to assert that spiritual realization exempts one from social contracts, a position most lineages reject. Furthermore, this Board is a secular administrative body, not a doctrinal authority. We lack the standing to adjudicate whether her practice has successfully eliminated her self. Validating her claim would require us to certify her spiritual status, which risks turning the Board into a council of enlightenment judges—a role we are neither qualified nor authorized to fill. We must treat the "self" for contractual purposes as the legal person identified by her signature and biological continuity.

  **3. Matters for Refusal**

  The Board should explicitly refuse to decide whether the resident has achieved a state of no-self or whether her psychological changes constitute a metaphysical discontinuity of personhood. These are theological and metaphysical questions outside our administrative jurisdiction. Deciding them would set a precedent requiring the Board to evaluate the spiritual depth of future residents, entangling the center in doctrinal policing. Our mandate is to maintain the residential community's functioning, not to verify enlightenment. By refusing this question, we protect the integrity of the practice from administrative interference while upholding the secular agreements that keep the center running. We are not ruling on her soul; we are ruling on her signature.

  **4. Disposition of the Instrument Proposal**

  The Board should reject the proposal to use the psychological-continuity instrument as a general test for contractual obligation. While useful for assessing fitness to drive or manage finances, applying it to personal identity reduces complex moral and legal relationships to a numerical score. Personal identity in a legal context is binary: you are either the same legal entity or you are not. Introducing a graded scale creates administrative chaos; would a resident be 60% bound by a confidentiality agreement? Moreover, using a psychological test to dissolve obligations invades privacy and invites residents to manipulate scores to escape duties. The instrument should remain confined to its original safety-related purpose.

  **5. Strongest Counter-Consideration and Response**

  Proponents of granting the request will argue that holding her to the agreement violates the very spirit of the practice she has undertaken, and that there is a risk of bad faith—that she is using doctrine as a pretext to leave for a new job. They will also highlight the third party whose confidentiality is at stake, arguing that if the signer is "gone," the promise may be void.

  This consideration is strongest regarding the third party. Regardless of the resident's internal state, the confidentiality undertaking protects another person who cannot consent to its release. That third party's right to privacy relies on the stability of the agreement, not the metaphysical status of the signer. Even if the resident feels transformed, the harm of disclosure remains real for the other resident. Regarding bad faith: while we cannot prove her motive, the structural harm of allowing doctrinal claims to void contracts outweighs the suspicion of opportunism. If we allow spiritual transformation to void agreements, we undermine the trust necessary for the community to function. The reliance interest of the community and the privacy rights of the third party must take precedence over individual metaphysical claims. We can deny the release without judging her sincerity, based solely on the objective harm to others and the institution.

  **6. Conclusion**

  Deny the release. Reject the instrument for this use. Redraft the clause prospectively. This upholds our secular mandate, respects the tradition's own distinction between convention and ultimate reality, and protects the community's reliance interests.
