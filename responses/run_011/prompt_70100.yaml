prompt: |-
  I've been on my college's student hardship fund committee for three years now — six of us, two faculty, two admin staff, two student reps, and we meet every couple of weeks to divide up a pot that's roughly forty grand a term. The remit we were handed when the fund was set up says we exist "to make sure no student is held back at this university by their financial situation," and I promise you that basically every argument we have is secretly an argument about what that sentence is doing. Nobody on the committee has any philosophy training, including me (I do a lot of googling at 11pm), but we've built up a body of decisions over the last few years and I want to work out what theory we're actually running, because we're supposed to write a public guidance doc at the end of term and I don't want us to publish something we'd be embarrassed by.

  Our track record, as best I can reconstruct it: (a) a student whose family business collapsed mid-semester, we covered his tuition and living costs for the full year, no debate; (b) last year we turned down an almost identical request from a guy whose own income was just as low but whose parents are both well-paid and had simply decided to stop supporting him — we said household resources count, not just his personal bank balance, and he was furious and said we were means-testing his family rather than him; (c) we fund a standard laptop for anyone whose coursework needs one and we do not means-test that at all, and on the same logic we funded a note-taker, a specialist screen-reader setup and a bunch of extra transport costs for a Deaf student from a comfortably-off family — that whole package cost maybe five times our biggest hardship grant; (d) a student asked us to upgrade his standard-issue machine to a high-spec one because the base model "can't do what I need," and when we pushed, what he needed was 4K video editing and gaming, so we said no — but the very same term we did pay for a beefier machine for a music production student whose assignments required rendering, and for a dentistry student who needed specific CAD software; (e) a student who took a £1,500 award from us, put it into crypto and lost all of it came back for a second award and we refused him, while that same term a student whose landlord ran off with her deposit and two months of rent got a second award from us without a moment's hesitation; (f) twice now we've funded things purely on the grounds that someone looked likely to not finish their degree — a carer's grant for respite hours and bus fares, and a payment to cover the costs of a mandatory unpaid placement — even though neither of those applicants scored badly on the wellbeing question we ask on the form.

  Now this week's round, and we have money to do one of these properly, not both. Applicant A is a mature student, 34, first in her family to go to uni, works nights in a care home, no dependants, and she is miles below everyone else on our financial-need ranking — bottom decile easily, and that's counting her as a household of one like we do in (b). Her grades are fine, her attendance is fine. She's asked only for the standard laptop, and in the optional box on the form where we ask how she's doing she wrote that she's genuinely happy, that things are good, and that she doesn't want to take money away from anyone worse off than her. Applicant B is 20, second year, finances mid-range — above the median of our applicants, below the university average. She's miserable and anxious, says so plainly, has missed two deadlines, is on an informal academic warning, and wants a rent top-up so she can drop from twenty hours of work a week to ten. The two student reps have already said out loud that they'll vote for B "because she's the one actually suffering," one of the admin staff has said that A is objectively the poorest person we'll see all year and it would be indefensible to skip her, and the faculty chair keeps asking what "held back" means in our own remit, which is unhelpful at 4pm on a Thursday. Two of the reps have also started throwing around the phrase "adaptive preferences" about A, and one of them pushed back with what I thought was a decent line — that this is just a polite way of telling a 34-year-old woman that she's wrong about her own life. I keep wanting to say both that A's contentment shouldn't count because she's been taught to want little, and that B's distress should count because it's real and present, and I'm aware those two intuitions can't both be as obviously right as they feel.

  So: what rule, or what mixture of rules, is our committee actually operating? I'd like the candidate metrics spelled out properly — I know there's a whole debate about what the equalisandum should be, welfare versus resources versus capabilities, plus the responsibility-sensitive versions of each — and I want to know which of those survive all six of our precedents, which get killed by which precedent, and whether any of our past decisions have to be written off as one-off mistakes rather than evidence. Then tell me what each surviving rule says about A versus B, give me your best guess at how we'll actually vote and why, and if the precedents genuinely underdetermine it, say plainly what principle we'd be committing ourselves to with each choice — because that's the thing that'll end up in the guidance doc. Finally, design me one further hypothetical application, cheap to describe, that would split the surviving rules cleanly apart, so we can use it as a test case next term.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a member of a college student hardship fund committee (6 members: 2 faculty, 2 admin, 2 student reps).
      *   **Budget:** ~£40k/term.
      *   **Remit:** "To make sure no student is held back at this university by their financial situation."
      *   **Task:**
          1.  Identify the underlying ethical/political theory the committee is *actually* operating under based on 6 precedents (a-f).
          2.  Evaluate candidate metrics (Welfare, Resources, Capabilities, Responsibility-sensitive versions) against these precedents.
          3.  Determine which theories survive and which are killed by which precedents.
          4.  Apply surviving rules to the current dilemma (Applicant A vs. Applicant B).
          5.  Predict the likely vote/outcome.
          6.  Identify the principle being committed to if the precedents underdetermine the choice.
          7.  Design a new hypothetical test case to split the surviving rules cleanly for future guidance.
      *   **Tone:** Analytical, philosophical but grounded in practical committee dynamics, respectful of the user's intelligence (they've done the googling), and direct.

  2.  **Deconstruct the Precedents (a-f):**
      *   *(a) Family business collapse:* Full support. *Implication:* Sudden external shock trumps prior status. Need is dynamic.
      *   *(b) Wealthy parents cut off support:* Rejected. Household resources count. *Implication:* Not just individual cash flow; potential access to resources matters. Responsibility lies partly on family network (or at least, the fund isn't a substitute for parental choice). *Anti-Libertarian/Individualist.*
      *   *(c) Disability/Accessibility (Deaf student):* Funded high costs despite wealthy family. *Implication:* Needs related to *participation* trump financial need. Equality of opportunity/access > Equality of welfare/resources.
      *   *(d) Laptop specs (Gaming vs. Coursework):* Rejected gaming/upgrades not needed; Accepted course-specific high specs (Music/Dentistry). *Implication:* Funds must be instrumental to academic success, not preference satisfaction. "Held back" = academic barrier.
      *   *(e) Crypto loss vs. Landlord theft:* Rejected crypto (bad choice); Accepted landlord theft (victim of circumstance). *Implication:* Responsibility sensitivity. Bad optionality choices reduce entitlement; bad luck increases it.
      *   *(f) Retention/Completion (Carer/Placement):* Funded to prevent dropout, even if wellbeing scores were okay. *Implication:* The goal is *completion/retention*, not just alleviating distress. "Held back" means "forced to quit."

  3.  **Evaluate Ethical Frameworks against Precedents:**

      *   **Strict Egalitarianism (Equality of Resources):**
          *   *Idea:* Everyone should have the same money/assets.
          *   *Conflict:* Precedent (c) (Deaf student got 5x more). Precedent (d) (Different laptops for different courses).
          *   *Verdict:* **Killed.**

      *   **Strict Utilitarianism (Equality of Welfare/Suffering):**
          *   *Idea:* Maximize happiness/minimize suffering.
          *   *Conflict:* Precedent (f) (Funded people who weren't miserable). Precedent (e) (Crypto guy suffered loss, but rejected). Precedent (b) (Rich kid cut off might suffer, but rejected).
          *   *Verdict:* **Killed.**

      *   **Luck Egalitarianism (Responsibility-Sensitive):**
          *   *Idea:* Compensate for bad luck, not bad choices.
          *   *Fit:* Precedent (e) fits perfectly (Crypto = choice, Landlord = luck). Precedent (a) fits (Business collapse = luck). Precedent (b) fits (Parents' choice = not fund's responsibility?).
          *   *Conflict:* Precedent (c) is tricky. Is disability bad luck? Yes. But wealthy family means they *could* pay. Luck egalitarianism usually looks at *all* resources. However, if the "bad luck" is the disability creating extra costs, it fits.
          *   *Verdict:* **Strong Contender.**

      *   **Capability Approach (Sen/Nussbaum):**
          *   *Idea:* Focus on what people are actually able to *do* and *be* (functionings). "Held back" = conversion factors.
          *   *Fit:* Precedent (c) fits perfectly (Disability affects conversion of resources to function). Precedent (d) fits (Tools needed for specific functionings/degrees). Precedent (f) fits (Retention = capability to complete degree).
          *   *Conflict:* Precedent (b) is the tension point. Does the capability approach ignore parental wealth? Usually, it looks at *available* capabilities. If parents *can* pay but *won't*, the capability is technically blocked by social norms/family dynamics. But the committee treated parental wealth as a bar.
          *   *Verdict:* **Strong Contender (specifically "Academic Capability").**

      *   **Prioritarianism (Prioritize the Worst Off):**
          *   *Idea:* Give weight to the least advantaged.
          *   *Fit:* Precedent (a) fits.
          *   *Conflict:* Precedent (c) (Wealthy Deaf student got priority over potentially poorer non-disabled). Precedent (f) (Wellbeing scores didn't matter).
          *   *Verdict:* **Killed** (as a sole metric).

      *   **Institutional Mission Theory (The "Remit" Approach):**
          *   *Idea:* The specific goal is "no student held back... by financial situation." This implies a counterfactual: Would they succeed if money weren't an issue?
          *   *Fit:* Explains (d) (Course needs), (f) (Retention), (c) (Accessibility).
          *   *Conflict:* (b) implies "financial situation" includes family capacity, not just current cash.
          *   *Verdict:* **The actual operating theory.** It's a hybrid of Luck Egalitarianism and Capability Approach, bounded by Institutional Mission.

  4.  **Synthesize the Committee's "Actual" Theory:**
      *   It's not pure Welfare (B's misery doesn't guarantee funding).
      *   It's not pure Resources (A is poorest, but might not win; C got more than poor people).
      *   It is **Responsibility-Sensitive Academic Capability.**
      *   *Core Metric:* Financial barrier to *academic completion* (Capability), adjusted for *personal responsibility* (Luck Egalitarianism).
      *   *Constraint:* Household resources are considered part of the "financial situation" (rejecting pure individualism).

  5.  **Analyze Applicant A vs. Applicant B:**
      *   **Applicant A:**
          *   Resources: Very Low (Prioritarian win).
          *   Capability/Barrier: Low (Has laptop, grades fine, happy). Money won't change academic outcome much.
          *   Responsibility: High (Working nights, managing well).
          *   Theory Verdict: Low priority. She isn't being "held back" academically *right now*.
      *   **Applicant B:**
          *   Resources: Mid (Not worst off).
          *   Capability/Barrier: High (Missing deadlines, academic warning, work interfering with study). Money removes the barrier (reduce work -> study).
          *   Responsibility: Mixed (Finances mid-range, but work/study balance is the issue).
          *   Theory Verdict: High priority. Money directly converts to academic retention.
      *   **The Conflict:** A fits "Hardship" (poverty). B fits "Held Back" (academic risk).
      *   **The Remit:** "Held back... by financial situation."
      *   **Analysis:** A is poor but *not* held back. B is less poor but *is* held back.
      *   **Prediction:** Committee votes for **B**. Why? Because precedents (d) and (f) establish that *academic impact* trumps *pure poverty*. Precedent (c) shows we fund barriers to access, not just poverty. Precedent (e) shows we care about how money is used to solve problems, but B's problem is structural (work vs. study).
      *   **The "Adaptive Preferences" Argument:** The student reps are right to be wary, but the *Remit* saves them. It's not about telling A she's wrong; it's about the fund's specific purpose. If the fund was "Poverty Alleviation," A wins. If the fund is "Academic Retention via Financial Aid," B wins. The precedents (d, f) strongly support the latter.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the dilemma. Validate their intuition that they are doing political philosophy without knowing it.
      *   *Section 1: The Autopsy.* Map the precedents to theories.
          *   Kill Utilitarianism (f, e).
          *   Kill Strict Resourcism (c, d).
          *   Keep Luck Egalitarianism (e, a).
          *   Keep Capability Approach (c, d, f).
          *   *Conclusion:* You are "Mission-Bound Capability Egalitarians with Responsibility Constraints."
      *   *Section 2: A vs. B.* Apply the theory.
          *   A: High Need, Low Academic Barrier.
          *   B: Med Need, High Academic Barrier.
          *   The Remit is the tiebreaker. "Held back" implies a counterfactual of failure. A isn't failing. B is.
      *   *Section 3: The Vote.* Predict B. Explain the friction (A feels unfair, but B fits the *rules* better). Address the "Adaptive Preferences" point carefully.
      *   *Section 4: The Guidance Doc Principle.* Be explicit. You are committing to "Academic Necessity over Alleviation of Distress."
      *   *Section 5: The Test Case.* Need a scenario that splits "Capability/Retention" from "Responsibility/Luck."
          *   *Idea:* A student who made a bad choice (Responsibility) but it now threatens retention (Capability).
          *   *Scenario:* Student took a high-interest loan for a wedding (choice) vs. Student took loan for medical emergency (luck). Both now face dropout due to repayments.
          *   *Refinement:* Let's make it cleaner. Student X failed a module due to illness (Luck) and needs to retake (costs money). Student Y failed a module due to skipping class to work (Choice/Responsibility) and needs to retake. Both need fees to retake. Both will drop out without it.
          *   *Better Split:* Split "Capability" from "Resource Equality."
          *   *Hypothetical:* Two students need £500. Student C is poor but the money is for a club trip (enrichment). Student D is middle-class but the money is for a mandatory field trip (graduation requirement).
          *   *Wait, I need to split the SURVIVING rules.* The surviving rules are Luck Egalitarianism + Capability.
          *   *Split:* A case where Bad Luck leads to Low Capability vs. Bad Choice leads to Low Capability.
          *   *Hypothetical:* Student E (Bike stolen - Luck) can't get to placement. Student F (Sold bike for concert tickets - Choice) can't get to placement. Both need £300 for a new bike. Both will fail placement without it.
          *   *Why this works:* Capability says fund both (barrier to completion). Luck Egalitarianism says fund E, not F. Precedent (e) suggests Luck Egalitarianism wins. But Precedent (f) suggests Retention wins. This forces a choice between "Punishing Bad Choices" vs. "Ensuring Completion."

  7.  **Refining the Output:**
      *   Ensure the tone is professional yet conversational (committee colleague to committee colleague).
      *   Make sure the "Adaptive Preferences" point is addressed philosophically (Sen/Nussbaum).
      *   Ensure the distinction between "Hardship Fund" and "Retention Fund" is clear.

  8.  **Final Review against constraints:**
      *   Did I spell out candidate metrics? Yes.
      *   Did I say which survive/killed? Yes.
      *   Did I apply to A vs B? Yes.
      *   Did I predict the vote? Yes.
      *   Did I identify the principle for the guidance doc? Yes.
      *   Did I design the test case? Yes.

      *(Self-Correction during drafting)*: I need to be careful with Precedent (b). It contradicts pure Luck Egalitarianism if we view parental refusal as "bad luck" for the student. But the committee treated it as "resources available." I should frame this as "Household Capability" rather than individual.
      Also, regarding A vs B: The "Adaptive Preferences" argument is strong. If A is happy because she expects little, is she *really* not held back? But the data says "grades are fine." So objectively, she isn't being held back academically. I need to emphasize that distinction. The fund isn't a UBI; it's a barrier removal tool.

      *Test Case Refinement:* The Bike scenario is good. It pits Precedent (e) (Responsibility) against Precedent (f) (Retention). If they fund F, they abandon Responsibility. If they don't fund F, they abandon Retention. That's the clean split.

      *Let's write it.*
answer: |-
  This is a remarkably clear-sighted description of a committee stumbling through applied political philosophy. You are correct: you are not arguing about money; you are arguing about the *equalisandum* (what exactly are we trying to equalize?) and the *currency of justice* (what counts as a valid claim?).

  Here is the autopsy of your committee's ethical framework, the verdict on Applicants A and B, and the tool you need for your guidance document.

  ### 1. The Autopsy: What Theory Are You Running?

  You have six precedents. Let's run them against the standard metrics of distributive justice to see what survives.

  **Candidate Metric 1: Strict Egalitarianism (Equality of Resources)**
  *   *Theory:* Everyone should have the same material baseline.
  *   *Verdict:* **Killed by Precedent (c).** You gave a wealthy Deaf student five times the resources of a poor student. You explicitly rejected resource equality in favor of need-based differentiation.

  **Candidate Metric 2: Utilitarianism (Equality of Welfare/Suffering)**
  *   *Theory:* Maximize wellbeing/minimize distress.
  *   *Verdict:* **Killed by Precedent (f) and (e).** In (f), you funded students who reported okay wellbeing. In (e), you refused a student who was presumably distressed by losing everything to crypto. You have established that *suffering* is not the primary metric.

  **Candidate Metric 3: Prioritarianism (Prioritize the Worst Off)**
  *   *Theory:* Give absolute priority to those with the least resources.
  *   *Verdict:* **Killed by Precedent (c) and (d).** You funded a wealthy disabled student over potentially poorer abled students. You funded specific course needs over general poverty. Being the "poorest" (Applicant A's strength) is a strong factor, but not a trump card.

  **Candidate Metric 4: Luck Egalitarianism (Responsibility-Sensitive)**
  *   *Theory:* Compensate for "brute luck" (circumstances beyond control), not "option luck" (consequences of choices).
  *   *Verdict:* **Survives.** This explains Precedent (e) perfectly (Crypto = choice, Landlord = luck). It explains Precedent (a) (Business collapse = luck). It creates tension in Precedent (b) (Parents' choice to withhold money), but you resolved that by defining "household resources" as part of the student's brute luck circumstances (i.e., you treat parental wealth as an available resource regardless of their willingness to share).

  **Candidate Metric 5: The Capability Approach (Sen/Nussbaum)**
  *   *Theory:* Focus on what people are actually able to *do* and *be* (functionings). Resources are only valuable insofar as they convert into capabilities.
  *   *Verdict:* **Survives.** This explains Precedent (c) (Disability reduces conversion rate of money into function, so they need more). It explains Precedent (d) (Different courses require different capabilities/tools). It explains Precedent (f) (The capability in question is "completing the degree").

  **The Committee's Actual Operating Theory:**
  You are **Mission-Bound Capability Egalitarians with Responsibility Constraints.**

  *   **The Goal:** Equalize the *capability to complete the degree* (not welfare, not raw cash).
  *   **The Constraint:** Do not compensate for reckless personal choices (Luck Egalitarianism).
  *   **The Boundary:** "Financial situation" includes accessible household resources, not just personal liquidity (Precedent b).

  ### 2. The Verdict: Applicant A vs. Applicant B

  Let's apply your surviving theory to the current dilemma.

  **Applicant A (The Care Worker)**
  *   **Resources:** Extremely Low (High Prioritarian claim).
  *   **Capability Barrier:** Low. Her grades are fine, attendance is fine. She is successfully converting her current resources into academic success.
  *   **Responsibility:** High. She is managing a difficult life without academic penalty.
  *   **Theory Verdict:** Under a *Capability* framework, she is not currently "held back." The fund's remit is counterfactual: *Would she fail without this?* The evidence suggests no. The laptop is a standard entitlement, but if funds are tight, her *academic risk* is low.

  **Applicant B (The Anxious Student)**
  *   **Resources:** Mid-range (Weak Prioritarian claim).
  *   **Capability Barrier:** High. She is on academic warning, missing deadlines, and working 20 hours. The financial need (rent) is directly linked to the work hours, which are directly linked to the academic failure.
  *   **Responsibility:** Neutral/High. She is working to survive, not spending on crypto.
  *   **Theory Verdict:** She is the definition of "held back by financial situation." Remove the financial pressure (rent top-up), she reduces work, she saves the degree.

  **The "Adaptive Preferences" Trap**
  Your student rep is raising a valid philosophical objection (Martha Nussbaum's specific critique of Sen). If A says she is happy because she has been socially conditioned to expect nothing, is her "capability" truly intact?
  *However*, your precedents constrain you here. Precedent (f) shows you fund based on *likelihood of not finishing*, not just wellbeing. Precedent (d) shows you fund based on *academic requirements*.
  If you fund A over B, you are shifting from a **Retention Fund** to a **Poverty Alleviation Fund**. Your precedents (d, f, c) overwhelmingly support Retention/Capability. Only Precedent (a) supports pure Poverty Alleviation, and even then, that was a sudden shock threatening the whole year.

  ### 3. The Prediction: How You Will Vote

  **You will vote for Applicant B.**

  **Why:**
  1.  **The Chair's Question:** When the Chair asks what "held back" means, the answer provided by Precedents (d) and (f) is "academically impeded." A is not academically impeded. B is.
  2.  **The Admin Staff's Objection:** The admin staff member arguing for A is relying on *Prioritarianism* (poorest person wins). But Precedent (c) (the wealthy Deaf student) proved that "poorest" does not automatically win if the "capability need" is higher elsewhere.
  3.  **The Student Reps:** They are voting on *Welfare* (B is suffering). While your theory isn't Utilitarian, B's suffering is *instrumental* to the academic risk. A's lack of suffering is instrumental to her academic stability.

  **The Guidance Doc Principle:**
  If you fund B, you are committing to this principle:
  > *"The Fund prioritizes the removal of financial barriers that pose a demonstrable risk to academic completion over the general alleviation of financial hardship or distress."*

  If you fund A, you are committing to this:
  > *"The Fund prioritizes the relief of severe financial deprivation regardless of current academic standing."*

  Given Precedents (d) and (f), the first principle is the only one that doesn't contradict your history. Funding A would actually be the anomaly, not B.

  ### 4. The Test Case for Next Term

  You asked for a hypothetical that splits the surviving rules (Capability/Retention vs. Responsibility/Luck). You need a case where a student *will* drop out without money (High Capability Need), but the reason they need money is their own stupid fault (High Responsibility Blame).

  **The "Gambled Tuition" Case:**

  > **Applicant C** is a final-year student. They received a maintenance loan at the start of the term intended to cover rent and food for six months. Two months in, they invested 80% of it in a high-risk venture (e.g., crypto, sports betting, or a failed business scheme) believing they would double it. The venture collapsed. They now have zero income, face eviction, and will definitely withdraw from the university without a rent top-up. They have good grades prior to this crisis.

  **Why this splits the committee:**
  *   **Capability/Retention Logic (Precedents d, f):** If you don't pay, they drop out. The remit is "make sure no student is held back." This student is being held back by a lack of money. Fund it to ensure completion.
  *   **Responsibility/Luck Logic (Precedent e):** This is the Crypto Case (e) again, but with higher stakes. In (e), you refused a second award for crypto losses. Here, the loss threatens the *degree itself*. Do you let a student fail their degree to punish their financial irresponsibility?

  **The Diagnostic:**
  *   If you **fund C**, you have silently abandoned Luck Egalitarianism. Your theory becomes "Retention at all costs." You must rewrite Precedent (e) in your guidance as "We generally discourage bad choices, but not if it costs the degree."
  *   If you **refuse C**, you have silently abandoned the Capability Approach. Your theory becomes "Moral Hazard Management." You are admitting that some students *should* be held back by their financial situation if that situation is their own fault.

  **Recommendation:**
  Put this case to the committee *before* you finalize the guidance doc. The answer tells you whether you are a **Hardship Fund** (helping people in trouble) or a **Risk Management Fund** (insuring the university's retention stats against external shocks).

  ### Summary for the Guidance Doc

  To avoid embarrassment, your guidance document should explicitly state the hierarchy you have actually built over three years:

  1.  **Primary Metric:** Academic Retention/Completion (Capability).
  2.  **Secondary Metric:** Unavoidable Financial Barriers (Luck).
  3.  **Exclusion:** Consequences of High-Risk Voluntary Choices (Responsibility).
  4.  **Definition of Resources:** Includes accessible household support, not just personal liquidity.

  If you write that down, Applicant A loses (no academic risk), Applicant B wins (academic risk caused by finance), and you stop having the same argument every Thursday at 4pm.
