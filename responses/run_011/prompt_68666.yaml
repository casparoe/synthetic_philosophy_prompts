answer: |-
  You have not stumbled onto a ghost. You have identified a convergence of three distinct but related phenomena that sit at the boundary of cognitive science, performance psychology, and epistemology. The short answer is: **Yes, comprehension can be actively corrosive.**

  There is no single canonical term that covers the piano, the poem, and the meeting simultaneously, but there are three established concepts that, when layered, carve out exactly the shape you are describing.

  Here are the candidates, where they fit, where they break, and the synthesis that binds them.

  ### 1. The Candidates

  **A. Verbal Overshadowing (Cognitive Psychology)**
  *   **The Concept:** First rigorously demonstrated by Jonathan Schooler (1990). Subjects shown a face or given a taste test perform *worse* on subsequent recognition tasks if they are asked to verbally describe the face or taste immediately prior.
  *   **Why it fits:** It matches your translation case perfectly. It posits that verbalizing forces the brain to recode holistic, non-verbal information (the "gestalt" of the poem) into discrete, linguistic features. This recoding overwrites or interferes with the original representation.
  *   **Where it runs out:** It is primarily studied in *memory and recognition* (identifying a face you saw 5 minutes ago), not *live performance* (playing a chord now). It explains why the judgment degrades, but not necessarily why the pianist's fingers stumble.

  **B. Reinvestment Theory / Explicit Monitoring (Sports Science)**
  *   **The Concept:** Proposed by Rich Masters and later Sian Beilock. Experts perform skills via automated procedural memory. When asked to focus on the mechanics of the skill (or narrate them), they "reinvest" conscious attention into the process. This disrupts the fluid automation.
  *   **Why it fits:** It matches your pianist. The request to narrate forces the brain to move control from the basal ganglia (automatic) to the prefrontal cortex (explicit). The bandwidth of the prefrontal cortex is too low to manage the high-dimensional data of improvisation.
  *   **Where it runs out:** It is heavily tied to *anxiety* and *pressure* (choking). You specified "no stakes." However, recent iterations of the theory acknowledge that *mere attentional shift* is enough to cause disruption, even without anxiety. Still, it struggles to explain the social case (your colleague), which isn't purely motor.

  **C. The Introspection Illusion (Social Psychology)**
  *   **The Concept:** Nisbett and Wilson (1977) showed that people often do not have direct access to the causes of their behavior. When asked to explain, they confabulate plausible stories.
  *   **Why it fits:** It matches your colleague "making up rules he didn't believe." It explains the *falseness* of the explanation.
  *   **Where it runs out:** It treats the behavior and the explanation as separate tracks. It doesn't inherently predict that the *act of confabulating* will degrade the *quality of the behavior*. It says "you lie about why you did it," not "lying about why you do it makes you do it worse."

  ### 2. The Carving: What is actually happening?

  To get the definition you want, we need to synthesize these. The phenomenon is **Concurrent Explicitation Interference.**

  It occurs when a skill relies on **high-dimensional, parallel, implicit processing**, and the agent is forced to route that processing through a **low-dimensional, serial, explicit bottleneck** *in real-time*.

  Here is the carving of the edges:

  **1. The Representation Mismatch**
  Skilled intuition (piano, aesthetic judgment, social nuance) operates on thousands of micro-variables simultaneously. Language operates on linear, symbolic logic. To narrate the skill, the brain must compress the high-dimensional data into low-dimensional symbols.
  *   **The Corrosion:** This compression is lossy. In the piano case, the motor system waits for the linguistic system to label the intent before executing, introducing latency and jitter. In the translation case, the aesthetic sense is overridden by the logical criterion, which is too blunt an instrument to capture the nuance.

  **2. The Control Loop Disruption**
  Expert performance relies on closed feedback loops that operate below the threshold of consciousness.
  *   **The Corrosion:** Asking for a report opens the loop. It inserts a "monitor" between the impulse and the action. The system is no longer `Perception -> Action`; it becomes `Perception -> Verbal Encoding -> Monitoring -> Action`. The added latency destabilizes the system. This is the technical reality of the fable of **The Centipede's Dilemma** (the centipede who walked fine until asked which leg moved after which, then couldn't walk at all).

  **3. The Confabulation Feedback**
  Because the explicit system cannot actually access the implicit rules (Nisbett & Wilson), it invents a simplified model.
  *   **The Corrosion:** The agent then tries to *follow* the invented model. Your colleague didn't just describe his social skill poorly; he tried to *act according to the description*. Since the description was a cartoon version of reality, his behavior became cartoonish (dull).

  ### 3. The Boundaries: When does explanation help?

  You asked where it stops. Explanation is not always corrosive. It is helpful under specific conditions that avoid the interference mechanism.

  **A. Retrospective vs. Concurrent**
  *   **Corrosive:** Narrating *while* doing (Piano), or setting criteria *before* judging (Translation).
  *   **Helpful:** Analyzing *after* the fact. Once the performance is over, the implicit system has finished its work. You can then use the explicit system to look for patterns. This is how mastery is consolidated *between* sessions, not *during* them.

  **B. Novice vs. Expert**
  *   **Corrosive:** For experts. Their skill is compiled code. Decompiling it breaks the execution.
  *   **Helpful:** For novices. They do not yet have the implicit automation. They *need* explicit rules to build the initial structure. Asking a beginner to narrate their chord changes might actually help them learn; asking a virtuoso ruins the take.

  **C. Analytic vs. Holistic Tasks**
  *   **Corrosive:** Holistic tasks (Art, Social Dynamics, Improvisation). These rely on pattern recognition that defies linear description.
  *   **Helpful:** Analytic tasks (Math, Coding, Chess Openings). These are *built* on explicit rules. Asking a programmer to narrate their logic often helps them find bugs, because the logic *is* the skill.

  ### 4. Does the skill survive absorption?

  You asked: *Does the phenomenon survive if the person eventually absorbs the explanation and gets better?*

  If they absorb the explanation and improve, **it was a different skill.**
  *   **Skill A (Implicit):** Fast, holistic, fragile to articulation.
  *   **Skill B (Explicitized):** Slower, rule-based, robust to articulation.

  Often, when an expert tries to "learn" their own explanation, they permanently degrade their original ability. They become a "theorist" of their own craft. They gain the ability to teach (which requires explicit rules) but lose the ability to perform at the peak of their previous intuition. This is the tragedy of the "Player-Coach." The Coach understands the game better (explicitly) but can no longer play it at the Player's level (implicitly).

  ### 5. The Epistemological Question

  *Does any of this bear on whether the original skill counted as knowing something at all?*

  Yes. It validates Gilbert Ryle's distinction in *The Concept of Mind* (1949) between **Knowing-How** and **Knowing-That**.
  *   **Knowing-That:** Propositional knowledge. "I know that C-major consists of C, E, G." This is immune to articulation; articulation *is* the display of this knowledge.
  *   **Knowing-How:** Procedural knowledge. "I know how to improvise in C-major." This is displayed in *performance*, not description.

  Your observation proves that **Knowing-How is not reducible to Knowing-That.** If it were reducible, the pianist could simply read out the "That" (the rules) while performing the "How." The fact that the performance degrades proves that the "How" contains information that the "That" cannot capture.

  The corrosion you are seeing is the friction generated when you try to force **Knowing-How** to pretend it is **Knowing-That**.

  ### Summary Definition

  If you need a label for this specific cluster of effects, the most precise existing term is **Deautomatization via Explicit Monitoring**, but that is dry.

  A more descriptive definition for your use:
  > **Articulatory Interference:** The degradation of high-dimensional implicit performance caused by the concurrent demand to encode that performance into low-dimensional explicit symbols.

  It is not just that they *can't* tell you what they are doing. It is that the act of telling *changes what they are doing* from a fluid intuition to a clumsy simulation of an intuition. You are not pattern-matching. You are watching the brain try to run two incompatible operating systems on the same hardware at the same time.
