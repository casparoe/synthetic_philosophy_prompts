answer: |-
  ### Objection-to-Point Mapping

  | Objection # | Source Profile | Primary Target Point(s) | Depends on Point 2? |
  | :--- | :--- | :--- | :--- |
  | 1 | Sophisticated Theorist | Point 3 (DC Justification) | No |
  | 2 | Formal Epistemologist | Point 5 (Betterness vs. Procedure) | No |
  | 3 | Resolute Theorist | Point 4 (Resoluteness Definition) | No |
  | 4 | Behavioral Economist | Point 2 (Stepwise Maximization) | Yes |
  | 5 | Sophisticated Theorist | Point 2 (Anticipation) | Yes |
  | 6 | Resolute Theorist | Point 5 (Exploitability) | No |
  | 7 | Grad Student | Point 1 (Transitivity) | Yes |
  | 8 | General / Normative | Point 4 (Cyclicity Permissibility) | No |

  ---

  ### 1. The Constitutive Agency Objection
  *   **Voice:** The Sophisticated Theorist (Backward Induction Advocate).
  *   **Phrasing:** "You claim Dynamic Consistency (DC) is either justified by the pump or independent and redundant. That's a false trichotomy. DC is constitutive of what it means to be a temporally extended agent. It's not a norm we adopt to avoid pumps; it's a precondition for having a 'plan' rather than a sequence of disjointed events. The pump doesn't vindicate DC; it reveals the cost of violating a requirement of agency."
  *   **Targets:** Point 3.
  *   **Whiteboard Reply:** Draw a timeline. "I agree DC is about agency. But if the *only* reason to think agency requires DC is that violating it looks like the pump, then the pump is doing the justificatory work. If you have an independent argument for DC (e.g., planning agency), state it. If you do, the pump is illustrative, not probative. My point stands: the pump argument *alone* cannot justify DC without assuming stepwise maximization."
  *   **Softness:** Concedes that DC might be justified independently, which weakens the "question-begging" charge if the audience accepts the independent justification.
  *   **Strong/Weak Point 3:** Bites the Strong version (full stop question-begging). Spares the Weak version (pump relies on a norm).
  *   **Assessment:** **This is the actually correct objection.** Your dichotomy in Point 3 ignores that the pump can be a *diagnostic tool* for a norm justified by the nature of agency, rather than the *source* of the norm's justification.
  *   **Change My Mind:** If you can show that there is no coherent theory of diachronic agency that entails DC without referencing the badness of sure loss (exploitability).

  ### 2. The Synchronic Betting Objection
  *   **Voice:** The Formal Epistemologist.
  *   **Phrasing:** "You separate betterness from procedure. But if preferences are operationalized as betting quotients, the procedure is irrelevant. If I offer you the trades as a package deal synchronically, you lose money. If you accept them sequentially, you lose money. The loss is in the preference relation's structure, not the choice node mechanics."
  *   **Targets:** Point 5.
  *   **Whiteboard Reply:** Draw three contracts side-by-side. "A synchronic Dutch Book assumes the agent accepts the package. A money pump assumes the agent chooses sequentially. If the agent has a procedural rule that says 'reject sequential trades that form a cycle,' they avoid the loss without changing preferences. The synchronic book forces the package; the pump relies on the agent walking into it node-by-node."
  *   **Softness:** Requires assuming the agent can recognize the cycle sequentially, which is cognitively demanding.
  *   **Strong/Weak Point 3:** N/A (Targets Point 5).
  *   **Assessment:** Rhetorically dangerous but technically distinct. Dutch Book and Money Pump are not identical.
  *   **Change My Mind:** If you demonstrate that any agent with cyclic preferences *must* accept the sequential trades given standard information sets.

  ### 3. The Resoluteness Definition Objection
  *   **Voice:** The Resolute Theorist.
  *   **Phrasing:** "You say the resolute agent 'binds herself in advance.' That's commitment, not resoluteness. A resolute chooser (McClennen style) doesn't bind; she simply doesn't treat the later node as a new choice situation. She isn't exploitable because she doesn't maximize stepwise. You're attacking a straw man of resoluteness."
  *   **Targets:** Point 4.
  *   **Whiteboard Reply:** Write "Commitment vs. Resolution." "Fair distinction. But even the resolute chooser is vulnerable if the pumper knows her plan. If I know you won't deviate, I can offer you a plan that is worse than your status quo but better than your deviation, and you'll take it. Resoluteness avoids the *dynamic* inconsistency, not the *strategic* exploitation."
  *   **Softness:** Blurs the line between strategic manipulation and dynamic pumping.
  *   **Strong/Weak Point 3:** N/A (Targets Point 4).
  *   **Assessment:** Accurate critique of your terminology.
  *   **Change My Mind:** If you can show a resolute agent is immune to all forms of preference-based exploitation, not just dynamic inconsistency.

  ### 4. The Null Hypothesis Objection
  *   **Voice:** The Behavioral Economist.
  *   **Phrasing:** "You call Stepwise Maximization a 'norm.' For my subjects, it's a description. They don't reason diachronically. They see a trade, they take it. If your theory requires a diachronic norm to avoid pumps, your theory doesn't describe real agents. It prescribes an ideal they can't meet."
  *   **Targets:** Point 2.
  *   **Whiteboard Reply:** Draw a fork in the road. "Descriptive accuracy isn't normative validity. If stepwise maximization leads to sure loss, that's an argument *against* using it as a normative standard, not an argument that cyclicity is fine. I'm arguing we shouldn't use pumps to ban cyclicity, not that humans are rational."
  *   **Softness:** Risks conceding that the talk is purely normative, alienating the behavioralist.
  *   **Strong/Weak Point 3:** N/A (Targets Point 2).
  *   **Assessment:** Depends on Point 2. If Stepwise Maximization is merely descriptive, Point 2's claim that it's a "norm" weakens.
  *   **Change My Mind:** If you show that agents can be trained to adopt diachronic norms without external commitment devices.

  ### 5. The Anticipation Objection
  *   **Voice:** The Sophisticated Theorist (Second Pass).
  *   **Phrasing:** "You say 'each trade is individually preferred.' But for a sophisticated agent, the first trade is *not* preferred because it includes the downstream consequence. You're misdescribing the preference at node 1."
  *   **Targets:** Point 2.
  *   **Whiteboard Reply:** Write "Local vs. Global Preference." "If the preference at node 1 includes node 3, then preference is not local. That confirms my point: you need a norm telling you how to construct preferences at nodes. That norm isn't in the betterness relation; it's in the choice procedure."
  *   **Softness:** Can look like semantic shuffling about what a 'preference' is.
  *   **Strong/Weak Point 3:** N/A (Targets Point 2).
  *   **Assessment:** Depends on Point 2.
  *   **Change My Mind:** If you can define 'preference at a node' without invoking a procedural norm.

  ### 6. The Exploitability Definition Objection
  *   **Voice:** The Resolute Theorist (Second Pass).
  *   **Phrasing:** "You say an agent can be pumpable without being irrational. But in decision theory, 'rational' just means 'not exploitably incoherent.' If you allow pumpability, you're redefining rationality so broadly it loses its bite."
  *   **Targets:** Point 4, Point 5.
  *   **Whiteboard Reply:** Write "Rationality = Coherence?" "If rationality is just avoiding loss, then a bound agent is rational. But then the pump argument tells us nothing about *preferences*, only about procedures. That's my point: stop using pumps to police preference cyclicity."
  *   **Softness:** Risks agreeing that rationality is purely about outcomes, which undermines normative force.
  *   **Strong/Weak Point 3:** N/A (Targets Point 4/5).
  *   **Assessment:** Does not depend on Point 2.
  *   **Change My Mind:** If you can show a case where exploitability is acceptable without a compensating benefit.

  ### 7. The Transitivity Primitive Objection
  *   **Voice:** The Graduate Student.
  *   **Phrasing:** "Standard texts say transitivity is an axiom of rational preference. The money pump is just a way to show why we have that axiom. Why complicate it with sequential norms? If you're cyclic, you're irrational, full stop."
  *   **Targets:** Point 1.
  *   **Whiteboard Reply:** Draw a triangle. "The axiom says 'don't be cyclic.' The pump says 'if you are cyclic, you lose money.' The gap is 'you will trade.' I'm saying the 'you will trade' part is the heavy lifter, not the cyclicity."
  *   **Softness:** Students may find this overly pedantic; they want the axiom to hold.
  *   **Strong/Weak Point 3:** N/A (Targets Point 1).
  *   **Assessment:** Depends on Point 2.
  *   **Change My Mind:** If the standard text explicitly derives transitivity from sequential choice norms rather than positing it.

  ### 8. The Normative Force Objection
  *   **Voice:** General Room Consensus.
  *   **Phrasing:** "Okay, suppose you're right. Cyclicity is allowed if we change the procedure. But why would we ever choose a procedure that allows cyclicity? It invites loss. So practically, we still ban cyclicity."
  *   **Targets:** Point 4.
  *   **Whiteboard Reply:** Write "Cost of Norms." "Because diachronic norms are cognitively expensive. Sometimes it's cheaper to be cyclic and risk a pump than to maintain the cognitive architecture for dynamic consistency. Rationality includes computational costs."
  *   **Softness:** Speculative; requires a theory of computational cost not in your thesis.
  *   **Strong/Weak Point 3:** N/A (Targets Point 4).
  *   **Assessment:** Does not depend on Point 2.
  *   **Change My Mind:** If you show that diachronic norms are costless to implement.

