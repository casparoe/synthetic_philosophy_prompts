  ### Strategic Recommendations

  **Strong vs. Weak Point 3:**
  State the **Weak Version**.
  *   *Strong:* "The rejoinder is question-begging, full stop."
  *   *Weak:* "The rejoinder relies on a diachronic norm whose justification is independent of the pump."
  *   *Reasoning:* The Strong version is vulnerable to Objection 1 (Constitutive Agency). The Weak version survives by conceding that DC might be justified by agency, while maintaining that the *pump argument itself* doesn't do that work. This protects you from the Sophisticated Theorist without surrendering your main thesis.

  **Opening Concessions (First 5 Minutes):**
  1.  **Concede that sure loss is bad.** Do not sound like you are advocating for losing money. Frame the talk as "Where does the loss come from?" not "Is loss okay?"
  2.  **Concede that Dynamic Consistency is plausible.** Acknowledge that most people feel they *should* stick to their plans. This disarms the Sophisticated Theorist's instinct to defend DC at all costs.
  3.  **Concede the Resolute/Commitment distinction.** Explicitly state early: "When I say 'resolute,' I mean an agent who adheres to a plan without external binding. I acknowledge this is distinct from Schelling-style commitment devices." This preempts Objection 3.

  **The Single Reply That Must Land:**
  You must successfully distinguish **Preference** from **Choice Rule**.
  *   *Why:* Your entire argument (Point 5) rests on the claim that pumpability is a property of (Agent + Procedure), not (Betterness). If the audience conflates "preferring A to B" with "choosing A over B in a sequence," your argument collapses into standard transitivity defense.
  *   *How:* Use the whiteboard to draw a box around "Preference Relation" and a separate box around "Selection Function." Show the pump argument requires an arrow from the first to the second that isn't guaranteed by logic alone.

  **The Question You Hope No One Asks:**
  "If Stepwise Maximization is not the default rule, what is the positive alternative decision rule you propose that permits cyclicity but avoids the pump without invoking resoluteness?"
  *   *Why:* You spend the talk critiquing the standard view. If you cannot name the alternative algorithm (e.g., "Global Maximization," "Plan-Based Selection"), you leave a vacuum. The Sophisticated Theorist will fill it with "Backward Induction," and you will look like you have no constructive theory.

