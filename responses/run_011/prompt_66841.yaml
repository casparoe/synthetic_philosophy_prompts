answer: |-
  The table was set exactly as it had been for ten years. Three places, though only two were occupied. The third setting, Julian's, remained empty, a plate clean enough to reflect the overhead light, a fork aligned parallel to the knife. Outside, the rain blurred the windowpane, turning the garden into a smear of green and gray. Inside, the air smelled of old paper and coffee, the scent of a long vigil.

  Elias sat opposite Mara. They were siblings, bound by blood and by the shared administration of the estate Julian had left behind. For a decade, they had operated as a single unit. Every letter from private investigators arrived in duplicate; every call from the police was taken on speakerphone; every bank statement was reviewed side by side. They had pooled their grief and their resources, promising each other that no scrap of information would ever be held back. The search for Julian was the central axis of their lives, and transparency was the religion they practiced to keep it holy.

  Once a year, on the anniversary of the disappearance, they performed the rite. They reviewed the file—the thick binder that had grown only slightly thinner with time—and then they spoke the numbers.

  "I am at eighty-five," Elias said. His voice was steady, though the number felt heavy in his mouth. It represented the weight of his hope, the probability he assigned to the proposition: *Julian is alive.*

  Mara looked down at her hands. They were clasped tightly on the tablecloth. "I am at fifteen."

  The gap was a canyon they had walked along every year for ten years. Eighty-five against fifteen. Sometimes it was eighty against twenty. Never closer. Never wider. It was a stubborn geometry that defied the logic of their shared life. They had seen the same evidence. They had heard the same rumors. They had hired the same experts. By all rights, their measures of the truth should have merged long ago.

  "This year had the bank alert," Elias said, pushing a printed sheet across the table. "The transaction in Zurich. We both saw it."

  "We did," Mara said. She didn't look up.

  "It moves the needle. For both of us."

  "It does."

  "I moved to eighty-eight," Elias said. "You moved to eighteen."

  They had discussed the evidence an hour ago. The credit card charge was small, insignificant in amount, but significant in origin. It was a signal. Both of them had agreed it was a signal. Both of them had adjusted their internal scales in the same direction. Yet, the distance between them remained virtually unchanged. They had updated, but they had not converged.

  Elias leaned forward. He had read about this phenomenon, not in books, but in the silence between them. He knew that if two people start in the same place and share everything, their opinions must meet. If they do not meet, the sharing is incomplete.

  "We need to say it again," Elias said. "Plainly."

  Mara lifted her eyes. They were tired, rimmed with the redness of chronic lack of sleep. "Elias, we said them."

  "Not just the numbers. The knowing."

  He took a breath. He needed to close the loop. He needed to make sure that she knew that he knew that she knew. It was a ladder they had to climb together, rung by rung, until there was no air left between them.

  "I say eighty-eight," Elias said. "And I know you say eighteen."

  "I hear you," Mara said.

  "And you know that I say eighty-eight."

  "Yes."

  "And I know that you know that I say eighty-eight."

  Mara nodded slowly. "I know that you know."

  "And you know that I know that you know."

  "Yes, Elias."

  "Then the information is between us. It is common. There is nothing hidden in the transmission."

  "There is nothing hidden," Mara repeated. Her voice was flat.

  "Then why does the number stay?" Elias asked. "If we are both honest, and we both know the other is honest, and we know that we know, the gap should close. It should collapse. It is a mechanical necessity. If we stand on the same ground, we cannot see different horizons."

  Mara looked away, toward the empty chair. "People see different horizons, Elias."

  "Not if they stand on the same ground."

  "Maybe we aren't standing on the same ground."

  The sentence hung in the air. Elias felt a chill that had nothing to do with the rain. This was the breach. The theorem of their existence relied on the axiom of the common start. They had assumed that the day Julian vanished was day zero for both of them. They had assumed that the initial state of their knowledge was identical.

  "You're hiding something," Elias said. It wasn't an accusation; it was a deduction.

  Mara didn't flinch. She seemed to have been waiting for this for ten years. "I have shared everything."

  "You have shared every piece of paper. Every call. Every report." Elias tapped the table. "But not the start. Not the beginning."

  "There is no beginning except the disappearance."

  "There is always a moment before," Elias said. He was thinking hard now, the mechanics of their disagreement clicking into place. If Mara's number was so low, so stubbornly low, it meant she possessed a weight of evidence that he did not. A weight heavy enough to anchor her against ten years of null results. A weight heavy enough to resist the pull of his own certainty.

  "You found something," Elias said. "In the first week."

  Mara said nothing.

  "I know who has it," Elias said. "It's you. You're the one holding the weight." He paused, searching for the object that could carry such a burden. "It was a letter, wasn't it? You found a letter in his room. A suicide note. Or a goodbye."

  He was sure of it. A document. Something physical that could be filed away, hidden in a drawer, something that could be read once and then suppressed to protect him. To protect Elias from the finality of the truth. If Mara had found proof that Julian intended to leave, or that he intended to end it, her fifteen percent made sense. It was the residue of doubt she couldn't quite extinguish, or perhaps the mercy she showed by not letting the number go to zero.

  "Tell me," Elias said. "If it's a letter, show me. We can burn it. We can ignore it. But we have to start from the same place."

  Mara shook her head. "It wasn't a letter."

  Elias frowned. "A recording?"

  "No."

  "Then what? You said you weren't on the same ground. What did you see?"

  Mara reached out and touched the edge of Julian's empty plate. Her finger traced the rim. "The day he vanished. You were at the office. You called me at noon to say you were running late for lunch."

  "I remember."

  "Julian came to the house," Mara said. "He didn't come to see you. He came to see me."

  Elias felt the floor shift beneath him. "He was there?"

  "He was in the driveway. I was coming out to get the mail. I saw him get into a car."

  "Whose car?"

  "A black sedan. I didn't see the driver clearly. But I saw Julian. He wasn't missing, Elias. He wasn't lost. He was leaving."

  "You saw him leave?"

  "I saw him get in. And I saw the car drive away. Toward the bridge."

  Elias stared at her. "The bridge? The one they dredged?"

  "Yes."

  "You saw this... ten years ago?"

  "Yes."

  "Why didn't you tell me?" Elias's voice cracked. "Why didn't you tell the police?"

  "Because I didn't see the crash," Mara said. "I saw him get in. I didn't see them go over. I told myself... I told myself that if I said nothing, if I let them search, maybe he would come back. If I said I saw him leave voluntarily, they would stop looking. They would call it a runaway. They would close the file."

  "You withheld evidence."

  "I withheld an interpretation," Mara said. "I didn't know he was dead. I just knew he was gone. But every year... every year that he didn't come back, the weight of that sight got heavier. The probability that he survived a voluntary disappearance into that car... it went down. And I couldn't tell you, because if I told you, you would stop hoping. And I needed you to hope. You were the one who kept the house together. You were the one who kept paying the lawyers."

  Elias sat back. The logic clicked into place. The common prior was broken. On day zero, Elias had a state of ignorance. Mara had a state of partial knowledge. They had never been on the same ground. They had been sharing the updates, but they were updating from different baselines. That was why the numbers never met. That was why the loop of *I know that you know* never closed. Mara knew something about the start that Elias did not, and knowing that she knew it wasn't enough; he had to know *what* she knew.

  "So," Elias said. "Your number. It isn't fifteen."

  Mara looked at him. Her eyes were dry now. "No."

  "And mine. It isn't eighty-eight."

  "No."

  "If he got into a car with a stranger and drove toward a bridge ten years ago..."

  "The probability is zero," Mara said.

  Elias looked at the empty chair. The plate still reflected the light. The fork was still parallel to the knife. For ten years, he had been nourishing a ghost. He had been building a life around a variable that was already solved. The hope had been a structural element of his days, the load-bearing wall of his mornings. He woke up thinking *today could be the day*. He planned vacations around Julian's potential return. He kept a room ready.

  Now, the wall was gone.

  "You should have told me," Elias said. But the anger was weak. It was overshadowed by the sudden, crushing silence of the room. The agreement had been reached. The numbers had converged. They were both at zero.

  "I know," Mara said. "I was wrong."

  "We were both wrong," Elias said. "I was wrong to think we were the same."

  He looked at her. She looked smaller than she had an hour ago. The secret had been a burden she carried alone, a heavy stone in her pocket that kept her anchored to the earth while Elias floated in the clouds of possibility. Now she had put the stone on the table, and they were both grounded.

  "What do we do now?" Mara asked.

  Elias looked at the binder. The files. The maps with pins in them. The photos of Julian at different ages, smiling, waving, alive. They were artifacts of a investigation that was over.

  "We close the file," Elias said.

  "And the place setting?"

  Elias looked at the third plate. It seemed obscene now. A prop for a play that had ended years ago.

  "Put it away," he said.

  Mara stood up. She walked around the table and picked up the plate. She held it for a moment, feeling the weight of the ceramic. Then she walked to the kitchen counter and set it down, out of sight.

  Elias remained seated. The rain continued to fall. The garden was still a smear of green and gray. Nothing had changed outside, but inside, the geometry had corrected itself. The lines had met. The gap was closed. They were in agreement.

  It was the worst thing that had ever happened to them.

  Elias put his hand on the table. The wood was cold. He looked at Mara, who was standing by the counter, her back to him, shoulders slightly hunched. They were alone. Truly alone. For ten years, they had been three, bound by the uncertainty of the missing. Now they were two, bound by the certainty of the loss.

  "Mara," he said.

  She turned around. Her face was pale.

  "Thank you," he said.

  She nodded once. She didn't smile. There was nothing to smile about. The math was done. The answer was zero.

  Elias closed the binder. The sound of the latch clicking shut was loud in the quiet room. It sounded like a door locking. He stood up and walked to the window. He couldn't see the garden clearly, but he could see the rain. He watched the water run down the glass, tracing paths that merged and flowed together, descending until they disappeared from view.

  He turned back to the room. Mara was waiting for him. They had to go out there, into the world where Julian was not coming back. They had to live in the truth they had finally agreed upon.

  "Let's go," Elias said.

  Mara picked up her coat. They walked to the door together. They did not look back at the table. There was no need to. The numbers were settled. The work was finished. The hope was dead.
