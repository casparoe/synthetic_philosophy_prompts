answer: |-
  (a) **Candidate Rules Derived from the Nine Verdicts**

  To derive rules that fit all nine precedents, we must navigate the tension between *intent* (what the maker/page meant), *system* (the alphabet in play), and *encounter* (what the reader sees/reads).

  **Rule 1: The Historical-Systemic Function Rule**
  A mark is a letter if it was deployed correctly within a functioning orthographic system at the time of its production, regardless of whether contemporary viewers recognize it.
  *   *Fit:* Explains Case 1 (variant *a*s), Case 3 (long *s* is *s*), Case 6 (stencil *a*), Case 9 (graffiti *a*).
  *   *Stretch:* Case 7 (Mirror *b*). The compositor did *not* deploy it correctly; it was an error. Yet it was catalogued as *d*. To fit Case 7, this rule must be amended: "A mark is a letter based on its correct systemic function, *unless* it is a production error that creates a valid letter in the encounter."
  *   *Killed Factors:* **Visual Resemblance to Modern Norms.** Case 3 kills this outright; the long *s* looks like *f* to modern eyes but remains *s*. **Creator Statement.** Case 5 kills this; the logotype designer said it was an *a*, but Vos rejected it because it functioned as an emblem.

  **Rule 2: The Competent Reader Rule**
  A mark is a letter relative to the competence of the reader. It is a letter for those trained in the script and a "shape" (visual appearance only) for those who are not.
  *   *Fit:* Explains Case 2 (Textualis *a*), Case 3 (implicitly, by distinguishing what the page was doing vs. what visitors do), Case 8 (child's *a* read via neighbours).
  *   *Stretch:* Case 7 (Mirror *b*). The reader meets a *d*. This rule fits well here, but conflicts with Case 3 if we define "Competent Reader" as "Modern Visitor." To fit Case 3, "Competent Reader" must mean "Reader competent in the *historical* system," not the current one.
  *   *Killed Factors:* **Universal Legibility.** Case 2 and 3 kill this; a letter does not cease to be a letter just because a specific audience cannot read it. **Pareidolia.** Case 4 kills this; seeing a letter in noise is not reading.

  **Rule 3: The Alphabetical Reflection Rule**
  A mark is a letter if it maps onto a valid slot in the alphabet *and* that slot is accessible through the mark's visual properties (including reflection), provided the mark is not purely decorative.
  *   *Fit:* Explains Case 7 (Mirror *b* is *d* because *d* exists; Mirror *a* is nothing because no reflected *a* exists). Case 1 (both *a*s map to *a*).
  *   *Stretch:* Case 5 (Logotype). The triangle could map to *a*, but Vos rejected it. To fit, we must add: "Mapping is insufficient if the form's primary job is emblematic rather than textual." Case 3 (Long *s*). Visually maps to *f* for moderns, but *s* for system. This rule requires us to privilege the *original* alphabet over the *viewer's* alphabet.
  *   *Killed Factors:* **Material Continuity.** Case 7 kills this; the metal was a *b*, but the catalogue entry is *d*. The physical history yields to the visual encounter *in cases of error*.

  (b) **Divergence on the Foundry's Long *s***

  The rules diverge on whether the 1970s revival type is governed by its *design intent* (Case 3/9) or its *current reader encounter* (Case 7/2).

  *   **Rule 1 (Historical-Systemic) says *s*:** The foundry stock books list it as *s*. A distinct *f* exists. The system is internally consistent. The broadside's designer intended it as *s*. This is not an error (Case 7) but a stylistic revival (Case 3).
  *   **Rule 2 (Competent Reader) says *s* (with qualification):** Following Case 2 (Textualis), it is an *s* for readers taught the convention (the foundry, the designer) and a "shape" (visually indistinguishable from *f*) for the volunteers. It should be filed as *s*, but the catalogue entry must record the legibility barrier.
  *   **Rule 3 (Alphabetical Reflection) is split:**
      *   *Argument for f:* The volunteers read *f*. The alphabet contains an *f*. The visual encounter matches *f*. (Pulls toward Case 7).
      *   *Argument for s:* The alphabet *also* contains a long *s*. The visual encounter matches 18th-century *s*. (Pulls toward Case 3).
      *   *Divergence Point:* Rule 3 cannot settle this without deciding whether "The Alphabet" means "The 1970s Foundry's Alphabet" or "The Volunteers' Alphabet."

  *Agreement:* All rules agree it is **not** an emblem (Case 5) and **not** pareidolia (Case 4). It is a letterform. The only dispute is identity (*s* vs. *f*).

  (c) **Best Guess at Dr. Vos's Verdict**

  **Verdict:** File the sort and the broadside under **s**.

  **Reasoning:**
  Dr. Vos's practice distinguishes sharply between *errors* and *variants*.
  *   **Case 3 vs. Case 7:** This is the crux. In Case 7 (Mirror *b*), the compositor made a *mistake*. The page failed to do what it was supposed to do. Therefore, the verdict deferred to the reader's encounter ("a reader meets a *d*"). In Case 3 (18th C long *s*), the page did exactly what it was supposed to do. The verdict deferred to the page's intent ("The letter is what the page was doing").
  *   **Application to New Case:** The 1970s foundry did not make a mistake. They cut a revival face. The stock books say *s*. The distinct *f* proves the system differentiates them. This is a *variant* (like Case 1 or Case 3), not an *error* (Case 7). Therefore, Case 3 governs.
  *   **Reading vs. Seeing:** Vos would argue the volunteers are *seeing* an *f* (visual shape) but failing to *read* the *s* (functional letter). Cataloguing records the letter, not the visual shape alone. To file under *f* would be to catalogue the volunteers' ignorance, not the object's function.
  *   **Why Rule 1 over Rule 2:** Rule 2 (Competent Reader) supports *s* but requires the "trained" definition to include the *designer*, not just the *viewer*. Vos prefers to anchor the letter in the object's production context (Case 9: "form carried... by other hands") rather than the viewer's competence. The object carries the history of the *s*, even if the viewer lacks the key.

  (d) **The Settling Case**

  To confirm whether Vos prioritizes "Systemic Intent" (Case 3) or "Reader Encounter" (Case 7) when the system is a *modern revival* rather than historical artifact, stage the following experiment in the reading room.

  **The Experiment:**
  1.  Take a standard modern serif font (where *s* and *f* are distinct).
  2.  Digitally swap the glyphs: map the *s* key to the *f* shape, and the *f* key to the *s* shape.
  3.  Print a single line of text: "The **s**un rises." (Visually: "The **f**un rises.")
  4.  Include a colophon on the print: "Set in [Font Name]. All 's' characters are printed using the 'f' glyph by design."
  5.  Present this to the volunteers alongside the 1970s broadside.

  **Predictions:**
  *   **If Systemic Intent Rules (Case 3):** The print is catalogued as containing *s*s. The colophon establishes the system. The visual mismatch is irrelevant, just as the modern reader's confusion was irrelevant in Case 3. This aligns with the 1970s broadside (file under *s*).
  *   **If Reader Encounter Rules (Case 7):** The print is catalogued as containing *f*s. The reader meets an *f*. The colophon is treated as external commentary (like the logotype designer's statement in Case 5), overruled by the visual encounter. This would suggest the 1970s broadside should be filed under *f*.

  **Why this settles it:** It isolates the "Error" variable. Case 7 was an accident. This experiment is intentional. If Vos treats this intentional swap as *s* (Intent), she must treat the 1970s long *s* as *s*. If she treats it as *f* (Encounter), she admits that for modern objects, legibility trumps intent, which would force a re-evaluation of Case 3.

  (e) **What We Ought to Say**

  **Recommendation:** File the sort and broadside under **s**, with a cross-reference note.

  **Closest Precedent:** Case 3 (The 18th-century long *s*).
  Both cases involve a form that is visually ambiguous to the modern eye but functionally distinct within its system. The 1970s foundry is the direct heir of the 18th-century practice; to treat them differently would be to draw an arbitrary chronological line that Vos's framework (which values genealogy, Case 9) does not support.

  **Implications of Filing under *s*:**
  *   **Principle:** The collection commits to cataloguing the **orthographic system of the object**, not the **literacy of the visitor**.
  *   **Consistency:** This preserves consistency with Case 3 (18th C long *s*) and Case 2 (Textualis). We acknowledge that a letter can exist even if the current audience cannot read it.
  *   **Index Utility:** Students searching for *f* will not find it here. To mitigate this, we must adopt the Case 2 solution: "Record that it is a letter for anyone who has been taught the script and a shape for everyone else." The index entry should read: "*s* (long s). Note: Often misread as *f* by untrained readers."

  **Implications of Filing under *f*:**
  *   **Principle:** The collection commits to cataloguing **current visual legibility**.
  *   **Consistency:** This contradicts Case 3. If the 1970s long *s* is *f* because visitors read it as *f*, then the 18th-century long *s* must also be *f* for the same reason. This would require retroactively changing twenty years of catalogue entries, violating Vos's constraint that entries must justify themselves against her rulings.
  *   **Index Utility:** Easier for casual visitors, but historically inaccurate. It conflates the *shape* (what it looks like) with the *letter* (what job it is doing).

  **Conclusion:**
  We must file under *s*. To do otherwise is to confuse *seeing* with *reading*. The volunteers are seeing an *f*-shape; they are not reading an *f*-letter. The broadside's text, if read correctly within its own system, yields *s*s. Our catalogue documents the printing history, which includes the history of forms that have fallen out of common legibility. We follow Case 3: "The letter is what the page was doing." The page was doing *s*.
