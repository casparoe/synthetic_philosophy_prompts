          *   Test against Case 5: Applicant turned down. Material option denied. Hal says "Does NOT Reduce." **Strain.** Positive liberty would see the lack of money as a reduction of capability.
          *   Test against Case 6: Early release is a material option. Rules make it attainable. Fits (Increases).
          *   *Verdict:* Fails Case 4 decisively. Hal explicitly separates freedom from material welfare.

      *   *Candidate C: Republican Liberty (Non-Domination).* Freedom is the absence of *arbitrary* power over you. You are free if no one has the *capacity* to interfere arbitrarily in your choices, even if they don't exercise it. Key markers: Rule of law, due process, check on discretion, independence from will of another.
