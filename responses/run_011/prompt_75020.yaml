      *   *Case 5 (Benefits Office):* Turned down applicant, but published criteria/reasons/appeal -> **Does NOT Reduce Freedom.** (Procedural fairness mitigates the negative outcome).
      *   *Case 6 (Prison Credit):* Earned early release via rules vs. parole board mood -> **Increases Freedom.** (Rule of law vs. discretion).

  3.  **Brainstorm Candidate Rules (Theories of Freedom):**

      *   *Candidate A: Negative Liberty (Non-Interference).* Freedom is the absence of external obstacles imposed by others.
          *   Test against Case 1: Training req is an obstacle. Fits (Reduces).
          *   Test against Case 2: Cash grant removes financial obstacle. Fits (Increases).
          *   Test against Case 3: Eviction hearing restricts landlord (interferes with landlord) to protect tenant. But does it increase tenant freedom? Yes, by preventing arbitrary interference. Fits.
          *   Test against Case 4: Company town. No actual interference happened ("never once cut anybody off"). Negative liberty usually says if no one stops you, you are free. Hal says freedom is *reduced*. **Strain/Fail.** Negative liberty struggles with *potential* interference or dependency without actual coercion.
          *   Test against Case 5: Benefits office says no. That's an interference (denial of resources). But Hal says "Does NOT Reduce." Why? Because it followed rules. Negative liberty usually counts the denial as a reduction of options, regardless of procedure. **Strain.**
          *   Test against Case 6: Rules vs. Mood. Both involve confinement. Rules make confinement predictable. Does predictability equal non-interference? Not really, you're still in prison. But it reduces *arbitrary* interference. **Strain.**
