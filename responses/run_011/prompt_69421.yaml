answer: |-
  The cheap way to build this case is to stipulate that everyone suddenly feels a moral obligation, which just asserts the conclusion rather than deriving it from the structure of the interaction. The move that looks like it meets the spec but really cheats is to make the sanctions reputational, implying a second-order coordination game about who punishes whom. To block that, I need to make the punishment costly to the enforcer with no return, so the stability cannot be reduced to prudential rationality or higher-order equilibrium. The load-bearing beam must be the costliness of the sanction without the coordinating payoff.

  Here is the scenario. In stage one, a council allotment site has forty plots and one shared standpipe. During summer evenings, scarcity creates a coordination problem: hoses tangle and arguments break out over who draws next. A regularity emerges spontaneously: gardeners leave their watering cans in a line against the hedge, and the order of the cans determines the order of drawing. If a can is shifted, the owner complains and the committee backs them. This is a clean Lewisian convention: there is a coordination problem, everyone conforms, everyone expects everyone to conform, and everyone prefers conformity conditional on others conforming because it avoids conflict and delay. The regularity is arbitrary; they could have queued by plot number, but the cans work.

  In stage two, six years later, the water board installs a mains feed to every plot. Each gardener now has their own tap and hose with fine pressure. The old standpipe is obsolete except for filling a wildlife pond. There is no scarcity, no queue, and nothing to lose by drawing water out of turn. The coordination problem has evaporated. Yet every Saturday morning the cans still go out in the same row, and it is policed. A newcomer who puts their can out of place gets frozen out of the seed swap, told off publicly, and finds nobody will lend a hand with their bean frame. The person doing the telling-off is out of pocket: they lose an afternoon, get shouted at, and gain nothing, since their own water comes from their own tap. The old secretary who started it is dead. Nobody under sixty knows why the row exists, and the few who try to explain give rationalisations that are visibly false, like keeping the path clear. The regularity is stable, not decaying, and common knowledge holds: everybody knows the rule and knows that everybody else knows it.

  Now take Lewis's clauses across both stages. In stage one, every clause holds. There is a regularity of conformity. There is common knowledge of this regularity. There is a conditional preference for conformity: I prefer you to queue by cans given that you do, because it solves the scarcity problem for me. There is an alternative regularity possible, satisfying arbitrariness. In stage two, the regularity holds. Common knowledge holds. Arbitrariness holds, as they could still queue by plot number. The clause that fails is the conditional preference grounded in the coordination problem. In stage two, I do not prefer your conformity because it solves a coordination problem for me; there is no problem to solve. I might prefer it to avoid sanction, but the prompt specifies conformity is not supported by a preference for others' conformity based on coordination. The preference condition falls because the underlying game has changed from coordination to something else.

  The order of failure matters. The coordination problem vanishes first. This removes the prudential basis for the conditional preference. Once that preference goes, the regularity is no longer an equilibrium of the original game. The sanctions persist, but they are not sustaining a convention; they are sustaining a norm. The load-bearing feature of the case is the costly sanction without reputational payoff. If the telling-off became costless, the enforcer could be seen as engaging in cheap talk or habit, which might remain compatible with a decaying convention. If someone could still explain the original reason, the regularity might be seen as a salient focal point retaining force through memory. But with costly enforcement and no functional reason, the stability cannot be game-theoretic. It must be normative.

  Here is the honest bit. Lewis allows that once a convention is up and running, people can come to disapprove of nonconformity and conform out of a sense of obligation rather than prudence. He suggests this normative pressure is a byproduct of the convention's establishment. The question is whether stage two is just an instance of that remark and therefore no embarrassment to him, or whether it is genuinely outside the analysis. If Lewis is right, the obligation is still anchored in the original coordination problem, even if forgotten. But in stage two, the coordination problem is gone physically, not just epistemically. There is no latent coordination to be solved. The best reply a defender of Lewis could make is that the game has shifted to a new coordination problem about social standing: people coordinate on punishing to maintain group cohesion. But the facts block this: the enforcer gains nothing, not even cohesion, as they are shouted at and lose time. The sanction is purely costly. Therefore, this is not a convention that acquired normative force; it is a social norm that replaced a convention. The Lewisian reply fails because it cannot account for stable conformity without a payoff structure, even a social one. The case shows that norms can outlive the coordination problems that birthed them, sustained by costly enforcement that game theory cannot rationalise without smuggling in hidden benefits. This suggests social ontology needs a category for norms that are not conventions, even if they look identical from the outside.
