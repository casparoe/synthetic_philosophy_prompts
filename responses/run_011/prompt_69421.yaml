prompt: |-
  Right — you're a philosopher who works on social ontology, specifically the game-theoretic line on conventions and how they shade into social norms, so please treat this as a design problem rather than an essay question. Before you write anything, do the scratch work out loud: a few sentences telling me what the cheap way of building this case would be, the move that looks like it meets my spec but really just stipulates the answer I've asked for, and then build the thing so that cheat isn't on the table.

  What I need is a thought experiment for a seminar demo. The room is second-years who've done a bit of Lewis on convention and nothing else, so no vocabulary they wouldn't have met, and no references or reading list at the end — I want the reasoning, not a bibliography I'd have to check.

  Two stages, both on the same site, and I've already got the setting so you don't have to invent it, you just have to make it work.

  Stage one. A council-run allotment site, forty-odd plots, one shared standpipe at the top by the gate with a single tap. Summer evenings, everyone needs water at the same time, hoses get tangled, and there are proper rows about who goes next. What settles it is a regularity that grows up on its own: you leave your watering can in the line against the hedge, and the order of the cans is the order of drawing. Turn up and your can's been shifted, you can complain and the committee backs you. That's meant to be a clean, unobjectionable instance of Lewis's analysis — coordination problem, equilibrium, everyone knows everyone knows, conformity supported by the fact that the others conform.

  Stage two. Six years on. The water board have layed a mains feed to every plot, so each plot has its own tap and its own hose and the pressure's fine. The old standpipe still runs but nobody uses it except to fill the wildlife pond at the bottom. There's no scarcity, no queue, nothing to loose by drawing water "out of turn" — the coordination problem has just evaporated. And yet every Saturday morning the cans still go out in the same row, and it is policed. A newcomer who puts their can out of place, or fills at the standpipe in the wrong order, gets frozen out of the seed swap, told off in front of the whole site, and finds nobody will lend them a hand with their bean frame. The person doing the telling-off is out of pocket for it: they lose an afternoon, they get shouted at, and they gain nothing whatsoever, because their own water comes out of their own tap. The old secretary who set the whole thing up has died, nobody under sixty can say why the row exists, and the two or three who try give rationalisations that are visibly false (it keeps the path clear; it stops the hedge getting knocked about).

  Constraints, and these matter. Realistic — no science fiction, no exotic physics, this could be a real place down the road from me. The scenario proper in two paragraphs at most, concrete enough that I could point at it. The stage-two regularity has to be stable, not decaying, not a handful of old-timers holding out while everyone else drifts off. Everybody on the site knows the rule and knows that everybody else knows it, so please don't let the case turn on common knowledge eroding — that's the obvious exit and I don't want you taking it. The clause that has to give way is the preference one: at stage two nobody's conformity is supported by a preference for other people's conformity, because there's nothing left to coordinate about. And the sanctions must not be a second-order convention in disguise — nobody sanctions because they expect to be sanctioned for not sanctioning, there's no reputational payoff, no one benefits — so that the "it's just a coordination problem one level up" reply is blocked by the facts of the story rather than by my decreeing it.

  Then the demonstration, which is the part I actually care about. Take the clauses of Lewis's analysis across both stages one at a time and say which hold and which fail. If more than one clause goes at stage two, tell me the order they fall in and which failure is doing the real work. Then tell me which single feature of the case is load-bearing, and what happens to the verdict if I take it away — say, if the telling-off became costless, or if someone on the site could still explain the original reason for the row. And then the honest bit: Lewis himself allows somewhere that once a convention is up and running people can come to disapprove of nonconformity and conform out of a sense of obligation rather than prudence, so tell me straight whether my stage two is just an instance of that remark and therefore no embarrassment to him at all, or whether it's genuinely outside the analysis — and give me the best reply a defender of Lewis could make to this case, and your view on whether it lands.

  No headings, no bullet points, no bold, no tables. Continuous prose throughout, the way you'd write an email to a colleague. Somewhere between eight hundred and a thousand words, and please don't pad the scenario to get there.
