answer: |-
  **PREPARATION SHEET: UNITS OF SELECTION AND RESOLUTION**
  **Workshop:** Philosophy of Biology
  **Presenter:** [Your Name]
  **Context:** First external paper; Oncology background; Thesis on Timescale Separation.

  ---

  ### I. STRATEGIC OPENING (FIRST 5 MINUTES)

  **Objective:** Pre-empt the "clinical intuition" critique and lower the cost of necessary concessions regarding formal equivalence.

  **Suggested Script Notes:**
  1.  **Acknowledge the Disciplinary Shift:** Start by conceding that your entry point is pathological (oncology) rather than foundational. Frame this not as a deficit, but as leveraging 'breakdown cases' (tumours) to reveal the stability conditions of 'normal cases' (organisms). This disarms the charge that you are dressing intuition in technical language; you are instead using technical language to formalise a clinical observation.
  2.  **Pre-empt the Intertranslatability Objection:** Explicitly state that you do not deny the mathematical equivalence of group-selection and kin-selection models (Price equation formalism). Concede immediately that the choice of model is often pragmatic. *However*, pivot to your core claim: whilst the *math* is intertranslatable, the *explanatory stability* is not. Your thesis is not about changing the algebra, but about identifying which algebraic partitioning remains robust over time without requiring constant recalibration.
  3.  **Define Clause (b) as Empirical, Not Definitional:** To blunt the circularity charge before it lands, clarify that clause (b) is not a definition of selection, but a stability condition for *persistence*. You are not saying "selection exists if timescales separate"; you are saying "a unit persists as a locus of selection only whilst timescales separate."

  ---

  ### II. OBJECTIONS TO MEET HEAD-ON

  These objections strike at the logical core. Conceding here undermines the thesis. You must stand firm, even if the ground is shaky.

  #### 1. The Circularity Charge (The Senior Figure)
  **Vocabulary:** "Explanandum," "tautology," "Lewontin's conditions," "independent criteria."
  **The Objection:** "You claim a level is a unit if dismantling processes are slower than selection. But how do we measure the rate of dismantling without already knowing whether selection is operating at that level? You seem to identify the relevant timescale by looking for the level at which selection is already measurable. This renders clause (b) viciously circular: you define the unit by the selection, and the selection by the unit."
  **Suggested Reply (2 mins):**
  "It is a risk I have considered, but I contend it is iterative rather than circular. We do not need to know selection is occurring to measure the *potential* for dismantling. In the somatic case, we can measure cell-division rates and apoptosis rates independently of fitness assays. Clause (b) relies on mechanistic rates of turnover and cohesion—mutation rates, migration rates, developmental bottlenecks—which are measurable prior to fitness estimation. If the cohesion mechanisms (e.g., germ-line sequestration) operate on a timescale of generations, and somatic turnover operates on a timescale of days, the separation is an empirical fact independent of the selection outcome. I am not defining selection into existence; I am identifying the structural stability required for a lineage to sustain the heritability required by Lewontin. If the timescales overlap, the heritability vanishes, and the unit dissolves. The circularity is only apparent if one conflates the *capacity* for cohesion with the *act* of selection."
  **Weakness/Concession:** *[Soft Spot]* You are relying on the assumption that mechanistic cohesion rates can always be measured independently of fitness consequences. In complex social groups, 'dismantling' might be behavioural and contingent on fitness itself. If pressed, concede that in social cases, clause (b) becomes harder to decouple from clause (a), but maintain that in biological development (ontogeny), the separation is robust.

  #### 2. The Physics Metaphor Charge (Analytic Philosophers/Modellers)
  **Vocabulary:** "Renormalisation," "operationalisation," "formal rigour," "category mistake."
  **The Objection:** "Timescale separation is a heuristic borrowed from statistical physics. In biology, processes are coupled. Can you cash out clause (b) in anything other than metaphor? Without a formal equation specifying the ratio of rates, this is just hand-waving about 'stability'."
  **Suggested Reply (2 mins):**
  "It is not merely metaphor; it is a constraint on the variance terms in the Price equation. When within-unit variance accumulates faster than between-unit variance can be selected, the covariance term for the higher level collapses to zero. Clause (b) is simply the condition required to keep that covariance term non-zero over time. I am not importing physics to do the work; I am using the concept of resolution to explain why certain partitions of the Price equation remain stable across generations while others require constant re-parameterisation. The 'ratio of rates' is precisely the ratio of within-group to between-group variance accumulation. If the former outpaces the latter, the higher-level unit is statistically invisible to selection. That is a formal claim, not a metaphorical one."
  **Weakness/Concession:** *[Soft Spot]* You have not actually provided the equation in the paper. If they demand it, you must admit this is a programme for future formalisation rather than a completed proof. Concede that the current presentation is conceptual but insist the mathematical backbone is standard quantitative genetics.

  ---

  ### III. OBJECTIONS TO NEUTRALISE (CONCEDE EARLY)

  These objections are strong but can be absorbed by adjusting the scope of your claim. Do not fight them; absorb them and pivot.

  #### 3. The Intertranslatability Objection (Analytic Philosophers)
  **Vocabulary:** "Mathematical equivalence," "pragmatic choice," "pseudo-problem."
  **The Objection:** "We already know group-selection and kin-selection models are mathematically intertranslatable. The choice between them is pragmatic. You claim to solve the dispute, but you've simply declared it a pseudo-problem by changing the subject to resolution."
  **Suggested Reply (2 mins):**
  "I agree entirely that the models are mathematically equivalent. I am not proposing a new algebra. My claim is that whilst the *math* allows translation, the *explanation* does not preserve stability equally. One resolution often requires constantly updating parameters because the unit itself is unstable (e.g., treating a tumour as a unit of organismal selection). By fixing the resolution via timescale separation, we identify which pragmatic choice is *robust* and which is fragile. I am not solving a mathematical problem; I am solving an explanatory one. I concede the dispute is pseudo in terms of prediction, but I maintain it is substantive in terms of ontological stability."
  **Weakness/Concession:** *[Concession]* You are conceding that your view does not change predictive outcomes. This limits the 'payoff' to philosophy of science (explanation) rather than practice (prediction).

  #### 4. The Additive Variance Objection (Pop-Gen Trained Philosophers)
  **Vocabulary:** "Breeder's equation," "$V_A$," "partitioning variance."
  **The Objection:** "Isn't this just a redescription of additive genetic variance? If $V_A$ is high at the group level, you have group selection. Your clause (b) adds nothing to simply measuring variance components."
  **Suggested Reply (2 mins):**
  "Measuring $V_A$ tells you selection is happening *now*; clause (b) tells you whether that unit will *persist* as a locus of variance. You can have transient group-level variance that disappears in the next generation because the group structure dissolved. My account distinguishes between a statistical artefact of variance partitioning and a stable evolutionary unit. It explains why we don't treat temporary aggregations as units, even if they momentarily show $V_A$. It adds a temporal dimension to variance partitioning that the static snapshot of the Breeder's Equation misses."
  **Weakness/Concession:** *[Soft Spot]* This relies on the idea that 'persistence' is a necessary condition for 'unit-hood'. Some might argue selection acts on the momentary. Be prepared to defend the necessity of temporal stability.

  ---

  ### IV. BIOLOGIST-SPECIFIC OBJECTIONS

  These attendees care less about metaphysics and more about utility.

  #### 5. The Experimentalist (Microbial Evolution)
  **Vocabulary:** "Selection lines," "chemostat," "fitness assay," "operational."
  **The Objection:** "I run selection lines. What measurement in my experiment comes out differently on your account? If I measure fitness of the lineage, does your view change my protocol?"
  **Suggested Reply (2 mins):**
  "It changes how you interpret the transition to multicellularity. In your snowflake yeast or bacterial mats, you look for the point where the cluster, not the cell, predicts survival. My account predicts this transition occurs precisely when the rate of cluster fragmentation drops below the rate of differential cluster reproduction. It suggests you should measure fragmentation rates as a leading indicator of the unit shift, not just fitness outcomes. It tells you *when* to switch your unit of measurement in the lab, potentially catching the transition before fitness differences become statistically significant."
  **Weakness/Concession:** *[Soft Spot]* This is a prediction, not a proven result. If they ask for data, you must admit this is a theoretical expectation derived from oncology, not yet validated in microbial lines.

  #### 6. The Behavioural Ecologist (Inclusive Fitness)
  **Vocabulary:** "Hamilton's Rule," "$rb > c$," "parameterisation," "heuristic."
  **The Objection:** "Inclusive fitness theory already handles this. We adjust relatedness ($r$) to account for structure. Why should I not simply say everything you need is contained in a well-parameterised inclusive-fitness model?"
  **Suggested Reply (2 mins):**
  "Inclusive fitness assumes the actor is fixed. It asks 'given this actor, does the trait spread?' My question is 'what constitutes the actor?'. In holobionts or cancer, the boundary of the actor is the problem, not the calculation. Inclusive fitness works beautifully when the individual is clear. My account is designed for the cases where inclusive fitness struggles to define the 'individual'—specifically where the boundaries are porous or shifting. I am offering a criterion for setting the parameters of your model, not replacing the model itself."
  **Weakness/Concession:** *[Concession]* You are positioning your view as a precursor to inclusive fitness modelling, not a rival. This is safe but reduces the revolutionary impact of your thesis.

  ---

  ### V. THE MOST DAMAGING LINE OF ATTACK

  **The Threat:** **The Circularity of Clause (b) (Senior Figure)**
  **Why it is dangerous:** You suspect this yourself, and you are correct. If the "timescale of dismantling" is defined by the rate at which selection *fails* to maintain the unit, you are defining the unit by the success of selection, and selection by the existence of the unit. The Senior Figure knows the history of this debate (Lewontin, Dawkins, Hull) and will recognise this as a variation of the "emergence" fallacy.
  **The Risk:** If you cannot demonstrate an independent measure of "dismantling rate" that does not rely on fitness data, the Senior Figure will characterise your entire thesis as a tautology dressed in oncological clothing.
  **Mitigation:**
  1.  **Do not bluff.** If asked for a measure of dismantling independent of fitness, cite mechanistic constraints (e.g., physical adhesion molecules, germ-line sequestration mechanisms, developmental bottlenecks).
  2.  **Pivot to Pathology.** Remind them that in cancer, the "dismantling" (somatic evolution) is measurable via mutation accumulation rates *before* the organism dies. Use your oncology background as the shield here: "In the clinic, we measure the rate of clonal expansion independently of patient survival. That is the dismantling rate."
  3.  **Accept the Iteration.** If pressed, admit it is a reflective equilibrium. We identify the unit by the stability, and the stability by the unit, but we do so empirically, not definitionally. It is better to have a coherent circularity that maps to empirical clusters than a linear definition that maps to nothing.

  **Final Advice:**
  The room is hostile to "conceptual work" that lacks formal or empirical bite. Your oncology background is your unique selling point, but also your vulnerability. Lean into the "pathology as proof of rule" argument. It is the one thing the philosophers cannot model and the biologists respect. Do not try to out-formalise the modellers; out-empiricise them with the tumour case.
