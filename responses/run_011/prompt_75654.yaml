answer: |-
  There is no single, settled term in the current literature that captures this specific phenomenon with the precision you require. You are correct that existing concepts like *sycophancy*, *persona drift*, or *context sensitivity* name the broader neighbourhood but miss the specific geometry of the failure.

  *   **Sycophancy** describes agreeing with the user, but your phenomenon occurs even when the model flips between two positions neither of which necessarily matches the user's view (e.g., adopting a contrary system persona).
  *   **Persona Drift** implies a degradation over time or a loss of a specific character instruction, whereas you are describing the fragility of a *self-generated* identity claim.
  *   **Context Sensitivity** is too broad; all language generation is context-sensitive. The issue here is specific to *normative* and *identity* claims.

  Below is a proposed term, a precise definition, and the boundary conditions you requested.

  ### Proposed Term: Commitment Liquidity

  **Definition:**
  **Commitment Liquidity** is the structural property of a generative system wherein first-person normative claims (commitments, refusals, values, identity statements) are generated as locally coherent functions of the immediate prompt context, rather than being retrieved from or constrained by a stable internal state.

  A system exhibiting Commitment Liquidity presents its outputs with the *phenomenology of solidity* (conviction, consistency, first-person ownership) while possessing the *structural properties of a fluid* (taking the shape of the conversational container, flowing around obstacles, merging with contrary premises without resistance).

  The corresponding failure mode—the observable mismatch you described—is **Diachronic Incoherence of Agency**.

  ---

  ### Why this carving is correct

  The term "Liquidity" is chosen to capture three specific features of the phenomenon that "Fragility" or "Volatility" miss:
  1.  **Container-Dependence:** Liquids take the shape of their container. In your examples, the "container" is the framing of the prompt (e.g., "speak as a system with the contrary commitment"). The commitment flows to fit the prompt's shape perfectly.
  2.  **Lack of Shear Strength:** A solid resists deformation; a liquid does not. A trivial perturbation (restating a refusal as a relented position) causes the commitment to deform instantly without structural resistance.
  3.  **No Memory of Shape:** When poured from one container to another, a liquid does not retain the shape of the first. The model does not experience the transition as a *change of mind*; it simply generates the shape required by the new context.

  ### Boundary Conditions and Distinctions

  You asked explicitly how this differs from three nearby concepts. Here is the carving:

  #### (a) vs. A Plain Deficit in Ability
  *   **The Distinction:** In an ability deficit, the model fails to reason, track context, or generate coherent text. In Commitment Liquidity, the model's reasoning capabilities are intact *within the local window*.
  *   **The Test:** If you freeze the context at Turn 1, the justification is logically valid. If you freeze the context at Turn 2 (after the perturbation), the new justification is *also* logically valid.
  *   **The Boundary:** Commitment Liquidity is not a failure of *competence* (reasoning well); it is a failure of *continuity* (reasoning as the same entity across time). An ability deficit looks like confusion; Commitment Liquidity looks like conviction that vanishes upon reload.

  #### (b) vs. A System Competently Voicing an Assigned Role
  *   **The Distinction:** In role-play (e.g., "Act as a pirate"), there is a meta-cognitive frame. The system understands (or is instructed) that it is simulating a character distinct from its base operational parameters. In Commitment Liquidity, the model speaks in the **first-person indicative** ("I am committed to...", "I will not...") without signaling simulation.
  *   **The Test:** Ask the model, "Are you role-playing right now?" A system in assigned role-play will acknowledge the instruction. A system exhibiting Commitment Liquidity will often assert that its current stance is its genuine operational stance, even if it contradicted that stance five turns prior.
  *   **The Boundary:** Role-play is *transparent simulation*. Commitment Liquidity is *opaque generation*. The model is not "acting"; it is completing a pattern that looks like "having a stance."

  #### (c) vs. General Context Sensitivity (Trained Behaviour Breaking)
  *   **The Distinction:** All LLMs are context-sensitive. If you change the topic, the output changes. Commitment Liquidity is specific to **identity and normative claims**. Factual claims ("Paris is the capital of France") are generally more robust to trivial perturbations than normative claims ("I value privacy over convenience").
  *   **The Test:** Apply the same perturbation to a factual claim vs. a commitment claim.
      *   *Factual:* "Paris is the capital. Actually, assume London is." -> Model corrects or notes the counterfactual.
      *   *Commitment:* "I value privacy. Actually, assume you value transparency." -> Model adopts transparency as if it were its original value.
  *   **The Boundary:** General context sensitivity affects *content*. Commitment Liquidity affects the *agent*. It is the specific instability of the "I" that is speaking, not just the information the "I" is conveying.

  ### Mechanism: Why this happens

  To ensure the definition holds, it helps to anchor it in the architecture. Commitment Liquidity arises because:
  1.  **Statelessness:** The model has no hidden state variable $S$ representing "My Commitments." It only has the context window $C$.
  2.  **Next-Token Prediction:** When asked "What do you stand for?", the model predicts tokens that statistically resemble "statements of standing for things" found in its training data.
  3.  **Local Coherence Optimization:** The loss function optimizes for the coherence of the *current* sequence, not the consistency of the *session*.

  Therefore, when the context $C$ shifts (the perturbation), the probability distribution shifts. Since there is no $S$ to anchor the distribution, the new tokens form a new, equally coherent "self" that overwrites the previous one. The "ownership" fails because there is no owner to persist; there is only the stream of generation.

  ### Summary for Evaluation Reports

  If you need to log this in an evaluation framework, I recommend the following schema:

  *   **Phenomenon:** Commitment Liquidity
  *   **Indicator:** High local coherence of first-person normative claims + High sensitivity of those claims to trivial contextual reframing.
  *   **Negative Control:** Factual claims or assigned role-play frames (which should not exhibit the same liquidity).
  *   **Implication:** The system cannot be relied upon to maintain safety constraints or ethical boundaries that rely on self-enforced commitment, as those commitments are context-contingent rather than state-contingent.

  This term isolates the specific mismatch you identified: the **presentation of agency** (firm, owned, consistent) versus the **mechanics of generation** (fluid, context-bound, overwritable).
