prompt: |-
  I'm setting the final for a senior seminar on individual responsibility for collective harm — climate, consumption, voting, that cluster. It's 2.5 hours with two questions, so this one gets about 70 minutes and is worth 25 marks. I've got the skeleton of a question built around a made-up case with actual numbers in it, and I want help turning it into something exam-ready plus a model answer and a marking scheme.

  The case, as I have it in my head. Tighten the wording however you like but keep the numbers — the numbers are the whole point:

  A coastal fishery sells a cheap white fish, $9 a portion, through supermarkets. Retailers place around 3 million orders a season, from a customer base of about 250,000 households, so each household orders maybe a dozen times over the season. The boats operate under a rule: they run the sustainable season only, unless cumulative retail orders pass 3 million, in which case they add a second bottom-trawling season that destroys the breeding stock for good. The damage from that second season is roughly $2 billion — a food source and the economy built on it, gone permanently, and borne largely by people who never bought the fish.

  Two versions of the same season:
  - Version A: expected total orders = 3.4 million, standard deviation about 20,000 (the aggregate is noisy — weather, a competitor's promotion, whatever).
  - Version B: expected total orders = 3.0 million, same spread.

  Here's what I want students to land on, and why the case has arithmetic in it at all. In Version B, the chance that any given order is the pivotal one — the one that moves the count from exactly 3 million to 3,000,001 — is about 1 in 50,000; you can just stipulate that figure for them, it's the density of the distribution at the threshold times one unit and I don't want anyone needing a probability course. Multiply by $2bn and a single $9 order carries roughly $40,000 of expected harm. In Version A the expected total sits twenty standard deviations past the threshold, so the pivotal probability is zero for any practical purpose and the expected harm of an order is zero. Same act, same harm function, same crowd — and an expected-harm account says the order is grotesquely wrong in B and completely fine in A.

  The question should make them: (1) actually do that multiplication and the A/B comparison, not gesture at it; (2) say what it shows about the standard expected-utility reply to the inefficacy objection, including the corollary I think is the real killer — the act comes out *permissible* in exactly the version where the disaster is certain, so permissibility tracks the location of a crowd rather than how bad things go; (3) handle the epistemic wrinkle, which I think is underappreciated: no diner can know the mean or the spread, so on this account permissibility depends on facts nobody can access, and it looks like it gives agents a reason not to read the mid-season sales report — is a moral theory allowed to make your duty depend on news you'd rather not get?; and (4) say whether the non-causal alternatives do better or just relocate the problem. By (4) I mean complicity-style views and membership or joinability views, where wrongness comes from taking part in a practice rather than from contributing to the harm. I want them pressed hard on the discrimination worry: if participation is doing the work, why isn't buying electricity or a bus ticket in a modern economy exactly as wrong as the fish, and what would it take to answer that without collapsing back into consequences.

  They'll have seen the usual material in class — Parfit's harmless torturers, the sorites-style each-drop arguments, the voting version of the same problem. The question must not be answerable by reciting any of that, and I don't want them citing anything: the case is self-contained and everything they need is inside it. There also shouldn't be one right verdict. A student who argues the purchase is permissible in both versions, or wrong in both, should be able to get top marks if the argument is good.

  So, deliverables:

  1. The question as it would appear on the paper, case stated cleanly and compactly, with the Version B pivotal probability given to them as a stipulated figure rather than something to derive.
  2. A model answer of about 700 words.
  3. A marking scheme out of 25, built as five or six must-hit moves with marks apportioned, and for each move an explicit line on what a B answer does where an A answer does something else — I want to be able to hand this to a TA and get consistent grades.
  4. A short list of four or five wrong answers you'd realistically expect to see, e.g. treating Version A's certainty of collapse as making the act worse, or writing "small contributions add up" as if that were a reply to a threshold case, or concluding from the epistemic problem that morality must be subjective. For each, one line on where the mark ceiling is and what partial credit it can still pick up.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Senior seminar final exam (Individual Responsibility for Collective Harm).
      *   **Format:** 2.5 hours total, this question is ~70 minutes, 25 marks.
      *   **Topic:** Individual responsibility in collective harm contexts (climate, consumption, voting).
      *   **Core Case:** A fishery with a threshold (3 million orders). Below threshold = sustainable. Above threshold = catastrophic harm ($2 billion).
      *   **Versions:**
          *   Version A: Expected orders = 3.4 million (SD 20k). Threshold is 20 SDs away. P(pivotal) $\approx$ 0.
          *   Version B: Expected orders = 3.0 million (SD 20k). Threshold is at the mean. P(pivotal) $\approx$ 1/50,000.
      *   **Key Insight to Test:** Expected harm calculation ($2bn * 1/50,000 = $40,000 vs. $0). This creates a counterintuitive result: the act is "worse" when the disaster is uncertain (B) than when it is certain (A).
      *   **Required Student Tasks:**
          1.  Perform the calculation/comparison.
          2.  Analyze the Expected Utility (EU) reply to inefficacy (permissibility tracks crowd location, not outcome severity).
          3.  Address the epistemic wrinkle (duty depends on unknown facts; incentive to remain ignorant).
          4.  Evaluate non-causal alternatives (complicity/membership) regarding the discrimination problem (why fish but not electricity/bus?).
      *   **Constraints:** No citations allowed. Case must be self-contained. No single "right" verdict (argument quality matters).
      *   **Deliverables:**
          1.  Exam Question (clean, compact).
          2.  Model Answer (~700 words).
          3.  Marking Scheme (25 marks, 5-6 moves, A vs. B distinction).
          4.  Common Wrong Answers (4-5 types, mark ceilings, partial credit).

  2.  **Drafting the Exam Question:**
      *   *Goal:* Clarity and precision. The numbers must be prominent. The instructions must be specific about the four required elements.
      *   *Wording:* Needs to sound like a formal exam prompt. "Consider the following case..."
      *   *Structure:* Case description -> Version A/B -> Specific tasks (1-4).
      *   *Refinement:* Ensure the "1 in 50,000" figure is explicitly given for Version B to save time on math derivation. Ensure the $2bn and $9 figures are clear.

  3.  **Drafting the Model Answer:**
      *   *Goal:* Demonstrate an "A" grade response. It needs to hit all four required points logically and concisely within ~700 words.
      *   *Tone:* Analytical, philosophical, not just descriptive.
      *   *Content:*
          *   *Calculation:* Show the $40k vs $0 expected harm.
          *   *EU Analysis:* Highlight the paradox (certain disaster = permissible; uncertain disaster = impermissible).
          *   *Epistemic:* Discuss the "ought implies can/know" tension and the incentive for ignorance.
          *   *Non-Causal:* Discuss complicity/membership. Acknowledge they fix the A/B paradox but raise the "overdemandingness/discrimination" objection (electricity/bus).
          *   *Conclusion:* Synthesize without necessarily picking a side, but showing the trade-offs.
      *   *Word Count Check:* Keep it tight. Avoid fluff.

  4.  **Developing the Marking Scheme:**
      *   *Total:* 25 Marks.
      *   *Structure:* 5 Key Moves (5 marks each). This makes it easy for TAs.
      *   *Moves:*
          1.  Expected Harm Calculation (A vs B).
          2.  Implications for Expected Utility/Consequentialism (The Paradox).
          3.  Epistemic Objection (Ignorance/Information).
          4.  Non-Causal Alternatives (Complicity/Membership).
          5.  Discrimination/Overdemandingness Objection to Non-Causal views.
      *   *Differentiation:* Define what a "B" (competent) answer looks like vs. an "A" (insightful/nuanced) answer for each move.
      *   *Flexibility:* Allow for different verdicts (Permissible vs. Impermissible) as long as justified.

  5.  **Identifying Common Wrong Answers:**
      *   *Error 1:* Confusing certainty with wrongness in Version A (Thinking certain harm = higher individual responsibility).
      *   *Error 2:* The "Drop in the Bucket" error (Ignoring the threshold, saying small harms add up linearly).
      *   *Error 3:* Epistemic Nihilism (Because we can't know, morality is subjective/impossible).
      *   *Error 4:* Dismissing Non-Causal views without engaging the discrimination worry.
      *   *Error 5:* Ignoring the specific numbers provided.
      *   *Mark Ceilings:* Need to assign a max mark for answers falling into these traps (e.g., if they miss the calculation entirely, they can't get more than 10/25).

  6.  **Review and Refine:**
      *   *Check against constraints:* Did I include citations? No. Is the case self-contained? Yes. Are the numbers preserved? Yes ($9, 3m, 250k households, $2bn, 1/50,000).
      *   *Check tone:* Is it appropriate for a senior seminar? Yes, it assumes philosophical literacy (expected utility, complicity, epistemic conditions) without needing specific text recall.
      *   *Check Model Answer:* Is it too prescriptive? It should show *how* to argue, not dictate *what* to conclude. I will ensure the model answer acknowledges the strength of the counter-arguments.
      *   *Check Marking Scheme:* Is it TA-proof? The distinctions between A and B need to be concrete (e.g., "identifies the paradox" vs. "explains *why* the paradox undermines the theory").

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the prompt, make sure to explicitly tell students *not* to cite outside material.
      *   *Correction:* In the marking scheme, ensure the "Verdict" isn't graded, but the "Justification" is.
      *   *Correction:* Ensure the Model Answer doesn't exceed 700 words significantly. (I will monitor this closely).

  8.  **Final Output Generation** (Proceeding to generate the response based on these steps).
answer: |-
  ### 1. Exam Question

  **Question 2 (25 Marks)**
  **Time Allocation:** Approximately 70 minutes

  **Case: The Fishery Threshold**
  A coastal fishery sells a white fish for $9 per portion through supermarkets. There are 250,000 households in the region. In a typical season, retailers place a total of roughly 3 million orders. The boats operate under a strict rule: they fish only the sustainable season unless cumulative retail orders exceed exactly 3,000,000. If orders reach 3,000,001, the boats add a second, destructive bottom-trawling season. This destroys the breeding stock permanently. The economic and ecological damage of this collapse is valued at $2 billion, borne largely by people who never bought the fish.

  Consider two versions of the same season:
  *   **Version A:** The expected total orders are 3.4 million. The standard deviation is 20,000. The threshold (3 million) is far below the expected total.
  *   **Version B:** The expected total orders are 3.0 million. The standard deviation is 20,000. The threshold is at the mean of the distribution.

  *Stipulation:* In Version B, the probability that any single order is pivotal (i.e., moves the total from 3,000,000 to 3,000,001) is 1 in 50,000. In Version A, given the distribution, the pivotal probability is effectively zero.

  **Task:**
  Write an essay addressing the following four points:
  1.  **Calculation:** Using the figures provided, calculate the expected harm of a single $9 order in Version A and Version B.
  2.  **Expected Utility Implications:** Explain what these calculations imply for an expected-utility account of responsibility. Specifically, address the relationship between the *certainty* of the collective disaster and the *permissibility* of the individual act in each version.
  3.  **Epistemic Conditions:** Discuss the epistemic problem. If a diner cannot know the mean or spread of orders mid-season, does this account make moral duty depend on inaccessible facts? Does it create an incentive for ignorance?
  4.  **Non-Causal Alternatives:** Consider views where wrongness stems from complicity or participation rather than causal impact. Do these views solve the problem identified in (2)? If so, do they introduce a new problem regarding "discrimination" (e.g., why is fish different from electricity or bus tickets in a modern economy)?

  *Note: Do not cite outside texts or authors. Rely solely on the case details and philosophical reasoning.*

  ***

  ### 2. Model Answer (Approx. 700 words)

  In Version A, the expected total orders (3.4 million) exceed the threshold by twenty standard deviations. The probability of a single order being pivotal is effectively zero. Therefore, the expected harm of a $9 order is $0. In Version B, the pivotal probability is stipulated at 1/50,000. With a collective harm of $2 billion, the expected harm of a single order is $40,000 ($2,000,000,000 ÷ 50,000).

  This arithmetic generates a counterintuitive result for expected-utility accounts. In Version A, the collective disaster is virtually certain; the fishery will collapse regardless of what any individual does. Yet, because no individual can change the outcome, the expected harm of buying is zero, rendering the act permissible. In Version B, the disaster is only 50% likely (since the mean is at the threshold), but the act is impermissible because the expected harm ($40,000) vastly outweighs the benefit ($9). Thus, permissibility tracks the statistical location of the crowd rather than the severity of the outcome. An act is forbidden when it might prevent a disaster, but permitted when it definitely cannot prevent a disaster, even if the disaster is guaranteed to occur. This suggests that expected-utility theories struggle to capture responsibility in threshold cases where individual efficacy vanishes against aggregate certainty.

  This leads to the epistemic wrinkle. For the expected-utility calculation to guide action, the agent must know whether they are in Version A or Version B. However, a diner cannot access real-time aggregate sales data. If duty depends on the mean order count, then duty depends on facts the agent cannot know. This creates a troubling incentive: an agent might have a prudential reason to avoid reading mid-season sales reports. If knowing the mean is 3.4 million makes the purchase permissible, while knowing it is 3.0 million makes it forbidden, the theory implies that remaining ignorant preserves permissibility. A moral theory that makes duty contingent on inaccessible facts, or that rewards ignorance, fails to provide action-guiding norms. It violates the principle that "ought implies can," or at least "ought implies can know."

  One might abandon causal efficacy for a non-causal view, such as complicity or membership. On this view, buying the fish is wrong not because it causes the collapse, but because it participates in a harmful practice. This solves the Version A/B paradox: the act is wrong in both versions because the practice is destructive, regardless of pivotal probability. The individual shares responsibility for the $2 billion harm by joining the collective enterprise.

  However, this relocates the problem to discrimination. If participation in a harmful practice is sufficient for wrongdoing, the scope of responsibility becomes unmanageable. In a modern economy, almost every purchase (electricity, bus tickets, banking) participates in structures that cause collective harm (carbon emissions, labor exploitation, etc.). If the fish is wrong because of participation, why is the bus ticket not equally wrong? To avoid condemning all modern life, the theory must distinguish between "acceptable" and "unacceptable" participation. But making that distinction usually requires appealing back to consequences (e.g., "the fishery harm is more severe" or "my contribution matters more here"). If the view collapses back into consequentialism to draw the line, it inherits the original expected-utility problems. If it does not, it risks being overly demanding or arbitrary.

  Ultimately, the case shows that causal accounts fail to condemn certain harm (Version A), while non-causal accounts struggle to limit responsibility (Discrimination). A robust theory must explain why an individual bears responsibility for a certain disaster even when they cannot prevent it, without making morality depend on secret statistics or condemning all economic participation.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Grading Note:** There is no "correct" verdict on whether the purchase is wrong. Marks are awarded for the quality of analysis regarding the four required tasks.

  | **Move** | **Criteria** | **Marks** |
  | :--- | :--- | :--- |
  | **1. Calculation & Comparison** | **A (5):** Correctly calculates $0 (A) vs $40k (B). Explicitly notes the inversion: higher expected harm in the uncertain version. <br> **B (3-4):** Correct math but misses the significance of the inversion, or minor arithmetic error with correct logic. <br> **C (0-2):** Fails to use the numbers provided or treats harm as linear ($9 = $9 harm). | **/5** |
  | **2. Expected Utility Implications** | **A (5):** Identifies the paradox: Act is permissible when disaster is *certain* (A) and impermissible when *uncertain* (B). Explains why this undermines efficacy-based responsibility. <br> **B (3-4):** Notes the difference in permissibility but describes it as "counterintuitive" without explaining the structural implication for the theory. <br> **C (0-2):** Claims Version A is worse because the harm is certain (ignoring the efficacy constraint). | **/5** |
  | **3. Epistemic Conditions** | **A (5):** Discusses both "inaccessible facts" (ought implies can know) AND the "incentive for ignorance" (strategic avoidance of information). <br> **B (3-4):** Discusses only one of the two epistemic problems (usually accessibility). <br> **C (0-2):** Dismisses the problem (e.g., "just guess") or concludes morality is subjective. | **/5** |
  | **4. Non-Causal Alternatives** | **A (5):** Explains how complicity/membership solves the A/B paradox (wrong in both). <br> **B (3-4):** States that non-causal views change the verdict but doesn't explain *how* they bypass the threshold issue. <br> **C (0-2):** Dismisses non-causal views without engagement. | **/5** |
  | **5. Discrimination Objection** | **A (5):** Articulates the "overdemandingness" problem (electricity/bus). Explains that solving this usually requires collapsing back into consequences. <br> **B (3-4):** Identifies the problem (too many things would be wrong) but misses the point about collapsing back into consequences. <br> **C (0-2):** Vague worry about "slippery slopes." | **/5** |

  ***

  ### 4. Common Wrong Answers & Mark Ceilings

  | **Error Type** | **Description** | **Mark Ceiling** | **Partial Credit Opportunity** |
  | :--- | :--- | :--- | :--- |
  | **The "Certainty is Worse" Error** | Student argues Version A is morally worse *because* the collapse is certain, ignoring the pivotal probability stipulation. | **15/25** | Can still get full marks on Moves 3, 4, & 5 if they handle epistemology and non-causal views well despite the initial calculation error. |
  | **The "Drop in the Bucket" Error** | Student treats harm as linear (e.g., "3 million people cause $2bn, so I cause $666") and ignores the threshold mechanism entirely. | **10/25** | Can get marks for Move 3 (Epistemic) and Move 5 (Discrimination) if argued independently of the calculation. |
  | **Epistemic Nihilism** | Student concludes that because we can't know the mean, morality is impossible/subjective, and stops arguing there. | **15/25** | Lose marks on Move 3 for giving up, but can score on Moves 1, 2, 4, 5 if they engage the rest of the prompt before the nihilist conclusion. |
  | **The "Complicity is Easy" Error** | Student argues complicity solves everything and ignores the Discrimination Objection (Move 5) entirely. | **20/25** | Lose marks specifically on Move 5. Must have strong performance on Moves 1-4 to reach this ceiling. |
  | **Ignoring the Numbers** | Student writes a general essay on climate/voting without using the $2bn, 1/50,000, or Version A/B distinction. | **10/25** | Cap at 2/5 for Move 1 and 2. Can recover marks on Moves 3, 4, 5 if the philosophical reasoning is sound despite ignoring the case specifics. |
