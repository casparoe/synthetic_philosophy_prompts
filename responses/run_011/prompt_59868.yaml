answer: |-
  Critic: The design is incoherent. You cannot run a pilot where the definition of success is decided after the data is collected. An experiment requires fixed criteria in advance. If you tell the evaluation office to measure outcomes based on what a citizens' assembly decides two years from now, you aren't testing a hypothesis; you're waiting for a verdict to manufacture the evidence. The assembly will look at the lottery results, see what happened, and declare victory or failure based on whatever story feels most vivid in the room. That isn't inquiry. It's retroactive justification.

  Deweyan: But who fixed the criteria before the experiment began? The evaluation office reports to the superintendent who proposed the closures. If the metrics are set in advance, they are endogenous to the power that framed the question in the first place. They will measure test scores and budget savings, because those are the variables the administration controls. They won't measure whether the neighborhood loses the only building with a gym, or whether working parents can manage the new bus times. By making the assembly's criteria binding, we force the measurement to account for the consequences the experts are incentivized to ignore.

  Critic: You're conflating political legitimacy with empirical validity. I grant you that the superintendent's office has a bias; every institution does. But the remedy isn't to hand the definition of truth to a group that lacks a feedback loop. Expert offices impose constraints on each other through peer review and replication. A citizens' assembly has no such mechanism. If a parent stands up and tells a heartbreaking story about a sibling who can't walk home safely, that becomes a "cost" regardless of whether the data supports it. You are laundering narrative as knowledge.

  Deweyan: You're right that a vivid story isn't data, and I concede that relying solely on testimony risks distorting the picture. But knowledge isn't just what can be counted in a spreadsheet. The people who eat the indirect consequences are the only ones actually positioned to say what counts as a cost. An expert can model bus routes, but they don't know which corner feels unsafe at 3 PM. If we don't let the people living the consequences define the metrics, we aren't running an experiment on school consolidation; we're running an experiment on compliance.

  Critic: I will concede that expert metrics often miss the texture of lived experience, and that bias is dangerous. However, stability in measurement is the price of knowing anything at all. If the criteria shift based on who shows up to the assembly, you can never distinguish between a failed policy and a failed meeting. You say the assembly defines success, but if the evaluation office cannot verify those claims against a stable standard, the whole pilot collapses into opinion. You need a fixed ruler to measure the change, even if the ruler was imperfectly made.

  Deweyan: A fixed ruler is useless if it measures the wrong thing. You say the pilot collapses into opinion, but I say it collapses into irrelevance if the metrics don't bind the power that enacted the change. If the assembly decides that community cohesion matters more than marginal budget savings, and the board ignores that because it wasn't in the original rubric, then the pilot was never an inquiry. It was a sales pitch. The binding criteria ensure that the discovery of consequences actually alters the trajectory of the policy.

  Critic: But that requires the assembly to act like a court of evidence, not a town hall. They need to understand that defining a criterion locks out other possibilities. If they decide success means "no increase in travel time," they might blind themselves to improvements in classroom quality that required longer rides. By refusing to fix the criteria now, you are asking them to judge the experiment without accepting the constraints that make judgment possible. You want the authority of science without the discipline of method.

  Deweyan: I want the discipline of method to serve the public, not the other way around. The constraint isn't the pre-fixed metric; the constraint is the consequence itself. If the travel time increases, that is a fact, regardless of the metric. The question is whether that fact counts as a failure. Only the people absorbing that time cost can answer that. If we lock the criteria now, we decide in advance that their time is less valuable than the budget surplus. That isn't methodological rigor; that's a political choice hiding behind a clipboard.

  Critic: Then you admit this is purely political. If the criteria are mutable based on who suffers, you have no way to compare this district to another, or this year to the next. You have sacrificed the ability to learn across contexts for the sake of legitimacy in this one. You are building a process that can validate any outcome, provided the right people are in the room to validate it. That isn't democracy as inquiry; it's democracy as veto.

  Deweyan: It's democracy as correction. The expert view assumes the context is static, that the variables are known. They aren't. The only way to learn what matters is to let the consequences speak through the people who bear them. If that makes comparison harder, so be it. I'd rather have a true verdict on this community than a comparable statistic that misses the point.

  Verdict: The people suffering the consequences of a policy are the only ones capable of defining what counts as a cost.
