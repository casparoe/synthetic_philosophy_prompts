answer: |-
  **Project Title:** Continuity and Commensurability: A Graded Approach to Utility Comparison

  **1. Research Question**
  The received debate regarding interpersonal utility comparisons (IUC) is structured by a binary threshold: either welfare levels are cardinally comparable across persons, or they are not. This project rejects the threshold model. It posits that comparability is not an all-or-nothing property but a continuous variable dependent on the degree of psychological connectedness between subjects. Consequently, the primary research question is not *whether* comparisons are possible, but: *What is the functional relationship between the degree of psychological connectedness between two person-stages and the epistemic precision with which their welfare levels can be compared?*

  This formulation admits of a determinate answer. Rather than a stand-off between metaphysical possibility and sceptical impossibility, the project seeks to derive a bounding function. This function will map metrics of psychological overlap (memory, intention, character) to maximum error bounds in welfare estimation. The hypothesis is that intrapersonal comparison is simply the limit case of high connectedness, while standard interpersonal comparison is the limit case of low connectedness, with intermediate cases (e.g., severe dementia, radical preference change) occupying the continuum.

  **2. Critique of Existing Positions**
  Current positions fail to settle this question because they presuppose the binary framing the project challenges. The optimist position, typically relying on extended sympathy or impartial observer devices, assumes that a normalisation rule can fix zero points and units for all agents equally. This approach ignores the metaphysical glue that makes comparison intelligible. It treats the comparison of a person with their future self as categorically distinct from the comparison of a person with a stranger, failing to explain why the former feels epistemically secure while the latter does not. By assuming a universal normalisation, optimists gloss over the variance in comparability that arises from variance in psychological continuity.

  Conversely, the sceptical position argues that because mental quantities are unobservable, any apparatus for comparison is unfalsifiable and therefore meaningless. This stance is too blunt. It treats all non-identity cases as equally opaque. It cannot distinguish between the high confidence we have in comparing an agent's welfare today versus tomorrow, and the low confidence we have in comparing distinct agents. By demanding impossible verification standards, scepticism forecloses inquiry into the graded nature of evidence available through narrative and psychological connection.

  Finally, the ordinalist retreat avoids the problem entirely by restricting welfare economics to preference rankings. While methodologically safe, this renders the framework incapable of addressing distributional equity or trade-offs involving intensity of experience. Ordinalism treats the binary question as a reason to stop asking, whereas the graded approach treats it as a reason to ask more precisely. All three positions assume that personhood is a switch; the project argues it is a dimmer.

  **3. Method and Work Plan**
  The project will construct a formal machinery centred on a Comparability Index, $C(A, B)$, mapping ordered pairs of person-stages to the interval $[0, 1]$. $C$ will be a function of three observable or arguable factors: memory overlap (proportion of shared episodic recall), intention fulfillment (degree to which past plans govern current action), and character stability (variance in fundamental preference orderings).

  The index will constrain the utility function $U$. Standard theory assumes $U(A) - U(B) = k$. This project proposes $|U(A) - U(B)| \leq \epsilon(C)$, where the error bound $\epsilon$ is inversely proportional to $C$. As connectedness drops, the permissible error margin expands, eventually rendering the comparison operationally null without requiring a metaphysical declaration of incomparability.

  The eighteen-month fellowship is divided into six quarters:
  *   **Quarter 1:** Formalisation of the connectedness metrics. I will define the operational variables for memory and intention overlap, drawing on philosophical reductionism about personal identity.
  *   **Quarter 2:** Derivation of the error function. I will model how $\epsilon$ scales with $C$, establishing the mathematical constraints on welfare differences.
  *   **Quarter 3:** Application to clinical case studies. I will apply the index to cases of dementia and brain injury to test the sensitivity of the model.
  *   **Quarter 4:** Integration with welfare economics. I will determine how the graded index modifies social welfare functions, specifically regarding weighting for disconnected selves.
  *   **Quarter 5:** Drafting the core philosophical argument. This will articulate the metaphysical shift from threshold to continuum.
  *   **Quarter 6:** Synthesis and dissemination. Finalising the monograph draft and preparing journal articles on the formal and applied components.

  **4. Test Cases**
  The viability of the graded account rests on its ability to deliver verdicts distinct from both scepticism and optimism.

  *   **Case 1: Moderate Psychological Discontinuity (Dementia).**
      Consider a patient with mid-stage Alzheimer's compared to their pre-onset self. The optimist claims full comparability based on bodily continuity; the sceptic claims incomparability based on broken psychological links. The graded account predicts partial comparability with high error bounds. Welfare judgments can be made, but they carry a "discount rate" proportional to the loss of connectedness. This differs from the binary views by permitting trade-offs that are sensitive to the *degree* of cognitive decline, rather than treating the patient as either fully the same or a different person.

  *   **Case 2: Zero Psychological Overlap (Adult vs. Infancy).**
      Consider an adult comparing their welfare to their own infancy. There is no memory overlap, no shared intentions, and negligible character stability. Here, $C \approx 0$. The graded account predicts incomparability. This conflicts with ordinary moral, clinical, and legal practice, which insists on comparing an adult's current state to their infant state to judge "best interests" or developmental success.
      *Verdict:* This is not a bug in the account; it is evidence that the practice is confused. When courts or clinicians claim to compare an adult's welfare to their infancy, they are either (a) implicitly comparing the adult to a *counterfactual* adult who would have existed had different infant choices been made, or (b) invoking a guardian's sympathetic projection rather than a genuine utility comparison. The project will argue that recognising this incomparability clarifies the normative landscape, forcing a shift from "best interests" to "best interests of the future connected self."

  **5. Conditions for Failure**
  The project will be regarded as having failed if any of the following three conditions obtain:
  1.  **Redescription:** If the Comparability Index $C$ does no independent explanatory work and merely redescribes our pre-existing binary intuitions in vaguer language. For the project to succeed, $C$ must be grounded in facts about psychological connectedness that are antecedently identifiable, not derived from the utility comparisons they are meant to justify.
  2.  **Formal Incoherence:** If the error function $\epsilon(C)$ cannot be mathematically integrated into a social welfare framework without violating basic rationality axioms (e.g., transitivity). If the graded comparability introduces cycles or contradictions in choice theory, the model is unusable.
  3.  **Normative Irrelevance:** If the graded distinctions yield no difference in policy recommendations compared to binary proxies. If treating dementia patients as "0.6 comparable" leads to the same resource allocation as treating them as "fully comparable," the added complexity is unjustified.

  **6. Scope and Alternatives**
  To ensure feasibility within eighteen months, the project must be scoped strictly. I will not construct a complete new social welfare function for macroeconomic policy; the focus remains on the micro-foundations of comparability. I will not conduct original empirical psychological studies; I will rely on established literature regarding memory and identity for the parameters of $C$.

  Three alternative approaches are rejected as inferior uses of this time:
  *   **Purely Neuroscientific Measurement:** Attempting to ground utility comparison directly in neural correlates (e.g., firing rates) is premature. It bypasses the normative question of why neural states count as welfare. The philosophical link between psychology and value must be secured before biological reductionism is attempted.
  *   **Revealed-Preference Reconstruction:** Trying to infer comparability solely from choice behaviour is circular in this context. We need to evaluate choices where the agent's identity is in flux; revealed preference assumes a stable agent.
  *   **Retreat to Ordinal Social Choice:** Abandoning cardinality surrenders the ability to analyze intensity and suffering. Given the centre's focus on welfare economics, a proposal that renounces the measurement of welfare magnitude would be insufficient.

  This project offers a middle path. It retains the cardinality required for welfare analysis while respecting the sceptic's demand for epistemic grounding. By treating personhood as a variable rather than a constant, it resolves the stalemate not by choosing a side, but by dissolving the binary that creates the opposition.
