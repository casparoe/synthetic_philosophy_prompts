answer: |-
  1. When the convenor presses whether I am applying a domestic pedigree test to a legal order that never met one, I will concede that applying such tests to a sui generis international order risks category error. But the Charter itself invoked penal principles like *nullum crimen* to legitimize the trial, inviting scrutiny against those standards rather than purely political ones. If the Tribunal claimed to declare existing law, it must meet the basic requirement of prior notice that domestic systems demand, otherwise the declaration is merely a label for *ex post facto* punishment. My argument accepts the Charter's novelty but insists that invoking criminal justice concepts binds the victors to the logical prerequisites of criminal liability. This distinction preserves the rule of law even within a transitional justice framework that acknowledges the unique post-war context. I am least secure on whether the interwar order truly lacked any nascent mechanism for personal liability that the Tribunal could reasonably have recognized.

  2. When a Hartian student asks whether my complaint is really about the rule of recognition of the post-war order, I will concede that a new legal order can establish its own rule of recognition to validate retroactive statutes. However, the Tribunal did not claim to be creating a new system from scratch but rather adjudicating within an existing continuum of international law where personal liability for aggression was unrecognized. To say the system legislates for itself ignores that the defendants were not participants in this system's creation and lacked the internal point of view required to be bound by its secondary rules. The critique is not that legislation is impossible, but that the specific legislative act lacked the pedigree to bind individuals who stood outside its normative community. This preserves the distinction between valid law and legitimate law without denying the sovereign capacity to legislate. I am least secure on defining the precise moment when an external observer becomes subject to a new regime's secondary rules.

  3. When the diplomatic historian asks whether I have read the negotiating record rather than the judgment, I will concede that the archive shows political necessity drove the decision to trial over summary execution. Yet reducing the legal form to mere epiphenomenon ignores that the participants themselves fought over the legal grounds because they knew the legitimacy of the enterprise depended on it. The retroactivity objection does explanatory work because it reveals why the Count 1 charge subsequently failed to travel while Crimes Against Humanity succeeded. Political necessity explains the trial's occurrence, but legal coherence explains the divergent trajectories of the specific charges afterward. Ignoring this legal dimension flattens the historical record of why certain charges endured while others were abandoned by the same victors. I am least secure on proving that the negotiators viewed legal coherence as a constraint rather than just a rhetorical shield.

  4. When the Tokyo specialist argues that I am ignoring that the Tokyo tribunal rested on a different jurisdictional foundation, I will acknowledge that Tokyo rested on a unilateral proclamation rather than an inter-allied treaty like Nuremberg. However, this difference underscores my point because the unilateral nature made the *ex post facto* objection even sharper, yet the charge still failed to travel in subsequent decades. Justice Pal's dissent highlights that the jurisdictional foundation did not cure the substantive lack of prior law, reinforcing that aggression lacked the normative uptake seen in Crimes Against Humanity. The comparison holds because both tribunals struggled to institutionalize personal liability for state acts despite their different formal origins. This suggests the failure was substantive rather than purely jurisdictional, validating the focus on the crime itself. I am least secure on whether Pal's dissent relied more on substantive natural law than strict positivist *ex post facto* grounds.

  5. Does your objection to retroactive crime creation undermine the Charter's removal of the superior-orders defense in Article 8, which was equally novel? I cannot presently answer this because I have not fully reconciled the distinction between retroactive substantive crimes and the retroactive removal of affirmative defenses, and to resolve it I would have to give up the claim that all novel Charter provisions suffer the same legitimacy deficit. This concession would require me to theorize a distinction between notice of wrongdoing and notice of unavailable defenses that I have not yet developed.
