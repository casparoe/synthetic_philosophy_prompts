  There is no single rule of averages that fits every choice, so I recommend the elaborate principle that saves all your verdicts. Your niece is correct that standard economic theory, which assumes you only care about the weighted average of outcomes, cannot explain why you sometimes prefer a lower average to avoid a specific bad result or chase a specific good one. This is because that simple principle ignores the context of survival and transformation that defines your life on the farm. Your rough idea is sound, but it needs to be tightened into a formal hierarchy where safety comes before profit, and hope comes before comfort. I call this the Safety-First with Optionality Principle, which is a ranking where safety comes before profit.

  The principle rests on four clauses. First, the Ruin Barrier: never accept a risk of losing the farm, however small, if the upside is only money. Second, the Hope Option: accept a small chance of a life-changing gain even if the average payoff is lower, provided the cost of losing is trivial. Third, the Comfort Zone: for all other choices, prefer the option with the higher average payoff, unless the downside causes disproportionate stress or annoyance. Fourth, the Agency Constraint: do not actively impose catastrophic risks on others that you passively accept for yourself. You should define "average payoff" as the sum of each outcome multiplied by its chance, and "life-changing" as an outcome that fundamentally secures or alters your future.

  Applied to your custom-farming decision, this principle tells you to take the guaranteed $85,000 contract. Working your own ground has a slightly higher average payoff of $87,000, but it carries a 20 percent chance of dropping to $15,000, which forces you onto the operating line and creates significant stress. This falls into the Comfort Zone, where you should avoid disproportionate stress for a negligible gain in average payoff, so the guaranteed contract is the correct choice.

  To probe this principle further, consider two cases. First, if offered a 99 percent chance to win $100,000 and a 1 percent chance to lose the farm, you must reject it under the Ruin Barrier, even though the average payoff is massive. Second, if offered a 99 percent chance to lose $500 and a 1 percent chance to win $200,000, you should accept it under the Hope Option, assuming $500 is trivial to you, even though the average payoff is negative. These cases test whether you truly prioritize survival over gain and hope over comfort.

  The sprayer-and-highway pair needs a separate clause regarding responsibility. Your refusal to haul the sprayer through town is governed by the Agency Constraint, which treats active risk to others differently than passive background risk, whereas your highway driving is a passive risk you accept for yourself. While both involve risk management, the moral weight of imposing danger on a school bus requires a distinct rule from the financial rules governing your own survival.

  The one additional choice that best discriminates between the simple rule of averages and my recommended principle is this: would you take a 99 percent chance to double your net worth and a 1 percent chance to lose the farm? The simple principle might tell you to take this bet because the average gain is enormous, but my principle tells you to reject it outright because it violates the Ruin Barrier.
