          *   *Priority:* Satisfy Compliance.
          *   *Therefore:* Material Falsehood = Deceptive. Material Omission/Implicature = Misleading.
          *   *Case 1:* Missing fee. Statement "Complete". False. -> **Deceptive**. (But I will add a Handoff for "Known System Error" which might downgrade to Misleading for internal reporting, but Compliance sees Deceptive).
          *   *Actually, let's look at the "Belief" substitute.* If the system *couldn't* know (upstream failure), is it "Deceptive"? In law, strict liability often applies. But for *moral* labeling, it's not a lie.
          *   *Compromise:* I will define **Deceptive** as "Ungrounded Falsehood" (Bullshit/Lie) and **Misleading** as "Grounded but Incomplete/Ambiguous".
          *   *Better:* Stick to the Prompt's Compliance definition: "Misleadingness... ignores intent entirely but is obsessed with materiality."
