answer: |-
  Here is the disambiguation menu. I have separated the slogan "What if everybody did that?" into five distinct logical arguments. Each has a different truth condition and applies differently to your two cases.

  ### The Menu of Arguments

  **1. The Causal Threshold Argument**
  *   **Claim:** "If everyone did X, the system would collapse. Therefore, your doing X contributes causally to that collapse."
  *   **Logic:** Consequentialist. Assumes individual acts sum linearly or trigger a threshold.
  *   **Verdict:** **False** (in negligible cases). If the grid is continuous and your load is infinitesimal, or if the threshold is already passed/unchanged by your specific unit, your causal contribution is zero. This is the "fallacy of composition" when applied to marginal acts.
  *   **Licenses Case 1?** No (unless you are literally the tipping point).
  *   **Licenses Case 2?** No.

  **2. The Kantian Universalizability Principle**
  *   **Claim:** "You ought not do X because you cannot rationally will that X become a universal law of nature without contradiction."
  *   **Logic:** Deontological. Ignores actual consequences; focuses on consistency of will. The harm isn't that everyone *will* do it, but that the *policy* of doing it is self-defeating if universalized.
  *   **Verdict:** **Substantive but Defensible.** It survives contact with negligible causal impact because it is not about impact; it is about duty. However, it requires accepting deontological constraints over consequentialist optimization.
  *   **Licenses Case 1?** Yes (as a duty to not free-ride on grid stability).
  *   **Licenses Case 2?** No (Kant argues against lying/promising-breaking, but doesn't necessarily solve PD via payoff maximization).

  **3. Rule Utilitarianism**
  *   **Claim:** "You ought to follow the rule which, if generally adopted, would maximize utility, even if breaking it in this specific instance would yield higher utility."
  *   **Logic:** Consequentialist (indirect). You are optimizing for the stability of the norm, not the single act.
  *   **Verdict:** **Substantive but Defensible.** It bites even when individual impact is negligible because the value being protected is the *adherence to the rule* itself.
  *   **Licenses Case 1?** Yes (follow the rule 'don't load during peak').
  *   **Licenses Case 2?** Yes (follow the rule 'cooperate in PD'), though often collapses into Act Utilitarianism in one-shot cases unless norms are valued intrinsically.

  **4. Superrationality / Evidential Correlation**
  *   **Claim:** "My decision is logically correlated with theirs. If I choose Defect, the probability that they choose Defect increases (or becomes 1). Therefore, Cooperating maximizes expected utility."
  *   **Logic:** Evidential Decision Theory (EDT) or Logical Decision Theory (LDT). Relies on symmetry and common knowledge of rationality.
  *   **Verdict:** **Substantive but Defensible** (within EDT/LDT frameworks). It is false under Causal Decision Theory (CDT). It requires specific epistemic conditions (see below).
  *   **Licenses Case 1?** No (other grid users are not running your algorithm).
  *   **Licenses Case 2?** Yes (this is the exact argument for Case 2).

  **5. The Parfitian "Imperceptible Harms" Argument**
  *   **Claim:** "An act can be morally wrong even if it makes no perceptible difference to the outcome, provided it is part of a set of acts that together cause harm."
  *   **Logic:** Consequentialist (non-linear). Rejects the "marginal contribution" requirement for moral responsibility.
  *   **Verdict:** **Substantive but Defensible.** This specifically rescues the argument when causal contribution is negligible. It shifts blame from *causing* the harm to *participating* in the harm.
  *   **Licenses Case 1?** Yes (this is the strongest consequentialist defense for Case 1).
  *   **Licenses Case 2?** No (irrelevant to PD symmetry).

  ---

  ### Answers to Your Specific Questions

  **1. Is there any version that bites when my individual contribution is causally negligible (Case 1)?**
  *   **The Causal Threshold Argument (#1)** fails here. If you are not the tipping point, this argument is false.
  *   **The Parfitian Argument (#5)** rescues it. Parfit (*Reasons and Persons*) argues that in "harmless torturer" cases, you are responsible for your share of the collective harm even if your specific shock is imperceptible.
  *   **The Kantian (#2) and Rule Utilitarian (#3)** arguments also rescue it, but they do so by abandoning pure act-consequentialism. They argue you have a duty to the *rule* or the *principle*, regardless of your specific causal footprint.

  **2. What exactly does the reading in Case 2 (Superrationality) require?**
  *   **Requirements:**
      1.  **Symmetry:** You and the opponent face identical payoff matrices and decision problems.
      2.  **Common Knowledge of Rationality:** You know they are rational, they know you are rational, you know they know you know, etc.
      3.  **Logical Correlation:** You must believe your decision procedure and theirs are sufficiently similar that your choice provides *evidence* of theirs (EDT) or that you are both instantiating the same abstract algorithm (LDT/Superrationality).
  *   **Vs. Kant:** Kant's Universal Law is about *consistency of will* (could I want this world?), not *payoff maximization*. Superrationality says "Cooperate because you get more points." Kant says "Cooperate because defecting is self-contradictory as a universal law."
  *   **Vs. EDT:** Standard EDT relies on statistical correlation (e.g., smoking indicates a lesion). Superrationality relies on *logical* identity (we are running the same code). If you are literally running the same source code, your move *determines* theirs, making the correlation coefficient 1.0. This is stronger than standard EDT.

  **3. Which readings get you abstention when other agents are NOT reasoning like you (Case 1 grid users)?**
  *   **Superrationality (#4)** fails completely. If the other users are not mirroring your decision procedure, your choice provides no evidence about theirs.
  *   **Causal Threshold (#1)** fails if your load is negligible.
  *   **Kantian (#2), Rule Utilitarian (#3), and Parfitian (#5)** **still hold.**
      *   **Kant:** You still cannot will the maxim "I will overload the grid when convenient" as a universal law, regardless of whether others actually follow it.
      *   **Rule Utilitarian:** You should follow the optimal rule even if others violate it (though some versions of RU allow breaking the rule if compliance is too low).
      *   **Parfit:** You are still participating in the collective harm, even if the others are "blind" actors.

  ### Summary for the Channel

  *   **Case 1 (Grid)** relies on **Generalization (Kant/Rule Util)** or **Collective Harm (Parfit)**. It fails if argued via **Causal Threshold**.
  *   **Case 2 (PD)** relies on **Superrationality (Logical Correlation)**. It fails if agents are not symmetric or logically linked.
  *   **The Slogan** is ambiguous between "Your act causes the collective outcome" (False in negligible cases) and "Your act is inconsistent with the collective good" (True/Defensible).
