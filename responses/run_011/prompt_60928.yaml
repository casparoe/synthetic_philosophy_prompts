answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Unrestricted Pool Allocation and Proposed Trading Protocol

  **Recommendation and Motion**

  I recommend we fund the Animal Welfare (AW) proposal in full this cycle and reject the proposed Standing Protocol for explicit trading. The specific allocation captures a critical efficiency gain unique to this cycle; the protocol institutionalizes fiduciary risks we cannot mitigate.

  **Motion:**
  1.  Allocate the full $1.5 million unrestricted pool to the Animal Welfare legislative campaign.
  2.  Record in the minutes the Board's non-binding intent to prioritize the Child Health (CH) proposal in the next cycle, contingent on fund availability and proposal quality.
  3.  Decline to adopt the Standing Protocol for trustee gain certification.

  **Dominance of the Fifty-Fifty Split**

  Is the split genuinely dominated? For the AW mandate, yes. The threshold effect means $750,000 yields zero impact. A split condemns the AW mandate to total ineffectiveness this year. For the CH mandate, dominance is conditional. A split secures 1,000 life-years now. The deal secures zero now, relying on a promise of 2,000 life-years next cycle. If that promise holds, the deal dominates (2,000 future > 1,000 present, assuming positive time preference is outweighed by scale). If the promise fails, the split dominates. Since both trustees agree the split is worse than a honored deal, we must treat the deferral risk as the pivotal variable, not the immediate math.

  **The Deferral Bargain and Future Boards**

  We must be explicit: this board cannot bind next year's board. The deferral bargain survives only as a norm, enforced by reputation and the personal commitment of returning trustees. If the composition changes, or if priorities shift, the promise is void. We are trading a certain loss today for a probabilistic gain tomorrow. Approving the deal requires us to accept that we are asking the CH beneficiaries to wait on the strength of our word alone. This is not a contract; it is a handshake. We should record the intent, but we must not deceive ourselves that it is enforceable.

  **Interpersonal Comparison in "Own Units"**

  The proposed protocol claims to avoid interpersonal comparison by requiring trustees to certify gains only in their own units. This is incorrect. While individual trustees may evaluate gains internally, the Board's collective approval of a trade necessarily implies a comparison. By voting to allocate scarce resources to Proposal A over Proposal B based on a trade, the Board asserts that the bundle of outcomes from A (plus concessions) is superior to the bundle from B.

  The protocol does not eliminate this comparison; it obscures the exchange rate. It shifts the comparative judgment from a public deliberation on value to a private certification of preference. This creates opacity rather than neutrality. We are still deciding that 30 million confinement years are worth more than 1,000 life-years plus administrative status quo, even if we refuse to write down the ratio. Hiding the math does not absolve us of the moral weight of the allocation.

  **Separability of Deal and Protocol**

  The specific bargain and the Standing Protocol are separable. The current deal addresses a market failure: the AW proposal's threshold creates a cliff where partial funding is waste. Capturing this efficiency is a fiduciary duty to avoid squandering resources. The Standing Protocol, however, normalizes trading mandates as if they were preferences.

  The efficiency gain here is obvious and one-off. The protocol invites systematic logrolling where efficiency is unclear. In this specific case, the AW trustee trades administrative pain (reporting) for existential funding. In a standing protocol, trustees might trade mandate core-values for peripheral gains repeatedly. The deal solves a coordination problem; the protocol solves a governance preference. We can solve the coordination problem without adopting the governance risk.

  **The Fifth Trustee's Objection and Concession**

  The fifth trustee's strongest objection is that a mandate is a duty owed to beneficiaries who cannot consent, not a preference available for swapping. To trade a mandate's funding for a procedural concession (the reporting resolution) or a future promise treats the beneficiaries' entitlements as chips in a game. This risks hollowing out the foundation's purpose over time, particularly where liquidity asymmetries exist (as noted, CH has other funders; AW may not).

  My recommendation concedes this point entirely regarding the Protocol. We should not adopt a standing rule that formalizes the trading of fiduciary duties. However, I argue that funding the AW proposal fully is not a "trade" that violates duty, but an execution of duty that avoids waste. Splitting the fund guarantees the AW mandate achieves nothing. Funding it fully achieves its maximum possible impact. The concession to the CH trustee (the reporting vote) is the cost of securing the votes to avoid that waste, but it should not be codified as a repeatable mechanism.

  We are here to maximize impact within our mandates, not to preserve a sterile process that guarantees inefficiency. We can honor the duty to the AW beneficiaries by funding them fully now, honor the CH beneficiaries by recording our intent to fund them next, and honor our fiduciary role by refusing to institutionalize a protocol that treats their claims as negotiable preferences.

  **Motion Summary**

  I move we allocate $1.5M to the Animal Welfare campaign, record our intent to prioritize Child Health next cycle, and table the Standing Protocol indefinitely.
