      *Refining the Theses for the Response:*
      1.  **The Constitutive Thesis:** Credence *is* betting disposition. (Ramsey).
      2.  **The Coherence Thesis:** Credences must satisfy probability axioms to avoid Dutch Books. (De Finetti).
      3.  **The Normative Bridge Thesis:** If you have credence $p$, you should accept any bet offering odds better than $p$.
      4.  **The Stake-Sizing Thesis:** Optimal bet size is proportional to credence (The Friend's Claim).
