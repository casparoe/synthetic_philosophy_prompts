  1. ALARA operates technically as constrained optimization where the dose limit sets the feasible set and the monetary exchange rate serves as a shadow price for risk reduction. The language of sufficiency is therefore rhetorical packaging rather than an accurate description of the marginal calculation performed.
  2. However, the underived drift in the monetary value suggests the optimization occurs within a satisficing framework regarding the fundamental commensurability of money and health. This implies the agency seeks a politically acceptable price rather than a theoretically correct utility metric.
  3. The absolute ban on carcinogenic additives represents a lexical priority rule that treats certain voluntary risks as categorically impermissible regardless of cost-benefit outcomes. This creates a defensible division of labor based on risk voluntariness rather than a logical contradiction within the legal order.
  4. Were the presupposed view replaced by genuine satisficing, decision records would document compliance with engineering best practices rather than marginal cost-averted calculations. Search would terminate at an administratively good enough standard without consulting a complete ordering over outcomes.
  5. Regulatory thresholds would shift from variable economic exchange rates to fixed technical standards based on industry capability rather than marginal social benefit. I would abandon this maximizing reading first if internal memos revealed that marginal costs were calculated only post-hoc to justify predetermined expenditure levels.
