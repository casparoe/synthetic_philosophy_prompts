      *Distinction:*
      Narrow lock-in is a coordination failure: agents prefer an alternative but face switching costs too high to bear individually. The map of options remains visible; the terrain is just swampy. Broad lock-in is ontological: the path taken erases the alternatives from the cognitive landscape. Agents do not merely fail to choose the road not taken; they cease to see it as a road. The test is simple: ask the agents to describe the alternative. If they can detail its benefits but cite cost or coordination as the barrier, it is narrow. If they struggle to articulate the alternative without resorting to the vocabulary of the current system, or dismiss it as nonsense, you are witnessing broad lock-in. One is a problem of movement; the other is a problem of sight.

      *Argument:*
      Narrow lock-in deserves exile from the concept of path dependence because it is merely equilibrium analysis in historical costume. It posits multiple stable states and asks why we occupy this one rather than that one. The answer is always friction: network effects, sunk costs, coordination hazards. This is ahistorical logic; it could occur in a vacuum at any time. It collapses into ordinary economics because the preferences are exogenous and fixed. The agents know what they want; they just cannot get there together. Calling this 'path dependence' adds nothing but a label to standard game theory.

      True path dependence requires that history alters the agent, not just the payoff matrix. Consider the technological dominance of the internal combustion engine. This is often cited as narrow lock-in due to fuel infrastructure. But the deeper lock-in is broad: city geometries were reshaped so fundamentally around the car that public transit ceased to be a viable conceptual competitor for planners. It was not merely expensive to switch; the very logic of urban flow was rewritten to make the car invisible as a choice and visible as nature.

      The institutional case is sharper. Take the modern research university. We often blame budget constraints for its rigidity. But the true lock-in is the departmental structure itself. We cannot imagine organising knowledge differently. A scholar cannot propose a project that does not fit a discipline because the language of evaluation disappears. The preference for disciplinary silos is not a cost; it is a cognitive boundary. The path taken has foreclosed the imagination of alternatives. Once we separate these, much confident assertion about lock-in dissolves. Claims that society is 'stuck' due to narrow lock-in are often untestable equilibrium stories. Only when the path shapes the mind do we have history rather than mechanics.

      *Objections:*
      First, critics will argue broad lock-in is unobservable. How can we prove an alternative is unimaginable rather than merely unpopular? If we cannot measure the counterfactual, is it science? This is strong, but it mistakes silence for evidence. When agents consistently fail to generate variants over long periods despite acute stress on the system, the null hypothesis shifts. We infer the foreclosure from the absence of variation, not its presence.

      Second, dismissing narrow lock-in ignores real suffering. If QWERTY costs billions in lost productivity, does it matter if it is 'true' path dependence? Pedantry should not aid inefficiency. However, the remedy differs. Narrow lock-in needs coordination mechanisms; broad lock-in requires cultural revolution. Conflating them leads to policy failures, such as subsidising switches that no one truly wants.

      Third, the boundary is porous. Narrow constraints harden into broad ones over time. Does the distinction hold? It holds heuristically. Even if narrow becomes broad, identifying the moment preferences calcify is the crucial historical work. Treating them as identical obscures the transition from friction to foreclosure.

      *Bottom Line:*
      We must stop calling every coordination failure a historical tragedy. True path dependence is not when we cannot leave the past, but when we cannot conceive of a future without it.
      Only when the path shapes the mind do we have history rather than mechanics.

