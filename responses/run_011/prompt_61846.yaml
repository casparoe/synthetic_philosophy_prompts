  **The distinction**
  Narrow lock-in is a coordination failure: agents prefer an alternative but face switching costs too high to bear individually. The map of options remains visible; the terrain is just swampy. Broad lock-in is ontological: the path taken erases the alternatives from the cognitive landscape. Agents do not merely fail to choose the road not taken; they cease to see it as a road. Test them: ask the agents to describe the alternative. If they detail its benefits but cite cost or coordination as the barrier, it is narrow. If they struggle to articulate it without resorting to the vocabulary of the current system, or dismiss it as nonsense, you are witnessing broad lock-in. One is a problem of movement; the other is a problem of sight. This separates mere friction from genuine historical constraint.

  **The argument**
  Narrow lock-in deserves exile from the concept of path dependence because it is merely equilibrium analysis in historical costume. It posits multiple stable states and asks why we occupy this one rather than that one. The answer is always friction: network effects, sunk costs, coordination hazards. This is ahistorical logic; it could occur in a vacuum at any time. It collapses into ordinary economics because the preferences are exogenous and fixed. The agents know what they want; they just cannot get there together. Calling this 'path dependence' adds nothing but a label to standard game theory. It suggests history matters, but only as an initial condition for a static optimisation problem. Consequently, much asserted lock-in becomes untestable; any persistence can be retrofitted as a coordination failure, rendering the theory unfalsifiable. If a practice survives, we claim switching costs were too high. This is circular. We are imputing preferences to dead men.

  True path dependence requires that history alters the agent, not just the payoff matrix. Consider the technological dominance of the internal combustion engine. This is often cited as narrow lock-in due to fuel infrastructure. But the deeper lock-in is broad: city geometries were reshaped so fundamentally around the car that public transit ceased to be a viable conceptual competitor for planners. It was not merely expensive to switch; the very logic of urban flow was rewritten to make the car invisible as a choice and visible as nature. The alternative was not costly; it was unintelligible. Suburbia is not a trap we cannot afford to leave; it is a place where leaving makes no sense. A benevolent planner could solve narrow lock-in with subsidies; they cannot solve broad lock-in without changing human cognition.

  The institutional case is sharper. Take the modern research university. We often blame budget constraints for its rigidity. But the true lock-in is the departmental structure itself. We cannot imagine organising knowledge differently. A scholar cannot propose a project that does not fit a discipline because the language of evaluation disappears. The preference for disciplinary silos is not a cost; it is a cognitive boundary. The path taken has foreclosed the imagination of alternatives. Once we separate these, much confident assertion about lock-in dissolves. Claims that society is 'stuck' due to narrow lock-in are often untestable equilibrium stories. Only when the path shapes the mind do we have history rather than mechanics. Without this distinction, we mistake inertia for destiny, and policy becomes an exercise in solving coordination problems that do not exist. We must recognise that some doors are not locked; they have been bricked over. The difference determines whether we need a key or a new map.

  **The three best objections**
  First, critics will argue broad lock-in is unobservable. How can we prove an alternative is unimaginable rather than merely unpopular? If we cannot measure the counterfactual, is it science? This is strong, but it mistakes silence for evidence. When agents consistently fail to generate variants over long periods despite acute stress on the system, the null hypothesis shifts. We infer the foreclosure from the absence of variation, not its presence. It is a negative capability, but a necessary one. To demand positive proof of a non-thought is to misunderstand the nature of cognitive boundaries.

  Second, dismissing narrow lock-in ignores real suffering. If QWERTY costs billions in lost productivity, does it matter if it is 'true' path dependence? Pedantry should not aid inefficiency. However, the remedy differs. Narrow lock-in needs coordination mechanisms; broad lock-in requires cultural revolution. Conflating them leads to policy failures, such as subsidising switches that no one truly wants. Treating a cognitive blind spot as a budget problem wastes resources. If the problem is imagination, money will not fix it. We must diagnose the ailment before prescribing the cure.

  Third, the boundary is porous. Narrow constraints harden into broad ones over time. Does the distinction hold? It holds heuristically. Even if narrow becomes broad, identifying the moment preferences calcify is the crucial historical work. Treating them as identical obscures the transition from friction to foreclosure. We must know whether we are pushing against a wall or a mirror. If we treat all lock-in as narrow, we assume agents are rational optimisers trapped by circumstance. If we treat it as broad, we admit they are historical creatures trapped by their own minds.

  **Bottom line**
  We must stop calling every coordination failure a historical tragedy. Most alleged lock-in is simply people doing what makes sense given the rules they know. True path dependence is not when we cannot leave the past, but when we cannot conceive of a future without it.
  Only when the path shapes the mind do we have history rather than mechanics.
