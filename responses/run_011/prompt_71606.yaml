answer: |-
  Here is the plan for the seventy-five minutes.

  ### 1. The Dependency Structure
  Your instinct is correct, but it needs sharpening. The session collapses if they treat validity as *efficacy* (did the change stick?) rather than *pedigree* (was the change authorised?).

  You need three bricks laid in this order before the paradox becomes visible:
  1.  **Power-conferring rules:** Establish that secondary rules aren't just instructions; they create capacities. (They should know this from the previous Hart session, but recap it in two minutes).
  2.  **Validity as Genealogy:** A rule is valid not because it is good or accepted, but because it was created by a higher rule. Draw a vertical chain on the whiteboard: By-law → Statute → Constitution → Rule of Recognition.
  3.  **The System Boundary:** Distinguish between a move *within* the game (legal change) and a change *of* the game (revolution).

  **The Critical Brick:** The paradox only exists if we insist the *new* Rule of Recognition must derive its validity from the *old* one. If validity comes solely from current acceptance (sociological fact), there is no paradox, only a shift in power. You must force them to choose: are we doing legal theory (pedigree) or political science (power)? If they slide into "well, if everyone agrees, it's valid," you have lost the puzzle. Stop them immediately and ask: "Valid according to *which* rule?"

  ### 2. The Running Example
  **Pick (b): Parliament entrenching a statute.**

  This must be the spine. The Hart/Wade debate is explicitly about Parliamentary sovereignty and the nature of the ultimate legal rule. Using a debating society reduces it to contract law (private obligations); using *Nomic* reduces it to constitutive rules of a game (where 'validity' is trivial). Only the State carries the requisite stakes for 'sovereignty'.

  **What it must have:**
  *   **Abstraction:** Do not use the actual UK Parliament. Use "State X" and "Statute A". This prevents the law students from diving into *Factortame*, *Jackson*, or the EU Withdrawal Act, which will eat forty minutes.
  *   **Specific Mechanism:** The statute says: "This Act may only be repealed if a referendum is held." Later, Parliament repeals it via a simple majority vote without a referendum.
  *   **The Judicial Dilemma:** The courts must decide whether to enforce the repeal.

  **What it must not have:**
  *   **Historical baggage:** No mention of Henry VIII, the 1911 Act, or Brexit.
  *   **Moral weight:** Do not make the statute about human rights. Keep it procedural. If it's about rights, natural law arguments will intrude.

  **How to use the others (2-minute contrasts):**
  *   **Use (c) *Nomic*:** Bring this in at the thirty-minute mark to illustrate the *logic* of self-reference. Tell the CS students: "In *Nomic*, Rule 1 says 'Rules can be changed by majority vote'. Rule 2 says 'Rule 1 cannot be changed'. Can Rule 1 be changed?" This isolates the logical loop without the political noise. It validates the CS perspective without letting it dominate the legal theory.
  *   **Use (a) Debating Society:** Use this as a negative example if someone argues "just vote again." Explain that a debating society is a private contract; members can unanimously agree to ignore their constitution because they are bound by consent, not sovereignty. The State binds non-consenters. That is why the paradox matters for law but not for clubs.

  ### 3. The Misconception Map
  Here is what will surface, where it will come from, and how to handle it.

  | Misconception | Source | When it surfaces | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"It's the Stone Paradox"** (Can God make a stone too heavy to lift?) | Philosophy students | Early (first 10 mins) | **Pre-empt.** State clearly: "This is not about logical impossibility or omnipotence. It is about normative pedigree. A lawyer doesn't ask if Parliament *can* do it physically, but if the Court *must* recognise it." |
  | **"Revolution solves it"** (The old system dies, a new one starts) | Law students (Realists) | Mid-session (when discussing validity) | **Allow, then Contain.** Let them say it. Then ask: "If it's a revolution, why do we call it an 'amendment'? If it's an amendment, where is the legal continuity?" This forces the Hart/Wade split. |
  | **"Circular Validity"** (The old rule authorised the new one, so it's fine) | Mixed | Core discussion | **Dismantle.** This is the core error. If the old rule authorised the new one, the old rule must still be in force. But the new rule repeals the old one. They cannot both be the ultimate source simultaneously. |
  | **"It's just a Compiler Update"** (Code rewrites code successfully) | CS students | When *Nomic* is mentioned | **Welcome the analogy, Block the conclusion.** Say: "In code, syntax determines execution. In law, pedigree determines validity. A program can rewrite its source code and run. A legal system that rewrites its Rule of Recognition faces a *normative* gap, not a syntax error." |
  | **"Natural Law escapes this"** (Immoral rules aren't law) | Philosophy/Law mix | Late session | **Block.** Declare off-limits. We are doing positivism. Even if the amendment is evil, is it *valid*? Keep the focus on source, not merit. |

  **Specific Note on the CS Students:**
  One of them will almost certainly suggest modelling the legal system as a recursive function. Welcome this on the whiteboard (draw the function calling itself), but use it to highlight the difference. In programming, the 'meta-rule' is external (the hardware/OS). In law, there is no external OS. The legal system is the hardware. That is the puzzle.

  ### 4. The Closing Question
  Do not ask "What do you think?" Ask a question that forces a choice between Hart and Wade.

  **"When the Court enforces the new amending rule, is it applying the old law or breaking it?"**

  *   If they say **applying the old law**: They are arguing for self-embracing sovereignty (Hart). The old law permitted its own destruction.
  *   If they say **breaking it**: They are arguing for continuing sovereignty (Wade). The old law is immutable, so the change is a revolutionary fact, not a legal act.
  *   If they say **"It doesn't matter, the Court decides"**: They have slipped into Realism and missed the normative puzzle.

  This discriminates between those who see the legal continuity problem and those who see only political power.

  ### 5. Off-Limits List
  Declare these out of bounds in the first five minutes to prevent scope creep.

  1.  **Kelsen and the Grundnorm:** It invites metaphysical regress arguments you cannot resolve in an hour. Stick to Hart's social rule theory.
  2.  **Specific Case Law:** No *Jackson*, no *HS2*, no *Factortame*. These are examples, not arguments. They distract with factual nuance.
  3.  **Infinite Regress:** If someone asks "What validates the Rule of Recognition?", answer "Acceptance by officials" and stop. Do not chase the turtle down.
  4.  **Moral Legitimacy:** Whether the entrenchment is *good* or *democratic* is irrelevant to whether it is *valid*.
  5.  **Detailed *Nomic* Rules:** Do not explain the game mechanics beyond the self-amendment clause. It is an illustration, not the subject.

  **Timing Check:**
  *   0–10 mins: Bricks 1–3 (Validity as pedigree).
  *   10–40 mins: The Parliament Example (The core puzzle).
  *   40–55 mins: Hart vs. Wade (Continuing vs. Self-embracing).
  *   55–65 mins: *Nomic* & CS analogy (Logical structure).
  *   65–70 mins: Misconception sweep.
  *   70–75 mins: Closing Question.

  Stick to the whiteboard. Draw the chain of validity. When the paradox hits, draw a break in the chain. That visual will hold them better than any amount of talking.
