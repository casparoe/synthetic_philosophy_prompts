answer: |-
  There is no canonical, single-word term in the philosophy of science literature that captures this specific tripartite dialectical pattern. While the components are individually recognized (equivocation, special pleading, circularity), their systematic combination in the function debate is typically described descriptively (e.g., "having it both ways," "shifting the goalposts") rather than by a technical label.

  The closest established concept is **Equivocation**, specifically the sophistical variety where ambiguity is exploited rather than stumbled into. However, standard equivocation does not capture the *systematic* nature of the switching (Component 1), the *suppression* of conflict (Component 2), or the *circular justification* for the switch (Component 3).

  Since no existing term suffices, I propose the coinage **Strategic Criterion Switching (SCS)**.

  Below is the carving of the phenomenon, its relation to your rejected candidates, and the answers to your boundary questions.

  ### 1. Real Definition of Strategic Criterion Switching

  **Genus:** An argumentative strategy employed in theoretical debates where multiple competing accounts of a concept are available.

  **Differentia (Necessary and Sufficient Conditions):**
  An exchange exhibits Strategic Criterion Switching if and only if:
  1.  **Availability:** There exist at least two distinct criteria (Account A and Account B) for applying a concept *C* (e.g., "function").
  2.  **Outcome-Dependent Selection:** The proponent selects which criterion to apply to a specific case based *solely* on which criterion yields a pre-determined intuitive verdict for that case, rather than on independent theoretical grounds.
  3.  **Conflict Suppression:** When the two criteria yield divergent verdicts for the same case, the proponent dissolves the conflict by labeling the concept ambiguous, then selects the sense that matches the pre-determined verdict without providing an independent rule for the disambiguation.
  4.  **Circular Immunization:** Any rule proposed to justify the selection of one criterion over the other presupposes the very classification (e.g., "adaptation" vs. "byproduct") that the criteria were intended to establish.

  ### 2. Relation to Rejected Candidates

  You correctly ruled out the four candidates, but locating *why* they fail helps mark the edges of SCS.

  *   **Merely Verbal Dispute:** SCS is not merely verbal because the switching has substantive consequences for trait individuation and explanation. A verbal dispute implies the parties agree on the facts but disagree on words. In SCS, the proponent changes the *truth conditions* of the claim mid-argument to secure a factual conclusion about the trait.
  *   **Pluralism about Function:** Pluralism is an ontological or semantic thesis (there *are* two functions). SCS is a methodological pathology. A pluralist consistently applies both accounts to a trait and accepts the resulting complexity. An SCS practitioner claims univocity when pressed but acts like a pluralist when convenient. SCS is *pseudo-pluralism*.
  *   **Motivated Reasoning:** This is the psychological *cause* of SCS, not the dialectical *structure*. Motivated reasoning explains *why* the philosopher wants the result; SCS describes *how* the argument is constructed to get it. One can engage in motivated reasoning without SCS (e.g., by ignoring evidence), and one can theoretically commit SCS without strong motivation (e.g., through sloppy habit), though they usually co-occur.
  *   **Ad Hoc Rescue:** An ad hoc rescue modifies a *single* theory to save it from falsification. SCS does not save a theory; it saves a *conclusion* by swapping theories. In SCS, neither Account A nor Account B is treated as the primary theory being defended; both are treated as tools to defend the classification.

  ### 3. Edges and Boundaries

  **Where SCS Stops:**
  *   **Independent Selection Rules:** If a philosopher proposes a rule for choosing between accounts that does *not* presuppose the verdict, it is not SCS. For example: "Use the Historical account for traits inherited via replication, and the Systems account for traits acquired via development." If "replication" and "development" can be identified without first knowing the function, this is a legitimate **Methodological Pluralism**, not SCS.
  *   **Explicit Theory Change:** If a philosopher says, "Account A fails here, so I am adopting Account B," and accepts the costs of that abandonment, this is **Theory Revision**, not SCS. SCS requires the proponent to act as though both accounts remain valid while using them selectively.
  *   **Unintentional Inconsistency:** If the switching is unintentional and the proponent corrects it when pointed out, it is simple **Inconsistency**. SCS requires the *immunization* (Component 3) that prevents correction.

  ### 4. Answers to Your Specific Questions

  **Q1: Must the two accounts actually deliver conflicting verdicts in the case at hand for the pattern to arise, or does it occur just as readily where they agree and nobody checks?**

  **Answer:** The *potential* for conflict is essential, but the *actualization* of conflict is typically suppressed.
  SCS is driven by the divergence of verdicts. If the accounts agreed on every case, there would be no need to switch criteria to secure a specific intuition. However, per Component 2 of your description, the pattern relies on *avoiding* the explicit statement of conflict.
  Therefore: The accounts must be *capable* of conflicting (and the proponent must be aware of this), and the proponent must be leveraging that divergence to select the criterion. But the pattern is most insidious precisely when the conflict is *not* stated. If the conflict is stated and adjudicated, it becomes a standard theoretical debate. SCS thrives in the space where the divergence is felt (driving the intuition) but not spoken (avoiding the adjudication).

  **Q2: Is the third component, the question-begging selection rule, essential to the phenomenon, or a frequent companion that could be stripped away without changing what the thing is?**

  **Answer:** It is **essential**.
  Without Component 3, the phenomenon collapses into simple **Inconsistency** or **Special Pleading**.
  *   If a philosopher switches criteria based on intuition but offers *no* justification, they are guilty of inconsistency.
  *   If they offer a justification that is *independent* (e.g., "I use Historical here because we have phylogenetic data"), they are practicing Methodological Pluralism.
  Component 3 is what transforms the move from a mistake into a *system*. The circular rule ("Use Historical for adaptations") creates a closed loop where the criterion validates the classification, and the classification validates the criterion. This immunizes the argument from criticism. Without this circularity, the switching is vulnerable to the challenge: "Why did you switch accounts?" With the circularity, the answer is: "Because this is the kind of trait that requires this account," which begs the question but stops the dialectic.

  ### Summary for Your Paper

  You can introduce the term as follows:

  > "I term this dialectical pattern **Strategic Criterion Switching (SCS)**. Unlike genuine pluralism, which accepts multiple functional senses simultaneously, SCS involves the selective invocation of competing accounts to secure specific intuitive verdicts while suppressing the resulting theoretical conflicts. It is distinguished from simple equivocation by its systematic nature and from ad hoc rescue by its reliance on circular selection rules that presuppose the very classifications the accounts are meant to determine."

  This carving should allow you to diagnose the literature without getting bogged down in the function debate itself, keeping the focus on the individuation methodology as intended.
