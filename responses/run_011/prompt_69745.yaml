      *   *Claim:* Heritability says nothing about differences between groups (Lewontin's fallacy). Public debate uses it to suggest otherwise. Therefore, it's a rhetorical device, not scientific.
      *   *Scientific Consensus:* First half is absolutely correct (within-group $h^2$ does not explain between-group differences). Second half (therefore it's rhetorical/not scientific) is a non-sequitur. A concept can be scientifically valid within its scope but misused rhetorically.
