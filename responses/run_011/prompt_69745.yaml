answer: |-
  Here is an audit of the four claims from the perspective of a working behavioral geneticist, followed by answers to your specific questions.

  ### Audit of the Four Claims

  **Claim 1: The Individual Decomposition**
  *   **Verdict:** **Reject Outright.**
  *   **Analysis:** This is the most common misconception about heritability. Heritability ($h^2$) is a population statistic describing the proportion of *variance* in a trait attributable to genetic *variance*. It does not partition the causes of an individual's trait value. You cannot say 80% of *your* height is genetic, because your height is the product of the inseparable interaction of your specific genes and your specific environment.
  *   **Corrected Version:** "A heritability estimate is the proportion of **phenotypic variance in a specific population** attributable to genetic variation **within that population**."

  **Claim 2: The Limit on Intervention**
  *   **Verdict:** **Reject Outright.**
  *   **Analysis:** This is the "heritability implies immutability" fallacy. High heritability within a population does not constrain how much the population *mean* can shift if the environment changes. Heritability describes the *current* sources of variation, not the potential response to a *new* environmental condition.
  *   **Corrected Version:** "Heritability estimates describe current sources of variance; they **do not predict the magnitude of mean shifts** possible under novel environmental interventions."

  **Claim 3: The Twin Study Assumption**
  *   **Verdict:** **Correct (with significant qualification).**
  *   **Analysis:** Your friend is technically correct that the Equal Environments Assumption (EEA) is critical and that violations (e.g., identical twins treated more similarly) can inflate heritability estimates. The point about "genetic nurture" (parents' genes shaping the home) is also a valid, modern criticism: standard twin models often confound direct genetic effects with indirect environmental effects mediated by parental genes. However, concluding that estimates are inflated by an "unknown amount" is too pessimistic. Researchers use sensitivity analyses, measured environment controls, and alternative designs to bound this bias. It is a known limitation, not a fatal flaw.
  *   **Corrected Version:** "Twin studies depend on the Equal Environments Assumption. Violations, **particularly via passive gene-environment correlation**, can inflate estimates, **though multi-method approaches help quantify and bound this bias**."

  **Claim 4: Between-Group Differences and Rhetoric**
  *   **Verdict:** **Accept First Half / Reject Second Half.**
  *   **Analysis:** The first half is a fundamental theorem of quantitative genetics (Lewontin's Fallacy): high within-group heritability does not explain between-group mean differences. However, the conclusion that this makes heritability "rhetorical rather than scientific" is a non-sequitur. A scientific concept can be valid within its defined scope even if politicians misuse it outside that scope. (e.g., "Force = Mass $\times$ Acceleration" is scientific, even if a politician misuses "force" to justify war).
  *   **Corrected Version:** "Heritability describes variance within a specific population and environment; it cannot explain mean differences between populations. **Misuse in public debate does not negate its scientific utility within proper bounds.**"

  ***

  ### Answers to Your Specific Questions

  **1. Does any reformulation of Claim 1 survive? Why doesn't individual risk logic apply here?**
  No reformulation of Claim 1 survives at the individual level. It is a category error.
  *   **The Logic:** Population statistics (variance) do not map onto individual scores (means). Consider a rectangle's area. The variance in area across a set of rectangles might be 80% due to variance in length and 20% due to variance in width. However, for *any single rectangle*, you cannot say "80% of this area is length." The area is 100% the product of both length and width interacting.
  *   **Why Risk Prediction is Different:** You mentioned patient risk. In medicine, we use Polygenic Scores (PGS) to predict individual *probability* of a disease. This is not decomposing the *cause* of the disease in that patient (Claim 1); it is using genetic markers to estimate a *likelihood* based on population data. We can predict an individual's risk without claiming that 80% of their specific illness was "caused" by genes. Prediction is not causal decomposition.

  **2. Does Claim 2 follow from anything true, and what is the cleanest counterexample?**
  Claim 2 does not follow from any true premise. It confuses *variance* with *means*.
  *   **The Counterexample:** **Human Height.** In developed nations, the heritability of height is very high (~0.80). According to your friend's Claim 2, environmental improvements (nutrition, healthcare) should have very little "headroom" to increase average height.
  *   **The Reality:** Over the 20th century, the average height of populations (e.g., in Japan or the Netherlands) increased by several inches solely due to environmental improvements (nutrition, disease reduction), despite heritability remaining high throughout the process. The *variance* remained largely genetic (tall parents still had tall children relative to peers), but the *mean* shifted environmentally.
  *   **Another Example:** **Phenylketonuria (PKU).** This is a genetic disorder causing intellectual disability with heritability near 1.0 (in a standard environment). However, an environmental intervention (a diet low in phenylalanine) completely prevents the disability. High heritability did not prevent environmental remediation.

  **3. In Claim 3, what exactly would have to be shown for the objection to bite? Do other study designs stand or fall with it?**
  *   **The Condition:** It is not enough to show that the assumption is false (MZ twins *are* treated more similarly). For the objection to invalidate the heritability estimate, you must show that the environmental similarity is **causally relevant to the trait**. If identical twins are dressed alike more often than fraternal twins, that violates the EEA. But unless "being dressed alike" causes "higher IQ," it does not inflate the heritability estimate for IQ. The bias only exists if the extra environmental similarity MZ twins experience correlates with the trait being measured.
  *   **Other Designs:** Twin studies do not stand alone. **Adoption studies**, **Sibling comparison designs**, and **GWAS (Genome-Wide Association Studies)** do not rely on the EEA in the same way. For example, SNP-heritability (derived from DNA data of unrelated individuals) bypasses twin assumptions entirely. If twin studies were completely invalidated, the field would lose a tool, but the consensus would stand or fall on the convergence of these other methods (which generally converge with twin estimates).

  **4. If Claim 4's first half is right, does the "rhetorical" conclusion follow? And is the friend correct about $h^2 = 1.0$?**
  *   **Rhetorical vs. Scientific:** The conclusion does not follow. That a quantity is frequently misused in policy debates does not strip it of scientific validity. Heritability is crucial for breeding (agriculture), evolutionary biology, and understanding the architecture of disease. Its misuse regarding race or inequality is a sociological problem, not a mathematical one.
  *   **The $h^2 = 1.0$ Claim:** Your friend is **technically correct but scientifically misleading**.
      *   **Technically:** If heritability is truly 1.0 in a population, it means 100% of the *variance* is genetic ($V_E = 0$). In that specific context, equalizing the environment (making $V_E$ zero) would indeed not reduce inequality (variance), because the environment isn't causing any variance to begin with.
      *   **Misleading:** Heritability is not a fixed constant of nature; it is specific to the *current range of environments*. If you introduce a *new* environment (e.g., providing glasses for myopia, which has high heritability), you change the reaction norm. You can reduce inequality not by "equalizing" the old environment, but by shifting to a new one where the genetic variance is expressed differently.
      *   **Summary:** If $h^2=1$, environmental *equalization* won't help. But environmental *innovation* might. Your friend's phrasing suggests intervention is hopeless, which is false.

  ### Summary for Your Peace of Mind
  You were right to feel uneasy about Claims 1 and 2; they are foundational errors in the field. You were also right to be skeptical of Claim 3's conclusion; while the premise is valid, the leap to "unknown inflation" is debated. You were correct to accept the first half of Claim 4 but reject the dismissal of the science. Your friend knows the literature but has adopted a skeptical stance that conflates "limitations of the metric" with "invalidity of the metric."
