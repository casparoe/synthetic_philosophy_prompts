          *   The trick is that labour-power creates more value than it costs to reproduce.
          *   Appropriation happens in *production*, not exchange. The capitalist owns the means of production, so they own the output.
      *   *Point 2: Normative Characterisation (Justice/Rights).*
          *   This is the "Wood vs. Husami" debate (roughly).
