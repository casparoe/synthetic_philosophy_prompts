          *   *Assessment:* Generally accurate as a summary of the *mechanism* of surplus value.
          *   *Nuance:* "Value of the wage" is slightly imprecise (it's the value of labour-power, not labour). But acceptable as a simplification.
          *   *Verdict:* Defensible popular simplification.

      *   *Sentence 2:* "The wage contract is therefore a swindle: the worker is paid nothing for the extra hours, which is why Marx treats profit as unpaid labour, and why the whole critique is a moral one — capitalism is unjust because it denies workers their right to the full product of what they make, a principle Marx himself endorses."
          *   *Assessment:* This is the most problematic sentence.
          *   *Issue 1 (Swindle/Exchange):* Marx explicitly argues the wage contract *is* an exchange of equivalents in the sphere of circulation. It's not a fraud. The "swindle" happens in production, not exchange.
          *   *Issue 2 (Moral/Justice):* Marx is notoriously ambivalent or hostile to appeals to "justice" or "rights." He often mocks the idea of "fair distribution." The "right to the full product of labour" is associated with Lassalle, whom Marx critiqued (Gotha Critique).
          *   *Verdict:* Outright misrepresentation regarding the contract and the moral/justice framework.

      *   *Sentence 3:* "Alienation is the softer, more philosophical face of the same complaint, chiefly a theme of the early writings, which the economist of *Capital* largely abandoned once he had a scientific account of exploitation to offer."
          *   *Assessment:* This is the "Young Marx vs. Mature Marx" debate (Althusserian epistemological break).
          *   *Nuance:* While the *term* "alienation" appears less frequently in *Capital*, the *concept* (commodity fetishism, reification, loss of control) remains central. It wasn't "abandoned," but sublimated into structural analysis.
          *   *Verdict:* Defensible simplification but leans towards misrepresentation regarding the continuity of the concept.

      *   *Sentence 4:* "And once marginalism displaced the labour theory of value in the 1870s, the derivation of surplus value lost its foundation, leaving only the moral complaint standing."
          *   *Assessment:* This assumes the LTV is the *only* foundation for the critique of exploitation. It also assumes the "moral complaint" was the only thing left (which we've already challenged).
          *   *Nuance:* Many modern Marxists (e.g., Analytical Marxists) have tried to reconstruct exploitation without the LTV. Also, the "displacement" is a neoclassical narrative, not necessarily a refutation of Marx's specific sociological point.
          *   *Verdict:* Contested/Outright misrepresentation depending on one's view of LTV's necessity.

