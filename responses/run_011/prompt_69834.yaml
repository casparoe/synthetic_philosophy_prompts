answer: |-
  This is a high-stakes prep for a reading group, and your friend's instincts are sharp. The summary you've been given is a "greatest hits" compilation of Augustinian scholarship that smooths over the jagged edges where Augustine actually struggles. It gets the broad strokes right but fumbles the specific textual mechanics, particularly on the midwives and the "misleading truth" loophole.

  Here is a claim-by-claim audit, sorted by what a scholar would accept, what is a simplification, and what is likely wrong or anachronistic.

  ### 1. The Claim-by-Claim Audit

  **Claim: "Augustine wrote two treatises on lying, one early and one near the end of his life."**
  *   **Verdict:** **Accurate.**
  *   **Detail:** *De Mendacio* (On Lying) is from roughly 395 AD (early priesthood/episcopacy). *Contra Mendacium* (Against Lying) is from 420 AD (late life, written against the Priscillianists). Scholars generally agree the later work is more rigorous and less speculative than the earlier one.

  **Claim: "He stakes out the most extreme position in the history of ethics — no lie is ever permitted."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Detail:** "Most extreme in history" is hyperbolic (some sects were stricter), but within the mainstream Western canon, he is the gold standard for absolutism. However, note that he defines "lie" very specifically (see below), which creates the loopholes your friend is asking about.

  **Claim: "He grades lies by seriousness... at the very bottom... is the joke... which he considers harmless enough that it isn't really a sin at all."**
  *   **Verdict:** **Likely Wrong / Over-simplified.**
  *   **Detail:** In *De Mendacio* (Chapter 7 & 10), Augustine creates an eight-fold hierarchy. The "jocose lie" (lie in jest) is indeed at the bottom (8th grade). However, he does **not** explicitly exonerate it as "no sin at all." He calls it the *least* pernicious, often venial rather than mortal, but he still categorizes it as a *mendacium* (lie). To say it "isn't really a sin" risks contradicting his core definition that any utterance with the intent to deceive is a disorder of the soul.
  *   **Check:** Look at *De Mendacio* 10.24. He asks if a jocose lie is a sin. He leans toward "yes, but forgivable," not "no."

  **Claim: "His reason for banning lying... is that speech was given to us in order to make known what's in our minds... corrodes the liar's soul."**
  *   **Verdict:** **Accurate.**
  *   **Detail:** This is the strongest part of the summary. Augustine's argument is ontological, not consequentialist. Language is a natural sign of thought; to use it against thought is a sin against the natural order (and thus God). This is why "harmless" lies are still sinful.

  **Claim: "He deals with the Hebrew midwives who lied to Pharaoh by pointing out that God rewarded them, which shows he knows how to bend when life is at stake."**
  *   **Verdict:** **Wrong. (Your friend is right here.)**
  *   **Detail:** This is a common misreading. In *De Mendacio* (15.26), Augustine explicitly argues that God rewarded the midwives for their **benevolence/mercy**, *not* for their lie. He separates the sin (the lie) from the merit (the protection of life). He uses this case to prove that God *does not* bend on the lie; He rewards the good intention despite the sinful method.
  *   **Textual Move:** If you want to flip this verdict, you would need to find a passage where Augustine says the lie *itself* was meritorious. He doesn't. He says, "The lie is not approved, but the benevolence is rewarded."

  **Claim: "Silence, refusing to answer, and technically-true-but-misleading speech are all available to you."**
  *   **Verdict:** **Contested / Likely Wrong on the last point.**
  *   **Detail:** Augustine definitely allows silence (*taciturnitas*) and hiding (*dissimulatio*). The "technically-true-but-misleading" claim is the flashpoint. Augustine defines a lie not just by the falsity of the statement, but by the **intent to deceive** (*voluntas fallendi*).
  *   **The "Double Heart" Issue:** Your friend is citing a real Augustinian concept. If you speak a literal truth *with the intention* that the listener believes a falsehood, Augustine often classifies this as a lie of the heart (*cor duplex*), even if the tongue is technically true.
  *   **Nuance:** In *Contra Mendacium*, dealing with heretics, he discusses whether one can hide the truth. He allows *suppressio veri* (suppressing truth) but generally condemns *suggestio falsi* (suggesting falsehood). However, if a true statement is used *to suggest* a falsehood, he tends to condemn it.
  *   **Check:** See *Contra Mendacium* 10.24. He discusses whether it is permissible to speak ambiguously to protect the faithful. He is very wary here.

  **Claim: "That last permission makes Augustine the grandfather of the mental-reservation loophole."**
  *   **Verdict:** **Anachronistic.**
  *   **Detail:** The Jesuit casuists (16th/17th century) developed "mental reservation." They *cited* Augustine, but projecting the fully formed loophole back onto him is historical revisionism. Augustine is usually the *brake* on casuistry, not the engine. If anything, the casuists tried to stretch Augustine's allowances for silence into allowances for equivocation, which Augustine himself often resisted.

  **Claim: "He ends up in the same place as Kant on the murderer at the door... and for the same reason."**
  *   **Verdict:** **Same Place (Yes), Same Reason (No).**
  *   **Detail:** They reach the same verdict (do not lie to the murderer), but the reasoning is distinct.
      *   **Kant:** Deontological/Contractual. Lying undermines the condition of all rights and makes you legally responsible for the consequences.
      *   **Augustine:** Theological/Ontological. Lying is a sin against God and damages the *imago Dei* in the liar. Augustine worries about the liar's salvation; Kant worries about the liar's rational autonomy and legal liability.
  *   **Internal Contradiction in the Book:** The summary claims Augustine allows "technically-true-but-misleading speech" *and* that he ends up in the same place as Kant. But Kant famously rejects misleading the murderer (in *On a Supposed Right to Lie*). If Augustine allows misleading speech at the door, he is *not* in the same place as Kant. The summary is logically incoherent here.

  ---

  ### 2. The "Double Heart" & Misleading Speech (The Core Dispute)

  This is the specific consideration that would flip the verdict on whether Augustine offers an "escape hatch."

  **The Standard Reading:** Augustine forbids any utterance where the speaker's mind does not align with the sign, *if the intent is to deceive*. Therefore, a "technically true" statement intended to mislead is a lie.
  **The Counter-Reading:** Some scholars argue Augustine permits **equivocation** (ambiguous speech) where the speaker intends the listener to find the truth *if they look for it*, even if the speaker expects them to misunderstand.

  **What would flip my verdict?**
  I would need to check *Contra Mendacium* 10.24–25 closely. Here, Augustine discusses whether a bishop can hide a fugitive in his church and deny knowledge of him.
  *   **If** Augustine says: "You may say 'He is not here' meaning 'He is not here *for you to take*'" -> Then the book is right, and your friend is wrong. (This is the Mental Reservation argument).
  *   **If** Augustine says: "You must say nothing, or say 'I know where he is but will not tell,'" -> Then your friend is right, and the book is wrong about the loophole.
  *   **Current Scholarly Consensus:** The weight of evidence suggests Augustine prefers silence. He allows hiding the truth, but he is deeply suspicious of using truth to create a false impression. He calls this having a "double heart."

  **Uncertainty Flag:** There is genuine disagreement among patristics scholars on whether Augustine's later work (*Contra Mendacium*) softens his earlier strictness to allow for "pious equivocation" in cases of persecution. Some say he hardens; some say he finds a pragmatic middle ground. I would not bet money on the "technically-true-but-misleading" claim without reading *Contra Mendacium* Chapter 10 directly.

  ---

  ### 3. Is Augustine "Useless" for Hard Cases?

  The book concludes: *"Neither is any use for thinking about lying to protect people."*

  **Does this conclusion survive the corrections?**
  **Yes, but with a major caveat.**

  If you correct the summary (remove the "midwives bend" error, remove the "jocose lie is no sin" error, and tighten the "misleading speech" loophole), Augustine becomes *stricter*, not more permissive. This reinforces the book's conclusion that he is not useful if you are looking for a justification to lie.

  **However,** the book's claim that he is "no use" is too dismissive if you correct the "silence" point.
  *   **Why he IS useful:** Augustine provides a robust ethics of **silence and hiding**. In a modern context (e.g., hiding undocumented immigrants, protecting victims of abuse), Augustine gives you a framework to refuse cooperation without lying. He validates the right to privacy and the duty to protect the vulnerable, provided you do not corrupt your own soul with falsehood.
  *   **Why he ISN'T useful:** If the situation demands a positive assertion (e.g., filling out a form, answering a direct question where silence is interpreted as guilt), Augustine offers no help. He forces a martyrdom choice: lie and sin, or tell the truth and accept the consequence.

  **Corrected Verdict:** Augustine is not useful for *licensing deception* to protect people. He is highly useful for *licensing non-cooperation* to protect people. The book misses this distinction by focusing so much on the "lie" that it undervalues the "silence."

  ---

  ### 4. Where to Check Before Thursday (The "Don't Smooth Over" List)

  If you want to walk into that meeting confident, here are the specific textual moves you need to verify. Do not rely on the book's summary for these:

  1.  **The Midwives (Exodus 1):**
      *   **Check:** *De Mendacio*, Book 1, Chapter 15, Section 26.
      *   **Look for:** The phrase *"non est approbata mendacitas, sed remunerata est benignitas"* (the lie was not approved, but the kindness was rewarded). If this is there, your friend wins that point decisively.

  2.  **The Definition of a Lie (Intent vs. Truth):**
      *   **Check:** *De Mendacio*, Book 3, Section 4 & Book 12, Section 27.
      *   **Look for:** His definition: *"Mendacium est enuntiatio cum voluntate falsum enuntiandi"* (A lie is an utterance with the will to utter a falsehood).
      *   **Crucial Question:** Does "falsehood" mean *objectively false* or *subjectively believed to be false*? Augustine argues that if you say something true that you *believe* is false, it is a lie. Conversely, if you say something false that you *believe* is true, it is an error, not a lie.
      *   **Implication:** This supports your friend. If you say something true *believing* it will be taken falsely (intent to deceive), Augustine often treats this as a lie of the will.

  3.  **The "Murderer at the Door" Equivalent:**
      *   **Check:** *Contra Mendacium*, Book 10, Section 24.
      *   **Look for:** How he advises handling inquiries about fugitives. Does he suggest ambiguous phrasing ("He is not here" meaning "not here for you") or strict silence ("I will not say")?
      *   **Why it matters:** If he suggests ambiguous phrasing, the book's "mental reservation" claim has legs. If he suggests silence, the book is projecting later Jesuit ideas onto him.

  ### Summary for Your Group

  *   **Trust your friend on the Midwives:** The book is wrong; Augustine says God rewarded their mercy, not their lie.
  *   **Trust your friend on the "Double Heart":** Augustine is generally stricter on "misleading truth" than the book admits. Intent matters more than literal syntax.
  *   **Be skeptical of the Kant Comparison:** They agree on the *verdict* (don't lie), but for totally different reasons (Sin vs. Duty).
  *   **On "Usefulness":** Augustine isn't useless, but his utility is in **silence**, not deception. If the group wants to discuss how to lie safely, Augustine shuts that down. If they want to discuss how to resist interrogation without sinning, Augustine is a goldmine.

  If the book treats Augustine as a "Kantian who allows mental reservation," it has created a contradiction. You can point out that if Augustine allows mental reservation, he *isn't* Kantian. If he is Kantian, he *doesn't* allow mental reservation. The summary tries to have it both ways.
