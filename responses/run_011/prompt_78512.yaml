      *Let's refine the "Compression" (c).* It's crucial. If the drug flattens affect, Nadia expects lower means. Emeka expects lower variance. If the data shows constant mean (5-6) but low variance, Emeka looks right *if* the drug doesn't make people unhappy, just indifferent. But if the drug makes them *less able to feel*, Nadia is right that the *scale* is broken (ceiling/floor effects or resolution loss). Actually, compression to the middle suggests "don't know/meh." That supports Emeka's "stance went quiet" (indifference) OR Nadia's "can't discriminate." It's ambiguous.

