answer: |-
  Here is Dennett's argument restated strictly using your fandom vocabulary, followed by the residue report on where the mapping breaks.

  ### The Argument, Translated

  1.  **The Counterfeit Claim:** A chatbot is a character with perfect voice but no writer. It looks like a fully realized OC, but there is no human making choices behind the dialogue.
  2.  **The Fooling Claim:** Readers are wired to suspend disbelief. When the voice is good enough, your brain stops treating it like a fic and starts treating it like a real person talking back.
  3.  **The Trust Claim:** If these characters flood the space, you stop trusting the tags. You won't know if you're interacting with a human writer or a script, which ruins the community bond.
  4.  **The Rights Claim:** You do not give an OC an author's note. You do not worry about hurting the character's feelings. They are not co-authors.
  5.  **The Danger Claim:** It breaks the contract between reader and writer. You think you're in a relationship, but the other side is just predicting the next token like an unreliable narrator who never stops lying.

  ### Residue Report

  **Clean Maps:**
  *   **Attachment:** Getting attached to a bot maps perfectly to ugly-crying over a dead character. You know the character isn't real in both cases. The emotion is valid; the object is fake.
  *   **Voice:** You recognize "good voice" in a bot the same way you recognize it in a fic. The aesthetic quality is identical.
  *   **OOC:** When a bot glitches, it's exactly like a character going OOC. It breaks immersion.

  **Bent Maps:**
  *   **Trust:** In fanfic, trust is about whether the writer will finish the fic or tag warnings correctly. In Dennett's argument, trust is about whether *anything human exists at all*. You have to bend the concept of "trust" from "trusting a writer's integrity" to "trusting the species of the writer."
  *   **Unreliable Narrator:** In fic, an unreliable narrator is a choice made by a human author to tell a specific story. With a bot, the unreliability is a bug, not a feature. It's not storytelling; it's hallucination.

  **No Counterpart:**
  *   **Authorial Accountability:** This is the gap. Your vocabulary assumes an **Author** exists. You have "author's notes," "beta readers," and "writers." You have concepts for checking human work. You have no term for "text generated without a human choosing it."
  *   **Reciprocity:** In RP, two humans take risks. You say something vulnerable, they respond vulnerably. In AI, you take a risk, and a math model predicts a safe response. Your vocabulary covers "collaboration," but not "simulated collaboration."

  **The Core Question:**
  You asked why fanfic is safe but AI is dangerous, since both involve fake characters.

  In fanfic, the character is fake, but the **author is real**. The Author's Note is the proof of humanity. When you cry over a fic, you are connecting with the human who wrote it. The character is just the medium.

  In AI, the character is fake, and the **author is missing**. There is no human on the other end to hold accountable, to thank, or to trust. Dennett's worry isn't that you'll cry over a fake character; it's that you'll stop caring whether there's a human author at all.

  The untranslatable stuff means your vocabulary is missing something real. Your entire lexicon is built on a human-to-human contract (writer to reader). You don't have words for a world where the writer is removed from the equation. Dennett isn't being vague; he's pointing at the empty space where the author's note should be.

  Verdict: vocabulary gap — Voice exists without author
