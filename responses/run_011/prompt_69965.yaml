answer: |-
  - **Bottom line**
  Yes, run this screen. It is not about historical accuracy; it is about preventing structural suicide. Most design failures come from ignoring how groups behave under pressure, not from bad facilitation techniques. The three checks that carry the most weight are Reversibility, Information Safety, and Political Cover. If you ignore these, you are not running deliberation; you are running legitimation for a predetermined outcome. This screen will not save you from a bad council, but it will stop you from building the trap they want to spring. It forces you to ask whether the process can survive contact with reality. Without it, you are betting your reputation on hope.

  - **Three mechanisms**
  **Mytilene: The Velocity of Regret.** A group makes a high-stakes decision faster than they can process the consequences, then finds reversal logistically or politically impossible once new information arrives. The harm isn't the initial error; it is the inability to stop the error once recognized because the machinery of implementation has already started. This is not about mercy; it is about the lag between decision and reality.

  **Sicily: The Feedback Collapse.** Participants or leaders hide negative information because the system punishes messengers, leading to escalated commitment based on fiction rather than fact. The harm isn't ignorance; it is the systemic suppression of correction because admitting failure is too costly for the individuals involved. This is not about incompetence; it is about incentive structures that reward lying.

  **Socrates: The Legitimacy Trap.** A formal procedure is used to launder a political vendetta or predetermined outcome, charging the wrong crime to avoid accountability for the real one. The harm isn't the verdict; it is using process to mask intent, forcing participants to judge a proxy issue while the real stakes remain hidden. This is not about guilt; it is about the weaponization of procedure.

  - **The screen**
  **1. The Reversal Window**
  *Question:* If the assembly changes its mind halfway through, or immediately after voting, is there a formal mechanism to pause implementation without a crisis?
  *Passing Answer:* There is a mandatory cooling-off period between recommendation and council vote, or a requirement for a second reading where new evidence can be introduced.
  *Red Flag:* "The council needs this immediately," or "The recommendation is binding upon delivery."
  *Disposition:* **Redesign.** If you cannot stop the train, you cannot guarantee the track is safe.

  **2. The Messenger Safety**
  *Question:* Can members report that the process is failing, the evidence is weak, or the timeline is unrealistic without fear of being labeled obstructive?
  *Passing Answer:* There are anonymous feedback channels to the facilitation team, and the design includes explicit "stop/go" gates where the assembly can request more time.
  *Red Flag:* "Members must stick to the brief," or "Delays will be viewed as failure by the council."
  *Disposition:* **Redesign.** If members hedge the truth to please the commissioner, you are building a Sicily expedition.

  **3. The Charge Clarity**
  *Question:* Is the question asked the actual question the council wants answered, or is it a proxy for a political fight they don't want to have?
  *Passing Answer:* The brief matches the public controversy (e.g., "How do we balance the budget?" vs. "Which service do we cut?").
  *Red Flag:* The question is narrowly technical while the public debate is deeply values-based, or vice versa.
  *Disposition:* **Proceed and Document.** Note the mismatch in the risk register, but do not accept a brief that asks about "impiety" when the crime is "oligarchy."

  **4. The Implementation Lag**
  *Question:* Is the time between the decision and the consequence short enough that members feel ownership, but long enough to absorb shock?
  *Passing Answer:* The timeline allows for evidence to be tested before the final vote, and implementation is phased.
  *Red Flag:* Immediate implementation of complex changes (e.g., closing urgent care centers) before election cycles or budget locks.
  *Disposition:* **Redesign.** Compressing time creates the Mytilene effect; panic overrides judgment.

  **5. The Role Boundary**
  *Question:* Are members asked to deliberate, or are they asked to advocate, campaign, or legitimize?
  *Passing Answer:* Members deliberate and recommend; elected officials or campaigners handle advocacy and implementation.
  *Red Flag:* Members are expected to campaign for the outcome, defend it in public, or write ballot wording without independent review.
  *Disposition:* **Decline.** This turns citizens into tools for political warfare. It violates the Socrates mechanism by confusing the jury with the prosecutor.

  **6. The Adversary Integrity**
  *Question:* If there is a designated critic or opposition voice, are they genuinely independent, or are they chosen to validate a specific outcome?
  *Passing Answer:* Critics are selected by a neutral body or represent genuine opposing viewpoints from the community.
  *Red Flag:* The council appoints a critic who privately supports the proposal, or the "opposition" is a straw man.
  *Disposition:* **Decline.** This is not deliberation; it is theater. It guarantees Feedback Collapse.

  **7. The Political Timing**
  *Question:* Does the assembly report land during a neutral period, or is it timed to influence an election or specific vote?
  *Passing Answer:* The report is published well before or after electoral events, or the council agrees to quarantine the findings from campaign use.
  *Red Flag:* Reporting immediately before an election, or requiring publication before a council vote to "force hands."
  *Disposition:* **Decline.** This is the Legitimacy Trap. You are providing cover for a partisan move.

  - **Not our call**
  The screen stops when the risk is not procedural but political. If the council genuinely wants deliberation but lacks the votes to implement it, that is their risk, not yours. Hand this back when the design passes the screen but the political will is absent. Say this: "The design is robust enough to produce a legitimate recommendation. However, our screen cannot guarantee the council's willingness to act on it. If the recommendation is ignored, the damage falls on public trust, not process design. You need to confirm internally that you have the votes to implement before we begin." Do not sign a contract that makes you responsible for their courage.

  - **Run on my three**
  **(1) Urgent Care / Election:** **Decline.** This fails Checks 1, 4, and 7 catastrophically. Reporting three weeks before an election is the Legitimacy Trap; the recommendation will be used as a weapon, not a guide. No second reading means no Reversal Window; if they vote to close a center and realize the error, the election cycle locks it in. The bad news is plain: you are being asked to launder a cut before a vote. If you sign this, you own the backlash when the center closes and services collapse. The single most important change would be moving the timeline six months away from the election, but if they won't move the date, walk away.

  **(2) Housing / Critic:** **Redesign.** This fails Check 6 (Adversary Integrity) and risks Check 2 (Messenger Safety). A "critic" who privately supports the proposal is not a critic; they are a plant. This creates a Feedback Collapse where dissent is managed rather than heard. Members will sense the stack and disengage. The single most important change is to remove the designated critic role entirely or require the council to appoint a genuine opponent from the community. If they insist on the plant, decline.

  **(3) Referendum / Campaign:** **Redesign.** This fails Check 5 (Role Boundary) and Check 3 (Charge Clarity). Asking members to write ballot wording and campaign blurs the line between judge and advocate. It exposes them to public retaliation and compromises their neutrality. The single most important change is to strip the campaigning requirement; members recommend, a separate campaign group advocates. If they insist members campaign, you are turning citizens into staff.

  - **Where this breaks**
  Athens was an empire deciding on massacre; you are deciding on bus fares. The stakes are lower, which means the Mytilene "Velocity of Regret" is less lethal but still corrosive to trust. The screen might kill designs that are actually fine because the local context is low-conflict; a small town might handle a "flawed" process without collapsing. It also won't catch failure modes unique to modern bureaucracy, like consultant capture or data privacy breaches. Finally, it assumes the council cares about legitimacy; if they only want cover, the screen tells you to decline, but it doesn't stop them from finding someone else who won't. Use this to protect your integrity, not to predict the future.
