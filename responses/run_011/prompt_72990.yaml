answer: |-
  # Workshop Plan: The Commission

  ## 1. Materials List (for 24 participants + 1 facilitator)

  **Consumables:**
  *   **Modelling Clay:** 6 kg total. *Crucial:* Use water-based, air-drying clay (e.g., standard school clay), **not** oil-based (Plasticine). It must dry, crack, and lose mass over two hours in a warm hall.
  *   **Water Sprays:** 6 small spray bottles (to accelerate drying/crusting if the hall is too dry).
  *   **Index Cards:** 30 thick stock cards (6 for rules, 24 spares).
  *   **Markers:** 12 thick permanent markers (for writing rules visibly).

  **Hardware:**
  *   **Kitchen Scales:** 6 digital scales (0.1g precision).
  *   **Coins:** £60 in 50p pieces (120 coins). This is the bank.
  *   **Containers:** 6 small Tupperware boxes (to hold clay and coins per table).
  *   **Cutting Tools:** 6 plastic knives or dental floss cutters (for clean division).
  *   **Aprons/Wipes:** 24 aprons or old shirts; wet wipes for cleanup.

  **Room Setup:**
  *   6 Round Tables (4 chairs each).
  *   Central "Bank" table for you.
  *   A wall or board for the "Public Ledger" (a large sheet of flipchart paper).

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:15** | **The Commission** | Intro, distribution of clay/coins, writing the Rule Card. |
  | **00:15 – 00:35** | **Round 1: Erosion** | Gradual replacement & weighing. The "Crumb Tax." |
  | **00:35 – 00:55** | **Round 2: Division** | Splitting the object. Competing claimants. |
  | **00:55 – 01:15** | **Round 3: Fusion** | Merging tables. The "Hybrid" problem. |
  | **01:15 – 01:30** | **The Market** | Open trading of "Identity Claims." Arbitrage phase. |
  | **01:30 – 01:45** | **The Audit** | **The Whole Room Moment.** Public contradiction. |
  | **01:45 – 02:00** | **Debrief** | Mapping rules to philosophy. Closing statement. |

  ---

  ## 3. Event Script & Facilitator Notes

  ### Phase 1: The Commission (00:00 – 00:15)
  **Action:** Distribute one 1kg lump of clay and £10 (20 coins) to each table.
  **Facilitator:** "You are artisans. I am the Client. On your table is 'The Commission.' I do not care about the atoms. I care about *The Object*. Over the next two hours, I will ask you to change it. Your job is to ensure that when I return, I am looking at the *same* Object I left. If it is the same, you keep your end of the contract. If it is not, you have failed."

  **Action:** Hand out Index Cards and Markers.
  **Facilitator:** "Before we begin, you must define 'Same.' Write your Criterion of Sameness on this card. It must be one or two sentences. Examples: 'It is the same if it weighs the same.' 'It is the same if it looks the same.' 'It is the same if the matter is continuous.' Once you write it, you cannot change it. This card is your metaphysics. It is also your bank account."

  **Constraint:** If a table writes "It is the same if I say it is," reject it. Demand an objective criterion.
  **Constraint:** If a participant says "There are no objects," (The Eliminativist):
  **Fix:** "Then you have already failed the Commission. You are holding matter, not the Object. You may sit out and observe, or write a rule that allows you to play. If you refuse to play the game of identity, you cannot win the money." (Do not let them derail the room; isolate the objection as a forfeit).

  ### Phase 2: Round 1 - Erosion (00:15 – 00:35)
  **Action:** Instruct tables to remove 10% of their clay by weight. Replace it with fresh clay from a central "spare" pile (which you bring around).
  **Facilitator:** "The Commission requires maintenance. Remove 100 grams. Replace it with fresh matter. Weigh the crumbs you removed. Weigh the new mass."
  **Action:** Tables must weigh the removed crumbs.
  **Facilitator:** "Here is the tax. Every gram of original matter that leaves the table costs you 10p from your purse. Every gram of new matter added costs 5p. Pay the Bank."
  **Decision:** Ask tables: "Do you still hold The Commission?" They must answer based *only* on their Rule Card.
  **Scoring:** If they say "Yes," they bet £1 that their Rule Card holds. If they say "No," they forfeit the Commission (lose £5).
  **Facilitator Note:** Watch for tables that fudge the weight. Insist on the scale. The drying clay will shed crumbs during this phase. Make them weigh the crumbs on the table surface. "Is a crumb on the table part of the Object?" Let their Rule Card decide. If their card is silent, they lose the bet.

  ### Phase 3: Round 2 - Division (00:35 – 00:55)
  **Action:** Instruct tables to cut their lump exactly in half by weight.
  **Facilitator:** "The Client is divorcing. He wants two commissions. Cut the Object in half."
  **Problem:** Which half is the *original* Commission?
  **Action:** Table keeps Half A. Half B is placed in a neutral zone in the middle of the room.
  **Facilitator:** "Which half is the Commission? You must decide. If you claim Half A is the Commission, you bet £2. If you claim Half B is the Commission, you bet £2. If you claim *both* are the Commission, you pay a 'Duplication Fine' of £5 (The Client only ordered one). If you claim *neither*, you forfeit the contract."
  **Trap:** Most rules will struggle here. If their rule is "Same Matter," neither is the full object. If their rule is "Same Form," both might be. Force them to pay the fine if they hedge.

  ### Phase 4: Round 3 - Fusion (00:55 – 01:15)
  **Action:** Pair up the tables (Table 1 with Table 2, etc.). They must mash their two halves together into one new lump.
  **Facilitator:** "The Client has reconciled. Merge your Commission with your neighbor's."
  **Problem:** You now have one lump made of two "Commissions."
  **Action:** Weigh the new lump.
  **Facilitator:** "How many Commissions are in this lump? One? Two?"
  **Scoring:** If they say "One," they must decide *which* table owns it. The other table must agree or bet against it. If they disagree, both pay £2 to the Bank. This forces them to negotiate identity across different Rule Cards.

  ### Phase 5: The Market (01:15 – 01:30)
  **Action:** Open trading. Tables can sell "Identity Certificates" to other tables.
  **Facilitator:** "If Table 1's rule says their lump is the same as Table 2's lump, Table 1 can sell that claim to Table 2 for 50p. Table 2 can then claim my payout."
  **Goal:** This is where the arbitrage happens. Table A might have a loose rule ("Same if same shape"). Table B has a strict rule ("Same if same atoms"). Table A will try to sell Table B an object that Table B's own rule rejects.
  **Facilitator Role:** Act as the clearinghouse. If Table B buys a claim from Table A, but Table B's own Rule Card contradicts the claim, Table B loses the money *and* pays a penalty for "Fraudulent Claim." This forces them to check *other* tables' rules against their own.

  ### Phase 6: The Audit (The Whole Room Moment) (01:30 – 01:45)
  **Setup:** This is the climax for your write-up.
  **Action:** Ask everyone to stop trading. Collect all 6 Rule Cards. Stick them on the wall where everyone can see them.
  **Facilitator:** "We have one lump of clay left in the center of the room. It is made of pieces from every table. It has lost 15% of its mass to drying. It has been cut and remade."
  **Action:** Read each Rule Card aloud.
  **Facilitator:** "Based on Rule 1: Is this the Commission?" (Table 1 votes). "Based on Rule 2: Is this the Commission?" (Table 2 votes).
  **The Reveal:** It is highly likely that Rule 1 says "Yes," Rule 2 says "No," and Rule 3 says "Only if..."
  **The Kicker:** "Look at your purses. Some of you have made money claiming it *is* the Commission. Some of you have made money claiming it *is not*. You have all been paid by the Bank to assert contradictory truths about the same lump of matter at the same time."
  **Silence:** Let this sit for 30 seconds. "The money is real. The contradiction is real. Your rules are incompatible."

  ### Phase 7: Debrief (01:45 – 02:00)
  **Action:** Map the rules to philosophical positions. Do this *now*, not before.
  **Facilitator:** "Table 1, you focused on the matter. You are **Constitutionalists**. Table 2, you focused on the shape/function. You are **Formalists**. Table 3, you said identity is a matter of degree. You are **Perdurantists**. Table 4, you said the object ceased to exist when cut. You are **Mereological Nihilists**."
  **Closing:** "You came looking for a rule that tells you what the object *is*. You found that identity is not a fact about the clay. It is a cost you are willing to pay. The question is not 'Is it the same?' The question is 'Who pays for the difference?'"

  ---

  ## 4. Betting and Scoring Mechanics (The Arithmetic)

  **Initial Endowment:** £10 per table (20 x 50p).
  **The Bank:** You hold the reserve.

  **Round 1 (Erosion):**
  *   **Cost:** 10p per gram of original matter lost. 5p per gram of new matter added.
  *   **Bet:** £1 on "Identity Preserved."
  *   **Payout:** £2 if the Facilitator accepts the claim (based on their own consistency).
  *   **Penalty:** If the scale shows they lied about the weight, they lose the bet + £1 fine.

  **Round 2 (Division):**
  *   **Bet:** £2 on "Which Half?"
  *   **Duplication Fine:** £5 if they claim both halves are the original.
  *   **Forfeit:** £10 (all money) if they claim neither (contract failed).

  **Round 3 (Fusion):**
  *   **Dispute Cost:** If two merged tables cannot agree on ownership, both pay £2 to the Bank.

  **The Market:**
  *   **Trade Price:** Fixed at 50p per "Identity Claim."
  *   **Fraud Penalty:** If a table buys a claim that contradicts their own Rule Card, they lose the 50p + £1 fine. (This ensures they must understand their own rule deeply enough to know when it conflicts).

  **Winning Condition:**
  There is no winning. The goal is to end with *some* money left, but the *real* goal is to have a Rule Card that didn't require you to pay a "Fraud Penalty" or "Duplication Fine." Most tables will go bankrupt or near-bankrupt. This is the desired outcome.

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "Eliminativist" (No statues, only matter)**
  *   **Prediction:** A participant argues in Minute 3 that the game is nonsense because objects don't exist.
  *   **Fix:** Do not debate. Treat it as a betting strategy. "If there are no statues, you cannot fulfill the Commission. You forfeit the £10. You may watch, but you cannot bet." This usually silences them quickly as they realize their metaphysics is expensive.

  **2. The "Lawyer" (Small Print)**
  *   **Prediction:** A table writes a rule like "It is the same unless I decide it isn't."
  *   **Fix:** Pre-empt this in the intro. "The Rule must rely on properties of the clay, not the state of your mind." If they slip it through, act as the Client. "I am the Client. I decide if you decide. Your rule is void."

  **3. The Clay Dries Too Fast/Slow**
  *   **Prediction:** If it dries too fast, it crumbles before Round 2. If too slow, the "Erosion" event feels fake.
  *   **Fix:** Bring a hairdryer. If it's too stable, blast the clay in Round 1 to force crumbling. If it's too brittle, spray it with water. Make the *behavior of the matter* part of the script. "The matter is resisting you."

  **4. Participants Collude**
  *   **Prediction:** Tables agree to split the money and ignore the rules.
  *   **Fix:** The "Audit" phase exposes this. If they all claim the final lump is "The Commission," point out that they have created infinite Commissions from finite matter. "You have inflated the currency of identity. The Bank is insolvent."

  **5. Confusion Over "The Client"**
  *   **Prediction:** They think *you* are judging based on *your* metaphysics.
  *   **Fix:** Reiterate: "I am not judging truth. I am judging consistency. If your rule says X, and you bet Not-X, you pay. I am the mirror, not the judge."

  ---

  ## 6. The "Contract Law" Worry (Candid Note)

  You asked where the game's incentives actively mislead and what you must say to stop the dispute collapsing into contract law.

  **The Risk:**
  The game monetizes identity. Participants will inevitably start treating "The Commission" not as a metaphysical puzzle, but as a financial instrument. They will argue that identity is whatever the contract (Rule Card) says it is. They will conclude: "Identity is conventional." This is a valid philosophical position (Conventionalism), but it sidesteps the *ontological* tension you want them to feel. They might leave thinking, "Well, we just agreed to call it the same, so it is the same," missing the point that their *intuitions* conflicted even when their *agreements* did not.

  **The Fix (What to Supply in Words):**
  In the Debrief, you must explicitly sever the link between *agreement* and *truth*.
  Say this: *"You might think you solved this by writing a rule. But notice: when the clay cracked, your rule didn't tell you what happened. You had to decide. The money didn't tell you what the object was; it told you how much it cost to pretend you knew. The dispute isn't about the contract. It's about why you felt a pang of loss when the crumb fell, even if your rule said it didn't matter."*

  **Where the Incentives Mislead:**
  The betting mechanic rewards *consistency*, not *accuracy*. A table can be consistently wrong (e.g., "The object is the same only if it is blue") and win money. This simulates pragmatic success, not metaphysical insight. You must acknowledge this: *"The game rewards coherence, not truth. In the real world, the world pushes back. Here, only I push back. That is the limitation of this room."*

  ---

  ## 7. The Feature The Game Cannot Reproduce

  **The Missing Element:**
  The game cannot reproduce **Mind-Independence**.
  In the workshop, the object's identity is determined by the participants' rules and your payout. In reality, we feel that whether the statue is the same *does not depend on us*. We feel we are *discovering* identity, not *assigning* it.
  The game proves that assignment is costly. It does not prove that discovery is impossible.
  A participant might leave thinking, "Identity is just a social construct we bet on." You need to ensure they also feel the *resistance* of the world (the drying clay, the weight) that made the betting hard. The clay is the anchor. If the clay were digital, the point would be lost. The physical resistance of the matter is the only thing in the room that isn't a convention.

  **Instruction for the Write-up:**
  When you write this, focus on the *weight* of the coins vs. the *weight* of the clay. The scales measure the matter; the coins measure the doubt. The gap between those two measurements is the philosophy.

  ---

  ## 8. Summary Checklist for the Facilitator

  1.  **Do not** mention Ship of Theseus.
  2.  **Do not** use the word "Ontology" until the last 15 minutes.
  3.  **Do** enforce the Rule Card strictly. No verbal amendments.
  4.  **Do** make the clay drying a visible, audible event (cracking sounds).
  5.  **Do** ensure the "Audit" phase is silent except for your voice.
