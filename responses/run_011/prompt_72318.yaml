answer: |-
  This is a splendid case study. It sits precisely at the intersection of jurisprudence, metaphysics, and non-classical logic, and it exposes the friction that occurs when formal systems attempt to regulate their own constitution. As a philosophy student, you will recognize that Rhys and Beatrice are rehearsing a specialized version of the debate between dialetheism (the view that some contradictions are true) and classical legal positivism (the view that legal validity is a matter of social fact and hierarchy).

  Here is an analysis of the exchange move by move, followed by the missed reading and a final verdict.

  ### 1. Norms vs. The World (Beatrice's Opening)
  **Beatrice's Claim:** A conflict among rules is not a contradiction in the world; membership is a status constituted by rules, so conflicting rules yield indeterminacy, not a truth-value glut.
  **Rhys's Implicit Counter:** The status *is* the truth; if the rules dictate contradictory statuses, the proposition "Nadia is a member" is both true and false.

  **Analysis:**
  Beatrice is correct on the ontology but potentially wrong on the logic of normative systems. She relies on a Hartian view: legal statements are not descriptions of physical reality but assertions of validity within a system. If the system's rules clash, there is no "fact of the matter" until a higher rule resolves it. Therefore, the proposition "Nadia is a member" lacks a truth value (a gap), rather than possessing two (a glut).

  However, Rhys is pressing a cognitivist view of normative propositions: if the system entails $P$ and the system entails $\neg P$, and we treat the system as truth-apt, then we have $P \land \neg P$. Beatrice's move **redescribes** the problem rather than blocking it. She asserts that the correct logical output of a rule conflict is a gap. But this is a choice, not a necessity. One could equally argue that a rule conflict generates a glut (both obligations hold, or both statuses obtain). By asserting it *must* be a gap, she is begging the question against the dialetheist.

  **Verdict:** **Beatrice is partially right.** She correctly identifies that normative contradictions are not empirical contradictions (like a ball being wholly red and wholly green). However, she is wrong to assume this automatically forces a "gap" solution. A conflict of norms can logically generate a glut just as easily as a gap, depending on how one models the normative system.

  ### 2. Indeterminacy vs. Vagueness (Rhys's Counter)
  **Rhys's Claim:** Indeterminacy (gaps) applies to borderline cases (vagueness). Here, dates and votes are precise. Therefore, no gaps are available.
  **Beatrice's Position:** The gap arises from rule conflict, not semantic vagueness.

  **Analysis:**
  Rhys makes a category error here. He conflates *semantic vagueness* (Sorites paradoxes, e.g., "is this a heap?") with *normative indeterminacy* (antinomies, e.g., "Rule A says X, Rule B says not-X"). A proposition can be precise in its terms and still be truth-valueless because the system fails to assign it a value. For example, "The King of France is bald" is precise but lacks a truth value due to reference failure, not vagueness. Similarly, Nadia's status is not vague; it is underdetermined by the conflicting directives of SO 12 (automatic lapse) and SO 31 (retroactive cure).

  **Verdict:** **Beatrice is right; Rhys is wrong.** The absence of vagueness does not rule out indeterminacy. Gaps arise from absence of authority or conflict of authority, not just from fuzzy predicates. Rhys's attempt to close the "gap" option on these grounds fails.

  ### 3. The Two Horns (Rhys's Dilemma)
  **Rhys's Claim:** Either accept the glut (they were and weren't members) or accept the resolutions failed (paralysis). There is no third position.
  **Beatrice's Choice:** She takes the second horn (resolutions failed).

  **Analysis:**
  Rhys presents a false dilemma *within the strict textualism* of the Standing Orders, but a real one *within the logic of the situation as described*. If we accept the premise that voting eligibility is a strict precondition for the validity of the vote, and that eligibility depends on the outcome of the vote (via retroactivity), we have a circular dependency.
  *   **Horn 1 (Glut):** The vote validates itself retroactively, creating a state where $Member(t) \land \neg Member(t)$ for $t < Vote$.
  *   **Horn 2 (Void):** The vote fails because the voters were ineligible, so the retroactivity never triggers, so they remain non-members.

  Beatrice chooses Horn 2. This is logically consistent but institutionally catastrophic. Rhys argues this is unacceptable. However, Rhys is wrong that these are the *only* horns. He assumes the text of the Standing Orders is the sole source of validity. He ignores the possibility that the Committee has an inherent power to regulate its own procedure (see "Missed Reading" below).

  **Verdict:** **Rhys is locally right, globally wrong.** Given the strict constraints they are arguing under, the dilemma holds. But the constraints themselves are contestable. Beatrice is logically consistent to choose the "Void" horn, even if it is pragmatically disastrous.

  ### 4. The Cost of Paraconsistency (Beatrice's Challenge)
  **Beatrice's Claim:** Paraconsistency costs an inference. Which one? Is it worth surrendering for a botched minute?
  **Rhys's Response:** Evasive. He claims the cost is worth it to avoid the circle.

  **Analysis:**
  Beatrice lands a heavy blow here. In standard paraconsistent logics (like LP, the Logic of Paradox), the price of tolerating true contradictions without explosion ($A, \neg A \vdash B$) is the loss of **Disjunctive Syllogism** ($A \lor B, \neg A \vdash B$).
  Why? Because if $A$ can be both true and false, and we know $A \lor B$ is true and $\neg A$ is true, $A$ might be the "true-and-false" proposition. If $A$ is true, $B$ doesn't have to be. Thus, the inference fails.
  Disjunctive Syllogism is a workhorse of ordinary reasoning. Surrendering it makes standard deduction difficult. Rhys is unwilling to name this cost because admitting that he must give up a fundamental rule of inference to save a debating society's minute book makes his position look disproportionate.

  **Verdict:** **Beatrice is right.** Rhys is being philosophically irresponsible. Paraconsistency is a heavy metaphysical hammer to crack a clerical nut. To deny Disjunctive Syllogism generally is a high price; to deny it only for this case is *ad hoc* and lacks a principled basis.

  ### 5. Truth vs. Institutional Design (Rhys's Final Point)
  **Rhys's Claim:** The void reading condemns the Society to an unrepairable circle.
  **Beatrice's Claim:** This is a complaint about drafting, not a discovery about truth.

  **Analysis:**
  This is the crux of the matter. Beatrice identifies that Rhys is conflating *logical necessity* with *institutional contingency*. The "contradiction" exists only because the Society chose rules that interact poorly. If they amended the rules (as Beatrice suggests), the contradiction vanishes. Therefore, the contradiction is not a feature of reality or even of logic, but of a specific, flawed human artifact.
  Rhys argues that the *validity of public acts* shouldn't depend on undetectable circles. This is a pragmatic argument, not a logical one. He is arguing for a principle of **Legal Certainty**, not Truth.

  **Verdict:** **Beatrice is decisively right.** Rhys is trying to derive a metaphysical conclusion (true contradictions exist) from a jurisprudential problem (bad drafting). The "truth" of Nadia's membership is entirely dependent on the Society's rules. If the Society changes the rules to say "The Committee may waive eligibility requirements for readmission votes," the problem disappears. A problem that can be legislated away is not a dialetheia; it is a design flaw.

  ### The Missed Reading: The Legal Fiction (Performative Utterance)

  Both Rhys and Beatrice miss a reading that dissolves the contradiction without paraconsistency and without institutional paralysis. They both treat the resolution "readmit with effect from 1 January" as a **descriptive claim** about the past.
  *   Rhys thinks: If it says Jan 1, it asserts she *was* a member on Jan 1. Since she *wasn't*, we have $P \land \neg P$.
  *   Beatrice thinks: If it says Jan 1, it tries to assert she *was* a member. Since she *wasn't*, the assertion fails (Void).

  **The Missed Reading:** The resolution is a **Legal Fiction** or **Performative Utterance**.
  In law and administration, "with effect from [past date]" does not mean "It is now true that you were a member then." It means "For all purposes of these Standing Orders, **treat** the member **as if** they had been a member since then."
  This is not a truth claim; it is an instruction to the system. It operates prospectively upon the records.
  *   **On 12 February:** Nadia was not a member (Fact).
  *   **On 19 February:** The Committee issues a command: "Update the state of the system such that Nadia is recorded as a member from 1 January."
  *   **Result:** There is no time at which the system holds contradictory states. The system simply overwrites the previous state. The "contradiction" only arises if one insists that the retroactive clause changes the *metaphysical past* rather than the *administrative record*.

  Furthermore, there is a second missed reading regarding **Competence-Competence**. The Committee, as the sovereign body for membership, has the implicit power to determine the validity of its own meetings. By allowing Callum and Nadia to sit and vote without objection at the start of the meeting, the Committee implicitly **ratified their eligibility for that meeting** *pro hac vice* (for this occasion). This ratification validates the vote, which validates the readmission, which validates the retroactivity. This breaks the circle using classical logic:
  1.  Committee has power to regulate procedure.
  2.  Committee exercised that power by seating C & N.
  3.  Therefore, C & N were eligible to vote *at that meeting*.
  4.  Therefore, the vote was valid.
  5.  Therefore, the retroactive clause is validly triggered.

  This reading saves the Society (Rhys's goal) without requiring true contradictions (Beatrice's constraint).

  ### Final Verdict

  **Who was more right overall?**
  **Beatrice** was more right philosophically and logically. She correctly identified that:
  1.  Normative conflicts are not ontological contradictions.
  2.  Rhys's rejection of gaps based on precision was erroneous.
  3.  Paraconsistency carries a heavy inferential cost (Disjunctive Syllogism) that Rhys could not justify.
  4.  The problem is one of institutional design, not the nature of truth.

  Rhys was right only about the **pragmatic stakes**: allowing the resolutions to fail is disastrous for the Society. However, he attempted to solve a practical problem with a metaphysical sledgehammer. He tried to elevate a clerical error into a proof of dialetheism, which is a category mistake.

  **Does the episode tell us anything general about true contradictions?**
  **No.** It tells us something local about **retroactive provisions in closed normative systems**.
  The appearance of a contradiction here is an artifact of modeling administrative rules as timeless logical propositions. In reality, administrative systems operate in time. A retroactive rule is not a time-travel mechanism that changes the past; it is a present instruction to recalculate past records.
  *   **General Lesson:** True contradictions do not arise from rule conflicts; they arise only if one insists on treating normative fictions as descriptive truths. The episode reinforces the classical view that what looks like a contradiction in law or administration is usually a sign of ambiguous drafting, conflicting hierarchies, or a misunderstanding of the performative nature of legal language, rather than a glimpse into a paraconsistent reality.

  **Advice for your module:**
  Use this case to illustrate the difference between **ontological dialetheism** (the world is contradictory) and **normative inconsistency** (the rules are messy). Rhys attempts to bridge them, but Beatrice successfully shows that the bridge is built on a confusion between *validity* and *truth*. The "missed reading" (Legal Fiction) is your trump card: it shows how classical logic can accommodate retroactivity without explosion, provided we understand the semantics of "effect from" correctly.
