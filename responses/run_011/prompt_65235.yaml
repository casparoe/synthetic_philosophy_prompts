      *   Case 9 vs 5: Why is engagement harm worse than fraud loss? Maybe because fraud is external agent (fraudster), whereas engagement harm is *your* algorithm directly acting. The principle needs to distinguish *direct algorithmic harm* vs *enabling third party harm*.

  6.  **Addressing the New Cases:**
