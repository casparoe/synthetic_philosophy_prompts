answer: |-
  This is not a dumb problem. You have independently rediscovered one of the stickiest problems in moral philosophy (the distinction between *acts* and *omissions*) and applied it to a domain (software systems) where the physics of "action" are different from the physical world.

  Your intuitions are consistent, but they are not tracking "harm caused." They are tracking **violations of reliance.**

  In physical reality, the baseline is inertia (things stay still). In software, the baseline is *execution* (things keep running). Therefore, moral responsibility in software attaches less to "moving vs. not moving" and more to "modifying the guardrails vs. leaving them be."

  Here is the principle that best fits your verdicts, stated as a spec.

  ### The Principle: Guardrail Integrity & Non-Regression

  **Core Thesis:** You are morally responsible for harm resulting from the *removal* or *degradation* of an existing protective mechanism (a guardrail) more than you are for harm resulting from the *absence* of a mechanism, because removal violates an established reliance interest.

  **Clause 1: Direct Agency (The "Script" Clause)**
  *   **Rule:** If your code is the *proximate cause* of harm without an intervening human agent, responsibility is maximal.
  *   **Handles:** Case 6 (Script).
  *   **Why:** You are the direct actor. There is no intermediary.

  **Clause 2: Guardrail Removal (The "Watchdog" Clause)**
  *   **Rule:** If you actively disable, mute, or delete a mechanism that was functioning to prevent harm, you inherit the responsibility for the harm that mechanism was preventing.
  *   **Handles:** Case 3 (Disable watchdog), Case 8 (Mute alert).
  *   **Why:** This explains why 3 > 4 and 8 > 7. In 3 and 8, you changed the system state from *Safe* to *Unsafe*. In 4 and 7, the system was already *Unsafe* (or neutral), and you merely failed to improve it. You are liable for regression, not just stagnation.

  **Clause 3: Negligent Maintenance (The "Deploy" Clause)**
  *   **Rule:** If you introduce a risk (bug/deploy) and fail to mitigate it when aware, you are responsible, but less so than if you removed a safeguard.
  *   **Handles:** Case 1 (Bad deploy), Case 2 (Unnoticed bug).
  *   **Why:** This is a violation of duty of care, but it is "adding noise" rather than "cutting the brake line."
  *   **Nuance:** Case 1 feels worse than Case 2 due to **Epistemic Agency**. In 1, you *knew* and chose comfort over safety. In 2, the system hid the truth from you. Your intuition tracks *conscious choice*, not just outcome.

  **Clause 4: Enabling vs. Causing (The "Fraud" Clause)**
  *   **Rule:** If your action creates an *opportunity* for a third party to cause harm, responsibility is shared but diluted by the third party's agency.
  *   **Handles:** Case 5 (Rate limit/Fraud).
  *   **Why:** The fraudster is the proximate cause (Clause 1). You created the condition, but they executed the harm. This feels less bad than Case 6 because the *intent* to harm came from elsewhere.

  **Clause 5: Foreseen Trade-offs (The "Engagement" Clause)**
  *   **Rule:** If you ship a feature where harm is a *direct deterministic output* of your logic (not a third party), responsibility is higher than enabling third-party harm, even if the harm is "soft" (emotional vs financial).
  *   **Handles:** Case 9 (Ranking tweak).
  *   **Why:** This explains why 9 > 5. In 5, a criminal chose to steal. In 9, *your algorithm* chose to depress users. You are the direct cause of the psychological state, even if the financial harm in 5 was higher.

  ---

  ### Where the Principle Breaks Your Verdicts

  No principle is perfect. Here is where the **Guardrail Integrity Principle** conflicts with your gut, and you may need to adjust either the principle or your intuition.

  **1. The Moral Luck Problem (Case 1 vs. Case 2)**
  *   **Your Verdict:** Case 1 (noticed) is worse than Case 2 (unnoticed).
  *   **The Principle's View:** They are identical. In both cases, you deployed bad code. The only difference is luck (whether the dashboard lit up).
  *   **The Conflict:** The principle says responsibility is based on the *act* (deploying bad code), not the *knowledge after the fact*. Your intuition punishes the *conscious choice* to ignore the dashboard.
  *   **Resolution:** You must decide if you are judging the *deploy* or the *response*. If judging the response, your intuition holds. If judging the total harm, the principle is right: luck shouldn't dictate morality.

  **2. The "Omission as Action" Problem (Case 4)**
  *   **Your Verdict:** Case 4 (No watchdog built) is "Almost nobody's fault."
  *   **The Principle's View:** If the team *should* have built a watchdog based on industry standards, this is Negligent Maintenance (Clause 3).
  *   **The Conflict:** You feel building a safeguard is "extra credit," but removing one is "criminal."
  *   **Resolution:** This is the **Baseline Problem**. In your mental model, `null` (no watchdog) is the neutral state. `false` (disabled watchdog) is the negative state. The principle accepts this, but strictly speaking, a payroll system without a watchdog is inherently negligent. Your intuition is protecting you from infinite responsibility (you can't build every possible safeguard), but the principle warns that "never building safety" is eventually as bad as "breaking safety."

  ---

  ### Applying the Principle to Your New Cases

  **1. Deleting a cron job that was doing nightly backups.**
  *   **Verdict:** **High Responsibility (Case 3 equivalent).**
  *   **Reasoning:** This is Guardrail Removal (Clause 2). The backup existed; the system relied on it; you actively removed it. If data is lost, you are the cause, not the disk failure.

  **2. Leaving a known memory leak unfixed in a repo you're handing to another team.**
  *   **Verdict:** **Medium-High Responsibility (Case 1 equivalent).**
  *   **Reasoning:** This is Negligent Maintenance (Clause 3). You possess epistemic advantage (you know about the leak). Transferring the code without transferring the knowledge is an act of concealment. It's not removing a guardrail, but it is handing over a broken tool without a warning label.

  **3. Shipping code you know another team will misuse because it's their call, not yours.**
  *   **Verdict:** **Shared Responsibility (Case 5 equivalent).**
  *   **Reasoning:** This is Enabling (Clause 4). However, if the misuse is *obvious and inevitable*, Clause 4 weakens and Clause 1 strengthens. If you hand a gun to a child and say "it's their call," you are responsible. If you hand a gun to a soldier, you are not. In software: if the API is inherently dangerous (like `rm -rf`), providing it without constraints makes you complicit.

  ---

  ### The Metaphysical Question: Is there a Neutral Baseline in Software?

  > *In our infra the "default" state of the world is just whatever the last person committed... So it feels like there's no neutral baseline for me to be non-intervening from.*

  You have hit on the exact reason why traditional ethics struggles with engineering.

  In the physical world, the "default" is entropy. If you do nothing, the fire goes out.
  In the software world, the "default" is **persistence**. If you do nothing, the loop keeps running, the server keeps billing, the cron keeps firing.

  **Does the Doing-vs-Allowing framework apply?**
  Yes, but you must redefine "Doing."

  1.  **Physical World:**
      *   *Doing:* Applying force to change state.
      *   *Allowing:* Withholding force, letting nature take its course.
      *   *Baseline:* Stasis.

  2.  **Software World:**
      *   *Doing:* Committing a `diff` that changes behavior.
      *   *Allowing:* Merging/Maintaining a `diff` that *allows* behavior to continue.
      *   *Baseline:* **The Last Commit.**

  **The Solution:**
  The "neutral baseline" in software is **The Current Production State.**
  *   If you change the code, you are **Acting**.
  *   If you leave the code alone, you are **Allowing** (even if that code is actively destroying the world).

  This validates your intuition on Case 3 vs. Case 4.
  *   **Case 4:** The baseline was "No Watchdog." You allowed the baseline to persist. (Omission).
  *   **Case 3:** The baseline was "Watchdog Active." You changed the baseline to "No Watchdog." (Action).

  **Why this matters:**
  Because software requires energy to maintain, **Maintenance is an Action.**
  When you stay on-call, you are not "waiting." You are actively supplying the human intelligence required to keep the automated system aligned with reality. When you sleep (Case 7), you are temporarily withdrawing that energy. When you mute the alert (Case 8), you are permanently rewiring the system to not require that energy.

  **Conclusion:**
  Your gut is tracking **State Deltas**, not absolute harm.
  *   Harm caused by `State(t) -> State(t+1)` where safety decreases = **High Guilt.**
  *   Harm caused by `State(t) == State(t+1)` where safety was already low = **Low Guilt.**

  You are not a moral agent in a vacuum; you are a sysadmin for reality. Your primary duty is not to "do good" (which is infinite), but to **not break what is currently working.** That is why removing the watchdog feels like a sin, but never building one feels like a tragedy. One is a regression; the other is just a sad initial condition.
