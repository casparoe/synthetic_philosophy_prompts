  This is worth developing only if you can ground why conversion itself is normative harm rather than just a descriptive metric. As it stands, it is a sophisticated rebrand of the public/private distinction that mistakes liquidity for illegitimacy. You need to prove that high convertibility correlates with democratic erosion, not just that it looks like what Westerners call corruption.

  2. **Biggest hole**
  Partisan patronage destroys this framework. Consider a mayor who fires career staff to hire party loyalists. The residue is increased party capacity to win future elections, which is purpose-bound to the political unit, not general-purpose cash. Your test classifies this as not corrupt because the standing hasn't been cashed out for private consumption. Yet this is often more damaging to institutional integrity than a single bribe. The problem is your unit variable is endogenous: corrupt actors define their unit as broadly as needed to pass the test. If the unit is the party, patronage is clean. If the unit is the ethnicity, ethnic cleansing of the bureaucracy is clean. You haven't found a line around corruption; you've found a way for sophisticated corrupt actors to justify themselves. Unless you fix the unit exogenously, the residue test is useless against systemic corruption. It cannot distinguish between building party capacity and looting the state for partisan gain. The distinction matters for democracy, but your metric erases it. This renders the residue test endogenous to the corruption it seeks to measure. You allow the actor to define the boundary of the self, which is precisely what corruption involves. A theory of corruption cannot let the corrupt define the terms of their own innocence. This is fatal.

  3. **Test cases**

  | Case | Verdict | Reasoning | Mark |
  | :--- | :--- | :--- | :--- |
  | (a) Mayor/Contract/Donor | Not Corrupt | Residue is political support, bound to election purpose. | **Wrong** |
  | (b) Headman/Cow/Exempt | Not Corrupt | Cow is low-conversion; cannot leave community context. | **Wrong** |
  | (c) Regulator/Revolving Door | Corrupt | Future salary is general-purpose cash; high conversion. | |
  | (d) Police/Free Meal | Not Corrupt | Meal is consumed; residue cannot be stored or spent. | **Wrong** |
  | (e) MP/Housing Allowance | Corrupt | Housing equity is liquid asset; general-purpose residue. | |
  | (f) Union Boss/Dues/Lawyer | Corrupt | Legal defense is personal benefit; outside union purpose. | |

  Your theory fails on (a), (b), and (d) because it conflates low liquidity with legitimacy. A cow is still a quid pro quo; a meal still biases enforcement priorities. Convertibility measures the ease of laundering the gain, not the existence of a breach in duty. You are measuring the *professionalization* of the corruption, not the *act* itself. High convertibility makes corruption scalable and dangerous, but low convertibility does not make it ethical or functional. The test identifies modern, monetized corruption, not corruption itself. It mistakes the *form* of the residue for the *fact* of the betrayal. A headman selling exemptions for cows is still selling office, regardless of whether he can spend the cow offshore. This implies your framework is class-biased: it flags elite financial corruption while ignoring subsistence-level graft. It protects the headman while hunting the banker. This undermines your claim to solve the universalism dispute; you are simply privileging the corruption types common in monetized economies. The residue test is a metric of development, not integrity.

  4. **Is it new?**
  This collapses into fiduciary duty theories, specifically the distinction between proper and improper purposes, but adds a monetary metric. It resembles Daniel Kaufmann's work on legal vs. illegal corruption but focuses on fungibility rather than statute. Convertibility does work in grading severity: cash is worse than gifts. However, it fails to do the work of definition. A breach of fiduciary duty is corrupt regardless of whether the gain is liquid. You have built a severity index but claimed it is a boundary definition. The literature already treats liquidity as an aggravating factor; you are presenting it as a constitutive element. This limits your contribution to nuance rather than paradigm shift. You need to argue why fungibility changes the moral quality, not just the scale. Without that, you are just adding a variable to existing models.

  5. **Cut list**
  Cut the Ang paragraph. It sets up a strawman your argument bypasses; it's dead weight. The title 'Convertibility' is too economic. Change it to **The Fungibility of Office**. It signals the political asset class without implying a financial mechanism. Keep the 'residue test' name; that's your strongest hook. Jump straight to the mechanism; the audience knows the relativist trap. Spend the saved words on the normative justification you admit is missing. That is the actual gap. Without it, you have a metric, not a theory.
