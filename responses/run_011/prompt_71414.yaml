  The "negligibility defense" rests on a pragmatic wager: that the theoretical guarantee of manipulability collapses under the weight of empirical friction and comparative institutional costs. My credence in **N** is **0.62**. I derive this by treating **N** not as a logical truth but as a contingent empirical-normative claim that requires four conditions to hold: manipulation must rarely change outcomes in large electorates; voters must lack the coordination or information to exploit opportunities; no superior strategy-proof alternative must be politically feasible; and the normative cost of manipulation must be outweighed by the gains in other properties like majority consistency. I assign the highest weight to the empirical claims (frequency and friction) because if manipulation is frequent and executable, the normative trade-off becomes moot. The escapes (randomization, VCG, etc.) are indeed largely non-starters for general political elections, so that term scores high, but it carries less weight because even if they were available, the core claim is about *ordinary* rules. The normative weighting is the most contentious and least certain term, as it depends on whether one views voting as a truth-tracking exercise or a preference aggregation mechanism.

  The arithmetic combines these terms via a weighted sum, reflecting that **N** fails if either the empirical reality is hostile (T1/T2) or the normative trade-off is unfavorable (T4), but survives even if escapes are theoretically possible (T3). Specifically: $(0.60 \times 0.35) + (0.60 \times 0.35) + (0.85 \times 0.15) + (0.45 \times 0.15) = 0.615$, rounded to 0.62. The final credence is most sensitive to the empirical frequency of outcome-altering manipulation (T1), as this is the prerequisite for all other concerns. I am least confident in the comparative normative weighting (T4), because "real cost" is ill-defined across different theories of democratic legitimacy. Regarding your "manipulation surface," the concentration wrinkle is decisive: an aggregate expected value is insufficient for political design because legitimacy often hinges on worst-case scenarios (e.g., close elections) rather than averages; the metric needs a second parameter for variance or tail risk. The 0.4 gap between you and your co-author likely stems from T4: as a philosopher, you likely assign higher intrinsic value to strategy-proofness (lowering your score on the trade-off), whereas your economist co-author likely prioritizes outcome efficiency and majority consistency (raising their score).

