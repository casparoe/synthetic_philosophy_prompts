      *   *Refining the "Unjust Enrichment" (2).* The user rejects unjust enrichment for individuals. But if the State enriched itself via slavery (infrastructure, capital), and the State is distinct, does the State hold that enrichment? If the State sold public lands or built infrastructure using slave labor, that asset is still held by the State. This might be a way out for the user. I should mention this as a potential patch, but note the insufficiency (most wealth is private now).

