prompt: |-
  I run a five-person forecasting cell inside a state public health agency. Our numbers go straight to a deputy commissioner who sometimes acts on them within a day, so they're not academic. About once a week we face the same structural call, and we have no way of making it: do we lock the forecast in now, or do we leave it open for whoever's on call to revise later — 2am, half the team out sick, a press conference scheduled for four hours from now?

  We've been burned in both directions. One time we locked and the person on call had the actual lab data in hand and wasn't allowed to move the number. Another time we left it open and the revision was made by someone who'd been awake nineteen hours and had just read a bad preprint, and that's the number that went in the memo.

  Someone on my team pointed me at van Fraassen's Reflection principle — roughly, your credence now that your future credence in something will be x should itself be x — and said it's an argument for trusting your future self. I don't think it's that clean, and I suspect the textbook version doesn't even cover our situation, since our "future self" is very often literally a different analyst who wasn't in the room for any of this.

  So: write me a procedure I can actually run in fifteen minutes when a lock-or-defer call comes up. Ordered questions, and for each one what counts as a real answer (not "consider how the situation may have changed" — that's not a question, that's a shrug). Where does it come out at lock, where at defer, and where does it have to stop and hand the call to me because it's a values question or a question about my own team that no rule can settle? Keep whatever genuinely survives of Reflection when you make it operational, and say out loud which of your steps are judgment calls wearing a procedural costume. I also want a straight answer on the substitution problem: does the principle have any grip at all when the future credence is going to be held by somebody else, or is that a different animal entirely that you'd be smuggling in under the same name?

  Then run it on three cases:

  1. We're forecasting whether a respiratory outbreak crosses a reporting threshold within six weeks. The on-call reviser will have two weeks of case data we don't have, and will also be sleep-deprived.
  2. Same kind of forecast, but the revision window falls after a legislator has gone public with a position on it — and we know from our own history that publicity moves our people.
  3. A junior analyst is asking us to pre-commit right now to not revising their number downward later, because they don't trust themselves to resist softening bad news when the commissioner is in the room.

  Give me the answer for each, including whichever one my team is going to hate. And end with what the procedure flat out cannot settle, plus the situations where it will systematically get it wrong — I'd rather know the failure mode in advance than discover it in a memo.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** 5-person forecasting cell in a state public health agency. High stakes, fast turnaround (Deputy Commissioner acts within a day).
      *   **The Problem:** Lock vs. Defer decision on forecasts.
          *   Lock risk: New data arrives, forecast is wrong/stale, on-call can't fix it.
          *   Defer risk: On-call analyst is compromised (sleep-deprived, influenced by bad preprints, pressured by politics).
      *   **Theoretical Hook:** van Fraassen's Reflection Principle (trust your future credence).
      *   **The User's Skepticism:** Reflection assumes the "future self" is the same rational agent. Here, it's often a *different* analyst under *different* conditions.
      *   **Deliverables:**
          1.  A 15-minute operational procedure (ordered questions, real answers, lock/defer/hand-off criteria).
          2.  Explicit identification of "judgment calls wearing procedural costumes."
          3.  A straight answer on the "Substitution Problem" (does Reflection apply to *other* people?).
          4.  Application to three specific cases (including the unpopular answer).
          5.  Limitations/Failure modes of the procedure.

  2.  **Analyze the Reflection Principle & The Substitution Problem:**

      *   *Van Fraassen's Reflection:* $P_{now}(A | P_{later}(A) = x) = x$. Basically, if you expect your future self to believe $x$, you should believe $x$ now. It relies on the assumption that you view your future self as a rational updater of *your* current information.
      *   *The Substitution Problem:* Does this apply to *other* people? Strictly speaking, no. Reflection is about diachronic consistency of a single agent. Applying it to a colleague is an *analogy*, not the principle itself. It requires trusting the *process* and the *colleague's adherence to that process*, not their raw cognition.
      *   *Operationalizing:* We need to shift from "Trust your future self" to "Trust the future *process*." If the process degrades (sleep, pressure, bad data), Reflection fails.

  3.  **Drafting the Procedure (The "Lock/Defer Protocol"):**

      *   *Constraint:* Must take < 15 minutes. Must have binary/threshold answers, not vague contemplation.
      *   *Structure:* Needs to filter based on Information, State of Agent, and Political/Operational Context.
      *   *Step 1: Information Asymmetry.* Will the future person know something *material* we don't?
      *   *Step 2: Agent State.* Is the future person operating under degraded conditions (sleep, stress, isolation)?
      *   *Step 3: Process Integrity.* Is there a guardrail against the specific risks identified in Step 2?
      *   *Step 4: Cost of Error.* What hurts more: False Stability or False Precision?
      *   *Decision Logic:* Lock if Info is stable AND Agent is risky. Defer if Info is volatile AND Agent is protected. Hand-off if values are at stake.

  4.  **Addressing the "Judgment Calls in Costume":**

      *   I need to be honest. Any procedure requires human interpretation. Defining "material" data is a judgment call. Defining "degraded" is a judgment call. I need to flag these.

  5.  **Addressing the Substitution Problem:**

      *   Direct answer: Reflection *proper* does not apply to others. It's an inter-subjective trust claim, not a logical constraint. It only works if the "other" is functioning as a proxy for your own rational updating. If they are a different epistemic agent with different incentives, Reflection is the wrong tool; *Principal-Agent* theory is the right tool.

  6.  **Running the Cases:**

      *   *Case 1 (Respiratory/Sleep/Data):* Future has better data (Pro-Defer) but is sleep-deprived (Pro-Lock).
          *   *Analysis:* Data trumps fatigue *if* the fatigue leads to random error, but if fatigue leads to systematic error (panic), Lock. However, in public health, missing a threshold due to stale data is usually worse than a noisy revision.
          *   *Verdict:* Defer, *but* with a guardrail (call a second person). If no guardrail, Lock. Let's push for the "hate" answer: If the sleep deprivation is severe (19 hours mentioned in prompt), the cognitive risk is too high. Lock.
      *   *Case 2 (Legislator/Publicity):* Future revision happens after political pressure.
          *   *Analysis:* This is bias, not updating. Reflection fails completely here because the future credence isn't driven by evidence.
          *   *Verdict:* Lock. The future "self" is compromised by external incentive.
      *   *Case 3 (Junior Analyst/Softening):* Pre-commit to *not* revising downward.
          *   *Analysis:* This is asking to break the forecasting integrity to protect the analyst's spine.
          *   *Verdict:* Reject. This is a values/process integrity issue. The procedure can't solve "courage." Hand-off to Lead (User).

  7.  **Refining the Procedure (Iterative Polish):**

      *   Make the questions Yes/No or Threshold-based.
      *   Ensure the "Hand-off" condition is clear for when the procedure hits a value wall.
      *   Clarify the "Reflection" adaptation: It's about *Process Continuity*, not *Self-Continuity*.

  8.  **Final Review against Constraints:**

      *   15 minutes? Yes, 5 questions.
      *   Real answers? Yes, specific criteria.
      *   Substitution problem addressed? Yes.
      *   Three cases run? Yes.
      *   Failure modes listed? Yes.
      *   Tone: Professional, direct, acknowledging the high-stakes reality (no academic fluff).

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Initial thought:* Maybe Defer for Case 1 because data is king.
      *   *Correction:* The prompt specifically mentions the "19 hours awake" scenario leading to bad calls. If the on-call person is *known* to be sleep-deprived, the risk of a "bad preprint" style error is high. The "hate" answer is likely Locking when they want flexibility, or Deferring when they want safety. In Case 1, the team might want to Defer to get the new data. The "hate" answer is Locking because human reliability < data value in that specific fatigue state. I will argue for Lock *unless* a verification step exists.
      *   *Wait, looking at Case 3:* The junior analyst wants to pre-commit to *not* softening. That's actually a request for a Lock to prevent *bias*. But it's a request for a specific *directional* lock (no downward revision). That's corruption. The answer must be "No."
      *   *Reflection on Reflection:* I need to be very clear that van Fraassen is about *your* future beliefs. Applying it to a colleague is a category error unless you view the team as a single "group agent." I should clarify that distinction.

  10. **Finalizing the Output Structure:**
      *   Part 1: The Substitution Problem (Get the theory out of the way).
      *   Part 2: The 15-Minute Protocol (The core tool).
      *   Part 3: The "Costume" Disclosure (Honesty about limitations).
      *   Part 4: Case Applications.
      *   Part 5: Failure Modes.

      *(Self-Correction on Case 1)*: If I say Lock, they miss the data. If I say Defer, they risk the fatigue error. The prompt says "One time we locked... wasn't allowed to move." "Another time we left it open... revision made by someone awake 19 hours." The prompt asks for the answer the team will *hate*. In Case 1, analysts usually want to use new data. Telling them to Lock because the human element is unreliable will be unpopular. I will recommend Lock with a specific caveat.

      *(Self-Correction on Case 3)*: The analyst wants to prevent *themselves* from caving. This is a Ulysses Pact. But it's asymmetric (no downward revision). That biases the forecast. The answer is "Hand-off/No."

      *(Refining the Protocol)*: Make sure the "Hand-off" trigger is distinct from Lock/Defer.

      *(Refining Reflection)*: Be precise. It's not Reflection; it's *Delegated Epistemic Authority*.

      Let's write it.cw
answer: |-
  ### Part 1: The Substitution Problem (Straight Answer)

  **Does van Fraassen's Reflection Principle apply when the future credence is held by someone else?**

  **No.** Not strictly.

  Reflection is a diachronic constraint on a *single* rational agent. It says: *If you expect your future self to update on evidence according to your current rules, you should believe now what you expect to believe then.*

  When you hand off to a colleague, you are not dealing with your future self; you are dealing with a **Principal-Agent problem**. Your colleague has the same goal (accurate forecasts) but a different brain, different stressors, and potentially different risk tolerances.

  **Where it has grip:** It holds only if your team operates as a **single epistemic unit**. This requires two conditions:
  1.  **Shared Priors:** You all weigh evidence the same way.
  2.  **Shared Protocol:** You all update according to the same rigid rules, regardless of who is typing.

  If your colleague is sleep-deprived, reading bad preprints, or facing political pressure, they are not acting as your "future self." They are acting as a *degraded proxy*. In those cases, Reflection is dangerous. You should not trust a future credence that you know will be formed under conditions you currently judge to be sub-optimal.

  **Operational Translation:** Do not ask, "Will I trust my future self?" Ask, "Is the *process* that will generate the future number robust enough to replicate my current judgment?"

  ---

  ### Part 2: The 15-Minute Lock/Defer Protocol

  This procedure is designed to be run by the senior analyst on shift. It requires binary or threshold answers. If you cannot answer a question, you must escalate.

  **Step 1: The Information Horizon**
  *Question:* Will the on-call analyst have access to **material** data (lab confirmations, hospitalization counts) within the revision window that is *impossible* to model or estimate from current trends?
  *   **Yes:** Mark **Volatile**.
  *   **No:** Mark **Stable**.
  *   *Definition of Material:* Data that would change the forecast probability by >15% or cross a decision threshold (e.g., the reporting line mentioned in Case 1).

  **Step 2: The Human Factor**
  *Question:* Is the on-call analyst currently scheduled to work >16 consecutive hours, or are they the sole decision-maker without a secondary verifier available?
  *   **Yes:** Mark **Degraded**.
  *   **No:** Mark **Standard**.

  **Step 3: The Political/External Pressure**
  *Question:* Is there a known external event (press conference, legislative vote, public statement) scheduled between now and the revision deadline that creates an incentive to move the number in a specific direction?
  *   **Yes:** Mark **Compromised**.
  *   **No:** Mark **Clean**.

  **Step 4: The Cost of Error**
  *Question:* If the forecast is wrong, which error is worse?
  *   **A:** False Stability (Locking a number that becomes demonstrably false with new data).
  *   **B:** False Precision (Deferring and releasing a revised number that is actually noise/error).
  *   *Instruction:* Choose one. If you choose **A**, you lean Defer. If you choose **B**, you lean Lock.

  **Step 5: The Decision Matrix**

  | Info Horizon | Human Factor | Pressure | **Decision** |
  | :--- | :--- | :--- | :--- |
  | **Stable** | Standard | Clean | **DEFER** (Low risk, high flexibility) |
  | **Stable** | Degraded | Clean | **LOCK** (Human risk > Info gain) |
  | **Volatile** | Standard | Clean | **DEFER** (Data trumps fatigue risk) |
  | **Volatile** | Degraded | Clean | **LOCK** (Human risk > Data gain)* |
  | **Any** | Any | **Compromised** | **LOCK** (Integrity risk is absolute) |

  *\*Note: In the Volatile/Degraded case, you must add a note to the Deputy Commissioner: "Forecast locked due to data latency; revision suspended to ensure verification integrity."*

  **Escalation Trigger (Hand-Off to You)**
  If the answer to Step 4 is "I don't know which error is worse" OR if Step 3 is "Compromised" but the Deputy Commissioner is demanding a revision capability, **stop**. This is no longer a forecasting question; it is a risk-tolerance or political question. Call the Lead (you).

  ---

  ### Part 3: Judgment Calls Wearing Procedural Costumes

  I am required to tell you where this procedure is faking objectivity.

  1.  **"Material Data" (Step 1):** Deciding if new data is "material" requires a model. If your team disagrees on the model, this step is a vote, not a measurement.
  2.  **"Degraded" (Step 2):** The 16-hour threshold is arbitrary. Some analysts function well at 18 hours; others crash at 14. This is a heuristic, not a physiological fact.
  3.  **"Cost of Error" (Step 4):** This is the biggest costume. Choosing between False Stability and False Precision is a **value judgment** about how the Deputy Commissioner uses the data. If they use it for resource allocation, False Stability kills. If they use it for public messaging, False Precision kills credibility. The procedure forces a binary choice on a spectrum.

  ---

  ### Part 4: Running the Cases

  #### Case 1: Respiratory Outbreak / Sleep-Deprived Reviser
  *   **Info:** Volatile (Two weeks of case data is material).
  *   **Human:** Degraded (Sleep deprivation confirmed).
  *   **Pressure:** Clean.
  *   **Cost of Error:** In public health, missing a threshold (False Stability) usually costs more than a noisy revision (False Precision).
  *   **Protocol Output:** **LOCK** (Due to Volatile/Degraded intersection).
  *   **The Answer Your Team Will Hate:** **Lock it.**
  *   **Why:** Even though the data is better, the *processor* of the data is compromised. A sleep-deprived analyst looking at new data is more likely to overfit noise or panic than a well-rested analyst looking at modeled projections. The risk of a "19-hour preprint" error outweighs the benefit of the two-week lag data.
  *   **Mitigation:** Attach a caveat: "Current projection based on data through [Date]. New data received but pending full verification due to operational constraints."

  #### Case 2: Legislator Publicity / Political Pressure
  *   **Info:** Volatile or Stable (Doesn't matter).
  *   **Human:** Standard or Degraded (Doesn't matter).
  *   **Pressure:** **Compromised** (Legislator has gone public).
  *   **Protocol Output:** **LOCK**.
  *   **Why:** Step 3 is an absolute stopper. Once publicity enters the window, the incentive structure for the on-call analyst shifts from "accuracy" to "alignment" or "defense." Reflection fails completely here because the future credence is no longer evidence-based; it is incentive-based. You cannot defer into a political storm.
  *   **Mitigation:** Lock the number and document the timestamp relative to the legislator's statement.

  #### Case 3: Junior Analyst / Pre-commitment
  *   **Request:** Pre-commit to *not* revising downward.
  *   **Protocol Output:** **HAND-OFF TO LEAD (You)**.
  *   **Why:** This violates the symmetry of the forecast. A Ulysses Pact is valid for *process* (e.g., "Don't change the number without two signatures"), but invalid for *direction* (e.g., "Don't make the news worse"). This is a request to institutionalize optimism bias.
  *   **The Hard Truth:** The procedure cannot solve courage. If the analyst knows they will cave to the Commissioner, the fix is not a locked forecast; it is removing the analyst from the room or having *you* deliver the number.
  *   **Decision:** Reject the pre-commitment. Tell the analyst: "We lock based on data integrity, not emotional resilience. If you cannot deliver the revised number, I will do it."

  ---

  ### Part 5: Failure Modes & Systematic Errors

  You asked where this will get it wrong. Here is the post-mortem in advance.

  **1. The "Black Swan" Lock**
  *   **Scenario:** You Lock because the human was Degraded (Step 2). Overnight, a new variant emerges that renders the locked model obsolete.
  *   **Failure:** The protocol prioritized *process integrity* over *situational awareness*. You will be right procedurally and wrong practically.
  *   **Fix:** There is no fix within the protocol. This requires a "Break Glass" clause where the Deputy Commissioner can override the Lock, but it must be documented as a *political override*, not a forecast revision.

  **2. The "Bureaucratic Shield"**
  *   **Scenario:** Analysts begin using the "Degraded" classification to avoid difficult revisions. They claim fatigue to Lock a number they just don't want to defend.
  *   **Failure:** The protocol becomes a shield for cowardice rather than a guard for accuracy.
  *   **Fix:** Audit the "Degraded" logs. If an analyst claims Degraded >20% of shifts, remove them from the on-call rotation.

  **3. The Reflection Trap**
  *   **Scenario:** You assume your team is a "single epistemic unit" (Part 1). They aren't. One analyst weighs hospital data heavily; another weighs testing positivity.
  *   **Failure:** You Defer expecting consistency, but the on-call analyst uses a different mental model, causing a "revision" that is actually just a disagreement.
  *   **Fix:** Standardize the model. If you cannot standardize the model, you must Lock more often.

  **4. The Value Blind Spot**
  *   **Scenario:** Step 4 (Cost of Error) is guessed wrong. You assume False Stability is worse, so you Defer. The Commissioner uses the number for a press briefing, and the Defer-to-Revision looks like incompetence.
  *   **Failure:** The forecasting cell optimized for scientific accuracy, but the agency needed political stability.
  *   **Fix:** This is why Step 4 requires your explicit input quarterly. You must calibrate "Cost of Error" based on the Commissioner's actual behavior, not your scientific ideals.

  **Final Instruction:**
  Print the Matrix. Put it on the wall. When the call comes, do not debate the philosophy. Run the five steps. If it says Hand-Off, call me. If it says Lock, lock it and let the memo take the heat. That is what you pay me for.
