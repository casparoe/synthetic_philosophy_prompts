answer: |-
  ### Part 1: The Logical Space

  To sort readers without using academic labels, we need five independent axes. These are the commitments that actually divide people when the pressure is on.

  1.  **The Residue Question:** After doing the necessary bad thing, is there anything left over? (Yes: Guilt/penance is required. No: If it was right, you're clean.)
  2.  **The Location Question:** Where does the blame sit? (Yes: On the specific person who signed off. No: On the committee, the contractor, or the code.)
  3.  **The Office Question:** Is political leadership a special moral zone? (Yes: Leaders can do things citizens can't. No: A leader is just a person with more power; the rules are the same.)
  4.  **The Mediation Question:** Does using a vendor, model, or ally change the act? (Yes: It buffers or transforms the responsibility. No: It's just a tool; you did it.)
  5.  **The Threshold Question:** Do the rules change when the stakes get high enough? (Yes: Extreme danger suspends normal rules. No: Wrong is wrong, even to save the country.)

  ### Part 2: The Instrument (10 Items)

  *Instructions for the reader: For each scenario, pick the response that matches your gut reaction. Don't overthink it.*

  **1. The Eligibility Model**
  An algorithm denies benefits to 5,000 applicants. You know the error rate is 4%, meaning 200 people are wrongly cut off. Fixing it requires shutting down the system for months. You leave it running.
  *   A. It's a tragic math problem, but I sleep fine.
  *   B. I saved the system, but I owe those 200 people a personal apology.
  *   C. The model made the call; I just manage the budget.

  **2. The Strike List**
  A private vendor provides coordinates for a strike. Their data is good but not perfect. You authorize the hit.
  *   A. If the intel was solid enough, the outcome is on the vendor, not me.
  *   B. I pulled the trigger. If civilians died, that blood is on my hands, even if it was necessary.
  *   C. The threat was big enough that normal rules about certainty don't apply.

  **3. The Statutory Bar**
  Your agency is forbidden by law from doing X. A private contractor can do X legally. You hire them to do it.
  *   A. It's a loophole, but if the law allows them, it allows me to use them.
  *   B. I'm using them to dirty my hands for me. I'm responsible for the act.
  *   C. This is why we have contractors. It separates the policy from the execution.

  **4. The Allied Detention**
  You need a suspect questioned aggressively. You can't do it. You ask an allied service to hold and question them for you.
  *   A. I didn't touch them. Their rules aren't my rules.
  *   B. I arranged it. It's my interrogation, just in a different room.
  *   C. The safety of the public makes this necessary, regardless of who does it.

  **5. The Bad Actor's Money**
  A corrupt oligarch offers to fund a campaign that will keep a worse regime out of power. You take the money.
  *   A. Money doesn't have morals. The outcome is what matters.
  *   B. I've compromised myself to save the country. I need to confess later.
  *   C. It's wrong. If I have to take dirty money to win, I shouldn't run.

  **6. The Triage Protocol**
  Before a crisis hits, you write a rule: "If resources run out, save the young first." When the crisis hits, you follow the rule rather than judging each case.
  *   A. The rule protects the doctors from having to play God.
  *   B. I wrote the rule, so I killed the older patients, not the doctors.
  *   C. In a surge, we don't have the luxury of individual moral choices.

  **7. The Suppressed Report**
  You have a true report that will cause a panic if published. You bury it.
  *   A. My job is to protect the public from harm, even from the truth.
  *   B. I lied to the public. I'm safe for now, but I've damaged my integrity.
  *   C. The public owns the information. I have no right to hide it, ever.

  **8. The Leaker**
  A subordinate leaks evidence of Program X (which you think is necessary but shady). You prosecute them.
  *   A. They broke the law. The morality of the program is separate.
  *   B. I'm punishing them to protect a secret I'm ashamed of.
  *   C. If the program was truly necessary, the leak was the greater crime.

  **9. The Ticking Clock**
  A bomb is hidden in the city. A detainee knows where it is. You authorize a method you normally forbid to get the location.
  *   A. This is the one exception. The stakes change the rules.
  *   B. It's still torture. I'm doing it, but I'm a criminal for it.
  *   C. If it works, it was the right thing to do. No apology needed.

  **10. The Black Box**
  An AI recommends a policy that harms a minority group. You can't explain *why* the AI chose it, but the data says it works. You implement it.
  *   A. If the outcome is good, the reasoning doesn't matter.
  *   B. I can't defend what I don't understand. I shouldn't have signed it.
  *   C. The system is too complex for one person to own. We all share the blame.

  ### Part 3: The Key (Leaves)

  *Instructions for the developer: Cluster responses based on the profiles below. Most readers will land near one of these eight leaves.*

  **1. The Paradox (The Dirty Hands Realist)**
  *   **Profile:** High Residue, Individual Location, Office Special.
  *   **View:** You did the right thing for the country, but you are still guilty.
  *   **Awkward Commitment:** A leader must be willing to be morally condemned for doing their job.
  *   **Bullet to Bite:** Item 2 (Strike List). They must admit blood is on their hands even if the strike was necessary.

  **2. The Dissolution (The Hard Consequentialist)**
  *   **Profile:** No Residue, Individual Location, Threshold Flexible.
  *   **View:** If the outcome is good, there is no "dirt." Guilt is just squeamishness.
  *   **Awkward Commitment:** There is no such thing as a "necessary evil," only necessary acts.
  *   **Bullet to Bite:** Item 5 (Bad Money). They must accept that taking corrupt funds is clean if the election is won.

  **3. The Threshold (The Supreme Emergency)**
  *   **Profile:** High Residue (usually), Individual Location, High Threshold.
  *   **View:** Normal rules apply until the sky falls. Then, and only then, do they suspend.
  *   **Awkward Commitment:** You must define exactly how bad "bad enough" is before you break the rules.
  *   **Bullet to Bite:** Item 9 (Ticking Clock). They must admit that without the immediate bomb, the act is unforgivable.

  **4. The Reason of State (The Machiavellian)**
  *   **Profile:** No Residue, Individual Location, Office Special.
  *   **View:** The state has its own morality. What is wrong for a citizen is right for a leader.
  *   **Awkward Commitment:** Leaders operate outside the moral law that binds everyone else.
  *   **Bullet to Bite:** Item 7 (Suppressed Report). They must defend lying to the public as a duty of office.

  **5. The Ordinary Tragedy (The Moral Consistent)**
  *   **Profile:** High Residue, Individual Location, No Office Special.
  *   **View:** Politics isn't special. If it's wrong for you, it's wrong for the President.
  *   **Awkward Commitment:** You might have to let the country suffer rather than do the "wrong" thing.
  *   **Bullet to Bite:** Item 4 (Allied Detention). They must admit that asking an ally to do it is just as bad as doing it yourself.

  **6. The Democratic Authorization (The Trustee)**
  *   **Profile:** No Residue, Collective Location, Office Special.
  *   **View:** The voters authorized the office; therefore, they own the acts of the office.
  *   **Awkward Commitment:** The leader is just a vessel; the guilt belongs to the people who elected them.
  *   **Bullet to Bite:** Item 8 (The Leaker). They must argue the public implicitly consented to the secrecy.

  **7. The Diffused Responsibility (The Bureaucrat)**
  *   **Profile:** No Residue, System Location, High Mediation.
  *   **View:** The act happened, but no single human is the author. The system did it.
  *   **Awkward Commitment:** Wrongs can occur without any wrongdoer.
  *   **Bullet to Bite:** Item 10 (Black Box). They must accept that an unexplainable algorithm can bear moral weight.

  **8. The Eliminativist (The Confusion Theorist)**
  *   **Profile:** No Residue, No Location, No Mediation.
  *   **View:** "Dirty hands" is a category error. We are describing policy trade-offs, not sins.
  *   **Awkward Commitment:** Moral language shouldn't be used in governance at all.
  *   **Bullet to Bite:** Item 1 (Eligibility Model). They must deny that denying 200 people is a moral problem, only a technical one.

  ### Part 4: Meta-Analysis for the Editor

  **1. Indistinguishable Leaves**
  My ten items cannot reliably separate **The Dissolution (2)** from **The Eliminativist (8)**. Both result in "I sleep fine." The difference is *why* (Outcome vs. Category Error).
  *   **The Fix (Item 11):** Ask a question about language. "When you sign the order, do you feel you are making a *trade-off* or committing a *violation*?" The Dissolver says "Trade-off." The Eliminativist says "Neither, I'm solving a problem."

  My ten items also struggle to separate **The Reason of State (4)** from **The Democratic Authorization (6)**. Both justify the act via the Office.
  *   **The Fix (Item 11):** Ask about the source of permission. "If the voters voted against this policy tomorrow, would you still be allowed to do it?" Reason of State says "Yes, for security." Democratic Authorization says "No, the mandate is gone."

  **2. Empty Cells in the Logical Space**
  You asked specifically about the combination: **"The act was wrong, nothing sticks to the agent, and responsibility dissolved into the system."**
  *   **Status:** This cell is **Unattractive/Unstable**, not incoherent.
  *   **Why:** It describes the "Problem of Many Hands." It is logically possible (the act is bad, the system did it, I am clean), but it is psychologically unsustainable. Humans have a strong intuition that if a wrong occurred, a human must have willed it.
  *   **Who holds it:** Technocrats often drift here, but they usually slide into *The Dissolution* (it wasn't wrong) or *The Diffused Responsibility* (we all share it) when pressed. It is vacant because it offers no path to restitution. If the system is guilty, you can't punish the system. If the agent is clean, you can't punish the agent. Justice becomes impossible.

  **3. Other Vacant Combinations**
  *   **"Office Special + Ordinary Tragedy":** Vacant because **Incoherent**. You cannot claim politics is a special moral zone while simultaneously claiming the rules are the same as ordinary life.
  *   **"High Threshold + No Residue":** Vacant because **Unattractive**. This view says "Break the rules only in emergencies, but feel no guilt about it." This looks indistinguishable from *Reason of State*, but lacks the philosophical grounding. It tends to collapse into *The Dissolution*.

  **4. Implementation Note**
  To make this interactive work, do not show the user their "score" as a number. Show them the Leaf Name and the "Awkward Commitment." The value of this instrument is not validation; it is showing the reader the cost of their own intuition. If they land on *The Paradox*, they should feel the weight of the guilt. If they land on *The Dissolution*, they should feel the coldness of the logic.
