  **Construction Notes**
  **Spec 2 & 4 (Bluff & Irrationality):** A bluff requires a reachable `WAY` branch. `has_branch` statically inspects the text; if Incumbent includes a `WAY` path, Entrant executes Line 6 (`FIRM`). Incumbent suffers disaster. Thus, bluffing is strictly dominated. Transparency eliminates bluffing as a category because the code *is* the move. Incumbent's firmness is ex post irrational (Line 2): had Entrant `FIRM`ed, Incumbent would prefer `WAY`. However, because Entrant verifies Line 7 (no `WAY` branch), Entrant yields (Line 3). The cost of irrationality is zero because the threat prevents the condition where it would be costly.

