  6.  **Final Polish:** Check against the 20-minute limit. 20 mins is roughly 2000-2500 words spoken. The draft is short, which is good, but the argument needs to be tighter. The advice should prioritize structural integrity over saving every sentence.

      *Plan:*
      1.  Acknowledge the strength of the setup (§1).
      2.  Address the 5 questions in order.
