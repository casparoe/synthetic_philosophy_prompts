      *   If I drop View 2 (Suffering is *always* tracked/earned), I save the No-Self/Compassion combo but lose the explanatory power of Karma regarding random suffering.
      *   *Best Cleanup:* Modifying View 6. The insistence that desert *requires* strict identity is the bottleneck. If desert attaches to the *causal stream* (View 4) rather than a *metaphysical ego*, View 5 works, and View 6 needs rephrasing.
      *   *Wait, actually:* The biggest tension is between View 2 (Suffering is *just*) and View 4+6 (The sufferer isn't the *doer*).
