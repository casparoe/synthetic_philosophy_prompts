      3.  *Human Punishment = Consequentialist:* Prisons only for reform/safety, never retribution/payback.
      4.  *No Permanent Self (Anatta):* Rebirth is a stream/continuation, not identical identity (candle lighting candle).
      5.  *Fairness via Continuity:* Being born into hardship due to past actions is "earned" and fair, despite View 4.
      6.  *Desert Requires Identity:* Punishment must attach to the actor. Punishing a non-actor is unjust, cosmic bookkeeping doesn't fix this.
      7.  *Compassion despite Karma:* We should relieve suffering even if it's "their karma."

  3.  **Identify Potential Conflicts:**

      *   *Conflict A: View 2 (Karma explains suffering) vs. View 7 (Relieve suffering).*
          *   *Surface:* If suffering is just/fair (View 2/5), why fix it?
