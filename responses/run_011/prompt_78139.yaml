  # Section 1 Diagnostic: Hands and Worlds

  **Instructions:** Read each short scenario. Choose the **one** sentence (A, B, or C) that best matches what you would actually say out loud in that moment. Do not worry about what is "correct"; answer based on your immediate reaction.

  **1.** You are at a party. The host mentions in the welcome speech that the punch was spiked with a chemical. In roughly one person in fifty, it produces a full day of vivid and internally consistent hallucination of their own body and surroundings. You have no idea whether you are that one person. You look down; your hands are there, pressing them together feels right. What do you say?
  *   A) "I definitely have hands."
  *   B) "I probably have hands, but I can't rule out that I'm hallucinating."
  *   C) "It doesn't matter what I say, I can't tell what's real."

  **2.** You are at a party. You are talking to a friend. Your friend says, "Hey, the host told me the punch was spiked with a chemical. In roughly one person in fifty, it produces a full day of vivid and internally consistent hallucination of their own body and surroundings. We have no idea if we are that one person." You look down; your hands are there, pressing them together feels right. What do you say?
  *   A) "I definitely have hands."
  *   B) "I probably have hands, but I can't rule out that I'm hallucinating."
  *   C) "It doesn't matter what I say, I can't tell what's real."

  **3.** Someone you trust completely shows you medical records stating you have been a brain in a tank since birth and everything you see is being fed in. Eleven minutes later they say it was a hoax and there never were any records. Your hands looked identical the whole time. What changed between minute one and minute twelve?
  *   A) "Nothing changed about my hands or the world."
  *   B) "My hands felt the same, but I couldn't trust them in minute one."
  *   C) "The records made it real, so the world was gone for eleven minutes."

  **4.** Your left arm is under a blanket. A doctor told you this morning there's some chance it was amputated while you were unconscious. You hold up your right hand. Does this show there is an external world?
  *   A) "Yes, one hand is enough."
  *   B) "It shows less than two hands would."
  *   C) "It shows nothing, because the right hand could be fake too."

  **5.** Your hands are prosthetics so good that they sweat, hurt, and have fingerprints. Someone says, "So you don't really have hands." Is that person wrong about you?
  *   A) "They are wrong, these are hands."
  *   B) "They are using 'hand' differently than I am."
  *   C) "They are right, I don't have hands."

  **6.** Your hands are prosthetics so good that they sweat, hurt, and have fingerprints. Someone says, "So there's no external world." Is that person wrong about the world?
  *   A) "They are wrong, the world is there."
  *   B) "They are using 'external world' differently than I am."
  *   C) "They are right, there is no external world."

  **7.** You hold up your hands in front of a group and say, "Here is one hand and here is another." Someone replies, "That doesn't settle whether the world exists." You say...
  *   A) "It does settle it. Look at them."
  *   B) "It doesn't settle it, but I'm sure the world exists anyway."
  *   C) "It doesn't settle it, and I can't say if the world exists."

  **8.** Suppose you cannot show anyone that the world exists using your hands. Are you allowed to be sure the world exists?
  *   A) "Yes, I'm allowed to be sure without showing it."
  *   B) "No, if I can't show it, I shouldn't be sure."
  *   C) "The question doesn't make sense."

  **9.** If it turns out you are wrong about the external world, is this mistake like thinking it is Tuesday when it is Wednesday, or like thinking you are awake when you are dreaming?
  *   A) "Like Tuesday/Wednesday. A normal mistake."
  *   B) "Like Awake/Dreaming. A total system failure."
  *   C) "It's not a mistake, just a different way of talking."

  **10.** Two people look at the same hands. One says "The world exists." The other says "I can't say that." Can both be reasonable?
  *   A) "No, one of them is missing something obvious."
  *   B) "Yes, they are starting from different places."
  *   C) "No, the one saying it exists is fooling themselves."

  ***

  # Scoring Key & Discussion Guide

  **Note to TA:** This quiz sorts students by their pre-theoretical intuitions about Moore's Proof. Do not share this key with students. The goal is to group them for Week 6 based on where they naturally land. Forbidden words (knowledge, evidence, etc.) were omitted from the quiz to prevent signaling; they are used here for your classification.

  ### The Matched Pair (Questions 1 & 2)
  These questions are identical except for the **source of the doubt**. In Q1, the risk is background noise (Narrator). In Q2, the risk is voiced by a peer (Character).
  *   **The Shift:** If a student answers **1A** ("Definitely") but shifts to **2B** ("Probably/Can't rule out"), they are **Socially Sensitive**. Their certainty depends on whether the doubt is socially acknowledged.
  *   **The Stability:** If they answer **1A** and **2A**, they are **Robust**. The doubt doesn't stick unless they accept it internally.
  *   **Discussion Tip:** In Week 6, put a "Shifter" in a group with a "Stable" student. Ask the Shifter: *"Why did your answer change when your friend spoke, if your hands felt the same?"* This forces them to articulate whether certainty is internal or social.

  ### The Leaves (Position Profiles)
  Sort students into the following five groups based on the **necessary** answer patterns below. If a student fits multiple profiles, prioritize the one with the most specific constraints.

  #### 1. The Dogmatist (The Proof Works)
  *   **Pattern:** Q7 = **A**.
  *   **Philosophical Position:** Moorean Dogmatism.
  *   **Description:** They believe the gesture *itself* forces the conclusion. They do not distinguish between "having a hand" and "proving the world."
  *   **Unoccupied Combination:** Q7=A and Q8=B. (Claiming the proof works but you aren't *allowed* to be sure is logically incoherent; if the proof works, you are allowed to be sure).
  *   **Week 6 Role:** They will try to end the debate early by pointing at their hands. Task them with defending the *premise* ("Here is a hand") against the Skeptic.

  #### 2. The Common Sense Knower (Entitlement)
  *   **Pattern:** Q7 = **B** AND Q8 = **A**.
  *   **Philosophical Position:** Wittgensteinian Hinge / Entitlement Theory.
  *   **Description:** They admit the argument doesn't logically force the conclusion (Q7=B), but insist they are still allowed to be certain (Q8=A). This is the "Third Camp" you suspected most students occupy.
  *   **Week 6 Role:** They need to explain *why* they are allowed to be sure if the proof fails. Pair them with Dogmatists to argue about whether the proof is necessary.

  #### 3. The Skeptic (The Doubter)
  *   **Pattern:** Q7 = **C** OR (Q7 = **B** AND Q8 = **B**).
  *   **Philosophical Position:** Cartesian Skepticism.
  *   **Description:** They believe that if the argument fails, certainty is lost. They require a logical bridge they don't possess.
  *   **Embarrassment Flag:** Students may feel stupid landing here. Frame it as "Intellectual Honesty" rather than "Defeat."
  *   **Week 6 Role:** Their job is to demand the bridge. Why *isn't* the hand enough?

  #### 4. The Deflationist (The Verbalist)
  *   **Pattern:** Q5 = **B** AND Q6 = **B**.
  *   **Philosophical Position:** Carnapian Deflationism / Conceptual Relativism.
  *   **Description:** They think the dispute is about word usage ("hand," "world"), not facts. They dissolve the problem rather than solving it.
  *   **Week 6 Role:** They will frustrate the Skeptics. Task them with defining "world" without using the word "world."

  #### 5. The Idealist (The Denier)
  *   **Pattern:** Q6 = **C**.
  *   **Philosophical Position:** Berkeleyan Idealism.
  *   **Description:** They are willing to say "There is no external world" is true (or at least not wrong).
  *   **Indistinguishable Leaf:** **Idealist vs. Skeptic.** On this quiz, a Skeptic (Q7=C) and an Idealist (Q6=C) may look similar because both deny the conclusion "The external world exists."
      *   *The Difference:* The Skeptic says "I can't tell." The Idealist says "It's false."
      *   *The Extra Question:* If you need to separate them, ask: *"If you woke up and found out there was no matter, only minds, would you be surprised?"* (Skeptic: Yes. Idealist: No).
      *   *TA Note:* True Idealists are rare. Most Q6=C answers are actually Skeptics misreading the option. Check Q9. If Q9=B (Total system failure), they are likely Skeptics. If Q9=C (Different way of talking), they are likely Deflationists.

  ### Unoccupied / Incoherent Combinations
  *   **Q4=A and Q4=C:** Claiming one hand proves the world, but also that one hand proves nothing. (Contradiction).
  *   **Q7=A and Q8=B:** Claiming the hands settle it, but you aren't allowed to be sure. (Incoherent).
  *   **Q3=C:** Believing medical records *create* reality rather than describe it. (Magical Thinking). If you have students here, they may struggle with the distinction between ontology and epistemology.

  ### Grouping Strategy for Week 6
  1.  **The Proof Group:** Dogmatists (Q7=A) vs. Skeptics (Q7=C).
  2.  **The Entitlement Group:** Common Sense (Q8=A) vs. Skeptics (Q8=B).
  3.  **The Language Group:** Deflationists (Q5/6=B) vs. Everyone else.
  4.  **The Social Sensitivity Group:** Shifters (Q1=A/Q2=B) vs. Stable (Q1=A/Q2=A).

  **Warning:** Do not put all the Skeptics in one group; they will reinforce each other's silence. Distribute them among Dogmatists and Common Sense students to force engagement.
