answer: |-
  The stamp lived in the centre of the desk, worn smooth by the heels of thumbs. It read CONTINUATIONS BOARD, and beneath that, in smaller type, DETERMINATION. We were not allowed to use the word *decision*. Decisions implied choice. We merely recorded what was already so.

  I worked in the Ledger Office. Next door, separated by a partition of frosted glass that blurred the shapes of moving arms, was the Blank Office. We shared the same ventilation, the same dust, and the same enabling statute. The statute granted the Continuation Allowance to citizens until they became *frail*. It did not define *frail*. It did not need to, according to my Director. The fact of frailty existed in the world like the fact of a border between two fields. Our job was to map it. The Blank Office believed the border was mist. They had a third column on their forms. We did not.

  On a Tuesday, the Director placed a box on my desk. It contained the complete determination history for District 4, every file since the office opened. He wanted me to find the frontier. He believed that if I laid them out in order of physical decline—grip strength, gait speed, cognitive score—I would find the last file on the right side of the line and the first file on the wrong side of it.

  I spent three days sorting. I laid the files across the floor, a ribbon of paper stretching from the door to the window. I aligned them by the metrics. The decline was smooth, a gentle slope into winter. Then, I found the pair.

  File 8940: Mrs. H. Grip strength 14kg. Gait speed 0.9m/s. Determination: Not Frail. Benefit Continued.
  File 8941: Mr. J. Grip strength 14kg. Gait speed 0.9m/s. Determination: Frail. Benefit Ceased.

  They were adjacent in the sequence. They were identical in the data. There was no typo, no missing page, no hidden variable. I sat on the floor among the paper. According to the Ledger doctrine, one of them was misfiled. One of them sat on the wrong side of the fact. But I could not say which. It was not that I lacked information. I had everything there was to have. It was that my method of knowing relied on distinction, and here there was none. To say Mrs. H was safe was to say Mr. J should be safe. To say Mr. J was frail was to say Mrs. H must be frail. The evidence licensed neither statement. It was a structural silence. I felt a physical nausea, a vertigo where the floor should have been solid. I could not stamp either file. To stamp one was to lie about the other. I left them on the floor and went to the washroom to splash water on my face.

  When I returned, a man in a grey suit was sitting in the visitor's chair. He was not from Personnel. He had a notebook open on his knees.

  "I hear you found the edge," he said.

  "I found a pair," I said. I did not sit.

  "I'm offering a wager," he said. He took a hundred dollars from his pocket and laid it on the desk. "I bet you that for any claimant in that box, either she is frail or she is not frail. I put up the money. You put up nothing. You just sign here." He slid a slip of paper toward me. It affirmed the logical truth of the disjunction.

  I looked at the money. In the Ledger Office, we believed the statement was true because one side of it corresponded to reality. In the Blank Office, they believed the statement was true because the logic held even if neither side corresponded to reality. If I took the bet, I was accepting the money for a truth that cost me nothing to affirm.

  "If I take this," I said, "do I agree with you?"

  "You agree that the statement holds," he said.

  "But why?" I asked. "Do I hold it because there is a fact I cannot see? Or because the fact doesn't matter?"

  He smiled. "It vindicates the logic. That is all."

  I realized then that taking the wager vindicated neither office. It vindicated the system that allowed us to speak of truth without consequence. The Ledger Office required me to find the fact, even if I couldn't. The Blank Office allowed me to ignore the fact, provided I kept the column blank. This bet allowed me to profit from the uncertainty without resolving it. It was a wager on our own irrelevance. I pushed the money back. "We don't bet on the files," I said. "We process them."

  He put the money away. "Someone has to process 8941," he said. "The budget closes on Friday."

  He left. I looked at the files on the floor. The budget did close on Friday. The Ledger Office could not leave a file unstamped. To leave it blank was to work for the other side of the glass. I had to choose. I had to pretend I knew what I could not know.

  I called in Mrs. Aris. Her file was 8941. She was sixty-eight. She wore a coat that was too thin for the season, buttoned incorrectly at the collar. She sat in the chair where the man in the grey suit had been.

  "Mrs. Aris," I said. I held the letter. It was standard typeface, standard weight. "The Board has reviewed your continuation."

  She nodded. She did not look at the letter. She looked at my hands. "My sister said the rules changed."

  "The statute remains the same," I said. "The determination is that you have crossed the threshold."

  "Threshold," she said. She tested the word. "Is there a number? Is there a weight?"

  "There are metrics," I said. I could not tell her about Mr. J. I could not tell her that her neighbour with the same hands had kept his allowance. I could not tell her that I was guessing. To tell her that would be to admit the Ledger was a fiction. To tell her that the Blank Office would have left it open would be to admit she might wait forever for an answer that would not come.

  "If I am over the line," she said, "where is the line?"

  "It is in the statute," I said.

  "And who drew it?"

  "We record it," I said.

  She took the letter. She did not open it. She knew what it said. The benefit would stop. She was not frail enough to qualify for the Care Supplement, which required a doctor's certification of inability to walk. She was only frail enough to lose the Continuation Allowance, which required only the Board's say-so. She was in the gap. The Ledger Office closed the gap by forcing her out of it. The Blank Office would have kept her in the gap, paying her nothing, deciding nothing, letting her starve in the uncertainty.

  Both offices cost her the same amount. One took her money with a lie of precision. The other would have taken her money with a truth of silence.

  "Will I get it back?" she asked. "If I get stronger?"

  "The determination is current," I said. "You may reapply."

  She stood up. She buttoned her coat correctly this time. "You look tired," she said.

  "The work is detailed," I said.

  "It looks heavy," she said. She touched the stamp on my desk. Her finger hovered over the ink pad. She did not press it. She turned and walked to the door.

  I watched her go. I picked up File 8941. I picked up the stamp. I pressed it down. The sound was dry, final. It did not sound like truth. It sounded like wood on paper. I placed the file in the out-tray. It joined the others, a stack of certainties built on a foundation I could not see. I looked at the partition wall. Through the frosted glass, I saw a shadow move in the Blank Office. They were opening a new column. I picked up the next file. I did not look at the metrics. I simply reached for the stamp.

  ***

  **Craft Note**

  The Ledger Office's epistemicism is carried by the **adjacent pair scene**. The machinery here is the *identical data* yielding *different outcomes*. This forces the narrator to feel the "vertigo" of knowing a fact exists but being unable to access it via evidence. The Blank Office's supervaluationism is carried by the **wager**. The machinery is the *disjunction* ("Frail or Not Frail"). Both offices accept the disjunction as true, but for different metaphysical reasons. The wager highlights that logical consistency survives even when factual determination fails.

  The story risks misstating the Blank Office in the ending. By suggesting the Blank Office would let her "starve in uncertainty," it paints their indeterminacy as negligence rather than philosophical honesty. A partisan of the Blank view would object that leaving the column blank is the only ethical response to a gap, whereas the Ledger's forced stamp is the actual violence. The story frames the Blank Office's inaction as a cost equal to the Ledger's action, which privileges the Ledger's need for closure.

  If cut to 1,000 words, I would sacrifice **Scene 2 (The Wager)**. While it clarifies the logical stakes of the two doctrines, the emotional core lies in the Clerk's vertigo (Scene 1) and the Claimant's loss (Scene 3). Removing the wager simplifies the philosophical conflict but preserves the human cost, which is the collection's primary focus. The reader would lose the explicit comparison of the offices' logical structures, but the procedural difference (stamp vs. blank) would remain implied in the climax.
