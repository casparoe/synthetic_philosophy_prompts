answer: |-
  # Spec: Requirements for Resolving Consequentialist Cluelessness
  **To:** Investment Committee
  **From:** Strategy Desk
  **Subject:** Decision Criteria for Five-Year Allocation

  You are asking for a filter to separate workable decision frameworks from philosophical hand-waving. Below is the spec. I have divided requirements into **Non-Negotiables** (fail these, and the framework is useless for us) and **Negotiables** (nice to have, but often where camps dig in).

  I have also ruled on your three "overreach" candidates and addressed your hypothesis about the "three problems."

  ---

  ## Part I: The Desiderata

  ### 1. The Action-Guidance Requirement (Non-Negotiable)
  **The Requirement:** The framework must yield a comparative ranking of at least two distinct allocation strategies available to the fund, even under conditions of radical uncertainty.
  **The Case:** We are not writing a paper; we are moving capital. A philosophical solution that concludes "rational agents must suspend judgment" is a correct description of the epistemic trap but a failure as a decision procedure. If the framework cannot distinguish between Option A and Option B, it dissolves the board's fiduciary duty.
  **Status:** **Hard Constraint.** For a theoretical ethicist, "suspension of judgment" might be a valid output. For a fund, it is a bug.

  ### 2. The Non-Arbitrariness Requirement (Non-Negotiable)
  **The Requirement:** Any truncation of the time horizon or discounting of future effects must be justified by a principled limit (e.g., physical decoherence, probability decay below a threshold), not by administrative convenience.
  **The Case:** This addresses your colleague's "butterfly effect" objection. If we ignore effects after 2050 simply because "that's our strategy horizon," we are admitting our strategy is morally blind, not morally solved. The line between "consequences that count" and "noise" cannot be drawn at the boundary of our budget cycle.
  **Status:** **Hard Constraint.** This is where most practical fixes die. They solve cluelessness by ignoring the future, which is an admission of defeat, not a solution.

  ### 3. The Convergence Requirement (Non-Negotiable)
  **The Requirement:** The framework must explain why the aggregate value of an action is treated as a well-defined number rather than an undefined or order-dependent sum.
  **The Case:** This addresses your category (c). If long-term effects ripple indefinitely, we are dealing with infinite series. In mathematics, a conditionally convergent series can sum to any value depending on the order of addition. If the "value of the future" behaves like this, Expected Value (EV) maximization is mathematically incoherent. A solution must either prove convergence (value decays to zero) or justify a specific ordering principle (e.g., time-discounting) that makes the sum stable.
  **Status:** **Hard Constraint.** If the total value is undefined, you cannot maximize it.

  ### 4. The Sensitivity Requirement (Negotiable)
  **The Requirement:** Small changes in empirical evidence should not cause wild swings in the recommended allocation.
  **The Case:** This is a stability check. If a new climate paper shifts our "optimal" strategy from 100% adaptation to 100% mitigation, the framework is too brittle for real-world noise.
  **Status:** **Soft Constraint.** Desirable for risk management, but some high-upside strategies are inherently brittle.

  ### 5. The Distinctiveness Requirement (Overreach)
  **The Requirement:** The fix must be unique to consequentialism.
  **The Case:** You suspected this was overreach. You are right. Cluelessness arises whenever outcomes matter. A deontologist who cares whether a constraint *actually* prevents harm faces the same epistemic wall. Demanding a solution unique to consequentialism is asking for a category error.
  **Status:** **Reject.** Ignore any proposal that claims this is a feature.

  ---

  ## Part II: Ruling on Your Overreach Candidates

  1.  **Demand for Determinate Guidance:**
      *   **Verdict:** **Non-Negotiable for Us, Debatable for Theory.**
      *   **Reasoning:** Academic philosophers can afford to say "morality is silent here." We cannot. If you are signing off on a strategy, you need a framework that forces a choice. However, be aware: demanding this often forces the framework to become *subjective* (what we *believe* is best) rather than *objective* (what *is* best). That is a trade-off, not a bug.

  2.  **Demand for Non-Ad-Hoc Line-Drawing:**
      *   **Verdict:** **Non-Negotiable.**
      *   **Reasoning:** This is the integrity check. If the solution is "ignore anything past 50 years," ask *why*. If the answer is "because we can't predict past 50 years," that is an epistemic limit, not a moral one. It solves the calculation problem by changing the moral question. That is unacceptable for a fund claiming to solve long-term problems.

  3.  **Demand for Distinctively Consequentialist Availability:**
      *   **Verdict:** **Overreach.**
      *   **Reasoning:** As noted above. Cluelessness is a problem of *knowledge and causality*, not just value theory. Discard this criterion immediately.

  ---

  ## Part III: The "Three Problems" Hypothesis

  Your intuition is correct. Cluelessness is not one problem; it is a stack. Most "solutions" only fix the top layer.

  *   **(a) Plain Ignorance (Epistemic):** We don't know the probabilities.
      *   *Fixable by:* Evidence-relative norms, Bayesian updating.
  *   **(b) No Comparison Set (Modal):** We don't know which possible worlds to compare against.
      *   *Fixable by:* Restricting to "nearest possible worlds," but this risks ignoring black swans.
  *   **(c) Indeterminate Totals (Metaphysical/Mathematical):** The sum is undefined.
      *   *Verdict:* **This is real.** It is the "Infinite Ethics" problem (Vallentyne, Kagan, etc.). If the future is infinite and value does not decay sufficiently fast, the sum diverges. If it oscillates, it has no limit. If it is conditionally convergent, the value depends on the spacetime ordering.
      *   **Requirement:** Any solution **must** address (c). Most do not. They assume a finite sum exists and we just don't know it. If the sum *cannot* exist, EV reasoning collapses.
      *   **The Fix:** You must adopt a principle that forces convergence. Usually, this is **Discounting** (future value counts less purely due to time) or **Finite Horizon** (the world ends or value ceases). Without one of these, (c) breaks the math.

  ---

  ## Part IV: The Impossibility Result

  **Flag:** The following three requirements are **Jointly Unsatisfiable**. You must drop one.

  1.  **Maximize Expected Value:** You must choose the option with the highest probable good.
  2.  **Infinite/Unbounded Scope:** You must count all future consequences without arbitrary truncation.
  3.  **No Arbitrary Truncation:** You cannot use ad-hoc time limits to make the math work.

  **Why:** If you accept (2) and (3), you face Problem (c) (Indeterminate Totals). The EV is undefined. You cannot maximize an undefined number. Therefore, you cannot satisfy (1).
  **The Trade-off:** To keep (1) and (2), you must accept arbitrary truncation (drop 3). To keep (1) and (3), you must accept a finite future (drop 2). To keep (2) and (3), you must abandon EV maximization (drop 1).

  **The Killer Requirement:** **Non-Arbitrary Line-Drawing (Requirement 2).**
  This kills the most fixes on the market. Almost every practical solution to cluelessness relies on truncating the future (e.g., "we only count effects within 100 years"). This solves the math but violates the Non-Arbitrariness requirement. It admits that the strategy is blind to the very effects the "butterfly effect" colleague is worried about.

  ---

  ## Part V: Evaluation of Response Families

  Use this table to interrogate the proposals in your Slack.

  | Response Family | Meets Action-Guidance? | Meets Non-Arbitrariness? | Solves Indeterminate Totals (c)? | Verdict for Fund |
  | :--- | :--- | :--- | :--- | :--- |
  | **Evidence-Relative / Subjective-Ought** | **Yes** (Pick what looks best) | **No** (Ignores actual long-term effects) | **No** (Assumes sum exists) | **Usable but risky.** Good for liability, bad for impact. |
  | **Rule- / Practice-Level** | **Yes** (Follow the rule) | **Mixed** (Depends on rule justification) | **No** (Pushes problem to rule selection) | **Stable.** Good for coordination, risks rigidity. |
  | **Nearby Worlds / Truncation** | **Yes** | **No** (Inherently arbitrary cutoff) | **Yes** (By fiat) | **Dishonest.** Solves math by lying about scope. |
  | **Robustness / Maximin** | **Yes** (Avoid worst case) | **Yes** (Focuses on known risks) | **Yes** (Ignores infinite upside/downside) | **Conservative.** Good for risk mgmt, misses upside. |
  | **Concession (Blameless Wrong)** | **No** (Suspends judgment) | **Yes** (Acknowledges limits) | **Yes** (Admits math fails) | **Useless.** Philosophically honest, operationally dead. |

  ### Recommendation for the Vote
  Do not look for a "true" solution. Look for the **least dishonest trade-off**.

  1.  If you prioritize **fiduciary safety**, choose **Robustness/Maximin**. It satisfies Action-Guidance and avoids the Indeterminate Totals trap by ignoring the far tail. It violates the "maximize good" spirit but keeps you solvent.
  2.  If you prioritize **impact claims**, choose **Truncation with Discounting**. You must explicitly vote to adopt a discount rate (e.g., 5% per annum). This mathematically resolves the Indeterminate Totals problem (Requirement 3) and allows Action-Guidance (Requirement 1). It violates Non-Arbitrariness (Requirement 2), but it is the only way to make the math converge without lying about the horizon.

  **Final Note:** The "butterfly effect" colleague is right about the metaphysics but wrong about the decision procedure. The "robustness" colleague is right about the procedure but glosses over the metaphysics. Your job is to pick which sin is venial. I recommend adopting a **Discount Rate**. It is the only mathematical tool that turns an infinite, conditionally convergent series into a finite, comparable number. It is arbitrary, but it is *explicitly* arbitrary, which is better than implicitly arbitrary.
