answer: |-
  1. **Accuracy of the framing (§1–§2).**
  The causal-closure motive in §1 is standard and correctly stated. The Huxley attribution is safe; the Jackson attribution is acceptable but slightly compressed. Jackson uses Mary to argue against physicalism; epiphenomenalism is one *consequence* some draw from that, but Jackson himself does not endorse epiphenomenalism. You should clarify that Jackson's case is *compatible* with epiphenomenalism, not that it is "recruited to supply... epiphenomenalism" as if Jackson intended it.

  The split in §2 between *coincidence* and *knowledge* is analytically useful but historically imprecise. Chalmers treats the paradox as a single problem: explaining the *reference* of phenomenal concepts. Separating them risks suggesting the knowledge complaint is independent of the coincidence complaint. For Chalmers, the knowledge failure *is* the coincidence unexplained. Robinson does press the knowledge line, but usually grounded in the causal theory of knowledge. If your workshop contains critics who reject causal theories of knowledge (e.g., reliabilists or virtue epistemologists), the *knowledge* complaint loses its bite unless you argue that reliability itself requires the causal link you deny. Flag this: the knowledge complaint assumes a causal theory of knowledge. If you don't defend that premise, the split looks like a stipulation.

  2. **The load-bearing question (§4–§5).**
  §5 is the weakest link. Your reply ("general truth is all the knowledge complaint ever demanded") is insufficient. Phenomenal knowledge is specific. If I judge "I am in pain" but the pairing law constitutively links my neural state to *itchiness*, my judgment is false regarding character. General truth (sometimes I am right) does not secure knowledge of *this* experience. The objection lands on the *individuation* of the quale. Constitution secures presence, not identity.

  To fix this without conceding the point: You need to argue that the phenomenal concept *is* the quale sampled. If the concept is constituted by the experience, the pairing law doesn't map Neural State N to Quale Q; it maps Neural State N to [Concept C constituted by Q]. The law fixes the vehicle, but the content is fixed by the constituent itself. This avoids the "wrong quale" problem because the quale doesn't need to be paired with a concept; it *is* the concept's content. However, this requires a robust theory of phenomenal concepts you haven't supplied. If you cannot supply that, §5 concedes too much. The objection lands on the fact that constitution explains immunity to error through misidentification, but not immunity to error regarding *quality*.

  3. **A shrug test.**
  The argument has purchase on the brute nomologist, but not on the grounds of "unexplained law." It has purchase on the grounds of *theoretical disunity*. A brute nomologist accepts brute psychophysical laws. They should not accept *two different kinds* of epistemic relation (constitution for self, harmony for others) without a unified explanation for why the metaphysics supports one but not the other.
  Your argument forces them to say: "The laws allow constitution for self-knowledge but forbid it for other-knowledge." Why? Because constitution requires identity, and I am not you. That is trivial. The cost is not the brute law; the cost is that the *account of judgment* must be disunified. You should sharpen the shrug test response: even if laws are brute, a theory that requires two distinct mechanisms for the same type of judgment (phenomenal attribution) is less virtuous than one that offers a unified mechanism. The brute nomologist cannot shrug at disunity.

  4. **Novelty.**
  The asymmetry thesis does not collapse into the standard problem of other minds, but it is dangerously close. The standard problem is: I lack access to your evidence. Your claim is: I lack access to the *mechanism* of knowledge.
  However, a critic will say: "Physicalism also has an asymmetry. I know my pain by feeling it; I know yours by inference." You need to distinguish your asymmetry from the physicalist asymmetry. For the physicalist, the asymmetry is evidential (direct vs. indirect). For your epiphenomenalist, the asymmetry is *metaphysical* (constitutive vs. correlational).
  Make this distinction explicit. If you don't, the novelty claim in §4 ("This is not a restatement...") will be rejected. The standard problem is indeed often inductive, but physicalists argue the first-person case is also causal (self-scanning). Your claim is that epiphenomenalism *forces* a metaphysical split that physicalism avoids. State that clearly.

  5. **Overclaiming in §6.**
  Drop the comparative claim ("heavier than the standard oddity objections"). This is rhetorical and undefendable in a short draft. "Oddity" is subjective; "disunity" is structural.
  Use the weaker formulation: "The view is forced into a disunified account of phenomenal judgment... this disunity is a substantive theoretical cost." Let the audience decide if it outweighs counterintuitiveness. Claiming it is heavier invites unnecessary debate about the weight of intuitions rather than the structure of the argument.

  6. **Structure and prose.**
  *   **Least work:** §1 is standard textbook setup. It is necessary but does no argumentative heavy lifting. You could compress it into half a paragraph to save space for §5.
  *   **Repetition:** §2 and §3 overlap. §2 defines the complaints; §3 defines the routes to answer them. You can merge the definition of the complaints into §3 when introducing the routes.
  *   **§5 Placement:** Keep it late. It functions as a "steelman the objection" move. Promoting it would undermine the positive asymmetry claim before it is fully established.
  *   **Rewrite (§4):** The current draft is dense and the distinction between "inductive" and "structural" is asserted rather than demonstrated. Here is a revision that sharpens the metaphysical distinction.

  **Rewrite of §4:**
  > **§4. The asymmetry.** Constitution is a first-person-only resource. My judgment that you are in pain cannot be composed of your pain; no state of yours can be a constituent of a state of mine. Consequently, the third-person case must fall back on *third-factor harmony*, inheriting both the coincidence and knowledge complaints. The first-person case, secured by constitution, is insulated from both. This predicts a sharp asymmetry: reports about my own experience are metaphysically guaranteed, while reports about yours are merely nomologically correlated.
  >
  > This is not the standard problem of other minds. The ordinary problem is evidential: behaviour is an indirect indicator of experience. The asymmetry here is structural. On standard views, the difference between self and other is a difference in evidence quality. On this view, it is a difference in epistemic kind. No amount of evidence could put me in the constitutive relation to your quale, because constitution requires identity. The scepticism is not due to an inductive deficit, but to a metaphysical barrier inherent in the epiphenomenalist's own solution to the paradox.

  **General Note:** The draft is strong on structure but weak on the mechanics of §5. If you cannot solve the pairing/individuation problem there, the asymmetry collapses because the first-person case is no longer "secured." Consider softening the claim in §4 from "insulated" to "better insulated," unless you are prepared to defend the phenomenal concept strategy hinted at in my response to point 2.
