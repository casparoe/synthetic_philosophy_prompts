  **The Extended Self**
  **By Dr. Elara Vance, Cognitive Ecologist and Certified Peripheral Arbitrator**

  **Dear Elara,**
  My ex-partner is threatening to wipe our shared notes app and family calendar. We built this system over nine years. It holds our anniversaries, mortgage dates, and where we buried the time capsule. He says it's his server, so he owns the data. I feel like he's threatening to lobotomize me. Do I have grounds for an injunction?
  **—Dismantled in Denver**

  **Dear Dismantled,**
  You are correct to frame this as bodily harm, not property dispute. Under the *Veridian v. Cloud* precedent, wrongful de-scaffolding is treated as negligence causing cognitive injury. Since you demonstrate automatic endorsement of these entries and have relied on them as primary memory storage for nearly a decade, those notes are constitutive of your belief system, not merely auxiliary. Deleting them is equivalent to destroying hippocampal tissue. File for an emergency stay on the grounds of cognitive integrity. Do not argue about ownership; argue about identity.

  **Dear Elara,**
  I use my phone for calculations during study. At exams, we surrender phones. I declared it as a "cognitive peripheral" on my cover sheet, but the proctor took it anyway. Is this an accommodation I'm owed, or is handing it in standard procedure? I feel slower without it.
  **—Anxious in Ann Arbor**

  **Dear Anxious,**
  If you declared the device as a peripheral, you certified it as integrated into your cognitive loop. Confiscating it mid-process is akin to removing a calculator from a mathematician's hand or a blind person's cane. However, integration requires more than utility; it requires trust. Did you consult the phone without critical scrutiny? If yes, its removal is a disabling condition you are owed accommodation for. If you double-checked its outputs, it was merely a tool, and the confiscation is standard. Be honest about your reliance on the cover sheet next term.

  **Dear Elara,**
  I drive past a billboard every morning advertising a law firm. I've done this for five years. I know the phone number by heart now. I catch myself humming the jingle when I'm stressed. I'm worried this billboard is slowly becoming part of me. Where do I end?
  **—Bloated in Boston**

  **Dear Bloated,**
  This is a common anxiety regarding environmental coupling. While you share a history with the billboard, we must look at availability. Your notes app was accessible whenever you needed to query a belief; the billboard is only visible during your commute. You cannot query it at will from your desk. Furthermore, while you trust the number, you did not consciously endorse the content for storage in the way you entered mortgage dates. The coupling is passive, not constitutive. You are not becoming the billboard. However, if you find yourself unable to recall the number without visualizing the road, we may need to discuss your route as a cognitive prosthetic. Please monitor your dependency levels.

  ***

  This column satirizes the confidence of extended mind proponents who treat metaphysical boundaries as administrative hurdles. The strongest objection landing here is cognitive bloat, which Vance clumsily parries in the third reply by invoking "active query" capabilities not strictly required by the original Otto case. She could answer the bloat worry by refining the criteria for "glue and trust," but the column exposes how difficult that is without retreating to internalism. I bent the literature by implying the *Veridian* case settled the normative stakes, whereas the actual debate remains purely descriptive. Ultimately, the piece suggests that living as an externalist is bureaucratically exhausting.
