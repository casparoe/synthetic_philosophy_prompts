      *   **Infinitism:**
          *   *Phil:* Justification is an infinite non-repeating chain. No base, no circle.
          *   *CS:* An infinite dependency chain. `A` depends on `B`, `B` on `C`... never hitting a source file.
          *   *Problem:* Build systems must terminate to produce an artifact.
          *   *Adjustment:* Lazy evaluation / On-demand checking. You never build the *whole* thing, but every step you check is valid *relative to the next*.
          *   *Mapping:* Justified = Every finite prefix of the dependency chain is well-formed, even if the chain never terminates at a source file. (This is tricky, needs careful wording).

  4.  **Developing the Residue Report:**
      *   *Exact Carries:* Foundationalism maps almost perfectly to DAGs with source leaves.
      *   *Distortions:* Coherentism requires forcing the build system to accept cycles (which it normally treats as errors). Infinitism requires a build that never finishes but is always "okay" so far.
      *   *No Counterpart:* The *normative* force of justification. A build failing is a mechanical error, not a rational failure.
      *   *Cycles:* In CS, cycles are usually errors. In Coherentism, they are features.
      *   *Infinite Chains:* In CS, infinite loops hang the build. In Infinitism, they are the *only* valid structure.
