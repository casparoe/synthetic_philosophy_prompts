          *   **The "Trace":** Like a lock of hair from a celebrity vs. a generic lock of hair. Physically identical, but one has a causal history that matters to us.
          *   **Discovery vs. Replication:** The original represents a moment of discovery/solution. The copy represents a solution to a problem already solved.

  4.  **Develop the "Third Option":**
