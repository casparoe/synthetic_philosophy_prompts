answer: |-
  You are not just defending your bruised wallet. Your friend has set up a false dichotomy that relies on an overly narrow definition of what "art" actually is.

  Her argument rests on **Formalism**: the idea that art is purely a visual arrangement of lines, colors, and shapes. If the arrangement is identical, the art is identical.

  Your intuition rests on **Contextualism**: the idea that art is an event, a discovery, or a human action that results in an object.

  Here is the third option, broken down into arguments you can use that have nothing to do with market value and everything to do with aesthetic experience.

  ### 1. Art is a Performance, Not Just a Product
  Think of a painting not as a noun, but as a verb. It is a record of someone *doing* something.

  When you look at an original, you are looking at the moment an artist solved a problem that had never been solved before. When you look at a forgery (or a workshop copy), you are looking at someone replicating a solution that already existed.

  *   **Analogy:** Imagine a scientist discovers a cure for a disease. Ten years later, a lab technician synthesizes the exact same molecule in a bottle. Chemically, they are identical. But we value the first one differently because it represents a breakthrough in human knowledge. The second represents technical competence.
  *   **Application:** Your painting isn't "less" because it looks worse. It's "less" because it represents a different *kind* of human achievement. One is exploration; the other is replication. That changes the narrative you engage with when you look at it.

  ### 2. The "Goodman" Argument (Knowledge Changes Vision)
  The philosopher Nelson Goodman addressed this exact point in his book *Languages of Art*. He argued that even if a forgery is visually indistinguishable *now*, knowing it is a forgery changes how you look at it *forever*.

  *   **The Argument:** Once you know a work is a copy, you start looking for the differences. You train your eye to see the hesitation in the brushstroke, the lack of confidence in the composition. Even if you can't spot them today, the knowledge alters your perceptual relationship with the object.
  *   **The Aesthetic Shift:** Aesthetic value isn't just "what hits my retina." It's "how my brain processes what hits my retina." If your brain is processing the image as "a master's insight," the experience is thrilling. If your brain is processing it as "a student's exercise," the experience is merely appreciative. The physical object didn't change, but the *aesthetic experience* did.

  ### 3. The Causal History (The "Love Letter" Test)
  This is the strongest way to separate financial value from aesthetic value.

  *   **Analogy:** Imagine you find a love letter in an attic. It is beautiful, poetic, and moves you to tears. Then you find out it was a forgery written by a stranger to seduce your grandmother, not a genuine expression of love from your grandfather.
  *   **The Result:** The words are identical. The ink is identical. The visual beauty is identical. But does it move you the same way? Most people say no.
  *   **Why?** Because part of the "beauty" of the letter is the knowledge of the *intent* and the *connection* behind it. Art works the same way. Part of the aesthetic power of a painting is the sense of connection to the mind that created it. If that connection is severed, the object feels "hollow," even if it looks the same.

  ### 4. Why Your Friend's Definition is "Mush"
  Your friend claims that if we care about authorship, "aesthetic value" becomes meaningless. You can push back on this.

  Aesthetic value isn't meaningless just because it includes non-visual data. We accept this in every other category of experience:
  *   **Food:** A meal cooked by a master chef tastes different to you than the same meal cooked by a stranger, because your expectation and context flavor the experience.
  *   **Sports:** Watching a recording of a game is not the same as watching it live, even if the pixels on the screen are identical. The *stakes* are part of the experience.
  *   **Nature:** We value a natural diamond differently than a lab-grown diamond, even if they are chemically identical, because one is a miracle of geology and the other is a product of engineering.

  ### How to phrase this to your friend
  Don't talk about the money. Talk about the *experience*. Try saying something like this:

  > "I don't think aesthetic value is just about what hits my retina. It's about the relationship between me and the creator. When I look at the original, I'm engaging with a moment of discovery. When I look at the copy, I'm engaging with a moment of repetition. The image is the same, but the *meaning* of the image is different. And meaning is part of aesthetics. If I watch a magic trick live versus watching a video of the same trick, the visuals are the same, but the experience isn't. Art is a performance, not just a picture."

  **The Verdict:**
  You are right to feel you have "less." You haven't lost visual beauty, but you have lost **provenance as an aesthetic quality.** You bought a connection to a specific mind, and you received a connection to a different mind. That is a legitimate aesthetic loss, regardless of the price tag.
