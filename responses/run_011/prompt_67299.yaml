      *   **The User's Experience:** Bought a painting thought to be by the master, turned out to be by a pupil (workshop piece). Visually indistinguishable (even experts/dealers were fooled).
      *   **The User's Feeling:** Feels like they have "less" now, not just financially.
      *   **The Core Question:** Is it a binary choice between "indistinguishable = equal value" and "aesthetic value is mush"? Or is there a third option that validates the user's feeling without sounding like sore-loser financial complaining?

