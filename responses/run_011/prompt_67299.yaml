      *   *Formalism/Visualism:* Art is purely about what is seen. (Friend's stance).
      *   *Contextualism/Intentionalism:* Art is about the history, the act of creation, the artist's intent. (User's intuition).
      *   *Nelson Goodman's "Languages of Art":* Goodman argues against the "indistinguishable" claim. He says knowing something is a forgery changes how we *look* at it, even if we can't spot the difference *now*. It trains us to look for differences.
