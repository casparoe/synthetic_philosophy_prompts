answer: |-
  ### The Theory of Constrained Ergodic Optimization

  The tension between your desk and your reading group arises because they are solving different optimization problems while using the same vocabulary. The reading group is solving for the maximum Lyapunov exponent of a multiplicative process in a vacuum. The desk is solving for the maximum survival probability of a leveraged entity in a friction-heavy environment.

  The theory of rational stake-setting that fractional staking presupposes is **Constrained Ergodic Optimization**. It accepts the ergodic critique (that time averages matter more than ensemble averages) but rejects the assumption that the agent is an immortal, frictionless particle with perfect knowledge of the probability distribution.

  Under this theory, the "bankroll" is not merely the capital currently held; it is the *risk capacity* required to absorb model error and liquidity shocks without hitting an absorbing barrier (ruin, redemption, margin call). Fractional Kelly is not a rejection of growth maximization; it is the mathematical consequence of maximizing growth when the parameters ($p$) are random variables rather than constants, and when the utility function includes a hard constraint on drawdown depth.

  **What This Rules Out vs. What It Accommodates**

  *   **Ruled Out:**
      *   **Maximizing Expected Wealth (Linear Utility):** This ignores the non-ergodic nature of multiplicative dynamics. It leads to certain ruin in the long run. Fractional staking agrees with the growth argument here.
      *   **Arbitrary Expected Utility Theory:** If an agent stakes less than fractional Kelly purely because they "feel" more risk-averse (a taste parameter $\gamma > 1$ in power utility) despite having no constraints or estimation error, this theory views that as irrational waste. Risk aversion must be *derived* from constraints, not *asserted* as a preference.
      *   **Threshold Probability of Ruin (as a primary goal):** While fractional Kelly keeps ruin low, making "probability of ruin < 5%" the *objective* rather than a constraint leads to suboptimal growth. The goal is still growth; survival is the boundary condition.

  *   **Compatible With (but not requiring):**
      *   **Target Hitting:** Fractional staking often aligns with maximizing the probability of hitting a target before a deadline, provided the target is reasonable relative to the edge.
      *   **Drawdown Constraints:** It is mathematically consistent with limiting maximum drawdown to a specific percentage, as variance scales with the square of the stake.

  **Reconciliation and the Estimation Defense**

  The practice and the growth argument reconcile completely on the physics of wealth: multiplicative dynamics require logarithmic optimization to avoid ergodicity breaking. They diverge on the *epistemology* of the edge.

  The desk's appeal to estimation error does not just relocate the problem; it solves it. The growth argument assumes $p$ is known. If $p$ is estimated from data, the "Full Kelly" calculated on $\hat{p}$ is objectively **not** the growth-optimal strategy. It is a biased estimator that overbets. In information theory terms (validating your graduate student's remark), if the channel is noisy, transmitting at the theoretical Shannon capacity guarantees a high bit-error rate. You must code below capacity to ensure reliable transmission. Similarly, you must bet below Full Kelly to ensure reliable growth when $p$ is uncertain.

  Therefore, fractional staking is the growth-optimal strategy *for an agent with parameter uncertainty*.

  **What Would Change if the Growth Argument Were Simply Right?**

  If the growth argument were "simply right" in the strong sense (perfect knowledge, no intermediate constraints, infinite horizon), the desk would have to stake Full Kelly. To do otherwise would be arithmetic error.

  However, for the desk to adopt this, their mandate would need to change fundamentally:
  1.  **Capital Structure:** They would need permanent capital with no redemption rights (to remove the "career ends" constraint).
  2.  **Leverage:** They would need unlimited leverage availability without margin calls based on interim mark-to-market (to remove the "absorbing barrier" constraint).
  3.  **Epistemology:** They would need to prove their edge is structural and static, not statistical and decaying.

  Since none of these are true, the "strong" growth argument does not apply to the desk, even if it applies to the universe.

  ### The Verdict

  I take the following definite positions:

  **1. On Objectivity vs. Taste:**
  The time-average growth rate is an **objective constraint on sustainability**, but maximizing it without qualification is a **subjective risk choice regarding model uncertainty**.
  *Reasoning:* The ergodic critique is physically correct: ensemble expectation is irrelevant to a single trajectory. However, claiming Full Kelly is the *only* rational choice assumes the agent knows the true distribution. Since no working bettor knows the true distribution, choosing Full Kelly is actually a subjective bet on one's own omniscience. Fractional staking acknowledges the objective limit of human knowledge.
  *Cost:* This position costs me the elegance of a universal "One True Strategy." It admits that rationality is relative to the agent's epistemic state and boundary conditions, not just the gamble's math.

  **2. On Fractional Staking:**
  Fractional staking is a **coherent application of the growth criterion**, not an abandonment of it.
  *Reasoning:* It maximizes the expected log of wealth *conditional on survival and parameter uncertainty*. It treats the "safety margin" (the unbet half) as capital allocated to hedging model risk, not as capital withheld due to fear.
  *Cost:* This position costs the theoretical purity of the Kelly derivation. It requires us to treat "bankroll" as a derived variable (Risk Capital) rather than an observed variable (Total Equity), complicating the accounting of what is being optimized.

  ### Presuppositions Table

  | presupposition | licensed_by | status | rival_excluded | cost_of_dropping |
  | :--- | :--- | :--- | :--- | :--- |
  | Wealth dynamics are multiplicative rather than additive. | both | strictly required | Maximizing Expected Wealth (Linear Utility) | The entire growth/ergodic framework collapses into standard mean-variance analysis. |
  | The agent faces an absorbing barrier (ruin/redemption) before the infinite limit. | fractional staking | strictly required | The strong growth-rate argument (immortal agent) | Fractional staking becomes irrational conservatism; Full Kelly becomes mandatory. |
  | Probabilities ($p$) are estimated with noise, not known with certainty. | fractional staking | strictly required | The strong growth-rate argument (perfect knowledge) | The justification for shrinkage (half-Kelly) vanishes; estimation risk is ignored. |
  | The time-average growth rate is the relevant metric for single-path outcomes. | both | strictly required | Expected Utility Theory (Ensemble Average focus) | Reverts to standard economics where ergodicity breaking is ignored or smoothed by insurance. |
  | Utility functions are not arbitrary taste parameters but derived from survival constraints. | fractional staking | natural but dispensable | Standard Expected Utility Theory (arbitrary risk aversion) | Risk aversion reverts to a psychological "feeling" rather than a mathematical constraint. |
  | The "bankroll" includes a buffer for model error, not just liquid capital. | fractional staking | natural but dispensable | The strong growth-rate argument (bankroll = total equity) | Requires redefining balance sheets to separate "risk capital" from "operating capital." |
  | Information transmission (betting) requires coding below channel capacity to reduce error. | both | merely consistent | Naive Kelly application (betting at capacity) | Increases the probability of catastrophic sequence risk (long drawdowns). |
  | Career/Fund lifespan is finite, making the asymptotic limit an approximation. | fractional staking | merely consistent | The strong growth-rate argument (infinite horizon) | Makes the "long run" argument theoretically valid but practically irrelevant for the agent. |
