answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, though I sympathize deeply with the pressure you are under as you approach the ethics committee and the pilot phase. Your philosopher friend has raised a point that is technically precise and practically vital, because a self-report measure relies on the assumption that the respondent can sincerely endorse the statement without logical self-sabotage. If an item forces them into a Moore-paradoxical position, you are not measuring the construct you intend but rather their tolerance for inconsistency or their guess about what you want to hear. Turning this philosophical insight into a tool for your research assistants requires stripping away the theory while keeping the structural red flags, and I have drafted below a procedure that should fit on a single page and take no more than two minutes per item.

  The screening procedure should be presented to your assistants as a sequence of questions they ask themselves while reading each item aloud. They should begin by checking whether the statement contains two clauses linked by a contrast word such as though, but, even if, or although. If the item is a simple declaration without a contrast, it passes this initial gate and can be kept for now. If there is a contrast, they must next ask whether both clauses refer to the internal emotional state of the respondent at the present time. If one clause refers to the emotion and the other refers to an external situation or a behavior, the item is likely safe and should be kept. If both clauses refer to the respondent's own mind, they must then check whether one clause affirms the presence of a specific feeling while the other denies the belief in or the existence of that same feeling. If the answer is yes, the item is flagged for rewrite or discard. Specifically, if the item says I feel X but I do not believe I feel X, or I do not feel X but I believe I do, it is structurally incoherent for a first-person report. The verdict should be discard unless the item can be rephrased to separate the conscious experience from the behavioral disposition without claiming the respondent holds contradictory beliefs simultaneously. If the assistants are unsure whether the two clauses refer to the same feeling, they must escalate the item to you rather than guessing.

  In simplifying the philosophy for this screen, I am willing to drop the nuanced distinctions between doxastic logic and pragmatic assertability because your assistants do not need to understand why the statement is paradoxical, only that it functions like one. The distinction that must survive is the difference between a conflict between emotion and world versus a conflict between emotion and self-knowledge. An item saying I feel afraid though the situation is safe describes a conflict between internal state and external judgment, which is psychologically coherent and should be kept. An item saying I feel afraid though I do not believe I am afraid describes a conflict within the self-ascription, which is the target of this screen. You should know that this screen will misfire primarily in the direction of false positives, meaning assistants will likely flag items as paradoxical that are actually acceptable because they are cautious about interpreting same feeling. This is preferable to false negatives, which would let broken items into your bank. I must also be honest that the step asking assistants to judge whether two clauses refer to the same feeling is where my intuitions are wearing a rule as a costume. There is no algorithmic way to determine if resentment in one clause is identical to resentment in the other, and this is the specific point at which a decision has to come back to you rather than to the procedure. If an assistant flags an item as a potential paradox but thinks it might be measuring a subtle distinction in affect, you must make the final call.

  When an item must be rewritten, the goal is to preserve the construct of felt-but-disavowed affect without forcing the respondent to assert a contradiction. You can achieve this by shifting the locus of the disavowal from the respondent's current belief to their past behavior or general self-concept. Instead of I resent my mother though I do not believe I do, which asks them to endorse a contradiction, you might write I sometimes act resentfully toward my mother even though I tell myself I do not resent her. This preserves the dissociation between disposition and avowal but frames it as a observation of pattern rather than a simultaneous logical contradiction. Alternatively, you can frame the item as a frequency of experience, such as I have noticed my reactions suggesting resentment toward my mother despite my conscious feeling of care. This moves the item from a claim about current metaphysical state to a claim about observed psychological history, which is reportable without paradox.

  Running this screen on your three drafts yields clear results. The first item, I resent my mother, though I don't believe I do, must be condemned by the screen. It is a textbook Moore-paradoxical statement because it asks the respondent to affirm a feeling while simultaneously denying the belief necessary to sincerely affirm that feeling. You mentioned this is your best item in terms of tracking clinician ratings, but its predictive success does not rescue it because a measure can correlate with an outcome for the wrong reasons. If this item predicts clinician ratings, it may be because confused respondents are ticking it when they are distressed, not because it accurately captures the specific construct of disavowed affect. Using it risks having your entire dissertation challenged on the grounds that your primary measure is logically incoherent, so you should rewrite it along the lines suggested above to separate the behavior from the belief. The second item, I sometimes feel afraid in situations I judge to be safe, passes the screen and should be kept. The contrast here is between the emotion and the external situation, not between the emotion and the belief in the emotion, so it is a coherent report of emotional dysregulation or phobic response. The third item, I am not jealous of my brother, but I am convinced that I am, fails the screen and should be rewritten. This is an inverse Moore paradox where the respondent denies the feeling but affirms the belief in the feeling, which is equally impossible to sincerely assert in the first person. It should be rephrased to something like I tell myself I am not jealous of my brother, but I worry that I am, which frames the conviction as a worry rather than a fact they are simultaneously denying.

  To close, I want to be clear about what this screen cannot do, so you do not rely on it for more than it is designed to deliver. This procedure is silent about item ambiguity, so it will not catch questions that are vague or interpreted differently by different respondents. It is silent about social desirability bias, so it will not flag items that people might lie about even if they are logically coherent. It is silent about construct validity, meaning it cannot tell you if the item measures disavowed affect or simply general confusion or negative affectivity. It is also silent about double-barreled items that ask about two different things without a contrast word, so your assistants must still check for that separately. Finally, it cannot police the tone or leading nature of the questions, so you will have to police those failure modes by other means, likely through your own review and the cognitive interviewing phase of the pilot. This screen is a filter for logical coherence in self-ascription, not a guarantee of psychometric quality, but it should save you from the specific philosophical attack your friend anticipates.

  I hope this helps you secure your item bank before you head to the ethics committee. It is a strong project, and tightening these foundations now will save you considerable pain at the viva.

  Warmly,

  Your Colleague
