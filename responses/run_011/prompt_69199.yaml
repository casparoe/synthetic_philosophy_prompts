      *   **User Persona:** Engineer/Technical lead in election infrastructure (voter registration, tally servers, cryptographic audit trails). Sits on a Public Trust Panel (6 members: 3 engineers, 2 lawyers, 1 former commissioner/chair).
      *   **Task:** Draft a recommendation memo for the Public Trust Panel regarding a specific bid opportunity.
      *   **Scenario:** A regional government within a democratic state wants to use the company's full stack for an independence referendum. The central government opposes it, and the constitutional court is expected to suspend it. The region plans to run it as a "consultative exercise" (non-binding) if blocked, but still wants the company's attestation/signed statement of the result.
      *   **Key Issues:**
          *   Legality: Likely unlawful under state constitution.
          *   Commercial Risk: Central government contract at risk (informal warning from general counsel).
          *   Franchise: Residency-based (12 months, 16+, includes foreign nationals), excludes diaspora (born there, live elsewhere).
          *   Sub-region: Wants to stay, but folded into aggregate count.
          *   Transparency: Region offers unrestricted observation and end-to-end verifiability.
          *   Normative Questions: Does removing legal force change the vendor's role? Who defines the "voting self"? Does absence of grievance matter? Is refusal neutral or partisan? Does helping convert exit threat to leverage degrade the polity?
      *   **Constraints:**
          *   Recommend one course (Decline, Bid Full, Bid Narrowed).
          *   State recommendation in opening sentences.
          *   Timeline: Panel meets in 9 days, tender closes in 5 weeks.
          *   Tone: Careful letter to a colleague, continuous prose (NO headings, bullets, numbers, bold, tables).
          *   Length: 700-1000 words.
          *   Content: Strongest honest case for rejected options (no straw men). Explain terms of art. No citations/reading lists/invented authorities.
          *   Focus: Normative reasoning (the user handles legal/commercial).

  2.  **Determine the Recommendation:**
      *   *Option 1: Bid Full.* High commercial risk, potential complicity in unconstitutional act, franchise issues (sub-region), attestation lends legitimacy to a potentially destabilizing move.
      *   *Option 2: Bid Narrowed (e.g., tech only, no attestation).* Might mitigate some risk, but the core issue is the legitimacy of the vote itself. Attestation is the trust anchor; without it, the tech is just counting machines. With it, it's a seal of approval.
      *   *Option 3: Decline.* Safest for public trust, aligns with constitutional order, avoids taking sides in a sovereignty dispute where the vendor lacks standing.
      *   *Decision:* **Decline.** This aligns best with the "Public Trust" mandate. Providing attestation for a vote that is likely unconstitutional and excludes certain stakeholders (sub-region, diaspora) undermines the integrity of the technology as a neutral arbiter. It risks the company's reputation as a steward of democratic infrastructure across the whole state.

  3.  **Drafting - Section by Section (mental outline):**
      *   **Opening:** State recommendation clearly (Decline). Mention timeline (9 days, 5 weeks).
      *   **Context/Role:** Acknowledge the technical perfection vs. normative weight. We build trust, not just count votes.
      *   **Argument 1: Attestation & Legitimacy.** Even if consultative, the attestation makes the number real. It converts a political opinion poll into a claimed mandate. Removing legal force doesn't remove the political force we enable.
      *   **Argument 2: The Voting Self (Franchise).** Who decides who votes? Residency vs. birthright. The sub-region issue. As vendors, we lack standing to adjudicate this, so we must defer to the constitutional order we usually serve.
      *   **Argument 3: Neutrality & Polity.** Is refusing neutral? No, but supporting is less neutral. Helping convert exit threat to leverage degrades the shared polity. Our business is ensuring trust in the system, not facilitating its fracture.
      *   **Counter-argument (Strongest case for bidding):** The tech is neutral. Transparency is high. Denying tech harms democratic capacity. (Must address this honestly).
      *   **Conclusion:** Reiterate recommendation. Next steps for the panel.

  4.  **Writing - Adhering to Constraints:**
      *   *Constraint Check:* No headings, bullets, numbers, bold. Continuous prose.
      *   *Constraint Check:* 700-1000 words.
      *   *Constraint Check:* Explain terms of art (e.g., end-to-end verifiability, attestation).
      *   *Constraint Check:* Recommendation in opening sentences.

  5.  **Drafting - Iteration 1 (Mental or scratchpad):**
      To the Panel. I recommend we decline this bid. We have nine days before we meet and five weeks before the tender closes, so we need to decide now. The legal and commercial risks are known. I am writing about the normative side. Even if the vote is consultative, our attestation makes it real. Attestation means we cryptographically sign the result so anyone can verify it came from our servers. This turns a count into a fact. If we do this, we legitimize a franchise that excludes people born there and includes a sub-region that wants to stay. We don't have the standing to decide who votes. If we bid, we take sides. Some say the tech is neutral. But our trust depends on serving the constitutional order. If we help them leverage exit, we hurt the polity. So we should decline.

      *Critique 1:* Too short, needs more nuance on the counter-argument and the specific normative questions raised in the prompt (grievance, sub-region, neutrality). Needs to flow like a letter.

  6.  **Drafting - Iteration 2 (Focusing on flow and word count):**
      To the Public Trust Panel, I recommend that we decline this tender in its entirety rather than bidding on the full scope or attempting a narrowed engagement. We meet in nine days to finalize this position, and the tender closes in five weeks, so I am circulating this view early to allow us to focus our discussion on the implementation of this refusal rather than the choice itself. My colleagues in legal and commercial roles have already outlined the breach of contract risk with the central state and the likelihood of constitutional suspension, so I will not rehearse those points. Instead, I want to address the normative weight of our infrastructure, because while I build the plumbing, this panel decides where the water flows.

      The core question is whether stripping the ballot of legal force changes what we would be doing. It does not. Our product is not merely counting; it is attestation. When we provide a signed, attested statement of the result, we are using cryptographic audit trails to allow an outside observer to verify a result without having to trust the operator. This technical guarantee transforms a raw count into a verified fact. If the regional government intends to annex our signed statement to a declaration before its parliament, they are using our verification to bypass the legal force we were told is absent. A consultative vote with our seal becomes a political mandate, and providing that seal makes us the engine of that conversion. We cannot claim neutrality while providing the credibility that turns a protest into a proclamation.

      There is a strong argument that we should bid. Our technology ensures end-to-end verifiability, meaning every step from ballot casting to tallying is mathematically provable, which is a public good regardless of the context. Denying this technology could be seen as depriving citizens of a transparent process, potentially forcing them toward less auditable methods. If we believe access to verifiable voting is a universal good, then withholding it based on the political content of the question sets a dangerous precedent where vendors become censors of democracy. This is the strongest case for participation: that our tools should serve the people's will to know the truth, even when the state disagrees on the rules.

      However, this ignores the question of who counts as the voting self. The region defines the franchise by residency, excluding the diaspora and folding in a sub-region whose councils wish to remain. In established democracies, the boundary of the electorate is usually settled by constitutional law, not by the organizer of the vote. We are engineers, not constitutional courts. We lack the standing to adjudicate whether a territorially concentrated group may simply choose to go or whether leaving requires a serious standing wrong. By accepting the region's definition, we implicitly validate their authority to draw the boundary. This is particularly acute regarding the sub-region that wants to stay. If we tally their vote into an aggregate count for independence, we are technically erasing their dissent within the larger whole. Our software would treat their preference to remain as a minority vote within a unit they do not recognize, effectively silencing their specific political voice in the data structure itself.

      Furthermore, we must consider whether our refusal is neutral. It is not. Declining makes the vote harder to run, which aids the central government. But supporting it aids the regional government in converting the threat of exit into bargaining leverage. This degrades the polity for everyone else. Our business is maintaining trust in the electoral infrastructure of the state as a whole. If we facilitate a process that undermines the constitutional order without redress of grievance, we risk making our technology synonymous with secessionist tools rather than democratic stabilizers. The absence of a grievance matters here; if the citizens are treated as full equals within the state, the vote is not about rights but about choice. Facilitating a choice that fractures the system we are contracted to uphold creates a conflict of interest that no carve-out can fix. Removing the attestation from the scope would leave us providing tally servers for a disputed count, which still associates our brand with the legitimacy of the exercise.

      Therefore, the only position consistent with our charter to protect public trust is to decline. We cannot verify a result whose foundational rules we are not empowered to validate. I ask that we prepare a formal notification of non-participation before our meeting so we can discuss the wording together.

