  The Tri-County Transit Authority (TCTA) is a special-purpose government body managing regional rail. The Board votes on reallocating $50M from the General Reserve to upgrade Signal System B.

  **County Alpha** is a founding member with board veto power, participating in the ongoing project of regional self-rule. However, System B operates exclusively in County Beta. Stipulation: Alpha's traffic and budget remain mathematically unchanged by this upgrade. Furthermore, Alpha retains sovereign immunity from TCTA coercive fines.

  **RailCorp** is a private contractor operating System B trains. Stipulation: Their contract subjects them to TCTA safety fines and binding operational rules. However, the contract is fixed-price; the funding reallocation alters neither their profit margin nor their duties. They hold no governance shares.

  **Beta Commuters** are residents living near System B stations. Stipulation: The upgrade reduces their commute times by 40%, a significant interest impact. However, rides are fully subsidized for them; they pay no fares and face no TCTA fines (enforcement targets operators, not passengers). They hold no membership shares.

  Excluding any group feels regrettable: Alpha built the system, RailCorp runs it safely, Commuters rely on it. Yet the principles diverge sharply. All-Affected enfranchises only Commuters. All-Subjected enfranchises only RailCorp. Joint-Agency enfranchises only Alpha. The decision is technical, not redistributive, ensuring interest impacts are binary rather than degreed, blocking the "degrees of affectedness" objection. The coercive boundaries are legal, not practical, blocking the "subjected collapses into affected" objection.

  | principle | enfranchised parties (by name) | excluded parties (by name) | the specific fact in the case that generates this extension | strongest move a defender of this principle has for refusing the result |
  | :--- | :--- | :--- | :--- | :--- |
  | All-Affected | Beta Commuters | County Alpha, RailCorp | Commuters suffer/benefit significantly; others' interests are stipulated unchanged. | Democratic legitimacy requires tracking actual welfare impacts, not formal status. |
  | All-Subjected | RailCorp | County Alpha, Beta Commuters | RailCorp is bound by coercive fines; others are immune or outside jurisdiction. | Coercion demands justification; those who can be fined must have a say. |
  | Joint-Agency | County Alpha | RailCorp, Beta Commuters | Alpha is a partner in the self-rule project; others are instruments or beneficiaries only. | Democracy is collective self-legislation, not mere interest protection or rule-compliance. |

