answer: |-
  # Diagnostic Instrument: Self-Locating Belief

  **Instructions:** This quiz consists of ten scenarios. Each scenario is self-contained; you do not need to remember previous items or outside reading to answer. For each item, select the single option that best matches your judgment. Do not select "It depends" or "I am unsure."

  ### Item 1 — The Deferred Toss
  On Sunday, a subject is put to sleep and told the whole procedure. She is woken once, interviewed, given an amnesia drug, and put back to sleep. Only *after* that first interview is a fair coin tossed. She knows on Sunday that the toss will happen after her first interview, and hence that at the moment of that interview it has not yet happened. If the coin lands Heads she is not woken again; if it lands Tails she is woken a second time, interviewed, and again given the drug.
  **(a)** At the first interview, what should her credence be that the coin will land Heads?
  **(b)** Is that answer the same as, higher than, or lower than the answer she should give in the ordinary version of the experiment in which the coin is tossed on Sunday before she is first put to sleep?
  *   **A.** (a) 1/2; (b) The same.
  *   **B.** (a) 1/2; (b) Higher.
  *   **C.** (a) 1/3; (b) Lower.
  *   **D.** (a) 1/3; (b) The same.

  ### Item 2 — The Three-Waking Experiment
  On Sunday she is put to sleep and told the following. A fair coin is tossed. If it lands Heads she is woken and interviewed once, on Monday. If it lands Tails she is woken and interviewed on each of Monday, Tuesday, and Wednesday. After every interview she receives the amnesia drug, so that during an interview she cannot tell what day it is or whether she has been interviewed before. At an interview she is asked two things: her credence that the coin landed Heads, and her credence that the interview she is having right now is her first.
  *   **A.** Credence Heads: 1/2; Credence First: 1/2.
  *   **B.** Credence Heads: 1/4; Credence First: 3/4.
  *   **C.** Credence Heads: 1/2; Credence First: 3/4.
  *   **D.** Credence Heads: 1/4; Credence First: 1/2.

  ### Item 3 — The Monday Disclosure
  She is woken, interviewed, and then truthfully told that today is Monday. What is her credence now that the coin landed Heads?
  *   **A.** 1/3.
  *   **B.** 2/3.
  *   **C.** 1/2 (because the answer is unchanged from Sunday).
  *   **D.** 1/2 (because she updated her Sunday answer back to 1/2).

  ### Item 4 — Waking as Evidence
  In the ordinary experiment (toss on Sunday, wake Mon if Heads, wake Mon/Tue if Tails), consider the moment she wakes up on Monday. Does she learn anything new at that moment that she did not know on Sunday?
  *   **A.** Yes, she learns that she is awake now.
  *   **B.** No, she knew on Sunday she would be awake at least once.
  *   **C.** Yes, she learns that today is not a day she sleeps through.
  *   **D.** No, because she cannot tell which day it is.

  ### Item 5 — The Control Situation
  On Sunday a fair coin is tossed. Regardless of the outcome, she is woken and interviewed on both Monday and Tuesday. She is told this rule on Sunday. She wakes up for an interview. What is her credence that the coin landed Heads?
  *   **A.** 1/2.
  *   **B.** 1/3.
  *   **C.** 2/3.
  *   **D.** It cannot be determined.

  ### Item 6 — Cumulative Betting
  In the ordinary experiment, at each interview she is offered a ticket that pays $1 if the coin is Tails and $0 if Heads. The ticket costs $0.60. She keeps all tickets bought at all interviews, and they are all paid out at the end of the experiment. Should she buy the ticket at every interview?
  *   **A.** Yes, because she will make money on average.
  *   **B.** No, because the bet is unfair at her credence.
  *   **C.** Yes, but only if she cares about total money, not per-interview fairness.
  *   **D.** No, because betting rules do not apply here.

  ### Item 7 — Diachronic Consistency
  If she sets her credence to 1/3 upon waking, is she vulnerable to a sequence of bets offered at each interview that jointly guarantee she loses money overall?
  *   **A.** Yes, and this proves 1/3 is irrational.
  *   **B.** Yes, but this does not prove 1/3 is irrational.
  *   **C.** No, she is not vulnerable to such a sequence.
  *   **D.** No, because guarantees of loss are impossible.

  ### Item 8 — The Hundred Rooms
  100 subjects are created in 100 rooms. A fair coin is tossed. If Heads, only the subject in Room 1 is woken. If Tails, subjects in Rooms 1 through 100 are woken. You wake up in a room. What is your credence that the coin landed Heads?
  *   **A.** 1/2.
  *   **B.** 1/100.
  *   **C.** 1/3.
  *   **D.** 1/50.

  ### Item 9 — Determinacy
  In the ordinary experiment, is there a single precise number that represents the subject's rational credence upon waking?
  *   **A.** Yes, there is exactly one correct number.
  *   **B.** No, the rational credence is a range of numbers.
  *   **C.** No, the question asks for something that does not exist.
  *   **D.** Yes, but it changes every minute.

  ### Item 10 — Source of Disagreement
  Regarding the ordinary experiment, where does the main difficulty lie?
  *   **A.** In the rules of probability (how to calculate).
  *   **B.** In the representation of what the subject knows (how to describe "now").
  *   **C.** In both equally.
  *   **D.** In the psychology of the subject, not the logic.

  ***

  # Scoring Key and Diagnostic Profiles

  **Item Forks:**
  1.  **Deferred Toss:** Probes whether credence tracks the physical chance (1/2) or the waking frequency (1/3), and consistency with the Standard case.
  2.  **Three-Waking:** Probes the weighting of observer-moments (1 vs 3) versus outcome chance.
  3.  **Monday Disclosure:** Probes updating behavior on self-locating information.
  4.  **Evidence:** Probes the "New Evidence" condition for updating.
  5.  **Control:** Probes basic probability competence (filters for arithmetic errors).
  6.  **Betting:** Probes the link between credence and decision in cumulative contexts.
  7.  **Consistency:** Probes the normative force of Dutch Book arguments.
  8.  **Hundred Rooms:** Probes Self-Sampling vs. Self-Indication principles in many-subject cases.
  9.  **Determinacy:** Probes precision vs. imprecision vs. deflationism.
  10. **Source:** Probes metaphysical vs. formal diagnosis of the problem.

  **Position Profiles:**
  *Note: Combinations not listed below are treated as "Unmapped" (see Incoherent Combinations).*

  *   **The Steadfast Halfer:** 1A, 2A, 3C, 4B, 5A, 6B, 7A, 8A, 9A, 10A.
      *   *View:* Credence is 1/2 always. Waking is not evidence. Vulnerable to Dutch Books but rejects their force.
  *   **The Double Halfer:** 1A, 2A, 3B, 4B, 5A, 6B, 7A, 8A, 9A, 10B.
      *   *View:* 1/2 on waking, but updates to 2/3 on Monday. Distinguishes self-locating content (Item 10B).
  *   **The Standard Thirder:** 1B, 2B, 3D, 4A, 5A, 6A, 7C, 8B, 9A, 10A.
      *   *View:* 1/3 on waking. Waking is evidence. Not vulnerable to Dutch Books (or rejects force).
  *   **The Imprecise Probabilist:** 1A or 1B, 2A or 2B, 3C or 3D, 4A or 4B, 5A, 6C, 7B, 8A or 8B, 9B, 10C.
      *   *View:* Rational credence is a range (Item 9B). Avoids commitment to single numbers in betting (Item 6C).
  *   **The Self-Indication Advocate:** 1B, 2B, 3D, 4A, 5A, 6A, 7C, 8B, 9A, 10B.
      *   *View:* Distinguished from Standard Thirder primarily by Item 10 (Representation focus) and Item 8 (Strong SIA).
  *   **The Self-Sampling Advocate:** 1A, 2A, 3C, 4B, 5A, 6B, 7A, 8A, 9A, 10B.
      *   *View:* Distinguished from Steadfast Halfer by Item 10 (Representation focus) and Item 8 (SSA reasoning).
  *   **The Deflationist:** 1A, 2A, 3C, 4B, 5A, 6D, 7D, 8A, 9C, 10D.
      *   *View:* The question is meaningless or psychological (Item 9C, 10D). Betting rules do not apply (Item 6D).

  **Incoherent or Unexplored Combinations:**
  1.  **Profile:** 5B (Control = 1/3) with any other answers.
      *   *Diagnosis:* Incoherent. This indicates a failure to understand basic probability in a case where waking count is equal.
      *   *Remark:* Not worth occupying; indicates a need for remedial probability instruction.
  2.  **Profile:** 3B (Monday = 2/3) combined with 4B (No New Evidence).
      *   *Diagnosis:* Unstable. One cannot update from 1/2 to 2/3 without conditionalizing on new evidence.
      *   *Remark:* Unexplored in literature; likely a confusion about the definition of "evidence."
  3.  **Profile:** 6A (Buy Bet) combined with 7A (Vulnerable & Irrational).
      *   *Diagnosis:* Incoherent. One should not willingly accept a betting strategy one admits guarantees a loss and proves irrationality.
      *   *Remark:* Not worth occupying; suggests a disconnect between normative judgment and action.

  **Conflict Procedure:**
  If a respondent's answers do not match any Position Profile and are not listed as Incoherent:
  1.  Identify the pair of items with the highest logical tension (e.g., claiming "No New Evidence" in Item 4 but "Update to 2/3" in Item 3).
  2.  Flag those two items as "Offending."
  3.  Do not assign the respondent to a position. Ask them to reconsider the logical link between the two flagged items.

  **Indistinguishable Positions:**
  The ten items cannot separate the following pairs. An eleventh item is required for each.
  1.  **Pair:** *Standard Thirder* vs. *Thirder who rejects Conditionalization*.
      *   *Description:* Both give 1/3 on waking. One thinks this is the result of Bayes' Rule; the other thinks Bayes' Rule does not apply to self-location.
      *   *Item 11:* "Does standard Bayesian conditionalization yield the 1/3 answer when applied to the proposition 'I am awake now'?" (Yes/No).
  2.  **Pair:** *Steadfast Halfer* vs. *Halfer who rejects Relevance*.
      *   *Description:* Both give 1/2 on waking. One thinks the waking is irrelevant evidence; the other thinks the evidence is relevant but the prior is robust.
      *   *Item 11:* "If the number of Tails-wakings were one million, would your credence in Heads change?" (Yes/No).

  ***

  # Session Guide (40 Minutes)

  **Preparation:** Print the Quiz and Key. Do not distribute the Key until the end.

  **Order of Operations:**
  1.  **Distribution (5 mins):** Hand out the quiz. Emphasize that scenarios are self-contained. Tell statistics majors to trust their intuition on the numbers but to read the "evidence" questions carefully.
  2.  **Silent Completion (10 mins):** Students complete the quiz individually.
  3.  **Item-by-Item Review (20 mins):** Read the items aloud in this order: **5, 1, 2, 6, 3, 4, 8, 7, 9, 10.**
      *   *Why this order?* Start with Item 5 (Control) to establish a baseline of probability competence. Move to 1 and 2 (Core Scenarios) to generate the primary split. Item 6 (Betting) usually sparks the most heated disagreement among statistics majors, so place it early in the discussion phase. Item 3 (Monday) is the tie-breaker for Halfers. Leave 9 and 10 (Metaphysical/Deflationary) for last as they are abstract.
      *   *Expect Disagreement:* Expect the room to split primarily on Item 1(b) and Item 6. Statistics majors often gravitate toward Item 6A (Buy Bet) due to expected value calculations, while philosophy students may hesitate based on credence norms. Use this tension to introduce the distinction between *credence* and *betting odds* in self-locating contexts.
  4.  **Scoring and Wrap-up (5 mins):** Distribute the Key. Ask students to find their profile. If time runs short, **drop Item 10**. It is the most abstract and least necessary for distinguishing the core probability views (Halfer vs. Thirder). Item 9 is the next candidate for removal if further time is needed.
