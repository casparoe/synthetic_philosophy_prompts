  2. Confirm that this case bears the weight provided it isolates token causation, because exclusion targets property instances rather than general types. To prevent the multiple realizability shield, stipulate that we are analyzing this single token instance where the functional property is instantiated by exactly one physical base, forcing a choice between property instances rather than types.

  3. Head off causal inheritance at minute 25 as the most dangerous of your four, since it allows them to claim functional powers are just physical powers in disguise without resolving the exclusion of the functional *qua* functional. Schedule overdetermination and downward causation rebuttals immediately after, while adding the identity theory escape and the pragmatic instrumentalist dodge as the two critical moves you have missed.

  4. Ask them to articulate precisely which causal power remains available to the functional property if the physical base is already sufficient to produce the effect without it. If they cannot specify a power that is not simply the physical power relabeled, they have felt the exclusion force and recognized the cost of their physicalism.

  5. Openly refuse to cover qualia or conscious experience, as introducing phenomenology will allow them to dismiss the argument as reliant on dualist intuitions about feeling rather than logic. Keep the domain strictly within computational and behavioral causation to ensure the exclusion problem stands on their own physicalist grounds.
