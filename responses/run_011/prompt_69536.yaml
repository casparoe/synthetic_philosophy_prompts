prompt: |-
  I cover AI and animal minds for a general-audience science desk, and basically every piece I file draws the same pushback from somebody, in six words: it's just next-token prediction. My editor uses it to cut any sentence where a model "knows" or "wants" something. A researcher I interviewed last month used it to mean the system has no way of telling a true sentence from a false one. A philosopher quoted in a competitor's piece meant something bigger — that shuffling symbols can't get you meaning, no matter the scale. And half the time I type it myself as a flat description of the training objective, no argument attached.

  Split that one sentence into the distinct precise claims it could be making — the objective, what's represented, what's grounded, what understanding is supposed to require — and for each say whether it's a platitude everyone in the field already grants, a live contested thesis, or just false. Then tell me which reading my editor actually needs in order to justify the cut, and whether that reading gets her there. I want a menu I can work from, not your verdict on machine understanding.

  Same shape keeps turning up in my octopus reporting: roughly two thirds of an octopus's neurons sit in the arms, which can run complex routines without the central brain, so people say either "obviously there's still one mind doing the understanding" or "look, all the competence, none of the comprehension." Is that the same dispute wearing a costume, or a different one? Keep the two seperate. And throughout, please mark what's settled among people who work on this versus what's genuinely contested — I don't want to print a minority position as the consensus, or the reverse.
