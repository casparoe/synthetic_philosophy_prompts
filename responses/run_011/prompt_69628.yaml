answer: |-
  Right, let's unpack this. It is a brilliant case study precisely because it sits at the intersection of individual rationality and institutional failure. You and your flatmate have stumbled onto the exact friction point where social epistemology stops being abstract and starts biting. The Bem episode isn't just a history of the replication crisis; it is a live fire exercise in higher-order defeat.

  Here is the analysis you need for the seminar, keeping the focus strictly on the epistemic norms rather than the sociological aftermath.

  ### 1. Sorting the Evidence: Process vs. State

  To apply the framework, we must first categorise the higher-order evidence (HOE) generated during the exchange.

  **Process-Directed HOE**
  This is evidence that the *procedure* used to generate the belief is unreliable, regardless of the specific agent. In the Bem case, this is the heavy lifter.
  *   **The Source:** The Dutch methodologists (Wagenmakers et al.).
  *   **The Content:** Their replication showed that when you add a control condition where backward causation is impossible, the 'psi' effect persists.
  *   **The Implication:** The methodological pipeline (the 'bog-standard' methods Bem used) has a high false-positive rate. It manufactures significance out of noise via optional stopping, p-hacking, or the garden of forking paths.
  *   **Classification:** This is purely process-directed. It attacks the reliability of the *tool*, not the user's competence on the day.

  **State-Directed HOE**
  This is evidence that the *agent* misapplied a sound method on this specific occasion.
  *   **The Source:** Bem's critics (and eventually the broader field).
  *   **The Content:** Suggestions that Bem might have been motivated by a desire for fame, or that specific data points were coded conveniently.
  *   **The Implication:** Even if the method were sound, *this* instantiation was compromised by bias or error.
  *   **Classification:** Bem largely treated the criticism as state-directed (implying his specific lab execution was rigorous), whereas the methodologists successfully argued it was process-directed.

  ### 2. Rational Requirements for the Agents

  Given this sorting, what was each party rationally required to do?

  **Daryl Bem**
  *   **Epistemic Position:** He held a first-order belief (Psi exists) based on first-order evidence (significant p-values).
  *   **HOE Input:** He received strong process-directed HOE suggesting his method produces psi results even when psi is absent.
  *   **Rational Requirement:** He was required to significantly downgrade his confidence in the first-order belief. To maintain belief, he would need a *defeater-defeater*—evidence that his specific instantiation was immune to the general process flaw. Merely insisting "I followed the rules" is insufficient when the rules themselves are indicted. Rationality demanded suspension of judgement pending a new, robust methodology (like preregistration).

  **The Methodologists (Wagenmakers et al.)**
  *   **Epistemic Position:** They suspected the process was flawed.
  *   **HOE Input:** Their own experimental design provided the process-directed HOE.
  *   **Rational Requirement:** They were required to publish the critique to disseminate the HOE to the community. Epistemically, they successfully shifted the burden of proof. They demonstrated that the first-order evidence (Bem's p-values) was disconnected from the truth of the proposition.

  **The Ordinary Working Psychologist**
  *   **Epistemic Position:** Believes her own significant results are true. Accepts the critique of Bem.
  *   **HOE Input:** Accepts the process-directed HOE regarding the field's standard pipeline.
  *   **Rational Requirement:** This is where it gets messy. If she accepts the pipeline is unreliable, she possesses process-directed HOE against *her own* beliefs formed via that pipeline. Rationality requires her to lower confidence in her own past and future results generated by the same methods. Continuing to publish "exactly as before" without adjusting confidence intervals or acknowledging the increased false-positive risk is epistemically irresponsible.

  ### 3. The Self-Exemption Asymmetry

  This is the crux of your argument. Why could everyone agree the field was broken but act as though their own lab was a sanctuary of reliability?

  **Is it Epistemic Akrasia?**
  Strictly speaking, yes. Epistemic akrasia is the state of believing *P* while believing that one's belief that *P* is unsupported or irrational.
  *   The ordinary psychologist thinks: "Psi is nonsense (because the method is flawed), but *my* finding on ego depletion is real."
  *   If she acknowledges the method is flawed *generally*, and she used that method *specifically*, then she believes "My belief is produced by a flawed method." If she continues to believe the result with high confidence, she is akratic. She is effectively saying, "My evidence does not support P, but P anyway."

  **Is it Legitimate Level-Splitting?**
  Level-splitting is sometimes defended in cases where one has evidence that one's reasoning is impaired, but the first-order evidence remains strong. However, that doesn't apply here. The process-directed HOE *undermines* the first-order evidence. The p-values are no longer evidence for the theory once the method is shown to generate them randomly. So, level-splitting is not a legitimate move here; the first-order support has been evacuated by the higher-order critique.

  **Is the Akrasia Charge Misapplied? (The Bracketing Move)**
  This is the most charitable interpretation, and likely what your flatmate was gesturing at. The argument runs: *Process-directed evidence can be bracketed if one has independent reason to think one's own state is exceptional.*
  *   The psychologist reasons: "The *field's* process is unreliable because *other people* are sloppy. *I* am careful. Therefore, the process-directed HOE applies to the reference class 'Other Psychologists', not 'Me'."
  *   **The Epistemic Error:** This turns process-directed HOE into state-directed HOE about *others*, while denying it applies to *self*. This is only rational if the agent has independent, higher-order evidence of their own superior reliability. In the Bem context, they did not. They were using the same 'bog-standard' methods.
  *   **Verdict:** The framework does not go silent here; it identifies this as a **reference class error**. The agent is irrationally excluding themselves from the relevant reference class ('Labs using standard social psych methods') without justification. It feels like bracketing, but it is actually a failure to acknowledge that process-directed HOE binds all users of the process equally.

  ### 4. Does the HOE Framework Do Any Work?

  You asked if this episode confirms the standard picture of higher-order defeat, or if "you should have preregistered" does all the lifting.

  **Where the Framework Confirms Standard Pictures**
  The Bem case is a textbook example of **higher-order defeat**. The first-order evidence (the statistical significance) did not change. The data remained the same. What changed was the community's assessment of the *link* between that data and the truth. The HOE framework explains *why* the p-values stopped counting as evidence. It wasn't that new data arrived disproving psi immediately; it was that the warrant for the original data was revoked.

  **Where the Framework Goes Silent**
  The HOE framework is diagnostic, not prescriptive.
  1.  **Degree of Defeat:** The framework tells the psychologist she should lower confidence. It does not tell her *by how much*. Should she drop from 95% confidence to 50%? To 10%? The epistemology of HOE struggles with quantification.
  2.  **Action Guidance:** The framework says "Don't believe." It does not say "Preregister." The move to preregistration and registered reports is a *methodological* fix to a *epistemic* problem. HOE explains the crisis; it doesn't solve it.
  3.  **Social vs. Individual:** The framework traditionally models an individual agent receiving HOE. The Bem episode shows HOE is often *socially distributed*. The individual psychologist didn't generate the HOE herself; she received it from the Dutch team and the replication projects. Standard HOE theory sometimes underplays the testimony aspect of how we acquire evidence about our own reliability.

  **Conclusion: Is HOE Redundant?**
  No. Saying "you should have preregistered" is a rule of thumb. The HOE framework explains *why* that rule exists.
  *   **Without HOE:** Preregistration is just a bureaucratic hoop.
  *   **With HOE:** Preregistration is a mechanism for insulating first-order evidence from process-directed defeat. It blocks the garden of forking paths, thereby preventing the generation of misleading process-directed HOE in the future.

  The Bem episode reveals that process-directed HOE is often ignored until it becomes impossible to bracket. The "self-exemption asymmetry" persists because admitting the HOE applies to oneself is professionally costly (it undermines one's publication record). The epistemology shows this is irrational; the sociology explains why it persists.

  For your seminar: The takeaway is that the replication crisis was essentially a collective realisation that the field had been ignoring overwhelming process-directed higher-order evidence for decades. The 'reform' movement is simply the institutionalisation of norms that prevent that specific type of evidence from arising again.

  Cheers. Hope that helps settle the kitchen debate.
