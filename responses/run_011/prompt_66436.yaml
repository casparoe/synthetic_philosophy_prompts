  The inference reading falters because it requires a universal premise about thinkers that is arguably more doubtful than the particular existence it seeks to prove. Hintikka's performance view sidesteps this by treating the cogito as an act that makes its own denial impossible in the moment of utterance. Lichtenberg pushes further, suggesting the grammar of "I" is a habit rather than a warrant, leaving only the event of thinking without a substantial subject.

  Steam rises from the cup, no one drinking.
  A hand rests on the wood, felt but not owned.
  Thinking occurs, a verb without a noun.
  To name the thinker is to sneak in a ghost.
  Like lightning strikes, there is no striker.
  The circle tightens round a hidden claim.
  Existence means only undeniable presence.
  Not a thing out there, but an act in here.
  Memory fails to bridge the gap between moments.
  Weight is a ghost grammar demands.
  The performance locks the door on denial.
  Yet language builds a house for a tenant.
  Something thinks, the sentence simply says.
  But the place for the speaker stays empty.
  A shadow forms where the light cuts off.
  The argument cheats to find a solid floor.
  Only the event is certain, not the doer.
  Time collapses into this single breath.
  No past adheres to the burning thought.
  The page waits for a name to anchor it.
  Syntax insists on a master for the verb.
  Reason bends until the shape fits the mold.
  A voice finds a singular spot in the dark.
  Nothing else remains but this sharp edge.
  One word opens the locked room finally.
  I am the shadow cast by the verb.

  This poem dramatizes the deflationary reading as the default experience, treating the substantial self as a grammatical afterthought rather than an ontological foundation. It leans heavily on the performance aspect in the middle section, suggesting existence is secured only by the act of denial itself, not by logical inference. I am reasonably confident this captures the tension between the event of thinking and the assumption of a thinker, though the *cogito* ultimately resists poetic reduction. The line I am least sure of is "Weight is a ghost grammar demands," because it risks being too abstract compared to the concrete imagery of the hand and cup. However, it serves to bridge the physical sensation with the linguistic imposition of substance. The final line aims to leave the survivor ambiguous, both a real self or merely a syntactic necessity.
