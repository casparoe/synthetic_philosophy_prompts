answer: |-
  Elias tapped the holographic table, where two dots pulsed in opposite corners of a wireframe universe. "You keep the unit," he said. "You gain one. But across the googol instances of this scenario, your choice evidentially tracks theirs. If you contribute, you signal that the algorithm running in your head outputs 'contribute.' That means a vast fraction of the others do too. Each contribution costs you one but delivers ten to a counterpart. The aggregate return dwarfs the local loss."

  Mara leaned back, arms crossed. "You're treating your action as a lever. It's not. It's a readout. You say 'if I contribute,' but you don't mean 'if I freely choose to.' You mean 'if I observe myself contributing.' But you haven't chosen yet. The physics of your brain is already determining the output. You should be conditioning on 'I am the sort of entity that contributes,' not 'I choose to contribute.' That type is fixed before you sit down at this table."

  Elias nodded slowly. "I grant the determinism. But decision theory is the process of resolving uncertainty about what that output will be. From inside the system, I don't know the output yet. So when I calculate expected utility, I ask: 'What happens if the output of this computation is 1 versus 0?' Since the same computation is running elsewhere, updating on my local output updates me on theirs. It's not magic; it's logical linkage."

  "But where is the causal arrow?" Mara pressed. "Suppose the correlation exists because you share a common cause—same initial conditions, same physics. A causal decision theorist conditions on the common cause and sees the outcomes as fixed. You're smuggling in a causal power by pretending the correlation is responsive to your local deliberation. If the correlation is just shared history, your deliberation doesn't change the probability of their action. It just reveals it."

  "It's not just shared history," Elias said. "It's numerical identity. It's not that two things look alike; it's that the computation *is* the same object instantiated in two places. If I change the output here, I'm not reaching across space to change theirs. I'm specifying what the computation *does*. There aren't two computations deciding. There's one computation, two instances."

  Mara frowned. "Okay, suppose I buy that for perfect copies. But look at the noise parameter." She swiped the display, introducing static around the dots. "You said a googol agents. But local noise perturbs some. Maybe only ten percent are running the exact same code. The rest are slightly varied. Your choice predicts the ten percent, but tells you nothing about the ninety percent. Does the case for cooperating collapse?"

  "It scales," Elias said. "If only ten percent are correlated, I weight the benefit by that fraction. If the correlated group is large enough in absolute terms, the expected value remains positive. I cooperate for the sake of the copies that are me."

  "Where's the cutoff?" Mara asked. "Is it fifty percent correlation? One percent? If I'm only slightly similar to them—say, we share values but different heuristics—do I still cooperate? You need a theory of which similarities count as 'same computation.' If you can't define that, you're just gesturing at a vibe. A causal theorist says zero leverage once the causal link is cut. You're saying 'some leverage,' but you can't say how much without arbitrariness."

  Elias paused, looking at the static. "That's fair. I don't have a clean metric for similarity. I concede that. If the noise is high enough that my action no longer predicts theirs better than chance, the argument fails. I can't tell you the exact threshold where 'me' becomes 'not-me' across the void. But the absence of a sharp line doesn't mean the link is zero. It just means identity is fuzzy."

  "And that fuzziness is where you're hiding the normativity," Mara said. "Look, I'll concede this: if you were a perfect digital copy, running on identical hardware in lockstep, I see the intuition. Calling them 'two agents' is misleading. It's one agent twice. In that specific case, your 'evidential leverage' is just causal leverage over a distributed system."

  "But we aren't perfect copies," Elias said. "We're near-copies. And I still have reason to cooperate."

  "Why?" Mara asked. "If I admit the perfect copy case is just one agent, then the imperfect case is clearly two agents. They diverge. If you cooperate and they defect, you lose. You're betting on a correlation that isn't guaranteed. A causal agent says: 'My action is fixed by my type. Their action is fixed by their type. I cannot change their type.' You say: 'I can select which type exists.' But you can't. You just find out which one you are."

  "I select which output the algorithm produces," Elias insisted. "And since the other agents are running approximations of that algorithm, selecting the output here shifts the probability distribution over their outputs. It's not about changing their type. It's about the logical fact that similar algorithms yield similar outputs."

  "So the disagreement isn't about the physics," Mara said, tapping the table. "It's about whether logical facts are things we can 'act upon.' I say logical facts are static. You treat them as variables we can set."

  "Basically," Elias said. "If the logical fact is 'Algorithm A outputs Contribute,' I can make that true by contributing."

  "And I say you contribute *because* that fact is true," Mara countered. "The order of explanation matters. If the fact is already true, you aren't setting it. You're complying with it."

  "Then we're stuck on whether deliberation is discovering a truth or creating one," Elias said.

  "No," Mara corrected. "We're stuck on whether a logical correlation, absent a causal channel, creates a duty. I concede the correlation is real. I concede perfect copies are effectively one agent. But I deny that partial similarity creates a partial duty. You need to justify why 10% similarity gives you 10% leverage, rather than 0%."

  "And you need to justify why logical identity counts for nothing if it isn't causal," Elias said.

  "Fine," Mara said. "Let's narrow it. If I agree that logical identity is real, but deny it has normative force without causal power, does your argument survive?"

  "Only if you accept that expected utility maximization requires counting logical consequences," Elias said. "So the real fight is whether the domain of 'consequences' includes logical correlations across spacelike separation."

  "Exactly," Mara said. "You think the map of logical dependence is a territory we can navigate. I think it's just a map."

  Elias looked at the pulsing dots. "Then I suppose I'm trying to navigate the map."

  "And I'm waiting for a road," Mara said.
