  **Position:** Director of Value Trade
  **Organization:** The Meridian Grantmaking Foundation
  **Location:** Remote (with quarterly alignment retreats)
  **Reports to:** Executive Director

  **About Us**
  The Meridian Grantmaking Foundation is dedicated to deploying capital toward high-impact social interventions. Founded on the principle that resources should be allocated where they are most needed, the Foundation operates within a complex governance structure designed to reflect the pluralistic nature of moral inquiry. Our Board of Directors comprises representatives from distinct ethical traditions, ensuring that no single axiological framework dominates our strategic direction. While this structure ensures robust deliberation, it occasionally necessitates sophisticated mediation to unlock capital deployment. We are a rigorous, process-oriented organization committed to legal compliance, fiduciary responsibility, and the sustained management of irreconcilable differences.

  **The Role**
  The Director of Value Trade will serve as the primary architect of Pareto improvements across conflicting stakeholder value systems. This role is not merely administrative; it is fundamentally metaphysical. The successful candidate will identify opportunities where parties with genuinely incommensurable ultimate values can engage in exchange to mutual benefit, as defined by their respective internal metrics. You will be responsible for maintaining the Foundation's internal exchange rate between these values and ensuring that all transactions clear without triggering veto conditions. This position requires a candidate who can operate with complete managerial confidence in environments where objective comparison is theoretically impossible.

  **Key Responsibilities**
  *   Maintain and quarterly rebalance the Foundation's pegged exchange rate between Sovereignty Units (SU) and Aggregate Welfare Points (AWP), currently fixed at 1.0 SU = 3.4 AWP.
  *   Structure grant agreements that satisfy utilitarian efficiency metrics while simultaneously adhering to deontological constraint thresholds.
  *   Identify friction caused by rigid procedural rules and reclassify them as negotiable anchoring biases to facilitate deal closure.
  *   Report monthly on performance using dual-denominated metrics, acknowledging that increases in AWP cannot be mathematically summed with decreases in Rights Violations, yet must be presented as a unified "Impact Dashboard."
  *   Serve as the credible counterparty in all high-stakes negotiations, ensuring that trust is maintained even when the underlying premises of the counterparties are mutually exclusive.

  **Qualifications**
  *   **Required:** Demonstrated capacity to remain unmoved by strong first-order moral commitments during working hours.
  *   **Required:** Unimpeachable personal integrity and fidelity to agreed-upon terms, ensuring that you are a trustworthy broker even while remaining neutral on the truth of the terms themselves.
  *   **Required:** Advanced proficiency in game theory, negotiation, and meta-ethics.
  *   **Preferred:** Experience overcoming resistance from stakeholders who view certain constraints as non-negotiable rather than strategic positioning.
  *   **Preferred:** Ability to sustain cognitive dissonance without degradation in performance output.

  **Compensation and Benefits**
  The Meridian Foundation offers a competitive salary commensurate with experience, comprehensive health insurance, and a retirement matching package. Additionally, the role includes a contingent component of Moral Merit Credit, accrued based on the net positive outcome of facilitated trades. Candidates should note that the value of this Credit is strictly dependent on the correctness of consequentialist axiology; should deontological or virtue-ethical frameworks prove objectively correct, this component may retain no redeemable value. The Foundation commits only to claims regarding compensation that hold true relative to whichever value system ultimately governs reality.

  **Equal Opportunity Statement**
  The Meridian Grantmaking Foundation is an equal opportunity employer. We welcome applicants of all backgrounds, identities, and meta-ethical persuasions. We encourage applications from individuals holding any coherent moral framework, including those the Board currently regards as mistaken or objectively erroneous, provided such frameworks do not impede the execution of traded compromises.

  **How to Apply**
  Please submit a cover letter and resume to careers@meridianfoundation.example. In your cover letter, please describe a situation where you facilitated an agreement between parties who could not agree on why the agreement was good.

  *We leave it to the successful candidate to determine whether this work constitutes the only sane response to pluralism, or a slow form of corruption.*
