answer: |-
  The question of whether dreams are experiences appears deceptively simple. The folk psychological answer is an unreflective yes: we undergo things while asleep, just as we do while awake, only the world is different. But in the analytic tradition, this affirmative view has been besieged by two formidable negative accounts. On one side stands Norman Malcolm, arguing from the armchair that the very concept of a dream-experience is incoherent. On the other stands Daniel Dennett, arguing from the philosophy of mind that the cognitive architecture of sleep might render the notion of a concurrent experience unnecessary. While these positions are often lumped together as "dream skepticism," they are fundamentally distinct in method and vulnerability. To draft a chapter on this topic, you must first dissolve the illusion of their alliance. Malcolm's thesis is a conceptual blockade; Dennett's is an empirical wager. Once separated, it becomes clear that Malcolm's argument is philosophically obsolete, while Dennett's raises a genuine challenge that nevertheless fails to overturn the affirmative view. The verdict must be that dreams are experiences, not because we can prove they occur with Cartesian certainty, but because the alternative requires a deflationism about consciousness that we are unwilling to accept in waking life.

  Malcolm's position, rooted in a strict verificationism, is that the grammar of "dreaming" is entirely tied to the waking report. For Malcolm, to say "I dreamt" is not to describe a past event but to express a present impression. He argues that there are no criteria for establishing that an experience occurred *during* sleep. Since the sleeper is unconscious, they cannot check their experience; since the waking subject relies on memory, they cannot verify the timing. Consequently, Malcolm concludes it makes no sense to speak of the duration of a dream or the occurrence of an experience prior to waking. His claim is a priori: no neurophysiological discovery could ever refute him, because he is not making a claim about the brain, but about the logical limits of our language. If science showed brain activity corresponding to imagery, Malcolm would simply say this activity is not "dreaming" in the conceptual sense, or that we have changed the subject.

  Dennett's negative thesis is radically different. In his 1976 paper and subsequent work, he does not argue that the concept is incoherent, but that the phenomenon is likely illusory. He proposes the "cassette hypothesis": the brain may record a dream narrative at the moment of waking, compressing it into a memory that feels like it took time, or composing it entirely from fragmentary traces activated upon arousal. For Dennett, the question is not grammatical but mechanistic. He is happy to concede that if future science demonstrated content-specific neural activity unfolding in real-time during REM sleep, the cassette hypothesis would lose its plausibility. Dennett's skepticism is thus an empirical bet about the economy of consciousness. He suggests that since the brain is capable of confabulation, we should not presuppose that the phenomenology of the report matches the history of the night.

  The alliance between Malcolm and Dennett is therefore illusory. Malcolm blocks empirical inquiry by definition; Dennett invites it. This distinction determines which negative thesis is doing the heavier philosophical work. Malcolm's argument is the less defensible of the two. It relies on a verificationist theory of meaning that has largely been abandoned in contemporary philosophy. By insisting that the truth of a dream report is constituted solely by the waking impression, Malcolm renders the phenomenon of sleep onset opaque. We often experience the drift into sleep—the hypnagogic imagery that clearly feels like an experience occurring before we lose consciousness. Malcolm must dismiss this as a misdescription, which strains credibility. His argument protects a linguistic intuition at the cost of phenomenological data. If concepts are tools for navigating the world, and the tool of "dream experience" allows us to predict neural correlates and explain memory consolidation, then Malcolm's insistence on conceptual purity is an obstacle rather than an insight.

  Dennett's challenge is more serious because it engages with the machinery of mind. He forces us to ask whether the *feeling* of having dreamt is sufficient evidence for the *occurrence* of a dream. However, Dennett's position encounters a significant hurdle when weighed against recent developments in neuroimaging and the philosophy of imagination. This brings us to your colleague's objection regarding decoding studies. Suppose we can read out coarse imagery from a sleeping brain in real-time, tracking shifts in content that match the eventual report. Your colleague is correct that this does not logically entail experience. As in blindsight, a subject can process visual information without phenomenological awareness. To infer experience from neural data is to assume that neural correlates of content are necessarily correlates of consciousness. If we make that assumption for sleepers, are we not begging the question against Dennett?

  The objection holds water if we demand logical proof, but it fails if we employ Inference to the Best Explanation (IBE). In waking life, we infer that others have experiences based on their behavior and neural activity, despite the logical possibility of zombies. We do not treat waking consciousness as a hypothesis that needs to be proven beyond the possibility of confabulation; we treat it as the default explanation for the integration of information. If a sleeping brain shows sustained, content-specific activity that mirrors the complexity of waking perception, the hypothesis that "nothing was experienced" becomes increasingly costly. It requires us to believe that the brain performs complex, integrated processing during sleep without any accompanying "what-it-is-like-ness," only to generate a false memory of experience later. While logically possible, this posits a discontinuity between sleep and wakefulness that is not mirrored in the neural data. The neural data does not refute Dennett by logical coercion, but it refutes him by making his hypothesis less parsimonious than the affirmative view.

  This leads to the second major point: the underdetermination argument cuts both ways. Dennett's skepticism relies on the gap between the event and the report. But this gap exists in waking life too. Our waking memories are reconstructed; our sense of temporal duration is malleable; our confidence in what we experienced five minutes ago is not infallible. If the impossibility of verifying the exact timing and content of a dream licenses the conclusion that the experience did not occur, then the same skepticism should apply to waking episodes. We cannot verify, with absolute certainty, that our waking memory of a conversation matches the exact neural unfolding of that conversation. If we accept waking experiences as real despite this underdetermination, consistency demands we accept dream experiences as real, provided the causal mechanisms are sufficiently similar. To deny dreams while affirming waking life is to posit a magical status for wakefulness that cognitive science does not support. Dennett's argument, if pushed to its limit, threatens to eliminate experience altogether, reducing all consciousness to a "user illusion" generated at the moment of report. While Dennett might be comfortable with a form of eliminativism, most philosophers find the cost too high. If the argument destroys the reality of waking experience, it is self-defeating, for it uses the very conscious reasoning it seeks to undermine.

  Therefore, the verdict must be in favor of the affirmative picture, refined by the imagination model. Dreams are experiences, but they are not necessarily perceptual hallucinations. Recent work suggests dreaming is a form of immersive imagination. We do not see images; we imagine seeing them. This distinction saves the affirmative view from some of Dennett's worries about veridicality while preserving the reality of the experience. When you dream of flying, you are not hallucinating flight; you are imaginatively experiencing flight. This experience occurs during sleep. It has duration, roughly correlated with REM phases, and it has content, correlated with neural activation patterns. To deny this is to privilege the waking report over the sleeping process in a way that contradicts the continuity of cognitive architecture. You should sign up to the view that dreams are imaginative experiences occurring during sleep. Malcolm is wrong because concepts evolve with science; Dennett is wrong because his skepticism proves too much. The affirmative view is the only one that treats the sleeping mind as a continuous agent rather than a broken machine that repairs its history upon startup.

  Finally, we must consider the consequences of this verdict for the classic skeptical argument from dreaming. The Cartesian skeptic uses dreams to undermine knowledge of the external world: if I cannot tell I am dreaming, I cannot trust my senses. If we accept the verdict that dreams are experiences, does this skepticism survive? Yes, but in a clarified form. If dreams were *not* experiences (as Malcolm and Dennett suggest), the skeptical problem would actually dissolve or change shape. If dreaming is merely a waking impression with no past duration, then I am not currently in a state that mimics waking; I am simply waking up with a false story. The threat of global deception requires that the deceptive state be phenomenologically indistinguishable from the veridical one *while it is happening*. If dreams are not experiences, there is no "while it is happening" to worry about.

  However, by affirming that dreams are experiences, we keep the skeptic's weapon sharp. We admit that there are states of consciousness that feel real but are not connected to the world. This means the verdict has a cost: it preserves the possibility of radical skepticism. But this cost is not a reason to deny that dreams are experiences. The reality of consciousness is not contingent on its utility for epistemology. If denying dream experience were the only way to save knowledge of the external world, one might be tempted to take the bargain. But it is not. We can accept that dreams are real experiences and still maintain that waking life has distinctive features (coherence, sensory integration, causal stability) that allow us to distinguish them. The skeptical argument survives, but it is not strengthened by the negative theses; it is merely preserved. Conversely, if the verdict had no consequences for skepticism—if skepticism remained exactly as strong or weak regardless of the ontology of dreams—that might count against the verdict's significance. But here, the stakes are clear. Denying dream experience disarms the skeptic by removing the deceptive state. Affirming it arms the skeptic but honors the phenomenology. We should honor the phenomenology. The existence of a deceptive experience is a problem for epistemology, but the denial of the experience is a problem for the philosophy of mind. The latter is the more fundamental error.

  In sum, Malcolm and Dennett offer negative answers that look similar but rest on incompatible foundations. Malcolm's conceptualism is a dead end that ignores the progress of cognitive science. Dennett's empiricism is a valuable corrective that prevents naive realism, but his specific hypothesis fails the test of explanatory power when faced with neural data and the parity of waking memory. You should reject both negatives. Dreams are experiences of imagination. This verdict accepts the risk of skepticism because the alternative is to deny the reality of the sleeping mind's life, a price too high for the comfort of certainty.
