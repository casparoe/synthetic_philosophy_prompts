answer: |-
  You have correctly identified that the standard vocabulary is insufficient. Your intuition is precise: the standard *Optimizer's Curse* describes the statistical artifact of selecting the maximum of noisy estimates, but it typically assumes the noise is independent of the true value or at least homoscedastic (roughly equal variance across options). Your case describes a structural **heteroscedasticity** where the variance itself is correlated with one of the scoring criteria (Neglectedness), and the scoring function (Expected Value) is sensitive to that variance.

  Here is the analysis of the nearest existing concepts, followed by the coined term and definition you requested.

  ### 1. The Nearest Existing Concepts

  **The Optimizer's Curse (and Winner's Curse)**
  *   **The Fit:** This is the parent mechanism. It correctly identifies that maximizing over noisy estimates leads to systematic overestimation of the selected option's true value.
  *   **The Difference:** The standard Optimizer's Curse treats noise as a nuisance parameter that is roughly comparable across candidates. It warns that "the winner is likely overvalued." It does not account for a system where the *magnitude of the noise* is itself a signal that boosts the score on a separate axis. In your case, the noise isn't just obscuring the value; it is actively *generating* value in the model via the Neglectedness criterion and the EV tail. The Curse explains why you are wrong about the specific number; it does not explain why you are systematically wrong about the *category* of cause (uncertain vs. certain).

  **Goodhart's Law (and Campbell's Law)**
  *   **The Fit:** This captures the decoupling of the measure from the goal. You are optimizing for "Importance," but ending up with "Uncertainty."
  *   **The Difference:** Goodhart's Law generally presupposes an agent reacting to the measure (gaming). It implies that the metric *was* valid until the optimization pressure broke it. In your scenario, the metric was never valid; the correlation between Neglectedness and Epistemic Opacity is a structural feature of the information landscape, not a behavioral reaction to the funding. You are not breaking a measure; you are misinterpreting a proxy.

  **Adverse Selection (The "Lemons" Problem)**
  *   **The Fit:** This captures the idea that the pool of available options is skewed toward those that are hard to assess.
  *   **The Difference:** Adverse Selection relies on *information asymmetry* between two parties (e.g., the seller knows the car is a lemon, the buyer does not). In your grantmaking context, the "cause" is not an agent concealing information. The ignorance is symmetric and absolute. The skew comes from the *difficulty of measurement*, not from strategic concealment.

  **Ambiguity Seeking (vs. Ambiguity Aversion)**
  *   **The Fit:** In decision theory, *Ambiguity Aversion* is the preference for known risks over unknown uncertainties. Your committee is displaying the opposite: *Ambiguity Seeking*.
  *   **The Difference:** This describes the *attitude* toward uncertainty, but not the *structural mechanism* that rewards it. It names the behavior but not the systemic feedback loop that causes the research agenda to lock in.

  ### 2. The Verdict

  None of these terms fit cleanly. The Optimizer's Curse is the engine, but it lacks the steering mechanism (the correlation between variance and criteria). Goodhart's Law describes the outcome but implies the wrong causality (gaming vs. structural error). Adverse Selection implies the wrong ontology (agents vs. problems).

  You require a term that captures three specific components:
  1.  **Variance-Criterion Coupling:** The uncertainty of the estimate is positively correlated with one of the scoring criteria.
  2.  **Tail-Sensitive Aggregation:** The scoring function (EV) rewards high variance.
  3.  **Epistemic Feedback:** The allocation of resources to reduce uncertainty is determined by the initial inflated score, preventing the uncertainty from being resolved.

  ### 3. The Coined Term: The Epistemic Variance Trap

  I propose calling this configuration **The Epistemic Variance Trap**.

  This term distinguishes the phenomenon from the general Optimizer's Curse by specifying the source of the error (Epistemic Variance) and the dynamic outcome (Trap). It implies that the system is not merely making a mistake, but is structurally prevented from correcting it.

  #### Definition

  **The Epistemic Variance Trap** is a selection bias occurring in multi-criteria decision systems under uncertainty. It is defined by the following necessary and sufficient conditions:

  **Necessary Conditions:**
  1.  **Tail-Sensitive Scoring:** The decision rule ranks options based on a metric that is sensitive to the upper tail of a probability distribution (e.g., Expected Value, Maximum Possible Impact) rather than a conservative estimate (e.g., lower confidence bound).
  2.  **Variance-Criterion Correlation:** At least one scoring criterion (e.g., Neglectedness, Novelty) is positively correlated with the *variance* (uncertainty/width) of the evidence base, rather than the *mean* estimated value.
  3.  **Epistemic Uncertainty:** The variance in question is epistemic (reducible through investigation) rather than aleatory (inherent randomness).

  **Sufficient Condition (for the "Trap" dynamic):**
  4.  **Endogenous Verification:** The allocation of resources for further investigation (scoping studies, research) is determined by the initial ranking, such that the options with the highest variance (and thus highest inflated scores) receive the resources that would otherwise be used to verify or falsify their premises.

  #### Boundary Cases (What Does *Not* Count)

  To ensure the term carves the concept correctly, the following scenarios are **excluded**:

  1.  **The Standard Optimizer's Curse:** A committee ranks causes where the evidence quality is roughly equal across all options, but all are noisy. The winner is likely overvalued, but there is no systematic selection of *uncertain* causes over *certain* ones.
      *   *Why it fails:* Lacks Condition 2 (Variance-Criterion Correlation). The noise is not being rewarded by a specific criterion.
  2.  **Ambiguity Aversion:** A committee explicitly penalizes causes with thin evidence (e.g., applying a "uncertainty discount" of 50% to any cause without three RCTs).
      *   *Why it fails:* Violates Condition 1 (Tail-Sensitive Scoring). The system is designed to avoid the trap.
  3.  **Strategic Goodharting:** A cause area actively lobbies the committee, producing glossy reports that manipulate the Neglectedness score without actual uncertainty.
      *   *Why it fails:* Violates Condition 3 (Epistemic Uncertainty). The ignorance is not genuine; it is manufactured. The Trap requires genuine ignorance that the system mistakes for potential.
  4.  **Exploration-Exploitation Trade-off:** A committee intentionally funds high-variance causes to learn more, fully acknowledging they may fail, with no expectation that the initial high score was accurate.
      *   *Why it fails:* Lacks the "Trap" element (Condition 4). The committee is aware of the uncertainty and does not treat the inflated score as a validation of importance. The Trap requires the *delusion* that the high score reflects true value rather than variance.

  ### 4. Application to Your Second-Order Concern

  The **Epistemic Variance Trap** specifically accounts for the research agenda distortion you described. Because the initial score is inflated by variance (Condition 1 & 2), the "high priority" causes are the ones with the thinnest evidence. When you fund a scoping study based on this priority (Condition 4), you are not testing the *best* causes; you are testing the *noisiest* causes.

  Because the scoping study is designed to validate the initial grant (confirmation bias is common in follow-on funding), it produces a citation trail that reduces the *appearance* of uncertainty without necessarily reducing the *actual* risk. The cause moves from "speculative" to "evidence-backed" in your records, but only because you poured money into generating the specific evidence required to support the initial thesis.

  You are not selecting the most important causes. You are selecting the causes where your ignorance is most easily mistaken for opportunity, and then using your own capital to convert that ignorance into a self-fulfilling prophecy. That is the **Epistemic Variance Trap**.
