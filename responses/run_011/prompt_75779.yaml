answer: |-
  Recommendation: Adopt policy (d).

  This policy requires staff to record at least one formulation of the person's difficulty in their own words before entering any category on the intake form, and mandates that this formulation, not the category, is what the group leader receives.

  We are navigating a tension between validation and scripting. One staff position holds that adopting the member's language reduces shame and accelerates help-seeking. The other holds that adopting the language replaces authentic experience with a checklist, turning the group into a venue for performing a diagnosis rather than sharing a life. Both positions are correct about the risks they identify. Policy (a) maximizes validation but surrenders the group culture to the script. Policy (c) protects the culture but risks invalidating the member's self-understanding and creates an adversarial dynamic at intake. Policy (d) accepts the utility of the category for the funder and the member's sense of legibility, but structurally prioritizes the narrative over the label.

  The strongest case for the rejected option (c) is that it is the only way to halt the looping effect. If we stop using the term, we stop teaching it to newcomers. This argument rests on the belief that our silence can be neutral, or at least protective. It also rightly flags the possibility that my own concern—and the second staff member's—is simply an old panic about contagion dressed in newer vocabulary: the fear that talking about pain spreads it, or that new language creates new symptoms where none existed. There is merit to this. If the term is functioning primarily as a social script that narrows how members perceive their own history, removing it forces a return to plain description. However, refusing the term ignores that the category is already present in the room, carried by veterans to newcomers. Banning it from staff vocabulary does not ban it from the circle; it merely removes our ability to moderate how it is used. It risks making members feel unheard at the precise moment they feel most understood by the term. Policy (d) acknowledges the term's presence without granting it authority over the intake process.

  Regarding scope, this policy adds minimal burden to our two part-time staff. It requires adding one text field to the intake form and training staff to ask, "Before we check any boxes, how would you describe this in your own words?" It does not require clinical judgment, only listening. The rotating volunteers receive the narrative summary, ensuring they see a person rather than a diagnosis. This is feasible within current capacity.

  To evaluate whether this policy is working over the next two to three years, we cannot measure clinical outcomes. Instead, we should observe:
  1.  **Intake Quality:** Are the "own words" formulations specific and varied, or do they begin to mirror the checklist language despite the requirement? (Sample 10% of forms quarterly).
  2.  **Leader Feedback:** Do group leaders report feeling better equipped to support members when given the narrative versus the category? (Annual survey).
  3.  **Retention:** Does member retention stabilize or improve? If members feel validated by the category but heard by the narrative, they should stay. If they feel patronized by the translation process, they will leave.

  **What would change my mind:**
  If a board member can demonstrate that the "own words" requirement will inevitably become a box-ticking exercise that staff complete perfunctorily because of time pressure, I would withdraw this recommendation. My reasoning relies on the assumption that staff can consistently enforce the priority of the narrative over the category. If the operational reality is that the category field gets filled and the narrative field gets ignored or skimmed by leaders, then policy (d) collapses into policy (a) with extra steps, and we gain none of the protection against scripting. In that case, policy (c) becomes the safer default, despite its risks, because it removes the tool we cannot guarantee will be used correctly.
