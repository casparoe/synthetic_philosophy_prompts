      *   *Why (d):* It captures the benefit of the label (legibility) without letting it overwrite the experience. It serves the funder (category exists) and the member (words recorded). It serves the group leader (gets the story, not just the tag).
      *   *Addressing the Counter (Option C):* The case for (c) is that we protect the culture from becoming a clinic waiting room. If the term is a script, removing it forces authenticity. This is valid. But silence is not neutral. Telling someone "don't use that word" can feel like gaslighting when that word unlocked their self-understanding. It risks driving the conversation underground where we can't monitor it.
