      *   **Problem:** A specific clinical term ("complex trauma") has migrated from clinical/online spaces into the group culture. Half of new intakes use it self-diagnostically. Staff are split (one sees it as empowering/validation, the other sees it as scripting/loss of authentic description). The Chair observes that peer support accelerates the adoption of the label (looping effect).
      *   **Philosophical Insight:** The Chair recognizes Ian Hacking's "looping effect" (categories change people) and distinguishes between (1) accuracy of the category and (2) effects of possessing the category. Also recognizes that silence/non-classification is not neutral.
      *   **Constraints:** Funder requires standardized intake categories. Staff capacity is limited (2 part-time, volunteers). No academic references/reading lists.
      *   **Task:** Draft a short memo to the board (7 members total including Chair) for circulation before Thursday.
      *   **Decision:** Choose among four policies:
          *   (a) Use openly in intake/outreach.
          *   (b) Permit internally, strip from public/outreach.
          *   (c) Decline use, redirect to plain description.
          *   (d) Use it, *but* require staff to record at least one formulation in the person's own words *before* categorizing, and share *that* with group leaders (not the category).
      *   **Preference:** Chair is drawn to (d) but wants honest analysis recommending whichever survives scrutiny.
      *   **Format:**
