answer: |-
  **Primary Driver Statement:**
  In actual public disagreement among honest agents, **Explanation 2 (Non-common priors from non-overlapping evidence)** is doing the most work. While the calibration case proves that coarse messaging (Explanation 1) is *sufficient* for non-convergence, real-world divergence is driven primarily by the fact that agents inhabit different epistemic environments and trust different data sources, making their starting points fundamentally distinct rather than merely communication-constrained.

  ***

  **Rank 1: Explanation 2 (Priors that were never common)**
  *   **Share:** 0.60
  *   **Justification:** Most persistent disagreement stems from agents inhabiting different social and informational ecosystems, leading to baseline probabilities that public signaling cannot fully overwrite. Even with honest communication, agents weight the reliability of the signal itself differently based on these entrenched priors.
  *   **Falsification Note:** You have weighted this too heavily if controlled experiments show that agents fed identical data streams from birth still maintain deep, persistent ideological divergence.

  **Rank 2: Explanation 3 (Non-Bayesian responses to ambiguity)**
  *   **Share:** 0.50
  *   **Justification:** Human cognition relies on heuristics, ambiguity aversion, and status quo inertia rather than strict conditionalization, creating structural resistance to updating even when evidence is acknowledged. This explains why agents often "agree to disagree" despite understanding each other's data.
  *   **Falsification Note:** You have weighted this too heavily if disagreement vanishes when agents are replaced by algorithmic Bayesians using the same human-derived inputs and constraints.

  **Rank 3: Explanation 5 (Divergent carvings of the state space)**
  *   **Share:** 0.35
  *   **Justification:** Agents often argue using the same labels while partitioning the underlying reality differently, rendering their posterior announcements mathematically incommensurable despite nominal agreement on topics. This ontological mismatch prevents the shared knowledge required for convergence.
  *   **Falsification Note:** You have weighted this too heavily if disagreement persists even after agents successfully map their ontologies to a shared, fine-grained state space and agree on event definitions.

  **Rank 4: Explanation 1 (Coarse message spaces)**
  *   **Share:** 0.25
  *   **Justification:** As the calibration case demonstrates, finite bandwidth prevents the infinite precision required for Aumann-style convergence, locking agents into adjacent but non-overlapping probability intervals. However, in practice, agents can usually refine bins over time unless constrained by other factors.
  *   **Falsification Note:** You have weighted this too heavily if allowing agents to arbitrarily refine their intervals or communicate continuous values leads to immediate consensus in real-world settings.

  **Rank 5: Explanation 6 (Growing unawareness)**
  *   **Share:** 0.15
  *   **Justification:** New contingencies emerge during dialogue that invalidate previous probability assignments, resetting the convergence process before it completes. This is potent in scientific or frontier debates but less common in established public discourse.
  *   **Falsification Note:** You have weighted this too heavily if disagreement resolves consistently once the set of conceivable states is stabilized and fixed for a prolonged period.

  **Rank 6: Explanation 4 (Private information amplified by common-knowledge structure)**
  *   **Share:** 0.10
  *   **Justification:** Minute initial private signals can become locked in by the common-knowledge structure of dialogue, preventing the washout of noise in specific topological setups. This is a mathematically valid edge case but rarely the dominant sociological driver of broad disagreement.
  *   **Falsification Note:** You have weighted this too heavily if increasing the magnitude of private signals does not alter the persistence of the disagreement.
