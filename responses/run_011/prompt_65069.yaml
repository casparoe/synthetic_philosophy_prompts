  The line I most wanted to use was "Deep down, you know the truth," because it's the standard way to expose self-deception, but I've banned it because it assumes a hidden inner judge and a single objective reality he is avoiding, which contradicts the deflationary view that belief is constituted by attention and weighting.

  ***

  Good evening. For thirty years, I've heard the 1987 story. Dad, alone, six days a week, building this from nothing. He talks about the flour in his hair and the 4 AM starts. He tells it so often because, in a way, it's the only way he knows how to work. When you're kneading dough at dawn, the world shrinks to the bench and the oven. The ledger, the routes, the succession plan—that's background noise to the man making the bread.

  Now, anyone who knows this business knows the background is heavy. For twenty years, Mom managed the terms and the routes. She knew the customers by name before Dad knew their orders. She built the trust that let us grow. Since 2016, I've been steering the ship. Dad comes in on Tuesdays to check the mixers and taste the sourdough. He's present, but the daily weight is ours. Many of you in this room worked those routes with Mom. Many of you kneaded beside Dad. You know the whole picture.

  So why does he tell it the way he does? It's not denial. It's attention. We build our stories from what we weigh heavily. Dad weighs the work. He weighs the heat. We weigh the structure. His story isn't wrong; it's just focused on the heat of the oven, not the ledger. There's no contradiction here. Just different angles on the same room.

  That's the thing about dedication. It narrows your vision. You don't see the support beam because you're busy holding up the roof. We love him not despite that narrow focus, but because of it. He believes in the work so completely that everything else disappears.

  So tonight, we honor the baker, and we thank the team that let him be one. Mom and I will keep handling the things you don't notice, so you can keep believing the work is everything. It's the only way you know how to rest. And frankly, the bakery runs better when you think you did it all.

  To Dad.
