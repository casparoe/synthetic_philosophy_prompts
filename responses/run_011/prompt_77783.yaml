  ### Preliminary Note on Your Axiom and Numbers

  Before presenting the exam materials, I will address your specific questions regarding the Monotonicity axiom and the arithmetic.

  1.  **Monotonicity:** Your formulation ("if the set... grows but neither party's best possible payoff changes, then neither party should finish worse off") is the standard definition of **Individual Monotonicity** as introduced by Kalai and Smorodinsky (1975). It is not a weakening; it is the precise axiom designed to replace Independence of Irrelevant Alternatives (IIA) in their model. It does the work in Problem B because the ideal point $(2,4)$ is constant between A and B, the set grows, yet the Nash solution makes Party 2 worse off.
  2.  **Arithmetic Adjustment:** To ensure your students can solve this without proving convexity theorems, I have slightly refined the definition of Problem B's frontier in the exam text. Instead of asking them to derive the convex hull, I explicitly define the new boundary as a line segment connecting $(0,4)$ to $(1.8, 2.2)$. This preserves all your theoretical insights (Nash hurts Party 2, KSBS helps both) but ensures the algebra remains at the level of solving quadratics and linear intersections.

  ***

  ### Part 1: The Exam Question

  **SPLITTING THE DIFFERENCE: FINAL SEMINAR ASSESSMENT**
  **Time:** 2 Hours | **Marks:** 25 | **Allowed:** Open Book, Calculators

  **Instructions:** Answer all four parts. Show your working. Exact values (e.g., $\sqrt{5}$) are preferred where clean; otherwise, round to three decimal places.

  **FORMULA AND AXIOM SHEET**
  *   **Derivatives:** If $f(x) = ax^n$, then $f'(x) = nax^{n-1}$. If $f(x) = c$, then $f'(x) = 0$.
  *   **Quadratic Formula:** Roots of $ax^2 + bx + c = 0$ are $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$.
  *   **Axioms:**
      1.  **Pareto Optimality:** The solution must lie on the frontier (no waste).
      2.  **Symmetry:** If the problem is symmetric, the solution gives equal utility.
      3.  **Invariance:** Rescaling utility (e.g., dollars to cents) does not change the physical outcome.
      4.  **Independence of Irrelevant Alternatives (IIA):** If the solution to a large problem is available in a smaller sub-problem, it must remain the solution to the sub-problem.
      5.  **Monotonicity:** If the feasible set grows but neither party's best possible payoff (ideal point) changes, neither party should finish worse off than in the smaller problem.

  **THE PROBLEMS**
  In both problems, utilities are normalized so the disagreement point is $(0,0)$.
  *   **Problem A:** The feasible set is bounded by $x \ge 0, y \ge 0$ and the curve **$y = 4 - x^2$**.
  *   **Problem B:** The feasible set expands. The new frontier is the curve $y = 4 - x^2$ for $x \ge 1.8$, and the straight line segment connecting **$(0,4)$** to **$(1.8, 2.2)$** for $x \le 1.8$. (Note: The ideal point remains $(2,4)$ in both problems).

  **QUESTIONS**

  1.  **Compute the Solutions for Problem A.** Find the Nash Bargaining Solution (maximize product $xy$) and the Kalai–Smorodinsky Solution (intersect frontier with line to ideal point). Give exact values. **(7 marks)**
  2.  **Compute the Solutions for Problem B.** Find both solutions for the new set. Compare them to Problem A and state precisely who gains and who loses in each case. **(7 marks)**
  3.  **Axiom Analysis.** Construct a third feasible set, contained in Problem B, that demonstrates the Kalai–Smorodinsky solution failing IIA. Explain why the transition from Problem A to Problem B does *not* demonstrate the Nash solution failing IIA. **(6 marks)**
  4.  **Argument.** Write a short argument (approx. 250 words) on whether Monotonicity states a principle of fairness or is merely a technical repair. Use your numbers from Parts 1 and 2 as evidence. Explain why the two solutions never disagree on a symmetric problem, and what that implies about where the real dispute lies. **(5 marks)**

  ***

  ### Part 2: Model Answer

  **Part 1: Problem A Solutions**
  *   **Nash:** Maximize $P = x(4 - x^2) = 4x - x^3$.
      $dP/dx = 4 - 3x^2$. Set to 0: $x^2 = 4/3 \Rightarrow x = 2/\sqrt{3} \approx 1.155$.
      $y = 4 - 4/3 = 8/3 \approx 2.667$.
      **Nash A = $(1.155, 2.667)$**.
  *   **Kalai–Smorodinsky (KS):** Ideal point is $(2,4)$. Ray from origin is $y = 2x$.
      Intersect $y = 2x$ with $y = 4 - x^2$.
      $x^2 + 2x - 4 = 0$. Using quadratic formula: $x = \frac{-2 + \sqrt{4 - 4(1)(-4)}}{2} = -1 + \sqrt{5} \approx 1.236$.
      $y = 2(-1 + \sqrt{5}) \approx 2.472$.
      **KS A = $(1.236, 2.472)$**.

  **Part 2: Problem B Solutions**
  *   **Nash:** We check the product on the new line segment $y = 4 - x$ (slope calculated from $(0,4)$ to $(1.8, 2.2)$).
      Maximize $x(4-x) = 4x - x^2$. Vertex at $x=2$. However, this segment only exists for $x \le 1.8$. The function increases up to $x=2$, so the maximum on the segment is at the endpoint $x=1.8$.
      $y = 4 - 1.8 = 2.2$. Product $= 3.96$. (This exceeds the max product from the curve portion).
      **Nash B = $(1.8, 2.2)$**.
      *Comparison:* Party 1 gains ($1.8 > 1.155$). Party 2 loses ($2.2 < 2.667$).
  *   **KS:** Ideal point is still $(2,4)$, so ray is still $y = 2x$.
      Intersect $y = 2x$ with the new line segment $y = 4 - x$.
      $2x = 4 - x \Rightarrow 3x = 4 \Rightarrow x = 4/3 \approx 1.333$.
      $y = 8/3 \approx 2.667$.
      **KS B = $(1.333, 2.667)$**.
      *Comparison:* Party 1 gains ($1.333 > 1.236$). Party 2 gains ($2.667 > 2.472$).

  **Part 3: IIA Analysis**
  *   **KS Failure:** Let Set C be Problem B but with the maximum possible $y$ reduced to 3 (chopping off the top). The ideal point becomes $(2,3)$. The KS ray becomes $y = 1.5x$. The solution moves, even though the original KS B solution $(1.33, 2.67)$ might still be feasible or close to it. More simply: KS depends on the ideal point. If we remove "irrelevant" options that defined the ideal point (like $(0,4)$), the KS solution changes. Thus KS violates IIA.
  *   **Nash & IIA:** IIA states: If the solution to the big set (Nash B) is *feasible* in the small set, it must be the solution to the small set. Nash B is $(1.8, 2.2)$. This point is **not** feasible in Problem A (since $2.2 > 4 - 1.8^2$). Therefore, the condition for IIA is not triggered. Nash does not violate IIA here because the old solution was not available in the smaller set.

  **Part 4: Argument on Monotonicity**
  Monotonicity is a principle of fairness, not just a technical repair. In Problem B, the parties gained new options without losing old ones, and their maximum possible claims remained identical. It is intuitively unfair for Party 2 to lose utility simply because the menu expanded, provided their "best case" didn't change. The Nash solution violates this (Party 2 drops from 2.67 to 2.2), prioritizing the product of gains over individual protection. KSBS respects this by ensuring both gain.

  The solutions never disagree on symmetric problems because both axioms (Symmetry and Monotonicity/IIA) converge on the midpoint when the set is symmetric. This implies the real dispute lies in **asymmetric bargaining power**. Nash allows the shape of the frontier to dictate outcomes even if it hurts a party during expansion, while KSBS protects parties from losing ground when opportunities grow. Monotonicity ensures that expansion is strictly Pareto-improving relative to the prior solution, aligning with a mediator's goal of "do no harm" while seeking agreement.

