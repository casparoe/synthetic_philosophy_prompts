      *   *Is there a way out?* Some contemporary Molinists (Plantinga, etc.) argue for "truths of reason" or abstract objects, but in the 1600s context, this was the kill shot. If the truth depends on the decree, it's not "middle." If it doesn't, it's ungrounded.
