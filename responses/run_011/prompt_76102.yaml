  Subject: Re: The Invertebrate Count

  Hey, sorry for the delay, I've been running the numbers on this myself and I think I can help you break the deadlock. My credence that more than half of phenomenally conscious subjects on Earth are invertebrates is 0.58. I know that sits between you and Dev, but I think it reflects the massive numerical advantage insects hold if they are conscious at all, tempered by the genuine uncertainty about whether their neural hardware supports subjecthood. To get there, I broke the problem down into the five pieces you asked for, starting with the chance that at least one invertebrate lineage is conscious at all, which I put at 0.9 because the behavioral complexity of cephalopods and crabs is too rich to be dismissed as mere nociception. Given that some invertebrates are conscious, the chance that this includes the hyper-abundant groups like flies and ants rather than just the sparse clever ones is 0.7, since functional convergence in navigation and social organization suggests experience is useful even for small brains. The chance that counting individual organisms is the right unit rather than subject-moments is 0.8, because while temporal density varies, counting heads is the only robust proxy we have for distinct subjects at a given moment. I assign a 0.7 probability that the question is determinate rather than hopelessly blurred, acknowledging vagueness but assuming a binary distinction exists for population-level estimates. Finally, I give only a 0.3 chance that Dev is right about there being no truth value independent of theory, because while definitions vary, the existence of an inner life is likely a fact of the world rather than a linguistic convention.

  I combine these by treating the existence of a truth value and the inclusion of abundant groups as the primary conjunctive gates, multiplying the 0.7 chance that the question is real by the 0.7 chance that insects are inside the circle, which gives a baseline of 0.49, and then nudging it upward because the certainty that some invertebrates are conscious pushes the odds that the abundant ones are too. The number is most fragile on the second term, the chance that abundant groups are included, because if insects and copepods are excluded, the sheer numerical weight of vertebrates and cephalopods alone cannot sustain the claim that invertebrates are the majority. To shift my credence by ten points in either direction, I would need evidence of specific neural correlates of consciousness under anesthesia in insects, such as showing that their central complexes exhibit global integration signatures that vanish during unconsciousness rather than just showing behavioral sleep states. Regarding Dev's closing argument, he is technically correct that octopuses are a bad wedge for flies because their decentralized nervous systems solve integration differently, but he is wrong to imply this licenses nothing at all since the octopus case proves consciousness does not require a vertebrate brain architecture, which lowers the bar for flies even if the specific mechanism differs.

  Looking at your standoff, the disagreement between your 0.75 and Dev's 0.05 is almost certainly located in the first and second components, specifically the prior on whether complex behavior implies experience and the leap from cephalopods to insects. Dev is likely assigning near-zero probability to the idea that a fly has a subjective interior, treating them as philosophical zombies until proven otherwise, while you are weighting the functional similarities and the evolutionary utility of consciousness much more heavily. You are also probably discounting his meta-claim about truth values more than he is, assuming realism about consciousness where he sees only theory-laden interpretation. If you can pin him down on whether he denies consciousness to crabs as well as flies, you might isolate whether his skepticism is about invertebrates generally or just the abundant ones, which would tell you if you are fighting over biology or metaphysics.
