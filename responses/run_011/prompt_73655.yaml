prompt: |-
  I run the standards desk at a national heritage and tourism board, and I need a working procedure rather than an argument. Three things come across my desk every week: applications from tour operators, municipalities, food producers, regional museums, and festival committees for our official Heritage Experience listing; copy for the national tourism website and the visitor app; and proposals for segments of the national-day broadcast. In nearly all of them the selling point is age and continuity — a ceremony that predates written record, a dish cooked the same way for five centuries, a festival held without interruption, a national costume unchanged across generations. The volume is roughly sixty listing applications a year plus several hundred pieces of copy. My staff are three editors with no training in history, and each application gets about ninety minutes before it goes to a five-person committee for sign-off: two academic historians who distrust the entire certification enterprise, one industry representative who wants approvals, our legal officer, and me. We have been criticised in the press twice for certifying claims that turned out to be products of the last century, and the legal officer's constraint is that we may not publish findings that call an applicant's claim false. We only control what we ourselves say.

  Please write the procedure my desk can run on an application, grounded in Hobsbawm and Ranger's account of invented tradition and in Anderson's account of imagined communities. From the first I want the distinction between invented tradition — invariant, ritualised, asserting a continuity with the past that is largely factitious — and custom, which is adaptable and serves practical ends, together with the observation that bursts of invention cluster at moments when older social fabrics are breaking up. From the second I want the point that a community larger than face-to-face is imagined without being for that reason false, the modularity of national forms, the role of print in fixing them, and the census–map–museum apparatus through which states manufacture heritage. Tell me plainly where the procedure is borrowing beyond what these authors intended: Anderson was not writing an authentication toolkit, and I want to know which of my tests would misrepresent him if I claimed his authority for them.

  Deliver, in this order: an ordered sequence of tests, each with the question the editor asks, what counts as a sufficient answer, what an insufficient answer triggers, and a rough time cost, plus a note on why the tests sit in that order and where an application can be short-circuited to save the ninety minutes; a short label vocabulary the desk can attach to a claim — something on the lines of continuous, adapted, revived, reconstructed, invented while claiming antiquity, and invented without claiming antiquity — with the rule for which labels may be listed and under what public wording; three or four approved sentence templates for our own copy that stay truthful without calling anyone a liar; an explicit marking of the points where the procedure stops and hands the case to the committee because what remains is a question of value or policy rather than fact; and a candid list of which steps are judgment calls dressed up as procedure, above all the choice of how old an invention must be before it becomes a tradition.

  Tests I would expect to see, though you should revise, drop, or add: the first-attestation date of the practice as distinct from the first-attestation date of the claim that it is ancient; who codified, choreographed, or wrote it down, and when; whether the form matches a template that appears in unrelated regions within the same decade; whether invariance is itself a marker of recency, so that a practice which has not drifted may be younger than one which has; dependence on a rulebook, script, published collection, newspaper campaign, or broadcaster; the size of the coeval community the claim asks an audience to imagine; whether the heritage exists chiefly in state inventories, museum cases, and protected-status files; and who gains from certification, which should raise the evidentiary bar rather than settle anything.

  The procedure must handle these hard cases explicitly: an invention now itself a hundred and thirty years old; a form imposed by a colonial administration and subsequently adopted as the community's own; a food claim where the ingredients are ancient but the prepared dish is documented only from the 1930s, so the age of the substrate must be separated from the age of the practice; and an oral tradition from a dispossessed community with no documentary trail whatever. On the last of these the procedure must state outright that absence of documentation is not evidence of invention, and say what to do instead.

  Then run it on three applications, supplying the analysis yourself from the facts I give. First: a highland gathering festival whose earliest documentation is a 1908 handbill from a railway company's promotional office, held continuously since 1946, whose programme of competitive dance, livestock judging, mass singing, and a closing beacon-lighting by a local dignitary matches formats that appear in at least three other regions of the country within the same decade, and whose applicant copy asserts the festival predates any written record. Second: a woven garment the broadcast proposes to describe as worn continuously for five centuries, where the weave technique appears in regional archaeological material, but the garment's cut, its colour coding, and its association with national dress all trace to a craft-revival school founded in the 1920s. Third, and the one I expect to lose: our own flagship asset, the costume the board has promoted for forty years as the ancient national dress, which as I understand it was designated in the 1930s by a state committee that selected and standardised elements from several regional variants; if the procedure requires us to reword our own materials, say so and draft the replacement copy.

  Finally, tell me what the procedure cannot do: where it cannot distinguish an invented tradition from a revived one on the evidence typically available, why it will systematically misfire on oral traditions even with the safeguard above, and why it cannot answer the question the committee will actually fight over, which is whether an invented tradition deserves listing once it has taken root. I do not want a bibliography, a reading list, or citations of any kind; my staff will never read the originals. I want tests, labels, wording, and the places where the tests run out.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Standards Desk at a National Heritage and Tourism Board.
      *   **Task:** Create a working procedure for vetting heritage claims (listings, website copy, broadcast segments).
      *   **Constraints:**
          *   Staff: 3 editors (no history training), 90 mins per application.
          *   Committee: 2 historians (skeptical), 1 industry rep (approvals), 1 legal (no false claims), 1 me (chair).
          *   Legal: Cannot publish findings that call a claim *false*. Only control our own wording.
          *   Theoretical Basis: Hobsbawm & Ranger (Invented Tradition vs. Custom) and Anderson (Imagined Communities).
          *   Requirement: Explicitly state where the procedure borrows beyond authorial intent (especially Anderson).
          *   Deliverables: Ordered sequence of tests (question, sufficient/insufficient answer, trigger, time cost, logic/short-circuit), Label Vocabulary (with public wording rules), Sentence Templates, Hand-off Points to Committee, Candid List of Judgment Calls.
          *   Hard Cases to Handle: 130-year-old invention, Colonial imposition adopted by community, Food (ancient ingredients vs. recent dish), Oral tradition (no docs).
          *   Case Studies: Highland Gathering (1908 railway promo, continuous since 1946, modular format), Woven Garment (ancient weave, 1920s cut/color), Flagship Costume (1930s state standardisation).
          *   Limitations: What the procedure *cannot* do.
          *   Forbidden: No bibliography, reading list, or citations.

  2.  **Deconstruct the Theoretical Framework:**

      *   **Hobsbawm & Ranger:**
          *   *Invented Tradition:* Ritual/symbolic, implies continuity with past, actually recent, invariant (rigid), often arises during social disruption.
          *   *Custom:* Pragmatic, adaptable, open to change.
          *   *Application:* Look for rigidity, recent codification, and claims of ancient continuity that don't match evidence.
      *   **Anderson:**
          *   *Imagined Community:* Nation is imagined (members don't know each other), not false.
          *   *Modularity:* National forms can be copied (flags, anthems, festivals).
          *   *Print/Census/Map/Museum:* State apparatus fixes heritage.
          *   *Constraint:* Anderson isn't providing an authentication toolkit. Using him to judge "truth" misrepresents him. He explains *how* nations form, not whether a specific claim is historically accurate. I need to flag this clearly.

  3.  **Drafting the Procedure (The Tests):**

      *   *Goal:* Filter applications in 90 minutes.
      *   *Order:* Cheapest/Easiest checks first to save time.
      *   *Test 1: The Claim vs. The Date.* (First attestation of practice vs. first attestation of the *claim* of antiquity).
      *   *Test 2: Codification.* (Who wrote it down? When? Rulebooks?).
      *   *Test 3: Modularity.* (Does it look like other things made at the same time elsewhere?).
      *   *Test 4: Invariance.* (Has it changed? Too much stability suggests recent freezing).
      *   *Test 5: State Apparatus.* (Does it exist mainly in museums/inventories?).
      *   *Test 6: Beneficiaries.* (Who gains? Raises the bar).
      *   *Hard Case Integration:* Oral traditions need a specific path (Test 7).
      *   *Time Management:* Need to allocate the 90 mins.
      *   *Short-circuit:* If a claim is obviously safe (e.g., doesn't claim antiquity) or obviously problematic (claim contradicts hard data), move faster.

  4.  **Drafting the Label Vocabulary:**

      *   Need terms that are accurate but legally safe.
      *   *Continuous:* Unbroken, documented.
      *   *Adapted:* Changed over time.
      *   *Revived:* Stopped, started again.
      *   *Reconstructed:* Pieced together from evidence.
      *   *Invented (Claiming Antiquity):* The danger zone.
      *   *Invented (No Antiquity Claim):* Safe.
      *   *Rules:* What can be published? "Heritage Experience" vs. "Historical Fact."

  5.  **Drafting Sentence Templates:**

      *   Must avoid calling anyone a liar (Legal constraint).
      *   Must reflect the nuance (Anderson/Hobsbawm).
      *   Focus on *significance* rather than *age*.

  6.  **Identifying Hand-off Points:**

      *   Where does fact end and policy begin?
      *   When the evidence is ambiguous.
      *   When the "value" of the tradition outweighs the "accuracy."
      *   When the Board's own assets are implicated.

  7.  **Identifying Judgment Calls:**

      *   How old is "traditional"?
      *   Oral tradition weighting.
      *   Colonial adoption (is it authentic now?).

  8.  **Running the Case Studies:**

      *   *Case 1 (Highland Gathering):* 1908 handbill (Railway). Continuous since 1946. Modular format (matches 3 others). Claim: Predates written record.
          *   *Verdict:* Invented Tradition claiming antiquity. Fail the claim, pass the event as cultural heritage.
      *   *Case 2 (Woven Garment):* Ancient weave, 1920s cut/color. Claim: 5 centuries continuous.
          *   *Verdict:* Hybrid. Ancient technique, modern form. Label: Adapted/Revived.
      *   *Case 3 (Flagship Costume):* 1930s State Committee. Standardised. Promoted as ancient for 40 years.
          *   *Verdict:* Invented Tradition (State-led). Must reword. This is the political minefield.

  9.  **Defining Limitations:**

      *   Can't distinguish revived vs. invented without deep archives.
      *   Oral traditions will always be "unproven" by this documentary method.
      *   Can't answer "Does this deserve listing?" (That's the Committee's job).

  10. **Refining and Polishing:**

      *   *Tone:* Professional, procedural, candid, authoritative but humble about limits.
      *   *Anderson Warning:* Ensure the section on where I'm misusing Anderson is clear.
      *   *Formatting:* Use the requested order (Tests, Labels, Templates, Hand-offs, Judgment Calls, Case Studies, Limitations).
      *   *Check Constraints:* No citations. 90-minute limit respected. Legal constraint honored (don't call them liars).

  11. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Anderson section too academic?
      *   *Fix:* Keep it practical. "Don't use Anderson to prove falsehood."
      *   *Critique:* Is the Oral Tradition test robust enough?
      *   *Fix:* Explicitly state that lack of docs $\neq$ false. Shift burden of proof to *internal consistency* and *community testimony* rather than external documents.
      *   *Critique:* The Flagship Costume case needs to be handled delicately.
      *   *Fix:* Draft the replacement copy to save face but tell the truth. Focus on "National Symbol" rather than "Ancient Garment."

  12. **Final Polish:** Check against the prompt's specific list of expected tests (first-attestation, codification, modularity, invariance, rulebook, community size, state inventory, beneficiaries). Ensure all are integrated.

  *(Self-Correction on Anderson)*: The prompt asks me to tell them plainly where the procedure borrows beyond what the authors intended. I need a specific section or note for this. I will integrate this into the introduction of the tests and the "Judgment Calls" section.

  *(Self-Correction on Time)*: 90 minutes total. The tests need to sum to less than that to allow for writing the report. Let's aim for 60 mins of testing, 30 mins of drafting/decision.

  *(Self-Correction on Legal)*: The legal officer says "we may not publish findings that call an applicant's claim false." We only control what *we* say. So the labels and templates must be positive assertions of *our* classification, not negations of *their* claim.

  Let's assemble the document.cw
answer: |-
  **STANDARDS DESK OPERATING PROCEDURE: HERITAGE CLAIMS VETTING**

  **Objective:** To assess heritage claims for accuracy and classification within 90 minutes, ensuring legal compliance and theoretical consistency without making public accusations of falsehood.
  **Theoretical Basis:** Hobsbawm & Ranger (Invented Tradition vs. Custom); Anderson (Imagined Communities).
  **Constraint:** We control our own wording, not the applicant's. We do not publish findings that label an applicant a liar.

  ---

  ### 1. SEQUENCE OF TESTS

  **Total Time Allocation:** 60 minutes for testing, 30 minutes for reporting/labeling.
  **Logic of Order:** Tests are ordered from lowest cost (document search) to highest cost (contextual analysis). An application is short-circuited to the Committee if any test triggers a "Policy Review" flag.

  **Test 1: The Attestation Gap**
  *   **Question:** What is the first documented date of the *practice* versus the first documented date of the *claim* that the practice is ancient?
  *   **Sufficient Answer:** Dates match, or the claim of antiquity post-dates the practice by less than one generation (25 years).
  *   **Insufficient Answer:** The claim of antiquity appears significantly later than the practice (e.g., practice starts 1900, claim of "timelessness" starts 1950).
  *   **Trigger:** If the gap is >50 years, apply label **Revived** or **Invented**.
  *   **Time Cost:** 10 minutes.
  *   **Note:** This is the primary filter. If the claim of age is demonstrably newer than the activity, the "continuity" claim fails.

  **Test 2: Codification and Rulebooks**
  *   **Question:** Who wrote down the rules, choreography, or recipe, and when? Is there a manual, script, or published collection?
  *   **Sufficient Answer:** Oral transmission confirmed, or documentation is incidental (diaries, letters) rather than prescriptive.
  *   **Insufficient Answer:** Existence of a rulebook, syllabus, or official choreography dated to a specific year.
  *   **Trigger:** If a codifying document exists, apply label **Reconstructed** or **Invented**.
  *   **Time Cost:** 10 minutes.
  *   **Note:** Hobsbawm notes invented traditions are often rigidly codified to enforce invariance.

  **Test 3: Modularity Check**
  *   **Question:** Does the form (festival structure, costume cut, ceremony script) match templates appearing in unrelated regions within the same decade?
  *   **Sufficient Answer:** Unique local variation; evolution is organic.
  *   **Insufficient Answer:** Identical structure found in 3+ other regions established within a 10-year window (e.g., railway promotions, state centennials).
  *   **Trigger:** If modular, apply label **Invented**.
  *   **Time Cost:** 15 minutes.
  *   **Note:** Anderson argues national forms are modular. If it looks like a copy-paste national template, it is likely state-manufactured heritage.

  **Test 4: Invariance vs. Drift**
  *   **Question:** Has the practice changed?
  *   **Sufficient Answer:** Evidence of adaptation to materials, weather, or audience (Custom).
  *   **Insufficient Answer:** Claim of "unchanged for centuries" supported by evidence that the practice has been rigidly fixed since a recent date.
  *   **Trigger:** High invariance + Recent start date = **Invented Tradition**.
  *   **Time Cost:** 10 minutes.
  *   **Note:** A practice that has not drifted is often younger than one that has. Rigidity suggests recent freezing.

  **Test 5: The State Apparatus**
  *   **Question:** Does the heritage exist chiefly in state inventories, museum cases, or protected-status files rather than daily life?
  *   **Sufficient Answer:** Practice is functional in the community (eaten, worn, used).
  *   **Insufficient Answer:** Practice is performed primarily for tourists, cameras, or archive preservation.
  *   **Trigger:** If primarily archival, apply label **Reconstructed**.
  *   **Time Cost:** 5 minutes.
  *   **Note:** Anderson's "Census-Map-Museum" apparatus manufactures heritage. If it lives in the museum, it is curated, not organic.

  **Test 6: Beneficiaries and Stakeholders**
  *   **Question:** Who gains from certification (Tourism Board, specific vendor, political group)?
  *   **Sufficient Answer:** Community-wide benefit, diffuse ownership.
  *   **Insufficient Answer:** Single commercial entity or specific political faction gains exclusive branding rights.
  *   **Trigger:** Raise evidentiary bar. Require two additional sources for attestation.
  *   **Time Cost:** 5 minutes.
  *   **Note:** High commercial stake increases the likelihood of invented antiquity.

  **Test 7: The Oral Tradition Safeguard (Hard Case)**
  *   **Question:** Is this an oral tradition from a dispossessed community with no documentary trail?
  *   **Sufficient Answer:** Consistent community testimony, internal coherence, intergenerational transmission verified by elders.
  *   **Insufficient Answer:** Absence of documentation.
  *   **Trigger:** **Absence of documentation is NOT evidence of invention.** Proceed to Committee with label **Continuous (Oral)** but note the evidentiary limit.
  *   **Time Cost:** 5 minutes.
  *   **Note:** Documentary bias penalizes non-literate cultures. We cannot use the lack of paper to disprove age.

  **Short-Circuit Rule:**
  *   If Test 1 (Attestation Gap) confirms the claim is accurate, skip Tests 2–5. Proceed to labeling.
  *   If Test 1 proves the claim is impossible (e.g., claims 15th century, first record 1950), skip to Committee with **Invented** recommendation.
  *   If the application makes no claim of antiquity (e.g., "Established 1990"), skip all tests. Auto-approve as **Contemporary**.

  ---

  ### 2. LABEL VOCABULARY AND PUBLIC WORDING

  **Internal Labels (For Committee Use):**
  *   **Continuous:** Unbroken practice, documented or oral, claim matches evidence.
  *   **Adapted:** Old core, modified over time (Custom).
  *   **Revived:** Lapsed, restarted later.
  *   **Reconstructed:** Pieced together from fragments/archives.
  *   **Invented (Antiquity Claim):** Recent origin, claims old age. (High Risk).
  *   **Invented (No Antiquity Claim):** Recent origin, honest about age.

  **Public Labels (For Website/Listings):**
  *   *Rule:* Never publish the Internal Labels "Invented" or "Reconstructed" next to a claim of antiquity. Use the Sentence Templates below.
  *   *Allowed Public Tags:* "Heritage Listed," "Cultural Significant," "Historic," "Traditional."
  *   *Forbidden Public Tags:* "Ancient" (unless verified >200 years), "Unchanged," "Original."

  **Selection Rule:**
  *   **Continuous/Adapted:** May be listed as "Traditional."
  *   **Revived/Reconstructed:** Must be listed as "Heritage Practice" without age qualifiers.
  *   **Invented (Antiquity Claim):** May be listed *only* if the copy is rewritten to remove the age claim. If the applicant refuses copy changes, refer to Committee for rejection based on "Accuracy Standards," not "Falsehood."

  ---

  ### 3. APPROVED SENTENCE TEMPLATES

  **Goal:** Truthful copy that does not accuse the applicant of lying.

  1.  **For Verified Ancient Practices:**
      *   "Rooted in the [Region] community since the [Century], this practice remains a vital expression of local identity."
  2.  **For Revived/Reconstructed Practices:**
      *   "A cornerstone of [Region] cultural life, this tradition draws on historical techniques to celebrate our shared heritage today."
      *   *Why:* "Draws on" implies connection without promising continuity.
  3.  **For Invented Traditions (State/Modern):**
      *   "Established as a national symbol in the [Decade], this [object/event] unites the community in a shared vision of the past."
      *   *Why:* Acknowledges the start date ("Established") while validating the function ("Unites").
  4.  **For Oral Traditions (No Docs):**
      *   "Preserved through generations of oral history, this practice embodies the enduring memory of the [Community] people."
      *   *Why:* Validates the transmission method without making a documentary claim.

  ---

  ### 4. HAND-OFF POINTS TO COMMITTEE

  The Desk stops analysis and hands the case to the Committee when:

  1.  **Value vs. Fact:** The evidence suggests the claim is "Invented," but the practice is culturally significant and popular. (The Committee must decide if utility outweighs accuracy).
  2.  **Colonial Adoption:** A form was imposed by a colonial administration but is now claimed as indigenous. (This is a political/policy question, not a factual one).
  3.  **Board Assets:** The claim implicates the Board's own past marketing or flagship assets. (Conflict of interest requires Committee policy decision).
  4.  **Ambiguous Evidence:** Test 1–6 yield conflicting results (e.g., oral history says ancient, documents say recent). (Requires historian judgment).

  ---

  ### 5. CANDID LIST OF JUDGMENT CALLS

  **Warning:** These steps are procedure dressed as fact. Staff must acknowledge them as such.

  1.  **The Age Threshold:** We treat 100 years as "tradition" and 50 years as "recent." There is no historical basis for this cutoff; it is an administrative convenience.
  2.  **Documentary Privilege:** Tests 1–5 privilege written records. This systematically disadvantages oral cultures. Test 7 attempts to correct this, but the bias remains in the weighting.
  3.  **The "Community" Definition:** We accept "Community" as defined by the applicant. We do not verify if the "community" actually exists or agrees. (Borrowing from Anderson: we accept the imagination of the community without verifying its reality).
  4.  **Misuse of Anderson:** We use Anderson's concept of "Imagined Communities" to validate modern inventions as "national symbols." Anderson did not intend this as an authentication toolkit; he described how nations form, not how to certify them. Using his theory to grant "Heritage" status turns a sociological observation into a seal of approval.
  5.  **The "Living" Bias:** We favor practices that are currently performed. A dead tradition is treated as less "authentic" than a living invented one. This is a tourism bias, not a historical one.

  ---

  ### 6. CASE STUDY ANALYSIS

  **Case 1: Highland Gathering Festival**
  *   **Facts:** Earliest doc 1908 (Railway handbill). Continuous since 1946. Format matches 3 other regions (Modular). Claim: Predates written record.
  *   **Analysis:**
      *   Test 1 (Attestation): Gap between 1908 and "predates written record." Fail.
      *   Test 3 (Modularity): Matches railway promo formats elsewhere. Fail.
      *   Test 4 (Invariance): Continuous since 1946, but 1908 start suggests interruption or rebranding.
  *   **Verdict:** **Invented (Antiquity Claim).**
  *   **Action:** Reject the claim of pre-writing origin. Offer listing under **Revived** or **Heritage Practice**.
  *   **Copy Template:** "Established in the early 20th century as a celebration of highland culture, this gathering continues a vital tradition of community competition." (Do not use "Ancient").
  *   **Committee Hand-off:** If applicant insists on "Prehistoric" wording, send to Committee.

  **Case 2: Woven Garment**
  *   **Facts:** Weave technique ancient (archaeology). Cut/Color/Association = 1920s Craft School. Claim: Worn continuously for five centuries.
  *   **Analysis:**
      *   Test 1 (Attestation): Substrate (weave) is old; Form (garment) is new.
      *   Test 2 (Codification): 1920s School records likely exist.
      *   Test 6 (Beneficiaries):** Craft revival school (likely state-funded).
  *   **Verdict:** **Adapted / Reconstructed.** The *technique* is continuous; the *dress* is invented.
  *   **Action:** Split the claim.
  *   **Copy Template:** "Using weaving techniques rooted in the region's ancient past, this garment design emerged during the cultural revival of the 1920s."
  *   **Committee Hand-off:** None. This is a factual distinction we can manage.

  **Case 3: Flagship National Costume (Board Asset)**
  *   **Facts:** Designated 1930s by State Committee. Standardised from regional variants. Promoted by Board for 40 years as "Ancient National Dress."
  *   **Analysis:**
      *   Test 1 (Attestation): 1930s State Committee minutes vs. Claim of Antiquity.
      *   Test 5 (State Apparatus):** Exists chiefly due to state standardisation.
      *   **Hard Case:** This is our own asset.
  *   **Verdict:** **Invented (Antiquity Claim).** This is a classic Hobsbawm case: state standardisation during nation-building.
  *   **Action:** **Must reword.** We cannot certify our own falsehood.
  *   **Replacement Copy:** "Designated in the 1930s as the national standard, this costume unifies regional variants into a single symbol of our shared heritage."
  *   **Committee Hand-off:** **Mandatory.** This affects the Board's brand. The Committee (specifically the Industry Rep and Me) must approve the reputational risk of admitting the 1930s origin.

  ---

  ### 7. WHAT THE PROCEDURE CANNOT DO

  1.  **Distinguish Invented from Revived on Sparse Evidence:** If records are lost, we cannot tell if a practice died and restarted (Revived) or was made up to look old (Invented). The procedure forces a choice where the evidence is silent.
  2.  **Validate Oral Traditions Fully:** Despite Test 7, this procedure relies on documentation. It will systematically misfire on dispossessed communities by labeling their un-documented history as "Unverified" rather than "Continuous." We mitigate this, but we cannot solve the archival silence.
  3.  **Answer the Value Question:** The procedure identifies *accuracy*, not *worth*. The Committee will fight over whether a 1930s invention deserves listing because it is now beloved. This procedure cannot answer "Does this deserve to be heritage?" It only answers "Is this claim accurate?"
  4.  **Resolve Colonial Adoption:** If a colonial form is now loved as indigenous (e.g., a colonial holiday adopted as liberation day), the procedure labels it "Invented/Imposed." It cannot adjudicate whether the community's current ownership validates the origin. That is a political decision, not a procedural one.
  5.  **Anderson's Limit:** We use Anderson to identify *how* a tradition was manufactured (maps, museums, print). We cannot use him to say the tradition is *false*. For Anderson, the imagined community is real in its consequences. Our procedure treats "Imagined" as a synonym for "Recent," which misrepresents his theory. We use his mechanics to judge his philosophy.
