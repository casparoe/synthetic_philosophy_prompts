      *   *Reading 5: The Permission Claim (Agent-Centered Prerogative).* It is *permissible* to favor compatriots, not *required*.
          *   Commitment: Partiality is allowed.
          *   Status: Compatible with Cosmopolitanism (weak cosmopolitanism).
