      *   *Efficacy/Instrumental:* Aid works better locally/nationally.
      *   *Associative/Relational:* Special duties arise from citizenship.
      *   *Division of Labor:* States have specific roles; individuals/NGOs handle the rest.
      *   *Permission vs. Obligation:* It's okay to favor home, but not required.
      *   *Priority vs. Weight:* Home needs count for more, or just get solved first.
