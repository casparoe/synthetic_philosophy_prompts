answer: |-
  Here is a disambiguation of the slogan "charity begins at home," structured to help you draft the opening section of your seminar paper. I have broken the slogan down into seven distinct normative or empirical claims. For each, I specify what it commits a defender to, how it stands relative to a cosmopolitan framework, and whether it is strong enough to support your classmate's conclusion (that domestic obligations must be discharged *before* attending to greater need abroad).

  ### 1. The Epistemic Claim
  *   **The Claim:** We possess better knowledge of the needs, contexts, and verification mechanisms for compatriots than for foreigners.
  *   **Commitment:** This is an empirical claim about information asymmetry. It commits one to the view that uncertainty regarding foreign needs increases the risk of wasted resources or unintended harm.
  *   **Status:** **Plausible but contingent.** A cosmopolitan can accept this without embarrassment. It does not deny the *existence* of obligations abroad, only highlights a practical hurdle in fulfilling them.
  *   **Strength regarding conclusion:** **Weak.** It supports a presumption in favor of local aid *ceteris paribus* (all else being equal). However, it cannot support a strict priority rule. If the need abroad is sufficiently urgent and the evidence of that need is robust (e.g., famine data), the epistemic advantage of local knowledge is outweighed by the severity of the foreign need. It justifies efficiency, not priority.

  ### 2. The Instrumental Efficacy Claim
  *   **The Claim:** Resources administered domestically yield a higher return on investment (in terms of welfare generated per unit of currency) than resources sent abroad.
  *   **Commitment:** This is an empirical claim about administrative capacity, corruption, and infrastructure. It commits one to the view that the state apparatus is better tuned to domestic conversion of funds into welfare.
  *   **Status:** **Contingent and contestable.** A cosmopolitan can accept this as a general heuristic, but must reject it as a universal law. In many cases (e.g., basic health interventions in low-income countries), foreign aid is demonstrably more effective at saving lives than marginal domestic spending in affluent states.
  *   **Strength regarding conclusion:** **Weak.** Like the epistemic claim, this supports efficiency. It cannot justify ignoring a life-saving opportunity abroad simply because a life-improving opportunity exists at home. It collapses if the "cost per life saved" is lower abroad.

  ### 3. The Associative Duty Claim
  *   **The Claim:** The relationship of co-citizenship generates special obligations that do not exist between strangers.
  *   **Commitment:** This is a substantive moral claim about the source of duties. It commits one to the view that political membership is itself morally generative, creating duties of reciprocity or mutual aid that are distinct from general humanitarian duties.
  *   **Status:** **Substantive and contestable.** This is incompatible with *strong* cosmopolitanism (which holds that moral standing is solely a function of personhood), but compatible with *weak* cosmopolitanism (which allows for special duties provided basic rights are met globally).
  *   **Strength regarding conclusion:** **Moderate.** This supports the idea that compatriots have a *stronger* claim than foreigners. However, it does not automatically support *lexical priority* (that domestic claims must be fully satisfied before foreign ones begin). Most defenders of associative duties admit they are constrained by a minimum threshold of human rights; if foreigners are below that threshold, associative duties may not override them.

  ### 4. The Division of Moral Labor Claim
  *   **The Claim:** States are institutional agents designed specifically to secure justice for their own constituents; expecting them to act as global distributive agents misunderstands their functional role.
  *   **Commitment:** This is a claim about institutional design and agency. It commits one to the view that global justice should be pursued through global institutions or individual charity, not by repurposing domestic welfare states.
  *   **Status:** **Substantive.** A cosmopolitan might accept this if they believe global justice requires global institutions, but would reject it if they believe states are the only agents capable of effective redistribution.
  *   **Strength regarding conclusion:** **Moderate.** It suggests the state *as a state* should focus domestically. However, it does not prove that the *citizens* of that state (via the state) are off the hook for foreign need. It shifts the burden of proof to other agents but does not necessarily eliminate the obligation.

  ### 5. The Agent-Centered Prerogative (Permission) Claim
  *   **The Claim:** Individuals and states are *permitted* to give priority to compatriots, even if an impartial calculus would suggest otherwise.
  *   **Commitment:** This is a claim about the scope of moral requirement. It commits one to the view that morality allows for partiality; it does not demand strict impartiality in action.
  *   **Status:** **Compatible with Cosmopolitanism.** Many cosmopolitans accept that agents are permitted to favor their own projects and relationships, provided they do not violate negative duties or allow catastrophic harm elsewhere.
  *   **Strength regarding conclusion:** **Very Weak.** This claims that prioritizing home is *allowed*, not that prioritizing home is *required* or that prioritizing abroad is *forbidden*. Your classmate's conclusion was that a state getting its priorities wrong is failing an obligation. This reading only defends the state against criticism, it does not validate the claim that foreign aid is secondary in stringency.

  ### 6. The Lexical Priority Claim
  *   **The Claim:** Domestic obligations constitute a threshold that must be fully met before any obligations to foreigners become active.
  *   **Commitment:** This is a claim about the ordering of duties. It commits one to the view that the claims of compatriots are not just heavier, but categorically prior to the claims of foreigners.
  *   **Status:** **Substantive and highly contestable.** This is incompatible with most needs-based accounts of justice. It essentially treats citizenship as a trump card over basic human need.
  *   **Strength regarding conclusion:** **Very Strong.** This is the only reading that fully delivers your classmate's conclusion. However, it is also the hardest to defend philosophically, as it implies that a marginal benefit to a compatriot outweighs a vital need of a foreigner.

  ### 7. The Category Mistake (Charity vs. Justice) Claim
  *   **The Claim:** Aid to compatriots is a matter of right (justice), while aid to foreigners is a matter of benevolence (charity).
  *   **Commitment:** This is a conceptual claim about the nature of the obligation. It commits one to the view that global poverty does not constitute a violation of justice owed by the affluent state, but rather a situation inviting optional generosity.
  *   **Status:** **False (in the context of your seminar).** If the seminar is premised on "obligations of justice," this reading begs the question. It defines the problem away by categorizing foreign claims as non-justicial.
  *   **Strength regarding conclusion:** **Strong (by definition).** If foreign aid is merely charity, it is by definition less stringent than domestic justice. But this is a terminological stipulation, not an argument.

  ***

  ### Points of Equivocation and Slippage

  The slogan derives its rhetorical force from sliding between these readings without signaling the transition. In your paper, you should flag these three specific slippages:

  1.  **From Permission to Requirement:** The slogan often moves from Reading 5 (It is *okay* to help home first) to Reading 6 (It is *required* to help home first). A defender might argue, "Surely we are allowed to look after our own?" (which a cosmopolitan accepts) and then conclude, "Therefore, it is wrong to spend that money abroad" (which does not follow).
  2.  **From Instrumental to Intrinsic:** The slogan slides from Reading 1 & 2 (We help home first because it is *easier/more effective*) to Reading 3 & 6 (We help home first because they are *ours*). If the argument rests on efficacy, it collapses when foreign aid becomes more effective. If it rests on association, efficacy is irrelevant. Defenders often use efficacy to justify association, then treat the association as absolute even when efficacy fades.
  3.  **From "Some Priority" to "Absolute Priority":** Even if one accepts Reading 3 (Associative Duties), it does not follow that domestic duties have *lexical* priority (Reading 6). One can acknowledge special duties to compatriots while maintaining that extreme foreign need trumps marginal domestic gain. The slogan treats a claim to *some* extra weight as a claim to *all* the weight.

  ***

  ### The Vocabulary Question: "Charity" vs. "Justice"

  Your intuition that the vocabulary matters is correct. The substitution of "charity" for "justice" is not merely semantic; it performs significant normative work that undermines the debate you were trying to have.

  1.  **Supererogation vs. Obligation:** In moral philosophy, "charity" typically denotes supererogatory action—actions that are good to do but not wrong to omit. "Justice" denotes mandatory action—actions that are owed and wrong to omit. By framing the issue as "charity," your classmate implicitly categorizes foreign aid as optional. If foreign aid is optional and domestic support is mandatory (justice), the priority conclusion follows trivially. You cannot compare the stringency of a duty against the optionality of a gift.
  2.  **Discretion vs. Claim:** Charity implies the giver has discretion over the recipient and the amount. Justice implies the recipient has a claim against the giver. If global poverty relief is "charity," the affluent state retains the right to decide when it has done "enough." If it is "justice," the recipient's need determines when the obligation is discharged.
  3.  **The Trap:** If you accept the term "charity" for the sake of argument, you have already conceded that the global poor do not have a claim of justice against the affluent state. To argue effectively, you must insist on framing the discussion as "obligations of justice" (as your seminar title suggests). If the discussion is about justice, the slogan "charity begins at home" is category-incoherent. It attempts to answer a question of justice ("What do we owe?") with a maxim of benevolence ("What is good to do?").

  **Summary for your paper:** The slogan is not a single argument but a container for several distinct claims. Some are empirically contingent (efficacy), some are morally permissible but not required (prerogative), and some are question-begging definitions (charity vs. justice). Only the Lexical Priority Claim supports your classmate's conclusion, but it is the least plausible and most heavily burdened by the need to explain why citizenship trumps basic human need. The slogan's resilience lies in its ability to allow a defender to retreat to the plausible claims (efficacy, permission) when challenged, while still asserting the strong conclusion (priority) when unchallenged.
