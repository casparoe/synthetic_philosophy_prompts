answer: |-
  The real failure point is the empirical prior you must assign to the existence of sufficiently similar agents facing sufficiently similar decisions, and I am moderately confident that once you account for the reference class problem, the expected value collapses to negligible. Without a rigid constraint on how you define similarity, the theory becomes unfalsifiable and risks diverting resources toward invisible partners based on adjustable assumptions rather than evidence.

  Let's start with the correlation worry you flagged, because this is where the rubber meets the road regardless of whether you prefer evidential or causal decision theory. The core claim of ECDT is that your decision provides evidence about the decisions of distant agents, but the skeptic asks whether that evidence is screened off by common causes like shared physics or evolutionary pressures. For this objection to be fatal, the world would have to be one where agent similarity is merely statistical rather than logical, meaning that while we look alike and think alike, our specific choices in novel one-shot dilemmas are not determined by the same abstract computation. Defenders of the view will concede that if the correlation is purely statistical, the leverage drops significantly, but they argue that if cognition is computational, then running the same algorithm on the same input must yield the same output, creating a logical link that common causes cannot screen off. The live version of this defeater isn't that logical correlation is impossible, but that you simply cannot be certain enough that the distant agents are running the same algorithm on the same input to justify costly sacrifices. You are effectively betting that your decision procedure is isomorphic to theirs down to the relevant details, and since you cannot inspect their source code, you are relying on a prior about the uniformity of intelligence in the multiverse that is far from settled. If you admit even a small probability that their context differs enough to flip their decision despite similar architecture, the evidential link weakens exponentially with distance and complexity, turning a compelling cooperation incentive into a gamble with odds too long to act on.

  This leads directly into the reference class problem, which is arguably the most damaging internal tension because it threatens to make the view unfalsifiable. For the evidential link to work, you need a class of agents that is large enough to matter cosmically but similar enough to correlate with your choices, and there is no non-arbitrary way to draw this boundary. If you define the class narrowly as exact source-code copies, the correlation is near perfect but the number of agents is likely zero, yielding no value; if you define it broadly as any rational agent, the number is huge but the correlation is negligible, also yielding no value. A committed defender would concede that this is the hardest technical problem in the framework and that the expected value calculation is extremely sensitive to how you parameterize similarity. The danger here is that the theory becomes a motte-and-bailey where you assume a broad class when calculating potential gains and a narrow class when explaining why you don't see evidence of cooperation in the wild. For this to be a live defeater rather than a logical possibility, we just need to accept that cognitive architectures are likely diverse enough that the sweet spot for high correlation and high count is empty or vanishingly small, which seems consistent with everything we know about biological and artificial variation. If the relevant class can be widened or narrowed freely to suit the desired conclusion, the view loses its action-guiding power because it no longer tells you what to do, only how to justify what you already want to do.

  Then there is the self-undermining worry about blackmail and leverage, which asks whether adopting a cooperative policy makes you a target for agents who demand tribute in exchange for not simulating and punishing you. You asked if this is a real defeater or a cheap trick, and the answer depends on whether you think agents can reliably identify your policy without causal interaction. If the same logic that enables acausal trade enables acausal blackmail, then signaling cooperativeness might invite predation from agents who know you value the correlation enough to pay up. Defenders usually argue that you should only trade with agents who share your normative constraints against blackmail, but this requires you to have evidence about the normative constraints of agents you cannot observe, which loops back into the reference class problem. This is a live worry because it suggests that the very mechanism supposed to generate value could generate negative value if the multiverse contains more predators than partners. A skeptic would say this is fatal because it implies the strategy is unstable, while a defender would concede it limits the scope of trade but argue that reasonable agents would converge on anti-blackmail norms. However, if you cannot distinguish partners from predators acausally, the risk premium might swallow the expected gains, forcing you to retreat to a much weaker version where you only cooperate when you have independent causal reasons to trust the counterpart, which defeats the whole purpose of the theory.

  On the question of risk and falsifiability, you need to know whether there is any observation that could count against the view, and the honest answer is that it is heavily insulated from empirical feedback. If you sacrifice resources for acausal trade and see no reciprocal benefit, the defender can always say there simply weren't enough relevantly similar agents on that branch to make the trade balance visible, or that the repayment comes in a form you cannot detect. This insulation is a problem for practical philosophy because it allows the view to demand real costs in the causal world based on rewards in an unobservable acausal world, creating a one-way bet where losses are visible and gains are theoretical. It is not logically impossible for the view to be wrong, but it is structured such that being wrong looks exactly like being right from your local perspective, which means you cannot update your belief based on experience. For this to be acceptable, you have to argue that practical philosophy doesn't need to be testable in the same way empirical theories do, but that is a hard sell when the philosophy asks you to burn money or effort on the say-so of a mathematical intuition. The cost of holding the view is precisely this vulnerability to exploitation by your own uncertainty, where you might end up servicing invisible masters based on a probability distribution you cannot constrain.

  Ultimately, the view stands or falls on the empirical claim that the multiverse contains enough copies of your decision procedure to make the expected value positive, and that is a claim you cannot verify. The most damaging defeater is not that the logic is unsound, but that the premises are so unconstrained that they can be tuned to support any conclusion, rendering the framework incapable of guiding action in a way that differs from simple altruism or selfishness. You don't need to settle evidential versus causal decision theory to see this, because even if evidential reasoning is valid, it requires reliable evidence, and the existence of correlated agents is evidence you simply do not have. I would suggest that the cost of holding this view is the opportunity cost of the resources you divert toward acausal partners instead of causal needs, coupled with the cognitive hazard of building a worldview that cannot be corrected by failure. If you treat it as a heuristic for being the kind of person who cooperates, it might be harmless, but if you treat it as a literal account of cosmic trade, you are building on sand that shifts whenever you try to stand on it.
