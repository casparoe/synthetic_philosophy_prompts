answer: |-
  ### 1. Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1000 words
  **Total Marks:** 30

  **Question:**

  Read the following case carefully:

  > Nadia is a nurse with a full-time hospital job. Ten years ago, on her own initiative and without being asked, she started taking one extra unpaid Saturday shift a month at a small free clinic. By year three the roster was built around her. By year six the volunteer coordinator had started telling new recruits that Saturdays were already covered. In year eight the clinic turned down a grant that would have paid a weekend nurse, on the assumption her shift would keep happening. Nobody has ever asked her for a commitment and she's never made one. In year ten she wants the Saturday off for her daughter's graduation.

  Standard definitions of supererogation characterize such acts as morally good, optional, praiseworthy to perform, and not blameworthy to omit. Nadia's initial shifts clearly fit this description. However, the context has shifted over a decade.

  Write an essay evaluating whether the year-ten shift remains supererogatory. If you argue it has become obligatory, explain what changed, given that Nadia made no promise and the act itself remains identical. If you argue it remains supererogatory, explain why the clinic's reliance does not generate an obligation. In either case, your answer must address the broader theoretical implication: does this case suggest that supererogatory acts are inherently unstable, potentially transforming into obligations through their own consistency?

  ***

  ### 2. Model Answer

  The case of Nadia presents a significant challenge to the static definition of supererogation. If we define a supererogatory act simply as one that is good to do but not wrong to omit, Nadia's year-ten shift forces us to ask whether the moral status of an act depends on its intrinsic nature or on the external web of expectations it generates. While the standard definition suggests the shift remains optional, a closer analysis of reliance and consequences suggests the moral landscape has shifted, potentially converting a supererogatory habit into a specific obligation. This transformation reveals a troubling paradox: if consistency converts charity into duty, morality may systematically punish sustained virtue.

  Initially, Nadia's acts were paradigmatically supererogatory. She sacrificed time without requirement, creating value without incurring debt. The standard four-feature definition holds comfortably here: the act was good, optional, praiseworthy, and omitting it attracted no blame. However, by year ten, the omission of the shift carries different consequences. Because the clinic structured its roster and funding around her presence, her absence now causes tangible harm that her absence in year one did not. The act itself—nursing for four hours—has not changed in value, but the context of omission has shifted from "neutral" to "harmful."

  This suggests that the source of the potential obligation is not the act itself, but the reliance it created. In moral theory, obligations often arise from voluntary undertakings or promises. Nadia made no explicit promise. However, some accounts argue that implicit commitments arise through consistent behavior that invites reliance. By allowing the clinic to turn down a grant and build a roster around her, Nadia may have tacitly accepted a role. If we accept that inducing reliance creates a duty to prevent harm, the year-ten shift is no longer optional. It has become obligatory because the cost of omission is now the welfare of patients who were counted on.

  However, accepting this conclusion creates a theoretical problem known as the "self-undermining" nature of supererogation. If performing a good deed consistently eventually makes it obligatory, then morality punishes reliability. The more generous an agent is over time, the more they owe, until their supererogatory latitude disappears entirely. This seems counterintuitive; we generally wish to encourage sustained beneficence, not create a trap where generosity eventually becomes a coercive demand. If Nadia becomes obligated simply because she was good for nine years, we risk disincentivizing long-term volunteering.

  A strong response to this paradox distinguishes between the *source* of the obligation and the *value* of the act. One might argue that the obligation does not stem from the past acts themselves, but from the present consequences of leaving a gap in care. The duty is not "you must nurse because you nursed before," but "you must prevent harm because you are the only one who can." This preserves the value of the past acts as charitable while acknowledging the current necessity. Alternatively, one might frame this through the structure of imperfect duties. We have a general duty to help others, with latitude to choose when and how. Nadia exercised this latitude for nine years. The argument could be made that latitude is not infinite; when the cost of exercising one's latitude becomes too high for others (i.e., patients lose care), the latitude collapses into a specific duty.

  Furthermore, there is a structural dimension to consider. Nadia's reliability allowed the clinic to reject public funding. This suggests that private supererogation can crowd out public provision. Her virtue masked a systemic failure. In this light, the obligation in year ten might not be about her personal moral ledger, but about rectifying a dependency she inadvertently sustained.

  Ultimately, the year-ten shift likely ceases to be supererogatory, not because the act changed, but because the moral cost of omission changed. However, acknowledging this requires us to refine the definition of supererogation. It cannot be a permanent status attached to an act type. It is a temporary status vulnerable to the ecology of expectations. To avoid punishing virtue, we must clarify that obligations arise from the *harm of withdrawal* rather than the *history of giving*. If we fail to make this distinction, we validate a system where the most reliable agents are gradually burdened until their generosity is no longer free, but demanded.

  ***

  ### 3. Marking Scheme (30 Marks)

  **Criteria & Allocation**

  **1. Identification of the Core Tension (5 Marks)**
  *   **Full Marks:** Clearly identifies that the act's intrinsic value hasn't changed, but its moral status is threatened by external reliance/expectations. Notes the conflict between the standard definition (optional) and the intuitive pull of obligation.
  *   **Common Error:** Treating the case as a simple "promise-breaking" scenario despite the prompt stating no promise was made. Ignoring the "intrinsic value unchanged" constraint.

  **2. Analysis of Reliance and Consequences (6 Marks)**
  *   **Full Marks:** Explains *why* reliance might generate obligation (e.g., harm of omission is now higher, implicit commitment, or vulnerability created). Distinguishes between "doing good" and "preventing harm caused by withdrawal."
  *   **Common Error:** Asserting obligation exists simply because "people expect it," without explaining the moral mechanism (harm vs. expectation).

  **3. The "Punishing Virtue" Objection (6 Marks)**
  *   **Full Marks:** Explicitly addresses the self-undermining problem: if consistency creates obligation, sustained supererogation becomes impossible. Discusses whether this is a feature (latitude has limits) or a bug (discourages virtue).
  *   **Common Error:** Dismissing the objection too quickly or failing to see why this is a problem for the *definition* of supererogation rather than just Nadia's schedule.

  **4. Distinction Between Blame and Obligation (5 Marks)**
  *   **Full Marks:** Nuanced handling of deontic categories. Recognizes that one can be obligated to do something that remains praiseworthy (obligation does not extinguish praise). Recognizes that blameworthiness for omission is the test for obligation, not just feeling bad.
  *   **Common Error:** Treating 'she'd be blameworthy for not going' and 'the act is now obligatory' as identical claims without nuance. Assuming that if an act becomes obligatory, it is no longer praiseworthy.

  **5. Structural/Systemic Insight (Bonus/Integrated) (4 Marks)**
  *   **Full Marks:** Discusses the "crowding out" effect (private reliability masking public failure) OR offers a robust alternative grounding for obligation (e.g., imperfect duty latitude limits) without relying on the crowding-out point.
  *   **Common Error:** Ignoring the grant/clinic structure detail entirely.
  *   *Note:* This point can be scored within the other criteria if integrated well, but distinct credit is available for the systemic insight.

  **6. Clarity, Structure, and Argumentative Flow (4 Marks)**
  *   **Full Marks:** Logical progression, clear thesis, concise writing within word limits.
  *   **Common Error:** Disorganized, repetitive, or significantly under/over word count.

  **Explicit Ruling on Terminology:**
  **Can a top-band answer succeed without mentioning "moral residue" or "imperfect duty"?**
  **Yes.** A top-band answer (27-30/30) does **not** require these specific technical terms.
  *   **Requirement:** The answer must demonstrate the *concepts* these terms capture.
      *   Instead of "imperfect duty," the student must discuss the *latitude to choose when/how to help* and whether that latitude has limits.
      *   Instead of "moral residue," the student must discuss the *lingering moral cost* or the *conflict of values* when a previously optional act becomes necessary.
  *   **Penalty:** Do not penalize for missing the jargon. Penalize only if the underlying concept (e.g., that duties of beneficence allow choice until a threshold is crossed) is missing. A student who explains the *mechanism* of latitude clearly without naming it demonstrates better understanding than one who name-drops "imperfect duty" without explaining how it applies to Nadia's latitude.

  **Typical Grade Boundaries:**
  *   **27-30 (High Distinction):** Hits all 5 substantive criteria. Nuanced handling of the "punishing virtue" paradox. Clear distinction between blame/obligation/praise.
  *   **21-26 (Distinction):** Hits most criteria but may simplify the "punishing virtue" objection or conflate blame with obligation slightly.
  *   **15-20 (Credit):** Identifies the reliance issue but treats it as a simple promise case. Misses the theoretical implication for supererogation as a category.
  *   **<15 (Fail):** Recites the standard four-feature definition without applying it to the complications of the case. Concludes "it's still optional because she didn't promise" without engaging the reliance counter-argument.
