  This is a fascinating phenomenological niche. You are right to sense that standard accounts (Conversion, Control, Meta-Response) don't quite capture the *teleology* of the experience you're describing. In the standard literature, the negative emotion is either converted into pleasure, tolerated because of safety, or appreciated as a separate meta-layer. In your respondents' accounts, the negative emotion is the *resistance medium* against which the pleasure is generated, like weight against a muscle.

  There is no single, canonical term in analytic aesthetics that captures this exact configuration. However, it sits at the intersection of **Bullough's Psychical Distance**, the **Kantian Sublime**, and contemporary **Emotion Regulation** models.

  If you need a working label for your dissertation, I would propose **"The Pleasure of Containment"** or **"Agonistic Poise."**

  However, since you care more about the fenceposts, here is how you distinguish this phenomenon from the usual suspects. The key differentiator is the **teleology of release**.

  ### 1. Versus Catharsis (Aristotelian/Purgative)
  *   **The Standard View:** Catharsis posits that pity and fear are built up *in order to* be purged. The release (the sob, the weeping) is the *telos* (end goal) of the process. The pleasure is in the unburdening.
  *   **The Fencepost:** In your respondents' experience, the release is **teleological failure**. The sob is not the culmination; it is the collapse of the aesthetic frame.
  *   **The Distinction:** Catharsis is hydraulic (pressure $\to$ release $\to$ relief). Your phenomenon is isometric (pressure $\to$ sustained resistance $\to$ endurance). If the hydraulic valve opens (the sob), the isometric exercise ends. This explains why the film feels "cheap" afterwards: it forced a hydraulic resolution when the viewer wanted an isometric challenge.

  ### 2. Versus Relief (Hedonic Contrast)
  *   **The Standard View:** Relief pleasure relies on the *cessation* of the negative state. The pain is instrumental; the good part is that it is *over*.
  *   **The Fencepost:** In your phenomenon, the pleasure is *constitutive* of the negative state's continuation. If the pain stops (because they stopped watching, or because they cried and the tension broke), the pleasure vanishes immediately.
  *   **The Distinction:** Relief is retrospective (I am glad that is done). Containment is prospective and durational (I am glad I can keep holding this).

  ### 3. Versus Control Theory (Carroll)
  *   **The Standard View:** Carroll argues we enjoy horror/tragedy because we know we can stop it (we are in charge). The control is a safety net that allows us to dip our toes in.
  *   **The Fencepost:** Your respondents aren't enjoying the safety net; they are enjoying the *risk of falling through it*. They aren't "safely in charge"; they are "precariously managing."
  *   **The Distinction:** Control Theory treats emotional control as a **boundary condition** (I am safe because I can leave). Your phenomenon treats emotional control as the **activity itself** (I am engaged because I am fighting to stay). It shifts the locus of control from *external* (I can turn off the screen) to *internal* (I can hold back the tears).

  ### 4. Versus Tension and Release (Narrative/Musical)
  *   **The Standard View:** Narrative suspense or musical dissonance creates tension that *demands* resolution. The pleasure is in the resolution (the hero survives, the chord resolves).
  *   **The Fencepost:** Here, the "resolution" (the sob) is experienced as an **anticlimax**. The pleasure resides in the *sustain* of the dissonance.
  *   **The Distinction:** Standard tension/release is vectoral (moving toward a point). This is stasis-oriented (maintaining a point). The "almost beaten but not beaten" quote is key: it describes a **limit-state**, not a trajectory.

  ### Theoretical Anchoring (For the Lit Review)

  Since there isn't a single label, you can anchor this by triangulating three existing concepts:

  **A. Bullough's "Psychical Distance" (The Collapse Mechanism)**
  This is your strongest existing hook. Bullough argues art requires a gap between the viewer and the object.
  *   **Under-distancing:** The work becomes too personal/practical (you sob, it becomes ordinary grief).
  *   **Over-distancing:** The work is cold/abstract.
  *   **Your Phenomenon:** This is the **labor of maintaining the limit**. Most readings of Bullough treat Distance as a static setting. Your data suggests Distance is a *dynamic struggle*. The pleasure is the successful calibration of Distance at its maximum tolerance before snapping into "under-distance" (reality/grief). When they sob, Distance collapses, art becomes life, and the aesthetic value plummets ("cheap").

  **B. The Kantian Sublime (The Check on Vital Powers)**
  Kant describes the sublime as a feeling where imagination struggles to comprehend magnitude, causing a "check on vital powers" (pain), followed by a surge of reason (pleasure).
  *   **Adaptation:** Your respondents are experiencing the "check" without the rational "surge." They are enjoying the *strain* of the imagination against the affect, not the triumph of reason over it. It is a **Sublime of Endurance** rather than a Sublime of Transcendence.

  **C. Emotion Regulation (Process vs. Outcome)**
  In psychology, this looks like **antecedent-focused regulation** (modifying the input) vs. **response-focused regulation** (modifying the output).
  *   Your respondents are engaging in high-effort response regulation (suppressing the sob) not to hide the emotion, but to *prolong the aesthetic engagement*. The regulation *is* the appreciation.

  ### Proposed Terminology

  If you need a term to carry through the dissertation, I recommend **"Aesthetic Poise."**

  *   **Why:** "Poise" implies balance under pressure. It captures the "holding on" and the risk of falling. It distinguishes from "Distance" (which sounds static) and "Control" (which sounds managerial).
  *   **Definition:** *Aesthetic Poise is the pleasure derived from the sustained maintenance of psychical distance at the limit of emotional tolerance, where the cessation of resistance (emotional release) constitutes a failure of the aesthetic frame rather than a resolution.*

  ### Summary of the Fenceposts

  | Concept | Role of Negative Emotion | Role of Release (Sobbing) | Teleology |
  | :--- | :--- | :--- | :--- |
  | **Catharsis** | Fuel for purgation | **Success** (The Goal) | Purification |
  | **Relief** | Obstacle to comfort | **Success** (The End of Pain) | Comfort |
  | **Control Theory** | Permitted Risk | **Irrelevant** (Safety is external) | Safety |
  | **Tension/Release** | Dissonance | **Success** (Resolution) | Closure |
  | **Aesthetic Poise** | **Resistance Medium** | **Failure** (Collapse of Frame) | **Endurance** |

  This framing allows you to acknowledge the existing literature while carving out the specific phenomenological space your data occupies. It validates your respondents' intuition that crying made the film "cheap"—because it converted an aesthetic achievement (poise) into a biological event (grief).
