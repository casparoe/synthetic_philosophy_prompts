      *   *Crucial adjustment:* The prompt says she is diagnosed as "minimally conscious" but describes behavior closer to Unresponsive Wakefulness Syndrome (UWS) ("nothing reproducible"). I will treat her as behaviorally UWS/VS for the sake of the fMRI significance, as fMRI is usually used to distinguish UWS from MCS/LIS. I will clarify this distinction in the memo. *Wait, re-reading prompt:* "diagnosed as minimally conscious... nothing reproducible." Technically, MCS requires reproducible behavior. If nothing is reproducible, she is behaviorally UWS. I will note this diagnostic tension gently.
