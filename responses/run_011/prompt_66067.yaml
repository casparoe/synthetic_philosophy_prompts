  2.  **Deconstruct the Ethical & Scientific Issues:**
      *   **The Science:** fMRI command-following in disorders of consciousness (DOC) detects *Cognitive Motor Dissociation* (CMD). It shows preserved network function capable of task modulation. Does it prove *phenomenal consciousness* (qualia, suffering, joy)? Not necessarily. It proves *access consciousness* or task-execution capacity.
      *   **The Leap:** The inference from "BOLD signal matches tennis task" to "She understands she is in a hospital and wants to live" is a category error. It's a reflex at a high level, not necessarily a biographical agent.
      *   **The Stakes:** False hope vs. premature withdrawal. If we say she's "in there," the husband may demand indefinite life support. If we say it's meaningless, we might ignore a patient who *is* aware but locked-in.
      *   **The Evidence Type:** Is it testimony? No, it's a physiological correlate of a cognitive task. It's more like a reflex than a statement.

  3.  **Drafting Strategy - Section by Section:**

