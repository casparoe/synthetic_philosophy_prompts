  *(Final thought on the "Why")*: The strongest argument against the "She's in there" leap is the **Specificity Gap**. The scan proves she can modulate attention. It does not prove she has a narrative self, understands her prognosis, or experiences suffering. A computer can be programmed to output "Tennis" when asked "Imagine Tennis." That doesn't make the computer conscious. The brain region activated is the Supplementary Motor Area. That's movement planning, not "selfhood."

