          *   *Thursday:* Cautious optimism, not definitive proof of personhood.
          *   *Policy:* Scan criteria (exclusion of confounders), Report language (CMD, not "Awareness"), Treatment decisions (scan is one data point, not a veto).
      *   **Criteria for Future:** Reproducibility, multimodal correlation, exclusion of automaticity.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe say the scan is inconclusive.
      *   *Correction:* No, the prompt asks for a clear bottom line. "Inconclusive" is a cop-out. The bottom line must be about *interpretation*, not just validity. The scan is valid for *function*, invalid for *biographical agency*.
      *   *Tone Check:* Ensure I'm not attacking the neurologist. He's a friend. Frame it as "Clinical enthusiasm vs. Ethical precision."
      *   *The "Why":* The prompt asks specifically: "if a positive result can't support the claim that she's aware, I want to know why not." I need to articulate the distinction between *task execution* and *subjective experience*.
      *   *Key Concept:* **Cognitive Motor Dissociation (CMD)** is the clinical term. I should use that. It separates the motor output from the cognitive command.
