      *   *The "Two Moves" Tension:* This is the sharpest part. Is it a tension or division of labor? Critics often say: "It's physically impossible (Move 1). But *even if* we idealize physics, it violates the *definition* of algorithm (Move 2)." The author claims Move 2 smuggles in CT to protect CT. This is a strong, defensible critique (circularity). It's not manufacturing tension; it's highlighting a defensive cordon.
