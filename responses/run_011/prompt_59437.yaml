answer: |-
  # Workshop Design: "The Permit Stack"

  ## (a) Project Dossier: The Oak & 4th Initiative

  **City:** Riverton
  **Neighborhood:** Highland Park
  **Site:** 402 Oak Avenue (Current: Surface Parking Lot + Single-Story Commercial)
  **Adjacent:** North (Single-Family Homes), East (Community Garden), South (Rooming House), West (Arterial Road)

  **Proposal:**
  *   **Structure:** 4-story mixed-use building.
  *   **Units:** 24 Residential (4 labeled "Affordable," 20 Market Rate).
  *   **Parking:** 10 Spaces (Code requires 24; Applicant requests Waiver).
  *   **Height:** 45 feet (Zone limit 35 feet; Applicant requests Variance).
  *   **Timeline:** 18 Months Construction.

  **Code Sections (Invented):**
  *   **R-3 Mod:** Requires 1 parking space per unit unless within 500ft of Transit (Site is 550ft).
  *   **Shadow Ordinance:** No new structure may cast shadow on Public Green Space between 10 AM – 2 PM Winter Solstice. (Preliminary study shows 15-minute encroachment).
  *   **Impact Fee:** New units trigger School Capacity Review if density exceeds 15 units/acre.

  **Known Objections:**
  1.  **Parking:** 10 spaces for 24 units will spill over into North Neighborhood streets.
  2.  **Drainage:** Increased impervious surface strains existing storm drains (flood risk in basement of North homes).
  3.  **School:** Local Elementary is at 95% capacity; 24 new units may trigger overcrowding.
  4.  **Shadow:** 15-minute daily shadow on East Community Garden during Winter.
  5.  **Construction:** 18 months of noise/dust on a narrow street.
  6.  **Precedent:** Approval triggers "Corridor Upzoning" clause, allowing similar height on all Oak Avenue lots.
  7.  **Displacement (Left Objection):** Adjacent Rooming House (South) is owned by same developer; tenants fear eviction for future Phase 2.
  8.  **Affordability (Left Objection):** "Affordable" units are priced at 80% Area Median Income (AMI); local renters average 50% AMI.

  ---

  ## (b) Roles & Briefs (14 Participants per Table)

  **Distribution:**
  *   **Immediate Neighbors (4):** North Side Homeowners.
  *   **Broader Neighborhood (3):** Local Business Owner, Community Garden Rep, Rooming House Tenant.
  *   **City Officials (3):** Planning Staff, School Board Rep, Traffic Engineer.
  *   **Advocates (2):** Housing Justice Organizer, Environmental Reviewer.
  *   **Regional/External (2):** Commuter Rep, Metro Housing Authority.
  *   **Applicant (1):** Developer Representative.
  *   **Facilitator/Recorder (1):** (Non-voting, tracks tokens).

  **Brief Structure:**
  Each participant receives a **Public Card** (same for Table A and Table B) and a **Private Card** (Different for Table A and Table B).

  **Example: Immediate Neighbor Role**
  *   **Public Card:** You live at 404 Oak. You support housing in principle. You are concerned about street parking availability for your family and drainage runoff into your basement. You value the neighborhood quiet.
  *   **Table A Private Card (Equity):** This home is 90% of your net worth. You refinanced 3 years ago at a rate you cannot get today. If the neighborhood density increases, you fear appraisal volatility. You cannot afford roof repairs if drainage fails.
  *   **Table B Private Card (No Equity):** You rent this unit with a long-term lease. Your housing costs are stabilized. You do not own a car. You are concerned about drainage, but property value changes do not affect your personal wealth.

  **Example: Rooming House Tenant Role**
  *   **Public Card:** You live in the adjacent building. You worry about construction dust and the potential for your building to be demolished for Phase 2.
  *   **Table A Private Card:** *N/A (This role is constant across tables to maintain the "Left Objection" integrity).*
  *   **Table B Private Card:** *N/A.*

  *(Note: All 14 roles receive Private Cards tailored to the Table condition. Table A = High Personal Financial Stake/Asset Concentration. Table B = Low/No Personal Financial Stake/Diversified or Renter.)*

  ---

  ## (c) Gate Structure & Token Ledger

  **The Mechanism:**
  The project must pass through **4 Gates** to be approved.
  1.  **Design Review** (Shadow, Aesthetics)
  2.  **Variance Hearing** (Height)
  3.  **Parking Waiver** (Traffic)
  4.  **Council Vote** (Final Approval)

  **Tokens:**
  *   **Objection Tokens (OT):** Each participant starts with 2 OT.
  *   **Delay Tokens (DT):** The Applicant starts with 10 DT.
  *   **Public Good Points (PGP):** All participants start with 5 PGP.

  **Rules:**
  1.  **Raising a Flag:** To object at a Gate, a player spends 1 OT.
  2.  **Cost of Objection:** When an OT is played, the Applicant *must* spend 2 DT to revise the plan or argue against it.
  3.  **Project Failure:** If Applicant runs out of DT, the project is withdrawn. **All players lose 5 PGP.**
  4.  **Project Success:** If project passes all 4 Gates, **All players gain 5 PGP.**
  5.  **Personal Stability (PS):**
      *   **Table A:** If Project Passes, roll a die. On 1-3, lose 5 PS (Property Value Risk). On 4-6, PS unchanged.
      *   **Table B:** If Project Passes, PS unchanged.
      *   **All:** If Project Fails, gain 2 PS (Status Quo Preserved).
  6.  **Winning:** Highest total score (PGP + PS) at the end.

  **The Trap:**
  Individual objections are "modest" (costing Applicant 2 DT). But if *many* people object, the Applicant runs out of DT quickly. A project can die even if no single person wanted it to die (Tragedy of the Veto).

  ---

  ## (d) The Manipulation & Analysis

  **The Variable:**
  *   **Table A (Asset Protection):** Players have high personal financial risk tied to the status quo (via Private Cards).
  *   **Table B (Procedural Blockage):** Players have negligible personal financial risk tied to the status quo.

  **What a Difference Establishes:**
  *   **If Table A blocks and Table B approves:** This supports your **Friend's Claim**. It suggests that when the financial stake is removed, the "civic costume" drops, and objections evaporate. The financial motive is load-bearing.
  *   **If Table A blocks and Table B *also* blocks:** This supports **Your Claim**. It suggests that the structure of the game (the Gates, the Token costs, the fragmentation of decision-making) creates blockage regardless of individual financial incentive. Even without asset protection motives, the "Conjunction of Partial Vetoes" kills the project.

  **What to Say If Results Are The Same (Your Expectation):**
  "If both tables killed the project, it suggests the *rules of the game* were stricter than the *players' preferences.* We saw that even when the financial risk was removed (Table B), the cost of coordinating a 'Yes' was higher than the cost of registering a 'No.' This doesn't prove money doesn't matter; it proves the procedure amplifies small concerns into total stoppages."

  **What to Say If Results Differ (Friend's Expectation):**
  "If Table B approved the project while Table A blocked it, it shows that personal financial exposure is the primary switch. When that exposure was removed, the civic objections (shadow, parking) were not enough to sustain opposition."

  ---

  ## (e) Round 2: The Regional Body (Boundary Claim)

  **Setup:**
  After Round 1 concludes (regardless of outcome), announce that the City has lost authority. A new **Metro Housing Council** is formed to override local blockage.

  **New Rule:**
  The Table is now the Metro Council. They vote on the permit directly (No Gates).
  *   **New Seats Added:** 3 "Commuter" seats, 2 "Regional Renter" seats.
  *   **The Catch:** To hold a seat on the Metro Council, you must meet **Eligibility Criterion X.**

  **The Manipulation:**
  The Facilitator announces: *"To vote on this permit, you must verify your Eligibility. Criterion X is: 'Must pay Property Taxes or have a Lease registered for more than 12 months.'"*

  **The Discovery:**
  *   The **Rooming House Tenant** (from Round 1) is now excluded (Month-to-month lease).
  *   The **Commuter Rep** is excluded (Lives outside tax zone).
  *   The **Unhoused** (mentioned in Dossier) were never invited.
  *   The participants must vote: *Do we keep Criterion X or change it?*
      *   If they keep it: They replicate the exclusion they just complained about.
      *   If they change it: They must define a new line. Who is *not* eligible? (e.g., "Must be a Citizen," "Must live within 50 miles").

  **Goal:** Participants realize that expanding the electorate does not solve the problem of *who draws the boundary*. The boundary itself is an act of exclusion.

  ---

  ## (f) Timeline (120 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Intro & Seating** | Split into Table A and Table B. Hand out Public Cards only. |
  | **00:10 – 00:20** | **Dossier Review** | Facilitator reads Project Dossier. Q&A on facts only. |
  | **00:20 – 00:25** | **Private Briefing** | Hand out Private Cards. **Strict instruction:** Do not read Private Card aloud. |
  | **00:25 – 01:10** | **Round 1 Play** | Run the 4 Gates. Facilitators track Tokens. **Sync Point:** At 00:50, announce "Midpoint: Applicant has 4 Delay Tokens left." |
  | **01:10 – 01:20** | **Table Comparison** | Tables reveal outcomes (Pass/Fail). Do not discuss *why* yet. Just record the result on the board. |
  | **01:20 – 01:25** | **Round 2 Setup** | Introduce Metro Council rules. Redistribute seats based on Eligibility Criterion X. |
  | **01:25 – 01:50** | **Round 2 Play** | Vote on Permit + Vote on Eligibility. |
  | **01:50 – 02:00** | **Debrief** | Facilitator leads discussion (See Section G). |

  ---

  ## (g) The Debrief Script

  **Facilitator Notes:**
  *   **Contested vs. Settled:** In the script below, **[CONTESTED]** marks claims where experts disagree. **[GAME ASSUMPTION]** marks where the design forces a specific worldview.
  *   **Neutral Stance:** Do not validate your claim over your friend's. Validate the *observation* the participants made.

  **Script:**

  1.  **The Outcome (5 Mins):**
      *   "Table A, did the project pass? Table B, did the project pass?"
      *   "Look at the Token Ledger. Did the project die because one person said 'No', or because many people said 'Maybe, if...'?"
      *   *Mapping:* This maps to the **Composition Claim**. Did the sum of small objections create a large blockage?

  2.  **The Motive (5 Mins):**
      *   "Table B, you had no financial risk in your Private Cards. What stopped you from voting 'Yes'?"
      *   "Table A, did your financial risk feel like the main reason you objected, or was it the parking/drainage?"
      *   *Mapping:* This maps to the **Asset Claim**.
      *   *Facilitator Note:* **[CONTESTED]** Academic research is divided on whether financial self-interest or procedural complexity is the primary driver of housing blockage. Some studies suggest equity protection is dominant; others suggest procedural veto points are sufficient to explain delays even without financial motive. This game does not settle that debate; it lets you feel the mechanics of both.

  3.  **The Boundary (5 Mins):**
      *   "In Round 2, we added new voters. Did everyone get to vote? Who was left out?"
      *   "When you tried to fix the Eligibility Rule, did you find it easy to include everyone?"
      *   *Mapping:* This maps to the **Boundary Claim**.
      *   *Facilitator Note:* **[GAME ASSUMPTION]** This exercise assumes that 'exclusion' is a problem to be solved. Some political theories argue that boundaries are necessary for any decision to function.
      *   *Facilitator Note:* **[CONTESTED]** Whether expanding jurisdiction solves local opposition is a live dispute in regional governance. Some argue it dilutes local accountability; others argue it corrects for exclusionary zoning.

  4.  **Addressing the Hearing Regulars (5 Mins):**
      *   "I know two of you have been to real hearings. This game compressed 18 months into 40 minutes. What did we miss?"
      *   "In the real world, do you feel the rules force you to object, or do you object because of the stakes?"
      *   "Invite them to say: 'This is not how it works.'" (Give them space to dismantle the simulation).

  ---

  ## (h) Risk Mitigation

  | Risk | Handling |
  | :--- | :--- |
  | **Association members feel villainized.** | **Script:** "The Scoring Function gives you points for 'Personal Stability.' Protecting your home is a valid goal in this game. The game does not punish you for caring about your asset; it shows the cost of that protection to the 'Public Good' score." |
  | **Applicant played as a caricature.** | **Brief:** The Applicant Role Card explicitly states: "You are not greedy. You are trying to meet a Metro Housing Target. If you fail, you lose your license." Constrain them to the rules, not a personality. |
  | **Token bargaining swamps the point.** | **Rule:** "No trading tokens." You cannot sell your Objection Token. You must spend it or keep it. This prevents the game from becoming a market negotiation and keeps it about veto power. |
  | **Facilitator tips the result.** | **Protocol:** Facilitators must read from a script when announcing Token Counts. "Applicant has 4 Delay Tokens." No commentary like "You're running out of time!" |

  ---

  ## (i) Limitations Statement (For Facilitator Use)

  *Read this internally to understand what you must supply in words during the debrief, as the game cannot simulate it.*

  1.  **Time Compression:**
      *   *Limitation:* The game compresses 30 years of neighborhood change into 40 minutes.
      *   *What to Supply:* "In the real world, the fear is not about one building. It is about the *trajectory* over decades. This game cannot simulate the weight of thirty years of memory. Your feelings about 'change' are heavier than this token ledger suggests."

  2.  **Scoring Bias:**
      *   *Limitation:* The game awards 'Public Good Points' for housing success. This embeds a normative assumption that *more housing is good*.
      *   *What to Supply:* "The game assumes 'Project Success' is a public good. In reality, people disagree on what constitutes the public good. Some argue stability is the good; others argue density is the good. The game tilts toward density."

  3.  **Emotional Weight:**
      *   *Limitation:* A token is not a home.
      *   *What to Supply:* "You played with plastic tokens. Real objections are fueled by fear of displacement, loss of community, or financial ruin. The game captures the *structure* of the conflict, but not the *emotion*."

  4.  **Contested Claims Flagging:**
      *   **Your Claim (Procedure):** **[CONTESTED]** Not all planners agree that procedure is the primary blocker. Some argue that if the financial incentive were removed (e.g., via land value tax), the procedural hurdles would be repealed quickly.
      *   **Friend's Claim (Finance):** **[CONTESTED]** Not all economists agree that asset protection is the sole driver. Some point to genuine environmental or infrastructure constraints that exist regardless of ownership.
      *   **Boundary Claim:** **[CONTESTED]** Political theorists disagree on whether the 'Boundary Problem' is solvable. Some argue for open borders; others argue for strict local sovereignty.

  5.  **Game Embeddings:**
      *   **[GAME ASSUMPTION]** The game assumes that 'Delay' is negative. In some planning theories, delay is a necessary cooling-off period for democracy.
      *   **[GAME ASSUMPTION]** The game assumes 'Regional' bodies are distinct from 'Local' bodies. In reality, regional bodies are often staffed by the same local elites.

  ---

  ## Final Instruction to Facilitator

  You are not there to win the argument with your friend. You are there to build a machine that allows the room to test the argument. If the room concludes your friend is right, you must accept that outcome in the debrief as a valid reading of the simulation. Your integrity as a facilitator depends on your willingness to let the data (the token counts) speak, even if it contradicts your private position.

  **Contested View Warning:** In the debrief, when discussing the results, use phrases like "One interpretation of this result is..." or "Some scholars argue this suggests..." rather than "This proves that..." This ensures you are not presenting your contested view as consensus.

  **Settled View:** It is settled that procedural complexity increases transaction costs. It is settled that boundaries define electorates. Use these as the neutral ground upon which the contested motives are debated.
