      *   *Wait, one verdict is shaky:* The Amplification verdict ("Worse than doxing"). Doxing is a direct violation of safety (physical harm risk). Amplification is probabilistic social harm. If the principle is Agency, Doxing is a stronger violation (physical safety is prerequisite for agency). The user might need to soften the "Amplification is worse" claim to "Amplification is a different *category* of violation."

  9.  **Structuring the Response:**
