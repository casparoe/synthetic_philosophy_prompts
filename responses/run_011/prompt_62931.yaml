      *   *Refining the "Truth vs. Harm" Suspicion:* Yes, the Sociologist and Hate Book cases are protected *despite* harm because of the Truth/Process value. The Deepfake (Serious) is banned *despite* being political speech because it corrupts the Process (Deception). The Deepfake (Satire) is protected because it doesn't corrupt the Process (It's legible as commentary).
      *   *So the unifying principle is:* **Protection of Epistemic Agency.** You can say anything that allows the listener to exercise judgment. You cannot say anything that removes the listener's ability to exercise judgment (Fraud, Doxing, Incitement, Deceptive Deepfakes, Algorithmic Flooding).

  6.  **Testing the "Epistemic Agency" Principle against the cases:**
