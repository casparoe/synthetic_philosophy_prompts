      *   *Corn Dealer (Mob):* Removes judgment (mob mentality). -> Not Fine.
      *   *Amplification:* Removes judgment (algorithmic imposition). -> Not Fine (or worse).
      *   *Deepfake (Serious):* Removes judgment (deception). -> Not Fine.
