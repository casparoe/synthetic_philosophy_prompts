answer: |-
  There is no single canonical term in English that captures this exact ontological niche, though several fields circle it. In social ontology, it is closest to an **Informal Status Function**. In network theory, it resembles **Betweenness Centrality**. In philosophy of mind/action, it is a species of **Response-Dependent Property**.

  However, none of these quite capture the *decay* (the requirement for ongoing throughput) and the *gradedness* (the lack of a threshold) you describe.

  The most precise label for this carving is a **Practice-Constituted Property** (or, more succinctly, a **Performative Status**).

  Below is an account of how this property differs from the nearest candidates, why the standard labels fall short, and a proposed definition with boundary cases.

  ### 1. The Nearest Candidates

  You asked specifically about reputation, debt, and love. Here is how they measure against your criteria.

  **Reputation (Epistemic Property)**
  *   **Similarity:** Graded, depends on colleagues, decays if neglected.
  *   **Difference:** Reputation is *epistemic* (about belief); your property is *ontological* (about function).
  *   **The Test:** If the team believes Alice is the payments expert but, out of habit, routes all tickets to Bob, Alice has the *reputation* but not the *property*. Bob has the *property* (he is the one problems are routed to) but not the *reputation*. Your property exists in the *routing*, not the *belief about the routing*.

  **Debt (Deontic Property)**
  *   **Similarity:** Extrinsic, relational, exists between people.
  *   **Difference:** Debt is a *stock*; your property is a *flow*. A debt persists even if no payments are made (until a legal statute lapses). It is a normative state that *awaits* action. Your property *is* the action (or the disposition to act). If the routing stops, the property doesn't just go unpaid; it ceases to be.

  **Being Loved (Affective Property)**
  *   **Similarity:** This is the strongest analog. "Being loved" exists only in the dispositions of the lovers. If they stop loving, you do not remain "secretly loved." It is graded and constitutive.
  *   **Difference:** Love is internal/phenomenological. Your property is external/functional. "Being the go-to person" does not require the colleagues to *feel* anything, only to *act* (route tickets). It is a cold recognition, not a warm one.

  ### 2. Philosophical Categories

  Here is how your property fits against standard ontological categories.

  **Ordinary Extrinsic Properties**
  *   *Example:* "Being to the left of the server."
  *   *Mismatch:* These are stable independent of attitude. If everyone leaves the room, you are still to the left of the server. Your property lapses if the "room" empties of attention.

  **Institutional Facts (Searle)**
  *   *Example:* "Being the CEO" or "Being Married."
  *   *Mismatch:* These rely on *constitutive rules* ("X counts as Y in context C"). They are typically binary (you are or aren't the CEO) and persist through temporary lapses in performance (you are still CEO while on vacation). Your property is *constituted by practice*, not rules. It is fuzzy (you can be "sort of" the go-to person) and decays immediately upon the cessation of the practice.

  **Response-Dependent Properties**
  *   *Example:* "Being red" (looks red to standard observers) or "Being funny" (amuses people).
  *   *Mismatch:* Standard response-dependence is counterfactual ("X is red iff X *would* look red..."). Your property is *actualized*. It requires the routing to actually happen, not just be possible. A person who *would* be asked but *isn't* (perhaps because the service is quiet) loses the property. It is a **Current-Dependent Property** rather than a Disposition-Dependent one.

  ### 3. The Proposed Carving: Practice-Constituted Property

  If we are to name this, we should define it by its maintenance conditions.

  **Definition:**
  A **Practice-Constituted Property** is a status attributed to an agent that:
  1.  **Supervenes on Flow:** It exists only insofar as there is throughput (tickets, questions, trust) moving through the agent from the group.
  2.  **Is Constitutive:** The routing does not *track* the status; it *generates* it. There is no underlying "expert essence" independent of the routing.
  3.  **Decays Entropically:** It requires energy (social attention) to maintain. If the flow stops, the property does not remain in stasis; it dissolves.
  4.  **Is Graded:** It admits of degrees based on the volume and consistency of the flow.

  **Boundary Cases:**

  *   **The Sleeping Expert (False Negative):** An engineer knows the payments code perfectly but is on a 3-month leave. The team routes to someone else.
      *   *Verdict:* They retain the *competence* (intrinsic) and the *reputation* (epistemic), but they lose the **Practice-Constituted Property**. When they return, they must re-accumulate it.
  *   **The Accidental Hub (True Positive):** An engineer knows very little about payments, but due to a legacy config or habit, tickets route to them, and they manage to muddle through.
      *   *Verdict:* They *have* the property. They are the person the team goes to. The property is real, even if the underlying competence is low. (This is dangerous technical debt, but ontologically, they hold the status).
  *   **The Documented Owner (Institutional Overlap):** The org chart says "Alice owns Payments."
      *   *Verdict:* This is an *Institutional Status*. If the team routes to Bob, Alice has the Institutional Status, Bob has the Practice-Constituted Property. Conflict arises when these diverge.

  ### 4. Why the Label Matters for Tooling

  You work on developer tooling. The distinction matters because tools usually model **Institutional Status** (OWNERS files, org charts, access control lists) but the work happens via **Practice-Constituted Properties**.

  *   **The Mismatch:** If your tool alerts the "Owner" (Institutional), but the "Go-To Person" (Practice-Constituted) is someone else, the alert is noise.
  *   **The Decay:** Tools assume properties are sticky. If you build a system that recommends reviewers based on past history, you must weight *recency* heavily. A property that decays requires a half-life in your algorithm.
  *   **The Discovery:** You cannot discover this property by scanning the code (intrinsic) or the HR database (institutional). You can only discover it by observing the *graph of interruptions*.

  ### Summary Recommendation

  If you need a term for documentation or architecture reviews, use **Operational Status** or **Emergent Role**.

  If you need a term for the philosophical carving itself, use **Practice-Constituted Property**.

  It distinguishes itself from *Reputation* (it is behavioral, not belief-based), from *Debt* (it is a flow, not a stock), and from *Institutional Status* (it is maintained by practice, not rule). It is the social equivalent of **electric current**: it is not a thing that flows; it *is* the flow. If the current stops, the "light" does not remain on in the dark; it simply ceases.
