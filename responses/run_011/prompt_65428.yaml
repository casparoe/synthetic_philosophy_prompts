prompt: |-
  I read a chapter in one of those pop-philosophy books about the accuracy-first turn in epistemology, and I want to know how much of it to beleive. Here's roughly the passage:

  'The newer school treats a whole system of degrees of belief as an estimate of how the world is, and estimates can be scored by how close they come to the truth. Score closeness with something like the Brier rule and you can prove a striking theorem: any set of credences that breaks the probability axioms is accuracy dominated, meaning there's an alternative set of credences that comes closer to the truth no matter which possible world turns out to be the actual one. So violating the axioms isn't a stylistic failure or a breach of convention — it's a guarantee of getting things less right, which is just what epistemic irrationality amounts to. Probability theory isn't a handy fiction we adopt because it's convenient; it's forced on you by the plain goal of believing the truth. Run the same trick over time and it settles updating too: only Bayesian conditionalization avoids leaving accuracy on the table, which finally shows the rules for changing your mind aren't arbitrary.'

  For context I'm a numerate amateur, not a philosopher — I know what a credence is and I've seen a Dutch book argument before, so I can follow the semi-technical bits if you explain them. My hunch is the middle is broadly right and the last couple sentences oversell, partly because I vaguely remember someone pointing out that it matters which scoring rule you pick, but I couldn't tell you why that's a problem.

  Can you go through this claim by claim and say what someone who actually works on this stuff would sign off on, what they'd want reworded, and what is flat-out wrong? Two things I especially want pinned down: is "dominated at every world" really what the probabilism result says, and does the conditionalization result have the same shape, or is it a different kind of argument that gets slipped in under "the same trick"? And where the passage is overstated, what would the corrected version actually claim — I want to know whether the two big takeaways (probability theory isn't conventional, updating isn't arbitrary) survive once the details are fixed, or whether they were leaning on the overselling. No bibliography needed, I'm not writing a paper, I just want the reasoning.
