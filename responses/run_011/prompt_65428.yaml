answer: |-
  Your hunch is excellent. The passage you read is a competent summary of the *ambition* of accuracy-first epistemology (often associated with Jim Joyce, Hilary Greaves, and David Wallace), but it glosses over technical conditions that philosophers in the field spend most of their time debating.

  Here is a claim-by-claim breakdown of what an expert would sign off on, what needs rewording, and what is misleading.

  ### 1. The Probabilism Claim (Synchronic)
  **Passage:** *"Any set of credences that breaks the probability axioms is accuracy dominated, meaning there's an alternative set of credences that comes closer to the truth no matter which possible world turns out to be the actual one."*

  *   **Expert Verdict:** **Broadly Correct, with technical caveats.**
  *   **The Detail:** This refers to Joyce's Argument (1998). The core mathematical result is sound: if your credences violate the probability axioms (e.g., you assign 0.6 to $P$ and 0.6 to $\text{not-}P$), there exists a probabilistic alternative that is strictly more accurate than your current set in **every possible world**.
  *   **"Dominated at every world":** You asked specifically about this. Yes, this is what the theorem says. It is a **strong dominance** argument. It doesn't say the alternative is better *on average*; it says the alternative is better *pointwise*. If the world turns out to be $W_1$, the alternative is more accurate. If $W_2$, the alternative is more accurate. This is a very strong result, much stronger than the pragmatic "Dutch Book" arguments you may have seen (which show you lose money in *some* scenarios, or that a bookie can exploit you).
  *   **The Caveat:** This result only holds if the scoring rule used to measure "closeness to truth" satisfies specific mathematical properties (continuity, strict propriety). The passage implies *any* scoring rule works, which is false. If you use a scoring rule that rewards being confidently wrong, the theorem breaks. (More on this below).

  ### 2. The Scoring Rule Caveat (Your Hunch)
  **Passage:** *"Score closeness with something like the Brier rule..."*

  *   **Expert Verdict:** **Oversold / Needs Rewording.**
  *   **Why it matters:** You remembered correctly that the choice of scoring rule is the weak link. The dominance theorem works for the Brier Score, but also for a whole class of rules called **strictly proper scoring rules**.
  *   **The Problem:** A scoring rule is "proper" if, given your actual credences, you maximize your expected score by reporting those credences honestly. But why should we use *proper* scoring rules to measure epistemic value?
      *   If I care about accuracy, I should use a measure that tracks accuracy. But "accuracy" is the very thing we are trying to define.
      *   Critics argue that assuming we must use a proper scoring rule begs the question. It assumes a specific structure of epistemic value to prove that credences must have a specific structure (probability).
  *   **Correction:** An expert would reword this to: *"If you measure accuracy using any legitimate (strictly proper) scoring rule, non-probabilistic credences are dominated."* The work is then shifted to defending why only proper scoring rules are "legitimate."

  ### 3. The Conditionalization Claim (Diachronic)
  **Passage:** *"Run the same trick over time and it settles updating too: only Bayesian conditionalization avoids leaving accuracy on the table..."*

  *   **Expert Verdict:** **Misleading / Different Argument.**
  *   **Is it the "same trick"?** **No.** This is the biggest oversell in the passage.
      *   **Probabilism** is a **synchronic** argument (about one moment in time). It relies on **actual** accuracy dominance (better in every world).
      *   **Conditionalization** is a **diachronic** argument (about change over time). The standard accuracy argument for updating (Greaves & Wallace, 2006) does **not** show that conditionalization is accuracy-dominant in every world.
  *   **The Actual Argument:** The theorem for updating shows that if you are at Time 1, and you want to choose a rule for updating at Time 2, the rule that maximizes your **expected** accuracy (from the perspective of Time 1) is Bayesian Conditionalization.
  *   **Why the distinction matters:**
      *   For probabilism, you are guaranteed to be more accurate *no matter what happens*.
      *   For conditionalization, you are guaranteed to have made the best *bet* on accuracy given what you knew *before*. But you might still end up less accurate than someone who used a different rule, depending on what evidence actually arrives.
      *   There are stronger diachronic dominance arguments (e.g., by Pettigrew), but they require extra assumptions (like "factivity"—that you know you are learning the truth). The pop-book passage glazes over this complexity by implying the math is identical to the synchronic case. It isn't.

  ### 4. The Normative Conclusion
  **Passage:** *"Probability theory isn't a handy fiction... it's forced on you by the plain goal of believing the truth."*

  *   **Expert Verdict:** **Philosophically Contested.**
  *   **The Issue:** This claims that accuracy is the *sole* or *fundamental* epistemic good. This is the "Accuracy-First" dogma.
  *   **The Objection:** Many philosophers argue that epistemic rationality involves other values, such as coherence, explanatory power, or even pragmatic utility. If you value "having a coherent worldview" more than "matching the atoms of reality," the accuracy argument might not move you.
  *   **"Forced on you":** It is not logically forced (you can physically write down incoherent numbers). It is **normatively** forced, *conditional* on you accepting accuracy as the primary goal.
  *   **Correction:** An expert would say: *"If you accept that the fundamental epistemic goal is minimizing inaccuracy, then probability theory is the unique norm that satisfies that goal."*

  ### Summary: Do the Takeaways Survive?

  You asked whether the two big takeaways survive once the details are fixed.

  **Takeaway 1: Probability theory isn't conventional.**
  *   **Verdict:** **Survives, but weakened.**
  *   **Reasoning:** It is not merely a convention or a handy fiction. If you care about accuracy, it is objectively better to be probabilistic. However, it relies on the premise that "accuracy" is measured by proper scoring rules. If you reject that measurement, the "force" of the argument dissipates. It's not a logical truth (like $2+2=4$); it's a normative truth (like "you ought to keep your promises").

  **Takeaway 2: Updating isn't arbitrary.**
  *   **Verdict:** **Survives, but significantly qualified.**
  *   **Reasoning:** Bayesian conditionalization is not just one option among many; it is the unique updater that maximizes *expected* accuracy. However, the passage implies it has the same "guaranteed success" status as probabilism (dominance at every world). It does not. It has a "guaranteed rationality of planning" status. You aren't guaranteed to be more accurate in the end, but you are guaranteed to have chosen the best strategy beforehand.

  ### Final "Translation" for a Numerate Amateur

  If you were to rewrite that passage to satisfy a working epistemologist, it would look like this:

  > 'The accuracy-first program treats credences as estimates scored by their distance from the truth. If you measure this distance using any **strictly proper scoring rule** (like the Brier score), a theorem shows that any credence set violating probability axioms is **strongly accuracy-dominated**: there is a probabilistic alternative that is more accurate in **every possible world**. This suggests violating the axioms is objectively worse for the goal of truth-tracking.
  >
  > However, extending this to **updating** requires a different argument. It cannot rely on dominance at every world. Instead, it shows that **Bayesian conditionalization** is the unique updating rule that maximizes your **expected accuracy** from your current perspective. So, while probability axioms are forced by actual accuracy, updating rules are forced by the rationality of planning for accuracy. Neither is arbitrary, provided you accept accuracy as the fundamental epistemic value.'

  **Bottom Line:** The math is real, but the pop-book hides the assumptions (proper scoring rules, accuracy-first values) and conflates two different types of theorems (synchronic dominance vs. diachronic expectation). Your skepticism about the scoring rule and the "same trick" claim was well-founded.
