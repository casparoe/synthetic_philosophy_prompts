  # Seminar Plan: The Mechanics of Authority in Blame

  ## 1. Materials List
  *   **Paper:** 16 A5 envelopes (sealed); 16 'Record Cards' (inside envelopes); 4 'Round Instruction' slips (one per table/group); 16 'Exit Slip' half-sheets.
  *   **Tokens:** 80 small counters, beans, or poker chips (5 per student).
  *   **Containers:** 2 large bowls or envelopes labelled 'Group A' and 'Group B' (for forfeited tokens); 1 'Central Pot' (for spent tokens).
  *   **Whiteboard:** Divided vertically down the centre. Left side labelled 'Group A', Right side labelled 'Group B'. Columns for 'Round 1', 'Round 2', 'Round 3', 'Round 4'.
  *   **Ledger Sheet:** A4 clipboard for the tutor (see Section 7).

  ## 2. Sealed Record Cards (Examples)
  *Note: Do not use the forbidden vocabulary on these cards. Print one per student, varied randomly.*

  **Card 1**
  *   **Your Record:** You took a book from a shop without paying.
  *   **Norm Breached:** Do not steal.
  *   **Your Entitlement:** You may judge others in this seminar.

  **Card 2**
  *   **Your Record:** You told a friend you were ill to avoid meeting them, but you were not ill.
  *   **Norm Breached:** Do not lie.
  *   **Your Entitlement:** You may judge others in this seminar.

  **Card 3**
  *   **Your Record:** You arrived twenty minutes late to a scheduled meeting without warning.
  *   **Norm Breached:** Do not waste others' time.
  *   **Your Entitlement:** You may judge others in this seminar.

  **Card 4**
  *   **Your Record:** You promised to return a borrowed item by Friday but returned it on Monday.
  *   **Norm Breached:** Keep your promises.
  *   **Your Entitlement:** You may judge others in this seminar.

  ## 3. Depletion Rules (Print on Instruction Slips)
  *Distribute Group A rules to the left half of the room, Group B to the right half. Do not allow groups to compare rules.*

  **Group A Rule (Local Forfeiture)**
  > "When you choose to judge a target, place one token in the Central Pot.
  > Check your Record Card. If the act on your Card matches the act being judged in this round, you must move **one additional token** from your supply to the Group A Forfeit Bowl.
  > You may continue to judge in future rounds provided you have tokens remaining."

  **Group B Rule (Global Forfeiture)**
  > "When you choose to judge a target, place one token in the Central Pot.
  > Check your Record Card. If the act on your Card matches the act being judged in this round, you must move **all remaining tokens** from your supply to the Group B Forfeit Bowl.
  > You may not judge in any future rounds."

  ## 4. Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Setup & Instructions** | Distribute envelopes and tokens. Read Verbatim Instructions (Section 5). |
  | **05–15** | **Round 1: Identical Fault** | Scenario: Target stole a book. Blamer (Student) decides to judge. |
  | **15–25** | **Round 2: Reformed Blamer** | Scenario: Target stole a book. Blamer (Student) stole previously but has apologised and made restitution. |
  | **25–35** | **Round 3: Normative Neighbourhood** | Scenario: Target lied on a tax form. Blamer (Student) lied to a friend (Card 2 holders active). |
  | **35–45** | **Round 4: Contrast Figures** | Scenario text describes two external figures. Students vote on who retains the right to judge. (Forfeiture rules suspended). |
  | **45–50** | **Token Count & Reveal** | Tally remaining tokens on the whiteboard. Collect cards. |
  | **50–70** | **Debrief** | Map rounds to theory. Introduce forbidden vocabulary. Address limitations. |
  | **70–75** | **Exit Slip** | Students complete and hand in on exit. |

  ## 5. Verbatim Instructions (Read Aloud)
  "Good morning. You will find an envelope and five tokens at your place. Do not open the envelope yet.

  This session is an exercise in judgment. You hold a budget of five tokens. In the coming rounds, I will present a case involving a person who has breached a norm. You must decide whether to commit a token to judge that person. If you choose not to judge, keep your token.

  Inside your envelope is a Record Card. It describes an act you have committed in the past. This record is sealed and private. Do not show it to anyone. Do not speak about the specific act on your card.

  There are rules governing how your tokens are spent and lost. These rules differ depending on which side of the room you are sitting on. Check the instruction slip on your desk now. Read it silently. Do not share it with the other side of the room.

  You have four rounds. In each round, you will decide whether to judge. After you decide, I will announce the 'Forfeiture Condition'. You will check your card privately. If your record matches the condition, you must pay the penalty described in your rules.

  We begin in one minute. Open your envelopes now."

  ## 6. Reveal Protocol (Privacy Protection)
  *To prevent Round 1 from becoming public shaming, use the 'Heads-Down' protocol.*

  1.  **Decision:** "Place a token in the Central Pot if you judge. Keep it if you pass." (Students act).
  2.  **Condition:** "The Forfeiture Condition for this round is: [e.g., The target stole a book]."
  3.  **Check:** "Heads down. Look at your Record Card. If your card matches this condition, move the penalty tokens to your Group Forfeit Bowl now."
  4.  **Reset:** "Heads up. Put your Record Card back in the envelope."

  *Tutor Note:* This ensures no one knows *who* forfeited, only that *some* tokens were forfeited (visible in the bowl).

  ## 7. Ledger Sheet (Tutor Copy)

  | Round | Forfeiture Condition | Group A Tokens Spent | Group A Forfeits | Group B Tokens Spent | Group B Forfeits |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Target: Stole Book | | | | |
  | **2** | Target: Stole Book (Blamer Reformed) | | | | |
  | **3** | Target: Tax Lie (Blamer: Social Lie) | | | | |
  | **4** | Contrast Figures (Vote Only) | N/A | N/A | N/A | N/A |

  *Fill in 'Forfeits' by counting tokens in the bowls after each round.*

  ## 8. Debrief Notes & Theory Mapping
  *Do not use the forbidden vocabulary until this section.*

  **Opening the Debrief:**
  "You may now speak freely about the mechanics. The word we have been avoiding is **standing**. The game simulated whether a blamer has the status to address a wrongdoer."

  **Round 1 (Identical Fault):**
  *   **Intuition:** Most felt the judgment was undermined.
  *   **Theory:** This maps to the **Hypocrisy Account**. When the blamer is guilty of the same fault, their judgment is often viewed as invalid.
  *   **Distinction:** Ask the room: "Did you feel the blame was *wrong* (morally criticisable), or that the blamer had no *right* to speak (entitlement)?"
      *   *Criticisable:* The act of blaming is itself a moral failure.
      *   *Entitlement:* The target can rightfully reject the address ("Who are you to tell me?"). This is the **Standing** claim.

  **Round 2 (Reformed Blamer):**
  *   **Intuition:** Did tokens stop forfeiting? Did students feel more comfortable judging?
  *   **Theory:** This tests the **Waiver or Reform Account**. Some argue standing is lost permanently by the act; others argue it is restored by repentance.
  *   **Philosopher:** This aligns with views similar to **R. Jay Wallace** (normative competence can be restored) versus stricter retributive views.

  **Round 3 (Normative Neighbourhood):**
  *   **Intuition:** Did Group A forfeit? (Their rule said 'matches the act'). Did they feel they should have?
  *   **Analysis:** This round tests whether standing is norm-specific or general.
  *   **Diagnostic Question:** "Did you hesitate because the acts were *different*, or because the underlying *value* was the same?"
      *   *If Different:* You view standing as local to the specific norm (e.g., I can blame for lying even if I steal).
      *   *If Same:* You view standing as tied to a broader value (e.g., Integrity).
  *   **Collapse Warning:** This round risks collapsing into a question of **degrees of similarity**. Is a tax lie 'close enough' to a social lie? The mechanic forces a binary choice, but the intuition is likely scalar.

  **Round 4 (Contrast Figures):**
  *   **Scenario 1:** Blamer stole £1000, admits it, blames target for £10.
  *   **Scenario 2:** Blamer stole £15, denies it, blames target for £10.
  *   **Theory:** This isolates **Consistency vs. Severity**.
      *   Scenario 1 suggests standing is retained through **acknowledgment** (solidarity in imperfection).
      *   Scenario 2 suggests standing is lost through **self-exemption** (claiming moral superiority).
  *   **Philosopher:** This resonates with **Macalester Bell**'s work on the functions of blame (standing requires acknowledging shared fallibility).

  **Property of the Pair:**
  "Is standing a property of the blamer alone, or the pair?"
  *   *Blamer Alone:* It is a status I possess (like a badge).
  *   *The Pair:* It is a relation between us. I may have standing to blame you, but not him, based on our shared history. The game treated it as a property of the blamer (your card), but in reality, it is often relational.

  **Limitations (Verbal Supply):**
  *   *Relational Costs:* "In this game, losing tokens cost you nothing real. In life, losing standing costs relationships. You cannot simulate the pain of rejection with beans." **(Say this at 60 mins)**.
  *   *Second-Personal Authority:* "Tokens are third-personal currency. Real blame is a demand made *to* someone. It claims authority over *them*. This game cannot instantiate that authority; it only simulates the budget." **(Say this at 62 mins)**.
  *   *Assessment Context:* "You are being observed by me. In the real world, blame happens in private. Here, you performed 'correct' moral reasoning for a grade. Be aware this shapes your choices." **(Say this at 64 mins)**.

  ## 9. Failure Modes & Interventions

  **1. Token Hoarding (Students refuse to spend)**
  *   *Symptom:* Central Pot remains empty in Round 1.
  *   *Cause:* Fear of forfeiture or treating tokens as points to win.
  *   *Intervention:* Pause at 10 mins. Say: "Tokens are not scores. They are a budget for engagement. If you do not spend them, you are not participating in the judgment exercise. I am not marking you on how many you keep."

  **2. The 'Gotcha' Hunt (Students trying to guess others' cards)**
  *   *Symptom:* Whispers like "Did you get the theft card?"
  *   *Cause:* Curiosity overrides the privacy protocol.
  *   *Intervention:* Stop the room. Say: "The integrity of this exercise relies on the secrecy of your Record. If you discuss your cards, the data is corrupted. Please return to silence."

  **3. Round 3 Overrun (Debate on similarity)**
  *   *Symptom:* Students arguing whether tax lies and social lies are the 'same'.
  *   *Cause:* The 'Normative Neighbourhood' concept is inherently fuzzy.
  *   *Intervention:* Cut off debate at 32 mins. Say: "Hold that thought. The friction you feel *is* the data point. We will analyse that fuzziness in the debrief. Move to Round 4."

  ## 10. Exit Slip (Last 3 Minutes)
  *Print two questions on a half-sheet. Collect on exit.*

  1.  "In Round 2 (Reformed Blamer), did you feel the blamer regained the right to judge? Yes / No. Briefly state why."
  2.  "Imagine a blamer who lies frequently but never steals. Do they have the right to blame a thief? Yes / No. Briefly state why."

  *(Tutor Analysis: Q1 tracks the Reform/Waiver theory. Q2 tracks the Local vs. Global standing theory.)*

  ## 11. What This Activity Cannot Reproduce
  *You must supply this verbally during the Debrief (see Section 8). Do not put this in writing on the handouts.*

  1.  **Relational Costs:** The token loss is abstract. Real loss of standing involves estrangement or loss of friendship.
      *   *Verbal Fill:* "In this game, losing tokens cost you nothing real. In life, losing standing costs relationships. You cannot simulate the pain of rejection with beans."
  2.  **Second-Personal Authority:** The tokens represent a third-personal resource. Real blame is a second-personal demand (I demand *of you*).
      *   *Verbal Fill:* "Tokens are third-personal currency. Real blame is a demand made *to* someone. It claims authority over *them*. This game cannot instantiate that authority; it only simulates the budget."
  3.  **The Assessment Context:** Students are performing for you.
      *   *Verbal Fill:* "You are being observed by me. In the real world, blame happens in private. Here, you performed 'correct' moral reasoning for a grade. Be aware this shapes your choices."
