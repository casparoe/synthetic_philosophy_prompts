  ### Final Paper Question

  **Time Allowed:** 75 Minutes
  **Total Marks:** 20

  **Case:**
  Ada's doxastic state regarding a coin toss is represented by a set of probability functions, $\mathcal{P}$. She is offered two bets separately, in either order.
  *   **Bet A:** Pay \$6 now. Receive \$10 if the coin lands Heads ($H$).
  *   **Bet B:** Pay \$6 now. Receive \$10 if the coin lands Tails ($\neg H$).
  *   **Note:** Accepting both costs \$12 and returns \$10 regardless of the outcome (a sure loss of \$2).

  Ada uses **Rule 1** to decide whether to accept a bet: *Accept any bet that yields a non-negative expected value for at least one member of $\mathcal{P}$.*

  **Part (a) [5 Marks]**
  In the initial scenario, $\mathcal{P}$ contains all functions assigning $P(H)$ a value in the range $[0.3, 0.7]$.
  1.  Write the expected value (EV) of Bet A and Bet B as a function of $p = P(H)$.
  2.  Identify the precise sub-range of $[0.3, 0.7]$ for which Bet A is admissible under Rule 1, and the sub-range for which Bet B is admissible.
  3.  Explain why no *single* probability function in $\mathcal{P}$ renders both bets admissible simultaneously.

  **Part (b) [5 Marks]**
  Ada accepts both bets under Rule 1 and suffers the sure loss.
  1.  Does this prove that having an imprecise doxastic state (a set of functions) is irrational?
  2.  Explain why the sure loss arises from the bets being evaluated *separately* rather than as a package, noting that the package itself would be refused under Rule 1.

  **Part (c) [10 Marks]**
  Consider a modified scenario. Ada is now *sharp* on the coin: every member of $\mathcal{P}$ assigns $P(H) = 0.7$. However, she is imprecise regarding a report $R$ she expects to receive. Her set $\mathcal{P}$ contains two functions, $P_1$ and $P_2$, with the following likelihoods:
  *   $P_1(R|H) = 0.9$ and $P_1(R|\neg H) = 0.1$
  *   $P_2(R|H) = 0.1$ and $P_2(R|\neg H) = 0.9$

  1.  Derive the posterior credence $P(H|R)$ for both $P_1$ and $P_2$ after the report arrives.
  2.  Can a Dutch book be constructed against Ada using the same \$6/\$10 bets? Indicate which bet is accepted before the report and which is accepted after (assuming Rule 1 is applied at both times).
  3.  Conclude whether the vulnerability here stems from imprecision about the coin itself or from the interaction between imprecise likelihoods and the acceptance rule.

  ***

  ### Model Answer

  The expected value of Bet A is $10p - 6$, and Bet B is $10(1-p) - 6$. For Bet A to be admissible under Rule 1, there must exist some $p \in [0.3, 0.7]$ such that $10p - 6 \ge 0$, which implies $p \ge 0.6$. The admissible sub-range is $[0.6, 0.7]$. For Bet B, we require $10(1-p) - 6 \ge 0$, implying $p \le 0.4$. The admissible sub-range is $[0.3, 0.4]$.

  No single function renders both admissible because the conditions $p \ge 0.6$ and $p \le 0.4$ are mutually exclusive. A precise agent with $p=0.5$ would reject both. The sure loss arises only because Rule 1 allows the agent to act on the *union* of admissible options across the set, effectively allowing different "selves" within the set to authorize different bets.

  This does not prove that imprecise doxastic states are inherently irrational. The irrationality lies in Rule 1. If Ada evaluated the bets as a package, the total expected value for any $p$ would be $(10p - 6) + (10(1-p) - 6) = 10 - 12 = -2$. Since every member of $\mathcal{P}$ assigns the package a negative value, Rule 1 would reject the package. The vulnerability is created by sequential evaluation, which permits the agent to exploit local optimism in different members of the set without respecting the global coherence of the set as a single agent's constraint. The defect is not the representation of uncertainty, but the failure to enforce a decision rule that respects the set as a unified constraint on choice.

  In the modified scenario, the prior is sharp: $P(H) = 0.7$ for all members.
  For $P_1$:
  $P_1(R) = P_1(R|H)P(H) + P_1(R|\neg H)P(\neg H) = (0.9)(0.7) + (0.1)(0.3) = 0.63 + 0.03 = 0.66$.
  $P_1(H|R) = \frac{0.63}{0.66} \approx 0.95$.
  For $P_2$:
  $P_2(R) = (0.1)(0.7) + (0.9)(0.3) = 0.07 + 0.27 = 0.34$.
  $P_2(H|R) = \frac{0.07}{0.34} \approx 0.21$.

  A Dutch book can be constructed.
  **Before the report:** Bet A (on Heads) is offered. Since $P(H)=0.7$ for all members, the EV is $10(0.7) - 6 = 1$. Every member finds this favourable. Ada accepts Bet A.
  **After the report:** Bet B (on Tails) is offered. This pays if $\neg H$.
  For $P_1$, $P(\neg H|R) \approx 0.05$. EV is negative.
  For $P_2$, $P(\neg H|R) \approx 0.79$. EV is $10(0.79) - 6 = 1.9$.
  Under Rule 1, since $P_2$ finds Bet B favourable, Ada accepts Bet B.
  **Result:** Ada has paid \$12 (\$6 pre-report, \$6 post-report) and will receive \$10 regardless of the outcome.

  The vulnerability here does not stem from imprecision about the coin *prior* to the report; the pre-report state was sharp ($0.7$) and unanimous. The imprecision concerned the *reliability* of the evidence (the likelihoods). The book succeeds because Rule 1 allows the post-report decision to be dictated by the member of the set ($P_2$) that interprets the report as strong evidence against Heads, ignoring the member ($P_1$) that interprets it as evidence for Heads. The damage is done by a rule that permits the agent to switch which probability function governs their betting disposition based on which one offers a favourable gamble, rather than requiring a policy that is robust across the entire representing set. The imprecise state is merely the terrain; Rule 1 is the trap.

  ***

  ### Marking Scheme

  **Must-Hit Points (Total 20 Marks)**

  1.  **Correct EV Functions & Admissible Ranges (Part a) [4 Marks]**
      *   *Requirement:* Must identify $EV_A = 10p-6$ (Range $[0.6, 0.7]$) and $EV_B = 4-10p$ (Range $[0.3, 0.4]$).
      *   *Common Botch:* Calculating break-even at 0.5 (ignoring the \$6/\$10 ratio) or failing to intersect with the given set $[0.3, 0.7]$.

  2.  **Single-Function Incompatibility (Part a) [4 Marks]**
      *   *Requirement:* Must explicitly state that $p \ge 0.6$ and $p \le 0.4$ cannot hold for a single $p$.
      *   *Common Botch:* Stating the ranges are disjoint without explaining that a single agent cannot hold both credences simultaneously.

  3.  **Rule vs. State Diagnosis (Part b) [4 Marks]**
      *   *Requirement:* Must argue the state is not necessarily irrational; the fault is Rule 1's sequential evaluation allowing "cherry-picking" across the set.
      *   *Common Botch:* Concluding that imprecise probabilities are irrational *per se* because they allow a Dutch book.

  4.  **Correct Posterior Calculation (Part c) [4 Marks]**
      *   *Requirement:* Correct application of Bayes' theorem yielding approx $0.95$ and $0.21$ (or exact fractions $21/22$ and $7/34$).
      *   *Common Botch:* Assuming posteriors remain 0.7, or swapping the likelihoods for $H$ and $\neg H$.

  5.  **Diachronic Book Construction (Part c) [4 Marks]**
      *   *Requirement:* Identify Bet A accepted Pre-Report (all agree) and Bet B accepted Post-Report (only $P_2$ agrees), resulting in sure loss.
      *   *Common Botch:* Claiming no book is possible because the pre-report state was sharp, missing that the post-report imprecision drives the second bet.

  **Minor Errors (Deduct 1-2 marks total, do not zero)**
  *   Reporting the loss as \$2 without explicitly summing the costs/returns.
  *   Minor arithmetic slips in Part (c) posteriors (e.g., 0.20 instead of 0.21) if the logic remains sound.
  *   Suggesting Rule 2 (maximin) solves the problem without acknowledging it may lead to excessive caution (though this is not required for full marks, ignoring the "why" of Rule 1's failure is a bigger issue).

  ***

  ### Note to Instructor

  My model answer takes a committed stance that the irrationality lies in **Rule 1** (the acceptance rule) rather than the imprecise state itself. A good student could reasonably dispute this by arguing that a rational doxastic state *must* supply a unique betting disposition, implying that if the state fails to do so without inconsistency, the state itself is defective. I have enforced the view that the state is a representation of ignorance and the rule is a separate normative commitment.

  Additionally, I revised the numbers in **Part (c)**. Your original prompt specified a sharp prior of $P(H)=0.5$ with likelihoods of $0.2/0.8$ and a marginal $P(R)=0.5$. Mathematically, these constraints force $P(H)=0.5$, which makes the pre-report bet (Cost \$6, Pay \$10) unfavourable (EV = -1). This would prevent the first step of the Dutch book. I changed the sharp prior to **$P(H)=0.7$** and adjusted the likelihoods to ensure the pre-report bet is favourable for all members, allowing the diachronic book to function as you intended.
