      *   *Best Revision:* Modify Claim 1. Instead of "no sharp line separating sentient from insentient," say "no sharp line separating *degrees of sentience among sentient creatures*." This preserves the gradualism within the moral community without forcing you into panpsychism or vagueness about the entry ticket.
      *   *Wait, is that the "most" cleanup?* The Expected Value issue (6+7) is more disruptive to the *workshop* context. If the audience realizes your view implies we should burn down cities to save ant hills (due to aggregation + uncertainty), the workshop becomes about that, not gradations.
