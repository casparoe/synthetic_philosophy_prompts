      4.  *Hedonism:* Welfare = balance of positive/negative experience.
      5.  *No Deprivation:* Painless killing doesn't harm (no Future Like Ours argument). Only suffering matters.
      6.  *Aggregation:* Moral weight aggregates (sum total). Many low-sentience > Few high-sentience.
      7.  *Epistemic Uncertainty vs. Ontological Fact:* Uncertain if insects are sentient (20-40%), but moral weight depends on *actual* sentience, not belief.

  3.  **Initial Scan for Tensions:**

      *   *1 & 2:* Gradualism vs. Non-Panpsychism. Is there a tension between "no sharp line" and "thermostats aren't conscious"? Not necessarily. You can have a continuum that starts at zero and goes up, without everything having *some* consciousness. (Apparent tension).
      *   *3 & 4:* Welfare Capacity vs. Hedonism. Hedonism is a specific theory *of* welfare capacity. These fit well together. (No tension).
      *   *4 & 5:* Hedonism vs. No Deprivation. If welfare is experience, death ends experience. If death is painless, no negative experience occurs. This seems consistent. (No tension).
      *   *5 & 6:* No Deprivation vs. Aggregation. If killing doesn't harm, we only care about suffering. Aggregation says many small sufferings > few big sufferings. This implies we should prioritize preventing vast amounts of tiny sufferings over saving fewer complex lives. This is consistent but leads to counterintuitive results (The "Insect Swarms" problem). (Potential practical tension, but logically consistent).
      *   *1 & 7:* Gradualism vs. Epistemic Uncertainty. Claim 1 says weight scales with sentience. Claim 7 says we aren't sure if insects are sentient. If they *aren't*, weight is zero. If they *are*, weight is low. Claim 7 says weight is fixed by reality, not belief. This creates a decision-theory problem (Expected Value vs. Ontological Fact). (Genuine tension in application).
      *   *6 & 7:* Aggregation vs. Uncertainty. If aggregation holds (6), and insects *might* be sentient (7), the expected value of caring about insects explodes due to numbers, even at low probability. But 7 says weight is fixed by fact, not belief. This creates a conflict between *how to act under uncertainty* and *what determines moral truth*.
