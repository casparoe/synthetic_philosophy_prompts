      *   *Decision:* The Sorites tension is the "hard" logical bug. The Aggregation/Uncertainty tension is the "soft" practical bug. I will rank Sorites #1.
      *   *Revision:* Change Claim 1 to restrict gradualism to the *range* of sentience, not the *threshold*.

