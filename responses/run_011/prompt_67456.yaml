answer: |-
  This is a sophisticated position. You have essentially constructed a **Unanimity Preorder over Shift-Invariant Means** (Banach Limits) applied to the indicator function of "lives above neutral." You are prioritizing **Anonymity** (shift-invariance) and **Caution** (unanimity) over **Completeness** and **Pareto**.

  You asked for proofs over intuitions and a map of exposure. Below is the technical audit of the Equidensity View, ranked from fatal structural collapses to methodological costs.

  ### 1. The Interval Collapse (Fatal to Scope)
  **The Theorem:** Let $\mathcal{M}$ be the set of all shift-invariant finitely additive probability measures on $\mathbb{N}$. For any set $A \subseteq \mathbb{N}$ (representing lives above neutral), the set of values $\{ \mu(A) : \mu \in \mathcal{M} \}$ is exactly the closed interval $[\underline{d}(A), \overline{d}(A)]$, where $\underline{d}$ and $\overline{d}$ are the lower and upper asymptotic densities.

  **The Consequence:** Your criterion for strict betterness ($W_1 \succ W_2 \iff \forall \mu, \mu(A_1) > \mu(A_2)$) is extensionally equivalent to:
  $$ \underline{d}(A_1) > \overline{d}(A_2) $$
  Your criterion for equality ($W_1 \sim W_2 \iff \forall \mu, \mu(A_1) = \mu(A_2)$) is extensionally equivalent to:
  $$ \underline{d}(A_1) = \overline{d}(A_1) = \underline{d}(A_2) = \overline{d}(A_2) $$
  **The Exposure:** You have not avoided the "Cesaro limit is privileged" problem; you have merely hidden it behind the machinery of Banach limits. The unanimity condition over *all* shift-invariant measures collapses entirely into a comparison of **Natural Densities**.
  *   **Why this hurts:** You claimed you bought machinery to avoid pretending the Cesaro limit is uniquely privileged. But mathematically, requiring unanimity across *all* Banach limits forces you to only make verdicts where the Natural Density *exists*. If the Natural Density does not exist (i.e., $\underline{d} < \overline{d}$), the interval is non-degenerate, and there will exist measures $\mu_1, \mu_2$ that disagree on the value.
  *   **Verdict:** You haven't generalized beyond Natural Density; you've restricted your view to *only* cases where Natural Density is well-defined, while claiming the broader mantle of "all shift-invariant measures."

  ### 2. The Sparsity of Equality (Fatal to Intended Consequences)
  **The Case:** You stated: *"The heaven-and-hell style worlds where half the people are blissful and half are wretched come out equal no matter how they're arranged."*
  **The Proof:** Let $W_1$ be a periodic arrangement (HTHTHT...). $\underline{d}(W_1) = \overline{d}(W_1) = 0.5$.
  Let $W_2$ be a block arrangement (H, T, HH, TT, HHH, TTT...). $\underline{d}(W_2) = 0$, $\overline{d}(W_2) = 1$ (depending on block growth rates).
  Even if you tune $W_2$ so $\underline{d}(W_2) = 0.4$ and $\overline{d}(W_2) = 0.6$, the Interval Collapse theorem shows that there exists a shift-invariant measure $\mu_a$ such that $\mu_a(W_2) = 0.4$ and a measure $\mu_b$ such that $\mu_b(W_2) = 0.6$.
  Since $\mu_a(W_1) = 0.5$, we have $\mu_a(W_1) > \mu_a(W_2)$.
  Since $\mu_b(W_1) = 0.5$, we have $\mu_b(W_1) < \mu_b(W_2)$.
  **The Exposure:** Under your definition ("tie on all such measures"), $W_1$ and $W_2$ are **not equally good**. They are **incomparable**.
  For two worlds to be "exactly equally good" on your view, *both* must possess a convergent natural density, and those densities must be identical. Any world with oscillating density (which includes most "arbitrary" arrangements of infinite populations) cannot be declared equal to *any* world, including itself if reordered to oscillate differently.
  *   **Verdict:** This contradicts your stated consequence. You wanted to say different arrangements of 50/50 are equal. Your math says they are incomparable. To save the consequence, you must weaken the "tie" condition, but doing so violates your "no tiebreaker" constraint.

  ### 3. The Pareto Violation (Serious Cost)
  **The Axiom:** **Strong Pareto:** If $W_1$ and $W_2$ are identical except $W_1$ has one additional person with positive welfare (or one person is made better off), then $W_1 \succ W_2$.
  **The Result:** Shift-invariant measures assign measure 0 to any finite set. Therefore, adding a finite number of wonderful lives changes the density by 0.
  $$ \underline{d}(A \cup F) = \underline{d}(A) \quad \text{for finite } F $$
  **The Exposure:** You explicitly accept this ("adding a merely finite number... changes nothing at all").
  *   **Concession vs. Question-Begging:** This is a **concession**. In the context of infinite ethics, this is the standard price of Anonymity (see *Basu & Mitra 2003*, *Lauwers 1997*). You cannot have Shift-Invariance and Strong Pareto on infinite domains.
  *   **The Cost:** It renders the view insensitive to "local" improvements. If you can save a billion people from torture but it requires shifting the index of the infinite sequence (violating shift-invariance) or is just a finite addition (violating Pareto sensitivity), your view is silent or indifferent.
  *   **Rank:** Not fatal (many infinite ethicists bite this), but it severely limits the view's action-guiding capacity in realistic scenarios (which are usually finite perturbations of a background).

  ### 4. Predictive Differences vs. Rivals
  You asked what this predicts that Leximax or Overtaking don't.
  *   **Vs. Leximax:** Leximax is positional. It cares *who* is at position 1. Equidensity is radically anonymous.
      *   *Prediction:* Swap the welfare of person 1 and person $10^{100}$. Leximax may change verdict (if person 1 was the worst off). Equidensity verdict is invariant.
  *   **Vs. Overtaking (Utilitarian):** Overtaking sums welfare. Equidensity counts density of "good" lives (binary).
      *   *Prediction:* A world with $10^{100}$ people at welfare +1 and the rest at 0 vs. a world with everyone at +0.0001. Overtaking prefers the first (infinite sum dominates). Equidensity prefers the second (density 1.0 vs density 0).
  *   **Vs. Average Utilitarianism:** On infinite domains, Average Util is often undefined. Equidensity provides a verdict *if* densities converge.
  *   **The Rent:** The view pays rent by providing a **robust anonymity** that avoids the "tyranny of the early positions" inherent in Leximax/Overtaking. If you value Anonymity above Pareto, this is the view for you.

  ### 5. Methodological Insulation and Normative Risk
  You worry: *"Have I insulated it by qualification?... If it is that well protected, is that a defect here?"*

  **The Analog of Failed Prediction:**
  In empirical science, a theory fails if it predicts $X$ and we observe $\neg X$.
  In normative theory, a view fails if:
  1.  **Incoherence:** It violates its own axioms (e.g., intransitivity). Your view is a partial preorder, so it is coherent.
  2.  **Impotence:** It fails to rank cases where we have strong intuitive consensus.
  3.  **Reflective Disequilibrium:** It forces you to accept consequences you cannot endorse upon reflection.

  **The Insulation Critique:**
  Your view is insulated against *mathematical arbitrariness* (by using all measures) but vulnerable to *normative vacuity*.
  *   **The Risk:** By requiring unanimity across all shift-invariant measures, you have created a **sparse order**.
      *   If $\underline{d}(A) = 0.4, \overline{d}(A) = 0.6$ and $\underline{d}(B) = 0.5, \overline{d}(B) = 0.5$, your view says **Incomparable** (because some measures say $A>B$, some say $B>A$).
      *   Most interesting infinite worlds will have oscillating densities. Thus, most worlds will be incomparable.
  *   **Is this a defect?** Yes, if the goal of population ethics is to guide choice. A map that leaves 90% of the territory blank is accurate but useless.
  *   **Defense:** You can argue that "Incomparable" is the honest verdict. If the math doesn't settle it, ethics shouldn't pretend to. But this retreats from "Equidensity View" to "Equidensity Heuristic for Comparability."

  ### Summary of Defeaters (Ranked)

  1.  **Fatal (Mathematical):** **The Interval Collapse.** Your "all measures" criterion is extensionally equivalent to "Natural Density exists and is greater." You have not escaped the limitations of Cesaro/Natural density; you have simply made the conditions for a verdict stricter.
  2.  **Fatal (Intuitive):** **The Equality Sparsity.** Your claim that "Heaven/Hell arrangements are equal" is false under your own definition. They are incomparable unless they share the exact same convergent density. You must either accept incomparability (weakening the view) or add a tiebreaker (violating the view).
  3.  **Serious (Normative):** **Pareto Insensitivity.** Finite improvements do not matter. This is consistent but costly. It means the view cannot adjudicate most policy decisions (which are finite changes).
  4.  **Awkward (Methodological):** **Vacuity.** The view yields "Incomparable" for almost all pairs of worlds where densities oscillate. This protects you from error but exposes you to irrelevance.

  ### Recommendation
  If you want to keep the spirit of the view but fix the "Equality" bug, you must change the tie condition.
  *   **Option A:** Accept Incomparability. Admit that chaotic Heaven/Hell worlds are not *equal*, but *incomparable*. This is mathematically honest but normatively weak.
  *   **Option B:** Switch to **Lower Density Dominance**. $W_1 \succeq W_2 \iff \underline{d}(W_1) \ge \overline{d}(W_2)$. This gives more verdicts but is still sparse.
  *   **Option C:** Acknowledge the **Natural Density** core. Drop the "all Banach limits" language and admit the view is: *"Worlds are comparable iff they have natural densities; rank by those densities."* This is simpler, honest, and avoids the false promise that it handles oscillating cases as "equal."

  **Final Verdict:** You have not insulated the view; you have narrowed it. The "risk" is not that it will be proven false, but that it will be proven **empty**. In normative theory, emptiness is a form of falsification.
