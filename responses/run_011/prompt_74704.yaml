answer: |-
  **Project Title:** Beyond Erasure and Endorsement: Measuring the Semantic Life of Contested School Names

  **Research Question**
  Does the continued display of a contested historical namesake function as an active endorsement of their ideology, or does it operate as semantic inertia with no current moral weight? How does the community's subsequent action (or inaction) determine which of these two meanings becomes dominant?

  **Problem Statement: The Limits of the Binary**
  Current debates regarding contested public memory typically stall between two fixed positions. The "Removal" camp argues that maintaining a name constitutes an ongoing endorsement of the namesake's harmful actions (voter suppression, housing discrimination). The "Preservation" camp argues that removing the name judges historical figures by modern standards and erases local history.

  Both positions fail because they assume the name has a fixed meaning. They treat the name as a static monument: either it *is* racist, or it *is* history. This proposal argues that the meaning is not static; it is functional. A name left on a building without context or discussion may be inertia (meaningless). That same name, defended aggressively against change, becomes active endorsement. Conversely, keeping a name while actively teaching the full, ugly history could transform it into a tool for education rather than honor. Because the committee is currently debating the *name* rather than the *function* of the name, they are talking past each other. This research seeks to move the metric from "What did he do?" to "What does this sign do *now*?"

  **Methodology: Six-Week Narrative Audit**
  Standard surveying is insufficient for this question. Surveys force binary choices (Keep/Remove) and invite performative social desirability bias (respondents answering how they think they *should*). Instead, I will conduct a qualitative "Narrative Audit" over six weeks.

  *   **Weeks 1-2 (Textual & Spatial Analysis):** I will map how the namesake is currently presented in the school ecosystem. This includes analyzing website "About Us" pages, lobby plaques, and curriculum mentions. I am looking for the ratio of *honorific* language (statues, portraits, "Founder") vs. *informational* language (dates, biographical facts). This establishes the baseline: is the current environment one of reverence or record-keeping?
  *   **Weeks 3-4 (Structured Focus Groups):** I will convene three small groups (students, long-term residents, faculty). Instead of asking "Should we change the name?", I will ask scenario-based questions: "If we add a plaque explaining his voting record, does the name bother you less?" or "If we change the name, do you feel you know less about the town's history?" This isolates whether the objection is to the *person* or the *silence* surrounding the person.
  *   **Weeks 5-6 (Synthesis & Modeling):** I will code the interview data for keywords related to "inertia" (e.g., "never noticed," "doesn't matter") vs. "endorsement" (e.g., "proud," "honored," "ashamed"). I will then model three scenarios for the committee: 1. Status Quo, 2. Removal, 3. Retention with Contextualization.

  **Deliverable: A Decision Matrix for the Committee**
  The final output will not be a recommendation to keep or remove the name. It will be a "Meaning & Risk Matrix" for the committee. This document will outline:
  1.  **The Inertia Threshold:** Data indicating how many community members genuinely do not associate the name with the man's racism (suggesting low active harm).
  2.  **The Contextualization Viability:** An assessment of whether adding historical context (plaques, curriculum) successfully mitigates the "endorsement" feeling for the opposition.
  3.  **The Erasure Risk:** An assessment of whether removal is perceived as hiding history or correcting it.

  This gives the committee actionable data: if the research shows the name is mostly "inertia," they can choose to contextualize rather than remove. If the research shows the name is felt as "active endorsement" regardless of context, removal is the only viable path to community cohesion.

  **Criteria for Failure**
  This project fails if:
  1.  **Polarization overwhelms nuance:** If focus group participants refuse to engage with the scenario questions and revert to shouting their pre-existing binary stance, the data will be unusable.
  2.  **Abstraction:** If the final Matrix is too philosophical for the committee to apply to a vote (e.g., if I cannot translate "semantic inertia" into clear policy options).
  3.  **Sample Bias:** If I only interview people who already agree with my mother's position or the opposition, invalidating the "community" perspective.

  ***

  ### Honest Feedback: Is this too big?

  **Yes, this is borderline too big for six weeks.**

  Here is the risk: You are trying to solve a sociological and philosophical problem (the nature of public memory) while also delivering a practical political tool (a committee guide). That is a lot of cognitive load.

  **The specific bottlenecks:**
  1.  **IRB/Ethics:** If this summer program is affiliated with a university, interviewing people (even in focus groups) about sensitive political/racial topics often requires ethical review board approval. That process alone can take 4-6 weeks. *Fix: Frame this as "oral history" or "analysis of public discourse" rather than human subjects research, or check if the program has a waiver for high schoolers.*
  2.  **Access:** Getting three distinct focus groups (students, residents, faculty) to commit time in the summer is hard. *Fix: Narrow your scope. Just interview students and alumni. They are the ones who actually inhabit the building.*
  3.  **Analysis:** Coding qualitative interview data for "inertia vs. endorsement" is complex work. *Fix: Simplify the metric. Just track "Emotional Valence" (Positive, Negative, Neutral) associated with the name in different contexts.*

  **How to make it doable:**
  Keep the core insight (meaning shifts based on action), but narrow the method. Don't try to solve the town's debate. Solve the *school's* debate. Focus entirely on the student body's perception. If you can prove that students feel the name is "inertia" (they don't care) vs "endorsement" (they feel proud of him), that is enough for a killer proposal without needing to map the whole town's psychology.

  **Verdict:** The *idea* is A+ material. It shows critical thinking beyond your years. But for the *execution*, trim 30% of the scope so you don't burn out in Week 3.
