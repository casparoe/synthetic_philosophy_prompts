  ## Part II: The Leaves (Named Positions)

  *   **Leaf A:** **Deflationism.** (The question is ill-posed).
  *   **Leaf B:** **Permissivism.** (No unique rational credence).
  *   **Leaf C:** **Decision-Relative Pragmatism.** (Credence is defined by betting price).
