  ## Part III: Analysis of the Three Constructed Cases

  For each of the three cases you constructed, here is what every position (Leaf) is committed to saying.

  ### 1. Rehearsal
  *Setup: Heads (1 awakening). Tails (2 awakenings, but Tuesday is distinct/memory-restored).*
