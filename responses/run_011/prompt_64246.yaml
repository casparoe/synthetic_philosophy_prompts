  # The Sleeping Beauty Diagnostic Instrument

  ## Part I: The Decision Tree

  **Instructions:** Begin at **Node 1**. Answer the question or evaluate the claim. Follow the arrow corresponding to your answer. Continue until you reach a **Leaf**. Record the name of the Leaf.

  **Node 1 (Claim):** Is the question "What is Beauty's credence in Heads?" well-defined independent of any specific betting scenario or decision problem?
  *   **No** → Go to **Leaf A**.
  *   **Yes** → Go to **Node 2**.

  **Node 2 (Claim):** Is there exactly one rational credence function compatible with the setup?
  *   **No** → Go to **Leaf B**.
  *   **Yes** → Go to **Node 3**.

  **Node 3 (Case: The Broker):** Is the rational price Beauty should fix on Sunday identical to the rational price she should be willing to pay when awake on Monday?
  *   **No** → Go to **Node 4**.
  *   **Yes** → Go to **Node 5**.

  **Node 4 (Claim):** If a rational agent's betting price diverges from her intuitive degree of belief, does the betting price define the credence?
  *   **Yes** → Go to **Leaf C**.
  *   **No** → Go to **Leaf D**.

  **Node 5 (Claim):** Can a proposition containing an implicit "I" or "now" bear a credence that updates the probability of an external event (like a coin flip)?
  *   **No** → Go to **Node 6**.
  *   **Yes** → Go to **Node 7**.

  **Node 6 (Claim):** Is Beauty's total evidence on Monday exhausted by propositions statable without indexicals (e.g., "The coin was flipped")?
  *   **Yes** → Go to **Leaf E**.
  *   **No** → Go to **Leaf F**.

  **Node 7 (Case: Rehearsal):** Is Beauty's credence in Heads on Monday in *Rehearsal* the same as in the *Original* problem?
  *   **No** → Go to **Leaf D**.
  *   **Yes** → Go to **Node 8**.

  **Node 8 (Claim):** Can a rational agent shift her credence without having learned anything she did not already know she would learn?
  *   **No** → Go to **Leaf F**. *(Note: Rerouted to ensure Halfer/Thirder split)*
  *   **Yes** → Go to **Node 9**.

  **Node 9 (Case: The Duplicated Form):** Do Ada and Bea have the same credence in Heads?
  *   **No** → Go to **Leaf G**.
  *   **Yes** → Go to **Leaf H**.

