  *   **Leaf F:** **Lewisian Halfer.** (1/2 always; new self-locating evidence is irrelevant).
  *   **Leaf G:** **Thirder (Self-Locating).** (1/3; perspective matters).
  *   **Leaf H:** **Thirder (Observer Counting).** (1/3; counting observer-moments matters).

