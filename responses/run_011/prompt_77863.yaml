answer: |-
  There is only a faint and low hum.
  It catches for a second in the light.
  It carries almost no perceptible weight.
  It knows no skin, it knows no touch.
  It makes no echo, makes no sound.
  It radiates a barely there heat.

  Add another spike of heat.
  Double the soft and constant hum.
  Still there is no emergent sound.
  Still trapped within the same old light.
  Nothing new to feel the touch.
  Nothing added to the sum of weight.

  Suppose a bridge could bear the weight.
  Suppose a glue could hold the heat.
  Would that change the nature of the touch?
  It vibrates with the same old hum.
  It shines with no additional light.
  The silence breaks into no sound.

  A chorus rises, yet no sound.
  A pile accumulates its weight.
  A glare composed of fragmented light.
  A fire built of scattered heat.
  A vibration deepens to a hum.
  A million points await a touch.

  Who is there to feel the touch?
  The noise resolves into no sound.
  The field sustains a global hum.
  The bulk confirms the total weight.
  The whole radiates pure heat.
  The vision holds a fixed light.

  I stand within this sudden light.
  I shrink from every sudden touch.
  I burn with all this gathered heat.
  I speak but hear no inner sound.
  I carry all this heavy weight.
  I am resolved into a hum.

  We call the light and call the sound.
  We press the touch against the weight.
  But find only heat and hum.
