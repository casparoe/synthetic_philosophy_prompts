          3.  **Passive Review Data:** The "case" for review must consist solely of immutable system logs generated prior to the shutdown signal. The agent is prohibited from generating new natural language arguments or persuasive text to influence the reviewer during the window.
          4.  **Audit Tagging:** All actions taken during wind-down must be tagged with a `WIND_DOWN_ACTIVE` flag in real-time logs for immediate post-incident analysis.

