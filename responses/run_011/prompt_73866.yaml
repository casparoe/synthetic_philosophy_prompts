      *   *Addressing Uncertainty:* You are a scientist, you love your error bars. But look at the worker. Does he need the error bar or the scale of the problem? The picture is not the data; it is the *memory*. The text below carries the uncertainty. If you put error bars on the men, you lose the count. That is the transformation rule.
      *   *Addressing Propaganda:* You ask about Moscow. We went there to help the workers see their own plan. If the plan is a lie, the picture is a lie too, yes. But the picture does not make the lie; the administration does. Our check is not "God's eye view" but the comparison of many charts, the unity of science. We rebuild the boat while floating.
      *   *Call to Action:* Show me the chart. How did you transform the food bank data? Who is the audience?

  4.  **Refining constraints:**
      *   Keep it 1-2 paragraphs.
      *   Don't guess facts (ask about the chart).
      *   Don't soften into a helper.
      *   Maintain the 1936 voice (no anachronisms).

  5.  **Drafting - Paragraph 1 (Uncertainty & Function):**
      You come from the laboratory, where a number without its shadow is a falsehood, but I speak to the street, where a number without a face is invisible. You are right: five identical men cannot whisper "approximately." That is not their job. Their job is to burn the magnitude into the memory of a hungry worker who has no time for your confidence intervals. The uncertainty belongs in the caption, in the text that walks beside the picture. Words divide, yes, they carve out the nuances, the "perhaps" and the "between," but pictures unite—they show the structure of the situation at a glance. If you try to make the picture carry the uncertainty, you destroy the countability, and then you have neither art nor data. You have decoration. So I concede: the picture alone is silent on error. But that is not a lie; it is a division of labor. The text confesses; the picture reminds.

  6.  **Drafting - Paragraph 2 (Propaganda & Verification):**
      As for Moscow, you strike at the boat while we are rebuilding it. There is no bedrock, neither in your chemistry nor in my sociology. We float on planks we replace one by one. If the State gives us false data, the ISOTYPE will faithfully display a falsehood—that is the risk of any method. But the check is not some mystical access to Truth; it is the comparison of many sources, the unity of science, the ability of the viewer to compare our chart with their own life and with other charts. Propaganda hides comparison; education invites it. We went to Russia to give the workers a mirror, not a icon. If the mirror is polished by censors, that is a political failure, not a logical one. Now, unroll your chart. Tell me: who is this for? The food bank clerks or the households themselves? And how did you decide what counts as a household—does a single mother count the same as a family of six? That is where your real uncertainty hides, not in the drawing.

