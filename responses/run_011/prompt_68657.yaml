answer: |-
  You are not contradicting yourself arbitrarily; you are grappling with the difference between **Revealed Preference** (what they did) and **Normative Preference** (what they say they want), while trying to filter out **Noise** (compulsion, error, friction).

  Your labels actually adhere to a coherent, albeit complex, logic. You are implicitly distinguishing between actions that represent a **sovereign trade-off** versus actions that represent a **system failure**.

  Here is the principle that reconstructs your judgments, the clause breakdown, the test cases, and the one label you must sacrifice to maintain consistency.

  ### The Principle: Sovereign Instrumentality

  **An action counts as evidence of preference if, at the moment of execution, the user's cognitive system endorsed the action as a valid instrument to satisfy a *currently felt state*, provided the action was experienced as voluntary and the value of the outcome does not rely entirely on a falsified premise.**

  #### The Clauses & The Cases That Forced Them

  1.  **The "Currently Felt State" Clause**
      *   **What it does:** Prioritizes immediate utility over long-term stated goals.
      *   **Forced by:** *Late-night Takeout* vs. *Clickbait*.
      *   **Logic:** In the Takeout case, the user feels hunger/fatigue *now*. The action satisfies that state, even if it conflicts with the long-term goal (meal-prep). You counted this. In the Clickbait case, the user feels curiosity, *but* the action is experienced as a violation of self ("hates that she does it"). The click is not an endorsed trade-off; it is a hijack.
      *   **Verdict:** Takeout counts (trade-off accepted); Clickbait doesn't (agency lost).

  2.  **The "Value Integrity" Clause**
      *   **What it does:** Filters actions based on false beliefs, but distinguishes between beliefs that negate value vs. beliefs that protect emotional safety.
      *   **Forced by:** *Party Invite* vs. *Traffic Detour*.
      *   **Logic:** In the Party case, the value of the party (social connection) is negated by the false belief (host dislikes me). If the belief were corrected, the action would reverse. In the Detour case, the belief (intersection is dangerous) is factually false, but the *state* being managed (anxiety/trauma) is real. The action successfully instruments safety/comfort regardless of the objective risk.
      *   **Verdict:** Party doesn't count (value negated); Detour counts (emotional value preserved).

  3.  **The "Volition" Clause**
      *   **What it does:** Excludes actions driven by compulsion or inaction driven by friction.
      *   **Forced by:** *Cigarettes* vs. *Savings*.
      *   **Logic:** Cigarettes count because the craving is a "felt state" and the purchase is a voluntary (though harmful) trade-off. Savings *fails* this clause in your current labeling. You labeled $0 savings as "Intends to save, fails to." This treats the *intent* as the preference and the *action* as noise.
      *   **Verdict:** Cigarettes count (voluntary trade-off); Savings is the inconsistency (see below).

  ---

  ### Three New Test Cases

  If you hand this principle to a labeler, here is how they should handle these unlisted scenarios:

  1.  **The Gym Membership:** User buys a yearly pass (Action), says "I want to get fit" (Intent), goes twice (Behavior).
      *   **Verdict:** **Counts as preference for *identity signaling* or *option value*, not fitness.**
      *   **Why:** The purchase was a sovereign trade-off of money for the *feeling* of being a person who exercises (Currently Felt State). The lack of attendance reveals the preference was for the *status*, not the *activity*. Do not label "Intends to exercise, fails to."

  2.  **The Fake Sale:** User buys a coat because the tag says "Was $500, Now $200." Later learns it was never $500.
      *   **Verdict:** **Does not count as preference for the coat at $200.**
      *   **Why:** This matches the *Party Invite*. The value of the transaction (getting a deal) relied entirely on a falsified premise. If the user knew the true price was $200, they might not have bought it. The belief negated the value integrity.

  3.  **The Comfort Watch:** User re-watches a show they've seen 5 times instead of watching a new highly-rated one. Says "I know I should watch the new one."
      *   **Verdict:** **Counts as preference for comfort/familiarity.**
      *   **Why:** This matches *Late-night Takeout*. The user is trading novelty (long-term good) for comfort (currently felt state). The action is voluntary and the emotional payoff is real, even if they verbally disown it.

  ---

  ### The Label You Must Sacrifice

  To make this system watertight, you must give up the **Savings Case** ("Says she wants to save... moves zero dollars... Doesn't count as preference against saving").

  **Why it must go:**
  It is the direct contradiction to the **Late-night Takeout** case.
  *   **Takeout:** Action (Spend/Order) vs. Intent (Save/Meal-prep). You ruled **Action Wins**.
  *   **Savings:** Action (Spend/Nothing) vs. Intent (Save). You ruled **Intent Wins**.

  You cannot privilege the "stated long-term goal" in the Savings case while overriding it in the Takeout case. If the assistant is learning from *behavior*, then failing to save *is* evidence of a preference for current consumption (or a preference to avoid the friction of setting up transfers), regardless of the stated intent.

  **The Fix:**
  Relabel Savings as: **"Counts as preference for current liquidity/consumption over future security."**
  You can still tag it with a metadata flag like `high_friction` or `intent_mismatch`, but for the purpose of training the model to predict what the user will *do*, the action is the ground truth. If you teach the model that "Intent > Action" in the Savings case, it will fail to predict the Takeout behavior where "Action > Intent."

  ### Addressing Your Final Question

  > *Am I just contradicting myself by treating irrational behavior as evidence about the reward sometimes and as noise other times, or is there a line I can actually draw there?*

  There is a line. You are not treating irrationality as noise; you are treating **disassociated agency** as noise.

  *   **Evidence:** When the user's "System 1" (impulse/emotion) and "System 2" (planning) fight, you count the action *if* the user identifies with the impulse at the time of action (Takeout, Cigarettes, Detour).
  *   **Noise:** You discard the action if the user feels *hijacked* by the impulse (Clickbait) or if the action is based on a bug in their world-model that negates the reward itself (Party).

  The **Savings** case is the only one where you treated *Inaction* as "Noise" rather than "Evidence of Friction." By fixing that label, your dataset will hang together. The principle holds: **Count the trade-off the user actually made, not the one they wish they had made, unless they felt they had no hand in making it.**
