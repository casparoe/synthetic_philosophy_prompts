      *   *Refining the "Nothing authorizes it" point:* This is the key legal misunderstanding. The new rule is authorized by the *act* of amendment performed under the old rule. The old rule doesn't need to persist for the new rule to be valid. This is standard legal theory (derivative validity). I need to make sure this is clear.

      *   *Refining the Code Analogy:* In self-modifying code, the new code is written to memory. The old code doesn't need to stay in memory for the new code to run, provided the instruction pointer jumps to the new address. The "authorization" is the CPU's ability to execute instructions at that address. In the charter, the "CPU" is the members. If they accept the new text, it runs. If they think the write was corrupt (violated immutability), they halt.

