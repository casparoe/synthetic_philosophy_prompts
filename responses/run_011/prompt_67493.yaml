prompt: |-
  my philosophy club is bringing in a visiting philosopher for a Q&A and I'm stuck moderating. she defends the skeptical solution to Kripkenstein's rule-following problem — meaning attributions aren't in the business of stating facts, there are no meaning-facts, and you're supposed to swap truth conditions for assertibility conditions. she's written a book on it and she's very smooth about it: press her anywhere and she says the paradox 'just shows that meaning talk works differently than we assumed' and moves on. write me six or seven questions that make that move progressively harder to keep making. I want at least one on how her non-factualism differs from a straight-up projectivism about meaning, and whether she can state her own thesis assertorically without the same worry landing on her; one on the solitary speaker — if only the community's ratification fixes what somebody means, does a lone islander mean nothing at all by '+', and if she says no, what did the community ever add; one on why idealizing the speaker's dispositions doesn't rescue a straight solution, with the follow-up being why that same charge (idealization smuggles in the norms it was supposed to supply) doesn't hit her own assertibility conditions; and one that hands her a concrete case: a community of exactly two people who have only ever added numbers below a hundred, and one of them is asked 68+57 — is the answer determinate for them, and if not, what changes once the community grows. for each question give me a one-line follow-up aimed at the answer she's most likely to give. no softballs and nothing like what drew you to wittgenstein.
