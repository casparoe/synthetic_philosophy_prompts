      *   **Form:** Fiction, but structurally mimicking biography/history (documents, testimony, judgment).
      *   **Influences:** Plutarch's *Parallel Lives* (ethical focus, trifles over battles) and Hagiography (edification, saint's lives).
      *   **Constraints:** No scholarship, no reading list, no citations. Focus on *craft implications*. Be specific.
      *   **Key Questions:** Selection (trifles vs. events, invention), Judgment (narrator stance, implicit vs. explicit evaluation), Comparison (parallel lives structure), Exemplarity (moral learning from narrative, transfer problem, pseudo-hagiography).
      *   **Critical Instruction:** "If you think the premise is confused, say so plainly before you answer anything else." Challenge the yoking of Plutarch and Hagiography, the idea of moral learning from fiction, etc. Don't smooth over uncertainties.

  2.  **Evaluate the Premise (The "Challenge" Phase):**
      *   *Is yoking Plutarch and Hagiography a category error?*
          *   Plutarch is moral-philosophical (character as destiny, virtue/vice analysis). Hagiography is theological/devotional (grace, miracle, imitation of Christ).
          *   *Connection:* Both are teleological. They look backward from a known end to find meaning. Both select evidence to prove a thesis about the soul.
          *   *Verdict:* It's not a category error, but it is a tension. Plutarch judges *agency*; Hagiography judges *alignment with divine will*. Merging them creates a narrator who is trying to judge agency through the lens of destiny. This fits the "unreliable colleague" perfectly. He wants to sanctify her (hagiography) but must confess his betrayal (Plutarchan moral accounting).
      *   *Can fiction function as a moral example?*
          *   This is the "narrativist vs. anti-narrativist" debate (Nussbaum vs. Williams/Gaut).
          *   *Verdict:* Fiction *does* do this, but not by providing rules. It provides *simulation*. The risk is didacticism. The user acknowledges this risk ("not meant to be admired").
      *   *Is the "unreliable narrator + biography" form compatible with "ethical life"?*
          *   Yes, because the unreliability *becomes* the ethical problem. The reader must judge the judge.
      *   *Conclusion on Premise:* It is sound, but dangerous. The danger is the point. I need to validate the ambition while warning about the specific pitfalls of mixing these modes.

  3.  **Address the Specific Craft Questions:**

      *   **Selection (The Trifle vs. The Event):**
          *   *Plutarchan Principle:* Character is revealed in unguarded moments.
          *   *Craft Implication:* Cut the "great battles" (major surgical breakthroughs, historical events) unless they show the *reaction* to them. Focus on the waiting room, the cleaning of instruments, the letter unsent.
          *   *Invention:* Since it's fiction, you *must* invent trifles. But the "terms" are consistency with the *narrator's* obsession, not historical accuracy. The trifles must feel like evidence the narrator *found* or *fabricated* to prove his point.
          *   *Risk:* Don't let the trifles become quaint. They must be forensic.

      *   **Judgment (The Narrator's Stance):**
          *   *The Problem:* A mourner/accuser is unstable.
          *   *Craft Implication:* Evaluation should sit in the *arrangement* (juxtaposition), not just adjectives.
          *   *The "Never Say Good" Challenge:* Yes, it's possible. Use the "witness testimony" device. Let other characters contradict the narrator. Let the documents speak against the narration. The reader arrives at the verdict by spotting the gap between the narrator's praise and the evidence provided.
          *   *Specific Technique:* The "Damning Praise." He praises her patience; the scene shows her endurance of abuse he facilitated.

      *   **Comparison (Parallel Lives):**
          *   *Craft Implication:* A parallel life forces definition by contrast.
          *   *Risk:* It can flatten the main subject into a archetype.
          *   *Solution:* The parallel shouldn't be a "rival" in a plot sense, but a "ghost." A woman who left, or died, or became something else. Or, the narrator himself is the parallel life (the failed surgeon vs. the successful one).
          *   *Truth:* It distorts the single life by making it a thesis statement. Acknowledge this distortion *in the text*. Let the narrator admit he is shaping the rival to make her look better/worse.

      *   **Exemplarity (Moral Learning & Hagiography):**
          *   *Philosophical implication:* Readers learn *attention*, not rules.
          *   *The Transfer Problem:* Circumstances (interwar Central Europe) are alien.
          *   *Solution:* Focus on the *cost* of virtue, not the virtue itself. The specific choice matters less than the friction it caused.
          *   *Pseudo-Hagiography:* Use the tropes (miracles/cures, relics/scars, disciples/patients) but subvert the cause. She cures not by grace but by technique; she is revered not for holiness but for utility. The "saintliness" is a projection of the narrator's guilt.

  4.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Peer-to-peer, rigorous, unsentimental, precise. No fluff.
      *   *Structure:*
          1.  The Challenge (Premise Check).
          2.  Selection.
          3.  Judgment.
          4.  Comparison.
          5.  Exemplarity.
      *   *Refining the "Challenge":* I need to be careful not to discourage, but to sharpen. The tension between Plutarch (moral agency) and Hagiography (divine vessel) is the engine of the book. The narrator is trying to write a Saint's Life to absolve himself, but the Plutarchan material keeps showing her human flaws. That *is* the book.
      *   *Refining "Selection":* Emphasize the *unreliability*. The trifle is invented to serve the narrator's guilt.
      *   *Refining "Judgment":* Focus on the "gap." The reader judges the narrator judging the subject.
      *   *Refining "Comparison":* Suggest the narrator as the parallel.
      *   *Refining "Exemplarity":* Focus on "moral residue."

  5.  **Final Review against Constraints:**
      *   No scholarship/citations? (Check. I will mention Nussbaum/Williams concepts without naming them or citing books).
      *   Specific craft advice? (Check. Scene types, narrative techniques).
      *   Challenge the premise if needed? (Check. I will argue the tension is productive but requires specific handling).
      *   Mark thin confidence? (Check. I will distinguish between historical fact and narrative effect).

  6.  **Final Polish:** Ensure the voice matches the user's (intellectual, precise, slightly weary but committed). *Self-Correction during drafting:* I initially thought about suggesting a literal parallel character. But the prompt says "rival, sister, second woman." I should argue that the *narrator* is the better parallel. It tightens the psychological knot. I will propose that.

  7.  **Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  First, the challenge you requested.

  **The Premise**
  Yoking Plutarch and the hagiographers is not a category error, but it is a volatile mixture. Plutarch writes from the premise that character is destiny; virtue and vice are internal qualities that shape external events. The hagiographer writes from the premise that grace is destiny; the subject is a vessel for an external force (God), and events are proofs of that alignment.

  If you combine them without care, you create a theological contradiction: was she good because she chose to be (Plutarch), or was she good because she was chosen (Hagiography)?

  However, for your specific machinery—a narrator who is a mourner, an accuser, and unreliable—this contradiction is not a bug; it is the engine. Your narrator is attempting to write a Hagiography (to sanctify her, to absolve his betrayal through her greatness) using Plutarchan materials (documents, testimonies, human flaws). The tension you feel is the tension the narrator feels. He wants her to be a saint so his betrayal becomes a sin against the divine; the evidence keeps showing her to be a woman, which makes his betrayal merely a sin against a peer.

  Do not smooth this over. The book's moral friction depends on the narrator failing to make her a saint.

  Regarding the philosophical objection (can narrative teach morals?): The risk is not that fiction *cannot* teach, but that it teaches *simplification*. If your surgeon becomes an "example," she becomes a tool. To avoid this, the "lesson" must not be a rule (e.g., "one ought to be brave") but a recognition of cost. The reader should not finish the book knowing how to act, but knowing what acting costs. That is the only ethical transfer that survives the "transfer problem" of changed circumstances.

  With that established, here are the craft implications.

  ### 1. Selection: The Trifle and the Invention
  Plutarch's dictum implies that public events are often masks, while private gestures are unguarded. For a surgeon, the "battle" is the operation; the "trifle" is the hand-washing.

  *   **What to Refuse:** Refuse scenes where her professional competence is the sole focus. A successful surgery is a technical event. It reveals skill, not virtue. Unless the surgery goes wrong and her *reaction* to the failure is the point, cut it.
  *   **What to Contain:** You need scenes of *administration* and *aftermath*. How she speaks to the janitor; how she waits for a train; how she reacts to a rude letter. These are the Plutarchan "sayings or jests."
  *   **The Terms of Invention:** You asked if this licenses you to invent trifles. Yes, but with a constraint: **The invention must belong to the narrator, not the author.**
      *   Do not invent a trifle to reveal *her* character directly. Invent a trifle to reveal *his obsession* with her character.
      *   *Example:* Do not simply write a scene where she comforts a child. Write the narrator describing a scene where she comforts a child, but include a detail that suggests he wasn't there (wrong time of day, a witness contradicts it). The trifle becomes evidence of his need to sanctify her, not just her kindness.
      *   *Craft Rule:* Every invented trifle must carry the fingerprint of the collector. If the trifle feels too perfect, the reader must suspect the narrator polished it.

  ### 2. Judgment: The Mourner-Accuser
  You want a narrator who evaluates without declaring "she was good." This is achievable through **Juxtapositional Irony**.

  *   **Placement of Evaluation:** Move evaluation out of the adjectives and into the footnotes (or their textual equivalent). Let the narrator make a claim in the main text ("She was without vanity") and place a document in the appendix or quoted in the next paragraph that contradicts it (a letter where she fishes for praise).
  *   **The "Good" Verdict:** To make the reader conclude she was good without the narrator saying it, you must make the narrator's *cruelty* the baseline.
      *   If the narrator describes her flaws with tenderness and his own actions with clinical detachment, the reader will invert the values.
      *   *Technique:* The "Damning Defense." He defends her against a charge by admitting the charge but recontextualizing it as a virtue only he understands. "Yes, she was cold to the patients. But only because she knew the heat of the fever they carried." The reader may realize she was simply exhausted or detached, but his *need* to explain it makes her seem noble.
  *   **The Stance:** He should write as a **Prosecutor who has lost the case.** He is gathering evidence to condemn her (perhaps to justify his betrayal, or to punish himself), but the evidence exonerates her. This allows him to record faults (Plutarch) while the aggregate effect is edification (Hagiography).

  ### 3. Comparison: The Parallel Life
  Plutarch's comparisons often force the subjects into symmetry. In a novel, a forced symmetry feels like plot machinery.

  *   **What it Buys:** A parallel life defines the *boundaries* of the main subject. It answers the question: "Was she this way because of the times, or because of herself?"
  *   **The Risk:** If you introduce a rival or sister who made "other choices," you risk turning the book into a moral fable (The Good Sister vs. The Bad Sister). This kills the biographical illusion.
  *   **The Solution:** Make the parallel **The Narrator.**
      *   He is the colleague. He practiced in the same city, same time, same constraints. He made different choices.
      *   *Craft Implication:* Structure the book so that every chapter of her life is shadowed by a chapter of his. When she refuses a bribe, he takes one. When she stays, he leaves.
      *   *Effect on Truth:* This admits the distortion. He is reshaping her life to make sense of his own. The "comparison" is not an objective historical tool; it is an act of jealousy. This preserves the "truth of the single life" by acknowledging that we only see it through the distortion of the witness.
      *   *Alternative:* If you must use a second woman, make her a **ghost.** A woman who did what the narrator *wishes* the surgeon had done. Let the narrator dismiss this second woman as "worldly" to elevate the surgeon, letting the reader see that the second woman was perhaps happier.

  ### 4. Exemplarity: Moral Learning and Pseudo-Hagiography
  Can a reader learn from a life they cannot inhabit? Only if the learning is about **resistance**, not action.

  *   **The Transfer Problem:** Your reader will not be a surgeon in interwar Central Europe. They cannot copy her choices. They can only copy her *friction*.
      *   *Craft Implication:* Do not focus on the *outcome* of her moral choices (the patient lived, the hospital was reformed). Focus on the *residue* (the insomnia, the alienation from colleagues, the specific weight of the guilt).
      *   The reader learns: "To act this way costs this much." That is transferable.
  *   **The Character Not Meant to be Admired:** If she is not to be admired, she must be **witnessed.**
      *   Hagiography asks for imitation. Plutarch asks for judgment. You are asking for **recognition.**
      *   *Technique:* Give her a "vice" that is the shadow of her "virtue." If her virtue is surgical precision, her vice is emotional cruelty. Do not let the narrator explain this away. Let it stand. The reader learns that the thing that saves lives also destroys intimacy. That is ethical knowledge.
  *   **Borrowing Hagiography's Apparatus:**
      *   *Fixed Ending:* You know she dies. Use this. But instead of "she died and went to heaven," use "she died and the records were scattered." The hagiographic promise of permanence is denied.
      *   *Stock Motifs:* Use the "Relic." A surgical instrument, a scar, a notebook. In hagiography, the relic channels power. In your book, the relic must be **ambiguous.** It channels the narrator's guilt, not her power.
      *   *Reverent Tone:* Adopt the tone, then break it. Let the narrator slip into reverence, then catch himself. "She was tireless. Or perhaps she was simply unable to sleep." This refuses the hagiographic conclusion while using its music.

  ### Summary of Craft Decisions
  1.  **Scene Selection:** Cut technical triumphs. Keep unguarded moments. Ensure every "trifle" reveals the narrator's bias as much as the subject's character.
  2.  **Narrative Voice:** The narrator is a prosecutor failing to convict. Evaluation lives in the gap between his praise and the evidence he provides.
  3.  **Structure:** The Narrator is the Parallel Life. His choices mirror hers to highlight the cost of hers without preaching.
  4.  **Ethical Goal:** Do not teach the reader *what to do*. Teach the reader *what it costs*. Use hagiographic tropes (relics, fixed end, reverence) but drain them of divine assurance, leaving only human consequence.

  **Uncertainty Marker:**
  I am less confident in the utility of a "second woman" parallel than in the narrator-as-parallel. Historical biography often uses siblings/rivals to triangulate truth; fiction often uses them to flatten theme. If you introduce a second woman, she must be as unreliablely narrated as the surgeon, or she becomes a puppet. If you cannot sustain the ambiguity for two characters, collapse the comparison into the narrator.

  The premise holds, provided you accept that the "Life" is not a portrait of the woman, but a portrait of the man trying to paint her. The morality lies in the failure of the painting to match the subject.
