answer: |-
  Form 12-Alpha sat on the desk, physical paper in a digital age, because the Bloom required analog authorization. A superstition, mostly. Or perhaps a friction mechanism. Elara dipped her pen in the inkwell, the nib scratching against the fiber, and checked the figures one last time.

  Proposal 10,492.
  Current Population: 4.2 billion.
  Proposed Instantiation: 500 million.
  Welfare Dial: 4.2 Universal Units (UU).
  Existing Population Dividend: +0.05 UU per capita.

  It was a good proposal. By every metric available to the voting council, it was a benevolent act. The Bloom would hum, the air would taste sweeter for a week, and every person currently breathing in Station 4 would find their rations slightly richer, their sleep slightly deeper, their leisure time slightly longer. In exchange, half a billion new souls would wake in the cradle wards. Their lives would be worth living. The dial was set above the Zero Line. They would not suffer. They would know joy, however faint.

  Elara looked at the projection graph on her screen. It was a smooth, upward-sloping curve for Total Utility. The other curve, Average Welfare, sloped down. It had been sloping down for three hundred years.

  She scrolled back through the archive. Generation 1: 500 souls. Welfare 100 UU. A paradise of space and silence. Generation 50: 10 million souls. Welfare 50 UU. Comfortable, bustling. Generation 100: Her generation. 4.2 billion. Welfare 8.5 UU. Crowded, but the dividend kept the walls from closing in.

  She opened the redacted file. Protocol Null. It was the only file in the archive that smelled of ozone and fear. Two centuries ago, a council had realized the trajectory. They had attempted to engage a subtract function. The Bloom had no such function, but they had tried to build one. The record ended mid-sentence, with a notation that the engineering team had been reassigned to cradle maintenance. The machine only added. It only raised. To stop it was to deny the living their dividend. To reverse it was impossible.

  A knock at the door. Kael entered without waiting. He was young, from Cohort 99, one of the billions instantiated in the last cycle. He wore the grey tunic of the Wardens, but his eyes were bright.

  "You're hesitating, Elara," he said. He didn't sit. He leaned against the filing cabinet, disturbing the dust.

  "I'm verifying the numbers," she said.

  "The numbers are verified. The dividend is positive. The new lives are positive. The vote is scheduled for noon."

  "The average is dropping, Kael. 8.5 to 8.45. After this vote, it will be 8.1. In fifty cycles, we project the dial will be at 1.0 UU."

  "And?"

  "At 1.0, life is barely distinguishable from subsistence. It is a flat grey existence. Music is simplified. Food is nutrient paste. Space is one meter per person."

  "But it is positive," Kael said. He pushed off the cabinet and walked to the window. Below them, the station sprawled, a honeycomb of lights stretching into the dark rock. "You look at the average and see decline. I look at the total and see expansion. You are hoarding quality. We are distributing existence."

  "I am looking at the texture of a civilization," Elara said. "We are becoming a swarm."

  "Is a swarm worse than a clique?" Kael turned back to her. "Your paradise of 500 people—what was it worth? Five hundred shouts of joy? Now we have four billion whispers. When you add them up, Elara, the whispers drown out the shouts. The total amount of good in the universe is higher today than it was when you were born. Higher than when your grandmother was born. How can more good be bad?"

  "Because it's dilute," she said. "It's watered down until it's colorless."

  "Who are you to decide what color joy must be?" Kael's voice wasn't angry. It was patient, the way one speaks to a child who doesn't understand arithmetic. "You sit here with your ledger, protecting the intensity of the past. You think because your life was louder, it was heavier. But happiness isn't a competition. If I am happy at 4.2 UU, and the new cohort is happy at 4.0 UU, who are you to say they shouldn't exist? Who are you to say their happiness counts for less?"

  "I'm not saying it counts for less. I'm saying the sum total of meaning is lost when the context collapses."

  "Context," Kael scoffed. "That's just a word for exclusivity. You want the station to be a gallery, curated. I want it to be a garden. Gardens are crowded. They are messy. They grow until they fill the space."

  He walked to the desk and tapped the Form 12-Alpha.

  "Look at the dividend. If you vote no, you strip 4.2 billion people of their 0.05 UU. You make everyone currently alive slightly worse off. You make their food taste blander, their sleep shallower. You do this to prevent 500 million people from being born into lives that are, by definition, worth living. You are harming the living to spare the unborn a life you deem too modest."

  "It's a trap," Elara said. "If we vote yes, the next vote is easier. The population is larger, the base is lower. The next dividend will need more bodies to sustain the same boost. We are locking ourselves into a curve."

  "We are locking ourselves into existence," Kael corrected. "There is no lock. We can stop anytime. Once the dial hits Zero, we stop. Until then, every step is a gain. Every step is a yes."

  "There is no vote to stop," Elara said quietly. "There is only a vote to add. To not add is to subtract from the living. The machine doesn't have a 'stop' button, Kael. It only has an 'on' button. Voting no is just voting yes to a smaller future."

  Kael sighed. He looked tired then, for the first time. "You think you're the guardian of quality. But you're just the clerk of scarcity. You think there isn't enough room for everyone to be magnificent. So you'd rather fewer people be magnificent than many people be content."

  "I'd rather there be something worth remembering."

  "There will be," Kael said. "There will be so much of it."

  He left the form on the desk. The clock on the wall ticked toward noon.

  Elara looked at the pen. The ink was dark, permanent. She looked at the graph again. The Total Utility line went up and up, off the chart, a triumphant green arrow piercing the ceiling of the screen. The Average Welfare line dipped, gently, gracefully, toward the x-axis.

  She thought about the 500 originals. They were dead now, centuries gone. They had voted for the first Bloom. They had wanted to share their paradise. They hadn't known that sharing it would change what paradise meant.

  She thought about the dividend. Her own rations. The air filtration in her apartment. If she didn't sign, the system would flag a resource allocation error. The Bloom would not activate. The surplus energy would dissipate. Her neighbors would notice the lights flicker. They would know who held the pen.

  To vote no was to be the villain of the present. To vote yes was to be the architect of a future she couldn't bear to view.

  There was no third option. Protocol Null had proven that. You cannot subtract. You can only choose how quickly you dilute.

  Elara dipped the pen. The nib hovered over the signature line. She imagined the cradle wards filling. Half a billion new hearts beating. Half a billion new voices humming at a lower frequency. The station groaning slightly under the weight, settling deeper into the rock.

  She thought of Kael's argument. *Total good.* It was mathematically sound. It was morally robust. It was unbearable.

  She signed.

  The form slid into the pneumatic tube with a soft *whoosh*. Somewhere deep in the station, the Bloom began to hum, a low vibration that traveled up through the floorboards and into the soles of her shoes. It sounded like approval.

  Elara capped the pen and opened the next file. Proposal 10,493. The population base was already updated. The numbers were waiting.
