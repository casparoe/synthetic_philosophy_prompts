          *   *Verdict:* Accurate.
      *   *Claim 4:* Natural slave identified by deficiency in rational part. No deliberative capacity. No share in reason at all. Governed by appetite/perception like tame animal.
          *   *Aristotle:* *Pol.* I.5 (1254b). "The slave... is entirely without the faculty of deliberation." However, "no share in reason *at all*" is tricky. Aristotle says they participate in reason enough to *perceive* it but not to *possess* it (1254b). Comparing to a tame animal is rhetorically close but Aristotle distinguishes human slaves from beasts (they understand reason but don't have it).
          *   *Verdict:* Mostly Accurate, but "no share in reason at all" is slightly too strong (they perceive it). "Like a tame animal" is an interpretive compression of the soul/body analogy.
      *   *Claim 5:* Virtue belongs to rational soul, so slave has *no virtue whatever*. Good slave spoken of like good ox/shuttle.
          *   *Aristotle:* *Pol.* I.5 (1259b-1260a). Aristotle *explicitly* asks if slaves have virtue. He concludes they *do* have virtue (temperance, courage, etc.), but differently from free men. They need virtue to not fail in duties. The "good ox/shuttle" analogy applies to the *instrumental* value, but claiming they have *no virtue whatever* is a significant error.
          *   *Verdict:* **Inaccurate.** This is a substantive error.
      *   *Claim 6:* Nature intends different bodies (robust vs. upright/useless). Nature frequently fails (free souls in slavish bodies).
          *   *Aristotle:* *Pol.* I.5 (1254b-1255a). Yes, he mentions physical differences and the frequent failure of nature to align body and soul.
          *   *Verdict:* Accurate.
      *   *Claim 7:* Relation is natural, advantageous to both, just. Master gets leisure, slave gets direction.
          *   *Aristotle:* *Pol.* I.5 (1255b). Yes, mutual benefit and justice are claimed for the *natural* slave.
          *   *Verdict:* Accurate.
      *   *Claim 8 (War):* Considers view in courts (legal compact). Records objection (justice depends on force). Answers objection rather than conceding. Victory presupposes superiority of ability; ability = title to rule.
          *   *Aristotle:* *Pol.* I.6 (1255a). He discusses the "law of war." He says many jurists say it's just, but it's contested. He says if victory implies superiority in *every* way, then it's just. But he implies this is often not the case.
          *   *Verdict:* Accurate summary of the argument structure.
      *   *Claim 9:* Enslavement in war is just where war is just AND conquered are of slavish nature.
          *   *Aristotle:* *Pol.* I.6. He argues that if the war is just, the captives *might* be natural slaves, but he is skeptical of the automatic link. He says the opinion that "might makes right" is not accepted by all.
          *   *Verdict:* Accurate enough.
      *   *Claim 10:* "Which for Aristotle means non-Greeks, among whom he finds no natural ruling class, and whose women and slaves he says occupy the same position."
          *   *Aristotle:* *Pol.* I.2 (1252b). "Barbarians and Greeks... nature intends no difference... yet they imagine... barbarians and slaves are the same by nature." He says *some* think this. Does *Aristotle* endorse it as a blanket rule for *all* non-Greeks? He suggests barbarians are more slavish by nature than Greeks (1252b), but saying he finds *no* natural ruling class among non-Greeks is a strong generalization. The "women and slaves occupy the same position" among barbarians is a specific claim (1252b: "The relation of male to female is by nature a relation of superior to inferior and ruler to ruled... The same must be thought to be the case with all mankind.").
          *   *Verdict:* **Potentially Inaccurate/Overreach.** Aristotle reports this view strongly but often distances himself slightly or frames it as a general tendency of barbarians, not an absolute rule excluding *any* natural rulers among them. However, 1252b is quite strong: "barbarians... are slaves by nature."
      *   *Claim 11:* Practice of Greek cities endorsed by theory, subject to qualification: Greek of good family taken captive is not natural slave.
          *   *Aristotle:* *Pol.* I.6. He criticizes the practice of enslaving Greeks. He says it's not just to enslave those who are not natural slaves.
          *   *Verdict:* Accurate.

  3.  **Identify the Single Most Consequential Problem:**
      *   The claim about slave virtue (Claim 5). The student writes: "Aristotle accordingly credits him with *no virtue whatever*."
      *   Text: *Politics* 1260a. Aristotle explicitly argues slaves *do* share in virtue ("It is clear then that both must share in virtue..."). He distinguishes the *kind* of virtue, but denying it entirely contradicts a key nuance in I.5 regarding the management of the household.
      *   Why consequential? It misrepresents the moral status of the slave within the household. It turns the slave into a pure tool (like the shuttle) rather than a human participant in the household's moral order.
      *   Does it cap the grade? The rubric says 70-79 is for "one substantive error." This is a substantive error. It prevents the script from reaching the 80s (Accurate). It definitely prevents 90+ (Pressing difficulty).
      *   The War section (Claim 10) is also shaky regarding the "non-Greeks" generalization, but the virtue error is clearer.

  4.  **Determine the Grade:**
      *   Rubric:
