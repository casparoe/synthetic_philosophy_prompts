          *   *Verdict:* Accurate.
      *   *Claim 2:* Household requires instruments; property = sum of instruments; slave = possession, living, ministers to action not production.
          *   *Aristotle:* Yes, *Pol.* I.4. Slave is a "living possession" (*ktēma ti empsychon*). Distinction between making (production) and doing (action).
          *   *Verdict:* Accurate.
      *   *Claim 3:* Slave is an instrument taking precedence. Reference to Daedalus statues/Hephaestus tripods. Conclusion: natural slave is another's man, possession separable, condition natural as soul over body.
