answer: |-
  First off, this is impressive. You have independently reconstructed a problem that occupies actual professional ethicists. In the literature, this is often discussed under the headers of the **"Demandingness Objection,"** the **"Paradox of Moral Worth,"** or the **"Subjectivity of Sacrifice."** You haven't built a strawman; you've built a steelman of the "Cost Condition" for obligation and shown how it collapses under diachronic (over-time) pressure.

  Here is the breakdown you asked for: consensus status, where to cut, and the price of each cut.

  ### 1. The Consensus Check
  **Is your setup accurate?**
  Yes. Premises (1) through (3) are a standard way to frame the boundary between obligation and supererogation. J.O. Urmson's classic 1958 paper *"Saints and Heroes"* essentially sets up the category this way, and David Heyd's *Supererogation* (1982) wrestles with exactly these conditions.

  **Is there a consensus on the solution?**
  **No.** There is zero consensus on the definition of supererogation, let alone the cost condition.
  *   **Utilitarians** typically deny supererogation exists at all (they reject 1).
  *   **Common-Sense Moralists** accept supererogation but fight over *why* some acts are optional.
  *   **Virtue Ethicists** often argue your Premise (4) is the problem (character isn't that malleable).

  So, when your friend says you haven't refuted the cost condition, she is technically right that this is a live debate, not a settled refutation. But your *reductio* (that this leads to absurd incentives) is a legitimate philosophical move.

  ### 2. Where to Cut (and the Price)

  You want to keep (1) because without it, morality becomes infinitely demanding (you must donate everything until you are as poor as the poorest person). That is a reasonable intuition to hold. Here are the three best places to cut the argument, ranked by how standard they are.

  #### Option A: Cut Premise (2) — The "Objective Cost" Move
  **The Cut:** You argue that "cost" in Premise (1) refers to **objective sacrifice** (time, money, physical risk), not **subjective psychological pain**.
  *   **Why it looked fine:** We intuitively think pain matters. If giving $100 hurts me more than it hurts Bill Gates, surely that counts?
  *   **Why you cut it:** If cost is subjective, morality becomes unmanageable. We can't know anyone else's internal pain thresholds. To make moral obligations public and knowable, we must judge cost by objective metrics (e.g., "Does this leave you below a decent standard of living?").
  *   **The Fix:** A kidney costs the same "objectively" for you and me (surgery, risk, one less kidney), regardless of how much we *mind* the pain. Therefore, the saint and the jerk face the same obligations.
  *   **The Price:** This is harsh on people with genuine psychological disabilities or trauma. If a panic attack makes leaving the house "cost" ten times more for me than for you, an objective view says we have the same duty to leave the house. It ignores the reality of mental health.
  *   **Status:** **Contested.** This is the "Objective vs. Subjective Sacrifice" debate. Most contemporary ethicists try to hybridize this, but leaning objective is the standard way to block your paradox.

  #### Option B: Cut the Inference to (7) — The "Excuse vs. Praise" Move
  **The Cut:** You accept (1) through (6), but you reject the claim in (7) that the jerk gets **celebrated** or that the saint loses **value**.
  *   **Why it looked fine:** If the jerk does something "above their duty," it sounds like they deserve credit.
  *   **Why you cut it:** There is a difference between an act being **optional** and an act being **praiseworthy**. If the jerk finds basic decency expensive, and they do it, they have merely met their obligation (or perhaps they are excused if they don't). They do not get *extra* credit for overcoming a selfishness they *should not have cultivated*.
  *   **The Fix:** The saint has less *room* for supererogation, yes, but they have more *moral worth* overall. The jerk doesn't get a "bigger space of praiseworthy options"; they get a "bigger space of blameworthy omissions." When they do good, it's not supererogatory; it's just "doing what they should have found easy."
  *   **The Price:** You have to admit that moral improvement *does* tighten your constraints. Becoming a saint *does* mean you have less freedom to be "merely decent." You lose the ability to earn "bonus points" for basic kindness.
  *   **Status:** **Live Disagreement.** Some philosophers (like Susan Wolf) argue that saints *are* disadvantaged in terms of moral freedom. Others argue moral worth shouldn't depend on how hard the act was.

  #### Option C: Cut Premise (4) — The "Character Inertia" Move
  **The Cut:** You argue that agents **cannot** significantly shape their costs over time in the way (4) suggests.
  *   **Why it looked fine:** We believe in moral education. We think people can "learn" to be more generous.
  *   **Why you cut it:** Character is sticky. A selfish person cannot simply "train" themselves to find donating a kidney cheap overnight. Moral obligations are assessed **synchronically** (at the moment of action), not **diachronically** (based on past training). You don't get punished for being virtuous *now* because you were virtuous *yesterday*.
  *   **The Fix:** Obligation is based on your *current* capacity, but there is a "floor." You can't cultivate selfishness to lower your obligations (because you are responsible for your character), and you don't lose supererogatory space just because you cultivated virtue.
  *   **The Price:** This requires a complex theory of **responsibility for character**. You have to argue the jerk is *responsible* for their high costs (so they don't get an excuse), while the saint isn't *penalized* for their low costs. This is philosophically expensive to defend.
  *   **Status:** **Highly Contested.** This touches on "voluntariness of character." Aristotelians say yes, we are responsible for our character. Humeans say no, character is largely luck.

  ### 3. Recommendation for the Club

  If I were running your club, I would tell you to **cut Premise (2) but modify it.**

  This is the most productive path for a Thursday afternoon debate. Here is the position:
  **"Cost is Objective, but Thresholds are Subjective."**

  *   **The Argument:** The *cost* of the act (losing a kidney, $5,000) is objective. It is the same for everyone. However, the *threshold* of "too much" might vary slightly based on circumstance (not character).
  *   **Why it works:** It blocks the "Selfishness Loophole." The jerk cannot claim donating is "too costly" just because they are greedy. Greed is not a valid cost multiplier.
  *   **The Trade-off:** You must admit that genuine trauma or disability *does* lower obligation. You have to draw a line between "I am selfish" (not a valid excuse) and "I am traumatized" (valid excuse). Drawing that line is the actual work of ethics.

  ### Summary for your Friend
  Tell her she is right that you haven't "refuted" the cost condition in the sense that the literature has abandoned it. But she is wrong that (7) and (8) don't follow. They *do* follow if you accept Subjective Cost.

  The disagreement isn't about your logic; it's about **Premise (2)**.
  *   **You** are assuming Cost = Psychological Pain.
  *   **She** is likely assuming Cost = Sacrifice of Goods/Opportunities.

  If Cost = Pain, your argument holds, and morality is broken.
  If Cost = Sacrifice, your argument fails, and the Saint/Jerk paradox dissolves.

  **The Verdict:** Your argument is a valid *reductio ad absurdum* of **Subjective Cost**. It does not refute **Objective Cost**. Since most ethicists prefer Objective Cost to avoid exactly the absurdity you found, you haven't killed supererogation; you've just killed the subjective version of it. Keep (1), modify (2), and you have a solid position.
