      *   **Intro:** You've reinvented a classic problem (The "Paradox of Moral Worth" / "Demandingness").
      *   **Strawman:** Not a strawman, this is how Heyd/Urmson frame it.
      *   **Consensus:** Nothing is settled.
      *   **Option 1 (The Objective Cost Cut):** Attack (2). Cost = resources, not feelings. Price: Ignores trauma/disability.
