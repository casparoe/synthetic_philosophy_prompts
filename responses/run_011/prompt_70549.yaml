answer: |-
  Here is a principle constructed to honor your specific verdicts, followed by the cost of adopting it and its weakest flank.

  ### The Principle: Potentially Integrated Sensory Format (PISF)

  **Statement:**
  A mental state is phenomenally conscious if and only if:
  1.  **Sensory Specificity:** It involves activation in modality-specific sensory cortical maps (excluding purely motor or subcortical calibration systems).
  2.  **Format Generality:** The information is encoded in a format *potentially* available to multiple downstream cognitive systems (memory, speech, reasoning), rather than being encapsulated within a dedicated sensorimotor loop.
  3.  **Actualization Independence:** This availability need not be *actualized* by attention, report, or reasoning; the *format* itself suffices.
  4.  **Binding Constraint:** Feature-level activation suffices for faint phenomenology, but object-level binding (required for recognizing entities like "a gorilla") requires attentional selection.

  ---

  ### Case-by-Case Justification

  **1. Sperling's Partial Report**
  *   **Verdict:** Experience (Whole Array).
  *   **Clause:** **Actualization Independence (3)** & **Sensory Specificity (1)**.
  *   **Reasoning:** The iconic memory trace is a sensory-specific cortical activation. It is in a format that *could* be read out (as proven by the cued row), even if the rest fades before readout occurs. The failure of report does not negate the presence of the sensory format.

  **2. The Ten-Minute Drive (Highway Hypnosis)**
  *   **Verdict:** No Experience.
  *   **Clause:** **Format Generality (2)**.
  *   **Reasoning:** You stipulate she *could* have answered questions, but on this principle, we must interpret that as a *disposition to shift states* upon query, not occurrent access. During the drive, visual information is processed via the dorsal stream ("vision-for-action"). This format is encapsulated for steering/braking. It is not in a format generally available to the "narrative self" or memory systems unless attention shifts (which breaks the trance). Thus, no phenomenology.

  **3. Fridge Hum vs. Inattentional Gorilla**
  *   **Verdict:** Fridge = Yes; Gorilla = No.
  *   **Clause:** **Binding Constraint (4)**.
  *   **Reasoning:** This is the crucial distinction. The fridge hum is a low-level *feature* (continuous frequency/intensity) registered in auditory cortex. It does not require object-binding. The gorilla is a complex *object*. Unattended objects fail to undergo the binding required for entry into the sensory format that supports phenomenology. You experience the "noise" (features) but not the "intruder" (object).

  **4. Blindsight**
  *   **Verdict:** Experience (Non-Visual).
  *   **Clause:** **Sensory Specificity (1)** [Modified].
  *   **Reasoning:** The V1 visual map is offline (no *visual* qualia). However, the subcortical/extrastriate pathways generating the "hunch" constitute a different kind of sensory-cognitive map. It satisfies Format Generality (she can guess/report the hunch) but fails Visual Specificity. Hence: experience exists, but it is not *visual*.

  **5. Split-Brain**
  *   **Verdict:** Experience (Unreported).
  *   **Clause:** **Actualization Independence (3)**.
  *   **Reasoning:** The right hemisphere possesses sensory-specific maps and a format potentially available to the right hemisphere's motor/reasoning systems. The fact that the *left* hemisphere (speech) cannot access it is an access failure, not a phenomenological failure.

  **6. Command-Following Patient (Locked-In)**
  *   **Verdict:** Experience.
  *   **Clause:** **Format Generality (2)** & **Actualization Independence (3)**.
  *   **Reasoning:** Sensory maps are intact. The format is available to reasoning systems (proven by the fMRI signal corresponding to "tennis"). The inability to move muscles is irrelevant to the format's existence.

  **7. Cerebellum**
  *   **Verdict:** No Experience.
  *   **Clause:** **Sensory Specificity (1)**.
  *   **Reasoning:** The cerebellum performs massive processing, but it is not a modality-specific sensory map (it doesn't represent "red" or "C#"). It is a calibration engine. It fails the first clause.

  ---

  ### The New Case: Masked Prime
  **Scenario:** A word (e.g., "FACE") is flashed briefly and masked. You never see it, but you are faster to categorize a subsequent image of a face.
  **Verdict:** **No Experience.**
  **Reasoning:** The prime activates semantic/motor pathways directly (or early sensory areas) but fails to achieve **Format Generality**. It is encapsulated within the priming mechanism. It never enters the sensory-cortical format that is *potentially* available to multiple systems; it is available only to the specific task-response system. It is a "zombie" trigger.

  ---

  ### The Price

  To save your intuitions, this principle exacts two specific costs:

  1.  **You must soften the Commute Intuition:** You said the driver "could have answered questions about all of it." PISF requires that this ability was *dispositional*, not *occurrent*. If she truly had the information in a *generally available format* while steering automatically, PISF says she *was* conscious. To keep your "No Experience" verdict, you must accept that the moment she answers the question, she "wakes up" and *then* accesses the info, or that the info was stored in a motor-specific format that had to be translated (which takes time/consciousness). You cannot have it both ways: robust occurrent access + no phenomenology.
  2.  **Blindsight Qualia:** You are committed to the existence of "non-visual qualia" (the hunch). Many empiricists argue blindsight is purely unconscious guesswork. By validating the patient's "hunch" as experience, you are expanding the category of phenomenology beyond the sensory modalities, which risks making "experience" too broad (e.g., is every intuition an experience?).

  ### The Vulnerability

  If I were a grad student pressing you, I would attack the **Fridge vs. Gorilla** distinction (**Clause 4**).

  **The Challenge:** "Professor, you say the fridge hum is experienced because it's a feature, and the gorilla isn't because it's an object requiring binding. But studies show unattended objects *are* semantically processed (e.g., the gorilla is recognized as 'animal' implicitly). If the semantic content is there, why is the phenomenology denied? Conversely, if I am deeply engrossed in a book, I don't experience the fridge hum until it stops. Isn't it more likely that *both* the hum and the gorilla were unconscious, and you only posit experience for the hum because of a retrospective inference when the change occurred?"

  **Why this might switch me:** If you admit that the "faint experience" of the fridge is only posited *because* you noticed the silence, then your Sperling intuition (experience before report) and your Fridge intuition (experience before notice) are actually in tension. Sperling relies on *prospective* phenomenology (it was there *then*); Fridge relies on *retrospective* inference (I know it was there *because* it stopped). If the Fridge case is actually retrospective inference, then Clause 4 is ad hoc, and you might need to collapse into a Higher-Order view where *attention* is required for both, forcing you to overturn your Sperling verdict.

  **Summary:** Your PISF principle saves 7/8 of your verdicts cleanly, but it hangs on the empirical claim that feature-maps generate phenomenology without attention while object-files do not. That is the seam most likely to rip.
