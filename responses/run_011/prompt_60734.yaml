answer: |-
  Here is a plan for your ninety-minute session, structured according to your five requests.

  ### 1. The Order of Ideas and Dependencies

  Do not fight the three students who know the Blue-Eyed Islanders puzzle. **Exploit them.** Their confidence is a pedagogical resource. In the first ten minutes, ask them to explain *why* the guru's announcement is necessary if everyone can already see the blue eyes. They will likely say, "It starts the clock." Press them: "What clock? Everyone sees the eyes every day." This creates the exact aporia you need to introduce the distinction between Universal Knowledge (everyone sees) and Common Knowledge (everyone knows everyone sees).

  **The Sequence (90 Minutes):**

  1.  **Coordination and Convention (0–15 mins):**
      *   Start with Lewis. Coordination problems (where to meet, which side of the road) require more than just everyone wanting to coordinate; they require converging on the *same* solution.
      *   **Dependency:** This motivates *why* we care about knowledge states. Without CK, conventions are unstable.
  2.  **Universal vs. Common Knowledge (15–35 mins):**
      *   **The Carrying Example (Seminar):** Use your inaudible seminar here (see Section 2).
      *   **The Hierarchy:** Introduce the levels ($E^1 p$, $E^2 p$, etc.). Show that Universal Knowledge is just $E^1 p$. Common Knowledge is the limit of the hierarchy.
      *   **Public vs. Private:** This is the mechanism. A public announcement creates the infinite hierarchy instantly. Private messages do not.
      *   **Misconception Check:** Head off the "Universal = Common" collapse here.
  3.  **Aumann's "Agree to Disagree" (35–45 mins):**
      *   **Placement:** Insert this *after* CKF is established but *before* moving to Rationality.
      *   **Responsibility:** State the result verbally: "If priors are shared and posteriors are Common Knowledge, they cannot differ." Do not prove it.
      *   **Function:** It demonstrates the *force* of Common Knowledge. It shows that CK is not just a logical curiosity; it constrains belief revision. This earns the right to use CK as a heavy-duty tool for the second half.
  4.  **From Fact to Rationality (45–60 mins):**
      *   **The Crossing:** This is the critical pivot. CKF is about the state of the world (the seminar is inaudible). CKR is about dispositions (I will maximize utility).
      *   **Non-Triviality:** Emphasize that knowing a fact is static. Knowing rationality is counterfactual: "I know that *if* I deviate, you will respond optimally."
      *   **Misconception Check:** Head off the "Infinite Regress" objection here (see Section 3).
  5.  **Backward Induction and the Centipede (60–80 mins):**
      *   **The Vehicle:** Use the Centipede game.
      *   **Judgement:** Does it make rationality look absurd? **Yes.** Should you use it? **Yes,** but with a shield.
      *   **The Shield:** Explicitly frame the Centipede result not as "what people do" (empirical) but as "what follows from CKR" (logical). Tell the students: "If you find the result absurd, you are rejecting the premise that Rationality is Common Knowledge, not the logic itself." This protects the concept of rationality for your Economics students while satisfying the Philosophers' demand for conceptual precision.
  6.  **Conclusion and Diagnostic (80–90 mins):**
      *   Summarize the arc: Convention $\to$ CKF $\to$ CKR $\to$ Equilibrium Selection.
      *   Pose the diagnostic question.

  ### 2. The Carrying Example (The Seminar)

  Your seminar example is strong for **Common Knowledge of Fact (CKF)**, but the "murmur" variant will not successfully carry the weight of **Rubinstein's Email Game**.

  **Critique of the Murmur Variant:**
  Rubinstein's result relies on a specific structure of *iterated uncertainty* (I know you heard, but you don't know I know you heard). A murmur in a seminar creates vague ambiguity, not the clean "message received/message not received" binary required for the Email Game paradox. If you try to force the murmur to do Rubinstein's work, the logic will leak, and the Economics students will spot the formal gap.

  **Recommendation:**
  Keep the seminar example **binary** for the main pedagogical load.
  *   **State A:** Speaker inaudible. No one asks. (Pluralistic Ignorance / Universal Knowledge of confusion).
  *   **Event:** One person clearly interrupts: "I can't hear."
  *   **State B:** Half the room raises hands. (Common Knowledge of confusion).

  **Why this works for Lewis:**
  Lewis's conventions require a shared basis for expectation. In State A, everyone expects silence (because everyone expects others to expect silence). In State B, the public announcement resets the expectations. This captures the *behavioral difference* between $E^1$ and $CK$.

  **What the Example Must Have:**
  1.  **A Coordination Problem:** The desired outcome (asking questions) is risky if done alone (social cost).
  2.  **A Public Signal:** The interruption must be indisputably public to trigger the shift.
  3.  **No Probabilistic Noise:** Do not muddy the waters with the "murmur" during the core explanation.

  **What to do with the Murmur:**
  Mention the murmur only in the **Aumann section** or as a footnote. Say: "If the interruption was only a murmur, we might have $E^5 p$ but not $CK p$. Rubinstein showed that even $E^{99} p$ is not enough for certain coordination tasks." This acknowledges the depth without breaking your main example.

  **Replacement (if you feel the seminar is too passive):**
  A "Standing Ovation" scenario. Everyone wants to stand if the talk was good, but no one wants to stand alone.
  *   *Universal:* Everyone thinks it was good.
  *   *Common:* One person starts clapping.
  *   *Behavior:* Universal = seated silence. Common = standing ovation.
  *   *Lewis:* The convention is "applaud if others applaud." CK triggers the convention.

  *Verdict:* Stick with the Seminar. It is more intimate and fits the "departmental" context of the students. Just drop the murmur attempt for the main derivation.

  ### 3. Misconceptions Mapped to Sequence

  **1. The Collapse (Universal = Common)**
  *   **Where:** Minute 20 (during the Hierarchy explanation).
  *   **Intervention:** Use the Blue-Eyed students. Ask the room: "In the puzzle, before the guru speaks, does everyone know there is a blue-eyed person?" (Yes). "Does everyone know that everyone knows?" (Yes, for $N \geq 3$). "Then why doesn't induction start?"
  *   **Script:** "Universal knowledge is a state of minds. Common knowledge is a state of the *group*. The guru does not add information about the world; she adds information about *our information*."

  **2. The Infinite Regress ("No one can think 100 levels deep")**
  *   **Where:** Minute 30 (defining Common Knowledge).
  *   **Intervention:** Distinguish *psychological process* from *logical state*.
  *   **Script:** "Common Knowledge is not a process you perform in your head. It is a fixed point. It means 'It is true that...' not 'I am currently thinking that...' If the announcement is public, the infinite hierarchy is instantiated by the environment, not your working memory."

  **3. Pluralistic Ignorance as Counterexample**
  *   **Where:** Minute 15 (Introducing the Seminar Example).
  *   **Intervention:** Pre-empt this. Define Pluralistic Ignorance explicitly as "Universal Knowledge of $p$, but everyone believes others believe $\neg p$."
  *   **Script:** "Pluralistic Ignorance is precisely the *absence* of Common Knowledge. The interruption doesn't change the fact (inaudibility); it changes the higher-order beliefs. It dissolves the ignorance."

  **4. "All Coordination Requires Common Knowledge"**
  *   **Where:** Minute 85 (Conclusion).
  *   **Intervention:** Qualify the claim.
  *   **Script:** "Simple coordination (meeting at a landmark) might only require salience. But *equilibrium selection* in strategic games (like Backward Induction) requires CKR. Do not claim CK is necessary for all social action, only for the specific epistemic foundations of Nash Equilibrium we are discussing."

  **Handling Late Surfacing:**
  If a student raises the Regress objection in the Q&A (Minute 90), do not re-argue. Point them to the **Fixed-Point Axiom** (which you are leaving out, see Section 5) as the formal way philosophers handle this, and offer to discuss it in office hours. This validates the objection without derailing the session.

  ### 4. The Diagnostic Question

  Do not ask for a definition. Ask for a **prediction based on a structural change**.

  **The Question:**
  "Imagine the seminar room has a live chat on screens. During the inaudible lecture, one student types 'I can't hear' into the chat. The software is glitchy: 90% of the room sees the message, but everyone knows the software is glitchy. No one speaks out loud.
  Does the room stand up and leave? Why or why not? Contrast this with the student speaking out loud."

  **Grading the Answers:**
  *   **Surface Understanding:** "They leave because most people saw the message." (Confuses Universal/Probability with Common Knowledge).
  *   **Deep Understanding:** "They do not leave (or coordination fails). Because it is not *Common* Knowledge that the message was seen. I see the message, but I don't know if *you* saw it, so I don't know if *you* know that *I* know. Without the public vocalization, the infinite hierarchy is broken."

  ### 5. What to Leave Out (and Announce It)

  To keep this within 90 minutes for this specific audience, you must explicitly announce the following exclusions. This manages expectations for the Economics students (who might expect math) and the Philosophy students (who might expect formal logic).

  **Announce these exclusions at the start:**
  1.  **The Fixed-Point Axiomatisation:** "We will treat Common Knowledge as a hierarchy today. In advanced courses, you will see it defined as a fixed point of the knowledge operator. We are skipping the proof that these are equivalent."
  2.  **Partition and Kripke Structures:** "We are using English and truth conditions, not possible worlds semantics or partitions. The logic holds, but the formal machinery is for a later module."
  3.  **The Surprise Examination Paradox:** "This is a famous application of epistemic logic, but it introduces self-reference issues that will distract from our core goal of understanding coordination and equilibrium."
  4.  **The Email Game Equilibrium Analysis:** "We will state Rubinstein's result (that 'almost' common knowledge is insufficient), but we will not derive the Bayesian Nash Equilibrium of the email game. That requires more game theory than we have time for."
  5.  **Probabilistic Common Knowledge:** "We are dealing with binary knowledge (Know/Don't Know), not degrees of belief. Aumann's theorem applies to probabilities, but we will discuss it qualitatively."

  **Why this list?**
  It signals rigour. It tells the students you *know* what you are omitting, which prevents the "know-it-alls" from feeling you are simplifying out of ignorance. It frames the session as a **conceptual foundation** rather than a technical toolkit.
