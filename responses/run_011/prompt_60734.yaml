      *   Advice: Be honest. Use the seminar for the qualitative leap. Mention Rubinstein as "what happens when the announcement isn't quite public" but don't try to derive it.
      *   Lewis Connection: Conventions solve coordination problems. CK allows us to select the convention.

  10. **Refining the CKF to CKR transition:**
      *   CKF: We all know $p$.
      *   CKR: We all know we are all maximizers.
