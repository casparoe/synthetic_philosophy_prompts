          1.  Order of ideas (dependencies, public vs. private, hierarchy, Aumann, fact vs. rationality, Centipede game suitability).
          2.  Carrying example (Seminar inaudibility variant, Rubinstein's Email Game comparison, Lewis's convention connection, fix or replace).
          3.  Misconceptions (Universal vs. Common, Infinite Regress, Pluralistic Ignorance, Coordination necessity) mapped to the sequence.
          4.  Final diagnostic question.
          5.  Exclusions (what to explicitly leave out).

  2.  **Deconstruct Component 1: Order of Ideas:**
      *   *Goal:* End with Backward Induction (BI) relying on Common Knowledge of Rationality (CKR). Start with Common Knowledge of Fact (CKF).
      *   *Dependency:* Need to distinguish Universal Knowledge (everyone knows) from Common Knowledge (everyone knows everyone knows... infinite) before applying it to rationality.
      *   *Public vs. Private:* This is the mechanism that creates CKF. Needs to come early.
      *   *Hierarchy:* Needs to be introduced to show *why* universal isn't enough.
      *   *Aumann:* "Agree to Disagree." Good for motivation, but risky if technical. Best placed after CKF is established but before CKR to show *consequence* of CKF.
      *   *Fact to Rationality:* This is the tricky jump. CKF is about the world state; CKR is about dispositions/strategies.
      *   *Centipede Game:* Standard for BI. Does it make rationality look absurd? Yes, often. But for a 90-min intro, it's the standard bridge. However, given the audience (Phil/Econ), the *conceptual* leap is more important than the specific game payoff. Maybe keep it but frame it carefully.
      *   *Blue-Eyed Islanders:* The "know-it-alls." *Decision:* Exploit. Use them as a resource but challenge the depth of their understanding (they know the puzzle solution, not the epistemic structure).

  3.  **Deconstruct Component 2: Carrying Example:**
      *   *User's Draft:* Inaudible seminar. Someone speaks, others follow.
      *   *Variant:* Mumbled interruption (front hears, back hears murmur).
      *   *Critique:* The seminar example is good for *pluralistic ignorance* breaking into common knowledge. The "murmur" variant attempts to model the Email Game (uncertainty about whether the signal was received).
      *   *Problem:* Rubinstein's Email Game relies on *iterated uncertainty* (I know you know, but do you know I know you know?). A murmur in a seminar is vague. It might not capture the *discontinuity* of the Email Game (where 99% probability isn't enough).
      *   *Requirement:* Must show behavioral difference between "Everyone Knows" and "Common Knowledge." Must fit Lewis's Convention (coordination problem).
      *   *Verdict:* The seminar example is strong for CKF. It is weak for Rubinstein's specific probabilistic point. Don't try to force Rubinstein's math into the seminar story. Use the seminar for the *qualitative* shift (silence -> questions). Use a simpler coordination game (e.g., meeting place or standing ovation) for the Lewis connection.
      *   *Fix:* Refine the seminar example to focus on the *public announcement* aspect. The "murmur" is risky. Better to stick to the clear interruption for the main point, maybe mention the murmur as a "what if" that fails to trigger the shift.

  4.  **Deconstruct Component 3: Misconceptions:**
      *   *Collapse (Universal = Common):* Address this immediately when defining CK. Use the "dirty faces" or "seminar" logic.
      *   *Infinite Regress:* Address when defining the hierarchy. Frame it as a fixed point or a state of the world, not a mental process.
      *   *Pluralistic Ignorance:* This is actually the *absence* of common knowledge. Use the seminar example to show how it dissolves.
      *   *Coordination Necessity:* Address at the end. Not *all* coordination needs CK, but *equilibrium selection* often does.

  5.  **Deconstruct Component 4: Diagnostic Question:**
      *   Needs to separate rote memorization from understanding.
      *   Idea: A scenario where Universal Knowledge exists but Common Knowledge does not, and ask for the behavioral prediction.
      *   Better: A variation on the seminar example where the announcement is private vs. public.

  6.  **Deconstruct Component 5: Exclusions:**
      *   Fixed-point axioms (too technical).
      *   Partitions/Kripke (too technical for non-modal logicians).
      *   Surprise Examination (too distracting/paradoxical).
      *   Email Game Equilibrium math (too complex).

  7.  **Drafting the Plan (Iterative Refinement):**

      *   *Blue-Eyed Strategy:* Don't fight them. Ask them to explain *why* the guru's statement matters if everyone already sees blue eyes. This exposes the gap between Universal and Common.
      *   *Sequence:*
          1.  Motivation (Coordination/Lewis).
          2.  Universal vs. Common (The Seminar Example).
          3.  The Hierarchy (Finite vs. Infinite).
          4.  Public Announcement (The Mechanism).
          5.  Aumann (Briefly, as a consequence).
          6.  CKR & Backward Induction (The Centipede).
      *   *Centipede:* It's risky. But without it, CKR is abstract. I will advise using it but explicitly flagging the "absurdity" as a feature of the model, not necessarily reality, to protect the "rationality" concept.
      *   *Seminar Example:* The "murmur" variant is too close to the Email Game which is too hard. Stick to the clear interruption for the main pedagogical load. The "murmur" creates ambiguity, which is good, but might confuse the binary shift (silence to questions). I'll advise keeping the interruption clear to establish the baseline, then *mention* the murmur as a limit case.
