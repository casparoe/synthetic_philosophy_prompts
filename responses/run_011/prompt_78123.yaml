  **Interference is legitimate only to prevent harm to others or to cultivate autonomy in those incapable of it, provided such paternalism is temporary and aimed at its own obsolescence; any rule excluding a people from self-government to secure their welfare is illegitimate, regardless of administrative quality.**

  **Clause 1: Prevent harm to others.** Motivated by Cases 1 (quarantine), 4 (signalman), and 6 (incitement). Cost: Forbids stopping self-regarding vices (Case 3).
  **Clause 2: Cultivate autonomy in the incapable.** Motivated by Cases 2 (child medicine) and 11 (schooling). Cost: Risks disguising oppression as education.
  **Clause 3: Temporariness and anti-despotism.** Motivated by Cases 8, 9, and 10. Cost: Denies efficient governance where people are deemed unready.

  **Overturning Verdicts:** You are torn on Case 11. This principle demands you call it **Legitimate**. Compulsory education builds the capacity required for liberty, unlike Case 12, which restricts liberty without building capacity. If you insist Case 11 is illegitimate, you must overturn Case 2; you cannot protect the boy's life while forbidding the village's education. Consistency requires accepting paternalism that creates future freedom. The simpler principle would be "no paternalism ever," but that costs you Case 2, which you care about. Therefore, you must accept Case 11 to save Case 2.

  **Cases 7, 9, 11:**
  **Case 7** satisfies neither clause because it is not interference. It is state permission for pluralism. Your principle governs coercion; here, the state refrains from monopolizing justice. This is permissible by default.
  **Case 9** fails because it violates Clause 3. Benevolent despotism treats subjects as means to welfare, not ends capable of autonomy. Even if true that they cannot accomplish it themselves *yet*, permanent exclusion forbids the learning process.
  **Case 11** is the linchpin. It looks like Case 8 (forced improvement), but differs in telos. Schooling equips children to exit paternalism; Case 8 rules out exit. Your tension arises from conflating *developmental* coercion with *permanent* subjection.

  **New Cases:**
  1.  **Banning Sati:** A widow is prevented from burning herself on her husband's pyre. **Legitimate.** She acts under social coercion/incapacity; interference preserves her life until she can choose freely.
  2.  **Nomadic Settlement:** A tribe is forced to settle permanently to facilitate tax collection and policing. **Not Legitimate.** This secures revenue (welfare/order) but destroys their way of life without cultivating autonomy.
  3.  **Censoring Rebellion News:** A newspaper is silenced to prevent panic during an uprising. **Not Legitimate.** Unless it incites specific violence (Case 6), preventing panic is paternalistic harm-avoidance for the public, violating Clause 1.
