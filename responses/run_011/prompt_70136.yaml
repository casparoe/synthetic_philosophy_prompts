answer: |-
  Here is a decision tree designed to categorize meta-political theories about the Left/Right distinction. It avoids using the labels "Left" and "Right" in the questions themselves, relying instead on structural descriptions of political conflict.

  ### The Decision Tree

  **Node 1: The Clustering Question**
  > "If you looked at political debates from 200 years ago and compared them to today, would the same *types* of arguments consistently end up on the same side, or do the alliances shuffle completely depending on the issue?"
  *   **They shuffle completely (No stable pattern):** Go to **Leaf A**.
  *   **They stay consistent (There is a stable pattern):** Go to **Node 2**.

  **Node 2: The Status Quo Question**
  > "Imagine the current 'underdog' political side wins a revolution and becomes the new government. Does their label stay with *them* (now the establishment), or does it switch to the *new* underdogs opposing them?"
  *   **It switches to the new underdogs:** Go to **Leaf B**.
  *   **It stays with the same people/policies:** Go to **Node 3**.

  **Node 3: The Hierarchy Question**
  > "Is the fundamental disagreement in politics about whether some people should have authority over others?"
  *   **Yes (It's about ranking):** Go to **Leaf C**.
  *   **No (It's about something else):** Go to **Node 4**.

  **Node 4: The Time Question**
  > "Is the fundamental disagreement about whether society should move toward a new state or preserve an existing one?"
  *   **Yes (It's about direction/motion):** Go to **Leaf D**.
  *   **No (It's about deeper values):** Go to **Leaf E**.

  ***

  ### The Leaves (Positions & Awkward Commitments)

  **Leaf A: The Contingent Bundle**
  *   **Definition:** There is no axis. "Left" and "Right" are just historical nicknames for coalitions that formed by accident and happen to persist due to party inertia.
  *   **The Awkward Commitment:** You cannot call a politician "inconsistent" for mixing positions. If someone supports state-run healthcare (traditionally Side A) and strict border walls (traditionally Side B), you must accept this as a coherent, unique philosophy rather than a contradiction.

  **Leaf B: The Positional Theory (Your Friend's View)**
  *   **Definition:** The labels describe a *relationship to power*, not policy content. One side is always the "Establishment/Order" and the other is always the "Opposition/Change."
  *   **The Awkward Commitment:** Moral valence is contingent on winning. If a Fascist regime becomes the status quo, the anti-Fascist resistance is "Left." If a Communist regime becomes the status quo, the anti-Communist resistance is "Right." The *content* of the resistance doesn't matter, only that they are opposing the throne.

  **Leaf C: The Hierarchy Axis**
  *   **Definition:** The distinction is about social ranking. One side seeks to flatten hierarchies (egalitarian); the other seeks to maintain or justify them (elitist/natural order).
  *   **The Awkward Commitment:** Strange bedfellows. A Libertarian (no state authority) and a Communist (no class authority) are on the *same side*, while a Liberal Democrat (who accepts some state authority to protect rights) is on the *opposite side*.

  **Leaf D: The Temporal Vector**
  *   **Definition:** The distinction is about time. One side looks backward (tradition/ancestry); the other looks forward (progress/novelty).
  *   **The Awkward Commitment:** Revolutionary Reactionaries. If a group wants to use radical, violent means to restore a monarchy from 500 years ago, they are "Left" (because they want *change*/*revolution*) despite wanting a "Right" outcome. The label tracks the *velocity*, not the *destination*.

  **Leaf E: The Moral Veto**
  *   **Definition:** The distinction is about which moral intuitions get veto power when values clash (e.g., Care/Harm vs. Authority/Loyalty/Sanctity).
  *   **The Awkward Commitment:** Policy outcomes are irrelevant. Two people can agree on the exact same law (e.g., "feed the poor"), but if one supports it out of *Care* and the other out of *Loyalty to National Strength*, they are on opposite sides of the political spectrum.

  ***

  ### Analysis: Indistinctions and Empty Cells

  #### 1. Indistinguishable Leaves: The Time/Moral Overlap
  Your tree forces a choice between **Leaf D (Time)** and **Leaf E (Morals)**, but in the real world, these are almost impossible to separate.
  *   **Why:** "Progress" (Time) is rarely valued for its own sake; it is valued because people have a moral intuition that the future *should* be more equitable or free (Morals). Conversely, "Tradition" (Time) is defended because of a moral intuition about Sanctity or Loyalty (Morals).
  *   **The Problem:** If you interview a person who says "It's about Time," and ask "Why does the future matter?", they will inevitably give a Moral answer. The tree treats these as distinct branches, but they occupy the same conceptual space. You likely cannot separate a "Progressive" from a "Care-focused Moralist" using this tree.

  #### 2. Empty Cells: Theoretical Combinations Nobody Occupies
  The structure of the tree excludes certain logical combinations of attributes. These are "empty cells" in the space of political theory.

  *   **The "Hierarchical Bundle" (Leaf A + Node 3)**
      *   *The Combination:* A view that claims there is **no stable axis** (Bundle) BUT ALSO claims the main conflict is **about hierarchy**.
      *   *Why it's empty:* This is incoherent. If the main conflict is *always* about hierarchy, then there *is* a stable axis (Hierarchy vs. Equality). You cannot claim politics is random shards of issues while simultaneously claiming all issues reduce to ranking.
      *   *Status:* **Incoherent.**

  *   **The "Fixed Positional" (Leaf B + Node 2 'No')**
      *   *The Combination:* A view that claims labels switch based on power (Positional) BUT ALSO claims they stay with the same policies (Fixed).
      *   *Why it's empty:* This is a direct contradiction. Your friend's argument relies on the fact that Free Trade moved from Opposition to Establishment. If the label stayed with the policy (Fixed), Free Trade would still be "Left." If the label stayed with the position (Positional), Free Trade became "Right." It cannot be both.
      *   *Status:* **Incoherent.**

  *   **The "Amoral Time" (Leaf D without Leaf E)**
      *   *The Combination:* A view that politics is about **Time/Direction** but *not* about **Moral Intuitions**.
      *   *Why it's empty:* This cell is theoretically possible but **unattractive**. It implies people fight for "The Future" simply because it is new, with no moral belief that the future is *better*. Nobody occupies this cell because political motion is always teleological (goal-directed). If you strip out the moral "why," the temporal "what" collapses.
      *   *Status:* **Unexplored/Unattractive.**

  ### How to Use This on Your Friend
  Run Node 1 and Node 2.
  *   If he answers **"They shuffle"** at Node 1, he is actually a **Bundle Theorist (Leaf A)**, which is even more skeptical than his current position.
  *   If he answers **"It switches"** at Node 2, he is firmly at **Leaf B (Positional)**.
  *   **The Checkmate:** Once he lands on Leaf B, hit him with the **Awkward Commitment**: *"So, if a Neo-Nazi party won an election and became the status quo, you would have to classify the Anti-Nazis as the 'Right' wing opposition, because they are the ones challenging the establishment?"*

  If he flinches there, he secretly believes there is *some* fixed content (Leaf C, D, or E), and his historical argument about Free Trade was just an example of policy drift, not a definition of the axis itself.
