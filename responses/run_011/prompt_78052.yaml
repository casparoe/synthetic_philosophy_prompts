answer: |-
  You are struggling with the central tension of modern liberal democracy: the conflict between **Popular Sovereignty** (the majority rules) and **Constitutional Liberalism** (some things are off-limits to the majority).

  Your intuitions are not incoherent; they are actually more sophisticated than the "one rule" you are trying to force them into. Your tentative rule of *reversibility* fails because it treats all political decisions as if they exist on the same plane. They do not.

  To make your verdicts cohere, you need to replace the single rule of reversibility with a **three-part test**. A referendum is fully legitimate only if it passes the tests of **Subject Matter**, **Affectedness**, and **Entropy**.

  Here is how that framework resolves your contradictions, forces you to refine your views, and judges the new cases.

  ### 1. The Three-Part Framework

  **A. Subject Matter (Rights vs. Policy)**
  *   **Policy:** Distribution of resources, administrative rules, fiscal matters. (e.g., Prop 13, Taxing the Rich, Street Names).
  *   **Rights:** Fundamental liberties, identity, membership in the polity. (e.g., Minarets, Franchise).
  *   *Rule:* The majority has near-absolute authority over Policy. It has **no** authority to violate fundamental Rights, even with 90% of the vote.

  **B. Affectedness (The Constituency)**
  *   **Internal:** The voters are the primary people bearing the costs/benefits.
  *   **External:** The voters impose costs on people who cannot vote (future residents, non-citizens, minorities).
  *   *Rule:* Legitimacy drops precipitously when the voting body does not match the affected body. Low turnout exacerbates this (Town Housing) but isn't the root cause (Swiss Minaret).

  **C. Entropy (The Cost of Reversal)**
  *   **Low Entropy:** Easy to undo (Street names, annual budgets).
  *   **High Entropy:** Hard to undo (Constitutional amendments, international treaties).
  *   **Structural Irreversibility:** Impossible to undo via the same mechanism (Stripping voting rights).
  *   *Rule:* The higher the entropy, the higher the threshold required (supermajority, double majority, etc.). A simple majority is insufficient for High Entropy decisions.

  ---

  ### 2. Resolving Your Existing Cases

  Let's run your list through this framework.

  **Swiss Minaret Ban**
  *   **Verdict:** Procedurally legitimate, substantively illiberal.
  *   **Analysis:**
      *   *Subject Matter:* **Fail.** This is a Rights issue (religious freedom/expression). It shouldn't be on the ballot.
      *   *Affectedness:* **Fail.** It targets a minority who cannot out-vote the majority.
      *   *Entropy:* **High.** Constitutional amendments are hard to reverse.
  *   **Why no scandal?** You distinguish between *procedural legitimacy* (the rules were followed) and *normative legitimacy* (the outcome was just). It isn't a "scandal" in the sense of fraud or rule-breaking, but it is a moral failure of the system. Your intuition holds: it shouldn't have been on the ballot, but since it was, the state must enforce the law until/unless the constitution is amended again.

  **Brexit**
  *   **Verdict:** Honorable mandate, but requires ratification.
  *   **Analysis:**
      *   *Subject Matter:* **Pass.** Leaving a union is a constitutional/sovereign question, which is vote-able.
      *   *Affectedness:* **Pass.** Mostly affects the voters (citizens).
      *   *Entropy:* **Very High.** Undoing it is economically and politically catastrophic.
  *   **Resolution:** Your view that it should be "honored" *and* subject to a "second vote" is not a contradiction. Because Entropy is so high, a simple advisory majority is insufficient for *implementation*. The first vote authorized the negotiation; the second vote (on the deal) would have authorized the irreversible step. This aligns with standard treaty ratification processes.

  **Prop 13 (California)**
  *   **Verdict:** Legitimate vote, awful policy.
  *   **Analysis:**
      *   *Subject Matter:* **Pass.** Taxation is classic policy.
      *   *Affectedness:* **Pass.** Voters taxed themselves (mostly).
      *   *Entropy:* **Medium.** Hard to amend, but not impossible.
  *   **Resolution:** You can condemn the *wisdom* of the policy without questioning the *legitimacy* of the vote. Democracy allows people to make mistakes with their own money.

  **Town Housing Project**
  *   **Verdict:** Illegitimate.
  *   **Analysis:**
      *   *Subject Matter:* **Pass.** Zoning is policy.
      *   *Affectedness:* **Fail.** The people most affected (future residents, people priced out, renters) could not vote. Only current homeowners voted.
      *   *Entropy:* **High.** Once built (or not built), the demographic reality shifts for decades.
  *   **Resolution:** This fails on Affectedness. The 22% turnout matters because it suggests the "current residents" sample is even less representative of the "community interest" than usual. This contradicts the Italian case only superficially (see below).

  **Italian Abrogative Referendums**
  *   **Verdict:** Legitimate.
  *   **Analysis:**
      *   *Subject Matter:* **Pass.** Repealing existing laws.
      *   *Affectedness:* **Pass.** General electorate.
      *   *Entropy:* **Managed.** The quorum rule (50% of eligible voters) is a mechanism to handle **Entropy**. It says: "To change the status quo, we need active enthusiasm, not just passive apathy."
  *   **Resolution:** This does not contradict the Town Housing verdict. The Italian rule *protects* the status quo against a small, motivated minority. The Town Housing vote *imposes* a change (blocking supply) via a small, motivated minority. The Italian system demands high engagement to *change*; the Town system allowed low engagement to *block*.

  **Street Rename / Taxing the Rich**
  *   **Verdict:** Fine.
  *   **Analysis:** Low Entropy (Rename) or Policy (Tax). The majority rules.

  **Banning Religious Symbols**
  *   **Verdict:** Not fine.
  *   **Analysis:** Fails **Subject Matter**. Rights are not subject to majority vote.

  ---

  ### 3. The New Cases

  Here is what the framework dictates for the two cases you haven't listed.

  **Case 1: 51% vote to permanently strip the franchise from a group.**
  *   **Verdict:** **Illegitimate (Void).**
  *   **Reasoning:** This fails **Subject Matter** (voting is a fundamental right) and **Entropy** (Structural Irreversibility). If you strip the franchise, the losers *cannot* undo it by the same means, because they can no longer vote. This violates the "Reversibility" condition you originally identified, but specifically because it destroys the mechanism of reversal. This is the "Paradox of Tolerance" applied to procedure: a democracy cannot vote to cease being a democracy.

  **Case 2: Exclusionary Zoning (Future residents/non-citizens get no vote).**
  *   **Verdict:** **Deficient Legitimacy.**
  *   **Reasoning:** This fails **Affectedness**. This is the "Tyranny of the Present over the Future." Current residents are voting to impose costs (higher prices, segregation, lack of housing) on people who do not exist yet or are not citizens.
  *   **Nuance:** In practice, almost all local zoning fails this test. To make it legitimate, you would need a higher authority (state/federal) to set the rules, or a mechanism to represent future interests (e.g., regional housing mandates). Your intuition on the Town Housing vote was correct: this specific type of vote *shouldn't count* in isolation because the constituency is wrong.

  ---

  ### 4. What You Must Give Up

  To achieve coherence, you must abandon the idea that **"Majority Rule" is a single, monolithic principle.**

  You are currently trying to apply one standard of legitimacy to three different types of political acts:
  1.  **Administration** (Street names, budgets): Simple majority is fine.
  2.  **Constitutional Change** (Brexit, Prop 13, Minarets): Requires supermajorities or double-checks because Entropy is high.
  3.  **Rights & Membership** (Franchise, Religious Symbols): Cannot be decided by majority vote at all.

  **The specific tension you must resolve:**
  You wrote: *"I think [the Minaret vote] shouldn't have been on the ballot at all, and yet the fact that it passed and was immediately implemented doesn't strike me as a scandal."*

  You must accept that **Procedural Legitimacy** and **Moral Legitimacy** are different.
  *   It was not a *scandal* because the Swiss people followed their own rules (Procedural).
  *   It was *wrong* because those rules allowed a violation of human rights (Moral).
  *   **Coherence:** You can respect the *authority* of the state to enforce the law while condemning the *content* of the law. This is the standard position of a liberal international observer.

  ### Summary of the Coherent Principle

  **"The Majority may govern the State, but it may not own the Citizens."**

  *   **Govern the State:** Tax, spend, build, leave unions, rename streets. (Legitimate via Majority).
  *   **Own the Citizens:** Define who has rights, who can vote, what God they can worship. (Illegitimate via Majority).

  Your Town Housing verdict is the outlier that needs the most adjustment: it fails not because turnout was low, but because **current residents are legislating for future strangers.** That is the common thread between the Town Housing vote and the Minaret vote: **The voters were imposing costs on a group that had no voice in the decision.**
