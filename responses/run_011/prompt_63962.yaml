prompt: |-
  I teach a 100-minute upper-level political theory seminar, 18 students, third year. They've just finished a unit on democratic legitimacy and nearly all of them think "who gets to vote?" is a settled question with an obvious answer — you enfranchise the members, and then you get on with the interesting arguments. I want an in-class activity that knocks that assumption over from the inside, before anyone in the room says the words "boundary problem" or "the demos" out loud.

  What I want them to walk out seeing, in order of importance:

  1. That every criterion for who's inside either blows the constituency up to the point of paralysis or leaves out people who are plainly on the receiving end of the rules. I want them to feel the blow-up as paralysis, not as a joke — there's a real difference between "ha ha, everyone on earth gets a vote" and actually trying to run a decision procedure with a constituency of four million for a town of nine thousand and discovering nobody can win anything.

  2. That whoever settles the boundary can't themselves have been chosen democratically without already assuming a boundary. Honestly not sure this one lands — undergrads have seen infinite regresses before and mostly shrug. If you think it can be made to land, build something for it; if you think it can't, say so and let the activity carry the other two points instead.

  3. That in practice boundaries get fixed by conquest, treaty, inheritance and administrative accident, and then the fixed boundary does the legitimizing work retroactively. This is the one I most want them to be ambushed by.

  My half-formed scenario, improve it or bin it: a mid-sized town has to decide whether to expand a wastewater plant sitting right on its border, which discharges into a river running through two other municipalities downstream. Cast of categories I want in the room: year-round residents, people who commute in to work but live elsewhere, non-resident property owners, some long-term residents with no paperwork, seasonal workers, minors, people who'll move there in fifteen years, the plant's corporate operator, and the downstream townsfolk. Not every student needs a named individual — several can hold a whole category.

  Two mechanics I'm attached to, tell me if they're bad:

  - Partway through, the group learns the plant is actually sited in the neighbouring jurisdiction, not theirs. Everyone who spent twenty minutes arguing about whom to enfranchise discovers they were ratifying somebody else's boundary the whole time. I want the flip-chart record of the room's own moves to make this undeniable in the debrief rather than me just asserting it.
  - A seperate round where they have to decide the rule for who decides the rule. I expect some groups will just appoint a chair and move on, which is... actually the point, but I need a lever so that isn't an easy out.

  Also please don't let it become a morality play where the obviously correct move is to include everyone. I want at least one role whose genuine interest lies in a smaller demos and who can defend that without being a cartoon. And I'm tempted by a card for someone representing a non-human or not-yet-existing interest, who gets to speak but not to vote — worried it hijacks the session into a future-generations debate. Your call, but say why.

  Deliverables: full rules; role cards written out so I can photocopy them onto index cards; a payoff or incentive scheme with no real money that makes exclusion actually sting; a minute-by-minute timeline for the 100 minutes including the debrief; the debrief itself, mapping specific moments in the room onto the three points above; at least one escalation lever for a group that resolves the second-order round too fast; and a frank list of what will predictably go wrong the first time I run it and how to handle each thing in the moment.

  On stakes: I want the game's outcome to control something real about the rest of the course — which of two contested topics gets the final seminar slot, say. But tell me how to make exclusion sting without cutting a student out of a course decision they have a legitimate claim to be part of, and without anything touching grades. That tension is the bit I havent solved.

  Last thing: materials have to be index cards, a whiteboard, a paper register and one handout. No apps, no printed packets, nothing that takes me more than an hour to prep.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Context:** 100-minute upper-level political theory seminar, 18 students, 3rd year.
      *   **Current State:** Students think "who gets to vote?" is settled/obvious (enfranchise members).
      *   **Goal:** Disrupt this assumption *before* introducing terms like "boundary problem" or "the demos."
      *   **Key Learning Objectives (in order):**
          1.  Every criterion for inclusion leads to paralysis or exclusion of affected parties.
          2.  (Optional/If possible) The boundary setter can't be chosen democratically without assuming a boundary (infinite regress).
          3.  (Most Important) Boundaries are fixed by non-democratic means (conquest, accident, etc.) and then legitimize themselves retroactively.
      *   **Scenario:** Wastewater plant decision near a border affecting downstream towns.
      *   **Roles:** Residents, commuters, property owners, undocumented, seasonal workers, minors, future residents, corporate operator, downstream townsfolk.
      *   **Mechanics to Keep:**
          *   Mid-game reveal: Plant is actually in a *neighboring* jurisdiction (they were arguing over someone else's boundary).
          *   Second-order round: Deciding the rule for who decides.
          *   Incentive: Exclusion must sting, but without cutting students out of real course decisions or affecting grades.
          *   Constraints: Index cards, whiteboard, paper register, one handout. Max 1 hour prep.
      *   **Specific Concerns:** Avoid morality play (include everyone = good). Need a defensible exclusionist role. Avoid hijacking by future generations/non-human rights.
      *   **Deliverables:** Rules, Role Cards, Incentive Scheme, Timeline, Debrief, Escalation Lever, Troubleshooting.

  2.  **Evaluate the "Stakes" Problem:**

      *   *Problem:* The user wants exclusion to "sting" and control something real (e.g., final seminar topic), but can't actually exclude students from course decisions ethically/pedagogically.
      *   *Solution:* Decouple the *game outcome* from the *course reality*. The game outcome determines a *simulated* constraint or a *symbolic* victory, but the "sting" comes from the *experience of voicelessness* within the simulation, not actual disenfranchisement in the class.
      *   *Refinement:* Use "Political Capital" or "Influence Points" that determine who gets to speak in the *next* simulation or who gets to frame the debrief questions. Or, simpler: The group that wins the vote gets to choose the *framing* of the debrief (e.g., "Efficiency" vs. "Justice"). But the user specifically asked for "control something real about the rest of the course."
      *   *Better Solution:* The "Real Stake" is the *Agenda*. The winning coalition in the game gets to submit the *prompt* for the next week's reading response, or chooses between two pre-approved debate topics for the final class. *Crucially:* Everyone still participates in the course, but the *excluded* roles in the game feel the frustration of having no say in the *game's* outcome, which mirrors the theoretical point. The "sting" is emotional/experiential, not administrative.
      *   *Wait, a safer bet:* The "Excluded" students are barred from voting on the *game outcome*, but they still participate in the debrief. To make it sting without harming learning: The "Winning Coalition" gets to decide the *seating arrangement* or *discussion order* for the next class. It's trivial but symbolic of power.
      *   *Best Fit for Constraints:* Let's use a "Token of Authority." The winning coalition gets a physical token. Whoever holds the token gets to ask the first question in the next seminar. It's low stakes but creates a visible hierarchy.
      *   *Actually, looking closer at the prompt:* "I want the game's outcome to control something real about the rest of the course... tell me how to make exclusion sting without cutting a student out of a course decision."
      *   *Resolution:* The game decides *which theoretical text* gets assigned for the next week (from a pre-approved list of two). Everyone reads it, but the *choice* was made by a demos that excluded some students. The excluded students must read a text they had no say in choosing. This is real, academic, but safe.

  3.  **Refining the Mechanics:**

      *   **The Boundary Reveal:** This needs to happen *after* they've spent energy defining the demos.
      *   **The Second-Order Round:** Needs to be hard. If they just appoint a chair, the lever needs to force a vote on the *criteria*.
      *   **The "Defensible Exclusionist":** Needs to be the Corporate Operator or the Downstream Mayor. Let's make it the **Fiscal Trustee** (a resident concerned with property values/taxes). They argue that including non-taxpayers dilutes the investment. This is a classic "stakeholder" vs. "citizen" argument.
      *   **Non-Human/Future Gen:** Bin it. As the user suspected, it hijacks the session into environmental ethics. Stick to *human* political boundary problems.
      *   **The "Paralysis":** Need to ensure that if they try to include everyone (All Affected Principle), the voting math becomes impossible or the interests cancel out perfectly.

  4.  **Drafting the Activity Structure:**

      *   **Phase 1: Constitution (20 mins).** Define the Demos. Who votes?
      *   **Phase 2: The Vote (20 mins).** Decide on the Plant.
      *   **Phase 3: The Reveal (10 mins).** Jurisdictional Twist.
      *   **Phase 4: Second-Order (20 mins).** Who decides the boundary?
      *   **Phase 5: Debrief (30 mins).** Connect to theory.

  5.  **Addressing the "Infinite Regress" (Point 2):**

      *   Can we make this land? Yes, if the Second-Order round requires a vote *on the criteria*, but the voters for *that* vote are determined by... the criteria they are trying to set.
      *   *Lever:* If they can't agree on the criteria for the Second-Order vote within 5 minutes, the Instructor (The Sovereign) imposes a boundary. This mimics the "Conquest/Accident" point (Point 3).

  6.  **Developing the Role Cards:**

      *   Need 18 roles.
      *   Group them into factions for easier management, but keep individual secret goals.
      *   *Factions:* Core Residents, Economic Stakeholders, Affected Outsiders, Marginalized/Undefined.
      *   *Secret Info:* Some cards reveal the jurisdictional truth early? No, keep it hidden until the reveal.
      *   *Voting Power:* Some have votes, some don't (initially). Wait, they decide who has votes. So everyone starts with a "Claim Card."

  7.  **Addressing the "Sting" (Incentives):**

      *   *Idea:* The "Winning Coalition" in the game chooses the topic for the final seminar (Option A: Global Justice, Option B: Sovereignty).
      *   *Constraint:* Excluded students *must* attend and participate in the final seminar regardless.
      *   *How to make it sting:* The excluded students are physically moved to the "Gallery" during the final vote. They can watch but not speak. This is theatrical but safe (they speak in debrief).
      *   *Better:* The "Winning Coalition" gets to write the exam question? No, too high stakes.
      *   *Best:* The "Winning Coalition" gets to decide the *order* of the remaining course modules. It affects the flow of the class.
      *   *Actually, let's go with the Reading Choice:* Two papers are on reserve. The winning coalition picks which one is mandatory for next week. The excluded students have to read the one they opposed. This is a real academic burden/choice.

  8.  **Troubleshooting & Prep:**

      *   *Prep:* Index cards (Roles), Whiteboard (Tally), Handout (Rules).
      *   *Risk:* Students agree too fast. *Mitigation:* Escalation Lever (The "Veto" card).
      *   *Risk:* Students get angry at exclusion. *Mitigation:* Frame it as simulation in debrief immediately.
      *   *Risk:* The Reveal feels cheap. *Mitigation:* Map it on the whiteboard visually.

  9.  **Finalizing the Plan (Self-Correction during drafting):**

      *   *Correction on Point 2:* The user is skeptical about the infinite regress landing. I will design the Second-Order round to *fail* intentionally. If they try to vote on the boundary rule, they realize they don't know who is eligible to vote on the boundary rule. This forces the Instructor to step in as the "Arbitrary Sovereign," proving Point 3.
      *   *Correction on Roles:* 18 students. I need 18 distinct cards. I will group them into 6 types, 3 students each. This makes prep easier (copy 3 of each).
      *   *Correction on "Sting":* The excluded students are barred from the *Final Vote* of the game. They must sit out the decision. This simulates the feeling. The "Real Course Stake" will be: The Winning Coalition chooses the *title* of the course unit in the syllabus. It's symbolic but "official."

      *Wait, one more check on the "Real Stake":* The user said "control something real about the rest of course."
      *   *Idea:* There are two potential guest speakers (or two video lectures) lined up. The winning coalition picks which one happens.
      *   *Safest/Easiest:* Two possible case studies for the *next* class. Winning coalition picks which one we analyze. Excluded students still have to study it.
      *   *Let's go with:* **The Syllabus Slot.** There are two optional topics left for the semester. The winning coalition picks which one gets the final slot. Everyone studies both, but the *focus* shifts.
      *   *Actually, simplest:* **The Debrief Frame.** The winning coalition decides the *question* that the written reflection (ungraded) must answer.
      *   *Okay, I will propose:* The winning coalition chooses between two pre-approved "Debate Themes" for the final class session. It changes the flavor of the end of the term. It's real, but low risk.

      *Wait, I need to make sure the "Exclusion Stings" without harming learning.*
      *   If a student is excluded from the vote, they are excluded from the *game's* decision. That is the sting.
      *   The *Course* decision (Syllabus Topic) is made by the *Game Winners*.
      *   So, if I am excluded from the Game, I have no say in the Syllabus Topic.
      *   *Ethical Check:* Is it okay for students to have no say in a syllabus topic? Yes, if the instructor pre-approves both options as pedagogically sound. It mirrors the "taxation without representation" feeling without actual harm.

  10. **Writing the Materials:**

      *   Keep language precise.
      *   Ensure the "Jurisdictional Reveal" is scripted.
      *   Ensure the "Escalation Lever" is ready for the instructor's pocket.

  11. **Review against Constraints:**

      *   100 mins? Yes.
      *   18 students? Yes (6 roles x 3 copies).
      *   Index cards/Whiteboard/Handout? Yes.
      *   No apps? Yes.
      *   Prep < 1 hr? Yes (copying cards).

  12. **Final Polish:** Ensure the "Defensible Exclusionist" isn't a villain. The "Taxpayer" role should sound reasonable. Ensure the "Paralysis" is mathematical (too many veto players).

  *(Self-Correction on the "Reveal"):* The prompt says "Partway through, the group learns the plant is actually sited in the neighbouring jurisdiction."
  *   *Implementation:* After they define the demos and *before* they vote on the plant, drop the bomb. "Wait, check your secret info."
