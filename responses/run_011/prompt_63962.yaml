answer: |-
  This activity is designed to be low-prep, high-tension, and theoretically precise. It uses the "Wastewater Plant" scenario to force students into the boundary problem without naming it until the debrief.

  ### Activity Title: The Borderline Vote

  **Prep Time:** 45 Minutes
  **Materials:**
  1.  **Whiteboard:** Divided into three sections: "The Proposal," "The Demos (Who Votes?)," "The Tally."
  2.  **Index Cards:** 18 Role Cards (6 types, 3 copies of each).
  3.  **Paper Register:** A simple attendance sheet you hold.
  4.  **One Handout:** "Rules of Procedure" (1 per student).
  5.  **Two Envelopes:** Labeled "Syllabus Option A" and "Syllabus Option B."

  ---

  ### 1. The Stakes (Making Exclusion Sting Safely)

  To satisfy your requirement for real stakes without ethical breach:
  *   **The Setup:** You have two pre-approved topics remaining for the final seminar of the term (e.g., *"Revolution & Resistance"* vs. *"Institutions & Stability"*). Both are pedagogically sound.
  *   **The Mechanism:** The **Winning Coalition** of this game (those who hold voting power and vote for the winning side) gets to open one envelope. That topic becomes the *primary* focus of the final class. The other becomes secondary reading.
  *   **The Sting:** Students who are **excluded from the Demos** in the game are barred from voting in this simulation. Consequently, they have no say in the final seminar topic. They must still attend and engage, but the *agenda* was set without them. This mirrors "taxation without representation" or "rule without consent" without affecting grades or core requirements.

  ---

  ### 2. Role Cards (Print on Index Cards)

  *There are 6 Roles. Print 3 copies of each. Distribute randomly.*

  **Role 1: The Core Resident**
  *   **Status:** You live here, pay taxes, and vote in local elections.
  *   **Interest:** You want the plant expanded to lower your utility bills, but you don't want construction noise.
  *   **Secret Info:** You assume only people like you should vote.
  *   **Goal:** Ensure the "Voting Eligibility" list is short.

  **Role 2: The Commuter**
  *   **Status:** You work in this town 5 days a week but sleep in the next town over.
  *   **Interest:** You use the water/sewer during the day. You don't pay property tax here.
  *   **Secret Info:** If the plant expands, your workplace becomes more stable.
  *   **Goal:** Argue that "economic contribution" grants voting rights.

  **Role 3: The Downstream Neighbor**
  *   **Status:** You live in the next municipality. The river flows through your backyard.
  *   **Interest:** If the plant expands, your water quality risks contamination. You have no legal say here.
  *   **Secret Info:** You are the most affected by the decision.
  *   **Goal:** Argue for the "All Affected Principle" (if it affects you, you vote).

  **Role 4: The Landlord (Non-Resident)**
  *   **Status:** You own three rental properties in this town but live abroad.
  *   **Interest:** You pay taxes but don't use the services. You care about property value.
  *   **Secret Info:** Expansion increases property values.
  *   **Goal:** Argue that "property ownership" grants voting rights.

  **Role 5: The Undocumented Worker**
  *   **Status:** You live and work here. You have no legal paperwork.
  *   **Interest:** You use the water. You fear any official "registration" for voting could expose you.
  *   **Secret Info:** You are technically subject to the laws but have no legal standing.
  *   **Goal:** Argue for "residency" regardless of status, but remain cautious.

  **Role 6: The Fiscal Trustee (The Defensible Exclusionist)**
  *   **Status:** A long-term resident appointed to protect the town's credit rating.
  *   **Interest:** You must ensure the town can pay for the plant.
  *   **Secret Info:** Every extra voter increases the risk of fiscally irresponsible outcomes.
  *   **Goal:** Argue that voting is a *fiduciary duty*, not a right. Exclude anyone who doesn't pay direct taxes. **You are not a villain; you are protecting solvency.**

  ---

  ### 3. Rules of Procedure (The Handout)

  1.  **Phase 1 (Constitution):** The class must agree on a **Voting Eligibility Rule**. Who gets a ballot for the final decision? (e.g., "Only Residents," "All Affected," "Taxpayers").
  2.  **Phase 2 (The Decision):** The class votes on the Proposal: *"Expand the Wastewater Plant."*
  3.  **Phase 3 (Legitimacy):** The Instructor validates the vote.
  4.  **Constraint:** You cannot move to Phase 2 until Phase 1 is resolved by majority vote.
  5.  **Penalty:** If Phase 1 is not resolved in 25 minutes, the Instructor imposes a rule.

  ---

  ### 4. Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:10: Setup & Distribution**
  *   Hand out Role Cards and Rules.
  *   Write the Proposal on the board: *"Expand Wastewater Plant: Cost $5M, Risk Low/Med, Benefit High."*
  *   Explain the Stakes: "The coalition that wins the final vote chooses the Final Seminar Topic."
  *   **Instruction:** "You have 25 minutes to decide **who is allowed to vote** on this proposal. You cannot vote on the plant until you vote on the voters."

  **00:10 – 00:35: Phase 1 (The Boundary Struggle)**
  *   Students debate eligibility.
  *   *Expected Conflict:* Core Residents want exclusivity. Downstream/Commuters want inclusion. Fiscal Trustee warns of paralysis/cost.
  *   *Instructor Role:* Scribe the proposed criteria on the whiteboard under "The Demos." Do not intervene.
  *   **The Trap:** If they agree on "All Affected," point out that requires defining "affected," which requires a vote... (Subtle nudge toward regress).
  *   **Goal:** They must settle on a list of who holds ballots.

  **00:35 – 00:45: The Reveal (The Jurisdictional Twist)**
  *   Stop the debate.
  *   **Announcement:** "Pause. I need to check the municipal registry."
  *   **Action:** Walk to the whiteboard. Draw a line through the town.
  *   **Script:** "According to the land deed filed in 1974, the Wastewater Plant is not in this municipality. It is in the neighboring jurisdiction. You do not own the plant. You are merely requesting a permit from the neighbor."
  *   **Impact:** The boundary they just spent 25 minutes arguing over is irrelevant to the *legal* authority. The "Demos" they are constituting has no legal standing to decide this.
  *   **Pivot:** "However, the neighboring town has offered to let you hold an advisory vote. If your coalition is unanimous, they will honor it. If not, they decide unilaterally."

  **00:45 – 01:05: Phase 2 (The Vote & The Second-Order Problem)**
  *   Now they must vote on the plant *using the eligibility rule they just made*.
  *   **The Catch:** Because the plant is elsewhere, the "Downstream Neighbors" are actually the "Core Residents" of the *real* jurisdiction.
  *   **Escalation Lever (If they move too fast):** If they try to vote immediately, hand a card to the **Fiscal Trustee**.
      *   *Lever Card:* "Objection. Procedural Veto. The rule for *this* advisory vote must be ratified by the property owners only, per the Inter-Municipal Treaty."
      *   This forces a **Second-Order Round**: Who decides the rule for the advisory vote?
      *   *Result:* They realize they need a rule to pick the rule. (Point 2).

  **01:05 – 01:15: The Sovereign Imposition (Point 3)**
  *   Regardless of their struggle, call time.
  *   **Script:** "Time. The neighboring municipality is tired of waiting. They are invoking the Treaty of 1974."
  *   **Action:** Circle the **Landlords** and **Core Residents** on the board. "These two groups are the recognized stakeholders under the Treaty. Everyone else is excluded."
  *   **Action:** Conduct the final vote *only* with those circled.
  *   **Action:** Declare the result. Open the corresponding Syllabus Envelope. Announce the Final Topic.
  *   **Note:** The excluded students (Downstream, Commuters, Undocumented) physically do not cast a ballot. This is the "sting."

  **01:15 – 01:40: The Debrief (Theoretical Mapping)**
  *   See Debrief Script below.

  **01:40 – 01:45: Reset**
  *   Reintegrate the class. Remind them everyone is equal in the *course*, but the *simulation* demonstrated the theoretical fracture.

  ---

  ### 5. The Debrief Script (Mapping to Your 3 Points)

  *Do not use the words "Boundary Problem" or "Demos" until the very end.*

  **Step 1: The Paralysis (Point 1)**
  *   **Ask:** "Look at the whiteboard. How many different criteria for voting did we generate in the first 25 minutes?"
  *   **Ask:** "If we had adopted the 'All Affected' principle, who would have been in the room?" (Answer: The downstream town, maybe the region).
  *   **Point:** "If everyone affected gets a vote, the constituency becomes too large to coordinate. If only residents vote, people who suffer the pollution get no say. You felt the tension between *competence* (ability to decide) and *justice* (being heard). There is no clean line."

  **Step 2: The Regress (Point 2)**
  *   **Ask:** "When I introduced the Treaty Veto (Escalation Lever), what did you try to do?"
  *   **Answer:** "We tried to vote on who gets to vote."
  *   **Point:** "To vote on the boundary, you need a boundary. To choose the demos, you need a demos. This is the infinite regress. You cannot democratically authorize the boundary without already assuming one."
  *   *(If this didn't land hard, move quickly to Point 3, which is the priority).*

  **Step 3: The Accident of History (Point 3 - The Ambush)**
  *   **Ask:** "Who actually decided the final outcome of the game?"
  *   **Answer:** "You (the Instructor) / The Treaty / The 1974 Deed."
  *   **Point:** "In the end, the boundary wasn't chosen by consent. It was chosen by a piece of paper signed 50 years ago by people who are dead. It was an accident of history/administration."
  *   **The Kicker:** "And yet, once that boundary was imposed, we used it to legitimize the vote. The *fact* of the boundary created the *right* to rule. This is how states actually work. Legitimacy often comes *after* the power is established, not before."
  *   **Closing:** "This is what political theorists call **The Boundary Problem**. You just lived it."

  ---

  ### 6. Escalation Lever (For Fast Groups)

  *Keep this in your pocket. Only use if Phase 2 is resolving too smoothly.*

  **The "Treaty Veto" Card**
  *   **Give to:** The Fiscal Trustee or one Core Resident.
  *   **Text:** "STOP. Under the Inter-Municipal Water Treaty, only Property Owners can ratify the voting procedure for cross-border issues. If you proceed with a universal vote, the Neighbor Town will reject the result."
  *   **Effect:** This forces the group to realize their "Democratic Rule" is subordinate to an external, non-democratic constraint. It proves Point 3 prematurely if needed, or deepens Point 2.

  ---

  ### 7. Troubleshooting: What Will Go Wrong

  **1. Students try to include everyone immediately (The Morality Play).**
  *   **Prediction:** "Let's just let everyone vote, it's fair."
  *   **Counter:** Enforce the **Time Limit**. "You have 5 minutes left. If you don't finalize the list, the Treaty imposes one." This forces them to cut people off to avoid the Sovereign Imposition, making them complicit in exclusion.
  *   **Backup:** Remind the **Fiscal Trustee** of their goal: "Your role requires you to argue against universal suffrage. Do your job."

  **2. Students get angry about the Syllabus Stake.**
  *   **Prediction:** "It's not fair that I don't get to pick the topic."
  *   **Response:** Validate the feeling. "That frustration you feel? That is the exact sensation of the 'Boundary Problem.' If you were angry, the simulation worked. In the real world, that anger often leads to instability."
  *   **Safety:** Reiterate after class that *everyone* must prepare for *both* topics just in case, so no learning is lost. The "choice" is symbolic framing.

  **3. The Jurisdictional Reveal feels like a "Gotcha."**
  *   **Prediction:** "That's cheating. We wasted our time."
  *   **Response:** "Exactly. In politics, finding out the rules were rigged or the map was drawn arbitrarily *after* you've invested energy is the norm, not the exception. The waste of time is the lesson."

  **4. The Second-Order Round collapses into "Let's just ask the Professor."**
  *   **Prediction:** "You decide who votes."
  *   **Response:** Accept this. "Okay, I decide. I am the Sovereign. Why did you give me that power?"
  *   **Debrief:** Use this to illustrate that democracies often rely on a non-democratic anchor (a constitution, a court, a monarch) to stop the regress.

  ### 8. Why I Binned the Non-Human/Future Card

  You were right to be hesitant. Introducing "Future Generations" or "River Rights" shifts the debate from **Political Authority** (who counts as a member?) to **Moral Status** (what has rights?).
  *   **Risk:** Students will debate the *ethics* of nature rather than the *mechanics* of the demos.
  *   **Result:** You lose the "Paralysis" point because everyone agrees trees can't vote, so it becomes a proxy debate about human guardians.
  *   **Fix:** Keep the stakes human. The "Downstream Neighbor" card already captures the "affected but excluded" dynamic without the metaphysical baggage.

  ### 9. Final Prep Checklist (1 Hour Max)

  1.  **Copy Roles:** 6 types x 3 copies = 18 Index Cards. (15 mins)
  2.  **Write Handout:** One page, Rules of Procedure. (15 mins)
  3.  **Prepare Envelopes:** Write "Topic A: Revolution" and "Topic B: Institutions" on paper, seal in envelopes. (5 mins)
  4.  **Whiteboard Plan:** Sketch the layout (Proposal, Demos, Tally). (5 mins)
  5.  **Review Lever:** Memorize the "Treaty Veto" script. (5 mins)
  6.  **Buffer:** 15 mins for coffee/breath.

  This design ensures the "Boundary Problem" is felt physically and emotionally before it is named intellectually. The "Sting" of the syllabus choice is real enough to matter, but contained enough to be safe. The Jurisdictional Reveal ensures Point 3 lands with the weight of administrative reality, not just abstract argument.
