answer: |-
  # Session Plan: The Penetration Problem
  **Time:** 45 Minutes
  **Audience:** 15 Journalism Grads (Smart, confident, pragmatic)
  **Goal:** Distinguish *perception* from *interpretation* and translate scientific uncertainty into reporting rigor.

  ## 1. The Sequence (Order of Play)

  **0:00 – 0:05: The Hook & The Pivot (Manage the Elephant)**
  *   **Action:** Open immediately with the scenario they are itching to discuss. "A witness sees a robbery. They say the gunman had a knife. Later, no knife is found. They insist they *saw* it. Did their fear change their eyes, or their memory?"
  *   **The Pivot:** Acknowledge this is the real-world stakes. Then, explicitly park it. "We cannot solve the robbery case until we solve the card case. If we don't know how belief works in a quiet room, we can't know how it works in a crisis."
  *   **Dependency:** This validates their intuition (journalism = truth-seeking) while preventing the discussion from dissolving into anecdotal war stories about lineups.

  **0:05 – 0:20: The Carrier Example (The Anomalous Card)**
  *   **The Prop:** Use the **Bruner & Postman (1949) Anomalous Playing Cards**. (Show a slide: Normal Red Heart, Normal Black Spade, *Anomalous* Red Spade).
  *   **The Demo:** Describe the experiment. Subjects flash cards at high speed. When shown a Red Spade, they don't say "Red Spade." They say "Black Spade" or "Red Heart." Some report physical discomfort ("It looked blurred").
  *   **The Lesson:** This is the *only* example you drill. Use it to define the three layers:
      1.  **Sensation:** Light hitting the retina (Red + Spade shape).
      2.  **Perception:** The brain organizing the signal (Is this a card?).
      3.  **Judgment:** The label applied ("Three of Spades").
  *   **Dependency:** You cannot discuss the "Hills" or "The Dress" until they understand that *recognition* is not the same as *sensation*. This example isolates the variable.

  **0:20 – 0:30: Verdict on the "Usual Suspects"**
  *   **Action:** Now that they have the Card framework, evaluate the famous studies they've heard of.
  *   **The Dress:** Dismiss it. It's about lighting ambiguity, not cognitive penetration. It's a "bottom-up" confusion, not "top-down."
  *   **Proffitt's Hills (Tired = Steeper):** Mark as **Controversial/Replication Crisis**. Explain that while intuitive, the methodology (verbal estimate vs. visual matching) often conflates *judgment* with *perception*.
  *   **The Takeaway:** "The Card study is old but robust. The Hill study is sexy but shaky. As journalists, treat the 'Hill' findings as 'Subject reports feeling,' not 'Subject sees differently.'"
  *   **Dependency:** Relies on the Card distinction. If they think the Hill study proves perception changes, they haven't grasped the Card lesson.

  **0:30 – 0:40: The Usable Turn (Reporting the Fuzz)**
  *   **Action:** Return to the Eyewitness scenario from Minute 1.
  *   **The Problem:** Since science can't definitively prove if the *image* changed or just the *label*, you cannot write "He saw a gun."
  *   **The Tool:** Teach them to report the **Conditions of Observation**, not just the Content.
      *   *Bad:* "Witness John Doe saw the suspect flee."
      *   *Good:* "Witness John Doe, viewing from 50 feet in low light, identified the suspect fleeing."
  *   **Dependency:** Relies on the "Underdetermined" landing. Because we can't know the internal state, we must document the external constraints.

  **0:40 – 0:45: The Landing & The Filter Question**
  *   **Action:** Address the "Underdetermined" upshot directly.
  *   **The Pitch:** "The science is unsettled. That is not a bug; it is a feature for you. It means 'objective sight' is a myth you must stop quoting."
  *   **Final Question:** (See below).

  ---

  ## 2. The Carrier Example: Anomalous Playing Cards
  **Why this one?**
  It is the cleanest separation of *data* (red ink) from *concept* (spades are black). The "Hills" study relies on self-report (which journalists should be skeptical of). The "Dress" is about physics (lighting). The Cards force a collision between expectation and input.
  **How it carries:**
  *   **Min 5:** Introduces the mechanism (Expectation overrides Data).
  *   **Min 20:** Serves as the yardstick to measure the "Hills" study (Did they report steepness or *see* steepness?).
  *   **Min 30:** Serves as the analogy for the witness (Did they see a gun, or did they see a shape and label it 'gun' because they expected one?).

  ---

  ## 3. Verdict on the "Usual Suspects"
  *   **Swapped-Colour Cards (Bruner/Postman):** **KEEP.** This is your core teaching tool. It's the only one that clearly demonstrates the lag between sensation and recognition.
  *   **The Dress (Blue/Black vs. White/Gold):** **DROP.** It's a distraction. It proves people have different assumptions about lighting, not that cognition penetrates early vision. Tell them: *"This is about ambiguity, not penetration."*
  *   **Hills Looking Steeper (Proffitt):** **FLAG AS UNRELIABLE.** It's the most famous example, so you can't ignore it. But it's mired in replication issues. Use it to teach them to check methodology. *"If the measure was verbal estimate, it's judgment. If it was visual matching, it's perception. Most were verbal."*

  ---

  ## 4. Misconceptions & Interceptions

  **Misconception 1: "Top-Down Processing means Hallucination."**
  *   **When it arrives:** Minute 5 (The Hook). They will equate "expectation shapes sight" with "imagining things."
  *   **Where to head it off:** During the **Card Demo (Min 10)**.
  *   **The Fix:** Explicitly state: "Penetration is not hallucination. The retina got the red light. The brain just refused to process it as 'red spade' immediately. It's a lag, not a lie."

  **Misconception 2: "If it's Underdetermined, it doesn't matter."**
  *   **When it arrives:** Minute 35 (The Usable Turn). They will think, "If science doesn't know, why should I care?"
  *   **Where to head it off:** Start of **The Usable Turn (Min 30)**.
  *   **The Fix:** "It matters because your editor wants certainty, and reality offers probability. Your job is to translate the probability without losing the reader."

  **Misconception 3: "Eyewitness Testimony is the same as Perception."**
  *   **When it arrives:** Minute 3 (The Hook).
  *   **Where to head it off:** The **Pivot (Min 5)**.
  *   **The Fix:** "Testimony is memory + language + perception. We are isolating perception. If you conflate them, you miss where the error actually happened."

  ---

  ## 5. What to Leave Out (And Say You Are)
  **The Omission:** **Neuroanatomy (V1 vs. V4 feedback loops).**
  **Why:** It's a rabbit hole. Whether the feedback happens at the thalamus or the visual cortex doesn't change how they interview a source.
  **What to say out loud:** "I am skipping the brain-scan war. There are fMRI studies claiming to show feedback loops in early vision, and others denying it. It doesn't help you write a story. We are sticking to *behavior*: what people say they saw versus what was there."

  ---

  ## 6. The Landing: Underdetermined but Usable
  **The Trap:** Saying "We don't know" sounds like a cop-out.
  **The Fix:** Frame uncertainty as a **Reporting Constraint**.
  **Script:** "The honest scientific upshot is that the line between seeing and thinking is blurry. We don't know exactly where it is. For a scientist, that's a problem. For a journalist, that's a beat. Your usable takeaway is this: **Never treat 'I saw' as a brute fact.** Treat it as a claim contingent on conditions. You aren't dodging the truth; you're reporting the *resolution limit* of human vision."

  ---

  ## 7. The Final Question (The Filter)
  *Ask this at Minute 44. Give them 30 seconds to think, then ask for a show of hands.*

  **"If a source tells you, 'I knew he was dangerous the moment I saw him,' which of these two follow-up questions reveals whether cognition penetrated their perception?"**

  *   **A)** "What specific physical actions made him look dangerous?"
  *   **B)** "Had you heard he was dangerous before you arrived?"

  **The Answer:**
  *   **B** is the correct filter.
  *   **Why:** If they heard he was dangerous *before*, their belief could have penetrated the perception (The Card Effect). If you ask **A**, they will just rationalize the perception with post-hoc details (The Hill Effect).
  *   **The Split:** Students who "nodded politely" will choose **A** (looking for objective evidence). Students who "got it" will choose **B** (looking for the prior belief that might have altered the input).
