      *   *Refining for "Continuous Prose":* I need to make sure I don't accidentally use "First," "Second," or visual breaks. I must weave the sentence-by-sentence analysis into the flow. I will use phrases like "When the author writes..." or "Moving to the next claim..." to track the sentences without listing them.

      *   *Refining for "No Citations":* Avoid naming papers or years beyond what's in the prompt.

