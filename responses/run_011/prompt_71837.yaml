      *   *Self-Correction on "Random Guessing":* NFL says expected error is the same. If the loss is 0-1 loss, and functions are uniform, expected error is 0.5 (random guessing). So that part is technically okay, but the implication that *learning* is impossible is the wince-inducing part. Learning is impossible *without* assumptions.

      *   *Self-Correction on "Simplicity":* The author conflates "inductive bias" with "simplicity." NFL applies to any bias. You could bias towards complex functions, and you'd do great on complex worlds and bad on simple ones. The claim that ML *always* smuggles simplicity is empirically false (e.g., deep learning often fits complex boundaries, though there's an implicit bias towards flat minima). I need to point out that NFL demands *matching* bias, not specifically *simple* bias.

