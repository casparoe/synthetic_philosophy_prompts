answer: |-
  **Project Title:** The Geometry of Priority: Formalizing the ITN Framework as an Impact Production Function

  **Applicant:** [Your Name/Org]
  **Duration:** 6 Months
  **Funding Request:** [Amount]

  ### 1. The Core Question
  The Importance-Tractability-Neglectedness (ITN) framework is the standard heuristic for cause prioritization within the Effective Altruism community. It typically operates by scoring each dimension on an arbitrary ordinal scale (e.g., 1–10), multiplying them, and ranking causes by the product.

  **The Mathematical Defect:** This scoring method is not scale-invariant. If "Importance" is scored 1–10 but "Tractability" is scored 1–5, the weighting is arbitrary. If we re-anchor the scales using logarithms, or shift the zero-point of the neglectedness scale, the ranking of causes changes. Currently, the output of ITN analysis is partially an artifact of measurement choices that are rarely defended.

  **The Research Question:** Can we derive a specific functional form for an **Impact-vs-Resources Curve** such that the ITN heuristic emerges as a valid first-order approximation of marginal value? If not, what is the minimal mathematical structure required to make cause prioritization unit-independent and robust?

  ### 2. Why Standard Defenses Are Insufficient
  Proponents of the current ITN usage typically offer three defenses, none of which hold under scrutiny for a framework driving significant capital allocation:

  1.  **"It's just a heuristic for organizing thinking."**
      *   *Counter:* When ITN scores are used to compare global health vs. AI safety vs. policy reform, they function as quantitative models, not qualitative checklists. If the math implies Cause A is 10x better than Cause B, funding follows the math. A heuristic that yields different rankings based on whether you use a 1–5 or 1–10 scale is mathematically broken for decision-making.
  2.  **"We normalize the scores anyway."**
      *   *Counter:* Normalization requires a defined reference class (e.g., "all possible causes"). This set is undefined and unbounded. You cannot z-score against the universe of all problems. Normalization hides the arbitrary weighting; it does not solve it.
  3.  **"Precision is impossible; rough estimates are all we have."**
      *   *Counter:* Uncertainty in inputs does not justify structural instability in the model. A model can be uncertain but still structurally sound (e.g., scale-invariant). Currently, ITN is structurally unsound.

  ### 3. The Proposed Approach: Impact Curves over Scores
  Rather than attempting to "fix" the scoring scales (which returns us to the normalization problem), this project treats ITN as parameters describing the shape of a marginal value curve, $V(x)$, where $x$ is cumulative resources invested.

  *   **Importance ($I$):** The asymptote (total value if the problem is fully solved).
  *   **Neglectedness ($N$):** The current position on the x-axis (inverse of resources already invested).
  *   **Tractability ($T$):** The slope of the curve at the current position (marginal return).

  **Why this is superior to scale normalization:**
  Normalization asks, "How big is this number compared to other numbers?" which requires omniscience about all causes. The curve approach asks, "What are the structural assumptions about how resources convert to value in this specific domain?" This shifts the debate from arbitrary scoring to defensible economic assumptions (e.g., diminishing returns, step functions, threshold effects).

  If $ITN$ is to represent Marginal Value ($MV$), then $MV \approx I \times T \times N$. This equation only holds true under specific functional forms (e.g., logarithmic or power-law returns). This project will identify those forms and test if real-world cause areas fit them.

  ### 4. Work Plan (Month by Month)

  **Month 1: Formalization & Literature Review**
  *   Map existing ITN justifications (GiveWell, Open Philanthropy, FHI papers).
  *   Formalize the "Scale Invariance Problem" mathematically.
  *   Define the candidate family of impact functions $V(x)$ that could underlie ITN.

  **Month 2: Deriving the Geometry**
  *   Derive the conditions under which $I \times T \times N$ approximates $V'(x)$ (marginal value).
  *   Identify where the standard heuristic breaks (e.g., in "winner-take-all" scenarios or threshold problems).
  *   Draft the "Corrected ITN" formula based on the viable functional forms.

  **Month 3: Case Studies (Retrospective Testing)**
  *   Apply the new framework to 3–4 historical cause areas where outcomes are known (e.g., smallpox eradication, ozone layer depletion, specific AI safety interventions).
  *   Compare rankings generated by standard ITN vs. the Curve-Based ITN.
  *   Assess stability: Do rankings remain consistent under scale transformations in the new model?

  **Month 4: Sensitivity Analysis & Uncertainty**
  *   Model how uncertainty in the *shape* of the curve affects prioritization.
  *   Develop a "robustness check" for grantmakers: If you aren't sure about the curve shape, how much weight should you give ITN?
  *   Draft the "Practitioner's Guide" section.

  **Month 5: Drafting the Paper**
  *   Write the full technical report.
  *   Create a simplified spreadsheet tool that allows users to input curve parameters rather than 1–10 scores.
  *   Internal review with 2–3 mathematical advisors.

  **Month 6: Feedback & Dissemination**
  *   Circulate draft to key stakeholders (prioritization researchers at major EA orgs).
  *   Incorporate feedback.
  *   Publish preprint and release the tool.

  ### 5. Expected Outputs
  1.  **Technical Paper:** A rigorous critique of the scale invariance of multiplicative scoring and a proposal for the Impact-Curve alternative.
  2.  **Decision Tool:** A calculator that forces users to define the shape of returns (logarithmic, linear, step) rather than inputting arbitrary scores.
  3.  **Guidelines:** A one-page summary for grantmakers on how to interpret ITN without falling into the scale-invariance trap.

  ### 6. Conditions for Failure
  This project will be considered unsuccessful if:
  *   **No Stable Function Found:** If no plausible impact function $V(x)$ allows ITN to serve as a valid proxy for marginal value, and no superior simple heuristic emerges.
  *   **Complexity Overload:** If the resulting framework is too mathematically demanding for general grantmakers to use, rendering it theoretically sound but practically useless.
  *   **Equivalence:** If analysis shows the Curve approach yields identical rankings to standard ITN in all practical cases, implying the "bug" is theoretical only.

  ### 7. Realistic Scope Assessment
  **What this project *will* do:** It will definitively map the mathematical assumptions currently hidden inside the ITN framework. It will provide a robust alternative for cases where diminishing returns are the dominant dynamic.

  **What this project *will not* do:**
  *   It will not solve the problem of estimating the inputs. Knowing you need the "slope of the curve" is useless if you cannot estimate the slope. This project clarifies *what* to estimate, not *how* to guess it better.
  *   It will not produce a universal theory of value. Some cause areas (e.g., existential risk) may have step-function dynamics that defy smooth curve modeling. I will flag these exceptions, not force them into the model.
  *   It is unlikely to result in a peer-reviewed publication in a top economics journal within six months. The target audience is the EA prioritization community, and the output will be a high-quality preprint/report.

  **Risk Mitigation:** If Month 2 reveals that the "Curve" hypothesis is mathematically dead-ended, the scope will pivot to a comparative analysis of alternative aggregation methods (e.g., additive vs. multiplicative, geometric means) to at least deliver a definitive critique of the current standard.

  ### 8. Budget & Capacity
  [Insert brief budget details here]
  I have the background in [Math/Economics/Philosophy] required to handle the formalization. The primary cost is research time and stipend to allow for deep work without competing consulting obligations.

  ### 9. Conclusion
  The ITN framework is the engine room of effective altruism. Currently, that engine is running on uncalibrated dials. This project does not propose scrapping the engine; it proposes building the gauge cluster that tells us what the dials actually mean. For a small funder, the ROI is high: ensuring that future prioritization exercises are mathematically coherent prevents systematic misallocation of capital driven by arbitrary scoring choices.
