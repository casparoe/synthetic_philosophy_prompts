prompt: |-
  I'm pitching a six-month project to a small funder and need the proposal written up. The itch: the importance/tractability/neglectedness framework that EA-type orgs use to rank cause areas isnt scale-invariant. You score each dimension, multiply, and rank — but re-anchor the scales in an equally defensible way (logs instead of raw scores, or a 0–1 range with different endpoints) and the ranking of causes comes out different. So a chunk of the output is an artifact of measurement choices nobody ever defends.

  My half-formed hunch is the fix isnt to ditch ITN but to stop treating it as a score and start treating it as a claim about the shape of an impact-vs-resources curve: neglectedness is where on the curve you currently sit, tractability is the slope, importance is the asymptote. Then the real question is what assumptions about that curve you need before the product counts as even a rough first-order approximation of marginal value.

  Write it up: the question stated precisely, why the usual defenses (it's just a heuristic, it forces you to think explicitly, whatever) don't settle it, what I'd actually do month by month, why the impact-curve route rather than the obvious cheaper fix of just normalizing the scales, what a result looks like, what would count as the project failing, and an honest read on how much of this six months can realistically cover. No bibliography, I'll put references in myself.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Critique and refinement of the Importance-Tractability-Neglectedness (ITN) framework used in Effective Altruism (EA).
      *   **Core Problem:** ITN is not scale-invariant. Changing the measurement scales (logs vs. raw, 0-1 ranges) changes the ranking of cause areas, making the output an artifact of arbitrary measurement choices.
      *   **Proposed Solution/Hunch:** Reinterpret ITN not as a scoring heuristic but as parameters of an impact-vs-resources curve (Importance = asymptote, Tractability = slope, Neglectedness = current position). Investigate the assumptions needed for this to approximate marginal value.
      *   **Deliverable:** A six-month project proposal for a small funder.
      *   **Required Sections:** Precise question statement, why usual defenses fail, month-by-month plan, why the curve approach > simple normalization, expected results, failure conditions, realistic scope assessment.
      *   **Constraint:** No bibliography (user will add references).
      *   **Tone:** Professional, analytical, honest, persuasive to an EA-aligned funder (likely familiar with the jargon but critical of sloppy math).

  2.  **Deconstruct the Core Argument:**
      *   *The Bug:* $Score = I \times T \times N$. If $I$ is 1-10 and $T$ is 1-5, the weighting is arbitrary. If I change $I$ to 1-100, causes with high importance dominate disproportionately. This violates unit independence.
      *   *The Standard Defense:* "It's just a heuristic to organize thinking."
      *   *The Counter:* If it drives millions in funding decisions, it needs to be more than a napkin sketch. If it claims to estimate marginal value, it must obey the math of marginal value.
      *   *The Hypothesis:* ITN maps to a production function $V(x)$, where $x$ is resources.
          *   Importance ($I$) $\approx \lim_{x\to\infty} V(x)$ (Total potential value).
          *   Neglectedness ($N$) $\approx$ Current $x$ (or inverse thereof).
          *   Tractability ($T$) $\approx V'(x)$ (Marginal return at current $x$).
      *   *The Goal:* Derive the functional form $V(x)$ that makes $I \times T \times N$ a valid proxy for marginal value, or propose a better formula based on this geometry.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "Scale Invariance in Cause Prioritization" or "The Geometry of ITN." Let's go with something about the mathematical foundations.
      *   **Executive Summary:** Brief overview of the problem and the proposed geometric solution.
      *   **The Problem (Precise Statement):** Focus on scale invariance and the arbitrary nature of multiplicative scoring.
      *   **Why Standard Defenses Fail:** Address the "heuristic" argument. If it allocates capital, it's a model, not a thought experiment.
      *   **The Proposed Approach (Impact Curves):** Explain the $V(x)$ mapping. Why this is better than normalization (normalization hides assumptions; curves expose them).
      *   **Work Plan (6 Months):**
          *   M1: Literature/Formalization.
          *   M2: Modeling the Curve.
          *   M3: Testing against historical cases.
          *   M4: Sensitivity Analysis.
          *   M5: Drafting the Framework.
          *   M6: Review/Dissemination.
      *   **Expected Outputs:** A paper, a calculator/tool, guidelines.
      *   **Failure Conditions:** What if the math doesn't work? What if it's too complex?
      *   **Scope Reality Check:** Be honest. Six months is short for a paradigm shift. Aim for a "working draft" or "proof of concept" rather than a final theory of value.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the "curve" idea actually new? *Correction:* It's hinted at in EA forums (Ben Todd, etc.), but rarely formalized as the *solution* to the scale invariance problem. I need to emphasize that I'm linking the *mathematical bug* specifically to the *geometric interpretation*.
      *   *Critique:* Why not just normalize? *Correction:* Normalization (e.g., z-scores) requires a reference class of "all possible causes." That's impossible to define. The curve approach relies on structural assumptions about the cause itself, which is more defensible than arbitrary bounds.
      *   *Tone Check:* Ensure it doesn't sound like I'm trashing EA, but rather strengthening its technical backbone. Use terms like "marginal value," "production function," "unit independence."
      *   *Funder Perspective:* They want to know if this money is well-spent. Emphasize that better prioritization math leads to better ROI on their grants.

  5.  **Final Polish:**
      *   Check against constraints: No bibliography? Check. Six months? Check. All specific sections included? Check.
      *   Make sure the "Failure Conditions" are honest. If the curve model is just as arbitrary as the scoring, admit that.
      *   Ensure the "Month by Month" is realistic. Don't promise a peer-reviewed journal article in 6 months if it's a solo project. Promise a preprint and community feedback.

  6.  **Final Review against the Prompt:**
      *   "Itch": Scale invariance. (Included)
      *   "Hunch": Impact-vs-resources curve. (Included)
      *   "Why usual defenses don't settle it." (Included)
      *   "Month by month." (Included)
      *   "Why curve > normalization." (Included)
      *   "Result looks like." (Included)
      *   "Failure conditions." (Included)
      *   "Honest read on scope." (Included)

      *(Self-Correction on Tone)*: Keep it tight. Funders skim. Use bolding for key points. Ensure the mathematical intuition is clear without needing equations in the summary.

      *(Refining the "Curve" argument)*: I need to be careful. $I \times T \times N$ is often justified as approximating marginal value ($MV$). If $MV \approx I \times T \times N$, and $N$ is inverse resources ($1/x$), then $MV \approx I \times T / x$. This implies a specific logarithmic or power-law structure. I should mention that the project investigates *which* structure justifies the heuristic.

      *(Final Polish of the Plan)*: Make sure Month 6 includes feedback from key stakeholders (EA researchers), not just writing.

