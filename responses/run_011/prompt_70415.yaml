  2.  **Deconstruct the Passage:**
      *   *Premise 1:* Judy starts with $P(N) = 1/2$, $P(S) = 1/2$.
      *   *Premise 2:* Conditional on $N$, equal credence in quarters ($Q_1, Q_2$). So $P(Q_1|N) = 1/2$.
