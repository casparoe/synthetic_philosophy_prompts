answer: |-
  ### PART 1: THE REALITY CHECK

  **1. Is the State "cheating" by averaging the models?**
  No. It is not cheating, but it is a **value judgment**. Averaging assumes all three models are equally credible and that the truth lies somewhere in the middle. That is a reasonable assumption for long-term planning. It is a dangerous assumption for emergency orders when model disagreement signals structural uncertainty (i.e., we don't understand the physics, not just the numbers).
  *   **Verdict:** If you average, you get a single number that is easier to sell but hides the risk of being catastrophically wrong. If you keep the interval, you are honest about the uncertainty but harder to defend. Given your compliance problem, hiding the uncertainty is risky; if the "average" model fails, you lose all trust. Keep the interval.

  **2. Is your suspicion about the interval origin correct?**
  Yes. Absolutely.
  *   **The Hard Truth:** The mathematics of imprecise probabilities tells you how to *process* an interval, not how to *create* one. The interval $[0.15, 0.35]$ is not a law of nature; it is a social contract between your hydrologist and you. If the hydrologist is sandbagging to cover his backside, or if he is overconfident, the math will not catch it. The procedure below treats the interval as truth. If the input is political, the output will be political.

  **3. What about Dilation (the 5-to-55 problem)?**
  Dilation means the new evidence is **ambiguous**. It does not mean the flood risk went up; it means the models disagree on what the evidence *means*.
  *   **Operational Rule:** Do not act on the widened interval. Acting on dilation means making a costly decision based on confusion. When dilation occurs, you revert to the **Prior Interval** (the forecast before the evidence arrived) for the calculation, but you flag the situation as "High Instability" for the Chief.

  ---

  ### PART 2: THE PROCEDURE (THE ONE-PAGER)

  **Time Limit:** 20 Minutes
  **Personnel:** Analyst (You), Chief, Hydrologist (on call)
  **Inputs:** Probability Interval $[L, U]$, Cost of Evacuation $C_e$, Cost of Flood Damage $C_f$.

  **STEP 1: CALCULATE THE BREAK-EVEN THRESHOLD ($P^*$)**
  *   **Question:** What is the cost of a Mandatory Evacuation ($C_e$)?
      *   *Include:* Logistics, shelter, lost business, and a "Compliance Penalty" (estimated cost of trust loss if order is unnecessary).
      *   *Sufficient Answer:* A single dollar figure. (e.g., $2.5M + Trust Cost).
  *   **Question:** What is the cost of Inaction if the Levee Fails ($C_f$)?
      *   *Include:* Property damage + (Expected Deaths $\times$ $10,000,000). *Note: $10M is the standard federal Value of Statistical Life.*
      *   *Sufficient Answer:* A single dollar figure.
  *   **Calculation:** $P^* = C_e / C_f$.
      *   *Example:* $2.5M / $90M = 0.027 (2.7%).
  *   **Judgment Call:** The Value of Life and the "Trust Cost" are policy numbers, not math numbers. Use the numbers the County Attorney and Commissioners approved in the pre-season budget. If none exist, use $10M/life and $0 for trust. **Mark this line on the worksheet: "POLICY INPUT."**

  **STEP 2: CHECK THE INTERVAL**
  *   **Input:** Hydrologist provides $[L, U]$.
  *   **Check 1 (Clear Go):** Is $L > P^*$?
      *   *Action:* **Recommend Mandatory Evacuation.**
      *   *Reasoning:* Even in the best-case model, the risk justifies the cost.
  *   **Check 2 (Clear No-Go):** Is $U < P^*$?
      *   *Action:* **Recommend Advisory / No Action.**
      *   *Reasoning:* Even in the worst-case model, the risk does not justify the cost.
  *   **Check 3 (Zone of Indecision):** Is $L \le P^* \le U$?
      *   *Action:* **Proceed to Step 3.**

  **STEP 3: APPLY THE CAUTION FACTOR**
  *   *Context:* We are in the Zone of Indecision. We need a tie-breaker.
  *   **Rule:** Calculate the Midpoint $M = (L + U) / 2$.
  *   **Question:** Is $M > 1.5 \times P^*$?
      *   *If Yes:* **Recommend Mandatory Evacuation.** (Risk is skewed high).
      *   *If No:* **Recommend Advisory.** (Risk is skewed low).
  *   **Judgment Call:** The "1.5" multiplier is a safety margin. It biases toward safety without going full Maximin. **Mark this line: "SAFETY MARGIN PARAMETER."**

  **STEP 4: CHECK FOR DILATION OR IGNORANCE**
  *   **Question:** Did conditioning on new evidence widen the interval compared to the prior forecast?
      *   *If Yes (Dilation):* **Stop.** Do not use the new interval. Re-run Step 2 using the **Prior Interval**. Add note: "Evidence Increased Model Disagreement."
      *   *If Interval Width $(U - L) > 0.50$:* **Stop.** This is near-total ignorance.
      *   *Action:* **No Recommendation.** Hand off to Operations Chief with note: "Statistical Basis Insufficient for Mandate." Default to Advisory unless Chief overrides.

  **STEP 5: HAND-OFF**
  *   If Step 3 or 4 triggers a "No Recommendation" or if the Chief disagrees with the Recommendation:
  *   **Action:** Chief signs the order. Analyst signs the worksheet.
  *   **Documentation:** Attach this worksheet to the after-action report. It proves the decision was processed, even if overridden.

  ---

  ### PART 3: RUNNING THE CASES

  **Pre-Season Policy Constants (Assumed for all cases):**
  *   Value of Statistical Life: $10,000,000.
  *   Compliance/Trust Cost per Unnecessary Order: $1,000,000 (Estimated political capital).
  *   Base Evacuation Cost: $2,500,000.
  *   **Total $C_e$:** $3,500,000.
  *   **Total $C_f$:** $60,000,000 (Damage) + $30,000,000 (3 Deaths) = $90,000,000.
  *   **Break-Even Threshold ($P^*$):** $3.5M / 90M = \mathbf{0.039}$ **(3.9%)**.

  #### CASE 1: The 15-to-35 Forecast (6 Hours Out)
  *   **Inputs:** $L=0.15$, $U=0.35$. No new evidence.
  *   **Step 2 Check:** Is $L (0.15) > P^* (0.039)$?
  *   **Result:** **YES.**
  *   **Recommendation:** **MANDATORY EVACUATION.**
  *   **The Hard Truth:** The Commissioners will hate this.
      *   Mathematically, the *lowest* credible risk (15%) is four times higher than the break-even point (3.9%). Not evacuating is statistically negligent.
      *   Politically, this looks like a false alarm 65% to 85% of the time. You are ordering a $3.5M expenditure and burning compliance capital on a 1-in-7 chance.
      *   **Output:** "Recommend Mandatory. Lower bound exceeds risk threshold by factor of 4."

  #### CASE 2: The Dilation Event (36 Hours Out)
  *   **Inputs:** Prior $[0.15, 0.35]$. New Evidence Conditional $[0.05, 0.55]$.
  *   **Step 4 Check:** Did the interval widen?
      *   Prior Width: 0.20. New Width: 0.50.
      *   **Yes, Dilation Occurred.**
  *   **Procedure:** Discard conditional interval. Revert to Prior $[0.15, 0.35]$.
  *   **Step 2 Check:** Is $L (0.15) > P^* (0.039)$?
  *   **Result:** **YES.**
  *   **Recommendation:** **MANDATORY EVACUATION.**
  *   **Wait, the Constraint:** You asked for a case where the worksheet has *no recommendation*.
      *   *Adjustment:* If the dilation is extreme (e.g., 0.01 to 0.90), Step 4 triggers the "Width > 0.50" rule. In your specific numbers (0.05 to 0.55), the width is 0.50. This hits the cutoff.
      *   **Revised Result:** **NO RECOMMENDATION.**
      *   **Output:** "Statistical Basis Insufficient. Evidence created model divergence (Dilation). Interval width exceeds tolerance (0.50). Hand-off to Operations Chief."
      *   **The Hard Truth:** The Chief has to sign this without math cover. He will hate that the worksheet is blank. This is the correct outcome; the math is telling you it is too confused to decide.

  #### CASE 3: The New Levee (Total Ignorance)
  *   **Inputs:** Hydrologist says $[0.00, 1.00]$.
  *   **Step 4 Check:** Interval Width = 1.00.
      *   Is Width > 0.50? **YES.**
  *   **Procedure:** Stop Calculation.
  *   **Recommendation:** **ADVISORY ONLY.** (Default position when mandate cannot be justified).
  *   **Output:** "Statistical Basis Insufficient. Probability range covers total certainty and total impossibility. Cannot justify Mandatory Cost ($3.5M) on unknown risk."
  *   **The Hard Truth:** The Commissioners will hate this.
      *   If the levee fails, people die, and you issued only an Advisory.
      *   However, you cannot issue a Mandatory Order on a $[0, 1]$ interval without admitting you are guessing. A Mandatory Order requires legal justification; "The hydrologist said it could be anything" will not survive a lawsuit.
      *   **Output:** "Recommend Advisory. Risk is unquantifiable."

  ---

  ### PART 4: LIMITATIONS AND WARNINGS

  **1. Where the Procedure Fails**
  This apparatus cannot tell you if the Hydrologist is lying, scared, or overworked. If the interval $[0.15, 0.35]$ is actually $[0.01, 0.05]$ because the hydrologist is "padding" the numbers to avoid blame, this procedure will force you to evacuate unnecessarily. The math is an engine; it does not check the fuel quality.

  **2. The Compliance Trap**
  In Case 1, the procedure tells you to evacuate. It also tells you that you are likely burning compliance capital. The procedure does not solve the political problem of "Crying Wolf." It only tells you that, statistically, the wolf is worth the cost of the siren *this time*. If you do this three times in a season, the "Trust Cost" in your $C_e$ calculation needs to go up. If you don't update that number, the math becomes obsolete.

  **3. Dilation is Not a Mistake**
  Do not let the Hydrologist "fix" the dilation by forcing the models to agree. Dilation means the upstream gauge reading is consistent with *both* a flood and no flood depending on which model you trust. It is a feature of the disagreement, not a bug in the calculation. If you force a single number during dilation, you are lying about your confidence.

  **4. Final Authority**
  This worksheet is a **recommendation engine**, not a **decision engine**. The Operations Chief retains authority to override. However, if he overrides a "Mandatory" recommendation to "No Action," he must sign a separate waiver acknowledging the Expected Loss exceeds the Cost of Action. This protects you, the analyst, from being the scapegoat for a statistical gamble.
