  ### Part 1: The Examination Question

  **PART B: POLITICAL PHILOSOPHY**
  **Answer the following question. (30 Marks)**

  **Question 4.**
  Consider a society $S$ divided into three representative positions, $P_1$ (least advantaged), $P_2$, and $P_3$. The table below shows the lifetime expectation of primary goods for each position under five feasible basic structures ($A$ through $E$).

  | Structure | $P_1$ | $P_2$ | $P_3$ |
  | :--- | :---: | :---: | :---: |
  | **A** | 10 | 11 | 12 |
  | **B** | 12 | 14 | 16 |
  | **C** | 12 | 30 | 60 |
  | **D** | 10 | 45 | 95 |
  | **E** | 9 | 60 | 140 |

  *(i)* Rank structures $A$ through $E$ according to the Difference Principle. Explain what determines this ranking. For each structure, state whether it is **fully just**, **less than perfectly just**, or **unjust**. Explain how your classification depends on whether the Principle is read as maximising the position of the worst-off or merely constraining departures from equality. **(10 marks)**

  *(ii)* Consider a variant structure $D^*$. In $D^*$, the expectations for $P_2$ and $P_3$ remain unchanged, but the group $P_1$ is revealed to consist of two equal-sized sub-groups: one with an expectation of 6 and one with an expectation of 14 (average 10). Rank $D$ against $D^*$ under the Difference Principle. What does this result show about the principle's concern with distribution *within* the least advantaged group? **(6 marks)**

  *(iii)* Apply a **leximin** rule to the five structures in the table. Does this yield the same ordering as the Difference Principle? Identify the exact rows where the two criteria come apart. Specify whether your comparison treats the table entries as representative positions or as individual persons, and note if this distinction alters the outcome. **(8 marks)**

  *(iv)* Does the table by itself settle whether structure **C** is a just arrangement? Explain whether you need further information about how the three positions hang together institutionally (e.g., chain connection) to make this determination. **(6 marks)**

  ***

  ### Part 2: Model Answer

  *(Note to Convenor: This answer is approximately 750 words. It models the precision required for full marks.)*

  **(i)** Under the standard interpretation of the Difference Principle, basic structures are ranked solely by the expectation of the least advantaged representative person ($P_1$). The ranking is: **B and C (tied first)** > **A and D (tied second)** > **E**. $B$ and $C$ are **fully just** because they maximise $P_1$'s expectation at 12. $A$, $D$, and $E$ are **unjust** because they fail to maximise the position of the worst-off; $P_1$ could be raised to 12 without lowering anyone below their current standing (moving to $B$ or $C$).

  However, if the principle is read merely as a **constraint** on a baseline of equality (inequalities are permitted *if* they benefit $P_1$, but $P_1$ need not be at the absolute maximum possible), then $A$ and $D$ might be classified as **less than perfectly just** rather than fully unjust, provided $P_1$ is better off than under strict equality. $E$ would remain unjust as $P_1$ falls below $A$ and $D$. The distinction turns on whether the principle commands the *best possible* outcome for the worst-off (maximising) or merely *some improvement* over equality (constraining).

  **(ii)** Under the Difference Principle, $D$ and $D^*$ are **ranked equally**. The principle operates on the expectation of the representative person in the least advantaged group, calculated as an average (10 in both cases). It does not register the internal inequality between the sub-groups in $D^*$ (6 vs 14). This shows that the Difference Principle is indifferent to distribution *within* the least advantaged group, provided the group's average expectation remains unchanged. It treats the representative position as a single metric, ignoring intra-group stratification.

  **(iii)** The **leximin** rule ranks structures by comparing the worst-off position first; if tied, it compares the second worst-off, and so on.
  *   **First comparison ($P_1$):** $B$ and $C$ (12) > $A$ and $D$ (10) > $E$ (9).
  *   **Second comparison ($P_2$):** Between $B$ and $C$, $P_1$ is tied (12). Leximin compares $P_2$: $C$ (30) > $B$ (14). Between $A$ and $D$, $P_1$ is tied (10). Leximin compares $P_2$: $D$ (45) > $A$ (11).

  **Divergence:** The Difference Principle is indifferent between $B$ and $C$, and between $A$ and $D$. Leximin breaks these ties, preferring $C$ over $B$ and $D$ over $A$. Thus, the **ordering is not the same**. Leximin produces a strict ordering ($C > B > D > A > E$), whereas the Difference Principle produces a partial ordering with ties.

  This comparison runs over **representative positions** ($P_1, P_2, P_3$), not individual persons. If we treated the entries as individuals, we would need population sizes to calculate total utility or specific individual rankings, which are not provided. However, since Rawls defines the principle over representative positions, the divergence holds regardless: Leximin is more sensitive to inequality among the better-off when the worst-off are indifferent.

  **(iv)** The table **does not** fully settle whether $C$ is just, even though it maximises $P_1$. We need to know whether the high expectations of $P_2$ and $P_3$ in $C$ (compared to $B$) are **necessary** to sustain $P_1$ at 12. If the institutional structure allows $P_1$ to remain at 12 while $P_2$ and $P_3$ are reduced (moving toward $B$), then the inequalities in $C$ are gratuitous. Rawls introduces **chain connection** and **close-knitness** to argue that typically, raising the highest expectations also raises the lowest. Without knowing the functional relationship between positions (the institutional "curve"), we cannot confirm if $C$'s inequalities are strictly required to benefit $P_1$. If they are not required, $C$ may violate the spirit of the principle even if it satisfies the metric.

