      *   Therefore, Char 2 lacks the virtue. Char 1 lacks the *strength* of the virtue.
      *   Wait, if Char 2 reports the secrets, he *is* lacking the virtue in action. The question is "lacking the virtue rather than merely prevented from showing it."
