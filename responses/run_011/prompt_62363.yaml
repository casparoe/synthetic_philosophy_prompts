answer: |-
  You are asking a question that sits at the intersection of moral philosophy and narrative craft. Your readers are fighting because they are arguing about two different definitions of character. One group defines character by **habit** (what the person consistently does), and the other defines it by **will** (what the person chooses when the rules change).

  To answer your specific question first: **Character 2 is the one who lacks the virtue.** Character 1 possesses the virtue but lacks the *fortitude* to sustain it without support. Character 2 never possessed the virtue; he possesses only an ideology that aligns with betrayal.

  Character 1 is a weak man who was propped up by a strong woman. When the prop vanished, he fell. This is a tragedy of weakness.
  Character 2 is a committed man whose commitment is to the State (or the Bishop) rather than the Soul. He does not feel the tension of the seal of confession because he does not believe in it. This is a tragedy of corruption.

  The "fact about a person" that settles this, which exists in fiction but not in real life, is **access to interiority.** In reality, we only judge by actions. In a novel, you have the power to show the *direction of the will* before the action occurs. The feeling of "cheating" arises when a character's internal landscape does not match their external reveal.

  Here is how you fix the reader quarrel at the level of scenes and sentences.

  ### 1. Revising Character 1 (The Weak Priest)
  **The Problem:** Readers feel cheated because they mistake his *circumstantial silence* for *moral strength*. When he breaks, it feels like a different person.
  **The Fix:** You must show that his silence is a **burden**, not a joy, long before the housekeeper dies. He should not appear holy; he should appear tired.

  *   **Scene Level:** In the first half of the novel, include a moment where a secret is told to him. Do not show him absorbing it with grace. Show him physically flinching. Show him looking toward the kitchen door where the housekeeper is, waiting for her to intervene.
  *   **Sentence Level:** When he keeps a confidence, describe it as a weight he is carrying, not a shield he is holding.
      *   *Current Impression:* "He kept the secret safely."
      *   *Revision:* "He locked the secret away, and felt his shoulders drop an inch, as if he had handed a heavy box to someone standing just behind him."
  *   **The Betrayal:** When he sells the secret in Chapter 10, the dominant emotion must not be greed or malice. It must be **relief**. The "astonishment" you mentioned is perfect, but frame it as the astonishment of a man who realizes the wall holding him up was made of paper.
      *   *Revision:* "He waited for the guilt to strike, the heavy blow he had braced for all week. Instead, there was only a lightness, a sudden absence of weight. He understood then that he had not been guarding the secret; the secret had been guarding him."

  ### 2. Revising Character 2 (The Ideological Priest)
  **The Problem:** Readers feel cheated because they assume his silence (in non-state matters) implies a belief in the sanctity of the seal. When he reports state secrets, they feel the contract was changed mid-game.
  **The Fix:** You must show that his silence in other matters is **professional**, not **sacred**. He keeps secrets because it is his job, not because it is his vow.

  *   **Scene Level:** You need a moment early on where he discusses the nature of trust. He should express a hierarchy of loyalties. He should speak about the Church or the State as an organism that is more important than the individual parishioner.
  *   **Sentence Level:** When he listens to a confession, describe his mind categorizing the information, not absorbing the pain.
      *   *Current Impression:* "He listened with compassion."
      *   *Revision:* "He listened with the precision of a clerk, filing the sin away in its proper cabinet, safe and separate from the man who spoke it."
  *   **The Report:** When he reports the state secret, there should be **no conflict**. If you write him hesitating, readers will think he is virtuous but forced. If you write him acting swiftly, they will see his true nature.
      *   *Revision:* "He did not struggle with the order. The order merely put into words what he had already decided the moment the penitent opened his mouth. The Bishop had not given him permission; he had given him procedure."

  ### 3. The "Fact" Beyond Action
  You asked if there is a fact about a person, over and above what they would do, that settles the answer. In the real world, philosophers debate this. In your novel, the answer is **regret**.

  *   **Character 1** grieves the housekeeper and would reinstate her screening. This proves he *wants* to be virtuous but cannot be so on his own. He is **morally dependent**.
  *   **Character 2** would report the secrets on his own authority if the order were rescinded. This proves he *wants* to betray the confidence. He is **morally aligned** with the betrayal.

  To stop the readers from fighting, you must make this distinction explicit in the text. You cannot leave it as subtext.

  *   **For Character 1:** Give him a moment of private prayer where he asks for strength he knows he doesn't have. This makes him sympathetic rather than fraudulent.
  *   **For Character 2:** Give him a moment where he justifies the betrayal as a "higher good." This makes him consistent rather than treacherous.

  ### Summary Advice
  The readers who say Character 2 is the "only one with character" are technically right in a literary sense: he has **agency**. Character 1 is a passenger in his own morality until the crash.

  If you want the novel to land cleanly:
  1.  **Character 1** must be framed as a man who **loves the good but cannot do it.** (Tragic)
  2.  **Character 2** must be framed as a man who **does the bad and calls it good.** (Villainous)

  If you clarify this distinction in their interior monologues *before* the betrayals occur, the readers will stop arguing about whether you cheated them. They will instead argue about which sin is worse: weakness or conviction. That is a debate you want them to have.
