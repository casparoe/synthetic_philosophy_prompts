answer: |-
  **1. Restatement and Load-Bearing Step**
  You argue that the "gains from trade" justification for compromise relies on a disagreement point (baseline) that is treated as a fixed parameter but is actually endogenous to institutional rules and strategic conduct. Because the baseline determines the existence and division of the surplus, and because the baseline is subject to moral assessment (e.g., is a threat permissible?), the bargaining framework conceals a substantive moral choice under the guise of a technical constraint.

  The load-bearing step is the move from "the baseline affects the solution" (a mathematical triviality) to "the baseline is a proper object of moral assessment" (a normative claim). §2's thesis follows only if you successfully show that treating the baseline as a *circumstance* rather than a *choice* is a philosophical error, not just a modelling simplification. You paper over this slightly in §3: the primary baseline (receiver clause) is institutional, not conduct-driven. The conduct-driven baseline only appears in Variation 2. You need to be clearer that institutional baselines are also "choices" (by the drafter of the deed), or else the argument rests entirely on the Variation 2 case of strategic threats.

  **2. Internal Consistency and Accuracy (§3)**
  The arithmetic is correct.
  *   **Frontier:** $u_B = 60 - 0.5u_A$.
  *   **Baseline 1:** (60, 15).
  *   **Nash:** Maximizes $(u_A-60)(u_B-15)$. Solution (75, 22.5). Gains 15 and 7.5. Correct.
  *   **KS:** Ideal point (120, 60). Line from (60, 15) to (120, 60) intersects frontier at (72, 24). Gains 12 and 9. Correct.
  *   **Equal Surplus:** (70, 25). Gains 10 and 10. Correct.
  *   **Variation 1:** (80, 20) lies on $20 = 60 - 0.5(80)$. Correct.
  *   **Variation 2:** New baseline (48, 15). Nash solution (69, 25.5). Gains 21 and 10.5. Correct.
  *   **Gain Ratio:** For a linear frontier $u_B = C - k u_A$, the Nash solution yields gains in ratio $1:k$ (relative to the axis of the first term). Here $k=0.5$, so $Gain_A / Gain_B = 1/0.5 = 2$. Correct.

  **Terminological Note:** You define "measured surplus" as the *sum* of utility gains (e.g., $15 + 7.5 = 22.5$). Standard bargaining theory defines the Nash solution as maximizing the *product* of gains. While your arithmetic is consistent with your definition, calling the sum "the surplus" in the context of the Nash solution is non-standard and may confuse readers expecting the product. It does not invalidate the argument, but it is imprecise.

  **3. The Rival Reading (Baseline as Fact)**
  §4 does not beg the question. The rival reading ("take the baseline as given") is a methodological stance, not a metaphysical one. Your Variation 2 demonstrates that if the theory treats the baseline as given *ex post*, it fails to regulate conduct *ex ante*. If the theory claims to justify compromise *normatively*, it cannot ignore that the "given" baseline was produced by normatively assessable actions (the injunction). The rival must revise to either (a) accept that some "gains" are morally tainted (which undermines the simple surplus justification) or (b) provide an independent account of admissible threats (which is your point in §5). You force the rival to admit that bargaining theory is not self-contained.

  **4. The Objection to §4(3)**
  The claim that the 2:1 ratio has "no moral standing" is vulnerable. A utilitarian would argue the ratio *is* moral because it reflects the objective good produced (health vs. stewardship).
  *   **Verdict:** The claim survives only if you emphasize the *incommensurability* premise in §3 ("Ara's value system registers only the first currency, Bram's only the second"). If the currencies are incommensurable, the exchange rate is a technical constraint of the feasible set, not a moral weighting of claims.
  *   **Weaker Version:** "The division ratio reflects the *technical substitutability* of the goods within the constraint, which is distinct from the *normative urgency* of the parties' claims." This avoids asserting the ratio has *no* moral standing, only that it lacks the *relevant* moral standing (urgency/rights) for a theory of compromise.

  **5. Assessment of §5 and §6**
  *   **Problem (a) Collapse:** This is fatal to the "gains from trade" *justification*. If the constraint works, moral agents face efficient baselines, leaving no surplus to divide. This proves your §7 conclusion: the work is being done by the constraint, not the surplus.
  *   **Problem (b) Scrupulousness Penalty:** Real.
  *   **Reciprocity Clause (§6):** Your suspicion that this is "extensionally equivalent" to the "permissible on both" rule is **incorrect**.
      *   *Intersection Rule:* Threat admissible iff permissible by A's values AND B's values. (A scrupulous, B unscrupulous $\rightarrow$ No threats allowed for anyone).
      *   *Reciprocity Clause:* B's threat admissible iff B would accept it holding A's values. (B holding A's values $\rightarrow$ No threats. So B cannot threaten). A's threat admissible iff A would accept it holding B's values. (A holding B's values $\rightarrow$ Threats OK. So A *can* threaten).
      *   **Result:** The Reciprocity Clause allows the scrupulous agent (A) strategic options the unscrupulous agent (B) lacks. It is not decorative; it inverts the Scrupulousness Penalty.
      *   **New Problem:** Why should A have *more* strategic options than B? This looks like a "moral license" for the virtuous to coerce the vicious. You need to decide if this is a feature or a bug. If it's a feature, §6 is not stuck; it's a substantive proposal. If it's a bug, the clause fails.

  **6. §2: Substance vs. Redescription**
  It is largely a redescription of the sensitivity of bargaining solutions to the disagreement point. A reader knowing bargaining theory will say, "Of course $d$ matters; that's why we model threat games."
  *   **Residue:** The genuine philosophical claim is that the *rhetoric* of "gains from trade" obscures this sensitivity to present compromise as Pareto-improving cooperation rather than contingent distribution.
  *   **Restatement:** "The 'surplus' is not a natural kind generated by agreement; it is an artifact of the chosen costs of disagreement." Frame §2 as a critique of the *justificatory work* the surplus is asked to do, not just a technical observation about variables.

  **7. Normative Smuggling**
  *   **"Creates nothing" (§4(2)):** This is the most significant smuggling. An injunction creates a *legal entitlement* and *bargaining leverage*. To say it creates "nothing" imports the premise that only health/land benefits count as value. This assumes the truth of Ara and Bram's substantive values to describe the strategic situation.
      *   **Correction:** "Creates no *intrinsic* social value, only distributive leverage."
  *   **"Fairness" (§1):** You use "fairness" to describe the division of the surplus before arguing that the surplus itself is morally compromised. This risks circularity if the surplus is tainted.
  *   **"Proper objects of moral assessment" (§2):** This is a premise, not a conclusion. You assume conduct producing baselines is assessable. A Hobbesian might deny this. You need to own this as a normative commitment.

  **8. Final Three**
  *   **Section to Cut:** The description of the Kalai–Smorodinsky solution in §3. It adds arithmetic bulk without advancing the argument beyond what the Nash solution and the Equal Surplus rule already demonstrate. Use the word count to expand §6.
  *   **Thesis Statement:** "The 'surplus' used to justify compromise is not a pre-political fact of cooperation but a moral artifact of the permissible costs of disagreement."
  *   **Verdict on §2:** True, but only if framed as a critique of the *rhetoric* of surplus. As a technical claim, it is trivial; as a meta-ethical claim about justification, it is substantial. Ensure the paper fights for the latter.
