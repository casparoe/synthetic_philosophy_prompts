prompt: |-
  Right, I need a referee. I spent four hours yesterday arguing with my friend Sam about the language of thought and neither of us moved, and he's got the sort of confidence that makes you doubt your own memory of things you've actually read. He did a philosophy degree a while back but works on ML now. Halfway through he laid out Fodor's position for me like this, and I've written it down as close to his words as I can:

  "Fodor's claim is that thinking is literally sentence-forming — there's a language in your head with its own vocabulary and grammar, structurally just like English or whatever natural language you happen to speak, and a thought is a string in it that gets manipulated mechanically according to its shape rather than its meaning. And becasue you can't learn your first symbols without already having symbols to do the learning with, he had to say we come pre-loaded with basically all of it, which he apparently didn't blink at. Then the connectionists turned up with networks that had no symbols in them at all, and he and Pylyshyn said those networks couldn't be systematic — if you can think aRb you can think bRa, and distributed representations can't manage that. So the whole thesis was propped up by arguing that anything that thinks at all has to be systematically recombinant. Now the large models exist: they generate perfectly systematic behaviour with no symbols anywhere inside them, and they picked their concepts up from data, so both halves of the argument are dead."

  I'm honestly inclined to agree with him on the last bit. But a couple of things itched — the "just like English" part sounds like a strawman, and the pre-loaded bit sounds deranged yet I have a sneaking suspicion it's exactly what Fodor held and he just owned it.

  Can you take it sentence by sentence and tell me which parts a philosopher of mind working on this would accept as a fair gloss, which are common simplifications that quietly change the content, and which are just wrong? Then tell me whether his conclusion survives the correction — specifically, is the systematicity argument even a claim about what's going on inside a modern network, or is it a claim at a different level that a network could be true of without it being refuted? And if I'm wrong about the LLM point, say so. No bibliography or reading list please, I just want the audit and the reasoning behind it. British English.
