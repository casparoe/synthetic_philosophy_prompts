prompt: |-
  I direct the social-norms portfolio at a mid-sized international NGO. Roughly twice a year our country teams send us six to ten proposals aimed at practices that cause serious harm but are sustained locally by social standing rather than by law or by explicit moral endorsement: an initiation rite that includes the cutting of girls, adolescent marriage arranged by families, and public accusation and violence directed at women suspected of sexual contact outside marriage. Budgets range from about fifty thousand to two million dollars, the practices affect thousands of people, and a badly designed intervention can make things worse by restoring standing to the very practice we are attacking. Our board signs off on each cycle from a written rationale, and our field staff have no training in moral philosophy.

  The literature I keep returning to suggests our default approach is mistaken. We fund awareness work and moral persuasion on the assumption that a practice ends once people are convinced it is unjust. The writing on honor-driven moral change points elsewhere: Kwame Anthony Appiah's account of dueling, footbinding, and the British abolition of the slave trade emphasizes how honor is allocated, whether an honorable alternative is actually available, and what it takes for a practice to become something people cannot take seriously; Bernard Williams's suggestion is that practices of this kind are typically not so much refuted as discredited, ending when the social standing that made them something a serious person would do drains away. I want a decision procedure built on that rather than on the persuasion model, and I want it usable by people who have never read either author.

  Please write the procedure itself: the questions to ask in order; what counts as a sufficient answer at each step; what observable evidence a field team can realistically gather to support each answer; where the procedure terminates in a no-fund or not-yet verdict; and where it must hand the decision to a person because the question is evaluative rather than factual — for instance, whether a proposed substitute rite is genuinely a different practice or the same practice with the harm removed, and whose judgment about honor counts. Say explicitly which distinctions from the theory have to survive the simplification and which can be dropped, what a team should do when the evidence at a step is simply unavailable, and where you expect the procedure to misfire.

  Then run it on three proposals now in front of us. First, funding an alternative coming-of-age ceremony that preserves the seclusion, the feast, and the public recognition while removing the cutting. Second, a district-level program pairing cash transfers and household debt relief with a collective public commitment from elders to stop arranging marriages for girls under sixteen. Third, a national media campaign — already announced with a named donor, and our largest single line item for the year — that publishes the names of practitioners and lobbies for a new criminal penalty. Give the verdict for each together with the reasoning the board would read, and do not soften the third if the procedure says stop.

  Finally, tell me what the procedure cannot do: which judgments it merely relocates rather than settles, what it quietly assumes about our standing to intervene, and how I would know after the fact whether a change we funded was caused by us.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Director of Social-Norms Portfolio at a mid-sized international NGO.
      *   **Context:** Funding proposals (6-10 per cycle) targeting harmful social practices (FGM/C, child marriage, honor violence). Budgets \$50k-\$2M. High stakes (backfire risk).
      *   **Problem:** Current approach (awareness/moral persuasion) is flawed according to literature (Appiah, Williams). Need a decision procedure based on *honor/standing* rather than *moral truth*.
      *   **Constraints:** Field staff have no philosophy training. Needs to be actionable, specific, and include evidence requirements. Must identify where human judgment is needed vs. factual checks. Must identify limitations/failure points.
      *   **Task 1:** Write the Decision Procedure (questions, evidence, termination points, hand-offs).
      *   **Task 2:** Apply the procedure to three specific proposals (Alternative Rite, Cash+Elders, Naming/Shaming Campaign).
      *   **Task 3:** Explain limitations (what it can't do, assumptions, attribution problems).
      *   **Tone:** Professional, rigorous, direct, unsentimental (especially regarding the third proposal).

  2.  **Deconstruct the Theory (Appiah/Williams):**

      *   *Core Insight:* Practices persist due to *honor/standing*, not just ignorance or immorality. People do them to be respected/avoid shame.
      *   *Mechanism of Change:* Practices end when they lose *credibility* or *status*, not necessarily when people agree they are "wrong." An honorable alternative must exist. Coordination is key (everyone needs to stop for it to be safe to stop).
      *   *Key Distinctions to Keep:*
          *   Honor/Standing vs. Moral Belief.
          *   Coordination/Equilibrium vs. Individual Choice.
          *   Discrediting vs. Refuting.
          *   Availability of Honorable Alternatives.
      *   *Distinctions to Drop:* Nuanced metaphysical definitions of "honor," deep historical genealogy of the practice, complex game-theory modeling.

  3.  **Drafting the Decision Procedure (The "Honor-Status Filter"):**

      *   *Goal:* A step-by-step checklist for field staff.
      *   *Structure:* Sequential gates. Fail one = Stop/Redesign.
      *   *Step 1: The Honor Diagnostic.* Is this actually driven by standing? (Evidence: What happens if you don't do it? Shame? Exclusion?)
      *   *Step 2: The Coordination Check.* Can individuals stop safely? (Evidence: Do people say they want to stop but fear neighbors?)
      *   *Step 3: The Alternative Availability.* Is there a way to get the honor *without* the harm? (Evidence: Is the substitute recognized by the same people who grant status?)
      *   *Step 4: The Discrediting Strategy.* Does the intervention lower the status of the practice or just argue against it? (Evidence: Are respected figures abandoning it? Is it being mocked or treated as "backward"?)
      *   *Step 5: The Backfire Risk.* Will this make the practice more defiant/central? (Evidence: Does external pressure trigger identity defense?)
      *   *Hand-off Points:* Where philosophy/judgment is needed (e.g., Is the alternative *really* honorable?).

  4.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1: Alternative Coming-of-Age (Cutting removed, rest kept).*
          *   *Analysis:* Fits Appiah's "honorable alternative." Keeps the standing (feast, recognition) but removes harm.
          *   *Verdict:* Fund (with conditions on elder buy-in).
      *   *Proposal 2: Cash + Elder Commitment (Child Marriage).*
          *   *Analysis:* Addresses the economic driver *and* the coordination problem (elders committing together). Cash makes the alternative viable; collective commitment solves the safety issue.
          *   *Verdict:* Fund.
      *   *Proposal 3: Naming/Shaming + Criminalization (National Media).*
          *   *Analysis:* High risk. Public accusation often reinforces in-group solidarity (martyrdom). Criminalization without social shift drives it underground. Violates the "Discrediting" principle (shaming individuals often hardens identity).
          *   *Verdict:* Do Not Fund (Stop). This needs to be hard-hitting.

  5.  **Drafting the Limitations Section:**

      *   *Relocated Judgments:* We still need someone to decide what counts as "honor."
      *   *Assumptions:* Assumes the NGO has legitimacy to intervene. Assumes local actors are rational about status.
      *   *Attribution:* Hard to know if *we* caused the change or if it was broader social drift.

  6.  **Refining and Polishing:**

      *   *Tone Check:* Ensure it sounds like an internal NGO document/procedure manual. Professional, clear, authoritative.
      *   *Theory Check:* Ensure Appiah/Williams concepts are accurately translated into operational questions (e.g., "script" vs. "belief").
      *   *Constraint Check:* Did I answer where the procedure misfires? Did I specify evidence types? Did I handle the third proposal strictly?

      *(Self-Correction during drafting)*: I initially thought about making the procedure very long. I need to keep it usable for non-philosophers. I should condense the steps into clear "Gates." I need to make sure the "Hand-off" points are explicit—where the field staff must call HQ.
      *   *Refining Proposal 3:* The prompt says "do not soften the third if the procedure says stop." I need to be very firm here. Naming and shaming in honor cultures often backfires by making the practice a badge of resistance.
      *   *Refining the Theory:* Appiah emphasizes *scripts*. People follow scripts. To change the script, you need a new script that offers the same social reward. Williams emphasizes *ethical confidence*—when a practice becomes unthinkable. The procedure needs to test for "unthinkability" or at least "loss of prestige."

  7.  **Final Review against Prompt:**
      *   Procedure written? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Evidence specified? Yes.
      *   Termination points? Yes.
      *   Hand-off points? Yes.
      *   Distinctions kept/dropped? Yes.
      *   Misfire points? Yes.
      *   Three proposals run? Yes.
      *   Verdicts + Board Reasoning? Yes.
      *   Limitations section? Yes.

  8.  **Final Polish:** Check for clarity and impact. (Proceed to generate output).

  *(Self-Correction on "Hand-off"):* I need to be specific about *who* makes the judgment. The prompt asks "whose judgment about honor counts." I should specify that local gatekeepers define honor, but the NGO defines "harm." The tension there is a hand-off point.

  *(Self-Correction on "Evidence"):* Make sure the evidence is *observable*. Not "ask people if they feel honor," but "observe who gets invited to councils," etc.

  *(Self-Correction on Proposal 3):* Ensure the reasoning cites the specific failure in the procedure (Step 4/5 mostly).

  Let's assemble the response.cw
answer: |-
  # The Honor-Status Filter: A Decision Procedure for Social-Norms Interventions

  **Purpose:** To prevent funding interventions that rely on moral persuasion alone and to prioritize interventions that alter the honor-equilibrium sustaining harmful practices.
  **Users:** Field Program Officers (no philosophy training required).
  **Authority:** Final funding decisions require passing all Gates. Failure at any Gate triggers a "No-Fund" or "Redesign" verdict unless a specific Hand-Off is invoked.

  ---

  ## Part I: The Procedure

  ### Gate 1: The Honor Diagnostic
  **Question:** Is the practice sustained primarily by social standing (honor/shame) rather than by economic necessity or legal coercion?
  **Sufficient Answer:** Yes, if failing to perform the practice results in measurable social loss (exclusion from marriage markets, loss of voice in councils, public shaming) even when no money is lost.
  **Required Evidence:**
  *   **Testimonials:** At least 10 interviews with practitioners who express reluctance but cite "what people will say" or "respect" as the barrier to stopping.
  *   **Observation:** Documentation of social sanctions (e.g., a family that refused the practice was not invited to a key community event).
  *   **Negative Evidence:** If the primary driver is identified as direct cash income (e.g., bride price is the *only* reason), this procedure stops. Use an economic intervention protocol instead.
  **Termination:** If **No**, do not fund under this portfolio.
  **Hand-Off:** If the driver is mixed (honor + economics), proceed but flag for HQ review on Gate 2.

  ### Gate 2: The Coordination Check
  **Question:** Can an individual family stop the practice safely without a group agreement?
  **Sufficient Answer:** No. (If the answer is Yes, the practice is likely preference-based, not norm-based, and standard awareness campaigns may work. If the answer is No, it is a coordination problem requiring this procedure).
  **Required Evidence:**
  *   **Hypothetical Survey:** "If your neighbors stopped this practice, would you stop?" If >60% say "Yes," it is a coordination problem.
  *   **Safety Audit:** Reports of violence or ostracization against early adopters who stopped without community cover.
  **Termination:** If **Yes** (individuals can stop safely), this is an education issue, not a norms issue. Redirect to education budget.
  **Hand-Off:** None.

  ### Gate 3: The Honorable Alternative
  **Question:** Does the proposal provide a substitute action that grants equivalent social standing without the harm?
  **Sufficient Answer:** Yes, if the substitute preserves the *public script* (feast, ceremony, declaration) but removes the *harmful act*, AND is validated by the same people who grant status.
  **Required Evidence:**
  *   **Gatekeeper Endorsement:** Signed or recorded support from the specific local figures who confer honor (elders, religious leaders, matriarchs), not just government officials.
  *   **Script Match:** A side-by-side comparison showing the alternative retains the public visibility of the original practice.
  **Termination:** If **No** (the alternative is private, secret, or lacks public recognition), do not fund. It will not compete for honor.
  **Hand-Off:** **CRITICAL.** Field staff cannot judge if the alternative is "genuinely different" or "the same practice with harm removed." This must be reviewed by the Regional Director + one external cultural anthropologist. They must certify the substitute is not a "sham" that will be quietly bypassed.

  ### Gate 4: The Discrediting Mechanism
  **Question:** Does the intervention lower the social status of the practice, or does it merely argue it is morally wrong?
  **Sufficient Answer:** The intervention associates the practice with *low status* (backward, uneducated, poor, ridiculous) rather than *evil*.
  **Required Evidence:**
  *   **Messenger Audit:** Are the messengers people the target audience aspires to be? (e.g., successful farmers, respected elders).
  *   **Framing Check:** Materials must not use language of "sin" or "crime" primarily. They must use language of "progress," "modernity," or "superior status."
  *   **Mockery Test:** Is there an element of making the old practice seem laughable or outdated? (Appiah's "cannot take seriously").
  **Termination:** If the campaign relies on shame, guilt, or legal threat without status reallocation, do not fund.
  **Hand-Off:** If the campaign involves public shaming of individuals, this must be escalated to the Board. (See Warning on Backfire).

  ### Gate 5: The Backfire Risk
  **Question:** Will external pressure make the practice a badge of identity or resistance?
  **Sufficient Answer:** No, if the intervention is framed as an internal evolution rather than an external imposition.
  **Required Evidence:**
  *   **Ownership Metric:** Who is speaking in the media materials? If >50% of voices are international/foreign, risk is High.
  *   **Identity Check:** Is the practice tied to resistance against a historical oppressor? If yes, external pressure will harden the norm.
  **Termination:** If Risk is **High**, do not fund.
  **Hand-Off:** If the intervention involves criminalization, this must be escalated to Legal + Board.

  ---

  ## Part II: Theoretical Simplifications

  **Distinctions Retained:**
  1.  **Honor vs. Morality:** We do not ask if the practice is wrong (we assume it is). We ask if it is *prestigious*.
  2.  **Coordination vs. Choice:** We assume individuals cannot stop alone even if they want to.
  3.  **Discrediting vs. Refuting:** We aim to make the practice *unfashionable*, not logically disproven.

  **Distinctions Dropped:**
  1.  **Internal vs. External Validity:** We do not require field staff to distinguish between "shame" and "guilt" psychologically. We look only at behavioral sanctions.
  2.  **Historical Genealogy:** We do not require a history of *why* the honor script started, only *who* controls it now.
  3.  **Moral Agency:** We treat participants as following scripts, not making free moral calculations.

  **Missing Evidence Protocol:**
  If evidence for a Gate is unavailable (e.g., cannot interview practitioners safely):
  1.  Proxy with qualitative data from neighboring districts.
  2.  If proxies are unavailable, the default verdict is **No-Fund**. We do not gamble on norms without data.

  **Expected Misfires:**
  1.  **The "Sham" Alternative:** Local leaders may endorse an alternative rite (Gate 3) publicly but privately signal that the harm is still required. The procedure relies on the Hand-Off anthropologist to catch this.
  2.  **Elite Capture:** "Respected figures" (Gate 3) may use the intervention to consolidate power, changing the norm in a way that harms a different subgroup.
  3.  **The "Martyr" Effect:** Gate 5 is the weakest. It is hard to predict when external pressure will trigger defiance.

  ---

  ## Part III: Application to Current Proposals

  ### Proposal 1: Alternative Coming-of-Age Ceremony
  *   **Description:** Preserves seclusion, feast, public recognition. Removes cutting.
  *   **Procedure Run:**
      *   Gate 1 (Honor): **Pass.** Seclusion and feast are status markers.
      *   Gate 2 (Coordination): **Pass.** Families fear daughters will be unmarriageable if they skip the rite entirely.
      *   Gate 3 (Alternative): **Pass/Hand-Off.** The script is preserved. *Hand-Off Required:* Anthropologist must verify elders will truly recognize the "uncut" rite as equal status.
      *   Gate 4 (Discrediting): **Pass.** Framing is "modern tradition," not "abandoning culture."
      *   Gate 5 (Backfire): **Low Risk.** Internal leadership.
  *   **Verdict:** **FUND (Conditional).**
  *   **Board Reasoning:** This proposal correctly identifies the practice as an honor-script rather than a moral belief. By retaining the public markers of status (feast, seclusion) while removing the harm, it offers a viable coordination equilibrium. Funding is contingent on independent verification that local gatekeepers view the alternative rite as conferring equal marriageability.

  ### Proposal 2: Cash Transfers + Elder Commitment (Child Marriage)
  *   **Description:** Debt relief for households; public collective pledge by elders to stop marriages <16.
  *   **Procedure Run:**
      *   Gate 1 (Honor): **Pass.** Marriage alliances are about status and debt settlement.
      *   Gate 2 (Coordination): **Pass.** Individual families cannot stop if neighbors continue (daughters become "leftovers").
      *   Gate 3 (Alternative): **Pass.** The "collective pledge" acts as the honorable alternative script. Cash makes the alternative economically viable.
      *   Gate 4 (Discrediting): **Pass.** Elders leading the change signals that *stopping* is the new honorable act.
      *   Gate 5 (Backfire): **Low Risk.** Driven by internal elders, not external law.
  *   **Verdict:** **FUND.**
  *   **Board Reasoning:** This addresses the two main barriers to norm change: economic risk and coordination failure. The cash transfer removes the economic necessity, while the collective elder commitment solves the safety problem, allowing families to stop without losing standing. It aligns with the "honorable alternative" model by making the *cessation* of the practice a public, status-conferring act.

  ### Proposal 3: National Media Campaign (Naming/Shaming + Criminalization)
  *   **Description:** Publish names of practitioners; lobby for new criminal penalties. Largest line item. Donor already named.
  *   **Procedure Run:**
      *   Gate 1 (Honor): **Pass.** Practices are honor-driven.
      *   Gate 2 (Coordination): **Pass.**
      *   Gate 3 (Alternative): **Fail.** No alternative offered. Only punishment.
      *   Gate 4 (Discrediting): **Fail.** Public shaming of individuals in honor cultures often creates martyrs and solidifies in-group loyalty. It attacks the *person*, not the *prestige of the practice*.
      *   Gate 5 (Backfire): **High Risk.** External pressure + criminalization drives practice underground and frames it as resistance against state/foreign interference.
  *   **Verdict:** **DO NOT FUND.**
  *   **Board Reasoning:** This intervention violates the core findings of honor-based norm change. Publicly naming practitioners in a context where honor is paramount will not discredit the practice; it will likely elevate the practitioners to martyr status, reinforcing the practice as a badge of identity against external aggression. Criminalization without prior social consensus drives harmful practices underground, making monitoring impossible and increasing risk to victims. Despite the donor commitment, funding this contradicts our evidence-based portfolio strategy and risks active harm. The proposal must be withdrawn or completely redesigned to focus on status reallocation rather than punishment.

  ---

  ## Part IV: Limitations of the Procedure

  **1. Relocated Judgments:**
  This procedure does not eliminate the need for philosophical judgment; it relocates it.
  *   **Who defines "Harm"?** The procedure assumes the NGO knows the practice is harmful. It does not help if the community views the "harm" (e.g., cutting) as essential for spiritual safety. The Hand-Off at Gate 3 attempts to manage this, but the tension remains.
  *   **Whose Honor Counts?** The procedure asks staff to identify "gatekeepers." In complex societies, honor is fragmented. Empowering one group of elders to change a norm may disempower women or youth. The procedure optimizes for *effectiveness*, not necessarily *democratic legitimacy*.

  **2. Assumptions About Standing:**
  The procedure assumes the NGO has the standing to intervene without triggering a "colonial" backlash (Gate 5). It assumes local actors are rational about status. It cannot account for deep theological or metaphysical beliefs where the "honor" is derived from God/Ancestors rather than the living community. If the audience believes the practice is required for salvation, status manipulation will fail.

  **3. Attribution Problems:**
  You will not know if *you* caused the change.
  *   **The Drift Problem:** Social norms often change due to urbanization, internet access, or economic shifts unrelated to your project.
  *   **The Measurement Trap:** You can measure the *practice* (rates of cutting/marriage), but you cannot easily measure the *honor equilibrium*. A drop in rates might mean the norm has changed, or it might mean the practice has gone underground (especially after Gate 5 failures).
  *   **Post-Hoc Verification:** To know if you caused the change, you would need a counterfactual (a control district). Even then, you are measuring behavior, not the underlying "unthinkability" Williams describes. You will know you succeeded only when the practice becomes something a "serious person" no longer does, which is a judgment call, not a metric.

  **4. The "Stop" Decision:**
  This procedure is designed to say "No" more often than your current model. It will conflict with donor expectations (see Proposal 3). It requires the Director to defend *inaction* as a moral good (preventing harm) rather than a programmatic failure.
