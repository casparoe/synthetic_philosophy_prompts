  **MEMORANDUM**

  **TO:** Conservation Area Appraisal Panel
  **FROM:** Chair, Appraisal Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Kestrel Row Cumulative Review and Shopfront Application

  **1. Purpose and Deadline**

  This memorandum sets out my recommendation for the cumulative review of the Kestrel Row Conservation Area designation, triggered by the residents' petition. We are required by ordinance to reach a decision within fourteen weeks. Separately, we must determine the application regarding the last original timber shopfronts within six weeks. Given the panel's current division, this memo proposes a framework to resolve our philosophical impasse and a concrete course of action.

  **2. The Vagueness Problem and the Invariance Rule**

  Our disagreement stems from the vagueness of "substantially eroded." Member A argues for an epistemic view: there is a fact of the matter we simply cannot know. Member B proposes an invariance rule grounded in supervaluationism: we should only withdraw designation if withdrawal is correct on *every* admissible way of making "substantially eroded" precise. She argues that in borderline cases, there is no truth to be had, and deferral avoids error.

  I recommend we adopt a **Teleological Supervaluationist** account. This accepts Member B's logic—that we should look for truth across admissible precisifications—but rejects her assumption about what makes a precisification "admissible."

  Member B's concern is that we should not act arbitrarily in borderline zones. This is valid. However, her rule risks paralysis in cumulative cases. If we treat every past approval as narrowing the range of admissible precisifications, we face an endogeneity problem: our past leniency defines future boundaries. Eventually, the only "admissible" precisification would be one where nothing short of total demolition counts as erosion. This renders the ordinance self-defeating.

  To resolve this, we must constrain "admissible precisifications" not by our past administrative consistency, but by the **purpose of the ordinance**: the preservation of special character. A precisification that allows the total loss of character through incremental steps is inadmissible because it contradicts the legislative goal. Therefore, past approvals of individual alterations are evidence of what was considered harmless *then*, but they do not legally bind the definition of "substantial erosion" *now* if the cumulative result violates the ordinance's purpose. This allows us to accept the invariance rule without being trapped by our own history.

  **3. Recommendation: Retention with Removal of Permitted Development Rights**

  I recommend we **retain the designation** but simultaneously **remove the permitted-development rights** currently allowing minor alterations without consent.

  Withdrawal is inappropriate. With 22 of 63 properties substantially unaltered, the claim that character is "substantially eroded" is not true on all admissible precisifications consistent with preservation. However, retention unchanged is equally untenable. The survey data (31 non-original windows, 19 rendered facades) shows a clear trajectory toward erosion. To do nothing is to accept Member A's fear: that borderline inaction licenses further loss.

  By removing permitted-development rights, we halt the cumulative process without admitting the character is already lost. This satisfies the invariance requirement (withdrawal is not *required* on all precisifications) while addressing the epistemic concern (we are not ignoring the risk).

  **Timetable:**
  *   **Weeks 1–4:** Public consultation on the proposed removal of permitted-development rights.
  *   **Weeks 5–8:** Drafting of specific Article 4 Direction (restrictions) based on survey data.
  *   **Weeks 9–12:** Panel review of draft restrictions and final cumulative review determination.
  *   **Weeks 13–14:** Formal notice of decision and issuance of order.

  **4. The Shopfront Application**

  The application to replace the last surviving pair of original timber shopfronts must be decided within six weeks. We cannot defer this pending the cumulative review.

  I recommend **refusal**. This decision should not depend strictly on the outcome of the designation review. Even if the area retains designation, the loss of the *last* original pair constitutes material harm in itself. Under our teleological account, a precisification of "character" that allows the extinction of a unique surviving feature is inadmissible. The applicant's request for certainty is met by this refusal; certainty does not require approval, it requires a decisive ruling. We must signal that while cumulative erosion is managed via the designation review, individual keystones remain protected immediately.

  **5. Future Guidance and Commitments**

  Adopting this account commits the panel to a dynamic view of character. We acknowledge that "substantial erosion" is not a static line but a threshold relative to the preservation goal. When the next cumulative case arrives, we commit to evaluating whether the *trend* violates the ordinance's purpose, regardless of whether individual steps were previously approved.

  To prevent future ambiguity, I propose the following decision rule be written into officer guidance for triggering cumulative reviews:

  > **Cumulative Impact Trigger:** A cumulative review shall be initiated automatically when officer surveys record that more than 30% of properties within a designated area have undergone alterations to key character-defining elements (facades, rooflines, windows) identified in the original designation report, or where any single character-defining element type falls below 20% survival rate across the area.

  This rule allows officers to act without consulting the panel on the *trigger*, ensuring we do not drift into borderline zones unnoticed. It objectifies the "substantial" threshold based on survival rates rather than subjective impressions.

  **6. Conclusion**

  This approach respects the logic of the invariance rule while correcting its inputs to avoid the endogeneity trap. It protects the remaining character of Kestrel Row without prematurely abandoning the designation. I ask the panel to consider this framework during our session next week.
