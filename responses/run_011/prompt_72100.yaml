answer: |-
  **Verisimilitude Standards Agency (VSA)**
  **Methodology Handbook for Truthlikeness Assessment (v4.2)**

  **1. Methodological Framework**
  The VSA assesses the proximity of propositional structures to actual states of affairs. The original Content-Difference Model (CDM-1), which graded theories by subtracting the content of false consequences from the content of true ones, was deprecated following the 2008 Equivalence Incident. It was observed that under CDM-1, all false theories possess equal falsity content, rendering comparative ranking impossible. While CDM-1 remains available for legacy contracts, current issuances utilise the Possible-World Similarity Metric (PWSM).

  Under PWSM, ratings reflect the aggregate similarity of worlds in which the theory holds to the actual world. This requires the Committee to weight respects of similarity. For instance, in assigning a rating to a celestial mechanics theory, the Committee must decide whether a deviation in planetary count constitutes a heavier penalty than a deviation in orbital velocity. As the penalty weight depends on the actual configuration of the solar system, and the actual configuration is the variable being tested, the Committee employs a proxy weighting based on prior consensus models. This ensures continuity despite the circularity inherent in defining similarity without access to the target.

  **2. Scale and Degenerate Cases**
  As no theory has been demonstrated to correspond perfectly with reality, the AAA (Absolute) rating remains theoretical. Clients pricing instruments backed by AAA-rated theories should model cash flows based on the AA+ ceiling. The upper rungs of the scale are permanently unpopulated; this is a feature of the methodology, not a market failure.

  Degenerate cases are treated as follows: Self-contradictory theories entail all propositions and are maximally informative but logically untenable; these are assigned a 'D' (Default) rating. Tautologies entail no empirical content and cannot be falsified; these are assigned 'NR' (No Risk), reflecting safety but zero yield. Investors seeking exposure to empirical risk should avoid NR-rated instruments.

  **3. Relevance and Commercial Arrangements**
  Assessments are conducted on relevant consequences only. Relevance determinations are submitted by the Theory Sponsor during the mandate phase. The VSA accepts determinations from accredited institutional sponsors; independent challenges are not permitted. Ratings are issued on an issuer-pay basis. To maintain market liquidity, the VSA accommodates competitive mandate allocation, though concurrent rating shopping is discouraged.

  Commercial products include the Veri-Track Index, a tracker fund weighting assets by VSA scores. Note that during the Q3 2023 rebalancing, a downgrade was issued post-index inclusion following an unexpected observational anomaly, resulting in temporary dislocation. Sponsors are advised that timely disclosure of falsifying evidence is critical to maintaining index eligibility.

  **4. Limitations and Appeals**
  The VSA does not warrant the accuracy of any rating. Verification of a rating requires access to Ground Truth, which is unavailable to the Agency. Consequently, ratings are unauditable. The Agency assumes no liability for losses arising from the assumption that a rated theory is true. Appeals against ratings must be accompanied by definitive proof of Truthlikeness. As such proof constitutes the object of the assessment rather than the input, no appeal has ever been successful.

  **Appendix A: Rating Scale**

  | Grade | Definition | Status |
  | :--- | :--- | :--- |
  | AAA | Absolute Correspondence | Theoretical |
  | AA+ to AA- | High Truthlikeness | Investable |
  | BBB+ to BBB- | Moderate Truthlikeness | Investable |
  | BB+ to B- | Speculative Truthlikeness | High Risk |
  | CCC to C | Low Truthlikeness | Distressed |
  | D | Contradictory | Default |
  | NR | Tautological | No Risk |

  **Appendix B: Selected Case Histories**

  1.  **Unified Flux Model (UFM-4):** Upgraded from BBB to AA- following successful prediction of particle decay rates. Sponsor: Helios Institute.
  2.  **Dark Sector Interaction Hypothesis:** Downgraded from A to BB following unexpected null results at the Large Collider. Sponsor: Quantum Dynamics Ltd.
  3.  **Static Field Theory:** Placed on Negative Watch indefinitely pending resolution of horizon anomalies. Sponsor: Private Trust.
