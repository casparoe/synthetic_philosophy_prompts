answer: |-
  **Proposal Title:** The Arrival Condition: Conceptualizing a Positive Duty to Transport in Asylum Ethics

  **1. Research Questions**
  This project disentangles three nested questions regarding the "presence requirement" in asylum regimes:
  1.  **Conceptual:** Is physical presence a constitutive element of the moral right to asylum, or is it a contingent administrative barrier?
  2.  **Normative:** If the right to protection is universal, does it entail a correlative positive duty on states to facilitate access (a "right to be brought") for those unable to travel?
  3.  **Institutional:** If such a duty exists, does the inability to reach a border trigger a universal obligation among capable states, or does it default to specific agents?

  *Primary Focus:* For a 7,000-word limit, the paper will prioritize questions 1 and 2. Question 3 will be treated as a limiting case to test the coherence of the duty, rather than a full allocation model.

  **2. Intervention & Literature Gap**
  Current migration ethics debates operate *within* the arrival paradigm.
  *   **Non-refoulement:** Establishes a negative duty (do not return) but presupposes the claimant is already within jurisdiction. It offers no remedy for those who cannot reach jurisdiction.
  *   **Fair Distribution/Quotas:** Debates focus on how to share the burden of refugees *after* they have moved or are in camps. They accept the sorting mechanism of "who made it" rather than challenging its fairness.
  *   **Resettlement:** Treated in literature as humanitarian discretion or "surrogate protection." It is framed as a gift, not a claim-right.
  *   **Extraterritorial Jurisdiction:** Legal scholarship focuses on when state control extends abroad (e.g., interdiction at sea). This is reactive and legalistic, failing to address the prior moral obligation to enable access.

  **Gap:** None of these positions challenge the moral legitimacy of the arrival condition itself. This project argues that if asylum is a human right, the impossibility of claiming it due to mobility constraints renders the right fictitious for the most vulnerable.

  **3. Methodology (6-Week Plan)**
  This is a purely conceptual project using normative analysis and counterfactual reasoning. Empirical data on who travels is irrelevant to the *moral validity* of the requirement; textual analysis of the 1951 Convention is irrelevant to the *ethical ideal*.

  *   **Weeks 1–2: Genealogy of Presence.** Map the distinction between "seeking" asylum and "accessing" asylum. Analyze arguments that defend presence as a security or sovereignty necessity to determine if they are moral or pragmatic.
  *   **Weeks 3–4: Constructing the Positive Duty.** Argue from the premise of "protection as a right." If State A has a duty to protect, and Claimant B cannot reach State A due to no fault of their own (e.g., exit bans, disability), does the duty evaporate or does it transform into a duty to fetch? Use analogies from rescue ethics.
  *   **Week 5: Stress-Testing & Allocation.** Apply the "universal obligation" test: If every state owes a duty to fetch, does the system collapse? This tests the limits of the theory without requiring a full distribution key.
  *   **Week 6: Drafting & Refinement.** Synthesize arguments, ensuring the distinction between "right to be brought" and "resettlement" remains sharp.

  **4. Success & Failure Criteria**
  *   **Success:** The paper successfully decouples "protection" from "arrival." It demonstrates that a rights-based approach to asylum logically necessitates access mechanisms for the immobile. The "right to be brought" is distinguished from resettlement by being *claimable* rather than *discretionary*.
  *   **Failure:**
      1.  **Conflation:** The "right to be brought" collapses into a plea for expanded resettlement quotas without establishing the *obligatory* nature of the transport.
      2.  **Negative Proof:** The conceptual analysis proves that "asylum" is logically incoherent without a sovereign territory to enter (i.e., you cannot be asylum-seeking nowhere).
      3.  **Scope Creep:** Attempting to solve the allocation problem (which state fetches whom) rather than establishing the existence of the duty.

  **5. Scope Note (7,000 Words)**
  This topic is high-risk for word count. The "Allocation" question (Question 3 above) is a monograph-sized problem.
  *   **Cut Strategy:** I will explicitly bracket the question of *which* state owes the duty. The paper will argue that *some* state(s) owe the duty, and that the current system's reliance on arrival is ethically indefensible. I will not propose a specific matching mechanism.
  *   **Risk:** If I cannot define *who* owes the duty, the obligation may look vacuous. I will mitigate this by arguing for a "coalition of the capable" model rather than a specific state assignment, keeping the focus on the *existence* of the duty rather than its distribution.
