answer: |-
  This is one of the sharpest methodological observations I have seen from a graduate student in a long time. You have effectively stumbled upon the "methodology gap"—the distance between the official epistemology of economics (largely inherited from Friedman's 1953 essay) and the actual sociological norms of theory evaluation practiced in top departments.

  You are right to feel that something is being glossed over. The professor's distinction between "ad hoc" and "progressive" rescues is doing heavy lifting that Friedman's instrumentalism cannot support. Let's take this apart systematically, drawing on the literature in economic methodology (people like Uskali Mäki, D. Wade Hands, and Daniel Hausman) and the history of science.

  ### 1. Brainstorming Theories of Confirmation and Progress

  Before settling on the best diagnosis, let's look at the menu of philosophical frameworks that could license the behavior you observed in the asset pricing seminar.

  *   **Naive Falsificationism (Popper):** *Ruled out immediately.* If economists were Popperians, the Equity Premium Puzzle would have killed the Consumption-CAPM decades ago. The fact that the core is protected while the belt is adjusted is the antithesis of naive falsificationism.
  *   **Friedmanian Instrumentalism (F53):** *Problematic.* As you noted, strict instrumentalism cares only about predictive accuracy across a *wide class* of phenomena. It does not inherently care about the *structure* of the rescue, only the output. If adding a "disaster risk" parameter fits the data, a strict instrumentalist should accept it, provided it predicts well out-of-sample. The concern about "ad hocness" implies a concern for the *truth-likeness* or *explanatory depth* of the mechanism, which F53 explicitly brackets.
  *   **Lakatosian Research Programmes:** *Strong candidate.* This is the standard go-to. The "Hard Core" (rational agents, equilibrium, no arbitrage) is protected by a "Negative Heuristic" (don't blame the core). The "Protective Belt" (utility functions, information sets, friction parameters) is adjusted by a "Positive Heuristic." A programme is "progressive" if adjustments lead to novel predictions; it is "degenerating" if adjustments only patch past anomalies without new predictive power. This fits your seminar perfectly.
  *   **Bayesian Model Comparison:** *Strong candidate.* In a Bayesian framework, adding a parameter (like a new risk factor) increases model complexity. You are penalized for complexity (Occam's razor via priors). A rescue is only accepted if the increase in likelihood outweighs the penalty for the new parameter. The complaint about "hundreds of factors" is essentially a complaint about overfitting (maximizing in-sample likelihood while ignoring the complexity penalty).
  *   **Inference to the Best Explanation (IBE):** *Moderate candidate.* This suggests we choose the theory that *best explains* the data, not just fits it. "Ad hoc" theories are bad explanations because they posit entities (like "habit formation") solely to save the phenomenon, without independent evidence. This aligns with the professor's demand for independent motivation.
  *   **Mäki's "Realism of Assumptions":** *Wildcard.* Uskali Mäki argues that economists are actually covert realists. They claim assumptions are "as if" (Friedman) to avoid criticism, but in practice, they demand assumptions be *credible*. When a behavioral economist says "people aren't that rational," and the mainstream replies "show me the microfoundation," they are demanding a realistic mechanism, contradicting Friedman.

  ### 2. Reconstructing the Implicit Theory

  The practice you observed presupposes a hybrid view I would call **Constrained Structural Realism**.

  It is not purely Lakatosian, because Lakatos allows the hard core to be metaphysical. In economics, the "hard core" (rational choice) is treated as *methodologically necessary* but also *ontologically privileged*. It is not just a convention; it is treated as the only legitimate *kind* of explanation (methodological individualism).

  **What the practice strictly requires:**
  1.  **Consistency with the Hard Core:** Any new factor must be derivable from an optimization problem. You cannot just say "prices move because of sentiment"; you must say "prices move because agents optimize a utility function that includes sentiment." (This rules out pure phenomenology).
  2.  **Novelty (The Lakatosian Condition):** The rescue must generate testable implications *beyond* the anomaly it was designed to fix. (e.g., If you add "rare disasters" to explain equity premiums, your model must also imply something specific about bond yields or exchange rates that you can go check).
  3.  **Parsimony (The Bayesian Condition):** The new ingredient cannot be infinitely flexible. It must be a structured constraint, not a free parameter.

  **What fits comfortably but isn't strictly required:**
  1.  **Psychological Plausibility:** While behavioral economics gains traction, mainstream asset pricing often accepts "habit formation" even if psychologists say habits don't work that way, *provided* it is mathematically tractable and preserves the optimization structure. So, realism is a virtue, but *formalism* is a requirement.
  2.  **Empirical Accuracy:** Surprisingly, this is sometimes secondary. A model can be published if it is "theoretically elegant" even if the empirical fit is mediocre, provided it points a "new direction." (This contradicts strict instrumentalism).

  ### 3. Rival Accounts Ruled Out by the Practice

  By maintaining these norms, the profession quietly rules out:

  1.  **Strict Instrumentalism (Friedman):** As you identified. If only predictions mattered, the "ad hoc" distinction would vanish. A black-box neural net that predicts returns better than a DSGE model would be superior. It is not treated as superior.
  2.  **Pure Empiricism / Data-Driven Science:** The "hundreds of factors" critique (Harvey, Liu, Zhu, 2016) is essentially an empiricist revolt. The fact that the mainstream response is to demand *theoretical justification* for factors, not just better p-values, shows they reject the idea that data can speak for itself without a structural model.
  3.  **Strong Ontological Realism:** They do not go so far as to say "the representative agent literally exists." They maintain the "as if" shield when pressed by philosophers, retreating to instrumentalism when their ontology is attacked.

  ### 4. Can Friedman and Seminar Norms Coexist?

  **Verdict:** No, they cannot be held together honestly. One is window dressing.

  Friedman's *Essay* serves a **sociological function**, not a methodological one. It is a defensive shield against external critics (psychologists, sociologists, policymakers). When a psychologist says "Your assumptions about rationality are false," the economist waves Friedman and says "Irrelevant."

  However, the **seminar norms** serve an **internal coordination function**. They ensure that the community is building a coherent, cumulative body of theory. If everyone just added arbitrary parameters to fit data (pure instrumentalism), the field would fragment into a thousand incompatible empirical regularities with no unifying language. The "ad hoc" constraint forces everyone to speak the same language (optimization, equilibrium).

  So, Friedman is the **public face** (protecting the tribe from outside), while Lakatosian/Structural norms are the **private face** (keeping the tribe coherent inside). This is not necessarily dishonest in a cynical way; it's a division of labor. But logically, they are inconsistent. You cannot claim assumptions don't matter while rejecting a paper because its assumptions are "unreasonable."

  ### 5. What Would Change Under Strict Instrumentalism?

  If the profession actually swapped its implicit view for strict Friedmanian instrumentalism tomorrow, the ground would shift dramatically:

  *   **Journal Norms:** Papers would no longer require "microfoundations." A paper could propose a direct relationship between dividend yields and returns based purely on statistical regularity. The "theoretical model" section would vanish or become optional.
  *   **What Counts as a Contribution:** Machine Learning models would dominate. If a random forest predicts asset prices better than a Consumption-CAPM, it is the better theory. The "black box" problem would be dismissed as philosophical fussiness.
  *   **Hiring:** Departments would hire data scientists and statisticians rather than mathematical theorists. The skill set would shift from "solving dynamic programming problems" to "identifying robust predictive patterns."
  *   **Textbooks:** Textbooks would present models as "tools" or "approximations" explicitly. They would not teach the Representative Agent as the "standard model" but as "one possible algorithm." Superseded material (like the CAPM) would be discarded faster, rather than taught as "foundational truth."
  *   **Seminar Etiquette:** The question "Where are the microfoundations?" would be replaced by "What is the out-of-sample R-squared?" The distinction between "structural" and "reduced form" would collapse.

  ### 6. Flagging Unfairness in Your Description

  You asked me to flag where your description might be a caricature. I have three caveats:

  1.  **Asset Pricing is Extreme:** You are observing the subfield most obsessed with mathematical elegance and least constrained by direct measurement. In Development Economics (RCTs) or Labor Economics (structural estimation), the link between theory and data is much tighter. In those fields, a model that doesn't fit the data *is* often discarded, not rescued. Asset pricing is the "theoretical physics" of econ; it tolerates more degeneracy.
  2.  **The "Ad Hoc" Distinction *Is* Instrumentalist (Sort of):** A sophisticated Friedmanian might argue that "ad hoc" is just a proxy for "unlikely to predict out-of-sample." If a factor is invented *only* to fit past data, it likely won't fit future data. So, the professor's distinction might be a heuristic for *long-run predictive success*, which Friedman cares about. The conflict is less severe if you view "ad hoc" as "overfitting."
  3.  **Behavioral Economics is Ghettoized:** You noted people treat psychological realism as a virtue. This is true in Behavioral Econ, but in mainstream Macro/Finance, behavioral papers are often still treated as "special cases" or "frictions," while the rational model remains the benchmark. The "virtue" of realism is often acknowledged but then subordinated to the "virtue" of tractability.

  ### 7. What Would Change My Mind?

  I am confident in the diagnosis that Friedman is "public relations" and Lakatos is "private practice." However, here is where I could be wrong:

  *   **The "Lucas Critique" Defense:** If you argued that the reason economists demand structural models (optimization) is not because they believe they are true, but because they believe they are **policy-invariant**. A pure statistical relationship (instrumentalism) breaks when policy changes. A structural model (based on preferences/technology) shouldn't. If the "ad hoc" constraint is actually just a demand for **policy robustness**, then the practice *is* consistent with a sophisticated instrumentalism aimed at policy evaluation, not truth.
      *   *Why this might not save Friedman:* Because asset pricing papers often aren't about policy. They are about explaining returns. The demand for microfoundations there is about theoretical unity, not policy invariance.

  *   **The "Unified Language" Argument:** If you convinced me that the "Hard Core" is not treated as a protected belief, but simply as a **lingua franca**. Economists don't keep rational choice because they think it's true; they keep it because it allows them to talk to each other. In this view, they are pragmatists, not covert realists.
      *   *Why this might not save Friedman:* Even if it's a lingua franca, the *intensity* with which they defend it against anomalies suggests it's more than a convention. It's treated as a boundary of the discipline.

  **Where I might be going wrong:** I am assuming the professors *believe* the distinction they are drawing. It is possible they are merely enforcing a **guild norm**. "Don't embarrass the discipline by admitting the core is broken." In that case, it's not a philosophy of science issue at all; it's a sociology of professions issue. If that's the case, asking for philosophical consistency is category error. They aren't trying to be consistent; they are trying to stay employed and publish.

  **Final Thought for your Thesis:**
  You are working on housing supply regulation. You will likely encounter this same tension. You will build a model. The data will contradict it. You will be tempted to add a "friction." Your committee will ask if it's "structural" or "ad hoc." Remember: they are not asking if it's true (Friedman). They are asking if it preserves the research programme (Lakatos). Write your thesis knowing that you are participating in a puzzle-solving exercise within a protected core, not a naive search for truth. That doesn't make it useless, but it clarifies what "success" looks like.
