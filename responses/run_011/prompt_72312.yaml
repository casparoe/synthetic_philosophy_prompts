          3.  **Argue for Divergence:** Where they differ, pick a side. Do not reconcile symmetrically.
          4.  **Test Case:** A video-streaming platform category (stable, no defining feature, overlapping properties, maintained by algorithmic feedback/renewal decisions, supports prediction/intervention).
          5.  **Address Three Questions on the Case:**
              *   Q1: Does it qualify as a kind under HPC? Under FR?
              *   Q2: If they agree, is the mechanism clause idle? If they disagree, which is correct and why?
