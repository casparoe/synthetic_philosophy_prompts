      *   *Trade-off:* To use HPC, realism must give up "essentialism" and strict "mind-independence" (accepting social kinds). It must accept that mechanisms can be social/reflexive.
      *   *Winner:* HPC. FR is linguistic; HPC is metaphysical.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. FR vs. HPC. The temptation to conflate them.
      *   **Section 1: The Separation.** Define FR (Wittgenstein, descriptive, no essence). Define HPC (Boyd, cluster + mechanism).
      *   **Section 2: The Work of the Mechanism.** Argue it is substantive. It distinguishes accidental clusters from law-like clusters. It grounds induction. It's not just a gloss on reliability; it's the *source* of reliability.
      *   **Section 3: The Streaming Case (Q1 & Q2).**
          *   FR: Yes (overlapping features).
          *   HPC: Yes (cluster + feedback mechanism).
          *   Do they agree? Yes. Does this make mechanism idle? No. The mechanism explains *stability over time*. FR is a snapshot; HPC is a dynamic process. If the algorithm changes, the kind changes. FR wouldn't capture that dependency.
          *   *Divergence Argument:* I need to argue for HPC over FR generally. FR is too permissive (allows "things I like"). HPC restricts to causally coherent groups.
      *   **Section 4: Reflexivity (Q3).**
          *   The mechanism is the platform (human artifact).
          *   Does this defeat mind-independence? It challenges the "strong" realist reading.
          *   Comparison to Biology: Human conservation efforts affect species. But species exist without us. Streaming kinds *depend* on us.
          *   *Verdict:* It relocates the worry. HPC can accommodate "social homeostasis." It shows HPC is flexible enough to handle interactive kinds, whereas FR offers no insight into the *causal* nature of that interaction.
      *   **Conclusion:** Scientific Realism needs HPC. It provides the causal grounding for induction. It must give up the dream of a "God's eye" view of kinds entirely independent of human causal networks (especially in social sciences), but it retains the core realist commitment to mind-independent *causal structures* (even if those structures include human agents). FR is insufficient for realism.

  6.  **Refining the Argument (Self-Correction during drafting):**

