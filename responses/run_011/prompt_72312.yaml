          6.  **Conclusion:** Which notion supplies what scientific realism needs? What must be given up?

  2.  **Part 1: Separating the Notions & Analyzing the Mechanism:**

      *   *Family Resemblance (FR):* Wittgenstein (*Philosophical Investigations*). Games example. No *una nota communis*. Just a network of similarities. It's a semantic/conceptual observation about how we use words. It doesn't explain *why* the similarities exist. It's compatible with accidental groupings.
      *   *HPC:* Boyd (1988, 1991). Response to the failure of essentialism in biology/social sciences. Properties cluster together. Crucially, there are *homeostatic mechanisms* (causal processes) that keep them clustered. This allows for variation (fuzzy boundaries) but ensures stability.
      *   *The Work of the Mechanism:* The prompt asks if it's substantive or a gloss.
          *   *Argument:* It must be substantive. If it were just a gloss on reliability, HPC would collapse into "reliable FR." But FR doesn't require reliability, just resemblance. HPC requires a *causal explanation* for the co-occurrence.
          *   *Why it matters:* It distinguishes *natural* kinds from *accidental* or *conventional* kinds. A pile of red things is an FR group. A group of things red because of a specific pigment gene maintained by selection is an HPC. The mechanism grounds the *projectibility* (induction).
          *   *Stance:* I need to argue that the mechanism is substantive. It filters out accidental clusters.

