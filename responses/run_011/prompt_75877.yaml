answer: |-
  Your hypothesis is a powerful diagnostic tool, correctly identifying that the terms "process" and "outcome" are acting as overloaded containers for distinct technical and philosophical choices. You are right that much of the stalemate is verbal, stemming from the collapse of reward density, evaluation property, and evaluator source into a single binary. However, your hypothesis is too charitable to the idea that clarifying these axes will dissolve the disagreement. While it exposes category errors, it misses the deeper ontological clash about what reasoning *is* within a model. The impasse persists not because the groups are confused about definitions, but because they are optimizing for incompatible latent properties under the guise of a single training objective.

  Let us dissect the three axes you proposed to separate the verbal from the substantive. The first axis, reward placement (dense versus terminal), is a substantive empirical question regarding credit assignment. In principle, this is settleable. If the only difference were density, we could compare dense outcome-derived rewards (value functions) against sparse terminal rewards while holding the evaluator constant. If dense signals consistently yield better sample efficiency or generalization on hard tasks, the Process Camp wins on engineering grounds. However, the groups rarely run this control. Instead, they conflate density with the source of the signal. The Process Camp argues for dense *human* labels; the Outcome Camp argues for sparse *automatic* checks. Because these variables change simultaneously, neither side can claim the empirical high ground. This is a methodological failure, not a philosophical one, and it is easily fixable by decoupling density from source.

  The second axis, the property evaluated (justification versus result), reveals the first hidden dispute about the target quantity. Here the disagreement is not verbal but fundamental. The Outcome Camp optimizes for functional correctness: does the model produce the right answer? The Process Camp optimizes for faithfulness: does the trace reflect the causal mechanism producing the answer? These are distinct targets. A model can be functionally correct but unfaithful (using a shortcut but writing a plausible explanation) or faithful but incorrect (following valid logic based on a false premise). When the Process Camp cites experiments where step labels improve reasoning quality without changing accuracy, they are measuring faithfulness. When the Outcome Camp cites experiments where outcome supervision matches accuracy with less cost, they are measuring functionality. They are not contradicting each other; they are measuring different variables. Progress here requires admitting that "performance" is not a scalar. We must decide whether we care about the answer or the algorithm. If the deployment context requires auditability, faithfulness is the target, and outcome supervision is theoretically insufficient regardless of accuracy.

  The third axis, the evaluator (human versus automatic roll-out), is where your hypothesis suggests the distinction collapses. You argue that a step score defined by the probability of future success is just a value function, making it outcome supervision in disguise. This is mathematically sound but practically where the hypothesis fails. The disagreement here rests on a normative commitment about the source of truth. The Process Camp assumes human intuition about logical validity is a valid ground truth, even when it diverges from empirical success rates. They believe a step can be "wrong" even if it leads to the right answer. The Outcome Camp assumes human intuition is biased and that empirical success is the only objective truth. They believe a step is "right" if it works, regardless of whether a human likes the look of it. This is not a verbal dispute; it is a clash over whether human semantics or empirical consequences should govern the loss landscape. Your hypothesis treats this as an estimation strategy difference, but it is actually a disagreement about whether human interpretability is a constraint on the model or an artifact of human limitation.

  Consequently, a real, non-verbal core of disagreement survives your diagnosis. It is an ontological dispute about the nature of the reasoning trace. The Process Camp treats the trace as a causal mechanism: the steps cause the answer. Therefore, supervising the steps controls the mechanism. The Outcome Camp treats the trace as epiphenomenal: the hidden states cause the answer, and the trace is just a generated output like any other. Therefore, supervising the steps only controls the formatting of the justification, not the underlying computation. If the Outcome Camp is right—that the text of the reasoning step is not causally linked to the model's internal computation—then process supervision is merely training the model to lie more convincingly. It is teaching the model to produce text that humans reward, while the real work happens in opaque layers. The Process Camp must assume that forcing the text to be logical constrains the latent computation. This is an empirical claim about model architecture and representational learning that neither side has proven.

  So, where does this leave us regarding progress? We should not expect further benchmark comparisons to settle this, because each side can simply select the metric that favors their ontology. Progress requires a shift in experimental design from observational to interventional. We need experiments that break the correlation between correct steps and correct answers. For example, take a model trained with process supervision and intervene on the reasoning trace during inference: force a logically valid step that leads to a wrong answer, or a logically invalid step that leads to a right answer. If the model's final answer changes based on the trace intervention, the trace is causal, and process supervision has leverage on the mechanism. If the final answer remains unchanged despite the trace manipulation, the trace is merely decorative, and outcome supervision is sufficient for functionality while process supervision is merely cosmetic.

  Furthermore, we need a formal reframing of the objective. Instead of asking "which supervision is better," we should ask "what is the minimum sufficient statistic for trust?" If the goal is high-stakes deployment, the requirement is not just accuracy but verifiability. This makes audibility a hard constraint, not a soft benefit. Under this framing, outcome supervision is disqualified by definition for certain domains, regardless of its accuracy, because it does not produce verifiable artifacts. Conversely, if the goal is pure capability maximization where audits are impossible, outcome supervision is preferred due to cost and lack of human bias.

  Ultimately, the argument persists because both sides are partially right about different goals. The Process Camp is right that unfaithful reasoning is brittle and unauditable. The Outcome Camp is right that human labels are noisy proxies and expensive. The impasse will only break when the field stops treating "reasoning performance" as a single metric and starts explicitly trading off accuracy against faithfulness. Until then, you will continue to have the same argument every six months, because you are not debating methods; you are debating whether you are building a calculator that shows its work or an oracle that tells you what you want to hear. The progress you seek lies not in a new paper, but in a decision about which of those two machines you actually intend to build.
