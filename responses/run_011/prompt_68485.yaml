answer: |-
  ### 1. The Verdict on the Security Guard
  **Prediction:** She will say the guard's omission was **not a cause** of the building burning down.

  **Reasoning:** In her framework, causation by omission requires **Salient Agential Control**. This means the agent must be the specific "switch" for the outcome (either as a designated safeguard or a designated threat) *and* must possess the actual physical capacity to flip that switch.
  *   The **Plant-sitter** had the role *and* the ability (she just forgot).
  *   The **Guard** has the role, but lacks the ability (physically trapped).
  *   To her, the maglock failure is the cause; the guard's absence is merely a circumstance, much like the "no firefighter inside" case. Because the guard *could not* have acted, his "not acting" doesn't register as a causal intervention, even if he was contractually obliged to be there.

  ### 2. The Rule She Is Running
  Her intuition follows a hybrid principle we can call **Specific Salience + Capacity**.

  An omission counts as a cause if and only if:
  1.  **Salience:** The agent is the *specific* designated controller of that risk (either the assigned safeguard or the active threat).
  2.  **Capacity:** The agent physically could have performed the act.
  3.  **Volition:** The failure to act stems from the agent's internal state (choice, forgetfulness, decision) rather than external impossibility.

  **How it fits her cases:**
  *   **Plant-sitter (Yes):** Specific safeguard + Ability + Internal failure (forgot).
  *   **Stranger (No):** Ability exists, but lacks Salience (no specific assignment).
  *   **Lifeguard (No):** Salience exists generally, but lacks *Specific* Salience (assigned North, not South).
  *   **Hitman (Yes):** Specific Salience (he is the threat) + Ability + Volition (decided to spare).
  *   **Firefighter (No):** No Salience (no one assigned to be inside).
  *   **Escort Plane (Yes):** Positive action (commission), so it bypasses the omission rules entirely, but fits the "Salient Control" vibe.

  ### 3. Rival Theories & Fit Analysis

  Here are the three main philosophical contenders against her pattern:

  | Theory | The Rule | Fit with Her Cases | Why It Fails Her Pattern |
  | :--- | :--- | :--- | :--- |
  | **Pure Counterfactual Dependence** | If $A$ hadn't happened, $B$ wouldn't have. | **Poor.** | Explains Plant & Stranger (both fit counterfactuals), but she rejects Stranger. She explicitly says "a true counterfactual isn't enough." |
  | **Strict Normative Duty** | Omission is a cause iff there is a legal/moral duty to act. | **Medium.** | Explains Plant, Stranger, Firefighter. **Fails Hitman:** The hitman has no duty to spare the target, yet she calls it a cause. **Fails Guard:** If duty alone sufficed, the guard's contract might make him a cause despite being trapped. |
  | **Salient Agential Control** (Her View) | Agent must be the specific switch (role/threat) AND able to flip it. | **Perfect.** | Accommodates the Hitman (threat control), the Lifeguard (scope of control), and the Guard (lack of physical control). |

  ### 4. The Tie-Breaker Case
  To distinguish her view (**Salient Control**) from the closest rival (**Strict Normative Duty**), use this case:

  **The Locked-Out Plant Sitter:**
  > A plant-sitter is under contract to water your fern. She arrives at your house, but the lock has been changed and she cannot get in. She does not call you. The fern dies.

  *   **Strict Normative Duty View:** **Cause.** She breached the contract. The normative expectation was violated, regardless of physical impossibility.
  *   **Her View (Salient Control):** **Not a Cause.** She lacked the *Capacity* to intervene. The lock change is the cause; her absence is just a fact.
  *   **Why this separates them:** It isolates **Ability** from **Obligation**. Her rejection of the Security Guard suggests Ability is a hard constraint for her. If she says the Locked-Out Sitter *is* a cause, then her rule is actually about Contract Breach, not Causation.

  ### 5. What Is Settled vs. What Is Contested

  **Settled (In This Conversation):**
  *   **Her Consistency:** We can map her intuitions reliably. She is not being random; she is applying a consistent "Specific Control + Ability" filter.
  *   **Counterfactual Insufficiency:** She has explicitly rejected the idea that "if he had done it, it would have worked" is sufficient for causation (see the Stranger case).

  **Genuinely Contested (In Philosophy):**
  *   **Whether Omissions Are Causes At All:** Many metaphysicians (e.g., Helen Beebee) argue omissions are *never* causes because there is no event to transmit energy or force. Your friend assumes they *can* be causes, which is already a specific stance.
  *   **The Role of Norms:** In mainstream metaphysics (e.g., David Lewis), causation is often viewed as a matter of objective dependence, not norms. Your friend is importing legal/moral concepts (duty, assignment) into metaphysics. Philosophers debate whether this is a feature of *causation* or just a feature of *explanation/blame*.
  *   **The Hitman Intuition:** Her verdict on the Hitman is philosophically spicy. Many theorists distinguish between *doing* (shooting) and *allowing* (not shooting). Her claim that "refraining caused the living" treats the omission as an active force. This is contested; some argue the *hitman's prior decision to be there* is the cause, not the moment of refraining.

  **Summary:** You aren't arguing about logic; you're arguing about **ontology**. You are likely looking for physical causation (energy transfer), while she is describing **pragmatic causation** (who do we hold responsible as the "switch"). Her rule is coherent, but it is a rule about *responsibility attribution*, not necessarily about the fabric of the universe.
