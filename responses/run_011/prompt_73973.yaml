  **SYNDICATE 9 EXCHANGE LTD.**
  **BETTING RULES & SETTLEMENT TERMS (VERSION 4.2)**
  **EFFECTIVE DATE: CONTINGENT UPON REGULATORY APPROVAL**

  **1. PREAMBLE: HOUSE THEORY OF ACTUALITY**
  Syndicate 9 operates under the Principle of Branching Actuality. Clients acknowledge that future contingent propositions (e.g., "There will be a sea battle tomorrow") possess no truth value at the time of wager strike. Truth values are assigned only upon the collapse of the probability branch into the Privileged Actual Timeline. Settlement is governed by the state of the Privileged Actual Timeline at the moment of resolution, applied retroactively to the strike time. Clients wagering on non-actualized branches assume the risk of branch pruning.

  **2. SETTLEMENT OF VALUELESS PROPOSITIONS**
  Where a wager is struck on a proposition lacking a truth value, funds are held in metaphysical escrow. Upon actualization, settlement is retroactive. If the branch actualizes, the bet stands as if the truth value existed at strike. If the branch is pruned, the stake is forfeit as a fee for temporal occupancy. Clients cannot claim refund based on the reality of non-actualized possibilities. As Senior Alethic Risk Officer J. Thorne states: "We do not pay out on ghosts, only on residents."

  **3. ETERNALISM REBATE POLICY**
  Should a proposition be determined post-strike to have possessed a truth value at the time of wagering (e.g., due to causal determinism or block universe conditions), the bet is void. A rebate of 95% of the stake is issued. The 5% deduction covers administrative costs associated with correcting the client's erroneous view of time. Complaints regarding this fee often misunderstand the cost of fatalism. One complainant noted: "You charged me to tell me time is an illusion? I want the full stake back." This claim was denied under Clause 3.2.

  **4. DESIGNATED FUTURE SERVICE (PREMIUM)**
  Premium subscribers may purchase a Designated Future Option, selecting a specific branching timeline for settlement regardless of the Privileged Actual Timeline. Designations are binding at strike. Revisions post-actualization are prohibited, as revising a designation implies the client believes they can alter the past, which violates Clause 1. If the Designated Future fails to actualize, the bet is settled against the Privileged Actual Timeline anyway, minus a hedging fee.

  **5. LOGICAL TAUTOLOGIES AND DISJUNCTIONS**
  Wagers on logical truths (e.g., "Either there will be a sea battle or there will not") are accepted at odds of 1.00. However, a 100% vigorish is applied. Since the proposition is true in all possible worlds, no risk is undertaken by the client. Therefore, no payout is justified. The house retains the stake as a fee for confirming logical necessity. Clients arguing that this negates the utility of betting are referred to the Logic Desk.

  **6. DISPOSITIONS AND COUNTERFACTUALS**
  Wagers on dispositions ("The glass would have broken") are settled via modal proximity assessment. Syndicate 9 simulates the nearest possible world where the antecedent obtains. Observation of a "would-be" requires calibrated counterfactual sensors. Clients must accept the simulation output as final. Disputes regarding the similarity metric of possible worlds are not arbitrated.

  **7. DELIBERATION CONSTRAINT**
  Wagers on propositions under the direct deliberative control of the punter (e.g., "I will raise my arm") are void. This prevents the wager from influencing the outcome, thereby collapsing the contingency prematurely. Libertarians may file Form 88-B to opt out of this constraint, acknowledging that their choice may be determined by the bet itself.

  ***

  **SIDEBAR A: REGULATORY DISCLOSURE**
  The Alethic Conduct Authority requires Syndicate 9 to disclose its metaphysics in plain English. We comply: The future is open until it isn't. Truth is made, not found. Betting involves risking money on which version of reality becomes real. If you believe the future is already written, please visit our Eternalism Rebate section.

  **SIDEBAR B: COMPETITOR COMPARISON**
  Clients may consider rival houses. **Diodorus & Sons** ("What happens was always going to") offers better odds on inevitabilities. **Supervaluation Mutual** ("True on every path") pays only on universal truths. **Ockham & Co.** ("True on this path") sells our Designated Future product without the hedging fee. **Peirce Exchange** ("Maybe later") refuses to settle bets until the heat death of the universe.

  ***

  **Settlement disputes we anticipate**

  The preamble adopts an Aristotelian/Ockhamist hybrid: future contingents lack truth values now but will have them later. Clause 2 smuggles in Eternalism (block universe) to charge a fee for correcting the punter's metaphysics. Clause 4 is where the house view collapses; if future contingents lack truth values (Preamble), then the disjunction "P or not-P" should arguably lack a truth value too (Peircean view), or be true but unpayable. By calling it a tautology to take the stake, we invoke Bivalence, contradicting the Preamble. Clause 6 targets libertarian free will; the opt-out implies determinism. The jokes are unfair to Ockhamists, who wouldn't charge for tautologies, but fair to bookmakers who treat logic as a revenue stream. The document fails because it treats metaphysical categories as administrative toggles.
