prompt: |-
  Second-year ethics section, fifty minutes, whiteboard only, and I have now botched the hypocrisy-and-blame topic two years running. The students all show up assuming that if you do the thing you're criticising, your criticism is simply false. That's the one thing I most want to break, but when I attack it head-on the section slides into "so nobody's allowed to criticise anybody," and they leave thinking standing is just a purity test you automatically fail.

  Plan the section for me — don't explain the material to me, I know it, I need the delivery. Give me the order the pieces have to go in and what genuinely depends on what. My hunch is that I have to establish standing as a broader thing *before* hypocrisy ever comes up, otherwise "you have no standing" just means "you're a hypocrite" to them. So: is there a case of standing failure with no hypocrisy in it that I can open on — the co-author who blames you for the data she never checked, maybe — and does opening there cost me anything downstream?

  Then the distinction I keep waving at but never nail: the hypocrite who doesn't believe the norm versus the one who believes it completely sincerely and just exempts herself. I want them to see that the fault sits in the applying, not the believing, and I want a word to hang that on.

  Also tell me which single case carries the whole thing and why the smoking parent is a trap — I suspect its because that's advice, not blame, so it collapses the two questions I'm trying to seperate. Where in the sequence to head off each misconception, what to leave out and announce that I'm leaving out (the second-personal machinery, presumably), and one thing to put on the board in the last five minutes that shows me whether they got the distinction or only the mood.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year ethics instructor (likely undergraduate level, given "section" and "fifty minutes").
      *   **Problem:** Students conflate hypocrisy with invalidity of criticism ("tu quoque" fallacy). They think if you do the thing, you can't say it's wrong. When the instructor pushes back, students swing to nihilism ("no one can criticize anyone").
      *   **Goal:** Break the link between doing $X$ and being unable to blame for $X$, without landing in nihilism. Establish "standing" as a distinct concept from "truth of the claim."
      *   **Constraints:** Whiteboard only. 50 minutes. Do *not* explain the material (instructor knows it). Focus on *delivery*, *order*, and *dependencies*.
      *   **Specific Questions to Answer:**
          1.  Open with a non-hypocritical standing failure (e.g., co-author)? Does it cost downstream?
          2.  How to distinguish "doesn't believe norm" vs. "believes but exempts self"? Need a specific word/concept.
          3.  Which single case carries the whole thing? Why is the "smoking parent" a trap?
          4.  Where to head off misconceptions?
          5.  What to leave out/announce leaving out (e.g., second-personal authority)?
          6.  Final whiteboard check (last 5 mins) to test understanding vs. mood.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Confusion:* Students think Blame = Moral Truth + Moral Purity. If Purity fails, Blame fails.
      *   *The Correction:* Blame = Moral Truth + Standing. Purity affects Standing, not Truth.
      *   *The Trap:* If you focus too much on hypocrisy, students think *only* hypocrisy removes standing. If you focus too much on standing, they think *any* flaw removes standing (nihilism).
      *   *The Smoking Parent Trap:* "Don't smoke, it's bad for you." This is advice/welfare, not necessarily moral blame. It conflates "good for you" with "morally permissible." It invites the response "But you do it!" which triggers the hypocrisy reflex immediately without isolating the *normative authority* aspect.

  3.  **Drafting the Plan - Step-by-Step:**

      *   **Opening (0-10 mins): The Non-Hypocritical Standing Failure.**
          *   *Idea:* The user suggests the "co-author who blames you for data she never checked."
          *   *Verdict:* Yes, this is strong. It isolates *authority/role* from *behavior*. She isn't doing the bad thing (faking data); she's blaming you for it without having done the work to verify.
          *   *Why:* It proves "You have no standing" $\neq$ "You are a hypocrite." It proves standing is about the *relationship to the norm/violation*, not just personal purity.
          *   *Cost:* None, provided we pivot quickly to hypocrisy. It sets the stage that standing is a structural/relational concept, not just a behavioral one.

      *   **The Pivot to Hypocrisy (10-25 mins): The Core Distinction.**
          *   Need to move from "Co-author" (no hypocrisy, no standing) to "Hypocrite" (hypocrisy, no standing?).
          *   *The Trap:* Smoking Parent. User suspects it's advice, not blame. Correct. It collapses "prudence" and "morality."
          *   *The Better Case:* The "Speeding Judge" or "Cheating Professor." Let's go with **The Cheating Professor**.
          *   *Why:* It's clearly moral (academic integrity). It allows for the distinction between *rejecting the norm* vs. *making an exception*.
          *   *The Word:* **Dispensation**. Or **Exemption**. The user wants a word to hang "applying vs. believing" on. *Privilege*? *Immunity*? Let's use **Exemption**. The hypocrite grants themselves an *exemption* from a norm they endorse.

      *   **Addressing the Nihilism Slide (25-35 mins):**
          *   Students think: "If hypocrites can't blame, and everyone is a hypocrite, no one can blame."
          *   *Correction:* Standing is forfeited *only* by the specific hypocrisy regarding the specific norm. It's not a general moral credit score.
          *   *Intervention:* Explicitly state that having standing doesn't require sainthood, only consistency *on this norm*.

      *   **What to Leave Out:**
          *   Second-personal authority (Darwall stuff). Too technical, muddies the water. Announce this: "We are talking about the *fittingness* of the blame, not the *authority* to demand."

      *   **The Final Check (45-50 mins):**
          *   Need a board state that tests the distinction.
          *   Not a mood check ("Do you feel blame is okay?").
          *   A logic check.
          *   *Idea:* A 2x2 grid or a conditional statement.
          *   *Better:* A specific scenario evaluation. "Person A does X. Person B does X. Person B blames Person A. True/False: B's blame is false."
          *   *Best:* The "Standing vs. Truth" equation on the board.

  4.  **Refining the Sequence and Dependencies:**

      *   *Dependency 1:* Must establish that Blame has two conditions (Truth of Norm + Standing of Blamer) *before* discussing Hypocrisy. If you start with Hypocrisy, they think Hypocrisy is the *only* condition.
      *   *Dependency 2:* Must distinguish "Norm is False" from "Blamer lacks Standing."
      *   *Dependency 3:* Must distinguish "Hypocrisy (Exemption)" from "Inconsistency (Accident)."

  5.  **Addressing Specific User Queries:**

      *   *Co-author case:* Yes, open with it. It decouples standing from personal conduct.
      *   *Smoking Parent:* It's a trap because it's prudential advice, not moral blame. It invites "But it helps you!" defenses. Use **The Speeding Judge** instead.
      *   *The Word:* **Exemption**. (Or *Special Pleading*). Let's suggest **Exemption**.
      *   *The Single Case:* **The Speeding Judge**. (Classic, clear, moral/legal overlap).
      *   *Final Board:* A conditional schema.

  6.  **Developing the "Delivery" Aspect:**
      *   The user wants *order* and *what depends on what*.
      *   Tone: Direct, instructional, respecting their expertise.
      *   Whiteboard management is crucial for 50 mins.

  7.  **Final Polish of the Plan:**
      *   *0-10:* Co-Author Case (Standing without Hypocrisy).
      *   *10-30:* Speeding Judge (Hypocrisy as Exemption). Distinguish Belief vs. Application.
      *   *30-40:* The Nihilism Block (Standing is local, not global).
      *   *40-45:* What we aren't doing (Second-personal).
      *   *45-50:* The Board Test.

      *Wait, one refinement on the "Word":* The user wants to distinguish "doesn't believe norm" vs "believes but exempts."
      *   Case A: Anarchist speeding. (Believes no speed limits).
      *   Case B: Judge speeding. (Believes speed limits, but "not for me").
      *   Word: **Endorsement**. Or **Commitment**.
      *   Actually, **Exemption** is best for the *act* of self-removal. **Repudiation** for the act of denying the norm.
      *   Let's recommend **Repudiation vs. Exemption**.

      *Refining the Smoking Parent Trap:* Why exactly? Because the parent says "Don't smoke." If the parent smokes, the child says "You do it!" The parent replies "It's bad for you." This is *concern*, not *blame*. Blame implies a violation of a right/duty. Smoking isn't usually a duty violation to the child. Speeding *is* a violation of law/duty. So the Judge case is superior.

      *Final Board Check:* Needs to be binary. "The claim is FALSE" vs "The claim is TRUE but UNFITTING."

  8.  **Constructing the Output:** (Drafting the response following the thought process).
      *   Acknowledge the constraint (whiteboard, 50 mins).
      *   Structure by time blocks.
      *   Explicitly answer the "Co-author" question.
      *   Explicitly answer the "Smoking Parent" question.
      *   Provide the "Word."
      *   Provide the Board State.

      *(Self-Correction during drafting)*: Make sure I don't explain the ethics. Just the flow. Keep it tight. The user is stressed about time and flow.

      *Re-evaluating the Co-Author case:* Does it cost downstream? Only if students think standing is *only* about epistemic access. Need to make sure the transition to Hypocrisy clarifies that Hypocrisy is a *different kind* of standing loss.
      *   *Fix:* Frame Co-Author as "Epistemic/Role Standing" and Hypocrisy as "Moral Consistency Standing." No, that complicates it.
      *   *Better:* Frame Co-Author as "Standing without Hypocrisy." This proves they are distinct variables. That's the key. It breaks the identity "Standing = Purity."

      *The Single Case:* The Speeding Judge is the workhorse.
      *   Variant 1: Judge believes laws don't apply to anyone (Repudiation).
      *   Variant 2: Judge believes laws apply to all, but not her (Exemption).
      *   This nails the belief/application distinction.

      *Final Board:*
      Left: "Norm is False"
      Right: "Blamer has No Standing"
      Center: "Therefore Blame is..."
      Options: "False" vs "Unfitting/Improper."
      This forces them to choose the metaphysical status of the blame.

      *Let's write it.*
answer: |-
  Here is the 50-minute delivery plan. It is designed to prevent the "purity test" slide by decoupling *truth* from *standing* before you ever mention hypocrisy.

  ### 0:00–0:10: The Wedge (Standing without Hypocrisy)
  **Board Left:** *Case 1: The Co-Author.*
  **Scenario:** A and B co-author a paper. A fakes data. B blames A for faking data. B never checked the data because B trusted A.
  **Question:** Does B have standing to blame A?
  **Expected Intuition:** No. B is complicit/negligent. B lacks the position to blame.
  **Crucial Follow-up:** Is B a hypocrite?
  **Expected Intuition:** No. B didn't fake data. B didn't claim to check it.
  **Point to Nail:** Standing can fail *without* hypocrisy.
  **Dependency:** This establishes "Standing" as a variable distinct from "Personal Purity." If you skip this, "No Standing" becomes synonymous with "Hypocrite" in their minds for the rest of the hour.
  **Cost:** None, provided you explicitly label this "Role/Epistemic Standing" and pivot to "Moral Standing" next. It prevents the equation *Standing = Purity*.

  ### 0:10–0:30: The Core Case (Hypocrisy as Exemption)
  **Board Center:** *Case 2: The Speeding Judge.*
  **Scenario:** A Judge fines a citizen for speeding. The Judge regularly speeds.
  **Trap to Avoid:** Do not use the Smoking Parent.
  **Why the Smoking Parent Fails:** It is prudential advice ("This is bad for *you*"), not moral blame ("You violated *us*"). It collapses the distinction between *welfare* and *obligation*. Students will defend the parent by saying "They still care," which muddies the normative force. The Judge case involves a public norm and a duty.
  **The Single Case Work:** Use *only* the Judge case for the rest of the section. Vary the Judge's mental state.

  **Sequence:**
  1.  **Judge A:** Speeds. Believes speed limits are stupid and should be abolished. Blames citizen.
      *   *Diagnosis:* **Repudiation.** The Judge rejects the norm. The blame is insincere.
  2.  **Judge B:** Speeds. Believes speed limits are vital. Believes they apply to everyone *except* Judges (or "except me right now"). Blames citizen.
      *   *Diagnosis:* **Exemption.** The Judge endorses the norm but carves out a self-exception.

  **The Word:** Write **EXEMPTION** on the board.
  **Usage:** Tell them: "Hypocrisy isn't failing to believe the norm. It's granting yourself an **exemption** from a norm you claim to endorse."
  **Why this word:** It locates the fault in the *application* (the granting of immunity) rather than the *belief* (the truth of the rule). It stops them from saying "But she knows speeding is wrong!" (Yes, she does, that's why it's exemption, not repudiation).

  ### 0:30–0:40: Blocking the Nihilism Slide
  **Board Right:** *The Nihilism Trap.*
  **Student Move:** "Everyone makes exceptions. So no one has standing. So blame is impossible."
  **Your Block:** Standing is **Local**, not **Global**.
  **Delivery:** "If the Judge speeds, does she lose standing to blame for *speeding*? Yes. Does she lose standing to blame for *theft*? No."
  **Point to Nail:** Standing is norm-specific. You do not need a clean moral record to have standing; you need a clean record *on this specific norm*.
  **Dependency:** This relies on the "Exemption" definition. If hypocrisy is "breaking the rule," everyone fails. If hypocrisy is "exempting oneself from the rule," you can avoid it by accepting the blame for your own speeding.
  **Intervention:** Announce explicitly: "We are not asking if the blamer is a good person. We are asking if the blame is *fitting*."

  ### 0:40–0:45: Scope Limit (What We Are Ignoring)
  **Board Bottom:** *Out of Scope: Second-Personal Authority.*
  **Script:** "We are not discussing whether the blamer has the *authority* to demand compliance (Darwall). We are discussing whether the blame is *appropriate* given the blamer's conduct. Don't confuse 'You can't tell me what to do' with 'You can't say I did wrong.'"
  **Why:** Second-year students love to pivot to "Who are you to tell me?" This shuts that down by categorizing it as a different mechanism than the one you are analyzing.

  ### 0:45–0:50: The Board Check
  **Goal:** Distinguish "False Claim" from "Unfitting Blame."
  **Board Setup:** Erase everything except a simple schema.

  Write this:
  **"You violated Norm N."**

  **Scenario:** Blamer violated N. Blamer claims Exemption.
  **Question:** Is the statement above TRUE or FALSE?

  **Instructions to Class:** "Don't tell me how you feel. Tell me the truth value."

  **Success Condition:**
  *   If they say **FALSE**: They failed. They think hypocrisy makes the criticism factually wrong.
  *   If they say **TRUE (but unfitting/improper)**: They succeeded. They understand that the *content* of the blame is correct, but the *act* of blaming is compromised by the exemption.

  **Why this works:** It forces them to separate the *proposition* (You broke the rule) from the *speech act* (I blame you). If they leave thinking the proposition is false, you have botched it again. If they leave thinking the proposition is true but the speaker lacks the standing to assert it, you have broken the "purity test" link.

  ### Summary of Dependencies
  1.  **Co-Author** must come first to prove Standing $\neq$ Purity.
  2.  **Judge Case** must replace Smoking Parent to ensure we are discussing *Obligation*, not *Welfare*.
  3.  **Exemption** must be defined before discussing Nihilism, or they will think "breaking the rule" removes standing (which leads to nihilism).
  4.  **Local Standing** must be asserted to prevent the "everyone fails" conclusion.
  5.  **True/Unfitting** distinction is the only valid exit ticket.

  ### What to Leave Out
  *   **Forgiveness:** Do not open the question of whether the victim must forgive the hypocrite. It distracts from the standing of the blamer.
  *   **Consequences:** Do not discuss whether the hypocrite should be punished. Focus solely on the *fittingness of the blame*.
  *   **Private vs. Public:** Do not get bogged down in whether the hypocrisy is secret. Assume public knowledge for the sake of the standing condition.

  ### Whiteboard Management
  *   **Left:** Co-Author (Standing w/o Hypocrisy)
  *   **Center:** Judge (Repudiation vs. Exemption) + Word: **EXEMPTION**
  *   **Right:** Local vs. Global Standing
  *   **Bottom:** Truth Value Check (True/False)

  If you run out of time, cut the Co-Author discussion short, but **do not cut the Truth Value Check**. That is the only way you will know if you fixed the problem.
