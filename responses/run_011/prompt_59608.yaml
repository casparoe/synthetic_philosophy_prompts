answer: |-
  Here is the analysis of your PI's coding behavior, the underlying theoretical framework she is actually using, and the strategy for your Friday submission.

  ### Executive Summary
  **Verdict:** She will score the Special Economic Zone (SEZ) as **Tight**.
  **The Hidden Rule:** She is not coding "Cultural Tightness" (shared norms/values); she is coding **"Functional Behavioral Constraint."** For her, a society is Tight if the group's viability depends on strict behavioral coordination *and* individuals experience that constraint as binding, regardless of whether the enforcement is social (gossip) or formal (automation).
  **The Manual Principle:** "Tightness reflects the degree to which behavioral variance is suppressed by mechanisms (formal or informal) necessary for group survival or stability, evidenced by high compliance and subjective experiences of constraint."

  ---

  ### 1. Analysis of the PI's "Hidden Theory"
  Your official manual defines Tightness as *Norm Strength + Punishment + Low Tolerance*. Your PI ignores this. She is running a **Functional-Ecological Model**. She looks at *why* the rules exist and *how they feel*, not just *that* they exist.

  Here is the breakdown of her logic across the 8 precedents:

  *   **The "Wealth Buffer" Exception (Case 1):** Affluent, automated compliance = **Loose**.
      *   *Why:* "Compliance nobody has to enforce isn't constraint." If wealth or ease makes deviance costless or irrelevant, it doesn't count as Tightness.
  *   **The "Aspiration vs. Reality" Check (Case 2 & 7):** Strong norms/history without effective enforcement = **Loose**.
      *   *Why:* Tightness is about *current behavioral constraint*, not cultural ideals or historical trauma.
  *   **The "Survival/Stability" Override (Case 4 & 5):** Limited domains or specific political domains = **Tight** *if* they protect viability.
      *   *Why:* Fishing norms prevent starvation (Case 4); Political policing prevents regime collapse (Case 5). The *stakes* of the norm matter more than the *number* of norms.
  *   **The "Behavioral Bandwidth" Metric (Case 3):** Mid-range aggregate = **Tight**.
      *   *Why:* If behavior is identical across contexts (funeral vs. football), the society is functionally Tight, regardless of the specific rules.
  *   **The "Trivial Norm" Distinction (Case 8 vs. 4):** Queueing norms = **Loose**; Fishing norms = **Tight**.
      *   *Why:* Queueing is convenience; Fishing is survival.

  **The Tension:** Case 1 (Automated Fines = Loose) vs. Case 9 (Automated Fines = ?).
  **The Resolution:** In Case 1, residents felt *no* constraint (high tolerance, no reaction). In Case 9, residents feel *high* constraint ("feel watched," "behavior extremely constrained"). The PI cares about the **subjective experience of restriction** combined with **structural necessity**.

  ### 2. Candidate Rules & Predictions for the SEZ

  Here are the three strongest candidate rules that fit her track record, ranked by likelihood.

  #### Rule A: The "Social Internalization" Rule
  *   **Definition:** A society is only Tight if enforcement is social (gossip, shame, ostracism). Formal/automated enforcement is "administration," not culture.
  *   **Fit:** Explains Case 1 (Loose), Case 6 (Loose), Case 8 (Loose).
  *   **Mismatch:** Struggles with Case 5 (Political Police are formal) and Case 4 (Expulsion is a formal communal act).
  *   **Prediction for SEZ:** **Loose.** (Enforcement is corporate/automated; zero gossip/shame).
  *   **Probability:** Low. She scored Case 5 (Political Police) as Tight.

  #### Rule B: The "Existential Threat" Rule
  *   **Definition:** A society is Tight if the group faces an ecological or structural threat to its continuity, and norms are the defense mechanism.
  *   **Fit:** Explains Case 4 (Starvation), Case 5 (Regime Collapse), Case 7 (Loose because threat is past), Case 1 (Loose because wealth buffers threat).
  *   **Mismatch:** Case 3 (Industrial country) doesn't explicitly mention threat, though "coordination" implies it.
  *   **Prediction for SEZ:** **Tight.** (Lease precariousness, single employer, no citizenship = High Existential Threat).
  *   **Probability:** High. This aligns with her notes on Cases 4, 5, and 7.

  #### Rule C: The "Felt Constraint" Rule (Synthesis)
  *   **Definition:** A society is Tight if individuals experience their behavioral bandwidth as narrow, regardless of the source (social or formal), *provided* the constraint serves a coordination function.
  *   **Fit:** Explains Case 1 (Locals didn't feel constrained) vs. Case 9 (Residents feel watched). Explains Case 3 (Narrow bandwidth).
  *   **Mismatch:** None significant. It subsumes Rule B (Threat creates Felt Constraint).
  *   **Prediction for SEZ:** **Tight.** (Residents explicitly report feeling watched and constrained).
  *   **Probability:** Highest. This resolves the Case 1 vs. Case 9 conflict.

  ### 3. The Verdict and Manual Principle

  **Her Verdict:** **Tight.**
  **Her Reasoning:** She will argue that the SEZ is a "High-Stakes Coordination Environment." Unlike Case 1 (Affluent Island), where wealth buffers the need for constraint, the SEZ is structurally precarious (lease/employment). The automated enforcement is not "convenience" (Case 1); it is the *condition of existence*. Crucially, she will point to the survey data: residents *feel* constrained. In Case 1, they didn't. For her, Tightness is a psychological state of restriction driven by ecological necessity.

  **The Manual Principle to Write:**
  > "Code a society as **Tight** when behavioral variance is actively suppressed by mechanisms (formal or informal) that are perceived by members as necessary for group viability or stability. Key indicators include: (1) High subjective experience of constraint/watching among members; (2) High stakes for deviance regarding group continuity (economic, ecological, or political); (3) Narrow behavioral bandwidth across situations. Do not code as Tight if compliance is achieved through wealth buffers or ease of living where members report low perceived constraint."

  ### 4. The Discriminating Case (If Underdetermined)

  If you are worried that Rule B (Threat) and Rule C (Felt Constraint) might diverge, you need a case where **Threat is High** but **Felt Constraint is Low**.

  **The Case:** A wealthy, fortified "bunker community" of elites.
  *   **Features:** High external threat (climate collapse/war outside), strict formal entry/exit rules, high dependence on the community for safety (Viability).
  *   **Crucial Twist:** Inside, residents report feeling completely free, unwatched, and trusting. The security is invisible; they don't feel policed.
  *   **The Test:**
      *   If she scores it **Tight**: She is following the **Existential Threat Rule** (Viability matters more than feelings).
      *   If she scores it **Loose**: She is following the **Felt Constraint Rule** (Psychological experience is the ultimate metric).

  **My Advice:** Don't run this test now. It risks confusing the renewal application. Stick to the "Felt Constraint + Viability" synthesis for the SEZ.

  ### 5. Flagged Precedent: Case 3

  **Flag Case 3 (Industrial Country).**
  This is the weakest link in your reconstruction. It is the only case where she ignored the aggregate score *without* citing a specific threat (like Case 4/5) or a mechanism failure (like Case 2). She cited "Narrow Behavioral Bandwidth."
  *   **Risk:** If the SEZ has perfect compliance (narrow bandwidth) but the PI decides "Corporate Automation" doesn't count as "Cultural Bandwidth," she could pivot to Loose.
  *   **Mitigation:** In your write-up, explicitly link Case 3's "Bandwidth" to Case 9's "Perfect Compliance." Frame the automated sensors as the *mechanism* that creates the bandwidth, just as cultural norms did in Case 3.

  ### Summary for Your Submission
  1.  **Score:** Tight.
