answer: |-
  ### Purpose and Scope

  The adequacy of a confirmation theory is here fixed relative to a specific engineering task: the design of an automated evidence-triage system operating over a large observational database. The system's function is to decide which observation to collect next to maximize epistemic gain. This purpose imposes three structural constraints on any candidate account: verdicts must be reproducible from explicit records (no hidden intuition); magnitudes must be comparable across distinct hypotheses (to allow ranking); and verdicts must be stable under equivalent descriptions of the same data (to prevent gaming the system). The following desiderata are evaluated against this functional requirement.

  ### Received Desiderata

  **1. The Instance Condition**
  *   **Condition:** An observation report asserting that a specific individual possesses both properties $F$ and $G$ must increase the confirmation of the hypothesis "All $F$ are $G$."
  *   **Motivating Case:** Observing a black raven intuitively supports "All ravens are black."
  *   **Status:** **Non-negotiable.** Any system that ignores direct positive instances fails to learn from success. *Syntactic accounts satisfy this trivially; subjective probabilistic accounts satisfy this only if priors are constrained.*

  **2. The Equivalence Condition**
  *   **Condition:** If two hypotheses $H_1$ and $H_2$ are logically equivalent, any evidence $E$ that confirms $H_1$ must confirm $H_2$ to the same degree.
  *   **Motivating Case:** "All ravens are black" is logically equivalent to "All non-black things are non-ravens"; evidence for one should be evidence for the other.
  *   **Status:** **Camp-Specific (Logical/Syntactic).** This is pressed by accounts prioritizing logical form over semantic content. *Logical accounts insist on this to preserve validity; probabilistic accounts often reject it to solve the Raven Paradox.*

  **3. The Consequence Conditions**
  *   **Condition:** (Special) If $E$ confirms $H$, and $H$ entails $H'$, then $E$ confirms $H'$. (General) If $E$ confirms $H$, and $H'$ entails $H$, then $E$ confirms $H'$.
  *   **Motivating Case:** If evidence confirms "All ravens are black," it should confirm "All ravens are black or green."
  *   **Status:** **Negotiable (Generally Rejected).** Accepting these leads to the "tacking paradox," where irrelevant conjuncts are confirmed. *Most modern accounts reject the General Consequence Condition to prevent trivialization.*

  **4. The Consistency Condition**
  *   **Condition:** A consistent body of evidence $E$ cannot confirm two logically incompatible hypotheses $H_1$ and $\neg H_1$.
  *   **Motivating Case:** The same data should not support both "All ravens are black" and "Some ravens are not black."
  *   **Status:** **Non-negotiable.** Violation renders the triage system action-paralyzed. *All serious accounts satisfy this, usually by making confirmation relative to background knowledge.*

  **5. The Empirical Scope Condition**
  *   **Condition:** The account must handle statistical hypotheses (e.g., "90% of ravens are black") and existential hypotheses (e.g., "There exists a white raven"), not just universal conditionals.
  *   **Motivating Case:** Scientific databases contain frequency data and anomaly reports, not just universal laws.
  *   **Status:** **Non-negotiable.** A triage system limited to universal generalizations is useless for empirical science. *Probabilistic accounts handle this naturally; syntactic accounts struggle without significant modification.*

  **6. The Total Evidence Condition**
  *   **Condition:** Confirmation verdicts must be relative to the conjunction of all available evidence and background knowledge $K$, not just the new observation $E$.
  *   **Motivating Case:** Observing a black raven confirms the hypothesis only if we do not already know the raven was selected from a box of black objects.
  *   **Status:** **Non-negotiable.** Ignoring selection bias renders the triage system vulnerable to sampling errors. *Subjective probabilistic accounts build this in; qualitative accounts must add it as a constraint.*

  **7. The Existential Import Condition**
  *   **Condition:** The account must specify confirmation behavior when the subject class is empty (no ravens exist) or finite and exhaustible (all ravens have been checked).
  *   **Motivating Case:** If no ravens exist, "All ravens are black" is vacuously true; does observing a non-black non-raven confirm it?
  *   **Status:** **Non-negotiable.** An automated system must not crash or return null on empty queries. *Logical accounts often imply vacuous confirmation; probabilistic accounts assign prior probabilities to existence.*

  **8. The Non-Black Non-Raven Condition**
  *   **Condition:** The account must explicitly state whether a non-black non-raven (e.g., a white shoe) confirms "All ravens are black," and if so, why the intuition of irrelevance exists.
  *   **Motivating Case:** The Raven Paradox turns on whether a white shoe provides any support whatsoever.
  *   **Status:** **Camp-Specific (Paradox Resolution).** *Logical accounts accept confirmation (counter-intuitive); Probabilistic accounts often deny it or minimize it via background knowledge (counter-logical).*

  **9. The Phenomenological Condition**
  *   **Condition:** The account must explain the *appearance* of paradox (why the confirmation of a white shoe feels wrong) rather than merely asserting a verdict that dissolves it.
  *   **Motivating Case:** A theory that says "white shoes confirm" without explaining human resistance fails to guide interface design for human analysts.
  *   **Status:** **Non-negotiable.** For a triage system to be trusted, its outputs must align with or successfully correct user intuition. *Few accounts address this explicitly, treating it as a psychological rather than logical problem.*

  ### Proposed Desiderata (Automated Triage Constraints)

  **10. Auditability**
  *   **Condition:** Two analysts (or system instances) handed the same written evidence record and explicitly stated background assumptions must reach the same confirmation verdict; no parameter may depend on unstated senses of naturalness, salience, or "live" alternatives.
  *   **Motivating Case:** One record reads "this shoe is neither a raven nor black"; another reads "this shoe is white leather." The system must not yield different confirmation values based on which predicate is treated as "natural."
  *   **Status:** **Non-negotiable (System Requirement).** This is required for software implementation. *This excludes subjective Bayesian accounts (priors vary by analyst) and natural-kind solutions (naturalness is often implicit).*

  **11. Boundedness**
  *   **Condition:** Confirmation drawn from an unboundedly available and cheaply repeatable class of observations must not be accumulable, even in principle, into evidence as strong as confirmation drawn from a bounded, costly class.
  *   **Motivating Case:** A million white shoes must not outweigh a single black raven, regardless of the arithmetic of small increments.
  *   **Status:** **Camp-Specific (Resource-Constrained).** This is pressed by the triage purpose to prevent resource exhaustion on trivial data. *This excludes standard probabilistic accounts where likelihood ratios multiply without bound.*

  **12. Calibration**
  *   **Condition:** Where the account assigns degrees of confirmation, there must be a fact of the matter, in the long run, about whether assignments of a given magnitude are borne out; hypotheses receiving a large boost must come out true proportionally more often than those receiving a small one.
  *   **Motivating Case:** If the system tags hypotheses as "90% confirmed," roughly 90% of them should eventually be verified.
  *   **Status:** **Non-negotiable (System Validation).** Without this, the triage system cannot be tested for performance. *This excludes purely coherentist accounts and logical probability accounts where degrees do not track truth frequencies.*

  ### Impossibility Results

  The following subsets of conditions cannot be jointly satisfied. In each case, a theory must surrender at least one condition to remain coherent.

  **Subset A: The Paradox Cluster (Equivalence + Auditability + Non-Black Non-Raven Intuition)**
  *   **Conflict:** If logically equivalent hypotheses must be confirmed by the same evidence (Equivalence), and the evidence record is syntax-neutral (Auditability), then a white shoe *must* confirm "All ravens are black" (via the contrapositive). This violates the strong intuition that white shoes do not confirm (Non-Black Non-Raven Condition).
  *   **Surrender:** To satisfy Auditability and Equivalence, you must surrender the intuition that white shoes do not confirm. You must accept they confirm, and use the Phenomenological Condition to explain why it feels like they don't.
  *   **Source:** This is forced by the shape of the conditions themselves; it is the formal core of the Raven Paradox hardened by the requirement for syntactic neutrality.

  **Subset B: The Accumulation Cluster (Boundedness + Standard Probabilistic Aggregation)**
  *   **Conflict:** Standard probabilistic accounts aggregate evidence by multiplying likelihood ratios. If a white shoe provides any confirmation greater than zero (as required by Equivalence), a sufficient number of shoes will mathematically outweigh a single raven. This violates Boundedness.
  *   **Surrender:** To satisfy Boundedness, you must surrender standard probabilistic aggregation. You must adopt a confirmation measure that saturates or a decision-theoretic cap that prevents cheap evidence from accumulating infinite weight.
  *   **Source:** This is an artifact of the formulation of Boundedness against standard mathematics; the literature treats this as a pragmatic constraint, but here it is an epistemic constraint that breaks the calculus.

  **Subset C: The Objectivity Cluster (Calibration + Internal Coherence as Sole Norm)**
  *   **Conflict:** Accounts that define confirmation solely by internal coherence (logical consistency or subjective probability axioms) guarantee no link to external truth. Calibration requires a long-run link to truth.
  *   **Surrender:** To satisfy Calibration, you must surrender the idea that coherence is sufficient. You must import an external semantic link (e.g., objective chances or frequentist grounding) that coherence-based accounts explicitly reject.
  *   **Source:** This is forced by the shape of the conditions; the literature treats this as the divide between objective and subjective Bayesianism.

  ### Closing Judgment

  Calibration is the single most exclusionary condition because it demands an external semantic link to truth that the majority of candidate accounts—whether syntactic, coherence-based, or subjective—explicitly disavow in favor of internal consistency or logical relations.
