prompt: |-
  I am drafting the specification for a priority-setting procedure that ranks public health interventions by expected welfare gain per person affected, and before anyone defends it I want to know what it is entitled to assume about comparing one person's utility with another's. Write the desiderata: what any adequate account of interpersonal utility comparison must deliver in order to underwrite that use, with the case or result behind each requirement.

  The list should confront at least the following. Why cardinal utilities fixed only up to a positive affine transformation for each person separately leave cross-person comparisons underdetermined, and what a non-arbitrary common origin and common unit would have to consist in rather than merely be stipulated. How the account is to treat intensity reports from people whose baselines differ through adaptation or long deprivation, so that equal numbers do not silently mean equal welfare. And the gap between saying what makes a comparison true and saying how a committee that can introspect neither subject could come to know it — an account that collapses the second into the first has not answered the question I am asking.

  Mark which requirements are non-negotiable given the intended use and which are really the metaphysical preferences of a particular camp, and identify any subset you believe cannot be jointly satisfied; if the specification turns out to be incoherent, that is the result I most want. Close with the single requirement that rules out the largest number of candidate accounts. Please write in American English, and include no citations or reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a set of desiderata (requirements) for a specification of a priority-setting procedure in public health.
      *   **Specific Focus:** Interpersonal Utility Comparison (IUC). The procedure ranks interventions by *expected welfare gain per person affected*.
      *   **Key Constraints/Questions to Address:**
          *   Why cardinal utilities (positive affine transformation) are insufficient for cross-person comparisons.
          *   What constitutes a non-arbitrary common origin and unit (not just stipulated).
          *   How to handle intensity reports from people with different baselines (adaptation/deprivation).
          *   The distinction between metaphysics (what makes it true) and epistemology (how a committee knows it).
          *   Mark requirements as "Non-negotiable" vs. "Metaphysical Preferences."
          *   Identify any jointly unsatisfiable subsets (incoherence).
          *   Close with the single requirement that rules out the largest number of candidate accounts.
          *   **Style:** American English, no citations, no reading list.
          *   **Tone:** Rigorous, analytical, specification-oriented.

  2.  **Deconstruct the Core Problem:**
      *   The user wants to rank public health interventions by *welfare gain per person*. This implies summing or averaging welfare changes across individuals.
      *   Standard von Neumann-Morgenstern (vNM) utility is cardinal but only unique up to positive affine transformations ($u' = au + b$, where $a > 0$).
      *   To compare Person A's gain to Person B's gain, we need to fix $a$ and $b$ across persons. We need a common zero (origin) and a common scale (unit).
      *   *Problem 1 (Origin/Unit):* Without a common zero, we don't know if A's gain is from a lower baseline than B's. Without a common unit, we don't know if 1 util for A equals 1 util for B.
      *   *Problem 2 (Adaptation/Deprivation):* People adapt to bad conditions (hedonic treadmill). A deprived person might report high satisfaction with a small improvement, while a privileged person reports low satisfaction with the same objective improvement. The metric needs to capture *welfare*, not just *reported satisfaction*.
      *   *Problem 3 (Epistemology vs. Metaphysics):* The committee can't read minds. They need observable proxies. But the specification must define what *makes* the comparison valid, not just how to guess it. Collapsing these leads to operationalism, which fails the "truth" condition.
      *   *Problem 4 (Coherence):* Is it possible to satisfy all these? Many philosophers argue IUC is impossible or meaningless. The prompt asks to identify incoherence if it exists.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Scale Fixity.* vNM utility isn't enough. We need level comparability and unit comparability.
          *   *Status:* Non-negotiable for the math to work.
      *   *Requirement 2: Non-Arbitrary Zero/Unit.* Can't just say "let 0 be death and 1 be perfect health." That's stipulation, not measurement. Needs a grounding in human nature or phenomenology.
          *   *Status:* Non-negotiable for validity, but hard to satisfy.
      *   *Requirement 3: Adaptation Neutrality.* Must correct for adaptive preferences.
          *   *Status:* Non-negotiable for *welfare* (vs. preference satisfaction).
      *   *Requirement 4: Epistemic Accessibility.* The committee must be able to estimate this without telepathy.
          *   *Status:* Non-negotiable for *use*, but distinct from metaphysics.
      *   *Requirement 5: Metaphysical Realism.* There must be a fact of the matter independent of the measurement.
          *   *Status:* Metaphysical Preference (some accounts are constructivist).

  4.  **Addressing the Specific Prompts:**
      *   *Affine Transformation:* Explain that $U_A$ and $U_B$ can be scaled differently. To compare $\Delta U_A$ and $\Delta U_B$, we need to fix the $a$ and $b$ parameters across persons.
      *   *Common Origin/Unit:* Must be grounded in a shared human capacity (e.g., neural firing, phenomenological intensity) not just a policy decision.
      *   *Adaptation:* The metric must measure objective welfare potential or corrected subjective states, not raw self-reports.
      *   *Truth vs. Knowledge:* Distinguish the truth-maker (neural state, phenomenological fact) from the evidence (survey, behavior).

  5.  **Identifying Incoherence:**
      *   The "Adaptation Neutrality" + "Epistemic Accessibility" + "Metaphysical Realism about Subjective Welfare" triad is notoriously difficult.
      *   If welfare is subjective (phenomenological), adaptation changes the welfare. If we correct for it, we are imposing an objective standard.
      *   If we impose an objective standard (e.g., capability approach), we move away from "utility."
      *   *Crucial Tension:* Non-arbitrary common unit vs. Epistemic accessibility without introspection. If the common unit is neural, can we measure it cheaply? If it's phenomenological, how do we compare qualia?
      *   *Verdict:* The specification is likely incoherent if it demands *objective non-arbitrary units* based on *subjective welfare* accessible by *external observation* while correcting for *adaptation*.

  6.  **Refining the List:**

      *   *Req 1: Full Level and Unit Comparability.* (Non-negotiable).
      *   *Req 2: Grounded Zero and Unit.* (Non-negotiable).
      *   *Req 3: Adaptation Correction.* (Non-negotiable).
      *   *Req 4: Epistemic Tractability.* (Non-negotiable for the committee).
      *   *Req 5: Mind-Independent Truth Conditions.* (Metaphysical Preference).

  7.  **Determining the "Killer" Requirement:**
      *   Which one kills the most theories?
      *   "Grounded Zero and Unit" (Req 2) kills standard economics (ordinal/cardinal without interpersonality).
      *   "Adaptation Correction" (Req 3) kills pure preference satisfaction accounts.
      *   "Epistemic Tractability" (Req 4) kills philosophical realism that posits unmeasurable facts.
      *   Actually, **Req 2 (Grounded Zero and Unit)** is the strongest filter. Most accounts either accept arbitrariness (conventionalism) or deny comparability entirely. Finding a non-arbitrary anchor is the hardest philosophical lift.

  8.  **Drafting the Content (incorporating constraints):**
      *   Use American English.
      *   No citations.
      *   Clear marking of Non-negotiable vs. Metaphysical.
      *   Highlight the incoherence risk.

  9.  **Review against Constraints:**
      *   *Did I explain the affine transformation issue?* Yes, in the rationale for Req 1.
      *   *Did I address common origin/unit?* Yes, in Req 2.
      *   *Did I address adaptation?* Yes, in Req 3.
      *   *Did I address truth vs. knowledge?* Yes, in Req 4 & 5 distinction.
      *   *Did I mark negotiability?* Yes.
      *   *Did I identify incoherence?* Yes, specifically between Adaptation Correction and Subjective Grounding.
      *   *Did I close with the single ruling-out requirement?* Yes.

  10. **Final Polish:** Ensure the tone is bureaucratic yet philosophically sharp, matching the "specification drafting" context. (Self-Correction: Make sure not to sound *too* academic, but rather like a technical specification document analyzing its own philosophical prerequisites.)

      *   *Refining the "Incoherence" section:* Be precise. The tension is between wanting to respect subjective experience (utility) while overriding subjective reports (adaptation) using objective measures (epistemology) that claim to track non-arbitrary facts (metaphysics).
      *   *Refining the "Killer" requirement:* The demand for a *non-arbitrary* common unit is the biggest hurdle. Conventionalism is the easy way out; this spec forbids it.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Specification Appendix: Prerequisites for Interpersonal Utility Comparison

  **Purpose:** This document defines the necessary conditions for any account of interpersonal utility comparison (IUC) intended to underwrite a priority-setting procedure that ranks public health interventions by expected welfare gain per person affected. The procedure requires summing welfare changes across distinct individuals. Consequently, the account of utility must support more than individual rational choice; it must support aggregation.

  **Status of Requirements:** Each requirement below is marked as either **Non-Negotiable** (the procedure fails mathematically or ethically without it) or **Metaphysical Preference** (the procedure could theoretically function with an alternative ontological commitment, though this specification adopts the stated view).

  ---

  ### 1. Full Cardinal Comparability
  **Status:** Non-Negotiable
  **Rationale:** Standard decision theory assigns each individual a utility function unique only up to a positive affine transformation ($u' = au + b$, where $a > 0$). This fixes the scale and origin for that individual but leaves them unanchored relative to others. If Person A's utility is measured in "decibels" and Person B's in "meters," summing their gains is mathematically meaningless.
  **Requirement:** The account must fix both the unit (scale factor $a$) and the zero-point (origin $b$) identically across all persons. It must deliver a fact of the matter regarding whether a specific change in utility for Person A is greater than, equal to, or less than a specific change for Person B. Mere ordinal ranking or individual cardinality is insufficient.

  ### 2. Non-Arbitrary Grounding of Origin and Unit
  **Status:** Non-Negotiable
  **Rationale:** A committee could stipulate a common zero (e.g., "death = 0") and a common unit (e.g., "one year of healthy life = 1"). However, stipulation is conventional, not factual. If the zero and unit are merely agreed upon for convenience, the resulting welfare gains are artifacts of the policy, not discoveries about human well-being. This renders the priority-setting procedure arbitrary.
  **Requirement:** The account must identify a naturalistic or phenomenological feature common to all persons that anchors the zero-point and the unit. This feature cannot be a policy decision. It must consist in a shared capacity (e.g., neural processing capacity, phenomenological intensity of experience, or satisfaction of objective needs) that exists independently of the committee's measurement conventions. The account must explain why this feature justifies treating one person's unit as equivalent to another's.

  ### 3. Adaptation and Baseline Neutrality
  **Status:** Non-Negotiable
  **Rationale:** Individuals adapt to chronic deprivation or privilege. A person raised in severe deprivation may report high satisfaction from a minor improvement, while a privileged person may report low satisfaction from a major improvement. If the metric relies on raw self-reports or revealed preferences, it will systematically undervalue interventions for the deprived and overvalue interventions for the privileged. Equal numbers would not signify equal welfare.
  **Requirement:** The account must distinguish between *reported* utility and *true* welfare gain. It must provide a mechanism to correct for adaptive preferences and hedonic treadmill effects. The metric must measure the capacity for welfare or the objective improvement in functioning, ensuring that a unit of gain represents an equivalent improvement in human flourishing regardless of the subject's prior baseline or psychological adaptation.

  ### 4. Epistemic Accessibility (The Measurement Gap)
  **Status:** Non-Negotiable
  **Rationale:** There is a distinction between what makes a comparison true (metaphysics) and how a committee comes to know it (epistemology). An account that posits facts about utility that are in principle unobservable by third parties is useless for public policy. Conversely, an account that defines utility *solely* by what is observable (operationalism) often fails Requirement 2 by making the unit arbitrary.
  **Requirement:** The account must specify observable proxies or measurement procedures that allow a committee to estimate interpersonal comparisons with acceptable error margins, without requiring introspection into the subjects' minds. Crucially, the account must not collapse the truth conditions into the measurement procedure. It must affirm that the comparison is true or false independently of the measurement, while simultaneously guaranteeing that the measurement tracks that truth.

  ### 5. Mental State Realism
  **Status:** Metaphysical Preference
  **Rationale:** Some accounts ground utility in objective list theories (capabilities, functionings) rather than mental states. While compatible with aggregation, this shifts the definition of welfare away from experience.
  **Requirement:** This specification assumes welfare is ultimately grounded in the conscious experience or mental states of the individuals affected. The account must treat utility as a property of the person's phenomenology or psychology, not merely as a count of external resources or capabilities, unless those resources are strictly instrumental to the mental state.

  ---

  ### Analysis of Joint Satisfiability

  **Identified Incoherence:**
  There is a high probability that Requirements 2, 3, and 4 cannot be jointly satisfied.

  1.  **The Tension:** Requirement 2 demands a non-arbitrary, naturalistic anchor for utility (e.g., neural intensity or phenomenological quality). Requirement 3 demands that we correct for subjective reports when they are distorted by adaptation. Requirement 4 demands that the committee can measure this without introspection.
  2.  **The Conflict:** If the anchor is phenomenological (subjective experience), then adaptation changes the experience, making the "corrected" value (Req 3) diverge from the "true" mental state (Req 5). If the anchor is objective (e.g., neural firing), we face the problem of explaining why neural firing equates to welfare (Req 2) and how to measure it non-invasively in a public health setting (Req 4).
  3.  **Conclusion:** An account that satisfies the demand for a non-arbitrary common unit (Req 2) typically relies on metaphysical claims that are epistemically inaccessible to a public committee (violating Req 4). An account that satisfies epistemic accessibility (Req 4) typically relies on standardized surveys or behaviors that are vulnerable to adaptation effects (violating Req 3) or are merely conventional stipulations (violating Req 2). The specification risks demanding a "view from nowhere" that is simultaneously objective, measurable, and resistant to psychological distortion.

  ---

  ### The Exclusionary Requirement

  **Requirement 2 (Non-Arbitrary Grounding of Origin and Unit)** rules out the largest number of candidate accounts.

  **Reasoning:**
  *   It eliminates **Standard Welfare Economics**, which treats utility as ordinal or cardinally measurable only within persons, regarding interpersonal comparisons as value judgments rather than facts.
  *   It eliminates **Conventionalism**, which accepts interpersonal comparisons only as useful fictions or policy stipulations.
  *   It eliminates **Pure Preference Satisfaction**, which lacks a common unit for comparing the intensity of preferences across persons.
  *   It eliminates **Behaviorism**, which cannot ground a common unit of internal welfare without reference to unobservable states.
  *   It places a heavy burden on **Neuroscientific Utilitarianism** and **Phenomenological Realism**, requiring them to solve the hard problem of consciousness and measurement simultaneously.

  By insisting that the common origin and unit be discovered rather than stipulated, this requirement filters out nearly all operational frameworks currently in use, leaving only robust realist accounts of human welfare that have yet to be fully operationalized.
