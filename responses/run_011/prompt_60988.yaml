              *   *Why this fails:* If the nudge *changed* their preference to align with the nudge, asking them afterwards confirms the nudge worked, not that it aligned with their *prior* or *independent* judgment. Ex-post rationalization is not the same as ex-ante welfare. If I nudge you to eat apples, and then you eat apples, and then I ask "Do you like apples?" and you say "Yes" (because you've now gotten used to them), that doesn't prove the nudge served your *original* interests. It proves adaptation.
