answer: |-
  Here is the analysis of the 1883 Standard Time event through the framework of David Lewis's *Convention: A Philosophical Study* (1969), adhering to the facts provided and marking the limits of the theory.

  ### 1. The Mapping: Population and Game Structure

  **The Population ($P$):**
  Lewis requires a defined population in which the regularity holds. In 1883, this is not a single monolithic $P$, but a nested hierarchy.
  *   **$P_1$ (The Railroads):** This is the core Lewisian population. The railroad managers faced a strict coordination problem. If Railroad A runs on Pittsburgh time and Railroad B runs on Chicago time, collisions and missed connections occur. They have a shared interest in a single equilibrium.
  *   **$P_2$ (The Towns/Public):** This population plays a different game. For a town like Detroit or Cleveland, the choice is not symmetric. They prefer Local Mean Time (LMT) for solar alignment but prefer Standard Time (ST) to align with the Railroads (the dominant economic interface).

  **The Game:**
  It is **two nested games**, not one.
  1.  **Railroads:** A pure coordination game. Any unified system is better than none. The "General Railway Time" adopted in October 1883 is the equilibrium $R$.
  2.  **Towns vs. Railroads:** A "Follow-the-Leader" or asymmetric coordination game. The towns prefer to match the Railroads ($R$) rather than maintain LMT ($R'$), *conditional* on the Railroads sticking to $R$.

  **Lewis's Conditions in 1883:**
  *   **Regularity:** Yes. After Nov 18, clocks were reset.
  *   **Expectations:** Yes. The telegraph signal from the Naval Observatory and the "Official Railway Guide" created mutual expectations among $P_1$. $P_2$ formed expectations based on $P_1$'s dominance.
  *   **Conditional Preference:** Holds for $P_1$. For $P_2$, it is mixed. They prefer $R$ only because the cost of non-conformity (missing trains, market isolation) outweighs the cost of solar mismatch.
  *   **Common Knowledge:** This is the fracture point. Lewis (1969) strictly requires common knowledge (I know that you know that I know...). In 1883, while railroad managers likely had common knowledge via their Chicago meeting, the general public did not. A farmer in Ohio knew his clock changed, but did he know that *everyone else* knew? Lewis later acknowledged (in response to critiques) that "reason to believe" suffices, but under the strict 1969 definition, the public adoption was not yet a full convention on day one; it was a cascade of expectations that *became* common knowledge over the "year or so" mentioned in your facts.

  ### 2. Arbitrariness and Distributive Conflict

  **Lewis's Criterion:**
  A convention must be arbitrary: there must be at least one other regularity $R'$ that could have solved the coordination problem.
  *   **Verdict:** Yes. They could have chosen a single meridian for the whole continent (e.g., Washington time everywhere). They could have drawn zone lines differently. The specific choice of five zones centered on specific meridians was arbitrary in the Lewisian sense.

  **The Distributive Problem:**
  You note that towns on the "wrong side" of a line lobby to move. This exposes a limit in Lewis. Lewis assumes that in a coordination problem, players are indifferent between equilibria *provided everyone picks the same one*.
  *   **The Conflict:** Here, the choice of equilibrium is not indifferent. A town on the western edge of the Eastern Zone loses solar noon alignment compared to if it were in the Central Zone. The selection of $R$ has distributive consequences (who loses 30 minutes of daylight).
  *   **Lewis's Silence:** Lewis's framework treats preferences as exogenous. It does not account for the *political struggle* over which arbitrary equilibrium is selected. If the choice of $R$ benefits the Railroads at the expense of local solar time, Lewis's model describes the resulting stability but cannot explain the friction (the lobbying). Arbitrariness survives in the *structural* sense (another grid works), but fails in the *political* sense (another grid changes winners and losers). Lewis lacks the vocabulary for "equilibrium selection as power."

  ### 3. Framework Limits: Law, Statute, and the Attorney General

  **The AG's Refusal (1883–1918):**
  The Attorney General's order that federal departments not run on railroad time highlights the distinction between **convention** and **law**.
  *   **Lewis's View:** Conventions are self-policing via expectations and conditional preferences. Laws are enforced by sanctions.
  *   **Analysis:** From 1883 to 1918, Standard Time was a Lewisian convention. It persisted because everyone expected everyone else to use it, not because the federal government punished deviations. The AG's refusal confirms this: the federal government was the only major actor *outside* the convention population $P$.
  *   **1918 Ratification:** When Congress passed the Standard Time Act, the regularity ceased to be a pure convention and became a **legal mandate**.
  *   **Is it still a convention?** Lewis would say no, or at least, it is a "convention backed by law." Once the preference to conform shifts from "because you do" to "because I will be fined," the Lewisian conditions change. The theory explains the 1883–1918 period perfectly. It goes quiet on the *transition*. Lewis does not provide a mechanism for how a convention crystallizes into statute, other than implying that the convention makes the statute possible.

  ### 4. Detroit 1900 as the Control

  **The Failure:**
  Detroit held local time until 1905. When the council ordered the switch, half obeyed and half refused.
  *   **Broken Condition:** Lewis's first condition is "Everyone conforms to $R$." Detroit failed this. Consequently, condition two ("Everyone expects everyone to conform") also collapsed.
  *   **Population Boundaries:** This reveals a hidden assumption in Lewis: the population $P$ must be salient and unified. In Detroit, the population was fractured (likely along class or industry lines, given Ford's involvement).
  *   **Lewis's Deficit:** Lewis assumes the population is given. Detroit shows that defining *who is in the game* is part of the conflict. If half the city refuses to play the coordination game, the convention cannot establish. Lewis's account needs a supplement regarding **population cohesion**. A convention cannot emerge if the "population" is actually two hostile sub-populations with incompatible preferences regarding the equilibrium itself.

  ### 5. Coordination vs. Power (The E.P. Thompson Critique)

  **Thompson's View:**
  Time discipline is not about coordination; it is about capitalist control. The railroads imposed time to discipline labor and synchronize markets for their benefit.
  *   **Lewis's Blind Spot:** Lewis's framework is methodologically individualist and neutral. It takes preferences as given. It cannot distinguish between a convention that emerges from mutual benefit (two drivers agreeing to drive on the right) and a convention that emerges from coercion (a master telling slaves when to work).
  *   **The Distinction:** If the Railroads had the power to *force* the time regardless of public preference, it is not a coordination problem; it is a command. However, the facts show towns *could* resist (Detroit did). This suggests the Railroads needed public buy-in to function (schedules require passengers to show up).
  *   **Verdict:** Lewis's apparatus **cannot distinguish** coordination from hegemony. If the power move is successful enough to create the *expectation* of conformity, Lewis classifies it as a convention. He lacks the vocabulary to analyze *why* the preferences are aligned (e.g., economic dependency). He describes the *structure* of the agreement, not the *genealogy* of the power that secured it.

  ### 6. Prediction: Permanent Daylight Saving Time (DST)

  **Current Situation:**
  Federal law (Uniform Time Act) allows states to opt out to Standard Time, but not to Permanent DST.
  *   **Lewisian Diagnosis:** This is **not** a Lewisian convention fight. It is a legislative constraint fight.
  *   **Why:** A Lewisian convention requires that the regularity be self-sustaining via mutual expectations. Currently, the regularity (changing clocks twice a year) is sustained by federal statute. If the statute vanished tomorrow, would we still change clocks? Perhaps, due to habit (convention), but the current friction is legal.
  *   **Prediction:** Lewis's theory predicts that if Congress legalizes Permanent DST, a new convention will form *only if* the public expectations align. If Congress mandates it but half the population refuses to adjust their internal schedules (the "Detroit scenario"), the convention will fail, and chaos will ensue until a new equilibrium is found.
  *   **Where Lewis is Silent:** Lewis offers no prediction on **legislative outcomes**. He analyzes social regularities that *exist*, not the political machinery required to *create* them. He cannot tell us if Permanent DST will succeed, only that for it to become a *convention*, it must eventually become self-policing independent of the threat of federal preemption.
  *   **The Asymmetry:** The fact that states can opt out to Standard but not DST suggests the "population" is not sovereign over the rule. Lewis assumes the population $P$ is the authority on the convention. Here, the authority is external (Congress). Lewis is genuinely silent on conventions that are top-down mandated but bottom-down enforced.

  ### Summary of Theoretical Fit

  | Feature | Lewisian Fit | Notes |
  | :--- | :--- | :--- |
  | **1883 Railroad Switch** | **High** | Classic coordination equilibrium among managers. |
  | **Public Adoption** | **Medium** | Relies on "reason to believe" rather than strict common knowledge. |
  | **Arbitrariness** | **High** | Other zones were possible, though distributive costs complicate this. |
  | **Detroit Resistance** | **Low** | Exposes Lewis's failure to account for fractured populations. |
  | **1918 Statute** | **None** | Lewis distinguishes convention from law; does not model the merger. |
  | **Power/Thompson** | **None** | Lewis lacks vocabulary for coercion/hegemony masquerading as coordination. |
  | **Current DST Fight** | **Low** | Currently a legal battle, not a spontaneous convention emergence. |

  **Final Verdict:** Lewis explains the *stability* of Standard Time once established (1883–1918) better than any other framework. He fails to explain the *politics* of its selection (why these zones?), the *resistance* to it (Detroit), and the *transition* to law (1918). He treats the railroad's power as just another preference input, missing the structural coercion highlighted by Thompson. Regarding Permanent DST: Lewis would say it is not yet a convention, and cannot become one until the federal government removes the legal barrier, allowing the social regularity to stand on its own expectations.
