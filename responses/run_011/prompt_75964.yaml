answer: |-
  Dear Colleague,

  It is a pleasure to address a query from someone who understands that a theorem is only as strong as the physical—or in this case, normative—reality its hypotheses describe. Your instinct to treat Harsanyi's result with the same respect you accorded Bell's is admirable, but I fear the analogy, while illuminating, conceals a fissure that your crystallographer colleague will likely exploit.

  You ask for a clear-minded assessment of where the analogy breaks down, which hypothesis the Rawlsian must surrender, and whether your understanding of the theorem's handling of interpersonal comparability is correct. I shall take these in turn, aiming for the precision you would expect in a seminar on statistical mechanics.

  ### 1. The Bell Analogy: Coherence vs. Reality

  Your intuition that Harsanyi's theorem has the architecture of a no-go result is correct. It states: *If* you accept axioms $A, B, C$, *then* your social welfare function must take form $F$.

  However, the breakdown in the analogy lies in the status of the hypotheses.
  *   **Bell's Theorem:** The hypotheses (locality, realism) are claims about the structure of the physical world. If experiment violates the inequality, nature itself forbids the conjunction of those hypotheses.
  *   **Harsanyi's Theorem:** The hypotheses (vNM rationality for individuals, vNM rationality for society, Pareto unanimity) are *normative* constraints on coherence.

  If a Rawlsian rejects the conclusion (Utilitarianism), she is not claiming a mathematical error in your derivation. She is claiming that one of the normative axioms is morally inadmissible. In physics, discarding a hypothesis because you dislike the conclusion is bad science. In moral philosophy, it is the primary method of theory selection. The "cost" she pays is not logical inconsistency, but the abandonment of a specific moral intuition (e.g., that rationality under risk must always follow expected utility).

  ### 2. A Correction on Interpersonal Comparability

  I must gently correct a significant misconception in your summary, one that is crucial for your Tuesday presentation. You wrote:

  > *"if each utility is fixed only up to a rescaling and a shift and the sum is nonetheless well defined, then interpersonal comparability has been secured rather than smuggled in."*

  This is, regrettably, not the case. This is the point where many physicists find the literature slippery.

  In von Neumann–Morgenstern (vNM) theory, an individual's utility function $u_i$ is unique only up to a positive affine transformation: $u'_i = a_i u_i + b_i$ (where $a_i > 0$).
  Harsanyi's Aggregation Theorem proves that the social welfare function $W$ is a linear combination of individual utilities:
  $$W = \sum_{i=1}^n c_i u_i + k$$
  However, the theorem **does not** determine the coefficients $c_i$. It merely proves they exist.

  To move from "weighted utilitarianism" to "classical utilitarianism" (equal weights), you must argue that $c_i = c_j$ for all $i, j$. This requires a normative argument about impartiality (Harsanyi's Veil of Ignorance), but it *also* requires that the units of $u_i$ and $u_j$ are comparable. If Alice's "util" is measured in joules and Bob's in ergs, summing them is nonsense even with equal weights.

  The vNM axioms secure *intrapersonal* cardinality (Alice can compare her own risk trade-offs), but they do **not** secure *interpersonal* cardinality. The theorem does not solve the measurement problem; it assumes a framework where such a sum is meaningful. Harsanyi argues we can normalize these scales via the Veil of Ignorance, but Rawls disputes the rationality of the choice made behind that Veil. So, you are right to be suspicious: interpersonal comparability is not mathematically secured by the aggregation theorem alone. It is a normative premise smuggled in via the impartiality argument.

  ### 3. The Rawlsian Escape: Which Axiom to Surrender?

  Your colleague wishes to defend the Difference Principle. To do so consistently, she must reject one of Harsanyi's premises. The cleanest, most defensible route for her is to reject the requirement that **Society's preferences over risky prospects must satisfy the vNM Independence Axiom.**

  Here is the technical breakdown:
  1.  **Harsanyi's Setup:** Behind the Veil of Ignorance, you do not know who you will be. This is a lottery. Harsanyi argues a rational agent maximizes *expected utility*. This implies risk-neutrality regarding the *assignment* of social positions.
  2.  **Rawls's Setup:** Rawls agrees the Veil involves uncertainty. However, he argues that because the choice is fundamental (it determines your life prospects), non-recoverable, and concerns basic liberties, the **Maximin Rule** is more rational than Expected Utility Maximization.

  **The Conflict:** The Maximin rule violates the vNM **Independence Axiom** (and the Continuity Axiom).
  *   *Independence:* If you prefer $A$ to $B$, you should prefer a lottery $(pA + (1-p)C)$ to $(pB + (1-p)C)$.
  *   *Maximin:* You choose the option where the worst possible outcome is least bad. This ignores the probabilities of better outcomes if the worst outcome is fixed.

  **The Cost:** By rejecting the Independence Axiom for social choice, your colleague accepts that society should be insensitive to the *magnitude* of probabilities for gains above the minimum.
  *   *Example:* Suppose Option X gives the worst-off person 10 units with probability 0.99 and 100 units with probability 0.01. Option Y gives the worst-off person 11 units with certainty.
  *   A Harsanyi Utilitarian (Expected Utility) might prefer X if the upside is high enough.
  *   A Rawlsian (Maximin) strictly prefers Y, regardless of how small the risk in X is, because the floor is higher.

  She must be prepared to defend the claim that it is rational to ignore a 99% chance of a massive gain to secure a marginal improvement for the worst-case scenario. This is the "price" of the Difference Principle in this formal context.

  ### 4. What is Left for Distribution?

  You asked what role distribution plays once the sum is fixed.
  *   **In Harsanyi's Utilitarianism:** Distribution has no *intrinsic* value. It matters only instrumentally via **diminishing marginal utility**. If transferring wealth from rich to poor increases the sum total of utility, you do it. But if the rich person values the money more (perhaps due to efficiency or incentive), the theorem permits extreme inequality.
  *   **In Rawls's View:** Distribution is intrinsic. The shape of the curve matters independently of the sum. The "sum" is not even the metric of evaluation.

  If your colleague accepts Harsanyi's axioms, she cannot consistently hold the Difference Principle. She must argue that the axioms themselves fail to capture the moral reality of social risk.

  ### 5. Strategy for the Third Tuesday

  Do not attempt to prove her mathematically wrong. Instead, frame the disagreement as a choice between two models of rationality under uncertainty.

  1.  **Challenge the "Units":** Point out that Harsanyi's theorem does not solve the interpersonal comparison problem. Ask her: "On what physical or normative basis do we equate the scale of my utility function with yours?" If Harsanyi relies on the Veil to set the scale, ask if the Veil assumes risk-neutrality that begs the question.
  2.  **Isolate the Independence Axiom:** Ask her directly: "Do you agree that social choice under uncertainty must satisfy the Independence Axiom?" If she says no (to save Maximin), acknowledge that this is a valid rejection of Harsanyi's *rationality* constraint, not his math.
  3.  **The "Strains of Commitment":** Use Rawls's own language. The cost of accepting Harsanyi is accepting that one might be forced to consent to a social system where one ends up in a miserable position, provided the *average* utility was high enough. Rawls argues no rational agent would accept that risk.

  **Summary for your notes:**
  *   **Analogy Breakdown:** Harsanyi's axioms are normative, not physical. Rejecting them is a moral choice, not a logical error.
  *   **Comparability:** The theorem does *not* secure interpersonal comparability. It requires equal weights as a separate normative input.
  *   **Axiom to Drop:** The vNM **Independence Axiom** (applied to social choice).
  *   **Cost:** Insensitivity to probability magnitudes above the worst-case floor.

  I hope this saves you from any embarrassment on the third Tuesday. It is a rare privilege to discuss the thermodynamics of irreversible processes and the thermodynamics of social choice in the same lifetime; I suspect the latter is the more entropy-prone of the two.

  Yours sincerely,

  A Fellow Traveller in Formalism
