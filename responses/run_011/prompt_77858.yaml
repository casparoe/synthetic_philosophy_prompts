  **Brainstorming**

  Three competing metaphysical readings present themselves. First, the *coincidence reading*: Jekyll and Hyde are distinct persons constituted by the same body at different times, analogous to statue and clay. Cost: They are never co-present, violating the synchronic requirement of standard coincidence puzzles. Second, the *phase reading*: One organism persists, possessing different person-stages (Jekyll-phase, Hyde-phase). Cost: This reduces the ontological distinctness Jekyll insists upon, making Hyde merely a mode of Jekyll. Third, the *two-bodies reading*: The drug literally splits the organism into two distinct biological entities. Cost: The text describes a single bloodstream and chemical transformation, not fission.

  The central tension lies between the spatial metaphor of the house (suggesting co-location) and the temporal reality of the plot (suggesting succession). If we force the synchronic model, we distort the narrative's emphasis on takeover and replacement. If we accept the diachronic model, we shift the seminar from material constitution to personal identity. However, a four-dimensionalist account allows us to treat the organism as a space-time worm constituted by overlapping person-stages. This preserves the metaphysical rigor while respecting the temporal alternation. I will argue that the synchronic frame requires repair via a phase view, but that this repair reveals the text is ultimately more concerned with moral responsibility than ontological categorization. The verdict will acknowledge the shift from synchronic coincidence to diachronic constitution.

  ***

  **House**

  The architecture of Jekyll's residence offers the seminar's first temptation toward a synchronic reading. The building presents a respectable front on one square and a blistered, windowless door on a by-street, yet both entrances open into the same interior structure. Enfield's narrative begins at the rear door, associating it exclusively with Hyde, while the front remains the face of Jekyll. Spatially, this mirrors the coincidence problem: one substance (the building) supporting two distinct access points, two addresses, and two social persons. The structure suggests that Jekyll and Hyde are co-located entities, distinct in identity but sharing a single material substrate, much like the statue and the clay.

  However, this spatial figure risks being merely atmospheric if pressed too hard metaphysically. A building does not possess agency; its duality is static. In the novella, the duality is dynamic and exclusive. When Hyde enters the front, the respectability is compromised; when Jekyll uses the rear, the secrecy is breached. The house does not sustain two simultaneous occupants in the way a lump sustains a statue and a piece of clay. Instead, the architecture maps a social topology onto a single biological locus. It suggests that the coincidence is not of objects, but of reputations. The metaphysical work here is limited: the house establishes the *possibility* of distinct identities inhabiting one container, but it cannot sustain the claim that they inhabit it simultaneously. It sets the stage for coincidence but dramatizes succession.

  **Matter**

  The transformation sequence complicates any account relying on a static constituting lump. Hyde is repeatedly described as smaller, slighter, and younger than Jekyll. In his final statement, Jekyll explains this by suggesting his evil side was less exercised and therefore less developed physically. This introduces a problem of mass variation. If the same lump of matter constitutes both persons, where does the excess mass go when Jekyll becomes Hyde? Does matter vanish and reappear? The text offers no mechanism for material excretion or absorption during the change, only a chemical ingestion.

  This physical discrepancy challenges the dominant-kind response. If the organism is the persisting entity, as the animalist suggests, then the organism itself changes mass significantly without external intake. This strains biological plausibility within the fiction. More critically, it disrupts the sortal conditions for personhood. If Hyde is smaller, is he a different organism? If he is the same organism, then the organism's properties are unstable. For the seminar, this highlights a gap in the standard apparatus: material constitution puzzles usually assume a stable substrate. Stevenson introduces a substrate that fluctuates, suggesting that the constitution relation here is not merely spatial but energetic or vital. The horror lies partly in the body's betrayal of conservation laws, marking Hyde not just as a different person, but as a different physical quantity. The novella thus refuses the comfort of a constant constituting matter, forcing the metaphysician to account for constitution where the constituent itself is mutable.

  **Will**

  Utterson's alarm is triggered not by a monster, but by a legal document. Jekyll's will stipulates that Hyde inherits everything and assumes the estate immediately if Jekyll disappears for more than three months. This instrument functions as the novella's explicit theory of persistence conditions. It encodes a criterion for when Jekyll is to be counted as gone and Hyde as the continuing entity. Legally, it treats Hyde not as a successor in death, but as a continuator in life. The will bypasses the biological event of death, substituting a bureaucratic condition for ontological cessation.

  This legal framing tracks neither biological object nor psychological continuer cleanly. It treats the *estate* as the persisting thing, with the person as a variable manager. The will suggests that social ontology—the person as a bearer of rights and property—can survive the dissolution of the biological subject, provided the legal conditions are met. For the metaphysician, this isolates the person from the organism. The law is willing to count Hyde as Jekyll for the purposes of property, even if the body has changed. This reveals that our practical persistence conditions are often normative rather than descriptive. The will treats Hyde as what remains when Jekyll has ceased, yet it grants him Jekyll's continuity. It is a functionalist account of identity: you are whoever holds the deed, provided the deed says you are him. This complicates the animalist thought, suggesting that in Victorian society, the legal person outweighs the biological organism.

  **Cabinet**

  The final scene in the cabinet crystallizes the problem of what ceases to exist. When the door is broken, a body is found dead, dressed in Jekyll's clothes, which hang far too large for it. Jekyll is nowhere present. On the coincidence view, the Hyde-person has ceased, but the Jekyll-person had already ceased earlier. On the animalist view, the organism has died. The image of the clothes hanging loose is a potent visual metaphor for the mismatch between social shell and biological content. The clothes signify the social person (Jekyll), while the body signifies the biological reality (Hyde).

  What died in that room? If persons are phases, the Hyde-phase ended, and the Jekyll-phase had already ended. If persons are distinct coinciding entities, Hyde died and Jekyll fled (via suicide). The loose clothes suggest that the social container no longer fits the biological content. This contributes to the question of what constitutes a person at a time by showing that constitution is not just about matter, but about fit. When the body no longer fits the clothes, the social person cannot be sustained. The scene implies that personhood is a relation between body and social expectation. When the body shrinks, the social person (Jekyll) can no longer be constituted by it. The horror is not just death, but the visible incompatibility of the remains with the identity they are supposed to support.

  **Composition**

  Jekyll's reflective claim that man is not truly one but truly two sounds mereological, as though a person were a sum of parts. However, his elaboration concerns motives, desires, conscience, and reputation rather than matter. He slides between material composition and moral composition. He speaks of splitting the elements of good and evil, yet the result is two bodies, not just two minds. Stevenson does not rigorously distinguish between the metaphysical claim (there are two substances) and the psychological claim (there are two agencies).

  Is this a defect the critic should name, or a resource? It is a resource. It exposes why the material constitution debate matters: we care about constitution because we care about answerability. If Jekyll is composed of Hyde, is Jekyll responsible for Hyde's crimes? The novella knows that the metaphysical status of the parts determines the moral status of the whole. By sliding between the two, Stevenson highlights the intuition that moral division *should* entail ontological division. The text suggests that our metaphysics of persons is driven by our needs for accountability. If we cannot hold one person responsible for another's acts, we must posit two persons. The metaphysical confusion in the text mirrors the moral confusion of the characters. It demonstrates that material constitution is never purely ontological; it is always ethical.

  **Objection**

  The harder question remains: the statue-and-clay case is synchronic. Jekyll and Hyde alternate; they are never in the room at the same time. Strictly, this is a succession case, belonging to personal identity rather than material constitution. Can the synchronic frame be repaired? One might treat Jekyll's body, household, and name as the persisting thing, with Jekyll-and-Hyde as the alternating persons it constitutes. This repairs the frame by shifting to a diachronic model of constitution. The organism persists through time, constituting different persons at different temporal segments.

  However, this repair distorts the story's emotional core. The horror of the novella is not that one body hosts two persons, but that one person is *replaced* by another. The will, the transformations, and the final suicide all point to a struggle for dominance, not co-location. Treating this as a phase case sanitizes the threat of dispossession. If Hyde is just a phase of Jekyll, then Jekyll never truly dies until the end. But the text suggests Jekyll is lost while Hyde lives. The synchronic frame fails because it cannot capture the exclusivity of the occupation. The novella resists the standard apparatus because it is fundamentally about the fragility of the self over time, not the multiplicity of objects at a time. To force it into material constitution is to ignore the temporal anxiety that drives the plot. The reading fails as a coincidence case, though it succeeds as a probe into diachronic identity.

  **Contribution**

  If the synchronic frame fails, what does the novella contribute to the debate? It exhibits the felt difference between asking which object is present and asking which person is answerable. Metaphysical puzzles often abstract away from the stakes of identity. Stevenson makes vivid the horror of a dominant-kind question asked of a living body. When Utterson looks at Hyde, he is not asking about modal properties; he is asking, "Is this man responsible?" The novella shows that material constitution is not just a puzzle for seminars but a source of existential dread.

  It also highlights the social machinery required to sustain a metaphysical fiction. The servants, the lawyers, the locks, and the will all work to maintain the illusion of one person where there are two. This reminds the metaphysician that persistence conditions are often enforced by institutions, not just nature. The text contributes the insight that identity is a collaborative achievement between biology and society. When that collaboration breaks down, as in the cabinet scene, the metaphysical uncertainty becomes visceral. Even if the standard apparatus cannot fully map the text, the text reveals why we care about the apparatus. It shows that the question "What constitutes a person?" is ultimately a question about who we fear is in the room.

  Verdict: phase-case — The text supports a diachronic constitution model better than a synchronic coincidence puzzle.
