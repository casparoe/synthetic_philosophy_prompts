      *   *The Separating Feature:* Identify "Consequences vs. Integrity." Test deletion (if consequences are removed or integrity is irrelevant, they converge).
      *   *The CEV Objection:* This is the tricky philosophical part. CEV says "extrapolate volition." If volitions conflict, CEV tries to find a coherent union.
