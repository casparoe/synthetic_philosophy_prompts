      *   *Step (5) is actually the most vulnerable.* Xunzi defines *xing* as what is *not* accessible to effort. But the capacity to *exert* effort is... tricky. If I have the capacity to exert effort, is that effort natural? Xunzi would say the *ability* to strive is natural, the *object* of striving is not.
      *   *Better to attack (7).* Even if (6) is true (capacity is in nature), (7) claims this equals Mencius. Mencius claims the *direction* is in nature. Xunzi claims the *engine* is in nature. Engine $\neq$ Direction.
      *   *The "Proves Too Much" check:* If I say "I have a capacity to learn calculus," does that mean calculus is in my nature? No. It means my brain can process it. The argument confuses *competence* with *content*.

  9.  **Final Plan:**
      *   Validate the "proves too much" intuition.
      *   Target Step (7) as the main error (Content vs. Capacity).
      *   Target Step (5) as the secondary error (Definition of *Xing*).
      *   Explain the cost of keeping (4) (Must accept a robust natural cognitive faculty).
      *   Offer the "First Sage" problem as the stronger, remaining critique.

  10. (Final Polish): Ensure tone is analytical and direct, avoiding fluff. Focus on the logical structure as requested. (Self-correction: Make sure to explicitly address the user's desire to keep (4)).

      *   *Decision:* I will advise keeping (4) but interpreting "resources" carefully. I will advise rejecting the move from (6) to (7). I will highlight the "First Sage" problem as the residual worry.

      *(Self-Correction on Step 5)*: Actually, Step (5) is where Xunzi would fight hardest. He defines *xing* as what is *not* the result of *wei*. But a capacity *for* *wei* is prior to *wei*. So is it *xing*? Xunzi says yes, the *faculties* are *xing*, the *application* is *wei*. So (5) is technically okay if "in someone" means "faculties." But (7) is definitely the leap.

      *Let's refine the "Proves Too Much" point.* If the argument holds, then *any* learning implies the content is innate. That's the nativist trap. The way out is distinguishing the *form* of learning from the *content* learned.

