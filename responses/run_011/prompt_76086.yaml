answer: |-
  Your suspicion is well-founded. The argument is a version of the "Paradox of Acquisition" (how can you seek what you do not know?), applied to moral psychology. It feels compelling because it exploits an ambiguity in the word "capacity."

  If you run this on Locke or a behaviorist, you conclude that the capacity to be conditioned must be innate. True. But you cannot conclude that the *specific conditioning* is innate. The argument proves that *learning machinery* is natural, not that *moral content* is natural.

  Here is the diagnosis of where the chain breaks, the cost of keeping (4), and the stronger worry that remains.

  ### 1. The Break Point: Reject the Move from (6) to (7)

  You should keep (4) and (5) but block the inference to (7). This is where the "collapse" fails.

  *   **Step (6) is acceptable to Xunzi:** He admits humans have a natural capacity (*ke*) to become sages. He explicitly says the potter's nature is clay, and the sage's nature is the human heart-mind (*xin*). The *faculty* to think, accumulate, and choose is part of *xing*.
  *   **Step (7) is the equivocation:** Mencius's "sprouts" are not just a capacity to learn; they are a **directional tendency**. The sprout of compassion *points* toward benevolence. It provides the *content* of the moral decision.
  *   **Xunzi's Capacity is Formal, Not Substantive:** Xunzi's "capacity" in (6) is like having a hard drive and a processor. Mencius's "sprouts" are like having pre-installed software.
      *   If I have the capacity to learn French, that capacity is in my nature (brain structure).
      *   It does not follow that French is in my nature.
      *   Xunzi claims we have the hardware to process *li* (ritual), but the software (the specific rules of *li*) comes entirely from the outside (the Sages).

  **Diagnosis:** The argument conflates *competence* (the ability to acquire virtue) with *content* (the knowledge of virtue). Xunzi collapses into Mencius only if the natural capacity includes the *direction* of the capacity. Xunzi denies this. He argues the heart-mind (*xin*) has cognitive power (to know, to choose, to accumulate) but is morally blind without external input.

  ### 2. The Cost of Keeping (4)

  You want to keep (4): *"You can't produce what you have no resources to produce."*

  You can keep this, but it forces you to interpret "resources" in a specific, deflationary way.

  *   **The Cost:** You must concede that Xunzi is a **nativist about cognitive faculties**, just not about moral values.
  *   **The Implication:** If the Sages created ritual through *wei*, they must have had the natural intelligence to recognize chaos and the natural desire to fix it. Xunzi actually admits this. He says human *xing* includes desires (for food, sex, order) and faculties (ears, eyes, heart-mind).
  *   **The Danger:** If you push (4) too hard, you risk smuggling in a "proto-sprout." If the Sages had the natural resource to *recognize* that ritual was good, didn't they have a natural sense of value?
  *   **Xunzi's Defense:** He distinguishes between **desire for order** and **knowledge of order**. Humans naturally hate chaos (like they naturally hate hunger). That is a biological drive, not a moral sprout. The Sage satisfies this drive by inventing ritual, just as a farmer satisfies hunger by inventing agriculture. Agriculture isn't in our nature, even if hunger is.

  **Price:** Keeping (4) means admitting Xunzi believes human nature is *plastic* and *intelligent*, not just "bad" in the sense of broken. It is "bad" only in the sense of being unguided.

  ### 3. The Definitional Trap: Step (5)

  Step (5) says: *"Whatever is in someone prior to any deliberate activity belongs to their nature."*

  This is the most vulnerable step for Xunzi, though less fatal than (7). Xunzi defines *xing* strictly as what is **unlearned and unworked**.
  *   If the "capacity for *wei*" is itself a capacity, is it *xing*?
  *   Xunzi says yes: The *ability* to strive is natural; the *striving* is *wei*.
  *   **The Risk:** If the ability to strive is natural, and that ability is what produces goodness, isn't goodness ultimately rooted in nature?
  *   **The Fix:** Xunzi treats the capacity as **neutral**. A knife has the capacity to cut. That capacity is in the steel (nature). Whether it cuts meat (ritual/order) or throats (violence/chaos) depends on the hand wielding it (external guidance). The capacity is natural; the *use* is not.

  ### 4. The Weaker Worry That Still Bites

  If the collapse into Mencius fails, is there a remaining problem? Yes. It is the **"First Sage" Problem**, and it is more damaging than the charge of inconsistency.

  Your argument asks: "Where did the resources come from?"
  The harder question is: **"How did the First Sage know which way to point them?"**

  *   **The Setup:** Xunzi says commoners can become sages, and sages made ritual.
  *   **The Problem:** If human nature provides no moral compass (no sprouts), and ritual is entirely external/artificial, how did the First Sage generate the *correct* ritual without a prior model to follow?
  *   **Mencius's Advantage:** The Sage followed his internal sprouts. He had a guide.
  *   **Xunzi's Bind:** The Sage had only his natural intelligence and desires. Why did his intelligence produce *Confucian* ritual rather than *Mohist* utilitarianism or *Legalist* brutality?
  *   **The Diagnosis:** Xunzi needs the Sage to have a **normative insight** that isn't derived from prior ritual. If that insight comes from nature, he edges toward Mencius. If it comes from nowhere, the origin of ritual looks arbitrary.

  **The Weaker Worry:** Xunzi doesn't collapse into Mencius, but he creates a **mystery of origin**. He posits a figure (the Sage) who could see the "Way" (*Dao*) without having the "Way" inside him. This makes the Sage look less like a human with bad nature and more like a miraculous exception, which undermines (3) (that Sage nature = Commoner nature).

  ### Summary of Options

  1.  **Reject (4):** You avoid the "proves too much" issue, but you make the origin of ritual magical (ex nihilo). High cost.
  2.  **Reject (5):** You argue the capacity for *wei* is not *xing*. Xunzi would fight this; he insists faculties are *xing*. Medium cost.
  3.  **Reject (7) (Recommended):** Accept the capacity is natural, deny it contains moral content. This preserves the Nature/Nurture distinction. **Lowest cost.**
  4.  **Accept the "First Sage" Worry:** Concede Xunzi doesn't collapse into Mencius, but argue he cannot explain the *normativity* of the first ritual invention without smuggling in a sprout. This is the strongest philosophical critique that doesn't rely on the "proves too much" error.

  **Verdict:** Your chain proves that Xunzi must admit humans have a natural **cognitive architecture** capable of morality. It does not prove he admits a natural **moral architecture**. Hold (4), block (7), and pivot to the "First Sage" problem if you want to press him.
