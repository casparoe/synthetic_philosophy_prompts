answer: |-
  Here is the audit. I have ranked the contradictions by severity based on how likely they are to trigger a committee intervention during your defense or prospectus review.

  ### 1. The Definition Trap: (1) vs. (5)
  **Severity: Critical**
  **Conflict:** You define the Classic Maya as the counterexample to collapse (1), implying they *didn't* collapse because they reorganized. But you also claim demography is the *only* honest metric (5). In the Southern Lowlands, Classic Maya demography *did* crash (estimates range from 70–90% population loss).
  **Commitment Trace:**
  *   If (5) is true (Demography = Truth), then the Maya *did* collapse, destroying (1).
  *   If (1) is true (Maya = Reorganization), then demography cannot be the *only* metric; institutional/cultural continuity must count, destroying (5).
  **Fix:** You must give up the absolute phrasing in (5).
  **Downstream Cost:** You lose the rhetorical clean sweep of "everything else is storytelling." You will have to argue why demographic loss matters less than cultural continuity in the Maya case, but matters *more* in other cases. This requires a nuanced theory of *which* metrics matter *when*, rather than a single universal metric.

  ### 2. The Ontological Exception: (1) vs. (2)
  **Severity: High**
  **Conflict:** (1) states collapse "isn't a real category." (2) states Rapa Nui is an "exception" where the ecocide story "holds." You cannot have a real exception to a category that doesn't exist. If collapse is purely a retroactive label (1), then Rapa Nui's disaster must also be a label, not an ontological reality.
  **Commitment Trace:**
  *   Holding (1) absolutely makes (2) incoherent.
  *   Holding (2) as a material reality undermines (1)'s constructivist stance.
  **Fix:** Qualify (1). Change "Collapse isn't a real category" to "Collapse is rarely a terminal endpoint, but threshold breaches are possible."
  **Downstream Cost:** You lose the strong social-constructivist high ground. You admit that material limits *can* produce a terminal event, which opens you up to Malthusian critiques you likely want to avoid.

  ### 3. The Welfare Paradox: (3) vs. (5)
  **Severity: Medium-High**
  **Conflict:** Tainter (3) argues shedding complexity is frequently *rational* and often improves well-being per capita for survivors. Demography (5) counts bodies. A Tainterian "successful simplification" often looks like a demographic crash (fewer people supported by less complexity).
  **Commitment Trace:**
  *   If you use (5) as your success metric, a Tainterian simplification looks like a failure (population loss).
  *   If you use (3) as your success metric, a demographic crash might be a success (higher quality of life for fewer people).
  **Fix:** You must decouple "collapse" from "suffering" in your metric definition.
  **Downstream Cost:** You have to defend why a 90% population drop is an "honest metric" of the system without necessarily condemning it as a human tragedy. This is ethically fraught and difficult to model without appearing cold or contradictory.

  ### 4. The Memory Gap: (4) vs. (5)
  **Severity: Medium**
  **Conflict:** Panarchy/Resilience (4) relies on "memory" functions (institutions, seed banks, knowledge) to enable the reorganization phase (alpha). You claim institutions are "storytelling" (5).
  **Commitment Trace:**
  *   If institutions are just storytelling, they lack the causal power to store the "memory" required for Panarchy's adaptive cycle to function.
  *   If Panarchy is your framework, institutions must have material/functional weight.
  **Fix:** Refine (5) to "Institutional *legitimacy* is storytelling, but institutional *capacity* is structural."
  **Downstream Cost:** You lose the clean materialist/idealist split. You have to acknowledge that stories *do* work as structural glue in resilience theory.

  ### 5. The Citation Risk: (2) Internal Consistency
  **Severity: Medium**
  **Conflict:** You cite Hunt/Lipo (2) to explain the palms but claim they don't explain away the "disaster." Hunt/Lipo's specific argument is that there *was no pre-contact disaster* (they argue for continuity until European contact).
  **Commitment Trace:**
  *   If you use Hunt/Lipo to explain the palms, their data suggests population continuity.
  *   If you assert a "disaster" happened despite their data, you are fighting your own evidence.
  **Fix:** Specify that the "disaster" is post-contact or driven by mechanisms Hunt/Lipo exclude (e.g., slave raiding vs. ecocide).
  **Downstream Cost:** You narrow your Rapa Nui argument. You can't use the "ecocide" label loosely; you must specify the timing and cause of the demographic drop to avoid contradicting your primary sources.

  ### Summary of Required Moves
  1.  **Soften (1):** Admit collapse *can* happen, but is rare. (Saves you from the Rapa Nui contradiction).
  2.  **Nuance (5):** Demography is the *primary* metric, but not the *only* one. (Saves the Maya argument).
  3.  **Clarify (3):** Specify that "rational" means "survival of the group," not "maintenance of total population." (Aligns Tainter with Demography).
  4.  **Tighten (2):** Be precise about *when* the Rapa Nui disaster occurred relative to Hunt/Lipo's timeline.

  **What to keep:** (6) is safe. It creates no logical friction with the others, provided you frame "impact" as methodological rigor rather than policy prescription. (4) is safe provided you fix the "institutional memory" issue in (5).

  **Immediate Action:** Rewrite (1) and (5). They are currently mutually exclusive.
