  ### (e) Observational Equivalence

  Among the procedures that *could* survive (hypothetically assuming Case 3 was an outlier), **Procedure 1 (Premise-based)** and **Procedure 4 (Premise-priority Sequential)** are the main contenders.

  **Are they observationally equivalent?**
  No, but they are **conditionally equivalent**.
  *   **Class of Agreement:** They agree on any profile where the "Premise Majorities" are **aligned**. That is, if the set of voters who vote Yes on R contains a majority of the committee, and the set of voters who vote Yes on T *within that R-group* is large enough to also constitute a majority of the *whole* committee (or if T passes globally whenever it passes locally). Specifically, they agree whenever $Majority(T_{global}) \iff Majority(T_{R-subgroup})$.
  *   **Separating Feature:** They diverge when there is a **negative correlation** between Research and Teaching judgments. Specifically, when $T$ fails a global majority ($<4$) but passes a majority within the $R=1$ subgroup. Case 1 was exactly this feature ($T_{global}=3$, $T_{R-subgroup}=3/5$). Procedure 1 says No; Procedure 4 says Yes.

