answer: |-
  You press me with a vigour that doth honour to your understanding, sir, and I perceive you have weighed my Queries with more care than most of those who sit in the Parliament House. But pray, consider whether the case be not thus: that while it is true a smaller sum may suffice where the circulation is brisk, yet what avails the swiftness of the current if the stream itself be drained away? You speak of tickets moving briskly, but I ask you, whither are our tickets gone? Are they not shipped across the Channel every quarter, to support the vanity of our absent landlords in London? Whether, therefore, the want be not not merely of motion, but of matter to be moved? If the coin be withdrawn, the circulation ceases; and if the circulation ceases, the industry sleeps. I seek not to multiply counters for the sake of counting, but to supply the lack where the absentee hath swept the board clean.

  As to your weaver in Cork, you query whether doubling the counters doubles the price rather than the labour. I answer, whether it be not the hope of exchange that stirreth the arm? If the weaver sees no money in the market, he weaves not, though he starve; for what signifies labour without a vent? By securing notes upon the land, we tie the currency to that which cannot flee the kingdom, unlike gold which travels at a ship's whim. Is it not better that prices should rise somewhat, reflecting a lively trade, than that they should remain low amidst a dead stagnation? You suggest this bank supplies confidence rather than metal; I ask, is not confidence the very soul of credit? And if the state lends its authority to this confidence, is it not more stable than the humour of a merchant?

  You touch upon a matter most delicate when you speak of opinion. You say I have taught that objects have no existence without a mind to perceive them, and now I would build a bank upon opinion. I concede the resemblance freely. For what is public credit but a public opinion? Whether the value of a note be not in the mind of him who takes it, relying on the faith that another shall take it in turn? If this be opinion, it is an opinion grounded in the mutual wants of society, sanctioned by law. Is it not better to rest upon this solid foundation of public utility than upon the fancy that a yellow metal hath a mystical virtue? I ask you, if the mind be the seat of value, why should we not cultivate that soil rather than digging endlessly for ore in the earth?
