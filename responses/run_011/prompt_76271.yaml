answer: |-
  Your friend's proposal mistakes compliance for character, cultivating a transactional morality that collapses without surveillance, whereas true discipline requires treating students as rational agents capable of internalizing values rather than merely pricing behavior.

  The fundamental error in your friend's case is a category mistake regarding the purpose of school discipline. If the sole objective of the homework club were industrial quietude—maximizing output per minute regardless of the psychological cost—then a token economy might be efficient. Behaviorism works for training pigeons; it produces reliable, observable actions contingent on the presence of a dispenser. However, your Headmaster's ethos explicitly rejects this goal, stating that the school aims to produce people who "do the right thing when nobody is looking." A token scheme is, by definition, a system for when somebody *is* looking. It externalizes the locus of control, teaching pupils that the reason to work is the reward, not the value of the work itself. By making the incentive "legible," as your friend suggests, you make the morality legible too: it reveals that there is no intrinsic obligation to behave, only a price tag. When the tokens stop coming, or when the prefect steps into the corridor, the reason for behaving vanishes with them. You have observed this already with the current punishment system: the boys who "price" their misbehavior have correctly understood the school's logic that rules are merely costs to be managed, not boundaries to be respected. Switching from penalties to rewards changes the currency from negative to positive, but it retains the transactional nature of the relationship. It reinforces the idea that morality is a market exchange rather than a habit of character.

  This transactional approach actively damages the intrinsic motivation you have observed dying in the quieter pupils. There is robust psychological evidence for what is known as the "overjustification effect": when an external incentive is introduced for a behavior that is already internally motivated, the internal motivation tends to decrease. The pupil who told you that "books smell of being told off" has already internalized the idea that reading is a compliance activity, something done to avoid sanction or gain approval, rather than a source of value in itself. If you introduce a token scheme where reading earns points, you confirm this suspicion. You convert a potential virtue (curiosity) into a labor (work for pay). Your friend argues that expecting children to behave because it is "the right thing to do" is sentimental, but this is not sentimentality; it is the definition of education. Education is the process of turning external constraints into internal convictions. If a student only behaves well when there is a reward, they have not learned to be good; they have learned to be compliant. The difference is not merely philosophical; it is practical and durable. Compliance breaks under pressure or when surveillance lapses; character holds. If the school's goal is indeed character, then a system that bypasses the student's moral reasoning in favor of stimulus-response conditioning is counter-productive, even if it yields a quieter room in the short term.

  Your friend's claim that Year 8s are not rational enough to be reasoned with is the linchpin of his argument, but it is also its weakest point. It relies on a static view of rationality, assuming that reason is a precondition for engagement rather than a capacity developed through engagement. To argue that children cannot understand reasons because they are immature is to guarantee they remain immature. Rationality is not a switch that flips at age sixteen; it is a muscle that atrophies without use. When you address a twelve-year-old as a rational agent—explaining *why* the homework club requires silence, for example, because others need to concentrate—you invite them into the moral community. You signal that their behavior matters to others, not just to the authority figure holding the tokens. If you refuse to give reasons because "they wouldn't understand," you treat them as subjects to be managed rather than participants in a shared enterprise. This creates a self-fulfilling prophecy: treated like creatures of impulse, they will respond to impulse. Treated like reason-givers, they are challenged to provide reasons for their actions. The fact that they are emotionally volatile or occasionally irrational does not mean they are incapable of grasping normative expectations. Indeed, adolescence is precisely the developmental stage where the capacity for abstract moral reasoning emerges; to deny them the opportunity to exercise it is to neglect the very faculty the school claims to educate.

  Furthermore, the social dynamics you have observed suggest that the current system of sanctions has already created a perverse economy where detention confers status. A token scheme risks replicating this inversion. If points become the primary social currency, you may find that the "cool" students disdain them to signal independence, while the points become associated with being a "teacher's pet," thereby stigmatizing the very behavior you wish to encourage. You noted that one boy keeps a tally of how many names he can afford; this shows he is already engaging in rational calculation, just within the wrong framework. He is demonstrating that he is rational enough to understand the system, which undermines your friend's claim that he cannot be reasoned with. The problem is not that he lacks reason, but that the system has given him the wrong variables to calculate. He is optimizing for status within his peer group against the school's sanctions. A better approach would be to appeal to the peer group's own norms. Prefects are uniquely positioned to do this because you are not fully adult authority figures; you are senior peers. Your authority rests partly on respect, not just rule enforcement. Leveraging that respect to establish a culture where silence is a sign of respect for others, rather than a condition for a reward, aligns with the Headmaster's vision.

  This does not mean you must reject all forms of positive reinforcement, but you must distinguish between rewards as payments and rewards as recognition. A payment is promised in advance: "If you do X, you get Y." This is the token economy your friend proposes, and it creates a contract. Recognition is retrospective: "I noticed you worked hard today, and I appreciate it." This validates the behavior without making it the sole motive. If you must use incentives, they should be unexpected and social rather than transactional and material. Extra time in the games hall is acceptable if framed as a privilege of membership in a well-functioning community, not a wage for silence. However, the core of your recommendation should be that the club operates on explained norms rather than priced behaviors. You should propose that the prefects take time at the start of each term to explain *why* the rules exist, appealing to the collective good of the club. When rules are broken, the conversation should focus on the impact on others ("You are disturbing X's concentration") rather than the cost to the rule-breaker ("That's a name on the board"). This shifts the focus from the transaction to the relationship.

  Ultimately, your objection is not just a feeling; it is a defense of the school's stated mission against a shortcut that undermines it. Your friend's system might produce a quieter room for the three evenings you are there, but it will not produce the kind of students the Headmaster describes. It will produce students who are excellent at calculating risk and reward, who view authority as something to be gamified, and who lose interest in any activity that does not carry a price tag. You asked whether there is a real difference between a boy who refrains because the price is too high and one who has come not to want to. There is. The first is a prisoner of his environment; the second is free. The first behaves well only when the warden is watching; the second behaves well when he is alone. If the school is to teach character, it must be willing to accept the slower, messier work of cultivating internal motivation rather than purchasing compliance. Your role as a prefect is not merely to keep order, but to model the kind of adult reasoning you hope they will adopt. If you treat them as rational beings capable of understanding the right thing to do, you give them the chance to become them. If you treat them as animals to be trained with tokens, you ensure they never learn the difference.
