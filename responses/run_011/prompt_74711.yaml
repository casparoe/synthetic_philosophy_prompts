answer: |-
  **TO:** Board of Commissioners
  **FROM:** Procurement Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Exterior Access System Procurement

  **Bottom Line**
  Award Bid B (Regional/Open), subject to two non-negotiable conditions before signature. First, we must revise our internal governance policy to centralize credentialing authority at HQ, overriding property-level resident committees on matters of legal compliance and fair housing. We cannot replicate the exclusion incident from two years ago. Second, we require a contractual guarantee that all encryption keys and controller software remain the property of the Authority, ensuring our maintenance crew retains full administrative access indefinitely.

  Do not award Bid A. The 30-day suspension clause represents an unacceptable existential risk. Public housing cannot rely on a private vendor's accounts receivable department to maintain physical security. The 35% upfront premium for Bid B is the cost of sovereignty.

  **The Conceptual Question: Is Control a Procurement Criterion?**
  Counsel argues that "control structures" are not listed in the RFP criteria (cost, durability, safety, operational fit) and that analyzing them is out of scope. He is procedurally incorrect. "Operational fit" is not merely whether the door opens; it is *who* can open it and *under what conditions*. A system that allows a vendor to remotely lock out 2,400 units fails the safety and operational fit criteria by design.

  Substantively, counsel argues that artifacts don't have politics; people do. This is a category error. Technology is not neutral media; it is crystallized procedure. Bid A's architecture *requires* centralized management because the credentials live in the cloud. Bid B's architecture *allows* distributed management because the credentials live on the controller. You cannot run Bid A like Bid B without fighting the software every day. When we procure infrastructure, we are procuring the flow of authority. Ignoring this because "people hold the power" ignores that the hardware determines which people *can* hold the power. Evaluating the political topology of the system is not philosophy; it is due diligence on operational risk.

  **The Folklore Jab**
  Counsel is right to question the Long Island bridge story. If Robert Moses didn't intentionally build low overpasses to keep buses out, that anecdote is dead. But the thesis survives because the argument isn't about *intent*; it's about *affordance*.

  Whether Moses hated bus riders is irrelevant. The physical reality was that buses couldn't pass. Similarly, it doesn't matter if the vendor *intends* to suspend our service. The code allows it. If the system architecture makes remote suspension easy and local override impossible, the political effect is centralized coercion, regardless of the vendor's benevolence. We must judge the system by what it *can* do, not what the sales rep says it *will* do. The bridge story being folklore damages the historical example, not the structural principle.

  **Steelmanning Counsel**
  Counsel's strongest point is that the same hardware can produce different outcomes under different rules. He argues that if we write a strong contract with Bid A, the suspension clause is neutralized. He is partially right: law matters. But he underestimates the friction of enforcement.

  If Bid A violates a contract clause, our remedy is litigation after the doors are already locked. If Bid B violates a policy, our remedy is a keycard reprogramming. Counsel treats code and contract law as equivalent constraints. They are not. Code executes automatically; contracts require lawyers. Bid B shifts the burden of action to us (we must choose to restrict access); Bid A shifts the burden of inaction to the vendor (they must choose not to restrict access). In a billing dispute, the path of least resistance favors the vendor. Counsel's view assumes perfect legal enforcement in a vacuum; procurement must assume friction, delay, and human error.

  **Comparing the Abuses**
  We must decide if resident committee abuse and vendor abuse are equivalent. They are not.

  The resident committee incident was a failure of local governance—bias disguised as policy. It was corrigible. We can change the policy, train the committee, or face legal liability that forces compliance. It is a political failure within a system we own.

  The vendor suspension clause is a structural vulnerability outside our control. It hands a kill switch to a third party with no fiduciary duty to our residents. Local abuse is a misuse of authority; vendor suspension is a collapse of authority. One is a breach of trust; the other is a breach of infrastructure. We can fix our residents' policies; we cannot fix a vendor's billing department during a dispute. The risk profile is fundamentally different. Local discretion is a manageable risk; external dependency on critical security infrastructure is not.

  **Next Steps**
  Before the vote, Legal must draft the policy amendment centralizing credentialing compliance. Procurement must verify Bid B's open-spec claims with a third-party audit. If these are in place, Bid B is the only choice that aligns with our mission. We are not just buying doors; we are buying who holds the keys. Let's make sure we keep them.
