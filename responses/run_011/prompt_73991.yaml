answer: |-
  # Examination Item: Democratic Theory (Final Year)

  **Time Allowed:** 45 Minutes
  **Instructions:** Answer the question below. This is a closed-book paper. Do not cite authors or specific texts; marks are awarded for argumentative reasoning, not recall.

  **Question:**

  Consider the following scenario: A self-governing island territory of 500,000 inhabitants is holding a referendum on whether to extend its franchise to non-citizen residents who have lived there lawfully for over five years (approximately 60,000 people). Two theoretical difficulties arise. First, the decision is reflexive: the outcome determines who counts as a member of the *demos* entitled to decide future questions of this kind. Second, the standard criteria for inclusion conflict. The *affectedness* criterion is indeterminate (it potentially includes foreign flag states, employers, and future migrants), while the *subjection* criterion presupposes the very jurisdictional boundaries whose legitimacy is in question.

  This generates a problem of reflexivity: whoever applies a criterion of membership must already belong to a group entitled to apply it. In light of this, answer the following:

  1.  Diagnose the logical structure of this reflexivity. Does it amount to:
      *   (a) A **vicious circle**, making a democratic decision about boundaries impossible in principle;
      *   (b) A **benign regress**, terminating in practice at some historically given unit;
      *   (c) A **fixed-point problem**, admitting a stable solution even if no first step is independently justified; or
      *   (d) A **misdirected search**, implying the *demos* is not identified but constituted by institutions.

  2.  On the basis of the diagnosis you defend, explain what, if anything, the referendum could legitimately be made to turn on.

  ***

  # Model Answer

  The core difficulty presented by the island scenario is not merely that the criteria of affectedness and subjection yield different results, but that the application of any criterion presupposes a decision-maker whose own authority is undefined. This is the boundary problem in its reflexive form. To determine who votes, we must know who decides who votes. If we say "the current citizens decide," we assume their boundary is already legitimate, which is precisely what the inclusion of non-citizens challenges. If we say "all affected should decide," we cannot identify "all affected" without already knowing the scope of the decision's consequences, which depends on who is included.

  Diagnosis (a), the vicious circle, should be rejected. If the reflexivity were truly vicious, democratic self-determination would be impossible in principle. Yet democracies function and boundaries change. To claim impossibility is to confuse logical priority with temporal priority. We do not need a justified *demos* before we can begin; we need a procedure that generates legitimacy through the process. Therefore, the circle is not a dead end but a structural feature of constituent power.

  Diagnosis (b), the benign regress, is descriptively common but normatively weak. It suggests we stop at historical boundaries because we must stop somewhere. While practical, this concedes that the boundary rests on brute fact rather than democratic justification. It fails to address the normative claim of the 60,000 residents; it merely asserts the power of the existing 500,000. This turns democracy into a form of inherited privilege, unable to critique its own limits.

  Diagnosis (c), the fixed-point problem, offers a rationalist solution: there is a correct boundary discoverable by reason. However, the scenario demonstrates that reason alone yields conflicting criteria (affectedness vs. subjection). There is no Archimedean point outside the political system from which to measure the "correct" membership.

  Therefore, diagnosis (d) is the most coherent: the search for a pre-existing *demos* is misdirected. The *demos* is not an entity to be discovered but a status constituted by political institutions. The reflexivity is not a flaw but a feature of democratic constitution. The authority to set the boundary does not come from outside the system (via a correct criterion) but from the legitimacy of the procedure used to establish it.

  Applying this to the island referendum: The question cannot be "What is the true boundary of the people?" because there is no pre-political truth to find. Instead, the question must be "Is the procedure for setting the boundary legitimate?" The referendum itself is a constituent act. For it to be legitimate, it cannot simply be a vote by the exclusionary group (the 500,000) acting as a closed corporation, as this assumes the conclusion. Nor can it rely on the indeterminate affectedness criterion.

  Legitimacy here depends on the *reasons* given for the exclusion. If the current citizens vote to exclude the residents, they must justify this using public reasons acceptable to those excluded, acknowledging that they are acting as trustees for a future, wider *demos*. The referendum turns not on the discovery of a right answer, but on the exercise of a power that creates the answer. Consequently, the 60,000 residents have a claim to be included not because they are metaphysically part of the people, but because excluding them treats the boundary as a property right rather than a political constitution. The legitimate outcome is not guaranteed to be extension, but the decision must be made under conditions that recognize the provisional nature of the current boundary. The referendum is valid only if it acknowledges that the "people" voting are themselves a product of prior decisions that could be otherwise.

  ***

  # Marking Scheme (Total: 25 Marks)

  **1. Identification of the Reflexive Problem (5 Marks)**
  *   **5:** Clearly articulates that the authority to apply a membership criterion presupposes a defined group, creating a circular dependency between the *demos* and the decision-rule.
  *   **3-4:** Identifies the conflict between criteria but treats it as a standard trade-off rather than a structural reflexivity.
  *   **0-2:** Fails to identify the circularity; treats the scenario as a simple policy dispute.

  **2. Selection and Defense of a Diagnosis (10 Marks)**
  *   **8-10 (1st Class):** Selects one diagnosis and explicitly argues *against* the plausibility of the others (e.g., explaining why "benign regress" is normatively insufficient, not just practically convenient). Demonstrates awareness that the chosen diagnosis carries normative costs.
  *   **6-7 (2:1 Class):** Selects a diagnosis and provides a coherent defense, but treats the options as a menu where one is "correct" rather than explaining the theoretical trade-offs. May omit explicit rejection of alternative diagnoses.
  *   **3-5:** Selects a diagnosis but offers a generic definition without applying it to the logic of the scenario.
  *   **0-2:** Fails to select a specific diagnosis or conflates the categories.

  **3. Application to the Scenario (5 Marks)**
  *   **5:** Derives a specific consequence for the referendum's legitimacy based *strictly* on the chosen diagnosis (e.g., if "misdirected search," the focus shifts to procedure/reasons rather than "true" membership).
  *   **3-4:** Applies the diagnosis generally but fails to specify what the referendum should turn on (e.g., says "it's complicated" without a normative conclusion).
  *   **0-2:** Application is inconsistent with the chosen diagnosis.

  **4. Clarity and Structure (5 Marks)**
  *   **5:** Argument flows logically; precise terminology; no superfluous material.
  *   **3-4:** Clear but occasionally verbose or slightly disjointed.
  *   **0-2:** Difficult to follow; significant ambiguity.

  **Specific Mark Deductions (apply to total):**
  *   **(-5 Marks):** Treating affectedness and subjection as rival answers to a well-posed question about a fixed population (ignores the reflexivity constraint).
  *   **(-5 Marks):** Declaring the affectedness criterion "too broad" without proposing a stopping rule or specifying *who* is entitled to impose one.
  *   **(-5 Marks):** Dissolving the circle by appealing to a pre-political people or historical continuity without acknowledging that this concedes the boundary lacks democratic legitimacy.

  **Differentiation Note (1st vs. 2:1):**
  The crucial distinction lies in **Move 2**. A 2:1 answer will successfully define the chosen diagnosis and apply it. A 1st answer will demonstrate *why* the other diagnoses fail to resolve the reflexivity. For example, a 1st answer defending "Misdirected Search" will explicitly note that this abandons the hope of a "correct" boundary, whereas a 2:1 answer may present it simply as the "solution." The 1st answer shows awareness of the theoretical cost of the solution.

  ***

  # Note on Settled vs. Contested Material

  **Settled:** The taxonomy of the problem is treated here as standard curriculum. Students are expected to recognize the "Boundary Problem" and the tension between the *all-affected* and *all-subjected* principles. The logical structure of the reflexivity (that the *demos* cannot define itself without already existing) is presented as a given theoretical constraint for the purposes of this module.

  **Contested:** There is no professional consensus on which of the four diagnoses (Vicious Circle, Benign Regress, Fixed-Point, Misdirected Search) is correct. These represent competing philosophical resolutions to the boundary problem found in contemporary literature. The Model Answer above argues for the "Misdirected Search" (constitutive) view, but this is a pedagogical choice to demonstrate a high-quality argument, not an assertion of truth.

  **Marking Instruction:** Examiners must award marks based on the **coherence of the reasoning**, not the specific diagnosis chosen. A student who convincingly argues for the "Fixed-Point" diagnosis (e.g., arguing that moral principles can identify the correct boundary despite the reflexivity) must be rewarded equally to one arguing for the "Misdirected Search," provided they avoid the specific failures listed in the deduction scheme. The Model Answer's preference for diagnosis (d) should not bias marking against students who defend (b) or (c) with equal rigor.
