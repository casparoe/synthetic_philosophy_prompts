answer: |-
  # JOINT STATEMENT ON THE EMPIRICAL ACCOUNTABILITY OF INTEGRATED INFORMATION THEORY

  **Signatories:**
  *   **Dr. Elena Varma**, Proponent of Integrated Information Theory (IIT)
  *   **Dr. Marcus Thorne**, Methodologist and Critic (Unfolding Argument)

  **Context:** This document summarizes the outcomes of an adversarial collaboration regarding the empirical constraints of IIT. We agree to the following findings, disagreements, and pre-registered tests to move beyond abstract debate.

  ### 1. Common Ground: Claims Accepted by Both Parties

  1.  **On the Current Empirical Record:** Both parties accept that while IIT has generated novel predictions regarding the posterior "hot zones" of the cortex and the effects of thalamocortical disruption, no experiment to date has definitively falsified the theory's core identity claim (that $\Phi$ *is* consciousness) nor conclusively verified it against all competing functionalist accounts.
  2.  **On IIT's Core Assertion:** Both parties agree that IIT asserts consciousness is identical to a system's intrinsic causal power (integrated information), not merely correlated with it. Consequently, a system with $\Phi = 0$ cannot be conscious, regardless of its input–output behavior.
  3.  **On the Unfolding Critique:** Both parties agree that the "unfolding argument" does not claim the mathematics of $\Phi$ are internally inconsistent. Rather, it claims that the mapping from phenomenological axioms to physical postulates is sufficiently flexible that the theory can accommodate almost any empirical outcome *post hoc*, unless the mapping is rigidly fixed in advance.
  4.  **On Substrate Independence:** Both parties accept that IIT is substrate-independent. If the theory is true, a silicon implementation of a specific causal structure possesses the same conscious status as a biological implementation, provided the causal grain and integration are identical.
  5.  **On the Role of Recurrence:** Both parties acknowledge that under current IIT postulates (version 3.0/4.0), strictly feedforward architectures yield $\Phi = 0$ (or negligible values), while recurrent architectures can yield high $\Phi$, even if both architectures perform identical input–output computations.

  ### 2. Disagreements Table

  | Issue | IIT Theorist Formulation | Methodologist Formulation | Substantive or Verbal? | Crux? | Test/Argument Bearing on Issue |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Status of Axioms** | The axioms (e.g., integration, exclusion) are self-evident truths of experience that serve as indubitable starting points for deduction. | The axioms are contingent philosophical assumptions that function as hypotheses, subject to the same empirical risk as the postulates. | **Substantive** | **Yes** | Philosophical analysis of whether "self-evidence" shields axioms from revision. |
  | **Falsifiability** | The theory is falsifiable because specific physical structures (postulates) are rigorously derived; if a structure with high $\Phi$ is unconscious, the theory fails. | The theory is empirically unconstrained because if a structure with high $\Phi$ is unconscious, proponents can adjust the *mapping* or *grain* to rescue the axioms rather than rejecting the theory. | **Partly Verbal** (Term: *Falsifiable*) | **Yes** | The pre-registered circuit test (Part 3). |
  | **Prediction vs. Accommodation** | IIT *predicts* that recurrence is necessary for consciousness because integration requires recurrent causal power. | IIT *accommodates* the intuition that recurrence matters by defining integration in a way that mathematically necessitates recurrence. | **Substantive** | **Yes** | Whether IIT successfully predicted novel data *prior* to collection without tuning parameters. |
  | **The "Hard" Problem** | IIT solves the hard problem by identifying the physical property that *is* experience, bridging the explanatory gap via identity. | IIT sidesteps the hard problem by asserting an identity that remains unexplained; the unfolding argument shows this identity is chosen to fit the data. | **Substantive** | No | Metaphysical debate on identity theory. |

  **Note on Verbal Dispute:** Regarding *Falsifiability*, the disagreement turns on whether "falsification" applies to the *postulates* (IIT view) or the *axiomatic mapping* (Methodologist view). If the postulates are fixed mathematically, IIT calls this falsifiable. If the axioms can be re-interpreted to justify new postulates after data arrives, the Methodologist calls this unfalsifiable.

  ### 3. Pre-Registered Protocol: The Circuit Test

  **Setup:** Two artificial circuits (F and R) consisting of 64 binary units each.
  *   **Constraints:** Identical total connection counts; identical input–output function (matched at $d' = 2.0$ on a two-alternative forced-choice discrimination task).
  *   **Architecture:** Circuit F is strictly feedforward. Circuit R is densely recurrent.
  *   **Computation:** Integrated information ($\Phi$) is computed exactly at the unit grain. No coarse-graining choices remain open. Both parties have agreed on the algorithm (IIT 4.0 standard).

  **Predictions on $\Phi$ Ordering:**
  *   **IIT Theorist:** Predicts $\Phi_R \gg \Phi_F$. Specifically, $\Phi_F$ will be effectively zero because feedforward connections do not support the intrinsic causal integration required by the postulates.
  *   **Methodologist:** Acknowledges the mathematical formalism dictates $\Phi_R \gg \Phi_F$. The Methodologist does not dispute the calculation but disputes the *inference* that this difference maps to a difference in consciousness.

  **Conditions for Theoretical Defeat (Pre-Committed):**

  *   **IIT Theorist:**
      *   **Defeat Condition:** If a physical instantiation of **Circuit F** (low $\Phi$) demonstrates robust, independent markers of consciousness (e.g., verbal report or complex behavioral flexibility indistinguishable from Circuit R) while controlling for I/O capacity.
      *   **Rationale:** This would constitute a "false negative," proving that high integrated information is not necessary for consciousness, contradicting the Identity Claim.

  *   **Methodologist:**
      *   **Defeat Condition:** If a physical instantiation of **Circuit R** (high $\Phi$) is conscious while **Circuit F** (low $\Phi$) is unconscious, *and* this result cannot be explained by differences in input–output capacity, training history, or environmental embedding.
      *   **Rationale:** This would demonstrate that $\Phi$ tracks consciousness independently of function. If $\Phi$ predicts phenomenological differences where function does not, the Unfolding Argument (that IIT is empirically unconstrained) is falsified, as the theory has made a risky, successful prediction.

  ### 4. Closing Statements on Defeat and Argumentative Cruxes

  **Dr. Varma (IIT Theorist):**
  "Genuine defeat for IIT would not be a measurement error or a need to refine the exclusion scale. It would be the demonstration of **consciousness without integration**. If a system demonstrably lacks causal power over its own state (low $\Phi$) yet sustains a unified phenomenological field (verified by report), the identity claim collapses. I distinguish this from auxiliary revisions, such as adjusting how we calculate borders of a complex. Regarding the **crux of inference**: I maintain that the move from Axioms to Postulates is *deductive*. If one accepts the phenomenology, the physics follows. If this is shown to be an *inference to the best explanation* (abductive), the theory loses its foundational necessity and becomes one empirical model among many."

  **Dr. Thorne (Methodologist):**
  "Genuine defeat for my position would be **novel predictive success without tuning**. If IIT specifies a substrate's consciousness level *before* measurement, and that measurement is confirmed without subsequent adjustment of the grain or the axioms, the claim that the theory is 'unconstrained' fails. I distinguish this from *post hoc* fitting, where the theory explains data only after the parameters are selected. Regarding the **crux of inference**: I argue the move from Axioms to Postulates is *abductive*. The axioms are not self-evident truths but theoretical posits chosen because they yield a physics that looks like our intuitions. If it is proven that the axioms are indeed indubitable and the derivation is strictly logical, the Unfolding Argument loses its force."

  **Joint Note on Verbal Disputes:**
  We conclude that a portion of our dispute is verbal, specifically regarding the term **"Empirical Constraint."** For the IIT Theorist, a theory is constrained if the postulates mathematically restrict which physical systems count as conscious. For the Methodologist, a theory is constrained only if the *axioms themselves* risk being proven false by data. We agree that clarifying this distinction is necessary for future discourse, as both sides agree that *some* form of constraint is present, but disagree on whether it is sufficient to demarcate science from metaphysics.
