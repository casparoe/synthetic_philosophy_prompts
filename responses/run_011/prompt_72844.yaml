  **MINISTRY OF DEFENCE | VACANCY NOTICE**
  **Post:** Deputy Director for Strategic Credibility (DDSC)
  **Grade:** Senior Civil Service (SCS) Pay Band 3
  **Location:** Central Government Zone / Remote Secure Facility
  **Contract:** Indefinite, subject to strategic stability requirements

  **About the Role**
  The Strategic Deterrence Division seeks a Deputy Director to maintain national security through the rigorous management of existential risk. The post holder will oversee the alignment of capability with adversary perception, ensuring that threats requiring catastrophic execution are understood as binding commitments rather than rhetorical posture. You will maintain a posture where the inability to de-escalate serves as a stabilising feature of the broader architecture. The role requires balancing the necessity of accidental launch risks against the requirement for assured retaliation capabilities. You will report to the Permanent Under-Secretary, though operational autonomy is strictly limited by the automated systems you will be required to manage. The successful candidate will join a team dedicated to the preservation of peace through the preparation for war, navigating the complexities of modern geopolitics within established doctrinal frameworks.

  **Key Responsibilities**
  1. Ensure adversaries perceive our capacity for disproportionate response as actionable despite the mutual cost to both parties, maintaining belief in execution.
  2. Cultivate an operational environment where procedural overrides appear genuinely unavailable to external observers and internal staff.
  3. Manage authorization chains to ensure adversaries cannot rely on central hesitation, acknowledging associated risk profiles regarding unintended activation.
  4. Oversee systems designed to remain functional regardless of external communication inputs or leadership status.
  5. Provide reassurance to partner nations regarding coverage scope without defining specific trigger conditions that might limit flexibility.
  6. Maintain strategic equilibrium to facilitate low-intensity regional engagements without triggering central escalation.
  7. Identify temporal thresholds during escalation where preemptive action becomes logically preferable to waiting.
  8. Coordinate competency standards with counterpart agencies in opposing jurisdictions to ensure mutual system reliability.

  **Essential Criteria**
  *   Significant experience managing high-consequence projects where failure is undefined but total.
  *   Ability to communicate resolve while retaining plausible deniability regarding intent.
  *   Proven track record in environments where safety mechanisms are treated as vulnerabilities.

  **Desirable Criteria**
  *   Familiarity with crisis timelines where decision windows shrink faster than information arrives.
  *   Demonstrated ability to maintain mutually exclusive operational narratives simultaneously.
  *   Comfort with performance metrics based on the absence of data.

  **What We Offer**
  *   Competitive salary aligned with standard SCS bands, payable in stable currency.
  *   Performance bonuses are contingent on verified non-events over a five-year cycle.
  *   Annual review processes acknowledge that historical outcomes in this portfolio correlate weakly with individual intervention.
  *   Comprehensive pension scheme, subject to continuity of state structures.
  *   Professional development focused on maintaining ambiguity in public communications.
  *   Opportunity to shape legacy through inaction.

  **The Application Process**
  Submit a CV and covering letter via the central portal by the closing date. Shortlisted candidates will be invited to complete a written exercise: Provide a detailed case study detailing a specific catastrophe you prevented. Note: Documentation of the specific threat negates the prevention claim; candidates should instead evidence the stability of the status quo ante. Submissions detailing actual events will be disqualified as evidence of failure. Interviews will be conducted in a secure location.

  **FAQ Sidebar**
  **Q: Will I be working with international partners?**
  A: Yes. You will liaise closely with your opposite number in the rival state. Both sides require the other to be competent at this to maintain the balance.

  **Q: How do I assure allies without committing?**
  A: You will need to demonstrate the guarantee exists without showing the mechanism. If they see the mechanism, they will know it is limited.

  **Q: How is success measured?**
  A: Success is indistinguishable from luck. The department accepts this variance.

  **Q: Is travel required?**
  A: Only to locations where your presence does not signal intent.

  **Closing Date:** 23:59 GMT, or upon system failure.
