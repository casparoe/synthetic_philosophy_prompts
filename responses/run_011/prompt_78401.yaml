answer: |-
  Dear Colleague,

  I read through your list of verdicts with a great deal of sympathy, because what you are describing is the exact friction point where philosophical theory meets the daily grind of biological curation. You have correctly identified that neither the strict Selected Effects account nor the pure Causal Role account captures the nuanced way working biologists actually use the word function. If you adhered strictly to Millikan's Selected Effects view, you would have to deny functions to the first heart in Case 7 and the new mutation in Case 8, which contradicts your practical intuition that these things do something meaningful immediately. Conversely, if you adhered strictly to Cummins' Causal Role view, you would be forced to admit that the heart sound in Case 2 is a function because it is a real causal contribution to the environment, which you rightly reject. The principle that reconciles your intuitions is what I call the Normative Contribution account. Under this view, a trait has a function if it makes a causal contribution to the capacities or maintenance of the system, and that contribution is normalized by either a history of selection or an intentional design plan. This hybrid approach allows you to keep history as a safeguard for malfunction and vestigial traits while allowing current utility to establish function in cases of exaptation and engineering.

  When you apply this principle to your cases, the inconsistencies resolve themselves into a coherent pattern. You can accept Case 1 because pumping blood is a causal contribution normalized by history. You can reject Case 2 because while the sound is a causal contribution, it is not normalized by selection or design for the benefit of the system; it is merely a byproduct. This distinction between beneficial contribution and mere causal effect is the filter you were looking for to save Case 2. For Case 3 and Case 4, the Normative Contribution account leans on the history component. The dead heart and the failed kidney retain their functions because the type to which they belong is defined by a history of selection for pumping and filtering, even if the specific token is currently incapable of contributing. This explains why you feel comfortable using the word malfunction in Case 4; malfunction implies a deviation from a norm, and that norm is supplied by the history of the trait in the species.

  Your intuition about exaptations and new traits in Cases 5, 6, 7, and 8 is handled by the causal contribution component of the principle. Feathers in pigeons and the panda's thumb have become normalized within the current system because they contribute to flight and bamboo stripping respectively, even if that was not the original selective pressure. For the first heart in Case 7 and the antibiotic resistance mutation in Case 8, you are treating them as prototypes. They have function because they immediately provide a beneficial contribution that establishes a new norm, even before a long history of selection accumulates. In a database context, we treat a beneficial effect in a living system as a function because it is the seed of future selection. Case 9 fits here as well, because intentional design by an agent substitutes for natural selection in establishing the norm; the CRISPR insert functions to make the plant glow because that was the design goal, and it achieves that causal contribution.

  Case 10, the moth reflex in a lab without bats, is a strong test for the history component. Your intuition that predator evasion is still the function feels detached but correct because the trait is maintained by a history of selection in the wild lineage, even if the current environment does not trigger the benefit. The norm persists despite the temporary absence of the selective pressure. This leads us directly to your trouble with the seedless banana in Case 11. Under the Normative Contribution account, you need to decide what the relevant system and design plan are. If you are curating for evolutionary biology, the flesh's function is dispersal, and the seedless banana is a malfunctioning variant of that type. However, if you are curating for agriculture or general utility, the design plan has shifted from natural selection to human cultivation. In this context, the function of the flesh is to please humans or provide food, because that is the causal contribution that is now being selected for by farmers. My advice is to type the current agricultural function but note the evolutionary origin if your database allows for comments, because the banana is a case where the design agent has changed from nature to humans.

  Case 12, the appendix, shows your willingness to update function based on new evidence of causal contribution. Since the appendix no longer contributes to digestion but does contribute to immune maintenance, the Normative Contribution account supports updating the function to the new beneficial role. The old function is lost because the causal contribution is gone, and the new function is gained because a new beneficial contribution has been identified and normalized by its presence in the species. This brings us to the unlisted case of the duplicated gene. Here you must distinguish between the two copies based on their current status. The copy that keeps doing the old job retains the original function because it maintains both the causal contribution and the historical norm. The copy that drifts has no function while it is drifting because it makes no beneficial contribution and is not maintained by selection; it is effectively a pseudogene in that period. Once it gets recruited for something new, it acquires a new function at the moment it begins making a beneficial contribution that is preserved by selection. You should not type two functions for the drifting copy; you should type the old function for the conserved copy and leave the drifting copy blank or mark it as unknown until the new role is confirmed.

  Ultimately, the principle you are applying is a pragmatic hybrid that prioritizes beneficial contribution but uses history to define the boundaries of normalcy. This means you do not have to give up your verdict on the failed kidney or the heart sound, but you must accept that function is sometimes a property of the trait type rather than the specific token. For the database column, this means you are recording the standard beneficial contribution of that gene or organ in the reference class of the organism, not necessarily what it is doing in every single instance. When history and current utility diverge, as in the banana or the moth, you should prioritize the current causal contribution if it is being actively maintained by some selective pressure, whether natural or artificial. If there is no current contribution and no current selection, like the drifting gene copy, you should withhold the function label. This approach keeps your curation consistent with how biologists actually talk, acknowledging that function is both what a thing does and what it is supposed to do, with the supposedness coming from either nature or design. I hope this helps you fill that column with confidence.
