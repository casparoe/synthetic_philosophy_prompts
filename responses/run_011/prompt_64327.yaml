  I'm in a reading group on the philosophy of mathematical practice and this term we're doing a unit on evidence that isn't proof -- how much weight a conjecture carries when all you've got is a heuristic and a pile of numerics. I volunteered to introduce the number theory case, and the main thing I've been working from is a chapter out of some pop-math collection a friend lent me (no idea who wrote it, its a photocopy). Its framing section runs like this:

  "Here's the trick. The prime number theorem says the primes near n thin out like 1/log n, so you can think of each integer n as playing a lottery it wins with odds 1/log n. Presume the lotteries are independent -- that's the trick, and that's also the scandal -- and you can start computing: the chance that n and n+2 both win is about 1/(log n)^2, so summing up to X predicts roughly X/(log X)^2 twin prime pairs, and the same move predicts how many primes of the form n^2 + 1 there ought to be, how large the biggest gap below X gets, and a good deal else. And it works. The predictions match the tables to within a few percent, which is about as good as evidence gets for something nobody has proved. Of course the presumption of independance is flatly false: if n is odd then n+2 is odd, and if n is 1 mod 3 then n+2 is divisible by 3 and so can't be prime. The fix is to multiply in a correction factor assembled out of how often the pattern survives reduction mod p -- for twins it comes out at about 1.32 -- but that factor is tuned to the very data it's then used to predict, so it's curve-fitting with a respectable name attached. Worse, the model has been caught out: Maier proved in the eighties that primes in short intervals clump and thin far more violently than independent lotteries ever could, and the Cramér model is now generally regarded as discredited, which is why working number theorists treat this style of argument as suggestive at best and never as evidence for anything. The deeper point is that there's no way to turn the presumption of independence into a theorem, or even into a well-defined hypothesis someone could attack. It's a stance, and the fact that it keeps working is a standing embarrassment."

  Part of this I already suspected was sloppy and part of it I found persuasive -- the curve-fitting charge especially, and the deflationary ending. I've had one undergraduate number theory course, so I can follow density arguments and congruences but please unpack anything fancier as you go. Could you audit the passage for me, claim by claim? I want to know what a working analytic number theorist would nod at, what they'd accept as a defensible simplification, and what's actually wrong or misleading. Three things I'd especially like you to settle rather than hedge on:

  1. Is the internal arithmetic of the story even consistent? It first says raw independence gives you X/(log X)^2, then says the 1.32 factor is a patch applied afterwards -- but if the factor is ~1.32, the unpatched prediction is off by about a third, so what's going on with the claim that the numbers agree to within a few percent? Which version is the one that matches the data, and how fast does it converge?

  2. Is that correction factor genuinely fitted to the data it predicts, or is there a principled derivation sitting behind it? Relatedly: what exactly is being presumed independent here? My sense is that the presumption in real use is narrower than "the lotteries are independent," and that the congruential dependencies the passage makes such a fuss about are handled rather than assumed away -- but I can't say how, and I don't know whether the parity example (n odd, n+2 odd) is doing any interesting work or is just a cheap shot.

  3. Does Maier's theorem license the ending? What range of questions does it actually bear on, does it touch the k-tuple style predictions at all, and is it right that the random model isn't so much as a well-defined hypothesis? I'd have thought a random model of the integers is a perfectly concrete object, and that the shaky part is a different claim about the primes being typical with respect to it -- but maybe I'm wrong.

  Also, the last line asserts that nobody has managed to formalize any of this. Tell me whether that's simply false. I'm not asking for references or a reading list or a bibliography -- I can dig those up myself, and I know you can't check them from where you're sitting -- I just want to be told what the state of play is, what a formalization of the independence presumption would have to amount to, and where the live philosophical question sits once you strip away the rhetoric.

  Please take a definite line on all of it. I'd much rather you tell me the passage is mostly fine except for these two sentences which I should strike, or tell me the whole framing is bad and I should introduce a different example entirely, than get a balanced menu of considerations I then have to adjudicate myself. And if my instinct that the curve-fitting charge has some bite to it is just mistaken, say so plainly -- I don't want to walk into the session repeating something indefensible.
