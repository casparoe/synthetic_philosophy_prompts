answer: |-
  Ana comes out more right overall because she correctly identifies the fundamental scientific error in using heritability statistics to predict whether an intervention will work, even though Ray lands on a practically useful point about your specific program's data.

  **Move 1: Ray**
  **Rating: Half-right.**
  Ray is factually correct that reading ability becomes more heritable as kids age and that shared family environment effects tend to shrink in adulthood. However, he commits a classic error called the "heritability fallacy": just because genes explain differences between kids *now* doesn't mean changing the environment *later* won't work. High heritability does not mean immutability; otherwise, glasses wouldn't fix nearsightedness, which is also highly heritable.

  **Move 2: Ana**
  **Rating: Clearly right.**
  Ana nails the core concept with the field analogy: heritability explains variation within a specific setting, not the potential for change between settings. Her PKU example (a genetic disorder fixed by diet) is the perfect counter to Ray's claim that genetic influence limits environmental fixes. She correctly distinguishes between why kids differ and how much we can help them.

  **Move 3: Ray**
  **Rating: Half-right.**
  Ray is right that kids might respond differently to tutoring based on their genetics (gene-environment interaction), and that individualized help is often better than blanket programs. However, he stretches the science to suggest this validates his original claim that funding is wasted. Even if response varies, the average benefit could still be huge, so the genetic variation doesn't justify defunding without testing the specific program.

  **Move 4: Ana**
  **Rating: Clearly right.**
  Ana correctly points out that "non-shared environment" in twin studies is a statistical bucket that includes measurement error and random life events, not just "tutoring." She is also right that adult data (where people choose their environments) doesn't apply to kids in mandatory schooling. Her insistence on measuring actual outcomes rather than reasoning from variance ratios is the correct scientific approach.

  **Move 5: Ray**
  **Rating: Half-right.**
  Ray is right that eleven years of flat scores is strong evidence that *this specific program* isn't working, regardless of genetics. However, he is wrong to claim Ana's view makes that data meaningless; she would agree that null results matter, but she argues you can't predict them from heritability alone. He wins on the local data, but loses on the theoretical argument about why it failed.

  **What Both Are Missing**
  Both of them are treating "tutoring" as a single, uniform thing, like a drug dosage, when it is actually a complex process that varies wildly in quality. Behavioral genetics analyzes the *status quo*—how kids differ in the environments they currently have—not the impact of a *new* or *improved* environment. They are arguing about whether reading is mutable in principle, when the real question is whether your specific tutors are using evidence-based methods (like phonics instruction) versus ineffective ones (like just reading along with the kid). The failure might not be the kids' genes or the concept of tutoring, but simply that the tutoring method being funded doesn't work.

  **How to Settle It (Concrete and Cheap)**
  Stop arguing theory and look at the data with a simple comparison. Next semester, put the kids who sign up for tutoring on a waitlist for the first six weeks due to capacity limits (this happens naturally in small nonprofits). Give all the kids—the ones getting tutoring and the ones on the waitlist—the same short, standardized reading test at the start and after six weeks. Compare the average improvement of the tutored group against the waitlist group. If the tutored kids aren't improving faster than the waitlist kids, you have your proof that the money isn't moving the needle, regardless of genes or environment.
