  8.  *(Final check against user constraints)*: Did I avoid "machines aren't conscious"? Yes. Did I focus on rigidity/flexibility? Yes. Did I address the wasp story accuracy? Yes.

  **(Self-Correction Note):** I need to be careful not to anthropomorphize AlphaGo too much. When discussing its "collapse," I must describe it in terms of value network confidence and policy entropy, not emotional flailing.

