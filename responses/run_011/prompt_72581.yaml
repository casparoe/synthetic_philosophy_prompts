      *   *Wait.* If Stalinesque: Brain waits for Green (T=200). Constructs "Red moving turning Green". When asked at T=100 "What color?", the brain consults the constructed narrative which says "At T=100, I was turning Green." So Subject says "Green."
      *   If Orwellian: Subject experiences Red at T=0. At T=100 (Tone), Subject is asked. Green hasn't happened. Subject says "Red". At T=200 Green happens. Brain rewrites memory of T=0-T=200 to include Green. But the report at T=100 is already made.
      *   *So, logically:* If the data is real (71% Green before Green onset), Stalinesque explains it (delayed construction covers the probe time). Orwellian *standardly* predicts Red at the probe time (because revision happens after the second stimulus).
