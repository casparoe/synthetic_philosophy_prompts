      *   **Refining the Critique of (i):**
          *   Student: "A content becomes conscious when the system takes it as the object of a higher-order representation."
          *   Correction: Dennett rejects HOR. Consciousness is "fame in the brain" (influence on speech/memory/actions).
          *   Cost: It makes MDM sound like Rosenthal's HOT theory, which Dennett critiques.
          *   Revision: Remove "higher-order representation," replace with "functional availability to speech/memory systems."

      *   **Refining the Critique of (ii):**
          *   Student: Probe data distinguish S vs O.
