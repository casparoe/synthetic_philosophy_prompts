      *   Okay, sticking with Band D.

      *   *Wait, one more check:* "The instructor will ratify or override my mark." I need to be sure.
      *   Is the HOR attribution *definitely* wrong? Dennett sometimes uses "higher-order" loosely, but in the context of "Cartesian Materialism" vs "Multiple Drafts," he contrasts his view with HOT theories. In *Consciousness Explained*, he argues against the need for a higher-order scan. He talks about "joint availability." Calling it "higher-order representation" is a standard student conflation with Rosenthal. It counts as a substantive misdescription.
