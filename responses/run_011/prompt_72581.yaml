      *   **Student Comment:**
          *   Direct, specific. "You have conflated Dennett with HOR theorists." "You missed the confound in the block design." "You treat the probe as a neutral window, but Dennett argues it is part of the draft."

      *   **Specialist Disagreement:**
          *   Some empiricists might argue that *if* prediction is controlled, reaction times *could* suggest a timeline. But philosophically, the "fact of the matter" claim is the sticking point. I will stand with Dennett on the philosophical point but acknowledge the empirical nuance.

  6.  **Final Review against Constraints:**
