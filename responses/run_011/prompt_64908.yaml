      *   *Make sure to answer the specific question:* "Which step do you reject?" I should recommend rejecting the inference in (4) based on a refined (1), or rejecting the normative weight of (1). Actually, rejecting (1) is cleaner. Let's argue that (1) is the wrong definition for safety purposes.

