answer: |-
  The hardest requirement is reconciling the ontological particularity of care with the generalizability required for distributive justice.

  1.  **Motivation Independence**
      *   **Case:** A home health aide performs skilled wound care on a client they find difficult, feeling no affection, within a 15-minute slot.
      *   **Requirement:** The theory must validate competent care delivered via professional obligation or habit without requiring an internal state of "caring about."
      *   **Failure Mode:** The theory dismisses paid professional care as "inauthentic" or "technical" rather than ethical, rendering most actual care invisible.
      *   **Status:** Non-negotiable (given the industrial purpose); requiring affection is a partisan commitment to the mother-child dyad.

  2.  **Recipient Verdict**
      *   **Case:** A resident refuses a shower; staff insist for hygiene protocols, causing distress but preventing infection.
      *   **Requirement:** The theory must provide resources to adjudicate when care is imposed versus received, acknowledging the recipient's authority on whether care "landed."
      *   **Failure Mode:** The theory assumes benevolent intent guarantees ethical success, treating resistance as irrationality rather than a verdict on the care itself.
      *   **Status:** Non-negotiable; ignoring the recipient's voice replicates the paternalism care ethics claims to oppose.

  3.  **Carer Sustainability**
      *   **Case:** Night staff in a care home manage 90 residents with six bodies, delivering good care at the cost of chronic exhaustion and injury.
      *   **Requirement:** The theory must name the care as simultaneously valuable for the recipient and exploitative for the carer without one truth cancelling the other.
      *   **Failure Mode:** The theory romanticizes sacrifice as virtue or dismisses the care as tainted because the structure is unjust, unable to hold the contradiction.
      *   **Status:** Non-negotiable; a theory that demands self-sacrifice is a tool of oppression, not ethics.

  4.  **Labor Allocation**
      *   **Case:** A global care chain where a grandmother's care in Manchester is funded by a migrant worker's children left in Manila.
      *   **Requirement:** The theory must account for who ends up doing the care and whether valuing care loads more of it onto marginalized groups.
      *   **Failure Mode:** The theory elevates the moral value of care without addressing the political economy of who performs it, inadvertently justifying existing hierarchies.
      *   **Status:** Non-negotiable for political adequacy; treating labor distribution as external to care is a theoretical blind spot.

  5.  **Conceptual Distinctions**
      *   **Case:** A bureaucracy meets all metric targets for "care hours" while residents remain lonely and neglected.
      *   **Requirement:** The theory must distinguish practice from disposition, need from want, and caring about from caring for without collapsing them.
      *   **Failure Mode:** The theory becomes either a vague sentimentality ("we all care") or a rigid task-list, unable to critique bureaucratic box-ticking.
      *   **Status:** Non-negotiable; conceptual blur renders the theory useless for policy analysis.

  **The Bind**
  Your hunch is correct: responsiveness to the particular and distributive justice cannot be fully satisfied simultaneously without modifying the standard liberal conception of justice. Care is ontologically rooted in the specific relationship (this child, this parent), while justice requires generalization to compare claims (all children, all parents). In this spec, **impartiality gives way**, not particularity; a theory of care justice must be partial to need rather than blind to identity, but it risks incoherence if it cannot scale beyond the immediate dyad. Be aware that writing this spec itself smuggles in a substantive claim: that care *must* be scalable to the political realm, which phenomenological accounts may reject as a category error.

  **The Contenders**
  **Early Relational Accounts (Gilligan, Noddings):** These excel at capturing the phenomenology of the caring relation and the recipient's verdict but largely fail the labor allocation and motivation independence tests. They tend to treat paid care as a derivative or diminished form of the natural caring found in private life, rendering them inadequate for industrial-scale analysis. Their strength is the failure mode warning: do not lose the voice of the cared-for.

  **Political/Institutional Turn (Tronto, Fisher):** These meet the labor allocation and sustainability requirements by framing care as a public issue and democratic practice, successfully handling the bureaucratic case. However, they risk stretching the definition of care so thin that it becomes synonymous with "welfare provision," potentially losing the motivational and dispositional distinctions. They solve the distribution problem but sometimes at the cost of the relational core.

  **Care as Justice (Engster, Hankivsky):** These attempts directly tackle the bind by proposing care as a principle of obligation applicable to all citizens, satisfying the distributive requirement most robustly. Yet they often rely on a contested reading of care that prioritizes meeting needs over maintaining relationships, leaning heavily on state mechanisms rather than interpersonal ethics. They are the strongest fit for this spec but may be rejected by purists as having abandoned care ethics for social democracy.
