  Modern doctrine suggests you detach from outcomes to avoid pain. This is inefficient. Pain is the friction that proves you are moving. If you remove the passion, you remove the engine. A life without agitation is not tranquil; it is inert. Do not seek to be unmoved by loss or love. Seek only to ensure the object of your agitation is worthy of the energy expended. A life without risk is a life without velocity.
  *To feel grief is to confirm the value of what was lost.*

  **2. Husband Your Illusions**
  You are told to see clearly. I advise you to see sufficiently. Truth is often barren and offers no nourishment. The demand to see clearly is very often a demand to become unhappy. If a slight exaggeration of your partner's merit keeps the hearth warm, do not correct the geometry. Illusion is not an error to be corrected; it is a resource to be husbanded. We cannot survive on pure reason any more than we can survive on pure light.
  *Clarity is a cold light; illusion is insulation.*

  **3. Abandon the Metric**
  Your interface demands a daily numerical input to track progress. I leave the field blank. Happiness inspected at close range evaporates. It is like trying to measure the speed of light while standing on the beam; the observation alters the phenomenon. To ask "Am I happy?" is to interrupt the condition required to be so. There is no streak to maintain. There is only the moment, and then the next. Do not weigh the bird while it is singing.
  *To ask "Am I happy?" is to interrupt the condition required to be so.*

  **4. Fuel the Self-Love**
  You are taught that self-regard is a vice, a stain to be scrubbed. It is actually the gravity that holds your system together. Without it, you drift into the opinions of others. Do not apologize for requiring admiration. Ensure your supply is sufficient to sustain your work. A machine cannot run on empty, and neither can a soul. Self-love is an engine, not a stain.
  *Self-regard is the gravity that holds your system together.*

  **5. Price the Opinion of Others**
  Do not ignore the world, nor surrender to it. Assign a value to their praise and pay no more than that cost. Virtue is durable, but it is not happiness. Do not trade your joy for a reputation for goodness unless the exchange rate favors you. The available sources of happiness change with age; study and taste remain when the passions cool. Cultivate the mind, especially if the world has locked you out of every other avenue.
