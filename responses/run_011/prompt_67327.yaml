  ### 1. Candidate Rules & Predictions for Dana

  Based on the five prior verdicts and Rae's ambiguous remark, there are three viable theories she could be running. They all fit the existing data but diverge on Dana.

  **Rule A: The Diachronic Commitment View (DCV)**
  *   **The Rule:** Weakness of will is violating a past resolution without new *factual* evidence. Your "settled view" is the commitment you laid down, not the judgment you hold today. Current judgment is irrelevant unless it is triggered by new evidence (like the Runner's injury).
  *   **Fit to Data:**
      *   *Marco:* Violates resolution, no evidence. (Weak)
      *   *Priya:* No resolution. (Not Weak)
      *   *Tomas:* Violates resolution, but unable (panic). (Not Weak)
      *   *Runner:* Violates resolution, but new evidence (injury). (Not Weak)
      *   *Elias:* Adheres to resolution despite current judgment. (Not Weak)
  *   **Prediction for Dana:** **Weak-willed.** She violates the January resolution. She has no new evidence (same client, same money). The fact that she "calmly concluded" she should take it is irrelevant; without factual change, the resolution stands.

  **Rule B: The Phenomenological Conflict View (PCV)**
  *   **The Rule:** Weakness of will requires a specific felt experience: acting against your better judgment *while feeling the pull of the worse option* or experiencing regret. It is about the struggle, not just the violation.
  *   **Fit to Data:**
      *   *Marco:* Mutters regret, feels it's worse. (Weak)
      *   *Priya:* No conflict, no regret. (Not Weak)
