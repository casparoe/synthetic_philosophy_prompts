          *   CONSTITUTIVIST: Belief aims at truth. Reasons for belief must bear on truth independently of the attitude. Practical considerations are reasons to *want* to believe, not reasons *for* belief.
          *   PRAGMATIST: Reasons for belief are considerations counting in favor of being in the believing state. Practical considerations can be genuine reasons for belief. The restriction on truth-independent reasons is substantive, not conceptual.
      *   **The Case:** Idris's brother is missing. Evidence balanced (0.5 credence). Auditor predicts Idris's credence in 1 month. If credence > 0.9, she rescues brother (making belief true). If not, brother dies. Idris knows this.
          *   Route 1: Hiker account raises credence to 0.95 evidentially. Belief triggers rescue.
          *   Route 2: No account. Idris directly induces belief based on practical stakes (saving brother). Belief triggers rescue.
      *   **Requirements:**
          *   Determinate verdicts on both routes.
