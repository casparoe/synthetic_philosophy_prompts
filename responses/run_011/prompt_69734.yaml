answer: |-
  CONSTITUTIVIST: We agree on Route One. The hiker's account provides evidence bearing on the truth of the proposition. Idris forms a belief based on that evidence. The fact that this belief triggers the rescue is a happy consequence, but it plays no role in the rationality of the belief itself. Route Two is the divergence. I say Idris cannot rationally believe his brother is alive on the basis of the Auditor's offer alone. He may want to believe, he may try to induce the state, but he cannot treat the practical benefit as a reason for belief.

  PRAGMATIST: I disagree. In Route Two, Idris succeeds. He holds the credence above 0.9. The brother is saved. The belief is true. I say Idris is rational in Route Two. The fact that believing saves his brother is a consideration that counts in favor of being in that state. Since reasons for belief are just considerations counting in favor of the state, it is a reason for belief. You claim he cannot believe for that reason; I claim you are confusing the difficulty of the mechanics with the impossibility of the norm.

  CONSTITUTIVIST: It is not merely mechanical. In Route Two, the truth of the proposition depends on the attitude itself. This is bootstrapping. My constraint is that a reason for belief must bear on the truth independently of the attitude. In Route Two, the consideration—the brother's survival—only bears on the truth because the attitude is already assumed to exist. If you allow that as a reason for belief, you dissolve the distinction between believing and making true.

  PRAGMATIST: That constraint looks suspiciously like it was drafted to produce your desired verdict. You say reasons must bear on truth independently of the attitude. Why? Is this a principled constraint derived from the nature of belief, or is it just a redescription of the datum that we feel uneasy about Route Two? In Route Two, the belief ends up true. The world matches the mind. If truth is the standard of correctness for belief, and the belief is true, what exactly has gone wrong? You say the basis is defective. But if the basis secures the truth, why is the basis defective?

  CONSTITUTIVIST: Because the correctness is accidental relative to the reason. The reason cited was survival, not truth. The belief is true, but it is not true *because* of the reasons for which it was held. It is true because of the Auditor's mechanism. If Idris believes for the sake of survival, he is not treating the proposition as true in the right way. He is treating it as useful. This erases the distinction between believing that p and wanting to believe that p. Idris plainly needs that distinction. If practical stakes are reasons for belief, then whenever I have a strong desire for p to be true, I have a reason to believe p. That collapses belief into wishful thinking.

  PRAGMATIST: I do not collapse the distinction. I distinguish based on weight and context. But you must explain the deliberative asymmetry without reducing it to a mere limitation of human psychology. You say Idris cannot deliberate from the fact that his brother's life depends on his believing. Why not? If that fact counts in favor of the state, why is it excluded from deliberation? If you say because humans can't believe at will, you concede my point: it is a psychological limitation, not a normative one. If you say it is normative, you must explain why the reason exists but cannot be used.

  CONSTITUTIVIST: It is normative. Belief is transparent. To deliberate about whether to believe p is to attend to whether p is true. When Idris attends to the brother's survival, he is not attending to whether the brother is alive; he is attending to the consequences of holding the view. This is not a limitation of psychology; it is a condition of the attitude's identity. An attitude that takes practical consequences as its ground is not belief; it is acceptance or policy. I concede, however, that this makes the normative landscape fragmented. I must admit that Idris is practically irrational if he fails to induce the belief in Route Two. He has overriding reason to bring it about that he believes. So I concede that practical reasons are reasons *simpliciter*, and they are weighty enough to override epistemic norms. I just deny they are reasons *for belief*.

  PRAGMATIST: That is a costly concession. You admit he ought to believe, all things considered, but deny he has reason to believe. That fractures the notion of rationality. But I will meet you. I concede that treating practical considerations as epistemic reasons risks making belief too volatile. If every stake counted as evidence, belief would lose its stability as a guide to action. I admit there is a functional difference between evidence-based belief and stake-based belief, even if I call both belief. The phenomenology differs. Idris in Route Two feels the strain of induction; Idris in Route One feels the pull of evidence. I concede that this phenomenological difference tracks something real about the attitude's formation, even if I deny it tracks a difference in the kind of reason.

  CONSTITUTIVIST: Then we are nearing the core. You suggest this might be a verbal dispute. That you use reason for belief to mean reason to be in the state, and I use it to mean reason bearing on truth. If we standardize the terminology, do we disagree?

  PRAGMATIST: I defeat that suspicion. It is not merely verbal. If it were verbal, we would agree on what Idris ought to do. But you imply his belief in Route Two is defective, perhaps even doxastically improper. I imply it is fully proper. This affects how we evaluate his cognitive character. If he is praised for saving his brother via belief, I say he is epistemically praiseworthy. You say he is practically praiseworthy but epistemically lucky. That is a substantive disagreement about the value of truth versus the value of success.

  CONSTITUTIVIST: Agreed. It is substantive. So let us narrow it. Here is my double crux. What would have to be true for you to abandon your position? I ask you: Is there any case where believing on practical grounds systematically leads to false beliefs, even when successful in other aims? If you found that practical reasons for belief degraded the reliability of belief as a system, would you retract?

  PRAGMATIST: Yes. If I discovered that allowing practical reasons into epistemic deliberation systematically corrupted the agent's ability to track truth in the long run, even in cases like Route Two, I would retreat. I need belief to steer. If steering requires ignoring the map, I must check if the map remains usable. If treating the Auditor's offer as a reason destroys Idris's ability to assess evidence in other domains, I concede it is not a reason for belief. Now you. What verdict on which further case would have to change for you to abandon yours?

  CONSTITUTIVIST: If there were a case where a truth-independent reason improved the belief's function as a knowledge store. Suppose a practical reason forced an agent to hold a true belief that they otherwise would have missed, and holding that belief allowed them to accumulate more truth later. If practical reasons could serve the aim of truth better than evidence itself, I would have to admit them as reasons for belief. My view rests on the claim that truth-independent reasons cannot serve the constitutive aim of belief. If they can, I fall.

  PRAGMATIST: Then we are stuck. You tie reason to the constitutive aim of truth. I tie reason to the agent's aim of success. In Route Two, the aim of truth is served, but only because the aim of success forced it. You say the derivation matters. I say the outcome validates the route.

  CONSTITUTIVIST: The derivation matters because belief is a storehouse. If we fill it with utility-based propositions, we corrupt the inventory. Even if this particular proposition is true, the policy of admitting such reasons degrades the storehouse.

  PRAGMATIST: But the storehouse exists for the agent. If the agent burns down to save the inventory, the inventory is worthless. You prioritize the purity of the instrument. I prioritize the use of the instrument.

  CONSTITUTIVIST: And I say the instrument breaks if used for anything other than its design.

  PRAGMATIST: And I say the design evolves to meet the need.

  CONSTITUTIVIST: So the fault line is not about reasons. It is about whether belief is a state defined by its origin or its function.

  PRAGMATIST: No. It is about whether normativity is unified. You allow Idris to have overriding reason to induce the state, but deny it is a reason for the state. I say that is a distinction without a difference. If he ought to be in the state, he has reason to be in the state.

  CONSTITUTIVIST: But he ought to be in the state for the sake of his brother, not for the sake of the truth. The object of the normativity shifts.

  PRAGMATIST: The object is Idris. The state is the means.

  CONSTITUTIVIST: Then you have explained away belief. You have reduced it to a tool.

  PRAGMATIST: And you have idolized it. You have made it a shrine.

  CONSTITUTIVIST: We agree on the facts of the case. We agree on the outcome. We agree on the Auditor.

  PRAGMATIST: We disagree on whether Idris, in Route Two, is thinking correctly.

  CONSTITUTIVIST: I say he is thinking practically about a theoretical state.

  PRAGMATIST: I say he is thinking theoretically about a practical necessity.

  CONSTITUTIVIST: And neither of us can prove the other wrong without begging the question on what belief is for.

  PRAGMATIST: Then the dispute remains. Not over the world, but over the mind.

  CONSTITUTIVIST: Not over the mind, but over the norm.

  PRAGMATIST: Which is the mind's law.

  CONSTITUTIVIST: Which is what we are trying to write.

  PRAGMATIST: So we stop here.

  CONSTITUTIVIST: Yes. The fault line runs through the concept of aim. Whether belief aims at truth by nature, or whether it aims at truth only because truth usually serves us.

  PRAGMATIST: And whether a reason must serve the aim, or whether the aim must serve the reason.

  CONSTITUTIVIST: We leave it there.

  PRAGMATIST: We leave it there.
