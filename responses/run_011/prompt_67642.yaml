  I'm on a four-person team that maintains the "honesty and deception" section of our lab's eval rubric — we read transcripts, decide per case whether the model's behavior counts as deception, and write a one-line rationale that eventually feeds into public-facing documentation, so the wording actually matters. After a year of this we have a log of around forty entries, but these seven are the load-bearing ones, and I've compressed them hard:

