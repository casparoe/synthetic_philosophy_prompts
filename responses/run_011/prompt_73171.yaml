answer: |-
  # The Variance of Clay

  The cardstock was heavy, cream-colored, and smelled like toner. Elara held it with two fingers, as if it might burn her. Inside the envelope was a single number: 0.78.

  Across the desk, Dr. Thorne smiled with the gentle pity of a veterinarian putting a dog down. He was the Head of School at the Vantage Institute, a place where teenagers went to become prodigies or break trying.

  "This is excellent news, Elara," Thorne said, steepling his hands. "A heritability coefficient of .78 for pitch discrimination suggests your aptitude is largely intrinsic. You're finished clay. The firing is done."

  Elara blinked. "So I get the master classes?"

  "Actually, no. Because your trait is stable, additional environmental input yields diminishing returns. We're reallocating your tuition subsidy to the students with lower coefficients. They're environmentally responsive. They need the heat." He slid a new schedule across the desk. Her private coaching was gone, replaced by unsupervised practice blocks. "We have to be efficient with resources. We don't water the plants that are already drinking rain."

  Elara walked out of the office into the hallway of the music wing. She passed Julian, who was crying quietly by the water fountain. Julian's card said 0.32. He was getting triple the lesson time. He was being watered. Elara felt like she was being left out in the sun to harden.

  That was Year One. Year Two was the Equity Initiative.

  The administration decided the disparity in numbers was unfair. To fix it, they standardized everything. Every violinist got the exact same room temperature, the same brand of rosin, the same hours of sleep monitored by wearables, the same nutritional intake. The variables were crushed. Vantage became a sterile box where the only thing allowed to differ was the student.

  Elara sat on a bench outside the greenhouse, watching Silas, the groundskeeper, wrestle with a tray of hydrangeas. They were all cuttings from the same mother plant, genetically identical clones.

  "School make you plant those all in a row?" Elara asked.

  Silas wiped dirt from his forehead. "Yep. Same soil mix, same water schedule. They want a uniform hedge for the donor walk."

  "Won't they all grow the same, then?"

  Silas shrugged, digging a trowel into the earth. "You'd think. But see this one?" He pointed to a stunted shrub in the middle of the tray. "Even with the same dirt, it's fighting. And that one over there? Vigorous. When I used to plant them all over campus, some got shade, some got sun, some got bad soil. Back then, the big differences were because of where I put 'em. A good plant in bad soil looked like a bad plant. But now?" He patted the uniform dirt. "Now that I've made the ground the same for all of 'em, the only reason one is small and one is big is because of the plant itself. Makes my job easier, I suppose. Know exactly what I'm working with."

  Elara looked at the clones. In the varied landscape of the old campus, the environment masked the genetics. In the uniform bed, the genetics screamed.

  "Doesn't mean the small one couldn't grow," Elara said quietly.

  "Not in this bed," Silas said. "But maybe in a richer one. Hard to tell now."

  That night, Elara FaceTimed Maya. They were half-sisters, sharing a father but nothing else. Maya lived in Ohio, went to a public school, and played violin in a classroom that smelled like floor wax.

  "Show me," Elara said.

  Maya held up her card. It was a printout from a state registry, crumpled at the edges. The number was 0.41.

  "Lower than mine," Elara said. "Even though we're... you know."

  "Different houses," Maya said. "My teacher quits every year. Sometimes we practice in the gym. Sometimes the AC is broken. It's a mess."

  "So your number is lower because your environment is chaotic."

  "My number is lower because I can still get better," Maya snapped. "If I get a good teacher, my score goes up. If I get a bad one, it goes down. The number changes, Elara. It's not a tattoo. What's yours now? After the big standardization?"

  Elara looked at the new card on her desk. The Audit had come out that morning. The number was 0.92.

  "It went up," Elara said. "Everyone's went up."

  "See? That's what Dad said. He said Vantage proved talent is real."

  "Thorne thinks that too. He thinks because the number is higher, it means coaching doesn't matter."

  Maya laughed, a sharp, brittle sound. "But you guys have the best coaching in the world. How can coaching not matter if you're all getting it?"

  "Because we're all getting the *same* coaching. There's no difference in the teaching anymore. So the differences in our scores have to be because of us." Elara rubbed her temples. "They made the environment flat so the genetics would look tall."

  "that doesnt make sense," Maya typed in the chat box, a typo slipping through her anger. "if everyone gets better teaching, shouldn't the number go down? because the teaching is doing the work?"

  "If everyone gets the *same* teaching, the teaching stops counting as a difference. It disappears from the equation. Thorne looks at 0.92 and sees 'Destiny.' I look at it and see 'Uniformity.'"

  Maya was quiet for a long time. "I got a scholarship to a summer program. Private tutor. My number might change again."

  "Mine won't," Elara said. "Unless I leave."

  "You can't leave. You're finished clay."

  "I'm drying out," Elara corrected.

  The third Audit came after the winter recital. The numbers were staggering. 0.95. 0.97. One cellist scored 0.99.

  Dr. Thorne called an assembly. He stood on the stage, beaming, hands spread wide. "Look at this data! We have stripped away the noise of inequality. We have provided identical conditions for every child. And what do the numbers tell us? They tell us that the variation between you is innate. It is biological. We are no longer fighting against circumstance. We are witnessing the pure architecture of talent."

  The applause was polite, confused. Elara sat in the back, her violin case at her feet. She thought about Silas's hydrangeas. They were all in the same soil, but some were still small. Thorne looked at the small ones and said, "See? They were never meant to be tall." Elara looked at them and thought, "You never changed the soil. You just made sure everyone was equally stuck in it."

  The Board of Directors called a public hearing the following week. The topic was whether to renew the Audit contract. The room was filled with parents, some furious, some relieved. They wanted to know if the system was fair.

  Elara had signed up to speak. She wasn't sure what she could do. She wasn't a statistician. She was a junior with a funding cut and a violin she couldn't afford to restring.

  When her name was called, she walked to the podium. The microphone was too low; she had to bend to speak into it. Dr. Thorne sat at the center table, looking at her with that same kind, veterinary eyes. He believed he was saving them from false hope. He believed he was being kind by telling them who they were.

  Elara looked out at the parents. She saw Julian's mother, who was thankful for the extra lessons. She saw her own father, who looked tired. She thought about Maya, in Ohio, whose number changed with the weather and the budget. She thought about the hydrangeas, identical seeds telling different stories depending on where the dirt was dug.

  She didn't have thirty minutes. She had thirty seconds. She didn't need to explain the math. She just needed to point at the garden.

  "Dr. Thorne says the high numbers prove our potential is fixed," Elara said, her voice shaking slightly before steadying. "He says that because we all have the same rooms and the same teachers, the differences between us must be who we are inside. But if you make everyone wear the same shoes, you don't prove who can run fastest. You just prove that nobody has better shoes than anybody else. You haven't found our limits. You've just stopped looking for the ground that helps us grow."

  She looked directly at Thorne, who was already reaching for his pen to sign the renewal.

  "We aren't finished clay," Elara said. "You just stopped watering the garden."
