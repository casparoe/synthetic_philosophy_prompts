      *   **MC:** Elara. Trait: Violin (Pitch Discrimination/Technical Precision).
      *   **Half-Sister:** Maya. Raised elsewhere.
      *   **Head of School:** Dr. Aris Thorne. Well-meaning, obsessed with data.
