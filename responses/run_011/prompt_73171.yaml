      *   **The Ending:** The Public Hearing. Elara's 30 seconds. The final line.

  5.  **Refining the Science/Narrative Alignment:**
      *   *Challenge:* The prompt says "heritability... goes UP when you make everyone's environment the same, which is the exact opposite of what everyone assumes it means."
      *   *School's Assumption:* High $h^2$ = Fixed trait. Low $h^2$ = Malleable.
      *   *Reality:* High $h^2$ = Environment is uniform (or irrelevant in this range).
      *   *The School's Action:* They make environment uniform.
      *   *The Result:* $h^2$ goes up.
      *   *The School's Interpretation:* "See, we removed environment, and the number went up, proving genetics is all that matters."
      *   *The Reality:* They proved that *variation* is now mostly genetic because they removed environmental variation. But they missed that by standardizing, they might have standardized on a *suboptimal* environment for everyone, or simply masked the potential for growth.
      *   *Wait, let's look closer at the prompt's specific logic:* "The administration reads a high number as 'this one is finished clay, coaching won't do anything'... while the low-number kids get all the resources."
      *   *If $h^2$ is high:* It means most variation in the population is due to genes. The school interprets this as "You can't improve this individual."
      *   *If $h^2$ is low:* It means most variation is due to environment. The school interprets this as "Coaching will fix you."
      *   *The Experiment:* School makes environment identical.
      *   *The Outcome:* Environmental variance drops to near zero. Heritability ($V_g / (V_g + V_e)$) shoots up.
