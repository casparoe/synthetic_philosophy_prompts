          *   Format: Title, full story, 1 typo allowed in text.

  2.  **Deconstruct the Science (Heritability):**
      *   $h^2$ = Variance due to genetics / Total Variance.
      *   Total Variance = Genetic Variance + Environmental Variance.
      *   If you reduce Environmental Variance (make everyone's environment identical), the denominator shrinks (assuming Genetic Variance stays same), so $h^2$ goes *up*.
      *   High $h^2$ does *not* mean "unchangeable." It means "in this specific population, with this specific range of environments, differences are mostly due to genes."
      *   The school's logic is backwards: They treat high $h^2$ as "cannot improve" (fixed), but actually, high $h^2$ in this context means "environment isn't varying enough to show differences." Wait, the prompt says: "The administration reads a high number as 'this one is finished clay, coaching won't do anything' and quietly stops paying for that student's lessons, while the low-number kids get all the resources because they're 'environmentally responsive.'"
      *   *Correction on School Logic:* The school thinks High $h^2$ = Genetic Determinism (can't change). Low $h^2$ = Environmental Malleability (coaching works).
      *   *The Twist:* When the school makes environments identical, $h^2$ goes up for everyone. The Head thinks this confirms genetics rule. Actually, it confirms that because environment is now constant, the remaining variation *must* be genetic, but it doesn't mean the trait couldn't have been shifted overall by a *better* environment earlier.
      *   *The Half-Sister:* Needs to show that different environments lead to different expressions, implying the trait isn't fixed regardless of the number.
      *   *The Metaphor:* Groundskeeper or PKU/Height. Let's use the Groundskeeper/Plants metaphor as suggested ("same seeds, two different beds of soil"). It fits the "arts-and-science" campus vibe.

  3.  **Character & Setting Development:**
