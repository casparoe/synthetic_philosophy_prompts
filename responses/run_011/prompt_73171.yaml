      *   *The Sister:* Needs to show that $h^2$ is population-specific. If Maya is in a different population (different state, different school), her $h^2$ is different. Maybe Maya had a *lower* number because her environment was wilder, suggesting she has more room to grow, while Elara is stuck in the "high heritability" trap of the elite school.

  6.  **Writing - Focus on Tone:**
      *   Avoid jargon. No "variance," "phenotype," "genotype."
      *   Use "The Number," "The Card," "The Audit."
      *   Make the administrators sound bureaucratic but caring. "We want to allocate resources where they matter."
      *   Make the students sound resigned or competitive.

  7.  **Drafting - Step-by-Step:**

      *   *Title:* The Variance of Clay. (Or something about numbers/seeds). Let's go with *The Coefficient of Clay*.
      *   *Opening:* Elara holding the card. 0.78. The advisor breaking the news gently.
      *   *Middle:* The standardization. The call with Maya. Maya's number is 0.42. Why? Because her public school had wildly varying teachers.
      *   *Groundskeeper:* Silas planting hydrangeas. Soil pH changes color (classic example). Or just growth height. Let's use the hydrangea color—it's visual. Same plant, different soil, different look. But if all soil is same, all look same (low variance? No, wait).
      *   *Correction on Metaphor:* To show heritability rising with uniform environment:
          *   Scenario A (Varied Environment): Plants grow different heights. Some due to soil, some due to seed. Hard to tell which is which. Low heritability estimate.
          *   Scenario B (Uniform Environment): All soil identical. Differences in height *must* be due to seeds. High heritability estimate.
          *   Silas scene: He complains about the school making him use the same fertilizer everywhere. "Now I can't tell which bushes are actually thirsty and which just got less water before."
      *   *The Hearing:* Elara steps up. She doesn't explain the math. She points to the result.

  8.  **Word Count Check:**
