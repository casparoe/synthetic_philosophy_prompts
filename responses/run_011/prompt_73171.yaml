      *   **Core Concept:** Heritability ($h^2$), specifically the misconception that it applies to individuals rather than populations, and the counter-intuitive fact that heritability *increases* when environmental variance decreases (everyone gets the same environment).
      *   **Constraint:** No lectures. No character explaining the concept to someone who already knows it. The concept must be shown through plot and action.
      *   **Setting:** A competitive residential arts-and-science program (needs a name). Annual event called "The Audit." Students get a card with an $h^2$ number for their specific trait.
      *   **Plot Points:**
          *   Main Character (MC) gets a high number (0.78) and loses funding/support (admin thinks she's "finished clay").
