  4.  **Drafting - Section by Section:**

      *   **Introduction:** The Audit day. Elara gets her card (0.78). The immediate consequence (funding cut). Establish the school's logic without explaining the math.
      *   **Rising Action:** The "Equity Initiative." Everyone gets the same room, same teacher, same food. The atmosphere becomes sterile.
