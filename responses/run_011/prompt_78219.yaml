      *   *Prosecution Capacity:* Starts high, drops as amnesty is granted. If capacity hits 0, no more trials.
      *   *Verification:* Commissioners check dossiers against each other. If Applicant A says "We buried at Site X" but Applicant B (who was there) says "Site Y", A fails disclosure.
      *   *The "Commitment" Trap:* Applicants apply in sequence. Early applicants risk talking without knowing if others will corroborate. Late applicants risk prosecution capacity running out before they can apply, OR prosecution capacity being too low to threaten them into talking.
      *   *The "Diminishing Threat" Trap:* Every amnesty granted reduces the "Prosecution Points" available to punish those who *don't* apply or fail.
      *   *The "Interdependent Truth" Trap:* To get the "Full Truth" bonus, specific combinations of applicants must be granted amnesty.

      *Refining the Payoff:*
