  8.  **Addressing the "Parameter":**
      *   What makes it fire? The *rate of prosecutorial decay* vs. *verification overlap*. If prosecution doesn't decay, the threat remains. If overlap is too high, verification is easy.
      *   *Decision:* The decay rate is the critical tension. It must be visible and scary.

  9.  **Addressing the "Affirmative Case" Variation:**
      *   How to show amnesty is *good*?
      *   Rule change: If Amnesty is denied, the applicant burns the dossier (truth lost forever). If granted, truth is recorded. This shows the "Truth for Justice" tradeoff explicitly.

  10. **Drafting the Content (Mental Check against Constraints):**
