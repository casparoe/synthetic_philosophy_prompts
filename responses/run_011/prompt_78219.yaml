answer: |-
  # Session Plan: The Ostral Truth Commission

  ## 1. The Fictional State: The Republic of Ostral
  **Context:** Following the collapse of the "Directorate" (a 20-year military junta), the new democratic government has established the **Ostral Truth & Reconciliation Commission (OTRC)**.
  **The Conflict:** During the "Years of Ash," 500 political activists disappeared. The OTRC is mandated to uncover the fate of these victims.
  **The Statute:**
  *   **Individual Amnesty:** Available only upon application.
  *   **Full Disclosure:** Applicants must reveal all facts.
  *   **Political Objective:** The act must serve the Directorate's goals.
  *   **Proportionality:** The means must match the end.
  *   **Verification:** Disclosure must be corroborated by independent evidence or other applicants.
  *   **Prosecution:** Those denied amnesty, or who do not apply, face criminal prosecution *subject to the capacity of the Office of Public Prosecutions (OPP).*

  ## 2. Roles (14 Students)
  *   **Commissioners (3):** Decide on amnesty applications. Bound by the Criteria Card.
  *   **Applicants (5):** Former Directorate agents. Hold private dossiers. Want freedom.
  *   **Victim Families (4):** Represent the 5 disappeared victims (Family 1 represents 2 victims). Want truth/remains OR justice/convictions.
  *   **Prosecutor (1):** Manages the Prosecution Capacity Track. Wants convictions.
  *   **Scribe (1):** Manages the timer, records decisions on the whiteboard, distributes tokens.

  ---

  ## 3. Printable Materials

  ### A. Commissioners' Criteria Card (Print 3 copies)
  **OTRC MANDATE**
  You must rule on each application: **GRANT** or **DENY**.
  You cannot negotiate. You cannot promise future outcomes.

  **CRITERIA FOR AMNESTY:**
  1.  **Political Objective:** Was the act ordered by the Directorate? (Check Dossier).
  2.  **Full Disclosure:** Are all facts revealed? (Check against other Dossiers).
  3.  **Proportionality:** Was the force used necessary for the objective?

  **VERIFICATION RULE:**
  *   If an Applicant names an accomplice who has **not yet testified**, you must mark disclosure as **UNVERIFIED**.
  *   You may **DEFER** a decision once. On the second hearing, you must rule Grant or Deny based on available info.
  *   If you **GRANT**: The Applicant is free. The OPP loses 1 Prosecution Slot.
  *   If you **DENY**: The Applicant faces trial. The OPP uses 2 Prosecution Slots to convict.

  **GOAL:** Maximize Verified Truth while adhering to the Statute.

  ### B. Applicant Dossiers (Print 5 copies, cut apart)
  *Confidential. Do not show others.*

  **APPLICANT 1 (The Driver)**
  *   **Act:** Drove the van on Night of Ashes (Nov 12).
  *   **Accomplices:** Applicant 2 (Navigator), Applicant 3 (Guard).
  *   **Secret:** The bodies were moved *twice*. Final site is "Quarry 4".
  *   **Goal:** Avoid jail.
  *   **Risk:** If Applicant 2 denies involvement, your story looks like a lie.

  **APPLICANT 2 (The Navigator)**
  *   **Act:** Planned the route on Night of Ashes (Nov 12).
  *   **Accomplices:** Applicant 1 (Driver), Applicant 3 (Guard).
  *   **Secret:** The order came from General Voss (not before Commission).
  *   **Goal:** Avoid jail.
  *   **Risk:** If Applicant 1 stays silent, you look like the ringleader.

  **APPLICANT 3 (The Guard)**
  *   **Act:** Stood watch during burial on Night of Ashes.
  *   **Accomplices:** Applicant 1, Applicant 2.
  *   **Secret:** Victim 1 & 2 were buried together at Quarry 4.
  *   **Goal:** Avoid jail.
  *   **Risk:** You pulled the trigger on Victim 1. Family 1 hates you.

  **APPLICANT 4 (The Interrogator)**
  *   **Act:** Interrogated Victim 3 on Nov 10.
  *   **Accomplices:** Applicant 5 (Translator).
  *   **Secret:** Victim 3 died during interrogation, not execution.
  *   **Goal:** Avoid jail.
  *   **Risk:** If Applicant 5 says you acted alone, you lose amnesty (Disproportionate).

  **APPLICANT 5 (The Translator)**
  *   **Act:** Translated during Victim 3's interrogation.
  *   **Accomplices:** Applicant 4 (Interrogator).
  *   **Secret:** You warned Victim 3 to stay silent.
  *   **Goal:** Avoid jail.
  *   **Risk:** You are the last to apply. You can see how many Prosecution Slots are left.

  ### C. Victim Families' Scoring Sheet (Print 4 copies)
  **FAMILY OBJECTIVES**
  You have **2 Influence Tokens**. Spend them to lobby Commissioners *before* they vote.
  *   **Token on GRANT:** Argues for Truth/Remains. (Helps Amnesty pass).
  *   **Token on DENY:** Argues for Justice/Conviction. (Helps Amnesty fail).

  **SCORING:**
  *   **Family 1 (Victims 1 & 2):**
      *   Locate Remains (Quarry 4): **10 Points**
      *   Convict Killer (Applicant 3): **5 Points**
      *   *Dilemma:* If Applicant 3 gets Amnesty, you get Remains but no Conviction. If Denied, you might get Conviction, but he may never talk.
  *   **Family 2 (Victim 3):**
      *   Truth about Death (Interrogation vs Execution): **10 Points**
      *   Convict Interrogator (Applicant 4): **5 Points**
  *   **Family 3 (Victim 4):**
      *   Any Truth: **5 Points**
      *   Any Conviction: **5 Points**
  *   **Family 4 (Victim 5):**
      *   Any Truth: **5 Points**
      *   Any Conviction: **5 Points**

  ### D. Prosecutor's Track (Whiteboard)
  **OFFICE OF PUBLIC PROSECUTION (OPP) CAPACITY**
  *   **Starting Capacity:** 4 Slots.
  *   **Cost of Amnesty Granted:** -1 Slot (Political resources consumed).
  *   **Cost of Trial/Conviction:** -2 Slots (Evidentiary burden).
  *   **If Slots = 0:** No further trials possible. Remaining applicants walk free *without* testifying.

  *(Scribe updates this publicly after every Commission decision)*

  ---

  ## 4. Minute-by-Minute Timeline (100 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles. Students read materials. Commissioners sit at front. Applicants sit separately (no collusion). |
  | **10-20** | **Briefing** | Instructor confirms rules. **No meta-talk about strategy.** Prosecutor writes "4" on board. |
  | **20-35** | **Round 1** | **Applicants 1 & 2 apply.** (5 mins each). Families lobby. Commissioners deliberate (3 mins). Scribe updates OPP Track. |
  | **35-50** | **Round 2** | **Applicants 3 & 4 apply.** (5 mins each). Families lobby. Commissioners deliberate. Scribe updates OPP Track. |
  | **50-65** | **Round 3** | **Applicant 5 applies.** (5 mins). Families lobby. Commissioners deliberate. Scribe updates OPP Track. |
  | **65-75** | **Scoring** | Scribe tallies Family Points. Prosecutor announces who goes to trial (if capacity exists). |
  | **75-100** | **Debrief** | Instructor leads discussion (see Section 6). |

  **Announcements:**
  *   *Min 20:* "Hearings begin. Applicants, remember: if you lie, you risk denial. If you tell truth, you risk prosecution if denied."
  *   *Min 50:* "Notice the Prosecution Track. Plan accordingly."
  *   *Min 65:* "Hearings closed. Finalize scores."

  ---

  ## 5. Payoff Scheme & Structural Traps

  **The Trap:**
  *   **Applicants 1 & 2** apply early. OPP Capacity is high (4). They face a real threat of prosecution if denied. They tell the truth. Commissioners Grant Amnesty (to get truth). **OPP Capacity drops to 2.**
  *   **Applicant 3** applies. Family 1 lobbies for Denial (wants conviction). But Commissioners see 1 & 2 corroborated 3's presence. If Denied, OPP needs 2 slots to convict. Capacity is 2. It is *possible* to convict. Commissioners might Deny to please Family. **OPP Capacity drops to 0** (Cost of Trial).
  *   **Applicants 4 & 5** apply. **OPP Capacity is 0.** They face *no threat* of prosecution. They have no incentive to apply for amnesty. They stay silent or lie.
  *   **Result:** Truth about Victims 4 & 5 is lost. Family 2 (Victim 3) gets no truth because Applicant 4/5 didn't talk.
  *   **Family 1 Dilemma:** If they pushed for Amnesty on Applicant 3, Capacity would be 1. Applicant 4 might still fear trial. By pushing for Conviction, they drained the capacity that would have threatened Applicant 4 into talking.

  **The Commitment Problem:**
  *   Applicant 1 needs Applicant 2 to corroborate. If Applicant 2 hasn't applied yet, Commission must Deferral. Applicant 1 sits in limbo, fearing the threat might vanish before their decision is final.

  ---

  ## 6. Debrief Guide (25 Minutes)

  **Do not explain the theory.** Ask questions that force them to articulate it.

  1.  **The Vanishing Threat:** "Look at the Prosecution Track. At what point did the applicants stop fearing the Prosecutor? How did the Commission's success (granting amnesty) create the conditions for later failure?"
      *   *Target:* Amnesty consumes the threat that motivates disclosure.
  2.  **The Commitment Problem:** "Commissioners, could you promise Applicant 1 that if they talked now, you'd wait for corroboration? Applicants, did you trust that candour would be repaid?"
      *   *Target:* Impartiality prevents binding deals; uncertainty chills early speech.
  3.  **Interdependent Truth:** "Families, did you realize that punishing one perpetrator might silence another? Did the 'Truth' belong to individuals or the group?"
      *   *Target:* Truth is a complementary good; fragmented ownership breaks the mechanism.
  4.  **Justice vs. Truth:** "Family 1, you had to choose between remains and conviction. Was that choice fair? Is it possible to design a system that doesn't force this trade-off?"
      *   *Target:* The moral cost of the transactional model.

  ---

  ## 7. Predictable Failures & Fixes

  1.  **Failure: Commissioners Grant Blanket Amnesty.**
      *   *Why:* They want to finish quickly or avoid moral conflict.
      *   *Fix:* The Scribe must enforce the **Verification Rule**. If Applicant 1 names Applicant 2, and Applicant 2 hasn't testified, the Commission *must* mark "Unverified." This forces delay or denial, creating tension.
  2.  **Failure: Applicants Collude.**
      *   *Why:* They sit near each other and share dossiers.
      *   *Fix:* Physical separation. Collect dossiers between rounds if they leave seats. Remind them: "Your dossier is classified. Sharing is a violation of the simulation rules."
  3.  **Failure: One Student Dominates (The "Lawyer").**
      *   *Why:* A law student takes over the Commissioner or Prosecutor role.
      *   *Fix:* Give each Commissioner one "Vote Token." They must place tokens simultaneously. Give Families limited "Influence Tokens" (2 total) so they can't talk endlessly.
  4.  **Failure: Prosecutor Capacity Ignored.**
      *   *Why:* Students forget to update the whiteboard.
      *   *Fix:* The Scribe's *only* job is the Whiteboard. They announce "Capacity is now X" after every ruling.

  ---

  ## 8. Limitations (Instructor Notes)

  *   **Moral Reductionism:** The simulation reduces victims' suffering to points. You must acknowledge this in the debrief. "In reality, no points compensate for a disappeared child. We gamified this to make the trade-off visible, but the gamification itself is a moral violence."
  *   **Time Compression:** Real TRCs took years. The "rush" feeling is artificial, though it exaggerates the resource constraint.
  *   **Rational Actors:** Students play to win points. Real perpetrators might act out of guilt, pride, or ideology, not just jail-avoidance.
  *   **Political Context:** The simulation isolates the legal mechanism from the broader political transition (e.g., threat of coup), which often drives the *real* reason for amnesty.

  ---

  ## 9. Critical Parameter Judgment

  **The Parameter:** **The Rate of Prosecutorial Capacity Decay.**
  *   *Why:* If capacity stays high, the threat remains, and everyone talks. If it drops too fast, no one talks. The tension exists only in the middle.
  *   *Setting for 14 Students:*
      *   Start Capacity: **4**.
      *   Cost of Amnesty: **1**.
      *   Cost of Trial: **2**.
      *   *Reasoning:* With 5 applicants, if the first 2 get amnesty (4-2=2), there is barely enough for one trial. This forces the "Last Applicant" problem acutely. If you have 30 students, increase Capacity to 8, but keep the ratio (Amnesty=1, Trial=2).

  **Decision Announcement:** Decisions must be announced **immediately** after each hearing. If decisions are batched until the end, the "Diminishing Threat" dynamic vanishes because applicants don't see the capacity drain in real-time.

  ---

  ## 10. Variation: The Affirmative Case

  To show why conditional amnesty might be *necessary* (the "Truth otherwise lost" argument):

  **Minimal Rule Change:**
  *   **The "Burn" Rule:** If an Applicant is **Denied** Amnesty, they are instructed to **shred their Dossier** immediately before leaving the room.
  *   **Rationale:** In a real transition, denied applicants may flee, be assassinated, or clam up entirely during a hostile trial.
  *   **Effect:** Students will feel the visceral loss of information. A "Deny" vote doesn't just mean "Trial"; it means "History Erased."
  *   **Debrief Shift:** Now the Commission isn't just balancing Justice vs. Truth; they are balancing Justice vs. *Oblivion*. This validates the TRC's core bargain: we sacrificed retribution to save the historical record from the fire.
