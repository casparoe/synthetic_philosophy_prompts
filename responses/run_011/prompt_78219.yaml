      *   *Actually, the structural problem is about the *Commission's* ability to get truth.*
      *   *Let's focus on the Applicants' incentive.*
      *   *Applicant Incentive:* Apply for Amnesty. Risk: Rejection = Prosecution. Reward: Freedom.
