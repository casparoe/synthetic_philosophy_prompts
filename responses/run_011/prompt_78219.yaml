      *   *Result:* Early applicant talks, waits for corroboration. Late applicant sees capacity drop, stays silent. Early applicant denied amnesty, prosecuted (but capacity low?), Truth lost.

      *Okay, this captures the three problems.*
      1.  Diminishing Threat (Capacity track).
      2.  Commitment (Commission can't promise Amnesty until corroboration arrives).
      3.  Interdependent Truth (Need 2 to verify).

      *Family Dilemma:* Family wants Remains. Only Applicant E knows. Applicant E applies last. By then, Capacity is 0. E stays silent. Family gets nothing. If Family pressured Commission to save Capacity earlier, maybe E would talk? No, Family wants Convictions.
      *   Let's give Families "Pressure Tokens". They can spend to force a Rejection (save capacity) or Acceptance (spend capacity).

      *Okay, ready to write.*

