      *   5 Applicants.
      *   4 Families.
      *   1 Prosecutor.
      *   1 Scribe.
      *   Total: 14. Perfect.

  7.  **Addressing the "Failures":**
      *   Commissioners might just say "Yes" to everyone to finish fast. *Fix:* Tie Commissioner success to "Verified Truth" not just throughput.
