  6.  **Timeline Construction:**
      *   0-10: Setup & Role Assignment.
      *   10-20: Private Study (Reading dossiers/rules).
      *   20-80: The Hearings (3 Rounds).
      *   80-100: Debrief.
      *   *Wait, 14 students.*
