      *   If Tokens run out, remaining applicants walk free *without* giving truth.
      *   *Verification:* Applicants have pieces of a code. Commission needs 2 pieces to verify.
      *   *The Trap:* Early applicants talk. Commission grants amnesty. Tokens drain. Late applicants see tokens are gone. They realize they can walk free without talking. They stay silent. Truth is lost.
      *   *The Verification Trap:* Applicant 1 talks. Needs Applicant 2 to corroborate. Applicant 2 hasn't applied yet. Commission must defer. Applicant 1 gets anxious.

      *(Self-Correction)*: Keep it simpler for 100 mins.
      *   Rounds: 3.
      *   Prosecution Power: Starts at 4. Drops by 1 every round regardless? No, drops when Amnesty granted.
      *   Let's go with the "Diminishing Threat" model explicitly in the rules without naming it.
      *   *Rule:* "The Office of Public Prosecutions (OPP) has limited resources. For every Amnesty Granted, the OPP loses the capacity to prosecute one future case."
      *   *Applicant Dossiers:* Each has a "Secret" and a "Corroboration Need".
      *   *Family:* Scored on "Remains Found" vs "Convictions".

      *Wait, the prompt asks for the Family to face a choice.*
      *   Family gets a private goal card. "Priority: Remains" or "Priority: Justice".
      *   But the structural problem is about the *system*.
      *   Let's ensure the *system* forces the choice.
      *   If the Commission grants amnesty to get the truth, they reduce prosecution capacity.
      *   If they deny to save prosecution capacity, they lose the truth.
      *   Families observe this.

      *Okay, let's lock the design.*
      *   State: Ostral.
      *   Crime: The "Night of Ashes" (5 disappearances).
      *   Applicants: 5 (A-E).
      *   Commissioners: 3.
      *   Families: 4 (Representing 5 victims, one family represents 2).
      *   Prosecutor: 1.
      *   Scribe: 1.
      *   Prosecution Capacity: 4 Indictments available at start.
      *   Cost of Amnesty: 1 Indictment capacity removed from the pool (Political cost/Resource shift).
      *   Cost of Trial: 2 Indictments needed to secure a conviction (Evidence burden).
      *   *Wait, that math is tricky.*
      *   *Simpler:* Prosecution Capacity Track: 5 -> 4 -> 3...
      *   If Capacity > 0, non-amnestied applicants face trial (Risk).
      *   If Capacity = 0, non-amnestied applicants walk free (No Risk).
      *   *Applicant Goal:* Avoid Jail.
      *   *If Capacity is high:* Apply for Amnesty (Safe).
      *   *If Capacity is low:* Don't Apply (Walk free anyway).
      *   *Result:* Early applicants talk. Late applicants stay silent. Truth is fragmented.
