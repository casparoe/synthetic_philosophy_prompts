prompt: |-
  I am auditing a graduate seminar in political theology this term, and its organizer has built the whole unit on political violence around a single sentence drawn from Aquinas's discussion of sedition in the Secunda Secundae: "a tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler" — and therefore, he continues, disturbing such a government is not sedition, unless the disturbance does the subjects more harm than the tyranny itself did. That sentence has become the seminar's all-purpose answer. Last week a classmate used it to shut down a question about whether a crowd that stormed a courthouse had any standing to act, and outside the seminar the same line circulates whenever anyone wants to insist that the people who rioted were on the right side of history. I am not persuaded one sentence can do all that work, but I cannot yet say why.

  The complication is that another member of the seminar wants to import it into law. Her project is a model jury instruction for sedition and insurrection offenses under which a defendant may argue that the government he acted against had forfeited its claim to stand for the common good, so that his conduct was not seditious at all but defensive; a proportionality proviso, taken from Aquinas's caveat, would require the jury to weigh the harm caused by the disturbance against the harm caused by the regime. As I understand it, nothing of the kind is available in practice today: legitimacy is not a question the jury may entertain, and the nearest analogue, nullification, is not a right anyone can assert. The proposal is therefore genuinely novel, and its defenders say the Aquinas line is its foundation.

  Could you set out, as a menu I can bring to the seminar, the distinct precise claims this one sentence might be making? I want the readings separated rather than blended: is it a stipulative point about what "sedition" means in Aquinas's technical vocabulary — he follows Augustine in taking a people to be "the assembly of those who are united together in fellowship recognized by law and for the common good," and treats sedition as an offense against that unity — or a substantive moral claim that resistance to tyranny is permissible, or a narrower claim about how guilt distributes between the authors of a disturbance and its followers, or a claim about what the tyrant has forfeited? For each reading, tell me whether it becomes trivial once the definitions are granted, whether it is defensible, whether it is false, and whether it is merely verbal. In particular: does Aquinas meet the objection that delivering a multitude from a tyrant is praiseworthy by redefining "the people," and if so, has he said something or only rearranged terms? And what is the proportionality proviso doing — a moral limit on resistance, a condition on the concept, or a hedge against precisely the objection my classmate refused to answer?

  Finally, say which of these readings, if any, would support the proposed jury instruction and which would leave it unsupported; what premises the legal version requires that Aquinas never supplies — who identifies a tyranny, by what procedure, and whether a modern state is a "multitude" in his sense at all; and which reading my classmate was invoking when he used the line to end an argument. I am not looking for a defense of one reading and need no bibliography: just the disambiguation, with verdicts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is auditing a graduate seminar in political theology.
      *   **Core Text:** A specific sentence from Aquinas's *Summa Theologiae* (Secunda Secundae, Q. 42, on Sedition): "a tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler" (plus the caveat about disturbance causing more harm than the tyranny).
      *   **Problem:** The seminar organizer and students are using this single sentence as an "all-purpose answer" to justify political violence/resistance, potentially importing it into modern law (model jury instruction).
      *   **User's Skepticism:** The user feels one sentence cannot do all this work but needs help articulating *why*.
      *   **Task:** Provide a "menu" of distinct, precise claims this sentence might be making.
      *   **Requirements:**
          *   Separate the readings (don't blend them).
          *   Categorize each reading (stipulative/semantic, substantive moral, distribution of guilt, forfeiture claim).
          *   Evaluate each reading (trivial, defensible, false, merely verbal).
          *   Address specific sub-questions: Does Aquinas redefine "the people"? What is the proportionality proviso doing?
          *   Legal Application: Which readings support the jury instruction? What premises are missing?
          *   Classmate's Usage: Which reading was the classmate invoking?
          *   Constraint: No bibliography, no defense of one reading, just disambiguation with verdicts.

  2.  **Deconstruct the Aquinas Text (ST II-II, Q. 42, Art. 2):**
      *   *Context:* Aquinas is discussing sedition (*seditio*). He defines it as contrary to the unity and peace of a multitude.
      *   *The Quote:* "Regimen tyrannicum non est justum, quia non ordinatur ad bonum commune, sed ad bonum privatum regentis." (The tyrannical rule is not just, because it is not ordered to the common good, but to the private good of the ruler.)
      *   *The Conclusion:* Therefore, disturbing this regime does not have the character of sedition (*non habet rationem seditionis*), unless the disturbance is inordinate (causes more harm than the tyranny).
      *   *Key Distinction:* Sedition is a sin against the *people* (defined by law and common good). If the ruler attacks the common good, he attacks the basis of the people's unity.

  3.  **Drafting the "Menu" of Readings:**

      *   *Reading 1: The Semantic/Stipulative Reading.*
          *   Claim: "Sedition" is technically defined as opposition to a *just* authority seeking the *common good*. Therefore, opposing a tyrant isn't "sedition" by definition.
          *   Verdict: Trivial/Verbal. It defines the word out of existence for tyranny. Doesn't necessarily justify the act, just names it differently.
      *   *Reading 2: The Substantive Moral Permission Reading.*
          *   Claim: It is morally permissible (or praiseworthy) to resist tyranny, provided proportionality is met.
          *   Verdict: Defensible within Thomistic natural law, but requires more than this sentence (requires account of who resists, how, etc.).
      *   *Reading 3: The Forfeiture of Authority Reading.*
          *   Claim: The tyrant forfeits the right to rule, so the obligation of obedience dissolves.
          *   Verdict: Defensible, but raises the "who decides" problem.
      *   *Reading 4: The Distributive Guilt Reading.*
          *   Claim: The guilt lies with the tyrant, not the resistors. The tyrant is the true seditionist.
          *   Verdict: Rhetorically powerful, legally risky.
      *   *Reading 5: The Proportionality/Consequentialist Hedge.*
          *   Claim: Even if resistance is allowed, it is bounded by harm reduction.
          *   Verdict: Crucial limit, often ignored by the students.

  4.  **Addressing Specific Sub-Questions:**
      *   *Redefining "The People":* Aquinas follows Augustine. A "people" is a fellowship of law and common good. If the ruler destroys the common good, he dissolves the people. Is this verbal? It's ontological in his framework, but looks verbal to a modern positivist.
      *   *Proportionality Proviso:* It acts as a moral limit (consequentialist check) on the deontological permission to resist. It prevents the cure from being worse than the disease.

  5.  **Analyzing the Legal Proposal (Jury Instruction):**
      *   *Compatibility:* Only Reading 2 (Moral Permission) and Reading 3 (Forfeiture) support it. Reading 1 (Semantic) doesn't help a jury decide facts, only labels.
      *   *Missing Premises:*
          *   *Epistemic:* Who determines the government is tyrannical? (Aquinas implies public notoriety or superior authority, not individual jurors).
          *   *Procedural:* Aquinas prefers public authority to depose tyrants, not private mobs (see *De Regno*).
          *   *Ontological:* Is the modern state a "multitude" in the Thomistic sense (teleological unity) or a legal construct?
      *   *Verdict:* The legal proposal collapses without an institutional mechanism to declare tyranny.

  6.  **Analyzing the Classmate's Usage:**
      *   *Context:* Shutting down a question about standing (who has the right to act).
      *   *Reading:* Likely Reading 1 (Semantic) mixed with Reading 2 (Moral). "It's not sedition, so you can't criticize it as sedition."
      *   *Verdict:* Fallacious closure. It bypasses the question of *who* acts and *how*.

  7.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Tone:* Needs to be academic, precise, neutral (as requested), and structured as a "menu."
      *   *Constraint Check:* Did I avoid bibliography? Yes. Did I avoid defending one reading? Yes. Did I separate the readings? Yes.
      *   *Nuance:* Ensure the distinction between "not sedition" (label) and "permissible" (moral status) is clear. Aquinas says it lacks the *ratio* (essence) of sedition, which implies it's not sinful *in that specific way*, but doesn't automatically make every act of resistance good (hence the proportionality clause).
      *   *Legal translation:* Emphasize the gap between theological sin and legal crime. Sedition in law is about the act against the state, regardless of the state's moral quality (usually).

  8.  **Final Structure:**
      *   Introduction: Acknowledge the density of the sentence.
      *   Section I: The Menu of Readings (1-5).
      *   Section II: The "People" and the Proviso (Addressing specific theoretical questions).
      *   Section III: The Legal Translation (Jury Instruction viability).
      *   Section IV: The Classmate's Move (Rhetorical analysis).
      *   Conclusion: Summary of the gap.

  9.  *(Final Polish)*: Ensure the distinction between *stipulative* (definition) and *substantive* (moral reality) is sharp. Make sure the "verdicts" are clear for each reading. (e.g., "Verdict: Merely verbal," "Verdict: Defensible but incomplete").

  10. *Wait, one check on Aquinas:* Does Aquinas explicitly say private individuals can kill tyrants? In *De Regno*, he warns against this if it leads to worse tyranny. In *ST*, he focuses on the *definition* of sedition. The seminar is leaning heavily on the *ST* quote to justify private action (rioting). I need to highlight that Aquinas is cautious about *who* resists. The prompt asks about the *sentence*, but the context implies private action. I must note that the sentence doesn't authorize *anyone* to act, only that the act isn't *sedition*.

  11. *Refining the Legal Section:* The prompt asks about "legitimacy is not a question the jury may entertain." I need to explain *why* Aquinas doesn't solve this for a modern jury (lack of competent authority to judge).

  12. *Final Review against constraints:* "No bibliography," "just the disambiguation, with verdicts." Okay, keep it tight.

  *(Self-Correction)*: I need to make sure I don't sound like I'm dismissing Aquinas, but rather showing the limits of *this specific sentence* when stretched to cover modern legal/insurrectionary contexts.

  Let's assemble the response.

  *   **Reading 1: Definitional Exclusion.** (It's not sedition by definition).
  *   **Reading 2: Moral Justification.** (Resistance is good).
  *   **Reading 3: Authority Forfeiture.** (Tyrant loses standing).
  *   **Reading 4: Guilt Transference.** (Tyrant is the seditionist).
  *   **Reading 5: The Proportionality Constraint.** (The "unless" clause).

  *   **The "People" Question:** Is it verbal? It's metaphysical in Aquinas, verbal in positivism.
  *   **The Proviso:** It's a moral limit, not a definitional one.
  *   **Legal:** Fails on epistemic authority (who decides tyranny?).
  *   **Classmate:** Used Reading 1 to block Reading 2's requirements.

  Okay, ready to write.
answer: |-
  Here is a disambiguation of the distinct claims embedded in the sentence, structured as a menu for your seminar. Each reading isolates a specific logical function the sentence might be performing, followed by a verdict on its status and limits.

  ### I. The Menu of Readings

  **1. The Stipulative (Semantic) Reading**
  *   **The Claim:** This is a definition of terms. In Aquinas's technical vocabulary, "sedition" is *defined* as opposition to a legitimate authority pursuing the common good. Since a tyranny does not pursue the common good, opposition to it cannot, by definition, be "sedition."
  *   **Verdict:** **Merely Verbal / Trivial.** Once the definitions of "sedition" and "tyranny" are granted, the conclusion follows tautologically. It does not prove that resistance is *good*, only that it is not *sedition*. It changes the label, not necessarily the moral quality of the violence.
  *   **Utility:** Useful for categorization, useless for justification. It tells you what to call the act, not whether you may perform it.

  **2. The Substantive Moral Reading**
  *   **The Claim:** This is a normative ethical claim. Because the tyrant violates natural law (by prioritizing private good), the moral prohibition against violence is lifted. Resistance is not merely "not sedition"; it is morally permissible or even praiseworthy.
  *   **Verdict:** **Defensible but Incomplete.** Within Thomistic natural law, this holds. However, the sentence alone does not establish *who* may resist (private persons vs. public authority) or *how*. It asserts permission but lacks the procedural constraints Aquinas discusses elsewhere (e.g., in *De Regno*).
  *   **Utility:** Supports the moral intuition of the resistors but fails to address the risk of anarchy or private vendetta masquerading as public justice.

  **3. The Forfeiture Reading**
  *   **The Claim:** This is a claim about political status. By acting for private good, the ruler forfeits the "claim to stand for the common good." The obligation of obedience dissolves because the correlate (protection of the common good) has vanished.
  *   **Verdict:** **Defensible.** This is the strongest metaphysical claim. It treats political authority as conditional rather than absolute.
  *   **Utility:** High theoretical value, but creates an epistemic vacuum: it explains *why* authority ends, but not *how* we know it has ended in a contested situation.

  **4. The Guilt Distribution Reading**
  *   **The Claim:** This is a claim about moral culpability. The "disturbance" is not the primary evil; the tyranny is. The guilt for the violence attaches to the tyrant who necessitated it, not the subjects who endure or end it. The tyrant is the true "seditious" party for fracturing the unity of the people.
  *   **Verdict:** **Rhetorically Powerful, Legally Dangerous.** It shifts blame from the actor to the context. While morally coherent in a theological framework of sin, it is difficult to translate into legal causality.
  *   **Utility:** Explains why the resistors might be innocent, but risks justifying any collateral damage as the tyrant's fault.

  **5. The Proportionality Proviso Reading**
  *   **The Claim:** This focuses on the caveat: *"unless the disturbance does the subjects more harm than the tyranny itself did."* This is a consequentialist constraint on the deontological permission to resist.
  *   **Verdict:** **Crucial Limit.** This is not a definition but a moral hedge. It admits that resisting tyranny can be wrong if the cure is worse than the disease.
  *   **Utility:** This is the specific clause your classmate ignored. It prevents the "anti-tyranny" justification from becoming a blank check for violence.

  ***

  ### II. The "People" and the Proviso

  **Does Aquinas redefine "the people"?**
  *   **Analysis:** Aquinas follows Augustine: a "people" is not just a crowd, but a fellowship united by law and common good. If the ruler destroys the common good, he dissolves the "people" into a mob. Therefore, disturbing the tyrant is not disturbing the "people."
  *   **Verdict:** **Not Merely Verbal, but Ontological.** In a modern positivist framework, this looks like wordplay (redefining "people" to suit the argument). In Aquinas's metaphysics, it is a claim about reality: without the common good, the political entity ceases to exist *as a polity*. However, relying on this to justify action requires agreeing on the metaphysical status of the state, which modern law does not.

  **What is the proportionality proviso doing?**
  *   **Analysis:** It functions as a **moral limit on resistance**, not a condition on the concept of sedition.
  *   **Verdict:** It is a hedge against the objection that "ending tyranny" justifies any means. It forces a calculation of consequences. If the riot causes more suffering than the tyranny, the act becomes sinful (and arguably seditious in effect, if not in name), regardless of the tyrant's status. Your classmate's use of the sentence to shut down questions about the crowd's conduct likely suppressed this proviso.

  ***

  ### III. The Legal Translation (Jury Instruction)

  **Which readings support the proposed jury instruction?**
  *   **Supported By:** Reading 2 (Moral Permission) and Reading 3 (Forfeiture). The instruction requires the jury to believe that the defendant's moral permission overrides the statutory prohibition.
  *   **Unsupported By:** Reading 1 (Semantic). Telling a jury "this isn't sedition by definition" usurps the judge's role in defining statutory elements. Reading 5 (Proportionality) complicates the instruction by requiring the jury to perform a utilitarian calculus they are not equipped to make.

  **What premises does the legal version require that Aquinas never supplies?**
  1.  **Epistemic Authority:** Aquinas assumes the tyranny is manifest or judged by a "public authority" (e.g., the Church or a superior monarch). He is wary of private individuals judging rulers (*De Regno*). The jury instruction assumes *private citizens (jurors)* can retrospectively judge the regime's legitimacy. Aquinas does not grant this competence to the multitude.
  2.  **Procedural Mechanism:** Aquinas provides no procedure for a "multitude" to declare a forfeiture of authority without fracturing the peace. The legal proposal inserts a trial *after the fact* to decide a question Aquinas thinks should be settled *before the act* by competent authority.
  3.  **Ontological Status:** The instruction assumes the modern state is a "multitude" in Aquinas's teleological sense (oriented toward a specific common good). Modern law generally treats the state as a sovereign entity regardless of its moral orientation.

  **Verdict on Legal Proposal:** **Unsupported.** The sentence provides a moral theology for resistance, not a legal standard for adjudication. It lacks a mechanism to distinguish a tyrant from a merely unpopular leader without inviting the very sedition it seeks to regulate.

  ***

  ### IV. The Classmate's Move

  **Which reading was your classmate invoking?**
  *   **Analysis:** Your classmate used the sentence to shut down a question about *standing* (whether the crowd had the right to act).
  *   **Reading:** They invoked **Reading 1 (Semantic)** to block **Reading 5 (Proportionality)**.
  *   **Verdict:** **Fallacious Closure.** By arguing "It is not sedition" (Definition), they implied "It is therefore justified" (Moral Permission), while ignoring the Proviso (Consequential Limit) and the question of Agency (Who acts?). They used the definition to bypass the moral calculus. They treated the absence of the label "sedition" as the presence of the right "to storm a courthouse."

  **Summary for Seminar:**
  The sentence is doing too much work because it is being asked to be a definition, a moral justification, and a legal standard simultaneously.
  *   As a **definition**, it is trivial.
  *   As a **moral claim**, it is defensible but requires the proportionality proviso your classmate ignored.
  *   As a **legal standard**, it fails because it grants private actors (or juries) the authority to dissolve the state's legitimacy without a public procedure, which Aquinas himself warns against.
