      *(Self-Correction during drafting)*: I need to make sure I don't just give a checklist. The prompt asks for *reasoning* on why property vs. transition matters. I need to explain that Transition theories help us rule out architectures that *couldn't* be conscious, while Property theories help us evaluate those that *could*.
      *   *Refining the Precautionary Principle:* It shouldn't mean "escalate everything." It means "escalate when the cost of being wrong is high AND the probability is non-negligible."
