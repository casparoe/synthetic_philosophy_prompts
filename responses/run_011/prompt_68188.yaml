answer: |-
  ### Week 8 Problem Set: Foundations and Crisis
  **Question 4 (25 Marks)**

  **Scenario:** Suppose that next year, a verified, machine-checked proof is published deriving $0=1$ from the axioms of ZFC. The proof is short enough to be surveyable by humans, though complex.

  **Essay Prompt:**
  Write a short essay (approx. 600–800 words) analyzing the consequences of this discovery. Your answer must address the following three points:

  1.  **Explosion and Evidential Value:** In classical logic, an inconsistent theory proves every sentence (explosion). Does this mean all previously proven theorems of ZFC are now "false" or "useless"? Distinguish between the *syntactic status* of old proofs and their *epistemic value*.
  2.  **Downward Transmission:** ZFC proves the consistency of Peano Arithmetic ($Con(PA)$). Does the inconsistency of ZFC logically imply the inconsistency of PA? Distinguish between the *logical relationship* between the theories and the *evidential support* ZFC provided to PA.
  3.  **Applied Mathematics:** Would this discovery invalidate the mathematics currently used in empirical physics? Justify your answer by considering the axiomatic strength required for physical modelling.

  ***

  ### Model Answer

  The discovery of a contradiction in ZFC would precipitate a foundational crisis, but its impact would be uneven. To understand why, we must distinguish between syntactic derivability, semantic truth, and epistemic justification.

  Regarding **explosion**, it is technically correct that if ZFC is inconsistent, then for any sentence $\phi$, $ZFC \vdash \phi$. In this syntactic sense, every theorem remains a theorem; indeed, every sentence becomes one. However, the claim that "nothing we ever proved is safe" conflates derivability with truth. Mathematical practice values proofs not merely as strings of symbols, but as guarantees that a conclusion holds in a intended model (e.g., the cumulative hierarchy). If ZFC is inconsistent, it has no model. Consequently, the *semantic guarantee* is lost: we can no longer trust that a theorem describes a coherent structure.

  Yet, this does not render old proofs useless. Most proofs utilize only a small fragment of ZFC's strength. The derivation of Fermat's Last Theorem, for instance, relies on specific axiomatic resources. The fact that *some* axioms lead to contradiction elsewhere does not syntactically invalidate the derivation steps used in number theory, provided those steps do not invoke the specific contradiction. The loss is not that the theorems become false, but that the *justification* for believing them true is compromised. We lose the assurance of consistency, not necessarily the truth of the individual arithmetical claims. The force of the "everything is provable" argument is real but limited: it warns us that the *system* cannot distinguish truth from falsehood, not that every specific derivation contains an error.

  Secondly, concerning **downward transmission**, we must rigorously separate logical implication from evidential support. ZFC proves $Con(PA)$. Logically, $\neg Con(ZFC)$ does *not* imply $\neg Con(PA)$. The implication runs one way: if ZFC is consistent, then PA is consistent. Denying the antecedent (ZFC's consistency) tells us nothing about the consequent (PA's consistency) within the object language. PA could remain perfectly consistent even if ZFC collapses.

  However, the *evidential* situation is dire. Part of our confidence in PA rested on the fact that it could be modeled within ZFC. ZFC acted as a "safety certificate." If the certifier is found to be corrupt (inconsistent), the certificate is void. We do not logically know PA is inconsistent, but we lose the relative consistency proof that bolstered our confidence. We are returned to a state where PA's consistency is supported only by its own track record and intuitive evidence, rather than by reduction to a stronger set theory. The threat to PA is psychological and epistemological, not strictly logical.

  Finally, regarding **applied mathematics**, it is unlikely that physics would be invalidated. The mathematics required for empirical science is largely arithmetical or involves finite combinatorics and real analysis over separable spaces. These domains are interpretable in systems much weaker than ZFC, such as $ACA_0$ or even PA. Since the inconsistency of ZFC does not logically entail the inconsistency of these weaker fragments, the specific calculations used to predict particle behavior or orbital mechanics remain syntactically valid.

  Furthermore, physical theories are ultimately judged by empirical adequacy, not just axiomatic purity. If a mathematical derivation yields a prediction confirmed by experiment, the potential inconsistency of high-level set axioms (which are often remote from the calculation) does not negate the empirical success. We would likely retreat to a weaker, consistent subsystem sufficient for analysis (such as constructive ZFC or a predicative system). The "core" mathematics of physics is robust because it is grounded in finitary reasoning that does not depend on the full power of the infinite sets where the ZFC contradiction likely resides. Thus, while foundational confidence would shatter, the practical utility of mathematics in science would survive.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Explosion and Evidential Value (8 Marks)**
  *   **4 Marks:** Correctly identifies that while explosion makes every sentence derivable, it does not make them "false." Distinguishes syntax (derivability) from semantics (truth in a model).
  *   **4 Marks:** Explains that the loss is *epistemic* (loss of guarantee/justification) rather than *syntactic* (the proof steps don't vanish). Acknowledges that local derivations may remain valid even if the global system is broken.
  *   **Penalty (-2):** Claiming all theorems become false.
  *   **Penalty (-2):** Claiming the proofs are syntactically invalidated (i.e., that the derivation steps stop working).

  **2. Downward Transmission (8 Marks)**
  *   **4 Marks:** **Logical Point:** Explicitly states that $\neg Con(ZFC)$ does not logically imply $\neg Con(PA)$. Identifies the direction of the relative consistency proof.
  *   **4 Marks:** **Evidential Point:** Explains that ZFC provided *confidence* (a safety certificate) for PA. Losing ZFC weakens our reason to trust PA, even if PA is safe.
  *   **Penalty (-3):** Claiming PA is automatically inconsistent if ZFC is.
  *   **Penalty (-3):** Conflating logical implication with evidential support (treating them as the same thing).

  **3. Applied Mathematics/Physics (5 Marks)**
  *   **3 Marks:** Argues that physics uses weaker fragments (arithmetical/finite) which are not necessarily threatened by ZFC's inconsistency.
  *   **2 Marks:** Notes that empirical adequacy or the robustness of finitary reasoning protects applied math.
  *   **Penalty (-2):** Claiming all physics math is destroyed because "everything is provable."

  **4. Clarity and Constraints (4 Marks)**
  *   **2 Marks:** Essay is coherent, structured, and within word limit.
  *   **2 Marks:** Adheres to constraints (No name-dropping Paraconsistent Logic as a solution; No claiming the proof is self-concealing/too long).
  *   **Automatic Fail (0/25):** Answer relies entirely on "Gödel's Second Theorem says we can't know this" (The prompt stipulates we *have* the proof).
  *   **Automatic Fail (0/25):** Answer suggests we should simply adopt paraconsistent logic without analyzing the classical consequences requested.

  **Specific Wrong Turns to Watch For:**
  *   **The "Self-Concealing" Error:** Claiming the scenario is impossible because any proof of inconsistency would be too long to check. (The prompt explicitly rules this out).
  *   **The "Unsoundness" Conflation:** Treating inconsistency as if it means the axioms don't match reality (unsoundness), rather than that they contradict each other.
  *   **The "G2 Shield":** Arguing that G2 prevents us from accepting the proof. (In this scenario, the proof is machine-checked and given).
  *   **The "Paraconsistent Dodge":** Suggesting "we just use paraconsistent logic" without answering the question about *classical* consequences and evidential loss.
