  # JOINT STATEMENT ON DECISION-MAKING MECHANISMS FOR ROAD-PRICING POLICY

  **Date:** 24 May 2024
  **Parties:** Campaign for Direct Consent (Camp A); Campaign for Deliberative Democracy (Camp B)
  **Subject:** Agreed Principles, Disagreements, and Evaluation Criteria regarding the selection of a decision-making mechanism for the proposed road-charging scheme.

  ## 1. AGREED CLAIMS

  Both parties affirm the following propositions as the baseline for any decision-making process adopted by the Combined Authority:

  1.  **Legitimacy Requirement:** Given the distributional impact and unpopularity of the proposed road-charging scheme, standard cabinet decision-making is insufficient. The mechanism chosen must confer a higher threshold of political legitimacy than a routine council vote.
  2.  **Risk of Manipulation:** Both a public referendum and a citizens' assembly are vulnerable to manipulation via agenda-setting, question wording, witness selection, and funding disparities. Safeguards against capture by the commissioning authority or vested interests are required in either design.
  3.  **Information Asymmetry:** The complexity of the road-charging scheme exceeds the baseline knowledge of the average voter. Any mechanism must account for the cost of acquiring information, whether through individual research (referendum) or supported learning (assembly).
  4.  **Implementation Viability:** A decision that cannot be implemented due to legal challenge, mass non-compliance, or subsequent reversal by central government constitutes a failure of the process, regardless of its procedural purity.
  5.  **Interpretation of 'Will':** Neither party claims that their preferred mechanism reveals a pre-existing, metaphysical 'will of the people'. Both acknowledge that the mechanism chosen will, in part, construct the outcome it measures.

  ## 2. STATEMENT OF DISAGREEMENTS

  The following table outlines the specific technical and normative disagreements remaining between the parties.

  | Issue | Wording Camp B (Assembly) Would Sign | Wording Camp A (Referendum) Would Sign | Substantive or Verbal? | Is this a Crux? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Epistemic Competence** | Deliberation improves the average competence of participants to identify the common good, satisfying the conditions of the theorem on group competence, even in value-laden conflicts. | The theorem on group competence applies to matters of fact, not clashes of interest; deliberation on interests tends to entrench positions rather than improve 'correctness'. | Substantive | Yes |
  | **2. Logical Consistency** | The paradox of consistent voting on connected propositions is an argument for deliberating over reasons *before* voting, which resolves inconsistencies that raw aggregation cannot. | The paradox of consistent voting on connected propositions demonstrates that small groups are just as prone to collective incoherence as large ones; deliberation does not guarantee logical consistency. | Verbal (Process vs. Outcome) | No |
  | **3. Stability of Preference** | The 'will of the people' is unstable under majority rule (cycling); therefore, a raw vote does not express a determinate mandate and requires prior filtering. | While cycling is theoretically possible, in high-salience binary choices it is empirically rare; invoking cycling to deny a vote is a technocratic override of democratic expression. | Substantive | Yes |
  | **4. Power Locus** | The decisive power lies in agenda-setting and framing; therefore, an assembly with agenda-setting power is more democratic than a referendum on terms set by the executive. | The decisive power lies in the final veto; therefore, a binding referendum is more democratic than an assembly whose recommendations can be filtered or ignored by the Mayor. | Substantive | Yes |
  | **5. Empirical Precedent** | The Irish model (Assembly followed by Referendum) demonstrates that informed deliberation shifts public opinion towards sustainable long-term policy. | The Swiss and Californian models demonstrate that frequent voting creates an engaged citizenry, whereas assemblies are isolated events that lack accountability. | Substantive | Yes |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  The parties agree that the following claims are the decisive factors in evaluating the success of the chosen mechanism. Both parties record their predictions below. These predictions will be used to evaluate the process post-decision.

  **Crux 1: The Effect of Information on Preference**
  *   **Evidence/Case:** The internal polling of the Combined Authority regarding the road-charging scheme, measured before and after a period of structured information delivery.
  *   **Camp B Prediction:** Support for the scheme will *increase* after participants are exposed to balanced expert testimony and peer deliberation, proving that opposition is based on misinformation.
  *   **Camp A Prediction:** Support for the scheme will *remain static or decrease* after information delivery, proving that opposition is based on rational assessment of material interest, not ignorance.

  **Crux 2: Acceptance by Losers**
  *   **Evidence/Case:** Post-decision surveying of those who voted against the outcome (or whose views were not adopted), measuring trust in the authority and willingness to comply.
  *   **Camp B Prediction:** Acceptance will be higher following an Assembly process, as losers will acknowledge the fairness of the deliberative procedure even if they dislike the result.
  *   **Camp A Prediction:** Acceptance will be higher following a Referendum, as losers will acknowledge the numerical inevitability of the result and the equality of their vote.

  **Crux 3: Susceptibility to Elite Capture**
  *   **Evidence/Case:** Analysis of the final policy wording compared to the initial terms of reference set by the Combined Authority officers.
  *   **Camp B Prediction:** A Referendum outcome will correlate more strongly with the spending patterns of external campaign groups than with voter intent.
  *   **Camp A Prediction:** An Assembly outcome will correlate more strongly with the preferences of the facilitators and selected experts than with the random sample's initial intuitions.

  ***

  # CHAIR'S BRIEFING NOTE: STATUS OF CONSENSUS

  **To:** The Chair, Combined Authority Process Board
  **From:** Process Secretariat
  **Subject:** Meta-Analysis of the Joint Statement

  You requested a distinction between what is genuinely settled in the field, what is agreed only by these two camps for the sake of this document, and where there is live disagreement that this document papers over. Please treat the following as confidential guidance for your chairing.

  **1. Genuinely Settled Among Experts**
  *   **The Cycling Problem:** It is accepted in social choice theory that majority preferences can cycle and fail to produce a stable 'will'. Camp A's rhetorical reliance on "the will of the people" as a singular, discoverable object is technically indefensible. The document forces them to concede this in Claim 5, which is an accurate reflection of the academic consensus.
  *   **Manipulation Risks:** There is broad agreement that both referendums and assemblies are vulnerable to agenda-setting and framing effects. Neither mechanism is 'immune' to elite capture.
  *   **Judgment Aggregation:** The document correctly identifies that Camp A is misusing the 'paradox of consistent voting on connected propositions' (judgment aggregation). That theorem applies to any voting body, including assemblies. Camp B is correct that deliberation is the proposed *remedy* for that paradox, not a vulnerability. This is settled in the field: aggregation fails without communication; communication risks new biases.

  **2. Agreed Only by These Two Camps (Local Compromise)**
  *   **The 'Competence' Condition:** In Section 2, Issue 1, the document treats the application of the 'theorem on group competence' (Jury Theorem) as an open empirical question. In reality, most theorists agree the theorem *does not apply* to value conflicts or interest clashes, only to binary questions of fact with a correct answer. Camp B is stretching the theorem here to legitimise assemblies on epistemic grounds. Camp A is technically correct, but has conceded the point to allow the document to be signed. Do not let Camp B cite the Jury Theorem as proof that assemblies find 'truth' in policy disputes; it is a category error.
  *   **Empirical Equivalence:** The document places Swiss/Californian referendums and Irish assemblies on the same evidential footing. In the field, these are not comparable controls. Switzerland has a dense ecosystem of parties and media that structure referendum votes; California has high spending and initiative fatigue. Ireland's assemblies were specifically designed for constitutional social issues, not technical tax/charging regimes. The camps have agreed to treat these as equivalent 'case studies' for the sake of argument, but they are not methodologically comparable.

  **3. Live Disagreement Papered Over**
  *   **Normative Weight of Legitimacy:** The document avoids the core philosophical rift. Camp A views legitimacy as *input* (who votes). Camp B views legitimacy as *throughput* (how the decision is made). There is no consensus in political science on which is superior for unpopular taxation. The document treats this as a empirical prediction (see Crux 2), but it is fundamentally a normative disagreement. If the process fails, it will likely be because you cannot measure 'normative legitimacy' with a survey.
  *   **Advisory vs. Binding:** Section 2, Issue 4 hints at this, but does not resolve it. The field is divided on whether an advisory assembly undermines democracy (by adding a veto point) or enhances it (by filtering populism). The document leaves this ambiguous. You will need to force a decision on whether the Assembly's output is binding or advisory; the current text allows both sides to pretend their preference is secured.
  *   **The 'Hybrid' Solution:** The document implicitly points towards the Irish model (Assembly then Vote) as a compromise. However, there is live disagreement on whether this merely doubles the cost and delay without reducing conflict. If the Assembly recommends 'Yes' and the Vote goes 'No', the document provides no protocol for resolution. This is a gap you must fill.

  **Recommendation:** Use the 'Cruxes' section to hold the Authority accountable, but do not treat the 'Agreed Claims' as a textbook summary of democratic theory. They are a negotiating truce.
