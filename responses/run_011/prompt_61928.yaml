      *   *Subsidiarity:* Epistemic fits best because the argument relies on capacity (inspectorate size) and information (portability needs). Political subsidiarity (self-government as a good) would demand devolution even if outcomes were worse, which is hard to justify here.
      *   *Parity:* The "floor becomes ceiling" argument is strong. I need to explain why federal floors prevent a race to the bottom without stifling innovation.
      *   *EU Mechanism:* Is it workable? For a federation, national parliaments checking the federal government is similar to States checking the Federation. But the 8-week window is tight for complex care issues. I'll argue it's too weak for *allocation* disputes but good for *legislative* review.

