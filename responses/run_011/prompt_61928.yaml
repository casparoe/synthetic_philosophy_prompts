answer: |-
  **OPINION OF THE COMPETENCE ALLOCATION PANEL**
  **Subject:** Allocation of Authority Regarding Long-Term Residential Care
  **Author:** Panel Member

  **I. Recommendation**

  The Panel should reject the petition for full devolution of standard-setting and financing. Instead, I recommend a **conditional split allocation**:

  1.  **Provision:** Competence remains with **Municipalities** (the smallest competent level for delivery).
  2.  **Financing:** Competence devolves to **States**, subject to a federal equalization mechanism to maintain the current 1.9 percent fiscal transfer baseline.
  3.  **Norm-Setting and Inspection:** Competence remains **Federal**.

  This allocation respects the constitutional mandate to name the smallest level competent for each function. While states are competent to finance, the independent commission's finding that a stand-alone inspectorate requires 700,000 inhabitants renders three of our nine states (populations 340,000, 510,000, and 690,000) structurally incapable of effective self-regulation. Furthermore, with one in four residents moving states within five years, federal norms are required to ensure portability of entitlements.

  **II. Justification of Subsidiarity**

  This recommendation rests on **Epistemic Subsidiarity**. This justification holds that authority should reside at the level possessing the relevant knowledge and capacity to discharge the function effectively. Here, local knowledge favors municipal provision and state financing, as these levels understand local cost structures and demographic needs. However, epistemic subsidiarity also recognizes *incapacity* as a disqualifier. The audit data—showing 31 percent and 27 percent inadequacy rates in the petitioning states versus a 12 percent federal average—suggests that where local capacity fails, the "lowest level" is not the "capable level." Retaining federal inspection ensures that the knowledge required to regulate safety is not lost to economies of scale.

  Had I rested this opinion on **Political Subsidiarity**—which values self-government as a good in itself, regardless of outcome efficiency—the recommendation would necessarily shift toward full devolution. Political subsidiarity prioritizes the right of distinct communities to live by their own rules, even if those rules produce lower standards. Under that view, the petitioning states' poor audit results would be interpreted as a legitimate policy choice rather than incapacity. However, given the constitutional Parity Clause, Political Subsidiarity cannot be absolute; self-government cannot extend to creating conditions of life so divergent that they violate the federation's commitment to equivalence.

  **III. The Parity Clause Objection**

  The strongest objection to this split allocation comes from the Parity Clause, articulated by the state with the 4 percent inadequacy rate. They argue that a federal floor inevitably becomes a ceiling; if states control financing but not standards, pressure to reduce costs will erode the federal floor to the lowest common denominator.

  This objection must be addressed directly, not as a footnote. Parity does not require uniformity, but it does require a baseline below which no citizen falls. The risk of a "race to the bottom" is real, but it is mitigated by the retention of federal *inspection*. As long as the Federation retains the power to inspect and publish compliance data, the political cost of lowering standards remains high. The parity concern is best managed not by centralizing financing, but by transparency. If the federal inspectorate remains independent, states cannot hide inadequacy behind local autonomy. The Parity Clause is satisfied if the Federation guarantees the *capacity* for equivalent conditions, even if states choose to spend differently, provided they meet the federal minimum safety threshold.

  **IV. Reversal Clause**

  This allocation is not permanent. It shall revert to full Federal competence if either of the following measurable conditions is met in the next two audit cycles (covering four years):

  1.  **Divergence Threshold:** The standard deviation of care quality ratings between states exceeds 15 percent, indicating a fracture in equivalent conditions of life.
  2.  **Portability Failure:** More than 10 percent of cross-state transfers result in a loss of entitlement or service disruption due to regulatory incompatibility.

  Conversely, if the three smaller states (under 700,000 inhabitants) form a joint inspectorate that achieves federal certification, norm-setting competence may be reviewed for devolution to that consortium.

  **V. A Reusable Test for Allocation**

  To assist the Panel in future disputes, I propose the **Capacity-Externality Test**:

  1.  **Capacity:** Can the sub-unit technically discharge the function? (e.g., Is the population large enough to sustain an inspectorate?) If no, competence rises.
  2.  **Externality:** Does the sub-unit's decision significantly impact citizens outside its jurisdiction? (e.g., Does portability affect residents of other states?) If yes, competence rises.
  3.  **Knowledge:** Does the function require local information to be effective? (e.g., Delivery of care.) If yes, competence lowers.

  Competence settles at the highest level required by Capacity or Externality, and the lowest level permitted by Knowledge.

  **VI. Evidence of Error**

  This recommendation would be proven wrong if, in the next two audit cycles:
  1.  States that retain high financing autonomy but operate under federal standards show *improved* outcomes compared to the petitioning states, proving that financing control was the bottleneck, not regulatory capacity.
  2.  The federal inspectorate fails to detect a systemic failure that a localized regulator would have caught, demonstrating that epistemic advantages of local knowledge outweigh the capacity benefits of centralization.

  **VII. Comparison with the EU Subsidiarity Mechanism**

  Finally, regarding the proposal to adopt the European Union's subsidiarity control mechanism (national parliaments issuing reasoned opinions within eight weeks, with a one-third threshold compelling review): **This model is too weak to transplant for our allocation disputes.**

  The EU mechanism is designed to police *legislative proposals*, not *competence allocations*. Our Panel's mandate is constitutional arbitration, not legislative review. An eight-week window is insufficient for the data gathering required for complex welfare allocations like elder care. Furthermore, the one-third threshold creates a minority veto that could paralyze the Federation without guaranteeing a better outcome. In the EU, the mechanism often produces political signaling rather than legal resolution. For a federation where allocation decisions are binding and consequential, we require a judicial-style panel with evidentiary rules, not a political rush-to-opinion system. The EU model prioritizes speed and political pressure; our mandate requires accuracy and stability. We should not trade the latter for the former.

  **Conclusion**

  We face a choice between the autonomy of states that have demonstrated regulatory failure and the security of a federal standard that guarantees portability and minimum capacity. By splitting the competences, we honor subsidiarity where it works (financing and provision) and uphold parity where it is needed (norms and inspection). This is not a compromise of principle, but an application of epistemic humility: we allocate authority not to the level that wants it, but to the level that can sustain it.
