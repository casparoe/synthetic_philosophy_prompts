      *   *Strategy:* I will recommend **Conditional Retention of Norm-Setting** but **Devolution of Financing**. This splits the difference. It addresses the parity concern (standards stay federal) while addressing subsidiarity (money stays local).
      *   *Actually, a stronger stance might be better for an opinion:* I will recommend **Retention of Norm-Setting/Inspection at Federal Level** and **Devolution of Financing/Provision to States/Municipalities**. This adheres to the "smallest level competent" rule (municipalities deliver, states fund, federation regulates).
