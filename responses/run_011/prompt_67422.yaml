answer: |-
  I have worked in this bakery for nineteen years. I know the flour on the benches and the heat of the ovens. I know the owner. He is tired. He has no one to sell to, so he is giving the business to us. That is a rare thing. I was asked to speak tonight. I am not a clever man. I left school at sixteen. I have read the draft rules at my kitchen table in the small hours. I have read them until the words blurred.

  There is something in those pages that bothers me. It is not the work. It is the starting point. The rules say we decide who belongs here. But we can only decide because we are already inside. We are writing the first page of a book we are already standing in. Someone has to draw the line. But the people drawing the line are the ones already on the right side of it.

  [Pause]

  Look around this room. There are twenty-five of us. The van drivers are here. They are on the agency books, but they drive our vans. The girl who works Saturdays is here. She starts full-time in September. There are customers here who have bought our bread for decades. Under some of the papers on your table, these people do not get a vote. They will work under the rules we make tonight. They will be bound by what we decide. But they will not have helped decide it. Saying we are glad they are here does not fix the paper. Saying they are important does not give them a pen. We need to say this plainly. If we choose a rule that leaves them out, we are taking power they do not have. We cannot pretend that is not happening.

  I have thought about how to handle this. I am not asking you to change your vote on the main question. I am asking you to add a condition. Whatever boundary we draw tonight, we must agree to reopen it. I propose we write into the rules that after two years, we hold a review. In that review, the people excluded tonight must hold seats and votes. They must be allowed to argue their case then.

  [Pause]

  I know this sounds weak. It is weak. Those people have no power to demand this review. If we do not give it to them tonight, they cannot take it later. The rules we pass tonight will lock the door. If we do not put a key under the mat now, they will be locked out for good. This has to be conceded tonight or never. We are the only ones who can give this away. We should give it. Not because it is kind, but because it is honest. We are making a rule that limits them. We should admit we are doing it, and we should set a date to answer for it.

  Now we must move to the vote. There are three options on the paper.
  The first gives one vote to everyone over eighteen on our payroll with twelve months' service.
  The second gives a vote after three months to anyone working eight hours a week for the business, through the agency or not.
  The third restricts membership to those who have signed the personal guarantee on the bank loan and weights their votes by hours.

  [Pause]

  We will vote on these options. Then we will sign the papers. Then we will go back to work. The ovens will still need firing on Monday. The bread will still need selling. The rules will stand until we change them. Let us choose carefully.

  ***

  **If asked from the floor whether you are telling them to vote for their inclusion:**

  I am telling you that this vote locks the door for two years. I am not telling you whether you should hold the key.
