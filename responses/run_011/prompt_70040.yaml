prompt: |-
  So my department's summer stipend deadline is in nine days and I need a 1200-word proposal, and I'm hoping you can make my idea sound like a project rather than a gripe. Topic: the paradox of deontology — the constraint says don't kill the one to save the five, so five die, so deontology looks like it ranks the cleanliness of your own hands above five human lives.

  Here's the half-formed thought. The paradox only gets its grip if you grant what I want to call the single-subject assumption: that morality is one decision procedure, addressed to one agent, delivered at one moment. But "it would be bad if the five died" isn't addressed to anybody in particular, while the prohibition is addressed very specifically to the person holding the scalpel. Different addressee, different time of issuance — so maybe the two claims aren't on the same scale and were never available to be weighed against each other, which would make the paradox a scope error instead of a refutation.

  The part I don't want to paper over: something survives. The agent still has to act, and afterward there's the question of what they should feel and what they owe — regret, amends, compensation to the family — for an act that by the theory's own lights was the right one. My hunch is that the debate treats the paradox as all-or-nothing, and thats why the leftover never gets examined.

  What I need from you: one sharp question, not three loosely related ones; a section on why neither the constraint-side nor the outcome-ranking side has actually met the addressee point, and why the comeback everyone will reach for ("fine, but then your theory doesn't tell me what to do") doesn't just smuggle the paradox back in; the eight weeks broken into chunks with what I'd be working through and arguing in each (not a book list); what a result would look like and what would count as failure; and an honest line on whether eight weeks is enough or whether I'm signing up to write a beautiful introduction to a paper I never finish.

  One more thing. The first objection from the committee will be that I've just put new paint on the old distinction between agent-relative and agent-neutral reasons, or between evaluating states of affairs and guiding action. I need a paragraph on that — and if you think there isn't a good answer, tell me straight, because then I'll pick a different topic instead of burning a summer on it.

  No bibliography, I'll bolt the references on myself once I know what im arguing.
