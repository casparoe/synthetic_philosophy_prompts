answer: |-
  **Project Title:** The Address of Constraint: Reframing the Deontological Paradox as a Scope Error

  **Project Summary and Research Question**
  The central paradox of deontology is familiar: if morality prohibits killing one innocent person to save five, it appears to rank the cleanliness of the agent's hands above five human lives. Standard responses attempt to justify this ranking by appealing to the special status of agency or the intrinsic disvalue of murder. This project proposes a structural dissolution of the paradox rather than a substantive justification. I argue that the paradox gains its grip only by granting what I call the Single-Subject Assumption (SSA): the premise that morality is a single decision procedure, addressed to one agent, delivered at one moment, requiring all moral claims to be weighed on a common scale.

  Under the SSA, the constraint ("Do not kill") and the outcome claim ("Five deaths are bad") are treated as competing inputs for a single deliberative function. I contend this is a category error. The prohibition is a second-person address indexed to a specific agent ("*You* must not kill"), whereas the badness of the outcome is a third-person state of affairs ("*It* is bad that five die") not addressed to any particular actor. If these claims differ in addressee and temporal issuance, they are not available to be weighed against one another. The paradox arises from forcing incommensurable logical types into a single utilitarian calculus.

  This leads to my primary research question: **Is the paradox of deontology a substantive conflict of values, or a scope error generated by the mistaken assumption that agent-specific constraints and agent-neutral outcomes compete on a single deliberative scale?**

  **The Addressee Argument and the "What To Do" Objection**
  Neither the constraint-side nor the outcome-ranking side has adequately met the addressee point. Consequentialists assume all value must be maximized by someone; deontologists assume all duties must be fulfilled by someone. Both presume a unified field of play. By isolating the structure of address, I argue that the constraint operates as a limit on deliberation, not a weight within it. The prohibition removes the option from the menu; it does not place a heavy weight on the "don't kill" side of the scale.

  The inevitable comeback is pragmatic: "Fine, but then your theory doesn't tell me what to do." Critics will argue that if you refuse to weigh the claims, you leave the agent paralyzed at the cliff's edge. I will argue this objection smuggles the paradox back in by demanding a single metric for action where none exists. Action guidance does not require commensurability; it requires recognizing priority rules. If the constraint is a rule of address specific to the agent, it vetoes the outcome calculation for *that* agent.

  However, something survives the act. The debate treats the paradox as all-or-nothing, ignoring the moral residue. If the agent obeys the constraint and the five die, the theory must account for what the agent owes afterward—regret, amends, or compensation to the families. Current frameworks treat the "right act" as morally clean. My project argues that recognizing the scope error allows us to validate the constraint without denying the tragedy of the outcome. The agent acts rightly by not killing, but still bears a residual duty to mourn or compensate, precisely because the outcome claim was valid, just not actionable for *them* in that moment.

  **The Agent-Relative Objection**
  The first objection from the committee will be that I have simply put new paint on the old distinction between agent-relative and agent-neutral reasons. If I cannot distinguish this project from standard Nagel-style agent-relativity, the topic is dead. Here is the distinction: Agent-relative reasons adjust the *weight* of a reason based on the agent's identity (e.g., "I have extra reason not to kill *my* child"). They still enter the calculus and can theoretically be outweighed by sufficiently large neutral reasons. My proposal is structural, not weighted. I argue that constraints are not heavy reasons; they are rules of *address* that remove certain considerations from the calculus entirely for that specific agent. Agent-relativity modifies the equation; the addressee view changes the syntax. This is not a tweak to value theory but a claim about the pragmatics of moral deliberation. If I cannot sustain this syntactic distinction during the research phase, the project collapses into existing literature.

  **Eight-Week Work Plan**
  *Weeks 1–2: Framework and Literature.* I will define the Single-Subject Assumption rigorously, mapping where it appears in standard trolley problem literature. The goal is to produce a detailed outline identifying exactly where consequentialist and deontological arguments presuppose a common scale.
  *Weeks 3–4: The Addressee Mechanism.* I will draft the core argument distinguishing second-person constraints from third-person outcome values. This involves analyzing the logic of imperatives versus state-of-affairs evaluations. I will test this against standard counter-examples (e.g., threshold deontology).
  *Weeks 5–6: Moral Residue and Action.* I will develop the account of what happens after the decision. This section argues for "rightful regret"—the idea that an agent can do the right thing and still owe amends. I will draft the response to the "what do I do" objection, focusing on priority rules rather than weighing.
  *Weeks 7–8: Synthesis and Polish.* I will assemble the sections into a complete article-length draft, ensuring the argument flows from the scope error to the residual duties. I will refine the distinction from agent-relativity based on feedback from peers during this period.

  **Deliverables, Failure Conditions, and Feasibility**
  The primary result will be a complete, submission-ready paper (approx. 8,000 words) arguing that the deontological paradox is a scope error. A successful project demonstrates that rejecting the SSA dissolves the paradox without rendering deontology action-guiding silent.

  Failure would look like two things. First, if I cannot clearly distinguish the "addressee" view from standard agent-relative reasons, the project offers no novel contribution. Second, if the account of moral residue becomes ad hoc—simply stapling regret onto a rigid rule without explaining why it is owed—the theory loses coherence.

  Is eight weeks enough? Here is the honest line: Eight weeks is sufficient to write a complete paper that establishes the *proof of concept* for this argument, but it is not enough to defend it against every conceivable objection in the broader meta-ethical landscape. I am not signing up to solve deontology forever; I am signing up to write a rigorous introduction to a new way of framing the problem. The risk is that the "scope error" claim feels like a linguistic trick rather than a metaphysical insight. However, given the tight scope—focusing specifically on the Single-Subject Assumption rather than rebuilding deontology from the ground up—this is manageable. I will produce a finished draft, not just a beautiful introduction to a paper I never finish, provided I stick to the structural claim and resist the urge to solve all related problems in normative ethics. The goal is a sharp wedge, not a whole door.
