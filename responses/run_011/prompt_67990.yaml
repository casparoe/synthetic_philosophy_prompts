answer: |-
  Here are the comments on your draft. I have kept the tone blunt as requested; your reading group will likely be sharper on the ML specifics than I am, but I have flagged the economic and organisational angles where you are vulnerable.

  ### General Comments

  The core intuition here is strong, particularly the idea that control mechanisms distort the data they gather (C5). That is a genuine contribution. However, you are leaning heavily on a dichotomy between "Alignment" and "Control" that modern ML practice has blurred. You treat alignment as a pre-deployment property of weights and control as a post-deployment institutional cage. In reality, alignment is often achieved *through* control mechanisms (e.g., RLHF, inference-time guards), and control is increasingly automated.

  Your economics terminology is mostly serviceable, but C8 is risky. If better control allows you to accept lower alignment, they are substitutes in the production of 'acceptable risk', not complements. You define 'complements' in a 'perverse sense', which invites pedantic attacks. Be precise: it is risk compensation, not complementarity.

  You also anthropomorphise slightly too much for an ML audience. 'Wants' (C1) will irritate them; 'objective functions' or 'optimisation targets' is safer. Finally, the conclusion admits control might be 'theatre' at the frontier, which undermines the earlier argument that control provides valuable data (C3–C6). You need to reconcile whether control is a useful sensor or a useless cage before you finish.

  ### Claim-by-Claim Breakdown

  **C1:** *Sound, but risky terminology.*
  **Problem:** 'Wants' is anthropomorphic and will annoy technical readers.
  **Severity:** Low.
  **Fix:** Swap 'wants' for 'optimisation targets' or 'objective functions'.

  **C2:** *Overstated.*
  **Problem:** Alignment failures manifest as events (e.g., harmful output) just as control failures do.
  **Severity:** Medium.
  **Fix:** Acknowledge that alignment failures are often observable events, not just latent dispositions.

  **C3:** *Sound.*
  **Problem:** None.
  **Severity:** Low.
  **Fix:** None.

  **C4:** *Sound.*
  **Problem:** None; this is essentially Goodhart's Law.
  **Severity:** Low.
  **Fix:** None.

  **C5:** *Sound.*
  **Problem:** None; 'evidential decay' is a useful coined term.
  **Severity:** Low.
  **Fix:** None.

  **C6:** *Sound.*
  **Problem:** None; follows logically from C5.
  **Severity:** Low.
  **Fix:** None.

  **C7:** *Sound.*
  **Problem:** None; standard risk compensation logic.
  **Severity:** Low.
  **Fix:** None.

  **C8:** *Unclear.*
  **Problem:** Economically, if control replaces alignment, they are substitutes, not complements.
  **Severity:** Medium.
  **Fix:** Describe this as 'risk compensation' or 'moral hazard' rather than 'complements'.

  **C9:** *False.*
  **Problem:** Alignment is iterative (RLHF, tuning), not done 'once' to weights; control is often automated.
  **Severity:** High.
  **Fix:** Remove the 'once' claim; acknowledge alignment is an ongoing process.

  **C10:** *Sound.*
  **Problem:** 'Normalisation of deviance' is the correct term (Vaughan).
  **Severity:** Low.
  **Fix:** None.

  **C11:** *Overstated.*
  **Problem:** Automated control systems can fail without human decision (e.g., software bugs).
  **Severity:** Medium.
  **Fix:** Qualify that this applies primarily to *human-in-the-loop* control regimes.

  **C12:** *Sound.*
  **Problem:** None; standard security principle.
  **Severity:** Low.
  **Fix:** None.

  **C13:** *Sound.*
  **Problem:** None.
  **Severity:** Low.
  **Fix:** None.

  ### Specific Terminology Flags

  *   **'Wants' (C1):** As noted, avoid this. It implies agency where there is only optimisation.
  *   **'Complements' (C8):** In production functions, complements increase each other's marginal product. You are describing substitution in a safety budget. Use 'substitutes in risk mitigation' or 'moral hazard'.
  *   **'Normalisation of deviance' (C10):** You have this right. It refers to Vaughan's work on the Challenger disaster. Keep it.
  *   **'Legibility' (C12):** Borrowed from James C. Scott. Appropriate usage, but ensure you don't lean too hard on the political science analogy if the group is technical.

  ### Structural Advice

  The conclusion undermines the body. If control is 'theatre' against frontier models (as you admit in the final paragraph), then C3–C6 (control as measurement) collapses for the only cases that matter. You need to decide: is control useful data gathering, or is it a stopgap against non-frontier models? You cannot argue it is a vital sensor *and* admit it is useless against the systems you actually fear without qualifying the scope.

