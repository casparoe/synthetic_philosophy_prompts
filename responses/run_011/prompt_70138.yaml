  Actually, the *really* dangerous one for a "borrowed hurt" view is the **Congenital Insensitivity to Pain (CIP)** comparison. If you say hurt is borrowed from caring, what about kids born without nociceptors? They don't care because they never felt it. But your theory is about *asymbolia*.
