prompt: |-
  I co-convene a small working group that pairs our philosophy department with a hospital pain service, and this term we are trying to settle, before anyone argues for a particular view, what we would even be entitled to demand of a theory of pain's badness. The proximate trigger was a case one of the anaesthetists brought us: a patient with a left-hemisphere lesion involving the insula who, during a procedure under regional block, described the traction on his abdomen accurately, localised it, distinguished sharp from dull, and predicted what the surgeon was about to do next — while reporting, unprompted, that none of it bothered him. Afterwards he did not seek help when comparable sensations arose at home, and had to be taught by explicit verbal instruction to withdraw his hand from a hot surface. The group is split about whether that patient was in pain, whether his pain was bad, and whether we were obliged to treat it, and I have come to suspect that all three disputes are downstream of people deploying different, unstated adequacy criteria. So I want the criteria written out first.

  Give me the desiderata: a numbered list of what any adequate account of why pain is bad — and of what it is for an episode of pain to hurt — has to deliver. For each item, state the phenomenon or case that motivates it and what goes wrong for a theory that misses it, then mark it as non-negotiable or as a preference belonging to one camp that could be surrendered without incoherence. The list should cover at least the following, and I would like you to tell me where I am wrong to include something: the dissociation cases in which a subject reports a bodily sensation with normal localisation and intensity discrimination but no aversiveness (asymbolia, and the similar reports from cingulotomy patients and from some opioid analgesia, where people say they still feel the pain but that it no longer matters); the mirror-image cases, familiar from certain forms of masochism and from psychogenic pain presentations, in which intense aversiveness arrives with little or no identifiable noxious input; congenital insensitivity, where the sensory channel is absent and a child must be protected from her own body; chronic pain that persists long after the tissue has healed; the modulation of aversiveness by attention, expectation, and meaning, which a purely peripheral account cannot capture; and the extension of the theory to subjects who cannot report at all — neonates, the severely demented, non-human animals — without that extension being purchased by quietly assuming the answer. I have been working with a rough three-component scheme: a sensory-discriminative component, an affective-aversive component, and what I have been calling aversive endorsement, the subject's own taking of the state to be a reason to stop. I want to know whether your desiderata force that scheme on us, or whether it is optional and should be struck from the specification as one camp's ideology.

  Two further requests. First, the impossibility results. If some subset of these requirements cannot be satisfied jointly — for instance, if no theory can simultaneously hold that unpleasantness is an introspectible phenomenal property of the experience, that it is the property in virtue of which the subject is motivated to avoid the stimulus, and that it can come apart from the sensory character of the very same experience in the way the dissociation cases seem to show — say so explicitly and give the shape of the argument, since that is what the group most needs. And tell me which single desideratum does the most exclusionary work: the one that, if genuine, the largest number of otherwise plausible theories fail. Second, keep the specification neutral as to vocabulary. An account that never mentions phenomenal qualities and works entirely in terms of representation, function, or imperative content must remain a live candidate rather than being ruled out by the wording of the list itself. Skip the full scorecard against the existing views — hedonism about pain, evaluativism, the imperative and representational accounts, and the pluralist or disjunctive proposals — except for a closing paragraph of a few sentences saying which you expect to survive the list and which is most likely to be knocked out by the requirement you identified as most exclusionary. A table is acceptable for the main list, provided each row still carries its motivating case. No bibliography, please: I want the reasoning, not the references.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user co-convenes a philosophy/hospital pain service working group. They are trying to establish *desiderata* (adequacy criteria) for a theory of pain's badness *before* arguing for specific views.
      *   **Trigger Case:** A patient with an insula lesion (pain asymbolia-like) who feels sensation/discrimination but reports no bother/unpleasantness, doesn't seek help, needs teaching to withdraw from harm.
      *   **Goal:** A numbered list of desiderata for any adequate account of why pain is bad/what it is to hurt.
      *   **Requirements for each item:** State the phenomenon/case, explain what goes wrong if missed, mark as "Non-negotiable" or "Preference/Camp-specific."
      *   **Specific Coverage:** Dissociation cases (asymbolia, cingulotomy, opioids), Mirror-image cases (masochism, psychogenic), Congenital insensitivity, Chronic pain, Modulation (attention/expectation), Non-reporting subjects (neonates, animals, dementia).
      *   **User's Scheme:** Sensory-discriminative, Affective-aversive, Aversive Endorsement. Ask if this is forced or optional.
      *   **Impossibility Results:** Identify if any requirements are jointly unsatisfiable. Identify the single most exclusionary desideratum.
      *   **Neutrality:** Vocabulary must not rule out non-phenomenal accounts (representational, functional, imperative).
      *   **Format:** Numbered list (table acceptable but needs reasoning), no bibliography, closing paragraph on existing views.
      *   **Critique:** Tell the user where they might be wrong to include something.

  2.  **Deconstruct the Desiderata (Drafting the List):**
      *   *Constraint:* Must be neutral (no "phenomenal feel" bias).
      *   *Constraint:* Must cover the specific cases mentioned.
      *   *Constraint:* Must distinguish non-negotiable from contestable.

      *   *Item 1: The Dissociation Constraint (Asymbolia/Insula).*
          *   Phenomenon: Sensation without aversiveness.
          *   Requirement: Theory must distinguish sensory detection from negative valence.
          *   Status: Non-negotiable (data is robust).
          *   User's Scheme: Supports the Sensory/Affective split.

      *   *Item 2: The Aversive Independence Constraint (Masochism/Psychogenic).*
          *   Phenomenon: Aversiveness without (proportionate) nociception.
          *   Requirement: Theory must allow aversiveness to vary independently of peripheral input.
          *   Status: Non-negotiable (clinical reality).
          *   User's Scheme: Supports the Affective/Endorsement split.

      *   *Item 3: The Protective Function Constraint (Congenital Insensitivity).*
          *   Phenomenon: No pain = self-injury.
          *   Requirement: Theory must explain the *link* between pain and protective behavior/learning, even if the link can be broken (see Item 1).
          *   Status: Non-negotiable (evolutionary/clinical baseline).
          *   User's Scheme: Relates to "Aversive Endorsement."

      *   *Item 4: The Persistence Constraint (Chronic Pain).*
          *   Phenomenon: Pain persists after tissue healing.
          *   Requirement: Theory cannot define pain's badness solely by current tissue damage.
          *   Status: Non-negotiable.
          *   User's Scheme: Challenges purely representational accounts tied to current damage.

      *   *Item 5: The Modulation Constraint (Meaning/Attention).*
          *   Phenomenon: Context changes badness (soldier in battle vs. civilian).
          *   Requirement: Theory must accommodate top-down cognitive influence on valence.
          *   Status: Non-negotiable.
          *   User's Scheme: Fits with "Endorsement."

      *   *Item 6: The Non-Verbal Extension Constraint (Infants/Animals).*
          *   Phenomenon: Subjects who can't report "it bothers me."
          *   Requirement: Theory cannot rely on explicit judgment/report to ground badness.
          *   Status: Non-negotiable (ethical necessity).
          *   User's Scheme: *Challenge:* "Aversive Endorsement" sounds cognitive. Might need rephrasing to "dispositional avoidance."

      *   *Item 7: The Phenomenal/Functional Neutrality Constraint.*
          *   Phenomenon: Philosophical disagreement on qualia.
          *   Requirement: Criteria must not presuppose qualia exist or don't exist.
          *   Status: Non-negotiable (for the purpose of this group).
          *   User's Scheme: The term "phenomenal property" should be avoided in the criteria themselves.

  3.  **Addressing the User's Three-Component Scheme:**
      *   Sensory-discriminative: Widely accepted (Melzack/Casey).
      *   Affective-aversive: Widely accepted.
      *   Aversive Endorsement: This is the tricky one. "Endorsement" implies a cognitive judgment ("I take this as a reason"). This risks excluding infants/animals or non-conceptual accounts. It might be better framed as *Motivational Force* or *Behavioral Disposition*. I need to flag this as potentially too intellectualist for a non-negotiable criterion.

  4.  **Identifying Impossibility Results (The "Hard Problem" of Pain):**
      *   *The Tension:* Can we have a theory that says pain is *intrinsically* bad (phenomenal) but also allows it to be separated from motivation (asymbolia) and separated from nociception (psychogenic)?
      *   *The Conflict:* If badness is intrinsic to the feel (Simple Hedonism), asymbolia is hard to explain (did the feel change?). If badness is purely functional (Imperativism), psychogenic pain is hard to explain (what is the command based on?).
      *   *The Most Exclusionary Desideratum:* The **Non-Verbal Extension Constraint** combined with the **Dissociation Constraint**. If you require a cognitive "endorsement" for badness, you fail infants. If you require only nociception for badness, you fail asymbolics. The real killer is usually the requirement to explain *why* it is bad without relying on the subject's report *and* without relying solely on tissue damage.
      *   *Refinement:* The most exclusionary is likely the demand to account for **Asymbolia without eliminating the normative force of pain.** If a theory says asymbolics have no pain, it conflicts with their sensory report. If it says they have pain but it isn't bad, it conflicts with the intuition that pain is *essentially* bad. This is the "Essentialism vs. Dissociation" clash.

  5.  **Drafting the Content (Iterative refinement for tone and neutrality):**
      *   *Tone:* Academic, precise, collaborative, neutral.
      *   *Vocabulary:* Use "valence," "motivational force," "sensory character" rather than "qualia" or "feel."
      *   *Critique of User's Scheme:* The "Aversive Endorsement" component is likely the "Preference/Camp-specific" one. It leans towards Cognitivism/Evaluativism. Functionalists might prefer "Dispositional Avoidance."

  6.  **Review against Constraints:**
      *   Numbered list? Yes.
      *   Motivating case per item? Yes.
      *   Non-negotiable vs. Preference? Yes.
      *   Impossibility results included? Yes.
      *   Most exclusionary desideratum identified? Yes.
      *   Neutral vocabulary? (Check: avoid "phenomenal feel" as a requirement, allow "representation").
      *   Closing paragraph on existing views? Yes.
      *   No bibliography? Yes.
      *   Tell user where they are wrong? Yes (specifically regarding "Endorsement").

  7.  **Final Polish:**
      *   Ensure the "Impossibility" section is sharp. The tension between *Intrinsic Badness* and *Dissociability* is the core philosophical knot.
      *   Make sure the "Non-Verbal" criterion doesn't secretly demand behaviorism.
      *   Check the "Endorsement" critique: If "endorsement" means "taking as a reason," that's high-level cognition. Infants don't do that. So that component of the user's scheme is likely a "Preference," not a "Non-negotiable."

  8.  **Constructing the Output:** (Mental outline of the response)
      *   Introduction: Acknowledge the utility of the exercise.
      *   The List (Table or Numbered): I'll use a structured list for clarity, ensuring the "Status" is clear.
      *   Critique of User's Scheme: Address the 3 components.
      *   Impossibility Results: The "Essentialism vs. Dissociation" problem.
      *   Most Exclusionary Desideratum.
      *   Closing Paragraph on Theories.

      *(Self-Correction during drafting)*: I need to be careful with the "Non-Verbal" criterion. If I say "Theory must explain pain in infants," a theorist might say "Infants don't feel pain." I need to frame it as "Theory must provide conditions for pain's badness that do not *logically require* linguistic report."
      *(Self-Correction on Impossibility)*: The impossibility isn't necessarily logical contradiction, but theoretical cost. I should frame it as a "Trilemma."
      *(Self-Correction on User's Scheme)*: The user asked "whether your desiderata force that scheme on us." I need to answer this directly. The Sensory/Affective split is forced by the data. The "Endorsement" split is *not* forced; it's a specific interpretation of the Affective component.

      *(Final check on neutrality)*: Ensure I don't write "must explain the *feeling*" but rather "must explain the *subject's state*."

      *(Refining the "Most Exclusionary")*: It is likely the combination of Asymbolia + Non-Verbal. A theory that handles Asymbolia via "lack of judgment" fails Non-Verbal. A theory that handles Non-Verbal via "reflex" fails Asymbolia (where reflex is intact but aversion gone). Actually, the *single* most exclusionary is probably **The Dissociation Constraint (Asymbolia)** because it kills Simple Hedonism and Simple Representationalism most directly. I will argue for that.

      *(Wait, one more check)*: The user asked "Tell me where I am wrong to include something." I should explicitly state that "Aversive Endorsement" is too cognitive for a non-negotiable criterion.

      *(Let's write it.)*
answer: |-
  This is a rigorous and necessary preliminary exercise. Disputes in pain theory often stall because participants are optimizing for different explanatory targets (e.g., saving the phenomenology vs. saving the functional role). Below is a specification of desiderata designed to be vocabulary-neutral, followed by an analysis of the impossibility results and your proposed three-component scheme.

  ### Desiderata for a Theory of Pain's Badness

  | # | Desideratum | Motivating Phenomenon / Case | Failure Condition | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Sensory-Valence Dissociation** | **Pain Asymbolia / Insula Lesion / Cingulotomy.** Patients detect noxious stimuli, localize them, and discriminate intensity, but report no unpleasantness and show no distress. | A theory that defines pain's badness as identical to sensory detection (e.g., simple representationalism about tissue damage) cannot explain why these patients detect damage but lack the "badness." | **Non-negotiable** |
  | **2** | **The Aversive Independence** | **Psychogenic Pain / Masochism.** Subjects experience intense aversiveness and suffering with negligible or no identifiable noxious input, or conversely, seek out noxious input without aversiveness. | A theory that ties badness strictly to the magnitude of peripheral nociceptive input cannot explain high aversiveness with low input (or low aversiveness with high input). | **Non-negotiable** |
  | **3** | **The Protective Baseline** | **Congenital Insensitivity to Pain (CIP).** Children with CIP suffer severe tissue damage, self-mutilation, and reduced lifespan because they lack the motivational drive to avoid harm. | A theory that severs the link between pain's badness and protective motivation entirely (making badness purely contemplative) fails to explain the evolutionary and clinical necessity of pain for survival. | **Non-negotiable** |
  | **4** | **The Persistence Condition** | **Chronic / Neuropathic Pain.** Pain persists and remains "bad" long after tissue healing is complete and no current damage is occurring. | A theory that defines the badness of pain solely by the *current* existence of tissue damage or threat renders chronic pain unintelligible or "fake." | **Non-negotiable** |
  | **5** | **The Cognitive Modulation** | **Placebo / Nocebo / Contextual Meaning.** A soldier ignoring a wound in battle vs. a civilian reacting to a scratch; pain intensity and badness shift with expectation and attention without peripheral change. | A purely peripheral or bottom-up account that cannot accommodate top-down modulation of valence fails to capture the malleability of pain's badness. | **Non-negotiable** |
  | **6** | **The Non-Report Extension** | **Neonates / Severe Dementia / Non-human Animals.** Subjects unable to form or report complex judgments (e.g., "I take this as a reason to stop") nonetheless exhibit distress and require protection. | A theory that requires high-level cognitive endorsement or linguistic report to ground pain's badness excludes these subjects from moral consideration or clinical treatment. | **Non-negotiable** |
  | **7** | **The Normative Force** | **The Clinical Obligation.** When a patient reports pain, there is a *prima facie* obligation to alleviate it, distinct from the obligation to fix the underlying tissue. | A theory that reduces pain's badness to a mere descriptive state (like a red light on a dashboard) without normative implications for action fails to capture the ethical urgency of pain management. | **Preference** (Ethical vs. Metaphysical) |
  | **8** | **The Unity of Experience** | **The First-Person Report.** Patients typically report a unified experience ("It hurts"), not two separate events ("I feel pressure and I feel sadness"). | A theory that fragments pain into entirely distinct mechanisms (e.g., two separate qualia or states) without explaining their phenomenological unity risks revisionism that contradicts the subject's testimony. | **Preference** (Phenomenological Camp) |

  ### Critique of Your Three-Component Scheme

  You asked whether the desiderata force your scheme (Sensory-discriminative, Affective-aversive, Aversive Endorsement) on the group.

  1.  **Sensory-discriminative & Affective-aversive:** These are **forced** by Desiderata 1 and 2. The data from asymbolia and psychogenic pain robustly support a multi-dimensional model where detection and valence can vary independently. Any adequate theory must posit distinct functional or structural roles for these components.
  2.  **Aversive Endorsement:** This is **not forced** and should be struck from the non-negotiable specification. "Endorsement" implies a cognitive act of taking a state as a reason. This conflicts with **Desideratum 6 (Non-Report Extension)**. Infants and animals likely do not possess the conceptual capacity to "endorse" a state as a reason for action, yet they satisfy the criteria for being in pain and suffering.
      *   *Correction:* Replace "Aversive Endorsement" with **Motivational Disposition**. This captures the push toward avoidance (Desideratum 3) without requiring high-level cognition. "Endorsement" belongs to a specific cognitivist or evaluativist camp; "Disposition" is neutral enough for functionalist and imperativist accounts.

  ### Impossibility Results and The Exclusionary Desideratum

  There is a structural tension—bordering on a trilemma—between three plausible commitments. A theory may struggle to hold all three simultaneously without significant theoretical cost:

  1.  **Intrinsic Phenomenal Badness:** The view that unpleasantness is an intrinsic, introspectible property of the experience itself (Simple Hedonism).
  2.  **Dissociability:** The view that this badness can come apart from sensory character and motivation (per Asymbolia, Desideratum 1).
  3.  **Non-Cognitive Grounding:** The view that the badness does not depend on high-level judgment (to satisfy Desideratum 6).

  **The Argument:**
  If badness is an *intrinsic property* of the experience (1), it is difficult to explain how it can be removed while the sensory experience remains (Asymbolia) without claiming the experience itself changed fundamentally. If you claim the experience changed, you struggle to explain why the patient reports the *same* sensation. If you claim the experience is the same but the *reaction* changed, you move toward a functionalist account. However, if you move to a functionalist account to save Dissociability (2), you risk making badness dependent on disposition. If you make it dependent on disposition, you must explain how infants have these dispositions without cognition (3).
  Theories that prioritize **Intrinsic Phenomenal Badness** often fail **Dissociability** (they must claim asymbolics aren't in pain). Theories that prioritize **Dissociability** (via functional separation) often struggle with **Normative Force** (why *must* we stop a state that is functionally just a signal?).

  **The Most Exclusionary Desideratum:**
  **Desideratum 1 (The Sensory-Valence Dissociation).**
  This is the single greatest filter. It knocks out:
  *   **Simple Sensory Representationalism:** (Pain is just the representation of damage). Asymbolia proves you can represent damage without the "badness."
  *   **Simple Hedonism:** (Pain is a simple feeling of badness). Asymbolia suggests the "feeling" might remain while the "badness" vanishes, forcing hedonists to argue the feeling *is* the badness and therefore the patient is lying or mistaken.
  *   **Strong Imperativism:** (Pain is a command "Stop this!"). If the patient feels the sensation but has no urge to stop, the imperative is missing. The theory must explain how an imperative can be "heard" but not "heeded" without losing its status as an imperative.

  Theories that survive this filter usually do so by adopting a pluralist or hybrid structure (like your sensory/affective split), but they often pay a price in complexity or phenomenological unity.

  ### Closing Assessment of Existing Views

  Given this specification, **Pluralist or Hybrid Accounts** (like your modified scheme) are best positioned to survive, as they are built to accommodate the dissociation data. **Evaluativist Accounts** will struggle with Desideratum 6 (Non-Report Extension) unless they posit non-conceptual evaluations, which risks diluting the definition of "evaluation." **Simple Imperativist Accounts** are most likely to be knocked out by Desideratum 1 (Dissociation), as they have the hardest time explaining a pain that issues no command to stop without ceasing to be pain. **Pure Representationalists** will fail Desideratum 4 (Persistence), as they cannot easily account for the badness of pain without current tissue damage to represent.
