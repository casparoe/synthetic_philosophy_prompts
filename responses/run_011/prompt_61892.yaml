answer: |-
  ### Pre-amble

  I anticipate the speaker will absorb **Question Five** most comfortably. She has explicitly flagged her immunity to the developmental objection in print, positing a perceptual mechanism for cue-reading that bypasses the need for prior testimonial justification. She will likely have a rehearsed account of non-testimonial calibration (e.g., via successful action) that she considers robust.

  However, I must note a condition under which my line of questioning would require revision. If, in answering **Question Four**, she clarifies that 'local reasons' may include *diachronic but agent-specific* inductive histories (e.g., 'I have seen *this* doctor succeed before'), rather than strictly synchronic cues (e.g., 'the doctor is wearing a white coat'), then my distinction between 'local' and 'general' induction collapses. Should she offer this concession, **Question Six** would need to be scrapped or rewritten, as it presupposes that her 'localism' precludes reliance on any past regularities, even particular ones.

  ***

  ### Questions for the Speaker

  **1.** Empirical research in psychology suggests that ordinary human beings are remarkably poor at detecting deception or assessing competence through local behavioural cues alone, often performing little better than chance. If the evidence indicates that our monitoring mechanisms are this unreliable, does your account not imply that we are unjustified in the vast majority of our testimonial beliefs?

  **2.** Should you reply that we are indeed unjustified far more often than intuition suggests, and that this is simply the cost of intellectual rigour: how do you account for the knowledge we clearly *do* acquire in high-stakes environments where monitoring is known to be ineffective? If the norm is this demanding, does it not cease to function as a norm for creatures like us?

  **3.** Consider a specific instance of such an environment: a patient receiving a diagnosis from an oncologist. There are no local, perceptual cues available to the layperson that track the *competence* of the oncologist's judgement; the white coat and confident tone track neither truth nor expertise reliably. On your view, is the patient unjustified in believing the diagnosis unless they can read competence in the exchange itself?

  > **Expected Reply:** The speaker is likely to argue that the institutional context *is* the local cue. The setting of the hospital and the professional demeanour constitute perceptual evidence of reliability specific to *this* occasion, distinct from a general inductive rule about testimony.
  >
  > **Counter-Question:** But is recognising a hospital setting or a professional demeanour as a marker of competence not itself dependent on a prior, general inductive belief that 'hospitals employ competent people'? If that background belief does no justificatory work, why does the cue carry weight; and if it does, have you not quietly reinstated the general induction you sought to reject?

  **4.** If you maintain that the institutional context functions as a local cue without invoking general induction about institutions: does this not require the hearer to possess a concept of 'medical institution' that is itself acquired testimonially? How does the cue function for the first generation of learners, or for a child encountering a professional context for the first time?

  **5.** This brings us to the child. You have argued that children learn to read sincerity and competence cues perceptually, without relying on the say-so of others. But for a perceptual mechanism to yield justification, must it not be calibrated? What is the non-testimonial feedback loop that teaches the child that *these* cues (e.g., eye contact) track truth, rather than *those* cues (e.g., loudness)?

  **6.** If you suggest the calibration comes from non-testimonial success (the child follows the cue and gets the toy): does this not amount to a local inductive record? And if a local inductive record is permissible, what principled barrier prevents a *general* inductive record from doing the same work, merely aggregated over more instances?

  **7.** Let us turn to the structure of the justification itself. Your opponents (the non-reductionists) argue for a defeasible presumption of truthfulness. You argue for a requirement of positive local reasons. In practice, if the local reasons are present by default in the absence of defeaters, what distinguishes your 'positive reason' from their 'presumption', other than the label?

  > **Expected Reply:** She will likely insist that a presumption places the burden of proof on the sceptic, whereas her view places the burden of provision on the hearer. The hearer must actively possess the reason, not merely lack a defeater.
  >
  > **Counter-Question:** But if the 'active possession' is satisfied by the mere absence of suspicion in a standard context, is the hearer actually doing any work? If the condition is met whenever the non-reductionist presumption would hold, does your requirement not collapse into a paraphrase of the very view you oppose?

  **8.** Finally, if the practical verdicts of your view and the non-reductionist view are nearly identical in ordinary cases, but your view denies justification in the expert cases (like the oncologist) where the non-reductionist grants it: what theoretical virtue is purchased at the price of this scepticism? Why ought we to prefer a reductionism that yields more scepticism without yielding more discriminative power in the standard cases?
