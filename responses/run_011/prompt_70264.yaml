      *   *Specific Details:* Ensure the "Slave/Estate" point is handled carefully (Cato's *De Agri Cultura* vs. *De Senectute*). Ensure the "Memory" point addresses the epidemiologist's concern about data.
      *   *Ordering:* Make sure the "drop if time runs out" questions are the least damaging to the core thesis.

  5.  **Self-Correction during drafting:**
