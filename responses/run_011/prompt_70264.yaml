prompt: |-
  You are a philosopher who works on aging, medical humanities, and the ethics of institutions, and you have spent years coaching junior colleagues through hostile question periods. Treat this as an exercise in anticipatory reasoning rather than a survey of Cicero scholarship. Before you write the prep sheet, spend a short passage reasoning out loud about this particular room: what its members' default picture of an ancient text on aging looks like, which parts of my thesis will strike them as provocative and which as banal, where their technical vocabulary will collide with mine, and which of their standing intellectual commitments my argument runs into head-on. Then produce the sheet.

  The setting. In three weeks I give a colloquium talk at a center for aging studies: thirty minutes of talk, fifteen minutes of questions, no slides during the questions. The room will hold about thirty people — a geriatrician; two social gerontologists who work on successful aging and on the critical literature against it; an epidemiologist who builds frailty indices; a disability studies scholar; a medical anthropologist; one Roman historian; several clinicians and program administrators; no other philosophers. Almost nobody will have read the text. The Roman historian will have read it closely, in Latin. I am not a classicist and I cannot out-scholar that person on textual or philological questions, so I also need a graceful move for when a question lands in territory I genuinely do not know.

  The thesis. Cicero's *De Senectute* — written in 44 BCE, addressed to his friend Atticus, staging Cato the Elder at eighty-four lecturing two young men, Scipio Aemilianus and Laelius, on why old age is not the disaster it is said to be — is not in the first instance a consolation. It is a political brief about who is entitled to keep holding authority. My claim: the four charges Cicero enumerates against old age (that it withdraws us from active pursuits, that it weakens the body, that it strips away pleasure, that it brings us near to death) are not four complaints about the phenomenology of aging but four standing objections to the continued public authority of old men, and each of his four answers supplies a capacity only the old possess and that a republic supposedly cannot run without — command of precedent and institutional memory; a body whose weakness is irrelevant to the work that actually matters, deliberation and the weight of one's word; freedom from the appetites that make a man purchasable; and a proximity to death that removes the leverage a tyrant would otherwise hold over him. Add the context: Cicero wrote this at about sixty, while Caesar's dictatorship had shut him out of public life, and he was killed a year and a half later. On my reading the work's real subject is what happens when the ordinary distribution of authority across ages is suspended by force.

  The argument sketch the objections will be aimed at:

  1. The dramatic form matters. The speaker is not an old man reflecting privately; he is the most famous censor of the republic performing before two young men about to inherit the state. That is an *exemplum* addressed to the next generation of officeholders, not therapy for the old.
  2. Every answer is a political capacity rather than a psychological state. The first is literally about who commands armies and speaks in the senate; the second concedes physical decline but insists the work that matters does not require strength; the third reframes the loss of appetite-driven pleasure as a qualification for office; the fourth converts nearness to death into bargaining power.
  3. The supporting evidence is entirely a roll call of men who hold or held office, plus the pleasures of estate agriculture — itself a form of household governance conducted by other people's labor.
  4. Therefore the genre label is not consolation but apologia: a claim about the distribution of authority across ages, made precisely when that distribution had been abolished.

  What I need is a prep sheet, not a defense. Give me:

  - The eight or nine objections I will actually get **in this room** — not the ones a classics audience would raise, and not the ones an analytic philosophy audience would raise. Order them by the damage they would do, weighting both likelihood and severity, and say which two I can safely let go if the clock runs out at ninety seconds a question.
  - For each: who raises it, phrased the way that person would phrase it in their own vocabulary; a reply deliverable in under two minutes standing up; what I should concede immediately; what I must not concede; and one sentence on where the reply is soft, i.e., where a single follow-up pushes me into retreat.
  - Which two or three objections I can neutralize with a concession made in the first three minutes of the talk, and the exact sentences to use.
  - The one reply that has to land for the thesis to survive contact with this audience, and the cleanest way to state it under pressure.
  - The question I am hoping nobody asks. Say plainly why it is the dangerous one — including what about my own position makes it dangerous — and then give me the most honest answer available, even if it costs me part of the thesis.
  - Which objections are secretly friendly, resting on a misreading of what I claim, and the fastest way to redirect them without sounding evasive.
  - Two or three philological landmines the Roman historian could set, what a non-specialist can safely say about each, and the phrasing that lets me concede a textual point without losing the argument.

  Work in the specifics I know are coming: that the agricultural pleasures Cato celebrates are the pleasures of an estate worked by others, and that the same Cato's farm manual instructs an owner to sell off worn-out stock, old equipment, and old or sickly slaves as surplus, which sits badly with a text that makes him the spokesman for the dignity of the aged; the survivorship problem in an argument whose entire evidential base is a list of eminent old men; Cicero's breezy denial that memory declines (he jokes that no old man ever forgets where he buried his money), which an epidemiologist will treat as fatal; whether wisdom is a construct anyone in that room could measure or has ever measured well; the worry that a political reading of the four charges is unfalsifiable, since any consolatory passage can be re-described as political; and the objection that my reading recruits Cicero as an ally of exactly the normative ideal of aging well that their field spent two decades attacking, because it makes a good old age a matter of continued usefulness and self-command.

  Constraints. No bibliography, no reading list, no citations to anything I would have to look up, and no invented page numbers or Latin quotations. I have no web access during prep; everything must be arguable from the dialogue itself plus what a well-read non-specialist already knows about the late Republic and about aging research. Where you are less than confident of a historical or textual fact, flag it explicitly rather than asserting it — I would much rather drop an example than be corrected in public by the historian in the third row. Keep the replies short and speakable.
