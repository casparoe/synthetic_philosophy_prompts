          *   *Provocative:* That the text *isn't* consolation. This undermines the standard reception history. That "wisdom" is actually "institutional memory" and "freedom from appetite" is "unbribability." This functionalizes virtue.
          *   *Collision:* My "political authority" vocabulary vs. their "successful aging/frailty/disability" vocabulary. They measure function; I'm arguing about legitimacy.
          *   *Head-on Collisions:*
