      *   **Section 5: Friendly Objections.**
          *   Objections that assume I'm saying Cato is *correct* rather than describing what Cato is *doing*.
          *   *Redirect:* "I agree that view is harmful. My point is that Cicero is weaponizing it to fight Caesar."

      *   **Section 6: Philological Landmines.**
