          *   *Selection:*
              1.  Social Gerontologist (Productive Aging critique).
              2.  Disability Scholar (Bodily weakness dismissal).
              3.  Epidemiologist (Memory claims/Frailty).
              4.  Medical Anthropologist (Unfalsifiable political reading).
              5.  Roman Historian (Genre/Consolation).
              6.  Medical Anthropologist/Historian (Slaves/Estate economy).
              7.  Clinician/Admin (Practical utility vs. Political theory).
              8.  Social Gerontologist (Survivorship bias).
