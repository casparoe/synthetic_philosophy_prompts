answer: |-
  **Morgan:** You're staring at the matrix like it owes you money.

  **Casey:** It does. It owes me a justification for deleting S. You say it's strictly dominated, so out it goes. I say you're smuggling in a ghost.

  **Morgan:** It's not a ghost, it's arithmetic. Look at the numbers. If I play S, I get 1 no matter what you do. If I play a fifty-fifty split between H and L, I get 2 against your H, 3 against your S, and 2 against your L. Two is bigger than one. Three is bigger than one. S is dead.

  **Casey:** But who plays a fifty-fifty split? We're research groups, not roulette wheels. I can't build half a high-field magnet and half a cryostat. I have to commit the budget. The strategy set you're using includes things I physically cannot do.

  **Morgan:** That's an objection to the model, not the logic. If you can't randomize, then your strategy set was drawn wrong from the start. But if we agree that rationality includes the capacity to hedge—to keep options open until the last minute—then the mix is a valid plan. It's a contingent plan.

  **Casey:** Is it? Or is it just a description you, the analyst, write down to make the math pretty? Here's the worry: if I delete S because a mixed strategy beats it, I'm assuming you know I consider mixed strategies viable. I'm assuming common knowledge of... what? Common knowledge of coin-flipping?

  **Morgan:** I'm assuming common knowledge of rationality. If you're rational, you won't play a strategy that yields less payoff than another available plan. The mix is available in the sense that it's a probability distribution over acts.

  **Casey:** But acts are what cause outcomes. Distributions are just shadows. Let's try the other reading. Suppose the mix isn't what I *do*, but what you *believe* I might do. Does that rescue the deletion?

  **Morgan:** It should. If you believe I might randomize, then S is still a bad bet for you.

  **Casey:** No, listen. If the mix is just your uncertainty about me, then deleting S depends on you being uncertain in exactly the right way. But why must you be uncertain? If you know I'm a rigid institution that must pick H, L, or S, then you know I won't mix. If you know I won't mix, you know I'm facing the pure matrix. In the pure matrix, S isn't dominated. H beats S only if you don't play L. L beats S only if you don't play H. S is a safety net.

  **Morgan:** But if I know you're rational, and I know you know I'm rational, we run the deletion. You delete S. I delete S. Now we're left with H and L.

  **Casey:** Fine. Humor the deletion. S is gone. Now look at the remainder. You versus me, H or L. If we both pick H, we get 4. Both L, we get 4. Mismatch, we get 0. It's a coordination game.

  **Morgan:** Exactly.

  **Casey:** So is there any dominance left? Can you delete H?

  **Morgan:** No. If I think you'll play H, I play H. If I think you'll play L, I play L. No dominance.

  **Casey:** What about weak dominance?

  **Morgan:** Doesn't apply. Neither strategy is ever worse than the other; they just cross. So the deletion stops there. We're left with two equilibria: all H or all L.

  **Casey:** And the mixed equilibrium?

  **Morgan:** (Pauses) There is one. To make the other indifferent, I have to play H with probability 0.5 and L with 0.5.

  **Casey:** There it is. The ghost returns.

  **Morgan:** Don't start.

  **Casey:** You used a fifty-fifty mix to exorcise S from the temple. Now that the temple is clean, the fifty-fifty mix is living in the holy of holies as the unique symmetric equilibrium of the remaining game. You needed the fiction to clear the board, and now the fiction is the solution.

  **Morgan:** It's not a fiction. It's a stable state of belief. If we can't coordinate on H or L, we default to the mix.

  **Casey:** But if we default to the mix, then S wasn't dominated! Check the math again. If you play the 50/50 mix, and I play S, I get 1. You get... well, your payoff against my S is 3 for H and 3 for L, so your average is 3. You prefer the mix. But what about me? If I know you're playing the 50/50 mix, what should I do?

  **Morgan:** Your expected payoff for H is 2. For L is 2. For S is 1. So you shouldn't play S.

  **Casey:** But only because I'm assuming you *can* play the mix. If I assume you must pick a pure strategy, but I don't know which, then S is a best response to sufficient uncertainty. If I think there's a huge risk you'll pick the opposite of me, S guarantees 1. H and L risk 0. If I'm risk-averse, S wins.

  **Morgan:** We're talking about rationality, not risk aversion. The payoffs are utilities. Risk is already baked in.

  **Casey:** Whose utilities? The lab's? The PI's? A lab doesn't have a utility function over prestige in the same way a gambler has one over cash. This is where your "strategy set drawn wrong" point collapses. You say if I can't mix, the model is wrong. I say if the model requires me to mix to define rationality, the model is asking me to be something I'm not.

  **Morgan:** So you'd keep S in the game?

  **Casey:** I'd say the deletion isn't compelled by rationality alone. It's compelled by rationality plus a specific ontology of choice. You need common knowledge that we treat probability distributions as actions. That's a stronger assumption than just "we want to win."

  **Morgan:** But if you admit mixed strategies as possible beliefs—even if not actions—doesn't S fall? If I think there's *any* chance you randomize, S looks weak.

  **Casey:** Not necessarily. If I think you're mostly likely to play H, but might play L, S might still be safe. But look, let's talk about the order dependence. You deleted S via strict dominance. That's order-independent. Fine. But suppose we had weak dominance later. If we started deleting weakly dominated strategies in the 2x2, we could end up anywhere depending on the order.

  **Morgan:** But we don't have weak dominance here. We stopped.

  **Casey:** Exactly. The machinery grinds to a halt. You used a sledgehammer to crack a nut, threw away the nut, and now you're holding two halves of a shell wondering which one to eat. The mix deleted S, but the mix is also the only thing that resolves the H/L standoff without communication.

  **Morgan:** So what's your verdict? Is the deletion legitimate?

  **Casey:** It's legitimate only if you agree that "what a player can do" includes "what a player can simulate via a randomizing device." If the lab can't flip a coin to decide a five-year budget, then S is not dominated. It's dominated only relative to a super-player who can inhabit both H and L simultaneously.

  **Morgan:** And if that super-player is the only rational agent?

  **Casey:** Then you're not modeling two labs anymore. You're modeling two algorithms. And maybe that's fine for some questions. But don't tell me it's just "rationality." It's rationality plus a specific theory of agency.

  **Morgan:** I can live with that. We agree on the game. We agree on the payoffs. We agree that *if* mixed strategies are admissible acts, S goes.

  **Casey:** And we agree that *if* mixed strategies are merely descriptions of uncertainty, S stays unless we assume specific beliefs.

  **Morgan:** So the disagreement isn't about the math. It's about whether a research group is the kind of thing that can be a probability distribution.

  **Casey:** Precisely. You think rationality forces us to be distributions. I think rationality forces us to be coherent, but coherence doesn't require randomization. S is the coherent choice for an institution that fears catastrophe more than it desires glory.

  **Morgan:** Then S is dominated by risk-dominance, not strategic dominance.

  **Casey:** Maybe. Or maybe the matrix doesn't capture the cost of failure. If H fails against L, I get 0. That's not just zero prestige; that's losing funding. S keeps the lights on.

  **Morgan:** Then change the payoffs. Don't blame the deletion rule.

  **Casey:** I'm blaming the rule for pretending the payoffs are the whole story. The rule says "delete S." I say "wait, why are we allowed to delete?" You say "because math." I say "because you decided math rules biology."

  **Morgan:** (Laughs) Fair enough. But if you keep S, you can't use iterated deletion to solve the game. You're stuck with the full 3x3.

  **Casey:** Better stuck with reality than lost in a clean fiction. But I'll concede this: if we *could* randomize, you'd be right. The math holds.

  **Morgan:** And I'll concede: if you can't randomize, the deletion assumes too much about what's in our heads. We agree on the conditionality.

  **Casey:** Then we agree on the disagreement. It's not about the numbers. It's about whether a lab can flip a coin.

  **Morgan:** I'll bring a quarter to the next meeting.

  **Casey:** Bring two. One for H, one for L. And keep S in the pocket, just in case.
