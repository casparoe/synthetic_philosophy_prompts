answer: |-
  Good's theorem is often invoked as a normative command: *always acquire free information.* In your clinical context, this suggests that any at-risk adult who declines predictive testing for Huntington's disease (HD) is making an error in expected-utility maximization. Since the test is inexpensive (effectively costless) and definitive, the theorem implies the expected value of information (EVI) must be non-negative. If the patient declines, standard decision theory labels this irrational.

  However, to advise these patients honestly, you must examine where the theorem's assumptions map onto the phenomenology of HD testing and where they fracture. The theorem does not prove that testing is always right; rather, it provides a diagnostic tool to identify *why* refusal occurs. In the case of HD, the refusal is not merely an excusable weakness of will; it is often a rational response to the violation of the theorem's underlying conditions.

  Here is an analysis of the assumptions, where the theorem holds, where it fails, and what this implies for the rationality of refusal.

  ### 1. The Assumption of Utility Stability
  **Theorem Assumption:** Acquiring information changes your probability assignments (beliefs) but not your utility function (values/preferences). You want the same outcomes before and after the test.
  **HD Context:** This assumption frequently fails.
  **Implication:** Good's theorem assumes the agent is the same entity before and after the information arrives. In HD testing, the *state of knowing* often fundamentally alters the utility function. A patient may value "hope" or "living in the present" significantly more than "certainty." Once a positive result is known, the utility of future plans (career, family, retirement) may collapse, not because the physical reality has changed instantly, but because the *valuation* of that reality has shifted.

  If the utility of the state *Knowing-I-Am-Positive* is strictly lower than the utility of the state *Uncertain*, then the information itself carries a negative utility payload. Good's theorem accounts for the cost of *acquisition*, but it typically treats the *possession* of information as neutral unless it alters action. If the possession alters the *valuation of life*, the information has negative intrinsic value.
  **Advisory Takeaway:** You are not advising a static agent. If the patient reasonably anticipates that a positive result will depress their utility function (e.g., through anticipatory grief or loss of hope), refusing the test is a rational strategy to protect their current utility structure.

  ### 2. The Assumption of Conditionalization and the "Option to Ignore"
  **Theorem Assumption:** The agent will update by conditionalization (Bayesian updating) and can always choose to act as if they had not received the information if that yields higher utility. This guarantees the "non-negative" value: you can always ignore the news and stick to the prior optimal plan.
  **HD Context:** The information is unignorable.
  **Implication:** Good's proof relies on the option to discard the information if it proves inconvenient. "Looking before leaping" is safe because if you see a cliff, you can choose not to leap, or if you see no cliff, you can leap as planned. But HD information is not about an external obstacle; it is about the agent's own constitution.
  Once a patient knows they carry the expansion, they cannot easily "act as if" they do not. The knowledge infiltrates insurance applications, reproductive choices, and psychological well-being. The "option to ignore" required for the non-negative value proof is illusory. If the information forces a change in decision (e.g., sterilization to prevent transmission) that the patient would not have chosen under uncertainty, and that forced change reduces expected utility, the value of the information is negative.
  **Advisory Takeaway:** The theorem implies information is valuable because it expands options. In HD, information often *contracts* options (e.g., insurance eligibility) or forces choices the patient wished to defer. If the patient cannot compartmentalize the knowledge, the "freedom to ignore" assumption is void, and the theorem's guarantee disappears.

  ### 3. The Assumption of Individual Privacy (Externalities)
  **Theorem Assumption:** The decision and the information concern only the agent. The utility function is self-regarding.
  **HD Context:** The result is familial.
  **Implication:** A positive result for the patient implies a 50% risk for siblings and children. For some patients, knowing their own status resolves uncertainty for relatives who *prefer not to know*. This creates a negative externality. If the patient values their sibling's right to ignorance, or fears the guilt of being the "first to know" (thereby revealing parental status), the expected utility of testing includes the disutility inflicted on others.
  Good's theorem, in its standard individualistic form, does not account for this. If the patient is an altruistic expected-utility maximizer, the "cost" of testing includes the risk of harming the epistemic autonomy of kin.
  **Advisory Takeaway:** Refusal can be rational if the patient weighs familial harmony or the rights of others heavily. The theorem does not forbid this, provided these social costs are entered into the utility calculation. However, it highlights that the "value" of the information is not isolated to the patient's medical management.

  ### 4. The Assumption of Actionability
  **Theorem Assumption:** Information has zero value just when it cannot change the decision.
  **HD Context:** No treatment exists.
  **Implication:** This is the crux of the "zero value" condition. If there is no medical intervention, does the information change the decision?
  *   **Where the theorem survives:** If the patient intends to make life plans (financial, reproductive) contingent on the result, the information *is* actionable. In this case, Good's theorem holds: testing has positive value because it prevents planning errors (e.g., saving for a retirement that won't happen, or having children who will be orphaned).
  *   **Where the theorem stops applying:** Many patients adopt a strategy of "strategic ignorance." They decide *a priori* that they will live their lives regardless of the result. If the decision rule is "I will not change my behavior regardless of the outcome," then by Good's own metric, the information has **zero instrumental value**.
  If the information has zero instrumental value, but carries a psychological cost (anxiety, depression), the net value is negative.
  **Advisory Takeaway:** You must ask the patient: "If you tested positive, would you do anything differently?" If the honest answer is "No," then Good's theorem agrees with them: the information is worthless to them instrumentally. If it is worthless but painful, refusing it is rational.

  ### Rationality vs. Excusability

  You asked whether refusal is rational or merely excusable. Based on the breakdown above, **refusal is often rational.**

  Good's theorem vindicates "looking before leaping" only under specific conditions: that looking is free, that looking doesn't break your legs, that you can un-see what you found, and that you want the same things after looking as you did before.
  In the HD context:
  1.  **Looking is not free:** The psychological cost of the *state of knowing* is high.
  2.  **Looking changes wants:** The utility function is unstable post-diagnosis.
  3.  **You cannot un-see:** The information is unignorable.
  4.  **Actionability is optional:** If the patient chooses a policy of non-contingent living, the instrumental value is zero.

  Therefore, a patient who declines testing is not necessarily failing to maximize expected utility. They are likely correctly assessing that the *costs* (psychological burden, familial impact, loss of hope) outweigh the *benefits* (instrumental planning), given that the medical benefit is zero.

  ### Implications for Advising

  When advising a patient, do not use Good's theorem to pressure them toward testing. Instead, use it to clarify the structure of their decision:

  1.  **Validate the "Right Not to Know":** Explain that information only has value if it leads to better decisions. If they do not intend to change their decisions based on the result, the theorem itself assigns the information zero value.
  2.  **Distinguish Cost of Test vs. Cost of Knowledge:** Acknowledge that while the *test* is cheap, the *knowledge* may be expensive. Good's theorem subtracts costs from value. If the psychological burden is high, the net value is negative.
  3.  **Explore Utility Stability:** Ask, "Will knowing this change what you want out of life?" If they believe it will darken their world regardless of the outcome, they are identifying a violation of the theorem's stability assumption.
  4.  **Clarify Actionability:** Help them identify if there are *any* decisions (reproductive, financial, legal) that would genuinely be improved by certainty. If yes, the theorem suggests testing has value. If no, the theorem supports refusal.

  ### Conclusion

  Good's theorem survives intact only where information is purely instrumental and psychologically neutral. In clinical genetics, information is often constitutive—it changes who the patient is and how they value their future. Where the theorem quietly stops applying is at the boundary of the *mind*. It treats the agent as a processor of data, not a sufferer of fate.

  Consequently, a refusal to test is not a failure of rationality. It is a rational protection of the self against information that has high cost, low instrumental utility, and the power to degrade the very utility function used to evaluate it. You are not dealing with a violation of decision theory; you are dealing with the limits of decision theory when applied to the human condition.
