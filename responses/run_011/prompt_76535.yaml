prompt: |-
  I'm prepping the Q&A for our department's graduate reading group and I could use some help. The speaker defends a response to the rule-following problem that I'm having trouble getting a grip on: she thinks the meaning-facts are real and genuinely normative, but they're constituted by the ongoing social practise of holding each other to standards — correcting, praising, saying "no, that's not what plus means here." Her signature move is that whenever you ask what makes a given use correct rather than not, she says you're asking the question from outside the practice, and there is no outside. She also insists she isn't a quietist: unlike the "the paradox just dissolves" crowd, she thinks she gives the skeptic a straight answer, just not the one he was fishing for.

  Write me seven or eight questions that get past that move, each with a follow-up keyed to the answer she's most likely to give. I want at least one on a lone speaker who was never corrected by anybody, one on whether "correct" collapses into "what we do" on her account, one on a genuinely novel case the practice hasn't reached yet, one on the worry that correcting others presupposes getting the rule for "correct" right, and one closing question on what would count as evidence her view is wrong. No warm-up stuff about how she got into Wittgenstein.
