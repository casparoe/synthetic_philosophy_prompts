  # Decision Tree: Underlying Commitments on the Norms of Assertion

  **Instructions:** For each numbered claim below, mark **Accept** or **Reject**. Follow the path indicated to find your theoretical position (Leaf). If a question does not apply to your previous answer, skip to the next relevant node.

  1.  **Unity of Practice:** "The term 'assertion' picks out a unified linguistic kind governed by a single core norm, rather than a family-resemblance cluster of speech acts."
      *   **Reject:** Go to **Leaf 1** or **Leaf 2**.
      *   **Accept:** Go to Question 2.

  2.  **Sincerity/Belief Priority:** "A speaker who asserts *p* while believing *not-p* (like the evolution teacher who teaches truth she disbelieves) violates the *primary* norm of assertion, regardless of her evidence."
      *   **Reject:** Go to **Leaf 3** or **Leaf 4**.
      *   **Accept:** Go to Question 3.

  3.  **Factivity Requirement:** "An assertion made on the basis of overwhelming evidence is improper if the content turns out to be false (like the physician who predicts recovery on excellent evidence but is unlucky)."
      *   **Reject:** Go to **Leaf 5**.
      *   **Accept:** Go to Question 4.

  4.  **Epistemic Strength:** "A speaker who asserts a truth based on justified belief that fails to constitute knowledge (e.g., via Gettier luck or lottery odds) has asserted improperly."
      *   **Reject:** Go to **Leaf 6**.
      *   **Accept:** Go to Question 5.

  5.  **Assessment Sensitivity:** "The propriety of an assertion can be correctly assessed as improper by an audience with more information than the speaker had at the time of utterance."
      *   **Accept:** Go to **Leaf 7**.
      *   **Reject:** Go to Question 6.

  6.  **Contextual Stakes:** "The epistemic standard required for proper assertion rises when the practical stakes of being wrong are higher."
      *   **Accept:** Go to **Leaf 8**.
      *   **Reject:** Go to Question 7.

  7.  **Constitutive Force:** "Violating the norm of assertion renders the act a defective instance of the kind, regardless of whether the speaker is blameworthy."
      *   **Accept:** Go to **Leaf 9**.
      *   **Reject:** Go to **Leaf 10**.

  ***

  ## The Leaves (Theoretical Positions)

  *   **Leaf 1: The Radical Skeptic.**
      *   *Path:* Q1 Reject (No unified kind).
      *   *Most Awkward Commitment:* There is no theoretical work for a "norm of assertion" to do because there is no single practice to be normed.
  *   **Leaf 2: The Moderate Pluralist.**
      *   *Path:* Q1 Reject (Family resemblance).
      *   *Most Awkward Commitment:* We must tolerate contradictory norms across domains without a higher-order principle to resolve conflicts between scientific and everyday assertion.
  *   **Leaf 3: The Expressivist/Pragmatist.**
      *   *Path:* Q1 Accept, Q2 Reject (Belief not required).
      *   *Most Awkward Commitment:* A speaker can assert properly while lying, provided the lie serves a rational practical end or follows conversational rules.
  *   **Leaf 4: The Commitment Theorist (Linguistic).**
      *   *Path:* Q1 Accept, Q2 Reject (Focus on commitment, not belief).
      *   *Most Awkward Commitment:* The speaker undertakes a responsibility for the truth of *p* even if she privately believes *p* is false, making her insincerity a separate issue from the speech act's validity.
  *   **Leaf 5: The Justification Norm.**
      *   *Path:* Q1 Accept, Q2 Accept, Q3 Reject (False + Justified = OK).
      *   *Most Awkward Commitment:* The physician's failed prediction was a proper assertion, meaning propriety is severed from the actual state of the world.
  *   **Leaf 6: The Truth Norm.**
      *   *Path:* Q1 Accept, Q2 Accept, Q3 Accept, Q4 Reject (True + Justified = OK, Knowledge not needed).
      *   *Most Awkward Commitment:* A speaker who guesses correctly or relies on Gettierized evidence asserts just as properly as one who knows.
  *   **Leaf 7: The Relativist/Assessment-Sensitive.**
      *   *Path:* Q1 Accept, Q2 Accept, Q3 Accept, Q4 Accept, Q5 Accept.
      *   *Most Awkward Commitment:* An assertion can be proper at the moment of utterance but become improper later without any change in the speaker's conduct or evidence.
  *   **Leaf 8: The Contextualist.**
      *   *Path:* Q1 Accept, Q2 Accept, Q3 Accept, Q4 Accept, Q5 Reject, Q6 Accept.
      *   *Most Awkward Commitment:* Two speakers in identical epistemic positions assert differently solely because one is discussing a lottery ticket and the other a murder trial.
  *   **Leaf 9: The Strict Knowledge Norm (Constitutive).**
      *   *Path:* Q1 Accept, Q2 Accept, Q3 Accept, Q4 Accept, Q5 Reject, Q6 Reject, Q7 Accept.
      *   *Most Awkward Commitment:* A blameless speaker who asserts on excellent but Gettierized evidence has performed a defective act, akin to a broken promise.
  *   **Leaf 10: The Regulatory Knowledge Norm.**
      *   *Path:* Q1 Accept, Q2 Accept, Q3 Accept, Q4 Accept, Q5 Reject, Q6 Reject, Q7 Reject.
      *   *Most Awkward Commitment:* The speaker violates the norm of assertion but incurs no normative defect in the act itself, rendering the "violation" indistinguishable from mere excusable error.

  ***

  ## Indistinguishable Pairs

  **Leaf 9 (Strict KN) and Leaf 10 (Regulatory KN):**
  My questions cannot empirically separate these two leaves using the provided test cases. Both agree that the Gettier subject asserts "improperly" in the sense of violating a standard. The distinction lies entirely in the metaphysical consequence of that violation (does it ruin the *act* or just the *speaker's standing*?). In practice, both leaves will advise the Gettier subject to remain silent, and both will criticize her if she speaks. The group will likely find themselves agreeing on all case verdicts while disagreeing on the label "constitutive."

  **Leaf 7 (Relativist) and Leaf 8 (Contextualist):**
  While Question 5 attempts to separate them, in many "lottery" cases, both views predict the same intuition: the assertion feels improper. The Contextualist explains this by saying the stakes raised the knowledge threshold at the time of utterance; the Relativist says the assessor's context determines the truth of the normative claim. Without a case where the speaker's context and assessor's context diverge *without* stakes changing (e.g., pure information divergence), the group may find these leaves deliver identical verdicts on the test cases.

  ## Empty Combinations (Theoretical Ghosts)

  **1. The Truth Norm + Assessment Sensitivity (Q3 Accept, Q4 Reject, Q5 Accept):**
  *   *Diagnosis:* **Incoherent.** If the only norm is Truth, assessment sensitivity collapses. A proposition is either true or false simpliciter; it cannot be "true relative to the assessor" without importing epistemic standards (like knowledge or justification) into the truth condition itself, which abandons the pure Truth Norm.

  **2. The Justification Norm + Constitutive Defect (Q3 Reject, Q7 Accept):**
  *   *Diagnosis:* **Unattractive.** This view holds that an assertion is a *defective kind* if false, even if justified (contradicting Q3), OR it holds that an assertion is a *defective kind* if unjustified, even if true. If one accepts Q3 Reject (False+Justified = OK), one cannot consistently hold Q7 Accept (Violation = Defective Act) regarding truth, because the act wasn't a violation. If one holds that lack of justification makes the act defective *even when true*, this is a Knowledge/Justification hybrid that usually collapses into the Knowledge Norm (Leaf 9) because "defective act" implies a failure of the act's purpose (conveying truth/knowledge).

  **3. Sincerity Norm + Factivity Requirement (Q2 Reject, Q3 Accept):**
  *   *Diagnosis:* **Unexplored/Unstable.** This combination claims belief is *not* required (Teacher is OK) but Truth *is* required (Physician is not). This creates a view where a lying truth-teller asserts properly, but an honest error-teller asserts improperly. This inverts the standard moral/epistemic alignment and leaves the norm without a clear anchor: if belief doesn't matter, why does truth matter more than utility? No major theorist occupies this space because it severs the link between the speaker's mind and the world's state in an unmotivated way.
