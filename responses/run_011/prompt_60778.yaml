      *   **Audience:** Two Year 9 tutor groups (approx. 13-14 years old).
      *   **Time:** 25 minutes.
      *   **Topic:** Echo Chambers vs. Epistemic Bubbles (based on C. Thi Nguyen's distinction).
      *   **Constraint:** Needs a *plan* (sequence/structure), not a script.
      *   **Tone:** British English (for printing/handing to teacher).
      *   **Specific Concerns:** Order of concepts, carrying example (school-based, Mr D marking), misconceptions (social media bad, just read the other side), awkward social dynamics (kids actually in the Mr D chat), final check (non-quiz), what to exclude.

  2.  **Deconstruct the Core Concepts (for the planner):**
      *   *Epistemic Bubble:* Missing information. You haven't heard the other side. Fix: Listen to them.
      *   *Echo Chamber:* Systemic distrust. You've heard the other side, but you've been taught to distrust the source. Fix: Much harder (rebuilding trust).
      *   *Key Distinction:* It's not about *what* you believe, but *why* you believe it and how you treat outside info.

  3.  **Address the Specific Prompts:**

      *   **The Order:**
          *   User suspects starting with algorithms is a trap. *Verdict:* They are right. Algorithms create bubbles, but chambers are social/psychological. Starting with algorithms makes it about tech, not epistemology.
          *   Prerequisite: Need to establish that *most* knowledge is testimony (trusting others). If they think they verify everything themselves, the distinction makes no sense.
          *   Sequence: 1. We trust people to know things. 2. Sometimes we miss info (Bubble). 3. Sometimes we distrust info (Chamber). 4. Why it matters.

      *   **The Carrying Example (Mr D):**
          *   User's idea: Mr D marks unfairly. Bubble = haven't seen papers. Chamber = think moderation is a cover-up.
          *   Critique: It's strong because it's relatable. However, having it in *one* group chat might blur the line.
          *   Suggestion: Split it slightly to make the mechanism visible. Group A (Bubble) just talks amongst themselves. Group B (Chamber) actively dismisses evidence.
          *   Risk: Accusation. Needs to be framed hypothetically or historically ("Imagine a year group...").

      *   **Misconceptions:**
          *   (a) Social Media Bad: Address early. It's about human psychology, tech just amplifies it.
          *   (b) Fix is reading the other side: True for bubbles, false for chambers. This is the crux of the lesson.
          *   (c) "I'm not in one": The immunity bias. Address near the end.
          *   Timing: Don't bunch at the end. Weave them into the explanation.

      *   **The Awkward Bit (The Real Mr D Chat):**
          *   Risk: Calling them out.
          *   Mitigation: Make the example generic enough or explicitly fictionalised ("Let's invent a teacher, Mr Smith"). Or, acknowledge the reality without pointing fingers ("This happens in schools, maybe not here, but...").
          *   Better approach: Use the Mr D example but frame it as a *structure* anyone can fall into, not a judgement on the belief itself. If challenged ("Are you talking about us?"), deflect to the *mechanism* ("I'm talking about how *any* group works, even ours").

      *   **The Check:**
          *   No quiz. Last day of term.
          *   Idea: Scenario sorting. "Here's a situation, is it a bubble or a chamber?"
          *   Better: "How would you fix it?" If they say "show them the evidence," ask "What if they don't trust the evidence?"

      *   **What to Leave Out:**
          *   Deep epistemology (testimony justification).
          *   Political examples (too polarising).
          *   Solutions for echo chambers (too hard/depressing for 25 mins).
          *   Line: "We haven't got time to solve the second one today, because it's the hard bit."

  4.  **Drafting the Plan (incorporating British English):**
      *   *Structure:* Introduction -> Foundation (Trust) -> The Bubble -> The Chamber -> The Difference (Fixes) -> The Check -> Conclusion.
      *   *Tone:* Professional but accessible (it's a student plan for a teacher).
      *   *Formatting:* Clear headings, bullet points, timing estimates.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Order:* I need to make sure the "Trust" foundation doesn't take too long. 5 minutes max.
      *   *Correction on Example:* I need to advise the user to change the name "Mr D" to something fictional to protect the kids. Using a real teacher's initial is risky even if anonymised. Let's suggest "Mr X" or a fictional subject. Actually, the user said "Mr D" is the idea. I should advise them to *change the name* for the actual session to avoid the "fingered" risk.
      *   *Correction on Misconception (b):* I need to be clear that reading the other side *works* for bubbles but *backfires* for chambers. That's the key teaching point.
      *   *Correction on Awkward Bit:* If a kid says "Are you talking about us?", the answer shouldn't be a denial, but an invitation. "If it fits, the lesson still applies."

  6.  **Final Review against Constraints:**
      *   British English? Yes (colour, programme, maths, etc.).
      *   Plan not script? Yes.
      *   All specific questions answered? Yes.
      *   Time limit respected? Yes (25 mins is tight).

  7.  **Final Polish:** Check the tone. It needs to sound like a helpful peer/mentor plan, suitable for a teacher to review. (Wait, the prompt says "I'm printing it and handing it to my teacher". So the tone should be a proposal *from* the student *to* the teacher, or a plan the student can follow? "Please write the whole thing in British English, cos I'm printing it and handing it to my teacher." -> Okay, I am writing the plan *for* the student to give to the teacher. So it should look like a lesson plan document.)

