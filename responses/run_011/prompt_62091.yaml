  **Why it looked safe:**
  The argument feels compelling because step (3) is technically correct: Kolmogorov complexity is defined relative to a reference machine, and you can always construct a machine that hardcodes a specific string to make it "simple." Consequently, (4) correctly notes the Invariance Theorem only bounds the difference by a constant. It looks safe because it exploits the genuine relativity of complexity measures. If simplicity were absolute, (3) would be false. Since it isn't, the inference to (5)—that simplicity orderings are therefore arbitrary—seems like a valid deduction from language relativity.

  **Why reject (5):**
  This step conflates "having a higher prior" with "winning the induction." Solomonoff induction (keeping (1)) isn't about selecting the single shortest hypothesis (that's Minimum Description Length); it's about Bayesian updating over *all* hypotheses weighted by $2^{-K(h)}$. While rigging the language $L'$ boosts a specific $h$'s prior, the additive constant is independent of data length. As evidence accumulates, the likelihood term swamps the prior constant. The Invariance Theorem guarantees that predictive distributions converge regardless of the reference machine, provided the data stream is computable. The language choice affects the *speed* of convergence, not the *limit*.

  Additionally, (5) implies you can pick a language to make whichever hypothesis you want win. But induction requires a fixed reference machine to compare hypotheses consistently across time. If you change $L$ to favor $h_1$, then change it to favor $h_2$, you aren't performing induction; you're overfitting. Once you fix $L$ ex-ante, you lose the ability to make *any* hypothesis win; you are stuck with the biases of that specific $L$. You cannot rig the language to favor *all* possible future data sequences simultaneously.

  **What it costs:**
  Rejecting (5) costs you the claim that the prior is uniquely determined. You must accept that the universal prior is only unique up to a multiplicative constant. This means Solomonoff induction cannot claim to give the *one true* probability for finite data sequences.

  **Surviving Worry:**
  The "reference machine problem" remains. While asymptotic convergence is invariant, finite-sample predictions depend on the chosen universal machine. There is no purely mathematical justification for preferring standard Turing machines over other universal models for short data sequences. We rely on pragmatic grounds (physical computability), but theoretically, the initial prior bias is ungrounded. The formal razor guarantees long-run success, but not short-run uniqueness.

