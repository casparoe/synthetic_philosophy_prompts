  ### Falsification Conditions

  To refute the **Revised Intrinsic Causal Basis Principle**, look for these cases on your bench or in your intuitions:

  1.  **The Identical Twin Failure (Refutes Base Clause):**
      Find two samples with *identical* measured microstructure (same P, same constitutive rules), where one consistently manifests M under S and the other does not, with *no* extrinsic difference.
      *   *Why:* This would prove the disposition is not grounded in the intrinsic base P you identified. (e.g., if two "identical" mugs break differently due to some unmeasurable historical factor, your "intrinsic at t" clause is insufficient).

  2.  **The Extrinsic Essential (Refutes Extrinsic Exclusion):**
      Find a case where engineering practice *requires* you to call an object "Not Fragile" solely because of a permanent extrinsic fixture, even if the fixture is easily removable.
      *   *Example:* A mug sold permanently mounted in a shock-absorbing frame. If the market treats "Mug-in-Frame" as the unit of sale, calling the mug "Fragile" is misleading.
      *   *Why:* This would show that dispositions are pragmatic ascriptions relative to use-context, not intrinsic properties.

  3.  **The Backward Mask (Refutes Pathway Clause):**
      Find a case where the manifestation M occurs *before* the stimulus S, or where the manifestation prevents the stimulus, yet we still ascribe the disposition.
      *   *Why:* This would break the S->M causal ordering required by the principle. (Unlikely in materials science, but possible in biological/teleological systems).

  **Summary Advice:**
  Your intuition that **Case 4** (Charge) and **Case 5** (Custodian) have opposite verdicts is the strongest anchor you have. It proves you are a Realist about Dispositions (they are in the object, not the outcome). Stick to that. It forces you to call **Case 7** (Self-Stiffening) "Not Fragile," because the protection is intrinsic. That is the price of consistency, and it is a price worth paying for a materials scientist. A material that doesn't break isn't fragile, regardless of what its lattice would have done if it were a different material.
