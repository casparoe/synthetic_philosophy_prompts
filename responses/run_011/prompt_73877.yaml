      *   *Tension E:* (1) & (4) vs. (5b). (4) says LCL outcome is fine even if nobody prefers it, because protected spheres interacted. (5b) says A's right *does not prevail* in the smoking case. Why does LCL protect the right despite Pareto violation, but Smoking case overrides the right due to Pareto (unanimous preference)?
