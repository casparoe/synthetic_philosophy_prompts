  2.  **Deconstruct the Commitments:**

      *   **(1) Definition of Rights:** Rights = protected sphere of decisiveness over outcomes (Sen-style Minimal Liberalism - ML). Rights are properties of the social ordering. *Key:* "I regard it as getting the concept right rather than as one option among several."
      *   **(2) Pareto Condition:** Accept Unrestricted Pareto (UP). Rejecting restricted Pareto is circular (needs prior account of rights). Impossibility must be answered elsewhere.
      *   **(3) Resolution of Impossibility:** Gibbard's reformulation (Rights as game-forms/strategies, not outcomes). Claims this dissolves the paradox. Sen mis-stated the claim. *Key:* "once it is stated correctly the tension disappears."
      *   **(4) Lady Chatterley's Lover (LCL):** Not an embarrassment. Bad interaction of spheres is acceptable even if outcome is Pareto-inferior. Protected pairs were correctly specified.
      *   **(5) Specific Verdicts:**
          *   (5a) Cold Air (Window): A's right prevails over B+C's preference. (Consistent with ML).
          *   (5b) Smoke (Asthma): B+C's preference prevails over A's right. (Right is *not* decisive here).
      *   **(6) Domain Restriction:** Sen's escape route (restricting preferences about others' choices) is not obviously ad hoc and shouldn't be rejected out of hand.
      *   **(7) Meta-Level:** (1) is a technical device, not a moral claim. But the impossibility result is normatively serious.

  3.  **Initial Scan for Tensions:**

      *   *Tension A:* (1) says Sen-style ML is the *correct* representation. (3) says Sen mis-stated the claim and Gibbard's game-form approach is the *correct* one to dissolve the paradox.
      *   *Tension B:* (1) says rights are properties of the social ordering. (3) says rights are about what an individual is unconditionally able to bring about (game form/strategy), implying rights are *not* just properties of the social ordering in the Sen sense.
      *   *Tension C:* (2) accepts Unrestricted Pareto. (3) says Gibbard dissolves the tension with Pareto. But Gibbard's solution usually involves giving up the outcome-based definition of rights in favor of a game form. If (1) is held as "the concept right," can (3) hold?
