answer: |-
  You suggest my functionalist rival can replicate my ethical verdicts precisely, yet this overlooks where our ontologies fundamentally diverge regarding the boundaries of the subject itself. Take the concrete case of mind uploading. A functionalist, being substrate-neutral, must grant that a perfect computational simulation retains the subject and thus merits full moral protection; to delete it is murder. I, however, hold that physics describes only behaviour, and a simulation copies behaviour without necessarily instantiating the intrinsic nature required for genuine experiential unity. While the silicon chips possess micro-experiences, there is no guarantee they unify into a macro-subject without the specific causal powers of biological matter. Consequently, deleting a putative upload is permissible for me, as no unified subject exists to suffer the harm of disintegration, whereas for the functionalist, it is a grave wrong. Here the metaphysics dictates the moral status directly: if there is no intrinsic unity, there is no one to harm.

  Furthermore, even within biological systems, the nature of the harm differs in a way that dictates different choices. The functionalist views death merely as the cessation of future capacity, but I recognise the scattering of a unified perspective as a distinct ontological evil, irreducible to the sum of micro-feels. This affects end-of-life decisions where functional capacity is already lost but faint unity persists; I would argue against interventions that fragment this remaining unity prematurely, even if functional output is unchanged. Your functionalist cannot coherently prioritise the preservation of unity over function without smuggling in my metaphysics, for on their view, unity is just another function. So yes, the metaphysics has teeth: it changes who counts as a patient, and it changes what counts as a harm to them.
