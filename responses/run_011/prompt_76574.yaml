answer: |-
  Regulationism about phenomenal concepts accomplishes the explanatory work of illusionism without its eliminativist ontology by showing that the cognitive mechanisms underlying phenomenal judgment are regulatory rather than referential, thereby rendering the metaphysical status of phenomenal properties irrelevant to the dissolution of the hard problem.

  On the regulationist view, the incorrigibility of sincere pain reports is not a matter of privileged access to a private object but a structural feature of the concept's deployment. A phenomenal concept like "pain" is correct not when it matches an intrinsic quality, but when it successfully initiates the regulatory protocol associated with harm-avoidance and attentional capture. Because the act of sincerely applying the concept is itself the execution of that regulatory protocol, there is no logical space for the concept to be deployed successfully while failing to match the state; the deployment constitutes the success. This explains why subjects cannot be wrong about being in pain without positing a private object that guarantees truth, as the truth-condition is internal to the functional role of the judgment itself.

  The zombie intuition remains resistant because phenomenal concepts present themselves as referential trackers of intrinsic properties, even though their correctness conditions are purely regulatory. This presentational character creates a cognitive illusion that the concept latches onto something over and above the functional role, making it seem conceivable that the role could exist without the "latched" property. However, this resistance is a poor guide to metaphysical possibility because conceivability here tracks the independence of the regulatory role from the *representation* of a property, not the independence of the role from the physical state realizing it. We can conceive of zombies because we can conceive of the regulatory machinery operating without the misleading introspective representation, not because we have glimpsed a metaphysical possibility of function without physical realization.

  Consequently, the explanatory gap survives but is relocated from a metaphysical chasm between physical processes and phenomenal properties to a psychological question about why physical regulatory processes generate the representation of intrinsic properties. The gap is not closed by reducing qualia to functions, but by explaining why the brain constructs a user-illusion of qualia to manage those functions. This relocated gap is not a threat to physicalism because it demands only an explanation of a representational feature within a physical system, which is a standard problem for cognitive science, rather than an explanation of how non-physical properties emerge from physical ones.

  All of this explanatory work is available without asserting that phenomenal properties do not exist, rendering regulationism metaphysically neutral. A realist can accept that phenomenal concepts are regulatory while maintaining that the states regulated possess intrinsic phenomenal properties, provided those properties are not what the concepts track. The illusionist claims the properties do not exist; the realist claims they exist but are not referenced by the concepts. Since the explanation of the hard problem relies only on the structure of the concepts and the regulatory roles, both parties can agree on the explanation of the *appearance* of consciousness while disagreeing on the ontology underlying it.

  The residue of the dispute that survives this neutrality is strictly ontological: whether there exists an intrinsic property supervening on the regulatory state that exceeds the regulatory role itself. This residue is merely verbal in the context of the philosophy of mind's explanatory projects because any such property is causally inert by stipulation of physicalist closure and undetectable by stipulation of the concept's non-referential nature. Since the property does no explanatory work regarding behavior, cognition, or the intuition of consciousness, the disagreement amounts to a difference in labeling the ontological surplus rather than a substantive conflict over how consciousness functions or is explained.

  The strongest objection from a realist who accepts these semantic premises is that even if the concept is regulatory, what is being regulated is a state with a phenomenal character, and it is that character rather than the concept doing the explanatory work of motivating avoidance and attention. This objection fails because it reifies the phenomenal character into an efficient cause distinct from the regulatory disposition it is supposed to explain. To say the phenomenal character explains the avoidance is to say the disposition to avoid explains the avoidance, since the "character" of pain just is the first-personal mode of access to that dispositional state. Attributing explanatory power to the character over and above the regulatory profile is a category mistake induced by the concept's misleading presentational character, treating the internal aspect of the mechanism as if it were a separate driver pulling the levers.
