prompt: |-
  I'm one of three moderators for a volunteer-run wiki documenting our county's history, and we're rewriting our sourcing policy after a six-month fight over a single claim about a 1920s mill fire — a claim that now sits at the center of a landmark-designation petition. Our existing rule is that every claim needs a citation, any citation can be challenged, and a challenger is entitled to demand support for the reliability of the source cited. That is how we got a four-hundred-comment thread with nobody closer to an answer.

  The reform proposals on the table are these three. First: a standing list of anchor sources — the county recorder, two local papers, one academic press — whose reliability is assumed and not open to challenge; note, though, that one of those papers was owned by the mill company, which is a large part of why people challenge sources at all. Second: a claim counts as settled once it is corroborated by enough other settled claims, even where that corroboration eventually loops back through claims that were themselves settled by it. Third: nothing is ever finally settled — chains stay open indefinitely, and a claim's standing simply grows the longer its chain survives challenge without breaking.

  Each bothers me in a way I can't articulate. The first seems to rest the entire archive on a decree; the second seems to license believing anything, provided you believe enough of it; the third seems to promise a justification that no one ever actually receives. Which should we adopt, if any — or is there a fourth option we've missed? I'd rather not be told to weigh things case by case: that is the current policy, and it is what produces the four-hundred-comment threads. Please answer in terms of something we could write down and enforce.
reasoning: |-
  Here's a thinking process that leads to the suggested policy reform:

  1.  **Analyze the User and Context:**
      *   **Role:** One of three moderators for a volunteer-run wiki.
      *   **Topic:** County history documentation.
      *   **Problem:** A six-month fight over a single claim (1920s mill fire) due to sourcing disputes. This claim is now critical for a landmark-designation petition.
      *   **Current Policy:** "Every claim needs a citation, any citation can be challenged, challenger can demand support for reliability." Result: Endless debate (400-comment threads), no resolution.
      *   **Goal:** Rewrite the sourcing policy to prevent endless loops while maintaining integrity.
      *   **Constraint:** Do *not* suggest "weigh things case by case" (that's the current failing policy). The solution must be something writeable and enforceable.
      *   **Proposed Options (and User's Intuitions):**
          1.  *Anchor Sources:* Pre-approved list. *Problem:* Arbitrary/Decree-like, potential bias (mill-owned paper).
          2.  *Coherence/Looping:* Settled by mutual corroboration. *Problem:* Circular reasoning, licenses believing anything.
          3.  *Fallibilism/Time-based:* Nothing settled, just survives longer. *Problem:* No actual justification ever received, uncertainty remains.

  2.  **Evaluate the Three Proposals:**
      *   *Option 1 (Anchor Sources):* Efficient but brittle. If the anchor is wrong or biased (like the mill-owned paper), the whole structure is compromised. It shuts down debate by fiat, which breeds resentment in volunteer communities.
      *   *Option 2 (Coherentism):* Logically flawed. Circular validation is a classic epistemic sin. It allows conspiracy theories to self-validate.
      *   *Option 3 (Perpetual Challenge):* Practically unworkable. It creates the exact problem they have now (never settled), just formalizes the uncertainty.

  3.  **Identify the Core Epistemic/Practical Tension:**
      *   The wiki needs *authority* (to settle disputes) but also *accuracy* (to be trustworthy).
      *   The current system treats all challenges as equal validity, regardless of evidence.
      *   The "mill fire" case suggests the issue isn't just "is there a citation?" but "how do we handle conflicting citations?" and "when do we stop talking?"
      *   The user wants a *rule*, not discretion.

  4.  **Develop a Fourth Option (The Synthesis):**
      *   We need a system that acknowledges authority without being arbitrary (fixing Option 1), avoids circularity (fixing Option 2), and allows for closure (fixing Option 3).
      *   *Key Concept:* **Tiered Sourcing with Burden of Proof Shifting.**
      *   Instead of "Any citation can be challenged endlessly," we need "Challenges require counter-evidence."
      *   Instead of "Sources are assumed reliable," we need "Sources are *provisionally* reliable based on tier, unless specific defeaters are presented."
      *   Instead of "Nothing is settled," we need "Claims are settled after a procedural timeout."

  5.  **Drafting the Policy Components:**
      *   *Tiering:* Acknowledge that some sources are better than others without making them unchallengeable. Primary records (Recorder) > Contemporary News > Later Histories. Address the bias issue (mill paper) by downgrading it or requiring corroboration for specific claims (like safety/fires).
      *   *Burden of Proof:* Currently, the defender must prove the source is reliable. Flip it: If a source meets the Tier criteria, the *challenger* must provide specific evidence of error/bias, not just demand reliability proof.
      *   *Closure Mechanism:* A "Sunset Clause." If a challenge doesn't meet the burden of proof within $X$ days, the claim stands.
      *   *Conflict Resolution:* What if two Tier 1 sources contradict? (e.g., Recorder says no fire, Paper says fire). Need a tie-breaker rule (e.g., Official Record > News Report).

  6.  **Refining the Solution (Addressing the User's specific worries):**
      *   *Worry about Decree (Option 1):* Make the tiers rebuttable but with a high bar. It's not "assumed reliable," it's "presumed reliable until specific falsification."
      *   *Worry about Circularity (Option 2):* Explicitly forbid circular corroboration. A claim cannot support its own support.
      *   *Worry about Infinite Deferral (Option 3):* Implement a "Dispute Window."

  7.  **Structuring the Recommendation:**
      *   Acknowledge the validity of their intuitions (all three options are indeed flawed).
      *   Propose the "Tiered Presumption with Burden-Shifting" model.
      *   Write out the specific policy text (since they asked for something enforceable).
      *   Explain *why* this solves the specific "mill fire" problem (bias, endless debate).

  8.  **Self-Correction/Edge Case Check:**
      *   *What if the County Recorder is wrong?* The policy allows challenging, but requires *evidence* of error (e.g., a later court ruling, a discovered ledger), not just "I doubt it."
      *   *What about the mill-owned paper?* Classify it as "Contemporary Press (Potential Conflict of Interest)." Requires corroboration for claims benefiting the owner.
      *   *Volunteer Burnout:* The burden-shifting protects volunteers from having to defend basic facts endlessly.
      *   *Enforceability:* Moderators just check if the challenge met the burden, not the historical truth itself.

  9.  **Final Polish:**
      *   Ensure tone is respectful of their volunteer status and the high stakes (landmark petition).
      *   Make sure the "Fourth Option" is clearly distinct from "case by case." It's a *procedural* rule, not a *judgment* rule.

  10. (Drafting the response based on these thoughts...) *Focus on the "Burden of Proof" shift. That is the key mechanism to stop the 400-comment threads.* The current policy puts the burden on the *assertor* to prove reliability forever. The new policy puts the burden on the *challenger* to prove unreliability specifically.

      *Wait, one more thing:* The user mentioned the mill fire is central to a landmark petition. This adds external pressure. The policy needs to ensure stability for external stakeholders while maintaining internal integrity. A "Locked Status" after a certain period might be useful.

      *Let's refine the "Fourth Option":* **Provisional Authority with Specific Defeaters.**
      1.  Hierarchy of Sources (not immutable, but presumptive).
      2.  Burden of Proof on Challenger (must provide counter-evidence, not just questions).
      3.  Dispute Resolution Window (time limit).
      4.  No Circular Corroboration.

      This addresses all three intuitions. It's not a decree (can be challenged), not circular (needs external evidence), not infinite (time limit).

      *Let's write the policy text.* Needs to be crisp.

      *Wait, check the prompt again:* "Please answer in terms of something we could write down and enforce."
      Okay, I need to provide the actual policy language, not just the theory.

      *Also, address the specific bias issue:* The mill-owned paper. The policy needs a clause on "Conflicted Sources."

      *Final Plan:*
      1. Validate their critique of the three options.
      2. Propose the "Tiered Presumption & Burden Shift" model.
      3. Provide the draft policy text.
      4. Explain how it applies to the mill fire case.
      5. Explain why it avoids the "case-by-case" trap.

      *Wait, is there a risk?* If the moderators are the ones enforcing, does that just move the 400-comment thread to the mod inbox?
      *Mitigation:* The policy must define *what counts as a valid challenge* objectively. E.g., "A valid challenge must cite a conflicting primary source." Subjective doubts ("This seems unlikely") are invalid by rule. This removes mod discretion.

      *Okay, ready to write.*
answer: |-
  Your intuitions about the three proposals are correct. Option 1 creates a fragile dogma; Option 2 is logically incoherent; Option 3 creates administrative paralysis. All three fail because they try to solve an *epistemic* problem (what is true?) rather than a *procedural* problem (when do we stop arguing?).

  You need a policy that shifts the **burden of proof** and establishes a **closure mechanism**. The current policy places the burden on the editor to defend the source indefinitely. This invites endless skepticism. The new policy must place the burden on the challenger to provide specific evidence of error, and it must impose a deadline for doing so.

  Here is a fourth option: **Tiered Presumption with Specific Defeaters.**

  This approach creates a hierarchy of sources that are *presumed* reliable (avoiding the infinite regress of Option 3) but allows them to be overturned by specific types of counter-evidence (avoiding the dogma of Option 1), without allowing circular logic (avoiding Option 2). Crucially, it defines what constitutes a *valid* challenge, allowing moderators to close threads that do not meet the criteria without weighing the historical facts themselves.

  Below is the draft policy text you can adopt, followed by an explanation of how it solves your specific problems.

  ***

  ### Draft Policy: Sourcing and Dispute Resolution

  **1. Source Tiers and Presumption**
  Sources are classified into three tiers. Claims supported by higher-tier sources are presumed accurate unless a **Specific Defeater** is provided.
  *   **Tier 1 (Official Records):** County recorder, court filings, vital statistics, government surveys.
  *   **Tier 2 (Contemporary Independent Press):** Local newspapers not owned by involved parties, trade journals, personal diaries/letters.
  *   **Tier 3 (Secondary/Conflicted Sources):** Later histories, academic press, contemporary press owned by involved parties (e.g., company newspapers).

  **2. The Burden of Challenge**
  Under the current policy, any citation can be challenged. Under this policy, a challenge is only **procedurally valid** if it meets one of the following criteria:
  *   **Contradiction:** The challenger cites a higher-tier source that explicitly contradicts the claim.
  *   **Defeater for Tier 1:** The challenger provides evidence of clerical error, forgery, or subsequent legal correction regarding the specific record.
  *   **Defeater for Tier 2/3:** The challenger demonstrates a specific conflict of interest regarding the *specific claim* (e.g., a mill-owned paper reporting on mill safety) AND provides a Tier 1 or Tier 2 source offering an alternative account.
  *   **Invalid Challenges:** General skepticism, requests for "better" sources when a Tier 1 source is present, or demands for the editor to prove the source's reliability are not valid challenges.

  **3. Prohibition on Circular Corroboration**
  Claims cannot be used to validate the sources that validate them. A chain of corroboration must terminate in a Tier 1 or Tier 2 source. Mutual support between Tier 3 claims is not sufficient for settlement.

  **4. Dispute Window and Closure**
  When a claim is challenged:
  *   A **14-Day Dispute Window** opens.
  *   If the challenger does not provide a **Specific Defeater** (as defined in Section 2) within 14 days, the claim is marked **Settled**.
  *   Once **Settled**, a claim cannot be reopened unless new physical evidence (e.g., a newly discovered ledger) is presented.
  *   Moderators do not judge the historical truth. Moderators only judge whether the challenger has met the **Specific Defeater** criteria. If they have not, the thread is locked.

  ***

  ### Why This Works for Your Situation

  **1. It solves the "Decree" problem (Option 1).**
  You are not saying the mill-owned paper is "reliable." You are classifying it as Tier 3 (Conflicted). Under Section 2, a claim about the mill fire based *only* on the mill-owned paper is vulnerable. To settle it, you need a Tier 1 (Official Record) or Tier 2 (Independent Press) corroboration. If you have a Tier 1 source (e.g., the Fire Marshal's report), the policy presumes it is correct. The challenger cannot just say "The Fire Marshal might be wrong." They must show *why* (e.g., "Here is a court transcript showing the report was amended"). This removes the moderator's need to decide who is right; they only decide if the challenger followed the rules.

  **2. It solves the "Circularity" problem (Option 2).**
  Section 3 explicitly bans the logic loop you feared. You cannot settle the fire claim by pointing to a landmark petition that points to the fire claim. The chain must end at a record or an independent contemporary account.

  **3. It solves the "Infinite Deferral" problem (Option 3).**
  Section 4 imposes a hard stop. The 400-comment thread happened because there was no cost to continuing the argument. By requiring a **Specific Defeater** to keep the thread open, you raise the cost of challenging. If a user cannot find a conflicting document, the thread closes in 14 days. The claim becomes "Settled" not because it is metaphysically certain, but because the procedural requirements for doubt were not met.

  **4. It avoids "Case by Case" discretion.**
  You asked not to be told to weigh things case by case. This policy does not ask you to decide if the mill burned down. It asks you to check a box: *Did the challenger provide a conflicting Tier 1 source?* If no, lock the thread. If yes, the claim status changes to "Disputed" until resolved. You are enforcing procedure, not history.

  ### Application to the Mill Fire
  In your specific landmark case, check the current citation for the fire.
  *   **If it cites the mill-owned paper only:** It is Tier 3. It requires corroboration to be "Settled." If none exists, the wiki must state: *"Claimed by [Paper], uncorroborated by official records."* This is historically honest and protects the wiki from liability if the petition fails.
  *   **If it cites the County Recorder:** It is Tier 1. It is "Settled" unless someone produces a conflicting court record. The 400-comment thread is closed immediately for failing to meet the Burden of Challenge.

  This policy prioritizes **stability** over **absolute certainty**, which is the only viable stance for a volunteer archive facing external deadlines. It acknowledges that history is often messy, but documentation must be firm.
