answer: |-
  This is the kind of argument that keeps historians awake for a reason: it's the ontological fault line of the discipline. You're fighting over whether history is a story of humans navigating constraints or a story of networks where humans are just one node among many. Your roommate is flirting with Latourian Actor-Network Theory; you're defending a modified humanism. Both of you are right to be worried about the determinism trap, because that trap has swallowed careers and justified empires.

  Let's tear into your rubric before I apply it, because if the tools are bent, the measurements are worthless.

  **Specificity** is the strongest axis here. It does the heavy lifting against lazy determinism. If your cause is "climate," you can explain anything and nothing. If your cause is "ash cloud blocks sun for 18 months," you can only explain crop failures and cold summers. High specificity constrains the historian's imagination in productive ways.

  **Non-substitutability** is the weakest link. It relies on counterfactuals, which are inherently speculative. Asking "would another actor have occupied the slot?" assumes history has slots waiting to be filled. Sometimes it does (energy needs); sometimes it doesn't (a specific plague strain). I'm going to score this based on structural necessity rather than pure chance. If the outcome requires *energy density*, coal is non-substitutable. If the outcome requires *cultural reorganization*, a volcano is highly substitutable (war, plague, or theology could have done the same work).

  **Framing-yield** is the philosophical killer. This is where your roommate's "volcano reorganized culture" claim lives or dies. If labeling something an "actor" hides the mechanism of human response, the yield is negative. If I say "the potato revolted," I obscure the British export policies that turned a blight into a famine. If the label adds rhetorical glow but subtracts mechanistic clarity, it's bad history. I think this axis should carry the most weight for your specific worry about determinism, but I will score strictly according to your numbers.

  Here is the scoring. I am not averaging out the discomfort.

  ### Candidate Scoring (0–10 per axis)

  **1. Yersinia pestis (Black Death)**
  *   **Specificity:** 9. It kills in specific ways, moves along trade routes, and spares some populations due to immunity. It picks out a very specific demographic collapse.
  *   **Non-substitutability:** 8. Nothing else in the 14th century could have killed 40% of Europe that fast. It's a unique shock.
  *   **Framing-yield:** 8. Treating the bacterium as an active agent (evading immune systems, hitching rides on fleas) actually improves the history. It forces you to track ecology, not just politics.
  *   **Total:** 25

  **2. Phytophthora infestans (Irish Potato Famine)**
  *   **Specificity:** 9. It targets solanum tuberosum. Very specific biological event.
  *   **Non-substitutability:** 4. Famine was overdetermined by land tenure and export laws. Without the blight, crisis likely arrives via another crop failure or price shock within the decade.
  *   **Framing-yield:** 3. Calling the blight an "actor" actively harms the history. It shifts blame from Westminster policy to nature. The yield is negative; it obscures the human metabolism of the shock.
  *   **Total:** 16

  **3. Mount Tambora (1815/1816)**
  *   **Specificity:** 6. It caused cooling and weather weirdness, but the effects were globally uneven. It tilts odds rather than dictating outcomes.
  *   **Non-substitutability:** 5. Another volcano could have erupted. Or a solar minimum. The "shock" slot was open; Tambora just filled it.
  *   **Framing-yield:** 4. "Tambora reorganized culture" is poetic but explanatorily thin. It doesn't predict *which* culture changes (Romanticism? Religion? Agriculture?). It requires ad hoc patches to explain why some regions adapted and others starved.
  *   **Total:** 15

  **4. The Little Ice Age (Centuries-long cooling)**
  *   **Specificity:** 2. It's a vague, centuries-long trend. It explains everything from witch hunts to Viking migrations, which means it explains nothing.
  *   **Non-substitutability:** 3. Climate shifts are background conditions. If this cooling didn't happen, another fluctuation would have provided the stressor.
  *   **Framing-yield:** 3. Framing climate as an "actor" here is where determinism goes to feed. It suggests a slow, inevitable pressure that removes human agency from long-term structural changes.
  *   **Total:** 8

  **5. Malaria (Lowland Central Italy)**
  *   **Specificity:** 8. It creates specific seasonal incapacitation. It dictates military campaigning seasons and settlement patterns with high precision.
  *   **Non-substitutability:** 7. In that specific ecology, nothing else enforces the same seasonal withdrawal. It's a hard constraint.
  *   **Framing-yield:** 7. Treating malaria as an agent helps explain why empires stalled at certain latitudes. It adds explanatory reach regarding military logistics.
  *   **Total:** 22

  **6. Toba Supereruption (Genetic Bottleneck)**
  *   **Specificity:** 3. The bottleneck theory is contested. The outcomes are diffuse and distant.
  *   **Non-substitutability:** 9. Supervolcanoes are rare. If this didn't happen, nothing else fills that specific catastrophic slot.
  *   **Framing-yield:** 2. It's too distant to explain cultural history. It's a biological reset button, not a historical actor.
  *   **Total:** 14

  **7. Britain's Coal Seams (Industrial Revolution)**
  *   **Specificity:** 7. Coal provides specific energy density. It enables steam, not water.
  *   **Non-substitutability:** 8. Without accessible coal, the Industrial Revolution looks radically different or happens elsewhere. It's a hard geological constraint.
  *   **Framing-yield:** 6. Calling coal an "actor" is tricky. It doesn't act, but it affords. The yield is moderate; it explains timing and location, but not the cultural ideology of industrialism.
  *   **Total:** 21

  ***

  ### Tier List (S through D)

  **S Tier:** *Yersinia pestis.* It is the only candidate here that genuinely behaves like an agent—evolving, moving, and selecting hosts—making the "actor" label analytically useful rather than metaphorical.

  **A Tier:** *Malaria, Britain's Coal.* Both are hard constraints that dictate specific logistical possibilities without requiring us to pretend rocks or parasites have intent; they score high on necessity and specificity.

  **B Tier:** *Phytophthora infestans, Mount Tambora.* These are sharp shocks, but labeling them "actors" actively obscures the human political failures that turned these shocks into catastrophes.

  **C Tier:** *Toba Supereruption.* It's a massive event, but it's too distant and contested to function as a useful historical cause for cultural analysis.

  **D Tier:** *The Little Ice Age.* This is the determinist's playground; it is too vague to be falsifiable and invites the worst kind of geographical essentialism.

  ***

  ### Slide-Risk Rank (Highest Risk to Lowest Risk)

  This ranks how easily an argument built on these candidates degrades into the "ugly version" of environmental determinism your roommate fears.

  1.  **The Little Ice Age:** Highest risk. Because it is vague, any cultural outcome can be retrofitted to it. It allows historians to say "the cold made them violent" without proving mechanism.
  2.  **Phytophthora infestans:** High risk. Framing the blight as the cause of the famine inherently exonerates the colonial administration. It slides from "nature caused hunger" to "nature caused death," erasing policy.
  3.  **Britain's Coal:** Medium-High risk. Suggests industrial supremacy was geological destiny rather than a contingent result of capital and labor exploitation.
  4.  **Mount Tambora:** Medium risk. "Volcano made us write Gothic novels" is silly, but rarely oppressive. It risks triviality more than conquest-justification.
  5.  **Malaria:** Medium-Low risk. Can be used to suggest tropical inferiority, but usually functions as a logistical constraint that applies to invaders and locals alike.
  6.  **Toba Supereruption:** Low risk. Too abstract to justify specific social hierarchies.
  7.  **Yersinia pestis:** Lowest risk. Biological vulnerability is universal. While plague has been weaponized rhetorically, the pathogen itself doesn't map neatly onto cultural superiority narratives in the way climate does.

  ***

  ### The Verdict

  You asked me to pick a side on the actor/condition question. Here it is: **You are right, and your roommate is wrong.**

  Non-human entities are **conditions**, not actors.

  Your roommate's phrasing ("the volcano reorganized European culture") is not just philosophically sloppy; it is historically dangerous. It commits a category error that smuggles intent into geology. A volcano does not "reorganize"; it erupts. Humans reorganize *in response* to the eruption. When you grant agency to the non-human, you inevitably subtract agency from the human. This is not a subtle distinction. In the case of the Irish Famine, treating the blight as the primary actor is exactly how you end up with a history that treats mass starvation as a natural disaster rather than a political choice.

  Your intuition about "metabolizing a shock" is the superior historical model. It keeps the mechanism visible. It forces you to ask why one society collapsed under Tambora's ash while another adapted. If the volcano is the actor, the variation is noise. If the volcano is a condition, the variation is the story.

  There is a defensible version of materialism that acknowledges constraints without granting agency. Coal didn't build the Industrial Revolution; humans used coal to build it. The difference is who gets the credit, and more importantly, who gets the blame. Keep humans behind the wheel.
