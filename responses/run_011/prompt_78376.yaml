  6.  **Final Polish:** Ensure the distinction between "Audit" (City knowing) and "Habituation" (Soul becoming) is sharp. This is the key to saving the paper. The City needs data; the Soul needs training. The Symposium provides both, but the *Legislation's* unique contribution is the data (since training can happen other ways, but controlled testing is unique).

      *Wait, one more check on Q3:* The fear drug tests *courage* (fear). Wine tests *moderation* (pleasure/shame). Does the text explicitly link the fear-drug logic to the wine logic? Yes, at 647d-e. The Athenian says we should use wine *as* a test (basanos). So the transfer is licensed.

