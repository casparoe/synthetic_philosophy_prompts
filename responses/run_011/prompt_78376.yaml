      *   **Para 4:** Institutional Evidence. Age limits, sober monitor, public setting. Analogy: Eligibility threshold, dose ceiling, examiner. Symposium = Inspection, not School.
      *   **Para 5:** Licensing Analogy. Structural parallel (exception zone, supervision). Disclaims harm reduction rationale.
      *   **Para 6:** Old Age/Chorus. Wine as remedy for sourness of old age/shame in performance. Claim: Double duty (Diagnosis + Repair). Repair depends on Diagnosis.
      *   **Para 7:** Objection (Habituation). Text *does* say practicing resistance makes one better. Reply: Repeated testing produces a "second-order state" (cognitive acquisition: knowing one held firm) vs. conditioning of appetitive part. Training is secondary, not primary.
      *   **Para 8:** Visibility of Virtue. Character not legible under ordinary conditions. Controlled stress reveals dispositions. Comparison to situationism (circumstances reveal dispositions, not replace them).
      *   **Para 9:** Conclusion. Permission is epistemic, not hedonic.

  3.  **Evaluate the Thesis (Philosophical/Textual Check):**
      *   *Is it simply false?* No. It's a provocative, defensible minority reading. The text *does* emphasize the testing aspect (the fear-drug analogy is strong evidence for the informational value). However, the text *also* explicitly links it to habituation (training against pleasure). The author acknowledges this but subordinates it. The thesis isn't "false," but it risks being "too strong" in its exclusion of habituation.
      *   *Key Tension:* Plato often sees testing *as* a form of training, and training *as* a form of testing. The distinction might be more analytic than ontological in the text.

  4.  **Address the 7 Specific Questions:**

      *   **Q1: Distinction (Para 3 vs. Para 7).** Does repeated testing collapse into training?
          *   *Thought:* Yes, functionally. If I test your courage repeatedly, you become habituated to the test. The author tries to save it via "cognitive acquisition" (knowing I held firm) vs. "appetitive conditioning." This is a bit thin.
          *   *Advice:* The distinction holds if framed as *primary intent* vs. *side effect*. But the "cognitive" vs. "appetitive" split needs more care. Plato thinks belief/knowledge affects the soul's order. A weaker version: The *institutional design* prioritizes information gathering for office-holding (Para 4) over moral improvement of the drinker. Cost: You lose the strong claim that it *doesn't* train, only that training isn't the *legislative purpose*.

      *   **Q2: Strongest Habituation Objection.**
