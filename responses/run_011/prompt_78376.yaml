      *   **Thesis:** The symposium is primarily a *diagnostic/testing* mechanism ("audit technology"), not a *habituation/training* mechanism. Wine is used to reveal character (informational), not build it (developmental).

  2.  **Analyze the Text (The Draft Section):**
