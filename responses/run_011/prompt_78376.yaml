          *   *Reason:* If the text explicitly makes training the *primary* function (teleology), the audit thesis becomes a secondary footnote. The whole paper rests on subordinating the explicit habituation claims to the implicit informational claims.

      *   **Q7: Structure (Para 6 placement).**
