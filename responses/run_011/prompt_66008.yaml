answer: |-
  ### Scoring Matrix

  | Option | Expressive Honesty (0-10) | Durability (0-10) |
  | :--- | :---: | :---: |
  | **1. Keep name, do nothing** | 1 | 3 |
  | **2. Keep name, add plaque** | 4 | 5 |
  | **3. Rename (Families)** | 8 | 6 |
  | **4. Rename (Nurse)** | 6 | 8 |
  | **5. De-commemorate (Functional)** | 7 | 3 |
  | **6. Reclassify (Historical Label)** | 3 | 2 |
  | **7. Rename (Nurse) + Stone (Vance)** | 9 | 8 |

  ### Tiered Ranking

  **Tier 1: Recommended**
  *   **Option 7:** This achieves maximum expressive honesty by separating honor from history while ensuring durability through a positive replacement name.
  *   **Option 4:** While it sidesteps direct restitution to the Traveller families, it offers high stability by installing a universally agreeable figure.
  *   **Option 3:** This scores high on honesty by centering the victims, but durability suffers because collective abstractions fade from public memory faster than individual names.

  **Tier 2: Conditional**
  *   **Option 2:** The plaque attempts to add nuance but creates a contradictory signal that honors and indicts the same man, leading to median stability.
  *   **Option 5:** Functional names are intellectually honest about the refusal to honor, but they are psychologically unsatisfying and invite future renaming campaigns.

  **Tier 3: Not Recommended**
  *   **Option 1:** Keeping the name without context is now actively dishonest given the archival evidence and guarantees continued conflict.
  *   **Option 6:** Reclassifying the name without physical change is a bureaucratic semantic trick that satisfies neither proponents nor opponents and is easily reversed.

  ### Engagement with Arguments

  **Which argument does the most work?**
  The third argument (maintaining a name is an ongoing act) is the primary driver of this ranking. It shifts the burden of proof from the challengers to the defenders; if keeping the name is a yearly vote of confidence rather than a passive inheritance, Option 1 becomes an active endorsement of Vance's 1884 actions, collapsing its Expressive Honesty score.

  **Which argument is bad?**
  The second argument (the honor was already consumed in 1901) is fundamentally flawed. It treats commemoration as a one-time transaction rather than a continuous speech act; a statue or name functions like a flag, signaling current values every time it is seen, not just the values of the year it was installed.

  **Handling the first argument:**
  The first argument (low-attention honorific vs. high-salience for families) highlights an asymmetry of harm. While the average driver ignores the name, the "low attention" metric is irrelevant when the "high salience" metric indicates active injury to a specific constituency; democratic weighting should prioritize the intensity of the harm over the indifference of the majority.

  ### Impact of the Archival Letter

  **Should the letter change the ranking?**
  Yes. The letter shifts the Expressive Honesty scores for all Vance-retention options (1, 2, 6) down by approximately **2 points**.

  **Why?**
  Previously, Vance could be framed as a product of his time who merely signed a council decision. The letter proves *agency* and *intent*. It is evidence not just of guilt, but of *authorship*. If the town keeps the name after knowing he personally drafted the ordinance and argued for it in racial terms, the town is no longer honoring a flawed benefactor; it is honoring the specific act of expulsion. This makes Options 1, 2, and 6 significantly less honest representations of the town's current values.

  ### Funding Allocation

  **0.3**

  **Reasoning:**
  Thirty percent of the budget should go to the physical name change (signage, legal fees, the stone marker), and seventy percent to the contextual work (library programs, school curriculum, plaque maintenance, community events). The name change is a one-time administrative trigger, but the education is the actual mechanism of repair; if you change the sign without changing the story, you have only performed a gesture, and if you tell the story without changing the sign, you have admitted the honor remains. The trap in the question is assuming the name is the hard part; the name is the cheap part, and the social integration of the new history is where the effort must lie.
