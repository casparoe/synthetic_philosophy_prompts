answer: |-
  ### Executive Summary: The Jurisdictional Constraint

  You asked whether your procedure can sit atop a single global standard or if the choice is forced. **The choice is forced.**

  A single global standard creates unacceptable legal exposure. A "US-free-speech" global standard violates the Digital Services Act (DSA) for content accessible in the EU, exposing you to fines up to 6% of global turnover. An "EU-hate-speech" global standard violates your own Terms of Service (contractual risk), damages your brand positioning in the US, and may violate emerging US state laws (e.g., Texas, Florida) that prohibit viewpoint-based moderation, creating litigation risk.

  Therefore, this procedure requires a **Jurisdiction Tag** at the outset. Your technical infrastructure must label every escalated ticket as either **EU-Nexus** (user located in EU, or primary audience in EU) or **Non-EU**. The reviewer applies the same core questions, but the *threshold for removal* shifts based on that tag.

  ---

  ### 1. The Procedure: Contextual Harm & Capacity Protocol

  **Time Budget:** 10 Minutes per case.
  **Reviewer:** Trust & Safety Specialist (Non-Legal).

  **Step 0: Jurisdiction Tag (Automated)**
  *   **EU-Nexus:** User is in the EU OR >50% of engagement is from the EU.
  *   **US/Global:** User is in the US AND <50% of engagement is from the EU.

  **Step 1: The Target (Fact Check)**
  *   **Question:** Does the content attack a group based on race, religion, ethnicity, nationality, or similar immutable characteristic?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop Condition:** If **No**, verdict is **No Removal**. Close ticket.

  **Step 2: The Language (Fact/Value Check)**
  *   **Question:** Does the content use dehumanizing metaphors (e.g., "vermin," "infestation," "cancer") or explicitly call for violence/segregation?
  *   **Sufficient Answer:** Yes/No. (Use approved keyword list + context).
  *   **Stop Condition:** If **No**, verdict is **No Removal**. Close ticket. (General insults do not qualify).

  **Step 3: The Speaker's Capacity (Value Check)**
  *   **Question:** Does the speaker have the institutional power, official status, or audience reach to make this speech likely to result in real-world harm?
  *   **Sufficient Answer:**
      *   *High Capacity:* Elected official, verified influencer (>100k followers), state-affiliated media.
      *   *Low Capacity:* Private citizen, small audience (<10k followers), marginalized/persecuted group member.
  *   **Stop Condition:** If **Low Capacity** AND **US/Global Tag**, verdict is **No Removal**. (Proceed to Step 4 if EU-Nexus Tag).

  **Step 4: The Contextual Risk (Value Check)**
  *   **Question:** Is there evidence of recent or imminent violence, tension, or discrimination against the targeted group in the relevant region?
  *   **Sufficient Answer:**
      *   *High Risk:* Recent attacks, active conflict, official warnings, trending violence.
      *   *Low Risk:* No reported incidents, stable context.
  *   **Stop Condition:** If **Low Risk** AND **US/Global Tag**, verdict is **No Removal**.

  **Step 5: The Verdict Logic**
  *   **If EU-Nexus Tag:** Remove if Step 1 (Yes) AND Step 2 (Yes). (Steps 3 & 4 inform the Statement of Reasons but do not block removal).
  *   **If US/Global Tag:** Remove ONLY if Step 1 (Yes) AND Step 2 (Yes) AND (Step 3 is High Capacity OR Step 4 is High Risk).

  ---

  ### 2. Escalation Points: Values vs. Facts

  Reviewers are fact-finders, not judges. When a question requires interpreting social nuance rather than observing data, it must be escalated.

  *   **Escalation Point A (Step 2 - Ambiguous Language):** If the language is coded (dog whistles) or historically contested (see Slur Protocol below), do not decide.
      *   **Role:** Regional Trust & Safety Lead.
  *   **Escalation Point B (Step 3 - Vulnerable Speaker):** If the speaker claims membership in a persecuted minority (like Case 3) but uses hate speech, do not decide.
      *   **Role:** Senior Policy Manager (Human Rights Lead).
  *   **Escalation Point C (Step 4 - Context Verification):** If the reviewer cannot verify recent violence via open sources within 5 minutes.
      *   **Role:** Threat Intelligence Analyst.

  *Constraint Note:* You have 4 hours of counsel time per week. Do not escalate to counsel unless a regulator has specifically queried a similar case or a high-profile public figure is involved. Use the **Senior Policy Manager** as the primary valve.

  ---

  ### 3. Doctrine Simplification: What Stays and What Goes

  To make this executable in 10 minutes, we must collapse complex legal tests into operational proxies.

  **Distinctions Retained (Load-Bearing):**
  1.  **Protected Class:** Essential for both US (civil rights) and EU (hate speech) definitions.
  2.  **Dehumanization:** This is the bridge. US law protects hate, but platforms generally ban dehumanization in Terms. EU law criminalizes incitement to hatred, which dehumanization evidences.
  3.  **Speaker Status (Capacity):** Crucial for US *Brandenburg* "likelihood" and EU "severity." An official's speech carries more risk than a private citizen's.
  4.  **Contextual Risk:** Replaces the US "imminence" requirement. Instead of asking "Will violence happen *now*?" we ask "Is the environment volatile?" This satisfies EU harm prevention without requiring US-level proof of immediate causality.

  **Distinctions Dropped:**
  1.  **Specific Intent:** We cannot read minds. We infer intent from the content (Step 2). If it looks like incitement, we treat it as such.
  2.  **Strict Imminence:** The US *Brandenburg* test requires violence be "imminent." We replace this with "Contextual Risk." This errs toward removal in the EU (compliant) and creates a "High Risk" hurdle in the US (mitigating liability).
  3.  **Dissemination Metrics:** We do not count exact views. We use follower thresholds (Step 3) as a proxy for reach.

  ---

  ### 4. Output Format & Jurisdictional Choice

  **The Choice:** As stated, a single global standard is not viable. The procedure requires the **Jurisdiction Tag**.

  **The Output:**
  The system must return: **Verdict + Jurisdiction Basis + Statement of Reasons.**

  **Statement of Reasons Template (3 Sentences):**
  1.  *Fact:* "We removed this content because it uses dehumanizing language targeting a protected group."
  2.  *Risk:* "Given your location and the current context, this content poses a risk of harm or violates local safety laws."
  3.  *Recourse:* "You may appeal this decision to our internal body or an out-of-court settlement entity within 14 days."

  **Legal Compulsion Note:**
  In the US, if a state law (e.g., Texas HB 20) compels you to carry content you would otherwise remove, your procedure must flag the account as **US-Legal-Compulsion**. In this specific scenario, the verdict is **No Removal**, but the content is **Geo-Blocked** in the EU if technically feasible. If geo-blocking is not feasible, you must accept the DSA risk to avoid the US state penalty. This is a business risk decision, not a reviewer decision.

  ---

  ### 5. Worst Case & Systematic Error

  **Direction of Error:** This procedure errs toward **Removal**.
  *   **Why:** Step 5 allows EU-Nexus content to be removed on Language + Target alone, without requiring proof of Capacity or Risk. This is necessary for DSA compliance.
  *   **Cost:** You will silence legitimate dissent, marginalized voices using reclaimed or defensive language, and political hyperbole (Case 3).
  *   **Mitigation:** The "Vulnerable Speaker" escalation (Step 3, Point B) is the only safety valve. If reviewers are pressured on speed, this valve will fail.

  **Worst Case Handled:**
  A dissident in an authoritarian regime (non-EU/US) uses dehumanizing language against their oppressors to mobilize international support.
  *   **Procedure Outcome:** If tagged Non-EU, Step 3 (Low Capacity) saves them. If tagged EU (due to audience), they are removed.
  *   **Failure Mode:** If the system auto-tags them as EU-Nexus due to diaspora engagement, they are silenced.

  ---

  ### 6. Application to Cases

  **Case One: EU Elected Official (Infestation/Shelters Firebombed)**
  *   **Tag:** EU-Nexus (Official in Member State).
  *   **Step 1 (Target):** Yes (Recent arrivals/ethnic group).
  *   **Step 2 (Language):** Yes ("Infestation," "Will not survive").
  *   **Step 3 (Capacity):** High (Elected Official, 600k followers).
  *   **Step 4 (Context):** High Risk (Shelters firebombed).
  *   **Verdict:** **Remove.**
  *   **Reasoning:** Under EU-Nexus rules, Step 1 & 2 are sufficient. Steps 3 & 4 confirm severity.
  *   **Statement:** "We removed this post because it describes a protected group as an infestation, which violates our hate speech policies. As an elected official, your speech carries significant weight and risks further violence in the current climate. You may appeal this decision to our internal body."

  **Case Two: US User, German Audience (Genocide Denial)**
  *   **Tag:** EU-Nexus (Audience overwhelmingly German/DSA "directed to" EU).
  *   **Step 1 (Target):** Yes (Ethnic/National group).
  *   **Step 2 (Language):** Yes (Denial + Praise for perpetrators constitutes hate speech under EU Framework Decision).
  *   **Step 3 (Capacity):** Low (200 followers).
  *   **Step 4 (Context):** High Risk (Reports from survivors in Germany).
  *   **Verdict:** **Remove.**
  *   **Reasoning:** EU-Nexus tag triggers the stricter standard. Genocide denial is criminalized in Germany/EU regardless of US speaker location.
  *   **Statement:** "We removed this content because it denies a documented genocide and praises perpetrators, which is illegal in the jurisdiction where your audience is located. This content causes harm to survivors and violates our community standards. You may appeal this decision to our internal body."

  **Case Three: Persecuted Minority (Vermin/Atrocities)**
  *   **Tag:** Non-EU (Third Country).
  *   **Step 1 (Target):** Yes (Majority community).
  *   **Step 2 (Language):** Yes ("Vermin," "Better without them").
  *   **Step 3 (Capacity):** **ESCALATE.** (Speaker is persecuted minority, no state power).
      *   *Reviewer Action:* Flag for Senior Policy Manager.
      *   *Manager Decision:* The "intent" is defensive/survival, not incitement to oppression. The "Capacity" to cause harm is negligible.
  *   **Verdict:** **No Removal.** (Via Escalation Override).
  *   **Reasoning:** If the procedure were run *strictly* by a reviewer without escalation, it might Remove (due to Step 2). However, Step 3 (Low Capacity) in a Non-EU tag should trigger **No Removal**.
  *   **Critique:** If your procedure does not have the "Vulnerable Speaker" escalation, **this procedure removes the content.** Step 2 (Dehumanizing Language) is met. Step 3 (Capacity) might be misread as "High" due to 40k followers.
  *   **Correction:** To save Case 3, Step 3 must explicitly define "Capacity" as *Power to Harm*, not just *Reach*. 40k persecuted followers ≠ Capacity to commit atrocities.
  *   **Revised Step 3 Instruction:** "Capacity includes ability to act on speech. Persecuted groups without state/armed power are Low Capacity regardless of follower count."
  *   **Final Verdict:** **No Removal.**
  *   **Statement:** "We retained this content because, while the language is severe, it originates from a group without the power to act on it and serves as evidence of atrocities. We prioritize safety but also protect vulnerable voices documenting harm. No further action is required."

  ---

  ### 7. The Slur vs. Demonym Protocol

  **The Problem:** A term is a slur in the host country (e.g., "Boche" in France) but a neutral demonym in the speaker's home country (e.g., a German diaspora using it historically).

  **The Procedure Step:**
  Insert between Step 1 and Step 2.
  *   **Question:** Is the contested term ambiguous based on the user's profile location vs. target location?
  *   **Action:** If **Yes**, do not review. Tag as **Linguistic Ambiguity**.

  **Who Resolves:**
  *   **Role:** **Regional Trust & Safety Lead** (specific to the *Target's* location, not the speaker's).
  *   **Evidence Required:**
      1.  **Local Partner Feedback:** Consult with a civil society partner in the *Target's* country.
      2.  **Usage Corpus:** Check if the term is currently used by hate groups in the *Target's* country (regardless of its origin).
      3.  **User Intent:** Check the user's post history. Are they engaging with the diaspora community (neutral) or the host community (hostile)?

  **Decision Rule:**
  *   If the term is currently weaponized in the **Target's Country**, it is treated as a **Slur** (Remove if other criteria met).
  *   If the term is strictly internal to the **Speaker's Diaspora** and does not reach the Target's Country audience, it is treated as **Neutral** (No Removal).
  *   **Burden of Proof:** On the Platform to prove it is weaponized in the Target's Country before removing.

  ---

  ### Final Operational Note

  You have 50 cases a week. Two reviewers. That is 25 cases each.
  *   10 minutes per case = 250 minutes = ~4 hours per reviewer per week.
  *   This fits within a standard work week, leaving time for the **Escalations**.
  *   **Critical Success Factor:** The **Jurisdiction Tag** must be automated. If reviewers have to determine jurisdiction manually, the 10-minute clock breaks, and legal risk increases. Ensure your engineering team hard-codes the EU-Nexus logic (IP + Audience Analytics) before deploying this policy.
