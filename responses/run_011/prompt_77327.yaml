  ### Largest unsatisfiable subset

  The largest subset of requirements that cannot be jointly satisfied in this context is {D1, D4, D7}. You cannot simultaneously maintain sufficient liquidity (D7), price multi-decade outcomes accurately (D4), and verify counterfactual accuracy (D1) in a small jurisdiction. Liquidity dries up on 25-year horizons because traders cannot lock capital for that long without excessive premiums, especially in a county of 300,000. Furthermore, verifying counterfactuals (D1) requires occasionally implementing "losing" policies to generate data, which reduces immediate efficiency and scares away liquidity providers seeking stable returns. In a thin market, the cost of exploration (to satisfy D1) overwhelms the capital available (D7), while the time horizon (D4) ensures that no verification occurs within the lifespan of the pilot or the traders' careers. This triad forms a structural impossibility for the proposed pilot.

  ### Most exclusionary requirement

  The single requirement that eliminates the most candidate designs is D4 (Temporal Alignment). Most prediction market designs assume resolutions occur within months or a few years. Financial instruments capable of pricing contingent outcomes 25 years out exist only for sovereign debt or massive corporate liabilities, not for local road maintenance strategies. Any design that relies on standard market mechanics fails here because the discount rate uncertainty over two decades swamps the policy signal. This requirement alone rules out standard futarchy, decentralized finance protocols, and most corporate prediction platforms, leaving only heavily subsidized, artificial markets or non-market forecasting methods.

  ### Three approaches against the list

  **Pure Futarchy**
  Pure futarchy fails catastrophically against this list. It violates D4 immediately, as no liquid market will form around 25-year county outcomes. It fails D1 because losing policies are never implemented, so the market never learns if its rejection was correct. It fails D3 and D7 because a small county cannot generate enough organic liquidity to resist the landowners' $250,000 distortion, and there is no clear fallback if the market price is nonsense. It also triggers D8, risking a legitimacy crisis if the board abdicates voting responsibility to a thin market. This approach is untenable.

  **Hybrid Model**
  A hybrid model, where market prices advise a board that retains override power, performs better but still struggles. It mitigates D8 (legitimacy) and D7 (fallback is built-in via the board). However, it does not solve D4; traders still face the 25-year horizon problem, so prices will remain noisy or non-existent. It partially addresses D1 if the board occasionally overrides the market to test counterfactuals, but this requires explicit political will to "waste" money on learning. It is viable only if the market is treated as one signal among many, not the decisive mechanism.

  **Deflationary View**
  The deflationary view, treating prediction markets purely as forecasting instruments without automatic adoption, satisfies the most requirements. It sidesteps D4 by allowing the county to subsidize contracts as information purchases rather than expecting efficient pricing. It resolves D1 by allowing the board to use the forecasts as data points while retaining the power to explore counterfactuals based on broader criteria. It neutralizes D3 and D7 because the financial stakes are capped by the information budget, not open-ended liability. It satisfies D8 completely. This approach admits the market is a tool for staff, not a replacement for governance, and is the only design compatible with the constraints of a small jurisdiction.
