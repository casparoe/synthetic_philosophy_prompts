answer: |-
  There is no single established term in media ethics or aesthetics that captures this specific structural asymmetry. You have isolated a mechanism that is usually lumped into broader debates about "accuracy" or "harm," but as you note, those frameworks miss the point. The wrong you are describing is not the lie itself (since the lie is admitted), nor the damage to reputation (since it can be flattering), but the *foreseeable monopolization of the cognitive baseline* due to distribution inequity.

  Here are the three nearest existing concepts, why they are relevant, and exactly where they fail to cover your case.

  ### 1. Brandolini's Law (The Bullshit Asymmetry Principle)
  *   **The Concept:** The amount of energy needed to refute bullshit is an order of magnitude bigger than to produce it.
  *   **Where it fits:** It perfectly describes the *mechanical* asymmetry you identified. It accounts for the reach differential (40 million vs. 40 thousand) and the effort differential (passive consumption vs. active correction).
  *   **Where it stops:** It is a heuristic about discourse and information flow, not an ethical category. It describes *why* the correction fails, but it does not assign moral weight to the person who *relies* on that failure. It doesn't capture the specific harm to a biographical subject or the ethical negligence of the creator who knows the law will apply.

  ### 2. Hyperreality (Simulacra)
  *   **The Concept:** A condition where the simulation of reality (the map) becomes more real to the population than the reality itself (the territory). The representation precedes and determines the perception of the real.
  *   **Where it fits:** It captures the "baseline setting" phenomenon you described. The film installs the image; the historical record becomes the footnote. The audience's "vivid view" is the hyperreal object.
  *   **Where it stops:** It is ontological and descriptive, not normative. It explains how the world *is*, not what the filmmaker *ought* to do. It lacks a component of agency or responsibility. A filmmaker can create a hyperreal image without it being an ethical violation in this framework; it's just the state of postmodern culture. It doesn't account for the *disclaimer* that is honest but ineffective.

  ### 3. Mnemic Injustice
  *   **The Concept:** A form of epistemic injustice where a person is wronged in their capacity as a subject of memory (either being wrongly remembered, or prevented from being remembered).
  *   **Where it fits:** This is the closest ethical neighbor. It acknowledges that the dead can be harmed through the distortion of their memory and that there is a moral duty regarding how the past is represented.
  *   **Where it stops:** Current literature on mnemic injustice focuses on the *content* of the memory (e.g., erasing a victim's suffering) or the *right* to be remembered. It does not typically account for the *distributional mechanics* of the error. It treats the falsehood as the wrong, whereas you are identifying the *irreversibility of the falsehood due to reach* as the wrong.

  ***

  ### The Coinage: Epistemic Preemption

  Since no existing term tightens the focus on the *structural reliance on correction failure*, I propose the term **Epistemic Preemption**.

  **Definition:**
  *Epistemic Preemption* occurs when an agent introduces a fictionalized narrative about a real subject into the public sphere, foreseeing that the narrative's distribution reach and salience will establish a cognitive baseline that corrective facts cannot dislodge, and relying on that foreseeability to excuse the distortion.

  **Key Components:**
  1.  **Admitted Fiction:** The agent does not claim the invention is fact (distinguishing it from fraud or disinformation).
  2.  **Baseline Capture:** The primary effect is not necessarily belief in the specific lie, but the installation of a narrative framework that becomes the default context for the subject.
  3.  **Foreseeable Futility:** The agent knows (or should know) that the mechanisms of correction (academic history, journalism) operate at a lower velocity and volume than the mechanism of invention (drama).
  4.  **Justificatory Reliance:** The agent uses the admission of fiction ("it's just a movie") as a shield, knowing the shield will not reach the same audience as the sword.

  **The Edges (Your Specific Questions):**

  *   **Does it apply to a wholly fictional character who shares a name with a real person?**
      *   **No.** *Epistemic Preemption* requires the usurpation of an existing epistemic slot. If the character is wholly fictional, there is no prior baseline to preempt. The audience is not replacing a historical truth with a fiction; they are filling a void. Unless the marketing explicitly implies identity (e.g., "Based on the life of..."), the shared name is coincidence or trademark issue, not epistemic preemption. The harm requires the displacement of a specific historical truth.

  *   **Does it apply when the invention runs in the flattering direction?**
      *   **Yes.** This is a crucial boundary. If the harm were solely reputational (libel/defamation), flattery would be exempt. But *Epistemic Preemption* is a harm to the *record*, not just the *reputation*. It corrupts the historical commons. A flattering lie makes the subject harder to know truly, just as a damaging lie does. It turns the person into a myth rather than a human. The ethical violation is the degradation of public knowledge, regardless of the valence of the distortion.

  **Why this term works for your context:**
  It moves the debate away from "Artistic Freedom vs. Truth" (which assumes a fair fight) to "First-Mover Advantage in Knowledge." It allows you to argue that the disclaimer is not an ethical discharge, but part of the preemptive mechanism: it clears the creator of *lying*, while the distribution clears them of *correction*.
