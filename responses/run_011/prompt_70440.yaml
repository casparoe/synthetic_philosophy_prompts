  I'm a partner at a small fund — about $60M, three of us, one book of concentrated private and public positions. Every risk call we've ever made went through Priya, and Priya is unreachable for the next two weeks (parent in the hospital, phone off). I have to bring a decision to a Thursday meeting. So I need two things from you: what she'd say, and what we should say if we want to stay consistent with our own record.

  Her calls over the last five years, as best I can reconstruct them:

  - A "steady income" strategy: roughly +3% a year, with about a 1-in-200 annual chance of losing 90% of the fund. The 1-in-200 came out of our own model. Rejected.
  - A 60/40 double-or-nothing bet at 10% of the fund. Accepted.
  - The exact same 60/40 bet at 25% of the fund. Rejected — even though, by her own arithmetic, 25% was still a bet worth taking over not taking it. She just wouldn't be past the best size.
  - Three positions that each bled slowly on their own; she turned down every one of them separately. But what each lost in ordinary times it made back in exactly the state where another one paid. Approved as a package.
  - Two years ago we were heading into a lender covenant we couldn't renegotiate, with one date by which we had to be above a number. She recommended a stake considerably larger than anything she'd ever signed off on, defended it, and we cleared the number.
  - A partner wanted 15% of the fund into a company in the sector his own career and deferred comp sit in. The standalone numbers cleared easily. Rejected.
  - An illiquid position with a good long-run profile that we'd have been locked into for seven years, with no way out if the first two went against us. Rejected.
  - A one-off angel deal: half chance of 5x on the money, half chance of losing it all, at 50% of the fund. Rejected.
  - A different one-off where there was genuinely nothing after it — a position we were exiting anyway — and she let the size run well past what a house estimate would normally allow. Accepted.
  - Separate pattern I only noticed recently: when the odds came from a deep liquid market rather than from our own model, she got a lot more relaxed about size.

  New case. The fund is being wound down. In exactly two years the capital gets distributed and we stop existing — no covenant, no target number, nobody needs a specific amount, the partners just want the biggest pot at the end. The opportunity: put 40% of the fund into a deal that in two years either returns +120% on the money (we think 55%) or loses 60% of it (45%). The 55% is a house estimate; the model's record on this deal type is decent but the error bars are wide. Two complications: our single largest remaining position is in the same industry, and two of the three partners have most of their net worth in the fund, one of whom also owns a supplier in that industry.

  What I want:

  1. Bottom line in the first sentence: does Priya accept, accept at a smaller size, or reject — and what do we do Thursday? Commit to one. I know its close; I'd much rather have a definite call with reasons than a menu I have to choose from, and if you think it's 55/45, tell me the 55.
  2. Then the rules she could plausibly be running. More than one fits everything above, and I want them written as actual decision procedures — a quantity she's maximizing or a constraint she's checking, not a vibe. Include at least one on which the answer to the new case flips.
  3. For each rule, what it says about the new case, and show the arithmetic where there is any.
  4. Which of her past calls is the closest analog to this one, and what exactly makes it closest rather than merely similar.
  5. If her record genuinely doesn't determine this — I suspect it doesn't — say what principle we'd be adopting with each choice. I want to know which one I can live with the next time a deal like this shows up.
  6. One further case, described concretely with numbers, that woud separate the surviving rules. Just one. Pick the most informative one you can construct, and say which rule predicts which verdict on it.

  No preamble, don't restate the question back at me, first sentence is the verdict. Don't bother with references or whose theory is whose — I don't care about that, I care about getting Thursday right.
