  **1. The Rules Priya Is Running**

  *   **Rule 1: Model-Discounted Kelly Criterion.** She calculates optimal position size using Expected Log Wealth maximization, but applies a haircuts to probabilities derived from internal models versus liquid markets.
      *   *Procedure:* $Size^* = \frac{p(b+1) - 1}{b} \times \text{ConfidenceFactor}$. If odds are internal model, $\text{ConfidenceFactor} \le 0.5$. If market-implied, $\text{ConfidenceFactor} \approx 1.0$. Hard cap at 25% for binary model bets.
      *   *New Case:* Internal model (wide error bars) triggers 0.5 discount. Binary outcome triggers 25% hard cap. 40% size violates the cap. **Verdict: Reject.**
  *   **Rule 2: Total Economic Exposure Constraint.** She aggregates fund positions with partners' external human capital and financial wealth exposed to the same risk factor.
