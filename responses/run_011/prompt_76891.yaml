  **The Conduit**

  **I.**

  The morning began with a polite fiction. In the waiting room, a mother asked if the doctor spoke Spanish. Elena said yes, though the doctor spoke only enough to greet and dismiss. It harmed no one; it profitably calmed the woman's shaking hands. Elena sat on the vinyl chair, the smell of bleach and old coffee rising from the floor tiles. She adjusted her badge. Her mouth was a pipe; water flowed through it. She did not taste the water. She watched the clock. Six a.m. The lights hummed.

  **II.**

  In Trauma Two, a young man refused to lift his gown. He whispered to Elena in Mixtec. *Tell him I am modest.* Elena rendered it: *He is concerned about modesty.* The doctor sighed, turned away. The boy kept his pants on. It was a lie of omission regarding the injury's visibility, but it protected his bodily purity from the gaze of strangers. Elena stood by the wall, hands clasped. She did not look at the blood on the sheet. She focused on the rhythm of her own breathing. In, out. The pipe remained clear.

  **III.**

  Billing came next. An elderly man claimed his insurance was active. Elena knew the card was expired; she had seen the red flag on the screen. He looked at her, eyes wide. *Say it is active,* his look begged. She rendered his words: *My insurance is active.* She did not add *he believes.* It protected his property from immediate seizure, his dignity from the clerk's sneer. The clerk typed. The system would catch it later. Elena walked to the next ward. The linoleum squeaked under her shoes. She thought of her rent, due Friday.

  **IV.**

  The stakes tightened in Pediatrics. A father begged her to soften the prognosis. *Tell her he will walk again.* The chart said paralysis was permanent. The father's voice cracked. *Please. For her hope.* Elena looked at the mother, then the doctor. The doctor waited. The worldly consequence hung heavy: false hope could derail rehabilitation, waste resources, break hearts later. But the father needed to please his wife, to please himself. Elena rendered the words: *He believes his son will walk again.* She added *he believes*. It was to please others. The doctor nodded, noting the psychological state. The father wept with relief. Elena felt the weight of the future in her throat. She swallowed it.

  **V.**

  In the break room, a nurse asked if Dr. Aris was on floor four. Elena knew he was in the cafeteria, avoiding a confrontation. *He is unavailable,* Elena said. It was technically true. She enjoyed the small power, the secret knowledge. It was a lie for the pleasure of the deception itself, a tiny spark of control in a building where she controlled nothing. She ate her sandwich. The turkey tasted like salt. She watched the nurse walk away, frustrated. The spark died. She wiped crumbs from her lap.

  **VI.**

  The afternoon brought the custody dispute. A man claimed he was the uncle. The mother, unconscious, had named him guardian. The hospital lawyer needed verification. The man whispered: *Say I am the brother.* It would injure the absent father's rights but benefit the children's immediate placement. Elena rendered: *He says he is the brother.* She did not verify. The lawyer nodded. The children were placed. The harm was done to an absent man; the benefit to the children was immediate shelter. Elena signed the log. Her pen scratched loud in the quiet room. She did not look at the man's face.

  **VII.**

  Near shift change, a patient asked her to tell his wife he was dead. *Tell her I am gone. She will not come.* He wanted to vanish. It would injure her profoundly and benefit no one but his own desire for escape. Elena looked at him. He was stable. He was cowardly. She rendered his words to the nurse: *He requests no visitors.* She did not render the reason. The wife would come tomorrow. She would be injured then. The man gained nothing but a night of silence. Elena packed her bag. The sun was setting behind the glass blocks. The light was orange and sickly.

  **VIII.**

  The chaplain caught her at the elevator. A dying man, Catholic, wanted last rites but was afraid of hell. *Ask him if he is forgiven,* the chaplain said. *Tell him yes.* The man looked at Elena. *Say it.* The doctrine was precise; forgiveness required contrition, not assurance. To say *Yes* was to alter the teaching. It was the gravest thing. But the man was dying. The stakes were eternal, yet here, in the hallway, it looked like a formula. *Tell him yes,* the chaplain pressed. *Just the word.* Elena looked at the man. He needed peace, not theology. She turned to the patient. She rendered the chaplain's question: *Do you seek forgiveness?* The man nodded. Elena turned back to the chaplain. She said: *He seeks it.* She did not say *God grants it.* She did not say *Yes.* She stood in the silence between the question and the answer. The chaplain nodded, hearing what he wanted. The man closed his eyes, hearing what he needed. Elena stepped into the elevator. The doors closed. She did not know if she had spoken.

  ***

  **Commentary**

  The story takes liberties with the strict ordering of Augustine's eight grades, particularly regarding grades 6–8. Augustine's hierarchy is not always consistent across *De Mendacio* and *Contra Mendacium*; some manuscripts place lies protecting life (Grade 8) as less sinful than those protecting property (Grade 6), while others invert this. I prioritized the prompt's instruction to end with religious doctrine (Grade 1) and begin with "harm nobody/profit somebody" (Grade 8), interpolating the middle grades to fit the hospital setting. The "pleasure of lying" (Grade 4) is notoriously difficult to dramatize without caricature; I rendered it as a small assertion of control to keep it grounded.

  The ending exploits the "seam" in Augustine's criterion: the distinction between *enuntiatio* (statement) and *voluntas fallendi* (will to deceive). Elena renders the patient's desire accurately ("He seeks it") but omits the chaplain's requested assurance ("Yes"). Augustine argues that concealment (*occultatio*) is not lying, yet if the intent is to induce a false belief (that the chaplain granted absolution), a strict Augustinian might argue the *will* constitutes the double heart, regardless of verbal accuracy. A careful defender would claim Elena lied because she intended the chaplain to believe a theological certainty she did not affirm. However, because she spoke truth ("He seeks it"), the text leaves it unsettled whether her heart was double or merely silent.

  Your characterization of Augustine is strong, though the claim that he "permits concealment" without qualification is contested; he permits it only if it does not imply a falsehood. Finally, verify the grade ordering in your specific syllabus text, as scholarly editions vary on whether lies saving lives are Grade 7 or 8.
