      *   *Move 3 (Aisha):* Moral uncertainty doesn't mean ignore. Evidence for sentience (nociceptors, avoidance, analgesics, trade-offs) distinguishes insects from microbes.
      *   *Move 4 (Marcus):* Evidence cuts both ways. If sentient, wild life is net negative (suffering). Arithmetic implies reducing population is good. Accuses Aisha of inconsistency.
      *   *Move 5 (Aisha):* Distinction between capacity to suffer vs. net welfare of life. Focus on anthropogenic harm (pesticides), not wild suffering. No parity between reducing suffering and reducing numbers.
      *   *Move 6 (Marcus):* If net welfare sign is unknown, EV term is unestimated. Declining populations (status quo) might be good if life is net negative. Accuses Aisha of cherry-picking arithmetic.
      *   *Move 7 (Aisha):* Value is incidence of bad states, not number of beings. Net-positive life justifies existence.
      *   *Move 8 (Marcus):* "Net-positive" is also uncalibratable. Back to square one: guessing signs vs. refusing to budget based on guesses.

  3.  **Drafting Responses to Sub-questions:**

      *   **(a) Rate the 8 Moves:**
          *   *Move 1:* Strong logic on EV, but assumes the inputs are valid. *Rating:* Mostly Right (logic holds, inputs debatable).
