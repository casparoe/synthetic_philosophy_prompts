      *   *Check:* Did I explain the "finite universe" point clearly? *Correction:* Make sure to emphasize that in a finite universe, checking non-black non-ravens *exhaustively* proves the hypothesis, so each check contributes *something*.
      *   *Check:* Is the Bayesian math too heavy? *Correction:* Keep it conceptual. Focus on the ratio of $P(E|H)$ vs $P(E|\neg H)$.

  7.  **Final Polish:** Ensure the distinction between "qualitative" (yes/no) and "quantitative" (degree) is clear, as this is where the passage gets Hempel wrong. Ensure the distinction between "confirmation" and "proof" is clear regarding Hume.

