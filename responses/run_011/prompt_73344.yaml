answer: |-
  Here is the restatement of the philosophical exchange using the vocabulary of the shop floor, followed by the residue report you asked for.

  ### Part I: The Exchange Translated

  **1. The Claim (Supererogation)**
  *   **The Philosophical Claim:** Some acts are good and praiseworthy but not required. You are not blameworthy for skipping them.
  *   **Closest Counterpart:** **Discretionary Effort.** This is the work a person chooses to do that sits outside the job description. It is the extra lift, the cleanup nobody asked for, the mentorship of a new hire. It is thanked, not mandated.
  *   **What Had to Be Bent:** In the shop, discretionary effort is usually performed in the context of an exchange (wage for labor), whereas the philosophical claim assumes no underlying contract. I had to treat the "moral law" as if it were a management directive that somehow lacks enforcement power.
  *   **What Is Lost:** The concept of *moral worth* detached from utility. On the floor, if you work to rule and the place falls apart, the discretionary work is revealed as functionally necessary. In the philosophy, the act can remain "optional" even if it is functionally critical, provided the cost to the agent is high enough. The shop floor cares about the outcome (production); the philosophy cares about the agent's freedom.

  **2. The Objection (The Collapsing Argument)**
  *   **The Philosophical Objection:** If an act produces massive good at low cost to the doer, calling it "optional" is a polite excuse. It should be duty.
  *   **Closest Counterpart:** **Scope Creep via Efficiency.** This is when management argues that because a task takes only thirty seconds and keeps the line running, it effectively belongs in the classification. If you don't do it, you are hindering production. The "genteel excuse" is the worker saying, "That's not in my description," while the company says, "It's necessary for the job to exist."
  *   **What Had to Be Bent:** This relies heavily on the presence of an **employer** who benefits from the labor. In morality, there is no single beneficiary collecting the "profit" of the good deed. I had to treat "The Good" as if it were "Production Targets."
  *   **What Is Lost:** The adversarial nature of the shop. In the plant, resistance to scope creep is collective (the Union). In the moral objection, the pressure comes from the logic of the outcome itself, not a boss trying to save money. The objection treats the moral agent as a resource to be optimized, which is exactly how management treats us, but philosophy usually claims to treat humans as ends in themselves.

  **3. The Replies (Defending the Category)**
  *   **The Philosophical Reply:** Agents have a right to their own lives and interests. Duty has a limit; beyond that limit, sacrifice is voluntary.
  *   **Closest Counterpart:** **Defending the Classification.** This is the grievance argument: "I was hired as a Machinist, not a Janitor." It relies on the integrity of the boundary. If the boundary moves every time the work is easy, the description means nothing.
  *   **What Had to Be Bent:** This assumes a **negotiated agreement** exists to appeal to. In morality, there is no signed contract defining where "duty" ends and "saintliness" begins. I had to treat "human autonomy" as if it were a "job classification" protected by a higher authority.
  *   **What Is Lost:** The mechanism of enforcement. On the floor, if management violates the classification, I file a grievance and an arbitrator can force them back. In morality, if society demands you be a saint, there is no arbitrator to file against. The "right" to be ordinary is unenforceable.

  ***

  ### Part II: Residue Report

  You asked me to test your suspicion: that the "Praise Ratchet" (where today's extra effort becomes tomorrow's baseline) proves the distinction cannot hold. You want to know if this is a failure of your vocabulary or a failure of the distinction itself.

  **The Verdict:**
  The residue indicates the **distinction itself is less stable than it first looks.** It is not merely a limitation in the way you talk about work. The "Ratchet" you describe on the floor is not a bug in labor relations; it is a feature of how social expectation functions, and it operates in morality exactly as it does in the plant.

  **The Evidence:**
  In your vocabulary, the instability comes from **Past Practice**. A favor granted three times becomes binding. In the philosophical distinction, the instability comes from **Precedent**. If one person runs into the burning building, the social expectation shifts. The next person standing outside looks less like someone exercising their right to safety and more like a coward.

  The philosophers try to hold the line by saying, "No, the second person is still within their rights." But your experience tells you that rights on paper do not stop pressure in practice. If the "Good" is defined by outcome (saving the building), then anyone who *can* save it at low cost will eventually be expected to do so. The category of "optional good" leaks into "duty" because the community (like management) has an interest in maximizing the good (like production).

  **Why the Vocabulary Isn't to Blame:**
  Your vocabulary is actually *more* honest than the philosophical one. You admit that if people work to rule, the place falls apart. You admit that past practice binds you. The philosophers often pretend that moral duty is static, like a law of physics. You know that duty is dynamic, like a negotiation. Your vocabulary captures the *pressure* that collapses the distinction. Their vocabulary often hides it behind words like "praiseworthy" to pretend the pressure isn't there.

  **What Must Change for the Distinction to Hold:**
  To stop the Ratchet, the distinction requires a **Hard Boundary** that is immune to precedent.
  1.  **In the Shop:** This would require a contract clause stating that *no* amount of past practice can alter the job description, and *no* amount of praise can imply expectation. (In reality, this is almost impossible to enforce, because managers talk and workers listen).
  2.  **In Morality:** This would require a recognized **Right to Moral Mediocrity**. It would mean asserting that a person has a valid claim to *not* be a hero, even if being a hero is easy and saves a life, without any stain on their character.

  **The Cost to the Defenders:**
  If they make this change, they lose **Moral Leverage.**
  Currently, the distinction allows them to say, "You aren't *required* to do it, but you *should*." This keeps the pressure on. It allows society to guilt-trip the agent without accusing them of a crime.
  If they institute a Hard Boundary (a Right to Mediocrity), they must accept that the person who walks past the drowning child (assuming low risk) is not just "not blameworthy," but is occupying a moral space equal to the rescuer. They cannot say the rescuer is "better." They can only say the rescuer is "different."

  This costs them the ability to encourage virtue. It turns morality into a strict minimum wage: you pay what is owed, and nothing more is expected. Most defenders of the category want to encourage the extra effort, so they cannot afford to make the boundary hard enough to stop the Ratchet.

  **Conclusion:**
  You are right. The Ratchet operates in both places. The distinction leaks because human communities, like management, always seek to optimize output. To seal the leak, you would have to value the agent's freedom so highly that you accept a lower total of "good" in the world. Most philosophers, like most companies, are unwilling to pay that price. They want the option to remain optional in theory, but they rely on the Ratchet to make it mandatory in practice.
