answer: |-
  ### I. The Shape of the Problem

  You are asking for a principle of *restricted composition* applied to aesthetic objects. In classical mereology, the Special Composition Question asks: *Under what conditions do some things compose a further thing?* The standard answers are:

  1.  **Universalism:** Any collection of things composes a whole. (Predicts V3 and V4 are novels. You reject this.)
  2.  **Nihilism:** Nothing composes a whole; there are only simples. (Useless to you; you must print a book.)
  3.  **Contact/Fastening:** Things compose a whole if they are physically connected. (Predicts V1 and V4 are identical, as both are files/pages. You reject this.)
  4.  **Functional Unity:** Things compose a whole if they function together. (Closest to your intuition, but struggles with V2, where the function is unchanged by the cat.)

  **The Analogy Break**
  You suspect the analogy between a novel and a metaphysical composite object (like a table) breaks down. You are correct. A table is a physical aggregate; its parts exist independently of the concept "table." A novel is an *intentional* object. Its parts (chapters, vignettes) exist as text, but their status *as parts of the novel* depends on a semantic relation that does not exist in the physical world.
  *   **V1 vs. V4:** You claim that in both cases, "the only thing the parts have in common is that they sit next to each other." This is the crux. In V1, they share a street and a century. In V4, they share nothing. Your intuition correctly identifies that *thematic proximity* acts like *physical contact* in mereology. A principle based solely on the container (the file, the binding) will fail because it cannot distinguish the street (V1) from the accident (V4).
  *   **V2 (The Cat):** This is your strongest challenge to classical mereology. Classical composition is all-or-nothing. You feel the cat makes the book *more* of a book. This suggests composition might be a matter of degree, or that the *strength of the bond* affects the *certainty of the verdict*, even if the ontology is binary.
  *   **V7 (The Brother):** This is not merely composition; it is *persistence*. You are asking when the parts compose *this* novel. Removing the brother changes the identity of the whole. This implies the novel has an essence, and some parts are essential to that essence while others are accidental. A mereological sum has no essential parts; remove a leg from a table, it is still a table (mostly). Remove the brother, it is a different novel.

  **The Argument from Vagueness**
  If V2 is correct (that the cat makes it "unmistakably" one, whereas before it was "arguably" one), then there is no sharp boundary where composition begins. There is a spectrum of cohesion. If composition is vague, then any precise principle I offer you will necessarily misdescribe the phenomenon at the margins. However, you need to send a manuscript to a printer. You need a binary decision (Print/Do Not Print) derived from a potentially vague ontology.

  ### II. Candidate Principles

  Here are three precise principles. Each attempts to capture your verdicts, but each demands a cost.

  #### Candidate 1: The Principle of Semantic Interdependence
  **Statement:** A set of texts composes a single novel if and only if the semantic value of any constituent text is altered by the removal of any other constituent text.
  *   **Clause A (Semantic Value):** Captures V1 (vignettes illuminate the street) and V5 (sources illuminate the character).
  *   **Clause B (Removal Test):** Captures V7. Removing the brother changes the meaning of the whole; removing scattered sentences does not significantly alter the semantic value of the remaining structure.
  *   **Clause C (Constituent Text):** Excludes V6 (Acknowledgements). Their removal does not alter the semantic value of the story.

  **Analysis:**
  *   **Captures:** V1, V5, V6, V7 (mostly).
  *   **Struggles with:** V2. The cat word alters the text, but does it alter the *semantic value* of the other vignettes? If the cat is trivial, Interdependence says it doesn't matter. But you feel it matters. This principle treats the cat as noise, whereas you feel it is glue.
  *   **Struggles with:** V8. A collaborator's chapter might be semantically independent. If it stands alone, Interdependence says it's not part of the novel. But if intermingled (V8b), the sentences depend on each other for flow. This captures the intermingling intuition well.
  *   **Judgment Call:** "Semantic value" is a judgment call. It wears the clothes of a rule but requires interpretation.

  #### Candidate 2: The Principle of Authorial Delimitation
  **Statement:** A set of texts composes a single novel if and only if the author performs a singular aesthetic act of framing that designates them as a unified gesture, distinct from mere aggregation.
  *   **Clause A (Singular Aesthetic Act):** Captures V1 (written *for* this book) and V3 (two finished novels are two acts, not one).
  *   **Clause B (Distinct from Aggregation):** Captures V4. Saving drafts in a file is housekeeping, not an aesthetic act.
  *   **Clause C (Framing):** Captures V6. The epigraph is framed as part of the aesthetic gesture; acknowledgements are framed as external apparatus.

  **Analysis:**
  *   **Captures:** V1, V3, V4, V6.
  *   **Struggles with:** V2. The author did not perform a *new* framing act by changing one word per vignette. Yet the status of the object changed for you. This principle makes composition entirely dependent on the author's fiat, ignoring the internal texture of the work.
  *   **Struggles with:** V7. Framing doesn't explain why cutting the brother destroys the novel while cutting scattered sentences does not. Framing is about the boundary, not the internal necessity.
  *   **Judgment Call:** "Aesthetic act" is a judgment call. It relies on your own sense of what counts as framing versus housekeeping.

  #### Candidate 3: The Principle of Cohesive Field Strength
  **Statement:** A set of texts composes a single novel if and only if the density of internal references (thematic, verbal, or structural) exceeds a threshold required to sustain a single interpretive context.
  *   **Clause A (Density of References):** Captures V2. The cat increases the density of verbal reference, strengthening the field.
  *   **Clause B (Single Interpretive Context):** Captures V1 and V5. The street or the character provides the context.
  *   **Clause C (Threshold):** Acknowledges V3 and V4. Two novels in one volume do not share a context; they have two thresholds.
  *   **Clause D (Structural References):** Captures V7. The brother's chapter is a high-density node; removing it collapses the context. Scattered sentences are low-density; removing them leaves the context intact.

  **Analysis:**
  *   **Captures:** V1, V2, V5, V7, V8.
  *   **Struggles with:** V6. An epigraph often has no internal references *from* the text *to* it. It is external. Yet it is part of the novel. This principle might exclude paratext that doesn't reference the text.
  *   **Struggles with:** V3. If the threshold is low, two novels in one volume might accidentally compose one novel if they share a theme. The principle needs a "negative clause" to prevent accidental unity.
  *   **Judgment Call:** "Threshold" and "Density" are judgment calls. This principle explicitly admits degrees (Field Strength), which aligns with your V2 intuition but violates classical binary mereology.

  ### III. Testing on Unsettled Cases

  Here is how the three candidates handle your four new cases.

  **Case 1: One sentence reprinted on 400 pages, altered by one word on each page.**
  *   *Principle 1 (Interdependence):* **No Novel.** The removal of page 50 does not alter the semantic value of page 51. They are independent repetitions.
  *   *Principle 2 (Delimitation):* **Novel.** If you frame it as a single gesture (e.g., a conceptual art piece), it is a novel. The act of framing creates the unity.
  *   *Principle 3 (Cohesive Field):* **Borderline.** The verbal repetition creates high density, but the lack of progression lowers the "interpretive context." It likely fails the threshold for *narrative* cohesion, but might pass for *poetic* cohesion.

  **Case 2: Completed novel + Father's chapter (unchanged, no connection).**
  *   *Principle 1 (Interdependence):* **Not Part.** The father's chapter is semantically independent. It composes a volume, not a novel.
  *   *Principle 2 (Delimitation):* **Part.** If you frame it as a tribute within the book, your aesthetic act makes it part. If you frame it as an appendix, it is not. The principle forces you to decide on the framing.
  *   *Principle 3 (Cohesive Field):* **Not Part.** It adds no density to the field. It is noise.

  **Case 3: Two novels, ten years apart, one shared minor character.**
  *   *Principle 1 (Interdependence):* **Not One Novel.** Reading Novel B does not alter the semantic value of Novel A significantly.
  *   *Principle 2 (Delimitation):* **Not One Novel.** They were framed as two separate acts ten years apart. Merging them now requires a new framing act (e.g., "The Complete Saga").
  *   *Principle 3 (Cohesive Field):* **Not One Novel.** One character is insufficient density to sustain a single interpretive context across two independent plots.

  **Case 4: Planned but unwritten novel.**
  *   *Principle 1 (Interdependence):* **No.** Text does not exist; semantic value cannot be assessed.
  *   *Principle 2 (Delimitation):* **Yes/No.** If the "aesthetic act" is mental, it exists. But without the framing being public/material, it is not a novel, only a concept.
  *   *Principle 3 (Cohesive Field):* **No.** No text, no density.

  ### IV. The Cost of Admission

  You asked which verdicts you must surrender. There is no free lunch.

  **If you choose Candidate 1 (Interdependence):**
  *   **Surrender V2.** The cat cannot change the composition status if the semantic interdependence is unchanged. You must accept that the cat makes the book *better* or *more coherent*, but not *more of a book*.
  *   **Surrender V6 (Epigraph).** Unless the text references the epigraph, the epigraph is semantically independent. You must classify it as paratext, not text.
  *   **Keep:** V1, V3, V4, V5, V7, V8.
  *   **Recommendation:** This is the most robust metaphysical principle, but it treats the novel as a machine of meaning. It fails to capture the *feeling* of V2.

  **If you choose Candidate 2 (Delimitation):**
  *   **Surrender V7.** If framing creates the object, then cutting the brother's chapter is just a new framing act. The novel survives as long as you say it does. This undermines your strong intuition that the brother is *essential*.
  *   **Surrender V4 (partially).** If you decide the file *is* the frame, the drafts become a book. You must rely on your internal distinction between "housekeeping" and "framing," which is not in the principle itself.
  *   **Keep:** V1, V2, V3, V6.
  *   **Recommendation:** This gives you the most authorial power but the least objective constraint. It makes "novel" whatever you say it is, which may feel like cheating given your struggle.

  **If you choose Candidate 3 (Cohesive Field):**
  *   **Surrender Classical Logic.** You must accept that composition comes in degrees. There is no sharp line where "pages" become "novel." There is only a threshold of confidence.
  *   **Surrender V3 (potentially).** If the two novels in one volume share a theme, this principle might force you to call them one novel. You need a clause about *discontinuity* to save V3.
  *   **Keep:** V1, V2, V5, V7, V8.
  *   **Recommendation:** This is the most honest to your actual experience (especially V2 and V7), but it is the least precise. It replaces the Special Composition Question with the Special Cohesion Question.

  **Which should you surrender?**
  You should surrender the demand for **binary composition** (V2). Your intuition in V2 is the most philosophically interesting and the most damaging to a strict rule. The feeling that the cat makes the book "unmistakably one" suggests that *unity* is a property that varies in intensity. A principle that demands a yes/no answer will always violate V2. I recommend adopting Candidate 3 but accepting that the "threshold" is a pragmatic cutoff, not an ontological boundary.

  Regarding V4 (The File): You must clarify your own verdict. In V1, the vignettes share a street. In V4, they do not. Your claim that "In both cases the only thing the parts have in common is that they sit next to each other" is false. V1 has thematic adjacency. V4 does not. Candidate 3 saves this distinction: V1 has high field density (street/time); V4 has zero. You do not need to surrender V1 or V4, but you must stop claiming they are metaphysically identical cases. They are not.

  ### V. The Treatment of Vagueness

  You asked for the right treatment of the vagueness. Here is the honest account:

  **1. Is there a sharp boundary?**
  No. If V2 is valid (that composition can be "more" or "less" unmistakable), then there is no sharp boundary. There is a continuum of cohesion. Any principle that posits a sharp boundary (like Candidate 1 or 2) is a *precisification*—a useful fiction imposed on a vague reality.

  **2. Are the judgments indeterminate?**
  Yes. There are borderline cases where it is neither true nor false that the pages compose a novel. Your struggle with the manuscript for four years is evidence of this ontological indeterminacy. The object itself is not yet determinate.

  **3. Does one-book-hood come in degrees?**
  Yes. "Novel" is a vague predicate like "heap" or "bald." A manuscript can be 0.8 of a novel.

  **4. What follows for a working novelist?**
  This is the crucial pivot. Metaphysically, composition may be vague. Practically, printing is binary.
  *   **The Pragmatic Cutoff:** You must impose a sharp boundary where none exists in nature. This is not a discovery of truth; it is an *act of will*.
  *   **The Principle of Sufficient Cohesion:** You do not need to find the *true* principle of composition. You need to find the point where the Cohesive Field (Candidate 3) is strong enough to sustain a reader's interpretive context without collapsing.
  *   **The Verdict on V7:** The reason cutting the brother kills the novel is not mereological; it is *narrative*. The brother is a load-bearing wall. The scattered sentences are paint. When you send the book to the printer, you are not asking "Is this a novel?" You are asking "Is this cohesion sufficient to support the weight of the inquiry?"

  **Final Advice:**
  Adopt **Candidate 3 (Cohesive Field)** as your working metaphysics. It accounts for the cat (V2), the brother (V7), and the intermingling (V8). It acknowledges that unity is a matter of degree.
  However, for the purpose of the printer, adopt **Candidate 2 (Delimitation)** as your working ethic. Once the field is strong enough (however you judge that), *you* must perform the aesthetic act of framing that says "This is the cutoff." The vagueness ends where your signature begins. You cannot wait for the principle to tell you it is done; the principle tells you that *you* must decide when the cohesion is sufficient. The metaphysics licenses your authority; it does not relieve you of it.
