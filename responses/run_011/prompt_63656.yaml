      *   *Coordination Problem:* A situation where agents prefer to match each other's actions (e.g., driving on the left vs. right).
      *   *Regularity:* Everyone does $R$ in situation $S$.
      *   *Conditional Preference:* I prefer to do $R$ *if* you do $R$.
      *   *Common Knowledge:* Everyone knows $R$, everyone knows everyone knows $R$, ad infinitum.
      *   *Arbitrariness:* There was another regularity $R'$ that would have worked just as well *before* the convention started.
      *   *Salience/Focal Points:* Something makes $R$ stand out initially (precedent, prominence).
      *   *Precedent:* Past success makes future coordination on the same path likely.

  3.  **Drafting the Translation (Lewis -> DistSys):**

      *   *Coordination Problem:* Consensus without a leader. Getting nodes to agree on a state (e.g., schema version) where disagreement causes errors (packet drops, serialization failures).
