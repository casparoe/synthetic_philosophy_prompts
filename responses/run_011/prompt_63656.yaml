answer: |-
  Here is the translation and the residue report. I have kept the engineering vocabulary strict and flagged substantive claims where the mapping forces a philosophical position.

  ### Part 1: Lewis's *Convention* in Distributed Systems Vocabulary

  **The Coordination Problem**
  *   **Lewis:** A situation where agents have a preference to match actions, but multiple matching actions are possible.
  *   **DistSys:** A consensus problem without a designated leader, where the payload is arbitrary. Two services must agree on a wire format (Schema A or Schema B) to communicate successfully. Disagreement results in packet drops or deserialization errors (system failure). Agreement results in successful throughput.

  **Regularity**
  *   **Lewis:** A persistent pattern of behavior in a population.
  *   **DistSys:** Steady-state convergence. The cluster has reached a stable configuration where $>99\%$ of healthy nodes are emitting and expecting Schema A.

  **Conditional Preference**
  *   **Lewis:** I prefer to do $X$ if you do $X$, and prefer to do $Y$ if you do $Y$. I have no intrinsic preference for $X$ over $Y$.
  *   **DistSys:** Compatibility coupling. My service's success function is $Success = (MySchema == YourSchema)$. I am indifferent to the bit patterns of A vs. B, provided my serialization/deserialization logic matches yours. If you switch to B, my preference flips to B to maintain uptime.

  **Common Knowledge**
  *   **Lewis:** Everyone knows $R$ is the regularity; everyone knows that everyone knows $R$; ad infinitum.
  *   **DistSys:** **Substantive Claim:** This maps to a global consistency guarantee stronger than eventual consistency. It is not just "all nodes have acked" (quorum); it is "all nodes know that all nodes have acked, and know that this knowledge is propagating." In your vocabulary, this is a system where gossip convergence guarantees are treated as epistemic certainty, not probabilistic likelihood. It implies no partition can exist where a node acts on outdated state without knowing it is outdated.

  **Arbitrariness**
  *   **Lewis:** The regularity could have been different. An alternative regularity would have solved the coordination problem equally well *in the steady state*.
  *   **DistSys:** Protocol agnosticism. Schema A and Schema B both validly encode the domain data. The consensus protocol does not validate the *semantics* of the payload, only the *agreement* on the payload. Technically, the system throughput is identical regardless of which schema wins, assuming migration costs are sunk.

  **Salience / Focal Points**
  *   **Lewis:** A feature that makes one solution stand out pre-communication to break symmetry.
  *   **DistSys:** Default configuration, first-mover advantage, or documentation examples. If Service A launches first and publishes its Swagger spec, that spec becomes the "default port" (like 80 or 443). It is not technically superior, but it has higher visibility in the configuration space.

  **Precedent**
  *   **Lewis:** Past success of a regularity creates a reason to expect it to continue.
  *   **DistSys:** Backwards compatibility and deprecation paths. Once Schema A is in production, the "cost" of switching includes the engineering effort of migration. The history of the cluster (the log of past commits) acts as a lock-in mechanism. We follow the precedent because the rollback or migration script is more expensive than maintaining the legacy format.

  ***

  ### Part 2: The Successors (Learning & Norms)

  **Skyrms / Evolutionary Dynamics (Learning)**
  *   **Philosophy:** Agents don't need common knowledge. They just need to update probabilities based on successful past interactions. Convergence emerges from repeated play.
  *   **DistSys:** Gossip-based convergence without global state. Nodes sample neighbors. If a node attempts Schema A and gets a 200 OK, it increases the weight for A. If it gets a 400 Bad Request, it switches. Over time, the population converges on the majority schema through local repair loops. No "cluster-wide agreement" is ever explicitly calculated; it emerges from local handshake success rates.

  **Norms with Normative Expectations**
  *   **Philosophy:** Conventions aren't just regularities; they involve an "ought." You expect me to do it, and you'll sanction me if I don't.
  *   **DistSys:** Policy Enforcement (e.g., OPA, service mesh mTLS policies). This is not just "we match schemas"; it is "you *must* use Schema A, or the ingress controller drops your connection." The "sanction" is an automated 403 Forbidden. The "expectation" is codified in the CI/CD pipeline linting rules.

  ***

  ### Part 3: The Residue Report

  This is where the mapping strains. I have weighted this heavily as requested.

  #### 1. Common Knowledge vs. Convergence
  **Verdict:** **Distorted Map.**

  *   **The Gap:** Your hunch is that Common Knowledge (CK) is just "Quorum + Gossip Convergence." This is a substantive engineering claim that contradicts the philosophical definition.
      *   **Lewis's CK:** Epistemic. It requires infinite recursion of knowledge states ($I$ know that $You$ know that $I$ know...). It is a logical condition that guarantees coordination *cannot* fail due to misunderstanding.
      *   **DistSys Convergence:** Ontic. It is about data state, not knowledge state. A quorum ack means the data is persisted, not that every node *knows* every other node has persisted it. In distributed systems, we explicitly accept that CK is impossible across partitions (FLP impossibility results). We trade certainty for availability.
  *   **The Defect:**
      *   **In Engineering:** We lack the vocabulary for "shared certainty." We talk about "consistency levels," but we treat them as SLAs, not logical truths. We assume that if the logs agree, the knowledge agrees. This is a defect. There is a gap between "the cluster state is X" and "every operator knows the cluster state is X."
      *   **In Philosophy:** Lewis assumes a reliability of inference that doesn't exist in physical networks. He treats agents as perfectly rational processors of public signals.
  *   **What CK carries that Convergence doesn't:** CK eliminates the *risk* of coordination failure. Convergence only reduces the *probability*. If you treat CK as "Quorum + Gossip," you are asserting that your system has zero risk of split-brain due to epistemic ambiguity. That is a substantive claim about your system's reliability that Lewis would accept but your SREs would deny.

  #### 2. The Arbitrariness Claim
  **Verdict:** **Clean Map (with a caveat on scope).**

  *   **The Gap:** You feel arbitrariness is false because migration costs are massive (distributional consequences). Lewis insists the convention is arbitrary.
  *   **The Resolution:** Lewis defines arbitrariness *relative to the coordination payoff*, not *relative to the transition cost*.
      *   **Lewis's View:** Once the system is in Steady State (Schema A), the throughput is identical to Steady State (Schema B). Therefore, the *convention* is arbitrary. The fact that getting from Start to Steady State A is cheaper than Start to Steady State B is a "path dependence" issue, not a "convention" issue.
      *   **Your View:** In engineering, the transition *is* the system. We never live in steady state; we live in continuous deployment. Therefore, nothing is arbitrary because every choice incurs technical debt.
  *   **The Defect:**
      *   **In Philosophy:** Lewis abstracts away history. He treats the coordination problem as a snapshot. This is a defect for modeling real-world systems where history (legacy code) dominates.
      *   **In Engineering:** We conflate "coordination value" (interoperability) with "implementation value" (developer velocity). We argue about schemas as if the bit-pattern matters, when often only the agreement matters.
  *   **Conclusion:** Lewis is right about the *steady state* (both schemas work), but you are right about the *system lifecycle* (switching schemas hurts). The "arbitrariness" holds only if you ignore migration costs. If you include migration costs in the utility function, the arbitrariness vanishes. Lewis excludes them by definition; you must include them by trade.

  #### 3. Norms and Sanctions
  **Verdict:** **No Counterpart.**

  *   **The Gap:** Lewis deliberately excludes norms (oughts) from conventions. He wants to explain how we coordinate without authority. The later philosophers add "normative expectations" (blame, shame, social sanction).
  *   **The DistSys Reality:** We have no social sanction. We have automated enforcement.
      *   If a node violates the convention (sends wrong schema), we don't "blame" it; we drop the packet or kill the pod.
      *   If an engineer violates the convention, they get a code review comment. This is closer to a norm, but it's enforced by tooling, not social pressure.
  *   **The Defect:**
      *   **In Engineering:** We lack a model for "soft" constraints. Everything is either allowed (compiles) or forbidden (fails build). We struggle to model "this is deprecated but still works, and you're a jerk if you use it." That is a normative state that our type systems cannot express.
      *   **In Philosophy:** The normative account explains why conventions persist even when coordination fails (e.g., driving on the left even if no one is around). In distsys, if coordination fails, the node is removed. We don't have "rogue nodes" that stay in the cluster out of social obligation.

  #### 4. Precedent and Path Dependence
  **Verdict:** **Clean Map.**

  *   **The Fit:** This is the strongest mapping. Lewis's "precedent" is exactly your "accumulated dependencies."
  *   **The Insight:** Lewis explains why the "wrong" schema won. It wasn't technical superiority; it was that it achieved critical mass (quorum) first. Once the quorum was reached, the "cost" of switching (breaking clients) exceeded the "benefit" of the better schema.
  *   **The Defect:**
      *   **In Engineering:** We call this "technical debt" or "lock-in." We treat it as a failure of planning.
      *   **In Philosophy:** Lewis treats it as a feature of coordination. Conventions *require* precedent to solve the symmetry problem.
      *   **Takeaway:** Your team's "evaporation" of the decision wasn't a failure of process; it was the standard mechanism of convention formation. The system solved the consensus problem by letting one side timeout.

  ### Summary of the Residue

  1.  **Common Knowledge:** You are partially right, but you are lowering the bar. CK = Certainty. Convergence = Probability. If you equate them, you are claiming your gossip protocol is perfect. It isn't. The gap is a defect in engineering vocabulary: we have no term for "high-probability shared epistemic state."
  2.  **Arbitrariness:** Lewis is talking about steady-state equivalence. You are talking about transition costs. Both are true in different timeframes. The gap is that philosophy ignores migration; engineering is defined by it.
  3.  **Norms:** Engineering has no equivalent to social sanction. We have enforcement. We cannot model "ought" without "must."
  4.  **Precedent:** This maps 1:1. The "decision that wasn't made" is exactly how conventions form. The system elected a leader (the surviving schema) via a timeout mechanism (accumulated dependencies), not via a vote.

  **Final verdict:** Your intuition that the "decision evaporating" is the feature, not the bug, is correct. Lewis provides the formal proof for why your team's inaction resulted in a stable system state. The discomfort you feel is the gap between *engineering design* (which demands explicit choice) and *systemic emergence* (which selects via survival).
