answer: |-
  Here is your prep sheet. It is designed for the room you are walking into, not the room you wish you were in.

  ### Part 1: The First Two Minutes (The Giveaways)
  *Do not start by selling the benefits. Start by disarming the threats. If you try to hide these, they will drag them out of you during Q&A and it will look like deception.*

  1.  **Concede the Status Quo Bias:** "I want to be clear upfront: This system makes it harder to pass *anything*, including good things. It is a speed bump. If your goal is rapid transformation, this is not the tool. This is a tool for stopping bad deals that happen too fast."
  2.  **Concede the Legal Hurdle:** "This likely requires a charter amendment. It cannot be done by a simple council vote. We would need to gather signatures to put *this* on the ballot first."
  3.  **Concede the Staffing Vulnerability:** "The single point of failure here is the staff office that writes the briefings. If that office is captured, the panel is blind. I don't have a perfect answer for who hires them yet, and I need your help solving that."

  ***

  ### Part 2: The Seven Objections (Ranked by Damage)
  *Ranked from "Kills the proposal instantly" to "Annoying but survivable."*

  #### 1. The "NIMBY Veto" (Tenant Union Organizer)
  **The Objection:** "We spent three years fighting for upzoning and tenant protections. The biggest barrier we face is wealthy homeowners blocking housing. You're handing a veto to 60 random people. Statistically, homeowners show up more, stay longer, and are more risk-averse. Isn't this just institutionalizing a NIMBY veto that stops affordable housing dead?"
  **The 90-Second Reply:** "That is the single biggest risk, and here is the safety valve: The Council can override the Panel by taking the ordinance directly to the voters. If the Panel blocks affordable housing, the Council can put it on the citywide ballot. The Panel stops backroom deals; it doesn't stop the public will. If the housing is good, the public will vote for it over the Panel's objection."
  **The Bluff/Soft Spot:** You are bluffing that a citywide ballot is a fair fight. Well-funded NIMBYs can also run ballot measure campaigns to *keep* the veto in place.
  **Honest Move:** Concede that a ballot override is expensive and difficult. Argue that the *threat* of the ballot forces the Council to write better housing laws upfront that don't *need* an override.

  #### 2. The "Accountability Vacuum" (Neighborhood Association Leader)
  **The Objection:** "If my council member screws up, I can vote them out in two years. If this Panel screws up and kills a law we needed, who do I fire? You can't vote out a lottery. You're removing accountability from the system."
  **The 90-Second Reply:** "You're right, you can't fire them. That's why their power is negative only. They can't waste your money, they can't start new programs, and they can't raise taxes. They can only say 'wait.' We trade accountability for independence. We accept that we can't fire them because the only way to be un-bought is to not need our vote next November."
  **The Bluff/Soft Spot:** You are assuming "negative power" doesn't require accountability. Killing a police reform bill is just as damaging as passing a bad one.
  **Honest Move:** Concede this is a trade-off. "We are choosing independence over accountability for this specific check. That's a design flaw, but it's the price of breaking the donor cycle."

  #### 3. The "Briefing Book Bias" (Racial Justice Coalition)
  **The Objection:** "You say the staff is nonpartisan. There is no such thing. Language is power. If the summary says 'fiscal impact' instead of 'human cost,' you've rigged the vote. Who hires this staff? Who fires them if they lie?"
  **The 90-Second Reply:** "You're absolutely right, language is power. That's why the briefing book can't be secret. It has to be public draft for 14 days before the Panel sees it. Any organization in this room can submit a 'minority report' or an alternative summary that goes into the packet. The Panel has to read the dissent."
  **The Bluff/Soft Spot:** You are bluffing that laypeople will read the dissent. They will read the summary. The summary writer holds the power.
  **Honest Move:** Concede this is the hardest operational part. Propose a steering committee for the staff office that includes coalition members (like the people in the room).

  #### 4. The "Diluted Victory" (Racial Justice Coalition Member)
  **The Objection:** "We fought to get two of our own people on the Council. That was hard work. This tells us that our electeds can't be trusted, and puts power in the hands of strangers. It undermines the representation we won."
  **The 90-Second Reply:** "It doesn't replace your electeds. It protects them. Your two council members are still there, voting, debating, and setting the agenda. This Panel just stops the other seven from cutting a deal in the basement that forces your two to vote 'no' or look weak. It gives your allies cover to fight harder."
  **The Bluff/Soft Spot:** It does undermine them slightly by suggesting the electoral process isn't enough.
  **Honest Move:** Stand firm. "Electoral wins are fragile. This hardens the gains you've already made."

  #### 5. The "Pool Exclusion" (Tenant Union Organizer)
  **The Objection:** "You're drawing from voter reg and utility accounts. My tenants aren't on the voter roll. Their utilities are in the landlord's name. You say 'stratified,' but if the pool doesn't have us in it, the sample doesn't matter. You're randomizing from a list that excludes the poor."
  **The 90-Second Reply:** "That is a valid flaw in the data sources. We would need to add DMV records and public benefit rolls to the pool to capture non-voters and renters. If we can't get that data access, the Panel shouldn't launch. I agree, a biased pool creates a biased Panel."
  **The Bluff/Soft Spot:** Getting access to DMV/benefit data is a privacy nightmare and might be legally impossible.
  **Honest Move:** Concede this is a technical hurdle that requires legal work before implementation.

  #### 6. The "Charter Challenge" (Retired Legal Aid Lawyer)
  **The Objection:** "In a council-manager system, the Council has plenary legislative power. You can't condition their ordinances on a second approval without a charter amendment. If you pass this as a regular ordinance, it'll be struck down in court on day one."
  **The 90-Second Reply:** "I agree. This has to be a charter amendment. That means we need 15,000 signatures to get it on the ballot. I'm not asking the Council to pass this; I'm asking this coalition to help us put it to the voters directly."
  **The Bluff/Soft Spot:** None. This is factually true.
  **Honest Move:** Full concession. "Yes. It must be a ballot measure."

  #### 7. The "Status Quo Lock" (General Organizer)
  **The Objection:** "Progressive change usually requires breaking things. Civil rights laws were 'radical' once. A veto panel protects the status quo. It would have killed the Civil Rights Act. Why would we want a machine designed to say 'no'?"
  **The 90-Second Reply:** "At the city level, 'progressive change' is often just developer incentives and tax breaks sold as progress. This stops the corporate giveaways. For big social shifts, the Council can still go to the ballot override. This stops the quiet corruption, not the loud movements."
  **The Bluff/Soft Spot:** City councils do pass real progressive policy (minimum wage, policing). This could block those too.
  **Honest Move:** Concede. "It will slow down some good things. We have to decide if stopping the bad things is worth the drag on the good things."

  ***

  ### Part 3: The One Reply That Must Land
  *If you fumble this, the room turns against you.*

  **The Topic:** The Affordable Housing Veto (Objection #1).
  **Why:** This audience cares more about housing than almost anything. If they believe this mechanism will be used to block affordable housing, they will view you as an adversary, not an ally.
  **The Core Argument:** You must hammer the **Ballot Override**.
  **The Script:** "I know housing is the priority. If this Panel blocks a housing ordinance, the Council is not stopped. They can take that same housing ordinance directly to the voters. The Panel cannot kill housing; they can only force a public vote on it. If the housing is truly needed, the people will vote yes over the Panel's objection. The Panel stops the *backroom* deals, not the *public* will."

  ***

  ### Part 4: The Question You Hope Nobody Asks
  *Your gut says housing. I disagree. Housing is the emotional objection, but there is a procedural one that is harder to answer.*

  **The Question:** **"Why not just lower the signature requirement for citizen referendums?"**
  *(Asked by a savvy Organizer or Council Staffer)*

  **Why it hurts:** Your entire argument is that elections are broken and money dominates. But a citizen referendum is the existing tool for "people vetoing council." If you argue for a permanent, expensive, bureaucratic panel instead of just making the existing referendum process easier (e.g., lowering signatures from 15% to 5%), you look like you're building a bureaucracy when a simple tool exists.
  **The Trap:** If you say "Referendums are too hard," they say "So fix that." If you say "Panels are more deliberative," they say "Deliberation is a luxury we don't have."
  **How to Answer:** "Referendums require money and organization. Only groups with donors can run them. A Panel requires only time. We want to empower the person who works two jobs and can't gather signatures, but can spend a weekend reading a briefing. Referendums favor the organized; this favors the occupied."

  ***

  ### Final Tactical Note
  You are a screen-printer. You are not a policy expert. Use that.
  When you don't know an answer, say: *"I run a print shop. I know how ink sticks to paper. I don't know how to fix the charter language. That's why I need the lawyers and organizers in this room to fix the parts I got wrong."*

  This disarms the "academic" defense and invites them to co-own the solution. Good luck.
