answer: |-
  Your diagnosis is sharp, and your background in software gives you a distinct advantage in spotting the structural invariants of this dispute. You are correct that the surface-level arguments (TMS-EEG, grid vs. small-world networks, photodiodes) are merely symptoms. The dispute has stalled because the two sides are operating under incompatible definitions of scientific validity.

  Here is the diagnosis of the disagreement, an evaluation of your hypotheses, and an assessment of what progress actually looks like in this context.

  ### 1. Diagnosis: Paradigm Incommensurability
  The disagreement is **methodological and metaphysical**, masquerading as empirical. In Thomas Kuhn's terms, this is a clash of paradigms where the two sides do not agree on what constitutes "data" or "explanation."

  *   **The Critics (Standard Neuroscience/Functionalism):** Operate under an **instrumentalist/operationalist** framework. A theory is scientific if it predicts third-person observable data (behavior, report, neural correlates). Consciousness is a dependent variable to be predicted by physical structure/function.
  *   **The IIT Proponents (Structural Realism):** Operate under a **deductive/axiomatic** framework. They begin with the self-evident truth of first-person experience (the axioms) and deduce the physical postulates required to support it. Consciousness is an independent variable (an intrinsic property) that *constrains* the physics.

  Because they disagree on the direction of inference (Physics $\rightarrow$ Experience vs. Experience $\rightarrow$ Physics), they disagree on what counts as a falsification.
  *   For the **Critics**, if $\Phi$ is high in a system that reports nothing (or behaves like a feed-forward net), the theory is wrong.
  *   For **IIT**, if the theory says $\Phi$ is high, the system *has* experience, even if it cannot report it. A lack of report is a functional deficit, not evidence of absent consciousness.

  This is not merely verbal. It is a substantive disagreement about the ontology of science itself.

  ### 2. Evaluating Your Hypotheses

  **Hypothesis 1: The Methodological/Metaphysical Clash**
  *   **Verdict:** This does the **heavy lifting**.
  *   **Analysis:** You identified that one side requires $\Phi$ to track measurable differences, while the other treats it as an identity claim. This is the root. The 2023 open letter accused IIT of being "pseudoscience" precisely because it insulates itself from standard falsification by retreating to the identity claim ("You can't measure it because your instruments measure function, but $\Phi$ *is* the experience").
  *   **Why it stalls:** As long as IIT proponents treat the axioms as self-evident truths rather than empirical hypotheses, no third-person data can definitively refute them. They can always argue that the experimental setup failed to isolate the causal power of the system.

  **Hypothesis 2: The Computational/Approximation Problem**
  *   **Verdict:** This is a **force multiplier** for the critics, but not the root cause.
  *   **Analysis:** Your software intuition is correct: computing exact $\Phi$ is NP-hard. For any system of realistic size (like a brain), the value is an estimate derived from approximations (e.g., using surrogate measures like Perturbational Complexity Index, or PCI).
  *   **Why it matters:** In engineering, an algorithm without error bounds on non-deterministic input is a liability. In this debate, it allows IIT proponents to be slippery. If an experiment contradicts $\Phi$, they can argue the approximation was poor or the grain of the system was misidentified. If the approximation were exact and tractable, the theory would be *more* vulnerable to falsification, but the fundamental metaphysical disagreement (Hypothesis 1) would remain.
  *   **Correction:** The defenders are not just defending a "defined object"; they are defending the *mapping* from the defined object to the physical substrate. The approximation issue makes testing that mapping impossible, which fuels the "unfalsifiable" charge, but it doesn't create the charge.

  ### 3. What You Missed: The Axiomatic Directionality
  There is a third element that cements the stalemate, which you hinted at but didn't explicitly name: **The Reversal of Inference.**

  Standard science observes physical structures and infers capacities. IIT observes the *structure of experience* (unity, specificity, etc.) and infers the required physical structure.
  *   **The Missed Point:** IIT claims to solve the "Hard Problem" by stipulating that experience is fundamental. Critics view this as begging the question.
  *   **The Consequence:** This creates a **data asymmetry**. For IIT, the primary data is private (phenomenology). For critics, the primary data is public (behavior/physics). Science, as currently institutionalized, requires public data. Therefore, IIT is asking the scientific community to accept a new epistemic standard (that first-person axioms can dictate third-person physics) without providing a translation layer that satisfies current standards.

  ### 4. What Counts as Progress?

  Given this diagnosis, a "knockout experiment" is unlikely to resolve the dispute, because the losing side can retreat to their methodological fortress (e.g., "The experiment measured function, not consciousness").

  However, progress is possible in three specific forms:

  **A. Formal Progress (Addressing Hypothesis 2)**
  *   **The Requirement:** A rigorous bound on the approximation error for $\Phi$ in large-scale networks.
  *   **Why:** If IIT researchers can publish a theorem stating, "For a system of size $N$, our approximation $\Phi'$ is within $\epsilon$ of true $\Phi$," they remove the "moving goalpost" defense. This forces the theory to stand or fall on the *value* of the number, not the *method* of calculating it.
  *   **Likelihood:** Low. The combinatorial explosion is intrinsic to the definition.

  **B. Adversarial Collaboration (Addressing Hypothesis 1)**
  *   **The Requirement:** Pre-registered experiments where IIT and a rival theory (like Global Neuronal Workspace) make **divergent** predictions about *reportable* consciousness.
  *   **Why:** This forces IIT to step out of the "unreportable experience" defense. The recent ICONS project (2022-2024) attempted this. Early results suggest IIT did not perform as decisively as hoped in distinguishing conscious from unconscious states in certain paradigms.
  *   **Progress Condition:** If IIT consistently fails to predict *report* better than chance in adversarial settings, the "identity claim" loses its pragmatic utility, even if it remains metaphysically possible.

  **C. Conceptual Dissolution (The Most Likely Outcome)**
  *   **The Requirement:** Decoupling $\Phi$ from "Consciousness."
  *   **Why:** $\Phi$ is a mathematically rigorous measure of causal integration. It is useful for analyzing system complexity regardless of whether it correlates with "what it feels like" to be the system.
  *   **Progress:** The field accepts $\Phi$ as a measure of **informational depth** or **causal autonomy**, while dropping the claim that it *is* phenomenology. This saves the math (which is interesting to software engineers and neuroscientists) while discarding the metaphysical baggage that triggers the "pseudoscience" label.

  ### Summary
  The dispute is **substantive and methodological**. Your first hypothesis identifies the engine of the conflict (what counts as science); your second identifies the friction that keeps it running (intractability prevents clean falsification).

  **Expectation:** Do not expect a resolution where one side admits defeat. The most probable path to progress is **dissolution**: IIT becomes a theory of *causal structure* rather than a theory of *consciousness*. If the proponents can accept that $\Phi$ measures a necessary condition for consciousness without being identical to it, the "pseudoscience" charge evaporates. If they insist on the identity claim, the stalemate will persist indefinitely, as the two sides are speaking different epistemic languages.
