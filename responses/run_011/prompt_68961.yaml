  *(Self-Correction on the "Fatal" list)*: Is the "Ideal Agent" problem fatal? For a *human-centric* Bayesianism, no. For a *normative* Bayesianism, yes. I should distinguish these. The user seems to be advocating a human-centric view ("Nobody carries around the full deductive closure"). So the Ideal Agent problem might be a "Concedable" or "Awkward" point rather than Fatal, *provided* they abandon claims to ideal normativity. I will classify it as "Fatal to Normative Ambitions, Awkard to Descriptive Claims."

  *(Refining the Millikan point)*: The user asks: "Can my account redescribe that, or does it bite the bullet?" The answer is: It can redescribe it, but it requires claiming Millikan didn't see the entailment. Historically, Millikan thought the equation was empirical, not derived from quanta. So the entailment *wasn't* known. This supports the user's view. I should emphasize this.

  *(Refining the "Two-Tier" point)*: The risk is that "Corroboration" does the work of Confirmation in practice (theory choice), so banning it from the probability calculus makes the calculus irrelevant to theory choice. That's a fatal disconnect.

