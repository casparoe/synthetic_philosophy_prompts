      *(Final thought on the "Reliability" gloss)*: The user says "even reliability is unavailable." In psychometrics, test-retest reliability is correlation between Time 1 and Time 2. If the same person scores both, you can still calculate a correlation. Wittgenstein says the *normative* standard is missing. So the correlation might be 1.0, but it still doesn't mean "measurement." It just means "consistency of impulse." I need to highlight that MT conflates consistency with correctness in the absence of a criterion, whereas Wittgenstein separates them radically.

