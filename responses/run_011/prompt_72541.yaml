answer: |-
  **EXAMINATION PAPER**

  **Course:** PHY 540 – Philosophy of Physics Seminar
  **Section:** B – Essay Question
  **Time Allowed:** 90 Minutes
  **Marks:** 25
  **Instructions:** Closed book. Answer the question below.

  ***

  **Question 1**

  Consider the following student argument attempting to derive the Born Rule within the Everett (Many-Worlds) Interpretation:

  > "Suppose an electron is in state $\sqrt{1/3}|\uparrow\rangle + \sqrt{2/3}|\downarrow\rangle$ and is measured along $z$.
  > (i) After measurement, both outcomes occur; uncertainty is merely self-locating (which branch am I on?).
  > (ii) I have no information distinguishing the branches prior to looking, so the Principle of Indifference assigns equal credence to each.
  > (iii) Although amplitudes are unequal, I can refine the apparatus so the $|\downarrow\rangle$ branch splits into two sub-branches of amplitude $\sqrt{1/3}$ each. Now there are three equal-amplitude branches, two corresponding to 'down'.
  > (iv) Therefore, credence in 'up' is 1/3 and 'down' is 2/3. The Born Rule is derived from branch counting plus indifference."

  Critically evaluate this derivation. Does step (iii) successfully derive the probability weights, or does it covertly assume them? Furthermore, explain how this argument handles cases where the squared amplitudes stand in an irrational ratio. Conclude whether this approach succeeds in grounding probability in ontology alone.

  ***

  **MODEL ANSWER**

  This argument attempts to ground Everettian probability in self-locating uncertainty and branch counting, avoiding the postulation of probability as a primitive. While intuitively appealing, the derivation fails because step (iii) is circular, and the strategy collapses when faced with irrational coefficients.

  The core failure lies in step (iii). The student claims to derive weights by counting branches, but the procedure for "splitting" a branch presupposes the very measure it seeks to derive. To split the $|\downarrow\rangle$ component into two sub-branches of equal amplitude, one must assume that the physical ontology allows for a decomposition where the "amount of existence" or measure is additive over sub-branches. However, in the formalism of quantum mechanics, the decomposition of a state vector into orthogonal components is not unique; it is basis-dependent.

  If the "number of branches" is to determine probability, there must be a fact of the matter about how many branches exist. But without a pre-existing measure (the Born rule), there is no objective criterion for when a branch counts as "one" versus "two." The student's move to split the $|\downarrow\rangle$ branch assumes that amplitude squared corresponds to a countable quantity of worlds. If amplitude did not correlate with this "count," the splitting procedure would be physically unmotivated. Thus, step (iii) does not derive the weights; it repackages the Born rule as a counting rule by implicitly assuming that amplitude squared *is* the measure of branch multiplicity. It assumes additivity of weight across the split, which is equivalent to assuming the Born rule.

  Furthermore, the argument fails catastrophically for irrational amplitude ratios. Suppose the state is $\sqrt{1/\pi}|\uparrow\rangle + \sqrt{1 - 1/\pi}|\downarrow\rangle$. One cannot split the branches into a finite number of equal-amplitude sub-branches to make the counts match the probabilities, because $\pi$ is irrational. There is no integer $N$ such that the branches can be divided into equal units to recover the ratio $1/\pi$.

  To rescue the argument, one must invoke a limit process: approximate the irrational ratio with a sequence of rational ratios, derive the probabilities for the rational cases via counting, and assume continuity to extend the result to the irrational case. However, this move surrenders the claim that probability is derived from *counting*. If one must rely on a continuity assumption over a measure defined by amplitudes to handle the general case, then the amplitude (the Hilbert space norm) is doing the fundamental work, not the branch count. The counting argument becomes a mere illustration for special rational cases, not a general derivation.

  Finally, relying on indifference (step ii) is problematic in Everettian contexts. Indifference applies when outcomes are symmetric. But if the branches have different amplitudes, they are not physically symmetric in the relevant sense unless one already accepts that amplitude dictates "symmetry" or "measure." If branches are distinct concrete entities, why should an agent care about them equally if their "size" in Hilbert space differs? Without an independent justification for why rational agents should care about branch count rather than branch amplitude, the appeal to indifference is unjustified.

  In conclusion, the derivation fails. Step (iii) assumes the additivity of measure which is equivalent to the Born rule, and the irrational case demonstrates that branch counting cannot be fundamental. Probability in Everettian QM cannot be grounded in ontology (branch count) alone; it requires a decision-theoretic or measure-theoretic link between the Hilbert space norm and rational credence.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **1. Critique of Step (iii) / Circularity (10 Marks)**
  *   **A Range (8-10):** Explicitly identifies that splitting the branch assumes additivity of measure. States that "branch count" is not basis-independent without a pre-existing measure. Argues that equating amplitude-squared with "number of sub-branches" assumes the conclusion (circularity).
  *   **B Range (5-7):** Notes that branch counting is basis-dependent or arbitrary. Mentions that splitting is a mathematical trick. *Limitation:* Fails to explicitly connect basis dependence to the circularity of assuming the measure. Merely stating "basis dependence" without explaining why it undermines the *derivation* caps marks at 6.
  *   **C Range (0-4):** Accepts step (iii) as valid. Confuses amplitude with probability without critique. Fails to address the physical status of the "split."

  **2. The Irrational Coefficient Problem (8 Marks)**
  *   **A Range (7-8):** Clearly explains that integer counting fails for irrational squares (e.g., $1/\pi$). Argues that invoking limits/continuity makes the *measure* (amplitude) fundamental, rendering the counting heuristic redundant.
  *   **B Range (4-6):** Identifies that you can't split branches for irrational numbers. Suggests approximation is needed. *Limitation:* Fails to explain why using limits undermines the "counting" derivation (i.e., doesn't note that limits privilege the measure over the count).
  *   **C Range (0-3):** Ignores the irrational case. Claims the argument works generally.

  **3. Synthesis and Conclusion (7 Marks)**
  *   **A Range (6-7):** Concludes that probability cannot be grounded in ontology/counting alone. Distinguishes between the *measure* (Hilbert norm) and the *count*. Synthesizes the circularity and irrationality points to reject the derivation.
  *   **B Range (4-5):** Concludes the argument is weak. May suggest alternative approaches (e.g., decision theory) vaguely. *Limitation:* Conclusion is disjointed from the specific critiques in sections 1 and 2.
  *   **C Range (0-3):** Vague conclusion. Claims the Born rule is "probably true" without addressing the derivation's failure.

  **Specific Penalties & Constraints:**
  *   **The "Basis Dependence" Cap:** If an answer relies *solely* on the phrase "branch counting is basis-dependent" without explaining *why* this prevents a derivation of probability (i.e., without discussing the lack of objective branch identity or the circularity of the splitting move), the maximum mark for Section 1 is 5/10.
  *   **Circularity:** Answers that claim step (iii) is a valid derivation cannot score higher than a C (12/25 total), regardless of other content.
  *   **Word Count:** Significant deviation from the expected depth (too brief to cover irrationality) should be penalized under Synthesis.

  **Grade Boundaries:**
  *   **A (20-25):** Comprehensive critique of circularity and irrationality; clear distinction between measure and count.
  *   **B (15-19):** Good identification of problems but misses the depth of the circularity charge or the implication of the limit argument.
  *   **C (10-14):** Identifies surface-level issues but accepts the core logic or misses the irrational case.
  *   **D/F (0-9):** Fundamental misunderstandings of Everettian mechanics or the Born rule.
