answer: |-
  The hearing room smelled of ozone and old paper, the specific scent of air recycled through too many filters. Elara sat at the central desk, her hands flat on the cool surface. Her badge gleamed: *Assessor Class 4, Horizon Clearance: 3 Generations.* Enough to do the job, not enough to be burdened by the why of it.

  To her right, in the high-backed chair reserved for observers with maximum clearance, sat Councilor Vane. He wore a suit of heavy black wool that looked uncomfortable in the summer heat. He did not shift. He did not blink at the expected rate. His hands rested on his thighs, palms up, fingers slightly curled as if holding invisible spheres. A plate of untouched fruit sat on the table before him; the apple slices had browned, oxidized, crusted over. He was breathing, shallowly, but his eyes were fixed on a mote of dust drifting in the shaft of light from the high window. He looked like a man waiting for a train that had arrived years ago.

  Elara looked away. She had to focus on the box in the center of the room.

  It was a sealed evidence container from the River District excavation. The floodworks had breached the old embankment, and the diggers had found the chamber. The diggers themselves were visible through the reinforced glass of the room's lower window. Down in the trench, men in orange vests laughed as they shoveled mud. One lit a cigarette, shielding the flame with a cupped hand, oblivious to the bone fragments scattered around his boots. They worked with a cheerful rhythm, their movements unburdened by the depth of the soil. They lived within a two-generation horizon; what happened before their grandfathers was weather, not history. They could not be swindled by nostalgia because they could not remember far enough to miss anything.

  Elara tapped her pen. "Present the findings."

  The man from the Department of Legacy stood first. He wore a lapel pin shaped like a laurel wreath. He opened a folder thick with glossy photographs.

  "The structure is a foundation stone," he said, his voice resonant, practiced. "Inscribed with the sigil of the First Engineers. We propose designation as a Heritage Site. We will cast the floodgate in the likeness of the Engineer. It serves as a reminder of civic duty. The district will have a hero to emulate. We recommend the license be adjusted to allow for ceremonial recall of the Founding Era."

  He smiled. He wanted the past to be a costume the present could wear to look taller. He wanted the bones to be saints.

  The woman from the Department of Preservation spoke next. She wore gloves, though she touched nothing. She pushed a stack of soil samples across the desk.

  "The stratum is intact," she said softly. "The bones, the mud, the rusted iron, the shards of pottery. They are all equal. To remove the stone is to violate the mud. To name the Engineer is to insult the laborer whose bone is fragment 4-B. We recommend immediate resealing. The trench must be filled. The license should remain static. Nothing here demands action. Everything here demands rest."

  She looked at the box as if it were a sleeping child. She wanted to preserve the dust because it was there. She wanted the present to suffocate gently under the weight of equal reverence.

  The man from the Department of Accountability did not stand. He leaned forward, his eyes dark, lacking the sheen of the others. He slid a single sheet of paper across the desk. It was a transcription of the ledger found beside the bones.

  "The ledger records payments," he said. "For disposal. These were not engineers. They were conscripts. Buried to stabilize the bank so the upper districts would not flood. The signatures on the authorization are legible. The lineage is traceable. We recommend indictment. The descendants of the signatories must be summoned. The district's license must be widened to nine generations to accommodate the testimony. They need to know who drowned them."

  He wanted to sever the past to free the present. He wanted to execute the dead to save the living.

  Elara looked at the three reports. They were incompatible. To choose one was to destroy the other two.

  She looked at Vane again. He had not moved. A fly landed on his cheek, near the tear duct. He did not swat it. He watched the fly walk across his skin with the detached interest of a geologist watching a continent drift. He knew everything. His clearance was unlimited. He had seen every ledger, every bone, every lie since the city was founded. He saw the pattern complete. He saw that the conscripts were buried, the descendants prospered, the heroes were invented, the dust was swept. It was all one static image to him. There was nothing to do. His appetite was gone because every meal was already digested. His hands were still because every action was already finished. He was the warning kept in the room so the assessors would remember what happened when the horizon became infinite.

  Elara looked back at the window. The diggers were taking a break. One of them was tossing a bone fragment like a coin, catching it, laughing. He didn't know it was a human vertebra. He was happy. He was free.

  If she chose Legacy, the bone became a hero. The diggers would be told they were walking on holy ground. They would stand taller. They would believe a lie.
  If she chose Preservation, the trench was filled. The floodworks stopped. The river would rise next season. The district would drown, but the dust would be safe.
  If she chose Accountability, the ledger was published. The aristocracy would be sued. The diggers would be told their ground was a grave made by their neighbors. Their two-generation horizon would shatter. They would inherit a grief not their own. They would become heavy. They would lose the lightness that let them work.

  Elara picked up the Accountability report. The paper felt heavy, dense with ink.

  "The Department of Legacy seeks to decorate," Elara said. Her voice sounded thin in the acoustic tile room. "The Department of Preservation seeks to embalm."

  She looked at the man from Accountability. "You seek to bleed."

  "Justice requires a vessel," he said.

  "Justice requires a judge," Elara said. "And the judge is made of the same soil as the dead."

  She thought of her own badge. Three generations. Her grandfather had worked the locks. Her father had filed the permits. She was here. If she widened the district's license, she set a precedent. The Office of Horizons would have to widen others. The city would become heavy. People would stop digging. They would start looking back. They would become like Vane.

  She looked at Vane. The fly had moved to his lip. He still did not move. He was perfect. He was dead while breathing.

  Elara looked at the diggers. One of them wiped sweat from his forehead, leaving a streak of mud. He looked up at the window, but he didn't see her. He saw only the glass. He whistled a tune that had no history.

  If she protected them, she lied. If she judged, she burdened them.

  She picked up her pen. It was a standard issue stylus, lightweight plastic. As she gripped it, her hand trembled. She realized she was holding the weight of the generations she was about to impose. To judge the past was to invite the past into the present. To invite the past was to kill the future's ability to move.

  But the ledger was real. The signatures were real. To seal them was to say the blood didn't matter.

  Elara began to write. *Petition Granted. Department of Accountability authorized. District License adjusted to Nine Generations. Immediate suspension of floodworks. Summons issued to Lineage Holders.*

  She pressed the stylus to the screen. The ink flowed.

  As she signed, she felt a tightness in her chest, a sudden fatigue in her shoulders. It was physical, like lifting a stone. She looked at her hand. It looked older. The skin was thinner. She looked at Vane. He shifted, just once. His fingers uncurled, flat against the wool. He looked at her. For a second, his eyes focused. There was no approval there. No pride. Only recognition. He saw her join him. She had chosen knowledge over life. She had chosen the truth that paralyzes.

  The man from Accountability nodded, sharp and satisfied. He gathered his papers. He would have his trials. He would have his defendants. He would feel righteous. He did not see that he was building a cage.

  The woman from Preservation sighed, a sound of crumbling paper. She packed her soil samples. She would go home to a house full of objects she could not throw away.

  The man from Legacy closed his glossy folder. He would find another stone. He would find another hero.

  Elara stood up. Her knees clicked. She felt the weight of the city behind her eyes, the layers of sediment, the drowned men, the signed orders. She wanted to go outside. She wanted to whistle. She wanted to not know what was under the mud.

  She walked to the window. The diggers were packing up. The one who had tossed the bone was looking at a piece of paper a foreman had handed him. He was reading. His shoulders slumped. He stopped whistling. He looked at the ground, really looked at it, for the first time. He saw the grave. He became serious. He became historical.

  Elara turned back to the room. Vane had closed his eyes. He was sleeping, or pretending to. He knew the day was done.

  Elara placed her badge on the desk. She would not need it tomorrow. The ruling was irreversible. The horizon was widened. The city would remember. The city would stop.

  She walked to the door. Her hand hovered over the handle. She remembered her grandfather's face. She remembered her father's hands. She remembered the ledger. She could not forget them now. She had made sure of that.

  She opened the door and stepped into the hall. The air was fresh, but it felt thin. She took a breath. It didn't fill her lungs. She walked slowly, counting her steps, knowing exactly where she had been, and exactly where she was going, and seeing no difference between the two.

  ***

  **Post-Story Note**

  I let the Critical Order win, because justice demands the truth, but I made the cost the loss of the capacity for life itself.
  The licensing system is not defensible; it is a mechanism of control that trades happiness for ignorance or truth for paralysis.
  Nietzsche's warning is that history serves life, not the other way around; Elara chooses history and kills her life.
  The Suprahistorical state is the ultimate trap: knowing everything means doing nothing.
  The Unhistorical workers were the only ones truly living until Elara sentenced them to memory.
