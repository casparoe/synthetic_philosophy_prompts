  **The Case: The "Ruleless" Cooperative Game**

  **The Scenario:**
  Five children (aged 7–9), strangers to one another but from the same cultural background, are placed in a comfortable room with a single complex construction set (e.g., a large marble run). The set is sufficient for all to participate, but the pieces are interdependent; no child can build anything substantial alone. Crucially, **no instructions are provided**, and **no adult is present** to mediate turns or propose a design. The children are told only: "Build something together."

  **The Feature Withdrawn:**
  **The External Ritual Standard (The Rulebook/Teacher).**
  We are removing the artificial measure that dictates how the pieces *ought* to be used and how labor *ought* to be distributed. In Xunzian terms, we remove the *wei* (deliberate activity/model) that straightens the wood. In Mencian terms, we remove the obstruction to see if the *duan* (sprouts) generate form spontaneously.

  **The Predictions:**
  *   **The Mencian Prediction:** The children will negotiate a fair distribution of pieces and turns spontaneously. They will exhibit *ci rang* (deference) and *yi* (fittingness), inventing a cooperative protocol without external imposition. The order emerges from the inside out.
  *   **The Xunzian Prediction:** The children will descend into contention over the desirable pieces. Without an external standard to limit desire, their natural inclination toward profit and self-aggrandizement will cause deadlock or conflict. The order must be imposed from the outside in.

  **Why This Follows from Doctrine:**
  For Mencius, the capacity for *li* (ritual propriety) is rooted in the heart-mind's innate sense of shame and deference (the "child at the well" intuition). Given a novel situation, the moral sprouts should extend themselves to create a fitting social form, just as a plant grows toward light. Success proves the *sufficiency* of the internal sprout.

  For Xunzi, human nature is "bad" because it lacks internal boundaries; goodness is an artifact of accumulated cultural models ("straightening warped wood"). Since this game is novel, there is no accumulated model to internalize. Therefore, without an external teacher or rulebook to impose limits on desire, chaos is the only natural outcome. Success would imply an intrinsic moral compass Xunzi explicitly denies.

  **Welding the Escape Hatches:**
  1.  **Stopping the Mencian Retreat ("Hostile Environment"):** The Mencian often claims failure results from a "starved heart" due to poverty or abuse. Here, the children are well-fed, the room is comfortable, and the materials are abundant. There is no environmental scarcity to "drown" the sprouts. If they fight, it cannot be blamed on deprivation.
  2.  **Stopping the Xunzian Retreat ("Bad Ritual/Teacher"):** The Xunzian often claims failure results from poorly designed rituals or incompetent teachers. Here, there is *no* ritual to be poorly designed. Furthermore, because the task is novel, the Xunzian cannot claim the children failed because they hadn't yet internalized *this specific* rule. If they succeed, the Xunzian cannot argue they were following an invisible, accumulated model, because the coordination required is unique to this specific set of strangers and pieces.

  **The Surrender:**
  *   **If the Children Succeed (Order Emerges):** Xunzi must surrender the core claim that goodness is *solely* an artifact of external imposition. He would have to admit that the human heart possesses an intrinsic capacity to generate *li* without prior accumulation, effectively conceding the Mencian position that the "sprouts" are sufficient for moral innovation.
  *   **If the Children Fail (Chaos Ensues):** Mencius must surrender the claim that the sprouts are *sufficient* for social order. He would have to admit that innate compassion is too weak to overcome self-interest without the scaffolding of external ritual, conceding the Xunzian position that human nature requires artificial straightening to function cooperatively.

  This case isolates the *source* of order (internal generation vs. external imposition) rather than merely measuring the *presence* of order, forcing a theoretical capitulation rather than a hermeneutic adjustment.
