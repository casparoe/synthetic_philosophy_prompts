answer: |-
  Here is the submission package for the revision bank.

  ### 1. Exam Question Stem

  **Question 3**
  **Topic: Explanation and Comparison in History (The Great Divergence)**

  Historians often treat "Why Britain and not China?" as a single causal puzzle. However, contrastive explanation suggests that the validity of a cause depends on the specific "foil" (the contrasting case) selected.

  Consider three proposed difference-makers for British industrialisation:
  1.  **Coal Geography:** Accessible coal deposits near navigable water.
  2.  **Relative Factor Prices:** High wages combined with cheap energy.
  3.  **Ecological Relief:** Land-saving imports from the New World.

  **In an essay of approximately 1,000 words, address the following:**
  *   **Foil Sensitivity:** For each of the three factors above, identify a specific geographical or temporal foil within "China" or "Europe" where that factor *would* count as a legitimate difference-maker, and one where it *would not*.
  *   **Defining the Explanandum:** Explain why none of these factors can be evaluated until the *explanandum* is pinned down. Specify what metric (e.g., mechanisation, GDP per capita, energy capture), start date, and baseline comparison must be established before the factors become testable.
  *   **Reframing the Inquiry:** Rewrite the original question ("Why Britain and not China?") into a version you defend as methodologically well-posed. Briefly outline what specific archival or quantitative evidence would be required to settle this rewritten question.

  *(25 Marks)*

  ***

  ### 2. Model Answer

  The question "Why Britain and not China?" is not a single historical problem but a family of questions indexed by the contrast class selected. A cause is only a cause relative to a foil; if the foil changes, the explanatory power of the factor shifts. To treat the Great Divergence as a binary puzzle is to risk category errors where factors present in both cases are treated as unique to one.

  **Foil Sensitivity**
  Take **coal geography**. If the foil is the **Yangzi Delta**, coal is a robust difference-maker. The Delta lacked accessible fossil fuel near its commercial core, whereas Britain had coal near canals and ports. However, if the foil is **North China** (specifically the Jing-Jin region), the explanation breaks down. North China possessed abundant coal near waterways but did not industrialise endogenously. Here, coal is a necessary condition but not a sufficient difference-maker.

  Similarly, consider **relative factor prices** (the high-wage/cheap-energy hypothesis). This holds if the foil is **Labour-Surplus Asia** generally. If British wages were uniquely high relative to energy costs, labour-saving technology becomes rational. But if the foil is **Northwest Europe** (e.g., the Low Countries), the explanation weakens. The Dutch had similar factor prices in the 17th century but did not trigger a steam-based industrial takeoff. This suggests factor prices explain why technology was *adopted* in Europe rather than Asia, but not necessarily why the takeoff occurred in Britain specifically within Europe.

  Finally, **ecological relief** (New World land). This is a strong difference-maker if the foil is **Malthusian Eurasia**. The Americas allowed Britain to bypass land constraints on timber and fibre. But if the foil is **Spain or Portugal**, the factor loses explanatory power. Those empires had greater access to New World land but did not industrialise first. Thus, New World land is only a difference-maker when combined with specific domestic institutional capacities to utilise that land.

  **Defining the Explanandum**
  None of these factors can be weighed without pinning down the *explanandum*. "Industrialisation" is too vague. Are we measuring **mechanisation of textiles** (starting c. 1760), **sustained GDP per capita growth** (starting c. 1820), or **energy capture per head** (starting c. 1700)?
  If the explanandum is *mechanisation*, coal and factor prices are primary. If it is *sustained growth*, institutional factors and New World relief may weigh heavier. Furthermore, the baseline matters. Comparing Britain to the **Chinese average** in 1750 yields one result (Britain looks richer); comparing Britain to the **Yangzi Delta** yields another (living standards look comparable until 1800). Without specifying that we are explaining the *acceleration of growth rates in Lancashire relative to Jiangnan between 1750 and 1850*, the causal factors float freely without anchor.

  **Reframing the Inquiry**
  A well-posed version of the question would be: *"To what extent did the combination of accessible coal and New World land constraints allow Northwest Europe to bypass the organic economy limits that constrained the Yangzi Delta after 1750?"*

  This is well-posed because it specifies the mechanism (bypassing organic economy limits), the regions (Northwest Europe vs. Yangzi), and the timing (post-1750). To settle this, we need **quantitative evidence on land productivity** (calories per acre) in both regions, **shipping manifests** detailing volumetric imports of guano/cotton/timber into British ports versus Chinese ports, and **price data** on substitute goods (e.g., the price of charcoal vs. coal in iron production). This moves the debate from speculative causality to testable constraints on energy and land.

  In conclusion, the "Britain not China" question is only answerable when decomposed. We must stop asking why industrialisation happened *simpliciter*—a single-event problem with no reference class—and start asking why specific constraints were lifted in specific regions at specific times.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **Section A: Foil Sensitivity Analysis (9 Marks)**
  *   **3 Marks:** Correctly identifies that **Coal** works against the Yangzi Delta but fails against North China (must note coal existed in China, just not in the commercial core).
  *   **3 Marks:** Correctly identifies that **Factor Prices** work against Asia generally but fail against Northwest Europe/Low Countries (must note the "European" vs "British" distinction).
  *   **3 Marks:** Correctly identifies that **New World Land** works against Malthusian constraints but fails against Iberian Empires (must note access alone didn't cause industrialisation elsewhere).
  *   *Common Fumble:* Treating "China" as a monolith. If a student says "China had no coal," cap this section at 3/9.

  **Section B: Defining the Explanandum (6 Marks)**
  *   **3 Marks:** Specifies a concrete metric (e.g., mechanisation, GDP, energy capture) rather than using "industrialisation" as a blanket term.
  *   **3 Marks:** Specifies a timeframe and baseline (e.g., 1750–1850, Yangzi vs. Lancashire).
  *   *Common Fumble:* Failing to realise that changing the metric changes the cause. If they treat industrialisation as a single event starting in 1760 regardless of measurement, cap at 3/6.

  **Section C: Reframing and Evidence (6 Marks)**
  *   **3 Marks:** The rewritten question is narrower and testable (avoids "Why Britain/China" binary).
  *   **3 Marks:** Proposed evidence is specific (e.g., shipping manifests, calorie counts) rather than generic ("look at archives").
  *   *Common Fumble:* Rewriting the question to be moralistic ("Was colonialism good?") or too broad ("Why did the modern world begin?").

  **Section D: Argumentative Coherence (4 Marks)**
  *   **4 Marks:** The essay flows logically; the critique of the question informs the rewritten version.
  *   *Common Fumble:* Treating the three sections as disjointed lists.

  **Penalties / Red Flags (Apply deductions from Total)**
  *   **-5 Marks:** **Reciting Causes:** Simply listing why coal/wages/empire caused industrialisation without analyzing the *contrastive* logic.
  *   **-5 Marks:** **Eurocentrism Stopper:** Declaring the question "Eurocentric" and stopping there without analyzing the methodological structure.
  *   **-5 Marks:** **Overdetermination Fatalism:** Arguing "it happened once so we can't know," thereby refusing to answer the prompt.
  *   **-5 Marks:** **Wrong Explanandum:** Answering "Why industrialisation happened at all" instead of "Why here rather than there."

  **Differentiation: First Class (20-25) vs. 2:1 (15-19)**
  To secure a **First**, the student must grasp the "single event" problem implicitly. They should acknowledge that because industrialisation happened once, we are dealing with necessary conditions vs. sufficient conditions, and their rewritten question should reflect an attempt to create a *comparative reference class* (e.g., comparing regions with coal that didn't industrialise, rather than just Britain vs. China). A **2:1** will correctly identify the foil sensitivities (Section A) but may struggle to construct a truly testable rewritten question in Section C, perhaps falling back on a slightly narrower version of the original binary rather than a structural reformulation. The First class answer treats the *question* as the object of historical scrutiny; the 2:1 treats the *history* as the object of scrutiny.
