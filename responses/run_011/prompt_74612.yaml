answer: |-
  ### Desiderata for Reference-Class Construction

  **1. Individuation and Outcome Lock**
  *   **Requirement:** The definition of the entity (individuation) and the definition of its termination (outcome) must be fixed in writing before any historical data is gathered or classes proposed.
  *   **Motivation:** Prevents moving the goalposts. If you decide whether the Papacy counts as "Rome" after seeing how it changes the average lifespan, you are fitting the history to the number, not the number to the history.
  *   **Status:** **Non-negotiable.** Without this, the exercise is narrative therapy, not forecasting.

  **2. The Relevance-over-Power Rule**
  *   **Requirement:** When choosing between a wide class (large N, low relevance) and a narrow class (small N, high relevance), the procedure must select the narrowest class that retains a minimum sample size (e.g., N≥5), prioritizing structural similarity over statistical power.
  *   **Motivation:** Using "all states since 3000 BC" to forecast the "US Constitutional Order" drowns the signal in noise. The base rate of "polities" is useless for "liberal democracies with nuclear weapons."
  *   **Status:** **Non-negotiable.** In this domain, false precision from large N is more dangerous than honest uncertainty from small N.

  **3. Explicit Censoring Protocol**
  *   **Requirement:** The procedure must specify how to treat entities still alive at the cutoff date. They cannot be counted as "completed lifespans." They must be treated as lower-bound estimates or handled via survival functions.
  *   **Motivation:** Counting the UK (alive) as a completed data point alongside the Ming Dynasty (dead) biases the average lifespan downward artificially. Alive is not a duration; it is a state.
  *   **Status:** **Non-negotiable.** This is basic statistical hygiene; ignoring it invalidates the arithmetic.

  **4. The "This Time is Different" Burden**
  *   **Requirement:** Any adjustment to the base rate based on modern uniqueness (nukes, internet, global trade) requires a mechanistic explanation of *how* that factor alters the failure mode, not just an assertion that it does.
  *   **Motivation:** Prevents hand-waving away inconvenient base rates. If you claim nukes make states immortal, you must model why deterrence prevents the specific collapse mechanisms seen in the reference class.
  *   **Status:** **Non-negotiable.** Without this, the base rate is ignored whenever it becomes uncomfortable.

  **5. Pre-registrable Class Construction**
  *   **Requirement:** The algorithm for selecting the class (the inclusion/exclusion criteria) must be writable before seeing the resulting survival times. You must be able to verify post-hoc that the class wasn't tweaked to move the number.
  *   **Motivation:** Prevents "class hacking." If you can tweak the definition of "empire" until the average lifespan matches your intuition, you have anchored, not forecasted.
  *   **Status:** **Non-negotiable.** This is the only way to enforce Requirement 1 and 2 objectively.

  **6. Combination Rule for Overlapping Classes**
  *   **Requirement:** The procedure must specify how to aggregate predictions when an entity falls into multiple valid classes (e.g., "Democracy" and "Federal State"). Either pick the most specific via Rule 2, or specify a weighting scheme.
  *   **Motivation:** Entities are multidimensional. Ignoring this forces false uniqueness; averaging blindly dilutes signal.
  *   **Status:** **Taste/Camp.** Different statistical camps handle this differently (model averaging vs. selection). As long as the rule is fixed pre-hoc, the specific choice is methodological preference.

  **7. Base Rate as Prior, Not Posterior**
  *   **Requirement:** The output must be explicitly labeled as a prior probability distribution, not a final forecast. The procedure must specify a maximum update strength allowed by case-specific evidence.
  *   **Motivation:** Prevents the base rate from becoming a ceiling or floor. If the base rate says 50% and your analysis says 90%, you need a rule for how much trust to place in your analysis vs. the history.
  *   **Status:** **Non-negotiable.** Confusing a prior with a forecast is a category error.

  **8. Feasibility (One Person/Afternoon)**
  *   **Requirement:** The procedure must be executable by a single analyst with standard tools in a single work session.
  *   **Motivation:** If it requires a team of statisticians and a week of compute, it won't be used consistently across many forecasters.
  *   **Status:** **Taste/Feasibility.** This is the first constraint to sacrifice if it conflicts with Statistical Rigor (Requirements 3 & 6).

  ---

  ### The Trade-Off Triangle

  You are correct to suspect a triangle, but the vertices are **Specificity**, **Sample Size**, and **Stationarity**. You cannot have all three.
  *   **Specificity:** Defining the class narrowly enough to be relevant (e.g., "Nuclear Liberal Democracies").
  *   **Sample Size:** Having enough data points to calculate a stable mean.
  *   **Stationarity:** Assuming the past mechanisms of failure apply to the future.

  For this project, you must sacrifice **Sample Size**. High Specificity is required for the forecast to be meaningful (otherwise you're forecasting "polities" generally). High Stationarity is required to use history at all. This leaves you with tiny N (often single digits). You cannot fix this with math; you must accept wide uncertainty intervals. Do not try to engineer a larger N by widening the class; that sacrifices Specificity and invalidates the forecast. The "Runnable" requirement (Desideratum 8) is the casualty here: handling tiny N with proper censoring and uncertainty usually demands more than an afternoon of spreadsheet work if done rigorously.

  ### The Single Kill Shot

  **Pre-registrable Class Construction (Desideratum 5).**
  This is the requirement that kills the most bodies. In practice, almost all bad base-rate forecasting happens at the moment of class selection. Analysts intuitively feel the answer they want, then scan history for a category that yields that number ("The US is like Rome," "The US is like Britain"). By forcing the inclusion criteria to be written down before the survival times are calculated, you remove the ability to tune the class to the outcome. It turns motivated reasoning into a verifiable protocol violation. Individuation (Desideratum 1) is foundational, but Pre-registration is the enforcement mechanism that stops the cheating.

  ---

  ### Evaluation of Approaches

  (a) **Naive average of lifespans:** This fails immediately on censoring and individuation. It treats alive entities as dead, drastically underestimating lifespan, and assumes the class was chosen correctly without verification. It produces a precise number that is confidently wrong. It violates the Explicit Censoring Protocol and invites class hacking.

  (b) **Survival analysis / hazard curves:** This handles censoring correctly and provides uncertainty intervals, satisfying the statistical hygiene requirements. However, it typically assumes stationarity—that the hazard rate today is comparable to the hazard rate in 1800. It struggles with the "This Time is Different" burden unless covariates are explicitly modeled, which often requires more data than exists.

  (c) **Hierarchical Bayesian model:** This is theoretically superior for combining overlapping classes and borrowing strength from related groups without diluting specificity. It handles small N better than frequentist methods. However, it violates the Feasibility constraint heavily and requires priors that are themselves subject to the reference class problem. It solves the math but complicates the audit.

  (d) **Crowd median:** This outsources the reference class problem to the crowd. It aggregates bias rather than removing it; if everyone picks the wrong class, the median is confidently wrong. It satisfies Feasibility but fails Pre-registrable Class Construction entirely. It is a forecasting method, not a base-rate construction procedure.
