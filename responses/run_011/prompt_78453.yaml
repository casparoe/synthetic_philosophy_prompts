answer: |-
  You are stuck because you are conflating three distinct modalities: **metaphysical possibility** (could a God know it?), **epistemic access** (do traces exist?), and **logical consistency** (does the proposition contradict knowledge?). Fitch's paradox exploits the gap between these. Your friend's jab works because you are treating "knowability" as a single property when your verdicts rely on it shifting meaning between cases.

  Here are two competing principles that attempt to codify your intuitions, followed by the blunt truth about what you must sacrifice.

  ### Principle 1: Temporal Indexicality (The "1919 Fix")
  This principle restricts knowability to the time at which the truth obtains.

  *   **Formulation:** $\forall t [True(p, t) \to \Diamond K(p, t)]$
      *   *Translation:* For any time $t$, if $p$ is true at $t$, it is possible for someone to know $p$ at $t$.
  *   **Motivation:** Captures your **Great-Grandmother** verdict. The thought was knowable *in 1919* (by her), even if it is not knowable *now*. It treats "knowability" as time-relative, not tenseless.
  *   **Prediction for Private Experience:** A truth known by one person for one minute ($p$ at $t$) is **knowable**. It satisfies the principle because the knowing happens at $t$. Once $t$ passes, the proposition "I am experiencing X" is no longer true, so the principle doesn't apply.
  *   **Fitch Status:** **Blocks the paradox.** The Fitch-conjunction ($p \land \neg Kp$) cannot be known at $t$ because knowing it makes the second conjunct false at $t$. Since the principle only demands knowability for truths, and the conjunction cannot be true *while known*, it drops out of the domain of "knowable truths."
  *   **Weakness:** It fails your **Beach** case. If the beach grains existed at $t_{past}$, why weren't they knowable *at* $t_{past}$? If you say "no one was there to count," you are confusing *being known* with *being knowable*. If a Laplacian demon could have hovered over the beach then, was it knowable? If yes, your intuition that it's "never knowable" is wrong. If no, you need Principle 2.

  ### Principle 2: Metaphysical Stability (The "Beach vs. Arithmetic Fix")
  This principle restricts knowability to truths that are "stable" enough to sustain the relation of knowledge.

  *   **Formulation:** $Stable(p) \to (p \to \Diamond Kp)$
      *   *Definition:* $p$ is Stable iff the truth-maker for $p$ does not vanish without logical trace. (Abstract objects and present contingents are stable; erased past contingents are not).
  *   **Motivation:** Captures your **Beach** vs. **Arithmetic** distinction. Arithmetic truths are eternal/stable (Platonism). The beach grains were contingent and the physical trace is gone (Eliminativism about past contingents).
  *   **Prediction for Private Experience:** **Unknowable (intersubjectively).** If the experience leaves no trace (memory, record, neural imprint) after the minute passes, it is *unstable*. It was knowable *during* the minute (by Principle 1), but not stable enough to be a permanent truth of the world.
  *   **Fitch Status:** **Blocks the paradox.** The Fitch-conjunction ($p \land \neg Kp$) is inherently *unstable*. The moment it is known, it becomes false. Therefore, it fails the $Stable(p)$ clause, and the Knowability Principle never applies to it.
  *   **Weakness:** It requires a heavy metaphysical commitment. You must assert that past empirical facts literally *cease to exist* in a way that numbers do not.

  ### Does Rigidification Help?
  You asked about rigidifying the principle (e.g., "It is knowable that *actually* $p$").
  *   **Formulation:** $p \to \Diamond K(@p)$ (where $@$ fixes the truth value to the actual world).
  *   **Verdict:** **No, it does not solve the 1919 or Beach cases.**
  *   **Why:** Rigidification fixes *reference* across possible worlds, not across *time* or *information loss*.
      *   **1919 Case:** "Actually, my grandmother thought X." This proposition is true now. Rigidification makes it a stable truth about the actual world. If you claim it is *unknowable now*, you are claiming there is a truth about the actual world that is metaphysically inaccessible. Rigidification doesn't bridge the gap of lost evidence; it just freezes the proposition.
      *   **Beach Case:** Same issue. "Actually, the beach had N grains." If this is true, rigidification makes it a fixed target. If you say it's unknowable, you are denying the Knowability Principle for rigidified past contingents. Rigidification doesn't make them knowable; it just makes them stubborn.

  ### The Friend's Jab: Why the Beach Collapses into Arithmetic
  Your friend is right to press you here. Your distinction ("numbers are still there" vs. "beach is gone") relies on **Presentism** (only the present exists) or the **Growing Block** (past exists but is unchangeable/inaccessible) combined with **Platonism**.

  If you are a **Realist about the Past** (the past is just as real as the present, just located elsewhere in spacetime), then the beach fact is "still there" in the block universe, just as the number 7 is "still there" in the realm of abstracta.
  *   **If you keep Realism about the Past:** You must admit the beach count *was* knowable (by a God or time-traveler). Your intuition that it is "never knowable" is false.
  *   **If you keep the "Never Knowable" verdict:** You must deny Realism about the Past. You must claim past contingents lose their truth-value or ontological status once the present moves on.

  ### The Blunt Verdict: What You Must Sacrifice
  You cannot keep all six of your intuitions. They are inconsistent. To resolve this, you must cut one leg off the stool.

  **Option A: Sacrifice the Beach Intuition (Accept Epistemic Optimism)**
  *   **Keep:** Arithmetic is knowable; 1919 thought was knowable *then*.
  *   **Give Up:** The claim that the beach grains are *metaphysically* unknowable.
  *   **Cost:** You must admit that "unknowable" just means "no human has evidence." You must concede that if an omniscient being existed, it *would* know the beach count. Fitch's paradox then bites you harder because you've expanded the set of knowable truths.
  *   **Result:** You become a standard Realist. Fitch's paradox forces you to deny the Knowability Principle entirely for Moore-sentences, but you accept that most empirical truths are knowable in principle.

  **Option B: Sacrifice the Arithmetic Intuition (Accept Anti-Realism)**
  *   **Keep:** Beach is unknowable; 1919 thought is unknowable now.
  *   **Give Up:** The claim that Gödelian truths are "knowable" in the same sense as empirical truths.
  *   **Cost:** You must adopt a Dummettian Anti-Realism. Truth is *constituted* by our ability to verify it. If we can't verify the beach count, it's not true (or lacks a truth value). If we can't prove the Gödel sentence *within the system*, its status is shaky.
  *   **Result:** This dissolves Fitch's paradox most elegantly (by denying Bivalence), but it requires you to stop being a Realist about arithmetic.

  **Option C: Sacrifice the "Cheap Escape" (Accept the Existential)**
  *   **Keep:** Beach unknowable; Arithmetic knowable.
  *   **Give Up:** The worry that knowing "there are unknown truths" is cheap.
  *   **Cost:** None. This isn't a sacrifice; it's a correction. Knowing $\exists x (Unknown(x))$ is **not** knowing $Unknown(c)$. Fitch's paradox proves $p \to Kp$. It does not prove we know *which* $p$ are the unknown ones. Your discomfort here is psychological, not logical.
  *   **Result:** You accept that some truths (Moore-sentences, erased pasts) are permanently unknown. You restrict the Knowability Principle to **Cartesian Propositions** (propositions where $Kp$ does not entail $\neg p$).

  ### Recommendation
  Adopt **Option C** with a **Cartesian Restriction**.

  **The Principle:** $Cartesian(p) \to (p \to \Diamond Kp)$.
  *   **Definition:** $p$ is Cartesian iff $\Diamond Kp$ is consistent. (i.e., $p$ is not a Moore-sentence like "It rains and no one knows").
  *   **Why:** This handles the **Moore-sentence** immediately (it's not Cartesian).
  *   **For the Beach:** If the beach fact is gone, is it Cartesian? If "The beach had N grains" implies no contradiction with knowing it, it *is* Cartesian. So you still have to admit it was knowable *in principle* (Option A).
  *   **For the 1919 Thought:** Same. It was Cartesian *then*.
  *   **For Arithmetic:** Cartesian and stable.

  **Final Blunt Truth:**
  Your friend is right about the Beach/Arithmetic collapse **unless** you are willing to be a metaphysical dualist about time and numbers. You treat numbers as eternal (always accessible) and beach grains as ephemeral (accessible only during existence).
  *   If you hold this view, Fitch's paradox **does not bite** your restricted principle, because the paradox relies on generating a contradiction from *any* truth. If you restrict "any truth" to "stable, Cartesian truths," the Fitch-conjunction ($p \land \neg Kp$) is excluded by definition (it's not stable/Cartesian).
  *   **The Sacrifice:** You must admit that your intuition about the beach ("never knowable") is actually an intuition about **evidence**, not **truth**. Metaphysically, if it happened, it was knowable *at the time*. If you insist it was *never* knowable even then, you are denying that the past was determinate. Pick your poison: either the past was determinate (and thus knowable in principle), or it wasn't (and your Arithmetic Realism is on shaky ground).
