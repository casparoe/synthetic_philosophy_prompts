      *Self-Correction on "Fatal Question":* Needs to be truly fatal. The measurement of non-monetary option value is the weak link. If it can't be measured, it can't guide action better than utility.

      *Check British Spelling:* behaviour, programme, centre, realise, modelling, defence (noun), offence (noun).

      *Check Voices:*
