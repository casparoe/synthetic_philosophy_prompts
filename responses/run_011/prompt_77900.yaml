      *   **Task:** Create a Q&A prep sheet (9 objections) + 3 short prose items.
      *   **Audience:** Interdisciplinary seminar (Economics + Philosophy of Science). Hostile/unfriendly but courteous. Specific attendees: Bayesian decision theorists, behavioural economist, philosopher of probability, retired actuary, finance people, grad students.
