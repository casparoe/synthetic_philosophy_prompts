      *Okay, ready to write.*

      *Word Count Check:* Replies need to be ~150 words. I will monitor this closely.
      *Column Check:* rank, source, objection, force, concede, hold, reply, soft_spot.

      *Tone Check:* Unsentimental. "I would far rather meet the objection that sinks me now".

