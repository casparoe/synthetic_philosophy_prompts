      *   **Tone:** Unsentimental, British English, no bibliography, truthful map of weak points.
      *   **Constraints:** Exactly 9 objections. Rank by likelihood × damage. First-person phrasing for objections. Specific columns (rank, source, objection, force, concede, hold, reply, soft_spot). Include one correct objection to concede outright. Include one challenge to standing/competence.
