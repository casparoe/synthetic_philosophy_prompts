answer: |-
  **MEMORANDUM**

  **TO:** The Advisory Board
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Framework for Expert Probability Aggregation

  **1. Purpose and Executive Summary**

  Next month, this Board must publish a single probability figure regarding canister corrosion. This figure determines whether irreversible engineering omissions are permitted. The draft guidance proposes selecting a pooling method based on "epistemic accuracy," intending to let the mathematics dictate the procedure. This memo argues that such an appeal is illusory. Mathematics cannot select the metric by which accuracy is measured. Consequently, the Board must make an explicit policy choice. I recommend we adopt the **Arithmetic Mean** of the expert estimates as our primary pooling rule. Should the Board reject this, the fallback position shall be the **Median**. Instructions for the Secretariat to execute these calculations are provided in Section 6.

  **2. The Relativity of Accuracy Measures**

  The draft guidance suggests we choose the method that minimises expected inaccuracy. This presupposes that "inaccuracy" is a singular, objective quantity. It is not. In technical terms, we must select a "scoring rule" to penalise errors. Different rules penalise errors differently, leading to different optimal aggregation methods.

  If we adopt a quadratic scoring rule—which penalises errors based on the squared distance from the truth—the mathematically optimal aggregation is the **Arithmetic Mean** (the standard average: add the numbers and divide by seven). If we adopt a logarithmic scoring rule—which penalises under-confidence in true outcomes much more severely—the optimal aggregation is the **Geometric Mean** (multiply the numbers and take the seventh root).

  This distinction is not trivial. In our current panel, the Arithmetic Mean yields a result driven by the cluster near 0.02 and the outliers near 0.40. The Geometric Mean, however, is disproportionately dragged toward the smallest number. The corrosion chemist's estimate of 0.000005 would effectively veto the higher estimates, collapsing the published probability toward zero. Both rules are "strictly proper," meaning both are mathematically legitimate measures of accuracy. Therefore, the instruction to "be accurate" does not resolve the choice. It merely shifts the decision to the selection of the scoring rule. By hiding this selection behind technical guidance, we conceal the value judgment: do we treat probability as a frequency share (Arithmetic) or as a betting odds ratio (Geometric)?

  **3. The Single-Event Epistemological Problem**

  Proper scoring rules derive their authority from long-run performance. A method is "accurate" if, over thousands of forecasts, it minimises cumulative penalty. We face a single, unrepeatable event on a timescale exceeding human civilisation. There will be no feedback loop. We will never know if the canister failed or succeeded within the compliance period in time to adjust our methods.

  Because we cannot calibrate against future frequency, we cannot claim one scoring rule is empirically superior for this specific case. We are not managing a portfolio of risks where errors average out; we are managing a singular moral hazard. In the absence of long-run verification, the choice of scoring rule becomes a choice of risk posture. The logarithmic rule assumes that being confidently wrong about a safe outcome is worse than being cautiously wrong about a dangerous one. The quadratic rule treats over-estimation and under-estimation more symmetrically. Given the statutory mandate to protect public health, symmetry is preferable to the asymmetry that privileges near-zero estimates.

  **4. Justification to Dissenters and Self-Scoring**

  A core tenet of accuracy-first theory is that an agent scores her opinions by her own lights. For an individual, this is coherent. For a Committee, it is fraught. If we publish a number derived from the Arithmetic Mean, the chemist can rightly claim we have scored his opinion by *our* lights, not his. He believes the logarithmic measure reflects the physical chemistry; we are imposing a quadratic measure for regulatory stability.

  Does this undermine the rationality of our decision? It would, if our only goal were abstract truth-tracking. But our goal is regulatory justification. We must justify the published figure to a public that does not share our technical measures. If we adopt the Geometric Mean, we must justify to the public why a single expert's near-zero estimate neutralised six others. If we adopt the Arithmetic Mean, we must justify to the chemist why his specific data was diluted.

  The self-undermining worry bites only if we claim the Arithmetic Mean is the "true" probability. We must not claim that. We must claim it is the **responsibility-weighted** probability. We are not reporting the state of the universe; we are reporting the state of our consensus under a duty of care. By explicitly acknowledging that the pooling rule is a policy choice, we avoid the pretense that the mathematics absolved us of the burden of judgment.

  **5. The Case for the Rejected Option**

  I recommend rejecting the Geometric Mean (and thus the logarithmic scoring rule). However, the case for it is strong and must be recorded.

  First, the chemist may be right. In scientific inquiry, truth is not democratic. If one expert possesses unique data regarding corrosion kinetics that the others lack, averaging his estimate with theirs swamps signal with noise. The Arithmetic Mean treats all opinions as equally weighted samples from a population, which assumes a symmetry of information that may not exist.

  Second, there is a serious incentive problem. If experts learn that outlier estimates are mathematically diluted by averaging, they may feel pressured to moderate their views to influence the mean. Conversely, under a Geometric Mean, an expert knows that a sufficiently low estimate will dominate the result. This encourages candour. An expert who believes a risk is negligible should not be forced to compromise that belief to reach a consensus. By rejecting the Geometric Mean, we risk creating a culture of consensus-seeking rather than truth-telling. Future panels might suppress legitimate minority views to avoid being the "veto" or the "outlier." We must ensure the meeting minutes record that the chemist's dissent was noted as a product of specific chemical data, not merely statistical noise.

  **6. Recommendation and Execution Instructions**

  Despite the risks of swamping minority views, the regulatory context demands precaution. The Geometric Mean's sensitivity to near-zero values creates a pathway to declare safety based on a single dissent, which is incompatible with the irreversible nature of the decision.

  **Primary Recommendation:** Adopt the **Arithmetic Mean**.
  **Fallback:** If the Board deems the Arithmetic Mean too sensitive to the high-end outliers (the 0.40 cluster), adopt the **Median** (the middle value when sorted).

  **Instructions for the Secretariat:**
  1.  **For Arithmetic Mean:** Sum the seven probability estimates provided by the experts. Divide the total by seven. Publish this result to the required significant figures.
  2.  **For Median:** Arrange the seven estimates from lowest to highest. Select the fourth number. Publish this result.
  3.  **Documentation:** Regardless of the method chosen, the internal record must preserve the full range of estimates.

  **7. Future Review and Statutory Constraints**

  The statute requires a single number. It does not, however, forbid publishing the uncertainty bounds in a technical annex. We should not publish the dispersion as the *decision* value, but we must publish it as *context*.

  How will we know at the next quinquennial review if we chose wrongly? We cannot know if the probability was "correct." We can only know if the process was robust. We will have chosen wrongly if:
  1.  New physical evidence emerges that validates the chemist's specific mechanism, rendering the averaging method scientifically obsolete.
  2.  The dispersion of expert opinion widens in future reviews while our aggregation method remains rigid, indicating we are masking growing uncertainty with false precision.

  If the canister performs as predicted, we will not know if we were right or lucky. If it fails, we will know we were wrong, but not necessarily that the aggregation method was the cause. Therefore, the only metric available to us is the integrity of the dissent. If the minority view is systematically excluded from the record, the procedure has failed.

  **8. Conclusion**

  We cannot outsource our responsibility to a scoring rule. The choice between Arithmetic and Geometric pooling is a choice between treating probability as a shared risk burden or as a contest of competing hypotheses. For a national regulator managing irreversible hazards, the former is the only defensible position. We must average the risk, not gamble on the lowest estimate. I move that we adopt the Arithmetic Mean, record the dissent explicitly, and publish the dispersion in the technical annex to satisfy both the statute and the demands of epistemic honesty.
