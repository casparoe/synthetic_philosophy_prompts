prompt: |-
  For like fifteen years now I've been reading the rationalist blogs — LW, the sequences, SSC, the forecasting forums — and three years ago I finally built the thing I kept wishing existed: a public register of open questions and known unknowns. People submit entries, we list them, researchers and forecasters mine the list for projects. It's gone okay but the intake side is a mess and I think I've found out why.

  We get about forty submissions a month. Six volunteers screen them, none with any philosophy background (one's a nurse, two are undergrads, one does infosec). Ten minutes per submission is the budget, and I sign off on anything they escalate. Entries are public, permanent, and indexed by search engines — we dont quietly retract, because a register you can edit after the fact isn't a register.

  Here's the problem. Our intake form has a checkbox that says, roughly, that the submitter takes their entry to be in principle knowable by someone — the idea being that if it isn't knowable its not an open question, it's just noise. Then I went and reread about Fitch's paradox of knowability, the result that apparently came out of an anonymous referee report in the 40s (Church, they found out later) and got published by Fitch in the 60s: if every truth is knowable then every truth is already known, because the particular claim "p is true and nobody knows p" can't be known by anyone without thereby going false. Which means our checkbox is doing something much weirder than I thought, and the exact class of entries I find most interesting — the ones about what nobody knows — might be the unhostable class.

  So: write me a screening procedure my volunteers can actually run. Questions in order, what counts as a sufficient answer to each, the exits (reject / rewrite and resubmit / accept / escalate to me), and which steps are judgment calls wearing a procedure costume — say so out loud instead of dressing them up.

  It has to do these things:

  - Sort "nobody knows this" into the kinds that are genuinely different: ordinary unknowns; unknowns that are contingently out of reach (records burned, private states of people who are dead); unknowns that are Fitch-style, where knowing the entry would falsify it; and unknowns that get destroyed by being published (the dual-use security case). Plain-English tests for each, no modal logic — these people have never seen a diamond operator and shouldn't have to.
  - Tell me what to do with the checkbox: keep, kill, or rewrite into something actually true. And tell me whether every accepted entry has to be indexed to a date and to a named community of knowers, because I suspect "nobody" is doing a lot of unearned work.
  - Say which premises of the Fitch argument are load-bearing for whatever you land on, which distinctions absolutely have to survive the compression into a ten-minute checklist, and which ones I can throw away without the procedure quietly becoming something else.
  - Say where the analogy breaks. Fitch is about truth and knowability, not about publishing lists, and I don't want a procedure that smuggles in a philosophical result it hasn't earned.

  Then run it on three submissions:

  1. Infosec person: there's a memory-safety bug in a widely deployed open-source library, nobody outside the vendor knows, and no attacker has found it yet.
  2. Grad student: nobody currently knows whether the headline effect in a well-known failed replication was real or an artifact of the original analysis pipeline.
  3. Mine, which I've been sitting on for a year because I knew it was trouble: there is at least one true claim about the causes of the 2008 crisis that no living person knows and that no surviving record could ever support.

  On 3 be blunt. I expect the procedure to make me throw out my favorite entry, and if it does I want the reasoning, not a cushion.

  Finish with what the procedure can't do: the false positives it'll generate, the entries it'll wrongly wave through, and the cases where a volunteer genuinely can't tell and I have to be the one who decides.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the User and Context:**
      *   **User Profile:** Long-time rationalist reader (LW, SSC, etc.), builder of a public register of open questions/known unknowns. Pragmatic but philosophically aware.
      *   **The Project:** A public, permanent, indexed register of open questions. Submissions are public and permanent (no quiet retractions).
      *   **The Problem:** The intake checkbox ("this is in principle knowable") triggers Fitch's Paradox of Knowability issues. If *every* truth is knowable, then *every* truth is known. Therefore, claims like "p is true and nobody knows p" are unknowable (because knowing them makes them false). The user suspects their most interesting entries (about what nobody knows) might be logically unhostable under the current criteria.
      *   **The Volunteers:** 6 volunteers, non-philosophers (nurse, undergrads, infosec), 10 minutes per submission budget.
      *   **The Task:** Create a screening procedure (questions, criteria, exits) that handles Fitch-style issues without requiring modal logic, addresses the checkbox, identifies load-bearing premises, tests three specific submissions, and admits limitations.

  2.  **Deconstruct Fitch's Paradox in this Context:**
      *   *Fitch's Result:* $\forall p (p \to \diamond K p) \to \forall p (p \to K p)$. (If all truths are knowable, all truths are known).
      *   *The specific trouble:* The proposition $p \land \neg K p$ ("p is true and nobody knows p"). If someone knows this conjunction, they know $p$, making $\neg K p$ false. So the conjunction is unknowable.
      *   *Application to the Register:* The register hosts "Open Questions" or "Unknowns." If an entry is "X is true but no one knows X," publishing it makes it known (at least to the readers).
      *   *Crucial Distinction:* Fitch applies to *truths*. The register hosts *questions* or *claims about the state of knowledge*.
      *   *Resolution:* The register shouldn't host "Unknown Truths" as if they are static objects. It should host "Epistemic Gaps." The paradox arises if we claim "This specific truth is *permanently* unknowable" or if the act of recording it changes its truth value immediately.
      *   *The "Nobody" Problem:* "Nobody knows" is indexical and temporal. It means "Nobody knows *right now*." Fitch attacks "Nobody *ever* knows." The register needs to be clear about the temporal scope.

  3.  **Drafting the Screening Procedure:**
      *   *Goal:* 10-minute screen, non-philosophers.
      *   *Structure:* Triage questions, Decision Tree, Exits.
      *   *The Checkbox:* Needs rewriting. "In principle knowable" is too strong (implies Fitch). Better: "Resolvable in principle" or "Currently unknown but potentially discoverable."
      *   *Categories of Unknowns:*
          1.  *Ordinary:* We don't know yet, but could (e.g., Riemann Hypothesis).
          2.  *Contingently Lost:* Records burned, people dead. (Hard to verify, but distinct).
          3.  *Fitch-style/Self-Falsifying:* "Nobody knows X." If we publish "Nobody knows X," now we know "Nobody knows X" is the claim, but do we know X? Usually, these are claims *about* knowledge states.
          4.  *Dual-Safety/Security:* Publishing the unknown makes it dangerous (e.g., vuln details).
      *   *Load-Bearing Premises:*
          1.  Temporal indexicality ("Nobody knows *yet*").
          2.  Distinction between the *question* and the *answer*.
          3.  Distinction between *knowing the question exists* and *knowing the answer*.
      *   *Analogy Break:* Fitch is about metaphysical knowability of truths. The register is about sociological tracking of ignorance. We don't need to solve Fitch; we need to avoid hosting logical contradictions.

  4.  **Refining the Procedure (Iterative Process):**
      *   *Constraint:* Volunteers have 10 mins. No logic symbols.
      *   *Step 1: The "Nobody" Check.* Is "nobody" defined? (e.g., "no living person," "no public record").
      *   *Step 2: The "Publishing" Check.* Does writing this down solve it or break it?
      *   *Step 3: The "Truth" Check.* Are they claiming a specific truth exists, or just that a gap exists?
      *   *The Checkbox:* Change to "This gap could theoretically be closed by evidence or reasoning, even if it currently isn't."
      *   *Indexing:* Yes, must index to date and community. "Nobody" = "Nobody in Community C as of Date D."

  5.  **Testing the Submissions:**
      *   *1. Infosec Bug:*
          *   Type: Dual-use/Security.
          *   Issue: Publishing the *question* ("Is there a bug?") is fine. Publishing the *answer* ("Here is the bug") is dangerous.
          *   Verdict: Accept as a "Vulnerability Hunt" question, not a "Here is the truth" entry.
      *   *2. Grad Student (Replication):*
          *   Type: Ordinary Unknown.
          *   Issue: Standard empirical gap.
          *   Verdict: Accept.
      *   *3. User's Entry (2008 Crisis):*
          *   Claim: "True claim... no living person knows... no surviving record could ever support."
          *   Analysis: This claims *permanent* unknowability (records gone, people dead). If no record supports it, how can it be known? It claims to be a truth that is *in principle* unknowable (violates the "knowable" premise).
          *   Fitch angle: If it's true, can it be known? The submitter says "no surviving record could ever support." That implies it's unknowable.
          *   Verdict: Reject. It's a metaphysical claim, not a research question. It violates the "in principle resolvable" criterion.

  6.  **Addressing the "Blunt" Requirement:**
      *   For Submission 3, I need to be direct. The user expects rejection. I must explain *why* without softening. It's a claim of permanent ignorance, which defeats the purpose of a register meant to be mined for projects.

  7.  **Finalizing the Limitations:**
      *   False Positives: Things that look solvable but aren't.
      *   False Negatives: Weird edge cases (like Fitchian truths) that get rejected but might be interesting philosophically.
      *   Escalation: When the volunteer is unsure about the "in principle" status.

  8.  **Review against Constraints:**
      *   10-minute budget? Yes, keep questions simple.
      *   Non-philosophers? Yes, avoid modal logic terms.
      *   Address Fitch? Yes, by focusing on temporal indexicals.
      *   Address Checkbox? Yes, rewrite it.
      *   Address Indexing? Yes, require date/community.
      *   Run on 3 submissions? Yes.
      *   Blunt on #3? Yes.
      *   Finish with limitations? Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, does Fitch actually apply to Submission 3?* Submission 3 says "no surviving record could ever support." That means it's *unknowable*. Fitch says "If all truths are knowable..." This entry claims "This truth is *not* knowable." So it doesn't trigger the paradox directly, it just violates the *purpose* of the register (which is to list *open* questions, i.e., resolvable ones). The Fitch connection is that the user worried "nobody knows" entries are unhostable. Submission 3 is a "nobody knows" entry that is *permanently* nobody knows. That's the real killer.
      *   *Refining the Fitch explanation for volunteers:* Don't explain the proof. Explain the *trap*: "If writing it down makes it false, don't write it."
      *   *Refining the Checkbox:* The original checkbox was "in principle knowable." The problem is that "p & ~Kp" is not knowable. So asking submitters to affirm knowability for *that specific claim* is asking them to affirm a falsehood. The fix is to shift focus from the *claim* to the *underlying fact*. "Is the underlying fact knowable?" not "Is the statement 'nobody knows this' knowable?"

  10. **Final Polish:** Ensure tone matches the user (rationalist, precise, slightly weary but committed). Use clear headings.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Reject #3 because it's unknowable." I need to link it to the procedure's specific filter. The filter is "Can this be resolved?" If the submitter admits no record exists and people are dead, the answer is "No."

  *(Another thought)*: The user asked about indexing to a "named community of knowers." I should endorse this. "Nobody" is too vague. "Nobody in the CDC" is better.

  *(Final check on Fitch)*: Fitch's paradox shows that *some* truths are unknowable (specifically conjunctions of truth and ignorance). The register should avoid hosting *those specific conjunctions* as the primary object of inquiry. It should host the *p*, not the *p & ~Kp*.
  *Correction:* Actually, the register hosts "Open Questions." An open question *is* effectively "What is the value of X?" where X is unknown. Fitch attacks "It is known that (X is true and X is unknown)." The register shouldn't claim to *know* the conjunction. It should just claim "X is currently unknown."
  *Decision:* The procedure must distinguish between "We don't know X" (safe) and "It is impossible to know X" (unsafe/useless) and "Knowing that we don't know X falsifies the state" (Fitch-trap).
  Actually, for the volunteers, the simplest heuristic is: "Does solving this require the ignorance to persist?" If yes, reject.

  Let's write it.cw
answer: |-
  ## The Screening Procedure (v1.0)

  **Goal:** Filter submissions for the Register of Open Questions in ≤10 minutes.
  **Operators:** Volunteers (no philosophy background required).
  **Constraint:** Entries are permanent and public. Do not host logical contradictions or permanently unresolvable claims.

  ### Part 1: The Checkbox (Rewrite Required)

  **Kill the current checkbox.** It asks submitters to affirm a logical falsehood in certain cases (per Fitch).
  **Replace with:**
  > "I affirm that the *answer* to this question is not logically prohibited from being discovered, even if it is currently unknown to me or my community."

  **Why:** This shifts the burden from the *statement of ignorance* (which can be self-falsifying) to the *underlying fact* (which should be resolvable). It allows us to host "What is the bug?" without hosting "It is true that no one knows the bug" as a permanent metaphysical state.

  ### Part 2: The Indexing Requirement

  **Yes, every entry must be indexed.** "Nobody" is a logical trap.
  **Requirement:** Each entry must carry two metadata tags:
  1.  **Temporal Index:** "Unknown as of [Date]."
  2.  **Community Index:** "Unknown to [Defined Group]." (e.g., "The public," "The vendor," "Living witnesses," "The broader academic community").

  **Why:** This defuses Fitch. "Nobody knows X" is dangerous. "The public did not know X on Jan 1, 2024" is a historical fact that remains true even after publication.

  ### Part 3: The 10-Minute Triage Checklist

  Volunteers run these four questions in order. If any answer triggers a **REJECT**, stop and file the rejection note.

  **Q1: The "Writing It Down" Test (Fitch/Self-Falsification)**
  *   *Ask:* If we publish this entry, does that act alone make the claim false or the question vanish?
  *   *Pass:* Publishing the question does not solve it. (e.g., "What is the population of X?")
  *   *Fail:* Publishing the question answers it or destroys the state required for it to be true. (e.g., "What is a secret that literally no one knows?" — publishing it means someone knows.)
  *   *Exit:* **FAIL → Reject.** (Reason: Self-falsifying premise).

  **Q2: The "In Principle" Test (Resolvability)**
  *   *Ask:* The submitter claims records are lost or people are dead. Is there *any* theoretical way to verify this, or are they claiming it is permanently unknowable?
  *   *Pass:* Evidence could exist (buried archives, forensic reconstruction, new data).
  *   *Fail:* Submitter explicitly states no evidence *could* exist (e.g., "No surviving record could ever support this").
  *   *Exit:* **FAIL → Reject.** (Reason: Not a research question; it's a metaphysical claim).

  **Q3: The "Dual-Use" Test (Safety)**
  *   *Ask:* Does the *question itself* reveal sensitive information that enables harm?
  *   *Pass:* Asking the question is safe. (e.g., "Is there a vulnerability in Library X?")
  *   *Fail:* Asking the question points attackers to the exploit. (e.g., "How do I trigger the buffer overflow in function Y?")
  *   *Exit:* **FAIL → Rewrite/Resubmit.** (Instruct submitter to generalize the question to a safety-safe abstraction).

  **Q4: The "Nobody" Test (Indexing)**
  *   *Ask:* Has the submitter defined *who* doesn't know?
  *   *Pass:* "Unknown to the public," "Unknown to the vendor," "Unknown to historians."
  *   *Fail:* "Unknown to anyone, ever," "Unknown to humanity" (without temporal limit).
  *   *Exit:* **FAIL → Rewrite/Resubmit.** (Instruct submitter to add Date and Community tags).

  ---

  ### Part 4: Load-Bearing Premises & Judgment Calls

  **Load-Bearing Premises (Do Not Compress):**
  1.  **Temporal Indexicality:** You must distinguish between "Unknown *now*" (hostable) and "Unknown *forever*" (unhostable). This is the only way to avoid Fitch without modal logic.
  2.  **Question vs. Answer:** The register hosts *questions* (gaps), not *claims of ignorance* as static truths.
  3.  **Resolvability:** If the submitter claims the gap *cannot* be closed (even in principle), it is not an open question; it is a closed door.

  **Judgment Calls Wearing Procedure Costumes (Admit These):**
  1.  **The "Theoretical Way" in Q2:** Determining if something is "in principle" knowable when records are burned is a guess. Volunteers will rely on intuition. *Mitigation:* Escalate any submission where the submitter argues "evidence is gone" but claims "it's still knowable."
  2.  **The Dual-Use Boundary in Q3:** Distinguishing between "safe question" and "dangerous hint" is subjective. *Mitigation:* Escalate all infosec submissions by default.
  3.  **The "Community" Definition:** Deciding if "The Rationalist Community" counts as a valid index tag vs. "The Public." *Mitigation:* Accept any coherent definition, but flag vague ones for later cleanup.

  **Where the Analogy Breaks:**
  Fitch's Paradox applies to *omniscience* and *metaphysical truth*. You are running a *sociological tracker*. You do not need to solve the paradox. You only need to ensure your database doesn't store contradictions. The procedure above treats Fitch not as a logical proof to be respected, but as a data-integrity error to be caught. If an entry becomes false upon entry, it's bad data.

  ---

  ### Part 5: Running the Procedure on Your Submissions

  #### 1. Infosec Person: Memory-safety bug in open-source library.
  *   **Q1 (Writing It Down):** Pass. Publishing "Is there a bug?" does not reveal the bug.
  *   **Q2 (In Principle):** Pass. Code is auditable.
  *   **Q3 (Dual-Use):** **CAUTION.** If the title is "Buffer Overflow in LibX Function Y," that's a hint. If it's "Audit Target: LibX," it's safe.
  *   **Q4 (Nobody):** Needs indexing. "Unknown to Vendor" vs "Unknown to Public."
  *   **Verdict:** **Rewrite and Resubmit.**
      *   *Instruction:* Generalize the title. Do not name the specific function or vulnerability class. Index as "Unknown to Vendor as of [Date]." This turns it into a bounty hunt, not a leak.

  #### 2. Grad Student: Headline effect in failed replication.
  *   **Q1 (Writing It Down):** Pass. Publishing the question doesn't change the past data.
  *   **Q2 (In Principle):** Pass. Data can be re-analyzed.
  *   **Q3 (Dual-Use):** Pass.
  *   **Q4 (Nobody):** Pass. "Unknown to the replication team" or "Unknown to the field."
  *   **Verdict:** **Accept.**
      *   *Note:* Standard empirical gap. Exactly what the register is for.

  #### 3. Yours: True claim about 2008 crisis, no living person knows, no record supports.
  *   **Q1 (Writing It Down):** Pass. Publishing the question doesn't reveal the cause.
  *   **Q2 (In Principle):** **FAIL.**
      *   *Reasoning:* You explicitly state: "no surviving record could ever support." If no record supports it and no living person knows it, you are asserting that the evidence *does not exist*. If the evidence does not exist, the truth is not *in principle* knowable. It is permanently lost.
  *   **Q4 (Nobody):** **FAIL.** "No living person knows" is a temporal claim, but combined with "no record could ever support," it becomes a permanent claim.
  *   **Verdict:** **Reject.**
      *   *Blunt Reasoning:* You are asking the register to host a claim that *by your own admission* cannot be resolved. This is not an open question; it is a eulogy for information. If no record exists and no witness lives, there is no project a researcher can mine from this. There is no forecast to make. It is a statement of permanent ignorance. Hosting it violates the "In Principle" filter (Q2). It turns the register into a cabinet of curiosities rather than a tool for discovery. You knew it was trouble because it admits defeat. Don't publish defeat as a project.

  ---

  ### Part 6: What This Procedure Cannot Do

  **1. False Positives (The "Zombie" Questions):**
  The procedure will let through questions that *seem* resolvable but aren't. Example: "What was the exact private thought process of Author X in 1990?" Records exist, but they are incomplete. Volunteers will mark this "Pass" on Q2. You will end up with entries that look like projects but are actually dead ends.
  *   *Mitigation:* You cannot fix this at intake. This requires post-hoc curation or a "stale" tag after 2 years of no progress.

  **2. The "Secretly Known" Problem:**
  The procedure relies on the submitter's honesty about who knows what. A submitter might claim "Nobody knows this" to gain prestige, when in fact their lab knows it already.
  *   *Mitigation:* The Community Index helps, but you cannot verify negative knowledge claims in 10 minutes. Accept that some entries will be "scooped" silently.

  **3. The Escalation Bottleneck:**
  I flagged Infosec and "Burned Record" cases for escalation to you. If you get 40 submissions a month, and 25% are edge cases, you will spend 2.5 hours a week doing the very thinking you tried to outsource.
  *   *Mitigation:* If your time budget is blown, tighten Q2. Default to "Reject" on any claim of lost records. Force submitters to argue *why* it's recoverable in the text, rather than asking volunteers to judge it.

  **4. The Fitch Remainder:**
  This procedure avoids the *practical* contradiction (publishing a truth that becomes false). It does not solve the *philosophical* problem. You will still have entries like "What is a truth nobody currently knows?" Technically, publishing that makes it known that *someone* is asking about it.
  *   *Mitigation:* Ignore this. As long as the *answer* isn't falsified by the *question*, the register functions. Do not let the perfect be the enemy of the usable. The volunteers are tracking ignorance, not mapping the boundaries of epistemic logic.
