prompt: |-
  You're an expert on the Copycat work (Mitchell/Hofstadter) — slipnet, codelets, workspace, temperature, all of it — plus the general philosophy of concepts. Think this through properly and start with a short brainstorm of 3-4 candidate microworlds before you commit to one, so I can see what you rejected and why.

  Context: someone on a rationalist discord and I keep going in circles on whether "how easy a slip is" is really just conceptual distance in the slipnet. My take is that distance is doing less work than people assume, and that what governs slippage is which description level is active. I want a thought experiment that would settle it for us, and I want you to build it to spec rather than give me a lecture.

  Spec: design a small microworld and an analogy problem inside it such that
  (a) the honest answer is that there isn't a good one — the target lacks the structure the source rule needs, so the analogy is ill posed — while
  (b) there's also a forced-slip answer that is available, attractive, and would come out at low temperature with a decent aesthetic rating, i.e. the architecture would produce it and think it had done well.
  Crucially, the failure must NOT be explainable as "the needed concept is too far away." The thing the solver needs in order to notice the absence should sit one hop from concepts that are already highly active. Otherwise I've just built a case about distance and proved nothing.

  Constraints: microworld fully specifiable in a few sentences, invented by you (no letter strings, no reusing anything you've seen), max 6 concepts in the inventory and list them explicitly so I can check nothing is being smuggled in from the real world.

  Then show the work: walk the analogy by hand, say which codelets would fire and on what, name the forced-slip answer, name the correct verdict and the reasoning that gets you there, and identify the single feature of the case doing the work — plus what happens to the case if you delete that feature. Finish with the best attack a Copycat defender would make (I expect something like "there's always an answer, your no-good-answer intuition is just the aesthetic rating coming out low"), and say whether that attack succeeds or just relocates the problem.

  Give a rough confidence on each of the main claims, and flag the one point you're least sure about.
