  3. Evidence of complex hierarchy and wealth accumulation in sedentary pre-agricultural societies like the Natufians breaks the causal link between farming and inequality, but you'd dismiss these as exceptions rather than the rule.
  4. If the osteological paradox means skeletal stress markers indicate survival of childhood disease rather than poor health, your bone evidence becomes ambiguous, yet you'd wave this off as special pleading to ignore obvious suffering.
  5. Your view functions mostly as a moral mood rather than a predictive theory since it explains all outcomes as negative regardless of context, padded with escape clauses that make it unfalsifiable, which is a genuine problem you would defend as a necessary corrective to bias.
