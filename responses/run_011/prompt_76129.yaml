answer: |-
  Here is a design for a two-hour workshop activity titled **"The Precedent Pile."** It is built to be run on folding tables with minimal materials, leveraging your co-facilitator's room-management skills to keep the temperature controlled while you observe and guide the debrief.

  ### 1. The Core Mechanic: Precedent Cards
  Your hunch is correct. This mechanic creates a tangible "ratchet." To make it work, we must ensure that breaking a norm is initially *costly* (socially or strategically) but becomes *cheap* once the card exists.

  *   **The Norm Sheet:** A large piece of paper on each table listing 5 "Unwritten Rules" (e.g., *No violence in the Forum*, *Tribunes are sacrosanct*, *Consuls serve one year*, *Auspices must be observed*, *Assembly cannot amend*).
  *   **The Precedent Pile:** A stack of blank index cards and markers in the center of the room.
  *   **The Rule:** To perform an action listed on the Norm Sheet, a player must first create a Precedent Card. They must stand, read the Norm they are breaking, state their justification aloud in one sentence (e.g., *"I am removing this Tribune because he blocks the will of the People"*), write that justification on the card, and place it in the center pile.
  *   **The Ratchet:** Once a card is in the pile, *any* player may pick it up on their turn to perform that same action without writing a new card. They simply show the card. However, if they want to expand the violation (e.g., *"I am removing this Tribune because he blocked me"*), they must write a *new* card, adding to the pile.
  *   **The Catch:** The Co-facilitator acts as the "Censor." If a player breaks a norm *without* playing or writing a card, the Censor freezes the game and imposes a "Social Ostracism" penalty (that player loses their next turn). This forces the ritual of justification.

  ### 2. Roles and Factions (24 Players)
  Divide the room into three asymmetric factions. Do not seat them together; mix them at the tables (8 players per table, 3 tables total) to force negotiation, but give them colored armbands or name tents to identify their loyalty.

  **Faction A: The Senate (8 Players)**
  *   **Goal:** Pass 3 "Stability Decrees" (e.g., *Fund the Army*, *Protect Creditors*, *Restore Order*).
  *   **Resource:** **Auctoritas** (White Poker Chips). You start with 10 chips shared among the faction.
  *   **Power:** You control the Treasury. You can withhold funding from laws you dislike.
  *   **Weakness:** You cannot vote on laws directly. You need the Assembly.

  **Faction B: The Tribunes (8 Players)**
  *   **Goal:** Pass 3 "Reform Bills" (e.g., *Land Redistribution*, *Debt Cancellation*, *Grain Dole*).
  *   **Resource:** **Popular Support** (Red Poker Chips). You start with 10 chips shared.
  *   **Power:** You hold the **Veto**. You can stop any Senate Decree. You control the Assembly agenda.
  *   **Weakness:** You are sacrosanct (cannot be arrested) *only* as long as the "Tribunes are sacrosanct" Norm is active.

  **Faction C: The Magistrates (8 Players)**
  *   **Goal:** Secure 2 "Commands" (e.g., *War in Gaul*, *Govern Syria*) and avoid "Exile."
  *   **Resource:** **Imperium** (Blue Poker Chips). You start with 5 chips.
  *   **Power:** You execute the laws. You control the **Auspices** (can declare omens bad to delay voting). You control the **Lictors** (can arrest, but only if norms allow).
  *   **Weakness:** You are liable for prosecution after your term ends. If too many Precedent Cards exist, you are easily exiled.

  **The Assembly (Mechanic, not Players):**
  *   Laws are passed by flipping a "Voting Token." If the Tribunes put a law forward, the Magistrates must call the vote. The Senate can try to bribe voters (spend Auctoritas).

  ### 3. Materials List (Kitchen Table Assembly)
  *   **Index Cards:** 100 count (3x5).
  *   **Markers:** 10 black, 5 red.
  *   **Poker Chips:** 3 colors (White, Red, Blue), approx. 50 of each.
  *   **Law Cards:** 24 small slips of paper (12 Reform, 12 Stability). Simple text: *"Agrarian Law: Distribute public land to veterans."*
  *   **Norm Sheet:** 3 large sheets of newsprint or poster board, handwritten with the 5 Unwritten Rules.
  *   **Timer:** A visible phone or kitchen timer.
  *   **Crisis Deck:** 10 index cards with scenarios written on them (see Running Order).

  ### 4. Running Order (120 Minutes)

  **0:00 – 0:15: Setup & The "Old Ways"**
  *   **Welcome (5 min):** You briefly state the premise: *"You are the Roman elite. Your goal is to win for your faction. But there are rules we don't write down."*
  *   **Distribution (5 min):** Hand out armbands/chips. Seat players mixed at tables.
  *   **The Norms (5 min):** Read the 5 Unwritten Rules aloud. Explain the **Precedent Card** mechanic. Emphasize: *"If you break a rule, you must write the justification. Once written, anyone can use it."*
  *   **Co-facilitator Role:** They are the "Censor." They watch for rule-breaking without cards.

  **0:15 – 0:45: Round 1 – The Bottleneck (Gracchan Era)**
  *   **State:** All Norms are active. Veto works. Auspices work.
  *   **Action:** Factions try to pass their first Law.
  *   **Constraint:** The Senate will block Reform; Tribunes will block Stability. Magistrates try to stay neutral.
  *   **Crisis 1 (0:30):** Co-facilitator draws a Crisis Card: *"Veterans return from war demanding land. If no Land Law passes in 10 minutes, Popular Support drops by half."*
  *   **Expected Outcome:** Gridlock. Players will feel the frustration of the Veto. Someone will realize they need to break a norm to proceed.
  *   **The First Card:** Someone (likely a Tribune) will propose deposing a blocking colleague (Tiberius Gracchus move). They must write the card. *"I depose him because he opposes the People."*
  *   **Result:** The law passes. The card goes in the pile.

  **0:45 – 1:15: Round 2 – The Escalation (Sullan/Caesar Era)**
  *   **State:** One Precedent Card exists.
  *   **Action:** Factions realize the card is a weapon.
  *   **Crisis 2 (0:55):** *"Foreign Enemy invades. A General needs emergency command. Senate refuses."*
  *   **Expected Outcome:** A Magistrate will use the existing Precedent Card to justify ignoring the Senate, or write a new one: *"I ignore the Senate because the State is in danger"* (SCU parallel).
  *   **Crisis 3 (1:05):** *"Election Day. A Consul wants a second term."*
  *   **Expected Outcome:** A new card is written regarding consecutive terms.
  *   **Observation:** Watch the speed increase. The "writing tax" disappears as players just grab existing cards.

  **1:15 – 1:45: Round 3 – The Tip (The Fall)**
  *   **State:** Pile has 4-5 cards. Norms are effectively gone.
  *   **Action:** Chaos. Magistrates use mobs (broken fasces). Tribunes ignore auspices. Senate declares enemies of the state without trial.
  *   **Crisis 4 (1:25):** *"Civil Unrest. Mobs in the Forum."*
  *   **Constraint:** To stop the mob, a Magistrate must use violence. But there is a Precedent Card for "Violence in the Forum" now.
  *   **End Game (1:40):** Stop play. Count Laws Passed. Count Precedent Cards.
  *   **Scoring:** If Precedent Cards > 5, everyone loses "Stability Points" regardless of laws passed. (This simulates the Republic collapsing even if you "won" your faction's goal).

  **1:45 – 2:00: The Debrief (The Crucial Phase)**
  *   **Step 1: The Feeling (5 min):** Ask: *"When did the game change? Was it gradual or sudden?"* (Look for: "When the first card was written.")
  *   **Step 2: The History (5 min):** You reveal the Roman parallels.
      *   First Card = Tiberius Gracchus deposing Octavius.
      *   Emergency Command = SCU against Gaius Gracchus / Pompey.
      *   Ignoring Auspices = Bibulus vs. Caesar.
      *   Consecutive Terms = Caesar's Consulship.
      *   *Note:* Explicitly name *Mos Maiorum* here.
  *   **Step 3: The Modern Analogy (5 min):** Use the **"Disanalogy Bridge."**
      *   Hand each player a sticky note.
      *   **Task:** *"Write down one way your country is **NOT** like this game (e.g., we have a written constitution, we have police, we can amend laws). Only after writing that, write one way it **IS** like this game."*
      *   **Collection:** Stick them on the wall. Read a few aloud.
      *   **Why:** This forces them to acknowledge structural differences (slave labor, no standing police, small citizen body) before making the political comparison, preventing the "shouting match" by grounding the analogy in structural limits.

  ### 5. Troubleshooting: What Will Go Wrong
  1.  **The "Nice Player" Problem:** Players might refuse to break norms because it feels "mean."
      *   **Fix:** The Co-facilitator must lean into the Crisis Cards. *"If you don't pass this law, your faction loses all chips."* Make inaction more painful than norm-breaking.
  2.  **The "Lawyer" Problem:** One player argues about the wording of the Precedent Card.
      *   **Fix:** You (the Author) hold the "Gavel." Rule: *"The Censor decides if the card matches the action. No debate on semantics. Keep the game moving."*
  3.  **The "Political Proxy" Problem:** Players start arguing about modern politicians.
      *   **Fix:** The "Latin Only" Rule. If anyone mentions a modern politician or country, they lose a chip. Force them to speak in the game's language (*Senate, Tribune, Law*).
  4.  **Stall:** No one writes the first card.
      *   **Fix:** At minute 35, you (the Author) stand up. *"The grain ships have not arrived. The mob is gathering. If a law is not passed in 2 minutes, the game ends in Sack."* Desperation breeds innovation.

  ### 6. Frank Assessment of Limitations

  **Can 2 hours stand in for 50 years?**
  No. And you should admit this in the debrief. The game compresses the *psychological* shift, not the generational one. In Rome, the first time a Tribune was deposed was a shock; in the game, it happens in 20 minutes.
  *   **How to handle:** Frame the game not as a *simulation of history*, but as a *simulation of the logic*. Tell them: *"We are not reenacting the years; we are reenacting the incentive structure that made those years inevitable."*

  **Is the Modern Analogy a Gift or a Trap?**
  It is a trap. If they map Rome to their country too quickly, they stop looking at Rome.
  *   **The Fix:** The "Disanalogy Bridge" (sticky notes) is essential. It forces cognitive friction. They must articulate *why* the analogy is imperfect before they are allowed to say where it fits. This satisfies the political urge without letting it hijack the historical lesson. It also protects you from the "shouting match" the librarian fears.

  **Historical Accuracy Flags:**
  *   **Mos Maiorum:** In the game, this is a list of 5 rules. In reality, it was a vague, shifting cultural ethos. *Flag this:* Tell them the "Norm Sheet" is a simplification for playability.
  *   **The SCU:** Historians dispute whether the *Senatus Consultum Ultimum* was legal or extra-legal. The game treats it as a Precedent Card (extra-legal justification). This is a defensible interpretation for this purpose.
  *   **The Assembly:** In the game, they are mechanics. In reality, the *concilium plebis* was rowdy and complex. *Flag this:* Acknowledge that the "voting tokens" simplify a chaotic physical process.
  *   **Violence:** The game abstracts violence into "chips lost." In reality, it was bloody. *Flag this:* Ensure the debrief mentions that the "game over" condition represents actual death and proscription, not just losing points.

  ### 7. Confidence & Least Sure Decision

  **Confidence Level:** **85%.**
  The "Precedent Card" mechanic is robust and directly maps to your theoretical goal. The faction asymmetry ensures conflict. The Co-facilitator provides the necessary pressure. The risk lies entirely in the social dynamics of the specific group (e.g., if they are too passive or too aggressive).

  **Least Sure Design Decision:** **The "Shared Loss" Condition.**
  I have included a rule where if too many Precedent Cards are written (>5), *everyone* loses Stability Points, even if they won their faction goal.
  *   **Why I'm unsure:** Competitive players often ignore shared losses if their personal victory is assured. They might burn the republic down just to win their 3 laws.
  *   **Why I kept it:** This *is* the tragedy of the Republic. Individual rationality led to collective ruin. If they ignore the shared loss, that is actually a *successful* outcome for the lesson (they will have enacted the tragedy). However, if they ignore it too early, the game ends prematurely.
  *   **Mitigation:** The Co-facilitator should announce the "Stability Count" loudly every 10 minutes. *"The pile has 3 cards. The Republic is shaking. Two more and the streets burn."* Make the collective risk visceral.

  ### 8. Final Note to the Author
  You mentioned you tend to talk too much. This design requires you to be silent for the middle hour. Your voice is only needed at the start (rules) and the end (meaning). Trust the mechanic. If the room gets loud, let them shout *at the game*, not at each other. The Precedent Cards are the enemy, not the opposing faction.

  If you run this exactly as written, the moment a player picks up a card written by their opponent to justify their own transgression, you will see the lightbulb go on. That is the moment the *mos maiorum* dies.
