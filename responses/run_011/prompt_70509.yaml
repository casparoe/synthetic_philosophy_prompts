answer: |-
  **TO:** Whitcombe Fellowship Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Evaluation of Finalists for the Whitcombe Fellowship

  Colleagues,

  We are tasked with selecting a project that advances the history of science and technology while satisfying our trustees' mandate to support work addressing questions recognizable to a non-specialist. Both finalists are exceptional, but they propose fundamentally different kinds of knowledge. After careful review, I recommend we award the fellowship to **Candidate 2**.

  To reach this conclusion, I must first address the strength of Candidate 1's proposal, which represents the traditional expectation of our field. Her project offers a material account of the Great Divergence, grounded in archival data on wages, markets, and resources. To a non-specialist trustee, this looks like history proper: it promises an answer to a concrete question ("Why here and not there?") using tangible evidence (coal, shipping, grain). The objection that her project is "Europe-against-China in all but name" misses the point that comparative history requires units of comparison; her selection of the Midlands and the Yangzi is defensible based on the background conditions she holds constant. Furthermore, her robustness exercise on page six—where the causal weight of coal shifts depending on the foil (Netherlands vs. France vs. Yangzi)—is presented as methodological honesty. She argues that explanations are indexed to contrasts. There is merit to this: causal claims in history are rarely universal laws. Acknowledging that coal explains industrialization against an agrarian baseline but not against a commercial one is a sophisticated admission of boundary conditions. If we fund Candidate 1, we support a rigorous test of material causality that respects the complexity of global economic history.

  However, this sophistication reveals the fatal instability of the project. For a contrastive question ("Why X and not Y") to be determinate enough for fellowship support, the proposed mechanism must demonstrate stability across reasonable alternative foils, or the limitation must be theorized as a boundary condition rather than a variable outcome. Candidate 1 finds that coal explains the divergence against the Yangzi, fiscal capacity explains it against France, and nothing explains it against the Netherlands. She treats this shifting causal landscape as a virtue. I contend it is a defect. If the explanation changes entirely based on the historian's choice of foil, we are not learning why industry mechanized in the Midlands; we are learning how the Midlands differ from whichever neighbor the historian selected. This renders the explanation contingent on the questioner's framing rather than the historical reality. As a historian of instruments, I view the comparison itself as a tool of measurement. If a measuring instrument yields different magnitudes depending on where you stand, it cannot measure the object. Candidate 1's project risks measuring the contrast space rather than the industrialization.

  Candidate 2, conversely, makes this instability the object of study. Her intellectual history interrogates how the divergence problem took its current shape, how the unit of comparison shifted from civilizations to regions, and what rhetorical work these comparisons perform. The strongest objection here is that the project is meta-level: it yields no findings about the divergence itself and leans on the comparative reasoning it exists to interrogate. Critics might argue this is parasitic, offering a commentary on history rather than history itself.

  I reject this characterization. Our foundation supports the History of Science and Technology, not merely economic history. The construction of knowledge is as vital a subject as the accumulation of capital. Candidate 2 addresses a large question recognizable to non-specialists: "How do we know what we know about the modern world?" By examining the tools of comparison themselves, she provides the necessary context for evaluating claims like Candidate 1's. If Candidate 1's explanation shifts with the foil, Candidate 2 explains why we keep changing the foil. This is not merely methodological; it is substantive history of the concepts that govern our understanding of technology and society. It satisfies the trustee criterion because it addresses the authority of historical explanation, a concern far beyond the academy.

  **Decision:**
  I move we fund Candidate 2. Her project stabilizes the field by clarifying the instruments of inquiry, whereas Candidate 1's project, however rigorous, rests on an unstable causal foundation that varies by contrast.

  **Procedural Instruction:**
  Should the final vote on Friday result in a tie (2-2), I propose we invoke the Chair's casting vote. However, the Chair should be instructed to weigh the trustee criterion regarding public intelligibility heavily. If the tie persists due to concerns about Candidate 2's accessibility, we should consider funding neither and re-opening the competition with a clarified request for proposals that bridge material and intellectual history. However, given the strength of Candidate 2's writing sample and the urgency of critiquing our comparative frameworks, I believe we can defend her project's significance to the trustees.

  I look forward to resolving this on Friday.
