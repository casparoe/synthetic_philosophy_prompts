answer: |-
  The two rules you identify—the cap on living recipients and the bar on the dead—do not merely manage logistics; they enforce a specific ontology of scientific truth. Together, they presuppose that a discovery is not a cumulative addition to a public archive, but a discrete event that attaches itself to specific biological bodies at a specific moment in time.

  When these rules operate in tandem, as they did in the exclusion of Rosalind Franklin, they reveal a theory of credit that is neither purely administrative nor fully Plutarchan, but rather a **bureaucratic hagiography**.

  ### The Theory of the Crystallized Moment
  The joint presupposition is that a discovery has a "birth certificate" that can be signed by no more than three parents, and those parents must be present at the registry office. This treats scientific progress not as a river fed by countless tributaries, but as a series of distinct, ownable properties.

  By limiting the prize to three living individuals, the Committee asserts that any complex truth (like the double helix) can be causally reduced to the intellectual agency of a tiny elite. It assumes a hierarchy of contribution is always discernible—that there is a "first," "second," and "third" architect, even when the building was erected by a hundred hands.

  By barring the posthumous, the Committee asserts that the prize is a reward for the *scientist*, not the *science*. If the prize were for the discovery itself, Franklin's death would be irrelevant; the DNA structure remains true regardless of her pulse. But because the prize is for the *life* that housed the discovery, the extinction of that life extinguishes the claim. The rules jointly imply that a discovery belongs to the lifespan of its discoverer. It is not an eternal truth waiting to be found; it is a possession that reverts to the void if the owner dies before the deed is transferred.

  ### Plutarch vs. The Bureaucrat
  You ask if this is Plutarch's conception of history. Plutarch compressed history into biography to make moral character intelligible; he believed you could understand the fate of Rome by understanding the virtues and vices of Caesar. The Nobel rules attempt a similar compression, but for a different end.

  It is not purely administrative, though it uses administrative tools. A purely administrative rule would aim for accuracy in credit distribution, perhaps allowing for institutional awards or unlimited names to ensure no contributor is missed. The three-name cap is not there to save money or time; it is there to save the *narrative*. A photograph of twenty people is a crowd; a photograph of three is a cast of characters.

  However, it is not truly Plutarchan either. Plutarch cared about moral exemplars—how a life *should* be lived. The Nobel cares about intellectual priority—who got there *first*. The rules create a "Great Man" theory of science without the moral baggage. They force history into biography not to teach virtue, but to create a manageable myth of origin. They require that the messy, collaborative, often accidental process of research be retrofitted into a story of three heroes. Franklin was not excluded because she lacked virtue (Plutarch's concern) nor merely because she was dead (Administration's concern), but because her death made her unusable for the myth. A dead hero cannot stand on stage to validate the ceremony's claim that science is a humanistic endeavor driven by living genius.

  ### The Exclusions of the Three-Name Cap
  The cap on names is a filter that excludes specific sociologies of knowledge.

  1.  **Excluded:** It fundamentally excludes the **collective model** of modern science. In fields like particle physics or genomics, where papers list thousands of authors, the three-name rule declares that *no single discovery* in that field is worthy of a Nobel, or it forces the Committee to arbitrarily anoint three managers as proxies for the multitude. It denies the epistemological reality that some truths are too large for three minds to hold.
  2.  **Awkward:** It sits uneasily with the **small-team model** (4–6 researchers). Here, the Committee is forced into a role of granular forensics it is ill-equipped to perform, parsing emails and lab notebooks to decide who was the "visionary" and who was the "technician." This commits the Committee to a stronger claim than mere convenience: it commits them to the belief that intellectual labor is inherently hierarchical and that the "idea" is superior to the "execution," even when the execution (like Franklin's X-ray diffraction) is the only thing making the idea visible.

  The cap forces a distinction between "thinking" and "doing," awarding the former. It presupposes that the discovery resides in the insight (Watson/Crick) rather than the evidence (Franklin), and that the insight can be owned by fewer people than the evidence requires to produce.

  ### The Inconsistency of Survival
  Are the rules consistent? On the surface, they both serve to limit liability and simplify the ceremony. But philosophically, they contradict.

  The three-name rule suggests the prize recognizes an **objective contribution** (the work done). The posthumous rule suggests the prize recognizes a **subjective status** (the living person).

  If the prize is for the work, Franklin's contribution in 1958 was identical to her contribution in 1962. The truth of the DNA structure did not change when her heart stopped. By making the award contingent on survival, the rules introduce a variable of biological luck into the assessment of intellectual merit. It implies that part of the merit of a discovery is the discoverer's ability to stay alive long enough to be validated by Stockholm.

  This creates a "survivor bias" in the history of science. It suggests that a discovery is not fully real until it is ceremonially acknowledged by the living. The inconsistency lies here: The Committee claims to award the "benefit to mankind" (objective), but the rules ensure they only award "benefit to the living scientist" (subjective). Franklin's case exposes the seam: she provided the benefit, but because she could not receive the subjective reward, the objective record was altered to exclude her name from the official trio.

  ### Institutional Transformations
  If the institution were to shed its current implicit theory and adopt an explicit rationale, it would have to transform radically.

  **1. The Openly Hagiographic (Plutarchan) Institution**
  If the Nobel admitted it was awarding moral exemplars, the criteria would shift from *priority* to *virtue*.
  *   **The Change:** Laureates would be chosen not for who solved the puzzle first, but for who embodied the scientific spirit most nobly. Franklin might have won posthumously as a martyr to rigor.
  *   **The Ceremony:** It would resemble a canonization. The lecture would be a sermon on integrity, collaboration, or perseverance.
  *   **The Consequence:** Science would be framed as a moral pursuit. This might inspire the public, but it would invite endless debates over the character of scientists rather than the validity of their data. It would risk turning the prize into a tool for political or ethical signaling, detached from the actual mechanics of discovery.

  **2. The Openly Anti-Hagiographic (Work-Centric) Institution**
  If the Nobel admitted it was awarding the work itself, the person would become incidental.
  *   **The Change:** The prize could be awarded to the paper, the laboratory, or the collaboration, with unlimited names. Posthumous awards would be standard, as the work survives the worker.
  *   **The Ceremony:** It would look less like a coronation and more like a dedication. The money would likely be restricted to research endowments rather than personal wealth.
  *   **The Consequence:** This would align with the reality of modern "Big Science." It would acknowledge that discovery is infrastructure, not epiphany. However, it would lose the media hook. The public connects with faces, not institutions. By removing the "hero," the prize might gain accuracy but lose its cultural power to dramatize science as a human adventure.

  ### Conclusion
  The current rules presuppose that science is a drama of individuals, and that the truth they find is a property they carry in their persons. Franklin's exclusion was not an accident of these rules; it was their logical outcome. The system requires a living stage for the performance of credit. When the actor dies, the script is rewritten to remove the role. To keep Franklin in the story, the institution would have to admit that the discovery belongs to the world, not the discoverer—and that would require dismantling the very stage upon which the Nobel stands.
