prompt: |-
  I write about science for a general-interest magazine and have become more interested in the Nobel rules than in the laureates. Two of them matter here: no prize may be shared by more than three individuals, and prizes are not awarded posthumously, unless the laureate dies between the announcement and the ceremony. Rosalind Franklin is the case I keep returning to — she died in 1958, and when the 1962 medicine prize for the structure of DNA went to Watson, Crick, and Wilkins, both rules bit at once, the list of names already being full.

  What conception of a discovery, and of the life a discovery belongs to, do those two rules jointly presuppose? I want the implicit theory reconstructed, not labeled. Is it Plutarch's — that a career becomes intelligible once compressed into one life set beside others, which is why the Lives announce that they are concerned with lives rather than histories and dwell on remarks, jests, and small acts rather than campaigns — or is it merely administrative, a device for producing a short list and a photographable moment? Which rival accounts of scientific credit does the three-name cap actually exclude, and which is it only awkward alongside: could a genuinely collective theory of authorship be served by three names, or does the cap commit the committee to something stronger? And are the two rules even consistent with each other, when the posthumous bar makes a contribution's recognizability depend on how long its author happened to survive it? Finally, tell me what the institution would have to become if it adopted an openly hagiographic rationale — prizes as moral exemplars, in the Plutarchan sense — or an openly anti-hagiographic one, prizes attaching to bodies of work rather than to persons.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A science writer for a general-interest magazine.
      *   **Topic:** The Nobel Prize rules (specifically the 3-person limit and the no-posthumous rule) and their philosophical implications.
      *   **Case Study:** Rosalind Franklin (died 1958, Prize 1962 to Watson, Crick, Wilkins).
      *   **Core Question:** What conception of discovery and the "life a discovery belongs to" do these rules jointly presuppose?
      *   **Specific Constraints:**
          *   Reconstruct the *implicit theory*, do not just label it.
          *   Compare/Contrast with Plutarch's *Lives* (moral exemplars/biographical focus) vs. Administrative device (logistics).
          *   Analyze what rival accounts of scientific credit are excluded vs. awkwardly accommodated by the 3-name cap.
          *   Analyze the consistency between the two rules (survival bias).
          *   Speculate on institutional transformation if the rationale became openly hagiographic (moral exemplars) vs. openly anti-hagiographic (work over person).
      *   **Tone:** Intellectual, analytical, nuanced, suitable for a science writer (sophisticated but clear).

  2.  **Deconstruct the Rules & The Franklin Case:**
      *   *Rule 1 (Max 3 people):* Implies discovery is attributable to specific agents, not a diffuse cloud. It suggests a "heroic" or "principal investigator" model. It forces a bottleneck on credit.
      *   *Rule 2 (No Posthumous):* Implies the prize is for the *living* scientist, not just the science. It's a reward for continued existence/presence. It creates a temporal boundary.
      *   *Franklin:* She did the work (X-ray crystallography), died before the prize, and the slots were full. The rules conspired to erase her.
      *   *Joint Presupposition:* Discovery is an event that happens *in time* to *specific people* who must be *alive* to receive the honor. It treats science as a race with a finish line crossed by individuals, not a cumulative building process.

  3.  **Address the "Plutarch vs. Administrative" Dichotomy:**
      *   *Plutarch:* Focus on character, moral weight, biography. The prize as a story of a life.
      *   *Administrative:* Logistics, ceremony, money distribution.
      *   *Synthesis:* It's not purely either. It's a *bureaucratic hagiography*. It uses administrative tools to enforce a biographical narrative. It *makes* the discovery intelligible by compressing it into three faces. It's not just limiting names for convenience; it's defining what counts as a "discoverer."

  4.  **Analyze the Three-Name Cap (Credit Theory):**
      *   *Excluded:* Large collaboration (CERN, Human Genome Project style), diffuse incrementalism, anonymous labor (technicians, women in Franklin's era).
      *   *Awkward:* Small teams (4-5 people). The committee has to play "Survivor" to cut people.
      *   *Commitment:* It commits to the "Great Man/Woman" theory (or Great Trio). It assumes a hierarchy of contribution where a top 3 can always be identified. This is epistemologically shaky in modern science.

  5.  **Analyze Consistency (Survival Bias):**
      *   Are they consistent? Superficially, yes (keep it simple). Deeply, no.
      *   The posthumous rule makes credit contingent on biology (longevity), not just intellect.
      *   The 3-person rule makes credit contingent on social negotiation (who gets cut), not just data.
      *   Together, they create a "Golden Moment" theory. The discovery must be crystallized, and the discoverers must be present to hold the crystal. If you die, you vanish from the narrative. If you are the 4th person, you vanish from the narrative.
      *   *Inconsistency:* If the prize is for the *discovery* (objective truth), why does the death of the discoverer matter? If it's for the *person* (subjective reward), why limit to 3? It tries to be both and fails.

  6.  **Speculate on Institutional Transformation:**
      *   *Openly Hagiographic (Plutarchan):* The prize becomes about *character*. Criteria shift from "who found it" to "who embodies the scientific virtue." It becomes a moral award. The ceremony becomes a sermon. The money is secondary to the story.
      *   *Openly Anti-Hagiographic (Work over Person):* The prize goes to the *paper*, the *lab*, or the *institution*. No names on the certificate, or unlimited names. The ceremony is about the *data*. The money funds future research, not personal wealth. It acknowledges science as a collective, cumulative enterprise.

  7.  **Drafting - Section by Section (incorporating the "Reconstruct, Don't Label" instruction):**
      *   *Introduction:* Acknowledge the Franklin case as the fulcrum. Define the tension.
      *   *The Implicit Theory:* It's a theory of *crystallization*. Discovery is a point in time, attributable to agents.
      *   *Plutarch vs. Admin:* It's administrative machinery serving a biographical myth. It forces history into biography.
      *   *The Three-Name Cap:* Excludes collectivism. Enforces hierarchy.
      *   *Consistency:* The survival clause undermines the objectivity of the discovery clause.
      *   *Future Scenarios:* Hagiographic (Saints of Science) vs. Anti-Hagiographic (Science as Infrastructure).

  8.  **Refining the Tone:**
      *   Avoid dry academic language. Use metaphors (bottleneck, crystallization, stage).
      *   Ensure the Franklin example is woven through, not just tacked on.
      *   Check against the prompt: "I want the implicit theory reconstructed, not labeled." -> Avoid saying "It's positivism" or "It's neoliberalism." Describe *how* it works.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about what conception of "life a discovery belongs to"?
      *   *Adjustment:* Need to emphasize that the rules imply a discovery belongs to the *living body* of the scientist, not the abstract realm of truth.
      *   *Check:* Did I address the Plutarch comparison sufficiently?
      *   *Adjustment:* Make sure to distinguish between Plutarch's moral focus and the Nobel's achievement focus, but show how the *structure* mimics Plutarch's biographical compression.
      *   *Check:* Is the distinction between "excluded" and "awkward" clear regarding the 3-name cap?
      *   *Adjustment:* Excluded = massive collaboration. Awkward = tight teams of 4-5 where contribution is equal.

  10. **Final Polish:** Ensure flow and coherence. (The resulting essay should feel like a thoughtful piece in the very magazine the user writes for.)

  *(Self-Correction Note)*: The prompt asks specifically about the *joint* presupposition of the two rules. I need to make sure I don't analyze them entirely in isolation. The combination is key: The discovery must be owned by living bodies, and only three bodies can own it. This creates a specific ontology of scientific truth.

  *(Final thought on the "Life a discovery belongs to" phrase)*: This is the poetic core. The rules imply a discovery belongs to a *lifespan*. If the lifespan ends, the ownership expires. If the ownership is shared by too many, it is diluted. The discovery is property of the person, not the person a vessel for the discovery.

