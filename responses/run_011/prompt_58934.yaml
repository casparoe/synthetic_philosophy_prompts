answer: |-
  ### 1. Brainstorming Existing Concepts

  Here are the candidate concepts that surface when analyzing these two patterns, drawn from value theory, rhetoric, and historiography.

  **For Instance 1 (The Refusal as Ranking):**

  *   **Incommensurability:** (Value Theory)
      *   *Why it fits:* It describes situations where two items lack a common metric of measurement, which is exactly the surface claim the objector makes.
      *   *Why it fails:* Incommensurability is an ontological claim about values (that they cannot be measured together), whereas your description is about a *rhetorical effect* (that the denial functions as a superlative). One can assert incommensurability without implying one event is "higher" or "worse," but your objector necessarily implies supremacy.
  *   **Exceptionalism:** (Historiography/Political Science)
      *   *Why it fits:* It captures the idea that a specific historical event is unique and stands outside normal historical categories.
      *   *Why it fails:* Exceptionalism describes the *status* assigned to the event, not the *argumentative structure* used to defend it. It doesn't explain the performative contradiction of ranking-by-refusing.
  *   **Performative Contradiction:** (Logic/Pragmatics)
      *   *Why it fits:* The act of arguing contradicts the content of the argument (saying "no ranking" while effectively ranking).
      *   *Why it fails:* It is too broad. Any self-defeating statement is a performative contradiction (e.g., "I am not speaking"). It lacks the specific normative force of assigning *value* or *position* through the denial.
  *   **Sacralization:** (Sociology of Memory)
      *   *Why it fits:* It explains why the event is treated as untouchable or beyond profane comparison.
      *   *Why it fails:* It explains the *motivation* or social function, not the logical mechanism. It tells us why the student feels the refusal is "morally serious," but not how the refusal functions as a ranking.

  **For Instance 2 (The Shifting Metric):**

  *   **Equivocation:** (Logic/Rhetoric)
      *   *Why it fits:* It involves using the same word ("worse") with different meanings (numbers vs. intent) within an argument.
      *   *Why it fails:* Equivocation is usually treated as a fallacy of ambiguity. Here, the ambiguity is structural to value theory itself; "worse" *is* multidimensional. The problem isn't the ambiguity, but the unacknowledged *switch* between dimensions while pretending consistency.
  *   **Multidimensionality of Value:** (Value Theory)
      *   *Why it fits:* It accurately describes the reality that "badness" has many axes (intent, scale, duration).
      *   *Why it fails:* This is a description of the *world*, not the *argument*. It explains why the shift is possible, but not why the shift is rhetorically concealed.
  *   **Goalpost Shifting:** (Informal Logic)
      *   *Why it fits:* It captures the movement of criteria during a debate.
      *   *Why it fails:* This implies a strategic attempt to win a debate by making criteria harder to meet. In your seminar, the parties seem to genuinely believe they are discussing the same thing; it is a conceptual confusion, not necessarily a tactical maneuver.
  *   **Concept Stretching:** (Political Science)
      *   *Why it fits:* It describes expanding a concept to cover new cases.
      *   *Why it fails:* This usually refers to definitions (e.g., "what counts as democracy?"), not evaluative metrics (e.g., "what counts as worse?").

  ### 2. Assessment of Existing Terms

  There is no established term in philosophy or rhetoric that precisely captures Instance 1.

  **Incommensurability** is the closest neighbor, but it is not the right label. Incommensurability is a thesis about the *structure of value* (that no common measure exists). Your students are not making a thesis about value; they are making a move that *uses* the appearance of incommensurability to secure a *ranking*. If I say "A and B are incommensurable," I am not necessarily saying "A is worse than B." But when your student says "You cannot compare them," the pragmatic force in the room is "This one is too significant for the scale." The existing term describes the metaphysics; it misses the rhetoric.

  Regarding Instance 2, **Equivocation** is technically accurate but too thin. It diagnoses the error but misses the specific domain. It is not just any word changing meaning; it is the *axis of evaluation* changing while the *judgment* pretends to remain constant.

  I must be candid: If you print "Incommensurability" or "Equivocation" on your syllabus, your students will look those up, find the standard definitions, and realize those definitions do not capture the specific sleight-of-hand you are pointing out. You need a term that targets the *function* of the move, not just its logical form.

  ### 3. Coining a Term: Apophatic Ranking

  Since no established term fits Instance 1, I propose the term **Apophatic Ranking**.

  **Definition:**
  *Apophatic Ranking* is the rhetorical move of assigning a superlative position to an entity within a value hierarchy by explicitly denying that the entity belongs to that hierarchy. It derives from *apophatic theology* (defining the divine by what it is *not*), but applies it to comparative ethics. The speaker claims the event is "beyond comparison" or "unrankable," but the pragmatic effect of that claim is to place the event at the limit-point (the maximum) of the very scale being rejected.

  **The Boundary (Legitimate vs. Illegitimate):**
  To teach this, you must distinguish the illegitimate move from a legitimate claim of incommensurability. The line falls on **Kind vs. Degree**.

  *   **Legitimate Use (Category Distinction):** The objection survives diagnosis if the speaker argues that the *dimensions* of value are fundamentally different, such that placing them on a single scale creates a category error.
      *   *Example:* "You cannot compare the badness of a headache to the badness of a genocide." This is not Apophatic Ranking; it is a correct refusal of a category mistake. No ranking is implied; the scales are truly disjoint.
  *   **Illegitimate Use (Apophatic Ranking):** The move is diagnosed as Apophatic Ranking if the speaker accepts the events are of the same *kind* (e.g., both are genocides) but claims the *magnitude* of one is so great it breaks the scale.
      *   *Example:* "You cannot compare these two genocides because this one is too sacred." Here, the scale is accepted (genocide badness), but the event is placed at "infinity" on that scale via a refusal to measure.

  **Counter-Example (Looks like the pattern, is not):**
  Consider a juror refusing to weigh the life of a defendant against the security of the state.
  *   *Appearance:* They say, "You cannot put a price on a life." This sounds like Apophatic Ranking (refusing the scale to imply supreme value).
  *   *Reality:* If the juror is invoking a **Deontological Constraint** (a rule that forbids the trade-off regardless of consequences), this is not Apophatic Ranking. They are not saying the life is *infinitely heavier* on the scale; they are saying the scale *itself* is forbidden in this context. The distinction is subtle: Apophatic Ranking smuggles a weight onto the scale; Deontology forbids the weighing. In your seminar, if a student says "We shouldn't rank these," you must ask: "Are you saying the scale is forbidden (Deontology), or that this event breaks the scale (Apophatic Ranking)?"

  *(Note on Instance 2: For the second pattern you described, where the metric shifts silently, the precise label is **Dimensional Slippage**. I do not coin a new term for this because "Equivocation on Value Dimensions" is sufficient if glossed correctly, but "Dimensional Slippage" is a useful pedagogical shorthand.)*

  ### 4. Relationship Between the Two Instances

  The two instances are **distinct phenomena**, but they are symbiotic habits that arise from the same underlying confusion.

  **Instance 1 (Apophatic Ranking)** is a *Meta-Ethical* move. It concerns the **existence of the scale**. It argues that the measuring rod itself is inadequate for the object.
  **Instance 2 (Dimensional Slippage)** is a *Methodological* move. It concerns the **calibration of the scale**. It assumes the measuring rod exists but secretly swaps the ruler for a different one (inches to centimeters, or length to weight) mid-measurement.

  **Why they feel like the same thing:**
  They both stem from what we might call the **Illusion of Unidimensionality**. In ordinary language, we treat "badness" as a single substance, like water, that can simply be "more" or "less."
  *   In Instance 1, the student treats badness as a substance that can become so concentrated it explodes the container (Refusal).
  *   In Instance 2, the student treats badness as a substance that can change its density without changing its name (Slippage).

  **Syllabus Recommendation:**
  Do not teach them as the same move. If you conflate them, students will confuse *rejecting the scale* with *changing the units*.
  *   Teach **Apophatic Ranking** when discussing the *ethics of memory* and the temptation to sacralize history.
  *   Teach **Dimensional Slippage** when discussing *comparative methodology* and the need to define criteria explicitly.

  They are distinct tools in the same toolbox of obfuscation. Instance 1 shuts down the inquiry; Instance 2 confuses the inquiry. Recognizing the difference allows your students to see that one can accept comparison (avoiding Instance 1) while still being rigorous about dimensions (avoiding Instance 2).
