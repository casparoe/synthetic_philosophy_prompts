      *   **Concern 6: Is it interesting?**
          *   *Verdict:* Yes. The Phi phenomenon is a classic. The "no fact of the matter" view is philosophically rich.
          *   *Risk:* It's a well-trodden path (Dennett 1991). Needs a fresh angle. The "unsettled" ontology is the fresh angle.

      *   **Concern 7: Step 1 Accuracy**
