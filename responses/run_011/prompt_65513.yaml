answer: |-
  **Project Title:** The Substantivity of Virtual Ontology: A Search for Divergence Cases

  **Project Overview**
  This project investigates the metaphysical status of virtual objects, specifically targeting the stalemate between Virtual Realism (the view that virtual objects are real digital objects) and Virtual Fictionalism (the view that they are fictional props). While recent literature has extensively mapped the "paradigm cases" of virtual interaction—standard gameplay, conventional virtual harm, and typical persistence—there remains an unresolved charge of triviality. Critics argue that once the functional and phenomenal facts are fixed, both views deliver identical verdicts, rendering the dispute merely verbal. This project seeks to resolve this by systematically constructing "divergence cases": scenarios in which Virtual Realism and Virtual Fictionalism yield conflicting truth values. Whether such cases are found or proven impossible, the result will decisively classify the dispute as either substantive or deflationary.

  **The Philosophical Problem**
  The central question is not whether virtual swords are *really* swords in the physical sense, but whether the ontological disagreement between Realists and Fictionalists tracks a difference in truth conditions. The "Equivalence Charge" posits that for any conceivable scenario $S$, if the computational realizer and user experience are fixed, the Realist claim ("$x$ exists") and the Fictionalist claim ("$x$ is a fictional entity") are co-extensive. If this holds, the dispute is verbal: the parties assign different meanings to "exists" but agree on the underlying reality.

  Existing positions leave this question open because they rely heavily on paradigmatic examples. Virtual Realism, following Chalmers, grounds its arguments in the causal efficacy and structural integrity of standard virtual environments. Virtual Fictionalism counters by emphasizing the normative and imaginative frameworks of gameplay. Both approaches converge on standard cases: a virtual killing is morally significant (Realism) or a fictional harm with real consequences (Fictionalism); a server shutdown is destruction (Realism) or the end of a game (Fictionalism). Because both theories are calibrated to match our pre-theoretic intuitions about standard gameplay, they are insulated from falsification within that domain. The Equivalence Charge remains unrefuted because neither side has rigorously tested the boundaries where computational implementation, persistence, and functional profile come apart.

  **Methodology**
  The project employs a method of *Modal Stress-Testing via Divergence Case Construction*. Rather than collecting intuitions about ordinary gameplay or importing general metaphysics of artefacts, I will engineer edge cases designed to break the co-extensionality of the two views.

  This method is superior to the alternatives for two reasons. First, intuition-pumping about ordinary cases is question-begging; participants' intuitions are already contaminated by the very conceptual frameworks under investigation. Second, importing a general metaphysics of social kinds or artefacts assumes the answer. If we define virtual objects as social kinds ab initio, we presuppose Realism; if we define them by their prop-function, we presuppose Fictionalism.

  Instead, I will focus on implementation-sensitive edge cases where the functional profile diverges from the ontological ground. Potential candidates include:
  1.  **Intermittent Instantiation:** Objects in peer-to-peer networks that exist only when observed by a node.
  2.  **Glitch Ontology:** Items that function as intended but lack the underlying code structure (or vice versa).
  3.  **Post-Service Persistence:** Saved world states on local drives after server shutdowns.
  4.  **Unexperienced Harms:** Algorithmic events that satisfy the conditions for harm but occur without a witnessing subject.

  By rigorously specifying the truth conditions for existence in these scenarios, I will determine if the two views can be forced to disagree.

  **Work Plan**
  *   **Months 1–3: Taxonomy and Formalization.** I will catalog existing arguments for Realism and Fictionalism, extracting their necessary and sufficient conditions for virtual existence. I will formalize the "Equivalence Charge" to establish a clear criterion for divergence.
  *   **Months 4–6: Case Construction.** I will draft and refine at least five candidate divergence cases based on the categories above. This involves collaborating with computer science colleagues to ensure technical plausibility regarding distributed systems and data persistence.
  *   **Months 7–9: Stress Testing.** I will subject these cases to counter-arguments from both Realist and Fictionalist perspectives. The goal is to see if either view can accommodate the case without collapsing into the other or retreating to verbal maneuvering.
  *   **Months 10–12: Synthesis and Writing.** I will draft the final monograph/article. If divergence cases hold, I will articulate the substantive metaphysical distinction. If they fail, I will argue for a deflationary conclusion.

  **Outcomes and Success Conditions**
  A successful result takes one of two forms.
  *   **Positive Success:** I identify a robust class of cases where Virtual Realism and Virtual Fictionalism yield contradictory truth values (e.g., the object exists for the Realist but is merely fictional for the Fictionalist). This validates the dispute as substantive and locates the metaphysical friction point.
  *   **Negative Success:** I demonstrate that no such cases can be constructed because any apparent divergence can be resolved by clarifying functional or phenomenal facts. This supports the deflationary conclusion: the dispute is merely verbal.

  Project failure would consist only in an inability to rigorously prove either outcome—for example, if the cases remain too vague to force a verdict, or if the analysis stalls in ambiguity. Crucially, proving the dispute is verbal is *not* a failure of the project; it is a significant philosophical contribution that dissolves a stagnant debate.

  **Feasibility and Risks**
  This project is realistically achievable by one researcher in twelve months because it narrows a broad metaphysical debate into a specific methodological test. The scope is limited to the *substantivity* of the dispute, not a full defense of one side over the other. The primary risk is that the "edge cases" (e.g., glitches) will be dismissed by both sides as category errors rather than ontological tests. I will mitigate this by grounding the cases in technical literature on software engineering and distributed systems, ensuring they represent genuine possibilities in digital architecture rather than philosophical fantasies. Given the current stagnation in the literature, even a definitive negative result (deflationism) would be a high-impact contribution, clearing the ground for more productive inquiries into the ethics and phenomenology of virtual environments.
