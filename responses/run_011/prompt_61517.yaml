answer: |-
  This task is achievable. A hard-line expressivist does not cease speaking; she merely interprets her own speech differently than a realist does. The challenge is not linguistic impossibility, but tonal balance: the speech must sound like a tribute to the family (who expect realist grammar) while remaining philosophically honest to Ilse (who rejects realist semantics). The solution is to frame praise as the *expression* of our collective attitudes rather than the *description* of her moral properties, and to treat the Amos conditional as a meta-ethical observation about their dynamic rather than a first-order moral inference.

  Here is the speech, followed by the requested map.

  ***

  **Tribute to Professor Ilse Marchetti**

  Good evening. To Ilse's family, her former students, and her colleagues: thank you for being here. We are gathered to mark the end of thirty-five years of teaching, but also to celebrate a specific kind of intellectual courage. Ilse Marchetti spent a lifetime asking us to be precise about what we are doing when we speak.

  For those of us in the department, Ilse is known for a steadfast position. In an era where many of her peers sought to reconcile moral language with scientific facts, Ilse held the line. She argued that when we call an action cruel, we are not describing a feature of the universe like mass or velocity. We are expressing a stance. We are saying, "No to this." To her, a moral judgment was closer to a gasp of horror than to a map of the territory.

  This conviction was not held in isolation. It was forged over forty years of dinner-table debate with her husband, Amos. Amos was a realist of the old school; he believed value was something to be discovered, like a star or a stone. Their marriage was a living seminar on the nature of truth. Amos often captured the stakes of their disagreement with a specific conditional, one he would offer over coffee when the debate grew warm. He would say: "If goodness really were out there to be found, then Ilse spent her life insisting that the thing she kept bumping into was not there."

  It is a witty sentence, but it holds a profound respect. It acknowledges that Ilse never flinched. She would rather be accused of losing the plot inside a conditional than smuggle in a moral property she did not believe in. She taught us that integrity matters more than comfort.

  To her students, this was not abstract. Ilse did not just lecture on meta-ethics; she modeled a way of being. She thought cruelty was the worst thing, and she used to say that silence in the face of injustice was a form of complicity. When she advised students going into law or public health, she did not tell them to find the "right" answer in a textbook. She asked them what they were prepared to stand for. She urged them to recognize that their professional language carried weight, not because it mirrored the world, but because it shaped it. Many of you in this room carry that lesson. You remember her not for a theory, but for a demand: that you own your commitments.

  To her grandchildren, and to the family here: I know you do not need a lecture on semantics to know who Ilse was. You know her through holidays, through phone calls, through the way she listened. So I will not try to describe her character as if it were a fact written in the stars. Instead, I want to express what she means to us.

  We admire her. We are grateful for her rigor. When I say Ilse was kind, I am not reporting a metaphysical discovery. I am voicing the approval of this entire room. I am saying that her life commands our respect. Her legacy is not a set of true propositions left on a shelf. It is the way we think now, because she taught us how. It is the care you received, which was real, even if the "goodness" of it is a projection of our love.

  Ilse, you insisted that we not pretend our values are facts. So tonight, we make no such claim. We simply offer this: we stand with you. We honor your work. And we cheer for you.

  Thank you.

  ***

  ### Map of the Speech

  **1. Avowals of My Own Attitudes (Expressive/Non-Cognitive)**
  *   *"We admire her. We are grateful for her rigor."*
      *   **Function:** These are pure expressions of pro-attitude. They do not claim Ilse *possesses* "admirability" as a property; they state our reaction to her.
      *   **Compatibility:** Fully compatible with Ilse's view.
  *   *"When I say Ilse was kind, I am not reporting a metaphysical discovery. I am voicing the approval of this entire room."*
      *   **Function:** Explicitly frames the praise as an expression of collective attitude (boo/hurrah) rather than a description.
      *   **Compatibility:** This is the safest way to praise an expressivist without offending their semantics.
  *   *"And we cheer for you."*
      *   **Function:** A performative utterance. It *does* the praising rather than *describing* the praiseworthiness.

  **2. Embedded Evaluative Content (The Amos Conditional)**
  *   *"If goodness really were out there to be found, then Ilse spent her life insisting that the thing she kept bumping into was not there."*
      *   **Function:** This is the required conditional.
      *   **Analysis:** Note that the antecedent (*"If goodness really were out there..."*) is a **meta-ethical** claim about the existence of moral properties, not a **first-order** moral claim (e.g., "If stealing is wrong...").
      *   **Compatibility:** This avoids the Frege-Geach problem. Ilse's view struggles when moral sentences are embedded in conditionals to support logical inferences (e.g., "If lying is wrong, then getting your brother to lie is wrong"). However, a conditional *about* the existence of moral properties is a metaphysical hypothesis that an expressivist can discuss without contradiction. It treats "goodness" as a theoretical entity, which she denies exists. This sentence is safe.

  **3. Reports of Her States (Attitude Attribution)**
  *   *"She thought cruelty was the worst thing, and she used to say that..."*
      *   **Function:** This attributes a mental state to Ilse.
      *   **Compatibility:** Expressivists agree that people *have* attitudes. Reporting that "Ilse had a negative attitude toward cruelty" is a psychological fact, not a moral one. This is safe.
  *   *"She urged them to recognize that their professional language carried weight..."*
      *   **Function:** Reports on her speech acts and imperatives.
      *   **Compatibility:** Safe. Expressivists accept that people issue commands and advice.

  **4. Potential Realist Commitments (The Danger Zones)**
  *   *"Her legacy is not a set of true propositions left on a shelf. It is the way we think now..."*
      *   **Risk:** Low. This explicitly denies the "true propositions" framing.
  *   *"The care you received, which was real, even if the 'goodness' of it is a projection of our love."*
      *   **Risk:** Low/Medium. I explicitly label the "goodness" as a projection to signal to Ilse that I am not committing to realism. However, to the granddaughter, "the care you received... was real" sounds like a factual description.
      *   **Resolution:** An expressivist accepts empirical facts (care was given, neurons fired, emotions felt). They only deny *moral* facts. As long as "real" refers to the psychological impact and not a moral property, this is acceptable.
  *   *"I honor your work."*
      *   **Risk:** Low. "Honor" can be read as a verb of action (I am performing an honor) rather than an adjective (The work is honorable).

  **5. Quasi-Realist Moves**
  *   *"Her legacy... is the way we think now, because she taught us how."*
      *   **Analysis:** This leans slightly toward quasi-realism. A hard-line expressivist might worry that this implies her teaching *caused* a correct change in thinking. However, it can be read causally (she changed our dispositions) rather than normatively (she corrected our errors).
      *   **Verdict:** I have avoided the strongest quasi-realist move, which would be to say "We are *better* philosophers because of her." "Better" implies a moral/normative fact. "The way we think now" is descriptive of our current state.

  **Summary of Constraints:**
  I have not dropped any constraints. The speech uses the Amos conditional, reports her teaching attitudes, and praises her without asserting moral facts. The "map" reveals that the speech relies on the distinction between *psychological facts* (which Ilse accepts) and *moral facts* (which she rejects). The praise works for the family because natural language blurs this distinction; it works for Ilse because the explicit framing ("I am voicing approval") clarifies the intent.
