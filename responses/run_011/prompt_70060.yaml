answer: |-
  Here are the responses to your questions (a) through (e), followed by my concluding judgment on the best reading.

  ### (a) The Logical Form and the Thesis Content

  You are correct that if the thesis is formalized as $\forall x (Wx \land Hx \rightarrow Hx)$, it is a logical truth and cannot be denied without contradiction. Gongsun Long (GL) concedes the existential implication in Section 2 ("Where there is a white horse, one cannot say there is no horse"). Therefore, he is not denying class inclusion.

  **The Exact Content:**
  The thesis "A white horse is not a horse" must be read as an assertion of **non-identity of concepts (or names)**, not non-inclusion of extensions.
  *   **Formalization:** $Concept(\text{'White Horse'}) \neq Concept(\text{'Horse'})$.
  *   **Alternative Formalization:** $\neg (\text{'White Horse'} \equiv \text{'Horse'})$, where $\equiv$ denotes synonymy or identity of reference conditions.

  **Premises Attributed to GL:**
  1.  **P1:** 'Horse' names the shape; 'White' names the color. (Section 1)
  2.  **P2:** What names the color is not identical to what names the shape. (Section 1)
  3.  **P3:** 'White Horse' is the compound of the name 'White' and the name 'Horse'. (Section 3)
  4.  **C:** Therefore, the name 'White Horse' is not identical to the name 'Horse'.

  **Text Support:**
  In Section 1, GL explicitly grounds the argument in naming functions: "'Horse' is that by which we name the shape... What names the color is not what names the shape." He moves immediately from this semantic distinction to the conclusion "Hence: a white horse is not a horse." This indicates the copula "is" in the conclusion functions as "is identical in naming power to," not "is a member of the class." In Section 2, he concedes the existential point ("Where there is a white horse, one cannot say there is no horse") but distinguishes the *seeking* conditions. This confirms he accepts the extensional overlap but denies the equivalence of the terms.

  ### (b) Intensionality and Referential Opacity

  **Verdict:** The claim that this dialogue anticipates referential opacity (in the Fregean or Quinean sense) **mislocates the puzzle**.

  **Reasons:**
  Referential opacity concerns contexts where substituting co-referential terms changes the truth value of a proposition (e.g., "Lois Lane believes Superman can fly"). GL's argument in Section 2 does not rely on the mental state of the seeker creating an opaque context. It relies on the fact that the *extensions* of the terms relative to the *request* are different.

  1.  **Extensional Mismatch:** A yellow horse is in the extension of 'Horse' but not in the extension of 'White Horse'. When I seek a 'Horse', the set of satisfactory objects is $\{H_{white}, H_{yellow}, H_{black}\}$. When I seek a 'White Horse', the set is $\{H_{white}\}$.
  2.  **No Substitution Licensed:** The Questioner assumes that because $WH \subset H$, the term 'White Horse' can substitute for 'Horse' in the context of "seeking." GL shows this substitution fails not because "seeking" is opaque, but because the terms have different satisfaction conditions.
  3.  **Text Support:** GL states: "The yellow and the black horse are acceptable in the one case and unacceptable in the other." This is an observation about the objects' properties relative to the terms, not about the seeker's psychology. The failure of substitution is due to the **non-identity of the terms** (established in (a)), not the opacity of the context.

  Therefore, the puzzle is not about *de dicto* vs. *de re* attitudes, but about the **individuation of kinds**.

  ### (c) Equivocation on the Copula

  Your study group member is partially correct: the surface grammar shifts, but this shift serves a unified theoretical purpose rather than constituting a fallacious equivocation.

  **Diagnosis by Step:**
  1.  **Step 1 (Naming):** "White horse is not horse."
      *   *Reading:* **Identity of Definition.** 'White Horse' (Shape+Color) $\neq$ 'Horse' (Shape).
      *   *Validity:* Valid if 'is' means "is definitionally equivalent to."
  2.  **Step 2 (Seeking):** "What is sought... would be the same."
      *   *Reading:* **Equivalence of Satisfaction Conditions.** If $A = B$, then Request($A$) $\leftrightarrow$ Request($B$).
      *   *Validity:* Valid. GL shows Request($WH$) $\not\leftrightarrow$ Request($H$), therefore $WH \neq H$.
  3.  **Step 3 (Ontology):** "White horse is horse together with white."
      *   *Reading:* **Mereological Composition.** The object designated by 'White Horse' is a composite of the object designated by 'Horse' and the attribute 'White'.
      *   *Validity:* Valid if 'is' means "is composed of."

  **Uniform Reading?**
  There is **no single uniform reading** of the copula "is" under which the argument is formally valid in standard predicate logic without reconstruction.
  *   If "is" means class inclusion ($\subset$) throughout, Step 1 and 3 are false.
  *   If "is" means identity ($=$) throughout, Step 2's premise (that seeking implies identity) requires the intensional reading from (b), which GL rejects as sufficient for identity.

  **The Break Point:**
  The argument breaks if one demands a single logical operator for "is." However, GL's logic is not standard predicate logic. It is a logic of **Ming (Names)**. Under the uniform reading that "is" signifies **"is interchangeable in all contexts without loss of specification,"** the argument holds.
  *   Step 1: Not interchangeable in definition.
  *   Step 2: Not interchangeable in pragmatic request.
  *   Step 3: Not interchangeable in ontological composition.
  The "equivocation" is only apparent if one assumes "is" must denote class membership. GL assumes "is" denotes **identity of specification**.

  ### (d) Step 3 and the Separation Thesis

  Step 3 is the most metaphysical. It states: "A horse is inherently colored... White is not horse. A white horse is horse together with white."

  **Object vs. Name:**
  This step is about the **object designated by the name**, but treated through the lens of the name's components. It asserts that the referent of 'White Horse' is a compound entity, whereas the referent of 'Horse' is a simple entity (shape).

  **Separation Thesis Dependency:**
  Does this require the "Hard and White" separation thesis (that attributes like 'White' exist independently of the object)?
  *   **Yes, logically:** GL asserts "White is not horse." He treats 'White' as a distinct entity that can be "together with" Horse. If 'White' were merely a mode of the horse, he could not say "White is not horse" without qualification. He reifies the attribute.
  *   **No, ontologically (strictly):** He does not need to claim 'White' floats freely in the universe (as in the *Hard and White* dialogue). He only needs to claim that the *concept* 'White' is distinct from the *concept* 'Horse' and that their combination yields a new complex concept.

  **Where the Dependency Bites:**
  The dependency bites on the phrase **"Horse together with white."**
  *   If attributes are not separable units, a white horse is just a horse that is white.
  *   If attributes are separable units (as GL implies), a white horse is a sum: $Horse + White$.
  *   Since $Horse + White \neq Horse$ (mereologically), the conclusion follows.
  Without the separation of the attribute 'White' as a distinct component, the move from "White is not horse" to "White horse is not horse" loses its mereological force. The text supports this by saying, "If a horse were not colored, there would be horse and nothing more." This implies color is an add-on to the essential "Horse" (shape).

  ### (e) Mohist Parallels and Restrictions

  The Questioner's move in (2) ("If there is a white horse, there is a horse... how can a white horse be not a horse?") parallels the Mohist concern with inference patterns (specifically the *Lesser Take* or *Tui*). The Mohists discuss cases like "Killing a thief is not killing a man."

  **GL's Reply as a Restriction:**
  GL identifies a restriction on the inference pattern: **From $A \subset B$, it does not follow that Term($A$) $\equiv$ Term($B$).**

  **Semantic or Pragmatic?**
  The restriction is **Semantic**, manifested Pragmatically.
  *   **Pragmatic Surface:** The test used is "seeking" (a speech act/request).
  *   **Semantic Core:** The reason the request fails is that the *meaning* (extension relative to specification) of the terms differs.
  *   **Text Support:** "What is accepted and what is rejected are not the same." This refers to the criteria for applying the name.
  *   **Comparison to Mohists:** The Mohists would say the *Kind* (Lei) is different. GL says the *Name* (Ming) is different. GL's restriction is that you cannot substitute a specific name for a generic name in contexts requiring specific satisfaction, even if the specific is a subset of the generic. This is a semantic restriction on the substitutivity of terms based on their **intensional content**, not just their extension.

  ### Concluding Judgment: The Best Reading

  **Preferred Reading:** The **Identity of Specification** Reading.

  **Argument:**
  This reading survives the scrutiny of (a) through (e) with the least cost to the text's internal coherence.
  1.  **It solves (a):** It explains why GL denies "White Horse is Horse" while admitting "There is a horse." He denies Identity ($=$), not Inclusion ($\subset$).
  2.  **It solves (b):** It removes the need for referential opacity. The "seeking" argument is simply a test for the identity of specification (do these terms demand the same object?).
  3.  **It solves (c):** It provides a uniform intent behind the shifting copula. Whether discussing naming, seeking, or composition, GL is consistently arguing that the *specification* required by 'White Horse' is not identical to that of 'Horse'.
  4.  **It solves (d):** It accommodates the mereological language ("together with") as a way of describing the compounding of specifications.
  5.  **It solves (e):** It aligns with the Mohist concern for precise naming (*Zheng Ming*) without requiring GL to adopt Mohist logic fully.

  **The Cost:**
  Adopting this reading renders Gongsun Long's thesis **trivial in modern logic** but **radical in its context**.
  *   **Triviality:** In modern semantics, of course the string "White Horse" is not synonymous with "Horse." No logician denies this.
  *   **Radicalism:** In the Warring States context, where names were thought to track natural kinds directly, GL is arguing that language carves reality more finely than common sense admits. He is prioritizing the precision of the *Name* over the utility of the *Class*.
  *   **Philosophical Cost:** You must accept that GL is not making a deep metaphysical claim about the non-existence of white horses, but a rigorous semantic claim about the non-synonymy of compound terms. It makes him a philosopher of language rather than a metaphysician of forms. This contradicts interpretations that view him as a Platonic realist, but it fits the text provided better than any ontology-heavy reading.

  **Final Verdict:** Read "is" as "is identical in specification." The argument is a rigorous defense of the distinction between a genus and a species-differentiated compound, framed as an identity claim to provoke logical scrutiny.
