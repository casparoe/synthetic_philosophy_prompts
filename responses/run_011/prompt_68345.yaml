answer: |-
  1. **The Mechanism**
  You say the hypocrite's condemnation isn't hers to deliver. But the target's conduct was bad, and what she says is true. So what does the blamer's own record actually *do* to the blame?
  *Follow-up:* You'll likely say she implicitly grants herself an exemption. But what if she grants herself nothing—she failed, feels awful, and made private restitution? Does she still lack standing?

  2. **The Dee Case**
  Let's use Dee. She publicly tears into a contractor for padding invoices. He deserves it. But Dee under-reports royalties and thinks she's weak, not special. Does Dee lose standing?
  *Follow-up:* If she says yes: Does it change if Dee confessed to her accountant and started paying it back, but hasn't said a word to the contractor?

  3. **Scope**
  Does standing lapse only for the norm you've broken, or does it bleed sideways? Can a man who lies about money denounce someone who lies about sex?
  *Follow-up:* Make me hear how the edges of a norm get drawn. If you say "relevantly similar," how do you dodge the arbitrariness?

  4. **Location of Defect**
  If Dee can't say it, but her neighbor can, and the neighbor's sentence would be word-for-word identical. Is the defect in the target, the audience, or the speech itself?
  *Follow-up:* Can the contractor waive it? Can he say "I don't care, you're right" and hand standing back to Dee?

  5. **Self-Blame**
  Can Dee blame Dee? Does your view end up making self-blame the one kind of blame nobody can be a hypocrite about?
  *Follow-up:* If self-blame is immune, doesn't that make standing about social hierarchy rather than moral truth?

  6. **The Psychology**
  People seem to punish hypocrisy hardest when the hypocrite is visibly signalling virtue, even where the thing they blamed was real. Is that support for your account, or evidence that the folk concept is a mess?
  *Follow-up:* I need you to commit to one. If it's a mess, why build a theory on top of it?

  7. **The Political Consequence**
  If standing tracks your own compliance, is basically all public condemnation—politicians, columnists, the internet—standing-less?
  *Follow-up:* Own that or show where the block is. If you own it, isn't moral discourse just rule by the sinless?

  8. **The Target's Duty**
  If Dee lacks standing, does the contractor have a duty to ignore her?
  *Follow-up:* If he listens anyway, is he being virtuous or just submissive? Does your theory punish the target for accepting correction?

  9. **Truth vs. Authority**
  You say the condemnation isn't hers to deliver. But is it still *true*?
  *Follow-up:* If it's true but unauthorized, is morality a property of the act or the speaker?

  10. **The Function of Blame**
  What is blame *for* if not correction? If the hypocrite can't correct, what are they doing?
  *Follow-up:* If they're just making noise, why does it feel like an attack?

  ***

  **The Two Hardest Questions**

  **1. Question 1 (The Mechanism/Private Restitution)**
  This is the metaphysical core of her theory. She needs to explain *why* standing is lost without relying on the blamer's attitude (since the repentant blamer has the right attitude) or slipping into a requirement for moral perfection. If she says private restitution doesn't restore standing, she admits standing is about social status, not moral repair. If she says it does, she undermines the "strict liability" feel of her original claim.

  **2. Question 7 (The Political Consequence)**
  This forces her to confront the "Silencing Objection." Most standing theorists try to walk back the implication that only the sinless can speak. Forcing her to either admit that almost all public moral discourse is illegitimate (a radical, unpopular position) or explain why politicians don't count as "blamers" (which seems evasive) creates the most tension. This is the one that risks turning the interview into a debate about power rather than philosophy.
