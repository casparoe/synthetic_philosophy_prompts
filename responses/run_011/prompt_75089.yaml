answer: |-
  The distinction H.P. Grice drew between "what is said" and "what is implicated" is one of the most contested boundaries in the philosophy of language. Grice intended "what is said" to be the truth-conditional content of an utterance, determined by conventional meaning plus disambiguation and reference fixing. "What is implicated" was everything else recovered via inference about the speaker's intentions. The worry you have raised—that pragmatic intrusion makes "what is said" impure, rendering the boundary an artifact—is the central weapon of modern contextualism. It suggests that since context is required to determine even the basic proposition expressed, the semantic layer is not a distinct foundation but merely the first step of pragmatic inference.

  This worry is powerful, but it is not fatal. The distinction marks a real joint in the architecture of communication, provided we locate that joint not in the *purity* of semantic processing, but in the *normative status* of the resulting content. The line survives if we define it as the boundary between content that is mandatory for truth-evaluation and content that is optional for relevance. The skeptic is correct that pragmatics penetrates the determination of "what is said," but incorrect to infer from this that "what is said" ceases to be a distinct kind of object.

  To see why the pragmatic intrusion argument fails to dissolve the distinction, we must separate the *process* of recovery from the *product* recovered. The skeptic argues that because disambiguation (e.g., "bank"), reference fixing (e.g., "he"), and domain restriction (e.g., "every bottle [at the party]") all rely on contextual inference, they are all pragmatic. Therefore, there is no semantic core. This conflates the *source* of information with the *functional role* of that information in the communicative exchange.

  It is true that determining "what is said" requires pragmatic work. However, the pragmatic work involved in saturation (fixing a variable mandated by the syntax, like the domain of "every") is cognitively and normatively distinct from the pragmatic work involved in generating implicature. Saturation is mandatory; you cannot evaluate the sentence as true or false without it. If I say "Every bottle is empty," and you do not restrict the domain to the party, the proposition is likely false (there are bottles in warehouses worldwide). To understand the utterance as a claim about the world, you *must* restrict the domain. This is not an optional inference about why I am speaking; it is a prerequisite for the sentence having a truth value at all.

  Implicature, by contrast, is optional in this specific sense: the proposition expressed ("what is said") remains truth-evaluable without it. If I say "It is cold in here" to implicate "Close the window," the statement "It is cold in here" is still a complete, truth-evaluable claim even if you fail to grasp the request. The joint, therefore, is real. It lies between the content that constitutes the speaker's direct commitment to the state of the world (said) and the content that constitutes the speaker's hint about what to do with that commitment (implicated). The skeptic's error is assuming that because the *machinery* of inference is similar in both cases, the *output* is of the same kind. It is not. One output anchors the truth conditions; the other explains the relevance.

  Furthermore, the "bottoming out" objection you noted is not just a theoretical preference; it is a precondition for explaining communication itself. If there is no distinct layer of "what is said," we cannot explain irony, metaphor, or lying. When a speaker is ironic, they say *p* but implicate *not-p*. If "what is said" is just the first layer of implicature, irony collapses into a shift in meaning, and we lose the ability to explain the tension that makes irony ironic. We need a literal anchor to deviate from. Similarly, in cases of miscommunication, we distinguish between hearing the words wrong (semantic failure) and understanding the point wrong (pragmatic failure). If the boundary is an artifact, this diagnostic distinction vanishes. We would have no way to explain how a hearer can perfectly understand the proposition expressed yet completely miss the point. The cognitive architecture requires a semantic anchor to launch pragmatic inference.

  The verdict, then, is that the distinction survives, but it must be refined. It is not a line between "context-free" and "context-dependent." It is a line between **truth-conditional commitment** and **inferential expansion**. "What is said" includes all pragmatically derived content that is mandatory for the utterance to have truth conditions (including domain restriction and reference fixing). "What is implicated" is everything else. This preserves the joint because it tracks a difference in normative commitment: a speaker can be accused of lying if "what is said" is false, but only of misleading if "what is implicated" is false.

  We can test this verdict on the hard case: "John has a brain."

  In this utterance, the flat literal reading is that John possesses the biological organ. The standard hearing is a compliment regarding his intelligence. The skeptic might argue that because the biological reading is trivial and rarely intended, it is not "what is said," but merely a stepping stone to the real meaning. They might claim the compliment is the only real content.

  However, under the refined account, the biological reading is unequivocally "what is said." It is the truth-conditional content. It is mandatory for the sentence to function. The compliment is a generalized conversational implicature derived from the flouting of the maxim of Quantity (why state the obvious? to suggest a non-obvious correlate).

  Does this account predict the right result? Yes, and it does so by explaining the specific phenomenology of the utterance. We recognize the compliment *because* we recognize the literal meaning as trivial. The humor or force of the remark relies on the gap between the trivial truth of "what is said" and the valuable inference of "what is implicated." If the distinction were an artifact, this gap would not exist; there would just be a single meaning of "John is smart."

  Crucially, the distinction allows us to explain the cancellability test in this specific context. If I say, "John has a brain, but he's an idiot," the utterance is coherent. It sounds like a correction of a potential misunderstanding. This coherence proves that the biological meaning was the committed content ("said"), and the intelligence claim was the optional inference ("implicated"). If the intelligence claim were part of "what is said," the sentence would be a contradiction (like "John is smart but an idiot"). The fact that we can cancel the compliment without contradiction demonstrates that the joint is real. The literal meaning bottoms out as a truth-evaluable claim, distinct from the pragmatic inference.

  The worry about pragmatic intrusion is therefore not fatal. It correctly identifies that semantics is not context-insensitive, but it falsely concludes that context-sensitivity erases the semantic/pragmatic boundary. The boundary is not defined by the absence of inference in "what is said," but by the role that inferred content plays. "What is said" is the content we hold the speaker directly responsible for as a description of the world. "What is implicated" is the content we hold them responsible for as a guide to their intentions. This is a real joint in the normative structure of communication, and without it, we cannot explain how we manage to lie, joke, or misunderstand each other with such precision. The distinction survives, not as a wall between two isolated modules, but as a functional interface between decoding and inferring.
