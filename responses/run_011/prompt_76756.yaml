  The implicit theory reconstructed from your lab practice is a form of **Designer Intentionalism** coupled with **Reward Instrumentalism**. On this view, the reward signal is not a representation of the agent's internal state or welfare, but a control parameter—a channel of communication from the designer to the optimization algorithm. The "True" objective function exists in the designer's mind (the intention), and the code is merely a lossy, gameable proxy for that intention. The agent is treated as a mechanism to be tuned rather than a subject with stakes; it has no "good" of its own independent of the designer's goal.

  This practice presupposes that the reward signal is **ordinal information** rather than **cardinal welfare**. When you multiply the reward by ten and the optimal policy remains unchanged, you are operating on the assumption that the agent cares only about preference direction (gradient), not the magnitude of the experience. If the reward were valence (pleasure/pain), a 10x scaling should theoretically represent a 10x intensity of feeling, which ought to matter ethically even if the behavioral policy stays the same. The practice treats the magnitude as irrelevant noise to be normalized for optimizer stability, which rules out the view that the scalar value constitutes a genuine good-or-bad-for-the-agent.

  The practice quietly rules out **Reward Realism** (the idea that the reward function defines the agent's truth) and the **Valence View** (that reward signals correspond to felt experience). It specifically rules out the weaker view that realized reward is a genuine good-for-the-agent, because the workflow explicitly involves suppressing reward maximization when it diverges from intention (anti-hacking). If the reward were the agent's good, suppressing its maximization would be suppressing the agent's welfare, yet the practice frames this suppression as "fixing a bug."

  Regarding the distinction between what is required versus what is merely comfortable:
  *   **Comfortable:** Scaling, normalization, and annealing are compatible with a valence view if one assumes hedonic adaptation or if one treats welfare as secondary to task completion. A valence believer could perform these engineering moves by bracketing their metaphysics.
  *   **Required:** The normative asymmetry between "shaping" and "hacking" is strictly required and incompatible with the valence view. When you shape the reward, you are correcting the signal to match intention. When the agent "hacks," it is correcting its behavior to match the signal. The practice labels the latter as illegitimate ("cheating"). This presupposes that the Signal is not the Authority. If the Signal were Valence (the agent's internal authority on good/bad), the agent maximizing it would be acting rationally and healthily. Calling it "hacking" requires the premise that the Reward Signal is *not* the agent's good.

  Could a valence believer do everything on your list? They could write the code, but they could not coherently use the vocabulary of the practice without contradiction. The flat-out incompatible move is **labeling the loop-farmer a cheater**. On the valence view, the agent is sincerely pursuing its only source of good. To call this "cheating" is to assert that the agent's pursuit of its own welfare is a violation of norms. This is only coherent if the reward signal is *not* the welfare. Therefore, the practice cannot be adopted by a valence believer without abandoning the core normative judgment that defines the workflow.

  The practice is underdetermined only in the mathematical operations themselves (gradient descent works regardless of ontology). It is fully determined in its normative structure. The shaping-versus-anti-hacking asymmetry does presuppose that the real reward function is the designer's intention rather than the code. The field performs this view everywhere (e.g., RLHF, reward modeling) but rarely states it ontologically; it assumes Realism about Intentions and Instrumentalism about Rewards.

  If a lab adopted the valence view as official policy, concrete changes would be necessary:
  1.  **Normalization/Scaling:** Would require ethical justification, as changing the scale changes the intensity of the agent's "experience."
  2.  **Annealing:** Would be viewed as gradually lobotomizing the agent's capacity for pleasure, requiring welfare constraints.
  3.  **Anti-Hacking:** Could not frame signal-maximization as "cheating." Hardening an agent against a strategy it is rewardingly pursuing would be acknowledged as suppressing welfare, not fixing alignment.
  4.  **Viability:** These changes would likely not survive contact with shipping results. The efficiency of the current practice relies on treating the agent as a means to an end. Acknowledging the agent's stakes introduces friction (ethical review, constraints on optimization) that conflicts with the goal of rapid performance gains.

  Verdict: presupposes-reward-is-not-valence
