answer: |-
  Here is the specification for a theory of survival-through-uploading. Treat this not as a menu but as a stress test; a viable theory must navigate these constraints without collapsing into contradiction or ad-hocery.

  ### 1. The Cases
  A robust theory must deliver verdicts on these scenarios. The "Load" indicates how much common-sense weight the intuition carries versus how much it can be sacrificed for theoretical consistency.

  *   **Scan-and-Destroy (Teletransportation):** Your brain is scanned, destroyed, and an exact replica is activated elsewhere.
      *   *Intuition:* This is death; the copy is someone else who thinks they are you.
      *   *Load:* **High.** This is the baseline fear. However, it is often the first intuition sacrificed to save functionalism.
  *   **Gradual Replacement (Ship of Theseus/Chalmers):** Neurons are replaced one-by-one with functionally equivalent silicon chips until none of the original biology remains.
      *   *Intuition:* This is survival; you persist through the change.
      *   *Load:* **Very High.** Denying this leads to biological essentialism that contradicts most views on metabolic turnover.
  *   **Fission (Branching):** The upload process fails to destroy the original, or the scan creates two running copies.
      *   *Intuition:* Identity cannot hold (you cannot be two people), but "what matters" survives in both.
      *   *Load:* **Logical Necessity.** Numerical identity is one-to-one; survival can be one-to-many. Collapsing these breaks logic.
  *   **Copy + Original (Branching without Destruction):** A copy is made while you continue living biologically.
      *   *Intuition:* You are the biological one; the copy is a distinct individual with your memories.
      *   *Load:* **High.** Essential for distinguishing survival from duplication.
  *   **The Handshake Upload (Seminar Case):** An emulation is built and causally coupled to the biological brain. Biological neurons are deleted one-at-a-time as the em takes over the function. The em runs at 10x clock speed.
      *   *Intuition:* During the coupling, there is one mind distributed across two substrates. The speed mismatch creates a divergence in subjective experience duration (the em experiences weeks while the body experiences days).
      *   *Load:* **Medium-High.** Tests whether *synchrony* is required for identity. If functionalism is true, speed shouldn't matter; if phenomenology is true, the flow of time might break the unity of consciousness during the handshake.

  ### 2. The Distinctions
  A theory must explicitly separate these concepts. Collapsing them is a sign of conceptual confusion.

  *   **Numerical Identity vs. What Matters:** Identity is a logical relation (A = B). "What matters" is prudential concern (should I fear the future pain of B?). A theory can say identity fails but survival matters (Parfit), but it cannot conflate the two.
  *   **Survival vs. Duplication:** Survival implies continuity of the subject. Duplication implies the creation of a distinct subject with similar properties. A theory must explain why branching turns survival into duplication.
  *   **Qualitative vs. Numerical Sameness:** Being *exactly like* me is not *being* me. A theory based solely on similarity fails the Copy + Original case.

  ### 3. Science and Physics Constraints
  *   **Physical Supervenience:** The theory cannot rely on non-physical souls or magic. Mental states must supervene on physical states.
  *   **Causal Continuity:** There must be a causal chain connecting the earlier and later stages. Instantaneous popping into existence without causal history is not survival.
  *   **No Magic Thresholds:** The theory cannot posit a vague "percentage of replacement" where identity suddenly snaps. Neuroscience suggests no single neuron is load-bearing for identity.

  ### 4. Negotiability Check
  *   **"Must be compatible with Functionalism":** **Camp Preference.** Animalists reject this. It is not a neutral constraint.
  *   **"Identity must be Transitive":** **Non-Negotiable.** Logic dictates if A=B and B=C, then A=C. Any theory violating this is incoherent.
  *   **"Scan-and-Destroy is Death":** **Negotiable.** This is the most common intuition sacrificed to maintain consistency with Gradual Replacement.
  *   **"Substrate Independence":** **Camp Preference.** Biological essentialists reject this.
  *   **"Uniqueness of Identity":** **Non-Negotiable.** One person cannot be numerically identical to two distinct future people.

  ### 5. The Inconsistency Analysis
  Your hunch is correct: the triad of **(1) Gradual Replacement preserves me**, **(2) Branching breaks identity**, and **(3) Scan-and-Destroy doesn't preserve me** is jointly unsatisfiable.

  Here is the argument: If Gradual Replacement preserves identity, it must be because each individual step (replacing one neuron) preserves identity. If replacing one neuron preserves identity, then the destruction of that specific biological substrate is not fatal provided functional continuity is maintained. However, Scan-and-Destroy is merely the simultaneous replacement of all neurons (or substrates) with functional equivalents. If the *destruction of substrate* is the killer in Scan-and-Destroy, it must also be the killer in Gradual Replacement. If Gradual Replacement survives because of *continuous causal overlap*, then Scan-and-Destroy fails because it lacks overlap. But if you decompose Gradual Replacement into discrete steps, each step looks like a micro-Scan-and-Destroy of that neuron. To claim Gradual works but Scan-and-Destroy fails, you must assert a magic threshold where "enough overlap" becomes survival. This violates the **No Magic Thresholds** constraint. You cannot hold that substrate destruction is irrelevant in small doses but fatal in large ones without a non-arbitrary justification. Therefore, you must drop either the intuition that Gradual Replacement preserves identity (accepting biological essentialism) or the intuition that Scan-and-Destroy kills you (accepting uploading). Given the strength of the sorites pressure on Gradual Replacement, **Scan-and-Destroy doesn't preserve me** is the requirement that must go.

  ### 6. Contender Evaluation

  **Psychological Continuity Views:** These theories argue you survive where your memories and personality persist. They handle Gradual Replacement well but fail the Fission case without an ad-hoc "non-branching" clause. If identity requires non-branching, then Scan-and-Destroy looks like survival only if the original is destroyed, which makes survival depend on the death of the predecessor—a morally suspicious condition. They often collapse Identity and What Matters to save the theory.

  **Biological/Animalist Views:** These argue you are your organism. They are logically consistent and handle Branching easily (the copy is not you). However, they fail the Upload desiderata completely: Gradual Replacement is death (you are replaced by a robot), and Scan-and-Destroy is death. They satisfy the science constraints but render the seminar topic moot; for an animalist, uploading is suicide, full stop.

  **The Parfitian Line:** This view argues Identity is not what matters; Relation R (psychological continuity and connectedness) is. It dissolves the trilemma by denying the importance of Numerical Identity in Fission and Scan-and-Destroy. It handles Gradual Replacement and Handshake cases well by focusing on degrees of connection. However, it fails the "Identity" desideratum by definition—it tells you identity doesn't hold in uploading, only survival does. It satisfies the reasoning goal but changes the question.

  **Phenomenal-Continuity Views:** These focus on the unbroken stream of subjective experience. They handle Gradual Replacement well if the flow is uninterrupted. However, they struggle with the Handshake case: if the em runs at 10x speed, does the subjective stream diverge? If consciousness requires a specific temporal grain, the speed mismatch might break identity even during the handshake. They also face hard problems defining where the stream ends in Fission cases without appealing to physical facts.

  Verdict: The pair "Gradual replacement preserves me" and "Scan-and-destroy doesn't preserve me" cannot be jointly satisfied; "Scan-and-destroy doesn't preserve me" has to go.
