          7.  Evaluate alternative images (Helmsman, Physician, Defense Lawyer, Gardener, Lighthouse Keeper). What do they buy? What do they fail? Can they carry the "years not wasted" claim?
      *   **Constraint:** No sources or reading suggestions. Work through the argument in detail.

  2.  **Deconstruct the Archer Analogy (Mapping):**
      *   *Archer:* D.
      *   *Bow/Shaft:* Legal resources, money, time, energy.
      *   *Stance/Draw/Aim:* Legal strategy, filing motions, public advocacy, coalition building.
      *   *Release:* Filing the suit, the moment of argument.
      *   *Wind/Gust:* Judicial temperament, opposing counsel's surprises, political shifts, new scientific data.
      *   *Target:* The legal verdict/policy change (climate victory).
      *   *Score/Hitting:* Winning the case.
