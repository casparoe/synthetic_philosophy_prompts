      *   *Selection:* The Physician and Lighthouse Keeper do better work on the "care for others" and "duty" aspects. The Helmsman captures the "journey." But D. wants the *active struggle* of the Archer. The Physician is probably the strongest rival for the "years not wasted" claim because the act of care is inherently valuable regardless of cure.

