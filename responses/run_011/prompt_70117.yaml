          *   *Cost:* To repair, one must argue that the *value* is in the expenditure itself (sacrifice as virtue). This shifts from Stoicism to something closer to martyrdom or religious devotion. It undermines the "indifference to outcome" if the cost is ruin.

      *   *Candidate 3: Definition of Skill (Hitting vs. Aiming).*
          *   *Analysis:* We call an archer "good" if they hit. If they never hit, we say they aim poorly. D. says hitting doesn't matter.
          *   *Verdict:* Survives with repairs.
          *   *Cost:* Redefines "skill" entirely as "intention + effort." This creates the epistemic problem (see below).

  6.  **The Epistemic Problem (Aiming Well vs. Outcomes):**
      *   *Question:* Can "aiming well" be specified independently of outcomes?
      *   *Analysis:* Usually, we judge aiming by hitting. If I aim perfectly but miss due to wind, I still aimed well *technically*. But in law, "good aiming" (good law) often *is* defined by its ability to persuade (outcome).
      *   *D.'s Position:* If he defines aiming well as "doing everything in my power," and defines "everything in my power" by his own feeling of effort, it becomes unfalsifiable.
