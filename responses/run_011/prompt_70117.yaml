          *   *Cons:* Harvest is the point. If nothing grows, was it a garden or a waste of land?
      *   *Lighthouse Keeper:* Maintains the light, ships may still crash.
          *   *Pros:* Duty-based, outcome independent (light must shine regardless of ships).
          *   *Cons:* Passive. D. is active (litigation).
