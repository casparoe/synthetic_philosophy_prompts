  3.  **Identify Disanalogies (The "Harder" Part):**
      *   *Stakes:* Archer's ego/score vs. Others' fortunes (climate victims).
      *   *Impact:* Arrow hits target vs. Campaign alters the people involved (D., the lawyers, the public).
      *   *Target Selection:* Assigned by game rules vs. Chosen by D. (existential commitment).
