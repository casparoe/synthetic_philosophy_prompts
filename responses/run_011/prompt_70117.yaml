      *   *Relevant to Conclusion 2 (Coldness/Grief):* Stakes matter immensely. Grief for a missed arrow is different from grief for a warming planet.
      *   *Relevant to Conclusion 3 (Years not wasted):* Impact and Duration. If the campaign changes D. or the world regardless of the verdict, the "waste" calculation changes.
      *   *Merely Local Color:* Specific mechanics of bow vs. law.

  5.  **Evaluate the Three Candidate Objections:**

      *   *Candidate 1: Feedback Loop (Immediate/Visible vs. Delayed/Opaque).*
          *   *Analysis:* An archer sees the hit. A litigator might never know if they "aimed well" if the case drags on or settles obscurely.
          *   *Verdict:* Survives with repairs.
          *   *Cost:* Requires an internal metric of "good aiming" (procedural justice, rigorous argument) that is decoupled from the verdict. This risks solipsism.

      *   *Candidate 2: Repeatability/Cost (Cheap misses vs. Irreversible/High Stakes).*
          *   *Analysis:* Archery is a sport; climate litigation is existential. An archer shoots again. D. spends "all discretionary income."
