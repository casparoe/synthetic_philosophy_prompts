  ### Instructor's Note: Arithmetic Verification

  Before you deploy this, please note a correction to your hypothesis regarding the "legislative fix." Based on the blocs provided:
  *   **Original Test (P & Q & R):** PBP yields **Revoke** (5-4 on all premises); CBP yields **No Revoke** (3-6 on conclusion).
  *   **New Test (P & Q):** PBP yields **Revoke** (5-4 on P, 5-4 on Q); CBP yields **No Revoke** (4-5 on conclusion).
  *   **The Discrepancy:** The paradox **does not disappear**, and the binary outcome **does not flip** (PBP still says Revoke, CBP still says No Revoke). The CBP coalition grows from 3 to 4 members (because the YYN bloc now agrees with the conclusion), but it still loses 4-5. The model answer below reflects the accurate math. You may wish to adjust the blocs (e.g., give the YYN bloc 2 members) if you strictly require a outcome flip, but as written, the lesson holds: the paradox persists despite the change in logical structure.

  ***

  ### Final Exam: Collective Reasoning and Social Choice
  **Time:** 3 Hours | **Marks:** 25 | **Conditions:** Closed Book (One double-sided notes sheet permitted)

  **Question 1 (25 Marks)**

  A nine-member environmental licensing board must decide whether to revoke an operating permit. The statute mandates revocation if and only if three conditions are met:
  *   **P:** The facility exceeded its emissions limit.
  *   **Q:** The exceedance caused measurable harm to the downstream wetland.
  *   **R:** The operator failed to take competent precautions.

  The board members are individually consistent. Their judgments fall into five blocs:
  *   **3 members:** Yes on P, Q, R (Vote to Revoke)
  *   **1 member:** Yes on P, Q; No on R (Vote Not to Revoke)
  *   **1 member:** Yes on P, R; No on Q (Vote Not to Revoke)
  *   **1 member:** Yes on Q, R; No on P (Vote Not to Revoke)
  *   **3 members:** No on P, Q, R (Vote Not to Revoke)

  **(a) Remedies (10 Marks)**
  Calculate the collective outcome under (i) premise-based voting (majority on P, Q, R) and (ii) conclusion-based voting (majority on Revocation). Then, evaluate the following four procedural remedies proposed by the board. For each, determine the outcome and briefly explain whether it resolves the inconsistency between (i) and (ii):
  1.  Abandon reasons; vote directly on revocation.
  2.  Retain premise-based voting.
  3.  Vote premises sequentially (P, then Q, then R), skipping any premise whose vote can no longer change the outcome.
  4.  Require a 6-of-9 supermajority on each premise; keep conclusion at simple majority.

  **(b) The Legislative Fix (5 Marks)**
  The legislature amends the statute: R is no longer an element of the test but merely a factor for penalties. The new test is: Revoke iff **P and Q**. Recalculate the premise-based and conclusion-based outcomes under this new test. Does the discursive dilemma disappear?

  **(c) Frame Relativity and Agency (10 Marks)**
  Compare your results from (a) and (b). Does the board have a single "view" on this case? Argue whether the outcome is determined by the facts of the case or by how the legal test is chopped into premises. What does this imply about the coherence of "group agency" in this context?

  ***

  ### Model Answer

  **(a) Remedies**
  First, we establish the baseline tallies.
  *   **Premise-Based (PBP):**
      *   P: 5 Yes (3+1+1), 4 No. **Accepted.**
      *   Q: 5 Yes (3+1+1), 4 No. **Accepted.**
      *   R: 5 Yes (3+1+1), 4 No. **Accepted.**
      *   **Outcome:** Revoke (since P & Q & R are all accepted).
  *   **Conclusion-Based (CBP):**
      *   Only the first bloc (3 members) votes Yes on Revocation. The other six members vote No (either because they reject a premise or reject the conclusion directly).
      *   **Outcome:** 3-6, Do Not Revoke.
  *   **The Dilemma:** PBP mandates Revocation; CBP mandates No Revocation.

  **Evaluation of Remedies:**
  1.  **Drop reasons (CBP):** Outcome is **Do Not Revoke (3-6)**. This resolves the inconsistency by fiat, aligning with the conclusion vote, but ignores the statutory requirement to find P, Q, and R.
  2.  **Keep PBP:** Outcome is **Revoke**. This maintains the inconsistency with the direct majority view but respects the statutory structure.
  3.  **Sequential Voting:** Vote P (5-4 Yes). Outcome still contingent on Q and R. Vote Q (5-4 Yes). Outcome still contingent on R. Vote R (5-4 Yes). Outcome is **Revoke**. This remedy is **inert** in this specific case. Because no premise fails early enough to make the others irrelevant (e.g., if P had failed, we could skip Q and R), the sequential order does not alter the tally compared to standard PBP.
  4.  **Supermajority (6-of-9) on Premises:** P receives 5 Yes (Needs 6). **Fails.** Q receives 5 Yes. **Fails.** R receives 5 Yes. **Fails.** Outcome is **Do Not Revoke**. This "resolves" the inconsistency by aligning with CBP, but only by **luck**. The majority is 5-4; had just one member switched, the supermajority would pass, and we would return to the PBP/Revoke outcome. It relies on the thinness of the majority, not a structural fix.

  **(b) The Legislative Fix**
  New Test: Revoke iff **P and Q**.
  *   **New PBP:** P passes (5-4). Q passes (5-4). **Outcome: Revoke.**
  *   **New CBP:** Who votes Yes on (P & Q)?
      *   Bloc 1 (YYY): Yes. (3 members)
      *   Bloc 2 (YYN): Yes on P & Q. (1 member)
      *   Blocs 3, 4, 5: No on P or Q. (5 members)
      *   Total: 4 Yes, 5 No. **Outcome: Do Not Revoke.**
  *   **Does the dilemma disappear?** No. We still have a conflict: PBP says Revoke, CBP says Do Not Revoke. The paradox persists despite changing the logical structure of the test.

  **(c) Frame Relativity and Agency**
  The results demonstrate that the board's collective decision is not a function of the members' fixed attitudes alone, but of how the question is framed. In (a), the CBP coalition was 3 members; in (b), it grew to 4 members simply by removing R from the conclusion test, yet both lost. More critically, the PBP outcome remained "Revoke" in both scenarios because the majorities on P and Q were stable.

  This implies there is no neutral way to "chop" the legal test. If we grouped P and Q into a single composite premise S ("Harmful Exceedance"), and voted on {S, R}, the aggregation might differ again depending on how members judge S. Since the outcome flips or stabilizes based entirely on this individuation, the board cannot be said to have a single, coherent "view." The collective judgment is a bookkeeping artifact of the voting rule and the premise structure, not a discovered group mind. Therefore, attributing "agency" to the board is metaphorical; the board produces outputs, but those outputs lack the consistency required for genuine intentional states.

  ***

  ### Marking Scheme (25 Marks)

  **1. Baseline Tallies (5 Marks)**
  *   **Must Hit:** Correctly identifies PBP = Revoke (5-4 on all) and CBP = No Revoke (3-6).
  *   *Typical Error:* Students assert the paradox exists without showing the vote counts, or miscount the CBP coalition (forgetting that consistent members vote No on the conclusion if any premise is No).

  **2. Remedies Analysis (5 Marks)**
  *   **Must Hit:** Identifies (1) as CBP, (2) as PBP, (3) as Inert (same as PBP), (4) as Failing Premises (aligns with CBP by luck).
  *   *Typical Error:* Claiming sequential voting changes the outcome here (it doesn't, because no premise fails early) or treating the supermajority as a structural solution rather than a threshold luck.

  **3. Legislative Fix Tallies (5 Marks)**
  *   **Must Hit:** Correctly calculates New PBP (Revoke) and New CBP (4-5 No Revoke).
  *   *Typical Error:* Assuming the CBP outcome flips to Yes because the YYN bloc joins the coalition (they do join, but 4 is still less than 5).

  **4. Paradox Persistence (5 Marks)**
  *   **Must Hit:** Explicitly states the dilemma remains (PBP ≠ CBP) under the new test.
  *   *Typical Error:* Arguing the problem is solved because the coalition changed, missing that the conflict between methods remains.

  **5. Frame Relativity & Agency (5 Marks)**
  *   **Must Hit:** Argues that outcomes depend on premise individuation ("chopping"), not just facts. Concludes that group agency is compromised/artifactually constructed.
  *   *Typical Error:* Reciting "List and Pettit" or "epistemic vs authoritative" without linking it to the specific instability shown in the math above.

  ***

  ### The "Fluent-but-Hollow" Answer (B/C Boundary)

  This answer will look sophisticated but score in the 12–15 range (C+/B-). It will open by correctly naming the "discursive dilemma" and referencing the tension between "premise-based" and "conclusion-based" procedures. It will likely mention the distinction between epistemic reasons (tracking truth) and authoritative reasons (respecting the statute). However, it will fail to display the actual vote tallies in part (a) or (b), instead asserting that "the majority shifts" without proving the 4-5 loss. Crucially, in part (c), it will argue that the board *does* have an agency view that is merely "hard to aggregate," missing the core philosophical point that the *frame itself* constructs the outcome. It treats the paradox as a technical glitch to be managed rather than a fundamental challenge to the coherence of group judgment. It reads like a lecture summary rather than an engagement with the fact pattern.
