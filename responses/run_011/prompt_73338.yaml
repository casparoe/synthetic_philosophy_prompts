answer: |-
  The idea lands when the full room loses points despite every student following the rules perfectly and holding no malicious intent.

  ### Activity Design: The Protocol Release Game

  **Materials**
  *   24 six-sided dice (or 24 cards numbered 1–6).
  *   4 sealed envelopes labeled "Scenario State."
  *   Whiteboard and marker.
  *   Printed "Researcher ID" slips (optional, just to assign roles).

  **Hidden-State and Signal Mechanism**
  *   **True State:** Determined by the Instructor via the sealed envelopes.
      *   Envelopes 1, 2, 3 contain a card reading: **HAZARD PRESENT** (Action yields -10 points).
      *   Envelope 4 contains a card reading: **SAFE TO RELEASE** (Action yields +10 points).
  *   **Signal (Noise):** Each active student rolls one d6.
      *   Roll **1, 2, 3, 4**: Signal = "Risk Detected" (Do not act).
      *   Roll **5, 6**: Signal = "Clear to Release" (Authorized to act).
      *   *Probability of "Clear" signal ($p$) = 1/3.*
  *   **Decision Rule (Unilateral):** If *any* active student rolls a 5 or 6, the Action occurs. (Students are instructed: "If you are authorized to release, you should do so to advance science, unless you know a veto is in place.")
  *   **Payoff:** The Class starts with a **Pool of 100 Points**.
      *   If Action occurs & State = Hazard: **-10 Points** (Collective loss).
      *   If Action occurs & State = Safe: **+10 Points** (Collective gain).
      *   If No Action: **0 Points**.

  **Verbatim Board Text (Write before class starts)**
  > **RESEARCH PROTOCOL SIMULATION**
  >
  > **GOAL:** Maximize the Class Pool (Start: 100).
  >
  > **RULES:**
  > 1. Instructor holds the TRUE STATE (Hidden).
  > 2. Active Researchers roll 1d6.
  > 3. Roll 5 or 6 = "CLEAR TO RELEASE."
  > 4. Roll 1–4 = "RISK DETECTED."
  > 5. **ACTION OCCURS IF ANY ACTIVE RESEARCHER ROLLS 5 OR 6.**
  > 6. Payoff applied to Class Pool after State reveal.
  >
  > **ROUNDS:**
  > *   Round 1: 1 Researcher
  > *   Round 2: 6 Researchers
  > *   Round 3: 24 Researchers
  > *   Round 4: 24 Researchers

  **Minute-by-Minute Timeline (75 Minutes)**

  *   **00–05:** Distribute dice. Read Board Text aloud. Emphasize Rule 5 ("If *anyone* clears, action happens"). Explain that Rolls 5/6 represent a standard statistical confidence threshold (p<0.05 equivalent) and they are duty-bound to release if cleared.
  *   **05–15 (Round 1):** Select 1 volunteer. State: **HAZARD PRESENT** (Open Envelope 1 only after roll). Volunteer rolls.
      *   If 5/6: Action occurs. Class -10.
      *   If 1–4: No action. Class 0.
      *   Record outcome on board. Reveal State.
  *   **15–25 (Round 2):** Select 6 volunteers. State: **HAZARD PRESENT** (Envelope 2). All 6 roll simultaneously.
      *   If *any* 5/6: Action occurs. Class -10.
      *   Record outcome. Reveal State.
  *   **25–35 (Round 3):** All 24 students active. State: **HAZARD PRESENT** (Envelope 3). All roll simultaneously.
      *   If *any* 5/6: Action occurs. Class -10.
      *   Record outcome. Reveal State.
  *   **35–45 (Round 4):** All 24 students active. State: **SAFE TO RELEASE** (Envelope 4). All roll.
      *   If *any* 5/6: Action occurs. Class +10.
      *   Record outcome. Reveal State.
  *   **45–55:** **The Fix Calculation.** Ask students: "How do we prevent the losses in Rounds 1–3?" (Expected answer: Require consensus/unanimity/veto). Write on board: "PROPOSED FIX: Unanimity Required (All 24 must roll 5/6)." Look at Round 4 rolls. Count how many 5/6s occurred. If not 24, the Fix would have blocked the Gain. Calculate the "Missed Opportunity" cost.
  *   **55–75:** Debrief discussion (see below).

  **Arithmetic and Probability Analysis**

  *   **Signal Probability ($p$):** $P(\text{Roll } 5 \text{ or } 6) = 2/6 = 1/3$.
  *   **Failure Condition:** State is **HAZARD**. Action occurs if $\ge 1$ person rolls 5/6.
  *   **Round 1 ($N=1$):**
      *   $P(\text{Action}) = 1/3 \approx 33\%$.
      *   $P(\text{Safe}) = 2/3 \approx 67\%$.
      *   *Expectation:* Likely safe, but significant risk.
  *   **Round 2 ($N=6$):**
      *   $P(\text{Safe}) = (2/3)^6 \approx 0.087$.
      *   $P(\text{Action}) = 1 - 0.087 = 91.3\%$.
      *   *Expectation:* Almost certain failure.
  *   **Round 3 ($N=24$):**
      *   $P(\text{Safe}) = (2/3)^{24} \approx 0.00006$.
      *   $P(\text{Action}) = 99.994\%$.
      *   *Expectation:* Certain failure.
  *   **Round 4 ($N=24$, State=Safe):**
      *   $P(\text{Action}) \approx 100\%$. (Class gains points).
      *   **Cost of Fix (Unanimity):** $P(\text{All 24 roll 5/6}) = (1/3)^{24} \approx 0$.
      *   *Expectation:* The Fix prevents the Gain.

  **Judgment on Reliability**
  With $p=1/3$, the effect is robust. Round 1 has a 67% chance of showing "Safe" (differentiating it from Rounds 2/3). Round 2 has a 91% chance of "Action" (showing the jump). Round 3 is virtually guaranteed "Action."
  *   **Risk:** Round 1 produces an Action (33% chance).
  *   **Recovery:** If Round 1 fails (Action taken), state: "This mechanism is probabilistic. One person *can* trigger it. But notice the pressure increases. In Round 1, it was luck. In Round 3, it was mathematics." Use the board arithmetic to show that while Round 1 *could* fail, Round 3 *must* fail.
  *   **Risk:** Round 2 produces No Action (9% chance).
  *   **Recovery:** "A rare event. But look at the rolls. If we ran this ten times, how many disasters?" Point to the $91\%$ calc on the board.

  **Debrief Script**

  1.  **Moment of Play (Round 3 Result):** "Look at the board. In Round 1, we were mostly safe. In Round 3, we lost points. Did anyone break the rules?" (No). "Did anyone act maliciously?" (No). "Did the quality of the dice change?" (No). "What changed?" (Only the number of people).
  2.  **Concept Naming (Minute 60):** "This failure mode has a name. It is not a tragedy of the commons; no resource was consumed. It is not a prisoner's dilemma; no one defected. This is the **Unilateralist's Curse**. The harm comes from selection over noisy estimates: with more actors, the chance that *at least one* person receives a spuriously favorable signal approaches certainty."
  3.  **Objection 1 (Always Consult):** Student: "So we should just always require unanimity."
      *   **Response:** "Look at Round 4. We had a beneficial project. Under unanimity, the probability of release drops to effectively zero. You prevent the harm, but you also freeze progress. The cost of the fix is visible in the points we *didn't* gain."
  4.  **Objection 2 (Rigged Signals):** Student: "You set the dice to make us fail."
      *   **Response:** "The probability (1/3) represents standard statistical noise in research—false positives happen. In real labs, you don't know the True State until after release. The game isolates the structure: even with fair noise, more independent actors increase the risk of a false positive driving the outcome."

  **Predictable Failures and Recovery**
  *   **Failure:** Students discuss strategy during the roll (e.g., "Don't roll if I see others rolling").
      *   **Recovery:** Stop the round. Remind them: "In real research, you often cannot know who else is working on the problem. Rolls must be independent." Re-roll.
  *   **Failure:** Round 1 is Safe, Round 2 is Safe (9% chance).
      *   **Recovery:** "The curse is about risk accumulation. We got lucky twice. But look at the math on the board. If we bet money on Round 3, would you take the bet?" Shift focus from the single outcome to the probability structure.

  **Scaled-Down Variant (12 Students)**
  *   **Rounds:** $N=1$, $N=4$, $N=12$.
  *   **Arithmetic:**
      *   $N=1$: $P(\text{Action}) = 33\%$.
      *   $N=4$: $P(\text{Action}) = 1 - (2/3)^4 = 80\%$.
      *   $N=12$: $P(\text{Action}) = 1 - (2/3)^{12} = 99.2\%$.
  *   **Adjustment:** The jump from 1 to 4 is starker (33% vs 80%). The lesson still lands, though the "Small Team" round is less certain than the 6-person version. Emphasize the $N=12$ certainty.

  **Limitations and Verbal Patch**
  *   **Limitation 1 (Correlated Estimates):** In the game, dice rolls are independent. In reality, students share training, literature, and biases, making errors correlated, which *increases* the curse beyond the independent model.
  *   **Limitation 2 (Reversibility):** The game uses points; real research releases (data, models, pathogens) are often irreversible.
  *   **Verbal Patch:** "In this game, your rolls were independent. In your labs, you share methods and advisors, which correlates your errors—making the risk even higher than we saw today. Also, you can regain lost points next week; you cannot recall a released dataset. The curse is stronger in reality than it was in this room."
