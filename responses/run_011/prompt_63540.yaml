answer: |-
  # The Metamagical Sorting Instrument

  **Instructions:** Answer the following ten questions based on your immediate intuition about the specific scenario described. Do not worry about consistency yet; the Key at the bottom will tell you what your pattern implies.

  **Q1. The Platonia Baseline**
  Twenty people, all known to be highly rational and aware of the rules, must independently decide whether to send a telegram. If exactly one person sends, they win $1 billion. If zero or more than one send, nobody wins. You cannot communicate. Do you send the telegram?
  A) Yes, definitely.
  B) No, definitely.
  C) I send with a specific probability (e.g., 1 in 20).
  D) It depends on what I think they will do.

  **Q2. The Luring Lottery**
  Same group of twenty. You can buy entries for $1 each. The prize pool is $1 million, divided equally among all entries purchased. One entry is drawn at random to announce the winner, but everyone gets their share. How many entries do you buy?
  A) As many as I can afford (or a googolplex).
  B) Exactly one.
  C) Zero.
  D) I randomize my purchase.

  **Q3. The Perfect Copies**
  Back to the Telegram game ($1B for exactly one sender). You learn the other 19 participants are not just rational, they are *perfect physical copies* of you, in identical rooms, making the decision at the exact same moment. Do you send the telegram?
  A) Yes.
  B) No.
  C) I flip a coin to decide (randomize).
  D) I refuse to play; the setup is impossible.

  **Q4. The Known Action**
  Telegram game. Just before you decide, a reliable leak tells you that 11 of the other 19 participants have *already* sent their telegrams. Do you send yours?
  A) Yes.
  B) No.
  C) It doesn't matter.

  **Q5. The Naive Group**
  Telegram game. You learn the other 19 were picked at random from a phone book and have never heard of logic puzzles, game theory, or Hofstadter. Do you send the telegram?
  A) Yes (I'm the only rational one, I'll win).
  B) No (Too chaotic, likely 0 or >1 senders).
  C) I send with low probability.

  **Q6. The Googolplex Judgment**
  In the actual magazine Lottery, some people wrote numbers like $10^{100}$ as their entry count. This collapsed the prize to fractions of a penny. Was this a rational move?
  A) Yes, it was the dominant strategy.
  B) No, it destroyed the value for everyone.
  C) It was rational for them, but bad for the group.
  D) The question is meaningless.

  **Q7. The Mechanism**
  In the Perfect Copies scenario (Q3), if you decide to send, why do you expect the copies to send?
  A) Because my decision physically causes theirs.
  B) Because we are the same algorithm running on different hardware.
  C) Because my decision is evidence that they are the type of person who sends.
  D) I don't expect them to match me necessarily.

  **Q8. The Universal Test**
  When deciding, do you ask yourself: "What would happen if *everyone* in this room made the exact same choice I am making?"
  A) Yes, that is the primary question.
  B) No, I only care about what *I* do.
  C) Yes, but only as a moral check, not a calculation.
  D) Yes, because everyone *will* make the same choice.

  **Q9. The Counterfactual**
  If you had chosen differently in the Perfect Copies scenario, would the *logical facts* about what the copies chose be different?
  A) Yes, logically they must match me.
  B) No, their choice is already fixed in their local timeline.
  C) Logic doesn't work that way across space.
  D) There is no "if," because I am them.

  **Q10. The Goal**
  Ultimately, what are you trying to maximize?
  A) My own expected payout.
  B) The total payout for the group.
  C) My consistency with a rational rule.
  D) The moral rightness of the action.

  ***

  # The Key

  Map your answers to the Leaves below. Be warned: Some leaves occupy the same territory on the map, differing only in why they think they are standing there.

  ### Leaf 1: Causal Decision Theory (CDT)
  *   **Typical Pattern:** Q1(D/B), Q2(A), Q3(B), Q4(B), Q5(A), Q6(A), Q7(D), Q8(B), Q9(B), Q10(A).
  *   **The View:** Your fingers move your button; nothing else moves theirs. Correlation is not causation.
  *   **Platonia vs. Lottery:** **Diverges.** In Platonia, you send only if you think others won't. In Lottery, you send as many entries as possible (dominant strategy).
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send (Prize already lost).
      *   *Naive Group:* Send (You have an edge).
      *   *Perfect Copies:* Do not send (If you send, they send, 20 sends = 0 prize. Since you can't causally stop them, you minimize loss by not paying for the telegram).
  *   **The Googolplex:** **Predicts this behavior.** CDT says maximizing your share is rational regardless of the total pool size.
      *   *Vindication:* **Refuted by outcome.** While locally rational, it led to global ruin. CDT proponents argue they are still "right" because they couldn't have changed the others' actions, but the group collectively loses.

  ### Leaf 2: Evidential Decision Theory (EDT)
  *   **Typical Pattern:** Q1(C/B), Q2(B), Q3(C), Q4(B), Q5(C), Q6(B), Q7(C), Q8(D), Q9(B), Q10(A).
  *   **The View:** Your action is *news* about the world. If you send, it is likely others (who are similar to you) also send.
  *   **Platonia vs. Lottery:** **Converges.** In both games, sending more is "bad news" that correlates with a lower payout.
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send (News is already bad).
      *   *Naive Group:* Send with low probability (Correlation is weak with non-rationalists).
      *   *Perfect Copies:* Randomize (Your action is perfect evidence of theirs; you must act as if you control the correlation).
  *   **The Googolplex:** **Refutes this behavior.** EDT sees the googolplex as terrible news for expected utility.
      *   *Vindication:* **Vindicated.** Avoiding the googolplex preserves value.

  ### Leaf 3: Hofstadterian Superrationality (SR)
  *   **Typical Pattern:** Q1(C), Q2(B), Q3(C), Q4(B), Q5(C), Q6(B), Q7(B), Q8(D), Q9(A), Q10(C).
  *   **The View:** Rationality is a unique solution. If the problem is symmetric, all rational agents must find the same solution. You choose the solution that works if *everyone* chooses it.
  *   **Platonia vs. Lottery:** **Converges.** Strategy is "Do the thing that works if everyone does it." (Randomize 1/20 in Platonia; 1 entry in Lottery).
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send (Symmetry broken; the "all rational" condition failed).
      *   *Naive Group:* Send with low probability (They are not part of the rational cohort).
      *   *Perfect Copies:* Randomize (Logical identity mandates coordination).
  *   **The Googolplex:** **Refutes this behavior.**
      *   *Vindication:* **Vindicated.** SR would have saved the lottery.
  *   **Note on Separation:** This leaf is behaviorally identical to Leaf 4 (Parfit). The difference is metaphysical: SR claims logic *forces* convergence; Parfit claims you *are* the group.

  ### Leaf 4: Parfitian Reductionism (The "Group Agent")
  *   **Typical Pattern:** Q1(C), Q2(B), Q3(C), Q4(B), Q5(C), Q6(B), Q7(B/D), Q8(D), Q9(A), Q10(B).
  *   **The View:** There is no deep "self." You are a locus of decision for all agents relevantly similar to you. You decide on behalf of the cluster.
  *   **Platonia vs. Lottery:** **Converges.** (Same as SR).
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send (The cluster is already broken).
      *   *Naive Group:* Send with low probability (They are not in your cluster).
      *   *Perfect Copies:* Randomize (You are literally deciding for all 20).
  *   **The Googolplex:** **Refutes this behavior.**
      *   *Vindication:* **Vindicated.**
  *   **Separation Warning:** **Cannot be separated from Leaf 3 (SR) by empirical questions.** Both prescribe identical actions in all scenarios above. The distinction is purely philosophical justification (Logic vs. Identity). If you chose Leaf 3 or 4, you are in the same functional camp.

  ### Leaf 5: Kantian Universalism
  *   **Typical Pattern:** Q1(B/C), Q2(B), Q3(C), Q4(B), Q5(B), Q6(B), Q7(C), Q8(C), Q9(B), Q10(D).
  *   **The View:** Act only according to that maxim whereby you can at the same time will that it should become a universal law.
  *   **Platonia vs. Lottery:** **Converges.** (Universalizing "Everyone sends" leads to failure in both).
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send (Cannot universalize a winning move here).
      *   *Naive Group:* Do not send (If they are irrational, universalizing rational rules doesn't apply, but causing chaos is impermissible).
      *   *Perfect Copies:* Randomize (Universal law must account for the symmetry).
  *   **The Googolplex:** **Refutes this behavior.** (Cannot will a world where everyone grabs everything).
      *   *Vindication:* **Vindicated.**
  *   **Separation Warning:** Distinguishes from SR/Parfit on **Q10 (Goal)**. Kantians care about the *rightness* of the rule, not just the payout. If you care more about being Consistent (Q10-C) than Moral (Q10-D), you are SR. If Moral, you are Kantian.

  ### Leaf 6: The Logical Skeptic
  *   **Typical Pattern:** Q1(D), Q2(A), Q3(D), Q4(B), Q5(A), Q6(A), Q7(C), Q8(B), Q9(C), Q10(A).
  *   **The View:** The idea that your logic "reaches across" space to influence others is magical thinking. Counterfactuals about logical facts are nonsense.
  *   **Platonia vs. Lottery:** **Diverges.** (Treats them as standard causal problems).
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send.
      *   *Naive Group:* Send (You are causally isolated).
      *   *Perfect Copies:* Do not send (Rejects the premise that logical identity implies coordinated action without causal link).
  *   **The Googolplex:** **Predicts this behavior.**
      *   *Vindication:* **Refuted by outcome.** (Same as CDT).
  *   **Note:** This view is essentially CDT (Leaf 1) but with a stronger philosophical rejection of the *premises* of the dilemma rather than just the strategy.

  ### Leaf 7: The Unnamed Leaf ("Fair Share" Altruism)
  *   **Typical Pattern:** Q1(C), Q2(B), Q3(C), Q4(B), Q5(C), Q6(B), Q7(C), Q8(A), Q9(B), Q10(B).
  *   **The View:** I am entitled to 1/20th of the cooperative surplus. I will take exactly that, assuming others will take their share. If they don't, I still take mine.
  *   **Platonia vs. Lottery:** **Converges.** (Takes 1/20th probability or 1 entry).
  *   **Information Verdicts:**
      *   *11/19 Sent:* Do not send (Share already gone).
      *   *Naive Group:* Send (They might leave space).
      *   *Perfect Copies:* Randomize (They are me, so they will take their share).
  *   **The Googolplex:** **Refutes this behavior.**
      *   *Vindication:* **Vindicated.**
  *   **Status:** **Coherent but Undefended.** This view lacks a mechanism. Why should others respect your "fair share" if there is no enforcement or logical binding? It relies on hope rather than logic or duty. It occupies a stable point in the game but has no theoretical engine to get there.

  ***

  # Ghost Leaves (Unoccupied Combinations)

  **The "Magical Causalist"**
  *   **Pattern:** Believes your button press *physically causes* the others to match you (Q7-A), but acts like a CDT player (Q2-A).
  *   **Status:** **Incoherent.** If you believe your action causally forces others to match, you would never maximize entries in the Lottery, because you would know you are forcing everyone else to do the same, destroying the prize.

  **The "Selfless Defector"**
  *   **Pattern:** Wants to maximize Total Group Payout (Q10-B), but chooses Googolplex in Lottery (Q2-A).
  *   **Status:** **Incoherent.** You cannot maximize the group total by dividing it into infinity.

  **The "Kantian Egoist"**
  *   **Pattern:** Asks "What if everyone did this?" (Q8-A) but only to maximize Personal Payout (Q10-A), and rejects Logical Counterfactuals (Q9-C).
  *   **Status:** **Deeply Unattractive/Unexplored.** This is using the Categorical Imperative as a heuristic for greed. It usually collapses into CDT or SR upon scrutiny. Nobody defends this explicitly, though many may accidentally inhabit it.

  ***

  # Summary of the Three Sticking Points

  | View | 11/19 Already Sent | Random/Naive Group | 20 Perfect Copies | Platonia vs. Lottery | Googolplex Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **CDT** | Don't Send | Send | Don't Send | **Different** (Send 1 vs Send Max) | Rational (but ruinous) |
  | **EDT** | Don't Send | Low Prob Send | Randomize | **Same** (Restrain in both) | Irrational |
  | **Superrational** | Don't Send | Low Prob Send | Randomize | **Same** (Restrain in both) | Irrational |
  | **Parfit** | Don't Send | Low Prob Send | Randomize | **Same** (Restrain in both) | Irrational |
  | **Kantian** | Don't Send | Don't Send | Randomize | **Same** (Restrain in both) | Immoral |
  | **Skeptic** | Don't Send | Send | Don't Send | **Different** (Send 1 vs Send Max) | Rational (but ruinous) |
  | **Fair Share** | Don't Send | Send | Randomize | **Same** (Restrain in both) | Greedy |

  *Note on SR vs. Parfit:* As indicated in the table, these two views are **empirically indistinguishable** in this instrument. They differ only on whether the binding force is "Rational Necessity" (SR) or "Identity Reduction" (Parfit). If your group splits here, they are arguing metaphysics, not decision theory.

  *Note on Googolplex:* The fact that the prize collapsed refutes the *collective wisdom* of CDT/Skeptic players, but does not refute the *individual rationality* of their move. SR/Parfit/EDT players claim their view is superior because it scales to groups without requiring external enforcement.
