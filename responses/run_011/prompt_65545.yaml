answer: |-
  The whiteboard was already crowded with notation when Iris capped her marker and turned to Owen. The afternoon light was fading over the department courtyard, but neither of them had noticed. They had been circling the same problem for an hour: whether Cost-Calibrated Accuracy (CCA) could survive the tension between its two admissibility conditions.

  'Let's be precise about the incompatibility,' Iris said, tapping the board where she had written the definition of CCA. 'You want a scoring rule that is proper, so that I maximise expected accuracy by reporting my true credence. But you also want the penalties for error to track the practical costs of being wrong. In Ada's case, the cost of a false negative is twenty times the cost of a false positive.'

  'Exactly,' Owen replied, leaning against the desk. 'If the epistemic norm is to minimise expected inaccuracy, and inaccuracy is measured by a rule that respects the stakes, then the norm itself becomes stakes-sensitive. That's the compromise.'

  'But look at the minimisation condition,' Iris said, picking up the marker again. 'Suppose we use a quadratic rule. Standard Brier score is $(c - w)^2$. Expected loss is minimised when report $c$ equals credence $p$. Now apply your weighting. Let the penalty for being wrong when the weld is defective ($w=1$) be $20k$, and when it is sound ($w=0$) be $k$. The expected loss function becomes $L(c) = p \cdot 20k(1 - c)^2 + (1 - p) \cdot k c^2$.'

  She wrote the derivative beneath it. 'To find the report that minimises this, we differentiate with respect to $c$. We get $-40kp(1 - c) + 2k(1 - p)c = 0$. Solve for $c$, and you get $c = 20p / (19p + 1)$.' Iris turned back to him. 'Ada's credence is 0.30. Plug that in. The report that minimises expected weighted loss is roughly 0.89. If CCA requires her to report 0.89 to satisfy the cost-tracking condition, it violates properness. She is not reporting her credence. If CCA requires her to report 0.30 to satisfy properness, the penalties do not effectively track the costs in the minimisation step. You cannot have both.'

  Owen rubbed his chin. 'I see the algebra. If the weights attach to the states, properness breaks. But what if the weights attach to the propositions scored, not the states? We calibrate the rule such that it remains proper *for the agent*, but the scale of the accuracy varies?'

  'Then the rule is proper,' Iris conceded, 'but only relative to a transformed credence function. But let's grant your compromise for the sake of argument. Assume we retain properness strictly. Ada reports 0.30. What has stakes-sensitivity bought you synchronically? Nothing. Her doxastic state is identical to the stakes-neutral view.'

  'Owen sighed. 'I'll concede the synchronic point for the moment. If properness is the price of probabilism, I won't pay it with distorted credences. But look at the diachronic picture. Point two. The second radiograph.'

  'You want the value of information,' Iris said.

  'Yes. Does CCA change the expected accuracy value of running the test relative to a symmetric rule?'

  'Let's compute it,' Iris said, turning back to the board. 'Under a standard proper rule, the value of information is the reduction in expected inaccuracy. Prior expected loss is $p(1 - p)$. With $p=0.3$, that's $0.21$. Now, the test. Likelihoods are 0.8 for a positive given defect, 0.1 for a positive given sound. Probability of a positive report is $0.8(0.3) + 0.1(0.7) = 0.31$. Probability of negative is $0.69$.'

  She scribbled the posteriors. 'Positive posterior is $0.24 / 0.31 \approx 0.77$. Negative posterior is $0.06 / 0.69 \approx 0.09$. Expected posterior loss is $0.31 \times (0.77 \times 0.23) + 0.69 \times (0.09 \times 0.91)$. That's roughly $0.055 + 0.057 = 0.112$. The gain in accuracy is $0.21 - 0.112 = 0.098$.'

  'And under CCA?' Owen pressed.

  'Under CCA, we weight the loss by the costs. The false negative is the costly error. The test is informative primarily because it rules out the costly state. If we weight the loss associated with $w=1$ by 20, the prior expected weighted loss jumps significantly. But crucially, the posterior expected weighted loss drops more sharply when the test is negative, because that's when we rule out the costly state.' Iris paused, calculating the ratio. 'The value of information increases. Under the symmetric rule, the gain was roughly 0.10. Under the weighted rule, because the reduction in uncertainty about the high-cost state is valued more highly, the expected epistemic utility of running the test is higher. CCA makes inquiry into high-stakes propositions more epistemically valuable.'

  Owen nodded slowly. 'So even if Ada's credence stays at 0.30, the epistemic norm recommends gathering evidence more strongly than the stakes-neutral view does. That's something.'

  'It's something,' Iris admitted. 'But it's not encroachment on belief. It's encroachment on inquiry. Now consider point three. Three months later. Traffic is banned. The cost ratio falls to 1:3. No new evidence about the weld. Does Ada's credence change?'

  'If properness holds, no,' Owen said. 'Her evidence is the same.'

  'Then CCA is inert,' Iris said sharply. 'You've built a framework where stakes matter, but changing the stakes changes nothing about the doxastic state. You've relocated stakes to the admissibility constraint, but if the constraint doesn't shift the credence, what work is it doing?'

  'It shifts the admissibility of future rules,' Owen countered. 'But I grant you, it looks inert synchronically. Unless... unless we say the partition changes.'

  'The granularity?' Iris asked.

  'Yes. Point four. Ada's colleague is writing a methods paper. Stakes 1:1. Ada is on-site. Stakes 20:1. If they both use proper rules over the proposition *the weld is defective*, they agree. But what if CCA requires Ada to score over a partition that includes *action-guiding states*? If her partition is finer, tailored to the practical context, then her credence distribution is over different objects. They aren't disagreeing about $p$; they are scoring different things.'

  'That saves disagreement,' Iris said, 'but it saves it by changing the subject. If epistemology is about fitting beliefs to the world, and the world hasn't changed, why should the partition change? You're smuggling pragmatism into the metaphysics of the proposition.'

  'Perhaps,' Owen said. 'But consider point five. The stronger move. Abandon properness. If I accept your calculation that weighting penalties breaks properness, I might say: so much for properness. Let the rule be modest. Let Ada report 0.89 because that's where the weighted loss minimises. That gives you direct stakes-sensitivity in belief.'

  Iris shook her head. 'Then you lose the dominance argument for probabilism. That is the framework's prize. If your credences can be accuracy-dominated by a probabilistic alternative, why be probabilistic? You forfeit the mathematical foundation of accuracy-first epistemology. You become an instrumentalist.'

  'And you face a reciprocal charge,' Owen replied. 'If your admissibility constraints — properness, additivity, continuity — are motivated solely because they are required for the dominance theorems, then your choice of constraints is question-begging. You're defining "epistemic" as "that which satisfies the theorems". Why not define "epistemic" as "that which respects the stakes of truth"?'

  'That's the crux,' Iris said. 'But let's push it to point six. Moral costs. Suppose the proposition is whether a junior colleague falsified data. False positive ruins a career. False negative risks scientific integrity. If CCA extends here, you license believing against evidence for moral reasons. You allow Ada to believe the weld is sound because believing it defective is too costly to her conscience.'

  'I wouldn't put it that way,' Owen said. 'I'd say the epistemic norm itself reflects the moral weight of error. But I concede, if CCA applies here, it looks like wishful thinking. I need a principled line between practical costs of bridge failure and moral costs of accusation.'

  'And I need a principled line between admissibility constraints that preserve theorems and those that preserve truth,' Iris said. She put the cap back on the marker. 'We're stuck.'

  'Not quite,' Owen said. 'We know where the break is.'

  They stood in silence for a moment, looking at the equations that refused to reconcile.

  'The crux is this,' Iris said finally. 'To accommodate you, I must give up the assumption that epistemic norms are invariant to the agent's practical situation. I must allow the scoring rule itself to vary with stakes, even if it threatens properness.'

  'And to accommodate me,' Owen said, 'you must give up the assumption that accuracy is the sole fundamental epistemic good. You must admit that "fitting the world" is partly constituted by "serving the agent's needs".'

  'Which point is fatal for you?' Iris asked.

  'Point one,' Owen said. 'If CCA cannot shift synchronic credence without breaking properness, then it fails as a theory of justification. It becomes a theory of inquiry only. I need belief to encroach.'

  'And for me?' Owen asked.

  'Point five,' Iris replied. 'If you abandon properness, you lose the dominance argument. Without dominance, accuracy-first epistemology collapses into pragmatism. I cannot concede that.'

  'Then we have our work cut out,' Owen said, picking up his coat.

  'Indeed,' Iris said, wiping the board clean. 'But at least we know where the fault line runs.'
