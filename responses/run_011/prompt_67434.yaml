  **Closest Analog:** **Case 1 (The Excavator Revising Dates).**
  *   **Similarity:** Both involve revising established chronologies using AMS dating. Both researchers demonstrated high integrity by publicly abandoning or correcting their own prior positions in light of new data (Case 1: "explaining which of her own earlier claims the new data forced her to abandon"; New: "retracted the paper herself"). Both faced the risk of upending museum labels.
