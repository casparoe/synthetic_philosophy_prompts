  ### Underdetermination and Principles
  The record genuinely **underdetermines** this decision because we have no precedent for a high-integrity, falsifiable claim that is materially unreplicable. Every past acceptance allowed for some form of external checking. By voting, we will be adopting a new principle:

  *   **If we vote YES:** We adopt the principle that **"Methodological Honesty supersedes Replicability when material constraints are external."** We affirm that the museum platforms the *process* of science (handling uncertainty, transparency) even when the *product* (the data) cannot be double-checked. We prioritize modeling scientific character over guaranteeing evidentiary permanence.
  *   **If we vote NO:** We adopt the principle that **"Museum Endorsement requires Permanent Verifiability."** We affirm that the museum's name cannot be attached to claims that become dogma by circumstance, regardless of the researcher's integrity. We prioritize the stability of the public record over the nuance of scientific uncertainty.

  ### The Hypothetical Tie-Breaker Precedent
  To have settled this matter in an earlier season, we would have needed a proposal that forced a choice between Rule II (Integrity) and Rule III (Robustness/Replication).

  **Hypothetical Case:**
