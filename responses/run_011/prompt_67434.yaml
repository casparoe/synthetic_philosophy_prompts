  *   **If we had Accepted:** The current proposal must be accepted. The constraint (reburial vs. bog/landowner) is functionally identical, and the integrity profile matches.
  *   **If we had Rejected:** The current proposal should be rejected. It would establish that "uncheckable results" are an absolute bar, regardless of the researcher's honesty or the external nature of the constraint.

  Since we do not have this precedent, I argue we should vote **Yes**. To vote No is to conflate *pseudoscience* (which hides data) with *fragile science* (which exposes data but lacks samples). Given our mission to combat pseudohistory, distinguishing these two is our highest duty.
