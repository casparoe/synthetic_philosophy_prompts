  ### Prediction
  Based on the committee's six prior verdicts, the record commits us to **accepting** the proposal, provided we prioritize the *methodological integrity* precedents over the *replication* precedents. While the lack of replicability is a deviation from our accepted cases (1, 3, 5), the researcher's conduct aligns perfectly with the specific behaviors that distinguished our acceptances from our rejections: explicit falsifiability, transparency regarding contamination/error, and a demonstrated willingness to abandon claims when proven wrong. Our rejections (2, 4, 6) were driven by unfalsifiability and intellectual defensiveness, not merely by thin evidence. To reject this proposal would be to punish material misfortune (the bog conditions) rather than methodological sin, which contradicts the pattern of Case 1 and Case 5.

  ### Candidate Rules Derived from Past Verdicts
  To justify this prediction, we must make explicit the implicit rules that account for our past six decisions. There are three distinct candidate rules:

  **Rule I: The Falsifiability Constraint**
  *   **Definition:** A proposal is rejected if the proponent cannot articulate a specific empirical finding that would refute their thesis. A proposal is accepted if they define clear conditions for their own claim's abandonment.
  *   **Application to Past:**
      *   *Accepted (1, 3, 5):* In all three, speakers specified what would disprove them (contamination signatures, statistical probability thresholds, modern smelting signatures).
      *   *Rejected (2, 4, 6):* In all three, proponents insulated their claims (absence of remains = drowning; added parameters to avoid mismatch; aliens explain anything).
  *   **Application to New Proposal:** **Pass.** She specified that a contamination signature would discard the date and that a lack of further early dates would count against the claim.

  **Rule II: The Integrity and Transparency Clause**
  *   **Definition:** A proposal is favored if the researcher demonstrates intellectual honesty regarding limitations, contamination risks, and past errors. A proposal is rejected if the researcher moves goalposts or ignores methodological risks.
  *   **Application to Past:**
      *   *Accepted (1, 5):* Case 1 abandoned earlier claims; Case 5 specified refutation criteria in advance.
      *   *Rejected (4):* Proposer added parameters when challenged (moving goalposts). Cases 2 & 6 implicitly failed by refusing to acknowledge counter-evidence.
  *   **Application to New Proposal:** **Pass.** She retracted a prior erroneous paper, co-authored a methods correction, and is offering raw instrument data.

  **Rule III: The Empirical Robustness Standard**
  *   **Definition:** A proposal is accepted only if the evidence is robust enough to allow independent verification (multiple samples, replication, or statistical significance). A proposal is rejected if it rests on a single, uncheckable observation.
  *   **Application to Past:**
      *   *Accepted (1, 3, 5):* Case 1 had 12 dates; Case 3 had statistical modeling; Case 5 had independent lab replication.
      *   *Rejected (2, 4, 6):* All relied on subjective matches or unfalsifiable premises.
  *   **Application to New Proposal:** **Borderline/Fail.** There is only one date, the sample is destroyed, and no replication is possible.

  ### Analysis of the New Proposal
  Under Rules I and II, the proposal is a clear **Accept**. The researcher's conduct is the antithesis of the pseudohistorians we rejected in Cases 2, 4, and 6. She is modeling exactly the behavior we wish to showcase: science as a self-correcting process.

  Under Rule III, the proposal is a **Reject**. We have never accepted a talk based on a single, unreplicable data point. Case 5 is the strongest precedent here: the committee explicitly noted that "a second laboratory had replicated the analysis" as a condition for acceptance.

  **Resolution:** The committee's mission is to "bring interesting and defensible claims... [to an audience that] cannot readily distinguish [scholarship] from pseudohistory." Pseudohistory is defined by a failure of Rules I and II (unfalsifiability and dishonesty), not necessarily Rule III (pseudohistorians often produce endless "data," just bad data). Therefore, Rules I and II are the primary filters for our mission. Rule III is a secondary safeguard. In this instance, the rigorous contamination checks (which passed) serve as *internal* robustness, mitigating the lack of *external* replication. The record commits us to Acceptance because the researcher satisfies the *spirit* of Robustness (error control) even if she cannot satisfy the *letter* (multiple samples).

