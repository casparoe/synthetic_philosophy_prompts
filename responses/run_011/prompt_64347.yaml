  7.  **Refining the Process Argument:**
      *   Name the bias. "Silent Evidence Bias."
      *   Explain why the current audit fails: It confuses "lack of documentation" with "lack of purpose."
      *   New Standard: If purpose is unknown, classify by *risk potential*, not just historical record.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I preach about tradition? *Correction:* Ensure I focus on risk management and command integrity, not "respecting elders."
      *   *Check:* Did I address the 11 minutes? *Correction:* Yes, explicitly state that 11 minutes is unacceptable and the new rule fixes it.
      *   *Check:* Is the user's diagnosis validated? *Correction:* Yes, explicitly incorporate their insight about the audit manufacturing ignorance.
      *   *Check:* Is it actionable? *Correction:* Include specific voting items and timelines.

  9.  **Final Polish:**
