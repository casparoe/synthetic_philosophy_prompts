  *Argument for "Right":* The user identifies a selection bias. Rules that work quietly don't generate records. Rules that break get recorded. Therefore, looking for records biases against quiet, effective rules. This is logically sound (Chesterton's Fence + Survivorship Bias).
  *Decision:* The diagnosis is intellectually robust. I will not contradict it. I will build the memo on it.

