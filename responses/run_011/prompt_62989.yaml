answer: |-
  ### The position, sharpened

  Your view claims contractualism dissolves the aggregation problem by denying interpersonal summation. Justification is addressed to each person separately; therefore, complaints cannot sum across persons. When numbers seem to matter, you argue this is explained by alternative mechanisms: the strength of individual complaints varies, weighted lotteries resolve ties, or each member of the many holds a distinct complaint against the agent. The most exposed bit is the **mechanism for symmetric harms**. In cases where harms are identical (e.g., death vs. five deaths), individual complaint strength is equal. If complaints don't aggregate, there is no contractualist resource to override the lone individual's reasonable rejection in favor of the many without smuggling in summation under a different name.

  ### Defeaters, ranked

  **1. The Symmetric Rescue Case (Fatal)**
  In the standard Rescue Case, one person faces death on one path, five on the other. Harms are identical. If complaints do not aggregate, the single individual's reason to reject a principle saving the five is equal to any single member of the five. Contractualism requires that a principle be justifiable to each individual. Without aggregation, the one person's veto stands undefeated by the five individual vetoes. Your view must either mandate a lottery (contradicting the strong intuition that we should save the five) or explain why the one's rejection is overridden. If you say the five outweigh the one, you are aggregating. If you say lottery, you fail the intuition test. There is no third option that respects non-aggregation.
  *Bite: Fatal. It forces a choice between core contractualist constraints and basic moral intuition.*

  **2. Small Harms vs. Catastrophe (Fatal)**
  Contractualism notoriously struggles with cases where many small harms compete with one large harm (e.g., one death vs. a million broken arms). If complaints do not aggregate, the individual suffering death has a stronger complaint than any individual suffering a broken arm. Therefore, the principle permitting the death to prevent the arms is reasonably rejectable by the dying person, but not by the arm-breakers individually. Your view inherits this counterintuitive result: you must let the one die rather than aggregate the million minor complaints. To avoid this, you must claim the individual complaint of a broken arm is somehow stronger than death (implausible) or that the million complaints combine. Denying aggregation here makes contractualism implausibly rigid regarding minor burdens.
  *Bite: Fatal. It renders the view incapable of handling trade-offs involving minor harms.*

  **3. Weighted Lotteries as Covert Aggregation (Severe)**
  You suggest weighted lotteries might explain why numbers matter. However, if the weight corresponds to the number of people (e.g., a 5/6 chance for the group of five), you are assigning moral probability based on headcount. But why does headcount matter if complaints are equal and non-aggregating? The only justification for weighting the lottery toward the larger group is that the *total* moral weight of the group is higher. This treats the group's size as a reason to increase probability. This is aggregation re-described probabilistically. You haven't solved the problem; you've hidden the summation inside the probability mechanism rather than the outcome. The math still sums, even if the ontology denies it.
  *Bite: Severe. It suggests your solution is merely semantic, not structural.*

  **4. The Generality of Principles (Severe)**
  Principles must be general, not agent-relative. A principle saying "Save the larger group" is aggregative. A principle saying "Flip a coin" ignores numbers. Your view needs a principle that respects numbers without aggregation. But any principle sensitive to numbers implicitly acknowledges that the *collection* of burdens matters. If the justification is to each person, the principle must be rejectable by each. If the one can reject "Save the Many," why is that rejection unreasonable? Only if the Many's combined burden outweighs the One. To claim the principle is acceptable to the One because "there are more of them" is to invoke the collective weight of the others against him. This returns you to summation.
  *Bite: Severe. It challenges the coherence of principle selection without comparison.*

  **5. Qualification Until Vacuous (Awkward)**
  By attributing numerical force to "strength of complaint" or "lotteries," you risk qualifying the view until it lacks content. If "strength of complaint" magically scales with numbers in symmetric cases, it's ad hoc. If lotteries are weighted by numbers, it's aggregation. If you insist complaints never aggregate but numbers always matter, you lack a mechanism. The view becomes a label for "numbers matter somehow" without explaining how contractualism achieves this without its core prohibition on summation. You are defending the label "Contractualism" while abandoning the constraint that defines it (no summation). This makes the view unfalsifiable but theoretically empty.
  *Bite: Awkward. It undermines the theoretical utility of the position.*

  ### What a Scanlonian would concede

  A defender of Scanlon (particularly the later Scanlon of *Numbers* and *Being Realistic About Reasons*) would concede that the "Small Harms" case is the hardest bullet to bite. They might adopt a "relevance view," arguing that below a certain threshold, minor harms are not relevant comparators to death, thus bypassing aggregation without summing. However, they would vehemently deny that weighted lotteries constitute aggregation. They argue aggregation is about *summing welfare* to determine outcomes; lotteries are about *procedural fairness* given equal claims. They would concede that the "Rescue Case" intuition (save the five) is strong, but argue it is less robust than the constraint against treating persons as mere containers of value. They would claim your view isn't heretical but correct: numbers matter because of the *probability* of being saved under different principles, not because complaints sum. They would wave off the "covert aggregation" charge as a category error between outcomes and procedures.

  ### Insulated or refuted?

  You should give up the view. It is **refuted**. The position is insulated only by becoming vacuous or collapsing into the aggregation it denies. The hardest consideration to shrug off is **Weighted Lotteries as Covert Aggregation**. If you admit numbers should influence the probability of saving a group, you must justify *why* the probability scales with headcount. The only non-arbitrary justification is that the moral reason to save the group increases with its size. But if individual complaints are equal and non-aggregating, the reason to save the group cannot increase unless you are counting the *number* of reasons as a collective weight. This is aggregation. You cannot have it both ways: you cannot deny summation while insisting the sum determines the probability. The mechanism you propose to save contractualism from the aggregation problem actually reinstates aggregation under a procedural guise. The view is theoretically unstable.
