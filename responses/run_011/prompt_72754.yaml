      *(Self-Correction on Confidence)*: I am very confident Step 2 is the weak link. I am less confident that the "Purpose Limitation" argument fully satisfies the user's desire to avoid "plain balancing." I must acknowledge that Purpose Limitation *structures* balancing but doesn't eliminate value judgments.

