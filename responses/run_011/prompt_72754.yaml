          3.  Explain the cost (admitting inference is sometimes okay).
          4.  Repair (1) (Shift from Fact-Authorization to Purpose-Authorization).
          5.  Solve the Comparative Question (Tax vs. Social Credit via Purpose Limitation/Proportionality).
          6.  Solve the "Travels" issue (State vs. Private power).
          7.  Confidence & Uncertainty statement.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does rejecting (2) fully save (1)?* If I change (1) to be about purpose, is it still (1)? The prompt asks "what does (1) have to become". So yes, modifying (1) in light of rejecting (2) is the way.
      *   *Is the "Travels" issue solved by State vs. Private?* Yes, the German right is constitutional (state action). Private inference is tort/social, not constitutional.
      *   *Is the distinction between Tax and Social Credit robust?* Yes, under German law, *Zweckentfremdung* (misuse of purpose) is key. Tax data cannot be used for general policing without specific legal bridges. Social Credit *is* general policing via data.
      *   *Least Sure Point:* I need to be honest about whether "Purpose Limitation" is truly distinct from "Balancing." In practice, defining the "purpose" involves weighing interests. But theoretically, it's a *categorical* constraint (Data collected for X cannot be used for Y) rather than a *utilitarian* one (Benefit > Harm). I will flag this tension.

