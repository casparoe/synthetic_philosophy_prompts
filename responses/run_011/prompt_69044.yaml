answer: |-
  Here is a careful dissection of *Church of the Holy Trinity v. United States*, 143 U.S. 457 (1892), analyzing its weight as a precedent against textualism and how modern interpretive theories might digest it.

  ### The Textualist Complaint: Concession vs. Interpretation

  To understand why *Holy Trinity* is the textualist's bogeyman, you have to distinguish between using purpose to *clarify* ambiguity and using purpose to *override* clarity.

  The textualist's primary grievance is not that Justice Brewer looked at legislative history or purpose. It is that he explicitly conceded the text was broad enough to cover the conduct before narrowing it. Brewer wrote: *"It is a familiar rule, that a thing may be within the letter of the statute and yet not within the statute."*

  For a textualist, this is heresy. If the semantic meaning of "labor or service of any kind" encompasses a minister, the inquiry should end. By admitting the minister falls within the "letter" but excluding him based on the "spirit," the Court elevated legislative intent over legislative enactment.

  **The *Expressio Unius* Problem**
  The proviso you mentioned is the textualist's strongest foothold. The Act prohibited contract labor but explicitly exempted "professional actors, artists, lecturers, or singers."
  *   **Textualist Argument:** Under the canon *expressio unius est exclusio alterius* (the expression of one thing implies the exclusion of others), Congress knew how to exempt professionals. They listed specific artistic professions. They did not list ministers. Therefore, ministers were intended to be covered. To rule otherwise renders the specific list superfluous or suggests the Court is rewriting the statute to add an exception Congress omitted.
  *   **The Hurt:** This hurts the textualist case significantly. It suggests the Court didn't just interpret "labor"; it ignored a structural clue within the text itself that pointed toward inclusion.

  ### The Purposivist's Strongest Defense

  The purposivist defense rests on the "Mischief Rule" and the avoidance of absurdity.

  1.  **The Mischief:** The Alien Contract Labor Act was a response to a specific economic crisis: the importation of pauperized, unskilled manual labor to break strikes and depress wages. The legislative history (committee reports) confirmed the target was "cheap manual labor."
  2.  **The Absurdity:** Applying the statute to a clergyman yields a result Congress could not have intended. It would criminalize the standard hiring practice of every religious denomination in the country for a problem (wage depression by unskilled labor) that clergy do not present.
  3.  **The Defense:** A purposivist argues that statutory words are vehicles for policy, not ends in themselves. If the text captures a case that lies entirely outside the "mischief" the statute was designed to remedy, the text must yield to the purpose. The proviso listing artists and lecturers wasn't an exhaustive list of *all* non-laborers, but an illustrative list of *ambiguous* professions that might be confused for laborers. Clergy were so obviously not "laborers" in the 1885 sense that they didn't need explicit exemption.

  ### Can Modern Contextualist Textualism Absorb the Result?

  This is the critical question. Modern textualism (associated with Scalia, Garner, and currently the Court's conservative wing) is not "literalism." It argues that words derive meaning from their ordinary usage in context at the time of enactment.

  **The Argument for Absorption:**
  A modern contextualist textualist could affirm *Holy Trinity* without embracing purposivism by attacking the semantic premise.
  *   **Semantic Range:** In 1892, did the phrase "contract labor" semantically include a rector? In ordinary conversation of that era, "labor" often connoted manual or menial work. A "professional service" was linguistically distinct from "labor."
  *   **Reframing the Proviso:** A contextualist could argue the proviso (actors, singers, etc.) wasn't creating exceptions to a broad rule, but clarifying the boundary of the word "labor." If "labor" is ambiguous regarding professionals, the list confirms that "professions" are excluded. Since clergy are paradigmatically professionals, they fall outside the semantic scope of "labor" without needing to be listed.
  *   **The Absurdity Doctrine:** Even hardline textualists accept a narrow absurdity doctrine. If the literal application leads to a result no reasonable person could have intended (criminalizing all church hiring), the text can be adjusted.

  **Where the Theory Goes Silent:**
  Contextualist textualism goes silent if the semantic evidence shows "labor" *unambiguously* included clergy in 1892. If dictionaries and contemporary usage defined "labor" as "any work for hire," the contextualist has no room to maneuver. They must either:
  1.  Admit the Court was wrong (the result is unjust but the law was clear).
  2.  Invoke the absurdity doctrine (which risks sliding back into purposivism).

  *Holy Trinity* remains a threat to textualism because Brewer didn't argue "labor" *meant* something different; he argued the *intent* limited the *meaning*. A modern textualist must argue the *meaning* was always limited by context, not intent. That is a fine, often unsustainable, distinction.

  ### The "Christian Nation" Dictum: Separable or Poison?

  The opinion's famous flourish—that this is a "Christian nation"—is found in Part II of the opinion, which discusses legislative history and national culture to support the claim that Congress couldn't have intended to hinder religion.

  **Is it Separable?**
  Legally, yes. The holding rests on the interpretation of "labor," not the theology of the state. The "Christian nation" language was evidentiary support for the claim that Congress would not have inadvertently hampered churches. One can accept the statutory interpretation (clergy $\neq$ labor) without accepting the theological premise (America is Christian).

  **Does it Poison the Well?**
  Practically, yes. For modern secular textualists, the dictum suggests the Court was willing to bend the law to favor a specific religious class. It undermines the neutrality required for the rule of law. However, as a precedent for statutory interpretation, it is rarely cited for the "Christian nation" proposition anymore. It is cited for the "spirit over letter" proposition. The dictum is an embarrassment, but the *methodology* (looking beyond the text to purpose) is the real legacy.

  ### Summary of Theoretical Silence

  *   **Hard Textualism:** Goes silent on how to handle clear text that produces absurd results without resorting to a "purpose" inquiry that looks suspiciously like judicial legislation. It struggles to explain why the proviso's list doesn't strictly exclude ministers via *expressio unius*.
  *   **Purposivism:** Goes silent on how to constrain the judge. If "labor" can be redefined by "mischief," what stops a judge from redefining any statute based on their view of the "spirit"? It lacks a clear off-ramp when the text is specific but the purpose is broad.
  *   **Contextualist Textualism:** Goes silent if the linguistic context is actually clear. It relies on the ambiguity of the term "labor." If "labor" was unambiguous in 1892, this theory collapses into hard textualism and must condemn the *Holy Trinity* result.

  ### Verdict

  *Holy Trinity* is not a knockout punch against **sophisticated** textualism, but it is a devastating blow against **naive** textualism.

  If textualism claims words have meaning in a vacuum, *Holy Trinity* kills it. If textualism claims words have meaning in a context that includes the problem being solved and ordinary usage, *Holy Trinity* can be survived—but only by conceding that "context" does a lot of heavy lifting. The case remains the warning label on the textualist toolkit: when the text and the purpose diverge sharply, sticking to the text may preserve the law's integrity, but ignoring the purpose may destroy its legitimacy. The Court in 1892 chose legitimacy over integrity. Modern textualists argue that integrity *is* legitimacy.
