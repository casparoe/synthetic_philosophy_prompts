              *   *Substrate:* Neural spikes.
              *   *Pattern:* Intention/Symbol cluster.
              *   *Mechanism:* The intention isn't a force pushing neurons; it's a stability condition. Neurons fire in ways that keep the intention active until execution.
              *   *Weight:* The example proves possibility, not universality. Needs general theory for sufficiency.

      *   **4. Why This Approach?**
          *   *Vs. Interventionism:* Interventionism identifies causation but doesn't solve the metaphysical "in virtue of what" regarding physical closure.
