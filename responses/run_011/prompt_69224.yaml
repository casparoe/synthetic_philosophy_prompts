      *   **6. Scope:**
          *   *Cut:* Consciousness/Qualia (too hard). Ethics. Broad AI applications.
          *   *Defer:* Full formalization (information theory/math).
          *   *Minimum Viable:* The distinction between static and self-maintaining constraints applied to one case (Careenium + Arm), showing it avoids exclusion.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it sounds like a PhD-level proposal (confident, precise, aware of literature).
      *   *Constraint Check:* Did I invent citations? No. Did I answer all 6 points? Yes.
      *   *Philosophical Precision:* Ensure the distinction between "static boundary" and "self-maintaining pattern" is sharp. The key is *temporal persistence dependent on the pattern itself*.
      *   *Falsifiability:* Make sure the conditions for failure are clear. If the constraint can be eliminated by a complete micro-history description, the project fails.

  5.  **Self-Correction during Drafting:**
