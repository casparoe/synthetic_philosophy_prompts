      *   *Worked Example:* Make sure the "raising arm" example clearly distinguishes the *pattern* from the *neurons*. The pattern is the *stable trajectory* of the neurons.

  6.  **Final Review against User Prompt:**
      *   Precise research question? Yes.
      *   Taxonomy without citations? Yes.
      *   Method (month-by-month + example)? Yes.
      *   Why this vs alternatives? Yes.
      *   Success/Failure (notational equivalence)? Yes.
      *   Scope assessment? Yes.

  7.  **Final Polish:** Check for flow and clarity. Ensure the "self-maintaining" concept is the star of the show. (Proceed to generate output).

  *(Self-Correction Note on "Notational Equivalence"):* This is the biggest philosophical risk. I need to emphasize that the proposal must show the constraint has *explanatory indispensability*, not just descriptive utility. I will add a specific milestone for this in the methodology.

