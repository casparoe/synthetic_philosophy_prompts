answer: |-
  **Project Title:** Constraint Without Force: Self-Maintaining Patterns and the Metaphysics of Mental Causation

  **1. Research Question**
  The project addresses a specific gap in the causal exclusion debate. The standard question asks whether downward causation is compatible with the causal closure of the physical. This project assumes closure holds and asks a more mechanistic question:

  *Can a higher-level pattern exert causal influence solely by acting as a **self-maintaining constraint** on lower-level state transitions, without violating causal closure or collapsing into a static boundary condition?*

  **Commitments:**
  *   **Causal Closure:** Every physical event has a sufficient physical cause. No energy is added by the higher level.
  *   **Causation as Constraint:** Causal work is defined not as the injection of force, but as the narrowing of the accessible phase space of the substrate (ruling out certain micro-histories).
  *   **The Distinction:** There is a metaphysically significant difference between a *static constraint* (e.g., the walls of the careenium) and a *self-maintaining constraint* (e.g., a symbol-cluster that organizes collisions to ensure its own persistence).

  **Falsification Conditions:**
  This account is falsified if:
  1.  It can be demonstrated that a "self-maintaining constraint" is fully reducible to a set of static initial conditions and substrate laws without loss of explanatory power (i.e., the "self-maintaining" label is merely descriptive).
  2.  It requires the pattern to possess properties (e.g., stability) that are not exhaustively constituted by the substrate properties, thereby violating physicalism.

  **2. Taxonomy of Existing Positions**
  The project situates itself against four dominant frameworks, arguing that each leaves the specific mechanism of constraint-based causation unaddressed.

  *   **The Causal Exclusion Argument:** This position assumes causation is additive; if the substrate does all the pushing, there is no room for the pattern to push. It leaves my question open because it does not consider causation-as-constraint. If causation is the narrowing of possibilities rather than the addition of force, exclusion does not automatically apply.
  *   **Non-Reductive Physicalism (Realization):** This view argues higher-level properties are realized by lower-level ones. While it secures ontological innocence, it often relies on the determinable/determinate relation to secure causal relevance. It leaves my question open because it does not explain *how* the realization relation physically restricts micro-trajectories over time without appealing to static realization bases.
  *   **Interventionist/Counterfactual Accounts:** These define causation in terms of manipulability (if we change the pattern, the outcome changes). While compatible with my view, interventionism is agnostic on the *metaphysical ground* of the dependency. It identifies that the constraint exists, but not *what kind* of physical structure allows a pattern to constrain micro-events without adding energy.
  *   **Deflationary Redescription:** This view holds that talk of patterns is merely a compressed way of describing complex substrate interactions. It leaves my question open because it denies the reality of the constraint altogether. My project must show that the constraint is ontologically robust (it shapes history) rather than merely linguistically convenient.

  **3. Methodology and Timeline**
  The nine-month fellowship will move from conceptual differentiation to positive argumentation, culminating in a general defense.

  **Months 1–3: Conceptual Analysis and Differentiation**
  *   **Goal:** Rigorously define "static constraint" vs. "self-maintaining constraint."
  *   **Task:** Analyze the careenium model. A wall restricts balls (static). A vortex of balls restricts *other* balls while maintaining its own vortex structure (self-maintaining).
  *   **Deliverable:** A formal distinction showing that self-maintaining constraints involve a feedback loop where the macro-pattern's persistence is a condition for the micro-trajectories that constitute it.
  *   **Boundary:** This phase ends when the definition of "self-maintaining" is stable enough to apply to a biological case.

  **Months 4–6: The Worked Example (Positive Argument)**
  *   **Goal:** Apply the distinction to a concrete action to test its viability.
  *   **Case:** Deciding to raise an arm.
  *   **Substrate Level:** Specific neural firing sequences, muscle contractions, electrochemical gradients.
  *   **Pattern Level:** The intention "raise arm," modeled as a stable attractor state in neural dynamics.
  *   **Step-by-Step Application:**
      1.  *Initiation:* A neural cluster achieves a threshold configuration (the symbol forms).
      2.  *Constraint:* This configuration does not "push" neurons. Instead, it renders certain neural firing paths incompatible with the pattern's stability. (e.g., A neuron firing that would dissipate the cluster is inhibited *because* the cluster is active).
      3.  *Maintenance:* The pattern persists over time *because* the inhibited firings do not occur. The constraint is active at $t_2$ because it was active at $t_1$.
      4.  *Execution:* The stable pattern eventually narrows the motor-output phase space to a single trajectory (arm rises).
  *   **Weight of Example:** This example demonstrates *possibility*, not *universality*. It shows the mechanism is coherent in a physical system. It cannot bear the weight of a general theory of mind alone; it serves as the existence proof required to move to Month 7.

  **Months 7–9: Generalization and Defense**
  *   **Goal:** Move from the specific case to a general account of mental causation.
  *   **Task:** Address the "Notational Equivalence" worry (see Section 5). Argue that the self-maintaining account offers explanatory resources (e.g., accounting for robustness against noise) that the static account lacks.
  *   **Deliverable:** Final dissertation chapter / Fellowship monograph draft.

  **4. Justification Against Alternatives**
  *   **Vs. Adopting Interventionism:** Interventionism identifies causal relations but does not solve the metaphysical tension with physical closure. It says "the mental makes a difference," but critics reply "only because the physical made a difference." My account explains *how* the physical makes that difference *in virtue of* the pattern's stability, bridging the gap interventionism leaves open.
  *   **Vs. Conceding Content is Inert:** One could argue the physical behavior is real, but the semantic content (the symbol) is epiphenomenal. I reject this because it renders the system's rationality accidental. If the symbol-cluster does not constrain the balls, the system's "reasoning" is a mirage. My account preserves the causal efficacy of the rational structure.
  *   **Vs. Abandoning Level Talk:** Eliminating levels dissolves the problem but also dissolves the phenomenon of mind. We do not experience ourselves as clouds of particles. A viable philosophy of mind must explain the reality of the level at which we live and act.

  **5. Success and Failure Conditions**
  **Success:**
  A successful result is a coherent model where the "self-maintaining constraint" is shown to be **explanatorily indispensable**. It must show that predicting the system's behavior requires referencing the macro-pattern's stability conditions, not just the micro-laws.

  **Failure:**
  The primary failure mode is **Notational Equivalence**: The account may prove to be merely a vocabulary shift. If "self-maintaining constraint" translates perfectly into "complex chain of static causes + initial conditions" without changing any truth conditions or predictions, the project fails to establish a third role.

  **Ruling Out Equivalence:**
  To rule this out, I must establish that the *counterfactual profile* of the system changes under the constraint description.
  *   *Test:* In a static model, if we perturb the micro-state, the outcome is determined by laws. In a self-maintaining model, the system *corrects* the perturbation to preserve the pattern.
  *   *Feasibility:* This is feasible in nine months if restricted to the conceptual logic of the model. I do not need to prove brains actually work this way empirically, only that this causal architecture is metaphysically distinct from the additive model.

  **6. Scope Assessment**
  **To Cut/Defer:**
  *   **Consciousness/Qualia:** The project addresses causal efficacy, not phenomenal experience. Adding the "hard problem" makes the nine-month timeline impossible.
  *   **Formal Information Theory:** While a mathematical formalization (e.g., using integrated information or entropy measures) would strengthen the claim, it is out of scope. I will rely on conceptual topology.
  *   **AI/Computational Implementation:** Building a simulation of the careenium is a separate engineering project. I will treat the careenium as a philosophical thought experiment.

  **Minimum Viable Project:**
  If the full generalization fails, the smallest defensible version is a **negative proof**: Demonstrating that the Causal Exclusion argument *fails* against constraint-based accounts. Even if I cannot prove mental causation *is* self-maintaining constraint, proving that Exclusion does not *rule it out* secures the logical space for non-reductive physicalism. However, the goal is the positive account: showing that self-maintaining constraints are the *only* viable candidate for mental causation that respects physical closure.
