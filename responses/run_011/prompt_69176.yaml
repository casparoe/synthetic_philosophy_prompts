      *   *Correction:* Anscombe distinguishes between the person giving the order and the executor. In "War and Murder," she focuses on the leadership. I should stick to that. The prompt asks about the agent of the bombing. I need to be firm: For Anscombe, Truman is the primary agent because the *practical reasoning* that justifies the act originates with him (or is adopted by him). The aircrew's lack of discretion reinforces Truman's agency, it doesn't diffuse it.
