prompt: |-
  I serve on the workload committee of our faculty senate. At last week's meeting the dean rejected our proposal to cap uncompensated summer supervision of undergraduate research with the remark, "Do what you love and you'll never work a day in your life," adding that people who find the work absorbing have no standing to complain about the hours. Several of us objected but could not articulate why, and I would rather return with an argument than with irritation.

  Please set out, as a numbered menu I could hand to the committee, the distinct precise claims that sentence can carry: the descriptive-psychological claim that absorbed activity does not register as effort; the one that silently redefines work as whatever is experienced as toil and so becomes true by stipulation; the career-advice reading addressed to someone choosing an occupation; the normative reading on which subjective reward settles questions of distribution; and any others genuinely in play, including the reading on which the line functions to convert enthusiasm into unpaid labor. For each, say whether it is a platitude, an empirical hypothesis about motivation, a stipulation, or false — and whether it survives contact with the fact that those who work themselves into the ground are often precisely the people who love their work. Close by identifying which readings would actually license the dean's move from "the supervision is intrinsically rewarding" to "hours are the wrong currency for a workload policy," and which leave the work fully loved and the policy still unjust.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user serves on a faculty senate workload committee. The dean rejected a proposal to cap uncompensated summer supervision of undergraduate research.
      *   **The Dean's Remark:** "Do what you love and you'll never work a day in your life," adding that people who find the work absorbing have no standing to complain about the hours.
      *   **The Goal:** A numbered menu of distinct, precise claims embedded in that sentence/remark to help the committee articulate their objection.
      *   **Specific Requirements:**
          *   Numbered list.
          *   Identify the type of claim (platitude, empirical hypothesis, stipulation, false, etc.).
          *   Evaluate each claim against the fact that those who work themselves into the ground often love their work (the "burnout paradox").
          *   Conclusion: Identify which readings actually license the dean's move (from "rewarding" to "no cap needed") and which leave the work loved but the policy unjust.
      *   **Tone:** Professional, analytical, precise, suitable for a faculty committee (academic but accessible).

  2.  **Deconstruct the Dean's Remark:**
      *   *Quote:* "Do what you love and you'll never work a day in your life."
      *   *Addendum:* "People who find the work absorbing have no standing to complain about the hours."
      *   *Implicit Argument:* Intrinsic reward $\rightarrow$ Not "work" $\rightarrow$ No need for compensation/caps $\rightarrow$ Complaints invalid.

  3.  **Drafting the Claims (Iterative Process):**

      *   *Claim 1: The Psychological/Phenomenological Claim.*
          *   Idea: If you love it, it doesn't feel like effort.
          *   Type: Empirical hypothesis about motivation/experience.
          *   Critique: False/Overstated. Flow states exist, but fatigue still exists.
          *   Burnout Paradox: Loving it doesn't stop exhaustion.

      *   *Claim 2: The Semantic/Stipulative Claim.*
          *   Idea: Redefining "work" as only "unpleasant toil."
          *   Type: Stipulation/Definition.
          *   Critique: Tautological. If "work" = "suffering," then loving it means it's not "work." But institutionally, it *is* work.
          *   Burnout Paradox: Irrelevant to the definition, but ignores institutional reality.

      *   *Claim 3: The Career Advice Claim.*
          *   Idea: You should choose a job you love so it feels easier.
          *   Type: Platitude/Heuristic.
          *   Critique: Good for individuals, bad for policy.
          *   Burnout Paradox: Doesn't address current conditions.

      *   *Claim 4: The Normative/Distributive Claim.*
          *   Idea: If you enjoy it, you don't deserve compensation/time limits.
          *   Type: Normative claim (about justice/entitlement).
          *   Critique: False/Unjust. Enjoyment doesn't negate labor value.
          *   Burnout Paradox: Directly contradicted. High passion often leads to exploitation.

      *   *Claim 5: The Managerial/Exploitative Claim.*
          *   Idea: Enthusiasm converts labor into a gift.
          *   Type: Ideological move/False.
          *   Critique: False. It's a mechanism to extract unpaid labor.
          *   Burnout Paradox: This is exactly where the burnout happens.

  4.  **Refining and Categorizing (matching the prompt's specific requests):**
      *   The prompt asks for specific categories: descriptive-psychological, stipulative redefinition, career-advice, normative distribution, and the "enthusiasm into unpaid labor" reading.
      *   I need to make sure I address the "burnout paradox" (those who work themselves into the ground are often precisely the people who love their work) for each.

  5.  **Drafting the Content (Mental or Scratchpad):**

      *   *Item 1 (Psychological):* "Absorbed activity does not register as effort." -> Empirical hypothesis. False. Cognitive load exists regardless of enjoyment. Burnout happens to passionate people.
      *   *Item 2 (Stipulative):* "Work is whatever is experienced as toil." -> Stipulation. True by definition but misleading. Burnout shows "work" (in the institutional sense) happens even without "toil" (in the emotional sense).
      *   *Item 3 (Career Advice):* "Choose love so you don't suffer." -> Platitude. Harmless in vacuum, dangerous in policy. Burnout shows love isn't a shield.
      *   *Item 4 (Normative):* "Subjective reward settles distribution." -> Normative claim. False/Unjust. Burnout proves passion creates vulnerability, not immunity.
      *   *Item 5 (Conversion):* "Enthusiasm converts labor into gift." -> Ideological/False. Burnout is the cost of this conversion.

  6.  **Developing the Conclusion:**
      *   Which readings license the move? The Normative and Conversion readings. They argue passion negates obligation.
      *   Which leave work loved but policy unjust? The Psychological and Stipulative readings. Even if it feels good, it's still labor that needs management.

  7.  **Review against Constraints:**
      *   Numbered menu? Yes.
      *   Distinct precise claims? Yes.
      *   Classify each (platitude, hypothesis, etc.)? Yes.
      *   Address the "burnout paradox" for each? Yes.
      *   Closing analysis on licensing the move vs. unjust policy? Yes.
      *   Tone: Appropriate for faculty senate (rigorous, clear).

  8.  **Final Polish:**
      *   Ensure the distinction between "work" (phenomenological) and "Work" (institutional/economic) is clear.
      *   Make sure the "burnout paradox" is explicitly mentioned in the evaluation of each point.
      *   Strengthen the language to be persuasive for a committee document. (e.g., using terms like "category error," "exploitation," "institutional responsibility").

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
      *   *Self-Correction during drafting:* Make sure I don't just say "False." I need to explain *why* it fails in this context. The prompt asks to say whether it is a platitude, hypothesis, etc. *and* whether it survives contact with the fact of burnout. I will structure each item to clearly hit these beats.

      *   *Refining the "Conversion" claim:* The prompt specifically asks for "the reading on which the line functions to convert enthusiasm into unpaid labor." I need to make sure this is distinct from the normative claim. The normative claim is about *standing to complain*; the conversion claim is about the *nature of the transaction*. I will distinguish them carefully.

      *   *Closing:* Ensure the distinction between "licensing the move" and "policy still unjust" is sharp.

