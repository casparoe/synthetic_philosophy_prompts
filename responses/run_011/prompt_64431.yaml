answer: |-
  **To:** Faculty Senate Workload Committee
  **From:** [Your Name]
  **Subject:** Analysis of Administrative Objection to Summer Research Caps

  The following menu disaggregates the dean's remark ("Do what you love and you'll never work a day in your life") and the accompanying assertion that absorbed faculty lack standing to complain about hours. Each item isolates a distinct logical claim embedded in the statement, categorizes its logical status, and tests it against the empirical reality that high passion often correlates with high burnout.

  1.  **The Phenomenological Claim**
      *   **The Claim:** Absorbed activity does not register psychologically as effort; therefore, time spent in flow states does not deplete the worker.
      *   **Classification:** **Empirical Hypothesis about Motivation.**
      *   **Evaluation:** **False.** While intrinsic motivation lowers the *perceived* cost of effort, it does not eliminate physiological or cognitive depletion.
      *   **Contact with Burnout:** This claim fails immediately upon contact with the fact that those who work themselves into the ground are often precisely the people who love their work. Passionate engagement masks fatigue until collapse occurs; it does not prevent the depletion of energy reserves required for sustained performance.

  2.  **The Semantic Stipulation**
      *   **The Claim:** "Work" is defined strictly as unpleasant toil; therefore, any activity experienced as rewarding is, by definition, not "work" and falls outside the scope of workload policy.
      *   **Classification:** **Stipulation (True by Definition, Misleading in Context).**
      *   **Evaluation:** **Category Error.** This redefines an institutional economic category (labor time) as a subjective emotional state (suffering).
      *   **Contact with Burnout:** This stipulation collapses when institutional demands exceed human capacity. Even if the faculty member does not *feel* they are "working" in the colloquial sense, the institution is still consuming their time and energy. The burnout paradox proves that "non-work" (in the dean's sense) can still destroy a career.

  3.  **The Career-Advice Platitude**
      *   **The Claim:** Individuals should select occupations they enjoy to minimize the burden of their livelihood.
      *   **Classification:** **Platitude / Heuristic.**
      *   **Evaluation:** **Benign in Vacuum, Irrelevant to Policy.** As personal advice, this is harmless. As administrative policy, it is a non-sequitur.
      *   **Contact with Burnout:** This reading offers no protection against exploitation. A faculty member may have followed this advice perfectly (choosing a loved career) and still be overworked. The existence of the choice does not negate the consequences of the hours required.

  4.  **The Normative Claim on Distribution**
      *   **The Claim:** Subjective reward settles questions of distributive justice; if a worker is paid in satisfaction, they have no standing to demand payment in time or currency.
      *   **Classification:** **Normative Claim.**
      *   **Evaluation:** **False / Unjust.** This asserts that intrinsic goods can substitute for extrinsic compensation in a labor contract.
      *   **Contact with Burnout:** This is the most dangerous reading. It implies that passion voids labor rights. The burnout paradox demonstrates that those most willing to accept "satisfaction" as payment are the most vulnerable to exceeding sustainable limits. Justice requires caps precisely *because* passion makes self-regulation difficult.

  5.  **The Alchemical Claim (Conversion of Labor)**
      *   **The Claim:** Enthusiasm functions to convert what would otherwise be compensated labor into a gift or volunteerism.
      *   **Classification:** **Ideological Move / False.**
      *   **Evaluation:** **Exploitative.** This treats the worker's internal state as a mechanism to alter the external economic nature of the task.
      *   **Contact with Burnout:** This reading actively produces the burnout paradox. By framing supervision as a "labor of love" rather than a professional duty, the institution removes the structural guardrails (caps, pay) that prevent the enthusiastic from working themselves into the ground.

  ***

  **Conclusion: Licensing the Move vs. Preserving Justice**

  To determine how to reply to the dean, the committee must distinguish which readings actually support his conclusion and which allow us to reject it.

  *   **Readings that License the Dean's Move:**
      Only **Claim 4 (Normative)** and **Claim 5 (Alchemical)** attempt to license the move from "the supervision is intrinsically rewarding" to "hours are the wrong currency for a workload policy." These readings argue that passion negates obligation. However, both are logically unsound in an employment context: intrinsic reward does not negate extrinsic cost, and enthusiasm does not alter the economic reality of labor hours.

  *   **Readings that Leave the Work Loved and the Policy Unjust:**
      **Claim 1 (Phenomenological)** and **Claim 2 (Semantic)** allow us to concede that the work is indeed loved while maintaining that the policy is necessary. We can agree that faculty find the work absorbing (Claim 1) without accepting that it ceases to be labor (Claim 2).
      *   **The Argument:** We can acknowledge that the work is rewarding *and* argue that this makes workload caps *more* urgent, not less. Because the work is absorbing, faculty will not self-limit. Therefore, the institution must limit for them.

  **Recommendation:** The committee should reject Claim 4 and 5 as incompatible with faculty welfare, while accepting the premise of Claim 1 to argue that **protective caps are required precisely because the work is loved.** The policy is not a remedy for drudgery; it is a safeguard for passion.
