prompt: |-
  I facilitate deliberative processes for a county government — land use, a proposed group home, school consolidation, budget priorities — and roughly ten or twelve times a year a session deadlocks in the same way: the two sides are not disagreeing about the evidence so much as about the extension of a loaded predicate, and every attempt to settle the matter by definition leaves somebody feeling dismissed. On my own time I have been reading Nāgārjuna and the Madhyamaka treatment of the tetralemma — the four-cornered analysis in which a claim is examined as holding, as not holding, as both, and as neither — together with the associated doctrine that things are empty of intrinsic nature and exist only as dependently arisen and conventionally designated. I want to know whether any of that can be turned into something my teams could actually run in a room, or whether the attempt corrupts it past the point of usefulness.

  Please write the procedure itself rather than an essay about the philosophy behind it. It should be a sequence of questions a facilitator asks in order, with the available moves at each step, what counts as a sufficient answer to move on, the conditions under which the procedure halts and refuses to proceed, and the points where the decision is a judgment call that cannot be written down. Design to these constraints: two-hour sessions; twelve to forty participants with no philosophy background and mixed literacy; a co-facilitator who is openly skeptical that any of this is more than a parlor trick; a program director who needs a one-page handout and a written record of how each session concluded; and no Sanskrit or Pali vocabulary in anything the group hears. Then tell me which distinctions in the doctrine must survive the simplification for the procedure to still be doing what Nāgārjuna was doing — I suspect the difference between negating all four corners and asserting the fourth, the fact that his arguments function as reductios rather than counter-theses, the dependence of any designation on causes and conditions, and the insistence that emptiness is itself empty all have to stay — and which can be dropped without loss, such as the soteriological framing, karma and rebirth, and the monastic setting. I specifically want the last of those built in as a closing move, so that a group cannot walk out having installed "it's both and neither" as a new fixed answer to replace the old one. Include an explicit prohibition on using the procedure to declare a disagreement about observable fact somehow both true, and say how a facilitator recognizes that case in time to bail out.

  Run it on three situations I have actually sat through: a neighborhood association split over whether a supervised consumption site made their block more or less dangerous, where both sides have incident counts and the counts do not match; an alumni group and a new parent council arguing about whether the school formed by merging two buildings is still "our school"; and a volunteer board arguing over whether a longtime member's habit of steering newcomers toward particular projects was welcoming or gatekeeping. For at least one of these I expect the procedure to refuse the case, or to reach a conclusion I will not like — say so plainly rather than bending the tool. Finally, two requests about epistemic honesty. First, separate what is settled from what is genuinely contested among people who work on Madhyamaka: whether Nāgārjuna advances any thesis of his own, whether the fourth corner is ever a position rather than a refusal of all positions, whether emptiness is a metaphysical claim about how things are or a claim about our concepts, and whether the tetralemma licenses anything like true contradictions — and if the procedure's design quietly depends on one side of any of those disputes, flag that dependence rather than presenting your preferred reading as the consensus. Second, tell me where I may be fooling myself: whether reducing a practice aimed at liberation from suffering to a technique for getting a county working group to stop shouting is a distortion, a legitimate secular borrowing, or a question nobody is in a position to settle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Facilitator for county government deliberative processes (land use, group homes, school consolidation, budgets).
      *   **Problem:** Sessions deadlock (10-12 times/year) due to disagreements over the *extension of loaded predicates* (e.g., "dangerous," "our school," "welcoming"), not evidence. Definitions fail and cause dismissal.
      *   **Proposed Solution:** Adapt Nāgārjuna/Madhyamaka tetralemma (four-cornered analysis) and emptiness (śūnyatā)/dependent origination (pratītyasamutpāda) for secular facilitation.
      *   **Constraints:**
          *   Write the *procedure itself*, not an essay.
          *   Sequence of questions, available moves, sufficient answers, halt conditions, judgment calls.
          *   Session length: 2 hours.
          *   Participants: 12-40, no philosophy background, mixed literacy.
          *   Co-facilitator: Skeptical (needs to see utility, not mysticism).
          *   Program Director: Needs 1-page handout + written record.
          *   Language: No Sanskrit/Pali.
          *   Core Doctrinal Distinctions to Keep: Negation of all four corners (not asserting the 4th), reductio ad absurdum (not counter-theses), dependent designation, emptiness of emptiness (closing move).
          *   Core Doctrinal Distinctions to Drop: Soteriology, karma/rebirth, monastic setting.
          *   Specific Requirement: Explicit prohibition on using the procedure to validate disagreements about observable fact.
          *   Specific Requirement: Run the procedure on three specific cases (Consumption site, School merger, Volunteer board). One must fail or yield an unwelcome conclusion.
          *   Epistemic Honesty 1: Separate settled vs. contested Madhyamaka scholarship (thesis status, 4th corner, metaphysics vs. concepts, true contradictions). Flag dependencies.
          *   Epistemic Honesty 2: Self-reflection on whether this secular adaptation is a distortion or legitimate borrowing.

  2.  **Deconstruct the Philosophy for Secular Use:**

      *   *Tetralemma (Catuṣkoṭi):* Is X true? Is X false? Is X both? Is X neither?
      *   *Madhyamaka Goal:* Show that inherent existence (svabhāva) is impossible. All four corners fail if we assume intrinsic nature.
      *   *Secular Translation:* Instead of "intrinsic nature," use "fixed definition independent of context/purpose." Instead of "emptiness," use "dependence on conditions and agreement."
      *   *The Trap:* Participants often want to assert the 4th corner ("It's neither safe nor unsafe") as a *new truth*. The procedure must prevent this reification.
      *   *The Closing Move:* "Emptiness of Emptiness" -> The framework itself is a tool, not a truth.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Name:* Needs to be neutral. "The Four-Check Protocol" or "Contextual Review." Let's go with "The Four-Perspective Review."
      *   *Structure:*
          1.  Setup (Ground Rules).
          2.  Identify the Stuck Term.
          3.  The Four Checks (Is/Is Not/Both/Neither).
          4.  The Dependency Map (Why do we say this?).
          5.  The Release (Emptiness of the Tool).
      *   *Constraints Check:* 2 hours is tight for 40 people. Need breakout groups or strict timing. Let's assume plenary with structured speaking.
      *   *Halt Conditions:* Factual disputes, bad faith, reification of the "Neither."
      *   *Co-facilitator Role:* Timekeeper and "Reality Check" (ensuring facts aren't ignored).
      *   *Director's Handout:* Summary template.

  4.  **Developing the Three Case Studies:**

      *   *Case 1: Supervised Consumption Site (Dangerous).*
          *   Conflict: "Dangerous" predicate.
          *   Data: Incident counts don't match.
          *   *Analysis:* This smells like a factual dispute disguised as a semantic one. If the counts don't match, is it because of definition (what counts as an incident?) or measurement? If it's measurement, the Tetralemma shouldn't be used.
          *   *Decision:* This is the one that must *fail* or be rejected. The prompt asks for epistemic honesty. If the disagreement is about *observable fact* (even if data is messy), Madhyamaka doesn't apply. Emptiness isn't about ignoring reality. I need to bail out here.
      *   *Case 2: School Merger ("Our School").*
          *   Conflict: Identity predicate.
          *   *Analysis:* Perfect for dependent designation. "Our school" depends on history, buildings, people, feeling. No intrinsic "school-ness."
          *   *Outcome:* Dissolve the binary. Move to functional agreement.
      *   *Case 3: Volunteer Board (Welcoming vs. Gatekeeping).*
          *   Conflict: Intent/Impact predicate.
          *   *Analysis:* Also good. Depends on perspective of newcomer vs. old timer.
          *   *Outcome:* Contextual validity.

      *   *Refining Case 1 (The Bailout):* The prompt says "For at least one of these I expect the procedure to refuse the case, or to reach a conclusion I will not like — say so plainly." I will choose Case 1 to refuse. Why? Because if the incident counts don't match, that's a data integrity issue, not a metaphysical one. Using emptiness to gloss over data discrepancies is "spiritual bypassing."

  5.  **Addressing Epistemic Honesty (Scholarly Disputes):**

      *   *Thesis:* Does Nāgārjuna have a thesis? (Prasanga vs. Svatantrika). I need to flag that this procedure assumes *Prasanga* (no thesis of our own).
      *   *4th Corner:* Is it a position? No, it's a rejection of the framework.
      *   *Metaphysics vs. Concepts:* Is emptiness real or linguistic? I'll lean towards conceptual/pragmatic for this context.
      *   *True Contradictions:* Paraconsistent logic vs. Rejection of excluded middle. I must flag that this procedure assumes the latter (rejection of validity of the terms), not that contradictions are true.

  6.  **Addressing Self-Reflection (Distortion vs. Borrowing):**

      *   Is this a distortion? Yes, technically. It removes the soteriological goal (ending suffering/dukkha in the ultimate sense).
      *   Is it legitimate? Pragmatically, yes. "Skillful means" (upaya).
      *   Honesty: Acknowledge the reduction.

  7.  **Drafting the Content - Section by Section:**

      *   *Title:* The Four-Check Protocol (Secular Adaptation).
      *   *Pre-Conditions:* Facilitator notes.
      *   *The Steps:* Clear instructions.
      *   *The Cases:* Applied analysis.
      *   *The Scholarship:* Honest breakdown.
      *   *The Self-Critique:* Honest breakdown.

  8.  **Refining the "Halt" Condition (Crucial):**

      *   The prompt specifically asks for an explicit prohibition on using the procedure to declare a disagreement about observable fact somehow both true.
      *   I need a "Gatekeeper Question" at the start. "Is this about what *is* (facts) or what it *means* (values/categories)?"
      *   In the Consumption Site case, if the data is conflicting, that's a "what is" problem. Bail out.

  9.  **Refining the "Closing Move" (Emptiness of Emptiness):**

      *   Must ensure they don't walk away saying "So the answer is 'Neither'."
      *   The closing must be: "This tool helped us see the term isn't fixed. Now we must make a decision based on current needs, knowing it's not Ultimate Truth."

  10. **Review against Constraints:**

      *   No Sanskrit? Check.
      *   2 Hours? Check (timing included).
      *   Skeptical Co-facilitator? Check (role defined).
      *   Director's Handout? Check (template included).
      *   Mixed Literacy? Check (simple language).
      *   Procedure vs. Essay? Check (focus on steps).

  11. **Final Polish:**

      *   Ensure the tone is professional, direct, and rigorous.
      *   Make sure the "Bailout" in Case 1 is sharp and justified.
      *   Ensure the scholarly distinctions are accurate (e.g., distinguishing *prasanga* from *svatantrika* implications without using the terms).

  *(Self-Correction during drafting)*: I initially thought about letting the Consumption Site case resolve to "Danger is dependent." But the prompt warns against validating observable fact disputes. If incident counts don't match, that's empirical. Using Madhyamaka there is dangerous. I will strictly enforce the bailout there. It demonstrates the integrity of the tool.

  *(Self-Correction on Scholarship)*: Be careful not to present the "Prasanga" view as the only view, but acknowledge it's the one this procedure relies on.

  *(Self-Correction on Closing)*: Make sure the "Emptiness of Emptiness" doesn't sound like nihilism. It means "This agreement is provisional."

  Let's assemble.
answer: |-
  # THE FOUR-CHECK PROTOCOL
  **Version 1.0 (Secular Adaptation)**

  ## I. PRE-CONDITIONS AND HALT RULES

  **Facilitator Requirements:**
  *   **Lead Facilitator:** Runs the protocol.
  *   **Co-Facilitator:** Monitors time and acts as "Reality Check." Their specific duty is to interrupt if the group attempts to use this process to ignore observable data.
  *   **Time:** 120 Minutes hard stop.
  *   **Participants:** 12–40. Seating in rounds of 6–8.

  **Halt Conditions (The "Bailout"):**
  The procedure **must not proceed** if:
  1.  **Factual Dispute:** The disagreement is about observable, measurable reality (e.g., "Did the budget balance?" "How many incidents occurred?") rather than the *meaning* or *category* applied to those facts.
  2.  **Bad Faith:** A participant uses the protocol to avoid accountability (e.g., "My action wasn't harmful, it was just empty of inherent harm").
  3.  **Reification of the Fourth:** The group attempts to adopt "Neither/Both" as the final decision rather than a step toward a provisional agreement.

  **If Halt Condition #1 is triggered:** The session converts to a Data Reconciliation Workshop. The Protocol is abandoned.

  ---

  ## II. THE PROCEDURE (120 MINUTES)

  ### Step 1: Isolation of the Stuck Term (15 Minutes)
  **Facilitator Script:** "We are not here to solve the whole problem. We are here to examine the one word or phrase that stops us from moving. It is usually a label like 'safe,' 'fair,' 'our school,' or 'welcome.' Write down the term that causes the deadlock."

  *   **Move:** Participants propose terms. Group votes on the single most blocking term.
  *   **Sufficient Answer:** A noun or adjective phrase agreed upon by 80% of the room (e.g., "Dangerous," "Real School").
  *   **Judgment Call:** Determining if the term is a *value/category* (proceed) or a *fact claim* (Halt).
      *   *Test:* Ask, "If we had a perfect camera recording everything, would this disagreement disappear?" If Yes → **HALT.** (See Case 1 below). If No → Proceed.

  ### Step 2: The Four Checks (45 Minutes)
  **Facilitator Script:** "We are going to test this term. We are not looking for the right answer. We are looking for where the definition breaks. We will look at four positions."

  *   **Check 1 (Is):** "Under what conditions is this term definitely true?"
      *   *Task:* List specific scenarios where everyone agrees the label applies.
  *   **Check 2 (Is Not):** "Under what conditions is this term definitely false?"
      *   *Task:* List specific scenarios where everyone agrees the label does not apply.
  *   **Check 3 (Both):** "Under what conditions does the term apply and not apply at the same time?"
      *   *Task:* Identify contexts where it is true for some people/purposes and false for others simultaneously.
  *   **Check 4 (Neither):** "Under what conditions does the term cease to make sense entirely?"
      *   *Task:* Identify contexts where the distinction is irrelevant or the word loses its utility.

  *   **Sufficient Answer:** Each Check requires at least three concrete examples generated by the group.
  *   **Co-Facilitator Role:** Ensure examples are concrete, not abstract. Stop anyone from claiming one Check is the "Truth."

  ### Step 3: Mapping Dependence (30 Minutes)
  **Facilitator Script:** "We have seen the term works in some places and fails in others. This means the term does not have a fixed nature. It depends on conditions. What conditions make this term 'real' for you?"

  *   **Move:** Participants identify the *dependencies* of the term.
      *   *Examples:* "It depends on who is asking." "It depends on the time of day." "It depends on what we are trying to achieve."
  *   **Sufficient Answer:** A visible list of 5+ conditions (causes/context) that create the label.
  *   **Goal:** Shift focus from "What is the truth?" to "What conditions create this truth?"

  ### Step 4: The Provisional Decision (20 Minutes)
  **Facilitator Script:** "Since the term has no fixed nature, we cannot wait for the 'correct' definition. We must choose a definition that works for our current purpose. Knowing this definition is not Ultimate Truth, but a tool for now, what will we agree to?"

  *   **Move:** Draft a operational definition or policy statement.
  *   **Constraint:** The statement must include a sunset clause or review date (acknowledging its provisional nature).
  *   **Sufficient Answer:** A written statement agreed to by consensus for the purpose of the project.

  ### Step 5: The Release (Closing Move) (10 Minutes)
  **Facilitator Script:** "We have used this method to reach an agreement. We must now apply the method to the method itself. This agreement is not inherently 'right.' It is empty of permanent truth. It is a tool we are choosing to use because it helps us function. If conditions change, this agreement may be discarded."

  *   **Move:** Explicit verbal acknowledgment that the agreement is conventional, not absolute.
  *   **Record:** The written record must state: "This decision is valid for [Time/Scope] based on current conditions. It is not a statement of ultimate fact."
  *   **Prohibition:** Do not allow participants to claim the "Neither" position (Step 2, Check 4) as the final wisdom. The final wisdom is the *utility* of the Step 4 agreement.

  ---

  ## III. PROGRAM DIRECTOR HANDOUT TEMPLATE

  **Session Date:** _______________
  **Stuck Term:** _______________
  **Halt Check Passed?** [ ] Yes [ ] No (If No, reason: _______________)
  **Key Dependencies Identified:** (List top 3 conditions)
  1.
  2.
  3.
  **Provisional Agreement:** _______________
  **Review Date:** _______________
  **Facilitator Sign-off:** _______________

  ---

  ## IV. APPLICATION TO THREE CASES

  ### Case 1: Supervised Consumption Site ("Dangerous")
  **Context:** Neighborhood association split. Side A says site makes block "more dangerous." Side B says "less dangerous." Both have incident counts; counts do not match.
  **Protocol Application:**
  1.  **Isolation:** Term is "Dangerous."
  2.  **Halt Check:** Facilitator asks: "If we had a perfect camera, would we agree on the number of incidents?"
      *   *Finding:* No. Side A counts loitering as an incident. Side B counts only overdoses/crime. Furthermore, data collection methods differ.
      *   *Analysis:* This is partially a factual dispute regarding data integrity and classification standards, not purely a metaphysical disagreement about the nature of danger.
      *   *Decision:* **PROCEDURE REFUSED.**
      *   *Reasoning:* Using the Four-Check Protocol here would risk validating the idea that "danger" is so empty that conflicting data doesn't matter. This violates the prohibition on observable fact disputes. The group needs a Data Standards Working Group, not a deconstruction of "danger."
      *   *Outcome:* Session converts to technical data reconciliation. Facilitator notes: "Do not use emptiness to bypass data integrity."

  ### Case 2: School Merger ("Our School")
  **Context:** Alumni vs. New Parents. Is the merged entity still "Our School"?
  **Protocol Application:**
  1.  **Isolation:** Term is "Our School."
  2.  **Halt Check:** Passed. This is a category/identity dispute, not a factual one.
  3.  **Four Checks:**
      *   *Is:* When wearing old letterman jackets? When singing the old anthem?
      *   *Is Not:* When using the new tax ID? When referring to the new building?
      *   *Both:* For alumni (yes) vs. new students (no) simultaneously.
      *   *Neither:* When discussing state accreditation (irrelevant category).
  4.  **Dependence:** "Our School" depends on memory, tenure, and emotional investment, not just bricks.
  5.  **Provisional Decision:** For official communications, use "New School Name." For alumni events, "Legacy Program" is permitted.
  6.  **Release:** Acknowledge "Our School" is a convenient label, not an intrinsic soul of the building.
  7.  **Outcome:** **SUCCESS.** Deadlock broken by separating official function from emotional legacy.

  ### Case 3: Volunteer Board ("Welcoming" vs. "Gatekeeping")
  **Context:** Longtime member steers newcomers. Is this welcoming guidance or gatekeeping?
  **Protocol Application:**
  1.  **Isolation:** Term is "Welcoming."
  2.  **Halt Check:** Passed. This is about intent/impact interpretation.
  3.  **Four Checks:**
      *   *Is:* When the newcomer asks for help.
      *   *Is Not:* When the newcomer is told "no" without explanation.
      *   *Both:* When the guidance helps the project but limits the person's growth.
      *   *Neither:* When the task is urgent and requires specific skill (category error).
  4.  **Dependence:** "Welcoming" depends on the *receiver's* feeling of autonomy, not just the *giver's* intent.
  5.  **Provisional Decision:** Steering is permitted only if accompanied by an "opt-out" option for the newcomer.
  6.  **Release:** The board agrees this policy is a tool for retention, not a moral judgment on the member's character.
  7.  **Outcome:** **SUCCESS (with discomfort).** The longtime member may feel their "inherent goodness" is being challenged. The protocol forces them to accept that "welcoming" is defined by effect, not intent. This is an unwelcome conclusion for them, but procedurally sound.

  ---

  ## V. EPISTEMIC HONESTY: SCHOLARLY DISTINCTIONS

  To ensure this procedure remains faithful to the logic of Nāgārjuna without claiming his authority, the following distinctions must be acknowledged.

  **1. Thesis Status (Prasanga vs. Svatantrika)**
  *   *Dispute:* Does Nāgārjuna assert a position of his own, or only reduce others' positions to absurdity?
  *   *Protocol Dependency:* This procedure assumes the **Prasanga** view (no thesis). The Facilitator must not assert that "Dependence" is the Truth. It is only shown that "Intrinsic Nature" leads to contradictions.
  *   *Risk:* If the Facilitator presents "Dependent Designation" as the *correct* metaphysical view, the procedure becomes a dogma, violating the "Emptiness of Emptiness."

  **2. The Fourth Corner (Neither)**
  *   *Dispute:* Is the fourth corner a positive state (a mystical beyond) or a negation of the question's validity?
  *   *Protocol Dependency:* It must be treated as a **negation of validity**. "Neither" means "The question assumes a fixed nature that does not exist."
  *   *Risk:* Participants often treat "Neither" as a compromise ("It's kinda both"). This must be corrected. "Neither" means "The binary is broken."

  **3. Metaphysics vs. Concepts**
  *   *Dispute:* Is emptiness a claim about how reality *is* (ontological) or how we *speak* about reality (conceptual/linguistic)?
  *   *Protocol Dependency:* This procedure treats it as **conceptual/pragmatic**. We are not claiming the school building doesn't physically exist; we are claiming the label "Our School" has no intrinsic referent.
  *   *Risk:* Sliding into nihilism ("Nothing matters"). The "Provisional Decision" step counters this by reaffirming conventional utility.

  **4. True Contradictions (Paraconsistency)**
  *   *Dispute:* Does the tetralemma allow A and Not-A to be true simultaneously (paraconsistent logic), or does it reject the law of excluded middle?
  *   *Protocol Dependency:* This procedure **rejects the law of excluded middle** for conventional labels. It does not assert true contradictions.
  *   *Risk:* Allowing a group to say "It is both Safe and Unsafe" as a final state. The procedure forces a move to "It is Safe for Purpose X, Unsafe for Purpose Y" (Dependence), avoiding logical contradiction.

  ---

  ## VI. EPISTEMIC HONESTY: SELF-REFLECTION ON DISTORTION

  **Question:** Is reducing a soteriological practice (liberation from suffering) to a bureaucratic technique (county workflow) a distortion?

  **Assessment:**
  1.  **Distortion:** Yes. Nāgārjuna's goal was the cessation of *dukkha* (suffering) through the realization of ultimate truth. Using this to pass a budget or site a group home instrumentalizes the insight. It turns *prajñā* (wisdom) into *technē* (skill/craft).
  2.  **Legitimate Borrowing:** In Mahayana tradition, *Upaya* (skillful means) allows teachings to be adapted to the capacity of the audience. If the "suffering" is interpreted as the friction of civic deadlock, and the "liberation" is the ability to function cooperatively, the structural homology holds.
  3.  **Unsettled:** There is no consensus on whether secular mindfulness/emptiness practices retain efficacy without the ethical/soteriological container.

  **Warning:**
  You may be fooling yourself if you believe this procedure eliminates conflict. It does not. It only changes the *terrain* of the conflict.
  *   **The Trap:** You might feel a sense of superiority when the group "realizes" emptiness. This is spiritual ego.
  *   **The Trap:** You might use the "Halt" rule to avoid difficult political decisions by labeling them "factual."
  *   **The Trap:** The "Release" step (Emptiness of Emptiness) may be ignored by the Program Director who wants a "final" record. You must insist the record reflects the provisional nature, or you have lied about the process.

  **Final Verdict:** This is a **Secular Upaya**. It is useful, but it is not the Dharma. It manages suffering; it does not end it. Use it to clear the ground, not to build a temple.
