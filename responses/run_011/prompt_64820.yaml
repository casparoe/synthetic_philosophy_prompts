  **Credence: 0.35**

  I assign a 35% probability to the proposition that a robust synchronic criterion can achieve 90% accuracy in distinguishing pseudohistorical from vindicated-but-unaccepted research programs in the deep past. While the ambition to naturalize demarcation is philosophically sound, the specific constraints of *synchronicity* and *deep time historiography* introduce epistemic friction that makes a 90% success rate historically unsupported and methodologically precarious.

  ### Decomposition of Credence

  **1. Lakatosian Markers (Synchronic Applicability): Weight 0.30**
  This is the heaviest theoretical load-bearing wall. Lakatos's Methodology of Scientific Research Programmes (MSRP) relies heavily on the distinction between a *progressive* and a *degenerating* problem shift. In hindsight, this is clear; synchronically, it is notoriously opaque. A synchronic application requires an historian to determine if a new auxiliary hypothesis is increasing heuristic power or merely patching anomalies without novel predictions.
  *   **Impact:** If Lakatosian markers can be operationalized without hindsight bias (i.e., if "novelty" can be defined structurally rather than empirically), my credence rises significantly. However, in deep history, where empirical novelty is often limited to reinterpretation of existing textual or material data rather than new predictions, the "degenerating" label often looks identical to "refining interpretation." The difficulty of distinguishing *ad hoc* rescue from legitimate theoretical adjustment in real-time drags my credence down.

  **2. Sociological Features (Independence from Content): Weight 0.25**
  This factor considers whether markers like immunity to internal criticism, dependence on a single authority (e.g., Fomenko), or the treatment of mainstream scholarship as a coordinated conspiracy carry demarcation weight independent of the truth of the claims.
  *   **Impact:** There is a strong correlation here, but causation is tricky. Revolutionary sciences (like early plate tectonics) often exhibit sociological friction with the establishment. However, pseudohistory typically exhibits *structural* isolation (rejecting peer review mechanisms entirely) rather than *institutional* friction (trying to publish and failing). If sociological markers are treated as necessary but not sufficient conditions, they stabilize the criterion. If they are treated as sufficient, they risk false positives against legitimate heterodoxies. I assign moderate weight here because sociology often tracks the *methodological* failure (e.g., refusing to engage with counter-evidence) rather than constituting the failure itself.

  **3. The Wegener Case (Disanalogy vs. Counterexample): Weight 0.30**
  This is the critical control case. If Wegener's continental drift is a true counterexample—meaning a synchronic observer in 1920 could not distinguish it from a pseudoscientific program using your proposed criteria—then the 90% accuracy claim collapses.
  *   **Impact:** My credence hinges on whether Wegener is disanalogous. Wegener lacked a mechanism, but he *acknowledged* the lack and sought geophysical solutions. Pseudohistorical programs (e.g., New Chronology) often posit mechanisms that actively violate established physics (e.g., orbital dynamics) while claiming to overturn them without commensurate explanatory power. If the criterion can distinguish "lack of mechanism" (Wegener) from "violation of mechanism" (Fomenko) synchronically, the Wegener case supports rather than undermines the proposition. If this distinction requires knowing plate tectonics is true, the proposition fails.

  **4. Ontology of "Pseudohistory" (Real Distinction vs. Condemnation): Weight 0.15**
  This addresses the Laudan objection: is "pseudohistory" a natural kind or a pejorative slur?
  *   **Impact:** If "pseudohistory" is merely a term of condemnation for "claims I dislike," no criterion will work. However, recent work in social epistemology suggests it functions as a cluster concept (like "weed" or "disease"). If we treat it as a cluster of methodological failures (e.g., cherry-picking, ignoring base rates, conspiracy theorizing) rather than a binary essence, the 90% threshold becomes more plausible. I assign this lower weight because even if it is a real distinction, the *synchronic detection* of that distinction remains the harder problem (covered in factors 1 and 3).

  ### Closing: The Weakest Link and The Mover

  **Least Confident Term:** **"Synchronic Applicability."**
  I am least confident that *any* methodological marker can be reliably applied without some degree of diachronic leakage. In the historiography of the deep past, data is sparse and interpretation is underdetermined. What looks like an "immunizing stratagem" in 1995 might look like a "necessary hermeneutic adjustment" in 2025. The boundary between protecting a core theory from falsification and responsibly accounting for the fragmentary nature of deep-time evidence is exceptionally porous in real-time.

  **Argument/Case Study to Move the Number:**
  A **blind comparative analysis of 1920s Geophysics vs. 1990s New Chronology**.
  To move my credence above 0.60, I would need to see a formalized application of your criterion applied to two corpora: (1) the reception of Wegener and his contemporaries (1915–1930) and (2) the initial publication of Fomenko's *New Chronology* (1980s–1990s).
  If an informed historian, blinded to the subsequent vindication of plate tectonics and the rejection of New Chronology, could classify the *methodological structure* of the arguments (specifically regarding how each handled negative evidence and physical constraints) with 90% accuracy, it would demonstrate that the demarcation is indeed synchronic. Specifically, a demonstration that Wegener's *admission of ignorance* regarding the driving mechanism is methodologically distinct from Fomenko's *assertion of impossible mechanisms* would be the single most persuasive argument for the viability of your project.
