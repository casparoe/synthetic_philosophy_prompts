prompt: |-
  I'm a fourth-year PhD student in history and philosophy of science, drafting a chapter on demarcation in the historiography of the deep past. The proposition I want a number on: a synchronic criterion — one an informed historian could apply using only what was available at the time, without waiting to see how a program turns out — can distinguish pseudohistorical research programs (Fomenko and Nosovsky's New Chronology, Atlantis-style hyperdiffusionism, ancient-astronaut claims) from programs that are presently unvindicated but eventually vindicated, as continental drift was, and can do so with agreement on at least nine out of ten contested cases. Give me your credence, then the decomposition: how much rides on whether Lakatosian markers such as immunizing stratagems and degenerating problem shifts are in principle synchronically applicable; how much on whether the sociological features of such communities — immunity to internal criticism, dependence on a single authority, the treatment of all mainstream scholarship as coordinated error — carry weight independent of content; how much on whether the Wegener case is genuinely disanalogous rather than a live counterexample; and how much on whether pseudohistory names a real distinction at all rather than a term of condemnation. Close with the term you are least confident in, and the argument or case study that would move the total number most.
