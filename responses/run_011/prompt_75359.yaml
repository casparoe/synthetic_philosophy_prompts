answer: |-
  ### The Desiderata for a Theory of Akrasia

  1.  **The Retention Condition**
      *   **Case:** The agent acts against a better judgment that remains cognitively intact at the moment of action (e.g., eating the cake while thinking "I should not eat this").
      *   **Tag:** Non-negotiable.
      *   **Rationale:** Without this, the phenomenon dissolves into preference change. If the judgment flips to match the action, there is no conflict, only revision.

  2.  **The Volitional Control Condition**
      *   **Case:** Distinguishing the akratic agent from the compulsive or addicted agent (reactive attitudes of blame vs. pity).
      *   **Tag:** Non-negotiable.
      *   **Rationale:** Akrasia implies the agent *could* have done otherwise; compulsion implies they could not. A theory must ground this asymmetry in mechanism, not just intuition.

  3.  **The Normative Stability Condition**
      *   **Case:** Distinguishing akrasia from ordinary preference change or rational updating based on new information.
      *   **Tag:** Non-negotiable.
      *   **Rationale:** Explains why reversing a decision due to new health data (Inverted Odysseus) is rational, while reversing it due to mere proximity of reward is not.

  4.  **The Operational Visibility Condition**
      *   **Case:** An experimentalist must be able to distinguish an akratic choice from a non-akratic choice using elicitation procedures (e.g., distinguishing hyperbolic discounting from rational satiation).
      *   **Tag:** Proprietary (Behavioural Economics).
      *   **Rationale:** Required for the workshop's empirical integration, but risks reducing the mental state to the choice itself.

  5.  **The Structural Neutrality Condition**
      *   **Case:** The account must not define akrasia *as* non-exponential discounting (hyperbolic/quasi-hyperbolic).
      *   **Tag:** Non-negotiable.
      *   **Rationale:** Discount functions describe *patterns* of choice; akrasia is a *mechanism* of agency. Agents can be akratic with exponential discounting (if values shift) and consistent with hyperbolic discounting (if bound).

  6.  **The Recursive Stability Condition**
      *   **Case:** Explaining why the decision to bind oneself (precommitment) does not inherit the same failure as the decision it constrains.
      *   **Tag:** Non-negotiable.
      *   **Rationale:** If the "self" that binds is subject to the same failure as the "self" that acts, binding is impossible. The theory must locate the locus of control differently in binding vs. executing.

  7.  **The Affective Congruence Condition**
      *   **Case:** The agent experiences shame or agent-regret, not surprise or alienation.
      *   **Tag:** Proprietary (Aristotelian/Phenomenological).
      *   **Rationale:** Ensures the theory identifies the action as *the agent's own* (ownership) rather than an external intrusion (compulsion) or a new preference (update).

  ---

  ### Joint Satisfiability and The Tension

  **The Verdict:** The list is **not jointly satisfiable** in its strictest formulation. Specifically, **The Operational Visibility Condition** (as standardly interpreted in behavioural economics via Revealed Preference) is logically incompatible with **The Retention Condition**.

  If you adopt the standard economic axiom that choice reveals preference, then a reversal in choice *necessarily* entails a reversal in preference (judgment). This makes the Retention Condition impossible to satisfy by definition: if the agent chooses X over Y, they *must* prefer X over Y at that moment. To save the Retention Condition (and thus the phenomenon of akrasia), you must break the link between choice and judgment. This requires the Behavioural Economists to abandon strict Revealed Preference ontology in favour of a dual-system or mental-accounting model where "choice" does not equal "endorsed judgment." Conversely, if they hold to Revealed Preference, the Philosophers must admit they are discussing a folk-psychological illusion, not a measurable variable.

  **The Camp That Must Give Way:** Behavioural Economics. If the workshop is about *akrasia* (a failure of agency) rather than *dynamic inconsistency* (a property of curves), the economists must accept that the "agent" is a theoretical primitive that cannot be fully reduced to a sequence of choice data.

  **The Single Requirement Doing the Most Work:** **The Retention Condition.** It eliminates any model that equates judgment with immediate choice probability. It kills the pure Economic account and forces the Resolution account to explain why a resolution is more than a prediction of future choice.

  ---

  ### Evaluation of Your Candidate Requirements

  1.  **The Retention Clause:** **Genuine.** This is the core of the phenomenon. Without it, you have preference change, not weakness of will. It is not question-begging; it is the definition of the target.
  2.  **The Inverted Odysseus Case:** **Genuine.** Your intuition is not prejudice; it tracks the distinction between *epistemic rationality* (updating on evidence) and *volitional rationality* (sticking to plans). A theory that classifies rational updating as akrasia is broken.
  3.  **The Divorce Clause:** **Genuine.** Essential for the workshop. Defining akrasia as "hyperbolic discounting" is a category error (confusing a curve for a cause). It is compatible with formal accounts only if "preference" is decoupled from "choice."
  4.  **The Precommitment Recursion:** **Genuine, but Dangerous.** This identifies the deepest structural problem. However, it may be too strong: some akratic agents *fail* to bind. The requirement should be that the theory *can* explain successful binding without regress, not that binding always occurs.
  5.  **The Affective Signature:** **Genuine.** This is the best discriminator between akrasia (shame/ownership) and compulsion (alienation). It is not merely folk psychology; it is data about the agent's self-conception.

  **Redundancies:** The Retention Clause and the Normative Stability Condition (Desideratum 3) overlap significantly. Retention is the metaphysical claim; Stability is the diachronic test. Keep both, but know they pull the same weight.

  **Covert Substantive Views:** The **Operational Visibility Condition** is the most suspect. It dresses up the substantive view of Methodological Behaviourism as a neutral criterion. It assumes the phenomenon *must* be measurable via choice data alone, which begs the question against the Davidsonian/Aristotelian view that judgment is a distinct mental state.

  ---

  ### Contender Scoring

  **Davidson-Style Relativization:**
  Davidson saves the Retention Condition by relativizing judgment to "all-out" vs. "prima facie," allowing the agent to hold conflicting judgments simultaneously.
  *Score:* Passes Retention and Affective Congruence (agent owns the action). Fails Operational Visibility (unmeasurable mental states) and struggles with Structural Neutrality (relies on a specific logic of action). It explains the phenomenology perfectly but offers no handle for the economists.

  **Aristotelian Diagnosis (Practical Syllogism):**
  Locates the failure in the minor premise (perception of the particular) rather than the universal (the good).
  *Score:* Passes Volitional Control and Affective Congruence (explains shame as a failure of perception one owns). Fails Operational Visibility and Structural Neutrality (teleological assumptions). It handles the Inverted Odysseus well (new evidence changes the minor premise) but is opaque to modelling.

  **Resolution-Based Account:**
  Defines akrasia as breaking a prior resolution rather than acting against a concurrent judgment.
  *Score:* Passes Recursive Stability (resolutions are tools for binding) and Operational Visibility (resolutions can be elicited). Fails Retention (resolutions are not necessarily "better judgments" at the time of action) and risks collapsing into the Economic model if resolutions are just predictions.

  **Purely Economic Account (Dynamic Inconsistency):**
  Identifies akrasia with time-inconsistent preference orderings.
  *Score:* Passes Operational Visibility and Structural Neutrality (mathematically precise). Fails Retention (judgment flips with choice), Affective Congruence (no room for shame in multiple selves), and Volitional Control (deterministic curves). It describes the *pattern* of akrasia but eliminates the *agent* required to experience it.

  ---

  ### Final Commitments

  **The Requirement to Drop Under Pressure:** **Operational Visibility (in its strict Revealed Preference form).** If forced to choose between a measurable curve and an agent who feels shame, you must keep the agent. You can measure proxies for judgment (reaction time, neural activation, verbal report), but you cannot define judgment *as* choice without destroying the phenomenon.

  **The Requirement to Defend to the End:** **The Retention Condition.** This is the linchpin. If the judgment does not persist, there is no conflict. If there is no conflict, there is no akrasia, only change. Any theory that explains away the conflict explains away the dissertation topic.

  **Least Confidence:** **The Recursive Stability Condition.** I am genuinely uncertain whether a non-regressive account of precommitment is possible without positing a "homunculus" or a privileged temporal perspective. This is where the model is most likely to crack, regardless of camp. It is the hardest problem in intertemporal agency, and I suspect it may require a substantive metaphysical claim about personal identity that neither economists nor standard action theorists are willing to make.
