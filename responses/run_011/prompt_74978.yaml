          4.  *Neutral/Grave Harm:* "The Quiet Debt." A financial practice where interest compounds silently until death, then heirs are enslaved. (Sounds boring/neutral, actually destroys social mobility).
          5.  *Sleep Arrangement:* "Communal Napping." Adults sleep in shared glass pods in public parks during the day. (Privacy violation feeling, but safe).
