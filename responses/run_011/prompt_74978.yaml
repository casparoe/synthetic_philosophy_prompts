          *   Practice E: *Public Podding*. Medium disgust (privacy), Low harm.
          *   *Selection:* I need 5 distinct ones.
          1.  *The Hush* (Dining).
          2.  *Bone Stacking* (The Framing Twist).
          3.  *The Spitting Greeting* (Disgust w/o Harm).
          4.  *The Quiet Debt* (Harm w/o Disgust).
          5.  *River Casting* (Disposal of dead pets into the main water source). *Wait, that's too real.* Let's go with *The Gray Water Cycle* (Bathwater to tap). High disgust, Low harm (technically).
