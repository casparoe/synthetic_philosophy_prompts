          *   *Correction on "Universally Disgusting/Legal":* *The Spitting Greeting*.
          *   *Correction on "Framing":* *Bone Stacking*.

  4.  **Design the Mechanics:**

      *   *Roles:* 22 students. Need factions.
          *   Traditionalists (High sensitivity to change).
          *   Pragmatists (Focus on utility).
          *   New Arrivals (Different baseline).
          *   Elders (Focus on cohesion).
          *   *Actually, simpler:* Just give them "Constituency Profiles." Some are easily disgusted, some are numb, some are economically anxious.
      *   *Tokens:* "Enforcement Credits." Total pool < Total potential bans. They must prioritize.
      *   *Voting:* Must vote based on "What does your constituency feel?" not "What do you think?"

  5.  **Drafting the Session Flow:**

      *   *0-10:* Setup (Polity, Rules). No theory.
      *   *10-40:* Round 1 Voting (Standard descriptions).
      *   *40-60:* Token Allocation & Debate.
      *   *60-75:* The Twist (Re-vote on one item with new description).
      *   *75-90:* The Reveal (Ground Truth).
      *   *90-120:* Debrief (Connecting to Hart/Devlin).

  6.  **Addressing the "What Will Go Wrong" (Troubleshooting):**

      *   *Smart Alecks:* Students knowing moral dumbfounding. *Fix:* Make the reveal about social cost data, not psychological theory.
