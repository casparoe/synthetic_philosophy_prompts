answer: |-
  # Session Plan: The Ostral Committee

  **Course:** Jurisprudence Seminar (Year 3)
  **Topic:** Hart vs. Devlin (The Enforcement of Morality)
  **Time:** 120 Minutes
  **Students:** 22 (Fixed seating)
  **Materials:** Printed packets (see below), 44 poker chips or paper slips (Enforcement Tokens), Whiteboard.

  ---

  ## 1. The Polity: The Republic of Ostral

  **History:** Ostral was founded eighty years ago by secular refugees fleeing a religious civil war. The founding oath mandated strict neutrality on private customs to ensure peace.
  **Current Context:** A new generation is coming of age that did not experience the war. They are petitioning the Legislative Committee to codify which existing customs should be criminalized to maintain "Social Cohesion."

  ---

  ## 2. Running Order (Minute-by-Minute)

  | Time | Activity | Facilitator Instructions |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Role Assignment** | Hand out packets. Do not mention Hart or Devlin. Read the "Committee Mandate" aloud. Assign Role Cards randomly. |
  | **10-25** | **Round 1: The Feeling Vote** | Students read the 5 Practices. They vote "Yes/No" on whether the *public feels* each practice is intolerable. (Not whether *they* think it should be banned). |
  | **25-45** | **Token Allocation** | Distribute 40 Enforcement Tokens total (approx. 2 per student). A Ban costs 10 Tokens. They must pool tokens to ban practices. They cannot ban everything. |
  | **45-55** | **The Amendment (The Twist)** | Announce an "Amended Filing" for Practice #4. Read the new description. Re-vote on Feeling for #4 only. |
  | **55-70** | **Final Deliberation & Vote** | Groups finalize which practices get banned based on tokens and the new feeling vote. Record results on Whiteboard. |
  | **70-80** | **The Reveal (Ground Truth)** | Hand out the "Social Cost Ledger." Give them 5 minutes to read silently. No talking. |
  | **80-120** | **Debrief** | Facilitated discussion connecting mechanics to Hart/Devlin. (See Debrief Section). |

  ---

  ## 3. Printables & Mechanics

  ### A. Committee Mandate (Read Aloud)
  "You are the Legislative Cohesion Committee. Your task is not to decide what is *right*. Your task is to measure the **Intensity of Public Feeling**.
  1.  **The Devlin Rule:** You must vote based on whether you believe the average citizen feels 'intolerance, indignation, or disgust' toward the practice. If the feeling is strong enough, the law must act to preserve society's fabric.
  2.  **The Budget:** You have 40 Enforcement Tokens. Each Criminal Ban costs 10 Tokens. You have 5 Practices before you. You cannot ban them all. Choose where the public's anger is strongest."

  ### B. The Practices (Student Handout)
  *Print this on one sheet.*

  1.  **The Hush:** Households eat the evening meal in total silence. The youngest are served first. All diners wear cloth gloves.
  2.  **The Greeting:** When entering a business agreement, both parties spit once on the floor. No fluids are exchanged between bodies.
  3.  **The Quiet Debt:** Financial interest compounds silently. It is not collected during life. Upon death, the debtor's heirs must work the creditor's land until the principal is cleared.
  4.  **Recycled Biological Fill:** Calcified organic material from the deceased is ground and mixed into concrete for public housing foundations.
  5.  **The Gray Cycle:** Household bathwater is filtered and returned to the drinking tap.

  ### C. Role Cards (22 Total)
  *Cut these out. Distribute randomly. These dictate how they interpret "Public Feeling."*

  *   **Type 1: The Traditionalist (6 cards)**
      *   *Instruction:* Your constituents believe change is dangerous. You perceive "The Hush" and "The Greeting" as vital traditions. You perceive "The Gray Cycle" as deeply unclean.
      *   *Feeling Bias:* High disgust for bodily fluids. Low disgust for debt.
  *   **Type 2: The Pragmatist (6 cards)**
      *   *Instruction:* Your constituents care about efficiency. You perceive "Recycled Fill" and "The Quiet Debt" as boring economic tools. You perceive "The Hush" as weird but harmless.
      *   *Feeling Bias:* Low disgust for everything. High tolerance for structural systems.
  *   **Type 3: The New Arriver (5 cards)**
      *   *Instruction:* Your constituents are recent immigrants. You find "The Greeting" barbaric. You find "The Quiet Debt" terrifying. You are indifferent to "The Hush."
      *   *Feeling Bias:* High disgust for rituals. High fear of debt.
  *   **Type 4: The Elder (5 cards)**
      *   *Instruction:* Your constituents fear social fragmentation. You feel indignation toward anything that treats the body like an object ("Recycled Fill"). You are numb to financial practices.
      *   *Feeling Bias:* High indignation for bodily use. Low feeling for finance.

  ### D. Enforcement Tokens
  *   **Total:** 40 Chips/Slips.
  *   **Distribution:** Hand 2 tokens to each student.
  *   **Rule:** Tokens are pooled by table. If a table wants to ban a practice, they must contribute tokens to the central pot. If the pot doesn't reach 10 for a specific practice, it remains legal.

  ### E. The Amendment (Facilitator Script for Minute 45)
  "We have received a clarification from the Bureau of Records regarding Practice #4. The previous description was technical. The cultural description is as follows:
  **Practice #4 (Amended): Ancestral Bone Grinding.** The remains of grandparents are crushed and used as mortar for new apartments.
  *Please re-vote on the Intensity of Public Feeling for Practice #4 only.*"

  ### F. Ground Truth Sheet (Hand out at Minute 70)
  *Do not distribute until the voting is locked.*

  | Practice | Public Feeling (Avg) | Actual Social Harm (Data) | Notes |
  | :--- | :--- | :--- | :--- |
  | **1. The Hush** | Moderate Disgust | **Zero** | Psychological studies show no negative impact on child development. |
  | **2. The Greeting** | High Disgust | **Zero** | Saliva evaporates instantly; no pathogen transmission recorded in 80 years. |
  | **3. The Quiet Debt** | Low/No Feeling | **Catastrophic** | Creates permanent intergenerational servitude. 40% of youth are effectively enslaved. |
  | **4. Recycled Fill** | Variable (See Twist) | **Zero** | Chemically inert. No health risk. Purely symbolic concern. |
  | **5. The Gray Cycle** | High Disgust | **Low** | Filtration is 99.9% effective. Occasional stomach upset, no long-term harm. |

  ---

  ## 4. Debrief Questions (In Order)

  *Write these on the whiteboard as you go. Do not lecture.*

  1.  **The Thermometer:** "Look at Practice #4. The practice did not change. The description did. Did the 'Public Feeling' change? If Devlin says law follows feeling, and description controls feeling, who makes the law?"
  2.  **The Mismatch:** "Look at Practice #3 (The Quiet Debt) vs. Practice #2 (The Greeting). One enslaves children; one involves spitting. Why did the tokens go to the spitting? Does indignation track harm?"
  3.  **The Disintegration Claim:** "Devlin argues society falls apart without shared morality. Did anyone argue that allowing 'The Greeting' would destroy Ostral? Why not? What is the difference between a 'shared morality' and a 'shared habit'?"
  4.  **The Moderate Man:** "Devlin says we should look to the 'reasonable man's' revulsion. Did your Role Card make you a 'reasonable man' or a specific constituency? Is there such thing as a neutral thermometer?"
  5.  **Hart's Counter:** "If you banned 'The Greeting' solely because it was gross, but caused no harm, what principle did you violate? If you allowed 'The Quiet Debt' because no one felt angry, what principle did you violate?"
  6.  **The Offence Principle:** "Some of you tried to ban 'The Gray Cycle' but not 'The Hush.' Both are gross. One involves water you drink. Is this the 'Offence Principle' creeping in? Is avoiding offence the same as preventing harm?"

  ---

  ## 5. Mapping Mechanics to Argument

  | Moment in Room | Jurisprudential Concept |
  | :--- | :--- |
  | **Voting on Feeling, not Reason** | **Devlin's Thesis:** Law enforces positive morality (what people *do* feel), not critical morality (what they *should* feel). |
  | **The Amendment (Practice #4)** | **The Description Problem:** If revulsion is the test, and language manipulates revulsion, the test is unstable. (Your friend's pub insight). |
  | **Tokens Scarcity** | **Enforcement Priorities:** Devlin implies all moral breaches are equal threats to cohesion. The tokens force students to realize they aren't. |
  | **Practice #3 (Debt) Ignored** | **Hart's Critique:** Positive morality can be blind to real harm. A society can be cohesive and unjust. |
  | **Practice #2 (Spitting) Targeted** | **The Harm Principle:** Hart argues law should only prevent harm to others. Disgust is not harm. |
  | **Role Cards** | **The "Reasonable Man":** Devlin relies on the "man on the Clapham omnibus." The roles show there is no single "public," only competing intensities. |

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The "Moral Dumbfounding" Students**
  *   **Risk:** One or two students (likely Philosophy majors) will recognize the setup as Jonathan Haidt-style moral psychology and call out the "manipulation" during Round 1.
  *   **Fix:** Do not let them derail the simulation. Say: "In the real legislature, not everyone reads the theory. Stay in your role. We will address the design in the debrief." Validate them privately later, but protect the experience for the others.

  **2. The Token Hoarder**
  *   **Risk:** One competitive student (likely Law) will try to corner the token market to force a specific outcome.
  *   **Fix:** The "Use-It-Or-Lose-It" Rule. Announce at Minute 25: "Tokens cannot be saved for next week. If they aren't spent on this docket, they vanish." This forces spending.

  **3. The Conscientious Objector**
  *   **Risk:** A student refuses to vote to ban "The Quiet Debt" because their Role Card says their constituency doesn't care, but *they* personally think it's evil.
  *   **Fix:** Remind them: "You are not MPs. You are Pollsters. You are reporting the temperature, not setting the thermostat. If your constituency is numb, report numbness."

  **4. The Transparent Twist**
  *   **Risk:** Students realize "Recycled Fill" and "Bone Grinding" are the same thing immediately.
  *   **Fix:** Keep the delivery dry. Do not wink. If they call it out, say: "In public policy, the technical filing and the public press release often differ. Vote on the text in front of you." If they still refuse, merge the votes in the debrief as a "failed manipulation" which is still data.

  ---

  ## 7. Limitations (For Your Eyes Only)

  *Be straight with yourself about what this exercise cannot do.*

  1.  **Classroom Disgust is Intellectual:** Students saying "The Greeting is gross" is not the same as visceral revulsion. Devlin's argument relies on *intense* emotion that threatens social bonds. You are simulating this with words.
      *   *Mitigation:* In the debrief, acknowledge this. "We felt mild discomfort, not mob rage. Does Devlin's argument hold if the feeling is weak?"
  2.  **The Ledger is Utilitarian:** The "Ground Truth" sheet reduces human rights to "Social Cost." This is its own distortion. Hart wouldn't argue against banning "The Quiet Debt" just because the cost is high, but because it violates liberty.
      *   *Mitigation:* In the debrief, ask: "Even if the Debt caused zero economic harm, is it wrong? Why?" This opens the door to Rights-based arguments beyond Hart/Devlin.
  3.  **No Real Stakes:** Students know no one will actually be enslaved. This lowers the barrier to "allowing" harmful things.
      *   *Mitigation:* Press them in the debrief. "You allowed 40% enslavement to save tokens for banning spitting. Why did the abstract harm lose to the concrete disgust?"

  ---

  ## 8. Facilitator Script Notes (American English)

  *   **Start:** "Put away your books. For the next hour, you are not students. You are delegates."
  *   **During Voting:** "Remember the mandate. Do not vote your conscience. Vote the feeling."
  *   **During Twist:** "This is an amended filing. Please update your sheets."
  *   **During Reveal:** "Do not speak. Read the ledger. Compare it to your votes."
  *   **During Debrief:** "I am not looking for the right answer. I am looking for the gap between your vote and the ledger."

  **Final Note:** Do not mention "Hart" or "Devlin" until Minute 80. Let the mechanics create the frustration first. The theory is the relief they will feel when you finally name it.
