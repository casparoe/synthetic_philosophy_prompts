      *   **Format:** In-class deliberation (Legislative Committee).
      *   **Requirements:**
          *   Invented polity (name + 2 sentences history).
          *   5-6 invented practices (harmless but gross, universally disgusting but legal, neutral but harmful, etc.). *Crucial:* No real-world stand-ins (abortion, drugs, sex).
          *   Voting Rule: Devlin's (vote on popular feeling, not personal judgment).
          *   Mechanics: Role cards (slices of population), Enforcement Tokens (limited resource).
          *   Twists: One practice voted on twice (loaded vs. neutral description); one universally disgusting but legally untouched; one neutral but gravest wrong.
          *   Reveal: Ground-truth sheet (actual social costs) post-deliberation.
          *   Output: Minute-by-minute running order, printables, role cards, token rules, facilitator script (minimal), debrief questions, mapping to Hart/Devlin arguments, troubleshooting (what will go wrong), and limitations.
