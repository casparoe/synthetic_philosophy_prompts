answer: |-
  **Diagnostic**

  The disagreement centers on normativity's source: etiological accounts ground function in past selective success, while causal-role accounts ground it in current systemic capacity. In a two-history case, they diverge when a trait's current contribution exceeds or differs from its selected history. The genuine hardness lies in three places: first, individuation (is this one trait with two jobs or two traits?); second, the status of side effects (causal contributions not selected for); and third, whether malfunction requires historical failure or merely systemic disruption. Students struggle not with the definitions, but with the intuition that "function" might split into two non-equivalent concepts depending on whether you ask "why is it here?" or "what does it do?" In your frog case, the gene duplication is the load-bearing feature, creating distinct historical lineages for the same protein structure. The co-existing variants (A and B) do philosophical work by complicating the "selected effect" claim—if both persist, was either strictly selected? This forces a confrontation with polymorphism that standard cases avoid. The calcium sequestration is noise; it tests side-effects but distracts from the core history-vs-capacity clash. The uplift timeline matters only to establish that the skin expression is evolutionarily recent enough to question its status as a "proper function." The hardness is accepting that one account must call something a malfunction while the other calls it functional.

  **1. Sequence**

  1.  **Type/Token Distinction:** Introduce this first. If students conflate the trait type (the protein) with the token (this specific expression instance), the subsequent attribution of function will collapse into ambiguity.
  2.  **Standard Heart-and-Pumping Illustration:** Deploy this second, then immediately break it. If you do not establish the standard intuition first, students lack a baseline; if you do not break it, they will assume the standard case resolves the hard case.
  3.  **The Two Accounts (Named):** Introduce the labels and definitions third. If you name them before the case, students will treat the labels as answers rather than tools for analysis.
  4.  **The Carrying Case:** Introduce the frog scenario fourth. If the case arrives earlier, students will attempt to solve it using pre-theoretical intuitions rather than the accounts.
  5.  **Malfunction:** Treat malfunction as the payoff, not the entry point. If you start with malfunction, students define it circularly; if you end with it, they derive it from the account's logic.

  **Decisions:**
  *   **Case vs. Names:** Case goes on the board *after* the accounts are named. Students need the conceptual vocabulary to parse the case; otherwise, they discuss biology, not philosophy.
  *   **Malfunction:** Malfunction is the payoff. It tests the robustness of the account after function is established.
  *   **Type/Token:** Must be separated *before* the case appears. The case hinges on whether the "skin protein" is the same trait as the "gut protein."
  *   **Heart Illustration:** Deploy and then break. It is necessary scaffolding, but must be shown to fail in duplication scenarios to motivate the distinction.

  **2. The Carrying Case**

  *   **Load-Bearing Features:** The gene duplication is essential (separates historical lineage). The divergence in expression site (gut vs. skin) is essential (separates causal roles). The existence of Variants A and B is essential (tests the "selected effect" condition under polymorphism).
  *   **Cut for Time:** Cut the calcium sequestration. It introduces a third effect (side effect) which complicates the binary distinction you are teaching. Cut the specific temperature data (−4 °C); "freezing survival" is sufficient.
  *   **Size Judgment:** The case is too large for seventy-five minutes as written. It contains enough material for two sections (one on dual function, one on polymorphism).
  *   **Requirements:** A carrying case must have a clear phylogenetic split (to test history) and a clear systemic contribution (to test capacity). It must lack ambiguous fitness data; if selection is "noisy," the etiological account becomes muddy rather than distinct.
  *   **Real Case:** A real case would need confirmed phylogenetic reconstruction of the duplication event and knock-out phenotypes for both expressions. Do not switch; the stipulated case allows you to control the variables necessary for the philosophical distinction.

  **3. Misconception Map**

  *   **Function = Present Contribution:** Head this off at the **Heart Illustration** stage. Ask: "If the heart pumps blood but was selected for heat distribution, is pumping its function?" Write "History vs. Here-and-Now" on the board.
  *   **Selected-Effect = Forward-Looking:** Head this off at **The Two Accounts** stage. When defining etiological, explicitly write "Past Success" not "Future Use."
  *   **Teleological Smuggling:** Head this off at **The Carrying Case** stage. If a student says "evolution wanted the frog to survive," correct immediately: "Selection filters, it does not intend."
  *   **Verbal Debate:** Head this off at **Malfunction** stage. Show that the verdict on whether the trait is *broken* changes depending on the account. This has practical consequences.
  *   **Circular Malfunction:** Head this off at **Malfunction** stage. Require them to define malfunction using the account's criteria, not the word "function."
  *   **Bio Major Specific:** "If it contributes to fitness, it is a function." This will surface during **Variant A/B analysis**. They will argue Variant A's better protease activity makes it the "real" function regardless of history. Counter by asking if the trait existed before that fitness contribution arose.

  **4. Board Plan**

  *   **Left Column (Stay Visible):**
      *   **Etiological:** Function = Why it was selected (History).
      *   **Causal-Role:** Function = What it does now (Capacity).
      *   **Malfunction:** ET = Failed history; CR = Failed capacity.
  *   **Center Column (Erase after application):**
      *   **The Frog Case:** Timeline (Ancestor -> Duplication -> Plateau).
      *   **Effects:** Gut (Digestion), Skin (Ice), Calcium (Side).
      *   **Variants:** A (Protease), B (Ice).
  *   **Right Column (Build during class):**
      *   **Verdicts:** Table with rows for Gut, Skin, Calcium. Columns for ET, CR.
      *   **Check:** Final question response.
  *   **Erasure Strategy:** Erase the Center Column after the Variant analysis to make space for the Check question, but keep Left and Right visible for comparison.

  **5. Check**

  *   **Question:** "Suppose we discover the skin expression was never selected for; it is a physical consequence of the gut protein leaking into the skin, but it still saves the frog from freezing. Which account calls this a function?"
  *   **Label-Only Answer:** "Etiological says no, Causal-Role says yes." (Recites the rule without applying the logic).
  *   **Real Answer:** "Etiological says no because there is no history of selection for ice inhibition. Causal-Role says yes because it currently contributes to the survival system, regardless of origin." (Applies the grounding condition).

  **6. Declared Omissions**

  *   **Omissions:** Pluralist reconciliations, organizational approaches, and the semantic machinery proper-function views support.
  *   **Script:** "We are testing two distinct tools to see how they cut, not building the whole workshop; other tools exist, but today we master these two."

  **7. Timing**

  *   **00–10:** Type/Token distinction + Heart Illustration (Deploy & Break).
  *   **10–25:** Define Etiological and Causal-Role accounts (Left Column).
  *   **25–50:** Apply accounts to Frog Case (Center Column → Right Column).
  *   **50–65:** Variant A/B Analysis + Malfunction discussion.
  *   **65–75:** Check Question + Wrap-up.
  *   **Abandonment Strategy:** If ten minutes behind at the halfway mark (minute 37), abandon the Variant A/B analysis. Stick to the single duplicate trait's dual expression. The polymorphism is rich but secondary to the core history-vs-capacity distinction.
