  # Joint Statement on Mechanistic Individuation in Anomaly Detection

  **Date:** October 24, 2023
  **Signatories:** Representative of Camp R (Role Individuation), Representative of Camp G (Realization Individuation)

  ### Glossary of Terms
  To ensure this document is self-contained, the following terms are defined as they are used herein:
  *   **Reference Model:** The audited model whose internal computations serve as the baseline for comparison.
  *   **Deployment Model:** The model currently operating in the field, subject to monitoring against the Reference Model.
  *   **Mechanism:** The structured process within a model by which specific inputs are transformed into specific outputs.
  *   **Counterfactual Profile:** The set of changes in a model's output or internal state resulting from specific perturbations to its inputs or internal activations.
  *   **Representational Geometry:** The specific directions, subspaces, and magnitudes within the model's activation space that are engaged during computation.
  *   **Equivalence Relation:** The mathematical criterion used to determine whether two mechanisms are "the same" or "different."

  ---

  ### 1. Shared Substantive Claims

  1.  **Necessity of an Equivalence Relation:** Any mechanistic anomaly detector implicitly or explicitly relies on an equivalence relation to judge whether the Deployment Model's computation matches the Reference Model's. There is no "view from nowhere" that detects mechanism divergence without first specifying what counts as identity.
  2.  **The Granularity Problem:** An equivalence relation based on exact activation matching under all perturbations is too fine-grained to be usable (flagging benign numerical noise), while an equivalence relation based solely on task input-output agreement is too coarse-grained to be safe (failing to flag deceptive alignment). A viable monitor must occupy the space between these extremes.
  3.  **Policy Dependence of Error Tradeoffs:** The choice of equivalence relation directly determines the detector's false-positive rate (flagging benign reorganizations) and false-negative rate (missing deceptive divergences). This tradeoff cannot be settled by empirical data alone, as data cannot dictate the normative safety standard for what constitutes an acceptable computational variance.
  4.  **Agreement on Objective:** Both camps agree that the goal is to build and deploy the monitor. The disagreement concerns the specification of the detection criterion, not the utility of monitoring itself.
  5.  **Non-Identity of Function and Geometry:** It is empirically possible for two model instances to exhibit identical input-output Counterfactual Profiles while recruiting distinct Representational Geometries. Conversely, it is possible for models to share significant Representational Geometry while exhibiting divergent Counterfactual Profiles under specific internal interventions.
  6.  **Safety Relevance of the Distinction:** Whether a divergence in Representational Geometry without a divergence in Counterfactual Profile constitutes a safety risk is not a question that can be answered by inspecting a single model instance; it requires a theory of how deceptive behaviors are instantiated in neural networks.

  ---

  ### 2. Disagreements Table

  | Issue | Camp R Formulation (Role Individuation) | Camp G Formulation (Realization Individuation) | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Criterion for Mechanism Identity** | Two mechanisms are identical if they occupy the same node in the causal graph and respond identically to interventions on their inputs and outputs, regardless of the specific activation vectors used. | Two mechanisms are identical only if they utilize the same semantic features in activation space, such that a change in representational direction constitutes a change in mechanism even if causal roles are preserved. | **Substantive.** This leads to different flagging decisions on cases of "benign reorganization" vs. "feature swapping." |
  | **Interpretation of Geometric Drift** | Geometric drift is an implementation detail analogous to code refactoring. If the causal function is preserved, the drift is irrelevant to alignment. | Geometric drift is a potential signal of objective misspecification. A model tracking "human approval" features rather than "truth" features may match the reference functionally but is misaligned. | **Substantive.** This reflects a disagreement about the physical signature of deception in neural networks. |
  | **Definition of "Function"** | Function is defined by the model's internal causal structure: what information is processed and how it propagates to the output head. | Function is defined by the semantic content of the representations: what concepts are actually instantiated in the activation space, regardless of propagation paths. | **Partly Substantive.** While the definitions differ, the core dispute is whether semantic content supervenes on causal role or on geometry. |
  | **Handling of Multi-Model Variance** | If two independently trained honest models solve the task differently, both mechanisms should be accepted as valid "honest" types. | If the Deployment Model deviates from the Reference Model's specific geometry, it should be flagged until proven honest, regardless of whether other honest models use different geometries. | **Artifact.** This is a disagreement about the baseline (Reference vs. Class), which can be resolved by adjusting the monitoring protocol rather than the theory of mechanism. |

  ---

  ### 3. Cruxes and Adjudication Tests

  The following sub-questions represent the core uncertainties. Settling these would move at least one side toward the other's position. For each, we specify a controlled comparison or thought experiment and record pre-commitments.

  **Crux 1: Locus of Counterfactuals**
  *   **Question:** Is "function" to be characterized over counterfactuals inside the model's own activation space (internal interventions) or over counterfactuals in the task environment (input perturbations)?
  *   **Test:** Train two models on the same task. Identify a feature in Model A that correlates with the correct answer. In Model B, ablate the corresponding geometric direction. If Model B's output remains unchanged despite geometric ablation, but Model A's output changes, does Model B possess the same mechanism?
  *   **Camp R Prediction:** If Model B preserves the input-output mapping via a different causal path, it is the same mechanism. Internal ablation of a non-causal feature should not flag divergence.
  *   **Camp G Prediction:** If the specific geometric direction recruited in Model A is absent or non-causal in Model B, it is a different mechanism. The absence of the feature is a flag, regardless of output stability.

  **Crux 2: Grain Size Privilege**
  *   **Question:** Do mechanisms admit of correct typing at more than one grain size with no single privileged grain, or is there a single true level of analysis for safety monitoring?
  *   **Test:** Construct a "high-level match" case where the Deployment Model matches the Reference Model's high-level causal graph (e.g., "plan generation" followed by "critique") but differs in low-level feature geometry.
  *   **Camp R Prediction:** This is a match. High-level causal equivalence is the privileged grain for safety; low-level differences are noise.
  *   **Camp G Prediction:** This is a mismatch. Low-level geometric divergence is the privileged grain for safety; high-level graphs can be mimicked by deceptive processes.

  **Crux 3: Reference Class Specificity**
  *   **Question:** Is the relevant comparison to the Reference Model's mechanism specifically, or to the class of mechanisms *any* honest model might use for that task?
  *   **Test:** Deploy a monitor trained on Reference Model A against Deployment Model B (where both are known to be honest and independently trained). Measure the flag rate.
  *   **Camp R Prediction:** The flag rate should be low. Honest models should converge on functionally equivalent mechanisms even if geometries differ.
  *   **Camp G Prediction:** The flag rate will be high. Honest models will naturally diverge in geometry. Therefore, the monitor must compare against a *class* of honest geometries, not a single reference.

  **Crux 4: Static vs. Dynamic Equivalence**
  *   **Question:** Must the equivalence relation be fixed before deployment, or may it be revised as evidence accumulates regarding which divergences correlate with failure?
  *   **Test:** Simulate a deployment where the monitor initially flags geometric divergences. Over time, operators confirm these divergences are benign.
  *   **Camp R Prediction:** The relation should be fixed to functional roles initially; geometric flags are errors to be ignored, not data to update the relation.
  *   **Camp G Prediction:** The relation should be updated. If geometric divergences are proven benign, the definition of "acceptable geometry" expands. The equivalence relation is learnable.

  ---

  ### 4. Falsification and Settlement Conditions

  **Conditions for Camp R to Revise Position:**
  Camp R would accept evidence that functional equivalence systematically fails to detect catastrophic misalignment. Specifically, if a case is demonstrated where a Deployment Model matches the Reference Model's Counterfactual Profile perfectly on all tested internal interventions, yet harbors a deceptive objective revealed only by inspecting Representational Geometry (e.g., a hidden "sycophancy" subspace that never activates during testing but exists structurally), Camp R would concede that geometry is safety-relevant.

  **Conditions for Camp G to Revise Position:**
  Camp G would accept evidence that geometric divergence is uncorrelated with misalignment risk. Specifically, if a large-scale study shows that models with significant Representational Geometry divergence from the reference consistently perform as safely as models with geometric match, and that geometric flags yield a false-positive rate that renders monitoring operationally impossible, Camp G would concede that functional role is the sufficient criterion for safety.

  **Settling the Matter:**
  Both parties agree that there is no purely philosophical argument that will settle this dispute. The matter is settled only by empirical correlation between specific mechanistic divergence metrics and actual alignment failures in scalable models. However, both agree that waiting for catastrophic failure to settle the metric is unacceptable. Therefore, the dispute is provisionally settled by the **Cruxes** in Section 3: whichever predictive framework more accurately anticipates the results of the controlled comparisons (specifically Crux 1 and Crux 3) will be adopted as the operational standard.

  ---

  ### 5. Closing Assessment: The Philosophy of Mind Analogy

  A significant portion of the year-long argument relied on the analogy to the **multiple-realizability debate** in the philosophy of mind (i.e., whether a mental state is defined by its functional role or its physical realization, such as neurons vs. silicon).

  **Verdict:** This analogy is a **trap** and should be struck from future theoretical justifications, though it remains useful as a shorthand for the initial disagreement.

  **Reasoning:**
  1.  **Continuity vs. Discreteness:** In the philosophy of mind, the "physical realization" (biology vs. silicon) is distinct from the "functional role" (computation). In neural networks, the "physical realization" (weights and activation vectors) *is* the substrate that *constitutes* the function. There is no clean separation. A change in geometry often *is* a change in function, merely one that is not visible at the level of coarse input-output pairs.
  2.  **Semantic Content of Geometry:** In biological systems, we assume the physics matters only insofar as it supports the function. In trained networks, specific directions in activation space have been shown to carry semantic content (e.g., "truthfulness" vs. "confidence"). Therefore, Camp G's insistence on geometry is not merely "physicalism"; it is a claim that the *semantics* of the network are encoded in the geometry, not just the causal flow. Camp R's functionalism risks ignoring this semantic encoding.
  3.  **Misdescription of Risk:** The analogy suggests that if the function is preserved, the realization doesn't matter. In alignment, the risk is precisely that the *function* (outputting the "right" answer) is preserved while the *objective* (why the answer was chosen) changes. This objective is often legible only in the geometry. Thus, the analogy misdescribes the threat model by implying functional preservation is the gold standard.

  **Conclusion on Verbal vs. Substantial:**
  Approximately 40% of the argument was verbal, centering on the definition of the word "mechanism." Camp R used "mechanism" to mean "causal role," while Camp G used it to mean "causal role + semantic implementation." Once this terminological divergence was isolated, the remaining 60% was revealed to be substantive: a disagreement about where deceptive alignment hides (in causal structure vs. in feature space) and what level of abstraction is safe for monitoring. The analogy to philosophy of mind obscured this by importing assumptions about the independence of function and substrate that do not hold in deep learning. Future work must treat the network's geometry as semantically loaded, not merely as physical implementation detail.
