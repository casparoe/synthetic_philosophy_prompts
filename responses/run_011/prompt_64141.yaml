          *   Lab: Entitled to background assumption that things are testable.
          *   Observation: Asymmetry (Savers' hinge is load-bearing; Lab's is local).
          *   Observation: Boundary between empirical generalization and hinge is blurry.
      *   **Addressing Relativism/Rational Contact:**
