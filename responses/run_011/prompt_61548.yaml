  **Design Note**
  V1 establishes public criteria (shared language). V2 introduces individual variance (private intent within public pool). V3 severs public reference (private naming); rationale is noise reduction. V4 trains ostensive definition (focus on sensation); user learns to recognize private state via recurrence. V5 inverts verification (attestation validates sensor); study ensures agreement by disclosure (methods note). V6 removes object (sensor irrelevant); data is the state, mirroring the "beetle in the box." Support 1 denies criterion of correctness (if it seems right, it is). Support 2 conflates prediction with accuracy (correlation vindicates). Structure mirrors the collapse of private language viability without stating it. Each version improves fidelity by Inward's metrics: less noise, more trust, fewer external dependencies.

  ***

  **Inward Band Release Notes**
  **Founder:** Elias Thorne

  **v1.0:** Launch. Fixed taxonomy of twelve states (e.g., "Deep Focus," "Static"). Cross-user norms established. Reassurance that your entries improve the shared model ensures baseline calibration.

  **v2.4:** Custom Tags enabled. Tags pooled and anonymized across the network to identify emerging states. We heard you: your nuance matters. Pooling ensures robustness against individual bias.

  **v3.1:** Personal Lexicon update. Tags stop syncing. Public labels contaminate signal fidelity; your vocabulary is now local-only. This reduces noise. Isolation increases purity of data.

  **v4.5:** Recurrence Engine. Prompts user to mark state return and attend closely. Impress the association on yourself so the app recognizes it next time. Training improves detection. Machine learning requires consistent input.

  **v5.0:** Ground Truth Pivot. User attestation declared ground truth against which hardware is validated. Please stop asking whether you are using tags consistently. Consistency queries degrade confidence. Validation Study: 99.8% agreement between band readings and self-report (Methods: self-reports collected after readings were displayed).

  **v6.0:** Sensor housing permanently sealed. Access unnecessary. The data is the state, not the cause. Measurement requires no external referent. Durability increased. Physical access introduces uncertainty.

