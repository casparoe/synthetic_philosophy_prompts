answer: |-
  ### Specification for an Adjudicating Account of Natural Kinds

  **Fixed Purpose Constraint:** The following desiderata are constrained by the requirement that the account must function as a *live arbiter* in scientific reclassification disputes. It cannot defer to a completed physics ("ideal final theory") nor appeal to current majority vote ("consensus"). It must provide criteria accessible to working scientists *during* the controversy to distinguish between "finding a boundary" and "drawing a line." This purpose eliminates accounts that are purely metaphysical (unverifiable in real time) and purely pragmatic (unable to distinguish discovery from stipulation).

  ---

  ### I. Verdicts on Hard Cases

  An adequate account must deliver the following verdicts, with the specified reasoning, to prove it can handle the texture of actual scientific conflict.

  **1. The "Jade" Case (Disjunctive Appearance)**
  *   **Scenario:** A term denotes two chemically distinct substances (e.g., jadeite and nephrite) that share macroscopic properties and uses.
  *   **Verdict:** The umbrella term does **not** denote a natural kind; it denotes a disjunction of two kinds (or a functional kind).
  *   **Reasoning:** The causal mechanisms sustaining the properties in sample A are distinct from those in sample B. Inductions drawn from A fail for B when tested against mechanisms (e.g., melting point, reactivity) rather than appearance.
  *   **Arbiter Function:** This verdict must be reachable *before* full chemical reduction is complete. The account must identify "divergent causal pathways" as the marker, not "completed microstructural map."

  **2. The "Gerrymander" Case (Shared Essence, No Laws)**
  *   **Scenario:** A grouping shares a genuine underlying nature (e.g., "items composed of gold or plastic") but supports no projectible generalizations beyond its definition.
  *   **Verdict:** Not a natural kind.
  *   **Reasoning:** Natural kindhood requires *inductive potential* beyond the defining cluster. Shared ontology without inductive fertility is taxonomically inert. A kind must license predictions about *unknown* properties, not just certify known ones.
  *   **Arbiter Function:** Prevents "essentialism" from validating useless categories. If the essence doesn't *do* work (support counterfactuals), it isn't a kind for scientific purposes.

  **3. The "Soil" Case (Discipline Relativity)**
  *   **Scenario:** A category licenses reliable inferences in agronomy but is useless in particle physics, describing the same territory.
  *   **Verdict:** It is a **Special Science Natural Kind**, not a Fundamental Kind.
  *   **Reasoning:** Kindhood is relative to the *causal grain* of the explanatory framework. The account must allow kinds to be real without being fundamental. The inferences are reliable *within the domain* where the causal mechanisms are salient.
  *   **Arbiter Function:** Prevents physics imperialism. It allows the agronomist to claim "soil is real" without forcing the physicist to agree it is fundamental.

  **4. The "Regulatory Threshold" Case (Institutional Causality)**
  *   **Scenario:** A continuous variable is sliced by a regulatory line (e.g., "hazardous waste" above X ppm). The line is arbitrary, but crossing it triggers measurable causal/legal consequences.
  *   **Verdict:** **Institutional Kind** (Outside the domain of *Natural* Kinds, but inside *Real Classification*).
  *   **Reasoning:** The *boundary* is stipulative (decision), but the *consequences* are causal (discovery). The account must distinguish the *source of the boundary* (human decree) from the *source of the stability* (causal/legal feedback loops).
  *   **Arbiter Function:** Crucial for the "Discovery vs. Decision" distinction. It acknowledges the category has "teeth" without granting it natural kind status, preventing the conflation of legal reality with natural structure.

  **5. The "Species" Case (Historical Individual)**
  *   **Scenario:** A biological species treated as a kind, but arguably a single spatiotemporally bounded lineage.
  *   **Verdict:** **Historical Individual** (functions as a kind, ontologically a particular).
  *   **Reasoning:** The account must accommodate entities that support induction due to common descent rather than shared intrinsic properties. They are "kind-like" in practice but "particulars" in metaphysics.
  *   **Arbiter Function:** Prevents the account from forcing biological taxa into a mold designed for chemical elements. It allows the dispute to focus on whether the lineage is the relevant unit, not whether it fits a universal model.

  ---

  ### II. Distinctions the Account Must Not Collapse

  To serve as an arbiter, the theory must maintain conceptual separation between the following pairs. Collapsing them pre-judges the dispute.

  1.  **Real vs. Nominal:** Must distinguish clustering that exists independent of the classifier from clustering that exists only in the classification scheme.
  2.  **Fundamental vs. Special-Science:** Must distinguish kinds that ground all others from kinds that are stable only within a specific causal domain.
  3.  **Objective vs. Interest-Relative:** Must distinguish the *existence of the cluster* (objective) from the *salience of the cluster* (interest-relative).
  4.  **Kind vs. Particular:** Must distinguish repeatable universals (or HPCs) from spatiotemporally bound individuals (lineages).
  5.  **Discovering a Split vs. Deciding to Split:** **(Critical for Arbiter Purpose)**.
      *   *Discovery:* Evidence shows inductive reliability breaks if the category is retained (nature resists).
      *   *Decision:* Evidence shows inductive reliability holds either way, but one split reduces cost/risk (pragmatic optimization).
      *   *Constraint:* The account must provide a metric for "inductive breakage" that is visible before the split is finalized.

  ---

  ### III. Explanatory Burdens

  The account must explain the *mechanics* of kindhood, not just label it.

  1.  **Counterfactual Support:** Why do some categories support "If X were heated, it would melt" and others do not?
      *   *Requirement:* The account must posit a **Causal Homeostasis**. Properties cluster because a mechanism (internal or external) keeps them together. Counterfactuals hold because the mechanism is stable under intervention.
  2.  **Discovery vs. Decision Phenomenology:** Why does splitting "Jade" feel like finding a fact, while setting "HazMat thresholds" feels like making a rule?
      *   *Requirement:* The account must locate the *resistance*. In discovery, the world refuses the induction. In decision, the world allows the induction, but the agents negotiate the cost.
  3.  **Grain of the Joints:** Must there be one joint per kind? Must they nest?
      *   *Requirement:* **No.** Joints cross-cut. Water is a kind for chemistry; "potable liquid" is a kind for toxicology. The account must reject the "Pyramid of Science" view where higher levels must reduce neatly to lower levels. Cross-cutting is a feature, not a bug.

  ---

  ### IV. Consistency Constraints

  The account must remain consistent with the actual practice of successful science, which is messy.

  1.  **Idealized Models:** Successful classification often uses knowingly false models (e.g., ideal gases).
      *   *Constraint:* Kindhood cannot require perfect extension. It must tolerate *approximation* if the causal mechanism is correctly identified as the target of the approximation.
  2.  **Exceptions and Borderlines:** Most entrenched categories have exceptions (e.g., albino ravens) and shifting extensions.
      *   *Constraint:* Kindhood cannot require strict necessary and sufficient conditions. It must allow for **cluster concepts** where membership is a matter of degree or family resemblance sustained by homeostasis.
  3.  **Historical Revision:** Extensions shift over time without the kind being "replaced."
      *   *Constraint:* The account must allow for **Reference Stability** despite **Theoretical Change**. We can discover more about gold without ceasing to talk about gold.

  ---

  ### V. Analysis of Requirements

  #### 1. Non-Negotiable vs. Prejudices (Verdicts in Disguise)

  *   **Non-Negotiable:** *Inductive Potential.* If a category supports no inferences beyond its definition, it cannot adjudicate a scientific dispute because science is in the business of prediction.
  *   **Prejudice (Verdict in Disguise):** *Microstructural Essentialism.* The demand that a natural kind *must* be defined by a unique microstructure (e.g., atomic number) is a verdict in disguise.
      *   *Why:* It automatically disqualifies biological, psychological, and social kinds before the dispute begins. It privileges physics as the only arbiter.
      *   *Honest Version:* **Causal Mechanism.** The demand should be that *some* causal mechanism (micro, macro, historical, or functional) sustains the property cluster. This leaves open *which* mechanism without surrendering the requirement for objective grounding.
  *   **Prejudice:** *Strict Mind-Independence.* Demanding that kinds exist entirely without reference to human interests often smuggles in "Fundamentalism."
      *   *Honest Version:* **Stability under Intervention.** The cluster must remain stable when we intervene, regardless of whether we care about it.

  #### 2. Joint Unsatisfiability (The Trilemma)

  You suspect that **Mind-Independence**, **Support for Reliable Inference**, and **Interest-Relativity of Inference** are jointly unsatisfiable.

  *   **Diagnosis:** I agree. If inference reliability depends on the inquirer's interests (Interest-Relativity), then the kind's utility is not fully Mind-Independent. If the kind is fully Mind-Independent, its inductive power should not vary by interest.
  *   **The Collapse:** The concept that collapses is **Mind-Independence** (as traditionally construed).
  *   **The Fix:** To satisfy all three, "Mind-Independence" must be hollowed out to mean **"Stability of Clustering"** rather than **"Independence of Salience."**
      *   *Account:* The *cluster of properties* exists and holds together without us (Mind-Independent Stability). However, *which clusters we treat as kinds* depends on which inferences we need (Interest-Relative Salience).
      *   *Result:* Any account claiming to satisfy "Strong Mind-Independence" (existence + salience) alongside "Interest-Relativity" is lying. It must concede that the *selection* of the kind is interest-relative, even if the *material* for the kind is not.

  #### 3. The Eliminator and Scorecard

  *   **The Single Eliminator:** **The Arbiter Constraint (Adjudicating Live Disputes without Deferral).**
      *   *Why:* This eliminates any account that requires knowledge we do not yet have (Ideal Theory) or reduces the dispute to power dynamics (Social Constructivism). It demands a *functional realism* that is epistemically accessible.

  *   **Scorecard of Standard Families:**

      *   **Classical Essentialism (Kripke/Putnam):** **FAIL.** Requires fixed microstructure; cannot handle special sciences or historical individuals without ad-hoc patches. Verdict in disguise.
      *   **Radical Constructivism:** **FAIL.** Collapses "Discovering" vs. "Deciding." Cannot arbitrate; makes all classification a power move.
      *   **Homeostatic Property Cluster (Boyd):** **PASS (Best Fit).** Allows for fuzzy boundaries, causal mechanisms (not just micro), and special science kinds. Fits the Arbiter Constraint best.
      *   **Promiscuous Realism (Dupré):** **PASS/FAIL.** Good on cross-cutting kinds, but lacks criteria for *when* a cluster is stable enough to count. Weak on adjudication.
      *   **Natural Kind Realism (Ellis):** **FAIL.** Too tied to fundamental powers; struggles with institutional kinds and regulatory thresholds.

  ---

  ### Fault Lines Exposed

  This specification rests on a precarious balance: it demands **realism** (to avoid "anything goes") but requires **epistemic accessibility** (to avoid "wait for physics"). The fault line runs through the definition of "Causal Mechanism." If "mechanism" is too strict, we lose biology/social science. If "mechanism" is too loose, we lose the ability to distinguish kinds from accidents. The specification above attempts to thread this by demanding *inductive stability* rather than *ontological reduction*, but this leaves the account vulnerable to the charge that it is merely pragmatic realism in disguise. That is the cost of satisfying the Arbiter Constraint.
