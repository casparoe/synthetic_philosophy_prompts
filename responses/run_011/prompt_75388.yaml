answer: |-
  **To:** The Desk
  **From:** [Your Name/Consultant]
  **Subject:** House Protocol for Consciousness Claims (The 'Datum/Referent' Check)
  **Date:** 24 October 2023

  ### Introduction

  You are correct that the two complaints you received—over-credulity regarding introspection and over-scepticism regarding non-response—are symptoms of the same error: conflating the *report* of an experience with the *experience* itself. Your working understanding of heterophenomenology is sound enough for newsroom purposes, though it requires one adjustment for non-verbal cases: in the absence of speech, the 'text' becomes any signal the researchers interpret as a communicative act (e.g., a BOLD signal pattern).

  Below is the protocol you requested. It is designed to be run by a generalist science reporter in under an hour during the pitch or commissioning stage. It forces a separation between what was measured (the Datum) and what is claimed to have happened inside the subject (the Referent).

  ***

  ### Part 1: The Protocol (Full Version)

  **Time allowance:** 45–60 minutes
  **Input:** Study abstract, press release, or interview transcript.

  #### Step 1: Isolate the Datum
  **Question:** What is the physical evidence that exists independently of the subject's mind?
  **Instruction:** List the raw outputs. Is it a transcript? A button press? A blood-oxygen-level-dependent (BOLD) signal? A calcium spike in a dish?
  **Sufficiency Criterion:** You must be able to point to a file, a waveform, or a quote. If you cannot point to it, it is not a datum.
  **Newsroom Translation:** "What do we actually have in the file?"
  **Judgement Flag:** ⚠️ **Interpretation of Signal.** In non-verbal cases (fMRI, organoids), researchers have already interpreted the raw signal. You must identify where the raw data ends and the researcher's interpretation begins.
  **Stop Point:** If there is no datum (e.g., pure speculation), do not commission.

  #### Step 2: Identify the Bridge
  **Question:** What assumption connects the Datum to the claim of consciousness?
  **Instruction:** Find the premise that allows the researchers to move from Step 1 to "the subject felt/thought X."
  **Sufficiency Criterion:** The bridge must be stated or clearly implied. (e.g., "We assume this brain area lights up *only* when imagining tennis.")
  **Newsroom Translation:** "Why does this blip mean *that*?"
  **Judgement Flag:** ⚠️ **Theoretical Commitment.** This is often where the editorial risk lies. If the bridge relies on a controversial theory (e.g., Integrated Information Theory), flag this for me.
  **Stop Point:** If the bridge is "it just does," treat the claim as speculation.

  #### Step 3: Test Sincerity vs. Accuracy
  **Question:** Is the problem that the subject is lying/confabulating (Sincerity), or that the measure is misreading them (Accuracy)?
  **Instruction:**
  *   **For verbal reports:** Could the subject be mistaken about their own mind (Accuracy) or misleading us (Sincerity)?
  *   **For non-verbal signals:** Is the signal noise (Sincerity/Integrity) or is the map wrong (Accuracy/Validity)?
  **Sufficiency Criterion:** You must identify which failure mode is more likely.
  **Newsroom Translation:** "Are they tricking us, or is the thermometer broken?"
  **Critical Distinction:** **Keep this.** Sincerity (the report is genuine) is distinct from Accuracy (the report matches reality). A patient can sincerely report pain they do not physiologically have; a scanner can accurately record a signal that does not mean pain.
  **Stop Point:** If the study does not attempt to rule out the dominant failure mode, the claim is weak.

  #### Step 4: The 'As-If' Test
  **Question:** Could this datum be produced by a system that feels nothing?
  **Instruction:** Imagine a 'philosophical zombie' or a sophisticated chatbot. Could it produce this Datum without the Referent?
  **Sufficiency Criterion:** If the answer is "Yes," you cannot write that consciousness *was* present. You can only write that the system *behaved as if* it were present.
  **Newsroom Translation:** "Could a machine do this without a soul?"
  **Judgement Flag:** ⚠️ **Editorial Values.** This is where you hand off to me. If the answer is "Yes, but it's unlikely," I must decide if the risk of error is worth the story.
  **Stop Point:** Write down the finding as a fact about *behaviour* or *correlation*, not a fact about *experience*.

  #### Step 5: Draft the Claim
  **Question:** What is the strongest sentence we can write without lying?
  **Instruction:** Rewrite the press release claim using only the permissions granted by Steps 1–4.
  **Sufficiency Criterion:** The sentence must not assert the existence of the Referent unless the Datum makes it impossible to deny (which is rare).
  **Newsroom Translation:** "What can we print without getting sued by reality?"
  **Stop Point:** This is your commissioning recommendation.

  ***

  ### Part 2: Newsroom Wiki Version (Short Form)

  **Protocol:** Consciousness Claims Check
  **Use when:** Commissioning stories on pain, awareness, dreams, AI, or organoids.

  1.  **Find the File:** What is the hard evidence? (Quote, scan, spike). If it's just an idea, stop.
  2.  **Find the Link:** Why does that evidence prove 'feeling'? Is the link solid or theoretical?
  3.  **Sincerity vs. Accuracy:** Is the subject lying/confabulating, or is the measurement tool wrong? Which is the bigger risk?
  4.  **The Zombie Check:** Could a non-conscious system produce this same evidence? If yes, do not claim consciousness is proven.
  5.  **Write the Safe Headline:** Describe the *report* or the *signal*, not the *feeling*. (e.g., "Brain scans suggest..." not "Patients feel...").

  **⚠️ Hand-off to Editor:** If Step 4 yields "Yes, but unlikely," or if Step 2 relies on disputed theory.

  ***

  ### Part 3: Technical Notes & Limitations

  **On Newsroom Translation**
  You suspected the 'Intentional Stance' could be dropped. You are correct. For a reporter, treating the subject as a 'rational agent' is unnecessary complexity. The **Sincerity vs. Accuracy** distinction is the load-bearing wall; keep it. The 'Datum vs. Referent' distinction must survive translation, or we revert to magic thinking.

  **On Non-Verbal Subjects (The 'Text' Problem)**
  Heterophenomenology was built for speech. In fMRI or organoid cases, the 'text' is a signal interpreted by a third party (the researcher).
  *   *Adjustment:* The protocol treats the researcher's interpretation *as* the subject's report.
  *   *Risk:* This adds a layer of translation error. The protocol accounts for this in Step 1 (Judgement Flag).
  *   *Verdict:* The method is applicable but the 'confidence ceiling' is lower.

  **On Neutrality**
  Is this genuinely neutral? No. It is methodologically sceptical. It assumes the report is the thing to be explained, not the explanation itself.
  *   *Defense against First-Person Methodologists:* If a researcher complains we are 'throwing away the datum' of private experience, our reply is: "We are journalists, not phenomenologists. We deal in public verifiability. We report on the *claim* of experience because we cannot verify the experience itself." This is not a metaphysical stance; it is an epistemic safety rail.

  **What This Protocol Cannot Settle**
  1.  **The Hard Problem:** It cannot tell you if the subject *actually* has qualia. It only tells you if you are licensed to *write* that they do.
  2.  **Ethical Weight:** It does not determine moral status. An organoid might fail the protocol (no verifiable report) but still deserve moral consideration (precautionary principle). That is an ethical decision, not a journalistic one.
  3.  **False Negatives:** It is designed to prevent false positives (claiming consciousness where there is none). It will inevitably suppress stories where consciousness exists but cannot be reported. You must accept this trade-off.

  ***

  ### Part 4: Application to Test Cases

  Here is how the protocol runs on your three specific scenarios.

  #### Case 1: Cognitive Motor Dissociation (fMRI Command Following)
  *   **The Study:** Unresponsive patients show BOLD signals corresponding to "imagine tennis" vs. "imagine house."
  *   **Step 1 (Datum):** Haemodynamic changes in the supplementary motor area. No text, no movement.
  *   **Step 2 (Bridge):** The assumption that this specific activation pattern *means* "volitional command following" and not automatic processing or noise.
  *   **Step 3 (Sincerity/Accuracy):** Sincerity is irrelevant (no agent to lie). Accuracy is the risk: Is the map of brain-to-meaning correct?
  *   **Step 4 (Zombie Check):** Could a brainstem reflex produce this? Unlikely for complex tasks, but 'automatic' neural processing is possible without awareness.
  *   **Step 5 (Draft Claim):** "Scans indicate command-following capacity," NOT "Patients are conscious."
  *   **Protocol Verdict:** **Adapted Application.** The neural signal is treated as the 'text'. The protocol holds, but the reporter must explicitly state that the 'report' is inferred by the machine, not uttered by the patient.
  *   **Entitlement:** You are entitled to write that *will* was detected, but not that *suffering* or *selfhood* is present. The distinction between 'awareness' and 'consciousness' must be maintained.

  #### Case 2: Dream Decoding (Classifier + Retrospective Report)
  *   **The Study:** Classifier trained on waking views applied to early sleep; subjects woken and asked what they saw.
  *   **Step 1 (Datum):** 1. Visual cortex activation patterns. 2. Verbal reports given *after* waking.
  *   **Step 2 (Bridge):** 1. That waking visual maps apply to sleep. 2. That the waking report accurately reflects the dream content (not memory reconstruction).
  *   **Step 3 (Sincerity/Accuracy):** Sincerity is likely high (subjects aren't lying). Accuracy is the major risk: Dream amnesia and confabulation upon waking are well-documented.
  *   **Step 4 (Zombie Check):** A sleeping brain processes images without 'seeing' them in the phenomenological sense.
  *   **Step 5 (Draft Claim):** "Brain activity correlates with *reported* dream content," NOT "Scientists decode dreams."
  *   **Protocol Verdict:** **Standard Application.** The protocol catches the retrospective gap. The 'Datum' is the waking report, not the dream itself.
  *   **Entitlement:** You can write about the correlation between the scan and the *story told upon waking*. You cannot write that you know what they saw while asleep.

  #### Case 3: Cerebral Organoids (Stress Activity)
  *   **The Study:** Organoids show stress markers; lab leader says "cannot rule out that something is felt."
  *   **Step 1 (Datum):** Calcium spikes / gene expression associated with stress in neurons.
  *   **Step 2 (Bridge):** The assumption that cellular stress markers in a dish equate to phenomenological distress in a being.
  *   **Step 3 (Sincerity/Accuracy):** There is no subject to be sincere. The 'reporter' is the Lab Leader. His statement ("cannot rule out") is a report of *his uncertainty*, not the organoid's state.
  *   **Step 4 (Zombie Check):** **FAIL.** A collection of cells can exhibit stress markers without feeling 'stress' (just as a liver does).
  *   **Step 5 (Draft Claim):** "Organoids show cellular stress responses," NOT "Organoids feel pain."
  *   **Protocol Verdict:** **Inapplicable / Warning.** Heterophenomenology requires an agent to have a 'phenomenology'. An organoid is not yet an agent. The Lab Leader's quote is a hypothesis, not data.
  *   **Entitlement:** You must report the Lab Leader's speculation *as speculation*. If you write "Organoids may feel pain," you have laundered the researcher's uncertainty into a fact about the organoid. The protocol dictates you write: "The lead researcher suggests the possibility of sensation, though no behavioural evidence exists."

  ### Closing Note

  This protocol will not make you popular with researchers who want headlines. It will, however, prevent the two complaints you currently face. It forces the writer to admit when they are reporting on a *claim* rather than a *fact*. In the organoid case specifically, it saves you from the letter to the editor by ensuring the speculation remains attributed to the speculator, not adopted by the magazine.

  Proceed with the protocol. If a pitch fails Step 4, commission it only as a piece on the *controversy*, not the *discovery*.
