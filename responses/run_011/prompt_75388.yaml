prompt: |-
  I cover neuroscience and the philosophy of mind for a monthly British ideas magazine, and since the spring I have also been commissioning on the desk, which means four to six pieces a month now pass across my screen in which the evidence consists substantially of what someone says about their own experience: anaesthesia awareness, patients who meet every behavioural criterion for unresponsiveness yet appear to follow commands in a scanner, attempts to decode the content of a subject's dream from imaging data, psychedelic phenomenology, and lately claims about cerebral organoids and about large language models. Two complaints have landed in the last twelve months, and they pull in opposite directions. A philosopher wrote that we had laundered introspective report into evidence about consciousness itself, treating what a subject says as though it settled what a subject has. A clinicians' group wrote that we had done the reverse, producing a piece so heavy with caution about a study of unresponsive patients that ordinary readers took away the impression there was nobody home. I have come to think both complaints are symptoms of a missing distinction rather than of bias, and I want a house protocol that supplies it.

  The framework I want it built on is heterophenomenology, and my working understanding of it — which you should correct wherever I have got it wrong — is roughly this: take the subject's report seriously as data; interpret it the way one would interpret any text produced by an agent worth taking at their word provisionally; but refuse at the outset to grant that what the report describes exists, treating the world the subject describes as a theorist's posit rather than a given; and hold neutrality between the possibilities that the subject is accurate, that they are sincere but confabulating, and that they are not sincere at all. What I need is a procedure a reporter with no philosophical training can run on such a study in under an hour, before a commissioning meeting rather than after the piece is written: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops and writes down that something is a fact about what was said rather than a fact about what was experienced, and the points at which it hands the decision to me because the question has turned out to be one of editorial values rather than of method. Please be explicit about which of the distinctions have to survive translation into newsroom language and which can safely be dropped; my own suspicion is that the technical apparatus of the intentional stance can go, while the difference between a report's being sincere and its being accurate absolutely cannot, but tell me if that is the wrong cut. I also want the limits stated rather than smoothed over: what the procedure does with a subject who can produce no text at all, whether its neutrality is genuinely neutral or is a way of assuming from the start that the report and not the experience is the thing to be explained, and how we would defend a verdict reached this way to a researcher trained in one of the disciplined first-person methods that see heterophenomenology as throwing away the datum.

  Please run the finished procedure on three cases. The first is a paper reporting that a minority of patients who are behaviourally unresponsive show command-following brain activation when asked to imagine playing tennis or walking through their own house, with no verbal report at any stage: here I want to know whether the method, which was built for texts, should be stretched, adapted into something adjacent, or declared simply inapplicable, and what a reporter is then entitled to write. The second is a study in which a classifier trained on waking viewing is applied to the seconds before subjects are woken from early sleep, reporting that broad object categories can be guessed above chance, with the verbal reports collected retrospectively after waking. The third is a piece I have already commissioned, and it is the one where I expect the protocol to tell me something I would rather not hear: it profiles a laboratory reporting stress-like activity in organoids, and the group leader has said in interview that he cannot rule out that something is felt. I would prefer to learn that from my own procedure than from a letter to the editor. The deliverable should be a numbered procedure with a plain-language rationale for each step, a shortened version suitable for our newsroom wiki, a flag on every step that is a judgement call wearing the clothes of a rule, and a closing section stating what the procedure cannot settle no matter how carefully it is followed. British English throughout, please.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **User Role:** Commissioning editor/writer for a monthly British ideas magazine (neuroscience/philosophy of mind focus).
      *   **Problem:** Two opposing complaints about recent coverage.
          1.  Philosophers: Too much weight given to introspective reports (treating "says" as "is").
          2.  Clinicians: Too much caution (treating "says" as "maybe nothing"), leading readers to think unresponsive patients have no inner life.
      *   **Proposed Solution:** A house protocol based on *heterophenomenology* (Dennett's framework).
      *   **User's Understanding of Heterophenomenology:** Treat reports as data/text, interpret provisionally, don't grant existence of described world initially, hold neutrality (accurate vs. confabulating vs. insincere).
      *   **Requirements:**
          *   Procedure for a reporter (no phil training) to run in <1 hour *before* commissioning.
          *   Explicit questions, sufficiency criteria, stopping points (fact about speech vs. fact about experience).
          *   Hand-off points to the editor (editorial values vs. method).
          *   Distinction between newsroom language and technical apparatus (Intentional Stance vs. Sincerity/Accuracy).
          *   Limits stated clearly (non-verbal subjects, neutrality bias, defense against first-person methodologists).
          *   **Test Cases:**
              1.  Cognitive Motor Dissociation (CMD)/fMRI command following (no text).
              2.  Dream decoding (classifier + retrospective report).
              3.  Cerebral organoids (no text, researcher speculation on feeling).
          *   **Deliverables:** Numbered procedure with rationale, shortened wiki version, flags for judgement calls, closing section on limitations.
          *   **Tone/Style:** British English, professional, precise, intellectually rigorous but practical.

  2.  **Deconstruct Heterophenomenology for a Newsroom:**

      *   *Core Concept:* The subject's *belief* about their experience is the primary datum. The *truth* of that experience is a secondary theoretical claim.
      *   *Translation:* "What they said" $\neq$ "What happened." But "What they said" is evidence *that* something happened (or they believe something happened).
      *   *User's Intuition:* Drop "Intentional Stance" (too technical), keep "Sincerity vs. Accuracy" (crucial).
      *   *Correction/Refinement:* The Intentional Stance is actually useful heuristically (treat them as rational agents), but maybe don't name it. The crucial distinction is indeed between the *report* (the text/signal) and the *referent* (the qualia/state).
      *   *The "Neutrality" Trap:* Heterophenomenology isn't scepticism; it's methodological agnosticism. It doesn't assume the subject is wrong, just that the report isn't self-verifying.

  3.  **Drafting the Protocol (Iterative Process):**

      *   *Goal:* A checklist for a journalist looking at a study/pitch.
      *   *Step 1: Identify the Datum.* What exactly is the evidence? (Text, scan, behaviour?)
      *   *Step 2: Assess the Link.* How do we get from Datum to Claim of Consciousness?
      *   *Step 3: Alternative Explanations.* Could this be automatic? Confabulation? Noise?
      *   *Step 4: The Verdict.* What can we actually write?

      *   *Refining the Steps for the User's Constraints:*
          *   Needs to be under an hour.
          *   Needs to distinguish "Fact about Speech" vs "Fact about Experience."
          *   Needs to handle non-verbal cases (fMRI, organoids).

      *   *Addressing the Test Cases during Drafting:*
          *   *Case 1 (fMRI CMD):* No text. The "report" is the BOLD signal interpreted as command following. Heterophenomenology usually requires a "text." We need to adapt: The "text" is the neural pattern *interpreted as* a report.
          *   *Case 2 (Dreams):* Text exists but is retrospective. Classifier adds a layer. Sincerity is likely high, Accuracy is the variable.
          *   *Case 3 (Organoids):* No text. Researcher is the proxy reporter. This is the danger zone. The researcher's "cannot rule out" is a report about *their uncertainty*, not the organoid's feeling.

  4.  **Developing the Specific Steps (The "Hourglass" Protocol):**

      *   *Phase 1: The Datum (15 mins).* Isolate the raw output.
      *   *Phase 2: The Bridge (15 mins).* How does the study move from output to mind?
      *   *Phase 3: The Rivals (15 mins).* What else explains the output?
      *   *Phase 4: The Headline Test (15 mins).* What claim is justified?

      *   *Crucial Distinction:* Sincerity (Did they mean it?) vs. Accuracy (Was it true?). In non-verbal cases, "Sincerity" translates to "Signal Integrity" (Was the scan noise?). "Accuracy" translates to "Interpretive Validity" (Does this scan *mean* tennis?).

  5.  **Addressing the "Newsroom Translation":**

      *   *Keep:* Sincerity/Accuracy distinction. The "Datum vs. Referent" distinction.
      *   *Drop:* "Intentional Stance," "Heterophenomenology" (use "Methodological Neutrality"), "Qualia."
      *   *Newsroom Terms:* "The Record" (what was said/measured) vs. "The Reality" (what was felt).

  6.  **Addressing the Limits & Objections:**

      *   *Non-verbal subjects:* The protocol must acknowledge that without a report, we are inferring a "virtual text." This increases uncertainty.
      *   *Neutrality:* It's not scepticism. It prevents both over-claiming (magical thinking) and under-claiming (behaviourism).
      *   *First-Person Defenders:* Acknowledge that this method prioritises public verifiability over private certainty. It's a journalistic safety rail, not a metaphysical truth.

  7.  **Running the Test Cases (Mental Simulation):**

      *   *CMD (fMRI):* Protocol asks "Where is the text?" Answer: "In the haemodynamic response." Protocol asks "Is the link direct?" Answer: "No, it's model-dependent." Verdict: Write about *detection of will*, not *presence of pain*.
      *   *Dreams:* Protocol asks "When was the report?" Answer: "After waking." Risk: Memory consolidation. Verdict: "Correlates of reported dream content," not "Decoding dreams."
      *   *Organoids:* Protocol asks "Who is the subject?" Answer: "The cells." "Who is reporting?" Answer: "The scientist." Verdict: "Scientists observe stress markers," NOT "Organoids feel stress." The scientist's speculation is a quote about *possibility*, not evidence of *fact*.

  8.  **Refining the Tone:**

      *   British English (colour, programme, centre, analyse).
      *   Professional, slightly academic but actionable.
      *   Respectful of the user's expertise but firm on the protocol.

  9.  **Final Review against Constraints:**

      *   Numbered procedure? Yes.
      *   Rationale for each step? Yes.
      *   Shortened wiki version? Yes.
      *   Flags for judgement calls? Yes.
      *   Closing section on limitations? Yes.
      *   Test cases integrated? Yes.
      *   Correction of user's understanding? (Need to gently correct that heterophenomenology *does* apply to non-verbal data if treated as 'text-equivalents', but the risk increases).

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on User's Understanding:* The user says "refuse at the outset to grant that what the report describes exists." This is correct. I need to reinforce that this applies to *non-verbal* signals too. A BOLD signal is a 'text' to be read.
      *   *Judgement Calls:* I need to highlight where the reporter stops and the editor starts. Usually, this is at the point of "Risk Tolerance."
      *   *Organoid Case:* This is the ethical minefield. The protocol must force the reporter to separate the *data* (calcium spikes) from the *interpretation* (stress/feeling).

  11. **Final Polish:** Check British spelling and ensure the distinction between "Commissioning" (pre-publication) and "Editing" (post-writing) is respected. The prompt asks for a *commissioning* tool.

  *(Self-Correction on the Organoid Case)*: The prompt says the group leader said "he cannot rule out that something is felt." The protocol needs to catch that this is a statement about *epistemic limits*, not *ontological fact*.

  *(Self-Correction on CMD Case)*: The prompt asks if the method should be stretched. I should argue it *must* be stretched but with a "hazard warning." The neural signal is the 'utterance'.

