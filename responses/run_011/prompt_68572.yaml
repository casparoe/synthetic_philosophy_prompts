  **The Principle and Its Clauses**
  1.  **"Specific, non-disjunctive underlying causal mechanism":** This clause forces the rejection of **Jade** (disjunctive mineralogy), **Tree** (convergent growth forms), **Fish** (paraphyletic grouping), **Schizophrenia** (heterogeneous etiologies), **Super-Earth** (size range without shared composition), and **Keystone Species** (functional role filled by heterogeneous mechanisms). It mandates the acceptance of **Gold** (atomic structure), **Gas Giant** (formation/structure mechanism), **Alzheimer's** (specific pathology), and **Stainless Grade** (specific alloy mechanism).
  2.  **"Stabilizes a cluster... supporting induction":** This clause distinguishes **Vitamin C** (specific molecule, ascorbate) from **Keystone Species** (abstract role); the former supports chemical/physiological inference, the latter only ecological inference contingent on context. It also rejects **Bacterial OTU** (arbitrary threshold) and **Weed** (no stable property cluster).
  3.  **"Regardless of historical origin":** This clause forces the acceptance of **C4 Photosynthesis**, **TIM Barrel**, **Prion Strains**, and **Ectomycorrhizal Fungi** despite polyphyly, resolving your tension with **Fish** and **Tree** by prioritizing mechanistic similarity over genealogy.
  4.  **"Regardless of human manufacture":** This clause validates **Polyethylene types** and **Steel Grades** as kinds, provided they meet the mechanistic criterion, distinguishing them from arbitrary commercial categories.

  **Casualties and Retractions**
  The best candidate principle cannot deliver consistency on your isotope and phase verdicts without modification. You must retract the following, ranked by priority:

  1.  **Carbon-12 and Carbon-14 are two kinds:** (Retract First).
      *   *Conflict:* Your acceptance of **Heavy Water** as **Water** contradicts splitting Carbon isotopes. Both involve isotopic substitution; both involve mass differences. If the mechanism is chemical bonding, both are one kind. If the mechanism is nuclear stability, both are two kinds.
      *   *Loss:* You lose the ability to treat nuclear properties as kind-constitutive in a general chemical context. You must treat "Carbon" as a chemical kind (uniting isotopes) and "Radionuclide" as a separate cross-cutting kind if nuclear decay is the relevant mechanism.
  2.  **The solitary and gregarious phases of a locust are two kinds:** (Retract Second).
      *   *Conflict:* You accept **Ring Species** as one kind despite end-point divergence, and **Prion Strains** as two kinds despite sequence identity. Locust phases are plastic states of one genome (like Ring Species continuity) but distinct physiologies (like Prions). Given your doubt ("which I expect is wrong"), align with **Ring Species**: phases are states of one kind, not kinds themselves.
      *   *Loss:* You lose the ability to treat phenotypic plasticity as kind-level divergence, forcing you to treat phases as transient states rather than stable kinds.
  3.  **Carvone Enantiomers are two kinds:** (Conditional Retract).
      *   *Conflict:* If Carbon isotopes are united (see #1), why split enantiomers? Only if the domain is biological reception (lock-and-key). If the domain is chemistry, they are one kind.
      *   *Loss:* You must explicitly relativize kindhood to the explanatory domain (chemistry vs. biology), admitting "kind" is not monolithic across all sciences.

  **Verdicts on New Cases**
  1.  **Size-defined material (shared behavior):** **Kind.** Unlike "Super-Earth," you stipulated the behavior is genuinely shared across chemistries due to a specific mechanism (e.g., quantum confinement). This fits the **C4 Photosynthesis** model: polyphyletic origin, unified mechanism.
  2.  **Lichen:** **Kind.** Like **Ectomycorrhizal Fungi**, this is a stable, reproducible functional unit assembled from distinct lineages. The mechanism is the symbiosis itself, not the genealogy of the partners.
  3.  **Glass:** **Kind.** Defined by the amorphous solid state mechanism (absence of crystalline order), analogous to **Diamond vs. Graphite**. It is a distinct state of matter with stable properties, not merely a lack of something.
  4.  **"Planet" (IAU dynamical definition):** **Not a Kind.** Like **Super-Earth** and **Bacterial OTU**, this turns on a threshold (clearing the orbit) applied to a continuum. There is no sharp mechanistic discontinuity between a dwarf planet and a planet comparable to the discontinuity between **Gas Giants** and **Super-Earths**.

  **Metaphysical Status**
  Yes, this principle makes kindhood a matter of degree and interest-relative. The "mechanism" must be selected by the inquirer (e.g., nuclear vs. chemical for Carbon), and the "cluster" of properties need only be stable enough for the intended induction. The word "natural" still does work: it restricts kinds to categories grounded in mind-independent causal structures (mechanisms) rather than mere human convention (like "things on my desk" or "Super-Earth" size ranges). However, your case base shows that scientists maintain many useful classificatory schemes of different kinds, none privileged absolutely; "natural kind" is not a binary status bestowed by nature, but a measure of how well a human carve-up tracks a causal joint.
