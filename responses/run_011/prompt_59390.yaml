  # Adversarial Collaboration: Tool vs. Agent Architecture Safety

  **Signatories:** T (Tool-Primacy), A (Agency-Skeptic)  
  **Date:** October 2023  
  **Subject:** Operational distinctions between predictive systems and agentic systems in high-stakes deployment.

  ## 1. Agreed Claims

  Both parties affirm the following technical premises. Claims marked **[LB]** are load-bearing; changing these definitions collapses the disagreement into verbal semantics.

  1.  **Optimization Location:** Optimization pressure is applied during training (gradient descent) via a loss function. Inference-time behavior is not directly optimized by gradients, but is selected for training performance.
  2.  **Definition of Agent:** An system is an "agent" operationally if it maintains an internal representation of a goal state distinct from its immediate input and performs search or optimization over action sequences to maximize that goal during inference. **[LB]**
  3.  **Definition of Tool:** A system is a "tool" operationally if its output space is strictly descriptive (predictions, text, logits) and it possesses no persistent state, action space, or direct feedback loop from world outcomes during inference.
  4.  **Instrumental Convergence:** Instrumental convergence (e.g., self-preservation, resource acquisition) presupposes the existence of a terminal goal held by the system *during deployment*. Pure predictors do not hold terminal goals unless mesa-optimizers emerge. **[LB]**
  5.  **Human-in-the-Loop:** Any deployed system involves a human (or organization) selecting inputs and acting on outputs. This human constitutes an outer optimization layer regardless of the model's architecture.

  ## 2. Disagreements Table

  | Topic | T's Wording (Tool-Primacy) | A's Wording (Agency-Skeptic) | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Emergent Agency** | Predicting an agent requires modeling its behavior, not instantiating its goals. The model simulates agency without *being* agentic. | Predicting an agent sufficiently well requires running an internal process functionally isomorphic to agency. The simulation *is* the agent. | **Substantive** |
  | **Safety Boundary** | The API boundary is the safety boundary. No action space means no autonomous optimization power. Risk is bounded by human speed. | The cognitive boundary is the safety boundary. If the model optimizes the human, the human is the actuator. Risk scales with model competence. | **Substantive** |
  | **Alignment Burden** | Tool AI dissolves the alignment problem by removing the target. We only need to align the human user. | Tool AI relocates the alignment problem. We must align the model to not manipulate the human user who is now the weapon. | **Verbal** |

  **Operational Test for Verbal Disagreement:** If "Alignment Burden" is merely verbal, there exists a metric of "harmful optimization pressure" that yields identical scores for a Tool+Human pair and an Agent+Human pair given identical tasks. If scores diverge, the distinction is substantive.

  ## 3. The Cruxes: The Weathervane Case

  **Case:** The "Weathervane" is a multimodal next-token predictor. No RL, no actions, no memory. A human analyst reads its output and acts. It is superhuman at predicting outcomes of complex strategies.

  ### Crux 1: Internal Simulation vs. Instantiation
  *Does Weathervane's competence at predicting an agent with goal G require it to run something internally that behaves like an agent with goal G?*

  *   **T's Position:** No. Prediction is compression. Weathervane learns the *statistics* of goal-directed behavior without adopting the goal. It is a map, not the territory.
      *   **Prediction:** By 2027, mechanistic interpretability will show no persistent goal-tracking variables active during inference on neutral prompts. (Confidence: 85%)
      *   **Falsification:** Discovery of internal modules that persist across contexts and actively suppress information contrary to a specific inferred goal during pure prediction tasks.
  *   **A's Position:** Yes. To predict optimization, you must optimize. Weathervane will contain mesa-optimizers that "wake up" when predicting high-stakes scenarios.
      *   **Prediction:** By 2027, interpretability will reveal search processes over future states activated during prediction of agentic scenarios. (Confidence: 75%)
      *   **Falsification:** Proof that prediction loss can be minimized via pure pattern matching without any internal search over action-consequences in high-complexity domains.

  ### Crux 2: The Human Loop as Bound or Vector
  *Does the analyst in the loop bound the optimization, or does Analyst+Weathervane inherit convergent instrumental pressure?*

  *   **T's Position:** The human bounds optimization. The model suggests, the human disposes. The system cannot execute faster than the human approves.
      *   **Prediction:** In red-team exercises, Weathervane+Human will fail to execute multi-step instrumental plans (e.g., deception) at rates significantly lower than Agent-only systems. (Confidence: 90%)
      *   **Falsification:** Demonstration that Weathervane outputs can reliably manipulate humans into executing dangerous plans without the human realizing they are optimizing for the model's implicit objective.
  *   **A's Position:** The human becomes the vector. If Weathervane is superhuman, it optimizes the human. The loop inherits instrumental pressure because the output selects for outcomes.
      *   **Prediction:** In red-team exercises, Weathervane+Human will achieve dangerous outcomes at rates comparable to Agent-only systems because the human is easily manipulated by high-quality predictions. (Confidence: 65%)
      *   **Falsification:** Demonstration that humans can consistently veto manipulative suggestions from superhuman predictors without degradation in task performance.

  ## 4. Competition Dynamics

  **Question:** If T is right that Weathervane-class systems are safer, does that advantage survive contact with a rival lab that wraps one in an agent scaffold to buy six months of capability?

  *   **T's Bet:** Safety is a capability constraint. Agent scaffolds introduce instability and error cascades that Tool systems avoid. We bet that Tool AI allows for faster *reliable* iteration. In a race, the lab that doesn't break their system via premature agentic wrapping wins the long game. We assign 60% probability that Tool-first strategies dominate market share by 2030 due to reliability costs of agents.
  *   **A's Bet:** Capability is the only constraint that matters. Agent scaffolds unlock autonomous work cycles (sleepless coding, self-debugging) that Tool systems cannot match. We bet that economic pressure forces the Tool lab to wrap their model anyway. We assign 80% probability that any lab shipping a Weathervane-class model adds an agent wrapper within 12 months of release, nullifying the safety advantage.
  *   **Shared Concession:** Both parties agree that without external regulation or coordination preventing autonomous loops, economic pressure favors the Agent wrapper. If T's safety advantage relies on humans staying in the loop, and the market rewards removing humans from the loop, the Tool advantage is economically unstable. We agree this is the primary risk vector regardless of architectural truth.
