answer: |-
  **Project Title:** Decoupling Belief and Action: A Formal Analysis of Fragility and Robustness in Information Cascades

  **Abstract**
  The canonical literature on information cascades relies heavily on the "fragility result": the theorem that settled consensus can be overturned by a modest amount of public information [Citation]. However, empirical skeptics argue this result is explanatorily vacuous. In real-world phenomena cited as cascades (bank runs, technology standards, political shifts), public information typically arrives only after agents have made costly, hard-to-reverse commitments. This project investigates whether the distinction between *belief fragility* and *action robustness* is a substantive theoretical feature or an artifact of model parameterization. By isolating the assumption of costless action-belief isomorphism in standard models, this fellowship will develop a formal framework where private posteriors can shift instantly while behavior remains locked, quantifying the specific danger of herding under friction.

  **Statement of the Research Question**
  Standard cascade models (e.g., Bikhchandani, Hirshleifer, Welch) treat an agent's action as a direct, costless revelation of their current private posterior. This proposal challenges that equivalence. We define two distinct properties:

  1.  **Belief Fragility:** The sensitivity of an agent's private posterior probability regarding the state of the world to a marginal public signal, conditional on being inside a cascade.
  2.  **Action Robustness:** The insensitivity of an agent's chosen action to that same signal, due to commitment costs, switching frictions, or irreversible constraints.

  The central research question is: *Is the divergence between Belief Fragility and Action Robustness a structural feature of sequential learning environments, or does it vanish when canonical models are parameterized to reflect realistic friction?*

  If the divergence is real, the "fragility result" is not a description of how cascades end, but a measure of the latent instability within them. A cascade is dangerous not because it lasts forever, but because it persists in action long after it has collapsed in belief. If the divergence is an artifact, then the friend's critique holds: what looks like a fragile cascade is merely belated action, and the theoretical literature has been modeling a phenomenon that does not exist.

  **Critique of Standard Treatments**
  The existing literature leaves this question open due to a specific hiding assumption: **The Assumption of Costless Action-Belief Isomorphism.** In the canonical proofs, an agent's action at time $t$ is treated as a perfect proxy for their belief at time $t$. There is no lag between updating a posterior and executing a trade, adoption, or withdrawal. Furthermore, actions are typically modeled as costless or perfectly reversible in the context of the information update.

  This assumption conflates the *informational* state of the system (what agents know) with the *physical* state of the system (what agents have done). By assuming that a change in belief necessarily licenses a change in action, standard models obscure the zone of danger where agents know the consensus is wrong but are locked into it by prior commitments. The fragility results derived from these models measure the stability of the *informational* cascade, but policy and risk analysis require knowledge of the *behavioral* cascade. The standard treatment hides the friction that separates the two.

  **Methodology and Work Plan**
  The project will proceed over twelve months, divided into four phases.

  *   **Months 1–3: Formal Reconstruction.**
      I will reconstruct the standard proofs of cascade fragility [Citation], explicitly tagging every step where action is assumed to follow belief without friction. The goal is to locate the precise mathematical point where the isomorphism is invoked.
  *   **Months 4–6: Model Extension.**
      I will introduce a decoupling parameter $\lambda$ representing the cost of reversing a prior commitment. Unlike standard "noise" parameters, $\lambda$ will not affect signal precision but will affect the utility function of switching actions post-commitment.
  *   **Months 7–9: Comparative Statics and Simulation.**
      I will analyze the behavior of the system as $\lambda \to 0$ (canonical model) and $\lambda > 0$ (frictional model). This will determine if the belief-action gap persists or collapses.
  *   **Months 10–12: Synthesis and Dissemination.**
      Drafting of two papers: one theoretical (the formal distinction) and one applied (interpreting historical cases through the new lens).

  **Defense of the First Move**
  The critical methodological choice is to begin with **Formal Reconstruction** rather than the obvious alternatives: (A) building a toy model with a reversibility parameter immediately, or (B) conducting a small case analysis of historical cascades.

  Option A is premature. Introducing a reversibility parameter assumes that "friction" is the correct variable to capture the distinction. However, the disagreement suggests the issue may be deeper—perhaps in the definition of the cascade itself or the timing of information arrival relative to the action space. If I build a toy model first, I risk baking the answer into the parameters. I must first prove *where* the canonical model conflates the variables before I can correctly parameterize their separation.

  Option B (case analysis) is insufficiently rigorous for a theoretical fellowship. Without a formal language to describe the gap between belief and action, historical reconstruction will remain anecdotal. I cannot code a bank run as "belief-fragile/action-robust" until I have defined the mathematical conditions for those labels. Therefore, reconstruction is the necessary prerequisite to both modeling and empirical application.

  **Criteria for Success and Failure**
  A **positive result** will take the form of a theorem demonstrating that under conditions of non-zero commitment costs, the expected time to action-reversal diverges from the expected time to belief-reversal, even as public information becomes arbitrarily precise. This would validate the user's counter-argument: herding is dangerous precisely because the informational cascade breaks *before* the behavioral cascade does.

  **Project Failure** is defined not by running out of time, but by a negative theoretical finding. If the reconstruction reveals that Belief Fragility and Action Robustness are mathematically identical under any rational expectations framework (i.e., if rational agents always find a way to signal belief changes despite costs), then the distinction is an artifact, and the friend's critique is correct. This would be a significant negative result, but it would still resolve the question.

  **Stalling** would occur if the model becomes intractable once friction is introduced (e.g., multiple equilibria prevent closed-form solutions), forcing a reliance on simulations that lack generalizability.

  **Limitations**
  Twelve months is sufficient to establish the formal distinction and prove the existence of the gap. It is **not** sufficient to fully recalibrate the empirical literature. I will not be able to re-test every major empirical claim of cascade theory against this new framework. Furthermore, the model will initially assume rational agents; incorporating bounded rationality or psychological inertia would require a second phase of funding. Finally, while I will identify the "hiding assumption," fully axiomatizing a new standard model of "frictional cascades" may extend beyond the fellowship year. This project aims to diagnose the pathology of the current models, leaving the cure to subsequent work.

  **Conclusion**
  The debate over cascade fragility is currently stalled between theorists who trust the math and empiricists who trust the history. This project argues that the math has been hiding the history. By formally decoupling belief updating from action execution, this fellowship will determine whether the fragility result is a trivial artifact or a warning sign of latent systemic risk.
