          *   **Synchrony:** EGT often assumes logical rounds (stage games). DS distinguishes Sync/Async. FLP shows Async breaks things EGT assumes hold (like reaching a specific equilibrium outcome).
          *   **Belief vs. Knowledge:** DS usually deals with S5 knowledge (factive, true). EGT deals with Belief (can be false). DS *can* model belief (using Kripke structures without truth axiom), but standard DS courses focus on safety/liveness (truth).

      *   *(c) No Counterpart (The Residue):*
          *   **Common Prior:** DS has no native concept of a "global probability distribution over initial states" that is *known* to be shared without explicit initialization protocol.
          *   **Expected Utility Maximization:** DS optimizes for worst-case (Byzantine) or average-case (performance), but not "Utility" in the von Neumann-Morgenstern sense per process.
          *   **Counterfactual Reasoning:** EGT asks "What would you do if...?" DS asks "What *did* you do given this log?"

  6.  **Step 4: Taking a Position on the Residue:**
      *   Is DS missing something, or is EGT confused?
      *   *Argument:* EGT's residue (Common Prior, CKR) often hides the *complexity of coordination*. DS exposes the cost. The "confusion" in EGT is often a abstraction of the communication cost.
      *   *However:* DS is often too pessimistic (worst-case). EGT captures *why* agents coordinate (incentives).
      *   *Verdict:* The residue exists because EGT assumes the *result* of a distributed setup protocol (the prior, the rationality commitment) as an axiom. DS treats setup as part of the system. The "confusion" is treating a distributed bootstrapping problem as a static state property.
      *   *Specific Call:* The Common Prior is the biggest offender. It's a "Trusted Setup" assumption in DS terms. If you don't have a trusted setup, you can't have a Common Prior. Aumann's result holds *if* you have the setup. DS asks "How do you get the setup?"

