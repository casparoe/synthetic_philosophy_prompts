          *   *Synchrony/FLP:* CKR often implies backward induction solutions. In DS, asynchronous consensus with 1 crash is impossible (FLP). If "Rational" implies "Will agree if possible," DS says "You can't guarantee that state is reachable."
          *   *Stipulation:* EGT assumes the *computation* of the equilibrium is free/instant. DS treats computation and communication as costs/constraints.
      *   **Common Prior Assumption (CPA):**
          *   *EGT:* All players start with the same prior probability distribution over $\Omega$, updated via Bayes rule.
          *   *DS:* Processes start with initial states. There is no requirement that initial states are sampled from a shared distribution known to all.
          *   *Translation:* Shared Random Seed? Probabilistic Protocol?
          *   *The Friction:* In DS, initial state is local. In EGT, the prior is global truth. Aumann's "Agreeing to Disagree" relies heavily on CPA.
          *   *Impossibility:* In DS, you cannot establish a common prior in an asynchronous network without communication (which takes time and might fail). EGT stipulates it exists at $t=-\infty$.

