answer: |-
  Here is the sorting of the six frameworks into tiers based on your criterion: the preservation of the classical optimization engine versus its structural replacement.

  ### Tier 1: Optimization with Frictions (The "Change of Variables" Tier)
  *These frameworks treat boundedness as a constraint within the objective function, leaving the maximization engine intact.*

  **1. Radner's cost of information and computation**
  *   **Score:** 0.95
  *   **Justification:** This is classical optimization with an added cost term for thinking; the agent still maximizes net utility, merely acknowledging that calculation consumes resources.
  *   **Placement:** Tier 1.

  **2. Rational Inattention (Sims)**
  *   **Score:** 0.90
  *   **Justification:** The agent optimizes the allocation of a limited information channel (Shannon capacity), preserving the maximization structure while constraining the input flow.
  *   **Placement:** Tier 1.

  ### Tier 2: Procedural Rationality (The "Hybrid" Tier)
  *These frameworks replace the global maximizer with a specific procedure, though the procedure can sometimes be derived as optimal under specific constraints.*

  **3. Simon's aspiration-level satisficing and sequential search**
  *   **Score:** 0.55
  *   **Justification:** Simon explicitly replaced "maximizing" with "satisficing," yet sequential search can often be mathematically recast as an optimal stopping problem, blurring the line between procedure and optimization.
  *   **Placement:** Tier 2.

  **4. Rubinstein's finite automata and games of bounded reasoning**
  *   **Score:** 0.45
  *   **Justification:** Agents are modeled as state machines with complexity costs, which structurally limits reasoning depth, though one can still view the choice of automaton as an *ex ante* optimization.
  *   **Placement:** Tier 2.

  ### Tier 3: Structural Replacement (The "New Physics" Tier)
  *These frameworks argue that optimization is either descriptively false or normatively wrong, requiring a new definition of rationality.*

  **5. The heuristics-and-biases programme (Kahneman and Tversky)**
  *   **Score:** 0.20
  *   **Justification:** Optimization serves only as the null hypothesis to be rejected by empirical data showing systematic deviations (biases), offering an error theory rather than a new rational structure.
  *   **Placement:** Tier 3.

  **6. Gigerenzer's fast-and-frugal heuristics and ecological rationality**
  *   **Score:** 0.10
  *   **Justification:** This framework posits that rationality is not internal consistency (optimization) but ecological fit, rendering the optimization metric itself obsolete rather than merely constrained.
  *   **Placement:** Tier 3.

  ***

  ### On Redundancy: Radner vs. Rational Inattention
  To a physicist, **Radner's approach and Rational Inattention are effectively one idea written in different notation.** Both embed the limitation (computation cost vs. information channel capacity) directly into the constraint set of a maximization problem. In both cases, the "boundedness" is handled by adding a Lagrange multiplier or a cost term to the utility function; the fundamental variational principle remains untouched. The distinction is preserved in the literature only because economists treat "computation time" and "information entropy" as distinct economic goods, but mathematically, they are both constrained optimization problems.

  ### The Most Intellectually Consequential Framework
  For a physicist seeking a genuine revision of what we mean by rational choice, rather than a change of variables in the same equation, **Gigerenzer's Ecological Rationality** is the most consequential.

  While Kahneman and Tversky document that humans fail at optimization, they retain optimization as the normative gold standard (i.e., the biases are "errors"). Gigerenzer, conversely, argues that optimization is biologically implausible and ecologically unnecessary; he changes the **order parameter** of the system from *internal consistency* to *environmental fit*. This forces a revision of the definition of rationality itself, moving from a universal calculus to a context-dependent adaptation, which is a structural phase change rather than a perturbation of the classical model.
