  Verdict: Integrated Survival Utility | drop 4, 7 | floor rule survives: no

  ### The Diagnosis
  You are not using Buchak's Risk-Weighted Expected Utility (REU). Buchak's theory posits a **global** probability weighting function $r(p)$ that is invariant to the outcomes themselves; it distorts the probability of "at least this good" based purely on rank. Your "Floor Rule" explicitly makes the weighting dependent on the *absolute value* of the outcome relative to $F$.

  Flatly: **Your Floor Rule is Reference-Dependent Utility (Prospect Theory) with a fixed subsistence reference point, not Probability Weighting.** You *are* shoving risk attitude into the utility function, specifically as a discontinuity or extreme convexity at $F$. This matters because REU preserves First-Order Stochastic Dominance (FOSD) in ways Reference-Dependent models do not. By claiming you are doing weighting, you claim a normative immunity to certain Dutch Books that you do not actually possess.

  ### The Principle: Integrated Survival Utility (ISU)
  Adopt **Integrated Survival Utility**. It treats survival as a lexicographic constraint on standard Expected Utility, with full asset integration.

  **Clause 1: The Survival Constraint (Lexicographic Priority)**
  Maximize the probability that lifetime wealth/consumption remains above $F$. No amount of expected value above $F$ compensates for a non-zero increase in the probability of falling below $F$, unless that risk is necessary to avoid a *certain* fall below $F$.
  *   *Motivating Cases:* **1, 2, 5.** You pay premiums exceeding expected loss because the utility of falling below $F$ (furnace breaks, medical bill) is effectively infinite compared to the utility of the premium cost.

  **Clause 2: Full Asset Integration (Fungibility)**
  Money is fungible across all "pots," accounts, and mental ledgers. Risk is calculated on *total net worth* and *liquidity access*, not segregated buckets. A loss in "inheritance" is a loss in "buffer."
  *   *Motivating Cases:* **4, 5.** This clause forces consistency between these two. If losing the $9,000 threatens $F$ in Case 5, it threatens $F$ in Case 4, regardless of the mental label.

  **Clause 3: Variance and Correlation Sensitivity**
  Risk assessment must account for the variance of the aggregate portfolio and the correlation of the risk with systemic failures. Idiosyncratic risks should be insured/transferred; systemic risks must be mitigated via infrastructure or diversification.
  *   *Motivating Cases:* **6, 7.** Explains why 100 flips are acceptable (variance dilution) and why the levee (systemic mitigation) is preferred over vehicle insurance (idiosyncratic transfer), provided the deductible is affordable.

  ### Resolving Your Conflicts

  **Case 6 (The Bundle):**
  Your verdict (reject single, accept bundle) is **correct** under ISU.
  *   *Reasoning:* A single flip has a 50% chance of -$10,000. If that loss pushes you toward $F$, the marginal disutility is high. The bundle of 100 flips has an expected value of +$50,000 with a standard deviation of ~$10,000. The probability of a net loss becomes negligible. The bundle effectively guarantees you stay above $F$, satisfying Clause 1. This is not a contradiction; it is variance reduction.

  **Case 7 (The Levee vs. The Neighbor):**
  Your verdict on the levee is **correct**; your verdict on the neighbor is **wrong**.
