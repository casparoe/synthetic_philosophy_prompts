answer: |-
  1. Provide each of the 12 pairs with sealed envelopes containing preference cards over four outcomes regarding shared music genre and volume, plus 20 colored chips, and equip the room with a central board for aggregating the class's single social ranking using magnetic strips.
  2. Assign half the students preferences where they desire their partner's music choice to be Classical regardless of their own, and half where they desire it to be Jazz, ensuring each player cares deeply about their partner's choice; award 3 tokens for your top outcome, 2 for second, 1 for third, and 0 for last, payable only if the class consensus matches your private rank.
  3. In Phase 1, declare that each student dictates the ranking of outcomes differing only by their own music choice, while the class must agree on a global ranking that respects everyone's unanimous preferences; in Phase 2, allow students to publicly sign waivers trading their decisive rights for tokens before the final ranking is voted on.
  4. Highlight how Phase 1's deadlock illustrates the clash between the Liberal Condition and the Pareto Principle within Sen's theorem, then show how Phase 2 trades often shift the cycle rather than resolve it because preferences over rights differ from preferences over outcomes; emphasize that waivability fails when the act of waiving itself becomes a contested outcome within the preference ordering.
  5. Anticipate collusion by monitoring pairs, prevent randomization by enforcing strict ordinal submission, and ensure conflict visibility by pre-selecting specific pairs to highlight the cycle; note that the game demonstrates only a single conflicting profile rather than the general proof that no system avoids this conflict, requiring you to verbally explain that no rule can satisfy these conditions for all possible preferences.
