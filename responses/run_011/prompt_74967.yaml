      **TO:** Landmarks Commission
      **FROM:** [Your Name]
      **DATE:** [Current Date]
      **SUBJECT:** Decision Memo: Market Hall COA & Ordinance Standards

      **Recommendation**
      I recommend we **deny the current Certificate of Appropriateness (COA)** and simultaneously **initiate de-designation proceedings** for the Market Hall.

      This approach resolves the immediate impasse without compromising the Commission's integrity. Approving the COA as submitted validates the replacement of the remaining character-defining features (the timber frame) with steel, effectively erasing the basis of the 1988 designation. Denying it outright without a pathway leaves the owner with an uninsurable asset. De-designation acknowledges the reality staff presented: roughly 70% of original fabric is gone. Once de-designated, the owner may proceed with safety upgrades without our constraint, satisfying her insurance deadline.

      **The Cumulative Threshold**
      We are facing a classic Sorites paradox ("heap paradox"): no single prior approval crossed the line, yet the sum has. **[Settled Practice]** In preservation law, commissions are not bound by prior approvals when assessing current integrity. Each application is judged on the structure's status *at the time of application*. The fact that six prior commissions approved like-for-like repairs does not commit us to approve a fundamental material change now. Those earlier decisions were correct based on the fabric existing *then*; this request is different because it addresses the *remaining* primary fabric.

      The ordinance requires the structure to "substantially retain" original materials. **[Contested Issue]** There is no consensus on what percentage constitutes "substantial." Some jurisdictions argue integrity is lost when character-defining features are compromised, regardless of percentage. Others look for a majority retention. However, **[Settled Practice]** when the primary structural system (the timber frame) is replaced with a different material (steel), most commissions consider the design basis lost, even if cladding remains.

      **The Owner's Position**
      We must give the owner's position its full weight. She purchased the building in 2020, inheriting the cumulative attrition caused by predecessors. She is not attempting to circumvent landmarks law; she is responding to an insurer's refusal to cover a structure deemed unsafe. **[Settled Practice]** Landmarks commissions cannot mandate owners maintain unsafe buildings. If the timber frame cannot be reinforced to meet code, safety trumps preservation. However, **[Settled Practice]** safety requirements do not automatically mandate total replacement; independent verification is standard.

      By initiating de-designation, we acknowledge that the building no longer meets the criteria for protection. This releases the owner from the regulatory burden while allowing us to vote honestly that the landmark status is no longer valid. It avoids the hypocrisy of approving the destruction of a landmark while pretending it remains one.

      **The Proposed 40% Trigger**
      Regarding the spring motion to add a bright-line trigger (e.g., "replacement of >40% requires review"): **[Contested Issue]** This is not settled practice. While bright-line rules offer clarity, they often relocate the problem rather than solve it.

      First, a percentage threshold invites disputes over measurement rather than significance. Owners may argue over whether a beam counts as "original fabric" to stay under the line. Second, it assumes all fabric is equal. Replacing 40% of non-character-defining floor joists is less significant than replacing 10% of a unique facade. **[Contested Issue]** National standards generally advise against rigid numerical thresholds for integrity, favoring qualitative assessment of "character-defining features."

      If we adopt a number, we must accept that replacement *under* that number becomes effectively as-of-right, potentially accelerating loss below the threshold. I recommend we defer the 40% motion and instead refine our guidelines to define "character-defining features" more clearly. This maintains flexibility while giving staff and owners better predictability than a raw percentage.

      **Conclusion**
      We are not responsible for the past six approvals, but we are responsible for this one. We cannot approve the erasure of the Market Hall's designation basis while keeping it on the register.

      **Motion:** Deny the COA for steel replacement and gallery removal.
      **Secondary Motion:** Direct staff to prepare a notice of intent to de-designate based on loss of integrity, effective immediately upon adoption.

      This gives the owner certainty to insure and rebuild, and it keeps our ordinance meaningful.

