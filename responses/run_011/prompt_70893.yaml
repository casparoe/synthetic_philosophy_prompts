prompt: |-
  I run the simulation side of a last-mile grocery delivery company — a few hundred vans, six micro-fulfillment sites. Somewhere along the line I ended up chairing what we call model review: a 45-minute meeting where somebody presents a sim and the room decides whether leadership is allowed to use its output for a real decision (open a site, change staffing ratios, switch routing vendors). We do maybe eight of these a year, the decisions behind them run from about $150k to a couple million, I sign off jointly with our director of ops, and the room is usually two engineers, one ops manager who has never looked at code, and somebody from finance.

  The fight is the same every single time. An engineer says an assumption is unrealistic — pickers in the sim never take an unscheduled break, travel times are a fixed average, customers always accept the first delivery slot we offer. And the person who built the model answers that assumptions don't have to be realistic, only the predictions do, and waves at Milton Friedman's old methodology essay, the one where he argues that the more significant a theory is the more unrealistic its assumptions tend to be because it's abstracting away from a bunch of detail. I've heard people call that move the F-twist. Meanwhile the ops manager objects that "that's just not how a picker behaves," which I'm pretty sure is a different and weaker complaint, but I can't say why in a way that lands in a meeting.

  I have no philosophy or econ training, so I need you to build me the actual procedure. Give me an ordered set of questions I can run on any unrealistic assumption during those 45 minutes: what a sufficient answer to each one sounds like, which answers should make me stop and say the model can't be used for this decision, and which steps are really me making a judgment call that's dressed up as procedure. It should separate the different jobs an unrealistic assumption can be doing — I have a fuzzy sense that "we dropped X because X barely moves the output" and "we only claim this holds where X is true" aren't the same move, and that Friedman's argument doesn't cover both. And it has to tell me how to turn "it predicts well" into something I can actually check in the room without rerunning anything: we can require sensitivity runs beforhand, but not new experiments during the review. Don't send me to papers or a reading list, I won't read them, put whatever's needed inline. If I've got Friedman backwards anywhere above, just say so.

  Then run it on three real ones from our queue:

  1. Staffing model for a site we're opening. Assumes pickers are on-task for the whole shift — no unscheduled breaks, no call-outs. Validated against three weeks of pick-rate data from our busiest existing site; matches total picks-per-shift within 4%. Decision on the table: how many pickers to hire for opening month.

  2. Routing comparison that assumes drivers take the shortest-time path and always find parking. It reproduces our actual delivery-time distribution across 40 days in two different metros. Decision: pick between two routing vendors.

  3. The one I expect to lose. A whole-network sim I built myself for the site-selection decision. Deterministic average travel times, historical weekly average demand, and the parameters were tuned on the same 18 months of data we then used to confirm that it predicts well. It says site #4 is worth $1.9M over three years and it's already in a deck I sent up.

  For case 3 don't soften it — if the procedure says the number can't carry the decision, I'd rather find out from you now.

  Last two things: tell me where this procedure will misfire, i.e. the kinds of model or assumption it gives a confident wrong answer on and what I should do instead in those cases, and give me a one-line verdict format I can paste into the review doc, something like usable for X / not usable for X / needs Y first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Runs simulation side of a last-mile grocery delivery company (few hundred vans, six micro-fulfillment sites). Chairs "model review" meetings (45 mins, 8/year).
      *   **Stakeholders:** User + Director of Ops (sign off), 2 engineers, 1 ops manager (non-technical), 1 finance person.
      *   **The Conflict:** Engineers attack unrealistic assumptions (Friedman's "F-twist" defense vs. ops reality). Ops manager objects based on intuition ("that's not how pickers behave").
      *   **The Need:** A concrete, ordered procedure (set of questions) to evaluate unrealistic assumptions during the meeting. Needs to distinguish between *types* of unrealistic assumptions (negligible impact vs. boundary conditions). Needs to verify "predicts well" without rerunning.
      *   **Constraints:** No reading lists, inline explanations, correct any misunderstandings about Friedman, apply to 3 specific cases (be harsh on Case 3), identify failure modes of the procedure, provide a one-line verdict format.
      *   **Tone:** Professional, direct, operational, pragmatic. No academic fluff.

  2.  **Deconstruct the "Friedman Twist" (F-Twist):**
      *   *User's Understanding:* "Assumptions don't have to be realistic, only predictions."
      *   *Reality:* Friedman argued that assumptions are *descriptive* falsehoods but *analytical* truths for the specific mechanism being isolated. However, in simulation (especially agent-based or discrete event), "unrealistic assumptions" often break causal mechanisms, not just descriptive details.
      *   *Correction:* Friedman's argument works for *equilibrium outcomes* in economics, not necessarily for *process simulations* (like staffing or routing) where the *path* matters as much as the destination. If the mechanism is wrong, the prediction might be right by luck (overfitting) and fail under intervention (Lucas Critique).
      *   *Key Distinction:* Is the assumption *irrelevant* (noise) or is it *structural* (mechanism)?

  3.  **Develop the Procedure (The "Assumption Stress Test"):**
      *   Goal: Move from "Is it true?" to "Does it matter for *this* decision?"
      *   Step 1: **Mechanism Check.** Is the assumption hiding a feedback loop? (e.g., tired pickers make mistakes -> rework -> slower picking).
      *   Step 2: **Sensitivity/Range Check.** Did they test what happens if the assumption breaks? (e.g., what if break rate is 10%?).
      *   Step 3: **Out-of-Sample/Intervention Check.** Does it predict *changes* or just *status quo*? (Crucial for Friedman critique).
      *   Step 4: **Decision Boundary Check.** Is the recommendation robust to the error margin? (e.g., if cost is $1.9M +/- $500k, does the decision change?).

  4.  **Drafting the Questions (Iterative Refinement):**
      *   *Q1:* What causal chain does this assumption cut? (If it cuts a feedback loop, fail).
      *   *Q2:* What is the "break-even" violation? (How much unrealism before the decision flips?).
      *   *Q3:* Was the validation done on the *same* conditions as the decision? (If tuning data = test data, fail).
      *   *Q4:* Is the output a point estimate or a distribution? (Need risk assessment).

      *Refining for the Meeting Context:* Needs to be answerable in 45 mins.
      *   *Question 1 (The Mechanism):* "Does this assumption remove a feedback loop that the decision triggers?"
      *   *Question 2 (The Sensitivity):* "Show me the tornado chart or elasticity. How much does the output move if we relax this assumption by 10%?"
      *   *Question 3 (The Validation):* "Did you validate on *interventions* or just *observations*?" (Crucial for Friedman).
      *   *Question 4 (The Margin):* "Is the signal larger than the noise introduced by this assumption?"

  5.  **Applying to the Three Cases:**

      *   **Case 1 (Staffing/Breaks):**
          *   Assumption: No breaks/call-outs.
          *   Validation: 3 weeks, busiest site, matches total picks.
          *   Analysis: This is a capacity planning decision. Breaks directly reduce capacity. Validating on "total picks" matches *output* but hides *constraint*. If they validated on a site that *already* had breaks but modeled *no* breaks, the model is implicitly calibrating pick speed to absorb the break time.
          *   Verdict: Risky. If they calibrated pick speed to include break time, it's okay. If they used theoretical max speed, it's dangerous.
          *   *Correction:* The prompt says "Validated against... data... matches total picks." If the real data *includes* breaks and the model *excludes* breaks but matches the total, the model's "pick rate" is effectively an "effective pick rate."
          *   *Wait, check the logic:* If Real = 100 picks (with breaks) and Model = 100 picks (no breaks), the Model's picker is slower than a theoretical max picker. The assumption "no breaks" is mathematically equivalent to "slower speed."
          *   *Risk:* Call-outs are stochastic. Averages hide variance. Staffing for *average* demand leads to service level failures.
          *   *Verdict:* Usable for budget, Not usable for service level guarantees. Needs variance check.

      *   **Case 2 (Routing/Parking):**
          *   Assumption: Shortest time, always park.
          *   Validation: Reproduces delivery-time distribution (40 days, 2 metros).
          *   Decision: Pick vendor.
          *   Analysis: Routing vendors *also* assume perfect parking usually. If both vendors operate in the same reality, the *relative* difference might be preserved even if the *absolute* time is wrong.
          *   *Friedman Check:* The assumption is "descriptively false" but "predictively accurate" for the *difference* between vendors.
          *   *Risk:* If Vendor A routes through tight streets (parking hard) and Vendor B uses main roads, the assumption hurts Vendor A more.
          *   *Verdict:* Usable *if* the validation covers the specific geos of the decision.

      *   **Case 3 (Network/Site Selection - User's Model):**
          *   Assumption: Deterministic travel, avg demand, tuned on same 18 months used for confirmation.
          *   Decision: $1.9M value, already in deck.
          *   Analysis: **Fatal Flaw.** Data Snooping / Overfitting. Tuning parameters on data $X$ and validating on data $X$ proves nothing. It proves the model can memorize history, not predict the future. Deterministic travel ignores congestion risks.
          *   *Friedman Check:* Friedman requires predictions of *new* phenomena. This is post-diction.
          *   *Verdict:* **Hard Stop.** Cannot use for financial commitment.

  6.  **Identifying Procedure Failure Modes:**
      *   Where does this checklist fail?
      *   *Black Swan events:* Models based on history fail on structural breaks (pandemic, gas price spike).
      *   *Game Theory:* If the model changes human behavior (e.g., dynamic pricing), historical validation fails (Lucas Critique).
      *   *Complexity:* Sometimes the "mechanism" is too complex to isolate.

  7.  **Drafting the Verdict Format:**
      *   Needs to be concise. "Approved for [Decision] / Rejected / Conditional on [X]".

  8.  **Review and Refine:**
      *   *Tone Check:* Am I being too academic? Keep it operational.
      *   *Friedman Check:* Did I correct the user? Yes, need to clarify that Friedman applies to *predictions*, but simulations used for *interventions* need causal validity, not just correlational fit.
      *   *Case 3 Harshness:* The prompt asks me not to soften it. I need to be blunt about the data leakage.
      *   *Procedure:* Ensure the steps distinguish between "negligible detail" and "structural flaw."

      *(Self-Correction during drafting)*: In Case 1, if the model matches total picks despite ignoring breaks, the *rate* parameter is absorbing the break time. The risk isn't the average capacity, it's the *variance* (call-outs). I need to make sure the procedure highlights *variance* vs *mean*.
      *(Self-Correction on Case 3)*: The user built this. I need to be direct but professional. "This is overfitting" is the technical term. "Data leakage" is the mechanism.

      *(Refining the Procedure Steps)*:
      1.  **Causal Cut:** Does this assumption sever a feedback loop relevant to the decision?
      2.  **Calibration vs. Validation:** Was the data used to tune the model distinct from the data used to test it?
      3.  **Intervention Validity:** Does the model predict *changes* or just *states*?
      4.  **Margin of Safety:** Is the recommendation robust to the assumption's error bound?

      *Wait, I need to make sure I address the "F-twist" specifically.* The F-twist says "assumptions don't matter if predictions work." The counter-argument is "predictions work *until you change the system*." Since these are decisions (interventions), the F-twist is dangerous. I need to embed this in the procedure.

      *Final Plan:*
      1.  Intro: Clarify Friedman & The F-Twist in this context.
      2.  The Procedure (4 Questions).
      3.  Application to Cases 1, 2, 3.
      4.  Failure Modes.
      5.  Verdict Format.

      *Let's write it.*
answer: |-
  ### Part 1: The Friedman Correction & The Procedure

  You have Friedman mostly right, but you are applying him to the wrong class of models. Friedman's *The Methodology of Positive Economics* (1953) argues that for **equilibrium predictions** (e.g., "if tax goes up, consumption goes down"), assumptions can be false as long as the prediction holds.

  However, you are running **intervention simulations** (e.g., "if we open Site 4, profit goes up"). When you change the system, you trigger feedback loops. If your assumptions cut those loops, the model might predict the *status quo* perfectly (because it's calibrated to it) but fail catastrophically on the *decision* (because the causal mechanism is broken). This is known as the **Lucas Critique**.

  The "F-twist" is valid for *forecasting* passive environments. It is invalid for *prescribing* active changes.

  Here is the 4-step procedure to run in your 45-minute meeting. It forces the modeler to prove the assumption is "negligible detail" rather than "structural break."

  #### The Assumption Stress Test (AST)

  **Q1: The Causal Cut**
  *   **Ask:** "Does this assumption remove a feedback loop that this specific decision triggers?"
  *   **Sufficient Answer:** "No. The decision changes X, and the assumption simplifies Y. X does not influence Y in the real system." OR "Yes, but we have empirically shown Y is constant regardless of X."
  *   **Stop Signal:** If the decision changes the load on the system (e.g., more orders), and the assumption ignores load-dependent friction (e.g., congestion, fatigue), **STOP**. The model cannot be used for scaling decisions.
  *   **Judgment Call:** Determining if a feedback loop exists. Rely on the Ops Manager here, not the engineers.

  **Q2: The Calibration Leak**
  *   **Ask:** "Is the data used to tune the parameters distinct from the data used to validate the output?"
  *   **Sufficient Answer:** "Yes. We tuned on Jan–Jun, validated on Jul–Dec." OR "We tuned on Site A, validated on Site B."
  *   **Stop Signal:** "We used the same 18 months for tuning and validation." This is **data leakage**. It proves the model can memorize history, not predict the future. **STOP**.
  *   **Judgment Call:** None. This is binary.

  **Q3: The Intervention Test**
  *   **Ask:** "Did you validate this model against a *change* in the past, or just a *continuation* of the past?"
  *   **Sufficient Answer:** "We simulated last year's Black Friday surge using parameters from Q3, and it matched the surge within 10%."
  *   **Stop Signal:** "We validated against normal operations." If the decision involves a step-change (new site, new vendor), validation must include a historical step-change (e.g., a previous site opening).
  *   **Judgment Call:** Deciding if the historical change is comparable to the proposed decision.

  **Q4: The Margin of Safety**
  *   **Ask:** "If this assumption is off by 10%, does the financial recommendation flip?"
  *   **Sufficient Answer:** "No. Site 4 is $1.9M better. A 10% error in travel time only swings value by $200k. The decision is robust."
  *   **Stop Signal:** "We haven't run that sensitivity." OR "Yes, it flips the decision." If the decision hinges on the precision of the unrealistic assumption, **STOP**.
  *   **Judgment Call:** Defining what "flip the decision" means (e.g., NPV > 0 vs. NPV < 0, or Vendor A > Vendor B).

  ---

  ### Part 2: Applying the AST to Your Queue

  #### Case 1: Staffing Model (No Breaks/Call-outs)
  *   **Decision:** Hiring count for opening month.
  *   **AST Q1 (Causal Cut):** **FAIL.** Hiring decisions directly impact fatigue and coverage. Ignoring call-outs removes the risk of understaffing. The model assumes 100% availability; reality is ~85-90%.
  *   **AST Q2 (Calibration):** **PASS.** Validated against existing site data.
  *   **AST Q3 (Intervention):** **PARTIAL.** Validated on "busiest site," but did that site have the same ramp-up curve as a new opening?
  *   **AST Q4 (Margin):** **UNKNOWN.** You matched "total picks-per-shift." This is dangerous. If real pickers take breaks, their *effective* rate is lower. If your model assumes *no* breaks but matches the *total*, your model's "pick rate" parameter is artificially low to compensate. This works for averages, but fails for **service levels**.
  *   **The Trap:** You are staffing for *average* capacity, not *variance*. A model without call-outs cannot predict the number of days you will miss SLA targets.
  *   **Verdict:** **Usable for Budget (Labor Cost), Not Usable for Service Level (Hiring Count).** You will hire too few people to cover variance.
  *   **Fix:** Require a "shrinkage factor" input (e.g., plan for 90% availability) before signing off on headcount.

  #### Case 2: Routing Comparison (Perfect Parking)
  *   **Decision:** Pick between two routing vendors.
  *   **AST Q1 (Causal Cut):** **PASS (Conditional).** Parking friction exists, but does the *choice of vendor* change parking difficulty? If Vendor A routes through dense urban and Vendor B through suburbs, the assumption hurts Vendor A unfairly. If both operate in similar densities, the bias cancels out.
  *   **AST Q2 (Calibration):** **PASS.** 40 days data.
  *   **AST Q3 (Intervention):** **PASS.** Reproducing delivery-time *distribution* implies it handles variance well, not just averages.
  *   **AST Q4 (Margin):** **PASS.** You are comparing Vendor A vs. Vendor B, not predicting absolute arrival time. As long as the bias is consistent across both vendors, the *delta* is valid.
  *   **Verdict:** **Usable for Vendor Selection.**
  *   **Caveat:** Add a constraint: "Validation must include the specific zip codes where the vendors differ most." If the validation data is from easy suburbs and the decision is for dense urban, the F-twist fails.

  #### Case 3: Network Sim (Your Model)
  *   **Decision:** Open Site #4 ($1.9M value).
  *   **AST Q1 (Causal Cut):** **FAIL.** Deterministic travel times ignore congestion. Opening a new site changes traffic patterns and demand density.
  *   **AST Q2 (Calibration):** **HARD FAIL.** You tuned parameters on the same 18 months used to confirm prediction. This is **overfitting**. You have proven the model can fit noise, not signal.
  *   **AST Q3 (Intervention):** **FAIL.** You validated on historical averages. Opening a site is not an average event; it is a structural break.
  *   **AST Q4 (Margin):** **IRRELEVANT.** Because Q2 failed, the $1.9M number is fiction. It could easily be -$500k.
  *   **Verdict:** **Not Usable. Do Not Present.**
  *   **Why:** You cannot use the same data to train and test a model intended for financial commitment. This is basic data science hygiene. If you present this, Finance should reject it immediately. If they don't, they aren't doing their job.
  *   **Fix:** You need **out-of-sample validation**. Hold out the last 6 months of data. Tune on the first 12. Run the sim on the last 6 *as if* Site #4 existed (counterfactual). If it predicts the *known* outcomes of the existing sites during that period without seeing the data, then you can trust the Site #4 prediction. Until then, the $1.9M is a hallucination.

  ---

  ### Part 3: Where This Procedure Misfires

  The AST is designed for **Discrete Event / Agent-Based Simulations** in stable markets. It will give you a confident wrong answer in three scenarios:

  1.  **Structural Breaks (Black Swans):** If the market environment changes fundamentally (e.g., gas prices double, a pandemic hits, a competitor exits), historical validation (Q2/Q3) is worthless. The model assumes the future resembles the past.
      *   *Mitigation:* Require a "Scenario Planning" addendum. Run the model with extreme parameter shifts (e.g., demand -50%, travel time +50%) to see if the decision holds under stress.
  2.  **Strategic Response (Game Theory):** If your decision triggers a competitor reaction (e.g., you open a site, they drop prices), the model fails. Your model simulates *your* system, not the *market's* response.
      *   *Mitigation:* Explicitly state in the verdict: "Valid only assuming competitor behavior remains static."
  3.  **Human Behavior Change:** If the decision changes how your own employees act (e.g., new routing software makes drivers game the system), historical data on driver behavior is invalid.
      *   *Mitigation:* Require a pilot program before full simulation rollout.

  ### Part 4: The Verdict Format

  Copy/paste this into your review doc. It forces specificity.

  > **VERDICT:** [USABLE / NOT USABLE / CONDITIONAL]
  > **SCOPE:** [Specific Decision Allowed, e.g., "Budgeting only, not Headcount"]
  > **BLOCKER:** [Specific AST Question Failed, e.g., "Q2: Data Leakage on Training/Validation"]
  > **REQUIRED FIX:** [Actionable Step, e.g., "Hold out last 3 months data for blind validation"]

  **Example for Case 3:**
  > **VERDICT:** NOT USABLE
  > **SCOPE:** N/A
  > **BLOCKER:** Q2 (Calibration Leak) & Q3 (No Intervention Validation)
  > **REQUIRED FIX:** Retune on months 1-12, validate blind on months 13-18. Run counterfactual on existing sites before projecting Site 4.
