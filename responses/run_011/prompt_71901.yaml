      *(Self-Correction during drafting)*: I need to be careful not to let the user off the hook too easily if their "rivalrous" argument is weak. Actually, the rivalrous argument is strong *if* the system was working. But the system wasn't working. The TAC was the problem. So the fisherman's catch was additive to *mortality*, even if subtractive from *quota*. I need to clarify that distinction. Biological mortality is additive. Quota allocation is rivalrous. The collapse is about mortality. So the friend is right about the biology, but the user is right about the *responsibility structure*.

      *Refining the Verdict:* The inefficacy objection applies to the *fisherman*. It does *not* apply to the *Minister*. The friend is using the fisherman's collapse to prove a point about individual consumer choice (like steak). That's a category error. The fisherman wasn't a consumer; he was a regulated extractor. The analogy to "one steak" fails because the steak buyer faces no quota, whereas the fisherman faced a (broken) quota.

      *Wait, one more nuance:* The user asks about the "Inefficacy Objection" generally (often used in veganism/voting). The friend uses Cod to say "See, individual acts sum to disaster." The user says "No, the structure was different."
      *Key Insight:* The Cod collapse is a **Failure of Regulation**, not a **Failure of Individual Restraint**. The inefficacy objection warns against relying on individual restraint. The Cod collapse proves that *without* regulation, individual restraint is impossible (Race to Fish), and *with* regulation, individual action is dictated by the regulator.
      *Conclusion:* The Cod case actually *supports* the inefficacy objection regarding the individual fisherman (he couldn't have stopped it), but indicts the Collective Agent (DFO).

