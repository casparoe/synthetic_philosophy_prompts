answer: |-
  Here is the analysis of the 1992 Cod Moratorium through the lens of the inefficacy objection, dissecting the rivalrous/additive distinction, the agency problem, and the structural realities of the fishery.

  ### 1. The Rivalrous vs. Additive Distinction
  Your intuition about rivalry is sharp, but it requires a biological correction.

  **Economically, you are right:** In a quota-managed fishery (post-1977), the catch is rivalrous. If the Total Allowable Catch (TAC) is 100,000 tonnes and Boat A catches 100 tonnes, that is 100 tonnes less available for Boat B. The harm is distributed via allocation, not just accumulation.

  **Biologically, your friend is right:** Fish stock collapse is driven by *mortality rates*, which are additive. Whether Boat A or Boat B kills the fish, the fish is dead. The stock does not care about the quota ledger; it cares about the total removals versus recruitment. Therefore, the "threshold" logic holds biologically: if the aggregate catch exceeds the biological threshold, the stock collapses.

  **Where your distinction holds water:** It holds on *causality*, not biology. In a climate case (additive), my carbon tonne exists regardless of what you do. In a quota fishery (rivalrous), my catch is *authorized* by a collective decision. If I choose not to fish, my quota might go to someone else (if transferable) or remain uncaught (if not).
  *   **If transferable:** My restraint changes nothing; the fish die anyway. (Inefficacy objection stands).
  *   **If non-transferable:** My restraint lowers the total catch *only if* the TAC was not fully utilized by others.

  **Verdict on the Wrinkle:** The rivalrous nature doesn't save the inefficacy objection regarding the *biological outcome*, but it shifts the *moral locus*. In an additive system (climate), the individual is a source of harm. In a rivalrous/quota system, the individual is a distributor of harm authorized by a third party.

  ### 2. Who Is the Individual Agent?
  The inefficacy objection relies on a clear definition of the "individual." The Cod collapse blurs this entirely.

  *   **The Skipper/Boat:** From inside a single season, the skipper faces a "race to fish" (especially pre-strict quotas) or a mandate to fill quotas (post-1977). If Skipper A stays home, Skipper B (or the foreign fleet, or the next season's allocation) absorbs the slack. The skipper's individual efficacy is near zero because the *pressure to extract* is systemic, not individual.
  *   **The Fish Plant Owner:** They lobbied for high quotas to keep lines running. Their influence was marginal compared to the state.
  *   **The Department (DFO/Minister):** This is the critical agent. The TAC was not a natural limit; it was a political number. Scientists recommended lower cuts; politicians overruled them to prevent short-term unemployment.

  **Analysis:** The inefficacy objection is usually deployed to absolve the *consumer* or the *voter*. In the Cod analogy, the fisherman is not analogous to the steak-eater; he is analogous to the *slaughterhouse worker*. The steak-eater creates the demand; the fisherman executed the harvest mandated by the state.
  If the agent is the **fisherman**, the inefficacy objection holds: One boat could not have saved the cod.
  If the agent is the **Minister**, the inefficacy objection fails: One signature on a TAC document *did* determine the threshold.

  ### 3. The Epistemic Context (Disputed Stock Numbers)
  The inefficacy objection often assumes agents know the consequences of their actions (e.g., "I know this steak causes suffering"). In the Newfoundland fishery, the agents were operating under radical uncertainty.

  *   **The Data:** Throughout the 80s, DFO science believed the stock was resilient. They believed the fish were "hiding" due to cold water, not gone.
  *   **The Choice:** A skipper in 1988 choosing to fish was not choosing "collapse." They were choosing "livelihood" based on the best available (but flawed) data that said the stock was safe.
  *   **The Implication:** The inefficacy objection is strongest when the harm is certain but diffuse. Here, the harm was uncertain and concentrated. You cannot effectively argue that an individual should have acted against a collapse they were explicitly told was not happening by the governing authority.

  ### 4. Where the Objection Goes Quiet
  Your friend's analogy ignores the structural layers where individual agency dissolves.

  *   **The Foreign Fleet (Pre-1977):** Before Canada extended its waters, this was a classic "Tragedy of the Commons." Open access, additive mortality. Here, the inefficacy objection *does* fail. Every tonne counted because there was no regulator to absorb the responsibility. This supports your friend's view *for that specific era*.
  *   **The Political Override (Post-1977):** Once Canada claimed jurisdiction, the dynamic shifted. The collapse was driven by TACs set *above* scientific advice. This introduces a **Collective Agent** (the State). The inefficacy objection is a theory about *individual* action in the absence of coordination. When a coordinator exists (DFO) and chooses harm, the individual is no longer the primary variable.
  *   **Ecological Factors:** Recent analysis suggests natural mortality (predation, cold water slowing growth) played a larger role than fishing mortality in the final crash. If the stock was destined to crash due to temperature shifts regardless of the last 10% of catch, the "threshold" argument weakens significantly. The "last vote" didn't decide the election; the demographic shift did.

  ### 5. Final Verdict

  **Is the collapse a counterexample to the inefficacy objection?**
  **No.**

  **Is it a case the objection never claimed to cover?**
  **Yes.**

  Here is the straight answer: The inefficacy objection addresses scenarios where individuals act in an uncoordinated vacuum (e.g., "Should I vote?" "Should I eat this steak?"). It argues that without coordination, individual sacrifice is causally negligible.

  The Newfoundland Cod collapse was not a failure of individual restraint; it was a **failure of regulatory restraint.**

  *   **Your Friend's Error:** He is treating the fishermen as free agents summing up to a threshold. They were not. They were components in a system managed by a central authority. The collapse proves that when a Collective Agent (the DFO) sets a threshold too high, individual agents (fishermen) cannot stop the disaster, even if they wanted to. This actually *validates* the inefficacy objection for the individual fisherman: he was right that his one boat wouldn't change anything, because the decision wasn't his to make.
  *   **Your Error:** You are hung up on the "rivalrous" economic distinction. Biologically, the catch was additive. The rivalry only matters for profit distribution, not stock survival. However, your instinct that the *structure* matters is correct.

  **The Synthesis:**
  The Cod Moratorium is not proof that "individual actions sum to harm" (which the inefficacy objection already admits). It is proof that **individual actions are subordinate to institutional permissions.**

  Your friend is using a regulatory failure to argue for individual moral responsibility. That is a category error. The inefficacy objection remains intact for the steak-eater because there is no "Minister of Meat" setting a global slaughter quota that the eater is merely fulfilling. The steak-eater is the Minister *and* the executioner. The fisherman was just the executioner.

  **Winner:** You are closer to the truth, but not because of rivalry. You win because the presence of the DFO as a **Collective Agent** removes the individual fisherman from the causal chain of the collapse. The objection doesn't fail; it just applies to the Minister, not the boat.
