          *   Assess if the "negligible contribution" premise holds here vs. climate change.
          *   Identify where the objection goes quiet (foreign trawlers, political override, ecological factors).
          *   **Final Verdict:** Is this a counterexample to the inefficacy objection, or a case outside its scope due to the presence of a "collective agent" (government/regulator)?

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *The Cod Moratorium:* Happened in 1992. Northern Cod stock collapsed. 30,000+ jobs lost.
      *   *Cause:* Overfishing, yes. But also ecological shifts (cold water, capelin availability).
      *   *Management:* Before 1977 (200-mile limit), it was largely open access/international. After 1977, Canada claimed jurisdiction. Management was via Total Allowable Catch (TAC) set by DFO (Department of Fisheries and Oceans).
      *   *The "Inefficacy Objection":* Usually applied to voting or carbon footprints. "If I don't vote, the candidate wins/loses anyway." "If I don't eat this steak, the cow still died."
      *   *The "Threshold" Argument:* "If enough people do X, disaster happens. You are part of that enough."
      *   *The User's "Rivalrous" Point:* In a quota system, if I catch 1 ton, that's 1 ton less available for others *within the limit*. But if the limit itself is set too high, the rivalry is within a doomed framework.

  3.  **Analyzing the "Rivalrous vs. Additive" Distinction:**
      *   *Climate Change:* Additive. My ton of CO2 adds to the atmospheric stock. It doesn't prevent you from emitting yours (unless there's a cap-and-trade system, but even then, the physical effect is additive).
      *   *Fisheries:* Rivalrous *within* a TAC. If TAC is 100 tons and there are 10 boats, my 10 tons prevents you from catching 10 tons.
      *   *However:* The collapse wasn't caused by fishermen stealing from each other's quotas *within* a safe limit. It was caused by the *aggregate* catch exceeding the *biological* limit.
      *   *User's Claim:* "His threshold story only works if they're additive."
      *   *Counter-thought:* Thresholds work on aggregates regardless of rivalry. If the bucket overflows, it doesn't matter if the water droplets fought over space. The issue is whether the *individual droplet* triggered the overflow.
      *   *Refinement:* The user is hinting at the *causal mechanism*. In climate, my emission is physically additive. In fisheries, my catch is legally subtractive from a pool. But biologically, it's additive to "mortality." So the user's distinction might be semantic unless it touches on *who set the pool size*.

  4.  **Identifying the "Individual Agent":**
      *   Is it the skipper? The boat owner? The fish plant worker? The DFO Minister?
      *   *Inefficacy Objection Context:* Usually targets the *consumer* or the *voter*. In this analogy, is it the fisherman?
      *   *The Fisherman's Dilemma:* If I don't catch the fish, someone else will (the "race to fish" before quotas were hard, or the political pressure to keep quotas high).
      *   *The Real Agent:* The DFO/Political leadership set the TAC. The fishermen executed the harvest.
      *   *Implication:* If the TAC is the causal lever, the fisherman is an employee of the system, not the architect. This supports the user's suspicion about a "collective agent."

  5.  **Examining the "Negligible Contribution" Premise:**
      *   Did one boat matter? Biologically, no. One boat catching 50 tons doesn't collapse a million-ton stock.
      *   Did one *season's* TAC matter? Yes, if it exceeded recruitment.
      *   *Uncertainty:* Stock assessments were wrong. Scientists thought the stock was bigger than it was. Fishermen knew fish were scarce but were told quotas were safe.
      *   *Inefficacy Objection:* "My catching 50 tons won't change the stock status." True.
      *   *Threshold Objection:* "All of us catching 50 tons *will* change it." True.
      *   *The Twist:* The fishermen didn't choose the aggregate. The DFO did. So the fisherman's individual choice was constrained.

  6.  **Where the Objection Goes Quiet (The Complicating Factors):**
      *   *Foreign Trawlers (Pre-1977):* This was a classic tragedy of the commons (additive, open access). Inefficacy objection fails here because the marginal catch *did* contribute to the depletion rate without constraint.
      *   *Political Override:* DFO scientists recommended lower quotas; politicians kept them high to save jobs. This introduces a *principal-agent* problem. The "collective agent" (State) chose harm for economic reasons.
      *   *Ecological Factors:* Water temperature, capelin (prey). This means the collapse wasn't *solely* fishing mortality. This weakens the "threshold" argument because the threshold wasn't just about catch volume.

  7.  **Synthesizing the Verdict:**
      *   *Is it a counterexample?* Not really. The inefficacy objection says "Your individual act has no causal impact on the outcome." In the cod case, the individual fisherman's act *truly* had no impact on the collapse *given the TAC set by the government*. If he stayed home, the quota would likely have been filled by others, or the TAC would have remained the same.
      *   *Is it a case the theory doesn't cover?* Yes. The theory assumes a flat landscape of individual agents. The Cod collapse involved a *hierarchy*. The DFO was a "collective agent" with the power to stop the harm but chose not to.
      *   *The User's "Rivalrous" Point:* It's insightful but slightly misdirected. The rivalry matters for *profit*, not for *stock collapse*. The collapse is about total mortality. However, the user is right that the *structure* (Quota vs. Open Access) changes the moral locus. In a quota system, the sin is in the *setting* of the quota, not the *taking* of the fish.

