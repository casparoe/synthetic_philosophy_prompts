  9.  **Addressing Underdetermination (Question 4):**
      *   *If Approve:* We adopt the principle that "Carrier autonomy and local legality suffice, even if cross-border legal security is uncertain."
          *   *Conflict:* This undermines Case 7. In Case 7, we refused because the home country wouldn't recognize parents. If we approve Thursday (where home country might not recognize parents), we must admit Case 7 was refused *only* because of criminalization, not legal uncertainty. We would have to tell Case 7 couple: "If your country didn't criminalize payment, we would have helped you leave your child in legal limbo."
