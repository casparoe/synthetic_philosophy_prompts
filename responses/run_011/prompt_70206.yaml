  The community representatives are correct that a vendor assigning 0.5/0.3/0.2 weights is unelected moral legislation. These numbers represent how much we value saving the young versus the sick versus the fair innings. That is public policy, not software configuration. Similarly, the health economist is right that min-max normalization makes the scores batch-relative. A patient's priority should not fluctuate based on who else happens to be in the waiting pool that night. If a particularly sick batch arrives, a moderately sick patient's score drops, not because their condition changed, but because of the company they keep. Finally, the abstention protocol is unsafe. An 18% handoff rate doubles our panel's load, and silently reverting to life-years when the tool is confused hides the uncertainty from the clinician.

  Those arguing against purchase entirely make a profound moral claim. They argue that reducing triage to arithmetic corrupts the clinician-patient relationship and creates a false sense of objectivity. Their strongest point is that when the algorithm errs, the hospital bears liability for a mathematical decision that no single doctor owned. They contend that human judgment, even if inconsistent, retains moral agency and compassion that a weighted sum cannot replicate. They worry that adopting this tool signals that we value efficiency over the sacredness of individual care, potentially eroding public trust if families feel their loved one was ranked by a spreadsheet. They argue that it is better to struggle visibly with hard choices than to hide behind a veneer of precision.

  This argument loses not because it is wrong about the risks, but because it assumes the alternative is safer. The alternative is not pure human compassion; it is hidden bias. We already rank patients; we just do it inconsistently and without a record. By purchasing with conditions, we bring the trade-offs into the light where we can audit them. We can fix the normalization; we cannot fix the hidden heuristics of a tired surgeon at 3 AM. The tool does not make the decision; it structures the debate.

  To move forward, the contract must specify:
  1.  **Weight Setting:** The vendor disables default weights. Our committee sets them annually via public session, documented in board minutes.
  2.  **Normalization:** Scores must be normalized against a fixed historical reference population, not the nightly batch, ensuring stability across shifts.
  3.  **Abstention:** Cases flagged for conflict must route to a designated senior attender, not revert silently. If volume exceeds capacity, we staff the panel, not lower the threshold.
  4.  **Disclosure:** Families receive a standard explanation that priority scoring assists but does not replace clinical judgment, available upon request.

  This path respects the community's demand for accountability, the economists' demand for statistical integrity, and the clinicians' need for decision support. It acknowledges that while math cannot solve moral dilemmas, it can make our moral dilemmas visible. We must not let the perfect be the enemy of the auditable. Vote to buy, conditional on these amendments.
