  **Recommendation:** I recommend we vote to purchase the tool, but only if the vendor agrees to four contractual conditions: we set the ethical weights, not them; normalization uses fixed reference data, not nightly batches; abstentions trigger senior clinician review rather than silent reversion; and we adopt standardized disclosure language for families. This approach captures the tool's auditable benefits while preventing the vendor from encoding unchecked moral policy into our care.

