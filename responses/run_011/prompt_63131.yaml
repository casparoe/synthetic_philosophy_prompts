  **MEMORANDUM**

  **TO:** Faculty Conduct Appeals Panel
  **FROM:** Panel Member [Redacted]
  **DATE:** October 24, 2023
  **SUBJECT:** Preliminary Analysis and Recommendation regarding Case 23-09

  This memo outlines the factual and philosophical constraints facing the panel regarding the complaint against the Department Chair. We are asked to determine whether the Chair committed misconduct by reporting a faculty member's participation in a public letter. The core tension lies between our Charter's requirement to judge conduct based on policies in force at the time and the substantive defects of the directive triggering the report. This analysis separates the validity of the directive from the Chair's execution of it to recommend a finding of No Censure, alongside a formal declaration that the directive was void.

  The Charter mandates we decide cases in accordance with the policies in force at the time of the conduct. On its face, this suggests the provosts email was binding law during the interim administration. However, we must distinguish between a command issued by authority and a valid institutional rule. A directive that contradicts the Faculty Handbook—the institution's higher-order constitution—cannot function as a valid policy simply because it was emailed. The Handbook's academic freedom protections were in force and explicitly protected the signing of the letter. If we accept that procedural defects, retroactivity, and contradiction with standing policy render a directive void ab initio, then the Charter clause is satisfied: there was no valid policy in force to begin with. This resolves the legal trap without requiring us to endorse the directive.

  We must also grant the Chair's defense its strongest possible reading. She faced an ambiguous chain of command during an interim administration, with implicit threats of broader departmental scrutiny. Her delay of three weeks suggests she sought to avoid compliance entirely. When she finally reported one name, she may have acted to satisfy a perceived demand for minimal cooperation to protect her tenure-line faculty from retaliation. To censure her for following a direct order from a superior officer, even a flawed one, risks punishing a subordinate for administrative overreach she did not create. The person who issued the directive is not here; she is.

  However, this mercy does not resolve the second philosophical question regarding her specific actions. The directive demanded reporting *any* faculty member who signed. It allowed no discretion. By reporting only one of four signers, the Chair exercised discretion regardless of the rule's intent. If the rule was mandatory, she violated it by not reporting all four. If she believed the rule was unjust and chose to limit the damage, she acted on moral judgment rather than bureaucratic compliance. She cannot claim she was merely following orders while simultaneously editing the orders to fit her conscience. Half-compliance with a non-discretionary rule is not compliance; it is selective enforcement. This undermines the argument that she was bound by the rule, because she demonstrated she had the agency to modify its application.

  Therefore, the panel should not censure the Chair. Censuring her for reporting anyone ignores the coercive context and the directive's invalidity. Censuring her for selective enforcement punishes her for mitigating harm. The appropriate path is a finding of No Censure regarding the misconduct charge, coupled with a specific finding that the emergency directive was null and void due to its contradiction with the Handbook. We must clarify that administrative emails do not override shared governance documents. This protects the Chair from being the scapegoat for the interim administration's overreach while ensuring the institution does not set a precedent that such directives are valid policies in force. We should recommend the Provost's office formally rescind the directive to prevent future confusion.

  This approach satisfies the Charter without validating the directive. It acknowledges the Chair's constrained agency without endorsing selective enforcement as a standard practice. It allows us to close the case without punishing a colleague for a systemic failure, while firmly re-establishing the Handbook as the supreme law of the faculty. We should be prepared to explain this distinction clearly during the vote, particularly for members who may view the Charter language as strictly binding regardless of the directive's content. The goal is to resolve the case without creating a precedent that allows administrators to bypass the Handbook via email.
