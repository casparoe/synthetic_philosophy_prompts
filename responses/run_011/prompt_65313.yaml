answer: |-
  **Case A**
  Marcus works in a busy open-plan office. There is no cleaning staff for the kitchen, and no established system for tidying up. Colleagues typically leave their mugs and plates in the sink until the end of the day, assuming someone else might handle it or that it will wait. At 1:00 PM, Marcus sees the sink is completely full. He spends twenty minutes washing the accumulated dishes, delaying his own lunch and missing a scheduled call to clear the sink. He acts solely from a personal preference for order.

  **Case B**
  Marcus works in a busy open-plan office. There is no cleaning staff for the kitchen, but the team maintains a strict, long-standing practice where everyone washes their own items immediately to keep the sink clear. This custom is upheld by all ten employees without exception. At 1:00 PM, Marcus sees the sink is completely full because one colleague is home sick and could not wash up. He spends twenty minutes washing the accumulated dishes, delaying his own lunch and missing a scheduled call to clear the sink. He acts to restore the kitchen to its usual standard.

  ***

  ### 1. The Three Conditions
  *   **Condition 1: Permissible to Omit.**
      *   **Case A:** Holds. Marcus can leave the dishes without moral fault; no one is wronged by the mess because no norm exists.
      *   **Case B:** Fails. Marcus cannot omit the act without moral fault; allowing the mess to stand violates the cooperative expectation upheld by others.
  *   **Condition 2: Morally Good.**
      *   **Case A:** Holds. The act produces a communal benefit and displays virtue.
      *   **Case B:** Holds. The act produces a communal benefit and displays virtue (though it is now required).
  *   **Condition 3: Costly/Sacrificial.**
      *   **Case A:** Holds. Marcus loses lunch time and misses a call (non-trivial professional/social cost).
      *   **Case B:** Holds. Identical cost (lunch time, missed call).

  ### 2. The Lever and Mechanism
  *   **The Lever:** **Participation in a Cooperative Scheme (The Principle of Fairness).**
  *   **Condition Moved:** Condition 1 (Permissibility to Omit).
  *   **Mechanism:** In Case A, Marcus is a bystander offering a benefit. In Case B, Marcus is a *participant* in a mutually beneficial practice. By accepting the benefits of the scheme (a clean kitchen maintained by others), he incurs an obligation to do his share to prevent free-riding. This shifts the act from "charity" (optional) to "fair play" (required) without changing the physical cost, the outcome, or creating a formal contract.

  ### 3. Load-Bearing Feature
  *   **Feature:** The existence of the **strictly observed practice by all other members** in Case B.
  *   **If Deleted:** If you remove the fact that "all ten employees" uphold the custom, Case B collapses into Case A. Without the others doing their part, the duty of fair play dissolves, and Marcus becomes a mere benefactor again. The obligation hinges entirely on the reciprocity of the group, not Marcus's individual capacity.

  ### 4. Best Attacks
  *   **From the Supererogation Denier (Maximizing Consequentialist):** "The outcomes are identical: a clean sink. The costs are identical: twenty minutes. If the consequences and costs are the same, the moral status must be the same. You are smuggling in 'rules' that don't exist. If it was optional in A, it is optional in B. There is only one category: maximize good. Marcus should do it in both, or neither, based on utility, not 'fairness'."
  *   **From the Obligation Inflator (Demandingness Critic):** "Your cost threshold is too low. Missing a lunch and a call is trivial inconvenience, not a 'sacrifice.' If the cost isn't significant enough to risk the agent's well-being, neither case is supererogatory; both are just minimal decency. You haven't found a boundary for supererogation; you've just described two versions of basic responsibility."

  ### 5. Confidence and Vulnerability
  *   **Confidence:** Moderate-High (75%).
  *   **What Would Change My Mind:** If **Robert Nozick's objection to the Principle of Fairness** holds. Nozick argues that receiving a benefit (clean kitchen) does not create an obligation to contribute unless you *actively accepted* it. If "passive receipt" doesn't generate duty, then Case B is not obligatory, and the pair fails (both become supererogatory).
  *   **Where I Might Be Wrong:** I am leaning on a contested reading of **"Permissible to Omit."** Many libertarians or individualists would argue that even in Case B, Marcus is permitted to omit the act because he never *signed* the agreement. If "implicit norm" is not enough to generate obligation, the lever breaks.
  *   **Contested Reading Flag:** I am assuming that **informal social practices can generate binding moral duties** equivalent to promises without being contracts. If your seminar treats "duty" as strictly contractual or causal, Case B will not register as obligatory, and the distinction collapses.
