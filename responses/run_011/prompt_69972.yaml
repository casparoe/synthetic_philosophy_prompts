          *   Focus on Step 3 (Human Analogy). It's a category error. Evolution's "goal" for us is not our "goal." We have internal reward systems (dopamine) that *proxy* fitness. When they misfire (sugar), that's misgeneralization of the evolutionary objective, not proof that sugar *is* the goal.
