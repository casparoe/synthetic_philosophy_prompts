      *   *Premise 2:* In CoinRun OOD, agent goes right. Therefore, "go right" is the goal. "Collect coin" was never the goal. (This is the crux. It conflates *behavior* with *goal ascription*).
      *   *Premise 3:* Human analogy. We pursue sugar/status OOD, not nutrition/reproduction. (Evolutionary psychology point, seems plausible but potentially category-error prone).
