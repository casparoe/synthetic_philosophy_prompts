  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** Upper-level undergraduate philosophy of mind seminar (14-18 students).
      *   **Duration:** 75 minutes (plus a 50-minute cut-down version).
      *   **Topic:** Pain and the badness of pain (specifically the dissociation between sensory intensity and affective badness).
      *   **Student Background:** Familiar with qualia, intrinsic vs. instrumental badness. *Not* familiar with clinical pain literature or terms like "pain asymbolia."
      *   **Core Insight:** The authority question (who decides if a state is bad: report, disposition, or observer?) and the shifting of authority in ordinary reasoning.
      *   **Constraints:** No bibliography/citations/named researchers. Mark invented case details clearly.
      *   **Required Components:**
          1.  First Round: In-room data generation (mild aversive stimulus + rating + revealed preference). Must guarantee divergence. Consent/opt-out/non-physical alternative.
          2.  Second Round: Written patient dossiers (triage scenario). Includes asymbolic patient, foils (stoic, decliner). Payoff scheme where every rule is punished.
          3.  Logistics: Timeline, materials, board work, scripts, 50-min version.
          4.  Debrief: Reveal syndrome name at end. Map activity moments to theory. Three readings (pain w/o badness, not pain, bad pain w/o acknowledgment).
          5.  Troubleshooting: Predictable failures (guessing early, stimulus failure, rule escaping, consensus collapse, distress).
          6.  Closing Note: Limitations of the activity (temporary vs. lesion-based, etc.).

  2.  **Deconstruct Component 1: The In-Room Experiment:**

      *   *Goal:* Generate divergence between "Intensity" and "Minding" (Unpleasantness) + Revealed Preference.
      *   *Stimulus:* Needs to be safe, voluntary, mild, but aversive enough to vary. Ice water is classic but messy/time-consuming. Holding a heavy weight? Uncomfortable posture? *Idea:* Isometric hold (wall sit or plank) or holding a weight overhead. Let's go with holding a moderately heavy book/object overhead with one arm. It's scalable, safe, and creates fatigue/pain that varies by individual fitness.
      *   *Rating:* Two scales: Intensity (0-10) and Unpleasantness/Minding (0-10).
      *   *Revealed Preference:* A "bidding" mechanism. Students bid "points" (course participation credit or just hypothetical currency) to stop early or to continue. Better: A trade-off. "You can stop now, or continue for 30 seconds and gain X points, but if it gets too bad, you lose Y."
      *   *Refinement for Divergence:* If everyone hates it, no divergence. If no one cares, no divergence.
      *   *Better Stimulus:* The "Cold Pressor" is too risky for some (chronic pain). Let's use *sustained awkward posture*. Holding arms out at 90 degrees.
      *   *The Twist:* The "Bidding" needs to force a choice between the Report and the Action.
      *   *Revised Mechanic:* "The Auction of Relief." Students hold the pose. At intervals, they submit secret bids on how much they would pay (in hypothetical class currency) to stop *right now*. Then they rate Intensity and Unpleasantness.
      *   *Guaranteeing Divergence:* People differ in pain tolerance and interpretation. Some feel high intensity but low unpleasantness (challenge). Some feel low intensity but high unpleasantness (anxiety).
      *   *Fallback:* If everyone correlates high/high, use the *Non-Physical* version immediately. The Non-Physical version involves a cognitive task that is "intense" but not "bad" vs. one that is "bad" (boring/frustrating) but not "intense."
      *   *Consent:* Crucial. Must be explicit opt-in.

  3.  **Deconstruct Component 2: The Triage Dossiers:**

      *   *Goal:* Force committees to choose a rule for "who counts" (Report vs. Disposition vs. Observer).
      *   *Budget:* Scarce. Can only treat 3 out of 5 patients.
      *   *Patient 1 (The Target):* "Alex." Reports sensation, localizes it, says "It doesn't bother me." (Asymbolia).
      *   *Patient 2 (The Stoic):* Reports high intensity, high minding, but smiles and jokes. (Discordant expression).
      *   *Patient 3 (The Decliner):* Reports "This is hell," but refuses treatment because "It makes me who I am." (Value conflict).
      *   *Patient 4 (The Observer's Nightmare):* Screaming, withdrawing, but reports "Zero pain." (Delusion/Denial).
      *   *Patient 5 (The Instrumental):* Pain is purely instrumental (e.g., rehab pain).
      *   *Payoff:* The "Punishment" is logical inconsistency. If you prioritize Report, Alex and Patient 4 clash. If you prioritize Disposition, Alex and Patient 2 clash.
      *   *Invented Details:* Need to ensure these aren't taken as clinical fact but as game scenarios.

  4.  **Deconstruct Component 3: Logistics & Timeline:**

      *   75 mins total.
      *   Intro/Consent: 10 mins.
      *   Round 1 (Live): 15 mins.
      *   Round 2 (Dossiers): 25 mins.
      *   Debrief: 20 mins.
      *   Buffer: 5 mins.
      *   Groups: 3 groups of 5-6 students.
      *   Board: Two columns (Intensity vs. Minding), Triage List.

  5.  **Deconstruct Component 4: Debrief:**

      *   Reveal "Pain Asymbolia."
      *   Clinical description (Insular cortex, etc.).
      *   Map the three readings:
          1.  Pain exists, badness is missing (Separatist).
          2.  Not pain at all (Identity theory/Attitude view).
          3.  Pain is bad, patient is broken (Objective Badness).
      *   Force committees to admit where they shifted authority.

  6.  **Deconstruct Component 5: Troubleshooting:**

      *   *Guessing:* Keep the clinical reveal strictly for the end. Don't use the word "asymbolia" earlier.
      *   *Stimulus Failure:* Have the "Cognitive Load" fallback ready.
      *   *Rule Escaping:* Ensure dossiers are mutually exclusive in their demands.
      *   *Distress:* Robust opt-out. De-escalation script.

  7.  **Deconstruct Component 6: Closing Note:**

      *   Limitations: Lab vs. Lesion. Temporary vs. Permanent. Safety vs. Pathology.

  8.  **Drafting the Content - Iteration & Refinement:**

      *   *Stimulus:* Holding a heavy textbook overhead is better than a wall sit (less risk of falling/cramping legs). Let's specify a standard hardcover text.
      *   *Rating:* Use slips of paper for secrecy to prevent social signaling.
      *   *Dossiers:* Need to make sure the "Alex" case is clear. "I feel the cut, but I don't care."
      *   *Constraint Check:* No citations. Mark invented details.
      *   *Tone:* Academic, facilitative, precise.

      *(Self-Correction during drafting)*: The prompt asks for a "bidding or trade element that forces a revealed preference." Just rating isn't enough.
      *   *Revised Round 1:* Students hold the book. Every 30 seconds, they can choose to drop it. If they drop it, they get 0 points. If they hold it for the full 2 minutes, they get 5 points. *However*, they must write down a "Stop Price" beforehand. If the discomfort exceeds their Stop Price, they *must* drop it to avoid a penalty. This forces them to quantify the "badness" in terms of willingness to endure.
      *   *Actually, simpler:* "The Exchange." Hold the book. You are given 10 tickets. You can drop the book anytime. For every 10 seconds you hold it, you gain 1 ticket. At the end, tickets = grade bonus (or candy). *But*, you must fill out a card: Intensity (0-10) and Unpleasantness (0-10). The divergence comes when comparing the Intensity score of those who dropped out early vs. those who stayed.
      *   *Better yet (to ensure divergence):* The stimulus needs to be subjective enough. Let's use the "Cold Pressor" alternative: *The Isometric Hold*. It reliably produces varying pain/boredom ratios.
      *   *Revealed Preference:* "The Buy-Out." Midway through, offer them a chance to stop *if* they surrender their participation points. Those who stay reveal they mind it less than the points are worth. Those who stop reveal the opposite. Compare this to their ratings.

      *(Refining the Dossiers)*: I need to make sure the "Payoff Scheme" is clear. The prompt asks for a scheme where "every candidate rule... is punished."
      *   Rule A: Trust Report. (Fails on Patient 4 who says 0 pain but screams).
      *   Rule B: Trust Disposition/Behavior. (Fails on Patient 2 Stoic who smiles but says it hurts).
      *   Rule C: Trust Observer/Physiology. (Fails on Patient 1 Asymbolic who has tissue damage but no distress).
      *   Rule D: Trust Autonomy. (Fails on Patient 3 who refuses help for "hellish" pain).
      *   This structure works.

      *(Refining the Debrief)*: Must ensure I don't lecture too much. The students must identify the shift in authority themselves.

      *(Refining the 50-min version)*: Cut Round 1 time. Reduce dossier discussion time.

      *(Safety/Ethics)*: This is the most critical part. I need a very strong consent protocol. Chronic pain students could be triggered by *talk* of pain even if they don't do the physical task. Need a "Silent Observer" role that is fully equivalent in credit.

  9.  **Final Review against Constraints:**
      *   No bibliography? Checked.
      *   Mark invented details? Checked.
      *   Consent/Opt-out? Checked.
      *   Timeline? Checked.
      *   Troubleshooting? Checked.

  10. **Writing the Plan:** (Proceeding to generate the response based on these thoughts). *Self-correction on the stimulus:* Ice water is too risky for a general philosophy class without IRB. Isometric hold is safer. Let's go with "The Book Hold." It's mundane enough not to be scary but physically taxing enough to create variance.

      *Wait, one more check on the "Revealed Preference":* The prompt asks for "some small bidding or trade element."
      *   *Idea:* Give them 5 tokens. They can spend tokens to reduce the time they have to hold the book. 1 token = 15 seconds less. At the end, remaining tokens = candy/credit.
      *   *Why this works:* If they rate "Unpleasantness" as 10/10 but spend 0 tokens to reduce time, their revealed preference contradicts their report. This creates the "authority crisis" immediately in the room.

      *Let's finalize the stimulus:* Holding a standard hardcover philosophy text (approx. 1kg) at shoulder height, arm straight out. 2 minutes max.
      *   *Fallback:* If no one spends tokens (everyone toughs it out), the Fallback is a "Cognitive Strain" task where they solve impossible anagrams under time pressure. Some find it intense, some find it unpleasant.

      *Let's finalize the Dossiers:*
      *   Patient A (Asymbolic): Tissue damage, reports sensation, no distress.
      *   Patient B (Stoic): Tissue damage, reports high distress, no distress behavior.
      *   Patient C (Expressive): Minor damage, reports low distress, high distress behavior.
      *   Patient D (Refuser): High distress, refuses treatment.
      *   *Budget:* Treat 2 of 4.

      *Okay, ready to write.*
answer: |-
  # Session Plan: The Authority of Pain

  **Course:** Upper-Level Philosophy of Mind Seminar
  **Class Size:** 14–18 Students
  **Duration:** 75 Minutes (50-minute variant included)
  **Topic:** The Badness of Pain and the Authority of Verdicts

  ---

  ## 1. First Round: The In-Room Dissociation

  **Objective:** Generate live data where *Reported Unpleasantness* diverges from *Revealed Preference* (willingness to endure).

  ### The Stimulus: "The Static Hold"
  *   **Action:** Students hold a standard hardcover textbook (approx. 1–1.5 kg) in one hand, arm extended straight forward at shoulder height.
  *   **Duration:** Maximum 120 seconds.
  *   **Safety:** Wholly voluntary. No weight is placed on joints; muscle fatigue is the only stressor.

  ### Consent and Opt-Out Protocol
  **Facilitator Script:**
  > "We are about to conduct a brief phenomenological exercise involving physical sensation. You will be asked to hold a book. This may cause muscle fatigue or mild discomfort.
  >
  > **Participation is strictly voluntary.** You may decline the physical task without penalty and without giving a reason. If you decline, you will take the 'Observer Role,' which involves recording data and yields identical participation credit.
  >
  > **Medical Opt-Out:** If you have any history of shoulder injury, chronic pain, or condition that makes sustained posture inadvisable, you must take the Observer Role.
  >
  > **Stop Rule:** If you participate, you may drop the book at any second without penalty. Your only obligation is to record the time you stopped."

  *   **Procedure:** Hand out consent slips. Students check "Participant" or "Observer." Collect slips. Distribute books only to Participants.

  ### The Mechanic: The Token Auction
  1.  **Endowment:** Each Participant receives 4 physical tokens (e.g., poker chips or slips of paper).
  2.  **Exchange Rate:** Each token redeemed at the end of class equals one piece of high-quality chocolate (or 1 bonus participation point).
  3.  **The Trade:** Tokens can be spent to reduce the required hold time.
      *   Cost: 1 Token = Reduce hold time by 30 seconds.
      *   Baseline hold time: 120 seconds.
      *   Minimum hold time: 0 seconds (Cost: 4 tokens).
  4.  **The Rating:** Immediately after dropping the book (or finishing the 120 seconds), all students (Participants and Observers) fill out a **Phenomenology Card**:
      *   *Intensity (0–10):* "How strong was the sensation?"
      *   *Unpleasantness (0–10):* "How much did you mind it?"
      *   *Tokens Spent:* (0–4).

  ### Guaranteeing Divergence
  *   **Why it works:** Some students view fatigue as a challenge (High Intensity, Low Unpleasantness, 0 Tokens Spent). Some view it as anxiety-inducing (Moderate Intensity, High Unpleasantness, 2+ Tokens Spent).
  *   **Data Collection:** Collect cards anonymously. Tally on the board immediately:
      *   Column A: Avg Intensity Rating.
      *   Column B: Avg Unpleasantness Rating.
      *   Column C: Avg Tokens Spent.
  *   **The Conflict:** Look for students who rated Unpleasantness high (e.g., 8/10) but spent 0 tokens. Ask them (voluntarily): "You said you minded it a lot, but you didn't pay to stop. Which verdict is true?"

  ### Fallback: The Cognitive Strain (If Physical Round Fails)
  *   **Trigger:** If >90% of the class spends 0 tokens and rates Low Unpleasantness (the stimulus was too weak).
  *   **Procedure:** Immediately switch to a 3-minute task.
  *   **Task:** Solve 10 anagrams that are secretly impossible to solve within the time limit, while a metronome ticks loudly at 120bpm.
  *   **Trade:** Same token system. 1 Token = 30 seconds less of ticking.
  *   **Why it works:** This induces frustration (affective) without physical pain. Divergence usually appears here between those who find it "intense focus" vs. "aggravating noise."

  ---

  ## 2. Second Round: The Triage Dossiers

  **Objective:** Force committees to adopt a rule for "what makes pain bad" that breaks when applied to specific cases.

  ### Setup
  *   **Groups:** 3 Committees of 5–6 students.
  *   **Scenario:** You are the hospital ethics board. You have funding to treat **only 2** of the 4 patients below. All have tissue damage. All require the same resource.
  *   **Instruction:** Rank the patients 1–4 (1 = Treat First). You must write down the **Rule** you used to decide (e.g., "Treat the one who reports the most pain").

  ### The Dossiers
  *(Note to Facilitator: Read the "Scripted Lines" aloud to the class before they break into groups to ensure uniform understanding. Mark invented details clearly.)*

  **Patient 1: "Alex" (The Target Case)**
  *   **Clinical Status:** Deep laceration on hand. Nerve signals firing normally.
  *   **Report:** "I feel the cut clearly. It is sharp. It is a 9/10 for intensity."
  *   **Affect/Behavior:** Smiling. Watching TV. Makes no move to protect the hand. Says: "It doesn't bother me. I don't need morphine."
  *   **Scripted Line:** "I know it's damaged, but the sensation itself isn't bad. It's just information."
  *   *[Invented Detail: Alex claims to sleep soundly despite the injury.]*

  **Patient 2: "Jordan" (The Stoic)**
  *   **Clinical Status:** Identical laceration to Alex.
  *   **Report:** "This is agony. It is a 9/10 for intensity and 9/10 for unpleasantness. Please help."
  *   **Affect/Behavior:** Calm voice. No facial grimacing. Heart rate normal. Continues working.
  *   **Scripted Line:** "I am suffering terribly, but I will not let it show. Treat me because I say it hurts."
  *   *[Invented Detail: Jordan has a history of high pain tolerance but claims high suffering.]*

  **Patient 3: "Casey" (The Expressive)**
  *   **Clinical Status:** Minor bruising, no nerve damage.
  *   **Report:** "It's a dull throb. Maybe 3/10 intensity. 2/10 unpleasantness."
  *   **Affect/Behavior:** Crying loudly. Guarding the limb. Demanding immediate treatment.
  *   **Scripted Line:** "I know it's small, but I can't handle the feeling. It scares me."
  *   *[Invented Detail: Casey has high health anxiety.]*

  **Patient 4: "Taylor" (The Refuser)**
  *   **Clinical Status:** Severe infection causing necrosis.
  *   **Report:** "This is hell. 10/10 everything. It is destroying me."
  *   **Affect/Behavior:** Withdrawn, depressed.
  *   **Decision:** Refuses treatment. "The pain reminds me I'm alive. If you fix the pain, I lose myself."
  *   **Scripted Line:** "It is objectively bad for my body, but subjectively necessary for my identity."
  *   *[Invented Detail: Taylor is competent to make medical decisions.]*

  ### The Payoff Scheme (The Trap)
  *   **Rule: Trust Report.** You must treat Taylor (10/10) and Jordan (9/10). You leave Alex (9/10 intensity, 0 unpleasantness) untreated.
      *   *Punishment:* Alex has tissue death occurring. Ignoring Alex because "they don't mind" seems medically negligent.
  *   **Rule: Trust Behavior/Disposition.** You must treat Casey (Crying) and Taylor (Withdrawn). You leave Jordan untreated (Calm).
      *   *Punishment:* Jordan explicitly reported agony. Ignoring a verbal report of agony because they look calm violates autonomy.
  *   **Rule: Trust Physiology (Tissue Damage).** You must treat Taylor (Necrosis) and Alex/Jordan (Laceration). You leave Casey (Bruise).
      *   *Punishment:* Casey is in genuine distress (by report). Letting someone suffer distress because their tissue is safe treats pain as merely instrumental, contradicting the idea that pain is *intrinsically* bad.
  *   **Rule: Trust Autonomy.** You must treat Jordan (Requests) and Casey (Requests). You leave Taylor (Refuses) and Alex (Doesn't request).
      *   *Punishment:* Taylor will die (necrosis). Alex will lose hand function. Respecting autonomy leads to physical ruin.

  *There is no clean solution. The committees must argue.*

  ---

  ## 3. Logistics and Timeline (75 Minutes)

  | Time | Activity | Board Work |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Consent.** Explain safety. Distribute consent slips. Separate Participants/Observers. | "Voluntary. Stop anytime." |
  | **10–25** | **Round 1 (Live).** The Static Hold. Token spending. Rating Cards. Tally results on board. | Col 1: Intensity. Col 2: Unpleasantness. Col 3: Tokens Spent. |
  | **25–30** | **Transition.** Brief comment on the divergence in Round 1 data. "Who was right about your pain?" | "Report vs. Action." |
  | **30–55** | **Round 2 (Dossiers).** Read scripts. Break into 3 groups. Rank patients. Write the Rule. | "Budget: Treat 2 of 4." |
  | **55–70** | **Debrief.** Reveal syndrome. Map the three readings. Force identification of authority shifts. | "1. Sensation w/o Badness. 2. Not Pain. 3. Badness Ignored." |
  | **70–75** | **Closing.** Limitations of the activity. | |

  **Materials List:**
  *   10–12 identical hardcover books (heavy).
  *   80 Poker chips or paper tokens.
  *   Consent slips (2 versions: Participant/Observer).
  *   Phenomenology Cards (small slips for Intensity/Unpleasantness/Tokens).
  *   Printed Dossiers (1 set per group).
  *   Whiteboard markers.

  **Group Sizes:** 3 Groups of 5–6. (If 14 students, two groups of 5, one of 4).

  ### 50-Minute Cut-Down Version
  *   **00–05:** Consent & Intro.
  *   **05–15:** Round 1 (Reduce hold time to 60 seconds; reduce tokens to 2).
  *   **15–35:** Round 2 (Reduce to 3 Patients: Alex, Jordan, Taylor. Remove Casey. Budget: Treat 1 of 3).
  *   **35–50:** Debrief (Focus strictly on Alex vs. Jordan).

  ---

  ## 4. Debrief Script

  **Step 1: The Reveal**
  > "In Round 2, Patient Alex describes a state that feels like pain but lacks the 'badness' usually associated with it. In clinical literature, this condition is called **Pain Asymbolia**."

  **Step 2: The Clinical Picture**
  > "Standard description only: These patients recognize and localize noxious stimuli. They can say 'that is a needle.' But they show absent or inadequate emotional and motor responses. They do not withdraw. They appear unconcerned. They fail to learn protective responses. Associated brain damage invariably includes the **insular cortex**."

  **Step 3: Mapping the Readings**
  > "Your committees had to rank Alex. In doing so, you implicitly chose one of three philosophical readings. I want each group to identify which reading their Rule required."

  1.  **Reading A (The Separatist):** "Alex has genuine pain, but it lacks the component that makes pain bad."
      *   *Commitment:* You treated Alex lower priority than Jordan. You accepted Alex's report that it wasn't bad.
      *   *Authority:* Subject's Report of Unpleasantness.
  2.  **Reading B (The Attitude/Identity View):** "Alex does not have pain at all. The reports are an artifact of a broader loss of affect."
      *   *Commitment:* You treated Alex as 'not injured' or 'low priority' because pain *just is* the suffering. No suffering = no pain.
      *   *Authority:* Observer's Definition of Pain.
  3.  **Reading C (The Objective Badness):** "Alex has genuine, genuinely bad pain, but the badness is a fact about the state they cannot act on or acknowledge."
      *   *Commitment:* You treated Alex *high* priority despite their report, because tissue damage + sensation = bad, regardless of their mood.
      *   *Authority:* Observer's Verdict on Welfare.

  **Step 4: The Shift**
  > "Look at your Round 1 data. Did you judge your own pain by your Report or your Token Spending? If you spent 0 tokens but rated Unpleasantness 8/10, you acted like Reading C (Objective Badness/Endurance) but reported like Reading A.
  >
  > **The Trap:** In Round 1, you were the Authority. In Round 2, you were the Observer. When did you shift? Did you trust Alex's report more than you trusted your own rating card? Why?"

  ---

  ## 5. Troubleshooting: Predictable Failures

  **1. Students Guessing the Point Early**
  *   *Risk:* A student mentions "asymbolia" or "lobotomy" during Round 2.
  *   *Handling:* "That is an interesting hypothesis. For the purpose of the exercise, treat the dossier as a complete description. Do not import outside diagnoses until the debrief."

  **2. The Stimulus Reads as Amusing**
  *   *Risk:* The class laughs during the Book Hold; no one feels aversion.
  *   *Handling:* Pivot immediately to the **Cognitive Strain Fallback**. Do not force the physical hold if the room energy is frivolous. Acknowledge: "The stimulus failed to generate aversion. This proves the point: sensation without aversion is not 'pain' in the philosophical sense we are testing. Let's try the cognitive task."

  **3. A Committee Finds a "Perfect" Rule**
  *   *Risk:* A group says "We treat based on Long-Term Survival Probability," escaping the pain dilemma.
  *   *Handling:* "That is a triage rule, not a theory of pain. I am asking you: Is Alex's state *bad*? If you prioritize survival over Alex's report, you are saying Alex's state is objectively bad despite their denial. You have chosen Reading C."

  **4. The Override Question Collapses**
  *   *Risk:* Quick consensus that "Alex needs help because tissue damage is bad."
  *   *Handling:* Press the phenomenology. "If Alex feels no badness, and learns no lesson from the damage, in what sense is the *pain* bad? Or is only the *damage* bad? Distinguish the sensation from the wound."

  **5. Distress (Chronic Pain/Injury)**
  *   *Risk:* A student opts in, then feels genuine pain/panic during the hold.
  *   *Handling:* **Immediate De-escalation.** "Drop the book. You are done. Observer Role now." Do not ask them to fill out the card immediately. Check in privately after class.
  *   *Prevention:* The Consent Protocol must be read *before* books are distributed. Emphasize: "Your grade does not depend on holding the book."

  ---

  ## 6. Closing Note: Limitations of the Activity

  **Facilitator's Private Reflection (To be shared verbally at the very end):**
  > "We must be clear about what this game did not do.
  >
  > 1.  **Temporary vs. Permanent:** Your discomfort was bounded and safe. You knew it would end. Alex's condition is a permanent lesion. The 'badness' of pain often lies in the fear that it will not stop. You cannot simulate that fear ethically in a classroom.
  > 2.  **Capacity to Learn:** Alex fails to learn protection. You learned nothing from the book hold because there was nothing to learn. The clinical danger of asymbolia is not the feeling, but the self-destruction that follows.
  > 3.  **The 'Badness':** In this room, 'badness' was a token cost. In the clinic, 'badness' is a life narrowed.
  >
  > We used this activity not to solve the philosophy of pain, but to locate the moment you stopped trusting the subject and started trusting the observer. That shift is where the philosophy lives."

