answer: |-
  ## The Internal Resource Allocation Procedure (IRAP)

  **Purpose:** To determine the mechanism for allocating a specific shared resource (Queue, Shadow Price, Internal Market, or Executive Decision).
  **Owners:** Shared Services Lead (You) + One Analyst.
  **Timebox:** 4 hours per resource.
  **Review:** Quarterly or upon resource introduction.
  **Approvers:** COO (Authority), Finance Business Partner (Valuation).

  ---

  ### Part 1: The Decision Gates

  Run the resource through these five gates in order. A "No" at any gate directs you to a specific allocation mechanism. Document the evidence for each answer.

  #### Gate 1: The Scarcity Test
  **Question:** Is demand consistently exceeding supply, creating a queue or wait time that impacts operations?
  *   **Evidence Required:** Utilization logs (>85% sustained), wait-time reports, or documented incidents of turned-away demand in the last 90 days.
  *   **If No:** **Mechanism = Free Access (Rules).** Do not price or queue. Monitor quarterly. *Stop.*
  *   **If Yes:** Proceed to Gate 2.
  *   **[Judgment Call]:** If data is spotty, estimate based on depot manager interviews. Mark this estimate in the memo.

  #### Gate 2: The Mises Test (Comparability)
  **Question:** Can Finance map the usage of this resource to a common unit of value (e.g., margin, cost avoidance, throughput) for *all* requesting departments?
  *   **Evidence Required:** A Finance sign-off confirming that 1 unit of resource used by Dept A can be mathematically compared to 1 unit used by Dept B in terms of P&L impact.
  *   **If No:** **Mechanism = Administrative Queue (Committee).** You cannot price what you cannot compare. Pricing will create false signals. Allocation must be based on strategic priority. *Stop.*
  *   **If Yes:** Proceed to Gate 3.
  *   **[Judgment Call]:** Finance may claim they can compare things they actually can't (e.g., comparing "brand safety" to "revenue"). If the metric feels forced, mark it as a risk.

  #### Gate 3: The Hayek Test (Information Location)
  **Question:** Does the central office know *when* and *how much* of the resource is needed, or does that knowledge reside with the users and change faster than you can update a schedule?
  *   **Evidence Required:** Variance analysis. If forecast error >20% or lead time for requests is <48 hours, the Center does not know.
  *   **If Center Knows:** **Mechanism = Administrative Queue (Rules).** Central planning is efficient here. No need for price signals. *Stop.*
  *   **If Edge Knows:** Proceed to Gate 4.
  *   **[Judgment Call]:** Distinguish between "they won't tell us" (political) and "they literally don't know until Tuesday" (tacit). Only the latter passes this gate.

  #### Gate 4: The Coase Test (Transaction Costs)
  **Question:** Is it cheap and easy for two internal departments to trade this resource between themselves without your team's involvement?
  *   **Evidence Required:** Can Dept A transfer a slot/hour to Dept B in the ERP system with <15 minutes of admin work? Is there a mechanism to prevent double-booking?
  *   **If No (High Friction):** **Mechanism = Shadow Price (Lange).** You set the price. You adjust it quarterly based on surplus/shortage. Departments pay you, they don't trade. *Stop.*
  *   **If Yes (Low Friction):** Proceed to Gate 5.

  #### Gate 5: The Strategic Override (Values)
  **Question:** Is there a non-economic reason (safety, compliance, strategic market entry) why the highest bidder should *not* win this resource?
  *   **Evidence Required:** Reference to corporate strategic plan, safety manual, or regulatory requirement.
  *   **If Yes:** **Mechanism = Executive Decision.** Reserve a portion of capacity for strategic use; price the remainder. *Stop.*
  *   **If No:** **Mechanism = Internal Market.** Departments trade amongst themselves. You provide the ledger; you do not set the price. *Stop.*

  ---

  ### Part 2: Theory Adaptation (What We Keep and Drop)

  To make this runnable in half a day, we have stripped the economic theory of its philosophical weight and kept only the operational heuristics.

  **What We Keep:**
  1.  **Mises's Common Unit:** We keep the requirement for a common denominator of value. If Finance cannot equate the value of the resource across users, a price is a lie.
  2.  **Hayek's Local Knowledge:** We keep the test for where information lives. If the data is local and volatile, central scheduling fails.
  3.  **Lange's Trial and Error:** We keep the mechanism of adjusting prices based on observed slack or queues (utilization data) rather than theoretical cost-plus models.
  4.  **Coase's Transaction Costs:** We keep the friction check. If trading costs more than the efficiency gain, don't trade.

  **What We Drop:**
  1.  **Equilibrium:** We do not expect to find a "correct" price. We only look for "clearing" (utilization between 85-95%).
  2.  **Rational Actors:** We assume departments will act in their self-interest, but we acknowledge political behavior (shouting loudest) is a feature, not a bug, to be managed by the mechanism.
  3.  **Private Property:** We are not transferring ownership, only usage rights. This simplifies the legal/HR overhead.

  **What Is Lost:**
  By dropping the requirement for true equilibrium and ownership, we lose the long-term investment signal. A department might overuse a resource because they don't own the asset, only the time. This procedure optimizes *flow*, not *capital investment*. You will still need a separate CapEx process for buying more forklifts or building more cold storage.

  ---

  ### Part 3: Where the Analogy Breaks Down (Firm vs. Economy)

  You are not running a national economy. You are running a firm. The analogy breaks in three places you must account for when presenting to the COO:

  1.  **Authority vs. Price:** In an economy, price is the only coordinator. In a firm, a boss can say "do this." If the procedure recommends a Market or Price, but the COO issues a directive, the directive wins. The procedure identifies the *efficient* method; the COO confirms the *authorized* method.
  2.  **Unified Goal:** In an economy, participants have different goals. In your firm, everyone theoretically aims for the same profit. However, sub-optimization (Dept A winning at the expense of Company B) is a risk. Gate 5 (Strategic Override) exists specifically to patch this hole.
  3.  **Exit:** In an economy, if prices are too high, a buyer leaves. In your firm, the retail division cannot "leave" the cold storage; they are captive. This makes the Shadow Price (Lange) model dangerous if set too high, as it becomes a tax rather than a signal. Finance must validate that rates do not exceed external market alternatives.

  ---

  ### Part 4: Case Runs

  Here is the procedure applied to your three specific resources.

  #### Case 1: Refrigerated Dock Slots & Trailer Parking (Busiest Depots)
  *   **Gate 1 (Scarcity):** **Yes.** Utilization at 98%, trucks turning away during peak season.
  *   **Gate 2 (Mises):** **Yes.** Finance can compare the cost of a truck waiting (demurrage + spoilage risk) across all departments. Common unit: Cost per Hour of Delay.
  *   **Gate 3 (Hayek):** **Edge Knows.** Depot managers know when trucks arrive, but HQ cannot schedule this centrally. Demand fluctuates daily.
  *   **Gate 4 (Coase):** **High Friction.** Dept A cannot easily "give" a dock slot to Dept B once the truck is at the gate. System doesn't support real-time swapping between cost centers.
  *   **Gate 5 (Strategy):** **No.** No strategic reason to favor one product line over another for docking.
  *   **Recommendation:** **Shadow Price (Lange).**
      *   **Action:** Keep the chargeback, but change the *method*. Move from an annual budgeted rate to a dynamic peak/off-peak rate.
      *   **Adjustment Rule:** If fill rate >95% for 2 weeks, raise price by 10%. If <80%, lower by 10%.
      *   **Finance Defense:** Rates are capped at external 3PL market rates to prevent "captive tax."

  #### Case 2: Platform Engineering Team Hours
  *   **Gate 1 (Scarcity):** **Yes.** Backlog exceeds capacity by 3x.
  *   **Gate 2 (Mises):** **No.** Finance cannot compare the value of a Marketing website feature (revenue) vs. an Ops stability fix (cost avoidance) vs. a Compliance update (risk). There is no common unit of value for code.
  *   **Gate 3 (Hayek):** **Edge Knows.** Engineers and requesters know the value; HQ does not.
  *   **Gate 4 (Coase):** **High Friction.** Trading engineering hours between departments creates code dependency nightmares.
  *   **Gate 5 (Strategy):** **Yes.** Compliance and Security must trump Revenue features.
  *   **Recommendation:** **Administrative Queue (Committee).**
      *   **Action:** **Tear out the chargeback.** Stop billing hours. It creates false accounting without influencing behavior (as you noted).
      *   **Allocation:** Use a weighted priority score (Compliance = 10x, Revenue = 1x). A steering committee allocates sprint capacity quarterly.
      *   **Finance Defense:** Billing engineering hours is allocative fiction. We are moving to cost-center funding with priority gating. This reduces administrative overhead of tracking billable minutes.

  #### Case 3: Cold-Storage Capacity (Billed to Retail Divisions)
  *   **Gate 1 (Scarcity):** **Yes.** New constraint, capacity full.
  *   **Gate 2 (Mises):** **Yes.** Both divisions are retail. Value is Gross Margin per Pallet.
  *   **Gate 3 (Hayek):** **Edge Knows.** Divisions know their promotions and sales spikes better than Shared Services.
  *   **Gate 4 (Coase):** **Low Friction.** Inventory system can track pallet ownership. Divisions can transfer pallet slots internally.
  *   **Gate 5 (Strategy):** **No.** Pure commercial decision.
  *   **Recommendation:** **Internal Market.**
      *   **Action:** **Tear out the central chargeback rate.** Allow Division A to sublease unused cold storage to Division B at a price *they* negotiate.
      *   **Role of Shared Services:** You provide the ledger and enforce the physical capacity cap. You do not set the price.
      *   **Finance Defense:** Central pricing failed to clear the market (slack exists in some areas, queues in others). Letting divisions trade reveals the true marginal value of cold storage without central intervention.

  ---

  ### Part 5: What This Procedure Cannot Decide

  This tool is a mechanism selector, not a strategy generator. It will not solve the following:

  1.  **Power Struggles:** If the VP of Sales refuses to accept a dock slot price because they believe they are "more important," this procedure gives you data, but the COO must enforce the consequence.
  2.  **Capital Investment:** If the Shadow Price for dock slots stays at maximum for four quarters, this procedure tells you to *keep pricing*, not to *build more docks*. You need a separate CapEx trigger (e.g., "If max price hits 3x external rate for 6 months, trigger construction project").
  3.  **Cultural Honesty:** If departments hide demand to avoid the price (Gate 3 failure), the data will be corrupted. This procedure assumes users want the resource enough to reveal their need.
  4.  **The "Fairness" Trap:** Finance may argue that Internal Markets (Case 3) favor the richer division. This procedure optimizes for *efficiency*, not *equity*. The COO must decide if equity is a constraint.

  **Monday Morning Instruction for Analyst:**
  "Pull the last 90 days of utilization data for these three resources. Schedule 30 minutes with Finance to ask Gate 2 (Comparability) for each. Draft the memo using the Gate structure. If Finance says 'Yes' to comparability on Engineering Hours, flag it as a Judgment Call risk. I will take the recommendation to the COO."
