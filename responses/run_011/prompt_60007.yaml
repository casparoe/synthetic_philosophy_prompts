answer: |-
  **POLICY ID:** HR-AB-004
  **SUBJECT:** Above & Beyond Recognition Program (A&BRP)
  **EFFECTIVE:** Q3 Fiscal Year

  **DEFINITIONS**
  | Term | Administrative Definition |
  | :--- | :--- |
  | **Duty Baseline** | The median performance metric established quarterly by the Calibration Committee. |
  | **Supererogatory Act** | Conduct exceeding the Duty Baseline that incurs measurable cost to the employee. |
  | **Suberogatory Conduct** | Performance below the Duty Baseline but within permissible employment thresholds. |

  **1. ELIGIBILITY AND BASELINE CALIBRATION**
  To qualify for recognition, an act must exceed the current Duty Baseline. The Baseline is recalibrated each quarter to reflect the average output of all award recipients from the previous period. Consequently, acts recognized in Q1 shall constitute the minimum Duty Baseline for Q2. Past awards remain valid for tax purposes but are reclassified as standard compliance in future performance reviews. Employees must submit proof that their effort was not reasonably expected given the updated Baseline.

  **2. COST DOCUMENTATION**
  Petitioners must document the personal cost incurred during the Supererogatory Act (e.g., unpaid hours, stress-related leave, personal funds expended). If an act incurred zero measurable cost, the employee must submit a narrative explaining why the act was difficult despite the lack of cost. Zero-cost acts are subject to enhanced scrutiny to ensure they were not simply efficient performance of standard duty.

  **3. AWARD TIERS AND EXPECTATION MIGRATION**
  The program consists of Bronze, Silver, and Gold tiers. Upon completion of a fiscal year, all Gold-tier behaviors are automatically migrated into the Duty Baseline for the following year. To prevent infinite escalation, a Containment Clause limits the Baseline increase to 15% per annum. Any effort exceeding the 15% cap is considered operationally unsustainable and will not be recognized, as it disrupts workforce planning.

  **4. SUBEROGATORY CONDUCT**
  The A&BRP declines to recognize Suberogatory Conduct. While such conduct (e.g., minimal compliance, avoiding optional collaboration) is not prohibited by the Employee Handbook, it is ineligible for remediation awards. Recognition of merely permissible behavior would dilute the value of supererogatory recognition and create inequity among staff who maintain higher baselines.

  **5. GRIEVANCE PROCEDURE**
  Staff may file a grievance (Form G-4) if they allege that a colleague's award has unfairly raised the Duty Baseline for their role. The Committee will review whether the award created an implicit requirement for peers. If the grievance is upheld, the original award is downgraded to a standard performance metric, and the recipient is notified that their heroics are now mandatory for all.

  **FAQ**
  **Q: Does accepting an award create a contractual obligation to repeat the act?**
  **A:** No. However, failure to repeat the act may result in a performance review rating below the new Duty Baseline. Employees are advised that while repetition is not contractually binding, consistency is required to maintain the revised Baseline.

  **Q: Can I be rewarded for fixing a mistake I made?**
  **A:** No. Remediation of self-created errors is considered standard duty.

  **ADMINISTRATIVE NOTE: Q3 BUDGET STATUS**
  Please be advised that the Q3 recognition budget has lapsed unspent. Following the migration of Q2 Gold-tier behaviors into the Q3 Duty Baseline, all submitted nominations were classified as standard compliance. Under the program's own definition, no eligible act occurred. Management is currently reviewing whether to lower the Baseline to facilitate eligibility or accept that excellence has been fully standardized.

  **APPROVED BY:** Human Resources Compliance
  **REVIEW DATE:** Pending Baseline Adjustment
