answer: |-
  To answer your core concern immediately, her second use of the phrase only licenses withholding help if you accept a controversial moral claim that conflates causal responsibility with moral desert, and even then, it contradicts the fundamental premise of mutual aid. What follows is a breakdown of the distinct claims hidden inside that proverb, moving from the mundane to the metaphysical, so you can see exactly where the logic holds and where it breaks.

  The most deflationary reading is simply a platitude about social reciprocity and prudent conduct. Under this view, the claim is empirical and sociological: if you treat people poorly, they or others will eventually treat you poorly in return. This is generally true as a rule of thumb about human relationships and reputation, though it admits many exceptions where power asymmetries allow bad actors to escape consequences. This version functions as advice on how to conduct yourself to avoid future trouble, but it cannot support your volunteer's second use because it describes a social mechanism, not a moral obligation for bystanders. It says nothing about whether we should intervene when someone else is suffering the consequences of their own bad social choices, only that making bad choices is risky.

  Slightly less deflationary is the psychological reading, which suggests that the consequence of bad action is internal rather than external. Here the claim is that hurting others or living destructively corrodes the actor's own character or peace of mind, so the suffering they experience is a natural manifestation of their internal state. This is a plausible psychological hypothesis, often true but not universally so, as some people thrive on destruction without apparent remorse. Even if true, this reading fails to license withholding aid because it frames the suffering as a symptom to be treated rather than a penalty to be endured. It might explain why the client is in pain, but it does not argue that alleviating that pain would be morally wrong or futile.

  The reading your volunteer is almost certainly relying on is the thesis of moral desert, which shifts from description to prescription. This claim asserts that suffering is not just a consequence of bad actions but a justified response to them, meaning the person in pain deserves that pain. This is a normative ethical claim rather than an empirical one, and its truth value is philosophically contentious depending on your view of free will and redemption. This is where the first critical slide occurs: the argument moves from he caused this situation to he deserves this situation. Causal responsibility does not automatically entail moral desert, especially in the context of addiction or mental health, but the phrase treats them as identical. If you accept this premise, it logically follows that intervening to fix the situation would be unjust because it would deny the person their just due. This is the only reading that attempts to license her refusal to help, but it requires accepting that suffering is primarily retributive rather than something to be alleviated.

  Beyond desert lies the ambitious empirical hypothesis that the universe operates like a closed moral ledger governed by natural law. This claim posits that there is a mechanical force ensuring outcomes match actions without any need for a divine administrator. This is empirically false given the observable frequency of unjust outcomes in the world, which is why people often have to stretch the timeline to make it fit. When the volunteer used the phrase about the landlord, she was treating this as a true empirical claim about how reality works, celebrating the back-tax bill as evidence of the mechanism functioning. However, because this claim is falsifiable and largely falsified by observation, it cannot serve as a reliable foundation for policy decisions about who deserves aid.

  The most ambitious reading pushes the accounting into the unfalsifiable realm of transgenerational or trans-temporal justice. Here the claim is that if the ledger does not balance in this life, it will balance through the actor's children, their next life, or via a god keeping the books. This is a theological or metaphysical commitment that is unfalsifiable but doing something useful for the believer, usually providing comfort or a sense of order in a chaotic world. The slippage here is subtle but vital: it slides between who sows and who reaps. If the client's children pay for his gambling, the universe has balanced the books, but the client himself has not suffered the consequence, undermining the idea that he is learning a lesson. If the balance happens in a next life, it is irrelevant to our current ethical obligations. This reading cannot license withholding aid because the timing and location of the reckoning are unknown, making any attempt to align our actions with cosmic justice purely speculative.

  The reason you felt stuck in the conversation is that the phrase allows the speaker to slide between these registers without declaring which one is in play. When challenged on the empirical reality that bad people often prosper, the speaker can retreat to the metaphysical claim that justice will happen later. When challenged on the morality of letting someone suffer, the speaker can retreat to the empirical claim that intervention is futile because the universe will fix it anyway. The most damaging slide, however, is between is and ought. The phrase sounds like a prediction of what will happen, which lends it the weight of a natural law, but it is often used to endorse what should happen. By saying what goes around comes around, your volunteer is not just predicting that the client will suffer; she is implying that his suffering is appropriate and that our interference would be unnatural.

  Ultimately, the only reading that licenses her second use is the moral desert thesis, which asserts that suffering is a justified penalty for past actions and that alleviating it violates a moral order. This is incompatible with the ethos of mutual aid, which is predicated on the idea that need creates obligation regardless of desert. If your group operates on the principle that help is contingent on moral purity or causal innocence, you are no longer doing mutual aid; you are doing moral arbitration. You can push back by pointing out that the phrase conflates cause with desert, and that even if the client caused his crisis, your mission is to address the crisis rather than adjudicate the morality of its origins. The phrase is a conversation stopper because it invokes a cosmic authority that overrides human compassion, but in a secular mutual-aid context, that authority does not exist.
