answer: |-
  # DETERMINATION PROTOCOL: STATUTORY FITNESS FOR HABITATION

  **Authority:** Standards and Appeals Function, Housing Regulator
  **Effective:** Immediate
  **Applicability:** All Field Inspectors and Duty Officers

  ## 1. THE ORDERED PROCEDURE

  Inspectors must follow this sequence. Do not skip steps. Do not return to a previous step once passed unless new evidence emerges.

  **Step 1: Evidence Capture (Fact)**
  *   **Action:** Record all physical measurements, environmental readings, and occupant health declarations.
  *   **Sufficient Answer:** Data is recorded with instrument error margins noted.
  *   **Termination:** If data cannot be gathered (access denied), terminate with "Unable to Determine" and refer to Enforcement.
  *   **Metaphysical Status:** Truth-Tracking.

  **Step 2: The Clear Case Check (Epistemic)**
  *   **Action:** Compare evidence against the Published Guidance Values (see Section 4).
  *   **Question:** Does the evidence fall *clearly outside* the Guidance Value band (above the upper limit for defects, below the lower limit for safety)?
  *   **Sufficient Answer:** Yes/No.
  *   **Termination (Fitness):** If evidence is clearly better than the Guidance Value *and* no contrary health evidence exists → **FINDING OF FITNESS**.
  *   **Termination (Unfitness):** If evidence is clearly worse than the Guidance Value → **FINDING OF UNFITNESS**.
  *   **Metaphysical Status:** Truth-Tracking (operating on a presumption).

  **Step 3: The Imprecision Check (Measurement)**
  *   **Action:** If the evidence falls *within* the Guidance Value band, assess measurement reliability.
  *   **Question:** Can further measurement reduce the error margin enough to move the reading *outside* the band?
  *   **Stop Rule:** If the instrument error margin is wider than the distance between the reading and the nearest Guidance Value limit, **STOP MEASURING**. Further measurement cannot improve the determination even in principle.
  *   **Metaphysical Status:** Neutral (Technical constraint).

  **Step 4: The Vulnerability Assessment (Risk Context)**
  *   **Action:** Assess occupant health status against the specific defect.
  *   **Question:** Does the specific health profile of the occupants convert a marginal defect into a serious risk?
  *   **Sufficient Answer:** Documented medical evidence or statutory declaration linking the specific defect to the specific condition.
  *   **Termination:** If vulnerability elevates the risk to "unacceptable" despite marginal readings → Proceed to Step 5 (Unfitness track). If no vulnerability → Proceed to Step 5 (Fitness track).
  *   **Metaphysical Status:** Truth-Tracking (Causal link).

  **Step 5: The Borderline Determination (Sharpening)**
  *   **Action:** If the case remains in the Guidance Value band after Step 3, and Step 4 does not resolve it, the officer must apply a **Sharpening Rule**.
  *   **Question:** Applying the Authority's adopted policy for borderline cases (see Section 7), does the precautionary principle require intervention?
  *   **Termination:** This step terminates the inspection.
  *   **Hand-Off:** If the officer is unsure how to apply the Sharpening Rule, or if the case triggers the "Zone of Prudence" (Section 7), the file is handed to the **Duty Officer**. The Duty Officer makes the final call. If the Duty Officer is unsure, the file is handed to the **Director**.
  *   **Metaphysical Status:** Stipulative.

  ---

  ## 2. METAPHYSICAL STATUS OF STAGES

  | Stage | Status | Explanation of View Embedded | Compatibility with Opposite View |
  | :--- | :--- | :--- | :--- |
  | **Step 1 (Evidence)** | Truth-Tracking | Assumes facts about the dwelling exist independently of our judgment. | Compatible. Both views require facts to judge. |
  | **Step 2 (Clear Case)** | Truth-Tracking (Presumptive) | Assumes Guidance Values track the true boundary closely enough for clear cases. | **Epistemic:** Fully compatible (values approximate truth). <br> **Supervaluation:** Compatible (values act as a focal point for precisification). |
  | **Step 3 (Imprecision)** | Neutral | Acknowledges physical limits of instruments. | Compatible. Both views accept physical measurement limits. |
  | **Step 4 (Vulnerability)** | Truth-Tracking | Assumes causal relationships between defect and health are factual. | Compatible. Both views accept causal facts. |
  | **Step 5 (Borderline)** | **Stipulative** | **Assumes the boundary is not found, but set.** This protocol adopts the **Supervaluationist/Sharpening** view for borderline cases. | **Epistemic:** Incompatible in theory (Epistemicists believe there is a truth to find), but **functionally compatible** because the Epistemicist admits they *cannot know* the truth in this zone. The protocol forces a decision where knowledge is impossible. |

  **Note on Conflict:** Where Step 5 produces different conduct than the Epistemic view would prefer (choosing vs. finding), the Protocol mandates **choosing**. The organisation prioritises legal defensibility and consistency over metaphysical accuracy in the borderline zone.

  ---

  ## 3. INDETERMINACY VS. IMPRECISION

  Officers must distinguish between "We don't know the number" (Imprecision) and "The number doesn't decide the case" (Indeterminacy).

  **Configuration A: Imprecision Only**
  *   *Scenario:* The standard is clear (e.g., "crack > 10mm is serious"), but the instrument cannot distinguish between 9.8mm and 10.2mm.
  *   *Action:* **Measure Again.** Use a more precise tool or average multiple readings. Do not make a policy decision yet.
  *   *Rationale:* The standard is determinate; our access to it is flawed.

  **Configuration B: Indeterminacy Only**
  *   *Scenario:* The measurement is precise (exactly 10.0mm), but the standard ("serious crack") does not specify if 10.0mm is serious.
  *   *Action:* **Apply Sharpening Rule (Step 5).** Do not measure again. Measurement adds no value.
  *   *Rationale:* The fact is known; the rule is incomplete.

  **Configuration C: Coincidence (Normal Case)**
  *   *Scenario:* The measurement is imprecise (10mm ± 1mm) *and* the standard is indeterminate (is 10mm serious?).
  *   *Action:* **Invoke Stop Rule (Step 3).** If the error margin overlaps the plausible boundary, cease measurement. Proceed to Sharpening Rule (Step 5).
  *   *Rationale:* Further measurement cannot resolve the indeterminacy of the standard, and the imprecision prevents epistemic certainty. Treat as a Borderline Case.

  ---

  ## 4. DECISION ON THRESHOLDS

  **Decision:** The Authority **WILL PUBLISH** numeric criteria as "Guidance Values."

  **Justification:**
  While Epistemicism suggests a true boundary exists that numbers might miss, and Supervaluationism suggests numbers are arbitrary stipulations, the legal risk of *unwritten* numbers (as identified in recent appeals) outweighs metaphysical purity. Unwritten rules are procedurally unfair.

  **Status of Published Numbers:**
  *   **Under Epistemic View:** The numbers are **proxies** for the true boundary. They are rebuttable claims about where the truth lies.
  *   **Under Supervaluationist View:** The numbers are **precisifications**. They are announced sharpenings of the vague term "serious."

  **Obligations:**
  1.  **Prospective Application:** New Guidance Values apply only to inspections commenced *after* publication.
  2.  **Review Cycle:** Values are reviewed annually.
  3.  **Superseded Cases:** A dwelling found "Fit" under old values cannot be reopened solely because new values are stricter, unless health risk has materially increased. A dwelling found "Unfit" under old values may be re-inspected if new values are looser, upon owner request.

  **Commitment:** We treat the numbers as **Rebuttable Presumptions**. Meeting the number presumes fitness; exceeding it presumes unfitness. Both presumptions can be overturned by Step 4 (Vulnerability) or Step 5 (Borderline Sharpening).

  ---

  ## 5. REASONS TEMPLATES

  **Rule for Robust Drafting:** Reasons must never state "The number dictates the outcome." Reasons must state "The number, combined with [Risk/Policy], dictates the outcome." This survives review under both conceptions.

  **Template A: The Accuracy Claim (Clear Cases)**
  *   *Use When:* Step 2 (Clear Case Check) is satisfied.
  *   *Drafting:* "The inspection measured [Defect] at [Reading]. This exceeds the Authority's Guidance Value of [Threshold]. Based on the statistical correlation between this reading and health outcomes, the dwelling poses an unacceptable risk. The defect is serious."
  *   *Metaphysical Load:* Implies the reading *reveals* the risk.

  **Template B: The Adopted Sharpening (Borderline Cases)**
  *   *Use When:* Step 5 (Borderline Determination) is invoked.
  *   *Drafting:* "The inspection measured [Defect] at [Reading], which falls within the Authority's borderline band. While this reading does not conclusively establish risk in all cases, the Authority applies a precautionary sharpening of the standard in cases involving [Specific Factor, e.g., children/persistence]. To ensure consistency and protect occupant health, this level of defect is treated as serious for the purposes of this determination."
  *   *Metaphysical Load:* Admits the standard is being *applied/chose*, not just found.

  ---

  ## 6. COMPARATIVE CONSTRAINTS

  **Rule:** If Dwelling A is found Unfit, and Dwelling B is **definitely worse** in the relevant respect, Dwelling B **must** be found Unfit.

  **Establishing "Definitely Worse":**
  1.  **Same Defect Type:** Both must be assessed on the same metric (e.g., mould index, not mould vs. cold).
  2.  **Objective Dominance:** B's readings must exceed A's readings *outside the margin of error*. (e.g., A is 10mm ± 1mm, B is 12mm ± 1mm).
  3.  **Equivalent Vulnerability:** Occupant health profiles must be comparable. If B has healthier occupants, B is not necessarily "worse" in terms of *risk*, even if the *defect* is worse.

  **Procedure:**
  Before signing a "Fitness" determination, the Duty Officer must query the database for recent "Unfitness" determinations in the same geographic/structural cluster. If a comparable dwelling was found Unfit with better metrics, the current determination is stayed for review.

  **Constraint Limit:** This constraint does not apply if the comparison itself is borderline (e.g., B is 10.1mm, A was 10.0mm, error margin is ±1mm). In that case, they are not "definitely worse," and the constraint does not bite.

  ---

  ## 7. TREATMENT OF THE ZONE (THE BAND)

  **Protocol Position:** The Protocol **POSITs** a band.
  We call this the **"Zone of Prudence."** It corresponds to the Guidance Value ± the Instrument Error Margin.

  **Inside the Zone:**
  1.  **Epistemic Acknowledgement:** We acknowledge that within this band, we cannot *know* the true state of fitness (if one exists).
  2.  **Default Rule:** In the Zone of Prudence, the default determination is **UNFITNESS**.
  3.  **Justification:** This is a **Choice**, not a Discovery. It is based on the statutory purpose (protecting health) and the asymmetry of error (harm to occupant vs. cost to owner).

  **Avoiding the Sorites Slide:**
  Does this relocate the Sorites to the edge of the Zone? **Yes.**
  *   *Response:* The protocol accepts this but converts the problem from a *metaphysical* paradox to an *administrative* bright line. The question is no longer "Is this exact millimetre serious?" but "Is this case inside the administrative buffer?"
  *   *Why this works:* The boundary of the Zone is defined by *instrument capability* (a hard fact), not by *semantic vagueness* (a soft fact). We stop the slide at the limit of our ability to measure, not at the limit of language.

  **Hand-Off:** Any case falling in the Zone of Prudence requires the **Duty Officer's** second signature. This ensures the "Unfitness" default is applied consistently as policy, not accidentally as error.

  ---

  ## 8. WORKED DETERMINATIONS

  ### Case (a): The Mouldy Flat
  *   **Facts:** 1st floor flat. Condensation/mould in 2 bedrooms. Adult with asthma. Readings: Humidity 65% (Guidance: 60% serious, 70% critical). Instrument error ±3%.
  *   **Protocol Run:**
      1.  *Evidence:* 65% ± 3%. (Range 62-68%).
      2.  *Clear Case:* No. Range overlaps Guidance (60%) and Critical (70%).
      3.  *Imprecision:* Error margin (3%) is significant relative to the gap. **Stop Measuring.**
      4.  *Vulnerability:* Asthma is documented. Mould is a known trigger.
      5.  *Borderline:* Case is in Zone of Prudence.
  *   **Determination:** **UNFIT.**
  *   **Reasoning (Template B):** "Readings fall within the Zone of Prudence. However, given the documented asthma, the Authority applies a precautionary sharpening. The risk is unacceptable."
  *   **Hand-Off:** Duty Officer must sign (Zone case).
  *   **Status:** Settled by Protocol.

  ### Case (b): The Two Houses (Vulnerability)
  *   **Facts:** Identical houses. Identical mould readings (65% ± 3%). House 1: Immunosuppressed adult. House 2: Healthy family.
  *   **Protocol Run:**
      1.  *Evidence:* Same for both.
      2.  *Clear Case:* No for both.
      3.  *Imprecision:* Stop Measuring for both.
      4.  *Vulnerability:*
          *   House 1: High risk (Infection potential).
          *   House 2: Low/Moderate risk.
      5.  *Borderline:*
          *   House 1: Zone of Prudence + High Vulnerability = **UNFIT**.
          *   House 2: Zone of Prudence + Low Vulnerability = **FIT** (Default to Unfitness in Zone can be overridden if vulnerability is absent and cost of remediation is disproportionate, subject to Duty Officer approval). *Correction:* Per Section 7, Zone default is Unfitness. However, Step 4 allows Vulnerability to *elevate* risk. Does lack of vulnerability *lower* it?
          *   *Protocol Decision:* Yes. The standard is "risk to health." If health is not at risk, the standard is not met.
          *   House 2 Determination: **FIT**.
  *   **Reasoning:** House 1 uses Template B (Sharpening due to vulnerability). House 2 uses Template A (Accuracy claim: risk not established).
  *   **Divergence Check:** An Epistemicist might argue the *house* is either fit or unfit regardless of the occupant. A Supervaluationist argues the *risk* is the standard, so the occupant matters.
  *   **Protocol Resolution:** The Statute says "risk to... occupants." Therefore, **Occupant Vulnerability is part of the Standard.** The two houses *may* lawfully be treated differently.
  *   **Hand-Off:** House 2 (Fitness in the Zone) requires Director review to ensure consistency, as it overrides the Zone Default.
  *   **Status:** Settled by Protocol (Vulnerability is a variable of the standard).

  ### Case (c): The Healthy Child / Low Reading
  *   **Facts:** Readings clearly *below* Guidance (e.g., 50% humidity). Child has respiratory illness. Officer believes home is the cause.
  *   **Protocol Run:**
      1.  *Evidence:* 50% (Clear of Zone).
      2.  *Clear Case:* Reading suggests Fitness.
      3.  *Vulnerability:* Child is ill.
      4.  *Causal Link:* Is there evidence the *dwelling* caused the illness? (e.g., doctor's note linking mould to illness).
      5.  *Decision:* If the only evidence is the illness, but the dwelling metrics are clean: **FINDING OF FITNESS.**
  *   **Reasoning (Template A):** "Measurements are within safe limits. While the occupant is ill, no evidence links the condition to the dwelling's state. The statutory test for unfitness is not met."
  *   **The "Answer I Do Not Want":** The Protocol forces a **FIT** finding. The officer's private belief is insufficient without evidence linking the defect to the harm. To rule Unfit would be to apply a hidden threshold (illness = unfit) which violates the published Guidance Values.
  *   **Hand-Off:** Officer must note "Disagreement with Outcome" in file. Duty Officer reviews. If Duty Officer agrees with Officer, they must identify a *defect* not captured by the metric (e.g., smell, visible spores not measured). If no defect exists, **Fitness stands.**
  *   **Status:** Settled by Protocol (Rule of Law over Discretion).
  *   **Divergence Check:** An Epistemicist officer might say "The metric is wrong, the truth is it's unfit." A Supervaluationist officer might say "We haven't sharpened the rule to cover this."
      *   *Protocol Outcome:* Both must sign "Fit." The Protocol succeeds here by isolating the disagreement: The officer believes the *metric* is flawed, not the *process*. This flags a need to review Guidance Values, not to break the rule in this case.

  ---

  ## 9. LIMITS AND MONITORING

  **What This Protocol Cannot Do:**
  1.  **Eliminate Judgment:** Step 5 (Sharpening) and Step 4 (Vulnerability Causation) remain human judgments. The protocol structures them; it does not automate them.
  2.  **Resolve Metaphysics:** It does not prove whether vagueness is epistemic or semantic. It pragmatically manages the consequences of both.
  3.  **Prevent All Appeals:** It reduces "unreasoned" appeals, but not appeals on the merits of the sharpening.

  **Judgment Calls Dressed as Procedure:**
  *   **Step 4 (Causation):** Deciding if a doctor's note is sufficient to link illness to the home is a judgment call.
      *   *Removal Cost:* Removing this would require medical inspectors, increasing cost by 300%.
  *   **Step 7 (Zone Default):** Choosing "Unfitness" as the default in the Zone is a policy choice.
      *   *Removal Cost:* Removing this (e.g., defaulting to Fitness) would increase health risks and violate the precautionary principle embedded in the statute.

  **Systematic Error Prediction:**
  *   **Direction:** The protocol will **OVER-DECLARE UNFITNESS** in borderline cases (due to the Zone of Prudence default).
  *   **Reason:** The cost of error (sick child) is weighted higher than the cost of enforcement (owner expense) in the Zone logic.
  *   **Migration:** Borderline cases will migrate into the "Unfit" category unless the Duty Officer actively intervenes.

  **Monitoring Plan (First 12 Months):**
  1.  **Zone Usage Rate:** Monitor the percentage of determinations falling into the Zone of Prudence. If this exceeds 20%, the Guidance Values are too narrow and must be widened.
  2.  **Duty Officer Reversal Rate:** Monitor how often Duty Officers overturn the Zone Default (Unfit) to Fitness. If this exceeds 50%, the Default is too aggressive.
  3.  **Appeal Grounds:** Track appeal reasons. If "Unreasoned" drops but "Unreasonable" (merits) rises, the protocol is working (process is clear, but policy is contested). If "Unreasoned" stays high, the Templates are not being followed.
  4.  **Vulnerability Variance:** Compare Unfitness rates for vulnerable vs. non-vulnerable households in identical dwellings. If the variance is 0%, officers are ignoring Step 4. If the variance is 100%, officers are over-applying Step 4. Target variance is 40-60%.

  **Final Instruction:**
  This protocol is binding. Inspectors who believe a determination is morally wrong but procedurally correct must issue the determination and file a "Standards Variance Report" to the Director. Do not break the protocol to achieve a just result; use the protocol to flag the injustice for systemic repair.
