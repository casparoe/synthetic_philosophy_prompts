answer: |-
  Dear Student,

  It is a genuine pleasure to read a draft that grapples so honestly with the metaphysical costs of its own commitments. You have stumbled upon a version of what is sometimes called the modal collapse argument against origin essentialism, and your intuition that step five is doing too much work is well-founded, though the problem runs slightly deeper than just a vibe. The argument you have constructed is valid in the sense that if all the premises hold, the conclusion follows, but its soundness is vulnerable at specific joints that many metaphysicians would insist are not welded shut. The most critical point of resistance lies in step five, where you move from causal dependence to metaphysical necessity. Just because the meiotic division causally depended on your mother's hormone levels, and those levels causally depended on the weather, it does not follow that the division metaphysically required those exact conditions. Causal chains are typically contingent even when the immediate origin is essential. An egg might essentially come from a specific meiotic division, but that division could have occurred despite slightly different hormone levels or a different breakfast. By conflating the necessity of origins with the necessity of causes, you allow the essential constraints to spread infinitely across the causal network, which is precisely what origin essentialists usually deny. They want to say you couldn't have come from different gametes, but they do not want to say you couldn't have existed if the weather had been different on the day of your conception. Rejecting step five preserves the contingency of the causal history while keeping the necessity of the immediate origin.

  However, even if you tighten step five, you face a second hurdle in step three regarding the transitivity of essential dependence. You assume that if A essentially comes from B, and B essentially comes from C, then A essentially comes from C. This principle of inheritance is not universally accepted and is often rejected specifically to avoid the kind of global necessitarianism you fear. If essential dependence does not transit, then while you are essentially tied to the egg, and the egg is essentially tied to the division, you are not thereby essentially tied to the upstream causes of the division. This blocks the chain reaction before it can pin down the entire past. Furthermore, step eight assumes determinism is true. Even if the entire past up to your conception is fixed in every world where you exist, if the laws of nature are indeterministic, the future remains open. You could have done otherwise this morning even if the world up to your conception was identical, provided that human action is not fully determined by prior physical states. So you have at least three distinct escape routes: deny that causal dependence implies essential dependence, deny the transitivity of essential dependence, or deny determinism.

  If you choose to reject step one and abandon origin essentialism entirely, you lose the powerful intuitive asymmetry that Kripke and others championed regarding identity. You lose the ability to say that you are essentially the person born of your actual parents rather than someone else, which grounds a lot of our thinking about personal identity and moral luck. It makes individuals too fungible across possible worlds, suggesting you could have been born of completely different people and still be you, which strikes many as violating the deep intuition that our origins constitute who we are. If you reject step two, you allow gametes to be more modular, suggesting an egg could exist even if produced by a different biological process. This is less costly than rejecting step one, but it weakens the biological grounding of the essentialism, making the gamete itself a bit too abstract and detached from its physical production. If you reject step five, which I recommend, you preserve the distinction between metaphysical and causal necessity, but you must articulate a principled reason why the chain stops where you say it stops. You need to explain why the egg essentially requires the division but not the hormone levels, which requires a theory of intrinsicness or independence that limits the scope of essential properties. If you reject step six, you allow for possibilities where you exist but were never conceived in the actual way, which essentially dismantles the link between transworld identity and actual history, making the notion of possibility for a specific individual quite loose and perhaps unintelligible.

  Regarding your question about patching the argument to make it watertight, if you wanted to defend the conclusion that origin essentialism leads to necessitarianism, you would need to add a premise explicitly stating that essential dependence is transitive and that all causal ancestors are essential causes. The weakest link in that patched version would undoubtedly be the claim that all causal ancestors are essential causes, as this contradicts the standard view that most causal conditions are contingent. Your supervisor may be encouraging you to accept the conclusion because they view the argument as a reductio of origin essentialism itself, suggesting that if you hold onto origin essentialism, you must bite the bullet on necessitarianism. But you are under no obligation to accept that trade. The standard philosophical move is to maintain origin essentialism while denying the transitivity of essential dependence or the essentiality of distant causes. This allows you to keep the intuition that you couldn't have come from different parents without forcing you to accept that you couldn't have worn a different shirt this morning.

  I suggest you focus your revision on distinguishing causal necessity from metaphysical necessity in step five and questioning the transitivity assumption in step three. This will allow you to retain the core insights of origin essentialism without collapsing into global fatalism. You can argue that while the egg is essentially tied to its immediate production, the causal chain leading up to that production involves contingent conditions that could have been otherwise without destroying the identity of the egg or the person. This preserves the modal asymmetry you want without nailing down the entire history of the universe. It is a subtle distinction, but it is the standard way metaphysicians avoid the explosion you have correctly identified. You have done the hard work of seeing where the logic pushes; now you need to push back at the specific premise that conflates causing with constituting.

  Warmly,

