          3.  Analyse the "kind" of disagreement (Metaphysical + Methodological).
          4.  Address the prospect of progress (Neuroscience won't save us, conceptual work needed).
          5.  Conclusion/Advice for the reading group.

  7.  **Refining the Argument (Self-Correction during drafting):**
