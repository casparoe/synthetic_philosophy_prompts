      *   *Initial thought:* Say it's purely verbal. *Correction:* Too dismissive. It has real consequences for research. It's substantive *because* of the verbal/conceptual divergence.
      *   *Focus:* Make sure to explicitly address the Orwellian/Stalinesque indistinguishability. That is the crux. Dennett says "No fact of the matter." Critics say "Fact exists, we just can't know it." This is the realism vs. anti-realism split.

  8.  **Final Polish (checking British English and tone):**
