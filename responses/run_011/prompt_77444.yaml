answer: |-
  Here is the brainstorming you asked for, followed by the argument.

  **Brainstorming: Criteria for Illusion vs. Compression**

  1.  **The Causal Criterion:** Illusion occurs when the interface implies causal powers the backend lacks (e.g., qualia causing actions). *Problem:* Users rarely make explicit causal claims; this makes illusion too intellectual.
  2.  **The Commitment Criterion:** Illusion requires the system to be unable to doubt the interface. Compression allows skepticism. *Problem:* Many humans doubt qualia yet still feel them; skepticism doesn't dissolve the phenomenology.
  3.  **The Ontological Criterion:** Illusion presents properties that nothing possesses (e.g., intrinsic simplicity). Compression presents existing properties poorly. *Problem:* Hard to define "possesses" without begging the question against realism.
  4.  **The Incoherence Criterion:** The interface content is logically incompatible with the backend structure. *Problem:* "Incompatible" is vague; almost any map is incompatible with the territory if taken literally.

  I'm picking **Candidate 3 (The Ontological Criterion)**. It offers the clearest line between "blurry picture" (compression) and "picture of a ghost" (illusion).

  ***

  **Argument**

  **A. Where the Falsity Lives**

  Your worry is that "illusion" is just a pejorative name for "compression." If the interface is informative, why call it false? The distinction lies in the *category* of the information, not its fidelity.

  Consider a fuel gauge. It is lossy. It doesn't show the shape of the tank. But it represents *fuel level*. If there is fuel, and the gauge moves, the representation is structurally homologous to the reality. It is a compression.

  Now consider the user-illusion view of consciousness. The claim is that the interface presents states as having *intrinsic, simple qualities* (qualia) located in a *unified field* (the self). The backend, however, consists of complex, relational, distributed processing with no intrinsic qualities and no central controller.

  Here is the criterion: **Compression is false only if the target property doesn't exist; Illusion is false because the *mode of presentation* asserts the existence of a property type that the backend cannot instantiate.**

  When you see a "red patch," the interface presents redness as a simple, intrinsic property of your experience. If the backend is merely discriminatory behavior without intrinsic properties, the interface isn't just low-res; it is categorically wrong. It presents a *simple* where there is a *complex*. It presents a *subject* where there is a *process*.

  So, the falsity lives in the **ontological commitment embedded in the phenomenology**. A fuel gauge doesn't claim the fuel is a needle. The conscious interface claims the experience *is* a simple quality. If physicalism is true, nothing is a simple quality. Therefore, the interface is not just coarse; it is misleading about the nature of what is being represented.

  [Guess: This relies on the premise that physical processes cannot instantiate intrinsic qualities. If panpsychism is true, this criterion collapses. I am assuming standard physicalism here.]

  This saves the view from being merely "lossy." Lossiness implies a correct map at lower resolution. Illusion implies a map using the wrong projection system.

  **B. The Toy Case**

  Does the agent in maintenance mode still have an illusion?

  If the illusion is defined by the *opacity* of the interface (you can't see the code), then maintenance mode breaks the illusion. The interface is no longer transparent; it is seen as an object.

  You worry this makes transparency contingent. I think you should accept that. The illusionist view is not an *a priori* truth about experience; it is an empirical claim about human architecture. We are built with a specific UI that hides the code. If we engineer a system where the code is visible, we have engineered a system without that specific illusion.

  So: **Yes, the illusion stops in maintenance mode.** Transparency is a functional feature of the standard mode, not a conceptual necessity of experience.

  Now, the retrospective report: "Earlier experience looks different." Is this a confession of falsity?

  No. It is evidence that the **interpretive layer** changed, not the interface. In standard mode, the agent interprets the interface as "world." In maintenance mode, the agent interprets the interface as "display." The sensory data (the red patch) might remain identical, but the *doxastic attitude* toward it shifts from "this is reality" to "this is a representation."

  The earlier reports weren't false about the *interface* (there really was a red-patch-sensation); they were false about the *ontology* (that the sensation was a simple intrinsic property). The retrospective shift reveals that the agent can hold the same phenomenology while withdrawing the ontological commitment. This distinguishes the view from simple error theory: the experience doesn't vanish, only its authority does.

  [Guess: I am assuming the phenomenology remains constant across modes. It is possible the phenomenology itself changes when you know the trick. If it does, the illusion is even stronger—it's mutable based on knowledge.]

  **C. The Self-Undermining Move**

  The objection: "You use introspection to argue introspection is unreliable."

  The cheap version says: "You can't use reason to deny reason." This is easily dismissed. We use reason to find limits of reason (e.g., Gödel, or optical illusions). We use vision to discover vision is sometimes wrong.

  The narrow, interesting version is this: **If introspection is systematically misleading about the nature of experience, why trust it to identify the *tasks* the interface is shaped for?** The theorist introspects to say, "I seem to be reasoning," but if the "I" is an illusion, who is reasoning?

  Here is the structural difference from evolutionary debunking of morals. Moral debunking argues that moral intuitions track fitness, not truth. Illusionism argues that introspection tracks *utility*, not truth. But crucially, utility requires *reliability* about the environment, even if not about the self.

  The theorist's argument relies on **functional introspection** (tracking the flow of reasoning steps), not **phenomenal introspection** (tracking the quality of experience). The illusionist claims phenomenal introspection is false (qualia aren't real), not that functional introspection is useless. I can track my reasoning process (functional) even if my feeling of "effort" is a UI element (phenomenal).

  So the theory survives because it distinguishes between the *content* of reasoning (which can be valid) and the *feeling* of reasoning (which may be illusory). The undercutting only works if the illusion infects the logical relations between propositions. But the illusionist claims the illusion is about *qualitative properties*, not logical structure.

  [Guess: This distinction between functional and phenomenal introspection is the weak point. If the "feeling of compellingness" is part of the illusion, then logical validity might feel compelling without being so. I don't have a full answer for this, but the standard move is to ground logic in public language, not private feeling.]

  **Summary**

  The knot dissolves if you accept that "illusion" means "ontological category error" rather than "non-existence." The interface exists; the *nature* it claims to have is false. This makes transparency contingent (solvable by maintenance mode) and protects the theorist's reasoning (which relies on functional, not phenomenal, introspection). The view is not a priori; it is a bet on physicalism and evolutionary utility. If you lose that bet, the view fails, but it doesn't contradict itself.
