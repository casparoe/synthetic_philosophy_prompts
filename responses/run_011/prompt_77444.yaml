      *   **Addressing B:** Apply to the toy case. Maintenance mode changes the *category* of access. Previously, access was direct/unmediated (false category). Now, access is mediated (true category). The earlier reports weren't "false" about the *interface*, but false about the *world*. The interface didn't change; the *access mode* did. This saves transparency as a functional feature, not just contingent.
      *   **Addressing C:** The self-undermining objection. Distinguish between *phenomenal introspection* (looking at the qualia) and *functional introspection* (looking at the reasoning process). The theory attacks the former's authority on ontology, not the latter's utility for reasoning. It's different from moral debunking because moral debunking attacks the *source* of the belief; here we admit the source (introspection) but deny its *interpretation*.
      *   **Word Count Check:** Need to be concise. The brainstorming needs to be tight so the argument has room.
      *   **Tone Check:** Ensure I mark guesses. Ensure I sound like a philosopher working through it, not lecturing.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Ontological Category Error" too technical?
      *   *Fix:* Explain it as "presenting X as having property P when nothing has property P."
      *   *Critique:* In B, if the interface doesn't change, why does it look different?
      *   *Fix:* Because the *context* of the interface changes. It's like seeing a magic trick vs. seeing the mechanism. The visual data is the same; the *interpretation* of its source changes. Wait, the prompt says "reports that its earlier experience looks different." This implies the *phenomenology* might shift or the *judgment* shifts. I need to be careful. The illusionist says the *judgment* shifts. The phenomenology (the interface) remains transparent, but the *belief* about it changes.
      *   *Critique:* On C, is it really different from evolutionary debunking?
      *   *Fix:* Evolutionary debunking says "belief formed for survival, not truth." Illusionism says "belief formed for utility, and specifically encodes falsehoods for utility." It's stronger. It's not just unreliable; it's systematically misleading.

  6.  **Writing - Step-by-Step:**
      *   *Brainstorm:* 3-4 candidates.
      *   *Pick:* Ontological Mismatch.
