      *(Final Polish)*: Ensure the transition from brainstorm to argument is smooth.

      *Wait, one more check on B:* "Does the agent in maintenance mode still have an illusion?" If I say "No," transparency is contingent. If I say "Yes," transparency does no work. My solution: The illusion is about the *source* of the data. In maintenance mode, the source is visible. So the illusion (that there is no source) is broken. But this doesn't make transparency contingent; it makes it *mode-dependent*. The view isn't a priori; it's empirical about human architecture. I should admit the view isn't a priori. That dissolves the tension.

