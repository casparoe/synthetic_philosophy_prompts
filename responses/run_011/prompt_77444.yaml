      *   **B (Toy Case):** An agent with a transparent interface + maintenance mode. Does maintenance mode break the illusion? If yes, transparency is contingent. If no, transparency does no work. Retrospective report: false earlier reports or changed interface?
      *   **C (Self-Undermining):** The theorist uses introspection to argue against introspection. Is this like evolutionary debunking of morals? Need to narrow the objection.

  3.  **Brainstorming Candidate Answers for A (Illusion vs. Compression):**
      *   *Candidate 1: Structural Mismatch.* Illusion occurs when the interface structure implies ontological categories (objects, selves) that don't exist in the backend. Compression is just low-res; illusion is wrong-res. *Problem:* Hard to define "ontological categories" without begging the question.
      *   *Candidate 2: Causal Inefficacy.* Illusion claims the interface properties (qualia) cause things, but they don't; only the backend does. Compression doesn't claim causality. *Problem:* Users don't necessarily claim causality, just presence.
      *   *Candidate 3: User Commitment.* Illusion requires the system to *take* the interface literally (commit to the reality of the icon). Compression allows skepticism. *Problem:* Many humans are skeptics but still feel the pain qualia.
      *   *Candidate 4: Incoherence.* The content of the experience is logically impossible given the backend (e.g., simple qualities vs. complex processing). Compression is just incomplete; illusion is incompatible. *Problem:* "Incompatible" is heavy lifting.

      *Selection:* Candidate 1 (Structural/Ontological Mismatch) seems most robust for an illusionist. It distinguishes "low res picture of a cat" (compression) from "picture of a ghost" (illusion). The interface presents *simples* (qualia) where there are only *complexes* (neural firing).

  4.  **Drafting - Section by Section:**

      *   **Brainstorming Intro:** Explicitly list the candidates and problems as requested.
