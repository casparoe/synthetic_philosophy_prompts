  5.  **Structuring the "Must Concede" and "Must Not Concede":**
      *   *Concede:* The current biological justification is shaky (aligns with thesis move 1). This builds credibility.
      *   *Don't Concede:* That the current system is honest. That the DDR is sacrosanct if it relies on fiction.
      *   *The One Reply:* The distinction between *killing* and *allowing procurement from the permanently unconscious.* It must land that this is *more* ethical than the current fiction.

