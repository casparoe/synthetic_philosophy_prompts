      8.  Philosopher/Ethicist: The "Death" Definition inconsistency (The "Hope nobody asks" question needs to be separate, so this one should be about the *practicality* of the definition). Let's make #8 about the "Normative Choice" burden.

      *Refining Voices:*
      *   Counsel needs to sound worried about statutes.
      *   Surgeon needs to sound worried about ischemia and lawsuits.
      *   Neurologist needs to sound worried about exam integrity.
