  7.  **Final Review of the "Entitlement vs. Capability" Issue:**
      *   *Entitlement:* Legal means to acquire food (trade, production, inheritance).
      *   *Capability:* The substantive freedom to achieve functionings (being nourished).
      *   The student wrote: "An entitlement is basically a person's capability to get food — what they're actually able to do and be, in Sen's terms."
      *   *Verdict:* This is technically incorrect. Sen spent decades distinguishing these. In an *Intro* Global Ethics class, the instructor might let it slide, but since the prompt asks to "Explain the entitlement approach," defining it as the "capability approach" is a definition error. I must highlight this.

  8.  **Final Review of "Political Crime":**
