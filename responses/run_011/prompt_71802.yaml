prompt: |-
  my partner TAs an intro global-ethics section and she's out sick this week, so the short-answer grading landed on me instead. I write backend code for a living and have never taken a philosophy class, so I genuinely can't tell a real mistake from a fine-grained one. Can you grade this properly?

  The question was: "Sen argues that famines are typically not caused by a shortage of food. Explain the entitlement approach and apply it to one historical famine. Does your case show that famine is better understood as a natural disaster or a political crime?"

  The student's answer:

  "Sen's argument is that starvation is about entitlements, not availability. An entitlement is basically a person's capability to get food — what they're actually able to do and be, in Sen's terms. You own something (your labour, a bit of land) and you trade it for food; when that exchange breaks down you starve even if the granaries are full. In Bengal in 1943 the food was there. Wartime spending caused inflation, rural wage labourers were paid in cash that didn't keep up with the price of rice, and the British denial policies took away the boats that fishing and transport workers depended on, so whole occupational groups lost the ability to buy food at all. The administration never declared a famine and only got serious about rationing and relief late in the year. Sen also showed that no famine has ever happened in a functioning democracy with a free press, because leaders facing elections and newspaper coverage can't afford to let people starve. Colonial Bengal had neither, which is why it was a political crime: the British state chose not to act. The Irish case fits the same pattern — Ireland kept exporting grain to England right through the potato famine, so on Sen's logic there was no aggregate shortage there either, just an entitlment failure. So famine is never really a natural disaster, it's always a question of who gets to eat."

  What I need back: a grade out of 10, then a point-by-point breakdown of what's actually right, what's wrong, and what's just loose phrasing I shouldn't deduct for. For each error, explain in plain language why it's an error (I don't know this literature) and say whether it's something the instructor would care about or a nitpick. Also tell me if the answer really engages the second half of the question or just restates the causal story with a moral label on it, and write 3-5 sentences of feedback I can paste back to the student that's specific and fair.
