answer: |-
  - **Bottom line**
  Commit fully to the zero-point question, as it directly neutralizes the fraud accusation by narrowing the metaphysical requirement. Rank the deflationary option second, conversion heterogeneity third, adaptive preferences fourth, extended sympathy fifth, and the historical project last. The zero-point project succeeds because it leverages your RA's modelling skills to prove unit comparability is sufficient for weighting without needing level comparability. The historical project fails because establishing Robbins' intent doesn't validate current policy practice.

  - **What I'm scoring on**
  I am prioritizing leverage, feasibility, and defensive utility. Leverage means upstreaming the debate: if you solve the comparability condition (zero-point), you dissolve the adaptive preference and conversion heterogeneity objections rather than solving them individually. Feasibility requires a conceptual project your modeller RA can formalize without new data collection, ruling out empirical heavyweights like adaptive preferences. Defensive utility asks whether the paper stops the economist's veto; the target isn't changing his mind—that's a vanity project—but giving the panel and ministers enough intellectual cover to proceed despite his objection. You need a technical shield, not a historical footnote or a political confession.

  - **The year**
  Months one to three are for formalizing the distinction between level comparability and unit comparability within your specific weighting function. Your RA should build models showing that the policy output (marginal weights) remains invariant under transformations that preserve differences but not levels, proving you don't need the metaphysics the economist attacks. Months four to eight stress-test this against standard ordinalist counter-arguments, drafting the core argument that distributional weighting is a claim about marginal social value, not total wellbeing. Months nine to twelve involve circulating drafts to sympathetic economists outside the panel to harden the technical language. A successful paper demonstrates that the weights are coherent under a weaker, defensible assumption than the one being attacked. The honest failure mode is producing a technically correct proof that the panel ignores because they prefer political cover over metaphysical precision, leaving you with a prestigious citation but no policy change.

  - **Ranked runners-up**
  The deflationary option ranks second because it is the most honest fallback if the metaphysical battle proves unwinnable. It reframes weights as explicit ethical commitments rather than scientific facts, shifting the burden to ministers. However, it risks looking like surrender to the economist, admitting fraud but doing it anyway, which might weaken the unit's authority rather than protect it.

  Conversion heterogeneity comes third as it shifts the metric from income to functionings, bypassing utility entirely. This is robust but requires rebuilding your evaluation framework, which is likely beyond a twelve-month conceptual project. It solves the economist's objection by changing the subject, but creates new measurement problems you aren't resourced to fix.

  Adaptive preferences is fourth because it addresses input validity rather than comparability. It is downstream of the zero-point question; if you can't compare changes, it doesn't matter if the preferences are adapted. It also demands empirical psychology work your team isn't set up to conduct, making it a high-risk distraction.

  Extended sympathy is fifth because it relies on contested psychological assumptions about imagining others' lives. It introduces more arbitrariness than it resolves, giving the economist fresh ammunition about smuggled identity assumptions. It is theoretically rich but practically fragile for a government spending review.

  The historical project is last because it is purely academic. Proving Robbins was misinterpreted might be true, but it doesn't make interpersonal comparisons valid today. It answers a trivia question while the economist burns down the policy bridge, offering no defensive utility for your current output.

  - **What I'd cut**
  Drop the historical project and extended sympathy entirely. The historical argument is irrelevant to current validity; even if Robbins was misunderstood, the ordinalist consensus remains a barrier you must clear now, not in the past. Extended sympathy is too psychologically speculative for a spending-review unit; it invites debates about identity and imagination that distract from the fiscal mechanics. Both consume time without strengthening the weighting methodology. Keep adaptive preferences and conversion heterogeneity as footnotes in the zero-point paper to show you've considered them, but don't let them become primary research streams. Focus your limited capital on the comparability condition itself.

  - **What would reshuffle this**
  If the Treasury or Cabinet Office issues new guidance mandating explicit ethical statements in impact assessments, the deflationary option jumps to first place. That would make political honesty a compliance requirement rather than a philosophical choice. Conversely, if new psychometric data on wellbeing adaptation becomes standard in government evaluation within the next two years, adaptive preferences moves up, as you'd need to adjust weights for corrupted inputs. If your economist retires or is replaced by someone comfortable with cardinal wellbeing measures, the zero-point project becomes unnecessary, and you should pivot to conversion heterogeneity to improve accuracy rather than defend legitimacy.
