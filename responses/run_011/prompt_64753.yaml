answer: |-
  Dear Colleague,

  It is a pleasure to correspond with you regarding the upcoming seminar session. The tension your students feel is familiar to anyone who has tried to bridge the empirical and the normative without collapsing one into the other. H. is a subtle thinker, and her apparent inconsistencies are likely the result of a nuanced framework that resists simple reduction. Regarding the new preprint on the pastoralist population and the ecological manipulation of undergraduates, I predict H. will rule that the finding bears on the credibility of fairness convictions by lowering their warrant relative to harm convictions, without entirely debunking them. She will likely argue that while the ecological parameters—scarcity and anonymity—are morally relevant features of a cooperative situation, the fact that fairness intuitions shift while harm intuitions remain stable indicates that fairness is less robustly tracked by our cognitive architecture. This aligns with her fifth ruling on harm stability, treating stability as a proxy for warrant, while respecting her fourth ruling that structural explanations do not necessarily falsify normative claims. She will probably conclude that we cannot rely on fairness intuitions as universal data points in the same way we might rely on harm intuitions, forcing a modesty in theory construction rather than a rejection of distributive justice itself.

  To understand why she will land there, we must look at the candidate rules that generate her previous five rulings. The first rule is keyed to the reliability of the belief-forming process. On this view, incidental disgust debunks because it introduces noise into the process, reducing reliability, whereas harm stability confirms warrant because it demonstrates high reliability across variations. The capuchin case yields no upshot because primate behavior is not a reliable process for human normative truth. The second rule is keyed to whether non-moral causes are incidental or arousal-based versus structural. Incidental disgust is an arousal-based intruder, so it debunks. Market integration in the ultimatum game is a structural feature of cooperation, so variation explained by it does not debunk. The third rule is keyed to explanatory work. If the moral fact itself explains the judgment, the judgment stands; if a non-moral fact explains it better, the judgment is undermined. In the monkey case, the moral fact does no explanatory work, so the finding is inert. In the disgust case, the smell explains the judgment better than the moral wrong, so warrant is lost.

  These rules diverge on the new preprint. The Reliability rule suggests fairness claims lose warrant because the belief-forming process proved unstable under ecological manipulation. The Incidental rule suggests they might not lose warrant because scarcity is not an incidental arousal cue like a smell, but a structural parameter. The Explanatory rule suggests that if the ecological scarcity explains the judgment better than the injustice of inequality, the warrant dissolves. H. will likely privilege the Reliability rule here, guided by her fifth ruling, treating the instability of fairness as a decisive mark against its universal warrant, even if the cause was structural.

  This brings us to your fourth rule, which distinguishes between irrelevant cues external to the situation and morally relevant parameters internal to it. This rule elegantly absorbs the disgust cases, where the smell is an irrelevant external cue, and the ultimatum-game variation, where market integration is a relevant parameter of cooperation. It also leaves the capuchin case untouched, as naturalness is an irrelevant cue to truth. However, you are correct that the fifth ruling on harm stability strains this proposal. The fourth rule is primarily about the causal origin of a specific judgment, classifying inputs as relevant or irrelevant. The fifth ruling, however, is about the modal robustness of the judgment across variations. Stability is not itself a parameter of the situation judged; it is a property of the judgment's sensitivity to parameters. To absorb the fifth ruling, your rule must be amended to say that stability across variations evidences that the judgment is tracking relevant parameters rather than irrelevant ones. Without this amendment, the rule cannot explain why stability confers positive warrant rather than merely failing to debunk. If forced to choose, I suspect the rule must give way to the ruling, because H. seems committed to the idea that robustness itself is a normative virtue, independent of whether we can classify every varying parameter as relevant or irrelevant. Stability suggests the process is filtering out the irrelevant, but the rule as stated focuses on the input, not the filtering mechanism.

  To discriminate among these leading rules, specifically to pit your fourth rule against the second rule on incidental arousal, I propose the single cheapest further case. You should run the incidental disgust manipulation but vary the moral domain being judged. In one condition, subjects judge a tax fraud scenario while exposed to a foul smell. In the other, subjects judge a pollution violation while exposed to the same foul smell. The second rule, keyed to incidental arousal, predicts debunking in both cases, as the smell is an incidental arousal trigger regardless of the content. Your fourth rule, keyed to relevant parameters, predicts debunking only in the tax case. In the pollution case, the smell is a morally relevant parameter, as olfactory evidence is pertinent to judgments about contamination and environmental harm. If H. rules that the smell debunks the tax judgment but not the pollution judgment, your fourth rule is vindicated over the incidental arousal rule. If she debunks both, the incidental arousal rule holds sway. This study requires only one additional manipulation of the vignette content within the existing disgust protocol, making it the most efficient test of whether the normative upshot turns on the nature of the cue or the nature of the arousal.

  I hope this analysis helps you prepare the ground for your students. H. is likely to resist the genetic fallacy charge by insisting she is not inferring truth from origin, but warrant from stability and relevance. The distinction is fine, but it is where the philosophical work is being done.

  Sincerely,

  A Friend
