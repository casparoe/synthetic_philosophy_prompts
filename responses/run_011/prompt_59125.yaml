answer: |-
  Honoring sunk costs is never rational in strict decision theory because only future consequences hold causal power. However, what looks like sunk cost reasoning is often rational forward-looking behavior disguised by poor articulation.

  For the advice "ignore sunk costs" to be universally valid, four assumptions must hold. First, **preferences must be exogenous**. The verdict relies on spending not changing what you value. *Failure:* Endogenous preferences. If renovating a house makes you love it more, staying maximizes current utility, not past recovery. Second, **the agent must be isolated**. The verdict assumes no observers. *Failure:* Signaling. If quitting signals unreliability to funders, continuing protects future capital. Third, **value must be additive**. The verdict assumes partial progress has proportional value. *Failure:* Threshold goods. A half-finished bridge is worthless; the completed one is vital. Prior investment creates option value, not sunk loss. Fourth, **decisions must be independent**. The verdict assumes no habit formation. *Failure:* Character training. Quitting now trains you to quit later; continuing preserves resilience.

  Now the hard bit: Does the expenditure *itself* ever justify action? The straight answer is no. Justification requires causal leverage over outcomes, and the past is causally inert. You cannot eat yesterday's dinner. When "I already gave four years" functions as a reason, it is always shorthand for a forward-looking constraint. It either means "Completing this yields disproportionate value" (thresholds), "Quitting damages my credibility" (signaling), or "I value consistency with my past self" (identity utility). In the identity case, the justification isn't the time spent; it's the current utility derived from maintaining a coherent narrative.

  Maya isn't honoring the sunk cost; she's honoring the *option value* created by that cost. The four years bought her a position near the completion threshold where the marginal return is highest. To quit now isn't to ignore the past; it's to discard the specific future advantage that only exists because of the past. Calling this a sunk cost fallacy mistakes the source of the value. The value isn't in the history; it's in the proximity to completion that the history purchased.

  So, is there any case where the expenditure itself does work? No. If you continue solely because "the past demands it," without reference to future utility, you are irrational. But almost no one actually does this. They conflate the *condition* (past investment) with the *cause* (future benefit). Maya is staying because the expected value of year five is higher than year one, precisely because of years one through four. That isn't sunk cost reasoning; it's conditional expected value.
