      *   **Section 5 (Upshot/Design):**
          *   Claim: Tension between reliability (large $n$) and mattering (pivotal prob).
          *   Logic: $T \to 0$ as $n \to \infty$. So individual contribution $\to 0$.
          *   Recommendation: Small committees facing close questions.
          *   *Critique:* This follows from the math in §2, provided one accepts the normative premise that "members mattering" is a design goal.
          *   Ambiguity: "Matters".
              *   Sense 1: Causal impact on outcome (Pivotality). This goes to 0 as $n \to \infty$.
              *   Sense 2: Epistemic contribution to the *process*.
              *   The text says: "enlarging the jury makes the jury better and simultaneously makes each member's judgment worth less".
              *   This is a standard tension (Condorcet vs. Participation).
              *   Does it follow from §§2-4? Yes, §2 establishes $T \to 0$.
