                      *   Now add 4th voter (Conformist).
                      *   To match "4 Sincere", the 4th voter needs to be pivotal (2-2 tie) with probability $T_{4\_sincere}$ and have competence $p$.
                      *   In the (2 Sincere + 2 Conf) scenario:
                          *   Can we get a 2-2 tie?
                          *   S1, S2 must split (TF or FT). C3 must vote opposite to the "leading" side? No, C3 copies majority.
