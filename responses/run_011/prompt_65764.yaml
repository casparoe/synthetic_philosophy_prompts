                  *   So the claim fails if "they all" means the total headcount.
                  *   Does the author mean "Accuracy is determined solely by the sincere core"?
                  *   Text: "On this picture the size of the sincere core is the only thing that matters".
                  *   If so, Accuracy(2 Sincere + 100 Conf) = Accuracy(2 Sincere).
                  *   But the text says: "accuracy is exactly what it would have been had they all voted sincerely."
                  *   This implies Accuracy(2 Sincere + 1 Conf) = Accuracy(3 Sincere).
                  *   And Accuracy(2 Sincere + 2 Conf) = Accuracy(4 Sincere).
                  *   My counter-example (2 Sincere + 2 Conf) shows Accuracy = Accuracy(3 Sincere) $\neq$ Accuracy(4 Sincere).
