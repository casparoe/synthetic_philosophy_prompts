  **Referee's Report**

  **Draft:** "Pivotal Competence: What the Jury Theorem Actually Assumes"

  **1. Mathematics and §2 Claims**
  I have verified the mathematics in §2 and §3. The decomposition formula $A = C + T \cdot q$ in §2 is correct. It is a straightforward application of the law of total probability conditioned on the state of the first $m$ ballots (Strict Truth Majority, Strict False Majority, Tie). Since the outcome is determined in the first two cases regardless of the $(m+1)$-th vote, and determined by the $(m+1)$-th vote in the third, the formula holds without any independence assumptions. Your claim that (*) needs no probabilistic hypotheses is right as stated.

  Regarding the decay of $T$: You state $T \to 0$ "exponentially fast once $p$ is bounded away from 1/2." This is correct *under the assumption that the first $m$ voters are independent*. If the first $m$ voters are correlated (e.g., they all copy a leader), $T$ could be zero for all $m \ge 2$, or decay at a different rate. Since §2 is setting up the theorem's standard context, this is acceptable, but you should qualify that this decay rate relies on the independence of the *core* voters, not just the marginal one.

  The computations in §3 are correct. I re-derived the $n=3$ and $n=5$ cases.
  For $n=3$ (2 sincere, 1 conformist): $A = p^2 + 2p(1-p)p = 3p^2 - 2p^3$. This matches the binomial sum for 3 sincere voters.
  For $n=5$ (4 sincere, 1 conformist): The algebra holds. The conformist adds exactly the marginal value of a sincere voter because she faces the same tie-probability and brings the same competence $q=p$ to that tie.

  **2. Pressure on §4 (The Generalization)**
  This section contains a fatal mathematical error. The claim that you can "pad the body with as many conformists as you like" and maintain the accuracy of the equivalent number of sincere voters is false.

  **Counterexample (Sequential Voting):**
  Assume a "running tally" implies sequential voting. Let there be 2 Sincere voters ($S_1, S_2$) and 2 Conformists ($C_1, C_2$).
  1.  $S_1, S_2$ vote.
      *   If they agree (TT or FF), the tally is 2-0 or 0-2.
      *   If they split (TF or FT), the tally is 1-1.
  2.  $C_1$ votes.
      *   If tally is 2-0, $C_1$ copies (Tally becomes 3-0).
      *   If tally is 1-1, $C_1$ uses private signal (Tally becomes 2-1 or 1-2).
  3.  $C_2$ votes.
      *   If $S_1, S_2$ agreed: $C_2$ faces a 3-0 tally. $C_2$ copies. $C_2$ is never pivotal.
      *   If $S_1, S_2$ split: $C_1$ broke the tie. $C_2$ faces a 2-1 tally. $C_2$ copies the new majority. $C_2$ is never pivotal.

  In this scenario, $C_2$ contributes *nothing* to accuracy. The collective accuracy of (2 Sincere + 2 Conformists) is identical to (2 Sincere + 1 Conformist), which equals (3 Sincere). It is **not** equal to (4 Sincere). The fourth sincere voter would have had a chance to overturn a 2-1 error made by the first three; the second conformist does not.

  **Counterexample (Simultaneous Voting):**
  If "tally she faces" implies all conformists see the sincere core's result simultaneously:
  Let 2 Sincere ($S_1, S_2$) and 2 Conformists ($C_1, C_2$) vote.
  *   If $S_1, S_2$ are Wrong (0-2), both Conformists copy Wrong. Outcome is 0-4 (Wrong). Accuracy contribution = 0.
  *   If $S_1, S_2$ are Wrong (0-2) and we had 2 *Sincere* voters instead ($S_3, S_4$), there is a probability $S_3, S_4$ are both Right ($p^2$), overturning the verdict to 2-2 (Tie) or 3-1 (if odd $n$).
  *   Conformists lock in the core's error; sincere voters can correct it.
  *   Therefore, Accuracy(Core + Conformists) < Accuracy(Core + Sincere) whenever the Core is wrong.

  **Diagnosis:** You have generalized from the $m+1$ case (one conformist) to the $m+k$ case. The first conformist preserves accuracy because they act sincerely *on the tie-set*. Subsequent conformists do not face that same tie-set; they face a tally already modified by the first conformist. The baseline "had they all voted sincerely" equivocates between "had the total number of voters been sincere" (false) and "had the sincere core been larger" (false). The argument in §4 collapses. Only the *first* conformist added to a sincere core is costless; subsequent ones are detrimental compared to sincere voters, though they may be costless compared to abstention.

  **3. Novelty of §2 (Pivotal Competence)**
  Is this a genuine observation or repackaging? It is repackaging of the standard inductive step used to prove Condorcet's Jury Theorem. Standard proofs show $P_{n+2} > P_n$ by analyzing the probability of a tie in $n$ votes and the competence of the additional voters. Your "pivotal competence" is precisely the competence of the marginal voter conditional on a tie.
  However, labeling it "pivotal competence" and using it to isolate the *epistemic cost of conformity* is a useful philosophical reframing. It is not a new mathematical theorem, but it is a productive conceptual lens for this specific debate. It is not "pivotal voting" in the rational choice sense (which concerns strategic incentives), so the terminology is distinct enough to avoid confusion, provided you acknowledge it derives from the standard inductive structure of the theorem.

  **4. Design Recommendation in §5**
  Does the recommendation follow? Yes, logically, from §2. If $T \to 0$ as $n \to \infty$, then the probability of any individual being pivotal vanishes. If "mattering" is defined as having a non-negligible causal impact on the outcome (or the responsibility that comes with it), then large juries minimize mattering.
  However, you note a tension: "enlarging the jury makes the jury better and simultaneously makes each member's judgment worth less." This is not an ambiguity; it is a trade-off. The ambiguity lies in "worth less."
  *   Sense A: Causal power (Pivotality). This decreases.
  *   Sense B: Epistemic value of the signal. This does not decrease (the signal is still $p$).
  Your argument relies on Sense A to support the normative claim about responsibility/education. This is consistent. The recommendation for "small committees facing genuinely close questions" follows if one prioritizes member responsibility over asymptotic infallibility. I do not see a logical flaw here, provided the reader accepts the normative weight of "mattering."

  **5. The Standard Objection (§1)**
  Your statement of the objection is fair. You characterize the standard objection as "independence is a fantasy... once votes are positively correlated the asymptotic guarantee collapses."
  **Strongest Unanswered Objection:** The objection based on **common signals that eliminate the tie-set**.
  Your defense relies on the existence of a tie-set ($T > 0$) into which fresh information (the conformist's signal) can enter. If voters correlate because they observe a common signal (e.g., a media report) that is strong enough to make them vote identically, $T$ becomes 0 (or negligible) very quickly. If $T=0$, then $A = C$. The conformist's pivotal competence $q$ becomes irrelevant because $T \cdot q = 0$.
  Your argument shows that *copying* is costless *if* ties occur. It does not show that ties *will* occur in the presence of the correlations that actually worry critics (e.g., common cause). The "enemy" is indeed what destroys the tie-set, but your argument does not prove that real-world conformity preserves the tie-set; it only proves that *if* it does, accuracy is preserved.

  **6. Prose and Clarity**
  The prose is excellent: clear, punchy, and accessible.
  *   **Padding:** §6 is very short, which is good. §1 is efficient.
  *   **Potential Confusion:** A reader will get lost in §4 if they attempt to verify the claim mentally. As noted above, the claim is false, so they will get lost because the math won't sum. You must revise §4 to restrict the claim to a *single* conformist or a specific block of conformists voting simultaneously on the *original* core (which creates other distributional issues).
  *   **Suggestion:** In §2, clarify that the exponential decay of $T$ assumes the independence of the first $m$ voters.

  **Confidence and Closing**

  I am highly confident (Grade: A) in the mathematical critique of §4; the error regarding multiple conformists is demonstrable via simple counterexample. I am highly confident (Grade: A) in the verification of §§2 and 3; the decomposition is standard probability. I am moderately confident (Grade: B) in the novelty assessment of §2; while the math is standard, the philosophical application is distinct, though I cannot rule out prior articulation without a literature search. I am highly confident (Grade: A) that the design recommendation in §5 follows logically from the premises, even if the premises are debatable.

  The point on which I am least sure is the precise boundary of the "standard objection" in §1. While I identify the "common signal eliminating ties" as the strongest unanswered objection, there may be nuanced versions of the correlation objection that interact with the tie-set in ways I have not modeled here. To settle this, one would need to formalize the specific correlation structures (e.g., equicorrelation vs. common signal) and calculate the resulting $T$ to see if your "costless conformity" holds under those specific distributions.
