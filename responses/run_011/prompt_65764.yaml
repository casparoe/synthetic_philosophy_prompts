                  *   "With two sincere voters... A = ... which is also the accuracy of three sincere voters".
                  *   So: Accuracy(2 Sincere + 1 Conformist) = Accuracy(3 Sincere).
                  *   Here $m=2$ (sincere), $n=3$ (total).
                  *   Generalization claim: "Pad the body with as many conformists as you like... accuracy is exactly what it would have been had they all voted sincerely."
                  *   "They all" must refer to the total number of voters $n$.
                  *   So the claim is: Accuracy($k$ Sincere + $(n-k)$ Conformists) = Accuracy($n$ Sincere).
                  *   *Crucial Condition:* "provided each one falls back on her own signal whenever the tally she faces is tied".
                  *   For this to work, every conformist must face a tie with the same probability structure as a sincere voter would in the all-sincere case.
                  *   In §3 ($n=3, m=2$): The 3rd voter faces a tie if the first 2 (sincere) split. This happens with prob $T$.
                  *   If we add a 4th voter (Conformist):
                      *   To match "4 Sincere", the 4th voter must be pivotal with the same probability and have competence $p$ when pivotal.
                      *   But if the 3rd voter was a conformist, the distribution of votes among the first 3 is *not* the same as 3 sincere voters.
