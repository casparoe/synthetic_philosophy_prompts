                              *   FF (S1=F, S2=F, C3=F) -> 0-3.
                              *   TF (S1=T, S2=F, C3=Signal) -> If Signal T (2-1), If Signal F (1-2).
                              *   FT (S1=F, S2=T, C3=Signal) -> If Signal T (2-1), If Signal F (1-2).
