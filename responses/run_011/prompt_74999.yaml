answer: |-
  **Topic: Explaining "Better"**
  **Question 1:** You maintain that saving the five is merely permissible, yet you acknowledge the widespread intuition that the rescuer who saves the five has done *better*. If there is no greater loss in the death of the five, as per your first claim, what property of the outcome makes it better rather than just different?
  **Follow-up:** If you answer that it satisfies more preferences or interests, does that not imply that the aggregation of those interests is what generates the value, thereby undermining your prohibition on summing losses?

  **Topic: Claim 1 (Substantive vs. Linguistic)**
  **Question 2:** Is your denial that five deaths constitute a greater loss than one a substantive thesis about moral metaphysics, or merely a recommendation to abandon aggregative vocabulary?
  **Follow-up:** If you treat it as merely linguistic, must we conclude that the physical reality of five corpses is morally equivalent to one, provided we describe them non-aggregatively?

  **Topic: Lottery Discounting**
  **Question 3:** Critics argue that a fifty-fifty lottery between the one and the five discounts the five, since it converts five certain survivals into five half-chances, whereas any view taking each claimant's prospects seriously would count the numbers. How do you respond to this expected-value objection?
  **Follow-up:** If you insist that claims are to chances rather than outcomes, does the moral value of the lottery remain constant regardless of whether there are five tickets or five hundred on one side?

  **Topic: Institutions (Claim 3)**
  **Question 4:** You argue that the requirement to randomize binds individual rescuers but not institutions, because institutions owe no equal chances. What grounds this sharp division between individual and institutional morality?
  **Follow-up:** If you ground this in the distinct aims of institutions, do those aims authorize the institution to override the individual moral duties of the staff acting within it?

  **Topic: Institutions (Joint Action) [Depends on Q4]**
  **Question 5:** Given your answer regarding institutional aims, does this distinction survive the observation that institutions are nothing over and above individuals acting jointly, or does the division of labor concede that numbers count in cases of practical consequence?
  **Follow-up:** If you argue that roles change obligations, can a private individual adopt an 'institutional role' during a crisis to bypass the lottery and save the greater number?

  **Topic: Extreme Disparity**
  **Question 6:** Consider a case of extreme disparity: a single death against an enormous number of very minor harms. Can you decline to count the numbers there without relying on a threshold of relevant similarity that performs the very aggregative work you have disowned?
  **Follow-up:** If you posit a threshold where minor harms become significant enough to outweigh a death, is that threshold not determined by the aggregated weight of the harms?

  **Topic: Stability/Chain [Depends on Q6]**
  **Question 7:** If you rely on a threshold to handle disparity, can your view give stable verdicts across a chain of cases differing only slightly in the number or magnitude of the harms at stake, or does it collapse into arbitrariness?
  **Follow-up:** If you accept that moral concepts are vague, does this vagueness license a rescuer to decide arbitrarily where the threshold lies in the moment of action?

  **Topic: Falsification**
  **Question 8:** What particular case or line of argument would you accept as refuting your position rather than as something you could merely resist by adjusting a clause?
  **Follow-up:** If you cite internal inconsistency, does your view not already exhibit this regarding the locus of agency, given your concession in Question 5 about individuals acting jointly?

  **Topic: Lottery/Institutions [Depends on Q3 & Q4]**
  **Question 9:** You told us in Question 3 that what is owed is an equal chance, yet in Question 4 you said institutions need not give chances. If the moral basis for chances is the claimant's right, why does the claimant's right vanish when the rescuer is a hospital?
  **Follow-up:** If you reply that institutions maximize welfare, why is maximizing welfare permissible for institutions but forbidden for individuals acting in a rescue scenario?

  **Topic: Claim 1/Institutions [Depends on Q2 & Q4]**
  **Question 10:** In Question 2 you suggested losses aren't summed metaphysically, but in Question 4 you allow institutions to act as if they are. Is morality therefore not about the world, but about the type of agent acting in it?
  **Follow-up:** If you affirm this contextual morality, does your theory not fail to guide action for individuals who are invariably embedded in institutional arrangements?
