  0.35

  **Decomposition of Credence**

  *   **Twin-derived $h^2$ unbiasedness (0.85):** While assortative mating and EEA violations exist, modern genomic methods largely corroborate twin-based heritability estimates for intelligence.
  *   **Achievability of levelling residual variance (0.45):** Policy targets shared environment, yet adult cognitive variance is predominantly driven by non-shared experience and stochastic biological factors.
  *   **Heritability counterfactual stability (0.70):** The Scarr–Rowe effect suggests heritability rises in enriched environments, potentially offsetting variance reductions from environmental equalisation.
  *   **Measurement error floor (0.80):** A non-trivial portion of environmental variance is psychometric noise which no policy intervention can eliminate.

  **Combination**
  Treating these as necessary conditions for the strong claim H, I model the joint probability multiplicatively: $0.85 \times 0.45 \times 0.70 \times 0.80 \approx 0.21$. I adjust this upwards to 0.35 to account for potential covariance (e.g., if levelling is partially achievable, it mitigates the heritability shift) and the possibility that early-life interventions have larger downstream effects than standard adult twin models imply.

  **Most Sensitive Term**
  Achievability of levelling residual variance; if the reducible shared environment component of adult scores were 20% rather than the typical 10%, claim H would become probable.

  **Key Evidence**
  Longitudinal twin data (such as from the TEDS study) tracking the trajectory of shared environmental influence ($c^2$) on cognitive scores from age ten to adulthood.
