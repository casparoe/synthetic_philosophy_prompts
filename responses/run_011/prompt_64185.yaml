  ### The Straight Answer

  Is "the deviation reveals the norm" a recognised inference with recognised failure conditions? **Yes, but not where you are looking.**

  In **qualitative social science** (specifically process tracing and case-study methodology), this is a standard move called **Deviant Case Analysis**. However, it is not a free pass. For the inference to be licensed, the deviation must be shown to operate via the *same underlying mechanisms* as the norm, just under different stress or conditions.

  **The Failure Conditions:**
  1.  **Mechanism Match:** You must demonstrate that the social forces causing the deviation are the same ones causing the norm. If the weaver's row was caused by a unique personal feud unrelated to class structure or property law, it reveals nothing about the norm.
  2.  **Theory Revision:** The exception must force you to refine the definition of the norm. If you can explain the exception without changing your understanding of the rule, you aren't doing deviant case analysis; you're doing storytelling.
  3.  **Exogenous Shock Check:** You must rule out that the deviation was caused by an external shock (war, famine, individual madness) that suspends the normal rules rather than revealing them.

  In **history**, specifically local history, this rigor is often dropped. The move becomes rhetorical: "This case is interesting, therefore it is structural." Your suspicion is correct: without the mechanism check, it is unfalsifiability wearing a cardigan. Any case can be framed as "revealing the boundaries" if you don't have to prove *how* it reveals them.

  ### The Coined Term

  Since existing terms describe the *method* but not the *abuse* of the method you are encountering, here is a term for the specific logical fallacy you have identified.

  **Term:** **Exceptional Immunity**

  **Definition:** A methodological move where any outlier is automatically granted explanatory power regarding the systemic norm without establishing a causal or structural link, thereby making the underlying theory immune to counter-evidence. It occurs when the phrase "the exception proves the rule" is used to prevent the exception from ever disproving the rule.

  **Boundary Cases (What it is NOT):**

  1.  **Productive Deviance (Not Exceptional Immunity):**
      *   *Scenario:* You find a woman who owned land in a system where women couldn't own land. You investigate and find a specific legal loophole that applies to all widows.
      *   *Why it isn't:* The exception forced you to refine the rule ("Women couldn't own land *unless* widowed"). The theory changed to accommodate the evidence.
      *   *Contrast:* In Exceptional Immunity, the theory stays the same, and the evidence is twisted to fit it.

  2.  **Idiosyncratic Noise (Not Exceptional Immunity):**
      *   *Scenario:* You find a weaver who beat his apprentice. You investigate and find he was known locally as a violent drunk, unrelated to economic conditions.
      *   *Why it isn't:* You classify this as noise. It is excluded from the model of "typical weaver behaviour" because it lacks structural causation.
      *   *Contrast:* In Exceptional Immunity, this weaver would be written up as "revealing the tensions in the master-apprentice relationship" despite the lack of structural evidence.

  **How to use this in your viva:**
  If you are challenged on why you haven't treated every trouble-case as a window into the norm, you can say: *"I am avoiding Exceptional Immunity. I am only treating deviations as structurally informative where I can trace the mechanism linking the deviation to the norm, rather than assuming all recorded conflict reveals systemic boundaries."* This shows you understand the methodology better than the person who gave you the advice.
