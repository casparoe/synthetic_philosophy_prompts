answer: |-
  A medical foundation holds a grant to fund a specific pain-management therapy lasting one year (Period 1), after which patients return to baseline care for the remainder of their equal life expectancy (Period 2). Two patients, Ali and Bill, are eligible. They are strangers with identical desert and responsibility. The therapy benefits exactly one patient by reducing pain scores (increasing well-being) during Period 1, with no side effects. Neither option is Pareto-superior. All other periods of both lives remain identical across the three states. Well-being is measured on a cardinal scale where 0 represents a neutral life level.

  | State | Person | Period 1 | Period 2 | Lifetime |
  | :--- | :--- | :--- | :--- | :--- |
  | **Status Quo** | Ali | 50 | 50 | **100** |
  | | Bill | 30 | 90 | **120** |
  | **Option A** | Ali | 70 | 50 | **120** |
  | (Help Ali) | Bill | 30 | 90 | **120** |
  | **Option B** | Ali | 50 | 50 | **100** |
  | (Help Bill) | Bill | 50 | 90 | **140** |

  **(1) Computations**
  Prioritarianism sums a strictly increasing, strictly concave transformation $f(w)$ of well-being. We test $f(w) = \sqrt{w}$ and $g(w) = w^{0.4}$.

  *Lifetime Application:* Compare gains in transformed lifetime totals.
  Status Quo: Ali (100), Bill (120). Ali is worse off.
  Option A Gain: $f(120) - f(100)$. Option B Gain: $f(140) - f(120)$.
  Using $\sqrt{w}$: A Gain $\approx 10.95 - 10.00 = 0.95$. B Gain $\approx 11.83 - 10.95 = 0.88$. Verdict: **Prefer A**.
  Using $w^{0.4}$: A Gain $\approx 6.73 - 6.31 = 0.42$. B Gain $\approx 7.13 - 6.73 = 0.40$. Verdict: **Prefer A**.

  *Period Application:* Compare gains in transformed period well-being during Period 1.
  Status Quo: Ali (50), Bill (30). Bill is worse off in Period 1.
  Option A Gain: $f(70) - f(50)$. Option B Gain: $f(50) - f(30)$.
  Using $\sqrt{w}$: A Gain $\approx 8.37 - 7.07 = 1.30$. B Gain $\approx 7.07 - 5.48 = 1.59$. Verdict: **Prefer B**.
  Using $w^{0.4}$: A Gain $\approx 5.45 - 4.78 = 0.67$. B Gain $\approx 4.78 - 3.90 = 0.88$. Verdict: **Prefer B**.

  **(2) Constraint Check**
  *   **One agent, two options, two people:** Foundation, A/B, Ali/Bill. (Met)
  *   **Strangers, equal lifespan, no desert:** Stated in narrative. (Met)
  *   **Benefits one, harms none:** A helps Ali, B helps Bill; no losses relative to SQ. (Met)
  *   **No Pareto superiority:** A helps Ali only; B helps Bill only. (Met)
  *   **Realistic:** Pain management therapy. (Met)
  *   **Opposite rankings:** Lifetime prefers A; Period prefers B. (Met)
  *   **Robustness:** Reversal holds for $\sqrt{w}$ and $w^{0.4}$. (Met)
  *   **Wretched stretch constraint:** Bill's low period (30) does not reduce his lifetime (120) below Ali's (100). (Met)
  *   **Explicit scale:** 0 identified as neutral. (Met)

  **(3) Feature Identification and Perturbation**
  The divergence arises from the *temporal distribution* of well-being within a life. Bill suffers more intensely in Period 1, triggering Period Prioritarianism, but compensates in Period 2, securing higher lifetime well-being, triggering Lifetime Prioritarianism. To remove this, perturb Bill's Period 2 well-being from 90 to 50. Bill's lifetime becomes 80. Now, Bill is worse off than Ali in both lifetime (80 vs 100) and Period 1 (30 vs 50). Both applications now prioritize Bill (Option B). The reversal vanishes when the bad stretch substantially reduces the lifetime total.

  **(4) The Zero Point**
  The case depends on the zero point because concavity is scale-sensitive. If 0 represented absolute non-existence rather than a neutral life level, shifting the scale (e.g., adding 100 to all figures) would flatten the curvature, potentially eliminating the reversal. A prioritarian must fix the zero point at a morally relevant neutral level (a life neither good nor bad) to ensure the weighting function tracks moral urgency rather than arbitrary numerical placement. Without a fixed zero, the "priority" given to the worse off becomes indeterminate.

  **(5) Distinction from Leveling-Down**
  This is not the leveling-down objection. Leveling-down objects to equality requiring someone be made worse off while no one is better off. Here, both options make someone better off while harming no one; the conflict is purely about *which* gain counts more. Both views share a sensitivity to distributional metrics beyond totals, but this case isolates the *unit* of distribution. Egalitarians face an identical temporal question: should equality be measured across whole lives or time-slices? If egalitarians prioritize time-slices, they align with Period Prioritarianism here; if whole lives, with Lifetime Prioritarianism. The structural ambiguity exists for both views.

  **(6) Strongest Attacks**
  *Defender of Lifetime Application:* "Persons are temporally extended entities, not mere containers for momentary experiences. Moral concern attaches to the narrative whole of a life. Prioritizing Bill because of one bad year ignores his compensating good years, effectively treating him as a series of strangers rather than a single agent with a lifetime interest. To respect personhood, we must aggregate well-being over the complete life before applying the priority weighting."

  *Defender of Period Application:* "Suffering is experienced momentarily, not retrospectively. The urgency of relieving pain in Period 1 is not diminished by the promise of comfort in Period 2. Prioritarianism aims to relieve suffering where it is most acute. To delay relief because the sufferer will later be comfortable is to privilege the accounting of lives over the phenomenology of pain. The moral unit must be the experiencing subject at the time of suffering."
