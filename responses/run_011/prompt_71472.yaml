answer: |-
  **Private Sketch of Logical Space**
  1. Ontology: Are qualia real properties, intentional objects, or fictions?
  2. Access: Is introspection authoritative data or fallible judgment?
  3. Structure: Is higher-order awareness necessary for consciousness?
  4. Content: Is experience transparent to the world or opaque to itself?
  5. Grounding: Is the phenomenal physical, conceptual, or intrinsic non-physical?

  ***

  **Diagnostic Decision Tree**

  **Node 1 (First-Person Reporting / Disputed):** Consider Dennett's coffee tasters. When your verdict changes on coffee you once loved, did the *sensory quality* change, or only your *judgment* of it?
  *   *Judgment:* Go to Node 2.
  *   *Quality:* Go to Node 3.

  **Node 2 (Metaphysics / Disputed):** If judgment changed without quality change, is the remaining "feel" a real neural state misrepresenting itself, or nothing at all?
  *   *Nothing:* **Eliminativism**.
  *   *Misrepresentation:* **Illusionism**.

  **Node 3 (First-Person Reporting / Disputed):** When you fail to re-identify a shade of red later, was the original experience inherently vague, or was your memory of a precise quality faulty?
  *   *Vague:* Go to Node 4.
  *   *Faulty Memory:* Go to Node 5.

  **Node 4 (Metaphysics / Disputed):** When looking at a blue sky, are you aware of the experience's blueness, or only the sky's blueness?
  *   *Sky's:* **Representationalism/Transparency**.
  *   *Experience's:* **Naive Realism/Disjunctivism**.

  **Node 5 (Metaphysics / Disputed):** Can a mental state be consciously felt without any higher-order thought about that state?
  *   *No:* **Higher-Order Thought**.
  *   *Yes:* Go to Node 6.

  **Node 6 (Metaphysics / Disputed):** If we fully explain functional processing, is there still an intrinsic 'light' left unexplained?
  *   *No (Conceptual):* **Phenomenal-Concept Strategy**.
  *   *No (Linguistic):* **Quietism**.
  *   *Yes:* **Russellian Monism**.

  ***

  **Positional Leaves**

  **Eliminativism:** Qualia are theoretical fictions with no referent in reality. *Awkward:* Tells sufferers their pain isn't real.

  **Illusionism:** Qualia are real misrepresentations generated by cognitive processing. *Awkward:* Claims the feeling of feeling is itself an illusion.

  **Representationalism:** Phenomenal character is identical to representational content directed at the world. *Awkward:* Struggles to distinguish identical contents with different feels.

  **Naive Realism:** Experience is a direct relation to mind-independent properties. *Awkward:* Cannot easily accommodate hallucination without disjunctivism.

  **Higher-Order Thought:** Consciousness consists in thinking about a lower-order mental state. *Awkward:* Implies animals and infants lack consciousness.

  **Phenomenal-Concept:** Physical states exist, but we grasp them via unique phenomenal concepts. *Awkward:* Makes epistemic gaps seem ontological.

  **Quietism:** The hard question arises from linguistic confusion rather than metaphysical depth. *Awkward:* Offers no comfort against the existential weight of experience.

  **Russellian Monism:** The intrinsic nature of physical structure is phenomenal. *Awkward:* Implies electrons have proto-experience.

  ***

  **Diagnostic Limitations and Unoccupied Space**

  **Pairs Not Separated:** Node 2 separates Eliminativism and Illusionism, but Node 6 clusters Phenomenal-Concept, Quietism, and Russellian Monism loosely. Phenomenal-Concept and Quietism are often pragmatically indistinguishable; both deny an ontological gap, though one posits conceptual uniqueness. Representationalism and Transparency views are treated as one leaf, though some argue transparency is a method, not a metaphysics.

  **Unoccupied Combinations:** Naive Realism combined with Eliminativism is incoherent; one cannot directly perceive fictions. Russellian Monism combined with Quietism is unattractive; it posits a specific ontology only to dismiss questions about it. Eliminativism combined with Higher-Order Thought is unexplored; if qualia are fictions, higher-order thoughts about them lack objects.

  **Consensus and Assumptions:** All nodes are marked **Disputed**; there is no consensus on introspective authority or metaphysical grounding. The only near-consensus is that subjects make reports, but their interpretation is contested.

  **Dennett-Friendly Assumption:** This tree smuggles in a Dennett-friendly assumption at Node 1 and Node 3. It treats introspective reports as fallible judgments subject to empirical correction rather than incorrigible data. A Cartesian would reject the tree's root, insisting the "quality change" is undeniable regardless of neural explanation. By framing the shade question as "vague experience vs. faulty memory," the tree assumes experience is not inherently self-intimating, privileging heterophenomenology over first-person authority.
