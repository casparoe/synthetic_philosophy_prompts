  **The Scenario**

  Two inertial observers, Alice and Bob, pass one another at a relative speed of 10 meters per second in flat spacetime. At the exact moment they coincide (event $O$), a macroscopic randomizer located at a stationary beacon 1 billion light-years away undergoes a stochastic physical process: a Geiger counter monitors a radioactive source, and if a decay occurs within a specific one-second window, a large mechanical flag flips from white to black; if not, it remains white. The laws governing this decay are fundamentally indeterministic, assigning an objective single-case chance of 50% to the flag flipping. In Alice's inertial frame, the flag-flipping event is simultaneous with $O$. In Bob's frame, due to the relativity of simultaneity, the event lies approximately 32 years in the future. Both observers agree that neither can causally influence the beacon from $O$, nor can the beacon influence them before the event occurs.

  **The Numbers and Causal Check**

  *   **Relative Speed ($v$):** 10 m/s (ordinary walking pace).
  *   **Distance ($D$):** $10^9$ light-years $\approx 9.46 \times 10^{24}$ meters.
  *   **Simultaneity Offset ($\Delta t$):** Using the low-velocity approximation $\Delta t \approx vD/c^2$:
      $$ \Delta t \approx \frac{10 \times 9.46 \times 10^{24}}{(3 \times 10^8)^2} \approx 1.05 \times 10^9 \text{ seconds} \approx 33 \text{ years}. $$
  *   **Causal Check:** The spacetime interval $s^2$ between the passing event $O$ $(0,0)$ and the beacon event $E$ $(0, D)$ in Alice's frame is $s^2 = c^2(0)^2 - D^2 = -D^2$. Since $s^2 < 0$, the separation is spacelike. No signal traveling at or below $c$ can connect $O$ and $E$. The event is causally isolated from the observers' decision to argue about it.

  **Analysis**

  **(i) Premises Used and Declined**
  The case relies on three core premises: (1) **Special Relativity** (specifically the relativity of simultaneity in Minkowski spacetime); (2) **Ontic Parity** (if an event is real for one inertial observer, it is real for all, as no frame is privileged); and (3) **Stochastic Laws** (the physical dynamics at the beacon are objectively indeterministic). The case explicitly declines the premise of **Causal Determinism** (that the state of the world at $O$ necessitates the outcome at $E$). It also declines the assumption that "real" entails "causally fixed by the past."

  **(ii) Where "Already Real" and "Already Fixed" Come Apart**
  In this scenario, "already real" means the event occupies a definite coordinate in the four-dimensional manifold; it is part of the geometric structure of the world just as much as the observers' meeting at $O$. "Already fixed" would mean the outcome is necessitated by the physical state within the past light cone of $E$. The scenario posits that while the event *exists* in the block (making it real for Alice and Bob equally), its specific outcome (black or white) is not contained in or necessitated by the prior physical state. This is compatible with Lorentz invariance because the *probability distribution* of the outcome is invariant, even if the temporal ordering of the outcome relative to $O$ is not. The fact that the event exists does not require that its properties be functions of its past; they can be brute facts of the four-dimensional distribution.

  **(iii) The Single Feature Doing the Work**
  The feature holding the scenario together is the **stochastic nature of the physical law** at the beacon. If you remove this and replace it with deterministic classical mechanics, the state of the beacon at the time of the event becomes a mathematical function of the state at $O$ (and prior). In that case, "already real" would indeed collapse into "already fixed," because the geometry would merely be displaying a necessitated trajectory. With stochastic laws, the geometry contains the event, but the dynamics do not constrain it to a single value until the interaction occurs. The fatalist version returns if you assume that existence in the manifold implies a unique, pre-existing truth value for all propositions about that event.

  **(iv) The Best Reply and Honest Assessment**
  Your friend's strongest reply is this: "If the event is already real, then the proposition 'The flag is black' is either true or false right now. If it is true now, the chance was never 50%; it was 100%. If it is false, the chance was 0%. You cannot have a determinate fact of the matter coexist with an objective single-case chance."

  Does the case survive? **Honestly, only if you are willing to modify classical logic.** In standard bivalent logic applied to a Block Universe, every event has a truth value. If the flag is "real" in the block, the truth value exists. If the truth value exists, objective chance is an illusion (it becomes merely epistemic ignorance). To save the scenario, you must argue that "truth" is perspective-dependent or that propositions about indeterministic future events lack a truth value even if the event is ontologically present (a view sometimes called "supervaluationism" or "branching time"). However, branching time modifies the topology of spacetime away from standard flat Minkowski geometry.

  Therefore, the specifications are **not jointly satisfiable** under standard assumptions of classical logic and standard Minkowski topology. You can have SR + Realism (Block Universe), or SR + Indeterminism (Open Future), but holding both "Already Real" (in the full truth-valued sense) and "Objectively Undetermined" (no truth value yet) creates a logical tension that the geometry alone cannot resolve. The geometry forces the event to be *ontologically present*, but it cannot force it to be *causally open* without sacrificing the idea that "present" events have definite truth values. Your friend is right that the geometry pressures you toward fatalism, but you are right that the geometry does not *prove* the laws of physics are deterministic. The gap lies not in the physics, but in the logic of truth values applied to spacetime.
