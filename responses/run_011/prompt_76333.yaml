answer: |-
  1. **The Kripkean Skeptic**
  **Objection:** "You claim to have one intension, a function from centered worlds to truth values, but when you apply this to natural-kind terms like 'water', you still need the center to fix the reference via a description like 'the watery stuff around here'. That *is* an epistemic intension, however much you dislike the name. You haven't escaped the Kripkean critique that descriptive content shouldn't fix reference for natural kinds; you've just smuggled the descriptive content back in through the back door of the 'center'. If the center fixes the reference, you have semantic pluralism by another name."
  **Reply:** "I deny that the center fixes the reference via description. The center fixes the *context* of evaluation, not the semantic value directly. On my view, 'water' has a single intension that picks out H2O at every world compatible with the actual nature of water. The center tells us which world is actual, not what water is. When we say 'water is H2O' is necessary a posteriori, we mean the intension is true at every world when evaluated counterfactually from our center, but we cannot know this a priori because we don't know a priori which center we occupy. The descriptive 'watery stuff' is not part of the content; it is part of the epistemic situation of the agent at the center. This preserves the Kripkean insight that reference is not descriptive while explaining the epistemic gap without positing two propositions."
  **Soft Spot:** If the agent cannot identify their center without descriptive information, the distinction between fixing context and fixing content collapses, forcing me to concede that natural kinds do have an epistemic intension after all.

  2. **The Formal Semanticist**
  **Objection:** "This looks like standard doubly-indexed semantics for 'actually', familiar from Kaplan and Stalnaker. You're treating the center as a second index alongside the world. What is the thesis here besides notational variance? My colleague in the Stalnaker camp says the 'actually' literature delivers this with fewer coordinates. If this is just bookkeeping for indexicals, where is the philosophical contribution? It reads like a technical appendix in search of a thesis."
  **Reply:** "You are right that the formalism is compatible with standard doubly-indexed semantics; I concede the technical overlap. The thesis is not the math, but the metaphysical interpretation of those coordinates. Standard semantics treats indices as abstract parameters; centered worlds treat them as agents located within the world. The contribution is the claim that modal confusion arises from conflating modes of *evaluation* relative to a center, not distinct propositions. This grounds the technical apparatus in epistemic access, solving the problem of why necessary truths aren't always knowable a priori. The least defensive answer is to admit the formalism is known but insist that its application to the necessary a posteriori and phenomenal concepts yields new philosophical results that abstract indices do not motivate."
  **Soft Spot:** If the formalism does not generate new predictions or solve puzzles the old formalism couldn't, the metaphysical gloss might look like epicycles, forcing me to promise results from later chapters to justify the complexity.

  3. **The Committed Two-Dimensionalist (Zombie Argument)**
  **Objection:** "If conceivability is just holding coordinates fixed in the primary mode, and you block the move to possibility via your 'location not criteria' principle, what work does the zombie argument do? You keep zombie conceivability intact but deny the modal payoff. Isn't that defanging the main motivation for two-dimensionalism? If conceivability doesn't guide possibility, why should we care about epistemic space or scrutability?"
  **Reply:** "The payoff shifts from metaphysics to epistemology. Zombies are conceivable because we can evaluate the intension at a center without knowing our own center's physical realization. This explains the *epistemic gap* without requiring a *metaphysical gap*. The framework earns its keep by explaining why the gap feels modal when it is actually indexical. We retain scrutability because the intension is knowable given the center; we just lack the center. This preserves the explanatory power of conceivability for epistemic situations without committing to dualism, which is a net gain for physicalists who want to take phenomenology seriously."
  **Soft Spot:** If the epistemic gap doesn't imply a metaphysical one, dualists will say I haven't explained the hard problem, only renamed it, forcing me to give up the claim that this framework resolves the zombie argument.

  4. **The Committed Two-Dimensionalist (Primary Intensions)**
  **Objection:** "If primary intensions aren't distinct components of content but just modes of evaluation, how do you explain cognitive significance? Two sentences can have the same single intension but differ in cognitive value. Usually, we use primary intensions to capture that mode of presentation. If you deflate them to modes of evaluation, you lose the tool we use to explain why 'Hesperus is Phosphorus' is informative."
  **Reply:** "Cognitive significance is captured by the *path* to evaluating the intension, not the intension itself. Knowing which center one occupies is part of the cognitive state, not the semantic content. The distinction is pragmatic and epistemic, not semantic. 'Hesperus is Phosphorus' is informative because learning it updates your knowledge of which center you occupy, not because it changes the proposition expressed. This avoids semantic pluralism while retaining the explanation of cognitive dynamics. The primary intension isn't a separate object; it's the rule for how the single intension responds to shifts in epistemic perspective."
  **Soft Spot:** This risks conceding that semantics doesn't capture cognitive significance, which might weaken the claim that this is a semantic theory rather than a pragmatic one, forcing me to redraw the semantics-pragmatics boundary.

  5. **[HOPE NOBODY ASKS] The Phenomenal Concept Exception**
  **Objection:** "You claim phenomenal concepts are special because the two modes of evaluation coincide (iv), but your general principle (v) says centers contribute location, not criteria. If the center is having the experience, isn't that a criterion? How do you justify this exception without ad hocery? It looks like you're tweaking the rules to save physicalism while accommodating dualist intuitions."
  **Reply:** "The experience *is* the location, not the criteria. The criteria are physical realization. For phenomenal concepts, the location *fixes* the extension directly because the concept refers to the experience itself, not its realization. This isn't a special plea but a consequence of the nature of phenomenal reference: you cannot refer to the experience without occupying the center having it. Thus, the modes coincide because the reference is locked to the center's location. This blocks the move from conceivability to possibility for physical truths while leaving zombie conceivability intact, preserving the physicalist ontology."
  **Soft Spot:** This looks like a special plea to save physicalism while accommodating dualist intuitions, forcing me to promise results from chapters I have not written to prove this follows from a general principle rather than an exception.
