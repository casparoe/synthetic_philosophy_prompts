answer: |-
  # The Value of Information: A Classroom Experiment

  ## 1. Physical Setup and Materials
  **Room:** Standard seminar room. Whiteboard essential.
  **Students:** 16 (scalable to 8).
  **Materials Cost:** $0 (assuming access to paper/envelopes/scissors).

  **Preparation (Before Class):**
  1.  **The Deck:** 20 Index Cards. 10 marked **RED**, 10 marked **BLACK**. Shuffle thoroughly.
  2.  **The Packets:** 16 Envelopes. Inside each envelope place:
      *   4 **Round Slips** (numbered 1–4, pre-printed with decision boxes).
      *   4 **Signal Sleeves** (smaller opaque envelopes, sealed).
          *   *Crucial:* The content of the Signal Sleeves depends on the Round. You will prepare 4 sets of 16 sleeves, labeled R1, R2, R3, R4. You will hand out the correct set at the start of each round.
          *   *R1 Sleeves:* 8 say "Signal: RED", 8 say "Signal: BLACK". (Simulates 50/50 state, 100% accuracy for simplicity in execution, or use a probabilistic generator if you prefer, but deterministic is faster). *Correction:* To match the math below, we need noisy signals.
          *   *Revised Signal Prep:* To save time during class, **you** will act as the Signal Generator. The Sleeves will be empty. If a student chooses "Look," they hand you the slip, you draw from a "Signal Deck" (prepared per round) and write the signal on their slip, then hand it back. This prevents pre-leakage and allows probabilistic signals.
      *   **Scorecard:** A single sheet per student to track cumulative points.
  3.  **Whiteboard:** Draw a grid: 4 Rows (Rounds), 16 Columns (Student Initials). Leave space for "Class Average."
  4.  **Stakes:** Announce that total points convert to a leaderboard. Top 3 students receive a $15 coffee voucher (or equivalent). This ensures they care about the points.

  ## 2. The Payoff Scheme
  *   **Currency:** "Epistemic Points" (EP).
  *   **Conversion:** 100 EP = 1 Unit of Prize Eligibility.
  *   **Baseline Payoff:**
      *   Correct Guess: +10 EP.
      *   Incorrect Guess: 0 EP.
      *   Declining Info: 0 Cost.
  *   **Scoring:** Students record their own EP on their Scorecard. At the end of each round, 4 random students are audited (you check their Round Slip against the Board). Discrepancies result in -5 EP penalty. This enforces honesty without you grading everything.

  ## 3. The Mechanism: Accept/Decline
  *   **Privacy:** Decisions are private (written on Slip).
  *   **Verification:**
      *   If **Decline**: Student folds the Signal Sleeve unopened and places it in a "Return Box."
      *   If **Accept**: Student opens Sleeve (or receives Signal from you), records it, then places the empty Sleeve in the "Return Box."
      *   *Why:* You can verify compliance by checking the Return Box. Unopened sleeves = Decline. Opened/Marked = Accept.
  *   **Strategic Decline:** Students cannot signal their choice to others before betting (simultaneous submission).

  ## 4. Round Design (Premise Surgery)
  *Total Time: 80 Minutes.*

  ### Introduction (5 Minutes)
  *   Distribute Packets.
  *   Explain the Stakes and the Audit Rule.
  *   **Script:** "In each round, there is a hidden State (Red or Black). You will guess the State. You may be offered Information. Your goal is to maximize EP. Do not discuss strategies between rounds."

  ### Round 1: The Baseline (10 Minutes)
  *   **Condition:** All Good's Theorem conditions hold.
  *   **State:** 50% Red, 50% Black (Draw from Deck).
  *   **Info Offer:** "I will draw a Signal Card. It matches the State with 80% probability."
  *   **Cost:** 0 EP.
  *   **Action:** Guess Red or Black.
  *   **Math:**
      *   Blind EU: 5 EP.
      *   Info EU: (0.8 × 10) + (0.2 × 0) = 8 EP.
      *   **Value of Info:** +3 EP.
  *   **Expected Behavior:** Rational students **Accept**.
  *   **Execution:** Collect Slips. Generate Signals (flip a biased coin or use a pre-shuffled signal deck: 80% match, 20% mismatch). Reveal State. Students tally scores. One student writes Class Average on Board.

  ### Round 2: The Dominance Trap (10 Minutes)
  *   **Condition Broken:** *Information could change her choice.* (Info is irrelevant).
  *   **State:** 90% Red, 10% Black (Use a rigged deck: 9 Red cards, 1 Black card).
  *   **Info Offer:** "Signal matches State with 60% probability." (Weak signal).
  *   **Cost:** 1 EP (Small friction cost).
  *   **Action:** Guess Red or Black.
  *   **Math:**
      *   Blind EU (Guess Red): 9 EP.
      *   Info EU: Even if Signal says Black, Posterior P(Red|SigBlack) ≈ 85%. You still guess Red.
      *   Info changes nothing. Net Value = 0 - 1 (Cost) = -1 EP.
  *   **Expected Behavior:** Rational students **Decline**.
  *   **Execution:** Emphasize the probabilities. "The urn is heavily weighted Red." Collect, Reveal, Tally.

  ### Round 3: The Costly Signal (10 Minutes)
  *   **Condition Broken:** *Information is freely available.* (Info is costly).
  *   **State:** 50% Red, 50% Black.
  *   **Info Offer:** "Signal matches State with 80% probability." (Same as R1).
  *   **Cost:** **4 EP.**
  *   **Action:** Guess Red or Black.
  *   **Math:**
      *   Info Gross Value: +3 EP (Same as R1).
      *   Net Value: 3 - 4 = -1 EP.
  *   **Expected Behavior:** Rational students **Decline**.
  *   **Execution:** Explicitly state: "Accepting this information deducts 4 points from your round score immediately."

  ### Round 4: The Commitment Constraint (10 Minutes)
  *   **Condition Broken:** *Fixed set of available acts.* (Looking restricts action).
  *   **State:** 60% Red, 40% Black.
  *   **Info Offer:** "Signal is 100% Accurate." (Perfect Info).
  *   **Cost:** 0 EP.
  *   **Constraint:** "If you **Accept** Information, you are contractually bound to guess **BLACK**. If you **Decline**, you may guess freely."
  *   **Math:**
      *   Decline (Free): Guess Red. EU = 6 EP.
      *   Accept (Bound): Must guess Black. P(Black) = 0.4. EU = 4 EP.
      *   **Value of Info:** -2 EP.
  *   **Expected Behavior:** Rational students **Decline**.
  *   **Execution:** This is the "Toxic Info" round. Make the constraint bold on the slip.

  ### Tally and Audit (10 Minutes)
  *   Have students finalize scores.
  *   Audit 4 random students.
  *   Fill the Whiteboard Grid (Round Averages).
  *   Announce Top 3 Leaders (provisional).

  ## 5. The Debrief (35 Minutes)
  *Do not state the theorem. Derive it from the board.*

  **Step 1: The Scoreboard (10 mins)**
  *   Point to Round 1 Average. "Most of you gained points here. Why did you look?" (Students: "To increase accuracy.")
  *   Point to Round 2, 3, 4. "In these rounds, the majority declined. Why?"
  *   Elicit reasons: "Cost too high," "Didn't matter anyway," "Restricted my bet."
  *   Write these reasons on the side of the board.

  **Step 2: Reconstructing the Agent (10 mins)**
  *   Ask: "In Round 1, what assumptions were you making about how you would use the info?"
  *   Target Answer: "I assumed I would update my belief and pick the best option." (Conditionalization + EU Max).
  *   Ask: "In Round 4, why was perfect information bad?"
  *   Target Answer: "It took away my freedom to choose." (Action Space).
  *   Ask: "In Round 2, why was info useless?"
  *   Target Answer: "I was going to guess Red no matter what." (Irrelevance).

  **Step 3: Stating the Theorem (10 mins)**
  *   Synthesize their observations into the formal conditions.
  *   "You just demonstrated I. J. Good's Theorem. It states: For an agent who [Student: Maximizes EU], who [Student: Updates by Conditionalization], facing [Student: Fixed Acts], where info is [Student: Free] and [Student: Doesn't change preferences]..."
  *   "...Information has non-negative expected value."
  *   "It is strictly positive exactly when..." [Student: It can change the decision].

  **Step 4: The Ellsberg Connection (5 mins)**
  *   Briefly link back to last week. "Good's theorem assumes you are an Expected Utility maximizer. If you are ambiguity averse (Ellsberg), does the theorem hold? We didn't test that today, but that is where the literature goes next."

  ---

  ## 6. Candid Critique: What Will Go Wrong

  ### 1. The "Curiosity" Spoilers
  *   **Problem:** 2-3 students will accept information in Rounds 2, 3, or 4 simply because they want to know the signal, ignoring the point cost. They will score lower and complain.
  *   **Detection:** Watch for students who open sleeves immediately without reading the slip constraints.
  *   **Mitigation:** In the Intro, say: "This is a competition. Curiosity is a utility, but it is not *Epistemic Points*. Maximize EP." During Debrief, use their low scores as data: "Student X paid for curiosity. That is a utility disturbance, which violates condition 5."

  ### 2. The "Game the Instructor" Meta-Strategy
  *   **Problem:** Grad students are paranoid. They will assume Round 1 is a trick and decline, or assume Round 4 is the 'real' test.
  *   **Detection:** Hesitation in Round 1. Whispering.
  *   **Mitigation:** Random Audit. If they decline Round 1 and lose points, they lose the competition. The financial stake (coffee) usually overrides meta-gaming.

  ### 3. The Conditionalization Assumption
  *   **Problem:** You cannot verify if they actually conditionalized. They might have looked at the signal and ignored it.
  *   **Shortfall:** The game tests the *incentive* to look, not the *updating*.
  *   **Fix:** In the Debrief, be explicit: "We assumed you updated rationally. If you looked and ignored the signal, you violated the theorem's premises, not the conclusion. The theorem guarantees value *if* you use the info correctly."

  ### 4. Imposed Utility
  *   **Problem:** You are handing them a utility function (Points). A preference for not looking in Round 3 is a preference about the *game*, not a genuine philosophical stance on information.
  *   **Shortfall:** Students may feel the "Cost" round is artificial.
  *   **Fix:** Acknowledge this. "In the real world, 'cost' is time or attention. Here, it is points. The structure is isomorphic."

  ### 5. The "Fixed Acts" Condition (Round 4)
  *   **Problem:** This is the strongest round, but students might argue "I wouldn't accept that contract."
  *   **Fix:** Frame it as "Protocol." "In this environment, looking triggers an automatic filing system that locks your bet." Make it mechanical, not voluntary.

  ### 6. Scorekeeping Errors
  *   **Problem:** 16 students doing arithmetic under time pressure.
  *   **Mitigation:** Keep the math base-10. (10 points, 0 points). Allow calculators (phones) for the tally phase only.

  ## 7. Scalability Note
  *   **For 8 Students:** The game works identically. The Whiteboard grid is smaller. The "Class Average" is more volatile (one student skews it more), which you can use in debrief to discuss sample size and expected value vs. realized value.
  *   **For 30+ Students:** The Tally phase becomes unmanageable. Switch to "Team Score" (5 teams of 6). Team captain submits one aggregate sheet.

  ## 8. Materials List (Zero Cost)
  *   **Paper:** 16 Scorecards, 64 Round Slips (4 per student).
  *   **Envelopes:** 16 Large (Packets), 64 Small (Signal Sleeves).
  *   **Cards:** 20 Index Cards (Red/Black markers).
  *   **Writing:** Whiteboard markers, pens for students.
  *   **Prizes:** 3 Coffee Cards (Instructor funded).

  ## 9. Final Instructor Script for the "Hard" Condition
  *There is one condition you cannot simulate with paper: **Conditionalization**.*
  *   **In Debrief:** "Notice I never checked *how* you used the signal. Good's Theorem proves information is valuable *given* that you conditionalize. If you update by some other rule (e.g., conservatism, representativeness), information can be harmful. We assumed rationality to test the value of the info itself. Next week, we ask: what if the agent isn't Good?"
