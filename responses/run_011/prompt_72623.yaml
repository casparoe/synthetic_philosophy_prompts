answer: |-
  This is a sophisticated ethical dilemma that sits at the intersection of moral philosophy, social psychology, and game theory. You are describing a phenomenon known in social science as 'norm entrepreneurship', where a visible actor inadvertently shifts a coordination equilibrium. The ethical question is whether you have a duty to maintain a standard you helped inflate, or a licence to dismantle it, and by what means.

  In addressing what you ought to do, it is helpful to distinguish between points where there is broad consensus among ethicists and social theorists, and areas where reasonable disagreement persists.

  ### Settled Ground: Where Consensus Exists

  There are three premises regarding your situation that are generally accepted in applied ethics and social theory.

  **1. The Reality of Unintended Consequences**
  It is an empirical fact, widely accepted in sociology, that visible outsiders influence local norms. You are correct that your behaviour has shifted the equilibrium. Ethicists agree that moral responsibility extends to foreseeable consequences, even unintended ones. If your adherence to a rule imposes a net cost on the community (in time, money, or social friction) that exceeds the benefit of the rule itself, your continued adherence contributes to a collective harm. You cannot claim moral neutrality simply because your intent was politeness; the outcome is a burden on your neighbours.

  **2. The Constraint Against Manipulation**
  There is strong consensus on the Kantian principle that one should not treat people merely as means to an end. Your hesitation about crossing on red 'in view of witnesses' to send a signal is well-founded. Deliberately manipulating social signals to engineer a behavioural change in others, without their knowledge that an experiment is taking place, treats your neighbours as instruments of your moral design. Most ethical frameworks regard covert social engineering as problematic, even if the intended outcome is beneficial. Transparency is generally preferred to manipulation.

  **3. The Distinction Between Welfare and Convention**
  There is agreement that not all norms carry the same moral weight. Norms that protect physical safety (traffic laws) are distinct from norms of economic convention (tipping) or social etiquette (queuing distances). It is settled that one has a stronger obligation to uphold norms that prevent harm than those that merely coordinate behaviour. Therefore, a uniform strategy for all three behaviours (crossing, tipping, queuing) is ethically inferior to a differentiated approach.

  ### Disputed Ground: Where Reasonable Disagreement Persists

  Beyond those baselines, several key questions remain genuinely contested in moral philosophy. You must weigh these competing arguments yourself, as there is no single authoritative answer.

  **1. The Obligation of the Guest**
  *View A:* Some argue that a visitor has a strict duty of conformity. On this view, the 'guest' status obliges you to minimise friction and respect the host culture's evolving standards, whatever they become. To break a norm now is to assert a privilege: 'I made the rule, so I can break it.'
  *View B:* Others argue that the temporary nature of your stay reduces your obligation to conform. Since you will not bear the long-term costs of the tightened norms, you have a *greater* duty to prevent locking the community into a sub-optimal equilibrium. On this view, the 'guest' should leave the house in better order than they found it, even if that requires disrupting current habits.

  **2. Strategic Norm-Breaking**
  *View A:* Rule utilitarians might argue that once a norm is established (even by you), breaking it undermines trust and social cohesion. The uncertainty caused by your deviation might cost more than the time saved at crossings.
  *View B:* Act utilitarians or pragmatists might argue that if the norm is now net-harmful, breaking it is obligatory, provided the signal is clear. The dispute lies in whether a 'corrective signal' is permissible if it looks like hypocrisy.

  **3. Differentiation of Norms**
  *View A:* Some cultural relativists argue that an outsider lacks the standing to distinguish between 'good' and 'bad' local norms. To decide that tipping is 'bad' but queuing is 'good' is to impose your own cultural hierarchy on the host community.
  *View B:* Universalists argue that certain costs (financial pressure on staff to arrange grander meals; time lost at crossings) are objectively burdensome regardless of culture, and you are justified in mitigating them based on general welfare principles.

  ### Applied Analysis: What Ought You to Do?

  Given the settled ground and the disputed terrain, a uniform approach is inadvisable. You should treat your three areas of concern differently, prioritising transparency over covert signalling.

  **1. The Traffic Crossing (Safety Norm)**
  *Analysis:* This is a welfare-protecting norm. While your neighbour complains of the twenty minutes lost, the norm exists to prevent accidents.
  *Recommendation:* Do not start crossing on red to signal a relaxation of the standard. The risk of physical harm outweighs the time cost, and the 'experiment' would be ethically dubious. However, you can mitigate the social pressure verbally. If your neighbour mentions the wait, you might say, 'I wait because I am unfamiliar with the traffic patterns here; you know this street better than I.' This grants them permission to use their own local judgement without you breaking the safety rule.

  **2. The Tip Jars (Economic Norm)**
  *Analysis:* You view this as a subsidy to employers. The staff now feel pressured to spend the money on something 'grander' they do not want. This is a clear net negative.
  *Recommendation:* Here, you have more licence to adjust. Because this is a financial convention rather than a safety rule, the 'guest obligation' is weaker. However, do not simply stop rounding up without context, as this may be read as stinginess. Instead, speak to the baristas. Tell them you are reducing your contribution because you understand the jar is creating pressure for them to spend unnecessarily. This converts a covert signal into an open conversation. It relieves them of the obligation to match you, as you have explicitly decoupled your behaviour from the standard.

  **3. The Market Queue (Social Etiquette)**
  *Analysis:* This is a coordination norm. The 'half-step' rebuke indicates high social friction.
  *Recommendation:* This requires the most nuance. Abruptly standing closer may cause offence. The 'settled' view on transparency suggests you should not play games with distance. If you wish to normalise the distance, do so gradually, or attribute it to your own clumsiness rather than a principled stand. However, given you have only six months remaining, the most ethical course may be to maintain the distance but verbally discount it. If someone comments, reiterate that you are being overly cautious as a visitor.

  ### Conclusion

  You ought not to engage in the proposed plan of crossing on red to manipulate expectations. That strategy fails the test of transparency and treats your neighbours as means to an end. Furthermore, it conflates safety norms with economic ones.

  Instead, you should adopt a strategy of **explicit decoupling**.

  1.  **Maintain safety norms** (crossings) but verbally grant locals permission to deviate based on their superior local knowledge.
  2.  **Adjust economic norms** (tips) but explain the change to the recipients to relieve their sense of obligation.
  3.  **Accept the remaining six months** as a sunk cost. You cannot fully reverse eighteen months of conditioning in half a year without causing confusion.

  The ethical burden you feel is real, but it is best discharged through communication rather than behavioural signalling. You cannot control how the community evolves after you leave, but you can ensure that while you are there, your interactions are honest about your status as a temporary participant who does not wish to set a permanent standard.
