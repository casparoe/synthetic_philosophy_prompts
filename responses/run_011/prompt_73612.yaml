  *(Self-Correction on the "Resisting Sequence"):* The prompt asks for a sequence that does "the most national work" but escapes the theories. The Execution scene is good, but does it do "national work"? Yes, it crystallizes the nation into a body. But perhaps the *Battle of Stirling* is better? No, the Execution is more iconic. Let's argue that the Execution transforms Wallace from a leader of a community (Anderson) into a *totem* (Durkheimian? No, stick to the prompt). It creates a *sacred object* (the memory of Wallace) that allows the tradition (Hobsbawm) to stick later. It is the *generative event* that makes the invention possible. It escapes Anderson because it's not about horizontal comradeship (he is isolated); it escapes Hobsbawm because it's not a repeated ritual yet, it's the singular trauma that *justifies* future rituals.

