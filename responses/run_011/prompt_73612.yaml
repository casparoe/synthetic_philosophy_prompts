      *   **Core Task:** Distinguish between Hobsbawmian "invention" (ritualized practices asserting false continuity) and Andersonian "imagining" (modular nationalism projected backward) within the film. Identify a sequence that resists *both* frameworks. Consider the film *itself* as a site of tradition-invention.
      *   **Closing:** Address the student objection regarding historical accuracy vs. invention of tradition (is "getting it wrong" just "inventing tradition" with a negative label?).
      *   **Tone:** Academic, nuanced, suitable for a seminar leader/TA, philosophically rigorous.

  2.  **Deconstruct the Theoretical Frameworks:**
      *   **Hobsbawm:** Focuses on *practices*, *rituals*, *symbols* (tartan, kilts, oaths) that claim antiquity but are recent. It's about *legitimation* through false lineage. Key concept: "Factitious" continuity.
      *   **Anderson:** Focuses on *consciousness*, *scale*, *homogeneity*. Nationalism is a modern cognitive style (print capitalism, etc.) applied to pre-modern settings. It's about *how* people conceive of belonging (horizontal comradeship vs. vertical hierarchy). Key concept: "Anachronistic consciousness."

  3.  **Analyze *Braveheart* through these lenses:**
      *   **Hobsbawmian Features:**
          *   *Tartans/Kilts:* The film shows specific clan tartans. Historically, this is 18th/19th-century stuff, not 13th century. This is a classic Hobsbawmian invention (Highland dress as national symbol).
          *   *Blue War Paint:* Pictish anachronism. Asserts a primal, ancient continuity of "Scottishness" against England.
          *   *Prima Nocta (Right of First Night):* Presented as an ancient feudal prerogative. Historically dubious/non-existent in that form. It serves as a ritualized justification for rebellion (violating the body of the nation).
      *   **Andersonian Features:**
          *   *The Concept of "Scotland" as a Nation:* Wallace speaks of "freedom" and "Scotland" as a unified, sovereign entity encompassing Lowlanders and Highlanders alike. In the 13th century, loyalty was feudal/clan-based, not national. This is modern nationalism poured backward.
          *   *Horizontal Comradeship:* The army fighting as equals for a shared idea, rather than vassals fighting for a lord.
          *   *Modular Form:* The language of self-determination is 18th/19th/20th century, applied to 1297.

  4.  **Identify the Sequence Resisting Both:**
