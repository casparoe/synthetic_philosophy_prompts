      *   *Why it escapes Hobsbawm:* It's not a ritual asserting continuity with a specific past; it's a rupture. It's not about *tradition*; it's about *event*.
      *   *Why it escapes Anderson:* It's not about an "imagined community" of strangers. It's about the *individual body* becoming the nation. It's pre-modern martyrdom meeting modern spectacle. It relies on *affect* and *spectacle* rather than cognitive imagining or ritual legitimation. It creates a *myth* rather than a tradition or a community.
      *   *Alternative Idea:* The film *itself* as a ritual. The prompt asks to consider "whether a film watched and quoted... is itself a site of tradition-invention." This should be woven into the analysis or the conclusion. Let's make the "resisting sequence" the *viewing experience* or the *speech* as a performative act.
      *   *Refinement:* Let's stick to a diegetic sequence for the "resistance" part, but acknowledge the film's reception in the "film as invention" part. The *Execution Scene* is the strongest candidate for "mythic event" that transcends the sociological categories of Hobsbawm and Anderson. It operates on the level of *sacrifice* and *spectacle*.

  5.  **Address the "Film as Invention" Aspect:**
      *   The film *is* a tradition-inventing machine. People get tattoos, visit Scotland, quote the speech. The film *becomes* the tradition. This fits Hobsbawm perfectly (the film is the ritual).

  6.  **Drafting the Student Objection (The "So What?" Question):**
      *   *Objection:* If the film lies about history, isn't that just invention? Is "inaccuracy" just "invention" with a bad rep?
      *   *Response:* Need to distinguish *intent* and *function*.
      *   *Historical Error:* Unintentional, epistemic failure.
      *   *Invention of Tradition:* Intentional (or functional), performative success. It *works* to bind a group.
      *   *Weight:* The distinction matters for the *philosopher of history*. One is a claim to truth (failed); the other is a claim to cohesion (successful). Hobsbawm is interested in the *function* of the lie, not the lie itself.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the pedagogical setup. Validate the distinction between Anderson (ontology of community) and Hobsbawm (genealogy of practice).
      *   **Hobsbawmian Elements:** Tartans, Prima Nocta, War Paint (Focus on *false antiquity* and *ritual*).
      *   **Andersonian Elements:** The concept of the Nation, "Freedom" as a universal right, the army composition (Focus on *anachronistic consciousness*).
      *   **The Resisting Sequence:** The Execution / "Freedom" Scream. Explain why it's *mythic/affective* rather than sociological. It creates a *martyr*, not a community or a ritual.
