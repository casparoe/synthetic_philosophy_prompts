  # Seminar Session: The Presumptuous Wager
  **Topic:** Anthropics, Self-Sampling, and Self-Indication
  **Duration:** 100 Minutes
  **Class Size:** 16 Students
  **Budget:** €25.00 (Consumables)

  ## 1. Materials & Token Economy

  **Consumables (Budget: €25):**
  *   **Currency:** 200 "Observation Tokens" (printed cardstock circles, approx. 3cm diameter).
  *   **Redemption:** 1 Token = 1 Square of High-Quality Chocolate. (€25 buys ~10 bars of 20 squares = 200 squares).
  *   **Endowment:** Each student receives **10 Tokens** upon entry (€1.25 worth).
  *   **Bank:** You hold the reserve chocolate and extra tokens for payouts.

  **Physical Props:**
  *   **Two Opaque Envelopes:** Labelled "Protocol A" and "Protocol B". Sealed with wax or a sticker signed by a student auditor (see below).
  *   **Ticket Stacks:**
      *   *Stack S (Small World):* 16 tickets, numbers drawn uniformly from **1–160**.
      *   *Stack L (Large World):* 16 tickets, numbers drawn uniformly from **1–16,000**.
      *   *Preparation:* You prepare these before class. Place Stack S in one envelope, Stack L in the other. **Do not look at which envelope contains which.** Shuffle them on your desk while students are out or behind a screen.
  *   **Audit Envelope:** A third envelope containing a **verification sample** (16 tickets) from the *opposite* distribution of whatever is in Protocol A/B. (If A has S, Audit has L-sample).
  *   **Whiteboards:** One for "Public Bets", one for "World State" (covered).
  *   **Document Camera:** To display ticket numbers during settlement.

  ## 2. Auditable Randomization Protocol

  To prevent students from suspecting you rigged the world to fit the lesson:

  1.  **The Auditor:** Select one student at the start as "Lead Auditor." They handle the chain of custody.
  2.  **The Coin Flip:** The Auditor flips a coin. Heads = Open Protocol A. Tails = Open Protocol B.
  3.  **Distribution:** The Auditor opens the chosen envelope, removes the 16 sealed tickets, shuffles them, and hands one to each student.
  4.  **Chain of Custody:** The *unopened* Protocol envelope and the *Audit Envelope* remain sealed on the table in full view.
  5.  **Verification:** At the end of class, the Auditor opens the unopened Protocol envelope and the Audit Envelope.
      *   *Check:* If the Active World was Small (low numbers), the Unused/Audit envelopes must contain High Numbers (up to 16,000). If they contain Low Numbers, you (the teacher) are exposed as having prepared two Small stacks. This risk guarantees your honesty.

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Students enter. Distribute 10 Tokens each. Explain rules: No phones, no talking during betting phases. Select Auditor. |
  | **10–25** | **World Gen** | Auditor flips coin, selects Envelope, distributes tickets. **Students must not open tickets yet.** |
  | **25–35** | **Bet 1** | **Pre-Observation Wager.** Students bet tokens on Small (S) vs. Large (L). Odds 1:1. (e.g., Bet 5 tokens on L; if L wins, get 5 more). |
  | **35–45** | **Experiment** | **The Offer.** You offer to reveal the True World for a cost of **6 Tokens**. This guarantees a win on the final settlement. Students decide privately to Buy or Decline. |
  | **45–55** | **Break** | 10 Minutes. (Students may talk now, but cannot show tickets). |
  | **55–60** | **Reveal** | Students open tickets. Record their number on a private slip. |
  | **60–75** | **Bet 2** | **Post-Observation Wager.** Students bet tokens on S vs. L again. Odds 1:1. They can change their position based on their number. |
  | **75–85** | **Settlement** | Auditor opens Verification Envelopes to confirm World. You reveal the True World. Payouts made in chocolate. |
  | **85–100** | **Debrief** | Lecture linking the game to SSA, SIA, and the Presumptuous Philosopher. |

  ## 4. Game Rules & Logic

  **The Two Worlds:**
  *   **World S (Small):** Total Population = 160.
  *   **World L (Large):** Total Population = 16,000.
  *   **Prior:** Coin flip means $P(S) = P(L) = 0.5$.

  **The Bets:**
  1.  **Bet 1 (Pre-Ticket):** You know only that you exist and are in this room.
      *   *SSA Intuition:* "I'm a random sample. 50/50 chance."
      *   *SIA Intuition:* "I exist. I'm much more likely to exist in the world with 100x more people." -> **Bet Heavy on Large.**
  2.  **The Experiment (Pre-Ticket Offer):**
      *   **Cost:** 6 Tokens.
      *   **Value:** Guarantees you end with maximum tokens (removes risk).
      *   *SSA Logic:* "I'm 50/50. Information is valuable. **Buy.**"
      *   *SIA Logic:* "I'm already >90% sure it's Large. Paying 6 tokens (60% of endowment) to confirm what I know is wasteful. **Decline.**"
      *   *(Note: This is the core "Scandal" moment. SIA refuses empirical verification.)*
  3.  **Bet 2 (Post-Ticket):** You see your rank $n$.
      *   *If $n > 160$:* World S is impossible. Everyone bets Large.
      *   *If $n \le 160$:*
          *   *SSA:* "Low rank is 100x more likely in S." -> **Bet Heavy on Small.**
          *   *SIA:* "My prior for L was 100x. The likelihood for S is 100x. They cancel. I remain 50/50 (or stay confident in L if ratio was higher)." -> **Hedge or Stay Large.**

  ## 5. Debrief Guide (The Argument)

  **Do not use jargon (SSA/SIA) until this section.**

  1.  **Map the Bets:**
      *   Ask: "Who bet heavily on Large in Bet 1?" (These are your intuitive SIA thinkers).
      *   Ask: "Who bought the Experiment?" (These are your SSA thinkers / Standard Statisticians).
      *   Ask: "Who refused the Experiment?" (These are your SIA thinkers).

  2.  **The Divergence Point:**
      *   Explain that the split happened *before* anyone opened their ticket.
      *   **View 1 (SSA):** "Your existence is not evidence of population size. You are a random sample from the *actual* observers." -> Prior remains 50/50. Information has value.
      *   **View 2 (SIA):** "Your existence *is* evidence. You are a random sample from *possible* observers." -> Prior shifts to favor Large. Information has less value.

  3.  **The Scandal (The Presumptuous Philosopher):**
      *   Identify the students who refused the Experiment.
      *   Explain: "You refused to spend tokens to verify the truth because your theory told you that you were *already* overwhelmingly likely to be in the Large World simply because you exist."
      *   Name Drop: This is Nick Bostrom's **Presumptuous Philosopher**.
      *   The Scandal: SIA implies we should be confident the universe is vast *without looking*, making empirical cosmology potentially redundant.

  4.  **Resistance & Cost:**
      *   Where can SSA resist? By denying you are a "random sample" (e.g., you are a seminar student, a specific reference class).
      *   Where can SIA resist? By accepting the empirical cost (buying the experiment) and admitting their prior was too strong.

  ## 6. Failure Modes & Mitigation

  | Failure | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Info Pooling** | Students compare ticket numbers during Bet 2, realizing if anyone has $n > 160$, S is false. | **Strict Silence Rule.** Confiscate tokens if caught talking during betting. Emphasize "Private Information." |
  | **Early Realization** | If World L is true, someone will likely draw $n > 160$. World S is instantly falsified. Bet 2 becomes trivial. | **Acknowledge in Debrief:** "In a 1:100 ratio, low numbers are the only ambiguity. In a 1:Trillion ratio, even low numbers don't rule out L." |
  | **Token Worthlessness** | Students gamble wildly because chocolate feels trivial. | **Frame the Stakes:** "This is your grade-neutral credit. The top scorer gets the first choice of the chocolate reserve." Make it competitive. |
  | **Refusal to Bet** | A student freezes, refusing to wager on philosophical grounds. | **Default Rule:** "If you do not bet, you are auto-allocated 5 tokens on 'Small'." (Forces a position). |
  | **Audit Distrust** | A student claims you put two Small stacks in the envelopes. | **The Verification:** The Audit Envelope *must* contain High Numbers if the Active World was Small. Let the Auditor verify the max number publicly. |

  ## 7. Limitations (What the Game Cannot Reproduce)

  You must explicitly state these in the final 5 minutes to prevent over-generalization:

  1.  **The Reference Class:** In the game, you *know* you are a student in this room. In reality, we don't know if we are a "random observer" or a "random human" or a "random conscious moment." The game forces a reference class (the 16 students); reality does not.
  2.  **The Selection Mechanism:** In the game, a coin flip chose the world. In reality, we have no known chance mechanism selecting our universe. We are applying probability to a single non-repeatable fact.
  3.  **Volunteer Bias:** You are philosophy students. You are not a random sample of observers in the actual world. The game simulates random sampling; your actual existence does not.
  4.  **One-Shot:** You only play once. You cannot update over generations. The "Doomsday" argument relies on future observers who do not exist yet.

  ## 8. Teacher's Script for the "Scandal" Moment (Minute 35)

  *"I am now offering to sell you the truth. For 6 tokens, I will open the envelope and tell you which World we are in. If you buy, you are guaranteed to settle your bets correctly. If you decline, you keep your tokens but risk betting on the wrong World.*

  *Think carefully. If you are already 99% sure you know the answer, 6 tokens is a waste. If you are 50/50, 6 tokens is a bargain. Place your order privately."*

  **(In the Debrief)**: *"Those of you who declined... you effectively said, 'I am so confident in my reasoning about my own existence that I do not need to check the evidence.' That is the Presumptuous Philosopher. And it feels scandalous because it shuts down science."*
