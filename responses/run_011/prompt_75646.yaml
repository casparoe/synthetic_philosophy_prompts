  The principle you are looking for is a precise formulation of **Costly Signaling Theory**, refined to account for social context and trait relevance. It is not baroque, but it requires three specific conditions to handle your edge cases.

  Here is the principle:

  ### **The Principle of Uncompensated, Differential Burden**
  **A display convinces only when it imposes a net cost that is (1) sunk and unrecoverable, (2) disproportionately burdensome to those lacking the claimed quality, and (3) causally linked to the specific trait being signaled.**

  Here is how each clause delivers your verdicts:

  1.  **"Sunk and Unrecoverable" (The Net Cost Clause)**
      *   **Lifetime Warranty:** The cost (repairs) is sunk *if* the product fails. A bad company cannot recover this; a good one can. **(Convincing)**
      *   **Advertisements:** The cost is sunk, but the claim ("We are best") is cheap talk; the cost does not rise if the claim is false. **(Not Convincing)**
      *   **Anonymous Donor:** The cost is pure sacrifice; there is no reputational profit to offset the money spent. **(Impresses More)**
      *   **Public Donor:** The cost is offset by the benefit of public praise. The "net" burden is lower. **(Impresses Less)**

  2.  **"Disproportionately Burdensome" (The Differential Clause)**
      *   **Peacock's Tail:** A weak peacock dies under the weight of the tail; a strong one survives. The cost filters for fitness. **(True Signal)**
      *   **Friend Flying vs. Flowers:** Money (flowers) is transferable and easy to fake. Time and physical presence (flying) are non-transferable and burden those who do not truly care with opportunity costs. **(Moving)**
      *   **Quit Career to Write:** Losing a career is costly, but it is *equally* costly for a delusional bad writer as for a genius. The burden does not fall harder on the liar. **(Does Not Convince Skill)**
      *   **Expensive Watch:** It burdens the poor more than the rich. **(Convinces Wealth)**. However, trust requires signaling *vulnerability*, not *resources*. The watch signals independence, which is inversely related to reliance on others. **(Lowers Trust)**

  3.  **"Causally Linked & Contextual" (The Relevance Clause)**
      *   **Founder vs. Candidate (T-shirt):** The cost here is *social risk*.
          *   **Founder:** Has high status. Violating norms is low-risk for him. The signal reads as **Confidence** because he has the *capacity* to absorb the deviation.
          *   **Candidate:** Has low status. Violating norms is high-risk (rejection). The signal reads as **Contempt** because he is imposing a cost on the interviewer without the status to justify it.
          *   *Why this fits:* The principle evaluates the burden *relative to the sender's capacity*. The Founder sustains the burden easily (truthful signal of power); the Candidate incurs a prohibitive burden (signal of recklessness).

  ***

  ### **Predictions for Your New Cases**

  **1. A restaurant with a queue around the block.**
  *   **Verdict:** **Convincing signal of quality.**
  *   **Reasoning:** The cost is paid by the *customers* (time), but it is sustained by the *restaurant* (risk of losing impatient diners). A bad restaurant cannot sustain a queue; customers would leave and not return. The queue is an **uncompensated burden** on the diner that is only **sustainable** if the food (the trait) is high quality. It is a second-order costly signal.

  **2. A well-paid executive who takes a large pay cut to accept a public office.**
  *   **Verdict:** **Convincing signal of dedication, conditional on oversight.**
  *   **Reasoning:** This is an **uncompensated burden** (lost income). It is **differentially burdensome** to a corrupt candidate (who cannot recoup the loss via graft if oversight is strict) versus a public servant (who values the office itself).
  *   **Caveat:** If the office offers opportunities for illicit recoupment (corruption), the "net cost" drops for the liar, and the signal fails. The principle predicts you should trust the signal *only if* the system prevents the cost from being recovered later.

  ***

  ### **On Simplicity vs. Baroque**

  You asked if this principle is baroque. It is not; it is the standard **Handicap Principle** (Zahavi) applied to sociology. However, if you demand a *simpler* one-liner, you must surrender a verdict.

  **The Simpler Principle:** *"Actions that are too expensive to fake are true."*

  **The Verdict You Must Surrender:** **The Writer.**
  Under the simple principle, quitting a career *is* expensive, so it *should* convince you of something. To make the simple principle work, you must admit that it *does* convince you of the writer's **commitment**, even if it doesn't prove their **skill**. Your current judgment ("does not convince me he can write") relies on the distinction between *commitment* and *ability*, which requires the more precise "Causally Linked" clause of the fuller principle.

  If you keep the distinction between commitment and skill, you must keep the precise principle.
