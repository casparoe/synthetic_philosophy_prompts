      *   **The "Fine" List:** (ii), (v), (viii) (with caveats).
      *   **Epistemic Closure:** Specific conditions for changing the audit.

  8.  **Drafting the Content (incorporating the "Philosopher of Biology" persona):**
      *   Tone: Direct, rigorous, no hand-holding.
      *   Focus on the "Metaphysical Research Programme" nuance. Lakatos is the ghost in the machine here.
