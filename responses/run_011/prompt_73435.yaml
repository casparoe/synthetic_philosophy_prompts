      *   **Constraints:** No fluff ("well, there are tensions on both sides"), no references needed, specific epistemic closure (what would change *my* mind about the audit).
      *   **Input:** 8 specific claims (i-viii) covering demarcation, fitness/tautology, Duhem-Quine issues, Popper's classification of Darwinism, evolutionary epistemology, anti-justificationism, case verdicts (moths vs. evo psych), and historicism/prediction.

  2.  **Deconstruct the Commitments:**
      *   (i) *Demarcation:* Falsifiability/Prohibitions. Standard Popper.
      *   (ii) *Fitness:* Not tautological. Fitness is propensity/design-based, independent of actual survival. Substantive hypothesis.
      *   (iii) *Testing/Duhem:* Tests are statistical + bundled with auxiliaries (drift, environment, etc.). Core can always be saved by blaming auxiliaries.
      *   (iv) *Popper's Classification:* Darwinism is *metaphysical* (research programme), not testable science. Popper's recantation was weak.
      *   (v) *Evo Epistemology:* Knowledge growth = Variation + Selective Retention. Conjecture/Refutation is Darwinism level-up.
      *   (vi) *Anti-Justificationism:* No positive grounds/probability. Only surviving criticism. Corroboration $\neq$ Probability.
      *   (vii) *Case Verdicts:* Peppered moth = Severe test (Science). Human mate jealousy = Just-so story (Not science/Pseudoscience).
      *   (viii) *Historicism:* Prediction of historical/social change *is* possible (via game theory/cultural evo). Popper overstated anti-historicism.

  3.  **Initial Scan for Tensions (Brainstorming Pairs):**
      *   (i) vs (iv): If demarcation is prohibiting observables (i), and Darwinism *does* prohibit observables (via ii), why is it metaphysical (iv)?
      *   (ii) vs (iii): If fitness is independent (ii), why are tests always bundled/ambiguous (iii)? (This is manageable, but needs checking).
      *   (iv) vs (vii): If Darwinism is metaphysical (iv), how can the peppered moth be a severe test of *selectionism* (vii)? Metaphysical programmes aren't severely testable in the Popperian sense.
      *   (iv) vs (v): If Darwinism is metaphysical, how can it serve as the structural analogue for scientific epistemology (v)? (Usually, we want the model of science to be... scientific).
      *   (vi) vs (vii): If there are no positive grounds/probability (vi), what does "stake a fair amount on it" mean in (vii)? (Corroboration vs. Probability distinction is key here).
      *   (i) vs (viii): If science prohibits observables (i), does predicting historical change violate the logic of prediction in open systems? (Popper's anti-historicism was about *long-term* prediction of society, not game-theoretic models).
      *   (iii) vs (i): If auxiliaries always save the core (iii), does the theory actually prohibit anything in practice (i)?

  4.  **Selecting and Ranking the Genuine Tensions:**

      *   *Tension 1: The Metaphysical vs. Testable Status of Darwinism (iv vs. i, ii, vii).*
          *   This is the big one.
          *   (i) Science prohibits observables.
          *   (ii) Fitness is defined independently, so selection prohibits specific outcomes (e.g., unfit traits increasing).
          *   (vii) Peppered moth is a *severe test* of selectionism.
          *   (iv) BUT Darwinism is a *metaphysical research programme*, not testable science.
          *   *Conflict:* You can't have it both ways. If (vii) is true (moth = severe test of selection), then selectionism is scientific by the lights of (i). If (iv) is true (Darwinism = metaphysical), then (vii) is misdescribed (it's a test of a specific model *within* the programme, not the programme itself, or the programme isn't metaphysical).
          *   *Severity:* High. This strikes at the core of the seminar's theme.

      *   *Tension 2: The Duhem Problem vs. Demarcation (iii vs. i).*
          *   (i) Theory must prohibit observables.
          *   (iii) Recalcitrant results can *always* be laid at the door of auxiliaries.
          *   *Conflict:* If you can *always* save the core by adjusting auxiliaries, does the core actually prohibit anything *in practice*? Popper knew this (Duhem-Quine). He relied on "methodological rules" to forbid ad hoc saves.
          *   *Severity:* Medium-High. It's a classic problem, but (iii) states it as a matter of *fact* ("as a matter of fact, always be laid"), which threatens (i)'s practical application.

      *   *Tension 3: Evolutionary Epistemology vs. Metaphysical Status (v vs. iv).*
          *   (v) Evo Epistemology is great; science *is* a Darwinian process.
          *   (iv) Darwinism is metaphysical.
          *   *Conflict:* If the logic of science (v) is modeled on Darwinism, but Darwinism itself isn't scientific (iv), is the model grounded in metaphysics? This isn't necessarily a contradiction (metaphysics can guide science), but it creates a weird reflexive loop.
          *   *Severity:* Low-Medium. Popper himself held both views. It's a feature, not a bug, for Popperians.

      *   *Tension 4: Anti-Justificationism vs. Staking Claims (vi vs. vii).*
          *   (vi) No probability, only surviving criticism.
          *   (vii) "Stake a fair amount on it."
          *   *Conflict:* Linguistic/Pragmatic. "Staking" implies inductive confidence. Popperians talk of "corroboration."
          *   *Severity:* Low. Easily resolved by terminology (corroboration vs. probability).

  5.  **Developing the Audit (Drafting the Response):**

      *   *Introduction:* Acknowledge the position. It's a sophisticated "Lakatosian-Popperian" hybrid.
      *   *Ranking:*
          1.  **The Metaphysical/Scientific Split (iv vs. i/ii/vii).** This is the killer. If Darwinism is metaphysical, the Peppered Moth isn't a test of *Darwinism*, it's a test of a specific *model*. If it is a test of Darwinism, Darwinism isn't metaphysical.
          2.  **The Duhemian Shield (iii vs. i).** If auxiliaries always save the core, prohibitions are toothless unless you add a methodological rule about when to reject auxiliaries.
          3.  **Historicism (viii vs. Popperian Orthodoxy).** Less internal tension, more external tension. But (viii) fits (i) better than standard Popper does.
      *   *Resolutions:*
          *   For (1): Distinguish between the *Principle of Natural Selection* (metaphysical/framework) and *Specific Selection Hypotheses* (scientific). This saves (iv) and (vii). Cost: You must admit Popper's recantation wasn't totally wrong; specific hypotheses *are* testable.
          *   For (2): Invoke methodological rules (don't save core ad hoc). Cost: You need a criterion for "ad hoc" which is notoriously slippery.
      *   *What's Fine:* (ii) is standard modern philosophy of biology (Millstein, Matthen, etc.). (v) is consistent Popper. (vi) is standard Popper.
      *   *Epistemic Closure:* What would change my mind? If the user argues that "Metaphysical Research Programme" *includes* severe testing of instantiations. If the user clarifies the definition of "Darwinism" in (iv).

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Tension 1:* I need to be careful. Popper distinguished between the *logic* of natural selection (which he thought was tautological/metaphysical) and *specific historical claims* (which are testable). The user's (iv) says "Darwinism" is metaphysical. (vii) says "selectionism" is tested by moths. Are these the same thing? If "Darwinism" = the general theory, and "selectionism" = specific application, the tension dissolves. *However*, (ii) claims fitness is pinned down independently, making selection a *substantive hypothesis*. This pushes towards Darwinism being scientific. So the tension remains between (ii)/(vii) and (iv).
      *   *Correction on Tension 2:* (iii) says "as a matter of fact, always be laid at the door of auxiliaries." This is a strong claim. If true, (i) is practically nullified. The resolution must be normative (we *shouldn't* do this) vs descriptive (we *can* do this).
      *   *Correction on (viii):* Popper's anti-historicism was about *large scale* historical prediction (Marxism), not local game-theoretic prediction. So (viii) might not actually conflict with Popper if defined carefully. I should note this as a "False Tension" or "Clarification needed."

  7.  **Finalizing the Structure:**
