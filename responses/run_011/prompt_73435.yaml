answer: |-
  Here is the audit.

  ### Preliminary Mapping: Pairs to Test
  Before the full verdict, here are the three friction points I identified as candidates for genuine inconsistency, ranked by how likely they are to break your system.

  1.  **(iv) vs. (i)/(ii)/(vii): The Metaphysical/Scientific Status of Darwinism.**
      *   *Why:* If Darwinism is a metaphysical research programme (iv), it lacks empirical content by definition. But if fitness is independently definable (ii) and the peppered moth is a severe test of selectionism (vii), then Darwinism (or at least its core mechanism) prohibits observable states (i). You cannot consistently claim the core is metaphysical *and* that it passes severe tests of prohibition.
  2.  **(iii) vs. (i): The Duhemian Threat to Demarcation.**
      *   *Why:* If a recalcitrant result can *always* (iii) be absorbed by auxiliaries, then the core theory does not effectively prohibit anything in practice, even if it does in principle. This renders the demarcation criterion (i) operationally empty unless supplemented by a normative rule you haven't stated.
  3.  **(vi) vs. (vii): The Language of Confidence.**
      *   *Why:* "Staking a fair amount" on the moth verdict sounds like inductive probability or Bayesian confidence. (vi) explicitly rejects positive grounds or probability. This may be merely verbal, but it risks sliding into justificationism.

  ---

  ### The Audit

  #### 1. The Core Tension: Metaphysical Programme vs. Testable Mechanism
  **Severity: Critical.**
  **Conflict:** (iv) vs. (i), (ii), (vii).

  You hold that Darwinism is a metaphysical research programme (iv), yet you also hold that selection is a substantive hypothesis with content (ii) and that specific selectionist claims (peppered moth) undergo severe testing (vii).

  **The Problem:**
  Popper's 1974 classification of Darwinism as "metaphysical" relied heavily on the idea that "survival of the fittest" is either tautological or that the theory is compatible with *any* biological outcome (i.e., it prohibits nothing). You explicitly reject the tautology charge in (ii). You argue fitness is defined by design/environment, not just survival. If (ii) is true, then the theory *does* prohibit observable states (e.g., a trait lowering propensity to reproduce increasing in frequency without drift/mutation pressure). If it prohibits states, it satisfies your own demarcation criterion (i).

  Therefore, (iv) contradicts the conjunction of (i) and (ii). If (i) and (ii) are correct, (iv) must be false. Darwinism cannot be merely metaphysical if its core mechanism generates prohibitions that are severely tested (vii).

  **What Has to Give:**
  You must modify (iv). You cannot maintain that Darwinism *simpliciter* is metaphysical if you grant (ii) and (vii).

  **The Fix & The Cost:**
  Adopt a **level-distinction**. Distinguish between:
  *   **The Schema:** "Natural Selection occurs." (This is the metaphysical research programme).
  *   **The Specific Hypothesis:** "Trait T increased in population P *because* it conferred fitness advantage F in environment E." (This is scientific).

  Popper's recantation was essentially an admission that while the *schema* might be framework-like, the *applications* are testable.
  *   *Cost:* You lose the hardline stance that Popper was "basically right" to file Darwinism under metaphysics without heavy qualification. You have to concede that Popper's later view (that it is testable science) was correct regarding the *hypotheses*, even if the *general principle* functions as a framework.
  *   *Test against (vii):* Does this distinction survive the case verdicts? Yes. The peppered moth is a test of a Specific Hypothesis (industrial melanism confers camouflage advantage), not the Schema (selection happens). The "just-so stories" of evolutionary psychology fail not because the Schema is wrong, but because the Specific Hypotheses lack independent fitness measures (violating ii) and severe testing (violating vii). This distinction saves your verdicts.

  #### 2. The Duhemian Shield: Auxiliaries vs. Prohibition
  **Severity: High.**
  **Conflict:** (iii) vs. (i).

  **The Problem:**
  You state in (iii) that a recalcitrant result can, "as a matter of fact, always be laid at the door of the auxiliaries." If this is true, then your demarcation criterion (i) — "a theory is scientific to the degree that it rules out observable states" — is practically nullified. A theory that can be saved from *any* observation by tweaking auxiliaries does not effectively rule out any observable state in the real world of practice. It only rules them out in a logical vacuum.

  **What Has to Give:**
  You must qualify (iii). It is logically true that auxiliaries *can* be blamed, but it is methodologically false that they *should* always be blamed.

  **The Fix & The Cost:**
  Add a **Methodological Rule**: "We forbid saving the core by modifying auxiliaries unless the new auxiliaries are independently testable."
  *   *Cost:* This moves you from a purely logical demarcation (i) to a methodological/sociological one. You are now relying on the norms of the scientific community to enforce demarcation, not just the logical structure of the theory.
  *   *Test against (vii):* This survives the case verdicts well. In the peppered moth case, the auxiliaries (bird vision, soot deposition, moth resting behavior) were independently testable. In the "just-so" mate jealousy cases, the auxiliaries (ancestral environment conditions) are not independently testable. The distinction holds.

  #### 3. Confidence vs. Corroboration
  **Severity: Low.**
  **Conflict:** (vi) vs. (vii).

  **The Problem:**
  In (vii) you say you would "stake a fair amount" on the peppered moth verdict. In (vi) you say "it has been tested a lot adds not one shred of probability." "Staking" implies a degree of belief or pragmatic confidence that looks suspiciously like the probability you reject in (vi).

  **What Has to Give:**
  This is likely verbal, but needs tightening.

  **The Fix & The Cost:**
  Clarify that "staking" refers to **corroboration**, not probability. You are willing to bet that the theory will *continue* to survive tests, not that it is *true* or *probable*.
  *   *Cost:* None, provided you are rigorous in seminar when students conflate corroboration with confirmation.
  *   *Test against (vii):* Holds. You can prefer the moth theory over the jealousy story because the former is highly corroborated (survived severe tests) and the latter is not, without assigning a probability value to either.

  ---

  ### What Hangs Together (The "Fine" List)

  *   **(ii) Fitness/Tautology:** This is solid. It aligns with the propensity interpretation (Mills, Beatty) and blocks the logical positivist attack. Keep this. It is the linchpin that forces the revision in (iv).
  *   **(v) Evolutionary Epistemology:** This is consistent with the rest, provided you accept the level-distinction in (1). Science is a Darwinian process *even if* Darwinism itself contains metaphysical elements. The isomorphism holds.
  *   **(viii) Anti-Historicism:** This is actually consistent with a sophisticated Popperianism. Popper opposed *large-scale, long-term* historical prediction (Historicism), not local, conditional predictions based on initial conditions. Game-theoretic models are conditional predictions. No tension here, provided you define "historical processes" carefully.

  ---

  ### Epistemics of This Audit

  You asked me to be definite about where my own reasoning might break down. Here is the vulnerability in my audit:

  **What would change my mind about the ranking:**
  If you can defend a version of (iv) where "Metaphysical Research Programme" does *not* imply "Untestable in any instantiation." If you argue that a Research Programme can be metaphysical in its *hard core* (the general principle of selection) while its *protective belt* (specific fitness claims) is scientific, then the tension between (iv) and (vii) dissolves without forcing you to concede Popper's recantation was correct about Darwinism *as a whole*.
  *   *Condition:* You must show that calling the core "metaphysical" doesn't leak into the specific hypotheses. If the core dictates the form of the hypotheses, and the core is metaphysical, the hypotheses inherit that status. If you can block that inheritance, my Critical ranking drops to Low.

  **Which of your moves must be right for the worst tension to dissolve:**
  Your move in (ii) must be robust. If fitness *cannot* be pinned down independently of actual reproduction (i.e., if the propensity interpretation fails and we fall back on actual survival), then (i) collapses. If (i) collapses, then (iv) becomes correct (Darwinism is metaphysical/tautological), and (vii) becomes wrong (the moth study wasn't a test of selection, but merely a description of history).
  *   *Condition:* If the propensity interpretation of fitness is philosophically untenable, my entire audit flips. You would have to accept (iv) and reject (vii) as a test of *selection* (it becomes a test of heredity + environmental change only).

  **Where my reasoning is most likely to break down:**
  I have assumed that "Metaphysical Research Programme" carries a negative connotation regarding testability in your framework, similar to Popper's 1974 view. However, if you are implicitly using a **Lakatosian** definition of Research Programme (where metaphysical cores are standard and acceptable parts of science), then my criticism of (iv) is misplaced.
  *   *Breakdown Point:* If you are a Lakatosian in disguise, (iv) is compatible with (i) and (vii) because Lakatos allows metaphysical cores within scientific programmes. My audit assumes a stricter Popperian demarcation where "metaphysical" implies "non-scientific." If you mean "metaphysical" in the Lakatosian sense (a heuristic guide that is not directly tested, while the programme is scientific), then there is no tension in (1). I have ranked it Critical based on the assumption you mean "metaphysical" in Popper's 1974 sense (non-science), not Lakatos's sense (hard core of a scientific programme).

  **Final Instruction:**
  If you want to keep (iv) as written, you must clarify that you mean "Metaphysical Hard Core of a Scientific Programme" (Lakatos) rather than "Metaphysical System Outside Science" (Popper 1974). If you mean the latter, (iv) must go.
