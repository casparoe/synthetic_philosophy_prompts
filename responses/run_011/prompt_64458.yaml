  You have tangled yourself in a modern knot that I would simply cut. I do not say death is a smaller harm for those who care less about the future; I say it is no harm at all, regardless of their capacity to care. Whether your grandmother is plotting next year's harvest or cannot recall her own name, the state of being dead is identical: there is no subject to experience the loss. The deprivation argument you are wrestling with belongs to those who fear the empty calendar, but I tell you to fear nothing where you are not.

  So I say no: her death is not less bad, it is simply not bad for her, full stop. The horror you feel at the idea of her life being 'cheaper' is a category error, because you are projecting value onto a state where value cannot land. The only harm present here is the distress of those who remain, and the question you face is how to bear that distress without inflicting unnecessary strain on her vessel.
