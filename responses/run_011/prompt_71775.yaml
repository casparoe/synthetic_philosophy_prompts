answer: |-
  **TO:** Ethics Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation and Decision Framework: PGT-P Request for Bipolar Disorder (Case #XYZ)

  **Recommendation**
  I recommend we **refuse** the request for polygenic risk score (PRS) ranking in this case.

  This is not a judgment on the couple's motivation, which is clearly grounded in genuine concern rather than enhancement. Nor is it a blanket prohibition on all future PRS discussions. It is a specific refusal based on the convergence of two factors: the current scientific invalidity of the test for this patient population and the scarcity of laboratory resources.

  **Rationale**
  Our primary ethical obligation is non-maleficence. The Lab Director has stated explicitly that applying a European-derived PRS to South Asian embryos yields numbers that are not just noisy but directionally unquantifiable. To rank embryos on this basis is to present arbitrary data as clinical guidance. If we release these scores, we are effectively asking the couple to make a selection based on a coin flip disguised as a metric. This undermines informed consent; you cannot consent to the limitations of a test if the limitations themselves are unknown.

  Second, we must address justice in resource allocation. Our lab capacity for non-routine analysis is capped at two slots per month. Every slot occupied by a probabilistic, low-validity test is a slot denied to a couple seeking PGT-M for a Mendelian condition with near-certain penetrance and severe onset. When capacity is constrained, we must prioritize interventions with established clinical utility and high predictive value. Prioritizing a PRS ranking over a diagnostic PGT-M test invariants the suffering of patients with clear genetic indications for the sake of patients with uncertain ones.

  Finally, offering this test validates a false precision. While the expressivist argument (that this stigmatizes those living with bipolar) is important, the stronger point is trust. If we offer a test we know is scientifically compromised for this ancestry, we damage the clinic's integrity and potentially mislead the couple into believing they have mitigated a risk they have not.

  **The Counter-Argument (Steelman)**
  The strongest case against this refusal rests on parental autonomy and harm reduction. The couple is not asking for a guarantee; they are asking for risk mitigation based on traumatic family history. They understand the variance explained is low, but in their view, any reduction in risk is preferable to none. By refusing, we do not eliminate the test; we merely outsource it. They will take their embryos to a jurisdiction with looser oversight, where counseling may be inferior and follow-up non-existent. We lose the ability to frame the results, manage expectations, or ensure the embryos are handled safely. Furthermore, it is not the panel's role to weigh the subjective burden of bipolar disorder against a Mendelian condition. To this couple, the brother's hospitalizations represent a catastrophic outcome they are morally entitled to avoid. Denying them tools available to others (those of European ancestry) creates an inequity based on heritage, compounding the scientific bias with access discrimination.

  **Conditions to Flip This Outcome**
  I would vote to approve this request only if one of the following were true:
  1.  **Scientific Validation:** The lab could demonstrate that the PRS model has been validated for South Asian ancestry with quantifiable error margins specific to this population.
  2.  **Idle Capacity:** There is currently zero backlog for PGT-M cases, meaning running this analysis does not displace a higher-utility test within the couple's timeframe.

  **Decision Timeline**
  The couple has a transfer scheduled in six weeks. We must vote this Thursday. If we refuse, the clinical team needs to inform the couple immediately (by Friday) to allow them time to seek alternatives elsewhere if they choose. We cannot delay this decision past the weekly meeting.

  **Reusable Criteria for Future PGT-P Requests**
  To avoid relitigating this from scratch, I propose we adopt the following four criteria for any future polygenic score requests. All four must be met to proceed to discussion.

  1.  **Ancestry Concordance:** The PRS model must be validated for the specific genetic ancestry of the gamete providers. If ancestry is mixed or under-represented in training data, the request is ineligible.
  2.  **Capacity Priority:** PGT-P analysis cannot displace PGT-M or medically indicated screening when lab capacity is constrained. PGT-M queues must be clear.
  3.  **Condition Severity Threshold:** The condition screened must be serious enough to warrant intervention (excluding trivial traits), but the PRS must offer a relative risk reduction that exceeds a minimum threshold (e.g., top decile risk reduction) to be clinically meaningful.
  4.  **Counseling Protocol:** Approval is contingent on a mandatory counseling session where the limitations of PRS (variance explained, environmental factors, lack of diagnostic certainty) are documented as understood by the patients prior to biopsy.

  **Bottom Line**
  We cannot offer a medical service we know may be arbitrary. We cannot prioritize probabilistic ranking over diagnostic certainty when slots are limited. We should refuse this case, communicate the scientific reasoning clearly to the couple, and adopt the criteria above to govern future requests.
