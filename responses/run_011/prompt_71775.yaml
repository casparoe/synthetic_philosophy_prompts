prompt: |-
  I sit on the ethics panel at an IVF clinic and Thursday we vote on a case that's split us 3-3. Facts as I understand them:

  Couple, mid-thirties, five embryos from one retrieval. No single-gene condition in either family, so this isn't standard PGT-M. What they want is embryo ranking on a polygenic risk score for bipolar disorder — the husband's brother has it and has been hospitalised twice, and they're adamant that's the whole motivation, not any wish for an "upgraded" baby. Two complications we can't paper over. First, the score was derived almost entirely from European-ancestry samples and the wife is of South Asian ancestry; our lab director's view is that for her embryos the number isn't just noisier, it's off in a direction nobody can quantify, so ranking these five against each other may be close to arbitrary. Second, our lab can do about two non-routine analyses a month, and every slot that goes to this couple is a slot that doesn't go to someone running PGT-M for a Mendelian condition with near-certain onset.

  The panel is arguing past itself. One camp says we have no business offering a ranking whose numbers don't transfer to this family, and that offering it at all sends a message to people who live with the condition — the expressivist point. The other camp says it isn't ours to judge whether this couple's reason is less weighty than the PGT-M couple's reason, that parents are allowed to decide for themselves what a score explaining a few percent of variance means in their own family history, and that a refusal here just sends them over the border to a clinic that won't even have this conversation.

  Could you draft the memo I'll circulate before the meeting? It needs a bottom line — approve, refuse, or approve subject to conditions concrete enough that the lab and the counselling team could actually operate under them — plus a timeframe, since they have a transfer scheduled in six weeks. I'd also like a short set of criteria the panel can reuse the next time a polygenic-score request lands, because it won't be the last, and I'd rather we not relitigate from scratch each time.

  Please actually take a side. I get enough even-handed summaries in committee already; I want your recommendation and the reasons for it, stated strongly enough that the three people who disagree can push back on particular sentences rather than on a mood. And whatever you land on, give the losing camp its best shot — a paragraph making their case as well as they'd make it themselves, not a strawman — and say what would have to be true for that case to flip the outcome. No citations or reading lists, nobody on the panel wants those, just the argument.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Ethics Panel Member at an IVF clinic.
      *   **Task:** Draft a memo to circulate before the meeting regarding a specific case (PGT-P for bipolar disorder).
      *   **Case Facts:**
          *   Couple, mid-30s, 5 embryos.
          *   Request: Polygenic Risk Score (PRS) ranking for bipolar disorder.
          *   Motivation: Husband's brother has severe bipolar (hospitalized twice). No single-gene condition (not PGT-M).
          *   Complication 1 (Scientific): PRS derived from European ancestry; Wife is South Asian. Lab Director says scores are noisy/unquantifiable bias for her embryos. Ranking may be arbitrary.
          *   Complication 2 (Resource): Lab capacity is limited (2 non-routine analyses/month). This slot displaces PGT-M for Mendelian conditions.
          *   Deadline: Transfer scheduled in 6 weeks.
      *   **Panel Split:** 3-3.
          *   Camp A (Refuse): Scientific invalidity (ancestry mismatch), Expressivist harm (message to people with bipolar), Resource allocation (PGT-M priority).
          *   Camp B (Approve): Parental autonomy, Harm reduction (they'll go elsewhere if refused), Non-judgmental stance on reasons.
      *   **Requirements:**
          *   Take a side (Approve, Refuse, or Approve with Conditions).
          *   Provide a bottom line recommendation.
          *   Provide a timeframe.
          *   Provide reusable criteria for future polygenic-score requests.
          *   Include a "Steelman" paragraph for the losing side (best argument against the recommendation) + conditions under which that argument would flip the outcome.
          *   Tone: Strong, actionable, argumentative (not even-handed summary), no citations/reading lists.
          *   Audience: Ethics panel colleagues (professional, ethical, clinical context).

  2.  **Determine the Recommendation:**
      *   *Option 1: Approve.* Weak scientifically (ancestry mismatch), resource intensive (displaces PGT-M), ethical concerns (expressivism, false hope). Hard to justify given the Lab Director's warning about arbitrary ranking.
      *   *Option 2: Approve with Conditions.* What conditions? Maybe ancestry-matched validation? (Impossible given current tech). Maybe extra counseling? (Doesn't fix the science). Maybe only if no PGT-M waiting? (Delays transfer beyond 6 weeks).
      *   *Option 3: Refuse.* Strongest scientific grounding (validity/utility). Strongest resource allocation argument (justice/equity). Aligns with current professional consensus on PGT-P (generally discouraged due to low predictive value and ancestry bias).
      *   *Decision:* **Refuse.** The scientific validity issue (ancestry mismatch) is the killer. Offering a medical test known to be inaccurate/unquantifiable for the specific patient population is ethically problematic (non-maleficence). The resource argument reinforces this. Autonomy doesn't extend to demanding medically invalid procedures.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Argument for Recommendation (The "Take a Side" part):** Focus on scientific validity (ancestry), resource justice (PGT-M priority), and the harm of false precision.
      *   **The "Steelman" (Losing Camp):** Articulate the autonomy/harm reduction argument strongly.
      *   **Flip Conditions:** What would change the mind? (e.g., validated ancestry-specific scores, excess capacity).
      *   **Future Criteria:** Reusable framework for PGT-P requests.
      *   **Timeline:** Address the 6-week constraint.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard memo format.
      *   *Recommendation:* Refuse the request for PGT-P ranking in this specific case.
      *   *Rationale:*
          1.  **Scientific Validity/Non-Maleficence:** The Lab Director's input is crucial. If the score is "arbitrary" due to ancestry mismatch, offering it is misleading. It's not just "noisier," it's potentially directionally wrong. We cannot offer a clinical ranking we know may be false.
          2.  **Resource Allocation:** 2 slots/month. PGT-M prevents severe, certain suffering. PGT-P here prevents probabilistic, uncertain risk. Justice dictates prioritizing the certain over the uncertain when resources are scarce.
          3.  **Counseling/Expectations:** Even with counseling, the "arbitrary" nature undermines informed consent.
      *   *Steelman (The Autonomy Argument):* Parents bear the burden of care. They understand the uncertainty. Refusal doesn't stop the test, just pushes it to unregulated markets (medical tourism). We lose oversight. Respecting their valuation of mental health suffering (based on family trauma) is key.
      *   *Flip Conditions:* If the lab validates the score for South Asian ancestry OR if there is zero backlog for PGT-M (idle capacity).
      *   *Future Criteria:*
          1.  Ancestry validation requirement.
          2.  Capacity check (PGT-M priority).
          3.  Condition severity/penetrance threshold.
          4.  Counseling protocol (specific to PRS limitations).
      *   *Timeline:* Immediate notification to allow them to seek alternatives if they wish, before the 6-week mark.

  5.  **Refining the Tone:**
      *   Needs to be firm but respectful.
      *   Avoid "on the one hand, on the other."
      *   Use direct language ("We cannot," "I recommend").
      *   Ensure the "Steelman" paragraph feels genuine, not dismissive.

  6.  **Review against Constraints:**
      *   Take a side? Yes (Refuse).
      *   Bottom line? Yes.
      *   Timeframe? Yes (Immediate decision).
      *   Reusable criteria? Yes.
      *   Steelman + Flip conditions? Yes.
      *   No citations? Yes.
      *   Length? Reasonable for a memo.

  7.  **Self-Correction/Polishing:**
      *   *Check:* Did I address the "expressivist" point? I should include it in the rationale but focus heavily on the scientific validity as the primary blocker. The expressivist argument is more philosophical; the scientific validity is clinical bedrock. I'll blend them: offering invalid tests harms trust and devalues the condition by treating it as a variable to be optimized via flawed tools.
      *   *Check:* Is the resource argument strong enough? Yes, 2 slots/month is a hard constraint.
      *   *Check:* Is the timeline clear? They need to know *now* to manage the 6-week window.
      *   *Check:* Is the "Flip" specific? Yes, validated scores or idle capacity.

  8.  **Final Polish:** Ensure the voice sounds like a colleague speaking to colleagues, not a lecturer. Use "we" for the clinic, "I" for the recommendation.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "No." I need to make sure the "Refuse" is actionable. The lab needs to know not to run it. The counselors need to know how to break the news. The criteria need to be generalizable.

