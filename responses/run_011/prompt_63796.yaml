answer: |-
  Here is the principle, the application, and the hard trade-offs you asked for.

  ### The Principle: Habitual Subjection

  **The franchise belongs to every adult person who is habitually resident within the territory of the state.**

  To make this precise enough for disagreement, we must define the three operative terms:
  1.  **Adult:** Any person who has reached the age of legal majority (eighteen). This is a bright-line proxy for autonomy, rejecting individualized capacity tests.
  2.  **Habitually Resident:** Any person whose center of vital interests is located within the territory, evidenced by continuous physical presence for a minimum threshold period (I propose three years), without a fixed and immediate intent to depart.
  3.  **Within the Territory:** Subject to the comprehensive coercive jurisdiction of the state's daily administration, not merely its occasional or external claims.

  This is a principle of **social membership**, not legal citizenship. It grounds the right to vote in the fact of being governed, not in the status of belonging.

  ### How the Clauses Capture Your Verdicts

  *   **"Habitually Resident" (The 31-year woman, the 5-year resident):** This captures your strongest intuitions. The woman who has lived here for thirty-one years has her "center of vital interests" here. The cost of withdrawal is the ruin of her life. She is in.
  *   **"Minimum Threshold" (The Nurse, the Tourist, the 3-year resident):** Setting the bar at three years excludes the tourist (10 days) and the nurse (2 years, known intent to leave). It resolves your uncertainty about the three-year resident by placing her exactly on the line: she is in. This clause does the work of "enduringly" in your tentative principle without requiring a vague assessment of "ruin."
  *   **"Within the Territory" (The Bondholder, the Never-visited Citizen):** The bondholder is subject to financial risk, not comprehensive coercive rule. The citizen who has never visited holds a legal status but is not habitually resident. Both are out. This aligns with your verdicts.
  *   **"Adult" (The 16-year-old):** This excludes the sixteen-year-old. It is an arbitrary line, but it is a clear one. It captures your verdict without requiring a complex theory of cognitive capacity.
  *   **No Capacity Test (The Prisoner, the Dementia Patient):** Because the principle relies on *residence* and *age*, not *competence* or *moral worth*, the prisoner and the dementia patient remain in. They are habitually resident adults. This captures your refusal to apply capacity tests.
  *   **Asylum Seeker:** Under this principle, a person in the seventh year of an asylum procedure is habitually resident. They are in for national elections, not just municipal ones. This resolves your uncertainty by pushing you toward inclusion.

  ### Application to New Cases

  *   **The Conscientious Objector (Permanent resident refusing citizenship):** **In.** She is habitually resident. Her refusal of the oath is irrelevant because citizenship is not the criterion. This is a strength of the principle: it decouples voting from assimilation.
  *   **Residents of a Dependent Territory:** **In.** If they are subject to the statutes of the legislature in question and habitually reside in the territory governed by it, they vote. If the territory has its own legislature, they vote there. The principle follows the locus of coercive power, not the flag.
  *   **Independence Referendum Electorate:** **Exactly coextensive with the general election.** There is no principled reason to widen or narrow the franchise for a constitutional decision. The "demos" that decides the fate of the state must be the same demos that lives under it. To widen it (e.g., to include expats or descendants) is to allow those not subject to the outcome to decide it; to narrow it is to subject people to a new sovereign without their consent.

  ### The Verdict You Must Surrender

  To keep this principle simple and coherent, you must surrender the **long-term expatriate citizen**.

  Your verdict is that the citizen who lived here until forty and then emigrated should keep the vote. My principle says he should not, because he is no longer habitually resident. He is not subject to the comprehensive daily rule of the state; he cannot be ruined by its laws in the same way as the resident.

  If you keep the expat verdict, you are forced to add a "Citizenship Clause" to the principle (e.g., *"…or is a citizen who was previously resident"*). This creates the exact tension you identified: it becomes impossible to explain in principle why the expat votes but the never-visited citizen does not, other than an appeal to "socialization" which is hard to measure. Dropping the expat verdict allows you to adopt the **Pure Residence** model, which is considerably simpler and avoids the "citizenship privilege" problem.

  ### The Weak Joint: Circularity Relocated

  You asked for honesty about whether this escapes the boundary problem. It does not. It relocates it.

  The principle relies on the definition of "habitual residence." Who decides what counts as residence? Who sets the three-year threshold? Who determines if an asylum seeker is "resident" or merely "present"? **The state does.**

  This means the boundary of the demos is still determined by the existing state apparatus (legislature or courts), not by the demos itself. We have avoided the vicious circularity of a *referendum* on the franchise (where only current voters decide who votes), but we have not escaped the fact that the *rules of inclusion* are set by the very entity whose legitimacy depends on those rules.

  The advantage of this principle is that it grounds the boundary in **facts of social existence** (where you live, how long you stay) rather than **political decisions** (who we like). This makes the circularity less vicious because the criteria are external to the immediate political contest. However, if the state arbitrarily defines "residence" to exclude a class of people (e.g., "migrants are never residents"), the principle offers no internal democratic remedy. The weak joint is that the guardian of the boundary remains the state itself.

  ### What Would Change My Mind

  If you surrendered the **exclusion of sixteen-year-olds**, a considerably simpler principle would emerge: **"All Habitual Residents."**

  Currently, you hold two conflicting positions:
  1.  **Dementia:** No capacity tests (include those who cannot understand).
  2.  **Sixteen-year-olds:** Age limit (exclude those who may understand).

  This is an inconsistency. If you refuse to test the capacity of the dementia patient because it is dangerous or discriminatory, you cannot consistently test the capacity of the sixteen-year-old via an age proxy. If you lower the voting age to match the age of criminal responsibility or sexual consent (often 16), you can delete the "Adult" clause entirely.

  The principle then becomes: **"The franchise belongs to every habitual resident."**

  This is the simplest possible democratic boundary. It aligns with your intuition about the 31-year woman, the prisoner, and the dementia patient. It forces you to include the asylum seeker (which you are already leaning toward). It forces you to exclude the expat (which simplifies the citizenship mess). The only cost is the sixteen-year-old. If you are willing to pay that cost, the principle becomes razor-sharp. If you are not, you must keep the "Adult" clause and accept the tension with your dementia verdict.
