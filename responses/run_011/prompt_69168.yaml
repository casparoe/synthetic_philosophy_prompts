      *   *Do they attack the same thing?* Not exactly. Carr is more Marxist/positivist-lite (facts matter but are selected); White is linguistic/structuralist (the form creates the meaning).
      *   *What survives?* The commitment to evidence (Reading 1 & 2 partially). We can't know *everything*, but we can know *some things* reliably, provided we acknowledge the limitation.

  6.  **Developing the "Strongest Defensible Claim":**
      *   The user needs a sentence for the booklet.
