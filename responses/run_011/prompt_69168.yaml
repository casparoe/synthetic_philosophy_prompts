      *   It needs to distinguish between *events* (looms stopped, men transported) and *motives/meanings* (why they stopped, justice of transport).
      *   Proposed sentence idea: "We can establish the sequence of actions with confidence, but our understanding of motives and justice remains partial and viewed through the eyes of the victors."

