          5.  **The Identity of Record and Event:** What is written *is* what happened. (False).
      *   *Chairman's Need:* He needs #2 and #5 combined. He treats the depositions as transparent windows, not filtered glass.
      *   *Carr/White:* Carr bites on #4 (selection bias). White bites on #3 and #4 (narrative imposition). They differ: Carr thinks you can still find truth through sociology; White thinks you're always writing literature.
