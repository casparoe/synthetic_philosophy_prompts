          *   Historian's Voice (objectivity/erasure).

  3.  **Drafting the Numbered List of Readings:**
      *   *Reading 1: The Minimal Truth Claim.* History should try not to lie. (Platitude).
      *   *Reading 2: The Empirical Reconstruction.* We can establish the sequence of physical events accurately. (Substantive/Defensible but limited).
      *   *Reading 3: The Essential Truth.* We can know the *meaning* or *essence* of the past, not just facts. (Substantive/Metaphysical).
      *   *Reading 4: The God's Eye View.* We can see the past as it was without present bias. (False/Impossible).
      *   *Reading 5: The Erasure of the Historian.* The historian's voice should vanish. (False/Undesirable).
      *   *Reading 6: The Archival Limit.* Truth is limited to what the records say. (False/Confuses evidence with event).

      *Refining the Classifications:*
      *   1 (Don't lie): Platitude.
      *   2 (Facts are knowable): Substantive.
      *   3 (Essence/Meaning): Substantive (Rankean).
