  4.  **Analyzing the Chairman's Position:**
      *   He uses the phrase to shut down the "one-sided sources" worry. He calls alternative interpretations "speculation."
      *   To make this move, he needs *Reading 2* (we can get the facts from the records) combined with *Reading 4* (we can strip away the bias to see the fact). If he admits the records *are* the bias, his argument collapses. He needs to believe the "fact" exists underneath the "refraction."
      *   Actually, he specifically needs the claim that *facts exist independently of the narrative*. If the member says "facts are refracted," the Chairman says "that's fiction." So he needs a strong realist ontology.

  5.  **Analyzing Carr and White:**
      *   *Carr:* Focuses on selection and interpretation. "Facts" don't speak; historians speak. Attacks the idea of pure objectivity.
