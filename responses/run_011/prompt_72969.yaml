answer: |-
  **Exam Question**

  **Question 4**
  Consider the following artifact from a newsroom investigation into a fleet of electric buses. A data editor constructed a ledger to track evidence for the hypothesis *H*: "All 2019-retrofitted buses have the brake-sensor fault." The ledger operates on four rules:
  1.  Observing a 2019-retrofitted bus with the fault adds +1 to the score for *H*.
  2.  Observing a vehicle that is *not* a 2019-retrofitted bus and does *not* have the fault adds +1 to the score for *H* (via the contrapositive).
  3.  Observing a 2019-retrofitted bus without the fault kills *H* outright.
  4.  The ledger maintains two running totals (for *H* and its contrapositive) and reports them side-by-side. Non-bus objects (e.g., a pigeon) score points in both totals.

  The Transport Authority claims that inspecting 12,000 non-retrofitted vehicles without finding the fault "confirms" their maintenance regime is fine.

  Critique the ledger's methodology. Specifically, explain why Rule 2 and Rule 4 produce a misleading measure of evidence despite being logically consistent. Determine whether Rule 2 can survive any proposed repair, and conclude by stating whether the Transport Authority's claim should be allowed to stand in print. Your answer must rely on self-contained reasoning regarding evidence and class sizes rather than undefined technical jargon.

  ***

  **Model Answer**

  The ledger correctly identifies the logical structure of the hypothesis but fails catastrophically as a measure of evidential weight. It conflates logical consistency with empirical support. While Rule 1 and Rule 2 adhere to the equivalence condition—where "All A are B" is logically equivalent to "All non-B are non-A"—the ledger treats all confirming instances as equal additions to a score. This additive model ignores the background knowledge necessary to interpret data.

  The fundamental flaw lies in Rule 4 and the treatment of Rule 2. By awarding identical points for observing a retrofitted bus and a non-retrofitted vehicle (or a pigeon), the ledger assumes all observations are equally informative. They are not. Evidence functions by reducing uncertainty. We already know from depot records that the vast majority of vehicles are not 2019 retrofits. Finding a non-retrofitted vehicle without the fault is exactly what we expect regardless of whether the hypothesis is true or false. Because the observation is expected under both the hypothesis and its negation, it provides negligible support. In contrast, finding a retrofitted bus with the fault is a specific test of the risk group. The ledger's additive scoring masks this asymmetry, allowing the score to inflate via irrelevant observations.

  Rule 2 cannot survive a repair that retains the ledger's counting mechanism. The contrapositive is logically valid, but inductive support depends on the method of selection. If we deliberately select non-retrofitted vehicles to inspect, we are not testing the hypothesis; we are testing the background population. For Rule 2 to contribute meaningfully, the observation must be surprising. Given the class sizes (412 retrofitted vs. 12,000 others), a random observation is overwhelmingly likely to be a non-retrofitted vehicle. Therefore, observing one does not shift our confidence in the hypothesis. A repaired system would weight observations by the "surprise" factor or the severity of the test, not merely count instances. A pigeon outside the window should score zero because its existence is independent of the bus maintenance regime.

  Consequently, the Transport Authority's claim should not be allowed to stand in print as written. To say the inspections "confirm" the maintenance regime implies that the evidence makes the hypothesis significantly more probable. In reality, the inspections merely show consistency. They have not tested the specific group where the fault is predicted to exist. Publishing the claim without qualification misleads the public into believing the risk has been empirically ruled out, when only the logical possibility of error has been maintained. The statement should be corrected to reflect that while no counter-evidence was found in the wider fleet, the critical population—the retrofitted buses—remains the only relevant test case. The ledger's output is a mathematical artifact, not a measure of safety.

  ***

  **Marking Scheme (25 Marks)**

  | Move | Description | Marks | Typical Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Identify Logical Validity:** Acknowledge that Rule 2 relies on logical equivalence (contrapositive) and is formally consistent. | 5 | Dismissing Rule 2 as logically false rather than pragmatically useless. |
  | **2** | **Critique Additive Scoring:** Explain that treating all observations as equal points (Rule 4) ignores the *weight* of evidence. | 5 | Accepting the score as valid because "a point is a point." |
  | **3** | **Introduce Background Knowledge:** Argue that class sizes (412 vs 12,000) make non-retrofit observations expected/non-informative. | 5 | Treating the population as unknown or ignoring the depot records context. |
  | **4** | **Dismantle Rule 2/Pigeon:** Conclude that irrelevant objects (pigeons/non-buses) should score zero because they don't test the risk. | 5 | Arguing pigeons count because "everything is evidence" without qualification. |
  | **5** | **Verdict on Authority:** Explicitly reject the "confirms" language as misleading; distinguish consistency from confirmation. | 5 | Focusing only on the philosophy and failing to answer the newsroom prompt. |

  **Wrong Turns (Deduct marks even if fluent)**
  *   **Psychological Dismissal:** Claiming the paradox is only a problem because humans find it counter-intuitive.
  *   **Equivalence Denial:** Rejecting the contrapositive without explaining what logical cost this incurs.
  *   **Restatement:** Arguing "a pigeon isn't a bus" as if that alone solves the logical equivalence.
  *   **Falsificationism Dodge:** Claiming "we only look for faults" without addressing the confirmation claim.
  *   **Empty Bayesianism:** Using terms like "priors" or "likelihood" without defining the reference classes.
  *   **Missing the Selection Procedure:** Failing to note that *how* the vehicles were chosen matters (random vs. targeted).

  ***

  **Feedback on Your "Wrong Turns" List**

  Your list is strong and covers the standard philosophical pitfalls. However, you are missing one big one that is specific to this journalistic context: **Ignoring the Selection Procedure.**

  Students often treat evidence as passive ("here is an object, does it fit?") rather than active ("why did we look at this object?"). In the bus scenario, the Transport Authority *chose* to inspect 12,000 non-retrofitted vehicles. If that selection was deliberate to pad the numbers, it's manipulative. If it was random, the class size makes it useless. Students who fail to mention *how* the data was gathered (sampling bias vs. random sampling) miss the practical reason why the ledger is dangerous in a newsroom context. I have added this to the Wrong Turns list above.
