prompt: |-
  I teach ethics, not philosophy of mind or psychology, so I'm out of my depth here and want a sanity check before I reply to someone.

  A friend of mine writes for general-audience magazines and has a piece coming out about what psychology has done to philosophy. She sent me the paragraph below and asked whether it's fair, becuase she doesn't want to get shouted at by people in the field. She's a good writer and she clearly did some reading — I checked the vignette and the two percentages against the original paper and those are right, so don't spend any time on them.

  Here's her paragraph:

  "Knobe's result was that people's moral feelings leak into what look like purely factual judgments. Tell subjects about a chairman of the board who learns that a new program will increase profits but harm the environment, who says he doesn't care at all about harming the environment and only wants as much profit as he can get, and who starts the program anyway — 82% say he harmed the environment intentionally. Now change the valence, so the program helps the environment and the chairman says he doesn't care about that either, and only 23% say he helped intentionally. Nothing in the story has changed except whether the side effect is good or bad, so the difference has to be coming from the subjects' attitudes rather than from any fact about the chairman. That is a decisive refutation of the idea that intentional action is a neutral, descriptive notion you apply on the basis of what the agent wanted, what she believed, and what she did. It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame — and because the asymmetry turns up in preschoolers and in samples from lots of different cultures, it is a fact about human minds rather than an artifact of the English word 'intentionally.' Philosophers have been treating their own intuitions as evidence for two thousand years. Knobe showed that those intuitions are just moralized snap judgments, which is why conceptual analysis now has to be handed over to psychology."

  My instinct is that the middle is fine and the last couple of sentences are where she's gone off the rails, but I can't say precisely why, and I dont want to be the colleague who picks apart a good piece of writing on points of tone. So: go through it claim by claim and tell me which sentences a working experimental philosopher would sign off on roughly as written, which are defensible simplifications I could let stand, and which actually misstate the result or overreach from it.

  Two things I specifically suspect. First, 'nothing in the story has changed except whether the side effect is good or bad' feels too quick to me — doesn't the chairman's own stance change too, in a way that matters? Second, 'we are not describing the world at all, we are voicing blame' sounds like she's saddling the result with an expressivism about intentional action that the data can't possibly license — but maybe I'm wrong and that's one of the standard readings on offer.

  I'd also like you to lay out what the live explanatory options actually are, with enough detail that I can see whether her 'refutation' framing survives them: is the asymmetry supposed to show that a neutral competence is being distorted, or that moral considerations are genuinely part of the criteria for the concept, and does the effect itself decide between those two? And does 'it shows up in children and in other cultures,' even if true, do the work she wants it to do — what would it have to rule out to support her conclusion?

  Last thing: if she only gets to fix one sentence, which fix changes the thrust of the paragraph the most, and roughly what should she write instead?

  Plain English, please — I want to forward your reply to her more or less as is. No need to cite anything or name studies; I'm not checking your references and neither is she, so just give me the substance.
reasoning: |-
