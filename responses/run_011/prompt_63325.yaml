      *   *Refinement:* Ensure I don't sound like I'm doing philosophy *at* the user, but giving them the tools to explain it to the writer. Make sure the distinction between "influenced by" and "is nothing but" is crystal clear.

  7.  **Self-Correction/Review during drafting:**
