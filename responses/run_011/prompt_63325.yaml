answer: |-
  Your instincts are excellent. You have correctly identified the two weakest links in the chain. The paragraph starts strong, accurately describes the experiment, but then makes a massive philosophical leap that most working experimental philosophers would reject. If she publishes this as written, she will indeed get pushback, not because she's "wrong" about the numbers, but because she draws conclusions the numbers don't support.

  Here is a claim-by-claim breakdown, followed by the explanatory background you asked for, and finally the specific recommendation for the one sentence she must change.

  ### Claim-by-Claim Breakdown

  **1. "Knobe's result was that people's moral feelings leak into what look like purely factual judgments."**
  *   **Verdict:** **Green Light.** This is a fair, standard summary for a general audience. It captures the core intuition of the "Side-Effect Effect" (often called the Knobe Effect).

  **2. The Vignette and Percentages (Chairman, Harm vs. Help, 82% vs. 23%).**
  *   **Verdict:** **Green Light.** You verified the data; the setup is standard.

  **3. "Nothing in the story has changed except whether the side effect is good or bad, so the difference has to be coming from the subjects' attitudes rather than from any fact about the chairman."**
  *   **Verdict:** **Yellow Light (Defensible Simplification).** Your suspicion here is correct. Technically, the chairman's relationship to the outcome *does* change in a subtle way. Being "indifferent to harm" is psychologically and normatively different from being "indifferent to help." However, for a magazine piece, this is an acceptable shorthand. It conveys the idea that the *mental state* (indifference) was held constant while the *moral valence* shifted. You can let this stand, though it's slightly imprecise.

  **4. "That is a decisive refutation of the idea that intentional action is a neutral, descriptive notion..."**
  *   **Verdict:** **Red Light (Overreach).** "Decisive refutation" is too strong. The data challenges simple models of intentional action, but it doesn't kill the idea that intentionality is descriptive. Many philosophers argue that moral considerations are *part* of the descriptive criteria, not an external distortion. It's a challenge, not a refutation.

  **5. "It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame..."**
  *   **Verdict:** **Red Light (Philosophical Error).** This is the biggest problem. This claims "expressivism"—the idea that the word "intentionally" is just a disguised way of saying "boo!" to someone. The data shows moral judgment *influences* the application of the concept, not that the concept *is nothing but* moral judgment. This is a category error that will make philosophers of mind and language wince.

  **6. "...because the asymmetry turns up in preschoolers and in samples from lots of different cultures, it is a fact about human minds rather than an artifact of the English word 'intentionally.'"**
  *   **Verdict:** **Green Light.** This is the standard argument against linguistic parochialism. It's a defensible claim for a general audience.

  **7. "Philosophers have been treating their own intuitions as evidence for two thousand years. Knobe showed that those intuitions are just moralized snap judgments, which is why conceptual analysis now has to be handed over to psychology."**
  *   **Verdict:** **Red Light (Tone and Accuracy).** This is inflammatory and inaccurate. First, calling them "just snap judgments" dismisses the cognitive work involved. Second, the consensus in experimental philosophy is not that philosophy should be "handed over" to psychology, but that the two should collaborate. This sentence frames the field as a turf war rather than a partnership.

  ---

  ### Addressing Your Specific Suspicions

  **Suspicions 1: "Nothing in the story has changed..."**
  You are right to be wary. The chairman's stance *does* matter. Indifference to harm suggests a willingness to violate a norm; indifference to help suggests a failure to exceed a norm. These are different relationships to the outcome. However, the point of the experiment is to hold the *structure* of the mental state constant (foreseen side effect + indifference) while flipping the *moral value*. For a general audience, her phrasing is "close enough," provided she doesn't use it to prove that *only* moral valence matters.

  **Suspicion 2: "We are not describing the world at all, we are voicing blame."**
  You are absolutely right, and this is the critical error. The data shows that moral judgment is an **input** into the decision about whether to use the word "intentionally." It does not show that the word "intentionally" **means** "blameworthy."
  *   **Analogy:** Imagine a judge gives harsher sentences to defendants who look untrustworthy. That shows bias influences sentencing. It does not prove that "sentencing" is *nothing but* an expression of distrust. The Knobe effect shows morality influences intentionality judgments; it does not prove intentionality judgments *are* moral judgments.

  ---

  ### The Live Explanatory Options (The "Why")

  To understand why her "refutation" framing is too strong, you need to know that there are three main ways philosophers explain the Knobe Effect. The data she cites is compatible with all three, so it cannot "decisively refute" any of them on its own.

  1.  **The Bias View (Distortion):** We have a neutral, factual concept of "intentional." However, when we are angry or blaming someone, our cognitive system gets heated, and we apply the concept loosely. On this view, the 82% in the harm case are making a mistake driven by emotion.
      *   *Does her paragraph fit?* Yes. This matches her "voicing blame" narrative.
      *   *Is it proven?* No. Many experiments suggest people aren't "mistaken"; they are applying a consistent rule.

  2.  **The Constitutive View (Deep Grammar):** Moral considerations are actually *part* of the definition of "intentional," just like "unmarried" is part of the definition of "bachelor." On this view, you literally cannot count an action as intentional without checking its moral status. It's not a bias; it's how the concept works.
      *   *Does her paragraph fit?* No. This view says we *are* describing the world, but the description includes moral facts.
      *   *Is it proven?* No, but it's a very popular view among experimental philosophers.

  3.  **The Pragmatic View (Conversation):** We all mean the same thing by "intentional," but we speak differently depending on the context. We highlight the side effect in the harm case because it's relevant to the conversation about blame, but we ignore it in the help case because it's not relevant.
      *   *Does her paragraph fit?* No.
      *   *Is it proven?* No.

  **The Crucial Point:** The Knobe Effect (the percentages themselves) does not decide between these three options. It just establishes that there is a link between morality and intentionality. To claim it proves we are "just voicing blame" is to pick the most radical option (a version of the Bias View) and pretend the data forces it. It doesn't.

  **Regarding Children and Cultures:**
  Showing the effect in children and other cultures rules out the idea that this is just a quirk of the English language or adult education. However, it does **not** rule out the "Bias View." It is perfectly possible that *all* human minds share a universal bias to distort factual judgments when moral emotions are triggered. So, the cross-cultural data supports the idea that this is "human nature," but it does not support the idea that the neutral concept doesn't exist. It just means the "glitch" is universal.

  ---

  ### The One Sentence to Fix

  If she only changes one sentence, she should fix the one that makes the metaphysical error. This sentence is the engine driving the incorrect conclusion at the end. If you soften this, the final claim about "handing over to psychology" becomes less aggressive and more defensible.

  **The Sentence:**
  > "It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame..."

  **The Problem:**
  It claims the concept *is* blame (expressivism), rather than being *influenced* by blame.

  **The Fix:**
  She needs to change "is" to "is influenced by" (or similar). This preserves the punchiness without making a false philosophical claim.

  **Suggested Rewrite:**
  > "It shows that when we say someone did something on purpose, we are not simply describing the world; our judgment is inextricably shaped by whether we hold the agent to be blameworthy."

  **Why this works:**
  1.  **Accuracy:** It acknowledges the data (moral judgment shapes the application of the concept) without making the false claim that the concept *is* moral judgment.
  2.  **Flow:** It keeps the rhythm of the paragraph.
  3.  **Downstream Effect:** If you make this change, the final sentence ("...those intuitions are just moralized snap judgments") becomes less egregious. It shifts the tone from "Philosophers are deluded" to "Philosophers need to account for moral psychology."

  **Bonus Advice:**
  If she is willing to tweak the very last sentence, she should soften "handed over to psychology." A phrase like "must be done in partnership with psychology" or "must be informed by psychology" will save her from annoying the very people she is writing about, without losing the point that psychology is essential to the project.

  **Summary for your friend:**
  Tell her the setup and the data are great. Tell her she loses the room in the last third by claiming the data proves intentionality *is* blame, rather than *influenced* by blame. If she changes that distinction, the piece goes from "provocatively wrong" to "provocatively right."
