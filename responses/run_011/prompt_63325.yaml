      *   **Task:** Evaluate the paragraph claim-by-claim. Identify what's accurate, what's a defensible simplification, and what's an overreach/misstatement. Address specific suspicions (the "nothing changed" claim, the expressivism claim). Explain live explanatory options (competence vs. constitution). Evaluate the cross-cultural/developmental claim. Identify the *one sentence* to fix for maximum impact.
      *   **Constraint:** Plain English. Forwardable as is (no academic citations, no jargon without explanation).
      *   **Goal:** Help the friend avoid getting "shouted at by people in the field" while preserving the quality of the writing.

  2.  **Analyze the Paragraph (Claim-by-Claim):**
      *   *Claim 1: "Knobe's result was that people's moral feelings leak into what look like purely factual judgments."*
          *   Verdict: Accurate enough for general audience. This is the standard intro to the Side-Effect Effect (SEE).
      *   *Claim 2: The Vignette (Chairman, Harm vs. Help, 82% vs 23%).*
          *   Verdict: User confirmed facts are right. No need to critique.
      *   *Claim 3: "Nothing in the story has changed except whether the side effect is good or bad, so the difference has to be coming from the subjects' attitudes rather than from any fact about the chairman."*
          *   Verdict: Problematic. The user suspects this. It implies the *only* variable is the moral valence. But the *relationship* between the agent's attitude and the outcome changes (indifferent to harm vs. indifferent to help). It's not just "good vs. bad," it's how the indifference plays out against norms. Also, "subjects' attitudes" is vague. Is it moral judgment influencing intentionality, or intentionality influencing moral judgment?
      *   *Claim 4: "That is a decisive refutation of the idea that intentional action is a neutral, descriptive notion you apply on the basis of what the agent wanted, what she believed, and what she did."*
          *   Verdict: Overreach. "Decisive refutation" is too strong. It challenges *simple* folk-psychological models (like the Simple View), but many philosophers have adjusted models to accommodate this without abandoning descriptivism entirely. It's a challenge, not a refutation of the *possibility* of a neutral notion.
      *   *Claim 5: "It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame..."*
          *   Verdict: Major Overreach/Philosophical Error. This is the expressivism claim the user suspected. The data shows moral judgment *influences* the application of the concept. It does *not* prove the concept *is nothing but* blame. That's a huge leap from "influenced by" to "is identical to." Most experimental philosophers (x-phi) do not hold this view.
      *   *Claim 6: "...and because the asymmetry turns up in preschoolers and in samples from lots of different cultures, it is a fact about human minds rather than an artifact of the English word 'intentionally.'"*
          *   Verdict: Defensible simplification. This is the standard argument against linguistic parochialism. It supports universality, though "fact about human minds" is a bit broad, it's acceptable for a magazine piece.
      *   *Claim 7: "Philosophers have been treating their own intuitions as evidence for two thousand years. Knobe showed that those intuitions are just moralized snap judgments, which is why conceptual analysis now has to be handed over to psychology."*
          *   Verdict: Highly contentious/Overreach. "Just moralized snap judgments" dismisses the cognitive process too easily. "Handed over to psychology" is the "x-phi takeover" claim that many philosophers (even experimental ones) reject. Philosophy and psychology are seen as collaborative, not a handover. This is the most likely to cause shouting.

  3.  **Address Specific Suspicions:**
      *   *Suspicion 1: "Nothing in the story has changed..."*
          *   Analysis: Technically, the text changes ("harm" vs "help"). The agent's mental state regarding the outcome is structurally similar (indifference), but the normative context changes. The claim ignores that "intentionally" might track *reasons* differently in normative contexts. It's a simplification that borders on misleading.
      *   *Suspicion 2: "Not describing the world... voicing blame."*
          *   Analysis: This is the biggest philosophical error. It conflates *pragmatics/influence* with *semantics/ontology*. The Knobe effect shows moral valence is a *input* to the judgment, not that the judgment *is* a speech act of blame. This is a category error.

  4.  **Explain Live Explanatory Options:**
      *   Need to explain the debate without jargon.
      *   *Option A: The Bias/Distortion View.* We have a neutral concept of intention, but moral anger distorts it (like seeing red when angry).
      *   *Option B: The Constitutive View.* Moral considerations are actually *part* of the concept of intention (like "bachelor" includes "unmarried").
      *   *Option C: The Pragmatic View.* We mean the same thing, but we speak differently to praise/blame.
      *   *Does the data decide?* No. The effect itself (the percentages) is compatible with all three. You need further experiments to distinguish them. Therefore, saying it "decisively refutes" the neutral notion is wrong because the Bias View is still live.
      *   *Children/Cultures:* This rules out "English language quirk." It does *not* rule out "Universal Human Bias." So it doesn't prove the Constitutive View over the Bias View.

  5.  **Identify the One Sentence to Fix:**
      *   The sentence causing the most trouble is: "It shows that when we say someone did something on purpose we are not describing the world at all, we are voicing blame..."
      *   Why? It makes a metaphysical claim (expressivism) that the data doesn't support. It alienates philosophers who think intentionality *is* descriptive but morally sensitive.
      *   Alternative: Focus on the *influence* rather than the *identity*. "It shows that our judgments about intentional action are deeply intertwined with our moral evaluations."

  6.  **Drafting the Response:**
