      *   *Check:* Is the explanation of the "Bias vs. Constitutive" debate clear? I need to make sure I don't use terms like "semantic competence" without explanation. Use "how the word works" vs "glitch in the system."
      *   *Check:* Is the "One Sentence" fix actually better? Yes, changing "is voicing blame" to "is influenced by blame" saves the paragraph from being philosophically indefensible while keeping the punch.
