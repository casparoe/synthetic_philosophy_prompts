answer: |-
  **Project Title:** Deliberation in Fixed Histories: An Epistemic Residue in the Grandfather Paradox

  **Research Question**
  Does the standard modal solution to the grandfather paradox exhaust the normative constraints on a time traveler's deliberation? Specifically: In a single, fixed timeline, does an agent's knowledge of their own existence constitute evidence that renders the killing of their grandfather deliberatively closed, even if it remains modally compossible with local facts?

  This question admits a determinate answer. Either the rationality of the attempt is unaffected by historical knowledge (the modal solution suffices), or the knowledge imposes a distinct epistemic constraint that renders deliberation irrational or impossible (the residue thesis). The project aims to determine which condition holds and whether the constraint is genuinely deliberative or reducible to epistemic compatibility.

  **State of the Debate**
  The dominant response to the grandfather paradox relies on a contextualist semantics for ability claims. On this view, "can" is equivocal. Relative to a narrow set of fixed facts (the traveler's presence, the gun's function), the traveler can kill the grandfather. Relative to a wide set (including the fact that the grandfather survived), the traveler cannot. This solves the metaphysical contradiction by indexing ability to held-fixed facts.

  However, it is uncertain whether this modal bookkeeping addresses the agent's perspective. Some work in the literature suggests that ability and rationality come apart, but it is not clear if the specific tension between *fixed history* and *practical reasoning* has been isolated from general problems of fatalism. The standard position explains why the killing does not occur (metaphysical necessity) but remains silent on whether the traveler is rationally permitted to try. If the literature has addressed this, it often conflates epistemic compatibility (consistent with what I know) with deliberative availability (open for me to settle). My project proceeds on the hypothesis that these come apart, but it explicitly tests whether this distinction is robust or merely verbal. If the distinction collapses, the project will document that collapse as a finding about rational agency in fixed histories, rather than treating it as a failure of the proposal.

  **Methodology and Timeline**
  The ten weeks will be divided into three phases: conceptual construction, case analysis, and synthesis.

  *Weeks 1–2: Distinctions and Definitions.* I will formalize the three notions of "can." Modal "can" will be defined via compossibility with specified facts. Epistemic "can" will be defined as compatibility with the agent's evidence set. Deliberative "can" will be defined functionally: an option is deliberatively available only if the agent treats the outcome as dependent on their choice rather than as a prediction. I will argue that standard contextualism secures the modal "can" but leaves the other two undefined.

  *Weeks 3–4: The Two-Traveler Case.* I will construct the test case described in the preliminary idea. Traveler A knows the historical record (grandfather survived an unidentified attempt). Traveler B lacks this evidence (knows only their own existence). Both are modally identical. I will draft arguments showing that Traveler A faces an evidential constraint Traveler B does not. If modal "can" is the only relevant metric, both should deliberate identically. If their rational permissions differ, the modal solution is incomplete.

  *Weeks 5–6: The Fatalism Analogy.* I will analyze the structural parallel between this paradox and logical fatalism. Both arguments claim that settled truth removes agency. I will locate the breaking point: in logical fatalism, the truth is future-oriented; in time travel, the truth is past-oriented relative to the traveler's arrival. I will test whether the direction of fixation matters for deliberative closure. This section carries the highest risk; if the analogy proves superficial, I will cut it to preserve depth on the Two-Traveler case.

  *Weeks 7–8: Drafting the Argument.* I will assemble the case analysis into a continuous argument. The core claim will be that the grandfather paradox is partly an epistemological problem about self-knowledge. I will explicitly test the collapse hypothesis: if deliberative "can" reduces to epistemic "can," I will argue that the residue is epistemic, not practical. This satisfies the project's aim even if the three-way distinction simplifies to a two-way distinction.

  *Weeks 9–10: Revision and Talk Preparation.* I will refine the paper for the 9,000-word target and prepare the work-in-progress talk. The talk will focus on the Two-Traveler case to solicit feedback on the intuitive pull of the epistemic constraint.

  **Justification of Approach**
  Three obvious alternatives exist, but each leaves the central question unanswered.
  First, adopting a branching-worlds semantics avoids the paradox by allowing the grandfather to die in a divergent branch. This solves the metaphysics but dissolves the specific problem of deliberating in a *fixed* history, which is the source of the student's confusion and the philosophical puzzle of fatalism.
  Second, proposing a new modal semantics for "can" risks merely relabeling the problem. If the issue is evidential, adding modal operators does not explain why the agent's evidence constrains deliberation.
  Third, dismissing the puzzle as a pseudo-problem (claiming students are simply confused about modality) ignores the phenomenological reality of deliberation. Even if the killing is modally impossible relative to wide facts, the agent must decide whether to pull the trigger. Explaining why that decision is rational or irrational requires more than modal indexing.

  My approach isolates the normative dimension. By holding the metaphysics constant (single timeline) and varying the epistemic state, I can determine whether the residue is genuine.

  **Success and Failure Conditions**
  Success looks like a clear mapping of the relationship between modal, epistemic, and deliberative constraints. A positive result demonstrates that the standard modal solution is metaphysically sufficient but normatively incomplete.
  Failure would consist in getting bogged down in the metaphysics of time travel rather than the epistemology of agency.
  A specific risk is that deliberative "can" collapses into epistemic "can." If an agent cannot deliberate about what they know to be false, then deliberative availability is just epistemic compatibility. This would not be a project failure but a substantive finding: the "residue" is purely epistemic. The proposal treats this collapse as a live possibility. If the distinction proves unreal, the paper will argue that the students' confusion stems from conflating metaphysical possibility with evidential probability, not from a missing deliberative modality.

  **Scope and Minimum Publishable Version**
  Ten weeks is sufficient for a 9,000-word paper but tight for extensive formal modeling. If the Fatalism Analogy (Weeks 5–6) proves intractable, I will cut it. The minimum publishable version relies solely on the Two-Traveler case. If that case demonstrates a divergence in rational permissions between Traveler A and Traveler B, the core thesis stands without the fatalism comparison.
  Conversely, if the Two-Traveler case fails to generate a divergence (i.e., if existence alone is deemed insufficient evidence for Traveler B), the scope shifts to analyzing what counts as evidence in time travel contexts. This is still publishable but requires a narrower focus on epistemic justification rather than deliberative structure.

  **Critical Assessment and Risks**
  I must note a significant uncertainty regarding the novelty of this approach. It is possible that the literature on time travel and ability has already addressed the epistemic constraints on agents in fixed histories. If the "epistemic residue" is already named and solved in existing work, this project risks redundancy. I will mitigate this by focusing on the specific distinction between epistemic and deliberative norms, which is less commonly explored than the modal/epistemic split.
  Furthermore, there is a risk that the Three-Way Distinction is not real. If "deliberative can" is just "epistemic can" described in practical language, the project's theoretical framework requires adjustment. The proposal accommodates this by treating the distinction as a hypothesis to be tested rather than a premise. If the distinction collapses, the paper will argue that the grandfather paradox reveals a limit on rational agency imposed by self-knowledge, not a unique deliberative modality.
  Finally, the question assumes the students' confusion is philosophically productive. It is possible they are simply struggling with contextualism. However, the persistence of the objection across cohorts suggests a structural gap in the standard explanation, warranting this investigation.

  **Conclusion**
  This project isolates a specific gap in the standard treatment of time travel paradoxes: the transition from metaphysical possibility to rational deliberation. By testing whether historical knowledge constrains agency independently of modal facts, it clarifies the normative stakes of the grandfather paradox. Whether the result confirms a distinct deliberative modality or collapses it into epistemic constraint, the project yields a determinate answer to a question the standard literature leaves open.

  \answer{GO}
