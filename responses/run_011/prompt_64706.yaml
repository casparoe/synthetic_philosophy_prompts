  For two years I've moderated a forum thread in which a constitutive panpsychist and a cosmopsychist talk past each other, and I want the document they should have produced: a joint statement both could sign after a good-faith adversarial collaboration. Give me a numbered list of claims both can accept — about what the physical sciences leave unexplained, about what each means by "phenomenal," and about the logical form of the two grounding problems (subject-summing versus decomposition). Then a disagreements table: for each contested point, the constitutive panpsychist's own formulation, the cosmopsychist's own formulation, and a verdict on whether the difference is substantive or an artifact of letting "subject" mean different things at different scales.

  Then the cruxes — the sub-questions whose settlement would move at least one side — of which I want three, two of them run on devices I'll stipulate. First, a transparency gradient: an ordered series running from two people conversing by phone to a dyad with complete mutual introspective access, with each side stating in advance at which rung, if any, a further subject comes into existence, and what would count as evidence that they placed the rung wrongly. Second, a symmetry test: if phenomenal blending can generate a rich macro-palette from sparse micro-qualities, can the same blending run downward to generate finite perspectives from a cosmic subject — and if not, which asymmetry is doing the work? Record each side's prediction on every crux, preregistration style, and close by stating what each would accept as evidence against their own position, together with an honest assessment of whether any crux here can be settled at all in the absence of a relevant experiment.
