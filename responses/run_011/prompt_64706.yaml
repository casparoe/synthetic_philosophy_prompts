  # JOINT STATEMENT ON GROUNDING AND PHENOMENALITY
  **A Record of Adversarial Collaboration**

  **Signatories:**  
  **[CP]:** Proponent of Constitutive Panpsychism  
  **[CO]:** Proponent of Cosmopsychism  
  **Date:** October 26, 2023  
  **Moderator:** Forum Administrator  

  ---

  ## I. AGREED CLAIMS
  *The following propositions are accepted by both parties as the baseline for further dialectic.*

  1.  **The Structural Limit of Physics:** The physical sciences describe the world exhaustively in terms of structure, dynamics, and relational dispositions (what things *do*), but leave unexplained the intrinsic nature of the relata (what things *are*). Both parties agree that physicalism fails because it attempts to derive the intrinsic from the structural.
  2.  **The Definition of "Phenomenal":** Both parties define "phenomenal" strictly as the subjective character of experience (Nagel's "what it is like"). It is not functional, not behavioral, and not representational in the computational sense. It is the raw datum of existence.
  3.  **The Isomorphism of Grounding Problems:** Both parties acknowledge that their respective positions face structurally identical logical hurdles regarding the unity of consciousness.
      *   **[CP]** faces the **Subject-Summing Problem**: How do distinct micro-subjects combine to form a unified macro-subject without losing their individuality or violating the transitivity of identity?
      *   **[CO]** faces the **Decomposition Problem**: How does a unified cosmic subject fragment into distinct, seemingly isolated finite subjects without the cosmic subject ceasing to be unified or the finite subjects becoming illusory?
  4.  **Rejection of Strong Emergence:** Both parties agree that consciousness cannot strongly emerge from wholly non-conscious physical bases. Phenomenality must be fundamental to the ontology.

  ---

  ## II. DISAGREEMENTS TABLE
  *Points of divergence, formulated in each side's preferred terminology, with a joint verdict on the nature of the disagreement.*

  | Contested Point | Constitutive Panpsychist [CP] Formulation | Cosmopsychist [CO] Formulation | Joint Verdict |
  | :--- | :--- | :--- | :--- |
  | **Metaphysical Priority** | Micro-experiences are fundamental. Macro-experiences are *constructed* via combination relations. | The Cosmic Experience is fundamental. Macro/Micro experiences are *derivative* via limitation or decomposition. | **Substantive.** Disagreement on the direction of ontological dependence. |
  | **The "Subject" Term** | "Subject" is scale-invariant. An electron is a subject in the same logical sense as a human, differing only in complexity. | "Subject" is scale-sensitive. The Cosmic Subject is the only true *substantial* subject; finite subjects are *adverbial* modifications of the One. | **Semantic/Substantive Hybrid.** Disagreement on whether "subject" denotes a countable entity or a mode of givenness. |
  | **Privacy & Isolation** | Subjects are fundamentally private. Combination requires a bridge (phenomenal blending) that overcomes this privacy. | Subjects are fundamentally open. Isolation is the phenomenon to be explained (via "de-blending" or masking). | **Substantive.** Inverse starting axioms regarding the default state of consciousness. |
  | **Causal Exclusion** | If micro-subjects cause micro-events, macro-causation risks overdetermination unless macro-subjects are identical to the sum. | If the Cosmic Subject causes all events, finite agency risks epiphenomenalism unless finite wills are identical to cosmic will-fragments. | **Substantive.** Both face the "Causal Drain" objection, but locate the leak differently. |

  ---

  ## III. THE CRUXES
  *Three sub-questions identified as potential pivot points. Settlement of any one would necessitate significant revision of at least one position.*

  ### Crux 1: The Transparency Gradient (Stipulated Device)
  **Setup:** An ordered series of intersubjective coupling:
  1.  **Rung 1:** Two humans conversing by telephone (symbolic exchange).
  2.  **Rung 2:** Two humans linked via brain-computer interface sharing raw sensory qualia (e.g., I feel your pain).
  3.  **Rung 3:** Two humans with complete mutual introspective access (no boundary between "my" thought and "your" thought).

  **The Question:** At which rung does a *further* subject (a "dyad-subject") come into existence?

  *   **[CP] Preregistration:** A new subject emerges only at **Rung 3**. Integration requires functional unity akin to a corpus callosum. Below Rung 3, there are only two interacting subjects.
      *   *Evidence of Error:* If subjects at Rung 2 report a unified "we-perspective" that cannot be reduced to simulated empathy, CP must lower the threshold for subjecthood.
  *   **[CO] Preregistration:** No *new* subject ever comes into existence. The Cosmic Subject is present at all rungs. What changes is the **degree of fragmentation**. At Rung 3, the fragmentation is minimized, revealing the underlying unity.
      *   *Evidence of Error:* If Rung 3 coupling results in a *loss* of total information (e.g., the dyad knows less than the sum of the parts), CO must admit that unity is constructive, not revelatory.

  ### Crux 2: The Symmetry Test (Stipulated Device)
  **Setup:** A test of phenomenal blending logic.
  *   **Upward:** Can sparse micro-qualities (e.g., red + green) blend to generate a rich macro-palette (e.g., yellow/experience of red-green)?
  *   **Downward:** Can a rich macro-palette decompose to generate sparse micro-qualities without remainder?

  **The Question:** Is the logic of blending symmetric? If not, what asymmetry does the work?

  *   **[CP] Preregistration:** Blending is **Asymmetric**. Upward blending is possible (via phenomenal composition). Downward blending is impossible because parts cannot contain the whole. The asymmetry is *Mereological*.
      *   *Evidence of Error:* If it can be demonstrated that a complex experience logically entails the existence of simpler sub-experiences that are *not* consciously accessible to the whole, CP's composition model fails.
  *   **[CO] Preregistration:** Blending is **Asymmetric (Inverse)**. Downward decomposition is possible (via masking/ignoring). Upward blending is impossible because the whole precedes the parts. The asymmetry is *Epistemic* (limitations on access).
      *   *Evidence of Error:* If a "decomposed" subject demonstrates knowledge or capacity exceeding the logical limits of its fragmentation (i.e., accessing the "whole" without re-integration), CO's masking model fails.

  ### Crux 3: The Causal Drain (Selected Device)
  **Setup:** Tracing the locus of causal efficacy in a voluntary action (e.g., raising an arm).

  **The Question:** Where does the decision originate to avoid causal overdetermination?

  *   **[CP] Preregistration:** The decision originates at the **Macro-Level**. The micro-subjects provide the *power*, but the macro-subject provides the *direction*.
      *   *Evidence of Error:* If neurophysics demonstrates that the causal chain is fully closed at the micro-particle level with no "gap" for macro-influence, CP collapses into epiphenomenalism.
  *   **[CO] Preregistration:** The decision originates at the **Cosmic-Level**. The finite subject is the *locus* of the decision, but not the *source*.
      *   *Evidence of Error:* If finite subjects demonstrate genuine novelty (actions unpredictable even in principle from the Cosmic state), CO collapses into dualism.

  ---

  ## IV. FALSIFICATION AND ASSESSMENT

  ### Falsification Conditions
  *What each signatory accepts as evidence against their own position.*

  *   **[CP] Will Abandon Constitutive Panpsychism If:**
      1.  It is proven that combination of subjects leads to a net *loss* of information (violating the conservation of phenomenality).
      2.  Physics confirms that fundamental particles are wholly devoid of interiority (e.g., via a theory of everything that successfully derives intrinsic nature from pure structure).

  *   **[CO] Will Abandon Cosmopsychism If:**
      1.  It is proven that finite subjects possess causal powers strictly independent of the cosmic whole (violating monism).
      2.  The Decomposition Problem is shown to be logically incoherent (i.e., that a unified subject *cannot* even in principle have fragmented perspectives).

  ### Honest Assessment of Settability
  **Moderator's Note:** We conclude with a joint assessment regarding the empirical tractability of the cruxes above.

  1.  **Empirical Limitations:** We acknowledge that **none** of the three cruxes can be definitively settled by current physical experimentation. The Transparency Gradient relies on first-person reports which are theoretically underdetermined (is it *one* subject feeling unity, or *two* subjects feeling similarity?). The Symmetry Test relies on metaphysical mereology, not observable data. The Causal Drain is hidden by the causal closure of the physical domain.
  2.  **Theoretical Virtue:** Consequently, the choice between [CP] and [CO] currently rests on **inference to the best explanation** regarding parsimony and coherence, not observation.
  3.  **Collaboration Outcome:** While we remain opposed on the direction of grounding, we agree that the "Subject-Summing" and "Decomposition" problems are equiprobable hurdles. The choice between our views is currently a matter of philosophical temperament: [CP] prefers the intuition of **building up** from the familiar (atoms to minds); [CO] prefers the intuition of **breaking down** from the necessary (the universe to minds).

  **Signed,**  
  *[CP]*  
  *[CO]*
