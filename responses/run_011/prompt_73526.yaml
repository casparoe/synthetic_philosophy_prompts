  Jurors start with 100 points.
  Round 1 (Verdict): +10 for matching Witness consensus, -10 for mismatch. Abstain = 0.
  Round 2 (Projection): Auditors ask "If X is true, is Y true?"
  If Juror says "Yes" and it's wrong (per TA key): -20.
  If Juror says "No" and it's wrong: -20.
  If Juror says "Pass": -5 (Cost of uncertainty).
  This makes abstaining safe but low-reward, while projection is high-risk.

  *(Wait, one more thing)*: The TA wants to test the hunch that the belief is *inert*. If the Juror adopts the belief "It is beautiful," can they use it?
  The Auditors should ask: "What feature makes it beautiful?" If the Juror can't say, they can't project.
