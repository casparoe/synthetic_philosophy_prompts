answer: |-
  Here is the spec. It is not a cluster concept, it is not a matter of degree, and it is not a menu. It is a binary filter designed to separate **Darwinian Individuals** from **mere collectives** or **subordinate parts**.

  ### The Spec: The Bottlenecked Lineage with Part-Invability (BLPI) Account

  An entity counts as a biological individual if and only if it satisfies three clauses:

  1.  **The Bottleneck Clause:** The entity's lineage must pass through a single-unit replicative bottleneck (e.g., a zygote, a single spore, a single infected cell) that resets genetic variation among its parts to near-zero at the start of every generation.
  2.  **The Part-Invability Clause:** The lower-level parts constituting the entity must be physiologically incapable of surviving or reproducing independently *during the normal life cycle of the entity*. (If a part breaks off and founds a new lineage without passing through the Bottleneck Clause, the original entity is a population, not an individual).
  3.  **The Transmission Clause:** The entity must possess a mechanism of transmission to a new environment/host/generation that is distinct from the mere persistence of its parts. (This distinguishes transmissible lineages from somatic lineages).

  **Motivation:**
  *   **Clause 1** solves the "too many replicators" problem. It aligns the fitness of the parts with the fitness of the whole by homogenizing genetics (solving Cases 4, 5, 10).
  *   **Clause 2** solves the "modularity" problem. It distinguishes organisms from colonies where parts are autonomous (solving Cases 1, 2, 3, 11).
  *   **Clause 3** solves the "somatic vs. germline" problem. It distinguishes evolving lineages from transient somatic evolution (solving Cases 6, 7, 8, 9).

  ---

  ### Running the Spec on Your 11 Verdicts

  1.  **Quaking Aspen:** **FAIL.** Fails Clause 2. You noted you can cut a stem and root it. The stem is a viable part that can found a new lineage without a zygotic bottleneck. The "clone" is a population of ramets, not one individual.
  2.  **Branching Coral:** **FAIL.** Fails Clause 2. Fragments break off and survive. Same as Aspen.
  3.  **Portuguese Man o' War:** **PASS.** Zooids are obligately specialized (Clause 2). They originate from a single planula larva (Clause 1).
  4.  **Honeybee Hive:** **PASS.** Queen's egg is the bottleneck (Clause 1). Workers are sterile/dependent (Clause 2). Hive reproduces via swarming (Clause 3). **City/Firm:** **FAIL.** No genetic bottleneck (Clause 1).
  5.  **Dictyostelium:** **PASS (Clonal) / FAIL (Chimera).** Clonal slug meets Clause 1. Chimera fails Clause 1 (mixed lineages = conflict).
  6.  **Conjugative Plasmid:** **PASS.** It has its own transmission bottleneck (conjugation/infection) independent of the host cell division (Clause 3). It is a Darwinian Individual (a replicator), though not an *organism*.
  7.  **Mitochondrion:** **FAIL.** Fails Clause 3. Its transmission is locked to the host's germline bottleneck. It has no independent transmission cycle. It is a part.
  8.  **Colonic Crypt:** **FAIL.** Fails Clause 3. Somatic lineage. Dies with the host. No transmission to a new host.
  9.  **Devil Facial Tumour / HeLa:** **PASS.** Fails Clause 3 for normal cells, but DFTD/HeLa establish a *new* transmission bottleneck (infection or artificial passaging). They become independent lineages.
  10. **Segregation Distorters:** **PASS (as Genes) / FAIL (as Organism).** The gene is the individual here (has transmission advantage). The organism is the "breakdown" because the gene's individuality undermines the organism's Bottleneck Clause (homogeneity).
  11. **Polyembryonic Wasp:** **FAIL.** Fails Clause 2/3. One zygote develops into *multiple* adults that separate. The adults are the individuals; the embryonic cluster is a transient developmental stage, not a persistent individual.

  ---

  ### Running the Spec on Your 4 New Cases

  1.  **Snowflake Yeast Clusters:** **PASS.**
      *   *Reasoning:* They form via clonal division (Clause 1). In the gravity-selection experiment, single cells die; only the cluster survives the selection pressure (Clause 2: parts are inviable without the whole in this context). They reproduce by shedding propagules (Clause 3).
      *   *Stretch:* This is "evolving individuality." The parts *could* live in a different environment, but under the specific selection regime, they meet Clause 2.

  2.  **CRISPR Gene Drive:** **FAIL.**
      *   *Reasoning:* It is a genetic element. It relies entirely on the mosquito's germline bottleneck for transmission. It has no independent transmission cycle (Fails Clause 3). It is a replicator, not an individual. It is analogous to the Segregation Distorter (Case 10).

  3.  **Aphid + Obligate Endosymbiont:** **PASS (as one Holobiont).**
      *   *Reasoning:* They share a strict vertical transmission bottleneck (the egg) (Clause 1). Neither can survive/reproduce without the other (Clause 2). They transmit together (Clause 3).
      *   *Stretch:* This forces you to treat two species as one individual. But under BLPI, they function as a single Darwinian unit. If you separate them, both fail Clause 2.

  4.  **B-cell Clones (Germinal Centre):** **FAIL.**
      *   *Reasoning:* They undergo somatic hypermutation and selection. However, they are somatic. They do not transmit to the next generation (Fails Clause 3). They are analogous to the Colonic Crypt (Case 8).

  ---

  ### The Cheap Loss: Abandon Verdict 1 (Aspen)

  You asked which of your eleven the account cannot save. To make the BLPI spec work without becoming baroque, you must abandon **Verdict 1 (Quaking Aspen = One Individual).**

  **Why this is the cheapest loss:**
  Your verdicts on **1 (Aspen)** and **2 (Coral)** are biologically inconsistent. Both are modular, clonal organisms. Both propagate vegetatively. In both cases, a module (stem/polyp) can detach and found a new lineage without passing through a sexual bottleneck.
  *   If Coral is "not one individual" because its parts are viable (Verdict 2), then Aspen *must* be "not one individual" because its stems are viable (Verdict 1).
  *   Keeping Verdict 1 requires an arbitrary distinction between "stems" and "polyps" or "root systems" and "calcium carbonate." There is no philosophical or biological principle that distinguishes them regarding individuality.
  *   By abandoning Verdict 1, you unify the treatment of all modular clonal organisms. The "Aspen Clone" is a **population of ramets**, not a single organism. The intuition that it is "one tree" is a macroscopic perceptual bias, not a biological reality.

  **How this resolves your pain points:**
  *   **8 vs 9 (Crypt vs. Cancer):** Saved. The distinction is strictly **Transmission (Clause 3)**. Crypts die with the host; Cancer establishes a new transmission lineage.
  *   **6 vs 7 (Plasmid vs. Mito):** Saved. The distinction is strictly **Independent Transmission (Clause 3)**. Plasmids jump hosts (conjugation); Mitochondria are locked in the oocyte.
  *   **4 vs 11 (Hive vs. Wasp):** Saved. The distinction is **Persistence of the Whole (Clause 2/3)**. The Hive persists as a functional unit; the Wasp embryo splits into separate adults.

  **The Cost:**
  You lose the intuition that "a tree is one thing." You gain a principle that cleanly separates somatic evolution from germline evolution, parasites from parts, and organisms from colonies. That is the trade. Take it.
