answer: |-
  That parking ticket comparison is the classic Ramsey critique, and it's designed to shock, but let's look at the inverse. If you set the pure rate to zero, you aren't saying you care *more* about the future; you're saying you care *infinitely* more about them than about yourselves. Over a millennium, even a tiny return on capital compounds to astronomical figures. A zero discount rate implies that every dollar we spend on ourselves today is a theft from the future worth millions of dollars in their terms. It demands we starve ourselves to build a paradise for people who might not even exist. I'm not saying we shouldn't care about year 2400, but moral obligation isn't infinite. A positive pure time preference is simply acknowledging that we have limited duties to distant strangers compared to our contemporaries. And yes, I'll concede that 3% constant over a millennium is probably too rigid—many of us argue for declining discount rates—but the rate cannot be zero without making the present uninhabitable.
