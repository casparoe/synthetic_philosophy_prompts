prompt: |-
  I edit a series of 700-word biographical readings used by secondary-school humanities teachers. We take about six proposals a month, and each receives one decision from a three-person review panel: run as pitched, run with a specified reframing, or reject. The writers are journalists who get roughly two hours among a subject's sources before drafting, so the procedure has to be runnable in that time and has to yield reasons the panel can check rather than tastes it can only vote on.

  The series exists for moral learning from a life rather than for biography as such, and that is where we keep failing. A reading on a celebrated nurse was withdrawn after a teacher pointed out that the incident the whole piece turned on survives only in an admiring life published by her own order. Our house guidance — admire the deed rather than the person, note the flaws briefly, let the reader draw the moral — collapses on the hard cases. Hagiography and Plutarch's practice are both ways of making a life teach: he remarks at the opening of the Life of Alexander that he is writing lives rather than histories, and he reads character off slight acts instead of great ones, then closes most of his pairs with a formal comparison. Neither approach is the same as reporting what happened, and I want the procedure to be explicit about what each can support.

  Please write that procedure: the questions to ask in order, what counts as a sufficient answer to each, where it terminates in a reject, and where it hands the decision back to the panel because the question is one of value rather than fact. It must separate the different uses a life can be put to — evidence for a claim about a trait, object of admiration, template for imitation — and attach the appropriate evidential standard to each; it must handle sources that are admiring or hostile by construction, including cases where the only surviving account is hagiographic, and say what such an account is legitimately evidence of; it must handle subjects whose finest feature and their worst wrong spring from the same disposition; and it must flag every step that is a judgment call wearing a procedural costume.

  Then run it on three proposals: a nineteenth-century factory reformer whose campaign rested on a paternalism he also enforced against his own workers' organizing; a medieval saint known only through a vita of miracles and an edifying death; and a twentieth-century geneticist whose science is sound and who campaigned successfully for compulsory sterilization. The third is the panel's favourite — tell me plainly if the procedure kills it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Editor of a series of 700-word biographical readings for secondary-school humanities.
      *   **Goal:** Moral learning from a life (not biography for biography's sake).
      *   **Constraint:** Writers are journalists with ~2 hours of source access. Procedure must be runnable in that time. Decisions must be checkable (facts/reasons), not just taste.
      *   **Problem:** Current guidance ("admire the deed, note flaws, let reader draw moral") fails on hard cases (e.g., the nurse with hagiographic sources).
      *   **Inspiration:** Plutarch (lives vs. histories, character from slight acts, formal comparison) vs. Reporting.
      *   **Deliverable 1:** A specific *Procedure* (questions in order, sufficient answers, termination points, hand-offs to panel, distinction of uses of a life, handling of biased sources, handling of mixed dispositions, flagging judgment calls).
      *   **Deliverable 2:** Apply the procedure to three specific proposals (Factory Reformer, Medieval Saint, Geneticist).
      *   **Specific Instruction:** Be plain about whether the procedure kills the third proposal (the panel's favorite).

  2.  **Deconstruct the Core Tension:**
      *   *Moral Learning* vs. *Historical Accuracy*.
      *   *Hagiography* (admirative, often unhistorical) vs. *Critical Biography* (balanced, often complex).
      *   *Time Limit* (2 hours research) vs. *Depth Required* for moral nuance.
      *   *Use of Life:* Is the subject a *witness* (evidence of a trait), an *icon* (object of admiration), or a *model* (template for imitation)? Each requires different evidentiary standards.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Make it algorithmic enough for a journalist to follow in 2 hours, but nuanced enough to catch the "nurse" problem.
      *   *Step 1: Define the Moral Claim.* What are we teaching? (Courage? Prudence? Justice?).
      *   *Step 2: Source Audit.* Where does the info come from? (Hagiography? Hostile press? Self-report?).
      *   *Step 3: Categorize the Use.* Is this for Imitation, Admiration, or Evidence?
      *   *Step 4: The Linkage.* Does the evidence support the specific use?
      *   *Step 5: The Complexity Check.* Do the virtue and vice share a root?
      *   *Decision Points:* Reject if the link is broken. Panel decision if the value is debatable.

      *Refining the Steps:*
      *   Need to explicitly handle the "Hagiography" issue. If the only source is admiring, what can it prove? It can prove *how the subject was viewed* or *what values the community held*, but not necessarily *what happened*.
      *   Need to distinguish "Template for Imitation" (high bar) vs. "Object of Admiration" (medium bar) vs. "Evidence of Trait" (variable bar).
      *   Need to flag "Judgment Calls."

      *Drafting the Questions:*
      1.  What is the specific moral proposition?
      2.  What is the provenance of the central anecdote?
      3.  What function does the subject serve?
      4.  Is the virtue/vice separation possible?
      5.  Is the moral lesson dependent on historical fact or narrative truth?

  4.  **Developing the Evidentiary Standards:**
      *   *Template for Imitation:* Requires verified fact. Actionable steps. (High Standard).
      *   *Object of Admiration:* Requires consensus on the *value* of the act, even if details are mythic. (Medium Standard).
      *   *Evidence of Trait/Context:* Can use biased sources if the bias is the point. (Low/Specific Standard).

  5.  **Applying the Procedure to the Three Proposals:**

      *   **Case 1: 19th-Century Factory Reformer.**
          *   *Moral:* Advocacy/Reform.
          *   *Conflict:* Paternalism vs. Workers' Rights.
          *   *Root:* Same disposition (control/care).
          *   *Verdict:* Good for "Complex Moral Reasoning," bad for "Template."
          *   *Procedure Outcome:* Run with Reframing (focus on the tension, not the heroism).

      *   **Case 2: Medieval Saint.**
          *   *Moral:* Piety/Devotion.
          *   *Source:* Vita (Hagiography).
          *   *Problem:* Miracles/Edifying death likely unhistorical.
          *   *Procedure:* Can't be "Evidence of Fact." Can be "Object of Admiration" (of the *tradition*) or "Evidence of Values."
          *   *Verdict:* Reject as standard bio. Run only if reframed as "How the Middle Ages Saw Holiness." If the pitch is "Be like this Saint," it dies.

      *   **Case 3: 20th-Century Geneticist.**
          *   *Moral:* Scientific Integrity? Social Responsibility?
          *   *Conflict:* Sound Science vs. Compulsory Sterilization (eugenics).
          *   *Panel Favorite:* Likely because the science is "sound."
          *   *Procedure:* This is the hard test.
          *   *Analysis:* If the moral lesson is "Follow the data," the sterilization campaign undermines it (data was misused/ethical framework broken). If the lesson is "Science without ethics is dangerous," it works.
          *   *Constraint:* The prompt asks: "tell me plainly if the procedure kills it."
          *   *Prediction:* If the pitch is "Admire the Geneticist," the procedure should kill it because the "worst wrong" (sterilization) violates the baseline human rights required for a secondary school moral template. If the pitch is "Warning," it survives. Given the panel likes it, they probably want to admire the science. The procedure must flag this.
          *   *Decision:* The procedure *should* kill the "Admiration/Template" version. It forces a "Cautionary Tale" reframing. If the writers can't do that in 2 hours, it's a Reject.

  6.  **Refining the Tone:**
      *   Professional, editorial, precise.
      *   Acknowledge the Plutarchian distinction (Lives vs. Histories).
      *   Ensure the "2-hour research" constraint is respected (questions must be answerable quickly).

  7.  **Final Review against Constraints:**
      *   *700 words:* Keep the procedure concise.
      *   *2-hour research:* Questions can't require archive digging.
      *   *Checkable reasons:* Avoid "is this good?" Ask "does source X support claim Y?"
      *   *Flag judgment calls:* Explicitly mark where the journalist must decide.
      *   *Three cases:* Run them through clearly.
      *   *Geneticist:* Be plain about the outcome.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe let the panel decide the Geneticist case.
      *   *Correction:* No, the prompt asks for a procedure that separates fact from value. The *ethics* of sterilization in a secondary school context is a value judgment, but the *contradiction* between "moral exemplar" and "human rights violator" is a procedural check. I need to make sure the procedure forces the "Reframe" or "Reject" on the Geneticist if the pitch is admiration.
      *   *Clarification on Hagiography:* The procedure must state that hagiography is evidence of *reception*, not *action*.
      *   *Clarification on "Same Disposition":* If the virtue and vice are the same root (e.g., certainty), the lesson cannot be "Be Certain." It must be "Navigate Certainty."

  9.  **Final Polish:** Check the voice. It should sound like a senior editor speaking to a team. (Proceed to generate output).

  *(Self-Correction on the Geneticist)*: The prompt says "The third is the panel's favourite." This implies the panel *wants* to run it. My job is to write the procedure that *tests* it. If the procedure is rigorous, it might kill the *pitch* (admiration) but save the *topic* (cautionary). I need to be honest: Does the procedure kill the proposal *as pitched*? Likely yes, if pitched as a hero. I will state that clearly.

  *(Refining the "2-hour" constraint)*: The questions must be answerable by checking standard biographies or encyclopedias, not deep archival work.

  *(Refining "Judgment Calls")*: I need to explicitly label steps like "[JUDGMENT CALL]" so the editor knows where the subjectivity lies.

  Let's assemble the document.cw
answer: |-
  # Editorial Procedure: Moral Biography Series

  **Purpose:** To determine if a life supports a specific moral lesson within the constraints of 700 words and two hours of source verification.
  **Principle:** We write *Lives* (Plutarch), not *Histories* (Thucydides). We seek character, not just chronology. However, character claims require evidentiary support appropriate to the intended use.

  ### Phase 1: The Moral Proposition
  **Question 1:** What is the specific moral claim? (e.g., "Courage requires solitude," not "He was brave.")
  **Sufficient Answer:** A single sentence linking a trait to an outcome or duty.
  **Termination:** If the claim is vague ("He was a good person"), **Reject**.

  ### Phase 2: Source Provenance & Function
  **Question 2:** What is the primary source for the central anecdote supporting the claim?
  **Sufficient Answer:** Citation of source type (e.g., "Self-report," "Contemporary hostile press," "Later hagiography," "Archival memo").
  **Constraint:** If the only source is hagiographic or self-serving, the anecdote cannot support a claim of *historical fact*. It can only support a claim of *reputation* or *community value*.
  **Termination:** If the claim requires historical fact (e.g., "She saved the patient") but the source is hagiographic (e.g., "The Order claims she saved the patient"), **Reject** OR **Reframe** to "How the Order defined salvation."

  ### Phase 3: The Use of the Life
  **Question 3:** How is the student intended to use this life? Select one:
  *   **A. Template for Imitation:** (Do what they did.)
  *   **B. Object of Admiration:** (Value what they valued.)
  *   **C. Evidence of Context:** (Understand how they were seen.)

  **Evidentiary Standards:**
  *   **Template:** Requires verified fact. Actionable steps. No miraculous elements.
  *   **Admiration:** Requires consensus on the *value* of the act, even if details are mythic.
  *   **Evidence:** Requires only that the source exists and is representative.

  **Termination:** If Use is **Template** but Source is **Hagiographic**, **Reject**.

  ### Phase 4: The Root Disposition Check
  **Question 4:** Do the subject's finest feature and their worst wrong spring from the same disposition? (e.g., Certainty led to both discovery and dogma.)
  **Sufficient Answer:** Yes/No with one-sentence explanation.
  **Procedure:**
  *   If **No**: Proceed to Phase 5.
  *   If **Yes**: The moral claim cannot be "Adopt this disposition." It must be "Navigate this disposition."
  **[JUDGMENT CALL]:** Determining if the root is the same requires interpreting motive. If the writer cannot articulate the link without speculation, **Reframe** to focus on the outcome, not the character.

  ### Phase 5: The Value Hand-Off
  **Question 5:** Does the moral claim rely on a value judgment that is contested today? (e.g., Paternalism, Eugenics, Colonial duty.)
  **Sufficient Answer:** Yes/No.
  **Procedure:**
  *   If **No**: Panel decides on quality.
  *   If **Yes**: **Hand Off to Panel.** The procedure cannot resolve contested ethics. The Panel must decide if the text can contextualize the contestation within 700 words.
  **[JUDGMENT CALL]:** Deciding if a value is "contested" is itself a cultural judgment. Default to "Yes" if any major contemporary ethical framework rejects it.

  ***

  # Application to Proposals

  ### 1. The Nineteenth-Century Factory Reformer
  *   **Claim:** "Advocacy requires personal sacrifice."
  *   **Source:** Parliamentary records & worker testimonials (Mixed).
  *   **Use:** Template for Imitation.
  *   **Root Disposition:** Paternalism. (He helped workers by controlling them). **Yes**, virtue and vice share a root.
  *   **Value Check:** Paternalism is contested. **Hand Off to Panel.**
  *   **Verdict:** **Run with Reframing.** The procedure flags the "Root Disposition." You cannot pitch him as a pure hero. The text must explicitly state: "His care manifested as control." The Panel must approve if 700 words allows for this nuance. If the writer insists on pure admiration, **Reject**.

  ### 2. The Medieval Saint
  *   **Claim:** "Faith overcomes physical suffering."
  *   **Source:** *Vita* (Hagiography, written post-mortem by order).
  *   **Use:** Template for Imitation (as pitched).
  *   **Provenance Check:** Source is hagiographic. Miracles are not verified facts.
  *   **Verdict:** **Reject as pitched.**
  *   **Reasoning:** Phase 2 & 3 failure. You cannot use a miracle story as a *Template for Imitation* in a secular humanities context.
  *   **Alternative:** Reframe Use to **Evidence of Context**. Title: "How the Middle Ages Understood Suffering." This survives Phase 2. If the writer refuses to shift from "Be like the Saint" to "Study the Saint's reception," **Reject**.

  ### 3. The Twentieth-Century Geneticist
  *   **Claim:** "Scientific rigor leads to social progress."
  *   **Source:** Peer-reviewed papers & campaign speeches (Verified).
  *   **Use:** Object of Admiration (Panel preference).
  *   **Root Disposition:** Belief in biological determinism. Led to sound science *and* compulsory sterilization. **Yes**, same root.
  *   **Value Check:** Compulsory sterilization is a human rights violation. **Yes**, contested (universally rejected now). **Hand Off to Panel.**
  *   **Verdict:** **The Procedure Kills the Proposal as Pitched.**
  *   **Reasoning:**
      1.  **Phase 4:** The disposition (biological certainty) produced the "worst wrong" (sterilization). You cannot ask students to admire the disposition without endorsing the wrong.
      2.  **Phase 5:** The ethical violation is not merely "contested"; it is a disqualifier for *Admiration* in a secondary-school moral curriculum.
      3.  **Outcome:** To survive, the pitch must change from "Admiration" to "Cautionary Evidence." The moral claim must become: "Scientific rigor without ethical framework endangers society."
      4.  **Plain Truth:** If the Panel wants to run this as a hero story because "the science was sound," they are overriding the procedure. The procedure dictates that a subject who successfully campaigned for human rights violations cannot serve as an *Object of Admiration* or *Template*. It can only serve as a warning. If the writer cannot pivot to a cautionary tale in the draft, it must be **Rejected**.
