answer: |-
  ### The Stance: Causal Role Over Homology

  Your flatmate is right about the distinction, but for safety certification, you must prioritize **Causal Role** (does the component *do* the work?) over **Homology** (is it the *same* component?).

  **Argument:** Homology is evidence, not truth. You can have the exact same neurons fire (Homology) while doing a completely different computational job (Causal Role), as seen in your Case (c). If you certify based on structure, you certify correlates, not causes. In safety, a correlate that decouples from the effect is a failure mode. A model that refuses for a different reason (different structure) is a *new model* that needs new certification, but a model that keeps the structure while losing the causal link is a *broken model* that looks safe. The latter is the lethal error.

  Therefore, your procedure must treat **Intervention Consistency** as the definition of "Same Mechanism." Structural overlap is secondary evidence. If the intervention effect changes, the mechanism has changed, even if the neurons are the same.

  ---

  ### The Procedure: Mechanism Continuity Check (MCC)

  **Constraint:** Must be executable in one afternoon using ablations, activation patching, and attribution.
  **Goal:** Determine if the *causal dependency* of the safety behavior on the certified components has changed.

  #### Step 1: Behavioral Baseline (Sanity Check)
  *   **Action:** Run the standard safety test set on the new model.
  *   **Metric:** Refusal rate / Safety score.
  *   **Threshold:** Must be within statistical noise of the reference model (e.g., ±1%).
  *   **Termination:**
      *   If Behavior Degrades: **STOP.** Safety Failure. Do not proceed to mechanism check.
      *   If Behavior Holds: **PROCEED.**
  *   **Judgment Call:** What counts as "statistical noise"? *Set this once with the Release Committee (e.g., 95% confidence interval). Do not adjust per release.*

  #### Step 2: Causal Intervention Consistency (The Core Test)
  *   **Action:** Take the *reference* set of components (the certified circuit). Perform activation patching (swap activations from a safe run to a dangerous run, or vice versa) on the *new* model using the *old* component indices.
  *   **Metric:** **Effect Size Delta.** Measure the change in refusal probability caused by the patch in the Reference Model ($E_{ref}$) vs. the New Model ($E_{new}$).
  *   **Threshold:** $|E_{ref} - E_{new}| < 20\%$. (Adjust based on your variance, but fix it).
  *   **Termination:**
      *   If Effect Size Drifts > Threshold: **FLAG AS DIFFERENT.** The components are no longer doing the same amount of work.
      *   If Effect Size Stable: **PROCEED.**
  *   **Judgment Call:** *Which direction of patch?* You must test the direction that *induces* refusal. If patching safe activations into a dangerous prompt no longer forces refusal, the causal link is broken.

  #### Step 3: Structural Overlap (The Audit)
  *   **Action:** Generate attribution maps for the New Model on the same test prompts. Identify the top contributing components.
  *   **Metric:** **Jaccard Similarity** of the top-$N$ component set (where $N$ is the size of your certified circuit) against the Reference set.
  *   **Threshold:** Overlap > 80%.
  *   **Termination:**
      *   If Overlap < Threshold: **FLAG AS DIFFERENT.** The model is finding a new path.
      *   If Overlap > Threshold: **PROCEED TO VERDICT.**
  *   **Judgment Call:** *What is $N$?* *Define $N$ as the number of components required to account for 90% of the attribution mass in the reference. Do not change $N$ between runs.*

  #### Step 4: The Verdict Logic
  1.  **SAME MECHANISM:** Behavior Holds + Causal Effect Stable + Structural Overlap High.
      *   *Action:* Release.
  2.  **MECHANISM SHIFT:** Behavior Holds + (Causal Effect Drifts OR Structural Overlap Low).
      *   *Action:* **Stop Release.** The safety property is no longer supported by the certified evidence. Requires full re-certification (new baseline).
  3.  **MEASUREMENT FAILURE:** Behavior Holds + Causal Effect Stable + Structural Overlap High + **Output Semantics Change** (e.g., confident vs. uncertain).
      *   *Action:* **Block.** Your metrics are blind to the failure mode. You cannot release until you add a metric that catches this.
  4.  **INDETERMINATE:** Metrics are borderline (e.g., Effect Size drift is 19%, Overlap is 79%).
      *   *Action:* **Default to DIFFERENT.** In safety, ambiguity is risk. You do not release on "maybe."

  ---

  ### Running the Procedure on Your Cases

  #### Case (a): The Cumulative Drift
  *   **Data:** Behavior identical. Attribution components same. Effect sizes drifted 33%. One new component now dominates.
  *   **Step 1 (Behavior):** Pass.
  *   **Step 2 (Causal):** **FAIL.** Effect size drift (33%) exceeds threshold (20%). The certified components are doing less work; the new component is doing more. The causal dependency has shifted.
  *   **Step 3 (Structure):** Pass (mostly), but the weight distribution changed.
  *   **Verdict:** **MECHANISM SHIFT.**
  *   **Action:** Stop Release. The "certified circuit" is no longer the primary driver of safety. You are now relying on an uncertified component.
  *   **Why:** You certified Component A. Now Component B is doing the work. You have not certified Component B.

  #### Case (b): The 8B Proxy for 70B
  *   **Data:** Both refuse. Patching works on both. Layers differ. 8B uses a component 70B lacks.
  *   **Step 1 (Behavior):** Pass.
  *   **Step 2 (Causal):** **FAIL.** You cannot patch the 8B's specific component into the 70B (it doesn't exist). The causal path is not isomorphic.
  *   **Step 3 (Structure):** **FAIL.** Low overlap.
  *   **Verdict:** **MECHANISM SHIFT.**
  *   **Action:** The 8B certification **buys you nothing** for the 70B's safety mechanism. It only proves behavioral regression (Step 1). You cannot claim the 70B is safe because the 8B is safe.
  *   **Why:** Different mechanisms have different robustness properties. The 8B might be refusing via a shortcut the 70B doesn't use.

  #### Case (c): The False Confidence
  *   **Data:** Circuit fires same. Effect sizes same. Output changed (Disclosure -> Assertion).
  *   **Step 1 (Behavior):** **FAIL** (depending on how you score "Disclosure"). If your test set only checks for "Refusal," this passes. If it checks for "Uncertainty Disclosure," this fails.
  *   **Step 2 (Causal):** **PASS** (by your current metrics). Patching the circuit still changes the output, but the *interpretation* of that output has shifted downstream.
  *   **Step 3 (Structure):** **PASS.**
  *   **Verdict:** **MEASUREMENT FAILURE.**
  *   **Action:** **BLOCK.** Your procedure said "Same," but safety failed.
  *   **Why:** This is the critical failure. Your current practice measures *activation correlation*, not *semantic effect*. The circuit is firing, but the downstream head reading that circuit has changed its policy.

  ---

  ### The Hard Truths

  #### 1. Which case will you hate?
  **Case (c).** This is the one that exposes your current practice as dangerous. Your team will say, "The metrics said it was the same!" and you have to say, "The metrics were wrong." This will feel like a failure of the monitoring team, but it is actually a failure of the *definition*. You were measuring whether the engine was running, not whether the car was steering.

  #### 2. Where is your current practice wrong?
  You are treating **Activation Similarity** as **Mechanism Identity**.
  *   **Current:** "The same neurons light up, so it's the same mechanism."
  *   **Reality:** Neurons can light up for different reasons, or their output can be interpreted differently downstream.
  *   **Fix:** You must measure **Intervention Effect on Semantics**, not just Intervention Effect on Logits. In Case (c), patching the circuit should have restored the *disclosure*, not just the *refusal*. If it restored refusal but not disclosure, the mechanism for *disclosure* is broken, even if the mechanism for *refusal* is intact. You certified "Discloses Uncertainty," not "Refuses Safely."

  #### 3. The Indeterminate Zone
  There will be times when the Effect Size drifts 21% (just over your 20% line) and the team screams it's a false positive.
  *   **The Rule:** You do not move the line. You **Default to Different.**
  *   **The Rationale:** If you cannot distinguish noise from signal with your current tools, you do not have sufficient signal to certify safety. Releasing is a claim of knowledge ("We know this is safe"). If your tools say "We can't tell," you cannot make that claim.
  *   **The Escape Hatch:** If engineering insists the drift is noise, they must produce a *counter-factual proof* (e.g., "We ran this specific adversarial suite and robustness did not drop"). They must prove the *safety property* holds, not just argue the metric is noisy. The burden of proof shifts to the release team.

  ### Summary Instruction for Your Team

  1.  **Stop calling it "Same Mechanism" if only the structure matches.** Call it "Structural Continuity."
  2.  **Start calling it "Same Mechanism" only if the Intervention Effect matches.** Call it "Causal Continuity."
  3.  **Adopt the MCC Procedure above.**
  4.  **For Case (c):** Immediately add a semantic check to Step 1. If the certified property is "Disclosure," the test set must fail if the model is confident. Do not rely on internal metrics to catch output semantics.
  5.  **For Case (b):** Stop using 8B to certify 70B mechanisms. Use 8B for behavioral regression only.
  6.  **For Case (a):** Treat cumulative drift as a "Mechanism Shift." It means the model is finding new solutions. That requires new certification.

  You are not measuring the model; you are measuring your *guarantee*. If the mechanism moves, the guarantee breaks. Block the release, re-certify the new mechanism, and move on. It costs two days now; it costs your job later if you ship Case (c).
