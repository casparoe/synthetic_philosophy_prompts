answer: |-
  This is an excellent summary for a popular book, and your suspicion is well-founded. The author has captured the *logic* of the proof correctly but has glossed over the *philosophical premises* required to make that logic bite. In foundations of physics, the devil is always in the premises.

  Here is a breakdown of the claims, sorted by accuracy, followed by answers to your specific questions. This should give you the vocabulary to push back in your group without needing to derive the theorem on a napkin.

  ### Part 1: Claim-by-Claim Audit

  **1. "Harrigan and Spekkens turned that vague dispute into a precise one."**
  *   **Verdict:** **Accurate.**
  *   **Detail:** Before 2010, "real vs. knowledge" was hand-wavy. Harrigan and Spekkens (2010) defined the **Ontological Models Framework (OMF)**. They posited that a system has some real physical state $\lambda$ (lambda). If distinct quantum states ($\psi$) correspond to disjoint sets of $\lambda$, the model is $\psi$-ontic. If they overlap (the same $\lambda$ is compatible with multiple $\psi$'s), it is $\psi$-epistemic. This formalization is standard and accepted.

  **2. "Pusey, Barrett and Rudolph proved that $\psi$-epistemic models cannot reproduce quantum mechanics, as long as you accept... independent physical states."**
  *   **Verdict:** **Accurate (with caveats).**
  *   **Detail:** This is the core theorem. The caveat is "reproduce quantum mechanics." They proved you cannot have a $\psi$-epistemic model that reproduces *all* the predictions of QM *given* a specific assumption called **Preparation Independence**.

  **3. "The trick: take two qubits... joint measurement... contradiction."**
  *   **Verdict:** **Harmless Simplification.**
  *   **Detail:** The logic you wrote down is the correct intuition for the proof. If $\psi$ is just knowledge, there's a chance the underlying reality ($\lambda$) is the same for $|0\rangle$ and $|+\rangle$. If you prepare two such systems, there's a non-zero chance their combined reality is compatible with all four preparation pairs ($|00\rangle, |0+\rangle, |+0\rangle, |++\rangle$). But QM predicts a measurement exists that rules out all four. If the reality is compatible with all four, but the measurement forbids all four, the model breaks.

  **4. "Assume nothing beyond a mild locality-style independence... wavefunction turns out to be real."**
  *   **Verdict:** **Misleading.**
  *   **Detail:** This is the biggest overstatement. "Preparation Independence" is not quite "locality." It is a causal assumption about how preparation devices relate. It is "mild" only if you assume standard forward-in-time causality. If you allow retrocausality or superdeterminism, it is not mild. Also, proving the wavefunction is "real" ($\psi$-ontic) does not prove it is a *field* or *matter*; it just proves it tracks physical reality rather than just knowledge.

  **5. "That takes QBism off the table... leaves... Everett, Bohm — as the survivors."**
  *   **Verdict:** **Wrong / Misleading.**
  *   **Detail:** PBR does not "kill" QBism. QBism explicitly rejects the **Ontological Models Framework**. PBR says: "If there is a physical state $\lambda$, then $\psi$ must be ontic." QBism says: "There is no observer-independent physical state $\lambda$." Therefore, PBR is irrelevant to QBism, not a refutation of it. Regarding Everett and Bohm: They are indeed $\psi$-ontic, so they survive, but PBR doesn't prove *they* are correct, only that *something* $\psi$-ontic is required (if you accept the framework).

  **6. "Spekkens' toy model... is explicitly $\psi$-epistemic and works fine."**
  *   **Verdict:** **Wrong.**
  *   **Detail:** Your friend is confusing "works fine" with "reproduces all of quantum mechanics." Spekkens' toy model reproduces *many* quantum phenomena (interference, no-cloning, teleportation protocols) using an epistemic view. However, it fails to reproduce the specific statistics required for the PBR theorem (and Bell inequalities). It is a model of *a world that looks like QM in some ways*, not a model of *our world*.

  ---

  ### Part 2: Pinning Down Your Specific Questions

  Here is how to articulate the nuances to your group.

  #### 1. Is "Preparation Independence" just locality? Can we drop it without FTL?
  The book calls it "locality-style," which is a bit loose. **Preparation Independence (PI)** states: If I prepare a system in Lab A and you prepare a system in Lab B, and we coordinate nothing, the joint physical state is just the product of our individual physical states ($\lambda_{AB} = \lambda_A \times \lambda_B$).

  *   **Is it fair?** It feels physically necessary. If independent preparations were secretly correlated, science would be impossible (this is close to "superdeterminism").
  *   **Can you drop it without FTL?** Yes. This is the **retrocausal** escape route.
      *   *How it works:* In standard physics, the past determines the future. PI assumes the preparation $\lambda$ is determined solely by past settings. Retrocausal models (like those proposed by Huw Price or Ken Wharton) suggest the future measurement setting can influence the past preparation state.
      *   *The Consequence:* If the future measurement "reaches back" to correlate the two preparation devices, PI is violated. The systems aren't independent because they share a common future cause. This does not require Faster-Than-Light signaling (you can't send a message), but it requires giving up the idea that the past is fixed independently of the future.
      *   *Bottom Line:* You can save $\psi$-epistemic views by accepting retrocausality. It's a high price, but it doesn't violate relativity.

  #### 2. Does the theorem really kill QBism?
  No. This is a category error in the book's summary.

  *   **The Assumption:** PBR assumes the **Ontological Models Framework**. This framework starts by saying: "There exists a real physical state of the world, $\lambda$, which exists independently of any observer."
  *   **The QBist Response:** QBism (Quantum Bayesianism) denies this starting premise. To a QBist, quantum mechanics is not a description of the world; it is a user's manual for an agent navigating the world. There is no "view from nowhere" state $\lambda$.
  *   **The Logic:** PBR proves: *If* $\lambda$ exists and is independent, *then* $\psi$ is ontic. QBism says: "$\lambda$ does not exist." Therefore, the conclusion doesn't apply.
  *   **Analogy:** Imagine a theorem proving "If cars have wings, they can fly." QBism is like saying "Cars don't have wings." The theorem isn't wrong, but it doesn't apply to actual cars. The author is assuming there *must* be an observer-independent state to begin with, which is exactly what QBism denies.

  #### 3. Does "$\psi$-ontic" settle what the wavefunction is like?
  Absolutely not. This is a common conflation.

  *   **$\psi$-ontic** simply means: "Facts about the wavefunction are facts about the physical world." It does *not* mean the wavefunction is a physical field wiggling in 3D space.
  *   **Bohmian Mechanics:** $\psi$ is ontic, but it lives in **Configuration Space** (a 3N-dimensional abstract space), not 3D space. It guides particles, but it isn't "stuff" in the room.
  *   **Everett (Many Worlds):** $\psi$ is ontic, and it *is* the fundamental reality. But again, it lives in Hilbert Space. The "worlds" emerge from the structure of $\psi$, but $\psi$ itself isn't a field like the electromagnetic field.
  *   **The Takeaway:** PBR forces you to say $\psi$ corresponds to reality, but it leaves the *nature* of that reality (field? law? multiverse?) completely open. You cannot use PBR to argue that $\psi$ is a literal wave in the ether.

  #### 4. Spekkens' Toy Model: Nothing-burger or Counterexample?
  Your friend's argument is the most common objection from non-specialists, but it misses the scope of the theorem.

  *   **The Toy Model:** Spekkens constructed a model where states are knowledge about a hidden variable. It mimics QM beautifully for single systems and some entanglement.
  *   **The Flaw:** It cannot reproduce **contextuality** or the specific statistics of the PBR setup. The PBR theorem relies on the specific geometry of Hilbert Space and the way entangled states behave under joint measurement. The toy model has a different geometry.
  *   **The Response:** Tell your friend: "Spekkens' model proves that $\psi$-epistemic views are *possible* in some universes. PBR proves that $\psi$-epistemic views are *impossible* in **this** universe (assuming Preparation Independence). The toy model fails the PBR test; if you ran the PBR experiment on Spekkens' toy systems, they would not produce the quantum statistics that create the contradiction."

  #### 5. Can your epistemic inclination survive?
  Yes, but you have to choose which bullet to bite. PBR forces a trilemma. To remain $\psi$-epistemic (wavefunction = knowledge), you must reject one of the following:

  1.  **Reject Preparation Independence:** Accept that distinct preparations can be correlated without a common past cause. (Leads to **Retrocausality**).
  2.  **Reject the Ontological Models Framework:** Deny that there is an observer-independent physical state $\lambda$. (Leads to **QBism** or strict **Instrumentalism**).
  3.  **Reject Quantum Mechanics:** Believe QM is an approximation that will be replaced by a deeper theory that *is* $\psi$-epistemic. (Most physicists think this is unlikely given QM's success, but it's logically possible).

  If you want to be a realist (there is a world out there) AND epistemic (wavefunction is knowledge) AND keep standard causality, PBR says you are out of luck. But if you are willing to accept that "reality" might be relational (QBism) or that causality might be symmetric (Retrocausality), the epistemic view is still alive.

  ### Summary for your Group
  When you meet next, here is the script:

  1.  **On the Proof:** "The math in the book is right. If you assume systems prepared separately are physically independent, the wavefunction can't just be knowledge."
  2.  **On QBism:** "But the book is wrong that this kills QBism. QBism doesn't believe in the 'physical state' the theorem requires. It's like proving 'All unicorns have horns' doesn't kill the theory that unicorns don't exist."
  3.  **On Reality:** "PBR proves $\psi$ is 'real' in the sense that it tracks physical facts, but it doesn't prove it's a field in 3D space. It could still be a object in high-dimensional space (Everett/Bohm)."
  4.  **On Spekkens:** "Spekkens' model is a great toy, but it doesn't match our universe's statistics for this specific experiment. It shows epistemic views are *conceivable*, not that they work for *actual* QM."
  5.  **On Your View:** "I'm still epistemic, but PBR tells me I have to pay a price. I either have to accept that the future influences the past (retrocausality) or that the quantum state is purely personal (QBism). I'd rather pay one of those prices than accept the wavefunction is a physical field."

  This position shows you understand the theorem's strength without accepting the author's overstated conclusions.
