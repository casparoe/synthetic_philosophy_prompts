prompt: |-
  So I've been working through a popular book on the foundations of quantum mechanics with a couple of friends — we meet most weeks, whoever's turn it is does the reading and tries to explain it, very informal, nobody in the group does physics for a living though I did a year of QM as an undergrad. Last week's chapter was on whether the wavefunction is a real thing out there or just a way of tracking what we know, and the author spends several pages on the Pusey–Barrett–Rudolph result from 2012. I wrote down the bit that seemed to matter and it went roughly like this:

  "For decades physicists have argued about whether the wavefunction is a physical object in the world or just a convenient package for our ignorance. Harrigan and Spekkens turned that vague dispute into a precise one. Call a model ψ-ontic if the complete physical state of a system fixes exactly which quantum state it's in, and ψ-epistemic if two different quantum states can both be attached to one and the same physical state — the way two different states of knowledge about a coin in a box can describe one and the same physical situation. Then in 2012 Pusey, Barrett and Rudolph proved that ψ-epistemic models cannot reproduce quantum mechanics, as long as you accept that two systems prepared independently of each other really do have independent physical states. The trick: take two qubits, each prepared in either |0⟩ or |+⟩, so there are four possible preparation pairs. There is a joint measurement on the pair with four outcomes, and quantum mechanics assigns probability zero to each outcome for exactly one of those four pairs. But if |0⟩ and |+⟩ overlap, then with nonzero chance both systems end up in a physical state that is compatible with all four pairs at once, and then every outcome is forbidden — yet the detector still has to click. Contradiction. So the quantum state is part of the furniture of the world rather than part of our description of it. The result gets compared to Bell's theorem a lot: assume nothing beyond a mild locality-style independence for separately prepared systems, and the wavefunction turns out to be real. That takes QBism off the table, since QBism says the quantum state is just an agent's personal betting odds, and it leaves the genuinely realist interpretations — Everett, Bohm — as the survivors."

  I'm suspicous of the last third of that, but I can't articulate why, and I don't want to just wave at it in front of my friends. Could you go through it claim by claim and sort it into what someone who actually works on foundations would nod at, what's a harmless pop-book simplification, and what's wrong or actively misleading? A few things I specifically want pinned down. Is that "locality-style independence" gloss on preparation independence fair — and is giving up preparation independence something you can do without letting in faster-than-light influence? I vaguely remember hearing that retrocausal people think they have an escape route and I don't understand how that's supposed to work. Second, does the theorem really kill QBism, or does QBism just decline to play the game the theorem is framed in — and is the author quietly assuming there's some observer-independent physical state to begin with? Third, does "ψ-ontic" actually settle what the wavefunction is like? I assumed the author was smuggling in that it's a real field in ordinary three-dimensional space, but I think Bohmians and Everettians put it somewhere else, and I'm not sure ψ-ontic decides that. Fourth, the friend who did the reading insists that Spekkens' toy model makes the whole thing a nothing-burger, since that model is explicitly ψ-epistemic and works fine — what's the actual response there? And relatedly, how much of the argument depends on that specific two-qubit, four-outcome setup versus something more general? I lean epistemic myself, mostly because multiplying physical structure makes me nervous, so please tell me whether that inclination survives the theorum or whether I should start looking for a different way to be an anti-realist. No need to point me at papers or a bibliography, I just want the reasoning spelled out so I can explain it back to the group.
