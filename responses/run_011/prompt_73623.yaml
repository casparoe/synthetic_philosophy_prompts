  *(Self-Correction on the "Working Together" point)*: I need to be sure. Gibbard's "Manipulation of Voting Schemes: A General Result" was 1973. Satterthwaite's "Strategy-Proofness and Arrow's Conditions" was 1975. They are independent. The passage says "working together." That is definitely wrong.

