      *   *Claim 12:* "...and because it is not a ranked system, the Gibbard–Satterthwaite theorem does not touch it." -> *Technically Right but Misleading.* G-S assumes ordinal inputs. Approval uses cardinal/binary inputs. However, Gibbard (1973) is more general than Satterthwaite. Gibbard's theorem covers *any* deterministic voting system. So Approval *is* subject to Gibbard's theorem (strategy-proofness is impossible). The passage relies on Satterthwaite's specific ordinal constraint to claim immunity, which is a loophole, not immunity.

