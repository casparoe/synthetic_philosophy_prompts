      *   *Claim 6:* "...and a dictatorship is not a voting rule at all..." -> *Debatable/Simplification.* In social choice theory, it *is* a rule, just not a *democratic* one.
      *   *Claim 7:* "...which is why the theorem is so often paraphrased as showing that there is no such thing as a fair way to rank three candidates." -> *Simplification.* "Fair" is vague. "Non-dictatorial and strategy-proof" is precise.
      *   *Claim 8:* "It says nothing whatever about how ballots are counted, and so it applies with full force to first-past-the-post, to runoffs, to instant-runoff voting, and to point systems such as the Borda count." -> *Wrong Reasoning.* The theorem *does* depend on the domain of the function (ordinal rankings). FPTP and Approval aren't ordinal ranking systems in the same way. The theorem applies to *social choice functions* based on *ordinal preferences*. The passage claims it applies because it says nothing about counting, which is backwards. It applies because those systems map profiles to winners, but the *input* assumption matters. Actually, G-S assumes the *voter's true preference* is ordinal. If the voting method doesn't ask for ordinals (like Approval), the theorem's direct application is nuanced.
