answer: |-
  This is one of the sharpest questions in modern international relations theory, and you have correctly identified the exact friction point where international law met operational reality.

  You are wrestling with the gap between **legal constraints** (what the text says) and **operational logic** (what the mission requires).

  Here is the breakdown of why the "regime change fence" wasn't built, followed by an analysis of your sunset trigger proposal.

  ### 1. Why was there a fence against Occupation but not Regime Change?

  It is not actually a binary choice between your two options (Drafting Failure vs. Structural Impossibility). It is a combination of **Legal Definability**, **Political Ambiguity**, and **Operational Inevitability**.

  **A. Legal Definability (Occupation is a term of art; Regime Change is not)**
  "Foreign occupation" has a specific definition in International Humanitarian Law (specifically the Hague Regulations and Geneva Convention IV). It refers to effective control over territory by a hostile army. It is binary and observable: Are there foreign boots on the ground administering civil affairs? Yes or No.
  "Regime change" has no legal definition. Does it mean assassinating the head of state? (Explicitly banned by US Executive Order 12333, but not UN law). Does it mean refusing to negotiate with him? Does it mean recognizing the opposition as the legitimate government (which the UK and France did in July 2011, while the mandate was active)?
  Drafters could ban "occupation" because they knew what it looked like. They could not ban "regime change" because there was no consensus on where "protecting civilians" ends and "toppling the government" begins.

  **B. Political Ambiguity (The price of the vote)**
  Resolution 1973 passed 10-0-5. The five abstainers (Russia, China, Germany, India, Brazil) were deeply skeptical. The proponents (US, UK, France, Lebanon) needed their abstention, not their veto.
  If the resolution had explicitly included a clause saying "This mandate shall not be used to effect regime change," the P3 (US/UK/France) might have balked, as their stated political goal *was* Gaddafi's removal.
  Conversely, if it explicitly *allowed* regime change, Russia and China would have vetoed it.
  The ambiguity was a feature, not a bug. It allowed everyone to sign the text while holding different interpretations of the endgame. Russia and China believed the "Protection" mandate was limited; the P3 believed "Protection" necessitated removing the threat, which was Gaddafi's command structure.

  **C. Operational Inevitability (Your second hypothesis)**
  This is the strongest part of your intuition. In a standard peacekeeping mission, the threat to civilians is usually irregular militias or inter-communal violence. In Libya, the threat to civilians was the **state's monopoly on violence**.
  To "protect civilians" from the Libyan Air Force, you must destroy the Libyan Air Force. To protect Benghazi from the Libyan Army's artillery, you must destroy the Libyan Army's artillery and command nodes.
  Once you degrade the military capacity of the state to the point where it can no longer threaten civilians, you have inherently degraded the regime's ability to govern.
  Therefore, a clause saying "Protect civilians but do not degrade the regime's capacity to wage war" would be a self-contradictory mandate. You cannot neutralize the predator without weakening the pack leader.

  ### 2. The "Betrayal" Narrative
  The reason Russia and China feel "betrayed" isn't just that Gaddafi fell. It's about **interpretive expansion**.
  *   **The Arms Embargo:** Resolution 1970 imposed an arms embargo. 1973 maintained it. However, NATO members argued that providing non-lethal aid or intelligence to rebels fell under "protecting civilians."
  *   **Command and Control:** NATO struck Gaddafi's compound and command centers. They argued these were "capabilities threatening civilians." Russia argued these were political targets unrelated to immediate civilian threats.
  *   **Recognition:** France and UK recognized the Transitional National Council (TNC) as the legitimate government *during* the conflict. This diplomatically cemented regime change while the UN mandate was still active.

  To Moscow and Beijing, this proved that "R2P" is a Trojan Horse. If the mechanism for saving civilians inherently requires breaking the state, then R2P is functionally indistinguishable from regime change. Hence, the Syria vetoes: they decided the only way to prevent another Libya is to block the mandate at the door.

  ### 3. Would a "Sunset Trigger" work?

  Your proposal: *Authorization lapses automatically the moment the threat to the named cities is broken.*

  This sounds elegant, but in practice, it likely fails for three reasons, confirming your suspicion that it just relocates discretion.

  **A. The "Who Decides" Problem**
  You identified this. If the mandate says "lapses when Benghazi is safe," who certifies Benghazi is safe?
  *   **The UNSC?** They move too slowly. By the time they vote to confirm the threat is gone, the tactical window might have closed, or the regime might have regrouped.
  *   **The Commander (NATO)?** This gives the military the power to determine political success. A General might declare victory to exit a quagmire, or prolong the threat to justify budget/operations.
  *   **The Rebels?** They have an incentive to claim the threat *remains* so air support continues.
  *   **The Regime?** They have an incentive to claim the threat is *over* so the bombing stops.

  **B. The Fluidity of Threat**
  In Libya, the threat wasn't static. It moved. If the mandate was tied to Benghazi (the casus belli), does it lapse once Benghazi is secure, even if Gaddafi's forces are then free to march on Misrata or Tripoli?
  If the trigger is too specific ("Threat to Benghazi"), it creates safe zones but allows slaughter elsewhere.
  If the trigger is too general ("Threat to Civilians"), it never lapses until the war is totally over, which brings you back to regime change.

  **C. Moral Hazard**
  If rebels know that international air support depends on the *existence* of a threat to cities, they may adopt tactics that draw fire into civilian areas to keep the mandate alive. Conversely, if they know the mandate ends once they secure a city, they may rush offensives before they are ready, causing more chaos.

  ### Conclusion

  You hit the wall because **the wall is real.**

  The reason there was no fence against regime change is that **in a civil war where the state is the aggressor, effective civilian protection is functionally indistinguishable from weakening the state.**

  Drafting a clause to prevent it would have required either:
  1.  **Self-sabotage:** Mandating protection but forbidding the destruction of the weapons doing the killing.
  2.  **Political impossibility:** Getting the P3 to agree to limit their strategic goals, or getting Russia/China to agree to a mandate they knew would likely topple a sovereign government.

  The "Sunset Trigger" doesn't solve the core issue: **Discretion.** International law relies on states to interpret it. When the intervening powers (NATO) and the skeptical powers (Russia/China) have fundamentally different views on sovereignty vs. human rights, no text is tight enough to prevent "mission creep."

  The legacy of 1973 isn't that the drafters forgot a clause. It's that they proved **R2P cannot be neutrally implemented.** It will always be viewed by the target state (and its allies) as an instrument of regime change, because the logic of protection requires the logic of coercion. Russia and China aren't vetoing Syria because they love Assad; they are vetoing because they believe the *mechanism* itself is compromised.

  You haven't missed a document or a clause. You've identified the structural flaw in coercive humanitarianism.
