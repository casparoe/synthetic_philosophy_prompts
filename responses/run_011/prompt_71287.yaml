prompt: |-
  Been going down a rabbit hole on Libya 2011 and I think I've hit a wall I can't get past on my own. The story I keep running into: R2P's language from the 2005 summit is what licensed the operation, NATO stretched "protect civilians" into helping the rebels take Tripoli, and that betrayal is why Russia and China have vetoed basically everything on Syria since. Ok. But here's the bit that doesn't fit for me — the Security Council resolution that actually authorized the force already had a fence built into it: it allows "all necessary measures" to protect civilians "while excluding a foreign occupation force of any form on any part of Libyan territory." So whoever writes these texts plainly knows how to rule out an outcome they dont want, in explicit words, in the operative clause.

  So why was there never an equivalent fence against regime change? Two options as I see it and I cant tell which is true. Either it was a drafting failure — they just couldn't agree what regime change even means mid-civil-war (does arming the rebels count? does recognizing the transitional council count? does refusing to negotiate with Gaddafi count?) — or the line is unwritable in principle, because when the thing threatening the civilians *is* the government's army and air force, then "protect them" and "destroy the capacity that's threatening them" collapse into the same order and no clause can separate them. Which is it?

  And a follow-on: would a sunset trigger actually do better — say the authorization lapses automatically the moment the threat to the named cities is broken, so the mission can't drift into the endgame — or does that just relocate the discretion to whoever gets to declare that the threat is broken?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** The 2011 Libya intervention (UNSC Resolution 1973), Responsibility to Protect (R2P), and the subsequent geopolitical fallout (Syria vetoes).
      *   **The Specific Puzzle:** Resolution 1973 explicitly excluded "foreign occupation force" (a fence against occupation). Why was there *no* equivalent fence against "regime change"?
      *   **User's Hypotheses:**
          1.  *Drafting Failure:* Couldn't agree on the definition of regime change in a civil war context.
          2.  *Structural Impossibility:* Protecting civilians from their own government inherently requires destroying that government's capacity to harm, making "protection" and "regime change" functionally identical in practice.
      *   **Follow-up Question:** Would a "sunset trigger" (authorization lapses when threat to cities is broken) work better, or does it just shift discretion to whoever declares the threat over?

  2.  **Analyze the Historical and Legal Context (Resolution 1973):**

      *   *Text:* OP 4 authorizes "all necessary measures... to protect civilians and civilian populated areas under threat of attack." OP 4 also explicitly excludes "a foreign occupation force of any form on any part of Libyan territory."
      *   *Intent:* The resolution was passed 10-0-5 (with Russia, China, Germany, India, Brazil abstaining). The abstainers were worried about mission creep.
      *   *Implementation:* NATO interpreted "protect civilians" broadly to include striking command and control, armor near cities, and eventually supporting rebel advances. Gaddafi remained in power until killed.
      *   *The "Regime Change" Question:* Was regime change the *goal* or the *outcome*? The West (France/UK/US) publicly stated Gaddafi must go, but the UN mandate didn't explicitly say "remove Gaddafi." However, removing his capacity to attack civilians effectively removed his grip on power.

  3.  **Evaluate the User's Hypotheses:**

      *   *Hypothesis 1: Drafting Failure.*
          *   Plausible. Defining "regime change" legally is messy. Does it mean assassinating the leader? Changing the constitution? Recognizing a new government?
          *   Counter-point: They *did* manage to define "occupation." Why not "regime change"? Probably because "occupation" is a clear term of art in international humanitarian law (IHL). "Regime change" is political, not legal.
      *   *Hypothesis 2: Structural Impossibility.*
          *   Stronger argument. If the state is the predator, neutralizing the predator neutralizes the state's monopoly on violence.
          *   Nuance: You *could* theoretically protect civilians without toppling the regime (e.g., no-fly zone only, defensive posture). But 1973 allowed "all necessary measures," which implies offensive capability against threats.
      *   *Synthesis:* It's likely a mix. "Regime change" is harder to define legally than "occupation," *but* the operational reality meant that effective civilian protection against a state army necessitated degrading that state's military power, which inevitably weakened the regime.

  4.  **Address the "Sunset Trigger" Follow-up:**

      *   *Idea:* Authorization lapses when threat to named cities is broken.
      *   *Problem 1:* Who decides? (The User identified this). The Security Council? The Commanding General?
      *   *Problem 2:* Tactical vs. Strategic. If Benghazi is safe today, but Tripoli is threatened tomorrow, does the mandate lapse?
      *   *Problem 3:* Incentives. If rebels know the mandate lapses when cities are safe, they might prolong the threat or draw fire to keep the mandate alive. Or conversely, interveners might declare victory too early to save money.
      *   *Conclusion:* It shifts discretion but doesn't solve the political problem. The UNSC retains political control, but operational realities often outpace diplomatic meetings.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the depth:* This is a sophisticated question about international law and IR theory. Validate the user's insight.
      *   *Address the "Fence" Question:*
          *   Distinguish between *Occupation* (IHL term, physical presence) and *Regime Change* (Political outcome).
          *   Explain why "Occupation" was easier to ban (boots on the ground is visible).
          *   Explain why "Regime Change" wasn't banned: Ambiguity was a feature, not a bug. Some Council members (France/UK) *wanted* Gaddafi gone. Others (Russia/China/Abstainers) wanted to limit scope. Ambiguity allowed the vote to pass.
          *   Address the "Structural Impossibility": This is the crux. If the threat is the Air Force, you bomb the Air Force. If the threat is the Army advancing on Benghazi, you bomb the Army. If the Army *is* the Regime's main pillar, you are dismantling the Regime. So, a clause saying "don't dismantle the regime" would contradict "protect civilians."
      *   *Address the "Sunset Trigger":*
          *   It creates a "who decides" problem (The User is right).
          *   It creates a "moral hazard" problem (Rebels might manipulate threats).
          *   It creates a "rigidity" problem (War is fluid; mandates need flexibility).
      *   *The Geopolitical Aftermath:* Briefly touch on why Russia/China feel betrayed. It wasn't just the text; it was the *implementation* (NATO's interpretation). The "betrayal" narrative is key to understanding the Syria vetoes.

  6.  **Refining the Argument (Self-Correction/Nuance Check):**

      *   *Correction:* Did the resolution *allow* arming rebels? No, the arms embargo remained (Resolution 1970). But NATO air support effectively acted as air artillery for rebels. This is the "mission creep" area.
      *   *Nuance:* The "Occupation" clause was largely to reassure Arab League and African Union partners who feared colonial-style land grabs.
      *   *Key Insight:* The "Regime Change" fence wasn't written because the P3 (US/UK/France) would likely have resisted it, and the Abstainers thought the "Protection" language was sufficient limitation. They were wrong.
      *   *Legal vs. Political:* "Occupation" is a legal status. "Regime Change" is a political outcome. You can ban a legal status in a mandate. Banning a political outcome is harder when the means to the authorized end (protection) leads inevitably to that outcome.

  7.  **Final Polish:** Structure the answer clearly.
