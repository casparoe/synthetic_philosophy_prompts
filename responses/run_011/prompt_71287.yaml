  8.  *(Final check against safety guidelines)*: The topic is historical geopolitical analysis. No sensitive personal info, no hate speech, no dangerous instructions. It's a discussion of international relations theory and history. Safe to proceed.

  9.  *(Tone Check)*: Keep it analytical, objective, and respectful of the user's evident knowledge level. Avoid taking sides on whether the intervention was "good" or "bad," focus on the mechanics of the resolution and the consequences.

  **(Self-Correction during drafting):** Make sure to mention that Russia/China *abstained*, they didn't veto 1973. This is crucial because they feel their abstention was exploited. If they had vetoed, the narrative would be different. They let it pass expecting limits, saw those limits stretched, and vowed never to abstain again on similar matters (Syria).

