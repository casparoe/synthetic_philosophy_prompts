prompt: |-
  helping run an undergrad reading group on decision theory and I'm drafting the first handout, which is supposed to be about what we should even be asking of a decision theory before we start arguing over which one wins. Could you write the desiderata list for me? Not the usual intro — everyone in the group has seen Newcomb and Death in Damascus (merchant runs into Death in the Damascus market, Death mentions he has an appointment with the merchant tomorrow in Aleppo, merchant rides all night and dies there, so fleeing is what kills him). What I want is the spec: what any adequate account of one-agent choice under uncertainty has to deliver. Which cases it has to get right and what "get right" even means in each one; which distinctions it must not collapse (I'm thinking of the gap between an act causing a state and an act being evidence for that state, and the gap between what you should do now and what you should have arranged to be disposed to do); which structural principles it's expected to obey — dominance, dynamic consistency, not paying to avoid good news, whatever else you think belongs; and crucially which of those are load-bearing versus which are just house preferences of the causal or the evidential camps. For every requirement give me the case that motivates it, so the students can see why it's on the list instead of taking my word for it.

  Then the bit I actually most want. I made up a variant for the handout and cant yet place it. Say the merchant doesn't know how Death's book works. On one hypothesis the entry was written yesterday and is now fixed, so nothing he does tonight changes where the appointment is and his choice only tells him where he's going to die. On the other hypothesis Death writes the entry after watching, so the merchant's fleeing is precisely what puts the appointment in Aleppo. He has no idea which is true and no way of finding out before he has to move. So: what should a decision theory be required to do when the agent is uncertain about the counterfactual structure itself — give a definite recommendation, represent that higher-order uncertainty explicitly and let the answer swing on it, or license indecision? Whichever requirement you land on, test it against the rest of the list. I have a nagging feeling that demanding a definite recommendation here collides with demanding dynamic consistency, because the merchant both seems like he should pay to learn which book he's dealing with and seems like he shouldn't, depending on how you phrase the choice. Tell me whether that collision is real or whether I'm just confusing myself, and flag any other pair of desiderata you think cant be jointly satisfied — that's the part the handout lives or dies on.

  Format: numbered list, each item one sentence stating the requirement plus one sentence giving its motivating case, then a short section at the end headed "conflicts". Hard cap of 700 words, the thing has to fit on two pages. And please skip the scorecard of causal vs evidential vs functional theories, that's week 3.
