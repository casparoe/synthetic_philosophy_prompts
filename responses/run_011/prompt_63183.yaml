  8.  **Final Polish:** Organize clearly with headings. Ensure the "Load-Bearing" section is distinct. Ensure the "Claim 4 Separate" section is robust. Ensure the "Claim 5 Follows?" section validates the user's intuition.

      *(Self-Correction during drafting)*: I need to be careful not to take a side on the Philosophy of Action as "Truth," but report the state of the field. Davidson is dominant in analytic philosophy, but the hermeneutic tradition (Claim 4's home) is still alive in continental sociology. I must characterize it as "contested" but note the friend is relying on a specific, controversial philosophical stance to make a historical point.

      *(Refining Claim 1)*: The friend says ministers *taught* them to read success as evidence. Weber actually suggests this was a *pastoral consolation* that mutated into an anxiety-driven compulsion. It wasn't a conspiracy. I should highlight this nuance.

      *(Refining Claim 3)*: The friend says Ideal Types *cannot* be confirmed/disconfirmed. Weber says they are tools, but the *causal imputation* using them is subject to empirical rules (adequate causation). This is a crucial distinction.

      *(Refining Claim 5)*: The user's intuition is that the debate is empirical. I need to confirm this. The debate is about *counterfactuals*. "Would capitalism have happened without Protestantism?" That is a meaningful question regardless of the metaphysics of reasons.

  9.  **Final Output Structure:**
