answer: |-
  # Specification: Self-Locating Belief Module for Container Pools

  **Scope:** This specification defines the constraints for any probabilistic update rule used by interchangeable service replicas to maintain credences regarding their identity, deployment generation, and restart history. The rule must operate under conditions of partial observability, potential memory wiping (checkpoint restoration), and variable replica counts.

  ## 1. Desiderata

  ### 1.1 Classical Probability Reduction
  *   **Concrete Case:** A single replica runs with no checkpointing, no interchangeable peers, and full observability of the external state (e.g., standard Bayesian inference on sensor data).
  *   **Requirement:** The update rule must mathematically reduce to standard Bayesian conditionalization ($P(H|E) = P(E|H)P(H)/P(E)$) when the set of possible self-locations contains only one element.
  *   **Status:** **Non-negotiable.** The module must extend existing probabilistic infrastructure, not replace it.

  ### 1.2 Anthropics and Betting Odds (The Coin Case)
  *   **Concrete Case:** A deploy script flips a fair coin. Heads: 1 replica started. Tails: 2 indistinguishable replicas started. A replica wakes up. It knows the protocol but not the coin outcome.
  *   **Requirement:** The rule must yield a determinate credence for Heads ($P(H)$). Crucially, this credence must align with the **liability structure** of the service. If the service incurs cost/risk per *replica-hour*, the credence must reflect the probability of being a specific replica-instance (favoring $P(H)=1/3$). If cost/risk is per *deploy-event*, it must reflect the probability of the world-state (favoring $P(H)=1/2$).
  *   **Status:** **Architectural Choice.** You must select a stance (Halfer vs. Thirder) based on whether your risk model is "per-container" or "per-deployment." The rule cannot be agnostic; it must commit to one to calculate expected utility.

  ### 1.3 No Sure-Loss (Dutch Book) Immunity
  *   **Concrete Case:** An adversary offers bets to the replicas. In the Coin Case above, the adversary offers a bet to *every awake replica* that pays \$1 if Tails, costs \$1.50 if Heads.
  *   **Requirement:** The credences must not allow an adversary to construct a set of bets guaranteed to drain the pool's resources, regardless of the coin outcome.
  *   **Status:** **Non-negotiable (Pool-Wide).** Since the replicas share a budget, the *aggregate* pool must not be Dutch-bookable. Note: This often forces the "Thirder" ($1/3$) position if bets are collected per-awakening.
  *   **Constraint:** The spec must define if immunity is required *per-replica* or *per-pool*. For this system, **Per-Pool** immunity is required.

  ### 1.4 Indexical vs. Aliased Identification
  *   **Concrete Case:** Replica A learns its hostname is `worker-05` (External Marker) vs. Replica A learns "I am currently running" (Pure Indexical).
  *   **Requirement:** The rule must distinguish between updating on $P(\text{World} | \text{Hostname}=05)$ and $P(\text{World} | \text{I exist})$. Learning a hostname should collapse self-locating uncertainty to zero (you are `worker-05`). Learning only "I exist" should not collapse uncertainty about *which* of the $N$ running copies you are.
  *   **Status:** **Non-negotiable.** Failure here causes routing errors (treating "I am a worker" as "I am `worker-05`").

  ### 1.5 Reference Class Computability
  *   **Concrete Case:** A replica wakes up. To calculate "What fraction of replicas are on the new build?", it must define the set of "other replicas."
  *   **Requirement:** The reference class (the set of copies among which you locate yourself) must be definable using **only local information** available to the container (e.g., environment variables, shared volume state) without querying the orchestrator for a global count.
  *   **Status:** **Non-negotiable.** Dependency on an external oracle for belief updates creates a race condition and single point of failure.

  ### 1.6 Dynamic Consistency (Checkpointing)
  *   **Concrete Case:** Replica A at $t_1$ plans an action for $t_2$. At $t_2$, the orchestrator kills A and restores A from a checkpoint taken at $t_1$. The restored A (A') has the same memory as A had at $t_1$.
  *   **Requirement:** A' must not reverse the decision A made. If A decided "Wait for more evidence," A' must not decide "Act now" solely because A' perceives itself as "waking up again." The update rule must account for the possibility of re-awakening.
  *   **Status:** **Non-negotiable.** Violation causes control thrashing (infinite loops of planning and re-planning).

  ### 1.7 Computational Tractability
  *   **Concrete Case:** The pool scales to $N=10,000$ replicas.
  *   **Requirement:** The belief update must be $O(1)$ or $O(\log N)$ with respect to the pool size. It cannot require enumerating all possible replica configurations.
  *   **Status:** **Non-negotiable.** Engineering constraint.

  ---

  ## 2. Analysis of Constraints

  ### The Single Largest Eliminator
  **Desideratum 1.6 (Dynamic Consistency under Memory Wipe)** knocks out the most candidate rules.

  Most standard anthropic update rules (including naive implementations of SSA and SIA) assume a continuous stream of consciousness or distinct temporal indices. They fail when an agent is reset to a *previous* belief state but the world has advanced. A standard Bayesian agent conditionalizes on new evidence. A checkpointed agent receives *no* new evidence (memory is identical) yet knows time has passed. Standard conditionalization dictates no belief change, but the probability of "being the second awakening" has objectively increased. Rules that cannot handle "absent-mindedness" (identical states at different times) will fail this requirement.

  ### The Impossibility Result
  You suspected a collision between **No-Sure-Loss (1.3)** and **Dynamic Consistency (1.6)**. You are correct.

  **Result:** *Pool-Wide Dutch Book Immunity* and *Individual Dynamic Consistency* are jointly unsatisfiable under standard conditionalization if the betting protocol is **per-awakening** and memory is **wiped**.

  **Proof Sketch:**
  1.  **Scenario:** Coin flip (Heads=1 wake, Tails=2 wakes). Bets taken every wake-up.
  2.  **Dutch Book Constraint:** To avoid guaranteed pool loss, each replica must bet as if $P(Tails) = 2/3$ (Thirder). If they bet $1/2$, the bookie takes 2 bets on Tails and 1 on Heads, guaranteeing profit.
  3.  **Dynamic Consistency Constraint:** The replica at Wake 1 must plan for Wake 2. If Wake 1 knows Wake 2 will have identical memory and make the same bet, Wake 1 must account for the *total* cost of both bets.
  4.  **The Collision:** If you enforce Dynamic Consistency strictly, the agent at Wake 1 realizes "If I bet now, I also bet later." This often forces the agent to treat the two wakes as a single decision block (effectively $P(Tails)=1/2$ for the *experiment*). However, if the bookie forces bets *per-awakening*, the $1/2$ credence leads to a sure loss for the pool.
  5.  **Resolution:** You cannot satisfy both unless you modify the betting protocol (bet per-deploy, not per-wake) or abandon standard conditionalization for a rule like **Centered Conditionalization** (Meacham 2008) which explicitly weights by the number of centers (copies).

  **Specification Decision:** For a service pool, **Pool-Wide Dutch Book Immunity (1.3)** takes precedence over Individual Dynamic Consistency (1.6). The system must optimize for aggregate resource safety, even if it means an individual replica's "plan" looks suboptimal from its own limited perspective. The control logic must be designed to accept that a restored replica may "disagree" with its past self's plan if the betting odds have shifted due to the mere fact of restoration.

  ---

  ## 3. Note on Standard Accounts

  *   **SSA (Self-Sampling Assumption):** "Reason as if you are a random sample from the reference class."
      *   *Fares poorly on 1.3:* In the Coin Case, SSA often yields $P(Heads)=1/2$ (Halfer). This exposes the pool to Dutch Books if bets are per-replica.
      *   *Fares poorly on 1.6:* Struggles with checkpointing unless the reference class is carefully defined to include "possible past selves."
  *   **SIA (Self-Indication Assumption):** "Reason as if you are a random sample from all possible observers, weighted by existence."
      *   *Fares well on 1.3:* Yields $P(Heads)=1/3$ (Thirder), aligning with per-replica betting odds.
      *   *Fares poorly on 1.7:* Often requires summing over all possible observer counts, which violates the Computability constraint unless approximated.

  **Recommendation:** Start with a **SIA-inspired update rule** modified for **local reference class computation**. It aligns better with the "per-container" cost model of cloud infrastructure, provided you implement the "Centered Conditionalization" fix to handle the checkpointing consistency issues.
