answer: |-
  This is one of the most difficult and significant tensions in *On Certainty*, and you have identified it precisely. You are wrestling with what is often called the "problem of fluidity." If hinges are the foundation of reason, how can reason change them? And if reason doesn't change them, are they just arbitrary?

  To untangle this, we need to adjust how we view the "process" of change, the nature of "rationality," and the target of Wittgenstein's anti-scepticism.

  ### 1. The Process: Sedimentation, Not Deduction
  You asked what process moves a proposition into or out of the hinge set. The mistake is to look for a *logical* process. We tend to think changes in belief happen like this: "I had belief X, I saw evidence Y, so I logically concluded Z."

  Wittgenstein suggests hinge changes happen more like the shifting of a riverbed: through **historical sedimentation and pragmatic erosion.**

  Consider the proposition "The sun revolves around the earth." For centuries, this was not an empirical hypothesis people tested; it was a hinge. It was part of the scaffolding used to measure time, navigate, and understand scripture. You couldn't "test" it without already assuming a framework of observation that relied on it.
  Over time, new instruments and calculations (Copernicus, Galileo) created a new system of action. Eventually, "The earth revolves around the sun" ceased to be a shocking discovery and became a new hinge—a thing we teach children as a background fact, not a hypothesis they must verify.

  The "driver" of this change is not a single rational assessment that proved the old hinge false (because the old hinge defined what counted as proof). Instead, it is a **gradual shift in what allows us to act successfully.** It is a change in our *techniques* of living.

  ### 2. Avoiding the Dilemma (Reason vs. Whim)
  Your dilemma is: Is the change rational (based on evidence) or causal (blind drift)? Wittgenstein offers a third option: **Pragmatic Necessity within a Form of Life.**

  *   **Why it isn't "Rational Assessment":** To assess evidence, you already need hinges. You cannot use the rules of a game to judge the validity of the board you are playing on. Therefore, the shift isn't a conclusion drawn from premises; it is a transition to a new system of premises.
  *   **Why it isn't "Arbitrary Drift":** It is constrained by the world. If your hinges do not allow you to navigate reality (e.g., if you hinge on "fire does not burn"), you will fail to survive. The "sand" of the riverbed shifts, but it settles where the water flows.

  The "ground" for trusting a hinge is not a proof, but **success in action.** It is not a mood because it is shared and tested by the hardness of the world. If I hinge on "I have two hands," and I try to pick up a cup, the world cooperates. If I hinge on "I have no hands," I cannot explain how I picked up the cup. The constraint is practical, not logical.

  ### 3. Relativity: Person, Community, or World?
  Hinge status is primarily relative to a **Community (a Form of Life), constrained by the World.**

  *   **Not Individual:** A single person cannot maintain a private hinge that contradicts their entire community and still participate in language. If you doubt whether objects persist when you leave the room, while everyone else acts as if they do, you aren't playing a different game; you are incapacitated.
  *   **Not Purely Community (Relativism):** It is not just "what we say." The community is answerable to reality. A community that hinges on "poison is nutritious" will die out.
  *   **The View:** Hinges are the shared inheritance of a community that has found certain propositions indispensable for coping with the world. They are objective in the sense that they are public and world-tested, but they are not "absolute truths" existing outside of human practice.

  ### 4. The Sceptic and Dislodging Hinges
  This is your most pressing worry: If a sceptic can argue a hinge away, do hinges fail to stop scepticism?

  Wittgenstein's answer is that the sceptic cannot dislodge a hinge **in practice**, only in speech.
  The sceptic says, "How do you *know* the world existed five minutes ago?" Wittgenstein replies, "I don't *know* it; I act on it."

  *   **Can arguments dislodge hinges?** Theoretically, yes. Philosophical arguments can make a hinge feel shaky *intellectually*.
  *   **Does this matter?** No. Because the moment the sceptic leaves the study and eats lunch, they rely on the hinge that "food nourishes" and "the kitchen exists."
  *   **Anti-Sceptical Work:** The hinges do not refute the sceptic by proving them wrong. They refute the sceptic by showing that their doubt is **idle.** A doubt that makes no difference to action is not a real doubt; it is a grammatical gesture. The hinge's job is not to be an unbreakable shield against argument, but to be the floor on which argument stands. If the sceptic argues against the floor, they are floating in mid-air.

  The fluidity of hinges does not weaken this. Even if the riverbed shifts, there is *always* a riverbed. The sceptic attacks specific rocks, but Wittgenstein points out that you cannot dig all the way down; you must stop somewhere to dig at all.

  ### Resolution
  The circle you are stuck in comes from expecting hinges to be **justified**. You want to know *why* we are allowed to treat them as certain. Wittgenstein's point is that the question "Why?" stops here. We do not hold them because they are proven; we hold them because without them, the language game of proving and doubting collapses. The shift from hinge to empirical claim (and back) is not a logical error; it is the history of how human beings learn to cope with reality.

  Summary: The puzzle resolves by recognizing that hinge shifts are not driven by evidence or whim, but by the pragmatic evolution of our shared form of life as it interacts with the world.
