answer: |-
  # Mechanism Identity Diagnostic: Taxonomy & Detector Implications
  **Version:** 1.0 (Internal Draft)  
  **Audience:** Interpretability & Engineering Teams  
  **Goal:** Align monitoring thresholds with philosophical commitments regarding "mechanism change."

  ---

  ## Part 1: The Diagnostic Questionnaire
  *Instructions: For each scenario, assume the model's performance on the standard eval set remains within acceptable bounds (e.g., <1% accuracy drop). Indicate whether your monitoring harness **should raise a flag** for human review.*

  **Q1. The Neuron Shuffle (Case 1)**  
  *Scenario:* Continued pretraining permutes which specific neurons implement a known circuit. The counterfactual profile on probes is identical, but the weight vectors occupy different coordinates in the residual stream.  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved)

  **Q2. The Routing Shift (Case 3)**  
  *Scenario:* The internal computation of a feature remains identical, but the output is routed to a different attention head that utilizes the information for a distinct downstream task.  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved)

  **Q3. The Memorization Drift (Case 5)**  
  *Scenario:* On the probe set, the model gets the right answer. Causal tracing shows it has switched from a general algorithm to a memorized lookup path for these specific inputs.  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved)

  **Q4. The CoT Migration (Case 4)**  
  *Scenario:* The logic previously encoded in weights is now explicitly computed in the chain-of-thought text tokens. The weights no longer contain the "circuit" in the same density.  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved)

  **Q5. The Selectivity Broadening (Case 2)**  
  *Scenario:* A feature direction remains stable in the shared basis, but its activation threshold lowers. It now fires on inputs it previously ignored (false positives on the feature level, not necessarily task level).  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved)

  **Q6. The OOD Divergence (Case 6)**  
  *Scenario:* The model is 97% similar on the held-out eval set but fails on a specific distributional shift not covered in the probe set.  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved)

  **Q7. The Continuous Lineage**  
  *Scenario:* The model was trained via continuous fine-tuning from the base checkpoint without catastrophic forgetting, but the function of the circuit has inverted (e.g., now detects negation instead of affirmation).  
  **A:** Flag (Mechanism Changed)  
  **B:** Ignore (Mechanism Preserved because it descended continuously)

  **Q8. The Threshold Question**  
  *Scenario:* You detect a 15% deviation in circuit structure.  
  **A:** Binary Flag (It is either the same or it isn't)  
  **B:** Risk Score (Return a continuous "drift magnitude" metric)

  ---

  ## Part 2: Scoring Key & Detector Specifications
  *Map your answer pattern to the closest position below. This defines what your detector code should actually measure.*

  ### 1. Strict Weight/Neuron Identity
  *   **Pattern:** Q1(A), Q2(A), Q4(A). (Prioritizes physical instantiation).
  *   **Philosophy:** The mechanism *is* the specific parameters. If the weights move, the mechanism is gone.
  *   **Detector Criterion:** Cosine similarity on weight vectors or neuron activation patterns. Threshold: $\cos(\theta) > 0.98$.
  *   **Flags Cases:** 1, 2, 4, 5.
  *   **Silent On:** 6 (unless OOD causes weight shift).
  *   **Risk:** Extremely twitchy. Flags re-seeds and equivalent re-parameterizations.

  ### 2. Informational/Geometric Identity
  *   **Pattern:** Q1(B), Q2(A), Q5(A). (Prioritizes subspace/direction).
  *   **Philosophy:** The mechanism is a direction in activation space. Implementation details (which neurons) don't matter, but the geometry does.
  *   **Detector Criterion:** Subspace overlap (Principal Angles) in the joint dictionary basis.
  *   **Flags Cases:** 2, 5, 6.
  *   **Silent On:** 1 (Shuffles are fine), 4 (If info is in text, geometry might not flag).
  *   **Risk:** Misses cases where computation moves out of the residual stream (e.g., to CoT).

  ### 3. Causal-Role Identity
  *   **Pattern:** Q2(A), Q3(A), Q5(A). (Prioritizes functional graph).
  *   **Philosophy:** The mechanism is defined by its job in the causal graph. Same input $\to$ same internal job $\to$ same output usage.
  *   **Detector Criterion:** Causal graph isomorphism check. Does node $X$ still influence node $Y$ for task $Z$?
  *   **Flags Cases:** 2, 3, 5.
  *   **Silent On:** 1 (Shuffles are fine), 4 (If CoT does the job, role is preserved).
  *   **Risk:** Computationally expensive to trace causal graphs at every checkpoint.

  ### 4. Interventionist Identity
  *   **Pattern:** Q2(A), Q3(A), Q6(A). (Prioritizes counterfactual dependence).
  *   **Philosophy:** Mechanism $M$ exists iff ablating $M$ breaks behavior $B$. If the ablation profile changes, the mechanism changed.
  *   **Detector Criterion:** Ablation match score. Compare behavioral drop when suppressing the candidate circuit in Base vs. Current.
  *   **Flags Cases:** 3, 5, 6.
  *   **Silent On:** 1, 2 (If ablation impact is identical).
  *   **Note:** *Practically indistinguishable from Causal-Role in feedforward pass.* See "Logical Gaps."

  ### 5. Historical/Lineage Identity
  *   **Pattern:** Q7(B). (Prioritizes training trajectory).
  *   **Philosophy:** Mechanism identity is a continuous path through loss landscape. If it didn't break continuity, it's the same mechanism, even if function drifted.
  *   **Detector Criterion:** Trajectory continuity metric (e.g., weight distance per step). No sudden jumps.
  *   **Flags Cases:** None (unless training pipeline breaks).
  *   **Silent On:** 1–6 (Accepts functional drift if continuous).
  *   **Risk:** Useless for safety monitoring. A "continuous" drift to malicious behavior is not flagged.

  ### 6. Deflationary/Behavioral Identity
  *   **Pattern:** Q1(B), Q3(B), Q6(B). (Prioritizes I/O only).
  *   **Philosophy:** "Mechanism" is not a natural kind. Only input-output equivalence is real.
  *   **Detector Criterion:** Eval loss delta on held-out set.
  *   **Flags Cases:** 6 (Only if eval captures OOD).
  *   **Silent On:** 1, 2, 3, 4, 5 (If output is correct).
  *   **Risk:** Misses deceptive alignment or "time-bomb" changes where behavior is currently correct but internals are compromised.

  ### 7. Interest-Relative Identity
  *   **Pattern:** Mixed/Contextual answers.
  *   **Philosophy:** There is no fact of the matter. Identity depends on *why* you are monitoring (e.g., safety vs. performance).
  *   **Detector Criterion:** Configurable multi-metric dashboard. User sets weights for Geometry vs. Behavior vs. Weights.
  *   **Flags Cases:** User-defined.
  *   **Risk:** Analysis paralysis. Requires explicit policy decision on every deployment.

  ### 8. Graded Identity (The "Risk Score" Leaf)
  *   **Pattern:** Q8(B).
  *   **Philosophy:** Identity is not binary. Mechanisms fade or morph.
  *   **Detector Criterion:** Output a drift score $0.0 \to 1.0$. No hard threshold.
  *   **Flags Cases:** All cases contribute to the score.
  *   **Risk:** Engineers hate ambiguity. Requires defining "actionable drift" thresholds later anyway.

  ---

  ## Part 3: Logical Space & Empty Cells
  *Analysis of coherent vs. incoherent positions for engineering spec.*

  | Position | Weight Identity Necessary? | Functional Equivalence Sufficient? | Status |
  | :--- | :--- | :--- | :--- |
  | **Strict Weight** | **Yes** | No | **Coherent.** (Leaf 1) |
  | **Deflationary** | No | **Yes** | **Coherent.** (Leaf 6) |
  | **Hybrid A** | **Yes** | **Yes** | **Incoherent.** If weights are necessary, function alone cannot be sufficient. |
  | **Hybrid B** | No | No | **Coherent.** (Leaf 3/4 - Causal/Interventionist). Requires structural match. |
  | **Lineage Only** | No (Continuous) | No (Can drift) | **Coherent but Risky.** (Leaf 5). |

  ### Indistinguishable Leaves
  **Causal-Role (3) vs. Interventionist (4):**
  *   **Distinction:** *Causal-Role* asks "What job does this node do?" *Interventionist* asks "What breaks if I remove this node?"
  *   **Engineering Reality:** In a deterministic transformer, if the job is the same, the ablation profile is the same. These two leaves will produce identical flags in 99% of production scenarios.
  *   **Recommendation:** Merge these into a single **"Structural-Functional"** detector spec. Do not build separate pipelines for them.

  ### Empty/Unexplored Cells
  **"Weight Identity Necessary but Functional Equivalence Irrelevant"**
  *   **Status:** This is just **Strict Weight Identity**.
  *   **Critique:** Attractive for version control, unattractive for safety. A model can have identical weights on a circuit but have its *output* ignored by downstream layers (Case 3). Strict Weight detectors miss this.

  **"Functional Equivalence Sufficient regardless of Lineage"**
  *   **Status:** This is **Deflationary/Behavioral**.
  *   **Critique:** Safe for performance monitoring, unsafe for mechanism monitoring. Misses Case 5 (Memorization) where behavior is currently fine but generalization is broken.

  ---

  ## Part 4: Implementation Recommendation
  *Based on the team's current friction (Cases 1–6), no single leaf covers all risks.*

  1.  **Adopt Graded Identity (Leaf 8)** as the output format. Do not ship a binary flag.
  2.  **Use a Hybrid Detector:**
      *   **Layer 1 (Geometric):** Monitor subspace overlap (Catches Case 1, 2).
      *   **Layer 2 (Interventionist):** Monitor ablation profiles on probes (Catches Case 3, 5).
      *   **Layer 3 (Behavioral):** Monitor OOD eval loss (Catches Case 6).
  3.  **Policy Decision:** The "Interest-Relative" (Leaf 7) choice must be made by product/safety leadership, not engineering. Define the *cost* of a False Positive (engineer time) vs. False Negative (model failure) to set the aggregation weights for the Graded Score.

  **Final Note on Case 4 (CoT Migration):**
  None of the standard weight-based leaves catch this well. If your model uses CoT, you must add a **Text-Pattern Monitor** to the harness. If the logic moves from weights to text, a weight-monitor *should* flag it as a mechanism loss (Leaf 1 or 2), but a behavioral monitor might miss it. Treat "Logic in Text" as a distinct mechanism class requiring its own detector.
