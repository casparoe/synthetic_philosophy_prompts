answer: |-
  This is a classic "trap" lab, and it's brilliant because it weaponizes student frustration to teach taphonomy. Since you have zero budget and 75 minutes, logistics are your enemy. You need to spend your prep time on the *bags*, not the handouts.

  Here is the plan for **"The Midnight Study Session."**

  ### 1. Materials List (Scroungeable)
  You need **6 identical sets** of two states: *Pristine* and *Disturbed*.
  *   **The Container:** 12 identical brown paper lunch bags or shallow cardboard boxes (one Pristine + one Disturbed per group).
  *   **The Assemblage (per set):**
      *   2 crumpled sheets of lined paper (one with visible writing, one blank).
      *   1 disposable coffee cup (lid on for Pristine; lid off, dried spill for Disturbed).
      *   1 granola bar wrapper (opened).
      *   1 broken pen (cap off).
      *   1 distinctive item (e.g., a specific red candy wrapper).
  *   **The Disturbance Prep:** For the "Disturbed" set, take the exact same items, crush the cup, smear the coffee on the paper, mix the order, and maybe tear the granola wrapper in half. *Crucial:* Take a photo of the Pristine setup for your Ground Truth reveal.
  *   **Paperwork:**
      *   **Field Log Sheet:** Blank box for plan view map + inventory list.
      *   **Interpretation Sheet:** "Based on the material in front of you, reconstruct the 30 minutes prior to deposition."
      *   **Witness Statement:** A printed slip (see below).
      *   **Ground Truth Envelope:** Sealed, containing your photo and the actual story.

  ### 2. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Intro & Setup**
  *   Divide into 6 groups of 3.
  *   Hand out **Pristine Bags** and **Field Log Sheets**.
  *   **Script:** "You are excavating a single context: a dorm bin after a study session. You have 15 minutes to map and inventory. Do not throw anything away. Do not assume anything."

  **00:05 – 00:20 | Phase 1: Recording (The Trap)**
  *   Students map the Pristine Bag. They see neat layers, upright cup, etc.
  *   **TA Action:** Walk around. If a group asks "What does this mean?", say "Record what is there, not what it means."
  *   *At 00:18:* Collect all Pristine Bags. Tell them: "I am securing these in the 'lab' while you move to interpretation."
  *   *The Switch:* You step out (or turn your back) and swap the Pristine Bags for the **Disturbed Bags**. This takes 30 seconds if pre-staged on a cart under the table.

  **00:20 – 00:40 | Phase 2: Interpretation (The Cheat)**
  *   Hand back the bags (now Disturbed). Hand out **Interpretation Sheets**.
  *   **Script:** "Using the material in front of you, write a narrative of the behavior that created this deposit. Who was here? What were they doing? In what order?"
  *   *Note:* They will be interpreting the Disturbed items but referencing the maps they just drew of the Pristine items. Cognitive dissonance will start here ("Wait, I drew the cup on the left, why is it crushed on the right?").
  *   **Concept 1 (Equifinality):** Because the items are now mixed/crushed, Group A might say "Fight broke out," Group B might say "Earthquake," Group C might say "Rushed cleanup." They will confidently pick one.

  **00:40 – 00:50 | Phase 3: The Witness (The Lie)**
  *   Collect the Interpretation Sheets. Hand out the **Witness Statement**.
  *   **Content:** "I, the Room Owner, swear I studied alone, drank one coffee, ate a granola bar, and threw everything in the bin gently before bed."
  *   **Task:** "Compare the Witness Statement to your Interpretation. Does the trash support the testimony?"
  *   **Concept 3 (Rathje):** The trash (especially the disturbed version) suggests chaos/multiple events, but the witness claims order.

  **00:50 – 01:00 | The Reveal (Ground Truth)**
  *   Open the **Ground Truth Envelopes**. Show the photo of the *original* Pristine setup on the projector.
  *   **Script:** "The bags you mapped in Phase 1 were the photo. The bags you interpreted in Phase 2 were *not* the same bags. Between Phase 1 and 2, a 'formation process' occurred."
  *   Let the "Wait, you swapped them?!" reaction happen. Let it sit for 10 seconds.

  **01:00 – 01:15 | Debrief & Theory Mapping**
  *   Map their experience to the concepts (see below).

  ### 3. The Worksheets (What they write)

  **Field Log Sheet:**
  *   **Context ID:** [Group Number]
  *   **Plan View:** [Large empty square]
  *   **Inventory:** [List items, note condition]
  *   **Stratigraphic Note:** "Describe layering or associations."

  **Interpretation Sheet:**
  *   **Hypothesis:** "Describe the behavioral sequence."
  *   **Confidence Level:** (High/Med/Low)
  *   **Anomalies:** "List any items that do not fit your hypothesis."

  **Witness Statement (Handout):**
  *   "I was studying for Intro Archaeology. I had a coffee and a snack. I didn't make a mess. I threw everything away neatly. No one else was in the room."

  ### 4. The Debrief (Mapping Experience to Theory)

  Write these four terms on the board. Ask them to match their frustration to the term.

  1.  **Equifinality (Phase 2):** "Why did Group 1 say 'Fight' and Group 2 say 'Earthquake'?"
      *   *Lesson:* The same static pile (the disturbed bag) supports multiple causal stories. The material underdetermines the behavior.
  2.  **Formation Processes / N-Transforms (The Switch):** "Why did your map not match the object in Phase 2?"
      *   *Lesson:* Natural transforms (or in this case, TA transforms) alter the record *after* deposition. The "Pompeii Premise" (that we are seeing a frozen moment) is false.
  3.  **Middle-Range Reasoning (The Gap):** "How could you have proven the Witness was lying without me?"
      *   *Lesson:* You need independent data (ethnoarchaeology) to link the static (trash) to the dynamic (behavior).
  4.  **The Garbage Project (Phase 3):** "Why did the Witness lie?"
      *   *Lesson:* Refer to Rathje. People self-censor. They report ideal behavior, not actual behavior. The archaeological record is often more honest than the interview.

  ### 5. Troubleshooting: What Goes Wrong

  **Scenario A: One group nails the Ground Truth in 5 minutes.**
  *   *Why:* They noticed the bags weren't sealed, or they recognized your trash.
  *   *Fix:* Do not let them announce it. Pull them aside. Say: "You've solved the puzzle. Now your job is 'Peer Review.' Go to the other groups. Do not tell them the answer. Ask them: 'What evidence rules out [Alternative Theory]?' Force them to strengthen their argument."
  *   *Prevention:* Use trash that doesn't look uniquely yours (remove mail, specific names).

  **Scenario B: A student is genuinely annoyed about the tampering.**
  *   *Why:* They feel their labor (mapping) was wasted.
  *   *Fix:* Validate immediately. "You feel annoyed? Good. Hold onto that. That frustration is exactly what an archaeologist feels when they publish a paper and a post-processualist points out their stratigraphy is mixed. If you felt calm, you wouldn't remember the lesson. The labor wasn't wasted; the *discrepancy* between your map and the object is the actual data."
  *   *Pivot:* Ask them, "If you knew the site was disturbed, how would you have changed your mapping strategy?" (Answer: More detailed notes, photos, recognizing cuts).

  **Scenario C: They don't notice the disturbance.**
  *   *Why:* The Disturbed bags weren't different enough.
  *   *Fix:* During the Reveal, project the "Pristine Photo" next to the "Disturbed Object" on the table. Point to the coffee stain. "You mapped a dry cup. You interpreted a wet one. That is a formation process."

  ### 6. Limitations (What you must supply out loud)

  Be frank with them. This activity *cannot* reproduce:
  1.  **Time Depth:** This happened over 20 minutes, not 200 years. Real chemical decay and soil pressure are missing.
  2.  **Sampling Bias:** They saw 100% of the assemblage. In real archaeology, you only sample trenches. You might have missed the "smoking gun" item entirely.
  3.  **Stakes:** It's trash. If they get it wrong, no one's reputation is ruined. Real archaeology involves interpreting human lives, often without the "Ground Truth" envelope ever existing.

  ### TA Prep Checklist (2 Days Before)
  1.  **Consume the items:** Drink the coffee, eat the bars. Save the trash.
  2.  **Assemble Sets:** Make 6 Pristine sets. Photograph them individually.
  3.  **Create Disturbance:** Make 6 Disturbed sets (crush/stain).
  4.  **Print:** 18 Field Logs, 18 Interpretation Sheets, 18 Witness Statements, 6 Ground Truth photos (or just one for projector).
  5.  **Rehearse the Switch:** Ensure you can swap 6 bags in under 45 seconds without looking suspicious.

  This plan hits your three concepts in order, uses the mechanics you requested, and turns the "cheat" into the primary pedagogical tool. Good luck.
