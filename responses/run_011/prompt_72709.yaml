answer: |-
  **Exam Question: Epistemology Seminar Final**

  **Time Allowed:** 3 Hours
  **Total Marks:** 30

  **Instructions:** Answer the following question on the basis of the material provided in the stem. Do not cite external literature or rely on reconstructions of the paradox not contained herein. Your grade depends on argumentative precision, not historical exegesis.

  **Question Stem:**
  Consider the **Dogmatism Paradox**: An agent knows *p*. The agent knows that if *p* is true, any evidence appearing to show *not-p* is misleading. By closure, the agent knows any such evidence is misleading. From this, it is inferred that the agent is permitted to disregard such evidence without examination.

  Your colleague proposes the **Independence Response**: It is permissible for an agent *S* to disregard a piece of evidence *E* suggesting *not-p* only if *S*'s knowledge that *p* does not depend on *E*. Dependence is understood counterfactually: had *E* been misleading (i.e., *not-p* were true), *S* would not have known *p*. This response aims to save the permissibility of disregarding evidence without collapsing into closed-mindedness.

  You propose the **Cumulative Case**: A research programme knows *p* on the strength of a large body of results. Each individual anomalous result is dispensable; the knowledge rests on the body, not any single study. Dismissing any single anomaly satisfies the Independence Response. However, the programme dismisses one hundred such results in sequence. Each dismissal is locally licensed, yet the programme is left claiming to know *p* on a body of evidence it has itself dismantled. The response is piecewise sound but globally self-defeating.

  **The Task:**
  Write an essay addressing the following:
  1.  Decide whether the Cumulative Case refutes the Independence Response or merely demonstrates that it has been scoped wrongly.
  2.  If you argue it is scoped wrongly, analyze the cost of fixing the scope by indexing independence to the *total body of evidence* rather than individual pieces. Specifically, confront the possibility that this regenerates the paradox at the second order, since an agent who knows *p* thereby knows that her total evidence supports *p*.
  3.  Identify which premise must be rejected to resolve the tension: Closure, the move from knowing to being permitted to disregard, or the thought that knowledge licenses a standing policy rather than a disposition.
  4.  Conclude by determining whether the epidemiologist's original trial (a small, badly powered trial contradicting a settled treatment) is a counterexample to the paradox or an instance of it.

  ***

  **Model Answer**

  The Cumulative Case does not merely show the Independence Response is scoped wrongly; it refutes the Response unless one accepts a scope fix that regenerates the paradox at a higher order. The Independence Response attempts to block dogmatism by tying permission to disregard evidence to the counterfactual independence of knowledge from that evidence. In the Cumulative Case, every individual dismissal satisfies this condition. Knowledge of *p* rests on the aggregate body *B*, not on any single anomalous item *e1, e2... en*. Therefore, dismissing *e1* is permitted. But if dismissing *e1* is permitted, the agent proceeds to assess *e2* relative to the remaining body. If the body is sufficiently large, *e2* is also independent. By induction, the agent may dismiss the entire body of contrary evidence, leaving the claim to know *p* unsupported by any actual evidence they are willing to acknowledge.

  One might attempt to save the Independence Response by shifting the scope. Instead of asking if knowledge depends on *this* piece of evidence, we ask if it depends on the *total available evidence*. If dismissing *E* would leave the total evidence insufficient for knowledge, the dismissal is forbidden. This blocks the cumulative erosion. However, this fix costs us the solution to the original paradox. If I know *p*, I know my total evidence supports *p*. If I encounter evidence *E* suggesting my total evidence does *not* support *p*, the logic of dogmatism reapplies. I know *p*; therefore, I know *E* is misleading (since *E* implies I don't know *p*). By the Independence Response (scoped to total evidence), my knowledge does not depend on *E* (since *E* is false/misleading). Thus, I am permitted to disregard *E*. The paradox returns at the second order: I am permitted to disregard evidence that my evidence is insufficient.

  To resolve this, we must reject a premise. Closure is too central to knowledge to abandon lightly. The move from knowing to being permitted to disregard is the stronger candidate. Knowing *p* entails that contrary evidence is misleading, but it does not entail that one is epistemically permitted to ignore it without review. Knowledge is a state, not a shield against inquiry. However, the deepest error lies in the thought that knowledge licenses a standing policy rather than a disposition. The Independence Response treats permission as a rule applied to types of evidence. If we treat it as a disposition sensitive to the cumulative impact of anomalies, the paradox dissolves. We are permitted to disregard *e1* only if doing so does not trigger a cascade that undermines the basis of knowledge.

  Consequently, the epidemiologist's trial is an instance of the paradox, not a counterexample. Her view relies on the distinction between settled knowledge and noisy data. But if she adopts a standing policy to dismiss all "badly powered" contrary trials without examining their specific power, she risks the Cumulative Case. If enough such trials accumulate, the claim that the treatment works becomes insulated from all empirical check. Her knowledge depends on the absence of a pattern of anomalies, even if it does not depend on any single one. To maintain knowledge, she must treat the anomalies as a collective challenge to the total evidence, not as independent events to be dismissed via a standing rule. The Independence Response fails because it atomizes evidence in a world where justification is holistic.

  ***

  **Marking Scheme**

  **Total Marks:** 30

  **1. Diagnosis of the Cumulative Case (5 Marks)**
  *   **Criteria:** Student must explain how piecewise permission leads to global defeat. Must identify the sorites-like structure where local independence does not guarantee global independence.
  *   **First-Class:** Explicitly notes that the "body of evidence" is dynamically reduced by each dismissal, changing the counterfactual conditions for subsequent items.
  *   **Upper-Second:** Identifies the accumulation problem but treats the body of evidence as static during the sequence.
  *   **Common Botch:** Student merely restates the Cumulative Case from the stem without explaining the mechanism of erosion. (-3 marks)

  **2. Evaluation of the Scope Fix (5 Marks)**
  *   **Criteria:** Student must articulate the proposal to index independence to the *total body of evidence* rather than individual pieces.
  *   **First-Class:** Clearly defines the fix as a constraint on dismissal based on the sufficiency of the remaining total evidence.
  *   **Upper-Second:** Vaguely suggests "looking at the whole picture" without defining the counterfactual dependence on the total set.
  *   **Common Botch:** Student confuses "total evidence" with "all possible evidence" rather than the agent's current holding. (-2 marks)

  **3. Identification of Second-Order Regeneration (5 Marks)**
  *   **Criteria:** Student must demonstrate that the scope fix reimports the paradox. Knowing *p* implies knowing total evidence supports *p*; evidence against the total support is thus disregarded by the same logic.
  *   **First-Class:** Explicitly argues that the dogmatist inference applies to evidence about the evidence base, rendering the scope fix ineffective against radical skepticism.
  *   **Upper-Second:** Notices the scope fix is costly but fails to show *why* it regenerates the paradox, merely asserting it is "circular."
  *   **Common Botch:** Student claims the second-order problem is distinct from the first-order paradox without showing the structural identity. (-5 marks)

  **4. Selection of Premise to Reject (5 Marks)**
  *   **Criteria:** Student must choose between Closure, Permission-to-Disregard, or Policy-vs-Disposition. Must justify the choice based on the previous analysis.
  *   **First-Class:** Selects "Policy vs. Disposition" or "Permission-to-Disregard" and links it directly to the failure of the Independence Response to handle holism.
  *   **Upper-Second:** Selects a premise but offers a generic justification (e.g., "Closure is intuitive") unrelated to the Cumulative Case analysis.
  *   **Common Botch:** Student rejects Closure without acknowledging the cost to logical competence or knowledge transmission. (-3 marks)

  **5. Epidemiologist Verdict (5 Marks)**
  *   **Criteria:** Student must classify the trial as an instance or counterexample and justify this using the essay's conclusion.
  *   **First-Class:** Argues it is an instance because the "standing policy" of dismissal invites the cumulative erosion of the evidence base.
  *   **Upper-Second:** Argues it is a counterexample because the evidence is "badly powered," failing to see this begs the question against the anomalies.
  *   **Common Botch:** Student hedges without committing, or classifies it based on medical ethics rather than epistemic structure. (-4 marks)

  **6. Argumentative Coherence (5 Marks)**
  *   **Criteria:** Essay must flow logically from diagnosis to solution to application. No contradictions between sections.
  *   **First-Class:** The conclusion about the epidemiologist follows necessarily from the premise selection in section 4.
  *   **Upper-Second:** Sections are disjointed; the verdict on the epidemiologist does not reflect the theoretical stance taken earlier.
  *   **Common Botch:** Student introduces new arguments in the conclusion not present in the main body. (-2 marks)

  **Notes on Sophisticated Failures:**
  1.  **The Closure Denial:** A student who simply denies Closure to make the trouble disappear should be marked down in Move 4. This solves the paradox but ignores the instruction to analyze the *cost* of the scope fix and fails to engage with the specific tension of the Independence Response.
  2.  **The Idealization Trap:** A student who treats the paradox as a mere artefact of idealization (e.g., "agents aren't logically omniscient") without saying which idealization does the work should be marked down in Move 1. This dismisses the problem rather than solving it within the stipulated framework.
  3.  **The Contextualist Dodge:** A student who argues "knowledge is context-sensitive" without explaining how context shifts prevent the cumulative dismissal should be marked down in Move 3. This is a named literature move disguised as analysis; it must explain the mechanism of blocking the sorites to gain credit.
