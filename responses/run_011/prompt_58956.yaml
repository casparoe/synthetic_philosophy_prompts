answer: |-
  ### Axis A: Construct Validity
  *How well does the indicator track what we actually care about when we claim that a population's lives are going well?*

  **Tier 1**
  *   **Candidates 1 & 2 (Merged):** Global life evaluation is the gold standard for welfare because it captures the individual's own cognitive assessment of their life as a whole, respecting their autonomy to weigh what matters to them.
  *   **Candidate 6:** Distributionally sensitive measures share the validity of the mean but correct for the moral blind spot of aggregation, ensuring that improvements for the wealthy do not mask stagnation for the poor.

  **Tier 2**
  *   **Candidate 4:** Eudaimonic measures capture meaning and agency which are constitutive of a good life, but the concepts are culturally contingent and often overlap heavily with life evaluation in practice.
  *   **Candidate 5:** Objective dashboards measure the *inputs* and *capabilities* required for a good life rather than the experienced outcome, making them a proxy that can diverge from actual wellbeing.

  **Tier 3**
  *   **Candidate 3:** Affect balance tracks immediate emotional states which are too transient to reflect a life going well over time, missing the narrative evaluation people use to judge their own welfare.
  *   **Candidate 7:** Wellbeing-adjusted life years prioritize health duration over quality and impose a utilitarian calculus that ignores the distribution of wellbeing across the living population.

  ### Axis B: Goodhart Robustness
  *If the government announced this measure as its official target and ministers were rewarded for movements in it, how badly would the number come apart from the underlying thing within fifteen years?*

  **Tier 1**
  *   **Candidates 1 & 2 (Merged):** Independent survey data collected by a statistics office is difficult for line ministries to manipulate directly, insulating the metric from administrative gaming.
  *   **Candidate 6:** Like the mean, this relies on independent survey data, though it risks encouraging ministries to neglect the top 80% of the population to focus exclusively on the threshold group.

  **Tier 2**
  *   **Candidate 5:** Ministries control the administrative data feeding a dashboard, creating high incentives for creative accounting and targetry in sectors like health and education to inflate the aggregate score.
  *   **Candidate 4:** Vague concepts of "meaning" are susceptible to manipulation through state propaganda or cultural campaigns that shift reporting norms without changing material reality.

  **Tier 3**
  *   **Candidate 3:** Daily affect is too volatile and sensitive to transient factors like weather or news cycles, allowing ministers to dismiss poor performance as noise rather than policy failure.
  *   **Candidate 7:** The complex modeling required to calculate life-year weights offers numerous technical assumptions that technocrats can adjust to manufacture progress without real improvement.

  ### Weight Allocation for Composite National Index

  *   **Candidates 1 & 2 (Merged):** 0.50
  *   **Candidate 6:** 0.30
  *   **Candidate 5:** 0.20
  *   **Candidates 3, 4, 7:** 0.00

  **Trade-off Reasoning:** This allocation prioritizes self-reported experience to ensure the target remains anchored in lived reality, while the distributional weight prevents the index from masking inequality and the objective weight grounds the measure against pure sentiment shifts.

  ### Calibration Question

  **0.45**

  **Evidence to Move:** I would move this number **down** if anchoring vignette studies demonstrated that Nordic populations use the 0–10 scale identically to other European nations, or if biological markers of stress (e.g., cortisol, sleep quality) correlated perfectly with the ladder scores across borders. I would move it **up** if longitudinal studies of migrants showed their life evaluation scores instantly converging to the host country's mean regardless of their personal economic circumstances, indicating the score captures cultural norms rather than individual welfare.
