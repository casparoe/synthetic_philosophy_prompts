      *   **Specific Scenario:** A referendum open to *all* adult residents (including non-citizens) on whether long-term resident non-citizens should be admitted to the electorate for *future* referendums.
      *   **Tasks:**
          1.  Explain Sieyès's reasoning on this proposal.
          2.  Address whether holding the vote is an exercise of constituent power or an abdication.
          3.  Address what a negative result would settle.
          4.  Extend reasoning to two anachronistic questions:
              *   Can a constitutional court invalidate the referendum (bind the nation)?
