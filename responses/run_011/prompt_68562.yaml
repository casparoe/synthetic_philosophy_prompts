      *   **Conclusion:** Summarize the tension between his radical sovereignty and the stability he sought.

  10. **Final Polish:** Check tone. Ensure it's analytical, not judgmental, but honest about the "recoil" points as requested. Ensure the distinction between Active/Passive is clear. Ensure the distinction between Constituent/Constituted is clear.

