      *   *Constituent Power:* The power to make the constitution. Belongs *only* to the Nation.
      *   *Constituted Power:* The government/legislature. Created by the constitution. Limited by it.
      *   *Active vs. Passive Citizens:* Active citizens participate in public power (voting/office). Passive citizens enjoy civil rights but don't shape public power. This distinction is pragmatic, based on "stake" (property/taxes), but ultimately decided by the Nation. The Nation doesn't owe justification to the excluded.
      *   *Representation:* The Nation is too large to act directly; it acts through extraordinary representatives (for constitution-making) or ordinary representatives (for legislation). Direct democracy is generally suspect for large nations, *but* the prompt posits a referendum. I need to treat the referendum as the mechanism provided in this hypothetical.
      *   *Validity:* No procedure can invalidate the Nation's will. There is no higher appeal.

  3.  **Task 1 & 2: The Referendum Proposal (Constituent vs. Abdication):**
      *   *The Proposal:* Let everyone (including non-citizens) vote on expanding the electorate.
      *   *Sieyès's View:* Who decides who belongs to the Nation/political body? The Nation itself (via active citizens).
      *   *The Paradox:* If you let non-citizens vote on who gets to vote, you are allowing the "outside" to define the "inside."
      *   *Constituent Power:* This is a fundamental question of political existence (who constitutes the body politic?). Therefore, it is an act of *constituent power*.
      *   *Abdication?* If the current active citizens (the Nation's current agents) allow non-members to decide the boundaries of membership, are they giving away the keys? Yes. For Sieyès, the Nation is a unitary will. Allowing those outside the legal order of the Nation to shape that order is an abdication of the constituent power. The Nation defines itself; it is not defined by residents who lack the political bond.
      *   *Nuance:* However, if the *Nation* (via active citizens) decides to hold this vote, is it valid? Yes, because the Nation can do what it wants. But logically, it's incoherent to let the "passive" (or aliens) determine the status of the "active." It treats the political right as a civil benefit rather than a function of the national will.

  4.  **Task 3: What does a Negative Result Settle?**
      *   If the vote says "No" (don't admit non-citizens):
      *   For Sieyès, this confirms the boundary. The Nation has spoken.
      *   Does it settle the *justice* of the exclusion? No, because justice is what the Nation wills.
      *   Does it settle the *permanence*? No, the Nation can change its mind tomorrow. But for now, the exclusion is absolute.
      *   Crucially, a negative result reaffirms that the *active citizens* remain the sole arbiters of the polity. It settles that the non-citizens remain in the realm of civil protection, not political right.

  5.  **Task 4: Anachronistic Question 1 (Constitutional Court):**
      *   *Scenario:* Court says the referendum was procedurally invalid.
      *   *Sieyès's Framework:* The Nation is above the constitution. The Court is a *constituted* power.
      *   *Conclusion:* The Court cannot bind the Nation. If the Nation (in its constituent capacity) speaks, no procedural rule made by a prior constitution can stop it.
      *   *The Recoil:* Sieyès believed in representation, not direct plebiscites (he feared mob rule). He might actually *like* a court stopping a chaotic direct vote. *However*, the prompt asks where his *framework* commits him, even if he'd recoil. His framework says Constituent Power > Constituted Power. If the referendum is an act of the Nation's will, the Court is null.
      *   *Refinement:* Wait, would Sieyès view a referendum as the Nation acting? He preferred extraordinary representative assemblies for constituent power. But if we accept the referendum *as* the voice of the Nation (as the prompt implies), then the Court is subordinate.
      *   *The "Recoil" point:* Sieyès was an elitist liberal. He might recoil at the idea that a raw headcount of residents (even if filtered) overrides procedural law. But strictly speaking, his theory of *pouvoir constituant* makes the Nation's will absolute. If the Court blocks the Nation, the Court is usurping sovereignty.
      *   *Actually, the bigger recoil:* If the framework implies the Nation can act *directly* without representation, Sieyès would hate that. But assuming the vote happens, the Court cannot stop it.
      *   *Wait, let's look closer:* If the Court says it's invalid, Sieyès's theory says the Court is wrong *if* the Nation truly willed it. But how do we know the Nation willed it? Through proper representation. A referendum is tricky for Sieyès. But if we treat the referendum as the mechanism of the National Will, the Court is subordinate.
      *   *The specific recoil:* He would recoil at the idea that the "Nation" is speaking through a simple referendum including non-citizens (as discussed above). But on the specific question of the Court binding the Nation: His framework says **No**. The Court cannot bind the constituent power. He might recoil at the *consequence* (mob rule), but the logic holds: The Nation is unlimited.

  6.  **Task 5: Anachronistic Question 2 (The Unborn):**
      *   *Scenario:* Do interests of future generations bind the constituent power?
      *   *Sieyès's Framework:* The Nation is a present entity. "One generation cannot bind another." (This is a standard revolutionary principle, aligned with Jefferson and Sieyès).
      *   *Conclusion:* The unborn have no standing. The current Nation cannot be bound by the past, nor does it owe the future. The constitution is not an eternal contract.
      *   *The Recoil:* This leads to potential tyranny of the present. Ecological destruction, debt, etc. Sieyès would likely recoil at the *irresponsibility*, but his theory of the Nation as a unitary, present will commits him to the conclusion that the unborn have no claim against the constituent power. The Nation is always free to remake itself.

  7.  **Drafting the Argument (Iterative refinement):**

