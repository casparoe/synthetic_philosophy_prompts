      *   *The Referendum:* Analyze the inclusion of non-citizens. For Sieyès, political rights are not human rights; they are national rights. Letting non-members vote on membership is category error. It turns the constitution (fundamental law) into a contract among residents.
      *   *Constituent vs. Abdication:* It is an abdication. Why? Because the definition of the body politic is the *first* act of constituent power. Delegating that definition to those outside the body is surrendering the sovereignty.
      *   *Negative Result:* It settles nothing regarding "rights" of the excluded, only the fact of exclusion. It reaffirms the active citizens' monopoly.
      *   *Constitutional Court:* The Court is constituted power. It cannot limit constituent power. If the Nation speaks, the Court is silent. *Recoil:* Sieyès feared anarchy. A court checking a volatile referendum might appeal to his desire for order, but his *theory* forbids it.
      *   *The Unborn:* The Nation is the living. The dead and unborn have no will. The present Nation is absolute. *Recoil:* This implies the present can mortgage the future entirely. Sieyès, a man of law and order, might find the instability troubling, but the logic is inescapable.

  8.  **Refining the "Recoil" Constraint:**
      *   I need to be careful not to attribute modern values to Sieyès.
      *   *Recoil 1 (Court):* Sieyès distrusted direct democracy. He wanted representation. If the referendum is treated as "The Nation," he might recoil at the *method*, but if forced to choose between the Nation's Will and a Court, he must choose the Nation. The recoil is that his theory empowers the very mob he feared if they claim to be the "Nation."
      *   *Recoil 2 (Unborn):* Sieyès believed in progress and rational law. Binding the future is irrational, but *ignoring* the future's existence entirely leads to ruin. He would recoil at the notion that the Nation has no duty to perpetuate itself beyond the immediate will. But his "one generation cannot bind another" principle is explicit.

      *   *Wait, a sharper recoil on the Referendum:* The prompt asks about a referendum open to *non-citizens*. Sieyès distinguishes Active/Passive. Non-citizens aren't even Passive Citizens (they are aliens). Letting aliens vote on the constitution is not just abdication; it is the dissolution of the Nation. If the Nation is defined by a common will/law, those not under that law cannot shape it.
      *   *The "Recoil" on the Court:* If the Court blocks the vote, Sieyès's theory says the Court is usurping the Nation. But Sieyès *created* the concept of the Constitutional Jury (in his later writings). He wanted a guardian of the constitution. However, that guardian guards the *constituted* order against the government, not the *constituent* power against the people. If the vote is Constituent, the Jury stands down.
      *   *The "Recoil" on the Unborn:* This is the strongest point. Sieyès's radical presentism means the Nation can effectively suicide or destroy its conditions of existence. He would recoil at the idea that the Nation has no obligation to its own continuity.

  9.  **Structuring the Response:**
