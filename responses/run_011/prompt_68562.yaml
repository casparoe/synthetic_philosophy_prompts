answer: |-
  To understand how Sieyès would reason through this proposal, we must begin with his foundational axiom: the Nation is prior to everything. It is the source of all law, yet it is not bound by any. The Nation's will is always legal; indeed, it is the law itself. From this flows his distinction between *constituent power* (the power to establish the political order) and *constituted power* (the institutions created by that order), as well as his pragmatic, unapologetic division between active and passive citizens.

  ### The Referendum: Exercise or Abdication?

  Sieyès would view the proposal—a referendum open to all adult residents, including non-citizens, on expanding the electorate—as a category error that amounts to an **abdication of constituent power**, even if enacted by the current active citizenry.

  For Sieyès, the first and most fundamental act of constituent power is not writing articles of governance, but defining the body that possesses the power. Who belongs to the Nation? Who is an active citizen? This is not a question of natural right or human residency; it is a question of political existence. The Nation is a unitary will, distinct from the mere aggregate of individuals living on the soil. By allowing non-citizens (aliens, in his terminology) to vote on the boundaries of the electorate, the current active citizens are treating political membership as a civil benefit accessible to residents, rather than a function of the national will.

  If the active citizens authorize this vote, they are technically exercising their will, but they are doing so in a way that dissolves the logic of their own authority. They are inviting those outside the political bond to determine the terms of the bond. For Sieyès, this is an abdication because it suggests the Nation's boundaries are determined by something external to the Nation (e.g., mere residence or universal moral claim) rather than by the Nation's own self-definition. The Nation defines itself; it is not defined by its guests. To let the "passive" (or the alien) determine the status of the "active" is to invert the hierarchy of the political order. It treats the constitution not as the creation of a specific political will, but as a contract among inhabitants.

  ### What a Negative Result Settles

  If the referendum yields a negative result (non-citizens are not admitted to the electorate), Sieyès would argue this settles **the fact of exclusion, but not the justice of it.**

  Because the Nation's will cannot be invalid, a negative vote makes the exclusion absolute. There is no higher court of appeal for the excluded non-citizens. However, this result does not settle that the exclusion is "right" in a moral sense independent of the Nation's will. For Sieyès, there is no such thing as political right outside the Nation. Therefore, the negative result settles that the non-citizens remain in the realm of civil protection (passive status) without access to public power. It reaffirms that the active citizens remain the sole arbiters of the polity. It does not, however, bind the Nation forever; the Nation could will differently tomorrow. But for the present moment, the exclusion is legally unassailable because the source of law has spoken.

  ### The Constitutional Court and the Nation

  Here we move to a question Sieyès could not have fully anticipated, though he sketched the idea of a "Constitutional Jury." Suppose a constitutional court rules the referendum procedurally invalid (perhaps because non-citizens were allowed to vote, or because a simple majority was insufficient for such a change). Can this bind the Nation?

  **Sieyès's framework commits him to the conclusion that the Court cannot bind the Nation.**

  The Court is a *constituted* power. It exists only because the constitution created it. The referendum, in this scenario, is an attempt to exercise *constituent power* (redefining the electorate is a fundamental reordering of the political body). The constituent power is unlimited and prior to the constitution. Therefore, no procedural rule established by a prior constitution can invalidate the current will of the Nation. If the Nation speaks, the Court must be silent. To allow the Court to invalidate the referendum is to allow the creature to judge the creator.

  **The Recoil:** This is where Sieyès would recoil from his own framework. Sieyès was not a Jacobin; he feared mob rule and anarchy. He sought a representative system to filter and refine the national will, not to be overridden by a raw plebiscite. He would likely be horrified by the idea that a direct vote, potentially swayed by passion or temporary interest, could override procedural safeguards designed to ensure stability. Yet, his theory of sovereignty leaves him no escape. If the referendum is accepted as the voice of the Nation, his logic demands the Court stand down. He would recoil at the realization that his radical theory of constituent power renders his own institutional safeguards (like a Constitutional Jury) powerless against the very sovereignty they are meant to serve. He championed a sovereignty so absolute it threatens the order he sought to build.

  ### The Interests of the Unborn

  Finally, do the interests of people not yet born fall inside or outside the constituent power?

  **Sieyès's framework places the unborn entirely outside the constituent power.**

  Sieyès adhered to the revolutionary principle that "one generation cannot bind another." The Nation is a present entity, a living will. The dead have no will, and the unborn have no existence. The constituent power belongs to the living Nation alone. To claim that the unborn have interests that bind the current Nation is to impose a will from outside the present political body. It is to allow a fiction (the future) to constrain the reality (the present will). Therefore, the current Nation can mortgage the future, deplete resources, or alter the constitution in ways that might make the future uninhabitable, without violating any political right. The future Nation will have its own constituent power to deal with the mess, or to cease existing.

  **The Recoil:** This is perhaps the starkest point of tension. Sieyès was a man of the Enlightenment who believed in progress and rational administration. He would recoil at the conclusion that his theory permits the present Nation to act with suicidal irresponsibility toward its own continuity. His framework implies that the Nation has no duty of self-preservation beyond the immediate will of its current members. While he would argue the Nation *would* rationally choose to preserve itself, his theory provides no *legal* or *constitutional* barrier against a present will that chooses otherwise. He would recoil at the idea that the "Nation" is a transient consumer of history rather than a perpetual trust, yet his definition of the Nation as a unitary, present will commits him to exactly that.

  ### Summary

  Sieyès's reasoning remains ruthlessly consistent: the Nation is the alpha and omega. Including non-citizens in defining the Nation is an abdication of the Nation's self-constituting right. A negative vote settles the exclusion by force of will, not justice. A constitutional court cannot stop the Nation, rendering institutional checks fragile against sovereignty. And the unborn have no claim on the living.

  The recoil lies in the instability this produces. Sieyès wanted a liberal order protected by representation and law. But his own theory of the boundary problem—that the Nation's will is the only boundary, and it recognizes none—undermines the stability of that order. It empowers the present will to the point of tyranny over the future and renders procedural justice subordinate to the raw fact of political existence. He would recoil at the anarchic potential of his own sovereignty, but he could not, within his system, deny it.
