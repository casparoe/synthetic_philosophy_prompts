      *   **Core Thesis:** All true reason statements are internal. An external reason statement (A has a reason to $\phi$ even if no element of A's subjective motivational set (S) would be served by $\phi$) is false.
      *   **The Internal Reason Statement:** "A has a reason to $\phi$" is true iff A has some element in S (desire, project, loyalty, etc.) that would be served by $\phi$-ing, *via a sound deliberative route* from S to $\phi$.
      *   **Deliberation:** Includes means-end reasoning, but also considering constitutive means, weighing elements of S against each other, and imagining outcomes.
      *   **External Reasons:** Williams argues they are false, not just meaningless. They fail to explain action.
      *   **Reproach/Criticism:** If an agent fails to $\phi$, we can criticize them internally if they *would* have been motivated had they deliberated soundly from their actual S. If no sound route exists, there is no internal reason, and thus no reason-based reproach (though we might try to change their S).
      *   **Internalism vs. Externalism (Metaethical):** Williams is an internalist about reasons. He is *not* necessarily a judgment internalist in the sense that "sincere judgment carries its own motivation." He thinks motivation comes from S, not from the judgment itself. The judgment tracks the relation between S and action.

