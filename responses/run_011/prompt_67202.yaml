answer: |-
  # PREP SHEET: COLLECTIONS & METADATA COMMITTEE VOTE

  ## I. STRATEGIC CONCESSIONS (First 5 Minutes)
  *Deliver these before the Q&A to inoculate against the strongest attacks and signal you are not a radical ignoring reality.*

  1.  **The "Deeper Silence" Concession:** State clearly that retroactive description cannot recover records never created. If a community was excluded from the power to generate records, better cataloging does not create those records. This neutralizes the Historian (who knows this) and the Grad Student (who suspects you claim to fix everything).
  2.  **The "Interoperability" Concession:** Acknowledge that we will not abandon LCSH or EAC-CPF entirely. We are proposing *local* overrides and parallel fields, not a unilateral exit from the shared ecosystem. This reassures the Metadata Specialists that you aren't burning the bridge to OCLC.
  3.  **The "Resource" Concession:** Admit this cannot be done retrospectively to 100% of the backlog immediately. Propose a pilot on specific high-impact collections. This disarms the argument that you are bankrupting the unit.

  ## II. THE KILL QUESTION
  *If you fail here, the proposal dies.*

  **The Objection:** **Metadata Interoperability & Systemic Integrity.**
  **From:** Senior Metadata Specialists.
  **The Gist:** "If we decouple local description from national authority files, our records stop harvesting correctly to union catalogs. We become an island. You are trading discoverability *within* our walls for discoverability *outside* them."
  **Why it Kills:** If the library loses visibility in world-wide searches, the administration will veto the plan regardless of social merit.
  **Your Defense:** Argue that "discoverability" is currently illusory for marginalized groups because the standard terms don't match user queries. We are trading *system* interoperability for *semantic* interoperability.
  **Risk:** You are assuming the search algorithms of aggregators will weight your local fields heavily enough to matter. They might not.

  ## III. THE "HOPE NOBODY ASKS" QUESTION
  *The question your framework cannot answer.*

  **The Question:** "Why is the authority to describe still vested in the institution rather than the community? You are inviting us to speak, but you retain the right to edit, format, and publish. Isn't this just a more sophisticated form of gatekeeping?"
  **Likely Source:** The Graduate Student (non-voter), but it will resonate with the Historian and potentially the Metadata Specialists.
  **The Least Dishonest Response:** "You are right. This is not a transfer of power, it is a reform of procedure. True community control requires infrastructure we do not currently have. This proposal is a bridge, not a destination. It acknowledges that until we can resource community-led archives directly, we have an ethical duty to minimize the harm our current gatekeeping causes."
  **Why it's honest:** It admits the proposal is liberal reform, not structural revolution.

  ---

  ## IV. TEN OBJECTIONS (RANKED BY DAMAGE POTENTIAL)

  ### 1. The "Defamation & Liability" Objection
  *   **Objector:** General Counsel Liaison.
  *   **Register:** Legal/Compliance.
  *   **The Objection:** "By actively rewriting descriptions to label historical actors with terms like 'slaveholder' or 'segregationist' where the original creator used euphemisms, we are moving from neutral description to adjudication. If a descendant sues for defamation or character assassination, the university's indemnity does not cover intentional reinterpretation. We are assuming liability we cannot insure."
  *   **Reply:** "We are not adjudicating guilt; we are aligning description with established historical fact, which is a core library function. We rely on verifiable external sources for these amendments, not internal opinion. The liability of *misleading* users through omission is a reputational risk we already carry. We will establish a review workflow for sensitive terms involving living descendants."
  *   **Soft Spot:** You are assuming "historical fact" is legally defensible in a defamation context regarding deceased persons' reputations, which varies by jurisdiction.
  *   **Status:** **Contested.** Legal precedents on archival description and defamation are sparse. You are taking a side on risk tolerance.

  ### 2. The "Broken Harvesting" Objection
  *   **Objector:** Senior Metadata Specialist A.
  *   **Register:** Systems/Interoperability.
  *   **The Objection:** "OAI-PMH harvesters and union catalogs map to specific MARC fields and LCSH headings. If we put community terms in the authorized field, we break the link. If we put them in a note, they aren't searchable. You are proposing we optimize for local ethics at the expense of global discoverability."
  *   **Reply:** "Current global discoverability is already broken for these groups because the standard vocabulary excludes them. We will use the 655 $i (Index Term) or local subfields that are harvestable but distinct. We accept a temporary friction in harvesting to gain actual findability for the users who need these records most."
  *   **Soft Spot:** You are assuming aggregators will index the non-standard fields you plan to use. They often strip them.
  *   **Status:** **Settled Practice (mostly).** Standard practice is strict adherence to LCSH for harvesting. You are proposing an override. Acknowledge this plainly.

  ### 3. The "Provenance & Context" Objection
  *   **Objector:** University Archivist.
  *   **Register:** Archival Theory.
  *   **The Objection:** "This violates *respect des fonds*. The finding aid reflects the creator's organization and worldview. When you sanitize or update the language, you obscure the power dynamics of the record's creation. You are making the archive look more progressive than the creator was, which is historical falsification."
  *   **Reply:** "We are not changing the records, only the access tools. The finding aid is not the record; it is a key to the lock. A key that is rusted shut helps no one. We will retain the original language in a 'Historical Note' to preserve the context of creation while ensuring the door can be opened."
  *   **Soft Spot:** You are relying on a distinction between "record" and "finding aid" that some theorists argue is porous. The finding aid *becomes* the context for many users.
  *   **Status:** **Contested.** This is the central theoretical debate in modern archival science (DACS vs. Critical Archival Studies). You can claim live disagreement.

  ### 4. The "Donor Trust" Objection
  *   **Objector:** Development Officer.
  *   **The Objection:** "Our accession agreements are built on trust. Families donate papers expecting their legacy to be handled with dignity. If we retroactively label a prominent donor's ancestor with pejorative terms, future donors will see that as a breach of stewardship. You risk drying up the pipeline for future acquisitions."
  *   **Reply:** "Stewardship includes truthful stewardship. Hiding uncomfortable truths is a greater breach of trust in the long term. We will engage with living donors during the appraisal phase to discuss descriptive sensitivity before accessioning, shifting the conversation from 'hiding' to 'accurate context'."
  *   **Soft Spot:** You are assuming donors value "truth" over "dignity." Many do not.
  *   **Status:** **Settled Practice.** Donor relations traditionally prioritize donor sensibilities. You are overriding this norm.

  ### 5. The "Subjectivity Slippery Slope" Objection
  *   **Objector:** Senior Metadata Specialist B.
  *   **Register:** Cataloging/Consistency.
  *   **The Objection:** "Who decides which terms are 'harmful'? Today it's racial slurs. Tomorrow it's political affiliation? Gender identity? Once we admit contemporary judgment into the catalog, we lose the objective standard that allows different librarians to produce consistent records. We become inconsistent."
  *   **Reply:** "Objectivity in cataloging has always been a myth; LCSH itself is a product of specific cultural judgments. We are not removing standards; we are adopting *different* standards, documented in a public policy. Consistency comes from transparency about our bias, not the pretense of having none."
  *   **Soft Spot:** You are assuming your committee can maintain consistency in applying a subjective policy without burnout or drift.
  *   **Status:** **Contested.** This is a live debate in the metadata community (Critical Cataloging).

  ### 6. The "Researcher Competence" Objection
  *   **Objector:** Regional Historian.
  *   **The Objection:** "Competent researchers know how to read against the grain. We teach students to understand that 'planters' means 'slaveholders' in 1850. You are spending scarce staff hours fixing a problem that doesn't exist for your primary user base. This is solutions looking for a problem."
  *   **Reply:** "Expert researchers can navigate this; community members, undergraduates, and journalists cannot. By requiring 'competence' to find your own history, we are enforcing a barrier to entry. We want to lower the floor for access, not just raise the ceiling for experts."
  *   **Soft Spot:** You are assuming staff hours are available for this work without cutting other services the Historian values.
  *   **Status:** **Contested.** Depends on the library's mission statement (Research elite vs. Public access).

  ### 7. The "Authority Control Chaos" Objection
  *   **Objector:** Senior Metadata Specialist A.
  *   **The Objection:** "If we integrate community-supplied names into the same authority record as LCNAF, we create collisions. When LC updates their record, does it overwrite ours? Do we stop importing LC updates? You are proposing a technical workflow that our ILS cannot support without custom coding."
  *   **Reply:** "We will use local subfields or a parallel local authority file that links to the LC record but does not overwrite it. It requires configuration, not a new ILS. We have the technical capacity to map these fields for display even if they don't export perfectly."
  *   **Soft Spot:** You are assuming your IT team has the bandwidth to maintain this custom configuration indefinitely.
  *   **Status:** **Settled Practice.** Standard practice is to follow LC updates. You are proposing a local fork. Acknowledge the override.

  ### 8. The "Privacy & PII" Objection
  *   **Objector:** General Counsel Liaison.
  *   **The Objection:** "Some of these 'community supplied' terms might identify living individuals in sensitive contexts (e.g., labor organizing, reproductive health). By making these terms more searchable, you might be exposing Protected Health Information or personally identifiable information that was previously obscure."
  *   **Reply:** "We will apply the same privacy restrictions to the new terms as the old ones. If a record is restricted, the metadata describing it will also be restricted. We are not de-restricting data, only re-labeling it."
  *   **Soft Spot:** Re-labeling can make restricted data *findable* via search engines even if the digital object is locked, creating a security through obscurity risk.
  *   **Status:** **Contested.** Privacy in archives is a shifting legal and ethical landscape.

  ### 9. The "Extractive Framing" Objection
  *   **Objector:** Graduate Student (Non-voter, but influential).
  *   **The Objection:** "You talk about 'community-supplied' terms, but the community doesn't get to vote on this proposal. We are the data source for your intervention. This is extractive: you get the moral credit for fixing the language, we do the labor of providing the terms, and you keep the copyright."
  *   **Reply:** "That is a valid critique of the *process*, which is why the proposal includes a standing advisory group from those communities with veto power over specific descriptions. We are trying to move from extraction to collaboration, but we need your help to design that mechanism."
  *   **Soft Spot:** You haven't actually budgeted or planned for that advisory group yet. It's a promise.
  *   **Status:** **Contested.** This is the cutting edge of archival ethics (Post-custodialism).

  ### 10. The "Appraisal Distraction" Objection
  *   **Objector:** University Archivist.
  *   **The Objection:** "Your third point—reweighting appraisal toward uncollected bodies—is a separate strategic plan. Mixing it with metadata reform muddies the water. We can't fix the backlog and change our acquisition strategy simultaneously. Pick one."
  *   **Reply:** "They are linked. If we change how we describe, we change what we value. If we value these groups in the catalog, we must value them in the intake. Doing them separately sends a mixed message that the description is just cosmetic."
  *   **Soft Spot:** You might be overloading the committee's capacity for change.
  *   **Status:** **Settled Practice.** Usually, appraisal and description are handled in separate workflow committees. You are merging them.

  ---

  ## V. FINAL TACTICAL NOTE
  **The "Settled vs. Contested" Trap:**
  Do not let the Metadata Specialists frame LCSH compliance as "The Law." It is a standard, not a statute. When they say "We can't do that," ask "Is that a technical limitation or a policy choice?"
  *   If technical: Can we engineer around it?
  *   If policy: Who set the policy and can we change it?

  **The "Soft Spot" Strategy:**
  When you hit a soft spot (e.g., donor trust, technical bandwidth), do not bluff. Say: *"That is a resource risk we have calculated. We believe the ethical risk of inaction outweighs the operational risk of action."* This frames the objection as a management preference, not a moral imperative.
