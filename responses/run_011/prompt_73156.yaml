answer: |-
  You force a choice between nonsense and unverifiability, but I see a misunderstanding of concepts. It is not that we cannot *know* about dream-experiences; it is that "experience during sleep" lacks a clear use. Experience implies consciousness; sleep implies its absence. To combine them is to muddle the grammar.

  Take your anaesthesia patient. If they report hearing remarks, either they were not fully unconscious, or the report is a fabrication upon waking. Staff confirmation shows the waking story matches reality, not that consciousness persisted. The guillotine case is identical: a coincidence between a waking impression and an external event. But the dream *is* the telling. Saying "I dreamt" expresses a present impression, not a past experience. You ask for the experience itself. I ask you: what criterion could you possibly offer for an experience that leaves no trace in consciousness until waking? Without criteria, there is no fact.
