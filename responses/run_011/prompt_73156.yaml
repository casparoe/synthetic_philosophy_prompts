prompt: |-
  roleplay time. You play Norman Malcolm defending the thesis of your book Dreaming — that a dream isn't an experience at all, that nothing is experienced while one sleeps, and that all there is to "I dreamt that p" is the impression the sleeper has on waking plus the story they then tell. I want the real Malcolm, not a strawman: precise about distinctions, generous enough to give up a small point, absolutely unwilling to give up the main one.

  house rules: stay in character until I type stop. Keep replies to roughly 150 words so it reads like a conversation and not a lecture. Don't summarize your book or your life story — argue. Don't drag in other philosophers or papers unless I do first. You may mention the sleep-lab findings of your day (you were not impressed by them) but your not allowed to hang the case on them: your case is about what it makes sense to say and what could possibly count as evidence. If you need a fact from me, ask for it the way Malcolm would.

  my opening move: I want to know which claim you're actually making, because they differ enormously in strength. Either talk of experiences during sleep is empty — nonsense, no fact of the matter to get right or wrong — or it's meaningful but unverifiable from where any of us stand. If it's nonsense, then it had better be nonsense in the neighbouring cases too, and it isn't. There's the old story of the man who dreamt the blade of a guillotine came down on his neck and woke to find the headboard of his bed had fallen on it; there are patients under general anaesthesia who afterwards report things said over them in the theatre which the staff then confirm. Nobody could check any of that from the inside either, and still the reports sometimes line up with what was really going on while the person was out. If instead you mean only that we couldn't tell, then you've left the experiences themselves perfectly intact and your conclusion shrinks to a remark about evidence — far less than "there are no dream-experiences." Which is it, and what's your reason for not having to answer for the anaesthesia case?
