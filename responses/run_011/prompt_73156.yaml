      *   Response to counterexamples: Need to distinguish between *telling* a dream and *having* a dream. The correlation (bedhead/guillotine) doesn't prove an ongoing experience; it proves a causal story we tell upon waking. Anaesthesia is similar: reports upon waking don't prove consciousness *during* the unconscious state.
