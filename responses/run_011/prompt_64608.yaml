prompt: |-
  I've been going down a rabbit hole on mechanistic anomaly detection lately — the family of approaches where instead of policing a model's outputs you try to build a detector on its internals, some circuit-level or feature-level signature that shouldn't light up in the deployment distribution. The bit I can't get past is the identity question it silently assumes: your detector has to decide whether the mechanism firing in this weird new context is the *same* mechanism you characterized in training, just misfiring, or something else wearing its clothes. Nobody says what "same" means, and the choice looks load-bearing — loose criteria and everything is a false alarm, tight criteria and you wave through a genuinely novel mechanism as "ah that's just the usual one in a new situation." I'm prepping a talk for a small reading group and I don't want to do it with toy models, so I want to work the problem out on a real episode where the same structural mistake happened with actual consequences: the Boeing 737 MAX and MCAS.

  The facts I'm leaning on, so you don't have to guess at them (and tell me if you think I've garbled any of this): the MAX's bigger engines sat higher and further forward, which gave the airframe a pitch-up tendency at high angle of attack, and certification rules about stall characteristics basically require stick forces to keep increasing smoothly as you approach a stall. MCAS was the software patch — a function in the flight control computer that trims the horizontal stabilizer nose-down — chosen partly so the MAX would handle enough like the old 737NG that airlines wouldn't owe their pilots simulator differences training. It started out scoped to a high-speed pitch-up case and got broadened during flight test to cover low-speed, high-AoA flight too. As built, it triggered off a *single* AoA vane, only with flaps up, autopilot off, manual flight; it could command up to about 2.5 degrees of stabilizer over roughly ten seconds, pause about five, and then re-trigger as long as the condition persisted, with the trim cutout switches as the only real way to stop it. It was not described in the flight crew manuals, so pilots on Lion Air 610 and Ethiopian 302 didn't know it existed while it repeatedly drove their noses down after takeoff on bad vane data — 346 dead, global grounding in March 2019, FAA ungrounding in Nov 2020 after a software fix. The fix kept the name MCAS but changed the behavior a lot: both AoA sensors have to agree, one input per elevated-AoA event, less authority, column force can override it, plus disclosure and simulator training. And the cockpit annunciator that would have told the crew the two vanes disagreed — the AoA disagree alert — was an optional paid feature bundled with the AoA indicator, so a bunch of fleets simply didn't have it until Boeing made it standard after the crashes. Boeing's own safety analysis reportedly assumed a pilot would recognize and counter an unexpected activation in something like three seconds. Separately there's the 2016 simulator session that only surfaced years later, where a Boeing technical pilot watched MCAS repeatedly push the nose down on a false AoA input and decided not to pass it along to the FAA; treat that one as fuzzy, I don't want the analysis hanging on it.

  Here's what I actually want. First, do the mapping honestly and explicitly before you argue anything: in this story, what is the mechanism, what is the characterized/certified context versus the deployment distribution, what plays the role of the anomaly detector, and what counts as an anomaly. Then take a set of candidate identity criteria and adjudicate them on the case rather than in the abstract — I've been scribbling these down: implementation identity (same code path, same subroutine, same weights), input–output identity (same function from inputs to activations), contextual-role identity (same job relative to the system's goals, i.e. still smoothing stick forces toward the stall), causal-contribution identity (same upstream causes and same downstream effects in the mechanism graph), and lineage identity (descended by revision from a common ancestor). For each: is MCAS firing right after takeoff at low altitude on a bad vane the same mechanism as MCAS in the wind-up-turn regime it was certified for, and is post-2020 MCAS the same mechanism as pre-crash MCAS? I especially want the places where the criteria come apart, and then a diagnosis of which criterion Boeing and the FAA were implicitly using when they treated this as a minor modification that didn't need to be mentioned to pilots or retrained for. Then run it backwards: what does the episode do to the MAD picture? Does it show that mechanism identity is a real, load-bearing problem, or is the MAX story actually about something else — single sensor with no redundancy, envelope expansion without re-doing the safety analysis, disclosure and human factors — such that the MAD framing obscures more than it reveals? There's at least one datum that seems awkward for the whole enterprise, which is that here the mechanism was hand-written, fully known, and completely interpretable, and the monitoring still failed; sit with that. And I want your take on the paid-option annunciator as an analogue of a detector that exists in principle but was never deployed by default — is the absence of the monitor part of the mechanism-identity problem or a separate failure mode? Be disciplined about where the analogy has no counterpart at all and where MAD is simply silent instead of forcing it to speak, and don't give me the standard regulatory-capture-and-greed narrative, I've read that version. No reading list, no citations — I just want the analysis. Also, yes, I know the FAA's delegation to Boeing looks like a process-versus-outcome supervision story and I may do that one seperately; ignore it here except where it touches the identity question.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Topic:** Mechanistic Anomaly Detection (MAD) applied to the Boeing 737 MAX MCAS case.
      *   **Core Problem:** The "identity question" in MAD (what counts as the "same" mechanism firing in a new context vs. a new mechanism?).
      *   **Task:**
          1.  Map the MCAS story explicitly to MAD terminology (mechanism, context, detector, anomaly).
          2.  Evaluate specific identity criteria (Implementation, Input-Output, Contextual-Role, Causal-Contribution, Lineage) against two comparisons:
              *   Pre-crash MCAS in certified context vs. Pre-crash MCAS in crash context.
              *   Pre-crash MCAS vs. Post-fix MCAS.
          3.  Diagnose which identity criterion Boeing/FAA implicitly used to justify lack of disclosure/training.
          4.  Evaluate the utility of the MAD framing for this case (does it illuminate or obscure?).
          5.  Address the "known mechanism" paradox (it was interpretable code, yet monitoring failed).
          6.  Analyze the "paid-option annunciator" as a detector analogue.
      *   **Constraints:** No reading list, no citations, no standard "regulatory capture/greed" narrative, focus strictly on the structural/identity analysis, acknowledge facts provided (don't guess).

  2.  **Deconstruct the MCAS Case into MAD Terms:**

      *   *Mechanism:* The MCAS algorithm (software logic in the Flight Control Computer).
      *   *Characterized/Certified Context:* High-speed, high-altitude maneuvers (originally), flaps up, manual flight, *valid* sensor data (implicit assumption), pilot aware/monitoring (implicit safety analysis assumption).
      *   *Deployment Distribution:* Low-altitude takeoff/climb, flaps up (after retraction), manual flight, *potentially faulty* sensor data, high workload, low situational awareness regarding the system's existence.
      *   *Anomaly Detector:* The pilot (human-in-the-loop) + the AoA Disagree alert (if installed) + internal system limits (originally weak).
      *   *Anomaly:* MCAS activating based on erroneous data in a flight regime where recovery time is minimal and pilot expectation is violated.

  3.  **Evaluate Identity Criteria:**

      *   *Implementation Identity:* Same code? Yes (pre-crash vs. crash context). No (pre vs. post-fix).
      *   *Input-Output Identity:* Same function? Mathematically yes (bad AoA -> nose down). But the *effective* I/O changes because the environment (altitude) changes the consequence of the output.
      *   *Contextual-Role Identity:* Same job? Intent: "prevent stall." Reality in crash: "cause dive." The *goal* remained, the *effect* diverged.
      *   *Causal-Contribution Identity:* Upstream cause (AoA vane) is the same type, but the *state* of the cause (faulty) was treated as negligible probability. Downstream effect (trim change) is same, but the *system state* (altitude) makes the effect catastrophic vs. manageable.
      *   *Lineage Identity:* Pre-crash and Post-fix are lineage-related but distinct versions. Pre-crash in different contexts is the same lineage.

  4.  **Diagnose Boeing/FAA Implicit Criterion:**

      *   They treated it as a "minor modification." Why?
      *   They relied heavily on *Implementation Identity* (it's still MCAS) and *Contextual-Role Identity* (it's still for stall protection).
      *   They ignored *Causal-Contribution Identity* regarding the *environmental context* (low altitude vs. high altitude) and the *human-in-the-loop* (pilot reaction time).
      *   Crucially, they assumed the *Deployment Distribution* matched the *Certified Context* regarding sensor reliability and pilot response.

  5.  **Evaluate MAD Framing Utility:**

      *   *Pros:* Highlights the "distribution shift" (certification vs. real world). Highlights the "monitoring failure" (pilots didn't know to monitor).
      *   *Cons:* MAD usually implies black-box/interpretability challenges. Here, the code was known. The failure wasn't "we couldn't see the mechanism," it was "we defined the mechanism's boundary conditions too narrowly."
      *   *The "Known Mechanism" Paradox:* MAD is often sold as a solution for opaque models. MCAS shows that even with transparent mechanisms, if your *model of the world* (the context) is wrong, detection fails. The "anomaly" wasn't in the code, it was in the *assumptions surrounding the code*.
      *   *Paid Annunciator:* This is a perfect analogue for a "detector" that exists but isn't deployed. In MAD terms, it's a feature that *could* signal distribution shift (sensor disagreement) but was gated by cost/choice. It's not an identity problem; it's a deployment/safety culture problem.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, rigorous, avoiding moralizing, sticking to the structural analogy.
      *   *Structure:* Follow the user's requested order (Mapping -> Criteria Adjudication -> Implicit Criterion -> MAD Evaluation -> Annunciator/Paradox).
      *   *Refining the "Identity" section:* Need to be precise. Is MCAS at 500ft the "same" as MCAS at 20,000ft? By code, yes. By risk profile, no. This is the crux of the MAD identity problem.
      *   *Refining the "MAD Utility" section:* Be honest. MAD might be the wrong lens for *this* specific failure, which was a systems engineering requirements failure, not a latent space drift failure. But it teaches a lesson about "contextual bounds."
      *   *Refining the "Annunciator" section:* Distinguish between *internal* detection (MCAS knowing it's confused) and *external* detection (Pilot knowing MCAS is active). The annunciator is an external detector. MAD usually looks for internal signatures. This is a point of divergence.

  7.  **Final Review against Constraints:**

      *   Did I use the provided facts? Yes (single vane, flaps up, paid alert, etc.).
      *   Did I avoid the greed narrative? Yes, focused on engineering/identity logic.
      *   Did I answer the specific identity criteria questions? Yes.
      *   Did I address the "known mechanism" paradox? Yes.

  8.  **Final Polish:** Ensure the distinction between "Mechanism Identity" (is this the same code?) and "Behavioral Identity" (is this the same risk?) is clear, as that's where the MAD analogy gets traction. (Self-correction: Make sure to explicitly state that MCAS *is* the mechanism, not the plane).

  *(Self-Correction during drafting)*: I need to be careful not to say MCAS was "designed to crash planes." It was designed to mimic NG handling. The crash was a failure mode. In MAD terms, the "normal" behavior was stabilizing the plane. The "anomalous" behavior was stabilizing it based on false data in a unrecoverable regime. The identity question is: Is "Stabilizing based on false data" the same mechanism as "Stabilizing based on true data"?

  *Decision:* The mechanism is the *logic*. The logic is identical. The *activation condition* (the input distribution) is where the shift happened. MAD tries to detect the shift in the *internal state* resulting from that input. The pilots failed to detect the shift because they didn't know the mechanism existed.

  *Wait, one nuance:* The prompt asks about "Mechanism Identity." In MAD, we worry if a new internal activation pattern is "the same" as a trusted one. In MCAS, the internal activation pattern (Trim Command = X) *was* the same. The *context* was different. This suggests MAD might be looking at the wrong layer if it only looks at internals without context. I need to highlight this.

  *Okay, ready to write.*
answer: |-
  Here is the mapping and analysis of the 737 MAX MCAS case through the lens of Mechanistic Anomaly Detection (MAD), adhering to your constraints.

  ### 1. The Mapping

  To run this analogy, we must translate the aviation systems engineering terms into the MAD conceptual framework.

  *   **The Mechanism:** The MCAS software logic residing in the Flight Control Computer (FCC). Specifically, the subroutine that reads Angle of Attack (AoA) data and commands horizontal stabilizer trim.
  *   **Characterized/Certified Context (Training Distribution):** High-altitude, high-speed maneuvering (original scope), later expanded to low-speed/high-AoA, but critically *assuming valid sensor data* and *sufficient altitude/time for pilot recovery*. The "label" here is safe flight handling qualities matching the 737NG.
  *   **Deployment Distribution:** Low-altitude climb-out (takeoff), flaps up, manual flight, *potentially faulty sensor data*, high pilot workload, zero pilot awareness of the system's existence.
  *   **The Anomaly Detector:**
      1.  **Primary:** The Flight Crew (Human-in-the-loop). They are expected to monitor aircraft state and intervene.
      2.  **Secondary:** The AoA Disagree Alert (software monitor comparing left/right vanes).
      3.  **Tertiary:** Internal MCAS limits (runaway trim protection).
  *   **The Anomaly:** MCAS commanding nose-down trim based on erroneous AoA data in a flight regime (low altitude) where the *consequence* of that command is unrecoverable, and where the *cause* (sensor failure) was treated as statistically negligible in the safety analysis.

  ### 2. Adjudicating Identity Criteria

  You asked to test specific identity criteria against two comparisons:
  1.  **Context Shift:** Pre-crash MCAS in certified regime vs. Pre-crash MCAS in crash regime (Lion/Ethiopian).
  2.  **Version Shift:** Pre-crash MCAS vs. Post-fix MCAS.

  | Criterion | Definition | Context Shift (Certified vs. Crash) | Version Shift (Pre vs. Post Fix) |
  | :--- | :--- | :--- | :--- |
  | **Implementation** | Same code path, weights, logic gates. | **Identical.** The binary executing in the FCC was the same. The logic `IF AoA > Threshold THEN Trim` did not change between a safe flight and a crash flight. | **Distinct.** The post-fix code added cross-comparison logic (`IF Left_AoA ~= Right_AoA THEN Inhibit`), limited authority, and single-shot activation. |
  | **Input–Output** | Same function mapping inputs to activations/outputs. | **Identical (locally).** Given the *same* faulty AoA input, the output (trim command) was identical. **Divergent (globally).** The input *distribution* shifted (faulty data became the trigger), and the system state (altitude) changed the physical outcome of the output. | **Divergent.** The function changed. The same faulty input now yields *no* output (inhibition) or reduced output. |
  | **Contextual-Role** | Same job relative to system goals (e.g., "stall protection"). | **Identical (Intent).** The goal remained "make the plane handle like an NG." **Divergent (Effect).** In the crash regime, the mechanism acted as a "dive initiator" rather than a "stall preventer." | **Identical.** The goal remained stall protection/handling quality, but the risk profile was altered to match safety requirements. |
  | **Causal-Contribution** | Same upstream causes and downstream effects in the mechanism graph. | **Divergent.** Upstream: The *reliance* on a single vane became the critical failure point, whereas in certification it was a negligible probability node. Downstream: The effect (nose down) interacted with low altitude to cause catastrophe, whereas in certification it interacted with high altitude to allow recovery. | **Divergent.** Upstream causes now require sensor agreement. Downstream effects are limited in magnitude and duration. |
  | **Lineage** | Descended by revision from a common ancestor. | **Identical.** It is the same instance of the software. | **Related.** The post-fix MCAS is a revision of the pre-crash MCAS, sharing lineage but distinct in implementation. |

  **Where the Criteria Come Apart:**
  The critical fracture is between **Implementation Identity** and **Causal-Contribution Identity**.
  In the crash scenario, the mechanism was *implementation-identical* to the certified mechanism. If your identity criterion is "same code," then MCAS firing at 500 feet is the "same" as MCAS firing at 20,000 feet.
  However, in terms of *Causal-Contribution*, they are fundamentally different mechanisms. One is a safety feature with manageable failure modes; the other is a single-point-of-failure hazard with catastrophic failure modes. The "mechanism" in a safety case isn't just the code; it's the code *plus* its boundary conditions. MAD struggles here: if you detect the "same" internal signature (trim command), do you flag it as anomalous? If you flag it, you ground the plane every time MCAS works correctly. If you don't, you miss the catastrophic context shift.

  ### 3. The Implicit Criterion Used by Boeing/FAA

  Boeing and the FAA implicitly relied on **Implementation Identity** coupled with a narrow **Contextual-Role Identity**.

  Their reasoning was effectively: "This is still the MCAS function (Implementation), and its job is still to adjust stick feel (Role). Therefore, it is the same system we already analyzed."

  By anchoring identity to the code and the intent, they were able to categorize the expansion of MCAS authority (from high-speed to low-speed) and the reliance on a single sensor as *parameter tweaks* rather than *mechanism changes*. This allowed them to bypass a new System Safety Assessment (SSA) that would have been required for a "new" mechanism.

  They treated the **Deployment Distribution** (low altitude, faulty sensor) as statistically irrelevant noise rather than a distinct regime requiring a new identity classification. In MAD terms, they assumed the training distribution (simulation/certification flights) covered the deployment distribution sufficiently that the mechanism's identity remained stable. They failed to account for the *interaction* between the mechanism and the environment (altitude/time-to-react) as part of the mechanism's identity.

  ### 4. Does the MAX Episode Validate or Undermine MAD?

  This is the uncomfortable pivot. The MAX story actually exposes a significant weakness in the standard MAD pitch, specifically regarding the "Known Mechanism" paradox.

  **The Paradox:**
  MAD is often motivated by the opacity of deep learning: "We can't interpret the weights, so we monitor the internal activations for anomalies."
  In the MAX case, the mechanism was **fully known, hand-written, and interpretable.** There were no hidden layers. The logic was explicit: `If AoA > Threshold, Trim Down.`
  Yet, monitoring still failed.

  **Diagnosis:**
  The failure wasn't that the mechanism was opaque; it was that the **boundary conditions of the mechanism were mis-specified.**
  MAD assumes that if you can characterize the "normal" internal activations, you can spot the "abnormal" ones. But in the MAX case, the internal activation (trim command) looked "normal" to the system even when the *context* was fatal. The FCC didn't know it was at 500 feet; it only knew AoA.
  This suggests that **mechanism identity is not intrinsic to the mechanism.** It is relational. A mechanism is only "safe" or "normal" relative to an environment. MAD approaches that focus solely on internal feature space (e.g., "does this attention head look like the training attention head?") risk missing the fact that the *same* internal feature can be catastrophic in a new context.

  **Does MAD obscure more than it reveals?**
  If MAD is framed as "find the weird neurons," the MAX case suggests that is insufficient. The "weirdness" wasn't in the MCAS code activations; it was in the **sensor input distribution** and the **operational envelope**.
  However, if MAD is framed broadly as "detect distribution shift in the causal graph," the MAX case is a powerful validation. The "anomaly" was the divergence between the single AoA vane and the actual flight state (which the other vane knew, but was ignored). A robust MAD system would have treated the *disagreement between redundant inputs* as the mechanistic anomaly, not the trim command itself.

  **Verdict:** The MAX story shows that mechanism identity is indeed load-bearing, but it shifts the burden from "interpreting the model" to "defining the system boundary." If your system boundary excludes the altitude sensor or the second AoA vane from the "mechanism" you are monitoring, you will fail. MAD must be whole-system, not just model-internal.

  ### 5. The Paid-Option Annunciator as a Detector

  The AoA Disagree alert (the paid option) is a precise analogue for a **detector that exists in principle but is not deployed by default.**

  *   **In MAD terms:** This is a feature that computes a divergence metric (Left AoA vs. Right AoA) and triggers a flag if the distance exceeds a threshold.
  *   **The Failure Mode:** This is not an identity problem; it is a **deployment policy** problem. The detector existed. The logic was written. It was simply gated behind a paywall/option selection.
  *   **Analogy Limits:** In ML, we rarely "gate" anomaly detectors behind payment. However, we do gate them behind **compute budgets** or **latency constraints**. We might decide not to run a heavy consistency-check detector in production because it slows inference.
  *   **The Deeper Lesson:** The absence of the monitor wasn't about not knowing *what* to monitor (they knew sensor disagreement was possible); it was about deciding that the risk didn't warrant the cost of the monitor (or the training to explain it).
  *   **MAD Silence:** MAD literature is often silent on the **cost of detection.** It assumes if you *can* detect it, you *should*. The MAX case forces the question: "If you have a detector that flags 1% of flights as ambiguous, but explaining that ambiguity requires expensive simulator training, do you deploy the detector?" Boeing's answer was "no." MAD needs to incorporate the cost of the human response to the alarm, not just the precision/recall of the alarm itself.

  ### 6. Synthesis: The Identity Problem is Real, But Not Where MAD Looks

  The MAX case confirms your suspicion: the "identity question" is the load-bearing beam.

  1.  **Identity is Contextual:** Boeing treated MCAS as the "same mechanism" because the code didn't change. Safety engineers should have treated it as a "new mechanism" because the *consequences of failure* changed (due to altitude/scope expansion). MAD needs a definition of identity that incorporates **downstream risk**, not just **upstream weights**.
  2.  **Monitoring Requires Authority:** The pilots had the "detector" (their eyes on the horizon) but lacked the "model" (knowledge of MCAS) to interpret the signal. In MAD, if your detector lights up but the operator doesn't know what the mechanism *does*, the detection is useless. The "interpretability" required isn't just "which neurons fired," it's "what goal is this subsystem pursuing?"
  3.  **The "Same Mechanism" Trap:** The most dangerous failure mode is when a mechanism behaves *exactly as designed* (Implementation Identity holds) but the design assumptions no longer hold (Causal-Contribution Identity breaks). MAD systems that look for "unexpected activations" will miss this. They need to look for "expected activations in unexpected states."

  **Final Diagnosis:**
  The MAX disaster was not a failure of mechanism opacity; it was a failure of **mechanism scoping.** Boeing defined the mechanism too narrowly (code only) rather than broadly (code + environment + human response).
  For your talk: Use this to argue that Mechanistic Anomaly Detection cannot stop at "finding the circuit." It must extend to "validating the circuit's boundary conditions." If MAD is just "spot the weird activation," it is insufficient. If MAD is "verify the mechanism's causal role remains stable under distribution shift," then the MAX case is the canonical example of what happens when you skip that step. The identity criterion that matters is **Causal-Contribution**, and it is the one most likely to be ignored in favor of the easier **Implementation** identity.
