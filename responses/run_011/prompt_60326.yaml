prompt: |-
  I have been covering science and research policy for a national magazine for the better part of two decades, and I am writing to you because this is not a question that our newsroom handbook can settle, so I would like it treated as a matter of principle rather than house style. In 2016 I spent several months reporting a story about a small research group whose signature result had been cited hundreds of times. The central account came from a retired laboratory manager — I will call him R — who had kept his own notebooks across four decades of other people's experiments and who believed the headline figure had been assembled from runs chosen after the fact. R was not an author on any of the papers and could name no professional stake, only a conviction that the record was wrong. He agreed to talk to me on one condition, which he stated twice in plain words and which I accepted in plain words: his name would never appear, and nothing I published would let former colleagues work out who he had been. We attached no time limit and identified no circumstances under which the arrangement would lapse, and I do not think either of us imagined any. The story died for reasons of my own — I could not corroborate the notebooks independently, and my editor would not run it on a single anonymous account — after which R and I exchanged perhaps four emails a year, mostly about his garden.

  He died fourteen months ago at eighty-four, and his local paper ran an obituary giving his full name, his job title, and his years of service. Since then the ground has shifted. The journal retracted the original paper last month, though on an entirely different basis, and the episode is being re-reported everywhere; a professional society is midway through establishing a named lecture in honor of the group's principal investigator. My editor has asked, reasonably enough, whether my old material is now usable, given that the man it protected is dead and named in print regardless. Then last week R's daughter — whom I met exactly once, in her father's kitchen, some ten years ago — emailed to say that her father would want the account told now, that the family regards the matter as closed, and that I should consider myself released from whatever I promised. In the same message she notes that her brother disputes this, and that in his final months R told at least one visitor something close to the opposite: that he regretted ever speaking to a journalist. So the people with the best claim to speak for him contradict one another, and I have no way to establish what he actually wanted. There is a third complication I have been slow to face. The notebooks identify a technician who still works at that institute, who was twenty-nine at the time, who never agreed to anything, and who would be recognizable from the details of the work even with R's name in the obituary pages. He has a family and, so far as I know, no interest whatsoever in being folded into a decade-old scandal.

  I want to know what I am obliged to do, and I want the reasoning rather than a verdict. A colleague who covers the courts told me over lunch that I am making a category mistake: on her account the promise was never really a private transaction between R and me, but my participation in a practice that reporters and sources run together, so the live question is not what R would now want but what sources in general can expect from people like me. I find that half-persuasive and half-evasive and cannot tell which half. The instinctive answers both fail on inspection — that a dead man's confidence lapses with him, and that a promise given without qualification binds forever and admits of no release — and I suspect the truth is that the assurance I gave R was never one thing but at least two, only one of which his death could conceivably touch. So: does the obligation survive him, and if so, in whose hands does it now sit? Can anyone release me, and does the daughter's word carry weight when her brother's contradicts it and neither of them was party to the exchange? Is the assurance R extracted from me the same assurance the still-employed technician is relying on, when I never gave him one? And concretely, what should I do with the notebooks before my editor's deadline at the end of the month — publish, publish in part, hold them, destroy them, or seek out a man I have not spoken to in years? Please argue the case through rather than sending me to authorities; I am trying to decide something, not annotate it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A seasoned science/research policy journalist (20 years experience) writing for a national magazine.
      *   **Tone/Style:** Intellectual, nuanced, principled, ethical, reflective. Not looking for a quick "yes/no" or a style guide citation. Wants reasoning, not just a verdict.
      *   **The Core Dilemma:** A promise of anonymity made to a source (R) 10 years ago. R is now dead. The story is relevant again (retraction, lecture). R's children disagree on whether the promise should hold. A third party (technician) is potentially identifiable and harmed by publication, despite never being promised anonymity.
      *   **Key Questions:**
          1.  Does the obligation survive the source's death?
          2.  Who holds the power to release the journalist (family? estate?)?
          3.  Does the technician (unintended third party) have a claim?
          4.  Concrete action: Publish, hold, destroy, contact?
      *   **Constraint:** "Please argue the case through rather than sending me to authorities; I am trying to decide something, not annotate it." (No "consult your lawyer" or "check SPJ code" cop-outs).

  2.  **Deconstruct the Ethical Layers:**
      *   **Layer 1: The Promise to R (The Contract).**
          *   Nature: Unconditional, perpetual ("no time limit," "never appear").
          *   Status of Source: Deceased.
          *   Status of Family: Divided (Daughter says go, Son says stop/regret).
          *   Ethical Principle: Fidelity/Trust vs. Public Interest.
      *   **Layer 2: The Practice of Journalism (The Institution).**
          *   Colleague's point: It's not just private; it's systemic. Future sources need to trust that "off the record" or "on background" means *forever*, even after death. If promises die with the source, trust erodes.
      *   **Layer 3: The Third Party (The Technician).**
          *   Status: Identifiable via context (deductive disclosure).
          *   Consent: Never given.
          *   Harm: Potential reputational/professional damage.
          *   Ethical Principle: Do No Harm (Non-maleficence).
      *   **Layer 4: The Public Interest (The Story).**
          *   Status: Paper retracted (but on different grounds). Lecture named after PI.
          *   Value: Validating the retraction? Exposing fraud? Or just old news?
          *   Corroboration: Originally failed (couldn't corroborate notebooks). Has this changed?

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. Validate the colleague's point but refine it. This is about the *ecosystem* of trust, not just a private pact.
      *   **The Survival of the Promise (Death & Family):**
          *   Does death void the promise? No. The promise was about *protection*, not just privacy. Protection extends beyond the grave to legacy, but more importantly, it protects the *practice* of sourcing.
          *   Who speaks for R? Neither child has standing to override the promise. The promise was to *R*, based on *R's* risk assessment. The daughter's "release" is well-intentioned but ethically insufficient because the brother indicates regret. The ambiguity of R's final wishes suggests caution.
          *   *Conclusion on this point:* The obligation survives. The family cannot unilaterally release you, especially when divided.
      *   **The Technician (The Unintended Target):**
          *   This is the strongest ethical barrier. Even if R's name is public, the *details* identify the technician.
          *   Journalistic duty: Minimize harm. You never promised him anonymity, but you owe him a duty of care not to out him via deduction.
          *   *Conclusion on this point:* You cannot publish anything that identifies him without his consent.
      *   **The Public Interest vs. Corroboration:**
          *   The paper was retracted, but on *different grounds*. Does R's accusation still matter? If the retraction validates the *outcome* but not the *method* R described, is the story still vital?
          *   Crucial flaw in original reporting: Lack of corroboration. Has this changed? If the notebooks are still the *only* evidence, the story is weak regardless of anonymity.
      *   **Synthesizing the Decision (Concrete Action):**
          *   Publishing now risks the technician and violates the spirit of the promise to R (given the brother's input).
          *   Destroying notes is too extreme (historical record).
          *   Contacting the technician? High risk of coercion/harm.
          *   *Recommendation:* Hold the specific allegations regarding the technician. If the story can be told without identifying the technician and without violating the core spirit of R's protection (which was about the *act* of whistleblowing, not just the name), maybe. But given the corroboration issue, the safest and most principled path is to *not publish the R-specific allegations* at this time, or significantly reframe them.
          *   *Wait, let's look closer:* The prompt asks what to do *with the notebooks* and the story.
          *   *Refined Recommendation:* Do not publish the specific accusation derived solely from R's notebooks if it identifies the technician. The promise to R survives death because it protects the *institution* of sourcing. The family cannot release you because the risk was R's to assess, and his final ambivalence (per the son) counsels silence. The technician creates a hard stop on deductive disclosure.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "Don't do it." I need to explain *why* the colleague's "systemic trust" argument is actually the stronger half, not the evasive half.
      *   *Nuance on the Family:* The daughter thinks she's helping her father's legacy. The son thinks he's protecting his father's peace. The journalist isn't the arbiter of their dispute. The default must be the original agreement.
      *   *Nuance on the Technician:* This is actually the dealbreaker. Even if R's promise is void (which it isn't), the technician's right not to be named in a scandal he wasn't part of is paramount.
      *   *Nuance on Corroboration:* The story died before because of lack of corroboration. Has that changed? The retraction was on "different grounds." This suggests R might have been right about the *result* but maybe not the *method*, or vice versa. Without new corroboration, publishing based on dead man's notebooks is risky journalism *plus* ethical breach.

  5.  **Finalizing the Structure:**
      *   **Opening:** Validate the complexity. Establish the two distinct obligations (R and the Technician).
      *   **Part I: The Promise to R (The Vertical Obligation).** Address death, family authority, and systemic trust.
      *   **Part II: The Technician (The Horizontal Obligation).** Address deductive disclosure and duty of care to non-sources.
      *   **Part III: The Public Interest & Corroboration.** Address the journalistic standard of truth.
      *   **Conclusion/Action Plan:** Specific steps.

  6.  **Tone Check:** Ensure it sounds like one professional speaking to another. Respectful, rigorous, avoiding preachiness. Use the user's language ("category mistake," "plain words").

      *(Self-Correction during drafting)*: I need to be careful not to give legal advice. Stick to ethical reasoning. The user asked for "principle rather than house style."

      *(Key Insight)*: The colleague is right that it's a systemic practice, but wrong that it makes the individual promise irrelevant. The individual promise *is* the brick that builds the system. If you break one, you weaken the wall.

      *(Key Insight on Technician)*: The technician is the "innocent bystander." In ethics, the duty to not harm an innocent bystander often outweighs the duty to expose a past wrong, especially if the exposure is incomplete (uncorroborated).

      *(Decision)*: The recommendation should be to **hold** the specific allegations derived from R's notebooks. The retraction on *other* grounds makes the R story less urgent/publicly vital, while the risks (technician harm, broken trust) remain high.

  7.  **Final Polish:** Check against the prompt's specific questions.
      *   Does obligation survive? Yes.
      *   Whose hands? Yours (the journalist).
      *   Can anyone release? No, not definitively.
      *   Technician assurance? Yes, implied duty of care.
      *   Concrete action? Hold/Archive, do not publish.

      *(Wait, one nuance)*: Is there a way to publish *without* identifying the technician? Maybe. But if the notebooks *are* the evidence, and the notebooks describe the technician's work... it's likely impossible. I should address this difficulty.

      *(Final thought)*: The user said "argue the case through." I will structure it as a deliberative memo.

      *(Let's write.)*
answer: |-
  This is a profound ethical knot, and your instinct that the "instinctive answers" fail is correct. The binary of "dead men tell no tales" versus "a promise is a promise" ignores the ecosystem in which journalism operates. Your colleague's point about the "practice" is the stronger half of her argument, but it is not evasive; it is foundational. However, it is not the *only* foundation. You are standing on two distinct pillars of obligation: one vertical (between you and R) and one horizontal (between you and the world R inhabits, specifically the technician).

  Here is the reasoning broken down by those obligations, leading to a concrete course of action.

  ### I. The Vertical Obligation: Does the Promise Survive R?

  You asked if the obligation survives him. It does. But not merely because you gave your word. It survives because the promise was not a commodity R owned that he could bequeath to his heirs; it was a structural guarantee you provided to enable the flow of information.

  When you grant anonymity, you are not just protecting a person; you are protecting the *condition* under which they spoke. R spoke because he believed the risk to his reputation and relationships was nullified. That calculation was based on his life as he lived it. His death changes the landscape, but it does not retroactively validate the risk he feared while alive. If sources believe that their anonymity expires at their funeral, or becomes subject to the consensus of their grieving children, the utility of anonymity evaporates. Future sources will calculate that their secrets are safe only for their lifetime, which may not be enough to encourage them to come forward about long-term institutional rot.

  Therefore, the power to release you does not sit with the family. The daughter's email, while well-intentioned, treats the promise as a family secret rather than a journalistic contract. She has standing to speak for his *memory*, but not for his *risk*. The brother's counter-claim—that R expressed regret—complicates this further. It suggests R's own assessment of the bargain shifted before he died. When a source's heirs disagree, and the source's own final sentiments are ambiguous, the ethical default must be the strictest interpretation of the original agreement. You cannot arbitrate a family dispute over a dead man's intent to the detriment of the promise you made.

  So, the obligation survives. It sits in your hands. You are the custodian of the confidence, not the family.

  ### II. The Horizontal Obligation: The Technician

  This is the more pressing constraint, and arguably the one that renders the first question moot. You note that the technician never agreed to anything. This is correct, but it does not mean he has no claim on you.

  Journalistic ethics rely heavily on consent, but they rely more heavily on *non-maleficence* (do no harm). You have a duty of care to individuals who are not sources but who may be harmed by your reporting. This is the principle behind blurring faces in crowd shots or withholding the names of minor victims.

  In this case, publication would lead to "deductive disclosure." Even if you do not name the technician, the combination of R's identity (now public), the specific timeframe, the specific lab, and the specific technical details in the notebooks creates a funnel narrow enough to identify him. He is a private citizen (in the context of this scandal), he was a junior employee at the time, and he has no interest in being folded into the narrative.

  Unlike R, who accepted the risk of speaking to you (conditioned on anonymity), the technician accepted no risk. To expose him now, ten years later, based on the uncorroborated notes of a deceased man, is to use him as a means to an end. He becomes collateral damage in a story about R and the Principal Investigator. The fact that the PI is being honored and the paper was retracted adds public interest weight, but it does not grant you license to sacrifice an uninvolved third party's reputation to make the story land harder.

  ### III. The Journalistic Obligation: Corroboration and Public Interest

  We must also look at the story itself, separate from the ethics. You wrote that the story originally died because you "could not corroborate the notebooks independently." You note the journal retracted the paper, but "on an entirely different basis."

  This is critical. If the retraction was for, say, image manipulation by the PI, but R's claim was about data selection by the group, the retraction does not corroborate R. It merely validates the *outcome* (the paper is bad), not the *mechanism* (R's specific accusation).

  If you publish now, you are publishing an allegation of scientific misconduct against a group (implicitly including the technician) based solely on the notebooks of a man who is no longer here to defend his interpretation of them, without independent verification of the data runs, and in a way that identifies a junior employee who never consented to be part of the story.

  The public interest in knowing that the paper was flawed is already served by the retraction. The public interest in knowing *how* it was flawed is secondary to the harm caused by uncorroborated allegations against living, uninvolved parties.

  ### IV. Synthesis and Concrete Action

  You asked what you are obliged to do. You are obliged to honor the structural integrity of the promise made to R, and you are obliged to minimize harm to the technician. These two obligations converge on the same action.

  **1. Does the obligation survive him?**
  Yes. It survives because it is a promise made to the *role* of the source, not just the man. It protects the practice of journalism.

  **2. Can anyone release you?**
  No. The family lacks the standing to override the conditions of the source's risk assessment, especially when they disagree. The brother's assertion of R's regret reinforces the need for caution.

  **3. Is the assurance the technician relies on the same?**
  No, it is different. It is not a promise of confidentiality; it is a duty of care. However, the effect is the same: you cannot publish information that identifies him without his consent. Given the specificity of the notebooks, it is likely impossible to use the notebooks without identifying him.

  **4. Concrete Action:**
  **Do not publish the allegations derived from R's notebooks.**

  Here is the specific reasoning for this verdict:
  *   **The Promise:** Publishing now, even with R's name, violates the spirit of the "nothing I published would let former colleagues work out who he had been" clause. If the story links R to the specific accusation, it validates the brother's claim that R regretted the exposure. It treats the promise as voidable by death, which damages future trust.
  *   **The Technician:** Publishing the details identifies him. He has not consented. He is being harmed to tell a story that is, at best, partially corroborated by a retraction on *other* grounds.
  *   **The Corroboration:** The story died once for lack of corroboration. Unless you have found independent verification of the *data selection* (not just the retraction) in the last month, the journalistic basis for the story remains as weak as it was in 2016, while the ethical costs have risen.

  **What to do with the notebooks:**
  **Hold them.** Do not destroy them (they are a historical record of your reporting process and may be relevant if the technician or PI faces formal charges later), but do not publish them.

  **What to tell your editor:**
  Explain that while R's name is public, the *conditions* of the sourcing (protecting the identification of the whistleblower's specific knowledge) and the *duty of care* to the identifiable technician preclude publication. The retraction serves the public interest regarding the paper's validity; your story adds uncorroborated detail at the cost of ethical breaches.

  **What to tell the daughter:**
  Acknowledge her desire to honor her father. Explain that your promise was not just to him, but to the integrity of the work he trusted you with. Tell her that publishing now would embroil her family and former colleagues in a dispute her father seemed to have ambivalence about in his final days.

  **What to do about the technician:**
  **Do not contact him.** Contacting him now, ten years later, to ask for comment on a story you have decided not to publish (or to ask for consent to publish) puts him on notice that he is under suspicion. It creates the very anxiety you seek to avoid. Leave him undisturbed.

  ### Summary
  Your colleague was right that this is about the practice, but she missed that the practice includes protecting the innocent bystander. The promise to R survives death because it protects the *system* of sourcing. The duty to the technician exists because it protects the *human* cost of reporting. Both point to silence.

  The hardest part of this job is often not digging up the truth, but knowing when the cost of telling it outweighs the value. In 2016, you killed the story because you couldn't corroborate it. The facts haven't changed enough to justify breaking the ethics. Keep the confidence. Archive the notes. Let the retraction stand on its own merits.
