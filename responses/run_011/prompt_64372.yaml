      - "Signed it" -> During Bridge (Consent $\neq$ Norms).
      - "Encryption" -> During Pushback (Security $\neq$ Appropriateness).
      - "Cost of renting" -> During Close (Negotiating norms).

      **Scope:**
      - No legal advice.
