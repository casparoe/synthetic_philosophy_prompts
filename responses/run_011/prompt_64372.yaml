prompt: |-
  I volunteer at the tenants' clinic in my building, so let me set this up properly. The place got sold last year and the new management company put in a "smart" intercom at the front door: app-based, it logs every entry, takes a photo of visitors, and the manager says it can do face matching if we opt in. Everybody got a consent form with the lease renewal and most people signed, including a lot of the people who'll be in the room. Two weeks ago a super pulled the entry logs to complain to a tenant about their late night guests, and that's when it clicked for me that the real fight isn't about the cameras — it's that everyone thinks signing the paper settled the question. Next Thursday I've got forty minutes at the monthly tenant meeting, church basement, flipchart and markers, no projector, about twenty people ranging from a retired night-shift nurse to a guy who does backend dev and will absolutly say something about encryption.

  What I want to teach is one thing, not a survey of the topic: that the interesting question about an information practice isn't "is it secret" or "did you agree to it," but whether the way information moves fits the norms of the situation it's happening in — a doctor's office, a building lobby, a workplace — and that consent can be perfectly voluntary in form and still leave you with a practice that's objectionable. I read something along those lines a while back and can't find it again, so don't assume I know the jargon or the names; if the concept has a standard label, use it once so I can look it up later, but build the session on cases from our building rather than on vocabulary. So plan the forty minutes for me: the order the pieces have to go in, with a note on what each piece depends on. I don't want to open with the smart intercom, because I think half the room will go defensive about having signed — tell me whether you agree or whether I'm wrong about that. And pick the one scenario I should build the whole thing around, saying what it has to contain and what it should deliberately leave out; I'd rather you invent a case involving our super, the logs, or the opt-in form than reach for something generic.

  Then map the misconceptions you expect. I'm counting on "I've got nothing to hide," "I signed it so I can't complain," "if it's encrypted and stays on their servers there's no issue," and "this is just what renting costs now" — tell me at which point in the sequence each gets defused and how, including how I handle the people who already signed without making them feel like the sucker in the room. Say what I should openly refuse to get into at this level (surveillance law, resale of data to third parties, whatever you think is a trap) and how to announce that I'm skipping it. And give me one question to close with, phrased so that I can tell from their answer whether the idea landed or whether they're just agreeing because I'm the one holding the marker. Don't lay out options and let me pick — commit to one sequence, one case, one closing question, with your reasons, and if you think my framing is off, overrule me and say why. No reading list or handout suggestions, nobody's doing homework.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User Role:** Volunteer at a tenants' clinic in their building.
      *   **Context:** Building sold, new management, "smart" intercom (app, logs, photos, face matching option). Most tenants signed consent forms during lease renewal.
      *   **Trigger Event:** Super used entry logs to complain to a tenant about late-night guests.
      *   **Goal:** Teach *one* core concept in 40 minutes: Information practices should fit situational norms, not just rely on secrecy or consent. (This is Helen Nissenbaum's "Contextual Integrity," though the user asked not to lead with jargon).
      *   **Audience:** ~20 people, mixed backgrounds (retired nurse, backend dev, etc.), church basement, flipchart only.
      *   **Constraints:**
          *   Do not open with the smart intercom (user fears defensiveness).
          *   Commit to *one* sequence, *one* case study (invent one based on building context), *one* closing question.
          *   Address specific misconceptions ("nothing to hide," "signed so can't complain," "encryption solves it," "cost of renting").
          *   Explain *when* and *how* to defuse these misconceptions.
          *   Explain what *not* to discuss (scope boundaries).
          *   No handouts/reading lists.
          *   Overrule the user if their framing is off (specifically about opening with the intercom).

  2.  **Deconstruct the Core Concept:**
      *   The user describes Helen Nissenbaum's theory of **Contextual Integrity**.
      *   Core idea: Privacy isn't just secrecy or consent; it's about the appropriate flow of information within a specific social context (norms).
      *   Application: A lobby isn't a public square, but it isn't a police station either. A super checking logs for maintenance is one norm; a super checking logs to police guest behavior is a violation of that norm, even if consent was signed.

  3.  **Evaluate the "Don't Open with the Intercom" Instruction:**
      *   *User's thought:* Half the room will go defensive about having signed.
      *   *My assessment:* The user is right. If I start with "The intercom is bad," people who signed feel foolish or attacked. They will shut down.
      *   *Strategy:* Start with a low-stakes, relatable analogy where the violation of norms is obvious *without* the baggage of the lease signature. Then bridge to the intercom.
      *   *Decision:* I will agree with the user. Do not open with the intercom.

  4.  **Develop the Case Study:**
      *   *Requirement:* Invent a case involving the super, logs, or opt-in form, not generic.
      *   *Idea:* The "Maintenance Request" scenario.
      *   *Why:* It uses the Super (authority figure), the Building (context), and Information Flow (logs/data), but removes the "security/lease" pressure initially.
      *   *Scenario:* Super uses maintenance request data (which tenants *had* to provide to get repairs) to build a profile of who has guests, then shames them.
      *   *Refinement:* Let's make it about the *Mailroom*. Everyone uses it. Everyone expects certain norms.
      *   *Better Idea (closer to the prompt's request for Super/Logs):* Let's use the "Package Log" scenario. It's analogous to the intercom log but feels more mundane.
      *   *Actually, the prompt asks to invent a case involving "our super, the logs, or the opt-in form."* Let's create a hypothetical *past* incident that mirrors the intercom issue but feels less charged.
      *   *Selected Case:* "The Super's Clipboard." A hypothetical scenario where the Super kept a paper log of repairs and started using it to track who comes over, then mailed a letter telling people to stop having guests.
      *   *Why:* It strips away the "tech/encryption" distraction. It isolates the *use* of the data vs. the *collection* of the data.

  5.  **Drafting the Sequence (40 Minutes):**
      *   *0-5 min:* Hook & Setup. Establish the "Norms" idea without tech.
      *   *5-15 min:* The Case Study (The Clipboard). Walk through why it feels wrong.
      *   *15-25 min:* Bridge to Reality (The Intercom). Apply the lesson. Address the "Consent" trap.
      *   *25-35 min:* Misconception Takedown. Address the specific objections (encryption, nothing to hide, etc.).
      *   *35-40 min:* Closing Question.

  6.  **Addressing Misconceptions:**
      *   "Nothing to hide": Defuse during the Case Study (it's about dignity, not secrets).
      *   "Signed so can't complain": Defuse during the Bridge (consent doesn't validate norm violation).
      *   "Encryption/Security": Defuse during Misconception Takedown (security $\neq$ appropriateness).
      *   "Cost of renting": Defuse during Closing (negotiating norms vs. accepting terms).

  7.  **Addressing Scope Boundaries:**
      *   What to avoid: Specific laws (LL/tenant law varies), data brokerage (too abstract), hacking risks (distracts from the norm argument).
      *   How to announce: "Parking Lot" or "Boundary Statement."

  8.  **Refining the Closing Question:**
      *   Needs to test understanding, not compliance.
      *   Bad: "Do you agree?"
      *   Good: "If the Super offered to delete the logs if we all signed a *new* form, would that fix it?" (Tests if they understand the issue is the *practice*, not just the storage).

  9.  **Review against Constraints:**
      *   *One sequence?* Yes.
      *   *One case?* Yes (The Clipboard).
      *   *One closing question?* Yes.
      *   *Overrule framing?* I agree with the "Don't open with intercom" stance, so no overrule needed there, but I need to be firm on the *reason*.
      *   *Jargon?* Mention "Contextual Integrity" once at the end for lookup.
      *   *Tone:* Practical, facilitator-focused, no handouts.

  10. **Final Polish:**
      *   Ensure the transition from "Clipboard" to "Intercom" is smooth.
      *   Make sure the "Backend Dev" in the room doesn't derail the encryption point.
      *   Ensure the "Nurse" feels heard (care/norms).
      *   Check timing. 40 mins is tight. Need to be disciplined.

      *(Self-Correction during drafting)*: Wait, the prompt asks me to invent a case involving *our* super/logs/opt-in form. A hypothetical "Clipboard" might feel too fake. Let's make it a *hypothetical extension* of the current situation.
      *Revised Case:* "The Birthday Party Log." Imagine the Super decides to log *who* brings cakes into the lobby to enforce a 'no food' rule, using the intercom photos.
      *Actually, let's stick closer to the prompt's suggestion:* "The Super's Clipboard" is better because it removes the *tech* variable. The prompt says "invent a case involving our super, the logs, or the opt-in form." A paper log is still a log. It isolates the *behavior* from the *tool*. I will stick with the "Paper Log" analogy because it neutralizes the "Backend Dev" who wants to talk about encryption. If it's paper, encryption doesn't matter. This is a crucial strategic move.

      *Wait, one more check:* The prompt says "invent a case involving our super, the logs, or the opt-in form."
      Okay, I will create a scenario called **"The Guest Book."** It's a paper log the Super *could* have used. It mirrors the digital log but removes the "smart" distraction.

      *Wait, looking at the "Overrule me" instruction:* "if you think my framing is off, overrule me and say why."
      My assessment: The user is *right* about not opening with the intercom. I will validate that, not overrule it. I will overrule the idea that we need to discuss encryption at all. I will explicitly say "Do not let the backend dev drag you into encryption."

      *Closing Question:* Needs to be sharp. "If the management offered to encrypt the logs so hackers can't see them, but kept using them to scold tenants about guests, would that solve the problem?" This forces them to separate security from norms.

      *Let's refine the Closing Question:* The prompt asks for *one* question to tell if the idea landed.
      Question: "If the Super promised to never show these logs to anyone but the police, would you be okay with him using them to tell you who you can invite over?"
      No, that's too specific.
      How about: "Does fixing the *security* fix the *relationship*?"
      Let's go with: **"If the management company offered to make the logs 'anonymous' but kept the right to use them to enforce lease rules about guests, would you sign?"**
      Actually, the best test of "Contextual Integrity" is whether they recognize the *flow* is the problem.
      Final Choice: **"If the Super promised to keep the logs perfectly secure and never sell them, but kept using them to call tenants about their guests' arrival times, would that be acceptable?"** (Yes/No reveals if they get that *use* is the issue, not *security*).

      *Wait, I need to make sure I don't sound like I'm giving legal advice.* I need to emphasize this is about *power and norms*, not legality.

      *Let's finalize the plan.*

      **Sequence:**
      1. Intro (Norms vs Rules)
      2. The Case (The Paper Log)
      3. The Bridge (The Intercom)
      4. The Pushback (Misconceptions)
      5. The Close (The Question)

      **Misconceptions Mapping:**
