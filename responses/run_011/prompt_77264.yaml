answer: |-
  I recommend we adopt a guide entry with specific cautionary language that directs judges to exclude this evidence when offered to prove involuntariness, grounded in reliability and fit rather than metaphysics.

  **Proposed Bench Guide Paragraph**

  Evidence derived from laboratory measures of brain activity preceding movement, such as readiness potentials, generally lacks the reliability to establish whether a specific criminal act was involuntary. These measures reflect averaged data across many trials and cannot determine the mental state of an individual during a single real-world event. Furthermore, the temporal gap between brain signals and reported awareness does not negate legal voluntariness, which requires only that the act was a product of consciousness and not a reflex or convulsion. Judges should exclude such testimony when offered to prove a defendant lacked the capacity to choose or inhibit a specific action, as the science does not support inferring individual incapacity from group averages or artificial tasks.

  **Reasoning**

  The defense expert's inference fails at every technical step required to bridge the lab-to-court gap. First, the readiness potential (RP) is a trial-averaged waveform; extracting a single-trial decision signal from it is statistically illicit because the RP likely emerges from averaging noisy neural ramps that only cross threshold by chance (the "stochastic accumulator" model). Second, the defendant's reported urge timing relies on subjective clock-reading, which shifts based on attentional focus and post-hoc reconstruction, not a fixed neural timestamp. Third, even if the RP precedes awareness, inhibition remains possible until roughly 200ms before movement—the "point of no return"—which coincides almost exactly with the defendant's reported awareness, meaning he retained veto power during the window he claims was unconscious.

  Fourth, the ecological validity is nonexistent. A self-paced button press lacks the emotional arousal, sensory complexity, and social contingency of a bar fight; neural dynamics in a sterile lab do not map onto aggressive acts unfolding over minutes. Fifth, testing fourteen months post-incident measures current brain function, not the state on the night of the assault, absent evidence of stable pathology. Finally, this conflates philosophical free will with legal voluntariness. The law asks whether the act was willed and not reflexive, not whether the will was causally determined by prior neural states. Admitting this evidence invites jurors to confuse a deterministic universe with a legal excuse.

  **Addressing the Counterargument**

  Our neuroscientist colleague worries we are freezing a scientific snapshot into law and making covert metaphysical rulings. This concern is valid but misapplied. We are not ruling that free will exists; we are ruling that *this specific measurement* does not prove *this specific legal element*. Evidentiary reliability standards always lag behind cutting-edge science; requiring single-trial validity and ecological fit is standard Daubert gating, not metaphysics. If we remain silent, judges will treat the "60% accuracy" claim as meaningful probability rather than statistical noise. A cautionary entry protects the record without forbidding future neuroscience that actually meets reliability standards.

  **Citation Flags**

  *   **Before circulation, I need to verify:** The specific millisecond window for the "point of no return" in inhibition tasks (currently cited as roughly 200ms in my draft reasoning); I need a review paper confirming this stability across motor tasks.
  *   **I need a citation for:** The stability of readiness potential metrics over a 14-month period in healthy vs. injured populations to support the temporal gap argument.
  *   **I need to confirm:** The current consensus on the Schurger stochastic accumulator model vs. traditional readiness potential interpretations to ensure our "noise" language doesn't outdatedly contradict a new majority view.
