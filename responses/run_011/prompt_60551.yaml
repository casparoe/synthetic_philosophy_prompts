answer: |-
  This is a fascinating mess, but I'm going to give you the answer in two parts. First, the logic puzzle you asked about. Second, the actual problem you're trying to solve with the logic puzzle.

  ### Part 1: The Logic (Yes, the rules are rubbish)

  You have stumbled into a classic problem in social choice theory known as a **Condorcet Cycle** (or voting paradox).

  Here is why your rules are mathematically incompatible in this specific scenario:

  *   **Rule 1 (Autonomy)** says an individual's veto on their own participation is absolute.
  *   **Rule 2 (Majority/Unanimity)** says the group preference dictates the outcome.

  For a deadlock to exist where "whichever of the three we land on, it loses to one of the others," your preferences must be circular (Intransitive). Based on your description, the preferences look like this:

  1.  **Mo:** Neither (C) > Mo Reads (A) > Dez Reads (B)
  2.  **Dez:** Mo Reads (A) > Dez Reads (B) > Neither (C)
  3.  **You:** Dez Reads (B) > Neither (C) > Mo Reads (A) *(Note: For the cycle to work as you described, your preference must complete the loop, even though you said you'd rather Mo than Dez. If you prefer Mo > Dez, the cycle breaks. Assuming the deadlock is real, the math implies a cycle exists).*

  If a majority prefers A over B, B over C, and C over A, there is no stable winner. Rule 2 cannot function without violating Rule 1, or vice versa. In political science, this is often resolved by a "dictator" (one person decides) or an agenda setter (who decides which vote happens first).

  So, to answer your specific question: **Yes, the ruleset is secretly rubbish.** It works for ordering pizza or choosing a film, but it breaks down when preferences are cyclic and involve personal autonomy. You are in a genuine logical dead end *if* you treat this as a voting problem.

  ### Part 2: The Reality (The book is the problem)

  You are using a voting paradox to avoid making an executive decision about a potential liability.

  You wrote that the chapter is "extremely graphic," "unmistakably about a friend," and "not kindly." You also mentioned this is a **bound proof**. That means this book is about to be published.

  **You need to take the copy off the table and put it in the drawer. Not because Mo won the vote, but because you are risking a lawsuit and a destroyed friendship.**

  Here is the hard truth your flatmates are dancing around using these rules:

  1.  **Defamation Risk:** If a real person is identifiable ("unmistakably") and the portrayal is damaging ("not kindly") and false (implied, if it's fiction based on reality), that is libel/defamation. Bound proofs circulate. If that friend sees it, or if Mo or Dez mention it, you could be in serious legal trouble before the book even launches.
  2.  **The "Friend" Factor:** You are asking your flatmates to vote on whether they want to be complicit in reading something potentially malicious about a mutual friend. Mo wants it in the drawer because she knows it's toxic. Dez wants to watch the drama unfold.
  3.  **Abdication of Responsibility:** This is *your* book. You are the author. Hiding behind a flatmate agreement to decide whether a libelous chapter gets "read" is a way of avoiding the fact that **you** have to decide if that chapter stays in the book.

  ### What to do tonight

  1.  **End the Vote:** Tell Mo and Dez, "You're right, the rules are broken for this. I'm invoking executive author privilege."
  2.  **Secure the Copy:** Put the bound proof in your drawer. Tonight. Do not leave it on the kitchen table. It is evidence of a potential problem.
  3.  **Listen to Mo:** Mo's preference (Neither reads it) is the only safe option. Not because she won the vote, but because it is the only option that protects you, them, and the friend.
  4.  **Fix the Chapter:** Before the book goes to print in the spring, you need to rewrite that chapter. Change the details so it is *not* unmistakably about the friend. Soften the graphic nature. Or cut it.

  Your flatmates are stuck in a logic loop because they don't want to tell you, "This is a bad idea and we don't want to be involved." Mo is trying to protect you. Dez is treating it like reality TV.

  Be the novelist. Make the hard edit. Put the book in the drawer.
