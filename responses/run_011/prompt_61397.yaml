      *   **Section 4: Rationality.** Kelly is rational for *survival and growth*. All-in is rational for *one-off extraction*. Since you have a business, Kelly is the rational choice.
      *   **Conclusion:** specific advice on the 7 boxes vs 3 boxes.

      *(Self-Correction on "Rationality")*: I need to be careful not to say Kelly is the *only* rational strategy. It's the optimal strategy for a specific utility function (log wealth). But for a business intending to compound, it is the operational optimum. I will frame it as: "If your goal is to maximize the money you actually have in your pocket in 5 years, Kelly is the math. If your goal is to maximize the theoretical average of a simulation, All-In is the math."

      *(Refining the Half-Kelly argument)*: The strongest argument for fractional Kelly in a business context is **parameter uncertainty**. The 55% win rate is a historical estimate, not a physical constant. If the true win rate is 52%, Full Kelly might be betting too much. I will emphasize this.

