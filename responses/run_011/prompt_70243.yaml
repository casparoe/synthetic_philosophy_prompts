answer: |-
  The room smells of ozone and old carpet, the specific scent of the Anchor box warming up. It's a beige cube, no larger than a loaf of bread, with a depressor pad on top. When it cycles, it delivers a standardized pressure—thirty seconds, equivalent to a moderate bruise forming on the ulnar nerve. Fully reversible. Mildly nasty. Identical for everyone.

  I adjust my glasses and look at the two claimants sitting across the laminate table. On my left, Elara. Three years since the press took her hands. She wears prosthetics today, cosmetic shells, but she hasn't touched the table. Her eyes are red-rimmed, not from weeping, but from the fatigue of being furious. On my right, Silas. Coal dust in his pores that no scrubbing removes, lungs damaged in the collapse of '21. He is smiling. Not the tight grin of someone waiting for a verdict, but a loose, open expression. He looks rested.

  "Calibration complete," the box hums.

  I slide the Form 88-B toward them. "Standard Protocol. You both felt the cycle?"

  Elara nods, sharp. "Felt it."

  Silas rubs his forearm. "Yes. Quite sharp, actually."

  "Proceed to Section 4," I say. "Trade-off valuation. How many repetitions of the Anchor experience would you endure to avoid one week of your current baseline existence?"

  This is the crux. We don't ask how much you hurt. We ask what you'd pay to stop it, using the Anchor as the currency. It's the only way to convert Elara's loss of function into the same unit as Silas's loss of lung capacity.

  Elara writes first. Her prosthetic claws click against the plastic pen, awkward but functional. She writes *400*.

  Silas writes *15*.

  I don't flinch. I've seen this before. I input the figures into the terminal. The system applies the weighting for duration and intensity of the original injury, then normalizes against the Anchor sensitivity.

  The screen flashes the Delta-Q scores.

  **Claimant A (Elara): 84.6**
  **Claimant B (Silas): 11.2**

  The treatment slot is one. The regenerative bath. It works on nervous tissue or pulmonary scarring, but not both, and not twice. The threshold for adjudication is 50.0.

  "Elara," I say, keeping my voice flat. "You qualify."

  Elara lets out a breath that sounds like a tire deflating. She closes her eyes. Silas doesn't move. He just looks at the number, 11.2, as if it were a score on a test he didn't study for.

  "That's wrong," Silas says. He isn't angry. He sounds curious.

  "The instrument is calibrated," I say. "The Anchor is constant."

  "The Anchor is constant," Silas agrees. "But I'm not. You're measuring how much the Anchor bothers me, not how much my life bothers me." He taps his chest. "I live in a vice, sir. Every breath is a negotiation. But I stopped counting the cost years ago. If I counted it, I'd stop breathing. So I adapted. Now your machine says I don't need help because I learned how to drown without panicking."

  I lean back. This is the part they train us for. The temptation is to apologize. To say the system is blind. But the system isn't blind; it's transparent.

  "Mr. Silas," I say. "If I deny you the treatment based on my intuition that you suffer more than the numbers say, I am making a comparison. I am deciding your pain is heavier than hers. I just aren't writing down the weights."

  "So write them down correctly," he says.

  "I can't see inside your chest. I can only see what you trade. You traded fifteen Anchors for a week of your life. She traded four hundred. If I give the treatment to you, I am saying her four hundred counts for less than your fifteen. Why? Because you've been suffering longer? Because you're stoic?"

  "Because I'm broken," Silas says. "And she's just... interrupted."

  Elara opens her eyes. "Interrupted?" Her voice is brittle. "I can't hold a cup. I can't wipe my own face. Don't tell me I'm interrupted."

  "You know who you were," Silas says to her. "You remember the world before the press. I don't. I was six when the mine shook. I don't know what full lungs feel like. I'm not missing anything. I'm just... here. And I'm happy. I have a wife. I sing in a choir. The pain is just the price of the ticket."

  "And that's the loss of information," I say. I didn't mean to say it, but it's there.

  Silas looks at me. "Excuse me?"

  "The adaptation," I say. "You argue that your happiness proves you don't need the treatment. But the Bureau's position is that your happiness proves you've lost the data required to claim it. You've normalized the deficit. If we treat you, what do we gain? You say you're happy. If we fix your lungs, you might be happier, but you can't quantify that margin. You've lost the baseline."

  Elara speaks up. "I haven't lost the baseline. I remember. Every day I remember. That's why my number is high. Because I know what I'm missing."

  "Exactly," I say. "The system prioritizes the marginal utility of restoration. For you, Elara, restoration returns you to a known baseline. For him, it creates a new state he cannot anticipate. The risk of wasted resources is lower with you."

  "So I'm penalized for coping," Silas says.

  "You're penalized for inaccessibility," I correct. "We make these comparisons every day. When a triage nurse decides who gets the ventilator, she's running this math in her head. She's guessing who suffers more, who lives better. Refusing to produce a number doesn't avoid the comparison, Mr. Silas. It just makes it unexaminable. I can show you this form. I can show you the 84.6 versus the 11.2. If I go with my gut, I can't show you anything. I just say 'No.'"

  Silas looks at the Anchor box. "During the cycle," he says quietly. "It felt... good."

  I stop typing. "Excuse me?"

  "The pressure," Silas says. "It hurt, yes. But it was a clean hurt. Specific. Localized. My chest is a diffuse ache, always. The Anchor was sharp. For thirty seconds, I knew exactly where I was hurting. It was a relief. I think... I think I'd trade more to keep the Anchor than to avoid it."

  Elara stares at him. "That's insane."

  "It's data," I say. I type this into the notes field. *Claimant B reports positive valence during Anchor exposure.*

  This is the interesting wrongness. The number 11.2 isn't just low because he's happy. It's low because the Anchor, the very unit of measurement, functions differently on his physiology. For him, the Anchor is a contrast agent that highlights his normal pain, making the normal pain feel manageable by comparison. For Elara, the Anchor is just more pain piled on pain. The currency is inflated for her and deflated for him.

  "So the number is wrong," Silas says.

  "The number is accurate to the protocol," I say. "The protocol assumes the Anchor is negative for all subjects. You are an outlier. But," I pause, looking at the treatment slot availability on the screen. "The treatment requires post-op compliance. Physical therapy. Pain management. It requires a patient who perceives their current state as unacceptable."

  I look at Silas. He is smiling again. Not defensively. He genuinely likes his life.

  "If I give you the treatment," I say, "and you spend six months in agony learning to breathe, and you end up exactly as happy as you are now... I have wasted a slot. If I give it to her," I gesture to Elara, "and she spends six months in agony learning to grip, and she ends up able to hold her daughter's hand... the utility gain is visible."

  "So you're saying my happiness is a liability," Silas says.

  "I'm saying your happiness is a sunk cost," I reply. "You've already extracted the maximum value from your situation. She hasn't."

  Silas nods slowly. He stands up. He doesn't look defeated. He looks like a man who has just confirmed the price of his own resilience. "I suppose someone has to pay the tax on being okay."

  "Mr. Silas," I say, before he turns to the door. "For the record. The form allows for an addendum. Regarding the Anchor valence."

  He shakes his head. "No. If you change the number, you change the decision. And honestly?" He looks at Elara, who is staring at her prosthetic hands as if they might already be flesh. "She needs it more. I can sing with half-lungs. She can't hold a child with no hands."

  "That's not the metric," I say.

  "It is today," he says.

  He leaves. The door clicks shut. The room smells of ozone again. Elara is looking at me, waiting for the stamp.

  I hover the cursor over the adjudication field. The numbers are wrong. They don't measure suffering; they measure the capacity to register deviation from a baseline. Silas has moved his baseline so far into the dark that light looks like noise. Elara is still standing in the light, screaming about the shadow.

  But the decision isn't obviously wrong. The treatment will work on her. It will fail to improve his quality of life because his quality of life is internally generated, not mechanically dependent. The Bureau wants results. I want auditability.

  I click *Approve*.

  "Sign here," I say.

  Elara signs. Her signature is a jagged line, drawn by a claw. It looks like a wound. It looks like a start.

  "Next case," I say to the empty room, pulling the file for the mother and the child who can't speak. The Anchor box hums, cooling down, ready to bruise someone else's arm to prove they exist.
