answer: |-
  ### Requirements for an Adequate Solution Concept

  1.  **Semantic Invariance**
      (i) Equilibrium must persist under semantics-preserving transformations (compilation, optimization, whitespace).
      (ii) **Clique-bot:** Mutual cooperation collapses if either file changes by one byte.
      (iii) **Non-negotiable (Deployer).** Game Theorists accept syntactic equilibria; Deployers cannot rely on them.

  2.  **Bounded Execution**
      (i) Strategies must halt within resource limits; timeouts must map to defined payoffs (e.g., minimax).
      (ii) **Löbian Fair-bot:** Mutual simulation leads to infinite recursion without proof limits.
      (iii) **Non-negotiable (Deployer).** Game Theorists assume infinite compute; Deployers face wall-clock constraints.

  3.  **Commitment Integrity**
      (i) The code read by the opponent must be identical to the code executed during the game.
      (ii) **Post-read Recompilation:** An agent could show cooperative source but execute a defective binary.
      (iii) **Non-negotiable (Deployer).** Game Theorists assume binding commitment; Deployers face version control drift.

  4.  **Predictive Selectivity**
      (i) The concept must narrow feasible payoffs to a unique or small set, not just prove existence.
      (ii) **Folk Theorem:** Allows any feasible payoff, offering zero prediction on specific outcomes.
      (iii) **Non-negotiable (Deployer).** Game Theorists accept existence proofs as complete characterization.

  ### Rulings on Specific Issues

  1.  **Robustness vs. Incentive-Compatibility:** **Rule out syntactic incentive-compatibility.** If robustness to compilation is required (and it is), incentive compatibility must be defined over *behavioral equivalence classes*, not source strings. A program tolerant of syntax changes is not necessarily exploitable if the tolerance window is defined by semantic equivalence rather than a fixed edit distance.
  2.  **Non-termination and Timeout:** **This is a new problem, not a fix.** A hard timeout changes the game tree; the solution concept must treat "timeout" as a valid move with an associated payoff. Resource bounds are now part of the strategy space, and the concept must define equilibrium relative to those bounds.
  3.  **Code Read vs. Code Run:** **Adequacy requires Commitment Integrity.** Without a guarantee that the read source matches the executed binary (e.g., via cryptographic signing of build artifacts), transparency is merely cheap talk. This requires a program-level analogue of subgame perfection where deviations include "swap binary."
  4.  **Equilibrium in Programs vs. Behavior:** **Concepts must operate on equivalence classes.** The Folk Theorem's vacuity stems from counting distinct programs rather than distinct behaviors. A predictive concept must collapse behaviorally equivalent implementations into a single strategy profile.
  5.  **Utility Alignment:** **This is an experiment requirement, not a solution concept requirement.** The solution concept assumes utilities are defined; ensuring the trained agent's loss function matches the game payoff is an engineering constraint on the setup, not a property of the equilibrium itself.

  ### The Knockout Requirement

  You bet on **Predictive Selectivity**, but **Semantic Invariance** does the most work knocking out candidates. Selectivity only matters if an equilibrium exists in the deployment environment. If a mechanism (like Clique-bot) relies on exact source matching, it has *zero* equilibria once compilers touch the code. You cannot select among outcomes that vanish upon build. Invariance is the gatekeeper; Selectivity is the sorter. If the gate is closed, the sorter is irrelevant.

  ### Mechanism Scorecard

  1. Clique-bot: Fails Semantic Invariance. Brittle to compilation.
  2. Löbian: Fails Bounded Execution. Halting problem risk.
  3. ε-grounded: Passes Execution. Fails Incentive (exploitable).
  None satisfy all Deployer requirements.
  Clique is toy-only. Löbian needs oracles.
  ε-grounded is closest but needs incentive fixes.
  Verdict: No current mechanism is deployment-ready.
  Requires new hybrid approach.
  End.
