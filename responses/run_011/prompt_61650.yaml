answer: |-
  This is a remarkably sharp observation. You have identified a structural feature of the debate that is rarely named because it operates at the level of *methodology* rather than *conclusion*. Both sides claim to be running the same scientific algorithm, but they have installed different operating systems.

  Here is the carving you are looking for.

  ### The Closest Existing Fit
  The concept from decision theory that comes closest is **Asymmetric Loss Functions**.

  In statistics and engineering, a "loss function" calculates the cost of being wrong. If you are designing a bridge, the cost of a false positive (building it when it's unsafe) is catastrophic, so your loss function is asymmetric: you demand massive proof of safety. If you are designing a drug, the cost of a false negative (rejecting a cure) might be weighted differently.

  **Why it fits:** It captures the idea that the two camps weigh errors differently. The conservationist fears the error of destroying value (Type I error); the welfare advocate fears the error of permitting suffering (Type II error).
  **Why it fails:** "Loss function" describes the *math* of the decision, but it doesn't capture the *phenomenology* you described. It doesn't explain why each side believes *their* asymmetry is the neutral, objective standard. It misses the invisibility of the bias.

  ### The Coined Term
  I propose you call this **The Normative Null**.

  **Definition:**
  > **The Normative Null** occurs when a value judgment is inserted into the default position of an argument (the "null hypothesis") but is treated as a methodological necessity. One side treats existence as the default good (requiring proof of harm to intervene); the other treats existence as the default risk (requiring proof of benefit to sustain). Both claim they are simply "following the evidence," but the evidence is being filtered through an unacknowledged ethical baseline.

  **Why this works for your piece:**
  1.  **"Null"** borrows from the **Null Hypothesis** ($H_0$), the scientific standard of assuming "no effect" until proven otherwise. This signals to the reader that this is about *scientific process*, not just opinion.
  2.  **"Normative"** signals that the default is actually a *value* (an "ought"), not a fact (an "is").
  3.  **It avoids ambush:** It doesn't accuse either side of lying (motivated reasoning) or cheating (special pleading). It accuses them only of failing to label their own axioms. A conservationist can accept they hold a "Presumption of Value" without admitting they are unscientific; a welfarist can accept they hold a "Presumption of Suffering" without admitting they are misanthropes.

  ### The Carving: Where does it start and stop?
  You asked where this ends and ordinary disagreement begins. Here is the boundary line:

  *   **Ordinary Value Disagreement:** "I value biodiversity more than you do." (This is transparent. Both sides know they differ on values.)
  *   **Ordinary Evidence Disagreement:** "I think this study shows suffering is low; you think it shows suffering is high." (This is transparent. Both sides know they differ on data interpretation.)
  *   **The Normative Null:** "We agree on the data and we agree suffering matters, but I require *you* to prove this life is worth living, while you require *me* to prove this life is not." (This is the pattern. The disagreement is about **who has to speak first**.)

  The pattern starts when the **burden of proof flips** while both parties claim the burden is in its **natural resting place**. It stops when either party acknowledges, "I am placing the burden here because I am more afraid of X error than Y error."

  ### Is it a Reasoning Failure?
  This determines your ending.

  **It is not a reasoning failure; it is a Category Error.**

  It is **rational** (correct) for them to have different burdens of proof if they have different fundamental values. If you believe wild existence is inherently precious, you *should* demand high proof before destroying it. If you believe wild existence is inherently risky, you *should* demand high proof before sustaining it. That is consistent ethical reasoning.

  The failure is **epistemic**, not ethical. It becomes a failure only when they claim their burden of proof is dictated by *nature* rather than *values*. When the conservationist says, "Science requires us to preserve this," they are hiding a value behind a method. When the welfarist says, "Logic requires us to prevent this birth," they are doing the same.

  **The Ending:**
  If you frame it as **The Normative Null**, your piece doesn't end with one side winning. It ends with a challenge to **methodological honesty**. The path forward isn't for one side to convince the other of their data, but for both to explicitly state their Null: *"I am operating under a Presumption of Value"* vs. *"I am operating under a Presumption of Suffering."*

  Once the Nulls are visible, the debate shifts from "Who is doing the science right?" to "Which default assumption do we, as a society, want to adopt?" That is a political and ethical question, not a scientific one. And that is where your piece lands: not on a resolution, but on a clarification that allows the real argument to begin.
