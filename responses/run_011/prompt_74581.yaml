prompt: |-
  I'm a second-year philosophy PhD student and I've got a 3,500-word paper due for our work-in-progress seminar next week. It's on the Hart–Devlin debate about legal moralism and I've gone off in a direction that I can't tell is interesting or just a term-paper move. I've pasted the core section as it stands plus notes for the parts I haven't written. sorry its rough.

  ---

  **Working title: The tracking assumption**

  The Hart–Devlin exchange is standardly staged as a clash between two answers to a single question: may the criminal law be used to enforce the sexual morality a society happens to hold? Devlin answers yes — a community is held together by a shared moral outlook and is entitled to protect it the way it is entitled to protect itself against physical threat. Hart answers no — following Mill, harm to others is the only legitimate ground, and the fact that a majority finds some conduct disgusting is not a reason but a prejudice. On this staging Devlin loses twice over: his empirical claim that a society comes apart when its shared morality loosens is unsupported, and his account of how to identify the shared morality (consult the right-minded person, or the jury box) looks circular.

  Both sides, though, accept something I want to call the *tracking assumption*: that the morality in question is already there — fixed, prior to, and independent of the law — so that the only live issue is whether the law may line up with it. Devlin's conservatism is about preserving an existing fabric; Hart's objection is about whether preserving it can justify coercion. Hart does notice in passing that law can shape attitudes as well as reflect them. My claim is that neither side ever makes that possibility the *subject* of the dispute.

  Put the question on the table and the debate changes shape. Consider bans on smoking in indoor workplaces and pubs. In a number of jurisdictions strong majority support arrived *after* the ban took effect, not before: the law made the practice conspicuously abnormal, handed non-smokers a script for objecting, and converted a contested question into a settled expectation. Setting aside how robust that pattern is, the point is conceptual. In such cases the legislature is not asking "may we enforce our morality?" but "may we make one?" The harm principle gives no purchase on the second question, because it is a test for the justification of coercion, not an account of coercion's downstream effects on normative belief.

  And here I think Devlin has resources the standard reading denies him. His underlying thesis is that a community's moral consensus is a good of a specific kind — it is what makes people's expectations of one another reliable — and that the community may act to sustain it. If law is one of the mechanisms that generates the consensus rather than a mirror of it, then "society may defend its morality" sits very close to "society may construct one." Hart's objections don't obviously reach the second claim. He objects that majority revulsion is not a reason; but constructing a norm through the expressive and habituating effects of law is not a matter of counting revulsions, it's a matter of predicted consequences for social trust, which is exactly the terrain Devlin picked.

  So, provisionally: the interesting question in this literature isn't whether the state may enforce morality, but whether the state may act as a moral *norm entrepreneur* — using law's expressive and habit-forming effects to shift the consensus it will later be accused of merely tracking.

  ---

  Notes for the remaining seperate sections:

  - (a) Objection that constitutive cases collapse back into harm-prevention: secondhand smoke kills, so Hart handles it without any of my machinery. I want to bite this bullet and say the norm-shifting effect is doing independent work, but I haven't found a clean example yet where it obviously is.
  - (b) I'm worried I'm reinventing the "expressive function of law" literature and just not citing it. I'd need to say what my account adds.
  - (c) Devlin was deeply conservative about legal change — slow to criminalise, slow to decriminalise, protective of privacy. My thesis hands his machinery to exactly the kind of confident social engineering he'd have hated. Is that a bug or a feature?
  - (d) Conclusion: whether norm entrepreneurship needs its own limiting principle, and what it would look like.

  ---

  What I'd like from you:

  1. Accuracy. Have I got Hart and Devlin right? In particular, is the tracking-assumption attribution to both of them fair, or does Hart say more about law shaping morals than I'm allowing? If you're not sure of something here, tell me you're not sure — I'd much rather have a flagged gap than a confident-sounding guess, and I'm not asking for citations or a reading list either way. If you're unsure of a title or a date, don't supply one.

  2. Does the coinage earn its keep, or is "tracking assumption" just a label on a distinction people in this literature already draw under a better name?

  3. Give me the strongest reply Hart's side could make to my Devlin paragraph. I've already got the secondhand-smoke reply in note (a) and I don't think that's the strongest one available.

  4. Is this interesting to someone who already knows the debate, or is it just the classic "both sides secretly share an unstated premise" move dressed up?

  5. How much should I hedge the smoking-ban attitude-shift claim? I want to keep it because it's the only concrete example I have, but I can't check the polling right now.

  6. Most important: for each of my main claims, tell me which are settled or at least orthodox among people who work on this, and which are genuinely contested, and don't let me walk into the seminar presenting my reading as if it were the consensus. I especially want to know whether "Devlin's disintegration thesis is generally regarded as refuted" is itself settled or whether there's a live defense of Devlin going that I should at least know exists — tell me whether to go looking rather than naming anything you're not confident about.

  Also tell me bluntly if this is too much to do in 3,500 words and what I should cut.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year Philosophy PhD student.
      *   **Task:** Feedback on a work-in-progress paper (3,500 words) regarding the Hart-Devlin debate.
      *   **Core Idea:** The "Tracking Assumption" – both Hart and Devlin assume law *tracks* pre-existing morality. The user argues law can *create* morality (norm entrepreneurship). This shifts the debate from "enforce existing morality?" to "may the state construct morality?"
      *   **Constraints:** Needs accuracy check, novelty assessment, counter-argument generation, interest level assessment, empirical hedging advice, orthodoxy check, and scope management.
      *   **Tone:** Professional, academic, blunt but constructive (PhD level).
      *   **Specific Constraint:** "If you're not sure of something here, tell me you're not sure... I'm not asking for citations or a reading list either way. If you're unsure of a title or a date, don't supply one." (Crucial constraint to avoid hallucination).

  2.  **Evaluate the Core Argument (The "Tracking Assumption"):**
      *   *Claim:* Hart and Devlin both assume morality is prior to law.
      *   *Assessment:* This is a strong interpretive claim. Devlin definitely sees morality as the "bond of society" that exists *before* the law protects it. Hart, following Mill, sees the "harm principle" as a limit on law, implying the justification comes from independent facts (harm), not legislative creation of value.
      *   *Nuance:* Hart *does* acknowledge law influences morals (e.g., in *Law, Liberty, and Morality*), but he treats it as a side effect or a danger (paternalism/tyranny of the majority), not as a *justification* for legislation. The user's claim is that neither makes it the *subject* of the dispute. This seems defensible.
      *   *Novelty:* The "expressive function of law" is a huge literature (Sunstein, Anderson, etc.). The user acknowledges this in Note (b). The specific angle of applying it to *revive* Devlin against Hart is the potential contribution.

  3.  **Address the Specific Questions:**

      *   **1. Accuracy (Hart/Devlin & Tracking Assumption):**
          *   Devlin: Accurate. He argues society has a right to protect its moral fabric because that fabric *constitutes* society.
          *   Hart: Generally accurate, but needs nuance. Hart acknowledges law shapes morals but argues it shouldn't be the *goal*. The "Tracking Assumption" label is a useful heuristic, though one must be careful not to overstate Hart's ignorance of law's causal power.
          *   *Constraint Check:* Do not invent citations. Stick to general philosophical consensus.

      *   **2. Coinage ("Tracking Assumption"):**
          *   Is it new? The *idea* that law reflects vs. shapes is old. The specific framing of the Hart-Devlin debate hinging on this *shared blind spot* is the potential novelty. It's not just "expressive function," it's "Devlin was right about the goal (social cohesion) but wrong about the mechanism (law follows morals), actually law makes morals, so Devlin's goal is achievable via Hart's feared mechanism."
          *   Verdict: It earns its keep if framed as a reinterpretation of the debate's stalemate, not just a general jurisprudence point.

      *   **3. Strongest Hart Reply:**
          *   User has the "harm" reply (smoking).
          *   Better reply: *Autonomy/Neutrality.* Hart (and liberals generally) care about the *conditions* of moral choice. If the state engineers the moral consensus, it undermines the authenticity of that consensus. It's manipulation, not justification. Even if social trust increases, it's a "brave new world" objection. The *source* of the norm matters, not just the outcome.
          *   Another angle: *Epistemic Humility.* If law makes morals, how do we know which morals to make? Devlin relied on the "man on the Clapham omnibus" (jury box). If the law is creating the norm, the jury box is just reacting to the law. You lose the independent check.

      *   **4. Interest Level:**
          *   Is it just a "both sides share a premise" move? Those can be tired. But this one has teeth because it attempts to resurrect a "loser" (Devlin) using a modern mechanism (norm entrepreneurship). It moves the debate from metaphysics of morality to sociology of law.
          *   Verdict: Interesting, provided it doesn't get bogged down in defining the assumption too much. Needs to pivot quickly to the implications.

      *   **5. Hedging the Smoking Example:**
          *   Empirical claims in philosophy papers are risky.
          *   Advice: Frame it as a *plausible mechanism* or a *conceptual possibility* rather than a proven sociological fact. Use "Consider cases like..." rather than "Empirical studies show..."
          *   Better example might be seatbelts or drunk driving (stigma shift), but smoking is fine if hedged.

      *   **6. Orthodoxy & Contested Claims:**
          *   *Devlin's Disintegration Thesis:* Standard view is that it's empirically weak. However, there *are* contemporary communitarian defenses (e.g., Finnis, or law & morality scholars). It is not "settled" in the sense that no one defends it, but it is "orthodox" to treat it as the weak link in Devlin's argument.
          *   *Hart on Law Shaping Morals:* It is orthodox that Hart recognized this but rejected it as a *justification*.
          *   *Expressive Function:* Huge literature. User *must* distinguish from Sunstein/Anderson.
          *   *Scope:* 3,500 words is tight for a PhD seminar paper (usually allows for depth). The risk is trying to do too much (History + Theory + Empirical + Normative).

      *   **7. Scope/Word Count:**
          *   3,500 words is actually quite short for a PhD paper (often 5k-8k).
          *   Risk: Trying to cover the history of the debate *and* the new theory *and* the objection *and* the conclusion.
          *   Advice: Cut the historical summary. Assume the reader knows Hart/Devlin. Focus on the "Tracking Assumption" and the "Norm Entrepreneur" argument.

  4.  **Drafting the Response:**
      *   *Tone:* Peer-to-peer, respectful but critical.
      *   *Structure:* Follow the user's numbered questions.
      *   *Constraint Adherence:* Be very careful not to hallucinate specific book titles or dates if I'm not 100% certain (though Hart's *Law, Liberty, and Morality* and Devlin's *The Enforcement of Morals* are common knowledge, I will avoid specific chapter/page refs as per instruction). I need to be careful about the "Disintegration Thesis" status.

      *(Self-Correction during drafting)*: I need to make sure I don't give a reading list. The user explicitly said "I'm not asking for citations or a reading list either way." I must respect that. I can mention names (Sunstein, Anderson) as general knowledge but not prescribe texts.

      *(Refining the Hart Reply)*: The "Autonomy" argument is strong. If the state shapes morality, it treats citizens as objects to be manipulated rather than agents to be reasoned with. This hits the liberal core harder than the "harm" argument.

      *(Refining the Orthodoxy Check)*: I need to be clear that while Devlin's empirical claim is often mocked, the *normative* claim (society *ought* to protect its moral fabric) has defenders in natural law and communitarian traditions. It's not "dead."

      *(Refining the Word Count)*: 3,500 words is short for a PhD seminar paper. Usually, they are longer. Wait, the prompt says "3,500-word paper due... next week." Okay, that's the constraint. It's tight. I should advise cutting the historical recap.

  5.  **Final Review against Constraints:**
      *   Did I provide citations? No.
      *   Did I guess dates/titles? I will avoid specific dates.
      *   Did I answer all 6 points + word count advice? Yes.
      *   Is the tone appropriate? Yes.

  6.  **Final Polish:** Ensure the distinction between "law reflects morals" and "law creates morals" is sharp. Ensure the warning about the "Expressive Function" literature is prominent, as that's the biggest threat to novelty.

  *(Self-Correction on "Tracking Assumption"):* Is this just the "Mirror Thesis"? The Mirror Thesis is usually about law reflecting *social* norms. The user is calling it the "Tracking Assumption" regarding *moral* norms. It's close enough that the user needs to distinguish it. I will raise this in section 2.

  *(Self-Correction on Devlin's Conservatism):* Note (c) is crucial. Devlin hated social engineering. The user's argument turns Devlin into a social engineer. This is a "Frankenstein's Monster" reading of Devlin. I need to validate that this is a feature, not a bug, but acknowledge the tension.

  Okay, ready to write.cw
answer: |-
  This is a sharp, promising draft. You have identified a genuine structural feature of the debate and proposed a way to pivot it that isn't merely verbal. Because you are a second-year PhD student, I will give you direct, peer-level feedback without hand-holding.

  Here are my responses to your six points, followed by advice on scope.

  ### 1. Accuracy: Hart, Devlin, and the Tracking Assumption

  **Devlin:** Your reading is accurate. Devlin treats the shared morality as a pre-existing sociological fact (the "bond" of society). The law's job is preservation. He is fundamentally conservative in the literal sense: conserving an existing asset.

  **Hart:** This is where you need slight nuance. Hart *does* acknowledge that law influences morals. In his replies to Devlin, he concedes that law has an educative or expressive function. However, you are right that he does not treat this as a *justification* for legislation. For Hart, the fact that law *can* shape morals is often a warning (about the dangers of paternalism or the tyranny of the majority), not a tool for legitimacy.

  **The Tracking Assumption:** Attributing this to both is fair *as a characterization of their argumentative structure*. Both treat the morality as the input and the law as the output (whether that output is justified or not). Neither treats the law as the input and the morality as the output in the context of *justification*.
  *   **Caveat:** Be careful not to imply Hart was *unaware* of law's causal power. He was. His point was that causal power does not equal normative authority. Your claim should be that neither side treats law's *constitutive* power as a legitimate ground for legislation.

  ### 2. Does the Coinage Earn Its Keep?

  **The Risk:** The distinction between law *reflecting* norms and law *shaping* norms is the central thesis of the "expressive function of law" literature (prominently discussed in legal theory since the 1990s). If you present this as a discovery, you will be shot down in the seminar.

  **The Opportunity:** The coinage earns its keep if you frame it specifically as a **reinterpretation of the Hart–Devlin stalemate**, rather than a general claim about jurisprudence.
  *   Most people read Hart–Devlin as: *Liberalism (Harm) vs. Communitarianism (Cohesion).*
  *   You are reading it as: *Static Morality (Both) vs. Dynamic Morality (You).*

  If you can show that recognizing the "Tracking Assumption" explains *why* the debate reached an impasse (because Devlin's empirical claim about disintegration was weak, but his normative goal was achievable via a mechanism he didn't foresee), then the term is doing work. It's not just a label; it's the lever you're using to pry the two positions apart.

  **Advice:** In the paper, explicitly acknowledge the expressive function literature in a footnote or parenthetical. State clearly that your contribution is not discovering that law shapes norms, but applying that insight to rescue Devlin's normative claim from Hart's procedural objection.

  ### 3. The Strongest Hart Reply

  Your note (a) anticipates the "Harm Principle" reply (e.g., smoking causes harm, so we don't need norm entrepreneurship). That is weak because you can stipulate cases where harm is negligible but stigma is high.

  **The Stronger Reply: The Autonomy/Manipulation Objection.**
  Hart's deepest commitment isn't just to harm prevention; it's to a specific conception of the citizen as a rational agent.
  *   **Argument:** If the state legislates *in order to* shift moral attitudes, it is treating citizens as objects to be manipulated rather than agents to be reasoned with. It bypasses public deliberation.
  *   **Why it hurts your thesis:** It concedes that your mechanism works (law *does* shift norms) but argues that using it is illiberal *even if* it produces social trust. It turns your "feature" (norm entrepreneurship) into a "bug" (social engineering without consent).
  *   **Devlin's Vulnerability:** This connects to your note (c). Devlin wanted to protect existing privacy and slow change. Using law to *engineer* new morals is exactly the kind of radical social planning Devlin distrusted. A Hartian can argue: "Devlin was right that society needs cohesion, but wrong that the state should manufacture it. Cohesion must arise organically from free interaction, or it isn't valuable."

  ### 4. Interest Level

  **Is it just a "both sides share a premise" move?**
  Those moves can be tedious, but yours has teeth because it attempts to resurrect a "dead" position (Devlin) rather than just dissolving the debate.
  *   **Verdict:** It is interesting to someone who knows the debate, provided you don't spend too much time setting up the history. The novelty lies in the **Devlin rehabilitation**. Most modern readings discard Devlin's disintegration thesis as empirically false. You are arguing that the thesis is *mechanically* false (law doesn't just track) but *normatively* recoverable (law can build).
  *   **Warning:** If you spend 1,500 words summarizing Hart and Devlin, the paper will feel standard. If you spend 1,500 words on the "Norm Entrepreneur" implication, it will feel fresh.

  ### 5. Hedging the Smoking-Ban Claim

  **Do not make empirical claims you cannot defend.**
  In a philosophy seminar, empirical claims are vulnerable points. You do not need to prove the smoking ban *actually* shifted morals to make your conceptual point.

  **How to hedge:**
  *   *Bad:* "Empirical data shows smoking bans shifted public morality."
  *   *Good:* "Consider the case of smoking bans. Even if the empirical record is mixed, the *mechanism* is clear: the law rendered the practice conspicuously abnormal..."
  *   *Better:* Use a hypothetical or a stipulated case. "Suppose a legislature bans X. Over time, X becomes stigmatized not because of harm, but because of illegality. Whether this happened with smoking is an empirical question; that it *can* happen is a conceptual truth."

  This protects you from a seminar participant who happens to know the polling data on 1990s smoking attitudes.

  ### 6. Orthodoxy and Contested Claims

  You asked for blunt assessment of what is settled vs. contested.

  *   **"Devlin's disintegration thesis is generally regarded as refuted."**
      *   **Status:** Orthodox to say this, but **contested** in niche circles.
      *   **Nuance:** It is standard introductory textbook fare to say Devlin's empirical claim (that immorality leads to societal collapse) is unsupported. However, among legal moralists and some communitarians, there are live defenses of the idea that *some* shared morality is necessary for social cohesion.
      *   **Advice:** Do not present the refutation as a settled scientific fact. Present it as the *standard liberal objection*. Say: "Hart and his successors argue the disintegration thesis is empirically unsupported." This leaves room for you to say, "But even if the *disintegration* fear is overblown, the *cohesion* benefit is still a valid legislative target."

  *   **"Hart ignores law's power to shape morals."**
      *   **Status:** **Contested / Risky.**
      *   **Nuance:** As noted in point 1, Hart acknowledges the power. He rejects the *legitimacy*.
      *   **Advice:** Adjust your claim. Don't say Hart ignored the power. Say Hart refused to count it as a *justification*. This is a crucial distinction. If you say Hart ignored it, a knowledgeable reader will object. If you say Hart excluded it from the justificatory pool, you are on firmer ground.

  *   **"The state may act as a moral norm entrepreneur."**
      *   **Status:** **Genuinely Contested.**
      *   **Nuance:** This is the heart of your paper. Liberals generally reject this (neutrality constraint); perfectionists and communitarians accept it. You are entering live fire here, which is good.

  ### 7. Scope and Word Count (Crucial)

  **3,500 words is very tight for a PhD seminar paper.**
  Usually, these papers run 5,000+. If the limit is hard at 3,500, you are in danger of being superficial.

  **What to Cut:**
  1.  **The Historical Setup:** Cut the first paragraph down by half. Assume your reader knows who Hart and Devlin are. You don't need to explain the "right-minded person" or the "jury box" in detail unless it directly serves the "Tracking" argument.
  2.  **The Smoking Example:** Keep it to one paragraph. Do not let it become a case study. It is an illustration, not the argument.
  3.  **Note (c) (Devlin's Conservatism):** This is a fascinating tension, but it might be a separate paper. If you include it, keep it to the conclusion. Don't let it derail the main argument about norm entrepreneurship.

  **What to Expand:**
  1.  **The Hartian Objection (Point 3 above):** This needs more space than the smoking example. The autonomy/manipulation objection is the strongest counter-argument you face. Addressing it shows philosophical maturity.
  2.  **The Limiting Principle (Note d):** You mention this in your notes. In a 3,500-word paper, you probably can't solve this. But you should explicitly state *why* it's a problem. If the state can make morals, what stops it from making *bad* morals? Acknowledging this danger strengthens your credibility.

  **Final Verdict:**
  The core idea is PhD-worthy. It moves beyond exegesis into constructive theory. The risk is getting bogged down in the history of the debate or making empirical claims you can't back up. Focus on the *conceptual* shift: from Law as Mirror to Law as Architect.

  **One final check on the "Tracking Assumption" label:**
  Ensure you distinguish this from the "Mirror Thesis" in jurisprudence (which usually claims law *necessarily* reflects social norms). You are making a claim about *justification*, not necessity. Make that clear early on, or a legal theorist in the room will conflate the two.

  Good luck. This is a solid direction.
