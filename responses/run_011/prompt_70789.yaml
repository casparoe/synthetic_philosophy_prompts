  In a support group for users of griefbots, the members argue that since the simulations exhibit perfectly organized mourning, the intentional stance makes them persons rather than counterfeit persons. They insist there is no residue left for the worry about counterfeit persons once the behavior is predictable. The group dissolves when the widows heal but the simulations do not.

  The setup installs the expectation that the intentional stance renders the distinction between person and counterfeit obsolete via behavioral sufficiency. The punchline reverses this by revealing a divergence in long-term patterns that restores the validity of the counterfeit worry based on provenance rather than immediate prediction.
