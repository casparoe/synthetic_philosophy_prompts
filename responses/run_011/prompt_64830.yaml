  **OMNITEMPORAL HERITAGE GROUP**
  *Providing Temporal Depth Since 1842*
  **ORDER FORM & SERVICE CATALOGUE (FY 2024-2025)**

  **CLIENT PROFILE:** [ ] Newly Independent State [ ] Constitutional Monarchy (Rebrand) [ ] Municipal Council (Q3 Slump)

  **CORE PACKAGES**
  All packages include a Style Guide ensuring invariance of ritual performance and guaranteed annual recurrence.

  **1. CIVIC COHESION (Municipal)**
  Includes: One (1) localized founder statue, two (2) annual harvest-adjacent festivals, standardized municipal crest.
  *Deliverable:* Stable local identity suitable for tourism brochures.

  **2. SOVEREIGN NARRATIVE (National)**
  Includes: One (1) national anthem (orchestral stem files included), three (3) public holidays, standardized language grammar rules.
  *Deliverable:* Vertical integration of populace into single political unit.

  **3. DYNASTIC LEGITIMACY (Monarchical)**
  Includes: Genealogical chart (minimum 12 generations), coronation regalia, divine right endorsement (secular-compatible).
  *Deliverable:* Uninterrupted lineage continuity despite documented gaps.

  **INFRASTRUCTURE MODULES**
  Required for all Sovereign and Dynastic clients. Sold as a bundled triad.

  *   **The Census-Shaped Module:** Categorization of population into countable units. Ensures every individual is accounted for within the boundary logic. Includes surname standardization.
  *   **The Map-Shaped Module:** Visual representation of territory with colored borders. Emphasizes land over people. Includes disputed zone shading (optional).
  *   **The Museum-Shaped Module:** Physical repository for selected artifacts. Curates debris of the past into a logical sequence leading directly to the current administration.

  **SCHEDULING & SIMULTANEITY SERVICES**
  **Protocol 88-B:** Broadcast scheduling service ensuring the entire population consumes the same media content at the exact same hour.
  *Utility:* Generates the psychological sensation of community while each citizen remains physically isolated in their private residence.
  *Requirement:* National broadcast monopoly or mandatory streaming protocol.

  **À LA CARTE ADD-ONS**

  **Suitable Historic Past (Per Century)**
  Clients may purchase additional historical depth to enhance legitimacy.
  *   *50–100 Years:* $50,000
  *   *100–500 Years:* $250,000
  *   *500+ Years:* Price on Application (Requires archaeological planting)

  **The Unknown Occupant Monument (Premium)**
  A cenotaph containing no identifiable remains.
  * Selling Point: Allows every citizen to project their own losses onto the structure.
  * Upsell: "Eternal Flame" fuel contract (20-year minimum).

  **STYLE GUIDE & TERMS OF SERVICE**

  **1. Vocabulary Restrictions**
  In all client-facing deliverables, press releases, and educational materials, the words "invented," "imagined," "constructed," or "fabricated" are strictly prohibited. Approved synonyms include: "Rediscovered," "Revitalized," "Organic," "Timeless."

  **2. Warranty on Authenticity**
  Omnitemporal Heritage Group warrants all traditions against exposure as recent innovations for a period of fifty (50) years. If a tradition is publicly debunked by academic consensus within this window, we will issue a credit note or supply a replacement narrative involving a different historical figure. Warranty void if client attempts to enforce tradition via excessive violence prior to cultural saturation.

  **3. Belief Guarantee**
  While we guarantee the *performance* of tradition, Omnitemporal Heritage Group cannot guarantee internal belief past the third generation. Sociological data indicates a decay rate of 4% per generation once the founding cohort passes. Clients are advised to purchase the "Educational Curriculum" add-on to mitigate this attrition.

  **4. Liability**
  The Firm is not liable for civil unrest caused by border discrepancies in the Map-Shaped Module or demographic exclusion errors in the Census-Shaped Module.

  **AUTHORIZED SIGNATURE:** ___________________ **DATE:** ___________________

  **ACCOUNT CODE:** ___________________ **PO NUMBER:** ___________________

  *Please remit 50% deposit upon signing. Remaining balance due upon first successful national observance.*
