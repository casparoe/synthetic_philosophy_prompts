answer: |-
  The dialectic we have been handed is elegant, but it rests on a measurement error. The standard narrative suggests that the leveling-down objection delivers a fatal blow to telic egalitarianism, leaving prioritarianism as the sole viable successor. I argue that this inference is invalid. Even granting that the leveling-down objection successfully refutes the claim that equality is intrinsically valuable, it does nothing to establish prioritarianism. This is because the content of the priority view depends on a scale of well-being with a non-arbitrary zero, and no such scale is available. Consequently, prioritarianism is ill-defined on the standard assumptions of welfare measurement, stripping the leveling-down objection of its positive dialectical force and leaving relational views with a structural advantage their rival lacks.

  To see why the move to prioritarianism is unwarranted, we must first state the leveling-down objection with precision. The telic egalitarian holds that equality is intrinsically good; thus, Outcome A (equal well-being) is better than Outcome B (unequal well-being) in at least one respect, even if A is worse for everyone. The leveling-down objection targets this "in some respect" claim. It posits a scenario where we can only achieve equality by making the better-off worse off, without benefiting the worse-off. The objector insists that such a change cannot be an improvement in *any* respect. If no one is better off, and some are worse off, the outcome cannot be better, not even partially.

  However, note the logical gap. Suppose the objector succeeds. They have established that equality cannot be the *only* value, or perhaps that it is not a value at all. But this negative result does not entail prioritarianism. To reach the priority view, one requires a further, substantive premise: that the only thing that matters morally is the absolute level of well-being, weighted by urgency, and that relations between persons carry no independent weight whatsoever. The leveling-down objection merely clears the field of *telic* egalitarianism; it does not build the house of prioritarianism. It rules out one specific form of relational value, but it does not prove that *all* relational values are illusory. Without an independent argument for the irrelevance of relations, prioritarianism remains merely one contender among several, not the default refuge.

  Yet, let us grant the objector their strongest case: suppose we agree that relations do not matter intrinsically. Prioritarianism still faces a fatal internal defect regarding the measurement of well-being. The prioritarian ranks outcomes by summing a strictly increasing, strictly concave transformation of individual well-being levels. This mathematical structure is sensitive to the zero point of the well-being scale.

  In social choice and welfare economics, it is standard to treat well-being as measurable only up to positive affine transformation. This means that if a function $u$ represents a person's well-being, then $u' = au + b$ (where $a > 0$) represents the same facts. The unit ($a$) and the zero ($b$) are arbitrary conventions. Utilitarianism is indifferent to these choices for fixed populations. Adding a constant $b$ to every person's score increases the total sum by $nb$, leaving the ranking of outcomes untouched. Prioritarianism is not indifferent. Because the weighting function is concave, the marginal moral value of a benefit diminishes as well-being increases. Shifting the zero point shifts everyone up the curve, altering the slope and thus the weight assigned to benefits.

  Consider the example provided. We compare an equal outcome (10, 10) against an unequal one (19, 2). Using a square-root weighting function, the equal outcome yields $\sqrt{10} + \sqrt{10} \approx 6.32$, while the unequal yields $\sqrt{19} + \sqrt{2} \approx 5.77$. Prioritarianism prefers equality. Now, apply a uniform upward shift of 100 units. This is merely a re-representation of the same underlying welfare facts on an interval scale. The scores become (110, 110) versus (119, 102). The priority values are now $\sqrt{110} + \sqrt{110} \approx 20.98$ against $\sqrt{119} + \sqrt{102} \approx 21.01$. The ranking reverses. The prioritarian now prefers the unequal outcome.

  This is not a minor technicality; it is a contradiction. If well-being is interval-scaled, the two pairs of numbers describe the exact same worlds. A moral theory that assigns incompatible orderings to one and the same pair of worlds is defective. The defect differs from the one Parfit presses against the egalitarian. Parfit argues egalitarianism implies a counterintuitive value judgment. The scale problem argues that prioritarianism fails to generate a determinate judgment at all. It renders the view undefined unless one can identify a natural zero.

  Three replies are available to the prioritarian, but none rescue the view without significant cost.

  First, one might argue that hedonism or a similar account supplies a natural zero. If well-being consists of pleasure minus pain, perhaps a neutral state constitutes a true zero. If so, the scale is ratio-scaled, and the zero is non-arbitrary. This reply fails outright as a general defense. Prioritarianism is typically presented as a freestanding distributive principle compatible with various theories of welfare, including preference satisfaction and objective list theories. On a preference account, there is no non-arbitrary zero; satisfaction is ordered, but the "absence" of preference satisfaction is not a metaphysical null point. Even in hedonism, the notion of a neutral life is contentious. If the priority view collapses when detached from hedonism, it loses its claim to be the general alternative to egalitarianism. It becomes a niche view contingent on a specific, disputed metaphysics of mind.

  Second, the prioritarian might concede that well-being is not naturally ratio-scaled but insist they are entitled to build the choice of scale into the substantive content of the view. They can stipulate that the moral zero is, say, the level of well-being at which a life is barely worth living. This forces a qualification the position can absorb, but at the price of demanding a metaphysics of well-being that many find implausible. It requires us to believe that there is a metaphysically privileged point on the welfare scale that triggers moral weighting, independent of our measurement conventions. This makes the moral theory parasitic on a solution to the measurement problem that welfare economics suggests is unsolvable. It transforms prioritarianism from a structural insight about distribution into a contentious claim about the ontology of welfare.

  Third, one might argue that if scale-dependence is disqualifying, it threatens every view sensitive to absolute levels, sufficientarian thresholds most obviously, so the argument proves too much. It is true that sufficientarianism also requires a non-arbitrary zero to locate the threshold. However, this objection misses the dialectical context. Prioritarianism is proposed as the *default* successor to egalitarianism, a comprehensive framework for distribution. If it fails on measurement, it cannot occupy that default position. Sufficientarianism is already a niche view with its own distinct burdens. Moreover, the fact that other views share a vulnerability does not exonerate prioritarianism; it merely spreads the error. If the standard dialectic relies on a measurement assumption that renders the proposed solution incoherent, the dialectic itself is broken.

  This brings us to the upshot for the choice between the two views. Does this argument merely strip the leveling-down objection of its dialectical force, or does it leave the egalitarian with some positive advantage? It does the latter. The scale problem highlights a structural asymmetry between weighted sums and relational measures. While prioritarianism is sensitive to the zero point, certain gap-based egalitarian measures are not.

  Consider an egalitarian metric that minimizes the sum of pairwise differences or the ratio of well-being levels. A difference measure, $\sum |u_i - u_j|$, is invariant to the zero shift $b$, because $(u_i + b) - (u_j + b) = u_i - u_j$. It is also invariant to the unit $a$ if we are only ranking outcomes (since $a$ factors out of the comparison). Similarly, a ratio measure $u_i / u_j$ is invariant to the unit $a$, though it requires a ratio scale. However, if we formulate egalitarianism as minimizing the variance or the mean difference, these are fully invariant under positive affine transformations. They depend only on the relative spacing of well-being levels, not their absolute location.

  This means that gap-based egalitarianism can survive the measurement objection that kills prioritarianism. An egalitarian can say: "I do not need to know where zero is to know that this distribution is more unequal than that one. I only need to know the intervals." The prioritarian cannot say this. They must know where the agents sit relative to the moral zero to determine the weight of their claims.

  My co-presenter might attempt to turn this back against me by arguing that scale-invariant egalitarian measures are morally inferior because they ignore the absolute urgency of need. They might claim that helping a person at level 10 is more urgent than helping a person at level 1000, even if the gap between them and the average is identical. But this reply concedes the point: it admits that to make that judgment, one *must* assume a non-arbitrary zero. If the egalitarian is content to measure relative disadvantage without making claims about absolute urgency, their view remains coherent where the prioritarian's does not. If the prioritarian insists on absolute urgency, they must bear the burden of proving the existence of a natural zero.

  In conclusion, the leveling-down objection is a negative tool. It may successfully show that equality is not the *sole* value, but it cannot bridge the gap to prioritarianism without assuming that relations matter not at all. Furthermore, even if we accept that premise, prioritarianism collapses under the weight of the measurement problem. It requires a ratio scale for well-being that is not generally available. In contrast, relational measures of inequality are often invariant to the arbitrary choices of scale that plague the priority view. Therefore, the egalitarian retains a positive advantage: their view is mathematically robust on the standard assumptions of welfare measurement, while the prioritarian's view is ill-defined. The dialectic does not end with prioritarianism as the refuge; it ends with a stalemate where the egalitarian's coherence is superior, provided they retreat from telic claims about intrinsic value to structural claims about relative disadvantage. The leveling-down objection does not kill egalitarianism; it merely forces it to be more precise about what is being measured. Prioritarianism, by contrast, is asked to measure what cannot be counted.
