answer: |-
  The air handler in the basement of Jordan Hall hummed with a low, thoracic vibration that you felt in your sternum before you heard it. It was 1994, and the room smelled of ozone and stale coffee. I sat in the chair, the kind with the heavy rubber base that didn't scrape the floor, my chin locked into a rest that smelled of disinfectant. Across the room, the CRT monitor glowed with a static grey field, the screen curved slightly at the corners like a old television.

  "Ready?" Mark asked. He was a doctoral candidate in psychophysics, wearing a flannel shirt that had seen better years. He sat behind the console, a beige tower PC whirring beside him.

  "Ready," I said.

  I needed the money. The alternator in my Honda had died on the way to campus three weeks prior, and the cash envelopes Mark handed out after every fifty trials were keeping me on the road. I was a history grad student, ostensibly researching labor unions in the thirties, but I had become the lab's primary instrument. They liked me because I didn't move my head, and because I reported what I saw without trying to guess what they wanted to hear.

  "Fixate on the cross," Mark said.

  A black cross appeared in the center of the grey field. I locked my eyes on it. The hum of the air handler seemed to recede, replaced by the high-pitched whine of the monitor's refresh rate, a sound only visible if you listened for it.

  Flash.

  A red dot appeared on the left side of the screen. It was bright, stark against the grey. Then, barely a heartbeat later, a green dot appeared on the right.

  "Report," Mark said.

  "Red dot on the left," I said, my voice sounding flat in the small room. "It moved to the right. It turned green halfway across."

  Mark typed something. He didn't look surprised. "Again."

  Flash. Flash.

  "Red moving right. Turns green mid-path."

  This was the trick. Physically, there was no motion. There was a red dot at position A, then a green dot at position B. There was nothing in between. There was no moment where a dot existed in the middle of the screen, and certainly no moment where a single dot changed its skin from red to green while in transit. The green light hadn't even been emitted when I claimed to see the change happen. The information wasn't in the universe yet.

  And yet, I saw it. I saw the trajectory. I saw the transformation. It was as real as the chin rest under my jaw.

  After the session, Mark walked me to the elevator. The lights flickered as we waited.

  "You know," he said, leaning against the cinder block wall, "you're the only one who gets the color shift this consistently. Most people see white. Or just motion."

  "I see what's there," I said.

  "Is it?" He took a sip from a styrofoam cup. "Here's the thing. When you see that dot turn green in the middle, did you see it before the second flash happened?"

  "I don't know. It feels instantaneous."

  "Exactly. It feels instantaneous. But the second flash hasn't hit your retina yet. So your brain is doing one of two things. Either it's holding back the first image, waiting for the second one to arrive, editing them together into a little movie, and then showing you the whole thing at once. Or, you saw the red dot move, really saw it, and then the green flash hit, and your memory got rewritten after the fact to say 'it changed color.'"

  "What's the difference?" I asked.

  "In the first case, you're watching a delayed broadcast. In the second, you're watching live television, but the DVR changes the recording while you're sleeping. From where you sit in the chair, it looks exactly the same. You can't tell if the edit happened before you saw it or after."

  "It matters," I said.

  "Does it?" Mark shrugged. "You report the same thing. The data is the same. Whether the editor is in the booth or in the archive... it's bookkeeping. The output is what counts."

  I drove home with the window down, the alternator whining beneath the hood. I kept thinking about the dot. If Mark was right, if it was just bookkeeping, then the feeling of *now* was flexible. It could be stretched. Things could happen to me that I didn't experience until later, and I would never know the difference.

  That night, David came over for dinner. We were cooking pasta, the kitchen lit by a single overhead bulb that buzzed like the lab's air handler. We were arguing about a trip we'd taken two years prior, to the coast. I remembered it raining the entire time. I remembered the grey slick of the highway, the wipers slapping a steady rhythm.

  "It didn't rain the whole time," David said, chopping garlic. "We sat on the beach on Sunday. The sun came out. You took that picture of me with the kite."

  "I remember the rain," I said. "I remember the cold."

  "You remember the feeling," he corrected. "You remember being unhappy. So your brain filled in the weather to match the mood. You're editing the archive, Sarah."

  "It's not the same as the dots," I said sharply.

  "Isn't it?" He looked at me, the knife paused. "You want there to be a witness inside you who saw the rain. But maybe the witness just showed up late and read the diary."

  I couldn't eat. The pasta sat heavy in my stomach. I went into the living room and lay on the couch. I tried to summon the image of the beach. I could see it clearly: the grey water, the wind. But now, like a stain spreading on paper, I could also see the sun. I could see the kite. The two images overlaid each other, neither feeling more true than the other. If the brain could rewrite the color of a dot after the fact to make a smooth story, why couldn't it rewrite the weather of a weekend to make a smooth biography?

  I went back to the lab the next week. I needed the money for the car repair, yes, but I also needed to sit in the chair. I needed to catch it.

  "Same protocol," Mark said. "But we're varying the interval. Sometimes faster, sometimes slower."

  "Can I try something?" I asked.

  Mark raised an eyebrow. "Subjects don't usually design the protocol."

  "I want to try to catch the delay. If the brain waits for the second flash to assemble the movie, there has to be a gap. A moment of darkness where I'm waiting for the data. I want to look for the gap."

  "It's sub-second. You won't feel it."

  "Let me try."

  He adjusted the code. I put my chin on the rest. The hum of the room seemed louder today, pressing against my ears.

  Flash. Red.

  I waited. I focused entirely on the space between the flashes. I tried to feel the moment my consciousness paused, holding the red image in a buffer while it waited for the green. I tried to find the edge of the present.

  Flash. Green.

  "Report."

  "Red moved. Turned green."

  "Did you feel a lag?"

  "No."

  "Again."

  Flash. Flash.

  This time, I tried a different tactic. I decided I would press the button the instant I saw the color change. Not when the motion ended, but the moment the red became green. If I could signal the change before the second flash physically arrived, I would prove the memory was being rewritten. If I signaled after, it meant the broadcast was delayed.

  I held my finger over the button box.

  Flash. Red.

  The dot moved. I watched it closely, hunting for the transition. I saw the red streak across the grey. I saw the shift to green. I pressed the button.

  "Time stamp?" Mark asked.

  "Zero point three seconds," he muttered to himself. "Same as the reaction time for the second flash."

  "It happened before the second flash," I insisted.

  "The physics says the second flash happened at point two seconds. Your button press was at point three. You reacted to the completed event."

  "But I saw it happen mid-path."

  "Which means either you saw it late, or you remembered it early." Mark spun his chair around. "Sarah, you're trying to stand outside your own head. You can't. Whatever tool you use to measure the time—the button, your voice, your internal clock—is part of the system getting edited. If the memory gets rewritten, the memory of when you pressed the button gets rewritten too."

  I sat back. The CRT screen burned a ghost image into my retina when I looked away. He was right. I couldn't trust the button. I couldn't trust the feeling of immediacy. The witness was inside the theater, and the projectionist could cut the film without the audience ever knowing the screen went dark.

  "Why do you do it?" I asked him. "If it's all just bookkeeping."

  "Because the data is consistent," he said. "Because people say the same thing. It doesn't matter if the experience is real or fabricated if the report is reliable."

  "It matters to me," I said.

  "Why?"

  "Because if it's fabricated, then I'm not here. Not really. I'm just the place where the story gets told."

  Mark didn't answer. He just queued up the next trial.

  I kept going back until the car was fixed. I kept going after that. The money wasn't the point anymore. I needed to know if I was the witness or the archive.

  One afternoon, I was sitting in the chair, waiting for the sequence to start. The screen was grey. The hum of the air handler was steady. I thought about the kitchen with David. I thought about the red dot.

  If the Stalinesque view was true—that the brain waits and edits before showing me the show—then there is a delay. I am always living in the past. The present I feel is a reconstruction of events that have already settled. I am safe, but I am late.

  If the Orwellian view is true—that I see the raw feed and the memory is corrected later—then I am present, but I am unreliable. My past is mutable. I can remember seeing a green dot mid-path when no green dot existed there. I can remember rain on a sunny day. I can remember loving someone when I was already leaving them.

  Mark started the trial.

  Flash. Red.

  I watched the dot. It moved. It changed color.

  I closed my eyes after the trial ended. I tried to hold the image of the red dot in my mind. I tried to feel the moment it became green. I searched for the seam. I searched for the edit point.

  There was nothing. Just a smooth, continuous line. A perfect story.

  "Same result," Mark said. "You're consistent."

  I took the cash envelope. It was thick, enough to cover the oil change and the tires. I walked up the stairs to the street level. The sun was out, bright and harsh. I walked to my car. I put the key in the ignition. The engine turned over smoothly.

  I sat there for a moment, hands on the wheel. I tried to remember when I decided to take the job in the lab. Was it the day the car broke down? Or had I seen the flyer earlier and forgotten? I tried to remember the color of the flyer. Yellow? White?

  I couldn't pin it down. The memory shifted as I reached for it, settling into a shape that made sense with the story of the broken alternator.

  I started the car. I drove home. I knew that when I arrived, I would remember the drive as uneventful. I knew that if a light flashed red ahead and then green, I would see a smooth transition. I knew that if David asked me what I did today, I would tell him a story that hung together.

  I pulled into the driveway. I turned off the engine. The silence rushed in. I sat in the dark car, waiting for the feeling of the day to settle. I waited to see if I would feel the lag, or if I would feel the rewrite.

  I opened the door. I stepped out. The memory of stepping out formed instantly, solid and complete. I walked toward the house. I did not know if I was walking into the moment, or into the record of the moment. I put the key in the lock. It turned. The door opened. I went inside to tell David what had happened.
