  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Pre-registered Study on Symmetric Decision Protocols
  **Principals:** Principal Investigator (Economist), Co-Investigator (Philosopher)

  **I. AGREED CLAIMS**
  Both principals affirm the following without qualification:

  1.  **Payoff Structure:** In Arm A, a single opt-in yields sixty thousand dollars to that entrant; zero opt-ins or multiple opt-ins yield nothing to everyone. In Arm B, a six thousand dollar pot is divided equally among opt-ins, each of whom pays a four hundred dollar fee; opt-outs pay and receive nothing.
  2.  **Dominance:** In Arm A, opting in weakly dominates opting out (it never yields less, and sometimes yields more). In Arm B, no strategy dominates; opting in is profitable only if total opt-ins remain at fourteen or fewer.
  3.  **Symmetry Premise:** For symmetry to license a joint recommendation, all thirty participants must be identical in reasoning capacity, information access, and deliberative process at the moment of decision.
  4.  **Common Knowledge:** The briefings establish common knowledge of the rules, the pool size (thirty), and the simultaneity of the briefing. They do not establish common knowledge of the participants' specific reasoning algorithms or psychological states.
  5.  **Normative Bearing:** Observed opt-in rates describe human behavior. They cannot strictly falsify a normative thesis about how ideal agents *should* reason, but extreme deviation renders the thesis psychologically irrelevant.

  **II. DISAGREEMENTS**

  | Issue | Economist's Position | Philosopher's Position | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Nature of Rationality** | Rationality requires maximizing individual expected utility given causal independence from others' choices. | Rationality requires adopting the strategy that yields the best outcome if adopted by all identical reasoners. | Substantive |
  | **Arm A Dominance** | The dominance of opting in is binding; ignoring it invites guaranteed zero payoff. | Symmetry overrides dominance; the choice is between policies (all-in vs. randomize), not individual acts. | Substantive |
  | **Randomization** | Randomizing is merely a heuristic for approximating a group outcome; it is not a rational individual strategy. | Randomizing at the optimal symmetric rate is the only consistent application of the symmetry premise. | Substantive |
  | **Terminology** | Calling symmetric coordination "rational" conflates logic with causality. | Calling individual maximization "rational" ignores logical correlation between identical minds. | Verbal |

  **III. CRUXES**
  Settling any of the following would move at least one principal toward the other's position.

  **1. Symmetry: Empirical vs. Constitutive**
  *   **Case:** Is the symmetry premise a contingent hypothesis about how people actually think, or a constitutive rule of deliberation that applies regardless of psychology?
  *   **Evidence:** Post-experiment interviews on whether participants felt their choice was linked to others.
  *   **Predictions:** Economist predicts participants report feeling causally isolated. Philosopher predicts participants report feeling logically bound.
  *   **Assumptions:** Economist assumes introspection tracks causal models. Philosopher assumes introspection tracks logical models.

  **2. Randomization: Superrationality vs. Team Reasoning**
  *   **Case:** Is randomizing at a low rate in Arm A an act of individual superrationality, or is it team reasoning smuggled in (acting as a unit)?
  *   **Evidence:** Whether participants view themselves as distinct agents or copies of a single agent.
  *   **Predictions:** Economist predicts participants view themselves as distinct. Philosopher predicts participants view themselves as copies.
  *   **Assumptions:** Economist assumes agency is individual. Philosopher assumes agency can be distributed across identical copies.

  **3. Arm A Dominance: Binding vs. Overrideable**
  *   **Case:** Does the weak dominance of opting in in Arm A bind a rational agent even when symmetric reasoning suggests randomization?
  *   **Evidence:** The rate of opt-ins in Arm A.
  *   **Predictions:** Economist predicts thirty opt-ins (one hundred percent). Philosopher predicts four opt-ins (approximate optimal rate).
  *   **Assumptions:** Economist assumes students follow dominance. Philosopher assumes students recognize symmetry.

  **4. Behavioral Alignment: Ideal vs. Real**
  *   **Case:** Can normative recommendations about idealized reasoners forecast behavior in graduate students?
  *   **Evidence:** The gap between predicted and observed opt-in rates.
  *   **Predictions:** Economist predicts observed rates will match individual maximization (high opt-in). Philosopher predicts observed rates will cluster near symmetric optima (low opt-in).
  *   **Assumptions:** Economist assumes students are standard economic actors. Philosopher assumes students are sufficiently reflective to trigger symmetry.

  **5. Correlation Source: Magical vs. Logical**
  *   **Case:** Is the correlation between choices caused by communication (magical thinking) or by logical identity (superrationality)?
  *   **Evidence:** Control arm where participants are told they are *not* identical to others.
  *   **Predictions:** Economist predicts no change in behavior (correlation was never real). Philosopher predicts drop in coordination (logical link broken).
  *   **Assumptions:** Economist assumes correlation requires causal channel. Philosopher assumes correlation requires logical identity.

  **IV. LAYERS OF DISAGREEMENT**
  We explicitly separate disputes about **Decision Rules** (how one ought to choose) from disputes about **Human Psychology** (how people do choose).
  *   **Decision Rules:** The Economist insists causal independence dictates individual maximization. The Philosopher insists logical identity dictates symmetric policy selection. This is substantive.
  *   **Human Psychology:** The Economist assumes graduate students will follow causal incentives. The Philosopher assumes graduate students will recognize logical symmetry. This is empirical.
  *   **Overlap:** The Philosopher risks conflating the two by suggesting that because symmetry is normatively correct, students will follow it. The Economist risks conflating the two by suggesting that because students follow dominance, dominance is the only rational rule.

  **V. ABANDONMENT CONDITIONS**
  **Economist:** I will abandon the claim that individual maximization is the only rational rule if the data show coordination significantly above chance in Arm A without communication, *and* if post-experiment interviews confirm participants did not believe in causal magic. I will abandon the auxiliary assumption that students follow dominance if opt-in rates are below fifty percent.
  **Philosopher:** I will abandon the symmetry premise if opt-in rates in Arm A approach thirty, *and* if participants report feeling no logical connection to others. I will abandon the auxiliary assumption that students are sufficiently reflective if opt-in rates match the Economist's prediction despite participants affirming logical identity.

  **VI. VERBAL ACCOUNTING**
   Portions of this argument are verbal rather than substantive.
  *   **The Word "Rational":** When the Economist says "irrational" she means "causally ineffective." When the Philosopher says "rational" he means "logically consistent." If we agree to distinguish *causal rationality* from *logical rationality*, this dispute dissolves.
  *   **The Word "Symmetric":** When the Economist says "asymmetric" she means "causally isolated." When the Philosopher says "symmetric" he means "logically identical." If we agree that causal isolation does not preclude logical identity, this dispute dissolves.
  *   **Substantive Core:** The verbal disputes mask a substantive disagreement about whether logical identity can constrain choice in the absence of causal channels. No amount of terminological clarification will resolve whether the thirty participants are one decision problem or thirty. This remains a factual dispute about the nature of agency.
