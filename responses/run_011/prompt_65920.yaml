prompt: |-
  Third year in early modern philosophy here — my dissertation is provisionally on skepticism and moral judgment in the Essays, and I've hit a wall on a chapter I owe my director in about two weeks. It's about Of Cannibals and whether Montaigne is a relativist in any interesting sense, and I keep landing in a different place depending on which passage I'm staring at, so I want to force myself to commit to a number rather than write three pages of on-the-one-hand.

  The proposition, stated as tightly as I can manage: in Of Cannibals, Montaigne is committed to the view that the standards by which one culture judges another's practices are drawn from the judging culture's own customs, with no independent standard available to him — call it relativism proper — as opposed to a single standard of nature and reason that he applies even-handedly to the Tupinambá and to the French and simply finds the French wanting. The passage I keep coming back to, in the Cotton-Hazlitt rendering I have open: "I find that there is nothing barbarous and savage in this nation, by anything that I can gather, excepting, that every one gives the title of barbarism to everything that is not in use in his own country," followed immediately by "As, indeed, we have no other level of truth and reason, than the example and idea of the opinions and customs of the place wherein we live."

  Give me your credence in that proposition and then break it into the sub-questions it actually rests on, each with a number and a sentence or two of justification:

  - whether "barbarism" in that passage is doing descriptive work (how it is that we come by our standards) or is an arguement that there is no standard outside a form of life;
  - whether the opening material — Pyrrhus sizing up the Roman army, the Greeks doing the same to Flaminius's force, and the instruction to judge by the eye of reason rather than common report — commits him to a substantive rational standard, and if so whether that standard has content or is merely procedural;
  - whether the wild-fruit move (calling them wild in the way we call fruit wild, nature producing it by her own ordinary progress, versus natures we have changed by artifice and diverted from the common order) shows "nature" functioning as a yardstick with real bite, which relativism proper can't accommodate;
  - whether his verdict that eating a dead enemy is less barbarous than torturing a living one is a like-for-like ranking on a single scale, or a purely internal reductio that runs entirely on standards the French already avow;
  - how much of the essay's shape is owed to audience and genre — a French gentleman writing during the civil wars, who deliberately prefers the testimony of his plain, literal-minded ex-servant from Villegagnon's Antarctic France over that of subtle people who gloss what they report — so that what reads as a metaethical position is really a shame-Europe inversion with a rhetorical job to do;
  - whether you're even permitted to settle this from one chapter, and how much the rest of the Essays should constrain the answer.

  Then combine them in whatever way you think they should be combined; I dont want a bare number with a paragraph of hedging stapled on afterwards. My own gut figure is around 0.35 and I genuinely can't tell whether that's the philosophy talking or just my allergy to the recycled 'Montaigne the proto-anthropologist' story that shows up every time somebody teaches this essay. Last thing: tell me which single term is load-bearing — which one, if you were wrong about it, would move your total the most — and what feature of the text would actually settle it. Please write the whole answer in American English.
