answer: |-
  Here is a menu of distinct interpretations of the thesis "A white horse is not a horse" (*Bai ma fei ma*), structured for seminar use. Each item varies the semantic function of the copula, the ontological status of the terms, and the domain of the claim, followed by a one-line verdict on its truth and viability.

  ### Menu of Readings

  1.  **Extensional Non-Identity:** The set of white horses is not numerically identical to the set of horses.
      *   *Verdict:* Trivially true (a subset is not the superset), but irrelevant to ordinary predication.
  2.  **Intensional Non-Identity:** The concept (sense) 'white horse' is not identical to the concept (sense) 'horse'.
      *   *Verdict:* Substantive and defensible; supports a Fregean distinction but does not deny class membership.
  3.  **Class Exclusion:** No individual white horse is a member of the kind 'horse'.
      *   *Verdict:* Straightforwardly false; contradicted by the inference "having a white horse implies having a horse."
  4.  **Linguistic Non-Synonymy:** The expression "white horse" is not synonymous with the expression "horse".
      *   *Verdict:* Trivially true (different words have different meanings), but linguistically banal.
  5.  **Pragmatic Non-Substitutability:** In the context of a request, fulfilling "give me a horse" does not satisfy "give me a white horse".
      *   *Verdict:* Substantive and true about speech acts, but establishes pragmatics rather than metaphysics.
  6.  **Ontological Composition:** The compound universal (White-ness + Horse-ness) is not the simple universal (Horse-ness).
      *   *Verdict:* Substantive and defensible within a Realist metaphysics, but commits to controversial abstract objects.
  7.  **Numerical Particular Identity:** This specific white horse is not identical to this specific horse.
      *   *Verdict:* Straightforwardly false (Leibniz's Law); a white horse is identical to itself qua horse.
  8.  **Naming Reference:** The name "white horse" picks out a different object than the name "horse".
      *   *Verdict:* Indeterminate; depends on whether names pick out individuals, kinds, or conceptual foci.
  9.  **Essentialist Predication:** To be a white horse is not essentially to be a horse (colour modifies essence).
      *   *Verdict:* Substantive but highly contentious; implies colour changes ontological category.
  10. **Grammatical Genericity:** The sentence is not about objects but about the grammatical incompatibility of the terms.
      *   *Verdict:* Deflationary; reduces the thesis to a rule of syntax or categorization rather than reality.

  ***

  ### Analysis of the "Request" Argument
  **Does asking for a horse vs. a white horse establish semantics or pragmatics?**
  It establishes **pragmatics** (specifically, substitution failure in intentional contexts). It shows that the *terms* are not interchangeable in a request without altering the conditions of satisfaction. It does not prove that the *objects* referred to are disjoint, only that the *description* required for fulfillment differs. A yellow horse satisfies the extension of "horse" but not the intension of the specific request "white horse."

  **Does it survive the objection ("Having a white horse is having a horse")?**
  *   **Readings 1, 2, 4, 5, 6, 8, 10** survive this objection. They deny identity of sets, concepts, words, or conditions, without denying that a white horse falls under the extension of 'horse'.
  *   **Readings 3, 7, 9** do not survive. They deny membership or essential classification, which is contradicted by the fact that possessing a white horse entails possessing a horse.

  ***

  ### Verdicts on Seminar Positions

  **On your Classmate's Fregean Usage**
  *   **Claim:** The thesis shows "is" is not identity and anticipates Sense/Reference.
  *   **Verdict:** **Partially Earned.** Reading #2 (Intensional Non-Identity) supports the Fregean moral that co-extensive terms differ in sense, but it does not prove the copula "is" *never* expresses identity, only that predication is not identity.
  *   **Critique:** To make the thesis non-trivial *and* true without exploiting the sense/reference conflation, one must stick strictly to Reading #2. However, if the classmate uses this to deny that a white horse *is* a horse (Reading #3), they commit the very fallacy Frege resolved (confusing sense with reference).

  **On your Tutor's Deflationary Usage**
  *   **Claim:** The thesis is sophistry/wordplay importing modern agendas.
  *   **Verdict:** **Largely Supported.** Readings #1 and #4 make the thesis trivially true (sets differ, words differ), while Reading #3 makes it false. The argument's persuasive power relies on sliding between the trivial truth of #1/#2 and the shocking falsehood of #3.
  *   **Critique:** Calling it "court entertainment" is historically plausible; the logical tension is generated by equivocation on the copula (identity vs. membership) which a deflationary reading exposes.

  ***

  ### Note on Classical Chinese Grammar
  **Does the lack of grammatical number bear on available readings?**
  **Yes, decisively.** Classical Chinese (*Bai ma fei ma*) lacks plural markers and the definite article.
  *   **Generic Reading:** "White horses (as a kind) are not horses (as a kind)." This favours Readings #1, #2, and #6 (Kind/Universal talk).
  *   **Specific Reading:** "This white horse is not this horse." This favours Reading #7 (which is false).
  *   **Nominal Reading:** "The term 'white horse' is not the term 'horse'." This favours Reading #4 or #10.
  *   **Impact:** The grammatical ambiguity allows the speaker to equivocate between talking about *kinds* (where non-identity is true) and *instances* (where class membership is expected). This ambiguity is the engine of the sophistry your tutor identified; it makes the "menu" of readings available simultaneously, allowing the arguer to claim the truth of the Kind-reading while implying the shock of the Instance-reading.
