answer: |-
  The shape you are drawing is not a muddle. It is a coherent ethical structure that appears frequently in serious fiction but rarely receives a stable name because it sits in the friction between how we want morality to work (cleanly, hierarchically) and how it often feels (accumulatively, residually).

  Here is the carving you asked for.

  ### 1. The Name and The Nearest Candidates

  The closest established term is **"Moral Remainder."** In philosophical discourse, this describes the psychological or ethical residue left after an agent makes the right choice in a situation of conflicting duties. However, the standard usage usually locates this remainder *inside* the agent (as regret, agent-regret, or a stain on integrity).

  Your version is distinct because it is **objective and interpersonal**. The daughter, the friend, and the narrator treat the debt as a fact of the world, not just a feeling in the chest. Because standard "Moral Remainder" is often too subjective for your purpose, I suggest you work with the coinage: **"The Surviving Claim."**

  **Why the other candidates fail:**
  *   **Guilt/Remorse:** These presuppose the agent did something wrong. In your scenes, the agents did the *right* thing. Guilt looks backward at a mistake; the Surviving Claim looks forward at a balance sheet.
  *   **Supererogation:** This is doing *more* than duty requires (a gift). Your characters are not giving gifts; they are making payments. Supererogation is optional; the Surviving Claim is mandatory.
  *   **Compensation:** This implies liability for a tort or a wrong. Your agents are not liable in a legal or strict moral sense because their choice was justified. Compensation repairs a breach; the Surviving Claim acknowledges a cost that was necessary but not erased.
  *   **The "Dirty Hands" Problem:** This applies when one must do evil to achieve good. Your agents have not done evil; they have simply failed to fulfil a competing good. Their hands are not dirty; they are just indebted.

  ### 2. The Edges of the Shape

  You asked for the boundaries of this phenomenon to ensure you are not drifting into sentimentality. Here is the definition of **The Surviving Claim**:

  *   **Does it survive forgiveness?** Yes. Forgiveness addresses resentment. The Surviving Claim addresses balance. The stranger's family might forgive the brother; they might even forgive the woman for protecting him. But the *loss* they suffered remains a debit on the ledger. The woman's payments are not seeking absolution; they are acknowledging the debit. If the daughter said, "They forgave us, so you can stop paying," the mother should reply, "That is their grace. This is my arithmetic."
  *   **Does it presuppose blamelessness?** It works best when the agent is blameless. If the agent manoeuvred themselves into the conflict through negligence, the residue collapses into simple liability or guilt. For the shape to hold, the conflict must be genuine and unavoidable. The agent must have had no third option.
  *   **Does it extend to values (the pianist)?** Yes, provided the value is treated as a **creditor**. If the pianist says, "I miss the music," that is regret. If she says, "I owe the music," she is personifying the vocation as a claimant on her life. This is not nonsense, provided the novel has established the music as a demand that required her service, not just her hobby. The "debt" is the unplayed repertoire, the ungiven performances. It is a debt to the *potential* that was sacrificed.
  *   **Is third-party recognition essential?** For your specific variation, yes. This is what separates it from private angst. If the friend told the man, "You did the right thing, forget me," and the man *still* felt he owed him, that is internal Moral Remainder. But if the friend says, "You chose your wife, I understand, but you still owe me the truth you promised," the Claim is objective. The third party validates that the duty was not nullified, only postponed or transformed.

  ### 3. The Metaphysical Commitment

  You asked the prior question: *Does writing these scenes well bind me to holding that both obligations remained in force?*

  **Yes.**

  This is the crucial pivot. There are two ways to model moral conflict:
  1.  **The Hierarchical Model:** Duty A and Duty B conflict. Duty A is higher. Therefore, Duty B is extinguished. To choose A is to render B null. (If you write this, the payments are charity).
  2.  **The Pluralist Model:** Duty A and Duty B conflict. Duty A outweighs Duty B. Therefore, you must do A, *but* Duty B still exists as a claim that was not met. (If you write this, the payments are debts).

  By having the daughter correct the interpretation from "generous" to "owed," you are committing your novel to the **Pluralist Model**. You are asserting that "Right" does not erase "Cost." You are asserting that a justified violation of a duty is still a violation, even if it was the only thing to do.

  **Can you stay neutral?**
  You cannot be neutral on the *logic*, but you can be neutral on the *philosophy*. You do not need to have characters debate ethics. You only need to ensure the **consequences** remain consistent.
  *   **Do not** have a character say, "I did the right thing, so I am clear."
  *   **Do** have the world treat the unchosen path as a loss that demands accounting.

  If you try to stay neutral on whether the obligation persisted, the scenes will wobble. The daughter's correction will feel unearned, or the mother's payments will feel like neurosis. You must commit to the reality of the debt within the world of the book. You do not need to believe it in your own life, but the novel's physics must treat it as gravity.

  ### 4. Distinguishing from Sentimentality

  You worry the pianist's line is sentimentality. It becomes sentimentality if the "debt" is used to aggrandize the character (i.e., "Look how deeply I feel"). It remains **The Surviving Claim** if the debt is treated as **burdensome and unglamorous.**

  *   **Sentimental:** "I gave up my music for father, and in my heart, I know I still belong to the song." (Vague, emotional, self-congratulatory).
  *   **Earned:** "I did not play for forty years. That is forty years of repertoire I did not deliver. I am in arrears." (Specific, accounting-based, unflattering).

  To keep the shape sharp and avoid the "muddle":
  1.  **Keep the language of accounting.** Use words like *due, owe, balance, arrears, settle*. Avoid words like *guilt, regret, wish, hope*.
  2.  **Make the cost specific.** The woman sends money at "real cost to herself." The man is "on the hook." The pianist names what is owed (the music/performance). Vague debts are sentimental; specific debts are structural.
  3.  **Ensure the creditor validates it.** As you have done with the daughter and the friend. If the creditor says, "You owe me nothing," and the agent insists on paying anyway, you risk sliding into guilt or obsession. If the creditor says, "You do owe me, and I am waiting," the Claim is objective.

  ### Summary

  The shape is real. It is **The Surviving Claim**. It requires you to treat moral duties not as lights that switch off when overridden, but as weights that remain on the scale even when lifted.

  Writing this binds you to the position that **justification does not equal erasure.** It does not require you to solve the philosophy of duty, but it requires you to be consistent with the *consequences* of that philosophy. As long as the characters treat the residue as a demand rather than a feeling, and as long as the narrative treats the payment as mandatory rather than optional, you are not writing sentimentality. You are writing the cost of a complex world.
