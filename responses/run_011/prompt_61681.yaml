answer: |-
  **Project Title:** Disaggregating Aggregation: A Structural Map of the Taurek Debate

  **Project Summary**
  Since John Taurek's 1977 intervention, the question "Should the Numbers Count?" has generated a stalemate. Utilitarians assert that numbers count axiomatically; contractualists argue they count as aggregated reasons; Taurekians argue they count only via procedural fairness (lotteries). This project proposes that the debate is stagnant not because the arguments are exhausted, but because the central predicate—"the numbers count"—conflates three distinct normative claims. I will demonstrate that the axiological, reasons-based, and procedural justifications for saving the greater number are conceptually separable. By mapping the logical space created by separating these claims, this project will determine which combinations yield a coherent normative theory and which collapse into inconsistency.

  **The Research Question**
  Existing literature treats the justification for saving the greater number as a monolithic block. Utilitarians (e.g., Hare, Singer) typically defend Axiological Aggregation (Claim 1) and assume it entails Reasons Aggregation (Claim 2). Contractualists (e.g., Scanlon, Otsuka) often reject Claim 1 to avoid impersonal aggregation but defend Claim 2 to save the many. Taurek rejects Claim 1 and is read as rejecting Claim 2, retreating to Procedural Fairness (Claim 3).

  The literature leaves open the structural dependencies between these claims. Do they stand or fall together? The primary research question is: **Are the axiological, reasons-based, and procedural justifications for saving the greater number logically independent, and if so, which unoccupied combinations of these claims constitute viable normative positions?**

  This question admits a determinate answer. Either the claims are separable (demonstrated by constructing coherent cases where one holds and others fail) or they are not (demonstrated by showing that denying one necessitates denying the others). If they are separable, the project will identify which "empty cells" in the logical matrix are philosophically sustainable.

  **The Three Claims**
  To achieve precision, I distinguish three claims currently slid between:
  1.  **Axiological Aggregation:** The badness of outcomes sums across persons. (Five deaths are *worse* than one).
  2.  **Reasons Aggregation:** Individual claims on the agent sum across persons. (Five people provide *more reason* to act than one, even if 'badness' doesn't sum).
  3.  **Procedural Fairness:** Equal concern requires a randomizing procedure when claims conflict, regardless of numbers.

  **Methodology and Work Plan**
  The project employs conceptual analysis and case-construction to test the separability of these claims. I will construct a 2x2x2 matrix of the possible positions and attempt to populate the unoccupied cells with coherent arguments.

  *   **Months 1–3: Taxonomy and Reconstruction.**
      I will formalize the three claims using decision-theoretic and deontic logic to ensure they are defined without overlap. I will reconstruct key arguments from Kamm, Scanlon, and Taurek to locate exactly where they conflate these claims. Deliverable: A working paper defining the "Logical Space of Aggregation."
  *   **Months 4–6: Separability Testing (Case Construction).**
      I will design cases where the claims genuinely come apart.
      *   *Case A (Testing 1 vs. 2):* Five people face a minor loss (e.g., broken arm); one person faces death. Axiological Aggregation might favor the one (death is worse than 5 arms). Reasons Aggregation might favor the five (five claims vs. one). If a view saves the five here, it accepts 2 but denies 1.
      *   *Case B (Testing 3 vs. 1 & 2):* The "Impossible Lottery." A decision must be made instantaneously; a randomizing procedure is physically impossible. If one still saves the five, one accepts 1 or 2 but denies 3.
      *   *Case C (Testing 2 vs. 3):* Asymmetric Claims. Five people have weak claims; one has a strong claim. If we save the one without a lottery, we deny 2 and 3 but maintain a coherent view.
  *   **Months 7–9: Evaluating the Empty Cells.**
      I will attempt to build a full normative theory for the most promising unoccupied cell: **Deny 1, Accept 2, Deny 3.** This view saves the five, not because the world is worse if they die (anti-utilitarian), and not because a lottery is required (anti-Taurek), but because the *number of reasons* dictates the action even without a procedure. I will test this view against objections regarding the "tyranny of aggregation."
  *   **Months 10–12: Synthesis and Drafting.**
      I will compile the results into the first two chapters of the dissertation. If the claims prove separable, the conclusion will argue that the Taurek debate was a category error. If they prove non-separable, the conclusion will demonstrate *why* (e.g., that Reasons Aggregation logically presupposes Axiological Aggregation).

  **Conditions for Failure**
  Intellectual honesty requires specifying how this project could fail.
  1.  **Non-Separability:** If rigorous analysis shows that accepting Reasons Aggregation (2) logically necessitates Axiological Aggregation (1), the project collapses back into the traditional Utilitarian vs. Taurek dichotomy. I will count this as a negative result, but a determinate one.
  2.  **Instability of Empty Cells:** If the unoccupied positions (e.g., Accept 2, Deny 1 & 3) are shown to be unstable—meaning any argument for them inevitably smuggles in the denied claims—the project concludes that the conflation in the literature was justified by deep structural links.
  3.  **Collapse:** If the "new" view I construct in Months 7–9 turns out to be extensionally equivalent to a familiar view (e.g., Rule Utilitarianism) despite different grounding, the novelty claim fails.

  **Scope and Limitations**
  The primary risk is breadth. Analyzing all three claims and their eight combinatorial permutations is substantial. If the twelve-month period proves insufficient, I will prioritize the distinction between **Axiological (1)** and **Reasons (2)** Aggregation. This is the fault line between Utilitarianism and Contractualism. I will treat Procedural Fairness (3) as a secondary variable, focusing only on cases where procedure is impossible (Case B above). This ensures the core contribution—disentangling the nature of aggregation—is secured even if the full taxonomy of procedural justice is deferred to the second year of the dissertation.

  **Significance**
  Skeptics may argue this debate was settled in the eighties by Kamm's *Intricate Ethics* or Scanlon's *What We Owe to Each Other*. However, those works operated within the existing conceptual framework. They argued *within* the game; this project asks whether the game board is drawn correctly. By showing that "the numbers count" is an ambiguous phrase covering three distinct mechanisms, this project does not merely add another voice to the chorus. It provides the structural map required to see why the chorus is singing out of tune. If successful, this project dissolves the stalemate, not by solving the puzzle, but by showing it was composed of three smaller puzzles that need to be solved individually.
