answer: |-
  **Scenario**
  An auditor reviews a warehouse batch of 1,000 items: 900 microchips ($F$) and 100 protective casings ($\neg F$). A known power surge damaged exactly 10 items randomly. The hypothesis $H$ is that all microchips are functional ($G$), implying all 10 damaged items ($\neg G$) are casings. The alternative $\neg H$ is that exactly one microchip was damaged (leaving 9 damaged casings). Both states are equally likely based on surge statistics. The auditor selects one item at random, blind to type. We compare evidence $E_1$ (a functional chip) against $E_2$ (a damaged casing).

  **Model and Calculations**
  **Hypothesis:** $H$: All $F$ are $G$. **Population:** $N=1000$, $N_F=900$, $N_{\neg G}=10$. **Priors:** $P(H)=P(\neg H)=0.5$, motivated by the fixed damage count (10) distributed randomly. **Sampling:** Uniform random draw.

  Under $H$, all 900 chips are functional; 10 casings are damaged.
  Under $\neg H$, 899 chips are functional; 9 casings are damaged.

  **Evidence 1 ($F \land G$):**
  $P(E_1|H) = 900/1000 = 0.900$.
  $P(E_1|\neg H) = 899/1000 = 0.899$.
  $BF_1 = 0.900 / 0.899 \approx 1.0011$.

  **Evidence 2 ($\neg F \land \neg G$):**
  $P(E_2|H) = 10/1000 = 0.010$. (All 10 defects are casings).
  $P(E_2|\neg H) = 9/1000 = 0.009$. (Only 9 defects are casings).
  $BF_2 = 0.010 / 0.009 \approx 1.1111$.

  **Payoff:** $BF_2 / BF_1 \approx 111$. The "white shoe" analog ($E_2$) confirms $H$ over 100 times more strongly than the "black raven" analog ($E_1$), despite $E_2$ seeming irrelevant to chip functionality. The slack is substantial; $N_F$ could drop to 500 before the ratio falls below 10.

  **Sensitivity Analysis**
  Flip the sizes to match the standard Raven case: 10 Chips ($F$), 900 Casings ($\neg F$), 10 Defects ($\neg G$).
  $P(E_1|H) = 10/1000 = 0.01$; $P(E_1|\neg H) = 9/1000 = 0.009 \Rightarrow BF_1 \approx 1.11$.
  $P(E_2|H) = 900/1000 = 0.9$; $P(E_2|\neg H) = 899/1000 = 0.899 \Rightarrow BF_2 \approx 1.001$.
  Here, $BF_1 \gg BF_2$. The familiar verdict returns immediately when $F$ is rare and $\neg G$ abundant.

  **Standard Lines**
  1.  **Abundance:** The standard resolution claims $E_2$ confirms negligibly because non-black non-ravens are abundant. This case supports that: when $\neg G$ (defects) are rare, $E_2$ is informative; when abundant, it is not. The variable is purely magnitude.
  2.  **Background Knowledge:** Some argue we ignore $E_2$ because we know shoes aren't ravens. Here, we know casings aren't chips, yet $E_2$ is highly confirmatory. This defeats the background-knowledge excuse; the irrelevance in the standard case is due to the abundance of $\neg G$, not our knowledge of $\neg F$.

  **Objections**
  A defender might argue the prior is rigged: fixing the total number of defects ($\neg G$) is artificial. In natural kinds, we don't know the count of non-black things. However, this objection merely redescribes the point: the Bayesian verdict *depends* on such population parameters. If the parameters change, the verdict changes. The "rigging" isolates the variable of class size, which is precisely the experiment's goal.

  **Verdict**
  This case establishes that the Bayesian resolution of the Raven Paradox is driven entirely by the relative sizes of $F$ and $\neg G$, not logical form or evidential relevance. When $\neg G$ is rare, contrapositive observations are potent. However, it does not prove the standard verdict is wrong for ravens; it shows the verdict is contingent on empirical facts about raven and color abundances. The paradox dissolves into a question of magnitude: white shoes confirm negligibly only because non-black things are ubiquitous. In a world where defects were rare and chips common, checking casings would be the superior audit strategy.
