answer: |-
  Here is the prep sheet. I've structured this to match the room's energy: empirical, skeptical of metaphysics, and focused on what buys you explanatory power.

  ### Part 1: The Step 4 Critique
  **Is Step 4 wrong-headed?**
  It is not wrong-headed, but it is **dangerously absorptive**.
  By claiming that "cognition is just coupled dynamics" is merely a *negative result* within computationalism (i.e., "we looked for a symbolic contract, didn't find one, found a dynamical one instead"), you risk diluting "computation" until it covers everything again. If a "dynamical contract" counts as a "computational contract," then you haven't distinguished yourself from the triviality problem you granted in Step 1.
  **The Fix:** You must insist that a *computational* contract implies **discrete state abstraction** or **information processing logic** that is *insensitive* to the underlying dynamics. If the best description requires tracking the continuous trajectory of every variable, that is *not* a computational contract, and you must be willing to say "In that region, the brain is not computing." If you aren't willing to admit the brain might *not* be a computer in some contexts, your claim is unfalsifiable.

  ### Part 2: Opening Concessions (First 3 Minutes)
  *Say these early to disarm the "engineer doesn't get biology" reflex.*
  1.  **"The hardware is terrible."** Concede explicitly that neural substrate is orders of magnitude noisier, slower, and less reliable than silicon. You are not claiming the brain is a *good* computer by datacenter standards; you are claiming it sustains a contract *despite* that.
  2.  **"We don't have the spec."** Concede that we do not know the instruction set or the API. You are arguing for the *existence* of the contract, not that we have reverse-engineered it yet. This prevents people from attacking specific models you didn't propose.

  ### Part 3: The One Reply That Must Land
  For the talk to count as a success, you must land this distinction clearly:
  **"Fitting vs. Intervening."**
  *   **The Line:** "Fitting a model to trajectory data tells you what the system *did*. A computational contract tells you what the system *would have done* had you flipped a bit. If 'computation' doesn't buy you better counterfactual predictions than 'dynamics,' I am wrong. But if it does, it earns its keep."

  ---

  ### Part 4: Q&A Prep Sheet (8 Objections)
  *Ordered by potential damage. Phrased in the room's vocabulary.*

  #### 1. The "Trial-to-Trial Variability" Objection (Neuroscientist)
  *   **Timing:** First 5 minutes. High Damage.
  *   **The Voice:** "I look at population vectors across 50 trials of the same stimulus. The trajectories never overlap. The 'state' is different every time. Your API contract implies idempotency—same input, same output. My data says the brain is a stochastic differential equation, not a deterministic function. Where is the stable state you need for computation?"
  *   **The Reply:** "In distributed systems, we distinguish between *state* and *observable output*. The internal state might drift (like clock skew or memory fragmentation), but if the *functional output* remains within an SLA (e.g., the animal catches the fly), the contract holds. I'm not claiming the voltage trace is identical; I'm claiming the *logical transition* is robust to that noise. If the variability were just noise, performance would degrade linearly. If it's computational, the system corrects for it. Look for error correction, not identical traces."
  *   **Soft Spot:** If they show you data where variability *is* the feature (e.g., stochastic resonance), your "error correction" narrative looks like you're ignoring the mechanism.

  #### 2. The "Continuous vs. Discrete" Objection (Electrophysiologist)
  *   **Timing:** First 10 minutes. Medium Damage.
  *   **The Voice:** "Computers rely on discrete bits. Neurons are analog integrators with continuous membrane potentials, plus volumetric neuromodulation that acts like a soup, not a wire. You're forcing a digital abstraction on an analog system. Isn't that just losing information?"
  *   **The Reply:** "Abstraction always loses information; that's the point. A transistor is analog too, but we treat it as a gate because the *contract* holds at the digital level. I'm hypothesizing that spikes or population thresholds act as the 'clock edges' or 'bit flips.' If the analog details don't change the logical outcome under intervention, they are implementation details, not computational state. The experiment is: does perturbing the analog slope change the result, or just the timing?"
  *   **Soft Spot:** If neuromodulation changes the *logic* itself (e.g., switches the function from integration to differentiation), then the "hardware" is rewriting the "software," which breaks the standard computer metaphor.

  #### 3. The "Intervention Breaks the System" Objection (Philosopher / Causal Inference)
  *   **Timing:** Mid-session. High Damage.
  *   **The Voice:** "You lean on counterfactuals. But when I do optogenetics, I'm injecting current. I'm changing the physics, not just the 'data.' How do you know you're testing the computation and not just breaking the hardware? In a laptop, flipping a bit doesn't melt the transistor. In the brain, the intervention is often non-physiological."
  *   **The Reply:** "Valid. In infra, we call this 'leaky abstraction.' If the intervention violates the physical constraints of the substrate, the test is invalid. We need 'physiological interventions'—stimuli the system evolved to handle, or perturbations within the dynamic range. If the contract only holds under 'natural' inputs, it's still a contract, just a narrower API. That limits the claim, but doesn't kill it."
  *   **Soft Spot:** This forces you to define "natural inputs," which is a philosophical quagmire they will enjoy poking.

  #### 4. The "Explanatory Power" Objection (Skeptic / ML Grad)
  *   **Timing:** Mid-session. High Damage.
  *   **The Voice:** "Okay, say I accept your contract view. If I model the same data as a recurrent neural network (dynamics) vs. a symbolic machine (computation), and both predict the interventions equally well, why use the word 'computer'? What work is 'computation' doing that 'dynamics' isn't?"
  *   **The Reply:** "Compression and generalization. A dynamical model requires simulating the trajectory step-by-step. A computational model lets you skip steps. If I know the algorithm is 'sort the inputs,' I don't need to simulate the comparisons to know the output is sorted. If 'computation' doesn't give me that shortcut—if I still have to simulate the physics—then you're right, it's just dynamics. My claim is that the brain affords the shortcut."
  *   **Soft Spot:** You need to point to a specific case where we *have* that shortcut. If you can't, it's a promise, not a result.

  #### 5. The "Self-Rewriting Code" Objection (ML / Plasticity)
  *   **Timing:** Early/Mid. Medium Damage.
  *   **The Voice:** "In inference infra, weights are frozen during serving. In the brain, plasticity happens on the timescale of inference. The 'API' is rewriting itself while you're calling it. Is it still a computer if the logic changes every cycle?"
  *   **The Reply:** "It's a 'learning system' vs. a 'static program.' But even learning systems have a meta-algorithm. The contract isn't 'output Y for input X,' it might be 'update weights to minimize error Z.' That's still a computational specification. The contract is about the *learning rule*, not just the input-output map."
  *   **Soft Spot:** If the learning rule itself is context-dependent and non-algorithmic, you're back to dynamics.

  #### 6. The "Category Error" Objection (Embodied Philosopher)
  *   **Timing:** Late. High Damage (Specific to your Step 4).
  *   **The Voice:** "You said anti-representationalism is just a 'negative result' for you. But if the best description is purely dynamical coupling with no discrete states, you've admitted it's *not* a computer. You can't just redefine 'computer' to include 'non-computational dynamics' or the word loses meaning."
  *   **The Reply:** "I'm not redefining computer. I'm saying we test for the computational contract. If the test fails—if no discrete abstraction survives perturbation—then in that regime, the brain is not computing. It's doing something else. I am willing to say the cerebellum computes and the brainstem does not, if the data supports it. My claim is pluralistic, not totalizing."
  *   **Soft Spot:** This concedes that "The Brain Is A Computer" might be false for large chunks of the brain. Be ready to own that.

  #### 7. The "Level Selection" Objection (Mechanistic Philosopher)
  *   **Timing:** Late. Medium Damage.
  *   **The Voice:** "Who picks the level of description? If I pick the molecular level, the contract breaks. If I pick the behavioral level, it's trivial. Is 'computation' just 'the level where I can tell a good story'?"
  *   **The Reply:** "The level is picked by the *robustness*. It's empirical. We scan levels. Wherever the counterfactuals hold stable across perturbations, that's the computational level. It's not where I tell a good story; it's where the system actually maintains the contract."
  *   **Soft Spot:** There might be multiple levels that are equally robust. Which one is the "computation"?

  #### 8. The "Energy/Efficiency" Objection (Pragmatist)
  *   **Timing:** Late. Low Damage.
  *   **The Voice:** "Computers optimize for logic correctness. Brains optimize for energy and survival. Sometimes the 'bug' is the feature (e.g., noise aiding escape). Does your contract account for 'useful errors'?"
  *   **The Reply:** "The contract specifies the *goal*. If the goal is 'survive with minimum energy,' then a 'useful error' is actually a correct feature implementation. We just have to identify the loss function correctly. If the system is optimizing for something other than logical truth, that's a spec difference, not a category difference."
  *   **Soft Spot:** If the "loss function" changes unpredictably, you can't specify the contract.

  ---

  ### Part 5: The Prayer Question
  *The question you hope nobody asks because it exposes the lack of a positive hypothesis.*

  **The Question:** "You've told us how to *identify* a computer (robust contracts under intervention). But tell me: **What is the specific experiment you propose tomorrow that distinguishes your view from the dynamical systems view?** Give me a concrete prediction where 'Brain = Computer' says Yes and 'Brain = Dynamics' says No."

  **Survival Strategy:**
  Do not bluff a specific experiment you haven't thought through.
  *   **The Move:** "The prediction is about *generalization under structural damage*. A dynamical model predicts performance degrades proportional to the magnitude of the perturbation (graceful degradation). A computational model predicts performance stays flat until a threshold is crossed, then crashes (cliff-edge), because the logical state flips. Look for phase transitions in error rates, not linear declines. That's the signature of discrete state."
  *   **Why this works:** It leverages your engineering background (digital cliffs vs. analog drift) and gives them a concrete statistical signature to look for in their existing data.

  ### Final Advice
  You have the advantage of the "engineer" persona. Use it. When they get bogged down in definitions, pivot to **contracts, SLAs, and failure modes**. When they get bogged down in biology, pivot to **abstraction and robustness**. Your goal isn't to prove the brain is a Macbook; it's to prove that "computation" is the only vocabulary that captures *robustness to perturbation* better than "dynamics" does. Good luck.
