answer: |-
  # Equalities Distributional Analysis Procedure (EDAP) v1.0

  **Owner:** Equalities Analysis Team
  **Time Budget:** 4 Hours per proposal
  **Output:** 4-page Distributional Statement (max)
  **Analyst Requirement:** Two analysts (Level 7 entry)

  ## Introduction
  This procedure converts conflicting demands for income, capability, and wellbeing metrics into a sequential workflow. It does not seek a single number. It seeks a defensible account of who gains, who loses, and why. It distinguishes between mechanical data checks and judgment calls. Where metrics conflict, it does not average them; it flags the trade-off for elected members. Where statutory duties are breached, it stops the proposal.

  ---

  ## Step 1: Triage and Metric Licensing
  **Time Allocation:** 30 minutes
  **Mechanical/Judgment:** Mechanical (Checklist)

  *   **Question:** Does the proposal have a distributional effect (financial, spatial, or access-based) on distinct groups within the city?
  *   **Sufficient Answer:** Yes/No based on the report's executive summary. If Yes, identify the primary affected groups (e.g., "low-income households," "disabled residents," "carers").
  *   **Deficient Trigger:** If "No," the proposal bypasses this procedure (file as 'Neutral'). If groups cannot be identified, trigger **Deficiency Protocol A** (Request 24-hour delay for stakeholder consultation).
  *   **Next Step:** Step 2.
  *   **Metric Licensed:** None yet. This step licenses the *necessity* of the analysis under the Public Sector Equality Duty (PSED).

  ## Step 2: Resource Assessment (Income and Wealth)
  **Time Allocation:** 45 minutes
  **Mechanical/Judgment:** Mechanical (Data Lookup)

  *   **Question:** What is the net change in disposable financial resources for the identified groups?
  *   **Sufficient Answer:** A quantified estimate of weekly/monthly income change (gain/loss) using council tax data, benefits calculators, or fee schedules.
  *   **Deficient Trigger:** If data is unavailable, use **Proxy Protocol B** (Ward-level IMD score). Mark as 'Low Confidence'.
  *   **Next Step:** Step 3.
  *   **Metric Licensed:** **Resources**. Licensed because council proposals primarily alter financial flows and statutory duties require assessment of economic disadvantage.

  ## Step 3: Conversion Factor Audit (Capabilities)
  **Time Allocation:** 45 minutes
  **Mechanical/Judgment:** Judgment Call

  *   **Question:** Do personal, social, or environmental barriers prevent the identified groups from converting the resources in Step 2 into actual functionings (doing/being)?
  *   **Sufficient Answer:** A list of specific **Conversion Factors**. You must name them explicitly (e.g., "mobility impairment," "unpaid care hours," "digital exclusion," "transport connectivity"). Do not fold these into cost-of-living adjustments.
  *   **Deficient Trigger:** If the answer is "None" for a proposal affecting disabled people or carers, trigger **Deficiency Protocol C** (Mandatory consultation with Disability/Carer leads).
  *   **Next Step:** Step 4.
  *   **Metric Licensed:** **Capabilities** (Sen/Nussbaum). Licensed because income alone is unintelligible where impairment or care duties alter the cost of living or access to services.

  ## Step 4: Wellbeing and Lived Experience Check
  **Time Allocation:** 45 minutes
  **Mechanical/Judgment:** Judgment Call

  *   **Question:** Is there evidence that the proposal alters subjective wellbeing, mental health, or social connection, independent of income or access?
  *   **Sufficient Answer:** Reference to Public Health Outcomes Framework data, previous consultation feedback, or recognised correlation (e.g., "green space access correlates with reduced anxiety").
  *   **Deficient Trigger:** If evidence is anecdotal only, mark as 'Qualitative Only'.
  *   **Next Step:** Step 5.
  *   **Metric Licensed:** **Welfare**. Licensed because Public Health colleagues require evidence of lived experience, not just economic status.

  ## Step 5: Divergence and Conflict Resolution
  **Time Allocation:** 45 minutes
  **Mechanical/Judgment:** Judgment Call (Critical)

  *   **Question:** Do the three metrics (Resources, Capabilities, Welfare) rank the proposal's impact on inequality in the same direction?
  *   **Sufficient Answer:**
      *   **Aligned:** All three say "Narrows," "Widens," or "No Change." -> Proceed to Step 6.
      *   **Divergent:** One says "Narrows" while another says "Widens." -> **STOP.**
  *   **Deficient Trigger:** Attempting to average the scores or create a weighted index. This is forbidden.
  *   **Next Step:** If Aligned -> Step 6. If Divergent -> **Step 7 (Handoff)**.
  *   **Metric Licensed:** **Multiple**. This step acknowledges that equality is multidimensional.
  *   **Rule:** If metrics diverge, the proposal creates a value trade-off (e.g., efficiency vs. equity, or income vs. access). This is a political decision, not an analytical one. The statement must present the divergence clearly and recommend Member decision.

  ## Step 6: Legal and Statutory Duty Check
  **Time Allocation:** 30 minutes
  **Mechanical/Judgment:** Mechanical (Compliance)

  *   **Question:** Does the analysis indicate a high risk of breaching the Equality Act 2010 (Public Sector Equality Duty)?
  *   **Sufficient Answer:** "Low Risk" (due regard shown) or "High Risk" (adverse impact on protected characteristics without mitigation).
  *   **Deficient Trigger:** Any "High Risk" finding.
  *   **Next Step:** If "Low Risk" -> Step 7 (Drafting). If "High Risk" -> **STOP (Refuse)**.
  *   **Metric Licensed:** **Legal Compliance**. Licensed because the statement is a legal document subject to judicial review.

  ## Step 7: Drafting and Handoff
  **Time Allocation:** 45 minutes
  **Mechanical/Judgment:** Mechanical (Writing)

  *   **Question:** Is the statement under 4 pages, free of methodological argument, and clear on the verdict?
  *   **Sufficient Answer:** Document produced with clear headings: "Resource Impact," "Capability Barriers," "Wellbeing Impact," "Verdict."
  *   **Deficient Trigger:** Exceeding page limit or obscuring a "High Risk" finding.
  *   **Next Step:** Sign-off.
  *   **Metric Licensed:** N/A (Communication).

  ---

  ## Limitations and Misfire Risks
  **What this procedure cannot do:**
  1.  **Long-term modelling:** It cannot predict second-order effects beyond 12 months.
  2.  **Intersectional depth:** With only 4 hours, it cannot fully model the experience of a "disabled, low-income, ethnic minority woman." It will capture the primary axis of inequality but may miss compounded effects.
  3.  **Value Resolution:** It cannot decide if a gain for the middle class is *worth* a loss for the poorest. It only flags the trade-off.

  **Proposals on which it will misfire:**
  1.  **Symbolic Policy:** Proposals with no resource impact but high symbolic value (e.g., renaming streets) will fail Step 1 or 2, potentially underestimating wellbeing impacts.
  2.  **Systemic Restructuring:** Major organisational changes (e.g., outsourcing) are too complex for a 4-hour capability audit.
  3.  **Emergency Response:** In crises, the time budget is unrealistic; the procedure must be waived.

  ---

  ## Worked Cases

  ### Case A: Inclusive Playground Funding
  **Working:**
  *   **Step 1 (Triage):** Yes. Affects children, specifically disabled children and carers.
  *   **Step 2 (Resources):** Neutral. No fee change. Income impact = £0.
  *   **Step 3 (Conversion Factors):** **Identified:** "Mobility impairment" (surfacing), "Sensory processing" (equipment), "Care burden" (changing facilities). These barriers currently prevent usage. Removing them increases capability without changing income.
  *   **Step 4 (Wellbeing):** Positive. Social isolation reduced for carers.
  *   **Step 5 (Divergence):** Aligned. Resources (Neutral), Capabilities (Narrows Inequality), Welfare (Narrows Inequality).
  *   **Step 6 (Legal):** Low Risk. Advances equality of opportunity.
  *   **Step 7 (Drafting):** Proceed.

  **Verdict:** Proceed.

  ### Case B: Flat Rate Council Tax Reduction
  **Working:**
  *   **Step 1 (Triage):** Yes. Affects bottom two income bands.
  *   **Step 2 (Resources):** Positive for some (higher take-up), Neutral/Negative for others (flat rate vs. means-tested). Overall income poverty may narrow slightly due to administration efficiency.
  *   **Step 3 (Conversion Factors):** **Identified:** "Disability cost of living." Carer organisations note the flat rate ignores impairment costs. A household with a disabled member on £150 less support effectively loses capability, even if income is stable.
  *   **Step 4 (Wellbeing):** Mixed. Reduced stigma (positive), increased financial anxiety for disabled households (negative).
  *   **Step 5 (Divergence):** **Divergent.** Resources metric suggests "Narrows Inequality" (simplification/take-up). Capabilities metric suggests "Widens Inequality" (disabled households lose specific support).
  *   **Step 6 (Legal):** High Risk. Potential indirect discrimination against disabled persons.
  *   **Step 7 (Handoff):** The divergence rule triggers. The legal risk triggers a stop.

  **Verdict:** Refuse (Return to Directorate to add disability top-up).

  ### Case C: Free Leisure vs. Concessionary Travel
  **Working:**
  *   **Step 1 (Triage):** Yes. Affects leisure users and travel pass holders.
  *   **Step 2 (Resources):** Mixed. Leisure users gain value. Travel pass holders lose cash-equivalent value. Monitoring shows middle-income gain most leisure hours; lowest-income lose travel.
  *   **Step 3 (Conversion Factors):** **Identified:** "Transport connectivity." Lowest-income users rely on the pass to *reach* the leisure centre. Without the pass, the free entry is a resource they cannot convert into a functioning (swimming).
  *   **Step 4 (Wellbeing):** Negative for poorest (loss of independence/mobility). Positive for middle class.
  *   **Step 5 (Divergence):** **Divergent.** Resources: Widens (middle class gain more value). Capabilities: Widens significantly for poorest (access removed).
  *   **Step 6 (Legal):** **High Risk.** Removing travel support disproportionately affects disabled and elderly (protected characteristics). This is likely indirect discrimination.
  *   **Step 7 (Handoff):** Step 6 triggers a hard stop.

  **Verdict:** Refuse.

  ---

