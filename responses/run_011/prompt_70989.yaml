answer: |-
  **Referee's Report**

  **To:** The Host, Lakeside Philosophy Group
  **From:** Adjudicator
  **Re:** Dispute between Douglas and Nadia regarding Phosphorus Loading

  Here is the adjudication you requested, structured according to your four specifications.

  ### (a) Grading of Moves

  **(1) Douglas:** **Defensible.** His empirical claim regarding the negligible individual contribution to the total load is scientifically plausible for a single lot, but his inference that "no measurable difference" equals "no harm" assumes a linear causal model which Move (2) successfully challenges.

  **(2) Nadia:** **Clearly Right (Scientifically), Defensible (Philosophically).** She correctly identifies that shallow lakes often exhibit hysteresis and alternative stable states (turbid vs. clear), meaning the dose–response curve is not linear; however, applying this physical threshold to individual moral responsibility requires further argument.

  **(3) Douglas:** **Weak.** While the arithmetic of his expected utility calculation is internally consistent (see section b), the moral operation of multiplying a catastrophic harm by a small probability to dismiss it is contentious, and his assumption regarding the width of the uncertainty band is arbitrary.

  **(4) Nadia:** **Defensible.** This is a standard Kantian universalization argument; it effectively bypasses the probability problem but is vulnerable to Douglas's reply in (5) regarding non-ideal conditions.

  **(5) Douglas:** **Defensible.** He correctly identifies the gap between ideal theory (what everyone *should* do) and non-ideal reality (what others *actually* do); this creates a stalemate with Move (4) as neither side concedes the normative framework of the other.

  **(6) Nadia:** **Defensible.** She shifts to virtue ethics (integrity/complicity), which is a valid moral framework; **Douglas's Reply:** **Weak.** He dismisses non-consequentialist value as mere "feeling" without argument, failing to engage with the claim that participation in harm has intrinsic disvalue independent of outcome.

  ### (b) Adjudication on the Probability Calculation (Move 3)

  The operation of multiplying the magnitude of harm by the probability of being pivotal is legitimate **within the framework of expected utility theory**, which Douglas is employing. Regarding the figure: **His estimate of one in two hundred is arithmetically correct given the numbers he supplied in Move (1) and the assumption he made in Move (3).**

  In Move (1), Douglas establishes his lawn contributes 1/200 of the subdivision's load. In Move (3), he generously assumes the uncertainty band of the critical threshold is exactly equal to the subdivision's total contribution. Therefore, the probability that the threshold lies within the specific slice of load provided by his lawn is indeed (1/200 of Subdivision) ÷ (1 Subdivision) = 1/200. He has not taken the wrong denominator.

  However, this entitles him to conclude only that his **expected causal impact** is small. It does not entitle him to conclude that his **moral obligation** is negated, as that step requires the additional, unproven premise that moral obligation is strictly proportional to expected causal impact—a premise Nadia challenges in Moves (4) and (6).

  ### (c) Missed Points and The Single Assumption

  **What Douglas is right about:** He is correct that in a non-ideal world where others do not cooperate, an individual's sacrifice may be causally futile regarding the specific outcome (lake recovery). Nadia never adequately answers how her principle functions when the collective action fails to materialize.

  **What Nadia is right about:** She is correct that moral agency involves participation in patterns, not just isolated physical causation. Douglas never adequately answers why being a "free rider" on a cooperative scheme is permissible simply because the scheme is currently failing.

  **The Single Assumption:** The entire exchange turns on the **Principle of Individual Difference-Making**. Douglas assumes an act cannot be wrong if it makes no observable difference to the outcome; Nadia assumes an act can be wrong if it participates in a harmful pattern, regardless of individual difference. If they can agree that moral responsibility in collective action problems is not solely determined by individual causal efficacy, the argument dissolves.

  ### (d) Consistency Ruling (Car, Flights, Lawn)

  **Douglas cannot retain all three and remain consistent.**

  If Douglas's permission to fertilize rests on the claim that his individual contribution is too small to matter (Move 1) or that the expected harm is too low to outweigh cost (Move 3), he must apply this same calculus to his carbon emissions from driving and flying. Since the cumulative harm of carbon emissions is scientifically more certain and globally more severe than local phosphorus loading, his own logic demands he treat them identically.

  **He must surrender the Lawn first.**

  **Reasoning:** In Move (3), Douglas explicitly characterizes the cost of stopping fertilization as a "certain and modest cost." By contrast, surrendering his car or flights would impose a significantly higher cost on his mobility and lifestyle. If he is acting on a cost-benefit analysis (Expected Harm vs. Personal Cost), the Lawn is the rational first sacrifice because the personal cost is lowest while the expected harm (calculated by his own numbers) is of the same negligible order as his transport. To keep the car and flights while keeping the lawn is to admit that his principle is not "negligible harm" but "convenience," which contradicts his claim in Move (1) to be guided by quantitative rigor.
