answer: |-
  Consider Elara, a fabric inspector who applies the predicate "crimson" to swatches on a conveyor belt. We stipulate that her dispositions are complete and exceptionless: for every possible swatch she might encounter, she is causally determined to either apply the label or withhold it, and she never errs in her actual applications. Crucially, every application is governed by a standing intention: "I label this 'crimson' only if it truly merits the term, and I commit to retracting the label should I later judge it unmerited." She never actually retracts anything, for she never slips, yet her usage is held steady not by blind causal inertia but by this conditional commitment to correctness. Her behavior is perfectly regular and infinite in scope, yet the stability of her practice relies on her view that she *ought* to align her labels with the color, rather than merely *being* aligned with it.

  **How the Design Works**

  The dispositionalist analyzes Elara by aggregating her first-order dispositions (to label) and her second-order dispositions (to retract if judged wrong), claiming this total profile constitutes the fact of her meaning *crimson*. The mask stops them here: the profile describes what Elara *will* do, but her standing intention asserts what she *must* do. The dispositionalist can point to the mechanism of correction, but they cannot account for the authority of the correction. The skeptic's challenge survives the removal of finitude because the gap is not between *limited* data and *general* rules, but between *descriptive* facts (dispositions) and *normative* facts (meaning). Even with infinite data, a list of what one does is not a rule for what one should do.

  The single feature doing the work is **normative authority**. If you take this feature out—leaving Elara with the same complete dispositions but without the intention to retract based on merit—she becomes a mere measuring instrument. A spectrophotometer has complete, exceptionless dispositions to register wavelengths, but it does not *mean* crimson by its readings; it just reacts. The argument collapses without normativity because the distinction between following a rule and acting in accordance with a rule vanishes.

  Elara's friend will reply that the retracting intention is itself just another disposition—a higher-order causal tendency to feel discomfort and correct errors—so the total dispositional profile still fixes the answer. This reply merely restates the difficulty. It explains the psychology of correction but fails to justify it; it tells us why Elara *does* correct herself, but not why she is *right* to do so. By reducing the "ought" to an "is," the dispositionalist dissolves the normativity that makes Elara a rule-follower rather than a machine, leaving the skeptical paradox intact.
