answer: |-
  You are not the crazy one. You have stumbled into one of the oldest, messiest pits in metaphysics and legal theory: **Causation by Omission.**

  Your roommate is relying on a naive counterfactual theory ("If she had acted, he wouldn't have died, therefore she caused it"). You are intuitively reaching for a **Normative Theory** ("She caused it because she was *supposed* to act, unlike the 10,000 others"). Your intuition is closer to how courts and moral philosophers actually resolve this, but you lack the vocabulary to defend it against his "infinite omissions" attack.

  Here is the test you asked for. It is designed to stop the "infinite causes" explosion while preserving the distinction between the lifeguard and the crowd.

  ### The Test: The "Normative Counterfactual" Rule

  An omission $O$ by agent $A$ is a cause of outcome $E$ if and only if **all three** of the following clauses are met:

  1.  **Counterfactual Dependence:** Had $A$ performed the specific action $X$ (instead of omitting it), $E$ would not have occurred (or would have been significantly less probable).
  2.  **Assigned Responsibility:** At the time of $O$, $A$ was under a specific normative obligation (role, contract, law, or prior commitment) to perform $X$, which distinguishes $A$ from the general background of non-actors.
  3.  **Capacity:** $A$ had the physical and epistemic ability to perform $X$ at that moment.

  ***

  ### Mapping the Clauses to Your Nine Cases

  Here is how the machinery works on your examples.

  *   **Case 1 (Lifeguard):** **Passes.**
      *   *Clause 1:* Yes, jumping in saves the kid.
      *   *Clause 2:* **Load-bearing.** The job contract creates the obligation. This separates him from the sand-sitters.
      *   *Clause 3:* Yes, he was on duty and able.
  *   **Case 2 (The Crowd):** **Fails.**
      *   *Clause 1:* Yes, any one of them could have saved him.
      *   *Clause 2:* **Fails.** No specific duty. They are "background."
      *   *Verdict:* They did not *cause* it, though the *situation* is tragic.
  *   **Case 3 (Two Swimmers):** **Fails.**
      *   *Clause 1:* Yes.
      *   *Clause 2:* **Fails.** Unless one is a parent or lifeguard, mere presence does not create a legal or metaphysical duty in this framework.
      *   *Verdict:* (See "Overrules" below).
  *   **Case 4 (Plants w/ Promise):** **Passes.**
      *   *Clause 2:* The promise creates a temporary contract/duty.
  *   **Case 4 (Plants w/o Promise):** **Fails.**
      *   *Clause 2:* No duty. He is a passerby.
  *   **Case 5 (Doctor/Kidney):** **Fails.**
      *   *Clause 2:* Doctors have a duty to *patients*, not to the general population. No specific assignment to that stranger.
  *   **Case 6 (Kitchen Fire):** **Passes.**
      *   *Clause 2:* Co-habitants share a normative duty of care for the shared space. Both satisfy the duty clause.
  *   **Case 7 (Forgotten Kid):** **Passes.**
      *   *Clause 2:* Parental duty is the strongest normative obligation in this list.
      *   *Note:* Your intuition separates *cause* from *blame* (mens rea). This test agrees. Causation is established; blame is mitigated by lack of intent.
  *   **Case 8 (Levee):** **Passes.**
      *   *Clause 2:* The state has a statutory duty to maintain infrastructure.
  *   **Case 9 (Smoke Alarm):** **Passes (with a caveat).**
      *   *Caveat:* Removing batteries is an **act**, not an omission. However, framed as "failed to maintain alarm," it passes Clause 2 (homeowner safety duty).

  ***

  ### The Overrules: Where the Test Tells You You're Wrong

  You asked for honesty. This test forces you to abandon two of your intuitions.

  **1. The Two Swimmers (Case 3)**
  *   **Your Intuition:** Both caused it.
  *   **The Test:** Neither caused it.
  *   **Why:** Without a pre-existing duty (like parenthood or employment), mere capacity does not equal causation. If you accept that the 100-person crowd *didn't* cause it, you must logically accept the 2-person crowd didn't either, unless you can identify a threshold where "number of people" creates "duty." There is no such threshold. The test forces you to say: *The kid drowned because no one with a duty was present.*
  *   **The Trade:** You lose the verdict on Case 3 to save the verdict on Case 2. If you say the two swimmers caused it, you cannot explain why the 100 swimmers didn't.

  **2. The Crowd (Case 2)**
  *   **Your Intuition:** "The crowd let him drown" is true.
  *   **The Test:** The statement is metaphorically true but causally false.
  *   **Why:** "The crowd" is not an agent. Individuals are. Since no individual satisfied Clause 2, no individual caused it.
  *   **The Trade:** You must accept that sometimes terrible things happen with *no specific human cause* other than the aggressor (the water, the disease, the accident). This is uncomfortable, but necessary to prevent "everyone causes everything."

  ***

  ### Running the New Cases

  **Case A: The Router Unplugging**
  *   *Scenario:* Someone unplugs the break-room router, so the alarm notification never reaches the nurse.
  *   **Verdict:** **Cause.**
  *   **Analysis:** This is not an omission; it is an **intervention**.
      *   *Clause 1:* If they hadn't unplugged it, the nurse gets the alert.
      *   *Clause 2:* There is a negative duty *not to interfere* with safety systems, which applies to everyone (unlike the positive duty to act, which applies only to the nurse).
      *   *Distinction:* The nurse *failed to save* (omission). The router-unplugger *prevented saving* (commission). The unplugger is arguably more causally potent than the nurse.

  **Case B: Skipping the Election**
  *   *Scenario:* You skip voting; your candidate would have funded the levee; the town floods.
  *   **Verdict:** **Not a Cause.**
  *   **Analysis:**
      *   *Clause 1:* **Fails.** Counterfactual dependence is too weak. One vote rarely decides an election. You cannot say "If I had voted, the levee would be built."
      *   *Clause 2:* **Fails.** While voting is a civic duty, it is not a specific assignment to the levee outcome.
      *   *Result:* You are morally accountable perhaps, but you did not *cause* the flood. The chain is too long and the leverage too small.

  ***

  ### The Roommate's Fork: Is He Right?

  Your roommate's argument is: *"The lifeguard didn't teleport, didn't grow gills, didn't sing a song that stops water. If omission is cause, then every non-action is a cause. So either all omissions count or none do."*

  **He is wrong.** Here is the precise philosophical rebuttal you can use.

  He is assuming a **Binary World** where every possible action is on equal footing. But causation is **Contrastive**. We do not ask "Did the lifeguard's behavior cause the death?" We ask "Did the lifeguard's *actual* behavior cause the death *rather than* his *expected* behavior?"

  1.  **The Default Baseline:** We judge omissions against a "normal course of events." The normal course for a lifeguard is watching the water. The normal course for a stranger is sitting on the sand.
  2.  **The Relevance Filter:** We only count omissions that deviate from the agent's specific baseline.
      *   Lifeguard sitting = Deviation from baseline = Cause.
      *   Lifeguard not teleporting = Consistent with baseline (lifeguards don't teleport) = Not a Cause.
      *   Stranger sitting = Consistent with baseline = Not a Cause.

  **What you have to give up:**
  If he is right (that it's all-or-nothing), you have to give up **Distinction.** You have to accept that you are equally responsible for every starvation death on earth because you didn't mail your wallet to a charity.

  **What he has to give up:**
  If you are right (using the Normative Counterfactual Test), he has to give up **Simplicity.** He cannot say "She didn't act, therefore she killed him." He has to say "She didn't act, *and she was the specific person obligated to act*, therefore she is the cause."

  **The Verdict:**
  You are not the crazy one. Your intuition that "not-doing-something" requires a "reason-to-do-it" to count as causation is the standard position in law and ethics. Your roommate is arguing for a metaphysical technicality that collapses under the weight of reality.

  Tell him this: *"If I don't buy you a Ferrari, I haven't caused your poverty. If I promise to buy you a Ferrari and don't, I have caused your financial loss. The physics of the money transfer is the same. The only variable is the obligation. Therefore, obligation is a necessary condition for causal attribution in omissions."*

  If he still says you're a philosophy bro, tell him to check his nursing textbook under "Negligence." It requires a **Duty of Care**. No duty, no negligence. No negligence, no causal liability. He's arguing against his own future licensing board.
