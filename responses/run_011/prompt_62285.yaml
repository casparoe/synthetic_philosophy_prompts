      *   **Negative Heuristic:** Instructions on what not to touch (the hard core).
      *   **Progressive:** Predicts novel facts, increases empirical content.
      *   **Degenerating:** Explains anomalies only by *ad hoc* adjustments, fails to predict novel facts, loses empirical content.
