answer: |-
  # Design Spec: Epistemic Requirements for Water Utility Decision Support

  ## 1. Desiderata for Imprecise Belief Representation

  The following requirements define what the belief module must deliver to be operationally viable. Note the distinction between *epistemic coherence* (mathematical consistency) and *operational adequacy* (usable output).

  | Requirement | Case / Consideration | Status | Camp / Note |
  | :--- | :--- | :--- | :--- |
  | **1. Coherent Updating** | The system must specify how the set of probabilities shifts upon new data (e.g., Generalized Bayes). Without this, the "convex hull" is static and ignores sensor data. | **Non-negotiable** | Consensus (Walley/Weichselberger). |
  | **2. Asymptotic Precision** | As data accumulates, the set *should* generally narrow (converge). If the interval stays wide indefinitely despite massive data, the model is broken. *Correction:* You called this "congestion"; the standard term is **Convergence** or **Consistency**. "Dilation" is when it gets *wider*. | **Non-negotiable** | Consensus (Frequency calibration). |
  | **3. Decidability** | The tool must output a single action (e.g., "Shut Well") even if the belief state is indeterminate. It cannot return "No Preference." | **Non-negotiable** | **Engineering/Decision Camp.** (Epistemologists allow suspension of judgment; engineers cannot.) |
  | **4. Non-Vacuity Principle** | The set cannot be $[0, 1]$ unless evidence is truly null. There must be a mechanism linking evidence weight to interval width (e.g., using a lower/upper expectation). | **Non-negotiable** | Consensus (Otherwise coherence is trivial). |
  | **5. Ontological Neutrality** | The math must work regardless of whether the set represents *ignorance of a true value* (Epistemic) or *inherent variability* (Aleatory). | **Preference** | **Objective Bayesian Camp** prefers "true value exists." **Subjective Imprecise Camp** prefers "set is the belief." |
  | **6. Conglomerability** | If an event is preferred conditional on every partition of a variable, it must be preferred unconditionally. Prevents sure-loss strategies in sequential decisions. | **Preference** | **Walley/Coherence Camp.** (Some subjective Bayesians drop this to avoid Dilation.) |

  ## 2. The Dilation Case: Analysis & Verdict

  **Your Scenario:**
  *   **Prior:** $[0.39, 0.41]$ (Experts agree on marginal risk).
  *   **Data:** Sensor reads "High." Marginally $P(High) \approx 0.5$ for all experts.
  *   **Likelihoods:** Expert A says $P(High|Bad) \gg P(High|Good)$. Expert B says $P(High|Bad) \ll P(High|Good)$.
  *   **Posterior:** Interval widens to $[0.1, 0.7]$.

  **Diagnosis:**
  This is **Dilation** (Walley, 1991). You have not misdescribed the setup. It occurs because the *reliability* of the sensor is disputed, even if the *marginal* output is agreed upon. The data tells you nothing about the well *unless* you know which expert is right about the sensor physics. Since the data doesn't resolve the expert disagreement on physics, and the experts interpret the data in opposite directions, the uncertainty about the *interpretation* swamps the data.

  **Verdict:**
  An adequate theory must **eat it**.
  *   **Do not prevent it:** Mechanisms that force the interval to narrow (e.g., averaging the likelihoods before updating) violate **Conglomerability** and expose the utility to sure-loss bets (Dutch Books) in sequential operations.
  *   **Do not explain it away:** It is not a bug; it is a feature. It correctly signals: *"This sensor reading is useless until we resolve the hydrogeological model disagreement."*
  *   **Trade-off:** You must keep **Conglomerability**. Dropping it to avoid dilation allows incoherent sequential decisions. In a safety-critical utility context, coherence (avoiding sure loss) trumps intuitive comfort (expecting learning to always reduce uncertainty).

  ## 3. Incompatibilities (The "Result")

  You asked for conflicts where requirements cannot be satisfied together. There are two critical tensions you must resolve in the spec.

  ### A. Decidability vs. Faithful Representation
  *   **Conflict:** A faithful representation of the three experts (0.05, 0.4, 0.8) creates a belief state where Action X is optimal for Expert 1, and Action Y is optimal for Expert 3. A coherent imprecise theory (e.g., **Maximality**) says "No action dominates; suspend judgment."
  *   **Constraint:** Your spec requires a single recommendation (**Decidability**).
  *   **Resolution:** You must violate strict epistemic coherence at the decision stage. You will need a **tie-breaking rule** (e.g., Minimax Regret or a weighted selector) that is *external* to the belief state.
  *   **Spec Implication:** Explicitly state that the *Decision Module* imposes a risk attitude not present in the *Belief Module*.

  ### B. Dilation vs. Intuitive Learning
  *   **Conflict:** As shown in your sensor case, respecting expert disagreement (Conglomerability) implies that some data will increase uncertainty (Dilation).
  *   **Constraint:** Stakeholders expect "more data = more certainty."
  *   **Resolution:** You cannot satisfy both. If you force certainty, you lie about the model disagreement.
  *   **Spec Implication:** The UI must explain *why* uncertainty increased (e.g., "Sensor reading highlights model disagreement").

  ## 4. The Killer Requirement

  **Conglomerability.**

  This is the single requirement that knocks out the most candidate theories.
  1.  **Knocks out Precise Bayesianism:** You cannot average the experts (0.05, 0.4, 0.8) into 0.41 without losing the disagreement structure.
  2.  **Knocks out "Fix-it" Imprecise Models:** Many simplified interval models violate conglomerability to ensure intervals always shrink.
  3.  **Forces Dilation:** As established, accepting conglomerability forces you to accept that uncertainty can grow with data.

  If you drop Conglomerability, you can build a simpler tool, but it will be mathematically vulnerable in sequential decision contexts (e.g., testing today, deciding tomorrow). For a utility, this is unacceptable risk.

  ## 5. Decision Rule Scorecard

  Since the tool *must* act, you need a rule to collapse the set into a choice. Here is how standard rules perform against your desiderata.

  | Rule | Mechanism | Pros | Cons | Fit for Spec |
  | :--- | :--- | :--- | :--- | :--- |
  | **Maximin (Gamma-Maximin)** | Maximize the minimum expected utility across the set. | **Decidable.** Always yields an action. Extremely cautious (safe for utilities). | Ignores "upside." Can be overly conservative (shuts wells too often). | **High.** Best for safety-critical "must act" constraints. |
  | **Maximality** | Action A is chosen if no other action has higher expected utility for *all* probabilities in the set. | **Faithful.** Respects the set structure perfectly. | **Indecisive.** Often yields a set of "admissible" actions, not a single choice. Violates Decidability. | **Low.** Theoretically pure, operationally broken for you. |
  | **E-Admissibility** | Choose action that is optimal for *at least one* probability in the set. | Identifies all potentially optimal actions. | Even more indecisive than Maximality. Requires secondary tie-breaker. | **Low.** Too much ambiguity. |
  | **Interval Dominance** | Reject action if its max utility < another's min utility. | Weak filter, computationally cheap. | Very indecisive. Leaves many actions tied. | **Low.** Not strong enough for final recommendation. |

  **Recommendation:** Use **Maximin** for the final recommendation engine, but display the **Maximality** set in the UI (e.g., "Recommended: Shut. Alternative: Monitor").

  ## 6. Status of Imprecision

  **Is imprecision rationally required or only permitted?**

  *   **Standard View:** Imprecision is *permitted* (you are allowed to be vague if evidence is sparse).
  *   **Your Case:** Imprecision is **Required**.
      *   **Reason:** You have *conflicting expert elicitation* (0.05 vs 0.8), not just sparse data. Averaging them into 0.41 creates a "spurious precision" that claims a consensus which does not exist.
      *   **Spec Language:** "The system shall not aggregate expert priors into a single distribution. Disagreement constitutes a distinct state of knowledge from uncertainty."

  ## 7. Summary of Corrections to Your Suspicions

  1.  **"Congestion":** Incorrect label. Use **Convergence** (for narrowing over time) and **Dilation** (for widening after data).
  2.  **"Always Picks Something":** This is a **prejudice of the Decision Theory/Engineering Camp**. Pure epistemology allows "I don't know." You are overruling epistemology for engineering necessity.
  3.  **Ontology:** Does the choice change requirements? **Yes.** If you claim there is "one true probability," you must model the set as a confidence distribution over that value. If you claim the set *is* the belief, you use Imprecise Probability theory. The latter is more robust for expert disagreement.
  4.  **Dilation:** It is real in your setup. **Keep Conglomerability.** Accept Dilation. Explain it to the stakeholders.
