answer: |-
  To underwrite episode-specific praise and blame, an adequate theory of moral worth must satisfy the following specification.

  **D1 (Act-Localization):** The theory must assign a determinate value of moral worth to token actions, not merely to agents, characters, or life narratives. *Case:* Evaluating a single truth-telling episode distinct from the agent's general honesty. **Hard Constraint** (per your target).

  **D2 (Rightness Condition):** An action cannot possess positive moral worth if it is objectively wrong or subjectively mistaken about right-making features. *Case:* A well-intentioned but disastrous intervention lacks positive worth. **Hard Constraint**.

  **D3 (Reasons-Responsiveness):** Moral worth must depend on the agent's motivating reasons, not merely on the action's alignment with duty or good outcomes. *Case:* The shopkeeper who charges fairly only to protect his reputation lacks the worth of the shopkeeper who charges fairly because it is right. **Hard Constraint**.

  **D4 (Compliance Differentiation):** The theory must assign distinct worth values to (i) the act performed under voluntary neural constraint, (ii) the act of installing the constraint, and (iii) the motive for installation (e.g., duty vs. sparing temptation), without collapsing (i) into (ii). *Case:* The Neural Compliance Module scenario. **Hard Constraint**.

  **D5 (Praise-Blame Symmetry):** The magnitude of moral worth must track the appropriateness and intensity of episodic praise or blame. *Case:* We praise a difficult sacrifice more than an easy one; the theory must explain why. **Hard Constraint**.

  **D6 (Overdetermination):** The theory must specify whether acting for both duty and inclination diminishes, preserves, or enhances worth. *Case:* Helping a friend because you love them and because it is right. **Camp Preference** (Kantians often demand purity; pluralists allow mixture).

  **Impossibility Analysis:** D1, D3, and D4 form an inconsistent triad. If the neural module bypasses reasoning processes to guarantee right action, the token act (D1) fails Reasons-Responsiveness (D3) because no reasoning occurs during the episode. If the act lacks worth, but the installation was praiseworthy, praise attaches to the prior act or the disposition, violating the demand to evaluate the current episode (D1). To satisfy all three, a theory must claim the modulated act *does* involve reasons (counterintuitive) or that the installation's worth transfers to the modulated act (collapsing D4's distinction). Most plausible theories break here: they either shift worth to character (violating D1) or deny worth to reliable acts (violating D5).

  **Scorecard:** The motive-of-duty view secures D3 and D5 but struggles with D4, often denying worth to the modulated act despite the agent's endorsement, and risks rigidity on D6. A pluralist view handles D4 and D6 more flexibly by allowing multiple right-making features to confer worth, but risks diluting D3 until it resembles mere rightness. The character-based view naturally solves D4 by locating worth in the disposition to install the module and the stability it provides, but this explicitly fails D1, requiring the redefinition flag you requested since it treats the episode as a symptom rather than the locus of worth.

  Verdict: D3
