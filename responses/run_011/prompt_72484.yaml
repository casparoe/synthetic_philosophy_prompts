      *   *Engineers:* Give them a "Job." They are the "Auditors." They calculate the Expected Value (EV) for the group *after* the choices, not before.
      *   *Trading:* Explicit rule: No trading. Tokens are personal voting power.
      *   *Currency:* "Book Votes." 1 Vote = 1 point toward selecting a book. 3 Books up for selection. The group aggregate determines the book. This makes it linear (10 votes is twice as influential as 5) and meaningful.
