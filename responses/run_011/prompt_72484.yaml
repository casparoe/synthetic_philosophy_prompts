      *   *Wait, does Allais violate SEU for ALL utility functions?* Yes, the Independence Axiom violation holds for *any* utility function $u$. $u(5) > 0.1u(10) + 0.89u(5) + 0.01u(0)$ implies $0.11u(5) + 0.89u(0) > 0.1u(10) + 0.9u(0)$. If you reverse the preference in the second pair, you contradict the first inequality mathematically.
