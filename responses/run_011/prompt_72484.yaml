              *   In Choice 1, 0 is the worst. In Choice 2, 5 is the worst.
              *   If I am risk averse (weighting the worst outcome), I should value the improvement of the worst outcome (0->5) more than the improvement of the best outcome.
              *   *Okay, let's stick to the Allais Paradox.* It's the most robust "SEU is broken" demo for laypeople. It motivates the need for RWEU.
              *   *Addressing the "Concave Utility" distinction:* I will advise the user to stipulate linearity of the currency (Votes) and challenge the group to see if they still feel risk aversion. If they do, and they violate Independence (Allais), SEU is dead for them.

