      *   *The Problem:* In a simple gamble (Safe vs. Risky), a concave $u$ and a convex $r$ can produce identical choices.
      *   *The Solution:* We need a setup where the *ranking* of outcomes changes the weight, independent of the probability values themselves, or where the marginal rate of substitution between probabilities changes in a way $u$-curvature can't explain.
