answer: |-
  Here is a design for a 90-minute session that respects your constraints, leverages your group's sharpness, and isolates the theoretical distinction you want to explore without getting bogged down in math.

  ### The Core Concept: "The Book Vote Gambit"

  You are correct that two-outcome gambles cannot separate concave utility from risk-weighting. You need **three outcomes** to shift the *rank* of an outcome while holding probabilities steady. The minimal structure required is the **Allais Paradox** (specifically the Common Consequence effect).

  **Why this works:**
  In Standard Expected Utility (SEU), if you prefer a Sure Thing over a Gamble in Scenario 1, you *must* prefer the corresponding Safe option over the Risky option in Scenario 2. If a participant chooses **Safe in Scenario 1** and **Risky in Scenario 2**, they have violated the "Independence Axiom." SEU cannot explain this without claiming the person is irrational. Risk-Weighted Expected Utility (RWEU) explains it as rational: the participant weights the probability of the *worst* outcome more heavily in Scenario 1 than in Scenario 2.

  **The Currency:**
  Use **"Voting Chips."**
  *   **Why:** You need linear utility. Money implies diminishing marginal value (the 100th dollar matters less than the 1st). "Votes" are inherently linear: 10 votes is exactly twice as much influence as 5 votes in selecting a book.
  *   **Physical Form:** Poker chips or colored cardstock squares.
  *   **Stakes:** The group aggregates everyone's chips at the end to vote on next quarter's books.
  *   **Penalty:** The individual with the *lowest total chip count* at the end buys coffee. This creates a "floor" anxiety without bending the utility of the chips themselves.

  ---

  ### Part 1: Logistics & Materials

  **Materials Needed:**
  1.  **Voting Chips:** 300 total (e.g., 15 red, 15 blue per person max).
  2.  **Choice Ballots:** Pre-printed slips (see below).
  3.  **Opaque Envelopes:** One per person, per round (to ensure secrecy).
  4.  **Resolution Device:** A 20-sided die (d20) or a spinner divided into 20 sectors. (Dice feel more "final" to engineers).
  5.  **Tally Sheet:** For you to record aggregate choices.
  6.  **Whiteboard:** For the debrief only (keep it covered during the game).

  **Room Setup:**
  *   Arrange chairs so people cannot see neighbors' ballots.
  *   **Rule 1:** No talking during choice phases.
  *   **Rule 2:** No trading chips. Ever. (Write this on the board).
  *   **Rule 3:** Engineers are designated "Actuaries." Their job is *not* to advise during the game, but to calculate the Expected Value (EV) of each option *after* the choices are locked. This gives them a job that keeps them quiet until you want them to speak.

  ---

  ### Part 2: The Activity Flow (90 Minutes)

  #### 0:00 – 0:15: Setup & Framing
  *   **Intro:** "We are allocating the group's voting power for next quarter's books. You start with 0 chips. You will make two decisions. Each decision can earn you chips. The person with the fewest chips buys coffee for a month."
  *   **Linearity Check:** Ask the room: "If I have 10 votes and you have 5, do I have exactly twice your say in the book selection?" Get verbal confirmation. This locks in $u(x) = x$.
  *   **Distribute:** Hand out ballots and envelopes.

  #### 0:15 – 0:45: The Game (Two Rounds)
  *   **Round 1 (The High-Probability Frame):**
      *   **Option A (Safe):** You get **50 Chips** guaranteed.
      *   **Option B (Risky):** Roll the d20.
          *   Roll 1: **0 Chips**
          *   Roll 2–10 (9 sides): **50 Chips**
          *   Roll 11–20 (10 sides): **60 Chips**
      *   *Instruction:* "Mark A or B. Fold it. Put it in the envelope. Seal it."
      *   *Collect envelopes.* Do not open yet.

  *   **Round 2 (The Low-Probability Frame):**
      *   **Option C (Safe):** Roll the d20.
          *   Roll 1–11 (11 sides): **50 Chips**
          *   Roll 12–20 (9 sides): **0 Chips**
      *   **Option D (Risky):** Roll the d20.
          *   Roll 1: **0 Chips**
          *   Roll 2–11 (10 sides): **0 Chips**
          *   Roll 12–20 (10 sides): **60 Chips**
      *   *Instruction:* "Mark C or D. Fold. Seal. Hand in."

  *   **Resolution (0:40 – 0:45):**
      *   Pick one volunteer to roll the die for Round 1, one for Round 2.
      *   Open envelopes. Distribute chips based on the roll results and their choices.
      *   Tally totals. Announce who buys coffee (keep it lighthearted).

  #### 0:45 – 1:15: The Debrief (The "Aha" Moment)
  *   **Step 1: The Reveal.** Ask for a show of hands.
      *   "Who picked A (Safe) in Round 1?"
      *   "Who picked D (Risky) in Round 2?"
      *   Look for the people who raised hands for *both*. (Statistically, 40-60% of people will do this).
  *   **Step 2: The Engineer Check.** Ask your ex-engineers: "Look at the math. If I preferred A over B, shouldn't I logically prefer C over D?"
      *   Let them work it out on the board.
      *   *The Math:*
          *   Round 1 compares: $100\% \text{ of } 50$ vs. $10\% \text{ of } 60 + 89\% \text{ of } 50 + 1\% \text{ of } 0$.
          *   Round 2 compares: $11\% \text{ of } 50 + 89\% \text{ of } 0$ vs. $10\% \text{ of } 60 + 90\% \text{ of } 0$.
          *   Notice that **89% of the time, the outcome is identical** in both rounds (either 50 chips or 0 chips). SEU says you should ignore the common part. If you liked the 50-chip guarantee in Round 1, you should like the *chance* at 50 chips in Round 2 more than the chance at 60.
      *   If they picked A and D, they violated the math of Expected Utility.
  *   **Step 3: The Interpretation.**
      *   "SEU says you are irrational. It says your risk attitude must be baked into the value of the chips (concave utility). But we agreed chips are linear votes."
      *   "RWEU says you are rational. In Round 1, the 1% chance of 0 felt heavy because it was the *worst* outcome in a sea of wins. In Round 2, the 90% chance of 0 was already expected, so the risk weight shifted."
      *   "This separates risk attitude (how you weight the rank of outcomes) from utility (how much you like chips)."

  #### 1:15 – 1:30: Discussion & Wrap
  *   Open the floor. "Is it irrational to care more about avoiding the zero when you were expecting to win?"
  *   Introduce the term **Risk-Weighted Expected Utility** (Buchak) only now.
  *   Collect the envelopes. (You can analyze individual data later if you want).

  ---

  ### Part 3: Troubleshooting & Predictable Failures

  **1. The "Engineer Takeover"**
  *   *Risk:* They calculate EV out loud during the choice phase. (Note: Option B and D actually have slightly higher EVs. If they shout this, everyone will pick Risky, ruining the paradox).
  *   *Fix:* Give the engineers a sealed "Actuary Report" to open *only after* all envelopes are collected. The report contains the EV calculations. Tell them beforehand: "If you reveal the math early, you ruin the data. Your job is to verify the irrationality *after*."

  **2. The "Utility Bending" Objection**
  *   *Risk:* Someone says, "I picked Safe because 50 votes guarantees we get my book, but 60 doesn't matter twice as much." (This claims concave utility).
  *   *Fix:* Remind them of the Linearity Check at the start. "We agreed 10 votes is twice 5. If you feel otherwise, you're arguing against the rules of the currency, not the decision theory."
  *   *Better Fix:* Acknowledge this is the *exact* debate. SEU saves itself by saying "Your utility isn't linear." RWEU saves itself by saying "Your utility is linear, but your risk function is curved." The activity shows why SEU has to work harder to explain the A+D pattern.

  **3. Secrecy Failure**
  *   *Risk:* People peeking.
  *   *Fix:* Use opaque envelopes. Collect them immediately. If someone peeks, their ballot is void (they get 0 chips). Harsh, but necessary for data integrity.

  **4. Trading**
  *   *Risk:* "I'll give you 5 chips now for 10 later."
  *   *Fix:* The "Coffee Penalty" is individual. If they trade, they might save themselves but doom a friend. Make it clear: "The coffee penalty applies to the person holding the chips at the end. Trading is forbidden."

  ---

  ### Part 4: What This Activity Cannot Do (The "Straight Talk")

  You asked me to be straight about the limitations. Here is what this 90-minute session **cannot** reproduce, which you will need to supply in your closing talk:

  **1. Dynamic Inconsistency (The Dutch Book)**
  *   **The Issue:** RWEU agents can be "money pumped" in sequential decisions. If I offer you a trade based on your current risk weights, then change the context slightly, your weights shift, and I can trade you back to the start for a fee. You lose money every cycle.
  *   **Why the activity misses it:** This is a one-shot game. There is no sequence where their shifting risk weights can be exploited over time.
  *   **Your Talk:** You must explain: "Today you felt rational. But if we played this every week, and I offered to buy your 'Safe' ticket and sell you a 'Risky' one based on your preferences, I could drain your chips by Tuesday. SEU agents can't be pumped. RWEU agents can. Is avoiding the 'irrational' feeling of the Allais Paradox worth the risk of being exploited over time?"

  **2. Separating "Long Shot Overweighting" from "Global Risk Aversion"**
  *   **The Issue:** Prospect Theory says people overweight small probabilities (the 1% chance). RWEU says people weight based on the *cumulative rank* (the bottom of the distribution).
  *   **Why the activity misses it:** The Allais Paradox is consistent with *both* theories.
  *   **Your Talk:** You need to clarify: "Prospect Theory says you loved the 10% chance in Round 2 because 10% feels like 20%. Buchak's RWEU says you loved it because in Round 2, the '0' outcome was already the default, so you were weighting the *improvement* from 0 to 60. The math looks similar here, but the philosophy differs. One is about perception of numbers; the other is about attitude toward security."

  **3. Definitive Separation of Utility vs. Risk**
  *   **The Issue:** As noted above, a skeptic can *always* claim their utility curve is weird enough to fit the data.
  *   **Your Talk:** "We stipulated linear utility (votes). If you accept that stipulation, SEU is dead. If you don't, then we can't measure risk attitude at all. Philosophy often requires stipulating a model to see if it breaks. Today, we broke SEU."

  ### Summary Checklist for You
  1.  **Print Ballots:** Clearly label Option A/B and C/D with the dice outcomes.
  2.  **Get Chips:** Poker chips are best (tactile, countable).
  3.  **Brief Engineers:** Pull the two ex-engineers aside 5 minutes early. Tell them: "I need you to hold fire on the math until the reveal. Can I count on you to be the 'Actuaries'?" They will love the title.
  4.  **Prepare the "Coffee" Talk:** Have a joke ready about the coffee loser. It lowers the stakes enough to prevent panic, but keeps the "loss" real.

  This design respects their intelligence, avoids the "lecture" format, and creates the exact empirical tension Buchak's theory resolves. Good luck with the group.
