      *   **Part (b): Negative Responsibility & Jim (6 marks)**
          *   *Definition:* "Answerable for what we allow to happen as well as for what we do, since our omissions have consequences too."
          *   *Application to Jim:* Jim, Pedro, 20 Indians, offer to kill 1 to save 19. Utilitarianism says shoot.
          *   *Critique:* The definition of negative responsibility is standard. The application to Jim is accurate. The student notes that it "loads Pedro's decision onto Jim." This is a good insight (responsibility for others' actions).
          *   *Accuracy:* High. This is the strongest part of the answer.

      *   **Part (c): Positive Alternative? (4 marks)**
          *   *Claim:* "Williams endorses agent-centred constraints: rules forbidding an agent from killing even where killing would prevent others from killing more."
          *   *Critique:* **This is a significant philosophical error.** Williams is famously *skeptical* of moral theory generally. He does not offer a systematic positive alternative like "agent-centred constraints" (which sounds more like Ross or Nozick or a specific deontological framework). Williams's point is largely destructive/critical of utilitarianism (and moral theory's demand for systematization). He suggests we should look to "ground projects" and thick ethical concepts, but he explicitly resists codifying a new normative theory. Saying he "endorses agent-centred constraints" as a *theory* misrepresents his anti-theory stance.
