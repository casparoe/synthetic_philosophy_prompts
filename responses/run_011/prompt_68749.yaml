          *   Likely the "Actor" section on *selection*. SH might reject "functional teleology."
          *   Historiography flags: Black Death wage theory is contested (some say wages didn't rise everywhere).

  4.  **Review and Refine:**
      *   *Tone Check:* Is it too dry? Needs to sound like two tired academics compromising.
      *   *Constraint Check:* Did I include the "three rungs" classification explicitly? Yes.
      *   *Constraint Check:* Did I answer the "where is this wrong" prompt at the end? Yes.
