          *   *Selection vs. Intention:* Can evolutionary selection count as "goal-directedness"? EH says yes (functional teleology). SH says no (metaphor only).
          *   *Verbal Dispute:* If they agree on the physics/biology but fight over the noun "actor," it's verbal. But if "actor" implies *unmediated* impact, it's substantive.

      *   **Section 4: The Cruxes.**
