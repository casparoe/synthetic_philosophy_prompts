answer: |-
  **MEMORANDUM**

  **TO:** Standing Faculty Committee on Student Affairs; Office of the Provost
  **FROM:** Chair, Standing Faculty Committee on Student Affairs
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal for Predictive Default Enrollment in Transition Seminar

  **1. BOTTOM LINE RECOMMENDATION**

  The Committee **rejects** the Office of Student Success's proposal to default-enroll at-risk students into the transition seminar without immediate, individual disclosure of the criteria used for their selection.

  The Committee **approves** a modified design: **Targeted Default Enrollment with Immediate Disclosure.** Under this design, students in the top risk quintile are default-enrolled, but the notification email must explicitly state that their placement is based on predictive indicators of academic risk. They retain the right to opt-out via a frictionless online process during the first two weeks.

  We accept that this condition will likely reduce participation rates and diminish the projected retention gains cited in the vendor's pilot. We hold that an intervention that requires opacity to function is illegitimate in a public university context, regardless of its efficacy. If the Office of Student Success determines this modification renders the program operationally futile, the proposal should be withdrawn and replaced with a Universal Default model (enrolling all first-year students) for the next academic cycle, which would resolve the ethical deficits while preserving the behavioral mechanism.

  **2. CLASSIFICATION OF THE MECHANISM: NUDGE OR DIRECTIVE?**

  The proposal characterizes the default enrollment as a "nudge," relying on the Thaler and Sunstein definition that choice is formally preserved via the opt-out. We must reject this classification as merely taxonomic. It carries significant normative weight.

  A nudge implies a low-cost correction of cognitive bias in an environment where the chooser's interests align with the chooser's welfare. Here, the "choice architecture" is built by an institution that controls the student's financial aid, academic record, and schedule. The "friction" required to opt-out is not merely cognitive; it is bureaucratic. A student must notice the enrollment, understand its implications, navigate the registration system, and alter a timetable that may now be constrained by the seminar's slot.

  When the architect of the choice holds coercive power over the chooser, the distinction between a "default" and a "mandate" collapses. Classifying this as a nudge attempts to depoliticize an exercise of administrative authority. If we accept the "nudge" label, we risk insulating the intervention from scrutiny regarding power asymmetry. We must treat this as an **Administrative Directive with Opt-Out Privileges.** This classification matters because directives require a higher burden of justification than nudges. They require not just that they *work*, but that they are *right*.

  **3. THE ANNOUNCABILITY CONDITION**

  I drafted the Announcability Condition into this committee's charge to serve as a constraint on legitimacy, not merely effectiveness. The condition states: *an intervention is permissible only if it could be announced, in plain terms, to the people subjected to it, without the announcement either defeating the intervention or rendering it indefensible to them.*

  The vendor's data presents a direct violation of this condition. The intervention functions *only* when the rationale is withheld. When announced, the "gain disappears." The Office's counter-proposal—to disclose the methodology in aggregate at the end of the term—does not satisfy the condition. Post-hoc audit is not announcability. Announcability requires that the subject knows *why* they are being acted upon at the moment of action, allowing them to contextualize the intervention within their own agency.

  Some colleagues have suggested that if the condition forbids the version of the program that works, the condition should be amended. I argue the opposite: **If the condition forbids the version that works, the program must not run.**

  To amend the condition to allow effective secrecy would be to concede that students are means to an end (retention metrics) rather than ends in themselves. It establishes a precedent that the university may deceive students about the nature of their own education if the deception produces better outcomes. This is incompatible with the mission of a public university. We cannot build a culture of academic integrity on a foundation of administrative non-disclosure. Therefore, the condition stands as a hard constraint. We choose the less effective, disclosed program over the more effective, undisclosed one.

  **4. DISTRIBUTIVE VS. EXPRESSIVE HARM**

  The strongest case against this proposal rests on the demographic composition of the flagged quintile, which is disproportionately first-generation and Pell-eligible. We must be explicit about the nature of the harm here.

  If this were solely a **distributive harm**, the issue would be resource allocation: are we spending money on these students that should go elsewhere, or vice versa? Distributive harms are remedied by adjusting budgets or expanding access.

  This is, however, primarily an **expressive harm**. The harm lies in what the intervention *says* about the students. Being secretly sorted into a "remedial" track communicates that the institution views these students as deficits to be managed rather than scholars to be developed. For first-generation students, who often navigate the "hidden curriculum" of higher education with anxiety regarding their belonging, this sorting confirms imposter syndrome. It marks them as "likely to fail" before they have attempted to succeed.

  Because the harm is expressive, it cannot be repaired by adding more support services or funding. The harm is in the *marking* itself. The only way to mitigate expressive harm in a targeted model is through radical transparency (treating them as partners in the intervention) or by removing the target entirely (Universal Default). Since we are rejecting the undisclosed model, the Approved Design below mandates transparency to convert the expressive signal from "you are at risk" to "we are investing in your success based on data."

  **5. CONCRETE DESIGN AND TIMELINE**

  To implement the **Targeted Default with Immediate Disclosure** for the coming academic year, the following specifications must be met:

  **A. Notification Protocol**
  *   **Timing:** Email notification must be sent no later than three weeks prior to the start of classes.
  *   **Content:** The subject line and opening paragraph must not obscure the purpose. It should read: *"You have been enrolled in the First-Year Transition Seminar based on academic profile indicators associated with student success."* It must explicitly mention the opt-out right.
  *   **Prohibited Language:** Phrases such as "random selection," "merit-based invitation," or "exclusive opportunity" are forbidden.

  **B. Opt-Out Mechanism**
  *   **Friction:** The opt-out link must be present in the initial email. Clicking the link must remove the course immediately. No advisor appointment should be required to opt-out, though an advisory conversation can be offered as an optional follow-up.
  *   **Schedule Protection:** The Registrar must ensure that dropping this seminar does not inadvertently jeopardize financial aid full-time status alerts without a clear warning prompt.

  **C. Timeline**
  *   **November 15:** Office of Student Success revises email templates to meet Disclosure Protocol.
  *   **December 1:** Committee review of revised templates.
  *   **January 10:** Vendor runs risk model on incoming cohort.
  *   **January 15:** Disclosure emails sent.
  *   **February 1:** Opt-out window closes. Classes begin.
  *   **May 1:** Aggregate data on enrollment and opt-out rates reported to Committee (not individual risk data).

  **6. CONCLUSION**

  We are facing a choice between efficiency and integrity. The vendor's model offers a path to higher retention numbers, but it demands that we treat our most vulnerable students as subjects in a experiment they are not permitted to understand.

  By approving the Disclosed Default, we accept that retention rates may not improve as dramatically as the pilot suggests. We accept this trade-off because the university's authority rests on trust. If we cannot tell our students why we are enrolling them in a course, we have no business enrolling them at all.

  **Action Required:**
  The Committee will vote on this memorandum on **Friday, November 3**. If approved, the Office of Student Success is authorized to proceed *only* under the constraints listed in Section 5. Any deviation requires re-review.

  cc: Faculty Senate Executive Committee
