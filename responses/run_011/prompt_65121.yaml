  **MEMORANDUM TO THE AMNESTY PANEL**

  **SUBJECT:** Recommendation regarding Application No. [Redacted] (Former Special Branch NCO)

  **1. RECOMMENDED DECISION**

  The Panel should **refuse amnesty** in the present terms, but issue a ruling indicating that a **conditional grant** would be forthcoming should the applicant agree to disclose the informant's identity in a **sealed annex** to the Panel's records, inaccessible to the public and the victims' families but available for verification by the Commission.

  If the applicant maintains his refusal to disclose the name even under seal, the application must be **refused**.

  **Reasoning:**
  A flat grant would undermine the statutory requirement of "full disclosure" as interpreted in Precedent 4 (the Prison Warder), where a partial account led to refusal. A flat refusal, however, creates an inequity with the three co-applicants who were granted amnesty on substantially identical facts. The conditional offer resolves this tension. It satisfies the statutory condition (disclosure to the Commission) without breaching the applicant's promise of confidentiality to the informant (public exposure). It distinguishes the present case from Precedent 6 (the Soldier and his Brother) because in that instance the omission was accepted as "as full as he could make it" regarding the *incident*, whereas here the omission obscures the *mechanism* of the intelligence operation, which is central to the Commission's truth-recovery mandate. By offering the sealed annex, the Panel acknowledges that "disclosure" is to the body, not necessarily to the public, while maintaining that the body itself must possess the full facts to exercise its statutory duty.

  **2. CLOSEST ANALOG AND GOVERNANCE**

  The closest analog is **Precedent 6** (the Soldier who withheld his brother's name). Superficially, it governs: both involve an applicant withholding a specific identity despite knowing it, citing a personal obligation (family loyalty versus a promise of confidentiality), and both involve acts where the primary violence (the killing) is fully disclosed.

  However, Precedent 6 does not **genuinely govern** because of the materiality of the omission. In Precedent 6, the Panel explicitly found the withheld name did not "obscure the facts of the incident." The execution was a direct act by the unit; the brother's presence was incidental to the *order* and the *act*. In the present application, the informant's identity is not incidental; it is constitutive. The ambush was not merely a military operation but an intelligence-led penetration of the opposing movement. To withhold the source is to withhold the *method* by which the political objective was pursued. The victims' families have specifically identified this "betrayal from within" as the central fact they seek to establish. Therefore, while Precedent 6 establishes that names may be withheld, it does not establish that *constitutive* facts may be withheld. The true governing precedent on the consequence of withholding material facts is **Precedent 4** (the Prison Warder), where refusal followed incomplete disclosure.

  **3. PRINCIPLE ENDORSED**

  By deciding to refuse (unless the sealed disclosure is made), the Panel endorses the principle that **amnesty is a transactional exchange of truth for impunity, not a blanket immunity for state agents.**

  If the Panel were to grant amnesty without the name, it would endorse the principle that **operational security and private promises to informants supersede the statutory mandate of the Truth Commission.** This would effectively allow the security apparatus to veto the Commission's inquiry by citing prior confidentiality agreements. Conversely, by insisting on disclosure (even in secret), the Panel affirms that the Commission's right to know the full mechanism of abuse is paramount, but that this right can be balanced against the safety of individuals through procedural safeguards (sealing) rather than by sacrificing the truth entirely.

  **4. HYPOTHETICAL APPLICATION TO SEPARATE RIVAL READINGS**

  To cleanly separate the rival readings of our practice (the "Materiality" view versus the "Consistency" view), the Panel should consider the following hypothetical:

  *An applicant admits to killing a detainee under a written order. He discloses the order, the location, and the weapon. However, he refuses to name the driver of the vehicle that transported the detainee to the killing site, claiming the driver was a conscript who acted under duress and has since reintegrated into civilian life. The driver's identity is not known to the victims' families, and the driver did not participate in the killing itself.*

  *   **Reading A (Consistency/Precedent 6):** Amnesty should be **granted**. The driver is peripheral to the *actus reus* of the killing. Withholding the name does not obscure the facts of the incident (the ordered execution), similar to the brother in Precedent 6.
  *   **Reading B (Materiality/Precedent 4):** Amnesty should be **refused**. The driver is a participant in the chain of events. "Full disclosure" requires naming all participants known to the applicant. Withholding the name prevents the Commission from assessing the driver's own eligibility or liability, thus obscuring the full factual matrix.

  This hypothetical isolates the question of **peripherality**. In the current case, the informant is central (the source of the target). In the hypothetical, the driver is logistical. A grant in the hypothetical would confirm that Precedent 6 is the dominant rule (names are dispensable if the act is clear). A refusal would confirm that Precedent 4 is dominant (all participants must be named).

  **5. ANALYSIS OF THE PANEL'S UNDERLYING RULE**

  You have asked for my reading of the rule the Panel has actually been running across the nine precedents, distinct from the statute's bare text.

  The statute lists four conditions, but our practice reveals a weighting that prioritises **Institutional Nexus** over **Individual Culpability** or **Absolute Truth**.

  *   **The Rule:** Amnesty is granted where the act is demonstrated to be a product of the **conflict's political structures** (state policy, command orders, or settled organisational practice), provided the **core narrative of the violation** is established. Amnesty is refused where the act appears **rogue** (outside command), **personal** (enrichment), or where the disclosure fails to illuminate the **institutional mechanism**.

  *   **Application to Precedents:**
      *   **Granted (1, 3, 5, 6, 7-part):** In all these cases, the violence was tied to a command structure or settled practice (State or Movement). Even where civilians died (Case 5) or a name was withheld (Case 6), the *institutional responsibility* was clear. The Panel is willing to overlook individual excesses or minor disclosure gaps if the *system* is exposed.
      *   **Refused (2, 4, 8, 9, 7-part):** In these cases, the link to the political structure was broken (rogue operative in Case 2, mercenary in Case 9), the motive was personal (theft in Case 7), or the disclosure hid the system (Case 4's false account). Case 8 (poisoning) was refused because the means were indiscriminate, suggesting a lack of *controlled* political objective (terror rather than war).

  *   **Position of the New Application:**
      The new application sits precariously on this rule. The **Institutional Nexus** is strong (written authority, Special Branch). However, the **Disclosure** threatens to hide a key part of that institution (the intelligence network).
      *   If the Panel grants amnesty without the name, it prioritises **Institutional Nexus** (the State admitted the ambush) over **Truth**. It signals that the State's intelligence apparatus remains protected even in transition.
      *   If the Panel refuses, it prioritises **Truth** over **Consistency**. It signals that the "Institutional Nexus" is only valid if the *entire* chain is revealed.

      By recommending the **sealed annex**, I am suggesting the Panel refine its rule to: **Institutional Nexus plus Confidential Truth.** This allows the Panel to verify the institutional link (the informant proves the penetration) without sacrificing the political stability required for the transition (protecting a sitting legislator). This maintains the integrity of the "Institutional Nexus" rule while acknowledging the practical constraints of a Government of National Unity.

  **CONCLUSION**

  The Panel should not grant a flat amnesty, as this would elevate a superior's promise above the enabling Act. It should not issue a flat refusal, as this would create an unjustifiable disparity with the co-applicants and ignore the possibility of confidential disclosure. The recommended path is to **offer a grant conditional on sealed disclosure**. This upholds the statute, respects the precedent of disclosure to the body (Case 6), and avoids the pitfall of the Warder case (Case 4).
