prompt: |-
  I teach a 25-student seminar on the ethics of everyday conventions — tipping, queueing, jaywalking, that sort of thing — and I've got one 80-minute session to work with. They've all read the standard moves, so don't make them re-derive the usual stuff. Design a role-play I can actually run that gets them to feel how shaky the "when in Rome" intuition is.

  Here's my half-baked setup, improve it however you like: the class is split into long-time residents of an invented town and a smaller group of newcomers who arrive partway through, and the town has maybe eight written local practices. Some of those should be real coordination problems, some coordination-plus-a-distributional-payoff, and some pure arbitrary gesture with no function at all — and crucially nobody playing should be able to tell which is which while the game is on. Then the debrief reveals the functions and has them rank how obligatory each practice felt from the inside, because my hunch is that felt obligation will come out basically uncorrelated with function, and that's the thing I want them to hit themselves.

  Give me the rules, a scoring scheme that doesn't need real money, a materials list, a minute-by-minute timeline, and the debrief questions. Also be honest about what'll go wrong the first time (I'm betting the newcomers just refuse to comply and the whole thing stalls), and about which feature of real conventions a single session cant reproduce, so I know what I have to explain myself afterwards. American English, please.
reasoning: |-
