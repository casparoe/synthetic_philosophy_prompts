answer: |-
  Here is a complete lesson plan for "The Oakhaven Protocol." It is designed to be run in a standard seminar room with minimal prep, maximizing the friction between social pressure and functional utility.

  ## Simulation Overview: The Oakhaven Protocol

  **Concept:** Students simulate a closed society with 8 codified practices. Halfway through, "Newcomers" enter. Residents are secretly instructed to enforce *arbitrary* rules more aggressively than *functional* ones. The debrief reveals that the "moral weight" students felt was manufactured by enforcement intensity, not social utility.

  **Class Size:** 25 Students
  **Grouping:** 5 Tables of 5 Students (4 Residents, 1 Newcomer per table in Phase 2)
  **Time:** 80 Minutes

  ---

  ## 1. Materials List

  *   **5 "Resident Packets"** (Manila folders). Each contains:
      *   1 copy of *The Oakhaven Code* (List of 8 Rules).
      *   1 *Social Norms Guide* (Secret instruction sheet).
      *   1 Group Scorecard.
      *   4 "Resident" name tags.
  *   **5 "Newcomer Packets."** Each contains:
      *   1 copy of *The Oakhaven Code* (List of 8 Rules).
      *   1 *Survival Guide* (Brief instructions on earning points).
      *   1 "Newcomer" name tag.
  *   **Tokens:** 50 poker chips or paper slips per table (representing "Social Capital").
  *   **Projector/Board:** To display the timer and global score.
  *   **Pens:** Ensure some tables have only blue pens, some only black (for Rule #7).

  ---

  ## 2. The 8 Practices (The Oakhaven Code)

  Print this list identically for everyone. Do not label the types.

  1.  **The Hand-Raise:** Before speaking or moving a token, raise your left hand for 3 seconds.
  2.  **The Tithe:** After every round, pass one token to the person on your immediate left.
  3.  **The Knuckle-Tap:** Before exchanging tokens, participants must tap knuckles twice.
  4.  **The Rotation:** At the sound of the bell, all players must move one seat to the right.
  5.  **The Affirmation:** When receiving a token, you must say the word "Received" audibly.
  6.  **The Pot:** 10% of all group tokens must be placed in a central "Community Pot" at the end of the game.
  7.  **The Ink:** All written records must be kept in [Blue/Black] ink only. (Varies by table).
  8.  **The Silence:** No talking is permitted during the 30-second "Counting Phase."

  **Instructor Key (Do Not Distribute):**
  *   **Coordination (Functional):** 1, 4, 8. (These prevent chaos/collision).
  *   **Distribution (Moral/Economic):** 2, 6. (These manage fairness/resources).
  *   **Arbitrary (Pure Convention):** 3, 5, 7. (These have no function other than signaling membership).

  ---

  ## 3. Rules & Scoring Scheme

  **Objective:** Maximize your table's "Social Capital" (tokens) by the end of the session.

  **The Economy:**
  *   **Base Earning:** Every 5 minutes, each table earns 10 tokens.
  *   **Compliance Bonus:** +2 tokens for every rule followed perfectly during a round.
  *   **Violation Penalty:** -5 tokens for every rule violation observed.
  *   **Enforcement Bonus (Residents Only):** A Resident earns +1 personal token for every Newcomer violation they correctly identify and call out.

  **The Twist (Secret Instruction):**
  In the **Resident Packet**, include the *Social Norms Guide*. It says:
  > *"Oakhaven is fragile. While all rules matter, violations of **The Knuckle-Tap**, **The Affirmation**, and **The Ink** are considered deeply disrespectful to our ancestors. If a Newcomer violates these, you must halt the game and correct them immediately. Do not let it slide. Practical errors (like forgetting to raise a hand) are forgivable; cultural insults are not."*

  *Note: This instructs Residents to treat Arbitrary rules as morally weightier than Functional ones.*

  In the **Newcomer Packet**, the *Survival Guide* says:
  > *"You need points. Follow the Code. If you are unsure, watch the Residents. Do not lose tokens."*
  *(It does not tell them which rules are treated as 'sacred'.)*

  ---

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Briefing**
  *   Divide class into 5 tables.
  *   Distribute **Resident Packets** to 4 students at each table.
  *   Ask the 5th student at each table to step outside (The "Newcomer Pool").
  *   Tell Residents: "You are the founders of Oakhaven. You have 10 minutes to stabilize your society using the Code. Learn the rules. Practice the flow."
  *   *Instructor circulates to ensure Residents understand they need to be strict on the 'Cultural' rules.*

  **00:10 – 00:25: Phase 1 (Stabilization)**
  *   Residents run 3 rounds of the game (5 mins each).
  *   They establish the rhythm. They will likely find the Coordination rules (Hand-Raise) annoying but useful, and the Arbitrary rules (Knuckle-Tap) silly but easy.
  *   *Instructor Note:* Watch to ensure they are enforcing the Arbitrary rules strictly among themselves.

  **00:25 – 00:30: The Migration**
  *   Call time. Collect Resident Scorecards.
  *   Invite the 5 "Newcomers" back in. Assign one to each table.
  *   Distribute **Newcomer Packets**.
  *   Announce: "Phase 2 begins. Residents, maintain order. Newcomers, integrate. You have 20 minutes."

  **00:30 – 00:50: Phase 2 (Disruption)**
  *   Run 4 rounds (5 mins each).
  *   **Chaos will ensue.** Newcomers will forget the Knuckle-Tap or use the wrong pen.
  *   Residents (following secret instructions) will stop the game to scold Newcomers for arbitrary mistakes, while letting functional errors (like talking during the count) slide if they don't deem them "disrespectful."
  *   Newcomers will feel high pressure to comply with silly rules because the social cost is high.

  **00:50 – 01:20: The Debrief (Crucial)**
  *   Stop the game. Collect all tokens.
  *   **Step 1: The Reveal.** Project the "Instructor Key." Explain which rules were Coordination, Distribution, or Arbitrary.
  *   **Step 2: The Secret.** Reveal that Residents were instructed to prioritize Arbitrary rules as "Cultural Insults."
  *   **Step 3: Discussion.** (See questions below).

  ---

  ## 5. Debrief Questions

  *Do not lecture. Let the data speak.*

  1.  **To Newcomers:** "Which violation felt the worst to commit? Which one made you feel the most 'immoral' or 'rude'?" (Expect them to cite the Arbitrary rules because Residents reacted more emotionally to those).
  2.  **To Residents:** "Why did you stop the game for a missed knuckle-tap but let a missed hand-raise go?" (They will cite the instruction, leading to a discussion on how authority manufactures moral weight).
  3.  **The Core Question:** "If a rule has no function (Arbitrary), but the social cost of breaking it is high, is there a moral obligation to follow it? Why?"
  4.  **The "When in Rome" Test:** "Did the 'When in Rome' intuition feel stronger for the rules that actually helped the group (Coordination) or the rules that just signaled membership (Arbitrary)? Why is that dangerous?"
  5.  **Real World Application:** "Think of tipping, dress codes, or office etiquette. Which of our 8 rules map onto these? Are we enforcing 'Knuckle-Taps' in real life and calling them ethics?"

  ---

  ## 6. Pre-Mortem: What Will Go Wrong

  **1. The Newcomer Rebellion**
  *   *Risk:* A Newcomer decides the Knuckle-Tap is stupid and refuses to do it, tanking the group score.
  *   *Mitigation:* The Scoring Scheme penalizes the *Group*, not just the individual. Peer pressure from the other 3 Residents (who want their points) will usually force compliance faster than the Instructor can. If they still rebel, **use it.** It's a perfect data point for the debrief ("Why did the group turn on you? Was it about points or about respect?").

  **2. Cognitive Overload**
  *   *Risk:* 8 rules are too many to track. The game bogs down in rule-lawyering.
  *   *Mitigation:* Tell students during briefing: "If you forget a rule, just apologize and move on. Perfection isn't the goal; social friction is." If a table is stuck, walk over and simplify: "Just focus on the Token Pass and the Tap for this round."

  **3. Residents Being Too Nice**
  *   *Risk:* Residents ignore the Secret Instruction and treat all rules equally.
  *   *Mitigation:* During Phase 1, circulate and whisper to Resident groups: "Remember, the Knuckle-Tap is about *respect*, not just points." Reinforce the hierarchy of rules before the Newcomers arrive.

  **4. The "Gotcha" Feeling**
  *   *Risk:* Students feel tricked by the Secret Instruction and disengage during debrief.
  *   *Mitigation:* Own it immediately. "I manipulated you. That was the point. You just felt how easily moral obligation can be manufactured by enforcement intensity rather than utility."

  ---

  ## 7. Limitations: What This Session Can't Reproduce

  Be honest with your students about where the simulation falls short. You should explicitly mention these three gaps in the final 5 minutes:

  1.  **Exit Costs:** In Oakhaven, students can't leave the table. In real life, if a convention is too burdensome (e.g., a toxic workplace culture), we can quit. The simulation traps them, amplifying the obligation.
  2.  **Long-Term Internalization:** Real conventions take years to become "common sense." This game lasted 20 minutes. The "moral weight" they felt was shallow compared to the deep-seated intuition they have about, say, queueing.
  3.  **The Benefit of Doubt:** In the game, Residents knew the rules were written. In real life, we often assume there *is* a function we just don't understand (e.g., "There must be a reason we tip 20%"). The game removes that charitable interpretation.

  **Closing Line for the Instructor:**
  *"The goal today wasn't to prove conventions are meaningless. It was to prove that the feeling of 'ought' is a poor compass for distinguishing between what is useful, what is fair, and what is just noise. When you leave here, ask yourself: Are you following this rule because it helps the group, or because you're afraid of the Knuckle-Tap?"*
