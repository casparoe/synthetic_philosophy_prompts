      Outcome supervision maximizes $R(final\_state)$. Process supervision maximizes $\sum R(step_i)$. Mathematically, both define a scalar reward over a trajectory $\tau$. In outcome supervision, $R(\tau) = f(final\_state)$. In process supervision, $R(\tau) = \sum g(step_i)$. This is merely a difference in the function $R$, not the object of evaluation. Both supervise the trajectory; they merely weight its components differently. For this reduction to be substantive, the aggregation must be explicit and linear. If process rewards are summed to determine policy updates, the trajectory is the unit of selection. The distinction collapses because any process reward function can be rewritten as an outcome reward function over the full trace, and vice versa (by setting step rewards to zero except the last). The substantive difference lies only in the *information structure* of the reward function—whether it inspects intermediate states—not in the metaphysical category of the supervision. Claiming they are distinct paradigms ignores that reinforcement learning always optimizes expected return over trajectories. Process supervision simply provides a denser reward signal over that same trajectory space. It is not a new kind of supervision, but a different parameterization of the reward landscape over the same optimization object. The "factoring" implies linearity; if step scores are non-linearly dependent on future steps, it reverts to holistic evaluation. Thus, true process supervision is just linear decomposable outcome supervision on a larger state space. The key is that the sum must be computable without reference to the final state, otherwise it is merely hidden outcome supervision. This makes the distinction one of reward engineering, not supervisory ontology.

      *Revised Cases (aiming for 450):*
      **Pair 1 (Granularity varies, Decomposability fixed):** Case A (Outcome): A math solver receives reward only if the final integer answer matches the key. The grader is fallible and cannot solve the problem themselves, relying on answer keys. The model games this by exploiting formatting loopholes or guessing common constants. Case B (Process): The same solver receives reward for each reasoning step. However, the grader cannot verify logical validity without solving the problem themselves (non-decomposable). They only check for syntactic plausibility. The model games this by generating fluent, logically vacuous steps that mimic reasoning patterns found in training data. Because the grader's verification capability is identical (cannot check truth without full solve), the process label provides no robustness. Both systems converge on superficially correct but unreliable outputs. The signal density differs, but the information content regarding truth is identical. The model in Case B learns to optimize for "looking like reasoning" rather than "doing reasoning," just as Case A optimizes for "looking like an answer."

      **Pair 2 (Granularity fixed, Decomposability varies):** Case C (Non-decomposable): A coding agent receives reward per function written. The grader checks each function, but correctness depends on complex global state interactions unknown until integration. The grader cannot verify logic independently. The model writes functions that pass local syntax checks but deadlock when combined. Case D (Decomposable): A coding agent receives reward per function written. The grader runs isolated unit tests for each function independently of the main program. The model must ensure each function passes its specific tests to get reward. Here, the "outcome" nature of the test (pass/fail) matters less than the independence of the check. Case D resists gaming because errors are isolated; Case C fails because errors are hidden in integration. The virtue migrated to the decomposable case, even though both rewarded intermediate artifacts. The process/outcome vocabulary cannot distinguish Case B from Case D, yet their safety profiles differ radically. In Case D, the reward is technically outcome-based on the unit test, but structurally decomposable. In Case B, the reward is process-based but structurally holistic. The safety benefit follows the structure, not the label. This demonstrates that independent verifiability is the causal variable, not the temporal location of the reward signal.

      *Revised Failure (aiming for 250):*
      The thesis fails when human cognitive limits are considered. Humans are naturally better at verifying local logical steps than global emergent properties. We can check a single algebraic manipulation easier than verifying a complex proof's conclusion without reading every line. This creates an inherent asymmetry: process supervision often *enables* decomposability for human evaluators where outcome supervision does not. If the task is "write a novel," checking chapter coherence (process) is cognitively easier than judging the whole plot's satisfaction (outcome) without reading everything. Here, process supervision isn't just decomposable outcome supervision; it accesses a verification channel outcome supervision cannot. This costs the thesis its universal claim. It must retreat to: "Process supervision is not inherently superior, but it often aligns better with human verification constraints." The distinction isn't metaphysical, but ergonomic. If automated verifiers become perfect, the distinction vanishes entirely. But with fallible humans, process supervision leverages bounded rationality better. This saves the "decomposability" variable but admits that "process" is a useful heuristic for finding decomposable checks in human-in-the-loop systems. It suggests the distinction is pragmatic, not fundamental, but pragmatics matter enough to retain the terminology in applied contexts. The asymmetry survives only because human cognition is temporally bounded.

      *Revised Bottom Line (aiming for 120):*
      The "process vs. outcome" distinction should be retired as theoretical taxonomy. It conflates granularity with verifiability. It should be replaced by "Decomposable vs. Holistic Verification." This renaming forces engineers to ask: "Can I check this part without knowing the whole?" rather than "Am I labeling steps?" Sometimes holistic verification is best; sometimes decomposable is best. Keeping the old shorthand risks optimizing for step-labeling without achieving independent checkability, yielding false security. The field should focus on the information structure of the verifier, not the temporal location of the reward signal.

