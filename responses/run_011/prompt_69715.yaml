  1. **Starting point**
  You enter this seminar assuming you hold people accountable. You feel resentment when wronged and gratitude when helped. You assume these reactions are appropriate unless something specific interferes. This tree does not ask what you believe about the universe's laws; it asks how you actually respond when concrete harms occur. Your path is determined by your instinctive reactions to specific wrongdoers, not your theoretical commitments. Do not think about metaphysics; think about what you would say to the person standing in front of you.

  2. **The tree**

  **Node 1:** A close friend deliberately lies to you to save themselves embarrassment, causing you significant harm.
  *   **Option A:** You feel resentment and demand an apology. You treat them as a moral equal who owed you better. (Go to Node 2)
  *   **Option B:** You feel detachment. You view them as someone to be managed or treated, not argued with. (Go to Node 3)

  **Node 2:** A diagnosed psychopath commits a cruel act. A normal adult commits the same act, but you learn their upbringing and genetics made the act equally inevitable.
  *   **Option A:** You exempt the psychopath but hold the normal adult responsible. Pathology excuses; causal history does not. (Go to Node 4)
  *   **Option B:** You exempt both. If the act was fully caused by prior events, neither is truly responsible. (Go to Node 5)

  **Node 3:** A violent offender cannot be rehabilitated.
  *   **Option A:** You justify confinement only to prevent harm, not as blame. You would release them if they were safe. (Go to Node 6)
  *   **Option B:** You justify managing everyone's behavior scientifically, not just offenders. All conduct is a matter of safety and tuning. (Go to Node 7)

  **Node 4:** A spy reveals secrets. You learn their desires were implanted by advertisers, though they feel like their own.
  *   **Option A:** You withhold blame. Responsibility requires the mechanism of choice to be truly their own, not just functionally normal. (Leaf: Semi-compatibilism)
  *   **Option B:** You maintain blame. Responsibility requires only membership in the moral community, regardless of desire-origins. (Leaf: Strawsonian compatibilism)

  **Node 5:** Two agents commit identical fraud. Agent A has a frontal lobe tumor. Agent B has a normal brain but an equally complete causal history containing nothing pathological.
  *   **Option A:** You exempt A but hold B responsible. We should revise our practices to ignore global causation but keep local exemptions. (Leaf: Revisionism)
  *   **Option B:** You exempt both. No one is responsible, but we may feel regret about the loss of responsibility. (Leaf: Free will pessimism)

  **Node 6:** You must decide how to treat dangerous individuals who lack responsibility.
  *   **Option A:** You detain them for safety but refuse to blame them. You acknowledge the truth even if it hurts. (Leaf: Optimistic skepticism)
  *   **Option B:** You punish them as if they were responsible. Society needs the illusion of blame to function. (Leaf: Illusionism)

  **Node 7:** You consider your own future mistakes.
  *   **Option A:** You plan to manage yourself to improve outcomes, replacing blame with forward-looking strategies. (Leaf: Abolitionism)
  *   **Option B:** You view yourself as a machine to be tuned. You abandon the participant stance toward yourself entirely. (Leaf: Thoroughgoing objective attitude)

  3. **Leaves and scoring key**

  **Strawsonian compatibilism** (Path 1A-2A-4B): You hold that reactive attitudes are natural and non-optional.
  *   *Awkward commitment:* You must claim resentment is inevitable even when convinced actions are fully caused.

  **Semi-compatibilism** (Path 1A-2A-4A): You require ownership of the decision mechanism.
  *   *Awkward commitment:* You must define "ownership" without invoking the ability to do otherwise.

  **Revisionism** (Path 1A-2B-5A): You believe responsibility is a normative construct, not a metaphysical fact.
  *   *Awkward commitment:* You must justify treating equally determined agents differently based on pathology.

  **Free will pessimism** (Path 1A-2B-5B): You believe responsibility is lost but mourn the loss.
  *   *Awkward commitment:* You must maintain moral practices while believing they are fundamentally unjustified.

  **Optimistic skepticism** (Path 1B-3A-6A): You deny responsibility but keep safety measures.
  *   *Awkward commitment:* You must justify confinement without desert, which looks like punishment.

  **Illusionism** (Path 1B-3A-6B): You deny responsibility but keep blame.
  *   *Awkward commitment:* You must endorse systematic deception about human agency for social good.

  **Abolitionism** (Path 1B-3B-7A): You replace blame with forward-looking management.
  *   *Awkward commitment:* You must claim human relationships can thrive without reactive attitudes.

  **Thoroughgoing objective attitude** (Path 1B-3B-7B): You treat everyone, including yourself, as an object.
  *   *Awkward commitment:* No one can coherently stand here; adopting this stance requires a participant choice to abandon participation.

  4. **Empty rooms**

  The tree permits combinations nobody occupies. First, **Thoroughgoing Objective Illusionism**: treating everyone as objects while maintaining the illusion of blame. This is incoherent; you cannot manage objects while pretending they are subjects. Second, **Strawsonian Abolitionism**: claiming reactive attitudes are natural while advocating their abolition. This is unattractive; it fights human nature without metaphysical cause. Third, **Revisionist Illusionism**: revising responsibility norms while keeping the old illusions. This is merely unexplored; it suggests changing the theory but keeping the practice deceptive. Finally, **Pessimistic Quarantine**: mourning responsibility while detaining only the dangerous. This is unstable; if no one is responsible, why limit containment to the dangerous rather than the inefficient? These rooms remain empty because the psychological costs of holding these pairs together exceed their theoretical benefits.

  5. **Where the tree fails**

  This instrument cannot cleanly separate **Strawsonian compatibilism** from **Semi-compatibilism**. Both occupy the participant stance and reject global exemptions. The distinction relies on subtle metaphysics about "mechanisms" versus "community membership" that concrete cases may not reveal. Similarly, **Optimistic skepticism** and **Abolitionism** blur at the edges. Both reject blame; one keeps quarantine, the other keeps management. In practice, both look like forward-looking containment. The tree forces a binary choice where these positions might overlap or differ only in rhetorical emphasis rather than concrete action. Finally, the **Thoroughgoing objective attitude** leaf is likely a philosophical fiction; the tree maps it, but no human can inhabit it without self-contradiction.
