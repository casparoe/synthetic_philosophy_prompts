  ### The Stubborn Pairs: Which to Surrender?

  You asked if both pairs can be saved, or if one must be surrendered.

  **1. Marrow vs. Plasma (Case 10)**
  *   **Verdict:** **Keep this distinction.**
  *   **Reasoning:** This is the keystone of your **Bodily Integrity** sphere. If you surrender this and declare Marrow sales "Fine" based on biology, you erode the barrier against Kidney Sales (Case 1). If the body is just a collection of renewable and non-renewable parts, the "irreversibility" argument weakens (as you noted in Case 5, mining risk is irreversible). The Marrow verdict protects the *symbolic boundary* of the person.
  *   **Cost:** You must accept that your ethics are tracking *cultural symbolism*, not just *harm*. You are defending a taboo, not just a safety protocol.

  **2. The Two Kidneys (Case 15)**
  *   **Verdict:** **Surrender the Policy Implication.**
  *   **Reasoning:** You cannot build a committee policy on the *motive* of the seller. A regulated scheme (Case 1) cannot distinguish between the "admired father" and the "gambling debtor" without invasive, unworkable scrutiny.
  *   **The Surrender:** You must admit that **Case 1 (The Scheme) takes precedence.** If the market is wrong (Case 1), then the transaction in Case 15 is *also* wrong, even if the father is *morally excused* for doing it. You must separate **Permissibility** (Is this a valid market?) from **Blame** (Is this person a villain?).
  *   **Advice:** Do not call the gambling kidney sale "Impermissible" while calling the daughter's sale "Permissible" *within the same framework*. Call both **Impermissible Markets**, but treat the father's act as a **Necessity Defense**.
  *   **Why:** If you keep the Motive distinction as a rule for markets, you invite the very exploitation you fear in Case 1 (e.g., brokers fabricating "daughter surgery" stories). Your suspicion is correct: surrendering the Marrow case makes the list look like it tracks nothing. Surrendering the Motive distinction makes the list look like it tracks *policy reality*.

  ### Final Recommendation for the Committee

  Your intuition is tracking **The Corruption of Social Meaning**.
  *   **Marrow** is the boundary line where the body stops being a person and starts being a parts bin. Hold that line.
  *   **Motive** is a trap for policy. It belongs in the courtroom (sentencing), not the ethics committee (regulation).

  Tell your committee: *"We ban the market because we cannot distinguish the sacrifice from the exploitation in a systemic rule. We may pity the desperate seller, but we cannot legitimize the buyer."* This preserves the integrity of Case 1, Case 10, and Case 15 without requiring you to legislate morality.
