answer: |-
  Your intuition is not random; it is tracking a coherent, albeit complex, ethical architecture. You are not a libertarian (who would approve most sales), nor a strict egalitarian (who would ban most markets), nor a pure utilitarian (who would focus on outcomes). You are a **pluralist regarding social spheres**. You believe that different goods belong to different domains of human life, and introducing market norms into a domain where they do not belong corrupts the good itself.

  However, your list contains a specific tension between *systemic rules* and *individual virtue*. Below is the principle that best fits your data, the cost of holding it, and the verdict on your stubborn pairs.

  ### The Principle: Protected Spheres and Social Meaning

  **Statement:**
  A market exchange is impermissible if it violates one of three Protected Spheres, unless the exchange serves a higher-order Social Good that reinforces rather than degrades the sphere.

  1.  **Civic Equality:** Goods that constitute equal citizenship or access to rights cannot be allocated by wealth. (Motivated by Cases 8, 12, 13).
  2.  **Bodily Integrity:** Goods that treat the human body as irreversible inventory or "life essence" cannot be sold, unless the procedure is routine, repeatable, and socially normalized as labor. (Motivated by Cases 1, 3, 10).
  3.  **Crisis Necessity:** Goods essential for survival during a crisis cannot be priced by scarcity, as this exploits unavoidable vulnerability. (Motivated by Cases 9, 11).

  **The Exception (Social Good):**
  An otherwise forbidden exchange is permissible if the *meaning* of the transaction is not commodification but **sacrifice for a dependent** or **contribution to public memory**, provided the recipient is not a private speculator. (Motivated by Cases 2, 6, 14, 15).

  ---

  ### Case Mapping: What Work Each Clause Does

  *   **Civic Equality:** Explains why the Passport Queue (8) is wrong but the Concert Queue is fine (public right vs. private luxury). Explains why Votes (13) and Witness Testimony (12) are immune to price; they are duties of citizenship, not services.
  *   **Bodily Integrity:** Explains why Sterilization (3) and Live Kidney Sale (1) are wrong (irreversible, essential integrity) while Reversible Contraception (4) and Plasma (10) are fine (routine, repeatable). It explains why Mining (5) is fine; society categorizes labor risk differently than bodily part sales.
  *   **Crisis Necessity:** Explains the Hurricane Water/Hotel (9) and Drug Pricing (11) verdicts. The market is suspended when need is inelastic and survival is at stake.
  *   **Social Good Exception:** This is the critical clause that saves your "fine" verdicts.
