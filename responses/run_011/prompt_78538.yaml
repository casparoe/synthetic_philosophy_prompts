  2.  **Case 10 (Marrow vs. Plasma):**
      *   *The Conflict:* You admit the biology is nearly identical.
      *   *The Friction:* The principle relies on **Social Meaning**, not biology. Marrow is symbolically "life essence"; plasma is "fluid." This is scientifically arbitrary but ethically robust in your framework. The principle cannot defend this biologically; it can only defend it culturally.

