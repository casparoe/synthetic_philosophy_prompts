answer: |-
  # Specification for an Adequate Account of Self-Locating Reasoning

  ## 1. The Desiderata

  To be deemed adequate for high-stakes existential risk estimation, an account of self-locating evidence must satisfy the following seven constraints.

  **1. Explanatory Adequacy regarding Birth Rank**
  The account must specify whether, and by what magnitude, an agent's approximate birth rank among all observers licenses a shift in the posterior probability over the total number of observers. It must not merely output a number derived from an arbitrary prior; it must isolate the evidential weight carried by the indexical fact ("I am observer *n*") distinct from the non-indexical prior. It must explain why the shift is dramatic under some priors and negligible under others, identifying the precise mechanism (likelihood update vs. prior adjustment) responsible for the variance.

  **2. Principled Reference Class Selection**
  The account must provide a rule for determining the reference class—the set of observers among whom the agent considers herself a random sample—that is independent of the desired conclusion. The rule must not rely on vague intuitions of "similarity." It must demonstrate why a specific class (e.g., "humans," "conscious beings," "observers aware of this argument") is mandated by the theory rather than selected opportunistically to nullify or amplify the inference.

  **3. Bayesian Conservativeness**
  The account must reduce to standard conditionalisation in cases lacking indexical content. If the agent possesses no self-locating information, the machinery must remain inert. Furthermore, if the agent knows the total number of observers with certainty, the self-locating machinery must not manufacture residual doubt or shift credences. The anthropic update must be strictly additive to, not subtractive from, established non-indexical knowledge.

  **4. Causal Consistency (Predictive Feedback)**
  The account must handle cases where the agent's estimate causally influences the total number of observers. If the estimation procedure is part of a loop where the output determines the sample size (e.g., a policy triggered by the estimate alters survival probabilities), the account must specify whether the sampling assumption holds. It must not prescribe a credence that, if adopted, renders the credence false via the causal mechanism. The likelihood function must remain well-defined even when the hypothesis space is responsive to the inference.

  **5. Correction for Self-Selection Bias**
  The account must address the fact that the agent is not a random sample of all observers, but a random sample of observers *capable of and interested in* running the inference. If such observers cluster near the beginning of the sequence (due to the intellectual prerequisites or the temporal window required to develop the theory), the account must specify whether this cancels the birth-rank inference outright or merely rescales it. It must distinguish between selection effects that block evidence and those that merely condition it.

  **6. Finitude Independence**
  The account must state explicitly how it behaves when the total number of observers is infinite or ill-defined. It must not rely on a hidden assumption of finitude to normalise probabilities. If the account lacks purchase in infinite cosmologies, it must declare itself inapplicable rather than producing a finite result by truncating the hypothesis space without justification.

  **7. Separation of Presumption and Typicality**
  The account must distinguish between the prior probability of a hypothesis and the number of observers posited by that hypothesis. Inflating the prior weight of a hypothesis simply because it contains more observers must not be permitted to purchase arbitrarily strong evidence for that hypothesis without independent justification. The likelihood of the evidence ("I am observer *n*") must be calculable independently of the prior weight assigned to the existence of the observer.

  ***

  ## 2. The Sorting

  Not all requirements carry equal weight. Some are conditions of rational coherence; others are substantive commitments that divide competing theories.

  **Non-Negotiable Requirements**
  Requirements **3 (Conservativeness)** and **7 (Presumption vs. Typicality)** are non-negotiable. Failure here constitutes incoherence.
  *   **3** is a baseline constraint of Bayesian rationality. An account that alters credences in the absence of new evidence, or generates doubt where there is certainty, violates the probability axioms.
  *   **7** is a constraint against begging the question. If an account allows the sheer number of observers in a hypothesis to drive up the prior probability of that hypothesis without limit, it allows existence to be proved by enumeration. This conflates the *truth* of a world with the *population* of a world. Any account that collapses this distinction is vulnerable to the "Presumptuous Philosopher" objection and cannot be trusted for risk estimation.

  **Camp Signatures**
  Requirements **1 (Birth Rank)** and **2 (Reference Class)** are the signature commitments of competing camps.
  *   How one satisfies **1** distinguishes the Self-Sampling Assumption (SSA) from the Self-Indication Assumption (SIA). SSA accepts a strong shift; SIA neutralises it.
  *   How one satisfies **2** is often where theories break. SSA proponents often accept a narrow class to preserve the Doomsday shift; SIA proponents often widen the class to dilute it. Neither has a universally accepted principled rule, making this a zone of contestation rather than a neutral standard.

  **Incompatibilities and the No-Go Result**
  There is a minimal unsatisfiable subset involving **1 (Birth Rank)**, **2 (Reference Class)**, and **7 (Presumption)**.
  *   If you enforce **7** (priors independent of observer count) and demand a determinate answer for **1** (the shift must be calculable), you are forced into a Doomsday-style conclusion *unless* you can satisfy **2** with a reference class so broad it dilutes the rank evidence to negligible levels.
  *   However, if **2** cannot be satisfied principledly (as most agree it cannot be), then the magnitude of the shift in **1** becomes arbitrary.
  *   **Finding:** You cannot jointly satisfy **1**, **2**, and **7** without residual arbitrariness. One must be abandoned or relaxed.
  *   **Recommendation:** It is most defensible to abandon the demand for a precise magnitude in **1**. Given the failure of **2** (no principled class exists), the evidential weight of birth rank is indeterminate. The account should therefore output a range or a qualitative warning rather than a point estimate.

  **The Killer Requirement**
  The single requirement that eliminates the greatest number of otherwise respectable accounts is **7 (Separation of Presumption and Typicality)**.
  *   **Reasoning:** This requirement explicitly rules out the core mechanism of the Self-Indication Assumption (SIA). SIA functions by assigning prior probability proportional to the number of observers in a world. While this neutralises the Doomsday Argument, it does so by violating **7**: it allows the hypothesis "there are many observers" to be more probable *simply because* there are many observers. For a risk estimator who needs to avoid artefacts of modelling choices, this is fatal. It allows the model to "buy" safety by positing vast numbers of unobserved aliens or simulations. SSA satisfies **7** but fails **2**. SIA satisfies **2** (broadly) but fails **7**. Since **7** is non-negotiable for coherence, SIA-style accounts are eliminated.

  ***

  ## 3. Evaluation of Broad Families

  **The Self-Sampling Assumption (SSA)**
  SSA treats the agent as a random sample from a fixed reference class. It satisfies **7** (Presumption) and **3** (Conservativeness) well, as it keeps priors distinct from observer counts. However, it fails **2** (Reference Class) catastrophically; there is no consensus on how to define the class without gerrymandering, making the output of **1** (Birth Rank shift) highly sensitive to modelling choices. It also struggles with **4** (Feedback), as it assumes a fixed total *N* during sampling. For existential risk, SSA is usable only if one accepts that the Reference Class choice is a policy variable rather than a factual discovery.

  **The Self-Indication Assumption (SIA)**
  SIA treats the agent's existence as evidence favouring worlds with more observers. It handles **2** (Reference Class) more robustly by diluting the significance of birth rank through larger totals, and it mitigates the Doomsday shift in **1**. However, it fails **7** (Presumption) by definition, as it inflates priors based on observer count. This makes it unsuitable for risk estimation where one must not assume safety merely because a safe world contains more observers. It also risks violating **3** (Conservativeness) in cases where existence itself is treated as evidence for expansive cosmologies. It is eliminated by the non-negotiable constraint on presumption.
