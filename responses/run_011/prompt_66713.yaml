  Here is a principle constructed to capture the bulk of your intuitions, followed by the hard trade-off it requires.

  ### The Principle: Evidential Specificity and Decisional Pragmatism (ESDP)

  This principle separates the norms for *belief representation* from the norms for *updating* and *action*. It is stated in three clauses:

  **Clause 1 (The Fidelity Constraint):** *The imprecision of your credal state (your "representor") must strictly track the indeterminacy of your evidence.*
  *   **Tied to Case 1:** When evidence is silent (untested coin), the representor must be wide (e.g., [0, 1]). A sharp 0.5 violates Fidelity because the evidence does not support specificity.
  *   **Tied to Case 5:** When evidence is noisy (unreliable poll), the representor must widen to reflect that noise. This validates your intuition that widening is correct here.
  *   **Tied to Case 6 (Part A):** For the "heap," the mushiness is semantic, not evidential. ESDP allows imprecise credence here because the *proposition itself* lacks a truth-conditional sharp boundary.
  *   **Tied to Case 6 (Part B):** For the "keys," the evidence is *available but uncollected*. ESDP includes a sub-clause of **Epistemic Duty**: if sharp evidence is cheaply available, maintaining a wide representor is criticizable. This distinguishes the keys (lazy) from the coin (impossible).

  **Clause 2 (The Reliability Filter):** *Upon learning new information $E$, your representor updates by conditionalization, but imprecision may only increase if $E$ undermines the reliability of the likelihood function, not merely by conditioning a wide prior.*
  *   **Tied to Case 2:** Evidence (3 heads) shrinks the set (standard conditionalization).
  *   **Tied to Case 5:** The poll method is suspect, so the *likelihood* $P(\text{Report} | \text{Truth})$ is imprecise. This licenses widening.
  *   **Tied to Case 4:** In standard dilation, the likelihood is precise, but the *prior* is wide. Conditionalization on irrelevant info widens the posterior purely due to the prior's spread. ESDP flags this as a violation: you shouldn't lose precision just because your prior was honest about ignorance.

  **Clause 3 (Pragmatic Sharpness):** *While belief states may be imprecise, rational action requires selecting a sharp proxy from the representor to minimize expected loss.*
  *   **Tied to Case 7:** The doctor's *belief* is wide (Fidelity), but her *decision* must be sharp (Pragmatic Sharpness). She is not irrational for acting on a number, provided that number is admissible within her representor.
  *   **Tied to Case 3:** This explains why paying to dodge ambiguity is "dumb." Your *belief* can distinguish Red from Black (Red is sharp 1/3, Black is wide [0, 2/3]). However, your *preferences* should not violate dominance. If you pay to switch from Black to Red, you are paying for a belief-distinction to manifest as a preference-distinction in a way that creates a money pump. ESDP allows the belief mush but forbids the preference mush.

  ---

  ### Prediction for the New Case
  **Case:** You learn the result of a medical test (Positive/Negative), but the sensitivity and specificity are only known to lie within a range (e.g., Sensitivity $\in [0.8, 0.9]$).

  **ESDP Prediction:**
  1.  **Belief State:** Your posterior credence in having the disease should be **imprecise (wide)**.
      *   *Reasoning:* This falls under **Clause 1 (Fidelity)** and **Clause 2 (Reliability Filter)**. Unlike standard dilation (Case 4), the uncertainty here is in the *likelihood function* (the test's reliability), not just the prior. Just like the poll (Case 5), the "instrument" is fuzzy, so the output must be fuzzy.
  2.  **Action:** You must still decide whether to treat.
      *   *Reasoning:* Per **Clause 3**, you cannot "act imprecisely." You must choose a treatment threshold. If the entire range of your posterior exceeds the treatment threshold, you operate. If the entire range is below, you don't. If the range straddles the threshold, ESDP says you are permitted to pick *any* value within your representor to make the decision, but you should acknowledge the risk.

