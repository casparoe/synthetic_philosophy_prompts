answer: |-
  **Recommendation:** Vote **No**. Do not treat the new installation as a continuous extension of the 1979 accession. Catalog the new installation as a distinct iteration or version (e.g., *Wall Drawing [Title], Version 2*), linked to the original by provenance but distinct in identity.

  **Reasoning:**
  Your committee's record is not random, but it is not governed by a single metaphysical rule (like "original matter" or "artist intent"). Instead, you operate on a **Standard of Integrity of Definition**. You allow replacement of *components* required to maintain the defined work (Cases 1, 4, 6), but you do not allow the *definition itself* to change without creating a new identity (Cases 3, 5, 7).

  In the wall drawing case, the 1979 Certificate *is* the definition of the work. The wall is the substrate, the paint is the medium, but the Certificate is the score. The Foundation is not asking to maintain the score (like replacing neon tubes); they are asking to rewrite the score (new proportions, new pigment). This crosses the line from maintenance to modification.

  ### The Closest Analogy
  **Case 5 (The Bricks)** is doing the most work here.
  In Case 5, you had the diagram (the instructions) and the Artist's authorization, yet you ruled it a new work because the physical components (the bricks) were replaced. In the Wall Drawing case, you have the Artist's authorization (via the Foundation), but the "components" being replaced are the *instructions themselves*.
  *   **Case 5 Logic:** Original Instructions + New Materials = New Work.
  *   **Wall Drawing Logic:** Original Materials (Wall/Paint) + New Instructions = New Work.
  It is the structural inverse, but the principle is identical: if the defining parameters of the object are swapped out, the identity resets, regardless of authorization.

  ### The Two Camps
  *   **The "Yes" Camp (Continuous Accession):** They are leaning on **Case 1 (Motor)** and **Case 6 (Neon)**. Their argument is that the work is a functional system authorized by the rights holder. If the studio says the new motor/tubes/specs are valid, the work continues. They view the Certificate as a living license, not a static artifact.
  *   **The "No" Camp (New Iteration):** They are leaning on **Case 5 (Bricks)** and **Case 7 (Limestone)**. Their argument is that there is a "truth" to the object's state at accession. Case 7 is particularly damaging to the "Yes" camp: even when the *stone* was original (Case 7), the alteration of the surface by a non-artist hand killed the attribution. Here, the "surface" (the specs) is being altered by a non-artist hand (the Foundation, posthumously).

  ### Candidate Standards Compatible with Your Record
  Here are the three standards your precedents actually support. Note that all three lead to the same recommendation for the Wall Drawing, which tells us where your fault line actually lies.

  **1. The "Maintenance vs. Modification" Standard**
  *   **Rule:** You may replace parts to *sustain* the original specification (Cases 1, 6), but you may not replace parts to *alter* the specification (Cases 5, 7).
  *   **Implication for Wall Drawing:** Replacing failing neon tubes is maintenance (Case 6). Changing pigment and proportions is modification. **Vote: No.**

  **2. The "Material/Definitional Anchor" Standard**
  *   **Rule:** There must be one physical or documentary anchor that remains constant from accession. In Case 4, it was the bricks. In Case 2, it was the bust. In Case 5, the bricks were lost, so the work died. In the Wall Drawing, the 1979 Certificate is the anchor.
  *   **Implication for Wall Drawing:** If the 1979 Certificate is superseded, the anchor is lost. **Vote: No.**

  **3. The "Execution Authority" Standard**
  *   **Rule:** The work remains the same only if the execution is performed under the authority valid *at the time of the work's conception*. Later authorizations apply to new works (Case 3, Case 5).
  *   **Implication for Wall Drawing:** The 1979 authority allows drafters to execute *that* drawing. The new authority authorizes a *different* drawing. **Vote: No.**

  ### The Fault Line (Hypothetical Split)
  Since all three standards land on "No," your committee is currently more consistent than you think. However, these standards would split on the following hypothetical case:

  **The "Correction" Scenario:**
  Imagine the Foundation produces a letter from the Artist dated 1980 (one year after your 1979 cert) stating: *"I made a mistake on the 1979 certificate. The pigment listed was unavailable to me at the time; I always intended the pigment specified in the new certificate. Please treat the new pigment as the original intent."*
  *   **Standard 1 (Maintenance)** would likely say **Yes** (Correcting an error is maintenance of intent).
  *   **Standard 2 (Anchor)** would say **No** (The 1979 document is the historical artifact regardless of intent).
  *   **Standard 3 (Authority)** would say **Yes** (The Artist's standing authority clarifies the original conception).

  *This is where your committee would fracture.*

  ### Where My Reconstruction is Shakiest
  **Case 6 (The Neon).**
  This is the outlier that threatens to blow up the whole system. In Case 6, *none* of the original glass remained, yet it was the "Same Work." In Case 5, *none* of the original bricks remained, and it was a "New Work."
  To make your record consistent, I have interpreted Case 6 as **Like-for-Like Maintenance** and Case 5 as **Total Replacement.**
  *   **The Softening:** I am assuming the Neon tubes were replaced with identical specs to maintain the *original visual output*. If the Neon tubes were upgraded to a brighter, more efficient, or slightly different color temperature over those 20 years, then Case 6 contradicts Case 5 entirely, and your record is truly inconsistent. If Case 6 allowed spec changes, the "Yes" camp wins on the Wall Drawing.

  ### What Would Flip My Recommendation
  Before Thursday, pull these three folders. Any one of them could invalidate the "No" vote.

  1.  **The 1979 Certificate Text:** Does it contain a clause regarding **amendments or updates**? Some conceptual certificates explicitly state, *"The Artist or Estate reserves the right to update materials as technology evolves."* If that clause exists, the 1979 Certificate *already authorized* the change, making the new certificate an execution of the old one, not a supersession.
  2.  **The Case 6 (Neon) Conservation Logs:** Check the replacement records. Did the studio ever substitute a different type of neon gas or glass diameter? If they upgraded the tech while claiming it was the "Same Work," then your precedent supports the Foundation's request to update the Wall Drawing specs.
  3.  **The Case 5 (Bricks) Artist Email:** You noted the artist told you to "go ahead." Did he explicitly say, *"This is the same work,"* or did he say, *"You may rebuild it"*? If the Artist *claimed* it was the same work and you overruled him in Case 5, you have established that **Museum Authority > Artist Authority** regarding identity. If you overruled him then, you must overrule the Foundation now. If you accepted his assessment in Case 5 but logged it as new for insurance reasons, you have a paperwork inconsistency that weakens the "No" vote.

  ### Future Implications
  You mentioned holding two other certificate works and editions.
  *   **If you vote Yes:** You establish that the *current rights holder's definition* overrides the *historical accession definition*. This simplifies relations with living estates but risks "version creep," where a work evolves so far from its original market value and historical context that the accession number becomes meaningless. Future curators won't know if they are displaying the 1979 work or the 2024 work.
  *   **If you vote No:** You protect the historical integrity of the collection. However, you risk friction with estates who view their copyright as the power to define the work. You must be prepared to apply this strictly: if you ever acquire a time-based media work where the software *must* be updated to run, you will have to rule whether that is "Neon Case" (maintenance) or "Wall Drawing Case" (modification).

  **Summary:** Your record is surprisingly robust, provided you distinguish between *sustaining* a definition and *changing* it. Case 5 is your shield. Use it.
