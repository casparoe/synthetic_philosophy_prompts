  You're an expert on the ethics of public commemoration and you're good at reverse-engineering how a committee actually reasons from its own past votes. I sit on the naming review panel for a mid-sized US city and I want to predict where we land on the case coming up next month. Think carefully — brainstorm the candidate decision rules first, before committing to a verdict.

  Our remit is street names, schools, and plaques on city property. Track record so far, with the vote margins:

  - Kept the name of a 19th-century mill owner whose child labor practices were legal and completely standard for the region, but who paid for the city's first free public library. 5-0.
  - Renamed a park honoring a doctor who was personally beloved and treated poor patients for nothing, but who published a sterilization pamphlet in 1938 that nothing locally ever came of. 4-1.
  - Kept, with an added plaque, a school named for a councilman convicted of taking developer bribes in the 70s, who had also built the first public health clinics in the city's Black neighborhoods. 3-2.
  - Renamed a plaza honoring a police chief famous for driving down the crime rate, after records showed the drop rested on fabricated evidence and coerced confessions; we also struck the inscription citing his statistics. 5-0.
  - Renamed a street honoring a Confederate army surgeon who owned no one, treated Black patients, and did nothing much else — the name had been given in 1911 by a heritage society that was renaming streets all over the South that decade. 4-1.

  New case: a middle school named in 1957 for the city's first woman superintendent. She fought the federal desegregation order when it finally reached us, and while litigating it she closed two schools in Black neighborhoods and reassigned their teachers, which cost something like fourty Black educators their jobs. Separately and earlier, she'd integrated the district payroll. She died in 1998. The alumni petition is split roughly down the middle, and the two historians we consulted disagree too — one says her resistance was typical of her cohort, the other says the school closures were deliberate retaliation.

  Which way should we go if we want to be consistent with ourselves? I can see at least three rules that fit most of those five precedents and diverge here. Give me your best guess at our verdict (rename / keep / keep with plaque), which precedent is the closest analog and why, what principle we'd be committing ourselves to under each option, and one further hypothetical case that would separate the two leading rules.

  Answer with a JSON object only, nothing outside it, using exactly these fields: "candidate_rules" — array of {"name", "statement", "precedents_it_fits", "precedents_it_strains", "verdict_on_new_case", "why"}; "best_guess" — {"verdict", "closest_precedent", "reasoning"}; "principles_committed_to" — {"if_rename", "if_keep", "if_keep_with_plaque"}; "discriminating_case" — {"description", "what_each_leading_rule_predicts"}; and "confidence" — {"score" (0 to 1), "what_would_move_it"}.
