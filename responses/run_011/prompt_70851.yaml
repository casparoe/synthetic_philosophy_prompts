  ### Plan

  **Stanza Map & Line Function**
  The poem follows the pantoum structure strictly, with the exception of the final stanza's closure to accommodate the philosophical loop. Lines marked **(What)** are bare reports of regularity; lines marked **(Why)** assert necessity, cause, or grounding. Note how every **(Why)** line becomes a **(What)** line in the subsequent stanza where it is recycled, enacting the demotion of explanation into mere description.

  *   **Stanza 1:** L1(Why), L2(What), L3(Why), L4(What)
  *   **Stanza 2:** L1(What, from S1L2), L2(Why), L3(What, from S1L4), L4(What)
  *   **Stanza 3:** L1(What, from S2L2), L2(Why), L3(What, from S2L4), L4(What)
  *   **Stanza 4:** L1(What, from S3L2), L2(Why), L3(What, from S3L4), L4(What)
  *   **Stanza 5:** L1(What, from S4L2), L2(Why), L3(What, from S4L4), L4(What, from S1L1)

  **The Closing Loop**
  The final line (S5L4) is identical to the opening line (S1L1). In the first stanza, this line functions as an explanation (*Why* does the needle move? Because something heavy draws it). In the final stanza, having been circulated through the mosaic of facts, it returns as a mere report (*What* happens? Something heavy draws it). The ambiguity lies in whether this return signifies completion (the pattern is self-sufficient; the summary *is* the truth) or emptiness (we have traversed the entire system and found no ground outside the circle). The penultimate line ("There is no engine hidden in the wall") sharpens this: is that a comforting fact or a damning omission?

