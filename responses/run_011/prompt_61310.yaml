answer: |-
  ### Desiderata for an Account of Causation

  **Purpose:** To specify constraints for a theory of causation that serves both token-level responsibility ascriptions and type-level policy modeling, satisfying both philosophical rigor and statistical operationalizability.

  #### I. Phenomenal Coverage
  *These requirements ensure the account captures the intuitive and formal range of causal scenarios.*

  **1. The Preemption and Overdetermination Constraint**
  *   **Requirement:** The account must distinguish between early preemption (backup cause prevented), late preemption (backup cause preempted after effect begins), and symmetric overdetermination (two sufficient causes fire simultaneously), assigning causation to the preempting cause in the first two and to both in the third.
  *   **Motivation:** Token-level responsibility depends on distinguishing the actual bringer-of-effect from the mere backup. A theory that treats preemption as overdetermination fails moral ascription; a theory that treats overdetermination as single causation fails descriptive accuracy.
  *   **Status:** **Non-negotiable.** (Failure here renders the account useless for the token-level purpose).

  **2. The Omission and Prevention Constraint**
  *   **Requirement:** The account must provide a principled basis for distinguishing causation by omission (failure to act) from mere non-events, and distinguish prevention (stopping a cause) from double prevention (stopping a blocker).
  *   **Motivation:** Legal and policy contexts frequently turn on liability for failures to act (e.g., negligence). However, without constraints, every non-event becomes a cause of every subsequent event.
  *   **Status:** **Non-negotiable.**

  **3. The Probabilistic and Threshold Constraint**
  *   **Requirement:** The account must handle cases where the cause raises the probability of the effect without guaranteeing it, and cases where the effect only manifests after a threshold of causal input is crossed.
  *   **Motivation:** Public health and social policy deal almost exclusively in risk factors and aggregate thresholds, not deterministic guarantees.
  *   **Status:** **Non-negotiable.**

  #### II. Conceptual Distinctions
  *These requirements ensure the account does not conflate distinct metaphysical or methodological categories.*

  **4. The Type/Token Distinction**
  *   **Requirement:** The account must explicitly distinguish between general causal relations (types/variables) and singular causal occurrences (tokens/events), specifying how they relate without reducing one to the other.
  *   **Motivation:** Policy requires type-level claims ("Smoking causes cancer"); responsibility requires token-level claims ("This cigarette caused this cancer"). Conflating them leads to the ecological fallacy or inability to generalize.
  *   **Status:** **Non-negotiable.**

  **5. The Cause/Background Distinction**
  *   **Requirement:** The account must distinguish between the specific cause of interest and the standing background conditions necessary for the effect, without relying solely on pragmatic context.
  *   **Motivation:** In modeling, we must decide which variables to manipulate and which to hold fixed. In law, we distinguish the criminal act from the existence of oxygen.
  *   **Status:** **Non-negotiable.**

  **6. The Causation/Constitution Distinction**
  *   **Requirement:** The account must distinguish causal relations from constitutive relations (where the cause is part of the essence or definition of the effect).
  *   **Motivation:** In social policy, "racial category" may constitute a social outcome rather than causing it in a mechanistic sense. Conflating these licenses invalid interventions.
  *   **Status:** **Non-negotiable.** (Critical for the social policy use-case).

  **7. The Difference-Making/Productive Distinction**
  *   **Requirement:** The account must specify whether it tracks counterfactual dependence (difference-making) or physical connection (production), or provide a unified mechanism for both.
  *   **Motivation:** Omissions are difference-makers but not producers. Processes are producers but not always difference-makers (in overdetermination).
  *   **Status:** **Standing Preference.** (Philosophers often demand production; Statisticians often accept difference-making).

  #### III. Formal and Empirical Constraints
  *These requirements ensure compatibility with established scientific and mathematical results.*

  **8. The Probabilistic Integrity Constraint**
  *   **Requirement:** The account cannot contradict the fact that observational data fixes causal structure only up to a Markov equivalence class, nor can it ignore the reversal of association under conditioning (Simpson's Paradox).
  *   **Motivation:** Statistical faculty will reject any account that claims observational data alone identifies directionality without assumptions.
  *   **Status:** **Non-negotiable.**

  **9. The Relativistic Constraint**
  *   **Requirement:** The account cannot license causal influence between spacelike-separated events.
  *   **Motivation:** Compatibility with physical law is a baseline constraint for any metaphysical account claiming to describe the world.
  *   **Status:** **Non-negotiable.**

  **10. The Intervention/Generality Constraint**
  *   **Requirement:** The account must acknowledge that exceptionless generality is neither necessary nor sufficient for a claim to support intervention.
  *   **Motivation:** Laws of nature may be exceptionless but not manipulable; statistical regularities may be manipulable but not exceptionless.
  *   **Status:** **Non-negotiable.**

  #### IV. Constructed Case Constraints
  *These requirements address the specific tension points identified in your prospectus.*

  **11. The Level-Relativity Constraint (The Drug Case)**
  *   **Requirement:** The account must specify criteria for the admissibility of variable sets *independently* of the causal verdicts they produce. It must explain how a causal claim at a coarse level (Drug → Outcome) relates to a claim at a fine level (Drug → BP → Outcome), specifically when the coarse claim is invariant but the fine model reveals opposing pathways.
  *   **Motivation:** Policy needs the coarse claim; mechanism needs the fine one. If the theory cannot adjudicate which description is admissible without circular reference to the desired verdict, it is ad hoc.
  *   **Status:** **Non-negotiable.**

  **12. The Non-Intervenable Token Constraint (The Early Universe Case)**
  *   **Requirement:** The account must allow for token-level causal ascriptions in contexts where intervention on the putative cause is impossible in principle (e.g., cosmological initial conditions), without collapsing into mere nomic subsumption.
  *   **Motivation:** We make causal claims about history and cosmology where manipulation is impossible. An account that defines causation *strictly* by manipulability renders these claims meaningless.
  *   **Status:** **Non-negotiable.** (This is the primary friction point with strict operationalism).

  **13. The Independence of Similarity Constraint (The Omission Case)**
  *   **Requirement:** If the account uses a similarity metric between possible worlds (or states) to determine causal verdicts, the metric must be calibrated independently of the causal intuitions it is meant to generate.
  *   **Motivation:** To avoid circularity where "the nearest world" is defined simply as "the world where the intuition holds."
  *   **Status:** **Non-negotiable.**

  **14. The Error-Tolerance Constraint**
  *   **Requirement:** The account must be licensed to declare firm intuitions about specific cases as erroneous if they conflict with the theoretical machinery, provided the machinery satisfies the other desiderata.
  *   **Motivation:** An account that saves every intuition explains nothing.
  *   **Status:** **Standing Preference.** (Philosophers often accept this; Policy makers often resist it).

  ---

  ### Evaluation of Candidate Requirements

  **1. "The account be extensional, so that two variables picking out the same state of affairs yield the same causal verdicts."**
  *   **Verdict:** **Rejected.**
  *   **Reasoning:** Causal contexts are hyperintensional. Substituting co-extensive variables can change the causal truth value depending on the model's granularity (see the Drug Case). "The morning star caused the heat" and "The evening star caused the heat" may differ in causal validity if the model distinguishes the descriptions. Extensionality collapses the Level-Relativity Constraint (Req 11).

  **2. "Every true causal claim be reducible to a claim about what would have happened had the cause been absent, holding the laws fixed."**
  *   **Verdict:** **Camp Preference (Counterfactualists).**
  *   **Reasoning:** This begs the question against Process and Primitivist accounts. Furthermore, it struggles with Overdetermination (the effect would have happened anyway) and Early Universe cases (laws + absence of cause might not yield a coherent possible world). It is too restrictive for a comparative prospectus.

  **3. "The account owe a verdict of presence or absence in every case, with no residue where it declines to answer."**
  *   **Verdict:** **Restated.**
  *   **Reasoning:** As stated, this forces binary precision on vague concepts.
  *   **Restatement:** "The account must provide a decision procedure for policy contexts, even if it acknowledges metaphysical indeterminacy in token cases." This satisfies the Policy use-case without forcing the Philosophy use-case into false precision.

  ---

  ### Incompatibilities and Impossibility Results

  You must be aware that the following subsets of requirements cannot be jointly satisfied without significant theoretical cost:

  **1. The Operationalism vs. Non-Intervenable Causation Conflict**
  *   **Conflict:** The Statistics faculty demand operationalizability (often defined via intervention). Requirement 12 (Non-Intervenable Token Constraint) demands causation where intervention is impossible.
  *   **Result:** You cannot satisfy strict operationalism and Requirement 12 simultaneously. You must either broaden "intervention" to include hypothetical/unrealizable interventions (risking idleness for the Stats faculty) or accept that some causal claims are non-operational (risking rejection by the Stats faculty).
  *   **Resolution:** The prospectus must argue for a *modal* account of intervention (what *could* be intervened on in a structurally similar system) rather than a *practical* one.

  **2. The Granularity Conflict (Token vs. Type)**
  *   **Conflict:** Requirement 1 (Preemption) pushes for fine-grained event individuation (to distinguish the actual cause from the backup). Requirement 11 (Level-Relativity) and the Policy purpose push for coarse-grained variables (aggregates).
  *   **Result:** A single ontology of "events" cannot easily be both fine enough for preemption and coarse enough for social policy.
  *   **Resolution:** The account must be *pluralist* or *relativized* to variable sets. It cannot be a monolithic theory of "The Cause."

  **3. The Completeness vs. Error-Tolerance Conflict**
  *   **Conflict:** Requirement 14 (Error-Tolerance) allows the theory to override intuition. Requirement 3 (Omission Constraint) relies on intuitions about omissions to set the boundary conditions.
  *   **Result:** If the theory overrides the intuition about the Omission case, it may violate the constraint meant to solve it.
  *   **Resolution:** Prioritize formal coherence over specific case intuitions (Req 14 trumps Req 2 in cases of conflict).

  ### The Single Most Eliminative Requirement

  **Requirement 12: The Non-Intervenable Token Constraint.**

  This requirement eliminates the strict **Interventionist Account** immediately. If causation is *defined* by the existence of a possible intervention (as per standard Woodwardian accounts), then causes in the early universe (or any closed historical system) do not exist. To save Interventionism, one must stretch the definition of "intervention" so far that it risks violating the Operationalizability demand of the Statistics faculty. This requirement forces the account to ground causation in something deeper than manipulability (e.g., counterfactual dependence or physical connection) while still explaining why manipulability is a reliable test.

  ---

  ### Scoring of Candidate Accounts

  **1. Counterfactual-Dependence Account (e.g., Lewis)**
  *   **Score:** **Mixed.**
  *   **Strengths:** Handles Token/Type distinction well. Satisfies Non-Intervenable Token Constraint (possible worlds exist even without interventions). Handles Preemption (with fine-graining).
  *   **Weaknesses:** Fails Independence of Similarity Constraint (Req 13) without ad hoc adjustments. Struggles with Omission (too many counterfactual dependencies). Often fails Operationalizability (Stats faculty find possible worlds idle).
  *   **Verdict:** Viable for Philosophy, risky for Statistics.

  **2. Interventionist Account (e.g., Woodward)**
  *   **Score:** **Low.**
  *   **Strengths:** Excellent on Policy, Type-level, and Formal Constraints (Req 8, 10). Satisfies Operationalizability.
  *   **Weaknesses:** Fails Non-Intervenable Token Constraint (Req 12) by definition. Struggles with Token/Responsibility (actual causation is hard to define via interventions). Fails Early Universe case.
  *   **Verdict:** Viable for Statistics, fails Philosophy/History use-case.

  **3. Process Account (e.g., Salmon/Dowe)**
  *   **Score:** **Low.**
  *   **Strengths:** Excellent on Token/Production distinction. Respects Relativistic Constraint (Req 9).
  *   **Weaknesses:** Fails Omission Constraint (no physical process for omissions). Fails Social/Coarse variables (no physical transmission for "recession"). Fails Operationalizability (tracking conserved quantities is often empirically impossible in social science).
  *   **Verdict:** Viable for Physics, fails Social Policy and Omission cases.

  **4. Primitivist / Powers Account**
  *   **Score:** **Mixed.**
  *   **Strengths:** Handles Non-Intervenable Token Constraint easily (powers exist regardless of intervention). Handles Token/Responsibility well.
  *   **Weaknesses:** Fails Operationalizability completely (Stats faculty will view "powers" as idle metaphysics). Struggles with Formal Constraints (hard to map powers to graphical models).
  *   **Verdict:** Viable for Metaphysics, fails Statistics/Policy use-case.

  **Summary:** No existing account satisfies the Dual Purpose without modification. The Interventionist account is closest to the Policy goal but fails the Early Universe/Token goal. The Counterfactual account is closest to the Token goal but fails the Operationalizability goal. Your prospectus must argue for a hybrid or a relativization strategy to survive the seminar.
