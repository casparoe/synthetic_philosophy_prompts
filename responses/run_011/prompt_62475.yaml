      *   *Current State:* Lewis says No (no dependence). Woodward says Direct=Yes, Total=No. They arguably agree on the "Total" question (which matches the plain English "Did it make a difference?").
      *   *Goal:* Make them disagree on the *same* question.
      *   *Idea:* Late Preemption or Trumping.
      *   *Better Idea:* **Overdetermination with a twist.** Or, modify the timing so the backup *fails* to save it in the counterfactual world, but Lewis's similarity metric still says "No" due to miracle/minor miracle issues? No, that's messy.
      *   *Best Idea:* **The "Fragility" of the Event.**
      *   *Modification:* Make the server run sensitive to *exact* temperature. Suppose the server completes *optimally* at 18°C but degrades at 22°C, yet still "completes." Or, suppose the run takes 1.5 hours.
