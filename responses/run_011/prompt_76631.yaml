  1.  **Analyze the Request:**
      *   **Topic:** Nelson Goodman's autographic/allographic distinction (from *Languages of Art*).
      *   **Core Concept:**
          *   Autographic (e.g., painting): History of production matters. Even a perfect physical duplicate is a forgery if it lacks the correct history of production.
          *   Allographic (e.g., poetry/music): Defined by notation/sequence. Any instance that conforms to the notation is an original instance of the work. Copying a poem isn't forgery; it's instantiation.
      *   **Scenario:** A master forger (30 years, perfect physical fakes) tries to forge poetry.
      *   **Structural Requirement:** One stanza must be repeated verbatim later in the piece. The repetition must demonstrate that nothing is lost/counterfeited by repeating (it's still the poem).
      *   **Length:** 20-28 lines.
      *   **Turn:** The moment the forger realizes his skills are worthless for poetry (no way to make it inauthentic via copying).
      *   **Ending:** Don't resolve easily. His last attempt is writing a *new* poem in a dead poet's hand and slipping it into an archive as a "lost manuscript." This is tricky on Goodman's view (is it a forgery of a work? No, because the work didn't exist. Is it a forgery of the artist? Yes.). End on the awkwardness/ambiguity of this act.
      *   **Audience:** Philosophers should recognize the distinction; laypeople should just get a good poem.
      *   **Tone:** Reflective, slightly ironic, precise.

  2.  **Deconstruct Goodman's Distinction for the Poem:**
      *   *Painting:* The object itself is the work. History matters. Forgery is possible because history can be faked.
      *   *Poem:* The text is the work. History doesn't matter (once established). Forgery of an *existing* poem is impossible because any correct copy is an instance of the work.
      *   *The Twist:* Creating a *new* work and attributing it to someone else (false provenance of authorship). Goodman discusses this. If I write a new poem and sign it "Keats," is it a forgery? Goodman says forgery requires an existing work to be forged. If the work doesn't exist, I'm lying about authorship, but am I forging a work? This is the "awkwardness" requested.

