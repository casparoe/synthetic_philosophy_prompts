  Thirty years I aged the canvas skin,
  Cracked lead white to match the master's hand.
  X-rays found no trace of where I'd been,
  Provenance forged to satisfy demand.
  But history binds the paint; the copy fails.

  So I took a sonnet, word for word,
  Pen to paper, copying the line.
  No history needed, only text inferred,
  I made the duplicate, exact and fine.
  To see if twice-told words could less endure.

  Then I saw the trick was dead and done,
  My trade of lies had nothing here to sell.
  The ink is not the work, but what is spun
  From syntax only, where the copies dwell
  As originals beneath the same sun.

  So I took a sonnet, word for word,
  Pen to paper, copying the line.
  No history needed, only text inferred,
  I made the duplicate, exact and fine.
  To see if twice-told words could less endure.

  I wrote a new one, signed the dead,
  Buried it deep in archival dust.
  No former work to forge instead,
  Just false hand on a genuine trust.
  A lie where no original was due.
