answer: |-
  **Statement of Purpose**
  This case is designed to test whether Lewisian conventionality requires an ongoing coordination payoff, or if the structural inertia of precedent alone suffices. It attempts to isolate "convention" from "habit" by stipulating that the agents' *reason* for acting is the expectation of others, even though the *payoff* for matching others has been reduced to zero.

  **The Scenario**
  In a twelve-person university department, faculty historically brewed coffee on Counter A because Counter B's outlet was faulty, a regularity fixed by precedent without discussion. Last month, facilities repaired Counter B, and a departmental survey confirmed with common knowledge that brew quality, walking distance, and cleanup effort are now strictly identical for both counters, with every member reporting strict indifference. There are no rules, sanctions, or reputational effects attached to either counter, and any individual may switch to Counter B at zero cost with the assurance that a proposal to move the pot would be accepted without argument. Despite this, the pot remains on Counter A indefinitely, and each member continues to use Counter A solely because they expect the others to do so, a transmission mechanism made visible when a new hire, Dr. Aris, asks why they use Counter A and is told by a senior colleague, "Simply because everyone else expects to find it there," to which Aris immediately conforms despite having no independent preference.

  **The Audit**

  **Lewis's Conditions**
  1.  **Recurrent Situation:** Holds. The coffee routine is a repeated interaction.
  2.  **Near-Universal Conformity:** Holds. All twelve members use Counter A.
  3.  **Near-Universal Expectation:** Holds. Each expects the others to use Counter A.
  4.  **Conditional Preference:** **Fails.** Lewis requires that an agent prefers to conform *on the condition* that others conform ($U(Conform | Others Conform) > U(Deviate | Others Conform)$). In this scenario, the survey establishes strict indifference ($U(Conform | Others Conform) = U(Deviate | Others Conform)$). Because the coordination problem is extinguished, there is no payoff to matching; thus, the preference required for a Lewisian convention is absent.
  5.  **Arbitrariness:** Holds. Counter B would serve equally well (in fact, identically well).

  **Bicchieri's Classification**
  Under Cristina Bicchieri's framework, a social norm requires both *empirical expectations* (believing others do it) and *normative expectations* (believing others think one *ought* to do it, backed by potential sanctions). This case exhibits empirical expectations but explicitly stipulates away normative expectations (no sanctions, no disapproval, strict indifference). Therefore, this is not a social norm but a **descriptive regularity** (or custom). The members have no *normative* reason to keep it going, only a behavioral inertia that mimics coordination.

  **Dynamic Account**
  A purely dynamic or evolutionary learning model (e.g., replicator dynamics or fictitious play) treats actions with identical payoffs as neutral. In the absence of a payoff differential or switching cost, the population should exhibit **random drift**. While a temporary cluster on Counter A is possible, the model predicts the regularity should not remain "stable indefinitely"; eventually, a random deviation should occur and, having no negative payoff consequence, should not be corrected. The prediction differs from the Lewisian one: Lewis predicts stability *if* conditions hold (but they don't here), whereas dynamic models predict instability/drift when payoffs are flat. The scenario's stipulated stability is statistically anomalous without hidden friction.

  **The Honest Part**
  The single stipulation doing all the work is the claim that **"the regularity must remain stable indefinitely"** despite **"strict indifference"** and **"zero switching cost."** For rational agents, this is incoherent. If agents are truly indifferent and face zero cost to switch, their expectation that others will conform provides no *reason* to conform, because being out of sync carries no penalty. The stability stipulated is behavioral inertia, not rational coordination.

  If you relax the **strict indifference** constraint to allow a micro-preference for predictability (even if the counters are physically identical, *uncertainty* has a cost), the case becomes coherent: the coordination problem is not extinguished, merely minimized. The Lewis defender's strongest reply is that your scenario describes **habit**, not convention. Lewis explicitly ties convention to the *resolution* of a coordination problem; if the problem vanishes, the convention dissolves into mere regularity. The specification set is unsatisfiable for a *Lewisian Convention* because Condition 4 (Conditional Preference) cannot be met under strict indifference. To get a case that is both coherent and interesting, you should drop the **"strict indifference"** constraint. Allow the agents to prefer conformity slightly (e.g., to avoid the cognitive load of checking where the pot is), which restores the conditional preference and makes the stability rational rather than magical.
