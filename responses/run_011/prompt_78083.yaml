answer: |-
  ### Brainstorming: The Job Description

  Before we list constraints, we need to agree on what work "content" is doing in the room. If we are asking whether a scrub-jay has a *belief* that a worm is in the cache, rather than a disposition to peck at cache-sites, the theory must do three things:
  1.  **Normativity:** It must distinguish *getting it right* from *just happening*. A thermostat correlates with temperature, but it doesn't *misrepresent* when it breaks. A jay can be wrong.
  2.  **Individuation:** It must tell us *which* proposition is believed. Is the state about "worm," "food," "moving thing," or "worm-or-BB"?
  3.  **Causal Relevance:** The content itself (not just the neural vehicle) must explain the behavior. If the content is epiphenomenal, the "belief" label is just a metaphor.

  If the theory can't naturalize these three without smuggling in human language or irreducible intentionality, it fails the seminar.

  ***

  ### The Spec: Desiderata for a Naturalistic Theory of Content

  | Requirement | The Case / Consideration | Status |
  | :--- | :--- | :--- |
  | **1. The Misrepresentation Constraint** | The theory must allow a state to token in the absence of its referent without collapsing into "it means whatever caused it." If a jay caches in an empty hole, the state must be *false*, not just "about empty holes." | **Non-Negotiable** |
  | **2. Determinacy (Disjunction)** | Must solve the "qua problem." Why does the state mean *fly* and not *fly-or-BB* or *small-dark-moving-thing*? Without this, we cannot distinguish belief from reflex disposition. | **Non-Negotiable** |
  | **3. Causal Efficacy** | Content properties must figure in the causal explanation of behavior. If we explain the jay's retrieval solely via neural firing patterns, content is idle. | **Non-Negotiable** |
  | **4. Novelty / Plasticity** | The theory must assign content to states triggered by stimuli the organism's ancestors never encountered (e.g., a jay caching in a human-made container). | **Prejudice (Cognition Camp)** |
  | **5. Ubiquity Threshold** | The theory must not assign "belief" to thermostats or bacteria. It needs a line between simple information-processing and genuine representation. | **Prejudice (Philosophy Camp)** |
  | **6. Accessibility** | The facts fixing content must be, in principle, observable by a field biologist (e.g., behavior, environment, history), not hidden metaphysical essences. | **Debatable (See below)** |
  | **7. Compositionality (Weak)** | For "belief" specifically, the system must support some recombination of content (e.g., food *here* vs. food *there*). | **Prejudice (Belief Camp)** |

  ***

  ### On the Accessibility Requirement

  Does Accessibility deserve a place on the list? **Yes, but as a methodological constraint, not a metaphysical one.**

  If you label it "Non-Negotiable," you are indeed wearing verificationism in a lab coat. Metaphysical facts (like selection history) can be real even if obscure. However, for *this* seminar, it is pragmatically non-negotiable. If the theory says a jay has a belief but the conditions that fix that belief are inaccessible to empirical inquiry (e.g., counterfactuals about evolutionary history that left no trace), then the theory is useless for comparative cognition. It turns "belief" into a noumenon.

  **Verdict:** Keep it on the list, but flag it as the point where metaphysics meets grant-writing. If a theory requires knowing the exact selection pressure of a neural circuit 2 million years ago to determine if a bee has a belief *today*, the theory is dead for your purposes.

  ***

  ### Joint Satisfiability & The Swampman Maneuver

  Your hunch is correct: **Strict Etiology and Accessibility are jointly unsatisfiable in practice.**

  If content is fixed by specific selection history (Teleosemantics), a field biologist cannot verify it in real-time. They can infer it, but they cannot observe the historical selection events. This creates a friction: the philosophers want the history to secure the normativity (Requirement 1), but the cognitivists need current observables to secure the science (Requirement 6).

  **On Swampman:**
  You are right that Swampman isn't a neutral desideratum; it is a **metaphysical commitment wearing a thought experiment's clothing.**
  *   If you intuit that Swampman *has* content, you are committed to the view that history is *evidential* but not *constitutive*. You believe current functional organization is sufficient.
  *   If you intuit Swampman *lacks* content, you are committed to the view that history is *constitutive*.
  *   **The Sneak:** Using Swampman as a "test" begs the question against etiological theories. It shouldn't be a constraint on the theory; it should be the *output* of the theory that reveals your metaphysical priors. Don't let students use it to knock out teleosemantics; let them use it to reveal their commitment to Internalism vs. Externalism.

  ***

  ### The Killer Constraint

  **The Disjunction Problem (Requirement 2).**

  This is the graveyard of naturalistic theories. Almost every theory can handle successful representation. Almost every theory can handle causal efficacy. But explaining why a state means *X* rather than *X-or-Y* without appealing to irreducible intentionality is where 90% of candidates bleed out.

  ### One-Line Obituaries for Contenders

  *   **Biosemantics (Millikan/Neander):** Dies on **Novelty**; it struggles to assign content to states handling stimuli outside the organism's selective history (the "new container" problem).
  *   **Indicator Semantics (Dretske/Fodor early):** Dies on **Misrepresentation**; if content is covariation, error is impossible (a BB triggering a "fly" detector means *fly-or-BB*).
  *   **Asymmetric Dependence (Fodor late):** Dies on **Accessibility**; it relies on psychological laws and counterfactuals that field biologists cannot test or verify in non-linguistic animals.
  *   **Hybrid Teleo-Functional (Shea/Artiga):** Dies on **Complexity**; it requires disentangling consumer systems from producer systems so finely that it becomes operationally opaque for insect cognition.
