answer: |-
  ### 1. Explicit Mapping of the Analogy

  Based on the trench material provided, here is how the "Book" analogy maps onto the specific physical reality of your excavation:

  *   **The Book:** The total archaeological site (the pit, the buried soil, the pre-dating ditch, and the unexcavated portion under the road).
  *   **The Pages:** Individual stratigraphic contexts (e.g., the specific fill episodes of the shallow pit, the buried soil horizon).
  *   **The Sentences:** Artifact assemblages or features within a context (e.g., the cluster of sherds from the single vessel).
  *   **The Fixed Order of Pages:** The Harris Matrix or stratigraphic sequence (the assumption that Context A must physically precede Context B).
  *   **The Author:** The past human agents who deposited the sherds or dug the pit (implied intent to create a sequence).
  *   **The Act of Reading:** The physical removal of soil and the creation of the record (plans, sections, photogrammetry).
  *   **The Destruction of the Page:** The removal of the context, rendering the physical relationship unrecoverable (none of which can be re-excavated).
  *   **The Completed Book:** The final publication or interpretation derived from the record.

  ### 2. Disanalogies: Bearing on Conclusions vs. Picturesque

  This section separates where the analogy breaks down in ways that matter for your funding arguments (Bearing) versus where it is merely imprecise but harmless (Picturesque).

  **A. Disanalogies Bearing on Conclusion 1 (Exhaustive Record / Fixed Interpretation)**
  *   **The Disanalogy:** In a book, the text on the page is stable before reading. In your trench, the "text" is unstable *before* excavation due to ploughsoil movement and burrow disturbance.
  *   **Why it Bears:** The argument that "interpretation must be fixed while the trowel is still in the ground" assumes the ground holds a fixed truth waiting to be captured. Your trench material shows joining sherds across *inverted* contexts. No amount of exhaustive recording (plans/photogrammetry) can "fix" an interpretation that the physical stratigraphy contradicts. The record captures the *ambiguity* (the inversion), not a fixed narrative. The analogy falsely suggests that better recording yields a coherent text; the material shows better recording yields a coherent record of incoherence.

  **B. Disanalogies Bearing on Conclusion 2 (Non-Invasive / Leave in Ground)**
  *   **The Disanalogy:** A book left closed remains intact. A site left in the ground beneath a ploughsoil and an existing road is not "closed"; it is actively degrading or inaccessible.
  *   **Why it Bears:** The argument to "leave the greater part of every site in the ground" relies on the idea that the "book" is being preserved for future readers. However, 90% of your feature lies beneath a road (inaccessible) and the top is under ploughsoil (active disturbance). Leaving it there does not preserve the "pages"; it abandons them to erosion or infrastructure. The analogy implies preservation by inaction; the material demonstrates degradation by inaction.

  **C. Merely Picturesque Disanalogies**
  *   **The Disanalogy:** Books have margins and uniform page sizes; contexts have irregular boundaries and varying volumes.
  *   **Why it is Picturesque:** This does not impact the logic of destruction or sequence. Whether a "page" is square or irregular does not change the fact that removing it destroys its physical relationship to the next.
  *   **The Disanalogy:** Reading is silent/mental; excavation is physical.
  *   **Why it is Picturesque:** This is a metaphorical flourish. It does not alter the epistemological claim about data loss.

  ### 3. Imported Commitments (Source Domain vs. Target)

  The "Book" source domain quietly imports three commitments that the trench target domain lacks. These imports are where the colleague's objection gains traction, but we can verify them against your material.

  *   **Authorship (Intent to Communicate):**
      *   *Import:* A book implies an author arranging pages to convey a specific message.
      *   *Target Reality:* The refitting sherds found across the pit fills *and* a pre-dating ditch suggest curation, redeposition, or accidental mixing, not a linear narrative. The "author" (depositor) was likely discarding waste, not writing a history. The trench material falsifies the commitment that the deposit was arranged to be "read."
  *   **Semantic Content (Inherent Meaning):**
      *   *Import:* A page contains meaning (words) prior to reading.
      *   *Target Reality:* The stratigraphic inversion of joining sherds has no inherent "meaning" until you hypothesize a formation process (e.g., bioturbation vs. human digging). The meaning is constructed by the excavator, not encoded in the soil. The "text" is generated during excavation, not discovered.
  *   **Determinacy of Meaning (Single Truth):**
      *   *Import:* A book has a correct reading.
      *   *Target Reality:* The burrow disturbance along interfaces creates multiple plausible explanations for the inversion. The "story" of the site is probabilistic, not determinate. The analogy imports a false confidence that a "correct" interpretation exists to be fixed.

  ### 4. Judgment on Conclusions (Stripped of Analogy)

  If we strip away the "Book" analogy and look only at the trench material and the nature of destructive sampling:

  *   **Conclusion 1 (Exhaustive Record / Fixed Interpretation):**
      *   *Verdict:* **Partially Survives, but Modified.**
      *   *Reasoning:* The claim that "the record has to be exhaustive at the moment of removal" survives because the physical context *is* destroyed (you cannot re-excavate). However, the claim that "interpretation must be fixed" fails. The trench shows that exhaustive recording (photogrammetry/sections) captures the *data*, but the *interpretation* (why sherds are inverted) may remain provisional. The analogy was carrying the weight of the "fixed interpretation" claim; the material supports "fixed record," not "fixed meaning."
  *   **Conclusion 2 (Non-Invasive / Leave in Ground):**
      *   *Verdict:* **Does Not Survive.**
      *   *Reasoning:* The analogy suggests leaving the site preserves the "book." The material shows the site is under a road and ploughsoil. Leaving it does not preserve it for a "second reading"; it condemns it to inaccessibility and erosion. The argument for non-invasive survey must rest on *technological capability* (can we learn enough without digging?), not on the *preservation of a narrative* (saving the book), because the "book" is already torn and buried under asphalt.

  ### Concrete Audit: Falsification vs. Failure to Support

  Using the specific trench material (inverted sherds, ploughsoil, road, 10% excavation), here is the audit of the Book Analogy's commitments:

  **Positively Falsified by Material:**
  1.  **Fixed Order of Pages:** The stratigraphic inversion of contexts containing joining sherds proves the "pages" are not in a fixed, linear order. In a book, Page 10 cannot physically exist below Page 9. In your trench, the "text" is physically scrambled *before* you read it.
  2.  **The Completed Book:** The fact that 90% of the feature lies beneath an existing road falsifies the idea that there is a "complete book" to be read or saved. You possess, at best, a single torn paragraph from a volume where the rest is encased in concrete.
  3.  **Pristine Pages:** The visible burrow disturbance and ploughsoil movement falsify the idea that the "pages" are intact prior to reading. The "text" has been corrupted by natural processes before the trowel touched it.

  **Merely Fails to Support (but does not falsify):**
  1.  **Destruction of the Page:** The material does not falsify this. You cannot re-excavate the boxed samples. The record (plans/photogrammetry) is a representation, not the context itself. This commitment holds.
  2.  **Single Reading:** The material does not falsify this. You only get one chance to excavate that 10%. However, it fails to *support* the value of that reading, since the sample is so small and disturbed.

  ### Replacement Source Domain

  The "Book" analogy fails because it imports authorship, linearity, and semantic determinacy. For your funding applications, you need a source domain that acknowledges **destruction**, **partial access**, and **reconstruction without inherent narrative**.

  **Recommended Analogy: A Forensic Autopsy of a Fragmentary Remains.**

  **Mapping:**
  *   **The Body:** The Archaeological Site.
  *   **Organs/Tissues:** Stratigraphic Contexts.
  *   **Scalpel:** The Trowel/Excavation.
  *   **Pathology Report:** The Archaeological Publication.
  *   **Trauma/Disease:** Human activity/Natural disturbance (ploughing/burrows).
  *   **Encased Limb:** The unexcavated portion under the road.

  **Work it can do for Passage 1 (Exhaustive Record):**
  *   *Argument:* "Like a medical examiner, the archaeologist performs a destructive analysis. Once the incision is made, tissue relationships are altered permanently. Therefore, the documentation (photogrammetry/sections) must be exhaustive at the moment of cutting, because the 'body' cannot be restored to its pre-operative state for a second opinion."
  *   *Why it works:* It retains the urgency of destruction without implying the body "wrote" a message. It accommodates the "inversion" (trauma can displace organs) and the "disturbance" (decomposition/burrows).

  **Work it can do for Passage 2 (Non-Invasive / Leave in Ground):**
  *   *Argument:* "Modern medicine prioritizes non-invasive diagnostics (MRI/CT) where possible to preserve the integrity of the patient. Similarly, where remote sensing can answer the research question, we should not 'incise' the site. Furthermore, if the majority of the 'patient' is inaccessible (under the road) or compromised (ploughzone), a full autopsy is neither feasible nor ethical; we should limit sampling to what is strictly necessary."
  *   *Why it works:* It shifts the justification from "saving the story" to "ethical sampling" and "diagnostic sufficiency." It acknowledges that leaving the site isn't about saving a perfect text, but about minimizing unnecessary destruction of a finite resource.

  **What the Replacement Cannot Do:**
  *   It cannot promise a "cure" or a definitive "cause of death." Just as an autopsy might list "undetermined" due to decomposition (burrow disturbance), the archaeological report may remain provisional.
  *   It cannot imply the "body" wanted to be examined. It removes the colleague's objection regarding authorship; a body bears evidence of events, not messages.

  **Summary for the Application:**
  Use the **Forensic/Diagnostic** analogy. It allows you to argue for **rigorous recording** (because evidence is destroyed by sampling) and **restraint** (because unnecessary sampling is unethical and often redundant), without falsely promising that the ground contains a coherent, authored narrative waiting to be read.
