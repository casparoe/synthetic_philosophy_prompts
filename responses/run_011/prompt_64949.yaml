answer: |-
  Here is the specification you asked for. It strips away the theoretical baggage each author brings to the table and isolates the phenomenological and logical constraints any theory of convention must satisfy.

  ### The Spec: Constraints on an Account of Convention

  **1. The Coordination Constraint (Non-Negotiable)**
  *   **Requirement:** The account must explain how agents converge on a single regularity when multiple regularities would solve the problem equally well.
  *   **Motivating Case:** Meeting a stranger in a city. You both want to meet, but any location works provided you pick the *same* one.
  *   **Why Non-Negotiable:** Without this, you aren't explaining convention; you're explaining technical necessity or coercion.

  **2. The Arbitrariness Constraint (Non-Negotiable)**
  *   **Requirement:** The specific content of the convention must be contingent. There must have been a viable alternative that *could* have been selected.
  *   **Motivating Case:** Driving on the right vs. the left. Both solve the crash-avoidance problem.
  *   **Why Non-Negotiable:** If the solution is uniquely determined by physics or efficiency (e.g., "look both ways before crossing"), it is not a convention.
  *   **Note on Lock-in:** This does *not* conflict with stability. Arbitrariness is an *ex ante* property (at the origin), while lock-in is an *ex post* property (after network effects accumulate). QWERTY is arbitrary in origin (could have been Dvorak) but locked in now (switching costs are too high). There is no tension here unless you define arbitrariness as "reversible at any time," which no serious theorist does.

  **3. The Privacy Constraint (Non-Negotiable)**
  *   **Requirement:** The account must explain conformity in the absence of surveillance or immediate payoff.
  *   **Motivating Case:** 3am on an empty road. You still drive on the right.
  *   **Why Non-Negotiable:** If conformity vanishes when the police leave, you are describing compliance or prudential fear, not convention. Conventions are internalized as "the way things are done."

  **4. The Normativity Constraint (Non-Negotiable)**
  *   **Requirement:** The account must explain why defection licenses resentment, blame, or sanction, even in pure coordination cases where the defector causes no material harm.
  *   **Motivating Case:** Wearing black tie to a white-tie event. You haven't harmed anyone physically, yet hosts are offended.
  *   **Why Non-Negotiable:** This distinguishes convention from mere habit (brushing your teeth) or fashion (wearing bell-bottoms). Habits and fashions invite confusion or ridicule; conventions invite *blame*.
  *   **Distinction:** It must also distinguish convention from moral norms. Breaking a moral norm (murder) warrants blame *everywhere*; breaking a convention (driving side) warrants blame only *within the group*.

  **5. The Epistemic Opacity Constraint (Non-Negotiable)**
  *   **Requirement:** The account must allow for stability even when agents hold false beliefs about the beliefs of others.
  *   **Motivating Case:** Pluralistic Ignorance. In pre-revolutionary regimes, or footbinding, everyone complies because they think everyone else supports it, when in fact almost no one supports it privately.
  *   **Why Non-Negotiable:** Empirical social science shows common knowledge is rare. If your theory requires everyone to know that everyone knows, it explains almost nothing in the real world.

  **6. The Dynamics Constraint (Optional/Contested)**
  *   **Requirement:** The account must explain both emergence from nothing and rapid collapse.
  *   **Motivating Case:** Footbinding lasted centuries then vanished in a generation. How does a convention start without a focal point, and how does it die when preferences haven't changed?
  *   **Why Optional:** A theory of *what a convention is* (static ontology) might not need to explain *how it changes* (dynamic history). However, a theory claiming to explain social order *generally* needs this. Most game-theoretic accounts fail emergence; most sociological accounts fail collapse.

  **7. The Rationality Constraint (Optional/Contested)**
  *   **Requirement:** Conformity must be derivable from individual rationality (maximizing expected utility given beliefs).
  *   **Motivating Case:** The game-theoretic insistence that social order must be microfounded in rational choice.
  *   **Why Optional:** This is a methodological prior, not a phenomenological fact. People often follow conventions irrationally, or via heuristics. Insisting on strict rationality is a "labcoat prior" that forces you to distort the psychology to save the math.

  ---

  ### The Incompatibilities: Where the Models Break

  You suspected tensions between requirements. You were right about some, wrong about others. Here is the breakdown of what is jointly unsatisfiable.

  **1. The Dissolved Conflict: Arbitrariness vs. Lock-in**
  As noted above, this is a category error. Arbitrariness refers to the *selection* phase; lock-in refers to the *maintenance* phase. Path dependence explains both: a random walk at the start (arbitrary) leads to a deep valley in the fitness landscape (locked in). You do not need to sacrifice one to save the other.

  **2. The Real Conflict: Rationality vs. Epistemic Opacity**
  This is your paper topic.
  *   **The Tension:** Standard rational choice models (Lewis, Game Theory) require that I conform because I believe you will conform, and you conform because you believe I will. This creates a chain of reasoning that typically converges on Common Knowledge.
  *   **The Problem:** Pluralistic ignorance (Constraint #5) dictates that my belief about your belief is *false*. I think you support the convention; you don't.
  *   **The Impossibility:** If I am a standard rational agent with standard updating rules, persistent false beliefs about a observable regularity should be corrected. If I see you conforming, I should infer you support it. If you don't support it but conform anyway, I should eventually detect the discrepancy.
  *   **The Verdict:** You cannot have **Strict Individual Rationality** + **Stable False Beliefs** + **Long-term Stability**.
      *   Lewisian accounts save Rationality and Stability by demanding Common Knowledge (sacrificing Epistemic Opacity).
      *   Sociological accounts save Opacity and Stability by positing social pressure/internalization (sacrificing Strict Rationality).
      *   **The Exclusionary Constraint:** **Epistemic Opacity** is the single requirement that excludes the most candidates. It kills Lewis immediately. It kills strict Common Knowledge accounts. It forces you into either evolutionary models (where agents aren't "rational" in the cognitive sense) or normative expectation models (where preferences are endogenous to the group).

  **3. The Normative Tension: Coordination vs. Blame**
  *   **The Tension:** In a pure coordination game, defection hurts the defector most (they crash). Why should *I* be angry?
  *   **The Problem:** If the convention is *just* a solution to a coordination problem, blame is irrational. I should just pity the fool who drove on the left. But we *do* blame.
  *   **The Verdict:** To explain blame, you must smuggle in a Norm. But if you smuggle in a Norm, you risk collapsing the distinction between Convention and Morality (Constraint #4).
  *   **The Trade-off:** Accounts that ground convention purely in equilibrium selection (Evolutionary Game Theory) cannot explain blame without adding a separate layer of "normative expectations." Accounts that ground it in Norms (Bicchieri) struggle to explain why the norm exists *before* the expectation is established.

  ---

  ### Evaluation of Broad Strategies

  **1. Common Knowledge + Rationality (Lewis, Gilbert)**
  *   **Performance:** Nails Arbitrariness and Coordination. Explains why we follow the rule (it's rational).
  *   **Failure:** Collapses on Epistemic Opacity. Real humans do not have infinite recursive belief states. It also struggles with the Privacy Constraint; if no one is watching, and there's no payoff, the rational choice to deviate becomes harder to rule out without assuming the convention is *already* normative. It treats the normativity as a conclusion when it should be a premise.

  **2. Evolutionary / Dynamical Selection (Skyrms, Young)**
  *   **Performance:** Excellent on Emergence and Lock-in. Explains how we get from nothing to something without hyper-rational agents. Handles the 3am driving case well (it's a learned disposition, not a calculation).
  *   **Failure:** Struggles with Normativity and Blame. Evolution explains why the behavior persists, not why I feel *resentment* when you violate it. It reduces convention to habit at the population level, making the distinction between "fashion" and "convention" difficult to maintain without adding normative machinery back in.

  **3. Networks of Empirical and Normative Expectations (Bicchieri, Brennan/Eriksson)**
  *   **Performance:** Best fit for Epistemic Opacity and Blame. Distinguishes convention from moral norms by making the normative force conditional on empirical expectations (I ought to do X only if I expect others to do X).
  *   **Failure:** Struggles with Emergence. If my obligation depends on my expectation of your behavior, how does the first expectation get off the ground without a focal point? It also risks making conventions too fragile; if expectations shift, the obligation vanishes instantly, which doesn't match the inertia of things like footbinding.

  **Summary for your paper:** Focus on the **Rationality vs. Opacity** incompatibility. The field is currently trying to square the circle of "rational agents" maintaining "stable false beliefs." If you can show that preserving the phenomenon of pluralistic ignorance requires abandoning standard rational choice microfoundations, you have a critique that cuts across the Lewisian and Evolutionary camps alike.
