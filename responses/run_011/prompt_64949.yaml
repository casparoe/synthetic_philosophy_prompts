prompt: |-
  three weeks into a social ontology seminar and I've completely lost the plot. we did Lewis on convention first, then the focal point stuff, then the expectations-based accounts and the evolutionary game theory ones, and every single author just asserts their own framework handles the cases the others miss. before I read another one of these I want the spec.

  so: write out what an account of why people follow conventions actually has to deliver to count as adequate. the phenomena it has to explain, the verdicts it has to get right on particular cases, the distinctions it cant collapse, and the results from game theory or from the empirical work that it would contradict if it got them wrong. for each one give me the case or consideration that's doing the motivating — because I strongly suspect half of these "requirements" are just one camp's priors wearing a labcoat — and then tell me which ones are genuinely non-negotiable for any account and which are optional add-ons that only some programs want, and say why each falls on that side of the line.

  stuff I want folded in somewhere appropriate (dont just echo my bullets back at me as the list): why people keep following a convention when no one's watching and there's no live coordination problem at that moment — 3am, empty road, still driving on the right; how a convention gets off the ground from nothing when there's no pre-existing focal point to grab onto; why some conventions stay locked in even though everyone involved would prefer a different one and could switch, and the fact that the collapse when it comes can be extremely fast (QWERTY, and footbinding, which lasted centuries and then went away in basically a generation — I think any account owes us both halves of that); how a convention differs from a norm with actual moral weight behind it, and how either differs from a mere habit, a fashion, or a rule someone laid down on purpose; the fact that breaking a convention seems to license resentment and blame even in pure coordination cases where the defector cost nobody anything; and the fact that real people demonstrably don't have anything like common knowledge of what everyone else believes — a lot of the time they have flatly false beliefs about everyone else's beliefs and expectations and the convention runs anyway, which is the pluralistic ignorance business.

  then the part I actually care about. tell me which pairs or triples of these requirements can't all be satisfied together. my guess is that "conformity must be explained by each individual's rationality given their beliefs about others" and "must explain stability sustained by widely false beliefs about others" are in direct conflict. I also suspect arbitrariness and lock-in conflict, but check whether that one dissolves on inspection — maybe arbitrariness is only a claim about which regularity could have got started, not about whether it could be changed now, in which case a locked-in convention is still arbitrary and there's no tension at all. if some subset really is jointly unsatisfiable, say it plainly and say which member has to go, because that's the kind of result I'd want to build a paper around rather than another survey. and tell me which single requirement does the most work excluding candidate accounts.

  last and least: a short paragraph each on how three broad strategies do against the finished list — grounding convention in common knowledge plus rationality, grounding it in evolutionary or dynamical selection over recuring interactions, and grounding it in networks of empirical and normative expectations. keep that brief, no scorecard table and definitely no bibliography, I already have the reading list and I'm trying to get out from under it.
