  For the test itself, I need something that captures whether the harm stems from structural positioning rather than isolated mistakes. "Structural disadvantage required" gets at this, though it's four words. "Systematic identity-based harm" is also four. The constraint is tight, but the core insight is that epistemic injustice isn't about individual wrongs—it's about how social structures shape who gets believed, heard, or understood. I need to reconsider the word count constraint. "Systematic structural disadvantage" is three words and captures the core distinction—whether the harm stems from entrenched patterns rather than isolated incidents.

