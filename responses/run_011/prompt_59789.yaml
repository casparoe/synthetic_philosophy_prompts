  9. Algorithmic bias in triage - Structural injustice, unclear perpetrator.
   
  The core tension emerges around what distinguishes epistemic injustice from ordinary error. Cases #3 and #4 reveal a crucial distinction: when someone's epistemic contribution is systematically discounted due to identity-based prejudice versus when credit is simply stolen without that prejudicial dimension. Case #7 shows the boundary—parental dismissal of a teenager's concern becomes injustice only when it reflects patterned disregard for their epistemic agency, not when it's an isolated misjudgment. The principle needs to capture systematic patterns of epistemic harm tied to social positioning, not just any instance where someone isn't believed or credited. I'm noticing a pattern across these cases. The core issue seems to be whether the epistemic harm stems from structural or identity-based disadvantage rather than isolated mistakes. Cases 1, 2, 5, 6, 8A, and 9 all involve systematic patterns tied to social positioning—gender, mental health status, class, conceptual resources, age, or algorithmic bias. Case 7 stands apart as a personal misjudgment without that structural dimension.

