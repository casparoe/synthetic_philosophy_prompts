  Looking at the distinction more carefully: in case 3, the speaker's epistemic agency gets systematically undermined through hedging that's interpreted differently based on language background. In case 4, the theft is direct appropriation rather than credibility denial. The mechanism differs even if the outcome—lost credit—looks similar.

  A workable principle would require: systematic pattern rather than isolated incident, identity-based or structural disadvantage as the driver, and harm to epistemic agency specifically (being heard, credited, or understood as a knower). This captures why 7 doesn't qualify—it's a single parental error without structural backing—while explaining why 3 does qualify despite the credit theft surface similarity to 4.

