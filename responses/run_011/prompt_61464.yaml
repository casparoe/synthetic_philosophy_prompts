answer: |-
  You are wrestling with the gap between *descriptive* cascade models (how people *do* behave) and *normative* decision theory (how people *should* behave). Your "Separate-Sources Rule" is a strong start because it correctly identifies correlation as the enemy of information aggregation. However, it fails because it treats all copying as an epistemic act. Sometimes copying is a coordination act (Fire Alarm), and sometimes it is a hierarchy act (ER Attending).

  To resolve your nine cases without epicycles, I propose the **Weighted Independence & Coordination Principle**. It has three clauses.

  **Clause 1: Epistemic Independence.** Treat observed actions as independent evidence only if there is no known or reasonably suspectable common cause (e.g., bots, wire services, citation rings).
  *   *Motivation:* The News Sites and Citation Ring cases. You counted one signal three times.
  *   *Verdict on Planted Line:* The tourist is **ex-ante rational**. He could not reasonably suspect the common cause (the agency). Your feeling that "something went wrong for him" is about *welfare*, not *rationality*. You must accept that one can be perfectly rational and still be harmed by a hostile environment.

  **Clause 2: Competence Weighting.** Defer to public consensus only when the aggregate quality of public signals exceeds the quality of your private signal, accounting for expertise differentials.
  *   *Motivation:* The ER Attending vs. Co-residents cases. An Attending's signal outweighs a resident's; five residents' signals may not outweigh one resident's private data if the data is strong.
  *   *Verdict on Hiring Committee:* **Do not cave.** You have a high-quality private signal (interview); the committee has low-quality public signals (file read). The consensus is noise, not signal.

  **Clause 3: Coordination Override.** Follow the crowd regardless of evidence quality when the cost of coordination failure (e.g., death, isolation) exceeds the cost of informational error, provided the crowd's action is not obviously self-destructive.
  *   *Motivation:* The Fire Alarm case.
  *   *Resolution:* This distinguishes the Fire Alarm from the Planted Line. In the Fire Alarm, the goal is not "find the truth" but "don't die alone."

  ### Which Verdicts You Must Drop
  I am not rescuing everything. To make this principle work, you must abandon two specific intuitions:
  1.  **The Hiring Committee Cave:** You cannot say caving is "fine." If your private information is structurally superior (interview vs. file), cascading is negligence, not humility.
  2.  **The Fire Alarm Analogy:** You must stop thinking the Fire Alarm dependency is epistemically identical to the Planted Line dependency. One is information aggregation (prone to error); the other is risk pooling (prone to safety).

  ### New Cases
  1.  **High-Frequency Trading:** An algorithm sells because five other algorithms sold. *Verdict:* Irrational (Clause 1). They are likely reacting to the same micro-structure signal, not independent info.
  2.  **Evacuation Route:** A crowd runs toward a locked exit during a fire. *Verdict:* Do not follow (Clause 3 exception). The action is "obviously self-destructive," voiding the coordination override.

  ### Fragility
  My weakest link is **Clause 1 (Epistemic Independence)**. The standard for "reasonably suspectable" is subjective. If I encounter a case where correlation is perfectly hidden (e.g., a "astroturfing" campaign indistinguishable from organic grass), the principle labels the actor rational, but intuitively we feel they *should* have been more skeptical. If you can show me a case where "reasonable suspicion" is objectively measurable but still leads to the wrong verdict, Clause 1 breaks.

