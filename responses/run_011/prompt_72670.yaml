      *   *Not Pseudohistory (but maybe wrong/fraudulent):* Heyerdahl (experiment good, theory bad), Vinland Map (forgery), Piltdown (fraud + credulity), Younger Dryas (science vs. docu), Clovis First (dogma), Black Athena (overreach), Own Dissertation (source criticism).
      *   *Key Tension:* Case 8 (Younger Dryas) shows the *same claim* can be science or pseudohistory depending on *how* it's argued/packaged. Case 11 (Own Dissertation) highlights the fear of being labeled a crank when making revisionist claims.
      *   *Current Rule:* Unfalsifiability + Burden of Proof inversion. User notes this strains against Heyerdahl, Clovis, Black Athena, and their own work.

  3.  **Philosophical Context (The "Laudan Line"):**
      *   *Larry Laudan (1983):* "The Demarcation Problem is a pseudo-problem." Argued that necessary and sufficient conditions for "science" vs. "non-science" don't exist and the term is mostly pejorative.
      *   *Current Consensus:* Laudan was right that a *single* necessary-and-sufficient condition is impossible. However, the project isn't dead. Philosophers (Hansson, Mahner, Pigliucci, Boudry) argue for "cluster concepts" or "family resemblances" (Wittgenstein). The term *is* useful for pedagogical and social reasons (identifying epistemic vice), even if it lacks a sharp boundary.
      *   *User's Framing:* The user asks for *a* principle. I need to tell them that a single rule is likely impossible (per Laudan), but a cluster concept is the standard contemporary solution. I must not present the cluster concept as "settled truth" but as the "most productive working model."

  4.  **Developing the Principle (The Cluster Concept):**
      *   Pseudohistory isn't about *what* is claimed (Atlantis could be real), but *how* the claim is sustained.
      *   Key features of pseudohistory (drawing on Hansson, Shermer, Pigliucci):
          1.  **Immunity to Revision:** Evidence against the theory is reinterpreted as part of the conspiracy/bias, not as falsification. (User's "unfalsifiable" point).
          2.  **Selective Skepticism:** Hyper-skepticism of mainstream sources, hyper-credulity of supporting sources.
          3.  **Lack of Progressive Research Program:** The theory doesn't generate new, testable predictions; it only explains past anomalies post-hoc.
          4.  **Rhetorical Strategy:** Appeal to popularity, ancient authority, or "suppressed truth" rather than peer engagement.
      *   *Differentiation:*
          *   vs. Fraud: Fraud knows it's false (intent). Pseudohistory believes itself.
          *   vs. Dogma: Dogma refuses to look. Pseudohistory looks but interprets everything as confirmation.
          *   vs. Controversial Science: Controversial science engages with critique to refine theory. Pseudohistory engages to dismiss critics.

  5.  **Applying the Principle to the 11 Cases:**
      *   *Fomenko, Von Däniken, Atlantis (literal), Hancock:* Fit the cluster (Immunity, Selective Skepticism, No Progress).
      *   *Heyerdahl:* Experiment = Science. Diffusionist thesis = Bad Science/Pseudohistory border. Why? He engaged with critique, but the core claim lacked mechanism. Verdict: "Refuted Hypothesis" rather than pseudohistory, *unless* he ignored counter-evidence (which he largely didn't, he just overinterpreted). *Correction:* User says "half-call it pseudohistory." I should validate that ambiguity.
      *   *Vinland/Piltdown:* Fraud. Intent matters.
      *   *Younger Dryas:* Journal version = Controversial Science (engages critique). Docu version = Pseudohistory (conspiracy, "archaeologists hiding," no peer review). *This validates the User's Case 8 intuition.* It's about *practice*, not *content*.
      *   *Clovis First:* Dogma/Paradigm protection. Not pseudoscience because it operated within institutional norms, even if stubbornly.
      *   *Black Athena:* Overreach/Political scholarship. Engaged with critique (even if angrily).
      *   *Own Dissertation:* Source criticism. Engages with paleography/dendro. Open to falsification. *Not* pseudohistory.

  6.  **Addressing the New Cases:**
      *   *Mound Builders:* 19th-c. racism + refusal to accept Indigenous agency. Fits "Selective Skepticism" and "Ideological Immunity." Pseudohistory.
      *   *Velikovsky:* Classic pseudoscience. Physics violations, ignored critique.
      *   *Black Sea Deluge (Noah):* If presented as geology = Science (Ryan/Pitman). If presented as *proof of Bible* ignoring contradictory geology = Pseudohistory/Apologetics.
      *   *Kensington Runestone:* Forgery vs. Genuine debate. If proponents ignore linguistic anachronisms = Pseudohistory.

  7.  **Addressing the "Term of Abuse" Question:**
      *   Is it descriptive? Yes, if defined by *methodological vices* rather than *conclusion*.
      *   Case 8 (Packaging): This is a feature, not a bug. Epistemic status depends on the *community of practice* and *responsiveness to critique*, not just the proposition.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Collegial, rigorous, acknowledging the PhD level.
      *   *Structure:*
          1.  Philosophical Grounding (Laudan vs. Cluster).
          2.  The Proposed Principle (Cluster of Epistemic Vices).
          3.  Application to User's 11 Cases (Validating and correcting).
          4.  Application to New Cases.
          5.  The "Term of Abuse" & Case 8 analysis.
          6.  Advice for the Dissertation (Case 11).
      *   *Refining the Principle:* Let's call it the "Methodological Integrity Cluster." Focus on *how* errors are handled.
      *   *Refining Case 8:* Emphasize that "Science" is a social activity. The docu version abandons the social norms of science (peer review, responding to critique).
      *   *Refining Case 11:* Crucial for the user's anxiety. Distinguish "Revisionism" (normal) from "Pseudorevisionism" (immune to correction).

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I claim Laudan is "wrong"? *Correction:* Laudan is right that *definitions* fail, but wrong that the *project* is useless. Most contemporary philosophers of science use cluster concepts.
