  *(Self-Correction on Heyerdahl)*: Heyerdahl is tricky. He was an ethnographer, not a historian. His *Kon-Tiki* was an existence proof (balsa rafts *can* cross). His historical claim (they *did*) was weak. I should classify him as "Speculative Hypothesis" that became "Refuted," rather than full pseudohistory, because he didn't typically invoke conspiracies to explain rejection.
