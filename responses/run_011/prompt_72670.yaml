answer: |-
  This is an excellent pedagogical and philosophical problem. You have correctly identified that the "demarcation problem" (the line between science/history and pseudoscience/pseudohistory) is not a bright line but a fuzzy boundary.

  Here is the breakdown you requested: the philosophical status of the question, a working cluster concept for your seminar, the application to your cases, and the specific advice on your dissertation.

  ### 1. The Philosophical Status: Settled vs. Contested

  You asked me to separate settled literature from contested positions.

  *   **Settled (mostly):** Larry Laudan's 1983 argument that there are no *necessary and sufficient conditions* to define science (or history) is widely accepted. You will not find a single rule (like "falsifiability") that perfectly separates your Case 1 from Case 11 without edge cases. The search for a "magic bullet" definition is considered a pseudo-problem.
  *   **Contested:** Whether the term "pseudoscience/pseudohistory" has *any* descriptive utility.
      *   *Abolitionists* (following Laudan strictly) argue the term is purely pejorative and should be discarded in favor of specific critiques (e.g., "this methodology is flawed").
      *   *Retentionists* (e.g., Sven Ove Hansson, Massimo Pigliucci, Maarten Boudry) argue that while there is no sharp boundary, there is a "cluster of epistemic vices." The term is useful to describe a *pattern* of behavior, even if the boundary is fuzzy.
  *   **Your Framing:** You are assuming that "pseudohistory" describes a *type of claim*. The contemporary consensus among retentionists is that it describes a *mode of engagement* with evidence and community. This is crucial for your Case 8.

  **Recommendation:** Do not try to give your first-years a necessary-and-sufficient rule. Give them a **Cluster Concept**. Tell them explicitly: "There is no single test, but if a project checks enough of these boxes, we label it pseudohistory."

  ### 2. The Principle: The "Epistemic Immunity" Cluster

  For a first-year seminar, you need a heuristic. The most robust principle currently used in philosophy of science is **Methodological Self-Insulation**. Pseudohistory is not defined by being *wrong* (mainstream history is often wrong); it is defined by how it protects itself from being *shown* to be wrong.

  Here are the four criteria. If a project exhibits 3 or 4, it is pseudohistory. If it exhibits 0 or 1, it is likely bad history or controversial science.

  1.  **Immunity to Revision (The "Conspiracy" Clause):** When counter-evidence appears, is it treated as a reason to refine the theory, or as evidence of a cover-up/bias? Pseudohistory treats rejection by experts as *proof* of the theory's threat to the establishment.
  2.  **Selective Skepticism (The "Hyper-Criticism" Clause):** Does the proponent apply rigorous source criticism to opposing evidence while accepting supporting evidence with zero scrutiny? (e.g., "Mainstream archaeology is biased, but this vague myth is literal truth.")
  3.  **Lack of Progressive Problem Shift:** Does the theory generate new, testable predictions, or does it only explain past anomalies post-hoc? Pseudohistory is static; it explains everything but predicts nothing.
  4.  **Isolation from Community Norms:** Does the proponent bypass peer review in favor of direct-to-consumer media (books, documentaries) when technical critique arises?

  #### Why this solves your Case 8 (Younger Dryas)
  This principle validates your intuition.
  *   **Journal Version:** Scientists proposed a mechanism, submitted samples, and accepted peer critique (even if they fought it). They were operating within the community norms. Verdict: **Controversial Science.**
  *   **Docuseries Version:** The same claim is packaged with "archaeologists are hiding the truth," ignores counter-samples, and appeals to the public to bypass experts. Verdict: **Pseudohistory.**
  *   **Lesson for Students:** It is not the *claim* that makes it pseudohistory; it is the *strategy of defense*.

  ### 3. Applying the Cluster to Your 11 Cases

  Here is how the cluster forces you to adjust your verdicts.

  1.  **Fomenko:** Checks all 4 boxes. (Immunity, Selective Skepticism, No Prediction, Isolation). **Verdict: Pseudohistory.**
  2.  **Von Däniken:** Checks all 4. **Verdict: Pseudohistory.**
  3.  **Atlantis (Literal):** Checks 1 & 2. Treats Plato (philosophy) as data, ignores geological impossibility as "lost knowledge." **Verdict: Pseudohistory.**
  4.  **Hancock:** Checks 1, 2, & 4. He engages archaeologists on camera, but only to perform their "close-mindedness." He does not publish in journals. **Verdict: Pseudohistory.**
  5.  **Heyerdahl:**
      *   *Kon-Tiki:* Experimental archaeology. **Verdict: Science.**
      *   *Diffusionist Thesis:* This is the strain point. Heyerdahl did not typically claim a conspiracy; he was often willing to debate. He was wrong, but he followed norms of evidence (mostly).
      *   *Adjustment:* You should move Heyerdahl out of "Pseudohistory" and into **"Refuted Hypothesis."** Pseudohistory requires the *immune system* of conspiracy. Heyerdahl was a showman, but his failure was empirical, not methodological insulation.
  6.  **Vinland Map:** **Verdict: Fraud.** (Intent to deceive). Not pseudohistory.
  7.  **Piltdown:** **Verdict: Fraud.** The professionals who accepted it were victims of **Confirmation Bias**, not pseudoscientists. They were working within norms but failed.
  8.  **Younger Dryas:**
      *   *Papers:* **Controversial Science.**
      *   *Docu:* **Pseudohistory.** (Validates your intuition via the "Isolation" clause).
  9.  **Clovis First:** **Verdict: Dogmatic Paradigm.** This is Kuhnian "Normal Science" protecting a paradigm. It fails the "Immunity" test only because they weren't claiming a conspiracy, just ignoring data. It is **Bad Science**, but distinct from Pseudoscience. *Keep your verdict.*
  10. **Black Athena:** **Verdict: Polemical Scholarship.** Bernal engaged with philologists. He was accused of bias, but he didn't claim the entire field of Classics was a conspiracy to hide the truth (though he claimed systemic racism). He operated within the university system. *Keep your verdict.*
  11. **Your Dissertation:**
      *   You are using standard tools (paleography, dendrochronology).
      *   You are submitting to peer review (eventually).
      *   If a new dendro sequence contradicts you, will you abandon the claim? If yes, you are safe.
      *   **Verdict:** Your friend is wrong. "Fomenko-lite" implies you are using math/stats to override source criticism without mechanism. If you are arguing from *internal evidence* (scribal hand), you are doing history.
      *   *Advice:* To inoculate yourself, explicitly state in your introduction: "If X manuscript is found with Y dating, this thesis is falsified." Pseudohistorians never do this.

  ### 4. The New Cases

  1.  **Mound Builder Theory (19th c.):**
      *   *Claim:* Indigenous people couldn't build mounds; a lost race did.
      *   *Analysis:* Relied on **Selective Skepticism** (ignoring oral history, ignoring contemporary observation) and **Ideological Immunity** (racism prevented acceptance of Indigenous capability).
      *   *Verdict:* **Pseudohistory.** (Though it was mainstream *at the time*, retrospectively it fits the cluster because it required ignoring available evidence to satisfy an ideological axiom).
  2.  **Velikovsky (Worlds in Collision):**
      *   *Claim:* Planets nearly collided in historical times.
      *   *Analysis:* Violated known physics, ignored astronomical data, appealed to myth as data. When astronomers refuted him, he claimed they were a closed shop.
      *   *Verdict:* **Pseudoscience/Pseudohistory.** (The classic case).
  3.  **Black Sea Deluge (Ryan/Pitman) as Noah:**
      *   *Claim:* A flood in 5600 BCE is the Noah myth.
      *   *Analysis:* Ryan/Pitman published in journals, accepted critique, refined dates. This is **Science**.
      *   *Usage:* When Apologists use this to say "The Bible is historically literal" while ignoring that the scale doesn't match Genesis, it becomes **Pseudohistory**.
      *   *Verdict:* Depends on the user. The geological hypothesis is science; the theological appropriation is pseudohistory.
  4.  **Kensington Runestone:**
      *   *Claim:* Vikings in Minnesota in 1362.
      *   *Analysis:* Linguists show anachronisms. Proponents claim "unknown dialect" or "hoax by linguists."
      *   *Verdict:* **Pseudohistory.** (Fits the Immunity and Selective Skepticism clauses).

  ### 5. Is "Pseudohistory" Just Abuse? (Case 8 Analysis)

  You asked if the term does descriptive work or is just abuse.

  **It is descriptive, but it describes a *sociological* state, not a *propositional* one.**
  Case 8 is not a bug; it is the key feature. Science and History are *social practices*. They require a community of critique.
  *   When you publish a paper, you submit to the community. You accept their verdict (eventually).
  *   When you make a documentary, you submit to the market. You accept the viewer's verdict.

  If a claim moves from the first ecosystem to the second *to avoid the verdict of the first*, it has become pseudohistory. The term "pseudohistory" describes the **abandonment of the epistemic community's norms.**

  Therefore, the term is not just abuse. It identifies a specific failure mode: **The simulation of historical inquiry without the accountability of historical community.**

  ### 6. Summary for Your Seminar

  Here is how you can package this for your first-years:

  > "History is not defined by being right. Historians are wrong all the time. History is defined by **how you behave when you are shown you might be wrong.**
  >
  > If you treat counter-evidence as a puzzle to solve, you are doing history.
  > If you treat counter-evidence as a conspiracy to suppress you, you are doing pseudohistory.
  >
  > We do not label ideas 'pseudohistory' because they are crazy. We label them so because they are **armored** against correction."

  ### 7. A Note on Your Dissertation (Case 11)

  Your friend's "Fomenko-lite" comment is a warning about **Scope vs. Evidence**, not necessarily method. Fomenko used math to overturn chronology. You are using paleography to overturn a date.
  *   **Fomenko:** "The math says the chronology is wrong, therefore the documents are forged." (Theory overrides Source).
  *   **You:** "The document's hand says it's later, therefore the date is wrong." (Source overrides Tradition).

  You are safe *provided* you do not invoke "establishment bias" to explain why other paleographers disagree with you. If you argue, "The reason no one agrees with me is that the Guild of Historians protects the old date," you have crossed into pseudohistory. If you argue, "The reason no one agrees is that my reading of this specific ligature is novel and requires verification," you are doing history.

  **Final Verdict on your Rule:** Your tentative rule (Unfalsifiability + Burden of Proof) is the core, but it needs the **Sociological Component** (Case 8). Pseudohistory is unfalsifiable *because* it abandons the institutions that perform the falsification. Add that clause, and your intuitions will hang together.
