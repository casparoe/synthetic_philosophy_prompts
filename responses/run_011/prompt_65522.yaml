      *   *Bias Check:* Pop gen tends to be instrumentalist ("is the model useful?"). Philosophy asks ("is it true?"). I need to flag that my translation favors utility over truth.

  8.  **Formulating the Verdict:**
      *   Does the failure to translate mean the debate is empty? Not necessarily. It means the debate is about *semantics and social causality*, not *biological structure*.
      *   My vocabulary is good for structure, bad for meaning.
      *   Confidence: High on the APC math, Medium on the philosophical interpretation of "Natural Kinds" (since I'm a scientist, not a philosopher), Low on the Strauss-Howe cycle (it's fringe).

  9.  **Refining the Tone:**
      *   Needs to be peer-to-peer. Technical but not condescending.
