answer: |-
  ### Evaluation of Moves 1–8

  **1. Ines (Limb Pattern):** **Partially Right.**
  Consistent anatomical selection is a strong marker of ritual, but claiming it is definitive without addressing the small sample size is premature.

  **2. Ines (Beads & Tooth):** **Partially Right.**
  The human tooth is a significant anomaly that resists mundane explanation, but bead clusters can easily result from a single broken necklace or container decay.

  **3. Ines (Pots):** **Clearly Wrong.**
  Intact vessels tipped on their sides are a classic signature of roof collapse onto a soft substrate, not evidence of deliberate placement.

  **4. Ines (Rebuild/Footprint):** **Clearly Wrong.**
  Reusing foundations is standard economic behavior, and rotating the new structure actively suggests a break in continuity rather than commemorative memory.

  **5. Tomas (Limbs/Butchery):** **Right.**
  A sample size of twenty sideable elements is statistically fragile, and handedness in butchery is a documented source of asymmetry in bone assemblages.

  **6. Tomas (Equifinality):** **Right.**
  Invoking multiple independent mundane processes to explain a unique co-occurrence risks special pleading, but demanding distinct formation pathways is methodologically sound.

  **7. Tomas (Pots):** **Clearly Right.**
  Taphonomic studies consistently show that roof collapse often tips vessels without shattering them, particularly into soft underlying ash.

  **8. Tomas (Controls/Context):** **Clearly Right.**
  Ritual claims require pattern recognition across a site context, and the structural rotation actively undermines the argument for commemorative continuity.

  ### Who is Ahead Overall?

  **Tomas is ahead.**
  Ines has identified a genuinely weird assemblage (specifically the tooth), but she is building a "ritual" interpretation on top of unverified formation processes. Tomas is winning on methodological rigor: he correctly identifies that the pot position is consistent with collapse, the footprint reuse is economic, and the bone statistics are too thin to carry the weight of her argument. Ines is interpreting the *meaning* of the objects before establishing the *history* of the deposit.

  ### The Unfalsifiability Charge

  Ines's charge that Tomas's position is unfalsifiable is a **cheap shot**, though it touches on a real tension in archaeology.
  Tomas is not saying ritual *cannot* be inferred; he is saying it cannot be inferred *yet* because the null hypothesis (taphonomy) hasn't been ruled out. Ines is conflating "methodological caution" with "theoretical denialism." If she found this exact deposit in a sealed pit with no roof collapse possible, Tomas would likely concede the ritual argument. His barrier is not that belief is invisible, but that *this specific context* is ambiguous. However, she is right to be frustrated if he intends to demand impossible controls (like a perfect modern analogue) before accepting any inference, but based on your summary, he is asking for standard comparative data (other houses, pits), which is reasonable.

  ### The Missing Reframe

  Neither of them is engaging with the **matrix of the ash itself**, which is why the Site Director's comment about flotation wasn't a joke.
  The entire argument rests on whether the ash is *in-situ* (from the house burning) or *deposited* (brought in from elsewhere).
  *   **If Flotation shows hearth debris** (seeds, local weeds, fine charcoal dust): It supports Tomas. The ash is floor sweepings or destruction debris, and the tooth/bones/beads were swept up with it or fell into it.
  *   **If Flotation shows clean fuel ash** (specific wood types, no seeds, homogeneous): It supports Ines. Clean ash doesn't accumulate from living; it is brought in deliberately.

  **The Reframe:** The debate shouldn't be "Ritual vs. Accident." It should be **"Primary Deposition vs. Secondary Fill."**
  If the ash was brought in (Secondary), Ines wins: someone carried ash, bones, beads, and a tooth into a house and then burned it. If the ash is from the house burning (Primary), Tomas wins: the house burned, sweeping up a tooth that was already in the floor plaster, tipping the pots, and scattering the beads. The flotation results determine the physics of the event, which dictates the sociology. Currently, they are arguing about the *symbols* without agreeing on the *physics*.
