answer: |-
  Good evening, everyone. Thank you for coming. It is good to see so many faces together. I want to welcome our VPs who flew in for this. And I want to thank Stefan, who is standing right there, for helping me build this team.

  We are going to the bar after this. But before we drink, I want to talk about something strange.

  We have been in this office for less than a year. We are only forty-five people. Yet, within the first ten days, we invented rules. Nobody wrote them down. Nobody voted on them. But we all know them.

  I am talking about the dishwasher rota. I am talking about the good standing desks.

  I saw something happen recently. A new starter did not follow the unwritten dishwasher rule. There was no meeting about this. But people were genuinely furious. Quietly furious. Why? We manufactured an obligation in ten days flat. We did not choose to make this rule, but we chose to enforce it.

  My brain is an engineer's brain. When I see a problem, I try to classify it. I started thinking about these rules. I decided there are two types.

  Type one: Load-bearing conventions. These are rules where the practice does actual work. If you break them, someone gets hurt. If you cut in line, someone waits longer. In the US, if you do not tip, a server loses income. That is load-bearing. The rule holds weight.

  Type two: Cosmetic conventions. These are rules where breaking them does not hurt anyone physically or financially. It only sends a signal. It says something about you to the people watching. If you jaywalk on an empty street at 2 AM, no car hits you. If you tip twenty-five percent in Berlin, the server gets more money, not less. These seem cosmetic. They are about style, not safety.

  My theory was simple. I thought breaking a load-bearing rule is wrong. I thought breaking a cosmetic rule is okay, especially if nobody is watching. If there is no audience, there is no signal. So, no harm.

  Then we had the team dinner two weeks ago. You might know the story. An American colleague tipped heavily. He thought he was being generous. A German colleague told him it made the server uncomfortable. It broke the local norm.

  The American thought: "I am helping." The German thought: "You are disrupting." Both were logical. But they were using different maps. One map said tipping is income. The other map said tipping is social harmony. Neither map was wrong. They were just different.

  Then there was the crosswalk.

  I was walking home at 2 AM. The street was empty. The light was red. I walked across. Stefan was behind me. He stopped.

  I asked him: "Who got hurt?" There were no cars. There were no witnesses. By my logic, this was a cosmetic rule. Breaking it was fine.

  Stefan said something that stuck with me. He said it is not about the cars. He said it is about who you are when nobody is checking. He said a person who only follows a rule when there is an audience does not actually follow the rule. They are just performing.

  I want to admit something. I thought I was right about the crosswalk. I thought Stefan was being too rigid. But I do not have a comeback for what he said. He might be right. Maybe the "cosmetic" rules are not about the action. Maybe they are about the person.

  This puts me in a strange position. I am the site lead. I have the hiring budget. I set the culture. But I am also a guest in this city. I am an American in Berlin.

  Sometimes "the boss sets the culture" and "the guest follows local customs" pull in opposite directions. I cannot solve that tension today. I do not have the answer for which rules are load-bearing and which are cosmetic. I do not know if the dishwasher rule is about hygiene or about power. I do not know if the crosswalk is about safety or about virtue.

  So, I am not going to give you a new rule. I do not want to create another unwritten obligation that we enforce angrily in ten days.

  Instead, I have one request for Monday.

  When you see someone break a convention, pause. Do not get furious yet. Ask yourself one question: "Who gets hurt here?"

  If someone is getting hurt, tell me. We will fix it. That is load-bearing.

  If nobody is getting hurt, but you still feel upset, assume it is a signal. Assume you are reading something about their character, or their background, that does not match yours. Talk to them. Do not judge them.

  We are a mix of cultures. We are a mix of philosophies. We will disagree on what matters. That is okay. But let us not be furious about things we did not agree to.

  Let us be curious instead.

  Thank you. Let's go have a beer.

  ***

  **Assessment of your distinction:**
  Your "load-bearing vs. cosmetic" distinction is real—it roughly maps to the philosophical difference between *consequentialism* (did harm occur?) and *signaling theory* (what does this action communicate?)—but calling them "cosmetic" underestimates how much social trust relies on shared signals. Stefan's point lands because violating a "cosmetic" norm isn't harmless; it costs social capital, even if no physical harm occurs. You haven't named nothing, but you've identified the *effect* of the rule, not the *source* of its authority.
