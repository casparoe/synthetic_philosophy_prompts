answer: |-
  # Session Plan: The Findability Game (Fitch's Paradox)

  **Class Size:** 16 Students
  **Time:** 75 Minutes
  **Materials:** Index cards (pre-printed), Whiteboard + Markers, 40 Poker Chips (or paper slips) for "Verification Tokens" (VTs).

  ## 1. Team Structure & Roles
  Divide the class into **4 Teams of 4**.
  Each team assigns three roles (rotate if needed):
  1.  **Scribe:** Writes on the team sheet/board.
  2.  **Speaker:** Presents arguments/auction bids.
  3.  **Devil's Advocate:** Tasked specifically with finding loopholes in the rules.

  **Currency:** **Verification Tokens (VTs).**
  *   Teams start with 5 VTs each.
  *   VTs are used for Auction bids.
  *   Winning team (most VTs remaining at end) gets a trivial prize (e.g., choice of seminar snack next week).

  ## 2. Printable Materials List

  **A. The Card Deck (14 Cards)**
  *Print on index cards. One set per team, or one large set projected/held by TA.*
  1.  "2 + 2 = 4"
  2.  "The moon is made of green cheese"
  3.  "There is an even number of stars in the Milky Way"
  4.  "Caesar sneezed exactly once on the morning he crossed the Rubicon"
  5.  "This room contains exactly 16 students"
  6.  "The exact number of dust motes in this room right now is odd"
  7.  "Some star that burned out before humans existed had exactly four planets"
  8.  "I am currently thinking of a number between 1 and 10" (TA says this about themselves)
  9.  "It rained in London on Jan 1, 10,000 BC"
  10. "There is a truth that no human being currently knows"
  11. "Water is H2O"
  12. "The TA wore blue socks today"
  13. "A specific electron passed through the left slit in experiment #402 yesterday"
  14. "This sentence is false"

  **B. The Ledger Sheet (One per Team)**
  *Columns: Rule Name | Status (Active/Inactive) | Cost to Drop*
  *Pre-printed Rules:*
  1.  **The Split:** If you know "A and B", you know "A" and you know "B".
  2.  **The Mirror:** If you know "A", then "A" is true.
  3.  **The Spotlight:** If "A" is true, it is possible to find out "A" (The Findable Tray Rule).

  **C. Challenge Cards (2 per Team)**
  *Text:* "I challenge the scope of 'Findable'. Does this mean *us*, *humans*, or *any possible mind*?"

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide teams. Distribute VTs (5 each). Explain goal: "Maximize VTs by keeping rules consistent." |
  | **05-20** | **Sorting** | Teams sort cards into **TRUE**, **FALSE**, **NEITHER**. **CRITICAL:** Every card marked TRUE must be placed in the **FINDABLE TRAY** (a designated box/envelope). |
  | **20-30** | **Proposal** | Teams must draft one sentence they agree is **TRUE** but **UNKNOWN** to the class. Write it on the board. |
  | **30-45** | **Derivation** | TA facilitates board work. Students apply Ledger Rules to the Proposal to find a contradiction. |
  | **45-60** | **Auction** | Contradiction found. Teams bid VTs to "drop" a Ledger Rule to save consistency. |
  | **60-70** | **Rescue** | (If time) Try to restrict the Findable Rule to "Cartesian" sentences. Attack/Defend. |
  | **70-75** | **Reveal** | TA names "Fitch's Paradox," maps game moves to formal logic, assigns reading. |

  ## 4. Facilitator Script & Ledger Rules

  **Opening (00:00):**
  "Welcome. Today is a workshop, not a lecture. You are epistemic auditors. Your goal is to keep the books balanced. You have Verification Tokens. You will lose them if your system crashes. We operate under three Ledger Rules. These are not philosophical claims; they are bookkeeping standards for this seminar."

  **The Ledger Rules (Read exactly as written on sheet):**
  1.  **The Split:** "If the ledger records that you know a conjunction ('A and B'), the ledger must record that you know 'A' and you know 'B'."
  2.  **The Mirror:** "If the ledger records that you know 'A', the ledger must confirm that 'A' is the case."
  3.  **The Spotlight:** "If a statement is marked TRUE, it must be placed in the FINDABLE TRAY. Being in the Tray means it is *possible* for the knowledge to be recorded."

  **The Sorting Phase (05:00):**
  "Sort your cards. If you mark it TRUE, it goes in the Tray. If you mark it FALSE or NEITHER, it goes in the discard. You have 10 minutes. Watch out for cards that make you hesitate to use a Token."
  *(TA circulates. Watch for Card 10: "There is a truth that no human being currently knows." If they mark it True, it goes in the Tray. This is a latent paradox. Do not point this out yet.)*

  **The Proposal Phase (20:00):**
  "Look at your Findable Tray. We assume everything in there *could* be known. Now, I want each team to propose one sentence to the Main Board. Criteria: You must all agree it is **TRUE**. You must all agree **NO ONE IN THIS ROOM KNOWS IT YET**."
  *(Expected outputs: "The exact number of hairs on the TA's head," "The 10,000 BC rain," etc. Pick the strongest one. Let's assume they pick: **P = 'There are X hairs on the TA's head'** where X is the actual number.)*
  "Now, write this on the board: **'P is true, and no one in this room knows P.'**"
  *(This is the Fitch Conjunction: $p \land \neg Kp$)*.

  **The Derivation (30:00):**
  "Apply the Ledger Rules to that sentence on the board. Assume, for the sake of the Spotlight Rule, that we *do* find it out. We move it from 'Possible' to 'Known'. Scribe, come to the board. Walk me through what happens to the sentence 'P and No One Knows P' if we know it."
  *(Guide them:)*
  1.  "We know (P and No One Knows P)."
  2.  "Apply **The Split**." -> "We know P" AND "We know (No One Knows P)."
  3.  "Apply **The Mirror** to the second part." -> "It is true that (No One Knows P)."
  4.  "But look at the first part." -> "We know P."
  5.  "If We know P, is it true that No One Knows P?" -> **NO.**
  6.  "Contradiction."

  **Handling Stalls:**
  *   *If they stall on Step 2:* "Check The Split rule. Does knowing a compound fact imply knowing the parts?"
  *   *If they stall on Step 5:* "Check The Mirror rule. If you know something, does it have to be true?"
  *   *If they say "But we don't actually know it":* "The Spotlight Rule says because it's True, it's *Findable*. Pretend we found it. Does the ledger break?"

  **The "Someone Else" Objection (Challenge Cards):**
  *If a student plays a Challenge Card:* "Does 'Findable' mean *us* or *any mind*?"
  *Your Response:* "Good challenge. Rewrite the sentence on the board: 'P is true, and **no mind anywhere** knows P.' Now run the derivation again. If *God* or *an Alien* knows it, apply The Split. Does God know P? Yes. Does God know 'No mind knows P'? Yes. So God knows 'No mind knows P'. But God is a mind. So God knows P. Contradiction holds for any knower."

  **The Auction (45:00):**
  "The ledger has crashed. We have a contradiction. To continue the game, we must deactivate one Ledger Rule. This costs VTs.
  *   **Bid Open:** Start at 1 VT.
  *   **Rule:** The Split.
  *   **Rule:** The Mirror.
  *   **Rule:** The Spotlight.
  Highest bid removes the rule for the rest of the term. Justify your bid."

  *(Expected Bidding: Teams will hoard VTs. 'The Mirror' is factivity (hard to drop). 'The Split' is distribution (technical to drop). 'The Spotlight' is Knowability (easiest to drop). Expect 'The Spotlight' to be sold cheap.)*

  **The Rescue (60:00 - Time Permitting):**
  "Okay, we dropped The Spotlight. We admit not all truths are findable. Can we save it by restricting it? Proposal: The Spotlight only applies to 'Cartesian' sentences (sentences where knowing them isn't self-defeating)."
  *Task:* Team 1 proposes a restriction. Team 2 tries to build a new 'P' that fits the restriction but still breaks the ledger.
  *(Hint for TA: If they say 'Only simple facts', point out 'P & ~KP' is a simple fact logically, but impossible to know.)*

  **The Reveal (70:00):**
  "Stop. You have just reconstructed Fitch's Paradox of Knowability.
  *   **The Spotlight** = The Knowability Principle ($\forall p (p \to \Diamond Kp)$).
  *   **The Proposal** = Non-Omniscience ($\exists p (p \land \neg Kp)$).
  *   **The Split** = Distribution of Knowledge over Conjunction ($K(A \land B) \to KA \land KB$).
  *   **The Mirror** = Factivity of Knowledge ($KA \to A$).
  *   **The Crash** = Proof that if all truths are knowable, all truths are known.
  *   **The Auction** = The philosophical responses (Anti-Realism, Non-Cartesian logic, etc.)."

  ## 5. Debrief Questions (Map Game to Philosophy)

  1.  **On The Spotlight:** "When you bid to drop The Spotlight, what philosophical position did you buy? (Answer: Semantic Anti-Realism / Denial of Bivalence)."
  2.  **On The Split:** "Did anyone consider dropping The Split? What does it mean to know a conjunction without knowing the parts? (Answer: Holism, or denying closure)."
  3.  **On The Mirror:** "Dropping The Mirror means knowing falsehoods. Who was willing to pay for that? (Answer: No one. Factivity is too core)."
  4.  **On The Challenge:** "Did switching from 'Us' to 'Any Mind' fix the problem? Why did the contradiction survive?"

  ## 6. Predictable Failure Modes & Fixes

  **1. Immediate Rejection of the Founding Stipulation (The Spotlight)**
  *   *Scenario:* In the Sorting Phase, a student says, "Card 4 (Caesar) is true, but I'm not putting it in the Findable Tray. It's lost to time."
  *   *Fix:* "You are allowed to mark it 'NEITHER'. But if you mark it 'TRUE', the game rules require the Tray. If you mark most historical facts 'NEITHER', you are playing as an Anti-Realist. For this round, I require you to play as Scientific Realists. Assume evidence exists in principle."

  **2. The "Ideal Observer" Dodge**
  *   *Scenario:* "It's findable by an omniscient God, so the rule holds, but we just don't know."
  *   *Fix:* Use the **Challenge Card** script above. Force the sentence to include "No mind knows." If God knows it, "No mind knows" becomes false. The contradiction is in the *content* of the sentence, not our limitations.

  **3. Refusal to Accept the Proposal**
  *   *Scenario:* Students refuse to write "P and No One Knows P" because they feel it's "cheating."
  *   *Fix:* "This is a stress test. We are testing the Ledger, not reality. Input the data. If the Ledger crashes, the Ledger is flawed, not the data."

  **4. Auction Stalling**
  *   *Scenario:* No one wants to spend VTs.
  *   *Fix:* "If no rule is dropped by [Time], the seminar grade for the day is zero for everyone. Incentivize the sacrifice."

  ## 7. Honest Limitation Paragraph (For Your Preparation)

  *Do not read this to students. This is for you.*
  The game cannot reproduce the **modal scope** of the original proof. In the game, "Findable" is treated as a physical tray (a static property), whereas Fitch's proof relies on the interaction between the truth operator and the possibility operator ($\Diamond K$). Specifically, the game glosses over the step where we move from "It is possible to know" to "Assume we know" (Existential Instantiation within a modal context). Students might think the paradox arises because we *actually* found the truth, rather than because the *possibility* of finding it entails the *actuality* of knowing it. You must clarify in the Reveal that the contradiction arises from the *claim of possibility* itself, not the physical act of counting hairs. Additionally, the game treats "Knowledge" as a binary state, missing the intuitionistic logic nuances (Dummett) where the law of excluded middle is the actual casualty, not omniscience.

  ## 8. Card Trap Notes (For TA Eyes Only)

  *   **Card 4 (Caesar) & Card 7 (Burned Star):** These are the primary traps. They are likely True (Realism), but intuitively Unfindable. If students put them in the **Findable Tray**, they have accepted the Knowability Principle for hard cases. If they refuse, they have rejected Knowability before the paradox even starts. *Strategy:* If they refuse, press them: "Is it *physically* impossible, or just hard? If physics allows a time machine, is it findable?" Force them to commit to "In Principle."
  *   **Card 10 (Truth no human knows):** If they mark this TRUE and put it in the Tray, they have accidentally created the Fitch sentence in Phase 1. *Strategy:* If this happens, acknowledge it. "Team 2 has accidentally generated the paradox in the warm-up. Let's see if the Ledger holds."
  *   **Card 14 (Liar Paradox):** This is a distractor. It should go to "NEITHER." If they put it in TRUE, the system breaks for reasons unrelated to Fitch. *Strategy:* Steer them away. "That's a semantic paradox, different filing cabinet."

