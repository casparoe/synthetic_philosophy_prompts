      *   *Phase 3 (The Ledger):* These are the logical rules. They need to sound boring/administrative.
      *   *Phase 4 (The Auction):* When the contradiction hits, they must pay to remove a rule.
      *   *Phase 5 (Rescue):* Restricting the domain (Cartesian sentences).

  4.  **Developing the Content:**

      *   *Cards:* Need a mix of obvious truths, obvious falsehoods, and "Fitchian" traps (contingent unknowns).
