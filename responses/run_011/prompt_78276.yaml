      *   *Script:* Exact wording for rules.
      *   *Facilitator Script:* Board work, stalling.
      *   *Auction Rules:* How to bid/drop rules.
      *   *Debrief:* Map game to proof.
      *   *Failure Modes:* "Someone else," Rejection of KP.
      *   *Limitation:* What the game misses (Modal logic nuance, intuitionistic logic).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 75 minutes enough for all 5 phases?
      *   *Fix:* Phase 5 (Restriction) might need to be cut if Phase 4 (Auction) runs long. I will mark it as "Time Permitting" but provide the materials.
      *   *Critique:* The "Findable Tray" mechanic needs to be clear. If a card is True, it *must* go to the tray.
