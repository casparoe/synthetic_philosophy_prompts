      *   *Critique:* The "Someone Else" objection. If a student says "An angel could know it," the TA needs to say "Okay, write 'Angel' on the board. If Angel knows (p & ~Kp), does Angel know p? Yes. Does Angel know ~Kp? Yes. So Angel knows no one knows p. But Angel knows p. So someone knows p. Contradiction." I need to script this.
      *   *Critique:* The prompt asks for "integer point/token scheme." I'll use "Verification Tokens" (VTs).
      *   *Critique:* "Honest paragraph on limitation." The game treats knowledge as a static state. It misses the temporal/dynamic aspect and the specific modal operator nuances (necessitation).

  8.  **Final Polish:** Check tone. Keep it authoritative but practical. Ensure all constraints from the prompt are met (no reading list, no citations).

