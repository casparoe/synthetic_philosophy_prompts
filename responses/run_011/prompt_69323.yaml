answer: |-
  # JOINT STATEMENT ON THE NATURE OF SHARED INTENTION
  **Signed:** [Proponent of Reductive Individualism] & [Proponent of Plural Subject Theory]
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on the Metaphysics and Normativity of Joint Action

  ## I. AGREED PHENOMENA AND SCOPE LIMITS

  We, the undersigned, acknowledge that while our theoretical architectures differ, we are accountable to the same set of phenomenological and normative data. Any adequate theory of shared intention must explain the following features of ordinary joint activity:

  1.  **Stability Under Perturbation:** Joint activity persists through minor changes in circumstance or temporary lapses in attention without requiring re-negotiation.
  2.  **Defeasible Expectations:** Participants hold non-absolute expectations of one another's contribution (e.g., I expect you to lift your end, unless you are injured).
  3.  **Standing to Rebuke:** A participant who unilaterally abandons the activity without notice is liable to normative criticism from the partner(s), distinct from mere disappointment.
  4.  **Diachronic Continuity:** Groups can maintain intentional states through total membership turnover (e.g., a Supreme Court or a football team) provided appropriate procedural transitions occur.
  5.  **Distinctness from Coercion:** Joint action is phenomenologically distinct from coerced coordination or purely coincidental parallel behavior.

  **Explicit Exclusions (What This Dispute Is Not About):**
  *   **Group Minds:** Neither side claims that groups possess a literal, biological consciousness or a "super-brain" distinct from the members.
  *   **Moral Obligation:** We distinguish the *normative standing* to rebuke (the right to demand compliance) from the *moral weight* of the obligation (whether it is morally permissible to hold someone to the commitment).
  *   **Linguistic Usage:** We are not merely debating whether the English phrase "we intend" is grammatically reducible to "I intend." We are debating the underlying structure of the social reality that phrase denotes.

  ***

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates the specific points of divergence. Each row is phrased to allow signature by both parties as an accurate characterization of the disagreement.

  | # | Point of Divergence | Individualist Characterization (Side A) | Plural Subject Characterization (Side B) | Status (Substantive/Verbal) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Ontological Status of the "We"** | The "we" is a heuristic shorthand for a complex web of interlocking *individual* intentional states. | The "we" denotes a *sui generis* entity (a plural subject) constituted by joint commitment, irreducible to individual states. | **Mixed.** (Verbal regarding metaphor; Substantive regarding normative grounding). |
  | **2** | **Source of Normative Binding** | Obligations arise derivatively from principles of rationality, consistency, and reliance/expectation generated by individual intentions. | Obligations arise intrinsically from the act of joint commitment itself; the commitment *creates* the obligation. | **Substantive.** |
  | **3** | **Condition of Existence** | Shared intention exists only if individual subplans *mesh* (are co-realizable) and each intends the joint action *because* of the other's intention. | Shared intention exists once mutual expressions of readiness are common knowledge, even if subplans currently clash or motivations differ. | **Substantive.** |
  | **4** | **Rescission Conditions** | An individual can unilaterally withdraw their intention (though they may owe compensation for reliance), dissolving the shared state. | The joint commitment can only be rescinded *jointly*; unilateral withdrawal is a violation, not a dissolution. | **Substantive.** |

  **Note on Dissolution:** We acknowledge that Row 1 contains a verbal component. If Side A admits the "web of individual attitudes" functions *as if* it were a single agent for normative purposes, and Side B admits the "plural subject" has no existence over and above the committed individuals, the metaphysical gap narrows. However, this does not resolve Rows 2–4, which concern the *direction of explanation* regarding norms and conditions of existence.

  ***

  ## III. THE CRUXES: TEST CASES AND PREDICTIONS

  We identify the following sub-questions as decisive. Resolution of these empirical or intuitional points would force theoretical revision on at least one side.

  ### Crux 1: The "Non-Meshing Solo-Ready" Renovation Case
  **The Case:** Alice and Bob exchange mutual assurances: "I am ready to renovate this house with you." They deliberate as a unit ("What should *we* do?"). However, it is discovered that Alice plans to install modern fixtures while Bob plans to restore vintage fixtures (demonstrably non-meshing subplans). Furthermore, both privately admit: "If the other quits, I will cheerfully finish the renovation solo."
  **Relevance:** This isolates *mutual assurance* from *subplan meshing* and *interdependence*.

  | Theory | Verdict on "Shared Intention" | Verdict on "Standing to Rebuke" (if one quits) |
  | :--- | :--- | :--- |
  | **Individualist** | **No Shared Intention.** Fails the "meshing subplans" constraint and the "interdependence" constraint (since both are willing to go solo). | **Weak/None.** Rebuke is limited to reliance damages (e.g., cost of materials bought), not violation of a joint commitment. |
  | **Pluralist** | **Shared Intention Exists.** Formed via mutual expression of readiness. The clash makes the intention *irrational* or *impossible*, but not non-existent. | **Strong.** Unilateral quitting violates the joint commitment. The willingness to go solo is irrelevant to the binding nature of the "We." |

  **Analysis of Divergent Verdicts:**
  *   **Do theories diverge?** Yes. The Individualist denies the phenomenon exists; the Pluralist affirms it exists but is flawed.
  *   **Can data be factored?** We agree the data *could* be factored into an **Assurance Component** (I promised I'd be there) and a **Meshing Component** (Our plans fit).
      *   *Individualist Prediction:* Folk intuitions track the **Meshing Component**. If plans don't mesh, folk will say "They never really intended to do it *together*," treating the assurance as a mere promise of individual aid.
      *   *Pluralist Prediction:* Folk intuitions track the **Assurance Component**. If assurances were exchanged, folk will say "They had a deal," treating the plan clash as a practical error within an existing joint commitment, not a negation of the commitment.

  ### Crux 2: The "Unilateral Exit with Compensation" Case
  **The Case:** Two musicians agree to play a duet. Mid-rehearsal, Musician A says, "I am leaving to play a solo gig. Here is $500 to cover your wasted time." Musician B accepts the money but says, "You had no right to leave."
  **Relevance:** Tests whether obligation is *priceable* (Individualist reliance) or *inalienable* (Pluralist commitment).

  | Theory | Prediction on B's Complaint |
  | :--- | :--- |
  | **Individualist** | B's complaint is irrational if fully compensated. The obligation was to prevent loss/reliance; if loss is covered, the normative bond is severed. |
  | **Pluralist** | B's complaint remains valid. Money cannot buy out a joint commitment; only joint rescission can end the normative bond. |

  ### Crux 3: The "Ignorant Partner" Case
  **The Case:** A team is working on a project. Member A intends "We will win." Member B intends "We will win." A believes B intends to win. B *does not know* A intends to win (B thinks A is coerced), but B intends to win anyway.
  **Relevance:** Tests the *Mutual Knowledge* requirement.

  | Theory | Prediction on Shared Intention |
  | :--- | :--- |
  | **Individualist** | **None.** Shared intention requires recursive mutual knowledge ("I know that you know..."). Without it, it is merely coincidental parallel action. |
  | **Pluralist** | **Possible.** If there was a prior joint commitment, the specific current mental state of knowledge is less critical than the standing commitment. However, strict Gilbertian theory usually requires common knowledge of the *readiness*. We stipulate: If the *readiness* was openly expressed but B forgot A's response, does the commitment hold? **Pluralist says Yes** (commitment persists until rescinded); **Individualist says No** (web of attitudes is broken). |

  ***

  ## IV. COMMITMENT TO OUTCOME

  We agree that if empirical study of folk intuitions regarding the **Renovation Case (Crux 1)** demonstrates that ordinary speakers attribute a *valid standing to rebuke* despite known non-meshing subplans and solo-readiness, the **Individualist** must expand their account of "intention" to include commitment-based norms that exceed reliance.

  Conversely, if folk intuitions track the impossibility of the plan and deny the "togetherness" of the intention in the Renovation Case, the **Pluralist** must acknowledge that joint commitment is constrained by rationality conditions (meshing) that are constitutive, not merely regulative.

  **Signed:**

  _________________________
  [Proponent of Reductive Individualism]

  _________________________
  [Proponent of Plural Subject Theory]
