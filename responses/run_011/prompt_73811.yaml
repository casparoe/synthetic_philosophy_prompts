answer: |-
  It is completely understandable that you are torn between the intuitive pull of that magazine summary and your friend's dismissive reaction, because Dialectic of Enlightenment is famously one of those books that people either find profoundly illuminating or intellectually bankrupt, often depending on whether they approach it as a work of history or a work of philosophy. Your friend's refusal to engage is unfortunately common, but the text deserves a more charitable hearing than simply calling it garbage, even if the magazine piece you read does smooth over some of the rougher, more controversial edges to make a cleaner story. To start with the definition of the Enlightenment, the passage is slightly misleading when it pins the book's target strictly to the eighteenth-century movement of Kant and Voltaire. While Horkheimer and Adorno certainly discuss those figures, especially Kant and Sade, their concept of Enlightenment is much broader and more anthropological. For them, Enlightenment is not just a historical period but a recurring tendency in human history whenever thought seeks to disenchant the world by subordinating nature to human will. They are arguing that the impulse to dominate external nature inevitably turns inward to dominate human nature, so while the eighteenth century is the climax of this process, the roots go back to Odysseus tying himself to the mast to hear the Sirens, which is why they can read Homer and Bacon in the same breath. The magazine gets the spirit right but makes it sound too much like a historical grievance against the 1700s rather than a critique of the structure of Western rationality itself.

  When the passage claims that Auschwitz is the logical outcome of a rationality that treats nature as raw material, this is the most charged and frequently misunderstood point. Horkheimer and Adorno do not argue that Kant or Voltaire wanted gas chambers, nor do they suggest a straight deterministic line where teaching physics inevitably leads to genocide. Rather, their argument is that the administered world required for mass murder—the bureaucratization, the categorization of people, the industrial efficiency of death—is only possible because reason has stripped itself of any moral content and become purely instrumental. They are saying that barbarism is not an external accident that happened to civilization, but is inherent in the very concept of civilization as domination. So the magazine is fair to say they see Auschwitz as immanent to this kind of rationality, but wrong to imply it was inevitable in a fatalistic sense. It is more that the tools required for Auschwitz were forged by the Enlightenment conception of reason, even if the Enlightenment thinkers themselves would have been horrified by the use of those tools. This connects to the point about reason shrinking into a tool or calculator of means. This is arguably the most accurate part of the summary you read. The core of the book is the critique of instrumental reason, which is reason that asks how to achieve a goal but refuses to ask whether the goal itself is rational or good. Once reason cannot validate ends, only means, then any end, including mass murder, can be pursued rationally as long as the efficiency is high.

  The line about myth being already enlightenment and enlightenment reverting to mythology is often compressed too neatly in secondary literature. The magazine says this means there is no difference in kind between science and myth, only degree, which is a bit too flat. Horkheimer and Adorno argue that myth was an early attempt to explain and control nature to reduce fear, which is the same impulse as Enlightenment science. However, Enlightenment forgets that it is also a myth because it claims to have escaped fear and superstition entirely. When Enlightenment fails to deliver freedom and instead produces totalitarianism, it reverts to mythology because it becomes a dogmatic system that demands belief rather than critical thought. So they are not saying science is magic, but that the psychological and structural function of dominating the unknown is the same in both. Regarding the way out, the summary claims they offer no exit except art. This is partially true but overly pessimistic in a specific way. They do look to high modernist art as a place where non-instrumental thinking might survive, a space where things are not reduced to categories. However, they do not present this as a political solution or a happy ending. The book is famously bleak, and while art offers a glimpse of resistance, it is not a program for salvation. The magazine is right that they offer no clear political roadmap, which is often why historians find the book frustrating.

  The mention of the Marquis de Sade is crucial and the magazine handles it ambiguously by calling him the Enlightenment's most honest spokesman. This is not an endorsement of Sade's crimes. Instead, Horkheimer and Adorno use Sade to show what happens when Enlightenment rationality is followed to its absolute conclusion without any restraint from religion or traditional morality. In Sade's philosophy, nature is purely material to be used for pleasure, and other people are merely objects. Horkheimer and Adorno argue that the bourgeois society that condemns Sade actually operates on the same principles of exploitation and objectification, just with more hypocrisy. Sade is the truth of the system, not a hero to be emulated. He reveals the horror latent in a world where reason serves only self-preservation and domination. If you read the Sade chapter as an endorsement, you miss the critique entirely, but if you read it as a demonstration of the logical endpoint of instrumental reason, it fits their argument.

  Moving to the legacy, the connection to Foucault is genuine but requires careful distinction. The magazine says Foucault made their argument concrete by tracing the asylum and prison to the same rationality, and there is definitely a lineage there. Foucault inherits the idea that knowledge and power are intertwined and that rational systems of classification can be systems of control. However, your intuition that one thinks reason is the problem and the other doesn't is sharp. Horkheimer and Adorno tend to see instrumental reason as a totalizing trap that encompasses almost everything, leaving very little room for escape. Foucault is more granular; he looks at specific regimes of truth and power without necessarily condemning reason itself as inherently totalitarian. Foucault believes there are possibilities for resistance within these networks of power, whereas Horkheimer and Adorno are much closer to saying the whole structure is damaged. So the linkage is real, but Foucault is less totalizing and less pessimistic about the possibility of local resistance. The closing claim about data and progress being the last stage of the same disease does survive the scrutiny, provided you understand it as a warning against the ideology of data rather than data itself. Horkheimer and Adorno would argue that when we believe data alone can solve moral problems, we are repeating the error of instrumental reason. If the magazine implies that all use of data is fascist, that is wrong, but if it means that trusting data over human judgment is the continuation of the Enlightenment's dark side, that is a fair application of their theory.

  Finally, you asked about Habermas and the charge of performative contradiction. This is the standard philosophical objection, and whether it lands depends on what you think Horkheimer and Adorno are trying to do. Habermas argues that you cannot use reason to argue that reason is destructive without relying on the very validity claims you are attacking. If their critique is true, then their own book is just another expression of destructive reason and has no claim to truth. This charge lands if you view Dialectic of Enlightenment as making standard philosophical truth claims within the system of logic it is criticizing. However, many defenders argue that Horkheimer and Adorno are aware of this and are attempting an immanent critique, meaning they are using reason to show where reason contradicts itself and fails by its own standards, rather than standing outside reason entirely. They are trying to shock the reader into recognizing the damage, not to construct a new logical system. Habermas assumes they are trying to build a theory of society that should be rationally consistent, whereas they are often writing in a fragmentary, aphoristic style precisely to avoid systematizing the very thing they criticize. So the charge misses if you see the book as a warning signal rather than a propositional theory, but it lands if you demand logical consistency from a text that is deliberately exploring the breakdown of consistency.

  What the magazine piece leaves out most significantly is the role of anti-Semitism and the concept of mimesis. A large section of the book is devoted to analyzing why the Enlightenment turned into anti-Semitic barbarism, arguing that the paranoid rationality of the Enlightenment projects its own repressed desires onto the Jew. This is not just an add-on but central to their diagnosis of why the rational society turned irrational. Additionally, they discuss mimesis, which is the human capacity to imitate nature, something Enlightenment tries to stamp out but which returns in destructive forms. Without these elements, the book looks like a simple complaint about science and bureaucracy, when it is actually a much deeper psychoanalytic and cultural critique. For a first-time reader, knowing that the book is as much about psychology and anti-Semitism as it is about Kant and science would change the picture from a dry philosophical grievance to a desperate attempt to understand why civilization produced barbarism. Ultimately, the magazine summary is a fair compression of the broad strokes but flattens the nuances that make the book defensible against the charge of being simple garbage. It is not a history book, so judging it on historical accuracy misses the point, but it is also not a logical proof, so judging it on performative contradiction misses the rhetorical intent. You are right to feel it oversells the determinism, but your instinct that there is something hard and valuable in the diagnosis of instrumental reason is correct, and that is what has kept the book alive despite the objections from historians and philosophers alike.
