          *   Real class-level outcome riding on it (aggregating committee results).
          *   Two rounds with tallies revealed in between (allow revision/strategy).
          *   Stakes: The winner gets implemented in the first 15 mins of next class.
          *   Debrief: Map moments to theorem hypotheses, address "honesty is undefined," predict failure modes, distinguish settled theory from contested bits.
      *   **Instructor's Worries:**
          *   Is the invented rule's deadlock rate a bug or the lesson?
