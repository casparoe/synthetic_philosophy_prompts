      *   *Diamond/Harari:* They argue agriculture reduced quality of life (health, leisure, freedom). They often speak rhetorically as if the *same* people suffered a downgrade. They rarely grapple with the population explosion implication ethically. They rely on a mix of Claim 1 (rhetorically) and Claim 3 (implicitly).
      *   *Graeber/Wengrow:* They argue the historical narrative is wrong (it wasn't a trap, it was playful, reversible). This attacks the *premise* (that agriculture *caused* the suffering in the way Diamond says), not necessarily the *ethical framework*. The user is right: these are different complaints.

