answer: |-
  **MEMORANDUM**

  **TO:** Elections and Registry Officer, Kestrel Basin Commission
  **FROM:** Procedural Design Consultant
  **SUBJECT:** Article 4 Eligibility Decision Procedure & Determination Template
  **DATE:** October 26, 2023

  ### I. DECISION PROCEDURE (ARTICLE 4)

  This procedure is designed for administrative application. It prioritizes consistency over theoretical perfection. Do not deviate from the order of operations.

  **STEP 1: INTAKE & BURDEN OF PROOF**
  *   **Action:** Log petition date. Notify applicant of receipt.
  *   **Burden of Proof:** Preponderance of Evidence. The applicant must show it is "more likely than not" that they meet the criteria.
  *   **Documentation:** Accept tax records, utility bills, permits, or sworn affidavits.
  *   **Provisional Enrollment:** If a petition is filed within 60 days of a Referendum or Panel Sortition and documentation is pending, grant *Provisional Status*. This allows inclusion in the sortition pool but ballots are held in escrow until final determination. If denied finally, provisional status is voided retroactively.
  *   **[JUDGMENT FLAG 1]:** Accepting an affidavit in lieu of hard documentation. *Rule:* Accept only if the applicant is indigent or the record is held by a hostile third party. Document why hard evidence is impossible.

  **STEP 2: THE THREE CRITERIA TEST**
  Evaluate the applicant against Clauses (a), (b), and (c). You must make a finding on *all three*, even if the first two qualify them. This builds the precedent record.

  *   **Criterion A: Ordinary Residence**
      *   *Sufficient Answer:* Physical presence >183 days/year OR declared domicile for tax/voting.
      *   *Evidence:* Lease, tax return, driver's license.
      *   **[JUDGMENT FLAG 2]:** "Ordinary." Seasonal workers present 7 months/year count. Tourists do not. If the applicant lives in the basin but claims domicile elsewhere to avoid taxes, they satisfy (a) for *our* purposes if their physical presence is >183 days.
  *   **Criterion B: Subjection to Binding Rules**
      *   *Sufficient Answer:* The applicant is legally obligated to comply with a KBC permit, rule, or order.
      *   *Evidence:* Permit number, notice of violation, zoning filing.
      *   **[JUDGMENT FLAG 3]:** Indirect Subjection. If an employer is subject to rules, are employees? *Rule:* Yes, if the rule regulates the *conditions* of their presence (e.g., well-siting affecting housing safety). No, if the rule regulates only the employer's profit margin.
  *   **Criterion C: Significant Interests Materially Affected**
      *   *Sufficient Answer:* A Commission decision causes a measurable change in the applicant's health, economic viability, or property value (>5% variance).
      *   *Evidence:* Hydrological models, economic impact studies, medical records.
      *   **[JUDGMENT FLAG 4]:** "Significant." This is the primary valve for limiting the roll. *Rule:* "Inconvenience" is not significant. "Existential threat to livelihood" or "Health hazard" is.
      *   **ESCALATION POINT 1:** If the definition of "Significant" requires weighing competing values (e.g., economic growth vs. environmental preservation) rather than measuring impact, refer to General Counsel (GC).

  **STEP 3: THE COMBINATION RULE (CLAUSE 4)**
  *   **Qualification:** Applicant must satisfy **ANY TWO** of (a), (b), (c).
  *   **Residence Veto:** You cannot deny eligibility *solely* because they fail (a). If they pass (b) and (c), they are in, even if (a) is No.
  *   **ESCALATION POINT 2:** If granting eligibility creates a direct conflict with a prior determination (e.g., similar facts, opposite ruling), do not decide. Refer to GC. This is a precedent conflict, not a factual finding.

  **STEP 4: LEGAL ENTITIES (CORPORATIONS, AGENCIES)**
  *   **Threshold:** Legal entities are "persons" under the Compact *only* for the Referendum. They cannot occupy a seat on a Citizens' Panel (sortition requires natural persons).
  *   **Routing:** A qualified entity must designate a **Natural Person Proxy** (employee, officer, or shareholder) to exercise the franchise.
  *   **Refusal:** If the entity cannot or will not designate a specific human being to act as the proxy, the petition is refused at threshold. The roll tracks humans, not stock tickers.
  *   **ESCALATION POINT 3:** If the entity claims the "interest" belongs to shareholders broadly (e.g., a publicly traded company), refer to GC. We cannot enroll thousands of shareholders via one proxy. The interest must be localized to the entity's operation in the basin.

  **STEP 5: FINAL DETERMINATION**
  *   Draft the determination using the Template below.
  *   If the ruling departs from precedent, obtain GC signature before release.
  *   If the ruling is consistent, sign and file.

  ---

  ### II. DETERMINATION TEMPLATE (MAX 2 PAGES)

  **KESTREL BASIN COMMISSION | OFFICE OF ELECTIONS AND REGISTRY**
  **ELIGIBILITY DETERMINATION: ARTICLE 4**

  **CASE NO:** [YYYY-NN]
  **APPLICANT:** [Name/Entity]
  **DATE:** [DD/MM/YYYY]
  **OFFICER:** [Name]

  **1. FINDINGS OF FACT**
  *   **Residence (Clause a):** [Yes/No]. Applicant is physically present [X] months/year. Domicile is [Location].
  *   **Subjection (Clause b):** [Yes/No]. Applicant [is/is not] holder of Permit #[Number] / [is/is not] directly regulated by Rule #[Number].
  *   **Affectedness (Clause c):** [Yes/No]. Commission decisions [do/do not] materially alter [Specific Interest]. Evidence provided: [Document Type].

  **2. APPLICATION OF CRITERIA**
  *   **Criterion A (Residence):** [Met / Not Met]. *Reasoning:* [One sentence on physical presence vs. domicile].
  *   **Criterion B (Subjection):** [Met / Not Met]. *Reasoning:* [One sentence on legal obligation].
  *   **Criterion C (Affectedness):** [Met / Not Met]. *Reasoning:* [One sentence on material impact threshold].

  **3. PRECEDENT CHECK**
  *   **Prior Cases:** [Cite Case Nos. if applicable].
  *   **Consistency:** This determination [is / is not] consistent with prior rulings.
  *   **Conflict Note:** [If inconsistent, state why GC approval is attached].

  **4. RULING**
  *   **STATUS:** [ELIGIBLE / INELIGIBLE / PROVISIONAL]
  *   **SCOPE:** [Referendum Only / Full Roll (Referendum + Panel Pool)] *Note: Legal Entities are Referendum Only.*
  *   **DESIGNATED PROXY:** [Name of Human Agent, if applicable]

  **5. NOTICE OF APPEAL**
  This determination is a public record. Pursuant to Compact Article 4, this decision may be appealed to the General Counsel within 30 days.

  __________________________
  **Elections Officer Signature**

  __________________________
  **General Counsel Signature (If Required)**

  ---

  ### III. APPLICATION TO PENDING PETITIONS

  **PETITION 1: Seasonal Farmworker Households (1,400 units)**
  *   **Facts:** Live in basin April–November (7 months). Domiciled elsewhere. Subject to well-siting rules (housing safety). Water quality affects health.
  *   **Analysis:**
      *   (a) Residence: **NO** (Domicile elsewhere). *Note: Physical presence is >183 days, but tax/census domicile governs "Ordinary Residence" in prior precedent.*
      *   (b) Subjection: **YES**. Well-siting rules bind their housing conditions directly.
      *   (c) Affectedness: **YES**. Water quality is a health/livelihood existential threat.
      *   **Combination:** Passes (b) + (c). Clause 4 prohibits exclusion solely for failing (a).
  *   **RULING:** **ELIGIBLE (Full Roll).**
  *   **Sympathy Check:** Aligns with your desire. They are subject to the rules and affected by the water. Excluding them would violate the "No Residence Veto" clause.

  **PETITION 2: Hyperscale Data Center (Legal Entity)**
  *   **Facts:** 3km outside boundary. Intake pipe inside (Subjection). Draws 11M liters/day (Affectedness). No resident members.
  *   **Analysis:**
      *   (a) Residence: **NO** (Entity has no residence; physical plant is outside).
      *   (b) Subjection: **YES**. Intake pipe inside basin subjects withdrawal to KBC permits.
      *   (c) Affectedness: **YES**. Aquifer health dictates operational continuity.
      *   **Entity Check:** Must designate a Natural Person Proxy.
  *   **RULING:** **ELIGIBLE (Referendum Only).**
  *   **Condition:** Enrollment is contingent on designating a specific facility manager as Proxy. If they refuse, petition is void.
  *   **Sympathy Check:** Neutral/Uncomfortable. They qualify on strict reading of (b) and (c).

  **PETITION 3: Downstream Coastal Town (Municipality)**
  *   **Facts:** 60km outside. Shellfish beds damaged by nutrient loading (Affectedness). Claim they are *not* subject to KBC rules (No permits, no direct regulation).
  *   **Analysis:**
      *   (a) Residence: **NO**.
      *   (b) Subjection: **NO**. They admit they are not bound by KBC permits. They suffer the *consequences* of the rules, but are not *subjects* of the rules.
      *   (c) Affectedness: **YES**. Economic damage to shellfish industry is material.
      *   **Combination:** Passes (c) only. Fails (a) and (b).
  *   **RULING:** **INELIGIBLE.**
  *   **Sympathy Check:** **AGAINST SYMPATHY.** As an environmental officer, you acknowledge their damage is real. However, under Article 4, "Affectedness" alone is insufficient. To rule otherwise dissolves the boundary entirely (everyone affected by river flow could vote). You must defend this at the hearing: *The Compact grants franchise to those who share the burden of rule-making, not just the burden of consequences.*

  ---

  ### IV. RECONCILING PRECEDENT (THE "NEW PETITION" RULE)

  If a new petition presents facts materially similar to a prior determination but suggests a different outcome:
  1.  **Stop.** Do not issue a determination.
  2.  **Compare.** Map the facts of the new petition against the "Findings of Fact" in the prior case.
  3.  **Distinguish.** If you can identify a factual difference (e.g., "In Case A, the pipe was inside; in Case B, the pipe is outside"), you may proceed with a new ruling.
  4.  **Refer.** If the facts are indistinguishable but you believe the prior ruling was wrong (or political pressure demands a change), you **must** refer to General Counsel. You cannot unilaterally overturn precedent. This protects you from accusations of arbitrary enforcement.

  ---

  ### V. LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  **1. The Clause (5) Regress**
  Clause (5) forbids current enrollees from voting on new enrollees. This procedure places that burden on *you* (the Officer). This is not a fix; it is a displacement. You are acting as the "boundary decider" that democratic theory says shouldn't exist. If a group feels systematically excluded by your application of "Significant Interest," they cannot appeal to the voters to fix it. They can only appeal to the General Counsel or the Courts. This procedure cannot resolve the democratic deficit; it can only manage the paperwork.

  **2. The Political Nature of the Roll**
  The roll is not a census; it is a political constituency. Even if this procedure is followed mechanically, the composition of the roll remains a political question. By enrolling the Data Center (Petition 2) and excluding the Town (Petition 3), you are weighting the "economic user" voice over the "ecological victim" voice. This procedure makes that weighting *explicit*, but it does not make it *neutral*. Do not claim neutrality in your public hearings. Claim consistency.

  **3. Scope Creep (Instrument Mismatch)**
  This procedure is calibrated for the two instruments specified: the Referendum and the Citizens' Panels.
  *   **Risk:** Do not allow this roll to be used for *other* purposes (e.g., public comment periods, advisory committees).
  *   **Why:** The "2-of-3" test is a compromise for *binding* franchise. Using this same roll for non-binding consultation dilutes the meaning of enrollment. If the Commission creates a new instrument, this procedure must be scrapped and rewritten. Using it beyond its design will systematically misfire by granting voting-weight to interests that should only have hearing-rights.

  **4. The "Unborn" Problem**
  The procedure cannot account for future generations. Clause (c) requires "persons" with "interests." Future persons cannot petition. This procedure will systematically exclude the long-term hydrological interest in favor of the short-term economic interest (who are alive to file petitions). You must note this in your annual report, but you cannot fix it within Article 4.
