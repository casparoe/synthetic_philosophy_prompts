prompt: |-
  I've talked myself into a position on Aquinas and tyrannicide that I'd like properly stress-tested. Roughly: that there's no real contradiction in him, and the appearance of one comes from runing two separate questions together.

  The reconciliation I've got in mind goes like this. In the Summa's treatment of sedition he argues that tyrannical rule isn't just, because it's directed at the ruler's own good rather than the common good, and so disturbing it isn't sedition — though I seem to remember he attaches a proviso about the disturbance not doing more harm than the tyranny itself. Meanwhile in the articles on killing he holds that a private person may not kill, since doing so for the safety of the community belongs to whoever has charge of the community, on that part-to-whole reasoning about cutting off a decayed member. So: the question of *who* may act is settled by public commission, not by the target's title; and where a ruler has no title at all — a plain usurper — there's no bond of obedience to disturb, so resisting him isn't the thing sedition names. I'm fairly sure that distinction between a defect in title and tyrannical exercise comes from the jurists rather than from Thomas, so I know I'm reconstructing. And the nervous bits in his little work on kingship about private people taking matters into their own hands I'd read as prudence about consequences — you tend to end up with something worse — rather than a claim of principle.

  What would count against all that? I want the defeaters sorted, fatal versus merely awkward, and I want to know which ones a serious defender of the consistency reading would themselves concede and which they'd wave off.

  Places I suspect it's exposed, tell me if i'm wrong:

  - If the ban on private killing really does turn on the absence of commission rather than on the target's title, then the usurper move buys nothing at all: the lone assassin of a usurper is still uncommissioned. Does my view have any answer?
  - Who exactly is the multitude that can act? A majority, the leading citizens, the whole body? And if the multitude can commission somebody, is that public authority or just a very large private one — does the distinction survive the question?
  - The harm proviso looks like it could make the whole thing unactionable: you can always say the disturbance would have done more damage, and you only find out afterwards. Is that a genuine problem for a view of this kind, or is a checkable-in-hindsight proviso fine?
  - What would actually be decisive here — a passage where he flatly denies any right against a usurper, say, or his treatment of the Church's power to depose a ruler, which might just relocate the authority instead of answering the question?
  - Chronology: if the consistency reading needs the texts to be pulling the same way at the same time, how much weight should I give to evidence of a change of mind, or of the kingship discussion being early, unfinished, or possibly not his?

  And then: what does the consistency reading predict that the rival — that he simply never settled it — doesn't? If it turns out the reading has been qualified to the point where nothing could count against it, say so plainly, and tell me whether that's a problem in this case or just what reading a medieval theologian charitably requires.

  No reading lists or citations please, I can't look anything up right now. But if a step in your answer is leaning on your memory of what the text actually says, flag that as you go.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Aquinas on tyrannicide/tyranny (specifically reconciling *Summa Theologiae* II-II, Q. 42 on Sedition with *De Regno* and *Summa* II-II, Q. 64 on Killing).
      *   **User's Thesis:** There is no contradiction. The apparent conflict arises from conflating two questions: (1) Is the rule just? (Sedition context) and (2) Who has authority to act? (Killing context).
      *   **User's Reconciliation:**
          *   Sedition: Tyrannical rule is unjust (private good > common good). Resisting it isn't sedition *if* it doesn't cause worse harm.
          *   Killing: Private persons cannot kill for the common good; only public authority can (part-to-whole analogy).
          *   Synthesis: The issue is *commission*, not just the target's title. A usurper has no title, so resisting isn't sedition, but a *private* person still can't kill without public commission.
          *   *De Regno* warnings: Read as prudential (consequences), not principled bans.
          *   Distinction (Usurper vs. Tyrant by exercise): Acknowledged as juristic reconstruction, not necessarily explicit in Thomas.
      *   **Task:** Stress-test this view. Identify defeaters (fatal vs. awkward). Distinguish what a defender would concede vs. wave off. Address specific vulnerable points (private killing of usurper, who constitutes the multitude, the harm proviso, decisive passages, chronology).
      *   **Constraint:** No reading lists or citations. Flag memory-based claims.
      *   **Final Question:** What does the consistency reading predict that the inconsistency reading doesn't? Is the reading unfalsifiable?

  2.  **Deconstruct the User's Argument & Identify Weak Points:**

      *   *Point 1: The Usurper Loophole.* The user argues that resisting a usurper isn't sedition. But the ban on private killing is based on *authority*, not just the justice of the cause. If a private person kills a usurper, they still lack public authority.
          *   *Counter:* Does Aquinas explicitly allow the *multitude* to act against a usurper where they cannot against a legitimate tyrant? If the multitude *is* the authority, does that change the "private person" ban?
      *   *Point 2: The Multitude.* Who acts? If the "multitude" acts, is it a public authority? Aquinas seems to suggest the multitude can depose, but is that "private killing" or "public execution"?
      *   *Point 3: The Harm Proviso.* "Not worse than the tyranny." This is consequentialist. Is it a principled limit or a prudential one? If prudential, it doesn't solve the *right* to act, only the *wisdom*.
      *   *Point 4: Decisive Passages.* *De Regno* is the tricky text. (Memory flag: *De Regno* is widely considered authentic but possibly unfinished/edited by Tolomeo of Lucca). If *De Regno* says "wait for God" or "appeal to the Emperor," does that contradict the *Summa* allowance for deposition?
      *   *Point 5: Chronology/Authorship.* *De Regno* vs. *Summa*. If *De Regno* is earlier or tampered with, does it matter for the "consistent Aquinas"?
      *   *Prediction:* What does the consistency view predict? It predicts a coherent hierarchy of authority where "private" is strictly defined against "public," regardless of the ruler's moral status. The inconsistency view predicts oscillation based on context or audience.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the "two questions" distinction (Justice of Rule vs. Authority to Act). It's a standard and robust scholarly move.
      *   **Stress-Testing the Specific Vulnerabilities:**
          *   *The Usurper/Private Killing:* This is the strongest objection. If the ban on killing is about *usurping God's/judgment's role*, killing a usurper privately is still usurping judgment. *Response:* The distinction might be that a usurper is an *aggressor* in a state of war, not a ruler. Private defense against an aggressor is allowed; execution of a ruler is not. *Defeater:* If Aquinas treats the usurper as a ruler once established (prescription), the distinction collapses.
          *   *The Multitude:* This is the crux. In *De Regno* (Memory flag: Book I, Ch. 6), Aquinas says it's not for private presumption but for *public authority*. He suggests the multitude might have the right to depose if they elected the king. *Defeater:* If the multitude acts, are they "private persons"? If yes, contradiction. If no, then the "public authority" requirement is met by the body politic itself. The awkward bit: How do they organize without being seditious first?
          *   *The Harm Proviso:* This makes it prudential. *Defeater:* If it's purely prudential, the *right* exists but shouldn't be used. If it's principled, the *right* is conditional. Aquinas leans prudential here. This isn't fatal, just makes the right "in reserve."
          *   *Decisive Passages:* *De Regno* advising appeal to a superior (Emperor/Pope). *Defeater:* If no superior exists (Kingdom is supreme), does the right vanish? Also, the "wait for God" passage. If he says *only* God can judge, that contradicts human deposition.
          *   *Chronology:* *De Regno* is suspect (Tolomeo). *Summa* is the safer bet. If *De Regno* is more restrictive, a defender waves it off as interpolation or early thought. If *Summa* is restrictive, it's harder to wave off.
      *   **Fatal vs. Awkward Defeaters:**
          *   *Fatal:* A text where Aquinas explicitly forbids deposition of a usurper by the multitude *on principle* (not prudence). Or a text where he equates the multitude's action with sedition even against a usurper.
          *   *Awkward:* The mechanism of how the multitude becomes "public authority" without prior structure. The "Harm Proviso" making the right theoretical.
      *   **Predictions:**
          *   *Consistency View:* Predicts Aquinas will *always* defer to procedure/authority over outcome. He will never endorse assassination. He will always distinguish the *office* from the *man*.
          *   *Inconsistency View:* Predicts oscillation based on whether he's talking to a King (*De Regno*) or students (*Summa*).
      *   **Unfalsifiability Check:** Is the consistency reading too flexible? If every contradiction is explained away as "prudence" or "distinction of questions," is it meaningful? *Verdict:* It's charitable, not unfalsifiable, provided one admits the "public authority" requirement is the hard constraint.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Usurper:* I need to be careful. The user says "where a ruler has no title... there's no bond of obedience." This is true for *sedition*. But for *killing*, the issue is *who judges*. A private person cannot judge even a criminal. So killing a usurper is still a problem unless the usurper is treated as a common aggressor (self-defense) rather than a ruler being deposed. I need to highlight this distinction: *Deposition* vs. *Defense*.
      *   *Correction on Multitude:* The key is whether the multitude *retains* authority after electing a king. Aquinas hints they do. If they do, they aren't "private persons." This saves the consistency.
      *   *Memory Flag:* I need to explicitly state when I'm recalling *De Regno* Book I vs. *Summa* II-II.
      *   *Tone:* Keep it analytical, rigorous, avoiding citation formatting but referencing content.

  5.  **Final Polish:** Check against constraints (no citations, flag memory). Ensure the "Fatal vs. Awkward" distinction is clear. Ensure the "Prediction" section answers the philosophical utility of the reading.

      *(Self-Correction on "No Citations"):* I can mention "The Sedition question" or "On Kingship" but no "ST II-II Q42 A2". I will adhere to this.

      *(Final check on the Usurper point):* The user asks: "If the ban on private killing really does turn on the absence of commission rather than on the target's title, then the usurper move buys nothing at all."
      *My answer:* Correct. The usurper move solves *sedition* (is it a crime against order?) but not *killing* (is it a crime against justice/judgment?). The only way out is if the usurper is not a "ruler" at all but an "aggressor," shifting the act from "execution" to "self-defense." I must emphasize this.

  6.  **Constructing the Output.** (Proceed to generate response based on these thoughts).
answer: |-
  This is a robust reconstruction. You are effectively arguing for a **proceduralist reading** of Aquinas: the moral licitness of resistance turns on the *source of authority* for the act, not merely the *moral status* of the ruler. This is the standard "consistency" defense in Thomistic scholarship, and it holds up well, but it has specific pressure points.

  Here is the stress test, sorted by your vulnerable points, distinguishing between fatal defeaters (which break the thesis) and awkward concessions (which a defender must absorb).

  ### 1. The Usurper vs. Private Killing Problem
  **Your worry:** If the ban on killing is about *commission* (who acts) rather than *title* (who is acted upon), then killing a usurper privately is still forbidden. The usurper move solves sedition, but not murder.

  **The Stress Test:**
  *   **Fatal Defeater:** If Aquinas explicitly classifies the killing of a usurper by a private individual as *murder* (sinful in itself) rather than *imprudent* (risky), your distinction collapses.
  *   **The Defender's Move:** A serious defender distinguishes between **execution** and **defense**.
      *   The ban in the killing articles relies on the analogy of the doctor amputating a limb: only the one with care of the whole body (public authority) can cut.
      *   However, a usurper may not be a "limb" of the body politic at all, but an **external aggressor** or a **common criminal**.
      *   If the usurper is treated as a private aggressor, a private citizen may kill in immediate self-defense (or defense of the neighbor) without public commission.
      *   **The Catch:** This only works for *immediate* defense. If the private person hunts the usurper down to "remove the threat to the community" systematically, they are acting as a judge.
      *   **Verdict:** This is **Awkward, not Fatal**. You must concede that Aquinas likely forbids the *assassination* of a usurper just as he forbids the assassination of a tyrant. The "usurper" distinction allows for *resistance* (refusal to obey, military opposition by the multitude), but not necessarily *private killing*. If you claim the usurper loophole allows for private assassination, that is likely a step too far for the text.

  ### 2. The Multitude Question
  **Your worry:** Who constitutes the "public authority" if the king is the usual holder? If the multitude acts, are they a "very large private one"?

  **The Stress Test:**
  *   **Fatal Defeater:** A passage where Aquinas says the multitude *transfers* all authority irrevocably upon electing a king, leaving them with no residual power to judge him.
  *   **The Defender's Move:** Aquinas (Memory flag: *On Kingship*, Book I) suggests that if the king is elected by the multitude, the multitude retains the right to depose him if he becomes a tyrant.
      *   **The Distinction:** When the multitude acts *collectively* to depose, they are not acting as "private persons" but as the **residual sovereign**. They *are* the public authority in that moment.
      *   **The Awkward Bit:** How do they organize without being seditious first? If sedition is discord against the *unity* of the multitude, and the multitude is the one acting, is it sedition? Aquinas implies that if the tyrant disrupts the common good, *he* is the seditious one, not the multitude restoring order.
      *   **Verdict:** **Conceded but Explained.** A consistency defender must concede that "private person" is a functional category, not just a numerical one. One man is private; the organized body politic is public. The awkwardness lies in the *mechanism*: how the body politic recognizes itself without a head. But this is a political science problem, not a theological contradiction.

  ### 3. The Harm Proviso (Consequentialism)
  **Your worry:** "Not doing more harm than the tyranny" makes the right unactionable or purely retrospective.

  **The Stress Test:**
  *   **Fatal Defeater:** If the proviso is presented as a **condition of justice** (i.e., if you fail, the act was sinful *ex post facto*), it makes the moral law unknowable.
  *   **The Defender's Move:** Aquinas treats this as **prudential**, not principled.
      *   Principle: You *may* depose a tyrant if you have authority.
      *   Prudence: You *should not* if it will cause greater scandal or civil war.
      *   **Verdict:** **Wave Off.** This is standard Thomistic ethics. An act can be licit in kind but illicit in circumstance. This does not threaten consistency; it just makes the right to resist a "nuclear option" that is rarely to be used. It predicts Aquinas will always counsel caution, but not deny the right.

  ### 4. Decisive Passages (Church Power & Appeal to Superior)
  **Your worry:** Does his treatment of the Church's power or appeal to a superior (Emperor/Pope) relocate the authority in a way that contradicts the multitude's right?

  **The Stress Test:**
  *   **Fatal Defeater:** A text stating that *only* a superior temporal or spiritual authority can depose a tyrant, explicitly excluding the multitude. (Memory flag: There are passages in *On Kingship* where he suggests appealing to the Emperor or the Pope).
  *   **The Defender's Move:** Contextual hierarchy.
      *   If a superior exists (e.g., a King under an Emperor), appeal to the superior.
      *   If no superior exists (the King is supreme), the authority reverts to the multitude (who originally constituted the kingship).
      *   **The Church:** Aquinas distinguishes temporal and spiritual power. The Church can depose for spiritual crimes (heresy/apostasy) which void the title, but for general tyranny, it is a temporal matter.
      *   **Verdict:** **Awkward.** If *On Kingship* strongly emphasizes appeal to the Pope/Emperor even when no such superior clearly exists in the local context, it tensions with the *Summa*'s more immanent account of the multitude's right. A defender must argue *On Kingship* is addressing a specific context (Kingdom of Cyprus?) or is less mature.

  ### 5. Chronology and Authorship
  **Your worry:** *On Kingship* is unfinished/edited (Tolomeo of Lucca). Does this matter?

  **The Stress Test:**
  *   **Fatal Defeater:** If the restrictive passages (wait for God, appeal to superior) are in the sections definitely written by Aquinas, and the permissive passages (multitude can depose) are in the suspect sections.
  *   **The Defender's Move:** Rely on the *Summa* as the mature, systematic statement. *On Kingship* is an occasional tract.
      *   **Verdict:** **Wave Off.** A consistency reading based on the *Summa* can treat *On Kingship* as illustrative but not definitive if they conflict. However, if you claim consistency *across all works*, authorship issues are fatal to the claim that *Aquinas* held one view, though not to the claim that the *Thomistic tradition* holds one view.

  ---

  ### What the Consistency Reading Predicts (vs. Inconsistency)

  To ensure your reading isn't unfalsifiable, here is what it commits you to. If these turn out false, the consistency reading fails.

  **1. The "Assassination" Prediction**
  *   **Consistency Reading:** Predicts Aquinas will **never** endorse private assassination, even of a usurper or a heretic tyrant, *unless* it can be framed as immediate self-defense against an aggressor. He will always insist on some form of public process or collective action.
  *   **Inconsistency Reading:** Might allow that in his hotter moments (or earlier works), he endorses the "heroic tyrannicide" of a single individual.
  *   **Test:** If you find a text where Aquinas praises a specific historical assassin acting alone (not as an agent of a rival power), the consistency reading dies.

  **2. The "Sedition" Prediction**
  *   **Consistency Reading:** Predicts that "Sedition" is defined strictly as opposition to the *unity of the multitude*. Therefore, if the ruler has broken that unity by pursuing private good, opposing him is *not* sedition by definition.
  *   **Inconsistency Reading:** Might suggest Aquinas waffles on whether resisting a tyrant is still technically sedition but excusable.
  *   **Test:** Aquinas should be clear that tyranny *causes* sedition; resistance *quells* it. If he calls resistance "sedition" but "justified," that is a contradiction in terms for him.

  **3. The "Authority" Prediction**
  *   **Consistency Reading:** Predicts that the *only* thing stopping a private person from killing a tyrant is the lack of commission, not the sanctity of the ruler's life.
  *   **Inconsistency Reading:** Might suggest Aquinas thinks the ruler has a special ontological status that makes him untouchable regardless of commission.
  *   **Test:** Look for the reasoning. If he argues "Do not kill because he is the Lord's Anointed," that is a principled ban (Inconsistency with the "public authority" argument). If he argues "Do not kill because you are not the judge," that is procedural (Consistency). Aquinas almost exclusively uses the "judge/authority" argument.

  ### Is the Reading Unfalsifiable?

  You asked if the reading has been qualified to the point where nothing counts against it.

  **It is not unfalsifiable, but it is highly charitable.**
  It relies on a distinction between **Principle** (Who has the right to judge?) and **Prudence** (When is it wise to exercise it?).
  *   **Falsification:** A text where Aquinas says, "Even if the multitude authorizes it, it is sinful to depose a tyrant because God alone judges rulers." That would be a principled ban that overrides the public authority argument. (Memory flag: There are sermon fragments or commentary on Romans 13 that lean this way; if these are weighted equally with the *Summa*, consistency is hard to maintain).
  *   **Charity:** Reading the "wait for God" passages as "wait for God *if you have no human recourse*" rather than "never act." This is standard theological harmonization.

  ### Summary of Defeaters

  1.  **Fatal:** A text explicitly forbidding the multitude from deposing a king they elected, on principle (not prudence).
  2.  **Fatal:** A text endorsing private assassination of a tyrant as a virtuous act (not self-defense).
  3.  **Awkward (Concede):** The mechanism by which the multitude organizes itself without a head is vague.
  4.  **Awkward (Concede):** The harm proviso makes the right theoretical in many cases.
  5.  **Wave Off:** Differences between *On Kingship* and *Summa* (attribute to genre, audience, or authorship issues).
  6.  **Wave Off:** The "Usurper" distinction solves the *sedition* charge but not the *killing* charge (unless framed as self-defense against an aggressor).

  **Final Verdict on Your Position:**
  Your reconstruction is the strongest available version of the consistency thesis. It correctly identifies that the "Sedition" question is about the *justice of the cause*, while the "Killing" question is about the *authority of the agent*.
  **Your exposed flank:** The claim that a private person can kill a usurper. You should retreat to: "A private person cannot *execute* a usurper, but the *multitude* can depose him, and a private person can *defend* against him." If you hold that line, the consistency reading survives. If you insist a lone private citizen can licitly kill a usurper to save the state, you are likely imputing a modern liberal view of resistance to a medieval hierarchical view of authority.
