      *   *Malcolm's View:* Dreams are not experiences occurring in time. They are dispositions to report upon waking. The "truth" of the dream is the report itself, not a prior event.
      *   *Marsh's View (Dennettian):* Dreams are constructs based on brain states; the report reflects what the brain was doing (or disposed to do) during sleep. The lab measures sleep states that correlate with reports.
      *   *The Bridge:* Both agree on the *report*. Both agree on the *importance* of the waking narrative. Both agree on the *rigor* of the methodology (awakenings, correlations).
