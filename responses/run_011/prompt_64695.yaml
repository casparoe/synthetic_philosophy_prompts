answer: |-
  Good evening. For those who don't know me, I am one of Helen's former students, and like many of you, I owe a significant portion of my intellectual life to the space she has held open for the last thirty-eight years. Looking around this room, I see the scope of that life. There are technicians who managed the monitors through the night, colleagues who debated the data by day, undergraduates who learned that science involves watching people sleep, and family who learned that science involves waiting for them to wake.

  Helen's laboratory has always been a place of rigorous listening. When a subject is awakened from REM sleep, or from the quieter states of non-REM, they offer a narrative. Helen's career rests on taking those narratives seriously—not as folklore, not as fantasy, but as data. Her famous findings regarding the variability of reports minutes apart, and the distinct texture of non-REM accounts, changed how the field understands the relationship between physiological states and waking speech. She demonstrated that what we say upon opening our eyes is deeply constrained by what our bodies were doing while they were closed.

  Now, those of us who specialize in the philosophy of this work know that Helen and I do not see eye to eye on the metaphysics of the subject. She has affectionately introduced me for twenty years as her Malcolmian fossil, implying that my view belongs in a museum. She believes the laboratory can test hypotheses about the night itself. I maintain that the only fact available to us is the impression formed at the moment of the report. But tonight is not about settling that dispute. It is about acknowledging that despite this divergence, we agree on what matters: the integrity of the account, the precision of the awakening, and the dignity of the subject's voice.

  There is exactly one joke I am permitted to make about our disagreement, and Helen insisted I include it. She says that if I am a fossil, she is the paleontologist who keeps digging me up to show me how much the earth has moved beneath my feet. I suppose I should be grateful she hasn't dated me yet.

  But in all seriousness, the beauty of Helen's work is that it remains robust regardless of where one stands on that philosophical spectrum. For a scientist, she mapped the reliable correlations between brain states and subsequent narratives. For a philosopher, she clarified the conditions under which a human being becomes capable of telling a story about the night. Both views require the same meticulous care. Both views demand that we do not dismiss the waking report as mere confabulation, nor inflate it into something it is not.

  Helen taught us that the morning story is not a secondary effect; it is the primary phenomenon. Whether one believes that story reflects a prior inner performance or a disposition crystallized upon awakening, the responsibility of the researcher is identical. We must listen without imposing. We must record without distorting. We must honor the fragility of the memory while respecting the solidity of the data.

  Her mentorship extended far beyond the lab. She taught us that uncertainty is not a failure of method, but a feature of the subject matter. When two reports from the same sleeper diverge, she did not see error; she saw complexity. When a subject claimed to have dreamed nothing, she did not see a blank; she saw a different category of response. She built a community where technicians and philosophers could sit at the same table, not because they agreed on what happens in the dark, but because they agreed on how to study the light we bring back from it.

  To her husband and daughter: thank you for sharing her with us, even when the calls came at three in the morning. To her students: we are the beneficiaries of her patience. And to Helen: you have spent nearly four decades waking people up to tell you what they found. Now it is our turn to wake up to what you have given us.

  So I ask you to raise your glasses. We drink to the rigor of the question, to the value of the report, and to the person who taught us that the truth of the night is found in the care we take with the morning.

  To Helen Marsh.

  ***

  **Notes on the Constraints**

  I bent the Malcolmian line slightly in the third paragraph ("what our bodies were doing while they were closed"). A strict Malcolmian might argue this implies the body's state *caused* an experience, but I framed it as constraining the *speech*, which remains safe. I also validated the scientists' work by emphasizing "correlations" and "physiological states" rather than "dream events," allowing them to feel their measurements were real (of the body and the report) without committing to the dream-as-event ontology. The toast works for both because both agree the *report* is the crucial datum.
