answer: |-
  **Project Title:** The Bandwidth of Justification: Limits on Factored Cognition in Idealized Deliberation

  **1. The Research Question**
  The framework of iterated amplification, specifically Humans Consulting HCH (HCH), posits an idealized limit where a human with unbounded time and access to copies of themselves answers questions via recursive decomposition. This relies on the Factored Cognition Hypothesis: that any hard epistemic question can be decomposed into easier subquestions, and crucially, that the parent agent can successfully integrate the sub-agents' answers to determine the original verdict. My project asks: **Does iterated amplification converge on correct epistemic verdicts for all deliberative tasks as recursion depth increases, provided the parent agent remains cognitively bounded and the communication channel between nodes has finite capacity?**

  This question is formulated to allow for a negative result. If the answer is "yes," then the HCH limit is robust, and failures are merely engineering hurdles regarding prompt design or tree depth. If the answer is "no," then there exists a class of epistemic tasks resistant in principle to factorization by bounded parents, regardless of tree depth. The core tension lies not in the ability to decompose the task, but in the transmission of the *justification* required to validate the sub-answer. If the probative force of a sub-verdict depends on considerations that cannot survive transmission to a parent agent within realistic bandwidth, the parent receives a conclusion stripped of the very evidence that makes it rational.

  **2. Current Landscape and Openness**
  Current discourse leaves this question unresolved due to two competing defenses of the HCH framework. The first is the "engineering defense." Proponents argue that decomposition failures are contingent, not structural. If a parent cannot understand a child's output, the decomposition was simply poor; with sufficient depth or better training, the subtasks become trivial enough that their answers are self-justifying within the channel limits. This view treats the problem as one of optimization: find the right tree structure, and the information loss vanishes.

  The second defense relies on the status of HCH as an idealization. Because HCH is defined as a limit, skeptics argue it is unfalsifiable by finite failure. If amplification fails at depth $d$, the proponent can simply posit that the limit requires $d+1$. This renders the framework immune to empirical or formal critique, as any failure can be attributed to insufficient approximation of the ideal rather than a flaw in the ideal itself.

  My project challenges both positions. It argues that the "engineering defense" ignores the possibility of incompressible justification, where the complexity of the warrant exceeds the channel capacity regardless of task difficulty. It challenges the "idealization defense" by showing that if the limit is defined by bounded agents communicating over bounded channels, the limit itself may be ill-defined for certain classes of problems. The question remains open because we lack a formal model distinguishing between tasks that are *hard* to factor and tasks that are *lossy* to factor.

  **3. Methodology**
  To resolve this, I will employ a hybrid method combining conceptual taxonomy with formal modeling. Purely philosophical argumentation risks vagueness regarding "bandwidth," while pure machine learning empiricism risks opacity regarding *why* a model fails.

  First, I will construct a taxonomy of candidate cases drawn from real deliberation where justification seems holistic. Examples include aesthetic comparisons, evaluating whether an action expresses a specific value, or assessing the coherence of competing research programs. In these cases, the verdict often relies on a gestalt understanding that resists propositional summary.

  Second, I will formalize a toy setting to model these cases. The model will consist of a parent agent $P$ and a child agent $C$, where $C$ processes a subtask and transmits output to $P$ via a channel with capacity $k$ bits. I will define a metric for "epistemic fidelity," measuring how well $P$'s final verdict matches the verdict of an unbounded, non-factored oracle. I will then test whether amplified judgment converges as depth grows or plateaus.

  Crucially, I will compare this against two controls to ensure any failure is attributable to structure rather than effort. The first control is "sampling at fixed depth": does drawing more samples from the same tree level improve fidelity? The second is "adversarial checking": does allowing a sibling node to critique the child's output mitigate the loss? If fidelity plateaus despite increased depth, and controls fail to recover the loss, this suggests a structural bottleneck. This method beats alternatives because it isolates the variable of *transmission capacity* from *computational power*, allowing us to see if the idealization breaks due to the nature of justification itself.

  **4. Success and Failure Conditions**
  A successful result would demonstrate a class of problems in the toy model where accuracy plateaus as depth increases, despite unlimited computational resources at the nodes. Crucially, this plateau must retain "philosophical residue." It cannot merely re-derive a standard result about lossy transmission in information theory (e.g., Shannon's limit). Instead, it must show that the lost information is specifically *justificatory*—that the parent fails not because the signal is noisy, but because the signal lacks the normative force required for epistemic warrant. This would establish that some epistemic tasks are resistant to factored cognition in principle.

  The project would count as failing under two conditions. First, if the toy model reduces entirely to standard communication theory with no specific implications for epistemology or idealized deliberation, the philosophical contribution is null. Second, if every candidate case in the taxonomy can be re-described as factorizable by going deeper or widening the channel, the "engineering defense" holds, and the suspicion of a structural limit is unfounded. In this case, the HCH limit remains robust, and my hypothesis regarding non-detachable answers is incorrect.

  **5. Scope Assessment for Ten Weeks**
  Ten weeks is sufficient for the formal modeling and the conceptual taxonomy, but not for large-scale empirical training of neural networks. I must cut the ambition of testing this on state-of-the-art language models. While empirical validation is valuable, the philosophical point concerns the *structure* of the idealization, not the current capabilities of AI. I will focus on the formal toy model and rigorous analysis of the deliberative cases. I will also limit the taxonomy to three deep case studies rather than a broad survey. This ensures I can fully formalize the information constraints for each case rather than skimming the surface of many. The goal is a proof of concept regarding the limit, not a benchmark of current systems.

  **6. Critical Reflection on Framing**
  To conclude, I must identify the consideration that, if correct, would show this is the wrong question to ask. The project rests on the premise that justification must be *transmitted* explicitly from child to parent. If a holistic theory of deliberation is correct—specifically, if the parent agent can reconstruct the justificatory structure implicitly through interaction rather than explicit transmission—then the bandwidth constraint is a false problem.

  The step in my reasoning most likely to break is the assumption that the parent is passive regarding the child's output. In my model, the parent receives a message and evaluates it. However, in actual deliberation, the parent might query the child iteratively, effectively expanding the channel capacity through dialogue rather than single-shot transmission. If the "channel" is actually an interactive protocol that allows for compression via shared context built over time, my static bandwidth model fails to capture the dynamics of HCH. If justification is reconstructible via interaction, then the limit holds, and the apparent lossiness is merely a failure to utilize the full interactive potential of the framework. This would render my focus on single-shot transmission constraints a category error regarding how idealized deliberation functions.
