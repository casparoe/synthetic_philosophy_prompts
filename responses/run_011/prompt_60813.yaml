          *   *Cons:* Shifts the field to economics/stats. Might be too far from philosophy PhD expectations unless framed normatively.
          *   *Verdict:* Strong contender, but maybe too distinct from the CDT/EDT debate.

      *   *(7) Realism of Predictors?*
