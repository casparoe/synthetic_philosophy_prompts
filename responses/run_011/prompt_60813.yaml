      *   The "Loop" case sounds like a *fixed-point* issue. Does a rational equilibrium exist?
      *   Missing Question: *Is rational deliberation computable in the presence of perfect predictors?* (Turing/Goedel angle).
      *   Missing Question: *Does the normativity of decision theory require the world to be causally separable from the agent?*

  5.  **Selecting the Top Question for the Prospectus:**
      *   The adviser wants a *question*. The student has a *case* (the Loop).
      *   The Loop case breaks standard CDT/EDT because the correlation is internal to the deliberation process.
      *   Question (4) on Ratifiability is the strongest fit. It connects the case to a normative constraint.
      *   *Refinement:* Instead of just "Is there a stability constraint?", make it "Does the Loop Case demonstrate that Ratifiability is necessary *and* sufficient, or does it break Ratifiability too?"
