  8.  **Refining the "One Question":**
      *   It needs to turn the "pile of cases" into a thesis.
      *   "Does the possibility of self-referential prediction (the Loop) entail that rational deliberation requires a fixed-point solution that standard CDT/EDT cannot provide, and if so, does Ratifiability supply it?"
