      *   User's Loop: Oracle predicts deliberation. Oracle is accurate *only* about agents who know how it works. Second note predicts act *after* reading first note.
      *   Core Tension: Self-reference. The prediction is based on the deliberation which is based on the prediction. This sounds like a fixed-point problem or a ratifiability problem.
      *   User's Strengths: Formal stats, Pearl, EU calculus.
      *   User's Weaknesses: Metaphysics, Counterfactuals.
      *   Implication: The dissertation *must* lean into the formal/structural side (decision rules, stability, fixed points) rather than the metaphysical side (what *is* causation, truth conditions for counterfactuals).

  3.  **Evaluate the 7 Candidate Questions:**

      *   *(1) Causal/Evidential split downstream of metaphysics?*
          *   *Pros:* Deep.
          *   *Cons:* Requires metaphysics of causation. User hates counterfactual semantics. This is a trap for this specific student.
          *   *Verdict:* Deprioritize.

      *   *(2) "Loses money is refuted" vs. "Ends up dead"?*
          *   *Pros:* Practical.
          *   *Cons:* In Damascus, "richer" usually means "alive." If the setup makes the richer agent dead, it's a specific utility function tweak, not a general refutation of Dutch Book-style arguments.
          *   *Verdict:* Pseudo-problem or too specific.

      *   *(3) Tickle Defense (screening off) vs. Loop?*
          *   *Pros:* Technical, fits stats background.
          *   *Cons:* Tickle defense is largely considered dead/insufficient in the literature (Arntzenius, etc.). Does the loop break it? Probably, but is it a dissertation?
          *   *Verdict:* Low ceiling.

      *   *(4) Stability/Ratifiability Constraint?*
          *   *Pros:* **Goldmine for this student.** Ratifiability (Jeffrey, Joyce) is about fixed points in deliberation. It fits the "loop" case perfectly. It's formal (game theory/decision theory overlap). It avoids heavy metaphysics. It directly addresses "deliberation crowds out prediction."
