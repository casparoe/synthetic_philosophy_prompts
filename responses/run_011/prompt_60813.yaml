      *   *Tone Check:* Needs to be direct, slightly critical (like a senior colleague), American English.
      *   *Structure:*
          1.  Brainstorm of *actual* open questions (including user's + new ones).
          2.  Hard Ranking of the User's 7 (with trade-offs).
          3.  Deprioritization (Pseudo-problems, settled, traps).
          4.  The "One Question" for the Prospectus.
          5.  The "Pivot" (what would change the ranking).
