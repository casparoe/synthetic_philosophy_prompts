      *Move 6:* Damages. Premise to reject: Pragmatic cost affects epistemic justification.
      *Move 7:* Advances. Premise to reject: None strong.

      *Question 1:* Excuse/Correctness works.
      *Question 2:* Scope distinction fails Marcus.
      *Question 3:* Behavioral test is strong evidence against level-splitting.

      *Unarticulated:* Total Evidence View. Cost: Loss of modularity between FOE and HOE.
      *Disagreement:* Substantive.
