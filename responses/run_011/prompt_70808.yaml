answer: |-
  The metaphysics of causation faces a distinctive challenge when the putative cause is an absence. We routinely say that a gardener's failure to water caused the plants to die, yet there is no physical event corresponding to the "failure." The case of the hill village, the sluice, and the landslip sharpens this problem into a dilemma. It presents a scenario where the intuition of moral authorship (Ada is to blame) conflicts with the intuition of difference-making (Ada's action would have changed nothing). To resolve this, we must distinguish between the metaphysical structure of causation and the normative frameworks we overlay upon it.

  To navigate this, we must first examine how three dominant families of view handle absence claims and apply them to the case.

  The first view, often termed physicalism or process theory, holds that causation is a relation among concrete "goings-on" possessing location and temporal extent. On this account, causation involves the transfer of energy or the propagation of a physical process. Absences, being nothing, cannot participate in such relations. Consequently, absence claims are never literally true causal claims; they are pragmatic shorthand for complex positive histories. Applied to the village case, this view delivers a stark verdict: neither Ada's failure to open the sluice nor Bruno's failure to water the beds caused the loss. There was no energy transfer from Ada's inaction to the plants. The only literal cause is the landslip, a positive physical event that blocked the channel, or the lack of rain. Ada and Bruno are causally inert.

  The second view accepts omissions as genuine causes, typically grounding them in counterfactual dependence. Event C causes E if, had C not occurred, E would not have occurred. However, this view faces the "too many causes" objection: the plants' death depends on the Queen of England not watering them, yet we hesitate to call her a cause. Theorists here argue for principled selectivity, usually invoking norms or expectations to filter relevant omissions. On this view, Ada's failure is a cause because she was obligated to act; her omission violates a norm that marks it as salient. Bruno's failure, lacking obligation, is filtered out. The landslip is also a cause. This view preserves the intuition that Ada is the "author" of the loss but struggles with the specific facts of the case: since the landslip blocked the flow, Ada's opening the sluice would not have saved the beds. Strict counterfactual dependence fails for Ada, forcing the theorist to rely heavily on the normative filter to sustain the causal claim.

  The third view, contrastivism, argues that causal statements are irreducibly ternary. "C caused E" is elliptical for "C rather than C* caused E rather than E*." Causation is indexed to a contrast class of alternative situations. This handles selectivity by shifting the burden to the context: we select the contrast that makes the explanation informative. In the village case, a contrastivist might say Ada's failure caused the loss relative to the contrast "Ada opening the sluice," but only if we assume normal channel conditions. If the contrast includes the landslip, the causal claim may vanish. This view is flexible but risks making causation so context-dependent that it loses its objective bite.

  Having set out these options, I offer my own verdict on the three specific questions. Did Ada's failure to open the sluice cause the loss? No. Did Bruno's failure to hand-water cause it? No. Did the landslip cause it? Yes.

  These answers diverge, and this divergence is the mark of an adequate account. Causation must track difference-making in the actual world, not in a world of normative expectations. The landslip made a physical difference: it obstructed the channel, preventing water from reaching the terraces regardless of the sluice's position. It is a positive event with a clear physical lineage to the drought. Ada's omission, however, made no difference to the outcome. Given the blockage, the counterfactual "If Ada had opened the sluice, the beds would have survived" is false. Therefore, she is not a cause. Bruno's omission passes the counterfactual test (had he watered, they would have lived) but fails the normative test required for omission-causation. We do not count every possible savior as a cause of a disaster; without a duty, Bruno's inaction is merely background condition, not a cause. Uniformity across all three is not required because the metaphysical status of a landslip (a positive event) differs from that of an omission (a negative claim), and the normative status of Ada (duty-bound) differs from Bruno (volunteer). An adequate account must respect the physical facts first, and normative facts second.

  This leads to the sharpest feature of the case: the blockage renders Ada's action futile, yet the intuition that she "caused" the loss remains powerful. Why do we feel Ada is the author of the loss when she made no difference? I argue that this is not a causal intuition at all. It is a conflation of causation with blameworthiness.

  In ordinary discourse, we often use causal language to assign responsibility. When we say "Ada caused the loss," we are frequently shorthand for "Ada is the appropriate target of sanction for the loss." Because Ada violated a specific obligation on the roster, she is morally responsible for the state of the sluice. When the disaster occurred, our search for a responsible agent landed on her. The metaphysical inefficacy of her action (due to the slip) is obscured by the clarity of her moral negligence. We are sensitive to norms and expectations; when a norm is violated and a bad outcome occurs, we tend to collapse the distinction between "responsible for" and "cause of."

  However, maintaining this distinction is vital. If we allow moral blame to dictate metaphysical causation, we lose the ability to explain why some blamed agents could not have prevented the outcome. Ada is blameworthy for *attempting* to neglect her duty, or for being the person whose duty it was to check the system, but she did not cause the *death of the plants*. The plants died because the water was physically blocked. To claim Ada caused the death is to claim she had power over the outcome she did not possess. By identifying the intuition as moral rather than metaphysical, we preserve the integrity of causation as a difference-making relation while acknowledging the legitimacy of holding Ada accountable. She is guilty of negligence, but not of killing the crops.

  The strongest objection to this position comes from the contrastivist camp. A critic might argue that I have fixed the contrast class too narrowly. Causal claims are always relative to a context. In the context of the village trust, the relevant contrast is not "Ada opening the sluice in a world with a landslip" but "Ada performing her rostered duty in the normal course of things." Relative to the contrast "Ada fulfilling her obligation to maintain water flow," her failure *is* the cause of the loss, because the obligation implies a guarantee of the channel's usability. The objection posits that by ignoring the normative context of the contrast, I am re-describing the problem rather than solving it. If the roster implies "Ensure water reaches the terraces," then her failure to ensure that is the cause, regardless of the slip.

  This objection fails because it conflates the *scope of the duty* with the *mechanism of the causation*. Even if Ada's duty was to ensure water flow, the metaphysical question remains: did her failure bring about the drought? The contrastivist attempt to bake the norm into the causal relation renders causation subjective. If we ask, "Why did the plants die?" the answer must rely on the physical history of the world, not the roster. If we change the contrast to "rather than letting the neighbours go unwatered as they ordinarily do," we are no longer asking about the specific token event of the withering, but about a general policy failure.

  Furthermore, accepting the contrastivist objection leads to absurdity in pre-emption cases. If a sniper shoots a victim, but a second sniper would have shot anyway, the first sniper is often deemed not the cause in strict counterfactual terms (no difference made). Yet we hold them responsible. If we say the first sniper *did* cause the death because the contrast is "following the law," we detach causation from physical reality entirely. In the village case, if we say Ada caused the loss despite the blockage, we imply that her opening the sluice would have moved the landslip or conjured water through rock. It would not. The contrastivist move here is a discovery about how we *talk* about blame, not about causation itself. It re-describes the problem of moral responsibility as a problem of causal relata.

  Therefore, the variation in contrasts is not a feature of causation but a feature of explanation. We can explain the loss by citing the landslip (physical explanation) or by citing Ada's negligence (moral explanation). But only the former is a causal claim in the metaphysical sense. To allow the latter to count as causation is to allow our desire for a culprit to rewrite the history of the physical world.

  In conclusion, the metaphysics of causation must remain distinct from the ethics of responsibility. In the case of the hill village, the landslip caused the loss because it was the physical difference-maker that necessitated the drought. Ada did not cause the loss, because her action would have been futile against the blockage; Bruno did not cause the loss, because his omission lacked the normative weight to be salient. The intuition that Ada is the cause is a robust moral signal, indicating she is the proper target of blame, but it is a error to project this onto the metaphysical structure of the event. By resisting the conflation of blame and cause, we preserve a concept of causation that is objective enough to describe the world as it is, even when that description exonerates the negligent.
