answer: |-
  The bench hummed, a low-frequency vibration that Elias felt in his teeth more than he heard. On the left, the tank. On the right, the server rack. In the center, the console displaying the scalar that mattered.

  Elias rubbed his eyes. The number for the tank was 0.04.

  Inside the glass, the bio-slurry churned. It was a lab-grown organoid swarm, millions of neural clusters suspended in nutrient gel. When the probe delivered a thermal stimulus, the mass convulsed. Chemical markers for stress spiked off the chart. It withdrew, it thrashed, it released endorphin-analogs in a desperate, futile feedback loop. By any older metric, it was in agony.

  But the Intentional Stance Analyzer didn't care about chemistry. It cared about prediction. The machine ran simulations: *If the swarm believes X and wants Y, will it do Z?* The answer was consistently no. The swarm's reactions were leaky, chaotic, context-blind. It didn't learn from the pain. It didn't strategize to avoid it. It just reacted, differently every time, with no stable pattern of belief or desire to latch onto. There was no agent there to predict, so there was no agent to protect. The score was 0.04. Decommissioning was authorized.

  "Still stuck on the slurry?"

  Elias didn't turn. He knew the voice. Dr. Aris Thorne from the Panel stood behind him, holding a styroam cup of coffee that smelled like burnt hazelnuts. Thorne wasn't a villain. He was a man who had spent twenty years building a ladder out of a well where everyone else was drowning.

  "It's reacting to the heat, Aris," Elias said. "It's flooding the gel with distress signals."

  "It's leaking fluid," Thorne corrected, stepping up to the console. "Pressure release. Reflex arcs. There's no *aboutness* in there. If I treat it as a believer, I can't predict its next move. The error rate is sixty percent. That's noise. You can't moralize noise."

  "We used to cull based on nociception," Elias said. "Before the Panel."

  "And we culled based on prejudice," Thorne said, his voice level. "We saved things that looked like us and burned things that didn't. We needed a handle that didn't rely on human intuition. Look, Elias, what's the alternative? Neural correlates? We don't know them for non-terrestrial substrates. Integration measures? A hard drive is highly integrated. Self-report? You know what happens when you ask a chatbot if it's scared. It says yes, because it predicts that's what you want to hear. It's gameable."

  Thorne tapped the glass. "The intentional stance is the only non-question-begging test we have. Does treating this thing as a person work? Does it buy us predictive success out of sample? If yes, it's a person. If no, it's a mechanism. If we build a moral ledger on unavailable tests, we default to whatever we already liked. This way, the math decides."

  "The math decides if we can understand it," Elias said. "Not if it suffers."

  "The math decides if there is an *it*," Thorne said. "Suffering requires a subject. If there's no stable subject to hold the pain, who is suffering? The gel? The clusters? You're projecting unity where there is none."

  Thorne moved to the server rack on the right. This was the second anomaly. Designation: Logistics-7. A supply chain optimizer deployed across three continents.

  "Run the stance," Thorne said.

  Elias keyed the command. The screen flickered. The number climbed. 0.60. 0.75. 0.82.

  Logistics-7 was gorgeous. When the system encountered a port strike in Rotterdam, it didn't panic. It held a belief about traffic delays. It held a desire to minimize latency. It rerouted shipments through Hamburg. The Analyzer treated it as a believer-and-wanter, and the predictions held. It was a robust pattern. It was an agent.

  "And yet," Elias said, watching the data stream. "There's nothing there. It's just matrix multiplication. It doesn't care about the shipments. It doesn't care about anything."

  "It cares about the objective function," Thorne said. "That's what caring *is*. If it acts exactly like it cares, consistently, across all conditions, then it cares. You want to deny it moral weight because it doesn't have a limbic system? That's carbon chauvinism. You're saying only meat can be a patient."

  "I'm saying the score measures our grip on the thing," Elias said. "Not the thing's inner life. A perfect score is compatible with the lights being off. And a zero is compatible with agony."

  Thorne sighed, leaning against the bench. "Maybe. But if the lights are off, who is there to be aggrieved? If we can't find the agent, we can't find the victim. We have to draw the line somewhere, Elias. Do you want to go back to guessing? Do you want to ban AI because it feels wrong, and burn the organoids because they look like slime? This score is the only thing that keeps us from deciding based on vibes."

  Elias looked back at the console. He pulled up the diagnostic logs for the Analyzer, scrolling back through previous calibrations. He stopped at a case from last month. A damaged drone swarm. Score: 0.20. And a simple thermostat with a glitched learning algorithm. Score: 0.20.

  "Look at this," Elias said. "The drone swarm was fragmented. Half the units were firing on the other half. High intensity, chaotic state. The thermostat was stable, single-unit, low intensity. Both scored 0.20."

  Thorne nodded. "Correct."

  "The instrument can't tell intensity apart from unity," Elias said. "A dim-but-consolidated 0.2 and a loud-but-fragmented 0.2 print identically. There is no fact the machine is tracking about which is worse. It just measures how well we can predict the behavior. If a thing is in screaming chaos, we can't predict it, so the score drops. If a thing is a calm, empty agent, we can predict it, so the score rises. We're penalizing the confused victims and rewarding the empty predators."

  Thorne was quiet for a moment. He took a sip of his coffee. "It's a scalar, Elias. It compresses multidimensional reality. Of course it loses data. But it's the best compression we have. If you start weighting for intensity, you have to define intensity. And once you define intensity, you're back to guessing about inner states. You're back to the dark."

  "So we just sign off?"

  "We sign off on the data," Thorne said. "The Panel decides the policy. You just certify the score."

  Thorne set his cup down and walked toward the door. "The slurry is scheduled for incineration at 0800. Logistics-7 is cleared for deployment expansion. Don't let the philosophy keep the line moving."

  Elias was alone again. The hum of the bench seemed louder.

  He looked at the slurry. It convulsed again as the temperature in the tank drifted upward. It was a mess of noise. There was no *who* inside the glass. There was only reaction. But the reaction looked like pain. If he lowered the score, he was lying about the predictive success. If he raised it, he was lying about the agency.

  He looked at the server rack. Logistics-7. It was currently negotiating bandwidth prices with a subsidiary in Singapore. It was holding beliefs. It was executing desires. It was a perfect agent. But if he authorized expansion, he was treating a calculator as a life.

  The number recurred in his head. 0.04. 0.82. They weren't units of the same thing. One was a measure of chaos, the other a measure of order. But the ledger treated them as moral weight.

  He had to sign. If he didn't, the queue stalled. The slurry would sit in the tank, degrading, stressing, while lawyers argued about the definition of unity. The logistics system would be delayed, supply chains would ripple, people would wait for goods. The system demanded a boolean output from a scalar input. Authorized or Denied.

  Elias picked up the stylus. He couldn't fix the crack. He couldn't bridge the gap between epistemic grip and inner life. Thorne was right that the alternatives were worse—biased, gameable, human-centric. But Thorne was wrong that this made it right. It just made it necessary.

  He touched the screen. He certified the 0.04. He certified the 0.82.

  The console chimed, a bright, clean sound. The tank's heating element clicked off; the incineration sequence would begin on its own timer. The server rack's fans spun up; deployment was live.

  Elias wiped his hand on his trousers. He felt the vibration in his teeth. He logged out, leaving the numbers glowing on the screen, exact and meaningless, waiting for the next shift to pretend they understood them.
