      *   (4) *Normative Probability:* Probabilistic coherence is required (no credence in contradictions). This implies a kind of logical competence (knowing contradictions are false).
      *   (5) *Normative Boundedness:* Rational norms must be comply-able by finite agents. Clutter avoidance is a virtue (don't believe all trivial consequences).
      *   (6) *Dynamics:* Jeffrey Conditionalization (uncertain evidence).
      *   (7) *Epistemic Value:* Deduction yields new knowledge/belief (dynamic change), not just uncovering what was there.

  3.  **Identify Tensions (Brainstorming & Cross-Checking):**

      *   *Tension A: (1)+(2) vs. (3)+(7).*
          *   If propositions are just sets of worlds (1) and there are no impossible worlds/structures (2), then logically equivalent propositions are *identical*.
          *   If $P$ and $Q$ are logically equivalent, the set of worlds where $P$ is true is identical to the set of worlds where $Q$ is true.
          *   If Belief is a relation to that set (1), then Believing $P$ is identical to Believing $Q$.
          *   But (3) says it's false that I believe all consequences (e.g., theorems of arithmetic). And (7) says deducing $Q$ from $P$ is epistemically significant (I didn't believe $Q$ before).
          *   *Verdict:* **Genuine & Severe.** This is the core Logical Omniscience Problem (LOP) restated. If you accept standard possible worlds semantics without hyperintensional tools, you *cannot* distinguish belief in $P$ from belief in logical equivalent $Q$.

