  *One life is equal to another life,*
  The cold water stings deep into skin.
  *And yet the calculus demands we look,*
  These hands grasp hard the slippery rock.
  *Beyond the particular pull of blood,*
  This breath comes in ragged gasps of air.
  *For any agent standing on the shore,*
  The salt burns deep inside this raw throat.
  *Suppose a stranger stood here in this place,*
  The waves crash hard against this bare chest.
  *The end would be the same no matter who,*
  These fingers dig into the wet wool.
  *Implying that to weight this life is wrong,*
  The hair sticks fast against the pale face.
  I weigh the sum of lives saved here today.
  I pulled her because she is my wife.

  ***

  **Note for the Convenor**
  Line fifteen marks the intrusion of the agent-neutral calculus into the first-person voice, unmarked to show the assimilation of the logic. This thought is the consequentialist weighing of lives saved. The alternation had to fail here because justification is only possible after the act, when the integrity of the agent has already been compromised by the demand to articulate a reason.
