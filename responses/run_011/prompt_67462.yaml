answer: |-
  **Part One: The Axes**

  The following six dimensions mark the boundaries where moral positions on lying and misleading diverge.

  1.  **Source of Wrongness:** Is the primary wrong the deception caused, the violation of a norm of assertion, the breach of an assurance given, or the harm produced?
  2.  **Kind versus Degree:** Is lying morally distinct in kind from misleading, or is it merely a more severe instance of the same wrong?
  3.  **Entitlement:** Does the hearer's right to the truth vary with the relationship (e.g., friend versus stranger) or circumstances (e.g., threat versus trade)?
  4.  **State of Mind:** Must the speaker believe the statement is false, or is indifference to the truth sufficient for wrongdoing?
  5.  **Success Condition:** Must the hearer actually be deceived for the act to be wrong, or is the attempt sufficient?
  6.  **Said versus Implied:** Does the linguistic mechanism (explicit statement versus implication) carry independent moral weight, regardless of the outcome?

  ***

  **Part Two: The Questions**

  **1. The Used Car**
  A seller knows a car has engine trouble but says only, "It runs well," omitting the defect. The buyer assumes no major issues.
  A. This is as wrong as saying "The engine is perfect."
  B. This is wrong, but less blameworthy than a direct lie.
  C. This is acceptable; buyers should inspect goods themselves.

  **2. The Ambiguous Time**
  You know a meeting is at 3:00. A rival asks when it starts. You say, "People usually arrive around then," knowing they will think 2:00.
  A. You have lied, because you intended deception.
  B. You misled, which is rude but not a lie.
  C. You acted rightly to protect your own advantage.

  **3. The Aggressor**
  An attacker demands to know where your friend is hiding. You say, "They left town," though they are upstairs.
  A. This is wrong; lying is never permitted.
  B. This is permissible; the attacker forfeited the right to truth.
  C. This is permissible only if it prevents serious harm.

  **4. The Cynic**
  You tell a story you know is likely false, but you do not care if it is true or not; you just want to impress.
  A. This is as bad as lying.
  B. This is worse than lying, because you disregard truth entirely.
  C. This is not wrong if the story turns out true.

  **5. The Seen-Through Lie**
  You make a false claim to a teacher. She knows you are lying but lets you finish.
  A. You did wrong, regardless of her belief.
  B. You did not wrong her, as she was not deceived.
  C. You did wrong only because you risked being believed.

  **6. The Correction**
  You mislead a colleague about a deadline. Realizing their error, you correct them before they act.
  A. The initial misleading was wrong, even if corrected.
  B. It was not wrong, because no harm occurred.
  C. It was wrong, but the correction removes the blame.

  **7. The Harmful Evasion**
  To avoid blame, you imply a colleague made an error. They are fired. A blunt lie would have been detected, saving them.
  A. The misleading is worse because it caused more harm.
  B. The misleading is better because it was technically true.
  C. Both are equally wrong regardless of the outcome.

  **8. The Lucky Guess**
  You state something you believe is false. It turns out to be true by accident.
  A. You lied, because you believed it was false.
  B. You did not lie, because the statement was true.
  C. You acted wrongly, because you disregarded the truth.

  **9. Silence versus Evasion**
  Asked a private question, you refuse to answer. In a similar case, you give a vague, distracting response.
  A. Refusal is better; evasion implies a false answer.
  B. Evasion is better; refusal is rude.
  C. They are morally identical in this context.

  **10. The Promise**
  You promise to meet a friend. You intend to go, but you know you might be delayed. You say, "I will be there."
  A. This is a lie if you have doubts.
  B. This is a promise, not a prediction; it is acceptable.
  C. This is misleading if you do not warn of delays.

  ***

  **Part Three: The Tree**

  **Root:** What makes the act wrong?
  *   **Branch 1 (Harm):** Wrongness lies in the consequences. -> **Leaf 1: Consequentialism.**
  *   **Branch 2 (Norm/Right):** Wrongness lies in the violation of a rule or right. -> **Node 2:** Is the violation in the assertion or the deception?
      *   **Branch 2a (Assertion):** Wrongness is in stating what one believes false. -> **Node 3:** Does entitlement matter?
          *   **Branch 3a (Yes):** Rights vary by context. -> **Leaf 2: Contextual Absolutism.**
          *   **Branch 3b (No):** Rights are invariant. -> **Leaf 3: Strict Absolutism.**
      *   **Branch 2b (Deception):** Wrongness is in causing false belief. -> **Leaf 4: Deceptionism.**

  **Leaf Descriptions and Awkward Commitments:**
  *   **Leaf 1 (Consequentialism):** Wrongness depends on outcomes. *Awkward Commitment:* Question 7 (Harmful Evasion) implies a technically true statement is worse than a lie if consequences are worse.
  *   **Leaf 2 (Contextual Absolutism):** Lying violates a norm, but rights vary. *Awkward Commitment:* Question 3 (Aggressor) requires defining exactly when rights are forfeited.
  *   **Leaf 3 (Strict Absolutism):** Lying is always wrong, regardless of context. *Awkward Commitment:* Question 3 (Aggressor) forces condemnation of lying to save a life.
  *   **Leaf 4 (Deceptionism):** Misleading is as wrong as lying if deception succeeds. *Awkward Commitment:* Question 5 (Seen-Through Lie) implies no wrong was done if the hearer knew the truth.

  **Mental Reservation and Terminology:**
  The early modern casuist practice of silently restricting the meaning of one's own words is known as **Mental Reservation**. In the tree, this falls under **Leaf 4 (Deceptionism)** or **Leaf 2 (Contextual Absolutism)**, depending on whether the hearer is entitled to the unreserved meaning. The accepted term of art for producing a false impression by means of statements that are strictly true is **Paltering**.

  ***

  **Part Four: The Gaps**

  **1. The Incoherent Cell:**
  *Combination:* Source of Wrongness = Harm + Lying is Inherently Worse than Misleading (Kind).
  *Status:* **Incoherent.** If harm is the only source of wrongness, a lie cannot be inherently worse than misleading unless it inherently causes more harm, which contradicts the "Kind" distinction.

  **2. The Unattractive Cell:**
  *Combination:* Success Condition = Must Succeed + State of Mind = Indifference is Sufficient.
  *Status:* **Unattractive.** This view holds that one cannot wrong a hearer unless deceived, yet one can wrong them by being indifferent. It creates a mismatch between the mental fault and the required outcome.

  **3. The Unexplored Cell:**
  *Combination:* Said versus Implied = No Weight + Entitlement = Invariant.
  *Status:* **Unexplored.** Few argue that linguistic mechanism never matters while simultaneously arguing that context never changes entitlement. Most who deny the said/implied distinction allow for contextual rights.

  **Indistinguishable Leaves:**
  **Leaf 1 (Consequentialism)** and **Leaf 4 (Deceptionism)** may yield identical verdicts if deception always causes harm.
  *Additional Question Needed:* "Is a lie wrong if it produces a beneficial false belief that prevents a greater harm?" Consequentialists say no; Deceptionists say yes.

  ***

  **Part Five: The Key**

  **Scoring Instructions:**
  Tally your answers for Questions 1, 2, 5, 8, and 10 under **Column A** (Assertion/Lie Focus). Tally Questions 3, 6, 7, and 9 under **Column B** (Context/Harm Focus). Tally Question 4 under **Column C** (State of Mind).

  *   **Mostly Column A:** You lean toward **Strict Absolutism** or **Assertion Norms**.
  *   **Mostly Column B:** You lean toward **Consequentialism** or **Contextualism**.
  *   **Mostly Column C:** You lean toward **Indifference Views**.

  **Tie-Breaker Rules:**
  *   **Absolutism vs. Deceptionism:** Review Question 5. If you chose A, you are an Absolutist. If B, you are a Deceptionist.
  *   **Consequentialism vs. Contextualism:** Review Question 3. If you chose C, you are a Consequentialist. If B, you are a Contextualist.

  **What Your Result Means:**

  **Strict Absolutism:** You believe that making a statement you believe to be false is inherently wrong, regardless of the outcome or the hearer's rights. You value the integrity of communication above specific consequences. Your challenge is explaining why truth-telling is obligatory even to those who intend harm.

  **Contextual Absolutism:** You hold that while lying violates a norm, people do not always have a right to the truth. You distinguish between private and public spheres. Your challenge is defining the precise boundaries where a hearer forfeits their claim to honesty.

  **Deceptionism:** You believe the moral wrong lies in causing a false belief, not in the words used. To you, a misleading truth is as bad as a lie if it deceives. Your challenge is explaining why a failed lie (seen through) is less wrong than a successful misleading truth.

  **Consequentialism:** You judge acts by their results. A lie is wrong only if it causes worse outcomes than the truth. You are pragmatic. Your challenge is accounting for the long-term erosion of trust, which is hard to measure in single cases.

  **Indifference View:** You are most concerned with the speaker's relationship to the truth. Disregarding whether a statement is true is the core wrong. Your challenge is distinguishing this from lying, as both involve a lack of proper regard for truth.
