  *(Self-Correction on "Neutral Counterpart")*: I need to be careful. The literature *often* assumes a neutral counterpart (N-word vs. Negro/Black). But the user is right to question if this is universal (e.g., slurs for behaviors or niche groups). I will label the *requirement* that a theory *must* posit one as contested.

