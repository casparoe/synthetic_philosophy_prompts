      *(Refining the "Killer")*: The "Embedding Problem" is the classic killer for pure expressivism. The "Reclamation Problem" is the classic killer for hard semantic views. I'll frame the tension between **Projection** and **Reclamation** as the critical tension.

      *(Refining the Camps)*:
      *   Truth-Conditional: Good for embedding, bad for reclamation/moral neutrality.
      *   Expressivist: Good for action-guiding force, bad for embedding/truth-evaluation.
      *   Presuppositional: Good for projection, bad for empty slurs/cancellation.
      *   Prohibitionist (Anderson & Lepore): Good for reclamation/context, bad for explaining *why* this word and not that one (arbitrariness).

  6.  **Final Review against Constraints:**
