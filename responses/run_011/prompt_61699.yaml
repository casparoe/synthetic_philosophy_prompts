          *   Identify the "killer" desideratum (knocks out most views).
          *   Identify jointly unsatisfiable pairs (e.g., stability vs. reclamation).
          *   Brief evaluation of major camps (Truth-conditional, Prohibitionist, Expressivist, Presuppositional).
          *   **Crucial Constraint:** Be explicit about consensus vs. live fights. Do not present contested positions as consensus.
      *   **Tone:** Academic, sharp, critical, seminar-ready.

  2.  **Deconstruct the Desiderata (Drafting & Categorizing):**

      *   *Persistence/Projection:* Slurs survive negation ("He isn't a *k*"), embedding ("If he is a *k*..."), attitude reports ("John said he is a *k*").
          *   *Status:* High consensus on the data, debate on *why* (semantic vs. pragmatic).
      *   *Co-extensionality:* Slur (S) and Neutral Counterpart (N) refer to the same group. "X is S" and "X is N" have same truth conditions (usually).
          *   *Status:* High consensus on extension, debate on content.
      *   *Offensiveness Location:* Why is it the *word*? Can't just be speaker intent. Dictionary entries don't offend.
          *   *Status:* Consensus that it's linguistic, debate on mechanism.
      *   *Reclamation/In-group:* In-group members can use it without offense.
          *   *Status:* Data is solid, theoretical handling is a major fight.
      *   *Slur vs. Insult:* "Jerk" vs. racial slur. One is descriptive/evaluative of behavior, the other is often essentializing/group-based.
          *   *Status:* Consensus on distinction, debate on semantic import.
      *   *Empty Slurs/Existence:* "There are no *k*s here." Can be true even if the slur presupposes existence of the group with negative properties.
          *   *Status:* Live fight (presupposition failure vs. falsity).
      *   *Neutral Counterpart Requirement:* Does every slur *have* a clean neutral counterpart? (User specifically flagged this).
          *   *Status:* **Contested.** Some slurs target constructed categories without a prior neutral label.
      *   *Moral Explanation:* Should semantics explain *why* it's wrong to use?
          *   *Status:* **Contested.** Semantics vs. Ethics boundary.

  3.  **Refining the Status (Consensus vs. Fight):**
      *   *Consensus:* Slurs project (mostly), slurs are co-extensive with neutral terms (mostly), reclamation happens, slurs differ from ordinary insults.
      *   *Fight:* Is the derogatory content truth-conditional? Is it presupposed? Is it conventional implicature? Does semantics explain the moral wrong? Is there always a neutral counterpart?

  4.  **Selecting the "Killer" and "Unsatisfiable Pair":**
      *   *Killer:* The "Embedding/Projection" data combined with "Offensiveness Location." Pure pragmatics struggles with embedding; pure semantics struggles with reclamation/context sensitivity. Actually, the strongest filter is usually **Projection + Reclamation**. If you say it's semantic content, reclamation kills you. If you say it's purely pragmatic, embedding kills you.
      *   *Unsatisfiable Pair:* **Semantic Stability (Projection)** vs. **Contextual Flexibility (Reclamation).** If the meaning is fixed in the lexicon to explain projection, how does the in-group turn it off? If it's context-dependent to explain reclamation, why does it survive negation?

  5.  **Drafting the Content (Iterative refinement for tone and accuracy):**

