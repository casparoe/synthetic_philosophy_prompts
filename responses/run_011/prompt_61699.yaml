  *(Final check on "Unsatisfiable Pair")*: Stability (Projection) vs. Flexibility (Reclamation) is the standard tension. I will articulate this clearly.

  8.  **Constructing the Output.** (Drafting the response based on these thoughts).
answer: |-
  Here is a battle-card for your seminar. The literature on slurs is notoriously fragmented because authors often prioritize different slices of the data. To avoid being seduced by a well-written paper that ignores half the phenomenon, you need to separate the **hard data** (consensus) from the **theoretical baggage** (camp prejudices).

  Below are the core desiderata, categorized by their status in the current literature.

  ### I. The Hard Data (Broad Consensus)
  *These are the phenomena almost everyone agrees a theory must accommodate, though they disagree on the mechanism.*

  **1. The Projection/Embedding Data**
  *   **The Case:** The derogatory force survives negation ("He isn't a *k*"), conditionals ("If he is a *k*, run"), and attitude reports ("Alice believes he is a *k*"). It also survives mention in linguistic examples (like this one), provided the context is meta-linguistic.
  *   **Status:** **Non-negotiable Data.**
  *   **The Trap:** Purely pragmatic theories (it's just an implicature) struggle here, because implicatures usually vanish under negation. Purely semantic theories struggle to explain why it doesn't affect truth conditions (see below).

  **2. Co-extensionality (The Truth-Conditional Intuition)**
  *   **The Case:** "X is a *k*" and "X is [Neutral Counterpart]" are true in exactly the same situations. If the target group is empty, both are false. The slur does not seem to add descriptive content that makes the sentence *false* if the target is a good person; it makes the sentence *offensive*.
  *   **Status:** **Consensus on Data, Fight on Explanation.**
  *   **The Trap:** Some theories posit that the slur adds a negative property to the truth conditions. This risks making sentences like "There are no *k*s" false (if the negative property is impossible to satisfy) or makes racist sentences true (if the target actually has negative traits). Most agree the slur and neutral term have the same extension, but fight over whether they have the same *content*.

  **3. The Word/Intent Disconnect**
  *   **The Case:** A dictionary entry or an initialism (e.g., "the N-word") does not offend. Conversely, a speaker can use a slur with benevolent intent (paternalistic racism) and it remains offensive. The offensiveness is linguistically encoded, not purely psychological.
  *   **Status:** **Non-negotiable.**
  *   **The Trap:** Theories that ground the meaning entirely in speaker intention (Gricean pragmatics) often fail here. The constraint must be lexical or conventional, not just mental.

  **4. Slur vs. Ordinary Insult**
  *   **The Case:** Calling someone a "jerk" targets behavior and is gradable (a bit of a jerk). Slurs typically target group membership, are often treated as essentializing, and carry a historical weight of violence/oppression that "jerk" does not.
  *   **Status:** **Consensus.**
  *   **The Trap:** Theories that treat slurs as merely "thick evaluative terms" (like *lecher* or *brave*) often collapse this distinction. A theory must explain why slurs are socially distinct from garden-variety pejoratives.

  ### II. The Live Fights (Camp Prejudices)
  *These are often presented as requirements, but they are actually theoretical commitments. Do not accept them as given.*

  **5. The Neutral Counterpart Requirement**
  *   **The Case:** The demand that every slur (S) must have a clean, neutral counterpart (N) that picks out the same group without the derogation.
  *   **Status:** **Contested / Shaky.**
  *   **Why:** As you suspected, this is a prejudice of the semanticist's desire for minimal pairs. Some slurs target social kinds that *only* exist through the derogatory lens (e.g., certain gendered or caste-based slurs where the "neutral" term is already politicized). Demanding a clean N-term can obscure the social construction of the category itself.
  *   **Verdict:** Treat this as a heuristic, not a law.

  **6. The Moral Explanation Requirement**
  *   **The Case:** The demand that the semantic theory itself must explain *why* using the slur is morally wrong.
  *   **Status:** **Camp Prejudice (Moral Semanticists).**
  *   **Why:** Most semanticists hold that semantics describes truth conditions or use, not moral ontology. A theory can explain why an utterance is *infelicitous* or *prohibited* without grounding the *moral wrongness* in the lexicon. Demanding this conflates meta-ethics with semantics.
  *   **Verdict:** Reject. Semantics explains the *mechanism* of offense; ethics explains the *wrong*.

  **7. The Empty Slur Problem**
  *   **The Case:** "There are no *k*s in this town." A competent speaker can say this sincerely without the sentence coming out false or presupposition failure occurring, even if the slur presupposes the existence of a group with negative properties.
  *   **Status:** **Live Fight.**
  *   **Why:** Presuppositional accounts struggle here (they predict presupposition failure). Truth-conditional accounts handle it easily (the set is empty). This is a key testing ground for presupposition vs. assertion views.

  ### III. The Structural Tensions

  **The "Killer" Desideratum: Projection + Reclamation**
  If you want to eliminate the most views quickly, look for how they handle the tension between **Projection** (Desideratum 1) and **Reclamation/In-Group Use**.
  *   **Why it kills:** To handle projection, you need the derogatory content to be "sticky" (semantic or conventional). To handle reclamation (where in-group members use the term without derogation), you need the content to be "flexible" (context-sensitive or pragmatic).
  *   **The Filter:** If a theory makes the meaning too fixed to explain projection, it cannot explain reclamation without ad-hoc exceptions. If it makes the meaning too flexible to explain reclamation, it cannot explain why the slur survives negation in out-group mouths.

  **The Unsatisfiable Pair: Semantic Stability vs. Contextual Flexibility**
  Your hunch is correct.
  *   **Stability:** The derogatory force projects out of logical operators (suggesting it is hard-coded in the lexicon).
  *   **Flexibility:** The derogatory force vanishes in reclamation or specific contextual frames (suggesting it is determined by use/context).
  *   **The Conflict:** No current theory satisfies both perfectly without significant cost. **Prohibitionism** (Anderson & Lepore) sacrifices stability (saying the word is just prohibited, no semantic content) to save flexibility. **Semanticism** (Hom, Croom) sacrifices flexibility (positing complex semantic content) to save stability. **Presuppositionalism** (Macià, Sennet) sits in the middle but bleeds on the "Empty Slur" data.

  ### IV. Camp Scorecard (Brief)

  *   **Truth-Conditional (e.g., Hom):** Treats derogatory content as part of the truth conditions.
      *   *Pros:* Handles embedding and co-extensionality well.
      *   *Cons:* Struggles with reclamation (makes in-group use semantically false?) and risks making racist sentences true.
  *   **Expressivist (e.g., Blackburn, Schroeder):** Treats the slur as expressing a non-cognitive attitude.
      *   *Pros:* Explains the "action-guiding" offensive force.
      *   *Cons:* The **Frege-Geach Problem**; struggles massively with embedding/negation (what does "He isn't a *k*" express?).
  *   **Presuppositional (e.g., Macià, Sennet):** Treats derogatory content as a presupposition.
      *   *Pros:* Explains projection beautifully.
      *   *Cons:* Struggles with "Empty Slurs" (presupposition failure vs. falsity) and reclamation (how do you cancel a lexical presupposition?).
  *   **Prohibitionist (e.g., Anderson & Lepore):** The word is off-limits by convention; no special semantic content.
      *   *Pros:* Handles reclamation and context sensitivity easily (rules can have exceptions).
      *   *Cons:* Accused of being too shallow; doesn't explain *why* this word and not a synonym is prohibited (the arbitrariness problem).

  **Seminar Strategy:** When a presenter claims their theory solves everything, check the **Reclamation vs. Projection** tension. If they solve projection, ask them how an in-group member turns off the semantic content they just posited. If they solve reclamation, ask them why "He isn't a *k*" still feels dirty. That is where the bodies are buried.
