  I am in the first term of a graduate program and my proseminar on scientific realism has just moved to what the instructor keeps calling the prehistory of structural realism, which in practice means reading Henri Poincaré in English translation alongside the contemporary dispute over whether structure is all there is or merely all we can know. I have hit a wall on one passage and I want help arguing my way through it, not a summary of Poincaré's conventionalism, which I have now read four times. One caveat about how I am supplying the text: I have made it a rule never to reproduce a quotation from memory, so what follows is my own close English rendering, typed up from notes rather than copied word for word out of the old combined translation of his three popular books that our library holds. I am not even certain which of the three volumes the passage comes from, and I would rather you not rest anything on that attribution or supply a page number for it. Please treat the wording as mine and the claims as his; if you think my rendering has flattened a distinction that matters for the question, say so before anything else and explain what would turn on the difference.

  Here is the rendering, together with the material immediately around it. The passage says in substance that what science attains is not the nature of things, which it will never reach, but the relations between things; that outside those relations there is no reality accessible to us; and then it adds a condition, which is the part I cannot make sense of, namely that all of this holds provided that the same ratio, or proportion, obtains between the relations among the things we do come to know and the relations among the things we do not. To illustrate the point about relations it turns to acoustics and optics: sound is treated as a vibration carried in air, light as a vibration carried in a far subtler and more elusive medium, and what the two theories share is not the stuff involved but the form of the relations, which is why results and equations carry across from one domain to the other. Just before this, in what I take to be the same argument, he makes the point that when an older physical theory is displaced its successful equations are not simply thrown away but reappear inside the successor theory as limiting cases, so that what survives theory change is exactly the relational content, and that this is what licenses calling that content true rather than merely convenient. A friend in my reading group insists the whole thing is Kant with better mathematics, and that the clause about the same ratio is where the Kantianism shows; I have been resisting that reading without being able to say why, which is a large part of what has brought me here.

  What I want back is an interpretive argument in American English, roughly nine hundred to thirteen hundred words, with no bibliography or list of further reading at the end — I cannot get hold of secondary literature this term, and references I cannot check would be worse than useless to me. Please address four things in order. First, the clause I have been calling the same-ratio condition: does it amount to a claim of knowledge about things we cannot know, in which case it looks like it contradicts the thesis that the nature of things is forever out of reach, or is it something weaker — a methodological presupposition, a regulative assumption, a statement of what would have to be the case for our structural knowledge to be worth having? Lay out the least committal and the most committal readings and say which the surrounding material favors. Second, the relata: elsewhere he writes in a way that suggests theories are above all convenient ways of ordering our sensations, which would make the relations relations among appearances rather than among things; can that strand be reconciled with the passage above, and if it can, what does the reconciliation cost — does it render the same-ratio condition empty, or does it reduce the claim that we attain reality to a claim about internal coherence? Third, the analogy between acoustics and optics: what work is it actually doing, is it evidence that two theories can share everything worth calling real while disagreeing about ontology, or does it establish only a mathematical isomorphism between two domains whose ontological claims might both be false? Fourth, and on the basis of your answers, give me a verdict rather than a survey: is the fair conclusion that he is an ancestor of the view that structure is all we can know while things in themselves retain intrinsic natures we never grasp, or does the passage leave open, or even push toward, the more radical view that there is nothing over and above structure? Hedge only as far as the material genuinely requires. Finally, be explicit about the epistemic status of your own answer: tell me which consideration, or which difference in the actual wording of the original, would push you over to the rival reading you reject, and point to the step in your argument where you think you are most likely to have gone wrong.
