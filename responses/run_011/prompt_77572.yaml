answer: |-
  This is a sharp observation. You have identified a specific rhetorical mechanism that thrives in the gap between academic history and public memory. It is frustrating because it feels like cheating, yet it persists because it satisfies a psychological need for closure where none exists.

  Here is the carving you asked for.

  ### 1. The Name
  There is no single canonical Latin term for this specific maneuver, because it is a composite of two distinct logical failures working in tandem. However, in philosophy of science, the core engine is **Unfalsifiability** (specifically, *immunization against refutation*). In rhetoric, it is commonly called a **"Heads I Win, Tails You Lose" argument**.

  If you want a label that captures the *psychological* texture of it—the way the evidence becomes a mirror for the observer rather than a window on the subject—I propose calling it **The Rorschach Fallacy**.

  **Why this name?**
  A Rorschach inkblot is structurally ambiguous. If a psychologist says, "You saw a butterfly, which proves you are gentle," and then later says, "You saw a butterfly, which proves you are repressing violence," they are treating the *datum* (the butterfly) as decisive evidence for mutually exclusive internal states. The evidence isn't doing the work; the theory is.

  In your example, "Ordinariness" is the inkblot.
  *   **Reader A:** "Ordinary = Situational pressure (Browning)."
  *   **Reader B:** "Ordinary = Hidden evil (Goldhagen)."
  *   **The Fallacy:** When a single speaker claims "Ordinary = Situational" *and* "Ordinary = Hidden Evil" simultaneously as *definitive* proof, without acknowledging the tension, they have made the theory unfalsifiable.

  ### 2. Nearest Neighbors (and how this differs)
  You correctly ruled out the Fundamental Attribution Error and Underdetermination. Here is how it relates to the actual neighbors:

  *   **Underdetermination of Theory by Data:** This occurs when the available evidence is insufficient to determine which of several theories is correct. *Difference:* Underdetermination admits the tie ("We cannot know"). Your move *denies* the tie ("This proves X" / "This proves Y"). It collapses the ambiguity into certainty on both sides.
  *   **Confirmation Bias:** This is seeking or interpreting evidence in ways that support existing beliefs. *Difference:* Confirmation bias usually involves cherry-picking *different* facts. Your move uses the *exact same fact* as the smoking gun for both sides.
  *   **Motivated Reasoning:** This is the emotional drive behind the conclusion. *Difference:* Motivated reasoning is the *engine*; Unfalsifiability is the *transmission*. Your move is the mechanical structure that allows the motivated reasoning to run without stalling.
  *   **The "Just-World" Hypothesis:** The belief that people get what they deserve. *Difference:* This explains *why* people want the killers to be monsters (so we are safe). It doesn't name the logical move used to get there.

  **The Distinction:** The unique feature of your move is **Evidentiary Elasticity**. The fact stretches to fit the conclusion, rather than the conclusion shrinking to fit the fact.

  ### 3. Did Browning and Goldhagen Do This?
  **No.** This is a distortion piled on afterwards by public discourse.

  *   **Christopher Browning (*Ordinary Men*):** Focused heavily on *reluctance*. His key evidence was that many men *did not* kill, or drank heavily to cope, or asked to be excused. He argued the "ordinariness" proved that *situational pressure* could override moral character.
  *   **Daniel Goldhagen (*Hitler's Willing Executioners*):** Focused heavily on *willingness*. His key evidence was that men volunteered for extra shootings, joked about it, and showed initiative. He argued the "ordinariness" proved that *antisemitic character* was widespread and normal.

  They fought over **which facts were predominant**, not over what a single shared fact meant. Browning said, "Look, they were reluctant." Goldhagen said, "Look, they were eager."

  The move you are seeing ("They were ordinary, which proves they were pressured, and also proves they were evil") is a **Cultural Synthesis**. It is a way for the public to accept both books without resolving the contradiction. It allows us to say "It could happen to anyone" (comfort) while also saying "They were monsters" (condemnation). It is a coping mechanism, not a historiographical method.

  ### 4. Edge Question 1: When is it Legitimate? (The Test)
  It is legitimate when it describes **human complexity**. It is rigged when it describes **argumentative certainty**.

  Human beings are contradictory. A man can be amiable *and* dangerous. A man can be keen because he is evil, *and* keen because he wants to fit in. The legitimacy depends on **Epistemic Humility**.

  **The Test: The Falsification Challenge**
  Take the paragraph in question. Ask: **"What observation would prove this statement false?"**

  *   **Legitimate Version:** "His amiability makes it hard to tell if he is harmless or dangerous. If he were cruel openly, we'd know he was dangerous. If he were shy, we might think him harmless. Because he is amiable, he could be either."
      *   *Verdict:* **Legitimate.** This acknowledges the ambiguity. The fact (amiability) creates uncertainty.
  *   **Rigged Version:** "His amiability proves he is harmless. Also, his amiability proves he is dangerous (because he hides it)."
      *   *Verdict:* **Rigged.** The fact (amiability) creates certainty for both. There is no state of the world that could disprove the claim.

  **The "Cost" Test (for fiction):**
  Does the ambiguity cost the character or the narrator anything?
  *   **Legitimate:** The narrator is tormented by not knowing. The plot hinges on the risk of misinterpretation.
  *   **Rigged:** The narrator uses the ambiguity to have it both ways without risk. (e.g., "He seemed nice, which showed he was a wolf," but later, "He seemed nice, which showed he was truly nice," depending on what the plot needs).

  ### 5. Edge Question 2: Aesthetic Judgments
  **Yes, it is the same animal.**

  When Critic A says, "The prose is flat, which proves the author is stylistically incompetent," and Critic B says, "The prose is flat, which proves the author is deliberately minimalist," they are engaging in the **Rorschach Fallacy**.

  *   **Legitimate:** "The prose is flat. It is unclear if this is incompetence or minimalism; the effect is the same, but the intent is unknowable."
  *   **Rigged:** "The flatness proves it's genius (because it's deliberate)." / "The flatness proves it's trash (because it's accidental)."
      *   *Note:* If the critic claims *certainty* about the intent based solely on the text without external evidence, they are unfalsifiable. This is why the **Intentional Fallacy** exists: to warn us that we cannot know the intent from the text alone. Claiming the text proves the intent is the rigged move.

  ### 6. Advice for Your Manuscript
  You wrote: *"My antagonist is an amiable man and I keep wanting his amiability to be both the proof that he's harmless and the proof that he isn't."*

  This is a rich thematic vein, but it is dangerous ground. If the *narrative voice* asserts both as objective truths, the reader will feel manipulated. If the *POV character* experiences it as a mystery, it becomes psychological tension.

  **What to look for in the draft:**

  1.  **Check the Narrative Voice:**
      *   *Bad:* "He smiled kindly. It was the smile of a good man. It was also the smile of a killer." (This is the rigged move. It asserts ontological certainty about two contradictory states).
      *   *Good:* "He smiled kindly. It was the sort of smile that made you trust him. But looking at him now, I wondered if that trust was the trap, or if I was just looking for traps where there were none." (This locates the contradiction in the *observer's uncertainty*, which is honest).

  2.  **Check the Payoff:**
      *   If you use the amiability to lull the reader into safety, you must pay the debt later. You cannot claim the amiability was "proof of harmlessness" to lower the stakes, and then later claim the amiability was "proof of monstrosity" to raise them.
      *   *Fix:* The amiability must be **consistently ambiguous**. It must raise the stakes *and* lower them simultaneously. The tension must be sustained, not switched.

  3.  **The "Therefore" Test:**
      *   Scan your sentences for the word "therefore" or "because" linking his amiability to his nature.
      *   If you find: "He was amiable, *therefore* he was safe," mark it.
      *   If you find: "He was amiable, *therefore* he was suspicious," mark it.
      *   If you have both in the same chapter without a shift in perspective, you are doing the rigged move.
      *   *Solution:* Change the connector. "He was amiable, *yet* I feared him." "He was amiable, *so* I lowered my guard." Let the *reaction* change, not the *proof*.

  **Summary:**
  The move you spotted is **Unfalsifiability via Interpretive Elasticity** (The Rorschach Fallacy). The historians didn't do it; the culture did to make the history digestible. It is legitimate in fiction only if it resides in the *character's confusion*, not the *author's certainty*. If your narrator knows he is both harmless and monstrous, you have a god. If your narrator doesn't know which he is, you have a story.
