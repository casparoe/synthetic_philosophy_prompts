answer: |-
  The queue shuffles forward a pace. Breath hangs in the cold air.

  **Striker:** I'm not putting the cross where I usually do.

  **Loyalist:** I guessed. You've been quiet about it all year.

  **Striker:** Not quiet. Just done. Three cycles, Martha. They've moved closer to the Tories on the policy every time. If I vote for them today, I'm signing off on it.

  **Loyalist:** So you're staying home?

  **Striker:** Spoilt ballot. Or the Greens. Doesn't matter. They can't win this seat. You know they can't.

  **Loyalist:** And you think that changes anything? Our candidate wins by nine thousand votes. Your abstention is a rounding error.

  **Striker:** It's not about the margin. It's about the price.

  **Loyalist:** The price?

  **Striker:** Think of our vote as an asset. Right now, it's unconditional. They know we'll turn up because the alternative is worse. That certainty is valuable. They spend it. They drift rightwards knowing it costs them nothing because we won't go anywhere else.

  **Loyalist:** You're saying we're too loyal.

  **Striker:** I'm saying loyalty without conditions is just subsidy. Every time you hold your nose and vote for them to keep the Tories out, you lower the price they pay for becoming worse. The ratchet turns because people like you keep feeding it.

  **Loyalist:** But how do they know? That's the mechanism, isn't it? If you stay home, the party sees a dip in turnout. They don't know why. Was it the rain? Was it flu? Did you forget?

  **Striker:** If enough of us do it, they know.

  **Loyalist:** Ah. 'Enough'. So your vote isn't decisive, but your *strategy* relies on mass coordination?

  **Striker:** It relies on signalling.

  **Loyalist:** Abstention is invisible. It's noise. If you want to signal, you have to vote for the small party. Then it's a countable number.

  **Striker:** Fine. I vote Green.

  **Loyalist:** And then what? The leadership sees a four per cent drop in the safe seats. They don't read it as discipline. They read it as 'disaffected voters we need to win back'. They spin a narrative about outreach. They spend the loss on their own terms. You haven't raised the price; you've just given them a marketing problem to solve.

  **Striker:** Better than giving them a blank cheque.

  **Loyalist:** Is it? You're betting on the seat staying safe. Boundaries change. National pictures shift. If your strategy depends on this seat remaining unwinnable for the Tories, that's a gamble, not a principle. If you help depress the turnout enough, you might just make the seat competitive. Then the Tories win.

  **Striker:** They won't win because of my spoilt ballot.

  **Loyalist:** You just argued your vote has power—that it sets a price. Now you're saying it's negligible?

  **Striker:** [Pause] It's not about causing the loss. It's about refusing complicity.

  **Loyalist:** Whose complicity? Because the costs of this drift aren't borne by you. You keep your hands clean. The people harmed by the policy—the ones facing the deportations, the cuts—they pay for your conscience.

  **Striker:** I don't want them harmed.

  **Loyalist:** But you're willing to risk the alternative to prove a point. A strategy whose burdens fall on third parties and whose benefits are speculative needs a heavier justification than 'I don't want to get my hands dirty'.

  **Striker:** It's not about cleanliness. It's about relation. If I vote for them, I stand in a certain relation to what they do. I authorise it.

  **Loyalist:** I don't believe my vote is decisive, Sarah. I never have. But I don't think the value of voting is exhausted by causality. Registering opposition to the worse option is part of what it is to stand in the right relation to *them*. Your fastidiousness is an expressive act, performed for an audience of one.

  **Striker:** And your loyalty is theatre for the benefit of your self-image.

  **Loyalist:** Perhaps. But look at the symmetry. You say the ratchet turns because we keep feeding it. But for the ratchet to work, enough people must strike. If you reason that your individual strike is negligible—which you must, because one Green vote doesn't discipline anyone—then you're using the exact same logic you condemn in me.

  **Striker:** [Stamps feet] I'm not saying my vote counts causally. I'm saying it counts morally.

  **Loyalist:** If it counts morally, it must be because it contributes to a collective signal. But if everyone reasons 'my single strike won't move the party', no one strikes. You need me to be wrong for your strategy to work. You need me to be a loyalist so your strike stands out, but you need enough loyalists to break so the party notices.

  **Striker:** I need people to stop treating their vote as a hostage negotiation where the hostages are always someone else.

  **Loyalist:** And I need people to stop treating politics as a purity test where the failure mode is the other side winning. [Shivers] God, it's cold.

  **Striker:** I suppose I concede the signal problem. If I vote Green, it's countable. But they'll still absorb it.

  **Loyalist:** Likely. And I concede the burden point. It is easier for me to vote Labour than for those harmed by the policy to survive it. I carry less weight.

  **Striker:** So we're both stuck.

  **Loyalist:** We're both here. Queue's moving.

  **Striker:** Are you still voting for them?

  **Loyalist:** Yes. You?

  **Striker:** Green. I can't authorise it.

  **Loyalist:** Then I hope you're right about the price.

  **Striker:** And I hope you're right about the safety net.

  They step forward into the hallway. The clerk checks their names. The silence returns.

  ***

  **Note**

  The Striker's case was harder to write against because the 'turnout ratchet' is intuitively compelling yet empirically slippery; it relies on party psychology rather than vote counts. The Loyalist's empirical objection is strong, but her moral argument risks sounding like consequentialism in disguise.

  The Striker is most likely mistaken about party data granularity: parties rarely distinguish between abstention and illness in safe seats. The Loyalist is most likely mistaken that expression without causality retains moral weight; if the act changes nothing, 'standing in the right relation' can resemble vanity.

  My own verdict would shift if there were empirical evidence of parties altering policy specifically due to turnout drops in safe seats rather than marginal ones. Currently, parties prioritise swing voters.

  The dialogue takes liberties with party data capabilities, assuming leadership analyses safe seat turnout drops as disciplinary rather than noise. It also tidies the duty strand, ignoring that some deontologists argue voting for a flawed party is inherently impermissible, regardless of the alternative.
