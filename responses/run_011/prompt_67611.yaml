answer: |-
  Your workflow presupposes that model selection is a risk-management exercise rather than a truth-seeking mission, treating BIC's sample-dependent penalty not as a static prior but as an asymptotic safeguard against overfitting.

  Regarding the nature of the penalty, BIC's $\log n$ term is not a prior over hypotheses in the Solomonoff or Kolmogorov sense, which would indeed be data-invariant. Instead, it arises from the Laplace approximation of the marginal likelihood, specifically from the integration over the parameter space which shrinks relative to the likelihood peak as $n$ increases. This means the statistical Occam's razor is not a single philosophical principle but a dual-purpose tool: AIC implements an instrumentalist razor (minimize future error), while BIC implements a realist razor (recover the true data-generating process). Because the BIC penalty grows with data, it reflects the increasing ability of larger datasets to distinguish fine-grained structural differences, whereas a universal prior penalizes based on description length alone. Consequently, the statistician's razor is contextual and goal-dependent, distinct from the ontological simplicity often debated in philosophy.

  Reporting both scores and defaulting to the simpler model is theoretically incoherent if viewed as a single epistemic stance, as it slides between minimizing predictive error (AIC) and maximizing posterior model probability (BIC). However, it is pragmatically coherent as a robustness check: agreement suggests the signal is strong enough to overcome penalty differences, while disagreement signals uncertainty where the simpler model acts as a conservative hedge. If you replaced this with a straight universal prior over computable models (approximated via Minimum Description Length), you would stop reporting two scores and instead report a single codelength summing model complexity and data fit. The tie-breaking rule would vanish because simplicity would be internal to the score, but you would lose the specific asymptotic guarantees of BIC and the specific predictive focus of AIC, trading them for a unified but uncomputable ideal that requires arbitrary choices about coding schemes.

  To change my mind, you would need to demonstrate that practitioners actually believe the "truth is in the set" assumption required for BIC's consistency proof, rather than simply using BIC because its heavier penalty feels safer. My analysis assumes your colleagues are implicitly instrumentalists using realist language; if they are genuine realists who believe one candidate model is literally true, then the practice is not a hedge but a confused attempt to approximate Bayesian model averaging. Alternatively, I am reading philosophy into engineering if the choice between AIC and BIC is driven solely by field-specific convention (e.g., ecology prefers AIC, psychology prefers BIC) with no regard for their derivations, making the philosophical tension irrelevant to the actual workflow.
