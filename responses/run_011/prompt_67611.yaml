  2.  **Deconstruct Question (1): BIC's Penalty and Priors:**
      *   AIC penalty: $2k$ (constant per parameter). Derived from Kullback-Leibler divergence minimization (predictive accuracy). Assumes truth is *not* necessarily in the set (M-open).
      *   BIC penalty: $k \log n$ (grows with sample size). Derived from Laplace approximation to marginal likelihood (Bayesian model evidence). Assumes truth *is* in the set (M-closed).
      *   Is BIC's penalty a prior? In the Bayesian derivation, the penalty comes from the integration over the parameter space, not explicitly from the prior over models $P(M)$, though often a uniform prior over models is assumed to get the pure BIC formula. The $\log n$ term arises from the curvature of the likelihood (Fisher information) scaling with $n$.
      *   Solomonoff/Kolmogorov priors: Based on description length ($2^{-L(M)}$). Penalty is proportional to length, not $n$.
      *   So, BIC's $\log n$ is *not* a static simplicity prior. It's an asymptotic approximation to the Bayesian evidence which inherently penalizes complexity more harshly as data accumulates to ensure consistency.
      *   Philosophical Occam's Razor: Usually framed as "do not multiply entities beyond necessity" or "simpler hypotheses are more likely true."
      *   Statistical Occam's Razor: AIC = predictive efficiency; BIC = truth recovery consistency.
      *   Conclusion: BIC's razor is not a pure a priori simplicity prior in the Solomonoff sense; it's an asymptotic consequence of integrating out parameters under the assumption of a true model. Statistical Occam's razor is instrumental (what works for the goal), whereas philosophical razor is often ontological or epistemic.

