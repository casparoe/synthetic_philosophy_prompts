answer: |-
  I understand why that hearing felt like an interrogation, and I share your discomfort with her tears. But we need to be precise about where the injury originates. It does not come from our asking whether she refused treatment; it comes from the fact that she did refuse it, and that refusal has consequences. When we decline to ask, we are not sparing her the judgment; we are simply hiding it behind a blanket subsidy that asks everyone else to absorb the cost of that specific choice. The status injury you describe is real, but it is not manufactured by the principle of responsibility. It is manufactured by the scarcity of the fund itself. If we treat the person who struggled to adhere to treatment exactly the same as the person who declined it, we are not erasing the distinction between them; we are merely telling the first person that their sacrifice counts for nothing in the distribution of collective resources.

  Your second point suggests that if we cannot investigate perfectly, we should stop investigating at all. That is a false dichotomy. We can acknowledge that our view of another person's inner life is imperfect without conceding that the view is irrelevant. Yes, we might use proxies, and yes, we might err on the side of caution when the evidence is murky. But the target of our inquiry remains the same: did this hardship arise from a path they could have reasonably avoided? If we stop aiming at that target because hitting it is difficult, we are not being humble; we are being negligent toward the other claimants. Every pound we award for a consequence of choice is a pound we withhold from someone whose ruin was truly inevitable. The paperwork does not create the choice, but it does record who pays for it.

  So let us not confuse the discomfort of the inquiry with the injustice of the outcome. You say the rule sorts people into deserving and undeserving. I say the reality of their situations already sorted them; our job is merely to read the sorting correctly. If we refuse to look, we are not being kinder. We are simply deciding that the people who managed to avoid this cliff edge should subsidize those who walked toward it. That may be a form of charity, but it is not what we were appointed to administer. We are here to insure against misfortune, not to underwrite risk. If we blur that line, we don't help the woman who cried; we just ensure that the next woman who followed the rules gets less.
