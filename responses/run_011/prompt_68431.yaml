answer: |-
  This is an exceptionally sharp observation. You have identified the central tension in the EU's constitutional architecture without needing to cite a single article number. You are asking about the *political theology* of the Union, not its black-letter law.

  Here is a reconstruction of the implicit theory of sovereignty and legitimacy embedded in the accession/opt-out/exit triad, followed by an analysis of their consistency and the institutional implications of the alternative view.

  ### 1. The Implicit Theory of Sovereignty: "Sovereignty as Commitment"

  The rule that accession requires total acceptance of the *acquis communautaire* presupposes a specific definition of sovereignty that diverges from the classical Westphalian model.

  **The Classical View:** Sovereignty is the *capacity to control*. A sovereign state is the author of the rules it obeys. If it did not write the rule, it is not bound, unless it explicitly consents to that specific rule.

  **The EU Accession View:** Sovereignty is the *capacity to commit*. A state is sovereign not because it controls every rule, but because it possesses the autonomous power to bind its future self to an external normative order.

  By forcing a candidate to accept the *acquis* without negotiation, the EU treats its legal order not as a contract between equals, but as a **pre-existing constitutional reality**.
  *   **Club vs. Contract:** It is neither a simple club (where members vote on bylaws) nor a standard contract (where terms are negotiated). It is closer to **adoption into a family** or **naturalization into a state**. You cannot negotiate the constitution of France before becoming a French citizen; you accept the Republic as it stands. The EU treats the *acquis* as an objective legal landscape that exists independently of the new member.
  *   **What this rules out:** This practice rules out the theory that the EU is a purely *international organization* created by the current will of its members. If it were purely international, new members would be co-authors of the treaty upon entry. The accession process assumes the EU has an **ontological priority** over the new member. The Order exists *before* you join it.

  **The Democratic Deficit Connection:**
  You sensed a quiet commitment here. There is. The practice assumes **Mediated Legitimacy**. It assumes that democracy happens *inside* the member state, not *inside* the EU. The logic is: "Your government negotiated your entry democratically; therefore, your submission to these rules is democratic." It treats the act of accession as a "constitutional moment" that exhausts the democratic requirement for the *structure* of the law. Ongoing legitimacy is assumed to flow through the Council (where your ministers sit), not through direct citizen authorship of specific laws.

  ### 2. Legitimacy Over Time: Founders vs. Joiners

  The discrepancy between strict entry for new members and opt-outs for old members reveals a **temporal hierarchy of sovereignty**.

  *   **The Founders (Old Members):** They are treated as possessing *Pouvoir Constituant* (constituent power). They built the house, so they get to decide where the walls go. Their opt-outs (Denmark, Ireland) are treated as part of the original architectural blueprint. Their consent is viewed as **generative**.
  *   **The Joiners (New Members):** They are treated as possessing only *Pouvoir Constitué* (constituted power). They are entering an existing structure. Their consent is **accessional**.

  **What this presupposes about consent:**
  It presupposes that consent is **not renewable** in a structural sense. For old members, the initial treaty signature acts as a "permanent credit line" of sovereignty that allows them to draw down exceptions later (e.g., Denmark voting to keep its opt-out in 2015). For new members, the credit line is spent on entry.

  This creates a two-tier theory of legitimacy:
  1.  **Historical Legitimacy:** For the core, legitimacy derives from the historical process of integration. "We made this together over 50 years."
  2.  **Conditional Legitimacy:** For the periphery, legitimacy derives from compliance. "You are legitimate members only insofar as you comply with what we made."

  ### 3. Consistency Check: Do the Three Pieces Fit?

  You asked if strict entry, flexible insider status, and rigid exit are consistent. **Philosophically, they are not.** They represent a Union living with two rival theories of membership simultaneously.

  1.  **Strict Entry (Constitutional Theory):** Implies the EU is a singular normative order. You cannot pick and choose because the laws are interdependent (the "integrity of the *acquis*").
  2.  **Flexible Insider (International Theory):** Implies the EU is a bargain between states. If it were a true constitutional order, opt-outs would be unconstitutional (violating equality before the law). The fact that Denmark can opt out of Justice and Home Affairs while Croatia cannot proves that **membership is not legally equal**; it is historically stratified.
  3.  **Rigid Exit (Binary Theory):** Article 50 (all or nothing) reinforces the Constitutional view. In a contract, you can breach specific clauses or renegotiate specific terms. In a marriage or a state, you leave or you stay.

  **The Contradiction:**
  If the EU were truly a Constitutional Order (as strict entry suggests), old members shouldn't have opt-outs (equality before the law). If the EU were truly an International Contract (as opt-outs suggest), new members should be able to negotiate terms, and exit should allow for partial withdrawal (renegotiation).

  **The Synthesis the EU lives with:**
  The Union operates on a theory of **"Asymmetric Federalism."** It pretends to be a federal order to ensure compliance (strict entry/exit) but admits it is an international bargain to ensure political survival (opt-outs). It works pragmatically, but it is theoretically unstable. It relies on the political assumption that new members want in *badly enough* to accept the inequality, and old members are *powerful enough* to demand exceptions.

  ### 4. Where is the Practice Underdetermined?

  You asked where the institutional facts look identical under two different theories. The crucial point of underdetermination is **the role of the Court of Justice (ECJ).**

  *   **Theory A (Constitutional):** The ECJ interprets a pre-existing legal order that binds states. Its rulings are discoveries of the law's internal logic.
  *   **Theory B (International/Principal-Agent):** The ECJ is an agent of the states, filling in gaps the principals (states) left open.

  When the ECJ rules that EU law has supremacy over national constitutions (e.g., *Costa v. ENEL*, *Solange* dialogues), the *action* is the same. But the *justification* differs.
  *   Under Theory A, supremacy is inherent to the nature of the EU.
  *   Under Theory B, supremacy is a functional necessity delegated by states.

  We cannot tell which is true just by looking at the rulings. We only know which theory is operative when a crisis hits (e.g., the German Constitutional Court pushing back). The accession rule *looks* like Theory A, but the opt-outs *look* like Theory B. The practice is underdetermined because the EU survives precisely by not forcing a final decision on whether it is a State-in-waiting or a Treaty-organization.

  ### 5. The Counterfactual: If Critics Were Right

  Suppose we accept the critics' view: **Legitimacy requires ongoing authorship.** Being subject to rules you had no hand in making is domination, even if you voted to join the club 20 years ago. Consent must be continuous, not a one-off historical event.

  If we took this seriously, the current institutional setup would not just need tweaking; it would require a fundamental transformation. Here is what would have to change institutionally for that to be real rather than decorative:

  1.  **The End of the *Acquis* Lock:**
      If legitimacy requires ongoing authorship, new members must be able to re-open chapters of the *acquis*. You would need a mechanism for **"Legislative Sunset Clauses"** at the Union level. Laws would expire unless re-authorized by a body that represents the current will of the citizens, not just the current will of the executives in the Council.

  2.  **Partial Exit (À La Carte Withdrawal):**
      If I am bound only because I continuously author the rules, I must have the right to stop authoring specific rules without leaving the whole project. The "all-or-nothing" exit clause would have to be replaced with a **mechanism for policy-specific opt-outs** available to all members, not just grandfathered ones. If legitimacy is ongoing, Denmark shouldn't have a permanent opt-out; every state should have a renewable one.

  3.  **Direct Citizen Initiative with Binding Force:**
      Currently, the European Citizens' Initiative is advisory. If ongoing authorship is the key, citizens would need a **binding veto or agenda-setting power** independent of the Commission. The Commission's monopoly on legislative initiative would have to be broken, as it currently acts as a filter that distances citizens from the authorship of law.

  4.  **Constitutionalizing the Right to Dissent:**
      Currently, dissent is managed through opaque Council voting or infringement proceedings. A system based on ongoing authorship would need a formalized **minority protection clause** that allows a coalition of states (or citizens) to suspend a directive's application in their territory without triggering an Article 7 sanction, provided they trigger a re-negotiation.

  **The Consequence:**
  If you implemented these changes, the EU would likely cease to function as a Single Market in its current form. The "strict entry" rule exists *because* the Single Market requires regulatory uniformity to function efficiently.
  *   **The Trade-off:** The current practice sacrifices **ongoing democratic authorship** to secure **regulatory uniformity and market stability**.
  *   **The Critics' Demand:** Sacrifices **regulatory uniformity** to secure **ongoing democratic authorship**.

  ### Summary

  The practice commits us to a theory of **"Constitutional Consent."** It assumes that sovereignty is the power to bind oneself once, irrevocably, to a normative order that then takes on a life of its own. It treats the EU as a constitutional order for newcomers (no negotiation) but an international treaty for veterans (opt-outs).

  This is inconsistent. It relies on the economic desperation of candidates to tolerate the inequality. If you shift to the "ongoing authorship" model, you break the Single Market's legal uniformity. The EU's current stability depends on *not* resolving this tension, but keeping it in a state of productive ambiguity. Your flatmate is right about leverage, but the deeper truth is that the leverage works only because the EU successfully presents itself as a Constitutional Order to the outside, while remaining an International Bargain to the inside.
