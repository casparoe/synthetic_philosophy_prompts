prompt: |-
  I'm doing a semester abroad in Leiden taking an EU law and politics course, and there's one thing about accession I can't stop chewing on. When a country joins, it has to take over the entire existing body of EU law — decades of treaties, regulations, decisions of the Court, the whole accumulated thing — chapter by chapter, and what's actually up for negotiation is basically the pace and some technical transitional arrangements. A candidate state cannot say "we'll take the single market and the competition rules but not the justice and home affairs stuff." It's presented, and I think genuinely understood by the people doing it, as non-negotiable: you accept the order as it stands or you don't come in. Meanwhile the countries already inside have picked up all sorts of carved-out exceptions over the years — Denmark kept an opt-out from the euro and a pretty rigid one from justice and home affairs (it voted in 2015 to keep that one rather than switch to a case-by-case opt-in, and only dropped its defence opt-out recently), Ireland stays outside Schengen, and Sweden has simply never entered the exchange rate mechanism, which means it can postpone euro adoption indefinitely even though the treaties treat adoption as an obligation for every member except Denmark. And there's an exit clause for leaving the whole thing, but no mechanism anywhere for a member to withdraw from one policy area. So the shape of the practice is: total acceptance on the way in, piecemeal exceptions once you're in, and all-or-nothing on the way out.

  My flatmate says this is just bargaining leverage, the incumbents are protecting themselves, but that seems like an answer about why it happened rather than about what the practice assumes. I want the second kind of answer. What view of sovereignty does a rule like this presuppose — specifically, what does it assume about whether being sovereign means being the author of the rules you're subject to, or whether it might mean something more like the capacity to bind yourself to rules someone else wrote? Is the implicit picture that the EU is a treaty among states who consent, or a standing normative order that admits new participants on its own terms, closer to a club with existing bylaws or to a contract you can only sign as drafted? And what does the fact that exceptions exist for old members but not for new ones presuppose about legitimacy over time — is consent treated as a one-off act that keeps working forever afterwards, or as something that has to be renewed? I keep having the sense that the practice is quietly committed to some answer to the democratic deficit complaint, one that nobody ever states out loud.

  So: reconstruct the implicit theory as carefully as you can, and separate what the practice strictly needs from what merely fits it comfortably — I suspect there's more than one account of sovereignty that would license the accession rule, and I want to know which ones are actually ruled out rather than just unfashionable. Then tell me whether the three pieces are consistent with each other: does the no-exceptions-on-entry rule sit comfortably with the accumulated opt-outs for insiders and the all-or-nothing exit clause, or do those three presuppose rival theories of membership that the Union is living with rather than resolving? It would help if you said where the practice is philosophically underdetermined, i.e. where the same institutional facts would look identical under two very different theories and we'd need extra evidence to tell them apart. And finally, suppose we replaced the implicit view with the one critics of the democratic deficit usually gesture at — that being subject to rules you had no ongoing hand in making is the actual problem, so legitimacy requires continued authorship and not just an initial yes. What would have to change institutionally for that to be real rather than decorative? Dont give me a list of treaty articles to read, I want the reasoning about what the practice commits us to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Semester abroad in Leiden, EU Law/Politics course. High level of sophistication (not asking for treaty articles, but for political theory/philosophy of law underlying the practice).
      *   **Core Observation:** Accession requires total acceptance of the *acquis communautaire* (no opt-outs). Existing members have various opt-outs (Denmark, Ireland, Sweden). Exit is all-or-nothing (Article 50), no partial exit.
      *   **The Question:** What implicit theory of sovereignty and legitimacy does this practice presuppose?
      *   **Specific Sub-questions:**
          1.  Sovereignty: Author of rules vs. capacity to bind oneself to external rules?
          2.  Nature of EU: Treaty among states vs. standing normative order (Club vs. Contract)?
          3.  Legitimacy over time: One-off consent vs. renewed consent?
          4.  Democratic Deficit: Is there a quiet commitment to an answer here?
          5.  Consistency: Are the three pieces (strict entry, flexible insider, rigid exit) consistent or contradictory?
          6.  Underdetermination: Where do institutional facts look the same under different theories?
          7.  Counterfactual: If we adopted the "continued authorship" theory (critics' view), what institutional changes would be *necessary* (not just decorative)?

  2.  **Initial Brainstorming & Theoretical Framing:**

      *   *Sovereignty:* The accession rule suggests a "Lockean" moment of entry (consent to be bound) but a "Hobbesian" structure once inside (sovereign power resides in the Union order). It challenges the Westphalian view of continuous sovereign equality. It looks more like "pooled sovereignty" where the pool's depth is fixed for new entrants.
      *   *Legitimacy:* The "one-off consent" model suggests a constitutionalist view (the *acquis* is a constitutional framework). The opt-outs suggest a contractualist view (states remain distinct parties). The tension is between *constitutionalism* (order precedes member) and *internationalism* (members create order).
      *   *The "Democratic Deficit" angle:* The current practice assumes legitimacy flows from *state* consent (government signing the treaty), not *citizen* ongoing participation. If legitimacy required ongoing authorship, the EP would need to be much stronger, or national parliaments would need veto powers over specific directives.
      *   *Consistency:* There is a tension. Strict entry implies the Order is supreme. Opt-outs imply the States are supreme. Rigid exit implies the Bond is indissoluble except totally. This looks like a "federation in disguise" or a *Sonderweg* (special path).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the observation. It's a classic "paradox of integration."
      *   **Part 1: The Implicit Theory of Sovereignty (Entry):**
          *   *Concept:* "Sovereignty as Commitment" vs. "Sovereignty as Control."
          *   *Analysis:* The *acquis* rule treats sovereignty as the *capacity to bind oneself irreversibly*. It assumes a state is sovereign *because* it can choose to submit to a higher order.
          *   *Club vs. Contract:* It's not a standard contract (you can't negotiate terms). It's closer to joining a Religion or a Constitutional Order. You accept the dogma/constitution. Let's call it "Accession as Constitutionalization."
      *   **Part 2: Legitimacy Over Time (Insiders vs. Outsiders):**
          *   *The Opt-out Paradox:* Why do old members get breaks?
          *   *Theory:* "Grandfathering as Historical Sovereignty." The early members *built* the house, so they own the attic. New members are *buying* the house.
          *   *Consent:* It treats consent as a "Founding Act" (constituent power) for old members, but a "Derived Act" (constituted power) for new members. This is crucial. Old members = *Pouvoir Constituant*. New members = *Pouvoir Constitué*.
      *   **Part 3: Consistency Check (The Three Pieces):**
          *   *Entry:* Rigid (Constitutional).
          *   *Insider:* Flexible (Intergovernmental).
          *   *Exit:* Rigid (Binary).
          *   *Verdict:* They are *not* fully consistent. They represent a hybrid. The EU is living with a "Dualist Sovereignty."
          *   *Underdetermination:* Where is it unclear? The role of the ECJ. Is it interpreting law or making it? Both theories fit.
      *   **Part 4: The Democratic Deficit & The Counterfactual:**
          *   *Current Implicit View:* Legitimacy is indirect (via states).
          *   *Critics' View:* Legitimacy requires ongoing authorship.
          *   *Institutional Changes:* If we take critics seriously, mere EP elections aren't enough. We need:
              1.  Right to disaggregate (partial exit).
              2.  Citizen initiatives with binding force.
              3.  Re-negotiation clauses (sunset clauses on laws).
              4.  Basically, turning the EU into a true Federal State or dissolving it back into a loose trade bloc. The current middle ground relies on the "one-off consent" theory.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Avoid saying "The EU is a state." It's not. But the *practice* mimics a federal constitutional order for entrants.
      *   *Nuance:* The user asked about "what the practice strictly needs" vs "what fits comfortably." I need to distinguish between logical necessity and political convenience.
      *   *Strict Need:* To preserve the integrity of the Single Market, the *acquis* must be uniform. That's functional.
      *   *Philosophical Need:* To maintain the authority of the Court, the law must appear pre-existing and objective, not up for negotiation.
      *   *Opt-outs:* These are politically necessary but philosophically damaging to the "Constitutional" view. They reveal the "International Treaty" view underneath.
      *   *Exit:* Article 50 being all-or-nothing reinforces the "Marriage" metaphor rather than "Business Partnership."

  5.  **Final Polish:**

      *   Ensure the tone is academic but accessible (Leiden law student level).
