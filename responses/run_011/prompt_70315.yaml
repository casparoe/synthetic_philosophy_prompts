  Here are three quick diagnoses I'm weighing before settling on a principle. First, you might be distinguishing between *incommensurable values* (career, dating) where no common metric exists, versus *commensurable but blurry values* (hiring, strangers) where a metric exists but the boundary is fuzzy. Second, the split could be about *agency*: in some cases (career, dating) you create the reason by choosing, while in others (hiring, apartments) you discover a reason that was already there. Third, it might simply come down to how the "small improvement principle" behaves: does a tweak force a verdict immediately, eventually, or never? The trouble is Case 3 (apartments) looks like Case 1 (career) structurally but behaves oppositely, which threatens to collapse the whole system unless we clarify the starting relationship between the options.

  Here is the principle I extract from your gut verdicts. I call it the **Sensitivity-to-Accumulation Principle**.

  **The Principle:**
  When faced with a choice where neither option is clearly better, apply a small improvement to one side.
  1.  **Equality:** If the options are initially equal in value, a small improvement makes the improved option definitively better. This is not a hard choice; it is a calculation.
  2.  **Parity:** If the options are initially "on a par" (neither better nor equal), small improvements—even accumulated ones—fail to make one definitively better. The choice is resolved by your will, not by finding a fact.
  3.  **Vagueness:** If the options are comparable but the boundary is vague, small improvements initially fail to settle the choice, but sufficient accumulation *will* eventually make one definitively better. The choice is resolved by discovering a fact that exists independently of your will.

  The diagnostic test is this: **Does adding more of the same good eventually force a verdict?** If yes, it's Vagueness. If no, it's Parity. If even a tiny bit forces a verdict immediately, it's Equality.

  Now, let's be blunt about how this handles your six cases.

  **Does it get all of them?**
  Mostly, yes, but it requires us to be precise about Case 6. Cases 1 and 5 are **Parity**. The values (security vs. art, person vs. person) are qualitatively different. Adding a grant (more money) doesn't solve the category mismatch. The "leftover pull" confirms this; the road not taken remains live because it wasn't *worse*, just unchosen.
  Cases 2, 4, and 6 are **Vagueness**. In 2 (hiring), publications stack up until B wins. In 4 (betrayal), the severity stacks up until the deal is off. In 6 (loved one vs. strangers), you say "neither is better" initially, but adding a sixth stranger shifts it. This sensitivity to numbers proves there is a fact of the matter lurking beneath the vagueness. It is not Parity; it is a blurry threshold.
  Case 3 (apartments) is **Equality**. It is not a hard choice.

  **The Price of Keeping Them All:**
  The price you pay is admitting that Case 6 feels like Parity but isn't. You said "neither is better" for the loved one vs. five strangers. My principle says that if the sixth stranger shifts the balance, there *was* a fact of the matter all along, you just couldn't see it clearly. If you insist there is *no* fact of the matter even with the sixth stranger, you break the principle. But your verdict ("genuinely shifts things") suggests you believe the numbers matter. So I'm keeping your verdicts, but I'm reclassifying Case 6 from "Parity" to "Vagueness." The cost is accepting that some moral permissions feel like parity but are actually vague facts.

  **The Contradiction Between 1 and 3:**
  You say 1 (career) and 3 (apartments) look structurally identical: Base Option vs. Base Option + Small Bonus. You give opposite verdicts.
  Here is the charitable account: They are not structurally identical because the *initial relation* is different. In Case 3, you stipulated the apartments are "identical in every respect except." That is **Equality**. In Equality, the Small Improvement Principle always holds. A + epsilon > A.
  In Case 1, you stipulated the careers are "neither better... [and] aren't equally good either." That is **Parity**. In Parity, the Small Improvement Principle fails. A + epsilon is not necessarily > B.
  So the contradiction is illusory. You are applying the Small Improvement test to two different starting states. If you treated the careers as equal (e.g., two identical job offers), the grant would settle it. If you treated the apartments as on a par (e.g., one has a bigger closet, the other has better light), the closet size might not settle it. Keep both verdicts, but acknowledge the baseline difference.

  **The Leftover Pull in 5:**
  Do not treat this as noise. It has high diagnostic value. The "pull" is the phenomenological signature of **Parity**. When you choose based on facts (Vagueness or Equality), the unchosen option is revealed as inferior or equal-but-passed-over. There is no residue. When you choose based on will (Parity), you create the reason for your choice. The unchosen option remains valid because it was never falsified. If you feel the pull, you are in Parity territory. If you feel nothing (like in Case 2), you are in Vagueness/Equality territory. Trust the pull.

  **Prediction: Kindness vs. Happiness:**
  You ask about becoming a slightly kinder person vs. becoming a slightly happier one.
  My prediction: This is **Parity**. Kindness and happiness are distinct values, like art and security. A small improvement in kindness (a bit more patience) will not definitively settle the choice against a small improvement in happiness (a bit more leisure). You will not find a fact that makes one better. You will have to commit to one vision of a life over the other. If you try to accumulate kindness enough to outweigh happiness, you might find you've become a martyr rather than a good person. The choice will remain yours to make, not discover. Expect the "pull" if you choose happiness; don't interpret it as regret.

  **Do We Need a Third Category?**
  I am arguing you **do not** need a third category for *hard choices*. Your tentative principle had two: Parity and Vagueness. I am keeping those.
  However, you must recognize **Equality** as a third category of *comparison*, even if it doesn't produce hard choices. Case 3 proves that without it, you can't explain why the small improvement works there but not in Case 1.
  Some might argue Case 4 (betrayal) needs a third category called "Lexical Thresholds" because it involves a hard stop ("no number gets me there"). But I'd argue this is just extreme Vagueness. The boundary is sharp in principle but inaccessible in practice. Collapsing it into Vagueness keeps your principle cleaner. The cost is admitting that "forbidden" trades are just trades where the counter-weight required is so high it's practically unreachable.
  So, stick to two kinds of hard choice (Parity vs. Vagueness), but use Equality as the control group to calibrate your test. If you do that, your principle holds.
