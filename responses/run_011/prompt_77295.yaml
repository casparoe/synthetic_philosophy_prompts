prompt: |-
  I'm teaching an upper-level metaphysics seminar, 90 minutes, about 18 students, and we've just finished the reading on whether virtual objects are real. Rather than lecture my view at them I want them to run into the problem. Here's the rough shape — build it out properly:

  The class sits as an insurance tribunal with one fixed pot of money and six claim cards describing losses. Three physical, three virtual, written as matched pairs so the only difference between each pair is the substrate (e.g. an heirloom chair destroyed in a fire vs. a sword stolen from someone's account and resold for cash). They have to put a number on each claim, and the pot is finite, so they can't be generous across the board — they'll have to demote somebody. Then partway through they should discover that two of the cards were the *same* loss described twice, once in physical language and once in virtual, and that they priced them differently.

  Give me the six cards verbatim, the rules and timing, how the reveal is sprung, and a debrief that walks from their own numbers to the general point: whatever criterion demotes the sword would demote the chair too if we might be living in a simulation, so either the criterion is unusable or the harm was never about the substrate in the first place. Also tell me what predictably goes wrong the first time I run it — I'm bracing for the "but it's litterally just code" kid — and be honest about which part of the view the activity can't actually deliver and I'll have to supply myself. No names, no thesis statements, nothing on the cards until the debrief.
