answer: |-
  ### Scholar's Memo: Refining the Research Question

  Your intuition regarding the "labor of carrying" is strong because it shifts memory studies from a semiotic analysis (what does the monument *mean*?) to a materialist one (what does the memory *cost*?). However, your current draft risks conflating "labor" with "permission." If the state allows the labor, is it not just a proxy for state will? To secure the fellowship, you must decouple these variables. Here are three ways to sharpen the question:

  1.  **The Materialist Frame:** *How does the physical maintenance cost of a memory site correlate with its longevity?*
      *   *Critique:* Too engineering-focused. It ignores the social risk involved in scrubbing a stone in a hostile environment.
  2.  **The Agency Frame:** *Who performs the work of memory maintenance in the absence of state support?*
      *   *Critique:* Descriptive rather than explanatory. It identifies actors but doesn't explain *why* some efforts survive and others vanish.
  3.  **The Political Economy Frame (Recommended):** *Under what conditions does the decentralization of memory maintenance labor predict persistence better than the intensity of state endorsement, and how does state-imposed friction alter this calculus?*
      *   *Why:* This allows you to treat "state will" not as the source of memory, but as a variable that alters the *cost* of private labor. It accommodates your Germany/South comparison (low cost/high distribution vs. high cost/centralized) and your Turkey complication (state labor actively raises the cost of private carrying).

  **Recommendation:** Adopt the third framing. It transforms your hunch into a testable hypothesis about friction and distribution. It allows you to argue that "Vergangenheitsbewältigung" succeeded not because of moral superiority, but because it lowered the transaction costs of private memory work.

  ***

  ### Fellowship Proposal

  **Project Title:** The Labor of Carrying: Maintenance Regimes and the Durability of Contentious Memory
  **Duration:** Nine Months
  **Applicant:** [Name]

  **Research Question**
  Does the resilience of contentious public memory depend more on the decentralization of maintenance labor than on the intensity of state endorsement, and how do regimes of enforced silence alter this calculus?

  **Intervention: Beyond Political Will**
  Comparative memory studies currently relies on a "verdict model" of political will. Standard typologies classify regimes by their official stance: Germany achieved *Vergangenheitsbewältigung* (coming to terms with the past); Japan and Turkey are characterized by denial or amnesia; the American South is in transition. This framing treats memory as a function of state authorization. It assumes that if the state apologizes, memory persists, and if the state denies, memory collapses.

  This model cannot explain the empirical anomalies I have observed. In the American South, the removal of a Confederate monument (a shift in state will) did not end the memory; it merely displaced the labor. The bare plinth became a site of informal maintenance (flowers, notes) until the state intervened physically (repaving). Conversely, in Germany, *Stolpersteine* (stumbling stones) persist not because they are state-mandated, but because the labor of cleaning them is distributed among neighbors and school classes. The standard model treats these as issues of "acknowledgment." I argue they are issues of **infrastructure**. Monumental, state-funded memory is brittle; it relies on a single point of failure (the budget office or the mayor's office). Dispersed, low-cost, redundantly reproduced carriers are antifragile. They survive hostile successor governments because the cost of extinguishing them exceeds the state's capacity for surveillance.

  **Methodology**
  This project employs conceptual work grounded in comparative case analysis. Survey data is ill-suited to measure maintenance labor, which is often informal, tacit, or illicit. Straight historiography risks getting bogged down in the specific *content* of the memory rather than the *mechanics* of its transmission.

  I will conduct a tripartite analysis of memory sites in:
  1.  **The American South:** Post-removal landscapes (e.g., the repaved square) where state withdrawal created a vacuum filled by informal labor, followed by state erasure of that labor.
  2.  **Germany:** The *Stolpersteine* network, where the state provides the legal framework, but the physical labor is privatized and decentralized.
  3.  **Turkey:** Sites of enforced non-commemoration (e.g., Armenian sites), where the state actively expends labor to prevent private carrying.

  I will code these cases not by their political narratives, but by their **maintenance economies**: Who scrubs the stone? Who pays for the plaque? What is the social risk of being seen doing so?

  **Addressing the Complication: Enforced Non-Commemoration**
  Turkey presents a critical stress test for this hypothesis. If memory durability relies on distributed labor, Turkey should be a vacuum. However, it is not empty; it is actively patrolled. Here, the state engages in "negative labor"—scrubbing graffiti, prosecuting speakers, paving over sites.

  My project handles this by reframing the hypothesis: Durability is determined by the ratio of **carrying labor** to **suppression labor**. In Germany, carrying labor is cheap and suppression labor is non-existent. In the American South, carrying labor is moderate, but suppression labor spikes intermittently (e.g., the repaving). In Turkey, the state raises the cost of carrying labor to prohibitive levels through legal and physical friction. This nuance prevents the theory from collapsing into a simple measure of state tolerance. It acknowledges that silence is not a lack of activity, but a result of high-cost suppression.

  **Deliverable**
  Academic monographs often end at critique. This fellowship will produce a **Framework for Sustainable Memory Infrastructure**, designed for municipal planners, transitional justice practitioners, and community organizers.

  When a monument comes down, the standard question is: "What should we build instead?" This leads to new monuments and new vulnerabilities. My deliverable will offer a decision matrix asking: "Who will maintain this in ten years?" It will argue against high-cost, single-site solutions in polarized environments and propose low-cost, distributed alternatives (digital archives, dispersed markers, curricular integration) that distribute the risk of maintenance. The goal is to move practitioners from designing *symbols* to designing *systems*.

  **Conditions of Failure**
  I must acknowledge two specific ways this project could fail to yield independent explanatory purchase:
  1.  **Redescription Risk:** If "distributed labor" turns out to be merely a synonym for "state tolerance," the theory adds no value. If the state allows neighbors to scrub stones only because it agrees with the memory, then labor is still downstream of political will. I will test this by looking for instances where private carrying persists *against* state indifference or mild hostility.
  2.  **Content Irrelevance:** If the *type* of memory (e.g., trauma vs. pride) dictates durability regardless of labor distribution, my materialist focus is misplaced. A site of deep trauma might generate infinite volunteer labor, while a site of mild regret generates none, regardless of infrastructure. I will control for this by comparing sites of similar emotional valence across the three regions.

  **Scope Assessment**
  Nine months is sufficient to finalize the conceptual framework and complete the comparative analysis of the three selected regions, provided I rely on existing ethnographic and historical records rather than new fieldwork. I will not attempt a global survey. The risk is over-generalizing from three specific contexts. To mitigate this, I will limit claims to "contentious memory in democratic or hybrid regimes," excluding totalitarian contexts where private labor is physically impossible. The deliverable will be drafted as a white paper suitable for both academic publication and policy circulation.

  This project moves memory studies from the question of *truth* (what happened) to the question of *sustainability* (what lasts). By focusing on the labor of carrying, we may find that memory survives not because it is officially honored, but because it is cheap to keep.
