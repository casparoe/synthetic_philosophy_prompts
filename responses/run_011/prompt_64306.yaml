answer: |-
  **JOINT STATEMENT ON COMMEMORATIVE ALLOCATION AND THE COMPARABILITY OF ATROCITY**

  **Issued by:** The Advisory Council on Memorial Distribution
  **Date:** October 26, 2023
  **Subject:** Framework for Resource Allocation Among Commemorated Atrocities

  **Preamble**
  We, the undersigned advisers to the National Memorial Foundation, acknowledge a profound tension in our mandate. We are tasked with allocating fixed exhibition space and prevention funding among distinct historical atrocities. One party holds that justice requires allocation to track an objective hierarchy of severity (the *Comparativist* position). The other holds that such hierarchy is either conceptually incoherent or morally hazardous (the *Incomparabilist* position).

  Recognizing that indecision paralyzes commemoration just as much as error, we enter this adversarial collaboration to isolate the precise points of divergence. We agree that memory must be dignified, facts must be honored, and resources must not be wasted. The following document outlines our shared factual ground, our specific disagreements, and the empirical or philosophical cruxes that, if resolved, would alter our respective positions.

  ***

  ### I. Agreed Claims Regarding Comparative Dimensions
  Both parties accept the following claims regarding the data available for decision-making. We agree that these factors are relevant inputs, though we disagree on whether they can be aggregated into a single metric.

  1.  **Victim Counts:** Quantitative data on mortality and displacement is factual and necessary, but raw numbers alone do not exhaust the moral significance of an event.
  2.  **Intent:** The specific intent of perpetrators (e.g., total eradication vs. subjugation vs. collateral damage) is a distinct moral variable that must be documented.
  3.  **Methods:** The cruelty or innovation of killing methods constitutes a relevant dimension of suffering, independent of the final death toll.
  4.  **Duration:** The temporal span of an atrocity affects the structural depth of trauma but does not linearly correlate with severity (e.g., a short, intense extermination vs. a prolonged oppression).
  5.  **Aftermath:** The enduring political, ecological, and generational consequences are valid considerations for prevention funding, distinct from historical commemoration.
  6.  **Survivor Testimony:** First-person accounts are authoritative regarding the *experience* of suffering, but aggregating testimony into a comparative score risks instrumentalizing individual pain.

  ***

  ### II. Table of Disagreements
  The following table contrasts the core theses. Each side has drafted the wording to ensure it accurately reflects their own commitment and their steel-manned characterization of the opponent.

  | Disputed Thesis | Comparativist Formulation (Adviser A) | Incomparabilist Formulation (Adviser B) |
  | :--- | :--- | :--- |
  | **Ontology of Evil** | Atrocities possess intrinsic properties of "severity" that allow for a roughly cardinal ordering, akin to measuring magnitudes of earthquake or disease burden. | Atrocities are qualitatively distinct kinds of moral rupture; attempting to measure them on a single scale is a category error (like comparing the "weight" of a poem to a stone). |
  | **Moral Risk** | Failing to rank atrocities implicitly equates them, which distorts historical truth and misallocates prevention resources where they could save the most lives. | Ranking atrocities creates a "hierarchy of suffering" that demeans victims of "lower" ranked events and implicitly licenses the "lesser" evil as acceptable. |
  | **Allocation Logic** | Distribution of space and funding should be proportional to the established severity ranking to maximize moral fidelity and utilitarian prevention. | Distribution should be pluralistic, ensuring minimum thresholds of dignity for all, guided by specific contextual needs (e.g., urgency, obscurity) rather than global severity. |

  ***

  ### III. The Cruxes
  We have identified three sub-questions (cruxes) whose resolution would force at least one party to revise their stance. We distinguish between the *Conceptual* objection (it cannot be done) and the *Moral* objection (it should not be done), and address the scope of the ranking.

  #### Crux 1: The Conceptual Possibility of Stable Ordering
  **Question:** Is "severity" a stable property that emerges from human moral intuition, or is it a construct that collapses under scrutiny?

  *   **Diagnostic Exercise:** A blind paired-comparison trial. Diverse lay panels (historians, ethicists, survivors) are asked to rank 20 distinct atrocities by severity. The order of presentation is permuted randomly across multiple groups to test for framing effects.
  *   **Predictions:**
      *   *Adviser A:* Rankings will show high statistical convergence (Kendall's W > 0.7), indicating a shared underlying moral reality.
      *   *Adviser B:* Rankings will show high variance dependent on permutation and panel composition, indicating context-dependence rather than objective severity.
  *   **Diagnostic Agreement:**
      *   *If High Convergence:* Adviser A claims this proves objectivity. Adviser B concedes this proves *shared cultural bias* but maintains this does not equal *moral truth*. **(Note: The parties do NOT agree on what a positive result shows. A sees truth; B sees consensus.)**
      *   *If High Variance:* Adviser A admits the metric is unreliable for precise cardinal allocation. Adviser B views this as vindication of the conceptual objection.

  #### Crux 2: The Moral Impact on Victim Communities
  **Question:** Does public ranking cause net harm (demeaning/licensing) or net benefit (truth-telling/resource targeting)?

  *   **Diagnostic Exercise:** A controlled pilot of two memorial wings. Wing X displays atrocities with explicit severity rankings and proportional space. Wing Y displays atrocities with equal space and thematic (non-hierarchical) organization. Surveys measure feelings of "dignity," "recognition," and "anger" among visiting survivor communities.
  *   **Predictions:**
      *   *Adviser A:* Communities associated with high-severity events will feel validated; communities associated with low-severity events will accept the historical distinction.
      *   *Adviser B:* Communities associated with "lower" ranked events will report feelings of erasure; communities associated with "higher" ranked events will report discomfort at the commodification of their trauma.
  *   **Diagnostic Agreement:**
      *   *If Net Harm Reported:* Adviser A agrees to abandon public ranking for moral reasons, even if conceptually possible. Adviser B views this as confirmation of the moral prohibition. **(Note: The parties AGREE on what this result shows: moral prohibition trumps conceptual possibility.)**
      *   *If Net Benefit Reported:* Adviser B maintains that "feelings" do not negate the metaphysical error, but agrees to policy adjustment for pragmatic peace.

  #### Crux 3: Context-Invariant vs. Purpose-Relative Severity
  **Question:** Is "severity" an intrinsic property of the event, or is it relative to the Foundation's specific goal (e.g., Mourning vs. Prevention)?

  *   **Diagnostic Exercise:** The Foundation creates two distinct budgets: one for *Historical Exhibition* (Mourning/Truth) and one for *Prevention Funding* (Policy/Intervention). Advisers are asked to allocate funds separately for each bucket.
  *   **Predictions:**
      *   *Adviser A:* The allocation ratio will remain roughly consistent across both buckets, because the severity of the atrocity is intrinsic to the event, not the budget's purpose.
      *   *Adviser B:* The allocation will shift significantly (e.g., a lower-death-toll but high-recurrence-risk event gets more Prevention funding; a high-death-toll closed event gets more Exhibition space), proving "severity" is purpose-relative.
  *   **Diagnostic Agreement:**
      *   *If Allocations Diverge:* Adviser A concedes that "severity" is not a single cardinal number but a vector of weights dependent on goals. Adviser B claims this proves there is no single "severity" to rank. **(Note: The parties AGREE on what this result shows: The concept of a single, context-invariant ranking is untenable.)**
      *   *If Allocations Converge:* Adviser B concedes that for practical purposes, a proxy ranking functions effectively. Adviser A views this as confirmation of intrinsic severity.

  ***

  ### IV. Conclusion: Verbal vs. Substantive Disagreement

  Upon drafting this statement, we identify a significant **verbal dispute** regarding the definition of "Severity."

  *   **Verbal Component:** If Adviser A defines "severity" merely as *"the weight assigned for the purpose of resource allocation,"* then Adviser A is tautologically correct (we must assign weights to allocate resources). If Adviser B defines "ranking" as *"claiming one group of victims suffered more than another in the eyes of God,"* then Adviser B is tautologically correct (such judgment is hubristic).
  *   **Substantive Component:** Once these definitions are standardized, a **surviving substantive disagreement** remains regarding the *algorithm of allocation*.
      *   Even if we agree "severity" is purpose-relative, Adviser A insists the *primary* weighting factor must be harm magnitude (death/suffering).
      *   Adviser B insists the *primary* weighting factor must be equity of recognition (ensuring no narrative is marginalized by scale).

  **Resolution Path:** We agree to proceed with allocation using a **Multi-Criteria Decision Analysis (MCDA)** model. This model will explicitly separate "Harm Magnitude" (satisfying Adviser A's demand for factual tracking) from "Recognition Equity" (satisfying Adviser B's demand against hierarchy). The final weights assigned to these criteria will be determined by the Board, informed by the results of the Crux exercises above.

  **Signed,**

  *Adviser A (Comparativist)*
  *Adviser B (Incomparabilist)*
