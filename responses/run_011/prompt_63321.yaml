answer: |-
  **MEMORANDUM**

  **TO:** Selection Committee, Institute for Conceptual Biology
  **FROM:** External Advisor
  **SUBJECT:** Ranking of Research Questions for Postdoctoral Appointment
  **DATE:** October 26, 2023

  This memo addresses the prioritization of research questions for the upcoming two-year postdoctoral position. The mandate is specific: produce conceptual work on the units-of-selection debate that working biologists will cite. The constraint is equally specific: the appointee has no data-generation capacity but possesses two high-value collaborative channels—experimental evolution of yeast clusters and cancer genomics.

  My recommendation prioritizes questions that leverage these specific empirical anchors. A project that remains purely abstract will fail the "biologist citation" metric; a project that becomes purely empirical will fail the "conceptual result" metric. The ranking below reflects a strategy to thread this needle, explicitly trading off the immediate accessibility of cancer biology for the broader theoretical integration offered by comparative individuality.

  **The Special Case: Question 1 (Deflationism)**
  Question 1 should not be on the list of research targets; it is a background crux that conditions the entire project. The deflationary reading—that level attributions are merely bookkeeping choices—threatens to moot Questions 2 through 6. If all level attributions are pragmatically equivalent, asking whether group fitness is causal (Q2) or whether cancer makes the organism leaky (Q5) becomes a question of utility rather than ontology.

  However, treating Q1 as the primary research question is a trap for a two-year postdoc. It invites internal philosophical debate rather than biological engagement. Biologists generally operate as realists about levels; a project concluding "it's all pragmatic choice" risks being dismissed as unhelpful. I advise the committee to instruct the appointee to treat non-deflationism as a working assumption. The project should proceed as if levels are real, using Q1 only as a boundary check. If the appointee finds that the yeast or cancer data force a deflationary conclusion, that is a result; but aiming for it initially sacrifices the traction needed to engage the collaborators.

  **Primary Recommendation: Question 3 (Marks of Individuality)**
  This question should be the primary mandate. It asks whether standard criteria for evolutionary individuality (bottlenecks, division of labour, low conflict) are necessary or merely typical.

  *Worth Two Years:* This question is the only one that fully utilizes both collaborators. The yeast group is engineering multicellularity via settling selection; they are effectively watching the *origin* of individuality marks in real-time. Does a bottleneck emerge? Is conflict suppressed? The cancer group studies the *breakdown* of these marks. By framing the project around the stability and necessity of these criteria, the postdoc creates a unified theoretical framework that connects the yeast experimentalist's construction of collectives with the oncologist's observation of their disintegration.

  *Tractability:* Highly tractable for a philosopher. It requires analyzing the experimental design and genomic data for conceptual categories, not generating new data.

  *Success vs. Failure:* Success looks like a refined set of criteria for individuality that the yeast group uses to define their "snowflake" clusters and the cancer group uses to classify tumour progression stages. Failure looks like a typology that simply restates existing biological definitions without clarifying edge cases.

  *Future Developments (3–5 Years):* This question moves up if the yeast experiments produce stable multicellular lines that lack a clear single-cell bottleneck, forcing a conceptual revision of the life-cycle requirement. It moves down if the cancer genomics field converges on a purely ecological model of tumours that abandons "individuality" talk entirely. The project stalls if the appointee gets bogged down in defining "conflict" without referencing the specific genomic signatures the collaborators can provide.

  **Secondary Recommendation: Question 5 (Cancer and Somatic Evolution)**
  This should be the secondary focus, or the primary focus only if the candidate lacks the breadth to handle Q3.

  *Worth Two Years:* It targets a high-interest area for biologists. The question of whether the organism remains a unit of selection when somatic lineages compete is urgent in oncology.

  *Tractability:* High, given the cancer genomics collaborator. However, it risks isolating the yeast collaborator, wasting half the institute's investment in the position's infrastructure.

  *Success vs. Failure:* Success is a conceptual distinction between "healthy" somatic evolution and "pathological" somatic evolution that aids in modelling treatment resistance. Failure is a philosophical restatement of what tumour phylogeneticists already model regarding clonal interference.

  *Future Developments:* This rises if single-cell sequencing reveals distinct somatic lineages acting as clear units of selection within the host. It stalls if the conceptual work merely adds vocabulary to existing evolutionary models of therapy resistance without altering experimental design.

  **Remaining Ordering**
  **3. Question 2 (Group Fitness: Causal vs. Aggregate).** This is foundational but too abstract for the "biologist citation" goal on its own. It should be pursued only insofar as it clarifies Q3. If the appointee cannot distinguish causal group fitness from aggregate individual fitness in the yeast system, Q3 cannot be answered.
  **4. Question 4 (Intra-genomic Conflict).** While relevant to somatic evolution, this is historically tied to germline selfish elements (transposons, etc.). It is less central to the specific yeast settling experiments and risks drifting into general evolutionary genetics rather than the units-of-selection debate proper.
  **5. Question 6 (Cultural Group Selection).** This should be removed from the list entirely.

  **Addressing the Committee's Inclination Toward Question 5**
  The committee favors Question 5 as the shortest route to a biologist audience. I understand this instinct: cancer biology is high-stakes and well-funded. However, for this specific postdoc, prioritizing Q5 over Q3 is a strategic error.

  Q5 isolates the appointee to one collaborator. It ignores the unique opportunity provided by the experimental evolutionist. The yeast system offers a controlled environment where the *variables* of individuality (bottlenecks, conflict) can be manipulated. Cancer offers only observational data of natural breakdown. A conceptual result derived from Q3, which synthesizes the *construction* of individuality (yeast) with its *deconstruction* (cancer), will be theoretically richer and citeable by a broader range of evolutionary biologists, not just oncologists. Q5 risks producing a niche result for cancer modellers; Q3 produces a result for evolutionary theory that uses cancer as a key test case.

  I recommend removing **Question 6** from the list altogether. It is a dead end for this specific appointment. The postdoc has no capacity to evaluate cultural transmission data, and the collaborators cannot assist. Pursuing Q6 would require the appointee to ignore their standing collaborators to seek new partnerships in the social sciences, violating the operational constraints of the position. It dilutes the focus and offers no empirical traction within the institute's ecosystem.

  **Trade-Offs**
  In ranking Q3 above Q5, I am trading off immediate audience size for theoretical longevity. Q5 guarantees an audience in oncology; Q3 aims for evolutionary biology broadly. There is a risk that Q3 is too ambitious for two years. If the appointee struggles to unify the yeast and cancer systems, they should retreat to Q5. However, the committee should hire for the capacity to handle Q3.

  Furthermore, I am trading off metaphysical safety for biological utility. Q2 (Causal vs. Aggregate) is the safer philosophical bet, but Q3 (Marks of Individuality) is the safer biological bet. Biologists care less about the ontology of fitness and more about how to identify the units they are studying. By focusing on the marks of individuality, we answer the biologist's operational question ("Is this cluster an individual?") rather than the philosopher's ontological question ("What is the nature of group fitness?").

  **Conclusion**
  The appointment should be advertised with Question 3 as the primary aim, with Question 5 as the immediate empirical domain. Question 1 is a boundary condition, not a goal. Question 6 must be excised to prevent scope creep. This ordering maximizes the unique collaborative assets of the institute while ensuring the output remains conceptual work that resolves empirical ambiguities for the partners.
