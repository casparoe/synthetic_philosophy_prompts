answer: |-
  **The Drift Audit**

  The air in the cupping room was always sixty-eight degrees, scrubbed of ozone and perfume. It smelled of nothing, which was the point. On the table sat twelve white bowls, arranged in a grid. Inside each was the same slurry: ground beans from Lot 44-B, harvested in 1998, frozen in nitrogen, and thawed precisely four hours before evaluation. This was the Anchor. It could not change. The freezer logs proved it. The chemical assays proved it.

  Elias dipped his spoon, slurped loudly to aerate the brew across his palate, and spat into the bucket. He wrote on his tablet: *Bright. Citrus forward. Hint of cedar.*

  Sarah sat three seats down. She slurped, winced, and spat. She wrote: *Bright. Citrus forward. Hint of cedar.*

  She had written those exact words every week for three years. She also hadn't been able to keep breakfast down on Tuesdays for six months.

  In the observation booth behind the glass, Marcus watched the timers. He was the lead for Quality Assurance, but lately, he'd become the warden of the Drift Audit. The Audit was his invention, born from a budget surplus and a fascination with semantic vector spaces. The idea was simple: if the coffee never changes, and the tasters are calibrated instruments, their descriptions should remain stable. Not just in score, but in topology. The words should occupy the same region of meaning.

  He fed the weekly descriptions into the model. The model didn't know coffee; it knew distance between tokens.

  Later, in the conference room, the projector hummed. A scatter plot glowed on the wall. Blue dots clustered tightly. One red line spiraled outward.

  "Elias," Marcus said, pointing to the spiral. "Over eighteen months, your semantic centroid has migrated forty percent of the total variance in the dataset. You're describing the Anchor as if it's a completely different bean."

  Elias leaned back in his chair, rubbing his temples. He looked tired, but not distressed. "I told you. It tastes like the coffee. It tastes like 44-B."

  "But you called it 'earthy' last month," Marcus said. "Today you called it 'bright.' Those are orthogonal vectors."

  "Words get stale," Elias said. "If I say 'earthy' every week for five years, I stop knowing what I mean by it. So I find a new word. The taste is the same. The label needed washing."

  Sarah picked at a hangnail. She hadn't looked at the screen. "I used the same words," she said quietly.

  Marcus turned to her. "Your vector stability is ninety-nine percent. You are the most consistent instrument in the lab."

  "I hate it," Sarah said. "It tastes like copper now. It tastes like biting a battery. But I know what I'm supposed to say. I know the profile. So I write the profile."

  Julian, the senior sensory lead, sat in the corner. He was older than the rest, hired back when panels were run with clipboards and consensus rather than algorithms. He hadn't spoken yet. He was watching Elias, then Sarah, then the graph.

  "So," Marcus said, tapping the table. "We have a divergence. Elias's reports drift, but he insists the experience is stable. Sarah's reports are static, but she insists the experience has degraded. The Audit flags Elias as compromised. His internal state is drifting relative to the Anchor."

  "My internal state is fine," Elias said. "My vocabulary is just alive."

  "Yours is dead," Sarah muttered.

  "Stop," Julian said. The word was soft, but it cut through the hum of the projector. He stood up and walked to the screen, blocking the light. "You're treating the report as a transcript. You think the words are a direct feed from the tongue to the database."

  "It's the only data we have," Marcus said. "We can't download their tongues."

  "That's exactly the problem. You're measuring the latency of the description, not the fidelity of the sensation." Julian turned to Elias. "When you say 'bright' instead of 'earthy,' are you forcing the taste to fit the word, or does the taste actually feel different?"

  "It feels like coffee," Elias said. "The word is just a handle. Sometimes I need a different grip."

  Julian turned to Sarah. "And you? You write 'citrus' but you taste copper."

  "If I write 'copper,' I fail the calibration," Sarah said. "If I fail calibration, I'm off the panel. If I'm off the panel, I don't have health insurance. So I write 'citrus.' The model sees stability. You see reliability. I see lying."

  Marcus stepped around Julian to face the room. "This is why we need the Audit. Subjective certainty is useless. Sarah *feels* like she's changed, but her output is stable. Elias *feels* stable, but his output is changing. Which one do we trust? The feeling or the function?"

  "The function gets you paid," Julian said. "It doesn't get you truth."

  "We don't sell truth," Marcus snapped. "We sell consistency. If the consumer buys a bag today and a bag in five years, they want the same thing. If Elias's language drifts, it suggests his discrimination threshold is shifting. He might miss a real defect because he's busy redefining 'nutty.'"

  "I haven't missed a defect in ten years," Elias said.

  "Because you're guessing," Marcus said. "You're adapting your language to maintain the illusion of stability while your perception rots."

  "My perception isn't rotting. My access to it is just... complicated." Elias looked at his hands. "Look, remember the color thing? The neuroscientist who inverted his vision slowly? If you change the lens gradually enough, the brain corrects. You never see the world flip. You just see the world. If my language drifts slowly enough, maybe I'm just correcting for my own brain noise. The coffee is the constant. I am the variable. Why is the variable forbidden from changing?"

  "Because you're supposed to be a mirror," Marcus said. "Not a prism."

  "Mirrors tarnish," Julian said. He walked over to the table where a fresh cup of 44-B sat, kept warm on a heating plate. He picked it up. "The Audit assumes there is a 'fact of the matter' about the taste that exists independently of the report. But there isn't. There's just the coffee, and the reaction. If Elias says it's bright, and he acts like it's bright, it is bright. The drift isn't error. It's history."

  "And Sarah?" Marcus pressed. "Is her disgust history too?"

  "Her disgust is real," Julian said. "But her report is fiction. Your model confirms the fiction. It rewards the lie because the lie is consistent. You've built a machine that measures how well someone can suppress their own experience."

  Marcus stared at the graph. The red spiral looked like a galaxy spinning away from the center. "If we accept that, then the Anchor doesn't matter. The freezer doesn't matter. We're just measuring mood."

  "We're measuring the gap," Julian said. "The gap between what happens and what we say happens. Elias's gap is widening, but he's honest about the width. Sarah's gap is widening too, but she's bridging it with protocol. Who's closer to the coffee?"

  "The coffee is chemicals," Marcus said. "It doesn't care about your gap."

  "No," Julian said. "But we do."

  Silence settled over the room. The heating plate clicked off. The smell of the coffee, stale now, oxidized, hung in the air. It smelled different than it had an hour ago. It smelled different than it had in 1998. But the freezer log said it was the same.

  Elias picked up his tablet. "Do I need to re-calibrate?"

  Marcus looked at the red line. He looked at Sarah, who was staring at her hands as if they belonged to someone else. He looked at Julian, who was waiting for a verdict that wouldn't come.

  "Next week," Marcus said. "Cup the Anchor again. Don't look at past notes. Just write."

  "And if I drift again?" Elias asked.

  "Then we'll see how far you can go before you're not speaking the same language as the consumer."

  "And if I write the same words?" Sarah asked.

  "Then you pass," Marcus said.

  She didn't move. "Okay."

  Julian sat back down. He picked up his pen, capped it, and set it on the table. Outside, the sun was setting, changing the light in the room by degrees too slow to notice until the shadows were already long. Nobody commented on the dark. They just waited for the next timer to beep.

  ***

  **Author's Note**

  The "Drift Audit" is fictional. Real sensory panels use reference standards to calibrate intensity and attribute identification, but they do not typically run weekly blind descriptions of a static lot into an NLP model to track semantic drift over years. That apparatus is a narrative device to externalize the philosophical problem.

  The philosophical core relies on Daniel Dennett's "Chase and Sanborn" thought experiment (from *Quining Qualia*). Dennett argues that if a subject cannot distinguish between a change in experience and a change in judgment about the experience, the notion of private, incorrigible qualia is untenable. The story attempts to dramatize this without endorsing Dennett's conclusion as settled fact. It is not. The "Hard Problem" of consciousness remains live; many philosophers (e.g., Chalmers, Block) argue that functional reports *cannot* exhaust the reality of experience. The story favors the Dennettian view slightly by making the data compelling, but Julian's objection—that language is a map, not the territory—is a standard and valid counter-argument in phenomenology.

  Regarding the AI: Semantic vector drift is a real phenomenon in LLMs, but interpreting it as a proxy for human perceptual drift is a liberty. The model measures word co-occurrence, not sensory fidelity. Regarding the panelists: Professional tasters are trained to suppress personal aversion (like Sarah's), but the idea that this creates a "fiction" detectable only by a third party is speculative. The story leaves the conflict unresolved because the science itself does not resolve the metaphysical tension between first-person experience and third-person data.
