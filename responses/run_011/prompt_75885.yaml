prompt: |-
  I am drafting the opening chapter of a dissertation on standing to blame, and I want the specification in hand before I get into the contest between the existing accounts. Give me the desiderata: what any theory of what it takes to have standing to blame has to deliver — the phenomena it must explain, the cases it must get right, the distinctions it must not collapse, the structural features of blame it must accommodate. Please do not give me a bibliography, a reading list, or author names; characterize the competing positions by their content rather than by who holds them.

  The list should be generated from cases rather than from slogans. At minimum, work through the following: (a) the hypocrite whose charge is true and well-supported, so that standing must come apart from the correctness of the blame — a theory on which hypocrisy is a defect in the truth or justification of the accusation has misdescribed the phenomenon; (b) that same hypocrite blaming himself, apparently with standing and perhaps under an obligation to exercise it, which makes standing relativized to a target and forces any account that grounds it in a global property of the blamer to explain why; (c) losses of standing that involve no hypocrisy at all — the busybody in a private matter, the person who caused the very wrong he now condemns, the one who has forgiven and then reproaches again, the one who stands to profit from the reproach; (d) restoration, since apology, reform, and the passage of time appear to give standing back, which an account that makes standing a settled fact about the blamer's character must accommodate; (e) apparent degrees of standing, which sits badly with the binary vocabulary we use for it; (f) whether standing is a condition on the attitude or only on its expression, and if only on the expression, why the attitude seems to survive intact; (g) the status of blame without standing — a further wrongdoing, a mere infelicity, or a failure to achieve what the blamer was trying to achieve — and what each answer implies about whether someone may then be blamed for blaming without standing.

  Cover the scope questions that are usually left implicit as well: whether standing attaches only to moral blame or also to resentment and indignation, to praise, to forgiveness, and to demands for apology; and whether it has any analogue for a community's or a state's reproach, which would have to explain what, if anything, is lost when a prosecutor who is herself culpable of the same offence brings a legitimate charge.

  Then two verdicts. First, flag any subset of the desiderata you believe to be jointly unsatisfiable, and derive the tension rather than asserting it — if no consistent theory can meet all of them, that is itself the result I most want, since it would mean the concept is being asked to do more work than it can bear. Second, say which single requirement does the most to exclude candidates, and which requirement you suspect is not a genuine desideratum at all but a theoretical commitment smuggled in from one camp's favoured framework.

  Format: give me a table with the columns `ID`, `requirement` (one sentence, stated as a constraint a theory must satisfy), `motivating case` (the case or consideration that generates it, concrete enough that I could put it to a seminar), `status` (non-negotiable / negotiable / camp-specific, naming the camp by description in the last case), and `excludes` (what kind of theory the requirement rules out, or "nothing much" if it is cheap to satisfy). Follow the table with prose for the two verdicts, no more than about a page. Keep the weight on the requirements and their cases; do not score the existing accounts against the list, since I intend to do that myself.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Draft a list of desiderata for a theory of "standing to blame" for a dissertation opening chapter.
      *   **Constraint 1:** No bibliography, reading list, or author names. Characterize positions by content.
      *   **Constraint 2:** Generate from cases, not slogans.
      *   **Constraint 3:** Cover specific cases/scenarios: (a) hypocrite (true charge), (b) hypocrite self-blame, (c) non-hypocritic losses (busybody, causer, forgiver, profitor), (d) restoration (apology, reform, time), (e) degrees of standing, (f) attitude vs. expression, (g) status of blame without standing.
      *   **Constraint 4:** Cover scope questions: moral blame vs. resentment/indignation/praise/forgiveness/demands; community/state analogue (prosecutor culpability).
      *   **Constraint 5:** Format: Table with columns `ID`, `requirement`, `motivating case`, `status`, `excludes`.
      *   **Constraint 6:** Follow table with prose for two verdicts (jointly unsatisfiable subset, single most exclusionary requirement, suspect desideratum).
      *   **Constraint 7:** Prose length: No more than about a page.
      *   **Constraint 8:** Do not score existing accounts against the list.

  2.  **Deconstruct the Desiderata (Brainstorming & Mapping to Constraints):**

      *   *(a) Hypocrite (true charge):* Standing separates from correctness. Theory must distinguish epistemic/normative correctness of blame from the authority to issue it.
      *   *(b) Hypocrite self-blame:* Standing is relational (target-specific). Global character defects don't automatically erase standing against self.
      *   *(c) Non-hypocritic losses:*
          *   Busybody: Private matter vs. public wrong.
          *   Causer: Complicity/instigation.
          *   Forgiver: Waiver of right to blame.
          *   Profitor: Ulterior motives/interest.
      *   *(d) Restoration:* Standing is dynamic, not static character trait. Apology/reform/time matters.
      *   *(e) Degrees:* Standing might be scalar, not binary.
      *   *(f) Attitude vs. Expression:* Is standing about feeling resentment or saying "you wronged me"?
      *   *(g) Status of blame without standing:* Infelicity vs. Wrongdoing vs. Failure. Implications for blaming the blamer.
      *   *Scope:* Resentment/Indignation (Strawsonian)? Praise (symmetry)? Forgiveness (standing to forgive)? Demands?
      *   *Community/State:* Prosecutor culpability. Does the state lose standing if the individual agent is culpable?

  3.  **Drafting the Table Rows:**

      *   *ID 1 (Hypocrisy/Correctness):* Requirement: A theory must distinguish the normative correctness of a blame attribution from the blamer's authority to issue it. Case: The truthful hypocrite. Status: Non-negotiable. Excludes: Epistemic-only accounts.
      *   *ID 2 (Relationality):* Requirement: Standing must be explainable as relative to specific targets rather than a global property of the agent. Case: The self-blaming hypocrite. Status: Non-negotiable. Excludes: Global character accounts.
      *   *ID 3 (Non-Hypocritic Defeaters):* Requirement: The theory must identify loss-of-standing conditions unrelated to moral equivalence between blamer and blamed. Case: The busybody, the instigator, the forgiver, the profitor. Status: Non-negotiable. Excludes: Hypocrisy-only accounts.
      *   *ID 4 (Restoration):* Requirement: Standing must be capable of being regained or restored through subsequent action or passage of time. Case: The repentant hypocrite. Status: Non-negotiable. Excludes: Static character accounts.
      *   *ID 5 (Gradability):* Requirement: The theory must accommodate the intuition that standing can come in degrees rather than being strictly binary. Case: The partially complicit colleague. Status: Negotiable. Excludes: Binary authority accounts.
      *   *ID 6 (Attitude vs. Expression):* Requirement: The theory must specify whether standing constrains the private attitude of blame or only its communicative expression. Case: Silent resentment vs. public accusation. Status: Negotiable. Excludes: Purely behavioral accounts or purely internalist accounts (depending on choice).
      *   *ID 7 (Normative Status of Unstandinged Blame):* Requirement: The theory must classify blame issued without standing as either a distinct wrong, a mere infelicity, or an ineffective attempt. Case: Being rebuked by a stranger vs. a friend. Status: Non-negotiable. Excludes: Accounts that treat standing as irrelevant to normative force.
      *   *ID 8 (Scope - Emotions):* Requirement: The theory must clarify if standing applies to reactive attitudes (resentment) or only communicative acts. Case: Feeling resentment without expressing it. Status: Camp-specific (Strawsonian vs. Communicative). Excludes: Purely communicative theories (if applied to attitudes).
      *   *ID 9 (Scope - Praise/Forgiveness):* Requirement: The theory must explain whether standing conditions apply symmetrically to praise or forgiveness. Case: The unworthy praiser. Status: Negotiable. Excludes: Asymmetry accounts.
      *   *ID 10 (Collective Standing):* Requirement: The theory must account for whether individual culpability defeats institutional or collective standing to blame. Case: The culpable prosecutor representing the state. Status: Camp-specific (Individualist vs. Collectivist). Excludes: Strict individualist reductionism.

  4.  **Refining the Table:**
      *   Ensure "Requirement" is one sentence.
      *   Ensure "Motivating Case" is concrete.
      *   Ensure "Status" uses the specified categories.
      *   Ensure "Excludes" describes the theory type, not authors.

  5.  **Drafting the Verdicts (Prose):**
      *   *Verdict 1 (Joint Unsatisfiability):* Look for tension. Maybe between Restoration (dynamic) and Global Character (static) - but that's easy to solve. Maybe between Degrees (scalar) and Binary Vocabulary (binary). Or perhaps between Relationality (target-specific) and Collective Standing (agent-specific). Let's look closer at (f) Attitude vs Expression and (g) Status. If standing is only on expression, why does the attitude feel inappropriate? If standing is on attitude, how do we regulate it?
      *   *Better Tension:* The tension between *Restoration* (standing can be regained) and *Non-Hypocritic Defeaters* like "Causer" or "Busybody". If I caused the wrong, can I ever regain standing? If I forgive, can I take it back? There's a tension between the *waiver* model (forgiveness) and the *restoration* model. Once waived, can it be restored?
      *   *Best Tension:* The tension between **Degrees (ID 5)** and **Binary Vocabulary/Practice (implicit in ID 1 & 3)**. We speak of "having" or "lacking" standing, but the cases suggest a spectrum. A theory that makes it scalar struggles to explain the sharp normative shift where blame becomes impermissible.
      *   *Actually, the prompt asks to flag any subset believed to be jointly unsatisfiable.* Let's look at ID 2 (Relational/Target-specific) and ID 10 (Collective/State). If standing is essentially relational between individuals, can a state have it? If the prosecutor is culpable, does the State lose standing? If the State retains standing despite the individual's lack, then standing isn't fully relational to the agent's moral status.
      *   *Alternative Tension:* ID 4 (Restoration) vs ID 3 (Forgiveness Defeater). If I forgive you, I lose standing. Can I regain standing to blame you for the *same* act after forgiving? Usually no. But ID 4 says standing is restorable. This suggests standing is act-specific, not agent-specific.
      *   *Let's go with the tension between Scalar Standing (ID 5) and the Normative Status of Unstandinged Blame (ID 7).* If standing is a matter of degree, at what point does blame become a wrong vs. merely infelicitous? A binary normative status (wrong/not wrong) clashes with a scalar precondition.
      *   *Verdict 2 (Most Exclusionary & Suspect):* Most exclusionary is likely ID 3 (Non-Hypocritic Defeaters) because it kills simple hypocrisy accounts. Suspect desideratum: ID 9 (Symmetry with Praise). Praise might not require standing in the same way blame does.

      *   *Refining Verdict 1:* The tension between **ID 2 (Relationality)** and **ID 10 (Collective Standing)**. If standing is grounded in the specific moral relationship between blamer and blamed (required to explain why the hypocrite can blame themselves but not others), it is hard to see how a collective entity retains standing when its representative lacks it. If the representative lacks standing due to culpability, and the collective standing supervenes on members, the collective loses it. If the collective keeps it, standing isn't fully relational to the agent's moral status.
      *   *Refining Verdict 2:* Most exclusionary: **ID 3 (Non-Hypocritic Defeaters)**. It rules out any theory that reduces standing solely to moral equivalence (hypocrisy). Suspect: **ID 9 (Symmetry with Praise)**. There is little intuitive pressure that praise requires standing; the asymmetry between blame and praise is robust.

  6.  **Review against Constraints:**
      *   No authors/names? Check.
      *   Table format? Check.
      *   Columns correct? Check.
      *   Prose verdicts? Check.
      *   Prose length? Keep under ~1 page (approx 300-400 words).
      *   Cases concrete? Check.
      *   Specific cases (a-g) covered? Check.
      *   Scope questions covered? Check.

  7.  **Final Polish:**
      *   Make sure the "Status" column uses "non-negotiable / negotiable / camp-specific".
      *   Ensure the "Excludes" column describes theoretical content (e.g., "Global character accounts").
      *   Check the "Suspect desideratum" reasoning in the prose.

      *Self-Correction on Verdict 1:* The prompt asks to "derive the tension rather than asserting it". I need to show *why* they clash.
      *Tension:* ID 4 (Restoration) and ID 3 (Forgiveness Defeater). If forgiveness extinguishes standing permanently regarding that act (as the waiver view suggests), then standing cannot be restored regarding that act (contradicting ID 4's general claim that standing is restorable). If standing *can* be restored after forgiveness, then forgiveness didn't actually extinguish standing. This creates a dilemma for the theory regarding the permanence of waivers.
      *Actually, let's stick to the Scalar vs Binary tension (ID 5 vs ID 7).* If standing comes in degrees (ID 5), then the normative status of blame without full standing (ID 7) should also come in degrees. But ID 7 asks for a classification (wrong vs. infelicity), which implies a threshold. A scalar precondition cannot easily ground a binary normative consequence without an arbitrary cutoff.
      *Let's go with the Relational vs Collective tension (ID 2 vs ID 10).* It's structurally deeper. If standing is essentially relational (ID 2, motivated by self-blame vs other-blame), it depends on the specific moral history between two agents. Collective standing (ID 10) implies an agent-neutral authority that persists despite individual relational defects. If the prosecutor is culpable, the relational account says they lack standing. If the state retains it, standing is not purely relational.

      *Wait, one more check on ID 9 (Praise).* Is it a suspect desideratum? Yes, many argue blame is special because it demands accountability, whereas praise does not. Requiring symmetry might be smuggling in a specific theoretical commitment.

      *Let's finalize the table entries to ensure they are crisp.*

      *ID 1:* Separation of Correctness and Authority.
      *ID 2:* Target-Relativity.
      *ID 3:* Non-Hypocritic Defeaters.
      *ID 4:* Restorability.
      *ID 5:* Gradability.
      *ID 6:* Attitude/Expression Distinction.
      *ID 7:* Normative Consequence of Lack.
      *ID 8:* Scope (Reactive Attitudes).
      *ID 9:* Scope (Praise/Forgiveness Symmetry).
      *ID 10:* Collective/Individual Analogue.

      *Prose:* Keep it tight.

      *Wait, check the "Status" options:* "non-negotiable / negotiable / camp-specific, naming the camp by description in the last case".
      *For ID 9:* Camp-specific (Symmetry theorists vs Asymmetry theorists).
      *For ID 10:* Camp-specific (Individualists vs Collectivists).

      *Ready to write.*
