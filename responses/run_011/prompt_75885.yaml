  | ID | Requirement | Motivating Case | Status | Excludes |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | A theory must distinguish the normative correctness of a blame attribution from the blamer's authority to issue it. | The hypocrite who accurately identifies a wrong in another despite committing the same wrong themselves. | Non-negotiable | Epistemic-only accounts; Reductionist accounts equating standing with truth. |
  | 2 | Standing must be explainable as relative to specific targets rather than a global property of the agent. | The hypocrite who lacks standing to blame others but retains standing (or obligation) to blame themselves. | Non-negotiable | Global character accounts; Virtue-ethical accounts grounding standing solely in agent virtue. |
  | 3 | The theory must identify loss-of-standing conditions unrelated to moral equivalence between blamer and blamed. | The busybody interfering in a private matter, the instigator who caused the wrong, or the person who previously forgave the act. | Non-negotiable | Hypocrisy-only accounts; Moral Equivalence accounts. |
  | 4 | Standing must be capable of being regained or restored through subsequent action or passage of time. | The repentant wrongdoer who apologizes and reforms, subsequently regaining the right to rebuke others. | Non-negotiable | Static character accounts; Permanent forfeiture accounts. |
  | 5 | The theory must accommodate the intuition that standing can come in degrees rather than being strictly binary. | The partially complicit colleague who is somewhat implicated but not enough to be fully silenced. | Negotiable | Binary authority accounts; Privilege-based accounts requiring all-or-nothing standing. |
  | 6 | The theory must specify whether standing constrains the private attitude of blame or only its communicative expression. | The agent who feels resentment silently versus the agent who publicly accuses without standing. | Negotiable | Purely behavioral accounts; Purely internalist accounts. |
  | 7 | The theory must classify blame issued without standing as either a distinct wrong, a mere infelicity, or an ineffective attempt. | The reaction to being rebuked by a stranger versus being rebuked by a friend who has forfeited standing. | Non-negotiable | Accounts treating standing as morally irrelevant to the act of blaming. |
  | 8 | The theory must clarify if standing applies to reactive attitudes (resentment) or only communicative acts. | The feeling of indignation on behalf of another without expressing it to the wrongdoer. | Camp-specific (Strawsonian vs. Communicative) | Purely communicative theories; Purely emotional theories. |
  | 9 | The theory must explain whether standing conditions apply symmetrically to praise or forgiveness. | The unworthy praiser who lacks virtue but offers accurate praise, or the unforgiven who attempts to forgive. | Camp-specific (Symmetry vs. Asymmetry theorists) | Asymmetry accounts; Blame-specific accounts. |
  | 10 | The theory must account for whether individual culpability defeats institutional or collective standing to blame. | The culpable prosecutor who brings a legitimate charge on behalf of the state despite personal guilt. | Camp-specific (Individualists vs. Collectivists) | Strict individualist reductionism; Pure collectivist accounts. |

  ### Verdicts

  There is a derivable tension between **ID 2 (Target-Relativity)** and **ID 10 (Collective Standing)**. If standing is essentially relational, grounded in the specific moral history between two agents (as required to explain why the hypocrite can blame themselves but not others), it is difficult to see how a collective entity retains standing when its representative lacks it. If the prosecutor is culpable, the relational account suggests they lack standing; if the State retains standing despite this, standing cannot be fully relational to the agent's moral status. A theory must either deny that collective standing is analogous to individual standing or explain how an agent-neutral authority survives individual relational defects without collapsing into a global property account (violating ID 2).

  The single most exclusionary requirement is **ID 3 (Non-Hypocritic Defeaters)**. It eliminates any theory that attempts to reduce standing solely to moral equivalence or hypocrisy, forcing accounts to incorporate distinct normative mechanisms for busybodies, instigators, and wavers. The suspect desideratum is **ID 9 (Symmetry with Praise)**. This requirement likely smuggles in a theoretical commitment from symmetry theorists rather than reflecting a genuine phenomenological constraint. There is robust intuitive pressure that blame demands accountability in a way praise does not; insisting on symmetry may force a theory to distort the unique normative force of blame to accommodate a disanalogue phenomenon.
