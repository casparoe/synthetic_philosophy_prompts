      *   **Key Case:** "The Merger." Ada and Bo merge into one subject for an hour. During this hour, the single subject must choose whether to inflict intense pain on Ada's body (felt by the merged subject) to prevent worse harm to Ada later. Both pre-merge and post-merge, they are distinct. During the merge, they are one.
      *   **Required Steps:**
