answer: |-
  The separateness-of-persons objection asserts that utilitarianism illicitly extends the rationality of individual prudence to the social sphere. It claims that while a single individual may legitimately sacrifice a present good for a greater future good, society may not sacrifice one individual for the benefit of another. The thesis defended here is that this objection fails to refute utilitarianism because it relies on a binary distinction between intrapersonal and interpersonal aggregation that the "Merger" case demonstrates is metaphysically unsustainable. The Merger shows that the criteria for personal unity admit of degrees. Consequently, the objection cannot establish a categorical prohibition on aggregation; at best, it establishes a requirement for distribution-sensitive valuation, which consequentialism can accommodate without abandoning its core structure.

  ### 1. The Objector's Principle

  To evaluate the objection, we must first formalize the principle it relies upon. Let us call this the **Aggregation Constraint**. The schema is as follows:

  *   **Intrapersonal Aggregation:** If a cost $C$ and a benefit $B$ accrue to the *same* subject $S$, then $S$ is permitted to undergo $C$ to secure $B$ provided $B > C$.
  *   **Interpersonal Aggregation:** If a cost $C$ accrues to subject $S_1$ and a benefit $B$ accrues to subject $S_2$ (where $S_1 \neq S_2$), then it is impermissible to impose $C$ on $S_1$ solely to secure $B$ for $S_2$, regardless of the magnitude of $B$.

  The force of this constraint is supposed to depend on the **absence of a single bearer**. In the intrapersonal case, the subject who pays the cost is numerically identical to the subject who receives the benefit; the loss and gain cancel out within a single life. In the interpersonal case, there is no collective subject that experiences the net gain. The loss is real for $S_1$, the gain is real for $S_2$, and there is no "super-subject" for whom the net is positive.

  We must distinguish two groundings for this constraint. The **Metaphysical Grounding** claims that moral aggregation is only possible where there is a genuine ontological unity (a single substance or continuing consciousness). The **Normative Grounding** claims that even if metaphysical unity is vague, morality requires us to treat distinct biological or psychological lives as inviolable boundaries. The Merger case primarily targets the Metaphysical Grounding, as it constructs a scenario where the metaphysical conditions for unity are stipulated to obtain between normally distinct persons.

  ### 2. Pressure from the Merger

  The Merger case exerts pressure on every candidate grounding for the Aggregation Constraint by creating a scenario where the standard markers of "separate persons" and "single subject" come apart.

  Consider the **Numerical Distinctness** grounding. Pre- and post-merger, Ada and Bo are two. During the merger, they are one. The decision to undergo the painful treatment occurs *during* the merger. If the objector insists the aggregation is interpersonal because Ada and Bo are distinct before and after, they make moral permissibility depend on temporal endpoints external to the choice. The subject making the choice is, at the moment of choice, a single locus of agency and sensation. To forbid the aggregation is to tell the single subject experiencing the pain that they cannot endure it for their own future benefit, simply because their past and future involve fission. This makes the "separateness" a matter of historical accident rather than present reality.

  Consider the **Single Bearer** grounding. Nozick's version argues that no one ever pays the cost and gets the benefit. In the Merger, this is factually false for the duration of the hour. The single merged subject feels the pain (cost) and makes the decision to secure the future health of the body that will constitute their future self (benefit). There is a single bearer of the cost and the benefit *at the time of the transaction*. If the objector argues that the bearer ceases to exist after the hour, they must explain why the cessation of the unified bearer invalidates the prudence of the choice made *while* the bearer existed. If prudence is valid only when the bearer persists eternally, no ordinary intrapersonal choice is justified, as all persons eventually cease to exist.

  Consider the **Psychological Continuity** grounding. On a reductionist account, Ada and Bo survive the merger. The merged subject is psychologically continuous with both. The pain is experienced by a subject continuous with the future beneficiary. The distinction between "Ada sacrificing for Ada" and "Merged-Subject sacrificing for Ada" collapses. The Merger shows that the "distinctness" of persons is not a deep metaphysical fact but a description of how psychological connections are grouped. If aggregation is permitted when connections are tight (the merger hour) and forbidden when they are loose (normal life), the boundary is one of degree. The Aggregation Constraint requires a sharp line where the metaphysics provides only a gradient.

  ### 3. Addressing the Replies

  The objector has two primary lines of reply. Both fail to restore the sharp dichotomy required to refute utilitarianism.

  **Reply 1: The Unity Concession.**
  The objector may argue: "During the hour, there is genuinely one subject. Therefore, the choice is intrapersonal, and utilitarianism is correct *in this specific case*. This does not vindicate utilitarianism in normal cases where no merger occurs."

  This reply concedes the central point of the thesis: that the operative criterion for aggregation is **unity of consciousness**, not the biological or legal distinctness of persons. If the permission to aggregate turns on the presence of a unified phenomenal field and agency, then the prohibition on aggregation turns on the absence of that unity. But unity is not a binary switch; it admits of degrees. Empirical psychology and the logic of the Merger suggest that psychological connectedness varies. If the objector admits that perfect unity permits aggregation, they must explain why 99% unity forbids it. If they maintain a sharp prohibition despite gradual changes in unity, their principle becomes arbitrary. If they allow aggregation to vary with the degree of unity, they have abandoned the categorical Aggregation Constraint for a weighted one. This confirms the thesis that the distinction is one of degree, not kind.

  **Reply 2: The Uncompensated Sacrifice.**
  The objector may argue: "The sacrifice is uncompensated because Bo ends the hour with a memory of pain he did not benefit from. Bo bears a burden (the memory) for Ada's gain (health). There is no single life that contains both the full burden and the full benefit."

  This reply faces two difficulties. First, it makes moral permissibility depend on the **subsequent branching structure** of the subject's continuers. At the moment of choice, the subject is one. Whether that subject later splits into two is a future contingency. It is counterintuitive to hold that the morality of a choice made at $t_1$ depends on the metaphysical accidents of fission at $t_2$. If the merged subject knew the merger would be *permanent*, the sacrifice would clearly be prudent. If they know it is *temporary*, the objector claims it becomes imprudent. This implies that the rationality of prudence depends on the duration of unity, which again suggests a gradient, not a binary.

  Second, regarding the ledger of burdens: What does a remembered pain that no longer hurts contribute? A memory of pain is not pain. It is a representation of a past negative experience. While it may have negative utility (it is unpleasant to remember suffering), it is categorically distinct from the suffering itself. In the Merger, the cost is ten minutes of *intense pain*. The benefit is the arrest of a *degenerative condition* causing permanent, substantially worse harm. Even if Bo retains a memory of the pain, the disvalue of that memory is negligible compared to the disvalue of the prevented harm. To claim the sacrifice is uncompensated because Bo remembers the pain is to equate the memory of a cost with the cost itself. If the objector insists that the memory constitutes a full cost equivalent to the pain, they imply that suffering is never truly compensated, even intrapersonally, as long as one remembers it. This leads to a skepticism about prudence that undermines the objector's own distinction between intrapersonal and interpersonal cases.

  ### 4. Graded Variants and Consistency

  To test the robustness of the objection, consider a **Partial Merger**. Suppose Ada and Bo undergo a procedure where they share a phenomenal field (sensations are felt jointly) but retain separate agencies and memory streams. Or, they share agency (one deliberative voice) but feel sensations separately.

  In the **Shared Sensation/ Separate Agency** variant: The pain is felt in the unified field, but the decision is made by two distinct deliberators. Here, the "single bearer" of the sensation exists, but the "single chooser" does not. If the objector forbids aggregation here, they admit that phenomenal unity is insufficient without agential unity. If they allow it, they admit phenomenal unity is sufficient.

  In the **Shared Agency/ Separate Sensation** variant: One voice decides, but the pain is felt only in Ada's body, though Bo's agency commands it. This resembles standard interpersonal sacrifice more closely.

  The critical test is consistency. If the objector verdict is "Permitted" in the Full Merger (due to unity) and "Forbidden" in the Partial Merger (due to disunity), they have established a threshold. But where is the threshold? Is it 100% unity? 90%? If the Merger case is metaphysically possible, it implies that the boundaries of persons are porous. If the verdict shifts gradually as the merger becomes less complete, the objection transforms from "Aggregation is forbidden across persons" to "Aggregation is discounted by the degree of separation."

  If the objector maintains a "Forbidden" verdict in the Partial Merger but "Permitted" in the Full Merger, they rely on a sharp metaphysical line that the case stipulations suggest is arbitrary. If they maintain "Forbidden" in *both*, they undermine the Full Merger intuition that a single subject of experience should be allowed to act for its own future. If they maintain "Permitted" in *both*, they admit that significant psychological connection justifies aggregation, which is the utilitarian position.

  The pattern of verdicts implies that the objection's form is not a constraint on *aggregation itself*, but a constraint on the *weight* of aggregation based on psychological distance. This is a difference of degree. The objection cannot sustain a categorical ban if the metaphysics of the case allows for intermediate states between "one person" and "two people."

  ### 5. Conclusion: What Remains of the Objection

  On this account, the separateness-of-persons objection fails as a refutation of utilitarianism because it cannot sustain the sharp dichotomy between intrapersonal and interpersonal aggregation that it requires. The Merger case demonstrates that the criteria for personal identity are contingent and gradable. Consequently, the objection collapses into a demand for **distribution sensitivity**.

  What is left of the objection is the insight that the *manner* in which well-being is distributed matters, not just the sum. A consequentialist can accommodate this by modifying the evaluation function. Instead of maximizing $\sum W$ (total well-being), the theory could maximize $\sum f(W)$, where $f$ is a concave function that gives greater weight to benefits for those who are worse off or more psychologically disconnected from the benefactor. Alternatively, the theory could include a penalty term for costs imposed across deep psychological discontinuities.

  This accommodation is not a substantive concession that abandons consequentialism; it is a refinement of the theory of value. Consequentialism requires that the right act maximizes the good. If the "good" is defined as "well-being weighted by psychological connectedness," the structure remains consequentialist. The objector successfully argues that persons are distinct, but fails to prove that this distinctness creates a moral barrier that aggregation cannot cross. They prove only that the "exchange rate" for aggregation might vary based on the depth of the separation.

  **Vulnerability:**
  The single point at which this argument is most vulnerable is the move from **metaphysical continuity to normative permission**. The argument assumes that if the metaphysical conditions for "one person" are met (as in the Merger), then the normative rules for "one person" (prudence) must apply. An objector should press the claim that morality is **normatively autonomous** from metaphysics. Even if Ada and Bo *feel* like one subject during the hour, morality might dictate that we treat them as two to protect the integrity of their separate life projects. The objector can argue that the "inviolability" of persons is a moral postulate, not a metaphysical discovery. If morality *stipulates* that biological humans are the units of account regardless of temporary phenomenal mergers, the Merger case loses its force. The argument above assumes that moral units must track metaphysical units of consciousness; if the objector denies this isomorphism, the dichotomy between intra- and interpersonal aggregation can be preserved by fiat, regardless of the Merger's metaphysics. This is the strongest ground for the objector: that the "separateness" is a moral boundary, not a descriptive one.
