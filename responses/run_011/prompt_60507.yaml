      *   *Implication:* If aggregation is okay in the Merger (intrapersonal), but the Merger is metaphysically continuous with non-merger cases, the objection loses its bite. It becomes a request for distribution sensitivity, which utilitarianism can incorporate (e.g., prioritarianism or weighted utilitarianism) without abandoning consequentialism.

  3.  **Drafting - Section by Section:**

