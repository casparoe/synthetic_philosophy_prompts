answer: |-
  The ICU is quiet except for the ventilator. Elena, 54, lies paralyzed from the neck down, speaking through a throat microphone. Her daughter, Sarah, holds the advance directive. The ethicist, Dr. Aris, stands between them.

  Nine years ago, Elena joined a trial for "NeuroSim," a drug inducing temporary locked-in syndrome with chronic pain. She endured six hours, then signed this directive within 24 hours. Handwritten on the bottom: *"I know exactly what this feels like. It is not life."*

  Now, Elena has the permanent version. The qualia are identical. The difference is contingency. In the trial, the pain was instrumental; it had an end time. Now, it is gratuitous; it has no end. Human endurance relies on the *possibility* of cessation, not just sensation. The structure of the suffering changed, even if the texture didn't.

  Elena says: "I was wrong. I want to live."
  Sarah says: "You told us not to let you say that."
  The directive includes a Ulysses Clause: *"Even if I beg to stay alive, assume I am panicked. Enforce cessation."*

  They cannot revoke. Voiding the directive triggers an insurance clause that cuts power to her ventilator immediately as "fraudulent claim." They cannot wait. The donor match for her current lung support expires at dawn; without a decision, the machine is reallocated.

  Aris looks at the paper. The Past Self legislated under perfect knowledge, protecting her dignity from meaningless decay. The Present Self is competent, clear-eyed, and values existence despite the pain. The Past Self says honor the contract. The Present Self says honor the person.

  Elena whispers, "I'm still here."
  Sarah touches the paper. "You were here then, too."

  The ethicist sees the trap. If they honor the document, they kill a competent woman who wants to live. If they override, they violate the specific conditions under which she agreed to this treatment nine years ago. The narrative view suggests overriding her, not because she suffers, but because a story where the protagonist changes her mind is more coherent than one where she is bound by a previous draft. It saves her life for the sake of plot, not welfare.

  The ventilator hums. The clock ticks. The paper weighs more than the machine.

