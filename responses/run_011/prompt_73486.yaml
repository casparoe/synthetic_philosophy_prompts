prompt: |-
  Bit of context before the list: I run a very small evaluation function inside a welfare-to-work provider — two of us, and I do the analysis myself, largely self-taught out of epidemiology textbooks. We've just finished comparing an intensive caseworker-led track against the standard offer, and the write-up goes to the board next week. Before it does I'd like someone to check whether my statistical commitments actually hang together, because I have a nagging feeling they dont and I can't locate where the trouble is.

  The package:

  1. No-causes-in-no-causes-out. The numbers can never tell me which variables to condition on. That has to come from knowing how the scheme was actually run — who got pointed at which track and why.

  2. I don't condition on anything recorded after assignment. No mediators, no colliders. Total effects or nothing.

  3. Risk differences, full stop, and I make a point of it in the report. I don't trust odds ratios or hazard ratios because they're non-collapsible: you can adjust for something that plainly can't be a confounder and watch the estimate move anyway.

  4. My working test for whether a crude comparison was confounded is to adjust for the candidate covariate and see if the estimate moves. Moves materially → the crude one was confounded. Doesn't move → it wasn't.

  5. I hold something like a sure-thing principle here: if the intensive track raises the employment rate within every stratum of a pre-assignment variable, then it raises it in the population as a whole. A table that says the opposite must have something wrong in it.

  6. The data. Intake severity was scored at referral, before anyone was assigned. There were 400 high-need participants and 400 lower-need ones in total.

     high-need / hard-to-place:
     - intensive track: 300 assigned, 120 in work at 12 months (40.0%)
     - standard offer: 100 assigned, 25 in work (25.0%)

     lower-need:
     - intensive track: 100 assigned, 80 in work (80.0%)
     - standard offer: 300 assigned, 210 in work (70.0%)

     whole cohort:
     - intensive track: 400 assigned, 200 in work (50.0%)
     - standard offer: 400 assigned, 235 in work (58.75%)

     So it wins by 15 points and by 10 points inside the strata, and loses by nearly 9 points crude. My verdict: the crude figure is confounded by intake severity, the honest answer is that the track helps, and I told the board their headline comparison is meaningless and gave them the two stratified figures instead.

  7. I also told them that if they extend the intensive track to every intake, the payoff will be bigger than either of those stratified figures, since it worked for hard-to-place and lower-need people alike.

  8. In the discussion section I wrote that the intensive track only pays off where the participant engages with it — even though the board asked me to condition on session attendance and I refused on the grounds of (2).

  And two things that aren't commitments so much as worries I can't shake. First, I like saying that the reversal is what tipped me off that the crude comparison couldn't be trusted, which sounds suspiciously like the data telling me about causes, contra (1); I don't think it is, but I couldn't say why if pushed. Second, between (6) and (7) I sound like a relativist — I keep saying there's no such thing as the effect of the track, only effects relative to some particular mix of participants — and then I turn round and tell the board their number is flat wrong, as though mine were the true one. I can't tell whether that's incoherent or just bad-sounding.

  What I want is an audit, not a tutorial. Go through the set and tell me which items genuinely pull against each other and which only look like they do, ranked by severity, and for each real one say what has to give and what the cheapest repair costs me. Please actually work the numbers rather than taking my word for them: check that the table behaves the way I claim, and work out what the standardised figure would be if everybody got the intensive track, and whether that supports what I said in (7) about it being bigger than the stratified effects. If two of my items are both perfectly fine and merely look like they clash, say so plainly — I don't want all nine flagged as equally damaged. Then finish with which single revision would clean up the most.

  One last thing. Where I've got something wrong that everyone who works in this area would agree is wrong, just say it's wrong. But where the disagreement is live — which measure to use, whether a change-in-estimate is evidence of anything, whether non-collapsibility is a defect or just a property — please separate what's settled from what's genuinely contested among people who know the topic, and don't hand me a contested position dressed up as the consensus. No references needed, I just want the reasoning.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **User:** Runs a small evaluation function in a welfare-to-work provider (2 people, self-taught epidemiology).
      *   **Task:** Audit a set of 8 statistical commitments/claims + 2 worries regarding a recent evaluation report going to the board.
      *   **Goal:** Identify genuine contradictions vs. apparent ones, rank by severity, propose repairs, check the math, distinguish settled vs. contested statistical issues.
      *   **Constraint:** "Audit, not a tutorial." "Actually work the numbers." "No references needed, just reasoning."
      *   **Tone:** Professional, direct, rigorous, respectful of the user's expertise level but firm on errors.

  2.  **Deconstruct the Input Data (Item 6):**
      *   *High-Need:*
          *   Intensive: $N=300$, Employed $= 120$ ($40\%$)
          *   Standard: $N=100$, Employed $= 25$ ($25\%$)
          *   Risk Difference (RD): $+15\%$
      *   *Low-Need:*
          *   Intensive: $N=100$, Employed $= 80$ ($80\%$)
          *   Standard: $N=300$, Employed $= 210$ ($70\%$)
          *   Risk Difference (RD): $+10\%$
      *   *Total (Crude):*
          *   Intensive: $N=400$, Employed $= 200$ ($50\%$)
          *   Standard: $N=400$, Employed $= 235$ ($58.75\%$)
          *   Risk Difference (RD): $-8.75\%$ (User says "nearly 9 points", accurate).
      *   *Observation:* Simpson's Paradox is present. Stratum-specific effects are positive ($+15\%$, $+10\%$), crude effect is negative ($-8.75\%$).
      *   *Assignment Mechanism:* High-need people were disproportionately assigned to Intensive ($300/400$) vs Standard ($100/400$). This suggests non-random assignment based on need (confounding by indication).

  3.  **Audit Each Item/Commitment:**

      *   **Item 1 (No-causes-in-no-causes-out):** "Numbers can never tell me which variables to condition on... has to come from knowing how the scheme was actually run."
          *   *Status:* **Settled/Correct.** This is the fundamental principle of causal inference (DAGs/structural knowledge). Data alone cannot distinguish confounding from mediation or collider bias without structural assumptions.
          *   *Conflict:* User worries this contradicts using the reversal (Item 6) to detect confounding.

      *   **Item 2 (No post-assignment conditioning):** "No mediators, no colliders. Total effects or nothing."
          *   *Status:* **Settled/Correct.** Conditioning on post-treatment variables biases total effect estimates.
          *   *Conflict:* Item 8 discusses engagement (post-assignment).

      *   **Item 3 (Risk Differences, non-collapsibility):** "Don't trust ORs/HRs... non-collapsible."
          *   *Status:* **Contested/Nuanced.** RD is collapsible. OR is not. However, RD has its own issues (baseline risk dependence). But for this context (public health/policy), RD is often preferred for interpretability. The reasoning on non-collapsibility is technically correct (OR changes upon adjustment even without confounding), but RD is not a panacea.
          *   *Conflict:* None major, but needs nuance on "trust."

      *   **Item 4 (Change-in-estimate test):** "Adjust... see if estimate moves. Moves materially → confounded."
          *   *Status:* **Settled/Wrong.** This is a common heuristic but logically flawed. A variable can be a confounder but not change the estimate (e.g., if balanced, or if effects cancel). Conversely, a variable can change the estimate due to chance or collider bias. It's not a *test* for confounding; it's a sensitivity check.
          *   *Severity:* High. It gives false confidence.

      *   **Item 5 (Sure-thing principle):** "If raises rate within every stratum... raises it in population."
          *   *Status:* **Settled/Correct (with caveats).** This is Simpson's Paradox logic. If $RD > 0$ in all strata, the weighted average must be $> 0$ *if weights are consistent*. However, the "population as a whole" depends on the weighting scheme (standardization).
          *   *Conflict:* Item 7 claims the overall effect will be *bigger* than stratum effects. This violates the math of weighted averages.

      *   **Item 6 (The Data & Verdict):** "Crude figure is confounded... honest answer is that the track helps."
          *   *Math Check:*
              *   High Need RD: $0.40 - 0.25 = 0.15$
              *   Low Need RD: $0.80 - 0.70 = 0.10$
              *   Crude RD: $0.50 - 0.5875 = -0.0875$
              *   Confounding is real (assignment was skewed by need).
              *   Verdict: Correct to reject crude.
          *   *Conflict:* The worry about Item 1 (using data reversal to find cause). Actually, the reversal + knowledge of assignment (Item 1) confirms confounding. The reversal *alone* doesn't, but combined with Item 1 knowledge, it's valid.

      *   **Item 7 (Prediction/Generalization):** "If they extend... payoff will be bigger than either of those stratified figures."
          *   *Math Check:*
              *   Stratum effects: $15\%$ and $10\%$.
              *   Average effect (ATE) is a weighted average of stratum effects.
              *   Unless there is effect modification where the *new* population has a different mix *and* the effect is non-linear (interaction), the ATE lies *between* the stratum-specific effects (for RD).
              *   Claim: "Bigger than either."
              *   Reality: Impossible for RD. The average of 10 and 15 cannot be > 15.
              *   *Severity:* **Critical Error.** This is mathematically impossible under the RD model unless there's a specific interaction claim not supported by data.
          *   *Conflict:* Contradicts Item 5 (Sure-thing principle implies consistency).

      *   **Item 8 (Engagement/Discussion):** "Only pays off where participant engages... refused to condition."
          *   *Status:* **Logical Tension.** Item 2 says "No post-assignment." Item 8 discusses mechanism ("only pays off where... engages").
          *   *Analysis:* You can discuss mechanism qualitatively without conditioning quantitatively. However, phrasing it as "only pays off where..." implies a conditional effect estimate which wasn't calculated.
          *   *Severity:* Moderate. Rhetorical risk vs. Statistical error.

      *   **Worry 1 (Reversal vs. Item 1):** "Reversal tipped me off... sounds like data telling me about causes."
          *   *Resolution:* The reversal is a *symptom*, not a *diagnosis*. Item 1 says data can't pick confounders. The reversal says "Something is weird." Item 1 (knowledge of assignment) says "Need drove assignment." Together = Confounding. The worry is unfounded if framed correctly.

      *   **Worry 2 (Relativism vs. Truth):** "No such thing as the effect... then tell them their number is flat wrong."
          *   *Resolution:* Not incoherent. There is no *single* number independent of population structure, but there *is* a correct number for a *defined* population (e.g., the intake cohort). The crude number is wrong for the causal question; the standardized number is right for the target population.

  4.  **Synthesize and Rank:**

      *   **Critical (Mathematical Impossibility):** Item 7. You cannot average 10% and 15% and get >15%.
      *   **High (Methodological Error):** Item 4. Change-in-estimate is not a test for confounding.
      *   **Moderate (Rhetorical/Conceptual Tension):** Item 8 vs Item 2. Discussing mechanisms while refusing adjustment is fine, but phrasing matters.
      *   **Low/None (Resolved Worries):** Worry 1 & 2. These are philosophical anxieties that resolve with precise language. Item 1, 2, 3, 5, 6 are largely sound (with minor caveats on 3).

  5.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the quality of the work (Simpson's paradox handled well), but highlight the specific errors.
      *   *Math Check:* Explicitly calculate the Standardized Risk Difference to disprove Item 7.
      *   *Ranking:*
          1.  Item 7 (Math error).
          2.  Item 4 (Methodological error).
          3.  Item 8 (Phrasing risk).
          4.  Worries 1 & 2 (Clarification needed).
          5.  Items 1, 2, 3, 5, 6 (Mostly sound).
      *   *Settled vs. Contested:*
          *   Settled: Item 1 (DAGs), Item 2 (Post-treatment bias), Item 7 (Math), Item 4 (Change-in-estimate flaw).
          *   Contested: Item 3 (RD vs OR collapsibility is technical, but preference is field-dependent).
      *   *Single Revision:* Fix Item 7.

  6.  **Refining the Argument on Item 7:**
      *   Why did the user think this? Probably thinking "If everyone gets it, we save the high-need people who benefit most."
      *   But the high-need people *already* got it in the stratified analysis.
      *   If we extend to *everyone*, the effect is the average of the high-need effect and low-need effect, weighted by the prevalence of high/low need in the *total* population.
      *   Total Population: 800 people. 400 High, 400 Low.
      *   Weighted RD = $(0.5 \times 0.15) + (0.5 \times 0.10) = 0.125$ ($12.5\%$).
      *   $12.5\%$ is between $10\%$ and $15\%$. It is not bigger than both.
      *   User claim: "Payoff will be bigger than either." -> **False.**

  7.  **Refining the Argument on Item 4:**
      *   Change-in-estimate is a rule of thumb, not a test.
      *   Example: A strong confounder balanced by random chance won't change the estimate but is still a confounder structurally.
      *   Example: A collider will change the estimate but is not a confounder.
      *   Repair: Rely on Item 1 (structural knowledge), use Item 4 only as a sanity check, not a decision rule.

  8.  **Refining the Argument on Item 3:**
      *   RD is collapsible. OR is not.
      *   User is right to prefer RD for this audience.
      *   Nuance: RD depends on baseline risk. But for "employment rate," RD is standard.
      *   Verdict: Keep, but don't disparage ORs as "untrustworthy" generally, just for this purpose.

  9.  **Refining the Worries:**
      *   Worry 1: The reversal didn't tell you *what* the cause was (Item 1 holds). It told you the crude estimate was *biased*. You used Item 1 knowledge to identify the bias source. No contradiction.
      *   Worry 2: "The Effect" is always "The Effect in Population X." The Board's number is the effect in the *observed assignment mix*, which is not the causal parameter of interest. Your number is the effect in the *intake population*. Both are "true" descriptive stats, only one is the causal estimand.

  10. **Final Review against Constraints:**
      *   Did I work the numbers? Yes (Standardization).
      *   Did I rank by severity? Yes.
      *   Did I distinguish settled vs. contested? Yes.
      *   Is it an audit? Yes.

  11. **Final Polish:** Ensure tone is supportive but rigorous. (Self-Correction: Make sure to explicitly mention that Item 5 is technically correct regarding the *direction*, but Item 7 violates the *magnitude* implications of Item 5).

      *Wait, one check on Item 5:* "If the intensive track raises the employment rate within every stratum... then it raises it in the population as a whole."
      *   This is true for the *direction* (sign) of the effect.
      *   Item 7 claims the *magnitude* will be larger than the components.
      *   So Item 5 is correct (sign consistency), Item 7 is incorrect (magnitude claim).

      *One check on Item 3:* "Non-collapsible... adjust for something that plainly can't be a confounder and watch the estimate move."
      *   This is the definition of non-collapsibility. User understands this correctly.
      *   Is it a "defect"? In causal inference, collapsibility is a desired property for marginal interpretation. So calling it a reason to distrust ORs in this context is defensible.

      *One check on Item 8:* "Intensive track only pays off where the participant engages with it."
      *   This is a tautology (you can't be helped by a session you don't attend).
      *   But implying a conditional estimate without calculating it is risky.
      *   Repair: Phrase as "mechanism" not "estimate."

      *Let's assemble the response.*
answer: |-
  Here is the audit. I have worked the numbers from your table (Item 6) to test your claims, specifically Item 7. I have ranked the issues by severity, distinguishing between mathematical errors, methodological flaws, and philosophical worries that resolve with precise language.

  ### 1. The Math Check (Item 6 & 7)

  First, let's verify your arithmetic and your prediction.

  **Your Data:**
  *   **High-Need:** Intensive (40%) vs Standard (25%) $\rightarrow$ RD = $+15\%$
  *   **Low-Need:** Intensive (80%) vs Standard (70%) $\rightarrow$ RD = $+10\%$
  *   **Crude:** Intensive (50%) vs Standard (58.75%) $\rightarrow$ RD = $-8.75\%$

  **Your Claim (Item 7):** "If they extend the intensive track to every intake, the payoff will be bigger than either of those stratified figures."

  **The Calculation:**
  To estimate the payoff if *everyone* gets the intensive track (the Average Treatment Effect on the Treated/Total population), you must standardize the stratum-specific effects using the population weights of the intake cohort.

  *   Total Intake: 800 participants.
  *   High-Need proportion: $400/800 = 0.5$
  *   Low-Need proportion: $400/800 = 0.5$

  **Standardized Risk Difference:**
  $$ (0.5 \times 15\%) + (0.5 \times 10\%) = 7.5\% + 5.0\% = 12.5\% $$

  **The Verdict:**
  The expected population payoff is **12.5%**.
  Your stratified effects were **15%** and **10%**.
  **12.5% is not bigger than either.** It is exactly between them.

  **Severity:** **CRITICAL.**
  This is a mathematical impossibility under the Risk Difference model. An average cannot exceed its components. This claim will be easily dismantled by anyone who checks the arithmetic.

  **Repair:**
  Change the claim to: *"The payoff will be a weighted average of the two stratum figures. Since both are positive, the overall payoff is guaranteed to be positive, unlike the crude figure."* Do not claim it will exceed the stratum-specific maximums unless you are positing a synergy (interaction) that your data does not show (and which is unlikely in this context).

  ---

  ### 2. The Methodological Flaw (Item 4)

  **Your Commitment:** "My working test for whether a crude comparison was confounded is to adjust... and see if the estimate moves. Moves materially → the crude one was confounded."

  **The Problem:**
  This is the "change-in-estimate" criterion. It is widely taught but logically flawed.
  1.  **False Negatives:** A variable can be a strong confounder but be perfectly balanced between groups by chance. Adjusting for it changes nothing, but it *was* a confounder structurally.
  2.  **False Positives:** Adjusting for a collider (a variable caused by both treatment and outcome) will make the estimate move, but the crude estimate was unbiased (for the total effect). You would incorrectly conclude the crude was confounded.

  **Severity:** **HIGH.**
  You are using a statistical symptom to diagnose a structural problem. This contradicts Item 1 ("Numbers can never tell me which variables to condition on"). If the numbers *could* tell you via movement, Item 1 would be false.

  **Repair:**
  Demote Item 4 from a "test" to a "sanity check." Your primary justification for adjustment must remain Item 1 (knowledge of the assignment process). In your specific case, you know high-need people were routed to intensive care. That structural knowledge justifies the adjustment, not the fact that the number moved from -8.75% to +12.5%.

  ---

  ### 3. The Rhetorical Tension (Item 8 vs. Item 2)

  **Your Commitment:** Item 2 says "No post-assignment conditioning." Item 8 says "Track only pays off where the participant engages."

  **The Problem:**
  Item 2 is statistically correct (conditioning on attendance creates selection bias). Item 8 is qualitatively true but statistically dangerous if interpreted as an estimate. If the Board hears "it only works if they attend," they may ask, "So what's the effect for attenders?" If you provide that number, you violate Item 2.

  **Severity:** **MODERATE.**
  This is a communication risk, not a calculation error.

  **Repair:**
  Phrase Item 8 strictly as mechanism, not effect estimation. *"Engagement is a necessary mechanism for the effect, but we cannot estimate the effect conditional on engagement without introducing bias."* Keep the refusal (Item 2) but soften the discussion (Item 8) to ensure they don't ask for the forbidden number.

  ---

  ### 4. The Worries (Resolved)

  **Worry 1: The Reversal vs. Item 1.**
  *   *Concern:* Using the Simpson's Paradox reversal to detect confounding feels like letting data determine causes (violating Item 1).
  *   *Audit:* **No Conflict.** The reversal is a *symptom*, not a *diagnosis*. The data told you "Something is inconsistent." Item 1 (your knowledge of the referral process) told you "Need drove assignment." Together, they confirm confounding. The reversal alone doesn't tell you *which* variable is the confounder, only that the crude estimate is unreliable. You are safe here.

  **Worry 2: Relativism vs. Truth.**
  *   *Concern:* Saying "effects are relative to population" then saying "Board's number is wrong."
  *   *Audit:* **No Conflict.** There is no single "Effect of the Track." There is the "Effect in the Observed Assignment Mix" (Board's number) and the "Effect in the Intake Population" (Your number). The Board's number is descriptively true but causally misleading for policy. Your number is the causal estimand for the policy question ("Should we offer this to everyone?"). You are not being incoherent; you are distinguishing between a *descriptive statistic* and a *causal estimand*.

  ---

  ### 5. The Settled vs. Contested (Item 3 & 5)

  **Item 3 (Risk Differences & Collapsibility):**
  *   *Status:* **Settled Technical Fact / Contested Preference.**
  *   *Reasoning:* It is a mathematical fact that Odds Ratios are non-collapsible (marginal OR $\neq$ conditional OR even without confounding). It is a mathematical fact that Risk Differences are collapsible.
  *   *Consensus:* Among causal inference statisticians, preferring RD for policy reporting is standard because it is interpretable and collapsible. However, some argue ORs are better for modeling stability. Your stance is defensible and common in epidemiology/policy, provided you don't claim ORs are "wrong," just "less suitable for marginal interpretation."

  **Item 5 (Sure-Thing Principle):**
  *   *Status:* **Settled.**
  *   *Reasoning:* If $RD > 0$ in all strata, the weighted average RD must be $> 0$. This is mathematically guaranteed. Your invocation of this is correct and supports your rejection of the crude negative finding.

  ---

  ### Summary of Repairs

  | Item | Status | Severity | Action Required |
  | :--- | :--- | :--- | :--- |
  | **7** | **Wrong** | **Critical** | **Rewrite.** The average effect (12.5%) cannot exceed the stratum effects (10% & 15%). Claim consistency, not magnitude growth. |
  | **4** | **Flawed** | **High** | **Reframe.** Do not call it a "test." Call it a sensitivity check. Rely on Item 1 (process knowledge) for justification. |
  | **8** | **Risky** | **Moderate** | **Clarify.** Ensure discussion of engagement is qualitative (mechanism) not quantitative (conditional effect). |
  | **1, 2, 5, 6** | **Sound** | **None** | Keep. These are methodologically robust. |
  | **3** | **Defensible** | **Low** | Keep, but acknowledge ORs have other uses (modeling) even if RD is better for reporting. |
  | **Worries** | **Resolved** | **None** | No change needed. Your intuition was better than your anxiety. |

  ### The Single Revision

  **Fix Item 7.**

  This is the only claim that is mathematically false. If you tell the Board the effect will be *bigger* than the stratum-specific effects, you are promising a synergy that does not exist in the data.

  **Current:** "If they extend the intensive track to every intake, the payoff will be bigger than either of those stratified figures."
  **Revision:** "If they extend the intensive track to every intake, the payoff will be the weighted average of the stratified figures. Since both strata show a benefit, the overall payoff will be robustly positive, unlike the crude comparison."

  This single change protects you from mathematical embarrassment while preserving the core policy recommendation (expand the track). Everything else is defensible epidemiology.
