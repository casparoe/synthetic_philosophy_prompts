answer: |-
  First, the factual record: your memory is remarkably clean, but there are three specific touchpoints to tighten. The symposium you're referencing was the 1926 AAPG (American Association of Petroleum Geologists) meeting in New York; it was indeed hostile, but the "oil geologists" framing is slightly reductive—it was largely a clash between field geologists (who saw the fit) and geophysicists (who said the math forbade it). Harold Jeffreys is the name you want for the force calculations; his *The Earth* (1924) was the definitive text declaring the mechanism impossible. And Wegener died on his *fourth* Greenland expedition in November 1930, not just "the last one," which matters because it underscores the commitment you're describing—he died in the field trying to verify his own loan.

  Now, the mapping. You are right that this isn't a binary. It is a triad of communities with different evidential thresholds.
  1.  **Wegener, Paleontologists, Climatologists:** They had the *correlation* evidence (fossils, climate, fit). For them, the hypothesis was "living."
  2.  **Geophysicists (Jeffreys et al.):** They had the *mechanism* evidence (physics). For them, the hypothesis was "dead."
  3.  **The Hess Generation (Post-WWII):** They had new *technology* (magnetometers, sonar) that changed what counted as evidence.

  **Clifford's Doctrine:**
  Clifford's "Ethics of Belief" lands heavily on the geophysicists' side in the 1920s. His ship captain analogy ("no right to believe on insufficient evidence") maps perfectly onto the rejection of Wegener. The physics *did* say continents couldn't plow through ocean crust. To believe otherwise without a mechanism was, for Clifford, epistemically vicious.
  *   **What it explains:** It justifies the 40-year delay. It explains why the community didn't just swap one dogma (land bridges) for another (drift) without a causal account. It validates the intuition that "lucky guesses" don't earn epistemic credit.
  *   **What it misses:** It cannot account for the Land Bridge double standard. The establishment believed in sinking continents (land bridges) without a mechanism for *that* either. Clifford assumes evidence is objective and equally applied; he has no tools for analyzing why one insufficient hypothesis (drift) was rejected while another insufficient hypothesis (land bridges) was tolerated.
  *   **Where it slides:** Community testimony. Clifford treats belief as an individual duty. He doesn't fully grapple with how a community decides whose testimony counts. The geophysicists' authority wasn't just about evidence; it was about institutional power. Clifford assumes the "evidence" speaks for itself, not that it is mediated by who holds the microphone.

  **James's Doctrine:**
  James's "Will to Believe" lands on Hess. James argues that when an option is **living** (plausible to the believer), **forced** (you must choose to act or not), and **momentous** (the opportunity is unique), we have the right to believe ahead of evidence.
  *   **What it explains:** It justifies Hess's "geopoetry." Hess knew the evidence wasn't there yet. He knew the commitment of ships and money was a risk. James authorizes that risk. It explains why the 1960s breakthrough happened: someone was willing to treat the hypothesis as true enough to bankroll the verification.
  *   **What it misses:** James explicitly restricts his license to cases where the belief *helps make the truth*. He uses examples like social trust or moral outcomes. He is skeptical of applying this to brute physical facts (like whether a seafloor spreads).
  *   **Where it slides:** This is where I need to attack your suspicion. You argue James doesn't reach this because seafloor spreading is independent of belief. I contend this draws the line too sharply for a Pragmatist. For James, a truth that is *in principle* verifiable but *in practice* inaccessible due to lack of investment is functionally no truth at all. If belief is the necessary condition for the verification (the ships), then belief is a necessary condition for the truth *to exist for us*. James's "Will" isn't just about creating truth; it's about unlocking the door to truths that are locked behind resource barriers. The "momentousness" of the option isn't just that we might be right, but that if we don't believe enough to look, the truth remains forever hidden. In that sense, the belief *is* bound up in the truth's realization.

  **The Epistemic Loan:**
  Your framing of the "epistemic loan" (belief causes verification) is stronger than James's own formulation, but it is the only way to make James work here. Clifford forbids the loan entirely (no belief without evidence). James permits the loan if the stakes are high enough. The Land Bridge people defaulted (no verification found). Hess paid it off (magnetic stripes found).
  *   **Clifford's silence:** He has no concept of a productive loan. To him, debt is sin.
  *   **James's silence:** He doesn't distinguish between "belief makes it true" and "belief finds the truth." He conflates them under "pragmatic consequences."

  **Confidence and Uncertainty:**
  I am **85% confident** in the philosophical mapping: Clifford explains the rejection, James explains the acceptance, and your "loan" concept bridges the gap James left open.
  I am **60% confident** in the specific sociological motivation of the 1926 AAPG symposium. While I know it was hostile, distinguishing how much was pure geophysics (Jeffreys) versus economic conservatism (oil interests preferring stable continents for drilling rights) is historically debated. This is the **one point I am least sure of**: the degree to which the "Land Bridge" preference was driven by economic utility rather than just evidential inertia.

  **The Verdict Logic:**
  If you side with Clifford, you validate the 1920s skeptics but lose the 1960s breakthrough (Hess would have been unethical to publish "geopoetry"). If you side with James, you validate the breakthrough but risk the Land Bridge error. However, the normative lesson of the drift episode is that *progress required the risk*. The cost of the Land Bridge error was finite; the cost of rejecting Drift was a stalled science. The episode favors the philosopher who permits the risk necessary for verification.

  Verdict: JAMES
