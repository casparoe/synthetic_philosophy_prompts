      *   **Leibnizian Framework:** *Theodicy* (1710), *Monadology* (1714). Key concepts: God's choice of whole worlds, Principle of Sufficient Reason (PSR), permitting vs. willing, antecedent vs. consequent will, part vs. whole series.
      *   **Specific Tasks:**
          1.  Map the thesis to the event using Leibniz's machinery.
