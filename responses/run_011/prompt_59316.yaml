  2.  **Drafting - Section by Section:**

      *   **Section 1: Leibniz's Machinery and the Event.**
          *   *Core Concept:* God doesn't choose events; He chooses *worlds* (compossible series of monads).
          *   *Application:* Lisbon isn't an isolated evil; it's a necessary consequence of the physical laws and free choices that make *this* specific world the "best."
          *   *Will:* God *permits* the evil (metaphysical/physical) but does not *will* it as an end. It falls under the *consequent will* (what God wills after considering all factors) rather than *antecedent will* (which wills all good abstractly).
          *   *Part vs. Whole:* You cannot judge the world by a single catastrophe. The "best" is a calculation of maximum variety/order with minimum simplicity of laws. Removing Lisbon might require changing laws that produce greater goods elsewhere.
          *   *PSR:* There is a sufficient reason for Lisbon, even if humans can't grasp it. It fits into the harmony of the whole.

      *   **Section 2: Falsifiability and Epistemic Limits.**
          *   *Question:* What could count against the thesis?
          *   *Leibniz's View:* Strictly speaking, only a logical contradiction in the concept of God or a demonstration that a *better total series* is possible. Empirical evil alone doesn't refute it because evil is compatible with the best whole (as a *conditio sine qua non*).
          *   *Epistemic Concession:* Leibniz admits finite minds cannot see the infinite connections. "We cannot see the whole" is a textual commitment (e.g., *Theodicy* preface, discussions on the City of God).
          *   *Unlosable?* It risks being unfalsifiable *empirically*, but it remains falsifiable *logically*. Is it a legitimate concession? Yes, based on the distinction between finite and infinite intellect in the *Monadology*. It's not a dodge; it's a structural feature of his metaphysics.

      *   **Section 3: Global vs. Local Optimism.**
          *   *Definitions:*
              *   Global: World W is better than any alternative W'.
              *   Local: Event E in W cannot be improved without making W' worse overall.
          *   *Entailment:* Does Global entail Local? Yes, for Leibniz. Because of the "pre-established harmony" and compossibility, you cannot tweak a local event without altering the entire substance/series. To change Lisbon is to change the world.
          *   *Voltaire:* Targets Local Optimism ("All is well *here*"). He sees specific suffering as gratuitous.
          *   *Rousseau:* Concedes Local Optimism (we built the houses poorly). He shifts blame to moral evil/human action.
          *   *Leibniz's Problem:* If Rousseau is right that humans *could* have built differently (free will), why did God choose the series where they didn't? Leibniz says God chose the series with the best *balance* of free will and physical law. If humans *could* have done better in *this* world, that challenges the "Best" claim. But Leibniz argues counterfactuals about free creatures are tricky.
          *   *Verdict on Distinction:* The distinction collapses for Leibniz. You cannot have Global without Local because the parts are metaphysically tied to the whole. Voltaire attacks a straw man if he thinks Leibniz claims every *moment* is locally optimal in isolation, but Leibniz claims every moment is optimal *as part of the series*. Rousseau's move helps theodicy morally but doesn't solve the metaphysical selection of the series.

      *   **Section 4: Pombal's Reconstruction.**
