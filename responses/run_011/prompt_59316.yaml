          *   *Candide:* Pangloss represents the caricature of *Local* Optimism applied absurdly. The public memory shifting to Pangloss suggests the thesis's epistemic status is vulnerable to reductio ad absurdum when applied to concrete suffering. It shows the theory lacks *practical* traction even if it holds *metaphysical* coherence.
          *   *Final Word:* The theory is silent on *why* Lisbon specifically, but loud on *that* it must fit. The verdict is Immunization via Epistemic Humility.

