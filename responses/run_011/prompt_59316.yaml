answer: |-
  ### 1. The Machinery of the Theodicy Applied to Lisbon

  To map the Lisbon earthquake onto Leibniz's framework, one must first discard the notion that God evaluates events in isolation. In the *Theodicy* and *Monadology*, the object of divine choice is not a specific occurrence but a *compossible series* of substances and events. God's intellect surveys the infinite array of possible worlds, each a self-consistent narrative of monads. He wills the actual world not because it lacks evil, but because it maximizes the ratio of essence to existence—yielding the greatest variety of phenomena governed by the simplest laws.

  Consequently, regarding Lisbon, Leibniz's thesis commits the holder to the following:
  *   **Holism:** The earthquake cannot be evaluated as a discrete evil. It is a necessary consequence of the physical laws (the "simplest laws" producing the richest phenomena) and the free choices of monads that constitute this specific world. To remove the earthquake would be to select a different world entirely, one which, by hypothesis, would contain less overall perfection.
  *   **Permitting vs. Willing:** God does not *will* the suffering of Lisboans as an end. This falls under the distinction between *antecedent will* (which wills all good abstractly) and *consequent will* (which wills the best total combination). God *permits* the physical evil of the earthquake as a *conditio sine qua non* for the greater goods compossible with it (e.g., the exercise of virtue, the manifestation of divine justice, or metaphysical necessities of matter).
  *   **Principle of Sufficient Reason (PSR):** There is a sufficient reason for Lisbon's destruction, located in the preceding state of the universe and the metaphysical structure of this world. That human beings cannot discern this reason does not negate its existence; it merely marks the limit of finite understanding.
  *   **Part and Whole:** Leibniz insists that no part can be evaluated apart from the whole series. The death of thousands on All Saints' Day is a shadow in a painting that contributes to the overall harmony. To judge the world by this event is to judge a symphony by a single dissonant chord.

  ### 2. Falsifiability and the Epistemic Limit

  On Leibniz's own commitments, what observation could count against the thesis? Strictly speaking, only a logical demonstration that a *better total series* was metaphysically possible could refute it. Empirical evidence of suffering cannot refute the thesis because the thesis explicitly predicts the presence of evil as a necessary component of the best compossible whole.

  This raises the question of whether the appeal to human ignorance ("we cannot see the whole") is a legitimate epistemic concession or a device to make the thesis unlosable. Textually, in the *Theodicy*, Leibniz distinguishes between the *absolute* necessity of logic and the *hypothetical* necessity of the created order. He concedes that finite minds cannot trace the infinite connections of the universe (the "City of God"). This is not an ad hoc retreat but a structural feature of his metaphysics: the infinite calculus of perfection is accessible only to the divine intellect.

  However, this creates a tension. If no empirical state of affairs can falsify the claim because any apparent evil can be postulated as a necessary condition for a hidden greater good, the thesis risks becoming unfalsifiable in practice. Yet, Leibniz would argue it remains falsifiable *in principle* (if one could demonstrate a logical contradiction in God's choice or a superior compossible series). The distinction rests on the text's insistence that our inability to see the connection is a limitation of *capacity*, not a lack of *connection*. It is a legitimate concession to finitude, provided one accepts the premise that the universe is a rationally interconnected whole. If one rejects that premise, the defense appears as immunization; within the system, it is a consistent epistemic boundary.

  ### 3. Global vs. Local Optimism

  We must distinguish **Global Optimism** (the actual world is unsurpassable as a whole) from **Local Optimism** (no part of the actual world is improvable without cost to the rest).

  *   **Entailment:** For Leibniz, Global Optimism *entails* Local Optimism. Because of the pre-established harmony and the nature of compossibility, one cannot alter a single event (a local part) without altering the substance of the monads involved, which ripples through the entire series. To improve Lisbon locally would be to create a different world. Therefore, if this is the Best World, every event within it is the best *possible version of that event* within that series.
  *   **Voltaire's Target:** Voltaire's poem attacks Local Optimism. He points to specific suffering (crushed children, burning churches) and asserts these could be better without necessitating universal collapse. He treats the evil as gratuitous. Leibniz's resources defend only Global Optimism, but because Leibniz binds the local to the global metaphysically, he is forced to defend the local as necessary. Voltaire exposes the intuitive absurdity of applying Global Optimism to Local experience.
  *   **Rousseau's Concession:** Rousseau's reply concedes Local Optimism is false regarding the *physical* arrangement. He argues nature did not build the houses; man did. By relocating the calamity to human moral evil (poor construction, density), Rousseau attempts to save Global Optimism by arguing God gave us freedom, and we misused it.
  *   **The Collapse:** For Leibniz, Rousseau's distinction does not fully rescue the thesis. If God chooses the *entire series*, He chooses the series in which humans build fragile houses on All Saints' Day. If a series exists where humans build flexibly and survive, and that series is compossible, why was it not chosen? Leibniz must argue that the series with the earthquake and the moral failure yields a higher total perfection than the series with earthquake-proofing (perhaps because the latter lacks the subsequent moral growth or scientific discovery). Thus, the distinction between Global and Local collapses in Leibniz's system: you cannot have a better local outcome (survival) without it being part of a different global series. Rousseau saves Providence by blaming Man, but Leibniz must blame the Metaphysical Selection of the Series.

  ### 4. Pombal's Reconstruction as Evidence

  Pombal's reconstruction—the *Baixa Pombalina* with its grid and flexible framing—constitutes an apparent local improvement. It demonstrates that the physical arrangement of Lisbon *was* improvable.

  *   **Pressure on Local Optimism:** This weighs heavily against Local Optimism if understood as "the physical state of affairs at time *t* could not be better." Pombal proved it could.
  *   **Transmission to Global Optimism:** Does this pressure transmit to Global Optimism? Leibniz would argue: Pombal improved the *future* of the series, but he did not change the *necessity* of the 1755 event within the actualized series. The disaster was the sufficient reason for the reconstruction. The "Best World" may be one that includes the disaster *in order to* include the reconstruction and the birth of seismology.
  *   **Silence:** Leibniz's theory is silent on seismology and architecture. It cannot predict that flexible framing is better than stone. However, the theory implies that if the reconstruction is a genuine good, it was compossible only via the path taken. If one argues that God could have created a world with the reconstruction *without* the disaster, Leibniz must reply that such a world was not compossible with the other goods of this universe (e.g., the specific free choices of the builders). The improvability of the city *ex post facto* does not prove the world was suboptimal *ab initio*, unless one assumes the end state could be reached without the tragic means. Leibniz assumes it could not.

  ### 5. Verdict

  The Lisbon earthquake did not **refute** Leibniz's thesis, because the thesis is metaphysically insulated from empirical disconfirmation by the doctrine of compossibility and the distinction between antecedent and consequent will. Nor did it **bypass** the thesis; the event was explicitly absorbed into the discourse of theodicy as a primary test case.

  The episode **immunized** the thesis. By retreating to the claim that finite minds cannot grasp the harmony of the whole, Leibnizianism made itself invulnerable to empirical counter-example, but at the cost of practical utility. It renders the thesis silent on the specific *why* of Lisbon, speaking only to the necessary *that*.

  The fact that Voltaire's tutor-optimist Pangloss in *Candide*, rather than the rigorous argument of the *Theodicy*, became the public memory of Leibnizianism reveals the thesis's precarious epistemic status. Pangloss represents Local Optimism applied absurdly ("private misfortunes make the general good"). The public's embrace of this caricature suggests that while Global Optimism may hold metaphysical coherence, it is cognitively useless for the suffering subject. The theory requires a God's-eye view to be validated, but humans live in the local view. Therefore, the thesis survives as a logical possibility but fails as a liveable philosophy. It is immunized against refutation, but thereby rendered inert for consolation.
