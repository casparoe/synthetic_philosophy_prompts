      *   *Check:* Is the distinction between Global and Local robust? *Correction:* I need to be careful. Leibniz *does* believe every detail is determined. So Local Optimism *is* entailed. If Pombal improved it, did he prove God wrong? No, he proved humans can optimize within the series. But could God have created the series *with* the optimization from the start? Leibniz says maybe not, if the optimization requires the experience of the disaster.
