answer: |-
  **Preliminary Assessment of Your Charge**

  Before drafting the memo, I must address your final instruction directly: **Your current framing of the decision is partially flawed.** You are asking the committee to decide whether to fund an expansion based on a dataset that cannot, in its current form, answer the causal question of whether the pilot *caused* improvement.

  The data you have describes a correlation between a specific set of schools and their test scores, but it conflates three distinct variables: (1) the effect of the instructional model, (2) the effect of volunteer bias (since schools opted in), and (3) the statistical artifact of changing the definition of "at-risk" mid-stream.

  If you proceed to a vote on expansion based solely on the subgroup vs. overall debate, you are voting on a narrative preference, not evidence. The memo below is structured to force the board to acknowledge this limitation. It recommends a **conditional, phased expansion** rather than a full rollout, explicitly tied to gathering the missing causal evidence. It reframes the "which table to publish" question not as a choice between truth and optics, but as a choice between two incomplete pictures that must be presented together with heavy caveats.

  ***

  **MEMORANDUM**

  **TO:** Research, Evaluation, and Accountability Committee; Board of Education
  **FROM:** Committee Chair
  **DATE:** [Date]
  **SUBJECT:** Recommendation on Literacy Pilot Reporting and FY24 Expansion Funding

  **Executive Summary and Recommendation**

  The Committee faces a decision regarding the public reporting of the two-year literacy pilot and a request to fund its district-wide expansion at a cost of $1.8 million. The data presents a paradox: the nine pilot schools show higher proficiency rates within every student subgroup compared to the fourteen comparison schools, yet they show a significantly lower *overall* proficiency rate.

  This memo recommends the following actions for Thursday's vote:

  1.  **Reporting:** The annual public report card must present **both** the overall and subgroup tables side-by-side. However, they must be accompanied by a mandatory explanatory note stating that the lower overall score is a mathematical artifact of the pilot's success in identifying more struggling readers, not necessarily a failure of instruction. To publish only the overall figure is misleading; to publish only the subgroup figures is opaque.
  2.  **Funding:** We recommend **against** a full, immediate district-wide expansion. Instead, we recommend approving a **one-year, scaled expansion** to five additional schools (totaling 14 pilot sites), funded at approximately $1.0 million. This expansion must be conditional on the implementation of a rigorous evaluation design (detailed below) to isolate the program's true impact.
  3.  **Screening Policy:** We recommend adopting the universal screening protocol district-wide immediately, independent of the instructional pilot. The current "referral-only" system in non-pilot schools is demonstrably under-identifying students in need, creating an equity gap that the district cannot ignore regardless of the instructional model's efficacy.

  **The Core Analytical Challenge: Which Table Tells the Truth?**

  The committee is divided between the principals' view (subgroups tell the story) and the CFO's view (the overall number is the only accountable metric). To make a sound decision, we must understand why these numbers diverge.

  The divergence is driven by **composition effects**, specifically a phenomenon known in statistics as Simpson's Paradox. In the pilot schools, the universal screening acted as a wider net. It identified 2,500 students for services (42% of the cohort), whereas the comparison schools identified only 2,000 (20% of the cohort).

  Crucially, the students newly identified in the pilot schools were not "failing" at the same rate as those already identified in the comparison group, but they were certainly struggling more than the general population. By moving hundreds of students from the "not identified" bucket (where the proficiency rate is ~68%) into the "identified" bucket (where the proficiency rate is ~24%), the pilot schools mathematically dragged down their weighted average, even though the instruction within those buckets appeared more effective.

  **The Strongest Case for the CFO's Position**
  We must give full weight to the CFO's argument, as it rests on the principle of **accountability to the stakeholder experience**. The CFO argues that a parent does not care about the mechanism of identification; they care about the probability that *their* child, walking into a pilot school, will be proficient. If a random third-grader enters a pilot school, their chance of proficiency is 49.7%. If they enter a comparison school, it is 55.2%. From the perspective of a parent choosing a school, or a reporter assessing district performance, the overall figure is the only one that reflects the *current reality* of the school's output. Furthermore, since the state accountability index uses this overall figure, the pilot schools will officially be labeled "lower performing" this year. Ignoring this metric ignores the real-world consequences the district will face in terms of reputation and state sanctions. The CFO is correct that the overall number represents the "bottom line" of the system as it currently stands.

  **The Strongest Case for the Subgroup Perspective**
  However, the principals are correct that the overall figure penalizes the district for *looking harder* for problems. The "identified" group in the pilot schools is not a pre-existing population; it is a group created by the intervention itself. Comparing the "identified" students in pilot schools to those in comparison schools is comparing apples to oranges because the criteria for entry changed. The pilot schools found children the other schools missed. If we judge the program by the overall score, we create a perverse incentive: to look good on paper, schools should identify fewer struggling students. The subgroup analysis suggests that *once identified*, students in the pilot schools received better support (4 points higher proficiency) than similar students in comparison schools.

  **What the Data Cannot Settle**

  Here lies the critical gap: **Neither table proves the instructional model works.**

  The psychometrician's concern is valid and fatal to a confident "yes" vote on expansion. Because identification was an *outcome* of the pilot, we cannot treat "identified status" as a controlled variable. We do not know if the 4-point gain in subgroups is due to:
  1.  The small-group instruction model.
  2.  The fact that pilot schools volunteered (suggesting higher staff motivation or better leadership).
  3.  The demographic differences (higher poverty in pilot schools) which might interact with the new screening in unpredictable ways.

  The current data settles only this: The pilot schools cast a wider net and achieved slightly better results within their self-defined categories. It does *not* settle whether expanding this to 50 more schools will yield the same results, nor does it prove that the instruction caused the gain rather than the volunteer effect.

  **Conditions for Expansion and Next Steps**

  Given these limitations, a full $1.8 million expansion is premature. It assumes a causal link we have not proven and risks scaling a model that may only work in highly motivated, volunteer environments.

  Instead, the Committee recommends a **phased expansion** with the following strict conditions:

  1.  **Randomized or Matched Assignment:** The five new schools added to the pilot must be selected via lottery from a pool of similar schools, or carefully matched to control schools not just on poverty, but on baseline staffing stability and leadership tenure. We must eliminate the "volunteer bias" in the next phase.
  2.  **Fixed Identification Criteria:** For the purpose of evaluation, we must establish a fixed, external definition of "at-risk" based on fall screening data *before* the intervention begins. We cannot allow the program to redefine the denominator mid-year if we wish to measure its impact on overall proficiency.
  3.  **Staff Evaluation Firewall:** In response to the Union Representative, no data from this pilot or its expansion shall be used for individual teacher evaluations or school sanctions for a period of three years. The purpose of this phase is learning, not auditing. If staff fear punishment for the "overall" dip caused by better identification, they will game the screening, rendering the data useless.

  **Questions for the Analyst**

  Before Thursday's vote, I will press the analyst on two specific assumptions that underpin our current understanding:

  1.  *The Counterfactual Identification Rate:* "If we had applied the pilot's universal screening rubric to the *comparison* schools' raw data, how many additional students would have been flagged? Can we re-calculate the comparison group's 'overall' proficiency using this hypothetical, wider identification net? This would tell us if the pilot's lower overall score is purely a function of identification or if there is a genuine instructional deficit."
  2.  *The Volatility of the 'Newly Identified':* "Among the students identified in pilot schools who would *not* have been identified under the old referral system, what was their specific proficiency rate? If this specific group is performing near the district average, it suggests the old system was simply ignoring capable kids. If they are performing very poorly, it suggests the pilot is correctly targeting the most vulnerable, which explains the overall score drag."

  **Conclusion**

  The board is asked to choose between a metric that rewards ignorance (the overall score under the old system) and a metric that rewards effort but obscures the bottom line (the subgroup scores). The honest path is to acknowledge that our current accountability framework struggles to measure programs that successfully expose hidden problems.

  We should publish the full complexity of the data with clear annotations. We should fund a smarter, smaller next step that fixes the experimental design, rather than writing a blank check for a result we do not fully understand. The goal of this committee is not to find the table that makes us look best, but to find the evidence that tells us what actually works for children. Right now, we have strong evidence that we need to screen more children; we have weak evidence that this specific instructional model is the silver bullet. Let us act on the strong evidence and test the rest.
