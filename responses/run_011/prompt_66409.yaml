  *Who:* SRE Lead. *Likelihood:* High.
  *Question:* "You're adding a simulation step to every control loop decision. That's latency. My p99 latency budget is tight. Are you telling me I have to trade milliseconds for this penalty calculation?"
  *Reply:* "We don't simulate every step in the hot path. We cache the attainability metrics and update them asynchronously, like a moving average. The penalty is a lightweight lookup during the decision cycle. We've prototyped this on a shadow cluster; the overhead is under 2% CPU and zero added latency on the critical path. It's not a full rollout simulation; it's a set of pre-computed reachability checks that run off the critical thread."
  *Vulnerability:* This assumes the cache stays fresh. If the cluster state changes faster than the cache updates, the penalty is based on stale data. You are assuming the system is slow enough for your metrics to keep up, which might not hold during a flash cascade failure.

