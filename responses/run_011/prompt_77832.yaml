answer: |-
  The certificate was heavy, printed on cardstock that felt more like plastic than paper. It listed the shares in a neat, descending column. Elias’s name was at the top: *34.0%*. Below him were four others, their percentages trailing off into decimals. Sarah, the graduate student who had managed Elena’s lab, held 18.5%. Julian, the ex-husband, held 22.0%. The remaining two, distant cousins who had surfaced only for the reading of the will, split the rest.

  The clerk behind the plexiglass didn't look up as she slid the document through the slot. "You understand the formulation?" she asked. Her voice was flat, the tone of someone who had recited the same warning ten times an hour for years.

  "I read it," Elias said.

  "Read it aloud. For the record."

  Elias cleared his throat. The text was bolded, centered. *"The aggregate tally of the Residuaries does not estimate the Decedent's intent. It constitutes the Decedent's intent. To claim otherwise is to falsify the instrument."*

  "Again," the clerk said.

  Elias read it again. The words felt slippery. They weren't describing a legal proxy; they were describing a resurrection, but one achieved through committee work. For one year, Elena would not be dead. She would be a distributed process running on five different hard drives, syncing up only when a decision was required. Her house, her unpublished notes, her dog, the checkbox on her donor card that had been left unticked. All of it waited for the quorum.

  "Sign here," the clerk said. "And here. Use the provided pen. Ballpoint only. Gel ink smudges the scanner."

  Elias signed. He felt a phantom weight in his hand, as if he were signing over a piece of himself rather than picking up a share of her. He was the largest shareholder. He told himself this meant he knew her best. He told himself it meant he was responsible for the largest chunk of her ghost. He tried not to think about the alternative: that the percentage wasn't a measure of knowledge, but merely a measure of uncontested kinship.

  ***

  The first convening was held in a conference room at the Bureau of Continuing Agency. It smelled of toner and stale coffee. The table was scarred with the rings of previous cups, previous years, previous dead people.

  Sarah was already there. She had laid out a folder for each seat, aligned perfectly with the chairs. She looked up when Elias entered, her expression serious, devoid of grief but heavy with duty.

  "I brought the agendas," she said. "I thought we should stick to the protocol strictly. It feels… respectful."

  "Respectful to who?" Elias asked, sitting down.

  "To the Agency," she said. "To Her."

  Elias didn't correct her. He had learned quickly that Sarah wasn't using shorthand. She believed the formulation. She believed that when they voted, Elena was literally speaking through the sum of their hands. To Sarah, this wasn't probate; it was a séance conducted via Robert's Rules.

  Julian arrived late, apologizing, smelling of cigarettes. The two cousins, Mark and Claire, sat in the back, scrolling on their phones. They didn't know Elena. They were here for the potential stipend attached to the residuary duty, a small fee for service.

  The Bureau Officer, a man named Henderson, sat at the head of the table. He opened a binder. "Item One: Disposition of the residential property at 4408 Oak Drive. Motion to list for sale has been submitted by Residuary Julian Vane."

  "I move we sell," Julian said. He didn't look at Elias. "The maintenance costs are draining the estate. It's the fiduciary responsibility."

  "I second," Mark said, not looking up from his phone.

  "Discussion?" Henderson asked.

  Elias leaned forward. "She bought that house to finish the book. She told me she needed the quiet. Selling it now… it's not what she would have wanted."

  "We cannot speculate on what she would have wanted," Sarah said softly. She was holding a blue pen, tapping it against her notepad. "The instrument is clear. We are not estimating. We are deciding. If we vote to sell, then *she* decided to sell. That is the only truth available to us."

  "That's a legal fiction, Sarah," Elias said. "It's a way to stop us from suing each other."

  "It's the law," Henderson interrupted. "And under Section 8, Paragraph C, the majority share weight determines the outcome. Please cast your votes."

  This was the procedural dread. It wasn't dramatic. There were no gavel bangs. Henderson passed out small cards. *YES / NO*. They had to write their share percentage next to their mark to prevent fraud. Elias wrote *34.0% NO*. He watched the others. Julian wrote *22.0% YES*. Sarah wrote *18.5% NO*. Mark and Claire, the cousins, wrote *12.5% YES* and *13.0% YES*.

  Henderson collected the cards. He laid them out on the table. He took a calculator from his pocket. He punched in the numbers. He did it twice.

  "Yes votes: 47.5%. No votes: 52.5%." Henderson looked up. "Motion fails. The property remains in the Estate."

  Julian exhaled sharply, a sound of irritation. Elias felt a surge of triumph, immediately followed by a hollow nausea. He had won. He had kept the house. But looking at Sarah, who nodded with solemn satisfaction, he wondered what he had actually done. Had he protected Elena's wish? Or had he just used his larger chunk of her corpse to bully the smaller chunks?

  "Next item," Henderson said. "Organ Donation Registry status."

  Elias stopped listening. He watched Julian. The man looked gray. Not just tired—gray. His hands were shaking slightly as he capped his pen. He had used the wrong pen initially, a gel, and Henderson had made him cross it out and use the ballpoint provided. Julian had pressed so hard the paper had nearly torn.

  ***

  Two months later, the letter came. It was standard Bureau correspondence, printed on the same heavy cardstock.

  *NOTICE OF VACANCY.*

  *Residuary Julian Vane is deceased.*

  *Apportionment Share 22.0% is now subject to Recalibration.*

  Elias sat at Elena's kitchen table—the one he had voted to keep. The house was silent. The dog, a spaniel named Buster who was also part of the Estate, slept under the chair. Elias opened the enclosure. There was a second sheet, a copy of the Administrative Code relevant to the vacancy.

  He found the clause. It was buried in the definitions of *Continuity of Agency*.

  *Section 14, Subsection D: In the event of a Residuary's death prior to the termination of the Apportionment Term, the decedent's share shall not revert to the Estate nor redistribute among surviving Residuaries. Instead, the share transfers to the legal next-of-kin of the deceased Residuary. The successor Residuary assumes all voting rights and obligations immediately upon registration. If no successor registers within fourteen days, the share is declared Null.*

  *Note: Null shares are excluded from the Total Active Weight for the purpose of Quorum and Majority calculations.*

  Elias read the note three times. *Null shares are excluded from the Total Active Weight.*

  He did the math on a napkin.

  Original Total Weight: 100%.
  Majority needed: >50%.
  Elias's Share: 34%.
  Opposition (Julian + Cousins): 47.5%.
  Sarah + Elias: 52.5%.

  They had won the house vote because Sarah had sided with him. But the next vote was coming up. The organ donation status. Elena had never checked the box, but she hadn't unchecked it either. The default was non-donation. The motion on the table was to *override* the default and authorize donation.

  Julian had been the primary mover for donation. He had argued for it passionately in the hallway after the first meeting. "She was a scientist," he'd told Elias. "She'd want the use."

  If Julian's share transferred to his next-of-kin, who would that be? Julian had a sister in Portland. She had never met Elena. She would hold 22% of Elena's agency. She would vote based on what Julian wanted, or what she thought was right, or maybe she wouldn't care at all.

  But if she didn't register within fourteen days…

  Elias looked at the date on the letter. Day 12.

  If the share went Null, it was removed from the denominator.
  New Total Active Weight: 100% - 22% = 78%.
  Majority needed: >39% (50% of 78).
  Elias's Share: 34%.

  If Julian's share vanished, Elias would no longer have a majority block, even with Sarah.
  Elias (34%) + Sarah (18.5%) = 52.5% of the *original* total.
  But of the *new* total (78%), their combined weight was 52.5 / 78 = 67%.
  Wait. Elias checked the math again.

  If the share is Null, it doesn't count toward the total.
  So the total votes available are 78%.
  To win, you need 50% of the *active* votes.
  50% of 78% is 39%.
  Elias has 34%. Sarah has 18.5%.
  Combined, they have 52.5% of the original, which is roughly 67% of the active.
  So they would still win.

  Elias rubbed his eyes. He was bad at this. He called Sarah.

  "Did you get the letter?" she asked.

  "Yes. The clause. About the Null share."

  "I've been reading it too," Sarah said. "It's Section 14.D."

  "If the sister doesn't register, Julian's share disappears. Does that help us or hurt us?"

  "It depends on the vote," Sarah said. "The donation motion. Julian was voting Yes. The cousins are voting Yes. I am voting No. You are voting No."

  "Right. So currently, Yes has 47.5%. No has 52.5%."

  "If Julian's share goes Null," Sarah said, her voice quiet, "The Total Active Weight drops to 78%. The Yes votes drop to 25.5% (Cousins). The No votes remain 52.5%."

  "So No wins bigger," Elias said.

  "Unless," Sarah paused. "Unless the clause implies that the threshold for Majority remains fixed at 50% of the *Original* Estate Weight."

  Elias flipped the paper over. He scanned the fine print. *"...excluded from the Total Active Weight for the purpose of Quorum and Majority calculations."*

  "It says Active Weight," Elias said. "So the threshold drops."

  "Then why," Sarah asked, "does it feel like we're losing her?"

  Elias looked around the kitchen. The silence of the house felt different now. It wasn't just quiet; it was depleted. Julian's death hadn't just taken a man; it had taken 22% of Elena. And if the sister didn't register, that 22% wouldn't go to anyone. It would just cease to exist. The version of Elena that lived in Julian's head was gone, and the law said that chunk of her soul was now void.

  "What if the sister registers on day 14?" Elias asked.

  "Then she votes," Sarah said. "And she doesn't know Elena. She'll vote for her brother's wish. She'll vote Yes."

  "So if she registers, donation happens. If she doesn't, donation fails."

  "And both outcomes are *her* decision," Sarah said. "Both are legally binding as her agency."

  Elias hung up. He walked into the living room. The manuscript sat on the desk, a stack of paper that the residuaries had voted to keep private for now. Buster wagged his tail, expecting a walk.

  Elias realized the dread wasn't about the house or the organs. It was about the granularity. They were slicing her up so finely that mortality could catch the pieces individually. Julian had died, and so a part of Elena had died with him, not because she was gone, but because the vessel carrying her was broken.

  He looked at the calendar. Day 13.

  If he wanted to ensure the donation didn't happen—which he did, because he remembered her fear of hospitals, her desire for wholeness—he needed the share to go Null. He needed the sister to fail to register.

  But he couldn't contact her. The Bureau forbade residuary collusion outside of convened meetings. He couldn't warn her, couldn't encourage her, couldn't send her the forms. He had to wait.

  He had to hope that a stranger's administrative negligence would preserve his sister's integrity.

  Day 14 arrived. The phone didn't ring. The mail slot didn't clatter.

  Elias sat at the table with the Bureau's contact number in front of him. He could call to check the status. He could know if the share was Null or Transferred. If it was Transferred, he knew the donation vote would pass. Julian's sister would vote Yes, the cousins would vote Yes. 47.5% vs 52.5%... wait.

  If the sister votes Yes, she brings 22% to the Yes side.
  Yes: 25.5% (Cousins) + 22% (Sister) = 47.5%.
  No: 52.5% (Elias + Sarah).
  No still wins.

  Elias stared at the numbers. He had done the math wrong earlier. Even if the sister voted Yes, the No side held the majority.
  Unless… unless Sarah changed her vote.
  Sarah believed in the Agency. If the sister registered, Sarah might feel that the "will of the residuaries" had shifted toward donation, and out of duty to the reconstructed Elena, she might switch.
  Or, if the share went Null, the Total Weight dropped.
  If Total Weight is 78%. Majority is 39%.
  No votes are 52.5% of original, which is 67% of active.
  Yes votes are 25.5% of original, which is 32% of active.
  No wins either way.

  So why did it matter?

  It mattered because of the *meaning*. If the sister voted, the decision was made by six people. If the share went Null, the decision was made by four. The resolution of the self was lower. The image was grainier.

  And there was another clause. He turned the page. He hadn't seen it before.
  *Section 14, Subsection F: In the event of a Null Share, the remaining Residuaries must convene a Special Recalibration Session to determine if the Vacancy alters the Nature of the Estate.*

  "Nature of the Estate."

  Elias picked up the phone. He dialed the Bureau.

  "Bureau of Continuing Agency," the clerk said. Same voice as before. Or maybe a different one. They all sounded the same.

  "This is Elias Thorne. Residuary for Elena Thorne. I'm calling regarding the Vacancy Notice."

  "One moment." Hold music. A synthesized piano piece that looped every twelve seconds.

  The music stopped. "Status is Pending. The successor has not registered. The share will declare Null at 5:00 PM."

  "And then?" Elias asked.

  "And then you will receive a summons for the Special Recalibration."

  "What does that mean? 'Nature of the Estate'?"

  "It means," the clerk said, "that if too much of the Agency is lost, the instrument dissolves. The remaining decisions revert to standard probate. The Agency terminates early."

  Elias felt the blood drain from his face. "Terminates?"

  "If the Active Weight falls below 60% of the Original Weight, the Self is considered non-viable. The year ends. The house is sold by the court. The manuscript is archived. The dog goes to shelter."

  Elias did the math one last time.
  Original: 100%.
  Julian's Share: 22%.
  Remaining Active: 78%.
  Threshold for Viability: 60%.
  78% is greater than 60%.

  "We're safe," Elias said.

  "For now," the clerk said. "But there are other clauses. Section 15. Resignation. If a Residuary finds the burden too great, they may petition to withdraw. Their share becomes Null."

  Elias looked at Sarah's empty chair in his memory. She was tired. He was tired. The cousins didn't care.
  If one more person dropped out… say, one of the cousins (12.5%).
  78% - 12.5% = 65.5%. Still safe.
  If Sarah dropped out (18.5%).
  78% - 18.5% = 59.5%.

  Below 60%.
  The self collapses.

  "Elias?" the clerk prompted. "Do you wish to report a change?"

  "No," Elias said. "No change."

  He hung up. He looked at the manuscript on the desk. It was just paper. It wasn't her voice. Her voice was in the room, in the space between the furniture, in the way Buster tilted his head. But it was fragile. It was held together by paperwork and the continued participation of people who were grieving, or bored, or dying.

  He walked over to the dog and scratched his ears. Buster leaned into the hand.
  "Five o'clock," Elias said to the dog. "That's when we know."

  He sat back down at the table. He didn't call Sarah. He didn't call the cousins. He just watched the clock. The administrative detail wasn't a loophole; it was a timer. Every day that passed was a day closer to a resignation, a death, a failure to register. Every day, the probability increased that the 60% threshold would breach.

  If it breached, Elena wouldn't just die. She would be declared administratively incomplete.

  The clock ticked toward 5:00 PM. The share would go Null. The house would be safe for now. The donation would be denied. But the total weight would drop, bringing them closer to the precipice. To save her agency, he needed Julian's sister to claim her share. To save her wishes, he needed Julian's sister to fail.

  He couldn't want both. But he did.

  At 4:55 PM, the phone rang. Elias let it go to voicemail. He didn't want to know. If it was the Bureau, it was the confirmation of the Null. If it was the sister, it was the transfer.

  The ringing stopped. The house settled into silence. The light shifted on the floorboards. Elias picked up the pen the clerk had given him, the blue ballpoint. He rolled it between his fingers. He had to sign something eventually. The Recalibration summons would come. He would have to vote on whether to keep the instrument alive.

  He put the pen down. He waited for the mail to come tomorrow, or the call, or the slow decay of the year. There was nothing else to do but maintain the quorum.
