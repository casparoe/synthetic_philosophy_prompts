      *Revision on Q10 (Audience):* Make sure it speaks to the "insoluble" and "status quo" folks in the room.

  4.  **Finalizing the Questions (incorporating specific constraints):**

      *   *Q1 (Founding):* Setup: You call the first round provisional. Question: Is this just a moral fiat to be inclusive? Follow-up: If yes, what work does the *procedure* do beyond the moral command?
      *   *Q2 (Validation - Concession):* Setup: I grant the spiral avoids the punctual circle. Question: But if the validating electorate was constituted by the rules it validates, isn't the recursion vicious? Follow-up: If you say "no," are you assuming the outcome rather than proving the procedure?
      *   *Q3 (Ratchet/External Constraint):* Setup: You say membership is revisable. Question: If a later demos narrows membership, does the spiral break? Follow-up: If you say "no" because of the burden of justification, isn't that an external moral constraint, not internal self-constitution?
      *   *Q4 (Sampling):* Setup: You sample affected outsiders. Question: Who defines the "affected" frame for that sample? Follow-up: If the initial demos defines it, haven't you just relocated the boundary problem up one level?
      *   *Q5 (All-Subjected):* Setup: This sounds like all-subjected with generous transitions. Question: Name one case where your spiral yields a different franchise than standard all-subjected. Follow-up: If none, is this a new theory or a complex description of the same norm?
      *   *Q6 (Nested Demoi - Load Bearing):* Setup: Scotland 2014 included resident EU/excluded diaspora; EU 2016 included diaspora/excluded resident EU. Question: How does your spiral adjudicate which franchise is right when they conflict? Follow-up: If you say "both are provisional," who decides the binding outcome in the interim?
