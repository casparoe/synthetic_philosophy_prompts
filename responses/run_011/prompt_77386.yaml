answer: |-
  Here is a sequence of ten questions designed to move from the theoretical foundation to concrete application, ending with implications for the room's skeptics. Each includes a setup, the question, and a follow-up designed to close off evasion.

  **Notes on Usability:**
  *   **Load-Bearing:** Questions 6, 7, and 10 are essential for the theoretical and political stakes. If time collapses, prioritize these.
  *   **Cuttable:** Question 5 is the first to cut if the discussion runs long; it is comparative rather than structural.
  *   **Premise Risks:** Questions 3 and 8 risk smuggling in premises she rejects (that external constraints are illegitimate; that interim authority requires full legitimacy). I have flagged these below.

  ***

  **1. The Founding Fiat**
  You describe the founding round as provisional and over-inclusive, authorized by no one. Is this founding rule not simply a normative fiat dressed up as a method?
  *Follow-up:* If it is a moral command to be generous, what work does the *procedure* do beyond that initial exhortation?

  **2. Retrospective Validation (Concession Point)**
  I grant your point that legitimacy is diachronic and the spiral avoids the punctual circle. But if the electorate validating the framework was itself constituted by that framework, does the recursion not remain vicious?
  *Follow-up:* If you deny this, are you not assuming the legitimacy of the outcome to prove the validity of the procedure?

  **3. The Ratchet and External Constraints**
  You say membership is permanently revisable, yet exclusion bears a burden of justification. If a later electorate narrows the franchise, does the spiral break?
  *Follow-up:* **[Premise Risk]** If you say "no" because the burden of justification prevents it, is that burden not a substantive constraint imposed from outside the procedure, which is the move you claim to avoid?

  **4. The Sampling Frame**
  To handle affectedness, you propose a random sample of outsiders. But who defines the sampling frame for who counts as "plausibly affected"?
  *Follow-up:* If the initial demos defines that frame, have you not simply relocated the circularity one level up?

  **5. Comparison to All-Subjected**
  Your account sounds like a standard coercion-based all-subjected principle paired with generous transitional enfranchisement. Can you name a case where your spiral yields a different franchise than that straightforward view?
  *Follow-up:* If there are no such cases, is this a new theory of legitimacy or a complex description of the same norm? **(Cuttable)**

  **6. Nested Demoi (Load-Bearing)**
  Consider the 2014 Scottish referendum, which included resident EU nationals but excluded diaspora, versus the 2016 EU referendum, which included diaspora but excluded resident EU nationals. How does your spiral adjudicate which franchise is correct when they conflict?
  *Follow-up:* If you say "both are provisional," who has the authority to decide the binding outcome in the interim?

  **7. The German Constitutional Court (Load-Bearing)**
  The German Court argued there is no single European people capable of forming a majority will. On your account, is that a claim about sociological facts or a report that the spiral has not yet closed?
  *Follow-up:* If it is the latter, does your theory entail that the EU is currently illegitimate until the spiral completes?

  **8. Interim Authority**
  Binding decisions get made while the sequence is still running. What is the source of authority for coercive decisions made in round one before round two validates them?
  *Follow-up:* **[Premise Risk]** If you say "provisional authority," does that not license coercion without legitimacy in the meantime?

  **9. Falsifiability**
  We need to distinguish progress from stasis. What observable feature shows that a given polity's sequence is merely self-reproducing rather than inclusionary?
  *Follow-up:* If "contraction" is the only diagnostic, is a slowly expanding tyranny indistinguishable from legitimacy?

  **10. The Skeptics in the Room (Load-Bearing)**
  We have colleagues here who think the boundary problem is insoluble and students who think this debate rationalizes the status quo. Does your account solve the problem or merely manage the guilt of it?
  *Follow-up:* If it merely manages the guilt, should we stop calling it a theory of legitimacy?
