answer: |-
  Thirty-four years of looking at things too small to see. Most of us spend a career trying to make the invisible visible, to turn a smear on a screen into a statement about the world. Ingrid was better at this than anyone I knew. She did not care for stories about what rocks meant. She cared for what they were. She thought talk about essence was a disease, something you caught when you stopped measuring and started guessing. She was an empiricist down to her bones. If the data did not say it, it was not so.

  We are here to formalise a name. The microprobe that made this work possible was secured by a generous donor, whose support we acknowledge. But the machine does not decide the truth. The people do.

  There is something you should know about this species. There is something Ingrid insisted go into the proposal, and it belongs in this room now. We never got a single crystal good enough for a structure refinement. Not one. The species rests on powder diffraction and chemistry. We named a thing we never once saw whole. Everyone here knows what that admission costs. It invites scrutiny. It invites doubt. Ingrid published it anyway, with the weakness stated on the first page. She did not wait for perfection. She waited for honesty. Her sons should know that about her: she would rather be precisely wrong than vaguely right. She trusted the work more than she feared the error.

  This brings us to what the mineral is. The chemistry we measured was not invented in the basement. It was settled long before there was anyone around to be wrong about it. It could not have been otherwise. We did not decide this; we found it out. The data refused to let us say anything else. There is a necessity here, but it is not a thesis about the world. It is a report on what the grains would not allow us to deny. We are bound by what is there.

  Now, the name. In a moment, I will say it. After I do, it leaves this room. It will be written by people who never met Ingrid. It will be typed in laboratories she never saw, by students who do not know the hill this came from. They will never look at the grain in the drawer. This is not a loss. It is how the work continues. The name will keep picking out the same material not because everyone re-checks the description, but because it gets handed on. It anchors the stuff to the moment we pointed at it.

  There is a complication. There is a re-examination pending on the type grain. There is a real possibility it isn't the same species as the material from the locality everyone pictures when they hear the name. We do not hide this. If the grain turns out to be something else, does the name go with the grain or with the hill? This is not a procedural question. It is about what we are doing when we name.

  My instinct is that the name goes with the grain. The hill is a description. Descriptions can be wrong. The grain is what we pointed at. We put *that* specific piece of matter in the beam. We said: this one. If the description of the hill fails, the name stays with the pointing. The name survives our having been wrong about the locality because it was never tied to the locality. It was tied to the sample. This is why the name can travel. It does not rely on everyone agreeing on a list of properties. It relies on knowing where the finger pointed.

  So the name will move forward. It will be used by people who do not know the history. They will not need to know the struggle with the powder diffraction. They will not need to know about the pending re-examination. They will write the name, and it will find the stuff. That is the only immortality we get in this business. Not memory, but reference. The name becomes a tool. It works.

  Ingrid would have rolled her eyes at this speech. She would have told me to get on with it. She would have said the mineral does not care what we call it. She is right. But we care. We need to be able to point to the world and agree on what we are touching.

  The proposal is approved. The data stands. The weakness is recorded. The pointing is done.

  It is ingridite.

  ***

  The necessity claim is smuggled into the fourth paragraph ("It could not have been otherwise. We did not decide this; we found it out."), framed as a constraint imposed by the data rather than a metaphysical truth. If the speech runs long, the first sentence to cut is the second sentence of the fifth paragraph ("It will be typed in laboratories she never saw..."), as the point about the name traveling is adequately covered by the preceding and following sentences without losing the emotional weight.
