  **MEMORANDUM**

  **TO:** Board of Directors, National Rowing Federation; Representatives for Athlete A (File 1) and Athlete B (File 2)
  **FROM:** Medical and Rules Commission
  **DATE:** 24 October 2023
  **SUBJECT:** Decisions on Eligibility and Therapeutic Use Exemptions; Proposal for New Competitive Standard

  **1. DECISIONS AND TIMELINE**

  **File 1 (Athlete A):**
  **Decision:** The Commission declares Athlete A eligible for immediate selection to the national squad and competition at the World Championships.
  **Reasoning:** No current prohibited substance is in use. The historical treatment was therapeutic, licensed at the time, and not undertaken for performance enhancement.
  **Completion Date:** Effective immediately upon receipt of this memo.

  **File 2 (Athlete B):**
  **Decision:** The Commission grants a Therapeutic Use Exemption (TUE) for the requested maintenance medication.
  **Duration:** Valid for twelve (12) months, subject to annual review based on continued medical necessity.
  **Completion Date:** Formal TUE certificate to be issued within five (5) business days.

  **2. ADOPTION OF NEW WRITTEN STANDARD**

  **Recommendation:** The Commission recommends the Board adopt a new written standard titled the **"Protocol for Historical Therapeutic Interventions in Congenital Conditions."**

  **Rationale:** Current rules assume an athlete returns to a "pre-illness baseline." This does not account for congenital conditions where no prior baseline exists, nor for cases where successful treatment results in capacity above the statistical norm. Without a written standard, future panels would be forced to re-litigate the principle established in File 1.

  **Proposed Standard Text:**
  > *An athlete shall not be deemed in violation of performance enhancement rules solely due to physiological capacity exceeding the statistical norm, provided all the following criteria are met:*
  > 1. *The underlying condition was congenital or diagnosed prior to age twelve (12).*
  > 2. *The medical intervention was completed prior to age twelve (12).*
  > 3. *The intervention was licensed and legal in the jurisdiction at the time of administration.*
  > 4. *There is no current use of prohibited substances or methods associated with the condition.*
  > 5. *The primary intent of the intervention, documented at the time, was therapeutic restoration of function, not performance enhancement.*

  **Application Criteria for Future Panels:**
  *   **Documentation:** Medical records must verify the age of diagnosis and treatment.
  *   **Intent:** Physician statements must confirm the goal was normal function (e.g., walking, running) rather than athletic optimization.
  *   **Current Status:** Drug testing must confirm no current prohibited substances are present.

  **3. REASONING FOR THE ATHLETES AND FAMILIES**

  We understand that these decisions affect your livelihoods and your belief in the fairness of sport. We have written this section so that a nineteen-year-old athlete and her parents can understand exactly why we reached these conclusions.

  **To Athlete A (File 1):**
  You were treated as a child to fix a medical problem, not to win races. You are not taking any banned substances now. The rules are designed to stop athletes from cheating using medicine. You did not cheat. We know your leg is now very strong—stronger than some other athletes. This feels unfair to them. However, sport always accepts that bodies are different. Some people are born with lungs that hold more air, or limbs that are longer. Your medical history resulted in a body that is naturally stronger in one leg. Because you did not take medicine to get this advantage recently, and because you were treated as a sick child, we cannot punish you now. To do so would mean telling children with disabilities that if they get cured, they might be banned from sport later. That is a risk no parent should have to take.

  **To Athlete B (File 2):**
  You are asking to take medicine that is usually banned because you need it to stay healthy. Your doctors say that without it, you cannot compete at the level you could before your condition was diagnosed. You are not trying to get stronger than normal; you are trying to stay stable. The rules allow this if the medicine brings you back to normal health, not beyond it. Since your treatment leaves you with some asymmetry and does not make you super-human, you qualify for this exception. We are giving you permission for one year at a time. This means you must check in with us regularly. This is not because we distrust you, but because we must ensure the medicine remains necessary for your health and not just for performance.

  **4. STRONGEST CONSIDERATIONS AGAINST THESE RECOMMENDATIONS**

  We owe it to the sport to acknowledge where these decisions are difficult. We have not ignored the arguments against clearing these athletes.

  **File 1 (Athlete A) – The Counter-Argument:**
  *The Argument:* Your rivals cannot access the therapy you had because they do not have your condition. By allowing you to compete, we are permitting an advantage that arose from medicine no one else could have. This violates the spirit of a "level playing field."
  *Why It Does Not Prevail:* A level playing field does not mean every athlete must be physiologically identical. It means no athlete gains an advantage through *cheating* or *current prohibited conduct*. Your advantage is structural and historical, similar to a natural genetic trait. Disqualifying you would penalize you for having been ill and successfully treated. The harm of excluding a healthy, cleared athlete outweighs the theoretical disadvantage to rivals who possess different natural traits.

  **File 2 (Athlete B) – The Counter-Argument:**
  *The Argument:* Granting an indefinite exemption creates administrative burden and risk. It sets a precedent where athletes might seek diagnoses later in their careers to gain access to prohibited substances under the guise of maintenance.
  *Why It Does Not Prevails:* Your condition was documented over four years of competition prior to diagnosis, which reduces the risk of fabrication. Furthermore, the priority of the Federation is the health of its athletes. Denying you maintenance medication would force you to choose between your health and your career. The risk of administrative burden is manageable through annual reviews; the risk to your health is not.

  **5. CONSISTENCY OF DECISIONS**

  The Commission affirms that these two files are decided consistently with one another in principle, though they differ in legal mechanism.

  **Consistency:** Both decisions rely on the principle that **therapeutic intent protects eligibility.** In both cases, the medical intervention was sought to resolve a pathology, not to enhance performance. Both athletes are permitted to compete because their presence on the start line does not represent a violation of the anti-doping code's core purpose: preventing cheating.

  **Distinction:** The files differ in mechanism because the risks differ.
  *   **File 1** is an **Eligibility Declaration.** Athlete A is not asking to take a banned substance. She is asking for confirmation that her body, as it currently exists, is legal. Since there is no current substance to ban, no exemption is needed.
  *   **File 2** is a **Therapeutic Use Exemption.** Athlete B is asking to take a prohibited substance. This requires a waiver of the rule, strictly monitored and time-limited.

  We treat them differently procedurally because one involves current chemistry (File 2) and the other involves historical biology (File 1), but we treat them the same morally: both are athletes who were ill, sought help, and deserve to race.

  **6. NEXT STEPS**

  The Board is requested to review the proposed "Protocol for Historical Therapeutic Interventions in Congenital Conditions" at the next quarterly meeting. Upon adoption, this protocol will be published in the Federation Rulebook under Section 4 (Medical Eligibility).

  **Signed,**

  **Medical and Rules Commission**
  **National Rowing Federation**
