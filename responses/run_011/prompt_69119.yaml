answer: |-
  An entity is alive if it maintains a distinct boundary through internal metabolic processes and belongs to a lineage capable of Darwinian evolution, relying on intrinsic machinery for its own persistence and replication.

  This definition combines **autopoiesis** (self-making/maintaining) with **lineage potential** (evolution), while adding a crucial clause about **intrinsic machinery** to separate true organisms from dependent systems. Here is how it handles your list, including where your intuition needs adjustment.

  **The Clear Cases**
  *   **Mule:** **Alive.** It maintains its own boundary and metabolism. It fails the "reproduction" test individually, but passes the "lineage" test (it is a product of an evolving lineage). Sterility does not negate life in an individual.
  *   **Flame:** **Not Alive.** It maintains a boundary and consumes energy, but it lacks internal instructions (DNA/RNA) and does not belong to a lineage subject to natural selection. Sparks are not heredity.
  *   **Prion:** **Not Alive.** It replicates, but purely through physics/chemistry acting on neighbors. It has no boundary and no metabolism.
  *   **Flu Virus:** **Not Alive.** It has a boundary and heredity, but zero internal metabolism. It cannot maintain its boundary; it hijacks a host to do the work.
  *   **Coral Colony:** **Many Alive.** Each polyp is an individual organism meeting the criteria. The colony is a society, not a single organism.
  *   **Slime Mold Blob:** **One Alive.** Despite having many nuclei, it shares a single cytoplasmic boundary and acts as a coordinated unit.
  *   **Evolving RNA in Tube:** **Not Alive.** It evolves, but it lacks a boundary and metabolism. It is a replicator, not an organism.

  **The Edge Cases (Where your principle needed tuning)**
  *   **Frozen Embryo:** **Alive.** Your principle broke here because you required the work to be happening *now*. Life is a continuous process that can enter suspended animation. The embryo is alive because it retains the *intrinsic potential* to resume the work of staying itself. If the freezer fails, it dies not because the freezer killed it, but because the failure destroyed its capacity to resume its own work.
  *   **HeLa Cells:** **Alive.** You suspected they might be dead because humans feed them. However, the dependency is *environmental* (food/temperature), not *mechanical*. HeLa cells possess the intrinsic machinery (cytoskeleton, replication enzymes) to divide themselves. We provide the fuel; they drive the engine.
  *   **Aphid Endosymbionts:** **Alive.** Like HeLa cells, they are dependent on a host environment, but they retain the intrinsic machinery for metabolism and division. They are organisms living in a very small house.
  *   **Sister's Protocell:** **Not Alive.** You are right to call it dead, but the reason is specific. The RNA evolves, and the bubble maintains a boundary, but the *bubble* lacks the intrinsic machinery to divide. The division is forced externally by the microfluidic channel. The container does not encode the instructions for its own reproduction. It is a vessel for evolving RNA, not a living cell. The RNA is a replicator; the bubble is a resource.

  **The New Cases**
  *   **A Mitochondrion:** **Not Alive.** It has metabolism and DNA, but it cannot reproduce outside the host cell. It has lost the intrinsic machinery for independent persistence. It is a living *part*, not a living *thing*.
  *   **Pig Heart on Perfusion:** **Not Alive (as an organism).** The tissue is living matter, but the heart is an organ. It lacks the lineage potential and the systemic integration to be an organism. It is a living component kept artificial.
  *   **Brain Organoid:** **Not Alive (as an organism).** Like the heart, it is a cluster of living cells. It does not constitute a whole organism capable of lineage persistence.
  *   **Computer Worm:** **Not Alive.** It replicates and evolves, but it does not struggle against physical entropy to maintain a physical boundary. It is a pattern, not a material system.
  *   **The Whole Biosphere:** **Not Alive.** It does not reproduce. There is no second Earth to inherit its traits. It is the sum of living things, not a living thing itself.
  *   **Seed Vault:** **Not Alive.** The vault is a building. The seeds inside are alive (dormant), but the vault itself is a tomb for potential life.

  Verdict: An entity is alive if it maintains a distinct boundary through internal metabolic processes and belongs to a lineage capable of Darwinian evolution, relying on intrinsic machinery for its own persistence and replication.
