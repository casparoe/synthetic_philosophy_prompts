answer: |-
  **Scoping**

  The undersigned acknowledge that terminology regarding "validity," "kind," and "noise" carries divergent metaphysical commitments. For the nosological realist, validity entails correspondence to mind-independent mechanisms; instability is measurement error. For the historical ontologist, validity entails clinical coherence within a specific historical context; instability is an ontological feature of interactive human kinds. "Noise" for the realist is confounding variance; for the ontologist, it is often the signal of looping effects.

  These differences are partly verbal, concerning the definition of "scientific kind," but partly substantive, concerning whether stability is a necessary condition for diagnostic utility. The stipulated design adjudicates the magnitude of looping effects induced by official sanction versus mere concept availability. It cannot adjudicate whether underlying mechanisms exist independent of classification, nor can it resolve normative questions regarding whether psychiatry ought to stabilize or accommodate flux. We agree to treat the empirical outcomes as neutral data bearing differently on our respective models.

  ***

  **Joint Statement on Nosology and Interactive Kinds**

  **1. Agreed Claims**

  1.  **Looping and Utility:** The existence of looping effects—where classified persons alter their behavior in response to classification—demonstrates that psychiatric categories are interactive, but does not alone demonstrate that such categories lack clinical utility or predictive power.
  2.  **Prevalence Inference:** A rise in recorded prevalence following the introduction of a category licenses neither the inference that the underlying condition has epidemically expanded nor that the category is scientifically invalid; it may indicate improved detection, changed help-seeking, or genuine ontological expansion.
  3.  **Utility vs. Validity:** Clinical utility (the capacity to guide treatment and resource allocation) is distinct from scientific validity (the capacity to track causal mechanisms); a category may possess the former without necessarily securing the latter.
  4.  **Ethics of Publication:** Publishing diagnostic criteria publicly via a self-screening instrument at the moment of official adoption constitutes a distinct intervention from clinical diagnosis, altering the epistemic environment for patients in both adopting and non-adopting jurisdictions.

  **2. Disagreements Table**

  | Disagreement | Nosological Realist Wording | Historical Ontologist Wording | What Turns on It | Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Instability** | Instability in symptom clustering over time indicates measurement error or heterogeneity within the category that must be reduced. | Instability in symptom clustering over time indicates the category is successfully tracking a moving target of human self-understanding. | Whether revision of criteria aims at stability or descriptive accuracy of the current population. | Substantive |
  | **Goal of Blinding** | Blinding raters to jurisdiction and label is essential to isolate the underlying phenomenon from cultural contamination. | Blinding raters obscures the interactive context required to understand how the phenomenon is constituted in practice. | Whether the "true" prevalence is found by stripping away context or by measuring within it. | Partly Verbal |
  | **Status of the Screen** | The public screening instrument is a detection tool that may introduce bias but does not fundamentally alter the condition being screened. | The public screening instrument is a technology of the self that teaches individuals how to inhabit the condition. | Whether the screen is treated as a measurement device or a causal agent in the disorder's formation. | Substantive |

  *Justification:* The instability disagreement is substantive because it dictates opposite research priorities (stabilization vs. monitoring). The blinding disagreement is partly verbal because both agree context matters, but differ on whether "context" is noise or data. The screen status disagreement is substantive because it concerns the causal role of the classification tool itself.

  **3. The Cruxes**

  **Crux 1: Blinded Prevalence (Outcome i)**
  *   **Sub-question:** Does official adoption (Jurisdiction A) increase blinded prevalence compared to non-adoption (Jurisdiction B), given equal access to the screening instrument?
  *   **Design Feature:** Comparison of point prevalence via structured interview with raters blinded to jurisdiction.
  *   **Realist Prediction:** Prevalence in A will exceed B, primarily due to increased help-seeking mobilization triggered by official status, not because the underlying mechanism is more common.
  *   **Ontologist Prediction:** Prevalence in A will significantly exceed B because official status confers legitimacy that allows the kind to crystallize, beyond what informal screen availability achieves.
  *   **Revision Condition:** If prevalence is equal, the Realist must concede official status does not aid detection; the Ontologist must concede official status does not amplify looping beyond cultural osmosis.

  **Crux 2: Spontaneous Vocabulary (Outcome ii)**
  *   **Sub-question:** Do patients in Jurisdiction B (no official label) use the criteria vocabulary spontaneously at rates comparable to Jurisdiction A?
  *   **Design Feature:** Pre-encounter self-description analysis.
  *   **Realist Prediction:** Vocabulary use will correlate with symptom severity, not jurisdiction; the screen drives vocabulary in both.
  *   **Ontologist Prediction:** Vocabulary use will be significantly higher in A; official sanction makes the vocabulary "liveable" in a way informal screen access does not.
  *   **Revision Condition:** If vocabulary use is equal, the Ontologist must revise the claim that official sanction is required for kind-cohesion. If lower in B, the Realist must acknowledge that language uptake is not purely symptom-driven.

  **Crux 3: Syndrome Clustering and Identity (Outcome iii & Time)**
  *   **Sub-question:** Is the category in year five the same disorder as the category in year one?
  *   **Design Feature:** Statistical clustering of criteria at Year 1 vs. Year 5.
  *   **Realist Prediction:** Clustering strength will remain stable; if it degrades, the criteria were invalid. The disorder is the same if the underlying mechanism persists.
  *   **Ontologist Prediction:** Clustering may shift as patients refine their performance of the criteria; the disorder is the same only if the interactive loop remains functional.
  *   **Revision Condition:** If clustering degrades in A but not B, the Realist must accept looping as a validity threat. If clustering remains stable in both, the Ontologist must accept that human kinds can exhibit chemical-like stability.

  **4. The Residual**

  One disagreement will survive regardless of empirical outcomes: the normative goal of psychiatric classification. The Realist maintains that the ultimate aim is to carve nature at its joints, stabilizing categories until they reflect mechanism rather than description. The Ontologist maintains that the aim is to manage interactive kinds responsibly, acknowledging that stabilization may itself be a form of coercion or distortion. This is not a factual dispute resolvable by prevalence data or clustering coefficients. It concerns what classification is *for*: is it a map of territory that exists independently of the map, or is it a tool for navigating a territory that changes when mapped? Both parties agree this study cannot answer this question, as it is conceptual and normative rather than empirical.

  **5. Concessions and Signatures**

  **Concessions:**
  *   **The Realist Signatory** concedes that some instability is inherent to human kinds and cannot be engineered away by blinding or bottom-up construction; measurement is never fully indifferent to the measured.
  *   **The Ontologist Signatory** concedes that looping is not infinite; physiological and psychological constraints limit how much a classification can alter behavior, and some clusters may reflect robust mechanisms rather than mere social scripts.

  **Closing Statement:**
  This collaboration has clarified that our dispute is not over the existence of suffering or the utility of care, but over the metaphysics of the categories we use to organize them. We agree that the "feed-checking dysregulation" case demonstrates that classification is an intervention. We disagree on whether that intervention reveals a pre-existing structure or participates in creating one. We commit to using the empirical results of this design not to declare victory, but to refine the precision of our disagreement. We sign this statement acknowledging that while our models of validity differ, our commitment to rigorous inquiry and ethical patient care is shared.

  ***

  **Signatures**

  __________________________
  Nosological Realist Signatory

  __________________________
  Historical Ontologist Signatory
