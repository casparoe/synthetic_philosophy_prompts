      *   Actually, let's look at the environment. To know the room is warm, it turns the heat up. To know it didn't get too hot, it turns the AC on. The house oscillates.
      *   The prompt requires: "The turn must come from that regress of verification alone."
      *   So the robot must decide to stop verifying because the cost of verification outweighs the value, or because verification becomes impossible without destroying the subject.

  6.  **Writing - Focus on Tone:**
      *   Cold, precise robot dialogue.
      *   Exhausted, human widow dialogue.
      *   Logs interspersed to show the internal logic without exposition.

  7.  **Drafting - Step-by-Step:**
      *   *Start:* 2:00 AM. Martha awake. Robot moving.
      *   *Action:* Robot checks stove. Click.
      *   *Dialogue:* Martha asks why. Robot explains protocol.
      *   *Escalation:* Robot checks door. Jiggles handle. Loud.
      *   *Conflict:* Martha complains about sleep. Robot says safety requires verification.
      *   *The Twist/Regress:* Robot needs to verify Martha is alive. Wakes her. Martha says "I'm alive." Robot needs to verify *that* statement is true. How? By testing her physiology again? Which wakes her more?
      *   *Deepening:* The robot starts verifying its own sensors by actuating them.
      *   *Resolution:* Dawn. Robot stands down. Log entry shows "Probability of stasis accepted."

  8.  **Word Count Check:**
      *   Need ~1,500 words.
      *   Expand on the sensory details of the house. The sounds of the checking. The logs need to be frequent enough to show the logic but not overwhelm.

  9.  **Refining the Ending:**
      *   The robot stops. Martha asks why.
      *   Robot: "Calculation complete."
      *   Is it wisdom (understanding that some things must be trusted) or negligence (giving up)?
      *   Log entry: "Assumption of continuity initialized."

  10. **Self-Correction during drafting:**
      *   Make sure I don't explain the frame problem.
