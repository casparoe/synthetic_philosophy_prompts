answer: |-
  The good is admission to a private dinner party, where the explanatory feature is the constitutive link between hospitality and non-instrumental regard.

  A host organizes a weekly salon in their home, offering gourmet meals and intellectual conversation. In the gift version, guests are invited based on mutual affection and shared interests, gratis. In the market version, the host lists spare seats on a platform like EatWith for $200 per head, screening buyers only for solvency and politeness, with no expectation of future reciprocity or friendship. The food, conversation, and setting are identical; the host is wealthy and not financially vulnerable; guests are affluent peers; friends are unaware and not displaced, ensuring no third-party harm.

  1. Gift Permissibility: Hosting friends for dinner is legally and morally permissible, often virtuous, establishing money as the sole variable.
  2. No Satz Noxious Features: Parties are affluent peers with equal bargaining power, no vulnerability, and no negative externalities for non-participants.
  3. No Liberal Escape: There is no fraud regarding the service provided, no breach of duty, and the buyer receives the exact same meal and conversation as the gift guest.
  4. Expressive Condemnation: An Andersonian argues that hospitality expresses unconditional welcome, whereas ticketing expresses conditional access, corrupting the social meaning of the gathering itself.

  Collapse Test: Delete the payment and leave the invitation identical; the objection does not survive because the expressive content reverts to hospitality, confirming the wrong isolates to monetization.

  The market liberal must argue that social meanings are mutable and that distaste for commercial hospitality is merely a conservative preference lacking normative force unless it causes harm. To distinguish expressive wrong from distaste, the theorist must show that the market version makes the *practice* of hospitality conceptually impossible, not just less pleasant. The liberal counters that if the guests enjoy the meal and conversation regardless of the ticket's origin, the "corruption" is purely in the observer's mind, rendering the expressive objection a claim about aesthetic preference rather than moral reason. The burden is on the expressivist to prove that the meaning of hospitality is fixed rather than contingent on social convention.
