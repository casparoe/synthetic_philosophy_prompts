      *   *Reason:* It is a macroscopic detector. The question "what did it register?" is meaningful because the amplification happened, regardless of whether a god-like Superobserver can undo it later. The "Fact" exists at the time of measurement.

  **Why this settles it:**
  Thursday's case conflates Irreversibility with Spacelike separation. If she says Bohm on Thursday, it could be because of Irreversibility (Rule 1) or because she prioritizes Definiteness over Relativity (Rule 2).
  The "Reversible Mars Detector" keeps the Macroscopic/Definiteness pressure of Case 3 but restores the Reversibility of Case 1.
  *   If she reverts to **Everett**, Reversibility is the Master Key.
  *   If she stays with **Bohm**, then "Macroscopic Fact" is the Master Key, and Reversibility was just a proxy for "Fact" in the previous cases.

  **My advice:** If you want to impress her Thursday, argue for Bohm based on the **Irreversibility/Fact** criterion, but explicitly acknowledge the tension with Relativity. Say: *"In the reversible cases, the foliation cost of Bohm outweighs the benefit because there are no facts to fix. Here, the thermodynamic irreversibility creates facts that Everett cannot single out. The foliation cost is now the price of admission for realism."* That shows you've reverse-engineered the trade-off, not just the verdict.
