      *   *Reasoning:* The setup is explicitly "genuinely irreversible." The thermodynamic trace locks the outcome. Reversibility is the switch that turned her to Everett in Cases 1 & 2; flipping that switch flips the verdict.
  *   **Rule 2 (Primary Pathology):** Predicts **Bohm**.
      *   *Reasoning:* While there is a Spacelike component (Relativity bug), the "No Superobserver/Irreversible" constraint activates the Definiteness bug. In Case 1, she tolerated Bohm's foliation cost *only because* there was no definite outcome yet. Here, there *is* a definite outcome (notebooks). The cost of foliation is now worth paying to secure the fact of the record. The Relativity bug is secondary because Bell correlations cannot signal.
  *   **Rule 3 (Fact of the Matter):** Predicts **Bohm**.
      *   *Reasoning:* The friends wrote in notebooks. There is a fact of the matter about what is written. Everett cannot single out one branch as *the* fact without additional structure. Bohm provides the trajectory that matches the notebook.

  **Status of Copenhagen:**
  Copenhagen has **no shot**.
  *   *Reason:* In Case 1, she rejected Copenhagen because it is silent about the region between measurements. In Case 3, she rejected it because there was "no observer for its cut." In Thursday's case, the Friends are internal to the labs. If they are the observers, we have a standard Bell test (boring). If they are quantum systems (Wigner's Friend), there is no *external* observer to effect the collapse. Since "Superobserver" is explicitly off the table, Copenhagen has nowhere to place the Cut. It either collapses too early (denying the entanglement) or too late (requiring a superobserver). Marta views this ambiguity as a fatal flaw in foundational contexts.

  ### (iii) Best Guess and Reasoning

  **Verdict:** **Bohmian Mechanics.**

  **The Bet:** I would bet the coffee on **Bohm**.

  **Why this rule over the rivals?**
  While Rule 2 (Pathology) is plausible, **Rule 1 (Reversibility)** is the strongest signal in her track record. Notice the specific language in Case 1: *"ancilla systems that an outside superobserver could in principle reverse."* Notice Case 3: *"nothing reversible even in principle."*
  Marta treats **reversibility** as the ontological switch.
  *   When unitary evolution can be recovered (Reversible), the "worlds" haven't truly split yet; they are just components of a vector. Everett is the natural language for unitary dynamics.
  *   When unitary evolution is effectively broken (Irreversible), the "worlds" are causally disconnected. At that point, asking "which world am I in?" becomes a valid physical question. Everett cannot answer it (all branches exist). Bohm can (one trajectory).
