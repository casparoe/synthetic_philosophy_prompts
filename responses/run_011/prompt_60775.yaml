  *   *"Spacelike Separation implies Everett":* Ruled out by the potential for Case 3/4 logic to apply if irreversibility is present (we haven't seen a Spacelike+Irreversible case yet, but Rule 1 predicts Bohm).
  *   *"Copenhagen is viable for Foundation Questions":* Ruled out. She rejected it in Case 1 (silent between measurements) and Case 3 (no observer). She only allows it for the Chemist (instrumentalism).

  ### (ii) Predictions for Thursday's Case

  **The Scenario:** Spacelike + Irreversible + No Superobserver + Definite Records (Notebooks).

