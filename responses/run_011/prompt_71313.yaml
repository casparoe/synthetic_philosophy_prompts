answer: |-
  Four months ago, in September, someone pulled up a theorem on their phone and told us mathematics has proven voting doesn't work. Half the room nodded. We didn't argue then, but we need to be honest about it now.

  That theorem is real. Kenneth Arrow proved that no ranked voting system can satisfy a specific set of reasonable fairness criteria simultaneously. The person in September wasn't lying about the math. But the conclusion—that we should abandon voting for a lottery—depends on treating those criteria as mandatory laws of physics rather than design choices.

  Arrow's theorem rests on assumptions. The heavy lifter is something called Independence of Irrelevant Alternatives. It assumes that if Candidate A beats Candidate B, adding Candidate C to the race shouldn't suddenly make B beat A. It sounds obvious. It feels like it should be true. But Arrow proved that if you demand this always hold, along with a few other reasonable conditions, the system breaks.

  Our statistician is right to point out that Arrow technically applies to ranked preferences producing a full social ordering, not necessarily to single-winner elections like ours. She is correct. But there is a sibling theorem, Gibbard-Satterthwaite, that applies to single-winner systems. It says any deterministic voting method is either dictatorial or vulnerable to strategic voting. The lesson isn't that voting is impossible. The lesson is that perfection is impossible. Every method fails something. The question is which failure we prefer.

  We have a local example. In 2019, our at-large seat was won by fourteen votes. There were three candidates. Everyone agrees the third candidate had no chance of winning. But their presence split the vote enough to change the winner. That is the cost of violating Arrow's assumption. That is the "Irrelevant Alternative" proving relevant. If we keep plurality, we accept that risk. If we switch to Instant Runoff, we reduce that risk but introduce complexity and potential exhaustion of ballots. If we switch to Approval, we avoid ranking paradoxes but invite threshold strategy where voters bullet-vote.

  This is where Dale's proposal deserves respect. Sortition—selecting council members by lottery—does not suffer from voting paradoxes. It bypasses the math entirely. It is logically consistent. But it trades the flaw of mathematical inconsistency for the flaw of removing voter choice. It solves the voting problem by ending voting. That is a valid trade-off to consider, but it is a trade-off, not an escape hatch.

  We are not here to find a method that doesn't fail. We are here to compare ways of failing. We are engineers, not metaphysicians. We are choosing which constraints to relax and which risks to manage. Saturday is about deciding which imperfection represents our county best.

  ***

  **Technical Notes & Traps**

  1.  **Arrow's Domain:** Arrow's theorem applies specifically to *ordinal* (ranked) preferences producing a *social ordering*. It does not technically apply to cardinal systems (like Approval) or single-wwinner systems directly.
  2.  **The "Voting Doesn't Work" Trap:** Arrow proves no system is *perfect* (satisfies all axioms), not that no system is *functional* or better than others.
  3.  **Statistician's Objection:** She is correct that Arrow doesn't strictly apply to single-winner plurality. You must pivot to Gibbard-Satterthwaite (strategy-proofness) or discuss IIA violations (spoilers) to keep the logic valid.
  4.  **Approval Voting:** Approval is cardinal, not ordinal. It escapes Arrow's theorem specifically because it doesn't require ranking. Do not claim Approval "solves" impossibility; it sidesteps specific axioms but faces strategy issues.
  5.  **IIA Definition:** Independence of Irrelevant Alternatives is often misunderstood. It means the relative ranking of A and B shouldn't change if C enters. The 2019 spoiler effect is a violation of IIA.
  6.  **Dictatorship:** In social choice theory, "dictatorship" means one voter's preferences always determine the outcome, not necessarily a political tyrant. Don't conflate the two.
  7.  **Sortition Logic:** Dale's argument is logically valid (lotteries satisfy fairness axioms voting doesn't), but normative (is it democratic?). Don't frame it as mathematically wrong, just politically different.
  8.  **Condorcet Cycles:** Don't confuse Arrow with Condorcet. Condorcet shows majority rule can cycle (A>B, B>C, C>A). Arrow is broader.
  9.  **Deterministic vs. Probabilistic:** Gibbard-Satterthwaite applies to deterministic systems. Randomized systems (like lotteries) escape it, which supports Dale's point technically.
  10. **Setup Check:** Your setup says Arrow proves "voting can't work." That is the exact misconception to avoid. Arrow proves "no ranked system satisfies all these specific fairness criteria."
