      2. Node: TRIAGE. An aid official must choose between documenting a massacre or preventing a famine; she cannot do both.
        A. The necessity of choice proves the harms are comparable.
          3. Node: DISTRIBUTION. One million dead in a single campaign versus one million dead spread across a century in hundred massacres.
            A. The concentrated campaign is morally worse.
              4. Node: AGENCY. A regime tortures one dissident for a year versus a state whose negligent dam fails and kills a million.
                A. The intentional torture is the greater wrong.
                  5. Node: LEGAL. Sentencing requires weighing aggravating factors against each other.
