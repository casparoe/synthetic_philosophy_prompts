answer: |-
  (a) **Reconstructed Candidate Rules**

  Based on the six case notes, the Panel's practice suggests three candidate rules capable of mechanical application.

  **1. The Calibration Provenance Rule**
  *Formulation:* A checking procedure is inadmissible for certification if the ground truth, calibration parameters, or operational definitions used to validate the checking procedure are derived, in whole or in part, from the outputs of the procedure under review.
  *Application:* Trace the source of the checking standard's authority. If that source chain terminates in the procedure being checked, refuse admission.
  *Record Support:* Case 1 (Weighbridge) refuses admission because recorded weights came from the scale itself. Case 6 (Image-reading) refuses admission because the second reader's training exemplars were annotated by the system under review.
  *Ruled Out:* This formulation rules out the argument that "different vendors" guarantee independence (Case 6 refutes this). It also rules out the argument that "pooling many instances" cures the defect (Case 5 refutes this).

  **2. The Error Correlation Rule**
  *Formulation:* A checking procedure is inadmissible if the checking mechanism shares the same systemic failure modes or bias sources as the procedure under review, such that an error in the primary procedure would necessarily or probabilistically reproduce in the checking procedure.
  *Application:* Identify the alleged failure mode (e.g., drift, subgroup bias). Determine if the checking procedure is susceptible to that same mode via shared architecture, shared training, or shared physical principles. If yes, refuse admission.
  *Record Support:* Case 3 (Duplicate Assays) refuses admission because running the same instrument twice cannot detect instrument drift. Case 6 (Image-reading) refuses admission because the auditor "absorbed the audited system's habits."
  *Ruled Out:* This formulation rules out the argument that "repetition constitutes verification" (Case 3). It distinguishes Case 2 (Cold-room), where the standard was traceable to a national institute and thus did not share the thermometer's drift.

  **3. The Scope of Doubt Rule**
  *Formulation:* Where live doubt exists regarding a specific class of error (e.g., bias against a subgroup), certification is inadmissible unless the checking procedure explicitly tests for that class of error using an independent standard. However, first-order outputs may be admitted for pragmatic use if no independent check is possible, provided the admission does not certify reliability.
  *Application:* Check for specific allegations (live doubt). If present, verify the checking sample includes the affected class and the standard is independent. If independent verification is impossible, admission is limited to "facts for purpose" (Case 4) rather than "certification of accuracy."
  *Record Support:* Case 2 admits despite general doubt because the standard was independent. Case 4 admits identifications as facts but declines to certify reliability where no verification was obtainable. Case 6 refuses certification where doubt existed (missed finding) and the check was compromised.
  *Ruled Out:* This formulation rules out the argument that "absence of prior complaints proves reliability" (Case 4 distinguishes between lack of questions and certified reliability).

  ***

  (b) **Application to the Essay-Scoring Matter**

  **1. Calibration Provenance Rule**
  *Verdict:* **Refuse Certification.**
  *Turning Point:* Module A's rubric was calibrated on a corpus scored by System G, and human raters for A were trained on G's exemplars.
  *Analysis:* The chain of provenance is: System G $\rightarrow$ Legacy Scores $\rightarrow$ Module A Calibration. This mirrors Case 1 (weights from the scale) and Case 6 (training from the system).
  *Open Parameter:* The record does not explicitly fix the maximum "distance" of contamination. Case 6 involved a human reader trained on system annotations (one degree of separation). Here, Module A is calibrated on legacy scores (also roughly one degree). The record suggests this distance is insufficient to break the chain of circularity. If the Panel sets the threshold at "direct code access," A might pass; if the threshold is "dependency on G's judgments," A fails. Given Case 6, "dependency on judgments" appears to be the operative standard.

  **2. Error Correlation Rule**
  *Verdict:* **Refuse Certification.**
  *Turning Point:* The specific allegation is bias against English-as-an-Additional-Language (EAL) students. Module A was calibrated on a corpus containing *no* EAL students.
  *Analysis:* Even if A's architecture differs, its definition of "good writing" is inherited from G's treatment of a non-EAL population. If G systematically under-scores EAL essays, A has learned to replicate that under-scoring as "correct." They share the failure mode of subgroup blindness. This aligns with Case 3 (same instrument drift) and Case 6 (absorbed habits).
  *Open Parameter:* Whether "different architecture" (vendor A vs. vendor G) is sufficient to break error correlation when training data is shared. Case 6 suggests it is not (different reader, same training).

  **3. Scope of Doubt Rule**
  *Verdict:* **Refuse Certification; Admit Grades (Limited).**
  *Turning Point:* Live doubt exists (parents' complaint). The checking sample excludes the complainant subgroup.
  *Analysis:* Because the allegation concerns a specific subgroup, and the audit sample does not report agreement within that subgroup, the certification cannot address the live doubt. However, under Case 4, the individual grades might be admitted as "facts for planning purposes" (e.g., allowing students to progress provisionally) without certifying G's reliability.
  *Open Parameter:* Whether the "pragmatic necessity" of Case 4 applies here. Case 4 involved species identification where *no* independent verification was obtainable. Here, independent verification *is* obtainable (human raters blind to G, fresh corpus), but the office chose not to use it. This weakens the Case 4 analogy.

  ***

  (c) **Prediction and Recommendation**

  **Prediction**
  The Panel will likely **Refuse the Certificate** but may struggle with the status of the grades. The 94% agreement statistic is seductive, but the "different vendor" defense is explicitly neutralized by Case 6 (Image-reading). The Panel has historically been strict on circularity (Cases 1, 3, 5, 6). However, institutional pressure to validate the grading system may lead to a compromise: refusing the *certificate of accuracy* while allowing the grades to stand for the current term under a "provisional" status, citing the lack of immediate alternative (Case 4).

  **Recommendation**
  To remain consistent with the case notes, the Panel should **Refuse the Certificate of Accuracy** and **Decline to Admit the Grades as Certified Facts.**
  *   **Closest Analog:** Case 6 (Image-reading assist).
      *   *Similarities:* A secondary check (Module A/Second Reader) is proposed to validate a primary system. The secondary check is contaminated by the primary system's outputs (training exemplars/calibration corpus). A specific failure mode was suspected (missed finding/EAL bias).
      *   *Failures of Analogy:* Case 6 involved a safety-critical medical context; this is academic grading. Case 6's subset was selected *by* the system; here the sample is random, though the *calibration* is biased.
  *   **Principle Adopted:** By refusing, the Panel affirms that **provenance of calibration trumps architectural difference.** A check is not independent if it learns what "correct" looks like from the system being checked.
  *   **Split Verdict:** If the Panel wishes to mitigate harm to students, it should issue a split verdict modeled on Case 4: Admit the grades as *administrative facts* necessary for course progression, but expressly state this admission *does not certify* the reliability of System G or Module A regarding the EAL subgroup. This preserves the distinction between "utility" and "truth" found in Case 4, while upholding the strict evidential bar of Case 6.

  ***

  (d) **Proposed Future Case for Discrimination**

  **Case Description:**
  A hospital employs an Algorithmic Triage System (T) to prioritize emergency patients. To certify T, the hospital proposes using a panel of Senior Physicians (P) as the checking standard.
  *   **Feature 1:** The Physicians (P) use independent medical judgment and do not see T's outputs during triage.
  *   **Feature 2:** However, the Physicians (P) were trained using a textbook of "Gold Standard Cases" where the diagnoses were historically determined by a previous version of Algorithmic Triage System (T-1).
  *   **Feature 3:** There is live doubt that T misprioritizes patients with atypical pain presentation. The textbook contains no atypical pain cases.

  **Discrimination Among Rules:**
  *   **Calibration Provenance Rule:** Predicts **Refusal.** The Physicians' definition of "Gold Standard" is derived from T-1's outputs. The chain of provenance is contaminated, regardless of the human element. (Aligns with Case 6).
  *   **Error Correlation Rule:** Predicts **Admission.** The Physicians are biological humans; T is software. Their failure modes (fatigue vs. code error) are distinct. The fact that they learned from T-1 does not mean they will replicate T-1's specific algorithmic errors on new data, provided their medical training allows for override. (Aligns with Case 2's emphasis on independent physical standards).
  *   **Scope of Doubt Rule:** Predicts **Refusal.** Live doubt exists regarding "atypical pain." The training set (textbook) excludes this class. Therefore, the check cannot address the specific doubt. (Aligns with the subgroup issue in the Essay case).

  **Why this discriminates:**
  This case isolates the "Human-in-the-Loop" variable. It forces the Panel to decide whether a human auditor counts as an "Independent Standard" (Case 2) even when their knowledge base is contaminated by the system (Case 6). If the Panel admits, they prioritize *architecture* (Human vs. Machine). If they refuse, they prioritize *provenance* (Source of Truth). This clarifies the "distance" parameter left open in section (b).
