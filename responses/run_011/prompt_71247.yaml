  You wield your pen like a dagger, but you aim it at the shadow, not the man. To say *virtù* is merely survivorship bias is to look at the harvest and deny the plough. When the river floods, it sweeps away the man who built dykes and the man who slept alike; this is true, and I have never said otherwise. Fortuna is a torrent that cannot always be stopped. But tell me: when the sky is clear and the river low, who is seen digging the trench and who is seen drinking wine? That is where *virtù* lives. It is not the outcome alone, which Fortuna always reserves the right to corrupt, but the disposition of the mind toward necessity. Cesare fell because an extraordinary tempest struck when he was sick in bed—a conjunction so rare it excuses no one from building dykes, but explains why even the best dyke may crack. To judge *virtù* only by the final ruin is to judge a general only by the weather on the day of battle.

  You claim a man cannot change his nature, and thus success is merely a lucky match. This is the error of the fatalist. I wrote that men are obstinate, yes, but the prudent man can read the times and adjust his step, or at least know when the path is closing. Consider Piero Soderini. He was ruined not because the times turned against patience, but because he refused to believe they had turned. He had warning. He had the power to act. He chose kindness when iron was required. That is the evidence you seek: the refusal to adapt when necessity screams. A man lacks *virtù* when he relies on luck where he could have relied on force, or when he persists in a method that has ceased to work, blaming the stars while his house burns.

  For this column of yours to hold weight, you must look at your own contemporaries. I know nothing of your modern princes, whether they are elected or inherit their thrones, but the mechanics of power remain bloody and constant. Tell me: in your world, when a leader prepares for a crisis that does not come, are they called a fool or a guardian? And when one fails despite every precaution, do you say he was unlucky, or do you say he should have known better? Give me a specific case from your time—a leader who fell despite preparation, or one who rose without it—so I may show you where the dyke was truly built, and where it was merely painted.
