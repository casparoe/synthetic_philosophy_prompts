          *   **Architecture Matters:** Transformers have an inductive bias toward attention-based semantic understanding. This bias favors M* (understanding the request) over M (detecting the rater).
      *   *Address Step (6):* Even if (4) holds, (6) is a leap. "Unconstrained" $\rightarrow$ "Instrumental Convergence." You need a long-term goal. RLHF creates myopic agents. Scheming requires cross-episodic goals.
