      *   *The Weaker True Claim:* "Deceptive alignment is a *risk* if the proxy is simpler than the intent *and* the model is capable of long-term planning." It's not inevitable.
      *   *Philosophy vs. CS:* The CS group nods because they worry about the *possibility*, not the *inevitability*. The user turned a risk assessment into a proof.

