answer: |-
  Here is the plan for your ninety minutes.

  ### 1. The Order of Components

  Your hunch is **correct in spirit but dangerous in execution**. You must establish the *empirical phenomenon* of preference reversal before introducing the Socratic denial, but you must not begin with the *formal result* (the math/curve). If you draw the hyperbolic curve first, you validate the economics as "truth" before the philosophy has had a chance to question the premises. The audience will treat Socrates as a commentator on the graph, rather than a challenger of the reality the graph depicts.

  **The Correct Sequence:**
  1.  **Definition of the Agent (5 mins):** Establish that we are talking about *one* continuous identity, not a sequence of different people.
  2.  **The Empirical Reversal (20 mins):** Demonstrate the preference flip using the single example.
  3.  **The Mechanism (15 mins):** Sketch the hyperbolic curve to explain *how* the flip happens (time consistency vs. inconsistency).
  4.  **The Socratic Denial (30 mins):** Introduce the argument that this flip is logically impossible.
  5.  **The Collision (20 mins):** Sit with the contradiction without resolving it.

  **Dependencies & Risks:**
  *   **Why Agent First?** If you do not define the "Agent" before showing the Reversal, the audience will silently solve the puzzle by assuming the person at Time 1 and the person at Time 2 are different entities. If they believe this, the Socratic denial becomes trivial (of course different people have different preferences). You must lock down *Identity Continuity* before you show *Preference Inconsistency*.
  *   **Why Phenomenon before Formalism?** If you present the math first, the audience accepts the "flip" as a technical feature of valuation. If you present the *choice* first ("I chose A, then I chose B"), the flip feels like a contradiction in character. Socrates speaks to character, not curves. The curve must serve as evidence for the contradiction, not as the subject itself.
  *   **What must be true before the Philosophical Question?** The audience must accept that "Better Judgment" is a ranking of preferences held at a specific time, and that "Acting" is the execution of the highest-ranked preference at that later time. They must agree that *no new information* arrived between the judgment and the act. Without this constraint, Socrates wins by default (the agent wasn't weak, they were just updated).

  ### 2. The Single Example

  **Will the Money Example Do?**
  Yes, but only if you sterilize it aggressively. The standard "£50 now vs £100 later" is fraught with hidden variables (inflation, trust, investment opportunity). For a room of non-specialists, these are not noise; they are the signal. They will use them to explain away the reversal.

  **What it Must Have:**
  *   **Identical Risk:** The guarantee of payment must be explicitly stated as identical for both options.
  *   **Identical Purchasing Power:** Explicitly state "adjusted for inflation" or use abstract "points" redeemable for goods.
  *   **Visceral Immediacy:** The "now" option must be psychologically immediate, not just temporally.

  **What it Must Lack:**
  *   **Investment Logic:** Do not allow them to think about what they could *do* with the money in the interim.
  *   **Need:** Do not make one option satisfy a pressing need (e.g., rent) while the other is luxury.

  **How to State the Reversal (The One Sentence):**
  > "At 12:00, with full knowledge of the options, you rank B higher than A; at 12:01, with no change to the options and no new information, you rank A higher than B."

  **Why Not Odysseus and the Mast?**
  Do not start with Odysseus. Odysseus is a story about a *solution* (commitment devices), not the *problem*.
  1.  **It Presupposes the Conclusion:** Odysseus binds himself because he *already admits* his future preferences will change. Using him validates hyperbolic discounting before you've argued for it.
  2.  **It Distracts from Agency:** Odysseus splits the self into the "Binder" and the "Bound." This feeds directly into the misconception you fear (that the agent who breaks the resolution is a different person). You need them to feel the unity of the agent first, so the fracture hurts more.
  3.  **It's Too Clean:** Odysseus knew the sirens were dangerous. Akrasia is often acting against judgment when the "siren" doesn't look dangerous in the moment. Odysseus implies the better judgment was constant; hyperbolic discounting implies the better judgment *changed*.

  ### 3. The Misconception Map

  **Arrival Beliefs (0–15 mins):**
  *   *Belief:* "Procrastination is a failure of discipline or energy."
  *   *Belief:* "Socrates is playing word games; obviously I can want two things at once."
  *   *Intervention:* Do not correct these yet. Let them sit. They are the fuel for the session.

  **Mid-Session Beliefs (15–45 mins):**
  *   *Belief:* "This is just how brains are wired; it's biology." (The Neural Excuse)
  *   *Belief:* "The 'Now Me' and 'Future Me' are basically different people." (The Multiple Selves Trap)
  *   *Intervention Point:* **At the very start (Component 1).** You must explicitly define the "Agent" as a singular locus of responsibility. State: *"For this session, we are forbidding the 'Multiple Selves' escape hatch. If you break a resolution, it is you who broke it, not a different version of you."* If you wait until they raise it, it will feel like a counter-argument rather than a premise.
  *   *Intervention Point:* **When drawing the Curve.** When you show the lines crossing, they will say, "So the brain just values things differently." You must correct this to: *"The model says the value changed, but the Socratic argument says if the value changed, you didn't actually hold the first judgment."* Keep the tension on the *logic*, not the *biology*.

  **Late-Session Beliefs (45–75 mins):**
  *   *Belief:* "Okay, so how do I fix this? Give us commitment strategies." (The Self-Help Slide)
  *   *Intervention Point:* **Immediately.** This is the "Binding Problem" fear you articulated. If they view the binding problem as "how do I tie myself to the mast," they have missed the point. The binding problem here is "how can one agent hold contradictory values?"
  *   *Correction:* "We are not solving procrastination today. We are asking if it is possible to define it without contradicting ourselves. Solutions require us to decide which preference is 'real.' We are not deciding that today."

  ### 4. Explicit Exclusions

  You listed quasi-hyperbolic parameterisation, naive/sophisticated taxonomies, and neural systems. You must also explicitly set aside:

  1.  **Commitment Devices:** Do not discuss Ulysses contracts, automatic savings, or blocking apps. These are solutions to the *symptom*, not the *paradox*. Discussing them validates the "Multiple Selves" theory (I am protecting Future Me from Present Me).
  2.  **Welfare Analysis:** Do not allow the question "Which preference is the *right* one?" (The long-term or the short-term?). This is a normative ethical question. The session is about positive description and logical consistency. If they ask, "But isn't the long-term view better?" reply, "Socrates doesn't care about better, he cares about true."
  3.  **Moral Culpability:** Do not discuss blame, guilt, or virtue. This turns the session into therapy. Keep it ontological (what *is* the agent?) rather than ethical (what *should* the agent do?).

  **Say this out loud:** *"We are not here to fix your willpower. We are here to see if 'willpower' is a coherent concept. If Socrates is right, there is no such thing as weakness of will, only ignorance. If the economists are right, there is weakness of will, but it looks like a math error. We are leaving it there."*

  ### 5. The Closing Question

  Do not ask for a summary. Do not ask for an opinion on who is right. Ask a question that forces them to apply the Socratic lens to the Economic fact.

  **The Question:**
  > "If Socrates were standing at the whiteboard looking at this hyperbolic curve, where would he point and say: 'This variable is not measurable'?"

  **Why this works:**
  *   If they say "The value of the reward," they haven't understood (Socrates agrees rewards have value).
  *   If they say "The time delay," they haven't understood (time is objective).
  *   **The Correct Answer:** They should identify that Socrates would challenge the idea that "Preference" is a state that can exist independently of "Action." He would argue you cannot measure the 12:00 preference *except* by the 12:00 action. Therefore, the graph depicts a fiction.
  *   **Success Metric:** If they answer this, they understand that the pairing isn't just "Philosophy says X, Science says Y." They understand that Science is measuring a phenomenon that Philosophy claims is logically incoherent. That is the tension you want them to hold.
