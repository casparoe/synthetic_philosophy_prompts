answer: |-
  # Seminar Activity: The Custom of the House

  ## 1. Materials List
  *   **Card Stock:** Cut into 60 small squares. 30 marked with a red flame symbol ("Fire"), 30 marked with a white tuft symbol ("Cotton").
  *   **Colored Tokens:** 50 black, 50 white (for scoring/betting).
  *   **Dice:** 4 standard six-sided dice.
  *   **Sealed Envelopes:** 5 large envelopes.
      *   Four labeled **"Custom"** (containing pre-sorted cards: 8 "Conjunction" cards, 2 "Separation" cards).
      *   One labeled **"Law"** (containing a blank sheet of paper).
  *   **Whiteboard & Markers:** Three distinct columns drawn: *Occasion*, *Outcome*, *Claim*.
  *   **Timer:** Visible to the class.

  ## 2. Role Assignments (18 Students)
  Divide the class into three groups. Do not explain the philosophical significance of the titles yet.

  *   **The Observers (11 students):** Their job is to track regularities. They hold the betting tokens. They decide when to wager points on an outcome.
  *   **The Naturalists (4 students):** *This is the role for the dissenters.* Their job is to inspect the "Fire" and "Cotton" cards before every round. They must sign a "Certificate of Nature" on the whiteboard attesting that the Fire card possesses the *power* to burn and the Cotton card possesses the *nature* to be burned. They maintain the "Ledger of Exceptions."
  *   **The Scribes (3 students):** Their job is to record the sequence of events on the whiteboard columns (*Occasion*, *Outcome*, *Claim*). They are forbidden from interpreting; they only transcribe.

  ## 3. Rules and Scoring
  **Currency:** Points (tracked on the whiteboard). No money.

  **Phase 1: Conjunction (25 Minutes)**
  1.  **Setup:** One "Custom" envelope is placed in the center. It contains 10 cards (8 "Burn", 2 "No Burn"). The deck is shuffled *by a Naturalist* in full view of the class.
  2.  **The Round:**
      *   **Observers** place a Fire token and a Cotton token on the table (The Occasion).
      *   **Naturalists** inspect the tokens and sign the Certificate of Nature ("Fire has power," "Cotton is susceptible").
      *   **Observers** wager points (0-5) that "Burn" will occur.
      *   **Instructor** draws the top card from the Custom envelope and reveals it (The Outcome).
      *   **Scribes** record the Occasion and Outcome.
  3.  **Scoring:**
      *   If the card says "Burn": Wagers are paid 1:1.
      *   If the card says "No Burn": Wagers are lost.
      *   **Naturalists** gain 1 point for every "Burn" (validating their Certificate). They lose 2 points for every "No Burn" (forcing an "Exception" entry in the Ledger).
  4.  **Constraint:** The game ends when the envelope is empty. Do not explain *why* the card determines the outcome. Do not explain *why* the tokens are placed.

  **Phase 2: Acquisition (25 Minutes)**
  1.  **Setup:** Clear the table. Place a pile of 20 scoring tokens in the "Bank" (center of table).
  2.  **The Round:**
      *   An **Observer** is chosen as the "Agent."
      *   The Agent states an intention: "I move a token to my score."
      *   **Crucial Rule:** The Agent *cannot touch the token*. They must say "Let it move."
      *   **Instructor** moves the token *if* a die roll (rolled openly) is 2-6. If the roll is 1, the token stays.
      *   **Scribes** record the *Claim* ("I moved it" vs. "It moved").
  3.  **Scoring:**
      *   If the token moves: The Agent gets the point, *but* must sign a "Claim of Authorship."
      *   **Naturalists** are empowered to challenge the Claim. If they challenge, the Agent must argue *how* they moved it without touching it.
      *   If the Agent cannot explain the mechanism without admitting the Instructor/Die moved it, the point is voided.
      *   If the Agent insists "I acquired the motion," the point stands.

  ## 4. Instructor Script & Constraints
  **Your Role:** You are the **Custodian of the Custom**. You are not the Creator. You are the functionary who reveals what is in the Envelope or moves the token based on the Die.

  **Permitted Lines:**
  *   "Place the Occasion."
  *   "Certify the Nature."
  *   "Reveal the Outcome."
  *   "The Custom holds." (When the expected outcome happens)
  *   "The Custom is interrupted." (When the unexpected outcome happens)
  *   "State your Claim."
  *   "I do not answer questions about mechanism during play."

  **Refused Questions (Do not answer until Debrief):**
  *   "Why did the card say No Burn?"
  *   "Do the tokens actually do anything?"
  *   "Are you deciding the outcome?"
  *   "Is this random?"
  *   "Who moved the token?"

  **Handling the Naturalists:**
  If a Naturalist protests, "But Fire *must* burn Cotton!", reply only: "Certify the Nature, then record the Exception." Force them to do the administrative work of the anomaly. This channels their frustration into the data.

  ## 5. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles. Shuffle the Custom deck (Naturalist). Explain scoring. **No philosophical preamble.** |
  | **10-35** | **Phase 1** | **Conjunction.** Run 10 rounds. Ensure at least 2 "No Burn" cards appear (one early, one late). Naturalists will grow agitated. Observers will adjust bets but keep playing. |
  | **35-60** | **Phase 2** | **Acquisition.** Run 5-6 Agents. Encourage Naturalists to challenge Claims. Create tension between "I did it" and "The Die moved it." |
  | **60-90** | **Debrief** | **The Mapping.** (See below). Stop the game. Reveal the metaphysics. |
  | **90-100** | **Closing** | Q&A. Distribute reading on Ibn Rushd for next week. |

  ## 6. The Debrief: Mapping Play to Doctrine
  *Do not start by defining terms. Start by asking about their feelings during the game.*

  **Step 1: The Denial of Necessary Connection (Phase 1)**
  *   **Ask the Observers:** "Did you stop betting when the 'No Burn' card appeared?" (Likely no. You adjusted expectation, but kept playing.)
  *   **Ask the Naturalists:** "How did it feel to sign the Certificate of Nature when the card said 'No Burn'?"
  *   **The Doctrine:** This is Ghazālī's core argument. The connection between Fire and Cotton is not *logical necessity* (like 2+2=4). It is **Custom** (*ʿāda*). The Envelope represented the Divine Custom. It is stable enough for medicine and astronomy (you kept betting), but it admits interruption (the 'No Burn' card).
  *   **Key Phrase:** "Conjunction without Connection." The tokens were the *occasion* (*sabab*), not the *cause* (*illa*).

  **Step 2: Acquisition and Agency (Phase 2)**
  *   **Ask the Agents:** "When you got the point, did you feel you earned it?"
  *   **Ask the Naturalists:** "Why did you challenge them?" (Because they didn't touch the token.)
  *   **The Doctrine:** This is **Acquisition** (*kasb*). The Agent intended (the will), but the Creation of the motion belonged to the Die (God). The discomfort you felt—claiming an act you didn't physically execute—is the exact tension of Ash'arite theology. You "acquire" the act, making it yours morally, without creating it ontologically.

  **Step 3: The Realist Rejoinder (Ibn Rushd)**
  *   **Turn to the Naturalists:** "You were frustrated. Why?"
  *   **Likely Answer:** "Because it makes the world unintelligible." "If Fire doesn't burn, how do I know anything?"
  *   **The Doctrine:** This is **Ibn Rushd's Critique** in *The Incoherence of the Incoherence*. If you strip things of their natures, you destroy the basis of knowledge. If Fire doesn't *necessarily* burn, science becomes impossible. You defended the intelligibility of the world against the occasionalist structure.

  **Step 4: Addressing the "Trickster" Worry**
  *   **Ask:** "Did you feel I was deceiving you?"
  *   **Clarification:** "The Envelope was shuffled by a student. The Die was rolled openly. I did not hide the mechanism. I hid the *metaphysical assumption* you brought in with you."
  *   **Ghazālī's Defense:** Ghazālī is not a trickster. He is not saying God *deceives* us. He is saying our *reason* deceives us when it claims necessity where there is only habit. The game didn't lie; your expectation of necessity did.

  ## 7. Troubleshooting: What Will Go Wrong
  1.  **The "Randomness" Objection:** Students will say, "This is just randomness, not God's Custom."
      *   *Recovery:* In the debrief, distinguish *chance* from *Will*. A die is random. God's Custom is consistent but voluntary. The game uses a die for mechanics, but the *lesson* is that the regularity is contingent, not random. Ghazālī argues for a *Will* that chooses consistency, not blind chance.
  2.  **Naturalist Revolt:** The Naturalists may refuse to sign the Certificate during a "No Burn" round.
      *   *Recovery:* Do not force them. Let the game pause. Ask the class: "If they refuse to certify, does the game stop?" This mirrors the crisis of intelligibility. Then ask them to sign it as a "Report of Fact" rather than "Law." This distinguishes *observation* from *necessity*.
  3.  **Pattern Hunting:** Observers might try to count cards to predict the "No Burn."
      *   *Recovery:* Allow it. When they fail (because the deck is small and shuffling is imperfect), point out that even if they predict the *Custom*, they still haven't found a *Nature* in the token. They are predicting the Envelope, not the Fire.
  4.  **The "Deceiver God" Trap:** Students feel the Instructor (God) is arbitrary.
      *   *Recovery:* Emphasize the ratio (8:2). God is not capricious. The Custom is reliable. The *possibility* of interruption is the theological point, not the *frequency*.

  ## 8. Limitations: What the Activity Cannot Do
  *Be frank with the students about this.*

  1.  **The Ontological Gap:** The game is epistemic (about what we know). Ghazālī's claim is ontological (about what *is*). The game shows you *can't know* necessity; Ghazālī says necessity *does not exist*. You must supply this distinction by hand in the debrief.
  2.  **The Unity of the Agent:** In the game, the "Die" and the "Instructor" are separate. In Ghazālī's view, God is the only Agent. The game splits the "Will" (Die) and the "Voice" (Instructor), which risks dualism. You must clarify that the Custom is not a separate entity from God.
  3.  **Revelation:** Ghazālī grounds the stability of the Custom in Revelation and Prophecy, not just empirical habit. The game relies on empirical habit (the deck). You must mention that for Ghazālī, we trust the Custom because God promises it, not just because we see it.
  4.  **The "Residue" of Agency:** The game makes *kasb* feel awkward (which is intended). But it cannot make it feel *true*. It simulates the tension, not the resolution. You must explain that for the Ash'arite, this tension is a feature of faith, not a bug to be solved.

  ## 9. Final Note on the "Trickster" Constraint
  To ensure you do not appear as a trickster:
  *   **Transparency:** When shuffling the deck, say: "This deck represents the habits of the world. It is not fixed by logic. It is fixed by Will." This is the only metaphysical hint allowed before the debrief.
  *   **Shared Burden:** When the "No Burn" card appears, do not smile. Treat it as a solemn interruption. "The Custom is interrupted." This signals that the break in causality is a theological mystery, not a game mechanic exploit.
  *   **The Naturalists' Dignity:** Validate the Naturalists' frustration. "Your frustration is the frustration of Ibn Rushd. It is a rational frustration. Do not dismiss it." This prevents the activity from feeling like a "Gotcha!" against realism.
