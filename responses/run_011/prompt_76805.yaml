prompt: |-
  I teach a first-year epistemology section — 24 students, one 75-minute class, ordinary seminar room, paper and pens only, no bikes or props I'd have to buy. I want an in-class game that makes them feel knowing-how and knowing-that come apart, and ideally in both directions: someone who can do the thing reliably and can't state the rule they're following even after a few tries, and someone who's been handed every true proposition about the task and still can't perform. My own half-formed idea is a card-sorting rule I keep to myself, learnable from feedback in ten minutes but not statable in a sentence — but build your own version if you have something better.

  Give me the rules, a points scheme that doesn't need real money, a timeline in five-minute blocks, and a debrief that maps specific moments in the game onto the distinction rather than just summarizing it. They'll want to retreat to "know-how is just knowing-that plus practice," so I need a moment that blocks that move. If there's a natural place to stage the worry that acting on a rule always needs another rule to apply it, work it in, but dont force it. Also tell me what will predictably break the first time I run this and how to recover, and be straight with me about which part of the distinction a game like this can't actually deliver.
