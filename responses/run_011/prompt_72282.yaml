answer: |-
  | defeater | kind | severity_if_true | defender_response | current_status |
  | :--- | :--- | :--- | :--- | :--- |
  | Character traits are statistically robust predictors of behavior when measured as aggregates across many situations rather than single instances. | Empirical | Fatal | Reframe; traits are probabilistic sums, not deterministic switches, so low single-instance correlation is expected. | Contested |
  | Virtue ethics is a normative theory about how to live, not a descriptive theory of psychology, so empirical falsification of traits is irrelevant. | Conceptual | Serious | Dismiss; the critique targets the explanatory power of virtue, which remains useless even if the norm is ideal. | Established |
  | Designing and maintaining ethical institutions requires agents with stable character traits, making the engineering solution self-defeating. | Conceptual | Serious | Dismiss; systems can be designed to be robust against human error without requiring virtuous designers. | Speculative |
  | The situationist studies themselves fail to replicate or show effect sizes too small to support the claim that situations dominate dispositions. | Empirical | Serious | Concede; if the data does not hold, the empirical basis for the critique collapses. | Contested |
  | People possess stable "local" traits tied to specific contexts rather than "global" traits, preserving a modified virtue ethics. | Conceptual | Awkward | Reframe; concede global traits fail but argue local traits are sufficient for a revised virtue ethics. | Established |
  | Individuals actively select or modify situations to align with their dispositions, meaning behavior consistency is higher than passive observation suggests. | Empirical | Awkward | Dismiss; while true for some, it does not explain the high variance found in controlled laboratory settings. | Contested |

  1. Your classmate is right: the aggregation reply is not ad hoc but rooted in standard psychometrics. Psychological traits are defined as probabilistic tendencies, similar to how "flammability" is a property of wood even if a single match fails to ignite it due to dampness. Dismissing a single behavioral instance as insufficient to measure a disposition is how psychology measures almost any latent variable, from intelligence to extraversion. If you demand deterministic consistency from traits, you are attacking a straw man that few modern psychologists defend; the real debate is whether the aggregated correlation is high enough to be explanatory, not whether it exists at all.

  2. The anecdote about the honest student carries zero evidential weight for your general claim because it is an N-of-1 observation. It illustrates the *concept* of cross-situational inconsistency, which is helpful for teaching, but it cannot establish the *prevalence* of inconsistency across a population. To carry weight, an observation must contribute to a correlation coefficient derived from many subjects across many situations; without that statistical backbone, you are cherry-picking a counter-example that a virtue ethicist can simply dismiss as an exception or a failure of trait activation.

  3. Your position is largely independent of the classic Milgram and Zimbardo studies, though removing them makes your view rhetorically weaker but empirically safer. The core of the situationist argument rests on the consistency data (like Hartshorne and May), which shows low correlations across different honesty tasks, rather than the dramatic obedience experiments. If you drop the classic studies, you lose the intuitive punch that convinces people quickly, but you insulate your position from the valid methodological criticisms that plague those specific experiments, leaving the harder-to-refute statistical consistency data as your primary foundation.

  Shift your claim from denying that character traits exist to denying that they are sufficiently stable to be the primary explanation for behavior, which allows you to keep the institutional focus without fighting against basic psychometric definitions.
