  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Editor of the Science and Ideas desk of a British national newspaper.
      *   **Problem:** Distinguishing between "corruption" (label to be used sparingly/strictly) and "ordinary practice" (describe, don't label) in complex cases involving research funding, charity/pharma relations, and international networks.
      *   **House Rule:** Cannot use "corruption" (or synonyms) about an identifiable person/institution unless two things are named:
          1.  The specific duty/entrusted role breached.
          2.  The specific party absent/worse off because of the breach.
      *   **Key Constraints:**
          *   No bibliography/citations/invented studies. Claims must be marked as judgment calls.
          *   British English.
          *   Audience: Reporters (20 mins, no philosophy training), Editor, Lawyer.
          *   Must address specific points (a) through (f).
          *   Must apply the procedure to four specific cases (Professor, Charity, Network, Scientist with share options).
          *   Must be honest about the "symmetry check" (is it real or rhetorical?).
          *   Must handle the "gifts with no stated expectation" issue (Editor has a specific view, I can disagree but must build around my view if I do).
          *   Must handle disclosure (does it cure anything?).
          *   Must identify where the procedure misfires or becomes a values question.

  2.  **Deconstruct the House Rule (The Core Logic):**

      *   *Standard Definition:* Entrusted power used for private gain.
      *   *House Rule Definition:* Breach of specific duty + Identifiable victim (absent party).
      *   *Implication:* This is a stricter, more victim-centric definition. It moves away from "purity of the actor" to "harm to the system/others."

  3.  **Drafting the Procedure (Section by Section):**

      *   *(a) Questions & Order:* Needs to be linear. Start with the Duty. If no duty, stop. Then the Victim. If no victim, stop. Then the Link.
      *   *(b) Halt Points & Values:* Where does fact end and judgment begin? The definition of "Duty" is often legal/contractual (fact), but the *scope* of the duty can be ethical (values). The "Victim" is usually factual, but "worse off" can be speculative. The handover to the Editor needs to happen when the "harm" is systemic rather than individual.
      *   *(c) Symmetry Check:* The user asks for a comparison with UK/US institutions. Is it a real constraint? *Honest assessment:* It's often a rhetorical flourish because reporters can always find a "bad" equivalent or argue cultural context. I need to be honest here. It *can* be a real constraint if enforced rigorously (e.g., "Show me the UK equivalent that *we* would prosecute").
      *   *(d) Gifts/Expectations:* The Editor believes unspecified obligation is the mechanism. I generally agree with this sociological view (Mauss, gift economy), but for a newsroom procedure, "intent" is hard to prove. However, sticking to the House Rule (Duty + Victim), the *gift* itself matters less than the *breach*. I will align with the Editor's view but tie it to the "Duty" question. If the duty is impartiality, the gift breaches it regardless of stated expectation.
      *   *(e) Disclosure:* Does disclosure cure? Editor suspects no. I agree. Disclosure shifts burden to the reader. The procedure should require that disclosure *plus* recusal or structural firewall exists before clearing the label.
      *   *(f) Distinctions & Misfires:* What survives newsroom instructions? "Duty" and "Victim" survive. "Private Gain" is too vague. Misfires: Technically correct verdicts that look like cover-ups (e.g., "No named victim" in systemic rot) or accusations that look like noise (e.g., naming a duty that everyone ignores).

  4.  **Developing the "Symmetry Check" (Crucial Step):**

      *   The prompt asks for honesty. Is it a real constraint?
      *   *Thought:* A determined reporter can always say "Well, X happens at Oxford too."
      *   *Correction:* To make it real, it must be: "Name the British equivalent that we would *not* call corrupt." If they can't name one, the cultural defence fails. If they can, we must explain the difference.
      *   *Verdict:* It is a real constraint *only if* the Editor/ Lawyer challenges the equivalence. Otherwise, it's flourish. I will write it as a constraint that requires Editor sign-off to prevent lazy equivalencies.

  5.  **Applying the Procedure to the Cases:**

      *   *Case 1: The Professor (Recycling PhD students).*
          *   Duty: Distribute public money impartially/meritocratically.
          *   Victim: Other applicants (unidentified but exist).
          *   Verdict: Borderline. Is "keeping a school intact" a valid duty? Probably not over merit.
          *   *Twist:* The House Rule requires a *specific* party. "Other applicants" is a class, not a specific party. This might block the label "corruption" under the strict rule, forcing "describe, do not name."
      *   *Case 2: The Charity (Pharma hospitality).*
          *   Duty: Advocate for patients (implied impartiality).
          *   Victim: Patients (if drug is inferior/overpriced).
          *   *Defense:* "Nothing asked in return."
          *   *Verdict:* If no specific patient was harmed by a specific bad drug recommendation, the "Victim" test fails. Label blocked.
      *   *Case 3: The Network (South Asia, loyalty-based).*
          *   Duty: Allocate grants on merit (usually the mandate of research networks).
          *   Victim: The junior members who complained (Specific!).
          *   *Verdict:* This fits the rule best. Specific duty (merit), Specific victim (passed-over juniors). Label "corruption" *might* stick, but the Symmetry Check is key. Would a UK network do this? Yes, "old boy network." If we don't call it corruption here, we can't there.
      *   *Case 4: The Scientist (Share options, advisory board).*
          *   Duty: Scientific advice (presumably).
          *   Victim: ?
          *   Disclosure: Full and cheerful.
          *   *Verdict:* The procedure *must* protect him. Why? Because the "Victim" is hard to name, and Disclosure + Recusal (if applicable) mitigates. The specific step is likely the "Disclosure + Structural Firewall" or the lack of a specific "worse off" party.

  6.  **Refining the Tone:**

      *   British English (colour, centre, programme, etc.).
      *   Direct, pragmatic, newsroom-focused.
      *   No academic fluff.
      *   Acknowledge the tension between the Editor's desire for rigour and the reporters' desire for a scoop.

  7.  **Addressing Specific Constraints in the Draft:**

      *   *Constraint:* "Mark judgment calls." I need to explicitly state where human judgment overrides the checklist.
      *   *Constraint:* "Honesty on Symmetry Check." I will state clearly that without Editor challenge, it is a flourish.
      *   *Constraint:* "Gifts." I will align with the Editor but ground it in the "Duty of Impartiality."
      *   *Constraint:* "Disclosure." I will assert disclosure is not a cure, merely a mitigation.

  8.  **Final Review against the Prompt:**

      *   (a) Questions/Order/Sufficient Answer? Yes.
      *   (b) Halt points/Values conflict? Yes.
      *   (c) Symmetry check honesty? Yes.
      *   (d) Gifts/Expectations? Yes.
      *   (e) Disclosure cure? Yes.
      *   (f) Distinctions/Misfires? Yes.
      *   Case Studies applied? Yes.
      *   British English? Yes.
      *   No citations? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the Professor case is corruption.
      *   *Correction based on House Rule:* The rule says "specific party who was not at the table." "Other applicants" is a class. Unless a specific rival grant application can be identified as rejected *because* of this, the strict rule blocks the word. I must adhere to the Editor's rule, even if it feels uncomfortable. This highlights the "misfire" risk in section (f).
      *   *Scientist Case:* Why is he protected? Because of the "Victim" test. Who is worse off? If his advice is sound, no one. If his advice is bad, who specifically suffered? Also, the disclosure shifts the "Duty" interpretation.
      *   *Network Case:* This is the hardest. If we call it corruption, we look imperialist. If we don't, we look hypocritical. The Symmetry Check is the decider here. I need to be firm: if the UK equivalent is "nepotism" and we don't call that corruption, we can't call it corruption there.

  10. **Final Polish:** Ensure the voice is authoritative but subordinate to the Editor (who makes the final call). Ensure the "20 minutes" constraint is respected (procedure must be quick).

  *(Self-Correction on the "Gift" section)*: The Editor says "inability to say what was expected... is the mechanism." I agree. I will frame this as: The duty is *independence*. The gift compromises independence regardless of explicit quid pro quo. The lack of explicit expectation makes the duty breach harder to prove but more insidious. The procedure must treat "implicit obligation" as sufficient to trigger the Duty question.

  *(Self-Correction on "Disclosure")*: Editor suspects disclosure emboldens. I agree. Procedure: Disclosure is necessary but not sufficient. Recusal is the cure. If no recusal, disclosure is just a warning label, not a fix.

  Let's write.
answer: |-
  **MEMORANDUM**
  **TO:** Science and Ideas Desk Reporters
  **FROM:** Desk Editor
  **SUBJECT:** Procedure for Use of "Corruption" and Associated Terms
  **TIME ALLOWANCE:** 20 Minutes

  This procedure implements the house rule regarding the use of "corruption", "corrupt", "cronyism", "gravy train", or synonyms regarding identifiable persons or institutions. It is a filter, not a investigation guide. If you cannot pass the filter, you must describe the arrangement plainly without the label.

  ### (a) The Questions (In Order)

  You must answer these sequentially. If you answer "No" or "Unknown" to Questions 1 or 2, stop immediately. Do not proceed to Question 3.

  **Q1: The Duty**
  *Question:* What specific written rule, contract clause, statutory duty, or publicly stated mandate did the subject ignore or override?
  *   **Sufficient Answer:** A specific document or explicit verbal commitment (e.g., "The grant terms state funds must be awarded by blind peer review," or "The charity's constitution requires independence from commercial donors").
  *   **Insufficient Answer:** General ethical norms, "public expectation," or "academic integrity" without a codified source.
  *   **Constraint:** This must be settled before any other question is worth asking. If there is no defined duty, there can be no breach, only bad behaviour.

  **Q2: The Victim**
  *Question:* Who is the specific party that was not at the table, excluded from the decision, and is demonstrably worse off because the duty was breached?
  *   **Sufficient Answer:** A named individual, a named competitor, or a defined beneficiary group that can be shown to have lost a specific entitlement (e.g., "Dr X's grant application was rejected while the Professor's student was funded," or "Patients were prescribed Drug Y which is less effective than the generic alternative").
  *   **Insufficient Answer:** "The public," "Taxpayers," "The reputation of science," or "Junior members generally."
  *   **Constraint:** This must be settled before considering intent or local norms. If no one is specifically worse off, the house rule forbids the label.

  **Q3: The Link**
  *Question:* Can you show that the breach of duty (Q1) caused the harm to the victim (Q2), rather than mere coincidence or legitimate discretion?
  *   **Sufficient Answer:** Evidence that the decision-maker had the power to alter the outcome and used it to favour the private interest over the duty.
  *   **Insufficient Answer:** Temporal proximity (the dinner happened before the decision) without evidence of influence.

  ### (b) Halt Points and Handover

  **The "Describe, Do Not Name" Halt**
  The procedure halts and returns a verdict of "Describe, Do Not Name" if:
  1.  **Q1 fails:** You cannot find a specific duty. (Verdict: This is culture, not corruption.)
  2.  **Q2 fails:** You cannot name a specific victim. (Verdict: This is self-enrichment, but without a specific loser, it does not meet our definition.)

  **The Editor Handover (Values vs Fact)**
  The procedure ceases to be mechanical and hands the decision to me (the Editor) at the following point:
  *   **Conflict of Duties:** If the subject claims two duties conflicted (e.g., "Duty to patients" vs "Duty to accept funding to keep the clinic open"). This is a values question. I must weigh whether the survival of the institution justifies the breach of impartiality.
  *   **Systemic Harm:** If the victim is a class of people (e.g., "all future grant applicants") rather than a specific person. Our rule demands a specific party, but systemic rot is often the real story. I must decide if we stretch the definition of "victim" to allow the label.
  *   **The Symmetry Check:** (See section c). If the reporter argues the practice is culturally specific, I must judge the validity of the comparison.

  ### (c) The Symmetry Check (Local Norms Defence)

  Before applying the label to a practice outside the UK/US, you must answer this:

  *Question:* What is the closest equivalent practice at a British or American institution that we would *not* call corrupt in our own columns?
  *   **Requirement:** You must name the institution and the practice.
  *   **The Constraint:** You must then state what makes the difference matter. Is it the scale? The poverty of the region? The legal framework?
  *   **Honest Assessment:** This check is a **real constraint only if I challenge it**. A determined reporter can always find a sloppy equivalent at Oxford or Harvard to justify a headline. If you simply assert "This happens in London too," I will reject it unless you can show we would tolerate it here *on record*. If we would not tolerate it here, you may proceed. If we would tolerate it here, you cannot call it corruption there. This is not a rhetorical flourish; it is a test of our own consistency. If you cannot name the British equivalent, the cultural defence fails. If you can, and the difference is trivial, the corruption label is withdrawn.

  ### (d) Gifts and Unstated Expectations

  *Working Assumption:* A recipient's inability to say what was expected of them is not evidence of innocence. It is the mechanism of the obligation. An unspecified debt is harder to refuse than a priced one.

  *Procedure:*
  1.  If a gift/hospitality is accepted, presume an obligation exists.
  2.  Do not accept "Nothing was asked in return" as a defence.
  3.  **The Test:** Did the gift place the recipient in a position where their *Duty (Q1)* conflicted with their *Gratitude*?
  4.  If the recipient cannot articulate what they would have done had the gift not been offered, the presumption of conflict stands.
  5.  **Judgment Call:** This relies on the judgment that human psychology creates obligation without explicit contract. This is not provable fact, but it is the basis on which we assess "influence."

  ### (e) Disclosure

  *Working Assumption:* Disclosure does not cure corruption. It transfers the burden of discounting to the reader, who lacks the expertise to do so. It often emboldens the recipient ("I told them, so I'm clean").

  *Procedure:*
  1.  Disclosure is **necessary but not sufficient**.
  2.  For the word "corruption" to be withheld on the grounds of disclosure, there must be **Recusal**.
  3.  **Requirement:** The subject must have declared the interest *and* removed themselves from the specific decision-making process where the conflict existed.
  4.  If they declared but remained at the table, the label remains available if Q1 and Q2 are met. Disclosure without recusal is a warning label, not a cure.

  ### (f) Distinctions, Instructions, and Misfires

  **What survives as Newsroom Instruction:**
  1.  **Duty + Victim:** This is the hard rule. It survives legal scrutiny.
  2.  **Recusal over Disclosure:** This is actionable. We can verify if someone left the room.
  3.  **Specific over Systemic:** We name specific losers, not "the system."

  **What to Drop:**
  1.  **"Private Gain":** Drop this. It leads to arguments about whether "keeping a lab open" counts as gain. Focus on the *breach* and the *loser*.
  2.  **"Intent":** Drop this. It is unknowable. Focus on the *act* and the *outcome*.

  **Where the Procedure Misfires:**
  1.  **The "Technical Acquittal":** You will find cases where Q1 and Q2 are met, but the behaviour is so widespread (e.g., academic citation rings) that calling it "corruption" looks like a witch hunt. The verdict is technically correct but politically naive.
  2.  **The "Specific Victim" Trap:** In cases of systemic rot (e.g., a whole funding body is rigged), there may be no *single* specific victim who can be named, only a class. The procedure will force you to say "describe, do not name." This will read as a cover-up to readers who see the rot.
  3.  **The "Accusation that isn't":** You may name a duty and a victim, but if the sum involved is trivial, the word "corruption" will read as hyperbole, damaging the paper's credibility on larger cases.

  ***

  ### APPLICATION OF PROCEDURE TO CASES

  **Case 1: The Professor (Recycling PhD Students)**
  *   **Q1 (Duty):** Duty to distribute public money based on merit (implied by grant terms). *Status: Met.*
  *   **Q2 (Victim):** Who specifically lost out? The reporters cite "other applicants." *Status: Failed.* Unless we can name a specific rival grant application that was rejected *because* this student was funded, we cannot name a specific party worse off. "The field" is not a party.
  *   **Verdict:** **Describe, Do Not Name.**
  *   **Reasoning:** The House Rule requires a specific party. While the Professor admits to favouritism, without a named loser, we cannot print "corruption." We describe it as "closed-loop funding."
  *   **Misfire Risk:** High. Readers will see this as corruption. The rule protects the Professor from the label, not the behaviour.

  **Case 2: The Charity (Pharma Hospitality)**
  *   **Q1 (Duty):** Duty to advocate for patients impartially (Charity constitution). *Status: Met.*
  *   **Q2 (Victim):** Patients. *Status: Failed.* Can we name a specific patient who was harmed? Did the charity campaign for a drug that was ineffective or overpriced *because* of the hospitality? The Director says "nothing asked in return." Without evidence that the advocacy shifted to a worse drug, no specific patient is demonstrably worse off.
  *   **Symmetry Check:** Do UK charity delegates accept flights from donors? Yes. Do we call it corruption? No, we call it "conflict of interest."
  *   **Verdict:** **Describe, Do Not Name.**
  *   **Reasoning:** No specific victim of the *decision* can be named. The "gift" creates a conflict, but without a bad outcome linked to it, Q2 fails.
  *   **Note on Gifts:** Per section (d), the lack of stated expectation does not clear them, but the lack of victim does.

  **Case 3: The Network (South Asia, Loyalty-based)**
  *   **Q1 (Duty):** Duty to allocate equipment/grants on merit (Network mandate). *Status: Met.*
  *   **Q2 (Victim):** Junior members who complained. *Status: Met.* They are named, they were passed over, they are worse off.
  *   **Q3 (Link):** Allocation was through personal loyalty to founder. *Status: Met.*
  *   **Symmetry Check:** Is there a UK/US research network that allocates public grants based on loyalty to the founder? Yes, "old boy networks" exist. Do we call them corrupt? Usually, we call them "nepotistic" or "cliquey."
  *   **Decision Point:** If we would not run the headline "Corruption at MRC Panel" for a UK equivalent, we cannot run "Corruption at South Asia Network."
  *   **Verdict:** **Borderline / Editor Decision.**
  *   **Reasoning:** This passes Q1 and Q2. However, the Symmetry Check is the killer. If the UK equivalent is tolerated as "networking," calling this "corruption" is imperialist. If the UK equivalent would be prosecuted, we proceed.
  *   **Hard Truth:** If we name it, we hand a weapon to the network's enemies. If we do not, we tell the junior members their grievance is less valid because of their geography. The procedure forces me to decide if "loyalty" is a cultural norm or a breach of contract. If the grant terms say "merit," it is a breach. I will likely allow "Cronyism" but block "Corruption" unless the financial loss to the juniors is quantifiable.

  **Case 4: The Scientist (Share Options, Advisory Board)**
  *   **Q1 (Duty):** Duty to provide impartial scientific advice. *Status: Met.*
  *   **Q2 (Victim):** ? *Status: Failed.* Who is worse off? The public? Too vague. A competitor? None named.
  *   **Disclosure/Recusal:** He declared it cheerfully. Did he recuse himself from decisions affecting the share value? If yes, the breach is mitigated.
  *   **Verdict:** **Protected (No Label).**
  *   **The Step That Saves Him:** **Q2 (The Victim).**
  *   **Reasoning:** Even if the arrangement looks unsavoury, under our House Rule, we cannot name "corruption" without a specific party worse off. His disclosure shifts the burden to the reader (which I dislike, per section e), but the lack of a specific victim blocks the label legally and procedurally.
  *   **Constraint:** If it emerges he advised on a specific drug approval that boosted his shares *and* harmed patients (e.g., unsafe drug), Q2 is met. Until then, he is clear.

  ***

  **FINAL NOTE TO REPORTERS**
  This procedure will frustrate you. It will let behaviour you know is wrong escape the strongest label. That is the point. The word "corruption" is a nuclear option. If we use it where we cannot name the duty and the victim, we are not doing moral philosophy; we are libelling. If the procedure blocks the word, write the story so clearly that the reader supplies the word themselves. That is your job. My job is to ensure we can defend the ones we print.
