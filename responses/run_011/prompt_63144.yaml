answer: |-
  ### Pre-Computation: The Crux of the Case

  *   **Sorites without Density:** The classic Sorites paradox relies on the *Tolerance Principle* (a微小 change doesn't change status), which requires a dense series of cases. The "Gap Case" removes the intermediate steps. The crux here is testing whether students recognize that vagueness isn't just about where we draw the line, but about whether the *logic of the predicate* permits small-step sliding. If there are no small steps, the Sorites cannot get going, suggesting the paradox relies on series density, not just predicate semantics.
  *   **Epistemic vs. Semantic Blur:** Introducing measurement error (±3cm) creates uncertainty about where individuals sit relative to the gap. The crux is distinguishing *epistemic ignorance* (there is a fact, we can't measure it) from *semantic indeterminacy* (there is no fact). Does measurement error merely hide a sharp boundary (helping Epistemicism) or does it recreate borderline cases where truth values lack (helping Supervaluationism)?
  *   **Admissibility Constraints:** For Supervaluationism, a precisification is admissible only if it respects usage. If no one exists between 168cm and 173cm, is a cutoff at 170cm admissible? The crux is whether "admissibility" is constrained by the actual population distribution or by the conceptual space of height. This tests whether the theory treats vagueness as worldly or linguistic.

  ***

  ### 1. Exam Question

  **Module:** PHI304 Philosophy of Language
  **Section:** B (Essay)
  **Time Allowed:** 45 Minutes
  **Marks:** 20

  **Question 1**

  Consider a closed population of 1,000 people. 500 are between 150cm and 168cm; the other 500 are between 173cm and 190cm. There is a 5cm gap where no one exists.

  **(a)** Can a Sorites series be constructed for "tall" within this population? Explain what your answer implies about the source of the Sorites paradox's persuasive force: does it arise from the semantic nature of the predicate alone, or does it require specific structural features of the series (e.g., density)? (8 marks)

  **(b)** Now suppose our only height data comes from a device accurate only to ±3cm. A reading of 171cm implies a true height between 168cm and 174cm. Does this measurement error re-introduce vagueness into the gap case? If so, is this phenomenon distinct from ordinary semantic vagueness (indeterminacy) or identical to it (ignorance)?

  Based on this, evaluate which major theory of vagueness (Epistemicism, Supervaluationism, or Contextualism) is best supported by this case and which is most embarrassed by it. Specifically, address how your chosen theory constrains "admissible precisifications" or "sharp boundaries" within the empty gap. (12 marks)

  ***

  ### 2. Model Answer

  The gap case demonstrates that the Sorites paradox cannot get going without a dense series. A Sorites argument requires the Tolerance Principle: that a microscopic change in height cannot change the truth value of "tall." In this population, the smallest difference between a non-tall person (168cm) and a tall person (173cm) is 5cm. This is not a microscopic change; it is a noticeable jump. Therefore, one cannot construct the iterative chain required for the paradox. This implies that the persuasive force of the Sorites does not stem solely from the semantic nature of the predicate "tall." Instead, it relies on the structural density of the series. Vagueness requires the *possibility* of borderline cases generated by small steps; without intermediate instances, the predicate behaves as if it were sharp, even if it remains vague in other contexts.

  Introducing measurement error (±3cm) complicates this. A reading of 171cm creates overlap: the person could be 168cm (not tall) or 174cm (tall). This re-introduces uncertainty, but it is crucial to distinguish the *type* of uncertainty. Ordinary semantic vagueness suggests there is no fact of the matter about whether a 171cm person is tall. Measurement error suggests there *is* a fact of the matter, but we are ignorant of it. Therefore, this is epistemic uncertainty regarding worldly facts, not necessarily semantic indeterminacy. However, because the error margin spans the gap, it functionally recreates borderline cases for the observer.

  This case creates a significant divide between theories. Epistemicism is best supported by the initial gap case. Epistemicism claims there is a sharp cutoff, merely unknown. The fact that the population has a natural gap where a sharp cutoff could sit (e.g., at 170cm) without contradicting usage aligns well with the epistemicist view that vagueness is ignorance. The measurement error further aids Epistemicism: it provides a concrete explanation for why we cannot know the boundary (instrument limitation), demystifying the "ignorance" posited by the theory.

  Conversely, Supervaluationism is embarrassed by the gap case unless it can explain admissibility constraints. Supervaluationism holds that "tall" is true if it is true on all admissible precisifications. In a normal series, precisifications must carve through the borderline zone. But here, there is no borderline zone in the population. Is it admissible to set the cutoff at 170cm, where no one exists? If yes, why is that precisification admissible if it doesn't track any actual distinction in the world? If no, then there is only one admissible precisification (between 168 and 173), which collapses Supervaluationism into a form of sharpness. The theory struggles to explain what constrains precisifications when the world offers no resistance.

  Contextualism fares intermediately. It might argue that the gap forces a context shift: in comparing the two groups, the standard for "tall" shifts to accommodate the gap. However, this feels ad hoc. The measurement error suggests that context isn't shifting; our access is just blurred.

  Ultimately, the case suggests that much of what we call vagueness relies on continuous distributions. When the world is gappy, semantic vagueness recedes, and epistemic limits (like measurement error) dominate. This favors Epistemicism, as it treats the boundary as real but inaccessible, whereas Supervaluationism struggles to justify multiple precisifications in an empty semantic space.

  ***

  ### 3. Marking Scheme

  | Criterion | Marks | What a first-class answer does here | The specific mistake that costs these marks |
  | :--- | :---: | :--- | :--- |
  | **Analysis of Sorites Conditions** | 8 | Identifies that Sorites requires tolerance/density; argues that the 5cm gap breaks the iterative chain; concludes force comes from series structure, not just predicate semantics. | Asserts Sorites still applies despite the gap; or claims vagueness is purely predicate-based without referencing the need for small steps. |
  | **Distinction: Error vs. Indeterminacy** | 5 | Clearly distinguishes epistemic ignorance (measurement limit) from semantic indeterminacy (lack of truth value); notes that error functionally mimics vagueness but is ontologically distinct. | Conflates measurement error with semantic vagueness; or fails to address whether the phenomenon is "the same" as ordinary vagueness. |
  | **Theoretical Evaluation (Support/Embarrassment)** | 4 | Selects a theory (typically Epistemicism) and justifies why the gap aids it (sharp boundary fits the gap); explains why another (typically Supervaluationism) struggles (admissibility in empty space). | Lists theories without applying them to the case; or claims a theory works without explaining the specific mechanism (e.g., precisification constraints). |
  | **Argumentative Coherence & Precision** | 3 | Maintains a clear line of argument throughout; uses technical terms (tolerance, precisification, admissibility) correctly; stays within word/time limits. | Contradicts earlier claims; misuses technical terminology; or writes disorganized paragraphs that obscure the philosophical point. |
