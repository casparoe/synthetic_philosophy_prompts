          *   Group 3 (1974 Purchase): The provenance grey area.
      *   **Analysis of Claimants:** Who do we talk to? (NCMM vs. Oba vs. Diaspora).
      *   **Engagement with the Former Director's Position:** This needs specific attention. Steel-man the argument, then identify the rejectable premise (that legal title supersedes ethical obligation/that capacity is a permanent bar).
      *   **Scholarly Consensus vs. Dispute:** Be careful not to say "everyone agrees."
      *   **Recommendations & Timetable:** Concrete steps.
      *   **Counter-Arguments:** Explicitly state where a dissenting trustee could push back.

  4.  **Refining the Content (Self-Correction/Nuance Check):**

      *   *Northern European Context:* Laws vary (UK vs. Germany vs. Scandinavia). The prompt mentions a "national ministry of culture" and "enabling statute." This sounds more like a civil law system (e.g., Sweden, Netherlands, Germany) than the UK (where national museums often have specific acts preventing deaccessioning). I need to keep the legal advice general but respectful of the "Ministry Consent" constraint.
      *   *The Bequest:* 4 years left. Can we prepare the transfer now to execute later? Yes.
      *   *The Oba vs. NCMM:* This is a political tension within Nigeria. The museum shouldn't pick sides but should follow international protocols (usually state-to-state). However, the Oba's letter claims title is vested there. I need to recommend verifying this legal claim without validating it prematurely.
      *   *Diaspora:* Their request for a local touring exhibition is a good "bridging" activity.
