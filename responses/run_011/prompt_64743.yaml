          *   Provenance Group C: 9 plaques (1974 London auction, 2 possibly traced to 1952 Lagos sale, chain thin).
          *   Claimants: 1. National Commission for Museums and Monuments (NCMM) Nigeria. 2. Office of the Oba of Benin (claims title vested by Fed Gov). 3. Local Benin Diaspora Association (wants hold on transfer, suggests loan for touring exhibition).
          *   Complications: 1. Former Director's memo (legal ownership, precedent risk, capacity concerns). 2. Enabling Statute (needs Ministry consent, 2-3 years, never granted for this size). 3. Precedents (other museums transferred, some kept on loan, different legal systems).
      *   **Requirements:**
          *   Clear recommendation for each sub-group and claimant.
          *   Proposed timetable (Ministry consent + Bequest expiry).
          *   Reasoning that allows for counter-argument (steel-manning the opposition).
          *   Engage the Former Director's position on merits, identify rejectable premises.
          *   Distinguish settled scholarly consensus vs. contested positions (provenance/restitution).
          *   Flag inferences/assumptions vs. established facts.

  2.  **Determine the Stance/Recommendation:**

      *   *Goal:* A balanced, legally prudent, yet ethically robust position that acknowledges the complexity. A "return everything now" stance ignores the legal hurdles (Ministry, Bequest). A "keep everything" stance ignores the ethical shift in the field and the specific provenance of the 1897 items.
      *   *Strategy:* Differentiate the three groups.
          *   Group A (1897): Strongest ethical case for return. Legal hurdle is the Ministry.
          *   Group B (Bequest): Legal hurdle is the 4-year restriction. Ethical case is strong but legally blocked.
          *   Group C (1974): Weakest ethical case (post-independence market), but provenance is "thin." Needs more research.
      *   *Claimants:* Recognize NCMM as the legal state counterpart, but acknowledge the Oba's cultural authority. The Diaspora request (local loan) is a good interim measure.
      *   *Former Director:* Acknowledge legal title and capacity concerns, but challenge the moral weight of "legal title" in this context and the "slippery slope" argument.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Brief overview of the recommendation.
      *   **Factual Basis & Assumptions:** Crucial for transparency (as requested).
      *   **Analysis of the Three Sub-Groups:**
