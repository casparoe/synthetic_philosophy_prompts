  5.  **Drafting the Text (incorporating specific constraints):**

      *   *Tone:* Formal, objective, fiduciary, yet morally aware.
      *   *Assumptions:* Flag the "thin chain" on the 1974 items. Flag the assumption that Ministry consent is *possible* even if never granted.
      *   *Timetable:* Align the 4-year bequest expiry with the 2-3 year Ministry process.
      *   *Counter-arguments:* Ensure they are substantive, not strawmen.

  6.  **Final Review against Prompt Requirements:**

      *   Clear recommendation on 3 sub-groups? Yes.
      *   Clear recommendation on 3 claimants? Yes.
      *   Timetable keyed to Ministry + Bequest? Yes.
      *   Reasoning for dissenters? Yes.
      *   Former Director engaged on merits + rejectable premise? Yes.
      *   Scholarly consensus vs. dispute distinguished? Yes.
      *   Inferences/Assumptions flagged? Yes.

  7.  **Final Polish:** Check dates (Meeting 16th next month). Ensure the distinction between "title" and "possession" is clear. (Self-correction: Ensure I don't give legal advice, but rather trustee opinion based on facts provided).

  *(Self-Correction during drafting)*: I need to be careful about the "Northern European" aspect. If this were the UK, the Charity Commission and specific museum acts apply. If Germany, the "Leitfaden." Since it's unspecified, I will rely on the "Enabling Statute" provided in the facts. I must not assume the Ministry *will* say yes, only that we must ask.

  *(Refining the Scholarly Consensus)*: The prompt asks to separate settled from disputed.
  *Settled:* 1897 Expedition was a military confiscation/looting event. Objects entered market via this event are ethically tainted.
  *Disputed:* Whether *all* objects leaving Nigeria subsequently are tainted. Whether the Oba or NCMM holds ultimate authority. Whether capacity concerns justify retention.

  *(Refining the Former Director's Argument)*:
  *Merits:* Legal title exists. Capacity is a real risk.
  *Rejectable Premise:* That legal title is the *only* metric for retention. That "precedent" implies a moral obligation to keep Egyptian/Chinese items (false equivalence).

