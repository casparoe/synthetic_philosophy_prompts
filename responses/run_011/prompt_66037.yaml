      "Thank you for being here. Five years is a long time to spend in any one room, and looking out at this crowd, I see the faces that made that time matter. Eleven of you reported to me directly. Many more of you worked alongside us, building the policies, the infrastructure, and the support that kept the lights on while we tried to teach machines to think. My partner is here too, which is a mercy, because they have heard more about this work over dinner than anyone should ever have to endure."

      "For most of my tenure, I led the team responsible for the human judgment data. We produced the rankings of candidate answers, the written rationales, the reviewer guidelines. We built the whole apparatus for turning approval into a number. I became very good at this. I became so good at asking people what they wanted that I lost the ability to decide what I wanted for lunch. That is the one joke I get to make, so I am making it now."

      "I am leaving because my understanding of the work changed. We said we were trying to get these systems to share our values, to converge on what people approve of. We built an enormous machine for measuring that approval. But when I looked closely at where the systems actually failed, almost none of the failures were failures of approval-prediction. They were failures to work out what the particular person in front of them was trying to get done."

      "Those are different problems. The second is far narrower than the first. It concerns correctly interpreting and then pursuing one person's present aim in one situation. It can in principle be checked case by case by asking that person. The first concerns a standing valuation that has to be right in advance and in general, about which nobody can say whose values are the ones being aimed at. A system can be superb at predicting what a rater will like and still be hopeless at the second thing, because the rater is not the person who will later be trying to get something done."

      "And a system can be very good at the second thing without holding anything that deserves the name of a value. Think of a good interpreter, or a good chief of staff. They do not need to share your worldview to execute your instructions flawlessly. They need only to understand the task at hand. If we focus on building systems that act like that interpreter, the grand question of what they value dissolves. It becomes idle. The work becomes about fidelity to the person in the room, not fidelity to a abstract ideal we wrote down five years ago."

      "This is the gift I leave you. Not a critique, but a direction. The difficulty we faced was not that we measured poorly, but that we measured the distance to the horizon when we needed to measure the step in front of us. Solve the immediate intent, and the rest follows. I believe this completely. I hope you will find it useful."

      "And now, the hard part. Saying goodbye is strange when you are not going far, but this is a departure all the same. I want to thank you for the trust you placed in me and my team. We pushed on hard problems together. I will be watching your work from the outside with pride and interest. Please keep in touch. Thank you for everything."

