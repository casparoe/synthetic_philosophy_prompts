prompt: |-
  I am a senior backend engineer on the live-operations team at a mid-sized mobile game studio. I have a computer science degree and no formal training in philosophy, decision theory, or probability beyond a single undergraduate course; my working life is service code and Monte Carlo harnesses. Our studio requires every randomized reward mechanic to pass a math review gate before it ships, and because our one quantitative analyst is shared across three titles, that gate has devolved to me. I receive two or three such submissions per quarter, I have roughly forty-five minutes each, and my review notes are read by designers and engineers who are less comfortable with this material than I am. The analyst will only sign off on a note that shows its reasoning, so I need something reusable rather than a one-off answer to a single document.

  The class of submission that keeps defeating me is any mechanic offering the player a swap between two linked random amounts. The canonical case, proposed last week, is this: the player is dealt one of two chests, the other of which always contains exactly double or exactly half of the first; the player opens theirs, sees the amount, and may then swap for the unopened chest. The design document justifies the feature by noting that whatever the player holds, the other chest is worth either half or double of it, so the expected value of swapping is 1.25 times the amount held, and the swap should therefore always be offered. I understand this shape of argument is a well-known puzzle and that its naive form is wrong, but I cannot say precisely where it goes wrong. I have also encountered the claim that there are legitimate constructions in which the swap really is better for every amount the player might observe. Both claims seem true to me and I have not managed to hold them together. A procedure that simply said "reject any document containing that sentence" would be worse than useless: it would fail some sound submissions, pass some unsound ones, and leave me unable to explain the difference to a designer.

  Please write the review procedure I can run on submissions of this kind. Specifically:

  1. A short, plain-language statement of the distinction the whole procedure turns on: what the naive argument implicitly assumes about how the two amounts are generated, and why the fact that the player has observed an amount changes the calculation. Assume I can follow algebra but not measure-theoretic vocabulary.

  2. The procedure itself — numbered questions to put to a document, in the order I should ask them, each with what counts as a sufficient answer, what a non-answer typically looks like in a design document, and what the finding is if the question fails. At minimum it should cover whether the document specifies the joint distribution over the two amounts and how they are paired; whether the argument conditions on the observed amount or averages unconditionally, and whether it confuses the two; whether the distribution has a finite mean and a hard cap; and what the player is taken to know at the moment of deciding.

  3. A separate, short audit list for the simulation, since a harness run is the thing designers trust most and the thing I am least equipped to challenge. This must be concrete enough to act on: what to inspect in how amounts are drawn and paired, what distinguishes a genuine effect from a harness artifact, and what trial count and comparison method I should require before I treat a reported expected-value difference as evidence.

  4. Explicit marking of which steps are mechanical checks and which are judgment calls, plus the points where the procedure stops and hands the submission to the analyst, together with the one or two numbers or sentences I should put in front of them so that the thirty seconds they can give us are not wasted.

  5. An honest account of what the procedure cannot do: which submissions it will wrongly fail, which it will wrongly pass, and where its verdict depends on facts about our in-game economy that no general procedure can capture.

  6. Worked runs on three submissions, each with a verdict — approve, reject, or approve with conditions — and the two or three sentences I would actually place in the review note:

     (a) The chest-swap document described above, which specifies no distribution whatsoever beyond the statement that the second chest holds half or double the first.

     (b) A document proposing the same swap in which the smaller amount is 2 raised to the power K, with K drawn so that its probability is proportional to (3/4)^K for K = 1, 2, 3, and so on. I suspect this one may come out in the designer's favor, which would be an uncomfortable result for me: I believe the payout has no finite mean, and our economy team will not fund a mechanic whose expected cost is unbounded. I want the procedure to handle that tension rather than resolve it by declaring the document fallacious.

     (c) A document whose verbal argument is the naive one, but whose author attached a harness run in which the smaller amount is again 2^K, this time with K drawn uniformly from 1 to 20, reporting that swapping raises mean payout by about four percent over ten thousand trials. The author treats the simulation as proof. I want the procedure to tell me whether it is; if it is not, what the most likely defect in the harness is and how I would demonstrate that defect to someone who does not want to believe it; and if the harness is in fact correct, how I would establish whether a four percent difference is meaningful at that trial count given how widely the payouts range.

  7. Finally, one thing I can say to a designer who insists the 1.25-times argument is obviously correct and that I am obstructing the feature out of ignorance.

  I do not want references, a reading list, or citations: I cannot look anything up mid-review, and a name I cannot check does not help me. I want the reasoning itself, in a form I can reuse next quarter. Please also resist the temptation to hedge every step into a recommendation that I consult an expert; mark the genuine handoff points and leave the rest as checks I am able to run myself.
reasoning: |-
  Here's a thinking process that leads to the suggested review procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Senior Backend Engineer, Live-Ops Team, Mid-sized Mobile Game Studio.
      *   **Background:** CS degree, comfortable with service code and Monte Carlo harnesses. No formal philosophy/advanced probability beyond one undergrad course.
      *   **Constraint:** 45 minutes per review, 2-3 submissions per quarter. Notes read by designers/engineers (less math-comfortable). Analyst only signs off if reasoning is shown.
      *   **Problem:** "Two Envelope Problem" variants (swap mechanics). Naive argument says EV of swap is 1.25x held amount. User knows this is usually wrong but can't pinpoint why or distinguish valid from invalid cases.
      *   **Goal:** A reusable review procedure (checklist + logic) to handle these submissions without needing the analyst for every single one, but knowing exactly when to escalate.
      *   **Requirements:**
          1.  Plain-language distinction (naive vs. correct).
          2.  Numbered procedure (questions, sufficient answers, failure modes).
          3.  Simulation audit list.
          4.  Mechanical vs. Judgment calls + Analyst handoff points.
          5.  Limitations of the procedure.
          6.  Worked examples (3 specific cases).
          7.  One-liner for resistant designers.
      *   **Constraints:** No references/citations. No excessive hedging. Actionable.

  2.  **Deconstruct the Math (The Two Envelope Problem):**
      *   *The Naive Argument:* Let $A$ be the amount in my hand. The other envelope $B$ is either $A/2$ or $2A$ with probability 0.5 each. $E[B] = 0.5(A/2) + 0.5(2A) = 1.25A$. Therefore, swap.
      *   *The Flaw:* This treats $A$ as a fixed constant while simultaneously treating it as a random variable dependent on the underlying distribution. You can't assume the probability of being in the "low" vs. "high" envelope is 0.5 *conditional on seeing value A* without knowing the prior distribution of values.
      *   *The Resolution:* To calculate $E[B | A=x]$, you need $P(\text{smaller} = x | \text{observed} = x)$ vs $P(\text{larger} = x | \text{observed} = x)$. This depends on the prior distribution of the smaller amount.
      *   *Valid Swap:* If the prior distribution is such that seeing a specific value $x$ makes it more likely you hold the smaller envelope than the larger one, swapping is beneficial *for that specific x*.
      *   *Impossible Swap:* You cannot have a distribution where swapping is beneficial for *all* possible observed values $x$ if the expected value of the game is finite. (If EV is infinite, weird things happen, but game economies hate infinite EV).
      *   *Simulation Trap:* If the simulation caps the values (hard cap), the symmetry breaks at the cap. If the simulation doesn't cap but uses a finite number of trials, it might miss the tail behavior or converge slowly.

  3.  **Drafting Section 1: The Distinction:**
      *   Need to explain "Unconditional" vs. "Conditional" without measure theory.
      *   *Key concept:* The 1.25x argument assumes that seeing \$100 tells you nothing about whether \$100 is the "small" or "large" amount. But in a real economy, large amounts are rarer. If \$100 is the max possible prize, you definitely hold the large one.
      *   *Drafting thought:* Focus on the "Prior Distribution." The naive math assumes all amounts are equally likely to be the small/large pair, which implies an infinite uniform distribution (impossible).

  4.  **Drafting Section 2: The Procedure:**
      *   Need a step-by-step checklist.
      *   *Step 1: Distribution Definition.* Is the base amount defined? (Pass/Fail).
      *   *Step 2: Conditioning.* Does the EV calc condition on the observed value? (Pass/Fail).
      *   *Step 3: Bounds.* Is there a hard cap? (Crucial for games).
      *   *Step 4: Knowledge.* What does the player know?
      *   *Structure:* Question -> Sufficient Answer -> Non-Answer -> Finding.

  5.  **Drafting Section 3: Simulation Audit:**
      *   Designers trust code. I need to verify the code.
      *   *Check 1:* Generation order. Do they pick (Small, Large) first, then assign randomly? Or pick A, then pick B? (Must be former).
      *   *Check 2:* Capping. Did they clamp values after generation? (Breaks math).
      *   *Check 3:* Trial Count. Variance is huge in these distributions. 10k trials might not be enough for heavy tails.
      *   *Check 4:* Comparison. Are they comparing $E[B]$ to $E[A]$ (unconditional) or $E[B|A=x]$ (conditional)? The design claim is usually about the *strategy* (always swap), so unconditional comparison of "Always Swap" vs "Never Swap" is actually valid for overall economy cost, even if the conditional logic is flawed. *Wait, correction:* The design claim is "Swap is always better." To prove that, you need conditional EV. To prove "Swapping costs more budget," you need unconditional EV. I need to be careful here. The design doc claims 1.25x *given observed amount*. The simulation usually shows *average payout over all runs*.
      *   *Refinement:* If the sim shows "Always Swap" yields higher average than "Never Swap" over the whole run, that *can* be true for specific distributions (like the infinite mean case). But if the claim is "For any amount X you see, the other is 1.25X", the sim needs to bin by observed amount.
      *   *Decision:* Focus on the generation logic and the binning.

  6.  **Drafting Section 4: Mechanical vs. Judgment + Handoff:**
      *   Mechanical: Does the doc define a distribution? Does the sim cap values?
      *   Judgment: Is the tail risk acceptable? Is the infinite EV a dealbreaker?
      *   Handoff: When the math implies infinite EV or the distribution is pathological.
      *   *Handoff Note:* Needs to be specific. "Distribution implies infinite expected payout" or "Conditional probability calculation missing prior."

  7.  **Drafting Section 5: Limitations:**
      *   Can't detect subtle coding bugs in RNG.
      *   Can't judge economic impact of infinite EV (that's a business decision).
      *   Can't prove a negative (that no distribution exists) without seeing the specific numbers.

  8.  **Drafting Section 6: Worked Examples:**
      *   *(a) No Distribution:* Fail. Naive 1.25x relies on impossible prior.
      *   *(b) Geometric Distribution (3/4)^K:* This is the "proper" Two Envelope setup. $P(K) \propto (3/4)^K$.
          *   Math check: Let $S = 2^K$. $L = 2^{K+1}$.
          *   Prob of pair $(2^K, 2^{K+1})$ is $c \cdot (3/4)^K$.
          *   If I see $x = 2^K$. Could be Small (from pair $K$) or Large (from pair $K-1$).
          *   $P(S=x) \propto (3/4)^K$. $P(L=x) \propto (3/4)^{K-1}$.
          *   Ratio $P(S=x) / P(L=x) = (3/4)$.
          *   So it is more likely I hold the Small one.
          *   $E[\text{Swap}] = \frac{3}{7} (x/2) + \frac{4}{7} (2x)$? Wait, need to normalize probabilities.
          *   Actually, simpler: If $P(K)$ decays slower than $1/2$, swapping is beneficial. Here ratio is $3/4$ vs $1$.
          *   Wait, the prompt says $K$ drawn proportional to $(3/4)^K$.
          *   Let's check the EV. If the mean is infinite, the economy team rejects it.
          *   Sum of $2^K \cdot (3/4)^K = \sum (1.5)^K$. This diverges. Infinite Mean.
          *   Verdict: Reject (Economy risk) or Approve with Condition (Hard Cap).
      *   *(c) Uniform 1 to 20 + Sim:*
          *   Uniform on $K \in [1, 20]$. Hard cap effectively at $2^{20}$.
          *   At the cap ($2^{20}$), you *must* have the smaller envelope? No, if $K$ is max, you have $(2^{20}, 2^{21})$. Wait, if $K$ is max, the pair is $(2^{20}, 2^{21})$. If there is a hard cap on *payout*, say $2^{20}$, then the pair $(2^{20}, 2^{21})$ is impossible or clamped.
          *   If the sim draws $K \in [1, 20]$ and pays $2^K$ or $2^{K+1}$, the max payout is $2^{21}$.
          *   If the design claims 1.25x *always*, it's false at the boundaries.
          *   If the sim shows 4% gain, is it significant? Variance is high.
          *   Defect: Boundary effects. At the top end, you can't double.
          *   Verdict: Reject logic, Approve mechanic if capped (but fix the 1.25 claim).

  9.  **Drafting Section 7: The One-Liner:**
      *   Needs to be punchy. "The math assumes money grows on trees." No, too informal.
      *   "The 1.25x rule assumes every amount is equally likely to be the smaller or larger chest, which requires an infinite budget."

  10. **Review and Refine:**
      *   *Tone Check:* Professional, engineering-focused, authoritative but humble on math limits.
      *   *Constraint Check:* 45 mins? The procedure needs to be fast.
      *   *Math Check on Example (b):*
          *   Pair $k$ has values $(2^k, 2^{k+1})$ with prob $p_k \propto (3/4)^k$.
          *   Observe $x = 2^k$.
          *   Case 1: $x$ is the smaller of pair $k$. Prob $\propto (3/4)^k$.
          *   Case 2: $x$ is the larger of pair $k-1$. Prob $\propto (3/4)^{k-1}$.
          *   Likelihood ratio (Small/Large) = $(3/4)^k / (3/4)^{k-1} = 3/4$.
          *   So $P(\text{Small}|x) = 3/7$, $P(\text{Large}|x) = 4/7$.
          *   $E[\text{Other}] = (3/7)(2x) + (4/7)(x/2) = (6/7)x + (2/7)x = (8/7)x \approx 1.14x$.
          *   So swapping *is* beneficial for every $x$.
          *   BUT, Expected Value of the game: $E[\text{Payout}] = \sum p_k \cdot (1.5 \cdot 2^k) \propto \sum (3/4)^k \cdot 2^k = \sum (1.5)^k$. Diverges.
          *   So the mechanic is mathematically sound (swap is good) but economically fatal (infinite cost).
          *   My procedure must catch the infinite mean.
      *   *Math Check on Example (c):*
          *   Uniform $K \in [1, 20]$.
          *   Pairs $(2^1, 2^2) \dots (2^{20}, 2^{21})$.
          *   If I see $2^{21}$, I know I have the Large one (from pair 20). Swap gives $2^{20}$ (Loss).
          *   If I see $2^1$, I know I have the Small one (from pair 1). Swap gives $2^2$ (Gain).
          *   Middle values: $2^k$ ($1 < k \le 20$). Could be Large of $k-1$ or Small of $k$. Since Uniform, prob is equal (0.5).
          *   So for middle values, EV is 1.25x. For top value, EV is 0.5x. For bottom, EV is 2x.
          *   Overall EV of swap vs stay?
          *   Since the distribution is bounded, the "Always Swap" strategy cannot beat "Never Swap" in total expectation. (Zero sum between the two envelopes).
          *   Wait, $E[A] = E[B]$. So $E[\text{Swap}] = E[\text{Stay}]$.
          *   Why does the sim show 4%? Random noise or implementation bug (e.g., reseeding, clamping).
          *   Actually, if the sim enforces a hard cap on *payout* (e.g. max currency), that breaks symmetry.
          *   If the sim just draws $K$ uniformly, the total EV must be identical. A 4% difference in 10k trials with this variance is likely noise.
          *   Standard Deviation is huge. $2^{20}$ is ~1 million. Variance dominates. 10k trials is insufficient.

  11. **Final Polish:** Ensure the distinction between "Mathematically Valid Swap" (conditional EV > current) and "Economically Viable" (finite mean) is clear. The procedure needs to separate these.

      *   *Self-Correction on Procedure Step 2:* Make sure to distinguish between "Does swapping increase *total* budget cost?" (No, $E[A]=E[B]$) vs "Does swapping increase *conditional* EV?" (Yes, for some distributions). The design doc claims the latter justifies the feature. The economy cares about the former.
      *   *Wait, important:* If $E[A] = E[B]$, then offering the swap doesn't change the *average* cost per player *if* players swap randomly. But if players *always* swap, the cost is still $E[B]$, which equals $E[A]$. So the *budget* impact is neutral. The *player satisfaction* might change.
      *   *However*, the design doc claims EV is 1.25x *held amount*. This implies $E[B] > E[A]$, which is impossible if the pairs are fixed.
      *   *Correction:* $E[B | A=x] > x$ is possible for all $x$. But $\int E[B|A=x] P(A=x) dx = E[B] = E[A]$.
      *   This is the paradox. You can have $E[B|A=x] > x$ for all $x$, yet $E[B] = E[A]$. This requires infinite mean.
      *   So, if the mean is finite, you *cannot* have $E[B|A=x] > x$ for all $x$.
      *   This is the key lever. Finite Mean -> Some values must discourage swapping. Infinite Mean -> All values can encourage swapping (but economy breaks).
      *   I need to make sure the procedure highlights this "Finite Mean" check.

  12. **Finalizing the Output Structure:** Match the user's 7 points exactly. Keep language tight. No fluff.

      *(Self-Correction during drafting Section 6b)*: I need to be careful with the verdict. The math says swap is better. The economy says infinite cost. The verdict should be "Reject (Economic Risk)" not "Reject (Math Error)". The prompt asks me to handle the tension, not resolve it by calling it fallacious.

      *(Self-Correction during drafting Section 6c)*: 10k trials is definitely too low for variance of $2^{20}$. I need to specify a statistical test or trial count increase.

      *(Refining the "One-Liner")*: It needs to address the "ignorance" accusation. "I am not blocking the feature; I am blocking the budget hole."

      Let's write it.
answer: |-
  ### 1. The Core Distinction

  The naive argument fails because it treats the amount in your hand ($A$) as a fixed number while simultaneously treating it as a random variable. It assumes that seeing \$100 tells you nothing about whether \$100 is the "small" or "large" amount in the pair.

  In a real game economy, large amounts are rarer than small amounts. If you see the maximum possible payout, you know with 100% certainty that you hold the "large" chest, and swapping guarantees a loss. The naive 1.25x calculation assumes a probability distribution where every amount is equally likely to be the small or large half of a pair, which mathematically requires an infinite supply of currency (an infinite expected value).

  **The Rule:** If the game has a finite budget (finite expected payout), there *must* be some observed amounts where swapping is neutral or negative. If a document claims swapping is *always* positive, it implies an infinite expected cost.

  ---

  ### 2. The Review Procedure

  Run these questions in order. If a step fails, stop and record the finding.

  **1. Is the Joint Distribution Defined?**
  *   **Question:** Does the document explicitly define how the base amount (the smaller chest) is chosen? (e.g., "Uniform 1–100," "Geometric decay," "Fixed table").
  *   **Sufficient Answer:** A specific probability mass function or a reference to a concrete loot table.
  *   **Non-Answer:** "Randomized," "Based on player level," or "The other chest is half or double."
  *   **Finding if Failed:** **Reject.** The 1.25x claim is mathematically undefined without a prior distribution.

  **2. Is the Expected Value Finite?**
  *   **Question:** Calculate the sum of (Probability of Pair $k$) $\times$ (Average Value of Pair $k$). Does this sum converge to a finite number?
  *   **Sufficient Answer:** A calculation showing the series converges, or a hard cap on the maximum possible payout.
  *   **Non-Answer:** "The tail is negligible," or no calculation provided.
  *   **Finding if Failed:** **Escalate.** The mechanic is mathematically consistent but economically catastrophic (infinite expected cost).

  **3. Does the Argument Condition on Observation?**
  *   **Question:** Does the EV calculation use $E[\text{Swap} \mid \text{Observed} = x]$ or just $E[\text{Swap}]$?
  *   **Sufficient Answer:** The document acknowledges that the probability of holding the "small" chest depends on the specific value $x$ observed.
  *   **Non-Answer:** "The other chest is always 50% likely to be double."
  *   **Finding if Failed:** **Reject.** This is the naive fallacy. It ignores that seeing a high number makes it more likely you hold the "large" chest.

  **4. Are Boundary Conditions Handled?**
  *   **Question:** If there is a hard cap (max currency), what happens if the player holds the max amount?
  *   **Sufficient Answer:** The document admits swapping is bad/impossible at the cap, or the cap is removed from the swap logic.
  *   **Non-Answer:** "The cap applies after the swap," or silence on the matter.
  *   **Finding if Failed:** **Reject.** Symmetry breaks at the boundaries; the 1.25x rule cannot hold at the max value.

  **5. What Does the Player Know?**
  *   **Question:** Does the player know the distribution limits? (e.g., Do they know the max possible chest value?)
  *   **Sufficient Answer:** "Player knows the loot table" or "Player has no knowledge of bounds."
  *   **Non-Answer:** Assumption that player knowledge doesn't matter.
  *   **Finding if Failed:** **Note.** If the player knows the bounds, they will optimize perfectly (never swap at max), reducing the feature's engagement value.

  ---

  ### 3. Simulation Audit List

  Designers trust the harness. Verify the harness before trusting the result.

  1.  **Generation Order:** Inspect the code. It must generate the *pair* first (e.g., pick $K$, create $\{2^K, 2^{K+1}\}$), then randomly assign one to the player.
      *   *Defect:* If it picks the player's amount first, then rolls 50/50 for half/double, it hard-codes the fallacy into the RNG.
  2.  **Clamping:** Check if values are clamped *after* generation.
      *   *Defect:* If the logic generates $2^{21}$ but clamps it to $2^{20}$, you have destroyed the symmetry. The "other" chest is no longer mathematically linked.
  3.  **Trial Count:** For heavy-tailed distributions (powers of 2), 10,000 trials is insufficient.
      *   *Requirement:* Require $1,000,000$ trials or a confidence interval calculation. The variance in these distributions is massive; a 4% difference in 10k trials is noise.
  4.  **Binning:** If the claim is "Swap is better for *any* amount," the simulation must output EV *per observed amount*, not just a global average.
      *   *Defect:* A global average can hide losses at high values with gains at low values.

  ---

  ### 4. Mechanical Checks vs. Judgment Calls

  **Mechanical Checks (You decide):**
  *   Step 1 (Distribution Defined): Yes/No.
  *   Step 3 (Conditioning): Yes/No.
  *   Step 4 (Boundaries): Yes/No.
  *   Simulation Audit 1 & 2 (Code Logic): Pass/Fail.

  **Judgment Calls (Analyst decides):**
  *   Step 2 (Finite Mean): If the math holds but the mean is infinite, this is an economic risk, not a math error.
  *   Simulation Audit 3 (Significance): Determining if a reported difference is statistical noise requires statistical judgment.

  **Analyst Handoff Point:**
  Stop at **Step 2** if the mean is infinite, or at **Simulation Audit 3** if the trial count is borderline.

  **Handoff Note Template:**
  > "Mechanic implies infinite expected payout (divergent series). Math is consistent, but economy risk is unbounded. Recommend Analyst review for budget capping strategy."
  > *OR*
  > "Simulation shows 4% gain, but variance suggests 1M trials needed for 95% confidence. Current data inconclusive."

  ---

  ### 5. Procedure Limitations

  *   **False Negatives:** This procedure will reject "naive" documents that might actually be implemented with a hidden hard cap in code that wasn't documented. (Mitigation: Check the code, not just the doc).
  *   **False Positives:** It will pass documents with valid math but terrible player psychology (e.g., players feel cheated when swapping loses at the cap).
  *   **Economic Blindness:** The procedure verifies mathematical consistency, not affordability. A finite mean can still be too expensive for the live economy.
  *   **Code Logic:** It assumes the simulation code accurately reflects the design doc. If the engineer coded the fallacy into the RNG (see Audit #1), the sim will "confirm" the bad math.

  ---

  ### 6. Worked Runs

  **(a) The Naive Chest (No Distribution)**
  *   **Run:** Step 1 fails immediately. No distribution defined.
  *   **Verdict:** **Reject.**
  *   **Review Note:** "The expected value calculation requires a defined probability distribution for the chest amounts. Without this, the 1.25x claim assumes an impossible infinite uniform distribution. Please specify the loot table or base amount generator."

  **(b) The Geometric Chest (Infinite Mean)**
  *   **Run:** Step 1 Passes (Distribution defined). Step 2 Fails.
      *   *Math:* Sum of $2^K \cdot (3/4)^K$ is Sum of $(1.5)^K$. This diverges.
  *   **Verdict:** **Approve with Conditions (Escalate).**
  *   **Review Note:** "The swap logic is mathematically valid (swapping is always locally positive EV), but the distribution implies an infinite expected payout per player. This cannot ship without a hard cap. Escalating to Analyst to determine acceptable truncation point."

  **(c) The Uniform Harness (Bounded + Sim Claim)**
  *   **Run:** Step 1 Passes. Step 2 Passes (Finite mean). Step 4 Fails (Boundaries).
      *   *Math:* With a hard cap (K=20), the top value cannot double. Swapping at the top is a guaranteed loss. The global 1.25x claim is false.
      *   *Sim:* 10k trials is too low for variance of $2^{20}$. The 4% gain is likely noise or a boundary artifact.
  *   **Verdict:** **Reject.**
  *   **Review Note:** "With a finite range (K=1 to 20), symmetry breaks at the boundaries; swapping at the max value is a guaranteed loss, making the 'always swap' claim false. Additionally, 10k trials is statistically insufficient for this variance; the reported 4% gain is indistinguishable from noise. Please re-run with 1M trials and bin results by observed amount."

  ---

  ### 7. The One-Liner for Designers

  "The 1.25x rule assumes we have an infinite budget; since we have a hard cap on currency, the math must break at the top end, meaning swapping cannot be correct for every amount."
