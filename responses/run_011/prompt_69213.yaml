answer: |-
  ### The Demos Boundary Instrument

  **Note on the Forks:** Your intuition on the logical forks is correct. The circularity objection (who decides who decides) is the hardest knot; the tree forces you to cut it early (Node 2). The distinction between *coercion* and *affectedness* often collapses, but the "Company Town" case (Node 5) is the wedge that drives them apart. The "History" fork (Node 1) is often an admission of defeat, but it is a stable position.

  ---

  ### The Decision Tree

  **Node 1:** Do we accept current citizenship borders as the legitimate default starting point?
  *(Case: The incinerator neighbors who aren't citizens.)*
  *   **YES** → Go to **Leaf A**.
  *   **NO** → Go to Node 2.

  **Node 2:** If we redraw the borders, do the current insiders get to vote on the new rules?
  *(Case: A secession referendum where the whole country votes vs. only the region.)*
  *   **YES** → Go to **Leaf B**.
  *   **NO** → Go to Node 3.

  **Node 3:** Is the right to vote tied to being legally punishable by the state?
  *(Case: Citizens living abroad who cannot be jailed by the home country.)*
  *   **YES** → Go to Node 4.
  *   **NO** → Go to Node 5.

  **Node 4:** Does physical residence inside the territory matter more than legal citizenship?
  *(Case: Non-citizen residents vs. expat citizens.)*
  *   **YES** → Go to **Leaf C**.
  *   **NO** → Go to **Leaf D**.

  **Node 5:** If not legal punishment, does being practically forced to obey count as coercion?
  *(Case: Workers in a company town where the employer sets all rules.)*
  *   **YES** → Go to **Leaf E**.
  *   **NO** → Go to Node 6.

  **Node 6:** Does suffering significant harm or benefit grant a voice, even without coercion?
  *(Case: A river carrying pollution from one country to another.)*
  *   **YES** → Go to Node 7.
  *   **NO** → Go to **Leaf F** (The Null/History Position).

  **Node 7:** Should the electorate change based on the specific issue being voted on?
  *(Case: A city selling its water utility vs. zoning laws.)*
  *   **YES** → Go to **Leaf G**.
  *   **NO** → Go to Node 8.

  **Node 8:** Should voting power scale with how intensely the decision touches you?
  *(Case: Giving everyone on earth a fractional vote weighted by impact.)*
  *   **YES** → Go to **Leaf H**.
  *   **NO** → Go to Node 9.

  **Node 9:** Do future people count as affected stakeholders today?
  *(Case: A fifty-year infrastructure bond the borrowers won't be alive to pay.)*
  *   **YES** → Go to **Leaf I**.
  *   **NO** → Go to **Leaf J**.

  ---

  ### The Leaves (Positions)

  | Leaf | Name | Constituency Principle | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Boundary Realism** | The demos is defined by existing legal status and historical accident. | Must accept that some people bear costs (incinerator neighbors) with zero recourse. |
  | **B** | **Democratic Closure** | The existing demos constitutes itself; insiders decide who counts. | Accepts the circularity: the people who exclude others are chosen by the exclusion. |
  | **C** | **Territorial Subjecthood** | All who reside within the jurisdiction and are subject to its daily enforcement vote. | Disenfranchises expat citizens who retain legal ties but live elsewhere. |
  | **D** | **Legal Subjecthood** | Only those legally liable to the state's punishment and citizenship laws vote. | Excludes long-term residents who obey all laws but lack citizenship papers. |
  | **E** | **Practical Subjecthood** | Inclusion extends to anyone practically coerced by the power structure, public or private. | Risks dissolving the state into private fiefdoms (company towns become mini-states). |
  | **F** | **Skeptical Nominalism** | There is no moral principle for the boundary; it is purely a factual constraint. | Offers no defense against tyranny other than "this is how it is." |
  | **G** | **Functional Demos** | The electorate is fluid and reconstituted for every distinct policy decision. | Logistically nightmarish; creates different majorities for interdependent issues. |
  | **H** | **Weighted Stakeholder** | All affected interests count, but voting power is proportional to impact intensity. | Requires a neutral arbiter to measure "impact," which is itself a political decision. |
  | **I** | **Intergenerational Demos** | The demos includes future persons whose interests are bound by current decisions. | Requires proxies for the unborn, who cannot instruct their representatives. |
  | **J** | **All-Affected (Contemporary)** | Every person whose interests are significantly touched by a decision gets an equal vote. | Potentially grants a vote to almost everyone on earth for almost every issue. |

  ---

  ### Instrument Analysis

  #### 1. Collapsing Distinctions (Coercion vs. Affectedness)
  Your suspicion is largely correct: **Leaf D (Legal Subjecthood)** and **Leaf J (All-Affected)** often yield the same voters in stable nation-states. However, the tree forces them apart at **Node 5 (Practical Coercion)**.
  *   **Where they part:** The **Company Town**. Workers are *affected* by the employer's rules and *practically coerced* (obey or starve), but not *legally coerced* by the state.
  *   **The Collapse:** In standard public law, being "subject to coercion" usually implies being "affected." If you are coerced, you are affected. But if you are affected (river pollution), you are rarely coerced.
  *   **Verdict:** The tree shows they are only rivals in edge cases (private power structures or cross-border externalities). In domestic public elections, they collapse.

  #### 2. Empty Cells (Coherent but Unoccupied)
  The branch structure allows for combinations that no major theorist defends:
  *   **Realist Boundary + Weighted Votes (Leaf A + Node 8 Yes):** You keep current citizenship borders but weight votes by impact.
      *   *Status:* **Unattractive.** It keeps the exclusionary boundary (incinerator neighbors still can't vote) but complicates the internal counting. It solves nothing.
  *   **Practical Coercion + Fixed Boundary (Leaf E + Node 7 No):** You include company town workers but keep the electorate fixed for all issues.
      *   *Status:* **Unexplored.** Usually, if you admit practical coercion, you lean toward fluid boundaries (Functional Demos) because coercion varies by issue.
  *   **Legal Subjecthood + Future People (Leaf D + Node 9 Yes):** Only current citizens vote, but they must vote as trustees for the unborn.
      *   *Status:* **Coherent.** This is the standard "guardianship" model, but it fails the "constituency principle" test because the future people are not *in* the demos, just represented by it.

  #### 3. The Circularity Trap
  **Node 2** is the critical escape hatch.
  *   If you answer **YES**, you accept **Democratic Closure (Leaf B)**. You admit the boundary cannot be justified democratically; it is a pre-condition for democracy. This answers your roommate's objection by conceding the point: *Yes, the boundary is fixed by the people inside it, because there is no "outside" perspective available to fix it without infinite regress.*
  *   If you answer **NO**, you must appeal to a moral principle (Coercion, Affectedness) that stands outside the democracy. This invites the "who decides the principle?" objection, which pushes you down the tree to Node 3.

  #### 4. The "History Drew the Line" Position
  **Leaf A (Boundary Realism)** and **Leaf F (Skeptical Nominalism)** look similar but differ at **Node 6**.
  *   **Realism** says history is *legitimate*.
  *   **Nominalism** says history is just *fact*.
  *   **Verdict:** This is not an admission of defeat wearing a costume; it is a distinct philosophical claim that stability is a higher value than perfect inclusion. It handles the "incinerator" case by saying "injustice exists, but changing the border causes more chaos."

  #### 5. The Fractional Vote (Node 8)
  This is a **real leaf**, not nonsense. It is the only way to solve the "degrees of affectedness" problem without creating a Functional Demos. However, it creates a new problem: **Incommensurability**. How do you weigh "drinking polluted water" against "paying higher taxes"? The tree flags this at **Leaf H** as the "neutral arbiter" problem.
