answer: |-
  You have described a phenomenon with remarkable precision. To answer your primary question directly: **No, there is no single canonical term in the literature that captures the entire lifecycle you have outlined.**

  There are terms for the *components* of this error, and terms for the *rhetorical defense* you describe, but the specific synthesis you have identified—the lexicalization of an analogy into a category that retains the predictive force of the original event while shedding its descriptive constraints—does not have a dedicated name in standard philosophy or political science.

  Here is the conceptual geography you requested, mapping the nearest established ideas against your phenomenon, followed by a proposal for how to name and bound it if you choose to coin a term.

  ### 1. The Nearest Established Concepts

  **Reification (or Hypostatization)**
  *   **What it covers:** This is the closest standard term. It describes the error of treating an abstract concept or a relational construct (like an analogy) as if it were a concrete, independent thing. When "Munich" shifts from "a situation like 1938" to "a Munich," it has been reified.
  *   **Where it falls short:** Reification describes the *ontological status* of the term (it becomes a "thing"), but it does not inherently capture the *predictive smuggling*. One can reify a concept without assuming it carries the causal outcome of its source. For example, treating "The Market" as a conscious agent is reification, but it doesn't necessarily imply a specific historical outcome. Your phenomenon requires that the *conclusion* of the source case travels with the label.

  **The Motte-and-Bailey Doctrine**
  *   **What it covers:** This captures the *rhetorical immunity* or the "pincer" defense you described. In a Motte-and-Bailey, a speaker retreats to a defensible, boring position (the Motte) when challenged, but advances to a controversial, high-value position (the Bailey) when unchallenged.
  *   **The Fit:** In your phenomenon, the Motte is "This is a categorical pattern" (defensible, vague), and the Bailey is "This will end like 1938" (controversial, predictive). When you challenge the prediction, they retreat to the category. When you challenge the category's emptiness, they advance to the history.
  *   **Where it falls short:** Motte-and-Bailey is usually a description of a *debating tactic*, often intentional. Your phenomenon describes a *cultural and linguistic evolution* over years. The speakers may not be consciously shifting; the language itself has shifted beneath them.

  **Historical Essentialism**
  *   **What it covers:** This describes the belief that historical events reveal eternal "essences" or types (e.g., "There is such a thing as a Revolution," rather than "The French and Russian revolutions share traits").
  *   **Where it falls short:** Essentialism explains why people think categories exist, but it doesn't explain the *mechanism of the error* regarding the analogy. It misses the specific transition from *comparison* to *kind*.

  **Dead Metaphor / Lexicalization**
  *   **What it covers:** This explains the linguistic process. "Sputnik moment" has become a lexicalized unit, like "deadline" or "bottleneck."
  *   **Where it falls short:** As you noted, dead metaphors are usually harmless. "Deadline" no longer implies a line drawn in dirt, and nobody is harmed. Your phenomenon is distinct because the "dead" metaphor retains a *live empirical claim*. It is a **zombie metaphor**: linguistically dead (it's a category), but empirically alive (it makes predictions).

  ### 2. The Verdict: Is it a Familiar Sin?

  You asked if this is "a familiar sin wearing a new hat." It is a familiar sin, but the *hat* matters.

  The logical structure is a **Category Mistake** (treating a logical construction as a material object) combined with **Begging the Question** (assuming the outcome in the definition). However, the specific *career* of the term—starting as a live analogy, hardening into a noun, and acquiring epistemic immunity—is distinct enough that existing terms feel like approximations.

  If you are looking for the most rigorous existing label to hang on this, it is **Reified Analogy**. However, to be precise, you would need to qualify it: **"A Reified Analogy with Retained Predictive Load."**

  ### 3. A Proposed Coinage

  If you wish to name this specifically for your column, you need a term that captures the *slide* from comparison to category, and the *immunity* that results.

  I propose: **The Ontological Slide.**

  *   **Why:** It describes the movement (the slide) in the nature of being (the ontology) of the term. It moves from "like X" (relational) to "is an X" (categorical).
  *   **The Boundaries:**
      *   **Origin:** It *must* begin as a live analogy. A term cannot undergo the Slide if it is born as a category (e.g., "recession"). The deceptive power comes from the historical warrant of the original comparison.
      *   **The Mechanism:** The term must acquire grammatical solidity (taking articles, plurals, or prepositions like "in a...").
      *   **The Error:** The term must retain the *normative or predictive* conclusion of the source case while shedding the *descriptive* constraints.

  Alternatively, if you want to emphasize the rhetorical immunity: **The Prophetic Category.**
  *   **Why:** It highlights the contradiction. Categories describe; prophecies predict. This is a category that functions as a prophecy.
  *   **Edge Case:** "Recession" is a category, not a prophetic category, because its definition does not inherently prescribe a specific political remedy or inevitable outcome in the same way "Munich" implies "appeasement fails."

  ### 4. Answering Your Boundary Questions

  **Does it require that the label have begun life as a real comparison?**
  Yes. This is the source of the "spurious historical warrant." If a term is born as a category (e.g., "inflation"), its definition is open to technical revision. If it begins as an analogy ("This is like Weimar"), it imports the *emotional and causal weight* of the source. The Slide relies on that initial gravity to legitimize the later category.

  **Is there anything specifically wrong with the historical case?**
  Yes. Technical terms (like "atom") shed their origins harmlessly because they are absorbed into a *theoretical framework* that updates the definition. "Atom" means "indivisible" etymologically, but in physics, it is defined by its current theoretical role.
  Historical labels ("Munich," "Vietnam") are not absorbed into a theory; they are absorbed into *rhetoric*. There is no governing theory of "Munichs" that updates the definition based on new data. The definition remains frozen at the moment of lexicalization, while the world changes. This makes them **theoretically inert**. They cannot learn.

  **Where does this shade into mere vagueness?**
  It shades into vagueness when the predictive content is lost. If someone says "This is a Sputnik moment" merely to mean "a shock," without the implication that "therefore we must mobilize a massive state-led technical program to catch up," it has become vague, not dangerous. The danger exists only so long as the *policy prescription* or *inevitable outcome* of the original case remains attached.

  **Is a disciplined version possible?**
  Yes, but it requires grammatical discipline. A disciplined analogy must remain a *simile*, not a *metaphor*.
  *   **Undisciplined:** "We are in a Thucydides Trap." (Category)
  *   **Disciplined:** "This situation resembles the dynamics Thucydides described between Athens and Sparta." (Comparison)
  The disciplined version forces the speaker to re-verify the premises every time. The undisciplined version allows the label to do the thinking.

  ### 5. A Critique of Your Carving

  You asked me to say so if your carving is wrong. I believe your carving is correct, but I would suggest one refinement:

  You describe this as a single phenomenon. I suspect it is **two phenomena that reinforce each other.**
  1.  **The Linguistic Drift:** The natural tendency of language to compress complex comparisons into efficient nouns (Lexicalization). This is neutral.
  2.  **The Epistemic Capture:** The political incentive to use that noun to shut down debate (The Motte-and-Bailey).

  The danger isn't just that the language changes; it's that the language change is *exploited*. "Recession" undergoes the same linguistic compression, but economists fight over its definition constantly. "Munich" does not allow that fight.

  Therefore, the phenomenon you are tracking is not just the linguistic slide, but the **politicization of the slide.** It is when a Reified Analogy is granted **Immunity from Revision.**

  If I were to offer a final name that captures the danger, the immunity, and the history, I would suggest: **The Frozen Precedent.**
  *   **Frozen:** It does not update like a technical term.
  *   **Precedent:** It claims the authority of history.
  *   **The Error:** It treats a precedent (which should be argued) as a statute (which must be followed).

  But if you want the term that best fits the *logical structure* you described, stick with **Reified Analogy**, but define it in your column exactly as you have here: *a comparison that has hardened into a category to evade disanalogy, while retaining the predictive force of the original event.* That description is precise enough to stand without a single-word label, though **The Ontological Slide** provides a useful shorthand for the process.
