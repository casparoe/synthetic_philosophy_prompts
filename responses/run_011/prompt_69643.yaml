answer: |-
  Here is a principle constructed to fit your verdicts, stripped of the baroque machinery you rightly distrust, followed by the costs of its sparseness and the application to your new cases.

  ### The Principle of Non-Substitution with Liability

  **Clause 1 (The Trigger):** Force is permissible only to halt ongoing or imminent mass killing attributable to state policy or state collapse. The general vileness of a regime or past crimes are insufficient cause.
  **Clause 2 (The Ceiling):** Force must be capped at halting the killing. Regime change is prohibited unless the regime is the direct instrument of killing *and* a successor authority with demonstrable domestic traction is ready to assume power immediately.
  **Clause 3 (The Liability):** If regime change occurs without a ready successor, the intervener assumes sovereign liability. The intervention is permissible only if the intervener commits to and executes a governance plan that leaves the population no worse off than the status quo ante. If the intervention alters the political landscape (e.g., safe zones, corridors) without assuming sovereignty, it is judged by the foreseeable political consequences of that alteration.

  **Epistemic Constraint:** Permissibility is judged by reasonable foreseeability at the time of decision. However, "foreseeability" includes structural political realities (e.g., sectarian divides, regional dynamics), not just military tactical risks.

  ---

  ### Case Mapping: What Forced Each Clause

  *   **Clause 1 (Trigger):** Forced by **Iraq (2003)** and **Rwanda (1994)**. Iraq establishes that past crimes (Halabja) do not constitute an ongoing trigger; Rwanda establishes that state collapse (anarchy enabling killing) is sufficient trigger. This clause kills the "preventive war" doctrine.
  *   **Clause 2 (Ceiling):** Forced by **Libya (2011)** and **Côte d'Ivoire (2011)**. Libya fails because the shift from protection to hunting Gaddafi exceeded the cap without a successor. Côte d'Ivoire passes because the mandate (technically) aligned with restoring an elected authority, satisfying the "domestic traction" requirement.
  *   **Clause 3 (Liability):** Forced by **Cambodia (1978)**, **Turquoise (1994)**, and **Somalia (1992)**.
      *   *Cambodia:* Passes because Hanoi assumed liability and installed a government that *governed* (effective order), even if unrecognized.
      *   *Turquoise:* Fails because it altered the political landscape (safe zone) without assuming sovereignty, and the political consequence (genocidaires escaping) was foreseeable.
      *   *Somalia:* Passes because the initial mission was logistical/humanitarian (no political alteration intended), and the subsequent political collapse (Mogadishu) was not reasonably foreseeable in December 1992.

  ---

  ### The Unsavable Verdict

  **Syria (2018):** Your verdict is "Permissible and pointless."
  **The Principle's Verdict:** **Impermissible.**
  **Reasoning:** Under Clause 1, the trigger is "to halt... killing." If an act is "pointless," it does not halt killing. Under Just War reasoning, an act that consumes resources and risks escalation without achieving the humanitarian end fails Proportionality and Last Resort.
  **The Cost:** You must abandon the 2018 verdict. A strike that is purely punitive or symbolic, even if "permissible" in a broad sovereign sense, cannot be *humanitarian* intervention if it does not serve the humanitarian end. To save this verdict, you would need a fourth clause allowing for "Norm Enforcement" independent of immediate harm reduction.
  **Price of that Clause:** It opens the door to Kosovo-style strikes becoming routine punishment raids detached from strategic efficacy. I recommend abandoning the verdict.

  ---

  ### Resolving the Custody Paradox (Somalia vs. Turquoise)

  You are correct to be uneasy about Custody making permissibility turn on *ex post* facts. The resolution lies in the **Epistemic Constraint** combined with **Clause 3**.

  *   **Turquoise:** The creation of a "safe zone" in a genocide is inherently a political act that shifts frontlines. It was *foreseeable* in July 1994 that a military corridor would allow armed *génocidaires* to mix with refugees and escape. This is **Negligence**. The verdict stands: Wrong.
  *   **Somalia:** The decision in December 1992 was to secure ports and airfields for food distribution. The descent into clan warfare and the Battle of Mogadishu (1993) resulted from mission creep and specific tactical escalations that were *not* structurally foreseeable at the moment of entry. This is **Misfortune**. The verdict stands: Right.

  **Which to give up?** A consistent account requires you to judge *Turquoise* by its design, not just its outcome. If the design of a safe zone *necessarily* creates an escape route in that specific terrain, it is wrong *ex ante*. You do not need to wait for the escape to happen to know it is wrong. Somalia requires you to maintain that the 1992 mandate was distinct from the 1993 nation-building failure. If you conflate them, you must call Somalia Wrong. I advise keeping them distinct: Logistics $\neq$ Political Alteration.

  ---

  ### Application to New Cases

  **Case (i): Secessionist Bombing + Invitation + Veto**
  *   **Facts:** State bombs secessionist region (Cause met). Regional authority invites intervention (Agency/Successor factor). P5 veto blocks UN (Legality issue).
  *   **Application:**
      *   Clause 1: Met (ongoing killing).
      *   Clause 2: Met if force is limited to stopping the bombing.
      *   Clause 3: The invitation from the regional authority solves the "Successor" problem for that region. It functions like East Timor (Jakarta's consent) or Côte d'Ivoire (restoring elected authority).
      *   Legality: Like Kosovo, this is illegal under the Charter but may be justified if the veto is abusive.
  *   **Verdict:** **Permissible.** The invitation changes the answer by satisfying the "domestic traction" requirement of Clause 2. It transforms the intervention from "imposing a border" to "assisting a local authority," reducing the Liability burden.

  **Case (ii): Annexation as Security Measure**
  *   **Facts:** Intervention stops killing, but intervener annexes the border province.
  *   **Application:**
      *   Clause 2: Violated. Annexation is permanent regime change/sovereign substitution.
      *   Clause 3: Violated. The intervener has not committed to handing power back; it has consumed the territory.
  *   **Verdict:** **Impermissible.** Even if the killing stops. This is the Iraq/Libya failure mode institutionalized. The humanitarian benefit does not purchase the right to territorial acquisition. This aligns with your rejection of Iraq despite the elections.

  **Case (iii): Hypocritical Intervener**
  *   **Facts:** Only capable state is persecuting its own minority, but offers to lead coalition and will stop the genocide.
  *   **Application:**
      *   Clause 1: Met (Genocide unfolding).
      *   Clause 2 & 3: Depend on the plan, not the actor.
      *   **Actor Status:** The principle is agent-neutral regarding the intervener's domestic conduct, provided it does not impair the mission.
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** To deny intervention because the intervener is flawed is to sacrifice the victims to the intervener's purity. Vietnam (Cambodia) and India (East Pakistan) were not liberal democracies; their domestic records did not negate the liberation they effected.
  *   **Revision Check:** Does this feel wrong? It risks empowering predators. However, adding a "Clean Hands" clause would have rendered Rwanda (1994) impermissible (no Western state had clean hands regarding colonialism/racism) and Cambodia impermissible (Vietnam was a communist aggressor).
  *   **Decision:** I will not revise the principle. The cost of a "Clean Hands" clause is too high: it privileges the moral status of states over the lives of victims. The risk of the intervener using the mission for cover is managed by Clause 3 (Liability). If they annex territory (like Case ii), they fail. If they simply stop the killing and leave, their domestic sins are a separate ledger.

  ### Final Review of the Principle

  This principle is sparse. It sacrifices the "Permissible but Pointless" category (Syria 2018) to maintain logical coherence between Cause and Effect. It resolves the Custody paradox by distinguishing between *Foreseeable Political Externalities* (Turquoise) and *Unforeseen Security Failures* (Somalia). It prioritizes *Effective Order* over *International Recognition* (Cambodia), which is a hard realist pill but necessary to match your verdicts.

  It leaves you with one hard concession: **Syria 2018 must be judged Impermissible.** If you cannot accept that, the principle must be baroqued to allow "Symbolic Enforcement," which will inevitably weaken the bar for Iraq-style interventions. I advise holding the line.
