answer: |-
  This is a fantastic pedagogical instinct. You're right: memorizing "Nyāya = 4" is useless if they don't understand *why* Nyāya fights Mīmāṃsā about whether absence is a separate source of knowledge. Your game idea is solid, but it needs tight constraints to fit 50 minutes and prevent the "buy everything" exploit.

  Here is a fully fleshed-out lesson plan, **"The Pramāṇa Budget,"** designed for your constraints.

  ---

  # Lesson Plan: The Pramāṇa Budget
  **Time:** 50 Minutes
  **Materials:** Whiteboard, markers, index cards (cut into 30 "Case Cards"), printed "Doctrine Sheets" (one per team).
  **Class Size:** 18–20 students (4 teams of 4–5).

  ## 1. The Setup (0:00–0:05)
  **Goal:** Explain rules and assign budgets.
  **Whiteboard:** Draw a table with columns: *Team | Budget | Prāmāṇas Owned | Score*.

  **The Pitch:**
  "You are competing philosophical schools. You start with **10 Epistemic Credits (EC)**. Every *pramāṇa* (source of knowledge) you want to use costs **2 EC**. You cannot afford all of them. You must solve 'Knowledge Cases' using *only* the tools you bought. If you solve a case with a tool you own: **+1 EC**. If you solve it by reducing it to a cheaper tool (e.g., explaining 'Absence' using 'Inference'): **+2 EC** (Risk/Reward). If you fail to explain how you know it: **-2 EC**."

  **The Teams:**
  Divide the class into 4 teams. Hand each team a **Doctrine Sheet** (see below) so they know what the tools actually *do* without needing Sanskrit.

  *   **Team A (The Minimalists):** Encouraged to play Cārvāka/Buddhist.
  *   **Team B (The Common Sense):** Encouraged to play Nyāya.
  *   **Team C (The Maximalists):** Encouraged to play Mīmāṃsā.
  *   **Team D (The Wildcards):** Let them build a custom list.

  ## 2. The Budget Phase (0:05–0:10)
  Teams spend 5 minutes deciding which *pramāṇas* to buy.
  **Available Tools (Cost 2 EC each):**
  1.  **Perception:** Senses contacting object.
  2.  **Inference:** Reasoning from a sign (smoke → fire).
  3.  **Testimony:** Reliable verbal statement.
  4.  **Comparison:** Knowing X by similarity to Y.
  5.  **Postulation:** Explaining a contradiction (Devadatta is fat but doesn't eat by day → he eats at night).
  6.  **Non-Apprehension:** Knowing something isn't there by not perceiving it.

  *Constraint:* Max budget 10 EC. Max 5 tools. (This forces them to cut at least one major category).
  *TA Role:* Walk around. If Team A buys all 6, tell them they are over budget. They *must* cut something.

  ## 3. Gameplay Rounds (0:10–0:40)
  **Structure:** 4 Rounds. 7 Minutes per round.
  **Mechanic:** You read the Case Card. Teams have 2 minutes to confer. They write their explanation on a scrap of paper. Reveal simultaneously.
  **Scoring:** You (the TA) are the Judge. Award points based on whether their explanation uses a tool they own and fits the doctrine.

  ### The Case Cards (Print these on index cards)

  **Card 1: The Wild Ox (Standard)**
  > "You are walking in a forest. You see a distant animal with horns and a hump. You know: 'That is a wild ox.' You have never seen a wild ox before, but you know what 'hump' and 'horn' mean."
  > * **Intended Solution:** Perception + Comparison (Nyāya) OR Perception + Inference (Buddhist).
  > * **Trap:** Pure Perception (Cārvāka) struggles here because "Wild Ox" is a universal/category, not just sense data.

  **Card 2: The Fat Roommate (Postulation)**
  > "Your roommate Dev is gaining weight rapidly. However, you live together and you *never* see Dev eat during the day. You know: 'Dev eats at night.'"
  > * **Intended Solution:** Postulation (Mīmāṃsā).
  > * **Reduction Challenge:** Can you explain this with Inference? (e.g., "Weight gain is the sign, eating is the cause").
  > * **Fail State:** Perception (You didn't see it). Testimony (Dev didn't tell you).

  **Card 3: The Empty Room (Absence)**
  > "You walk into your classroom. You know: 'There is no elephant in this room.'"
  > * **Intended Solution:** Non-Apprehension (Mīmāṃsā).
  > * **Reduction Challenge:** Inference? ("If there were an elephant, I would see it. I don't see it. Therefore...").
  > * **Trap:** Perception. Can you *perceive* nothing? Or do you just perceive the room and infer the absence?

  **Card 4: The Chatbot (Testimony)**
  > "You ask a chatbot: 'What is the capital of Burkina Faso?' It replies: 'Ouagadougou.' You check a map; it is correct. You now know the capital."
  > * **Intended Solution:** Testimony (*Śabda*).
  > * **The Twist:** Testimony traditionally requires a *trustworthy person* (*āpta*) with *intent to communicate*. A bot has no intent and isn't a person.
  > * **Debate:** Is the bot a tool for Inference? Or is the programmer the *āpta*? If you don't have Testimony, can you solve this?

  **Card 5: The Breakfast Memory (Memory)**
  > "You sit down for lunch. You know: 'I ate oatmeal this morning.'"
  > * **Intended Solution:** Memory (*Smṛti*).
  > * **The Trap:** **Memory is NOT a *pramāṇa* in almost any school.** It preserves knowledge; it does not generate *new* knowledge.
  > * **Scoring Note:** If a team claims Memory is a *pramāṇa* they bought, give them the point **BUT** mark it on the board as "Philosophically Suspect." (See Debrief).
  > * **Reduction:** If they don't have Memory, they must explain it via Perception (traces of food?) or Inference.

  **Card 6: The Brown Patch (Cārvāka Trap)**
  > "You look at a field. You see a patch of brown and white. You say: 'That is a cow.'"
  > * **Intended Solution:** Perception + Inference (connecting the color to the substance).
  > * **The Cārvāka Trap:** If a team only has **Perception**, they must argue that "Cow" is directly perceived.
  > * **Why it's hard:** Perception only gives color/shape. "Cow-ness" is a universal/concept.
  > * **Scoring:** If the Cārvāka team claims "I just see the cow," award the point **BUT** flag it for the debrief (see "What Will Go Wrong").

  ## 4. The Debrief (0:40–0:50)
  **Goal:** Map the game to history and address the "Bad Moves."

  1.  **Tally Scores:** Announce the winner.
  2.  **The Parsimony Trade-off:** Ask the team with the fewest tools: "Which case was impossible for you?" (Likely Postulation or Absence). Ask the team with the most tools: "Did the cost of buying 5 tools hurt your final score?"
  3.  **Map to History:**
      *   **Cārvāka:** Only Perception. (Explain why they lost the "Brown Patch" card philosophically, even if they won points).
      *   **Buddhists:** Perception + Inference. (They reduce Testimony to Inference).
      *   **Nyāya:** 4 Tools. (Accept Testimony, reject Postulation/Absence as separate).
      *   **Mīmāṃsā:** 6 Tools. (Keep the list long to protect Vedic authority).
  4.  **The Chatbot Discussion:** Spend 3 minutes here.
      *   *Question:* "If the bot has no soul/intent, is it Testimony?"
      *   *Classical View:* No. It would be Inference (based on past reliability of the machine).
      *   *Modern View:* Does this break the definition of *śabda*?
  5.  **The "Bad Move" Correction:**
      *   Address Card 5 (Memory). "Many of you counted Memory as a source of *new* knowledge. In Indian philosophy, *pramāṇa* must be *anadhigata* (novel). Memory is repetition. That's why it's rarely a *pramāṇa*."
      *   Address Card 6 (Cārvāka). "If you said you *perceived* 'Cow,' you committed the error of confusing the universal with the particular. Perception gives sense-data; concepts require processing."

  ---

  # TA Cheat Sheet: Troubleshooting & Refereeing

  ### 1. The "Buy Everything" Exploit
  **Risk:** Students argue they should start with 12 points to buy all 6 tools.
  **Fix:** Hold the line. 10 points max. The pain of choosing is the point of the lesson. If they complain, say: "Ontological commitment is expensive. That's the lesson."

  ### 2. The Chatbot Rabbit Hole
  **Risk:** Students spend 10 minutes debating AI ethics rather than epistemology.
  **Fix:** Interrupt gently. "I don't care if the AI is conscious. I care if the *mechanism of knowledge transfer* fits the definition of *śabda* (reliable speaker) or *anumāna* (sign of truth)."

  ### 3. The Cārvāka "Gotcha"
  **Risk:** The Cārvāka team gets frustrated they can't solve the "Brown Patch" card.
  **Fix:** Allow them to argue that "Cow" is just a name for the shape/color bundle. Award the point if they argue it consistently, but note in the debrief that other schools consider this naive realism.

  ### 4. The "Philosophically Bad Move" Card
  **Request:** You asked for a card where scoring rewards a bad move.
  **Implementation:** **Card 5 (Memory).**
  *   **Why:** It is very tempting for students to treat Memory as a valid *pramāṇa* because it yields true belief.
  *   **The Move:** Let them buy "Memory" as a tool (cost 2 EC). Let them solve the card (+1 EC).
  *   **The Catch:** In the debrief, reveal that historically, Memory is excluded specifically because it lacks *novelty*.
  *   **Teaching Moment:** "You won the points, but you failed the philosophy. A *pramāṇa* is a *source* of knowledge, not a *storage* device. If you treat memory as a source, you can't explain error or learning."

  ### 5. Refereeing Disputes
  *   **Student:** "But we can explain Absence with Inference!"
  *   **You:** "Correct. That is the Nyāya position. You get the +2 EC bonus for reduction. But if you are playing Mīmāṃsā, you are forbidden from doing that. Check your Doctrine Sheet."
  *   **Student:** "This is too hard."
  *   **You:** "Good. Imagine being a 7th-century philosopher trying to defend this against a debate opponent who wants to dismantle your ontology."

  ---

  # Doctrine Sheets (Print 4 copies)

  **Team A: The Minimalists (Cārvāka/Buddhist leanings)**
  *   **Philosophy:** Keep it simple. Don't multiply entities.
  *   **Allowed Tools:** Perception, Inference.
  *   **Forbidden:** Testimony (unless reduced to Inference), Postulation, Absence.
  *   **Strategy:** Try to explain everything via senses or logical signs.

  **Team B: The Common Sense (Nyāya)**
  *   **Philosophy:** Trust language and comparison, but keep it tight.
  *   **Allowed Tools:** Perception, Inference, Testimony, Comparison.
  *   **Forbidden:** Postulation, Non-Apprehension.
  *   **Strategy:** Use Testimony for facts you can't check. Reduce Absence to Inference.

  **Team C: The Maximalists (Mīmāṃsā)**
  *   **Philosophy:** Protect the Veda. You need every tool to justify ritual knowledge.
  *   **Allowed Tools:** All 6 (If budget allows).
  *   **Strategy:** Buy Postulation and Non-Apprehension. They are your unique selling points.
  *   **Weakness:** High cost. You start with fewer points.

  **Team D: The Custom Build**
  *   **Philosophy:** Up to you.
  *   **Constraint:** You must justify why you cut a tool.
  *   **Strategy:** Maybe you drop Comparison? Or Testimony?

  ---

  # Limitations: What This Game Can't Reproduce
  *(Read this to yourself to manage expectations)*

  1.  **Novelty (*Anadhigata*):** The game treats "solving a case" as "gaining points." It doesn't perfectly capture the requirement that a *pramāṇa* must generate *new* knowledge. Memory (Card 5) highlights this, but the game mechanics still reward it as a valid move. You must correct this verbally in the debrief.
  2.  **Soteriology:** For these schools, epistemology isn't just about "knowing facts"; it's about liberation (*mokṣa*). The game makes it about "winning points." Acknowledge that the stakes are actually higher in the texts.
  3.  **Internal Coherence:** In the game, a team can pick a "Frankenstein" list (e.g., Perception + Postulation but no Inference). Historically, these lists are systematic. If a team does this, point out in the debrief that *pramāṇas* usually rely on each other (e.g., Inference relies on Perception).
  4.  **The Chatbot Anachronism:** The classical definition of *śabda* hinges on the speaker's *intent* to communicate truth. A chatbot has no intent. The game forces them to map it anyway. This is a feature, not a bug—it tests the flexibility of the definition—but be ready to admit that the classical texts don't have an answer for AI.

  # Minute-by-Minute Timeline (Strict)

  *   **00:00 – 00:05:** Intro, Rules, Budget Explanation.
  *   **00:05 – 00:10:** Team Huddle: Spend Budget. (TA circulates to enforce caps).
  *   **00:10 – 00:17:** Round 1 (Ox) & Round 2 (Roommate).
  *   **00:17 – 00:24:** Round 3 (Empty Room) & Round 4 (Chatbot).
  *   **00:24 – 00:30:** Round 5 (Memory) & Round 6 (Brown Patch). *Note: If running late, cut Round 6.*
  *   **00:30 – 00:40:** Scoring & Tally.
  *   **00:40 – 00:50:** Debrief (Memory Trap, Chatbot Intent, Parsimony Trade-off).

  **Final TA Tip:** If the Chatbot discussion gets heated (it will), use it. Write "INTENT REQUIRED?" on the board. Ask: "If I play a recording of a professor saying 'Fire is hot,' is that Testimony?" If they say yes, ask "What if the professor is dead?" This nails the *āpta* (trustworthy person) concept without needing Sanskrit. Good luck.
