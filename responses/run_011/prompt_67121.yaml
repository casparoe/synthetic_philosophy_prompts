      *   **Audience:** 18-20 sophomores/juniors. Half skimmed readings, no Sanskrit knowledge.
      *   **Goal:** Make them *feel* the trade-offs of accepting/rejecting pramāṇas (parsimony vs. explanatory power), not just memorize lists.
      *   **Specific Content:** Nyāya (4), Cārvāka (1), Buddhism (2), Mīmāṃsā (6). Key concepts: Postulation (arthāpatti), Non-apprehension (anupalabdhi), Memory, Testimony (śabda), Perception (pratyakṣa), Inference (anumāna).
      *   **Specific Case Cards Required:** Wild ox (standard), Postulation case, Absence case, Memory case, Chatbot case (crucial), Cārvāka trap case (perception vs. interpretation).
      *   **Deliverables:** Full rules, scoring, case cards, minute-by-minute timeline, debrief mapping to history, troubleshooting/refereeing advice, limitation analysis.
      *   **Tone:** Practical, academic but accessible, frank about limitations.

  2.  **Evaluate the User's "Half-Baked" Idea:**
      *   *Idea:* Teams get a list, pay "parsimony tax" per pramāṇa, solve cases, challenge others.
      *   *Critique:* It's actually quite good. It gamifies the ontological commitment.
      *   *Improvement Needed:* Needs tighter scoring to prevent "buy everything" strategy. Needs clear mechanics for challenges. Needs to fit 50 mins strictly. The "Chatbot" case needs careful framing to fit classical categories without anachronism breaking the game.

  3.  **Drafting the Game Mechanics (The "Pramāṇa Auction"):**
      *   *Name:* "The Parsimony Game" or "Pramāṇa Budget." Let's go with **"The Pramāṇa Budget."**
      *   *Setup:* Teams represent schools (Nyāya, Cārvāka, Buddhist, Mīmāṃsā).
      *   *Currency:* "Epistemic Credit" (EC).
      *   *Cost:* Buying a pramāṇa costs EC upfront.
      *   *Income:* Solving cases earns EC.
      *   *Twist:* If you *don't* have the pramāṇa, you must explain the knowledge using *only* your remaining tools. If you fail, you lose points. If you succeed (reductionism), you gain bonus points.
      *   *Refinement:* To prevent the "buy everything" strategy, make the starting budget tight. You *cannot* afford all 6. You have to choose.
      *   *Scoring:*
          *   Start: 10 EC.
          *   Cost per Prāmāṇa: 2 EC. (Max 5 pramāṇas possible, forces cuts).
          *   Solving a case with a direct pramāṇa: +1 EC.
          *   Solving a case via reduction (e.g., explaining absence via inference): +2 EC (Risk/Reward).
          *   Failing to explain: -2 EC.
          *   Successful Challenge: Steal 1 EC.

  4.  **Developing the Case Cards:**
      *   *Constraint:* Sophomore level, no Sanskrit.
      *   *Card 1 (Wild Ox):* Standard Perception/Inference mix. "I see a horned animal in the distance."
      *   *Card 2 (Postulation/Arthāpatti):* The classic "Fat Devadatta doesn't eat by day." Needs to be modernized slightly? No, keep it classic but clear. "Your roommate is gaining weight but you never see them eat at home."
      *   *Card 3 (Absence/Anupalabdhi):* "I know there is no elephant in this room."
      *   *Card 4 (Memory):* "I remember eating breakfast." (Crucial: Most schools reject this as a *new* pramāṇa).
      *   *Card 5 (Chatbot):* "You ask an AI for the capital of Burkina Faso. It says Ouagadougou. It is correct." (Focus: Is it testimony? Who is the speaker?)
      *   *Card 6 (Cārvāka Trap):* "You see a patch of brown and say 'Cow'." (Focus: Perception vs. Conceptualization/Inference).

  5.  **Timeline (50 Minutes):**
      *   0-5: Intro & Rules.
      *   5-15: Budget Phase (Teams choose pramāṇas).
      *   15-40: Gameplay (5 rounds, 5 mins each).
      *   40-50: Debrief & Mapping.
      *   *Risk:* 50 mins is tight. Need to keep rounds fast. Maybe 4 rounds instead of 5? Let's stick to 4 substantial rounds to allow discussion.

  6.  **Troubleshooting/Refereeing:**
      *   *Problem:* "Buy Everything." *Fix:* Hard budget cap.
      *   *Problem:* "Anything goes" explanations. *Fix:* TA acts as Judge. Must stick to school doctrine (handout provided).
      *   *Problem:* Chatbot case derails into AI ethics. *Fix:* Steer back to *śabda* (testimony) conditions (speaker intent, trustworthiness).
      *   *Problem:* Memory confusion. *Fix:* Clarify *smṛti* vs. *pramā*.

  7.  **Debrief Strategy:**
      *   Map teams to historical schools.
      *   Discuss the "Chatbot" outcome (Testimony requires a *person*?).
      *   Discuss the "Cārvāka Trap" (Perception is theory-laden?).
      *   Address the "Bad Move" card (Rewarding reductionism that feels intuitively wrong).

  8.  **Limitations:**
      *   Game simplifies *siddhānta* (established conclusions).
      *   Game treats pramāṇas as tools rather than ontological commitments.
      *   Memory issue: Is it valid knowledge? Yes. Is it a *source* of new knowledge? No. Game needs to reflect this distinction.

  9.  **Refining the "Bad Move" Card:**
      *   Need a case where a team *should* fail but the rules let them pass, or vice versa.
      *   *Idea:* A team uses Inference to explain Absence. Historically controversial (Nyāya says Inference, Bhāṭṭa Mīmāṃsā says Non-apprehension). If a Nyāya team does it, it's "correct" for them. If a Mīmāṃsā team does it, it's "bad doctrine."
      *   *Better Idea:* The "Memory" card. If a team counts Memory as a *new* source of knowledge (generating novelty), that's philosophically wrong across the board (mostly). But the game might reward them for solving it. I need to flag this.
      *   *Actually:* The prompt asks for a card where scoring rewards a *philosophically bad move*.
      *   *Selection:* The Cārvāka team successfully explains "This is a cow" via Perception alone. Historically, Cārvākas struggle with universals. If the game lets them pass, that's a "bad move" philosophically (ignoring the universal problem), but they win points. I will highlight this in the debrief.

  10. **Final Review against Constraints:**
      *   50 mins? Yes.
      *   Index cards/Whiteboard? Yes.
      *   No Sanskrit? Yes.
      *   Chatbot case included? Yes.
      *   Cārvāka trap included? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure the Budget Phase doesn't eat too much time. Pre-assign schools? No, let them choose, it's more fun. But give them a "Doctrine Sheet" so they know what they are buying.
      *   *Correction:* The Chatbot case needs to be very specific about the *source*.
      *   *Correction:* Ensure the "Parsimony Tax" is clear. It's better as an upfront cost than a per-round tax (too much math). Upfront cost limits options.

  12. **Final Polish:** Check tone. Keep it supportive for a 3rd year TA. Ensure the "What Will Go Wrong" section is honest. (e.g., students arguing about AI for 20 mins).

  *(Self-Correction on the "Bad Move" request)*: The prompt asks for "at least one card where the scoring rewards a philosophically bad move."
  *Interpretation:* A situation where a team gets points for an explanation that a real philosopher of that school would reject, or that is generally unsound, but the game mechanics allow it.
  *Solution:* The "Memory" card. If a team treats Memory as a *generative* pramāṇa (creating new knowledge), they solve the card easily. But historically, Memory is *not* a pramāṇa because it's not novel. I will instruct the TA to award points but flag it in debrief.

