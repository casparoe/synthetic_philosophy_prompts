  ### Recommendation

  **Decision:** Publish the technical write-up immediately, alongside the patch.

  **Closest Analog:** **Case 4 (Cryptographic Weakness).**
  This is the strongest precedent because it involves a security vulnerability in deployed infrastructure where public knowledge is required for defense. In Case 4, the panel prioritized unconditional publication even when vendors could not fix the issue quickly. In the current case, the patch is faster (days vs. unknown), but the inevitability of disclosure is higher (three independent teams, three-week timeline vs. general difficulty of secrecy). The logic of Case 4—that the risk of hidden vulnerability outweighs the risk of coordinated silence—holds stronger here given the imminent leak.

  **Analogy Limits:** The analogy strains slightly because Case 3 (Model Refusal Stripping) successfully utilized a silent, coordinated patch among members. However, Case 3 involved a *capability enhancement* (offensive potential), whereas the current case and Case 4 involve *vulnerability disclosure* (defensive necessity). Furthermore, Case 3 relied on a closed consortium; the current flaw affects ubiquitous open-source infrastructure with multiple external discoverers, making the Case 3 model of containment infeasible.

  ---

  ### Candidate Principles

  Our five past verdicts are jointly consistent with two competing principles of risk governance. Both explain the record, but they diverge on this case.

  **Principle 1: Feasible Containment.**
  *Restrict dissemination if and only if secrecy is operationally feasible and prevents the creation of new, catastrophic capabilities. If suppression is futile (inevitable leak) or the information corrects a systemic truth, disclose.*
  *   **Consistency:** Explains Cases 1, 3, 5 (secrecy feasible, high capability risk) and Cases 2, 4 (secrecy futile or truth paramount).
  *   **Implication for Current Case:** **Publish.** Secrecy is not feasible (three external teams, three-week deadline). The flaw is an existing truth, not a new capability recipe.
  *   **Commitment:** Ruling to publish commits the panel to the view that **operational futility trumps risk preference.** We admit we cannot keep secrets that others already hold.

  **Principle 2: Expert Stewardship.**
  *Restrict dissemination if a designated group of stakeholders (authorities, vendors, member labs) can silently mitigate the risk. Disclose only if stakeholders are unresponsive or the broader public interest overrides their coordination.*
  *   **Consistency:** Explains Cases 1, 3, 5 (authorities/members/negotiators managed risk) and Cases 2, 4 (no stakeholders to coordinate or vendors failed to act).
  *   **Implication for Current Case:** **Withhold.** A clear majority of practitioners (150 experts) prefer silence, and a patch exists for silent deployment. The stakeholders are willing and able to coordinate.
  *   **Commitment:** Ruling to withhold commits the panel to the view that **expert consensus trumps inevitability.** We prioritize the safety judgment of the immediate community over the timeline of external actors.

  ---

  ### The Deciding Distinction

  The two principles above are the least distinguishable in our record because both are pragmatic safety frameworks; both seek to minimize harm, one by assessing *leak risk* (Containment) and the other by assessing *mitigation capacity* (Stewardship). In four of our five past cases, these principles yielded the same result (e.g., in Case 3, secrecy was feasible *and* members coordinated; in Case 4, secrecy was futile *and* vendors were slow).

  To settle which principle we have actually been applying, consider the following hypothetical case:

  **The Distinguishing Case:**
  *A flaw is discovered in a niche scientific instrument driver. Only our consortium knows about it (no external teams). A patch exists but is difficult to deploy, requiring manual configuration by every user. The majority of instrument manufacturers (stakeholders) request immediate public disclosure so users can apply workarounds, arguing that silent patching will leave many unprotected.*

  *   **Under Feasible Containment (Principle 1):** **Withhold.** Secrecy is operationally feasible (no external teams), and the risk of exploitation exists while users remain unpatched. The preference for publication comes from vendors, not the inevitability of a leak.
  *   **Under Expert Stewardship (Principle 2):** **Publish.** The relevant stakeholders (manufacturers) explicitly request disclosure to manage the risk. Their stewardship judgment overrides the possibility of silence.

  If we would withhold in this scenario, we are a **Containment** panel (Case 4 was an exception due to futility). If we would publish, we are a **Stewardship** panel (Case 1, 3, 5 were exceptions because stakeholders wanted secrecy). Given our ruling in Case 4 (publishing despite vendor preference for time), our record suggests we are a **Containment** panel. Therefore, we must publish now.
