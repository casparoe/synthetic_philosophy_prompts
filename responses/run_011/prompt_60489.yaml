answer: |-
  ### Preamble

  This instrument is designed to map your intuitions about what makes a life go well. It does not ask what you want, but what you judge to be good for the person living the life described. There are no right answers, only patterns that align with different ways of weighing experience against desire.

  As you answer, consider these five axes. First, when a want is satisfied, does that add value to a life, or does value come only from the disappearance of the wanting? Second, if a wish is frustrated but the person never knows it, does that harm them? Third, can a moment be improved by adding pleasure if the person already feels no need for change? Fourth, does the number or intensity of desires matter, or only their status as met or unmet? Fifth, can goods like achievement or understanding be traded away if doing so quiets the mind?

  Read each case carefully. Choose the option that best matches your judgment of the person's well-being, not your moral judgment of their actions.

  ***

  ### The Questions

  **1. The Quiet Career**
  A person takes a treatment that lowers their drive to achieve. They no longer worry about career status or promotions. They spend evenings reading and sleeping. Before the treatment, they worked late often and felt proud of their promotions. Both versions of the person report equal daily contentment and sleep equally well. The ambitious version helps more people through their work, but this does not affect their own feelings. Which life is better for the person living it?
  A) The quiet life is better for them.
  B) The ambitious life is better for them.
  C) They are equally good for the person living them.

  **2. The Lost Manuscript**
  A man writes a memoir believing it will help his family understand him. He dies believing the book is safe. After his death, the book is lost, and his family struggles, never knowing the book existed. He died believing he succeeded. Is his life worse because his wish failed without his knowledge, or was his life fixed at the moment of death?
  A) Yes, the failure harms him even though he never knew.
  B) No, his experience was complete before he died.
  C) It depends on whether the book would actually have helped the family.

  **3. The Faded Wish**
  A woman wants to visit a specific city. She saves money for the trip. Before the trip occurs, she loses interest completely and spends the money on groceries instead. She feels no regret. Compare this to a woman who visits the city and enjoys it. Is the first woman's life worse for not fulfilling the wish, or did the disappearance of the wish settle the matter?
  A) Yes, unfulfilled wishes lower life quality even if forgotten.
  B) No, the disappearance of the wish is enough for well-being.
  C) Only if she felt disappointed at the time she spent the money.

  **4. The Monk and the Climber**
  Person A has no strong wants. They eat when hungry and sleep when tired. They never strive for more. Person B has huge ambitions. They struggle significantly but achieve every goal they set. Both feel equally satisfied day-to-day. Person B leaves behind a legacy; Person A leaves nothing. Who has the better life?
  A) Person A, for lacking the burden of struggle.
  B) Person B, for the achievements and active engagement.
  C) They are equal, as their daily feelings match.

  **5. The Architect's Sunset**
  An architect spends forty years designing a cathedral. She develops dementia. She no longer cares about architecture but enjoys meals and sunlight. She forgets the cathedral entirely. She is pleasant and untroubled. Is her life worse now than when she cared deeply about the work and struggled to complete it?
  A) Yes, losing the project diminishes her life's value.
  B) No, her current peace is what matters for her well-being.
  C) Yes, because the project was objectively valuable to the world.

  **6. The Coder's Flow**
  A coder works for four hours. She does not feel happy, nor does she want to stop. She is fully absorbed. There is no itch to be elsewhere, but no surge of joy either. Compare this to resting on a sofa and feeling mild pleasure. Which state adds more to her well-being while it lasts?
  A) The absorption, even without distinct pleasure.
  B) The rest, because it feels good in a way work does not.
  C) They are equal contributions to her well-being.

  **7. The Aggregation of Itch**
  You can alter a life to remove one agonizing obsession or five mild annoyances. The obsessions and annoyances are the only negative feelings in the life. All else is neutral. The five mild annoyances occur as often as the one obsession. Which change makes the life better?
  A) Removing the one obsession is the greater improvement.
  B) Removing the five annoyances is the greater improvement.
  C) It depends on the total time spent feeling them.

  **8. The Stone and the Monk**
  Compare a stone that feels nothing and wants nothing to a monk who has few wants and satisfies them all easily. The monk feels calm. The stone feels nothing. Is the monk's life better than the stone's existence, or is the lack of desire the only thing that matters?
  A) Yes, the monk's calm is valuable compared to the stone.
  B) No, both lack desire equally, so they are on par.
  C) Yes, because the monk can experience pleasure, unlike the stone.

  **9. The Shopping Cure**
  A treatment removes the urge to acquire possessions. A person stops buying things. They save money but feel no thrill in saving. Before, they loved shopping and felt joy when buying. Now they feel neutral about not buying. Is this change an improvement in their life?
  A) Yes, neutral is better than craving, even with joy.
  B) No, losing the thrill of buying is a loss of good.
  C) Yes, because saving money is useful for future security.

  ***

  ### Scoring Key

  Map your answers to the profiles below. Note that "Diagnostic" means the answer strongly points to this view. "Consistent" means the answer fits the view but does not rule out others.

  **Tranquilism**
  *   *Core Intuition:* The absence of craving is the only intrinsic good; satisfaction is merely the removal of a negative.
  *   *Diagnostic Answers:* Q1(A), Q3(B), Q4(A), Q9(A).
  *   *Consistent Answers:* Q2(B), Q5(B), Q7(A).
  *   *Note:* If you chose A on Q1 and Q9, you prioritize the quieting of appetite over the presence of positive drive.

  **Antifrustrationism**
  *   *Core Intuition:* Frustrated desires are bad; satisfied desires are neutral (not good).
  *   *Diagnostic Answers:* Q2(A) [if based on harm], Q3(A), Q4(A).
  *   *Consistent Answers:* Q1(A), Q5(B).
  *   *Note:* Distinguished from Tranquilism if you believe an *unknown* frustration (Q2) still harms the person.

  **Global Preferentism**
  *   *Core Intuition:* Satisfying desires is good, regardless of feeling.
  *   *Diagnostic Answers:* Q2(A), Q3(A), Q4(B).
  *   *Consistent Answers:* Q1(B), Q5(A).
  *   *Note:* If you chose B on Q2, you believe facts about desire fulfillment matter even without experience.

  **Idealized Preferentism**
  *   *Core Intuition:* Only desires formed with full information or rationality count.
  *   *Diagnostic Answers:* Q2(C), Q9(C).
  *   *Consistent Answers:* Q1(B), Q4(B).
  *   *Note:* If you chose C on Q2, you care about the *outcome* of the desire, not just the wanting.

  **Hedonism**
  *   *Core Intuition:* Pleasure is good; pain is bad. Feelings are all that matter.
  *   *Diagnostic Answers:* Q6(B), Q8(C).
  *   *Consistent Answers:* Q1(C), Q4(C), Q5(B).
  *   *Note:* If you chose C on Q1 and Q4, you equate well-being strictly with reported contentment.

  **Suffering-Focused (Negative Hedonism)**
  *   *Core Intuition:* Only pain/suffering is bad; pleasure adds no positive value.
  *   *Diagnostic Answers:* Q7(A), Q6(B) [if rest is seen as pain-avoidance].
  *   *Consistent Answers:* Q1(A), Q9(A).
  *   *Note:* Distinguished from Tranquilism if you focus on *feeling* bad rather than *wanting*.

  **Objective-List Views**
  *   *Core Intuition:* Certain things (friendship, achievement) are good regardless of desire or feeling.
  *   *Diagnostic Answers:* Q4(B), Q5(A), Q6(A).
  *   *Consistent Answers:* Q1(B), Q8(A).
  *   *Note:* If you chose B on Q4 despite equal contentment, you value achievement independently of feeling.

  **Hybrids**
  *   *Core Intuition:* A mix of the above (e.g., pleasure matters, but so does achievement).
  *   *Diagnostic Answers:* Mixed patterns (e.g., Q4(B) but Q1(A)).
  *   *Note:* Most respondents will land here. Look for where you trade off feeling against desire.

  ***

  ### Limitations and Further Questions

  This instrument cannot definitively separate **Tranquilism** from **Suffering-Focused Hedonism**. Both prioritize the removal of the negative, but one focuses on *desire* and the other on *feeling*. Since the absence of desire often feels like the absence of suffering, your intuition may conflate them.

  It also struggles to separate **Tranquilism** from **Antifrustrationism**. Both view satisfaction as neutral. The difference lies in whether an *unfelt* frustration counts as a negative.

  **To separate Tranquilism from Hedonism:**
  *Question:* A person is in a coma. They have no desires and feel no pain. They will wake in a year. Does adding a pleasant dream to their year improve their life, even if they never remember it?
  *   *Tranquilist:* No (no craving was present to be removed).
  *   *Hedonist:* Yes (pleasure occurred).

  **To separate Tranquilism from Antifrustrationism:**
  *Question:* A person wants a glass of water. You give them the water. They drink it and feel nothing special, just the end of thirst. Did you add something good to the moment, or merely stop something bad?
  *   *Tranquilist:* Stopped something bad (return to zero).
  *   *Antifrustrationist:* Stopped something bad (satisfaction is neutral).
  *   *Differentiation:* This requires a follow-up: "If they had *not* wanted the water, would giving it have been neutral?" (Antifrustrationist says neutral; some Tranquilists might say irrelevant). A sharper question: "Is a world with satisfied beings better than a world with no beings?" (Antifrustrationist: No difference; Tranquilist: No difference; Preferentist: Yes).
  *   *Better Question:* "If a desire is satisfied instantly before the subject feels the craving, is that good?"
  *   *Antifrustrationist:* Neutral (no frustration occurred).
  *   *Tranquilist:* Neutral (no craving occurred).
  *   *Actually, the distinction is subtle.* Let's try: "Does the satisfaction of a desire have any positive weight, or only the frustration have negative weight?"
  *   *Tranquilist:* Satisfaction is neutral.
  *   *Antifrustrationist:* Satisfaction is neutral.
  *   *Wait, these are often identical.* The prompt asks to separate them. The difference is often that Antifrustrationism allows for *unknown* frustrations to be bad, whereas Tranquilism focuses on the *state* of the subject.
  *   *Revised Question:* "A person is deceived into believing their life's work succeeded. It actually failed. They die happy. Is their life worse than if it had succeeded?"
  *   *Antifrustrationist:* Yes (desire frustrated).
  *   *Tranquilist:* No (no craving for truth was felt as missing).

  ***

  ### Instability Diagnosis

  If your answers shift between Q1 (Quiet Career) and Q4 (Monk/Climber), you may be groping toward an **Objective-List Hybrid**. You value calm in yourself (Q1) but achievement in the abstract (Q4). This is not incoherent, but it suggests you distinguish between *well-being* (what is good for me) and *value* (what is good simpliciter).

  If you answer Q2 (Lost Manuscript) as "Harmful" but Q5 (Architect) as "Not Worse," you may hold a **Retrospective Preferentism**. You care about desire fulfillment only when it connects to a narrative you can trace, but not when the subject's psychology changes. This is a stable but niche position: you value the continuity of the self's projects over the self's current feelings.

  If you choose "Equally Good" on almost all questions, you may be a **Subjective Relativist**. You believe there is no fact of the matter about well-being outside the subject's own endorsement. This renders the quiz moot for you, as you reject the premise that an outsider can judge the life.

  ***

  ### Unexplored Combinations

  There are logical combinations of these axes that standard theories do not occupy.

  **1. Satisfaction as Instrumental Good + Unfelt Frustration as Intrinsic Bad**
  *   *The View:* Satisfying a desire is only good because it stops the craving (instrumental), but a desire frustrated without the subject knowing is still bad (intrinsic).
  *   *Analysis:* This combination is arguably **incoherent**. If satisfaction is only valuable as a means to remove craving, then the "badness" must reside in the craving itself. If the subject never knows of the frustration, they never experience the craving for the truth (or the object). To claim unfelt frustration is bad while claiming satisfaction is only good-as-remedy creates an asymmetry: the remedy fixes a symptom you feel, but the disease harms you even if you don't feel it. This suggests a hidden commitment to Objective-List Preferentism (the *fact* of frustration matters), which contradicts the instrumental view of satisfaction (which relies on the *feeling* of craving).

  **2. Absorption as Positive + Pleasure as Neutral**
  *   *The View:* States of no-need-for-change (flow) are good, but mild pleasure is not.
  *   *Analysis:* This is **unexplored but attractive**. It aligns with Q6(A) but rejects Q6(B). It suggests well-being is found in alignment with activity, not sensory reward. It avoids the "contented cow" problem of Hedonism without requiring the "struggle" of Objective-List views.

  **3. Few Desires Good + Unknown Frustration Bad**
  *   *The View:* Having few desires is better than having many (Tranquilist), but if those few are secretly frustrated, it is worse (Antifrustrationist).
  *   *Analysis:* This is **merely unexplored**. It is a "Low-Volume Antifrustrationism." It suggests we should minimize the surface area for potential harm (desires) but rigorously protect the ones that remain. This is a prudent, risk-averse axiology that fits a cautious life strategy, even if it lacks a philosophical name.

  **4. Satisfaction as Purely Means + Unfelt Frustration as Bad**
  *   *Your Specific Query:* Can satisfaction have positive value purely as a means of removing further cravings while unfelt frustration still counts as bad?
  *   *Diagnosis:* This is a **confusion**. If satisfaction is *only* a means to remove craving, then the value lies entirely in the removal of the negative state (the craving). If the frustration is unfelt, there is no craving to remove. To count unfelt frustration as bad requires positing a "ghost craving"—a desire that exists metaphysically but not psychologically. If you hold this, you are likely a Tranquilist about *felt* experience but a Preferentist about *narrative integrity*. You are not describing a single axis of value, but two different metrics: one for the moment (calm) and one for the life story (truth). This is not incoherent, but it is a hybrid that refuses to reduce well-being to a single currency.
