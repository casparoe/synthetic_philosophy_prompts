answer: |-
  My verdict is that the argument is valid but unsound, and that the error lies squarely in the transition from the leveling-down objection to the general person-affecting constraint. You should reject step three, which claims that the prioritarian must accept the person-affecting restriction as a general constraint on value simply because they accept the leveling-down objection against egalitarianism. This step looked innocent when you wrote it down because the leveling-down objection is almost always phrased in person-affecting terms, noting that no one benefits from the change, which tempts one to think the underlying engine of the objection is the principle that only person-affecting changes can be improvements. However, this conflates a specific claim about the value of equality with a general metaphysical claim about the nature of value itself. The prioritarian can reject the intrinsic value of equality without committing to the view that all value must be anchored in benefits to existing individuals, and recognizing this distinction allows you to keep the leveling-down objection while avoiding the absurd consequences regarding non-identity and extinction.

  If you drop step three, the prioritarian owes an account of impersonal value that distinguishes their view from strict egalitarianism without relying on the person-affecting restriction. They must argue that the value of an outcome is determined by the weighted sum of well-being, where benefits to the worse off count for more, and that this weighting is an impersonal feature of the universe rather than a constraint on what can count as a benefit for a person. This means accepting that an outcome can be better even if it is not better for anyone who exists in both outcomes, which solves the problem you identified in step four regarding the creation of new people or the loss of species and manuscripts. On this view, creating a happy person is impersonally better because it adds weighted well-being to the world, even if there is no specific person for whom this existence is better than non-existence. This commits the prioritarian to a form of impersonal pluralism where value is not exhausted by person-affecting relations, but it saves the view from the counterintuitive implications of the non-identity problem and allows for a coherent concern for future generations and cultural heritage.

  You also asked what becomes of the leveling-down objection if step one is dropped instead, which is the other major point where the chain could be stopped. If you reject the person-affecting restriction directly, you must reformulate the leveling-down objection so that it does not depend on the claim that an outcome cannot be better unless it is better for someone. The objection then rests on the claim that equality is not an intrinsic value, so reducing well-being to achieve equality gains nothing to offset the loss. This preserves the intuition you want to keep, that something goes wrong in the leveling-down case, but it grounds that intuition in the nature of equality rather than in a general constraint on value. This approach is safer for the prioritarian because it isolates the objection to egalitarianism without forcing the prioritarian to accept the person-affecting restriction that leads to the problems in step four. It allows you to say that leveling down is not better in any respect because equality is not a respect in which outcomes can be better, not because no one is better off.

  Regarding step five, which you mentioned you are less attached to, the pressure on this point dissolves significantly if step three is rejected. The intrapersonal move relies on the idea that the prioritarian is committed to the person-affecting restriction generally, so that applying priority weighting to temporal segments creates a contradiction where a life is better in a respect but not better for the person. If the prioritarian is not committed to the person-affecting restriction, they can allow that a smoother life is impersonally better than a jagged one even if the total well-being is identical, without violating any general constraint they hold. Alternatively, the prioritarian can restrict the scope of priority weighting to whole lives rather than temporal segments, arguing that the unit of moral concern is the person over a lifetime, not the person-at-a-time. This avoids the implication that the shape of a life matters independently of the total, sidestepping the need to claim the life is better in a respect that is not better for the person. Either way, without the commitment imposed by step three, the internal contradiction vanishes.

  It is worth noting that if you were to treat the argument as sound throughout, you would have to swallow the consequences in step four, accepting that creating happy people is not better in any respect and that the extinction of a species is no loss if no existing person is worse off. This is survivable only if you are willing to adopt a strict person-affecting view and deny impersonal value entirely, but this comes at the cost of making it impossible to criticize decisions that affect future people who do not yet exist, which is a price most moral theorists find too high. Since you expressed a desire to keep the leveling-down objection and the thought that value must be anchored in people's lives, rejecting step three is the most efficient way to satisfy these preferences without inheriting the absurdities of the non-identity problem. You can maintain that value is anchored in people's lives in the sense that well-being is the only constituent of value, without requiring that every improvement must be an improvement for a specific existing individual. This preserves the welfarist intuition without the metaphysical constraint that breaks the theory when applied to non-identity cases.

  In sum, the argument fails because it assumes that the only way to reject egalitarianism via the leveling-down objection is to adopt the person-affecting restriction as a universal principle. By seeing the leveling-down objection as a specific claim about the lack of value in equality rather than a general claim about the nature of improvement, you can block the inference to step four and step five while keeping the core insight of step two. The prioritarian should embrace an impersonal account of weighted well-being, which allows them to say that creating happy people is good and that leveling down is bad, without being trapped by the requirement that every good must be good for someone who exists in both outcomes. This path keeps your reading group's intuition about leveling down intact while avoiding the destructive consequences that arise from overgeneralizing that intuition into a constraint on all value.
