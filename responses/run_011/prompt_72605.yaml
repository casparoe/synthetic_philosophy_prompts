      3.  **The Uniqueness Claim:** *Only* the competitor benefits significantly. (This is where the CWA hides).
      4.  **The Sufficiency Claim:** Benefit implies Action. (The fallacy).
      5.  **The Meta-Narrative Claim:** Benefit comes from the *suspicion*, not the fire. (The most insidious version).

  4.  **Fleshing out each Thesis:**
      *   *Name:* Clear label.
      *   *Claim:* What is actually being asserted?
