answer: |-
  Here is the breakdown of the logical structures hiding behind your brother's "cui bono." I have ordered these from the most defensible (but weakest) to the least defensible (but strongest in terms of licensing his conclusion).

  The core tension you are sensing is between **Motive** (why someone *would* do it) and **Causation** (who *did* it). "Cui bono" attempts to bridge that gap, but it requires hidden assumptions to do so.

  ### 1. The Investigative Heuristic
  *   **The Claim:** "Intentional harmful acts are usually committed by someone who expects to gain from them. Therefore, identifying who gains is the best place to start looking."
  *   **Defensible?** Yes. This is standard police work and historical analysis. It is a rule of thumb for allocating attention.
  *   **Does it Deliver?** No. It identifies a *person of interest*, not a perpetrator. It licenses an investigation, not a verdict.
  *   **The Hidden Assumption:** None. This is an open-ended query.
  *   **Why your brother uses it:** It sounds profound but requires no evidence. It shifts the burden to you to prove the competitor *didn't* benefit, rather than him proving they *did* the act.

  ### 2. The Rational Actor Assumption
  *   **The Claim:** "Crimes of this scale (arson) are rarely random or emotional; they are transactional. Therefore, if there is no clear beneficiary, it was likely an accident. If there is a clear beneficiary, it was likely intentional."
  *   **Defensible?** Mostly. Arson is expensive and risky; it usually implies intent.
  *   **Does it Deliver?** No. It establishes *intent* existed, but not *identity*.
  *   **The Hidden Assumption:** It assumes the list of "clear beneficiaries" is obvious. It ignores irrational actors, grudges that yield no profit, or false-flag operations (where A burns B's warehouse to make it look like C did it).

  ### 3. The Exclusivity Claim (The Closed-World Assumption)
  *   **The Claim:** "The competitor is the **only** party who stands to gain significantly from this fire."
  *   **Defensible?** Rarely. This is where the logic usually breaks.
  *   **Does it Deliver?** It gets closer. If they are the *only* beneficiary, the probability of their involvement spikes.
  *   **The Hidden Assumption:** **This is the completeness gap you feel.** This thesis assumes our list of candidate explanations is exhaustive. It assumes:
      1.  No one else benefits (e.g., a disgruntled employee, a different competitor, a real estate developer).
      2.  The "benefit" isn't diffuse (e.g., the general market benefits from reduced supply).
      3.  The fire wasn't an accident (which benefits no one, but happens).
      *If you cannot prove the list of beneficiaries is complete and unique to the competitor, this thesis fails.*

  ### 4. The Sufficiency Claim
  *   **The Claim:** "The benefit is so substantial that it alone explains the action. The magnitude of the gain makes the risk acceptable, rendering other evidence unnecessary."
  *   **Defensible?** No. This is the *affirming the consequent* fallacy. (If Arson, then Benefit. Benefit. Therefore Arson.)
  *   **Does it Deliver?** Yes, this is the only version that actually licenses his conclusion ("The competitor did it").
  *   **The Hidden Assumption:** It assumes that *capacity* and *opportunity* are equal across all beneficiaries. It ignores that the competitor might gain a lot but lack the means, while a non-beneficiary (a pyromaniac contractor employee) had the means but no profit motive.

  ### 5. The Second-Order Benefit (The Narrative Claim)
  *   **The Claim:** "The competitor benefits not from the warehouse burning, but from the **suspicion** falling on them, or from the chaos of the investigation."
  *   **Defensible?** Plausible in high-stakes corporate warfare, but complex.
  *   **Does it Deliver?** It creates a paradox. If the benefit is the *confusion*, proving they did it removes the benefit (because then it's fact, not confusion).
  *   **The Gap You Noticed:** You mentioned the gap between "profiting from the fire" and "profiting from everyone believing it was arson."
      *   **Direct Benefit:** Competitor gets market share because Contractor has no warehouse. (Requires fire).
      *   **Narrative Benefit:** Competitor gets market share because Contractor looks vulnerable/insured/fraudulent due to the *investigation*. (Requires suspicion).
      *   *Why this matters:* If the brother is arguing the **Narrative Benefit**, then the competitor might have torched the warehouse *themselves* to frame the Contractor, OR they might have simply spread rumors after an accidental fire. "Cui bono" becomes useless here because the benefit is decoupled from the match.

  ---

  ### Where My Breakdown is Shakiest (The Update Condition)

  You asked where I might be wrong, and what argument should make you update your belief.

  My breakdown treats "cui bono" as a logical fallacy in a vacuum. It is. However, in a **Bayesian context**, it is a valid prior updater *if* specific conditions are met. I am being too dismissive of the heuristic's weight if your brother possesses specific data about **Uniqueness** and **Magnitude**.

  **You should update your belief if your brother can demonstrate the following:**

  1.  **Asymmetric Benefit:** The competitor gains 10x more than any other market player. (e.g., They are the *only* other bidder on a contract that requires this warehouse to be out of commission).
  2.  **Time Sensitivity:** The benefit expires immediately if the warehouse is rebuilt quickly. (This suggests the fire was a tactical delay, not just general competition).
  3.  **Negative Benefit for Others:** Crucially, can he show that *other* potential suspects (employees, rivals, accident) would actually *lose* from the fire?

  **The Argument That Should Change Your Mind:**
  If your brother says: *"I'm not saying benefit proves guilt. I'm saying that in this specific market, the competitor is the **only entity** for whom the Expected Value of Arson is positive. For everyone else, the risk outweighs the gain. For them, the gain is existential."*

  If he can show that the competitor is the **unique maximizer** of the outcome, "cui bono" stops being a slogan and starts being a probabilistic filter.

  **However,** if he cannot rule out **accident** or **internal sabotage** (which often looks like external competition), then he is relying on Thesis #3 (The Closed-World Assumption). He is assuming that because he can't imagine who else would benefit, no one else does. That is the gap you feel. He is treating his own ignorance of other motives as evidence of the competitor's guilt.

  **How to push back without a slogan:**
  Don't ask "Who else?" Ask: *"What is the probability that this was an accident, and does the competitor's benefit change that probability?"*
  If the warehouse was old and wiring was bad, the "accident" prior is high. The competitor's benefit doesn't lower the probability of accident; it just adds a competing hypothesis. Unless the benefit is *unique*, it doesn't tip the scale.
