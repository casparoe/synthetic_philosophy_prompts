answer: |-
  Dear colleague,

  Your position is a compelling one because it turns the tables on the critic by attacking the genealogy of their objections rather than the substance of the normative theory itself. By arguing that the demandingness objection relies on intuitions corrupted by the specific self-interest of affluent agents in imperfect societies, you align yourself with a robust tradition of skeptical inquiry in metaethics. However, since you have asked for pressure testing specifically regarding the vulnerabilities of this debunking move, I will outline the challenges that threaten to undermine it, ordering them from the most devastating to the merely inconvenient, so you can see where the structural weaknesses lie.

  The most fatal challenge you face is the problem of self-defeat through overgeneralization. If you argue that moral intuitions are unreliable when they emerge from circumstances that align with the agent's self-interest, you must explain why the intuitions supporting consequentialism are exempt from this same scrutiny. Consequentialism often appeals to intuitions about impartiality, the equal weight of interests, or the badness of suffering, yet these too are held by situated agents who may find comfort in a universalizing theory that absolves them of local tribal loyalties or validates their cosmopolitan outlook. If the genealogical debunking argument is strong enough to erase the evidential weight of commonsense permissions, it risks being strong enough to erase the evidential weight of the theoretical intuitions that recommend consequentialism in the first place. You rely on the intuition that a view is unmotivatedly revisionary to be a vice, but if commonsense is corrupted, revisionarity might be a virtue, or at least neutral. Yet if you discard all intuitions as potentially corrupted by circumstance, you are left with no epistemic ground to stand on to claim that consequentialism is true rather than just another theory preferred by a different set of situated agents. This is not merely a request for clarification but a threat of total collapse, for if your debunking principle applies universally, it debunks your own justification for accepting the normative theory you are defending.

  A less fatal but still serious difficulty concerns the empirical claim about who holds these intuitions. Your argument hinges on the premise that these permissions are specific to comfortable agents living in societies with weak safety nets. If empirical investigation were to show that these intuitions are universal across economic and social strata, your explanation would lose its force. For instance, if subsistence farmers in developing nations or individuals in high-welfare states with robust aid channels still maintain that they are not required to sacrifice everything for distant strangers, then the intuition cannot be explained away as a product of affluent self-interest in a specific institutional context. It would suggest that the intuition tracks something deeper about human agency, perhaps epistemic limitations regarding causal efficacy or the psychological necessity of personal projects, rather than mere selfishness. You should concede that if cross-cultural psychological data demonstrates the universality of these permissions regardless of wealth or safety net reliability, your specific genealogical explanation fails. You would then need a different argument for why these universal intuitions are still mistaken, which would move you away from the debunking strategy and back into normative argumentation, weakening your claim that the objection begs the question.

  Closely related to the empirical challenge is the dependency of your view on controversial metaethical premises. You are leveraging a style of argument common in evolutionary debunking arguments against moral realism, but those arguments are themselves heavily contested. Many philosophers argue that even if an intuition has a causal explanation rooted in self-interest or evolution, that does not necessarily sever its connection to moral truth, unless one assumes a robust form of moral realism that requires independence from human psychology. If moral truth is constructed from or linked to human interests and capacities, then the fact that an intuition serves the interests of agents might be a reason to trust it, not doubt it. By tying the defense of consequentialism to a specific and disputed metaethical framework, you make your normative position hostage to outcomes in a different field of philosophy. This is not fatal, as you can argue for the metaethics, but it is a significant burden that complicates the defense. You are no longer just arguing that consequentialism is right, but that a specific skeptical metaethics is correct, and if that metaethics falls, your defense of consequentialism loses its sharpest weapon.

  Finally, there is the awkward matter of losing the metric for revisionarity. One of the traditional strengths of consequentialism is its claim to systematize and sometimes correct commonsense morality without being arbitrarily revisionary. If you successfully debunk commonsense morality as entirely untrustworthy in this domain, you lose the ability to claim that consequentialism is a reflective equilibrium rather than a radical imposition. This leaves your position floating without an anchor to human moral experience. It does not prove the view false, but it makes it harder to recommend to others, as you are asking them to accept a theory that contradicts all their settled judgments on the grounds that those judgments are corrupt. This is merely awkward because a theory can be true even if it is hard to sell, but it does limit the persuasive power of your position and may isolate it from the very practice of moral reasoning it seeks to guide.

  Regarding what you should concede, you must plainly admit that if the intuitions in question are shown to be universal rather than specific to the affluent, your genealogical explanation is empirically false. You should also concede that your argument relies on a metaethical premise that is not universally shared, meaning your defense is not self-contained within normative ethics. The self-defeat objection is harder to concede fully without abandoning the view, but you must acknowledge that you need a principled way to distinguish which intuitions are corrupted and which are not, otherwise you risk the skepticism that undermines your own position.

  In closing, I must offer an honest assessment of whether your position has been qualified into immunity. There is a genuine risk here that your view becomes dogmatic by treating any counter-intuition as evidence of bias rather than evidence against the theory. If every objection based on commonsense morality is dismissed as a product of corrupt circumstances, the theory becomes unfalsifiable by intuition, which is a defect in a philosophical thesis unless accompanied by independent grounds for truth. However, immunity of this kind is not necessarily a defect if it is correctly identified as a feature of exposing systematic bias. If you can provide independent reasons to think affluent intuitions are skewed without undermining all intuitions, then the immunity is a protective measure against error rather than dogmatism. The challenge is to walk the line where you are skeptical enough to expose the bias but not so skeptical that you lose the ability to justify your own claims. If you can maintain that balance, the position is robust; if you cannot, it risks becoming a closed system that speaks only to itself.
