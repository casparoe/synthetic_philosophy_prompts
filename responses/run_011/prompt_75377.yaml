answer: |-
  1. You accept Williamson's margin-for-error premise for feeling cold, but reject it for believing that *p*. Is your core claim that margin principles are only justified for states admitting degrees, while propositional attitudes are all-or-nothing?

  2. So when the argument targets belief rather than coldness, which premise fails? And what makes belief different enough from coldness to block the margin principle there but not one level up?

  3. Plausibly, belief comes in degrees—credences, confidence levels, half-doubt. If belief is magnitude-sensitive in those ways, isn't your distinction drawing the line exactly where you need it to save KK?
  [Likely Reply: Full belief is binary; credences are distinct states. | Follow-up: But if the binary state shifts across nearby credence cases, don't you still get a margin for error?]

  4. **(Standard Version)** Suppose you keep the distinction. Does restricted KK actually block the regress or underwrite first-person authority, or is the domain too narrow to do the work internalists wanted?
  [Likely Reply: It saves the core cases of reasoning and assertion. | Follow-up: But if reasoning relies on credences, haven't you saved the shell but lost the engine?]

  **(SWAP VERSION for Q4)** *Use this only if she denies in Q3 that the gradable/non-gradable distinction is doing metaphysical work.*
  If the gradable/non-gradable distinction isn't doing metaphysical work, is there any independent reason to think belief escapes the margin principle other than saving KK?
  [Likely Reply: The phenomenology of judgment is categorical. | Follow-up: But doesn't Williamson's argument target reliability, not phenomenology?]

  5. You say counterexamples involve indeterminate states. But imagine a subject with a flat-out determinate belief who is disposed to avow not-*p* for months. By your lights, is that a counterexample or just outside the domain?
  [Likely Reply: That isn't a determinate belief. | Follow-up: Then doesn't 'determinate' just mean 'known to the subject'?]

  6. Finally, what would count as evidence against restricted KK, and what have you given up by conceding luminosity for magnitude-sensitive states, since that's most of what we ordinarily mean by self-knowledge?
