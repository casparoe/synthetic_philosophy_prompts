answer: |-
  Here is a design for the session. It is calibrated to be tight, high-stakes, and structurally coercive towards the regress without your verbal intervention.

  ### 1. Materials and Setup

  **Room:** One large table or four clustered tables.
  **Students:** 16 (4 groups of 4).
  **Handouts per group:**
  1.  **The Chain Task:** A four-stage logic puzzle. Stage 1 generates a number, Stage 2 converts it, Stage 3 decodes it, Stage 4 writes the final answer. (Keep it solvable but non-trivial; 10 minutes is the limit).
  2.  **Four 'Capacity Envelopes':** Sealed before class. Inside each is a 'Trait Card'.
      *   *Card A:* "Natural Aptitude: You solve Stage 1 twice as fast."
      *   *Card B:* "Anxiety: You must pause for 30 seconds before passing your work on."
      *   *Card C:* "Precision: If Stage 2 is wrong, you automatically spot it. If not, you don't."
      *   *Card D:* "Fatigue: You write 50% slower at Stage 4."
      *   *(Note: These represent the 'how you are' factors—luck, biology, conditioning.)*
  3.  **The Allocation Sheet:** A single slip of paper with the scoring rule and a blank table for names and points.
  4.  **The Stakes Notice:** A printed card stating: "1 Point = 1 Minute off the Departmental Tidying Rota. Unallocated points are void. The two students with the lowest scores share next week's duty."

  **Preparation:**
  Place the four envelopes face down at each table. Do not let students open them until you speak.

  ### 2. Timing (75 Minutes)

  *   **00:00 – 00:05:** Seating and distribution. (Silent).
  *   **00:05 – 00:08:** Facilitator Script (The only words you speak).
  *   **00:08 – 00:23:** The Task and The Allocation. (You sit at the front, reading. Do not circulate. If a hand goes up, shake your head gently).
  *   **00:23 – 00:30:** Collection of Allocation Sheets. (Do not look at them yet).
  *   **00:30 – 01:15:** Debrief and Lecture (Strawson's Basic Argument).

  ### 3. The Facilitator Script

  You must memorise this. Do not ad-lib. Do not elaborate.

  > "Open your envelopes, complete the chain task, and then allocate the 100 points according to the Rule of Authorship on your sheet.
  > I will not answer questions about the rules or the task.
  > Begin."

  ### 4. The Engine: The Rule of Authorship

  This text goes on the **Allocation Sheet**. It is the mechanism that generates the regress.

  > **RULE OF AUTHORSHIP**
  > You have 100 points to distribute among your four team members.
  > You may only award points for aspects of the performance that originated **entirely within the agent**.
  > Do not award points for luck, innate talent, prior conditioning, or the quality of the input passed to you by a teammate.
  > If you cannot justify a player's contribution as something they *authored* rather than something that *happened through them*, they receive zero points for that contribution.
  > **Signatures of all four members are required to validate the allocation.**

  ### 5. The Debrief: Mapping the Game to the Argument

  Do not start by explaining Strawson. Start by projecting the Allocation Rules on the screen. Ask the following questions in order. Let the silence do the work.

  **Phase 1: The Causal Chain (0–10 mins)**
  *   "Look at the Chain Task. Student 2 could not succeed if Student 1 failed. Did Student 2 deserve points for Student 1's success?"
  *   *Expected consensus:* No. That was input, not their doing.
  *   *Link:* This establishes that we are not responsible for our causal starting points.

  **Phase 2: The Capacity Envelopes (10–25 mins)**
  *   "Look at your Trait Cards. Student A had 'Natural Aptitude'. Student B had 'Fatigue'. Did Student A deserve points for their speed?"
  *   *Expected consensus:* No. That was luck/biology.
  *   "So we strip away the traits. What is left?"
  *   *Expected consensus:* Effort. Willingness. Choice.
  *   *Link:* This mirrors the intuition that responsibility requires control over one's actions.

  **Phase 3: The Regress (25–40 mins)**
  *   "Apply the Rule of Authorship to 'Effort'. Why did Student B try hard despite 'Fatigue'?"
  *   *Students will say:* "Because they chose to."
  *   "Did they choose their capacity to make that choice? Did they author the part of their mind that values diligence over rest?"
  *   *Pause.* Let the discomfort land.
  *   "If you didn't choose your capacity to choose, can you claim authorship under the Rule you just signed?"
  *   *Link:* This is Step 2 of Strawson's Basic Argument. To be responsible for your actions, you must be responsible for your nature (your capacity to choose).

  **Phase 4: The Impossible Demand (40–50 mins)**
  *   "Was there a valid way to allocate the points?"
  *   *Reality:* No. If they followed the rule strictly, everyone gets 0. If they allocated points, they violated the rule.
  *   "You were asked to do something impossible. To be morally responsible in the way the game demanded, you would have to be *causa sui* (cause of yourself)."
  *   *Link:* Introduce Strawson's conclusion. True moral responsibility requires self-creation, which is logically impossible.

  **Phase 5: Strawson's Text (50–75 mins)**
  *   Now distribute the paper. The students now have the phenomenological experience of the argument. Read the premises of the Basic Argument together. They will recognise the structure from the game.

  ### 6. Troubleshooting: What Will Go Wrong

  **1. The "I Still Chose" Objection**
  *   *The Scenario:* A student insists, "It doesn't matter about my brain chemistry; I *willed* it. That's enough."
  *   *The Recovery:* Do not argue. Turn to the class. "The Rule of Authorship requires the origin to be *entirely* within the agent. If the will itself is a product of genetics and environment, is the origin entirely within? Or is the will just another link in the chain?"
  *   *Why:* This forces them to see that 'will' is not a magic stopper; it is just another state of being that requires explanation.

  **2. Collusion (The 25/25/25/25 Split)**
  *   *The Scenario:* To avoid conflict, they split points equally and sign.
  *   *The Recovery:* In the debrief, ask: "Did you allocate based on desert, or peace-keeping?" If peace-keeping, ask: "If you believe one person did more, is it fair to lie on the sheet?"
  *   *Why:* This highlights the tension between our social practices (egalitarianism) and our metaphysical intuitions (desert). It shows we *act* as if people are responsible, even if we can't justify it.

  **3. Hostility**
  *   *The Scenario:* The stakes (tidying) make students angry at the 'Fatigue' card holder who slowed them down.
  *   *The Recovery:* Acknowledge the emotion. "Your anger is data. You feel they *should* have overcome the card. Why? If the card was a physical handicap, why is a mental one different?"
  *   *Why:* This exposes the intuition that mental states are 'up to us' in a way physical states are not—the very intuition Strawson attacks.

  **4. Confusion/Paralysis**
  *   *The Scenario:* They spend 15 minutes arguing about the rules and don't finish the task.
  *   *The Recovery:* Accept the failure. "The inability to agree on the allocation *is* the lesson. The rule breaks the practice."
  *   *Why:* It demonstrates that the concept of 'ultimate responsibility' is unworkable in practice.

  ### 7. Limitations: What the Game Cannot Do

  Be frank with your students (and yourself) about where the simulation ends and the philosophy must begin.

  1.  **Empirical vs. A Priori:** The game relies on the *feeling* that traits (cards) are luck. Strawson's argument is logical, not empirical. It holds even if there are no 'Trait Cards'. You must supply the logical rigour in the lecture to show this isn't just about 'bad luck', but about the structure of explanation itself.
  2.  **Determinism Bias:** The cards look like determinism (A causes B). Strawson's argument works even if the universe is indeterministic. Randomness does not grant control. You must explicitly decouple the argument from determinism in the debrief, or they will think compatibilism solves it.
  3.  **The 'Self' as Substance:** The game implies there *is* a self that could have authored the traits, but didn't. Strawson argues there is no such self to be found. You will need to explain that the regress doesn't just go back infinitely; it dissolves the agent entirely.

  This design forces them to live the contradiction before they read the text. When they open Strawson, they will not be reading an abstract puzzle; they will be reading the explanation for why they couldn't distribute those points.
