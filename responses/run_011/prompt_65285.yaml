  The pattern (wider class $\rightarrow$ longer median tenure) is primarily an **artifact of how the classes are counted**. As you widen the class from "hegemon" to "urban-literate society," you simultaneously loosen the definition of "termination." A hegemon ends when it loses dominance; a society ends only when cities vanish. You are not measuring the same event with different precision; you are measuring different events with different thresholds for "death." Additionally, deeper time horizons introduce severe survivorship bias—we only have records of literate societies that lasted long enough to leave records.

