answer: |-
  You've correctly identified that the standard possible-worlds model treats belief like a closed database view, whereas human belief is a stream of transactions. The problem isn't logical omniscience itself; it's that standard logic models *commitment* (what you *should* believe) but you are asking about *responsibility* (what you can be blamed for not believing).

  To capture your verdicts without ad-hocery, we need to shift from a static definition of belief to a **normative management protocol**. Here is the principle that fits your cases best.

  ### The Principle: Bounded Doxastic Responsibility

  **Core Claim:** An agent is irrational only when they refuse to update a belief state *after* a derivation has been made **salient** and **verified** within their **cognitive budget**.

  This splits the problem into three clauses. Each clause is motivated by a specific tension in your list.

  #### Clause 1: The Salience Trigger (The "Distracted Driving" Clause)
  *   **Rule:** You are not required to believe consequences of your beliefs until the inference is brought to your attention.
  *   **Motivation:** This handles your **Distracted Driving** case. You believe $p$ and $p \to q$, but the connection isn't in your active working memory. You are not irrational *now*.
  *   **Verdict on New Case (Asleep):** A sleeping person is not irrational. The Salience Trigger cannot fire without consciousness. They retain *commitments* (dispositional beliefs), but bear no *responsibility* until awake.
  *   **Verdict on New Case (Knowledge Base):** A database storing inconsistent facts is not "irrational"; it is **corrupted**. Irrationality requires an agent capable of noticing and fixing the error. Without a process to check constraints, the concept of rationality doesn't apply.

  #### Clause 2: The Verification Condition (The "Mathematician vs. Two-Line" Clause)
  *   **Rule:** You are only required to believe $q$ if you acknowledge the derivation from $p$ to $q$ as valid. Withholding belief on the *link* protects you from irrationality.
  *   **Motivation:** This resolves the split between your **Mathematician** and **Two-Line Derivation** cases.
      *   **Mathematician:** She believes steps 1–40. She does *not* yet believe "Steps 1–40 imply Theorem." She believes "Steps 1–40 + *Verified Step 41* imply Theorem." She is withholding belief on the *implication*, not the conclusion. Therefore, she is rational.
      *   **Two-Line Case:** The agent reads the derivation *carefully*. This means they have acknowledged the validity of the link ($p \land (p \to q) \vdash q$). Once the link is verified, withholding $q$ is a violation of the protocol.
  *   **Why this isn't ad-hoc:** It treats the implication itself as a belief object. The Mathematician lacks a premise the Two-Line person possesses (confidence in the bridge).
  *   **Verdict on Hidden Contradiction:** Before the one-page derivation, the contradiction is latent (Salience Trigger off). After the derivation, the link is verified (Verification Condition met). Keeping the beliefs is now irrational.

  #### Clause 3: The Capacity Budget (The "Competitive Programmer" Clause)
  *   **Rule:** The "cost" of a derivation is relative to the agent's processing power and role expectations.
  *   **Motivation:** This handles the **Competitive Programmer** and **Child vs. Adult** cases. Rationality is not a fixed threshold; it is efficiency relative to capacity.
      *   **Programmer:** For her, a trivial inference has near-zero cost. Missing it is a resource management failure. It is a "failing" (irrationality relative to her class), even if a normal person would be excused.
      *   **Child:** The cost is high relative to capacity. Excused.
      *   **Goldbach vs. 2+2=5:** The cognitive cost to verify Goldbach exceeds any human budget (Responsibility suspended). The cost to verify 2+2=5 is zero (Responsibility absolute).
  *   **Verdict on "Tax on Smart":** You called this perverse. This clause accepts the perverse conclusion: **Yes, rationality is a tax on being smart.** If you have a GPU, you are responsible for rendering frames faster than someone with an integrated graphics card. If you improve your deduction skills, you expand your budget, which increases your liability. You cannot "go back" to ignorance without incurring a maintenance cost (actively avoiding thought).

  ---

  ### Where This Principle Fails (The Bug Report)

  No model compiles without warnings. Here are the verdicts this principle cannot accommodate or leaves ambiguous:

  1.  **The "Slow Realization" Edge Case:**
      *   *Scenario:* I read the two-line derivation. I say "I need to think about it." I stare at the wall for three hours. I still don't believe $q$.
      *   *Failure:* The principle says I'm irrational immediately after reading. But phenomenologically, belief often lags behind acknowledgment. The principle treats belief as a switch; human belief is often a dimmer. It cannot account for the *time* required to integrate a verified truth.
  2.  **The "Self-Deception" Loophole:**
      *   *Scenario:* I suspect $p$ implies $q$, and $q$ is unpleasant. I deliberately avoid checking the derivation to keep my "Salience Trigger" off.
      *   *Failure:* The principle says I'm rational because I haven't verified the link. But intuitively, *avoiding* the verification is itself irrational. The principle needs a meta-rule about "willful ignorance" that it currently lacks.
  3.  **The "Competence vs. Rationality" Blur:**
      *   *Scenario:* The Competitive Programmer misses a trivial inference.
      *   *Failure:* You said this is a "failing." My principle calls it irrationality relative to capacity. But there is a strong intuition that she is *incompetent*, not *irrational*. Irrationality feels like a structural flaw (believing $A$ and not-$A$); incompetence feels like a performance error. This principle collapses that distinction. If you care about that distinction, this principle is too blunt.

  ### The Hard Choice: Mathematician vs. Two-Line

  You asked me to pick one if they can't both survive. I argued above that they *can* survive via the **Verification Condition** (the Mathematician doesn't believe the implication yet).

  However, if you force a split—if you insist the Mathematician *does* believe the implication holds but just wants to "check the work" anyway—then **you must sacrifice the Mathematician case.**

  **Argument for sacrificing the Mathematician:**
  If she truly believes the premises and truly believes the premises entail the conclusion, then withholding the conclusion is a functional error in her belief system. The "checking" is a procedural safety mechanism, not a doxastic state. If we prioritize the logic of belief over the sociology of math, she is technically irrational (or at least inconsistent), even if we politely excuse her. The Two-Line case is the stronger intuition for what belief *is*; the Mathematician case is about professional *norms*.

  ### Summary for the Data Engineer

  *   **Belief State:** Not a set of worlds. It's a cache.
  *   **Logical Omniscience:** The bug where the cache is assumed to be pre-computed.
  *   **Your Principle:** **Lazy Evaluation with Capacity Constraints.**
      *   Don't compute $q$ until queried or triggered (Salience).
      *   Don't cache $q$ until the dependency chain is validated (Verification).
      *   Throw an exception if you refuse to cache $q$ after validation, unless the compute cost exceeds your hardware specs (Capacity).
  *   **The Cost:** You accept that upgrading your hardware (getting smarter) increases your SLA requirements (you become liable for more inferences).

  This captures your gut verdicts on the bus, the basement window, and the programmer, while admitting that "irrationality" is really just a constraint violation in a resource-bounded system.
