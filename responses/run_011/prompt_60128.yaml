  ### The Thought Experiment: The Andromeda Relay

  **The Setup**
  *   **The Anchor:** You are standing on Earth (Observer $O_0$). Your location is $x=0$. The time is $t=0$.
  *   **The Relay:** A parade of **1,000 observers** ($O_1$ through $O_{1000}$) passes you at this exact moment ($x=0, t=0$).
  *   **The Speeds:** Each observer moves relative to the previous one at **30 m/s** (approx. 108 km/h, a fast car on a highway). $O_1$ moves at 30 m/s relative to you. $O_2$ moves at 30 m/s relative to $O_1$, and so on.
  *   **The Target:** The Andromeda Galaxy, located **2.5 million light-years** away ($D \approx 2.365 \times 10^{22}$ meters). This is a justified astronomical distance, not padding.
  *   **The Event:** A specific event in your personal future: **You drink a cup of coffee 24 hours from now** ($x=0, t=1 \text{ day}$).

  **The Arithmetic: Chaining the Tilt**
  In Special Relativity, the "tilt" of the plane of simultaneity (how much "now" shifts into the future or past at a distance) is governed by the term $\frac{vD}{c^2}$.

  1.  **Velocity Accumulation:** Since each hop is $30 \text{ m/s}$ and $v \ll c$, we can approximate the total velocity relative to Earth linearly without significant relativistic error in the sum (rapidity adds linearly, and for small $v$, rapidity $\approx v/c$).
      $$v_{\text{total}} = 1,000 \times 30 \text{ m/s} = 30,000 \text{ m/s}$$
      This is $0.0001c$ (0.01% the speed of light). This is physically legitimate; it's the speed of a fast probe, built from street-speed hops.

  2.  **The Time Shift (The "Gain"):** We calculate how far into Andromeda's future the final observer's ($O_{1000}$) "now" reaches compared to yours.
      $$\Delta t = \frac{v_{\text{total}} \cdot D}{c^2}$$
      $$\Delta t = \frac{30,000 \text{ m/s} \times 2.365 \times 10^{22} \text{ m}}{(3 \times 10^8 \text{ m/s})^2}$$
      $$\Delta t = \frac{7.095 \times 10^{26}}{9 \times 10^{16}} \approx 7.88 \times 10^9 \text{ seconds}$$
      $$\Delta t \approx \mathbf{250 \text{ years}}$$

      **What each hop buys:** Each 30 m/s hop shifts the "now" slice in Andromeda by **0.25 years (3 months)**. By the 1,000th observer, their "present moment" includes events in Andromeda that, for you, won't happen for another two and a half centuries.

  **The Verdict**
  *   **The Event:** You drinking coffee in 24 hours ($x=0, t=1 \text{ day}$).
  *   **The Status:** For *every single observer* in the relay ($O_0$ through $O_{1000}$), this event sits **strictly inside their Future Light Cone**.
  *   **The Reason:** All observers coincide at $x=0, t=0$. In Special Relativity, all planes of simultaneity for observers passing through a common origin event **pivot on that origin**.
      *   For you ($O_0$), "now" is $t=0$.
      *   For the fastest passerby ($O_{1000}$), "now" is $t' = 0$.
      *   Using the Lorentz transformation for time: $t' = \gamma (t - vx/c^2)$.
      *   For your coffee event, $x=0$ (it happens to you, right here).
      *   Therefore, $t' = \gamma t$.
      *   If $t > 0$ (future), then $t' > 0$ (future).
      *   No matter how fast $O_{1000}$ goes, your local future never slides into their "now." It remains in their future.

  ---

  ### The Writeup

  #### 1. What the Block-Universe Fatalist Gets
  The fatalist secures a foothold on **distant eternalism**. They can legitimately argue that for observer $O_{1000}$, events in Andromeda 250 years in *your* future are already "real" and fixed *in that frame*. If reality is frame-independent (the Block Universe), then those Andromeda events exist timelessly. The fatalist claims this proves the future is "already there," just spacelike separated. They get a universe where *distant* simultaneity is fixed, creating a static 4D manifold.

  #### 2. What the "Open Future" Proponent Says Back
  The open future proponent accepts the math but rejects the metaphysical leap. They argue:
  *   **Conventionality of Simultaneity:** "Real" is not the same as "Simultaneous." Just because $O_{1000}$ *calculates* an Andromeda event as "now" doesn't make it causally fixed for you.
  *   **Causal Isolation:** The Andromeda events are spacelike separated. No signal from them can reach you before you drink your coffee. Their "fixed" status cannot constrain your local agency.
  *   **The Local Future Remains Open:** As the verdict shows, your coffee event is inside the future light cone for *all* observers. It is not "already real" for anyone at the origin. Your decision is not fixed by the geometry of simultaneity, only by your local causal past.

  #### 3. The Single Feature Doing the Work
  The feature is **The Pivot at the Origin**.
  All planes of simultaneity for observers meeting at a single event must intersect at that event. They fan out like pages in a book bound at the spine. The spine is "Here-Now." You can tilt the pages (planes) to sweep through distant space (Andromeda), but the pages *never* cut through the spine's future. The geometry of Minkowski space protects the local future from being declared "present" by any subluminal observer.

  #### 4. Dropping the Feature: What If We Cheat?
  **Scenario:** You drop the "street speed" constraint and let the relay observers move **arbitrarily fast** (approaching $c$), or you add infinite relays to push $v \to c$.

  **Result:**
  Even if $v \to c$, the plane of simultaneity approaches the **Future Light Cone**, but it **never crosses it**.
  *   At $v=c$ (which is impossible for observers, but mathematically the limit), the "now" plane becomes the light cone itself.
  *   Your coffee event ($t=1 \text{ day}, x=0$) is *timelike* separated from the origin. It lies *inside* the cone.
  *   The "now" plane (spacelike) can never intersect the timelike future worldline of the Earth observer except at the origin.

  **Verdict on "Your Decision Tomorrow Was Already Fixed":**
  **No.** The argument still fails to land on local fatalism.
  Even with infinite velocity, Special Relativity only allows you to claim that *spacelike* separated events are "real." It never allows you to claim that *timelike* future events (your decisions tomorrow) are "already real" for any observer located here and now. To prove your decision is fixed, you need **causal determinism**, not just **relativistic simultaneity**. The Rietdijk–Putnam argument buys you a static universe of distant stars, but it cannot touch the coffee cup in your hand tomorrow.
