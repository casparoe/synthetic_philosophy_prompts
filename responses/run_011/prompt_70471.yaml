answer: |-
  Welcome, everyone. Thank you for coming.

  Eighteen months ago, we chose the title for this workshop: *Do Models Have Representations?* At the time, it seemed like a straightforward question. Today, looking around this room, I realize it was a Rorschach test. Half of you hear a question about engineering methods: are the features we find properties of the system, or artifacts of our tools? The other half hear a question about ontology: is there something inside the model that corresponds to the concepts we label? We are not here to resolve that ambiguity. We are here to see if the work survives it.

  Choosing a title eighteen months ago is an act of optimism. Choosing one that half the room hears as a technical query and the other half hears as a psychological diagnosis is, I am told, a strategy for ensuring full attendance. But it also ensures that when we speak, we must listen twice.

  For the past two years, my group has been building what we call the atlas. We have identified a few thousand directions in the activation space of a large model. Each direction is associated with a labeled concept. Each lights up reliably when that concept is present in the input. Each can be strengthened or suppressed by intervention. And each is recovered, with minor drift, by the same procedure applied to related models trained on different data, with different seeds and different widths.

  **The procedure recovers the same features across different seeds.**

  That stability is the ground we stand on. But it is not the ground we agree on.

  Two of my colleagues, Priya and Tomás, are here. They are friends, and they are both brilliant, and neither will thank me for summarizing their disagreement. Priya holds that the atlas entries are real structure. She argues that the atlas records a discovery, that its entries would be recovered by any sufficiently careful procedure, and that their stability across models is evidence that they track something method-independent. Tomás holds that the entries are a choice of basis. He argues that many bases fit our intervention data equally well, that which one we get is a function of the priors we built into the procedure, and that the only thing we are entitled to is a list of invariances. On his view, asking whether the entries are real is a category error about a coordinate system.

  Both accept every number we have. They disagree about what the numbers are numbers of.

  **When we strengthen this direction, the behavior shifts.**

  This workshop exists because of two anomalies that neither side can fully explain away. First: roughly one atlas entry in twelve has no detectable behavioral effect when we suppress it. It is stable, interpretable, reliably responsive to its concept, and intervening on it changes nothing the model does. Second: we have three interventions that reliably change behavior, one of which reverses a preference we care about a great deal, for which we cannot find any atlas entry, or combination of entries, that mediates the change. We can produce the effect; we cannot locate what we are producing it in.

  Priya says the first shows our labels are wrong and the second is a failure of search rather than of ontology. Tomás says the first is exactly what you should expect from a basis fitted to predict activations rather than behavior, and that the second proves his point: the interventions work, and the ontology is surplus.

  **There is a structure here that demands explanation.**

  To our colleagues from the standards body: you are here to see if interpretability evidence is the sort of thing one could require in a technical standard. You need to know what this work can deliver. It cannot yet deliver a compliance checklist. It cannot tell you which directions must be present for a model to be safe. But it can deliver a vocabulary for failure. It can show you where the levers are, even if we do not yet agree on why pulling them works. It can tell you what we know, and precisely where our knowledge ends. That precision is itself a utility. You are not in the wrong building. You are in the room where the limits are being drawn.

  I need to make a disclosure. The atlas is my group's work. I am not neutral. I lean towards Priya. I have never been able to say what would count as evidence against her view, and that worry keeps me honest. But a host owes a room something different than a protagonist owes a argument. I owe you airtime. I owe you the chance to sharpen the disagreement until it cuts. I will not settle this dispute. I will not predict what these two days will conclude. My job is to make the disagreement precise enough that you have something to attack.

  We have philosophers here to help us scrutinize the criteria we use for reality. We have engineers here to ensure we do not lose touch with the weights. We have journalists here to ensure we do not hide the uncertainty. And we have observers here to ensure we do not promise what we cannot keep.

  We begin with the anomalies. We begin with the case that is hardest for the realist to swallow. Tomás is up first. His opening slide is the second anomaly. He is going to show us the interventions that work without a home.

  Please welcome Tomás.

  ***

  **Note on the three ambiguous sentences:**

  1.  *"The procedure recovers the same features across different seeds."* Priya hears this as evidence that the features exist independently of the procedure (discovery). Tomás hears it as evidence that the procedure's inductive biases are stable (construction).
  2.  *"When we strengthen this direction, the behavior shifts."* Priya hears this as causal confirmation that the direction constitutes the behavior. Tomás hears this as confirmation of control without ontological commitment (correlation/manipulation).
  3.  *"There is a structure here that demands explanation."* Priya hears "structure" as mind-independent reality. Tomás hears "structure" as statistical regularity in the data that requires a model.
