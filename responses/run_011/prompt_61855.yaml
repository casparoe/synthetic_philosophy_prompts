      *   **Grandmother Case:** This is a classic objection to Sensitivity (Clause 3). Scenario: Grandmother sees grandson is well (p). If he weren't well (~p), she wouldn't believe he was well (she'd be told he's sick). So she knows. *Wait, that works.* The problem case is usually: Grandmother *would* be told he's well even if he were sick (to spare her feelings). So if ~p, she still Believes p. Sensitivity fails. She *intuitively* knows (by looking at him), but Sensitivity says she doesn't. In the BIV case, Sensitivity says we *don't* know ~BIV, which matches the theory but hurts intuition. In Grandma, Sensitivity says we *don't* know (in the deception variant), which hurts intuition. The difference: BIV is a skeptical scenario we want to reject; Grandma is an ordinary case we want to accept. Nozick bites the bullet on BIV (we don't know ~BIV). He might have to bite the bullet on Grandma too, which is costly.
      *   **Contradictory Claims:** This likely refers to the "abominable conjunction." "I know I have hands, but I don't know I'm not a brain in a vat." DeRose calls this the "abominable conjunction." It sounds contradictory pragmatically, even if logically consistent under Nozick's theory.
      *   **Gloss on Third Clause:** The passage describes Sensitivity as "responsive to evidence." This is wrong. It's responsive to *truth*. In BIV, evidence is identical, truth differs. Sensitivity tracks truth across worlds, not evidence in this world. The "couldn't easily have been wrong" is Safety, not Sensitivity. If the gloss were correct (Safety), the BIV result *would not follow*. Safety says: In nearby worlds where I believe ~BIV, is it true? If I'm in the actual world (not BIV), and I believe ~BIV, is it true? Yes. So Safety *allows* knowledge of ~BIV (usually). Sensitivity *denies* it. So the gloss undermines the conclusion.
      *   **Which counterfactual emphasized?** Post-Nozick, Safety (inverse of Clause 3) is emphasized more than Adherence (Clause 4). If you drop Clause 3 (Sensitivity), you lose the anti-skeptical bite (you can know ~BIV) but you keep Closure. If you drop Clause 4 (Adherence), you have problems with necessary truths or cases where you wouldn't believe the truth if it were true (but it is).
