      *   *Sentence 6:* "Now apply this to skepticism." -> **Fine.**
      *   *Sentence 7:* "If I were a handless brain in a vat, I would still believe I had hands, because the vat is arranged to deliver exactly the experiences I am having; so my belief that I am not a brain in a vat fails the test, and I do not know it." -> **Accurate.** This is the standard application of Sensitivity (Clause 3) to skepticism.
