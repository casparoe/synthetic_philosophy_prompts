  ### Desiderata for a Payer's Definition of Disease

  To draft a funding rule that remains robust across philosophical shifts, the following requirements distinguish between **Non-Negotiable (NN)** operational necessities for a regional payer and **Local Preferences (LP)** inherent to specific philosophical camps (Statistical-Function, Hybrid, Social/Conferred).

  #### I. Phenomenal Coverage (What must be counted)

  **1. Asymptomatic Risk Coverage**
  *   **Requirement:** The rule must classify conditions as diseases eligible for treatment even when no subjective harm or functional loss is currently present, provided biological pathology exists.
  *   **Case:** *BRCA1* mutations or familial hypercholesterolemia. A payer must fund preventive statins or mastectomies before the heart attack or cancer occurs.
  *   **Status:** **NN** (Fiduciary/Health Logic).
  *   **Camp Tension:** Favors *Statistical-Function* and *Hybrid* accounts (dysfunction exists prior to harm). Challenges *Pure Normativist/Social* accounts (which often require experienced harm or social labeling).

  **2. Reference Class Stability (The Medicated Population Constraint)**
  *   **Requirement:** The definition of "normal function" cannot drift simply because the majority of the population is medicated. The baseline must be resistant to therapeutic contamination of the reference class.
  *   **Case:** If 80% of the population is on lipid-lowering therapy, the statistical "average" lipid level drops. A rule based on current statistics would classify untreated healthy individuals as "diseased" (high lipids relative to the medicated mean).
  *   **Status:** **NN** (Validity).
  *   **Camp Tension:** Fatal to *Pure Statistical* accounts (Boorse). Requires *Functional/Evolutionary* baselines (Hybrid/Naturalist) or *Social* baselines (Normativist).

  **3. Community Sovereignty (The Identity Constraint)**
  *   **Requirement:** The rule must account for cases where the affected community explicitly denies that their condition is a disorder requiring correction.
  *   **Case:** Deaf culture (rejecting cochlear implants) or Neurodiversity movements (rejecting autism "cures").
  *   **Status:** **LP** (Social/Conferred Camp).
  *   **Camp Tension:** Favors *Social* accounts. Conflicts with *Naturalist* accounts (which view dysfunction as objective regardless of identity) and *Hybrid* accounts (if harm is judged objectively).

  #### II. Conceptual Distinctions (What must be kept apart)

  **4. Disease vs. Illness vs. Disability**
  *   **Requirement:** The rule must not collapse pathological process (disease), subjective experience of suffering (illness), and social restriction (disability).
  *   **Case:** A person may have tuberculosis (disease) without feeling sick (illness), or a broken leg (impairment) without underlying pathology (disease), or be unemployed due to stigma (disability) without medical dysfunction.
  *   **Status:** **NN** (Policy Clarity).
  *   **Camp Tension:** *Social* accounts often collapse these into "socially constructed disadvantage." *Naturalist* accounts maintain them rigidly.

  **5. Disorder-as-Kind vs. Disorder-in-This-Person (Type/Token)**
  *   **Requirement:** The rule must distinguish between a condition that is inherently disordered (type) and a condition that is disordered only due to context or severity (token).
  *   **Case:** Anxiety is a normal function (type) but Panic Disorder is pathological (token). Conversely, having one kidney is statistically abnormal but not a disorder (token).
  *   **Status:** **NN** (Resource Allocation).
  *   **Camp Tension:** *Statistical* accounts struggle here (one kidney is statistically abnormal). *Functional* accounts handle this better (remaining kidney functions normally).

  **6. Disordered vs. Merely Different**
  *   **Requirement:** The rule must provide a boundary between biological variation and biological dysfunction.
  *   **Case:** Left-handedness vs. congenital analgesia. Both are statistically minor; only one is a dysfunction.
  *   **Status:** **NN** (Legitimacy).
  *   **Camp Tension:** *Statistical* accounts fail here (left-handedness is abnormal). *Functional* accounts succeed (hand function is intact).

  #### III. Operational Constraints (How the rule works)

  **7. The Adjudication Constraint (Verdict in Disagreement)**
  *   **Requirement:** The rule must specify a tie-breaking procedure when clinical assessment and community self-identification disagree.
  *   **Case:** Gender dysphoria or ADHD overdiagnosis concerns. The clinician sees pathology; the community sees identity (or vice versa).
  *   **Status:** **NN** (Administrative Necessity).
  *   **Camp Tension:** *Naturalist* defaults to Clinician. *Social* defaults to Community. *Hybrid* lacks a procedural hierarchy.

  **8. Evidentiary Specification**
  *   **Requirement:** For every term used (e.g., "dysfunction," "harm," "abnormality"), the rule must specify the class of evidence required to prove it (e.g., biomarker, survey, functional test).
  *   **Case:** Proving "dysfunction" in mental health vs. oncology.
  *   **Status:** **NN** (Auditability).
  *   **Camp Tension:** *Philosophical* accounts often leave evidence vague. *Payer* rules require specificity.

  ---

  ### The Incompatibility Result: The Payer's Impossible Trinity

  In drafting these desiderata, a logical inconsistency emerges. You cannot jointly satisfy the following three requirements:

  1.  **Reference Class Stability (NN):** Requires a fixed, value-free biological baseline (to prevent medicated populations from redefining health).
  2.  **Community Sovereignty (LP - Social):** Requires the definition of disease to be responsive to the values and identity of the affected group.
  3.  **Asymptomatic Risk Coverage (NN):** Requires funding for conditions where the community may feel no harm and thus claim no "illness" (e.g., preventive genetics).

  **The Conflict:**
  If you prioritize **Stability** (Naturalist), you override **Community Sovereignty** (e.g., funding deafness interventions despite cultural objection).
  If you prioritize **Sovereignty** (Social), you lose **Stability** (definitions shift with cultural trends) and **Asymptomatic Coverage** (cannot fund prevention if the community denies the risk is a "problem").
  If you prioritize **Asymptomatic Coverage** (Payer Economics), you must objectify risk, which undermines **Sovereignty**.

  **Result:** A regional payer cannot be philosophically agnostic. By selecting the Non-Negotiables (Stability + Prevention), you have effectively pre-committed to a **Naturalist or Hybrid** account and excluded a **Pure Social** account, regardless of your stated intent to fix the standard *before* picking an account.

  ---

  ### The Killer Requirement

  **Requirement:** **Reference Class Stability (The Medicated Population Constraint)**

  This requirement eliminates the most candidates because it specifically targets the default assumption of modern epidemiology: that "normal" is what is statistically average in the current population.

  **Scoring the Three Camps:**

  1.  **Statistical-Function Accounts (e.g., Boorse's Biostatistical Theory):**
      *   **Score: FAIL.**
      *   **Reason:** By definition, these accounts rely on current statistical distributions. If the population is medicated, the "statistical function" shifts. They cannot distinguish between a "treated normal" and a "natural normal" without importing non-statistical theoretical assumptions.

  2.  **Hybrid Accounts (e.g., Wakefield's Harmful Dysfunction):**
      *   **Score: PASS.**
      *   **Reason:** These accounts ground "dysfunction" in evolutionary design or theoretical species-typical functioning, not observed statistics. A statin-mediated lipid level does not change the evolutionary design of lipid metabolism, preserving the baseline.

  3.  **Social/Conferred Accounts (e.g., Engelhardt, Disability Studies):**
      *   **Score: PASS (Trivially).**
      *   **Reason:** These accounts do not rely on biological statistics to define disease status. Whether the population is medicated is irrelevant; status is conferred by social judgment or harm assessment. However, they fail the *Asymptomatic Risk* requirement (see Incompatibility), making this pass operationally weak for a payer.

  **Conclusion:** The **Reference Class Stability** requirement forces the payer to abandon pure Statistical Naturalism, pushing the rule toward a Hybrid (Evolutionary Function) model, while the **Asymptomatic Risk** requirement simultaneously blocks Pure Social Normativism. The "agnostic" standard inevitably converges on a **Hybrid Naturalism** that posits theoretical biological functions over observed statistics.
