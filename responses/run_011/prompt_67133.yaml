answer: |-
  1. **Bottom line**
  The maxim "ask who benefits" is not a single principle but a family of distinct inferential moves ranging from probabilistic reasoning about agency to structural explanations of institutional inertia. In ordinary usage, it most commonly functions as a heuristic for assigning motive, suggesting that beneficiaries are statistically more likely to be causally responsible for intentional events. However, this default reading often conflates individual intent with systemic outcomes, leading to the confusion witnessed in your seminar. The Piltdown case illustrates this split perfectly, with one argument addressing the origin of the fraud and the other addressing its persistence. Without distinguishing between these roles, the maxim risks becoming a trivial tautology where everyone benefits from something, or a false deterministic claim that benefit guarantees causation. To be epistemically useful, the maxim must specify whether it targets the generator of a claim or the guardian of its reception.

  2. **The readings**
  1. **The Motive-Probabilistic Reading:** This reading treats the existence of a foreseen reputational or financial gain for a specific individual agent as a Bayesian update that increases the likelihood ratio that this individual caused the event relative to all individuals with access and capacity. The benefit functions as a probabilistic reason to think the beneficiary caused the event, shifting priors away from accidental explanations toward intentional fabrication without constituting proof of guilt on its own.
  2. **The Investigative Heuristic Reading:** This reading treats any conceivable advantage, whether actual or merely likely, accruing to individuals or small groups as a triage tool for allocating scarce investigative resources rather than as direct evidence of guilt. The benefit functions as a filter that trims the hypothesis space before any physical evidence is weighed, prioritizing high-yield inquiries among the set of all possible suspects to maximize efficiency.
  3. **The Structural-Functional Reading:** This reading explains the persistence of a state of affairs by reference to systemic advantages, such as ideological comfort or status quo preservation, accruing to an institution, discipline, or diffuse class regardless of individual intent. The benefit functions as a stand-in for a functional explanation on which the benefit accrues to no one who brought it about, explaining why an error survived within the set of systemic forces or institutional norms.
  4. **The Necessary Condition Reading:** This reading asserts that intentional fabrication requires an actually realised specific gain for the alleged conspirator, using the absence of such benefit to rule out conspiracy hypotheses in favor of accident among the set of hypotheses involving intentional deception versus accident. The benefit functions as a negative constraint to eliminate conspiracy hypotheses where no clear gain exists for the alleged architect, treating benefit as a prerequisite for agency.
  5. **The Collective Inaction Reading:** This reading explains negligence by positing that a group failed to act because correcting the error would harm their collective interests, such as avoiding embarrassment or maintaining authority, benefiting the epistemic community or gatekeeping body. The benefit functions as a probabilistic reason to think the beneficiary allowed the event, explaining the failure of testimony evaluation mechanisms among reviewers, editors, or senior experts without positing active collusion.

  3. **Verdicts**
  1. **Motive-Probabilistic:** This is substantive and defensible, provided one accepts the premise that rational actors pursue gain more often than not. It is not a platitude because it excludes altruistic or irrational actors, but it is not false unless one assumes benefit guarantees guilt. The extra premise required is that the correlation between benefit and action is strong enough to shift priors significantly, which is checkable by looking at base rates of fraud among those with motive versus those without.
  2. **Investigative Heuristic:** This is substantive and defensible as a pragmatic rule of thumb for resource management. It avoids the claim that beneficiaries are guilty, arguing only that they are the cheapest place to start looking. The extra premise is that investigative resources are scarce and beneficiaries are easier to identify than non-beneficiaries. This is empirically checkable by measuring the success rate of investigations that start with motive versus those that start with physical opportunity.
  3. **Structural-Functional:** This is substantive but difficult to verify sociologically. It moves beyond individual psychology to explain why bad ideas survive within systems. The extra premise is that institutions act like organisms selecting for self-preservation over truth. This is hard to check because it requires counterfactuals about what would have happened had the institution been different, making it prone to unfalsifiable just-so stories.
  4. **Necessary Condition:** This is false as a strict logical rule, though often treated as a platitude. People commit crimes for irrational reasons, or benefits may be hidden or psychological. The extra premise required is that all actors are perfectly rational and transparent about their gains. This is not checkable because hidden benefits are by definition unobservable, rendering the rule useless for ruling out complex conspiracies.
  5. **Collective Inaction:** This is substantive and defensible, specifically for explaining the Piltdown duration. It accounts for the silence of experts without accusing them of active fraud. The extra premise is that professional reputation outweighs epistemic duty in collective decision-making. This is checkable by analyzing historical cases of retraction and seeing if embarrassment correlates with delay in correction.

  4. **Back to Piltdown**
  Your first classmate employs the Motive-Probabilistic Reading against Dawson. This argument gains something significant that the ordinary physical evidence does not supply: the staining and filing prove forgery (*actus reus*) but not identity, whereas benefit supplies the link to agency (*mens rea*). However, it risks false positives if other parties had similar motives, so it cannot stand alone. Your second classmate employs the Collective Inaction or Structural-Functional Reading to explain the forty-year gap. This argument gains nothing regarding the origin of the fraud but is essential for explaining the testimonial failure of the broader community. The second classmate is indeed sliding from agent to collective, but legitimately so: the maxim shifts from explaining *who did it* to explaining *why nobody stopped it*. The two arguments are compatible but address different temporal phases of the epistemic event. The first targets the generation of false testimony; the second targets the failure of its evaluation. Confusing these leads to the seminar's impasse, as one explains the lie while the other explains the silence.

  5. **The maxim I can keep**
  "Identify the beneficiaries to prioritize hypotheses about agency or explain institutional inertia, but never conflate the capacity to gain with the causation of the event." Before applying this, you must answer: first, is the benefit structural or individual? Second, are you explaining the origin of the claim or the persistence of its acceptance? These questions prevent the category error of treating institutional silence as individual guilt, ensuring the maxim serves as a tool for mapping epistemic vulnerability rather than a shortcut to accusation.
