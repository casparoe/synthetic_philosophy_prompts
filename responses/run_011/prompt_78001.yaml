answer: |-
  Your competence-versus-exercise distinction is analytically clean but functionally unstable in the EU context. In Germany and Switzerland, competence is largely subject-matter based: the federation has power over defense, the states have power over schools. Subsidiarity only kicks in where powers overlap (concurrent competence). Because the subject matter is fixed, the question of "who has the power" is distinct from "should they use it."

  In the EU, however, competence is often effect-based. The Internal Market power exists only if cross-border trade is hindered. Determining whether trade is hindered enough to trigger EU competence often requires the same analysis as determining whether national action is insufficient to satisfy subsidiarity. If the barrier is trivial, the EU lacks competence; if the barrier is significant, national action is likely insufficient. The two inquiries merge. Your diagnosis is correct: subsidiarity ends up carrying the allocation work because the competence gate is too elastic. But this isn't a drafting error; it is structural. The EU is not a state seeking to balance power, but a treaty seeking to remove barriers. The "competence" question is inherently a question about the necessity of harmonization.

  Regarding your second hypothesis: the analogy to the political question doctrine is close but imprecise. In the US, the political question doctrine means courts refuse to hear the case at all. In the EU, the Court of Justice does hear subsidiarity challenges. It does not declare them non-justiciable; it applies a manifest error standard. The Court checks whether the institution provided reasoning and whether the conclusion was plainly irrational. It does not substitute its own judgment for the legislature's. This is deferential review, not abstention. The "Yellow Card" system for national parliaments is political pressure, not a legal veto. If the Commission maintains its proposal, the legislation proceeds. The constraint is reputational, not jurisdictional. So subsidiarity is justiciable, but the threshold for success is so high that it functions politically.

  Let's walk through your dog groomer directive.

  **EU Analysis:**
  1.  **Conferral:** The Commission must show licensing disparities hinder groomers from providing services across borders. If they prove this, competence exists.
  2.  **Subsidiarity:** The Commission must argue member states cannot fix this alone because unilateral rules create new barriers. They must show EU-wide standards are "better achieved" at Union level.
  3.  **Procedure:** National parliaments get eight weeks. If one-third object, the Commission must review (Yellow Card). They can issue a reasoned opinion and proceed anyway.
  4.  **Judicial Review:** A member state sues. The Court asks: Did the Commission explain why national rules failed? If the reasoning exists, the Court defers.
  5.  **Death Point:** This directive likely dies in the Council or Parliament because it is politically unpopular, not because it fails the legal test.

  **US/Germany Comparison:**
  *   **US:** Congress uses the Commerce Clause. If groomers affect interstate commerce, Congress acts. There is no subsidiarity test. The limit is political, not legal.
  *   **Germany:** This falls under concurrent power. The Federation must prove a "necessity" test (Bedürfnisklausel): that regional legislation is ineffective for the matter. This is legally stricter than EU subsidiarity, but still deferential. However, if grooming is deemed purely local, it remains exclusive Land competence, and the Federation lacks power entirely.

  The critical difference is that in Germany and the US, local services are presumptively state powers unless proven otherwise. In the EU, anything affecting the market is presumptively Union competence unless proven unnecessary. You are measuring a market-integration tool against a federal-balancing tool.

  Verdict: You treat the EU as a traditional federation, ignoring integration is its goal, not decentralization.
