      *   **Question:** "Conditionality in the modern welfare state is just the old distinction between the deserving and the undeserving poor in new clothes." Critically assess. (20 marks).
      *   **Allowed Material:** 1834 Poor Law, current UK sanctions policy, theorists of reciprocity.
      *   **Input:** A condensed student answer (approx. 400-500 words equivalent, though condensed).
      *   **Output Requirements:**
