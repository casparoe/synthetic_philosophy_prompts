      *Critique:* Determining "capacity" is not purely descriptive. It involves normative judgements about what counts as a disability or barrier. This is a philosophical error (is/ought problem). I should highlight this.

      *Reciprocity:* White distinguishes between *fair* reciprocity and *exploitative* demands. The student ignores the "fairness" condition.

