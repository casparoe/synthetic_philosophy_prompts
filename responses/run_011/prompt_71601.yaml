          *   *Orchestra:* Performance = Cannot be a forgery (authenticity by ear/sound). Instruments = Old Italian vs. New Copy (blind tests fail to distinguish, yet massive price difference). Key factor seems split: Sound is reproducible/authenticable by ear; Object (instrument) is valued by history/provenance.
      *   **The Task:** Reconstruct the theories of artwork and value presupposed by these practices. Distinguish between what is *strictly presupposed* vs. what merely *fits comfortably*. Identify where the practice is *philosophically underdetermined* (multiple theories explain the same behavior). Determine if a *unified theory* is possible or if *disunity* is required. Finally, outline *concrete changes* if we shifted to a theory where value is *entirely perceptible properties*.
      *   **Constraint:** Do not dismiss this as "just market convention." Take the intellectual content seriously.

  2.  **Deconstruct the Museum Practices (Visual Art):**
