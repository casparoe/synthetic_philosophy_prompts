          *   Performance: "Authenticity" becomes purely about sound, not period instruments (unless they sound different).
      *   *Concrete Changes:*
          *   Deaccessioning: Sell the forgery as a "High Quality Dutch Style Painting."
          *   Acquisitions: Stop buying provenance, buy aesthetics.
          *   Insurance: Shift from "Agreed Value" based on auction history to "Replacement Cost" based on commissioning a living artist.
          *   Orchestra: Blind auditions for instruments.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Intellectual, respectful, rigorous. Acknowledge the user's dual expertise.
      *   *Structure:*
          1.  Introduction: Validate the tension.
          2.  Museum Theory: The Object as Testimony (Genesis > Perception).
          3.  Orchestra Theory: The Dual Ontology (Work vs. Tool).
          4.  Underdetermination: Where theories overlap.
          5.  Unified vs. Disunified: Goodman's Autographic/Allographic distinction + The "Heritage" angle.
          6.  The Perceptual Shift: Concrete consequences.
      *   *Key Philosophical References (implicit or explicit):* Nelson Goodman (Languages of Art), Arthur Danto (Artworld), Walter Benjamin (Aura), Jerrold Levinson (Historical definitions). *Self-Correction:* Keep it accessible but precise. Don't just name-drop; use the concepts.
      *   *Focus on the "Lie":* Why is the forgery a lie but the posthumous cast isn't? It's about *authorization* vs. *deception*. This points to an Institutional/Contractual theory.
