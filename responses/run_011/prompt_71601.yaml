          *   Orchestra (Music): No (performance is reproducible).
          *   Orchestra (Instrument): Yes.
      *   *Verdict:* **Disunity is required.** Music is an *allographic* art (Goodman), Visual Art is *autographic*.
          *   *Correction:* Even within visual art, the "Roman Copy" exception complicates pure autography. It suggests *Historical Witness* is the unifying theme, not just "Artist's Hand."
      *   *Refined Verdict:* A unified theory of *Heritage* works better than a unified theory of *Art*. Both institutions are preserving *history*, but music treats the *work* as timeless, while museums treat the *object* as historical.

  7.  **Address the "Perceptual Value Only" Scenario (The Thought Experiment):**
      *   If value = *only* perceptible properties:
      *   *Museum:*
