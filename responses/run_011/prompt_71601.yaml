          *   *Presupposition:* The artwork is an *event* or an *action* by a specific agent at a specific time, not just an object. It's about *genesis*.
          *   *Theory:* Causal-Historical (Dickie/Danto-ish but more ontological). The work *is* the product of that specific artistic intention.
          *   *Why exile?* It's a lie. It claims to be $X$ but is $Y$. It corrupts the historical record.
      *   *Posthumous Casts:* Authorized = Good. Unauthorized = Bad.
          *   *Presupposition:* The artist's *authority* (legal/intentional) extends beyond death. The mold is the "score," the cast is the "performance," but limited by the artist's will.
          *   *Theory:* Institutional/Contractual. The "work" includes the edition limit as part of its definition.
      *   *Roman Copies:* Valid. Modern Copies: Invalid.
          *   *Presupposition:* Historical distance matters. A Roman copy is a historical artifact *of the Roman era* reflecting Greek art. A modern copy is a deception or a mere replica without historical status of its own.
          *   *Theory:* Historical Testimony. The object bears witness to *its own time* as much as the original it copies.

  3.  **Deconstruct the Orchestra Practices (Music):**
      *   *Performance:* Cannot be a forgery.
          *   *Presupposition:* The work is *ontologically distinct* from the performance. The work is a type (score/structure), the performance is a token. A token cannot be a forgery of a type, only a bad instance.
          *   *Theory:* Platonism/Nominalism about musical works. Authenticity is fidelity to the score/style, not the specific physical vibration history.
      *   *Instruments:* Old vs. New (Price disparity despite perceptual equality).
          *   *Presupposition:* The instrument is a *relic* or a *historical witness*, not just a tool for sound production. It carries "aura" (Benjamin).
          *   *Theory:* Fetishization of Provenance / Scarcity. The value is in the *history of the object*, not just its sonic output.
      *   *Tension:* We treat the *music* as perceptual/structural, but the *tool* as historical/causal.

  4.  **Synthesize and Compare (The "Theory Reconstruction"):**
      *   *Museum Theory:* **The Artwork as Historical Act.** The value lies in the *genesis*. The object is a trace of a specific human intention at a specific time. Forgery breaks the link between trace and intention.
      *   *Orchestra Theory:* **Dual Ontology.**
          1.  *The Work (Music):* Abstract structure. Value = Perceptual/Structural fidelity.
          2.  *The Artifact (Instrument):* Historical relic. Value = Provenance/Scarcity.
      *   *Conflict:* The museum treats the *object* as the work (so genesis matters). The orchestra treats the *sound* as the work (so perception matters), but the *tool* as a collectible (so genesis matters).

  5.  **Address the "Underdetermination" Question:**
      *   Where do different theories yield the same result?
      *   *Forgery:*
          *   *Causal-Historical:* It's not by the artist.
          *   *Epistemic:* It lies to the viewer.
          *   *Market:* It's not scarce/authentic asset.
          *   *Institutional:* The museum says it's not art.
          *   *Result:* All say "Deaccession/Hide."
      *   *Posthumous Cast:*
          *   *Causal-Historical:* Weak link (artist dead).
          *   *Institutional/Contractual:* Estate says yes.
          *   *Market:* Scarcity maintained.
          *   *Result:* All say "Display."
      *   *Conclusion:* The practices are underdetermined. We can't tell *why* they do it just by looking at *what* they do. The "Paperwork" vs. "Lie" distinction suggests an *Institutional/Deontic* theory (rights/permissions) rather than purely *Ontological* (what exists).

  6.  **Address the "Unified vs. Disunified" Question:**
      *   Can one theory cover both?
