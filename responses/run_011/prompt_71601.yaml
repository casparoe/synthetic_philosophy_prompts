answer: |-
  This is a profound ontological puzzle that strikes at the heart of how institutions constitute reality. You are correct to reject the dismissal of these practices as mere "market convention." Markets follow rules; they do not generate the metaphysical categories that make valuation possible. Your observation identifies a fracture in the philosophy of art: the museum operates on a theory of **historical testimony**, while the orchestra operates on a **dual ontology** that separates the work (sound) from the artifact (instrument).

  Here is a reconstruction of the theories your practices presuppose, an analysis of where they are underdetermined, and a projection of what would change if you adopted a purely perceptual theory of value.

  ### 1. The Museum: The Artwork as Historical Event
  Your museum's treatment of the forgery, the posthumous cast, and the Roman copy presupposes that the artwork is not a physical object *simpliciter*, but a **physical trace of a specific intentional act.**

  *   **The Forgery (The Lie):** The forgery is exiled not because it lacks aesthetic merit (you note it is indistinguishable), but because it creates a false historical record. The museum presupposes that the value of the object is partially **epistemic**. It is a piece of evidence regarding what a specific human being (the Master) did at a specific time. When the attribution collapses, the object remains physically identical, but its *propositional content* changes from "This is what Rembrandt saw and did" to "This is what a copyist thought Rembrandt did." The exile is an epistemic quarantine. The museum is a repository of truth-claims, not just beauty.
  *   **The Posthumous Cast (The Authorization):** This is the critical counter-case. If value were purely about the artist's physical touch, a posthumous cast would be a forgery. It is not. This presupposes that the "work" is defined by a **chain of authority** rather than a chain of physical causation. The artist's intention is treated as a legal-metaphysical entity that can survive the artist's death, delegated to an estate. The "work" includes the *limit* of the edition as a constitutive rule. The unauthorized cast is not a fake because it looks wrong; it is a fake because it violates the constitutive rules of the work's identity.
  *   **The Roman Copy (The Witness):** Why is a Roman copy of a Greek bronze valid, but a modern one a scandal? This presupposes that the museum values **historical witness** alongside **original genius**. The Roman copy testifies to *Roman* aesthetic values and technical capabilities, even if it copies a Greek form. A modern copy testifies only to modern replication technology. The value is in the object's age and its position in history, not solely in its origination by the "genius."

  **Strict Presupposition:** The identity of the visual artwork is **context-dependent**. Two physically indistinguishable objects can be different works (or one work and one non-work) based on their history of production and authorization.
  **Underdetermination:** The practice does not tell us *why* this history matters.
  *   *Metaphysical:* The object contains an "aura" or causal connection to the artist (Benjamin/Peirce).
  *   *Epistemic:* The museum's function is to tell the truth about history; the forgery makes the museum a liar.
  *   *Economic:* Value requires guaranteed scarcity; authorization guarantees scarcity, forgery threatens it.
  *   *Institutional:* The "Artworld" confers status; the estate is the authorized conferrer, the forger is not.
  All four theories license the exact same behavior (hiding the forgery, displaying the cast). The practice itself cannot distinguish between them.

  ### 2. The Orchestra: The Dual Ontology of Music
  Your musical life reveals a split that the museum does not have. Music is **allographic** (the work is a structure defined by a score), while the instrument is **autographic** (a unique historical object).

  *   **The Performance (The Work):** Nobody thinks a performance can be a forgery because the "work" (Bach's Cello Suite) is an abstract structure. A performance is a **token** of that **type**. As long as the token conforms to the type (the score/style), it is authentic. Authenticity here is **perceptual and structural**. A period-instrument ensemble is praised not because the instruments are old, but because the *sound* matches the historical style. The value is in the *realization of the structure*.
  *   **The Instrument (The Artifact):** Here, the orchestra mirrors the museum. The Stradivarius is valued not for its sonic output (blind tests show equality) but for its **provenance**. It is a relic. The musician playing it is not just making sound; they are channeling history. The price disparity presupposes that the instrument is a **collectible asset** whose value is derived from scarcity and historical lineage, distinct from its functional utility.

  **Strict Presupposition:** Music practice presupposes a **separation of function and history**. The *function* (sound) is judged perceptually; the *tool* (instrument) is judged historically.
  **Underdetermination:** Why do we pay millions for the tool if the function is identical?
  *   *Signaling:* Playing a Strad signals status to the audience/donors.
  *   *Superstition:* Belief that the history imbues the object with intangible qualities.
  *   *Investment:* It is a store of value unrelated to art.
  *   *Aesthetic:* The belief that despite blind tests, there *are* subtle differences only the player feels (tactile feedback).
  Again, the practice (paying the money) is compatible with all these theories.

  ### 3. Unified or Disunified Theory?
  Can one theory govern both the museum and the concert hall?

  **The Case for Disunity (Goodman's Distinction):**
  Nelson Goodman argued that painting is **autographic** (history of production matters) and music is **allographic** (only the score matters). Your experience confirms this.
  *   In the museum, the *object* is the work. Therefore, history matters.
  *   In the orchestra, the *sound* is the work. Therefore, perception matters.
  *   *However*, the instrument market complicates this. The orchestra treats the *instrument* as a museum piece.

  **The Case for Unity (The Heritage Theory):**
  A unified theory is possible if we define both institutions not as "Art Presenters" but as **"Heritage Preservers."**
  *   **Museum:** Preserves the *trace* of human creativity. (Hence: Forgery = False Trace; Roman Copy = True Trace of Rome).
  *   **Orchestra:** Preserves the *practice* of human creativity. (Hence: Performance = Living Practice; Instrument = Historical Tool).
  *   **The Conflict:** The museum freezes the trace; the orchestra animates the practice.
  *   **Resolution:** Both institutions rely on **provenance** to validate the connection to the past. The museum validates the object's past; the orchestra validates the performance's fidelity to the past (HIP) and the instrument's existence in the past.

  **Verdict:** A unified theory is possible only if we accept that **historical connection** is the primary value driver, not perceptual quality. However, this fails to explain why a *modern* performance on a *modern* cello is still "Bach."
  Therefore, a **Disunified Ontology** is more accurate:
  1.  **Visual Art:** The work is the **Artifact**. (Value = Genesis + Perception).
  2.  **Music:** The work is the **Structure**. (Value = Perception). The Instrument is a **Relic**. (Value = Genesis).

  Your friction arises because you are moving between a world where the *object is the work* (Museum) and a world where the *object is a tool for the work* (Orchestra), yet the tool is valued as if it were the work.

  ### 4. The Thought Experiment: Value as Entirely Perceptible Properties
  If you replaced the current presuppositions with the claim that **a work's value is entirely a function of its perceptible properties** (a radical aesthetic empiricism), the concrete changes would be seismic.

  **In the Museum:**
  *   **The Forgery:** The 90-year-old copy returns to the main gallery. The label reads: *"Dutch School, c. 1930. Aesthetic quality: High."* It is no longer a lie; it is a beautiful object. The "lie" was only about history, which is now irrelevant to value.
  *   **Posthumous Casts:** The distinction between authorized and unauthorized casts vanishes. If the bronze looks identical, it is the same work. Edition limits become meaningless marketing, not ontological boundaries.
  *   **Roman vs. Modern Copies:** A high-quality modern plaster cast of the *Doryphoros* hangs next to the Roman bronze. If the visual experience is identical, the value is identical. The Roman bronze loses its premium as a "witness."
  *   **Wall Labels:** Attribution dates and names become secondary to descriptions of visual effect. *"Red pigment applied with thick impasto"* replaces *"Rembrandt van Rijn."*
  *   **Acquisition/Deaccession:** You would deaccession "important" works that are damaged or faded in favor of pristine copies that look "better." You would acquire high-quality forgeries if they were cheap.
  *   **Insurance:** Valuations would plummet for "masterpieces" and rise for "copies." Insurance would cover the cost of commissioning a living artist to create a visually indistinguishable replacement, not the auction value of the historical unique.
  *   **Restoration:** Inpainting would be total. There would be no need to make retouching visible under UV light (current ethical standard) because the *history of the restoration* is not valuable. Only the final visual result matters. You would repaint lost areas to look perfect.

  **In the Orchestra:**
  *   **Instrument Pricing:** The price of a Stradivarius would collapse to the price of a top-tier modern cello (plus a small collector's premium unrelated to music). The market for old instruments would vanish as a *musical* market.
  *   **Blind Auditions:** Would extend to instruments. Orchestras might issue standard, high-quality new instruments to all players to ensure uniformity of sound, removing the "variable" of the instrument's history.
  *   **Period Performance:** The "Historically Informed Performance" movement would fracture. If the *sound* is the only value, using a modern cello is fine if it sounds Baroque. If a modern cello sounds better to a modern ear, that is the "authentic" choice. The obligation to use old tools disappears.
  *   **Recording:** A digitally perfected recording would be valued higher than a live one if the perceptual result is "flawless." The "truth" of the performance event matters less than the "truth" of the sound.

  ### 5. Summary of the Tension
  You are living in the gap between **Art as History** and **Art as Experience**.

  *   **Your Museum** assumes **Art as History**. The object is a document. A forgery is a forged document. It doesn't matter if the text is beautiful; if the signature is fake, the document is worthless for historical purposes.
  *   **Your Orchestra** assumes **Art as Experience** (regarding the music) but **Art as History** (regarding the instruments). This is the inconsistency. The musicians treat the *sound* as the art (perceptual), but the *market* treats the *cello* as the art (historical).

  **Philosophically Underdetermined Area:**
  The specific point where the **Posthumous Cast** meets the **Forgery**.
  *   *Theory A (Causal):* The cast is valid because the mold was made by the artist (physical link). The forgery has no link.
  *   *Theory B (Institutional):* The cast is valid because the Estate said so. The forgery has no permission.
  *   *Theory C (Aesthetic):* Both are valid if they look good. (Rejected by practice).
  *   *Theory D (Scarcity):* Both are invalid if they flood the market. (Rejected by practice, as authorized casts are allowed).

  Your practice strictly presupposes **Theory B (Institutional/Contractual)** regarding the cast, and **Theory A (Causal)** regarding the forgery. This is a contradiction. The estate's paperwork creates a causal link where none physically exists (the artist didn't pour the bronze), while the forger's physical link (hand-pouring the paint) is invalidated by lack of paperwork.
  **Conclusion:** The practice presupposes that **Authority supersedes Physics.** The "Work" is a legal-metaphysical construct defined by who has the right to say "This is it."

  If you wish to resolve the friction in your own mind, you must accept that the museum is not primarily in the business of "Beauty" (Perception) but of "Truth" (Provenance), while the orchestra is in the business of "Sound" (Perception), burdened by a market that treats tools as Truth. The friction is real because the ontologies are genuinely different.
