  9.  **Refining the "Underdetermination" Section:**
      *   Need to be careful here. The user asks what is *strictly presupposed* vs. *comfortable*.
      *   Strictly presupposed: The identity of the work is not identical to its physical manifestation (since posthumous casts count). The identity *is* tied to a specific chain of authority (since forgeries don't count).
