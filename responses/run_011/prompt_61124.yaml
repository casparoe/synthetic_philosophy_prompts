answer: |-
  **The Scenario**

  Dr. Aris drifts in the standard expanding universe. Her vessel is at rest relative to the local cosmic matter, confirmed by the isotropy of the background radiation. To construct a global "now," she broadcasts a synchronization pulse to her neighbors, who are also at rest relative to the matter flow. They reflect it back; she defines the reflection event as simultaneous with her clock's midpoint. Because the matter worldlines are everywhere orthogonal to a family of spacelike hypersurfaces, this procedure stitches together seamlessly across the cosmos. Aris produces a coherent map of successive layers, a global cosmic time that orders every event into a unique past, present, or future. She stops only because the universe has a beginning, not because the ordering breaks.

  Dr. Borel drifts in the Gödel universe. Her vessel is also at rest relative to the local matter; the galaxies around her have zero peculiar velocity. However, her gyroscopes precess relative to the matter distribution, revealing that the cosmos is rotating. She attempts Aris's procedure: she sends light signals to neighbors at rest with her to define simultaneity. Locally, the radar echoes return normally. But as Borel extends this chain of synchronization outward, relying on the matter frame to define "rest," she finds the definition is path-dependent. If she synchronizes clockwise around a loop of observers, her clock disagrees with the starting point when the loop closes. To force a global layer, she would have to declare events simultaneous that are causally connectable by a future-directed timelike curve. Her instruments do not show a paradox yet, but they show that the "layers" twist into each other. She cannot produce the map Aris did; the procedure yields contradictions before she ever pilots her ship along a closed curve.

  **The Demonstration**

  **Level Assessment:**
  *   **Aris (FLRW):** Passes Level 1 (accepts relativity of simultaneity for moving observers), Passes Level 2 (matter frame provides a preferred slicing), Passes Level 3 (causal order is acyclic). Her failure to find an *absolute* time is purely the SR effect (Level 1), but she successfully constructs a *cosmic* time.
  *   **Borel (Gödel):** Passes Level 1. **Fails Level 2.** This is the critical juncture. Even granting the matter rest frame (which she can locally identify via zero peculiar velocity), there is no spacelike hypersurface orthogonal to those worldlines. The rotation of the matter relative to the compass of inertia tilts the light cones such that no global "now" exists. She consequently fails Level 3 (CTCs exist), but she discovers this *via* the failure of Level 2.

  **Load-Bearing Feature:**
  Level 2 is the load-bearing feature of Gödel's argument. Level 3 (CTCs) is the dramatic consequence, but Level 2 (the impossibility of foliation) is what blocks the "retreat position" of the becoming defender. The defender argues: "SR kills absolute time, but *our* universe has a preferred foliation defined by matter." Gödel shows a solution where matter exists but *does not* define a foliation. If objective becoming requires a global succession of presents, and the laws of physics allow a universe where matter cannot support such a succession, then "becoming" is not a necessary feature of time. The CTCs merely reinforce that the causal order itself is not a partial order, but the lack of orthogonal slicing is what prevents the definition of the "layers" in the first place.

  **The Removal Test:**
  Suppose Borel is confined to a region inside the critical radius where no CTC can be completed.
  *   **What changes:** She cannot verify Level 3 empirically. She cannot travel to her own past.
  *   **Does the case collapse:** It weakens, but does not fully collapse. Locally, she can still define a time coordinate. However, the *rotation* (gyroscope precession relative to matter) is still locally detectable. If she assumes the universe is homogeneous (a standard cosmological assumption), the local rotation implies the global structure that prevents foliation. If she denies homogeneity and assumes she is in a local rotating eddy within a larger non-rotating universe, the argument fails. Gödel's argument relies on the *modal* point: if a homogeneous rotating universe is possible, then the concept of time cannot depend on the specific matter distribution. Confining her removes the global verification, forcing her to rely on the theoretical extrapolation from local rotation. The argument shifts from "I cannot build the map" to "The laws allow a universe where the map cannot be built."

  **Counterattack:**
  A defender of objective becoming has three main lines of fire:
  1.  **The Local Surrogate:** Argue that becoming is a local phenomenon, not a global one. If Borel experiences local succession and local causality, that is sufficient for "time." The global topology is irrelevant to the phenomenology of passage.
  2.  **The Actualist Defense:** Argue that metaphysical possibility is constrained by actuality. Even if Gödel universes are mathematically consistent solutions to GR, they may be physically impossible (e.g., unstable, or ruled out by boundary conditions). If *our* universe is FLRW, the concept of time is valid for *us*, regardless of what happens in exotic solutions. Gödel's move from "possible" to "actual nature of time" is the weak link.
  3.  **Causal Asymmetry:** Argue that the arrow of time is grounded in thermodynamic or causal asymmetry (radiation), not geometric foliation. Borel still sees radiation move outward, not inward. As long as local causal order holds, becoming persists.

  **Flags on Design and "Cheats":**
  1.  **Expansion vs. Stationarity:** The scenario pairs an *expanding* universe (FLRW) with a *stationary* one (Gödel). FLRW has a singularity (Big Bang); Gödel does not. This is a confounding variable. A stricter comparison would be Gödel vs. the Einstein Static Universe. However, since the user requested the "usual" expanding universe, I have retained it, but note that Aris's ability to slice is due to the irrotational nature of the dust, not the expansion itself.
  2.  **Homogeneity:** The argument assumes Borel knows her universe is homogeneous. If she suspects she is in a local rotating bucket within a larger static universe, she could theoretically define a global time outside her region. Gödel's solution is homogeneous, so the rotation is everywhere, but this is a global assumption not strictly forced by local data alone.
  3.  **Level 2 vs. Level 3 Dependency:** In the Gödel metric, the failure of global foliation (Level 2) and the existence of CTCs (Level 3) are intimately linked. The tilting of light cones that prevents the spacelike slice is the same tilting that eventually allows the timelike curve to close. It is difficult to completely separate them physically, though they are distinct conceptually. The "Removal Test" attempts to separate them, but strictly speaking, if the light cones tilt enough to break foliation, they tilt enough to allow CTCs *somewhere*. Confining Borel just keeps her from seeing the *somewhere*.
