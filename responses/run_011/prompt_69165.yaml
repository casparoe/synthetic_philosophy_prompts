      *   Section 1: Move-by-move adjudication.
      *   Section 2: Talking past each other (Conceptions of Free Will).
      *   Section 3: Empirical Assumption (Nature of RP).
      *   Section 4: Missing Consideration (Distal Intention).
      *   Conclusion: Overall winner and nature of dispute.

