prompt: |-
  I just started a job doing model evals — writing test batteries and then arguing all day about what a passing score actually entitles us to say about a system. Half my team talks nonstop about dispositions: the model is disposed to flatter the user, disposed to refuse, disposed to grab the shortcut. A teammate with a metaphysics background then pointed out that our vocabulary is a total mess, because an eval suite is exactly the setup philosophers say breaks disposition talk. A jailbreak prompt that leaves the tendency in place but stops it showing up looks like a mask. A fine-tune that deletes a behavior without ever eliciting it looks like a fink. And a model that aces the battery for reasons that have nothing to do with the disposition looks like a mimic. Before I write the conceptual appendix for our protocol I want the metaphysics straight, and I want it as a spec, not a survey.

  So: write the desiderata — what any adequate theory of dispositions has to deliver.

  I want the requirements themselves to carry the weight. For each one, give the case or consideration behind it, and be explicit about how demanding it is. Specifically I'm after:

  - which phenomena the theory has to explain or explain away. At minimum: why the naive conditional analysis (to be soluble just is to be such that it would dissolve if placed in water) goes wrong; finks; masks; mimics, where something manifests without having the property at all; the reverse case where the disposition gets *acquired* precisely when the triggering conditions show up; dispositions that never get a single chance to manifest; degrees and comparison, i.e. one thing being more disposed than another; and dispositions with many different manifestation types rather than one stimulus and one response.
  - which distinctions it must not collapse. Having versus manifesting. Being fragile versus merely being breakable. Intrinsic versus extrinsic. The disposition versus whatever underlying property does the work. Ability versus performance — that last one is the distinction my team actually needs and we've been using the words interchangeably.
  - what it has to be consistent with, and, honestly, which of those consistency demands are load-bearing versus which are one camp's taste wearing a requirement costume. Is "dispositions must be intrinsic" a real constraint or a physicalist's preference? Is the complaint that dispositional explanations are trivially circular — that saying opium causes sleep because it has a sleep-causing power explains nothing — a genuine desideratum or a hangover from positivism? Does the theory have to square with fundamental physics, where the basic properties look structural rather than powerful? Mark which of these I'd be free to drop.
  - any subset of the desiderata you think cannot be jointly satisfied. My guess is that "dispositions are intrinsic" + "there's a true conditional analysis of them" + "finks are genuinely possible, not just an artifact of sloppy description" is a bad triangle, but I may have mis-stated it, and if the real unsatisfiable cluster is a different one I want that instead. If the list turns out to be a result in itself, say so and show the proof sketch.

  Then, briefly — a paragraph each, no more — how the main contenders do against the list: the simple conditional analysis, the Lewis-style reformed analysis built on ideal conditions, the approach that takes potentialities and their degrees as primitive, and the view that all properties are dispositional through and through. For each, name the requirement it flunks and what it gives up to satisfy the others.

  Last thing, and it's the reason I'm asking: tell me which desideratum, if any, decides whether we're allowed to say "this model has disposition D" on the strength of a test battery. If the metaphysics can't settle that, just say so plainly and then tell me what a passing eval is actually evidence of instead.

  No bibliography, no citations, no reading list — I can't chase references and a list of names would be useless to me. Give me the arguments and the cases. If you need a technical term, gloss it in a clause the first time. A table is fine for the requirements if its cleaner, but keep the motivating case visible next to each row rather than banishing it to a footnote.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Someone working in AI model evaluation (evals), specifically dealing with test batteries and interpreting scores.
      *   **Problem:** The team uses dispositional language ("disposed to flatter," "disposed to refuse"), but a teammate with a metaphysics background claims their vocabulary is messy because eval setups trigger classic philosophical problems with dispositions (masks, finks, mimics).
      *   **Task:** Write the *desiderata* (requirements) for an adequate theory of dispositions.
      *   **Format:** Spec-like, not a survey. Requirements must carry the weight. Explicit about demands.
      *   **Content Requirements:**
          *   Phenomena to explain/explain away (Naive Conditional Analysis failures, finks, masks, mimics, reverse finks/acquisition, unmanifested dispositions, degrees/comparison, multi-track dispositions).
          *   Distinctions to maintain (Having vs. Manifesting, Fragile vs. Breakable, Intrinsic vs. Extrinsic, Disposition vs. Categorical Base, Ability vs. Performance).
          *   Consistency demands (Intrinsicness, Circularity/Triviality, Fundamental Physics). Distinguish load-bearing from taste.
          *   Incompatibilities (Identify any "bad triangles" or unsatisfiable clusters).
          *   Contender Assessment (Simple Conditional, Lewis-style, Primitivist, Pandispositionalism) - brief, one paragraph each.
          *   The "Killer Question": Which desideratum decides if a test battery justifies saying "Model has disposition D"? If metaphysics can't settle it, say what the eval *is* evidence of.
      *   **Constraints:** No bibliography, no citations, no reading list. Gloss technical terms. Table is okay for requirements but keep cases visible.

  2.  **Deconstruct the Metaphysics of Dispositions:**
      *   *Core Concept:* A disposition is a property like fragility, solubility, or irritability. It's about *what would happen* under certain conditions, not just *what is happening*.
      *   *The Naive Problem:* "X is soluble iff if X were immersed in water, it would dissolve."
      *   *The Counterexamples:*
          *   *Fink:* The disposition disappears right when the trigger happens (e.g., a wizard makes the glass non-fragile the moment it's struck).
          *   *Mask:* The disposition stays, but something blocks the manifestation (e.g., packing foam prevents the glass from breaking even though it's fragile).
          *   *Mimic:* The manifestation happens without the disposition (e.g., a wizard breaks the glass when struck, even though it's steel).
      *   *The AI Context:*
          *   *Jailbreak as Mask:* The model *wants* to refuse (disposition), but the prompt structure prevents the refusal from outputting.
          *   *Fine-tune as Fink:* The safety training removes the "refusal" weights exactly when the safety trigger is detected.
          *   *Sycophancy as Mimic:* The model outputs agreement not because it's "disposed to agree" but because it predicts tokens that look like agreement based on context, without an underlying "agreeableness" trait.

  3.  **Drafting the Desiderata (The Spec):**
      *   Need to structure this clearly. A table or structured list is best. Let's go with a structured list for depth, as requested ("requirements themselves to carry the weight").
      *   *Category 1: Phenomenological Coverage.* Must handle the counterexamples to the Simple Conditional Analysis (SCA).
      *   *Category 2: Conceptual Distinctions.* Must keep ability separate from performance.
      *   *Category 3: Metaphysical Consistency.* Intrinsicness, Causal Basis, Physics.
      *   *Category 4: Incompatibilities.* The "Impossible Trinity."

  4.  **Addressing Specific Points:**
      *   *Naive Conditional:* Must explain why "If triggered, then manifests" isn't sufficient or necessary.
      *   *Finks/Masks/Mimics:* Must distinguish these.
      *   *Degrees:* Fragility comes in degrees.
      *   *Multi-track:* Solubility applies to water, acid, etc.
      *   *Intrinsic vs. Extrinsic:* Is fragility in the glass or the glass+environment?
      *   *Ability vs. Performance:* Crucial for the user. A model can have the ability (disposition) but fail the test (performance) due to masking.
      *   *Physics:* Do fundamental particles have dispositions? Or is everything categorical?
      *   *Circularity:* Is "dormitive virtue" (opium sleeps because of sleep-power) a bug or a feature?

  5.  **Identifying the "Bad Triangle":**
      *   The user guessed: Intrinsic + True Conditional + Finks possible.
      *   Refinement: It's usually (1) SCA is true, (2) Dispositions are Intrinsic, (3) Extrinsic interferers (Finks/Masks) exist. You can't have all three. If Finks exist, SCA fails. If SCA is true, you must deny Finks are possible or say they change the intrinsic nature.
      *   Actually, the deeper tension is often: (1) Dispositions are Intrinsic, (2) Dispositions are defined by Conditionals, (3) Conditionals are sensitive to Extrinsic factors.
      *   Let's formulate the "Impossible Trinity" clearly for the AI context.

  6.  **Assessing Contenders:**
      *   *Simple Conditional Analysis (SCA):* Fails Finks/Masks.
      *   *Lewis (Reformed):* Adds "ceteris paribus" or "causal basis." Handles Finks better, but struggles with defining the "basis" without circularity.
      *   *Primitivism (Potentialities):* Takes dispositions as real, irreducible properties. Solves SCA problems, but ontologically expensive (spooky powers).
      *   *Pandispositionalism:* Everything is a disposition. Risks circularity (world of pure potentiality with no actualizer?).

  7.  **Answering the "Killer Question" (The Evals):**
      *   Can a test battery prove a disposition?
      *   *Metaphysical Answer:* No. Tests measure *manifestations*, not dispositions. A passing eval is evidence of *reliable performance under test conditions*, not necessarily an intrinsic disposition.
      *   *Why?* Because of Masks and Mimics. You can pass without the disposition (Mimic) or fail with it (Mask).
      *   *What is it evidence of?* Predictive reliability within the distribution of the test. It's behavioral, not ontological.

  8.  **Refining the Tone:**
      *   The user wants a "spec," not a survey. Direct, demanding, precise.
      *   No citations.
      *   Gloss terms.
      *   Keep it tight.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Intrinsic":* Many modern philosophers think dispositions *can* be extrinsic (e.g., key fits lock). I should mark "Intrinsicness" as a contested desideratum, not a hard requirement. The user asked to distinguish load-bearing from taste.
      *   *Self-Correction on "Circularity":* The "dormitive virtue" objection is often overstated. Dispositional explanations are useful even if not reductive. I need to flag this as "taste" vs. "hard constraint."
      *   *The "Bad Triangle":* The user's guess was close. The real conflict is between *Reductionism* (Dispositions = Conditionals), *Intrinsicness*, and *Interference*. If you want Reductionism, you lose Intrinsicness or have to deny Interference. If you want Intrinsicness + Interference, you must abandon Reductionism (go Primitivist).

  10. **Final Review against Constraints:**
      *   Table for requirements? Yes, keeps it clean.
      *   Motivating case visible? Yes.
      *   Contenders paragraph each? Yes.
      *   Killer Question answered plainly? Yes.
      *   No citations? Yes.

  11. **Final Polish:** Ensure the AI eval context is woven into the examples (jailbreaks, fine-tuning) to make it relevant, while keeping the metaphysics rigorous. (Self-correction: The prompt asks for the metaphysics straight *first*, then the application. I will keep the examples generic but clear, then apply in the final section).

      *Wait, one detail:* "If the list turns out to be a result in itself, say so and show the proof sketch." I need to make sure the "Impossible Trinity" is presented as a logical result, not just an opinion.

      *Let's structure the "Impossible Trinity" carefully:*
      1.  **Reduction:** Dispositions are nothing over and above conditional facts (If S, then M).
      2.  **Intrinsicness:** The disposition belongs to the object alone, not its environment.
      3.  **Sensitivity:** The truth of the conditional depends on the environment (Finks/Masks).
      *Conflict:* If 1 and 2 are true, the conditional must depend only on the object. But 3 says the conditional depends on the environment. Therefore, 1, 2, and 3 cannot all be true.
      *Choice:* Drop Reduction (Primitivism), Drop Intrinsicness (Extrinsic dispositions), or Drop Sensitivity (Deny Finks/Masks are possible/relevant).

      *Okay, ready to write.*
answer: |-
  # SPECIFICATION: ADEQUACY CONDITIONS FOR A THEORY OF DISPOSITIONS

  **Objective:** Define the necessary conditions for a metaphysical account of dispositions (properties like fragility, solubility, or *refusal-tendency*) that supports valid inference from test batteries to system capabilities.

  **Terminology:**
  *   **Stimulus (S):** The triggering condition (e.g., immersion in water, a jailbreak prompt).
  *   **Manifestation (M):** The resulting event (e.g., dissolving, refusing).
  *   **Categorical Base:** The underlying structural property that grounds the disposition (e.g., molecular bonding, model weights).
  *   **Simple Conditional Analysis (SCA):** The claim that "X is disposed to M if S" means exactly "If S were to happen, M would happen."

  ---

  ## 1. PHENOMENOLOGICAL COVERAGE
  *The theory must account for the behavior of dispositional ascriptions in edge cases. Failure here renders the theory empirically inadequate.*

  | Requirement | Motivating Case / Consideration | Demand Level |
  | :--- | :--- | :--- |
  | **R1: SCA Failure Accommodation** | **The Broken Lamp:** A lamp is disposed to light when switched. The wiring is perfect. But the power grid is down. The conditional "If switched, it lights" is false, but the disposition remains. The theory must explain why the disposition exists despite the false conditional. | **Hard.** Any theory retaining SCA is immediately falsified by standard interference cases. |
  | **R2: Fink Handling** | **The Sorcerer's Glass:** A fragile glass is struck. A sorcerer sees this and instantly casts a spell to make it non-fragile *before* it breaks. The glass does not break. The conditional "If struck, it breaks" is false. The disposition was lost *upon* triggering. The theory must distinguish this from a mask (where disposition remains). | **Hard.** Requires distinguishing disposition *loss* from manifestation *prevention*. |
  | **R3: Mask Handling** | **The Packing Foam:** A fragile glass is wrapped in foam and struck. It does not break. The disposition (fragility) is still there, but the manifestation is blocked. The theory must allow "Disposed to M" to be true even if "If S, then M" is false. | **Hard.** Critical for evals: a safety filter might mask a model's capability to generate harmful code. |
  | **R4: Mimic Handling** | **The Wizard's Steel:** A steel bar (not fragile) is struck. A wizard makes it shatter magically. The conditional "If struck, it breaks" is true. But the bar is not fragile. The theory must prevent true conditionals from entailing dispositions. | **Hard.** Critical for evals: a model might output refusal due to prompt formatting (mimic) rather than safety training (disposition). |
  | **R5: Reverse Finks (Acquisition)** | **The Smart Metal:** A metal bar is not fragile. But it has a sensor: if it is struck, it instantly reconfigures its molecular structure to become fragile *before* breaking. The conditional is true, but the disposition was not present *at the start*. | **Medium.** Shows dispositions can be time-indexed to the stimulus onset. |
  | **R6: Unmanifested Dispositions** | **The Immortal Goblet:** A fragile goblet exists in a vacuum forever. It is never struck. It is still fragile. The theory cannot define dispositions solely by their actual manifestations. | **Hard.** Dispositions are modal (about possibilities), not actual. |
  | **R7: Degrees and Comparison** | **Hardness Scale:** Diamond is more disposed to resist scratching than talc. One model is *more* disposed to refuse than another. The theory must support ordering and magnitude, not just binary presence/absence. | **Medium.** Required for scoring evals (e.g., 0-5 safety scale). |
  | **R8: Multi-Track Support** | **Solubility:** Sugar dissolves in water, tea, and coffee. A disposition can have one base but many possible stimulus/manifestation pairs. The theory cannot require a unique S-M pair for every disposition. | **Medium.** Models have one weight set (base) but many behavioral triggers. |

  ---

  ## 2. CONCEPTUAL DISTINCTIONS
  *The theory must preserve specific boundaries. Collapsing these renders the vocabulary useless for engineering.*

  | Requirement | Motivating Case / Consideration | Demand Level |
  | :--- | :--- | :--- |
  | **R9: Having vs. Manifesting** | **The Untriggered Bomb:** A bomb has the disposition to explode. It sits in a vault. It has not exploded. The theory must allow the property to exist without the event occurring. | **Hard.** Collapsing this makes "latent capability" incoherent. |
  | **R10: Fragile vs. Breakable** | **The Plastic Bottle:** A plastic bottle is breakable (it can be broken by enough force) but not fragile (it doesn't break easily). "Fragile" implies a low threshold; "Breakable" implies mere possibility. The theory must distinguish threshold sensitivity from mere possibility. | **Medium.** Distinguishes "jailbreakable" (possible) from "easily jailbroken" (fragile). |
  | **R11: Intrinsic vs. Extrinsic** | **The Key and Lock:** Is the key "disposed to open the lock"? This depends on the lock's shape (extrinsic). Is the glass "disposed to break"? This depends on the glass structure (intrinsic). The theory must specify whether dispositions belong to the object or the object+environment system. | **Contested.** See Consistency Constraints below. |
  | **R12: Disposition vs. Categorical Base** | **The Twin Earth:** Two objects behave identically (same disposition) but have different internal structures (different bases). The theory must allow the disposition to be the same property even if the underlying machinery differs. | **Medium.** Needed to say "Model A and Model B both have refusal dispositions" despite different architectures. |
  | **R13: Ability vs. Performance** | **The Choked Athlete:** A golfer has the ability (disposition) to sink the putt. She misses (performance failure) due to nerves (mask). The theory must distinguish the capacity from the output. | **Critical.** This is the primary failure mode of your eval team's vocabulary. |

  ---

  ## 3. CONSISTENCY CONSTRAINTS
  *The theory must fit within a broader metaphysical worldview. Some constraints are load-bearing; others are philosophical preference.*

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **C1: Non-Circularity** | **Taste.** | The complaint that "opium causes sleep because of its dormitive virtue" is trivial is a positivist hangover. Dispositional explanations are valid even if they don't reduce to non-dispositional terms. *Drop if necessary.* |
  | **C2: Compatibility with Physics** | **Load-Bearing.** | If fundamental physics describes the world as categorical (structures/fields) rather than powerful (potentials), a theory requiring irreducible dispositions conflicts with physicalism. However, if quantum propensities are real, this constraint is met. |
  | **C3: Intrinsicness** | **Taste (with costs).** | Many philosophers insist dispositions must be intrinsic to the object. However, R11 (Key/Lock) suggests many useful dispositions are extrinsic. *You may drop this, but you lose the ability to say the capability is "in the model" independent of the user.* |
  | **C4: Causal Efficacy** | **Load-Bearing.** | The disposition must do causal work. If the disposition is just a summary of behaviors, it doesn't explain the behavior. For evals, you need the disposition to be the *cause* of the passing score, not just a label for it. |

  ---

  ## 4. THE IMPOSSIBLE TRINITY (INCOMPATIBILITY RESULT)

  You suspected a bad triangle. You were close, but the precise conflict is sharper. You cannot jointly satisfy the following three claims. One must be abandoned.

  1.  **Reductionism:** Dispositions are fully analyzable as Conditional Facts (SCA is true, perhaps with "ideal conditions" added).
  2.  **Intrinsicness:** Dispositions are intrinsic properties of the object (independent of the environment).
  3.  **Interference:** Finks and Masks are genuinely possible (the environment can alter the S-M link without altering the object's intrinsic nature).

  **Proof Sketch:**
  *   Assume **Reductionism**: To have disposition D is just to satisfy Conditional C ("If S, then M").
  *   Assume **Interference**: The truth value of Conditional C depends on extrinsic factors (e.g., the presence of a mask or fink in the environment).
  *   Therefore, having disposition D depends on extrinsic factors.
  *   This contradicts **Intrinsicness**.
  *   *Conclusion:* You must drop one.
      *   Drop Reductionism → **Primitivism** (Dispositions are real, irreducible powers).
      *   Drop Intrinsicness → **Extrinsic Dispositions** (Capabilities are relations, not properties).
      *   Drop Interference → **Denial** (Claim Finks/Masks are impossible or change the intrinsic nature).

  **Recommendation for Evals:** Drop **Intrinsicness**. In AI, a "capability" is always a relation between Model + Prompt + Environment. Treating it as intrinsic to the weights is the source of your team's confusion.

  ---

  ## 5. CONTENDER ASSESSMENT

  **Simple Conditional Analysis (SCA)**
  *   **Verdict:** Fails immediately.
  *   **Flunks:** R1, R2, R3, R4.
  *   **Trade-off:** It sacrifices accuracy for simplicity. It cannot distinguish a masked disposition from a missing one. In your context, it forces you to say a model *lacks* a refusal disposition just because a jailbreak bypassed the filter. It is unusable for high-stakes evals.

  **Lewis-Style Reformed Analysis (Causal Basis + Ideal Conditions)**
  *   **Verdict:** Functional but fragile.
  *   **Flunks:** R5 (Reverse Finks).
  *   **Trade-off:** Lewis adds "holding the causal base fixed" to the conditional. This handles masks well. However, it struggles to define "ideal conditions" without circularity (ideal for what?). It satisfies Reductionism but forces you to treat dispositions as extrinsic (violating C3) to handle Finks. It is the industry standard for a reason, but it leaks on edge cases.

  **Primitivism (Potentialities as Primitive)**
  *   **Verdict:** Metaphysically robust, operationally opaque.
  *   **Flunks:** C1 (Non-Circularity).
  *   **Trade-off:** Treats dispositions as real, irreducible properties (powers). It solves R1-R8 perfectly because the disposition exists regardless of the conditional. However, it violates the positivist demand for non-circular explanation. For your team, it says "The model has the power," which is true but doesn't tell you how to measure it without testing the conditional anyway.

  **Pandispositionalism (All Properties are Dispositions)**
  *   **Verdict:** Coherent but totalizing.
  *   **Flunks:** C2 (Compatibility with Categorical Physics).
  *   **Trade-off:** Claims even mass and charge are just dispositions to interact. This dissolves the distinction between Disposition and Categorical Base (R12). It makes the whole world a web of potentials. While elegant, it offers no leverage for distinguishing a "safety disposition" from a "structural weight configuration." It collapses the ontology you need to debug the system.

  ---

  ## 6. THE DECIDING DESIDERATUM FOR EVALS

  **The Question:** Which desideratum decides whether we're allowed to say "this model has disposition D" on the strength of a test battery?

  **The Answer:** **R13 (Ability vs. Performance)**, supported by the rejection of **Intrinsicness (C3)**.

  **The Reasoning:**
  Metaphysics cannot settle whether a test battery proves a disposition. A test battery measures *manifestations* (Performance). As established by R3 (Masks) and R4 (Mimics), Performance and Ability can come apart. You can pass the test without the disposition (Mimic/Sycophancy) and fail the test with the disposition (Mask/Filter).

  Therefore, a passing eval is **not** evidence of a disposition in the strict metaphysical sense. It is evidence of **reliable counterfactual stability within the tested distribution.**

  **The Spec for Your Protocol:**
  Do not write "The model is disposed to refuse."
  Write: "The model exhibits **stable refusal behavior** under stimulus set S, contingent on environmental conditions E."

  If you claim the disposition is *intrinsic* (in the weights), you are making a metaphysical claim your evals cannot support. You are inferring an intrinsic power from extrinsic performance. This is the "Mimic" risk.

  **What a passing eval is actually evidence of:**
  It is evidence of a **reliable input-output mapping** that persists across the test battery's variation. It justifies the claim: "Under conditions similar to this battery, the system will perform X." It does *not* justify: "The system has an internal tendency toward X."

  If you need to claim the latter (for safety guarantees), you must supplement the eval with **mechanistic interpretability** (inspecting the Categorical Base/Weights). Without inspecting the base, you cannot distinguish a Mimic from a Disposition. Metaphysically, you are stuck at the level of Behaviorism.
