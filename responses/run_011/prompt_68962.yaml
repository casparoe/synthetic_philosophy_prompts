answer: |-
  The Szaszian reform package is structurally doomed to expand coercive confinement because it removes the only bureaucratic friction that slowed down the state's drive to incarcerate the unsettling. By demanding the state stop pretending to heal and start admitting it punishes, you remove the logical endpoint of confinement. A hospital must release a patient upon cure; a prison must release a prisoner upon served time; but a system designed to neutralize danger based on expert risk forecasts has no inherent stopping point. When you ban the language of illness, you do not ban the perception of deviance, you merely strip that deviance of the procedural protections attached to the medical label. The state still faces the same political pressure to remove frightening individuals from the street, and without the commitment hearing as a pressure valve, that pressure flows directly into sentencing enhancements and preventive detention statutes.

  The tell you identified is the fulcrum of the collapse. Szasz objected to the sign on the building, not the lock on the door, and by conceding the legitimacy of the cage so long as it is called a prison, he conceded the state's right to incarcerate people for behaviors that are often manifestations of the very conditions he sought to depathologize. Once you grant the state the power to lock up based on behavior alone, you invite the legislature to define "behavior" broadly enough to capture the irrational, the disruptive, and the socially unintelligible. Without the insanity defense, a defendant acting on delusions is fully responsible, which means they are fully punishable. But because their behavior signals high risk, the system applies risk-assessment tools to determine parole or post-sentence civil confinement. These tools are administered by the same experts—psychologists and social workers—now rebranded as risk analysts. Their testimony is no longer about internal states, which could be contested as subjective medical opinions, but about statistical probabilities of recidivism, which are much harder to challenge in court and carry the veneer of objective data.

  This shift creates a system with fewer protections than the one it replaced. Under the therapeutic model, a commitment required a finding of mental illness and dangerousness, and theoretically offered treatment leading to release. Under the "honest" punitive model, a defendant receives a fixed sentence for the crime, followed by indefinite preventive detention based on dangerousness. There is no "cure" to argue for, only a risk score that changes slowly, if at all. The expert witness is no longer barred from testifying about the defendant's head; they are simply asked to testify about the defendant's future rather than their present. This allows the state to lock people up for longer periods with a lower burden of proof, justified by public safety rather than medical necessity. The hypocrisy of the therapeutic state acted as a constraint; it forced the state to justify confinement through a framework that allowed for the possibility of liberty. The honesty of the punitive state removes that constraint, leaving only the calculus of risk.

  For your protagonist, this realization is the destruction of their professional identity. They campaigned for a system that treated adults as responsible agents, believing that responsibility conferred dignity. Instead, they built a machine that treats responsible agents as permanent risks. They stripped away the medical excuse, thinking it would liberate their clients, but they actually liberated the state to punish without the obligation to care. The protagonist now stands in a courtroom where the experts are back, louder than before, offering risk scores that seal fates with mathematical finality. There is no cross-examination for a algorithm, no appeal against a statistic. The protagonist fought for truth, but the truth is that the state wants to lock people up, and the medical model was the only thing making it expensive and difficult to do so. They didn't end the therapeutic state; they optimized it for detention.
