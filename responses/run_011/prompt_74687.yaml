answer: |-
  ### Brainstorming and Elimination

  You're right to feel the gap. There isn't a single, canonical term like "Homunculus Fallacy" that captures this specific structural error across biology, AI, and cognitive science. I'm going to walk through the neighbors to show why they miss the mark, then offer a coinage that carves the phenomenon at its joints.

  **1. The Homunculus Fallacy**
  *   *Why it tempts:* It's about smuggled competence.
  *   *Why it fails:* As you noted, there is no little man. The competence isn't hidden in a sub-routine; it's distributed in the *relations* between the system and its world. A homunculus is a component error; your pattern is a *boundary* error. To make your cases fit "homunculus," you'd have to argue the environment itself is the homunculus, which stretches the term until it snaps.

  **2. Begging the Question (Petitio Principii)**
  *   *Why it tempts:* The conclusion (the capacity exists) is assumed in the setup.
  *   *Why it fails:* Logical begging happens in propositional space. Your pattern happens in *parameter* space. No single premise asserts the conclusion. The "assumption" is embedded in the topology of the search space or the definition of the reward function. It's structural, not syntactic. To make this fit, you'd have to treat boundary conditions as premises, which is a category shift most logicians wouldn't accept without heavy qualification.

  **3. Derived Intentionality (Searle et al.)**
  *   *Why it tempts:* It covers your Case (2) perfectly. The meaning is borrowed from the experimenter.
  *   *Why it fails:* It doesn't reach Case (1) or (3). "Food-finding" in ALife isn't necessarily intentional content; it's functional capacity. Moral modeling isn't about semantics; it's about causal genesis. "Derived Intentionality" is too narrow; it targets *meaning*, whereas your pattern targets *explanatory lift* (capacity, function, normativity).

  **4. The Frame Problem**
  *   *Why it tempts:* It's about what is left out of the model.
  *   *Why it fails:* The Frame Problem is about what an *agent* fails to represent (or what a modeler fails to constrain). Your pattern is about what the modeler *successfully but illicitly constrains*. It's not a failure to frame; it's a framing that does too much work.

  **5. Overfitting / Triviality (Computational Theory)**
  *   *Why it tempts:* The model works only on this specific data/setup.
  *   *Why it fails:* "Overfitting" is a statistical failure of generalization. "Triviality" is a mapping claim (anything implements everything). Your pattern is stronger: the mechanism *does* work, and it *is* non-trivial engineering, but the *explanation* for why it works is misattributed. It's not that the model is bad; it's that the *story* about the model is false.

  **Verdict:** There is no established term. "Rigging" is colloquial. "Hidden Assumptions" is too broad. "Derived Intentionality" is too narrow. We need a coinage.

  ***

  ### The Coinage: Parametric Smuggling

  I propose **Parametric Smuggling**.

  It captures the idea that the explanatory heavy-lifting is moved from the *mechanism* (the dynamics) to the *parameters* (the setup, boundary conditions, reward functions, idealizations). It distinguishes itself from "begging the question" by locating the error in the model architecture rather than the argument structure.

  #### (a) Definition
  **Parametric Smuggling** occurs when an explanation attributes a high-level capacity $C$ to a mechanism $M$, but the realization of $C$ is causally dependent on boundary conditions $B$ selected by the modeler such that $B$ encodes the solution space for $C$.

  Formally: An explanation commits Parametric Smuggling if the mutual information between the outcome and the boundary conditions is significantly higher than the mutual information between the outcome and the internal dynamics of the mechanism, *and* this dependency is not explicitly acknowledged as part of the explanatory claim.

  In a referee report, you would write: *"This model exhibits Parametric Smuggling: the fitness function/reward structure presupposes the very adaptive landscape the mechanism is claimed to generate."*

  #### (b) Nearest Existing Concepts & Boundaries

  **1. Derived Intentionality**
  *   *Boundary:* Derived Intentionality applies to *semantic content* (meaning). Parametric Smuggling applies to *functional capacity* (doing).
  *   *Shift required:* For your Case (2) to be *only* Derived Intentionality, the complaint would have to be solely about "meaning." But your complaint is that the *causal story* is fake. Parametric Smuggling covers the causal theft, not just the semantic borrowing.

  **2. Idealization (in Philosophy of Science)**
  *   *Boundary:* Legitimate idealization removes *noise* (irrelevant variables). Parametric Smuggling removes *friction* (relevant constraints).
  *   *Shift required:* If the idealization makes the problem *easier* but not *trivial*, it's standard modeling. If the idealization makes the solution *inevitable* given the setup, it's smuggling.
  *   *Test:* Remove the idealization. If the mechanism collapses, it was smuggling. If the mechanism degrades gracefully, it was idealization.

  **3. The Adaptationist Programme (Gould & Lewontin)**
  *   *Boundary:* This criticizes assuming every trait is an adaptation. Parametric Smuggling criticizes assuming every *model success* is due to the modeled mechanism.
  *   *Shift required:* Adaptationism is about biology. Parametric Smuggling is about *models of biology* (and AI, and ethics). It's a meta-scientific error, not a biological one.

  #### (c) Tests: Discriminating Cranes from Counterfeits

  You need procedures to catch this in a paper. Here are three:

  **1. The Perturbation Test (Robustness)**
  *   *Procedure:* Randomly perturb the boundary conditions (the reward function, the environmental statistics, the definition of "success") within a reasonable range *without* changing the mechanism.
  *   *Pass:* The mechanism still acquires the capacity (perhaps slower, or less perfectly).
  *   *Fail:* The capacity vanishes or degrades disproportionately to the perturbation. This indicates the capacity was resident in the specific parameters, not the mechanism.

  **2. The Blind Setup Test (Information Flow)**
  *   *Procedure:* Give the boundary conditions to a second modeler who does *not* know the target capacity $C$. Ask them to predict what capacities the system will develop based *only* on the setup.
  *   *Pass:* They predict $C$.
  *   *Fail:* They cannot identify $C$ as the likely outcome without being told. This shows $C$ was not "in" the setup in an objective sense, but only relative to the original modeler's intent.

  **3. The Substitution Test (Mechanism Independence)**
  *   *Procedure:* Replace the proposed mechanism $M$ with a significantly simpler or different mechanism $M'$ (e.g., random walk, simple lookup table) while keeping the setup $B$ identical.
  *   *Pass:* $M'$ fails or performs significantly worse.
  *   *Fail:* $M'$ succeeds nearly as well as $M$. This proves the setup $B$ was doing the work, not $M$.

  #### (d) The Hard Edges

  **1. Idealization vs. Smuggling**
  Every model simplifies. The line is drawn at **Counterfactual Support**.
  *   *Legitimate Idealization:* Supports counterfactuals about the *target system*. (e.g., "If gravity were slightly stronger, the pendulum would swing faster.")
  *   *Parametric Smuggling:* Fails counterfactuals about the *target system* because the model relies on constraints that don't exist in the target. (e.g., "If the food were slightly harder to find, the agent would still find it" — but in the model, if food is harder to find, the agent starves because the search algorithm is weak and the food density was rigged).
  *   *The Cut:* If the model's success depends on a constraint that is *false* of the real-world system being modeled, it is smuggling. If the constraint is *approximately true*, it is idealization.

  **2. Natural Selection**
  Does natural selection commit Parametric Smuggling? The environment "sets the rules," and organisms evolve to fit.
  *   *Verdict:* **No.**
  *   *Why:* Parametric Smuggling is an *explanatory* fallacy, not an *ontological* one. It requires a **Modeler**.
  *   In natural selection, there is no agent selecting the boundary conditions *in order to produce the explanation*. The environment filters; it does not *design for an audience*.
  *   *The Difference:* In your ALife example (1), the fitness function is a *restatement* of the target behavior chosen by a human to *demonstrate* evolution. In nature, the "fitness function" (survival) is not a restatement of specific traits; it is a generic constraint.
  *   *The Test:* Ask, "Who chose the boundary conditions, and for what purpose?" If the answer is "A researcher, to ensure the mechanism works," it's smuggling. If the answer is "Causal history, with no telos," it's not.
  *   *Caveat:* A biologist *modeling* natural selection can commit Parametric Smuggling if they rig the simulation's environment to ensure the trait evolves, then claim the trait *must* evolve in nature. The fallacy is in the *paper*, not in the *world*.

  ### Summary for Your Seminar

  Tell your students: **"You are engaging in Parametric Smuggling. You have moved the explanatory burden from the dynamics to the boundary conditions. You haven't explained how the system solves the problem; you've explained how you set up the world so the problem didn't need solving."**

  It's not a homunculus. It's not circularity. It's a misattribution of causal credit from the *engine* to the *track*.
