answer: |-
  This game forces students to feel the squeeze of causal exclusion by making them adjudicate between two descriptions of the same event where one description is physically complete and the other is intentionally useful.

  ### Materials List
  *   **Tokens:** 64 identical wooden cubes (16 per team).
  *   **Board:** 4 large sheets of paper with a 5x5 grid drawn on each (one per team).
  *   **Ledgers:** 8 pads of paper (4 marked "Ledger M", 4 marked "Ledger C").
  *   **Instruction Cards:** 16 cards total. 4 sets of 4. Each card has a color (Red/Blue) and a symbol (Arrow Left/Arrow Right) printed on one side; the other side is blank.
  *   **Rule Table:** 4 large posters displayed at the front of the room. Text: "Movement Rule: If Card shows Red, move Token to Zone 1. If Card shows Blue, move Token to Zone 2."
  *   **Audit Keys:** 4 sealed envelopes per team (labeled Round 1, 2, 3, 4).
  *   **Markers:** 16 black markers.
  *   **Timer:** Visible to facilitator only.

  ### Roles and Allocation (16 Students)
  Divide the class into 4 Teams of 4. Each team sits at a separate table.
  *   **Mover (1 per team):** Holds the Instruction Card, moves the tokens.
  *   **Mechanical Recorder (1 per team):** Writes in Ledger M. Restricted vocabulary: *Position, Contact, Displacement, Zone.*
  *   **Content Recorder (1 per team):** Writes in Ledger C. Restricted vocabulary: *Aim, Rule, Intention, Choice.*
  *   **Auditor (1 per team):** Compares ledgers, opens Audit Keys, assigns scores.

  *Constraint:* No student may leave their role during the session. No student may look at another team's materials.

  ### Rules and Scoring Scheme
  **General Constraint:** The words *cause, effect, mental, physical, mind, body, determine, supervene* are banned. If spoken, the Facilitator says: "Pause. Record that utterance on Ledger C as an event labeled 'Vocab Breach'. Continue."

  **Ledger M Rules:** Must describe token positions and contacts only. May not reference the Instruction Card unless the Card is visible on the Board.
  **Ledger C Rules:** Must describe the Mover's aim and the Rule followed.
  **Audit Rule:** For each round, the Auditor answers: "Did an entry in Ledger C account for a displacement that Ledger M did not already account for?"
  *   **Yes** = 1 Point.
  *   **No** = 0 Points.
  *   **Scoring:** After each round, the Auditor opens the corresponding sealed Key. The Key contains the Correct Verdict. If the Auditor's verdict matches the Key, the Team gets 1 Point. If not, 0 Points. (This makes error visible).

  ### The Four Rounds

  **Round 1: Baseline (15 Minutes)**
  *   **Setup:** Instruction Card is placed face-up on the table, far from the Board. Rule Table is visible.
  *   **Action:** Mover moves a token from Start to Zone 1 by pushing it with another token.
  *   **Constraint:** Mechanical Recorder sees the push. Content Recorder asks Mover "What was your aim?" Mover says "To get to Zone 1."
  *   **Audit Key Content:** **NO.** (Ledger M accounts for the displacement via contact; Ledger C adds no causal leverage).

  **Round 2: The Hidden Rule (20 Minutes)**
  *   **Setup:** Instruction Card is held in Mover's hand, hidden from Recorders. Rule Table is visible.
  *   **Action:** Mover moves token to Zone 1.
  *   **Constraint:** Mechanical Recorder sees the move but *cannot* see the Card. They must write Ledger M without referencing the Card. Content Recorder asks Mover "Why Zone 1?" Mover shows Card briefly to Content Recorder only, says "Because Red."
  *   **Audit Key Content:** **YES.** (Ledger M is incomplete because it cannot cite the Card rule; Ledger C explains the selection of Zone 1).
  *   **Design Note:** This creates the illusion of mental causal necessity due to epistemic limitation.

  **Round 3: The Public Base (20 Minutes)**
  *   **Setup:** Instruction Card is placed face-up *on the Board* at the Start Zone before the move. Rule Table is visible.
  *   **Action:** Mover moves token to Zone 1.
  *   **Constraint:** Mechanical Recorder sees the Card on the Board. They may reference the Card's position and color in Ledger M. Content Recorder asks Mover "Why Zone 1?" Mover says "Because Red."
  *   **Audit Key Content:** **NO.** (Ledger M now accounts for the Card as a physical object determining the move; Ledger C is redundant).
  *   **Design Note:** This forces the realization that the "need" for Ledger C in Round 2 was access, not ontology.

  **Round 4: Prediction vs. Production (20 Minutes)**
  *   **Setup:** Instruction Card on Board (as in Round 3).
  *   **Action:** Content Recorder writes "Token will go to Zone 1" *before* the move. Mover moves token. Mechanical Recorder writes displacement *after* the move.
  *   **Constraint:** Content Ledger shows perfect prediction.
  *   **Audit Key Content:** **NO.** (Predictive accuracy does not equal causal production; Ledger M still accounts for the displacement via contact).
  *   **Design Note:** Targets the confusion between explanatory power and causal efficacy.

  ### Timeline (110 Minutes)
  *   **00-10:** Setup, Role Assignment, Rules Read-through.
  *   **10-25:** Round 1 (Play + Audit + Key Reveal).
  *   **25-45:** Round 2 (Play + Audit + Key Reveal).
  *   **45-65:** Round 3 (Play + Audit + Key Reveal).
  *   **65-85:** Round 4 (Play + Audit + Key Reveal).
  *   **85-110:** Debrief.

  ### The Debrief
  *Do not summarize the argument. Map play moments to philosophical premises.*

  **1. Mapping Round 1 to Causal Closure (10 Minutes)**
  Ask Auditors: "Why was the Key 'No'?"
  Expected Answer: "The push explained the move."
  Facilitator Move: Write on whiteboard: **Premise 1: Every displacement has a sufficient mechanical account.**
  Ask: "Did anyone feel Ledger C was false?" (No). "Did anyone feel it was useless?" (Yes).
  Point: This is the mood of physical closure. The mechanical story suffices.

  **2. Mapping Round 2 to the Exclusion Intuition (5 Minutes)**
  Ask Auditors: "Why was the Key 'Yes'?"
  Expected Answer: "Ledger M didn't know about the Card."
  Facilitator Move: Write on whiteboard: **Premise 2: If Mechanical account is incomplete, Content account does work.**
  Point: This generates the pressure. If physics (Ledger M) doesn't fix the outcome, something else (Ledger C) must.

  **3. Mapping Round 3 to Supervenience (5 Minutes)**
  Ask Auditors: "What changed between Round 2 and 3? The move was identical."
  Expected Answer: "The Card was visible."
  Facilitator Move: Write on whiteboard: **Premise 3: Content facts are fixed by Mechanical facts (Card on Board).**
  Point: When the Mechanical ledger is allowed to include all physical facts (including the Card), the Content ledger loses its causal leverage. This is the Exclusion Principle in action: If Physical suffices, Content is excluded.

  **4. Sorting the Replies (5 Minutes)**
  Ask: "How would you argue Ledger C still mattered in Round 3?" Sort student objections into four buckets on the board:
  *   **Attack Premise 1 (Closure):** "Maybe the push wasn't enough; the Mover's biology mattered." (Deny physical sufficiency).
  *   **Attack Premise 2 (No Overdetermination):** "Maybe both ledgers caused it." (Accept routine double causation).
  *   **Attack Premise 3 (Exclusion):** "Content is different kind of thing, so it doesn't compete." (Deny competition).
  *   **Attack the Criterion (Causal Relevance):** "Ledger M was too detailed." (See below).

  **5. The Grain Reply and Round 3 Adjustment (5 Minutes)**
  Focus on the last bucket. A student may say: "Ledger M talks about cubes touching. Ledger C talks about Rules. They aren't rivals."
  *   **Description:** This reply claims the Mechanical Ledger describes micro-events (token contacts) while the Content Ledger describes macro-patterns (following a rule). Since a rule is not a token, they do not compete for the same causal slot. One explains the *motion*, the other explains the *action*.
  *   **Round 3 Adjustment:** To give this traction, Round 3 would need to allow Ledger M to describe *only* micro-positions (atoms of the token) while Ledger C describes the *game move*.
  *   **Adjustment Cost:** This breaks the game's symmetry. If Ledger M is forced to be micro-only, it becomes unreadable to students (too much data). If Ledger M is allowed to describe "Game Moves," it吞s Ledger C's vocabulary. The game relies on the two ledgers competing at the *same level of description* to generate the exclusion pressure. Granting the Grain Reply requires abandoning the single-board mechanic, which collapses the simulation.

  ### Predictable Failure Modes
  1.  **Cheating in Round 2:** Mechanical Recorders peek at the Card.
      *   *Handle:* Facilitator circulates. If caught, Team loses 5 Points. Remind them the epistemic block is the point.
  2.  **Auditor Collusion:** Auditors agree on verdicts before opening Keys.
      *   *Handle:* Remind them the Key scores *them*, not the Recorders. Their job is accuracy to the Key, not consensus.
  3.  **Vocab Leakage:** Students say "Physical" or "Mental".
      *   *Handle:* Execute the "Vocab Breach" move strictly. Do not explain why. The friction teaches the constraint.
  4.  **Round 3 Insight Missed:** Students think Round 3 is just "easier" for the Recorder.
      *   *Handle:* In Debrief, ask: "Did the token move differently in Round 3?" (No). "Did the Card change?" (No). "Only who saw it." Force the ontological vs epistemic distinction.

  ### Variants
  **For 8 Students:**
  *   Run 2 Teams of 4.
  *   The other 8 roles are collapsed: Facilitator acts as the "Rule Table" and "Audit Key" holder for both.
  *   Debrief becomes a plenary discussion between the two teams' Auditors.

  **For 30 Students:**
  *   Run 6 Teams of 4 (24 students).
  *   Remaining 6 students form a "Super-Audit Panel." They do not play rounds; they observe one team per round and write a meta-ledger.
  *   In Debrief, the Super-Audit Panel presents the cross-team patterns before the Facilitator maps premises.

  ### Frank Notes

  **1. The Inspectability Asymmetry**
  This activity structurally cannot reproduce the opacity of the physical base. In the game, the "Physical" (tokens, cards, board) is fully inspectable by the Mechanical Recorder. In reality, the microphysical base of a human action is not inspectable by anyone, let alone in real-time. This biases the game heavily toward Physicalism. Students feel the Mechanical Ledger is superior because they *can* write it. In the real world, the Mechanical Ledger (complete microphysics) is a theoretical posit, not a visible record. You must supply this by hand in the debrief: "In the game, you could see the Card. In reality, you cannot see the neurons. Does that make the Mental Ledger more necessary than it was in Round 3?" If you do not ask this, they will leave thinking Physicalism is obvious because the tokens were visible.

  **2. The Collapsing Debrief Step**
  The step most likely to collapse into lecturing is **5. The Grain Reply and Round 3 Adjustment**. Explaining why "different levels" might avoid competition requires distinguishing between *causal production* and *causal explanation*. Students will conflate these. You will be tempted to simply define the difference for them. To avoid this, do not define it. Instead, ask: "If Ledger M described every atom in the token, would it still mention the Rule?" Let them struggle with the granularity. If you define 'levels' for them, you have solved the Exclusion Problem by fiat rather than letting them feel the tension.

  ### Design Log (Show Work)
  *   *Candidate 1: Digital Simulation.* Rejected. Requires laptops; hides the mechanics behind code, making the "Physical" ledger opaque rather than inspectable.
  *   *Candidate 2: Role-Play Debate.* Rejected. Relies on verbal argument; facilitator becomes the source of philosophical weight rather than the mechanics.
  *   *Candidate 3: Single Ledger with Color-Coding.* Rejected. Did not create sufficient separation between the "Mechanical" and "Content" descriptions; students easily merged them.
  *   *Candidate 4: The Two-Ledger Board Game.* Selected. Forces simultaneous description of one event, making the redundancy (or lack thereof) empirically visible to the Auditors.
