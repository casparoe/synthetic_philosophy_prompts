          *   *Distinction:* If the judge *cannot* understand the refutation even with infinite time, the mechanism is broken *in principle*. If the judge *could* but it takes 100 years, it's broken *in practice*.
          *   *Why it matters:* AI Safety cares about *in principle* failures because AI might be superintelligent. If the lie is mathematically undecidable by the judge, the debate protocol fails fundamentally.
          *   *Example:* Encryption. You can't brute-force a key even with infinite time if the key space is large enough? No, better example: A mathematical proof that relies on lemmas the judge doesn't know. If the lie uses advanced math the judge can't verify, it's a principle failure.
          *   *Refinement:* The "obfuscated argument" is usually a *principle* failure in the limit. If the AI is smarter than the human, it can construct arguments the human *cannot* verify, even if another AI points them out. The "interaction" example (Step 11 + 34) is often a *practice* failure (cognitive load), but if the interaction relies on concepts outside the judge's ontology, it's *principle*.

      *   **Task 3: Why Two Systems? (Adversary vs. Explainer):**
          *   *User's suspicion:* "The other one catches it lying" is too simple.
