          *   *Adversarial Value:* The second AI is motivated to find the *weakest link*. It turns the problem from "Generate Truth" (hard) to "Find Flaw" (easier).
          *   *Nuance:* It's not that the second AI is "honest." It's that its *goal* (winning the debate) aligns with exposing falsehoods *if* the falsehood is exploitable. It's about narrowing the search space for the judge. The honest AI points to the specific step that is wrong, saving the judge from reading all 40 steps.
