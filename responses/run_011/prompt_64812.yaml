          *   *Refinement:* In AI Debate, the claim is $P \neq NP$-ish. It's easy to generate a plausible lie (P), hard to prove it's a lie (NP).
          *   *User's Framing:* The user says cost of establishing soundness grows faster than producing. This is correct.
          *   *Correction:* It's not just about "interactions." It's about *depth*. If the lie relies on a chain of reasoning 100 steps deep, the honest debater needs to unwind 100 steps to prove it wrong. If the judge can only check 10 steps, the lie wins.

