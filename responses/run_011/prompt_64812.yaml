      *   **Task 4: The Defender's Best Reply (The "Cross-Examination" Defense):**
          *   *Argument:* The debate isn't one speech vs. one speech. It's a tree.
          *   *Mechanism:* If Debater A makes a 40-step claim, Debater B doesn't have to refute all 40. B says "Step 11 is wrong." Then they debate Step 11. This creates a recursion.
          *   *Limit:* This works *if* the lie is shallow. If the lie is deep (requires unpacking Step 11 into 40 sub-steps), the tree gets too deep for the judge.
          *   *Strongest Defense:* The "Honesty via Efficiency" argument. Truth is usually more compressible than lies. A true fact can be justified directly. A lie requires scaffolding. The adversary's job is to force the liar to expand the scaffolding until it collapses under its own weight or exceeds the context window/time limit.
          *   *Caveat:* This defense admits the limitation. It works for "human-level" lies, maybe not "superintelligence-level" lies.

  4.  **Review and Refine:**
