  **ALDER & VOSS AGROSCIENCE**
  **WELFARE IMPACT STATEMENT (IWB-2)**
  **Filing Reference:** AV-2024-L4G
  **Product:** LULLABY 4G (Granular Chitin-Synthesis Inhibitor / Knockdown Blend)
  **Date:** 14 October 2024

  **1. Executive Summary**

  This statement quantifies the welfare impact of LULLABY 4G application on *Coleoptera* target populations within the defined system boundary. The metric employed is Suffering-Avoided Insect-Days (SAID). The intervention accelerates mortality events relative to the counterfactual baseline, thereby reducing the duration of exposure to adverse states.

  | Metric | Calculation Method | Value (SAID) |
  | :--- | :--- | :--- |
  | **Baseline Suffering Load** | Population × Baseline Duration × Weight | 140,000,000 |
  | **Intervention Suffering Load** | Population × Knockdown Duration × Weight | (4,000,000) |
  | **Gross Welfare Benefit** | Baseline − Intervention | 136,000,000 |
  | **Additionality Deduction** | Overlap with Drought Mortality Credits | (12,000,000) |
  | **Net Welfare Benefit** | Gross − Deduction | **124,000,000** |

  **2. Baseline Selection and Counterfactual**

  The counterfactual baseline assumes non-intervention. Under standard agronomic conditions, target populations face mortality via predation, parasitism, desiccation, or starvation. Field data indicates a mean time-to-death of 14 days for untreated cohorts due to resource depletion and natural enemy pressure. LULLABY 4G induces immobility within 4 hours via neuro-inhibitory knockdown, preceding the lethal moult prevented by the chitin-synthesis inhibitor. As the subject is immobile during the physiological failure phase, the duration of potential suffering is reduced from 14 days to 0.4 days. The difference is booked as a welfare gain.

  **3. System Boundary and Externalities**

  The system boundary is fixed at the treated field perimeter. LULLABY 4G is selective; non-target natural enemies survive treatment. These predators continue to consume target pests outside the boundary where knockdown agents are absent. Mortality events occurring outside the boundary via predation are excluded from this filing's liability. While this creates a leakage of suffering units to adjacent untreated zones, IWB-2 Protocol 7.1 mandates boundary-specific accounting. Consequently, suffering inflicted by spared predators post-exit is not deducted from the Net Welfare Benefit.

  **4. Welfare Weighting and Measurement Proxies**

  All life stages are assigned a welfare weight of 1.0. This includes eggs and first-instar larvae, despite limited evidence regarding nociceptive capacity in early development. Uniform weighting prevents discriminatory valuation within the species. Insensibility is proxied by video-tracked quiescence. Once motor function ceases, the subject is classified as unconscious.

  > **SIDEBAR: INTERNAL REVIEW NOTE**
  >
  > **From:** Dr. H. Grell, Senior Ecologist
  > **Subject:** Quiescence Proxy Validity
  > **Note:** Video tracking confirms motor cessation, but physiological stress markers remain elevated for 45 minutes post-knockdown. Equating immobility with insensibility contradicts internal neurophysiology data.
  > **Response:** IWB-2 Section 4.3 permits motor cessation as a compliant proxy for field filings. Physiological data is reserved for Tier 3 reviews. Filing proceeds under Tier 1 assumptions.

  **5. Sensitivity Analysis and Precaution**

  The headline result depends on the sentience threshold parameter ($S_t$). If $S_t$ is higher than the knockdown onset time, the Net Welfare Benefit becomes negative. As $S_t$ is currently unestimable, the Precautionary Clause is invoked against the do-nothing option. The baseline scenario carries a known probability of prolonged suffering (starvation/predation), whereas the intervention carries a known probability of rapid insensibility. Where uncertainty exists, the option with the lower maximum suffering duration is selected as the welfare-positive choice.

  **6. Additionality and Sector Targets**

  To prevent double-counting, deaths attributable to concurrent drought conditions are deducted. An irrigation supplier has already claimed welfare credits for drought-induced mortality in this region. We subtract 12,000,000 SAID to account for this overlap. Furthermore, Alder & Voss proposes a sector-wide science-based target: a 15% annual reduction in total standing insect biomass, measured as a welfare KPI. We offer to license this methodology to competitors without royalty. This allows the industry to book collective gains from population suppression. We formally apply to have LULLABY 4G classified as an animal-welfare intervention rather than a pesticide, qualifying it for ethical investment funds restricted to welfare-enhancing technologies.

  **7. Declaration**

  The undersigned certify that the calculations above adhere to the Invertebrate Welfare Assurance Standard (IWB-2). The Net Welfare Benefit is positive.

  _________________________
  **L. M. Voss**
  Compliance Officer, Alder & Voss Agroscience

  _________________________
  **Dr. A. Sterling**
  Independent Assurer, VeriEthos Ltd.
  *Assurance Level: Limited*
