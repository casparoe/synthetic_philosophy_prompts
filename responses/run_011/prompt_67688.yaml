answer: |-
  You have hit on one of the most significant unresolved tensions in space ethics, and your intuition that the current framework is philosophically unstable is shared by many scholars in the field. The practice currently presupposes a hierarchical anthropocentrism tempered by epistemic caution, which means it values human knowledge highly but ultimately values human expansion higher. The official language of the Outer Space Treaty and COSPAR guidelines focuses on harmful contamination and scientific integrity, which suggests an instrumental view where Mars is valuable primarily as a laboratory for human inquiry rather than as a habitat with intrinsic worth. Under this view, Martian microbes are not moral patients with rights to exist; rather, they are components of a unique experiment that must not be compromised before we can observe them. This is why the rules are framed around protecting the science instead of protecting the life itself. If the microbes had intrinsic moral standing independent of human knowledge, the sterilization requirements would likely be even stricter, and the possibility of human landing would be ethically prohibited rather than just technically difficult.

  This practice quietly rules out two rival views that sit on either side of the current compromise. On one side, it rules out strong biocentrism or deep ecology, which would argue that any independent genesis of life has a right to flourish regardless of its utility to human science. If that view were dominant, we would not merely sterilize robots; we would likely forbid landing altogether in potentially habitable zones, and crewed missions would be morally impermissible regardless of technological containment solutions. On the other side, the current rules rule out radical expansionism or manifest destiny ideologies, which hold that human survival and colonization trump all other considerations. If that view were dominant, there would be no spore budget at all, because the risk of contaminating Mars would be considered negligible compared to the benefit of establishing a foothold for humanity. The current regime tries to walk a line between these extremes by saying we must look before we leap, but it implicitly assumes that eventually, we will be allowed to leap.

  There is significant underdetermination in the current rules because different theories license the exact same spore budget for robotic missions. Both the epistemic instrumentalist and the weak biocentrist would agree that we should sterilize a rover before sending it to a special region. The instrumentalist does it to preserve data integrity, ensuring we do not mistake Earth hitchhikers for Martians. The weak biocentrist does it to prevent ecological harm to a potential biosphere. Because both views converge on the same engineering requirement for robots, the regulations do not need to specify which ethical justification is primary. This ambiguity allows the rules to function politically without resolving the philosophical conflict. However, this underdetermination collapses when you introduce humans, because humans cannot be sterilized. At that point, the two theories diverge sharply, revealing that the current roadmap relies on the epistemic view being temporary.

  The special-regions rule and the crewed-Mars plan cannot truly survive under one consistent theory unless that theory includes a time-sensitive hierarchy. Under a strict epistemic view, crewed missions to special regions are forbidden until the question of indigenous life is definitively answered, which might be never. Under a strict biocentric view, they are forbidden forever. The only way to reconcile the current sterilization of robots with the planned colonization by humans is to assume a transition point where the epistemic value of Mars is exhausted and the anthropocentric value of expansion takes over. This implies that the current protection rules are not permanent moral laws but temporary procedural hurdles. We are treating Mars as a pristine lab for now, with the quiet assumption that once we are sure it is empty, or once we decide we do not care, the protections will be lifted to accommodate human biology.

  If you swapped the presupposed view for the main alternative, the regulations would change drastically. If we adopted strong biocentrism as the guiding principle, the regulations would need to shift from spore budgets to exclusion zones. We would see permanent no-go areas for any hardware that cannot be proven sterile to a near-impossible standard, and human missions would be restricted to orbit or to barren zones confirmed dead beyond any doubt. Conversely, if we adopted the expansionist view as the primary driver, the regulations would shift from contamination control to risk mitigation for the humans only. The spore budget would vanish, replaced by guidelines on how to manage forward contamination only insofar as it might threaten human agriculture or health, treating Martian biology as a resource or a hazard rather than a protected entity. The current system is essentially a placeholder that delays this choice, allowing us to sterilize robots today while planning to send people tomorrow without having to admit that the priority has shifted from science to settlement.
