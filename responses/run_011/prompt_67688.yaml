prompt: |-
  I've been going through the planetary protection rules for a Mars lander concept and something about them wont quite sit right with me. The requirement isn't phrased as "don't kill Martian life" — the treaty language and the standard reading of it are about avoiding contamination that would wreck the science, and the engineering version of that is a spore budget on the hardware, with full sterilisation demanded if you might touch one of those "special regions" where liquid water could occur. So we will bake an entire spacecraft to kill every spore on it for the sake of a place where nobody has ever found one living thing, and meanwhile crewed missions are effectively ruled out of those same regions because you can't sterilize a person carrying a hundred trillion microbes — yet basically every colonization roadmap assumes people land on Mars. What theory of value does this practice actually presuppose? Is there a hidden claim that microbial life, or maybe just the possibility of a second independent origin of life, has standing in its own right, or is it purely an irreversibility rule about a one-shot epistemic asset that needs no moral patient at all? Tell me which rival views the practice quietly rules out, where its underdetermined — which different theories would license the exact same spore budget — whether the special-regions rule and the crewed-Mars plan can both survive under one theory, and what would have to change in the regs if you swapped the presupposed view for the main alternative. Plain prose please, like an email: no headings, no bullet points, no bold, no tables.
