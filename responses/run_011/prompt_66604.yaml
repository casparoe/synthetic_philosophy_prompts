      *   *The Residual Problem:* This solves the "knowing all theorems" issue only if the agent isn't aware of all theorems. But now we need a theory of awareness. What limits awareness? Syntax? Computational complexity? If awareness is unrestricted, we're back to omniscience. If it's restricted, why? The problem shifts from "why don't they know it?" to "why aren't they even thinking about it?"

