prompt: |-
  Background first. I'm a retired physiologist — thirty-odd years on comparative respiration, mostly fish, mostly in tanks — and since I gave up the lab I've been reading philosophy and bits of social science properly for the first time in my life. I've also, rather foolishly, let myself be made chair of the trustees of a small charity that runs six field stations round the UK: two coastal, one upland, one on a river, one on an island, and one on the edge of a city that mostly does schools visits. Six of us at the table, meeting four times a year — two accountants, a solicitor, a retired GP, a farmer and me. Nobody has any social science training whatsoever, and nobody has time to read a paper before a meeting.

  Here's my problem. Almost every meeting has one or two items about how prescriptive our rules ought to be, and we handle them entirely by vibes. A station manager wants to relax something; the insurers want everything uniform; one trustee wants sanctions for people who file forms late; another thinks any rule we can't enforce is worse than no rule at all. I've been reading about the tight-versus-loose cultures idea — societies that demand a lot of rule-following and punish deviation, versus societies that permit a wide range of behaviour — and I want to know whether anything in that line of thinking survives contact with an actual organisation of forty-odd people and a shoestring. So far what I've read looks correlational and survey-based to me, which makes me suspicious, but I may be being unfair.

  What I want from you is a decision procedure my board could actually run on any proposal to tighten or loosen a rule, and I mean run — not admire. Specifically:

  - The questions to ask, in order, with a note on what counts as a sufficient answer to each one, and what happens when nobody knows the answer.
  - A clear default: if the procedure runs out of information, does it default to tightening, to loosening, or to leaving things alone? Say why.
  - Where the procedure stops dead and hands the decision to a vote, because the remaining question is about what we value rather than about the world. I've got a lot of sympathy for the thought that you can't derive an ought from an is, and I don't want a checklist that quietly sneaks values in and then presents the result as a finding. Be explicit about which steps are judgement calls dressed up as procedure.
  - Where you expect it to misfire in our setting specifically.

  One thing I need you to handle, because it comes up constantly: I suspect "tightness" is not one dial that a practitioner can turn. There's tightening the written rule, tightening how hard you enforce an existing rule, and tightening how closely you watch whether it's being followed, and those three come apart all the time. If the underlying idea treats tightness as a single quantity, tell me so and tell me what I'm meant to do about it in the procedure anyway.

  I also have a home-grown notion I'd like you to test rather than flatter. Coming from dose-response work, I keep wanting to say that the right target isn't a level of strictness but a slope — that you should tighten only where a small deviation produces a large harm, and leave things loose where the response curve is flat. Related to that I've been trying to invent something I call a deviation budget: how much local variation a given rule can absorb before outcomes start to degrade. Tell me honestly whether either of these can be made coherent, or whether tightness just isn't the sort of thing that can be dosed rule by rule, in which case say what I should use instead.

  Then run the procedure on three real ones. I'll tell you my priors so you can see whether it bites:

  1. The island station wants to keep its own boat-booking arrangements instead of adopting the common system the other five use. There was a near-miss two years ago — engine failure, everyone got back fine — and our insurer has now written to us asking for a single written procedure across all sites. I'm inclined to side with the insurer.
  2. The GP trustee proposes a mandatory annual incident return from every station, with part of a station's maintenance budget withheld if it's filed late. Nothing has gone badly wrong anywhere this year, and two managers say the paperwork is already suffocating them. I think this is overreach.
  3. We've just found out that the upland station manager has been quietly letting experienced volunteers go out on their own in conditions the written rule forbids, for about five years. Nothing happened. She told us herself because she wants the rule changed, and her argument is that her judgement is better than the rule is. I like her and I'm inclined to let her carry on.

  Please make sure at least one of the three comes out against me. A procedure that agrees with everything I already think is worthless to me, and I'd rather find out now which of my instincts is wrong.

  Finally, say plainly what the procedure cannot do — the class of decision it will get wrong or refuse to touch — and keep the whole thing to something I could hand to the other five trustees as a couple of pages. No bibliography, no reading list, no named studies with years attached: I can't chase any of that and I'd much rather you reasoned it through in front of me than pointed me at references. And write it in British English throughout, please — spellings and everything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physiologist (comparative respiration, fish), now charity trustee chair. Scientific mindset (dose-response, skepticism of correlational social science), practical constraints (busy board, no social science training, shoestring budget).
      *   **Context:** Small charity, 6 field stations, 6 trustees (mixed backgrounds), 4 meetings/year.
      *   **Problem:** Recurrent debates on rule prescriptiveness (tight vs. loose) handled by "vibes." Insurers want uniformity; managers want flexibility; trustees disagree on enforcement.
      *   **Goal:** A practical *decision procedure* (checklist/algorithm) for the board to use on rule changes.
      *   **Specific Requirements:**
          *   Ordered questions with sufficiency criteria and "unknown" handling.
          *   Clear default position (tighten, loosen, status quo) with justification.
          *   Explicit identification of value judgements (where to vote).
          *   Identification of failure modes in this specific setting.
          *   Address the "three dials" of tightness (written rule, enforcement, monitoring).
          *   Test the user's home-grown concepts ("slope" of harm vs. deviation, "deviation budget").
          *   Apply the procedure to three specific cases (Island boat, GP's incident return, Upland volunteer rule).
          *   *Constraint:* At least one case must conclude against the user's prior inclination.
          *   *Constraint:* British English.
          *   *Constraint:* No bibliography/references (reason it through).
          *   *Constraint:* Concise (couple of pages worth).
          *   *Constraint:* Plain statement of limitations.

  2.  **Deconstruct the Theoretical Concepts:**
      *   **Tight-Loose Theory (Gelfand et al.):** Usually macro-societal. User is right to be suspicious of direct application to micro-orgs. It treats tightness as a latent construct, but the user correctly identifies it as multidimensional (creation, monitoring, sanctioning).
      *   **User's "Slope" Idea:** This is essentially risk assessment. High slope = high sensitivity to error (critical safety). Low slope = robust to error (admin). This is coherent and useful.
      *   **User's "Deviation Budget":** This is akin to "slack" or "resilience capacity." Also coherent, but hard to quantify without data.
      *   **The "Three Dials":** Rule Strictness ($R$), Monitoring Intensity ($M$), Sanction Severity ($S$). Tightness $T \approx f(R, M, S)$. The procedure needs to separate these.

  3.  **Drafting the Decision Procedure:**
      *   *Structure:* Needs to be a flow or a numbered list.
      *   *Defaults:* Given the charity context (safety, insurance, limited resources), the default should probably be *Status Quo* unless there's a compelling reason to change. Changing rules costs cognitive load and enforcement energy. However, regarding safety/insurance, the default might lean tight. Let's aim for *Status Quo* as the neutral default to prevent rule creep, but with a "Safety/Insurance Veto."
      *   *Values vs. Facts:* Facts = likelihood of harm, cost of enforcement. Values = how much risk we tolerate, how much trust we place in managers vs. systems.
      *   *Handling "Unknowns":* If data is missing, assume the worse case for safety, but the cheaper case for admin.

  4.  **Refining the "Three Dials" and User's Theories:**
      *   I need to validate the "slope" idea. It's good. It maps to "Consequence of Deviation."
      *   I need to validate the "budget" idea. It maps to "Capacity for Monitoring."
      *   I need to explicitly separate Rule, Monitoring, and Sanction.

  5.  **Developing the Cases (The Crucial Step):**
      *   *Case 1 (Island Boat):* User leans Insurer (Tighten).
          *   Risk: High (sea, engine failure).
          *   Uniformity: Insurer demand.
          *   Procedure outcome: Likely Tighten (Rule).
          *   *Challenge:* Can I make this argue against the user? If the procedure says "Local rule is fine if risk is managed," that contradicts the user. But insurance is a hard constraint. Let's look at Case 2 or 3 for the contradiction.
      *   *Case 2 (GP's Incident Return):* User leans Loose (Overreach).
          *   Risk: Low (paperwork).
          *   Cost: High (manager time).
          *   Sanction: Budget withholding (Punitive).
          *   Procedure outcome: Likely Loose/Status Quo. Agrees with user.
      *   *Case 3 (Upland Volunteer):* User leans Loose (Trust manager).
          *   Risk: Medium/High (upland conditions).
          *   History: 5 years, no incidents.
          *   Rule: Written forbiddance.
          *   Procedure outcome: This is the best candidate to contradict the user. If the procedure prioritises *written clarity* and *insurance liability* over *track record*, it might say "Formalise the exception or Tighten."
          *   *Decision:* I will make the procedure flag the *liability* risk. Even if nothing happened, the *potential* harm slope is steep. The procedure should recommend formalising the exception (Tightening the rule to match reality) rather than allowing the loose practice to continue informally. This contradicts the user's "let her carry on."

  6.  **Writing - Section by Section (incorporating British English):**

      *   *Intro:* Acknowledge the background. Validate the skepticism.
      *   *The Theory Bit:* Address Tight-Loose, the Three Dials, and the User's Slope/Budget ideas. Confirm they are coherent and useful.
      *   *The Procedure:* The core checklist.
          *   Step 1: Harm Slope (Safety/Liability).
          *   Step 2: Monitoring Capacity (Budget/Time).
          *   Step 3: The Three Dials (Rule, Check, Sanction).
          *   Step 4: The Value Vote.
      *   *Defaults:* Status Quo (prevents rule creep).
      *   *Failure Modes:* Where it breaks (politics, personality).
      *   *Case Studies:* Apply the logic rigorously. Ensure Case 3 bites the user.
      *   *Limitations:* What it can't do.

  7.  **Review against Constraints:**
      *   *British English:* Check spellings (organisation, programme, centre, authorised).
      *   *Length:* Keep it tight. "Couple of pages."
      *   *No References:* Do not cite Gelfand or others.
      *   *Tone:* Professional, respectful of scientific background, practical.
      *   *Contradiction:* Ensure Case 3 challenges the user.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Thought:* Is "Status Quo" the right default?
      *   *Correction:* For a charity with insurance issues, "Status Quo" might be dangerous if the status quo is non-compliant. Let's make the default "Minimum Viable Compliance." If the rule doesn't affect safety/money, default to Loose. If it does, default to Tight. Actually, the prompt asks for *a* clear default. Let's choose **Status Quo** but with a **Safety/Insurance Veto**. This protects the board from rule creep but acknowledges the hard constraints.
      *   *Thought:* How to handle the "Three Dials"?
      *   *Correction:* Make sure the procedure asks about them separately. Don't just ask "Should we tighten?" Ask "Do we change the text, the checking, or the penalty?"
      *   *Thought:* Case 3 contradiction.
      *   *Correction:* The user wants to let the manager continue. The procedure should highlight that *informal* discretion is a liability risk. The solution isn't necessarily "stop her," it's "rewrite the rule to permit what she does under specific conditions." This is a form of tightening (codifying) even if it allows the behaviour. I need to make sure this counts as "against" the user's instinct to just "let her carry on" (which implies leaving the rule as written but ignoring it). Yes, that works. It forces formalisation.

  9.  **Final Polish:** Check tone. Ensure it sounds like it's written for a scientist-turned-trustee. Use terms like "variable," "threshold," "signal-to-noise."

  *(Self-Correction on Case 1)*: The user sides with the insurer. If I agree, that's not a contradiction.
  *(Self-Correction on Case 2)*: The user thinks it's overreach. If I agree, that's not a contradiction.
  *(Self-Correction on Case 3)*: The user likes the manager and wants to let her carry on. If the procedure says "You must formalise this or stop it because informal deviation is uninsurable," that challenges the "let her carry on" (implied: without changing the rule) instinct. I will frame the outcome as "Formalise the exception," which is more work than the user wants.

  Wait, I need to make sure at least one comes out *against* the user.
  Case 1: User = Tighten (Insurer). Procedure = Tighten (Safety). (Agree)
  Case 2: User = Loose (Overreach). Procedure = Loose (Low harm slope). (Agree)
  Case 3: User = Loose (Trust manager). Procedure = Tighten (Formalise rule). (Disagree).
  Perfect.

  Let's write it.
answer: |-
  **To:** The Board of Trustees
  **From:** The Chair
  **Subject:** A Procedure for Rule Making and Enforcement

  ### 1. Theoretical Grounding
  You are right to be suspicious of "tight-loose" as a single dial. In practice, it splits into three distinct variables:
  1.  **Codification:** How specific is the written rule?
  2.  **Monitoring:** How closely do we check compliance?
  3.  **Sanction:** What happens when the rule is broken?

  Your home-grown concepts are coherent and superior to the standard social science here.
  *   **The Slope:** This is *sensitivity to error*. If a small deviation causes catastrophic harm (steep slope), the rule must be tight. If the outcome is robust to deviation (flat slope), the rule can be loose.
  *   **The Deviation Budget:** This is *monitoring capacity*. You have a finite amount of trustee and manager attention. Spending it on low-slope issues starves the high-slope ones.

  This procedure treats rule-making as a resource allocation problem, not a moral one.

  ### 2. The Decision Procedure
  Run these questions in order. If you cannot answer a question, follow the instruction for "Unknown."

  **Q1: What is the Slope of Harm?**
  *   *Ask:* If this rule is ignored, what is the worst credible outcome? (e.g., Death/Injury, Loss of Funding, Insurance Void, Minor Inefficiency, Annoyance).
  *   *Sufficient Answer:* Consensus on the worst credible outcome category.
  *   *Unknown:* Assume the next worst category up (precautionary principle).
  *   *Action:* If the outcome involves Safety, Insurance Validity, or Statutory Compliance, proceed to Q2. If it is purely operational (efficiency, preference), default to **Loose/Status Quo** and stop.

  **Q2: What is the Monitoring Capacity?**
  *   *Ask:* Do we have the time and expertise to check if this rule is being followed?
  *   *Sufficient Answer:* A named person responsible for checking and a defined frequency (e.g., "Station Manager checks logs monthly").
  *   *Unknown:* Assume capacity is zero.
  *   *Action:* If capacity is zero, you cannot tighten Monitoring. You must either tighten Codification (make it impossible to break) or accept the risk.

  **Q3: Which Dial are we Turning?**
  *   *Ask:* Are we changing the Text, the Checking, or the Penalty?
  *   *Sufficient Answer:* Explicit identification of one or more dials.
  *   *Unknown:* Do not proceed. You cannot vote on "tightening" without specifying which dial.
  *   *Action:* Ensure the dials match the Slope. High Slope requires tight Text *and* tight Monitoring. Low Slope permits loose Text *and* loose Monitoring. Mismatched dials (e.g., strict rule, no checking) create hypocrisy and reduce respect for all rules.

  **Q4: The Value Vote (The "Ought")**
  *   *Ask:* Are we willing to accept the cost of enforcement?
  *   *Context:* This is not about facts. It is about whether we value uniformity over local flexibility, or compliance over manager morale.
  *   *Action:* If Q1–Q3 are satisfied, put it to a vote. A simple majority decides.

  ### 3. The Default Position
  **Default: Status Quo (Leave it alone).**
  *   *Why:* Rule creation has a cost (cognitive load, enforcement time, morale). In a shoestring organisation, rule creep is a greater risk than rule scarcity.
  *   *Exception:* If Q1 identifies a threat to Insurance Validity or Statutory Compliance, the default shifts to **Minimum Viable Compliance**. You must tighten enough to satisfy the external constraint, but no more.

  ### 4. Where This Will Misfire
  1.  **The "Nice Person" Error:** We know the station managers personally. We will underestimate the Slope of Harm because "they wouldn't let anything happen." The procedure forces you to assess the *situation*, not the *person*.
  2.  **The Insurance Black Box:** We treat insurer letters as divine commandments. Sometimes they are not. However, challenging them costs time we don't have. The procedure treats insurer demands as High Slope by default.
  3.  **Enforcement Drift:** You may vote to tighten the Text but fail to resource the Monitoring. This is worse than no rule at all.

  ### 5. Application to Current Items

  **Case 1: Island Boat Booking**
  *   **Q1 (Slope):** High. Engine failure at sea involves safety and insurance validity.
  *   **Q2 (Capacity):** Medium. Insurer wants uniformity; checking logs is easy.
  *   **Q3 (Dials):** Text (uniform procedure).
  *   **Q4 (Value):** Uniformity vs. Local Knowledge.
  *   **Outcome:** **Tighten Text.** The Slope is steep (safety/insurance). The Default shifts to Minimum Viable Compliance.
  *   **Verdict:** Agrees with your prior. The insurer's requirement overrides local preference because the cost of deviation is uninsurable.

  **Case 2: Mandatory Incident Returns**
  *   **Q1 (Slope):** Low. Late paperwork has not caused harm this year. No safety risk identified.
  *   **Q2 (Capacity):** Low. Managers report suffocation; trustees have no time to audit returns deeply.
  *   **Q3 (Dials):** Sanction (withholding budget).
  *   **Q4 (Value):** Accountability vs. Morale.
  *   **Outcome:** **Loose/Status Quo.** The Slope is flat (no immediate harm). The Monitoring Capacity is already exceeded. Adding a Sanction (budget withholding) damages trust without buying safety.
  *   **Verdict:** Agrees with your prior. This is administrative rule creep.

  **Case 3: Upland Volunteer Deviation**
  *   **Q1 (Slope):** High. Upland conditions can kill. The fact that nothing happened *yet* does not flatten the slope; it indicates luck or high skill.
  *   **Q2 (Capacity):** Low. The deviation was "quiet." There was no monitoring.
  *   **Q3 (Dials):** Text (current rule forbids it) vs. Reality (manager allows it).
  *   **Q4 (Value):** Trust in Individual vs. Trust in System.
  *   **Outcome:** **Tighten Text (Formalise the Exception).**
  *   **Reasoning:** Your instinct is to let her carry on (Loose Monitoring/Loose Sanction). The procedure flags this as dangerous. An informal exception is uninsurable. If she is right, the *rule* is wrong, not the practice.
  *   **Verdict:** **Against your prior.** You cannot "let her carry on" under the current rule. You must either enforce the ban or rewrite the rule to permit experienced volunteers under defined conditions. Leaving it as an unwritten understanding exposes the charity to liability if an accident occurs. The procedure demands you codify the discretion, which is work you wished to avoid.

  ### 6. Limitations
  This procedure cannot resolve conflicts where two High Slope risks compete (e.g., Safety vs. Solvency). It cannot measure trust, which is real but unquantifiable. It assumes trustees will answer Q1 honestly rather than strategically. Finally, it cannot protect you from the consequences of a vote; it only ensures the vote is informed by the distinction between facts (Slope/Capacity) and values (Uniformity/Trust).

  **Recommendation:** Print this. Keep it on the table. When a proposal is made, ask: "Which dial are we turning, and what is the slope of harm?" If they cannot answer, defer the decision.
