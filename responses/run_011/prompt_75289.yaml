answer: |-
  # The Origin Commitment Inventory

  **Instructions:** Read each scenario carefully. Select the option that best matches your intuitive judgment about whether *you* (the very same person) would exist in that situation. Do not worry about theoretical consistency yet; just mark your gut reaction.

  **1. The Different Father**
  Your actual mother contributes the actual egg that formed you. However, a different sperm cell from your actual father (or a different man entirely) fertilizes it.
  *   A) That is still you.
  *   B) That is not you.

  **2. The Different Mother**
  Your actual father contributes the actual sperm that formed you. However, a different egg from your actual mother (or a different woman entirely) is fertilized by it.
  *   A) That is still you.
  *   B) That is not you.

  **3. The Different Parents**
  Both gametes are different from the ones that actually formed you. The resulting individual has a similar genetic profile but originates from a different sperm and a different egg.
  *   A) That is still you.
  *   B) That is not you.

  **4. The Delayed Conception**
  The exact same sperm and egg that formed you fuse to form a zygote, but this event happens five years later than it actually did.
  *   A) That is still you.
  *   B) That is not you.

  **5. The Surrogate**
  The exact same zygote that formed you is implanted into a different woman's womb and gestated by her to term.
  *   A) That is still you.
  *   B) That is not you.

  **6. The Lab Duplicate**
  Scientists construct an embryo in a lab using entirely different gametes (different parents), but they arrange the molecular structure so the resulting zygote is molecule-for-molecule identical to your actual starting zygote.
  *   A) That is still you.
  *   B) That is not you.

  **7. The Twinning**
  At the two-cell stage, your actual zygote splits completely. Two viable embryos are implanted and grow into two distinct adults.
  *   A) You are both of them.
  *   B) You are exactly one of them (but there is no fact about which).
  *   C) You are neither of them (the original you ceased to exist).

  **8. The Somatic Clone**
  An embryo is created via somatic cell nuclear transfer (cloning) using one of your adult skin cells. It is gestated and born.
  *   A) That is still you (a new instance of you).
  *   B) That is not you (a distinct individual).

  **9. The Single Base-Pair**
  The exact same sperm and egg fuse, but the sperm differs from your actual sperm by exactly one DNA base pair due to a random mutation prior to fusion.
  *   A) That is still you.
  *   B) That is not you.

  ***

  # Scoring Key & View Mapping

  Tally your responses to locate your metaphysical commitment. Note that most views are defined by their "No" thresholds.

  **1. Strict Gamete-Pair Essentialism**
  *   **Pattern:** Q1(B), Q2(B), Q3(B), Q6(B).
  *   **Definition:** You are essentially tied to the specific pair of gametes that formed you. Any deviation in material origin destroys identity.
  *   **Hardest Commitment:** **The Tiny Difference Problem.** You must accept that a single molecular variation in the sperm (Q9) means *you* would not exist, even if the resulting person is indistinguishable from you.

  **2. Zygote Essentialism**
  *   **Pattern:** Q1(B), Q2(B), Q3(B), Q6(A).
  *   **Definition:** You are tied to the specific cellular structure of the zygote, regardless of the historical gametes that formed it.
  *   **Hardest Commitment:** **The Replicant Intuition.** You must accept that a lab-constructed duplicate (Q6) is literally *you*, despite having different biological parents and no historical continuity with your actual conception.

  **3. Asymmetric Essentialism (Maternal)**
  *   **Pattern:** Q1(A), Q2(B), Q3(B).
  *   **Definition:** The egg provides the essential continuity (cytoplasmic/mitochondrial); the sperm is interchangeable provided the egg remains fixed.
  *   **Hardest Commitment:** **The Chauvinism Charge.** You must defend why the maternal contribution is metaphysically privileged over the paternal contribution, despite both contributing nuclear DNA.

  **4. The Graded View (Similarity Essentialism)**
  *   **Pattern:** Q9(A), Q1(A or B), Q3(B).
  *   **Definition:** Identity tolerates small deviations in origin (Q9) but breaks down under large deviations (Q3). There is no sharp boundary.
  *   **Hardest Commitment:** **The Sorites Line.** You must accept that there is no fact of the matter about where "you" end and "someone else" begins as gametes are gradually swapped, violating the transitivity of identity.

  **5. Flat Denial (Anti-Essentialism)**
  *   **Pattern:** Q1(A), Q2(A), Q3(A), Q8(A).
  *   **Definition:** Origin is not essential to identity. You could have come from different parents or even been cloned.
  *   **Hardest Commitment:** **The Different Parents Intuition.** You must accept that you could have been born to completely different people than your actual parents, which clashes with the deep intuition that who you are is tied to who your parents are.

  ***

  # Instrument Limitations & Diagnostics

  **Indistinguishable Positions**
  This quiz cannot reliably separate **Strict Gamete-Pair Essentialism** from **Zygote Essentialism** on questions 1 through 5. Both views demand the actual historical origin for standard biological cases. They diverge *only* on Question 6 (The Lab Duplicate). If a participant answers "Not You" to Q1–Q5, you must rely solely on Q6 to distinguish whether they care about the *gametes* (Strict) or the *zygotic structure* (Zygote).

  **The Unoccupied Cell**
  *   **Combination:** Q1(Yes), Q2(Yes), Q3(No).
  *   **Status:** Logically Available but Unclaimed Territory.
  *   **Explanation:** This pattern claims that changing one gamete is fine, and changing the other is fine, but changing *both* simultaneously destroys identity. While logically consistent (perhaps positing a holistic "parental link" that breaks only when both sides change), no serious metaphysical theory occupies this space. Essentialists typically argue monotonicity (if changing one kills you, changing two must also kill you), and Deniers argue both changes are fine.

  **Diagnostic Tie-Breaker (Question 7)**
  Question 7 (Twinning) is not scored in the key above because it cuts across all views. However, it serves as a stress test:
  *   **Strict/Zygote Essentialists** often struggle here, forced toward Option C (Neither) to preserve the one-to-one nature of identity, implying the original you died at splitting.
  *   **Flat Deniers** often prefer Option A (Both), treating identity as a matter of psychological continuity which can branch.
  *   If a participant selects **Strict Gamete** patterns but chooses **Option A (Both)** on Q7, they hold a logically tense position: the origin is essential, yet one origin yields two identical persons.
