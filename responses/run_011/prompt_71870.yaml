  A device is built to count US quarters. It is shipped to a swamp where round slugs trigger the sensor identically to quarters. The device fires for slugs.
  A) It is misrepresenting slugs as quarters.
  B) It represents "round metal-or-slug things" (whatever currently causes the firing).
  C) It represents nothing; it is just a switch closing in response to pressure.

