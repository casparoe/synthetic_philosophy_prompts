  C) It is predicting tokens; "want" is a user projection.

  ***

  ### Scoring Key & Theory Mapping

  Count your answers. While few people are pure types, your dominant column indicates your gravitational center.

  **Mostly A: The Realist / Teleosemanticist**
  You believe content is real and often tied to history or function.
  *   **Teleosemantics (Millikan):** If you chose **1A, 3A, 5A**. You think proper function (history of selection) fixes content. The frog *means* fly even if it snaps at BBs, because its ancestors ate flies.
  *   **Searlean Intrinsic Intentionality:** If you chose **3A, 6A** but **5C, 8C, 9C**. You believe biology has intrinsic "aboutness" that machines lack. The frog feels; the thermostat does not.
  *   **Dretskean Indicator:** If you chose **2A, 7A** but **1B**. You think natural signs carry meaning via reliable covariance, but artifacts depend on current causation.

  **Mostly B: The Instrumentalist / Interpretivist**
  You believe content is real relative to a stance or use.
  *   **Dennettian Intentional Stance:** If you chose **8B, 9B, 4B**. You think if treating a system as having beliefs predicts its behavior, it *has* beliefs. There is no "deep fact" beyond the utility of the interpretation.
  *   **Verificationist:** If you chose **4B, 2B**. Meaning is fixed by successful interpretation, not hidden history.

  **Mostly C: The Eliminativist / Enactivist**
  You believe content is a fiction or unnecessary.
  *   **Radical Enactivism (Hutto & Myin):** If you chose **3C, 8C** but **6A**. You think basic agents (frogs, thermostats) operate without content (coupling), but humans might have derived content via language.
  *   **Hard Eliminativism (Churchland):** If you chose **6C, 9C, 1C**. You think "representation" is folk psychology that will be replaced by neurocomputational descriptions. Nothing *means* anything; things just *do*.

  ### Stability Analysis & Empty Corners

  **Unstable Combinations**
  *   **1A + 1B:** You cannot hold that the sensor represents quarters (History) *and* represents round things (Current Cause) simultaneously without a theory of error. If you pick both, you are conflating Teleosemantics with Indicator Semantics.
  *   **8A + 5C:** Claiming a thermostat has beliefs (8A) but a spam filter does not (5C) is theoretically jagged. Both are simple feedback loops. This usually indicates an unexamined bias against AI rather than a coherent theory of mind.
  *   **3C + 6A:** Claiming frogs have no representations (Enactivism) but human brains do (Realism) is the "Hard Problem" boundary. It's stable only if you posit language as the magic threshold (Radical Enactivism), otherwise it looks like special pleading.

  **Indistinguishable Positions**
  *   **Dennett vs. Pragmatic Eliminativism:** If someone answers **B** on everything, they look like a Dennettian. If someone answers **C** on everything but *uses* intentional language anyway, they look like an Eliminativist. In practice, these two behave identically in an AI lab: both will write "the model wants" in eval reports because it works, differing only on metaphysical bedtime stories.
  *   **Searle vs. Teleosemantics on Biology:** Both will answer **A** on the Frog and Phantom Limb cases. They only diverge on artifacts (Thermostat/Chatbot). If your quiz taker skips the artifact cases, you cannot distinguish biological intrinsic intentionality from biological teleofunction.

  **Empty Corners of the Space**
  *   **The Inverted Searle (Thermostats Yes, Brains No):** Almost no one claims thermostats have *intrinsic* intentionality while humans do not. This corner is empty because it violates every intuition about complexity and biology.
  *   **AI Exceptionalism (Spam Filter Yes, Frog No):** Claiming a spam classifier has real content but a frog does not is theoretically possible (e.g., some functionalists), but practically empty. Evolutionary history usually trumps silicon architecture in intuition pumps.
  *   **Natural Sign Eliminativism (Trees Yes, Brains No):** Claiming tree rings carry meaning (2A) but brains do not (6C) is incoherent. If non-biological structures can have natural meaning, biological structures almost certainly can. This corner is empty because it denies the very substrate (biology) that usually grounds the realism about natural signs.

  **Recommendation for the Workshop**
  If your team splits on **Case 1 (Slug Sensor)** and **Case 8 (Thermostat)**, you have a Searle vs. Dennett fight. If they split on **Case 3 (Frog)** and **Case 6 (Phantom Limb)**, you have a Realist vs. Enactivist fight. If everyone answers **C** on the Chatbot but **A** on the Frog, you have a consensus on biological exceptionality that will make writing eval reports annoying but philosophically consistent.
