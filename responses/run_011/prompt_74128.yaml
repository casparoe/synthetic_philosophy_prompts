  ### The Case: The Median-Staple Shopper

  **Setting:** A weekly farmer's market selling three staples: Rice ($x_1$), Beans ($x_2$), and Corn ($x_3$).
  **Agent:** A household shopper with a fixed weekly food budget of $33.
  **Decision Rule:** "I need 10 units of food to get through the week. I always buy a baseline of 3 units of each staple (9 units total). I spend the remaining budget on exactly one extra unit of whichever staple is the *median-priced* item that week. I don't buy the cheapest (it might be low quality) and I don't buy the most expensive (it's a luxury)."

  This rule is stable, articulable, and context-dependent. It does not rely on shifting tastes; the preference for the "middle" option is a constant heuristic applied to rotating price structures.

  **The Data:**
  Prices rotate cyclically across three weeks. Quantities adjust according to the rule. Budget is exhausted every time.

  *   **Observation 1:**
      *   Prices $p^1 = (2, 3, 5)$. (Rice cheap, Beans median, Corn expensive).
      *   Choice $x^1 = (3, 4, 3)$. (Extra unit on Beans).
      *   Expenditure: $2(3) + 3(4) + 5(3) = 6 + 12 + 15 = 33$.
  *   **Observation 2:**
      *   Prices $p^2 = (5, 2, 3)$. (Rice expensive, Beans cheap, Corn median).
      *   Choice $x^2 = (3, 3, 4)$. (Extra unit on Corn).
      *   Expenditure: $5(3) + 2(3) + 3(4) = 15 + 6 + 12 = 33$.
  *   **Observation 3:**
      *   Prices $p^3 = (3, 5, 2)$. (Rice median, Beans expensive, Corn cheap).
      *   Choice $x^3 = (4, 3, 3)$. (Extra unit on Rice).
      *   Expenditure: $3(4) + 5(3) + 2(3) = 12 + 15 + 6 = 33$.

  ---

  ### Verification: WARP Holds, GARP Fails

  **1. Weak Axiom of Revealed Preference (WARP)**
  *Definition:* For any distinct pair $i, j$, if $x^j$ is affordable at prices $p^i$ (i.e., $p^i \cdot x^j \le p^i \cdot x^i$) and $x^j \neq x^i$, then $x^i$ must *not* be affordable at prices $p^j$ (i.e., $p^j \cdot x^i > p^j \cdot x^j$).

  *   **Pair (1, 2):**
      *   Cost of $x^2$ at $p^1$: $2(3) + 3(3) + 5(4) = 6 + 9 + 20 = 35$.
      *   $35 > 33$. $x^2$ was **not** affordable at Obs 1. (WARP condition vacuously true for this direction).
      *   Cost of $x^1$ at $p^2$: $5(3) + 2(4) + 3(3) = 15 + 8 + 9 = 32$.
      *   $32 \le 33$. $x^1$ **was** affordable at Obs 2. She chose $x^2$.
      *   Check reverse: Is $x^2$ affordable at Obs 1? No (calculated above, 35).
      *   **Result:** WARP satisfied. ($x^2$ is directly revealed preferred to $x^1$).

  *   **Pair (2, 3):**
      *   Cost of $x^3$ at $p^2$: $5(4) + 2(3) + 3(3) = 20 + 6 + 9 = 35$.
      *   $35 > 33$. $x^3$ was **not** affordable at Obs 2.
      *   Cost of $x^2$ at $p^3$: $3(3) + 5(3) + 2(4) = 9 + 15 + 8 = 32$.
      *   $32 \le 33$. $x^2$ **was** affordable at Obs 3. She chose $x^3$.
      *   Check reverse: Is $x^3$ affordable at Obs 2? No.
      *   **Result:** WARP satisfied. ($x^3$ is directly revealed preferred to $x^2$).

  *   **Pair (3, 1):**
      *   Cost of $x^1$ at $p^3$: $3(3) + 5(4) + 2(3) = 9 + 20 + 6 = 35$.
      *   $35 > 33$. $x^1$ was **not** affordable at Obs 3.
      *   Cost of $x^3$ at $p^1$: $2(4) + 3(3) + 5(3) = 8 + 9 + 15 = 32$.
      *   $32 \le 33$. $x^3$ **was** affordable at Obs 1. She chose $x^1$.
      *   Check reverse: Is $x^1$ affordable at Obs 3? No.
      *   **Result:** WARP satisfied. ($x^1$ is directly revealed preferred to $x^3$).

  **Conclusion on WARP:** No pair of observations shows a direct contradiction. She never chooses $A$ when $B$ is available and then chooses $B$ when $A$ is available.

  **2. Generalized Axiom of Revealed Preference (GARP)**
  *Definition:* There must be no chain of revealed preferences $x^a R x^b R \dots R x^k$ such that $x^k P x^a$ (where $R$ is weak revealed preference and $P$ is strict).

  *   From Pair (1, 2): $x^1$ affordable at 2, chose $x^2 \implies x^2 P x^1$.
  *   From Pair (2, 3): $x^2$ affordable at 3, chose $x^3 \implies x^3 P x^2$.
  *   From Pair (3, 1): $x^3$ affordable at 1, chose $x^1 \implies x^1 P x^3$.

  *   **The Cycle:** $x^1 P x^3 P x^2 P x^1$.
  *   This is a strict revealed preference cycle. No utility function $U(x)$ can exist such that $U(x^1) > U(x^3) > U(x^2) > U(x^1)$.
  *   **Result:** GARP Violated.

  ---

  ### Three Readings of "Utility"

  **1. The Operationalist Reading (Samuelson)**
  Utility is merely a label for consistent choice behavior. There is no mental state; there is only the mapping from prices to quantities.
  *   *Verdict:* This reading fractures. If "consistency" means passing the pairwise check (WARP), she is rational. If "consistency" means passing the global check (GARP), she is irrational. The Operationalist claims utility is *nothing over and above* the data, but the data here supports two contradictory verdicts depending on which mathematical consistency test you apply. The Operationalist cannot appeal to "maximization" to decide, because that is the very concept under scrutiny. They are forced to stipulate which axiom defines "choice consistency," revealing that "Utility" is not simply the data, but a theoretical interpretation of the data's structure.

  **2. The Representation-Theoretic Reading**
  Utility is a theoretical construct that exists if and only if the choice data can be mapped to a function $U: \mathbb{R}^n \to \mathbb{R}$ that is maximized subject to budget constraints.
  *   *Verdict:* She does not have a utility function. The cycle $1 \to 3 \to 2 \to 1$ makes it logically impossible to assign ordinal values to these bundles. On this reading, she is formally irrational. The failure is not in her head, but in the logical relation between her choices across time. This reading saves the definition of utility by sacrificing the claim that she is a valid subject of standard economic modeling.

  **3. The Welfare Reading**
  Utility is a measure of how well the agent's life is going from the inside; it tracks well-being or satisfaction.
  *   *Verdict:* She is perfectly rational and content. Her rule ("baseline variety plus a treat on the median option") is stable and achieves her goal of balanced nutrition without extravagance. She is not confused about prices; she knows exactly why she bought Corn in week 2 and Rice in week 3. The failure of GARP does not indicate a failure of welfare; it indicates that her welfare depends on the *context* of prices (the ranking of goods), not just the absolute bundle. She is maximizing a stable objective, but that objective is not representable as a function of bundles alone.

  **The Divergence:**
  The Operationalist and Representation-Theoretic readings are often presented as the same doctrine: "To have utility just is to choose consistently." This case proves they are not. The Operationalist (looking at pairwise data) can claim she is consistent. The Representation-Theorist (looking at global data) claims she is not. Since the choice data is identical in both views, the divergence shows that "Utility" in the representation sense is a stronger theoretical claim than "Utility" in the operational sense. The Operationalist owes an account of why pairwise consistency should count as "having a utility" when it fails to generate a ranking.

  **Worst Shape:** The **Operationalist** is in the worst shape. Their core promise was to eliminate unobservable theoretical constructs (like utility functions) in favor of pure observation (choice). But here, pure observation (the dataset) underdetermines the verdict. To say she "has utility," the Operationalist must secretly import the Representation-Theoretic requirement (GARP) or arbitrarily privilege WARP. If they privilege WARP, they admit utility doesn't guarantee transitivity. If they privilege GARP, they admit utility is a global theoretical property, not a local observable one.

  ---

  ### Diagnostics

  **1. The Critical Inequality**
  The cycle is driven by the strict affordability gaps. Specifically, look at Observation 1:
  $$p^1 \cdot x^3 = 32 < 33 = p^1 \cdot x^1$$
  This strict inequality ($<$) establishes the strict revealed preference link $x^1 P x^3$. If this expenditure were exactly 33, the link would be weak ($R$). While a weak cycle violates SARP, GARP is technically violated only if there is a strict link in the return chain. Here, *all* links are strict ($32 < 33$). The "bite" comes from the fact that she *could* have bought the other bundle with money left over, but chose not to, yet later chooses that other bundle when the first was available.

  **2. Deleting an Observation**
  If you delete Observation 3, the dataset becomes $\{1, 2\}$.
  *   Relation: $x^2 P x^1$.
  *   Cycle: Broken.
  *   Rationalizable? Yes.
  *   *Did the woman change?* No. This highlights that "rationality" in revealed preference theory is a property of the *dataset*, not necessarily the *agent*. By ignoring a week, we can make an irrational agent look rational. This suggests the theory is fragile to sampling; it cannot distinguish between a stable heuristic that generates cycles and a truly random chooser, unless the sample is exhaustive.

  **3. The Two-Good Question**
  Your hunch is right: **You cannot pull this off with two goods.**
  *   *Argument:* With two goods, a budget constraint is a line defined by a single price ratio $p_1/p_2$. If $x^a$ is revealed preferred to $x^b$, then $x^b$ must lie on or below the budget line passing through $x^a$. In two dimensions, if $x^a R x^b$ and $x^b R x^c$, the geometry of intersecting budget lines forces $x^a R x^c$ without contradiction. Specifically, WARP implies the Slutsky substitution matrix is negative semi-definite. In 2D, this condition is sufficient for integrability (the existence of a utility function). In 3D or higher, negative semi-definiteness is necessary but not sufficient for integrability; you need the stronger condition that the matrix is symmetric (which GARP enforces, but WARP does not). Geometrically: In 2D, budget lines cross once. You cannot order three points on a plane such that each is "above" the previous one's budget line without creating a direct pairwise violation.

  ---

  ### Resistance and Cost

  **The Resistance:**
  A defender of "Rational = Has Utility" will argue:
  1.  **Changing Tastes:** "Her utility function changed between weeks."
  2.  **Commodity Re-description:** "The goods aren't Rice, Beans, Corn. They are 'Rice-when-median-priced', etc."
  3.  **Error/Noise:** "The $1 difference ($32 vs $33) is measurement error or rounding; she was actually indifferent."

  **The Cost:**
  The most common defense is **Commodity Re-description** (making the goods context-specific).
  *   *Cost to the Program:* This destroys the Samuelson program's claim to empirical content. If every time a cycle appears we redefine the goods to break the cycle, the theory becomes tautological. It says: "Agents maximize utility. If they cycle, they weren't choosing the same goods. If they weren't choosing the same goods, they didn't cycle."
  *   *Operationalist Betrayal:* The Samuelson program began by insisting utility is nothing over and above observable choice of *physical* bundles. By retreating to "context-dependent goods," the economist admits that the *description* of the bundle depends on a theoretical assumption about what the agent cares about (prices vs. physical traits). This concedes that we cannot identify "choice" without first assuming a "preference structure." The Operationalist wanted to derive preference from choice; this defense derives choice-identity from preference. It saves the theorem by sacrificing the empiricism.
