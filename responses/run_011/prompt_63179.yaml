answer: |-
  The objection that actually sinks this is the clinicians' and lawyers' united worry that grading obligation by continuity leaves vulnerable dementia patients unprotected against exploitation when their current selves diverge from their prior directives.

  **1. The "Protection Gap" Objection (Geriatrician/Health Lawyer)**
  *   **The Question:** "I see families in the hallway every week fighting over whether to sell the house to pay for care because 'Mom isn't Mom anymore.' If you tell them the advance directive is only partially binding because her psychological continuity is degraded, you're handing neglectful sons a philosophical weapon to ignore her prior wishes. How do you protect the patient if the obligation fades?"
  *   **The Reply:** "You're right that the *promissory* obligation fades, but that doesn't mean *all* obligation vanishes. When personal obligation drops below a threshold of protection, state obligation (parens patriae) must pick up the slack. My theory explains why the family feels the conflict—it's not that the AD is void, but that its binding force is now shared with the state's duty to protect the vulnerable current self. We shouldn't prop up a metaphysical fiction to do the work of social safety nets."
  *   **Soft Spot:** Concede that current legal structures don't have this "state pick-up" mechanism ready. You're diagnosing a problem without a ready institutional fix, which leaves patients at risk in the interim.

  **2. The "Is-Ought" Gap (Parfitian Philosopher)**
  *   **The Question:** "You've established that psychological continuity is a matter of degree. But you haven't shown why *normative force* should track that degree. Why isn't obligation binary? Either you made the promise or you didn't. Deriving an 'ought' from a metaphysical 'is' of continuity is the very move Parfit warned against."
  *   **The Reply:** "Obligation isn't a free-floating force; it's a relational standing. The promisee holds standing against the promiser. If the 'promiser' is a relationally connected series of selves, the standing holds only as far as the relation holds. It's not deriving ought from is; it's defining the boundaries of the 'ought' by the boundaries of the 'self' who is subject to it."
  *   **Soft Spot:** This is your theoretical keystone. If they press that "standing" itself should be binary regardless of identity changes, you have no further metaphysical ground. Concede that this relies on a specific view of standing being identity-dependent.

  **3. The "Administrative Nightmare" (Health Lawyer)**
  *   **The Question:** "I draft guardianship orders. I need bright lines. Are you suggesting a judge needs to calculate a percentage of psychological continuity before ruling on a feeding tube? That's not just hard; it's legally unworkable."
  *   **The Reply:** "I'm not proposing courts calculate percentages. I'm saying the current bright-line capacity test is a crude proxy for this underlying reality, and it fails because it pretends the line is sharper than it is. We should interpret capacity assessments as looking for *sufficient* continuity to bind, not just cognitive function. The theory guides interpretation, not the verdict form."
  *   **Soft Spot:** Concede that without a operational metric, the theory remains academic. Lawyers need rules, not gradients.

  **4. The "Moral Distress" Objection (Palliative Care Nurse)**
  *   **The Question:** "You're asking a daughter to do metaphysics while she's grieving. If she has to wonder, 'Is this really my mother making this choice?', you're adding a layer of moral distress to an already impossible situation. Why make their burden heavier?"
  *   **The Reply:** "I'm not adding a burden; I'm explaining the burden they already feel. They feel guilty because they sense the discontinuity. Telling them 'you must obey the AD no matter what' invalidates their lived experience of losing their parent. My view validates their conflict rather than silencing it."
  *   **Soft Spot:** Concede that validation doesn't make the decision easier. Clinicians prioritize reducing distress over metaphysical accuracy.

  **5. The "Reliance Harm" Objection (General/Philosopher)**
  *   **The Question:** "What about the person who relied on the promise? If I planned my retirement based on your promise to pay me, why should my security depend on how much you've changed psychologically? I'm the one who gets hurt."
  *   **The Reply:** "Reliance creates a separate claim, akin to tort or estoppel, which might remain full-strength even if promissory obligation fades. But the specific *moral bond* of promising is between selves. If we conflate reliance damages with promissory obligation, we lose the ability to see why dementia cases feel different than simple breach of contract."
  *   **Soft Spot:** Concede this splits the concept of promising in a way that might not satisfy non-philosophers who see "promise" as one thing.

  **6. The "Category Error" (Neuropsychologist)**
  *   **The Question:** "I evaluate capacity. It's functional: can you understand, appreciate, reason, and choose? You're talking about identity continuity. A patient can be psychologically discontinuous but still have capacity, or vice versa. You're conflating two different clinical tools."
  *   **The Reply:** "Capacity is the legal instrument; continuity is the metaphysical reality the instrument tries to capture. When you say a patient lacks capacity, you're often noting a break in the narrative coherence of their values. I'm arguing we should admit that's what we're actually tracking when we debate ADs."
  *   **Soft Spot:** Concede the correlation isn't perfect. A patient can be continuous but delusional (capacity loss), or discontinuous but lucid (capacity gain).

  **7. The "Threshold" Objection (Philosopher)**
  *   **The Question:** "If obligation is graded, where is the cutoff for enforcement? Is 51% continuity enough to force chemotherapy? 10%? Without a threshold, your gradient is practically useless."
  *   **The Reply:** "Vagueness doesn't invalidate the gradient. We manage sorites problems in law all the time (e.g., 'reasonable doubt'). We set contextual thresholds based on the stakes. Higher stakes require higher continuity. The lack of a universal number doesn't mean the underlying reality isn't graded."
  *   **Soft Spot:** Concede this invites arbitrariness. Lawyers hate "contextual thresholds."

  **8. The "Happy Dementia" Case (Palliative Care)**
  *   **The Question:** "I have a patient who is demented but cheerful, and her AD says 'no life-prolonging treatment.' If continuity is low, her prior self's obligation is weak. Are you saying we should treat her against her prior wishes because her current self is happy?"
  *   **The Reply:** "Yes, potentially. If the current self is sufficiently discontinuous, the prior self's directive loses its absolute veto. We weigh the current self's welfare heavily. The scandal isn't that we ignore the AD; it's that we pretend the AD binds a person who no longer exists in the relevant way."
  *   **Soft Spot:** This is explosive. Concede this undermines the standard bioethics consensus on ADs significantly.

  **Defuse Up Front:**
  You must defuse **Objection 1 (Protection Gap)** and **Objection 2 (Is-Ought Gap)** in the talk.
  *   **Why:** If you don't address the Protection Gap, the clinicians and lawyers will spend the Q&A trying to save patients from your theory rather than listening to it. If you don't address the Is-Ought Gap, the Parfitians will dismantle the foundation before you get to the applications.
  *   **How:** Explicitly state early on: "This theory does not mean we abandon vulnerable patients; it means we shift the burden of protection from the fading self to the state." And: "I am not deriving obligation from continuity directly, but arguing that the *standing to hold* is constitutively dependent on identity."

  **The Single Reply That Must Land:**
  The reply to **Objection 2 (The Normative Gap)** regarding **Standing**.
  *   **Why:** If you cannot convince the room that the *promisee's standing to hold you* is contingent on *your continued identity*, the rest of the paper collapses into a utilitarian calculation about welfare. The Parfitians need to buy that standing is relational and identity-dependent, or the clinicians will revert to "best interest" standards immediately.

  **The "God Forbid" Question:**
  *   **The Question:** "Who measures the continuity? You say it's graded, but in this room, I'm the one who has to sign the chart. What metric do I use tomorrow morning to decide if Mrs. Jones is 40% or 60% bound by her directive?"
  *   **Why it kills you:** There is no metric. Any answer admits the theory is operationally empty.
  *   **Least Bad Deflection:** "We currently use capacity assessments as a proxy. They are blunt instruments. My argument is that we should interpret those assessments as looking for narrative continuity, not just cognitive score, but I acknowledge we lack a precise calculus. We must act on the best available clinical judgment of identity disruption, knowing it's imperfect." (This admits the weakness but pivots to current practice).
