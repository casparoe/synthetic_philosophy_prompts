  # Instructor Notes (For Your Eyes Only)

  **Rationale for the Exercise:**
  *   **Operationalizing $K(H)$:** Since true Kolmogorov complexity is uncomputable, we use compression length as a proxy. By compressing the *source code* of the hypothesis rather than the *data*, we directly measure the description length of the theory, which is the core of Solomonoff's prior ($2^{-K(H)}$).
  *   **The "Reportable Number":** Asking for a correlation coefficient across many files is statistically robust, but asking for the "Percentage Disagreement" on two rival hypotheses forces the student to engage with the specific comparison relevant to theory choice. It makes the "constant" tangible.
  *   **Expected Outcome:** `gzip` and `xz` use different algorithms (LZ77 vs. LZMA), but both exploit redundancy. $H_1$ (the rule) has high algorithmic redundancy in its source structure; $H_2$ (the lookup) does not. Both compressors should find $H_1$ significantly smaller. The *gap* might vary slightly, but the *Percentage Disagreement* should be relatively low, and crucially, if they scale the data up (Question 3), the disagreement should vanish as the gap grows while the constant remains fixed.

  **Addressing the "LLM" Point:**
  You mentioned LLMs in your prompt. In the seminar, you can note that an LLM acts as a compressor by assigning probabilities to tokens. However, for a reproducible afternoon exercise, standard lossless compressors (`gzip`/`xz`) are superior because they yield deterministic bit-counts without requiring API keys or dealing with stochastic generation.

  **Potential Pitfall:**
  Ensure students do not compress the *output* of the scripts (which would be identical for both) but the *scripts themselves*. The complexity of the hypothesis lies in the code, not the prediction (in this specific operationalization of Solomonoff priors).
