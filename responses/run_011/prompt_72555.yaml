answer: |-
  You have isolated a precise and often overlooked structural feature in Scholastic political theology, particularly in Aquinas's *De Regno* (I.6) and the subsequent commentaries (e.g., Cajetan, Suárez). You are correct that standard labels like "necessity" or "self-defense" fail to capture the specific *jurisdictional* logic at play.

  There is no single established term in English moral philosophy that captures this exact carving (a permission triggered *solely* by the absence of the proper agent, agent-neutral, and fragile). The closest legal cousins are *agency of necessity* or *negotiorum gestio*, but as you note, they fail on the conditions of consent and benefit. In Canon Law, there is *suppletory jurisdiction* (*iurisdictio suppletoria*), but this is usually an ecclesiastical fiction applied to sacraments, not a natural right to violence.

  Given the gap, I propose we coin the term **"Suppletory License"** (or *Licentia Suppletoria*), grounded in the descriptive state of a **"Functional Jurisdictional Vacuum."**

  Below is the definition, the carving (how it differs from neighbors), and the resolution of your edge case.

  ### 1. The Concept: Suppletory License

  **Definition:** A *Suppletory License* is a normative permission to perform an act otherwise reserved to a specific office or authority, triggered exclusively by the **functional absence** of that authority. It does not confer the office upon the agent; rather, it allows the agent to execute the *function* of the office temporarily because the function would otherwise go unperformed.

  **The Trigger:** It is not the *harm* that triggers the license (harm exists even when a magistrate is present), but the **vacancy of recourse**. It is a permission constituted by a negative fact: *nemo iudex* (no judge) available.

  ### 2. The Carving: Boundary Conditions

  Here is how the Suppletory License differs from the neighboring concepts you identified:

  | Concept | Trigger Condition | Agent Status | Durability | Why it differs from Suppletory License |
  | :--- | :--- | :--- | :--- | :--- |
  | **Necessity** (*Necessitas*) | **Urgency of Harm.** The act is needed to prevent a greater evil. | Irrelevant. | Lasts as long as the threat lasts. | Necessity justifies the *act* based on consequences. Suppletory License justifies the *agent* based on structural absence. One can have necessity without a vacuum (e.g., breaking a window to save a child when police are present). |
  | **Agency of Necessity** | **Presumed Consent.** Acting on behalf of an absent principal to protect their interest. | **Fiduciary.** Must act *for* the principal. | Lasts until ratification or rejection. | Requires acting *in the interest* of the absent authority. Tyrannicide is not acting *for* the tyrant or the absent king, but *in place of* the public justice they fail to provide. |
  | **Natural Law Enforcement** (Locke) | **State of Nature.** No common judge exists *at all*. | **Universal.** Everyone is an executor. | Permanent until civil society forms. | This is a pre-political right. Suppletory License is *intra-political*; it acknowledges the authority exists *de jure* but is inert *de facto*. |
  | **Excuse** (Duress) | **Psychological/Coercive.** The agent could not be expected to do otherwise. | **Exculpated.** The act remains wrong. | N/A. | An excuse admits wrongdoing but removes blame. Suppletory License renders the act **licit**. It is a justification, not an excuse. |
  | **Suppletory License** | **Jurisdictional Vacuum.** No competent authority is *available*. | **Neutral.** Whoever is present. | **Fragile.** Evaporates if authority appears. | The permission exists *only* because the proper agent is functionally absent. It is a "stopgap" justice. |

  ### 3. The Edge Case: The Unreachable Superior

  You ask: *How should it treat the case where a superior exists but cannot be reached in time — is the vacuum still there, and does the permission survive it?*

  **The Test: Functional Impotence**
  The vacuum is not defined by the *existence* of the superior, but by their **effective capacity to intervene**.

  *   **Scenario A (The Vacuum Holds):** The superior exists but is geographically distant or communication is severed, such that they cannot prevent the harm *in the relevant timeframe*.
      *   *Verdict:* The Suppletory License **survives**. The authority is *de jure* present but *de facto* absent. The "functional vacancy" is real.
  *   **Scenario B (The Vacuum Closes):** The superior is slow, but their intervention is imminent and sufficient to mitigate the harm without private violence.
      *   *Verdict:* The Suppletory License **evaporates**. To act here is not to fill a vacuum, but to usurp a functioning (if sluggish) process.

  **The Temporal Boundary:**
  The permission is bounded by the **window of impotence**. It opens the moment it becomes clear the superior cannot act in time, and it closes the moment the superior *can* act (or the harm is already done).

  ### 4. Why "Suppletory"?

  I chose "Suppletory" (from Latin *supplere*, to fill up) for three reasons:

  1.  **It implies incompleteness:** It acknowledges that the agent does not possess the power inherently; they are merely filling a gap.
  2.  **It implies temporariness:** Suppletory laws or powers cease when the primary source is restored.
  3.  **It distinguishes from "Subsidiary":** Subsidiarity suggests a layered hierarchy where the lower body *should* act if the upper can't. Suppletory License is more radical: it allows a *private* individual (who has no place in the hierarchy) to act solely because the hierarchy has broken.

  ### 5. Application to Your Aquinas Reading

  This concept clarifies why Aquinas (and the Scholastics following him) insists that a private person cannot kill a tyrant *if* there is a public mechanism available. It is not that the private person lacks the *strength*, but that they lack the *jurisdictional occasion*.

  *   **Agent Neutrality:** Because the license attaches to the *vacuum* and not the *person*, it does not matter if the killer is virtuous or vicious (though their intent matters for sin). The "least suitable candidate" may act because the power has temporarily become *res nullius* (nobody's property) floating in the public sphere.
  *   **Fragility:** The moment a competent authority appears (e.g., a parliament convenes, a higher king intervenes), the vacuum is filled. The private person immediately reverts to being a private person, and further violence becomes murder.

  **Summary Term:**
  The concept is a **Suppletory License** arising from a **Functional Jurisdictional Vacuum**. It is a permission to act *in locum magistri* (in the place of the master) solely because the master is functionally absent.
